<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Portal Snack Rush: Dimension C-137 Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #090b18;
        --bg-mid: #201044;
        --panel: rgba(16, 24, 42, 0.86);
        --panel-border: #6be7ff;
        --panel-shadow: #050711;
        --portal-green: #5cff6f;
        --portal-lime: #b8ff72;
        --portal-cyan: #6be7ff;
        --toxic-violet: #8b5cf6;
        --accent-hot: #ff7a18;
        --accent-gold: #ffd85e;
        --danger: #ff4f72;
        --text-main: #f7fff2;
        --text-dark: #111629;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 18%, rgba(92, 255, 111, 0.16), transparent 24%),
            radial-gradient(circle at top, rgba(107, 231, 255, 0.18) 0%, rgba(139, 92, 246, 0.18) 28%, transparent 46%),
            linear-gradient(180deg, #090b18 0%, #201044 50%, #070914 100%);
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 0.03em;
        user-select: none;
        -webkit-user-select: none;
        color: var(--text-main);
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 18%, rgba(255, 216, 94, 0.12), transparent 18%),
            radial-gradient(circle at 80% 12%, rgba(107, 231, 255, 0.14), transparent 16%),
            repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px),
            linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.26) 100%);
        opacity: 0.95;
    }
    body::after {
        content: "";
        position: fixed;
        inset: -20%;
        pointer-events: none;
        background:
            conic-gradient(from 0deg at 50% 38%, transparent 0deg, rgba(92,255,111,0.08) 38deg, transparent 72deg, rgba(107,231,255,0.06) 110deg, transparent 170deg, rgba(184,255,114,0.08) 220deg, transparent 290deg);
        animation: portalAtmosphere 18s linear infinite;
        mix-blend-mode: screen;
    }
    @keyframes portalAtmosphere {
        to { transform: rotate(1turn); }
    }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    /* Minimal local utility subset keeps layout stable without relying on a workspace-external Tailwind script. */
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
    .flex { display: flex; }
    .hidden { display: none !important; }
    .block { display: block; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-start { align-items: flex-start; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .p-1 { padding: 0.25rem; }
    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .w-20 { width: 5rem; }
    .h-20 { height: 5rem; }
    .max-w-sm { max-width: 24rem; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-base { font-size: 1rem; line-height: 1.5rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .font-semibold { font-weight: 600; }
    .overflow-hidden { overflow: hidden; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-2xl { border-radius: 1rem; }
    .object-cover { object-fit: cover; }
    .pointer-events-none { pointer-events: none; }
    .bg-black\/55 { background-color: rgba(0, 0, 0, 0.55); }
    .text-white\/90 { color: rgba(255, 255, 255, 0.9); }
    .right-3 { right: 0.75rem; }
    .top-24 { top: 6rem; }
    .animate-bounce-in { animation: bounceIn 0.28s ease-out; }
    @keyframes bounceIn {
        from { transform: scale(0.96) translateY(8px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
    }
    @media (min-width: 640px) {
        .sm\:h-24 { height: 6rem; }
        .sm\:w-24 { width: 6rem; }
        .sm\:text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
    }
    .glass {
        background: linear-gradient(180deg, rgba(46, 27, 92, 0.92), rgba(23, 12, 48, 0.92));
        backdrop-filter: blur(12px);
        border: 2px solid rgba(107, 231, 255, 0.9);
        box-shadow: 0 8px 0 var(--panel-shadow), 0 0 18px rgba(92, 255, 111, 0.16), inset 0 0 18px rgba(107, 231, 255, 0.08);
        border-radius: 18px;
    }
    .hud-pill {
        position: relative;
        overflow: hidden;
    }
    .hud-pill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 48%);
        pointer-events: none;
    }
    .hud-stat {
        min-width: 98px;
        color: var(--text-main);
        text-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }
    .hud-label,
    .hint-chip {
        font-family: 'Bangers', cursive;
        letter-spacing: 0.08em;
    }
    .hud-label {
        display: block;
        font-size: 0.58rem;
        color: #9befff;
        margin-bottom: 0.4rem;
    }
    .hud-value {
        display: block;
        font-size: clamp(1rem, 2.6vw, 1.65rem);
        font-weight: 600;
        line-height: 1;
    }
    .hint-card {
        max-width: min(42vw, 360px);
        color: #e8e5ff;
        line-height: 1.15;
    }
    .hint-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.58rem;
        color: var(--accent-gold);
        margin-bottom: 0.55rem;
    }
    .hint-copy {
        font-size: clamp(0.8rem, 1.95vw, 1rem);
        font-weight: 600;
    }
    .btn-retro {
        background: linear-gradient(180deg, #ff9340, var(--accent-hot));
        color: white;
        border: 3px solid #fff2c8;
        box-shadow: 0 6px 0 #7c2500, 0 0 18px rgba(255, 122, 24, 0.34);
        transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
        font-family: 'Bangers', cursive;
        letter-spacing: 0.06em;
    }
    .btn-retro:active { transform: translate(2px, 2px); box-shadow: 0 3px 0 #7c2500, 0 0 10px rgba(255, 122, 24, 0.34); filter: brightness(1.05); }
    #ui-layer { pointer-events: none; }
    #hud,
    #reaction-stack,
    #success-reaction,
    #fail-reaction,
    #game-over-screen,
    #restart-btn { pointer-events: auto; }
    .marquee-title {
        font-family: 'Bangers', cursive;
        color: var(--accent-gold);
        text-shadow: 0 0 12px rgba(255, 216, 94, 0.35), 0 3px 0 rgba(0,0,0,0.4);
    }
    .game-over-panel {
        max-height: min(90vh, 520px);
    }
    @media (max-width: 720px) {
        #ui-layer { padding: 0.75rem; }
        #hud { gap: 0.5rem; align-items: stretch; }
        .hud-stat { min-width: 0; padding: 0.7rem 0.8rem; }
        .hint-card { max-width: none; padding: 0.7rem 0.8rem; }
        .hint-copy { font-size: 0.76rem; }
    }
    @media (max-width: 560px) {
        #hud {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-areas:
                "score lives"
                "hint hint";
        }
        #score-card { grid-area: score; }
        #lives-card { grid-area: lives; }
        #hint-card { grid-area: hint; }
        .hud-label { font-size: 0.5rem; }
        .hud-value { font-size: 0.92rem; }
        .hint-chip { font-size: 0.5rem; }
        .hint-copy { font-size: 0.72rem; }
    }
</style>
</head>
<body>

<!-- Asset Declaration -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: gameplay/ui/results mapped via catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
    <audio id="bgm_gameover" data-editable="audio" data-label="Game Over Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect Sound" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_correct" data-editable="audio" data-label="Correct Input" preload="none"></audio>
    <audio id="sfx_wrong" data-editable="audio" data-label="Wrong Input" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>
    <audio id="sfx_warning" data-editable="audio" data-label="Warning Sound" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
    <audio id="sfx_gameover" data-editable="audio" data-label="Game Over Stinger" preload="none"></audio>
    <audio id="sfx_restart" data-editable="audio" data-label="Restart Sound" preload="none"></audio>
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "baseSpeed": { "type": "number", "label": "Game Speed", "value": 1.0, "min": 0.5, "max": 2.0 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#FFD700" }
}
</script>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
        <!-- [agent-note][stage3] resolved-gif: success/fail reactions use compact catalog overlays off the main play lane -->
        <div id="reaction-stack" class="absolute right-3 top-24 z-40 flex flex-col items-end gap-2 pointer-events-none">
            <div id="success-reaction" class="glass hidden overflow-hidden rounded-2xl p-1">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Success reaction" class="block h-20 w-20 sm:h-24 sm:w-24 object-cover rounded-xl">
            </div>
            <div id="fail-reaction" class="glass hidden overflow-hidden rounded-2xl p-1">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction" class="block h-20 w-20 sm:h-24 sm:w-24 object-cover rounded-xl">
            </div>
        </div>
        <!-- HUD -->
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled without moving core hierarchy -->
        <div id="hud" class="flex justify-between items-start w-full gap-3">
            <div id="score-card" class="glass hud-pill hud-stat px-4 py-3">
                <span class="hud-label">PORTAL TICKETS</span>
                <span id="score-display" class="hud-value">0</span>
            </div>
            <div id="hint-card" class="glass hint-card px-4 py-3 text-center">
                <div class="hint-chip"><span>◎</span><span>DIMENSION C-137 COUNTER</span></div>
                <div class="hint-copy">Tap the front portal request before stability melts down.</div>
            </div>
            <div id="lives-card" class="glass hud-pill hud-stat px-4 py-3 text-right">
                <span class="hud-label">PARADOX STRIKES</span>
                <span id="lives-display" class="hud-value" style="color: var(--danger);">3</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center bg-black/55 hidden">
            <div class="glass game-over-panel p-6 text-center max-w-sm w-full animate-bounce-in">
                <div class="hint-chip justify-center mb-3"><span>◎</span><span>SHIFT REPORT</span></div>
                <h1 class="marquee-title text-2xl sm:text-3xl mb-3">PORTAL CLOSED</h1>
                <p class="text-lg mb-6 text-white/90 font-semibold">Stabilized <span id="final-score">0</span> tickets</p>
                <button id="restart-btn" class="btn-retro px-6 py-4 text-base w-full rounded-xl">REOPEN PORTAL</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- §0 System Invariants & Globals ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let lastTime = 0;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER
let score = 0;
let lives = 3;
let gameTime = 0;

// Config
let gameConfig = { baseSpeed: 1.0, themeColor: "#FFD700" };

// Audio System
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const audioBuffers = {};
const audioEls = {};
const bgmEl = document.getElementById('bgm_main');
const bgmGameOverEl = document.getElementById('bgm_gameover');
const successReactionEl = document.getElementById('success-reaction');
const failReactionEl = document.getElementById('fail-reaction');
let audioUnlocked = false;
let lastWarningAt = 0;
let reactionTimer = null;

// Entities
let customers = [];
let particles = [];
let buttons = [];
const FOOD_TYPES = ['BURGER', 'CHIPS', 'SLUSHIE', 'FRIEDRICH'];
const FOOD_COLORS = { 'BURGER': '#FF8B5C', 'CHIPS': '#FFD85E', 'SLUSHIE': '#6BE7FF', 'FRIEDRICH': '#C78645' };
const FOOD_EMOJIS = { 'BURGER': '🍔', 'CHIPS': '🍟', 'SLUSHIE': '🥤', 'FRIEDRICH': '🍗' };
// [agent-note][world-design-superprompt] role: visuals | intent: preserve four matching types while rendering them as portal-counter requests
const FOOD_LABELS = { 'BURGER': 'PORTAL BURGER', 'CHIPS': 'MEGA FRIES', 'SLUSHIE': 'SERUM SLUSH', 'FRIEDRICH': 'SPACE DRUM' };
const DIMENSION_PHASES = [
    { name: 'GARAGE', bgTop: '#090b18', bgMid: '#201044', accent: '#5cff6f', accent2: '#6be7ff', prop: 'cables' },
    { name: 'CITADEL', bgTop: '#071a2a', bgMid: '#102b54', accent: '#6be7ff', accent2: '#ffd85e', prop: 'windows' },
    { name: 'CRONENBERG', bgTop: '#19091b', bgMid: '#3a1243', accent: '#b8ff72', accent2: '#ff4f72', prop: 'goo' },
    { name: 'CABLE', bgTop: '#06101e', bgMid: '#201044', accent: '#6be7ff', accent2: '#8b5cf6', prop: 'scanlines' },
    { name: 'COUNCIL', bgTop: '#040611', bgMid: '#1a0b2f', accent: '#5cff6f', accent2: '#ff4f72', prop: 'council' }
];
function getVisualPhase() {
    return DIMENSION_PHASES[Math.min(DIMENSION_PHASES.length - 1, Math.floor(score / 50))];
}

// --- §1 Initialization & Lifecycle ---

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            Object.keys(defs).forEach(k => gameConfig[k] = defs[k].value);
        } catch(e) { console.error("Config parse error", e); }
    }
}

async function initAudio() {
    ['bgm_main', 'bgm_gameover', 'sfx_collect', 'sfx_correct', 'sfx_wrong', 'sfx_warning', 'sfx_gameover', 'sfx_restart']
        .forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            audioEls[id] = el;
            if (id.startsWith('bgm_')) {
                el.volume = 0.2;
            } else if (id === 'sfx_warning') {
                el.volume = 0.35;
            } else if (id === 'sfx_gameover') {
                el.volume = 0.45;
            } else {
                el.volume = 0.4;
            }
        });

    // Keep remote catalog audio on HTMLMediaElement playback to avoid CORS-prone WebAudio prefetches.
    // If a clip cannot play, playSfx still falls back to synthesized UI tones after user gesture.
    if (!audioCtx) return;
}

function initGame() {
    score = 0;
    lives = 3;
    gameTime = 0;
    customers = [];
    particles = [];
    
    updateHUD();
    
    // Spawn initial customers
    for(let i=0; i<3; i++) {
        spawnCustomer(-i * 120 - 100);
    }

    // Create Buttons
    const btnH = 100;
    const pad = 10;
    const btnW = (cw - (pad * 5)) / 4;
    const y = ch - btnH - 40;
    
    buttons = FOOD_TYPES.map((type, i) => ({
        type,
        x: pad + i * (btnW + pad),
        y: y,
        w: btnW,
        h: btnH,
        color: FOOD_COLORS[type],
        pressed: 0
    }));

    setState('PLAYING');
}

function resize(width, height) {
    cw = width;
    ch = height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (initialized) {
        // Re-layout buttons
        const btnH = Math.min(100, ch * 0.15);
        const pad = 10;
        const btnW = (cw - (pad * 5)) / 4;
        const y = ch - btnH - 40;
        buttons.forEach((b, i) => {
            b.x = pad + i * (btnW + pad);
            b.y = y;
            b.w = btnW;
            b.h = btnH;
        });
    }
}

// --- §2 Core Logic ---

function spawnCustomer(yOffset = 0) {
    const type = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
    customers.push({
        type,
        x: cw / 2,
        y: -100 + yOffset,
        targetY: 150 + (customers.length * 90), // Stack them
        vx: 0,
        vy: 0,
        scale: 0,
        state: 'ENTERING', // ENTERING, WAITING, LEAVING
        patience: 100
    });
}

function update(dt) {
    if (gameState !== 'PLAYING') return;
    
    gameTime += dt;
    
    // Difficulty ramp
    const speedMult = 1 + Math.min(score / 50, 1.5) * gameConfig.baseSpeed;
    
    // Update Customers
    // Queue logic: customers move towards target positions
    customers.forEach((c, i) => {
        // Target Y is based on index in queue
        const targetY = 150 + (i * 100);
        
        // Move towards target
        const dy = targetY - c.y;
        c.y += dy * 5 * dt;
        
        // Horizontal sway
        c.x = cw/2 + Math.sin(gameTime * 2 + i) * 10;
        
        // Scale in
        if (c.scale < 1) c.scale += 5 * dt;
        
        // Patience decay only for the front customer
        if (i === 0 && c.y > 100) {
            c.patience -= 15 * dt * speedMult;
            if (c.patience <= 0) {
                handleMiss('timeout');
                // Remove this customer
                customers.shift();
                playSfx('sfx_wrong');
                spawnCustomer(-100);
            }
        }
    });
    
    // Ensure queue is full
    if (customers.length < 5) {
        spawnCustomer(-100);
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Button animations
    buttons.forEach(b => {
        if (b.pressed > 0) b.pressed -= dt * 5;
    });
}

function handleInput(type) {
    if (gameState !== 'PLAYING') return;
    
    // Find button to animate
    const btn = buttons.find(b => b.type === type);
    if (btn) btn.pressed = 1;

    const frontCustomer = customers[0];
    if (!frontCustomer) return;

    if (frontCustomer.type === type) {
        // Correct!
        score += 10;
        updateHUD();
        playSfx('sfx_collect');
        playSfx('sfx_correct');
        vibrate('light');
        createParticles(frontCustomer.x, frontCustomer.y, FOOD_COLORS[type]);
        showReaction('success');
        
        // Remove customer
        customers.shift();
        spawnCustomer(-100);
    } else {
        // Wrong!
        handleMiss('wrong');
    }
}

function handleMiss(reason = 'wrong') {
    lives--;
    updateHUD();
    vibrate('heavy');
    shakeScreen();
    playSfx(reason === 'timeout' ? 'sfx_warning' : 'sfx_wrong');
    showReaction('fail');

    if (lives <= 0) {
        setState('GAMEOVER');
    }
}

function createParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 1.0,
            size: Math.random() * 5 + 2
        });
    }
}

// --- §3 Rendering ---

function drawPortalRing(cx, cy, radius, phase, color, alpha = 1) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(gameTime * 0.45 + phase);
    ctx.globalAlpha = alpha;
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, radius + i * 15, phase + i * 0.7, phase + Math.PI * 1.25 + i * 0.7);
        ctx.strokeStyle = i % 2 ? 'rgba(107,231,255,0.58)' : color;
        ctx.lineWidth = Math.max(2, 8 - i * 2);
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    ctx.restore();
}

function drawBackgroundProps(phase) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    const topInset = Math.min(116, ch * 0.18);
    if (phase.prop === 'windows') {
        for (let x = 18; x < cw; x += 54) {
            for (let y = topInset; y < ch - 180; y += 56) {
                ctx.fillStyle = 'rgba(107,231,255,0.10)';
                ctx.strokeStyle = 'rgba(107,231,255,0.24)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(x, y + Math.sin(gameTime + x) * 2, 28, 34, 5);
                ctx.fill();
                ctx.stroke();
            }
        }
    } else if (phase.prop === 'goo') {
        for (let i = 0; i < 12; i++) {
            const x = ((i * 83 + gameTime * 18) % (cw + 90)) - 45;
            const y = topInset + ((i * 67) % Math.max(1, ch - 280));
            ctx.fillStyle = i % 2 ? 'rgba(255,79,114,0.12)' : 'rgba(184,255,114,0.12)';
            ctx.beginPath();
            ctx.ellipse(x, y, 18 + (i % 3) * 7, 10 + (i % 4) * 4, Math.sin(gameTime + i), 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (phase.prop === 'scanlines') {
        ctx.globalAlpha = 0.24;
        ctx.fillStyle = 'rgba(107,231,255,0.18)';
        for (let y = topInset + ((gameTime * 42) % 18); y < ch - 150; y += 18) {
            ctx.fillRect(0, y, cw, 2);
        }
        for (let i = 0; i < 5; i++) {
            ctx.strokeStyle = i % 2 ? 'rgba(139,92,246,0.28)' : 'rgba(107,231,255,0.25)';
            ctx.strokeRect(14 + i * 41, topInset + i * 27, 64, 32);
        }
    } else if (phase.prop === 'council') {
        for (let i = 0; i < 7; i++) {
            const x = (i + 0.5) * cw / 7;
            const y = topInset + 32 + (i % 2) * 20;
            ctx.fillStyle = 'rgba(3,5,14,0.42)';
            ctx.beginPath();
            ctx.arc(x, y, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x - 10, y + 10, 20, 34);
            ctx.strokeStyle = 'rgba(92,255,111,0.18)';
            ctx.beginPath();
            ctx.moveTo(x - 17, y - 12);
            ctx.lineTo(x - 5, y - 24);
            ctx.lineTo(x, y - 12);
            ctx.lineTo(x + 6, y - 26);
            ctx.lineTo(x + 17, y - 12);
            ctx.stroke();
        }
    } else {
        for (let i = 0; i < 6; i++) {
            ctx.strokeStyle = i % 2 ? 'rgba(107,231,255,0.16)' : 'rgba(92,255,111,0.16)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const y = topInset + 25 + i * 42;
            ctx.bezierCurveTo(-30, y, cw * 0.25, y + Math.sin(gameTime + i) * 24, cw * 0.78, y - 18, cw + 30, y + 10);
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawPortalGarageBackground(phase) {
    const backdrop = ctx.createLinearGradient(0, 0, 0, ch);
    backdrop.addColorStop(0, phase.bgTop);
    backdrop.addColorStop(0.52, phase.bgMid);
    backdrop.addColorStop(1, '#050711');
    ctx.fillStyle = backdrop;
    ctx.fillRect(0, 0, cw, ch);

    const portalGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.40, 8, cw * 0.5, ch * 0.40, Math.max(cw, ch) * 0.46);
    portalGlow.addColorStop(0, `${phase.accent}7a`);
    portalGlow.addColorStop(0.18, 'rgba(92,255,111,0.20)');
    portalGlow.addColorStop(0.46, 'rgba(107,231,255,0.09)');
    portalGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = portalGlow;
    ctx.fillRect(0, 0, cw, ch);

    drawBackgroundProps(phase);

    ctx.save();
    ctx.globalAlpha = 0.44;
    drawPortalRing(cw * 0.5, ch * 0.38, Math.min(cw, ch) * 0.16, 0, `${phase.accent}cc`, 0.82);
    drawPortalRing(cw * 0.5, ch * 0.38, Math.min(cw, ch) * 0.25, Math.PI * 0.8, `${phase.accent2}99`, 0.42);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.strokeStyle = phase.accent2;
    ctx.lineWidth = 1;
    const grid = 38;
    const offset = (gameTime * 18) % grid;
    for (let x = (cw % grid) - grid; x < cw + grid; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x - offset, ch - 150);
        ctx.stroke();
    }
    for (let y = Math.min(104, ch * 0.16); y < ch - 150; y += grid) {
        ctx.beginPath();
        ctx.moveTo(0, y + offset * 0.35);
        ctx.lineTo(cw, y + offset * 0.35);
        ctx.stroke();
    }
    ctx.restore();
}

function drawPortalChute(phase) {
    const laneGradient = ctx.createLinearGradient(cw * 0.25, 0, cw * 0.75, 0);
    laneGradient.addColorStop(0, 'rgba(255,255,255,0)');
    laneGradient.addColorStop(0.28, 'rgba(92,255,111,0.12)');
    laneGradient.addColorStop(0.5, 'rgba(107,231,255,0.28)');
    laneGradient.addColorStop(0.72, 'rgba(184,255,114,0.13)');
    laneGradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.moveTo(cw / 2, 0);
    ctx.lineTo(cw / 2, ch - 150);
    ctx.strokeStyle = laneGradient;
    ctx.lineWidth = Math.min(118, cw * 0.32);
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cw / 2, 0);
    ctx.lineTo(cw / 2, ch - 150);
    ctx.strokeStyle = 'rgba(247,255,242,0.34)';
    ctx.lineWidth = 8;
    ctx.setLineDash([18, 16]);
    ctx.lineDashOffset = -(gameTime * 120);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = phase.accent;
    ctx.lineWidth = 2;
    for (let y = 90; y < ch - 172; y += 74) {
        ctx.beginPath();
        ctx.ellipse(cw / 2, y + Math.sin(gameTime * 2 + y) * 4, Math.min(62, cw * 0.18), 12, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();
}

function draw() {
    const phase = getVisualPhase();
    drawPortalGarageBackground(phase);
    drawPortalChute(phase);

    // Draw Customers
    // Draw in reverse order so front is on top
    for(let i=customers.length-1; i>=0; i--) {
        drawCustomer(customers[i], i===0);
    }

    // Draw Buttons
    buttons.forEach(drawButton);

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function drawCustomer(c, isFront) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    
    const haloColor = FOOD_COLORS[c.type];
    if (isFront) {
        drawPortalRing(0, 0, 50 + Math.sin(gameTime * 3) * 3, gameTime, `${haloColor}dd`, 0.58);
    }

    const halo = ctx.createRadialGradient(0, 0, 10, 0, 0, isFront ? 72 : 54);
    halo.addColorStop(0, 'rgba(247,255,242,0.95)');
    halo.addColorStop(0.48, `${haloColor}cc`);
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, isFront ? 66 : 52, 0, Math.PI * 2);
    ctx.fill();

    // Shake if patience low
    if (isFront && c.patience < 30) {
        ctx.translate(Math.random() * 4 - 2, Math.random() * 4 - 2);
    }

    // Alien traveler silhouette.
    ctx.fillStyle = isFront ? '#d8ffd1' : '#a9f3ce';
    ctx.strokeStyle = '#111629';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, 3, 38, 42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    const variant = FOOD_TYPES.indexOf(c.type);
    ctx.strokeStyle = '#111629';
    ctx.lineWidth = 3;
    if (variant === 0) {
        ctx.beginPath(); ctx.moveTo(-18, -32); ctx.lineTo(-28, -48); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(18, -32); ctx.lineTo(28, -48); ctx.stroke();
        ctx.fillStyle = '#b8ff72';
        ctx.beginPath(); ctx.arc(-29, -49, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(29, -49, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (variant === 1) {
        ctx.fillStyle = '#5cff6f';
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 8, -35);
            ctx.lineTo(i * 11, -50 - Math.abs(i) * 4);
            ctx.lineTo(i * 5, -39);
            ctx.fill();
            ctx.stroke();
        }
    } else if (variant === 2) {
        ctx.beginPath(); ctx.moveTo(-30, 18); ctx.quadraticCurveTo(-48, 32, -36, 46); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(30, 18); ctx.quadraticCurveTo(48, 32, 36, 46); ctx.stroke();
    } else {
        ctx.fillStyle = '#8b5cf6';
        ctx.beginPath(); ctx.arc(0, -46, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // Eyes and anxious service-counter expression.
    ctx.fillStyle = '#111629';
    ctx.beginPath(); ctx.ellipse(-13, -6, 7, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13, -6, 7, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7fff2';
    ctx.beginPath(); ctx.arc(-15, -10, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -10, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111629';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 15, 8, 0.15, Math.PI - 0.15); ctx.stroke();

    // Request bubble embedded in the traveler.
    ctx.fillStyle = 'rgba(247,255,242,0.92)';
    ctx.strokeStyle = haloColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(-29, 20, 58, 32, 15);
    ctx.fill();
    ctx.stroke();
    drawFoodIcon(0, 36, 15, c.type);

    // Patience Bar
    if (isFront) {
        ctx.fillStyle = '#111629';
        ctx.beginPath();
        ctx.roundRect(-38, 58, 76, 10, 5);
        ctx.fill();
        const patienceColor = c.patience > 50 ? '#9eff75' : '#ff4f72';
        const patienceFill = ctx.createLinearGradient(-37, 0, 37, 0);
        patienceFill.addColorStop(0, '#ffd85e');
        patienceFill.addColorStop(1, patienceColor);
        ctx.fillStyle = patienceFill;
        ctx.beginPath();
        ctx.roundRect(-37, 59, 74 * (c.patience / 100), 8, 4);
        ctx.fill();
    }
    
    ctx.restore();
}

function drawFoodIcon(x, y, r, type) {
    ctx.save();
    ctx.translate(x, y);
    const color = FOOD_COLORS[type];
    ctx.strokeStyle = '#111629';
    ctx.lineWidth = Math.max(2, r * 0.12);
    
    if (type === 'BURGER') {
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(0, -r * 0.15, r, Math.PI, 0); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#5cff6f';
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath(); ctx.arc(i * r * 0.28, -r * 0.45, r * 0.07, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#351a12'; ctx.beginPath(); ctx.roundRect(-r, -r * 0.05, r * 2, r * 0.32, r * 0.12); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#b8ff72'; ctx.beginPath(); ctx.roundRect(-r * 0.9, r * 0.26, r * 1.8, r * 0.2, r * 0.12); ctx.fill(); ctx.stroke();
        ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(-r, r * 0.48, r * 2, r * 0.28, r * 0.14); ctx.fill(); ctx.stroke();
    } else if (type === 'CHIPS') {
        ctx.fillStyle = '#ff4f72'; ctx.beginPath(); ctx.moveTo(-r * 0.55, r * 0.78); ctx.lineTo(r * 0.55, r * 0.78); ctx.lineTo(r * 0.75, -r * 0.06); ctx.lineTo(-r * 0.75, -r * 0.06); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffd85e';
        for (let i = -2; i <= 2; i++) {
            ctx.save();
            ctx.rotate(i * 0.08);
            ctx.beginPath();
            ctx.roundRect(i * r * 0.22 - r * 0.06, -r * 0.82 + Math.abs(i) * r * 0.08, r * 0.16, r * 0.88, r * 0.05);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }
        ctx.fillStyle = '#6be7ff';
        ctx.beginPath(); ctx.arc(0, r * 0.35, r * 0.16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (type === 'SLUSHIE') {
        ctx.fillStyle = '#f7fff2'; ctx.beginPath(); ctx.moveTo(-r * 0.52, r * 0.82); ctx.lineTo(r * 0.52, r * 0.82); ctx.lineTo(r * 0.64, -r * 0.24); ctx.lineTo(-r * 0.64, -r * 0.24); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#6be7ff'; ctx.beginPath(); ctx.arc(0, -r * 0.27, r * 0.64, Math.PI, 0); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(92,255,111,0.65)'; ctx.fillRect(-r * 0.42, r * 0.05, r * 0.84, r * 0.26);
        ctx.strokeStyle = '#ff4fdf'; ctx.lineWidth = Math.max(3, r * 0.15); ctx.beginPath(); ctx.moveTo(r * 0.22, -r * 0.58); ctx.lineTo(r * 0.58, -r * 1.0); ctx.stroke();
    } else if (type === 'FRIEDRICH') {
        ctx.fillStyle = '#c78645';
        ctx.beginPath();
        ctx.ellipse(0, r * 0.18, r * 0.52, r * 0.78, Math.PI / 6, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ff9340';
        ctx.beginPath(); ctx.arc(r * 0.2, r * 0.05, r * 0.20, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f7fff2';
        ctx.beginPath(); ctx.arc(-r * 0.46, -r * 0.52, r * 0.19, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(-r * 0.22, -r * 0.62, r * 0.19, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#5cff6f';
        ctx.lineWidth = Math.max(2, r * 0.1);
        ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.72, -0.45, 1.25); ctx.stroke();
    }
    ctx.restore();
}

function drawButton(b) {
    ctx.save();
    const press = b.pressed ? 4 : 0;
    
    // Shadow
    ctx.fillStyle = 'rgba(10, 4, 20, 0.55)';
    ctx.beginPath();
    ctx.roundRect(b.x + 4, b.y + 7, b.w, b.h, 16);
    ctx.fill();

    // Body
    const buttonGradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    buttonGradient.addColorStop(0, '#fff2b0');
    buttonGradient.addColorStop(0.18, b.color);
    buttonGradient.addColorStop(1, '#34185f');
    ctx.fillStyle = buttonGradient;
    ctx.translate(press, press);
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 16);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#fff4cf';
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.roundRect(b.x + 6, b.y + 6, b.w - 12, 18, 12);
    ctx.fill();

    // Label/Icon
    drawFoodIcon(b.x + b.w/2, b.y + b.h/2 - 12, 20, b.type);

    ctx.font = '20px "Bangers"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(FOOD_EMOJIS[b.type], b.x + b.w/2, b.y + 18);

    // Text
    ctx.fillStyle = '#FFF';
    ctx.font = `${Math.max(8, Math.min(11, b.w * 0.115))}px "Orbitron"`;
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#111629';
    ctx.lineWidth = 4;
    ctx.strokeText(FOOD_LABELS[b.type], b.x + b.w/2, b.y + b.h - 16);
    ctx.fillText(FOOD_LABELS[b.type], b.x + b.w/2, b.y + b.h - 16);
    
    ctx.restore();
}

// --- §4 System Core ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }
    
    requestAnimationFrame(loop);
}

function handleGlobalInput(e) {
    if (e.cancelable) e.preventDefault();
    unlockAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (gameState === 'GAMEOVER') return; // Handled by DOM button

    // Check buttons
    buttons.forEach(b => {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
            handleInput(b.type);
        }
    });
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const goScreen = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        goScreen.classList.add('hidden');
        stopLoop('bgm_gameover');
        playLoop('bgm_main');
    } else if (newState === 'GAMEOVER') {
        document.getElementById('final-score').innerText = score;
        goScreen.classList.remove('hidden');
        stopLoop('bgm_main');
        playSfx('sfx_gameover');
        playLoop('bgm_gameover');
    }
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('lives-display').innerText = '▲'.repeat(Math.max(0, lives));
}

function restartGame() {
    initGame();
}

function shakeScreen() {
    canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
    setTimeout(() => {
        canvas.style.transform = 'none';
    }, 200);
}

// Audio Helpers
function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    audioUnlocked = true;
    playLoop(gameState === 'GAMEOVER' ? 'bgm_gameover' : 'bgm_main');
}

function playLoop(id) {
    if (!audioUnlocked) return;
    const el = audioEls[id];
    if (!el) return;
    try {
        el.currentTime = el.currentTime || 0;
        el.play().catch(() => {});
    } catch (e) {
        console.warn(`Loop playback failed for ${id}`, e);
    }
}

function stopLoop(id) {
    const el = audioEls[id];
    if (!el) return;
    try {
        el.pause();
        el.currentTime = 0;
    } catch (e) {
        console.warn(`Loop stop failed for ${id}`, e);
    }
}

function playSfx(id) {
    if (!audioUnlocked) return;
    const el = audioEls[id];

    if (audioCtx && audioBuffers[id]) {
        const source = audioCtx.createBufferSource();
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = el?.volume ?? 0.4;
        source.buffer = audioBuffers[id];
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
        return;
    }

    if (el && el.getAttribute('src')) {
        try {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => {
                synthesizeSfx(id === 'sfx_collect' || id === 'sfx_correct' || id === 'sfx_restart' ? 'chime' : 'noise');
            });
            return;
        } catch (e) {
            console.warn(`Element SFX playback failed for ${id}`, e);
        }
    }

    synthesizeSfx(id === 'sfx_collect' || id === 'sfx_correct' || id === 'sfx_restart' ? 'chime' : 'noise');
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'chime') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1040, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.24);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function showReaction(type) {
    if (reactionTimer) clearTimeout(reactionTimer);
    successReactionEl.classList.add('hidden');
    failReactionEl.classList.add('hidden');

    const target = type === 'success' ? successReactionEl : failReactionEl;
    target.classList.remove('hidden');
    reactionTimer = setTimeout(() => {
        target.classList.add('hidden');
    }, 900);
}

function vibrate(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
}

// Setup
document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    initAudio();
    
    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        resize(entry.contentRect.width, entry.contentRect.height);
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
        }
    });
    
    ro.observe(canvas);
    
    // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: scoped gesture prevention to canvas so overlay buttons keep native tap/click behavior
    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('sfx_restart');
        restartGame();
    });
});
</script>
