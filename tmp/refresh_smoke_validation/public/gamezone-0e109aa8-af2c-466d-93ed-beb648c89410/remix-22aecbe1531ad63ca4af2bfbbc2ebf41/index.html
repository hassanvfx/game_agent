<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Night Shift Rush</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #04030b;
            --bg-mid: #0c1022;
            --panel: rgba(10, 16, 32, 0.78);
            --panel-strong: rgba(13, 22, 42, 0.92);
            --line: rgba(138, 199, 255, 0.3);
            --cyan: #69e9ff;
            --cyan-strong: #00b7ff;
            --magenta: #ff52d1;
            --violet: #8b5cf6;
            --amber: #ffd54f;
            --danger: #ff5c75;
            --success: #56f39a;
            --text: #f6fbff;
            --text-dim: #9eb1cf;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
            --title-font: "Orbitron", system-ui, sans-serif;
            --ui-font: "Exo 2", system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 183, 255, 0.12), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 82, 209, 0.08), transparent 28%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 66%);
            color: var(--text);
            touch-action: auto;
            font-family: var(--ui-font);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0 14%, rgba(105, 233, 255, 0.04) 14% 14.3%, transparent 14.3% 100%),
                linear-gradient(transparent 0 12%, rgba(255, 255, 255, 0.025) 12% 12.25%, transparent 12.25% 100%);
            background-size: 100px 100px, 100px 100px;
            opacity: 0.45;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0));
            mix-blend-mode: screen;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: var(--ui-font);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            position: relative;
            z-index: 1;
        }

        .hidden { display: none !important; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(16, 25, 49, 0.92), rgba(8, 14, 28, 0.82));
            backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 0 1px rgba(255,255,255,0.03),
                0 12px 30px rgba(0, 0, 0, 0.34);
        }

        .glass-panel--hud::before,
        .glass-panel--accent::before,
        .shop-card::before,
        .modal-card::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(105, 233, 255, 0.08), transparent 35%, rgba(255, 82, 209, 0.08));
        }

        #hud {
            width: 100%;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            color: var(--text);
            font-weight: 700;
        }

        #hud .hud-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        #hud .hud-stack.end {
            align-items: flex-end;
        }

        .hud-card {
            position: relative;
            padding: 9px 14px;
            border-radius: 14px;
            min-width: 0;
            overflow: hidden;
        }

        .hud-speed {
            font-size: clamp(1rem, 3.8vw, 1.3rem);
            font-family: var(--title-font);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(105, 233, 255, 0.35);
        }

        .hud-distance,
        .hud-money {
            font-size: clamp(0.72rem, 2.7vw, 0.92rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .hud-money {
            color: var(--success);
            font-family: var(--title-font);
            text-shadow: 0 0 12px rgba(86, 243, 154, 0.25);
        }

        .boost-card {
            position: relative;
            width: min(132px, 34vw);
            padding: 8px 10px;
            border-radius: 14px;
            overflow: hidden;
        }

        .boost-label {
            margin-bottom: 6px;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #8cd9ff;
        }

        .boost-track {
            width: 100%;
            height: 7px;
            background: rgba(8, 12, 24, 0.86);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        #hud-turbo-bar {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #42f5ff, #00b7ff 55%, #8b5cf6);
            box-shadow: 0 0 14px rgba(0, 183, 255, 0.75);
            transition: width 100ms linear;
        }

        #controls {
            width: 100%;
            padding: 14px 14px calc(22px + env(safe-area-inset-bottom, 0px));
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px;
        }

        .controls-cluster,
        .pedal-stack,
        .pedal-row {
            display: flex;
            gap: 10px;
        }

        .pedal-stack {
            flex-direction: column;
            align-items: flex-end;
        }

        .control-btn {
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            font-family: var(--title-font);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 10px 18px rgba(0, 0, 0, 0.34),
                0 0 18px rgba(0, 183, 255, 0.08);
            transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .control-btn:active,
        .control-btn.is-pressed {
            transform: translateY(2px) scale(0.98);
            filter: brightness(1.08);
        }

        .steer-btn {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            font-size: 1.7rem;
            background: linear-gradient(180deg, rgba(30, 43, 78, 0.96), rgba(8, 14, 28, 0.96));
        }

        .mini-btn {
            width: 56px;
            height: 56px;
            border-radius: 999px;
            font-size: 0.72rem;
            line-height: 1;
        }

        .brake-btn {
            width: 66px;
            height: 66px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: linear-gradient(180deg, #7d1631, #3f0e21);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 10px 18px rgba(80, 10, 30, 0.42),
                0 0 16px rgba(255, 92, 117, 0.16);
        }

        .gas-btn {
            width: 78px;
            height: 104px;
            border-radius: 24px;
            font-size: 1rem;
            background: linear-gradient(180deg, #1b8d66, #0d3f34);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.14),
                0 12px 20px rgba(11, 87, 65, 0.42),
                0 0 18px rgba(86, 243, 154, 0.18);
        }

        .drift-btn {
            background: linear-gradient(180deg, #b25f19, #5d2808);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 10px 18px rgba(123, 60, 17, 0.38),
                0 0 16px rgba(255, 166, 69, 0.16);
        }

        .turbo-btn {
            background: linear-gradient(180deg, #1b78c0, #0b295a);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 10px 18px rgba(12, 50, 122, 0.42),
                0 0 18px rgba(105, 233, 255, 0.22);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            pointer-events: auto;
        }

        .feedback-gif {
            position: absolute;
            z-index: 54;
            width: min(34vw, 132px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(3, 8, 20, 0.72);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-gif.active {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        #near-miss-gif {
            right: 12px;
            top: max(88px, calc(env(safe-area-inset-top, 0px) + 72px));
        }

        #crash-gif {
            left: 12px;
            bottom: max(152px, calc(env(safe-area-inset-bottom, 0px) + 128px));
        }

        #game-over-screen {
            background:
                radial-gradient(circle at top, rgba(255, 82, 209, 0.14), transparent 30%),
                rgba(2, 4, 12, 0.86);
            backdrop-filter: blur(12px);
        }

        .screen-title {
            margin: 0 0 18px;
            font-family: var(--title-font);
            font-size: clamp(2.15rem, 9vw, 4.2rem);
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            color: #fff5fb;
            text-shadow:
                0 0 18px rgba(255, 82, 209, 0.35),
                0 0 30px rgba(0, 183, 255, 0.16);
        }

        .screen-subtitle {
            font-size: 0.8rem;
            color: #ff9ed8;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            margin-bottom: 10px;
        }

        .modal-card {
            position: relative;
            width: min(92vw, 420px);
            border-radius: 22px;
            padding: 20px;
            overflow: hidden;
        }

        .stats-card {
            margin-bottom: 16px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: clamp(0.95rem, 3.8vw, 1.1rem);
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .stats-row strong,
        .stats-row span:last-child {
            color: var(--text);
            font-family: var(--title-font);
            font-weight: 400;
        }

        .stats-row.total {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.12);
            font-size: clamp(1rem, 4vw, 1.35rem);
        }

        .stats-row.total span:last-child {
            color: var(--success);
            text-shadow: 0 0 12px rgba(86, 243, 154, 0.26);
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: min(92vw, 420px);
            position: sticky;
            bottom: 0;
        }

        .action-btn {
            border: 0;
            border-radius: 18px;
            min-height: 56px;
            padding: 14px 16px;
            font-family: var(--title-font);
            font-size: clamp(0.95rem, 4vw, 1.1rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
            transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
            box-shadow: var(--shadow);
        }

        .action-btn:active {
            transform: scale(0.97);
            filter: brightness(1.06);
        }

        .action-primary {
            background: linear-gradient(180deg, #f4fbff, #b8e8ff);
            color: #041421;
            box-shadow: 0 0 22px rgba(184, 232, 255, 0.32);
        }

        .action-secondary {
            background: linear-gradient(180deg, rgba(18, 28, 54, 0.95), rgba(9, 15, 28, 0.95));
            border: 1px solid rgba(255,255,255,0.16);
        }

        #shop-screen {
            justify-content: flex-start;
            padding-top: max(18px, env(safe-area-inset-top, 0px));
            padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            background:
                radial-gradient(circle at top, rgba(0, 183, 255, 0.16), transparent 28%),
                radial-gradient(circle at bottom, rgba(255, 82, 209, 0.14), transparent 26%),
                linear-gradient(180deg, #050814, #03040b 70%);
        }

        .shop-shell {
            width: min(92vw, 440px);
            display: flex;
            flex-direction: column;
            min-height: min(88vh, 760px);
            max-height: 90vh;
        }

        .shop-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .shop-funds {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            font-family: var(--title-font);
            color: var(--success);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        #car-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 2px 12px;
        }

        .shop-card {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 18px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .shop-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .shop-preview {
            width: 70px;
            height: 90px;
            border-radius: 12px;
            background:
                radial-gradient(circle at top, rgba(105, 233, 255, 0.16), transparent 45%),
                rgba(0, 0, 0, 0.38);
            border: 1px solid rgba(255,255,255,0.08);
            flex: 0 0 auto;
        }

        .shop-text {
            min-width: 0;
            text-align: left;
        }

        .shop-car-name {
            color: var(--text);
            font-family: var(--title-font);
            font-size: clamp(0.95rem, 3.8vw, 1.1rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shop-car-meta {
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .shop-btn {
            border: 0;
            border-radius: 14px;
            padding: 12px 14px;
            min-width: 108px;
            font-family: var(--title-font);
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff;
            box-shadow: var(--shadow);
        }

        .shop-btn.equipped { background: linear-gradient(180deg, #20a569, #0d5a42); }
        .shop-btn.select { background: linear-gradient(180deg, #217ec6, #123f74); }
        .shop-btn.buy { background: linear-gradient(180deg, #c2961b, #6d4e08); }
        .shop-btn.locked { background: linear-gradient(180deg, #812234, #3d0f18); opacity: 0.64; }

        .shop-footer {
            margin-top: 12px;
        }

        .back-btn {
            width: 100%;
            background: linear-gradient(180deg, rgba(22, 34, 62, 0.98), rgba(10, 15, 30, 0.98));
            border: 1px solid rgba(255,255,255,0.14);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.06); border-radius: 999px; }
        ::-webkit-scrollbar-thumb { background: rgba(105, 233, 255, 0.35); border-radius: 999px; }

        @media (min-width: 640px) {
            #hud { padding: 18px 18px 0; }
            #controls { padding: 18px 18px calc(28px + env(safe-area-inset-bottom, 0px)); }
            .controls-cluster, .pedal-row { gap: 14px; }
            .pedal-stack { gap: 14px; }
            .steer-btn { width: 76px; height: 76px; font-size: 2rem; }
            .mini-btn { width: 62px; height: 62px; }
            .brake-btn { width: 78px; height: 78px; }
            .gas-btn { width: 90px; height: 120px; font-size: 1.15rem; }
        }

        @media (max-width: 420px) {
            #hud { padding: 10px; }
            .hud-card { padding: 8px 12px; }
            .boost-card { width: min(124px, 38vw); }
            #controls { padding: 10px 10px calc(18px + env(safe-area-inset-bottom, 0px)); }
            .controls-cluster, .pedal-row, .pedal-stack { gap: 8px; }
            .steer-btn { width: 58px; height: 58px; border-radius: 18px; }
            .mini-btn { width: 52px; height: 52px; }
            .brake-btn { width: 60px; height: 60px; border-radius: 18px; }
            .gas-btn { width: 72px; height: 96px; border-radius: 22px; }
            .shop-btn { min-width: 96px; padding: 11px 10px; font-size: 0.68rem; }
            .shop-card { padding: 12px; }
            .shop-card-left { gap: 10px; }
            .shop-preview { width: 60px; height: 82px; }
            .feedback-gif {
                width: min(30vw, 108px);
                border-radius: 15px;
            }
            #near-miss-gif {
                right: 8px;
                top: max(82px, calc(env(safe-area-inset-top, 0px) + 66px));
            }
            #crash-gif {
                left: 8px;
                bottom: max(144px, calc(env(safe-area-inset-bottom, 0px) + 118px));
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
        {"heroSpeed":{"type":"number","label":"Base Speed","value":50,"min":30,"max":100},"trafficDensity":{"type":"number","label":"Traffic Density","value":0.6,"min":0.2,"max":1.5}}
    </script>
</head>
<body>
    <div id="game-container" class="select-none">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="pointer-events-none">
            <img id="near-miss-gif" class="feedback-gif" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp" alt="Turbo near miss reaction" />
            <img id="crash-gif" class="feedback-gif" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Crash reaction burst" />
            <!-- [agent-note][stage3] resolved-gif: near-miss/crash feedback -> catalogs/gifs.json -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
            <div id="hud" class="pointer-events-none hidden">
                <div class="hud-stack">
                    <div id="hud-score" class="glass-panel glass-panel--hud hud-card hud-speed">0 km/h</div>
                    <div id="hud-dist" class="glass-panel glass-panel--hud hud-card hud-distance">0.0 km</div>
                </div>
                <div class="hud-stack end">
                    <div id="hud-money" class="glass-panel glass-panel--hud hud-card hud-money">$0</div>
                    <div class="glass-panel glass-panel--accent boost-card">
                        <div class="boost-label">Boost</div>
                        <div class="boost-track">
                            <div id="hud-turbo-bar" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
            <div id="controls" class="pointer-events-none hidden">
                <div class="controls-cluster pointer-events-auto">
                    <button id="btn-left" class="control-btn steer-btn">◄</button>
                    <button id="btn-right" class="control-btn steer-btn">►</button>
                </div>

                <div class="pedal-stack pointer-events-auto">
                    <div class="pedal-row">
                        <button id="btn-handbrake" class="control-btn mini-btn drift-btn">Drift</button>
                        <button id="btn-turbo" class="control-btn mini-btn turbo-btn">NOS</button>
                    </div>
                    <div class="pedal-row">
                        <button id="btn-brake" class="control-btn brake-btn">Brake</button>
                        <button id="btn-gas" class="control-btn gas-btn">Gas</button>
                    </div>
                </div>
            </div>

            <div id="game-over-screen" class="overlay-screen hidden">
                <div class="screen-subtitle">Night Courier Run</div>
                <h1 class="screen-title">Shift Over</h1>
                <div class="glass-panel modal-card stats-card">
                    <div class="stats-row"><span>Distance</span><span id="go-dist">0.0 km</span></div>
                    <div class="stats-row"><span>Earned</span><span id="go-earned">+$0</span></div>
                    <div class="stats-row total"><span>Total Tips</span><span id="go-total">$0</span></div>
                </div>
                <div class="modal-actions">
                    <button id="restart-btn" class="action-btn action-primary">Take Another Shift</button>
                    <button id="shop-btn" class="action-btn action-secondary">Garage</button>
                </div>
            </div>

            <div id="shop-screen" class="overlay-screen hidden">
                <div class="shop-shell">
                    <div class="shop-header">
                        <div class="screen-subtitle">Tune The Ride</div>
                        <h1 class="screen-title">Garage</h1>
                        <div class="glass-panel shop-funds">Funds: <span id="shop-money">$0</span></div>
                    </div>
                    <div id="car-list"></div>
                    <div class="shop-footer">
                        <button id="shop-back-btn" class="action-btn back-btn">Back to Track</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="bgm_game" data-editable="audio" data-label="Gameplay BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
    <audio id="bgm_shop" data-editable="audio" data-label="Shop BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_nearmiss" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
    <audio id="sfx_crash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3" preload="auto"></audio>
    <audio id="sfx_buy" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_turbo" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
    <!-- [agent-note][stage3] resolved-audio: crash/near-miss/buy/ui/turbo + gameplay/shop loops -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json -->

    <script>
        // --- System & Config ---
        window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));
        window.updateGameConfig = (key, val) => { window.gameConfig[key] = val; };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let audioCtx = null;
        let audioUnlocked = false;
        let engineOsc = null;
        let engineGain = null;
        let lastPlayedAt = Object.create(null);
        let lastTurboSfxAt = 0;
        let activeGifTimer = null;

        // --- Game State ---
        let gameState = 'PLAYING';
        let lastTime = 0;
        let shakeTime = 0;

        // --- Persistence ---
        let savedData = JSON.parse(localStorage.getItem('realRacingData') || '{"cars":[0],"selected":0,"money":0}');
        let totalMoney = savedData.money || 0;
        let unlockedCars = savedData.cars || [0];
        let selectedCarId = savedData.selected || 0;

        const CAR_DEFS = [
            { name: "Sedan GL", color: "#64748b", speedMult: 1.0, cost: 0, type: 'standard', accent: "#69e9ff", glow: "#8b5cf6" },
            { name: "Muscle V8", color: "#ea580c", speedMult: 1.2, cost: 500, type: 'camaro', accent: "#ffb84f", glow: "#ff52d1" },
            { name: "SUV X", color: "#0284c7", speedMult: 1.4, cost: 1500, type: 'urus', accent: "#56f39a", glow: "#00b7ff" },
            { name: "Super R8", color: "#e2e8f0", speedMult: 1.6, cost: 3000, type: 'r8', accent: "#69e9ff", glow: "#ffffff" },
            { name: "Hyper V12", color: "#16a34a", speedMult: 1.8, cost: 6000, type: 'aventador', accent: "#d2ff4f", glow: "#56f39a" },
            { name: "Apex F1", color: "#dc2626", speedMult: 2.0, cost: 10000, type: 'f1', accent: "#ffd54f", glow: "#ff5c75" }
        ];

        const BIOMES = [
            { name: 'Midnight Run', bg: '#020617', road: '#0f172a', obj1: '#1e1b4b', obj2: '#312e81', skyline: '#0ea5e9', haze: 'rgba(14,165,233,0.18)', laneGlow: '#22d3ee' },
            { name: 'Dawn Highway', bg: '#451a03', road: '#1c1917', obj1: '#78350f', obj2: '#451a03', skyline: '#fb7185', haze: 'rgba(251,113,133,0.18)', laneGlow: '#f59e0b' },
            { name: 'Overcast', bg: '#1e293b', road: '#0f172a', obj1: '#334155', obj2: '#1e293b', skyline: '#a78bfa', haze: 'rgba(167,139,250,0.14)', laneGlow: '#c084fc' }
        ];

        // --- Entities & Physics ---
        let player = { x: 0, y: 0, w: 40, h: 80 };
        let enemies = [];
        let particles = [];
        let skidMarks = [];
        let texts = [];
        let sideObjs = [];
        let roadOffset = 0;

        let distance = 0;
        let sessionMoney = 0;
        let baseSpeed = 0;
        let currentSpeed = 0;
        let currentSteer = 0;
        let turboMeter = 100;
        let currentBiome = 0;

        const keys = { left: false, right: false, gas: false, brake: false, hb: false, turbo: false };

        // --- Utils ---
        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);
            R = Math.min(255, Math.max(0, R));
            G = Math.min(255, Math.max(0, G));
            B = Math.min(255, Math.max(0, B));
            let RR = (R.toString(16).length==1)?"0"+R.toString(16):R.toString(16);
            let GG = (G.toString(16).length==1)?"0"+G.toString(16):G.toString(16);
            let BB = (B.toString(16).length==1)?"0"+B.toString(16):B.toString(16);
            return "#"+RR+GG+BB;
        }

        function rgbaFromHex(hex, alpha) {
            const normalized = hex.replace('#', '');
            const bigint = parseInt(normalized, 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function drawRoundRect(ctxInst, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctxInst.beginPath();
            ctxInst.moveTo(x + r, y);
            ctxInst.arcTo(x + w, y, x + w, y + h, r);
            ctxInst.arcTo(x + w, y + h, x, y + h, r);
            ctxInst.arcTo(x, y + h, x, y, r);
            ctxInst.arcTo(x, y, x + w, y, r);
            ctxInst.closePath();
        }

        function drawNeonArrow(ctxInst, x, y, size, dir, color) {
            ctxInst.save();
            ctxInst.translate(x, y);
            ctxInst.rotate(dir === 'left' ? Math.PI : 0);
            ctxInst.shadowColor = color;
            ctxInst.shadowBlur = size * 0.4;
            ctxInst.strokeStyle = color;
            ctxInst.lineWidth = Math.max(3, size * 0.12);
            ctxInst.lineCap = 'round';
            ctxInst.beginPath();
            ctxInst.moveTo(-size * 0.3, -size * 0.2);
            ctxInst.lineTo(size * 0.1, 0);
            ctxInst.lineTo(-size * 0.3, size * 0.2);
            ctxInst.stroke();
            ctxInst.restore();
        }

        function drawSpeedLines(speedRatio) {
            if (speedRatio <= 0) return;
            ctx.save();
            ctx.strokeStyle = `rgba(255,255,255,${0.03 + speedRatio * 0.09})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 9; i++) {
                const x = ((i * 97) + roadOffset * 0.7) % cw;
                const y = ((i * 73) + roadOffset * 1.8) % ch;
                ctx.moveTo(x, y);
                ctx.lineTo(x, y + 80 + speedRatio * 90);
            }
            ctx.stroke();
            ctx.restore();
        }

        // --- Audio & Vibrate ---
        function initEngineSound() {
            if (!audioCtx || engineOsc) return;
            try {
                engineOsc = audioCtx.createOscillator();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.value = 50;
                engineGain = audioCtx.createGain();
                engineGain.gain.value = 0;
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 600;
                engineOsc.connect(filter);
                filter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {}
        }

        function updateEngineSound() {
            if (!engineOsc || !engineGain) return;
            if (gameState === 'PLAYING') {
                let maxPossible = baseSpeed * CAR_DEFS[selectedCarId].speedMult * 1.6;
                let ratio = Math.max(0, Math.min(1, currentSpeed / maxPossible));
                engineOsc.frequency.setTargetAtTime(60 + ratio * 200, audioCtx.currentTime, 0.1);
                engineGain.gain.setTargetAtTime(0.05 + ratio * 0.15, audioCtx.currentTime, 0.1);
            } else {
                engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
            }
        }

        function showFeedbackGif(id, duration = 900) {
            const target = document.getElementById(id);
            if (!target) return;
            if (activeGifTimer) clearTimeout(activeGifTimer);
            document.querySelectorAll('.feedback-gif').forEach((gif) => {
                if (gif !== target) gif.classList.remove('active');
            });
            target.classList.add('active');
            activeGifTimer = setTimeout(() => {
                target.classList.remove('active');
            }, duration);
        }

        function playMediaElement(id, { volume = 0.45, reset = true, debounceMs = 0 } = {}) {
            const media = document.getElementById(id);
            if (!media) return;
            const now = performance.now();
            if (debounceMs > 0 && (now - (lastPlayedAt[id] || 0)) < debounceMs) return;
            lastPlayedAt[id] = now;
            try {
                media.volume = volume;
                if (reset) media.currentTime = 0;
                media.play().catch(() => {});
            } catch (e) {}
        }

        function unlockAudio() {
            if (!audioUnlocked) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume();
                audioUnlocked = true;
                document.getElementById('bgm_game').volume = 0.28;
                document.getElementById('bgm_shop').volume = 0.22;
                document.getElementById('bgm_game').play().catch(()=>{});
                initEngineSound();
            } else if (audioCtx?.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }

        function playBgm(type) {
            const gameBgm = document.getElementById('bgm_game');
            const shopBgm = document.getElementById('bgm_shop');
            gameBgm.volume = 0.28;
            shopBgm.volume = 0.22;
            if (type === 'game') {
                shopBgm.pause();
                gameBgm.play().catch(()=>{});
            } else {
                gameBgm.pause();
                shopBgm.play().catch(()=>{});
            }
        }

        function playSfx(type) {
            if (type === 'crash') {
                playMediaElement('sfx_crash', { volume: 0.5, debounceMs: 700 });
                showFeedbackGif('crash-gif', 1500);
                return;
            }
            if (type === 'nearmiss') {
                playMediaElement('sfx_nearmiss', { volume: 0.42, debounceMs: 180 });
                showFeedbackGif('near-miss-gif', 900);
                return;
            }
            if (type === 'buy') {
                playMediaElement('sfx_buy', { volume: 0.4, debounceMs: 140 });
                return;
            }
            if (type === 'ui') {
                playMediaElement('sfx_ui', { volume: 0.26, debounceMs: 90 });
                return;
            }
            if (type === 'turbo') {
                playMediaElement('sfx_turbo', { volume: 0.34, debounceMs: 220 });
                return;
            }
            if (!audioCtx) return;
        }

        function vibrate(style) {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style: style }
            });
        }

        function saveData() {
            localStorage.setItem('realRacingData', JSON.stringify({
                cars: unlockedCars,
                selected: selectedCarId,
                money: totalMoney
            }));
        }

        // --- Core Logic ---
        function setState(state) {
            gameState = state;
            document.getElementById('hud').classList.toggle('hidden', state !== 'PLAYING');
            document.getElementById('controls').classList.toggle('hidden', state !== 'PLAYING');
            document.getElementById('game-over-screen').classList.toggle('hidden', state !== 'GAMEOVER');
            document.getElementById('shop-screen').classList.toggle('hidden', state !== 'SHOP');

            if (state === 'GAMEOVER') {
                totalMoney += sessionMoney;
                saveData();
                document.getElementById('go-dist').innerText = (distance / 1000).toFixed(1) + ' km';
                document.getElementById('go-earned').innerText = '+$' + sessionMoney;
                document.getElementById('go-total').innerText = '$' + totalMoney;
                playBgm('shop');
            } else if (state === 'SHOP') {
                document.getElementById('shop-money').innerText = '$' + totalMoney;
                renderShop();
                playBgm('shop');
            } else if (state === 'PLAYING') {
                playBgm('game');
            }
        }

        function getScale() {
            let roadW = Math.min(cw * 0.8, 600);
            let laneW = roadW / 4;
            return { roadW, laneW, carW: laneW * 0.55, carH: laneW * 1.1 };
        }

        function initGame() {
            let { roadW, laneW, carW, carH } = getScale();
            let startX = (cw - roadW) / 2;

            player.w = carW;
            player.h = carH;
            player.x = startX + 2.5 * laneW;
            player.y = ch - carH - 140;

            distance = 0;
            sessionMoney = 0;
            baseSpeed = gameConfig.heroSpeed;
            currentSpeed = 0;
            currentSteer = 0;
            turboMeter = 100;

            enemies = [];
            particles = [];
            skidMarks = [];
            texts = [];
            sideObjs = [];
            currentBiome = 0;
            shakeTime = 0;

            for(let i=0; i<15; i++) spawnSideObj(Math.random() * ch);

            updateHudFast(true);
        }

        function restartGame() {
            initGame();
            setState('PLAYING');
        }

        function spawnSideObj(y = -50) {
            let roadW = Math.min(cw * 0.8, 600);
            let edge = (cw - roadW) / 2;
            let x = Math.random() > 0.5 ? Math.random() * (edge - 10) : cw - Math.random() * (edge - 10);
            sideObjs.push({
                x,
                y,
                size: 10 + Math.random()*30,
                hue: Math.random() > 0.5 ? 'cool' : 'warm'
            });
        }

        function spawnEnemy() {
            let eSpeed = 25 + Math.random() * 5;
            if (Math.random() < 0.2) {
                eSpeed = 30 + Math.random() * 20;
            }

            let spawnY = -150;
            if (currentSpeed < eSpeed) {
                spawnY = ch + 150;
            }

            let { roadW, laneW, carW, carH } = getScale();
            let startX = (cw - roadW) / 2;
            let lane = Math.floor(Math.random() * 4);

            if (spawnY > ch && currentSpeed < 30) {
                let playerLane = Math.floor((player.x - startX) / laneW);
                if (lane === playerLane) {
                    lane = (lane + 1) % 4;
                }
            }

            let x = startX + lane * laneW + laneW / 2;

            for (let e of enemies) {
                if (Math.abs(e.x - x) < carW && Math.abs(e.y - spawnY) < carH * 3) return;
            }

            const palette = [
                { body: '#334155', accent: '#69e9ff', glow: '#00b7ff' },
                { body: '#94a3b8', accent: '#ffffff', glow: '#cbd5e1' },
                { body: '#b91c1c', accent: '#ffd54f', glow: '#ff5c75' },
                { body: '#0369a1', accent: '#56f39a', glow: '#22d3ee' },
                { body: '#4d7c0f', accent: '#d2ff4f', glow: '#84cc16' },
                { body: '#000000', accent: '#8b5cf6', glow: '#ff52d1' },
                { body: '#ffffff', accent: '#00b7ff', glow: '#69e9ff' }
            ];
            const look = palette[Math.floor(Math.random() * palette.length)];

            enemies.push({
                x, y: spawnY, w: carW, h: carH,
                speed: eSpeed,
                color: look.body,
                accent: look.accent,
                glow: look.glow,
                type: 'standard',
                nearMissed: false
            });
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*15,
                    vy: (Math.random()-0.5)*15 - currentSpeed*0.3,
                    life: 1.0,
                    size: 2 + Math.random()*5,
                    color: color
                });
            }
        }

        function spawnText(str, x, y, color) {
            texts.push({ text: str, x, y, life: 1.0, color });
        }

        function crash() {
            playSfx('crash');
            vibrate('heavy');
            shakeTime = 0.6;
            spawnParticles(player.x, player.y, '#ff0000');
            spawnParticles(player.x, player.y, '#f59e0b');
            setTimeout(() => setState('GAMEOVER'), 1500);
            gameState = 'CRASHING';
            currentSpeed = 0;
        }

        let lastHudSpeed = -1, lastHudDist = -1, lastHudMoney = -1, lastHudTurbo = -1;
        function updateHudFast(force = false) {
            let s = Math.floor(currentSpeed * 2);
            if (s !== lastHudSpeed || force) { document.getElementById('hud-score').innerText = s + ' km/h'; lastHudSpeed = s; }
            let d = (distance / 1000).toFixed(1);
            if (d !== lastHudDist || force) { document.getElementById('hud-dist').innerText = d + ' km'; lastHudDist = d; }
            if (sessionMoney !== lastHudMoney || force) { document.getElementById('hud-money').innerText = '$' + sessionMoney; lastHudMoney = sessionMoney; }
            let t = Math.floor(turboMeter);
            if (t !== lastHudTurbo || force) { document.getElementById('hud-turbo-bar').style.width = t + '%'; lastHudTurbo = t; }
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if (!initialized) return;

            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;

            try {
                if (!isFinite(player.x)) player.x = cw / 2;
                if (!isFinite(player.y)) player.y = ch - 140;

                updateEngineSound();

                if (gameState === 'PLAYING') {
                    let carDef = CAR_DEFS[selectedCarId];
                    let maxSpeed = baseSpeed * carDef.speedMult;
                    let accel = maxSpeed * 0.6;
                    let decel = maxSpeed * 1.0;
                    let hbDecel = maxSpeed * 1.5;
                    let friction = maxSpeed * 0.15;

                    let isTurboing = false;
                    if (keys.turbo && turboMeter > 0) {
                        maxSpeed *= 1.6;
                        accel *= 2.5;
                        turboMeter -= dt * 25;
                        isTurboing = true;
                        if (performance.now() - lastTurboSfxAt > 700) {
                            playSfx('turbo');
                            lastTurboSfxAt = performance.now();
                        }
                    } else {
                        turboMeter = Math.min(100, turboMeter + dt * 2);
                    }

                    if (keys.gas) currentSpeed += accel * dt;
                    else if (keys.brake) currentSpeed -= decel * dt;
                    else currentSpeed -= friction * dt;

                    if (keys.hb) {
                        currentSpeed -= hbDecel * dt;
                        if (currentSpeed > 20 && Math.abs(currentSteer) > 0.1) {
                            skidMarks.push({ x: player.x - player.w/3, y: player.y + player.h/2, life: 1.0 });
                            skidMarks.push({ x: player.x + player.w/3, y: player.y + player.h/2, life: 1.0 });
                        }
                    }

                    currentSpeed = Math.max(0, Math.min(currentSpeed, maxSpeed));

                    let targetSteer = 0;
                    if (keys.left) targetSteer = -1;
                    if (keys.right) targetSteer = 1;
                    let steerLerp = keys.hb ? 10 : 5;
                    currentSteer += (targetSteer - currentSteer) * dt * steerLerp;

                    let turnSpeed = currentSpeed * 0.012;
                    if (keys.hb) turnSpeed *= 1.8;
                    player.x += currentSteer * turnSpeed * 60 * dt;

                    let { roadW } = getScale();
                    let roadLeft = (cw - roadW) / 2 + player.w/2;
                    let roadRight = cw - (cw - roadW) / 2 - player.w/2;

                    if (player.x < roadLeft) {
                        player.x = roadLeft; currentSpeed *= 0.95;
                        if (currentSpeed > 10 && Math.random() < 0.3) spawnParticles(player.x - player.w/2, player.y + player.h/2, '#78350f');
                    }
                    if (player.x > roadRight) {
                        player.x = roadRight; currentSpeed *= 0.95;
                        if (currentSpeed > 10 && Math.random() < 0.3) spawnParticles(player.x + player.w/2, player.y + player.h/2, '#78350f');
                    }

                    distance += currentSpeed * dt * 3.5;
                    if (Math.floor(distance / 2) > sessionMoney) {
                        sessionMoney = Math.floor(distance / 2);
                    }

                    currentBiome = Math.floor(distance / 2000) % BIOMES.length;
                    roadOffset += currentSpeed * dt * 100;
                    if (roadOffset > 120) roadOffset -= 120;

                    if (Math.random() < gameConfig.trafficDensity * dt * 2) spawnEnemy();
                    if (Math.random() < 4 * dt) spawnSideObj();

                    if (isTurboing && Math.random() < 0.6) {
                        spawnParticles(player.x, player.y + player.h * 0.55, '#69e9ff');
                    }

                    updateHudFast();
                }

                const visualSpeedMult = 40;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.y += (currentSpeed - e.speed) * dt * visualSpeedMult;

                    if (e.y > ch + 300 || e.y < -300) {
                        enemies.splice(i, 1);
                        continue;
                    }

                    if (gameState === 'PLAYING') {
                        let dx = Math.abs(player.x - e.x);
                        let dy = Math.abs(player.y - e.y);
                        let hitX = dx < (player.w + e.w) / 2 - 4;
                        let hitY = dy < (player.h + e.h) / 2 - 4;

                        if (hitX && hitY) {
                            crash();
                        } else if (!e.nearMissed && currentSpeed > 30) {
                            let grazeX = dx < (player.w + e.w) / 2 + 18;
                            let grazeY = dy < (player.h + e.h) / 2 + 18;
                            if (grazeX && grazeY) {
                                e.nearMissed = true;
                                sessionMoney += 250;
                                turboMeter = Math.min(100, turboMeter + 15);
                                spawnText('NEAR MISS!', player.x, player.y - 60, '#38bdf8');
                                playSfx('nearmiss');
                                vibrate('light');
                            }
                        }
                    }
                }

                for (let i = sideObjs.length - 1; i >= 0; i--) {
                    sideObjs[i].y += currentSpeed * dt * visualSpeedMult;
                    if (sideObjs[i].y > ch + 200) sideObjs.splice(i, 1);
                }

                for (let i = skidMarks.length - 1; i >= 0; i--) {
                    let s = skidMarks[i];
                    s.y += currentSpeed * dt * visualSpeedMult;
                    s.life -= dt * 0.3;
                    if (s.y > ch || s.life <= 0) skidMarks.splice(i, 1);
                }

                if (shakeTime > 0) shakeTime -= dt;
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= dt * 2.0;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                for (let i = texts.length - 1; i >= 0; i--) {
                    let t = texts[i];
                    t.y -= dt * 50; t.life -= dt * 1.5;
                    if (t.life <= 0) texts.splice(i, 1);
                }

                draw();
            } catch(err) {
                console.error(err);
            }
        }

        // --- Realistic Drawing ---
        function drawRealisticCar(ctxInst, x, y, w, h, color, type, steerAngle, isBraking, isTurbo, accent = '#69e9ff', glow = '#ffffff') {
            ctxInst.save();
            ctxInst.translate(x, y);

            ctxInst.shadowColor = 'rgba(0,0,0,0.78)';
            ctxInst.shadowBlur = 18;
            ctxInst.shadowOffsetY = 10;
            ctxInst.fillStyle = 'rgba(0,0,0,1)';
            drawRoundRect(ctxInst, -w/2, -h/2, w, h, 8);
            ctxInst.fill();
            ctxInst.shadowColor = 'transparent';

            ctxInst.fillStyle = '#050505';
            let ww = w * 0.2, wh = h * 0.2;
            ctxInst.save(); ctxInst.translate(-w/2 + ww/2, -h/2 + wh); ctxInst.rotate(steerAngle); drawRoundRect(ctxInst, -ww/2, -wh/2, ww, wh, 2); ctxInst.fill(); ctxInst.restore();
            ctxInst.save(); ctxInst.translate(w/2 - ww/2, -h/2 + wh); ctxInst.rotate(steerAngle); drawRoundRect(ctxInst, -ww/2, -wh/2, ww, wh, 2); ctxInst.fill(); ctxInst.restore();
            drawRoundRect(ctxInst, -w/2, h/2 - wh*1.2, ww, wh, 2); ctxInst.fill();
            drawRoundRect(ctxInst, w/2 - ww, h/2 - wh*1.2, ww, wh, 2); ctxInst.fill();

            ctxInst.shadowColor = rgbaFromHex(glow, 0.28);
            ctxInst.shadowBlur = 18;
            let bodyGrad = ctxInst.createLinearGradient(-w/2, -h/2, w/2, h/2);
            bodyGrad.addColorStop(0, shadeColor(color, 64));
            bodyGrad.addColorStop(0.18, accent);
            bodyGrad.addColorStop(0.34, color);
            bodyGrad.addColorStop(0.82, shadeColor(color, -16));
            bodyGrad.addColorStop(1, shadeColor(color, -58));
            ctxInst.fillStyle = bodyGrad;

            ctxInst.beginPath();
            if (type === 'aventador' || type === 'f1') {
                ctxInst.moveTo(0, -h/2);
                ctxInst.lineTo(w/2, -h/4);
                ctxInst.lineTo(w/2, h/2 - 4);
                ctxInst.lineTo(-w/2, h/2 - 4);
                ctxInst.lineTo(-w/2, -h/4);
            } else {
                ctxInst.moveTo(-w/2 + 4, -h/2);
                ctxInst.lineTo(w/2 - 4, -h/2);
                ctxInst.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + 8);
                ctxInst.lineTo(w/2 + 2, 0);
                ctxInst.lineTo(w/2, h/2 - 8);
                ctxInst.quadraticCurveTo(w/2, h/2, w/2 - 4, h/2);
                ctxInst.lineTo(-w/2 + 4, h/2);
                ctxInst.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - 8);
                ctxInst.lineTo(-w/2 - 2, 0);
                ctxInst.lineTo(-w/2, -h/2 + 8);
                ctxInst.quadraticCurveTo(-w/2, -h/2, -w/2 + 4, -h/2);
            }
            ctxInst.fill();
            ctxInst.shadowBlur = 0;

            ctxInst.strokeStyle = rgbaFromHex(accent, 0.85);
            ctxInst.lineWidth = Math.max(1.5, w * 0.045);
            ctxInst.stroke();

            ctxInst.fillStyle = '#0a0a0a';
            if (type !== 'f1') {
                ctxInst.beginPath();
                ctxInst.moveTo(-w/2 + 6, -h/4 - 2);
                ctxInst.quadraticCurveTo(0, -h/4 - 8, w/2 - 6, -h/4 - 2);
                ctxInst.lineTo(w/2 - 8, -h/8);
                ctxInst.lineTo(-w/2 + 8, -h/8);
                ctxInst.fill();

                ctxInst.beginPath();
                ctxInst.moveTo(-w/2 + 8, h/4);
                ctxInst.lineTo(w/2 - 8, h/4);
                ctxInst.lineTo(w/2 - 6, h/4 + h/8);
                ctxInst.quadraticCurveTo(0, h/4 + h/8 + 4, -w/2 + 6, h/4 + h/8);
                ctxInst.fill();

                ctxInst.beginPath(); ctxInst.moveTo(-w/2 + 3, -h/8 + 2); ctxInst.lineTo(-w/2 + 5, h/4 - 2); ctxInst.lineTo(-w/4, h/4 - 2); ctxInst.lineTo(-w/4, -h/8 + 2); ctxInst.fill();
                ctxInst.beginPath(); ctxInst.moveTo(w/2 - 3, -h/8 + 2); ctxInst.lineTo(w/2 - 5, h/4 - 2); ctxInst.lineTo(w/4, h/4 - 2); ctxInst.lineTo(w/4, -h/8 + 2); ctxInst.fill();

                let roofGrad = ctxInst.createLinearGradient(0, -h/8, 0, h/4);
                roofGrad.addColorStop(0, shadeColor(color, 18));
                roofGrad.addColorStop(1, shadeColor(color, -36));
                ctxInst.fillStyle = roofGrad;
                drawRoundRect(ctxInst, -w/4, -h/8, w/2, h/4 + h/8, 4);
                ctxInst.fill();
            } else {
                ctxInst.fillRect(-w/4, -h/8, w/2, h/4);
            }

            let glassGrad = ctxInst.createLinearGradient(-w/2, -h/4, w/2, h/4);
            glassGrad.addColorStop(0, 'rgba(255,255,255,0)');
            glassGrad.addColorStop(0.35, 'rgba(255,255,255,0.04)');
            glassGrad.addColorStop(0.5, 'rgba(105,233,255,0.36)');
            glassGrad.addColorStop(0.68, 'rgba(255,255,255,0)');
            ctxInst.fillStyle = glassGrad;
            ctxInst.fillRect(-w/2, -h/2, w, h);

            ctxInst.fillStyle = '#e2e8f0';
            ctxInst.shadowColor = rgbaFromHex(glow, 0.6);
            ctxInst.shadowBlur = 12;
            ctxInst.beginPath(); ctxInst.moveTo(-w/2 + 2, -h/2 + 2); ctxInst.lineTo(-w/4, -h/2 + 6); ctxInst.lineTo(-w/2 + 2, -h/2 + 8); ctxInst.fill();
            ctxInst.beginPath(); ctxInst.moveTo(w/2 - 2, -h/2 + 2); ctxInst.lineTo(w/4, -h/2 + 6); ctxInst.lineTo(w/2 - 2, -h/2 + 8); ctxInst.fill();
            ctxInst.shadowBlur = 0;

            ctxInst.fillStyle = isBraking ? '#ff365d' : '#7f1029';
            ctxInst.shadowColor = isBraking ? '#ff365d' : 'transparent';
            ctxInst.shadowBlur = isBraking ? 15 : 0;
            ctxInst.fillRect(-w/2 + 4, h/2 - 4, w/4, 4);
            ctxInst.fillRect(w/2 - w/4 - 4, h/2 - 4, w/4, 4);
            ctxInst.shadowBlur = 0;

            ctxInst.fillStyle = rgbaFromHex(accent, 0.7);
            ctxInst.fillRect(-w * 0.16, -h * 0.1, w * 0.32, 3);

            if (isTurbo) {
                ctxInst.fillStyle = accent;
                ctxInst.shadowColor = glow;
                ctxInst.shadowBlur = 18;
                ctxInst.beginPath();
                ctxInst.arc(-w/4, h/2 + 4 + Math.random()*6, 3 + Math.random()*2, 0, Math.PI*2);
                ctxInst.arc(w/4, h/2 + 4 + Math.random()*6, 3 + Math.random()*2, 0, Math.PI*2);
                ctxInst.fill();
                ctxInst.shadowBlur = 0;
            }

            ctxInst.restore();
        }

        function drawSkyline(biome) {
            ctx.save();

            const skyGlow = ctx.createLinearGradient(0, 0, 0, ch * 0.52);
            skyGlow.addColorStop(0, biome.haze);
            skyGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = skyGlow;
            ctx.fillRect(0, 0, cw, ch * 0.55);

            const horizon = ch * 0.26;
            ctx.fillStyle = rgbaFromHex(biome.skyline, 0.18);
            for (let i = 0; i < 11; i++) {
                const width = cw / 14 + (i % 3) * 8;
                const x = (i * cw / 10.5) - 10;
                const height = horizon * (0.4 + ((i % 4) * 0.13));
                ctx.fillRect(x, horizon - height, width, height);
                ctx.fillStyle = rgbaFromHex(biome.skyline, 0.33);
                for (let j = 0; j < 4; j++) {
                    const wx = x + 6 + j * 10;
                    if (wx < x + width - 4) ctx.fillRect(wx, horizon - height + 8, 3, Math.max(8, height - 18));
                }
                ctx.fillStyle = rgbaFromHex(biome.skyline, 0.18);
            }

            ctx.strokeStyle = rgbaFromHex(biome.skyline, 0.32);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, horizon + 8);
            ctx.lineTo(cw, horizon + 8);
            ctx.stroke();

            ctx.restore();
        }

        function drawRoadDecor(biome, startX, roadW, laneW) {
            const shoulderGlow = ctx.createLinearGradient(0, 0, 0, ch);
            shoulderGlow.addColorStop(0, rgbaFromHex(biome.laneGlow, 0.26));
            shoulderGlow.addColorStop(0.5, rgbaFromHex(biome.laneGlow, 0.08));
            shoulderGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = shoulderGlow;
            ctx.fillRect(startX - 10, 0, 10, ch);
            ctx.fillRect(startX + roadW, 0, 10, ch);

            ctx.fillStyle = rgbaFromHex(biome.skyline, 0.12);
            for (let y = (roadOffset % 90) - 90; y < ch; y += 90) {
                ctx.fillRect(startX - 20, y, 7, 34);
                ctx.fillRect(startX + roadW + 13, y + 18, 7, 34);
            }

            ctx.strokeStyle = rgbaFromHex(biome.laneGlow, 0.24);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(startX + laneW * 2, 0);
            ctx.lineTo(startX + laneW * 2, ch);
            ctx.stroke();
        }

        function drawRoadArrows(startX, roadW) {
            const centerX = startX + roadW * 0.5;
            for (let y = (roadOffset % 180) - 180; y < ch + 40; y += 180) {
                drawNeonArrow(ctx, centerX, y + 90, 18, 'right', 'rgba(105, 233, 255, 0.32)');
                drawNeonArrow(ctx, centerX, y + 132, 18, 'left', 'rgba(255, 82, 209, 0.24)');
            }
        }

        function draw() {
            let biome = BIOMES[currentBiome];

            const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
            bgGrad.addColorStop(0, shadeColor(biome.bg, 16));
            bgGrad.addColorStop(0.5, biome.bg);
            bgGrad.addColorStop(1, shadeColor(biome.bg, -16));
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, cw, ch);
            drawSkyline(biome);

            ctx.save();
            if (shakeTime > 0) ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15);

            let { roadW, laneW } = getScale();
            let startX = (cw - roadW) / 2;

            let roadGrad = ctx.createLinearGradient(startX, 0, startX + roadW, 0);
            roadGrad.addColorStop(0, shadeColor(biome.road, -30));
            roadGrad.addColorStop(0.08, shadeColor(biome.road, -8));
            roadGrad.addColorStop(0.5, biome.road);
            roadGrad.addColorStop(0.92, shadeColor(biome.road, -8));
            roadGrad.addColorStop(1, shadeColor(biome.road, -30));
            ctx.fillStyle = roadGrad;
            ctx.fillRect(startX, 0, roadW, ch);

            const roadGloss = ctx.createLinearGradient(0, 0, 0, ch);
            roadGloss.addColorStop(0, rgbaFromHex('#ffffff', 0.08));
            roadGloss.addColorStop(0.3, 'rgba(255,255,255,0)');
            roadGloss.addColorStop(1, 'rgba(255,255,255,0.03)');
            ctx.fillStyle = roadGloss;
            ctx.fillRect(startX, 0, roadW, ch);

            drawRoadDecor(biome, startX, roadW, laneW);

            ctx.fillStyle = 'rgba(255,255,255,0.52)';
            for (let i = 1; i < 4; i++) {
                let lx = startX + i * laneW;
                if (i === 2) {
                    ctx.shadowColor = rgbaFromHex(biome.laneGlow, 0.4);
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(lx - 3, 0, 2, ch);
                    ctx.fillRect(lx + 1, 0, 2, ch);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.52)';
                } else {
                    for (let y = (roadOffset % 120) - 120; y < ch; y += 120) {
                        ctx.fillRect(lx - 2, y, 4, 40);
                    }
                }
            }

            drawRoadArrows(startX, roadW);

            const selectedCar = CAR_DEFS[selectedCarId];
            const speedRatio = Math.max(0, Math.min(1, currentSpeed / Math.max(1, baseSpeed * selectedCar.speedMult * 1.4)));
            drawSpeedLines(speedRatio);

            sideObjs.forEach(obj => {
                ctx.save(); ctx.translate(obj.x, obj.y);
                ctx.fillStyle = 'rgba(0,0,0,0.42)';
                ctx.beginPath(); ctx.ellipse(5, 7, obj.size/2, obj.size/3, 0, 0, Math.PI*2); ctx.fill();

                let tone = obj.hue === 'cool' ? biome.obj2 : biome.obj1;
                let bloom = obj.hue === 'cool' ? biome.skyline : '#ff9b5f';
                let grad = ctx.createRadialGradient(-obj.size/6, -obj.size/6, 0, 0, 0, obj.size/2);
                grad.addColorStop(0, shadeColor(tone, 26));
                grad.addColorStop(0.72, tone);
                grad.addColorStop(1, shadeColor(tone, -42));
                ctx.fillStyle = grad;
                ctx.shadowColor = rgbaFromHex(bloom, 0.28);
                ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(0, 0, obj.size/2, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = rgbaFromHex(bloom, 0.55);
                ctx.fillRect(-2, -obj.size * 0.45, 4, obj.size * 0.25);
                ctx.restore();
            });

            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            skidMarks.forEach(s => {
                ctx.globalAlpha = s.life;
                ctx.fillRect(s.x - 2, s.y, 4, 12);
            });
            ctx.globalAlpha = 1.0;

            enemies.forEach(e => drawRealisticCar(ctx, e.x, e.y, e.w, e.h, e.color, e.type, 0, false, false, e.accent || '#69e9ff', e.glow || '#ffffff'));

            if (gameState !== 'CRASHING' || Math.floor(Date.now() / 100) % 2 === 0) {
                drawRealisticCar(
                    ctx,
                    player.x,
                    player.y,
                    player.w,
                    player.h,
                    selectedCar.color,
                    selectedCar.type,
                    currentSteer * 0.6,
                    keys.brake || keys.hb,
                    keys.turbo && turboMeter > 0 && gameState === 'PLAYING',
                    selectedCar.accent,
                    selectedCar.glow
                );

                ctx.save();
                ctx.translate(player.x, player.y - player.h * 0.48);
                ctx.shadowColor = rgbaFromHex(selectedCar.glow, 0.46);
                ctx.shadowBlur = 18;
                ctx.fillStyle = rgbaFromHex(selectedCar.accent, 0.72);
                ctx.beginPath();
                ctx.arc(0, 0, player.w * 0.26, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;

            ctx.textAlign = 'center';
            ctx.font = '700 24px "Exo 2", system-ui, sans-serif';
            texts.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.globalAlpha = t.life;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 6;
                ctx.fillText(t.text, t.x, t.y);
            });
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;

            ctx.restore();
        }

        // --- Shop Logic ---
        function renderShop() {
            const list = document.getElementById('car-list');
            list.innerHTML = '';

            CAR_DEFS.forEach((car, i) => {
                const isUnlocked = unlockedCars.includes(i);
                const isSelected = selectedCarId === i;
                const canAfford = totalMoney >= car.cost;

                let btnText = isSelected ? 'Equipped' : (isUnlocked ? 'Select' : `Buy $${car.cost}`);
                let btnState = isSelected ? 'equipped' : (isUnlocked ? 'select' : (canAfford ? 'buy' : 'locked'));

                const div = document.createElement('div');
                div.className = 'glass-panel shop-card';
                div.innerHTML = `
                    <div class="shop-card-left">
                        <canvas id="shop-car-${i}" width="70" height="90" class="shop-preview"></canvas>
                        <div class="shop-text">
                            <div class="shop-car-name">${car.name}</div>
                            <div class="shop-car-meta">Max Spd: x${car.speedMult}</div>
                        </div>
                    </div>
                    <button class="shop-btn ${btnState}" onclick="handleShopAction(${i}, ${canAfford}, event)">${btnText}</button>
                `;
                list.appendChild(div);

                setTimeout(() => {
                    let c = document.getElementById(`shop-car-${i}`);
                    if (c) {
                        let ctx2 = c.getContext('2d');
                        ctx2.clearRect(0, 0, c.width, c.height);
                        ctx2.translate(35, 45);
                        drawRealisticCar(ctx2, 0, 0, 32, 64, car.color, car.type, 0, false, false, car.accent, car.glow);
                    }
                }, 0);
            });
        }

        window.handleShopAction = function(i, canAfford, e) {
            e.stopPropagation();
            unlockAudio();
            if (!unlockedCars.includes(i)) {
                if (canAfford) {
                    totalMoney -= CAR_DEFS[i].cost;
                    unlockedCars.push(i);
                    selectedCarId = i;
                    playSfx('buy');
                } else {
                    return;
                }
            } else {
                selectedCarId = i;
            }
            saveData();
            document.getElementById('shop-money').innerText = '$' + totalMoney;
            renderShop();
        };

        // --- Input & Resize ---
        function bindButton(id, key) {
            const btn = document.getElementById(id);
            if(!btn) return;
            const press = (e) => {
                e.preventDefault();
                keys[key] = true;
                btn.classList.add('is-pressed');
                unlockAudio();
                if (key === 'hb' || key === 'turbo') playSfx('ui');
            };
            const release = (e) => {
                e.preventDefault();
                keys[key] = false;
                btn.classList.remove('is-pressed');
            };
            btn.addEventListener('pointerdown', press, { passive: false });
            btn.addEventListener('pointerup', release, { passive: false });
            btn.addEventListener('pointercancel', release, { passive: false });
            btn.addEventListener('pointerleave', release, { passive: false });
        }

        function resize(entries) {
            for (let entry of entries) {
                let { width, height } = entry.contentRect;
                if (width === 0 || height === 0) continue;
                cw = width; ch = height;
                canvas.width = cw * dpr; canvas.height = ch * dpr;
                canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                if (!initialized) {
                    initGame();
                    setState('PLAYING');
                    initialized = true;
                    requestAnimationFrame(gameLoop);
                } else {
                    let { roadW, carW, carH } = getScale();
                    player.w = carW; player.h = carH;
                    player.y = Math.min(player.y, ch - carH - 20);
                    let roadLeft = (cw - roadW) / 2 + player.w/2;
                    let roadRight = cw - (cw - roadW) / 2 - player.w/2;
                    player.x = Math.max(roadLeft, Math.min(roadRight, player.x));
                    enemies.forEach(e => { e.w = carW; e.h = carH; });
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ro = new ResizeObserver(resize);
            ro.observe(canvas);

            bindButton('btn-left', 'left');
            bindButton('btn-right', 'right');
            bindButton('btn-gas', 'gas');
            bindButton('btn-brake', 'brake');
            bindButton('btn-handbrake', 'hb');
            bindButton('btn-turbo', 'turbo');

            document.addEventListener('pointerdown', unlockAudio, { once: true });

            document.getElementById('restart-btn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); playSfx('ui'); restartGame(); });
            document.getElementById('shop-btn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); playSfx('ui'); setState('SHOP'); });
            document.getElementById('shop-back-btn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); playSfx('ui'); setState('GAMEOVER'); });
        });
    </script>
</body>
