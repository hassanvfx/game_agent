<script>
/**
 * AUDIO MANAGER
 * Handles Web Audio API with oscillator fallbacks
 */
class AudioManager {
    constructor() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = AudioCtx ? new AudioCtx() : null;
        this.buffers = {};
        this.lastPlayedAt = {};
        this.isMuted = false;
        this.bgmNode = document.getElementById('bgm_main');

        const unlock = () => {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };
        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock);
    }

    async loadSound(id, fallbackType) {
        const el = document.getElementById(id);
        if (!el) return;
        if (!this.ctx) {
            this.buffers[id] = fallbackType;
            return;
        }
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using fallback`, e);
            this.buffers[id] = fallbackType;
        }
    }

    async unlock() {
        if (this.ctx && this.ctx.state === 'suspended') {
            try {
                await this.ctx.resume();
            } catch (_) {}
        }
    }

    async playBgm() {
        if (!this.bgmNode) return;
        await this.unlock();
        this.bgmNode.volume = 0.2;
        this.bgmNode.play().catch(() => {});
    }

    stopBgm() {
        if (!this.bgmNode) return;
        this.bgmNode.pause();
        this.bgmNode.currentTime = 0;
    }

    async playSfx(id, options = {}) {
        if (this.isMuted) return;
        const now = performance.now();
        const minInterval = options.minInterval ?? 90;
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < minInterval) {
            return;
        }
        this.lastPlayedAt[id] = now;
        await this.unlock();
        const buffer = this.buffers[id];

        if (this.ctx && buffer && typeof buffer !== 'string') {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = options.volume ?? 0.55;
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(buffer || 'beep', options.volume);
        }
    }

    synthesize(type, volume = 0.24) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'warning') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(660, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(420, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.18);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.24);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.24);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.24);
        } else if (type === 'start') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.14);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.16);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(820, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1280, this.ctx.currentTime + 0.11);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        }
    }
}

// Initialization
class MediaFeedbackManager {
    constructor() {
        this.successNode = document.getElementById('success-gif');
        this.failNode = document.getElementById('fail-gif');
        this.timers = {};
    }

    flash(type, duration = 1200) {
        const node = type === 'success' ? this.successNode : this.failNode;
        if (!node) return;
        clearTimeout(this.timers[type]);
        node.classList.add('visible');
        this.timers[type] = setTimeout(() => {
            node.classList.remove('visible');
        }, duration);
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    // Parse Config
    const configEl = document.getElementById('game-config');
    const configDef = JSON.parse(configEl.textContent);
    window.gameConfigDefs = configDef;
    window.gameConfig = {};
    for (let key in configDef) {
        window.gameConfig[key] = configDef[key].value;
    }
    
    // Setup Audio
    audioManager = new AudioManager();
    mediaFeedback = new MediaFeedbackManager();
    await audioManager.loadSound('sfx_start', 'start');
    await audioManager.loadSound('sfx_correct', 'beep');
    await audioManager.loadSound('sfx_wrong', 'fail');
    await audioManager.loadSound('sfx_warning', 'warning');

    // Resize
    resize();
    window.addEventListener('resize', resize);

    // Setup Inputs
    setupInput();

    // Start Loop
    requestAnimationFrame(gameLoop);
    
    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    document.getElementById('channel-name').textContent = window.gameConfig.gameTitle.toUpperCase();
});

// Hot Reload Support
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') {
            document.getElementById('channel-name').textContent = val.toUpperCase();
        }
    }
};

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    setupButtons();
}

function setupButtons() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const btnH = 80;
    const btnY = h - btnH - 20;
    const gap = 10;
    const btnW = (w - 40 - (gap * 2)) / 3;

    buttons = [
        { id: TYPE_TROLL, x: 20, y: btnY, w: btnW, h: btnH, color: COLORS[TYPE_TROLL], label: "BLOCK", icon: "🚫" },
        { id: TYPE_FAN, x: 20 + btnW + gap, y: btnY, w: btnW, h: btnH, color: COLORS[TYPE_FAN], label: "BOOST", icon: "💚" },
        { id: TYPE_MEME, x: 20 + (btnW + gap) * 2, y: btnY, w: btnW, h: btnH, color: COLORS[TYPE_MEME], label: "RIDE", icon: "😂" }
    ];
}

function setupInput() {
    const handleInput = (e) => {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        
        // Handle multi-touch
        const touches = e.touches || [e];
        // We only care about the first point for simplicity in this contract, 
        // but pointer events are better.
    };
    
    // Using pointer events as per contract
    canvas.addEventListener('pointerdown', (e) => {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check buttons
        for (let btn of buttons) {
            if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                triggerAction(btn.id);
                createButtonPulse(btn);
                return;
            }
        }
    }, { passive: false });
}

async function startGame() {
    score = 0;
    hype = 100;
    gameSpeed = 1;
    combo = 0;
    messages = [];
    particles = [];
    warningArmed = false;

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('score-val').textContent = '0';

    gameState = 'PLAYING';
    audioManager.playSfx('sfx_start', { volume: 0.42, minInterval: 120 });
    await audioManager.playBgm();

    // Initial spawn
    spawnMessage();
}

function gameOver() {
    gameState = 'GAMEOVER';
    audioManager.stopBgm();
    audioManager.playSfx('sfx_wrong', { volume: 0.5, minInterval: 120 });
    mediaFeedback.flash('fail', 1600);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('final-score').textContent = score;
}

function spawnMessage() {
    const types = [TYPE_TROLL, TYPE_FAN, TYPE_MEME];
    // Bias towards Fans early on, Trolls later
    const type = types[Math.floor(Math.random() * types.length)];
    const textList = TEXTS[type];
    const text = textList[Math.floor(Math.random() * textList.length)];
    
    // Spawn at bottom (above buttons)
    // Messages flow UP
    // Wait, let's make them flow DOWN like Tetris/Guitar Hero?
    // User expects chat to flow UP.
    // BUT for a game, falling down to buttons is more intuitive (Guitar Hero style).
    // Let's do: Spawn at Top, Fall Down. It feels like "incoming messages".
    
    messages.push({
        x: 20 + Math.random() * (window.innerWidth - 300), // Random x offset slightly
        y: -60,
        type: type,
        text: text,
        w: 0, // calc later
        h: 50,
        active: true,
        scale: 0
    });
}

function triggerAction(actionType) {
    // Find the LOWEST active message (closest to bottom)
    // Since we spawn at top and y increases, we want the message with highest y that is still on screen
    let targetIdx = -1;
    let maxY = -1000;

    // Filter messages that are "playable" (on screen, not too high up)
    // Actually, let's just take the one closest to the "Action Line" (buttons)
    const buttonY = buttons[0].y;

    for (let i = 0; i < messages.length; i++) {
        if (messages[i].active && messages[i].y > maxY && messages[i].y < buttonY + 50) {
            maxY = messages[i].y;
            targetIdx = i;
        }
    }

    if (targetIdx !== -1) {
        const msg = messages[targetIdx];
        if (msg.type === actionType) {
            // Success
            successHit(msg);
        } else {
            // Wrong button
            failHit("WRONG!");
        }
    } else {
        // No message to hit
        failHit("MISS!");
    }
}

function successHit(msg) {
    msg.active = false;
    score += 10 + combo;
    combo++;
    hype = Math.min(100, hype + 5);
    gameSpeed = Math.min(3, 1 + (score / 500));
    
    audioManager.playSfx('sfx_correct', { volume: 0.45, minInterval: 70 });
    mediaFeedback.flash('success', msg.type === TYPE_MEME ? 1600 : 1000);

    // Juice
    createParticles(msg.x + 100, msg.y + 25, COLORS[msg.type], 10);
    createFloatingText(msg.x + 100, msg.y, "+"+(10+combo), "#fff");
    
    // Screen shake slightly
    ctx.save();
    ctx.translate(Math.random()*4-2, Math.random()*4-2);
    ctx.restore();
}

function failHit(reason) {
    combo = 0;
    hype -= 15;
    audioManager.playSfx('sfx_wrong', { volume: 0.48, minInterval: 90 });
    mediaFeedback.flash('fail', reason === "IGNORED" ? 1200 : 900);
    // Shake
    const offset = 10;
    canvas.style.transform = `translate(${Math.random()*offset-offset/2}px, ${Math.random()*offset-offset/2}px)`;
    setTimeout(() => canvas.style.transform = 'none', 50);
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 5 + 2
        });
    }
}

function createFloatingText(x, y, text, color) {
    particles.push({
        x: x, y: y,
        vx: 0, vy: -2,
        life: 1.0,
        text: text,
        color: color,
        isText: true
    });
}

function createButtonPulse(btn) {
    particles.push({
        x: btn.x + btn.w/2,
        y: btn.y + btn.h/2,
        size: btn.w,
        life: 0.5,
        color: btn.color,
        isPulse: true
    });
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Spawn logic
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnMessage();
        // Configurable spawn rate
        const baseSpeed = 2.0 / window.gameConfig.spawnSpeed; 
        spawnTimer = (baseSpeed / gameSpeed) * 1000;
    }

    // Update Messages
    const buttonY = buttons[0].y;
    for (let i = messages.length - 1; i >= 0; i--) {
        let m = messages[i];
        if (!m.active) {
            messages.splice(i, 1);
            continue;
        }

        // Move down
        m.y += (100 * gameSpeed * (dt/1000) * window.gameConfig.spawnSpeed); // Pixels per second
        
        // Scale in effect
        if (m.scale < 1) m.scale += dt/200;

        // Check miss
        if (m.y > buttonY) {
            m.active = false;
            failHit("IGNORED");
        }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt / 500;
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        if (!p.isPulse && !p.isText) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5; // gravity
        } else if (p.isText) {
            p.y += p.vy;
        }
    }

    // Hype decay
    hype -= (dt / 1000) * 2; // Lose 2 hype per second naturally
    if (hype <= 28 && !warningArmed) {
        warningArmed = true;
        audioManager.playSfx('sfx_warning', { volume: 0.36, minInterval: 500 });
    } else if (hype > 40) {
        warningArmed = false;
    }
    if (hype <= 0) gameOver();

    // Update UI
    document.getElementById('score-val').textContent = score;
    document.getElementById('hype-bar').style.width = Math.max(0, hype) + '%';
    if (hype < 30) document.getElementById('hype-bar').classList.add('bg-red-500');
    else document.getElementById('hype-bar').classList.remove('bg-red-500');
}

function draw() {
    // Clear
    ctx.fillStyle = '#202225'; // Discord Dark
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Grid/Background
    ctx.strokeStyle = '#2f3136';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i=0; i<canvas.width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
    ctx.stroke();

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        // Draw Messages
             ctx.font = '600 20px "Rajdhani"';
        for (let m of messages) {
            const bubbleW = ctx.measureText(m.text).width + 60;
            
            ctx.save();
            ctx.translate(m.x + bubbleW/2, m.y + 25);
            ctx.scale(Math.min(1, m.scale), Math.min(1, m.scale));
            ctx.translate(-(m.x + bubbleW/2), -(m.y + 25));

            // Bubble
            const bubbleGradient = ctx.createLinearGradient(m.x, m.y, m.x, m.y + 50);
            bubbleGradient.addColorStop(0, 'rgba(28, 34, 74, 0.96)');
            bubbleGradient.addColorStop(1, 'rgba(10, 14, 28, 0.96)');
            ctx.fillStyle = bubbleGradient;
            // Border based on type
            ctx.lineWidth = 3;
            ctx.strokeStyle = COLORS[m.type];
            
            // Rounded rect
            const r = 10;
            ctx.beginPath();
            ctx.moveTo(m.x+r, m.y);
            ctx.lineTo(m.x+bubbleW-r, m.y);
            ctx.quadraticCurveTo(m.x+bubbleW, m.y, m.x+bubbleW, m.y+r);
            ctx.lineTo(m.x+bubbleW, m.y+50-r);
            ctx.quadraticCurveTo(m.x+bubbleW, m.y+50, m.x+bubbleW-r, m.y+50);
            ctx.lineTo(m.x+r, m.y+50);
            ctx.quadraticCurveTo(m.x, m.y+50, m.x, m.y+50-r);
            ctx.lineTo(m.x, m.y+r);
            ctx.quadraticCurveTo(m.x, m.y, m.x+r, m.y);
            ctx.fill();
            ctx.stroke();

            // Icon
            ctx.fillStyle = '#fff';
            ctx.fillText(ICONS[m.type], m.x + 10, m.y + 32);

            // Text
            ctx.fillStyle = '#eef2ff';
            ctx.fillText(m.text, m.x + 45, m.y + 32);

            ctx.restore();
        }

        // Draw Buttons
        for (let btn of buttons) {
            const buttonGradient = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
            buttonGradient.addColorStop(0, 'rgba(24, 31, 64, 0.98)');
            buttonGradient.addColorStop(1, 'rgba(9, 12, 27, 0.98)');
            ctx.fillStyle = buttonGradient;
            ctx.beginPath();
            ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 18);
            ctx.fill();

            // Border (Active/Glow)
            ctx.strokeStyle = btn.color;
            ctx.lineWidth = 4;
            ctx.stroke();

            // Ambient top line
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(btn.x + 10, btn.y + 10);
            ctx.lineTo(btn.x + btn.w - 10, btn.y + 10);
            ctx.stroke();

            // Icon & Label
            ctx.fillStyle = btn.color;
            ctx.font = '28px Audiowide';
            ctx.textAlign = 'center';
            ctx.fillText(btn.icon, btn.x + btn.w/2, btn.y + btn.h/2 - 5);
            ctx.font = '700 16px "Rajdhani"';
            ctx.fillStyle = '#fff';
            ctx.fillText(btn.label, btn.x + btn.w/2, btn.y + btn.h/2 + 20);
        }

        // Draw Particles
        for (let p of particles) {
            ctx.globalAlpha = p.life;
            if (p.isPulse) {
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size + (1-p.life)*50, 0, Math.PI*2);
                ctx.stroke();
            } else if (p.isText) {
                ctx.fillStyle = p.color;
                ctx.font = '28px Audiowide';
                ctx.fillText(p.text, p.x, p.y);
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        ctx.textAlign = 'left'; // Reset
    }
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(gameLoop);
}

// Polyfill for roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    };
}
