<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Arcade Outfit Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap');
        
        :root {
            --pink-100: #fff2fb;
            --pink-50: #fff8fd;
            --pink-500: #ff4fa3;
            --pink-600: #f0328c;
            --purple-200: #e9d5ff;
            --gray-300: #d1d5db;
            --gray-600: #6b6f8d;
            --gray-700: #2f3150;
            --gray-800: #181a2f;
            --white: #ffffff;
            --black-overlay: rgba(10, 8, 28, 0.52);
            --bg-top: #261445;
            --bg-bottom: #4f2b74;
            --stage-light: rgba(255, 255, 255, 0.8);
            --panel-fill: rgba(24, 26, 47, 0.68);
            --panel-stroke: rgba(255, 255, 255, 0.24);
            --cyan-400: #75f7ff;
            --cyan-500: #35d9ff;
            --gold-400: #ffd36e;
            --violet-400: #a78bfa;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Exo 2', system-ui, sans-serif; 
            background:
                radial-gradient(circle at top, rgba(117, 247, 255, 0.16), transparent 28%),
                linear-gradient(180deg, var(--bg-top) 0%, #341a58 42%, var(--bg-bottom) 100%);
            background-color: var(--bg-top);
            color: var(--white);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .w-full { width: 100%; }
        .w-32 { width: 8rem; }
        .w-48 { width: 12rem; }
        .h-full { height: 100%; }
        .h-2 { height: 0.5rem; }
        .p-6 { padding: 1.5rem; }
        .p-10 { padding: 2.5rem; }
        .pb-10 { padding-bottom: 2.5rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .max-w-sm { max-width: 24rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-3xl { border-radius: 1.5rem; }
        .overflow-hidden { overflow: hidden; }
        .text-center { text-align: center; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }
        .tracking-wider { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .text-white { color: var(--white); }
        .text-gray-600 { color: var(--gray-600); }
        .text-gray-800 { color: var(--gray-800); }
        .text-pink-600 { color: var(--pink-600); }
        .bg-white { background: var(--white); }
        .bg-white\/10 { background: rgba(255, 255, 255, 0.1); }
        .bg-white\/30 { background: rgba(255, 255, 255, 0.3); }
        .bg-black\/40 { background: var(--black-overlay); }
        .bg-gray-300 { background: var(--gray-300); }
        .bg-gray-900 { background: #111827; }
        .bg-pink-600 { background: var(--pink-600); }
        .bg-red-400 { background: #f87171; }
        .bg-blue-400 { background: #60a5fa; }
        .bg-green-400 { background: #4ade80; }
        .border { border-width: 1px; border-style: solid; }
        .border-white\/60 { border-color: rgba(255, 255, 255, 0.6); }
        .shadow-md { box-shadow: 0 4px 10px rgba(17, 24, 39, 0.16); }
        .shadow-lg { box-shadow: 0 10px 20px rgba(17, 24, 39, 0.2); }
        .shadow-xl { box-shadow: 0 16px 30px rgba(17, 24, 39, 0.22); }
        .shadow-2xl { box-shadow: 0 18px 36px rgba(17, 24, 39, 0.28); }
        .drop-shadow-sm { text-shadow: 0 2px 4px rgba(255,255,255,0.35); }
        .transition { transition: all 0.2s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .transition-all { transition: all 0.2s ease; }
        .backdrop-blur-sm { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .hover\:shadow-2xl:hover { box-shadow: 0 18px 36px rgba(17, 24, 39, 0.28); }
        .hover\:bg-pink-700:hover { background: #be185d; }
        .animate-pulse { animation: pulse-feedback 0.2s ease-in-out; }

        @keyframes pulse-feedback {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }

        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .text-5xl { font-size: 2.3rem; }
            .text-4xl { font-size: 1.9rem; }
            .text-3xl { font-size: 1.5rem; }
            .w-48 { width: min(12rem, 80vw); }
            .media-overlay {
                right: 0.8rem;
                bottom: 10rem;
                width: min(34vw, 6.75rem);
            }
            .feedback-chip {
                min-width: 5.4rem;
                font-size: 0.72rem;
                padding: 0.4rem 0.65rem;
            }
            #controls > div:first-child,
            #controls > div:nth-child(2) {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
        
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05)),
                var(--panel-fill);
            backdrop-filter: blur(14px); 
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                0 12px 32px rgba(6, 8, 28, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .fashion-font { font-family: 'Audiowide', sans-serif; letter-spacing: 0.04em; }
        .ui-font { font-family: 'Exo 2', system-ui, sans-serif; }
        .media-overlay {
            position: absolute;
            right: 1rem;
            bottom: 9rem;
            width: min(28vw, 8.5rem);
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            align-items: flex-end;
            z-index: 2;
        }
        .reaction-gif {
            width: 100%;
            max-width: 8.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 14px 28px rgba(8, 10, 30, 0.32);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            background: rgba(24, 26, 47, 0.7);
        }
        .reaction-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        .feedback-chip {
            min-width: 6.5rem;
            padding: 0.45rem 0.8rem;
            border-radius: 9999px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--white);
            background: rgba(24, 26, 47, 0.78);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 10px 22px rgba(8, 10, 30, 0.26);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .feedback-chip.active {
            opacity: 1;
            transform: translateY(0);
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 18%, rgba(117, 247, 255, 0.18), transparent 18%),
                radial-gradient(circle at 82% 22%, rgba(255, 211, 110, 0.18), transparent 20%),
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 18%, transparent 82%, rgba(0,0,0,0.18));
            z-index: 0;
        }

        #ui-layer { position: relative; z-index: 1; }

        #hud .glass-panel,
        #controls .bg-white\/30,
        #start-screen .glass-panel,
        #game-over-screen .glass-panel {
            position: relative;
            overflow: hidden;
        }

        #hud .glass-panel::after,
        #controls .bg-white\/30::after,
        #start-screen .glass-panel::after,
        #game-over-screen .glass-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255,255,255,0.18), transparent 28%, transparent 72%, rgba(117, 247, 255, 0.14));
        }

        /* Custom UI Buttons */
        .color-btn {
            width: 48px; height: 48px; border-radius: 50%; border: 3px solid white;
            transition: transform 0.1s; cursor: pointer;
        }
        .color-btn:active { transform: scale(0.9); }
        .color-btn.selected { border-color: #1f2937; transform: scale(1.1); }

        .type-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(235,238,255,0.84));
            color: var(--gray-800); padding: 10px 16px; border-radius: 20px;
            font-weight: 700; font-size: 0.9rem; border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer; transition: all 0.2s;
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.06em;
            box-shadow: 0 10px 18px rgba(9, 10, 25, 0.18);
        }
        .type-btn.selected {
            background: linear-gradient(135deg, var(--cyan-500), var(--violet-400));
            color: var(--white);
            border-color: rgba(255,255,255,0.42);
            transform: translateY(-1px);
        }
        
        #sell-btn {
            background: linear-gradient(135deg, var(--pink-500) 0%, #ff7b63 100%);
            color: white; font-family: 'Audiowide', sans-serif;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 16px 28px rgba(240, 50, 140, 0.35);
        }
        #sell-btn:active { transform: scale(0.95); }
        #sell-btn:hover { filter: brightness(1.05); }

        #time-bar {
            background: linear-gradient(90deg, var(--cyan-400), var(--pink-500), var(--gold-400));
            box-shadow: 0 0 14px rgba(117, 247, 255, 0.5);
        }

        #start-btn,
        #restart-btn {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.08em;
            border: 1px solid rgba(255,255,255,0.28);
        }

        #start-btn {
            background: linear-gradient(135deg, var(--cyan-500), #6366f1);
            box-shadow: 0 14px 24px rgba(53, 217, 255, 0.24);
        }

        #restart-btn {
            background: linear-gradient(135deg, var(--pink-600), #fb7185);
        }

        #controls > div:first-child,
        #controls > div:nth-child(2) {
            max-width: min(100%, 28rem);
        }

        #start-screen,
        #game-over-screen {
            background:
                radial-gradient(circle at top, rgba(117,247,255,0.14), transparent 30%),
                var(--black-overlay);
        }

        #start-screen p,
        #game-over-screen .text-xl {
            color: rgba(234, 238, 255, 0.88);
        }

        #hud .text-gray-600,
        #start-screen .text-gray-600,
        #game-over-screen .text-gray-600 {
            color: rgba(220, 227, 255, 0.76);
        }

        #start-screen .text-gray-800,
        #game-over-screen .text-gray-800 {
            color: var(--white);
        }

        #hud #score,
        #finalScore {
            color: var(--gold-400);
            text-shadow: 0 0 12px rgba(255, 211, 110, 0.24);
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
            <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between pointer-events-none">
                <!-- [agent-note][stage3] resolved-gif: success/fail reactions -> catalogs/gifs.json | compact overlay to protect controls -->
                <div id="media-overlay" class="media-overlay pointer-events-none" aria-hidden="true">
                    <img id="success-gif" class="reaction-gif" alt="Successful look reaction">
                    <img id="fail-gif" class="reaction-gif" alt="Missed look reaction">
                    <div id="feedback-chip" class="feedback-chip ui-font">Ready</div>
                </div>
            
            <!-- HUD -->
            <div id="hud" class="flex justify-between items-start p-6 hidden">
                <div class="glass-panel px-6 py-3 rounded-full flex flex-col items-center">
                    <span class="text-xs uppercase tracking-widest text-gray-600">Creds</span>
                    <span id="score" class="text-3xl font-bold text-pink-600 fashion-font">0</span>
                </div>
                <div class="glass-panel px-6 py-3 rounded-full flex flex-col items-center w-32">
                    <span class="text-xs uppercase tracking-widest text-gray-600">Clock</span>
                    <div class="w-full h-2 bg-gray-300 rounded-full mt-2 overflow-hidden">
                        <div id="time-bar" class="h-full w-full transition-all"></div>
                    </div>
                </div>
            </div>

            <!-- Controls (Bottom) -->
            <div id="controls" class="pointer-events-auto p-6 pb-10 flex flex-col gap-4 items-center hidden">
                <!-- Type Selectors -->
                <div class="flex gap-4">
                    <button class="type-btn shadow-lg" data-type="dress">DRESS</button>
                    <button class="type-btn shadow-lg" data-type="skirt">SKIRT</button>
                    <button class="type-btn shadow-lg" data-type="pants">PANTS</button>
                </div>
                <!-- Color Selectors -->
                <div class="flex gap-6 items-center bg-white/30 px-6 py-3 rounded-full backdrop-blur-sm">
                    <button class="color-btn bg-red-400 shadow-md" data-color="red" aria-label="Red outfit"></button>
                    <button class="color-btn bg-blue-400 shadow-md" data-color="blue" aria-label="Blue outfit"></button>
                    <button class="color-btn bg-green-400 shadow-md" data-color="green" aria-label="Green outfit"></button>
                </div>
                <!-- Action Button -->
                <button id="sell-btn" class="mt-2 w-48 py-4 rounded-full text-2xl font-bold shadow-xl hover:shadow-2xl transition">
                    SEND LOOK
                </button>
            </div>

            <!-- Screens -->
            <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-auto z-50 bg-white/10 backdrop-blur-sm">
                <div class="glass-panel p-10 rounded-3xl text-center max-w-sm mx-4 shadow-2xl border border-white/60">
                    <h1 class="text-5xl font-bold text-gray-800 mb-2 fashion-font drop-shadow-sm">Arcade Outfit Rush</h1>
                    <p class="text-gray-600 text-lg mb-8 italic">Match the request, then send the look fast.</p>
                    <!-- [agent-note][stage1] role: future-audio | trigger: successful-match | intent: emphasize combo energy -->
                    <button id="start-btn" class="bg-gray-900 text-white font-bold py-4 px-10 rounded-full shadow-lg hover:scale-105 transition duration-300 tracking-wider">START SHIFT</button>
                </div>
            </div>

            <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col justify-center items-center pointer-events-auto z-50 bg-black/40 backdrop-blur-md">
                <div class="glass-panel p-10 rounded-3xl text-center max-w-sm mx-4 shadow-2xl bg-white">
                    <h2 class="text-4xl font-bold text-gray-800 mb-2 fashion-font">Shift Over!</h2>
                    <div class="text-xl text-gray-600 mb-6">Creds Banked: <span id="finalScore" class="font-bold text-pink-600 text-3xl">0</span></div>
                    <button id="restart-btn" class="bg-pink-600 text-white font-bold py-4 px-10 rounded-full shadow-lg hover:bg-pink-700 transition">RUN IT BACK</button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                score: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                hurry: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                // [agent-note][stage4] repaired: catalog-audio-remap | preserved gameplay timing while removing flagged local audio refs
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.bgmStarted = false;
                this.lastPlayed = new Map();
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sound = new Audio(v);
                    sound.preload = 'auto';
                    sound.volume = k === 'ui' ? 0.44 : k === 'hurry' ? 0.52 : 0.68;
                    this.sfx[k] = sound;
                }
            }

            prime() {
                if (this.bgmStarted) return;
                this.bgmStarted = true;
                this.bgm.play().then(() => {
                    this.bgm.pause();
                    this.bgm.currentTime = 0;
                }).catch(() => {});
            }

            playBGM() {
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() { 
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
            }

            playSFX(key, cooldown = 90) {
                const now = performance.now();
                if (this.lastPlayed.has(key) && now - this.lastPlayed.get(key) < cooldown) return;
                this.lastPlayed.set(key, now);
                if (this.sfx[key]) {
                    const clone = this.sfx[key].cloneNode();
                    clone.volume = this.sfx[key].volume;
                    clone.play().catch(() => {});
                }
            }
        }
        
        const audio = new AudioController();
        const successGif = document.getElementById('success-gif');
        const failGif = document.getElementById('fail-gif');
        const feedbackChip = document.getElementById('feedback-chip');
        let feedbackTimeout = null;
        let hurryTriggered = false;

        function showFeedback(state, message) {
            if (feedbackTimeout) clearTimeout(feedbackTimeout);
            successGif.classList.remove('active');
            failGif.classList.remove('active');
            if (state === 'success') successGif.classList.add('active');
            if (state === 'fail') failGif.classList.add('active');
            feedbackChip.textContent = message;
            feedbackChip.classList.add('active');
            feedbackTimeout = setTimeout(() => {
                successGif.classList.remove('active');
                failGif.classList.remove('active');
                feedbackChip.classList.remove('active');
            }, 1400);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let timeLeft = 100; // Percentage
        let lastTime = 0;
        let difficultyMultiplier = 1.0;

        // Outfit State
        let currentOutfit = { type: 'dress', color: 'red' };
        let targetOutfit = { type: 'dress', color: 'red' };
        
        // Visual State
        let particles = [];
        let customerX = 2000; // Start off screen
        let customerTargetX = 0;
        let customerState = 'entering'; // entering, waiting, leaving_happy, leaving_sad

        const COLORS = {
            red: '#ff6b95',
            blue: '#62d7ff',
            green: '#7af59c',
            skin: '#fde68a'
        };

        const TYPES = ['dress', 'skirt', 'pants'];
        const COLOR_KEYS = ['red', 'blue', 'green'];

        const timeBar = document.getElementById('time-bar');
        successGif.src = ASSETS.gifs.success;
        failGif.src = ASSETS.gifs.fail;

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            customerTargetX = width * 0.75;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GAME LOGIC HELPER */
        function generateRequest() {
            const type = TYPES[Math.floor(Math.random() * TYPES.length)];
            const color = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
            targetOutfit = { type, color };
            
            // Reset customer animation
            customerX = width + 200;
            customerState = 'entering';
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        /** 5. DRAWING FUNCTIONS */
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#251543');
            gradient.addColorStop(0.55, '#3a1f61');
            gradient.addColorStop(1, '#180f31');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.35, height * 0.12, 20, width * 0.35, height * 0.45, width * 0.55);
            glow.addColorStop(0, 'rgba(117, 247, 255, 0.2)');
            glow.addColorStop(1, 'rgba(117, 247, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            const floorGradient = ctx.createLinearGradient(0, height * 0.74, 0, height);
            floorGradient.addColorStop(0, '#3e285b');
            floorGradient.addColorStop(1, '#130d26');
            ctx.fillStyle = floorGradient;
            ctx.fillRect(0, height * 0.78, width, height * 0.22);

            ctx.save();
            ctx.strokeStyle = 'rgba(117, 247, 255, 0.12)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 9; i++) {
                const y = height * 0.78 + i * (height * 0.03);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const spot = ctx.createRadialGradient(width * 0.3, height * 0.05, 40, width * 0.3, height * 0.78, 340);
            spot.addColorStop(0, 'rgba(255,255,255,0.42)');
            spot.addColorStop(0.28, 'rgba(255, 211, 110, 0.15)');
            spot.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = spot;
            ctx.beginPath();
            ctx.moveTo(width * 0.2, 0);
            ctx.lineTo(width * 0.4, 0);
            ctx.lineTo(width * 0.54, height);
            ctx.lineTo(width * 0.06, height);
            ctx.fill();
            ctx.restore();

            for (let i = 0; i < 6; i++) {
                const bulbX = width * 0.12 + i * width * 0.14;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 211, 110, 0.85)' : 'rgba(117, 247, 255, 0.82)';
                ctx.beginPath();
                ctx.arc(bulbX, height * 0.08, Math.max(4, width * 0.008), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawMannequin(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const outfitColor = COLORS[currentOutfit.color];
            const glowColor = currentOutfit.color === 'red'
                ? 'rgba(255, 107, 149, 0.28)'
                : currentOutfit.color === 'blue'
                    ? 'rgba(98, 215, 255, 0.28)'
                    : 'rgba(122, 245, 156, 0.28)';

            ctx.save();
            ctx.fillStyle = 'rgba(6, 8, 28, 0.34)';
            ctx.beginPath();
            ctx.ellipse(0, 410, 88, 24, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#8090ad';
            ctx.fillRect(-6, 300, 12, 100);
            ctx.beginPath();
            ctx.ellipse(0, 400, 60, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 36;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath();
            ctx.ellipse(0, 135, 90, 190, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const bodyGradient = ctx.createLinearGradient(0, -80, 0, 360);
            bodyGradient.addColorStop(0, '#fff8fe');
            bodyGradient.addColorStop(1, '#d9dff4');
            ctx.fillStyle = bodyGradient;
            ctx.strokeStyle = 'rgba(97, 108, 143, 0.45)';
            ctx.lineWidth = 2.5;
            
            ctx.beginPath();
            ctx.arc(0, -55, 32, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#1f2346';
            ctx.beginPath();
            ctx.arc(0, -61, 26, Math.PI, 0, false);
            ctx.quadraticCurveTo(0, -95, 26, -61);
            ctx.fill();

            ctx.fillStyle = '#fff8fe';
            ctx.beginPath();
            ctx.moveTo(-30, -20);
            ctx.lineTo(30, -20);
            ctx.lineTo(25, 100);
            ctx.lineTo(35, 200);
            ctx.lineTo(-35, 200);
            ctx.lineTo(-25, 100);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#f4f6ff';
            ctx.fillRect(-30, 200, 25, 150);
            ctx.fillRect(5, 200, 25, 150);
            ctx.strokeRect(-30, 200, 25, 150);
            ctx.strokeRect(5, 200, 25, 150);

            const clothGradient = ctx.createLinearGradient(0, -20, 0, 320);
            clothGradient.addColorStop(0, '#ffffff');
            clothGradient.addColorStop(0.18, outfitColor);
            clothGradient.addColorStop(1, 'rgba(31,35,70,0.96)');
            ctx.fillStyle = clothGradient;
            ctx.strokeStyle = 'rgba(255,255,255,0.32)';

            if (currentOutfit.type === 'dress') {
                ctx.beginPath();
                ctx.moveTo(-32, -18);
                ctx.lineTo(32, -18);
                ctx.lineTo(27, 100);
                ctx.lineTo(60, 280);
                ctx.quadraticCurveTo(0, 304, -60, 280);
                ctx.lineTo(-27, 100);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255,255,255,0.26)';
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.lineTo(0, 272);
                ctx.stroke();
            } 
            else if (currentOutfit.type === 'skirt') {
                ctx.beginPath();
                ctx.moveTo(-32, -18);
                ctx.lineTo(32, -18);
                ctx.lineTo(27, 100);
                ctx.lineTo(-27, 100);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-27, 100);
                ctx.lineTo(27, 100);
                ctx.lineTo(60, 240);
                ctx.quadraticCurveTo(0, 256, -60, 240);
                ctx.closePath();
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.26)';
                ctx.beginPath();
                ctx.moveTo(-18, 108);
                ctx.lineTo(-35, 234);
                ctx.moveTo(0, 104);
                ctx.lineTo(0, 248);
                ctx.moveTo(18, 108);
                ctx.lineTo(35, 234);
                ctx.stroke();
            } 
            else if (currentOutfit.type === 'pants') {
                ctx.beginPath();
                ctx.moveTo(-32, -18);
                ctx.lineTo(32, -18);
                ctx.lineTo(27, 100);
                ctx.lineTo(-27, 100);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-27, 100);
                ctx.lineTo(27, 100);
                ctx.lineTo(35, 200);
                ctx.lineTo(30, 350);
                ctx.lineTo(5, 350);
                ctx.lineTo(0, 230);
                ctx.lineTo(-5, 350);
                ctx.lineTo(-30, 350);
                ctx.lineTo(-35, 200);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.24)';
                ctx.beginPath();
                ctx.moveTo(0, 98);
                ctx.lineTo(0, 230);
                ctx.moveTo(-16, 140);
                ctx.lineTo(-22, 338);
                ctx.moveTo(16, 140);
                ctx.lineTo(22, 338);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.72)';
            ctx.beginPath();
            ctx.arc(-10, -58, 3, 0, Math.PI * 2);
            ctx.arc(10, -58, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(31,35,70,0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -45, 10, 0.15 * Math.PI, 0.85 * Math.PI, false);
            ctx.stroke();

            ctx.restore();
        }

        function drawCustomer(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            const customerPalette = customerState === 'leaving_happy'
                ? ['#ffd36e', '#ff8aa5']
                : customerState === 'leaving_sad'
                    ? ['#8b90ad', '#5a6079']
                    : ['#75f7ff', '#8b5cf6'];

            const silhouette = ctx.createLinearGradient(0, -130, 0, 210);
            silhouette.addColorStop(0, customerPalette[0]);
            silhouette.addColorStop(1, customerPalette[1]);
            ctx.fillStyle = silhouette;
            
            ctx.beginPath();
            ctx.arc(0, -100, 35, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#182038';
            ctx.beginPath();
            ctx.arc(0, -106, 26, Math.PI, 0, false);
            ctx.quadraticCurveTo(0, -136, 26, -106);
            ctx.fill();
            
            ctx.fillStyle = silhouette;
            ctx.beginPath();
            ctx.moveTo(-20, -65);
            ctx.quadraticCurveTo(-40, -60, -50, 0);
            ctx.lineTo(-40, 200);
            ctx.lineTo(40, 200);
            ctx.lineTo(50, 0);
            ctx.quadraticCurveTo(40, -60, 20, -65);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.26)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(0, 170);
            ctx.stroke();

            if (customerState === 'waiting' || customerState === 'entering') {
                ctx.translate(-108, -186);
                
                ctx.fillStyle = 'rgba(255,255,255,0.94)';
                ctx.beginPath();
                ctx.moveTo(84, 82);
                ctx.lineTo(108, 102);
                ctx.lineTo(104, 70);
                ctx.fill();

                ctx.beginPath();
                ctx.roundRect(0, 0, 132, 84, 18);
                ctx.fill();
                ctx.strokeStyle = 'rgba(117, 247, 255, 0.36)';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = 'rgba(24, 26, 47, 0.86)';
                ctx.font = '700 12px "Exo 2", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('NEXT LOOK', 66, 18);

                ctx.fillStyle = COLORS[targetOutfit.color];
                const cx = 66, cy = 46;
                
                if (targetOutfit.type === 'dress') {
                    ctx.beginPath();
                    ctx.moveTo(cx, cy-22);
                    ctx.lineTo(cx+17, cy+30);
                    ctx.lineTo(cx-17, cy+30);
                    ctx.fill();
                } else if (targetOutfit.type === 'skirt') {
                    ctx.beginPath();
                    ctx.moveTo(cx-17, cy);
                    ctx.lineTo(cx+17, cy);
                    ctx.lineTo(cx+22, cy+30);
                    ctx.lineTo(cx-22, cy+30);
                    ctx.fill();
                } else if (targetOutfit.type === 'pants') {
                    ctx.fillRect(cx-12, cy-10, 9, 42);
                    ctx.fillRect(cx+3, cy-10, 9, 42);
                }
            }

            ctx.restore();
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5;
                p.life -= 0.02;

                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;
        }

        /** 6. GAME LOOP */
        function initGame() {
            score = 0;
            timeLeft = 100;
            difficultyMultiplier = 1.0;
            document.getElementById('score').innerText = score;
            generateRequest();
            
            document.querySelectorAll('.type-btn').forEach(b => {
                if(b.dataset.type === 'dress') b.classList.add('selected');
                else b.classList.remove('selected');
            });
            document.querySelectorAll('.color-btn').forEach(b => {
                if(b.dataset.color === 'red') b.classList.add('selected');
                else b.classList.remove('selected');
            });
            currentOutfit = { type: 'dress', color: 'red' };
            timeBar.style.width = '100%';
            hurryTriggered = false;
            successGif.classList.remove('active');
            failGif.classList.remove('active');
            feedbackChip.classList.remove('active');
            feedbackChip.textContent = 'Ready';
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;
            
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, width, height);

            drawBackground();

            drawMannequin(width * 0.3, height * 0.4, 0.8);

            if (customerState === 'entering') {
                customerX += (customerTargetX - customerX) * 0.05;
                if (Math.abs(customerX - customerTargetX) < 5) {
                    customerState = 'waiting';
                }
            } else if (customerState === 'leaving_happy') {
                customerX += 15;
                if (customerX > width + 200) generateRequest();
            } else if (customerState === 'leaving_sad') {
                customerX += 15;
                if (customerX > width + 200) generateRequest();
            }

            drawCustomer(ctx, customerX, height * 0.6);
            drawParticles();

            if (customerState === 'waiting') {
                timeLeft -= 0.05 * difficultyMultiplier;
                timeBar.style.width = `${Math.max(0, timeLeft)}%`;
                
                if (timeLeft <= 28 && !hurryTriggered) {
                    hurryTriggered = true;
                    audio.playSFX('hurry', 800);
                    showFeedback('fail', 'Rush!');
                } else if (timeLeft > 28) {
                    hurryTriggered = false;
                }

                if (timeLeft <= 0) {
                    gameOver();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function checkMatch() {
            if (customerState !== 'waiting') return;

            if (currentOutfit.type === targetOutfit.type && currentOutfit.color === targetOutfit.color) {
                score += 100;
                timeLeft = Math.min(100, timeLeft + 15);
                difficultyMultiplier += 0.05;
                audio.playSFX('score');
                document.getElementById('score').innerText = score;
                spawnParticles(width * 0.3, height * 0.4, COLORS[currentOutfit.color]);
                showFeedback('success', 'Nailed it');
                customerState = 'leaving_happy';
            } else {
                timeLeft -= 20;
                audio.playSFX('fail');
                showFeedback('fail', 'Nope');
                
                const container = document.getElementById('game-container');
                container.classList.add('animate-pulse');
                setTimeout(() => container.classList.remove('animate-pulse'), 200);
            }
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedback('fail', 'Shift over');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 7. CONTROLS SETUP */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('ui');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('controls').classList.add('flex');
            gameActive = true;
            initGame();
            lastTime = performance.now();
            gameLoop(lastTime);
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            audio.playSFX('ui');
            audio.playBGM();
            gameActive = true;
            initGame();
            lastTime = performance.now();
            gameLoop(lastTime);
        });

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                audio.playSFX('ui', 60);
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                currentOutfit.type = e.target.dataset.type;
            });
        });

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                audio.playSFX('ui', 60);
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                currentOutfit.color = e.target.dataset.color;
            });
        });

        document.getElementById('sell-btn').addEventListener('click', () => {
            audio.playSFX('ui', 60);
            checkMatch();
        });
    });
    </script>
</body>
</html>
