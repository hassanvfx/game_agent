<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover"><title>Capsule Sort Safari</title><link rel="icon" href="data:,"><style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');:root{--ink:#21143f;--red:#ff5f94;--blue:#55cfff;--green:#77f29b;--pink:#ff65bc;--cyan:#65f4ff;--lem:#ffe66d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffe9fb;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;touch-action:manipulation}button{font:inherit;border:0;cursor:pointer;color:inherit}#game-container{position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:linear-gradient(#fff0fb,#dcf8ff 48%,#efe7ff)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.brand{font-family:Bangers,cursive;letter-spacing:.045em}.hidden{display:none!important}.glass{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.42));border:2px solid rgba(255,255,255,.72);box-shadow:0 18px 38px rgba(89,51,148,.18),inset 0 1px rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}#motifs{position:absolute;inset:-8%;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(101,244,255,.55),transparent 13%),radial-gradient(circle at 84% 12%,rgba(255,230,109,.6),transparent 12%),radial-gradient(circle at 76% 72%,rgba(255,101,188,.35),transparent 18%)}#motifs:before{content:"";position:absolute;inset:0;background-image:linear-gradient(120deg,rgba(255,255,255,.42) 0 8px,transparent 8px 42px),radial-gradient(circle,rgba(155,123,255,.24) 0 3px,transparent 4px);background-size:74px 74px,58px 58px;animation:drift 16s linear infinite;opacity:.58}@keyframes drift{to{transform:translate(74px,74px)}}#ui{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}#hud{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pill{border-radius:999px}.stat{min-width:86px;text-align:center;padding:8px 11px}.label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:rgba(33,20,63,.66)}#score{font-size:31px;line-height:1;color:#8b47ff;text-shadow:0 3px #fff}.timer{min-width:128px;padding:9px 12px}.bar-shell{height:10px;border-radius:999px;background:rgba(33,20,63,.13);overflow:hidden;margin-top:6px}.time-bar{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--lem));transition:width .12s linear}.quest{max-width:150px;text-align:right;padding:8px 10px;font-weight:600;line-height:1.05}.quest strong{display:block;font-family:Bangers;font-size:19px;color:#ff4fae;text-shadow:0 2px #fff}#controls{pointer-events:auto;align-self:center;width:min(100%,460px);display:flex;flex-direction:column;align-items:center;gap:9px}.section{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(33,20,63,.68);text-shadow:0 1px #fff}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.kind{min-width:82px;padding:10px;border-radius:18px;background:rgba(255,255,255,.76);border:2px solid rgba(33,20,63,.12);font-weight:600;box-shadow:0 8px 16px rgba(56,34,108,.12)}.kind.selected{background:linear-gradient(135deg,var(--lem),var(--pink));color:white;text-shadow:0 1px rgba(33,20,63,.3);border-color:white;transform:translateY(-2px)}.color{width:53px;height:53px;border-radius:18px;border:4px solid white;box-shadow:0 9px 20px rgba(56,34,108,.16)}.color.selected{outline:4px solid #21143f;transform:scale(1.08)}.red{background:var(--red)}.blue{background:var(--blue)}.green{background:var(--green)}#sort{margin-top:2px;width:min(86vw,252px);padding:14px 18px;border-radius:999px;background:linear-gradient(135deg,#8b47ff,#ff54b8 52%,#ffe66d);color:white;font-family:Bangers;font-size:30px;letter-spacing:.06em;text-shadow:0 2px rgba(33,20,63,.32);box-shadow:0 16px 30px rgba(255,84,184,.32),0 4px #6e37ca}.screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(255,247,255,.76),rgba(213,243,255,.7));backdrop-filter:blur(10px);padding:18px;pointer-events:auto}.card{width:min(92vw,420px);text-align:center;padding:24px 20px;border-radius:34px}.title{font-size:clamp(46px,13vw,76px);line-height:.88;margin:0;color:#ff4fae;text-shadow:3px 4px 0 #fff,7px 8px 0 rgba(101,244,255,.55)}.subtitle{font-size:18px;font-weight:600;margin:12px auto 18px;max-width:310px}.micro{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:rgba(33,20,63,.62)}.cta{margin-top:12px;padding:14px 28px;border-radius:999px;background:#21143f;color:white;font-weight:600;font-size:20px}#feedback{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.86);z-index:7;pointer-events:none;padding:10px 16px;border-radius:999px;font-family:Bangers;font-size:28px;color:#ff4fae;opacity:0;transition:.18s}#feedback.active{opacity:1;transform:translate(-50%,-50%) scale(1)}#feedback.bad{color:#ff486b}.shake{animation:shake .18s linear 2}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:420px){.quest{display:none}.kind{min-width:76px}.color{width:49px;height:49px}#score{font-size:27px}}
</style></head><body><div id="game-container"><div id="motifs"></div><canvas id="gameCanvas"></canvas><div id="feedback" class="glass">real</div><div id="ui"><div id="hud" class="hidden"><div class="stat glass pill"><span class="label">Sort XP</span><span id="score" class="brand">0</span></div><div class="timer glass pill"><span class="label">Vibe Timer</span><div class="bar-shell"><div id="time-bar" class="time-bar"></div></div></div><div class="quest glass pill"><span>Request says</span><strong id="quest">?</strong></div></div><div id="controls" class="hidden"><div class="section">Pick species</div><div class="row"><button class="kind selected" data-type="blob">BLOB</button><button class="kind" data-type="wing">WING</button><button class="kind" data-type="munch">MUNCH</button></div><div class="section">Pick liquid aura</div><div class="row glass pill" style="padding:10px 14px"><button class="color red selected" data-color="red" aria-label="berry aura"></button><button class="color blue" data-color="blue" aria-label="soda aura"></button><button class="color green" data-color="green" aria-label="matcha aura"></button></div><button id="sort">SORT IT</button></div></div><div id="start-screen" class="screen"><div class="card glass"><div class="micro">liquid sort • puzzle • sort game</div><h1 class="title brand">Capsule Sort Safari</h1><p class="subtitle">A very serious creature lab: match the requested species + rainbow juice. No thoughts, head empty, just sort.</p><button id="start" class="cta">Start Sorting</button></div></div><div id="game-over-screen" class="screen hidden"><div class="card glass"><h2 class="title brand" style="font-size:56px">Safari Closed</h2><p class="subtitle">Final Sort XP: <strong id="finalScore">0</strong><br><span class="micro">the capsules were mostly real</span></p><button id="restart" class="cta">Run It Back</button></div></div></div><script>
document.addEventListener('DOMContentLoaded',()=>{const S={score:'https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3',fail:'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',ui:'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',hurry:'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3'},A={last:new Map(),play(k,c=90){let n=performance.now();if(this.last.has(k)&&n-this.last.get(k)<c)return;this.last.set(k,n);try{let a=new Audio(S[k]);a.volume=k==='ui'?.35:.6;a.play().catch(()=>{})}catch(e){}}},cv=document.getElementById('gameCanvas'),ctx=cv.getContext('2d');let w,h,dpr,active=false,score=0,timeLeft=100,last=0,diff=1,parts=[],rx=999,rt=0,rs='entering',hurry=false,cur={type:'blob',color:'red'},tar={type:'blob',color:'red'};const TYPES=['blob','wing','munch'],COLS=['red','blue','green'],TL={blob:'BLOB',wing:'WING',munch:'MUNCH'},CL={red:'BERRY',blue:'SODA',green:'MATCHA'},P={red:'#ff5f94',blue:'#55cfff',green:'#77f29b',ink:'#21143f'},$=id=>document.getElementById(id),scoreEl=$('score'),final=$('finalScore'),bar=$('time-bar'),quest=$('quest'),fb=$('feedback'),cont=$('game-container');function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);rt=w*.74}addEventListener('resize',resize);resize();function rand(a){return a[Math.floor(Math.random()*a.length)]}function req(){tar={type:rand(TYPES),color:rand(COLS)};quest.textContent=CL[tar.color]+' '+TL[tar.type];rx=w+160;rs='entering'}function msg(kind,text,d=1050){fb.textContent=text;fb.classList.toggle('bad',kind==='bad');fb.classList.add('active');clearTimeout(msg.t);msg.t=setTimeout(()=>fb.classList.remove('active'),d)}function init(){score=0;timeLeft=100;diff=1;parts=[];cur={type:'blob',color:'red'};hurry=false;scoreEl.textContent=0;bar.style.width='100%';document.querySelectorAll('.kind').forEach(b=>b.classList.toggle('selected',b.dataset.type==='blob'));document.querySelectorAll('.color').forEach(b=>b.classList.toggle('selected',b.dataset.color==='red'));req();msg('ok','ready',500)}function burst(x,y,c){for(let i=0;i<22;i++)parts.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.8)*8,life:1,c,r:3+Math.random()*5})}function bg(t){let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#fff0fb');g.addColorStop(.5,'#dcf8ff');g.addColorStop(1,'#efe7ff');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<10;i++){let x=(i*.17*w+t*.018*(i%3+1))%(w+120)-60,y=h*(.12+(i%5)*.12);ctx.fillStyle=i%3===0?'#65f4ff':i%3===1?'#ff65bc':'#ffe66d';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(x,y,18+(i%4)*8,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.48)';ctx.strokeStyle='rgba(33,20,63,.08)';for(let x=-40;x<w+60;x+=58){ctx.beginPath();ctx.moveTo(x,h*.73);ctx.quadraticCurveTo(x+22,h*.70,x+48,h*.73);ctx.lineTo(x+42,h*.98);ctx.lineTo(x-6,h*.98);ctx.closePath();ctx.fill();ctx.stroke()}}function creature(x,y,s,type,color){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let c=P[color],liq=ctx.createLinearGradient(0,-100,0,115);liq.addColorStop(0,'#fff');liq.addColorStop(.28,c);liq.addColorStop(1,'#7b56ff');ctx.fillStyle='rgba(33,20,63,.14)';ctx.beginPath();ctx.ellipse(0,126,86,20,0,0,7);ctx.fill();ctx.shadowColor=c;ctx.shadowBlur=22;ctx.fillStyle='rgba(255,255,255,.7)';ctx.strokeStyle='rgba(33,20,63,.18)';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(-54,-120,108,240,54);ctx.fill();ctx.stroke();ctx.fillStyle=liq;ctx.beginPath();ctx.roundRect(-46,-22,92,134,42);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=P.ink;if(type==='wing'){ctx.fillStyle='rgba(255,255,255,.86)';ctx.beginPath();ctx.moveTo(-52,-44);ctx.quadraticCurveTo(-98,-70,-88,-8);ctx.quadraticCurveTo(-72,-24,-52,-20);ctx.moveTo(52,-44);ctx.quadraticCurveTo(98,-70,88,-8);ctx.quadraticCurveTo(72,-24,52,-20);ctx.fill();ctx.fillStyle=P.ink;ctx.fillRect(-19,-34,38,7)}else if(type==='munch'){ctx.strokeStyle=P.ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-25,-38);ctx.quadraticCurveTo(0,-16,25,-38);ctx.stroke()}else{ctx.strokeStyle=P.ink;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-42,18,.1*Math.PI,.9*Math.PI);ctx.stroke()}ctx.beginPath();ctx.arc(-16,-58,6,0,7);ctx.arc(16,-58,6,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.78)';ctx.beginPath();ctx.roundRect(-30,-104,18,86,9);ctx.fill();ctx.restore()}function bubble(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(255,255,255,.94)';ctx.strokeStyle='rgba(33,20,63,.13)';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-88,-88,176,88,24);ctx.fill();ctx.stroke();ctx.fillStyle=P.ink;ctx.font='700 13px Rajdhani';ctx.textAlign='center';ctx.fillText('WILD REQUEST',0,-62);creature(0,-8,.25,tar.type,tar.color);ctx.restore()}function drawParts(){for(let i=parts.length-1;i>=0;i--){let p=parts[i];ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.life-=.023;if(p.life<=0)parts.splice(i,1)}ctx.globalAlpha=1}function loop(ts){if(!active)return;let dt=ts-last;last=ts;ctx.clearRect(0,0,w,h);bg(ts);creature(w*.30,h*.46,Math.min(.76,w/520),cur.type,cur.color);if(rs==='entering'){rx+=(rt-rx)*.055;if(Math.abs(rx-rt)<5)rs='waiting'}else if(rs!=='waiting'){rx+=15;if(rx>w+170)req()}creature(rx,h*.55,Math.min(.5,w/760),tar.type,tar.color);if(rs==='waiting'||rs==='entering')bubble(rx-20,h*.31);drawParts();if(rs==='waiting'){timeLeft-=.05*diff*(dt/16.67);bar.style.width=Math.max(0,timeLeft)+'%';if(timeLeft<=28&&!hurry){hurry=true;A.play('hurry',800);msg('bad','rush!')}else if(timeLeft>28)hurry=false;if(timeLeft<=0)over()}requestAnimationFrame(loop)}function check(){if(rs!=='waiting')return;if(cur.type===tar.type&&cur.color===tar.color){score+=100;timeLeft=Math.min(100,timeLeft+15);diff+=.05;scoreEl.textContent=score;A.play('score');burst(w*.30,h*.46,P[cur.color]);msg('ok','real');rs='leaving'}else{timeLeft-=20;A.play('fail');msg('bad','no thoughts');cont.classList.add('shake');setTimeout(()=>cont.classList.remove('shake'),260)}}function over(){active=false;A.play('fail');$('hud').classList.add('hidden');$('controls').classList.add('hidden');$('game-over-screen').classList.remove('hidden');final.textContent=score;msg('bad','closed')}function start(){A.play('ui');$('start-screen').classList.add('hidden');$('game-over-screen').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');active=true;init();last=performance.now();requestAnimationFrame(loop)}$('start').onclick=start;$('restart').onclick=start;document.querySelectorAll('.kind').forEach(b=>b.onclick=e=>{A.play('ui',60);document.querySelectorAll('.kind').forEach(x=>x.classList.remove('selected'));e.currentTarget.classList.add('selected');cur.type=e.currentTarget.dataset.type});document.querySelectorAll('.color').forEach(b=>b.onclick=e=>{A.play('ui',60);document.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));e.currentTarget.classList.add('selected');cur.color=e.currentTarget.dataset.color});$('sort').onclick=()=>{A.play('ui',60);check()}});
</script></body></html>
