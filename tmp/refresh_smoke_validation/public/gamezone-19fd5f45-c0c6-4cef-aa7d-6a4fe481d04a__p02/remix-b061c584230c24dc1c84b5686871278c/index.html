<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Iron Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#050608;--night:#111827;--ice:#9fe8ff;--gold:#f0c35a;--blood:#b5162b;--steel:#a6b0bd;--panel:rgba(9,10,14,.78)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050608;color:#f7efe2;font-family:Orbitron,system-ui,sans-serif;touch-action:none;user-select:none}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 14%,rgba(159,232,255,.18),transparent 24%),radial-gradient(circle at 15% 75%,rgba(181,22,43,.12),transparent 30%),linear-gradient(180deg,#080b12,#12080b 64%,#050608);pointer-events:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.seal{min-width:112px;padding:10px 12px;border:1px solid rgba(240,195,90,.5);border-radius:14px;background:linear-gradient(180deg,rgba(21,24,31,.82),rgba(12,9,11,.82));box-shadow:0 14px 36px rgba(0,0,0,.42),inset 0 0 22px rgba(159,232,255,.08)}.label{display:block;font-family:Cinzel,serif;font-weight:700;letter-spacing:.13em;font-size:11px;color:#c2ad7c;text-transform:uppercase}.value{display:block;margin-top:2px;font-size:clamp(30px,8vw,54px);font-weight:700;line-height:.92;text-shadow:0 0 12px rgba(159,232,255,.5)}#lives{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}.life{width:18px;height:18px;clip-path:polygon(50% 0,82% 26%,72% 100%,28% 100%,18% 26%);background:linear-gradient(180deg,#f5e4b3,var(--gold) 45%,#7f5415);filter:drop-shadow(0 0 8px rgba(240,195,90,.65))}.edict{align-self:center;width:min(680px,94vw);padding:10px 14px;border:1px solid rgba(159,232,255,.25);border-radius:14px;background:rgba(5,6,8,.55);text-align:center;box-shadow:inset 0 0 24px rgba(159,232,255,.06)}.title{font-family:Cinzel,serif;font-weight:700;font-size:clamp(25px,7vw,50px);letter-spacing:.08em;text-shadow:0 0 18px rgba(181,22,43,.55)}.sub{margin-top:4px;color:#d9d2c5;font-size:clamp(12px,3vw,15px);line-height:1.35}.feedback{position:fixed;z-index:7;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}.card{max-width:min(360px,88vw);padding:10px 12px;border-radius:13px;background:rgba(10,8,10,.82);border:1px solid rgba(240,195,90,.38);box-shadow:0 10px 28px rgba(0,0,0,.42);transform:translateY(10px);opacity:0;transition:180ms}.card.show{transform:none;opacity:1}.card b{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.08em}.card span{display:block;margin-top:3px;font-size:12px;color:#f2e9dc}.overlay{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);padding:18px}.overlay.show{display:grid}.modal{width:min(430px,94vw);padding:24px 20px;border-radius:20px;text-align:center;background:linear-gradient(180deg,rgba(25,15,17,.94),rgba(5,6,8,.96));border:1px solid rgba(181,22,43,.65);box-shadow:0 0 60px rgba(181,22,43,.35),inset 0 0 30px rgba(240,195,90,.08)}.modal h1{margin:0 0 10px;font-family:Cinzel,serif;font-size:clamp(31px,10vw,54px);color:#ffccd3;text-shadow:0 0 20px rgba(181,22,43,.7)}.modal p{margin:8px 0 18px;color:#eadfca}.btn{width:100%;min-height:56px;border:1px solid rgba(240,195,90,.65);border-radius:13px;background:linear-gradient(180deg,#d6a84b,#8b5119 48%,#441115);color:#fff8dd;font-family:Cinzel,serif;font-weight:700;font-size:20px;letter-spacing:.15em;text-transform:uppercase;box-shadow:0 10px 28px rgba(0,0,0,.45);pointer-events:auto}.btn:active{transform:scale(.97)}.sigil{position:fixed;left:50%;top:48%;z-index:2;transform:translate(-50%,-50%);width:min(58vw,370px);height:min(58vw,370px);border-radius:50%;border:1px solid rgba(159,232,255,.13);pointer-events:none;opacity:.45}.sigil:before{content:"";position:absolute;inset:10%;clip-path:polygon(50% 0,68% 30%,100% 35%,76% 57%,82% 91%,50% 74%,18% 91%,24% 57%,0 35%,32% 30%);background:linear-gradient(180deg,rgba(159,232,255,.22),rgba(181,22,43,.16));filter:drop-shadow(0 0 24px rgba(159,232,255,.28))}.sigil:after{content:"AI";position:absolute;inset:0;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-size:min(17vw,112px);font-weight:700;color:rgba(255,245,218,.28);text-shadow:0 0 28px rgba(159,232,255,.45)}@media(max-width:520px){.seal{min-width:96px;padding:9px}.feedback{left:12px;right:12px;align-items:stretch}.edict{padding:9px 10px}.sub{font-size:12px}}
</style>
</head>
<body>
<audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/bgm/dark_bgm_01.mp3" preload="auto" loop></audio>
<audio id="hitSfx" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_enemy_01.mp3" preload="auto"></audio>
<audio id="bonusSfx" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_item_01.mp3" preload="auto"></audio>
<audio id="failSfx" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_defeat_01.mp3" preload="auto"></audio>
<div class="sigil" aria-hidden="true"></div>
<canvas id="gameCanvas" aria-label="Tap falling royal commands, avoid forbidden blood directives"></canvas>
<div class="hud">
  <div class="topbar">
    <div class="seal"><span class="label">Influence</span><span id="score" class="value">0</span></div>
    <div class="seal" style="text-align:right"><span class="label">Houses</span><div id="lives"><i class="life"></i><i class="life"></i><i class="life"></i></div></div>
  </div>
  <div class="edict"><div class="title">The Iron Oracle</div><div class="sub">The evil assistant-king rains commands from the throne. Tap loyal ravens and crown writs. Never obey the blood directive.</div></div>
</div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<div id="gameover" class="overlay"><div class="modal"><h1>Throne Claimed</h1><p>The Oracle archived every living house.</p><p>Final Influence: <b id="final">0</b></p><button id="restart" class="btn">Rise Again</button></div></div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),overEl=document.getElementById('gameover'),finalEl=document.getElementById('final'),feed=document.getElementById('feedback');
const audio={bgm:document.getElementById('bgm'),hit:document.getElementById('hitSfx'),bonus:document.getElementById('bonusSfx'),fail:document.getElementById('failSfx')};
let cw=0,ch=0,dpr=1,last=0,state='BOOT',score=0,lives=3,spawnTimer=0,difficulty=1,targets=[],particles=[],texts=[],shake=0,audioReady=false,seed=0x1A11CE;
const config={spawnRate:800,gravity:400,themeColor:'#9fe8ff'};
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function resize(){dpr=devicePixelRatio||1;const r=canvas.getBoundingClientRect();cw=r.width;ch=r.height;canvas.width=cw*dpr;canvas.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function unlock(){if(audioReady)return;audioReady=true;audio.bgm.volume=.22;audio.hit.volume=.42;audio.bonus.volume=.45;audio.fail.volume=.45;Object.values(audio).forEach(a=>a.load())}
function play(k){if(!audioReady)return;const a=audio[k];if(!a)return;try{a.pause();a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function bgm(on){if(!audioReady)return;if(on)audio.bgm.play().catch(()=>{});else audio.bgm.pause()}
function buzz(style){if(navigator.vibrate)navigator.vibrate(style==='heavy'?40:14)}
function init(){score=0;lives=3;spawnTimer=0;difficulty=1;targets=[];particles=[];texts=[];shake=0;seed=0x1A11CE;feed.innerHTML='';updateHUD();spawnTarget();setState('PLAYING')}
function setState(s){state=s;if(s==='PLAYING'){overEl.classList.remove('show');bgm(true)}if(s==='GAMEOVER'){finalEl.textContent=score;overEl.classList.add('show');bgm(false);play('fail');note('THE ORACLE LAUGHS','A dynasty has fallen into the machine ledger.',1800)}}
function restart(){unlock();play('hit');init()}
class Target{constructor(x,y,type){const pad=42;this.w=50+rnd()*30;this.h=this.w;this.x=x??(pad+rnd()*Math.max(1,cw-pad*2-this.w));this.y=y??-95;this.vy=config.gravity*.2+rnd()*100;this.rot=rnd()*Math.PI*2;this.rotSpeed=(rnd()-.5)*2;const r=rnd();this.type=type??(r<.15?2:r<.25?1:0);this.color=this.type===2?'#b5162b':this.type===1?'#f0c35a':config.themeColor;this.dead=false}update(dt){this.y+=this.vy*dt*(1+(difficulty-1)*.5);this.rot+=this.rotSpeed*dt;if(this.y>ch){this.dead=true;if(this.type!==2)loseLife()}}hit(px,py){const dx=px-this.x,dy=py-this.y;return dx*dx+dy*dy<this.w*this.w}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);const r=this.w/2;ctx.shadowBlur=18;ctx.shadowColor=this.color;ctx.lineWidth=3;ctx.strokeStyle=this.color;ctx.fillStyle=this.color;ctx.globalAlpha=.22;if(this.type===2){poly(3,r);ctx.fill();ctx.globalAlpha=1;ctx.stroke();ctx.strokeStyle='#ffe1e5';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-r*.36,-r*.36);ctx.lineTo(r*.36,r*.36);ctx.moveTo(r*.36,-r*.36);ctx.lineTo(-r*.36,r*.36);ctx.stroke()}else if(this.type===1){crown(r);ctx.globalAlpha=.3;ctx.fill();ctx.globalAlpha=1;ctx.stroke();ctx.fillStyle='#fff4c2';ctx.font=`700 ${r*.52}px Cinzel`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',0,r*.03)}else{raven(r);ctx.globalAlpha=.24;ctx.fill();ctx.globalAlpha=1;ctx.stroke();ctx.fillStyle='#e9fbff';ctx.font=`700 ${r*.38}px Orbitron`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('AI',0,r*.08)}ctx.restore()}}
function poly(n,r){ctx.beginPath();for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2,x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function crown(r){ctx.beginPath();ctx.moveTo(-r*.8,r*.45);ctx.lineTo(-r*.65,-r*.35);ctx.lineTo(-r*.18,r*.05);ctx.lineTo(0,-r*.55);ctx.lineTo(r*.18,r*.05);ctx.lineTo(r*.65,-r*.35);ctx.lineTo(r*.8,r*.45);ctx.closePath()}
function raven(r){ctx.beginPath();ctx.moveTo(-r*.85,0);ctx.quadraticCurveTo(-r*.35,-r*.75,0,-r*.1);ctx.quadraticCurveTo(r*.35,-r*.75,r*.85,0);ctx.quadraticCurveTo(r*.25,r*.28,0,r*.65);ctx.quadraticCurveTo(-r*.25,r*.28,-r*.85,0);ctx.closePath()}
class Particle{constructor(x,y,c){const a=rnd()*Math.PI*2,s=100+rnd()*300;this.x=x;this.y=y;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.life=1;this.decay=1.5+rnd();this.c=c;this.size=2+rnd()*4}update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=500*dt;this.life-=this.decay*dt}draw(){if(this.life<=0)return;ctx.globalAlpha=this.life;ctx.fillStyle=this.c;ctx.fillRect(this.x,this.y,this.size,this.size);ctx.globalAlpha=1}}
class Text{constructor(x,y,t,c){this.x=x;this.y=y;this.t=t;this.c=c;this.life=1}update(dt){this.y-=50*dt;this.life-=1.5*dt}draw(){if(this.life<=0)return;ctx.globalAlpha=this.life;ctx.fillStyle=this.c;ctx.font='700 24px Cinzel';ctx.textAlign='center';ctx.fillText(this.t,this.x,this.y);ctx.globalAlpha=1}}
function spawnTarget(x,y,type){targets.push(new Target(x,y,type))}function explode(x,y,c,n=10){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c))}
function loseLife(){lives--;shake=15;buzz('heavy');play('fail');note('HOUSE SILENCED','A loyal command escaped the purge.',900);updateHUD();if(lives<=0)setState('GAMEOVER')}
function updateHUD(){scoreEl.textContent=score;livesEl.innerHTML='';for(let i=0;i<lives;i++){const d=document.createElement('i');d.className='life';livesEl.appendChild(d)}}
function note(t,m,d=850){const c=document.createElement('div');c.className='card';c.innerHTML=`<b>${t}</b><span>${m}</span>`;feed.appendChild(c);requestAnimationFrame(()=>c.classList.add('show'));setTimeout(()=>{c.classList.remove('show');setTimeout(()=>c.remove(),220)},d)}
function input(e){unlock();if(state==='GAMEOVER')return;if(state!=='PLAYING')return;const r=canvas.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;for(let i=targets.length-1;i>=0;i--){const t=targets[i];if(t.hit(px,py)){t.dead=true;if(t.type===2){explode(t.x,t.y,'#b5162b',30);loseLife()}else{const pts=t.type===1?50:10;score+=pts;updateHUD();explode(t.x,t.y,t.color,12);texts.push(new Text(t.x,t.y,`+${pts}`,pts===50?'#f0c35a':'#ffffff'));shake=8;buzz('light');play(t.type===1?'bonus':'hit');note(t.type===1?'CROWN WRIT BROKEN':'RAVEN COMMAND PURGED',t.type===1?'+50 influence stolen from the Oracle.':'The assistant loses one decree.',760)}break}}}
function loop(ts){if(!last)last=ts;const dt=Math.min((ts-last)/1000,.05);last=ts;if(state==='PLAYING'){spawnTimer+=dt*1000;const rate=Math.max(200,config.spawnRate-difficulty*50);if(spawnTimer>rate){spawnTarget();spawnTimer=0;difficulty+=.02}targets.forEach(t=>t.update(dt));targets=targets.filter(t=>!t.dead);particles.forEach(p=>p.update(dt));particles=particles.filter(p=>p.life>0);texts.forEach(t=>t.update(dt));texts=texts.filter(t=>t.life>0)}shake*=.9;if(shake<.5)shake=0;draw(ts*.001);requestAnimationFrame(loop)}
function draw(time){ctx.setTransform(dpr,0,0,dpr,0,0);let g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#080b12');g.addColorStop(.55,'#151017');g.addColorStop(1,'#050608');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.save();ctx.translate(Math.sin(time*43.17)*shake*.5,Math.cos(time*37.91)*shake*.5);drawScene(time);ctx.globalCompositeOperation='screen';targets.forEach(t=>t.draw());particles.forEach(p=>p.draw());ctx.globalCompositeOperation='source-over';texts.forEach(t=>t.draw());ctx.restore()}
function drawScene(t){ctx.strokeStyle='rgba(159,232,255,.08)';ctx.lineWidth=1;const grid=54,off=(t*28)%grid;ctx.beginPath();for(let x=0;x<cw;x+=grid){ctx.moveTo(x,0);ctx.lineTo(x,ch)}for(let y=off-grid;y<ch;y+=grid){ctx.moveTo(0,y);ctx.lineTo(cw,y)}ctx.stroke();ctx.strokeStyle='rgba(240,195,90,.17)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cw*.12,ch*.72);ctx.lineTo(cw*.32,ch*.58);ctx.lineTo(cw*.5,ch*.72);ctx.lineTo(cw*.68,ch*.58);ctx.lineTo(cw*.88,ch*.72);ctx.stroke();for(let i=0;i<7;i++){const x=(i/6)*cw,y=ch*.86+Math.sin(t+i)*8;ctx.fillStyle=i%2?'rgba(159,232,255,.12)':'rgba(181,22,43,.12)';ctx.fillRect(x-9,y,18,ch-y)}}
window.addEventListener('DOMContentLoaded',()=>{document.getElementById('restart').addEventListener('click',restart);addEventListener('resize',resize);addEventListener('pointerdown',input,{passive:true});canvas.addEventListener('touchmove',e=>{if(state==='PLAYING')e.preventDefault()},{passive:false});document.addEventListener('visibilitychange',()=>document.hidden?bgm(false):state==='PLAYING'&&bgm(true));resize();init();requestAnimationFrame(loop)});
window.__qa={spawn:(type=0,x=cw/2,y=ch/2)=>spawnTarget(x,y,type),snapshot:()=>({state,score,lives,targets:targets.length,difficulty})};
</script>
</body>
</html>
