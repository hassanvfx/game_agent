<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Relay Rush</title>
    <!-- [agent-note][stage1] role: future-illustration | element: start-panel | intent: sell the relay-runner fantasy quickly -->
    <!-- [agent-note][stage4] preserved-font-role: display -> Orbitron | ui -> Rajdhani via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --font-display: "Orbitron", system-ui, sans-serif;
            --font-ui: "Rajdhani", system-ui, sans-serif;
            --sky-top: #061a45;
            --sky-mid: #0f4ab8;
            --sky-bottom: #69d4ff;
            --panel-bg: rgba(7, 18, 54, 0.74);
            --panel-border: rgba(153, 229, 255, 0.72);
            --panel-shadow: rgba(0, 14, 40, 0.45);
            --hud-bg: rgba(5, 18, 48, 0.68);
            --hud-border: rgba(145, 224, 255, 0.48);
            --text-main: #f8fbff;
            --text-soft: #d8efff;
            --accent: #79e3ff;
            --accent-strong: #00f0ff;
            --warning: #ff627d;
            --gold: #ffe26d;
            --button-top: #9df0ff;
            --button-bottom: #3ba2ff;
            --button-edge: #133f8f;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--font-ui);
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.26), transparent 16%),
                radial-gradient(circle at 80% 14%, rgba(121, 227, 255, 0.24), transparent 18%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 25% 20%, rgba(255, 255, 255, 0.16), transparent 14%),
                radial-gradient(circle at 75% 10%, rgba(255, 255, 255, 0.12), transparent 10%),
                radial-gradient(circle at 50% 5%, rgba(121, 227, 255, 0.12), transparent 18%);
            opacity: 0.95;
        }

        #game-container::after {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 16%, transparent 86%, rgba(4, 9, 28, 0.22));
            mix-blend-mode: screen;
            opacity: 0.7;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        }

        .panel {
            position: relative;
            width: min(100%, 360px);
            padding: 22px 18px 20px;
            border-radius: 24px;
            border: 2px solid var(--panel-border);
            background:
                linear-gradient(180deg, rgba(18, 43, 104, 0.92), rgba(6, 17, 49, 0.92)),
                var(--panel-bg);
            box-shadow:
                0 18px 40px var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .panel.hidden,
        .hidden {
            display: none !important;
        }

        .feedback-gif {
            position: absolute;
            left: 16px;
            bottom: max(16px, calc(env(safe-area-inset-bottom) + 12px));
            width: min(30vw, 110px);
            border-radius: 18px;
            border: 1px solid rgba(121, 227, 255, 0.35);
            background: rgba(6, 17, 49, 0.35);
            box-shadow: 0 10px 20px rgba(0, 12, 32, 0.24);
            object-fit: cover;
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: auto;
            right: 16px;
            width: min(34vw, 124px);
            border-color: rgba(255, 98, 125, 0.45);
        }

        .start-panel {
            transform: translateY(0);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .start-panel:hover {
            transform: translateY(-3px);
            filter: brightness(1.03);
        }

        .brand-kicker {
            margin-bottom: 12px;
            font-size: 11px;
            line-height: 1.2;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.42);
        }

        .title {
            margin: 0 0 8px;
            font-family: var(--font-display);
            font-size: clamp(28px, 8vw, 40px);
            line-height: 0.94;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow:
                0 0 18px rgba(121, 227, 255, 0.45),
                0 4px 0 rgba(0, 0, 0, 0.28);
        }

        .subtitle {
            margin: 0 0 16px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-soft);
        }

        .hero-badge-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin: 0 0 18px;
        }

        .hero-badge {
            position: relative;
            width: 42px;
            height: 48px;
            border-radius: 14px 14px 12px 12px;
            border: 2px solid rgba(255, 255, 255, 0.65);
            box-shadow:
                inset 0 -6px 0 rgba(0, 0, 0, 0.12),
                0 10px 16px rgba(6, 17, 49, 0.28);
        }

        .hero-badge::before,
        .hero-badge::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            background: #071231;
        }

        .hero-badge::before {
            width: 6px;
            height: 6px;
            top: 13px;
            left: 11px;
            box-shadow: 14px 0 0 #071231;
        }

        .hero-badge::after {
            width: 18px;
            height: 8px;
            left: 10px;
            bottom: 12px;
            border-radius: 0 0 12px 12px;
            box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.18);
        }

        .hero-badge.gold {
            background: linear-gradient(180deg, #ffe889, #ffb938);
        }

        .hero-badge.cyan {
            background: linear-gradient(180deg, #8bf4ff, #1986ff);
        }

        .hero-badge.lime {
            background: linear-gradient(180deg, #b9ff8c, #32c561);
        }

        .info-chip-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .info-chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(121, 227, 255, 0.32);
            background: rgba(255, 255, 255, 0.08);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .arcade-btn {
            width: 100%;
            border: 0;
            border-radius: 18px;
            padding: 15px 18px;
            cursor: pointer;
            touch-action: manipulation;
            font-family: var(--font-display);
            font-size: clamp(17px, 4.6vw, 20px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #05204b;
            background: linear-gradient(180deg, var(--button-top), var(--button-bottom));
            box-shadow:
                0 6px 0 var(--button-edge),
                0 12px 24px rgba(0, 35, 92, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
            transition: transform 90ms ease, box-shadow 90ms ease, filter 120ms ease;
        }

        .arcade-btn:hover {
            filter: brightness(1.04);
        }

        .arcade-btn:active,
        .arcade-btn.is-pressed {
            transform: translateY(5px);
            box-shadow:
                0 1px 0 var(--button-edge),
                0 5px 12px rgba(0, 35, 92, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.32);
        }

        .result-title {
            margin: 0 0 8px;
            font-family: var(--font-display);
            font-size: clamp(28px, 8vw, 36px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffd3dd;
            text-shadow: 0 0 16px rgba(255, 98, 125, 0.3);
        }

        .result-score {
            margin: 0 0 18px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid var(--hud-border);
            background: var(--hud-bg);
            color: var(--text-main);
            font-family: var(--font-display);
            font-size: clamp(13px, 3vw, 15px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #hud::before {
            content: "⚡";
            font-size: 15px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255, 226, 109, 0.5));
        }

        #score {
            min-width: 2ch;
            color: var(--gold);
        }

        #tutorial {
            position: absolute;
            left: 50%;
            bottom: max(72px, calc(env(safe-area-inset-bottom) + 58px));
            transform: translateX(-50%);
            width: min(92vw, 360px);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(121, 227, 255, 0.28);
            background: rgba(7, 18, 54, 0.62);
            color: var(--text-main);
            text-align: center;
            font-size: clamp(12px, 3.4vw, 15px);
            line-height: 1.32;
            font-weight: 600;
            box-shadow: 0 10px 18px rgba(0, 14, 40, 0.16);
            animation: tutorialPulse 1.45s ease-in-out infinite;
            opacity: 0.92;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        @keyframes tutorialPulse {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
                box-shadow: 0 10px 18px rgba(0, 14, 40, 0.16);
            }
            50% {
                transform: translateX(-50%) translateY(-4px);
                box-shadow: 0 14px 22px rgba(0, 14, 40, 0.22);
            }
        }

        @media (max-width: 480px) {
            .panel {
                padding: 20px 14px 18px;
                border-radius: 22px;
            }

            .subtitle {
                font-size: 14px;
            }

            .result-score {
                font-size: 16px;
            }

            #hud {
                padding: 9px 12px;
                gap: 8px;
            }

            #tutorial {
                bottom: max(64px, calc(env(safe-area-inset-bottom) + 52px));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .start-panel,
            .arcade-btn,
            #tutorial {
                transition: none;
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel start-panel">
                <div class="brand-kicker">Neon courier sprint</div>
                <h1 class="title">Sky Relay</h1>
                <div class="hero-badge-row" aria-hidden="true">
                    <div class="hero-badge gold"></div>
                    <div class="hero-badge cyan"></div>
                    <div class="hero-badge lime"></div>
                </div>
                <p class="subtitle">Launch across floating pads, dodge red danger tiles, and keep the relay pilot airborne.</p>
                <div class="info-chip-row" aria-hidden="true">
                    <span class="info-chip">Double hop</span>
                    <span class="info-chip">Hazard scan</span>
                    <span class="info-chip">Skyline rush</span>
                </div>
                <button id="start-btn" class="arcade-btn">Start Run</button>
            </div>

            <div id="game-over-screen" class="panel hidden">
                <h2 class="result-title">Relay Lost</h2>
                <p class="result-score">Distance: <span id="finalScore">0</span> pads</p>
                <button id="restart-btn" class="arcade-btn">Run Again</button>
            </div>

            <div id="hud" class="hidden">
                <span id="score">0</span>
                <span>Pads</span>
            </div>

            <div id="tutorial" class="hidden">
                Tap to jump. Tap again in midair for a higher relay hop.
            </div>

            <!-- [agent-note][stage3] resolved-gif: jump/fail feedback overlays -> catalogs/gifs.json -->
            <img id="jump-gif" class="feedback-gif hidden" alt="Jump boost reaction" src="https://i.giphy.com/3o6YgaiHLlJ9020xUc.gif">
            <img id="fail-gif" class="feedback-gif fail hidden" alt="Relay lost reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.gif">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ENABLE_ANIMATIONS = true;

        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = this.createAudio(ASSETS.bgm, 0.2, true);
                this.sfx = Object.fromEntries(
                    Object.entries(ASSETS.sfx).map(([key, url]) => [key, this.createAudio(url, this.getSfxVolume(key), false)])
                );
                this.cooldowns = new Map();
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.loop = loop;
                audio.volume = volume;
                audio.preload = 'auto';
                audio.playsInline = true;
                return audio;
            }

            getSfxVolume(key) {
                return {
                    jump: 0.45,
                    land: 0.38,
                    score: 0.5,
                    start: 0.55,
                    click: 0.42,
                    fail: 0.58
                }[key] ?? 0.45;
            }

            async unlock() {
                if (this.ready) return;
                this.ready = true;
                const warmups = [this.bgm, ...Object.values(this.sfx)].map((audio) =>
                    audio.play()
                        .then(() => {
                            audio.pause();
                            audio.currentTime = 0;
                        })
                        .catch(() => {})
                );
                await Promise.all(warmups);
            }

            playBGM() {
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldownMs = 0) {
                const audio = this.sfx[key];
                if (!audio) return;

                const now = performance.now();
                const nextAllowed = this.cooldowns.get(key) ?? 0;
                if (now < nextAllowed) return;
                if (cooldownMs > 0) {
                    this.cooldowns.set(key, now + cooldownMs);
                }

                try {
                    audio.pause();
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } catch (_) {}
            }
        }

        class GifController {
            constructor(elements) {
                this.elements = elements;
                this.timers = {};
                Object.values(this.elements).forEach((el) => {
                    if (el) el.loading = 'eager';
                });
            }

            flash(key, duration = 900) {
                const el = this.elements[key];
                if (!el) return;
                clearTimeout(this.timers[key]);
                el.classList.remove('hidden');
                requestAnimationFrame(() => el.classList.add('visible'));
                this.timers[key] = setTimeout(() => {
                    el.classList.remove('visible');
                    setTimeout(() => el.classList.add('hidden'), 180);
                }, duration);
            }

            hideAll() {
                Object.keys(this.elements).forEach((key) => {
                    const el = this.elements[key];
                    clearTimeout(this.timers[key]);
                    if (!el) return;
                    el.classList.remove('visible');
                    el.classList.add('hidden');
                });
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameContainer = document.getElementById('game-container');
        const jumpGif = document.getElementById('jump-gif');
        const failGif = document.getElementById('fail-gif');
        const gifController = new GifController({ jump: jumpGif, fail: failGif });

        let width, height;
        let gameActive = false;
        let score = 0;
        let gameSpeed = 6;

        const palette = {
            skyTop: '#061a45',
            skyMid: '#0f4ab8',
            skyBottom: '#69d4ff',
            cloud: 'rgba(245, 252, 255, 0.9)',
            platformTop: '#8fe9ff',
            platformBody: '#2464d6',
            platformGlow: 'rgba(121, 227, 255, 0.42)',
            platformStud: '#d8fbff',
            platformShadow: '#16356d',
            killTop: '#ff9eb2',
            killBody: '#f04462',
            killGlow: 'rgba(255, 98, 125, 0.68)',
            killCore: '#ffeff4',
            playerHead: '#ffe784',
            playerTorso: '#3aaeff',
            playerLegs: '#72f07f',
            playerTrim: '#072453',
            visor: '#ffffff',
            energy: '#8ef1ff'
        };

        // Player Physics
        let player = {
            x: 100,
            y: 0,
            width: 40,
            height: 70,
            vy: 0,
            gravity: 0.8,
            jumpPower: -16,
            grounded: false,
            wasGrounded: false,
            jumpCount: 0,
            maxJumps: 2,
            colorHead: palette.playerHead,
            colorTorso: palette.playerTorso,
            colorLegs: palette.playerLegs
        };

        // World
        let platforms = [];
        let particles = [];
        let clouds = [];

        function setButtonFeedback(button) {
            if (!button) return;
            const release = () => button.classList.remove('is-pressed');
            button.addEventListener('pointerdown', () => button.classList.add('is-pressed'));
            button.addEventListener('pointerup', release);
            button.addEventListener('pointerleave', release);
            button.addEventListener('pointercancel', release);
            button.addEventListener('blur', release);
        }

        setButtonFeedback(startBtn);
        setButtonFeedback(restartBtn);

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.x = width * 0.15;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GENERATION LOGIC */
        function createCloud() {
            return {
                x: width + Math.random() * 200,
                y: Math.random() * (height / 2),
                size: 30 + Math.random() * 50,
                speed: 0.5 + Math.random() * 1
            };
        }

        function createPlatform(x, w, type = 'normal') {
            return {
                x: x,
                y: height - 150,
                w: w,
                h: 150,
                type: type,
                passed: false
            };
        }

        function initGame() {
            score = 0;
            gameSpeed = 6;
            player.y = height - 300;
            player.vy = 0;
            player.grounded = false;
            player.wasGrounded = false;
            player.jumpCount = 0;
            platforms = [];
            clouds = [];
            particles = [];
            gifController.hideAll();
            document.getElementById('score').innerText = score;

            platforms.push(createPlatform(0, width * 1.5, 'normal'));

            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2),
                    size: 30 + Math.random() * 50,
                    speed: 0.5 + Math.random() * 1
                });
            }
        }

        function spawnPlatform() {
            const lastPlat = platforms[platforms.length - 1];
            const gap = 100 + Math.random() * 120 + (score * 0.5);
            const w = 150 + Math.random() * 300;

            platforms.push(createPlatform(lastPlat.x + lastPlat.w + gap, w, 'normal'));

            if (Math.random() < 0.3 && score > 5) {
                const lavaW = 60 + Math.random() * 50;
                const lavaX = lastPlat.x + lastPlat.w + (gap / 2) - (lavaW / 2);
                platforms.push(createPlatform(lavaX, lavaW, 'kill'));
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function drawSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, palette.skyTop);
            gradient.addColorStop(0.48, palette.skyMid);
            gradient.addColorStop(1, palette.skyBottom);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.74, height * 0.18, 20, width * 0.74, height * 0.18, width * 0.38);
            glow.addColorStop(0, 'rgba(255,255,255,0.22)');
            glow.addColorStop(0.3, 'rgba(138,231,255,0.14)');
            glow.addColorStop(1, 'rgba(138,231,255,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            ctx.globalAlpha = 0.08;
            for (let i = 0; i < 6; i++) {
                const stripeY = height * (0.14 + i * 0.1);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, stripeY, width, 2);
            }
            ctx.globalAlpha = 1;
        }

        function drawCloud(cloud) {
            ctx.fillStyle = palette.cloud;
            ctx.beginPath();
            ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
            ctx.arc(cloud.x + cloud.size * 0.7, cloud.y - cloud.size * 0.18, cloud.size * 0.8, 0, Math.PI * 2);
            ctx.arc(cloud.x - cloud.size * 0.7, cloud.y - cloud.size * 0.16, cloud.size * 0.78, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 0.16;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cloud.x - cloud.size * 0.4, cloud.y - cloud.size * 0.2, cloud.size * 0.8, 4);
            ctx.globalAlpha = 1;
        }

        function drawPlatform(p) {
            if (p.type === 'kill') {
                ctx.shadowBlur = 18;
                ctx.shadowColor = palette.killGlow;

                const dangerGradient = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
                dangerGradient.addColorStop(0, palette.killTop);
                dangerGradient.addColorStop(0.18, palette.killBody);
                dangerGradient.addColorStop(1, '#8e1632');
                ctx.fillStyle = dangerGradient;
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.fillStyle = 'rgba(255, 239, 244, 0.28)';
                ctx.fillRect(p.x, p.y, p.w, 8);

                ctx.fillStyle = palette.killCore;
                for (let sx = p.x + 10; sx < p.x + p.w - 10; sx += 18) {
                    ctx.beginPath();
                    ctx.moveTo(sx, p.y + 4);
                    ctx.lineTo(sx + 6, p.y + 14);
                    ctx.lineTo(sx - 2, p.y + 14);
                    ctx.closePath();
                    ctx.fill();
                }
            } else {
                ctx.shadowBlur = 16;
                ctx.shadowColor = palette.platformGlow;

                const platformGradient = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
                platformGradient.addColorStop(0, palette.platformTop);
                platformGradient.addColorStop(0.12, '#58bfff');
                platformGradient.addColorStop(1, palette.platformBody);
                ctx.fillStyle = platformGradient;
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.fillStyle = 'rgba(255,255,255,0.32)';
                ctx.fillRect(p.x, p.y, p.w, 8);

                ctx.fillStyle = palette.platformShadow;
                ctx.fillRect(p.x, p.y + 22, p.w, 6);

                const studSize = 10;
                const spacing = 28;
                for (let sx = p.x; sx < p.x + p.w; sx += spacing) {
                    ctx.fillStyle = palette.platformStud;
                    ctx.fillRect(sx + 7, p.y + 8, studSize, studSize);
                    ctx.fillStyle = 'rgba(13, 44, 108, 0.28)';
                    ctx.fillRect(sx + 8, p.y + 17, studSize - 2, 3);
                }
            }

            ctx.shadowBlur = 0;
        }

        function drawPlayer() {
            const bounce = ENABLE_ANIMATIONS ? Math.sin(performance.now() * 0.012) * 1.4 : 0;
            const legOffset = player.grounded ? 0 : Math.sin(performance.now() * 0.02) * 2.5;
            const headX = player.x + 5;
            const headY = player.y + bounce;

            ctx.save();
            ctx.shadowBlur = 14;
            ctx.shadowColor = 'rgba(142, 241, 255, 0.4)';

            ctx.fillStyle = player.colorHead;
            ctx.fillRect(headX, headY, 30, 20);

            ctx.fillStyle = '#fff5c6';
            ctx.fillRect(headX + 3, headY + 2, 24, 6);

            ctx.fillStyle = player.colorTorso;
            ctx.fillRect(player.x, player.y + 20 + bounce * 0.45, 40, 25);

            ctx.fillStyle = palette.playerTrim;
            ctx.fillRect(player.x + 4, player.y + 28 + bounce * 0.45, 32, 5);

            ctx.fillStyle = player.colorLegs;
            ctx.fillRect(player.x + 2, player.y + 45 + legOffset, 16, 25);
            ctx.fillRect(player.x + 22, player.y + 45 - legOffset, 16, 25);

            ctx.fillStyle = palette.playerTrim;
            ctx.fillRect(player.x + 2, player.y + 64 + legOffset, 16, 6);
            ctx.fillRect(player.x + 22, player.y + 64 - legOffset, 16, 6);

            ctx.fillStyle = palette.visor;
            ctx.fillRect(headX + 6, headY + 5, 18, 6);

            ctx.fillStyle = palette.playerTrim;
            ctx.fillRect(headX + 9, headY + 6, 3, 3);
            ctx.fillRect(headX + 18, headY + 6, 3, 3);

            ctx.beginPath();
            ctx.strokeStyle = palette.playerTrim;
            ctx.lineWidth = 2;
            ctx.arc(headX + 15, headY + 12, 6, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            if (!player.grounded) {
                ctx.globalAlpha = 0.7;
                ctx.fillStyle = palette.energy;
                ctx.fillRect(player.x + 8, player.y + 68, 6, 10);
                ctx.fillRect(player.x + 26, player.y + 68, 6, 10);
                ctx.globalAlpha = 1;
            }

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 8, 8);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            });
        }

        /** 5. GAME LOOP */
        function gameLoop() {
            if (!gameActive) return;

            const wasGrounded = player.grounded;
            gameSpeed = 6 + (score / 50);
            ctx.clearRect(0, 0, width, height);

            drawSky();

            clouds.forEach((cloud) => {
                cloud.x -= cloud.speed;
                if (cloud.x < -cloud.size * 2) {
                    cloud.x = width + cloud.size;
                    cloud.y = Math.random() * (height / 2);
                }
                drawCloud(cloud);
            });

            player.vy += player.gravity;
            player.y += player.vy;
            player.grounded = false;

            for (let p of platforms) {
                if (player.x + player.width > p.x && player.x < p.x + p.w) {
                    if (player.y + player.height >= p.y && player.y + player.height <= p.y + player.vy + 10 && player.vy >= 0) {

                        if (p.type === "kill") {
                            gameOver();
                            return;
                        }

                        player.grounded = true;
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.jumpCount = 0;
                    } else if (player.y + player.height > p.y && p.type === "kill") {
                        gameOver();
                        return;
                    }
                }
            }

            if (player.grounded && !wasGrounded) {
                audio.playSFX("land", 120);
            }

            if (player.y > height) {
                gameOver();
                return;
            }

            platforms.forEach((p) => {
                p.x -= gameSpeed;
                drawPlatform(p);

                if (!p.passed && p.x + p.w < player.x && p.type === "normal") {
                    score++;
                    p.passed = true;
                    document.getElementById("score").innerText = score;
                    if (score % 3 === 0) {
                        audio.playSFX("score", 120);
                    }
                }
            });

            player.wasGrounded = player.grounded;

            if (platforms[0].x + platforms[0].w < -100) {
                platforms.shift();
            }

            if (platforms[platforms.length - 1].x < width) {
                spawnPlatform();
            }

            drawPlayer();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX("fail", 250);
            gifController.flash("fail", 1600);

            createParticles(player.x + 20, player.y + 35, player.colorHead);
            createParticles(player.x + 20, player.y + 35, player.colorTorso);
            createParticles(player.x + 20, player.y + 35, player.colorLegs);

            drawExplosionFrame();

            setTimeout(() => {
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('tutorial').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = score;
            }, 500);
        }

        function drawExplosionFrame() {
            if (particles.length > 0) {
                ctx.clearRect(0, 0, width, height);
                drawSky();

                platforms.forEach((p) => {
                    drawPlatform(p);
                });

                drawParticles();

                requestAnimationFrame(drawExplosionFrame);
            }
        }

        function jump() {
            if (!gameActive) return;
            if (player.jumpCount < player.maxJumps) {
                player.vy = player.jumpPower;
                player.jumpCount++;
                player.grounded = false;
                audio.playSFX("jump", 90);
                gifController.flash("jump", 700);

                if (player.jumpCount === 1) {
                    createParticles(player.x + 20, player.y + player.height, "#ffffff");
                }
            }
        }

        /** 6. CONTROLS */
        async function beginRun(isRestart = false) {
            await audio.unlock();
            if (isRestart) {
                audio.playSFX("click", 80);
            } else {
                audio.playSFX("start", 120);
            }
            audio.playBGM();
            gifController.hideAll();
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");
            document.getElementById("tutorial").classList.remove("hidden");
            gameActive = true;
            initGame();
            gameLoop();
        }

        startBtn.addEventListener("click", () => {
            beginRun(false);
        });

        restartBtn.addEventListener("click", () => {
            beginRun(true);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        });

        gameContainer.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            jump();
        });
    });
    </script>
</body>
