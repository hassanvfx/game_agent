    <style>
        :root {
            --bg-core: #04030d;
            --bg-mid: #110726;

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 35%, rgba(92, 42, 167, 0.42), transparent 38%),

                linear-gradient(180deg, #090616 0%, #04030d 100%);

            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(127, 229, 255, 0.14), transparent 20%),
                radial-gradient(circle at 82% 16%, rgba(255, 116, 212, 0.14), transparent 18%),
                radial-gradient(circle at 70% 72%, rgba(57, 208, 255, 0.08), transparent 22%);
            opacity: 0.95;
        }

        body::after {
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.6px),
                radial-gradient(circle, rgba(127, 229, 255, 0.6) 0 1px, transparent 1.8px);
            background-size: 140px 140px, 220px 220px;
            background-position: 0 0, 55px 75px;
            opacity: 0.24;
            animation: starDrift 18s linear infinite;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            isolation: isolate;
            overflow: hidden;

        #game-container::before,
        #game-container::after {
            content: "";

            inset: 0;
            pointer-events: none;
        }

        #game-container::before {

                radial-gradient(circle at 50% 54%, rgba(143, 93, 255, 0.18), transparent 26%);

        #game-container::after {

            border: 1px solid rgba(127, 229, 255, 0.08);
            border-radius: 18px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);

        .feedback-chip {

<body>
    <div id="game-container" class="select-none">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between p-4">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="flex justify-between items-start w-full">
                <div class="glass-panel hud-card px-4 py-2 rounded-lg pointer-events-auto">
                    <div class="text-gray-400 text-xs font-cyber uppercase tracking-wider hud-label">Score</div>

                </div>
                <div class="glass-panel hud-card px-4 py-2 rounded-lg flex flex-col items-center pointer-events-auto">
                    <div class="text-gray-400 text-xs font-cyber uppercase tracking-wider mb-1 hud-label">Next Orbit</div>
                    <div class="next-orbit-shell">
                        <canvas id="next-canvas" width="40" height="40" class="w-10 h-10"></canvas>
                    </div>
                </div>
            </div>

            <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm pointer-events-auto">
                <div id="game-over-panel" class="glass-panel p-8 rounded-2xl flex flex-col items-center transform scale-95 transition-transform duration-300">
                    <h1 class="text-4xl font-display font-bold text-red-500 neon-text mb-2 collapse-title">COLLAPSE</h1>
                    <p class="text-gray-300 font-cyber mb-6 text-center collapse-subtitle">The singularity nest destabilized the orbit field.</p>
                    <div class="text-gray-400 text-sm font-cyber uppercase mb-1 hud-label">Final Score</div>
                    <div id="final-score" class="text-white text-3xl font-display font-bold neon-text final-score-value mb-8">0</div>
                    <button id="restart-btn" class="restart-btn px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-cyber font-bold rounded-full shadow-[0_0_15px_rgba(138,43,226,0.6)] active:scale-95 transition-all">
                        RESTART RUN
                    </button>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: merge-burst + collapse-reaction -> catalogs/gifs.json -->
            <div class="feedback-gif-stack" aria-hidden="true">
                <img
                    id="merge-gif"
                    class="feedback-gif"
                    alt=""
                    src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                    loading="lazy"
                    decoding="async"
                >
                <img
                    id="gameover-gif"
                    class="feedback-gif"
                    alt=""
                    src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
                    loading="lazy"
                    decoding="async"
                >
            </div>
            <div id="feedback-chip" class="feedback-chip">Orbital link stabilized</div>
        </div>
    </div>

    <!-- [agent-note][stage4] repaired-audio-remap: replaced blocked local bgm with catalogs/audios.json ambient loop -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_drop" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_02.mp3"></audio>
    <audio id="sfx_merge" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3"></audio>
    <audio id="sfx_blackhole" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3"></audio>
    <audio id="sfx_warning" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3"></audio>
    <audio id="sfx_gameover" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"></audio>
    <audio id="sfx_restart" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3"></audio>

    <script>
        // --- L0: System Invariants & Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');
        
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let lastTime = 0;
        let animationFrameId;
        let dangerLineY = 100; // Dynamic danger line

        // Config
        window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = {};
        for (const key in window.gameConfigDefs) {
            window.gameConfig[key] = window.gameConfigDefs[key].value;
        }
        window.updateGameConfig = (key, val) => { window.gameConfig[key] = val; };

        // State
        let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
        let score = 0;
        let shakeTime = 0;
        let flashAlpha = 0;

        function setState(next) {
            gameState = next;
            const hud = document.getElementById('hud');
            const goScreen = document.getElementById('game-over-screen');
            const goPanel = document.getElementById('game-over-panel');
            
            if (next === 'PLAYING') {
                hud.style.display = 'flex';
                goScreen.classList.add('hidden');
                goPanel.classList.remove('scale-100');
                goPanel.classList.add('scale-95');
                gameoverGif.classList.remove('active');
                syncBgmForState();
            } else if (next === 'GAMEOVER') {
                goScreen.classList.remove('hidden');
                setTimeout(() => {
                    goPanel.classList.remove('scale-95');
                    goPanel.classList.add('scale-100');
                }, 50);
                document.getElementById('final-score').innerText = score;
                syncBgmForState();
            }
        }

        // Resize Observer
        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                const cr = entry.contentRect;
                cw = cr.width;
                ch = cr.height;
                
                canvas.width = cw * dpr;
                canvas.height = ch * dpr;
                canvas.style.width = cw + 'px';
                canvas.style.height = ch + 'px';
                
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                // Update danger line to be 10% from top (larger playfield)
                dangerLineY = ch * 0.10;
                
                if (!initialized) {
                    initGame();
                } else {
                    // Clamp entities
                    bodies.forEach(b => {
                        b.x = Math.max(b.r, Math.min(cw - b.r, b.x));
                        b.y = Math.max(b.r, Math.min(ch - b.r, b.y));
                    });
                }
            }
        });

        // --- Audio System ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let audioUnlocked = false;
        let warningAudioCooldown = 0;
        let feedbackChipTimeout = 0;
        let mergeGifTimeout = 0;
        let gameoverGifTimeout = 0;
        const bgm = document.getElementById('bgm_main');
        const audioEls = {
            drop: document.getElementById('sfx_drop'),
            merge: document.getElementById('sfx_merge'),
            blackhole: document.getElementById('sfx_blackhole'),
            warning: document.getElementById('sfx_warning'),
            gameover: document.getElementById('sfx_gameover'),
            restart: document.getElementById('sfx_restart')
        };
        const mergeGif = document.getElementById('merge-gif');
        const gameoverGif = document.getElementById('gameover-gif');
        const feedbackChip = document.getElementById('feedback-chip');

        bgm.volume = 0.2;
        Object.values(audioEls).forEach(audio => {
            audio.volume = audio.id === 'sfx_blackhole' ? 0.45 : 0.55;
        });

        function unlockAudio() {
            if (!audioUnlocked) {
                if (AudioContext && !audioCtx) audioCtx = new AudioContext();
                if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
                bgm.play().catch(() => {});
                audioUnlocked = true;
            } else if (audioCtx?.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }

        function syncBgmForState() {
            if (!audioUnlocked) return;
            if (gameState === 'PLAYING') {
                bgm.play().catch(() => {});
            } else {
                bgm.pause();
            }
        }

        function playSfx(name) {
            const audio = audioEls[name];
            if (!audio || !audioUnlocked) return;
            try {
                audio.pause();
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch (_) {}
        }

        function showFeedback(message) {
            if (!feedbackChip) return;
            feedbackChip.textContent = message;
            feedbackChip.classList.add('active');
            clearTimeout(feedbackChipTimeout);
            feedbackChipTimeout = window.setTimeout(() => {
                feedbackChip.classList.remove('active');
            }, 1200);
        }

        function pulseGif(el, timeoutRefName, duration = 1000) {
            if (!el) return;
            el.classList.add('active');
            clearTimeout(window[timeoutRefName]);
            window[timeoutRefName] = window.setTimeout(() => {
                el.classList.remove('active');
            }, duration);
        }

        function playSynth(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, t);
                osc.frequency.exponentialRampToValueAtTime(520, t + 0.08);
                gain.gain.setValueAtTime(0.06, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                osc.start(t);
                osc.stop(t + 0.08);
            } else if (type === 'merge') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(260, t);
                osc.frequency.exponentialRampToValueAtTime(720, t + 0.12);
                gain.gain.setValueAtTime(0.04, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                osc.start(t);
                osc.stop(t + 0.12);
            } else if (type === 'blackhole') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, t);
                osc.frequency.exponentialRampToValueAtTime(28, t + 0.4);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                osc.start(t);
                osc.stop(t + 0.4);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(50, t + 0.35);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                osc.start(t);
                osc.stop(t + 0.35);
            }
        }

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
        }

        // --- Game Logic ---
        const BODY_TYPES = [
            { r: 15, color: '#6c89ff', glow: '#9bc7ff', name: 'Meteoro', points: 2 },
            { r: 25, color: '#23b8ff', glow: '#83ecff', name: 'Asteroide', points: 4 },
            { r: 35, color: '#8f5dff', glow: '#d0b9ff', name: 'Luna', points: 8 },
            { r: 50, color: '#ff74d4', glow: '#ffd2f1', name: 'Planeta', points: 16 },
            { r: 70, color: '#ff9f4a', glow: '#ffe0ad', name: 'Gigante', points: 32 },
            { r: 95, color: '#ffd84a', glow: '#fff3bd', name: 'Estrella', points: 64 },
            { r: 125, color: '#7fe5ff', glow: '#e9fbff', name: 'Gigante Azul', points: 128 },
            { r: 160, color: '#7a2bff', glow: '#f2dcff', name: 'Estrella Neutrones', points: 256 },
            { r: 200, color: '#020208', glow: '#ffffff', name: 'Agujero Negro', points: 512 }
        ];

        let bodies = [];
        let particles = [];
        let currentDrop = null;
        let nextDropType = 0;
        let dropCooldown = false;
        let dangerTimer = 0;

        function getBaseRadius() {
            return Math.min(cw, ch) * 0.002;
        }

        function spawnDrop() {
            currentDrop = {
                type: nextDropType,
                x: cw / 2,
                y: 50
            };
            nextDropType = Math.floor(Math.random() * 4); // Spawn 0-3
            drawNextDrop();
        }

        function drawCosmicBody(x, y, radius, bodyType, options = {}) {
            const pulse = options.pulse ?? 0;
            const alpha = options.alpha ?? 1;
            const isPreview = options.isPreview ?? false;
            const drawCtx = options.context ?? ctx;

            drawCtx.save();
            drawCtx.globalAlpha = alpha;

            if (bodyType.name === 'Agujero Negro') {
                const haloRadius = radius * (1.18 + pulse * 0.04);
                const halo = drawCtx.createRadialGradient(x, y, radius * 0.2, x, y, haloRadius);
                halo.addColorStop(0, 'rgba(0, 0, 0, 0.96)');
                halo.addColorStop(0.45, 'rgba(15, 10, 36, 0.95)');
                halo.addColorStop(0.68, 'rgba(127, 229, 255, 0.48)');
                halo.addColorStop(0.82, 'rgba(255, 116, 212, 0.34)');
                halo.addColorStop(1, 'rgba(255, 255, 255, 0)');
                drawCtx.beginPath();
                drawCtx.arc(x, y, haloRadius, 0, Math.PI * 2);
                drawCtx.fillStyle = halo;
                drawCtx.fill();

                drawCtx.beginPath();
                drawCtx.arc(x, y, radius, 0, Math.PI * 2);
                drawCtx.fillStyle = '#020208';
                drawCtx.fill();

                drawCtx.lineWidth = 2.5;
                drawCtx.strokeStyle = '#ffffff';
                drawCtx.shadowBlur = 24 + pulse * 10;
                drawCtx.shadowColor = '#8f5dff';
                drawCtx.stroke();
                drawCtx.shadowBlur = 0;
                drawCtx.restore();
                return;
            }

            const outerRadius = radius * (1.14 + pulse * 0.035);
            const aura = drawCtx.createRadialGradient(x, y, radius * 0.25, x, y, outerRadius);
            aura.addColorStop(0, 'rgba(255,255,255,0)');
            aura.addColorStop(0.55, bodyType.glow + '22');
            aura.addColorStop(0.8, bodyType.glow + '10');
            aura.addColorStop(1, 'rgba(255,255,255,0)');
            drawCtx.beginPath();
            drawCtx.arc(x, y, outerRadius, 0, Math.PI * 2);
            drawCtx.fillStyle = aura;
            drawCtx.fill();

            const core = drawCtx.createRadialGradient(
                x - radius * 0.32,
                y - radius * 0.36,
                Math.max(1, radius * 0.08),
                x,
                y,
                radius
            );
            core.addColorStop(0, 'rgba(255,255,255,0.92)');
            core.addColorStop(0.18, bodyType.glow);
            core.addColorStop(0.55, bodyType.color);
            core.addColorStop(1, '#0c0c1d');

            drawCtx.beginPath();
            drawCtx.arc(x, y, radius, 0, Math.PI * 2);
            drawCtx.fillStyle = core;
            drawCtx.fill();

            if (!isPreview) {
                drawCtx.beginPath();
                drawCtx.arc(x + radius * 0.12, y + radius * 0.14, radius * 0.85, 0.1, Math.PI + 0.55);
                drawCtx.strokeStyle = 'rgba(8, 8, 22, 0.28)';
                drawCtx.lineWidth = Math.max(1, radius * 0.08);
                drawCtx.stroke();
            }

            drawCtx.beginPath();
            drawCtx.arc(x - radius * 0.28, y - radius * 0.3, radius * 0.26, 0, Math.PI * 2);
            drawCtx.fillStyle = 'rgba(255,255,255,0.46)';
            drawCtx.fill();

            if (bodyType.r >= 35) {
                drawCtx.beginPath();
                drawCtx.arc(x + radius * 0.08, y - radius * 0.12, radius * 0.12, 0, Math.PI * 2);
                drawCtx.fillStyle = 'rgba(255,255,255,0.2)';
                drawCtx.fill();
            }

            if (bodyType.r >= 70) {
                drawCtx.beginPath();
                drawCtx.arc(x, y, radius * 1.03, 0, Math.PI * 2);
                drawCtx.strokeStyle = 'rgba(255,255,255,0.22)';
                drawCtx.lineWidth = Math.max(1, radius * 0.04);
                drawCtx.stroke();
            }

            drawCtx.restore();
        }

        function drawNextDrop() {
            nextCtx.clearRect(0, 0, 40, 40);
            const t = BODY_TYPES[nextDropType];
            const scale = 15 / t.r;
            nextCtx.save();
            nextCtx.translate(20, 20);
            nextCtx.scale(scale, scale);
            nextCtx.translate(-20, -20);

            drawCosmicBody(20, 20, t.r, t, { pulse: 0.5, isPreview: true, context: nextCtx });

            nextCtx.restore();
        }

        function createParticles(x, y, color, count, speed) {
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const v = Math.random() * speed;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * v,
                    vy: Math.sin(angle) * v,
                    life: 1.0,
                    color
                });
            }
        }

        function initGame() {
            bodies = [];
            particles = [];
            score = 0;
            document.getElementById('score-display').innerText = score;
            dangerTimer = 0;
            shakeTime = 0;
            flashAlpha = 0;
            dropCooldown = false;
            warningAudioCooldown = 0;
            showFeedback('Orbital lane armed');
            playSfx('restart');
            
            nextDropType = Math.floor(Math.random() * 4);
            spawnDrop();
            
            setState('PLAYING');
            if(!initialized) {
                initialized = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
            syncBgmForState();
        }

        // --- Input System ---
        let pointerDown = false;
        function releaseCurrentDrop() {
            if (!currentDrop || dropCooldown) return;
            bodies.push({
                x: currentDrop.x,
                y: currentDrop.y,
                vx: 0,
                vy: 0,
                type: currentDrop.type,
                r: BODY_TYPES[currentDrop.type].r,
                id: Math.random()
            });
            playSfx('drop');
            playSynth('drop');
            vibrate('light');
            showFeedback('Mass deployed');
            currentDrop = null;
            dropCooldown = true;
            setTimeout(() => {
                if (gameState === 'PLAYING') {
                    spawnDrop();
                    dropCooldown = false;
                }
            }, 1000);
        }

        function getCanvasPointerX(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
            return clientX === undefined ? undefined : clientX - rect.left;
        }

        function handleGameplayPointer(e) {
            unlockAudio();

            if (gameState !== 'PLAYING') {
                if (e.type === 'pointercancel' || e.type === 'pointerup') {
                    pointerDown = false;
                }
                return;
            }

            const canvasX = getCanvasPointerX(e);
            if (canvasX === undefined) return;

            if (e.type === 'pointerdown') {
                e.preventDefault();
                pointerDown = true;
                if (currentDrop && !dropCooldown) {
                    currentDrop.x = Math.max(BODY_TYPES[currentDrop.type].r, Math.min(cw - BODY_TYPES[currentDrop.type].r, canvasX));
                }
            } else if (e.type === 'pointermove' && pointerDown) {
                e.preventDefault();
                if (currentDrop && !dropCooldown) {
                    currentDrop.x = Math.max(BODY_TYPES[currentDrop.type].r, Math.min(cw - BODY_TYPES[currentDrop.type].r, canvasX));
                }
            } else if ((e.type === 'pointerup' || e.type === 'pointercancel') && pointerDown) {
                e.preventDefault();
                pointerDown = false;
                releaseCurrentDrop();
            }
        }

        canvas.addEventListener('pointerdown', handleGameplayPointer, { passive: false });
        canvas.addEventListener('pointermove', handleGameplayPointer, { passive: false });
        canvas.addEventListener('pointerup', handleGameplayPointer, { passive: false });
        canvas.addEventListener('pointercancel', handleGameplayPointer, { passive: false });
        document.getElementById('restart-btn').addEventListener('click', () => {
            unlockAudio();
            if (gameState === 'GAMEOVER') {
                initGame();
            }
        });

        // --- Physics & Loop ---
        function updatePhysics(dt) {
            const gravity = window.gameConfig.gravity;
            const substeps = 4;
            const sdt = dt / substeps;

            for (let step = 0; step < substeps; step++) {
                // Apply forces and move
                for (let i = 0; i < bodies.length; i++) {
                    let b = bodies[i];
                    if (!isFinite(b.x) || !isFinite(b.y)) {
                        b.x = cw/2; b.y = ch/2; b.vx = 0; b.vy = 0;
                    }
                    b.vy += gravity * sdt;
                    b.x += b.vx * sdt;
                    b.y += b.vy * sdt;
                }

                // Resolve Collisions
                let merges = [];
                for (let i = 0; i < bodies.length; i++) {
                    let b1 = bodies[i];
                    
                    // Walls
                    if (b1.x < b1.r) { b1.x = b1.r; b1.vx *= -0.3; }
                    if (b1.x > cw - b1.r) { b1.x = cw - b1.r; b1.vx *= -0.3; }
                    if (b1.y > ch - b1.r) { b1.y = ch - b1.r; b1.vy *= -0.3; b1.vx *= 0.95; } // Floor friction

                    // Body vs Body
                    for (let j = i + 1; j < bodies.length; j++) {
                        let b2 = bodies[j];
                        let dx = b2.x - b1.x;
                        let dy = b2.y - b1.y;
                        let distSq = dx*dx + dy*dy;
                        let minDist = b1.r + b2.r;

                        if (distSq < minDist * minDist) {
                            let dist = Math.sqrt(distSq);
                            if (dist === 0) { dx = 1; dy = 0; dist = 1; }
                            
                            // Merge check
                            if (b1.type === b2.type && b1.type < 8) {
                                merges.push({i, j, type: b1.type});
                                continue;
                            }

                            // Resolve overlap
                            let overlap = minDist - dist;
                            let nx = dx / dist;
                            let ny = dy / dist;
                            
                            let massRatio1 = b2.r / (b1.r + b2.r);
                            let massRatio2 = b1.r / (b1.r + b2.r);

                            b1.x -= nx * overlap * massRatio1;
                            b1.y -= ny * overlap * massRatio1;
                            b2.x += nx * overlap * massRatio2;
                            b2.y += ny * overlap * massRatio2;

                            // Simple velocity response
                            let dvx = b2.vx - b1.vx;
                            let dvy = b2.vy - b1.vy;
                            let velAlongNormal = dvx * nx + dvy * ny;
                            if (velAlongNormal < 0) {
                                let restitution = 0.1;
                                let jImpulse = -(1 + restitution) * velAlongNormal;
                                jImpulse /= (1/b1.r + 1/b2.r); // use radius as proxy for mass
                                
                                b1.vx -= (jImpulse / b1.r) * nx;
                                b1.vy -= (jImpulse / b1.r) * ny;
                                b2.vx += (jImpulse / b2.r) * nx;
                                b2.vy += (jImpulse / b2.r) * ny;
                            }
                        }
                    }
                }

                // Process Merges
                if (merges.length > 0) {
                    let toRemove = new Set();
                    let newBodies = [];
                    
                    for (let m of merges) {
                        if (toRemove.has(m.i) || toRemove.has(m.j)) continue;
                        toRemove.add(m.i);
                        toRemove.add(m.j);
                        
                        let b1 = bodies[m.i];
                        let b2 = bodies[m.j];
                        let nx = (b1.x + b2.x) / 2;
                        let ny = (b1.y + b2.y) / 2;
                        let nType = m.type + 1;
                        
                        newBodies.push({
                            x: nx, y: ny,
                            vx: (b1.vx + b2.vx) * 0.5,
                            vy: (b1.vy + b2.vy) * 0.5,
                            type: nType,
                            r: BODY_TYPES[nType].r,
                            id: Math.random()
                        });

                        score += BODY_TYPES[nType].points;
                        createParticles(nx, ny, BODY_TYPES[nType].glow, 20, 200);
                        
                        if (nType === 8) {
                            playSfx('blackhole');
                            playSynth('blackhole');
                            vibrate('heavy');
                            shakeTime = 0.5;
                            flashAlpha = 1.0;
                            pulseGif(mergeGif, 'mergeGifTimeout', 1400);
                            showFeedback('Black hole forged');
                        } else {
                            playSfx('merge');
                            playSynth('merge');
                            vibrate('medium');
                            flashAlpha = Math.max(flashAlpha, 0.3);
                            pulseGif(mergeGif, 'mergeGifTimeout', 900);
                            showFeedback(`Orbit merged: ${BODY_TYPES[nType].name}`);
                        }
                    }
                    
                    bodies = bodies.filter((_, idx) => !toRemove.has(idx));
                    bodies.push(...newBodies);
                    document.getElementById('score-display').innerText = score;
                }
            }
        }

        function checkGameOver(dt) {
            let isDanger = false;
            for (let b of bodies) {
                if (b.y - b.r < dangerLineY && Math.abs(b.vy) < 50 && Math.abs(b.vx) < 50) {
                    isDanger = true;
                    break;
                }
            }

            if (isDanger) {
                dangerTimer += dt;
                if (warningAudioCooldown <= 0 && dangerTimer > 0.45 && gameState === 'PLAYING') {
                    playSfx('warning');
                    showFeedback('Event horizon unstable');
                    warningAudioCooldown = 1.15;
                }
                if (dangerTimer > 2.0) {
                    playSfx('gameover');
                    playSynth('gameover');
                    vibrate('heavy');
                    pulseGif(gameoverGif, 'gameoverGifTimeout', 2000);
                    showFeedback('Orbit collapsed');
                    setState('GAMEOVER');
                }
            } else {
                dangerTimer = Math.max(0, dangerTimer - dt);
            }
        }

        function draw() {
            const time = Date.now() / 1000;
            const maxSide = Math.max(cw, ch);

            // Background Gradient
            const grad = ctx.createRadialGradient(cw/2, ch*0.44, 0, cw/2, ch*0.55, maxSide);
            grad.addColorStop(0, '#24104a');
            grad.addColorStop(0.42, '#120726');
            grad.addColorStop(1, '#04030d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, cw, ch);

            // Background orbital glow
            ctx.save();
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.arc(cw / 2, ch * 0.52, Math.min(cw, ch) * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(127, 229, 255, 0.08)';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cw / 2, ch * 0.52, Math.min(cw, ch) * 0.16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 116, 212, 0.07)';
            ctx.fill();
            ctx.restore();

            // Shake
            if (shakeTime > 0) {
                const mag = shakeTime * 20;
                const dx = (Math.random() - 0.5) * mag;
                const dy = (Math.random() - 0.5) * mag;
                ctx.translate(dx, dy);
            }

            // Danger Line
            ctx.beginPath();
            ctx.moveTo(0, dangerLineY);
            ctx.lineTo(cw, dangerLineY);
            ctx.strokeStyle = dangerTimer > 0
                ? `rgba(255, 95, 122, ${0.38 + Math.sin(Date.now()/120)*0.3})`
                : 'rgba(127, 229, 255, 0.18)';
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = dangerTimer > 0 ? 'rgba(255, 95, 122, 0.88)' : 'rgba(167, 173, 203, 0.72)';
            ctx.font = '600 11px "Orbitron", system-ui, sans-serif';
            ctx.fillText('EVENT HORIZON', 10, Math.max(14, dangerLineY - 8));

            // Current Drop
            if (currentDrop && gameState === 'PLAYING') {
                const t = BODY_TYPES[currentDrop.type];
                drawCosmicBody(currentDrop.x, currentDrop.y, t.r, t, {
                    alpha: 0.92,
                    pulse: (Math.sin(time * 4) + 1) * 0.5,
                    isPreview: true
                });
                
                // Drop guide
                ctx.beginPath();
                ctx.moveTo(currentDrop.x, currentDrop.y + t.r);
                ctx.lineTo(currentDrop.x, ch);
                ctx.strokeStyle = 'rgba(127,229,255,0.16)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Bodies
            for (let b of bodies) {
                const t = BODY_TYPES[b.type];
                drawCosmicBody(b.x, b.y, Math.max(0, b.r), t, {
                    pulse: (Math.sin(time * 2 + b.id * 10) + 1) * 0.5
                });
            }

            // Particles
            for (let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0, p.life * 3), 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1.0;

            // Flash
            if (flashAlpha > 0) {
                const flash = ctx.createRadialGradient(cw / 2, ch * 0.5, 0, cw / 2, ch * 0.5, maxSide * 0.55);
                flash.addColorStop(0, `rgba(255, 255, 255, ${flashAlpha * 0.65})`);
                flash.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = flash;
                ctx.fillRect(0, 0, cw, ch);
            }

            // Reset transform if shaked
            if (shakeTime > 0) {
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
        }

        function gameLoop(time) {
            try {
                if (!lastTime) lastTime = time;
                let dt = (time - lastTime) / 1000;
                lastTime = time;
                dt = Math.min(dt, 0.05); // Clamp dt

                if (gameState === 'PLAYING') {
                    updatePhysics(dt);
                    checkGameOver(dt);
                }

                // Update FX
                if (shakeTime > 0) shakeTime -= dt;
                if (flashAlpha > 0) flashAlpha -= dt * 2;
                if (warningAudioCooldown > 0) warningAudioCooldown -= dt;
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt * 2;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                draw();
            } catch (e) {
                console.error("Loop error:", e);
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', () => {
            ro.observe(document.getElementById('game-container'));
        });

    </script>
</body>
