<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover" />
  <title>Swamp Stack Money Tycoon</title>
  <meta name="description" content="A cozy fairycore money tycoon idle game where the Main Character Bog Baron stacks moon coins fr fr." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102b24'/%3E%3Ccircle cx='32' cy='34' r='19' fill='%2378c850'/%3E%3Ccircle cx='24' cy='31' r='3' fill='%23102b24'/%3E%3Ccircle cx='40' cy='31' r='3' fill='%23102b24'/%3E%3Cpath d='M22 20 31 6l4 14 9-8-2 14H22z' fill='%23ffd45c'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

    :root {
      --moss: #78c850;
      --deep: #102b24;
      --pond: #1f8f83;
      --mint: #bbf7a4;
      --gold: #ffd45c;
      --honey: #ffac33;
      --pink: #ff87c2;
      --lav: #bca8ff;
      --cream: #fff7ce;
      --danger: #f36f56;
      --panel: rgba(17, 50, 38, 0.82);
      --line: rgba(255, 247, 206, 0.22);
      --shadow: 0 18px 50px rgba(4, 17, 12, 0.42);
      --pixel: 'Press Start 2P', ui-monospace, monospace;
      --display: 'Bangers', Impact, fantasy;
      --ui: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--cream);
      font-family: var(--ui);
      background: #12271f;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #swampCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .scene {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 212, 92, 0.20), transparent 18%),
        radial-gradient(circle at 76% 8%, rgba(188, 168, 255, 0.26), transparent 22%),
        linear-gradient(180deg, #44316e 0%, #285864 34%, #173f34 64%, #102b24 100%);
    }
    .scene::before {
      content: ""; position: absolute; inset: -8% -10%; opacity: 0.6;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 18px 18px;
      transform: rotate(-2deg) scale(1.1);
      mix-blend-mode: screen;
    }
    .moon {
      position: absolute; top: 5.5%; right: 12%; width: 5.8rem; height: 5.8rem; border-radius: 50%;
      background: radial-gradient(circle at 36% 32%, #fffbe2, var(--gold) 58%, #ed9c2f 78%);
      box-shadow: 0 0 45px rgba(255,212,92,0.58), inset -12px -10px 0 rgba(214,130,50,0.16);
      animation: moonFloat 7s ease-in-out infinite;
    }
    .bog-line { position: absolute; left: -10%; right: -10%; bottom: 20%; height: 16%; background: rgba(14,54,43,0.76); border-radius: 50% 50% 0 0; filter: blur(0.2px); }
    .lily, .mush, .cattail { position: absolute; bottom: 4%; opacity: 0.88; }
    .lily { width: 5.5rem; height: 2rem; border-radius: 50%; background: radial-gradient(circle at 28% 45%, #b8f777 0 12%, transparent 13%), linear-gradient(90deg, #2cb56c, #79da65); box-shadow: inset -1rem 0 0 rgba(12,80,55,0.25); animation: drift 9s ease-in-out infinite; }
    .lily.one { left: 4%; bottom: 10%; transform: rotate(-6deg); }
    .lily.two { right: 2%; bottom: 15%; transform: rotate(8deg) scale(0.8); animation-delay: -4s; }
    .lily.three { left: 41%; bottom: 6%; transform: rotate(4deg) scale(0.66); animation-delay: -2s; }
    .mush { width: 2.5rem; height: 2.6rem; background: linear-gradient(180deg, var(--pink) 0 43%, #ffe5b7 44% 100%); border-radius: 2rem 2rem 0.7rem 0.7rem; box-shadow: inset 0.7rem 0 0 rgba(255,255,255,0.15); }
    .mush::before { content:""; position:absolute; inset:0.35rem 0.55rem auto auto; width:0.45rem; height:0.45rem; border-radius:50%; background:#fff7ce; box-shadow:-0.9rem 0.3rem 0 #fff7ce; }
    .mush.one { left: 17%; bottom: 13%; transform: scale(0.78); }
    .mush.two { right: 25%; bottom: 10%; transform: scale(0.58) rotate(5deg); }
    .cattail { width: 0.28rem; height: 6rem; background: #70b266; border-radius: 1rem; transform-origin: bottom; animation: sway 4.8s ease-in-out infinite; }
    .cattail::before { content:""; position:absolute; left:-0.28rem; top:0.2rem; width:0.85rem; height:2.2rem; border-radius:999px; background:#805338; box-shadow: 0 0 0 2px rgba(255,247,206,0.06); }
    .cattail.one { left: 8%; bottom: 13%; }
    .cattail.two { right: 11%; bottom: 14%; animation-delay:-2s; transform: scale(0.83); }

    .app { position: relative; z-index: 4; width: 100%; height: 100%; max-width: 540px; margin: 0 auto; overflow: hidden; }
    .safe { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }

    .start-screen {
      position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 1.25rem;
      background: radial-gradient(circle at 50% 18%, rgba(255,212,92,0.16), transparent 25%), rgba(12, 31, 24, 0.92);
      transition: opacity 0.55s ease;
    }
    .start-card {
      width: min(94vw, 27rem); border: 3px solid rgba(255,247,206,0.28); border-radius: 2rem;
      background: linear-gradient(180deg, rgba(25,72,52,0.93), rgba(16,43,36,0.95)); box-shadow: var(--shadow), inset 0 0 0 2px rgba(120,200,80,0.2);
      padding: 1.15rem; text-align: center; position: relative; overflow: hidden;
    }
    .start-card::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 12% 14%, rgba(255,135,194,0.24), transparent 21%), radial-gradient(circle at 90% 6%, rgba(255,212,92,0.18), transparent 20%); pointer-events:none; }
    .brand { position: relative; z-index: 1; margin: 0.4rem 0 0; font-family: var(--display); font-size: clamp(3.4rem, 15vw, 5.6rem); line-height: 0.82; letter-spacing: 0.04em; color: var(--gold); text-shadow: 4px 4px 0 #315c33, 0 0 22px rgba(255,212,92,0.35); }
    .hook { position:relative; z-index:1; font-family:var(--pixel); color:var(--mint); font-size:0.58rem; line-height:1.55; letter-spacing:0.06em; margin: 0.7rem auto 1rem; max-width: 20rem; }
    .mascot { width: 9rem; height: 9rem; margin: 0 auto 0.7rem; position: relative; z-index: 1; animation: mascotBob 2.8s ease-in-out infinite; filter: drop-shadow(0 16px 16px rgba(0,0,0,0.26)); }
    .ogre-head { position:absolute; left:1.1rem; top:1.2rem; width:6.8rem; height:6rem; border-radius:46% 46% 42% 42%; background: radial-gradient(circle at 35% 30%, #c6ff8f, #70c95a 62%, #3f9a46); border:3px solid #245d35; }
    .ogre-head::before, .ogre-head::after { content:""; position:absolute; top:0.85rem; width:2.25rem; height:1.25rem; background:#70c95a; border:3px solid #245d35; border-radius:999px; }
    .ogre-head::before { left:-1.65rem; transform:rotate(-17deg); } .ogre-head::after { right:-1.65rem; transform:rotate(17deg); }
    .eye { position:absolute; top:2.35rem; width:0.62rem; height:0.62rem; border-radius:50%; background:#112b20; box-shadow: 0 0 0 0.16rem #fff7ce; } .eye.left{left:2.2rem;} .eye.right{right:2.2rem;}
    .smile { position:absolute; left:2.55rem; top:3.85rem; width:1.8rem; height:0.8rem; border-bottom:0.22rem solid #123125; border-radius:50%; }
    .crown { position:absolute; left:2.75rem; top:-0.65rem; width:3.5rem; height:1.8rem; background: linear-gradient(135deg, var(--gold), var(--honey)); clip-path: polygon(0 100%, 0 35%, 25% 68%, 50% 0, 75% 68%, 100% 35%, 100% 100%); border-radius:0.2rem; filter: drop-shadow(0 3px 0 #8a5b16); }
    .coin-belly { position:absolute; left:3.25rem; bottom:0.1rem; width:2.55rem; height:2.1rem; border-radius:50%; background: radial-gradient(circle, #fff4a8, var(--gold)); border: 3px solid #9d6b10; display:grid; place-items:center; color:#714b00; font-family:var(--pixel); font-size:1rem; }
    .start-button, button {
      border: 0; cursor: pointer; color: #122018; font-weight: 900; touch-action: manipulation;
    }
    .start-button { position:relative; z-index:2; width:100%; min-height:4.2rem; border-radius:1.35rem; background: linear-gradient(180deg, #fff58a, var(--gold) 55%, #e89725); font-family:var(--pixel); font-size:0.78rem; letter-spacing:0.08em; box-shadow: 0 8px 0 #765012, 0 18px 28px rgba(0,0,0,0.28); text-transform:uppercase; }
    .start-button:active { transform: translateY(5px); box-shadow:0 3px 0 #765012, 0 10px 18px rgba(0,0,0,0.24); }
    .micro { position:relative; z-index:1; margin:1rem 0 0; color:rgba(255,247,206,0.72); font-size:0.85rem; }

    .hud { position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity 0.35s ease; }
    .hud.active { opacity:1; pointer-events:auto; }
    .top { padding: 0.75rem; flex-shrink:0; }
    .ledger { border:2px solid var(--line); border-radius:1.25rem; background: var(--panel); backdrop-filter: blur(16px); box-shadow: var(--shadow); padding:0.9rem; position:relative; overflow:hidden; }
    .ledger::after { content:""; position:absolute; right:-2rem; top:-2rem; width:8rem; height:8rem; border-radius:50%; background: radial-gradient(circle, rgba(255,212,92,0.20), transparent 63%); pointer-events:none; }
    .mini-mascot { float:right; width:4.5rem; height:4.5rem; margin-left:0.45rem; position:relative; transform: scale(0.55); transform-origin: top right; }
    .label { font-family:var(--pixel); font-size:0.53rem; letter-spacing:0.06em; color:var(--mint); text-transform:uppercase; }
    .cash-row { display:flex; align-items:flex-end; gap:0.35rem; margin:0.25rem 0 0.45rem; }
    .cash-symbol { font-family:var(--display); color:var(--gold); font-size:2.4rem; line-height:0.9; text-shadow:2px 2px 0 #704e16; }
    #display-cash { font-family:var(--display); color:#fff9ca; font-size:clamp(3rem, 13vw, 4.7rem); line-height:0.82; text-shadow:3px 3px 0 #315c33; max-width:100%; overflow:hidden; }
    .stat-strip { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
    .pill { display:inline-flex; align-items:center; gap:0.32rem; border:1px solid rgba(255,247,206,0.18); border-radius:999px; background:rgba(7,28,22,0.52); color:var(--cream); padding:0.42rem 0.55rem; font-size:0.75rem; font-weight:800; }
    .pill b { color:var(--gold); font-family:var(--pixel); font-size:0.55rem; }

    .control-row { display:grid; grid-template-columns:1fr 1.12fr 4.2rem; gap:0.5rem; padding:0 0.75rem 0.45rem; flex-shrink:0; }
    .small-btn { min-height:3.35rem; border-radius:1rem; background:rgba(255,247,206,0.12); color:var(--cream); border:2px solid rgba(255,247,206,0.18); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.14); font-family:var(--pixel); font-size:0.5rem; line-height:1.3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem; }
    .small-btn .icon { font-size:1.25rem; line-height:1; }
    .small-btn:disabled { opacity:0.45; filter:grayscale(0.7); }
    .buy-all { border-color:rgba(187,247,164,0.48); background:rgba(72,155,70,0.24); }
    .loophole { border-color:rgba(255,135,194,0.45); background:rgba(255,135,194,0.16); }
    .mode-1 { border-color:rgba(255,212,92,0.68); color:var(--gold); }
    .mode-NEXT { border-color:rgba(255,135,194,0.76); color:var(--pink); }
    .mode-MAX { border-color:rgba(188,168,255,0.86); color:var(--lav); }

    .tier-wrap { flex:1; min-height:0; position:relative; max-width:540px; width:100%; margin:0 auto; }
    #tier-list { height:100%; overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; padding:0.35rem 0.75rem 7.8rem; scrollbar-width:none; }
    #tier-list::-webkit-scrollbar { display:none; }
    .empty-state { min-height: 15rem; display:grid; place-items:center; text-align:center; color:rgba(255,247,206,0.56); border:2px dashed rgba(255,247,206,0.18); border-radius:1.25rem; background:rgba(12,37,29,0.38); }
    .empty-state .big { font-size:3.8rem; filter: drop-shadow(0 8px 6px rgba(0,0,0,0.18)); }
    .empty-state p { margin:0.35rem 0; }
    .tier-card { display:grid; grid-template-columns:3.35rem 1fr minmax(5.6rem, 6.4rem); gap:0.65rem; align-items:center; margin-bottom:0.65rem; padding:0.72rem; border-radius:1.15rem; border:2px solid rgba(255,247,206,0.16); background:linear-gradient(135deg, rgba(24,75,47,0.88), rgba(25,55,62,0.82)); box-shadow:0 10px 26px rgba(4,17,12,0.24), inset 0 0 0 1px rgba(120,200,80,0.08); position:relative; overflow:hidden; }
    .tier-card::before { content:""; position:absolute; inset:0; background-image: radial-gradient(circle at 8% 15%, rgba(255,212,92,0.14), transparent 15%), linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); transform:translateX(-100%); pointer-events:none; }
    .tier-card.bonus-flash::before { animation: shine 0.55s ease; }
    .tier-card.is-bonus { border-color:rgba(255,212,92,0.42); box-shadow:0 0 25px rgba(255,212,92,0.12), inset 0 0 0 1px rgba(255,212,92,0.14); }
    .tier-icon { width:3.25rem; height:3.25rem; border-radius:1rem; display:grid; place-items:center; font-size:1.6rem; background:linear-gradient(180deg, rgba(255,212,92,0.28), rgba(120,200,80,0.24)); border:2px solid rgba(255,247,206,0.18); box-shadow: inset 0 -5px 0 rgba(0,0,0,0.14); }
    .tier-name { font-weight:950; color:#fff9cf; font-size:0.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .level-badge { display:inline-flex; align-items:center; gap:0.25rem; font-family:var(--pixel); font-size:0.48rem; color:var(--deep); background:var(--mint); border-radius:999px; padding:0.22rem 0.38rem; margin-bottom:0.28rem; }
    .tier-meta { font-size:0.74rem; color:rgba(255,247,206,0.72); line-height:1.35; }
    .tier-meta strong { color:var(--gold); }
    .upgrade-btn { min-height:3.25rem; border-radius:0.95rem; background:linear-gradient(180deg, #fff6a8, var(--gold)); color:#1d321f; font-family:var(--pixel); font-size:0.48rem; line-height:1.35; box-shadow:0 5px 0 #7a5515; padding:0.35rem; }
    .upgrade-btn:disabled { opacity:0.44; filter:grayscale(0.75); box-shadow:0 5px 0 #3d4b35; }
    .upgrade-btn:active:not(:disabled) { transform:translateY(3px); box-shadow:0 2px 0 #7a5515; }

    .bottom-bar { position:absolute; left:0; right:0; bottom:0; z-index:8; padding:0.7rem 0.75rem max(0.8rem, env(safe-area-inset-bottom)); display:grid; grid-template-columns:4.8rem 1fr; gap:0.65rem; background:linear-gradient(180deg, rgba(16,43,36,0), rgba(16,43,36,0.93) 18%, rgba(11,31,25,0.98)); border-top:1px solid rgba(255,247,206,0.12); }
    .auto-btn { min-height:4.55rem; border-radius:1.2rem; border:2px solid rgba(255,247,206,0.18); background:rgba(255,247,206,0.12); color:rgba(255,247,206,0.72); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.25rem; font-family:var(--pixel); font-size:0.48rem; }
    .auto-btn.active { color:var(--mint); border-color:rgba(187,247,164,0.58); background:rgba(74,151,72,0.30); }
    .switch { width:2.4rem; height:1.24rem; border-radius:999px; border:2px solid currentColor; padding:0.12rem; }
    .knob { display:block; width:0.68rem; height:0.68rem; border-radius:50%; background:currentColor; transition:transform 0.2s; }
    .auto-btn.active .knob { transform:translateX(1.04rem); }
    .recruit-btn { min-height:4.55rem; border-radius:1.2rem; border:2px solid rgba(255,247,206,0.2); background:linear-gradient(135deg, rgba(255,212,92,0.12), rgba(120,200,80,0.18)); color:var(--cream); padding:0.62rem 0.72rem; position:relative; overflow:hidden; text-align:left; box-shadow:0 10px 24px rgba(0,0,0,0.22); }
    .recruit-btn.ready { border-color:rgba(255,212,92,0.8); background:linear-gradient(180deg, rgba(255,212,92,0.34), rgba(120,200,80,0.25)); animation: readyPulse 1.3s ease-in-out infinite; }
    .recruit-btn:disabled { opacity:0.84; }
    .recruit-grid { display:flex; justify-content:space-between; align-items:center; gap:0.6rem; position:relative; z-index:1; }
    #recruit-label, #recruit-cost-label { font-family:var(--pixel); font-size:0.46rem; color:var(--mint); line-height:1.3; text-transform:uppercase; }
    #recruit-name { font-family:var(--display); color:#fff8c8; font-size:1.75rem; line-height:0.92; text-shadow:2px 2px 0 #315c33; max-width:11rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cost { font-family:var(--pixel); color:var(--gold); font-size:0.72rem; white-space:nowrap; }
    .progress-track { position:absolute; left:0; right:0; bottom:0; height:0.34rem; background:rgba(0,0,0,0.24); }
    #recruit-progress { height:100%; width:0%; background:linear-gradient(90deg, var(--pink), var(--gold), var(--mint)); transition:width 0.25s ease; }

    .toast-zone { position:absolute; top:max(0.8rem, env(safe-area-inset-top)); left:0.75rem; right:0.75rem; z-index:40; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:0.45rem; }
    .toast { max-width:100%; border:2px solid rgba(255,247,206,0.2); border-radius:999px; padding:0.58rem 0.82rem; background:rgba(16,43,36,0.92); box-shadow:0 10px 28px rgba(0,0,0,0.28); font-family:var(--pixel); font-size:0.55rem; line-height:1.35; color:var(--cream); transform:translateY(-0.6rem); opacity:0; animation: toastIn 0.18s ease forwards; text-align:center; }
    .toast.success { border-color:rgba(187,247,164,0.55); color:var(--mint); }
    .toast.warn { border-color:rgba(255,212,92,0.58); color:var(--gold); }
    .toast.loophole { border-color:rgba(255,135,194,0.66); color:var(--pink); }
    .spark { position:absolute; z-index:25; pointer-events:none; color:var(--gold); font-family:var(--display); font-size:1.55rem; text-shadow:2px 2px 0 #315c33; animation: sparkUp 0.9s ease-out forwards; }

    .hidden { display:none !important; }
    @keyframes mascotBob { 0%,100%{ transform:translateY(0) rotate(-1deg);} 50%{ transform:translateY(-8px) rotate(1deg);} }
    @keyframes moonFloat { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(10px);} }
    @keyframes drift { 0%,100%{ translate:0 0;} 50%{ translate:0.65rem -0.2rem;} }
    @keyframes sway { 0%,100%{ rotate:-2deg;} 50%{ rotate:4deg;} }
    @keyframes shine { to { transform:translateX(100%);} }
    @keyframes readyPulse { 0%,100%{ box-shadow:0 0 0 rgba(255,212,92,0);} 50%{ box-shadow:0 0 28px rgba(255,212,92,0.22);} }
    @keyframes toastIn { to { transform:translateY(0); opacity:1;} }
    @keyframes toastOut { to { transform:translateY(-0.6rem); opacity:0;} }
    @keyframes sparkUp { 0%{ transform:translateY(0) scale(0.8); opacity:0;} 18%{opacity:1;} 100%{ transform:translateY(-60px) scale(1.12); opacity:0;} }

    @media (max-height: 650px) {
      .mascot { width:7.2rem; height:7.2rem; margin-bottom:0.3rem; }
      .brand { font-size:clamp(2.9rem, 13vw, 4.3rem); }
      .hook { margin:0.45rem auto 0.75rem; }
      .ledger { padding:0.7rem; }
      .bottom-bar { padding-top:0.5rem; }
    }
  </style>
</head>
<body>
  <canvas id="swampCanvas" aria-hidden="true"></canvas>
  <div class="scene" aria-hidden="true">
    <div class="moon"></div><div class="bog-line"></div>
    <div class="lily one"></div><div class="lily two"></div><div class="lily three"></div>
    <div class="mush one"></div><div class="mush two"></div>
    <div class="cattail one"></div><div class="cattail two"></div>
  </div>

  <main class="app safe">
    <section id="start-screen" class="start-screen" aria-label="Start screen">
      <div class="start-card">
        <div class="mascot" aria-hidden="true">
          <div class="ogre-head"><div class="crown"></div><i class="eye left"></i><i class="eye right"></i><i class="smile"></i></div><div class="coin-belly">$</div>
        </div>
        <h1 class="brand">SWAMP<br>STACK</h1>
        <p class="hook">money tycoon • fairycore idle • main character bog baron fr fr</p>
        <button id="btn-start" class="start-button">Start stacking coins</button>
        <p class="micro">One thumb. Cozy before-bed bog capitalism.</p>
      </div>
    </section>

    <section id="game-hud" class="hud" aria-label="Money tycoon HUD">
      <div id="toast-container" class="toast-zone" aria-live="polite"></div>
      <header class="top">
        <div class="ledger">
          <div class="mini-mascot" aria-hidden="true"><div class="ogre-head"><div class="crown"></div><i class="eye left"></i><i class="eye right"></i><i class="smile"></i></div><div class="coin-belly">$</div></div>
          <div class="label">Moon Coin Pile</div>
          <div class="cash-row"><span class="cash-symbol">$</span><span id="display-cash">10</span></div>
          <div class="stat-strip">
            <span class="pill">🌙 <b id="display-income">0</b> cozy/sec</span>
            <span class="pill">👑 tax vibe <b id="display-discount">100%</b></span>
          </div>
        </div>
      </header>

      <nav class="control-row" aria-label="Tycoon controls">
        <button id="btn-buy-all" class="small-btn buy-all"><span class="icon">✨</span><span>Bless All</span></button>
        <button id="btn-exploit" class="small-btn loophole"><span class="icon">👑</span><span>Royal Loophole</span><small>$<span id="exploit-cost">500</span></small></button>
        <button id="btn-buy-mode" class="small-btn mode-1"><span class="icon">⚙️</span><span id="buy-mode-text">x1</span></button>
      </nav>

      <div class="tier-wrap">
        <div id="tier-list">
          <div id="empty-state" class="empty-state">
            <div><div class="big">🪷</div><p class="label">no bog biz yet</p><p>Open the first cozy stall below.</p></div>
          </div>
        </div>
        <div class="bottom-bar">
          <button id="btn-auto-recruit" class="auto-btn"><span>Sleepy</span><span class="switch"><span id="auto-indicator" class="knob"></span></span><span id="auto-status-text">OFF</span></button>
          <button id="btn-recruit" class="recruit-btn">
            <div class="recruit-grid">
              <div><div id="recruit-label">Open Next Bog Biz</div><div id="recruit-name">Mud Muffin Cart</div></div>
              <div style="text-align:right"><div id="recruit-cost-label">Ready</div><div class="cost">$<span id="recruit-cost">OPEN</span></div></div>
            </div>
            <div class="progress-track"><div id="recruit-progress"></div></div>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const CONFIG = {
        baseCost: 10,
        targetMultiplier: 5.0,
        upgradeBaseMultiplier: 1.15,
        incomeMultiplier: 4.0,
        bonusTargetSteps: [10, 25, 50, 100],
        bonusMultipliers: [2, 2.5, 3, 5, 10],
        uiThrottleMs: 100,
        exploitBaseCost: 500,
        exploitCostMult: 2.5
      };

      const TIER_NAMES = [
        'Mud Muffin Cart', 'Onion Ring Ferry', 'Lily Ledger Nook', 'Pixie Toll Booth',
        'Dragon Onion Stand', 'Frog CPA Hut', 'Moss Mall Kiosk', 'Donkey Karaoke Bank',
        'Royal Tax Duck', 'Firefly ATM Grove', 'Gingerbread Pawn Shop', 'Moonlit Bog Bazaar',
        'Castle Rent Office', 'Potion Coupon Tower', 'Ogrecore Outlet', 'Happily Ever After Holdings'
      ];
      const TIER_ICONS = ['🧁','🧅','🪷','🧚','🐉','🐸','🛍️','🎤','🦆','✨','🍪','🌙','🏰','🧪','👂','💚'];
      const TONES = {
        start: [330, 494, 660],
        buy: [392, 523],
        upgrade: [440, 660],
        fail: [196, 155],
        bonus: [523, 659, 784],
        unlock: [349, 523, 698],
        exploit: [220, 330, 247],
        autoOn: [392, 587],
        autoOff: [294, 220]
      };

      const state = {
        cash: 10,
        lifetimeEarnings: 10,
        totalIncome: 0,
        tiers: [],
        nextTierIndex: 0,
        nextTierTarget: CONFIG.baseCost,
        lastTick: 0,
        lastUiUpdate: 0,
        isRunning: false,
        buyMode: '1',
        autoRecruit: false,
        globalDiscount: 1.0,
        exploitCost: CONFIG.exploitBaseCost
      };

      const audio = {
        ctx: null,
        humTimer: null,
        init() {
          if (this.ctx) return;
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          this.ctx = new AudioContext();
        },
        playBGM() {
          if (!this.ctx || this.humTimer) return;
          this.humTimer = setInterval(() => this.playTone(110 + Math.random() * 20, 0.035, 0.025, 'sine'), 3400);
        },
        playTone(freq, duration = 0.08, volume = 0.045, type = 'triangle', delay = 0) {
          if (!this.ctx) return;
          const t = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(volume, t + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
          osc.connect(gain).connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + duration + 0.02);
        },
        playSFX(key, pitch = 1) {
          const notes = TONES[key] || [330];
          notes.forEach((freq, i) => this.playTone(freq * pitch, key === 'fail' ? 0.11 : 0.075, key === 'fail' ? 0.03 : 0.05, key === 'exploit' ? 'sawtooth' : 'triangle', i * 0.055));
        }
      };

      const SUFFIXES = ['', 'k', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
      function formatNumber(num) {
        if (num < 1000) return Math.floor(num).toLocaleString();
        const tier = Math.floor(Math.log10(num) / 3);
        const suffix = SUFFIXES[tier] || '??';
        const scale = Math.pow(10, tier * 3);
        return (num / scale).toFixed(2) + suffix;
      }
      function formatMultiplier(num) { return num >= 10 ? Math.round(num).toString() : (Math.round(num * 10) / 10).toString(); }
      function getTierName(index) { return TIER_NAMES[index] || `Bog Holding ${index + 1}`; }
      function getTierIcon(index) { return TIER_ICONS[index % TIER_ICONS.length]; }
      function getRandomBonusStep() { return CONFIG.bonusTargetSteps[Math.floor(Math.random() * CONFIG.bonusTargetSteps.length)]; }
      function getRandomMultiplier() { return CONFIG.bonusMultipliers[Math.floor(Math.random() * CONFIG.bonusMultipliers.length)]; }
      function calculateCostForN(currentCost, r, n) {
        const effectiveCost = currentCost * state.globalDiscount;
        if (r === 1) return effectiveCost * n;
        return effectiveCost * (Math.pow(r, n) - 1) / (r - 1);
      }
      function calculateMaxAffordable(cash, currentCost, r) {
        const effectiveCost = currentCost * state.globalDiscount;
        if (cash < effectiveCost) return 0;
        if (r === 1) return Math.floor(cash / effectiveCost);
        const numerator = (cash * (r - 1)) / effectiveCost + 1;
        return Math.floor(Math.log(numerator) / Math.log(r));
      }

      const els = {
        cash: document.getElementById('display-cash'), income: document.getElementById('display-income'), discount: document.getElementById('display-discount'),
        recruitBtn: document.getElementById('btn-recruit'), recruitName: document.getElementById('recruit-name'), recruitCost: document.getElementById('recruit-cost'), recruitCostLabel: document.getElementById('recruit-cost-label'), recruitLabel: document.getElementById('recruit-label'), recruitProgress: document.getElementById('recruit-progress'),
        autoRecruitBtn: document.getElementById('btn-auto-recruit'), autoStatusText: document.getElementById('auto-status-text'),
        list: document.getElementById('tier-list'), empty: document.getElementById('empty-state'), startScreen: document.getElementById('start-screen'), hud: document.getElementById('game-hud'),
        buyModeBtn: document.getElementById('btn-buy-mode'), buyModeText: document.getElementById('buy-mode-text'), buyAllBtn: document.getElementById('btn-buy-all'), exploitBtn: document.getElementById('btn-exploit'), exploitCost: document.getElementById('exploit-cost'), toastContainer: document.getElementById('toast-container')
      };

      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        els.toastContainer.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'toastOut 0.22s ease forwards'; setTimeout(() => toast.remove(), 230); }, 2200);
      }
      function sparkle(text = '+$') {
        const s = document.createElement('div');
        s.className = 'spark';
        s.textContent = text;
        const x = 38 + Math.random() * 24;
        const y = 45 + Math.random() * 14;
        s.style.left = x + '%'; s.style.top = y + '%';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 950);
      }

      class Tier {
        constructor(index) {
          this.index = index;
          this.name = getTierName(index);
          this.level = 1;
          const initialCost = CONFIG.baseCost * Math.pow(CONFIG.targetMultiplier, index);
          this.baseIncome = initialCost / 10;
          this.baseUpgradeCost = initialCost * 0.5;
          this.currentUpgradeCost = this.baseUpgradeCost;
          this.incomeMultiplier = 1;
          this.bonusTarget = this.level + getRandomBonusStep();
          this.nextBonusMult = getRandomMultiplier();
          this.recalcIncome();
          this.el = this.createDOM();
        }
        recalcIncome() { this.currentIncome = this.baseIncome * this.level * this.incomeMultiplier; }
        getIncome() { return this.currentIncome; }
        getPurchaseInfo() {
          const r = CONFIG.upgradeBaseMultiplier;
          if (state.buyMode === 'MAX') {
            const count = calculateMaxAffordable(state.cash, this.currentUpgradeCost, r);
            if (count <= 0) return { cost: this.currentUpgradeCost * state.globalDiscount, count: 1, affordable: false, label: 'MAX' };
            return { cost: calculateCostForN(this.currentUpgradeCost, r, count), count, affordable: true, label: `+${count}` };
          }
          if (state.buyMode === 'NEXT') {
            let count = this.bonusTarget - this.level;
            if (count < 1) count = 1;
            const totalCost = calculateCostForN(this.currentUpgradeCost, r, count);
            return { cost: totalCost, count, affordable: state.cash >= totalCost, label: `TO ${this.bonusTarget}` };
          }
          const cost1 = this.currentUpgradeCost * state.globalDiscount;
          return { cost: cost1, count: 1, affordable: state.cash >= cost1, label: 'UP' };
        }
        upgrade(silent = false) {
          const info = this.getPurchaseInfo();
          if (!info.affordable) return false;
          state.cash -= info.cost;
          this.level += info.count;
          let bonusHit = false;
          while (this.level >= this.bonusTarget) {
            this.incomeMultiplier *= this.nextBonusMult;
            this.bonusTarget += getRandomBonusStep();
            this.nextBonusMult = getRandomMultiplier();
            bonusHit = true;
          }
          this.currentUpgradeCost = this.currentUpgradeCost * Math.pow(CONFIG.upgradeBaseMultiplier, info.count);
          this.recalcIncome();
          this.updateDOM();
          if (bonusHit) { if (!silent) audio.playSFX('bonus', 1.5); this.triggerBonusVisuals(); sparkle('BONUS'); }
          else if (!silent) audio.playSFX('upgrade', info.count > 1 ? 1.18 : 1);
          return true;
        }
        triggerBonusVisuals() { this.el.classList.remove('bonus-flash'); void this.el.offsetWidth; this.el.classList.add('bonus-flash'); }
        createDOM() {
          const div = document.createElement('article');
          div.className = 'tier-card';
          div.innerHTML = `
            <div class="tier-icon">${getTierIcon(this.index)}</div>
            <div class="tier-body">
              <div class="level-badge">LV <span class="tier-level">${this.level}</span></div>
              <div class="tier-name">${this.name}</div>
              <div class="tier-meta">+<strong class="tier-income">${formatNumber(this.currentIncome)}</strong>/sec <span class="tier-mult-container hidden">• x<span class="tier-mult">1</span></span><br>Next blessing x<span class="tier-next-mult">${formatMultiplier(this.nextBonusMult)}</span> @ Lv <span class="tier-target">${this.bonusTarget}</span></div>
            </div>
            <button class="upgrade-btn"><span class="tier-btn-label">UP</span><br>$<span class="tier-cost">${formatNumber(this.currentUpgradeCost)}</span></button>`;
          const btn = div.querySelector('button');
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this.upgrade()) { sparkle('+$'); updateFastUI(); updateSlowUI(true); }
            else { audio.playSFX('fail'); showToast('Not enough moon coins fr fr', 'warn'); }
          });
          this.refs = {
            level: div.querySelector('.tier-level'), income: div.querySelector('.tier-income'), cost: div.querySelector('.tier-cost'), label: div.querySelector('.tier-btn-label'), target: div.querySelector('.tier-target'), nextMult: div.querySelector('.tier-next-mult'), mult: div.querySelector('.tier-mult'), multContainer: div.querySelector('.tier-mult-container'), btn
          };
          return div;
        }
        updateDOM() {
          this.refs.level.textContent = this.level;
          this.refs.income.textContent = formatNumber(this.currentIncome);
          this.refs.target.textContent = this.bonusTarget;
          this.refs.nextMult.textContent = formatMultiplier(this.nextBonusMult);
          this.el.classList.toggle('is-bonus', this.incomeMultiplier > 1);
          if (this.incomeMultiplier > 1) { this.refs.multContainer.classList.remove('hidden'); this.refs.mult.textContent = formatMultiplier(this.incomeMultiplier); }
          else this.refs.multContainer.classList.add('hidden');
        }
        updateButtonState() {
          const info = this.getPurchaseInfo();
          this.refs.cost.textContent = formatNumber(info.cost);
          this.refs.label.textContent = info.label;
          this.refs.btn.disabled = !info.affordable;
        }
      }

      function unlockNextTier(isAuto = false) {
        if (state.lifetimeEarnings >= state.nextTierTarget) {
          const newTier = new Tier(state.nextTierIndex);
          state.tiers.unshift(newTier);
          if (state.nextTierIndex === 0) els.empty.style.display = 'none';
          els.list.prepend(newTier.el);
          els.list.scrollTop = 0;
          state.nextTierIndex++;
          state.nextTierTarget = state.nextTierTarget * CONFIG.targetMultiplier;
          audio.playSFX('unlock', 1.1);
          showToast(`${isAuto ? 'Sleepy auto-open' : 'Bog biz open'}: ${newTier.name}`, isAuto ? 'info' : 'success');
          sparkle('OPEN');
          updateFastUI(); updateSlowUI(true);
        } else if (!isAuto) {
          audio.playSFX('fail');
          showToast('Royal gate says: earn more coins', 'warn');
        }
      }
      function buyExploit() {
        if (state.cash >= state.exploitCost) {
          state.cash -= state.exploitCost;
          const reduction = (Math.random() * 0.04) + 0.01;
          state.globalDiscount *= (1 - reduction);
          state.exploitCost *= CONFIG.exploitCostMult;
          audio.playSFX('exploit', 0.8);
          showToast(`Royal loophole: -${(reduction * 100).toFixed(2)}% tax vibe`, 'loophole');
          sparkle('TAX?');
          updateFastUI(); updateSlowUI(true);
        } else { audio.playSFX('fail'); showToast('Loophole costs more coins', 'warn'); }
      }
      function toggleBuyMode() {
        const modes = ['1', 'NEXT', 'MAX'];
        state.buyMode = modes[(modes.indexOf(state.buyMode) + 1) % modes.length];
        els.buyModeText.textContent = state.buyMode === '1' ? 'x1' : state.buyMode === 'NEXT' ? 'BONUS' : 'MAX';
        els.buyModeBtn.classList.remove('mode-1', 'mode-NEXT', 'mode-MAX');
        els.buyModeBtn.classList.add(`mode-${state.buyMode}`);
        audio.playSFX('buy', state.buyMode === 'MAX' ? 1.4 : 1);
        updateSlowUI(true);
      }
      function toggleAutoRecruit() {
        state.autoRecruit = !state.autoRecruit;
        els.autoRecruitBtn.classList.toggle('active', state.autoRecruit);
        els.autoStatusText.textContent = state.autoRecruit ? 'ON' : 'OFF';
        audio.playSFX(state.autoRecruit ? 'autoOn' : 'autoOff');
        showToast(state.autoRecruit ? 'Sleepy auto-open activated' : 'Sleepy auto-open paused', 'info');
      }
      function buyAll() {
        let boughtAnything = false;
        for (const tier of state.tiers) if (tier.upgrade(true)) boughtAnything = true;
        if (boughtAnything) { audio.playSFX('buy', 1.3); sparkle('ALL'); updateFastUI(); updateSlowUI(true); }
        else { audio.playSFX('fail'); showToast('No affordable blessings yet', 'warn'); }
      }
      function calculateTotalIncome() { return state.tiers.reduce((sum, tier) => sum + tier.getIncome(), 0); }
      function updateFastUI() { els.cash.textContent = formatNumber(state.cash); els.income.textContent = formatNumber(state.totalIncome); }
      function updateSlowUI() {
        els.discount.textContent = `${Math.round(state.globalDiscount * 100)}%`;
        els.exploitCost.textContent = formatNumber(state.exploitCost);
        els.exploitBtn.disabled = state.cash < state.exploitCost;
        const targetMet = state.lifetimeEarnings >= state.nextTierTarget;
        els.recruitName.textContent = getTierName(state.nextTierIndex);
        if (targetMet) {
          els.recruitBtn.classList.add('ready'); els.recruitBtn.disabled = false;
          els.recruitCost.textContent = 'OPEN'; els.recruitCostLabel.textContent = 'Ready'; els.recruitLabel.textContent = 'Tap to open'; els.recruitProgress.style.width = '100%';
        } else {
          els.recruitBtn.classList.remove('ready'); els.recruitBtn.disabled = true;
          els.recruitCost.textContent = formatNumber(state.nextTierTarget); els.recruitCostLabel.textContent = 'Goal'; els.recruitLabel.textContent = 'Open Next Bog Biz';
          els.recruitProgress.style.width = `${Math.min(100, (state.lifetimeEarnings / state.nextTierTarget) * 100)}%`;
        }
        let anyAffordable = false;
        for (const tier of state.tiers) { tier.updateButtonState(); if (!tier.refs.btn.disabled) anyAffordable = true; }
        els.buyAllBtn.disabled = !anyAffordable;
      }
      function loop(timestamp) {
        if (!state.isRunning) return;
        const dt = (timestamp - state.lastTick) / 1000;
        state.lastTick = timestamp;
        if (dt > 0 && dt < 2) {
          state.totalIncome = calculateTotalIncome();
          const earned = state.totalIncome * dt;
          state.cash += earned;
          state.lifetimeEarnings += earned;
        }
        if (state.autoRecruit && state.lifetimeEarnings >= state.nextTierTarget) unlockNextTier(true);
        updateFastUI();
        if (timestamp - state.lastUiUpdate > CONFIG.uiThrottleMs) { updateSlowUI(); state.lastUiUpdate = timestamp; }
        requestAnimationFrame(loop);
      }

      els.recruitBtn.addEventListener('click', e => { e.preventDefault(); unlockNextTier(false); });
      els.autoRecruitBtn.addEventListener('click', e => { e.preventDefault(); toggleAutoRecruit(); });
      els.buyModeBtn.addEventListener('click', e => { e.preventDefault(); toggleBuyMode(); });
      els.buyAllBtn.addEventListener('click', e => { e.preventDefault(); buyAll(); });
      els.exploitBtn.addEventListener('click', e => { e.preventDefault(); buyExploit(); });
      document.getElementById('btn-start').addEventListener('click', () => {
        audio.init(); audio.playSFX('start'); audio.playBGM();
        els.startScreen.style.opacity = '0';
        setTimeout(() => {
          els.startScreen.classList.add('hidden'); els.hud.classList.add('active'); state.isRunning = true;
          state.lastTick = performance.now(); state.lastUiUpdate = performance.now(); updateSlowUI(true); requestAnimationFrame(loop);
        }, 560);
      });
      document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

      const canvas = document.getElementById('swampCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      let w = 0, h = 0;
      const motes = [];
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Mote {
        constructor() { this.reset(true); }
        reset(anywhere = false) { this.x = Math.random() * w; this.y = anywhere ? Math.random() * h : h + 10; this.r = 1 + Math.random() * 2.6; this.vx = -0.18 + Math.random() * 0.36; this.vy = -0.22 - Math.random() * 0.65; this.phase = Math.random() * Math.PI * 2; this.kind = Math.random() > 0.35 ? 'firefly' : 'coin'; }
        update() { this.x += this.vx + Math.sin(performance.now()/900 + this.phase) * 0.12; this.y += this.vy; if (this.y < -15 || this.x < -15 || this.x > w + 15) this.reset(false); }
        draw() {
          if (this.kind === 'coin') { ctx.fillStyle = 'rgba(255,212,92,0.55)'; ctx.fillRect(this.x, this.y, this.r * 2.2, this.r * 2.2); }
          else { const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 5); g.addColorStop(0, 'rgba(255,247,190,0.9)'); g.addColorStop(1, 'rgba(187,247,164,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 5, 0, Math.PI * 2); ctx.fill(); }
        }
      }
      for (let i = 0; i < 44; i++) motes.push(new Mote());
      function animateSwamp() { ctx.clearRect(0,0,w,h); for (const mote of motes) { mote.update(); mote.draw(); } requestAnimationFrame(animateSwamp); }
      animateSwamp();

      updateFastUI(); updateSlowUI(true);
      window.__SWAMP_TYCOON_STATE__ = state;
    });
  </script>
</body>
</html>
