<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Grid Reactor</title>
    <!-- Tailwind Script -->
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: true },
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'system-ui', 'sans-serif'],
                        display: ['Audiowide', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050816;
            --bg-mid: #0b1630;
            --panel: rgba(12, 22, 46, 0.76);
            --panel-strong: rgba(21, 34, 68, 0.9);
            --line: rgba(120, 219, 255, 0.28);
            --text-main: #e6f7ff;
            --text-dim: #93accf;
            --cyan: #65e7ff;
            --blue: #4ca7ff;
            --violet: #9f7bff;
            --mint: #5cf2b5;
            --gold: #ffd166;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(90, 160, 255, 0.18), transparent 34%),
                radial-gradient(circle at 50% 120%, rgba(159, 123, 255, 0.2), transparent 36%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 62%);
            color: var(--text-main);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(120, 231, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 231, 255, 0.045) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.24), rgba(0,0,0,0.9) 35%, rgba(0,0,0,0.2));
            opacity: 0.7;
        }

        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0; }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(23, 40, 74, 0.88), rgba(8, 16, 36, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 12px 32px rgba(0, 0, 0, 0.4),
                0 0 24px rgba(76, 167, 255, 0.14);
        }

        .hud-card {
            min-width: 112px;
        }

        .hud-label,
        .mini-label {
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .display-font {
            font-family: 'Audiowide', system-ui, sans-serif;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: min(28vw, 126px);
            border-radius: 1rem;
            border: 1px solid rgba(101, 231, 255, 0.3);
            background: rgba(4, 10, 22, 0.72);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            z-index: 12;
        }

        .feedback-gif.is-visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.top {
            top: 5.6rem;
        }

        .feedback-gif.bottom {
            bottom: 7.5rem;
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feedback-gif .gif-caption {
            padding: 0.35rem 0.55rem 0.5rem;
            font-size: 0.6rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(224, 247, 255, 0.82);
        }

        .btn-press {
            transition: transform 0.08s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .btn-press:active {
            transform: scale(0.96);
            filter: brightness(1.08);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 16px rgba(101, 231, 255, 0.32), 0 0 0 rgba(159, 123, 255, 0.12); }
            50% { box-shadow: 0 0 30px rgba(101, 231, 255, 0.55), 0 0 22px rgba(159, 123, 255, 0.22), 0 0 18px rgba(76, 167, 255, 0.2) inset; }
            100% { box-shadow: 0 0 16px rgba(101, 231, 255, 0.32), 0 0 0 rgba(159, 123, 255, 0.12); }
        }

        .neon-btn {
            animation: pulse-glow 2s infinite;
            position: relative;
            overflow: hidden;
        }

        .neon-btn::before {
            content: "";
            position: absolute;
            inset: 9px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.22), transparent 28%);
            pointer-events: none;
        }

        .neon-btn::after {
            content: "";
            position: absolute;
            width: 62%;
            height: 62%;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(101, 231, 255, 0.18), transparent 68%);
            filter: blur(12px);
            pointer-events: none;
        }

        .core-shell {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-shell::before,
        .core-shell::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            border: 2px solid rgba(101, 231, 255, 0.24);
        }

        .core-shell::before {
            width: 74%;
            height: 74%;
        }

        .core-shell::after {
            width: 52%;
            height: 52%;
            border-color: rgba(159, 123, 255, 0.28);
        }

        .reactor-ring {
            position: absolute;
            inset: 22%;
            border-radius: 999px;
            border: 2px solid rgba(101, 231, 255, 0.4);
            box-shadow: 0 0 18px rgba(101, 231, 255, 0.15);
        }

        .reactor-core {
            position: relative;
            width: 36%;
            height: 36%;
            border-radius: 999px;
            background: radial-gradient(circle, #d7fbff 0%, #65e7ff 35%, #246bff 70%, rgba(36, 107, 255, 0.2) 100%);
            box-shadow: 0 0 24px rgba(101, 231, 255, 0.55);
        }

        .reactor-core::after {
            content: "";
            position: absolute;
            inset: 22%;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0));
        }

        .core-spark {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(101, 231, 255, 0));
            box-shadow: 0 0 18px rgba(101, 231, 255, 0.45);
            animation: orbitSpark 3.2s linear infinite;
        }

        .core-spark.spark-a { top: 16%; left: 48%; animation-delay: -0.2s; }
        .core-spark.spark-b { top: 48%; right: 16%; animation-delay: -1.4s; }
        .core-spark.spark-c { bottom: 18%; left: 24%; animation-delay: -2.2s; }

        @keyframes orbitSpark {
            0%, 100% { transform: scale(0.72); opacity: 0.4; }
            50% { transform: scale(1.18); opacity: 0.95; }
        }

        .helper-copy {
            color: var(--text-dim);
            text-shadow: 0 0 12px rgba(101, 231, 255, 0.08);
        }

        .module-btn {
            background: linear-gradient(180deg, rgba(18, 32, 63, 0.86), rgba(8, 15, 32, 0.96));
            border-color: rgba(106, 170, 255, 0.22);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        }

        .module-btn:hover {
            box-shadow: 0 0 0 1px rgba(101, 231, 255, 0.12) inset, 0 12px 28px rgba(17, 29, 64, 0.5);
        }

        /* Floating Text Animation handled in Canvas, but UI needs z-index */
        #ui-layer {
            z-index: 10;
            position: relative;
            height: 100%;
            pointer-events: none;
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        .interactive { pointer-events: auto; }

        @media (max-width: 480px) {
            #ui-layer { padding: 0.9rem 0.9rem max(0.9rem, env(safe-area-inset-bottom)); }
            #hud { max-width: 100%; }
            .hud-card { min-width: 0; }
            .feedback-gif {
                width: 84px;
                right: 0.75rem;
            }
            .feedback-gif.top { top: 5rem; }
            .feedback-gif.bottom { bottom: 8rem; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
            <!-- UI Layer -->
            <div id="ui-layer" class="flex flex-col justify-between p-4">
                <!-- [agent-note][stage4] repaired: font-remap | action: catalog-backed title/body fonts swapped to Audiowide + Rajdhani -->
                <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect tap target and shop controls -->
                <div id="combo-gif" class="feedback-gif top" aria-hidden="true">
                    <img src="https://i.giphy.com/1zmG8avB83Uvm.webp" alt="Reactor combo surge effect">
                    <div class="gif-caption">Combo surge</div>
                </div>
                <div id="upgrade-gif" class="feedback-gif bottom" aria-hidden="true">
                    <img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Upgrade unlock reveal effect">
                    <div class="gif-caption">Module online</div>
                </div>
            
            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
            <div id="hud" class="hidden flex justify-between items-start w-full max-w-md mx-auto gap-3">
                <div class="glass-panel hud-card px-5 py-3 rounded-full flex flex-col items-center">
                    <span class="text-[10px] hud-label text-sky-200/60">Charge</span>
                    <span class="text-3xl font-bold text-emerald-300 display-font">$<span id="score-display">0</span></span>
                </div>
                <div class="glass-panel hud-card px-4 py-2 rounded-2xl flex flex-col items-end">
                    <div class="text-xs text-cyan-200"><span class="mini-label text-[10px] text-cyan-200/60 mr-1">Flow</span><span id="mps-display">0</span>/s</div>
                    <div class="text-xs text-violet-200"><span class="mini-label text-[10px] text-violet-200/60 mr-1">Pulse</span><span id="cpc-display">1</span></div>
                </div>
            </div>

            <!-- START SCREEN -->
            <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center interactive bg-slate-950/55 backdrop-blur-sm z-50">
                <div class="glass-panel p-8 rounded-[2rem] text-center max-w-sm mx-4 transform hover:scale-[1.02] transition duration-300 border border-cyan-300/30">
                    <div class="text-[11px] mini-label text-cyan-200/70 mb-3">Arc Reactor Sync</div>
                    <h1 class="text-5xl font-bold display-font text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-400 to-violet-400 mb-3">NEON GRID</h1>
                    <p class="helper-copy text-lg leading-tight mb-2">Prime the reactor core and turn every tap into neon charge.</p>
                    <p class="text-cyan-100/60 text-sm mb-7">Fast feedback, compact controls, and a cleaner sci-fi dashboard for mobile play.</p>
                    <button id="start-btn" class="w-full bg-gradient-to-r from-sky-500 to-violet-500 hover:from-sky-400 hover:to-violet-400 text-slate-950 font-bold py-4 px-8 rounded-2xl shadow-lg transition text-xl display-font tracking-wide">IGNITE CORE</button>
                </div>
            </div>

            <!-- GAME OVER SCREEN (Not really used in endless clicker, but good for structure) -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col justify-center items-center interactive bg-black/80 z-50">
                <h2 class="text-4xl font-bold text-white mb-4 display-font">Simulation Ended</h2>
                <button id="restart-btn" class="bg-white text-black font-bold py-3 px-8 rounded-full">Reset</button>
            </div>

            <!-- MAIN CLICK AREA (Centered) -->
            <div id="game-area" class="hidden flex-grow flex flex-col justify-center items-center interactive relative">
                <button id="click-btn" class="neon-btn w-48 h-48 rounded-full bg-gradient-to-br from-slate-800 via-slate-950 to-black border-4 border-cyan-400/70 flex items-center justify-center btn-press touch-manipulation">
                    <div class="core-shell pointer-events-none">
                        <div class="reactor-ring"></div>
                        <span class="core-spark spark-a"></span>
                        <span class="core-spark spark-b"></span>
                        <span class="core-spark spark-c"></span>
                        <div class="reactor-core"></div>
                    </div>
                </button>
                <div class="mt-4 helper-copy text-sm animate-pulse mini-label">Tap to channel reactor charge</div>
            </div>

            <!-- SHOP PANEL (Bottom) -->
            <div id="shop-panel" class="hidden w-full max-w-md mx-auto glass-panel rounded-t-3xl p-4 interactive transition-transform transform translate-y-0">
                <h3 class="text-lg font-bold text-white mb-3 border-b border-cyan-300/15 pb-2 flex justify-between">
                    <span class="display-font text-cyan-100">MODULES</span>
                    <span class="text-xs font-normal text-cyan-100/55 self-center mini-label">Stabilize output</span>
                </h3>
                
                <div class="space-y-3">
                    <!-- Upgrade 1: Click Power -->
                    <button id="buy-click-btn" class="module-btn w-full flex justify-between items-center p-3 rounded-2xl border transition btn-press group">
                        <div class="flex items-center gap-3">
                            <div class="bg-violet-500/10 p-2 rounded-xl text-violet-300 border border-violet-300/15">
                                <svg xmlns="assets/www.w3.org/2000/svg.html" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" /></svg>
                            </div>
                            <div class="text-left">
                                <div class="font-bold text-white group-hover:text-violet-200 transition">Pulse Amplifier</div>
                                <div class="text-xs text-slate-400">+1 charge per tap</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-amber-300">$<span id="cost-click">100</span></div>
                            <div class="text-xs text-slate-500">Lvl <span id="lvl-click">1</span></div>
                        </div>
                    </button>

                    <!-- Upgrade 2: Auto Miner -->
                    <button id="buy-auto-btn" class="module-btn w-full flex justify-between items-center p-3 rounded-2xl border transition btn-press group">
                        <div class="flex items-center gap-3">
                            <div class="bg-sky-500/10 p-2 rounded-xl text-sky-300 border border-sky-300/15">
                                <svg xmlns="assets/www.w3.org/2000/svg.html" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                            </div>
                            <div class="text-left">
                                <div class="font-bold text-white group-hover:text-sky-200 transition">Flow Drone</div>
                                <div class="text-xs text-slate-400">+5 charge per sec</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-amber-300">$<span id="cost-auto">250</span></div>
                            <div class="text-xs text-slate-500">Qty <span id="qty-auto">0</span></div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                tap: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                buy: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                pulse: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                this.cooldowns = {
                    tap: 65,
                    pulse: 180,
                    buy: 220,
                    fail: 220,
                    start: 350
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.bgm.pause();
                    } else if (this.enabled && active) {
                        this.bgm.play().catch(() => {});
                    }
                });
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM(reset = false) {
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.55) {
                if (!this.enabled || !this.sfx[key]) return;

                const now = performance.now();
                const cooldown = this.cooldowns[key] ?? 120;
                if (now - (this.lastPlayedAt[key] || 0) < cooldown) return;
                this.lastPlayedAt[key] = now;

                try {
                    const instance = this.sfx[key].cloneNode();
                    instance.volume = volume;
                    instance.play().catch(() => {});
                } catch (_) {}
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME STATE */
        let gameState = {
            money: 0,
            clickPower: 1,
            autoRate: 0, // Money per second
            lastTime: 0,
            shop: {
                clickUpgrade: { cost: 100, level: 1, multiplier: 1.5 },
                autoUpgrade: { cost: 250, count: 0, multiplier: 1.4 }
            }
        };

        let active = false;
        let particles = []; // Floating text
        let bgParticles = []; // Parallax stars
        let comboCount = 0;
        let comboTimer = null;
        let gifTimers = {};

        // DOM Elements
        const scoreEl = document.getElementById('score-display');
        const mpsEl = document.getElementById('mps-display');
        const cpcEl = document.getElementById('cpc-display');
        
        const costClickEl = document.getElementById('cost-click');
        const lvlClickEl = document.getElementById('lvl-click');
        
        const costAutoEl = document.getElementById('cost-auto');
        const qtyAutoEl = document.getElementById('qty-auto');
        const comboGifEl = document.getElementById('combo-gif');
        const upgradeGifEl = document.getElementById('upgrade-gif');

        /** 4. CANVAS & VISUALS */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initBackground();
        }
        window.addEventListener('resize', resize);

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 1.0;
                this.vy = -2 - Math.random() * 2; // Move up
                this.vx = (Math.random() - 0.5) * 2; // Slight drift
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = "bold 24px Audiowide";
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        class Star {
            constructor(layer) {
                this.layer = layer; // 1 = far, 2 = near
                this.reset();
                this.y = Math.random() * height; // Start anywhere
            }
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = this.layer === 1 ? Math.random() * 2 : Math.random() * 4 + 1;
                this.speed = this.layer === 1 ? 0.5 : 1.5;
                this.alpha = this.layer === 1 ? 0.3 : 0.6;
                this.color = this.layer === 1 ? '#4b5563' : '#3b82f6';
            }
            update() {
                this.y -= this.speed;
                if (this.y < -10) this.reset();
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                if (this.layer === 2) {
                    ctx.rect(this.x, this.y, this.size, this.size); // Square for near
                } else {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); // Circle for far
                }
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function initBackground() {
            bgParticles = [];
            for(let i=0; i<50; i++) bgParticles.push(new Star(1));
            for(let i=0; i<20; i++) bgParticles.push(new Star(2));
        }

        /** 5. GAME LOGIC */
        function updateUI() {
            // Use floor for display to keep it clean, but keep float internally
            scoreEl.innerText = Math.floor(gameState.money).toLocaleString();
            mpsEl.innerText = gameState.autoRate;
            cpcEl.innerText = gameState.clickPower;

            costClickEl.innerText = Math.floor(gameState.shop.clickUpgrade.cost).toLocaleString();
            lvlClickEl.innerText = gameState.shop.clickUpgrade.level;

            costAutoEl.innerText = Math.floor(gameState.shop.autoUpgrade.cost).toLocaleString();
            qtyAutoEl.innerText = gameState.shop.autoUpgrade.count;

            // Visual feedback on buttons (Gray out if can't afford)
            const btnClick = document.getElementById('buy-click-btn');
            const btnAuto = document.getElementById('buy-auto-btn');

            if (gameState.money < gameState.shop.clickUpgrade.cost) {
                btnClick.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnClick.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            if (gameState.money < gameState.shop.autoUpgrade.cost) {
                btnAuto.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnAuto.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function spawnText(x, y, text, color = "#ffffff") {
            particles.push(new FloatingText(x, y, text, color));
        }

        function showGif(element, duration = 1200) {
            if (!element) return;
            element.classList.add('is-visible');
            clearTimeout(gifTimers[element.id]);
            gifTimers[element.id] = setTimeout(() => {
                element.classList.remove('is-visible');
            }, duration);
        }

        function registerCombo() {
            comboCount += 1;
            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                comboCount = 0;
            }, 850);

            if (comboCount >= 6) {
                showGif(comboGifEl, 900);
                audio.playSFX('pulse', 0.4);
                comboCount = 0;
            }
        }

        function gameLoop(timestamp) {
            if (!active) return;

            // Delta time calculation
            if (!gameState.lastTime) gameState.lastTime = timestamp;
            const deltaTime = (timestamp - gameState.lastTime) / 1000; // in seconds
            gameState.lastTime = timestamp;

            // Clear Canvas
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Background Parallax
            bgParticles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            // 2. Auto Income
            if (gameState.autoRate > 0) {
                gameState.money += gameState.autoRate * deltaTime;
                updateUI();
            }

            // 3. Draw Floating Text
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        /** 6. CONTROLS */
        
        // Main Click Interaction
        const clickBtn = document.getElementById('click-btn');
        clickBtn.addEventListener('pointerdown', (e) => {
            // Prevent default zooming
            e.preventDefault();
            
            // Logic
            gameState.money += gameState.clickPower;
            audio.playSFX('tap', 0.28);
            registerCombo();

            // Visuals
            // Get button center for consistent text spawn or click pos
            const rect = clickBtn.getBoundingClientRect();
            const spawnX = e.clientX || (rect.left + rect.width/2);
            const spawnY = e.clientY || (rect.top + rect.height/2);
            
            spawnText(spawnX, spawnY, `+$${gameState.clickPower}`, "#4ade80"); // Green text
            updateUI();
        });

        // Shop: Buy Click Upgrade
        document.getElementById('buy-click-btn').addEventListener('click', () => {
            const item = gameState.shop.clickUpgrade;
            if (gameState.money >= item.cost) {
                gameState.money -= item.cost;
                gameState.clickPower += 1; // Requirement: Improvements increase power
                item.level++;
                item.cost = Math.floor(item.cost * item.multiplier);
                audio.playSFX('buy', 0.48);
                showGif(upgradeGifEl, 1400);
                spawnText(width/2, height/2 + 100, "AMPLIFIED!", "#a855f7");
                updateUI();
            } else {
                audio.playSFX('fail', 0.42);
            }
        });

        // Shop: Buy Auto Upgrade
        document.getElementById('buy-auto-btn').addEventListener('click', () => {
            const item = gameState.shop.autoUpgrade;
            if (gameState.money >= item.cost) {
                gameState.money -= item.cost;
                gameState.autoRate += 5;
                item.count++;
                item.cost = Math.floor(item.cost * item.multiplier);
                audio.playSFX('buy', 0.48);
                showGif(upgradeGifEl, 1400);
                spawnText(width/2, height/2 + 100, "FLOW DRONE!", "#3b82f6");
                updateUI();
            } else {
                audio.playSFX('fail', 0.42);
            }
        });

        // Start Game
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.5);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('game-area').classList.add('flex'); // Restore flex
            document.getElementById('shop-panel').classList.remove('hidden');
            
            active = true;
            resize(); // Ensure canvas is sized correctly
            requestAnimationFrame(gameLoop);
        });

        window.addEventListener('pagehide', () => {
            audio.stopBGM();
        });

        // Initial Resize
        resize();
    });
    </script>
</body>
</html>
