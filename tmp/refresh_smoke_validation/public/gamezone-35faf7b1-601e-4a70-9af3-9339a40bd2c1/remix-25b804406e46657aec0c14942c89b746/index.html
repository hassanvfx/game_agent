<script>
/**
 * MEME REACTOR - CORE ENGINE
 */

// --- 1. CONFIGURATION & STATE ---
window.gameConfigDefs = {
    brushSize: { type: "number", label: "Brush Size", value: 3, min: 1, max: 10 },
    simSpeed: { type: "number", label: "Sim Speed", value: 1, min: 1, max: 3 },
    gravity: { type: "number", label: "Gravity Strength", value: 1, min: 0.5, "max": 2 }
};

window.gameConfig = {
    brushSize: 3,
    simSpeed: 1,
    gravity: 1
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

// --- 2. AUDIO SYSTEM ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.noiseNode = null;
        this.noiseGain = null;
        this.isInit = false;
        this.lastPlayedAt = {};
        this.masterVolume = 0.8;
    }

    init() {
        if (this.isInit) {
            if (this.ctx?.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        try {
            this.ctx = new AudioContext();
            this.isInit = true;
            this.setupNoiseGenerator();
        } catch (e) {
            console.warn('Audio init unavailable', e);
        }
    }

    setupNoiseGenerator() {
        if (!this.ctx) return;

        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        this.noiseNode = this.ctx.createBufferSource();
        this.noiseNode.buffer = buffer;
        this.noiseNode.loop = true;
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;

        this.noiseGain = this.ctx.createGain();
        this.noiseGain.gain.value = 0;

        this.noiseNode.connect(filter);
        filter.connect(this.noiseGain);
        this.noiseGain.connect(this.ctx.destination);
        this.noiseNode.start(0);
    }

    ensureReady() {
        if (!this.isInit) {
            this.init();
        } else if (this.ctx?.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    }

    setPainting(isPainting) {
        if (!this.ctx || this.ctx.state !== 'running' || !this.noiseGain) return;
        const target = isPainting ? 0.1 : 0;
        this.noiseGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.12);
    }

    playBgm() {
        this.ensureReady();
        
        const el = document.getElementById('bgm_main');
        if (el) {
            el.volume = 0.24 * this.masterVolume;
            if (el.paused) {
                el.play().catch(() => {});
            }
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el && !el.paused) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id, options = {}) {
        const el = document.getElementById(id);
        if (!el) {
            this.ensureReady();
            if (this.ctx) this.synthesize('beep');
            return;
        }

        const now = performance.now();
        const throttle = options.throttle ?? 0;
        if (throttle && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < throttle) return;
        this.lastPlayedAt[id] = now;

        el.volume = (options.volume ?? 0.6) * this.masterVolume;
        if (options.restart !== false) {
            el.currentTime = 0;
        }
        el.play().catch(() => {});
    }

    synthesize(type) {
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'beep') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
    }
}

const audioManager = new AudioManager();

class FeedbackManager {
    constructor() {
        this.reactions = {
            chaos: document.getElementById('reaction-chaos'),
            reset: document.getElementById('reaction-reset')
        };
        this.statusRoot = document.getElementById('status-pills');
        this.timers = new Map();
    }

    showReaction(type, duration = 1200) {
        const card = this.reactions[type];
        if (!card) return;

        card.classList.add('active');
        clearTimeout(this.timers.get(card));
        this.timers.set(card, setTimeout(() => {
            card.classList.remove('active');
        }, duration));
    }

    pushStatus(label, message, duration = 1300) {
        if (!this.statusRoot) return;

        const pill = document.createElement('div');
        pill.className = 'status-pill';

        const strong = document.createElement('strong');
        strong.textContent = label;

        const span = document.createElement('span');
        span.textContent = message;

        pill.appendChild(strong);
        pill.appendChild(document.createTextNode(' '));
        pill.appendChild(span);
        this.statusRoot.appendChild(pill);

        requestAnimationFrame(() => pill.classList.add('active'));

        setTimeout(() => {
            pill.classList.remove('active');
            setTimeout(() => pill.remove(), 220);
        }, duration);
    }
}

const feedbackManager = new FeedbackManager();

// --- 3. GAME ENGINE (Cellular Automata) ---
const ELEMENTS = {
    EMPTY: 0,
    SAND: 1,
    WATER: 2,
    STONE: 3,
    FIRE: 4,
    PLANT: 5,
    ACID: 6,
    STEAM: 7
};

const PALETTE = {
    [ELEMENTS.EMPTY]: [17, 17, 17],
    [ELEMENTS.SAND]: [244, 208, 63],
    [ELEMENTS.WATER]: [52, 152, 219],
    [ELEMENTS.STONE]: [127, 140, 141],
    [ELEMENTS.FIRE]: [231, 76, 60],
    [ELEMENTS.PLANT]: [46, 204, 113],
    [ELEMENTS.ACID]: [180, 255, 50],
    [ELEMENTS.STEAM]: [200, 200, 220]
};

const TOOLS = [
    { id: ELEMENTS.SAND, name: "HYPE", color: "#F4D03F", mood: "boost" },
    { id: ELEMENTS.WATER, name: "TEA", color: "#3498DB", mood: "cool" },
    { id: ELEMENTS.STONE, name: "BLOCK", color: "#7F8C8D", mood: "lock" },
    { id: ELEMENTS.PLANT, name: "CLOUT", color: "#2ECC71", mood: "grow" },
    { id: ELEMENTS.FIRE, name: "DRAMA", color: "#E74C3C", mood: "spike" },
    { id: ELEMENTS.ACID, name: "SALT", color: "#B4FF32", mood: "melt" },
    { id: ELEMENTS.EMPTY, name: "WIPE", color: "#333333", mood: "reset" }
];

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        
        this.width = 100;
        this.height = 0;
        this.grid = null;
        this.nextGrid = null;
        this.imageData = null;
        
        this.isPlaying = false;
        this.selectedTool = ELEMENTS.SAND;
        this.isPointerDown = false;
        this.pointerX = 0;
        this.pointerY = 0;
        this.frameCount = 0;
        this.placementCount = 0;
        this.lastPaintSoundAt = 0;
        this.lastChaosPulseAt = 0;

        this.bindEvents();
        this.initUI();
    }

    resize() {
        const aspect = window.innerHeight / window.innerWidth;
        this.height = Math.floor(this.width * aspect);
        
        this.canvas.style.width = '100%';
        this.canvas.style.height = '100%';
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        const size = this.width * this.height;
        this.grid = new Uint8Array(size).fill(ELEMENTS.EMPTY);
        this.imageData = this.ctx.createImageData(this.width, this.height);
        
        for(let i = 3; i < this.imageData.data.length; i += 4) {
            this.imageData.data[i] = 255;
        }
    }

    initUI() {
        const toolbar = document.getElementById('toolbar');
        TOOLS.forEach((tool, index) => {
            const btn = document.createElement('button');
            btn.className = `tool-btn w-12 h-12 rounded-xl flex items-center justify-center text-xs font-bold text-white shadow-md ${index === 0 ? 'active' : ''}`;
            btn.style.backgroundColor = tool.color;
            btn.innerText = tool.name.charAt(0);
            btn.title = tool.name;
            btn.onclick = () => {
                this.selectedTool = tool.id;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                audioManager.playSfx('sfx_tool', { volume: 0.45, throttle: 90 });
                feedbackManager.pushStatus(tool.name, `tool primed`, 900);
            };
            toolbar.appendChild(btn);
        });

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audioManager.init();
            audioManager.playSfx('sfx_start', { volume: 0.62 });
            audioManager.playBgm();
            feedbackManager.pushStatus('Live', 'chaos feed online', 1500);
            feedbackManager.showReaction('chaos', 1100);
            this.isPlaying = true;
            this.loop();
        };

        document.getElementById('clear-btn').onclick = () => {
            this.grid.fill(ELEMENTS.EMPTY);
            audioManager.playSfx('sfx_clear', { volume: 0.55, throttle: 120 });
            feedbackManager.pushStatus('Reset', 'feed wiped clean', 1200);
            feedbackManager.showReaction('reset', 1400);
        };
    }

    bindEvents() {
        const getPos = (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * this.width;
            const y = (e.clientY - rect.top) / rect.height * this.height;
            return { x, y };
        };

        const start = (e) => {
            if (!this.isPlaying) return;
            audioManager.ensureReady();
            audioManager.playBgm();
            this.isPointerDown = true;
            const p = getPos(e);
            this.pointerX = p.x;
            this.pointerY = p.y;
            audioManager.setPainting(true);
            audioManager.playSfx('sfx_drop', { volume: 0.3, throttle: 120 });
        };

        const move = (e) => {
            if (!this.isPointerDown) return;
            const p = getPos(e);
            this.pointerX = p.x;
            this.pointerY = p.y;
        };

        const end = () => {
            this.isPointerDown = false;
            audioManager.setPainting(false);
        };

        this.canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); start(e); }, { passive: false });
        window.addEventListener('pointermove', (e) => { e.preventDefault(); move(e); }, { passive: false });
        window.addEventListener('pointerup', end);
        window.addEventListener('pointercancel', end);
        window.addEventListener('resize', () => this.resize());
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audioManager.setPainting(false);
                audioManager.stopBgm();
            } else if (this.isPlaying) {
                audioManager.playBgm();
            }
        });
    }

    getIdx(x, y) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height) return -1;
        return y * this.width + x;
    }

    paint() {
        if (!this.isPointerDown) return;
        
        const r = window.gameConfig.brushSize;
        const rSq = r * r;
        
        const cx = Math.floor(this.pointerX);
        const cy = Math.floor(this.pointerY);
        let placementsThisFrame = 0;

        for (let y = cy - r; y <= cy + r; y++) {
            for (let x = cx - r; x <= cx + r; x++) {
                if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= rSq) {
                    const idx = this.getIdx(x, y);
                    if (idx !== -1) {
                        if (this.selectedTool !== ELEMENTS.EMPTY && this.grid[idx] === ELEMENTS.STONE && this.selectedTool !== ELEMENTS.ACID) continue;
                        if (Math.random() < 0.8) {
                            this.grid[idx] = this.selectedTool;
                            placementsThisFrame++;
                        }
                    }
                }
            }
        }

        if (placementsThisFrame > 0) {
            this.placementCount += placementsThisFrame;
            const now = performance.now();
            if (now - this.lastPaintSoundAt > 160) {
                audioManager.playSfx('sfx_drop', { volume: 0.2, throttle: 100 });
                this.lastPaintSoundAt = now;
            }
            if (this.placementCount >= 140 && now - this.lastChaosPulseAt > 1400) {
                feedbackManager.showReaction('chaos', 1200);
                feedbackManager.pushStatus('Combo', 'feed going feral', 1200);
                audioManager.playSfx('sfx_ui', { volume: 0.36, throttle: 180 });
                this.placementCount = 0;
                this.lastChaosPulseAt = now;
            }
        }
    }

    update() {
        const w = this.width;
        const h = this.height;
        const grid = this.grid;

        for (let y = h - 1; y >= 0; y--) {
            for (let i = 0; i < w; i++) {
                const x = Math.random() > 0.5 ? i : w - 1 - i;
                const idx = y * w + x;
                const type = grid[idx];

                if (type === ELEMENTS.EMPTY || type === ELEMENTS.STONE) continue;

                if (type === ELEMENTS.SAND) {
                    const below = idx + w;
                    const belowL = idx + w - 1;
                    const belowR = idx + w + 1;
                    
                    if (y < h - 1 && grid[below] === ELEMENTS.EMPTY) {
                        grid[below] = ELEMENTS.SAND;
                        grid[idx] = ELEMENTS.EMPTY;
                    } 
                    else if (y < h - 1 && grid[below] === ELEMENTS.WATER) {
                        grid[below] = ELEMENTS.SAND;
                        grid[idx] = ELEMENTS.WATER;
                    }
                    else if (y < h - 1 && x > 0 && grid[belowL] === ELEMENTS.EMPTY) {
                        grid[belowL] = ELEMENTS.SAND;
                        grid[idx] = ELEMENTS.EMPTY;
                    }
                    else if (y < h - 1 && x < w - 1 && grid[belowR] === ELEMENTS.EMPTY) {
                        grid[belowR] = ELEMENTS.SAND;
                        grid[idx] = ELEMENTS.EMPTY;
                    }
                }

                else if (type === ELEMENTS.WATER || type === ELEMENTS.ACID) {
                    const below = idx + w;
                    
                    if (type === ELEMENTS.ACID && y < h - 1) {
                         const target = grid[below];
                         if (target !== ELEMENTS.EMPTY && target !== ELEMENTS.ACID && target !== ELEMENTS.STONE) {
                             if (Math.random() < 0.1) {
                                 grid[below] = ELEMENTS.EMPTY;
                                 grid[idx] = ELEMENTS.EMPTY;
                                 continue;
                             }
                         }
                    }

                    if (y < h - 1 && grid[below] === ELEMENTS.EMPTY) {
                        grid[below] = type;
                        grid[idx] = ELEMENTS.EMPTY;
                    }
                    else {
                        const dir = Math.random() > 0.5 ? 1 : -1;
                        const n1 = idx + dir;
                        const n2 = idx - dir;
                        
                        if (x + dir >= 0 && x + dir < w && grid[n1] === ELEMENTS.EMPTY) {
                            grid[n1] = type;
                            grid[idx] = ELEMENTS.EMPTY;
                        } else if (x - dir >= 0 && x - dir < w && grid[n2] === ELEMENTS.EMPTY) {
                            grid[n2] = type;
                            grid[idx] = ELEMENTS.EMPTY;
                        }
                    }
                    
                    if (type === ELEMENTS.WATER) {
                        const neighbors = [idx - 1, idx + 1, idx - w, idx + w];
                        for (let n of neighbors) {
                            if (n >= 0 && n < grid.length && grid[n] === ELEMENTS.PLANT) {
                                if (Math.random() < 0.05) {
                                    grid[idx] = ELEMENTS.PLANT;
                                }
                            }
                        }
                    }
                }

                else if (type === ELEMENTS.FIRE) {
                    if (Math.random() < 0.1) {
                        grid[idx] = ELEMENTS.EMPTY;
                        continue;
                    }
                    
                    const above = idx - w;
                    if (y > 0 && grid[above] === ELEMENTS.EMPTY) {
                         grid[above] = ELEMENTS.FIRE;
                         grid[idx] = ELEMENTS.EMPTY;
                    }
                    
                    const neighbors = [idx - 1, idx + 1, idx - w, idx + w];
                    for (let n of neighbors) {
                        if (n >= 0 && n < grid.length) {
                            if (grid[n] === ELEMENTS.PLANT) {
                                grid[n] = ELEMENTS.FIRE;
                            } else if (grid[n] === ELEMENTS.WATER) {
                                grid[idx] = ELEMENTS.STEAM;
                                grid[n] = ELEMENTS.STEAM;
                            }
                        }
                    }
                }
                
                else if (type === ELEMENTS.STEAM) {
                    if (Math.random() < 0.05) {
                        grid[idx] = ELEMENTS.EMPTY;
                        continue;
                    }
                    const above = idx - w;
                    if (y > 0 && grid[above] === ELEMENTS.EMPTY) {
                        grid[above] = ELEMENTS.STEAM;
                        grid[idx] = ELEMENTS.EMPTY;
                    } else if (y > 0) {
                        const dir = Math.random() > 0.5 ? 1 : -1;
                        if (x + dir >= 0 && x + dir < w && grid[idx - w + dir] === ELEMENTS.EMPTY) {
                            grid[idx - w + dir] = ELEMENTS.STEAM;
                            grid[idx] = ELEMENTS.EMPTY;
                        }
                    }
                }
            }
        }
    }

    draw() {
        const data = this.imageData.data;
        const grid = this.grid;
        
        for (let i = 0; i < grid.length; i++) {
            const type = grid[i];
            const color = PALETTE[type];
            const idx = i * 4;
            
            let r = color[0];
            let g = color[1];
            let b = color[2];
            
            if (type !== ELEMENTS.EMPTY && type !== ELEMENTS.STONE) {
                const noise = (Math.random() - 0.5) * 20;
                r += noise; g += noise; b += noise;
            }

            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
        }
        
        this.ctx.putImageData(this.imageData, 0, 0);
    }

    loop() {
        if (!this.isPlaying) return;
        
        try {
            this.paint();
            
            const speed = Math.floor(window.gameConfig.simSpeed);
            for(let i = 0; i < speed; i++) {
                this.update();
            }
            
            this.draw();
            this.frameCount++;
            requestAnimationFrame(() => this.loop());
        } catch (e) {
            console.error("Game Loop Error:", e);
            this.isPlaying = false;
        }
    }
}

// --- 4. INITIALIZATION ---
document.addEventListener('DOMContentLoaded', () => {
    const game = new Game();
    game.resize();
    
    const cx = Math.floor(game.width / 2);
    const cy = Math.floor(game.height / 2);
    game.grid[game.getIdx(cx, cy)] = ELEMENTS.SAND;
});

</script>
</body>
</html>
