<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Garden Watch</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #1d3557;
            --sky-bottom: #6ab7d6;
            --meadow: #8bcf6a;
            --meadow-dark: #519444;
            --soil: #7c4b2a;
            --soil-deep: #543018;
            --burrow-rim: #b47246;
            --burrow-shadow: rgba(48, 24, 12, 0.45);
            --critter-main: #ff9f68;
            --critter-accent: #ffd166;
            --critter-cheek: #ff6f91;
            --leaf: #5bbf6a;
            --leaf-dark: #3c8e49;
            --panel-bg: rgba(255, 249, 235, 0.9);
            --panel-line: rgba(98, 61, 28, 0.18);
            --text-main: #3e2a1c;
            --text-strong: #5d2e1c;
            --danger: #d1495b;
            --shadow-soft: 0 10px 28px rgba(43, 28, 16, 0.18);
            --shadow-strong: 0 16px 40px rgba(43, 28, 16, 0.26);
            --glow: rgba(255, 209, 102, 0.45);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.45), transparent 38%),
                linear-gradient(180deg, var(--sky-top) 0%, #41729f 24%, var(--sky-bottom) 54%, #d9f2b4 54%, var(--meadow) 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            color: var(--text-main);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 12% 18%, rgba(255,255,255,0.25) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 16%, rgba(255,255,255,0.18) 0 3px, transparent 4px),
                radial-gradient(circle at 28% 28%, rgba(255,255,255,0.2) 0 2px, transparent 3px),
                radial-gradient(circle at 68% 24%, rgba(255,255,255,0.16) 0 2px, transparent 3px);
            opacity: 0.8;
        }

        body::after {
            background:
                radial-gradient(circle at 8% 92%, rgba(91,191,106,0.65) 0 48px, transparent 49px),
                radial-gradient(circle at 94% 88%, rgba(91,191,106,0.55) 0 56px, transparent 57px),
                radial-gradient(circle at 80% 102%, rgba(60,142,73,0.45) 0 88px, transparent 89px),
                radial-gradient(circle at -8% 102%, rgba(60,142,73,0.4) 0 92px, transparent 93px);
            opacity: 0.9;
        }

        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; outline: none; position: relative; z-index: 1; }

        .absolute { position: absolute; }
        .relative { position: relative; }
        .hidden { display: none; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .p-6 { padding: 1.5rem; }
        .-mt-1 { margin-top: -0.25rem; }

        .floating-leaves {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .floating-leaves span {
            position: absolute;
            width: 18px;
            height: 12px;
            border-radius: 18px 2px 18px 2px;
            background: linear-gradient(135deg, rgba(120, 216, 110, 0.7), rgba(60, 142, 73, 0.95));
            box-shadow: 0 0 10px rgba(255,255,255,0.15);
            opacity: 0.45;
            animation: leafDrift linear infinite;
        }

        .floating-leaves span:nth-child(1) { left: 10%; top: 18%; animation-duration: 12s; }
        .floating-leaves span:nth-child(2) { left: 24%; top: 8%; animation-duration: 15s; animation-delay: -4s; transform: scale(0.85) rotate(32deg); }
        .floating-leaves span:nth-child(3) { left: 82%; top: 12%; animation-duration: 14s; animation-delay: -7s; transform: scale(1.05) rotate(-20deg); }
        .floating-leaves span:nth-child(4) { left: 76%; top: 30%; animation-duration: 16s; animation-delay: -9s; transform: scale(0.75) rotate(18deg); }
        .floating-leaves span:nth-child(5) { left: 48%; top: 16%; animation-duration: 13s; animation-delay: -2s; transform: scale(0.95) rotate(-34deg); }
        .floating-leaves span:nth-child(6) { left: 62%; top: 4%; animation-duration: 18s; animation-delay: -12s; transform: scale(0.7) rotate(50deg); }

        @keyframes leafDrift {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); }
            50% { transform: translate3d(10px, 18px, 0) rotate(24deg); }
            100% { transform: translate3d(-8px, 40px, 0) rotate(-8deg); }
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .garden-panel {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.93), rgba(255,246,224,0.88)),
                radial-gradient(circle at top left, rgba(255,255,255,0.55), transparent 38%);
            border: 2px solid var(--panel-line);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .garden-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .hud-icon {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: linear-gradient(180deg, #fff6ce, #ffd166);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.65), 0 4px 10px rgba(93, 46, 28, 0.15);
            flex-shrink: 0;
        }

        .danger-badge .hud-icon {
            background: linear-gradient(180deg, #ffd2ca, #ff8c7e);
        }

        .label-stack {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }

        .hud-label {
            font-size: 11px;
            line-height: 1;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 700;
            color: rgba(78, 51, 28, 0.7);
        }

        .hud-value {
            font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(20px, 4vw, 28px);
            line-height: 1;
            letter-spacing: 0.04em;
            color: var(--text-strong);
            text-shadow: 0 2px 0 rgba(255,255,255,0.6);
        }

        .danger-badge .hud-value {
            color: var(--danger);
        }

        .briefing-card {
            position: relative;
            overflow: hidden;
        }

        .briefing-card::after {
            content: "🐾";
            position: absolute;
            right: 14px;
            bottom: 10px;
            font-size: 20px;
            opacity: 0.28;
        }

        .briefing-text {
            font-size: clamp(12px, 2.9vw, 16px);
            line-height: 1.3;
            font-weight: 700;
            color: #5a402b;
            max-width: 30ch;
            padding-right: 24px;
        }

        .game-over-backdrop {
            background: linear-gradient(180deg, rgba(17, 27, 36, 0.18), rgba(17, 27, 36, 0.3));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .game-over-card {
            width: min(86vw, 360px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 28px 24px 22px;
            overflow: hidden;
        }

        .game-over-content {
            overflow-y: auto;
        }

        .game-over-kicker {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(78, 51, 28, 0.72);
            text-align: center;
        }

        .game-over-title {
            font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(32px, 9vw, 52px);
            line-height: 0.95;
            letter-spacing: 0.05em;
            color: #5d2e1c;
            text-align: center;
            margin: 0;
            text-shadow: 0 3px 0 rgba(255,255,255,0.6);
        }

        .score-line {
            font-size: clamp(15px, 4.2vw, 22px);
            color: #65452d;
            font-weight: 700;
            margin: 0;
            text-align: center;
        }

        .score-line span {
            color: #d96c3f;
        }

        .restart-btn {
            position: sticky;
            bottom: 0;
            width: 100%;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffd166, #ff9f68);
            color: #5d2e1c;
            padding: 14px 18px;
            font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(18px, 5vw, 24px);
            letter-spacing: 0.08em;
            box-shadow: 0 10px 22px rgba(217, 108, 63, 0.24), inset 0 2px 0 rgba(255,255,255,0.58);
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        .restart-btn:active {
            transform: scale(0.97);
            filter: brightness(1.02);
            box-shadow: 0 5px 12px rgba(217, 108, 63, 0.18), inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            bottom: 14px;
            width: clamp(72px, 18vw, 108px);
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.55);
            box-shadow: var(--shadow-soft);
            background: rgba(255, 255, 255, 0.18);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail-gif {
            left: 12px;
            right: auto;
            bottom: 112px;
        }

        .mascot-stamp {
            width: 78px;
            height: 78px;
            margin: 0 auto 4px;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle at 35% 30%, #fff1cf 0 18%, #ffd166 19%, #ffb35d 48%, #ff8f63 75%, #d96c3f 100%);
            box-shadow: 0 10px 24px rgba(93, 46, 28, 0.22), inset 0 3px 8px rgba(255,255,255,0.52);
        }

        .mascot-stamp::before,
        .mascot-stamp::after {
            content: "";
            position: absolute;
            top: 10px;
            width: 24px;
            height: 24px;
            background: linear-gradient(180deg, #ffb35d, #ff8f63);
            border-radius: 80% 20% 70% 30%;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.38);
        }

        .mascot-stamp::before { left: 10px; transform: rotate(-32deg); }
        .mascot-stamp::after { right: 10px; transform: rotate(32deg) scaleX(-1); }

        .mascot-face {
            position: absolute;
            inset: 0;
        }

        .mascot-face::before,
        .mascot-face::after {
            content: "";
            position: absolute;
            top: 34px;
            width: 8px;
            height: 12px;
            background: #4d2f22;
            border-radius: 999px;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.16);
        }

        .mascot-face::before { left: 25px; }
        .mascot-face::after { right: 25px; }

        .mascot-nose {
            position: absolute;
            left: 50%;
            top: 44px;
            width: 16px;
            height: 12px;
            transform: translateX(-50%);
            border-radius: 50% 50% 65% 65%;
            background: #5d2e1c;
        }

        .mascot-nose::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 9px;
            width: 18px;
            height: 10px;
            transform: translateX(-50%);
            border-bottom: 3px solid #5d2e1c;
            border-radius: 0 0 18px 18px;
        }

        @media (max-width: 640px) {
            #hud {
                padding: max(12px, env(safe-area-inset-top)) 12px 0;
                gap: 10px;
            }

            .garden-panel {
                border-radius: 20px;
            }

            .hud-box {
                padding: 10px 12px;
            }

            .briefing-wrap {
                padding: 0 12px;
                margin-top: 8px;
            }

            .briefing-card {
                padding: 10px 12px;
                max-width: 320px;
            }

            .game-over-card {
                width: min(90vw, 340px);
                padding: 24px 18px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-leaves span,
            .restart-btn {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="floating-leaves" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <!-- [agent-note][stage3] resolved-gif: success/fail feedback overlays -> catalogs/gifs.json -->
    <img id="celebration-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Celebration reaction" aria-hidden="true">
    <img id="fail-gif" class="feedback-gif fail-gif" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Miss reaction" aria-hidden="true">
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col">
        <!-- HUD -->
        <div id="hud" class="w-full p-6 flex justify-between items-start">
            <div class="garden-panel hud-box px-4 py-3 pointer-events-auto">
                <div class="garden-badge">
                    <span class="hud-icon" aria-hidden="true">🔎</span>
                    <span class="label-stack">
                        <span class="hud-label">Critters spotted</span>
                        <span class="hud-value">#<span id="score-val">0</span></span>
                    </span>
                </div>
            </div>
            <div class="garden-panel hud-box px-4 py-3 pointer-events-auto danger-badge">
                <div class="garden-badge">
                    <span class="hud-icon" aria-hidden="true">⚠️</span>
                    <span class="label-stack">
                        <span class="hud-label">Escapes left</span>
                        <span class="hud-value"><span id="lives-val">3</span></span>
                    </span>
                </div>
            </div>
        </div>

        <div class="w-full px-6 -mt-1 briefing-wrap">
            <div class="garden-panel briefing-card px-4 py-3 max-w-md pointer-events-none">
                <p class="briefing-text">Critter watch is on. Tap each curious peeker before it vanishes back into the burrow.</p>
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center pointer-events-auto game-over-backdrop">
            <div class="garden-panel game-over-card">
                <div class="game-over-content">
                    <div class="mascot-stamp" aria-hidden="true">
                        <div class="mascot-face"></div>
                        <div class="mascot-nose"></div>
                    </div>
                    <p class="game-over-kicker">Garden Watch Report</p>
                    <h1 class="game-over-title">Patrol Over</h1>
                    <p class="score-line">Critters spotted: <span id="final-score">0</span></p>
                </div>
                <button id="restart-btn" class="restart-btn">Patrol Again</button>
            </div>
        </div>
    </div>
</div>

<!-- Media Assets -->
<!-- [agent-note][stage3] resolved-audio: loop/sfx -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_thud" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3" preload="auto"></audio>
<audio id="sfx_miss" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "baseSpeed": { "type": "number", "label": "Game Speed", "value": 1.0, "min": 0.5, "max": 3.0 },
    "moundColor": { "type": "color", "label": "Game Speed", "value": "#9C623D" },
    "hiderColor": { "type": "color", "label": "Hider Color", "value": "#FF9F68" },
    "bgColor": { "type": "color", "label": "Background Color", "value": "#A8D9F0" }
}
</script>

<script>
/**
 * L0 System Invariants & L1 Structural Protocols Implementation
 */

// --- Configuration System ---
let gameConfig = {};
try {
    const configScript = document.getElementById('game-config').textContent;
    const defs = JSON.parse(configScript);
    window.gameConfigDefs = defs;
    for (const key in defs) gameConfig[key] = defs[key].value;
} catch (e) {
    gameConfig = { baseSpeed: 1.0, moundColor: '#9C623D', hiderColor: '#FF9F68', bgColor: '#A8D9F0' };
}
window.updateGameConfig = (key, val) => { if (key in gameConfig) gameConfig[key] = val; };

// --- Audio System ---
const AudioManager = (() => {
    let ctx = null;
    let unlocked = false;
    const audioEls = {};

    const init = async () => {
        try {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            ctx = new AudioContext();
        } catch (e) { console.warn("Audio init failed", e); }

        ["bgm_main", "sfx_collect", "sfx_thud", "sfx_miss", "sfx_gameover", "sfx_restart"].forEach((id) => {
            const el = document.getElementById(id);
            if (el) {
                audioEls[id] = el;
                if (id === "bgm_main") {
                    el.volume = 0.2;
                } else if (id === "sfx_gameover") {
                    el.volume = 0.45;
                } else {
                    el.volume = 0.5;
                }
            }
        });
    };

    const unlock = () => {
        if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
        if (!unlocked) {
            const bgm = audioEls.bgm_main || document.getElementById("bgm_main");
            if (bgm) {
                bgm.muted = false;
                bgm.play().catch(() => {});
            }
            unlocked = true;
        }
    };

    const synthSfx = (type) => {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === "pop") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(460, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.12);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === "thud") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(170, now);
            osc.frequency.exponentialRampToValueAtTime(70, now + 0.16);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
            osc.start(now);
            osc.stop(now + 0.16);
        } else if (type === "miss") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.24);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.24);
            osc.start(now);
            osc.stop(now + 0.24);
        }
    };

    const play = (id, fallbackType) => {
        const el = audioEls[id] || document.getElementById(id);
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.play().catch(() => {});
                return;
            } catch (e) {}
        }
        if (fallbackType) synthSfx(fallbackType);
    };

    const playLoop = (id) => {
        const el = audioEls[id] || document.getElementById(id);
        if (!el) return;
        el.play().catch(() => {});
    };

    const stopLoop = (id) => {
        const el = audioEls[id] || document.getElementById(id);
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    };

    return { init, unlock, play, playLoop, stopLoop };
})();

// --- Vibration System ---
const vibrate = (style = 'light') => {
    try {
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
            });
        } else if (navigator.vibrate) {
            const pattern = style === 'heavy' ? [30] : style === 'medium' ? [15] : [5];
            navigator.vibrate(pattern);
        }
    } catch (e) {}
};

// --- Game State & Canvas Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER
let lastTime = 0;

// Game Entities
let mounds = [];
let particles = [];
let score = 0;
let lives = 3;
let spawnTimer = 0;
let spawnInterval = 1.5;
let difficultyMultiplier = 1.0;
let activeGifTimer = null;

const showFeedbackGif = (id, duration = 950) => {
    const gif = document.getElementById(id);
    if (!gif) return;
    document.getElementById('celebration-gif')?.classList.remove('is-visible');
    document.getElementById('fail-gif')?.classList.remove('is-visible');
    gif.classList.add('is-visible');
    if (activeGifTimer) clearTimeout(activeGifTimer);
    activeGifTimer = setTimeout(() => {
        gif.classList.remove('is-visible');
    }, duration);
};

const hideFeedbackGifs = () => {
    document.getElementById('celebration-gif')?.classList.remove('is-visible');
    document.getElementById('fail-gif')?.classList.remove('is-visible');
    if (activeGifTimer) {
        clearTimeout(activeGifTimer);
        activeGifTimer = null;
    }
};

const setState = (state) => {
    gameState = state;
    document.getElementById('game-over-screen').classList.toggle('hidden', state !== 'GAMEOVER');
    if (state === 'GAMEOVER') {
        document.getElementById('final-score').innerText = score;
        AudioManager.stopLoop('bgm_main');
        AudioManager.play('sfx_gameover', 'miss');
        showFeedbackGif('fail-gif', 1600);
        vibrate('heavy');
    } else if (state === 'PLAYING') {
        hideFeedbackGifs();
        AudioManager.playLoop('bgm_main');
    }
};

const updateHUD = () => {
    document.getElementById('score-val').innerText = score;
    document.getElementById('lives-val').innerText = lives;
};

// --- Core Gameplay Logic ---

class Mound {
    constructor(x, y, r) {
        this.x = x;
        this.y = y;
        this.r = r;
        this.squish = 1.0;
        this.hider = null;
    }
    
    update(dt) {
        // Recover squish
        if (this.squish < 1.0) {
            this.squish += dt * 5;
            if (this.squish > 1.0) this.squish = 1.0;
        }
        if (this.hider) {
            this.hider.update(dt);
            if (this.hider.state === 'DONE') {
                this.hider = null;
            }
        }
    }

    draw(ctx) {
        const r = Math.max(0, this.r);
        
        // Draw Hider (behind mound)
        if (this.hider) {
            this.hider.draw(ctx, this.x, this.y, r);
        }

        // Draw Mound (Burrow Style)
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(1, this.squish * 0.62);

        ctx.shadowColor = 'rgba(36, 22, 12, 0.28)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 10;

        const outerGradient = ctx.createRadialGradient(-r * 0.22, -r * 0.3, r * 0.18, 0, 0, r * 1.18);
        outerGradient.addColorStop(0, '#d59a68');
        outerGradient.addColorStop(0.52, gameConfig.moundColor);
        outerGradient.addColorStop(1, '#6f4324');
        ctx.fillStyle = outerGradient;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = 'transparent';

        ctx.fillStyle = 'rgba(255, 233, 195, 0.36)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.22, -r * 0.2, r * 0.55, r * 0.34, -0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(77, 44, 23, 0.16)';
        ctx.beginPath();
        ctx.ellipse(r * 0.14, r * 0.1, r * 0.52, r * 0.28, 0.18, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = Math.max(2, r * 0.05);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.84, Math.PI * 1.06, Math.PI * 1.88);
        ctx.stroke();

        ctx.restore();
    }

    hit() {
        this.squish = 0.7;
        AudioManager.play('sfx_thud', 'thud');
        vibrate('light');
    }
}

class Hider {
    constructor() {
        this.state = 'RISING'; // RISING, PEEKING, FALLING, DONE
        this.yOffset = 0;
        this.maxOffset = -1.2; // Relative to mound radius
        this.timer = 0;
        this.peekTime = 1.0 / difficultyMultiplier;
        this.speed = 4.0 * difficultyMultiplier * gameConfig.baseSpeed;
    }

    update(dt) {
        if (this.state === 'RISING') {
            this.yOffset -= this.speed * dt;
            if (this.yOffset <= this.maxOffset) {
                this.yOffset = this.maxOffset;
                this.state = 'PEEKING';
                this.timer = this.peekTime;
            }
        } else if (this.state === 'PEEKING') {
            this.timer -= dt;
            if (this.timer <= 0) {
                this.state = 'FALLING';
            }
        } else if (this.state === 'FALLING') {
            this.yOffset += this.speed * dt;
            if (this.yOffset >= 0) {
                this.yOffset = 0;
                this.state = 'DONE';
                // A critter slipped away.
                lives--;
                updateHUD();
                AudioManager.play('sfx_miss', 'miss');
                showFeedbackGif('fail-gif', lives <= 0 ? 1500 : 900);
                vibrate('heavy');
                if (lives <= 0) setState('GAMEOVER');
            }
        }
    }

    draw(ctx, mx, my, mr) {
        ctx.save();
        const hiderY = my + (this.yOffset * mr);
        const hr = mr * 0.6;
        
        // Clip to not show below mound center
        ctx.beginPath();
        ctx.rect(mx - mr, my - mr * 2, mr * 2, mr * 2);
        ctx.clip();

        ctx.translate(mx, hiderY);

        const bodyGradient = ctx.createRadialGradient(-hr * 0.18, -hr * 0.22, hr * 0.14, 0, 0, hr * 1.18);
        bodyGradient.addColorStop(0, '#ffd7a8');
        bodyGradient.addColorStop(0.45, gameConfig.hiderColor);
        bodyGradient.addColorStop(1, '#d96c3f');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(0, 0, hr, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffcf86';
        ctx.beginPath();
        ctx.ellipse(-hr * 0.42, -hr * 0.72, hr * 0.2, hr * 0.34, -0.35, 0, Math.PI * 2);
        ctx.ellipse(hr * 0.42, -hr * 0.72, hr * 0.2, hr * 0.34, 0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath();
        ctx.ellipse(-hr * 0.22, -hr * 0.3, hr * 0.42, hr * 0.28, -0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#4d2f22';
        ctx.beginPath();
        ctx.arc(-hr * 0.26, -hr * 0.08, hr * 0.13, 0, Math.PI * 2);
        ctx.arc(hr * 0.26, -hr * 0.08, hr * 0.13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-hr * 0.22, -hr * 0.12, hr * 0.045, 0, Math.PI * 2);
        ctx.arc(hr * 0.3, -hr * 0.12, hr * 0.045, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#5d2e1c';
        ctx.beginPath();
        ctx.arc(0, hr * 0.14, hr * 0.11, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#5d2e1c';
        ctx.lineWidth = Math.max(2, hr * 0.06);
        ctx.beginPath();
        ctx.arc(0, hr * 0.17, hr * 0.24, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 111, 145, 0.78)';
        ctx.beginPath();
        ctx.arc(-hr * 0.4, hr * 0.12, hr * 0.1, 0, Math.PI * 2);
        ctx.arc(hr * 0.4, hr * 0.12, hr * 0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 209, 102, 0.5)';
        ctx.beginPath();
        ctx.arc(0, -hr * 0.92, hr * 0.12, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 400;
        this.vy = (Math.random() - 0.5) * 400;
        this.life = 1.0;
        this.color = color;
        this.r = Math.random() * 8 + 4;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 800 * dt; // gravity
        this.life -= dt * 2;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        ctx.globalAlpha = this.life;
        const sparkle = ctx.createRadialGradient(this.x - this.r * 0.2, this.y - this.r * 0.2, this.r * 0.2, this.x, this.y, this.r);
        sparkle.addColorStop(0, 'rgba(255,245,214,0.95)');
        sparkle.addColorStop(0.45, this.color);
        sparkle.addColorStop(1, 'rgba(255, 170, 92, 0.15)');
        ctx.fillStyle = sparkle;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0, this.r), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

const spawnParticles = (x, y, color) => {
    for(let i = 0; i < 8; i++) {
        particles.push(new Particle(x, y, color));
    }
};

const initGame = () => {
    score = 0;
    lives = 3;
    difficultyMultiplier = 1.0;
    spawnTimer = 0;
    mounds = [];
    particles = [];
    updateHUD();

    // Generate grid of mounds
    const cols = 3;
    const rows = 4;
    const paddingX = cw / (cols + 1);
    const paddingY = ch / (rows + 1);
    const radius = Math.min(cw, ch) * 0.12;

    for (let r = 1; r <= rows; r++) {
        for (let c = 1; c <= cols; c++) {
            // Stagger rows slightly
            const offsetX = (r % 2 === 0) ? paddingX * 0.2 : -paddingX * 0.2;
            mounds.push(new Mound(c * paddingX + offsetX, r * paddingY, radius));
        }
    }
    
    // Sort by Y for depth drawing
    mounds.sort((a, b) => a.y - b.y);
};

const restartGame = () => {
    AudioManager.play('sfx_restart', 'pop');
    initGame();
    setState('PLAYING');
};

// --- Main Loop ---
const gameLoop = (timestamp) => {
    requestAnimationFrame(gameLoop);
    if (!initialized) return;

    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.05) dt = 0.05; // dt cap
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            // Spawn logic
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                const emptyMounds = mounds.filter(m => !m.hider);
                if (emptyMounds.length > 0) {
                    const m = emptyMounds[Math.floor(Math.random() * emptyMounds.length)];
                    m.hider = new Hider();
                }
                spawnInterval = Math.max(0.5, 1.5 - (score * 0.02));
                difficultyMultiplier = 1.0 + (score * 0.05);
                spawnTimer = spawnInterval;
            }

            mounds.forEach(m => m.update(dt));
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        // Draw
        const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
        skyGradient.addColorStop(0, '#1d3557');
        skyGradient.addColorStop(0.24, '#4f83b5');
        skyGradient.addColorStop(0.54, gameConfig.bgColor);
        skyGradient.addColorStop(0.5401, '#9dd57f');
        skyGradient.addColorStop(1, '#68b357');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, cw, ch);

        const sunGlow = ctx.createRadialGradient(cw * 0.78, ch * 0.18, 10, cw * 0.78, ch * 0.18, Math.max(cw, ch) * 0.24);
        sunGlow.addColorStop(0, 'rgba(255, 251, 220, 0.85)');
        sunGlow.addColorStop(0.38, 'rgba(255, 233, 170, 0.3)');
        sunGlow.addColorStop(1, 'rgba(255, 233, 170, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, cw, ch);

        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        for (let i = 0; i < 5; i++) {
            const cx = ((Math.sin(i * 1.77) * 0.5) + 0.5) * cw;
            const cy = ch * (0.12 + i * 0.06);
            ctx.beginPath();
            ctx.ellipse(cx, cy, cw * 0.08, ch * 0.024, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        const grassHeight = ch * 0.18;
        const grassGradient = ctx.createLinearGradient(0, ch - grassHeight, 0, ch);
        grassGradient.addColorStop(0, 'rgba(143, 209, 105, 0.25)');
        grassGradient.addColorStop(1, 'rgba(60, 142, 73, 0.32)');
        ctx.fillStyle = grassGradient;
        ctx.fillRect(0, ch - grassHeight, cw, grassHeight);

        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 18; i++) {
            const gx = (i / 17) * cw;
            const baseY = ch;
            ctx.beginPath();
            ctx.moveTo(gx, baseY);
            ctx.quadraticCurveTo(gx + ((i % 2 === 0) ? -7 : 7), ch - 24 - (i % 4) * 5, gx + ((i % 3) - 1) * 4, ch - 54 - (i % 5) * 6);
            ctx.stroke();
        }

        mounds.forEach(m => m.draw(ctx));
        particles.forEach(p => p.draw(ctx));

    } catch (e) {
        console.error("Loop error", e);
    }
};

// --- Input Handling ---
const handleGameInput = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (!isFinite(x) || !isFinite(y)) return;

    // Raycast: Check hiders first (they are "above" the mound visually)
    let hitSomething = false;
    
    // Iterate backwards to hit front-most first
    for (let i = mounds.length - 1; i >= 0; i--) {
        const m = mounds[i];
        if (m.hider && m.hider.state !== 'DONE') {
            const hiderY = m.y + (m.hider.yOffset * m.r);
            const dx = x - m.x;
            const dy = y - hiderY;
            const hr = m.r * 0.6;
            
            // If tapped hider and it's exposed enough
            if (dx * dx + dy * dy <= hr * hr && m.hider.yOffset < -0.2) {
                // Successful sighting.
                score++;
                updateHUD();
                spawnParticles(m.x, hiderY, gameConfig.hiderColor);
                AudioManager.play('sfx_collect', 'pop');
                showFeedbackGif('celebration-gif', 820);
                vibrate('medium');
                m.hider = null; // Remove hider
                hitSomething = true;
                
                // Add a little juice to the mound too
                m.squish = 0.8;
                break;
            }
        }
    }

    // If didn't hit hider, check mounds
    if (!hitSomething) {
        for (let i = mounds.length - 1; i >= 0; i--) {
            const m = mounds[i];
            const dx = x - m.x;
            // Mound is scaled Y by 0.6 visually, adjust hit detection
            const dy = (y - m.y) / 0.6; 
            if (dx * dx + dy * dy <= m.r * m.r) {
                m.hit();
                break;
            }
        }
    }
};

const handleGlobalInput = (e) => {
    e.preventDefault();
    AudioManager.unlock();
    
    if (gameState === 'GAMEOVER') {
        // Handled by button click, but prevent canvas taps from doing anything.
        return; 
    }
    if (gameState === 'PLAYING') {
        handleGameInput(e);
    }
};

// --- Initialization & Resize ---
const resize = (width, height) => {
    const dpr = window.devicePixelRatio || 1;
    cw = width;
    ch = height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!initialized) {
        initGame();
        setState('PLAYING');
        const bgm = document.getElementById('bgm_main');
        if (bgm) bgm.play().catch(() => {});
        initialized = true;
        requestAnimationFrame(gameLoop);
    } else {
        // Clamp/reposition entities if needed on resize
        // For this game, restarting on major orientation change is safer, but we'll just let them be.
    }
};

document.addEventListener('DOMContentLoaded', () => {
    AudioManager.init();
    
    const ro = new ResizeObserver(entries => {
        for (let entry of entries) {
            if (entry.target === canvas) {
                resize(entry.contentRect.width, entry.contentRect.height);
            }
        }
    });
    ro.observe(canvas);

    /* [agent-note][stage4] repaired: mobile-actionability | element: canvas-only pointer handler | reason: avoid canceling button taps outside gameplay surface */
    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    
    const restartBtn = document.getElementById('restart-btn');
    if (restartBtn) {
        restartBtn.addEventListener('click', (e) => {
            e.preventDefault();
            AudioManager.unlock();
            restartGame();
        });
    }
});

</script>
