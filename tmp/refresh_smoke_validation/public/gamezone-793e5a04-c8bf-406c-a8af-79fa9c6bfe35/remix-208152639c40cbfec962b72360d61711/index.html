<style>
:root{--bog-night:#172719;--bog:#365b25;--bog-bright:#86b63e;--mud:#6b4026;--mud-dark:#372015;--ogre:#86b63e;--ogre-deep:#4f7d28;--poster:#f8e1a2;--poster-red:#b53828;--ink:#251711;--panel:rgba(255,232,163,.91);--panel-line:rgba(71,42,19,.32);--gold:#ffc447;--danger:#c53a2e;--shadow:0 14px 34px rgba(15,22,11,.34)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#172719;color:var(--ink);font-family:'Cinzel',Georgia,serif;user-select:none;-webkit-user-select:none;touch-action:none}button{font:inherit}#game-container{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(245,232,154,.24),transparent 26%),linear-gradient(180deg,#18291d 0%,#28431d 46%,#3f6324 100%)}canvas{display:block;width:100%;height:100%;position:relative;z-index:1;touch-action:none;outline:none}#game-container:before,#game-container:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}#game-container:before{background:radial-gradient(circle at 12% 82%,rgba(122,189,52,.46) 0 52px,transparent 54px),radial-gradient(circle at 90% 86%,rgba(78,124,38,.42) 0 64px,transparent 66px),radial-gradient(circle at 50% 103%,rgba(34,61,22,.62) 0 130px,transparent 132px);opacity:.85}#game-container:after{background:repeating-linear-gradient(90deg,transparent 0 44px,rgba(183,214,89,.06) 45px 46px),radial-gradient(circle at 20% 12%,rgba(255,244,184,.08) 0 2px,transparent 4px),radial-gradient(circle at 72% 18%,rgba(255,244,184,.08) 0 3px,transparent 5px);animation:fogPulse 5s ease-in-out infinite alternate}@keyframes fogPulse{from{opacity:.45;transform:translateX(-8px)}to{opacity:.75;transform:translateX(8px)}}#ui-layer{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;pointer-events:none}.hud{display:flex;justify-content:space-between;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px 0}.bog-panel{background:linear-gradient(180deg,rgba(255,239,185,.96),rgba(231,199,108,.9));border:2px solid var(--panel-line);border-radius:20px;box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.45);pointer-events:auto}.hud-box{padding:9px 10px;min-width:0}.badge{display:flex;align-items:center;gap:8px}.hud-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff7c9,#b7d653 57%,#5d8f2e);box-shadow:inset 0 2px 5px rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.2);font-size:18px}.danger .hud-icon{background:radial-gradient(circle at 35% 28%,#ffe4bf,#d94c38 64%,#792217)}.stack{display:flex;flex-direction:column;line-height:1}.label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:rgba(48,31,18,.72);white-space:nowrap}.value{font-family:'Bangers',cursive;font-size:clamp(22px,5.2vw,31px);letter-spacing:.04em;color:#3d5f20;text-shadow:0 2px 0 rgba(255,255,255,.52)}.danger .value{color:var(--danger)}.briefing{padding:8px 12px 0}.briefing .bog-panel{width:min(92vw,430px);padding:10px 12px;position:relative;overflow:hidden}.briefing .bog-panel:after{content:"ONION\A LAYER";white-space:pre;position:absolute;right:10px;bottom:6px;font-family:'Bangers';font-size:13px;line-height:.9;opacity:.22;transform:rotate(-10deg)}.briefing p{margin:0;max-width:31ch;font-size:clamp(12px,3vw,16px);font-weight:700;line-height:1.28;color:#322315}.hint{font-family:'Bangers';color:#6b8f24;letter-spacing:.03em}.feedback{position:absolute;right:12px;bottom:12px;z-index:4;width:clamp(72px,19vw,108px);border-radius:18px;border:2px solid rgba(255,238,164,.7);box-shadow:var(--shadow);opacity:0;transform:translateY(10px) scale(.9);transition:opacity .18s,transform .18s;pointer-events:none}.feedback.is-visible{opacity:.92;transform:translateY(0) scale(1)}.feedback.fail{left:12px;right:auto;bottom:112px}.toast{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.9);z-index:6;pointer-events:none;background:rgba(35,22,12,.86);color:#ffe8a3;border:2px solid rgba(255,196,71,.6);border-radius:999px;padding:8px 14px;font-family:'Bangers';font-size:clamp(18px,6vw,28px);letter-spacing:.05em;opacity:0;transition:opacity .15s,transform .15s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#game-over-screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:auto;background:linear-gradient(180deg,rgba(11,17,9,.35),rgba(11,17,9,.62));backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:7}#game-over-screen.show{display:flex}.over-card{width:min(90vw,365px);max-height:90vh;padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;text-align:center}.ogre-stamp{width:84px;height:78px;margin:0 auto 2px;position:relative;border-radius:48% 48% 44% 44%;background:radial-gradient(circle at 32% 24%,#c5e66a 0 18%,var(--ogre) 19% 58%,var(--ogre-deep) 100%);box-shadow:inset 0 4px 8px rgba(255,255,255,.28),0 10px 24px rgba(0,0,0,.25)}.ogre-stamp:before,.ogre-stamp:after{content:"";position:absolute;top:18px;width:24px;height:14px;border-radius:999px;background:#7eaa3d;border:4px solid #4f7d28}.ogre-stamp:before{left:-13px;transform:rotate(-15deg)}.ogre-stamp:after{right:-13px;transform:rotate(15deg)}.face:before,.face:after{content:"";position:absolute;top:34px;width:8px;height:12px;border-radius:50%;background:#1b120c}.face:before{left:28px}.face:after{right:28px}.nose{position:absolute;left:50%;top:46px;transform:translateX(-50%);width:22px;height:12px;border-radius:50%;background:#5d7b27}.nose:before,.nose:after{content:"";position:absolute;top:4px;width:4px;height:4px;border-radius:50%;background:#1b120c}.nose:before{left:5px}.nose:after{right:5px}.over-kicker{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(56,34,16,.72)}.over-title{margin:0;font-family:'Bangers';font-size:clamp(36px,10vw,56px);line-height:.9;letter-spacing:.05em;color:#4c741f;text-shadow:0 3px 0 rgba(255,255,255,.5)}.score-line{margin:0;font-weight:700;font-size:clamp(15px,4.2vw,22px)}.score-line span{font-family:'Bangers';font-size:1.25em;color:#b53828}.restart-btn{border:0;border-radius:999px;background:linear-gradient(180deg,#ffe66c,#91bc38 56%,#4e7a27);color:#24170d;padding:14px 18px;font-family:'Bangers';font-size:clamp(19px,5vw,25px);letter-spacing:.08em;box-shadow:0 10px 22px rgba(20,35,12,.32),inset 0 2px 0 rgba(255,255,255,.55)}.restart-btn:active{transform:scale(.97);filter:brightness(1.05)}@media(min-aspect-ratio:9/16){.briefing .bog-panel{width:min(72vw,440px)}}@media(max-width:360px){.label{font-size:9px}.hud-icon{width:30px;height:30px}.hud-box{padding:8px}}@media(prefers-reduced-motion:reduce){#game-container:after{animation:none}.feedback,.toast{transition:none}}

<body>
<div id="game-container"><canvas id="gameCanvas" aria-label="Tap fairy-tale notices when they pop from swamp holes"></canvas><img id="celebration-gif" class="feedback" src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp" alt="goofy success reaction" aria-hidden="true"><img id="fail-gif" class="feedback fail" src="https://i.giphy.com/12GxI1Eqg7S6f6.webp" alt="goofy failure reaction" aria-hidden="true"><div id="toast" class="toast">MUD SPLAT!</div><div id="ui-layer"><div class="hud"><div class="bog-panel hud-box"><div class="badge"><span class="hud-icon">🧅</span><span class="stack"><span class="label">Notices trashed</span><span class="value">#<span id="score-val">0</span></span></span></div></div><div class="bog-panel hud-box danger"><div class="badge"><span class="hud-icon">👑</span><span class="stack"><span class="label">Royal warnings</span><span class="value"><span id="lives-val">3</span></span></span></div></div></div><div class="briefing"><div class="bog-panel"><p><span class="hint">Tap the royal peepers</span> before they duck back and fine the swamp for improper fairy-tale behavior.</p></div></div></div><div id="game-over-screen"><div class="bog-panel over-card"><div class="ogre-stamp" aria-hidden="true"><div class="face"></div><div class="nose"></div></div><p class="over-kicker">Swamp Eviction Ledger</p><h1 class="over-title">Too Many Decrees!</h1><p class="score-line">Royal notices trashed: <span id="final-score">0</span></p><button id="restart-btn" class="restart-btn">Burp & Try Again</button></div></div></div>
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" preload="auto" loop></audio><audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio><audio id="sfx_thud" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_enemy_01.mp3" preload="auto"></audio><audio id="sfx_miss" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_defeat_01.mp3" preload="auto"></audio><audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_defeat_02.mp3" preload="auto"></audio><audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_npc_01.mp3" preload="auto"></audio>
<script id="game-config" type="application/x-game-config">{"baseSpeed":{"type":"number","label":"Game Speed","value":1.0,"min":0.5,"max":3.0},"moundColor":{"type":"color","label":"Mud Hole Color","value":"#6b4026"},"hiderColor":{"type":"color","label":"Royal Notice Color","value":"#f8e1a2"},"bgColor":{"type":"color","label":"Swamp Glow","value":"#335321"}}</script>
<script>
let gameConfig={};try{const defs=JSON.parse(document.getElementById('game-config').textContent);window.gameConfigDefs=defs;for(const k in defs)gameConfig[k]=defs[k].value}catch(e){gameConfig={baseSpeed:1,moundColor:'#6b4026',hiderColor:'#f8e1a2',bgColor:'#335321'}}window.updateGameConfig=(k,v)=>{if(k in gameConfig)gameConfig[k]=v};
const AudioManager=(()=>{let ctx=null,unlocked=false;const els={};const ids=['bgm_main','sfx_collect','sfx_thud','sfx_miss','sfx_gameover','sfx_restart'];const init=()=>{try{window.AudioContext=window.AudioContext||window.webkitAudioContext;ctx=new AudioContext()}catch(e){}ids.forEach(id=>{const el=document.getElementById(id);if(el){els[id]=el;el.volume=id==='bgm_main'?.18:id==='sfx_gameover'?.44:.48}})};const unlock=()=>{if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});if(!unlocked){els.bgm_main?.play().catch(()=>{});unlocked=true}};const synth=t=>{if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;o.connect(g);g.connect(ctx.destination);if(t==='pop'){o.type='sine';o.frequency.setValueAtTime(420,n);o.frequency.exponentialRampToValueAtTime(860,n+.13);g.gain.setValueAtTime(.16,n);g.gain.exponentialRampToValueAtTime(.01,n+.13);o.start(n);o.stop(n+.13)}else if(t==='thud'){o.type='triangle';o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(55,n+.17);g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.01,n+.17);o.start(n);o.stop(n+.17)}else{o.type='sawtooth';o.frequency.setValueAtTime(210,n);o.frequency.linearRampToValueAtTime(95,n+.25);g.gain.setValueAtTime(.1,n);g.gain.linearRampToValueAtTime(.01,n+.25);o.start(n);o.stop(n+.25)}};const play=(id,f)=>{const el=els[id]||document.getElementById(id);if(el){try{el.pause();el.currentTime=0;el.play().catch(()=>{});return}catch(e){}}if(f)synth(f)};const playLoop=id=>(els[id]||document.getElementById(id))?.play().catch(()=>{});const stopLoop=id=>{const el=els[id]||document.getElementById(id);if(el){el.pause();el.currentTime=0}};return{init,unlock,play,playLoop,stopLoop}})();
const vibrate=s=>{try{if(navigator.vibrate)navigator.vibrate(s==='heavy'?[30]:s==='medium'?[15]:[5])}catch(e){}};
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let cw=0,ch=0,initialized=false,gameState='PLAYING',lastTime=0,mounds=[],particles=[],score=0,lives=3,spawnTimer=0,spawnInterval=1.5,difficultyMultiplier=1,activeGifTimer=null,toastTimer=null;
const showFeedbackGif=(id,d=950)=>{document.getElementById('celebration-gif')?.classList.remove('is-visible');document.getElementById('fail-gif')?.classList.remove('is-visible');const gif=document.getElementById(id);if(!gif)return;gif.classList.add('is-visible');clearTimeout(activeGifTimer);activeGifTimer=setTimeout(()=>gif.classList.remove('is-visible'),d)};
const showToast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),520)};
const hideFeedback=()=>{document.querySelectorAll('.feedback').forEach(g=>g.classList.remove('is-visible'));clearTimeout(activeGifTimer)};
const setState=s=>{gameState=s;document.getElementById('game-over-screen').classList.toggle('show',s==='GAMEOVER');if(s==='GAMEOVER'){document.getElementById('final-score').innerText=score;AudioManager.stopLoop('bgm_main');AudioManager.play('sfx_gameover','miss');showFeedbackGif('fail-gif',1600);vibrate('heavy')}else{hideFeedback();AudioManager.playLoop('bgm_main')}};
const updateHUD=()=>{document.getElementById('score-val').innerText=score;document.getElementById('lives-val').innerText=lives};
class Mound{constructor(x,y,r){this.x=x;this.y=y;this.r=r;this.squish=1;this.hider=null}update(dt){if(this.squish<1){this.squish+=dt*5;if(this.squish>1)this.squish=1}if(this.hider){this.hider.update(dt);if(this.hider.state==='DONE')this.hider=null}}draw(c){const r=this.r;if(this.hider)this.hider.draw(c,this.x,this.y,r);c.save();c.translate(this.x,this.y);c.scale(1,this.squish*.62);c.shadowColor='rgba(18,10,5,.42)';c.shadowBlur=22;c.shadowOffsetY=10;let g=c.createRadialGradient(-r*.25,-r*.32,r*.15,0,0,r*1.2);g.addColorStop(0,'#a87342');g.addColorStop(.52,gameConfig.moundColor);g.addColorStop(1,'#2f1b10');c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();c.shadowColor='transparent';c.fillStyle='rgba(165,219,69,.38)';c.beginPath();c.ellipse(-r*.24,-r*.26,r*.55,r*.28,-.35,0,Math.PI*2);c.fill();c.fillStyle='rgba(27,16,8,.32)';c.beginPath();c.ellipse(r*.12,r*.1,r*.52,r*.28,.15,0,Math.PI*2);c.fill();c.strokeStyle='rgba(255,244,184,.17)';c.lineWidth=Math.max(2,r*.05);c.beginPath();c.arc(0,0,r*.84,Math.PI*1.06,Math.PI*1.88);c.stroke();c.restore()}hit(){this.squish=.7;AudioManager.play('sfx_thud','thud');showToast('MUD SPLAT!');vibrate('light')}}
class Hider{constructor(){this.state='RISING';this.yOffset=0;this.maxOffset=-1.2;this.timer=0;this.peekTime=1/difficultyMultiplier;this.speed=4*difficultyMultiplier*gameConfig.baseSpeed;this.wiggle=Math.random()*Math.PI*2}update(dt){this.wiggle+=dt*7;if(this.state==='RISING'){this.yOffset-=this.speed*dt;if(this.yOffset<=this.maxOffset){this.yOffset=this.maxOffset;this.state='PEEKING';this.timer=this.peekTime}}else if(this.state==='PEEKING'){this.timer-=dt;if(this.timer<=0)this.state='FALLING'}else if(this.state==='FALLING'){this.yOffset+=this.speed*dt;if(this.yOffset>=0){this.yOffset=0;this.state='DONE';lives--;updateHUD();AudioManager.play('sfx_miss','miss');showFeedbackGif('fail-gif',lives<=0?1500:900);showToast('ROYAL FINE!');vibrate('heavy');if(lives<=0)setState('GAMEOVER')}}}draw(c,mx,my,mr){c.save();const y=my+this.yOffset*mr,hr=mr*.6;c.beginPath();c.rect(mx-mr,my-mr*2,mr*2,mr*2);c.clip();c.translate(mx,y);c.rotate(Math.sin(this.wiggle)*.05);c.fillStyle='#f8e1a2';c.strokeStyle='#7b3324';c.lineWidth=Math.max(2,hr*.07);c.shadowColor='rgba(0,0,0,.22)';c.shadowBlur=8;c.beginPath();c.roundRect(-hr*.62,-hr*.78,hr*1.24,hr*1.34,hr*.1);c.fill();c.stroke();c.shadowColor='transparent';c.fillStyle='#b53828';c.beginPath();c.moveTo(-hr*.46,-hr*.64);c.lineTo(0,-hr*.88);c.lineTo(hr*.46,-hr*.64);c.lineTo(hr*.32,-hr*.45);c.lineTo(-hr*.32,-hr*.45);c.closePath();c.fill();c.fillStyle='#2b1a10';c.font=`${Math.max(10,hr*.34)}px Bangers`;c.textAlign='center';c.textBaseline='middle';c.fillText('EVICT',0,-hr*.12);c.fillStyle='#86b63e';c.beginPath();c.arc(-hr*.23,hr*.31,hr*.08,0,Math.PI*2);c.arc(hr*.23,hr*.31,hr*.08,0,Math.PI*2);c.fill();c.strokeStyle='#2b1a10';c.lineWidth=Math.max(1,hr*.04);c.beginPath();c.arc(0,hr*.18,hr*.22,.2,Math.PI-.2);c.stroke();c.restore()}}
class Particle{constructor(x,y,color){this.x=x;this.y=y;this.vx=(Math.random()-.5)*400;this.vy=(Math.random()-.68)*390;this.life=1;this.color=color;this.r=Math.random()*8+4;this.kind=Math.random()<.45?'onion':'mud'}update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=800*dt;this.life-=dt*2}draw(c){if(this.life<=0)return;c.save();c.globalAlpha=this.life;c.translate(this.x,this.y);if(this.kind==='onion'){c.fillStyle=this.color;c.beginPath();c.ellipse(0,0,this.r*.9,this.r*1.2,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(255,255,255,.4)';c.stroke()}else{c.fillStyle='#5b311d';c.beginPath();c.arc(0,0,this.r,0,Math.PI*2);c.fill()}c.restore()}}
const spawnParticles=(x,y,color)=>{for(let i=0;i<8;i++)particles.push(new Particle(x,y,color))};
function initGame(){score=0;lives=3;difficultyMultiplier=1;spawnTimer=0;mounds=[];particles=[];updateHUD();const cols=3,rows=4,padX=cw/(cols+1),padY=ch/(rows+1),radius=Math.min(cw,ch)*.12;for(let r=1;r<=rows;r++){for(let c=1;c<=cols;c++){const off=(r%2===0)?padX*.2:-padX*.2;mounds.push(new Mound(c*padX+off,r*padY,radius))}}mounds.sort((a,b)=>a.y-b.y)}
function restartGame(){AudioManager.play('sfx_restart','pop');initGame();setState('PLAYING')}
function drawBackground(t){let g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#142018');g.addColorStop(.38,'#243d1d');g.addColorStop(.72,gameConfig.bgColor);g.addColorStop(1,'#192916');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.fillStyle='rgba(255,227,128,.1)';ctx.beginPath();ctx.arc(cw*.22,ch*.16,Math.min(cw,ch)*.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(25,20,25,.38)';const cx=cw*.78,base=ch*.34;ctx.fillRect(cx-cw*.08,base-cw*.1,cw*.16,cw*.1);ctx.beginPath();ctx.moveTo(cx-cw*.1,base-cw*.1);ctx.lineTo(cx,base-cw*.22);ctx.lineTo(cx+cw*.1,base-cw*.1);ctx.closePath();ctx.fill();for(let i=0;i<3;i++){ctx.fillRect(cx-cw*.1+i*cw*.08,base-cw*.17,cw*.035,cw*.07)}ctx.fillStyle='rgba(165,219,69,.1)';for(let i=0;i<9;i++){const x=(i/8)*cw+Math.sin(t*.001+i)*8;ctx.beginPath();ctx.ellipse(x,ch*(.75+.04*Math.sin(i)),cw*.12,ch*.025,0,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='rgba(203,225,105,.16)';ctx.lineWidth=3;for(let i=0;i<22;i++){const x=i/21*cw;ctx.beginPath();ctx.moveTo(x,ch);ctx.quadraticCurveTo(x+((i%2)?8:-8),ch-28-(i%5)*6,x+((i%3)-1)*5,ch-64-(i%4)*8);ctx.stroke()}}
function gameLoop(ts){requestAnimationFrame(gameLoop);if(!initialized)return;let dt=(ts-lastTime)/1000;if(dt>.05)dt=.05;lastTime=ts;try{if(gameState==='PLAYING'){spawnTimer-=dt;if(spawnTimer<=0){const empty=mounds.filter(m=>!m.hider);if(empty.length>0)empty[Math.floor(Math.random()*empty.length)].hider=new Hider();spawnInterval=Math.max(.5,1.5-score*.02);difficultyMultiplier=1+score*.05;spawnTimer=spawnInterval}mounds.forEach(m=>m.update(dt));for(let i=particles.length-1;i>=0;i--){particles[i].update(dt);if(particles[i].life<=0)particles.splice(i,1)}}drawBackground(ts);mounds.forEach(m=>m.draw(ctx));particles.forEach(p=>p.draw(ctx))}catch(e){console.error('Loop error',e)}}
function handleGameInput(e){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(!isFinite(x)||!isFinite(y))return;let hit=false;for(let i=mounds.length-1;i>=0;i--){const m=mounds[i];if(m.hider&&m.hider.state!=='DONE'){const hy=m.y+m.hider.yOffset*m.r,dx=x-m.x,dy=y-hy,hr=m.r*.6;if(dx*dx+dy*dy<=hr*hr&&m.hider.yOffset<-.2){score++;updateHUD();spawnParticles(m.x,hy,'#d6f06f');AudioManager.play('sfx_collect','pop');showFeedbackGif('celebration-gif',820);showToast(score%5===0?'ONION BONUS!':'NOTICE TRASHED!');vibrate('medium');m.hider=null;m.squish=.8;hit=true;break}}}if(!hit){for(let i=mounds.length-1;i>=0;i--){const m=mounds[i],dx=x-m.x,dy=(y-m.y)/.6;if(dx*dx+dy*dy<=m.r*m.r){m.hit();break}}}}
function handleCanvasInput(e){e.preventDefault();AudioManager.unlock();if(gameState==='PLAYING')handleGameInput(e)}
function resize(w,h){const dpr=window.devicePixelRatio||1;cw=w;ch=h;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!initialized){initGame();setState('PLAYING');initialized=true;lastTime=performance.now();requestAnimationFrame(gameLoop)}}
document.addEventListener('DOMContentLoaded',()=>{AudioManager.init();const ro=new ResizeObserver(entries=>{for(const entry of entries){if(entry.target===canvas)resize(entry.contentRect.width,entry.contentRect.height)}});ro.observe(canvas);canvas.addEventListener('pointerdown',handleCanvasInput,{passive:false});document.getElementById('restart-btn').addEventListener('click',e=>{e.preventDefault();AudioManager.unlock();restartGame()})});
</script>
