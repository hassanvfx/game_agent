<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Social Stream Saga</title>
    <!-- [agent-note][stage2] visual-intent: neon signal-runner identity | scope: menus,hud,player -->
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <script>
        tailwind.config = { corePlugins: { preflight: true } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #08111f;
            --bg-mid: #101d33;
            --bg-bottom: #030712;
            --panel: rgba(11, 19, 36, 0.72);
            --panel-strong: rgba(16, 30, 56, 0.88);
            --panel-border: rgba(103, 232, 249, 0.34);
            --panel-highlight: rgba(255, 255, 255, 0.08);
            --accent-cyan: #67e8f9;
            --accent-blue: #60a5fa;
            --accent-violet: #a78bfa;
            --danger: #fb7185;
            --danger-deep: #ef4444;
            --good: #22d3ee;
            --gold: #fde68a;
            --text-main: #e5f4ff;
            --text-soft: #b7cde6;
            --shadow-soft: 0 16px 40px rgba(3, 10, 24, 0.4);
            --shadow-glow: 0 0 20px rgba(103, 232, 249, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(103, 232, 249, 0.14), transparent 28%),
                radial-gradient(circle at 80% 20%, rgba(167, 139, 250, 0.18), transparent 24%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hud-font {
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .display-font {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .mono-font {
            font-family: 'VT323', ui-monospace, monospace;
        }

        .glass-panel {
            --panel-radius: 1.75rem;
            position: relative;
            background:
                linear-gradient(180deg, rgba(18, 31, 57, 0.92), rgba(8, 15, 31, 0.88));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: var(--panel-radius);
            box-shadow: var(--shadow-soft), inset 0 1px 0 var(--panel-highlight);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--panel-radius);
            background: linear-gradient(135deg, rgba(103, 232, 249, 0.12), transparent 42%, rgba(167, 139, 250, 0.08));
            pointer-events: none;
        }

        .gradient-text {
            background: linear-gradient(90deg, #eefbff 0%, var(--accent-cyan) 40%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .signal-card {
            max-width: min(24rem, calc(100vw - 2rem));
            border-radius: 1.75rem;
            overflow: hidden;
        }

        .signal-frame {
            width: 7rem;
            height: 7rem;
            margin: 0 auto 1rem;
            border-radius: 1.75rem;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.32), transparent 38%),
                linear-gradient(145deg, rgba(34, 211, 238, 0.36), rgba(96, 165, 250, 0.18) 48%, rgba(167, 139, 250, 0.28));
            border: 1px solid rgba(103, 232, 249, 0.35);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 22px rgba(96, 165, 250, 0.22);
        }

        .signal-emoji {
            font-size: 3.6rem;
            filter: drop-shadow(0 0 12px rgba(103, 232, 249, 0.35));
            animation: pulseFloat 2.6s ease-in-out infinite;
        }

        .signal-chip-row {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .signal-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(103, 232, 249, 0.22);
            background: rgba(4, 10, 23, 0.4);
            color: var(--text-soft);
            font-size: 0.9rem;
            line-height: 1;
        }

        .signal-copy {
            color: var(--text-soft);
            font-size: 1.1rem;
            line-height: 1.25;
        }

        .arcade-btn {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(103, 232, 249, 0.3);
            background: linear-gradient(135deg, #1d4ed8, #2563eb 45%, #7c3aed);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.24);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .arcade-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 15%, rgba(255, 255, 255, 0.25) 42%, transparent 70%);
            transform: translateX(-120%);
            transition: transform 260ms ease;
        }

        .arcade-btn:hover::after,
        .arcade-btn:focus-visible::after {
            transform: translateX(120%);
        }

        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35), 0 0 18px rgba(103, 232, 249, 0.18);
            filter: brightness(1.05);
            outline: none;
        }

        .arcade-btn:active,
        .arcade-btn.is-pressed {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .status-title {
            font-size: clamp(1.8rem, 7vw, 2.7rem);
            line-height: 1;
            letter-spacing: 0.08em;
        }

        .sub-panel {
            background: rgba(4, 10, 23, 0.46);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #ui-layer {
            background:
                linear-gradient(180deg, rgba(5, 10, 21, 0.14) 0%, rgba(5, 10, 21, 0.04) 30%, rgba(5, 10, 21, 0.1) 100%);
        }

        #hud {
            padding: max(0.85rem, env(safe-area-inset-top)) max(0.85rem, env(safe-area-inset-right)) 0.8rem max(0.85rem, env(safe-area-inset-left));
            gap: 0.75rem;
        }

        .hud-pill {
            --panel-radius: 999px;
            min-height: 3.25rem;
            padding: 0.65rem 0.95rem;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: var(--text-main);
            box-shadow: var(--shadow-glow);
        }

        .hud-label {
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            color: var(--text-soft);
            text-transform: uppercase;
        }

        .hud-value {
            font-size: clamp(1rem, 4vw, 1.35rem);
            line-height: 1;
            color: #f8fdff;
        }

        .score-core,
        .lives-core {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .icon-badge {
            width: 2rem;
            height: 2rem;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.28), rgba(103, 232, 249, 0.12));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }

        .panel-score {
            color: var(--accent-cyan);
            text-shadow: 0 0 12px rgba(103, 232, 249, 0.22);
        }

        .panel-danger {
            color: #fef3c7;
        }

        #lives {
            letter-spacing: 0.15em;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(253, 230, 138, 0.25);
        }

        .end-score {
            color: var(--accent-cyan);
            text-shadow: 0 0 18px rgba(103, 232, 249, 0.25);
        }

        .screen-shell {
            padding: 1.35rem;
        }

        .tiny-note {
            font-size: 0.86rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(183, 205, 230, 0.82);
        }

        .reaction-overlay {
            position: absolute;
            right: max(0.75rem, env(safe-area-inset-right));
            bottom: max(0.75rem, env(safe-area-inset-bottom));
            width: min(28vw, 8rem);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(103, 232, 249, 0.28);
            background: rgba(3, 10, 24, 0.72);
            box-shadow: 0 12px 28px rgba(3, 10, 24, 0.35);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 3;
        }

        .reaction-overlay.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .reaction-overlay img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .reaction-overlay.fail {
            left: max(0.75rem, env(safe-area-inset-left));
            right: auto;
            border-color: rgba(251, 113, 133, 0.38);
        }

        @keyframes pulseFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-5px) scale(1.04);
            }
        }

        @media (max-width: 640px) {
            .screen-shell {
                padding: 1rem;
            }

            .signal-frame {
                width: 5.5rem;
                height: 5.5rem;
                border-radius: 1.25rem;
            }

            .signal-emoji {
                font-size: 2.9rem;
            }

            .signal-copy {
                font-size: 1rem;
            }

            .hud-pill {
                min-height: 2.95rem;
                padding: 0.55rem 0.8rem;
                gap: 0.55rem;
            }

            .icon-badge {
                width: 1.7rem;
                height: 1.7rem;
                font-size: 0.95rem;
            }

            .hud-label {
                font-size: 0.68rem;
            }

            .tiny-note {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">

            <!-- Start Screen -->
            <div id="start-screen" class="screen-shell glass-panel signal-card text-center pointer-events-auto transition duration-300 w-full mx-4">
                <div class="p-6 sm:p-8 relative z-10">
                    <div class="signal-frame">
                        <div class="signal-emoji" aria-hidden="true">🛰️</div>
                    </div>
                    <div class="signal-chip-row">
                        <span class="signal-chip">LIVE FEED</span>
                        <span class="signal-chip">NEON SWEEP</span>
                    </div>
                    <h1 class="status-title display-font font-bold mb-3 gradient-text">SIGNAL SWEEP</h1>
                    <p class="signal-copy mb-6">Catch <span style="color:#7dd3fc;">clean signals ❤️</span> and dodge <span style="color:#fda4af;">jammers 😡</span> in a fast-moving social orbit.</p>
                    <button id="start-btn" class="arcade-btn display-font font-bold py-4 px-10 rounded-full text-base sm:text-lg w-full sm:w-auto">START SCAN</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden screen-shell glass-panel signal-card text-center pointer-events-auto w-full mx-4">
                <div class="p-6 sm:p-8 relative z-10">
                    <div class="tiny-note mb-3">signal integrity dropped</div>
                    <h2 class="status-title display-font font-bold mb-3 text-white">SCAN LOST</h2>
                    <div class="sub-panel rounded-2xl p-4 mb-6">
                        <div class="tiny-note mb-2">signal points secured</div>
                        <div class="end-score display-font text-5xl sm:text-6xl font-bold" id="finalScore">0</div>
                    </div>
                    <button id="restart-btn" class="arcade-btn display-font font-bold py-3 px-8 rounded-full text-base sm:text-lg w-full sm:w-auto">RESCAN</button>
                </div>
            </div>

            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <!-- [agent-note][stage4] repaired: font-remap | title=Orbitron ui=Rajdhani mono=VT323 | source: catalogs/fonts.json -->
            <!-- [agent-note][stage3] resolved-gif: reward/fail overlays anchored away from controls | source: catalogs/gifs.json -->
            <div id="hud" class="absolute top-0 left-0 w-full flex justify-between items-start hidden pointer-events-none">
                <div class="glass-panel hud-pill">
                    <div class="icon-badge">❤️</div>
                    <div class="score-core">
                        <span class="hud-label hud-font">Score</span>
                        <span id="score" class="hud-value hud-font panel-score">0</span>
                    </div>
                </div>
                <div class="glass-panel hud-pill">
                    <div class="icon-badge">🛡️</div>
                    <div class="lives-core">
                        <span class="hud-label hud-font">Hull</span>
                        <div id="lives" class="hud-value hud-font">⭐⭐⭐</div>
                    </div>
                </div>
            </div>

            <div id="reward-overlay" class="reaction-overlay pointer-events-none" aria-hidden="true">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Reward reaction">
            </div>

            <div id="fail-overlay" class="reaction-overlay fail pointer-events-none" aria-hidden="true">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                reward: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        const ENABLE_ANIMATIONS = true;

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = new Map();

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = key === 'warning' ? 0.42 : 0.62;
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 90) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const lastPlayed = this.lastPlayedAt.get(key) ?? 0;
                if (now - lastPlayed < cooldown) return;
                this.lastPlayedAt.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let difficultyMultiplier = 1;

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const rewardOverlay = document.getElementById('reward-overlay');
        const failOverlay = document.getElementById('fail-overlay');

        // Player
        let player = { x: 0, y: 0, radius: 30, color: '#60a5fa', pulse: 0 };
        let targetX = 0;

        // Entities
        let items = [];
        let particles = [];

        // Parallax Background
        let bgIcons = [];
        const ICONS = ['👍', '❤️', '🔥', '😆', '😮'];

        function bindButtonFeedback(button) {
            if (!button) return;
            const press = () => button.classList.add('is-pressed');
            const release = () => button.classList.remove('is-pressed');
            button.addEventListener('pointerdown', press);
            button.addEventListener('pointerup', release);
            button.addEventListener('pointerleave', release);
            button.addEventListener('pointercancel', release);
            button.addEventListener('click', () => audio.playSFX('click', 40));
        }

        let overlayTimer = null;

        function flashOverlay(element, duration = 900) {
            if (!element) return;
            clearTimeout(overlayTimer);
            rewardOverlay.classList.remove('is-visible');
            failOverlay.classList.remove('is-visible');
            element.classList.add('is-visible');
            overlayTimer = setTimeout(() => {
                element.classList.remove('is-visible');
            }, duration);
        }

        bindButtonFeedback(startBtn);
        bindButtonFeedback(restartBtn);

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            if (!gameActive) player.x = width / 2;
            targetX = player.x;

            bgIcons = [];
            for (let i = 0; i < 20; i++) {
                bgIcons.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    icon: ICONS[Math.floor(Math.random() * ICONS.length)],
                    speed: 0.5 + Math.random() * 1.5,
                    opacity: 0.08 + Math.random() * 0.18,
                    size: 20 + Math.random() * 42
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. INPUT HANDLING */
        function handleInput(x) {
            if (!gameActive) return;
            targetX = x;
        }

        canvas.addEventListener('mousemove', (e) => handleInput(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 5. GAME LOGIC */
        class Item {
            constructor() {
                this.r = 25;
                this.x = Math.random() * (width - this.r * 2) + this.r;
                this.y = -50;
                const rand = Math.random();
                if (rand < 0.6) {
                    this.type = rand < 0.3 ? 'like' : 'follower';
                    this.isBad = false;
                    this.speed = (3 + Math.random() * 2) * difficultyMultiplier;
                    this.theme = {
                        fill: '#67e8f9',
                        glow: 'rgba(103, 232, 249, 0.4)',
                        ring: 'rgba(125, 211, 252, 0.55)'
                    };
                } else {
                    this.type = rand < 0.8 ? 'hater' : 'dislike';
                    this.isBad = true;
                    this.speed = (4 + Math.random() * 3) * difficultyMultiplier;
                    this.theme = {
                        fill: '#fb7185',
                        glow: 'rgba(251, 113, 133, 0.34)',
                        ring: 'rgba(254, 205, 211, 0.25)'
                    };
                }
            }

            draw() {
                let icon = '';
                if (this.type === 'like') icon = '❤️';
                else if (this.type === 'follower') icon = '👤';
                else if (this.type === 'hater') icon = '😡';
                else if (this.type === 'dislike') icon = '👎';

                ctx.save();
                ctx.beginPath();
                ctx.fillStyle = 'rgba(8, 15, 31, 0.7)';
                ctx.arc(this.x, this.y, this.r + 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.fillStyle = this.theme.glow;
                ctx.arc(this.x, this.y, this.r + 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = this.theme.ring;
                ctx.stroke();

                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = this.theme.glow;
                ctx.shadowBlur = 14;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(icon, this.x, this.y + 1);
                ctx.restore();
            }

            update() {
                this.y += this.speed;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.color = color;
                this.size = 3 + Math.random() * 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.05;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateLivesDisplay() {
            let stars = '';
            for (let i = 0; i < lives; i++) stars += '⭐';
            document.getElementById('lives').innerText = stars;
        }

        function initGame() {
            score = 0;
            lives = 3;
            difficultyMultiplier = 1;
            items = [];
            particles = [];
            frameCount = 0;
            rewardOverlay.classList.remove('is-visible');
            failOverlay.classList.remove('is-visible');
            document.getElementById('score').innerText = score;
            updateLivesDisplay();
            player.x = width / 2;
            targetX = width / 2;
        }

        function drawBackdrop() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#08111f');
            skyGradient.addColorStop(0.5, '#0f1c32');
            skyGradient.addColorStop(1, '#030712');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            for (let i = 0; i < 3; i++) {
                const alpha = 0.12 - (i * 0.025);
                ctx.fillStyle = `rgba(103, 232, 249, ${alpha})`;
                ctx.beginPath();
                ctx.ellipse(width * (0.2 + i * 0.3), height * (0.2 + i * 0.12), width * 0.18, height * 0.08, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            ctx.save();
            bgIcons.forEach(bg => {
                bg.y -= bg.speed;
                if (bg.y < -50) {
                    bg.y = height + 50;
                    bg.x = Math.random() * width;
                }
                ctx.globalAlpha = bg.opacity;
                ctx.font = `${bg.size}px Arial`;
                ctx.fillStyle = "#dbeafe";
                ctx.fillText(bg.icon, bg.x, bg.y);
            });
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = 'rgba(103, 232, 249, 0.08)';
            ctx.lineWidth = 1;
            const rowGap = Math.max(72, Math.floor(height / 9));
            for (let y = 24; y < height; y += rowGap) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPlayer() {
            const pulse = ENABLE_ANIMATIONS ? Math.sin(frameCount * 0.08) * 2 : 0;
            const radius = player.radius + pulse * 0.35;

            ctx.save();
            ctx.shadowColor = 'rgba(96, 165, 250, 0.45)';
            ctx.shadowBlur = 28;
            ctx.shadowOffsetY = 8;

            const shellGradient = ctx.createRadialGradient(player.x - 8, player.y - 10, 4, player.x, player.y, radius + 12);
            shellGradient.addColorStop(0, '#ecfeff');
            shellGradient.addColorStop(0.45, '#dbeafe');
            shellGradient.addColorStop(1, '#60a5fa');

            ctx.fillStyle = shellGradient;
            ctx.beginPath();
            ctx.arc(player.x, player.y, radius + 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(103, 232, 249, 0.55)';
            ctx.beginPath();
            ctx.arc(player.x, player.y, radius + 11, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(8, 15, 31, 0.2)';
            ctx.beginPath();
            ctx.ellipse(player.x, player.y + radius + 17, radius * 1.05, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = "40px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("😎", player.x, player.y + 2);
            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            drawBackdrop();

            player.x += (targetX - player.x) * 0.15;
            drawPlayer();

            frameCount++;
            if (frameCount % Math.max(20, 60 - Math.floor(score / 50)) === 0) {
                items.push(new Item());
            }

            difficultyMultiplier = 1 + (score * 0.002);

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update();
                item.draw();

                const dx = player.x - item.x;
                const dy = player.y - item.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + item.r) {
                    if (item.isBad) {
                        audio.playSFX('fail', 120);
                        lives--;
                        if (lives === 1) {
                            audio.playSFX('warning', 400);
                        }
                        flashOverlay(failOverlay, 820);
                        spawnParticles(item.x, item.y, '#fb7185');
                        updateLivesDisplay();
                        if (lives <= 0) {
                            gameOver();
                        }
                    } else {
                        const points = item.type === 'like' ? 10 : 50;
                        audio.playSFX(points >= 50 ? 'bonus' : 'score', 70);
                        flashOverlay(rewardOverlay, points >= 50 ? 980 : 700);
                        score += points;
                        document.getElementById('score').innerText = score;
                        spawnParticles(item.x, item.y, '#67e8f9');
                    }
                    items.splice(i, 1);
                } else if (item.y > height + 50) {
                    items.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.playSFX('gameOver', 10);
            audio.stopBGM();
            flashOverlay(failOverlay, 1200);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 10);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        restartBtn.addEventListener('click', () => {
            audio.unlock();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playSFX('start', 10);
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
