<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sum Runner</title>
    <!-- [agent-note][stage3] resolved-font: title -> Audiowide | ui/body -> Exo 2 via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #140a2d;
            --bg-bottom: #2b1457;
            --bg-glow: rgba(110, 228, 255, 0.18);
            --panel-bg: rgba(16, 15, 46, 0.72);
            --panel-border: rgba(123, 239, 255, 0.28);
            --panel-shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
            --title-color: #8af7ff;
            --text-main: rgba(246, 250, 255, 0.95);
            --text-soft: rgba(213, 224, 255, 0.72);
            --text-accent: #ffd56d;
            --button-start-a: #35d0ff;
            --button-start-b: #9068ff;
            --button-restart-text: #160f3d;
            --hud-glow: rgba(117, 255, 242, 0.32);
            --danger: #ff788f;
            --hero: #76f4ff;
            --hero-deep: #745cff;
            --coin: #ffe47a;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', sans-serif;
            background:
                radial-gradient(circle at top, rgba(118, 244, 255, 0.14), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: auto;
            pointer-events: none;
            z-index: 0;
        }

        .game-container::before {
            top: -10vmin;
            left: -8vmin;
            width: 30vmin;
            height: 30vmin;
            background: radial-gradient(circle, rgba(122, 244, 255, 0.24), transparent 65%);
            filter: blur(10px);
        }

        .game-container::after {
            right: -8vmin;
            bottom: 12vmin;
            width: 34vmin;
            height: 34vmin;
            background: radial-gradient(circle, rgba(255, 122, 191, 0.18), transparent 66%);
            filter: blur(12px);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(30, 26, 78, 0.88), rgba(10, 12, 33, 0.9)),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            width: min(90vw, 420px);
            padding: 36px 26px;
            margin: 16px;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(138, 247, 255, 0.12), transparent 38%),
                linear-gradient(315deg, rgba(255, 213, 109, 0.12), transparent 30%);
            pointer-events: none;
        }

        .panel.hidden,
        .hud.hidden {
            display: none;
        }

        .hero-badge {
            width: 84px;
            height: 84px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 3px solid rgba(140, 248, 255, 0.65);
            background:
                radial-gradient(circle at 35% 30%, #ffffff 0 10%, #8cf8ff 14%, #6a62ff 54%, #24124f 100%);
            box-shadow:
                0 0 0 6px rgba(118, 244, 255, 0.08),
                0 0 22px rgba(118, 244, 255, 0.34);
            position: relative;
        }

        .hero-badge::before,
        .hero-badge::after {
            content: "";
            position: absolute;
            top: 28px;
            width: 10px;
            height: 14px;
            border-radius: 999px;
            background: #160f3d;
        }

        .hero-badge::before { left: 23px; }
        .hero-badge::after { right: 23px; }

        .hero-badge span {
            position: absolute;
            left: 50%;
            bottom: 18px;
            width: 30px;
            height: 14px;
            transform: translateX(-50%);
            border-bottom: 4px solid #160f3d;
            border-radius: 0 0 18px 18px;
        }

        .title {
            margin: 0 0 10px;
            font-family: 'Audiowide', sans-serif;
            font-size: clamp(2.35rem, 8vw, 3.25rem);
            line-height: 1;
            letter-spacing: 0.08em;
            color: var(--title-color);
            text-shadow: 0 0 18px rgba(117, 255, 242, 0.28);
        }

        .subtitle {
            margin: 0 0 8px;
            color: var(--text-main);
            font-size: clamp(1rem, 4.6vw, 1.2rem);
            font-weight: 600;
        }

        .hint {
            margin: 0 0 24px;
            color: var(--text-accent);
            font-size: 0.94rem;
            line-height: 1.45;
        }

        .button {
            border: none;
            border-radius: 999px;
            padding: 15px 30px;
            font: 700 1rem 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        .button:hover,
        .button:focus-visible {
            transform: translateY(-2px) scale(1.01);
            filter: brightness(1.04);
            outline: none;
        }

        .button-start {
            color: #fff;
            background: linear-gradient(90deg, var(--button-start-a), var(--button-start-b));
            box-shadow: 0 10px 28px rgba(53, 208, 255, 0.3);
        }

        .button-start:hover,
        .button-start:focus-visible {
            box-shadow: 0 12px 32px rgba(53, 208, 255, 0.4);
        }

        .button-restart {
            color: var(--button-restart-text);
            background: linear-gradient(180deg, #fff3ba, #ffffff);
            box-shadow: 0 10px 24px rgba(255, 255, 255, 0.16);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 20px;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #fff;
            font-weight: 700;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
            align-items: flex-start;
            pointer-events: none;
        }

        .hud-chip {
            min-width: 124px;
            padding: 9px 12px;
            border-radius: 16px;
            border: 1px solid rgba(138, 247, 255, 0.24);
            background: rgba(14, 17, 49, 0.6);
            box-shadow: 0 0 18px rgba(117, 255, 242, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hud-target {
            color: var(--title-color);
            font-family: 'Audiowide', sans-serif;
            font-size: clamp(0.95rem, 4vw, 1.2rem);
            letter-spacing: 0.04em;
        }

        .hud-score {
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.92rem;
        }

        .game-over-title {
            margin: 0 0 10px;
            font-family: 'Audiowide', sans-serif;
            font-size: clamp(2rem, 7vw, 2.85rem);
            color: var(--danger);
            letter-spacing: 0.06em;
        }

        .final-score {
            margin: 0 0 10px;
            color: #fff;
            font-size: 1.35rem;
            font-weight: 600;
        }

        .final-score span {
            color: #ffe47a;
            font-weight: 700;
        }

        .game-over-copy {
            margin: 0 0 24px;
            color: var(--text-soft);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .status-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .status-pill {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-soft);
            font-size: 0.76rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .feedback-overlay {
            position: absolute;
            right: 16px;
            bottom: 18px;
            width: min(30vw, 120px);
            min-width: 84px;
            aspect-ratio: 1;
            border-radius: 18px;
            border: 1px solid rgba(138, 247, 255, 0.2);
            background: rgba(8, 10, 30, 0.42);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 2;
        }

        .feedback-overlay.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feedback-label {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 8px;
            padding: 4px 6px;
            border-radius: 999px;
            background: rgba(8, 10, 30, 0.72);
            color: #fff;
            font: 700 0.65rem 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            .panel {
                padding: 30px 20px;
                border-radius: 22px;
            }

            .hero-badge {
                width: 76px;
                height: 76px;
            }

            .hud {
                top: 14px;
                left: 12px;
            }

            .hud-chip {
                min-width: 112px;
                padding: 8px 10px;
            }

            .button {
                width: 100%;
                max-width: 240px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel">
                <div class="hero-badge" aria-hidden="true"><span></span></div>
                <h1 class="title">SUM RUNNER</h1>
                <div class="status-row" aria-hidden="true">
                    <span class="status-pill">Neon Core</span>
                    <span class="status-pill">Signal Chase</span>
                </div>
                <p class="subtitle">Guide your glowing number core into the matching signal.</p>
                <p class="hint">Slide left or right and catch the number word that completes 10.</p>
                <button id="start-btn" class="button button-start">START RUN</button>
            </div>

            <div id="game-over-screen" class="panel hidden">
                <div class="hero-badge" aria-hidden="true"><span></span></div>
                <h2 class="game-over-title">SIGNAL LOST</h2>
                <div class="final-score">Score: <span id="finalScore">0</span></div>
                <p class="game-over-copy">You absorbed the wrong value. Keep matching pairs that total 10.</p>
                <button id="restart-btn" class="button button-restart">RETRY</button>
            </div>

                <div id="hud" class="hud hidden">
                    <div class="hud-chip hud-target">Target Sum: 10</div>
                    <div class="hud-chip hud-score">Score: <span id="score">0</span></div>
                </div>

                <!-- [agent-note][stage3] resolved-gif: correct/fail reactions -> catalogs/gifs.json -->
                <div id="feedback-overlay" class="feedback-overlay" aria-live="polite">
                    <img id="feedback-gif" alt="Reaction overlay">
                    <div id="feedback-label" class="feedback-label">Signal lock</div>
                </div>
            </div>
        </div>

        <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                score: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const PALETTE = {
            bgTop: "#140a2d",
            bgBottom: "#2b1457",
            bgPulse: "#72f4ff",
            heroGlow: "#76f4ff",
            heroDeep: "#745cff",
            heroShell: "#f6fdff",
            good: "#ffe47a",
            danger: "#ff788f",
            enemyWord: "#ffe0f3",
            enemyBody: "#5c2ea8",
            trail: "#b3fbff"
        };

        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.enabled = false;
                this.unlocked = false;
                this.sfx = {};
                this.lastPlay = {};
                const volumes = { start: 0.55, ui: 0.42, score: 0.62, fail: 0.58 };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    audio.volume = volumes[k] ?? 0.55;
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                this.enabled = true;
                if (this.unlocked) return;
                this.unlocked = true;
                const warmups = [this.bgm, ...Object.values(this.sfx)];
                warmups.forEach(audio => {
                    audio.play().then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                    }).catch(() => {});
                });
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, minGap = 90) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlay[key] && now - this.lastPlay[key] < minGap) return;
                this.lastPlay[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackGif = document.getElementById('feedback-gif');
        const feedbackLabel = document.getElementById('feedback-label');
        let feedbackTimer = null;

        function showFeedback(type, label) {
            const src = ASSETS.gifs[type];
            if (!src) return;
            feedbackGif.src = src;
            feedbackGif.alt = label;
            feedbackLabel.textContent = label;
            feedbackOverlay.classList.add('active');
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                feedbackOverlay.classList.remove('active');
            }, type === 'fail' ? 2200 : 1200);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frames = 0;
        let gameSpeed = 3;

        let player = {
            x: 0,
            y: 0,
            radius: 40,
            value: 5,
            targetX: 0,
            pulse: 0
        };

        let enemies = [];
        let particles = [];
        let bgStars = [];

        const NUMBER_WORDS = {
            1: "ONE", 2: "TWO", 3: "THREE", 4: "FOUR", 5: "FIVE",
            6: "SIX", 7: "SEVEN", 8: "EIGHT", 9: "NINE"
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 100;
            if (!gameActive) player.x = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function handleInput(e) {
            if (!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.targetX = clientX;
        }
        window.addEventListener('mousemove', handleInput);
        window.addEventListener('touchmove', handleInput, { passive: false });
        window.addEventListener('touchstart', handleInput, { passive: false });

        function initBackground() {
            bgStars = [];
            for (let i = 0; i < 30; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 20 + 5,
                    speed: Math.random() * 1 + 0.2,
                    type: Math.random() > 0.5 ? '✦' : '·',
                    color: `rgba(${100 + Math.random() * 90}, ${180 + Math.random() * 75}, 255, ${0.1 + Math.random() * 0.32})`
                });
            }
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, PALETTE.bgTop);
            grad.addColorStop(0.55, "#1f1145");
            grad.addColorStop(1, PALETTE.bgBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const pulseX = width * 0.5 + Math.sin(frames * 0.01) * width * 0.12;
            const pulseY = height * 0.2;
            const pulse = ctx.createRadialGradient(pulseX, pulseY, 0, pulseX, pulseY, width * 0.45);
            pulse.addColorStop(0, "rgba(114, 244, 255, 0.18)");
            pulse.addColorStop(1, "rgba(114, 244, 255, 0)");
            ctx.fillStyle = pulse;
            ctx.fillRect(0, 0, width, height);

            bgStars.forEach(star => {
                star.y += star.speed;
                if (star.y > height + 50) {
                    star.y = -50;
                    star.x = Math.random() * width;
                }
                ctx.fillStyle = star.color;
                ctx.font = `${star.size}px "Exo 2"`;
                ctx.fillText(star.type, star.x, star.y);
            });

            ctx.save();
            ctx.globalAlpha = 0.18;
            for (let i = 0; i < 4; i++) {
                const y = height * (0.18 + i * 0.2) + Math.sin(frames * 0.02 + i) * 10;
                ctx.strokeStyle = i % 2 === 0 ? "#67efff" : "#9a84ff";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.quadraticCurveTo(width * 0.25, y - 18, width * 0.5, y);
                ctx.quadraticCurveTo(width * 0.75, y + 18, width, y - 4);
                ctx.stroke();
            }
            ctx.restore();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color,
                    size: Math.random() * 5 + 3
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawHero() {
            player.pulse += 0.08;
            const ring = player.radius + 11 + Math.sin(player.pulse) * 3;
            const faceOffset = Math.sin(player.pulse) * 1.5;

            ctx.save();
            ctx.shadowBlur = 30;
            ctx.shadowColor = "rgba(118, 244, 255, 0.65)";
            ctx.strokeStyle = "rgba(118, 244, 255, 0.32)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(player.x, player.y, ring, 0, Math.PI * 2);
            ctx.stroke();

            const orb = ctx.createRadialGradient(
                player.x - player.radius * 0.3,
                player.y - player.radius * 0.4,
                player.radius * 0.12,
                player.x,
                player.y,
                player.radius * 1.08
            );
            orb.addColorStop(0, "#ffffff");
            orb.addColorStop(0.2, "#dffcff");
            orb.addColorStop(0.48, PALETTE.heroGlow);
            orb.addColorStop(0.78, PALETTE.heroDeep);
            orb.addColorStop(1, "#26124d");

            ctx.fillStyle = orb;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = "rgba(255,255,255,0.32)";
            ctx.beginPath();
            ctx.arc(player.x - 12, player.y - 14, 9, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#1a103f";
            ctx.beginPath();
            ctx.arc(player.x - 11, player.y - 5 + faceOffset, 3.5, 0, Math.PI * 2);
            ctx.arc(player.x + 11, player.y - 5 + faceOffset, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = "#1a103f";
            ctx.beginPath();
            ctx.arc(player.x, player.y + 8 + faceOffset, 10, 0.15, Math.PI - 0.15);
            ctx.stroke();

            ctx.fillStyle = "#fff4be";
            ctx.font = '700 34px "Exo 2"';
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(player.value, player.x, player.y + 1);
            ctx.restore();
        }

        function drawEnemy(e) {
            const widthPad = Math.max(74, e.text.length * 18);
            const heightPad = 40;
            const x = e.x - widthPad / 2;
            const y = e.y - heightPad / 2;

            ctx.save();
            ctx.shadowBlur = 16;
            ctx.shadowColor = "rgba(255, 120, 143, 0.28)";
            ctx.fillStyle = e.body;
            roundRect(ctx, x, y, widthPad, heightPad, 18);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = e.edge;
            ctx.lineWidth = 2;
            roundRect(ctx, x, y, widthPad, heightPad, 18);
            ctx.stroke();

            ctx.fillStyle = "rgba(255,255,255,0.12)";
            roundRect(ctx, x + 6, y + 6, widthPad - 12, 10, 8);
            ctx.fill();

            ctx.fillStyle = PALETTE.enemyWord;
            ctx.font = '700 22px "Exo 2"';
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(e.text, e.x, e.y + 2);
            ctx.restore();
        }

        function roundRect(context, x, y, w, h, r) {
            context.beginPath();
            context.moveTo(x + r, y);
            context.arcTo(x + w, y, x + w, y + h, r);
            context.arcTo(x + w, y + h, x, y + h, r);
            context.arcTo(x, y + h, x, y, r);
            context.arcTo(x, y, x + w, y, r);
            context.closePath();
        }

        function spawnEnemy() {
            const val = Math.floor(Math.random() * 9) + 1;
            const word = NUMBER_WORDS[val];
            enemies.push({
                x: Math.random() * (width - 100) + 50,
                y: -50,
                value: val,
                text: word,
                speed: gameSpeed + (Math.random() * 1.5),
                body: `hsl(${265 + Math.random() * 45}, 75%, ${32 + Math.random() * 8}%)`,
                edge: `hsla(${46 + Math.random() * 20}, 95%, 72%, 0.95)`
            });
        }

        function initGame() {
            score = 0;
            frames = 0;
            gameSpeed = 3;
            enemies = [];
            particles = [];
            player.value = Math.floor(Math.random() * 8) + 1;
            player.targetX = width / 2;
            player.x = width / 2;
            player.pulse = 0;
            document.getElementById('score').innerText = score;
            initBackground();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawBackground();

            if (frames % 60 === 0) {
                spawnEnemy();
            }
            frames++;

            player.x += (player.targetX - player.x) * 0.1;
            drawHero();

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                drawEnemy(e);

                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < player.radius + 30) {
                    if (e.value + player.value === 10) {
                        score++;
                        gameSpeed += 0.1;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('score', 80);
                        createParticles(e.x, e.y, PALETTE.good);
                        showFeedback('score', 'Signal lock');

                        player.value = Math.floor(Math.random() * 9) + 1;
                        enemies.splice(i, 1);
                    } else {
                        gameOver();
                    }
                }

                if (e.y > height + 50) {
                    enemies.splice(i, 1);
                }
            }

            updateAndDrawParticles();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 200);
            showFeedback('fail', 'Signal lost');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function bootAudio() {
            audio.unlock();
            window.removeEventListener('pointerdown', bootAudio);
            window.removeEventListener('keydown', bootAudio);
        }

        function startGame() {
            audio.unlock();
            audio.playSFX('start', 200);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        function restartGame() {
            audio.unlock();
            audio.playSFX('ui', 160);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        }

        window.addEventListener('pointerdown', bootAudio, { once: true });
        window.addEventListener('keydown', bootAudio, { once: true });

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        // [agent-note][stage4] repaired: mobile-cta-actionability | reason: keep native button taps working while gameplay gestures stay scoped to canvas
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);

        resize();
        initBackground();
        drawBackground();
        player.value = "?";
        drawHero();
        player.value = 5;
    });
    </script>
</body>
</html>
