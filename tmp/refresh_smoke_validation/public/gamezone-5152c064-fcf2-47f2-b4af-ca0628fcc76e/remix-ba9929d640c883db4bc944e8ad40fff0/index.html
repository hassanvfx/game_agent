<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rhythm Grove: Fairy Bard Audit</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff7abc;--rose2:#ff3e9f;--cream:#fff4cf;--mint:#8effc1;--leaf:#4dbb72;--ink:#33203a;--violet:#7b5cff;--sky:#9ee8ff;--panel:rgba(255,244,250,.92)}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#ffb8dd;color:var(--ink);font-family:'Bangers',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 14%,#fff7 0 7%,transparent 8%),radial-gradient(circle at 88% 12%,#fff7 0 6%,transparent 7%),linear-gradient(180deg,#ffd5eb 0%,#ffe7b7 48%,#b7f3c1 100%)}
#game-container{position:relative;width:100%;height:100%;overflow:hidden;max-width:700px;margin:0 auto;background:linear-gradient(#ffd1ea,#ffe7bc 52%,#a9efba)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui-layer{position:absolute;inset:0;pointer-events:none;z-index:4;display:flex;flex-direction:column;justify-content:space-between;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px}.hud-pill{pointer-events:none;border:3px solid #fff;border-bottom:6px solid #cc5f97;border-radius:18px;background:var(--panel);box-shadow:0 8px 0 #0002, inset 0 0 0 2px #ffb6dc;padding:9px 10px;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.5vw,15px);line-height:1.45;text-shadow:1px 1px #fff}.label{display:block;color:#8d3a87;font-size:.72em}.value{color:#ff248d}
#brief{align-self:center;width:min(94vw,520px);margin-top:8px;padding:10px 12px;border:3px solid #fff;border-radius:20px;background:rgba(255,255,255,.72);box-shadow:0 5px 0 #ee88bc;text-align:center;font-size:clamp(16px,4.2vw,24px);line-height:1.05}.title{font-family:'Press Start 2P';font-size:clamp(10px,2.8vw,16px);color:#7b3bd9;margin-bottom:6px}.copy{margin:0;color:#6b3569}.copy b{color:#ff238c}
#feedback-stack{position:absolute;right:10px;bottom:82px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}.reaction-card{width:min(30vw,108px);border:3px solid #fff;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 7px 0 #0002,0 0 0 2px #ff8cca;opacity:0;transform:translateY(16px) scale(.88);transition:.18s}.reaction-card.is-visible{opacity:1;transform:none}.reaction-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.reaction-chip{font-family:'Press Start 2P';font-size:8px;text-align:center;padding:6px 4px;color:#a92b78;background:#ffe2f3}
#game-over-screen{position:absolute;inset:0;background:rgba(67,30,73,.55);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;pointer-events:auto}.hidden{display:none!important}.game-over-card{width:min(92vw,390px);border:4px solid #fff;border-bottom:9px solid #a94d86;border-radius:26px;background:linear-gradient(#fff7fb,#ffe6f1);box-shadow:0 14px 0 #0002,0 0 0 3px #ff8cca;text-align:center;padding:22px}.game-over-title{font-family:'Press Start 2P';font-size:clamp(18px,5vw,28px);color:#ff238c;line-height:1.35;margin:0 0 12px}.game-over-copy{font-size:clamp(22px,6vw,32px);line-height:1.05;margin:0 0 16px;color:#633763}.score-strong{color:#7a48e8}.clay-btn{font-family:'Press Start 2P';font-size:clamp(12px,3.2vw,16px);border:0;border-radius:18px;background:linear-gradient(#ff92d0,#ff3d9d);color:white;text-shadow:2px 2px #9c2367;padding:16px 18px;box-shadow:0 8px 0 #9c2367;cursor:pointer}.clay-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #9c2367}
#tap-zone-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,420px);text-align:center;border:3px dashed #fff8;border-radius:18px;background:rgba(255,255,255,.45);padding:8px 10px;font-size:clamp(16px,4.4vw,22px);color:#743568;pointer-events:none}.beat{color:#ff238c}.spark{position:absolute;inset:auto auto 34% 50%;transform:translateX(-50%);font-family:'Press Start 2P';font-size:12px;color:#fff;text-shadow:2px 2px #ff238c;opacity:.85;pointer-events:none}
@media (min-aspect-ratio: 9/16){#game-container{border-left:6px solid #fff4;border-right:6px solid #fff4}} @media (max-width:380px){#brief{font-size:16px}.hud-pill{padding:8px 6px}#tap-zone-hint{bottom:10px}}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas" aria-label="Tap the melody runes in the displayed order before the timer ends"></canvas>
<div id="ui-layer">
<div><div id="hud"><div class="hud-pill"><span class="label">BOPS SEALED</span><span id="score-val" class="value">0</span></div><div class="hud-pill"><span class="label">GROVE VERSE</span><span id="level-val" class="value">1</span></div></div><div id="brief"><div class="title">RHYTHM GROVE: FAIRY BARD AUDIT</div><p class="copy">Tap floating <b>melody runes</b> in order. It’s giving cottagecore quest energy.</p></div></div>
<div id="feedback-stack" aria-hidden="true"><div id="success-reaction" class="reaction-card"><img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="heart reward reaction"><div class="reaction-chip">BOP BLESSED</div></div><div id="fail-reaction" class="reaction-card"><img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="funny fail reaction"><div class="reaction-chip">OFF BEAT</div></div></div>
<div id="tap-zone-hint">one thumb: tap the next <span class="beat">beat rune</span> ✦</div>
<div id="game-over-screen" class="hidden"><div class="game-over-card"><h2 class="game-over-title">THE VIBES<br>GOT TAXED</h2><p class="game-over-copy">You sealed <span id="final-score" class="score-strong">0</span> bops before the goblin HOA muted the grove.</p><button id="restart-btn" class="clay-btn">REMIX AGAIN</button></div></div>
</div></div>
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/bgm/joyful_bgm_01.mp3" preload="none" loop></audio>
<audio id="sfx_pick" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_character_01.mp3" preload="auto"></audio>
<audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_enemy_01.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/sfx/eerie_defeat_01.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_npc_01.mp3" preload="auto"></audio>
<script id="game-config" type="application/x-game-config">{"gameDuration":{"type":"number","label":"Session Length (s)","value":60,"min":30,"max":180},"clayPrimary":{"type":"color","label":"Barbiecore Bloom","value":"#ff7abc"},"claySecondary":{"type":"color","label":"Cottagecore Grove","value":"#a9efba"}}</script>
<script>
(function(){
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),configEl=document.getElementById('game-config'),bgm=document.getElementById('bgm_main'),successReaction=document.getElementById('success-reaction'),failReaction=document.getElementById('fail-reaction');
let gameConfig={},gameState='PLAYING',cw=0,ch=0,dpr=1,initialized=false,score=0,level=1,timeLeft=60,lastTime=0,audioUnlocked=false,bgmStarted=false,lastSoundAt=0,reactionTimer=0,lastTouchAt=0,pulse=0;
const WORDS=['PIANO','BANJO','DRUMS','VINYL','TUNES','RHYME','BEATS','SONGS','MAGIC','FAIRY','CROWN','HEART','GROVE','PIXEL','KITTY','QUEST','BLOOM','CHARM','LYRIC','TEMPO'];
let currentWord='',scrambledLetters=[],selectedIndices=[],particles=[];
function hideReactionCards(){successReaction.classList.remove('is-visible');failReaction.classList.remove('is-visible')}function showReaction(type){hideReactionCards();(type==='success'?successReaction:failReaction).classList.add('is-visible');clearTimeout(reactionTimer);reactionTimer=setTimeout(hideReactionCards,1400)}
const AudioCtx=window.AudioContext||window.webkitAudioContext,audioCtx=AudioCtx?new AudioCtx():null,sfxBuffers={},soundVolumes={sfx_pick:.22,sfx_win:.34,sfx_fail:.22,sfx_gameover:.3,sfx_restart:.24};
async function initAudio(){if(!audioCtx)return;bgm.volume=.18}
function playTone(f=440,d=.1,g=.05,t='sine'){if(!audioCtx)return;const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);gain.gain.setValueAtTime(g,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(gain);gain.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function playFallbackFor(id){if(id==='sfx_fail')return playTone(240,.12,.03,'triangle');if(id==='sfx_gameover')return playTone(180,.24,.04,'sawtooth');if(id==='sfx_win')return playTone(740,.16,.04,'square');playTone(520,.08,.025,'sine')}
function playSfx(id,throttleMs=70){if(!audioCtx)return;const now=performance.now();if(now-lastSoundAt<throttleMs)return;lastSoundAt=now;if(sfxBuffers[id]){const s=audioCtx.createBufferSource(),g=audioCtx.createGain();s.buffer=sfxBuffers[id];g.gain.value=soundVolumes[id]||.24;s.connect(g);g.connect(audioCtx.destination);s.start(0)}else playFallbackFor(id)}
function syncBgm(){if(!bgm)return;if(gameState==='PLAYING'&&audioUnlocked&&bgmStarted)bgm.play().catch(()=>{});else bgm.pause()}function unlockAudio(){if(!audioCtx)return;audioUnlocked=true;if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});bgmStarted=true;syncBgm()}
function nextWord(){currentWord=WORDS[Math.floor(Math.random()*WORDS.length)];scrambledLetters=currentWord.split('').sort(()=>Math.random()-.5).map((char,i)=>({char,id:i,x:0,y:0,targetX:0,targetY:0,scale:0,angle:(Math.random()-.5)*.28,color:['#ff4fa3','#7b5cff','#32b86a','#ffa629','#3bcfff'][i%5],note:['♪','♫','♬','✦','♡'][i%5]}));selectedIndices=[];layoutLetters()}
function layoutLetters(){const margin=Math.max(32,Math.min(62,cw*.12)),availableW=cw-margin*2,spacing=availableW/scrambledLetters.length;scrambledLetters.forEach((l,i)=>{l.targetX=margin+spacing*i+spacing/2;l.targetY=ch*.62+Math.sin(i*1.7)*18;if(l.scale===0){l.x=l.targetX;l.y=ch+96}})}
function setState(next){const previous=gameState;gameState=next;document.getElementById('game-over-screen').classList.toggle('hidden',next!=='GAMEOVER');if(next==='GAMEOVER'){document.getElementById('final-score').innerText=score;playSfx('sfx_gameover',0);showReaction('fail');window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',params:{style:'heavy'}})}else if(previous==='GAMEOVER'&&next==='PLAYING')hideReactionCards();syncBgm()}
function spawnParticles(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.8)*8,life:1,color,size:Math.random()*7+4,shape:i%3})}
function handleInput(e){if(e.type==='pointerdown'&&performance.now()-lastTouchAt<20)return;lastTouchAt=performance.now();const point=e.touches?e.touches[0]:e;if(!point)return;const rect=canvas.getBoundingClientRect(),touchX=point.clientX-rect.left,touchY=point.clientY-rect.top;if(touchX<0||touchX>rect.width||touchY<0||touchY>rect.height)return;unlockAudio();if(gameState==='GAMEOVER')return;scrambledLetters.forEach((l,idx)=>{const dx=touchX-l.x,dy=touchY-l.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<42&&!selectedIndices.includes(idx)){selectedIndices.push(idx);playSfx('sfx_pick');l.scale=1.3;window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',params:{style:'light'}});const attempt=selectedIndices.map(i=>scrambledLetters[i].char).join('');if(attempt===currentWord){score+=10;level=Math.floor(score/50)+1;document.getElementById('score-val').innerText=score;document.getElementById('level-val').innerText=level;spawnParticles(l.x,l.y,l.color);playSfx('sfx_win',0);showReaction('success');setTimeout(nextWord,500)}else if(attempt.length===currentWord.length){selectedIndices=[];playSfx('sfx_fail',0);showReaction('fail');window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',params:{style:'medium'}})}}})}
function update(dt){pulse+=dt;if(gameState==='PLAYING'){timeLeft-=dt;if(timeLeft<=0)setState('GAMEOVER')}scrambledLetters.forEach((l,i)=>{l.x+=(l.targetX-l.x)*.1;l.y+=(l.targetY-l.y)*.1;l.scale+=(1-l.scale)*.2;l.angle+=Math.sin(pulse*2+i)*.001});for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=.02;if(p.life<=0)particles.splice(i,1)}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawPixelHeart(x,y,s,c){ctx.fillStyle=c;const q=s/4;ctx.fillRect(x-q*2,y-q,q,q);ctx.fillRect(x+q,y-q,q,q);ctx.fillRect(x-q*3,y,y,q*5,q);ctx.fillRect(x-q*2,y+q,q*3,q);ctx.fillRect(x-q,y+q*2,q,q)}
function drawBackground(){const sky=ctx.createLinearGradient(0,0,0,ch);sky.addColorStop(0,'#ffd2ec');sky.addColorStop(.5,'#ffe7b4');sky.addColorStop(1,'#9eedb3');ctx.fillStyle=sky;ctx.fillRect(0,0,cw,ch);ctx.globalAlpha=.23;for(let x=-40;x<cw+60;x+=42){ctx.fillStyle=x%84===0?'#fff':'#ffe0f3';ctx.fillRect(x+(pulse*10%42),ch*.1,24,10);ctx.fillRect(x+6+(pulse*10%42),ch*.1-8,14,8)}ctx.globalAlpha=1;ctx.fillStyle='#81d47f';ctx.fillRect(0,ch*.72,cw,ch*.28);ctx.fillStyle='#66bf6d';for(let x=-20;x<cw+40;x+=34){ctx.beginPath();ctx.moveTo(x,ch*.72);ctx.lineTo(x+17,ch*.68+Math.sin(pulse+x)*5);ctx.lineTo(x+34,ch*.72);ctx.closePath();ctx.fill()}for(let i=0;i<9;i++){const x=(i/8)*cw+Math.sin(pulse*.7+i)*8,y=ch*.44+(i%3)*22;ctx.fillStyle='#8b5a3c';ctx.fillRect(x-5,y,10,ch*.72-y);ctx.fillStyle=i%2?'#ff8cca':'#9af0b0';ctx.beginPath();ctx.arc(x,y,28+level*1.5,0,Math.PI*2);ctx.fill();drawPixelHeart(x,y-4,16,'#fff5')}
ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<cw;x+=28){const y=ch*.49+Math.sin(x*.035+pulse*2)*10;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.fillStyle='#fff7';for(let i=0;i<14+level*2;i++){const x=(i*71+pulse*22)%cw,y=ch*.2+((i*37)%Math.max(1,ch*.45));ctx.fillText(i%2?'♪':'♫',x,y)}}
function drawHero(){const x=cw*.5,y=ch*.8,hop=Math.sin(pulse*6)*4;ctx.save();ctx.translate(x,y+hop);ctx.fillStyle='#7f4de8';roundRect(-18,-36,36,42,12);ctx.fill();ctx.fillStyle='#fff4f7';ctx.beginPath();ctx.arc(0,-48,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8cca';ctx.beginPath();ctx.arc(-16,-72,13,0,Math.PI*2);ctx.arc(16,-72,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#33203a';ctx.fillRect(-9,-53,5,7);ctx.fillRect(6,-53,5,7);ctx.fillStyle='#ff5faf';ctx.fillRect(-17,-42,34,8);ctx.fillStyle='#ffd54f';ctx.fillRect(-4,-38,8,30);ctx.strokeStyle='#6b3b83';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-30,-20);ctx.lineTo(30,-20);ctx.stroke();ctx.fillStyle='#ff3e9f';ctx.fillRect(-36,-26,10,12);ctx.fillRect(26,-26,10,12);ctx.restore()}
function drawClayLetter(char,x,y,scale,color,angle=0,note='♪'){ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.sin(pulse*3+x)*.03);ctx.scale(scale,scale);ctx.shadowColor=color;ctx.shadowBlur=14;ctx.fillStyle='#fff8f3';roundRect(-28,-30,56,60,15);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=color;ctx.lineWidth=4;ctx.stroke();ctx.fillStyle=color;ctx.font="18px 'Press Start 2P'";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(note,0,-10);ctx.fillStyle='#3d2442';ctx.font="28px 'Press Start 2P'";ctx.fillText(char,0,14);ctx.restore()}
function draw(){ctx.clearRect(0,0,cw,ch);drawBackground();const timerWidth=Math.max((timeLeft/gameConfig.gameDuration)*cw,0);ctx.fillStyle='#fff8';ctx.fillRect(0,0,cw,9);const tg=ctx.createLinearGradient(0,0,Math.max(timerWidth,1),0);tg.addColorStop(0,'#8effc1');tg.addColorStop(.5,'#ffdf61');tg.addColorStop(1,'#ff3e9f');ctx.fillStyle=tg;ctx.fillRect(0,0,timerWidth,9);drawHero();ctx.font="22px 'Press Start 2P'";ctx.textAlign='center';ctx.textBaseline='middle';const gap=Math.min(48,Math.max(38,cw/(currentWord.length+2))),startX=(cw-gap*(currentWord.length-1))/2;for(let i=0;i<currentWord.length;i++){const x=startX+i*gap,y=ch*.31;ctx.fillStyle='#fff8f3';roundRect(x-20,y-24,40,48,10);ctx.fill();ctx.strokeStyle='#c985d6';ctx.lineWidth=3;ctx.stroke();const selIdx=selectedIndices[i];if(selIdx!==undefined){const l=scrambledLetters[selIdx];drawClayLetter(l.char,x,y,.58,l.color,0,l.note)}}scrambledLetters.forEach((l,idx)=>{if(!selectedIndices.includes(idx))drawClayLetter(l.char,l.x,l.y,l.scale,l.color,l.angle,l.note)});particles.forEach(p=>{ctx.globalAlpha=p.life;if(p.shape===0)drawPixelHeart(p.x,p.y,p.size*1.6,p.color);else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}});ctx.globalAlpha=1}
function loop(time){try{const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;update(dt);draw();requestAnimationFrame(loop)}catch(e){console.error(e);requestAnimationFrame(loop)}}
function initGame(){score=0;level=1;timeLeft=gameConfig.gameDuration||60;particles=[];selectedIndices=[];document.getElementById('score-val').innerText=score;document.getElementById('level-val').innerText=level;hideReactionCards();nextWord();setState('PLAYING')}
const ro=new ResizeObserver(entries=>{for(const entry of entries){const {width,height}=entry.contentRect;dpr=window.devicePixelRatio||1;cw=width;ch=height;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!initialized){const configData=JSON.parse(configEl.textContent);Object.keys(configData).forEach(k=>gameConfig[k]=configData[k].value);initAudio();initGame();initialized=true;requestAnimationFrame(loop)}else layoutLetters()}});
window.addEventListener('DOMContentLoaded',()=>{ro.observe(canvas);canvas.addEventListener('pointerdown',handleInput,{passive:true});canvas.addEventListener('touchstart',handleInput,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else syncBgm()});document.getElementById('restart-btn').addEventListener('click',e=>{e.stopPropagation();unlockAudio();playSfx('sfx_restart',0);initGame()})});
window.updateGameConfig=(key,val)=>{gameConfig[key]=val;if(key==='gameDuration')timeLeft=val};
window.__gameDebug={getState:()=>({gameState,score,level,timeLeft,currentWord,letters:scrambledLetters.map(l=>({char:l.char,x:l.x,y:l.y})),selected:selectedIndices.slice()}),forceGameOver:()=>setState('GAMEOVER'),tapLetter:(i)=>{const l=scrambledLetters[i];handleInput({type:'pointerdown',clientX:l.x,clientY:l.y})}};
})();
</script>
</body>
</html>
