<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal Bounce: Dimension Dash</title>
    <!-- [agent-note][stage4] remapped-font: title/buttons -> Audiowide | ui/body -> Exo 2 via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme: #39ff7b;
            --theme-dark: #129b53;
            --theme-soft: #b8ffd1;
            --sky-top: #071827;
            --sky-bottom: #100821;
            --field: #103a38;
            --field-shade: #092626;
            --glass: rgba(4, 18, 26, 0.74);
            --glass-border: rgba(105, 255, 155, 0.46);
            --text-main: #f2fff8;
            --glow: rgba(57, 255, 123, 0.38);
            --hero-gold: #ffd44f;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 8%, rgba(57, 255, 123, 0.26), transparent 34%),
                radial-gradient(circle at 78% 18%, rgba(0, 219, 255, 0.14), transparent 26%),
                linear-gradient(180deg, var(--sky-top) 0%, #11224d 38%, #123a4c 66%, var(--field) 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(ellipse at 15% 18%, rgba(57, 255, 123, 0.2), transparent 18%),
                radial-gradient(circle at 80% 20%, rgba(0, 219, 255, 0.14), transparent 20%),
                radial-gradient(ellipse at 50% 82%, rgba(180, 71, 255, 0.12), transparent 22%);
            animation: portalFogDrift 18s ease-in-out infinite alternate;
        }
        body::after {
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
                radial-gradient(circle at 22px 18px, rgba(57,255,123,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 8px 34px, rgba(0,219,255,0.14) 0 1px, transparent 2px);
            background-size: 28px 28px, 28px 28px, 56px 56px, 56px 56px;
            opacity: 0.28;
            mix-blend-mode: soft-light;
            animation: garageGridScan 12s linear infinite;
        }
        canvas { display: block; touch-action: none; }

        #ui-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }
        .glass {
            position: relative;
            background:
                linear-gradient(90deg, rgba(57,255,123,0.08), transparent 18%, transparent 82%, rgba(0,219,255,0.08)),
                linear-gradient(180deg, rgba(25, 19, 58, 0.78), rgba(12, 10, 32, 0.84));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            box-shadow: 0 8px 28px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.08), 0 0 18px rgba(57,255,123,0.12);
            overflow: hidden;
        }
        .glass::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.12), transparent 36%),
                repeating-linear-gradient(90deg, transparent 0 12px, rgba(184,255,209,0.055) 12px 14px);
            pointer-events: none;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at top, rgba(57, 255, 123, 0.16), transparent 34%),
                radial-gradient(circle at 50% 48%, rgba(0, 219, 255, 0.08), transparent 30%),
                linear-gradient(180deg, rgba(4, 15, 24, 0.22), rgba(4, 8, 18, 0.86));
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .title {
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.6rem, 10vw, 5.4rem);
            letter-spacing: 0.08em;
            color: #effff5;
            margin: 0;
            text-shadow: 0 0 18px rgba(57, 255, 123, 0.42), 0 6px 0 var(--theme-dark), 0 16px 30px rgba(0,0,0,0.45);
            animation: float 3s ease-in-out infinite;
        }
        .title-accent {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(98,255,156,0.38);
            background: rgba(12, 10, 32, 0.5);
            box-shadow: 0 0 20px rgba(140, 239, 255, 0.14), inset 0 0 18px rgba(57,255,123,0.08);
            font-size: 0.82rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .title-accent::before {
            content: "";
            width: 18px;
            height: 10px;
            border: 2px solid var(--theme);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(57,255,123,0.55), inset 0 0 8px rgba(57,255,123,0.25);
            transform: rotate(-18deg);
        }
        .btn-main {
            position: relative;
            margin-top: 28px;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.12em;
            color: #06361d;
            padding: 16px 36px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 28% 20%, rgba(255,255,255,0.95), transparent 22%),
                linear-gradient(180deg, #b8ffd1, #62ff9c 48%, var(--theme));
            border: 3px solid rgba(255,255,255,0.92);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(57,255,123,0.32), 0 0 20px rgba(0, 219, 255, 0.18);
            font-weight: 700;
            transition: transform 0.1s, filter 0.1s;
            overflow: hidden;
        }
        .btn-main::after {
            content: "";
            position: absolute;
            inset: -40%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.22), transparent 34%);
            animation: portalSpin 4s linear infinite;
            pointer-events: none;
        }
        .btn-main:active { transform: scale(0.95); filter: brightness(1.08); }
        .intro-copy {
            max-width: 340px;
            margin-top: 18px;
            line-height: 1.35;
            font-size: 0.98rem;
            font-weight: 600;
            color: rgba(248, 251, 255, 0.92);
            text-shadow: 0 2px 12px rgba(0,0,0,0.36);
        }
        .feedback-gif {
            position: absolute;
            right: 16px;
            top: 80px;
            width: clamp(82px, 18vw, 132px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 22px;
            border: 2px solid rgba(255,255,255,0.24);
            background: rgba(10, 8, 24, 0.55);
            box-shadow: 0 12px 28px rgba(0,0,0,0.26);

            pointer-events: none;
            z-index: 35;

        .feedback-gif.active {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }
        .feedback-gif.collect {
            top: 148px;
            right: 20px;
            width: clamp(70px, 16vw, 116px);
            border-radius: 20px;
        }

        /* HUD */
        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud { padding: 16px; display: flex; justify-content: space-between; width: 100%; box-sizing: border-box; align-items: flex-start; }
        .pill {
            padding: 8px 18px;
            border-radius: 999px;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 0.06em;

            width: 24px;
            height: 24px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 28%, rgba(255,255,255,0.9), transparent 23%),

            color: #6b3900;
            box-shadow: 0 0 12px rgba(255, 214, 106, 0.3), 0 0 0 2px rgba(57,255,123,0.16);
        }

        /* Controls */
        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        #controls-area { position: absolute; bottom: 20px; left: 0; width: 100%; height: 180px; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }

        /* Joystick */
        #joystick-zone { width: 140px; height: 140px; position: relative; pointer-events: auto; }
        #joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                repeating-radial-gradient(circle, rgba(57,255,123,0.12) 0 2px, transparent 2px 16px),
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 45%, rgba(8, 8, 24, 0.62) 100%);
            border: 3px solid rgba(178, 236, 255, 0.34);
            box-sizing: border-box;
            box-shadow: inset 0 0 30px rgba(140, 239, 255, 0.08), 0 10px 24px rgba(0,0,0,0.22), 0 0 20px rgba(57,255,123,0.1);
        }
        #joystick-knob {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #effff5, #75ff9a 62%, #18d46f 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 16px rgba(0,0,0,0.28), 0 0 12px rgba(255,255,255,0.18);
            pointer-events: none;
        }

        /* Action Button */
        #btn-action {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(180deg, #e7fff0, #39ff7b);
            border: 6px solid rgba(255,255,255,0.92);
            color: #06361d;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 rgba(4,62,28,0.24), 0 0 22px rgba(57, 255, 123, 0.24);
            pointer-events: auto;
            transition: transform 0.1s, background 0.1s, box-shadow 0.1s;
        }
        #btn-action:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(4,62,28,0.24), 0 0 18px rgba(57, 255, 123, 0.2); background: linear-gradient(180deg, #f4fff8, #62ff9c); }

        @media (max-width: 520px) {
            #hud { padding: 12px; }
            .pill { font-size: 0.82rem; padding: 7px 14px; }
            #btn-sound { width: 46px !important; height: 46px !important; font-size: 1.2rem !important; }
            #controls-area { padding: 0 18px; bottom: 14px; height: 164px; }
            #joystick-zone { width: 124px; height: 124px; }
            #btn-action { width: 88px; height: 88px; font-size: 0.82rem; }
            .intro-copy { font-size: 0.9rem; max-width: 300px; }
            .feedback-gif { top: 74px; right: 10px; width: 88px; }
            .feedback-gif.collect { top: 136px; right: 14px; width: 78px; }
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes portalSpin { to { transform: rotate(1turn); } }
        @keyframes garageGridScan { to { background-position: 28px 56px, 56px 28px, 56px 56px, -56px 56px; } }
        @keyframes portalFogDrift {
            0% { transform: translate3d(-1.5%, -1%, 0) scale(1.02); filter: hue-rotate(0deg); }
            100% { transform: translate3d(1.5%, 1%, 0) scale(1.05); filter: hue-rotate(14deg); }
        }
    </style>
</head>

<script>
/**
 * LEGENDARY CASUAL ENGINE v3.0
 * Feature: Explicit Multi-touch Controls
 */
const CONFIG = {
    heroSpeed: 12,
    themeColor: '#39ff7b',
    gameTitle: 'Portal Bounce: Dimension Dash'
};

/* --- 1. CONFIG PROTOCOL --- */
window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 12, "min": 5, "max": 25 },
    "themeColor": { "type": "color", "label": "Portal Color", "value": "#39ff7b" },
    "gameTitle": { "type": "text", "label": "Game Title", "value": "Portal Bounce: Dimension Dash" }
};
window.gameConfig = CONFIG;
window.updateGameConfig = (key, val) => {
    if(CONFIG[key] !== undefined) CONFIG[key] = val;
    if(key === 'themeColor') {
        document.documentElement.style.setProperty('--theme', val);
    }
    if(key === 'gameTitle') {
        document.getElementById('ui-title').innerText = val;
        document.title = val;
    }
};

/* --- 2. AUDIO SYSTEM --- */
class AudioController {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.muted = false;
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.bgm = document.getElementById('bgm_main');
        this.soundBtn = document.getElementById('btn-sound');
        
        this.soundBtn.onclick = (e) => {
            e.stopPropagation();
            this.toggleMute();
        };
    }

    ensureContext() {
        if(!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if(Ctx) this.ctx = new Ctx();
        }
        return this.ctx;
    }

    toggleMute() {
        this.muted = !this.muted;
        this.soundBtn.innerText = this.muted ? '🔇' : '🔊';
        if(this.bgm) {
            this.bgm.muted = this.muted;
            if(this.muted) {
                this.bgm.pause();
            } else if(this.unlocked) {
                this.startLoop();
            }
        }
        if(this.unlocked) this.play('sfx_ui', 1, 0.35, 80);
    }

    async unlock() {
        const ctx = this.ensureContext();
        if(ctx && ctx.state === 'suspended') {
            try { await ctx.resume(); } catch(e) {}
        }
        this.unlocked = true;
        this.startLoop();
        ['sfx_dash', 'sfx_hit', 'sfx_collect', 'sfx_start', 'sfx_ui'].forEach(id => this.load(id));
    }

    startLoop() {
        if(this.bgm && !this.muted) {
            this.bgm.volume = 0.2;
            this.bgm.play().catch(() => {});
        }
    }

    stopLoop() {
        if(this.bgm) {
            this.bgm.pause();
            this.bgm.currentTime = 0;
        }
    }

    async load(id) {
        const ctx = this.ensureContext();
        const el = document.getElementById(id);
        if(!ctx || !el || !el.src || this.buffers[id]) return;
        try {
            const res = await fetch(el.src);
            const buf = await res.arrayBuffer();
            this.buffers[id] = await ctx.decodeAudioData(buf.slice(0));
        } catch(e) {}
    }

    play(id, pitch=1, vol=1, cooldown=0) {
        if(this.muted || !this.unlocked) return;
        const now = performance.now();
        if(cooldown && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        const ctx = this.ensureContext();
        if(ctx && this.buffers[id]) {
            const src = ctx.createBufferSource();
            src.buffer = this.buffers[id];
            src.playbackRate.value = pitch;
            const gain = ctx.createGain();
            gain.gain.value = vol;
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
            return;
        }

        if(ctx) {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g);
            g.connect(ctx.destination);
            osc.frequency.setValueAtTime(220 * pitch, ctx.currentTime);
            g.gain.setValueAtTime(Math.min(vol * 0.08, 0.12), ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.16);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
        }
    }
}

/* --- 3. INPUT SYSTEM (Fixed Joystick + Button) --- */
class InputSystem {
    constructor(game) {
        this.game = game;
        this.vector = {x:0, y:0};
        this.keys = {};
        
        // Elements
        this.joyZone = document.getElementById('joystick-zone');
        this.joyKnob = document.getElementById('joystick-knob');
        this.btnAction = document.getElementById('btn-action');
        
        // State
        this.stickId = null;
        this.stickCenter = {x:0, y:0};
        
        this.setup();
    }

    setup() {
        // Keyboard
        window.addEventListener('keydown', e => {
            this.keys[e.key] = true;
            if(e.code === 'Space') this.game.dash();
        });
        window.addEventListener('keyup', e => this.keys[e.key] = false);

        // Joystick Logic
        const updateKnob = (x, y) => {
            const maxR = 40; // Max radius within 140px box
            let dx = x - this.stickCenter.x;
            let dy = y - this.stickCenter.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if(dist > maxR) {
                dx = (dx/dist) * maxR;
                dy = (dy/dist) * maxR;
            }
            
            this.joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            this.vector = { x: dx/maxR, y: dy/maxR };
        };

        const resetKnob = () => {
            this.joyKnob.style.transform = `translate(-50%, -50%)`;
            this.vector = {x:0, y:0};
            this.stickId = null;
        };

        // Joystick Events
        this.joyZone.addEventListener('pointerdown', e => {
            e.preventDefault();
            if(this.stickId !== null) return;
            this.stickId = e.pointerId;
            const rect = this.joyZone.getBoundingClientRect();
            this.stickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            updateKnob(e.clientX, e.clientY);
            this.joyZone.setPointerCapture(e.pointerId);
        });

        this.joyZone.addEventListener('pointermove', e => {
            if(e.pointerId !== this.stickId) return;
            e.preventDefault();
            updateKnob(e.clientX, e.clientY);
        });

        const endStick = e => {
            if(e.pointerId === this.stickId) resetKnob();
        };
        this.joyZone.addEventListener('pointerup', endStick);
        this.joyZone.addEventListener('pointercancel', endStick);

        // Action Button
        this.btnAction.addEventListener('pointerdown', e => {
            e.preventDefault();
            this.game.dash();
            // Visual feedback handled by CSS :active
        });
    }

    getMovement() {
        let vx = 0, vy = 0;
        if(this.keys['w'] || this.keys['ArrowUp']) vy = -1;
        if(this.keys['s'] || this.keys['ArrowDown']) vy = 1;
        if(this.keys['a'] || this.keys['ArrowLeft']) vx = -1;
        if(this.keys['d'] || this.keys['ArrowRight']) vx = 1;

        if(vx !== 0 || vy !== 0) {
            const len = Math.sqrt(vx*vx + vy*vy);
            return { x: vx/len, y: vy/len };
        }
        
        return this.vector;
    }
}

/* --- 4. GAME ENGINE --- */
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', {alpha: false});
        this.audio = new AudioController();
        this.input = new InputSystem(this);
        
        this.hero = { x:0, y:0, vx:0, vy:0, scaleX:1, scaleY:1, angle: 0, bob: 0 };
        this.cam = { x:0, y:0 };
        this.entities = [];
        this.particles = [];
        this.score = 0;
        this.running = false;
        
        this.initWorld();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        document.getElementById('btn-start').onclick = () => this.start();
        this.feedbackTimers = { hit: 0, collect: 0 };
        this.lastHitAt = 0;
        this.lastScoreAt = 0;
        document.addEventListener('visibilitychange', () => {
            if(document.hidden) {
                this.audio.stopLoop();
            } else if(this.running && !this.audio.muted) {
                this.audio.startLoop();
            }
        });
        
        this.loop = this.loop.bind(this);
        this.lastTime = performance.now();
        requestAnimationFrame(this.loop);
    }

    initWorld() {
        // Create NPCs
        for(let i=0; i<50; i++) {
            this.entities.push({
                x: (Math.random()-0.5)*2500,
                y: (Math.random()-0.5)*2500,
                r: 15 + Math.random()*15,
                color: ['#39ff7b', '#00dbff', '#b447ff', '#ffd44f'][Math.floor(Math.random()*4)],
                variant: Math.floor(Math.random()*4),
                vx: 0, vy: 0
            });
        }
    }

    async start() {
        if(this.running) return;
        this.running = true;
        await this.audio.unlock();
        this.audio.play('sfx_start', 1, 0.55, 50);
        document.getElementById('start-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('start-screen').style.display = 'none', 300);
    }

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    showGif(type) {
        const el = document.getElementById(type === 'hit' ? 'gif-hit' : 'gif-collect');
        if(!el) return;
        el.classList.add('active');
        this.feedbackTimers[type] = 0.95;
    }

    dash() {
        if(!this.running) return;
        
        // Dash juice
        const move = this.input.getMovement();
        const dx = (move.x === 0 && move.y === 0) ? 1 : move.x;
        const dy = (move.x === 0 && move.y === 0) ? 0 : move.y;
        
        // Normalize
        const len = Math.sqrt(dx*dx + dy*dy);
        const nx = dx/len;
        const ny = dy/len;

        // Apply force
        const force = 800;
        this.hero.vx += nx * force;
        this.hero.vy += ny * force;
        
        // Squash
        this.hero.scaleX = 1.5;
        this.hero.scaleY = 0.6;
        this.hero.angle = Math.atan2(ny, nx);
        
        // SFX
        this.audio.play('sfx_dash', 1.08, 0.55, 120);

        // Particles
        for(let i=0; i<10; i++) {
            this.particles.push({
                x: this.hero.x, y: this.hero.y,
                vx: -nx * Math.random() * 200 + (Math.random()-0.5)*100,
                vy: -ny * Math.random() * 200 + (Math.random()-0.5)*100,
                life: 0.5, size: 5 + Math.random()*5,
                 color: '#62ff9c'
            });
        }
    }

    update(dt) {
        if(!this.running) return;

        this.feedbackTimers.hit = Math.max(0, this.feedbackTimers.hit - dt);
        this.feedbackTimers.collect = Math.max(0, this.feedbackTimers.collect - dt);
        const hitGif = document.getElementById('gif-hit');
        const collectGif = document.getElementById('gif-collect');
        if(hitGif) hitGif.classList.toggle('active', this.feedbackTimers.hit > 0);
        if(collectGif) collectGif.classList.toggle('active', this.feedbackTimers.collect > 0);

        // Hero Movement
        const move = this.input.getMovement();
        const speed = CONFIG.heroSpeed * 60;
        
        this.hero.vx += move.x * speed * dt * 4;
        this.hero.vy += move.y * speed * dt * 4;
        
        // Friction
        this.hero.vx *= 0.92;
        this.hero.vy *= 0.92;
        
        const vel = Math.sqrt(this.hero.vx**2 + this.hero.vy**2);
        this.hero.x += this.hero.vx * dt;
        this.hero.y += this.hero.vy * dt;
        this.hero.bob += dt * (4 + vel * 0.01);

        // Recovery Juice
        this.hero.scaleX += (1 - this.hero.scaleX) * 10 * dt;
        this.hero.scaleY += (1 - this.hero.scaleY) * 10 * dt;
        if(Math.abs(this.hero.scaleX - 1) < 0.01) this.hero.angle = 0;

        // Dust
        if(vel > 100 && Math.random() < 0.3) {
            this.particles.push({
                x: this.hero.x, y: this.hero.y + 15,
                vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                life: 0.8, size: Math.random()*6, color: 'rgba(98,255,156,0.62)'
            });
        }

        // Camera
        this.cam.x += (this.hero.x - this.width/2 - this.cam.x) * 4 * dt;
        this.cam.y += (this.hero.y - this.height/2 - this.cam.y) * 4 * dt;

        // Entities
        this.entities.forEach(e => {
            // Wander
            if(Math.random() < 0.02) {
                e.vx += (Math.random()-0.5)*20;
                e.vy += (Math.random()-0.5)*20;
            }
            e.x += e.vx * dt * 5;
            e.y += e.vy * dt * 5;
            e.vx *= 0.95; e.vy *= 0.95;

            // Collision
            const dx = e.x - this.hero.x;
            const dy = e.y - this.hero.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const minDist = e.r + 25;
            
            if(dist < minDist) {
                const ang = Math.atan2(dy, dx);
                const force = 300;
                e.vx += Math.cos(ang) * force;
                e.vy += Math.sin(ang) * force;
                this.hero.vx -= Math.cos(ang) * force * 0.8;
                this.hero.vy -= Math.sin(ang) * force * 0.8;

                const now = performance.now();
                if(now - this.lastHitAt > 140) {
                    this.lastHitAt = now;
                    this.audio.play('sfx_hit', 1 + Math.random()*0.18, 0.4, 90);
                    this.showGif('hit');
                }
                
                // Score
                if(vel > 200 && now - this.lastScoreAt > 180) {
                    this.lastScoreAt = now;
                    this.score++;
                    document.getElementById('score').innerText = this.score;
                    this.audio.play('sfx_collect', 1.04 + Math.random()*0.12, 0.48, 120);
                    this.showGif('collect');
                    // Hit particles
                    for(let k=0; k<5; k++) {
                        this.particles.push({
                            x: (e.x+this.hero.x)/2, y: (e.y+this.hero.y)/2,
                            vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300,
                            life: 0.4, size: 4, color: '#b8ffd1'
                        });
                    }
                }
            }
        });

        // Particles Update
        for(let i=this.particles.length-1; i>=0; i--) {
            let p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 1.5;
            if(p.life <= 0) this.particles.splice(i, 1);
        }
    }

    draw() {
        const cx = this.cam.x;
        const cy = this.cam.y;

        // Clear
        const skyGradient = this.ctx.createLinearGradient(0, 0, 0, this.height);
        skyGradient.addColorStop(0, '#071827');
        skyGradient.addColorStop(0.42, '#11224d');
        skyGradient.addColorStop(1, '#103a38');
        this.ctx.fillStyle = skyGradient;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // [agent-note][world-design-superprompt] authored-bg: procedural Rick-garage portal field; decorative only, preserve physics/input.
        const nowMs = performance.now();
        for(let i = 0; i < 7; i++) {
            const px = (i * 211 + (nowMs * (0.014 + i * 0.001))) % (this.width + 260) - 130;
            const py = 72 + ((i * 83) % Math.max(this.height * 0.44, 1));
            this.ctx.save();
            this.ctx.translate(px, py);
            this.ctx.rotate(nowMs * 0.00045 + i);
            this.ctx.strokeStyle = i % 2 ? 'rgba(0,219,255,0.2)' : 'rgba(57,255,123,0.26)';
            this.ctx.lineWidth = 4;
            this.ctx.beginPath();
            this.ctx.ellipse(0, 0, 48 + i * 7, 18 + i * 3, 0, 0, Math.PI * 2);
            this.ctx.stroke();
            this.ctx.lineWidth = 1.5;
            this.ctx.strokeStyle = 'rgba(184,255,209,0.18)';
            this.ctx.beginPath();
            this.ctx.ellipse(0, 0, 30 + i * 5, 10 + i * 2, 0.2, 0, Math.PI * 2);
            this.ctx.stroke();
            this.ctx.restore();
        }

        // Decorative garage silhouettes / citadel props remain purely visual and beneath gameplay actors.
        this.ctx.save();
        this.ctx.globalAlpha = 0.28;
        this.ctx.fillStyle = 'rgba(3, 11, 18, 0.72)';
        for(let i = 0; i < 6; i++) {
            const baseX = (i * 173 - (cx * 0.08) + this.width * 0.12) % (this.width + 120) - 60;
            const baseY = this.height * (0.62 + (i % 3) * 0.07);
            this.ctx.beginPath();
            this.ctx.roundRect(baseX, baseY - 52 - (i % 2) * 20, 24 + (i % 3) * 9, 70 + (i % 2) * 24, 7);
            this.ctx.fill();
            this.ctx.fillStyle = i % 2 ? 'rgba(57,255,123,0.22)' : 'rgba(0,219,255,0.18)';
            this.ctx.fillRect(baseX + 6, baseY - 42, 5, 8);
            this.ctx.fillRect(baseX + 16, baseY - 22, 5, 8);
            this.ctx.fillStyle = 'rgba(3, 11, 18, 0.72)';
        }
        this.ctx.restore();

        this.ctx.fillStyle = 'rgba(184, 255, 209, 0.1)';
        for(let i = 0; i < 18; i++) {
            const starX = (i * 137) % this.width;
            const starY = ((i * 97) % Math.max(this.height * 0.55, 1));
            this.ctx.beginPath();
            this.ctx.arc(starX, starY, (i % 3) + 1.5, 0, Math.PI * 2);
            this.ctx.fill();
        }

        // --- LAYER 1: Ground ---
        this.ctx.save();
        this.ctx.translate(-cx, -cy);
        
        const gridSize = 200;
        const startX = Math.floor(cx / gridSize) * gridSize;
        const startY = Math.floor(cy / gridSize) * gridSize;
        
        this.ctx.strokeStyle = 'rgba(98,255,156,0.13)';
        this.ctx.lineWidth = 2;
        this.ctx.fillStyle = 'rgba(0,219,255,0.1)';
        for(let x = startX - gridSize; x < cx + this.width + gridSize; x += gridSize) {
            for(let y = startY - gridSize; y < cy + this.height + gridSize; y += gridSize) {
                if((x+y) % (gridSize*2) === 0) {
                    this.ctx.beginPath();
                    this.ctx.ellipse(x, y, 34, 13, -0.35, 0, Math.PI*2);
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 5, 0, Math.PI*2);
                    this.ctx.fill();
                } else {
                    this.ctx.beginPath();
                    this.ctx.roundRect(x - 16, y - 10, 32, 20, 6);
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.arc(x + 7, y - 2, 4, 0, Math.PI*2);
                    this.ctx.fill();
                }
            }
        }

        // --- ENTITIES ---
        const drawList = [...this.entities, { ...this.hero, isHero: true }];
        drawList.sort((a,b) => a.y - b.y);

        drawList.forEach(e => {
            this.ctx.save();
            this.ctx.translate(e.x, e.y);
            
            // Shadow
            this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
            this.ctx.beginPath();
            this.ctx.ellipse(0, 18, (e.r||25), (e.r||25)*0.4, 0, 0, Math.PI*2);
            this.ctx.fill();

            if(e.isHero) {
                this.ctx.rotate(e.angle);
                this.ctx.scale(e.scaleX, e.scaleY);
                const bob = Math.sin(this.hero.bob || 0) * 2.5;
                this.ctx.save();
                this.ctx.translate(0, bob);
                this.ctx.fillStyle = 'rgba(57, 255, 123, 0.28)';
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 34, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();

                const img = document.getElementById('asset_hero');
                this.ctx.drawImage(img, -28, -28, 56, 56);

                this.ctx.strokeStyle = 'rgba(239,255,245,0.9)';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 31, 0, Math.PI * 2);
                this.ctx.stroke();

                this.ctx.strokeStyle = 'rgba(98,255,156,0.8)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.ellipse(0, 0, 36, 18, 0.25, 0, Math.PI * 2);
                this.ctx.stroke();

                this.ctx.fillStyle = '#39ff7b';
                this.ctx.beginPath();
                this.ctx.arc(-20, -12, 4, 0, Math.PI * 2);
                this.ctx.arc(21, -10, 3.5, 0, Math.PI * 2);
                this.ctx.fill();
            } else {
                this.ctx.fillStyle = e.color;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, e.r, 0, Math.PI*2);
                this.ctx.fill();

                this.ctx.fillStyle = 'rgba(239,255,245,0.22)';
                this.ctx.beginPath();
                this.ctx.arc(-e.r * 0.25, -e.r * 0.3, e.r * 0.35, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.strokeStyle = '#effff5';
                this.ctx.lineWidth = 4;
                this.ctx.stroke();

                this.ctx.strokeStyle = e.variant % 2 ? 'rgba(20,40,52,0.78)' : 'rgba(9,87,44,0.8)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.arc(0, 2, e.r * 0.4, 0.2, Math.PI - 0.2);
                this.ctx.stroke();

                if(e.variant === 1) {
                    this.ctx.strokeStyle = 'rgba(239,255,245,0.72)';
                    this.ctx.beginPath();
                    this.ctx.moveTo(-e.r * 0.65, -e.r * 0.75);
                    this.ctx.lineTo(-e.r * 0.25, -e.r * 1.1);
                    this.ctx.lineTo(0, -e.r * 0.78);
                    this.ctx.lineTo(e.r * 0.28, -e.r * 1.12);
                    this.ctx.lineTo(e.r * 0.64, -e.r * 0.72);
                    this.ctx.stroke();
                } else if(e.variant === 2) {
                    this.ctx.strokeStyle = 'rgba(57,255,123,0.78)';
                    this.ctx.beginPath();
                    this.ctx.ellipse(0, 0, e.r * 1.08, e.r * 0.42, -0.35, 0, Math.PI*2);
                    this.ctx.stroke();
                } else if(e.variant === 3) {
                    this.ctx.strokeStyle = 'rgba(255,212,79,0.78)';
                    this.ctx.lineWidth = 2.5;
                    this.ctx.beginPath();
                    this.ctx.arc(-e.r * 0.32, -e.r * 0.2, e.r * 0.28, 0, Math.PI * 2);
                    this.ctx.arc(e.r * 0.32, -e.r * 0.2, e.r * 0.28, 0, Math.PI * 2);
                    this.ctx.moveTo(-e.r * 0.04, -e.r * 0.2);
                    this.ctx.lineTo(e.r * 0.04, -e.r * 0.2);
                    this.ctx.stroke();
                }

                this.ctx.fillStyle = '#1d1b24';
                this.ctx.beginPath();
                this.ctx.arc(-6, -4, 3, 0, Math.PI*2);
                this.ctx.arc(6, -4, 3, 0, Math.PI*2);
                this.ctx.fill();
            }
            this.ctx.restore();
        });

        // Particles
        this.particles.forEach(p => {
            this.ctx.fillStyle = p.color || '#fff';
            this.ctx.globalAlpha = p.life;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;
        this.ctx.restore();

        // --- LAYER 2: Parallax garage fumes / portal fog ---
        this.ctx.save();
        const parallax = 0.6;
        const cloudOffX = -cx * parallax;
        const cloudOffY = -cy * parallax;
        
        this.ctx.fillStyle = 'rgba(57, 255, 123, 0.12)';
        const cSpace = 500;
        const cStartX = Math.floor(cloudOffX / cSpace) * cSpace;
        const cStartY = Math.floor(cloudOffY / cSpace) * cSpace;

        for(let x = cStartX; x < cloudOffX + this.width + cSpace; x += cSpace) {
            for(let y = cStartY; y < cloudOffY + this.height + cSpace; y += cSpace) {
                if((Math.abs(x*y) % 11) < 3) { 
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 80, 0, Math.PI*2);
                    this.ctx.arc(x+50, y+30, 60, 0, Math.PI*2);
                    this.ctx.fill();
                    this.ctx.strokeStyle = 'rgba(0,219,255,0.12)';
                    this.ctx.lineWidth = 3;
                    this.ctx.beginPath();
                    this.ctx.ellipse(x + 25, y + 12, 105, 34, 0.12, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
            }
        }
        this.ctx.restore();
    }

    loop(t) {
        const dt = Math.min((t - this.lastTime) / 1000, 0.1);
        this.lastTime = t;
        try {
            this.update(dt);
            this.draw();
        } catch(e) { console.error(e); }
        requestAnimationFrame(this.loop);
    }
}

window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
});
</script>
