<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Mutant Homestead: Pressure Harvest</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap");
:root{--ink:#11152b;--night:#16183d;--denim:#203b89;--gold:#ffd447;--cream:#fff2c5;--leaf:#69df77;--danger:#ff5570;--panel:rgba(255,242,197,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152e;color:var(--cream);font-family:Rajdhani,system-ui,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(255,212,71,.34),transparent 22%),linear-gradient(180deg,#273f86 0%,#1b265e 45%,#11152b 100%)}.sky:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(120deg,rgba(255,212,71,.16) 0 8px,transparent 8px 44px),repeating-linear-gradient(60deg,rgba(255,255,255,.06) 0 2px,transparent 2px 32px);animation:drift 18s linear infinite}.sky:after{content:"";position:absolute;left:3vw;right:3vw;bottom:0;height:35vh;background:radial-gradient(ellipse at 20% 100%,rgba(105,223,119,.45),transparent 40%),radial-gradient(ellipse at 75% 100%,rgba(255,212,71,.28),transparent 38%),linear-gradient(180deg,transparent 0%,rgba(57,75,39,.5) 60%,rgba(31,46,25,.95) 100%);clip-path:polygon(0 35%,12% 24%,28% 34%,43% 18%,60% 32%,78% 20%,100% 31%,100% 100%,0 100%)}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-96px)}}#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%) rotate(-1deg);z-index:12;opacity:0;transition:opacity .2s;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:7px 13px;font-family:Bangers,cursive;font-size:clamp(18px,4vw,28px);letter-spacing:.04em;box-shadow:5px 5px 0 rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}#toast.show{opacity:1}.hint{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:10;max-width:min(250px,70vw);font:600 13px Rajdhani,sans-serif;background:rgba(17,21,43,.78);border:2px solid rgba(255,212,71,.7);border-radius:14px;padding:8px 10px;box-shadow:0 8px 20px rgba(0,0,0,.3);pointer-events:none}.burst{position:absolute;left:100%;white-space:nowrap;font-family:Bangers,cursive;font-size:clamp(24px,6vw,48px);letter-spacing:.05em;text-shadow:3px 3px 0 #11152b,0 0 12px rgba(255,212,71,.55);animation:fly linear forwards;z-index:9;pointer-events:none;user-select:none}@keyframes fly{to{transform:translateX(-145vw) rotate(-2deg)}}.reaction{position:fixed;right:10px;width:min(27vw,116px);border:3px solid #11152b;border-radius:16px;background:rgba(255,242,197,.75);box-shadow:5px 5px 0 rgba(0,0,0,.35);opacity:0;transform:scale(.84) translateY(10px) rotate(3deg);transition:opacity .18s,transform .18s;pointer-events:none;z-index:11}.reaction.show{opacity:.95;transform:scale(1) translateY(0) rotate(-2deg)}#comboGif{top:calc(env(safe-area-inset-top) + 80px)}#failGif{bottom:calc(env(safe-area-inset-bottom) + 58px)}
</style>
</head>
<body>
<div class="sky"></div><canvas id="game"></canvas><div id="toast"></div><div id="startHint" class="hint">Tap the plot to wake the barn radio 🔊</div>
<img id="comboGif" class="reaction" alt="chain harvest reaction" src="https://i.giphy.com/1zmG8avB83Uvm.webp" />
<img id="failGif" class="reaction" alt="pressure fail reaction" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" />
<audio id="bgm" preload="auto" loop src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3"></audio>
<audio id="sfxSwap" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_character_01.mp3"></audio>
<audio id="sfxCollect" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3"></audio>
<audio id="sfxCombo" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3"></audio>
<audio id="sfxFail" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3"></audio>
<audio id="sfxGameOver" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"></audio>
<script>
(()=>{"use strict";
const COLS=6,ROWS=8,GAME_SECONDS=60,BASE_MATCH_SCORE=100,SWAP_TIME=150,FALL_TIME=180,SPAWN_TIME=190,CLEAR_TIME=110;
const COMBO_TEXTS=["Barnstorm Bloom!","Cozy Critical!","X-Graft Chain!","Pressure Pick!","Haywire Harvest!","Dome Surge!","Mutant Market!","Golden Row!"];
const CROPS=[{label:"SEED",base:"#ffd447",accent:"#fff6b7",glow:"rgba(255,212,71,.5)",shape:"seed"},{label:"CORN",base:"#77e36f",accent:"#fff070",glow:"rgba(119,227,111,.45)",shape:"corn"},{label:"BERRY",base:"#da5dff",accent:"#ffc9ff",glow:"rgba(218,93,255,.45)",shape:"berry"},{label:"WOOL",base:"#f8f0d8",accent:"#6ad7ff",glow:"rgba(248,240,216,.45)",shape:"wool"},{label:"GEAR",base:"#7aa4ff",accent:"#ffd447",glow:"rgba(122,164,255,.45)",shape:"gear"},{label:"SPROUT",base:"#ff6b71",accent:"#69df77",glow:"rgba(255,107,113,.45)",shape:"sprout"}];
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),toast=document.getElementById("toast"),bgm=document.getElementById("bgm"),startHint=document.getElementById("startHint"),comboGif=document.getElementById("comboGif"),failGif=document.getElementById("failGif");
const sfx={swap:document.getElementById("sfxSwap"),collect:document.getElementById("sfxCollect"),combo:document.getElementById("sfxCombo"),fail:document.getElementById("sfxFail"),gameOver:document.getElementById("sfxGameOver")};
let seed=0xC05EFACE;function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}function randInt(max){return Math.floor(rng()*max)}
let dpr=1,W=0,H=0,boardX=0,boardY=0,tileSize=0,hudH=98,audioCtx=null,sfxReady=false,soundUnlocked=false;
const state={grid:[],selected:null,pointerDownCell:null,score:0,timeLeft:GAME_SECONDS,comboChain:0,lastTs:performance.now(),resolving:false,gameOver:false};
function lerp(a,b,t){return a+(b-a)*t}function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function showToast(msg,ms=900){toast.textContent=msg;toast.classList.add("show");clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove("show"),ms)}
function flashGif(el,ms=1300){if(!el)return;el.classList.add("show");clearTimeout(el._hideTimer);el._hideTimer=setTimeout(()=>el.classList.remove("show"),ms)}
function spawnBurst(text,combo=1){const el=document.createElement("div");el.className="burst";el.textContent=text;const y=Math.floor(lerp(hudH+12,H-64,rng()));const dur=clamp(5000-combo*260+rng()*650,2700,5400);el.style.top=y+"px";el.style.color=combo%2?"#ffd447":"#69df77";el.style.animationDuration=dur+"ms";document.body.appendChild(el);setTimeout(()=>el.remove(),dur+70)}
function playSfx(name,volume=.5){if(!soundUnlocked)return;const base=sfx[name];if(!base)return;try{const i=base.cloneNode();i.volume=volume;i.play().catch(()=>{})}catch(_){}}
function syncBgmState(){if(!soundUnlocked)return;bgm.volume=.18;if(!state.gameOver)bgm.play().catch(()=>{})}
function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();sfxReady=true;if(!soundUnlocked){soundUnlocked=true;syncBgmState();playSfx("swap",.25);startHint.style.display="none"}}catch(_){}}
function blip(freq=640,dur=.08,type="square",gain=.03){if(!sfxReady||!audioCtx)return;const t0=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(gain,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(audioCtx.destination);o.start(t0);o.stop(t0+dur+.01)}
function playEliminateSfx(chain=0){const base=430+chain*45;playSfx("collect",.35);blip(base,.07,"triangle",.025);setTimeout(()=>blip(base*1.45,.06,"sine",.02),45)}function playComboSfx(chain=2){playSfx("combo",.38);[620,770,930+chain*32].forEach((n,i)=>setTimeout(()=>blip(n,.09,"triangle",.024),i*55))}
function makeTile(type,row,col){return{type,row,col,x:boardX+col*tileSize,y:boardY+row*tileSize,scale:1,alpha:1}}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.max(1,Math.min(2,devicePixelRatio||1));canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);hudH=H<620?88:104;const usableH=H-hudH-22;tileSize=Math.floor(Math.min((W-24)/COLS,usableH/ROWS));const bw=tileSize*COLS,bh=tileSize*ROWS;boardX=Math.floor((W-bw)/2);boardY=Math.floor(hudH+(usableH-bh)/2);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=state.grid[r]&&state.grid[r][c];if(t){t.x=boardX+c*tileSize;t.y=boardY+r*tileSize}}}
function randomType(){return randInt(CROPS.length)}
function createsMatchAt(grid,row,col,type){let count=1;for(let c=col-1;c>=0;c--){const t=grid[row][c];if(!t||t.type!==type)break;count++}for(let c=col+1;c<COLS;c++){const t=grid[row][c];if(!t||t.type!==type)break;count++}if(count>=3)return true;count=1;for(let r=row-1;r>=0;r--){const t=grid[r][col];if(!t||t.type!==type)break;count++}for(let r=row+1;r<ROWS;r++){const t=grid[r][col];if(!t||t.type!==type)break;count++}return count>=3}
function initBoard(){state.grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let t;do{t=randomType()}while(createsMatchAt(state.grid,r,c,t));state.grid[r][c]=makeTile(t,r,c)}}
function rr(x,y,w,h,r){const m=Math.min(r,w*.5,h*.5);ctx.beginPath();ctx.moveTo(x+m,y);ctx.arcTo(x+w,y,x+w,y+h,m);ctx.arcTo(x+w,y+h,x,y+h,m);ctx.arcTo(x,y+h,x,y,m);ctx.arcTo(x,y,x+w,y,m);ctx.closePath()}
function drawBackground(){const now=performance.now()*.001;ctx.save();ctx.globalAlpha=.85;for(let i=0;i<9;i++){const x=((i*87+now*18)%(W+120))-60,y=hudH+40+(i%5)*(H-hudH)/5;ctx.strokeStyle=i%2?"rgba(255,212,71,.16)":"rgba(105,223,119,.13)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+26,y-28,x+56,y);ctx.quadraticCurveTo(x+86,y+28,x+112,y);ctx.stroke()}ctx.fillStyle="rgba(255,242,197,.12)";for(let i=0;i<6;i++){const x=(i*71+Math.sin(now+i)*18)%W;ctx.beginPath();ctx.arc(x,hudH+24+i*53,2.5,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawBadge(x,y,w,h,label,value,color){ctx.save();rr(x,y,w,h,10);ctx.fillStyle="rgba(255,242,197,.9)";ctx.fill();ctx.strokeStyle="#11152b";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=color;rr(x+5,y+5,Math.max(12,(w-10)*value),h-10,7);ctx.fill();ctx.fillStyle="#11152b";ctx.textAlign="left";ctx.textBaseline="middle";ctx.font='600 12px Rajdhani, sans-serif';ctx.fillText(label,x+11,y+h*.33);ctx.font='400 27px Bangers, cursive';ctx.fillText(label==="PRESSURE"?Math.ceil(state.timeLeft)+"S":state.score,x+11,y+h*.72);ctx.restore()}
function drawHUD(){const pad=12,barW=W-pad*2;ctx.save();ctx.fillStyle="rgba(17,21,43,.82)";rr(pad,10,barW,hudH-18,18);ctx.fill();ctx.strokeStyle="rgba(255,212,71,.85)";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#fff2c5";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font='400 29px Bangers, cursive';ctx.fillText("MUTANT HOMESTEAD",W/2,28);ctx.font='600 12px Rajdhani, sans-serif';ctx.fillText("swap adjacent crops · match 3+ before the dome blows",W/2,49);const half=(barW-10)/2;drawBadge(pad+7,58,half,34,"HARVEST",clamp((state.score%5000)/5000,.08,1),"#69df77");drawBadge(pad+13+half,58,half,34,"PRESSURE",clamp(state.timeLeft/GAME_SECONDS,0,1),state.timeLeft<15?"#ff5570":"#ffd447");ctx.restore()}
function drawBoardFrame(){const bw=COLS*tileSize,bh=ROWS*tileSize;ctx.save();ctx.shadowColor="rgba(0,0,0,.42)";ctx.shadowBlur=22;rr(boardX-9,boardY-9,bw+18,bh+18,20);ctx.fillStyle="rgba(17,21,43,.75)";ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="#11152b";ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle="rgba(255,212,71,.75)";ctx.lineWidth=2;ctx.stroke();for(let r=1;r<ROWS;r++){const y=boardY+r*tileSize;ctx.strokeStyle="rgba(255,242,197,.14)";ctx.beginPath();ctx.moveTo(boardX,y);ctx.lineTo(boardX+bw,y);ctx.stroke()}for(let c=1;c<COLS;c++){const x=boardX+c*tileSize;ctx.beginPath();ctx.moveTo(x,boardY);ctx.lineTo(x,boardY+bh);ctx.stroke()}ctx.restore()}
function drawXMark(cx,cy,s,color){ctx.save();ctx.strokeStyle=color;ctx.lineCap="round";ctx.lineWidth=Math.max(3,s*.08);ctx.beginPath();ctx.moveTo(cx-s*.22,cy-s*.22);ctx.lineTo(cx+s*.22,cy+s*.22);ctx.moveTo(cx+s*.22,cy-s*.22);ctx.lineTo(cx-s*.22,cy+s*.22);ctx.stroke();ctx.restore()}
function drawCropShape(chip,s){const cx=s*.5,cy=s*.48;ctx.save();ctx.fillStyle=chip.accent;ctx.strokeStyle="#11152b";ctx.lineWidth=Math.max(2,s*.045);if(chip.shape==="seed"){ctx.beginPath();ctx.ellipse(cx,cy,s*.18,s*.29,-.45,0,Math.PI*2);ctx.fill();ctx.stroke();drawXMark(cx,cy,s*.55,"#203b89")}else if(chip.shape==="corn"){for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(cx+i*s*.08,cy,s*.09,s*.28,.08*i,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.fillStyle="#69df77";ctx.beginPath();ctx.ellipse(cx-s*.18,cy+s*.12,s*.11,s*.22,-.75,0,Math.PI*2);ctx.fill();ctx.stroke()}else if(chip.shape==="berry"){for(const p of [[0,-.08],[-.11,.05],[.11,.05],[0,.16]]){ctx.beginPath();ctx.arc(cx+p[0]*s,cy+p[1]*s,s*.095,0,Math.PI*2);ctx.fill();ctx.stroke()}drawXMark(cx,cy,s*.45,"#ffd447")}else if(chip.shape==="wool"){for(let i=0;i<7;i++){const a=i/7*Math.PI*2;ctx.beginPath();ctx.arc(cx+Math.cos(a)*s*.13,cy+Math.sin(a)*s*.1,s*.105,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.fillStyle="#203b89";ctx.fillRect(cx-s*.05,cy+s*.18,s*.1,s*.08)}else if(chip.shape==="gear"){ctx.beginPath();ctx.arc(cx,cy,s*.22,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#11152b";ctx.beginPath();ctx.arc(cx,cy,s*.075,0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.fillRect(cx+Math.cos(a)*s*.26-s*.025,cy+Math.sin(a)*s*.26-s*.025,s*.05,s*.05)}}else{ctx.beginPath();ctx.moveTo(cx,cy-s*.25);ctx.quadraticCurveTo(cx+s*.2,cy-s*.04,cx+s*.05,cy+s*.2);ctx.quadraticCurveTo(cx-s*.2,cy-s*.02,cx,cy-s*.25);ctx.fill();ctx.stroke();ctx.fillStyle="#69df77";ctx.beginPath();ctx.ellipse(cx-s*.12,cy+s*.08,s*.1,s*.18,-.65,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(cx+s*.13,cy+s*.02,s*.1,s*.18,.75,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.restore()}
function drawTile(t){const s=tileSize,inset=4,w=s-inset*2,h=s-inset*2,chip=CROPS[t.type%CROPS.length];ctx.save();ctx.globalAlpha=t.alpha;ctx.translate(t.x+s*.5,t.y+s*.5);ctx.scale(t.scale,t.scale);ctx.translate(-s*.5,-s*.5);const g=ctx.createLinearGradient(0,0,s,s);g.addColorStop(0,"#fff2c5");g.addColorStop(.22,chip.base);g.addColorStop(1,"#182055");ctx.shadowColor=chip.glow;ctx.shadowBlur=14;rr(inset,inset,w,h,Math.max(10,s*.18));ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="#11152b";ctx.lineWidth=Math.max(2,s*.045);ctx.stroke();ctx.fillStyle="rgba(255,255,255,.16)";rr(inset+4,inset+4,w-8,h*.33,8);ctx.fill();drawCropShape(chip,s);ctx.fillStyle="#11152b";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`400 ${Math.max(11,Math.floor(s*.17))}px Bangers, cursive`;ctx.fillText(chip.label,s*.5,s*.82);ctx.restore()}
function drawSelection(){if(!state.selected)return;const{row,col}=state.selected,x=boardX+col*tileSize,y=boardY+row*tileSize;ctx.save();ctx.shadowColor="rgba(255,212,71,.85)";ctx.shadowBlur=13;rr(x+3,y+3,tileSize-6,tileSize-6,12);ctx.strokeStyle="#ffd447";ctx.lineWidth=4;ctx.stroke();drawXMark(x+tileSize*.5,y+tileSize*.5,tileSize*.65,"rgba(255,242,197,.9)");ctx.restore()}
function drawFarmer(){const x=Math.min(W-62,boardX+COLS*tileSize+28),y=Math.max(hudH+22,boardY+22),s=Math.min(46,Math.max(28,tileSize*.62));if(x>W-30)return;ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(255,242,197,.9)";ctx.strokeStyle="#11152b";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,s*.28,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#ffd447";ctx.beginPath();ctx.moveTo(-s*.42,-s*.1);ctx.lineTo(s*.42,-s*.1);ctx.lineTo(s*.24,-s*.34);ctx.lineTo(-s*.24,-s*.34);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#203b89";ctx.fillRect(-s*.23,s*.25,s*.46,s*.44);ctx.strokeRect(-s*.23,s*.25,s*.46,s*.44);ctx.strokeStyle="#69df77";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-s*.42,s*.35);ctx.lineTo(s*.42,s*.05);ctx.stroke();drawXMark(0,s*.47,s*.34,"#ffd447");ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);drawBackground();drawHUD();drawBoardFrame();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=state.grid[r][c];if(t)drawTile(t)}drawSelection();drawFarmer();if(state.gameOver){ctx.save();ctx.fillStyle="rgba(17,21,43,.68)";ctx.fillRect(0,0,W,H);ctx.translate(W/2,H*.44);rr(-Math.min(165,W*.43),-78,Math.min(330,W*.86),164,18);ctx.fillStyle="rgba(255,242,197,.95)";ctx.fill();ctx.strokeStyle="#11152b";ctx.lineWidth=5;ctx.stroke();ctx.fillStyle="#ff5570";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font='400 38px Bangers, cursive';ctx.fillText("DOME BLEW!",0,-34);ctx.fillStyle="#11152b";ctx.font='600 25px Rajdhani, sans-serif';ctx.fillText(`Harvest ${state.score}`,0,10);ctx.font='400 24px Bangers, cursive';ctx.fillText("Tap to reseed",0,50);ctx.restore()}}
function animateTo(tile,toRow,toCol,ms){const fromX=tile.x,fromY=tile.y,toX=boardX+toCol*tileSize,toY=boardY+toRow*tileSize;return new Promise(resolve=>{const st=performance.now();function step(now){const t=clamp((now-st)/ms,0,1),e=t<.5?2*t*t:-1+(4-2*t)*t;tile.x=lerp(fromX,toX,e);tile.y=lerp(fromY,toY,e);if(t<1)requestAnimationFrame(step);else{tile.x=toX;tile.y=toY;tile.row=toRow;tile.col=toCol;resolve()}}requestAnimationFrame(step)})}
function areAdjacent(a,b){return Math.abs(a.row-b.row)+Math.abs(a.col-b.col)===1}
function findMatches(grid){const mark=Array.from({length:ROWS},()=>Array(COLS).fill(false)),groups=[];for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){const cur=grid[r][c];if(!cur){c++;continue}let c2=c+1;while(c2<COLS&&grid[r][c2]&&grid[r][c2].type===cur.type)c2++;const len=c2-c;if(len>=3){const cells=[];for(let k=c;k<c2;k++){mark[r][k]=true;cells.push({row:r,col:k})}groups.push({len,cells,dir:"h"})}c=c2}}for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){const cur=grid[r][c];if(!cur){r++;continue}let r2=r+1;while(r2<ROWS&&grid[r2][c]&&grid[r2][c].type===cur.type)r2++;const len=r2-r;if(len>=3){const cells=[];for(let k=r;k<r2;k++){mark[k][c]=true;cells.push({row:k,col:c})}groups.push({len,cells,dir:"v"})}r=r2}}const cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(mark[r][c])cells.push({row:r,col:c});return{cells,groups}}
function calcScore(groups,chain){let gained=0;for(const g of groups){let mult=1;if(g.len>=5)mult=3;else if(g.len===4)mult=2;gained+=BASE_MATCH_SCORE*g.len*mult}if(chain>1)gained=Math.floor(gained*(1+(chain-1)*.25));return gained}
async function swapCells(a,b,ms=SWAP_TIME){const ta=state.grid[a.row][a.col],tb=state.grid[b.row][b.col];state.grid[a.row][a.col]=tb;state.grid[b.row][b.col]=ta;await Promise.all([animateTo(ta,b.row,b.col,ms),animateTo(tb,a.row,a.col,ms)])}
async function clearMatches(match){const fades=[];for(const cell of match.cells){const t=state.grid[cell.row][cell.col];if(!t)continue;fades.push(new Promise(resolve=>{const st=performance.now();function step(now){const p=clamp((now-st)/CLEAR_TIME,0,1);t.alpha=1-p;t.scale=1-.25*p;if(p<1)requestAnimationFrame(step);else resolve()}requestAnimationFrame(step)}))}await Promise.all(fades);for(const cell of match.cells)state.grid[cell.row][cell.col]=null}
async function collapseBoard(){const moves=[];for(let c=0;c<COLS;c++){let write=ROWS-1;for(let r=ROWS-1;r>=0;r--){const t=state.grid[r][c];if(!t)continue;if(write!==r){state.grid[write][c]=t;state.grid[r][c]=null;moves.push(animateTo(t,write,c,FALL_TIME))}write--}for(let r=write;r>=0;r--){const type=randomType(),t=makeTile(type,r,c);t.y=boardY-(write-r+1)*tileSize-8;state.grid[r][c]=t;moves.push(animateTo(t,r,c,SPAWN_TIME))}}await Promise.all(moves)}
async function resolveBoardFromCurrent(chainStart=1){state.resolving=true;let chain=chainStart;while(true){const match=findMatches(state.grid);if(!match.cells.length)break;const gain=calcScore(match.groups,chain);state.score+=gain;playEliminateSfx(chain-1);if(chain>=2){playComboSfx(chain);flashGif(comboGif,1500);spawnBurst(`${COMBO_TEXTS[randInt(COMBO_TEXTS.length)]} x${chain}`,chain);showToast(`Chain harvest x${chain}! +${gain}`)}else showToast(`+${gain} harvest`);await clearMatches(match);await collapseBoard();chain++}state.resolving=false}
function cellFromPoint(x,y){if(x<boardX||y<boardY)return null;const c=Math.floor((x-boardX)/tileSize),r=Math.floor((y-boardY)/tileSize);if(r<0||r>=ROWS||c<0||c>=COLS)return null;return{row:r,col:c}}
async function trySwap(a,b){if(state.resolving||state.gameOver)return;if(!areAdjacent(a,b))return;state.resolving=true;playSfx("swap",.32);await swapCells(a,b,SWAP_TIME);const match=findMatches(state.grid);if(!match.cells.length){playSfx("fail",.4);flashGif(failGif,1200);playEliminateSfx(0);await swapCells(a,b,SWAP_TIME);showToast("Graft rejected!");state.resolving=false;return}state.resolving=false;await resolveBoardFromCurrent(1)}
function restartGame(){seed=0xC05EFACE;state.score=0;state.timeLeft=GAME_SECONDS;state.resolving=false;state.selected=null;state.pointerDownCell=null;state.gameOver=false;initBoard();syncBgmState();resolveBoardFromCurrent(1).then(()=>{state.resolving=false})}
function onPointerDown(e){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;ensureAudio();if(state.gameOver){restartGame();return}const cell=cellFromPoint(x,y);state.pointerDownCell=cell;if(!cell||state.resolving)return;if(!state.selected)state.selected=cell;else{if(cell.row===state.selected.row&&cell.col===state.selected.col)state.selected=null;else if(areAdjacent(state.selected,cell)){const a=state.selected;state.selected=null;trySwap(a,cell)}else state.selected=cell}}
function onPointerMove(e){if(!state.pointerDownCell||state.resolving||state.gameOver)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,cell=cellFromPoint(x,y);if(!cell)return;const start=state.pointerDownCell;if(areAdjacent(start,cell)){state.pointerDownCell=null;state.selected=null;trySwap(start,cell)}}function onPointerUp(){state.pointerDownCell=null}
function tick(now){const dt=Math.min(.05,(now-state.lastTs)/1000);state.lastTs=now;if(!state.gameOver){state.timeLeft-=dt;if(state.timeLeft<=0){state.timeLeft=0;state.gameOver=true;bgm.pause();playSfx("gameOver",.46);flashGif(failGif,1800);spawnBurst("Dome Blew!",3);showToast("Harvest window closed!")}}render();requestAnimationFrame(tick)}
async function boot(){resize();addEventListener("resize",resize);canvas.addEventListener("pointerdown",onPointerDown,{passive:true});canvas.addEventListener("pointermove",onPointerMove,{passive:true});addEventListener("pointerup",onPointerUp,{passive:true});bgm.volume=.18;initBoard();resolveBoardFromCurrent(1);requestAnimationFrame(t=>{state.lastTs=t;tick(t)})}boot();
})();
</script>
