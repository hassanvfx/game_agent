<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Disco Cat: Mega Party</title>
    <!-- [agent-note][stage3] resolved-font: title -> Bangers, ui/hud -> Exo 2 | catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #110916;
            --bg-mid: #20112d;
            --panel-light: rgba(255, 244, 255, 0.8);
            --panel-dark: rgba(20, 10, 34, 0.88);
            --line-soft: rgba(255, 255, 255, 0.18);
            --line-bright: rgba(255, 255, 255, 0.55);
            --ink: #2f2140;
            --text-strong: #fdf7ff;
            --aqua: #74f6ff;
            --pink: #ff5cd3;
            --gold: #ffd86b;
            --violet: #8d55ff;
            --success: #39d8aa;
        }

        * { box-sizing: border-box; }

        html, body { 
            width: 100%; height: 100%; margin: 0; overflow: hidden; 
            background:
                radial-gradient(circle at top, rgba(255, 93, 211, 0.18), transparent 30%),
                radial-gradient(circle at bottom, rgba(116, 246, 255, 0.16), transparent 25%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Exo 2', system-ui, sans-serif;
            touch-action: none; -webkit-user-select: none; user-select: none; 
            -webkit-tap-highlight-color: transparent;
            color: var(--text-strong);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;
            background:
                linear-gradient(transparent 0 96%, rgba(255,255,255,0.18) 96% 100%),
                linear-gradient(90deg, transparent 0 96%, rgba(255,255,255,0.12) 96% 100%);
            background-size: 100% 18px, 18px 100%;
            mix-blend-mode: screen;
        }

        canvas { display: block; touch-action: none; width: 100%; height: 100%; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .flex-col { flex-direction: column; }
        .flex-grow { flex-grow: 1; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .overflow-hidden { overflow: hidden; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-10 { margin-bottom: 2.5rem; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .rounded-full { border-radius: 999px; }
        .rounded-lg { border-radius: 0.9rem; }
        .rounded-xl { border-radius: 1.1rem; }
        .rounded-2xl { border-radius: 1.5rem; }
        .w-8 { width: 2rem; }
        .h-8 { height: 2rem; }
        .h-14 { height: 3.5rem; }
        .w-10 { width: 2.5rem; }
        .w-64 { width: 16rem; }
        .max-w-md { max-width: 28rem; }
        .z-50 { z-index: 50; }
        .leading-tight { line-height: 1.05; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-wide { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.25em; }
        .uppercase { text-transform: uppercase; }
        .font-black { font-weight: 900; }
        .font-bold { font-weight: 700; }
        .font-medium { font-weight: 500; }
        .font-mono { font-family: 'Bangers', 'Exo 2', system-ui, sans-serif; }
        .text-xl { font-size: 1.25rem; }
        .text-sm { font-size: 0.92rem; }
        .text-xs { font-size: 0.78rem; }
        .text-3xl { font-size: 2rem; }
        .text-4xl { font-size: clamp(2rem, 7vw, 2.6rem); }
        .text-5xl { font-size: clamp(2.4rem, 9vw, 3.4rem); }
        .text-6xl { font-size: clamp(3rem, 10vw, 4.2rem); }
        .text-8xl { font-size: clamp(4rem, 16vw, 5.8rem); }
        .text-[10px] { font-size: 0.68rem; }
        .bg-gray-900 { background: transparent; }
        .bg-white\/60 { background: rgba(255,255,255,0.6); }
        .bg-white\/50 { background: rgba(255,255,255,0.5); }
        .bg-white\/10 { background: rgba(255,255,255,0.1); }
        .bg-black\/50 { background: rgba(0,0,0,0.5); }
        .border { border-width: 1px; border-style: solid; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-4 { border-width: 4px; border-style: solid; }
        .border-white\/10 { border-color: rgba(255,255,255,0.1); }
        .border-white\/20 { border-color: rgba(255,255,255,0.2); }
        .border-white\/30 { border-color: rgba(255,255,255,0.3); }
        .shadow-sm { box-shadow: 0 10px 22px rgba(9, 4, 17, 0.14); }
        .shadow-lg { box-shadow: 0 16px 34px rgba(5, 5, 18, 0.35); }
        .shadow-xl { box-shadow: 0 18px 48px rgba(11, 6, 24, 0.42); }
        .transition { transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease; }
        .transform { transform: translateZ(0); }
        .drop-shadow-sm { filter: drop-shadow(0 6px 18px rgba(255, 92, 211, 0.2)); }
        .safe-area-inset {
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-right: max(1rem, env(safe-area-inset-right));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            padding-left: max(1rem, env(safe-area-inset-left));
        }

        /* Glass UI */
        .glass { 
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 239, 250, 0.7));
            backdrop-filter: blur(14px); 
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line-bright); 
            box-shadow:
                0 12px 32px rgba(13, 6, 26, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.4);
        }
        .glass-dark {
            background:
                linear-gradient(180deg, rgba(33, 18, 48, 0.92), rgba(14, 9, 24, 0.96));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* Buttons */
        .btn-action { 
            transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1), filter 0.1s ease, box-shadow 0.12s ease; 
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.9), rgba(246,232,255,0.72));
            border: 1px solid rgba(255,255,255,0.56);
            box-shadow: 0 10px 22px rgba(18, 8, 32, 0.18);
        }
        .btn-action::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 15%, rgba(255,255,255,0.45) 50%, transparent 85%);
            transform: translateX(-120%);
            transition: transform 0.25s ease;
        }
        .btn-action:active { transform: scale(0.94); filter: brightness(0.95); }
        .btn-action:hover::before { transform: translateX(120%); }
        .btn-action span.emoji { font-size: 1.5rem; line-height: 1; margin-bottom: 2px; filter: drop-shadow(0 2px 4px rgba(255,255,255,0.4)); }
        .btn-action span.label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink); }

        .party-accent {
            background: linear-gradient(180deg, rgba(156, 98, 255, 0.28), rgba(255, 92, 211, 0.22)), linear-gradient(180deg, rgba(255,255,255,0.9), rgba(246,232,255,0.72));
        }

        .selfie-accent {
            background: linear-gradient(180deg, rgba(255, 216, 107, 0.28), rgba(116, 246, 255, 0.22)), linear-gradient(180deg, rgba(255,255,255,0.9), rgba(246,232,255,0.72));

        /* Bars */
        .bar-container { 
            background: rgba(34,18,54,0.18);
            border-radius: 99px; 
            overflow: hidden;
            height: 10px;
            width: 100%;
            flex-grow: 1;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.14);
        }
        .bar-fill { height: 100%; transition: width 0.3s ease-out; }
        .fill-happy { background: linear-gradient(90deg, #ff75cd, #ff42a2); }
        .fill-hunger { background: linear-gradient(90deg, #ffbf62, #ff7a44); }
        .fill-energy { background: linear-gradient(90deg, #72ebff, #5288ff); }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 22px rgba(255,92,211,0.32); }
            50% { box-shadow: 0 0 38px rgba(116,246,255,0.46); }
        }
        .pulse-glow { animation: pulse-glow 2s infinite; }

        /* Layout */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
        }

        .hud-chip {
            color: var(--ink);
            font-weight: 700;
        }

        .day-pill {
            color: white;
            letter-spacing: 0.06em;
        }

        .day-value { color: var(--gold); }

        .hud-label {
            color: rgba(60, 38, 74, 0.78);
            letter-spacing: 0.08em;
        }

        .start-overlay {
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.85), rgba(255,255,255,0.58)),
                linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,225,247,0.42));
        }

        .title-logo {
            font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
            color: transparent;
            background-image: linear-gradient(90deg, #7f5cff, #ff63cf 58%, #74f6ff);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 18px rgba(255,255,255,0.18);
        }

        .title-sub {
            display: inline-block;
            font-size: clamp(1.35rem, 5vw, 1.8rem);
            color: #7a55ff;
        }

        .start-tagline {
            color: #463055;
            border: 1px solid rgba(255,255,255,0.65);
        }

        .primary-cta,
        .restart-cta {
            color: white;
            font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.06em;
            border-radius: 999px;
        }

        .primary-cta {
            background: linear-gradient(135deg, #6b43ff, #ff49c5);
        }

        .restart-cta {
            background: linear-gradient(135deg, #20c997, #34a0ff);
        }

        @media (max-width: 480px) {
            .p-4 { padding: 0.75rem; }
            .h-14 { height: 3.35rem; }
            .text-sm { font-size: 0.84rem; }
            .text-xl { font-size: 1.1rem; }
            .btn-action span.label { font-size: 0.58rem; }
            .control-grid { gap: 0.42rem; }
            .w-64 { width: min(16rem, 82vw); }
        }
    </style>
</head>

<!-- Game Container -->

<script>
// Global Game Namespace to make HTML onclicks work easily
window.game = {};

document.addEventListener('DOMContentLoaded', () => {
    // --- Config & State ---
    const config = {
        catColor: "#F4A261",
        baseDecay: 2.5
    };

    let audioCtx = null;
    let isMuted = false;
    const bgm = document.getElementById('bgm_main');
    const reactionLayer = document.getElementById('reaction-layer');
    const reactionParty = document.getElementById('reaction-party');
    const reactionLove = document.getElementById('reaction-love');
    const mediaAudio = {
        ui: document.getElementById('sfx_ui'),
        collect: document.getElementById('sfx_collect'),
        party: document.getElementById('sfx_party'),
        fail: document.getElementById('sfx_fail')
    };
    if (bgm) bgm.volume = 0.2;
    const mediaAudioCooldown = new Map();
    let reactionTimer = null;
    
    // --- Audio System ---
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = document.getElementById('btn-mute');
        btn.textContent = isMuted ? '🔇' : '🔊';
        if (bgm) bgm.muted = isMuted;
        Object.values(mediaAudio).forEach((audio) => {
            if (audio) audio.muted = isMuted;
        });
    }

    function playMediaSound(key, cooldown = 120) {
        const audio = mediaAudio[key];
        if (!audio || isMuted) return;
        const now = performance.now();
        const lastPlayed = mediaAudioCooldown.get(key) || 0;
        if (now - lastPlayed < cooldown) return;
        mediaAudioCooldown.set(key, now);
        try {
            audio.currentTime = 0;
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
        } catch (error) {}
    }

    function showReaction(type) {
        if (!reactionLayer) return;
        reactionLayer.classList.remove('hidden');
        reactionParty.classList.add('hidden');
        reactionLove.classList.add('hidden');

        if (type === 'party') reactionParty.classList.remove('hidden');
        if (type === 'love') reactionLove.classList.remove('hidden');

        clearTimeout(reactionTimer);
        reactionTimer = setTimeout(() => {
            reactionLayer.classList.add('hidden');
        }, 1800);
    }
    document.getElementById('btn-mute').addEventListener('click', toggleMute);

    function synthSound(type) {
        if (isMuted || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        // Sound profiles
        switch (type) {
            case 'happy': // Major arpeggio
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                break;
            case 'over': // Sad slide
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(50, now + 1.0);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
                osc.start(now);
                osc.stop(now + 1.0);
                break;
            case 'laser': // Pew
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
                break;
            case 'shutter': // Click
                const noise = audioCtx.createBufferSource();
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for(let i=0; i<data.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                const noiseGain = audioCtx.createGain();
                noise.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noiseGain.gain.setValueAtTime(0.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                noise.start(now);
                break;
            case 'thud': // Box sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
                break;
            case 'sip': // Water
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
                break;
            case 'purr': // Low rumble
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(30, now);
                // AM modulation for purr effect
                const lfo = audioCtx.createOscillator();
                lfo.frequency.value = 25;
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 500;
                lfo.connect(lfoGain.gain);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 1.5);
                osc.start(now);
                osc.stop(now + 1.5);
                break;
            default: // Generic blip
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
        }
    }

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let lastTime = 0;
    let gameState = 'START';
    let score = 0;
    let dayTimer = 0;

    let stats = { happy: 100, hunger: 100, energy: 100 };
    
    let cat = {
        x: 0, y: 0,
        targetX: 0, // For laser chasing
        scaleX: 1, scaleY: 1,
        targetScaleX: 1, targetScaleY: 1,
        rotation: 0,
        yOffset: 0,
        blinkTimer: 0,
        isBlinking: false,
        tailAngle: 0,
        state: 'IDLE', 
        stateTimer: 0,
        face: 'NORMAL' // NORMAL, HAPPY, SLEEP, DIZZY, COOL
    };

    let particles = [];
    let messages = [];
    let flashOpacity = 0; // For selfie

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = document.body.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cat.x = rect.width / 2;
        cat.y = rect.height / 2; 
        cat.targetX = cat.x;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Actions ---
    window.game.action = function(action) {
        initAudio();
        if (gameState !== 'PLAY') return;

        // Interrupt sleep check
        if (cat.state === 'SLEEPING' && action !== 'NAP') {
            cat.state = 'IDLE';
            spawnMessage(cat.x, cat.y - 120, "Woke up!");
        }

        switch(action) {
            case 'FEED':
                if (stats.hunger >= 100) { playMediaSound('ui'); spawnMessage(cat.x, cat.y-120, "Full!"); return; }
                cat.state = 'EATING'; cat.stateTimer = 1.5;
                stats.hunger = Math.min(100, stats.hunger + 30);
                spawnParticles(cat.x, cat.y + 20, 'crumb');
                synthSound('happy');
                playMediaSound('collect');
                spawnMessage(cat.x, cat.y-120, "Yum!");
                break;

            case 'TREAT':
                cat.state = 'EATING'; cat.stateTimer = 0.8;
                stats.happy = Math.min(100, stats.happy + 15);
                stats.hunger = Math.min(100, stats.hunger + 5);
                spawnParticles(cat.x, cat.y, 'heart');
                synthSound('happy');
                playMediaSound('collect');
                showReaction('love');
                spawnMessage(cat.x, cat.y-120, "Tasty!");
                break;

            case 'WATER':
                cat.state = 'DRINKING'; cat.stateTimer = 1.5;
                stats.hunger = Math.min(100, stats.hunger + 5);
                stats.energy = Math.min(100, stats.energy + 5);
                spawnParticles(cat.x, cat.y + 20, 'bubble');
                synthSound('sip');
                spawnMessage(cat.x, cat.y-120, "Slurp");
                break;

            case 'PLAY':
                if (stats.energy < 10) { playMediaSound('ui'); spawnMessage(cat.x, cat.y-120, "Tired..."); return; }
                cat.state = 'PLAYING'; cat.stateTimer = 2.0;
                stats.happy = Math.min(100, stats.happy + 20);
                stats.energy -= 15;
                stats.hunger -= 5;
                synthSound('happy');
                spawnMessage(cat.x, cat.y-120, "Fun!");
                break;

            case 'LASER':
                if (stats.energy < 15) { playMediaSound('ui'); spawnMessage(cat.x, cat.y-120, "Too tired..."); return; }
                cat.state = 'LASER'; cat.stateTimer = 3.0;
                stats.happy = Math.min(100, stats.happy + 30);
                stats.energy -= 20;
                stats.hunger -= 10;
                synthSound('laser');
                spawnMessage(cat.x, cat.y-120, "Get it!");
                break;

            case 'BOX':
                cat.state = 'BOX'; cat.stateTimer = 4.0;
                stats.happy = Math.min(100, stats.happy + 10);
                synthSound('thud');
                spawnMessage(cat.x, cat.y-120, "If fits...");
                break;

            case 'CLEAN':
                cat.state = 'CLEANING'; cat.stateTimer = 2.0;
                stats.happy += 10;
                spawnParticles(cat.x, cat.y, 'bubble');
                synthSound('sip');
                spawnMessage(cat.x, cat.y-120, "Sparkle");
                break;

            case 'PET':
                cat.state = 'LOVED'; cat.stateTimer = 1.5;
                stats.happy = Math.min(100, stats.happy + 10);
                spawnParticles(cat.x, cat.y - 50, 'heart');
                synthSound('purr');
                spawnMessage(cat.x, cat.y-120, "Purr...");
                break;

            case 'BRUSH':
                cat.state = 'LOVED'; cat.stateTimer = 2.5;
                stats.happy = Math.min(100, stats.happy + 15);
                spawnParticles(cat.x, cat.y, 'sparkle');
                synthSound('purr');
                spawnMessage(cat.x, cat.y-120, "Soft!");
                break;

            case 'NAP':
                cat.state = 'SLEEPING';
                synthSound('happy');
                spawnMessage(cat.x, cat.y-120, "Zzz...");
                break;

            case 'PARTY':
                if (stats.energy < 20) { playMediaSound('ui'); spawnMessage(cat.x, cat.y-120, "No energy!"); return; }
                cat.state = 'PARTY'; cat.stateTimer = 5.0;
                stats.happy = 100;
                stats.energy -= 30;
                stats.hunger -= 15;
                synthSound('happy');
                playMediaSound('party');
                showReaction('party');
                spawnMessage(cat.x, cat.y-150, "DISCO TIME!");
                break;

            case 'SELFIE':
                flashOpacity = 1.0;
                stats.happy += 5;
                synthSound('shutter');
                spawnMessage(cat.x, cat.y-120, "Cheese!");
                break;
        }
    };

    // Touch Cat
    canvas.addEventListener('pointerdown', (e) => {
        initAudio();
        if (gameState !== 'PLAY') return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left);
        const y = (e.clientY - rect.top);
        
        // Simple hit test
        const dx = x - cat.x;
        const dy = y - (cat.y - 40);
        if (Math.sqrt(dx*dx + dy*dy) < 100) {
            window.game.action('PET');
        }
    });

    // --- Logic Loop ---
    function update(dt) {
        if (gameState !== 'PLAY') return;

        // Stats Decay
        const decay = config.baseDecay * dt;
        if (cat.state === 'SLEEPING') {
            stats.energy = Math.min(100, stats.energy + decay * 5);
            stats.hunger -= decay * 0.5;
            stats.happy -= decay * 0.1;
        } else if (cat.state === 'PARTY') {
            // Party doesn't decay happy, but drains energy fast
        } else {
            stats.energy -= decay;
            stats.hunger -= decay * 1.5;
            stats.happy -= decay;
        }

        if (stats.hunger <= 0 || stats.happy <= 0) gameOver();

        // Score
        dayTimer += dt;
        if (dayTimer > 5) {
            score++;
            dayTimer = 0;
            document.getElementById('day-counter').innerText = score;
        }

        // Cat Logic
        cat.rotation = 0;
        cat.yOffset = 0;
        cat.face = 'NORMAL';
        const canvasWidth = canvas.width / window.devicePixelRatio;

        if (cat.stateTimer > 0) {
            cat.stateTimer -= dt;
            if (cat.stateTimer <= 0) {
                cat.state = 'IDLE';
                cat.targetX = canvasWidth / 2;
            }
        }

        // State Behaviors
        if (cat.state === 'PARTY') {
            const beat = Date.now() / 80;
            cat.rotation = Math.sin(beat) * 0.2;
            cat.targetScaleX = 1 + Math.sin(beat) * 0.1;
            cat.targetScaleY = 1 - Math.sin(beat) * 0.1;
            cat.face = 'COOL';
            if (Math.random() < 0.1) spawnParticles(Math.random()*canvasWidth, Math.random()*canvas.height, 'sparkle');
        } 
        else if (cat.state === 'LASER') {
            // Move randomly
            if (Math.random() < 0.05) {
                cat.targetX = Math.random() * (canvasWidth - 100) + 50;
                synthSound('laser');
            }
            // Lerp x
            cat.x += (cat.targetX - cat.x) * 5 * dt;
            cat.face = 'HAPPY';
        }
        else if (cat.state === 'BOX') {
            cat.targetScaleY = 0.6; // Squish into box
            cat.face = 'NORMAL';
        }
        else if (cat.state === 'PLAYING') {
            const jump = Math.abs(Math.sin(Date.now() / 150));
            cat.yOffset = -jump * 60;
            cat.targetScaleX = 1 - jump * 0.2;
            cat.targetScaleY = 1 + jump * 0.2;
            cat.face = 'HAPPY';
        }
        else if (cat.state === 'LOVED') {
            cat.face = 'HAPPY';
            cat.targetScaleX = 1.05;
            cat.targetScaleY = 0.95;
        }
        else if (cat.state === 'SLEEPING') {
            cat.face = 'SLEEP';
            cat.targetScaleY = 0.9;
            cat.targetScaleX = 1.1;
            if (Math.random() < 0.02) spawnParticles(cat.x + 30, cat.y - 50, 'zzz');
        }
        else {
            // IDLE
            cat.x += (canvasWidth/2 - cat.x) * 2 * dt; // Return to center
            const breath = Math.sin(Date.now() / 500) * 0.03;
            cat.targetScaleY = 1 + breath;
            cat.targetScaleX = 1 - breath;
        }

        // Physics
        cat.scaleX += (cat.targetScaleX - cat.scaleX) * 10 * dt;
        cat.scaleY += (cat.targetScaleY - cat.scaleY) * 10 * dt;

        // Blink
        cat.blinkTimer -= dt;
        if (cat.blinkTimer <= 0) {
            cat.isBlinking = !cat.isBlinking;
            cat.blinkTimer = cat.isBlinking ? 0.15 : Math.random() * 3 + 2;
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt;
            if (p.type === 'bubble') p.vy -= 0.1;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Messages
        for (let i = messages.length - 1; i >= 0; i--) {
            let m = messages[i];
            m.y += m.vy * dt * 60;
            m.life -= dt;
            if (m.life <= 0) messages.splice(i, 1);
        }

        // Flash
        if (flashOpacity > 0) flashOpacity -= dt * 2;

        // UI
        document.getElementById('bar-happy').style.width = stats.happy + '%';
        document.getElementById('bar-hunger').style.width = stats.hunger + '%';
        document.getElementById('bar-energy').style.width = stats.energy + '%';
    }

    function spawnParticles(x, y, type) {
        const count = type === 'sparkle' ? 5 : 3;
        for(let i=0; i<count; i++) {
            particles.push({
                x: x + (Math.random()-0.5)*60, 
                y: y + (Math.random()-0.5)*60,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 1) * 5 - 2,
                life: 1.0,
                type: type,
                scale: Math.random() * 0.5 + 0.5
            });
        }
    }

    function spawnMessage(x, y, text) {
        messages.push({ x: x, y: y, text: text, life: 1.0, vy: -2 });
    }

    // --- Draw Loop ---
    function draw() {
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        const time = Date.now();

        // Background
        let gradient;
        if (cat.state === 'PARTY') {
            const hue = (time / 5) % 360;
            gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, `hsl(${hue}, 80%, 40%)`);
            gradient.addColorStop(1, `hsl(${(hue+180)%360}, 80%, 20%)`);
        } else {
            gradient = ctx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, '#2a2a3a');
            gradient.addColorStop(1, '#1a1a20');
        }
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);

        // Floor Spotlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.ellipse(w/2, h/2 + 120, 150, 40, 0, 0, Math.PI*2);
        ctx.fill();

        // Laser Dot
        if (cat.state === 'LASER') {
            ctx.fillStyle = 'red';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'red';
            ctx.beginPath();
            ctx.arc(cat.targetX, cat.y + 60, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Draw Cat
        ctx.save();
        ctx.translate(cat.x, cat.y + cat.yOffset);
        ctx.rotate(cat.rotation);
        ctx.scale(cat.scaleX, cat.scaleY);

        // Tail
        ctx.save();
        ctx.translate(0, 20);
        ctx.rotate(Math.sin(time/300)*0.5);
        ctx.beginPath();
        ctx.moveTo(40, 0);
        ctx.quadraticCurveTo(70, -20, 50, -60);
        ctx.lineWidth = 15;
        ctx.lineCap = 'round';
        ctx.strokeStyle = config.catColor;
        ctx.stroke();
        ctx.restore();

        // Body
        ctx.fillStyle = config.catColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, 60, 50, 0, 0, Math.PI * 2);
        ctx.fill();

        // Box Overlay (Bottom half)
        if (cat.state === 'BOX') {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-70, 0, 140, 60);
            ctx.fillStyle = '#A0522D';
            ctx.fillRect(-70, 0, 140, 10); // Rim
                ctx.font = '700 12px Exo 2';
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillText("📦", -10, 35);
        }

        // Ears
        ctx.fillStyle = config.catColor;
        ctx.beginPath();
        ctx.moveTo(-40, -30); ctx.lineTo(-55, -70); ctx.lineTo(-15, -40); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(40, -30); ctx.lineTo(55, -70); ctx.lineTo(15, -40); ctx.fill();

        // Face
        ctx.fillStyle = '#333';
        
        // Eyes
        if (cat.face === 'SLEEP' || cat.isBlinking) {
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#333';
            ctx.beginPath(); ctx.moveTo(-25, -5); ctx.lineTo(-15, -5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(15, -5); ctx.lineTo(25, -5); ctx.stroke();
        } else if (cat.face === 'HAPPY') {
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';
            ctx.beginPath(); ctx.arc(-20, -5, 6, Math.PI, 0); ctx.stroke();
            ctx.beginPath(); ctx.arc(20, -5, 6, Math.PI, 0); ctx.stroke();
        } else if (cat.face === 'COOL') {
            // Sunglasses
            ctx.fillStyle = 'black';
            ctx.fillRect(-35, -15, 30, 15);
            ctx.fillRect(5, -15, 30, 15);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-5, -10); ctx.lineTo(5, -10); ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(-20, -5, 6, 0, Math.PI*2);
            ctx.arc(20, -5, 6, 0, Math.PI*2);
            ctx.fill();
        }

        // Mouth
        if (cat.state !== 'BOX') { // Hide mouth if deep in box? Nah keep it
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(-5, 5); ctx.lineTo(0, 10); ctx.lineTo(5, 5);
            ctx.stroke();
        }

        // Whiskers
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(45, -5); ctx.lineTo(75, -10);
        ctx.moveTo(45, 5); ctx.lineTo(75, 10);
        ctx.moveTo(-45, -5); ctx.lineTo(-75, -10);
        ctx.moveTo(-45, 5); ctx.lineTo(-75, 10);
        ctx.stroke();

        ctx.restore();

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.scale(p.scale, p.scale);
            
            if (p.type === 'heart') {
                ctx.fillStyle = '#FF6B6B';
                ctx.font = "700 20px Exo 2";
                ctx.fillText("♥", 0, 0);
            } else if (p.type === 'zzz') {
                ctx.fillStyle = '#FFF';
                ctx.font = "700 20px Exo 2";
                ctx.fillText("z", 0, 0);
            } else if (p.type === 'sparkle') {
                ctx.fillStyle = '#FFD700';
                ctx.font = "700 20px Exo 2";
                ctx.fillText("✨", 0, 0);
            } else if (p.type === 'crumb') {
                ctx.fillStyle = '#D4A373';
                ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
            } else if (p.type === 'bubble') {
                ctx.strokeStyle = 'cyan';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.stroke();
            }
            ctx.restore();
            ctx.globalAlpha = 1;
        });

        // Messages
        ctx.font = "700 24px Bangers";
        ctx.textAlign = "center";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.fillStyle = "#333";
        messages.forEach(m => {
            ctx.globalAlpha = Math.max(0, m.life);
            ctx.strokeText(m.text, m.x, m.y);
            ctx.fillText(m.text, m.x, m.y);
            ctx.globalAlpha = 1;
        });

        // Flash
        if (flashOpacity > 0) {
            ctx.fillStyle = `rgba(255,255,255,${flashOpacity})`;
            ctx.fillRect(0, 0, w, h);
        }
    }

    function gameOver() {
        gameState = 'OVER';
        synthSound('over');
        playMediaSound('fail', 0);
        if (bgm) bgm.pause();
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('controls').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('final-score').innerText = score;
    }

    function resetGame() {
        initAudio();
        stats = { happy: 100, hunger: 100, energy: 100 };
        score = 0;
        dayTimer = 0;
        cat.state = 'IDLE';
        cat.targetX = canvas.width / window.devicePixelRatio / 2;
        cat.x = cat.targetX;
        messages = [];
        particles = [];
        gameState = 'PLAY';
        
        document.getElementById('day-counter').innerText = "0";
        reactionLayer.classList.add('hidden');
        playMediaSound('ui');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('controls').classList.remove('hidden');
        document.getElementById('hud').classList.remove('hidden');
        
        if (bgm && !isMuted) bgm.play().catch(e => {});
    }

    // --- Loop ---
    function loop(timestamp) {
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        update(Math.min(dt, 0.1));
        draw();
        requestAnimationFrame(loop);
    }

    // --- Wiring ---
    document.getElementById('start-btn').addEventListener('click', resetGame);
    document.getElementById('restart-btn').addEventListener('click', resetGame);
    requestAnimationFrame(loop);
});
</script>
