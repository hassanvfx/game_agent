<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snack Sort Sprint</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #201546;
            --bg-mid: #2d1f60;
            --bg-bottom: #0f0f2d;
            --panel: rgba(34, 22, 77, 0.86);
            --panel-strong: rgba(78, 51, 170, 0.92);
            --panel-border: #fff3b0;
            --text-main: #f8f7ff;
            --text-dim: #d7d9ff;
            --accent-gold: #ffd54f;
            --accent-cyan: #68e5ff;
            --accent-pink: #ff6bb7;
            --accent-red: #ff5b45;
            --shadow-deep: rgba(10, 8, 36, 0.58);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #45349a 0%, transparent 34%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
            touch-action: manipulation;
            font-family: 'Rajdhani', sans-serif;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 213, 79, 0.18) 0 0.45rem, transparent 0.5rem),
                radial-gradient(circle at 80% 20%, rgba(104, 229, 255, 0.18) 0 0.35rem, transparent 0.4rem),
                radial-gradient(circle at 28% 78%, rgba(255, 107, 183, 0.14) 0 0.3rem, transparent 0.34rem),
                radial-gradient(circle at 70% 68%, rgba(255, 255, 255, 0.16) 0 0.22rem, transparent 0.26rem);
            background-size: 220px 220px, 260px 260px, 240px 240px, 180px 180px;
            mix-blend-mode: screen;
            opacity: 0.8;
        }

        body::after {
            background:
                linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 12%, transparent 24%),
                linear-gradient(transparent 0%, rgba(255,255,255,0.04) 10%, transparent 20%);
            background-size: 160px 100%, 100% 120px;
            opacity: 0.22;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        #game-container::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at center top, rgba(255, 213, 79, 0.18), transparent 35%),
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 28%, transparent 72%, rgba(12,11,34,0.28));
            z-index: 1;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .clay-text {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(24, 12, 58, 0.75), 0 0 16px rgba(104, 229, 255, 0.25);
            letter-spacing: 0.08em;
        }

        .hud-label {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .clay-panel {
            background: linear-gradient(180deg, rgba(95, 66, 201, 0.98), rgba(35, 24, 80, 0.96));
            border-radius: 22px;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.28),
                0 12px 24px var(--shadow-deep),
                0 0 0 2px rgba(255,255,255,0.16);
            border: 3px solid var(--panel-border);
            color: var(--text-main);
            backdrop-filter: blur(8px);
        }

        .clay-btn {
            background: linear-gradient(180deg, #ff8d53, #ff5b45);
            border-radius: 18px;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.35),
                0 8px 16px rgba(83, 18, 11, 0.45),
                0 0 18px rgba(255, 91, 69, 0.25);
            border: 3px solid #fff1ba;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.12s;
        }

        .clay-btn:hover,
        .clay-btn:focus-visible {
            filter: brightness(1.04);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.42),
                0 10px 18px rgba(83, 18, 11, 0.5),
                0 0 20px rgba(255, 213, 79, 0.38);
        }

        .clay-btn:active {
            transform: translateY(4px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.25),
                0 3px 8px rgba(83, 18, 11, 0.38);
        }

        #hud {
            position: relative;
            z-index: 3;
        }

        .hud-chip {
            min-width: 0;
            padding: 0.75rem 1rem;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(41, 28, 96, 0.92), rgba(28, 18, 63, 0.96));
            border: 2px solid rgba(255, 243, 176, 0.85);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.2),
                0 10px 18px rgba(8, 6, 28, 0.35);
            backdrop-filter: blur(8px);
        }

        .score-block {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.35rem 0.25rem;
        }

        .score-caption {
            color: var(--accent-cyan);
            font-size: 0.85rem;
            line-height: 1;
        }

        .score-value {
            color: var(--text-main);
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            line-height: 1;
        }

        .next-pick-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.05rem;
            color: var(--text-main);
        }

        .next-pick-label {
            color: var(--accent-gold);
            font-size: 0.8rem;
            line-height: 1;
        }

        .next-pick-value {
            color: var(--accent-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.1rem, 3vw, 1.45rem);
            line-height: 1;
            letter-spacing: 0.08em;
            text-shadow: 0 0 12px rgba(255, 107, 183, 0.35);
        }

        #timer-bar-container {
            border-radius: 999px;
            background: rgba(19, 15, 44, 0.82);
            box-shadow:
                inset 0 3px 8px rgba(0,0,0,0.35),
                0 8px 18px rgba(8, 6, 28, 0.28);
            border: 2px solid rgba(255, 243, 176, 0.82);
            overflow: hidden;
            backdrop-filter: blur(6px);
        }

        #timer-bar {
            background: linear-gradient(90deg, #68e5ff, #54b7ff);
            border-radius: 999px;
            transition: width 0.1s linear, background-color 0.3s;
            box-shadow: inset 0 2px 8px rgba(255,255,255,0.25), 0 0 18px rgba(104, 229, 255, 0.3);
        }

        .timer-readout {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #fef7d2;
            text-shadow: 0 1px 0 rgba(0,0,0,0.35);
        }

        #game-over-screen {
            z-index: 4;
            background:
                radial-gradient(circle at center, rgba(88, 53, 203, 0.22), rgba(7, 7, 20, 0.78)),
                rgba(3, 4, 15, 0.5);
        }

        .game-over-card {
            position: relative;
            overflow: hidden;
        }

        .game-over-card::before {
            content: '✨';
            position: absolute;
            top: 0.85rem;
            right: 1rem;
            font-size: 1.4rem;
            filter: drop-shadow(0 0 10px rgba(255, 213, 79, 0.45));
        }

        .game-over-subtext {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            text-shadow: none;
        }

        #feedback-strip {
            position: absolute;
            right: 0.8rem;
            bottom: 1rem;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.65rem;
            pointer-events: none;
        }

        .feedback-gif {
            width: clamp(74px, 16vw, 110px);
            height: clamp(74px, 16vw, 110px);
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 243, 176, 0.8);
            box-shadow: 0 10px 22px rgba(5, 4, 20, 0.4);
            background: rgba(21, 17, 44, 0.7);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-gif.is-visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            border-color: rgba(255, 107, 107, 0.85);
        }

        @media (max-width: 640px) {
            #hud {
                padding: 0.85rem;
                gap: 0.55rem;
            }

            #hud > .flex {
                gap: 0.65rem;
            }

            .hud-chip {
                padding: 0.65rem 0.8rem;
                border-radius: 18px;
            }

            .score-caption,
            .next-pick-label {
                font-size: 0.72rem;
            }

            .score-value {
                font-size: clamp(1.3rem, 6vw, 1.75rem);
            }

            .next-pick-value {
                font-size: clamp(0.95rem, 4.8vw, 1.2rem);
            }

            .clay-text.text-5xl {
                font-size: 2.2rem;
            }

            .clay-text.text-2xl {
                font-size: 1.2rem;
            }

            #feedback-strip {
                right: 0.6rem;
                bottom: 0.7rem;
                gap: 0.45rem;
            }

            .feedback-gif {
                width: 72px;
                height: 72px;
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>

<div id="game-container" class="select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between">
        
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, styling-only refresh -->
        <div id="hud" class="w-full p-4 flex flex-col items-center gap-2 transition-opacity duration-300">
            <div class="flex justify-between w-full max-w-md items-center gap-3">
                <div class="score-block">
                    <div class="hud-label score-caption">Sorted</div>
                    <div class="clay-text score-value"><span id="score-val">0</span></div>
                </div>
                <div class="hud-chip next-pick-card">
                    <div class="hud-label next-pick-label">Next Pick</div>
                    <div id="target-name" class="next-pick-value">COLA</div>
                </div>
            </div>
            <div id="timer-bar-container" class="w-full max-w-md h-6 relative mt-1.5">
                <div id="timer-bar" class="h-full w-full"></div>
                <div class="timer-readout absolute inset-0 flex items-center justify-center text-sm">7.0s</div>
            </div>
        </div>

        <div id="game-over-screen" class="hidden absolute inset-0 backdrop-blur-md pointer-events-auto flex items-center justify-center">
            <div class="clay-panel game-over-card p-8 flex flex-col items-center text-center max-w-xs w-full mx-4">
                <h1 class="clay-text text-5xl mb-2 text-[#ffd54f]">SHIFT OVER!</h1>
                <p class="game-over-subtext text-2xl mb-6">SORTED: <span id="final-score">0</span></p>
                <button id="restart-btn" class="clay-btn clay-text text-2xl py-3 px-8 w-full cursor-pointer pointer-events-auto">RUN AGAIN</button>
            </div>
        </div>

        <div id="feedback-strip" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: success/fail reactions -> catalogs/gifs.json -->
            <img id="success-gif" class="feedback-gif" alt="success reaction" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" loading="lazy" decoding="async">
            <img id="fail-gif" class="feedback-gif fail" alt="fail reaction" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" loading="lazy" decoding="async">
        </div>
    </div>
</div>

<!-- [agent-note][stage3] resolved-audio: gameplay loop + pickup/fail/game-over/ui -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_bonus" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
<audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<script id="game-config" type="application/x-game-config">
{
    "playerSpeed": { "type": "number", "label": "Player Speed", "value": 12, "min": 5, "max": 20 },
    "baseItemSpeed": { "type": "number", "label": "Item Speed", "value": 250, "min": 100, "max": 500 },
    "maxTime": { "type": "number", "label": "Time Limit (s)", "value": 7, "min": 5, "max": 15 }
}
</script>

<script>
const AudioSys = {
    ctx: null,
    unlocked: false,
    bgm: document.getElementById('bgm_main'),
    sfx: {
        collect: document.getElementById('sfx_collect'),
        bonus: document.getElementById('sfx_bonus'),
        fail: document.getElementById('sfx_fail'),
        warning: document.getElementById('sfx_warning'),
        gameover: document.getElementById('sfx_gameover'),
        restart: document.getElementById('sfx_restart')
    },
    lastPlayAt: {},
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.bgm) this.bgm.volume = 0.2;
        if (this.sfx.collect) this.sfx.collect.volume = 0.45;
        if (this.sfx.bonus) this.sfx.bonus.volume = 0.3;
        if (this.sfx.fail) this.sfx.fail.volume = 0.45;
        if (this.sfx.warning) this.sfx.warning.volume = 0.35;
        if (this.sfx.gameover) this.sfx.gameover.volume = 0.45;
        if (this.sfx.restart) this.sfx.restart.volume = 0.4;
    },
    unlock() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        if (!this.unlocked) this.unlocked = true;
        this.playLoop();
    },
    playLoop() {
        if (!this.bgm || !this.unlocked) return;
        this.bgm.muted = false;
        this.bgm.play().catch(() => {});
    },
    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    },
    pauseLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
    },
    safePlay(key, debounceMs = 120) {
        const audio = this.sfx[key];
        if (!audio || !this.unlocked) return;
        const now = performance.now();
        if (this.lastPlayAt[key] && now - this.lastPlayAt[key] < debounceMs) return;
        this.lastPlayAt[key] = now;
        try {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (e) {}
    },
    sfxCatch() {
        this.safePlay('collect', 90);
        this.safePlay('bonus', 140);
    },
    sfxWrong() {
        this.safePlay('fail', 120);
        this.safePlay('warning', 220);
    },
    sfxDeath() {
        this.pauseLoop();
        this.safePlay('gameover', 300);
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(260, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.55);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.55);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.55);
        } catch(e) {}
    },
    sfxRestart() {
        this.safePlay('restart', 150);
        this.playLoop();
    }
};

const feedbackEls = {
    success: document.getElementById('success-gif'),
    fail: document.getElementById('fail-gif')
};
let feedbackTimers = { success: null, fail: null };

function showFeedback(type, duration = 900) {
    const el = feedbackEls[type];
    if (!el) return;
    el.classList.add('is-visible');
    clearTimeout(feedbackTimers[type]);
    feedbackTimers[type] = setTimeout(() => {
        el.classList.remove('is-visible');
    }, duration);
}

function vibrate(style = 'light') {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
    });
}

let config = {};
function parseConfig() {
    try {
        const raw = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfigDefs = raw;
        for (let k in raw) config[k] = raw[k].value;
        window.gameConfig = config;
    } catch(e) { config = { playerSpeed: 12, baseItemSpeed: 250, maxTime: 7 }; }
}
window.updateGameConfig = (key, val) => { if(config[key] !== undefined) config[key] = val; };

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
let initialized = false, lastTime = 0, gameState = 'INIT';

let player = { x: 0, y: 0, targetX: 0, r: 25, w: 60, h: 40, walkCycle: 0 };
let machine = { y: 0, targetY: 0, jawOpen: 0, treadOffset: 0 };
let items = [], particles = [], aisleLines = [];
let score = 0, timeLeft = 7.0, targetItemType = 0, spawnTimer = 0, screenShake = 0, flashAlpha = 0, scrollSpeed = 300;
let floorOffset = 0;

function roundRect(ctx, x, y, width, height, radius) {
    if (typeof ctx.roundRect === 'function') { ctx.roundRect(x, y, width, height, radius); } 
    else {
        ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y); ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius); ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height); ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius); ctx.quadraticCurveTo(x, y, x + radius, y);
    }
}

const ITEM_TYPES = [
    { id: 0, name: 'COLA', color: '#E60000', draw: (ctx, x, y, r) => {
        ctx.fillStyle = '#E60000'; ctx.beginPath(); roundRect(ctx, x-r*0.6, y-r, r*1.2, r*2, r*0.2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FFF'; ctx.fillRect(x-r*0.6, y-r*0.2, r*1.2, r*0.4);
        ctx.fillStyle = '#CCC'; ctx.beginPath(); ctx.ellipse(x, y-r, r*0.5, r*0.15, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }},
    { id: 1, name: 'CHEETOS', color: '#FF7F00', draw: (ctx, x, y, r) => {
        ctx.fillStyle = '#FF7F00'; ctx.beginPath(); roundRect(ctx, x-r*0.8, y-r*1.1, r*1.6, r*2.2, r*0.1); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-r*0.8, y-r*1.1); ctx.lineTo(x-r*0.4, y-r*1.3); ctx.lineTo(x, y-r*1.1); ctx.lineTo(x+r*0.4, y-r*1.3); ctx.lineTo(x+r*0.8, y-r*1.1); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-r*0.8, y+r*1.1); ctx.lineTo(x-r*0.4, y+r*1.3); ctx.lineTo(x, y+r*1.1); ctx.lineTo(x+r*0.4, y+r*1.3); ctx.lineTo(x+r*0.8, y+r*1.1); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.ellipse(x, y, r*0.5, r*0.3, -0.2, 0, Math.PI*2); ctx.fill();
    }},
    { id: 2, name: 'PANDITAS', color: '#FF007F', draw: (ctx, x, y, r) => {
        ctx.fillStyle = '#FF007F'; ctx.beginPath();
        ctx.arc(x, y-r*0.4, r*0.5, 0, Math.PI*2); ctx.arc(x-r*0.4, y-r*0.7, r*0.25, 0, Math.PI*2); ctx.arc(x+r*0.4, y-r*0.7, r*0.25, 0, Math.PI*2);
        ctx.arc(x, y+r*0.4, r*0.6, 0, Math.PI*2); ctx.arc(x-r*0.5, y+r*0.1, r*0.25, 0, Math.PI*2); ctx.arc(x+r*0.5, y+r*0.1, r*0.25, 0, Math.PI*2);
        ctx.arc(x-r*0.4, y+r*0.8, r*0.3, 0, Math.PI*2); ctx.arc(x+r*0.4, y+r*0.8, r*0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }},
    { id: 3, name: 'ICE CREAM', color: '#FFB6C1', draw: (ctx, x, y, r) => {
        ctx.fillStyle = '#D2B48C'; ctx.beginPath(); ctx.moveTo(x-r*0.6, y); ctx.lineTo(x+r*0.6, y); ctx.lineTo(x, y+r*1.2); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FFB6C1'; ctx.beginPath(); ctx.arc(x, y-r*0.2, r*0.7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }},
    { id: 4, name: 'CHIPS', color: '#FFD700', draw: (ctx, x, y, r) => {
        ctx.fillStyle = '#FFD700'; ctx.beginPath(); roundRect(ctx, x-r*0.7, y-r*0.9, r*1.4, r*1.8, r*0.15); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FF6B35'; ctx.beginPath(); ctx.moveTo(x-r*0.7, y-r*0.9); ctx.quadraticCurveTo(x, y-r*1.2, x+r*0.7, y-r*0.9); ctx.lineTo(x+r*0.7, y-r*0.6); ctx.quadraticCurveTo(x, y-r*0.9, x-r*0.7, y-r*0.6); ctx.fill(); ctx.stroke();

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const goScreen = document.getElementById('game-over-screen');
    if (newState === 'PLAYING') { hud.style.opacity = '1'; goScreen.classList.add('hidden'); }
    else if (newState === 'DYING') { hud.style.opacity = '0'; }
    else if (newState === 'GAMEOVER') {
        hud.style.opacity = '0';
        goScreen.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        showFeedback('fail', 1400);
    }
}

function initGame() {
    score = 0; timeLeft = config.maxTime; items = []; particles = []; screenShake = 0; flashAlpha = 0; scrollSpeed = config.baseItemSpeed; floorOffset = 0;
    player.x = cw / 2; player.targetX = cw / 2; player.y = ch - 150; player.walkCycle = 0;
    machine.y = ch + 150; machine.targetY = ch - 40; machine.treadOffset = 0;
    
    aisleLines = [];
    for(let i=0; i<ch+200; i+=150) aisleLines.push(i);
    
    pickNewTarget(); updateHUD(); setState('PLAYING');
    if (initialized) AudioSys.sfxRestart();
    if (!initialized) { initialized = true; AudioSys.init(); requestAnimationFrame(gameLoop); }
}

function pickNewTarget() {
    targetItemType = Math.floor(Math.random() * ITEM_TYPES.length);
    document.getElementById('target-name').innerText = ITEM_TYPES[targetItemType].name;
    document.getElementById('target-name').style.color = ITEM_TYPES[targetItemType].color;
}

function spawnItem() {
    let typeId = Math.random() < 0.4 ? targetItemType : Math.floor(Math.random() * ITEM_TYPES.length);
    let shelfW = cw * 0.15;
    items.push({
        x: Math.random() * (cw - shelfW*2 - 60) + shelfW + 30,
        y: -50, type: typeId, r: 20, rot: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 3
    });
}

function spawnParticles(x, y, color) {
    for(let i=0; i<8; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 400, vy: (Math.random() - 0.5) * 400, life: 1.0, color: color, r: Math.random() * 6 + 4 });
}

function applyPenalty() {
    timeLeft = Math.max(0, timeLeft - 2); screenShake = 15; AudioSys.sfxWrong(); vibrate('medium');
    machine.targetY -= 40; flashAlpha = 0.3; showFeedback('fail', 900);
}

function handleGlobalInput(e) {
    AudioSys.unlock();
    if (gameState === 'GAMEOVER') { if (e.target.id === 'restart-btn') initGame(); return; }
    if (gameState === 'PLAYING') {
        let clientX = e.clientX; if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
        const rect = canvas.getBoundingClientRect();
        player.targetX = clientX - rect.left;
        let shelfW = cw * 0.15;
        player.targetX = Math.max(shelfW + player.w/2 + 10, Math.min(cw - shelfW - player.w/2 - 10, player.targetX));
    }
}

function update(dt) {
    if (gameState === 'PLAYING') {
        timeLeft -= dt;
        if (timeLeft <= 0) { timeLeft = 0; setState('DYING'); AudioSys.sfxDeath(); vibrate('heavy'); screenShake = 30; }
        
        scrollSpeed = config.baseItemSpeed + score * 5;
        player.x += (player.targetX - player.x) * config.playerSpeed * dt;
        if (!isFinite(player.x)) player.x = cw/2;
        player.walkCycle += dt * 15;
        
        spawnTimer -= dt;
        if (spawnTimer <= 0) { spawnItem(); spawnTimer = 0.8 - Math.min(score * 0.02, 0.5); }
        
        machine.targetY = ch - 20 + Math.sin(Date.now() * 0.005) * 10;
        machine.y += (machine.targetY - machine.y) * 5 * dt;
        machine.jawOpen = Math.sin(Date.now() * 0.02) * 0.5 + 0.5;
        machine.treadOffset = (machine.treadOffset + scrollSpeed * dt) % 20;
        
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i]; item.y += scrollSpeed * dt; item.rot += item.rotSpeed * dt;
            let dx = item.x - player.x, dy = item.y - player.y;
            if (Math.sqrt(dx*dx + dy*dy) < item.r + player.r) {
                if (item.type === targetItemType) {
                    score++; timeLeft = config.maxTime; AudioSys.sfxCatch(); vibrate('light');
                    spawnParticles(item.x, item.y, ITEM_TYPES[item.type].color); pickNewTarget();
                    machine.targetY = ch + 50; flashAlpha = -0.3; showFeedback('success', 850);
                } else { applyPenalty(); spawnParticles(item.x, item.y, '#000'); }
                items.splice(i, 1); continue;
            }
            if (item.y > ch + 50) items.splice(i, 1);
        }
        updateHUD();
    } else if (gameState === 'DYING') {
        machine.y -= 800 * dt; machine.jawOpen = 1; screenShake = 20;
        if (machine.y < player.y - 100) setState('GAMEOVER');
    }
    
    if (gameState !== 'GAMEOVER') {
        floorOffset = (floorOffset + scrollSpeed * dt) % 80;
        for(let i=0; i<aisleLines.length; i++) {
            aisleLines[i] += scrollSpeed * dt;
            if (aisleLines[i] > ch + 100) aisleLines[i] -= ch + 200;
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 60);
    if (Math.abs(flashAlpha) > 0) {
        let sign = Math.sign(flashAlpha); flashAlpha -= sign * dt * 2;
        if (sign > 0 && flashAlpha < 0) flashAlpha = 0;
        if (sign < 0 && flashAlpha > 0) flashAlpha = 0;
    }
}

function updateHUD() {
    document.getElementById('score-val').innerText = score;
    const bar = document.getElementById('timer-bar');
    const pct = Math.max(0, timeLeft / config.maxTime) * 100;
    bar.style.width = pct + '%';
    if (pct > 50) bar.style.background = 'linear-gradient(90deg, #68e5ff, #54b7ff)';
    else if (pct > 25) bar.style.background = 'linear-gradient(90deg, #ffe56d, #ffb940)';
    else bar.style.background = 'linear-gradient(90deg, #ff7a59, #ff375f)';
    document.querySelector('#timer-bar-container div:last-child').innerText = timeLeft.toFixed(1) + 's';
}

function draw() {
    const floorGradient = ctx.createLinearGradient(0, 0, 0, ch);
    floorGradient.addColorStop(0, '#31206d');
    floorGradient.addColorStop(0.45, '#1e1f56');
    floorGradient.addColorStop(1, '#0f102b');
    ctx.fillStyle = floorGradient;
    ctx.fillRect(0, 0, cw, ch);

    const glowGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.12, 20, cw * 0.5, ch * 0.12, ch * 0.8);
    glowGradient.addColorStop(0, 'rgba(255, 214, 90, 0.16)');
    glowGradient.addColorStop(0.4, 'rgba(126, 211, 255, 0.08)');
    glowGradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGradient;
    ctx.fillRect(0, 0, cw, ch);

    let tileSize = 80;
    let startY = floorOffset - tileSize;
    for (let y = startY; y < ch; y += tileSize) {
        for (let x = 0; x < cw; x += tileSize) {
            const row = Math.floor((y - startY) / tileSize);
            const col = Math.floor(x / tileSize);
            const neonTile = (row + col) % 2 === 0;
            ctx.fillStyle = neonTile ? '#241a54' : '#1a143e';
            ctx.fillRect(x, y, tileSize, tileSize);
            if (neonTile) {
                ctx.strokeStyle = 'rgba(104,229,255,0.07)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 0.5, y + 0.5, tileSize - 1, tileSize - 1);
            }
        }
    }
    
    ctx.save();
    if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    
    let shelfW = cw * 0.15;
    const shelfGradient = ctx.createLinearGradient(0, 0, shelfW, 0);
    shelfGradient.addColorStop(0, '#3d2b87');
    shelfGradient.addColorStop(1, '#241651');
    ctx.fillStyle = shelfGradient;
    ctx.fillRect(0, 0, shelfW, ch);
    ctx.fillRect(cw - shelfW, 0, shelfW, ch);
    ctx.strokeStyle = '#ffe07a';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(shelfW, 0); ctx.lineTo(shelfW, ch); ctx.moveTo(cw - shelfW, 0); ctx.lineTo(cw - shelfW, ch); ctx.stroke();
    
    const shelfColors = ['#ff5b45', '#68e5ff', '#ffd54f', '#7cf29c', '#ff6bb7', '#9c7bff', '#ff9c43'];
    aisleLines.forEach((y, idx) => {
        if (y > -100 && y < ch + 100) {
            ctx.fillStyle = shelfColors[idx % shelfColors.length];
            roundRect(ctx, 10, y, shelfW - 20, 40, 8); ctx.fill();
            ctx.fillStyle = shelfColors[(idx+1) % shelfColors.length];
            roundRect(ctx, 10, y + 50, shelfW - 20, 30, 8); ctx.fill();
            ctx.fillStyle = shelfColors[(idx+2) % shelfColors.length];
            roundRect(ctx, cw - shelfW + 10, y + 20, shelfW - 20, 40, 8); ctx.fill();
            ctx.fillStyle = shelfColors[(idx+3) % shelfColors.length];
            roundRect(ctx, cw - shelfW + 10, y + 70, shelfW - 20, 30, 8); ctx.fill();
            
            ctx.fillStyle = '#b18dff';
            ctx.fillRect(0, y + 90, shelfW, 10);
            ctx.fillRect(cw - shelfW, y + 120, shelfW, 10);
        }
    });
    
    items.forEach(item => {
        ctx.save(); ctx.translate(item.x, item.y);
        ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.save(); ctx.translate(4, 6); ctx.rotate(item.rot); ITEM_TYPES[item.type].draw(ctx, 0, 0, item.r); ctx.restore();
        ctx.rotate(item.rot); ctx.strokeStyle = '#22163e'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ITEM_TYPES[item.type].draw(ctx, 0, 0, item.r);
        ctx.restore();
    });
    
    if (gameState !== 'GAMEOVER') {
        ctx.save(); ctx.translate(player.x, player.y);
        ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(0, player.h/2 + 40, player.w, 20, 0, 0, Math.PI*2); ctx.fill();
        
        ctx.save(); ctx.translate(0, 40);
        let legSwing = Math.sin(player.walkCycle) * 15;
        ctx.strokeStyle = '#61d9ff'; ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-12, 25 + legSwing); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(12, 25 - legSwing); ctx.stroke();
        ctx.fillStyle = '#2c1d59'; ctx.beginPath(); ctx.ellipse(-12, 25 + legSwing + 4, 8, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(12, 25 - legSwing + 4, 8, 10, 0, 0, Math.PI*2); ctx.fill();
        
        ctx.strokeStyle = '#ffd1a3'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(-18, -15); ctx.lineTo(-28, 5); ctx.lineTo(-20, -25); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(18, -15); ctx.lineTo(28, 5); ctx.lineTo(20, -25); ctx.stroke();
        
        ctx.fillStyle = '#7cf29c'; ctx.strokeStyle = '#22163e'; ctx.lineWidth = 3; ctx.beginPath(); roundRect(ctx, -20, -25, 40, 35, 12); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffd1a3'; ctx.beginPath(); ctx.arc(0, -25, 16, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#4c2f8c'; ctx.beginPath(); ctx.arc(0, -28, 16, Math.PI*0.8, Math.PI*2.2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(-5, -27, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(5, -27, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ff6bb7'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, -21, 5.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
        ctx.fillStyle = '#68e5ff';
        ctx.beginPath(); ctx.arc(0, -41, 5.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, -52); ctx.lineTo(5, -43); ctx.lineTo(-5, -43); ctx.closePath(); ctx.fill();
        ctx.restore();
        
        const cartGradient = ctx.createLinearGradient(-player.w/2, -player.h/2, player.w/2, player.h/2);
        cartGradient.addColorStop(0, '#f9fbff');
        cartGradient.addColorStop(0.55, '#b8f0ff');
        cartGradient.addColorStop(1, '#88b6ff');
        ctx.fillStyle = cartGradient;
        ctx.strokeStyle = '#22163e';
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.beginPath(); roundRect(ctx, -player.w/2, -player.h/2, player.w, player.h, 8); ctx.fill(); ctx.stroke();
        ctx.lineWidth = 2; ctx.beginPath();
        for(let i=-player.w/2 + 10; i<player.w/2; i+=10) { ctx.moveTo(i, -player.h/2); ctx.lineTo(i, player.h/2); }
        for(let i=-player.h/2 + 10; i<player.h/2; i+=10) { ctx.moveTo(-player.w/2, i); ctx.lineTo(player.w/2, i); }
        ctx.strokeStyle = 'rgba(34,22,62,0.45)';
        ctx.stroke();
        ctx.lineWidth = 4; ctx.strokeStyle = '#22163e'; ctx.beginPath(); ctx.moveTo(-player.w/2 + 5, player.h/2); ctx.lineTo(-player.w/2 + 5, player.h/2 + 15); ctx.lineTo(player.w/2 - 5, player.h/2 + 15); ctx.lineTo(player.w/2 - 5, player.h/2); ctx.stroke();
        
        ctx.fillStyle = '#ffd54f'; let wheelSpin = player.walkCycle * 2;
        function drawWheel(wx, wy) {
            ctx.save(); ctx.translate(wx, wy); ctx.rotate(wheelSpin);
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.moveTo(0,-8); ctx.lineTo(0,8); ctx.stroke();
            ctx.restore();
        }
        drawWheel(-player.w/2 + 10, -player.h/2 - 5); drawWheel(player.w/2 - 10, -player.h/2 - 5);

        ctx.shadowColor = 'rgba(255, 213, 79, 0.35)';
        ctx.shadowBlur = 18;
        ctx.strokeStyle = 'rgba(255, 213, 79, 0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -24, 26 + Math.sin(player.walkCycle * 0.5) * 1.2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    
    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.strokeStyle = 'rgba(34,22,62,0.6)'; ctx.lineWidth = 2; ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    });
    ctx.globalAlpha = 1.0;
    
    ctx.save(); ctx.translate(cw/2, machine.y);
    const machineVignette = ctx.createLinearGradient(0, 0, 0, ch);
    machineVignette.addColorStop(0, 'rgba(47, 18, 64, 0.26)');
    machineVignette.addColorStop(1, 'rgba(0, 0, 0, 0.45)');
    ctx.fillStyle = machineVignette;
    ctx.fillRect(-cw/2, 0, cw, ch);

    const machineBody = ctx.createLinearGradient(0, 20, 0, 220);

    machineBody.addColorStop(1, '#27184f');
    ctx.fillStyle = machineBody;

    ctx.save(); ctx.beginPath(); roundRect(ctx, -120, 20, 240, 30, 10); ctx.clip();
    ctx.fillStyle = '#ff6b57'; ctx.fillRect(-120, 20, 240, 30);
    ctx.fillStyle = '#2a1234';
    for(let i=-150; i<150; i+=30) { ctx.beginPath(); ctx.moveTo(i, 20); ctx.lineTo(i+20, 20); ctx.lineTo(i+50, 50); ctx.lineTo(i+30, 50); ctx.fill(); }
    ctx.restore(); ctx.beginPath(); roundRect(ctx, -120, 20, 240, 30, 10); ctx.stroke();
    
    ctx.fillStyle = '#120b22'; let mouthH = 30 + machine.jawOpen * 40; if (gameState === 'DYING') mouthH = 120;

    ctx.fillStyle = '#fff1ba'; ctx.lineJoin = 'round'; ctx.beginPath();

        ctx.moveTo(i, 60); ctx.lineTo(i+15, 60 + (i%60===0?25:15)); ctx.lineTo(i+30, 60);

    }
    ctx.fill(); ctx.stroke();
    
    ctx.fillStyle = '#68e5ff'; ctx.shadowColor = '#68e5ff'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(-50, 0, 18, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(50, 0, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-45, -5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(55, -5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
    
    ctx.restore();
    
    if (flashAlpha !== 0) {
        ctx.fillStyle = flashAlpha > 0 ? `rgba(255,75,43,${flashAlpha})` : `rgba(255,255,255,${-flashAlpha})`;
        ctx.fillRect(0, 0, cw, ch);

}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000; lastTime = timestamp;
    if (dt > 0.05) dt = 0.05;
    try { update(dt); draw(); } catch (e) { console.error("Game Loop Error:", e); }
    requestAnimationFrame(gameLoop);
}

const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect; cw = rect.width; ch = rect.height;
    canvas.width = cw * dpr; canvas.height = ch * dpr; canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!initialized) { initGame(); } 
    else { 
        let shelfW = cw * 0.15;
        player.x = Math.max(shelfW + player.w/2 + 10, Math.min(cw - shelfW - player.w/2 - 10, player.x)); 
        player.y = ch - 150; 
    }
});

window.addEventListener('DOMContentLoaded', () => {
    parseConfig(); ro.observe(canvas);
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('pointerdown', () => AudioSys.sfxRestart(), { passive: true });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) AudioSys.pauseLoop();
        else if (gameState === 'PLAYING') AudioSys.playLoop();
    });
    window.addEventListener('pointermove', (e) => { if (gameState === 'PLAYING' && e.buttons > 0) handleGlobalInput(e); }, { passive: false });
    // [agent-note][stage4] repaired: mobile-cta-input | action: removed global touch suppression so restart and other UI taps keep native activation
});
</script>
