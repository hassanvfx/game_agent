<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Highway Rush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title-display -> Orbitron, ui-body -> Rajdhani, hud-accent -> Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #09111f;
            --sky-bottom: #182a45;
            --road-core: #202b3d;
            --road-edge: #3f5478;
            --road-glow: rgba(72, 198, 255, 0.32);
            --panel-bg: rgba(8, 15, 31, 0.86);
            --panel-border: rgba(120, 201, 255, 0.32);
            --panel-highlight: rgba(255, 255, 255, 0.12);
            --text-main: #eaf6ff;
            --text-soft: #9cb8d5;
            --accent-cyan: #48c6ff;
            --accent-orange: #ff8a3d;
            --accent-gold: #ffd166;
            --accent-violet: #9b7cff;
            --success: #72f2b6;
            --danger: #ff6f7d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(72, 198, 255, 0.16), transparent 34%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 45%, #0d1628 100%);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 209, 102, 0.12), transparent 12%),
                radial-gradient(circle at 80% 16%, rgba(155, 124, 255, 0.14), transparent 14%),
                radial-gradient(circle at 50% 8%, rgba(72, 198, 255, 0.16), transparent 16%);
            opacity: 0.95;
        }
        body::after {
            background:
                linear-gradient(transparent 0 95%, rgba(72, 198, 255, 0.05) 95% 100%),
                linear-gradient(90deg, transparent 0 95%, rgba(72, 198, 255, 0.04) 95% 100%);
            background-size: 100% 28px, 28px 100%;
            opacity: 0.22;
            mix-blend-mode: screen;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-card {
            background:
                linear-gradient(180deg, rgba(19, 32, 56, 0.96), rgba(7, 13, 28, 0.94)),
                var(--panel-bg);
            border-radius: 24px;
            box-shadow:
                0 18px 48px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 var(--panel-highlight),
                0 0 0 1px rgba(72, 198, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            backdrop-filter: blur(16px);
        }
        .ui-card--garage {
            position: relative;
            overflow: hidden;
        }
        .ui-card--garage::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(72, 198, 255, 0.22), transparent 24%),
                radial-gradient(circle at bottom left, rgba(255, 138, 61, 0.18), transparent 26%);
            pointer-events: none;
        }
        .panel-strip {
            background: linear-gradient(180deg, rgba(100, 116, 139, 0.14), rgba(15, 23, 42, 0.2));
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .btn-action {
            background: linear-gradient(135deg, var(--accent-cyan), #2563eb 55%, var(--accent-violet));
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.28), inset 0 1px 0 rgba(255,255,255,0.22);
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        }
        .btn-action:active {
            transform: scale(0.96);
            filter: brightness(1.08);
        }
        .btn-secondary {
            background: rgba(15, 23, 42, 0.56);
            color: var(--text-soft);
            border: 1px solid rgba(148, 163, 184, 0.22);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .btn-secondary.active {
            background: linear-gradient(135deg, rgba(72, 198, 255, 0.2), rgba(37, 99, 235, 0.3));
            color: #f8fdff;
            border-color: rgba(72, 198, 255, 0.5);
            box-shadow: 0 0 18px rgba(72, 198, 255, 0.16);
        }
        .font-display { font-family: 'Orbitron', system-ui, sans-serif; }
        .font-hud { font-family: 'Press Start 2P', monospace; }
        .menu-badge {
            border: 1px solid rgba(255,255,255,0.12);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .car-chip {
            position: relative;
            overflow: hidden;
        }
        .car-chip::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 45%);
            pointer-events: none;
        }
        .hud-pill {
            background: linear-gradient(180deg, rgba(10, 18, 36, 0.88), rgba(14, 25, 44, 0.75));
            border: 1px solid rgba(72, 198, 255, 0.22);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .difficulty-pill {
            background: rgba(7, 13, 28, 0.52);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }
        .title-glow {
            text-shadow: 0 0 18px rgba(72, 198, 255, 0.28), 0 0 28px rgba(155, 124, 255, 0.22);
        }
        .text-soft { color: var(--text-soft); }
        .text-success { color: var(--success); }
        .text-accent { color: var(--accent-cyan); }
        .text-warm { color: var(--accent-orange); }
        .text-gold { color: var(--accent-gold); }
        .modal-safe {
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        .feedback-gif {
            position: absolute;
            width: min(30vw, 132px);
            height: min(30vw, 132px);
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 12px 28px rgba(0,0,0,0.28);
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 12;
            background: rgba(7, 13, 28, 0.64);
        }
        .feedback-gif.is-visible {
            opacity: 0.96;
            transform: scale(1);
        }
        .feedback-gif--impact {
            right: 14px;
            top: 112px;
        }
        .feedback-gif--unlock {
            left: 14px;
            bottom: 112px;
        }
        .feedback-banner {
            position: absolute;
            left: 50%;
            bottom: 84px;
            transform: translateX(-50%) translateY(10px);
            min-width: 180px;
            max-width: min(78vw, 340px);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(7, 13, 28, 0.84);
            box-shadow: 0 12px 24px rgba(0,0,0,0.32);
            color: #fff;
            text-align: center;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 13;
        }
        .feedback-banner.is-visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .feedback-banner--danger {
            border-color: rgba(255, 111, 125, 0.4);
            box-shadow: 0 0 20px rgba(255, 111, 125, 0.2), 0 12px 24px rgba(0,0,0,0.32);
        }
        .feedback-banner--reward {
            border-color: rgba(114, 242, 182, 0.38);
            box-shadow: 0 0 20px rgba(114, 242, 182, 0.2), 0 12px 24px rgba(0,0,0,0.32);
        }
        .feedback-banner--start {
            border-color: rgba(72, 198, 255, 0.36);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* [agent-note][stage4] repaired: utility-fallbacks | reason: gameplay/menu layout depended on Tailwind runtime classes */
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .top-20 { top: 5rem; }
        .left-0 { left: 0; }
        .left-50 { left: 50%; }
        .w-full { width: 100%; }
        .h-full { width: 100%; height: 100%; min-height: 100dvh; }
        .max-w-md { max-width: 28rem; }
        .max-w-sm { max-width: 24rem; }
        .w-\[90\%\] { width: 90%; }
        .w-\[85\%\] { width: 85%; }
        .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .inline-flex { display: inline-flex; }
        .grid { display: grid; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .space-y-2 > * + * { margin-top: 0.5rem; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .rounded { border-radius: 0.25rem; }
        .rounded-lg { border-radius: 0.75rem; }
        .rounded-xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .border { border-width: 1px; border-style: solid; border-color: rgba(255,255,255,0.18); }
        .border-t { border-top-width: 1px; border-top-style: solid; border-top-color: rgba(255,255,255,0.12); }
        .border-t-4 { border-top-width: 4px; border-top-style: solid; }
        .border-red-500 { border-color: #ef4444; }
        .border-slate-100 { border-color: rgba(241, 245, 249, 0.35); }
        .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
        .border-emerald-200 { border-color: rgba(167, 243, 208, 0.45); }
        .bg-emerald-500\/90 { background: rgba(16, 185, 129, 0.9); }
        .bg-brand-orange { background: var(--accent-orange); }
        .bg-orange-500\/15 { background: rgba(249, 115, 22, 0.15); }
        .bg-slate-900\/60 { background: rgba(15, 23, 42, 0.6); }
        .text-center { text-align: center; }
        .text-white { color: #fff; }
        .text-slate-400 { color: #94a3b8; }
        .text-brand-blue { color: var(--accent-cyan); }
        .text-4xl { font-size: clamp(2.1rem, 6vw, 2.5rem); line-height: 1; }
        .text-xl { font-size: 1.25rem; line-height: 1.4; }
        .text-lg { font-size: 1.125rem; line-height: 1.4; }
        .text-sm { font-size: 0.875rem; line-height: 1.35; }
        .text-xs { font-size: 0.75rem; line-height: 1.35; }
        .text-\[10px\] { font-size: 10px; line-height: 1.3; }
        .font-black { font-weight: 900; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .tracking-tight { letter-spacing: -0.03em; }
        .tracking-wide { letter-spacing: 0.05em; }
        .tracking-widest { letter-spacing: 0.16em; }
        .tracking-\[0\.35em\] { letter-spacing: 0.35em; }
        .shadow-sm { box-shadow: 0 8px 18px rgba(0,0,0,0.18); }
        .shadow-lg { box-shadow: 0 16px 28px rgba(0,0,0,0.26); }
        .shadow-\[0_0_18px_rgba\(255\,138\,61\,0\.22\)\] { box-shadow: 0 0 18px rgba(255,138,61,0.22); }
        .cursor-pointer { cursor: pointer; }
        .transition-all { transition: all 0.15s ease; }
        .transition-transform { transition: transform 0.12s ease; }
        .active\:scale-95:active { transform: scale(0.95); }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }

        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }

        @media (max-width: 640px) {
            .p-6 { padding: 1rem; }
            .p-8 { padding: 1.25rem; }
            .top-20 { top: 4.5rem; }
        }

        /* No scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (max-width: 640px) {
            .feedback-gif--impact {
                top: 94px;
                right: 10px;
            }
            .feedback-gif--unlock {
                left: 10px;
                bottom: 132px;
            }
            .feedback-banner {
                bottom: 72px;
                font-size: 12px;
                max-width: 86vw;
            }
        }
    </style>
</head>
<body>

    <!-- Game Container -->
    <div class="relative w-full h-full overflow-hidden">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-center items-center z-10">
            
            <!-- Main Menu -->
            <div id="start-screen" class="ui-card ui-card--garage modal-safe p-6 w-[90%] max-w-md pointer-events-auto flex flex-col gap-4 overflow-y-auto no-scrollbar">
                <div class="relative text-center mb-2">
                    <div class="menu-badge inline-flex items-center gap-2 rounded-full px-3 py-1 text-[10px] font-bold uppercase tracking-[0.35em] text-soft">
                        <span>🌃</span>
                        Neon freeway garage
                    </div>
                    <h1 class="title-glow text-4xl font-black text-white tracking-tight font-display mt-3">HIGHWAY<br><span class="text-brand-blue">RUSH</span></h1>
                    <p class="text-soft text-xs font-bold uppercase tracking-widest mt-1">Thread the neon lanes. Survive the rush.</p>
                </div>

                <!-- Stats Bar -->
                <div class="panel-strip flex justify-between items-center p-3 rounded-xl">
                        <div class="text-soft text-xs font-bold">TOTAL CASH</div>
                        <div class="text-success text-xl font-hud font-bold">$<span id="menu-cash">0</span></div>
                </div>

                <!-- Car Shop -->
                <div class="panel-strip p-3 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-white font-bold text-sm tracking-wide">GARAGE</span>
                        <span id="car-name" class="text-warm text-xs font-bold uppercase">Racer</span>
                    </div>
                    <div class="grid grid-cols-5 gap-2" id="car-selector">
                        <!-- JS Generated -->
                    </div>
                    <button id="btn-buy-car" class="w-full mt-3 bg-emerald-500/90 text-white py-2 rounded-lg font-bold text-sm shadow-sm active:scale-95 transition-transform">
                        Unlock Next $<span id="cost-car">500</span>
                    </button>
                </div>

                <!-- Upgrades -->
                <div class="panel-strip p-3 rounded-xl border border-slate-100 flex justify-between items-center gap-3">
                    <div>
                        <div class="text-white font-bold text-sm">TURBO ENGINE</div>
                        <div class="text-xs text-soft">Cash Boost: <span id="engine-level-display">x1.0</span></div>
                    </div>
                    <button id="btn-upgrade-engine" class="bg-brand-orange text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-transform">
                        $<span id="cost-engine">250</span>
                    </button>
                </div>

                <!-- Environment -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="track-day" class="btn-secondary active py-3 rounded-xl font-bold text-xs uppercase tracking-wide">Day Sprint</button>
                    <button id="track-sunset" class="btn-secondary py-3 rounded-xl font-bold text-xs uppercase tracking-wide">Sunset Glow</button>
                </div>

                    <button id="start-btn" class="btn-action text-white font-black py-4 rounded-xl shadow-lg text-xl mt-2 tracking-wide font-display">
                        Hit The Road
                    </button>
            </div>

            <!-- Game Over -->
            <div id="game-over-screen" class="hidden ui-card modal-safe p-8 w-[85%] max-w-sm text-center pointer-events-auto border-t-4 border-red-500">
                <h2 class="text-4xl font-black text-white mb-1 font-display title-glow">CRASHED!</h2>
                <p class="text-soft text-sm font-bold uppercase mb-6">Traffic run ended</p>
                
                <div class="panel-strip rounded-xl p-4 mb-6 space-y-2">
                    <div class="flex justify-between text-soft text-sm font-bold">
                        <span>DISTANCE</span>
                        <span class="text-white"><span id="finalScore">0</span>m</span>
                    </div>
                    <div class="flex justify-between text-success text-lg font-bold border-t border-white/10 pt-2 mt-2">
                        <span>EARNINGS</span>
                        <span>+$<span id="earnedCash">0</span></span>
                    </div>
                </div>

                    <button id="restart-btn" class="btn-action w-full text-white font-bold py-4 rounded-xl shadow-lg text-lg font-display">
                        Back To Garage
                    </button>
            </div>

            <!-- HUD -->
            <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start hidden">
                <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
                <div class="hud-pill px-4 py-2 rounded-full shadow-sm">
                    <span class="text-white font-black text-xl font-hud"><span id="score">0</span>m</span>
                </div>
                <div class="hud-pill px-4 py-2 rounded-full shadow-sm border-emerald-200">
                    <span class="text-success font-bold font-hud">$<span id="game-cash">0</span></span>
                </div>
            </div>
            
            <!-- Difficulty Label -->
            <div id="difficulty-hud" class="absolute top-20 w-full text-center hidden pointer-events-none">
                <span id="difficulty-label" class="difficulty-pill text-white px-2 py-1 rounded text-xs font-bold uppercase tracking-widest backdrop-blur-sm">TRAFFIC: LIGHT</span>
            </div>

            <!-- [agent-note][stage3] resolved-gif: crash-feedback + unlock-feedback -> catalogs/gifs.json -->
            <img id="impact-gif" class="feedback-gif feedback-gif--impact" alt="Crash reaction overlay" src="https://i.giphy.com/roB5nN2qNNfhUKcprN.gif">
            <img id="unlock-gif" class="feedback-gif feedback-gif--unlock" alt="Unlock reaction overlay" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.gif">
            <div id="feedback-banner" class="feedback-banner" aria-live="polite"></div>
            <div id="audio-status" class="sr-only" aria-live="polite"></div>
        </div>
    </div>

    <script>
        /*
         * HIGHWAY RUSH - Remake
         * Mobile-first, Touch-only, Single File
         */

        document.addEventListener('DOMContentLoaded', () => {
            
            // --- CONFIG ---
            const CONFIG = {
                laneCount: 4,
                baseSpeed: 12,
                maxSpeed: 30,
                speedInc: 0.005,
                colors: {
                    day: { road: '#64748b', grass: '#86efac', line: '#e2e8f0', shoulder: '#94a3b8', sky: '#bfdbfe' },
                    sunset: { road: '#475569', grass: '#fca5a5', line: '#fbbf24', shoulder: '#64748b', sky: '#fdbabb' }
                }
            };

            const MEDIA = {
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
                sfx: {
                    uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
                    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                    reward: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3',
                    blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3',
                    crash: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3'
                },
                gifs: {
                    impact: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.gif',
                    unlock: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.gif'
                }
            };

            const CARS = [
                { id: 'coupe', name: 'Coupe', color: '#ef4444', price: 0 },
                { id: 'sedan', name: 'Sedan', color: '#3b82f6', price: 800 },
                { id: 'taxi', name: 'Taxi', color: '#facc15', price: 2000 },
                { id: 'police', name: 'Cop', color: '#1e293b', price: 4500 },
                { id: 'super', name: 'Super', color: '#a855f7', price: 8000 }
            ];

            // --- STATE ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const hud = document.getElementById('hud');
            const difficultyHud = document.getElementById('difficulty-hud');
            const impactGif = document.getElementById('impact-gif');
            const unlockGif = document.getElementById('unlock-gif');
            const feedbackBanner = document.getElementById('feedback-banner');
            const audioStatus = document.getElementById('audio-status');

            let width, height;
            let gameActive = false;
            let animationFrameId;
            let feedbackTimer = null;
            let lastMoveSoundAt = 0;
            let lastBlockedAt = 0;
            let lastRewardAt = 0;
            let audioUnlocked = false;

            // Persistent
            let totalCash = 100;
            let unlockedCars = [0];
            let currentCarIdx = 0;
            let engineLevel = 1;

            // Session
            let score = 0;
            let runCash = 0;
            let speed = 0;
            let difficulty = 1;
            let frameCount = 0;
            let roadOffset = 0;

            // Entities
            let player = { x: 0, y: 0, w: 48, h: 80, targetX: 0 };
            let obstacles = [];
            let particles = [];

            // Audio
            const audioCtx = window.AudioContext || window.webkitAudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
            const sounds = {};
            const bgm = new Audio(MEDIA.bgm);
            bgm.loop = true;
            bgm.volume = 0.2;
            bgm.preload = 'auto';

            function createReusableSound(url, volume = 0.55) {
                const audio = new Audio(url);
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            sounds.uiClick = createReusableSound(MEDIA.sfx.uiClick, 0.38);
            sounds.start = createReusableSound(MEDIA.sfx.start, 0.48);
            sounds.reward = createReusableSound(MEDIA.sfx.reward, 0.54);
            sounds.blocked = createReusableSound(MEDIA.sfx.blocked, 0.42);
            sounds.crash = createReusableSound(MEDIA.sfx.crash, 0.58);

            function ensureAudioReady() {
                if (audioUnlocked) return;
                audioUnlocked = true;
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                audioStatus.textContent = 'Audio ready';
            }

            function playSound(key, options = {}) {
                const sound = sounds[key];
                if (!sound) return;
                const now = performance.now();
                const cooldown = options.cooldown ?? 0;
                if (options.bucket === 'move' && now - lastMoveSoundAt < cooldown) return;
                if (options.bucket === 'blocked' && now - lastBlockedAt < cooldown) return;
                if (options.bucket === 'reward' && now - lastRewardAt < cooldown) return;

                if (options.bucket === 'move') lastMoveSoundAt = now;
                if (options.bucket === 'blocked') lastBlockedAt = now;
                if (options.bucket === 'reward') lastRewardAt = now;

                try {
                    sound.pause();
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                } catch (_) {}
            }

            function startBgm() {
                ensureAudioReady();
                bgm.play().catch(() => {});
            }

            function stopBgm() {
                bgm.pause();
                bgm.currentTime = 0;
            }

            function showFeedback({ message, tone = 'start', gif = null, duration = 1400 }) {
                clearTimeout(feedbackTimer);
                feedbackBanner.textContent = message;
                feedbackBanner.className = `feedback-banner feedback-banner--${tone} is-visible`;

                impactGif.classList.remove('is-visible');
                unlockGif.classList.remove('is-visible');
                if (gif === 'impact') impactGif.classList.add('is-visible');
                if (gif === 'unlock') unlockGif.classList.add('is-visible');

                feedbackTimer = setTimeout(() => {
                    feedbackBanner.classList.remove('is-visible');
                    impactGif.classList.remove('is-visible');
                    unlockGif.classList.remove('is-visible');
                }, duration);
            }

            // --- RESIZE & INPUT ---
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                if(!gameActive) resetPlayerPos();
            }
            window.addEventListener('resize', resize);

            function resetPlayerPos() {
                player.x = width / 2 - player.w / 2;
                player.targetX = player.x;
                player.y = height - 180;
            }

            // Input Logic
            function handleInput(clientX) {
                if (!gameActive) return;
                
                const roadW = Math.min(width, 480);
                const roadX = (width - roadW) / 2;
                
                let target = clientX - (player.w / 2);
                
                const margin = 15;
                if (target < roadX + margin) target = roadX + margin;
                if (target > roadX + roadW - player.w - margin) target = roadX + roadW - player.w - margin;
                
                if (Math.abs(target - player.targetX) > 10) {
                    playSound('uiClick', { bucket: 'move', cooldown: 90 });
                }
                player.targetX = target;
            }

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                handleInput(e.touches[0].clientX);
            }, { passive: false });

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                ensureAudioReady();
                handleInput(e.touches[0].clientX);
            }, { passive: false });

            canvas.addEventListener('mousemove', e => {
                if(e.buttons === 1) handleInput(e.clientX);
            });
            canvas.addEventListener('mousedown', e => {
                ensureAudioReady();
                handleInput(e.clientX);
            });

            // --- DRAWING ---
            function drawRoad(theme) {
                const roadW = Math.min(width, 480);
                const roadX = (width - roadW) / 2;

                const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
                skyGrad.addColorStop(0, theme.sky);
                skyGrad.addColorStop(1, theme.grass);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = 'rgba(72, 198, 255, 0.08)';
                ctx.fillRect(0, 0, roadX, height);
                ctx.fillRect(roadX + roadW, 0, width - (roadX + roadW), height);

                const roadGrad = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
                roadGrad.addColorStop(0, theme.shoulder);
                roadGrad.addColorStop(0.08, theme.road);
                roadGrad.addColorStop(0.92, theme.road);
                roadGrad.addColorStop(1, theme.shoulder);
                ctx.fillStyle = roadGrad;
                ctx.fillRect(roadX, 0, roadW, height);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fillRect(roadX - 10, 0, 10, height);
                ctx.fillRect(roadX + roadW, 0, 10, height);
                ctx.fillStyle = 'rgba(72, 198, 255, 0.22)';
                ctx.fillRect(roadX - 4, 0, 4, height);
                ctx.fillRect(roadX + roadW, 0, 4, height);

                ctx.fillStyle = theme.line;
                const laneW = roadW / CONFIG.laneCount;
                
                ctx.globalAlpha = 0.8;
                for (let i = 1; i < CONFIG.laneCount; i++) {
                    const lx = roadX + (i * laneW);
                    for (let j = -1; j < 10; j++) {
                        const ly = (j * 100) + (roadOffset % 100);
                        ctx.fillRect(lx - 2, ly, 4, 40);
                    }
                }
                ctx.globalAlpha = 1.0;
            }

            function drawCar(x, y, w, h, color, isPlayer, typeIdx) {
                ctx.save();
                ctx.translate(x, y);

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.roundRect(4, 4, w, h, 8);
                ctx.fill();

                const bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
                bodyGrad.addColorStop(0, '#ffffff');
                bodyGrad.addColorStop(0.08, color);
                bodyGrad.addColorStop(1, 'rgba(15, 23, 42, 0.92)');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(0, 0, w, h, 8);
                ctx.fill();

                ctx.fillStyle = 'rgba(3, 7, 18, 0.45)';
                ctx.beginPath();
                ctx.roundRect(4, 16, w-8, h-36, 4);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(6, h-32, w-12, 8);

                if (isPlayer) {
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(2, 2, 8, 4);
                    ctx.fillRect(w-10, 2, 8, 4);
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(w/2 - 4, 0, 8, h);

                    ctx.fillStyle = 'rgba(72, 198, 255, 0.45)';
                    ctx.fillRect(10, 22, w - 20, 12);
                } else {
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(2, h-6, 8, 4);
                    ctx.fillRect(w-10, h-6, 8, 4);
                }

                if (typeIdx === 2) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(2, 16, w-4, 2);
                    ctx.fillRect(2, h-20, w-4, 2);
                }
                if (typeIdx === 3) {
                     ctx.fillStyle = '#fff';
                     ctx.fillRect(4, 16, w-8, h-36);
                     ctx.fillStyle = '#ef4444';
                     ctx.fillRect(w/2 - 8, 10, 6, 4);
                     ctx.fillStyle = '#3b82f6';
                     ctx.fillRect(w/2 + 2, 10, 6, 4);
                }

                ctx.restore();
            }

            // --- GAME LOGIC ---
            function initGame() {
                score = 0;
                runCash = 0;
                speed = CONFIG.baseSpeed;
                obstacles = [];
                particles = [];
                frameCount = 0;
                difficulty = 1;
                roadOffset = 0;
                resetPlayerPos();
                updateHUD();
            }

            function spawnObstacle() {
                const roadW = Math.min(width, 480);
                const roadX = (width - roadW) / 2;
                const laneW = roadW / CONFIG.laneCount;

                let count = 1;
                if (difficulty > 1 && Math.random() > 0.6) count = 2;
                if (difficulty > 3 && Math.random() > 0.7) count = 3;

                const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);

                for (let i = 0; i < count; i++) {
                    const lane = lanes[i];
                    const typeIdx = Math.floor(Math.random() * CARS.length);
                    let color = CARS[typeIdx].color;
                    if (typeIdx === 0) color = '#94a3b8';

                    obstacles.push({
                        x: roadX + (lane * laneW) + (laneW/2) - (player.w/2),
                        y: -150 - (Math.random() * 100),
                        w: player.w,
                        h: player.h,
                        color: color,
                        speedFactor: 0.6 + (Math.random() * 0.2),
                        type: typeIdx
                    });
                }
            }

            function gameOver() {
                gameActive = false;
                stopBgm();
                playSound('crash');
                showFeedback({
                    message: 'Crash! Back to garage.',
                    tone: 'danger',
                    gif: 'impact',
                    duration: 1900
                });

                totalCash += runCash;
                
                hud.classList.add('hidden');
                difficultyHud.classList.add('hidden');
                gameOverScreen.classList.remove('hidden');
                
                document.getElementById('finalScore').innerText = Math.floor(score);
                document.getElementById('earnedCash').innerText = runCash;
                
                cancelAnimationFrame(animationFrameId);
            }

            function update() {
                if (score < 500) difficulty = 1;
                else if (score < 1500) difficulty = 2;
                else if (score < 3000) difficulty = 3;
                else difficulty = 4;

                const diffNames = ["LIGHT", "MODERATE", "HEAVY", "CHAOS"];
                document.getElementById('difficulty-label').innerText = "TRAFFIC: " + diffNames[difficulty-1];

                if (speed < CONFIG.maxSpeed) speed += CONFIG.speedInc;
                
                const dist = (speed * 0.05);
                score += dist;
                runCash = Math.floor(score * (1 + (engineLevel * 0.2)));

                player.x += (player.targetX - player.x) * 0.15;
                roadOffset += speed;

                const spawnRate = Math.max(25, 70 - (difficulty * 10) - speed);
                if (frameCount % Math.floor(spawnRate) === 0) {
                    spawnObstacle();
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let o = obstacles[i];
                    o.y += speed * o.speedFactor;
                    
                    if (o.y > height + 100) {
                        obstacles.splice(i, 1);
                        continue;
                    }

                    const margin = 8;
                    if (player.x + margin < o.x + o.w - margin &&
                        player.x + player.w - margin > o.x + margin &&
                        player.y + margin < o.y + o.h - margin &&
                        player.y + player.h - margin > o.y + margin) {
                        
                        for(let k=0; k<10; k++) {
                            particles.push({
                                x: player.x + player.w/2, 
                                y: player.y, 
                                vx: (Math.random()-0.5)*15, 
                                vy: (Math.random()-0.5)*15, 
                                life: 1, 
                                color: '#ef4444'
                            });
                        }
                        gameOver();
                        return;
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.05;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                frameCount++;
                updateHUD();
            }

            function render() {
                ctx.clearRect(0, 0, width, height);

                const isSunset = document.getElementById('track-sunset').classList.contains('active');
                const theme = isSunset ? CONFIG.colors.sunset : CONFIG.colors.day;

                drawRoad(theme);

                obstacles.forEach(o => {
                    drawCar(o.x, o.y, o.w, o.h, o.color, false, o.type);
                });

                const pCar = CARS[currentCarIdx];
                drawCar(player.x, player.y, player.w, player.h, pCar.color, true, currentCarIdx);

                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;
            }

            function loop() {
                if (!gameActive) return;
                update();
                render();
                if (gameActive) animationFrameId = requestAnimationFrame(loop);
            }

            function updateHUD() {
                document.getElementById('score').innerText = Math.floor(score);
                document.getElementById('game-cash').innerText = runCash;
            }

            // --- MENU UI LOGIC ---
            function updateMenu() {
                document.getElementById('menu-cash').innerText = totalCash;
                
                const engCost = Math.floor(250 * Math.pow(1.4, engineLevel - 1));
                document.getElementById('cost-engine').innerText = engCost;
                document.getElementById('engine-level-display').innerText = `x${(1 + (engineLevel * 0.2)).toFixed(1)}`;
                
                const btnEng = document.getElementById('btn-upgrade-engine');
                if (totalCash >= engCost) {
                    btnEng.style.opacity = '1';
                } else {
                    btnEng.style.opacity = '0.5';
                }

                const container = document.getElementById('car-selector');
                container.innerHTML = '';
                CARS.forEach((car, idx) => {
                    const div = document.createElement('div');
                    const unlocked = unlockedCars.includes(idx);
                    const selected = currentCarIdx === idx;
                    
                    div.className = `car-chip h-10 rounded-lg flex items-center justify-center cursor-pointer transition-all border-2 ${selected ? 'border-brand-orange bg-orange-500/15 shadow-[0_0_18px_rgba(255,138,61,0.22)]' : 'border-transparent bg-slate-900/60'}`;
                    
                    if (!unlocked) {
                        div.innerHTML = '<span class="text-slate-400 text-xs">🔒</span>';
                    } else {
                        div.innerHTML = `<div class="w-4 h-4 rounded-full shadow-sm" style="background:${car.color}"></div>`;
                        div.onclick = () => {
                            ensureAudioReady();
                            currentCarIdx = idx;
                            document.getElementById('car-name').innerText = car.name;
                            playSound('uiClick', { cooldown: 60 });
                            updateMenu();
                        };
                    }
                    container.appendChild(div);
                });
                
                const nextIdx = unlockedCars.length;
                const btnBuy = document.getElementById('btn-buy-car');
                if (nextIdx < CARS.length) {
                    const nextCar = CARS[nextIdx];
                    document.getElementById('cost-car').innerText = nextCar.price;
                    btnBuy.style.display = 'block';
                    if (totalCash >= nextCar.price) {
                        btnBuy.style.opacity = '1';
                        btnBuy.innerHTML = `Unlock ${nextCar.name} $${nextCar.price}`;
                    } else {
                        btnBuy.style.opacity = '0.5';
                        btnBuy.innerHTML = `Unlock ${nextCar.name} $${nextCar.price}`;
                    }
                } else {
                    btnBuy.style.display = 'none';
                }
                
                document.getElementById('car-name').innerText = CARS[currentCarIdx].name;
            }

            // --- EVENT LISTENERS ---
            document.getElementById('btn-upgrade-engine').addEventListener('click', () => {
                ensureAudioReady();
                const cost = Math.floor(250 * Math.pow(1.4, engineLevel - 1));
                if (totalCash >= cost) {
                    totalCash -= cost;
                    engineLevel++;
                    playSound('reward', { bucket: 'reward', cooldown: 120 });
                    showFeedback({
                        message: 'Turbo tuned for higher payout.',
                        tone: 'reward',
                        gif: 'unlock',
                        duration: 1500
                    });
                    updateMenu();
                } else {
                    playSound('blocked', { bucket: 'blocked', cooldown: 180 });
                    showFeedback({
                        message: 'Need more cash for that upgrade.',
                        tone: 'danger',
                        duration: 1100
                    });
                }
            });

            document.getElementById('btn-buy-car').addEventListener('click', () => {
                ensureAudioReady();
                const nextIdx = unlockedCars.length;
                if (nextIdx < CARS.length) {
                    const cost = CARS[nextIdx].price;
                    if (totalCash >= cost) {
                        totalCash -= cost;
                        unlockedCars.push(nextIdx);
                        currentCarIdx = nextIdx;
                        playSound('reward', { bucket: 'reward', cooldown: 120 });
                        showFeedback({
                            message: `${CARS[nextIdx].name} unlocked.`,
                            tone: 'reward',
                            gif: 'unlock',
                            duration: 1650
                        });
                        updateMenu();
                    } else {
                        playSound('blocked', { bucket: 'blocked', cooldown: 180 });
                        showFeedback({
                            message: 'Garage funds too low.',
                            tone: 'danger',
                            duration: 1100
                        });
                    }
                }
            });

            document.getElementById('track-day').addEventListener('click', function() {
                ensureAudioReady();
                this.classList.add('active');
                document.getElementById('track-sunset').classList.remove('active');
                playSound('uiClick', { cooldown: 80 });
            });
            document.getElementById('track-sunset').addEventListener('click', function() {
                ensureAudioReady();
                this.classList.add('active');
                document.getElementById('track-day').classList.remove('active');
                playSound('uiClick', { cooldown: 80 });
            });

            document.getElementById('start-btn').addEventListener('click', () => {
                ensureAudioReady();
                startScreen.classList.add('hidden');
                hud.classList.remove('hidden');
                difficultyHud.classList.remove('hidden');
                playSound('start', { cooldown: 150 });
                startBgm();
                showFeedback({
                    message: 'Traffic live. Thread the lanes.',
                    tone: 'start',
                    duration: 1200
                });

                gameActive = true;
                initGame();
                loop();
            });

            document.getElementById('restart-btn').addEventListener('click', () => {
                ensureAudioReady();
                playSound('uiClick', { cooldown: 80 });
                gameOverScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
                updateMenu();
            });

            document.addEventListener('keydown', ensureAudioReady, { once: true });
            document.addEventListener('pointerdown', ensureAudioReady, { once: true });

            resize();
            impactGif.src = MEDIA.gifs.impact;
            unlockGif.src = MEDIA.gifs.unlock;
            updateMenu();
        });
    </script>
</body>
</html>
