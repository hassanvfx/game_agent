<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Signal Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        :root {
            --bg-top: #07111f;
            --bg-bottom: #190f37;
            --panel-bg: rgba(10, 18, 36, 0.78);
            --panel-border: rgba(129, 241, 255, 0.28);
            --text-main: #effbff;
            --text-dim: #9eb9d3;
            --aqua: #7df9ff;
            --mint: #59f0bf;
            --violet: #aa88ff;
            --gold: #ffe27a;
            --danger: #ff5d7a;
        }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(125, 249, 255, 0.12), transparent 26%),
                radial-gradient(circle at 20% 20%, rgba(170, 136, 255, 0.14), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button { font: inherit; border: 0; cursor: pointer; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .left-0 { left: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-6 { gap: 1.5rem; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .p-10 { padding: 2.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .max-w-md { max-width: 28rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 9999px; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-5xl { font-size: clamp(2.5rem, 6vw, 3rem); }
        .text-6xl { font-size: clamp(3rem, 9vw, 4.5rem); }
        .font-bold { font-weight: 700; }
        .tracking-wide { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.28em; }
        .uppercase { text-transform: uppercase; }
        .opacity-50 { opacity: 0.5; }
        .drop-shadow-md, .drop-shadow-lg { text-shadow: 0 3px 12px rgba(0,0,0,0.4); }
        .text-white { color: #fff; }
        .text-slate-300 { color: var(--text-dim); }
        .text-teal-300 { color: var(--aqua); }
        .text-teal-400 { color: var(--mint); }
        .text-slate-900 { color: #07111f; }
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(17, 28, 53, 0.92), var(--panel-bg)),
                radial-gradient(circle at top, rgba(125, 249, 255, 0.12), transparent 52%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.45),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .title-gradient {
            font-family: 'Orbitron', system-ui, sans-serif;
            background: linear-gradient(90deg, var(--aqua), #b4f6ff 45%, var(--mint));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 18px rgba(125, 249, 255, 0.18);
        }
        .badge-dot {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 9999px;
            box-shadow: 0 0 12px currentColor;
            animation: pulse-bob 1.2s infinite ease-in-out;
        }
        .signal-chip {
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(125, 249, 255, 0.24);
            background: rgba(125, 249, 255, 0.08);
            color: var(--aqua);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .button-primary,
        .button-secondary {
            position: relative;
            overflow: hidden;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }
        .button-primary::after,
        .button-secondary::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255,255,255,0.2), transparent 45%, rgba(255,255,255,0.12));
            opacity: 0.8;
        }
        .button-primary {
            background: linear-gradient(135deg, #143d7a, #0a8b88 52%, #5f46f9);
            color: white;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.45), 0 0 22px rgba(89, 240, 191, 0.22);
        }
        .button-secondary {
            background: linear-gradient(135deg, #f4fbff, #bff7ff);
            color: #07111f;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.35);
        }
        .button-primary:active,
        .button-secondary:active {
            transform: scale(0.97);
            filter: brightness(1.05);
        }
        #start-screen, #game-over-screen { width: min(28rem, calc(100vw - 2rem)); }
        #hud {
            font-family: 'Orbitron', system-ui, sans-serif;
            align-items: flex-start;
        }
        .hud-block {
            padding: 0.55rem 0.85rem;
            border-radius: 1rem;
            background: rgba(7, 17, 31, 0.5);
            border: 1px solid rgba(125, 249, 255, 0.18);
            box-shadow: 0 8px 22px rgba(0,0,0,0.18);
        }
        .signal-caption {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .signal-caption::before {
            content: "◉";
            color: var(--mint);
            text-shadow: 0 0 10px rgba(89, 240, 191, 0.55);
        }
        #feedback-gif-layer {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(32vw, 160px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            z-index: 4;
        }
        .gif-card {
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            background: rgba(7, 17, 31, 0.78);
            border: 1px solid rgba(125, 249, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.28);
            transform: translateY(10px) scale(0.96);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .gif-card.active {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }
        .gif-card img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .gif-caption {
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--aqua);
            padding: 0.45rem 0.6rem 0.55rem;
            text-align: center;
        }
        .status-ribbon {
            min-width: 10rem;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(125, 249, 255, 0.25);
            background: rgba(7, 17, 31, 0.54);
            color: var(--text-main);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .status-ribbon.is-match {
            color: var(--mint);
            border-color: rgba(89, 240, 191, 0.32);
        }
        .status-ribbon.is-fail {
            color: #ffc1cf;
            border-color: rgba(255, 93, 122, 0.35);
        }
        @keyframes pulse-bob {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-4px); opacity: 1; }
        }
        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .px-8 { padding-left: 1rem; padding-right: 1rem; }
            .text-2xl { font-size: 1.1rem; }
            .tracking-widest { letter-spacing: 0.16em; }
            .signal-chip { font-size: 0.72rem; }
            #feedback-gif-layer {
                right: 0.75rem;
                bottom: 0.75rem;
                width: min(30vw, 120px);
            }
            .status-ribbon {
                min-width: 7.25rem;
                font-size: 0.64rem;
                padding: 0.45rem 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto flex flex-col items-center gap-6 max-w-md mx-4">
                <div class="signal-chip">Live relay // archive crew</div>
                <h1 class="text-6xl font-bold title-gradient drop-shadow-lg tracking-wide">SIGNAL ARCHIVE</h1>
                <p class="text-slate-300 text-lg">Tap two cards at a time to restore each matching transmission.</p>
                <div class="flex gap-2 justify-center" aria-hidden="true">
                    <span class="badge-dot" style="background:#7df9ff; color:#7df9ff; animation-delay: 0s"></span>
                    <span class="badge-dot" style="background:#59f0bf; color:#59f0bf; animation-delay: 0.2s"></span>
                    <span class="badge-dot" style="background:#aa88ff; color:#aa88ff; animation-delay: 0.4s"></span>
                </div>
                <button id="start-btn" class="button-primary text-white font-bold py-4 px-12 rounded-full">
                    START SCAN
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-3xl text-center pointer-events-auto max-w-md mx-4">
                <div class="signal-chip mb-4">Restoration complete</div>
                <h2 class="text-5xl font-bold text-white mb-4 title-gradient">ARCHIVE STABILIZED</h2>
                <div class="text-xl text-slate-300 mb-8">Scans used: <span id="finalMoves" class="text-teal-400 font-bold">0</span></div>
                <!-- [agent-note][stage3] resolved-audio: win-state -> catalogs/audios.json level complete + victory loop -->
                <button id="restart-btn" class="button-secondary font-bold py-3 px-10 rounded-full">
                    Run Again
                </button>
            </div>
            
            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
            <!-- [agent-note][stage3] resolved-font: title-ui -> Orbitron, body-ui -> Exo 2 from catalogs/fonts.json -->
            <div id="hud" class="absolute top-6 left-0 w-full flex justify-between px-8 text-2xl font-bold text-white drop-shadow-md hidden pointer-events-none">
                <div class="hud-block">Scans: <span id="score" class="text-teal-300">0</span></div>
                <div class="hud-block text-sm opacity-50 tracking-widest uppercase mt-2"><span class="signal-caption">Signal Link</span></div>
            </div>

            <div id="feedback-gif-layer" class="pointer-events-none">
                <!-- [agent-note][stage3] resolved-gif: fail-feedback + win-feedback -> catalogs/gifs.json -->
                <div id="status-ribbon" class="status-ribbon hidden">Scan Ready</div>
                <div id="fail-gif-card" class="gif-card hidden" aria-hidden="true">
                    <img src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Confused reaction feedback">
                    <div class="gif-caption">Signal Jam</div>
                </div>
                <div id="win-gif-card" class="gif-card hidden" aria-hidden="true">
                    <img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Celebration feedback">
                    <div class="gif-caption">Archive Locked</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                flip: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                match: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.sfxCooldowns = new Map();
                this.bgm = this.createLoop(ASSETS.bgm, 0.2);
                this.victoryLoop = this.createLoop(ASSETS.victoryLoop, 0.2);
                this.sfx = {};

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            createLoop(url, volume) {
                const audio = new Audio(url);
                audio.loop = true;
                audio.volume = volume;
                audio.preload = 'auto';
                return audio;
            }

            unlock() {
                if (this.unlocked) return Promise.resolve();
                const primer = new Audio();
                primer.muted = true;
                this.unlocked = true;
                return primer.play().catch(() => {}).finally(() => {
                    primer.pause();
                    primer.src = "";
                });
            }

            stopAllLoops() {
                [this.bgm, this.victoryLoop].forEach(loop => {
                    loop.pause();
                    loop.currentTime = 0;
                });
            }

            playLoop(kind) {
                if (!this.unlocked) return;
                this.stopAllLoops();
                const target = kind === 'victory' ? this.victoryLoop : this.bgm;
                target.play().catch(() => {});
            }

            playSFX(key, { volume = 0.7, debounceMs = 120 } = {}) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.sfxCooldowns.get(key) || 0;
                if (now - last < debounceMs) return;
                this.sfxCooldowns.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusRibbon = document.getElementById('status-ribbon');
        const failGifCard = document.getElementById('fail-gif-card');
        const winGifCard = document.getElementById('win-gif-card');
        let width, height;
        let gameActive = false;
        let moves = 0;
        let cards = [];
        let flippedCards = [];
        let matchesFound = 0;
        let boardLocked = false;
        let particles = [];
        let gameLoopHandle = null;
        let feedbackTimer = null;

        // Configuration
        const ROWS = 4;
        const COLS = 3;
        const GAP = 15;
        const CARD_TYPES = ['distress', 'party', 'turtle', 'heart', 'star', 'diamond'];

        /** 4. PARALLAX & VISUALS */
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.size = Math.random() * 20 + 5;
                this.speed = Math.random() * 1 + 0.2;
                this.opacity = Math.random() * 0.3 + 0.1;
                this.hue = Math.random() > 0.5 ? 270 : 180;
            }

            update() {
                this.y -= this.speed;
                if (this.y < -50) this.reset();
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for(let i = 0; i < 30; i++) particles.push(new Particle());
        }

        function hideFeedback() {
            clearTimeout(feedbackTimer);
            statusRibbon.classList.add('hidden');
            statusRibbon.classList.remove('is-match', 'is-fail');
            failGifCard.classList.add('hidden');
            failGifCard.classList.remove('active');
            winGifCard.classList.add('hidden');
            winGifCard.classList.remove('active');
        }

        function showFeedback(message, type, gifKey, duration = 1400) {
            clearTimeout(feedbackTimer);
            statusRibbon.textContent = message;
            statusRibbon.classList.remove('hidden', 'is-match', 'is-fail');
            if (type) statusRibbon.classList.add(type);

            [failGifCard, winGifCard].forEach(card => {
                card.classList.add('hidden');
                card.classList.remove('active');
            });

            const selectedCard = gifKey === 'fail' ? failGifCard : gifKey === 'win' ? winGifCard : null;
            if (selectedCard) {
                selectedCard.classList.remove('hidden');
                requestAnimationFrame(() => selectedCard.classList.add('active'));
            }

            feedbackTimer = setTimeout(() => {
                hideFeedback();
            }, duration);
        }

        /** 5. CARD CLASS */
        class Card {
            constructor(type, gridX, gridY) {
                this.type = type;
                this.gridX = gridX;
                this.gridY = gridY;
                this.x = 0;
                this.y = 0;
                this.w = 0;
                this.h = 0;
                
                this.isFlipped = false;
                this.isMatched = false;
                
                this.scaleX = 1;
                this.animState = 'idle';
            }

            updateLayout(cardW, cardH, marginX, marginY) {
                this.w = cardW;
                this.h = cardH;
                this.x = marginX + this.gridX * (cardW + GAP);
                this.y = marginY + this.gridY * (cardH + GAP);
            }

            flip() {
                if (this.animState !== 'idle') return;
                this.animState = 'flipping_half_1';
            }

            update() {
                const flipSpeed = 0.15;

                if (this.animState === 'flipping_half_1') {
                    this.scaleX -= flipSpeed;
                    if (this.scaleX <= 0) {
                        this.scaleX = 0;
                        this.isFlipped = !this.isFlipped;
                        this.animState = 'flipping_half_2';
                    }
                } else if (this.animState === 'flipping_half_2') {
                    this.scaleX += flipSpeed;
                    if (this.scaleX >= 1) {
                        this.scaleX = 1;
                        this.animState = 'idle';
                    }
                }
            }

            draw(ctx) {
                if (this.isMatched && this.scaleX === 1) {
                    ctx.globalAlpha = 0.5;
                }

                const centerX = this.x + this.w / 2;
                const centerY = this.y + this.h / 2;

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.scale(this.scaleX, 1);

                ctx.beginPath();
                ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, 12);
                
                if (!this.isFlipped) {
                    const grad = ctx.createLinearGradient(-this.w/2, -this.h/2, this.w/2, this.h/2);
                    grad.addColorStop(0, '#102b5f');
                    grad.addColorStop(0.55, '#0c8a8a');
                    grad.addColorStop(1, '#6940ff');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-this.w/4, -this.h/4);
                    ctx.lineTo(this.w/4, this.h/4);
                    ctx.moveTo(this.w/4, -this.h/4);
                    ctx.lineTo(-this.w/4, this.h/4);
                    ctx.stroke();
                    
                    ctx.strokeStyle = '#aefcff';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = 'rgba(125, 249, 255, 0.45)';
                    ctx.shadowBlur = 12;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                } else {
                    const faceGrad = ctx.createLinearGradient(-this.w/2, -this.h/2, this.w/2, this.h/2);
                    faceGrad.addColorStop(0, '#f8fdff');
                    faceGrad.addColorStop(1, '#dff7ff');
                    ctx.fillStyle = faceGrad;
                    ctx.fill();

                    ctx.fillStyle = 'rgba(17, 40, 74, 0.08)';
                    ctx.fillRect(-this.w / 2 + 10, -this.h / 2 + 10, this.w - 20, this.h - 20);

                    this.drawIcon(ctx, this.type);

                    ctx.strokeStyle = this.isMatched ? '#59f0bf' : '#d8f5ff';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = this.isMatched ? 'rgba(89, 240, 191, 0.45)' : 'rgba(125, 249, 255, 0.18)';
                    ctx.shadowBlur = this.isMatched ? 16 : 8;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
                ctx.globalAlpha = 1.0;
            }

            drawIcon(ctx, type) {
                const size = Math.min(this.w, this.h) * 0.28;
                const palettes = {
                    distress: { fill: '#ff6a88', stroke: '#8a1538', glyph: '✦' },
                    party: { fill: '#ffe27a', stroke: '#8b6b00', glyph: '◌' },
                    turtle: { fill: '#59f0bf', stroke: '#0f6b55', glyph: '⬢' },
                    heart: { fill: '#ff5d7a', stroke: '#8a1538' },
                    star: { fill: '#7df9ff', stroke: '#0b5f72' },
                    diamond: { fill: '#aa88ff', stroke: '#4a2a96' }
                };
                const palette = palettes[type] || palettes.star;

                ctx.fillStyle = palette.fill;
                ctx.strokeStyle = palette.stroke;
                ctx.lineWidth = 4;
                ctx.beginPath();

                if (type === 'heart') {
                    ctx.moveTo(0, size / 2);
                    ctx.bezierCurveTo(size / 2, -size / 2, size, size / 3, 0, size);
                    ctx.bezierCurveTo(-size, size / 3, -size / 2, -size / 2, 0, size / 2);
                } else if (type === 'star') {
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * size,
                                   -Math.sin((18 + i * 72) * Math.PI / 180) * size);
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * size * 0.5,
                                   -Math.sin((54 + i * 72) * Math.PI / 180) * size * 0.5);
                    }
                    ctx.closePath();
                } else if (type === 'diamond') {
                    ctx.moveTo(0, -size);
                    ctx.lineTo(size * 0.8, 0);
                    ctx.lineTo(0, size);
                    ctx.lineTo(-size * 0.8, 0);
                    ctx.closePath();
                } else if (type === 'distress') {
                    ctx.roundRect(-size * 0.7, -size * 0.55, size * 1.4, size * 1.1, 8);
                } else if (type === 'party') {
                    ctx.arc(0, 0, size * 0.9, 0, Math.PI * 2);
                } else if (type === 'turtle') {
                    ctx.roundRect(-size * 0.78, -size * 0.58, size * 1.56, size * 1.16, 10);
                }

                ctx.fill();
                ctx.stroke();

                if (palette.glyph) {
                    ctx.fillStyle = palette.stroke;
                    ctx.font = `bold ${Math.max(18, size * 0.9)}px "Exo 2"`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(palette.glyph, 0, 2);
                }
            }
        }

        /** 6. GAME LOGIC */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            if (cards.length > 0) {
                const maxWidth = Math.min(width * 0.9, 600);
                const maxHeight = Math.min(height * 0.75, 800);
                
                const cardW = (maxWidth - (COLS - 1) * GAP) / COLS;
                const cardH = (maxHeight - (ROWS - 1) * GAP) / ROWS;
                const finalSize = Math.min(cardW, cardH); 
                
                const totalGridW = COLS * finalSize + (COLS - 1) * GAP;
                const totalGridH = ROWS * finalSize + (ROWS - 1) * GAP;
                
                const startX = (width - totalGridW) / 2;
                const startY = (height - totalGridH) / 2 + 40;

                cards.forEach(c => c.updateLayout(finalSize, finalSize, startX, startY));
            }
        }
        window.addEventListener('resize', resize);

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            moves = 0;
            matchesFound = 0;
            flippedCards = [];
            boardLocked = false;
            document.getElementById('score').innerText = moves;
            hideFeedback();
            
            let deck = [];
            [...CARD_TYPES].forEach(t => {
                deck.push(t);
                deck.push(t);
            });
            deck = shuffle(deck);

            cards = [];
            let idx = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    cards.push(new Card(deck[idx], c, r));
                    idx++;
                }
            }
            
            initParticles();
            resize();
            showFeedback('Scan Running', 'is-match', null, 1100);
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            
            if (c1.type === c2.type) {
                c1.isMatched = true;
                c2.isMatched = true;
                flippedCards = [];
                matchesFound++;
                audio.playSFX('match', { volume: 0.6, debounceMs: 180 });
                showFeedback('Match Secured', 'is-match', 'win', 1350);
                
                if (matchesFound === (ROWS * COLS) / 2) {
                    setTimeout(gameOver, 500);
                }
            } else {
                boardLocked = true;
                audio.playSFX('fail', { volume: 0.58, debounceMs: 180 });
                showFeedback('Signal Mismatch', 'is-fail', 'fail', 1150);
                setTimeout(() => {
                    c1.flip();
                    c2.flip();
                    flippedCards = [];
                    boardLocked = false;
                }, 1000);
            }
            
            moves++;
            document.getElementById('score').innerText = moves;
        }

        function handleInput(x, y) {
            if (boardLocked) {
                audio.playSFX('blocked', { volume: 0.45, debounceMs: 220 });
                return;
            }
            
            for (let card of cards) {
                if (x > card.x && x < card.x + card.w &&
                    y > card.y && y < card.y + card.h) {
                    
                    if (!card.isFlipped && !card.isMatched && flippedCards.length < 2) {
                        card.flip();
                        flippedCards.push(card);
                        audio.playSFX('flip', { volume: 0.36, debounceMs: 60 });
                        
                        if (flippedCards.length === 2) {
                            checkMatch();
                        }
                    } else {
                        audio.playSFX('blocked', { volume: 0.42, debounceMs: 200 });
                    }
                    break;
                }
            }
        }

        function gameLoop() {
            if (!gameActive) {
                gameLoopHandle = null;
                return;
            }
            
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#07111f');
            grad.addColorStop(0.6, '#10213f');
            grad.addColorStop(1, '#190f37');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const halo = ctx.createRadialGradient(width * 0.5, height * 0.15, 20, width * 0.5, height * 0.15, width * 0.7);
            halo.addColorStop(0, 'rgba(125, 249, 255, 0.18)');
            halo.addColorStop(0.4, 'rgba(89, 240, 191, 0.08)');
            halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = halo;
            ctx.fillRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            cards.forEach(c => {
                c.update();
                c.draw(ctx);
            });

            gameLoopHandle = requestAnimationFrame(gameLoop);
        }

        function startRound() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playLoop('bgm');
            gameActive = true;
            initGame();
            if (!gameLoopHandle) gameLoop();
        }

        function gameOver() {
            gameActive = false;
            audio.stopAllLoops();
            audio.playSFX('win', { volume: 0.72, debounceMs: 250 });
            audio.playLoop('victory');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalMoves').innerText = moves;
            showFeedback('Archive Stabilized', 'is-match', 'win', 2000);
        }

        /** 7. CONTROLS */
        canvas.addEventListener('mousedown', e => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            handleInput(e.clientX - rect.left, e.clientY - rect.top);
        });
        
        canvas.addEventListener('touchstart', e => {
            if (!gameActive) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            handleInput(touch.clientX - rect.left, touch.clientY - rect.top);
        }, {passive: false});

        document.getElementById('start-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('start', { volume: 0.58, debounceMs: 250 });
            startRound();
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('start', { volume: 0.54, debounceMs: 250 });
            startRound();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.playLoop('bgm');
            }
        });
        
        resize();
        const bootGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bootGrad.addColorStop(0, '#07111f');
        bootGrad.addColorStop(1, '#190f37');
        ctx.fillStyle = bootGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    });
    </script>
</body>
