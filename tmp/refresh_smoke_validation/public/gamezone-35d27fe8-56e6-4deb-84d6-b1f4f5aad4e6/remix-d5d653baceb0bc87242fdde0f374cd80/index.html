<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Harvest Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
    :root {
        --sky-glow: #7ae7ff;
        --sun-gold: #ffd45c;
        --pumpkin: #ff8a4d;
        --leaf: #7bdc8d;
        --dirt: #4e2e2a;
        --night-soil: #1c1224;
        --panel: rgba(24, 17, 41, 0.72);
        --panel-edge: rgba(122, 231, 255, 0.34);
        --text-main: #f8f5ff;
        --text-soft: rgba(248, 245, 255, 0.82);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(122, 231, 255, 0.14), transparent 28%),
            linear-gradient(180deg, #160f25 0%, #231637 45%, #1e342f 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    body { color: var(--text-main); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hidden { display: none !important; }
    .screen-root {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        background:
            radial-gradient(circle at 50% -12%, rgba(255, 212, 92, 0.18), transparent 30%),
            linear-gradient(180deg, #110d1c 0%, #1b1330 42%, #16352a 100%);
    }
    .screen-root::before,
    .screen-root::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    .screen-root::before {
        background:
            radial-gradient(circle at 18% 18%, rgba(122, 231, 255, 0.16), transparent 20%),
            radial-gradient(circle at 82% 22%, rgba(255, 212, 92, 0.14), transparent 18%),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 54px);
        opacity: 0.9;
    }
    .screen-root::after {
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.14));
        mix-blend-mode: screen;
    }
    .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
            max(1rem, env(safe-area-inset-top))
            max(1rem, env(safe-area-inset-right))
            max(1rem, env(safe-area-inset-bottom))
            max(1rem, env(safe-area-inset-left));
        box-sizing: border-box;
    }
    .hud {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        transition: opacity 300ms;
    }
    .hud-pill, .glass-panel {
        background: var(--panel);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-edge);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .hud-pill {
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        color: var(--text-main);
        font-family: 'Creepster', 'Rajdhani', sans-serif;
        font-size: 1rem;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        position: relative;
    }
    .hud-pill span:first-child {
        filter: drop-shadow(0 0 8px rgba(255, 212, 92, 0.45));
    }
    .feedback-stage {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        overflow: hidden;
    }
    .feedback-gif {
        position: absolute;
        width: clamp(5rem, 18vw, 8rem);
        height: clamp(5rem, 18vw, 8rem);
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        opacity: 0;
        transform: translate3d(0, 0.75rem, 0) scale(0.84);
        transition: opacity 160ms ease, transform 220ms ease;
        background: rgba(11, 7, 20, 0.5);
    }
    .feedback-gif.is-active {
        opacity: 0.95;
        transform: translate3d(0, 0, 0) scale(1);
    }
    .feedback-gif--harvest {
        left: 1rem;
        bottom: 5.5rem;
    }
    .feedback-gif--fail {
        right: 1rem;
        top: 5.5rem;
    }
    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at center, rgba(17, 12, 28, 0.58), rgba(5, 3, 11, 0.82));
        pointer-events: auto;
    }
    .glass-panel {
        padding: 2rem;
        border-radius: 1.5rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        transform: scale(1);
        transition: transform 200ms ease, box-shadow 200ms ease;
        max-width: 20rem;
        width: min(100%, 20rem);
        max-height: min(100%, 30rem);
        box-sizing: border-box;
        position: relative;
        overflow: auto;
    }
    .glass-panel::before {
        content: "🚜";
        position: absolute;
        top: 0.75rem;
        right: 0.95rem;
        font-size: 1.5rem;
        transform: rotate(-8deg);
        filter: drop-shadow(0 0 8px rgba(255, 212, 92, 0.35));
        opacity: 0.92;
    }
    .title {
        margin: 0;
        font-family: 'Creepster', 'Rajdhani', sans-serif;
        font-size: clamp(2rem, 6vw, 2.5rem);
        color: var(--text-main);
        letter-spacing: 0.08em;
        text-shadow: 0 0 16px rgba(122, 231, 255, 0.28);
    }
    .score-line {
        font-size: 1.5rem;
        color: var(--sun-gold);
        font-family: 'Creepster', 'Rajdhani', sans-serif;
        text-shadow: 0 0 12px rgba(255, 212, 92, 0.25);
    }
    .subtext {
        color: var(--text-soft);
        font-size: 1rem;
        line-height: 1.35;
        margin: 0;
    }
    .action-btn {
        margin-top: 0.75rem;
        background: linear-gradient(180deg, #ff9d57, #ff6a39);
        color: #fff9f3;
        border: 1px solid rgba(255,255,255,0.16);
        font-family: 'Creepster', 'Rajdhani', sans-serif;
        font-size: 1rem;
        padding: 0.9rem 1.5rem;
        border-radius: 9999px;
        box-shadow: 0 12px 24px rgba(255, 106, 57, 0.24);
        transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
        cursor: pointer;
    }
    .action-btn:hover { filter: brightness(1.06); }
    .action-btn:active {
        transform: scale(0.96);
        box-shadow: 0 8px 18px rgba(255, 106, 57, 0.2);
    }
    .opacity-0 { opacity: 0; }
    @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 98, 0.55); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 98, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 98, 0); } }
    .animate-pulse-red { animation: pulse-red 1s infinite; }
    @media (max-width: 640px) {
        .hud {
            gap: 0.5rem;
            align-items: stretch;
        }
        .hud-pill {
            font-size: 0.82rem;
            padding: 0.45rem 0.78rem;
            gap: 0.42rem;
        }
        .feedback-gif--harvest {
            left: 0.75rem;
            bottom: 6.25rem;
        }
        .feedback-gif--fail {
            right: 0.75rem;
            top: 6.25rem;
        }
        .glass-panel {
            padding: 1.5rem;
            max-width: 18rem;
            width: min(100%, 18rem);
        }
        .score-line { font-size: 1.2rem; }
        .action-btn {
            font-size: 0.95rem;
            min-height: 3rem;
        }
    }
</style>

<body>

<div id="game-container" class="screen-root">
    <canvas id="gameCanvas"></canvas>

    <div id="feedback-stage" class="feedback-stage" aria-live="polite">
        <!-- [agent-note][stage3] resolved-gif: harvest-pop + fail-reaction -> catalogs/gifs.json -->
        <img id="harvest-gif" class="feedback-gif feedback-gif--harvest" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Harvest celebration effect">
        <img id="fail-gif" class="feedback-gif feedback-gif--fail" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction effect">
    </div>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="ui-layer">
        <!-- HUD -->
        <div id="hud" class="hud">
            <div class="hud-pill">
                <span>🌾</span>

            </div>
            <div class="hud-pill">
                <span>❤️</span>
                <span id="lives-display">5</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <div class="glass-panel">
                <h1 class="title">HARVEST OVER</h1>
                <div class="score-line">Score: <span id="final-score">0</span></div>
                <p class="subtext">The field went cold before you could gather it all.</p>
                <button id="restart-btn" class="action-btn">
                    Run It Back
                </button>
            </div>
        </div>
    </div>

<script>
// §2 System Invariants
const CONSTANTS = {
    GRID_SIZE: 60,
    CROP_RADIUS: 20,
    HERO_RADIUS: 24,
    GROWTH_TIME: 180, // frames to ripe
    ROT_TIME: 300,    // frames from ripe to rot
    MAX_LIVES: 5
};

// Global State
let canvas, ctx;
let cw = 0, ch = 0; // Logical size in CSS pixels
let dpr = 1;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let gameLoopId;
let lastTime = 0;

// Entities
let hero = { x: 0, y: 0, targetX: 0, targetY: 0 };
let crops = [];
let particles = [];
let score = 0;
let lives = 5;
let spawnTimer = 0;

// Config
let gameConfig = {}; 

// Audio Context
let audioCtx;
let isMuted = false;
let audioUnlocked = false;
let bgmStarted = false;
let activeGifTimers = new Map();
let ripeCueCooldown = 0;
const blockedRemoteAudio = new Set();

// §3.7 Config System
function parseConfig() {
    try {
        const el = document.getElementById('game-config');
        const defs = JSON.parse(el.textContent);
        window.gameConfigDefs = defs;
        window.gameConfig = {};
        for (const key in defs) {
            window.gameConfig[key] = defs[key].value;
        }
    } catch (e) {
        console.error("Config parse error", e);
        window.gameConfig = { heroSpeed: 8, spawnRate: 60, themeColor: '#88d498' };
    }
}

function showGif(id, xRatio = 0.5, yRatio = 0.5) {
    const el = document.getElementById(id);
    const container = document.getElementById('game-container');
    if (!el || !container) return;
    const maxX = Math.max(12, cw - 110);
    const maxY = Math.max(12, ch - 150);
    el.style.left = `${Math.min(maxX, Math.max(12, xRatio * cw - 44))}px`;
    el.style.top = `${Math.min(maxY, Math.max(12, yRatio * ch - 44))}px`;
    el.classList.add('is-active');
    clearTimeout(activeGifTimers.get(id));
    const timer = setTimeout(() => el.classList.remove('is-active'), 850);
    activeGifTimers.set(id, timer);
}

function clearFeedback() {
    for (const [id, timer] of activeGifTimers.entries()) {
        clearTimeout(timer);
        const el = document.getElementById(id);
        if (el) el.classList.remove('is-active');
    }
    activeGifTimers.clear();
}

// §3.5 Audio System
function initAudio() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
        audioCtx = new AudioContext();
    }
}

function unlockAudio() {
    audioUnlocked = true;
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    syncBgm();
}

function canUseHtmlAudio(el) {
    if (!el) return false;
    const src = el.currentSrc || el.src || '';
    if (!src) return false;
    try {
        const mediaUrl = new URL(src, window.location.href);
        if (mediaUrl.origin !== window.location.origin) {
            return !blockedRemoteAudio.has(el.id);
        }
    } catch (err) {
        return false;
    }
    return true;
}

function syncBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    if (gameState === 'PLAYING' && audioUnlocked && !isMuted && canUseHtmlAudio(bgm)) {
        bgm.volume = 0.2;
        if (!bgmStarted) {
            bgm.currentTime = 0;
            bgmStarted = true;
        }
        bgm.play().catch(() => {
            blockedRemoteAudio.add(bgm.id);
            bgm.pause();
        });
    } else {
        bgm.pause();
    }
}

function primeMedia() {
    ['bgm_main', 'sfx_harvest', 'sfx_fail', 'sfx_ripe', 'sfx_ui', 'sfx_gameover'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id !== 'bgm_main') {
            el.volume = id === 'sfx_ui' ? 0.45 : 0.6;
        }
        if (!canUseHtmlAudio(el)) {
            blockedRemoteAudio.add(id);
            return;
        }
        el.load?.();
    });
}

function playSound(id, fallbackType = 'beep') {
    if (isMuted) return;
    const el = document.getElementById(id);
    if (el && canUseHtmlAudio(el)) {
        try {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => {
                blockedRemoteAudio.add(id);
                playSynth(fallbackType);
            });
            return;
        } catch (err) {
            blockedRemoteAudio.add(id);
            playSynth(fallbackType);
            return;
        }
    }
    playSynth(fallbackType);
}

function playSynth(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

function vibrate(style) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

// §3.1 Viewport & Canvas
function resize() {
    cw = document.documentElement.clientWidth;
    ch = document.documentElement.clientHeight;
    dpr = window.devicePixelRatio || 1;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Safety clamp for hero if screen shrinks
    if (hero.x > cw) hero.x = cw / 2;
    if (hero.y > ch) hero.y = ch / 2;
}

// §3.3 Hero System & Game Logic
function initGame() {
    score = 0;
    lives = CONSTANTS.MAX_LIVES;
    spawnTimer = 0;
    crops = [];
    particles = [];
    
    // Hero Init
    hero.x = cw / 2;
    hero.y = ch / 2;
    hero.targetX = cw / 2;
    hero.targetY = ch / 2;
    
    // Initial crops
    for(let i=0; i<3; i++) spawnCrop();
    
    updateUI();
}

function spawnCrop() {
    const margin = 50;
    const x = margin + Math.random() * (cw - margin * 2);
    const y = margin + Math.random() * (ch - margin * 2);
    
    // Simple overlap check
    for (let c of crops) {
        const dx = c.x - x;
        const dy = c.y - y;
        if (Math.sqrt(dx*dx + dy*dy) < CONSTANTS.CROP_RADIUS * 2.5) return; // Too close
    }
    
    crops.push({
        x: x,
        y: y,
        state: 'GROWING', // GROWING, RIPE, ROTTING
        timer: 0,
        scale: 0
    });
}

function updateGame(dt) {
    // 1. Hero Movement
    const speed = gameConfig.heroSpeed || 8;
    // Simple lerp for smooth follow
    hero.x += (hero.targetX - hero.x) * (speed * dt * 2); 
    hero.y += (hero.targetY - hero.y) * (speed * dt * 2);
    
    // Safety check
    if (!isFinite(hero.x) || !isFinite(hero.y)) {
        hero.x = cw/2; hero.y = ch/2;
    }

    // 2. Crop Logic
    spawnTimer++;
    if (spawnTimer > (gameConfig.spawnRate || 60)) {
        spawnCrop();
        spawnTimer = 0;
    }

    for (let i = crops.length - 1; i >= 0; i--) {
        let c = crops[i];
        c.timer++;
        
        // Growth Logic
        if (c.state === 'GROWING') {
            c.scale = Math.min(1, c.timer / 60);
            if (c.timer > CONSTANTS.GROWTH_TIME) {
                c.state = 'RIPE';
                c.timer = 0;
                c.scale = 1.2; // Pop effect
                if (ripeCueCooldown <= 0) {
                    playSound('sfx_ripe', 'coin');
                    ripeCueCooldown = 18;
                }
            }
        } else if (c.state === 'RIPE') {
            c.scale += (1 - c.scale) * 0.1; // Settle back to 1
            if (c.timer > CONSTANTS.ROT_TIME) {
                c.state = 'ROTTING';
                c.timer = 0;
                lives--;
                playSound('sfx_fail', 'fail');
                showGif('fail-gif', c.x / Math.max(cw, 1), c.y / Math.max(ch, 1));
                vibrate('heavy');
                createParticles(c.x, c.y, '#5d4037', 10);
                updateUI();
                if (lives <= 0) setState('GAMEOVER');
            }
        } else if (c.state === 'ROTTING') {
            // Wither away
            c.scale -= 0.05;
            if (c.scale <= 0) crops.splice(i, 1);
        }

        // Collision with Hero
        if (c.state === 'RIPE') {
            const dx = hero.x - c.x;
            const dy = hero.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < CONSTANTS.HERO_RADIUS + CONSTANTS.CROP_RADIUS) {
                // Harvest!
                score += 10;
                playSound('sfx_harvest', 'coin');
                showGif('harvest-gif', c.x / Math.max(cw, 1), c.y / Math.max(ch, 1));
                vibrate('light');
                createParticles(c.x, c.y, '#fdd835', 8);
                crops.splice(i, 1);
                updateUI();
            }
        }
    }

    ripeCueCooldown = Math.max(0, ripeCueCooldown - 1);

    // 3. Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color
        });
    }
}

function drawGame() {
    // Clear
    ctx.fillStyle = gameConfig.themeColor || '#88d498';
    ctx.fillRect(0, 0, cw, ch);
    
    // Draw Pattern (Checkerboard)
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    const size = 60;
    for(let x=0; x<cw; x+=size) {
        for(let y=0; y<ch; y+=size) {
            if ((x/size + y/size) % 2 === 0) {
                ctx.fillRect(x, y, size, size);
            }
        }
    }

    // Draw Crops
    for (let c of crops) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        
        if (c.state === 'GROWING') {
            ctx.fillStyle = '#4caf50'; // Green
            ctx.beginPath(); ctx.arc(0, 0, CONSTANTS.CROP_RADIUS, 0, Math.PI*2); ctx.fill();
        } else if (c.state === 'RIPE') {
            // Glow
            ctx.shadowColor = 'gold';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fdd835'; // Gold
            ctx.beginPath(); ctx.arc(0, 0, CONSTANTS.CROP_RADIUS * 1.2, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        } else if (c.state === 'ROTTING') {
            ctx.fillStyle = '#5d4037'; // Brown
            ctx.beginPath(); ctx.arc(0, 0, CONSTANTS.CROP_RADIUS * 0.8, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }

    // Draw Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    // Draw Hero
    ctx.save();
    ctx.translate(hero.x, hero.y);

    // Trail glow
    ctx.fillStyle = 'rgba(122, 231, 255, 0.18)';
    ctx.beginPath();
    ctx.ellipse(-8, 22, 24, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Harvester scoop
    ctx.fillStyle = '#ffd45c';
    ctx.beginPath();
    ctx.roundRect(8, -18, 16, 11, 4);
    ctx.fill();

    // Tractor body
    const bodyGradient = ctx.createLinearGradient(-22, -24, 18, 20);
    bodyGradient.addColorStop(0, '#ffb36c');
    bodyGradient.addColorStop(1, '#ff7a43');
    ctx.fillStyle = bodyGradient;
    ctx.beginPath();
    ctx.roundRect(-20, -18, 40, 34, 10);
    ctx.fill();

    // Cabin
    ctx.fillStyle = '#79e2ff';
    ctx.beginPath();
    ctx.roundRect(-8, -24, 17, 14, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(9, 22, 40, 0.45)';
    ctx.beginPath();
    ctx.roundRect(-5, -21, 11, 8, 3);
    ctx.fill();

    // Roof light
    ctx.fillStyle = '#fff2b3';
    ctx.beginPath();
    ctx.arc(12, -16, 4, 0, Math.PI * 2);
    ctx.fill();

    // Friendly grill
    ctx.strokeStyle = '#6a2a25';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -4, 7, 0.18 * Math.PI, 0.82 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-6, -7, 1.5, 0, Math.PI * 2);
    ctx.arc(6, -7, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#6a2a25';
    ctx.fill();

    // Wheels
    ctx.fillStyle = '#2d2430';
    ctx.beginPath(); ctx.arc(-18, 16, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(18, 16, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#9ea5b5';
    ctx.beginPath(); ctx.arc(-18, 16, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(18, 16, 4, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            updateGame(Math.min(dt, 0.1)); // Cap dt
        }
        drawGame();
    } catch (e) {
        console.error("Loop error", e);
    }
    
    gameLoopId = requestAnimationFrame(loop);
}

// §3.2 Input System
function handleInput(e) {
    e.preventDefault();
    unlockAudio();
    
    if (gameState === 'GAMEOVER') {
        // Restart is handled by button, but just in case
        return;
    }
    
    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Update target
        hero.targetX = x;
        hero.targetY = y;
    }
}

function restartGame() {
    playSound('sfx_ui', 'coin');
    clearFeedback();
    initGame();
    setState('PLAYING');
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('opacity-0');
        gameOver.classList.add('hidden');
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('opacity-0');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        playSound('sfx_gameover', 'fail');
        showGif('fail-gif', 0.78, 0.26);
    }
    syncBgm();
}

function updateUI() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('lives-display').innerText = lives;
}

// §3.4 Lifecycle
window.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    resize();
    window.addEventListener('resize', resize);
    
    initAudio();
    primeMedia();
    
    // Input Listeners
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', (e)=>{ e.preventDefault(); }, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        restartGame();
    });

    // Start
    initGame();
    setState('PLAYING');
    
    requestAnimationFrame(loop);
});

// Expose Config for Debug
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
}


</script>
