<style>
:root{--night:#07070d;--porch:#ffb13b;--blood:#d92935;--mask:#f2eee4;--panel:rgba(10,8,14,.78);--edge:rgba(255,177,59,.32);--text:#fff8ed;--soft:rgba(255,248,237,.78)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--night);font-family:Rajdhani,system-ui,sans-serif;color:var(--text);touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hidden{display:none!important}.screen-root{position:relative;width:100%;height:100%;user-select:none;background:radial-gradient(circle at 50% -8%,rgba(255,177,59,.16),transparent 26%),linear-gradient(180deg,#080710 0%,#12101a 46%,#1a1110 100%)}.screen-root:before,.screen-root:after{content:"";position:absolute;inset:0;pointer-events:none}.screen-root:before{background:linear-gradient(90deg,transparent 0 10%,rgba(255,177,59,.055) 10% 11%,transparent 11% 35%,rgba(255,177,59,.04) 35% 36%,transparent 36%),radial-gradient(circle at 18% 22%,rgba(255,119,38,.16),transparent 17%),radial-gradient(circle at 82% 18%,rgba(216,41,53,.12),transparent 16%)}.screen-root:after{background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),radial-gradient(circle at center,transparent 42%,rgba(0,0,0,.42) 100%);mix-blend-mode:screen;animation:flick 4.8s infinite steps(2,end)}@keyframes flick{0%,78%,100%{opacity:.55}80%{opacity:.22}82%{opacity:.72}84%{opacity:.38}}
.ui-layer{position:absolute;inset:0;z-index:50;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(.75rem,env(safe-area-inset-top)) max(.75rem,env(safe-area-inset-right)) max(.85rem,env(safe-area-inset-bottom)) max(.75rem,env(safe-area-inset-left))}.hud{display:flex;justify-content:space-between;gap:.5rem;width:100%;transition:opacity .3s}.hud-pill,.glass-panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);box-shadow:0 12px 34px #0008,inset 0 1px 0 #fff1}.hud-pill{min-height:2.55rem;padding:.48rem .86rem;border-radius:999px;font-family:Creepster,Rajdhani,sans-serif;font-size:clamp(.76rem,3.5vw,1rem);letter-spacing:.055em;display:flex;align-items:center;gap:.45rem;white-space:nowrap;text-shadow:0 0 10px rgba(255,177,59,.25)}.objective-chip{position:absolute;left:50%;bottom:max(.95rem,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,28rem);text-align:center;font-size:clamp(.82rem,3.2vw,1rem);letter-spacing:.04em;padding:.55rem .85rem;border-radius:999px;background:rgba(7,7,13,.5);border:1px solid rgba(255,177,59,.18);box-shadow:0 10px 30px #0004}.feedback-stage{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}.feedback-gif{position:absolute;width:clamp(4.75rem,18vw,7.5rem);height:clamp(4.75rem,18vw,7.5rem);object-fit:cover;border-radius:1rem;border:1px solid rgba(255,177,59,.28);box-shadow:0 12px 30px #0008,0 0 28px rgba(216,41,53,.18);opacity:0;transform:translate3d(0,.75rem,0) scale(.84);transition:opacity .16s,transform .22s;background:rgba(7,7,13,.55);filter:saturate(.7) contrast(1.2) brightness(.72)}.feedback-gif.is-active{opacity:.88;transform:translate3d(0,0,0) scale(1)}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(circle at center,rgba(8,7,12,.46),rgba(0,0,0,.88));pointer-events:auto}.glass-panel{padding:clamp(1.25rem,5vw,2rem);border-radius:1.45rem;text-align:center;display:flex;flex-direction:column;gap:.9rem;max-width:21rem;width:min(100%,21rem);max-height:min(100%,32rem);position:relative;overflow:auto}.glass-panel:before{content:"🔪";position:absolute;top:.72rem;right:.95rem;font-size:1.55rem;transform:rotate(18deg);filter:drop-shadow(0 0 8px rgba(216,41,53,.55))}.title{margin:0;font-family:Creepster,Rajdhani,sans-serif;font-size:clamp(2rem,8vw,2.75rem);line-height:.95;color:var(--mask);letter-spacing:.08em;text-shadow:0 0 16px rgba(216,41,53,.45),0 2px 0 #000}.score-line{font-size:clamp(1.15rem,4.5vw,1.45rem);color:var(--porch);font-family:Creepster,Rajdhani,sans-serif}.subtext{color:var(--soft);font-size:clamp(.92rem,3.5vw,1rem);line-height:1.36;margin:0}.action-btn{margin-top:.45rem;min-height:3.1rem;background:linear-gradient(180deg,#ffb13b,#b9232c 74%);color:#fff8ed;border:1px solid #fff3;font-family:Creepster,Rajdhani,sans-serif;font-size:1rem;letter-spacing:.06em;padding:.9rem 1.35rem;border-radius:999px;box-shadow:0 12px 24px rgba(185,35,44,.28);cursor:pointer}.action-btn:active{transform:scale(.96)}.opacity-0{opacity:0}@media (orientation:landscape) and (max-height:520px){.objective-chip{display:none}.hud-pill{font-size:.78rem;min-height:2.25rem}}
</style>
<script id="game-config" type="application/x-game-config">{"heroSpeed":{"type":"number","label":"Survivor Speed","value":8,"min":1,"max":15},"spawnRate":{"type":"number","label":"Clue Spawn Rate","value":60,"min":10,"max":200},"themeColor":{"type":"color","label":"Street Fog","value":"#0d0b12"}}</script>
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/bgm/dark_bgm_01.mp3" preload="none" loop></audio><audio id="sfx_harvest" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_item_01.mp3" preload="none"></audio><audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_enemy_01.mp3" preload="none"></audio><audio id="sfx_ripe" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_wind_01.mp3" preload="none"></audio><audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="none"></audio><audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_defeat_01.mp3" preload="none"></audio></head>
<body><div id="game-container" class="screen-root"><canvas id="gameCanvas"></canvas><div id="feedback-stage" class="feedback-stage"><img id="harvest-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="A clue is secured"><img id="fail-gif" class="feedback-gif" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="The Shape closes in"></div><div id="ui-layer" class="ui-layer"><div id="hud" class="hud"><div class="hud-pill"><span>🔦</span><span>CLUES</span><span id="score-display">0</span></div><div class="hud-pill"><span>🏠</span><span>PORCHES</span><span id="lives-display">5</span></div></div><div class="objective-chip">Drag or tap to guide the babysitter. Reach lit clues before the masked shape cuts the lights.</div><div id="game-over-screen" class="overlay hidden"><div class="glass-panel"><h1 class="title">THE SHAPE FOUND YOU</h1><div class="score-line">Clues saved: <span id="final-score">0</span></div><p class="subtext">Haddonfield goes quiet. The last porch light dies behind the white mask.</p><button id="restart-btn" class="action-btn">Run Through the Leaves</button></div></div></div></div>
<script>
const CONSTANTS={GRID_SIZE:60,CROP_RADIUS:20,HERO_RADIUS:24,GROWTH_TIME:180,ROT_TIME:300,MAX_LIVES:5};let canvas,ctx,cw=0,ch=0,dpr=1,gameState='BOOT',gameLoopId,lastTime=0,hero={x:0,y:0,targetX:0,targetY:0},crops=[],particles=[],score=0,lives=5,spawnTimer=0,gameConfig={},audioCtx,isMuted=false,audioUnlocked=false,bgmStarted=false,activeGifTimers=new Map,ripeCueCooldown=0,frameClock=0;const blockedRemoteAudio=new Set;
function parseConfig(){try{const d=JSON.parse(document.getElementById('game-config').textContent);window.gameConfigDefs=d;window.gameConfig={};for(const k in d)window.gameConfig[k]=d[k].value;gameConfig=window.gameConfig}catch(e){console.error('Config parse error',e);window.gameConfig={heroSpeed:8,spawnRate:60,themeColor:'#0d0b12'};gameConfig=window.gameConfig}}
function showGif(id,xr=.5,yr=.5){const el=document.getElementById(id);if(!el)return;const mx=Math.max(12,cw-110),my=Math.max(12,ch-150);el.style.left=`${Math.min(mx,Math.max(12,xr*cw-44))}px`;el.style.top=`${Math.min(my,Math.max(12,yr*ch-44))}px`;el.classList.add('is-active');clearTimeout(activeGifTimers.get(id));const t=setTimeout(()=>el.classList.remove('is-active'),850);activeGifTimers.set(id,t)}
function clearFeedback(){for(const [id,t]of activeGifTimers.entries()){clearTimeout(t);const el=document.getElementById(id);if(el)el.classList.remove('is-active')}activeGifTimers.clear()}function initAudio(){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A}function unlockAudio(){audioUnlocked=true;if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});syncBgm()}function canUseHtmlAudio(el){if(!el)return false;const src=el.currentSrc||el.src||'';if(!src)return false;try{const u=new URL(src,location.href);if(u.origin!==location.origin)return!blockedRemoteAudio.has(el.id)}catch(e){return false}return true}
function syncBgm(){const bgm=document.getElementById('bgm_main');if(!bgm)return;if(gameState==='PLAYING'&&audioUnlocked&&!isMuted&&canUseHtmlAudio(bgm)){bgm.volume=.18;if(!bgmStarted){bgm.currentTime=0;bgmStarted=true}bgm.play().catch(()=>{blockedRemoteAudio.add(bgm.id);bgm.pause()})}else bgm.pause()}function primeMedia(){['bgm_main','sfx_harvest','sfx_fail','sfx_ripe','sfx_ui','sfx_gameover'].forEach(id=>{const el=document.getElementById(id);if(!el)return;if(id!=='bgm_main')el.volume=id==='sfx_ui'?.38:.58;if(!canUseHtmlAudio(el)){blockedRemoteAudio.add(id);return}el.load?.()})}
function playSound(id,type='beep'){if(isMuted)return;const el=document.getElementById(id);if(el&&canUseHtmlAudio(el)){try{el.pause();el.currentTime=0;el.play().catch(()=>{blockedRemoteAudio.add(id);playSynth(type)});return}catch(e){blockedRemoteAudio.add(id);playSynth(type);return}}playSynth(type)}function playSynth(type){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const n=audioCtx.currentTime;if(type==='coin'){o.type='triangle';o.frequency.setValueAtTime(520,n);o.frequency.exponentialRampToValueAtTime(980,n+.12);g.gain.setValueAtTime(.22,n);g.gain.exponentialRampToValueAtTime(.01,n+.12);o.start(n);o.stop(n+.12)}else if(type==='fail'){o.type='sawtooth';o.frequency.setValueAtTime(120,n);o.frequency.linearRampToValueAtTime(42,n+.36);g.gain.setValueAtTime(.24,n);g.gain.linearRampToValueAtTime(.01,n+.36);o.start(n);o.stop(n+.36)}}function vibrate(s){if(navigator.vibrate)navigator.vibrate(s==='heavy'?200:50)}
function resize(){cw=document.documentElement.clientWidth;ch=document.documentElement.clientHeight;dpr=devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(hero.x>cw||hero.y>ch){hero.x=cw/2;hero.y=ch/2;hero.targetX=hero.x;hero.targetY=hero.y}}function initGame(){score=0;lives=CONSTANTS.MAX_LIVES;spawnTimer=0;crops=[];particles=[];hero.x=cw/2;hero.y=ch/2;hero.targetX=cw/2;hero.targetY=ch/2;for(let i=0;i<3;i++)spawnCrop();updateUI()}function spawnCrop(){const m=50,x=m+Math.random()*Math.max(1,cw-m*2),y=m+Math.random()*Math.max(1,ch-m*2);for(const c of crops){const dx=c.x-x,dy=c.y-y;if(Math.sqrt(dx*dx+dy*dy)<CONSTANTS.CROP_RADIUS*2.5)return}crops.push({x,y,state:'GROWING',timer:0,scale:0,spin:Math.random()*Math.PI*2})}
function updateGame(dt){const speed=gameConfig.heroSpeed||8;hero.x+=(hero.targetX-hero.x)*(speed*dt*2);hero.y+=(hero.targetY-hero.y)*(speed*dt*2);if(!isFinite(hero.x)||!isFinite(hero.y)){hero.x=cw/2;hero.y=ch/2}spawnTimer++;if(spawnTimer>(gameConfig.spawnRate||60)){spawnCrop();spawnTimer=0}for(let i=crops.length-1;i>=0;i--){let c=crops[i];c.timer++;if(c.state==='GROWING'){c.scale=Math.min(1,c.timer/60);if(c.timer>CONSTANTS.GROWTH_TIME){c.state='RIPE';c.timer=0;c.scale=1.2;if(ripeCueCooldown<=0){playSound('sfx_ripe','coin');ripeCueCooldown=18}}}else if(c.state==='RIPE'){c.scale+=(1-c.scale)*.1;if(c.timer>CONSTANTS.ROT_TIME){c.state='ROTTING';c.timer=0;lives--;playSound('sfx_fail','fail');showGif('fail-gif',c.x/Math.max(cw,1),c.y/Math.max(ch,1));vibrate('heavy');createParticles(c.x,c.y,'#d92935',10);updateUI();if(lives<=0)setState('GAMEOVER')}}else if(c.state==='ROTTING'){c.scale-=.05;if(c.scale<=0)crops.splice(i,1)}if(c.state==='RIPE'){const dx=hero.x-c.x,dy=hero.y-c.y;if(Math.sqrt(dx*dx+dy*dy)<CONSTANTS.HERO_RADIUS+CONSTANTS.CROP_RADIUS){score+=10;playSound('sfx_harvest','coin');showGif('harvest-gif',c.x/Math.max(cw,1),c.y/Math.max(ch,1));vibrate('light');createParticles(c.x,c.y,'#ffb13b',8);crops.splice(i,1);updateUI()}}}ripeCueCooldown=Math.max(0,ripeCueCooldown-1);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.05;if(p.life<=0)particles.splice(i,1)}}function createParticles(x,y,color,count){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1,color})}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h));ctx.fill()}function drawBackground(){const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#07070d');g.addColorStop(.48,'#12101a');g.addColorStop(1,'#21120e');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#ffb13b';ctx.beginPath();ctx.arc(cw*.76,ch*.13,Math.min(cw,ch)*.105,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#18151d';ctx.beginPath();ctx.moveTo(cw*.18,0);ctx.lineTo(cw*.82,0);ctx.lineTo(cw*.96,ch);ctx.lineTo(cw*.04,ch);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,177,59,.13)';ctx.lineWidth=2;ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(cw/2,0);ctx.lineTo(cw/2,ch);ctx.stroke();ctx.setLineDash([]);drawHouses();drawLeaves();drawFog();ctx.restore()}function drawHouses(){const n=Math.max(4,Math.floor(ch/170));for(let i=0;i<n;i++){const y=i*165+(frameClock*6%165)-130;house(18,y,.9,i%3===0);house(cw-74,y+72,.82,i%2===0)}}function house(x,y,s,lit){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(14,12,18,.88)';rr(0,28,64,42,4);ctx.fillStyle='#0b0910';ctx.beginPath();ctx.moveTo(-5,31);ctx.lineTo(32,4);ctx.lineTo(69,31);ctx.closePath();ctx.fill();ctx.fillStyle=lit?'rgba(255,177,59,.82)':'rgba(84,61,45,.45)';rr(12,40,13,15,2);rr(40,40,13,15,2);ctx.fillStyle='rgba(255,119,38,.35)';ctx.beginPath();ctx.arc(32,72,7,0,Math.PI*2);ctx.fill();ctx.restore()}function drawLeaves(){for(let i=0;i<36;i++){const x=(i*73+frameClock*(8+i%5))%(cw+40)-20,y=(i*127+frameClock*(14+i%3))%(ch+40)-20;ctx.save();ctx.translate(x,y);ctx.rotate((frameClock*.7+i)%6.28);ctx.globalAlpha=.34;ctx.fillStyle=i%2?'#a9501d':'#d07822';ctx.beginPath();ctx.ellipse(0,0,6,2.5,0,0,Math.PI*2);ctx.fill();ctx.restore()}}function drawFog(){for(let i=0;i<5;i++){const y=ch*(.18+i*.17),x=(frameClock*(6+i)%(cw+240))-120,f=ctx.createRadialGradient(x,y,0,x,y,130);f.addColorStop(0,'rgba(242,238,228,.06)');f.addColorStop(1,'rgba(242,238,228,0)');ctx.fillStyle=f;ctx.fillRect(0,0,cw,ch)}}
function drawClue(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(frameClock*2+c.spin)*.08);ctx.scale(c.scale,c.scale);if(c.state==='GROWING'){ctx.globalAlpha=.72;ctx.fillStyle='#5b3727';ctx.beginPath();ctx.arc(0,0,CONSTANTS.CROP_RADIUS,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7a26';ctx.beginPath();ctx.arc(0,0,CONSTANTS.CROP_RADIUS*.72,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,12);ctx.stroke()}else if(c.state==='RIPE'){ctx.shadowColor='#ffb13b';ctx.shadowBlur=16;ctx.fillStyle='#fff4c2';ctx.beginPath();ctx.arc(0,0,CONSTANTS.CROP_RADIUS*1.18,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#12101a';rr(-12,-4,24,15,3);ctx.fillStyle='#ffb13b';ctx.beginPath();ctx.arc(0,1,5,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='rgba(216,41,53,.72)';ctx.beginPath();ctx.arc(0,0,CONSTANTS.CROP_RADIUS*.82,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#07070d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(10,10);ctx.moveTo(10,-10);ctx.lineTo(-10,10);ctx.stroke()}ctx.restore()}function drawParticles(){for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function drawHero(){ctx.save();ctx.translate(hero.x,hero.y);const dx=hero.targetX-hero.x,dy=hero.targetY-hero.y,a=Math.atan2(dy,dx||.001);ctx.rotate(Math.max(-.2,Math.min(.2,Math.sin(a)*.12)));ctx.fillStyle='rgba(255,177,59,.13)';ctx.beginPath();ctx.ellipse(0,25,28,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#192052';rr(-13,-5,26,34,9);ctx.fillStyle='#d7c1a0';ctx.beginPath();ctx.arc(0,-17,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4e291c';ctx.beginPath();ctx.arc(-5,-20,3,0,Math.PI*2);ctx.arc(5,-20,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4e291c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-14,6,.1*Math.PI,.9*Math.PI);ctx.stroke();ctx.fillStyle='#ffb13b';ctx.beginPath();ctx.moveTo(16,-10);ctx.lineTo(55,-22);ctx.lineTo(18,4);ctx.closePath();ctx.fill();ctx.fillStyle='#fff8df';ctx.beginPath();ctx.arc(57,-23,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5d3427';rr(-19,16,38,15,6);ctx.restore()}function drawShape(){const t=frameClock*.22,x=cw*.5+Math.sin(t*.55)*cw*.28,y=42+Math.sin(t)*8;ctx.save();ctx.translate(x,y);ctx.globalAlpha=.5;ctx.fillStyle='#07070d';rr(-18,10,36,54,12);ctx.fillStyle='#f2eee4';ctx.beginPath();ctx.ellipse(0,0,13,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#050508';ctx.beginPath();ctx.ellipse(-5,-4,2.2,4,0,0,Math.PI*2);ctx.ellipse(5,-4,2.2,4,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d8dde7';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(18,18);ctx.lineTo(36,44);ctx.stroke();ctx.restore()}
function drawGame(){frameClock+=1/60;drawBackground();drawShape();for(const c of crops)drawClue(c);drawParticles();drawHero()}function loop(ts){if(!lastTime)lastTime=ts;const dt=(ts-lastTime)/1000;lastTime=ts;try{if(gameState==='PLAYING')updateGame(Math.min(dt,.1));drawGame()}catch(e){console.error('Loop error',e)}gameLoopId=requestAnimationFrame(loop)}function handleInput(e){e.preventDefault();unlockAudio();if(gameState==='GAMEOVER')return;if(gameState==='PLAYING'){const r=canvas.getBoundingClientRect();hero.targetX=e.clientX-r.left;hero.targetY=e.clientY-r.top}}
function restartGame(){playSound('sfx_ui','coin');clearFeedback();initGame();setState('PLAYING')}function setState(s){gameState=s;const hud=document.getElementById('hud'),over=document.getElementById('game-over-screen');if(s==='PLAYING'){hud.classList.remove('opacity-0');over.classList.add('hidden')}else if(s==='GAMEOVER'){hud.classList.add('opacity-0');over.classList.remove('hidden');document.getElementById('final-score').innerText=score;playSound('sfx_gameover','fail');showGif('fail-gif',.78,.26)}syncBgm()}function updateUI(){document.getElementById('score-display').innerText=score;document.getElementById('lives-display').innerText=lives}
window.addEventListener('DOMContentLoaded',()=>{parseConfig();canvas=document.getElementById('gameCanvas');ctx=canvas.getContext('2d',{alpha:false});resize();addEventListener('resize',resize);initAudio();primeMedia();canvas.addEventListener('pointerdown',handleInput,{passive:false});canvas.addEventListener('pointermove',handleInput,{passive:false});canvas.addEventListener('pointerup',e=>e.preventDefault(),{passive:false});document.getElementById('restart-btn').addEventListener('click',e=>{e.stopPropagation();unlockAudio();restartGame()});initGame();setState('PLAYING');requestAnimationFrame(loop)});window.updateGameConfig=(k,v)=>{if(window.gameConfigDefs[k])window.gameConfig[k]=v};window.__gameDebug=()=>({gameState,score,lives,crops:crops.map(c=>({state:c.state,timer:c.timer})),hero:{...hero},constants:{...CONSTANTS}});
</script></body></html>
