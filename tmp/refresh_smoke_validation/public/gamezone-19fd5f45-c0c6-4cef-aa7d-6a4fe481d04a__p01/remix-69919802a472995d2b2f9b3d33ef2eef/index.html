-size:clamp(1.25rem,5vw,1.65rem);letter-spacing:.16em;text-transform:uppercase;box-shadow:0 12px 28px rgba(255,216,107,.24),0 0 18px rgba(255,216,107,.24);touch-action:manipulation}.arcade-btn:active{transform:scale(.97);filter:brightness(1.08)}.flash{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(255,62,125,.24);animation:flash .16s ease forwards}@keyframes flash{to{opacity:0}}@media(max-width:640px){#feedback-stack{top:auto;left:.85rem;right:.85rem;bottom:max(5.1rem,calc(var(--safe-bottom) + 3.9rem));align-items:stretch}.reaction-card{max-width:none;min-height:3.75rem}.reaction-card img{width:3.25rem;height:3.25rem}.tower-left,.tower-right{width:24vw;height:31vh;opacity:.55}.objective{font-size:.66rem;max-width:92vw}}</style>

<div id="game-container"><canvas id="gameCanvas" aria-label="Tap falling sigils before they pass the arena"></canvas><div class="runes"></div><div class="tower-left"></div><div class="tower-right"></div><div class="scene-vignette"></div><div id="ui-layer"><div id="hud" class="hud"><div class="hud-card"><span class="hud-label">HEX TROPHIES</span><span id="score-display" class="hud-value">0</span></div><div class="hud-card" style="text-align:right"><span class="hud-label">FIREWALL WARDS</span><div id="lives-display" class="ward-row"><div class="ward"></div><div class="ward"></div><div class="ward"></div></div></div></div><div class="objective">Tap falling commands. Claim golden elixir. Avoid cursed prompts.</div><div id="feedback-stack" aria-live="polite"></div><div id="game-over-screen" class="overlay hidden"><div class="modal"><h1>ORACLE OVERRUN</h1><p>FINAL HEX TROPHIES: <strong id="final-score">0</strong></p><button id="restart-btn" class="arcade-btn">Recast</button></div></div></div></div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false}),feedbackStack=document.getElementById('feedback-stack');let cw=0,ch=0,dpr=1;const defs=JSON.parse(document.getElementById('game-config').textContent),gameConfig={};Object.keys(defs).forEach(k=>gameConfig[k]=defs[k].value);let gameState='BOOT',lastTime=0,score=0,lives=3,spawnTimer=0,difficultyMultiplier=1,targets=[],particles=[],floatingTexts=[],shakeIntensity=0,shakeDecay=.9;const bgm=document.getElementById('bgm_main'),audioNodes={hit:document.getElementById('sfx_hit'),bonus:document.getElementById('sfx_bonus'),fail:document.getElementById('sfx_fail'),click:document.getElementById('sfx_click'),gameover:document.getElementById('sfx_gameover')};const sfxThrottle=new Map();let audioUnlocked=false;
function ensureAudioReady(){if(audioUnlocked)return;audioUnlocked=true;bgm.volume=.18;Object.values(audioNodes).forEach(a=>{a.volume=a===audioNodes.fail?.42:.45;try{a.load()}catch(_){}})}function startBgm(){if(audioUnlocked&&bgm.paused)bgm.play().catch(()=>{})}function stopBgm(){if(!bgm.paused)bgm.pause()}function unlockAudio(){ensureAudioReady();startBgm()}function playMediaSound(k,c=90){if(!audioUnlocked)return;const s=audioNodes[k];if(!s)return;const n=performance.now();if((sfxThrottle.get(k)||0)>n)return;sfxThrottle.set(k,n+c);try{s.pause();s.currentTime=0;s.play().catch(()=>{})}catch(_){}}function playSfx(t){if(t==='shatter')playMediaSound('hit',70);else if(t==='bonus')playMediaSound('bonus',100);else if(t==='hit')playMediaSound('fail',140);else if(t==='gameover')playMediaSound('gameover',400);else if(t==='click')playMediaSound('click',120)}function vibrate(style){if(window.webkit?.messageHandlers?.gamezoneBridge)window.webkit.messageHandlers.gamezoneBridge.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style}});else if(navigator.vibrate)navigator.vibrate(style==='heavy'?40:15)}
function resize(){dpr=window.devicePixelRatio||1;const r=canvas.getBoundingClientRect();cw=r.width;ch=r.height;canvas.width=cw*dpr;canvas.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function initGame(){score=0;lives=3;difficultyMultiplier=1;spawnTimer=0;targets=[];particles=[];floatingTexts=[];shakeIntensity=0;clearFeedback();updateHUD();spawnTarget()}function setState(s){gameState=s;const over=document.getElementById('game-over-screen');if(s==='PLAYING'){over.classList.add('hidden');startBgm()}else if(s==='GAMEOVER'){document.getElementById('final-score').innerText=score;over.classList.remove('hidden');stopBgm();playSfx('gameover');showReaction('DARK ASSISTANT WINS','The evil oracle flooded the arena with forbidden output.','https://i.giphy.com/PoGkJRiJ0Q7HgB8XTt.webp',2600)}}function restartGame(){playSfx('click');unlockAudio();initGame();setState('PLAYING')}
class Target{constructor(){const padding=40;this.w=50+Math.random()*30;this.h=this.w;this.x=padding+Math.random()*Math.max(1,cw-padding*2-this.w);this.y=-100;this.vy=gameConfig.gravity*.2+Math.random()*100;this.rot=Math.random()*Math.PI*2;this.rotSpeed=(Math.random()-.5)*2;const r=Math.random();if(r<.15){this.type=2;this.color='#ff3e7d';this.sides=3;this.name='Cursed Prompt'}else if(r<.25){this.type=1;this.color='#ffd86b';this.sides=6;this.name='Elixir Crown'}else{this.type=0;this.color=gameConfig.themeColor;this.sides=4;this.name='Command Sigil'}this.markedForDeletion=false}update(dt){this.y+=this.vy*dt*(1+(difficultyMultiplier-1)*.5);this.rot+=this.rotSpeed*dt;if(this.y>ch){this.markedForDeletion=true;if(this.type!==2)loseLife()}}draw(c){c.save();c.translate(this.x,this.y);c.rotate(this.rot);const r=this.w/2;c.shadowColor=this.color;c.shadowBlur=18;c.lineWidth=3;c.strokeStyle=this.color;c.fillStyle=this.color;c.globalAlpha=.24;c.beginPath();for(let i=0;i<this.sides;i++){const a=i/this.sides*Math.PI*2-Math.PI/2,px=Math.cos(a)*r,py=Math.sin(a)*r;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath();c.fill();c.globalAlpha=1;c.stroke();if(this.type===2){c.fillStyle='#fff3fa';c.beginPath();c.moveTo(0,-r*.52);c.lineTo(r*.44,r*.34);c.lineTo(-r*.44,r*.34);c.closePath();c.fill();c.strokeStyle='#fff3fa';c.lineWidth=2;c.beginPath();c.moveTo(-r*.22,-r*.04);c.lineTo(r*.22,r*.18);c.moveTo(r*.22,-r*.04);c.lineTo(-r*.22,r*.18);c.stroke()}else if(this.type===1){c.fillStyle='#fff8d4';c.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,o=i%2?r*.24:r*.58,px=Math.cos(a)*o,py=Math.sin(a)*o;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath();c.fill();c.strokeStyle='#7b4600';c.lineWidth=2;c.strokeRect(-r*.18,-r*.02,r*.36,r*.22)}else{drawEvilAssistantFace(c,r)}c.restore()}checkHit(px,py){const dx=px-this.x,dy=py-this.y;return dx*dx+dy*dy<this.w*this.w}}
function drawEvilAssistantFace(c,r){c.strokeStyle='#e8ffff';c.fillStyle='#e8ffff';c.lineWidth=2;c.beginPath();c.arc(0,0,r*.49,0,Math.PI*2);c.stroke();c.beginPath();c.arc(-r*.16,-r*.1,r*.075,0,Math.PI*2);c.arc(r*.16,-r*.1,r*.075,0,Math.PI*2);c.fill();c.beginPath();c.moveTo(-r*.22,r*.17);c.quadraticCurveTo(0,r*.02,r*.22,r*.17);c.stroke();c.strokeStyle='rgba(255,216,107,.9)';c.beginPath();c.moveTo(0,-r*.82);c.lineTo(r*.16,-r*.55);c.lineTo(-r*.16,-r*.55);c.closePath();c.stroke()}
class Particle{constructor(x,y,color){this.x=x;this.y=y;const a=Math.random()*Math.PI*2,s=100+Math.random()*300;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.life=1;this.decay=1.5+Math.random();this.color=color;this.size=2+Math.random()*5}update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=500*dt;this.life-=this.decay*dt}draw(c){if(this.life<=0)return;c.save();c.globalAlpha=this.life;c.fillStyle=this.color;c.shadowColor=this.color;c.shadowBlur=10;c.beginPath();c.arc(this.x,this.y,this.size,0,Math.PI*2);c.fill();c.restore()}}class FloatingText{constructor(x,y,text,color){this.x=x;this.y=y;this.text=text;this.color=color;this.life=1;this.vy=-50}update(dt){this.y+=this.vy*dt;this.life-=1.5*dt}draw(c){if(this.life<=0)return;c.save();c.globalAlpha=this.life;c.fillStyle=this.color;c.font='700 24px Orbitron';c.textAlign='center';c.shadowColor=this.color;c.shadowBlur=12;c.fillText(this.text,this.x,this.y);c.restore()}}
function clearFeedback(){feedbackStack.innerHTML=''}function showReaction(title,text,imageUrl,duration=1000){const card=document.createElement('div');card.className='reaction-card';card.innerHTML=`<img src="${imageUrl}" alt="" loading="lazy" decoding="async"><div><span class="reaction-title">${title}</span><span class="reaction-text">${text}</span></div>`;feedbackStack.appendChild(card);requestAnimationFrame(()=>card.classList.add('visible'));setTimeout(()=>{card.classList.remove('visible');setTimeout(()=>card.remove(),220)},duration)}function spawnTarget(){targets.push(new Target())}function createExplosion(x,y,color,count=10){for(let i=0;i<count;i++)particles.push(new Particle(x,y,color))}function loseLife(){lives--;shakeIntensity=15;vibrate('heavy');playSfx('hit');showReaction('WARD BREACH','A command slipped past the king tower firewall.','https://i.giphy.com/1zmG8avB83Uvm.webp',950);const f=document.createElement('div');f.className='flash';document.getElementById('game-container').appendChild(f);setTimeout(()=>f.remove(),180);updateHUD();if(lives<=0)setState('GAMEOVER')}function updateHUD(){document.getElementById('score-display').innerText=score;const lc=document.getElementById('lives-display');lc.innerHTML='';for(let i=0;i<lives;i++){const w=document.createElement('div');w.className='ward';lc.appendChild(w)}}
function gameLoop(ts){if(!lastTime)lastTime=ts;const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;if(gameState==='PLAYING'){spawnTimer+=dt*1000;const rate=Math.max(200,gameConfig.spawnRate-difficultyMultiplier*50);if(spawnTimer>rate){spawnTarget();spawnTimer=0;difficultyMultiplier+=.02}targets.forEach(t=>t.update(dt));targets=targets.filter(t=>!t.markedForDeletion);particles.forEach(p=>p.update(dt));particles=particles.filter(p=>p.life>0);floatingTexts.forEach(t=>t.update(dt));floatingTexts=floatingTexts.filter(t=>t.life>0)}shakeIntensity*=shakeDecay;if(shakeIntensity<.5)shakeIntensity=0;draw(dt);requestAnimationFrame(gameLoop)}
function draw(dt){ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#1a0b35');g.addColorStop(.52,'#110724');g.addColorStop(1,'#05030b');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);const phase=Date.now()/1000;for(let i=0;i<3;i++){const grd=ctx.createRadialGradient(cw*(.25+i*.24),ch*(.2+.08*Math.sin(phase+i)),10,cw*(.25+i*.24),ch*(.2+.08*Math.sin(phase+i)),ch*.42);grd.addColorStop(0,i===1?'rgba(255,216,107,.13)':'rgba(111,247,255,.11)');grd.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grd;ctx.fillRect(0,0,cw,ch)}const dx=(Math.random()-.5)*shakeIntensity,dy=(Math.random()-.5)*shakeIntensity;ctx.translate(dx,dy);drawArena(ctx,phase);ctx.globalCompositeOperation='screen';targets.forEach(t=>t.draw(ctx));particles.forEach(p=>p.draw(ctx));ctx.globalCompositeOperation='source-over';floatingTexts.forEach(t=>t.draw(ctx))}
function drawArena(c,phase){const cx=cw/2,cy=ch*.56,r=Math.min(cw,ch)*.31;c.save();c.strokeStyle='rgba(255,216,107,.2)';c.lineWidth=2;c.beginPath();c.ellipse(cx,cy,r*1.18,r*.42,0,0,Math.PI*2);c.stroke();for(let i=0;i<12;i++){const a=i/12*Math.PI*2+phase*.12,x=cx+Math.cos(a)*r*1.07,y=cy+Math.sin(a)*r*.38;c.fillStyle=i%3?'rgba(111,247,255,.24)':'rgba(255,216,107,.32)';c.beginPath();c.arc(x,y,3+(i%3),0,Math.PI*2);c.fill()}c.strokeStyle='rgba(111,247,255,.1)';c.lineWidth=1;const grid=50,off=phase*20%grid;c.beginPath();for(let x=0;x<=cw;x+=grid){c.moveTo(x,0);c.lineTo(x,ch)}for(let y=off-grid;y<=ch;y+=grid){c.moveTo(0,y);c.lineTo(cw,y)}c.stroke();drawOracle(c,cx,ch*.18,Math.min(88,cw*.16));c.restore()}
function drawOracle(c,x,y,s){c.save();c.translate(x,y);c.shadowColor='#9b5cff';c.shadowBlur=24;c.fillStyle='rgba(33,13,68,.88)';c.strokeStyle='rgba(255,216,107,.65)';c.lineWidth=3;c.beginPath();c.moveTo(0,-s*.62);c.lineTo(s*.58,-s*.18);c.lineTo(s*.42,s*.56);c.lineTo(-s*.42,s*.56);c.lineTo(-s*.58,-s*.18);c.closePath();c.fill();c.stroke();c.fillStyle='#070411';c.strokeStyle='#6ff7ff';c.beginPath();c.roundRect(-s*.33,-s*.22,s*.66,s*.42,10);c.fill();c.stroke();c.fillStyle='#ff3e7d';c.beginPath();c.arc(-s*.14,-s*.04,s*.055,0,Math.PI*2);c.arc(s*.14,-s*.04,s*.055,0,Math.PI*2);c.fill();c.strokeStyle='#ffd86b';c.beginPath();c.moveTo(-s*.18,s*.13);c.quadraticCurveTo(0,s*.24,s*.18,s*.13);c.stroke();c.restore()}
function handleGlobalInput(e){unlockAudio();if(gameState==='GAMEOVER')return;if(gameState==='PLAYING'){const rect=canvas.getBoundingClientRect(),px=e.clientX-rect.left,py=e.clientY-rect.top;let hit=false;for(let i=targets.length-1;i>=0;i--){const t=targets[i];if(t.checkHit(px,py)){t.markedForDeletion=true;hit=true;if(t.type===2){createExplosion(t.x,t.y,'#ff3e7d',30);loseLife()}else{const points=t.type===1?50:10;score+=points;updateHUD();createExplosion(t.x,t.y,t.color,12);floatingTexts.push(new FloatingText(t.x,t.y,`+${points}`,'#fff'));shakeIntensity=8;vibrate('light');playSfx(t.type===1?'bonus':'shatter');if(t.type===1)showReaction('ELIXIR CROWN','+50 trophy surge captured.','https://i.giphy.com/I4OBmAtUfI5MBOiSV5.webp',900);else showReaction('PROMPT COUNTERED','The evil assistant lost one spell thread.','https://i.giphy.com/AYNwsHfAs2AIoWwFqX.webp',700)}break}}}}
window.addEventListener('DOMContentLoaded',()=>{const btn=document.getElementById('restart-btn');if(btn)btn.addEventListener('click',restartGame);window.addEventListener('resize',resize);canvas.addEventListener('pointerdown',handleGlobalInput,{passive:false});canvas.addEventListener('touchmove',e=>{if(gameState==='PLAYING')e.preventDefault()},{passive:false});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBgm();else if(gameState==='PLAYING')startBgm()});resize();initGame();setState('PLAYING');requestAnimationFrame(gameLoop)});
</script></body></html>
