<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Hype Relay</title>
    <link href="catalogs/fonts.json" rel="preload" as="fetch" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #130722;
            --bg-bottom: #02030a;
            --panel: rgba(16, 10, 35, 0.88);
            --panel-edge: rgba(93, 226, 255, 0.9);
            --panel-highlight: rgba(255, 93, 177, 0.8);
            --text-main: #f5f7ff;
            --text-soft: #a9b7db;
            --cyan: #5de2ff;
            --pink: #ff5db1;
            --gold: #ffd86f;
            --danger: #ff4d6d;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(93, 226, 255, 0.16), transparent 30%),
                radial-gradient(circle at 80% 20%, rgba(255, 93, 177, 0.18), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(115deg, transparent 0 44%, rgba(93, 226, 255, 0.08) 44% 46%, transparent 46% 100%),
                linear-gradient(65deg, transparent 0 58%, rgba(255, 93, 177, 0.06) 58% 60%, transparent 60% 100%);
            mix-blend-mode: screen;
        }

        body::after {
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.02) 0 2px,
                    transparent 2px 6px
                );
            opacity: 0.4;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        .hidden { display: none !important; }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .glass {
            position: relative;
            background: linear-gradient(180deg, rgba(26, 14, 54, 0.94), rgba(11, 7, 27, 0.96));
            border: 1.5px solid rgba(93, 226, 255, 0.7);
            box-shadow:
                0 0 0 1px rgba(255, 93, 177, 0.2) inset,
                0 16px 40px var(--shadow),
                0 0 30px rgba(93, 226, 255, 0.16);
            backdrop-filter: blur(12px);
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
            border-radius: inherit;
        }

        .neon-text {
            color: #fff;
            text-shadow: 0 0 6px rgba(255,255,255,0.6), 0 0 16px rgba(93, 226, 255, 0.7);
        }

        .neon-pink {
            color: #fff;
            text-shadow: 0 0 6px rgba(255,255,255,0.55), 0 0 16px rgba(255, 93, 177, 0.9);
        }

        .neon-red {
            color: #fff;
            text-shadow: 0 0 6px rgba(255,255,255,0.55), 0 0 16px rgba(255, 77, 109, 0.9);
        }

        h1, h2, button, #score-display, #hype-container span, .pop-text {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }

        .hero-badge,
        .instruction-chip,
        .status-note {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 999px;
            border: 1px solid rgba(93, 226, 255, 0.35);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-soft);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* UI Elements */
        #hud {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hype-container {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: 10px;
            right: 10px;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #hype-container span {
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            color: var(--gold);
            text-shadow: 0 0 8px rgba(255, 216, 111, 0.45);
            flex: 0 0 auto;
        }

        #hype-bar-bg {
            flex: 1;
            height: 100%;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02)),
                rgba(8, 9, 20, 0.9);
            border: 1.5px solid rgba(255,255,255,0.45);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 0 1px rgba(93, 226, 255, 0.2) inset,
                0 0 18px rgba(93, 226, 255, 0.12);
        }

        #hype-bar-bg::after {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            pointer-events: none;
        }

        #hype-fill {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--pink), var(--cyan));
            transition: width 0.2s, background 0.2s;
            box-shadow: 0 0 20px rgba(255, 93, 177, 0.45);
        }

        #score-display {
            min-width: 78px;
            padding: 4px 8px;
            font-size: 1.3rem;
            color: #fff;
            text-align: right;
            line-height: 1;
            border-radius: 10px;
            background: rgba(11, 7, 27, 0.76);
            border: 1px solid rgba(93, 226, 255, 0.36);
            box-shadow: 0 0 16px rgba(93, 226, 255, 0.14);
        }

        #feedback-layer {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }

        .pop-text {
            font-size: clamp(1.8rem, 8vw, 3rem);
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px black;
            letter-spacing: 0.08em;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }

        @keyframes pulseHalo {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.08); opacity: 0.9; }
        }

        @keyframes equalize {
            0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* Start / End Screens */
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) 16px;
        }

        .menu-card {
            width: min(100%, 360px);
            padding: 18px;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .hero-badge {
            font-size: 0.68rem;
            padding: 6px 12px;
        }

        .title-stack {
            margin: 0;
            font-size: clamp(2.2rem, 10vw, 3.5rem);
            font-weight: 400;
            letter-spacing: 0.06em;
            line-height: 0.94;
        }

        .hero-frame {
            position: relative;
            width: 172px;
            height: 172px;
            border-radius: 50%;
            padding: 8px;
            background: radial-gradient(circle at top, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.18),
                0 0 28px rgba(255, 93, 177, 0.35);
        }

        .hero-frame::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(93, 226, 255, 0.45);
            animation: pulseHalo 2.2s ease-in-out infinite;
        }

        .hero-portrait {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.85);
            background: radial-gradient(circle at 50% 30%, rgba(93, 226, 255, 0.4), rgba(6, 8, 18, 0.95));
        }

        .hero-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-portrait::after {
            content: "";
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: 14px;
            height: 26px;
            border-radius: 999px;
            background:
                linear-gradient(90deg,
                    rgba(255, 93, 177, 0.15) 0 8%,
                    rgba(255, 93, 177, 0.9) 8% 14%,
                    rgba(93, 226, 255, 0.15) 14% 22%,
                    rgba(93, 226, 255, 0.9) 22% 28%,
                    rgba(255, 216, 111, 0.15) 28% 36%,
                    rgba(255, 216, 111, 0.95) 36% 42%,
                    rgba(255, 93, 177, 0.15) 42% 50%,
                    rgba(255, 93, 177, 0.85) 50% 56%,
                    rgba(93, 226, 255, 0.15) 56% 64%,
                    rgba(93, 226, 255, 0.95) 64% 70%,
                    rgba(255, 216, 111, 0.15) 70% 78%,
                    rgba(255, 216, 111, 0.95) 78% 84%,
                    rgba(255, 93, 177, 0.15) 84% 100%);
            box-shadow: 0 0 20px rgba(93, 226, 255, 0.35);
            opacity: 0.92;
        }

        .instruction-chip {
            padding: 8px 12px;
            font-size: 0.68rem;
        }

        .lead-copy {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .sub-copy {
            margin: 0;
            max-width: 26ch;
            font-size: 0.92rem;
            line-height: 1.25;
            color: var(--text-soft);
        }

        .signal-row {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 18px;
        }

        .signal-row i {
            display: block;
            width: 6px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--gold), var(--pink));
            transform-origin: bottom;
            animation: equalize 1s ease-in-out infinite;
        }

        .signal-row i:nth-child(1) { height: 8px; animation-delay: 0s; }
        .signal-row i:nth-child(2) { height: 16px; animation-delay: 0.15s; }
        .signal-row i:nth-child(3) { height: 12px; animation-delay: 0.3s; }
        .signal-row i:nth-child(4) { height: 18px; animation-delay: 0.45s; }
        .signal-row i:nth-child(5) { height: 10px; animation-delay: 0.2s; }

        .arcade-btn {
            border: 0;
            border-radius: 16px;
            padding: 13px 20px;
            min-width: 170px;
            background: linear-gradient(135deg, var(--cyan), #8ef5ff);
            color: #05101d;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(93, 226, 255, 0.28);
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.06);
            outline: none;
        }

        .arcade-btn:active,
        .arcade-btn.is-pressed {
            transform: scale(0.97);
            filter: brightness(1.1);
        }

        .arcade-btn.secondary {
            background: linear-gradient(135deg, var(--pink), #ff88c9);
            color: #fff;
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(255, 93, 177, 0.28);
        }

        .result-frame {
            width: 172px;
            height: 172px;
            margin-bottom: 2px;
            border-radius: 22px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.75);
            box-shadow: 0 0 24px rgba(255, 93, 177, 0.24);
            background: #080611;
        }

        .result-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-note {
            padding: 7px 12px;
            font-size: 0.66rem;
        }

        .reaction-overlay {
            position: absolute;
            right: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            width: clamp(82px, 24vw, 118px);
            height: clamp(82px, 24vw, 118px);
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(93, 226, 255, 0.45);
            background: rgba(8, 6, 17, 0.7);
            box-shadow: 0 0 18px rgba(93, 226, 255, 0.15);
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 24;
        }

        .reaction-overlay.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .reaction-overlay.is-danger {
            border-color: rgba(255, 93, 177, 0.55);
            box-shadow: 0 0 18px rgba(255, 93, 177, 0.2);
        }

        .reaction-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 480px) {
            #hype-container {
                height: 30px;
                gap: 6px;
            }

            #score-display {
                min-width: 68px;
                font-size: 1.05rem;
            }

            .menu-card {
                padding: 16px 14px;
                border-radius: 20px;
                gap: 10px;
            }

            .hero-frame,
            .result-frame {
                width: 148px;
                height: 148px;
            }

            .arcade-btn {
                width: 100%;
                min-width: 0;
            }

            .lead-copy {
                font-size: 0.92rem;
            }

            .sub-copy {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-gif: start/win/lose/overlay -> catalogs/gifs.json -->
<img id="meme_start" src="https://i.giphy.com/ZqlvCTNHpqrio.webp" hidden>
<img id="meme_win" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" hidden>
<img id="meme_lose" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" hidden>
<img id="meme_sync" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" hidden>
<img id="meme_drop" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" hidden>

<!-- [agent-note][stage3] resolved-audio: bgm/ui/hit/fail/win/warning -> catalogs/audios.json -->
<audio id="bgm_fight" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" loop preload="auto"></audio>
<audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
<audio id="sfx_lose" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx_click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>

<!-- Game Container -->
<div id="game-container" class="game-shell">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
        <div id="hud" class="hidden">
            <div id="hype-container">
                <span>SIGNAL</span>
                <div id="hype-bar-bg"><div id="hype-fill"></div></div>
                <div id="score-display">0</div>
            </div>
            <div id="feedback-layer"></div>
            <div id="reaction-overlay" class="reaction-overlay" aria-hidden="true">
                <img id="reaction-overlay-img" src="" alt="Crowd reaction overlay">
            </div>
        </div>

    <!-- UI Screens -->
    <div id="ui-layer">
        <!-- Start -->
        <div id="start-screen" class="glass menu-card">
            <div class="hero-badge">Live relay challenge</div>
            <h1 class="title-stack neon-pink">NEON<br>HYPE RELAY</h1>
            <div class="hero-frame">
                <div class="hero-portrait">
                    <img src="https://i.giphy.com/ZqlvCTNHpqrio.gif" alt="Animated crowd reaction">
                </div>
            </div>
            <div class="instruction-chip">
                <div class="signal-row" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
                <span>Keep the feed hot</span>
            </div>
            <p class="lead-copy">Drag the mic to every caller.</p>
            <p class="sub-copy">Chain clean handoffs, maintain the crowd pulse, and stop the signal from crashing.</p>
            <button id="start-btn" class="arcade-btn">Go live</button>
        </div>

        <!-- End -->
        <div id="game-over-screen" class="hidden glass menu-card">
            <div class="status-note">Transmission result</div>
            <h2 id="end-title" class="title-stack neon-red">SIGNAL LOST</h2>
            <div class="result-frame">
                <img id="end-meme-img" src="" alt="End state reaction">
            </div>
            <p id="final-score" class="lead-copy neon-text">RELAY SCORE: 0</p>
            <button id="restart-btn" class="arcade-btn secondary">Run it back</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Audio System ---
    const sounds = {
        bgm: document.getElementById('bgm_fight'),
        hit: document.getElementById('sfx_hit'),
        win: document.getElementById('sfx_win'),
        lose: document.getElementById('sfx_lose'),
        click: document.getElementById('sfx_click'),
        start: document.getElementById('sfx_start'),
        warning: document.getElementById('sfx_warning')
    };
    let audioUnlocked = false;
    let warningPrimed = false;
    let reactionTimer = null;

    const playSound = (key, vol = 1.0) => {
        if (!audioUnlocked && key !== 'bgm') return;
        const s = sounds[key];
        if (s) {
            if (key !== 'bgm') s.currentTime = 0;
            s.volume = (key === 'bgm') ? 0.3 : vol;
            s.play().catch(() => {});
        }
    };
    const stopSound = (key) => {
        const s = sounds[key];
        if (s) { s.pause(); s.currentTime = 0; }
    };

    // --- Globals ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Refs
    const ui = {
        start: document.getElementById('start-screen'),
        over: document.getElementById('game-over-screen'),
        hud: document.getElementById('hud'),
        hypeFill: document.getElementById('hype-fill'),
        score: document.getElementById('score-display'),
        feedback: document.getElementById('feedback-layer'),
        finalScore: document.getElementById('final-score'),
        endImg: document.getElementById('end-meme-img'),
        reaction: document.getElementById('reaction-overlay'),
        reactionImg: document.getElementById('reaction-overlay-img')
    };

    // Game State
    let state = 'MENU'; // MENU, PLAY, OVER
    let lastTime = 0;

    let score = 0;
    let hype = 100;
    let difficultyTimer = 0;

    // Entities
    let mic = { x: 0, y: 0, r: 30, active: false };
    let singers = [];
    let particles = [];

    // Config
    const SINGER_ROWS = 2;
    const SINGER_COLS = 2;
    const BASE_PATIENCE = 4.0; // Seconds before angry
    const FILL_RATE = 60; // Percent per second

    // --- Resize ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // Reset mic to center bottom initially
        if (!mic.active) {
            mic.x = canvas.width / 2;
            mic.y = canvas.height * 0.8;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function applyButtonFeedback(button) {
        if (!button) return;
        button.addEventListener('pointerdown', () => button.classList.add('is-pressed'));
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
            button.addEventListener(evt, () => button.classList.remove('is-pressed'));
        });
    }

    applyButtonFeedback(document.getElementById('start-btn'));
    applyButtonFeedback(document.getElementById('restart-btn'));

    // --- Core Game Logic ---

    function initGame() {
        score = 0;
        hype = 100;
        difficultyTimer = 0;
        warningPrimed = false;
        state = 'PLAY';

        // Setup Singers Grid
        singers = [];
        const marginX = canvas.width * 0.2;
        const marginY = canvas.height * 0.2;
        const stepX = (canvas.width - marginX * 2) / (SINGER_COLS - 1 || 1);
        const stepY = (canvas.height * 0.4) / (SINGER_ROWS - 1 || 1);
        const startY = canvas.height * 0.25;

        for (let r = 0; r < SINGER_ROWS; r++) {
            for (let c = 0; c < SINGER_COLS; c++) {
                singers.push({
                    x: marginX + c * stepX,
                    y: startY + r * stepY,
                    r: 45,
                    state: 'IDLE',
                    timer: 0,
                    progress: 0,
                    color: `hsl(${Math.random() * 360}, 78%, 58%)`,
                    face: Math.floor(Math.random() * 3)
                });
            }
        }

        mic.x = canvas.width / 2;
        mic.y = canvas.height * 0.8;
        mic.active = true;

        ui.start.classList.add('hidden');
        ui.over.classList.add('hidden');
        ui.hud.classList.remove('hidden');
        hideReactionOverlay();
        updateUI();
        playSound('bgm');
    }

    function spawnPopText(text, x, y, color) {
        const el = document.createElement('div');
        el.className = 'pop-text';
        el.innerText = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.color = color;
        ui.feedback.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function spawnNote(x, y) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: -2 - Math.random() * 3,
            life: 1.0,
            char: ['♪', '♫', '♬'][Math.floor(Math.random() * 3)],
            color: ['#fff', '#5de2ff', '#ffd86f'][Math.floor(Math.random() * 3)]
        });
    }

    function showReactionOverlay(id, variant = '') {
        const source = document.getElementById(id);
        if (!source) return;
        ui.reactionImg.src = source.src;
        ui.reaction.classList.toggle('is-danger', variant === 'danger');
        ui.reaction.classList.add('is-visible');
        clearTimeout(reactionTimer);
        reactionTimer = setTimeout(() => hideReactionOverlay(), 900);
    }

    function hideReactionOverlay() {
        ui.reaction.classList.remove('is-visible', 'is-danger');
    }

    function updateGame(dt) {
        if (state !== 'PLAY') return;

        difficultyTimer += dt;

        // Hype Decay (slowly drains to force action)
        hype -= 1.5 * dt;
        if (hype <= 0) gameOver();

        if (hype < 35 && !warningPrimed) {
            warningPrimed = true;
            playSound('warning', 0.35);
        } else if (hype > 45) {
            warningPrimed = false;
        }

        // Singer Logic
        let activeSingers = singers.filter(s => s.state === 'WAIT' || s.state === 'SINGING').length;
        let maxActive = 1 + Math.floor(difficultyTimer / 15);
        if (maxActive > singers.length) maxActive = singers.length;

        if (activeSingers < maxActive && Math.random() < 0.02 + (difficultyTimer * 0.001)) {
            const idle = singers.filter(s => s.state === 'IDLE');
            if (idle.length > 0) {
                const s = idle[Math.floor(Math.random() * idle.length)];
                s.state = 'WAIT';
                s.timer = BASE_PATIENCE - Math.min(2.0, difficultyTimer * 0.05);
                s.progress = 0;
            }
        }

        singers.forEach(s => {
            if (s.state === 'WAIT') {
                s.timer -= dt;
                const dist = Math.hypot(mic.x - s.x, mic.y - s.y);
                if (dist < s.r + mic.r) {
                    s.state = 'SINGING';
                }

                if (s.timer <= 0) {
                    s.state = 'IDLE';
                    hype -= 15;
                    spawnPopText("DROP!", s.x, s.y, "#ff4d6d");
                    showReactionOverlay('meme_drop', 'danger');
                    playSound('lose', 0.5);
                }
            } else if (s.state === 'SINGING') {
                const dist = Math.hypot(mic.x - s.x, mic.y - s.y);
                if (dist < s.r + mic.r) {
                    s.progress += FILL_RATE * dt;
                    if (Math.random() < 0.3) spawnNote(s.x, s.y - 48);

                    if (s.progress >= 100) {
                        s.state = 'IDLE';
                        score += 100;
                        hype = Math.min(100, hype + 10);
                        spawnPopText("SYNC!", s.x, s.y, "#5de2ff");
                        showReactionOverlay('meme_sync');
                        playSound('hit', 0.6);
                    }
                } else {
                    s.state = 'WAIT';
                }
            }
        });

        updateUI();
    }

    function updateUI() {
        ui.hypeFill.style.width = Math.max(0, hype) + '%';
        ui.score.innerText = score;

        if (hype < 30) {
            ui.hypeFill.style.background = 'linear-gradient(90deg, #ff4d6d, #ffb36b)';
        } else {
            ui.hypeFill.style.background = 'linear-gradient(90deg, #ff5db1, #5de2ff)';
        }
    }

    function gameOver() {
        state = 'OVER';
        stopSound('bgm');
        playSound('lose');

        ui.hud.classList.add('hidden');
        ui.over.classList.remove('hidden');
        ui.finalScore.innerText = "RELAY SCORE: " + score;

        ui.endImg.src = document.getElementById(score > 500 ? 'meme_win' : 'meme_lose').src;
        document.getElementById('end-title').innerText = score > 500 ? "FEED SECURED!" : "SIGNAL DROPPED";
        if (score > 500) playSound('win', 0.65);
    }

     // --- Input ---
     // [agent-note][stage4] repaired: mobile-action-path | element: #start-btn | action: keep native button taps outside gameplay drag input
     const handleMove = (e) => {
         if (state !== 'PLAY') return;
         if (e.type.startsWith('touch')) e.preventDefault();

        let cx, cy;
        if (e.touches) {
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
        } else {
            cx = e.clientX;
            cy = e.clientY;
        }

        mic.x = cx;
        mic.y = cy;
    };

     canvas.addEventListener('pointermove', handleMove);
     canvas.addEventListener('touchmove', handleMove, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        audioUnlocked = true;
        playSound('click', 0.45);
        playSound('start', 0.55);
        initGame();
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
        playSound('click', 0.45);
        initGame();
    });

    // --- Render ---
    function drawBackgroundGrid() {
        ctx.save();
        ctx.strokeStyle = 'rgba(93, 226, 255, 0.08)';
        ctx.lineWidth = 1;
        const step = Math.max(28, canvas.width / 14);
        for (let x = 0; x < canvas.width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, canvas.height * 0.62);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawStageLights() {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';

        ctx.fillStyle = 'rgba(93, 226, 255, 0.08)';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.18, 0);
        ctx.lineTo(0, canvas.height);
        ctx.lineTo(canvas.width * 0.36, canvas.height);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 93, 177, 0.08)';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.82, 0);
        ctx.lineTo(canvas.width * 0.64, canvas.height);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.fill();

        const floorGradient = ctx.createLinearGradient(0, canvas.height * 0.6, 0, canvas.height);
        floorGradient.addColorStop(0, 'rgba(16, 10, 35, 0)');
        floorGradient.addColorStop(1, 'rgba(28, 18, 48, 0.85)');
        ctx.fillStyle = floorGradient;
        ctx.fillRect(0, canvas.height * 0.55, canvas.width, canvas.height * 0.45);
        ctx.restore();
    }

    function drawSinger(s) {
        const bodyGradient = ctx.createRadialGradient(s.x - 10, s.y - 18, 6, s.x, s.y, s.r + 16);
        bodyGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        bodyGradient.addColorStop(0.18, s.state === 'SINGING' ? '#8ef5ff' : s.state === 'WAIT' ? '#ff95cf' : '#ffe391');
        bodyGradient.addColorStop(0.55, s.color);
        bodyGradient.addColorStop(1, '#0a0d1d');

        ctx.save();
        if (s.state === 'WAIT' || s.state === 'SINGING') {
            ctx.shadowBlur = 24;
            ctx.shadowColor = s.state === 'SINGING' ? '#5de2ff' : '#ff5db1';
        }

        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.arc(s.x - 12, s.y - 12, s.r * 0.42, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r - 3, 0, Math.PI * 2);
        ctx.stroke();

        if (s.state === 'SINGING' || s.progress > 0) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r + 8, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * (s.progress / 100)));
            ctx.strokeStyle = '#5de2ff';
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        if (s.state === 'WAIT') {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r + 8, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * (s.timer / BASE_PATIENCE)));
            ctx.strokeStyle = '#ff5db1';
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const eyeY = s.y - 10;
        const eyeOffset = 12;
        ctx.strokeStyle = '#09111c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (s.state === 'SINGING') {
            ctx.arc(s.x - eyeOffset, eyeY, 4, 0, Math.PI * 2);
            ctx.arc(s.x + eyeOffset, eyeY, 4, 0, Math.PI * 2);
        } else if (s.state === 'WAIT') {
            ctx.moveTo(s.x - eyeOffset - 4, eyeY - 2);
            ctx.lineTo(s.x - eyeOffset + 4, eyeY + 2);
            ctx.moveTo(s.x + eyeOffset - 4, eyeY + 2);
            ctx.lineTo(s.x + eyeOffset + 4, eyeY - 2);
        } else {
            ctx.moveTo(s.x - eyeOffset - 4, eyeY);
            ctx.lineTo(s.x - eyeOffset + 4, eyeY);
            ctx.moveTo(s.x + eyeOffset - 4, eyeY);
            ctx.lineTo(s.x + eyeOffset + 4, eyeY);
        }
        ctx.stroke();

        ctx.beginPath();
        if (s.state === 'SINGING') {
            ctx.arc(s.x, s.y + 10, 11, 0, Math.PI * 2);
        } else if (s.state === 'WAIT') {
            ctx.arc(s.x, s.y + 13, 10, 0, Math.PI, true);
        } else {
            ctx.arc(s.x, s.y + 14, 11, 0.15 * Math.PI, 0.85 * Math.PI);
        }
        ctx.stroke();

        const accessoryColor = s.state === 'WAIT' ? '#ff5db1' : s.state === 'SINGING' ? '#5de2ff' : '#ffd86f';
        ctx.fillStyle = accessoryColor;
        ctx.beginPath();
        ctx.moveTo(s.x - 18, s.y - 32);
        ctx.lineTo(s.x - 4, s.y - 45);
        ctx.lineTo(s.x + 10, s.y - 34);
        ctx.lineTo(s.x + 18, s.y - 46);
        ctx.lineTo(s.x + 26, s.y - 34);
        ctx.lineTo(s.x + 18, s.y - 20);
        ctx.lineTo(s.x - 16, s.y - 18);
        ctx.closePath();
        ctx.globalAlpha = 0.8;
        ctx.fill();

        if (s.state === 'SINGING') {
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.font = '20px Orbitron, Rajdhani, sans-serif';
            ctx.fillText('♪', s.x + 30, s.y - 26);
        }
        ctx.restore();
    }

    function drawMic() {
        ctx.save();

        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height);
        ctx.quadraticCurveTo(canvas.width / 2, mic.y + 100, mic.x, mic.y);
        ctx.strokeStyle = '#151826';
        ctx.lineWidth = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height);
        ctx.quadraticCurveTo(canvas.width / 2, mic.y + 100, mic.x, mic.y);
        ctx.strokeStyle = 'rgba(93, 226, 255, 0.18)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(255,255,255,0.6)';

        const handleGradient = ctx.createLinearGradient(mic.x, mic.y, mic.x, mic.y + 60);
        handleGradient.addColorStop(0, '#eff3ff');
        handleGradient.addColorStop(0.35, '#6adfff');
        handleGradient.addColorStop(1, '#21324b');
        ctx.fillStyle = handleGradient;
        ctx.beginPath();
        ctx.moveTo(mic.x - 11, mic.y + 2);
        ctx.lineTo(mic.x - 6, mic.y + 60);
        ctx.lineTo(mic.x + 6, mic.y + 60);
        ctx.lineTo(mic.x + 11, mic.y + 2);
        ctx.closePath();
        ctx.fill();

        const headGradient = ctx.createRadialGradient(mic.x - 6, mic.y - 8, 5, mic.x, mic.y, 28);
        headGradient.addColorStop(0, '#ffffff');
        headGradient.addColorStop(0.25, '#bdf6ff');
        headGradient.addColorStop(0.6, '#4fbad5');
        headGradient.addColorStop(1, '#09131f');
        ctx.fillStyle = headGradient;
        ctx.beginPath();
        ctx.arc(mic.x, mic.y, 25, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(8, 16, 24, 0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = -20; i < 20; i += 8) {
            ctx.moveTo(mic.x + i, mic.y - Math.sqrt(400 - i * i));
            ctx.lineTo(mic.x + i, mic.y + Math.sqrt(400 - i * i));
            ctx.moveTo(mic.x - Math.sqrt(400 - i * i), mic.y + i);
            ctx.lineTo(mic.x + Math.sqrt(400 - i * i), mic.y + i);
        }
        ctx.stroke();

        ctx.restore();
    }

    function draw() {
        const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGradient.addColorStop(0, '#140722');
        bgGradient.addColorStop(0.55, '#090815');
        bgGradient.addColorStop(1, '#030409');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawStageLights();
        drawBackgroundGrid();

        singers.forEach(drawSinger);

        if (state === 'PLAY') {
            drawMic();
        }

        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.font = '24px Orbitron, Rajdhani, sans-serif';
            ctx.fillText(p.char, p.x, p.y);
            if (p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        requestAnimationFrame(loop);
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        updateGame(dt);
        draw();
    }

    requestAnimationFrame(loop);
});
</script>
