<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Soap Slice ASMR</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --sky-top: #081226;
        --sky-bottom: #163b52;
        --mist: #8af5ff;
        --foam-core: #ffa5df;
        --foam-highlight: #ffe4ff;
        --foam-deep: #ff5db1;
        --hazard-core: #33495f;
        --hazard-edge: #0c1624;
        --hud-bg: rgba(7, 20, 39, 0.7);
        --hud-border: rgba(138, 245, 255, 0.42);
        --panel-bg: rgba(9, 22, 42, 0.78);
        --panel-shadow: rgba(0, 0, 0, 0.35);
        --text-main: #ecfeff;
        --text-soft: #b9d8ea;
        --accent: #ff73c6;
        --accent-strong: #7cf2ff;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at top, #14385b 0%, var(--sky-top) 48%, #040812 100%); font-family: 'Orbitron', system-ui, sans-serif; }
    body { color: var(--text-main); }
    canvas { display: block; touch-action: none; }
    button { font: inherit; border: 0; cursor: pointer; }
    .hidden { display: none !important; }
    .absolute-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .w-80 { width: min(20rem, calc(100vw - 2rem)); }
    .select-none { user-select: none; -webkit-user-select: none; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-start { align-items: flex-start; }
    .text-center { text-align: center; }
    .glass {
        background:
            linear-gradient(180deg, rgba(15, 35, 61, 0.92) 0%, rgba(8, 20, 40, 0.88) 100%);
        backdrop-filter: blur(14px);
        border: 1px solid var(--hud-border);
        box-shadow:
            0 18px 40px var(--panel-shadow),
            inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .p-6 { padding: 1.5rem; }
    .p-8 { padding: 2rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .px-8 { padding-left: 2rem; padding-right: 2rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .ml-2 { margin-left: 0.5rem; }
    .rounded-full { border-radius: 9999px; }
    .rounded-3xl { border-radius: 1.5rem; }
    .shadow-lg { box-shadow: 0 18px 30px rgba(15, 23, 42, 0.18); }
    .transform { transform: translateZ(0); }
    .transition { transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease; }
    .active\:scale-95:active { transform: scale(0.95); }
    .text-sm { font-size: 0.875rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-3xl { font-size: 1.875rem; }
    .text-4xl { font-size: 2.25rem; }
    .text-5xl { font-size: 3rem; }
    .font-bold { font-weight: 700; }
    .tracking-wide { letter-spacing: 0.08em; }
    .text-pink-500 { color: #ec4899; }
    .text-gray-700 { color: #374151; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-400 { color: #9ca3af; }
    .text-white { color: #fff; }
    .bg-pink-400 { background: linear-gradient(180deg, #f472b6 0%, #ec4899 100%); }
    .bg-pink-400:hover, .hover\:bg-pink-500:hover { background: linear-gradient(180deg, #ec4899 0%, #db2777 100%); }
    .bg-gray-700 { background: linear-gradient(180deg, #475569 0%, #334155 100%); }
    .bg-gray-700:hover, .hover\:bg-gray-800:hover { background: linear-gradient(180deg, #334155 0%, #1f2937 100%); }
    .panel-subtitle { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent-strong); }
    .panel-emoji {
        filter: drop-shadow(0 0 18px rgba(124, 242, 255, 0.55));
        transform-origin: center;
    }
    .title-font { font-family: 'Bangers', 'Orbitron', system-ui, sans-serif; }
    .hud-label { text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-soft); }
    .feedback-strip {
        position: absolute;
        left: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom, 0px) + 0.5rem);
        transform: translateX(-50%);
        width: min(18rem, calc(100vw - 2rem));
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-align: center;
        background: rgba(8, 18, 34, 0.76);
        border: 1px solid rgba(124, 242, 255, 0.34);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
        opacity: 0;
        transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .feedback-strip.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(-4px);
    }
    .feedback-text {
        font-size: 0.65rem;
        line-height: 1.4;
        color: var(--foam-highlight);
    }
    .feedback-icon {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(255, 115, 198, 0.28), rgba(124, 242, 255, 0.12));
        color: var(--accent-strong);
        flex: 0 0 auto;
    }
    .reaction-gif {
        position: absolute;
        right: 1rem;
        bottom: 5.75rem;
        width: min(7rem, 30vw);
        aspect-ratio: 1 / 1;
        border-radius: 1.1rem;
        object-fit: cover;
        border: 1px solid rgba(124, 242, 255, 0.38);
        box-shadow: 0 12px 22px rgba(0, 0, 0, 0.28);
        background: rgba(8, 18, 34, 0.72);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .reaction-gif.visible {
        opacity: 0.95;
        transform: translateY(0) scale(1);
    }
    .reaction-gif.fail {
        left: 1rem;
        right: auto;
    }
    .reaction-gif.hidden-media {
        display: none;
    }
    .hud-pill {
        background: linear-gradient(180deg, rgba(7, 23, 42, 0.88), rgba(10, 30, 54, 0.82));
        border: 1px solid rgba(124, 242, 255, 0.35);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    }
    .score-value {
        color: #ffd4f3;
        text-shadow: 0 0 12px rgba(255, 115, 198, 0.45);
    }
    .panel-copy { color: var(--text-soft); }
    .panel-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(124, 242, 255, 0.55), rgba(255, 115, 198, 0.55));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }
    .foam-orbit {
        position: absolute;
        inset: -12px;
        pointer-events: none;
        opacity: 0.9;
    }
    .foam-orbit span {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(124,242,255,0.3) 55%, rgba(124,242,255,0) 70%);
        box-shadow: 0 0 10px rgba(124, 242, 255, 0.45);
        animation: orbitFloat 2.8s ease-in-out infinite;
    }
    .foam-orbit span:nth-child(1) { top: 18%; left: 14%; }
    .foam-orbit span:nth-child(2) { top: 55%; right: 10%; width: 10px; height: 10px; animation-delay: 0.6s; }
    .foam-orbit span:nth-child(3) { bottom: 14%; left: 26%; width: 8px; height: 8px; animation-delay: 1.1s; }
    .foam-orbit span:nth-child(4) { top: 8%; right: 24%; width: 7px; height: 7px; animation-delay: 1.6s; }
    .cta-btn {
        position: relative;
        overflow: hidden;
        box-shadow: 0 16px 26px rgba(0, 0, 0, 0.28);
    }
    .cta-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.2) 45%, transparent 70%);
        transform: translateX(-120%);
        transition: transform 0.3s ease;
    }
    .cta-btn:hover::after { transform: translateX(120%); }
    .animate-bounce { animation: bounce 1.4s infinite; }
    .animate-pulse-soft { animation: pulseSoft 2.2s ease-in-out infinite; }
    @keyframes orbitFloat {
        0%, 100% { transform: translateY(0) scale(0.95); opacity: 0.55; }
        50% { transform: translateY(-8px) scale(1.12); opacity: 1; }
    }
    @keyframes pulseSoft {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.04); filter: brightness(1.08); }
    }
    @keyframes bounce {
        0%, 20%, 53%, 80%, 100% { transform: translateY(0); }
        40%, 43% { transform: translateY(-14px); }
        70% { transform: translateY(-7px); }
        90% { transform: translateY(-3px); }
    }
</style>
</head>
<body>

<!-- Editable Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "scrollSpeed": { "type": "number", "label": "Scroll Speed", "value": 4, "min": 1, "max": 10 },
    "soapColor": { "type": "color", "label": "Soap Color", "value": "#FFB7B2" },
    "obstacleColor": { "type": "color", "label": "Rock Color", "value": "#546E7A" }
}
</script>

<!-- Asset Declarations -->
<audio id="bgm_main" data-editable="audio" data-label="BGM (Arcade Loop)" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_hit" data-editable="audio" data-label="Rock Hit SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<audio id="sfx_slice" data-editable="audio" data-label="Slice Success SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="Button UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_warning" data-editable="audio" data-label="Danger Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between p-6">
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start hidden">
            <div class="glass hud-pill px-6 py-2 rounded-full">
                <span class="text-lg font-bold hud-label">CUTS</span>
                <span id="score" class="text-2xl font-bold ml-2 score-value">0</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute-center glass panel-card relative p-8 rounded-3xl text-center pointer-events-auto w-80">
            <div class="foam-orbit" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <h1 class="text-4xl font-bold mb-2 tracking-wide title-font" style="color: var(--foam-highlight); text-shadow: 0 0 18px rgba(255, 115, 198, 0.3);">FOAM CHOP ARCADE</h1>
            <p class="mb-6 text-lg panel-subtitle">Neon lather survival slicer</p>
            <div class="animate-bounce animate-pulse-soft mb-4 text-4xl panel-emoji">🫧</div>
            <p class="text-sm mb-6 panel-copy">Hold to carve the glowing foam stream • avoid the dark stone chunks</p>
            <!-- [agent-note][stage1] role: future-audio | trigger: successful-cut | intent: amplify arcade satisfaction -->
            <button id="start-btn" class="bg-pink-400 hover:bg-pink-500 cta-btn text-white text-xl font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 w-full title-font" style="font-size: 1rem;">
                START RUN
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="absolute-center glass panel-card relative p-8 rounded-3xl text-center pointer-events-auto w-80 hidden">
            <div class="foam-orbit" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <h2 class="text-3xl font-bold mb-4 title-font" style="color: #ffd6ea;">JAMMED!</h2>
            <div class="mb-2 panel-subtitle">Clean cuts banked</div>
            <div id="finalScore" class="text-5xl font-bold mb-6 score-value">0</div>
            <button id="restart-btn" class="bg-gray-700 hover:bg-gray-800 cta-btn text-white text-xl font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 w-full title-font" style="font-size: 1rem;">
                RUN IT BACK
            </button>
        </div>

        <div id="feedback-strip" class="feedback-strip pointer-events-none" aria-live="polite">
            <span class="feedback-icon">✦</span>
            <span id="feedback-text" class="feedback-text">Tap start to wake the foam arcade.</span>
        </div>
        <!-- [agent-note][stage3] resolved-gif: slice-feedback -> catalogs/gifs.json | keep off playfield for mobile safety -->
        <img id="slice-reaction" class="reaction-gif hidden-media" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Slice reaction effect" loading="lazy" decoding="async">
        <!-- [agent-note][stage3] resolved-gif: fail-feedback -> catalogs/gifs.json | anchored to lower left to protect controls -->
        <img id="fail-reaction" class="reaction-gif fail hidden-media" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction effect" loading="lazy" decoding="async">
    </div>
</div>

<script>
// §3.2 Configuration Interface
window.gameConfigDefs = {
    "scrollSpeed": { "type": "number", "label": "Scroll Speed", "value": 4, "min": 1, "max": 10 },
    "soapColor": { "type": "color", "label": "Soap Color", "value": "#FFB7B2" },
    "obstacleColor": { "type": "color", "label": "Rock Color", "value": "#546E7A" }
};
window.gameConfig = {
    scrollSpeed: 4,
    soapColor: "#FFB7B2",
    obstacleColor: "#546E7A"
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'soapColor') {
            // Color updates handled in render loop
        }
    }
};

document.addEventListener('DOMContentLoaded', () => {
    // §2.1 & 2.2 Viewport & Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let dpr = window.devicePixelRatio || 1;
    let width, height;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // §A.2 Audio Manager
    class AudioManager {
        constructor() {
            this.ctx = null;
            this.bgmNode = document.getElementById('bgm_main');
            this.sfxHit = document.getElementById('sfx_hit');
            this.sfxSlice = document.getElementById('sfx_slice');
            this.sfxUi = document.getElementById('sfx_ui');
            this.sfxWarning = document.getElementById('sfx_warning');
            this.unlocked = false;
            this.lastSliceAt = 0;
            this.lastWarningAt = 0;
            this.audioNodes = [this.bgmNode, this.sfxHit, this.sfxSlice, this.sfxUi, this.sfxWarning].filter(Boolean);
            this.audioNodes.forEach((node) => {
                node.volume = node === this.bgmNode ? 0.2 : 0.55;
            });
        }

        init() {
            if (!this.unlocked) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    try {
                        this.ctx = new AudioContext();
                    } catch (e) {}
                }
                this.unlocked = true;
            }
            this.resume();
        }

        resume() {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            if (this.bgmNode && this.bgmNode.paused) {
                this.bgmNode.play().catch(() => {});
            }
        }

        pauseLoop() {
            if (this.bgmNode && !this.bgmNode.paused) {
                this.bgmNode.pause();
            }
        }

        playNode(node, reset = true) {
            if (!node) return;
            try {
                if (reset) node.currentTime = 0;
                node.play().catch(() => {});
            } catch (e) {}
        }

        playUi() {
            this.playNode(this.sfxUi);
        }

        playHit() {
            this.playNode(this.sfxHit);
        }

        playWarning() {
            const now = performance.now();
            if (now - this.lastWarningAt < 450) return;
            this.lastWarningAt = now;
            this.playNode(this.sfxWarning);
        }

        playSlice() {
            const now = performance.now();
            if (now - this.lastSliceAt < 80) return;
            this.lastSliceAt = now;
            if (this.sfxSlice) {
                this.playNode(this.sfxSlice);
                return;
            }
            this.synthesize('slice');
        }

        synthesize(type) {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.24, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
                return;
            }

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(280, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        }
    }
    const audio = new AudioManager();

    const feedbackStrip = document.getElementById('feedback-strip');
    const feedbackText = document.getElementById('feedback-text');
    const sliceReaction = document.getElementById('slice-reaction');
    const failReaction = document.getElementById('fail-reaction');

    function pulseReaction(node, timeout = 850) {
        if (!node) return;
        node.classList.remove('hidden-media');
        node.classList.add('visible');
        clearTimeout(node._hideTimer);
        node._hideTimer = setTimeout(() => {
            node.classList.remove('visible');
        }, timeout);
    }

    function setFeedback(message, icon = '✦', timeout = 1200) {
        if (!feedbackStrip || !feedbackText) return;
        feedbackStrip.querySelector('.feedback-icon').textContent = icon;
        feedbackText.textContent = message;
        feedbackStrip.classList.add('visible');
        clearTimeout(setFeedback._timer);
        setFeedback._timer = setTimeout(() => {
            feedbackStrip.classList.remove('visible');
        }, timeout);
    }

    // Game State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let lastTime = 0;
    let shake = 0;
    let ambientPulse = 0;
    let nearRockCue = false;
    
    // Physics & World
    let soapSegments = [];
    let particles = [];
    let knife = { y: 0, targetY: 0, cutting: false, width: 200, height: 40 };
    let spawnTimer = 0;
    
    // Constants
    const SOAP_WIDTH = 120;
    const SOAP_HEIGHT = 80;
    const GROUND_Y = height * 0.65;
    const KNIFE_REST_Y = GROUND_Y - 150;
    const KNIFE_CUT_Y = GROUND_Y - 10;
    
    // Helper: Hex to RGB for shading
    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : { r: 255, g: 183, b: 178 };
    }

    function shadeColor(color, percent) {
        let R = parseInt(color.substring(1,3),16);
        let G = parseInt(color.substring(3,5),16);
        let B = parseInt(color.substring(5,7),16);

        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);

        R = (R<255)?R:255;  
        G = (G<255)?G:255;  
        B = (B<255)?B:255;  

        let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
        let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
        let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

        return "#"+RR+GG+BB;
    }

    function resetGame() {
        score = 0;
        document.getElementById('score').innerText = score;
        soapSegments = [];
        particles = [];
        shake = 0;
        
        // Initial segments
        for(let i=0; i<10; i++) {
            soapSegments.push({
                x: width + i * 40,
                w: 40,
                type: 'soap', // or 'rock'
                sliced: false
            });
        }
        
        knife.y = KNIFE_REST_Y;
        knife.targetY = KNIFE_REST_Y;
        knife.cutting = false;
        
        gameState = 'PLAYING';
        nearRockCue = false;
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        
        audio.init();
        audio.resume();
        setFeedback('Foam lane online. Hold to carve clean cuts.', '▶', 1800);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('finalScore').innerText = score;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        shake = 20;
        audio.playHit();
        audio.pauseLoop();
        pulseReaction(failReaction, 1400);
        setFeedback('Stone chunk jammed the slicer. Reset and try again.', '⚠', 1800);
    }

    // Input Handling
    let isPointerDown = false;

    const handleInputDown = (e) => {
        if (gameState !== 'PLAYING') return;
        isPointerDown = true;
        knife.cutting = true;
        knife.targetY = KNIFE_CUT_Y;
        audio.init();
        audio.resume();
    };

    const handleInputUp = (e) => {
        isPointerDown = false;
        knife.cutting = false;
        knife.targetY = KNIFE_REST_Y;
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInputDown(e);
    }, { passive: false });

    window.addEventListener('pointerup', handleInputUp);
    window.addEventListener('pointercancel', handleInputUp);

    // 3D Drawing Helper
    function drawPrism(ctx, x, y, w, h, depth, colorTop, colorSide, colorFront) {
        // Front Face
        ctx.fillStyle = colorFront;
        ctx.fillRect(x, y, w, h);
        
        // Top Face
        ctx.fillStyle = colorTop;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + depth, y - depth);
        ctx.lineTo(x + w + depth, y - depth);
        ctx.lineTo(x + w, y);
        ctx.closePath();
        ctx.fill();

        // Side Face (Right)
        if (w > 0) { // Only if width exists
            ctx.fillStyle = colorSide;
            ctx.beginPath();
            ctx.moveTo(x + w, y);
            ctx.lineTo(x + w + depth, y - depth);
            ctx.lineTo(x + w + depth, y + h - depth);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.fill();
        }
    }

    function drawBubble(x, y, r, alpha) {
        const bubble = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
        bubble.addColorStop(0, `rgba(255,255,255,${alpha})`);
        bubble.addColorStop(0.45, `rgba(168,243,255,${alpha * 0.55})`);
        bubble.addColorStop(1, 'rgba(168,243,255,0)');
        ctx.fillStyle = bubble;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawSoapHero(x, y, w, h, pulse) {
        const bodyGradient = ctx.createLinearGradient(x, y, x + w, y + h);
        bodyGradient.addColorStop(0, shadeColor(window.gameConfig.soapColor, 26));
        bodyGradient.addColorStop(0.5, window.gameConfig.soapColor);
        bodyGradient.addColorStop(1, shadeColor(window.gameConfig.soapColor, -18));

        ctx.save();
        ctx.shadowColor = `rgba(255, 115, 198, ${0.3 + pulse * 0.12})`;
        ctx.shadowBlur = 24;
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 26);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 26);
        ctx.stroke();

        const eyeY = y + h * 0.42;
        const eyeDX = w * 0.22;
        const eyeX = x + w * 0.5;
        ctx.fillStyle = '#14324c';
        ctx.beginPath();
        ctx.arc(eyeX - eyeDX, eyeY, 5, 0, Math.PI * 2);
        ctx.arc(eyeX + eyeDX, eyeY, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#14324c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(eyeX, y + h * 0.58, 12, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.38)';
        ctx.beginPath();
        ctx.ellipse(x + w * 0.32, y + h * 0.28, w * 0.18, h * 0.12, -0.5, 0, Math.PI * 2);
        ctx.fill();

        drawBubble(x + w * 0.18, y - 10, 10 + pulse * 2, 0.45);
        drawBubble(x + w * 0.82, y + h * 0.1, 8 + pulse, 0.35);
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;
        ambientPulse += dt * 2.2;

        // Clear Canvas
        const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
        skyGradient.addColorStop(0, '#0b1830');
        skyGradient.addColorStop(0.55, '#123552');
        skyGradient.addColorStop(1, '#204c62');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, width, height);

        // Shake Effect
        let sx = 0, sy = 0;
        if (shake > 0) {
            sx = (Math.random() - 0.5) * shake;
            sy = (Math.random() - 0.5) * shake;
            shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }
        ctx.save();
        ctx.translate(sx, sy);

        // Draw Table/Background
        for (let i = 0; i < 7; i++) {
            const bx = (width * (0.12 + i * 0.14) + Math.sin(ambientPulse + i) * 22);
            const by = height * (0.12 + (i % 3) * 0.1) + Math.cos(ambientPulse * 1.2 + i) * 8;
            drawBubble(bx, by, 16 - (i % 3) * 3, 0.2);
        }

        const floorGradient = ctx.createLinearGradient(0, GROUND_Y, 0, height);
        floorGradient.addColorStop(0, '#173954');
        floorGradient.addColorStop(1, '#09111d');
        ctx.fillStyle = floorGradient;
        ctx.fillRect(0, GROUND_Y, width, height - GROUND_Y);

        ctx.fillStyle = 'rgba(124, 242, 255, 0.08)';
        for (let i = 0; i < width; i += 44) {
            ctx.fillRect(i, GROUND_Y + 14 + Math.sin((i / 44) + ambientPulse) * 4, 22, 3);
        }

        try {
            if (gameState === 'PLAYING') {
                // Spawn Segments
                spawnTimer += dt;
                // Infinite generation
                const rightMost = soapSegments.length > 0 ? soapSegments[soapSegments.length-1].x + soapSegments[soapSegments.length-1].w : width;
                if (rightMost < width + 100) {
                    // Chance for rock
                    const isRock = Math.random() < 0.15;
                    soapSegments.push({
                        x: rightMost,
                        w: 20 + Math.random() * 30,
                        type: isRock ? 'rock' : 'soap',
                        sliced: false
                    });
                }

                // Update Knife
                const knifeSpeed = 2000 * dt;
                if (knife.y < knife.targetY) {
                    knife.y = Math.min(knife.y + knifeSpeed, knife.targetY);
                } else if (knife.y > knife.targetY) {
                    knife.y = Math.max(knife.y - knifeSpeed, knife.targetY);
                }

                // Logic Loop
                const cutZoneX = width / 2; // Knife position X
                
                // Move Segments
                const speed = window.gameConfig.scrollSpeed * 60 * dt;
                const cuttingLine = width / 2;
                
                let closestRockDistance = Infinity;
                // Process segments
                for (let i = soapSegments.length - 1; i >= 0; i--) {
                    let seg = soapSegments[i];
                    seg.x -= speed;

                    if (seg.type === 'rock') {
                        const distToKnife = seg.x - cuttingLine;
                        if (distToKnife > -40 && distToKnife < closestRockDistance) {
                            closestRockDistance = distToKnife;
                        }
                    }

                    // Collision Detection
                    // Knife X range is roughly width/2 - 10 to width/2 + 10 (it's thin but has width)
                    // Actually knife is wide, but the cutting edge is at width/2
                    
                    // If segment crosses the cutting line (width/2) while knife is down
                    const segRight = seg.x + seg.w;
                    
                    // Check if segment is under the knife
                    if (seg.x < cuttingLine && segRight > cuttingLine) {
                        // Knife is low enough to cut
                        if (knife.y > GROUND_Y - SOAP_HEIGHT + 10) {
                            if (seg.type === 'rock') {
                                // Hit rock
                                gameOver();
                            } else if (!seg.sliced) {
                                // Slice Logic!
                                // Split this segment into two
                                // 1. The part that passed (becomes a particle)
                                // 2. The part remaining (stays in array, modified x/w)
                                
                                // Calculate split point relative to segment
                                const cutOffset = cuttingLine - seg.x;
                                
                                // Create particle from the left part
                                // Visuals: 3D cube falling
                                particles.push({
                                    x: seg.x,
                                    y: GROUND_Y - SOAP_HEIGHT,
                                    w: cutOffset,
                                    h: SOAP_HEIGHT,
                                    vx: -100 - Math.random() * 100,
                                    vy: -200 - Math.random() * 100,
                                    rot: 0,
                                    vRot: (Math.random() - 0.5) * 10,
                                    color: window.gameConfig.soapColor
                                });

                                // Modify current segment to be the remainder
                                seg.w = seg.w - cutOffset;
                                seg.x = cuttingLine;
                                
                                // Juice
                                score++;
                                document.getElementById('score').innerText = score;
                                audio.playSlice();
                                pulseReaction(sliceReaction, 700);
                                setFeedback(`Clean slice banked. Total cuts: ${score}.`, '✦', 700);
                                
                                // Small screen bump
                                shake = 2;
                            }
                        }
                    }

                    // Remove off-screen
                    if (seg.x + seg.w < -100) {
                        soapSegments.splice(i, 1);
                    }
                }

                if (closestRockDistance < 120) {
                    if (!nearRockCue) {
                        nearRockCue = true;
                        audio.playWarning();
                        setFeedback('Rock incoming — ease off the blade!', '!', 650);
                    }
                } else {
                    nearRockCue = false;
                }
            }

            // Draw Segments
            const soapBase = window.gameConfig.soapColor;
            const soapDark = shadeColor(soapBase, -20);
            const soapLight = shadeColor(soapBase, 20);
            
            const rockBase = window.gameConfig.obstacleColor;
            const rockDark = shadeColor(rockBase, -20);
            const rockLight = shadeColor(rockBase, 20);

            soapSegments.forEach(seg => {
                const isRock = seg.type === 'rock';
                drawPrism(ctx, seg.x, GROUND_Y - SOAP_HEIGHT, seg.w, SOAP_HEIGHT, 40, 
                    isRock ? rockLight : soapLight, 
                    isRock ? rockDark : soapDark, 
                    isRock ? rockBase : soapBase
                );

                if (isRock) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(seg.x + 6, GROUND_Y - SOAP_HEIGHT + 14);
                    ctx.lineTo(seg.x + seg.w - 6, GROUND_Y - 18);
                    ctx.moveTo(seg.x + 10, GROUND_Y - 28);
                    ctx.lineTo(seg.x + seg.w - 14, GROUND_Y - SOAP_HEIGHT + 12);
                    ctx.stroke();
                } else if (seg.w > 42) {
                    drawSoapHero(seg.x + 8, GROUND_Y - SOAP_HEIGHT + 8, Math.min(seg.w - 16, 88), SOAP_HEIGHT - 18, (Math.sin(ambientPulse * 3) + 1) * 0.5);
                } else {
                    drawBubble(seg.x + seg.w * 0.5, GROUND_Y - SOAP_HEIGHT * 0.45, 7, 0.28);
                }
            });

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 1500 * dt; // Gravity
                p.rot += p.vRot * dt;

                ctx.save();
                ctx.translate(p.x + p.w/2, p.y + p.h/2);
                ctx.rotate(p.rot);
                // Draw simple rect for particle for performance/style
                const particleGradient = ctx.createLinearGradient(-p.w/2, -p.h/2, p.w/2, p.h/2);
                particleGradient.addColorStop(0, shadeColor(p.color, 18));
                particleGradient.addColorStop(1, shadeColor(p.color, -12));
                ctx.fillStyle = particleGradient;
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2;
                ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
                ctx.restore();

                if (p.y > height + 100) {
                    particles.splice(i, 1);
                }
            }

            // Draw Knife
            // Knife is centered at width/2
            const kX = width / 2 - 100; // 200 width centered
            const kY = knife.y;
            
            // Blade
            const bladeGradient = ctx.createLinearGradient(kX, kY, kX + 200, kY + 70);
            bladeGradient.addColorStop(0, '#f8fbff');
            bladeGradient.addColorStop(0.45, '#d6eaf8');
            bladeGradient.addColorStop(1, '#8cd8f2');
            ctx.fillStyle = bladeGradient;
            ctx.fillRect(kX, kY, 200, 60);

            // Sharp Edge
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(kX, kY + 60, 200, 10);

            // Handle
            const handleGradient = ctx.createLinearGradient(kX - 20, kY - 20, kX + 220, kY);
            handleGradient.addColorStop(0, '#ff8fd4');
            handleGradient.addColorStop(1, '#6df2ff');
            ctx.fillStyle = handleGradient;
            ctx.fillRect(kX - 20, kY - 20, 240, 20);

            // Reflection on blade
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.beginPath();
            ctx.moveTo(kX, kY + 60);
            ctx.lineTo(kX + 200, kY + 10);
            ctx.lineTo(kX + 200, kY + 60);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 2;
            ctx.strokeRect(kX, kY, 200, 60);

        } catch (e) {
            console.error(e);
        }

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.init();
        audio.playUi();
        resetGame();
    });
    
    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.init();
        audio.playUi();
        resetGame();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.pauseLoop();
        } else if (gameState === 'PLAYING') {
            audio.resume();
        }
    });

    setFeedback('Tap start to wake the foam arcade.', '♪', 2200);

    // Start Loop
    requestAnimationFrame(gameLoop);
});
</script>
</body>
