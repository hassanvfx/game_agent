    <style>
        :root {
            --bg-color: #050814;
            --bg-deep: #02030a;
            --panel-color: rgba(11, 15, 31, 0.84);
            --panel-border: rgba(133, 225, 255, 0.45);
            --ui-color: #8ef7ff;
            --ui-hot: #ff4d8d;
            --ui-accent: #8bffb7;
            --ui-warning: #ffd86b;
            --text-color: #eff8ff;
            --font-ui: 'Exo 2', 'Segoe UI', sans-serif;
            --font-display: 'Audiowide', 'Trebuchet MS', sans-serif;
            --font-terminal: 'Press Start 2P', 'Courier New', monospace;
        }
        html, body {
            width: 100%; min-height: 100%; margin: 0; overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(82, 228, 255, 0.08), transparent 34%),
                radial-gradient(circle at bottom, rgba(139, 255, 183, 0.10), transparent 28%),
                linear-gradient(180deg, #0a1022 0%, var(--bg-color) 42%, var(--bg-deep) 100%);
            font-family: var(--font-ui);
            color: var(--ui-color);
            -webkit-user-select: none; user-select: none;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            touch-action: none;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(142, 247, 255, 0.08), transparent 20%),
                radial-gradient(circle at 82% 14%, rgba(255, 77, 141, 0.10), transparent 18%),
                radial-gradient(circle at 50% 84%, rgba(139, 255, 183, 0.08), transparent 22%);
            z-index: 0;
        }
        body::after {
            background:
                linear-gradient(90deg, transparent 0%, rgba(142, 247, 255, 0.04) 48%, transparent 100%);
            mix-blend-mode: screen;
            opacity: 0.8;
            z-index: 1;
        }
        
        /* UI Layer */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 16px; box-sizing: border-box;
            z-index: 10;
        }
        .pointer-auto { pointer-events: auto; }

        /* HUD */
        .hud-top { display: flex; gap: 8px; align-items: flex-start; width: 100%; }
        .hud-panel {
            background:
                linear-gradient(180deg, rgba(16, 23, 48, 0.94), rgba(8, 11, 25, 0.92));
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06) inset,
                0 0 12px rgba(142, 247, 255, 0.14),
                0 8px 18px rgba(0, 0, 0, 0.28);
            text-align: center;
            transform: skewX(-10deg);
            backdrop-filter: blur(6px);
            flex-shrink: 0;
            cursor: pointer;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .hud-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(142,247,255,0.14), transparent 40%, rgba(255,77,141,0.12));
            opacity: 0.8;
            pointer-events: none;
        }
        .hud-panel.wide { flex-grow: 1; text-align: left; }
        .hud-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.6px;
            display: block;
            margin-bottom: 4px;
            color: rgba(239, 248, 255, 0.72);
            position: relative;
            z-index: 1;
        }
        .hud-value {
            font-size: 18px;
            font-weight: bold;
            font-family: var(--font-terminal);
            color: var(--text-color);
            text-shadow: 0 0 8px rgba(142, 247, 255, 0.5);
            line-height: 1.3;
            position: relative;
            z-index: 1;
        }
        .hud-sub {
            font-size: 10px;
            color: var(--ui-accent);
            margin-top: 4px;
            display: block;
            position: relative;
            z-index: 1;
        }
        
        /* Controls */
        .controls { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            margin-bottom: env(safe-area-inset-bottom, 10px); width: 100%; max-width: 500px; margin-left: auto; margin-right: auto;
        }
        .btn {
            height: 70px;
            background:
                linear-gradient(180deg, rgba(17, 25, 52, 0.96), rgba(7, 11, 24, 0.96));
            border: 1px solid rgba(142, 247, 255, 0.42);
            color: var(--text-color);
            font-family: var(--font-display); font-size: 18px; font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer; text-transform: uppercase;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.05s, box-shadow 0.05s, border-color 0.05s, filter 0.05s, background 0.05s;
            position: relative; overflow: hidden;
            box-shadow:
                4px 4px 0 rgba(6, 12, 28, 0.9),
                0 0 14px rgba(142, 247, 255, 0.18);
            border-radius: 14px;
        }
        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139, 255, 183, 0.14), transparent 50%, rgba(255, 77, 141, 0.16));
            pointer-events: none;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 transparent;
            background: linear-gradient(180deg, var(--ui-hot), #7f234a);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }
        .btn.disabled { opacity: 0.4; border-color: #444; color: #77808c; pointer-events: none; box-shadow: none; }
        .btn-sub { font-size: 10px; color: rgba(239,248,255,0.68); margin-top: 4px; letter-spacing: 1.5px; font-family: var(--font-ui); }

        /* Overlay */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(circle at top, rgba(142,247,255,0.16), transparent 30%),
                linear-gradient(180deg, rgba(6,10,22,0.95), rgba(1,2,7,0.98));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; cursor: pointer;
            transition: opacity 0.3s;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #start-overlay h1 { 
            font-size: clamp(28px, 8vw, 32px); margin: 0 0 18px 0; 
            color: var(--text-color);
            text-shadow: 0 0 14px rgba(142,247,255,0.55), 0 0 28px rgba(255,77,141,0.2);
            text-align: center; 
            font-family: var(--font-display);
            letter-spacing: 2px;
            animation: glitch-anim 0.2s infinite steps(2);
        }
        #start-overlay p {
            font-size: 12px;
            color: #07111e;
            background: linear-gradient(90deg, var(--ui-accent), var(--ui-color));
            padding: 8px 14px;
            font-weight: 700;
            border-radius: 999px;
            letter-spacing: 1.2px;
            box-shadow: 0 0 16px rgba(142,247,255,0.22);
        }
        
        @keyframes glitch-anim {
            0% { transform: translate(0); clip-path: inset(0 0 0 0); }
            20% { transform: translate(-2px, 2px); clip-path: inset(10% 0 80% 0); }
            40% { transform: translate(2px, -2px); clip-path: inset(80% 0 10% 0); }
            60% { transform: translate(-2px, -2px); clip-path: inset(40% 0 40% 0); }
            80% { transform: translate(2px, 2px); clip-path: inset(0 0 0 0); }
            100% { transform: translate(0); }
        }
        
        /* CRT Scanlines */
        #scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none; z-index: 20; opacity: 0.4;
        }

        #tutorial-hint {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(239,248,255,0.8);
            font-size: 11px; pointer-events: none;
            text-align: center;
            animation: fade-pulse 2s infinite;
            letter-spacing: 2px;
            padding: 8px 12px;
            border: 1px solid rgba(142,247,255,0.2);
            background: rgba(4, 9, 21, 0.56);
            border-radius: 999px;
            box-shadow: 0 0 16px rgba(142,247,255,0.1);
            backdrop-filter: blur(4px);
            max-width: min(80vw, 260px);
        }
        @keyframes fade-pulse { 0% {opacity:0.2;} 50% {opacity:0.8;} 100% {opacity:0.2;} }
        #tutorial-hint {
            font-family: var(--font-ui);
        }

        #feedback-gif-layer {
            position: absolute;
            right: 14px;
            bottom: calc(104px + env(safe-area-inset-bottom, 0px));
            width: min(28vw, 116px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            pointer-events: none;
            z-index: 16;
        }
        .feedback-gif {
            width: 100%;
            max-width: 116px;
            border-radius: 14px;
            border: 1px solid rgba(142, 247, 255, 0.35);
            box-shadow: 0 0 16px rgba(142, 247, 255, 0.18);
            background: rgba(4, 9, 21, 0.72);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }
        .feedback-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .material-symbols-sharp {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 18px;
            line-height: 1;
        }

        @media (max-width: 480px) {
            #ui-layer {
                padding: 12px;
            }
            .hud-value {
                font-size: 16px;
            }
            .hud-label,
            .btn-sub,
            #tutorial-hint {
                font-size: 10px;
            }
            .btn {
                height: 68px;
                font-size: 16px;
            }
            #feedback-gif-layer {
                width: min(24vw, 92px);
                right: 10px;
                bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>

<script>
/**
     * GARDEN_PROTOCOL
     * A neon greenhouse merge game.
 */

// --- 1. Audio Engine ---
const AudioSys = {
    ctx: null,
    master: null,
    initialized: false,
    ui: null,
    hit: null,
    collect: null,
    fail: null,
    bgm: null,
    lastPlayed: new Map(),
    
    init() {
        if (this.initialized) return;
        this.ui = document.getElementById('sfx_ui');
        this.hit = document.getElementById('sfx_hit');
        this.collect = document.getElementById('sfx_collect');
        this.fail = document.getElementById('sfx_fail');
        this.bgm = document.getElementById('bgm_main');
        const AC = window.AudioContext || window.webkitAudioContext;
        try {
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.35;
            this.master.connect(this.ctx.destination);
        } catch (e) {
            this.ctx = null;
            this.master = null;
        }
        if (this.bgm) {
            this.bgm.volume = 0.22;
            this.bgm.loop = true;
            this.bgm.preload = 'auto';
        }
        [this.ui, this.hit, this.collect, this.fail].forEach((el) => {
            if (el) el.volume = 0.5;
        });
        this.initialized = true;
    },

    setIndicator(on) {
        const valAudio = document.getElementById('val-audio');
        valAudio.innerHTML = on
            ? '<span class="material-symbols-sharp" aria-hidden="true">volume_up</span><span>ON</span>'
            : '<span class="material-symbols-sharp" aria-hidden="true">volume_off</span><span>OFF</span>';
        valAudio.style.color = on ? "var(--ui-accent)" : "#6b7a8f";
    },

    async syncBgm(shouldPlay) {
        if (!this.bgm) return;
        if (shouldPlay) {
            try {
                this.bgm.currentTime = this.bgm.currentTime || 0;
                await this.bgm.play();
            } catch (e) {}
        } else {
            this.bgm.pause();
        }
    },

    resume() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        this.syncBgm(true);
        this.setIndicator(true);
    },

    suspend() {
        if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
        this.syncBgm(false);
        this.setIndicator(false);
    },

    toggle() {
        this.init();
        if (!this.ctx) {
            if (this.bgm && this.bgm.paused) {
                this.syncBgm(true);
                this.setIndicator(true);
            } else {
                this.syncBgm(false);
                this.setIndicator(false);
            }
            return;
        }
        if (this.ctx.state === 'running') {
            this.suspend();
        } else {
            this.resume();
        }
    },

    playTone(freqStart, freqEnd, duration, type='sine', vol=0.5) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + duration);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + duration);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + duration);
    },

    playSample(key, el, debounceMs = 80) {
        if (!el) return;
        const now = performance.now();
        const last = this.lastPlayed.get(key) || 0;
        if (now - last < debounceMs) return;
        this.lastPlayed.set(key, now);
        try {
            el.pause();
            el.currentTime = 0;
            const playPromise = el.play();
            if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
        } catch (e) {}
    },

    playUI() {
        this.playSample('ui', this.ui, 60);
    },

    playGather() {
        this.playSample('collect', this.collect, 90);
        this.playTone(880, 620, 0.06, 'triangle', 0.06);
    },

    playPurchase() {
        this.playSample('hit', this.hit, 100);
        this.playTone(240, 420, 0.08, 'triangle', 0.08);
    },

    playMerge(tier) {
        this.playSample('merge', this.hit, 110);
        const base = 220 * Math.pow(1.35, tier);
        this.playTone(base, base * 2, 0.24, 'triangle', 0.18);
        this.playTone(base * 1.4, base * 2.8, 0.32, 'sine', 0.12);
    },

    playError() {
        this.playSample('fail', this.fail, 120);
        this.playTone(150, 50, 0.2, 'sawtooth', 0.08);
    }
};

// --- 2. Game Data (Tiers) ---
const TIERS = [
    { id: 'BIT_SEED',    color: '#CCCCCC', petals: 0, mult: 1 },
    { id: 'DATA_BUD',    color: '#00FF66', petals: 3, mult: 4 },
    { id: 'LOGIC_BLOOM', color: '#00FFFF', petals: 4, mult: 12 },
    { id: 'MEM_ROSE',    color: '#0088FF', petals: 5, mult: 35 },
    { id: 'CRYPTO_LOTUS',color: '#9900FF', petals: 6, mult: 100 },
    { id: 'VOID_ORCHID', color: '#FF00FF', petals: 8, mult: 300 },
    { id: 'SYS_LILY',    color: '#FFD700', petals: 12, mult: 1000 },
    { id: 'OMNI_BLOSSOM',color: '#FF0055', petals: 16, mult: 5000 }
];

const STATE = {
    entropy: 0,
    pps: 0,
    flowers: [],
    particles: [],
    floaters: [],
    shake: 0,
    baseCost: 20,
    lastTime: 0,
    bgOffset: 0,
    dragIdx: -1,
    dragOffset: {x:0, y:0},
    feedbackTimer: null
};

const FEEDBACK_GIFS = {
    merge: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
    error: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp'
};

// --- 3. Logic ---
function spawnParticle(x, y, color, count=5) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 150;
        STATE.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.5,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

function spawnFloater(text, x, y, color='#FFF', size=14) {
    STATE.floaters.push({ text, x, y, vy: -80, life: 1.0, color, size });
}

function showGifFeedback(kind) {
    const id = kind === 'merge' ? 'gif-merge' : 'gif-error';
    const img = document.getElementById(id);
    if (!img) return;
    img.src = FEEDBACK_GIFS[kind];
    img.classList.add('active');
    clearTimeout(STATE.feedbackTimer);
    STATE.feedbackTimer = setTimeout(() => {
        img.classList.remove('active');
    }, 1400);
}

function addFlower(tierIdx, x, y) {
    // If no pos provided, random pos
    if (x === undefined) x = 50 + Math.random() * (window.innerWidth - 100);
    if (y === undefined) y = 100 + Math.random() * (window.innerHeight - 300);

    STATE.flowers.push({
        x, y,
        tier: tierIdx,
        age: 0,
        scale: 0,
        phase: Math.random() * Math.PI * 2,
        vx: (Math.random()-0.5)*20,
        vy: (Math.random()-0.5)*20
    });
    recalcPPS();
    
    // Spawn FX
    const t = TIERS[tierIdx];
    spawnParticle(x, y, t.color, 10);
}

function recalcPPS() {
    STATE.pps = STATE.flowers.reduce((sum, f) => sum + TIERS[f.tier].mult, 0);
}

function update(dt) {
    const simDt = dt * (window.gameConfig ? window.gameConfig.gameSpeed : 1);
    
    STATE.entropy += STATE.pps * simDt;
    STATE.bgOffset += 40 * dt;
    if (STATE.shake > 0) STATE.shake = Math.max(0, STATE.shake - 30 * dt);

    // Flowers
    STATE.flowers.forEach((f, i) => {
        f.age += dt;
        f.phase += dt;
        
        // Appear anim
        if (f.scale < 1) f.scale += (1 - f.scale) * 8 * dt;
        
        // Floating physics (only if not dragged)
        if (i !== STATE.dragIdx) {
            f.x += f.vx * dt;
            f.y += f.vy * dt;
            
            // Bounce bounds
            if (f.x < 30 || f.x > window.innerWidth - 30) f.vx *= -1;
            if (f.y < 80 || f.y > window.innerHeight - 150) f.vy *= -1;
            
            // Keep in bounds
            f.x = Math.max(30, Math.min(window.innerWidth - 30, f.x));
            f.y = Math.max(80, Math.min(window.innerHeight - 150, f.y));
        }
    });

    // Particles
    for(let i=STATE.particles.length-1; i>=0; i--) {
        let p = STATE.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if(p.life <= 0) STATE.particles.splice(i, 1);
    }
    
    // Floaters
    for(let i=STATE.floaters.length-1; i>=0; i--) {
        let f = STATE.floaters[i];
        f.y += f.vy * dt;
        f.life -= dt;
        if(f.life <= 0) STATE.floaters.splice(i, 1);
    }

    // UI
    const cost = Math.floor(STATE.baseCost * Math.pow(1.2, STATE.flowers.length));
    document.getElementById('val-seeds').innerText = Math.floor(STATE.entropy).toLocaleString();
    document.getElementById('val-pps').innerText = `+${STATE.pps.toFixed(1)} growth/s`;
    document.getElementById('val-cost').innerText = `SEED COST: ${cost}`;
    
        const btnBuy = document.getElementById('btn-buy');
        if (STATE.entropy >= cost) {
            btnBuy.classList.remove('disabled');
            btnBuy.style.borderColor = "rgba(139, 255, 183, 0.75)";
            btnBuy.style.color = "var(--text-color)";
        } else {
            btnBuy.classList.add('disabled');
            btnBuy.style.borderColor = "#444";
            btnBuy.style.color = "#77808c";
        }
    
    // Hide tutorial if playing
    if (STATE.flowers.length > 1 && STATE.entropy > 50) {
        document.getElementById('tutorial-hint').style.display = 'none';
    }
}

// --- 4. Rendering ---
let canvas, ctx;

function drawFlower(ctx, tierIdx, size) {
    const t = TIERS[tierIdx];
    const pulse = 0.84 + Math.sin(performance.now() * 0.004 + tierIdx) * 0.06;
    const petalFill = t.color + "30";
    const petalGlow = t.color + "88";

    ctx.lineWidth = 2.4;
    ctx.shadowBlur = 18;
    ctx.shadowColor = petalGlow;
    ctx.strokeStyle = t.color;
    ctx.fillStyle = petalFill;
    
    if (t.petals === 0) {
        // Seed
        const seedRadius = size * 0.5;
        const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, seedRadius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, '#b8ffe4');
        grad.addColorStop(1, t.color);
        ctx.beginPath();
        ctx.arc(0, 0, seedRadius, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.arc(-seedRadius * 0.18, -seedRadius * 0.22, size * 0.1, 0, Math.PI * 2);
        ctx.fill();
    } else {
        // Flower
        ctx.beginPath();
        for (let i = 0; i < t.petals * 2; i++) {
            const angle = (Math.PI * i) / t.petals;
            const r = (i % 2 === 0) ? size * pulse : size * 0.34;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.arc(0, 0, size * 0.7, 0, Math.PI * 2);
        ctx.fill();

        // Core
        const coreGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, size * 0.28);
        coreGrad.addColorStop(0, '#ffffff');
        coreGrad.addColorStop(0.45, '#fff4ac');
        coreGrad.addColorStop(1, '#ff8ad1');
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.23, 0, Math.PI*2);
        ctx.fillStyle = coreGrad;
        ctx.fill();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1;
        ctx.arc(0, 0, size * 0.34, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.shadowBlur = 0;
}

function draw() {
    const dpr = window.devicePixelRatio || 1;
    const sx = (Math.random() - 0.5) * STATE.shake;
    const sy = (Math.random() - 0.5) * STATE.shake;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
    ctx.translate(sx, sy);

    const w = canvas.width/dpr;
    const h = canvas.height/dpr;

    // Canopy glow backdrop
    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, '#08111f');
    bgGrad.addColorStop(0.6, '#040812');
    bgGrad.addColorStop(1, '#010205');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const offY = STATE.bgOffset % 40;

    // Parallax 1: greenhouse lattice
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(142, 247, 255, 0.1)';
    ctx.beginPath();
    for(let x = 0; x <= w; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for(let y = offY; y <= h; y += 40) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();

    // Parallax 2: nutrient motes
    ctx.fillStyle = 'rgba(139, 255, 183, 0.16)';
    for(let i=0; i<20; i++) {
        const x = (i * 97 + STATE.bgOffset * 0.5) % w;
        const y = (i * 61 + STATE.bgOffset) % h;
        ctx.fillRect(x, y, 2, 8);
    }

    // Character-first garden halo
    STATE.flowers.forEach((f) => {
        const halo = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 64);
        halo.addColorStop(0, TIERS[f.tier].color + '22');
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = halo;
        ctx.fillRect(f.x - 64, f.y - 64, 128, 128);
    });

    // Connectors (Visual Link)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.beginPath();
    for(let i=0; i<STATE.flowers.length; i++) {
        for(let j=i+1; j<STATE.flowers.length; j++) {
            const a = STATE.flowers[i];
            const b = STATE.flowers[j];
            const d = (a.x-b.x)**2 + (a.y-b.y)**2;
            if (d < 15000) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
        }
    }
    ctx.stroke();

    // Flowers
    STATE.flowers.forEach((f, i) => {
        ctx.save();
        ctx.translate(f.x, f.y);
        
        // Drag scale
        const dragScale = (i === STATE.dragIdx) ? 1.2 : 1.0;
        const s = f.scale * dragScale * (1 + Math.sin(f.phase * 2) * 0.05);
        ctx.scale(s, s);
        ctx.rotate(f.phase * 0.5);
        
        drawFlower(ctx, f.tier, 25);
        
        // Tier Text
        ctx.rotate(-f.phase * 0.5); // Reset rot for text
        ctx.fillStyle = '#F4FBFF';
        ctx.font = "10px 'Press Start 2P'";
        ctx.textAlign = "center";
        ctx.fillText(TIERS[f.tier].id.split('_')[1] || 'SEED', 0, 40);
        
        ctx.restore();
    });

    // Particles
    STATE.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
    });

    // Floaters
    ctx.textAlign = "center";
    STATE.floaters.forEach(f => {
        ctx.font = `bold ${Math.max(10, f.size - 2)}px 'Exo 2'`;
        ctx.fillStyle = '#000';
        ctx.fillText(f.text, f.x + 2, f.y + 2);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
    });
}

// --- 5. Input System ---
function handleInput() {
    const cvs = document.getElementById('gameCanvas');
    
    const getPos = (e) => {
        const r = cvs.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    cvs.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const p = getPos(e);
        
        // Find clicked flower (reverse order for top-first)
        for (let i = STATE.flowers.length - 1; i >= 0; i--) {
            const f = STATE.flowers[i];
            const dx = p.x - f.x;
            const dy = p.y - f.y;
            if (dx*dx + dy*dy < 1600) { // 40px radius
                STATE.dragIdx = i;
                STATE.dragOffset = { x: dx, y: dy };
                AudioSys.playUI();
                return;
            }
        }
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
        if (STATE.dragIdx !== -1) {
            e.preventDefault();
            const p = getPos(e);
            const f = STATE.flowers[STATE.dragIdx];
            if (f) {
                f.x = p.x - STATE.dragOffset.x;
                f.y = p.y - STATE.dragOffset.y;
                f.vx = 0; f.vy = 0; // Stop physics while dragging
            }
        }
    }, { passive: false });

    const endDrag = (e) => {
        if (STATE.dragIdx !== -1) {
            const f1 = STATE.flowers[STATE.dragIdx];
            let merged = false;
            
            // Check collision with same tier
            for (let i = 0; i < STATE.flowers.length; i++) {
                if (i === STATE.dragIdx) continue;
                const f2 = STATE.flowers[i];
                const dist = (f1.x - f2.x)**2 + (f1.y - f2.y)**2;
                
                if (dist < 1600 && f1.tier === f2.tier && f1.tier < TIERS.length - 1) {
                    // MERGE!
                    const newTier = f1.tier + 1;
                    const mx = (f1.x + f2.x) / 2;
                    const my = (f1.y + f2.y) / 2;
                    
                    // Remove both (careful with indices)
                    const idx1 = STATE.dragIdx;
                    const idx2 = i;
                    // Sort to remove higher index first
                    const sorted = [idx1, idx2].sort((a,b)=>b-a);
                    STATE.flowers.splice(sorted[0], 1);
                    STATE.flowers.splice(sorted[1], 1);
                    
                    // Add new
                    addFlower(newTier, mx, my);
                    
                    // FX
                    STATE.shake = 10;
                    spawnFloater("MERGE!", mx, my - 40, TIERS[newTier].color, 20);
                    AudioSys.playMerge(newTier);
                    showGifFeedback('merge');
                    
                    merged = true;
                    break;
                }
            }
            
            if (!merged) {
                // Release velocity
                f1.vx = (Math.random()-0.5) * 50;
                f1.vy = (Math.random()-0.5) * 50;
            }
            
            STATE.dragIdx = -1;
            recalcPPS();
        }
    };

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
}

function gameLoop() {
    const now = performance.now();
    const dt = Math.min(0.1, (now - STATE.lastTime) / 1000);
    STATE.lastTime = now;
    
    try { update(dt); draw(); } catch(e) { console.error(e); }
    requestAnimationFrame(gameLoop);
}

function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    // Config
    try {
        const conf = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = {};
        for(let k in conf) window.gameConfig[k] = conf[k].value;
        if(window.gameConfig.themeColor) document.documentElement.style.setProperty('--ui-color', window.gameConfig.themeColor);
    } catch(e) {}
    window.updateGameConfig = (k, v) => {
        if(window.gameConfig) window.gameConfig[k] = v;
        if(k === 'themeColor') document.documentElement.style.setProperty('--ui-color', v);
    };

    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
    };
    window.addEventListener('resize', resize);
    resize();
    handleInput();

    // Buttons
    document.getElementById('btn-gather').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        STATE.entropy += 1 + STATE.pps * 0.1;
        STATE.shake = 2;
        spawnFloater("+GROWTH", e.clientX, e.clientY, "#FFF");
        AudioSys.playGather();
    });

    document.getElementById('btn-buy').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const cost = Math.floor(STATE.baseCost * Math.pow(1.2, STATE.flowers.length));
        if (STATE.entropy >= cost) {
            STATE.entropy -= cost;
            // "Separate Rare" mechanic: 10% chance to skip Tier 1
            const rnd = Math.random();
            let tier = 0;
            if (rnd < 0.05) tier = 2;
            else if (rnd < 0.15) tier = 1;
            
            addFlower(tier);
            AudioSys.playPurchase();
        } else {
            AudioSys.playError();
            showGifFeedback('error');
        }
    });

    document.getElementById('btn-audio').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        AudioSys.toggle();
    });

    // Start
    const overlay = document.getElementById('start-overlay');
    const start = () => {
        AudioSys.init();
        AudioSys.resume();
        AudioSys.playUI();
        overlay.style.opacity = 0;
        setTimeout(() => overlay.remove(), 300);
        window.removeEventListener('pointerdown', start);
        window.removeEventListener('keydown', start);
        
        // Initial Seed
        addFlower(0, window.innerWidth/2, window.innerHeight/2);
    };
    overlay.addEventListener('pointerdown', start);
    window.addEventListener('keydown', start);

    STATE.lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

window.addEventListener('DOMContentLoaded', init);
</script>
