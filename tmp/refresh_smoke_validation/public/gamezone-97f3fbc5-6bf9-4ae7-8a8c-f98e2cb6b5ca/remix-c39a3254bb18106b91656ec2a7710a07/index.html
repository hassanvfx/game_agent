<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbital Siege</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060913;
            --bg-deep: #090f20;
            --panel: rgba(10, 18, 37, 0.82);
            --panel-solid: rgba(14, 26, 52, 0.94);
            --panel-border: rgba(120, 226, 255, 0.28);
            --hud-red: #ff6b8f;
            --hud-green: #6fffd2;
            --hud-gold: #ffd86b;
            --hud-cyan: #78e2ff;
            --hud-blue: #5fa8ff;
            --text-white: #f5fbff;
            --text-gray-200: #d7e6f8;
            --text-gray-300: #aab9d3;
            --text-gray-400: #7b8ca8;
            --text-black: #02050b;
            --gray-600: rgba(150, 184, 229, 0.4);
            --gray-800: rgba(10, 19, 38, 0.92);
            --green-400: #83ffe0;
            --green-500: #55f3c4;
            --red-500: #ff4f7d;
            --max-hud-width: 28rem;
            --title-font: 'Orbitron', sans-serif;
            --ui-font: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(95, 168, 255, 0.16), transparent 38%),
                radial-gradient(circle at bottom, rgba(111, 255, 210, 0.12), transparent 32%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            touch-action: manipulation;
            font-family: var(--ui-font);
        }

        body {
            color: var(--text-white);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(120, 226, 255, 0.16) 0, transparent 12%),
                radial-gradient(circle at 82% 24%, rgba(255, 107, 143, 0.15) 0, transparent 10%),
                radial-gradient(circle at 68% 78%, rgba(255, 216, 107, 0.12) 0, transparent 14%);
            opacity: 0.9;
        }

        body::after {
            background-image:
                linear-gradient(rgba(120, 226, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 226, 255, 0.05) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), transparent 75%);
            opacity: 0.35;
        }

        canvas {
            display: block;
            touch-action: none;
            position: relative;
            z-index: 1;
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            touch-action: manipulation;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(17, 31, 61, 0.92), rgba(8, 16, 34, 0.88));
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 24px rgba(120, 226, 255, 0.1);
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(120, 226, 255, 0.65),
                0 0 26px rgba(95, 168, 255, 0.4);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(120, 226, 255, 0.2), 0 0 20px rgba(85, 243, 196, 0.16); }
            50% { box-shadow: 0 0 18px rgba(120, 226, 255, 0.38), 0 0 28px rgba(85, 243, 196, 0.22); }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            isolation: isolate;
            touch-action: manipulation;
        }

        .screen,
        #start-screen,
        #game-over-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 10;
        }

        #hud.hidden,
        #start-screen.hidden,
        #game-over-screen.hidden {
            display: none;
        }

        .hud-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: var(--max-hud-width);
            margin: 0 auto;
            padding: 12px 14px 14px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(12, 26, 50, 0.92), rgba(5, 12, 26, 0.9));
            border: 1px solid rgba(120, 226, 255, 0.24);
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.04),
                0 14px 32px rgba(0,0,0,0.3);
        }

        .hud-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: clamp(1rem, 3vw, 1.35rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hud-label,
        #scoreDisplay,
        .instruction,
        .result-score {
            font-family: var(--ui-font);
        }

        .text-red-400 { color: var(--hud-red); }
        .text-green-400 { color: var(--hud-green); }
        .text-white { color: var(--text-white); }
        .text-gray-200 { color: var(--text-gray-200); }
        .text-gray-300 { color: var(--text-gray-300); }
        .text-gray-400 { color: var(--text-gray-400); }
        .text-black { color: var(--text-black); }
        .text-red-500 { color: var(--red-500); }

        .hp-track {
            width: 100%;
            height: 16px;
            background:
                linear-gradient(180deg, rgba(6, 10, 20, 0.92), rgba(18, 28, 52, 0.85));
            border-radius: 999px;
            border: 1px solid var(--gray-600);
            overflow: hidden;
            box-shadow: inset 0 0 14px rgba(0,0,0,0.45);
        }

        #bossHpBar {
            height: 100%;
            background:
                linear-gradient(90deg, #ff4f7d 0%, #ff8f5f 46%, #ffd86b 100%);
            transition: width 0.2s ease;
            box-shadow:
                0 0 18px rgba(255, 107, 143, 0.4),
                inset 0 0 10px rgba(255,255,255,0.22);
        }

        .title-main,
        .result-title {
            font-family: var(--title-font);
            text-transform: uppercase;
        }

        .title-main {
            margin: 0 0 10px;
            font-size: clamp(2.6rem, 11vw, 4.8rem);
            font-weight: 400;
            letter-spacing: 0.14em;
        }

        .title-sub {
            margin: 0 0 24px;
            font-size: clamp(0.95rem, 3.3vw, 1.3rem);
            letter-spacing: 0.4em;
            color: var(--text-gray-200);
            text-transform: uppercase;
        }

        .intro-badge {
            margin-bottom: 16px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(120, 226, 255, 0.28);
            background: rgba(120, 226, 255, 0.08);
            color: var(--hud-cyan);
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .character-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            width: min(100%, 320px);
            margin: 0 0 22px;
            padding: 14px 16px;
            border-radius: 18px;
            background:
                linear-gradient(135deg, rgba(120, 226, 255, 0.12), rgba(255, 107, 143, 0.08)),
                rgba(8, 15, 30, 0.78);
            border: 1px solid rgba(120, 226, 255, 0.24);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
            animation: pulseGlow 2.6s ease-in-out infinite;
        }

        .pilot-avatar {
            position: relative;
            flex: 0 0 74px;
            width: 74px;
            height: 74px;
            border-radius: 22px;
            background:
                radial-gradient(circle at 50% 38%, #a7f4ff 0 18%, #78e2ff 19% 33%, transparent 34%),
                radial-gradient(circle at 50% 68%, #55f3c4 0 18%, #1d6c86 19% 32%, transparent 33%),
                linear-gradient(180deg, #1f3a70 0%, #0b1632 100%);
            border: 2px solid rgba(120, 226, 255, 0.55);
            box-shadow:
                0 0 18px rgba(120, 226, 255, 0.3),
                inset 0 0 18px rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .pilot-avatar::before,
        .pilot-avatar::after {
            content: "";
            position: absolute;
            inset: auto;
            border-radius: 999px;
        }

        .pilot-avatar::before {
            width: 44px;
            height: 16px;
            left: 15px;
            top: 22px;
            background:
                radial-gradient(circle, #06101f 0 22%, transparent 23%),
                radial-gradient(circle, #06101f 0 22%, transparent 23%);
            background-size: 50% 100%;
            background-position: left center, right center;
            background-repeat: no-repeat;
            opacity: 0.95;
        }

        .pilot-avatar::after {
            width: 26px;
            height: 10px;
            left: 24px;
            top: 45px;
            border-bottom: 3px solid #ffd86b;
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .character-copy {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .character-name {
            margin: 0 0 4px;
            color: var(--text-white);
            font-family: var(--title-font);
            font-size: 1rem;
            letter-spacing: 0.08em;
        }

        .character-role {
            margin: 0;
            color: var(--text-gray-300);
            font-size: 0.86rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .instruction {
            margin-top: 22px;
            font-size: 0.84rem;
            color: var(--text-gray-300);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .menu-button {
            min-width: 200px;
            padding: 15px 28px;
            border-radius: 14px;
            font-family: var(--title-font);
            font-weight: 400;
            font-size: clamp(1.05rem, 4vw, 1.55rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
        }

        .menu-button:active {
            transform: scale(0.95);
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            z-index: 18;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 24vw, 136px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(120, 226, 255, 0.34);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.28),
                0 0 22px rgba(120, 226, 255, 0.16);
            opacity: 0;
            transform: scale(0.85) translateY(10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            background: rgba(4, 9, 18, 0.76);
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        #impact-gif {
            right: 12px;
            top: 92px;
        }

        #result-gif {
            left: 50%;
            bottom: 112px;
            transform: translateX(-50%) scale(0.85) translateY(10px);
            width: clamp(120px, 34vw, 176px);
        }

        #result-gif.visible {
            transform: translateX(-50%) scale(1) translateY(0);
        }

        .feedback-caption {
            position: absolute;
            left: 50%;
            bottom: 72px;
            transform: translateX(-50%);
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(7, 16, 30, 0.8);
            border: 1px solid rgba(120, 226, 255, 0.24);
            color: var(--text-gray-200);
            font-family: var(--ui-font);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.22s ease;
            white-space: nowrap;
        }

        .feedback-caption.visible {
            opacity: 1;
        }

        .button-primary {
            background:
                linear-gradient(180deg, var(--green-400), var(--green-500));
            color: var(--text-black);
            box-shadow:
                0 0 20px rgba(111,255,210,0.42),
                inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .button-primary:hover {
            filter: brightness(1.03);
        }

        .button-secondary {
            background:
                linear-gradient(180deg, #d9ebff, #a9cfff);
            color: #04111f;
            box-shadow:
                0 0 16px rgba(95, 168, 255, 0.22),
                inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .button-secondary:hover {
            filter: brightness(1.03);
        }

        .result-title {
            margin: 0 0 14px;
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 400;
            letter-spacing: 0.1em;
        }

        .result-score {
            margin-bottom: 28px;
            font-size: clamp(1rem, 4vw, 1.35rem);
            color: var(--hud-green);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #start-screen,
        #game-over-screen {
            gap: 0;
        }

        #start-screen::before,
        #game-over-screen::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }

        @media (max-width: 640px) {
            #hud {
                padding: 12px;
            }

            .hud-card {
                padding: 10px 12px 12px;
                border-radius: 16px;
            }

            .screen,
            #start-screen,
            #game-over-screen {
                padding: 20px 16px;
            }

            .title-sub,
            .instruction {
                letter-spacing: 0.1em;
            }

            .character-card {
                width: min(100%, 300px);
                gap: 12px;
                padding: 12px 14px;
            }

            .pilot-avatar {
                flex-basis: 64px;
                width: 64px;
                height: 64px;
            }

            .menu-button {
                width: min(100%, 280px);
                padding: 14px 24px;
            }
        }
    </style>
</head>

<script>
/**
 * §2 Technical Contract: Viewport & Canvas
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = window.devicePixelRatio || 1;

// State
let lastTime = 0;
let isPlaying = false;
let score = 0;
let gameTime = 0;
let shakeTime = 0;

// Config Proxy
window.gameConfig = {
    playerSpeed: 1.2,
    bossHp: 1000,
    bulletSpeed: 200
};

// Config Definitions
window.gameConfigDefs = {
    playerSpeed: { type: "number", label: "Control Sensitivity", value: 1.2, min: 0.5, max: 3.0 },
    bossHp: { type: "number", label: "Target Shield Strength", value: 1000, min: 100, max: 5000 },
    bulletSpeed: { type: "number", label: "Threat Bolt Speed", value: 200, min: 100, max: 500 }
};

// Hot Reload
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'bossHp' && boss) {
            boss.maxHp = val;
            boss.hp = val;
        }
    }
};

/**
 * §A.2 Audio Manager
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.bgmNode = null;
        this.unlocked = false;
    }

    unlock() {
        if (this.unlocked) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.unlocked = true;
        this.playBgm();
    }

    async load(id) {
        const el = document.getElementById(id);
        this.buffers[id] = el || 'error';
    }

    playBgm() {
        const el = document.getElementById('bgm_rush');
        if (el) {
            el.volume = 0.2;
            el.play().catch(() => {});
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_rush');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id, fallbackType = 'beep', volume = 0.36) {
        if (!this.unlocked) {
            this.synthesize(fallbackType);
            return;
        }
        const el = this.buffers[id];
        if (!(el instanceof HTMLAudioElement)) {
            this.synthesize(fallbackType);
            return;
        }
        const instance = el.cloneNode();
        instance.volume = volume;
        instance.play().catch(() => {
            this.synthesize(fallbackType);
        });
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
}

const audio = new AudioManager();

/**
 * Game Entities
 */
class Player {
    constructor() {
        this.x = canvas.width / dpr / 2;
        this.y = canvas.height / dpr * 0.8;
        this.radius = 12;
        this.color = '#78E2FF';
        this.fireTimer = 0;
        this.fireRate = 0.1;
    }

    update(dt) {
        this.x = Math.max(this.radius, Math.min(canvas.width / dpr - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height / dpr - this.radius, this.y));

        this.fireTimer -= dt;
        if (this.fireTimer <= 0) {
            bullets.push(new Bullet(this.x, this.y - 10, 0, -800, true));
            this.fireTimer = this.fireRate;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.shadowBlur = 18;
        ctx.shadowColor = 'rgba(120, 226, 255, 0.75)';

        ctx.fillStyle = '#0d1f42';
        ctx.beginPath();
        ctx.moveTo(0, -this.radius * 1.45);
        ctx.lineTo(this.radius * 0.88, this.radius * 1.05);
        ctx.lineTo(0, this.radius * 0.35);
        ctx.lineTo(-this.radius * 0.88, this.radius * 1.05);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#78E2FF';
        ctx.beginPath();
        ctx.moveTo(0, -this.radius * 1.1);
        ctx.lineTo(this.radius * 0.58, this.radius * 0.82);
        ctx.lineTo(0, this.radius * 0.2);
        ctx.lineTo(-this.radius * 0.58, this.radius * 0.82);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#FFD86B';
        ctx.beginPath();
        ctx.moveTo(0, -this.radius * 0.58);
        ctx.lineTo(this.radius * 0.18, this.radius * 0.24);
        ctx.lineTo(-this.radius * 0.18, this.radius * 0.24);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#55F3C4';
        ctx.fillRect(-this.radius * 0.2, this.radius * 0.5, this.radius * 0.4, this.radius * 0.85);

        ctx.restore();
    }
}

class Boss {
    constructor() {
        this.x = canvas.width / dpr / 2;
        this.y = 100;
        this.w = 120;
        this.h = 120;
        this.maxHp = window.gameConfig.bossHp;
        this.hp = this.maxHp;
        this.phase = 0;
        this.phaseTimer = 0;
        this.vx = 50;
        this.flashTime = 0;
        
        this.img = document.getElementById('asset_boss');
    }

    update(dt) {
        this.phaseTimer += dt;
        this.flashTime -= dt;

        this.x += this.vx * dt;
        if (this.x < this.w/2 || this.x > canvas.width/dpr - this.w/2) {
            this.vx *= -1;
        }

        const speed = window.gameConfig.bulletSpeed;
        
        if (this.phase === 0) {
            if (this.phaseTimer > 0.8) {
                this.shootSpread(3, speed);
                this.phaseTimer = 0;
            }
            if (gameTime > 10) this.phase = 1;
        }
        else if (this.phase === 1) {
            if (this.phaseTimer > 0.1) {
                const angle = gameTime * 2;
                bullets.push(new Bullet(this.x, this.y + 40, Math.cos(angle)*speed, Math.sin(angle)*speed, false));
                bullets.push(new Bullet(this.x, this.y + 40, Math.cos(angle + Math.PI)*speed, Math.sin(angle + Math.PI)*speed, false));
                this.phaseTimer = 0;
            }
            if (gameTime > 25) this.phase = 2;
        }
        else {
            if (this.phaseTimer > 0.5) {
                this.shootSpread(7, speed * 1.5);
                this.phaseTimer = 0;
            }
        }
    }

    shootSpread(count, speed) {
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI / 2) + (i - (count-1)/2) * 0.3;
            bullets.push(new Bullet(this.x, this.y + 40, Math.cos(angle)*speed, Math.sin(angle)*speed, false));
        }
    }

    hit(dmg) {
        this.hp -= dmg;
        this.flashTime = 0.1;
        if (this.hp <= 0) {
            gameOver(true);
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        if (this.flashTime > 0) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.filter = 'brightness(1000%)';
        }

        ctx.beginPath();
        ctx.arc(0, 0, this.w / 2 + 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 79, 125, 0.12)';
        ctx.fill();

        if (this.img && this.img.complete && this.img.naturalWidth > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, this.w/2, 0, Math.PI*2);
            ctx.clip();
            ctx.drawImage(this.img, -this.w/2, -this.w/2, this.w, this.w);
            ctx.restore();

            ctx.beginPath();
            ctx.arc(0, 0, this.w/2 + 3, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 216, 107, 0.65)';
            ctx.lineWidth = 3;
            ctx.stroke();
        } else {
            ctx.fillStyle = '#FF4081';
            ctx.fillRect(-this.w/2, -this.w/2, this.w, this.h);
        }

        ctx.restore();
    }
}

class Bullet {
    constructor(x, y, vx, vy, isPlayer) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.isPlayer = isPlayer;
        this.r = isPlayer ? 4 : 6;
        this.active = true;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        if (this.x < -50 || this.x > canvas.width/dpr + 50 || this.y < -50 || this.y > canvas.height/dpr + 50) {
            this.active = false;
        }
    }

    draw(ctx) {
        if (this.isPlayer) {
            ctx.fillStyle = '#FFD86B';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255, 216, 107, 0.7)';
        } else {
            ctx.fillStyle = '#FF4F7D';
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(255, 79, 125, 0.65)';
        }
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 100 + 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 2 + 1;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= this.decay * dt;
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 4, 4);
        ctx.globalAlpha = 1;
    }
}

let player;
let boss;
let bullets = [];
let particles = [];

function initGame() {
    player = new Player();
    boss = new Boss();
    bullets = [];
    particles = [];
    score = 0;
    gameTime = 0;
    
    const config = document.getElementById('game-config');
    if (config) {
        try {
            const parsed = JSON.parse(config.textContent);
            Object.keys(parsed).forEach(k => {
                if(window.gameConfigDefs[k]) window.gameConfigDefs[k].value = parsed[k].value;
                window.gameConfig[k] = parsed[k].value;
            });
        } catch(e) {}
    }
    
    boss.maxHp = window.gameConfig.bossHp;
    boss.hp = boss.maxHp;
    
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    
    isPlaying = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function gameOver(win) {
    isPlaying = false;
    audio.stopBgm();
    
    if (win) {
        audio.playSfx('sfx_win', 'beep', 0.42);
        document.getElementById('go-title').innerText = "CORE DISABLED";
        document.getElementById('go-title').className = "result-title text-green-400";
    } else {
        audio.playSfx('sfx_lose', 'explosion', 0.42);
        document.getElementById('go-title').innerText = "SHIP LOST";
        document.getElementById('go-title').className = "result-title text-red-500";
    }

    showResultFeedback(win);
    
    document.getElementById('finalScore').innerText = Math.floor(score);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function spawnExplosion(x, y, color) {
    for(let i=0; i<10; i++) {
        particles.push(new Particle(x, y, color));
    }
}

let isDragging = false;
let lastX = 0;
let lastY = 0;
let impactGifTimeout = 0;
let resultGifTimeout = 0;

const impactGif = document.getElementById('impact-gif');
const resultGif = document.getElementById('result-gif');
const feedbackCaption = document.getElementById('feedback-caption');

function showImpactFeedback(label = 'core impact') {
    if (!impactGif || !feedbackCaption) return;
    clearTimeout(impactGifTimeout);
    feedbackCaption.textContent = label;
    impactGif.classList.add('visible');
    feedbackCaption.classList.add('visible');
    impactGifTimeout = window.setTimeout(() => {
        impactGif.classList.remove('visible');
        feedbackCaption.classList.remove('visible');
    }, 420);
}

function showResultFeedback(win) {
    if (!resultGif) return;
    clearTimeout(resultGifTimeout);
    resultGif.src = win
        ? 'https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp'
        : 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';
    resultGif.classList.add('visible');
    resultGifTimeout = window.setTimeout(() => {
        resultGif.classList.remove('visible');
    }, 2200);
}

function handlePointerDown(e) {
    if (!isPlaying) return;
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    audio.unlock();
}

function handlePointerMove(e) {
    if (!isPlaying || !isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    
    player.x += dx * window.gameConfig.playerSpeed;
    player.y += dy * window.gameConfig.playerSpeed;
    
    lastX = e.clientX;
    lastY = e.clientY;
}

function handlePointerUp(e) {
    isDragging = false;
}

function drawBackdrop(width, height, time) {
    const drift = time * 18;
    const gridSize = 48;

    const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
    bgGrad.addColorStop(0, '#06101f');
    bgGrad.addColorStop(0.55, '#09172f');
    bgGrad.addColorStop(1, '#040811');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.globalAlpha = 0.24;
    ctx.strokeStyle = '#123356';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let x = -gridSize; x < width + gridSize; x += gridSize) {
        const driftX = (x + drift * 0.28) % (gridSize * 2);
        ctx.moveTo(driftX, 0);
        ctx.lineTo(driftX - 24, height);
    }
    for (let y = (drift * 0.7) % gridSize; y < height + gridSize; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
    }
    ctx.stroke();
    ctx.restore();

    const stars = [
        [0.14, 0.16, 1.6, '#78E2FF'],
        [0.31, 0.24, 1.3, '#FFFFFF'],
        [0.52, 0.1, 1.8, '#FFD86B'],
        [0.76, 0.18, 1.4, '#78E2FF'],
        [0.86, 0.34, 1.2, '#FFFFFF'],
        [0.2, 0.52, 1.5, '#6FFFD2'],
        [0.68, 0.62, 1.7, '#FFD86B'],
        [0.9, 0.72, 1.3, '#78E2FF']
    ];

    stars.forEach(([sx, sy, radius, color], index) => {
        const pulse = 0.55 + Math.sin(time * 2 + index) * 0.25;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(width * sx, height * sy, radius, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function gameLoop(timestamp) {
    if (!isPlaying) return;
    
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    gameTime += dt;
    
    if (shakeTime > 0) {
        shakeTime -= dt;
        const mag = shakeTime * 10;
        ctx.setTransform(dpr, 0, 0, dpr, (Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
    } else {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const width = canvas.width / dpr;
    const height = canvas.height / dpr;
    drawBackdrop(width, height, gameTime);

    player.update(dt);
    player.draw(ctx);
    
    boss.update(dt);
    boss.draw(ctx);
    
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update(dt);
        b.draw(ctx);
        
        if (!b.active) {
            bullets.splice(i, 1);
            continue;
        }
        
        if (b.isPlayer) {
            const dx = b.x - boss.x;
            const dy = b.y - boss.y;
            if (dx*dx + dy*dy < (boss.w/2)*(boss.w/2)) {
                boss.hit(10);
                score += 10;
                b.active = false;
                spawnExplosion(b.x, b.y, '#FFF');
                audio.playSfx('sfx_hit', 'beep', 0.28);
                showImpactFeedback('shield hit');
            }
        } else {
            const dx = b.x - player.x;
            const dy = b.y - player.y;
            if (dx*dx + dy*dy < (player.radius + b.r)*(player.radius + b.r)) {
                shakeTime = 0.5;
                spawnExplosion(player.x, player.y, '#E9C46A');
                audio.playSfx('sfx_player_hit', 'explosion', 0.35);
                showImpactFeedback('hull breach');
                gameOver(false);
            }
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(dt);
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    document.getElementById('scoreDisplay').innerText = Math.floor(score);
    const hpPct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    document.getElementById('bossHpBar').style.width = hpPct + '%';

    requestAnimationFrame(gameLoop);
}

function resize() {
    const rect = document.getElementById('game-container').getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();
    
    audio.load('sfx_hit');
    audio.load('sfx_win');
    audio.load('sfx_lose');
    audio.load('sfx_start');
    audio.load('sfx_ui');
    audio.load('sfx_player_hit');
    
    canvas.addEventListener('pointerdown', handlePointerDown, { passive: false });
    window.addEventListener('pointermove', handlePointerMove, { passive: false });
    window.addEventListener('pointerup', handlePointerUp);
    window.addEventListener('pointercancel', handlePointerUp);
    
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSfx('sfx_start', 'beep', 0.36);
        initGame();
    });
    
    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSfx('sfx_ui', 'beep', 0.3);
        initGame();
    });
});

</script>
