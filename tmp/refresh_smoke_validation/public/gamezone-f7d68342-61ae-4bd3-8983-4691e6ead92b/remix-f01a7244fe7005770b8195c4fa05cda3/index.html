<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spotlight Sprint</title>
    <!-- [agent-note][stage3] resolved-font: title -> Audiowide, ui -> Exo 2 via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #060816;
            --bg-bottom: #180b2d;
            --panel-bg: rgba(11, 18, 36, 0.78);
            --panel-border: rgba(114, 245, 255, 0.42);
            --hud-bg: rgba(10, 14, 28, 0.68);
            --accent-cyan: #72f5ff;
            --accent-magenta: #ff4fb7;
            --accent-gold: #ffd86b;
            --text-main: #f6fbff;
            --text-dim: #c7d6ea;
            --danger: #ff6d6d;
            --shadow-deep: rgba(0, 0, 0, 0.42);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at top, #2a1450 0%, var(--bg-top) 42%, #04050c 100%);
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .hidden { display: none !important; }
        .glass {
            background:
                linear-gradient(180deg, rgba(18, 28, 56, 0.88), var(--panel-bg));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 45px var(--shadow-deep),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04),
                0 0 28px rgba(114, 245, 255, 0.12);
        }
        .title-font { font-family: 'Audiowide', system-ui, sans-serif; }
        .hud-font { font-family: 'Exo 2', system-ui, sans-serif; }
        .score-font { font-family: 'Audiowide', system-ui, sans-serif; }
        .button-font { font-family: 'Exo 2', system-ui, sans-serif; }
        .sr-game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }
        .sr-ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .sr-panel {
            position: relative;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            overflow: hidden;
        }
        .sr-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 15%, rgba(114, 245, 255, 0.2), transparent 28%),
                radial-gradient(circle at 85% 0%, rgba(255, 79, 183, 0.18), transparent 30%);
            pointer-events: none;
        }
        .sr-title {
            position: relative;
            margin: 0 0 0.5rem;
            font-size: clamp(3rem, 9vw, 5.5rem);
            line-height: 0.92;
            letter-spacing: 0.08em;
            color: var(--accent-magenta);
            text-shadow:
                0 2px 2px rgba(0,0,0,0.8),
                0 0 22px rgba(255, 79, 183, 0.35);
        }
        .sr-subtitle {
            position: relative;
            margin: 0 0 2rem;
            color: var(--text-dim);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            animation: pulse 1.8s ease-in-out infinite;
        }
        .sr-button {
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 0.85rem 2rem;
            min-width: min(16rem, 72vw);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }
        .sr-button:active {
            transform: scale(0.95);
            filter: brightness(1.04);
        }
        .sr-button-primary {
            background: linear-gradient(135deg, var(--accent-magenta), #ff7dd0);
            color: #fff;
            box-shadow: 0 0 18px rgba(255,79,183,0.42);
        }
        .sr-button-primary:hover { background: linear-gradient(135deg, #ff5dc0, #ff95d9); }
        .sr-button-secondary {
            background: linear-gradient(135deg, #eef7ff, #d2f0ff);
            color: #7b1361;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }
        .sr-button-secondary:hover { background: linear-gradient(135deg, #ffffff, #e0f7ff); }
        .sr-game-over-title {
            position: relative;
            margin: 0 0 1rem;
            font-size: 2.4rem;
        }
        .sr-final-score {
            position: relative;
            margin-bottom: 0.5rem;
            color: #ff9ad8;
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 700;
            text-shadow: 0 0 16px rgba(255, 79, 183, 0.28);
        }
        .sr-score-label {
            position: relative;
            margin: 0 0 2rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
        }
        .sr-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 2rem);
            padding: max(0.75rem, env(safe-area-inset-top)) 1rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
        }
        .sr-pill {
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(9, 16, 31, 0.88), var(--hud-bg));
            border: 1px solid rgba(114, 245, 255, 0.22);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        }
        .sr-hud-label {
            margin-right: 0.45rem;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.14em;
        }
        .sr-pink { color: #ff80d1; }
        .sr-gold { color: var(--accent-gold); }
        .sr-hud-value {
            color: #fff;
            font-size: 1.05rem;
        }
        .sr-floating-text {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .sr-float-text {
            position: absolute;
            font-weight: 700;
            font-size: clamp(1.1rem, 4vw, 1.7rem);
            letter-spacing: 0.08em;
            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.45),
                0 0 16px currentColor;
            animation: floatTextPop 0.8s ease-out forwards;
        }
        .camera-flash {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }
        .flash-active { animation: flash 0.15s ease-out; }
        .sr-feedback-layer {
            position: absolute;
            inset: auto 0 1rem 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            z-index: 55;
            padding: 0 0.75rem max(0.75rem, env(safe-area-inset-bottom));
        }
        .sr-feedback-card {
            width: min(12rem, 42vw);
            border-radius: 1rem;
            overflow: hidden;
            opacity: 0;
            transform: translateY(18px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 14px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(10, 14, 28, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .sr-feedback-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .sr-feedback-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .sr-feedback-caption {
            padding: 0.45rem 0.6rem 0.55rem;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #fff;
            background: linear-gradient(180deg, rgba(6,10,18,0.2), rgba(6,10,18,0.72));
        }
        .sr-feedback-card.fail .sr-feedback-caption {
            color: #ffd5df;
        }
        @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes pulse {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }
        @keyframes floatTextPop {
            0% { opacity: 0; transform: translate(-50%, -20%) scale(0.7); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -120%) scale(1.08); }
        }
        @media (max-width: 640px) {
            .sr-panel {
                width: min(88vw, 22rem);
                padding: 1.35rem 1rem;
                border-radius: 1.2rem;
            }
            .sr-subtitle {
                margin-bottom: 1.25rem;
                font-size: 0.88rem;
                letter-spacing: 0.18em;
            }
            .sr-button {
                min-width: 100%;
                padding: 0.85rem 1.2rem;
                font-size: 1rem;
            }
            .sr-hud {
                width: calc(100% - 1rem);
                padding: max(0.65rem, env(safe-area-inset-top)) 0.5rem 0.5rem;
            }
            .sr-pill {
                padding: 0.5rem 0.75rem;
            }
            .sr-hud-label {
                font-size: 0.78rem;
            }
            .sr-hud-value {
                font-size: 0.95rem;
            }
            .sr-feedback-card {
                width: min(9rem, 40vw);
            }
            .sr-feedback-caption {
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>

    <!-- Configuration Declaration -->
    <script id="game-config" type="application/x-game-config">
    {
        "runwaySpeed": { "type": "number", "label": "Runway Speed", "value": 6, "min": 3, "max": 15 },
        "heroSensitivity": { "type": "number", "label": "Control Sensitivity", "value": 0.15, "min": 0.05, "max": 0.5 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#FF0080" },
        "spawnRate": { "type": "number", "label": "Spawn Rate", "value": 60, "min": 20, "max": 120 }
    }
    </script>

    <!-- [agent-note][stage3] resolved-audio: gameplay loop + collect/fail/ui from catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM: Spotlight Groove" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="SFX: Collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="SFX: Fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="SFX: UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_streak" data-editable="audio" data-label="SFX: Streak Boost" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>

    <!-- Placeholder images for editor recognition (Procedural used in game) -->
    <img id="asset_player" data-editable="image" data-label="Player Icon" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCI+PGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIGZpbGw9IiNGRjAwODAiLz48L3N2Zz4=" hidden>

    <div id="game-container" class="sr-game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="flash-overlay" class="camera-flash"></div>

        <!-- UI Layer -->
        <div id="ui-layer" class="sr-ui-layer">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass sr-panel">
                <h1 class="title-font sr-title">SPOTLIGHT<br><span style="color:#ffffff;">SPRINT</span></h1>
                <p class="sr-subtitle hud-font">DRAG TO CATCH THE GLOW</p>
                <button id="start-btn" class="sr-button sr-button-primary button-font">
                    START THE SET
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass sr-panel">
                <h2 class="title-font sr-game-over-title">SPOTLIGHT LOST</h2>
                <div class="sr-final-score score-font" id="final-score">0</div>
                <p class="sr-score-label hud-font">Crowd Hype</p>
                <button id="restart-btn" class="sr-button sr-button-secondary button-font">
                    RUN IT BACK
                </button>
            </div>

            <!-- HUD -->
            <div id="hud" class="hidden sr-hud">
                <div class="glass sr-pill">
                    <span class="sr-hud-label sr-pink hud-font">HYPE</span>
                    <span id="score-display" class="sr-hud-value score-font">0</span>
                </div>
                <div class="glass sr-pill">
                    <span class="sr-hud-label sr-gold hud-font">STREAK</span>
                    <span id="combo-display" class="sr-hud-value score-font">x1</span>
                </div>
            </div>
            
            <!-- Floating Text Container -->
            <div id="floating-text-container" class="sr-floating-text"></div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: reward/fail reactions kept off playfield for mobile safety -->
        <div id="feedback-layer" class="sr-feedback-layer" aria-live="polite">
            <div id="feedback-success" class="sr-feedback-card hidden">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Reward reaction animation">
                <div class="sr-feedback-caption hud-font">HYPE SPIKE</div>
            </div>
            <div id="feedback-fail" class="sr-feedback-card fail hidden">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction animation">
                <div class="sr-feedback-caption hud-font">SET CRASH</div>
            </div>
        </div>
    </div>

    <script>
        // §3.1 Configuration
        const defaultConfig = {
            runwaySpeed: 6,
            heroSensitivity: 0.15,
            themeColor: "#FF0080",
            spawnRate: 60
        };

        // Expose config to window
        window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = {};
        
        // Initialize config values
        for (const key in window.gameConfigDefs) {
            window.gameConfig[key] = window.gameConfigDefs[key].value;
        }

        window.updateGameConfig = (key, val) => {
            if (window.gameConfig.hasOwnProperty(key)) {
                window.gameConfig[key] = val;
                // Hot reload logic
                if (key === 'themeColor') {
                    document.querySelector('h1').style.color = val;
                }
            }
        };

        // §2 & §4 Core Engine
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let animationId;
        let lastTime = 0;
        
        // Game State
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let combo = 1;
        let gameSpeed = 1;
        
        // Entities
        let player = { x: 0.5, y: 0.8, targetX: 0.5, width: 0.1, height: 0.08, color: '#FFFFFF', tilt: 0 };
        let items = []; // { x, y, type, color, active }
        let particles = [];
        let cameraFlashes = [];
        let feedbackTimeoutId = null;
        let lastCollectSfxTime = 0;
        let lastUiSfxTime = 0;
        let lastStreakSfxTime = 0;
        
        // Audio System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const sounds = {
            bgm: document.getElementById('bgm_main'),
            collect: document.getElementById('sfx_collect'),
            fail: document.getElementById('sfx_fail'),
            ui: document.getElementById('sfx_ui'),
            streak: document.getElementById('sfx_streak')
        };

        Object.values(sounds).forEach((el) => {
            if (el) {
                el.crossOrigin = 'anonymous';
            }
        });
        
        // Audio Unlock
        const unlockAudio = () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            document.removeEventListener('pointerdown', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
        };
        document.addEventListener('pointerdown', unlockAudio);
        document.addEventListener('keydown', unlockAudio);

        function safeResetAndPlay(el, volume) {
            if (!el) return false;
            try {
                el.pause();
                el.currentTime = 0;
                el.volume = volume;
                el.play().catch(() => {});
                return true;
            } catch (err) {
                return false;
            }
        }

        function playSound(id) {
            const el = sounds[id];
            const now = performance.now();

            if (id === 'collect' && now - lastCollectSfxTime < 90) return;
            if (id === 'ui' && now - lastUiSfxTime < 120) return;
            if (id === 'streak' && now - lastStreakSfxTime < 220) return;

            if (id === 'collect') lastCollectSfxTime = now;
            if (id === 'ui') lastUiSfxTime = now;
            if (id === 'streak') lastStreakSfxTime = now;

            if (id === 'fail') {
                synthesizeSound('fail');
                return;
            }

            if (el) {
                if (id === 'bgm') {
                    el.loop = true;
                    el.volume = 0.2;
                    el.play().catch(() => synthesizeSound('bgm'));
                } else {
                    const clone = el.cloneNode();
                    clone.crossOrigin = 'anonymous';
                    clone.volume = id === 'streak' ? 0.46 : 0.34;
                    clone.play().catch(() => synthesizeSound(id));
                }
            } else {
                synthesizeSound(id);
            }
        }

        function stopLoop(id) {
            const el = sounds[id];
            if (!el) return;
            try {
                el.pause();
                el.currentTime = 0;
            } catch (err) {}
        }

        function synthesizeSound(type) {
            if (!audioCtx || audioCtx.state === 'closed') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'collect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'ui') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(580, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.06);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'streak') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(620, now);
                osc.frequency.exponentialRampToValueAtTime(1040, now + 0.12);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'bgm') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function showFeedback(type) {
            const successCard = document.getElementById('feedback-success');
            const failCard = document.getElementById('feedback-fail');
            const active = type === 'success' ? successCard : failCard;
            const inactive = type === 'success' ? failCard : successCard;

            inactive.classList.add('hidden');
            inactive.classList.remove('visible');
            active.classList.remove('hidden');

            requestAnimationFrame(() => active.classList.add('visible'));

            if (feedbackTimeoutId) clearTimeout(feedbackTimeoutId);
            feedbackTimeoutId = setTimeout(() => {
                active.classList.remove('visible');
                setTimeout(() => active.classList.add('hidden'), 220);
            }, type === 'success' ? 850 : 1400);
        }

        // Resize Handling
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        
        // Input Handling
        let isPointerDown = false;
        
        function handleInput(e) {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX;
            // Normalize X to 0-1
            player.targetX = Math.max(0.1, Math.min(0.9, (clientX - rect.left) / rect.width));
        }

        canvas.addEventListener('pointerdown', (e) => {
            isPointerDown = true;
            handleInput(e);
        }, { passive: false });
        
        canvas.addEventListener('pointermove', (e) => {
            if (isPointerDown) handleInput(e);
        }, { passive: false });
        
        const endInput = () => { isPointerDown = false; };
        canvas.addEventListener('pointerup', endInput);
        canvas.addEventListener('pointercancel', endInput);

        // Game Logic
        function initGame() {
            score = 0;
            combo = 1;
            gameSpeed = 1;
            player.x = 0.5;
            player.targetX = 0.5;
            player.color = '#FFFFFF';
            items = [];
            particles = [];
            cameraFlashes = [];
            document.getElementById('score-display').textContent = '0';
            document.getElementById('combo-display').textContent = 'x1';
            document.getElementById('floating-text-container').innerHTML = '';
            document.getElementById('feedback-success').classList.add('hidden');
            document.getElementById('feedback-success').classList.remove('visible');
            document.getElementById('feedback-fail').classList.add('hidden');
            document.getElementById('feedback-fail').classList.remove('visible');
            
            playSound('bgm');
        }

        function spawnItem() {
            const lane = 0.2 + Math.random() * 0.6;
            const isGood = Math.random() > 0.3; // 70% good items
            
            const colors = ['#FF0080', '#FFD700', '#00FFFF', '#FFFFFF'];
            const color = isGood ? colors[Math.floor(Math.random() * colors.length)] : '#333333';
            
            items.push({
                x: lane,
                y: -0.1,
                type: isGood ? (Math.random() > 0.5 ? 'dress' : 'bag') : 'trash',
                color: color,
                isBad: !isGood,
                rotation: Math.random() * Math.PI * 2,
                active: true
            });
        }

        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 0.02
                });
            }
        }

        function showFloatingText(text, x, y, color) {
            const container = document.getElementById('floating-text-container');
            const el = document.createElement('div');
            el.textContent = text;
            el.className = 'sr-float-text title-font';
            el.style.color = color;
            el.style.left = (x * 100) + '%';
            el.style.top = (y * 100) + '%';
            el.style.transform = 'translate(-50%, -50%)';
            el.style.textShadow = '0 2px 4px rgba(0,0,0,0.5)';
            container.appendChild(el);
            
            setTimeout(() => el.remove(), 800);
        }

        function triggerCameraFlash() {
            const flash = document.getElementById('flash-overlay');
            flash.classList.remove('flash-active');
            void flash.offsetWidth; // Trigger reflow
            flash.classList.add('flash-active');
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            stopLoop('bgm');
            playSound('fail');
            showFeedback('fail');
            
            // Screen shake effect
            canvas.style.transform = 'translate(5px, 5px)';
            setTimeout(() => canvas.style.transform = 'translate(-5px, -5px)', 50);
            setTimeout(() => canvas.style.transform = 'translate(5px, -5px)', 100);
            setTimeout(() => canvas.style.transform = 'none', 150);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = Math.floor(score);
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            // Difficulty ramping
            gameSpeed += dt * 0.01;
            const currentSpeed = window.gameConfig.runwaySpeed * (1 + gameSpeed * 0.1);

            // Player Movement
            player.x += (player.targetX - player.x) * window.gameConfig.heroSensitivity * (dt * 60);
            player.tilt = (player.targetX - player.x) * 2; // Tilt based on movement

            // Spawn Items
            if (Math.random() < (window.gameConfig.spawnRate / 3600) * gameSpeed * 60 * dt) {
                spawnItem();
            }

            // Camera Flashes (Ambient)
            if (Math.random() < 0.05) {
                cameraFlashes.push({
                    x: Math.random() < 0.5 ? Math.random() * 0.2 : 0.8 + Math.random() * 0.2,
                    y: Math.random(),
                    life: 0.1,
                    size: 0.02 + Math.random() * 0.05
                });
            }

            // Update Items
            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;
            const aspectRatio = w / h;

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += (currentSpeed / 1000) * (dt * 60);
                item.rotation += dt * 2;

                // Collision
                const dx = (player.x - item.x);
                const dy = (player.y - item.y) * aspectRatio; // Adjust for aspect ratio
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (item.active && dist < 0.08) {
                    item.active = false;
                    if (item.isBad) {
                        gameOver();
                    } else {
                        // Collect
                        score += 100 * combo;
                        combo = Math.min(combo + 0.1, 5);
                        player.color = item.color;
                        createParticles(item.x, item.y, item.color);
                        playSound('collect');
                        
                        const words = ['NICE!', 'BOOST!', 'CLEAN!', 'GLOW!', 'HOT!'];
                        showFloatingText(words[Math.floor(Math.random()*words.length)], item.x, item.y, item.color);

                        if (combo >= 2.5 && Math.random() > 0.55) {
                            playSound('streak');
                            showFeedback('success');
                        }
                        
                        if (Math.random() > 0.7) triggerCameraFlash();
                    }
                }

                if (item.y > 1.2) {
                    items.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update Camera Flashes
            for (let i = cameraFlashes.length - 1; i >= 0; i--) {
                cameraFlashes[i].life -= dt;
                if (cameraFlashes[i].life <= 0) cameraFlashes.splice(i, 1);
            }

            // Update HUD
            document.getElementById('score-display').textContent = Math.floor(score);
            document.getElementById('combo-display').textContent = 'x' + combo.toFixed(1);
        }

        function draw() {
            const w = canvas.width; // Actual canvas pixels
            const h = canvas.height;
            const cssW = w / (window.devicePixelRatio || 1); // CSS pixels for logic mapping
            const cssH = h / (window.devicePixelRatio || 1);

            // Clear and stage backdrop
            const stageGradient = ctx.createLinearGradient(0, 0, 0, cssH);
            stageGradient.addColorStop(0, '#070c1d');
            stageGradient.addColorStop(0.55, '#15081f');
            stageGradient.addColorStop(1, '#04050c');
            ctx.fillStyle = stageGradient;
            ctx.fillRect(0, 0, cssW, cssH);

            const crowdGlow = ctx.createRadialGradient(cssW * 0.5, cssH * 0.18, 20, cssW * 0.5, cssH * 0.18, cssW * 0.65);
            crowdGlow.addColorStop(0, 'rgba(114,245,255,0.16)');
            crowdGlow.addColorStop(0.4, 'rgba(255,79,183,0.12)');
            crowdGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = crowdGlow;
            ctx.fillRect(0, 0, cssW, cssH);

            // Draw Runway
            const runwayWidth = cssW * 0.6;
            const runwayX = (cssW - runwayWidth) / 2;
            const runwayGradient = ctx.createLinearGradient(0, 0, cssW, 0);
            runwayGradient.addColorStop(0.18, '#0a1022');
            runwayGradient.addColorStop(0.24, '#5f1c77');
            runwayGradient.addColorStop(0.5, '#db2e8a');
            runwayGradient.addColorStop(0.76, '#5f1c77');
            runwayGradient.addColorStop(0.82, '#0a1022');
            ctx.fillStyle = runwayGradient;
            ctx.fillRect(0, 0, cssW, cssH);

            const beamGradientLeft = ctx.createLinearGradient(0, 0, runwayX, cssH);
            beamGradientLeft.addColorStop(0, 'rgba(114,245,255,0.22)');
            beamGradientLeft.addColorStop(1, 'rgba(114,245,255,0)');
            ctx.fillStyle = beamGradientLeft;
            ctx.beginPath();
            ctx.moveTo(runwayX * 0.15, 0);
            ctx.lineTo(runwayX + 20, 0);
            ctx.lineTo(runwayX - 50, cssH);
            ctx.lineTo(0, cssH);
            ctx.closePath();
            ctx.fill();

            const beamGradientRight = ctx.createLinearGradient(cssW, 0, runwayX + runwayWidth, cssH);
            beamGradientRight.addColorStop(0, 'rgba(255,216,107,0.18)');
            beamGradientRight.addColorStop(1, 'rgba(255,216,107,0)');
            ctx.fillStyle = beamGradientRight;
            ctx.beginPath();
            ctx.moveTo(cssW, 0);
            ctx.lineTo(runwayX + runwayWidth - 20, 0);
            ctx.lineTo(runwayX + runwayWidth + 50, cssH);
            ctx.lineTo(cssW, cssH);
            ctx.closePath();
            ctx.fill();

            // Moving runway strip lights
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 2;
            const offset = (performance.now() / 1000 * window.gameConfig.runwaySpeed * 50) % 100;
            for (let y = -50; y < cssH; y += 50) {
                ctx.beginPath();
                ctx.moveTo(runwayX, y + offset);
                ctx.lineTo(runwayX + runwayWidth, y + offset);
                ctx.stroke();
            }

            for (let y = 40; y < cssH; y += 70) {
                ctx.fillStyle = 'rgba(114,245,255,0.28)';
                ctx.fillRect(runwayX + 10, y, 7, 18);
                ctx.fillStyle = 'rgba(255,216,107,0.28)';
                ctx.fillRect(runwayX + runwayWidth - 17, y + 12, 7, 18);
            }

            // Draw Items
            items.forEach(item => {
                if (!item.active) return;
                const ix = item.x * cssW;
                const iy = item.y * cssH;

                ctx.save();
                ctx.translate(ix, iy);
                ctx.rotate(item.rotation);
                
                if (item.isBad) {
                    // Rival camera drone / obstacle
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#1f2436';
                    ctx.beginPath();
                    ctx.roundRect(-17, -12, 34, 24, 8);
                    ctx.fill();
                    ctx.strokeStyle = '#7580a1';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#ff6d6d';
                    ctx.beginPath();
                    ctx.arc(0, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffb2b2';
                    ctx.beginPath(); ctx.moveTo(-9,-9); ctx.lineTo(9,9); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(9,-9); ctx.lineTo(-9,9); ctx.stroke();
                } else {
                    // Spotlight pickups
                    ctx.fillStyle = item.color;
                    ctx.shadowColor = item.color;
                    ctx.shadowBlur = 18;
                    
                    if (item.type === 'bag') {
                        ctx.beginPath();
                        ctx.roundRect(-15, -10, 30, 22, 8);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(0, -8, 8, Math.PI, 0);
                        ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.22)';
                        ctx.fillRect(-8, -2, 16, 5);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(0, -18);
                        ctx.quadraticCurveTo(10, -8, 15, 15);
                        ctx.quadraticCurveTo(0, 23, -15, 15);
                        ctx.quadraticCurveTo(-10, -8, 0, -18);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.24)';
                        ctx.beginPath();
                        ctx.moveTo(0, -12);
                        ctx.lineTo(5, 8);
                        ctx.lineTo(-1, 10);
                        ctx.lineTo(-6, -8);
                        ctx.closePath();
                        ctx.fill();
                    }
                }
                ctx.restore();
            });

            // Draw Player
            const px = player.x * cssW;
            const py = player.y * cssH;
            
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(player.tilt * 0.5); // Tilt into turn
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 26, 24, 10, 0, 0, Math.PI*2);
            ctx.fill();

            // Aura halo
            const aura = ctx.createRadialGradient(0, 0, 6, 0, 0, 42);
            aura.addColorStop(0, 'rgba(255,255,255,0.18)');
            aura.addColorStop(0.4, 'rgba(114,245,255,0.12)');
            aura.addColorStop(1, 'rgba(114,245,255,0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(0, 0, 42, 0, Math.PI * 2);
            ctx.fill();

            // Legs
            ctx.strokeStyle = '#ffd7c2';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-8, 14);
            ctx.lineTo(-10, 34);
            ctx.moveTo(8, 14);
            ctx.lineTo(10, 34);
            ctx.stroke();

            // Body (performance suit)
            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.moveTo(0, -19);
            ctx.quadraticCurveTo(18, -8, 22, 24);
            ctx.quadraticCurveTo(0, 34, -22, 24);
            ctx.quadraticCurveTo(-18, -8, 0, -19);
            ctx.closePath();
            ctx.fill();

            // Accent stripe
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(7, 22);
            ctx.lineTo(0, 24);
            ctx.lineTo(-7, 22);
            ctx.closePath();
            ctx.fill();

            // Arms
            ctx.strokeStyle = '#ffd7c2';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-10, -4);
            ctx.lineTo(-22, 10);
            ctx.moveTo(10, -4);
            ctx.lineTo(22, 10);
            ctx.stroke();

            // Head
            ctx.fillStyle = '#ffd7c2';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, -28, 12, 0, Math.PI * 2);
            ctx.fill();

            // Hair
            ctx.fillStyle = '#23122f';
            ctx.beginPath();
            ctx.arc(0, -30, 15, Math.PI, 0);
            ctx.quadraticCurveTo(15, -20, 11, -8);
            ctx.lineTo(5, -7);
            ctx.quadraticCurveTo(1, -16, -4, -10);
            ctx.lineTo(-12, -8);
            ctx.quadraticCurveTo(-15, -18, -13, -28);
            ctx.closePath();
            ctx.fill();

            // Visor / face sparkle
            ctx.fillStyle = 'rgba(114,245,255,0.75)';
            ctx.beginPath();
            ctx.roundRect(-7, -30, 14, 4, 2);
            ctx.fill();

            ctx.restore();

            // Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x * cssW, p.y * cssH, p.size * cssW * 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Draw Camera Flashes (Background)
            cameraFlashes.forEach(f => {
                ctx.fillStyle = `rgba(255, 255, 255, ${f.life * 2})`;
                ctx.beginPath();
                ctx.arc(f.x * cssW, f.y * cssH, f.size * cssW * 20, 0, Math.PI * 2);
                ctx.fill();
                // Lens flare star
                ctx.save();
                ctx.translate(f.x * cssW, f.y * cssH);
                ctx.rotate(Math.random());
                ctx.fillRect(-20, -1, 40, 2);
                ctx.fillRect(-1, -20, 2, 40);
                ctx.restore();
            });
        }

        function gameLoop(timestamp) {
            try {
                if (!lastTime) lastTime = timestamp;
                const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
                lastTime = timestamp;

                update(dt);
                draw();
                
                animationId = requestAnimationFrame(gameLoop);
            } catch (e) {
                console.error("Game Loop Error:", e);
            }
        }

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            resize();
            
            document.getElementById('start-btn').addEventListener('click', () => {
                playSound('ui');
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                gameState = 'PLAYING';
                initGame();
            });

            document.getElementById('restart-btn').addEventListener('click', () => {
                playSound('ui');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                gameState = 'PLAYING';
                initGame();
            });

            // Start Loop
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
