        /* Animations */
        @keyframes shake {
            0% { transform: translate(0, 0); }

            100% { transform: translate(0, 0); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

            0% { transform: scale(1); }

            100% { transform: scale(1); }

        @keyframes bounce {
            0%, 100% { transform: translateY(-6%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm + sfx -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Cyber" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="none" loop></audio>
<audio id="sfx_pickup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_heal" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>
<audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
<audio id="sfx_buy" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_equip" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "baseSpeed": { "type": "number", "label": "Base Speed", "value": 10, "min": 5, "max": 15 },
    "spawnRate": { "type": "number", "label": "Chaos Level", "value": 1.2, "min": 0.5, "max": 3.0 }
}
</script>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: save + danger feedback overlays -> catalogs/gifs.json -->
    <div id="feedback-gif-layer" aria-hidden="true">
        <img id="save-gif" class="feedback-gif" alt="" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp">
        <img id="danger-gif" class="feedback-gif" alt="" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
    </div>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-safe">
        
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full p-4 mt-12">
            <div class="glass px-4 py-2 rounded-xl flex flex-col items-center min-w-[70px]">
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">RESCUED</div>
                <div id="score-display" class="text-3xl font-bold text-white text-neon leading-none">0</div>
            </div>
            
            <!-- Credits Display (HUD) -->
            <div class="glass px-4 py-2 rounded-xl flex items-center gap-2">
                <span class="text-xl">✨</span>
                <span id="credits-display-hud" class="text-xl font-bold text-emerald-400">0</span>
            </div>

            <div class="glass px-4 py-2 rounded-xl flex flex-col items-center min-w-[70px]">
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">SHIELD</div>
                <div id="lives-display" class="text-xl font-bold text-rose-400 tracking-widest">❤️❤️❤️</div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/85 backdrop-blur-md z-50">
            <div id="game-over-panel" class="glass p-6 rounded-3xl text-center max-w-xs w-full mx-4 border-t-4 border-rose-500 shadow-2xl flex flex-col gap-4">
                <div class="text-6xl animate-bounce">🏥</div>
                <div>
                    <h2 class="text-3xl font-bold text-white text-neon text-rose-500">SHIFT ENDED</h2>
                    <p class="text-slate-400 text-sm">Capacity Reached</p>
                </div>
                
                <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-xs text-slate-500 uppercase font-bold">Patients Saved</span>
                        <span id="final-score" class="text-3xl font-bold text-white">0</span>
                    </div>
                    <div class="w-full h-px bg-slate-700 my-2"></div>
                    <div class="flex justify-between items-end">
                        <span class="text-xs text-emerald-500 uppercase font-bold">Credits Earned</span>
                        <span id="earned-credits" class="text-2xl font-bold text-emerald-400">+0</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button id="shop-btn" class="glass-btn bg-indigo-500/20 text-indigo-300 font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 hover:bg-indigo-500/30 transition-colors">
                        <span class="text-2xl">🛍️</span>
                        <span class="text-xs uppercase">Shop</span>
                    </button>
                    <button id="restart-btn" class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 active:scale-95 transition-transform">
                        NEXT SHIFT
                    </button>
                </div>
            </div>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="hidden absolute inset-0 flex flex-col bg-slate-900 z-50 overflow-hidden">
            <!-- Shop Header -->
            <div class="p-6 pb-2 bg-slate-900 border-b border-slate-800 z-10 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">BIO-MARKET</h2>
                    <div class="glass px-3 py-1 rounded-full flex items-center gap-2">
                        <span class="text-lg">🧬</span>
                        <span id="shop-credits" class="text-xl font-bold text-emerald-400">0</span>
                    </div>
                </div>
                <!-- Tabs -->
                <div class="flex gap-2">
                    <button id="tab-tools" class="flex-1 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 transition-all data-[active=true]:bg-cyan-500/20 data-[active=true]:text-cyan-400 data-[active=true]:border-cyan-500/50" data-active="true">UPGRADES</button>
                    <button id="tab-skins" class="flex-1 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 transition-all data-[active=true]:bg-pink-500/20 data-[active=true]:text-pink-400 data-[active=true]:border-pink-500/50" data-active="false">AVATARS</button>
                </div>
            </div>

            <!-- Shop Content -->
            <div id="shop-content" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-24">
                <!-- Injected via JS -->
            </div>

            <!-- Back Button -->
            <div class="absolute bottom-6 left-0 right-0 px-6 flex justify-center pointer-events-none">
                <button id="shop-back-btn" class="pointer-events-auto glass-btn bg-slate-800/90 backdrop-blur text-white font-bold py-3 px-12 rounded-full shadow-2xl border border-slate-600 active:scale-95 transition-all flex items-center gap-2">
                    <span class="text-xl">↩️</span> RETURN
                </button>
            </div>
        </div>

    </div>
</div>

<script>
/**
 * §0 System Invariants & Globals
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER, SHOP
let lastTime = 0;
let animationFrameId;

// Entities
let hero = { x: 0, y: 0, targetX: 0, targetY: 0, radius: 18, stack: [] };
let hospital = { x: 0, y: 0, w: 120, h: 80 };
let patients = []; 
let viruses = [];
let particles = [];
let backgroundGrid = [];

// State
let score = 0;
let lives = 3;
let spawnTimer = 0;
let difficultyMultiplier = 1;

// Audio Context
let audioCtx;
const audioElements = {};
let audioUnlocked = false;
let dangerGifTimeout = null;
let saveGifTimeout = null;
let failSoundCooldownUntil = 0;

// Visual traits
const SKIN_TONES = ['#f8d9c6', '#eac09e', '#c68642', '#8d5524', '#593b2b'];
const SHIRT_COLORS = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#06b6d4', '#8b5cf6', '#ec4899'];

// Shop Data & Persistence
const DEFAULT_DATA = {
    credits: 0,
    upgrades: { speed: 0, magnet: 0, hull: 0 },
    unlockedSkins: ['default'],
    currentSkin: 'default'
};

let playerData = JSON.parse(localStorage.getItem('pulseRushSave')) || JSON.parse(JSON.stringify(DEFAULT_DATA));

const SHOP_ITEMS = {
    upgrades: [
        { id: 'speed', name: 'Turbo Rotor', icon: '⚡', desc: '+5% Move Speed', max: 5, cost: (lvl) => 100 * (lvl + 1) },
        { id: 'magnet', name: 'Mag-Field', icon: '🧲', desc: '+15% Pickup Range', max: 5, cost: (lvl) => 150 * (lvl + 1) },
        { id: 'hull', name: 'Titanium Hull', icon: '🛡️', desc: '+1 Max Life', max: 3, cost: (lvl) => 300 * (lvl + 1) }
    ],
    skins: [
        { id: 'default', name: 'Medic Blue', icon: '🚑', color: '#38bdf8', cost: 0 },
        { id: 'viper', name: 'Viper Red', icon: '🐍', color: '#ef4444', cost: 500 },
        { id: 'seraph', name: 'Seraph Gold', icon: '👑', color: '#fbbf24', cost: 1000 },
        { id: 'phantom', name: 'Neon Ghost', icon: '👻', color: '#d946ef', cost: 2000 },
        { id: 'stealth', name: 'Ops Black', icon: '🥷', color: '#94a3b8', cost: 1500 }
    ]
};

function saveGame() {
    localStorage.setItem('pulseRushSave', JSON.stringify(playerData));
    updateShopUI();
    updateHUD();
}

/**
 * §1 Config & Lifecycle
 */
document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    resize();
    initAudio();
    initGame();
    setState('PLAYING');
    
    // Listeners
    document.getElementById('restart-btn').addEventListener('click', () => restartGame());
    document.getElementById('shop-btn').addEventListener('click', () => setState('SHOP'));
    document.getElementById('shop-back-btn').addEventListener('click', () => setState('GAMEOVER'));
    
    // Tabs
    document.getElementById('tab-tools').addEventListener('click', () => renderShopItems('upgrades'));
    document.getElementById('tab-skins').addEventListener('click', () => renderShopItems('skins'));

    setupAudioAssets();
    setupGifAssets();

    requestAnimationFrame(loop);
});

window.addEventListener('resize', resize);

function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = `${rect.width}px`;
    canvas.style.height = `${rect.height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cw = rect.width;
    ch = rect.height;
    
    hospital.x = cw / 2;
    hospital.y = 60;

    if (hero.x > cw || hero.y > ch) {
        hero.x = cw / 2;
        hero.y = ch / 2 + 100;
        hero.targetX = cw / 2;
        hero.targetY = ch / 2 + 100;
    }
}

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            window.gameConfig = {};
            for (const k in defs) {
                window.gameConfig[k] = defs[k].value;
            }
        } catch (e) {
            window.gameConfig = { baseSpeed: 10, spawnRate: 1.2 };
        }
    }
}

/**
 * §2 Input System
 */
function handleGlobalInput(e) {
    unlockAudio();

    if (gameState === 'SHOP') return; // Canvas ignores input in shop
    if (gameState === 'GAMEOVER') return; // Handled by DOM buttons

    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left;
        const ty = e.clientY - rect.top;
        if (isFinite(tx) && isFinite(ty)) {
            hero.targetX = tx;
            hero.targetY = ty;
        }
    }
}

/* [agent-note][stage4] mobile-action-path: keep native taps for overlay buttons; scope gesture prevention to canvas only */
canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
canvas.addEventListener('pointermove', (e) => {
    if (gameState === 'PLAYING') {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        hero.targetX = e.clientX - rect.left;
        hero.targetY = e.clientY - rect.top;
    }
}, { passive: false });
canvas.addEventListener('pointerup', (e) => {
    if (gameState === 'PLAYING') {
        e.preventDefault();
    }
}, { passive: false });
canvas.addEventListener('pointercancel', (e) => {
    if (gameState === 'PLAYING') {
        e.preventDefault();
    }
}, { passive: false });

/**
 * §3 Game Logic
 */
function initGame() {
    hero.x = cw / 2;
    hero.y = ch / 2 + 100;
    hero.targetX = cw / 2;
    hero.targetY = ch / 2 + 100;
    hero.stack = [];
    
    // Apply Upgrades
    hero.speedMult = 1 + (playerData.upgrades.speed * 0.05);
    hero.pickupRadius = 18 * (1 + (playerData.upgrades.magnet * 0.15));
    
    patients = [];
    viruses = [];
    particles = [];
    score = 0;
    lives = 3 + playerData.upgrades.hull;
    spawnTimer = 0;
    difficultyMultiplier = 1;
    
    // EKG Grid
    backgroundGrid = [];
    for(let i=0; i<8; i++) {
        backgroundGrid.push({
            y: (ch / 8) * i,
            pulseX: Math.random() * cw,
            speed: 100 + Math.random() * 50
        });
    }
    
    updateHUD();
}

function restartGame() {
    playSound('equip');
    initGame();
    setState('PLAYING');
    document.getElementById('game-container').classList.remove('shake');
}

function setState(newState) {
    const previousState = gameState;
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    const shop = document.getElementById('shop-screen');
    
    hud.classList.add('hidden');
    gameOver.classList.add('hidden');
    shop.classList.add('hidden');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        syncBgmForState();
        if (previousState === 'SHOP') {
            playSound('equip');
        }
    } else if (newState === 'GAMEOVER') {
        gameOver.classList.remove('hidden');
        syncBgmForState();
        showFeedbackGif('danger');
        playSound('gameover');
        
        // Calculate credits
        const earned = score * 10;
        playerData.credits += earned;
        saveGame();
        
        document.getElementById('final-score').innerText = score;
        document.getElementById('earned-credits').innerText = `+${earned}`;
    } else if (newState === 'SHOP') {
        shop.classList.remove('hidden');
        renderShopItems('upgrades'); // Default tab
        playSound('buy');
        syncBgmForState();
    }
}

/**
 * §3.5 Shop Logic
 */
function renderShopItems(tab) {
    const container = document.getElementById('shop-content');
    const btnTools = document.getElementById('tab-tools');
    const btnSkins = document.getElementById('tab-skins');
    
    btnTools.dataset.active = tab === 'upgrades';
    btnSkins.dataset.active = tab === 'skins';
    
    container.innerHTML = '';
    
    if (tab === 'upgrades') {
        SHOP_ITEMS.upgrades.forEach(item => {
            const currentLvl = playerData.upgrades[item.id];
            const isMaxed = currentLvl >= item.max;
            const cost = item.cost(currentLvl);
            const canAfford = playerData.credits >= cost;
            
            const div = document.createElement('div');
            div.className = 'glass p-4 rounded-xl flex items-center gap-4';
            div.innerHTML = `
                <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-2xl border border-slate-700">${item.icon}</div>
                <div class="flex-1">
                    <div class="font-bold text-white">${item.name}</div>
                    <div class="text-xs text-slate-400">${item.desc}</div>
                    <div class="flex gap-1 mt-1">
                        ${Array(item.max).fill(0).map((_, i) => 
                            `<div class="w-2 h-2 rounded-full ${i < currentLvl ? 'bg-cyan-400' : 'bg-slate-700'}"></div>`
                        ).join('')}
                    </div>
                </div>
                <button class="px-4 py-2 rounded-lg font-bold text-sm transition-all ${
                    isMaxed ? 'bg-slate-700 text-slate-500 cursor-not-allowed' :
                    canAfford ? 'bg-cyan-500 text-white shadow-lg shadow-cyan-500/30 active:scale-95' :
                    'bg-slate-800 text-slate-500 border border-slate-700'
                }" ${isMaxed || !canAfford ? 'disabled' : ''} onclick="buyUpgrade('${item.id}')">
                    ${isMaxed ? 'MAX' : `<span class="mr-1">🧬</span>${cost}`}
                </button>
            `;
            container.appendChild(div);
        });
    } else {
        SHOP_ITEMS.skins.forEach(item => {
            const isUnlocked = playerData.unlockedSkins.includes(item.id);
            const isEquipped = playerData.currentSkin === item.id;
            const canAfford = playerData.credits >= item.cost;
            
            const div = document.createElement('div');
            div.className = `glass p-4 rounded-xl flex items-center gap-4 ${isEquipped ? 'border-emerald-500/50 bg-emerald-500/10' : ''}`;
            div.innerHTML = `
                <div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl border-2" style="background:${item.color}20; border-color:${item.color}">${item.icon}</div>
                <div class="flex-1">
                    <div class="font-bold text-white" style="color:${item.color}">${item.name}</div>
                    <div class="text-xs text-slate-400">${isUnlocked ? 'Owned' : 'Locked Skin'}</div>
                </div>
                <button class="px-4 py-2 rounded-lg font-bold text-sm transition-all ${
                    isEquipped ? 'bg-emerald-500 text-white' :
                    isUnlocked ? 'bg-slate-700 text-white hover:bg-slate-600' :
                    canAfford ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/30 active:scale-95' :
                    'bg-slate-800 text-slate-500 border border-slate-700'
                }" onclick="${isUnlocked ? `equipSkin('${item.id}')` : `buySkin('${item.id}')`}">
                    ${isEquipped ? 'EQUIPPED' : isUnlocked ? 'EQUIP' : `<span class="mr-1">🧬</span>${item.cost}`}
                </button>
            `;
            container.appendChild(div);
        });
    }
    updateShopUI();
}

window.buyUpgrade = (id) => {
    const item = SHOP_ITEMS.upgrades.find(i => i.id === id);
    const lvl = playerData.upgrades[id];
    const cost = item.cost(lvl);
    
    if (playerData.credits >= cost && lvl < item.max) {
        playerData.credits -= cost;
        playerData.upgrades[id]++;
        playSound('buy');
        vibrate('medium');
        saveGame();
        renderShopItems('upgrades');
    }
};

window.buySkin = (id) => {
    const item = SHOP_ITEMS.skins.find(i => i.id === id);
    if (playerData.credits >= item.cost && !playerData.unlockedSkins.includes(id)) {
        playerData.credits -= item.cost;
        playerData.unlockedSkins.push(id);
        playSound('buy');
        vibrate('medium');
        saveGame();
        equipSkin(id); // Auto equip on buy
        renderShopItems('skins');
    }
};

window.equipSkin = (id) => {
    playerData.currentSkin = id;
    playSound('equip');
    vibrate('light');
    saveGame();
    renderShopItems('skins');
};

function updateShopUI() {
    document.getElementById('shop-credits').innerText = playerData.credits;
    document.getElementById('credits-display-hud').innerText = playerData.credits;
}

/**
 * §4 Gameplay Update
 */
function spawnEntity() {
    const margin = 60;
    const topMargin = 150;
    const x = margin + Math.random() * (cw - margin * 2);
    const y = topMargin + Math.random() * (ch - topMargin - margin);
    
    if (Math.random() > 0.3) {
        patients.push({
            x, y,
            radius: 14,
            life: 5.0,
            maxLife: 5.0,
            skinColor: SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)],
            shirtColor: SHIRT_COLORS[Math.floor(Math.random() * SHIRT_COLORS.length)],
            angle: Math.random() * Math.PI * 2,
            bobPhase: Math.random() * Math.PI * 2,
            isCarried: false
        });
    } else {
        viruses.push({
            x, y,
            radius: 16,
            vx: (Math.random() - 0.5) * 120,
            vy: (Math.random() - 0.5) * 120,
            rotation: 0,
            rotSpeed: (Math.random() - 0.5) * 5
        });
    }
}

function update(dt) {
    difficultyMultiplier += dt * 0.02;
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnEntity();
        spawnTimer = (window.gameConfig.spawnRate || 1.2) / Math.sqrt(difficultyMultiplier);
    }

    // Hero Movement (with upgrades)
    const baseSpeed = window.gameConfig.baseSpeed || 10;
    const speed = baseSpeed * 60 * (hero.speedMult || 1); 
    const dx = hero.targetX - hero.x;
    const dy = hero.targetY - hero.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > 1) {
        const move = Math.min(dist, speed * dt);
        hero.x += (dx / dist) * move;
        hero.y += (dy / dist) * move;
    }
    
    hero.x = Math.max(hero.radius, Math.min(cw - hero.radius, hero.x));
    hero.y = Math.max(hero.radius, Math.min(ch - hero.radius, hero.y));

    // Stack Follow
    let prevX = hero.x;
    let prevY = hero.y;
    hero.stack.forEach((p, index) => {
        const pdx = prevX - p.x;
        const pdy = prevY - p.y;
        const pDist = Math.sqrt(pdx*pdx + pdy*pdy);
        const targetDist = 20;
        
        if (pDist > targetDist) {
            const move = (pDist - targetDist) * 10 * dt;
            p.x += (pdx / pDist) * move;
            p.y += (pdy / pDist) * move;
        }
        prevX = p.x;
        prevY = p.y;
    });

    // Hospital Drop
    if (Math.abs(hero.x - hospital.x) < hospital.w/2 + hero.radius && 
        Math.abs(hero.y - hospital.y) < hospital.h/2 + hero.radius) {
        if (hero.stack.length > 0) {
            const count = hero.stack.length;
            score += count;
            playSound('heal');
            vibrate('medium');
            hero.stack.forEach(p => {
                createParticles(p.x, p.y, '#22c55e', 8);
                createFloatingText(hospital.x, hospital.y + 40, `+${count}`, '#22c55e');
            });
            hero.stack = [];
            updateHUD();
        }
    }

    // Patients
    for (let i = patients.length - 1; i >= 0; i--) {
        let p = patients[i];
        p.life -= dt;
        p.bobPhase += dt * 5;
        
        const cdx = hero.x - p.x;
        const cdy = hero.y - p.y;
        // Use upgraded pickup radius
        if (Math.sqrt(cdx*cdx + cdy*cdy) < (hero.pickupRadius || 18) + p.radius) {
            p.isCarried = true;
            hero.stack.push(p);
            playSound('pickup');
            vibrate('light');
            createParticles(p.x, p.y, getCurrentThemeColor(), 6);
            patients.splice(i, 1);
            continue;
        }

        if (p.life <= 0) {
            lives--;
            playSound('fail');
            vibrate('medium');
            createParticles(p.x, p.y, '#ef4444', 15);
            createFloatingText(p.x, p.y, "LOST!", '#ef4444');
            patients.splice(i, 1);
            updateHUD();
            screenShake();
            if (lives <= 0) setState('GAMEOVER');
        }
    }

    // Viruses
    for (let i = viruses.length - 1; i >= 0; i--) {
        let v = viruses[i];
        v.x += v.vx * dt;
        v.y += v.vy * dt;
        v.rotation += v.rotSpeed * dt;

        if (v.x < v.radius || v.x > cw - v.radius) v.vx *= -1;
        if (v.y < v.radius || v.y > ch - v.radius) v.vy *= -1;

        const vdx = hero.x - v.x;
        const vdy = hero.y - v.y;
        if (Math.sqrt(vdx*vdx + vdy*vdy) < hero.radius + v.radius) {
            lives--;
            playSound('fail');
            vibrate('heavy');
            createParticles(hero.x, hero.y, '#a855f7', 20);
            
            if (hero.stack.length > 0) {
                const lostCount = Math.ceil(hero.stack.length / 2);
                hero.stack.splice(0, lostCount); 
                createFloatingText(hero.x, hero.y, "DROPPED!", '#ef4444');
            }

            viruses.splice(i, 1);
            updateHUD();
            screenShake();
            if (lives <= 0) setState('GAMEOVER');
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.life -= dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        if (pt.text) pt.y -= 30 * dt;
        if (pt.life <= 0) particles.splice(i, 1);
    }
    
    backgroundGrid.forEach(l => {
        l.pulseX -= l.speed * dt;
        if(l.pulseX < -100) l.pulseX = cw + 100;
    });
}

function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, cw, ch);

    // EKG Grid
    ctx.lineWidth = 2;
    backgroundGrid.forEach(l => {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
        ctx.beginPath();
        ctx.moveTo(0, l.y);
        ctx.lineTo(cw, l.y);
        ctx.stroke();
        
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.beginPath();
        const px = l.pulseX;
        if (px > -50 && px < cw + 50) {
            ctx.moveTo(px - 30, l.y);
            ctx.lineTo(px - 15, l.y - 15);
            ctx.lineTo(px, l.y + 15);
            ctx.lineTo(px + 15, l.y);
            ctx.stroke();
        }
    });

    // Hospital
    ctx.save();
    ctx.translate(hospital.x, hospital.y);
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#22c55e';
    ctx.fillStyle = '#064e3b';
    ctx.beginPath();
    ctx.roundRect(-hospital.w/2, -hospital.h/2, hospital.w, hospital.h, 10);
    ctx.fill();
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#22c55e';
    const pulse = 1 + Math.sin(Date.now() / 200) * 0.1;
    ctx.scale(pulse, pulse);
    ctx.fillRect(-10, -25, 20, 50);
    ctx.fillRect(-25, -10, 50, 20);
    
    ctx.fillStyle = '#eaffff';
            ctx.font = 'bold 18px Audiowide, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('DROP', 0, 35);
    ctx.restore();

    // Patients
    patients.forEach(c => {
        const ratio = c.life / c.maxLife;
        const isCritical = ratio < 0.3;
        ctx.strokeStyle = isCritical ? '#ef4444' : '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius + 4, -Math.PI/2, -Math.PI/2 + (Math.PI * 2 * ratio));
        ctx.stroke();
        drawPatientBody(c.x, c.y, c.skinColor, c.shirtColor, c.bobPhase);
        if (isCritical) {
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('!', c.x, c.y - 20);
        }
    });

    // Stack
    for(let i = hero.stack.length - 1; i >= 0; i--) {
        let p = hero.stack[i];
        let target = (i === 0) ? hero : hero.stack[i-1];
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
        drawPatientBody(p.x, p.y, p.skinColor, p.shirtColor, Date.now()/100);
    }

    // Viruses
    ctx.fillStyle = '#a855f7';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#a855f7';
    viruses.forEach(v => {
        ctx.save();
        ctx.translate(v.x, v.y);
        ctx.rotate(v.rotation);
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i;
            const r = i % 2 === 0 ? v.radius : v.radius * 0.4;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#581c87';
        ctx.beginPath();
        ctx.arc(0, 0, v.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // Hero
    const themeColor = getCurrentThemeColor();
    ctx.shadowBlur = 20;
    ctx.shadowColor = themeColor;
    
    // Magnet Ring (if upgraded)
    if (playerData.upgrades.magnet > 0) {
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.pickupRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }

    // Pulse Ring
    ctx.strokeStyle = themeColor;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(hero.x, hero.y, hero.radius + 8 + Math.sin(Date.now() / 150) * 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1.0;

    // Core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(hero.x, hero.y, hero.radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Cross
    ctx.fillStyle = themeColor;
    ctx.fillRect(hero.x - 4, hero.y - 10, 8, 20);
    ctx.fillRect(hero.x - 10, hero.y - 4, 20, 8);
    ctx.shadowBlur = 0;

    // Particles
    particles.forEach(pt => {
        if (pt.text) {
            ctx.fillStyle = pt.color;
            ctx.font = 'bold 24px Audiowide, sans-serif';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 4;
            ctx.textAlign = 'center';
            ctx.fillText(pt.text, pt.x, pt.y);
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = pt.color;
            ctx.globalAlpha = pt.life;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    });
}

function drawPatientBody(x, y, skin, shirt, bobPhase) {
    ctx.save();
    ctx.translate(x, y);
    const bob = Math.sin(bobPhase) * 2;
    const pulse = 1 + Math.sin(bobPhase * 1.8) * 0.03;
    ctx.scale((1 + bob * 0.02) * pulse, (1 + bob * 0.02) * pulse);

    ctx.fillStyle = 'rgba(12, 24, 42, 0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 16, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = shirt;
    ctx.beginPath();
    ctx.roundRect(-10, 1, 20, 13, 7);
    ctx.fill();

    ctx.fillStyle = '#dffbff';
    ctx.beginPath();
    ctx.roundRect(-6, 4, 12, 5, 2);
    ctx.fill();

    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, -2, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(-2, -4, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(9,16,27,0.68)';
    ctx.beginPath();
    ctx.arc(-3, -3, 1.1, 0, Math.PI * 2);
    ctx.arc(3, -3, 1.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(9,16,27,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 3.8, 0.25, Math.PI - 0.25);
    ctx.stroke();

    ctx.fillStyle = '#65f7e8';
    ctx.beginPath();
    ctx.arc(0, 5.5, 1.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function loop(timestamp) {
    try {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        if (gameState === 'PLAYING') {
            update(dt);
        }
        draw();
    } catch (e) {
        console.error("Loop error:", e);
    }
    animationFrameId = requestAnimationFrame(loop);
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 250,
            vy: (Math.random() - 0.5) * 250,
            life: 0.4 + Math.random() * 0.4,
            color,
            size: Math.random() * 3 + 2
        });
    }
}

function createFloatingText(x, y, text, color='#fff') {
    particles.push({
        x, y,
        vx: 0, vy: -50,
        life: 0.8,
        text: text,
        color: color,
        size: 0
    });
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, lives));
    document.getElementById('credits-display-hud').innerText = playerData.credits;
}

function screenShake() {
    const container = document.getElementById('game-container');
    container.classList.remove('shake');
    void container.offsetWidth;
    container.classList.add('shake');
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

function getCurrentThemeColor() {
    const skin = SHOP_ITEMS.skins.find(s => s.id === playerData.currentSkin);
    return skin ? skin.color : '#38bdf8';
}

function initAudio() {
    try {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
    } catch (e) {
        console.warn('Web Audio API not supported');
    }
}

function setupAudioAssets() {
    const entries = [
        ['bgm', 'bgm_main', 0.2],
        ['pickup', 'sfx_pickup', 0.45],
        ['heal', 'sfx_heal', 0.42],
        ['fail', 'sfx_fail', 0.5],
        ['buy', 'sfx_buy', 0.38],
        ['equip', 'sfx_equip', 0.38],
        ['gameover', 'sfx_gameover', 0.48]
    ];
    entries.forEach(([key, id, volume]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.volume = volume;
        el.preload = key === 'bgm' ? 'none' : 'auto';
        audioElements[key] = el;
    });
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    if (audioUnlocked) return;
    audioUnlocked = true;
    syncBgmForState();
}

function syncBgmForState() {
    const bgm = audioElements.bgm;
    if (!bgm) return;
    if (!audioUnlocked || gameState !== 'PLAYING') {
        bgm.pause();
        return;
    }
    bgm.play().catch(() => {});
}

function playSound(type) {
    const now = performance.now();
    if (type === 'fail' && now < failSoundCooldownUntil) return;
    if (type === 'fail') failSoundCooldownUntil = now + 180;

    const source = audioElements[type];
    if (!source || !audioUnlocked) return;

    try {
        source.currentTime = 0;
        source.play().catch(() => {});
    } catch (e) {
        // ignore media playback failures
    }
}

function setupGifAssets() {
    ['save-gif', 'danger-gif'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.loading = 'lazy';
            el.decoding = 'async';
        }
    });
}

function showFeedbackGif(type) {
    const id = type === 'save' ? 'save-gif' : 'danger-gif';
    const el = document.getElementById(id);
    if (!el) return;
    const timeoutKey = type === 'save' ? 'saveGifTimeout' : 'dangerGifTimeout';
    if (window[timeoutKey]) clearTimeout(window[timeoutKey]);
    el.classList.add('active');
    window[timeoutKey] = setTimeout(() => {
        el.classList.remove('active');
    }, type === 'save' ? 900 : 1200);
}
</script>
