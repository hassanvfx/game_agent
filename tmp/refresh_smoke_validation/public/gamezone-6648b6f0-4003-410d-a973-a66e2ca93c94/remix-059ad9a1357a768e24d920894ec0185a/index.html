<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lantern Drift</title>
    <!-- [agent-note][stage4] resolved-font-remap: keeping catalog-backed Cinzel for title and Exo 2 for UI/body -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050814;
            --bg-mid: #0c1830;
            --panel-fill: rgba(8, 16, 34, 0.74);
            --panel-stroke: rgba(157, 221, 255, 0.28);
            --panel-glow: rgba(76, 206, 255, 0.28);
            --mist: rgba(146, 220, 255, 0.1);
            --hero-core: #fff4c9;
            --hero-cyan: #7bd7ff;
            --hero-violet: #a992ff;
            --wisp-core: #ecfbff;
            --hazard-core: #311126;
            --hazard-edge: #ba4d72;
            --text-main: #f3f8ff;
            --text-soft: rgba(223, 239, 255, 0.72);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(98, 159, 255, 0.12), transparent 34%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 46%, #02040b 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .w-64 { width: 16rem; }
        .max-w-sm { max-width: 24rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-6 { padding: 1.5rem; }
        .p-10 { padding: 2.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-3xl { border-radius: 1.5rem; }
        .overflow-hidden { overflow: hidden; }
        .transform { transform: translateZ(0); }
        .scale-95 { transform: scale(0.95); }
        .scale-100 { transform: scale(1); }
        .opacity-0 { opacity: 0; }
        .opacity-100 { opacity: 1; }
        .h-2 { height: 0.5rem; }
        .h-full { height: 100%; }
        .w-0 { width: 0; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-5xl { font-size: clamp(2.5rem, 7vw, 3rem); }
        .font-bold { font-weight: 700; }
        .tracking-widest { letter-spacing: 0.3em; }
        .tracking-wider { letter-spacing: 0.12em; }
        .leading-relaxed { line-height: 1.625; }
        .transition-opacity { transition-property: opacity; }
        .transition-all { transition-property: all; }
        .duration-500 { transition-duration: 500ms; }
        .duration-700 { transition-duration: 700ms; }
        .duration-1000 { transition-duration: 1000ms; }
        .ease-out { transition-timing-function: ease-out; }
        .border { border-width: 1px; border-style: solid; }
        .active\:scale-95:active { transform: scale(0.95); }
        .hover\:bg-white\/20:hover { background: rgba(255, 255, 255, 0.2); }

        .text-white-60 { color: rgba(255, 255, 255, 0.6); }
        .text-white { color: #fff; }
        .text-blue-200 { color: #bfdbfe; }
        .bg-white-10 { background: rgba(255, 255, 255, 0.1); }
        .bg-black-40 { background: rgba(0, 0, 0, 0.4); }
        .border-white-30 { border-color: rgba(255, 255, 255, 0.3); }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(14, 24, 48, 0.9), var(--panel-fill)),
                radial-gradient(circle at top, rgba(143, 228, 255, 0.14), transparent 58%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                0 14px 44px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 24px var(--panel-glow);
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(130deg, rgba(255, 255, 255, 0.09), transparent 42%);
            pointer-events: none;
        }
        .btn-glow {
            transition: transform 0.24s ease, box-shadow 0.24s ease, background-color 0.24s ease, border-color 0.24s ease;
            cursor: pointer;
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background:
                linear-gradient(180deg, rgba(141, 222, 255, 0.2), rgba(92, 119, 255, 0.12)),
                rgba(8, 13, 29, 0.7);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 1px rgba(171, 225, 255, 0.08);
        }
        .btn-glow:hover {
            box-shadow:
                0 0 18px rgba(123, 215, 255, 0.42),
                0 0 34px rgba(169, 146, 255, 0.22);
            text-shadow: 0 0 10px rgba(210, 242, 255, 0.9);
            border-color: rgba(178, 232, 255, 0.48);
        }
        .panel-title {
            font-family: 'Cinzel', serif;
            text-shadow:
                0 0 18px rgba(160, 210, 255, 0.28),
                0 0 30px rgba(169, 146, 255, 0.16);
        }
        .hud-label {
            font-family: 'Exo 2', system-ui, sans-serif;
            text-transform: uppercase;
            color: var(--text-soft);
            text-shadow: 0 0 12px rgba(123, 215, 255, 0.28);
        }
        .progress-fill {
            background: linear-gradient(90deg, #86f5ff, #79a7ff 56%, #d3c3ff);
            box-shadow: 0 0 14px rgba(123, 215, 255, 0.7);
        }
        .start-card {
            align-self: center;
            margin-top: auto;
            margin-bottom: auto;
            max-width: 28rem;
            position: relative;
        }
        .start-card::after {
            content: "✦ ✦ ✦";
            position: absolute;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%);
            font-size: 0.78rem;
            letter-spacing: 0.55rem;
            color: rgba(194, 239, 255, 0.5);
            pointer-events: none;
        }
        .start-copy {
            color: rgba(236, 245, 255, 0.84);
            font-size: 0.98rem;
            line-height: 1.6;
            margin: 0 0 0.75rem 0;
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        .start-hint {
            color: rgba(191, 219, 254, 0.96);
            font-size: 0.82rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        #ui-layer {
            background:
                radial-gradient(circle at 50% 18%, rgba(141, 217, 255, 0.08), transparent 22%),
                linear-gradient(180deg, rgba(1, 3, 10, 0.12), rgba(1, 3, 10, 0));
        }
        #hud {
            gap: 0.4rem;
        }
        #hud::before {
            content: "✦ Lantern Pulse ✦";
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 0.24em;
            color: rgba(210, 235, 255, 0.5);
            text-transform: uppercase;
        }
        #game-over-panel {
            position: relative;
            overflow: hidden;
        }
        #game-over-panel p {
            color: rgba(214, 234, 255, 0.9);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1rem, 3.8vw, 1.35rem);
        }
        .reaction-gif {
            position: absolute;
            width: clamp(4.5rem, 18vw, 7rem);
            height: clamp(4.5rem, 18vw, 7rem);
            object-fit: cover;
            border-radius: 1.25rem;
            border: 1px solid rgba(190, 236, 255, 0.22);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32), 0 0 18px rgba(112, 206, 255, 0.24);
            opacity: 0;
            transform: translateY(0.75rem) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            background: rgba(5, 10, 22, 0.48);
            z-index: 60;
        }
        .reaction-gif.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        #hit-gif {
            left: 1rem;
            bottom: 1rem;
        }
        #win-gif {
            right: 1rem;
            top: 1rem;
        }
        @media (max-width: 640px) {
            #hit-gif {
                left: 0.6rem;
                bottom: 0.6rem;
            }
            #win-gif {
                right: 0.6rem;
                top: 0.6rem;
            }
            .p-10 { padding: 1.5rem; }
            .p-6 { padding: 1rem; }
            .text-xl { font-size: 1rem; }
            .text-2xl { font-size: 1.15rem; }
            .w-64 { width: min(16rem, 72vw); }
            .start-card { max-width: 90vw; }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "heroSpeed": { "type": "number", "label": "Lantern Drift", "value": 4, "min": 1, "max": 12 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#4a90e2" },
        "targetHarmony": { "type": "number", "label": "Beacon Charge", "value": 100, "min": 50, "max": 500 }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between p-6">

            <div id="start-card" class="glass-panel start-card p-10 rounded-3xl text-center transition-opacity duration-700">
                <h1 class="panel-title text-5xl text-white mb-4 font-bold tracking-wider">Lantern Drift</h1>
                <p class="start-copy">Guide a star-lit lantern through the midnight tide. Gather pale wisps to wake the beacon and slip away from thorned dark knots.</p>
                <p class="start-hint">Tap anywhere to begin drifting.</p>
                <!-- [agent-note][stage1] role: future-audio | trigger: first-input | intent: reinforce the opening cue with a soft start chime -->
            </div>

            <!-- HUD -->
            <div id="hud" class="w-full flex flex-col items-center transition-opacity duration-1000">
                <img id="win-gif" class="reaction-gif" alt="Victory lantern reaction" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp">
                <div class="hud-label text-white-60 text-xl tracking-widest mb-2">BEACON CHARGE</div>
                <div class="w-64 h-2 bg-white-10 rounded-full overflow-hidden" style="box-shadow: inset 0 0 0 1px rgba(186, 227, 255, 0.12), 0 0 18px rgba(85, 145, 255, 0.14);">
                    <div id="harmony-bar" class="h-full w-0 progress-fill transition-all duration-500 ease-out"></div>
                </div>
            </div>

            <!-- Game Over Screen -->
            <img id="hit-gif" class="reaction-gif" alt="Hazard impact reaction" src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp">
            <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center pointer-events-auto bg-black-40 transition-opacity duration-1000">
                <div id="game-over-panel" class="glass-panel p-10 rounded-3xl flex flex-col items-center text-center max-w-sm w-full mx-4 transform scale-95 opacity-0 transition-all duration-700">
                    <h1 class="panel-title text-5xl text-white mb-4 font-bold tracking-wider">Beacon Lit</h1>
                    <p class="text-blue-200 text-2xl mb-8 leading-relaxed">The lantern holds steady.<br>The sky-path opens in silver.</p>
                    <button id="restart-btn" class="btn-glow px-8 py-3 rounded-full bg-white-10 text-white text-2xl border border-white-30 hover:bg-white/20 active:scale-95">
                        Drift Again
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Media Assets -->
    <!-- [agent-note][stage3] resolved-audio: start/ui/collect/hit/win + loop wired from catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
    <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto"></audio>
    <audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
    <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>

    <script>
        // --- System L0 & Config ---
        let gameConfig = {};
        let gameConfigDefs = {};

        let canvas, ctx, ro;
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        let initialized = false;

        let gameState = 'PLAYING'; // PLAYING, GAMEOVER
        let lastTime = 0;
        let animationFrameId;

        // --- Game State Variables ---
        let hero = { x: 0, y: 0, targetX: 0, targetY: 0, r: 20, history: [] };
        let entities = [];
        let ripples = [];
        let bgNodes = [];
        let harmony = 0;
        let cameraShake = 0;
        let hitFlash = 0;
        let timeElapsed = 0;
        let hasStarted = false;

        // --- Audio System ---
        let audioCtx = null;
        let bgm = null;
        let audioUnlocked = false;
        let audioElements = {};
        let activeGifTimer = null;
        let lastSfxTime = { collect: 0, hit: 0, ui: 0, start: 0, win: 0 };

        const PENTATONIC_SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C4, D4, E4, G4, A4, C5

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (bgm && bgm.paused) {
                bgm.play().catch(() => {});
            }
            audioUnlocked = true;
        }

        function playSfx(name, minGap = 120) {
            const audio = audioElements[name];
            const now = performance.now();
            if (!audio || (now - (lastSfxTime[name] || 0)) < minGap) return;
            lastSfxTime[name] = now;
            try {
                audio.pause();
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch (e) {
                // Silent fallback
            }
        }

        function showReactionGif(id, duration = 900) {
            const gif = document.getElementById(id);
            if (!gif) return;
            gif.classList.add('active');
            clearTimeout(activeGifTimer);
            activeGifTimer = setTimeout(() => {
                gif.classList.remove('active');
            }, duration);
        }

        function playASMRTone(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'ripple') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150 + Math.random() * 50, now);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.05, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                    osc.start(now);
                    osc.stop(now + 1.6);
                } else if (type === 'collect') {
                    osc.type = 'sine';
                    const freq = PENTATONIC_SCALE[Math.floor(Math.random() * PENTATONIC_SCALE.length)];
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.1, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
                    osc.start(now);
                    osc.stop(now + 2.1);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(60, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.5);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.9);
                }
            } catch (e) {
                // Silent fallback
            }
        }

        function triggerVibration(style) {
            try {
                window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                    action: 'vibrate',
                    requestId: 'h5-' + Date.now(),
                    version: '1.0',
                    params: { style: style }
                });
            } catch (e) {}
        }

        // --- Initialization & Lifecycle ---
        document.addEventListener('DOMContentLoaded', () => {
            const configScript = document.getElementById('game-config');
            if (configScript) {
                try {
                    gameConfigDefs = JSON.parse(configScript.textContent);
                    for (let key in gameConfigDefs) {
                        gameConfig[key] = gameConfigDefs[key].value;
                    }
                } catch (e) {
                    console.error("Config parse error");
                }
            }

            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d', { alpha: false });
            bgm = document.getElementById('bgm_main');
            bgm.volume = 0.2;
            audioElements = {
                start: document.getElementById('sfx_start'),
                collect: document.getElementById('sfx_collect'),
                hit: document.getElementById('sfx_hit'),
                win: document.getElementById('sfx_win'),
                ui: document.getElementById('sfx_ui')
            };
            Object.values(audioElements).forEach(audio => {
                if (!audio) return;
                audio.volume = audio.id === 'sfx_hit' ? 0.42 : 0.5;
            });

            ro = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const cr = entry.contentRect;
                    resize(cr.width, cr.height);
                }
            });
            ro.observe(canvas);

            // [agent-note][stage4] repaired: mobile-actionability | action: scope gameplay pointer handling to canvas so overlay/buttons keep native taps
            canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
            canvas.addEventListener('pointermove', handleGlobalInput, { passive: false });
            canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
            canvas.addEventListener('pointercancel', handleGlobalInput, { passive: false });

            const startCard = document.getElementById('start-card');
            startCard.addEventListener('click', () => {
                unlockAudio();
                if (hasStarted || gameState !== 'PLAYING') return;
                const rect = canvas.getBoundingClientRect();
                handleGlobalInput({
                    type: 'pointerdown',
                    clientX: rect.left + (cw * 0.5),
                    clientY: rect.top + (ch * 0.5),
                    preventDefault: () => {},
                    target: canvas
                });
            });

            document.getElementById('restart-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                unlockAudio();
                if (gameState !== 'GAMEOVER') return;
                restartGame();
            });
        });

        function resize(width, height) {
            if (width === 0 || height === 0) return;
            cw = width;
            ch = height;
            canvas.width = cw * dpr;
            canvas.height = ch * dpr;
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (!initialized) {
                initGame();
                initialized = true;
                requestAnimationFrame(gameLoop);
            } else {
                clampEntities();
            }
        }

        function clampEntities() {
            if (isFinite(hero.x) && isFinite(hero.y)) {
                hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
                hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));
            }
            entities.forEach(e => {
                if (isFinite(e.x) && isFinite(e.y)) {
                    e.x = Math.max(0, Math.min(cw, e.x));
                    e.y = Math.max(0, Math.min(ch, e.y));
                }
            });
        }

        function initGame() {
            hero = {
                x: cw / 2,
                y: ch / 2,
                targetX: cw / 2,
                targetY: ch / 2,
                r: 15,
                history: [],
                twinkle: 0
            };
            entities = [];
            ripples = [];
            harmony = 0;
            cameraShake = 0;
            hitFlash = 0;
            timeElapsed = 0;
            lastTime = performance.now();
            hasStarted = false;
            updateStartCard();

            // Init Parallax Background Nodes
            bgNodes = [];
            for (let i = 0; i < 4; i++) {
                bgNodes.push({
                    x: Math.random() * cw,
                    y: Math.random() * ch,
                    r: cw * (0.5 + Math.random() * 0.8),
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    hue: 200 + Math.random() * 60
                });
            }

            setState('PLAYING');
            updateHUD();
        }

        function restartGame() {
            initGame();
        }

        function updateStartCard() {
            const startCard = document.getElementById('start-card');
            if (!startCard) return;
            startCard.style.opacity = hasStarted ? '0' : '1';
            startCard.style.pointerEvents = hasStarted ? 'none' : 'auto';
            startCard.style.visibility = hasStarted ? 'hidden' : 'visible';
        }

        function setState(newState) {
            gameState = newState;
            const hud = document.getElementById('hud');
            const gameOverScreen = document.getElementById('game-over-screen');
            const gameOverPanel = document.getElementById('game-over-panel');

                if (gameState === 'PLAYING') {
                    hud.style.opacity = '1';
                    gameOverScreen.classList.add('hidden');
                    gameOverScreen.style.opacity = '0';
                    gameOverPanel.classList.remove('scale-100', 'opacity-100');
                    gameOverPanel.classList.add('scale-95', 'opacity-0');
                    document.getElementById('win-gif')?.classList.remove('active');
                    if (audioUnlocked && bgm?.paused) {
                        bgm.play().catch(() => {});
                    }
                } else if (gameState === 'GAMEOVER') {
                    hud.style.opacity = '0';
                    gameOverScreen.classList.remove('hidden');
                    showReactionGif('win-gif', 1800);
                    playSfx('win', 200);
                    if (bgm) {
                        bgm.pause();
                        bgm.currentTime = 0;
                    }
                    // Trigger reflow
                    void gameOverScreen.offsetWidth;
                    gameOverScreen.style.opacity = '1';
                    setTimeout(() => {
                        gameOverPanel.classList.remove('scale-95', 'opacity-0');
                        gameOverPanel.classList.add('scale-100', 'opacity-100');
                    }, 100);
                }
        }

        // --- Input Handling ---
        function handleGlobalInput(e) {
            if (e.preventDefault) e.preventDefault();
            unlockAudio();

            if (gameState === 'GAMEOVER') {
                if (e.type === 'pointerdown' && e.target.id === 'restart-btn') {
                    restartGame();
                }
                return;
            }

            if (gameState === 'PLAYING') {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (e.type === 'pointerdown') {
                    const firstStart = !hasStarted;
                    hasStarted = true;
                    updateStartCard();
                    hero.targetX = x;
                    hero.targetY = y;
                    spawnRipple(x, y);
                    playASMRTone('ripple');
                    if (firstStart) {
                        playSfx('start', 200);
                    } else {
                        playSfx('ui', 80);
                    }
                    triggerVibration('light');
                } else if (e.type === 'pointermove') {
                    hero.targetX = x;
                    hero.targetY = y;
                } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
                    // Optional: slow down or drift when released
                }
            }
        }

        // --- Game Logic ---
        function spawnRipple(x, y) {
            ripples.push({ x, y, r: 5, maxR: 100 + Math.random() * 50, life: 1.0 });
        }

        function spawnEntity() {
            const isDistraction = Math.random() < 0.2;
            const side = Math.floor(Math.random() * 4);
            let x, y;
            const margin = 50;
            if (side === 0) { x = Math.random() * cw; y = -margin; }
            else if (side === 1) { x = cw + margin; y = Math.random() * ch; }
            else if (side === 2) { x = Math.random() * cw; y = ch + margin; }
            else { x = -margin; y = Math.random() * ch; }

            const angle = Math.atan2((ch / 2 + (Math.random() - 0.5) * 200) - y, (cw / 2 + (Math.random() - 0.5) * 200) - x);
            const speed = isDistraction ? 30 + Math.random() * 20 : 15 + Math.random() * 15;

            entities.push({
                type: isDistraction ? 'distraction' : 'wisp',
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                r: isDistraction ? 12 : 8 + Math.random() * 6,
                z: 0.5 + Math.random() * 1.0, // Parallax depth cue
                phase: Math.random() * Math.PI * 2,
                active: true
            });
        }

        function updateHUD() {
            const bar = document.getElementById('harmony-bar');
            const target = gameConfig.targetHarmony || 100;
            const pct = Math.min(100, Math.max(0, (harmony / target) * 100));
            bar.style.width = pct + '%';
        }

        function update(dt) {
            timeElapsed += dt;

            // Hero Movement (Lerp)
            if (!isFinite(hero.x) || !isFinite(hero.y)) {
                hero.x = cw / 2; hero.y = ch / 2;
            }
            const speedMultiplier = gameConfig.heroSpeed || 4;
            hero.x += (hero.targetX - hero.x) * dt * speedMultiplier;
            hero.y += (hero.targetY - hero.y) * dt * speedMultiplier;

            // Trail history
            hero.history.unshift({ x: hero.x, y: hero.y });
            if (hero.history.length > 20) hero.history.pop();
            hero.twinkle += dt * 4;

            // Background nodes movement
            bgNodes.forEach(bg => {
                bg.x += bg.vx * dt;
                bg.y += bg.vy * dt;
                if (bg.x < -bg.r) bg.x = cw + bg.r;
                if (bg.x > cw + bg.r) bg.x = -bg.r;
                if (bg.y < -bg.r) bg.y = ch + bg.r;
                if (bg.y > ch + bg.r) bg.y = -bg.r;
            });

            // Ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                r.r += (r.maxR - r.r) * dt * 2;
                r.life -= dt * 0.8;
                if (r.life <= 0) ripples.splice(i, 1);
            }

            // Spawn Entities
            if (Math.random() < dt * 1.5) {
                spawnEntity();
            }

            // Update Entities & Collisions
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.x += e.vx * dt * e.z;
                e.y += e.vy * dt * e.z;
                e.phase += dt * 2;

                // Out of bounds
                if (e.x < -100 || e.x > cw + 100 || e.y < -100 || e.y > ch + 100) {
                    entities.splice(i, 1);
                    continue;
                }

                // Collision with Hero
                const dx = e.x - hero.x;
                const dy = e.y - hero.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < hero.r + e.r) {
                    if (e.type === 'wisp') {
                        harmony += 5;
                        playASMRTone('collect');
                        playSfx('collect', 90);
                        triggerVibration('light');
                        spawnRipple(e.x, e.y);
                    } else if (e.type === 'distraction') {
                        harmony = Math.max(0, harmony - 15);
                        playASMRTone('hit');
                        playSfx('hit', 180);
                        showReactionGif('hit-gif', 820);
                        triggerVibration('heavy');
                        cameraShake = 10;
                        hitFlash = 1.0;
                    }
                    entities.splice(i, 1);
                    updateHUD();

                    if (harmony >= (gameConfig.targetHarmony || 100)) {
                        setState('GAMEOVER');
                    }
                }
            }

            // Decay effects
            if (cameraShake > 0) cameraShake -= dt * 30;
            if (cameraShake < 0) cameraShake = 0;
            if (hitFlash > 0) hitFlash -= dt * 2;
            if (hitFlash < 0) hitFlash = 0;
        }

        // --- Rendering ---
        function drawGlow(x, y, r, colorStops) {
            if (r <= 0) return;
            const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
            colorStops.forEach(stop => grad.addColorStop(stop.pos, stop.color));
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            // Base background
            const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
            skyGradient.addColorStop(0, '#112344');
            skyGradient.addColorStop(0.45, '#081225');
            skyGradient.addColorStop(1, '#03050c');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, cw, ch);

            const moonMist = ctx.createRadialGradient(cw * 0.5, ch * 0.18, 0, cw * 0.5, ch * 0.18, Math.max(cw, ch) * 0.45);
            moonMist.addColorStop(0, 'rgba(151, 220, 255, 0.16)');
            moonMist.addColorStop(0.35, 'rgba(121, 178, 255, 0.06)');
            moonMist.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = moonMist;
            ctx.fillRect(0, 0, cw, ch);

            ctx.save();

            // Camera Shake
            if (cameraShake > 0) {
                const sx = (Math.random() - 0.5) * cameraShake;
                const sy = (Math.random() - 0.5) * cameraShake;
                ctx.translate(sx, sy);
            }

            // Parallax Background Gradients
            ctx.globalCompositeOperation = 'screen';
            bgNodes.forEach(bg => {
                const pulse = Math.sin(timeElapsed * 0.5 + bg.hue) * 0.1 + 0.9;
                drawGlow(bg.x, bg.y, bg.r * pulse, [
                    { pos: 0, color: `hsla(${bg.hue}, 70%, 24%, 0.48)` },
                    { pos: 0.55, color: `hsla(${bg.hue + 16}, 58%, 18%, 0.15)` },
                    { pos: 1, color: `hsla(${bg.hue}, 60%, 20%, 0)` }
                ]);
            });

            for (let i = 0; i < 18; i++) {
                const x = (i * 71 + timeElapsed * 12) % (cw + 50) - 25;
                const y = (i * 97) % ch;
                const shimmer = 0.35 + 0.25 * Math.sin(timeElapsed * 1.4 + i);
                ctx.fillStyle = `rgba(235, 248, 255, ${Math.max(0.08, shimmer)})`;
                ctx.fillRect(x, y, 2, 2);
            }

            // Ripples
            ripples.forEach(r => {
                ctx.beginPath();
                ctx.arc(r.x, r.y, Math.max(0, r.r), 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(150, 200, 255, ${r.life * 0.3})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Entities
            entities.forEach(e => {
                if (e.type === 'wisp') {
                    const pulse = Math.sin(e.phase) * 0.2 + 0.8;
                    const r = Math.max(0, e.r * pulse);
                    drawGlow(e.x, e.y, r * 3.4, [
                        { pos: 0, color: 'rgba(238, 251, 255, 0.95)' },
                        { pos: 0.32, color: 'rgba(131, 232, 255, 0.5)' },
                        { pos: 0.72, color: 'rgba(121, 167, 255, 0.22)' },
                        { pos: 1, color: 'rgba(100, 180, 255, 0)' }
                    ]);
                    ctx.fillStyle = '#fffef4';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, Math.max(0, r * 0.42), 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    const pulse = Math.sin(e.phase * 3) * 0.1 + 0.9;
                    const r = Math.max(0, e.r * pulse);

                    drawGlow(e.x, e.y, r * 2.9, [
                        { pos: 0, color: 'rgba(46, 14, 36, 0.92)' },
                        { pos: 0.58, color: 'rgba(125, 34, 71, 0.62)' },
                        { pos: 1, color: 'rgba(80, 20, 50, 0)' }
                    ]);

                    ctx.fillStyle = '#170612';
                    ctx.beginPath();
                    for (let j = 0; j < 6; j++) {
                        const angle = e.phase + (j / 6) * Math.PI * 2;
                        const px = e.x + Math.cos(angle) * r;
                        const py = e.y + Math.sin(angle) * r;
                        if (j === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.globalCompositeOperation = 'screen';
                }
            });

            // Hero Aura & Trail
            ctx.globalCompositeOperation = 'screen';
            if (hero.history.length > 1) {
                ctx.beginPath();
                ctx.moveTo(hero.history[0].x, hero.history[0].y);
                for (let i = 1; i < hero.history.length; i++) {
                    ctx.lineTo(hero.history[i].x, hero.history[i].y);
                }
                ctx.strokeStyle = 'rgba(150, 210, 255, 0.2)';
                ctx.lineWidth = hero.r;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            const heroPulse = Math.sin(timeElapsed * 2) * 0.1 + 0.9;
            drawGlow(hero.x, hero.y, Math.max(0, hero.r * 4.8 * heroPulse), [
                { pos: 0, color: 'rgba(255, 246, 208, 0.96)' },
                { pos: 0.18, color: 'rgba(123, 215, 255, 0.66)' },
                { pos: 0.55, color: 'rgba(169, 146, 255, 0.24)' },
                { pos: 1, color: 'rgba(120, 200, 255, 0)' }
            ]);

            ctx.globalCompositeOperation = 'source-over';
            const lanternRadius = hero.r * (0.9 + Math.sin(hero.twinkle) * 0.05);
            const bodyGradient = ctx.createRadialGradient(hero.x, hero.y - hero.r * 0.2, 1, hero.x, hero.y, lanternRadius);
            bodyGradient.addColorStop(0, '#fff6d9');
            bodyGradient.addColorStop(0.45, '#ffd88b');
            bodyGradient.addColorStop(1, '#ff9d4d');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.arc(hero.x, hero.y, lanternRadius * 0.72, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 247, 214, 0.95)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(hero.x, hero.y - lanternRadius * 1.05);
            ctx.quadraticCurveTo(hero.x + lanternRadius * 0.18, hero.y - lanternRadius * 0.68, hero.x, hero.y - lanternRadius * 0.48);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(112, 83, 46, 0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(hero.x, hero.y, lanternRadius * 0.84, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 250, 231, 0.92)';
            ctx.beginPath();
            ctx.ellipse(hero.x - lanternRadius * 0.2, hero.y - lanternRadius * 0.18, lanternRadius * 0.14, lanternRadius * 0.22, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalCompositeOperation = 'screen';

            // Hit Flash Overlay
            if (hitFlash > 0) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = `rgba(50, 0, 20, ${hitFlash * 0.3})`;
                ctx.fillRect(0, 0, cw, ch);
            }

            ctx.restore();
        }

        // --- Main Loop ---
        function gameLoop(timestamp) {
            try {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.05) dt = 0.05;
                lastTime = timestamp;

                if (gameState === 'PLAYING') {
                    update(dt);
                }
                draw();

            } catch (e) {
                console.error("Loop error:", e);
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
