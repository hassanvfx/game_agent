<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>The Masked Blade</title>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | source: catalogs/fonts.json | roles: title=Cinzel, ui=Rajdhani -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #070814;
            --bg-bottom: #26113e;
            --panel-bg: rgba(17, 11, 31, 0.82);
            --panel-border: rgba(255, 213, 128, 0.26);
            --text-main: #fff7ef;
            --text-muted: rgba(255, 241, 224, 0.82);
            --text-faint: rgba(255, 241, 224, 0.56);
            --title-red: #ff5d5d;
            --button-red: #d83a4f;
            --button-red-hover: #bf2841;
            --yellow: #ffd36e;
            --rose: #ff88a7;
            --sky-glow: rgba(126, 210, 255, 0.18);
            --blade-cyan: #8ce7ff;
            --shadow-deep: rgba(4, 4, 12, 0.56);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 18%, rgba(255, 211, 110, 0.18), transparent 18%),
                radial-gradient(circle at 82% 12%, var(--sky-glow), transparent 22%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .right-6 { right: 1.5rem; }
        .bottom-20 { bottom: 5rem; }
        .w-full { width: 100%; }
        .h-full { height: 100vh; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-ui { font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif; }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(33, 19, 52, 0.95), rgba(15, 11, 29, 0.92)),
                var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 12px 36px var(--shadow-deep),
                inset 0 0 0 1px rgba(255, 244, 220, 0.05),
                0 0 18px rgba(140, 231, 255, 0.12);
            border-radius: 1rem;
            max-width: min(92vw, 36rem);
        }

        .title-font {
            font-family: 'Cinzel', ui-serif, Georgia, serif;
            letter-spacing: 0.06em;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 22%),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.015) 0 2px,
                    transparent 2px 6px
                );
            mix-blend-mode: screen;
            opacity: 0.55;
        }

        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.34) 100%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            padding: 2.3rem 2rem;
            text-align: center;
            pointer-events: auto;
        }

        .panel-start { border-top: 4px solid #ff7f66; }
        .panel-end { border-top: 4px solid #9aa4c6; }

        .main-title {
            margin: 0 0 0.55rem;
            font-size: clamp(2.2rem, 8vw, 3.6rem);
            line-height: 0.95;
            color: #ffe0a8;
            text-shadow:
                0 2px 0 rgba(73, 17, 17, 0.9),
                0 0 18px rgba(255, 93, 93, 0.3);
        }

        .tagline {
            margin: 0 0 1.7rem;
            color: #f2dcd0;
            font-size: 1rem;
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .instruction-list {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 1.8rem;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .accent-jump { color: var(--yellow); }
        .accent-slash { color: var(--rose); }

        button {
            border: 1px solid rgba(255, 214, 156, 0.42);
            border-radius: 0.7rem;
            cursor: pointer;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 18px rgba(140, 231, 255, 0.2);
            filter: brightness(1.04);
        }

        #start-btn {
            background: linear-gradient(180deg, #e65c68, var(--button-red));
            color: #fffaf3;
            padding: 1rem 2rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        }

        #start-btn:hover { background: var(--button-red-hover); }

        #restart-btn {
            background: linear-gradient(180deg, #fff8ea, #ecd6c5);
            color: #2a1739;
            padding: 0.8rem 1.7rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
        }

        #restart-btn:hover { background: #e5e7eb; }

        .game-over-title {
            margin: 0 0 0.35rem;
            font-size: clamp(2.2rem, 7vw, 3.2rem);
            color: #e5e7eb;
        }

        .final-score {
            margin: 0 0 1.5rem;
            font-size: 2rem;
            font-weight: 700;
            color: var(--title-red);
        }

        #hud {
            position: absolute;
            top: 1.25rem;
            right: 1rem;
            padding: 0.65rem 0.85rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(255, 214, 156, 0.3);
            background: rgba(16, 11, 27, 0.62);
            font-size: clamp(1rem, 2.8vw, 1.2rem);
            font-weight: 700;
            color: #fff7ef;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.22);
        }

        #hud .mark {
            color: var(--title-red);
        }

        #tutorial {
            position: absolute;
            bottom: 4.3rem;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(12, 8, 24, 0.46);
            color: var(--text-faint);
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .feedback-gif {
            position: absolute;
            left: 1rem;
            bottom: 1rem;
            width: min(24vw, 8rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255, 214, 156, 0.35);
            background: rgba(12, 8, 24, 0.5);
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.26);
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 2;
        }

        .feedback-gif.show {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        #fail-gif {
            left: auto;
            right: 1rem;
            bottom: 1rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        @media (max-width: 640px) {
            .panel { padding: 1.8rem 1.1rem; }
            .instruction-list { font-size: 0.78rem; }
            .tagline { font-size: 0.82rem; }
            #hud {
                top: 0.8rem;
                right: 0.65rem;
                padding: 0.55rem 0.65rem;
                font-size: 0.92rem;
            }
            #tutorial {
                bottom: 3.8rem;
                font-size: 0.62rem;
                max-width: calc(100vw - 8rem);
                text-align: center;
            }
            .feedback-gif {
                width: min(26vw, 5.5rem);
                bottom: 0.85rem;
            }
            button {
                width: min(100%, 16rem);
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: slash/fail feedback overlays -> catalogs/gifs.json -->
        <img id="slash-gif" class="feedback-gif hidden" src="https://i.giphy.com/SY41GHA1ArmVMSlu5G.webp" alt="Slash impact reaction">
        <img id="fail-gif" class="feedback-gif hidden" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Defeat reaction">
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel panel panel-start">
                <h1 class="title-font main-title">ZORRO'S RUN</h1>
                <p class="tagline">Midnight rooftops. Golden moon. One masked blur against the guards.</p>
                <div class="instruction-list">
                    <p>⚡ TAP or PRESS SPACE to <span class="accent-jump font-bold">JUMP</span></p>
                    <p>🗡️ TAP IN AIR to <span class="accent-slash font-bold">SLASH DASH</span></p>
                </div>
                <button id="start-btn">En Garde!</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel panel panel-end">
                <h2 class="title-font game-over-title">DEFEATED</h2>
                <div class="final-score">Score: <span id="finalScore">0</span></div>
                <button id="restart-btn">Rise Again</button>
            </div>

            <div id="hud" class="hidden font-ui">
                <span class="mark">Z</span> <span id="score">0</span>
            </div>

            <!-- [agent-note][stage1] role: future-audio | trigger: slash-hit | intent: emphasize successful guard takedowns -->
            <div id="tutorial" class="hidden">
                Tap in air to slash!
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
                slash: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                uiStart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                uiRestart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3"
            },
            gifs: {
                slash: "https://i.giphy.com/SY41GHA1ArmVMSlu5G.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.started = false;
                this.unlocked = false;
                this.sfxLastPlay = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(v);
                    sample.preload = 'auto';
                    this.sfx[k] = sample;
                }
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                try {
                    this.bgm.load();
                    Object.values(this.sfx).forEach(audio => audio.load());
                } catch (_) {}
            }

            playBGM() {
                this.started = true;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            resumeBGM() {
                if (!this.started) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.62, minGap = 90) {
                const source = this.sfx[key];
                if (!source) return;

                const now = performance.now();
                if (this.sfxLastPlay[key] && now - this.sfxLastPlay[key] < minGap) return;
                this.sfxLastPlay[key] = now;

                const clone = source.cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const slashGif = document.getElementById('slash-gif');
        const failGif = document.getElementById('fail-gif');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 6;
        let speedMultiplier = 1;
        let gifTimers = {};

        let player = {
            x: 100,
            y: 0,
            w: 40,
            h: 60,
            vy: 0,
            isGrounded: false,
            wasGrounded: false,
            canDoubleJump: true,
            isSlashing: false,
            slashTimer: 0,
            capeNodes: []
        };

        let obstacles = [];
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function showGif(element, duration = 850) {
            clearTimeout(gifTimers[element.id]);
            element.classList.remove('hidden');
            requestAnimationFrame(() => element.classList.add('show'));
            gifTimers[element.id] = window.setTimeout(() => {
                element.classList.remove('show');
                window.setTimeout(() => element.classList.add('hidden'), 180);
            }, duration);
        }

        function hideAllGifs() {
            [slashGif, failGif].forEach((element) => {
                clearTimeout(gifTimers[element.id]);
                element.classList.remove('show');
                element.classList.add('hidden');
            });
        }

        /** 4. GAME LOGIC */
        function spawnObstacle() {
            const typeRoll = Math.random();
            const groundY = height * 0.85;

            let type = 'spike';
            if (typeRoll > 0.7) type = 'guard';
            else if (typeRoll > 0.4) type = 'rose';

            let obs = {
                type,
                x: width + 100,
                y: groundY - 50,
                w: 50,
                h: 50,
                active: true,
                rotation: 0
            };

            if (type === 'spike') {
                obs.w = 40;
                obs.h = 40;
                obs.y = groundY - 40;
            } else if (type === 'guard') {
                obs.w = 40;
                obs.h = 70;
                obs.y = groundY - 70;
            } else if (type === 'rose') {
                obs.w = 30;
                obs.h = 30;
                obs.y = groundY - 100 - (Math.random() * 80);
            }

            obstacles.push(obs);
        }

        function createParticles(x, y, color, count, type = 'spark') {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color,
                    type
                });
            }
        }

        function createZMark(x, y) {
            particles.push({
                x,
                y,
                vx: -2,
                vy: 0,
                life: 1.0,
                color: '#ef4444',
                type: 'z-mark',
                scale: 1.5
            });
        }

        function initGame() {
            score = 0;
            gameSpeed = 6;
            speedMultiplier = 1;
            frameCount = 0;
            player.y = height * 0.85 - player.h;
            player.vy = 0;
            player.isGrounded = true;
            player.wasGrounded = true;
            player.canDoubleJump = true;
            player.isSlashing = false;
            player.capeNodes = [];

            for (let i = 0; i < 5; i++) {
                player.capeNodes.push({ x: player.x - i * 5, y: player.y });
            }

            obstacles = [];
            particles = [];
            hideAllGifs();
            document.getElementById('score').innerText = score;
        }

        function updatePlayer() {
            const groundY = height * 0.85;
            const wasGrounded = player.isGrounded;

            player.vy += 0.8;
            player.y += player.vy;

            if (player.y + player.h >= groundY) {
                player.y = groundY - player.h;
                player.vy = 0;
                player.isGrounded = true;
                player.canDoubleJump = true;
                player.isSlashing = false;
            } else {
                player.isGrounded = false;
            }

            if (!wasGrounded && player.isGrounded) {
                audio.playSFX('land', 0.38, 120);
            }
            player.wasGrounded = wasGrounded;

            if (player.isSlashing) {
                player.slashTimer--;
                if (player.slashTimer <= 0) {
                    player.isSlashing = false;
                }
            }

            let prevX = player.x + 10;
            let prevY = player.y + 15;

            player.capeNodes.forEach((node, i) => {
                let dx = prevX - node.x;
                let dy = prevY - node.y;

                node.x += dx * 0.5;
                node.y += dy * 0.5;

                node.x -= gameSpeed * 0.8;
                node.y += Math.sin(frameCount * 0.2 + i) * 2;

                prevX = node.x;
                prevY = node.y;
            });
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#080a18');
            grad.addColorStop(0.55, '#1e1437');
            grad.addColorStop(1, '#3a1841');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const moonX = width - 92;
            const moonY = 96;
            const moonGlow = ctx.createRadialGradient(moonX, moonY, 12, moonX, moonY, 84);
            moonGlow.addColorStop(0, 'rgba(255, 234, 166, 0.92)');
            moonGlow.addColorStop(0.45, 'rgba(255, 214, 122, 0.38)');
            moonGlow.addColorStop(1, 'rgba(255, 214, 122, 0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(moonX, moonY, 84, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffe6a0';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd47a';
            ctx.beginPath();
            ctx.arc(moonX, moonY, 34, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                const arcY = 90 + i * 18;
                ctx.beginPath();
                ctx.arc(width * (0.2 + i * 0.18), arcY, 18 + i * 6, Math.PI * 1.05, Math.PI * 1.88);
                ctx.stroke();
            }

            ctx.fillStyle = 'white';
            for (let i = 0; i < 24; i++) {
                let sx = (i * 137) % width;
                let sy = (i * 93) % (height / 2);
                ctx.globalAlpha = 0.25 + Math.sin(frameCount * 0.05 + i) * 0.25;
                ctx.fillRect(sx, sy, 2, 2);
            }
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#211238';
            const midSpeed = gameSpeed * 0.2;
            const offset = (frameCount * midSpeed) % 400;

            for (let i = -1; i < width / 100 + 2; i++) {
                let h = 100 + Math.sin(i * 132) * 50;
                let x = i * 100 - offset;
                ctx.fillRect(x, height * 0.85 - h, 102, h);
                if (i % 3 === 0) {
                    ctx.beginPath();
                    ctx.arc(x + 50, height * 0.85 - h, 40, Math.PI, 0);
                    ctx.fill();
                }

                if (i % 2 === 0) {
                    ctx.fillStyle = '#ffd36e';
                    ctx.globalAlpha = 0.18;
                    ctx.fillRect(x + 18, height * 0.85 - h + 18, 8, 12);
                    ctx.fillRect(x + 34, height * 0.85 - h + 34, 8, 12);
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#211238';
                }
            }
        }

        function drawGround() {
            const groundGrad = ctx.createLinearGradient(0, height * 0.85, 0, height);
            groundGrad.addColorStop(0, '#16111f');
            groundGrad.addColorStop(1, '#05060b');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, height * 0.85, width, height * 0.15);

            ctx.strokeStyle = 'rgba(255, 209, 120, 0.16)';
            ctx.lineWidth = 2;
            for (let x = -((frameCount * gameSpeed * 0.5) % 32); x < width + 32; x += 32) {
                ctx.beginPath();
                ctx.moveTo(x, height * 0.85 + 10);
                ctx.lineTo(x + 14, height);
                ctx.stroke();
            }
            ctx.lineWidth = 1;
        }

        function drawPlayer() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(player.x + player.w / 2, height * 0.85, 22, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(player.x + 10, player.y + 15);
            player.capeNodes.forEach(n => ctx.lineTo(n.x, n.y));
            ctx.lineTo(player.capeNodes[player.capeNodes.length - 1].x, player.capeNodes[player.capeNodes.length - 1].y + 20);
            ctx.lineTo(player.x + 10, player.y + 30);
            ctx.fillStyle = '#7f0f1d';
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 245, 220, 0.18)';
            ctx.stroke();

            ctx.fillStyle = '#161616';
            if (player.isGrounded) {
                const stride = Math.sin(frameCount * 0.5) * 10;
                ctx.fillRect(player.x + 10 + stride, player.y + 40, 8, 20);
                ctx.fillRect(player.x + 20 - stride, player.y + 40, 8, 20);
            } else {
                ctx.fillRect(player.x + 10, player.y + 40, 8, 15);
                ctx.fillRect(player.x + 25, player.y + 35, 8, 15);
            }

            ctx.fillStyle = '#111216';
            ctx.fillRect(player.x + 10, player.y + 20, 20, 25);

            ctx.fillStyle = '#f8d7b0';
            ctx.beginPath();
            ctx.arc(player.x + 20, player.y + 15, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#111216';
            ctx.beginPath();
            ctx.ellipse(player.x + 20, player.y + 10, 20, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(player.x + 20, player.y + 8, 8, Math.PI, 0);
            ctx.fill();

            ctx.fillStyle = '#c72234';
            ctx.fillRect(player.x + 12, player.y + 20, 16, 6);

            ctx.fillStyle = '#fff6d5';
            ctx.fillRect(player.x + 24, player.y + 23, 16, 3);

            if (player.isSlashing) {
                ctx.strokeStyle = '#8ce7ff';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#8ce7ff';
                ctx.beginPath();
                ctx.arc(player.x + 40, player.y + 30, 30, -Math.PI / 2, Math.PI / 2);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255,255,255,0.75)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x + 40, player.y + 30, 24, -Math.PI / 2, Math.PI / 2);
                ctx.stroke();
                ctx.lineWidth = 1;
            }
        }

        function drawEntities() {
            obstacles.forEach(obs => {
                if (obs.type === 'spike') {
                    ctx.fillStyle = '#2d2034';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.h);
                    ctx.lineTo(obs.x + obs.w / 2, obs.y);
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                    ctx.fill();
                    ctx.strokeStyle = '#ff9d66';
                    ctx.stroke();
                } else if (obs.type === 'guard') {
                    ctx.fillStyle = '#1e2438';
                    ctx.fillRect(obs.x + 10, obs.y + 20, 20, 30);
                    ctx.beginPath();
                    ctx.arc(obs.x + 20, obs.y + 15, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#d9dde8';
                    ctx.fillRect(obs.x + 12, obs.y + 20, 16, 5);
                    ctx.strokeStyle = '#8ce7ff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 5, obs.y + 60);
                    ctx.lineTo(obs.x + 35, obs.y + 10);
                    ctx.stroke();
                    ctx.lineWidth = 1;
                } else if (obs.type === 'rose') {
                    ctx.fillStyle = '#ff4f7d';
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffd6e2';
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w / 2 - 5, obs.y + obs.h / 2 - 2, 4, 0, Math.PI * 2);
                    ctx.arc(obs.x + obs.w / 2 + 5, obs.y + obs.h / 2 - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#166534';
                    ctx.fillRect(obs.x + obs.w / 2, obs.y + obs.h / 2 + 5, 2, 10);
                }
            });

            particles.forEach((p, i) => {
                if (p.type === 'z-mark') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 4 * p.life;
                    ctx.shadowColor = 'red';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    let s = 20 * p.scale;
                    ctx.moveTo(p.x - s, p.y - s);
                    ctx.lineTo(p.x + s, p.y - s);
                    ctx.lineTo(p.x - s, p.y + s);
                    ctx.lineTo(p.x + s, p.y + s);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 1;
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            });
        }

        function checkCollisions() {
            const px = player.x + 10;
            const py = player.y;
            const pw = player.w - 20;
            const ph = player.h;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                if (!obs.active) continue;

                if (
                    px < obs.x + obs.w &&
                    px + pw > obs.x &&
                    py < obs.y + obs.h &&
                    py + ph > obs.y
                ) {
                    if (obs.type === 'rose') {
                        score += 50;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('collect', 0.55, 60);
                        createParticles(obs.x + obs.w / 2, obs.y + obs.h / 2, '#e11d48', 5);
                        obstacles.splice(i, 1);
                    } else if (obs.type === 'guard') {
                        if (player.isSlashing) {
                            score += 100;
                            document.getElementById('score').innerText = score;
                            audio.playSFX('slash', 0.72, 80);
                            createParticles(obs.x + obs.w / 2, obs.y + obs.h / 2, '#fff', 10);
                            createZMark(obs.x + obs.w / 2, obs.y + obs.h / 2);
                            showGif(slashGif, 750);
                            obstacles.splice(i, 1);
                        } else {
                            gameOver();
                        }
                    } else if (obs.type === 'spike') {
                        gameOver();
                    }
                }
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            frameCount++;
            speedMultiplier += 0.0005;
            let currentSpeed = gameSpeed * speedMultiplier;

            if (frameCount % Math.floor(100 / speedMultiplier) === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= currentSpeed;
                if (obstacles[i].x < -100) obstacles.splice(i, 1);
            }

            drawBackground();
            updatePlayer();
            drawEntities();
            drawGround();
            drawPlayer();
            checkCollisions();

            requestAnimationFrame(gameLoop);
        }

        function jump() {
            if (player.isGrounded) {
                player.vy = -15;
                player.isGrounded = false;
                audio.playSFX('jump', 0.5, 90);
            } else if (player.canDoubleJump) {
                player.vy = -10;
                player.canDoubleJump = false;
                player.isSlashing = true;
                player.slashTimer = 20;
                audio.playSFX('slash', 0.62, 70);
                createParticles(player.x, player.y + player.h / 2, '#fff', 5, 'dash');
                showGif(slashGif, 650);
            }
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0.72, 120);
            showGif(failGif, 1400);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('tutorial').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 5. CONTROLS */
        const handleInput = () => {
            if (!gameActive) return;
            audio.unlock();
            jump();
        };

        const unlockAudioOnce = () => audio.unlock();
        window.addEventListener('pointerdown', unlockAudioOnce, { once: true });
        window.addEventListener('keydown', unlockAudioOnce, { once: true });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInput();
        });

        document.getElementById('game-container').addEventListener('mousedown', handleInput);
        document.getElementById('game-container').addEventListener('touchstart', (e) => {
            if (gameActive) {
                e.preventDefault();
            }
            handleInput(e);
        }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('uiStart', 0.46, 0);
            audio.playBGM();
            hideAllGifs();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('uiRestart', 0.42, 0);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
