<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scrapline Tycoon</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #06111a;
        --bg-mid: #102334;
        --panel: rgba(10, 24, 37, 0.84);
        --panel-strong: rgba(12, 30, 46, 0.96);
        --line: rgba(124, 233, 255, 0.38);
        --line-strong: rgba(124, 233, 255, 0.78);
        --scrap: #ffd95e;
        --energy: #7cf0ff;
        --danger: #ff5e74;
        --danger-dark: #841a34;
        --purple: #b293ff;
        --text-main: #eff9ff;
        --text-muted: #8db6c8;
        --belt-dark: #12212c;
        --belt-mid: #233847;
        --belt-line: #375564;
        --glow: 0 0 0.9rem rgba(124, 233, 255, 0.28);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(47, 127, 163, 0.18), transparent 40%),
            linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 72%);
        font-family: 'Exo 2', sans-serif;
        color: var(--text-main);
        user-select: none;
        -webkit-user-select: none;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.03), transparent 15%, transparent 85%, rgba(255,255,255,0.02)),
            repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 4px);
        opacity: 0.35;
        mix-blend-mode: screen;
    }

    canvas { display: block; touch-action: none; }

    .font-display { font-family: 'Orbitron', sans-serif; letter-spacing: 0.06em; }

    .glass {
        background:
            linear-gradient(180deg, rgba(21, 43, 59, 0.9), rgba(9, 20, 31, 0.92));
        backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
            0 12px 32px rgba(0, 0, 0, 0.38),
            0 0 20px rgba(124, 233, 255, 0.12);
    }

    .hud-card {
        min-width: 110px;
        padding: 0.55rem 0.7rem;
        border-radius: 1rem;
        background:
            linear-gradient(180deg, rgba(9, 23, 37, 0.96), rgba(15, 29, 42, 0.92));
        border: 1px solid rgba(124, 233, 255, 0.28);
        box-shadow: var(--glow);
    }

    .hud-label {
        font-size: 0.64rem;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.16em;
    }

    .hud-value {
        margin-top: 0.15rem;
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        line-height: 1;
        text-shadow: 0 0 16px rgba(255,255,255,0.18);
    }

    .btn-push { transition: transform 0.08s ease, filter 0.16s ease, box-shadow 0.16s ease; }
    .btn-push:active { transform: scale(0.96); }
    .btn-push:hover { filter: brightness(1.07); }

    .arcade-btn {
        border: 1px solid rgba(255,255,255,0.16);
        box-shadow: 0 0 22px rgba(124, 233, 255, 0.18), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite; }
    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
        40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .modal-enter { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn {
        from { opacity: 0; transform: translateY(12px) scale(0.92); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .spin-wheel { transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1); }

    .hero-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 6.25rem;
        height: 6.25rem;
        border-radius: 1.5rem;
        margin-bottom: 1rem;
        font-size: 3.2rem;
        background:
            radial-gradient(circle at 30% 30%, rgba(255,255,255,0.22), transparent 30%),
            linear-gradient(180deg, #2f5268, #11202d 70%);
        border: 1px solid rgba(124, 233, 255, 0.42);
        box-shadow:
            0 0 0 6px rgba(124, 233, 255, 0.05),
            0 0 30px rgba(124, 233, 255, 0.25),
            inset 0 -12px 18px rgba(0,0,0,0.32);
        animation: heroPulse 2.2s ease-in-out infinite;
    }

    .hero-badge::after {
        content: "";
        position: absolute;
        width: 4rem;
        height: 0.45rem;
        border-radius: 999px;
        background: rgba(124, 233, 255, 0.18);
        filter: blur(10px);
        transform: translateY(3.9rem);
    }

    @keyframes heroPulse {
        0%, 100% { transform: translateY(0); box-shadow: 0 0 0 6px rgba(124, 233, 255, 0.05), 0 0 30px rgba(124, 233, 255, 0.25), inset 0 -12px 18px rgba(0,0,0,0.32); }
        50% { transform: translateY(-3px); box-shadow: 0 0 0 8px rgba(124, 233, 255, 0.08), 0 0 36px rgba(124, 233, 255, 0.36), inset 0 -12px 18px rgba(0,0,0,0.32); }
    }

    .start-title {
        text-shadow: 0 0 20px rgba(124, 233, 255, 0.18), 0 0 32px rgba(255, 217, 94, 0.18);
    }

    .sub-copy {
        color: #c6dcea;
        max-width: 21rem;
        line-height: 1.45;
        font-size: 0.95rem;
    }

    .menu-icon {
        width: 2.55rem;
        height: 2.55rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.95rem;
        background: linear-gradient(180deg, rgba(124, 233, 255, 0.18), rgba(255,255,255,0.04));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        margin-bottom: 0.15rem;
    }

    .menu-label {
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #d6eaf7;
    }

    .alert-panel {
        border: 1px solid rgba(255,255,255,0.18);
        background:
            radial-gradient(circle at top, rgba(255, 142, 142, 0.22), transparent 38%),
            linear-gradient(180deg, rgba(96, 17, 31, 0.96), rgba(45, 7, 17, 0.96));
        box-shadow: 0 0 30px rgba(255, 94, 116, 0.28);
    }

    .modal-shell {
        display: flex;
        flex-direction: column;
        max-height: min(90vh, 44rem);
    }

    .modal-content-scroll {
        overflow-y: auto;
        padding-right: 0.2rem;
    }

    .scan-line {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        border-radius: inherit;
    }

    .scan-line::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -30%;
        height: 22%;
        background: linear-gradient(180deg, transparent, rgba(124, 233, 255, 0.09), transparent);
        animation: scanMove 4s linear infinite;
    }

    @keyframes scanMove {
        from { transform: translateY(0); }
        to { transform: translateY(520%); }
    }

    .scrap-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.6rem;
        border-radius: 999px;
        border: 1px solid rgba(124, 233, 255, 0.18);
        background: rgba(124, 233, 255, 0.08);
        color: #def7ff;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .fx-overlay {
        position: absolute;
        inset-inline: 0;
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 25;
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .fx-overlay.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .fx-card {
        width: min(70vw, 12rem);
        border-radius: 1rem;
        overflow: hidden;
        border: 1px solid rgba(124, 233, 255, 0.3);
        background: rgba(6, 17, 26, 0.72);
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(8px);
    }

    .fx-card img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        object-fit: cover;
    }

    .fx-caption {
        padding: 0.35rem 0.5rem 0.45rem;
        text-align: center;
        font-size: 0.66rem;
        line-height: 1.2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #eff9ff;
        background: linear-gradient(180deg, rgba(9, 23, 37, 0.18), rgba(9, 23, 37, 0.62));
    }

    @media (max-width: 640px) {
        .hero-badge {
            width: 5.2rem;
            height: 5.2rem;
            font-size: 2.75rem;
            margin-bottom: 0.8rem;
        }

        .start-title {
            font-size: 2.55rem !important;
            line-height: 0.95;
        }

        #bottom-menu {
            height: 4.6rem;
            bottom: 1rem;
            left: 0.8rem;
            right: 0.8rem;
        }

        #modal-content {
            padding: 1rem;
        }

        .hud-card {
            min-width: 92px;
            padding: 0.45rem 0.6rem;
        }

        .hud-value {
            font-size: 1.35rem;
        }
    }
</style>
</head>
<body>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "conveyorSpeed": { "type": "number", "label": "Conveyor Speed", "value": 3, "min": 1, "max": 10 },
    "thiefChance": { "type": "number", "label": "Thief Frequency", "value": 5, "min": 1, "max": 20 },

}
</script>

<!-- Assets -->

<audio id="bgm_main" data-editable="audio" data-label="BGM Gameplay Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="SFX Collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_alarm" data-editable="audio" data-label="SFX Alarm" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
<audio id="sfx_win" data-editable="audio" data-label="SFX Win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
<audio id="sfx_click" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="SFX Fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
<audio id="sfx_blocked" data-editable="audio" data-label="SFX Blocked" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full overflow-hidden">
    <canvas id="gameCanvas"></canvas>

    <div class="absolute inset-0 pointer-events-none opacity-30">
        <div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-cyan-200/10 to-transparent"></div>
        <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-cyan-950/30 to-transparent"></div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: thief-alert + reward-reaction -> catalogs/gifs.json -->
    <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect taps on conveyor lane -->
    <div id="thief-gif-overlay" class="fx-overlay top-24 px-4" aria-hidden="true">
        <div class="fx-card">

            <div class="fx-caption font-display">Raider Lockdown</div>
        </div>
    </div>
    <div id="reward-gif-overlay" class="fx-overlay bottom-28 px-4" aria-hidden="true">
        <div class="fx-card">
            <img src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Animated reward feedback for bonus scrap wins" loading="lazy">
            <div class="fx-caption font-display">Jackpot Feed</div>
        </div>
    </div>
    
    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe top corners -->
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-10">
        <div class="hud-card flex flex-col items-start">
            <span class="hud-label">Scrap</span>

            <span class="hud-label">Prestige</span>
            <span id="rebirth-display" class="hud-value text-[var(--purple)]">0</span>
        </div>
    </div>

    <!-- Alert Overlay -->
    <div id="alert-overlay" class="hidden absolute inset-0 z-40 bg-[rgba(62,8,19,0.84)] flex flex-col items-center justify-center pointer-events-auto p-4">
        <div class="alert-panel relative w-full max-w-sm rounded-[1.75rem] px-6 py-8 flex flex-col items-center text-center">
            <div class="scan-line"></div>
            <div class="font-display text-[0.72rem] tracking-[0.35em] text-red-200/80 mb-3">SCRAP DEFENSE GRID</div>
            <h1 class="font-display text-[3rem] sm:text-[3.5rem] text-white mb-3 shake leading-none">RAIDER<br>ALERT</h1>
            <div class="text-sm sm:text-base text-yellow-200 mb-7 font-bold tracking-[0.16em] uppercase">Tap fast to lock down the conveyor.</div>
            <button id="defend-btn" class="btn-push arcade-btn bg-gradient-to-b from-red-500 to-red-700 text-white font-display text-2xl sm:text-3xl px-10 py-4 rounded-full shadow-lg">

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[rgba(3,8,14,0.92)] pointer-events-auto px-5 text-center">
        <div class="relative hero-badge">🤖</div>
        <div class="scrap-chip mb-4">Conveyor Captain // Scrap Shift Prime</div>
        <h1 class="font-display start-title text-[3.25rem] sm:text-6xl text-transparent bg-clip-text bg-gradient-to-b from-cyan-200 via-yellow-300 to-orange-500 mb-3 leading-[0.92]">SCRAPLINE<br>TYCOON</h1>
        <p class="sub-copy mb-8">Pilot your magnetic loader, snag premium salvage, fend off raiders, and prestige into a brighter scrapyard empire.</p>
        <button id="start-btn" class="btn-push arcade-btn bg-gradient-to-b from-cyan-300 to-cyan-500 text-slate-950 font-display text-2xl sm:text-3xl px-9 py-4 rounded-2xl shadow-[0_0_24px_rgba(124,240,255,0.45)]">
            START SHIFT

    <!-- Bottom Menu -->
    <!-- [agent-note][stage2] preserve: control-zone | reason: bottom dock already thumb-safe -->
    <div id="bottom-menu" class="absolute bottom-6 left-4 right-4 h-20 glass rounded-2xl flex justify-around items-center z-20 pointer-events-auto hidden">
        <button id="btn-shop" class="btn-push flex flex-col items-center justify-center w-1/4 h-full">
            <span class="menu-icon text-xl">🛠️</span>
            <span class="menu-label">Shop</span>
        </button>
        <button id="btn-duel" class="btn-push flex flex-col items-center justify-center w-1/4 h-full">

            <span class="menu-label">Duel</span>

            <div id="modal-body" class="modal-content-scroll pr-1"></div>

<script>
/**
 * §1 CORE SYSTEMS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let config = {};

// Game State
let state = {
    score: 0,
    rebirth: 0,
    multiplier: 1,
    inventory: [],
    lastThiefTime: 0,
    isThiefActive: false,
    isPlaying: false,
    autoClickerLevel: 0,
    defenseLevel: 0
};

// Config Manager
function loadConfig() {
    try {
        const raw = JSON.parse(document.getElementById('game-config').textContent);
        for (let k in raw) config[k] = raw[k].value;
        window.gameConfigDefs = raw;
        window.gameConfig = config;
    } catch (e) {
        console.error("Config Load Error", e);
    }
}
window.updateGameConfig = (k, v) => {
    if (config[k] !== undefined) config[k] = v;
};

// Audio Manager
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const sounds = {
    bgm: document.getElementById('bgm_main'),
    collect: document.getElementById('sfx_collect'),
    alarm: document.getElementById('sfx_alarm'),
    win: document.getElementById('sfx_win'),
    click: document.getElementById('sfx_click'),
    fail: document.getElementById('sfx_fail'),
    blocked: document.getElementById('sfx_blocked')
};
const gifState = {
    thiefTimer: null,
    rewardTimer: null
};
let audioUnlocked = false;

Object.assign(sounds.bgm, { volume: 0.2 });
Object.assign(sounds.collect, { volume: 0.55 });
Object.assign(sounds.alarm, { volume: 0.58 });
Object.assign(sounds.win, { volume: 0.6 });
Object.assign(sounds.click, { volume: 0.42 });
Object.assign(sounds.fail, { volume: 0.5 });
Object.assign(sounds.blocked, { volume: 0.48 });

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
}

function setBgmPlaying(shouldPlay) {
    const bgm = sounds.bgm;
    if (!bgm) return;
    if (shouldPlay) {
        bgm.play().catch(() => {});
    } else {
        bgm.pause();
        bgm.currentTime = 0;
    }
}

function playSound(id, options = {}) {
    unlockAudio();
    const el = sounds[id];
    const { restart = true } = options;

    if (el) {
        if (restart) {
            try {
                el.currentTime = 0;
            } catch (err) {}
        }
        el.play().catch(() => playSynth(id));
        return;
    }

    playSynth(id);
}

function playSoundThrottled(id, minGap = 120) {
    const el = sounds[id];
    const now = performance.now();
    if (el && el.dataset.lastPlayedAt && now - Number(el.dataset.lastPlayedAt) < minGap) return;
    if (el) el.dataset.lastPlayedAt = String(now);
    playSound(id);
}

function playSynth(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'collect') {
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'alarm' || type === 'fail' || type === 'blocked') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(type === 'blocked' ? 240 : 200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(type === 'blocked' ? 180 : 400, audioCtx.currentTime + 0.2);
        gain.gain.value = type === 'fail' ? 0.14 : 0.18;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'click') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(720, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
    } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(660, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function showGifOverlay(id, duration = 1800) {
    const el = document.getElementById(id);
    if (!el) return;
    const timerKey = id === 'thief-gif-overlay' ? 'thiefTimer' : 'rewardTimer';
    clearTimeout(gifState[timerKey]);
    el.classList.add('is-visible');
    gifState[timerKey] = setTimeout(() => el.classList.remove('is-visible'), duration);
}

/**
 * §2 VISUALS & LOGIC
 */
const EMOJIS = ['🤖', '⚙️', '🔩', '🧲', '🔋', '💎', '📦', '🪙'];
const RARITY_COLORS = ['#d8f4ff', '#89ffb9', '#7cc8ff', '#b794ff', '#ffd45f', '#ff6b78'];
let particles = [];
let items = [];
let beltOffset = 0;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

class Item {
    constructor() {
        this.reset();
        this.y = -50;
    }

    reset() {
        this.x = (window.innerWidth / 2) - 30 + (Math.random() * 60 - 30);
        this.y = -50;
        this.emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
        this.rarity = Math.floor(Math.random() * 6);
        if (Math.random() > 0.95) this.rarity = 5;
        this.active = true;
        this.scale = 1;
        this.vx = (Math.random() - 0.5) * 0.5;
    }

    update(dt) {
        if (!this.active) return;
        this.y += config.conveyorSpeed * (dt / 16) * 1.5;
        this.x += Math.sin(this.y * 0.01) * 0.5;

        if (this.y > window.innerHeight) {
            this.active = false;
        }
    }

    draw(ctx) {
        if (!this.active) return;
        const pulse = 1 + Math.sin((performance.now() + this.y) * 0.01) * 0.04;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.beginPath();
        ctx.fillStyle = `rgba(124, 233, 255, ${0.08 + this.rarity * 0.02})`;
        ctx.ellipse(this.x, this.y + 4, 24 * pulse, 11 * pulse, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${0.1 + this.rarity * 0.02})`;
        ctx.arc(this.x, this.y, 24 * pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = `${40 * this.scale * pulse}px Arial`;
        if (this.rarity > 2) {
            ctx.shadowColor = RARITY_COLORS[this.rarity];
            ctx.shadowBlur = 14 + (this.rarity * 5);
        } else {
            ctx.shadowColor = 'rgba(124, 233, 255, 0.2)';
            ctx.shadowBlur = 8;
        }

        ctx.fillText(this.emoji, this.x, this.y);
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.life = 1.0;
        this.vy = -2 - Math.random() * 2;
        this.vx = (Math.random() - 0.5) * 2;
        this.color = `hsl(${170 + Math.random() * 80}, 100%, ${55 + Math.random() * 15}%)`;
    }

    update(dt) {
        this.x += this.vx * (dt / 16);
        this.y += this.vy * (dt / 16);
        this.life -= 0.02 * (dt / 16);
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.text ? this.color : '#e8fbff';
        if (this.text) {
            ctx.font = "700 20px 'Orbitron'";
            ctx.textAlign = 'center';
            ctx.fillText(this.text, this.x, this.y);
        } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

function spawnItem() {
    let item = items.find(i => !i.active);
    if (!item) {
        item = new Item();
        items.push(item);
    } else {
        item.reset();
    }
}

function checkThief(dt) {
    if (!state.isPlaying || state.isThiefActive) return;

    if (Math.random() < (0.0001 * config.thiefChance * (dt / 16))) {
        triggerThief();
    }
}

function triggerThief() {
    state.isThiefActive = true;
    document.getElementById('alert-overlay').classList.remove('hidden');
    showGifOverlay('thief-gif-overlay', 2600);
    playSound('alarm');

    state.thiefTimer = setTimeout(() => {
        if (state.isThiefActive) {
            const loss = Math.floor(state.score * 0.3);
            state.score -= loss;
            updateScore();
            endThief(false);
        }
    }, 4000);
}

function endThief(success) {
    state.isThiefActive = false;
    clearTimeout(state.thiefTimer);
    document.getElementById('alert-overlay').classList.add('hidden');
    if (success) {
        spawnFloatingText(window.innerWidth / 2, window.innerHeight / 2, "SCRAP SECURED!");
        showGifOverlay('reward-gif-overlay', 1800);
        playSound('win');
    } else {
        spawnFloatingText(window.innerWidth / 2, window.innerHeight / 2, "RAIDED! -30%");
        playSound('fail');
    }
}

function spawnFloatingText(x, y, txt) {
    particles.push(new Particle(x, y, txt));
}

function updateScore() {
    document.getElementById('score-display').innerText = Math.floor(state.score).toLocaleString();
    document.getElementById('rebirth-display').innerText = state.rebirth;
}

function drawBackground(cw, ch) {
    const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
    bgGrad.addColorStop(0, '#132838');
    bgGrad.addColorStop(0.5, '#0d1e2b');
    bgGrad.addColorStop(1, '#06111a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = 'rgba(124, 233, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let y = 0; y < ch; y += 36) {
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(cw, y + 0.5);
        ctx.stroke();
    }

    const laneGlow = ctx.createRadialGradient(cw / 2, ch * 0.2, 20, cw / 2, ch * 0.2, ch * 0.9);
    laneGlow.addColorStop(0, 'rgba(124, 233, 255, 0.1)');
    laneGlow.addColorStop(1, 'rgba(124, 233, 255, 0)');
    ctx.fillStyle = laneGlow;
    ctx.fillRect(0, 0, cw, ch);
}

function drawConveyor(cw, ch, dt) {
    ctx.save();

    const beltGrad = ctx.createLinearGradient((cw / 2) - 60, 0, (cw / 2) + 60, 0);
    beltGrad.addColorStop(0, '#152735');
    beltGrad.addColorStop(0.5, '#2a3f4f');
    beltGrad.addColorStop(1, '#152735');
    ctx.fillStyle = beltGrad;
    ctx.fillRect((cw / 2) - 60, 0, 120, ch);

    beltOffset = (beltOffset + config.conveyorSpeed * (dt / 16)) % 40;
    ctx.strokeStyle = '#476575';
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let y = beltOffset - 40; y < ch; y += 40) {
        ctx.moveTo((cw / 2) - 55, y);
        ctx.lineTo((cw / 2) + 55, y);
    }
    ctx.stroke();

    ctx.fillStyle = config.themeColor;
    ctx.fillRect((cw / 2) - 66, 0, 12, ch);
    ctx.fillRect((cw / 2) + 54, 0, 12, ch);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.fillRect((cw / 2) - 44, 0, 8, ch);
    ctx.fillRect((cw / 2) + 36, 0, 8, ch);

    ctx.restore();
}

/**
 * §3 GAME LOOP
 */
let lastTime = 0;
let spawnTimer = 0;

function gameLoop(time) {
    if (!lastTime) lastTime = time;
    const dt = Math.min(time - lastTime, 50);
    lastTime = time;

    const cw = canvas.width / window.devicePixelRatio;
    const ch = canvas.height / window.devicePixelRatio;

    drawBackground(cw, ch);

    if (state.isPlaying) {
        drawConveyor(cw, ch, dt);

        spawnTimer += dt;
        if (spawnTimer > 1000 - (state.rebirth * 20)) {
            spawnItem();
            spawnTimer = 0;
        }

        items.forEach(item => {
            item.update(dt);
            item.draw(ctx);
        });

        particles.forEach((p, i) => {
            p.update(dt);
            p.draw(ctx);
            if (p.life <= 0) particles.splice(i, 1);
        });

        if (state.autoClickerLevel > 0) {
            state.score += (state.autoClickerLevel * 0.01) * (dt / 16) * state.multiplier;
            if (Math.random() < 0.05) updateScore();
        }

        checkThief(dt);
    }

    requestAnimationFrame(gameLoop);
}

/**
 * §4 INPUT & UI
 */
function initInput() {
    canvas.addEventListener('pointerdown', e => {
        unlockAudio();
        if (!state.isPlaying || state.isThiefActive) return;

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        items.forEach(item => {
            if (item.active) {
                const dx = x - item.x;
                const dy = y - item.y;
                if (dx * dx + dy * dy < 2500) {
                    item.active = false;
                    const val = Math.floor((10 + (item.rarity * 50)) * state.multiplier);
                    state.score += val;
                    spawnFloatingText(item.x, item.y, `+${val}`);
                    playSoundThrottled('collect', 90);
                    updateScore();

                    for (let i = 0; i < 5; i++) {
                        particles.push(new Particle(item.x, item.y, null));
                    }
                }
            }
        });
    }, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        unlockAudio();
        playSound('click');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('bottom-menu').classList.remove('hidden');
        const hud = document.getElementById('hud');
        if (hud) hud.classList.remove('hidden');
        state.isPlaying = true;
        setBgmPlaying(true);
    });

    document.getElementById('defend-btn').addEventListener('click', () => {
        endThief(true);
    });

    const modal = document.getElementById('modal-container');
    const modalBody = document.getElementById('modal-body');
    const closeBtn = document.getElementById('modal-close');

    function openModal(content) {
        playSound('click');
        modalBody.innerHTML = content;
        modal.classList.remove('hidden');
    }

    closeBtn.addEventListener('click', () => {
        playSound('click');
        modal.classList.add('hidden');
    });
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            playSound('click');
            modal.classList.add('hidden');
        }
    });

    document.getElementById('btn-shop').addEventListener('click', () => {
        const costAuto = Math.floor(100 * Math.pow(1.5, state.autoClickerLevel));
        const costDef = Math.floor(200 * Math.pow(1.5, state.defenseLevel));

        openModal(`
            <div class="space-y-4">
                <div class="text-center">
                    <div class="font-display text-3xl text-white mb-2">UPGRADE BAY</div>
                    <div class="text-xs uppercase tracking-[0.2em] text-cyan-200/75">Tune your scrapyard crew</div>
                </div>
                <div class="space-y-3">
                    <div class="bg-black/30 border border-cyan-300/10 p-3 rounded-2xl flex justify-between items-center gap-3">
                        <div>
                            <div class="text-cyan-200 font-bold">Auto-Sorter Drone</div>
                            <div class="text-xs text-slate-300/75">Adds passive scrap income</div>
                        </div>
                        <button onclick="buyUpgrade('auto', ${costAuto})" class="arcade-btn bg-cyan-600 px-3 py-2 rounded-xl text-white font-bold text-sm shrink-0">
                            ${costAuto} Scrap
                        </button>
                    </div>
                    <div class="bg-black/30 border border-cyan-300/10 p-3 rounded-2xl flex justify-between items-center gap-3">
                        <div>
                            <div class="text-violet-200 font-bold">Security Grid</div>
                            <div class="text-xs text-slate-300/75">Helps against raider events</div>
                        </div>
                        <button onclick="buyUpgrade('def', ${costDef})" class="arcade-btn bg-violet-600 px-3 py-2 rounded-xl text-white font-bold text-sm shrink-0">
                            ${costDef} Scrap
                        </button>
                    </div>
                </div>
            </div>
        `);
    });

    document.getElementById('btn-duel').addEventListener('click', () => {
        openModal(`
            <div class="space-y-4 text-center">
                <div>
                    <h2 class="font-display text-3xl text-white mb-2">SALVAGE DUEL</h2>
                    <p class="text-slate-200/80 text-sm">Risk 10% of your scrap in a quick showdown.</p>
                </div>
                <div class="mx-auto w-28 h-28 rounded-full border border-red-300/30 bg-gradient-to-b from-red-400/25 to-red-900/25 flex items-center justify-center text-5xl shadow-[0_0_28px_rgba(255,94,116,0.18)]">⚔️</div>
                <div class="flex justify-center">
                    <button onclick="startDuel()" class="arcade-btn bg-gradient-to-b from-red-500 to-red-700 text-white font-display text-xl px-8 py-3 rounded-2xl shadow-lg">
                        CHALLENGE
                    </button>
                </div>
                <div id="duel-result" class="mt-1 text-center font-bold text-lg h-8"></div>
            </div>
        `);
    });

    document.getElementById('btn-wheel').addEventListener('click', () => {
        openModal(`
            <div class="space-y-4 text-center">
                <div>
                    <h2 class="font-display text-3xl text-white mb-2">BONUS WHEEL</h2>
                    <p class="text-slate-200/80 text-sm">Spin the recycler for a random payout.</p>
                </div>
                <div class="relative w-48 h-48 mx-auto mb-1 bg-slate-900 rounded-full border-4 border-yellow-400/90 overflow-hidden flex items-center justify-center shadow-[0_0_30px_rgba(255,217,94,0.2)]">
                    <div id="wheel-inner" class="w-full h-full rounded-full" style="background: conic-gradient(#ff6476 0deg 90deg, #58a9ff 90deg 180deg, #2cf2b0 180deg 270deg, #ffd95e 270deg 360deg);"></div>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none text-4xl">⚙️</div>
                </div>
                <button onclick="spinWheel()" class="arcade-btn w-full bg-gradient-to-b from-yellow-500 to-amber-600 text-slate-950 font-display text-xl py-3 rounded-2xl">SPIN (500 Scrap)</button>
            </div>
        `);
    });

    document.getElementById('btn-rebirth').addEventListener('click', () => {
        const req = 10000 * (state.rebirth + 1);
        openModal(`
            <div class="space-y-4 text-center">
                <div>
                    <h2 class="font-display text-3xl text-violet-200 mb-2">PRESTIGE RESET</h2>
                    <p class="text-white/90">Reset scrap for a 2x payout multiplier.</p>
                    <p class="text-sm text-slate-300/70 mt-2">Requirement: ${req} Scrap</p>
                </div>
                <div class="mx-auto w-24 h-24 rounded-[1.5rem] border border-violet-300/25 bg-gradient-to-b from-violet-300/20 to-violet-900/20 flex items-center justify-center text-4xl shadow-[0_0_24px_rgba(178,147,255,0.2)]">🚀</div>
                <button onclick="doRebirth(${req})" class="arcade-btn w-full bg-gradient-to-b from-violet-500 to-violet-700 text-white font-display text-xl py-3 rounded-2xl ${state.score < req ? 'opacity-50 cursor-not-allowed' : ''}">
                    PRESTIGE NOW
                </button>
            </div>
        `);
    });
}

// Global Actions
window.buyUpgrade = (type, cost) => {
    if (state.score >= cost) {
        state.score -= cost;
        if (type === 'auto') state.autoClickerLevel++;
        if (type === 'def') state.defenseLevel++;
        playSound('collect');
        playSound('click', { restart: false });
        updateScore();
        document.getElementById('modal-close').click();
    } else {
        playSound('blocked');
    }
};

window.startDuel = () => {
    const bet = Math.floor(state.score * 0.1);
    if (bet < 10) {
        playSound('blocked');
        return;
    }

    playSound('click');
    const resDiv = document.getElementById('duel-result');
    resDiv.innerText = "MATCHING CREW...";

    setTimeout(() => {
        const win = Math.random() > 0.5;
        if (win) {
            state.score += bet;
            resDiv.innerHTML = `<span class="text-green-300">SALVAGE WON! +${bet}</span>`;
            showGifOverlay('reward-gif-overlay', 1800);
            playSound('win');
        } else {
            state.score -= bet;
            resDiv.innerHTML = `<span class="text-red-300">SALVAGE LOST! -${bet}</span>`;
            showGifOverlay('thief-gif-overlay', 1600);
            playSound('fail');
        }
        updateScore();
    }, 1000);
};

window.spinWheel = () => {
    if (state.score < 500) {
        playSound('blocked');
        return;
    }
    playSound('click');
    state.score -= 500;
    updateScore();

    const wheel = document.getElementById('wheel-inner');
    const rot = 1080 + Math.random() * 360;
    wheel.style.transition = "transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)";
    wheel.style.transform = `rotate(${rot}deg)`;

    setTimeout(() => {
        const reward = Math.floor(Math.random() * 2000);
        state.score += reward;
        updateScore();
        showGifOverlay('reward-gif-overlay', 2200);
        playSound('win');
        spawnFloatingText(window.innerWidth / 2, window.innerHeight / 2, `+${reward} SCRAP`);
        wheel.style.transition = "none";
        wheel.style.transform = "rotate(0deg)";
    }, 3000);
};

window.doRebirth = (req) => {
    if (state.score >= req) {
        state.score = 0;
        state.rebirth++;
        state.multiplier *= 2;
        state.autoClickerLevel = 0;
        showGifOverlay('reward-gif-overlay', 2000);
        playSound('win');
        updateScore();
        document.getElementById('modal-close').click();
    } else {
        playSound('blocked');
    }
};

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (sounds.bgm) sounds.bgm.pause();
    } else if (state.isPlaying) {
        setBgmPlaying(true);
    }
});

// Init
window.addEventListener('DOMContentLoaded', () => {
    loadConfig();
    resize();
    updateScore();
    window.addEventListener('resize', resize);
    initInput();
    requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
