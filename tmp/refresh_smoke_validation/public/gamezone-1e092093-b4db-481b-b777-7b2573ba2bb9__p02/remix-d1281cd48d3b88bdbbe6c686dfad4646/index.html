    function setDecisionState(text,tone){decisionBadge.textContent=text;decisionBadge.className='pill';if(tone)decisionBadge.classList.add(tone)}
    function setScene(index){currentSceneIndex=index;const s=scenes[index];sceneLabel.textContent='Frame '+(index+1);sceneTitle.textContent=s.title;sceneText.textContent=s.text;[propA.style.left,propA.style.top,propB.style.right,propB.style.top,propC.style.left,propC.style.bottom]=s.props;dots.forEach((dot,i)=>{dot.className='progress-dot'+(i<index?' completed':i===index?' current':'')});document.querySelector('.sky').style.filter='hue-rotate('+(index*12)+'deg) saturate('+(1+index*.04)+')'}
    function showGif(kind,duration=1500){const m=gifMoments[kind];if(!m)return;clearTimeout(gifTimer);gifFeedbackImage.src=m.src;gifFeedbackImage.alt=m.alt;gifFeedbackCaption.textContent=m.caption;gifFeedback.classList.add('show');gifTimer=setTimeout(()=>gifFeedback.classList.remove('show'),duration)}
    function delay(ms){return new Promise(resolve=>{remainingMs=ms;timerStart=performance.now();timerResolve=resolve;activeTimer=setTimeout(()=>{activeTimer=null;timerResolve=null;resolve()},ms)})}
    async function playScene(index){transitionFlash.classList.add('flash');playSfx('reveal');showGif('reveal',1200);setTimeout(()=>transitionFlash.classList.remove('flash'),240);setScene(index);setDecisionState('Forge reel rolling','');await delay(scenes[index].duration)}
    function ask(options){return new Promise(resolve=>{choicesContainer.innerHTML='';progressBar.classList.remove('visible');setDecisionState('Choose the next forge oath','is-warning');playSfx('tension');showGif('reveal',1400);options.forEach(text=>{const btn=document.createElement('button');btn.className='choice-btn';btn.type='button';btn.textContent=text;btn.addEventListener('click',()=>{choiceCount++;choicesContainer.classList.remove('visible');progressBar.classList.add('visible');setDecisionState('Choice '+choiceCount+' stamped','is-success');playSfx('choose');showGif('choice',1300);resolve()},{once:true});choicesContainer.appendChild(btn)});choicesContainer.classList.add('visible')})}
    async function story(){started=true;progressBar.classList.add('visible');hud.classList.add('visible');pauseBtn.classList.add('visible');setDecisionState('Forge reel rolling','');setScene(0);await delay(scenes[0].duration);for(let i=0;i<choices.length;i++){await ask(choices[i]);await playScene(i+1)}progressBar.classList.remove('visible');pauseBtn.classList.remove('visible');setDecisionState('Oath complete','is-success');playSfx('complete');showGif('complete',2300);audioBank.ambience.pause();endScreen.classList.add('show')}
    function pauseResume(){if(!started||choicesContainer.classList.contains('visible')||endScreen.classList.contains('show'))return;if(!isPaused){isPaused=true;clearTimeout(activeTimer);activeTimer=null;remainingMs=Math.max(100,remainingMs-(performance.now()-timerStart));pauseBtn.textContent='▶';setDecisionState('Forge reel paused','is-warning');playSfx('pause');audioBank.ambience.pause()}else{isPaused=false;pauseBtn.textContent='—';setDecisionState('Forge reel rolling','');playSfx('resume');safePlay(audioBank.ambience,false);timerStart=performance.now();activeTimer=setTimeout(()=>{const r=timerResolve;activeTimer=null;timerResolve=null;if(r)r()},remainingMs)}}
    playGate.addEventListener('click',()=>{playGate.classList.add('hidden');unlockAudio();story()},{once:true});pauseBtn.addEventListener('click',pauseResume);endScreen.querySelector('.replay').addEventListener('click',()=>location.reload());
  </script>
</body>
</html>
