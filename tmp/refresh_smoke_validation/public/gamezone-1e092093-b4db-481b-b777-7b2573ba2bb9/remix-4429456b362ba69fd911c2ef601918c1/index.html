<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode 2: House of Secrets</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05030a;
      --bg-deep: #13091f;
      --panel: rgba(17, 11, 31, 0.82);
      --panel-strong: rgba(31, 17, 50, 0.92);
      --line: rgba(194, 140, 255, 0.36);
      --line-bright: rgba(255, 163, 214, 0.55);
      --text: #f7f1ff;
      --muted: rgba(238, 227, 255, 0.72);
      --glow: #b464ff;
      --glow-soft: rgba(180, 100, 255, 0.24);
      --accent: #ff6bb3;
      --accent-strong: #ff9ad0;
      --danger: #ff4e78;
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 999px;
      --font-display: 'Cinzel', Georgia, serif;
      --font-ui: 'Rajdhani', 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 107, 179, 0.12), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(180, 100, 255, 0.18), transparent 28%),
        linear-gradient(180deg, #0b0713 0%, #05030a 100%);
      color: var(--text);
      font-family: var(--font-ui);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.03), transparent 38%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02) 0 1px,
          transparent 1px 5px
        );
      mix-blend-mode: screen;
      pointer-events: none;
      opacity: 0.45;
      z-index: 1;
    }

    #videoContainer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(44, 23, 72, 0.3), transparent 50%),
        #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoContainer::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.06);
      pointer-events: none;
      z-index: 2;
    }

    #V {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
      filter: saturate(1.08) contrast(1.04);
      position: relative;
      z-index: 1;
    }

    #playGate {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(2, 1, 6, 0.96) 0%, rgba(10, 5, 22, 0.68) 38%, rgba(19, 10, 31, 0.48) 62%, rgba(4, 2, 10, 0.8) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px 10%;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.3s ease;
      overflow: hidden;
    }

    #playGate::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(23, 7, 34, 0.18), rgba(0, 0, 0, 0.6)),
        url('vn2_scenes/poster.jpg') center/cover no-repeat;
      z-index: -2;
      transform: scale(1.02);
      filter: saturate(1.08) contrast(1.02);
    }

    #playGate::after {
      content: '👁️';
      position: absolute;
      top: 12%;
      right: 10%;
      font-size: clamp(2rem, 7vw, 4rem);
      opacity: 0.16;
      filter: drop-shadow(0 0 14px rgba(255, 107, 179, 0.45));
      animation: floatSigil 3.6s ease-in-out infinite;
    }

    #playGate.hidden { pointer-events: none; opacity: 0; }

    .playGate-title {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 7vw, 3.5rem);
      line-height: 0.95;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 1px;
      color: #ffd0ef;
      text-shadow:
        0 0 10px rgba(255, 107, 179, 0.48),
        0 0 24px rgba(180, 100, 255, 0.3);
    }

    .playGate-tagline {
      max-width: 24rem;
      text-align: center;
      margin-bottom: 1.4rem;
      padding: 0.45rem 0.9rem;
      border: 1px solid rgba(255, 163, 214, 0.26);
      border-radius: var(--radius-sm);
      background: rgba(18, 10, 31, 0.55);
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(180, 100, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .playGate-ring {
      position: relative;
      width: 92px;
      height: 92px;
      margin-bottom: 1.2rem;
      animation: pulse 2.2s infinite;
      filter: drop-shadow(0 0 14px rgba(255, 107, 179, 0.35));
    }

    .playGate-ring::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: 92px;
      height: 92px;
      border: 2px solid rgba(255, 163, 214, 0.52);
      border-radius: 50%;
      box-shadow:
        inset 0 0 18px rgba(255, 107, 179, 0.14),
        0 0 20px rgba(180, 100, 255, 0.24);
    }

    .playGate-ring::after {
      content: '▶';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-44%,-50%);
      font-size: 1.8rem;
      color: rgba(255,255,255,0.92);
    }

    .playGate-tap {
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.92;
      color: var(--text);
      animation: pulse 2.2s infinite;
      text-align: center;
    }

    #pauseBtn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(19, 10, 31, 0.72);
      backdrop-filter: blur(10px);
      color: #ffffff;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }

    #pauseBtn.visible { opacity: 0.8; pointer-events: auto; }
    #pauseBtn:hover { background: rgba(40, 19, 64, 0.9); border-color: var(--line-bright); opacity: 1; }
    #pauseBtn:active { transform: scale(0.95); }

    #progressBar {
      position: absolute;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(12, 8, 22, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    #progressBar.visible { opacity: 1; }

    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.24);
      transition: width 0.3s ease, opacity 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .progress-dot.current {
      width: 26px;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      box-shadow: 0 0 12px rgba(255, 107, 179, 0.42);
    }

    .progress-dot.completed {
      background: rgba(218, 164, 255, 0.85);
    }

    #feedbackHud {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #feedbackHud.visible { opacity: 1; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 163, 214, 0.22);
      background: rgba(11, 7, 20, 0.7);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(10px);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .status-pill strong {
      font-family: var(--font-display);
      font-size: 0.92rem;
      letter-spacing: 0.06em;
    }

    .feedback-badge {
      min-width: 122px;
      justify-content: center;
      text-align: center;
    }

    .feedback-badge.is-warning {
      border-color: rgba(255, 120, 156, 0.45);
      box-shadow: 0 0 18px rgba(255, 78, 120, 0.2);
    }

    .feedback-badge.is-success {
      border-color: rgba(255, 220, 132, 0.45);
      box-shadow: 0 0 18px rgba(255, 190, 90, 0.16);
    }

    /* [agent-note][stage2] preserve: choice-zone-bottom | reason: already thumb-friendly on mobile */
    #choicesContainer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: auto;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(5, 2, 10, 0.94), rgba(5, 2, 10, 0.12));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #choicesContainer.visible { opacity: 1; pointer-events: auto; }

    .choice-btn {
      padding: 13px 16px;
      border: 1px solid rgba(255, 163, 214, 0.22);
      border-radius: var(--radius-md);
      background:
        linear-gradient(180deg, rgba(43, 20, 67, 0.88), rgba(20, 10, 33, 0.95));
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: var(--font-ui);
      letter-spacing: 0.02em;
      animation: slideUp 0.4s ease-out;
      animation-fill-mode: both;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .choice-btn::before {
      content: '♦';
      margin-right: 10px;
      color: #ffc1e2;
    }

    .choice-btn:nth-child(1) { animation-delay: 0.1s; }
    .choice-btn:nth-child(2) { animation-delay: 0.2s; }

    #transitionFlash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255, 162, 218, 0.22), transparent 35%),
        #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.3s ease;
    }

    #transitionFlash.flash { opacity: 1; }

    #gifFeedback {
      position: absolute;
      right: 16px;
      bottom: 160px;
      width: min(34vw, 144px);
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      z-index: 58;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 18px 28px rgba(0, 0, 0, 0.3);
      background: rgba(6, 3, 13, 0.76);
      backdrop-filter: blur(8px);
    }

    #gifFeedback.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #gifFeedback img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #gifFeedback figcaption {
      position: absolute;
      inset: auto 0 0 0;
      padding: 6px 8px;
      background: linear-gradient(to top, rgba(4, 2, 8, 0.92), rgba(4, 2, 8, 0.15));
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }

    #endScreen {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(180, 100, 255, 0.16), transparent 28%),
        linear-gradient(135deg, rgba(3, 2, 7, 0.98), rgba(20, 10, 33, 0.98));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      text-align: center;
    }

    #endScreen::before {
      content: '🏚️';
      position: absolute;
      top: 12%;
      font-size: clamp(2.4rem, 10vw, 4.4rem);
      opacity: 0.16;
      filter: drop-shadow(0 0 16px rgba(180, 100, 255, 0.3));
    }

    #endScreen.show { opacity: 1; pointer-events: auto; }

    .end-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 0.96;
      text-align: center;
      margin-bottom: 0.6rem;
      color: #ffd7ee;
      text-shadow:
        0 0 10px rgba(255, 107, 179, 0.42),
        0 0 24px rgba(180, 100, 255, 0.3);
    }

    .end-subtitle {
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      color: var(--muted);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
    }

    .end-replay-btn {
      padding: 14px 28px;
      border: 1px solid rgba(255, 163, 214, 0.3);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(56, 23, 84, 0.92), rgba(25, 11, 40, 0.96));
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      box-shadow: var(--shadow);
      min-width: min(80vw, 260px);
    }

    .end-replay-btn:hover { background: linear-gradient(180deg, rgba(73, 30, 109, 0.95), rgba(32, 14, 52, 0.98)); border-color: rgba(255, 163, 214, 0.54); }
    .end-replay-btn:active { transform: scale(0.97); }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.72; transform: scale(1.04); }
    }

    @keyframes floatSigil {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .playGate-title { margin-bottom: 0.8rem; }
      .playGate-tagline { font-size: 0.8rem; margin-bottom: 1rem; }
      .playGate-ring { width: 84px; height: 84px; }
      .playGate-ring::before { width: 84px; height: 84px; }
      .playGate-tap { font-size: 0.82rem; }
      #pauseBtn { top: 12px; right: 12px; width: 44px; height: 44px; }
      #feedbackHud {
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        right: 64px;
        gap: 8px;
      }
      .status-pill {
        min-height: 36px;
        padding: 8px 10px;
        font-size: 0.68rem;
      }
      #progressBar { bottom: 84px; max-width: calc(100vw - 32px); }
      .choice-btn { font-size: 0.98rem; padding: 13px 14px; }
      #gifFeedback {
        right: 12px;
        bottom: 154px;
        width: min(30vw, 112px);
      }
      .end-subtitle { font-size: 0.95rem; margin-bottom: 1.6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .playGate-ring,
      .playGate-tap,
      #playGate::after,
      .choice-btn {
        animation: none !important;
      }

      #gifFeedback {
        transition: none;
      }

      * {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <!--

    scene1 (0–4s)
      SHOWS: Mom in influencer studio with ring lights, phones, stacks of money. Distressed.
      LAST FRAME: Mom emotional in studio. Text "NEVER".
      → CHOICES: "Confront her about the money" / "Keep recording"

    scene2 (4–10.5s)
      SHOWS: Mom confronting grape character in studio. Pointing finger.
      LAST FRAME: Mom pointing at grape kid accusingly. Text "YOU".
      → CHOICES: "Kick him out of the studio" / "Hear what he has to say"

    scene3 (10.5–24s)
      SHOWS: Outside house. Mom on porch, grape kid below on steps.
      LAST FRAME: Mom angry on porch, grape on walkway. Evening, porch lamp lit.
      → CHOICES: "Slam the door in his face" / "Let him explain himself"

    scene4 (24–41s)
      SHOWS: Mom telling daughter to leave. Outside front of house.
      LAST FRAME: Mom leaning down toward daughter, gesturing "LEAVE".
      → CHOICES: "Give her one last chance" / "Tell her to pack her bags"

    scene5 (41–48s)
      SHOWS: Daughter at new mansion with carrot character in suit.
      LAST FRAME: Daughter with carrot man in modern mansion lobby. Text "HERE".
      → CHOICES: "Explore the new house" / "Call Mom to apologize"

    scene6 (48–65.46s)
      SHOWS: Daughter at mansion with grape. Phone call. Resolution.
  -->

  <div id="videoContainer">
    <video id="V" playsinline preload="auto" poster="vn2_scenes/poster.jpg" src="vn2_scenes/scene1.mp4"></video>
  </div>

  <div id="playGate">
    <div class="playGate-title">House of Secrets</div>
    <div class="playGate-tagline">Whispers, betrayal, and mansion drama await</div>
    <div class="playGate-ring"></div>
    <div class="playGate-tap">Tap to Continue the Drama</div>
  </div>

  <button id="pauseBtn">&#8214;</button>

  <div id="progressBar">
    <div class="progress-dot current" data-index="0"></div>
    <div class="progress-dot" data-index="1"></div>
    <div class="progress-dot" data-index="2"></div>
    <div class="progress-dot" data-index="3"></div>
    <div class="progress-dot" data-index="4"></div>
    <div class="progress-dot" data-index="5"></div>
  </div>

  <!-- [agent-note][stage4] repaired: font-remap | element: :root | action: kept Cinzel for display and remapped UI text to Rajdhani from catalogs/fonts.json -->
  <div id="feedbackHud" aria-live="polite">
    <div class="status-pill"><span>Case file</span> <strong id="sceneLabel">Scene 1</strong></div>
    <div id="decisionBadge" class="status-pill feedback-badge">Drama loading</div>
  </div>

  <div id="choicesContainer"></div>
  <div id="transitionFlash"></div>

  <!-- [agent-note][stage3] resolved-gif: choices/end feedback -> catalogs/gifs.json -->
  <figure id="gifFeedback" aria-hidden="true">
    <img id="gifFeedbackImage" alt="Story reaction overlay">
    <figcaption id="gifFeedbackCaption">Drama spike</figcaption>
  </figure>

  <div id="endScreen">
    <div class="end-title">Episode Complete</div>
    <div class="end-subtitle">The house keeps its secrets</div>
    <button class="end-replay-btn">Replay Episode</button>
  </div>

  <script>
    var V = document.getElementById('V');
    var playGate = document.getElementById('playGate');
    var pauseBtn = document.getElementById('pauseBtn');
    var progressBar = document.getElementById('progressBar');
    var choicesContainer = document.getElementById('choicesContainer');
    var transitionFlash = document.getElementById('transitionFlash');
    var endScreen = document.getElementById('endScreen');
    var feedbackHud = document.getElementById('feedbackHud');
    var sceneLabel = document.getElementById('sceneLabel');
    var decisionBadge = document.getElementById('decisionBadge');
    var gifFeedback = document.getElementById('gifFeedback');
    var gifFeedbackImage = document.getElementById('gifFeedbackImage');
    var gifFeedbackCaption = document.getElementById('gifFeedbackCaption');

    var isPaused = false;
    var currentSceneIndex = 0;
    var choiceCount = 0;
    var gifTimer = null;
    var audioUnlocked = false;
    var audioEnabled = true;
    var sfxCooldowns = {};

    var audioBank = {
      start: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3'),
      choose: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3'),
      tension: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3'),
      reveal: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3'),
      pause: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/pause_02.mp3'),
      resume: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/resume_02.mp3'),
      complete: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3'),
      ambience: new Audio('https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_02.mp3')
    };

    var gifMoments = {
      choice: {
        src: 'https://i.giphy.com/14aUO0Mf7dWDXW.webp',
        alt: 'Emotional story reaction',
        caption: 'Decision made'
      },
      reveal: {
        src: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
        alt: 'Dramatic reveal reaction',
        caption: 'Secret revealed'
      }
    };

    Object.keys(audioBank).forEach(function(key) {
      var audio = audioBank[key];
      audio.preload = 'auto';
    });
    audioBank.ambience.loop = true;
    audioBank.ambience.volume = 0.2;
    audioBank.start.volume = 0.5;
    audioBank.choose.volume = 0.4;
    audioBank.tension.volume = 0.34;
    audioBank.reveal.volume = 0.44;
    audioBank.pause.volume = 0.35;
    audioBank.resume.volume = 0.35;
    audioBank.complete.volume = 0.5;

    function safePlay(audio, resetTime) {
      if (!audioEnabled || !audioUnlocked || !audio) { return; }
      try {
        if (resetTime) { audio.currentTime = 0; }
        var playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function() {
            audioEnabled = false;
          });
        }
      } catch (err) {
        audioEnabled = false;
      }
    }

    function playSfx(name, cooldownMs) {
      var now = Date.now();
      if (cooldownMs && sfxCooldowns[name] && now - sfxCooldowns[name] < cooldownMs) {
        return;
      }
      sfxCooldowns[name] = now;
      safePlay(audioBank[name], true);
    }

    function unlockAudio() {
      if (audioUnlocked) { return; }
      audioUnlocked = true;
      playSfx('start', 0);
      setTimeout(function() {
        if (!audioEnabled) { return; }
        safePlay(audioBank.ambience, false);
      }, 180);
    }

    function syncAmbience() {
      if (!audioEnabled || !audioUnlocked) { return; }
      if (V.paused || endScreen.classList.contains('show')) {
        audioBank.ambience.pause();
      } else if (audioBank.ambience.paused) {
        safePlay(audioBank.ambience, false);
      }
    }

    function setDecisionState(text, tone) {
      decisionBadge.textContent = text;
      decisionBadge.classList.remove('is-warning', 'is-success');
      if (tone) {
        decisionBadge.classList.add(tone);
      }
    }

    function showGif(kind, duration) {
      var moment = gifMoments[kind];
      if (!moment) { return; }
      clearTimeout(gifTimer);
      gifFeedbackImage.src = moment.src;
      gifFeedbackImage.alt = moment.alt;
      gifFeedbackCaption.textContent = moment.caption;
      gifFeedback.classList.add('show');
      gifTimer = setTimeout(function() {
        gifFeedback.classList.remove('show');
      }, duration || 1900);
    }

    function setScene(index) {
      currentSceneIndex = index;
      sceneLabel.textContent = 'Scene ' + (index + 1);
      var dots = progressBar.querySelectorAll('.progress-dot');
      dots.forEach(function(dot, i) {
        dot.classList.remove('current', 'completed');
        if (i < index) { dot.classList.add('completed'); }
        else if (i === index) { dot.classList.add('current'); }
      });
    }

    function waitEnd(freeze) {
      return new Promise(function(resolve) {
        if (freeze) {
          function onTime() {
            if (V.duration > 0 && V.currentTime >= V.duration - 0.15) {
              V.pause();
              V.removeEventListener('timeupdate', onTime);
              resolve();
            }
          }
          V.addEventListener('timeupdate', onTime);
        } else {
          function onEnd() {
            V.removeEventListener('ended', onEnd);
            resolve();
          }
          V.addEventListener('ended', onEnd);
        }
      });
    }

    function playClip(src, freeze, sceneIndex) {
      return new Promise(function(resolve) {
        transitionFlash.classList.add('flash');
        playSfx('reveal', 180);
        setTimeout(function() { transitionFlash.classList.remove('flash'); }, 300);
        setTimeout(function() {
          V.src = src;
          setScene(sceneIndex);
          V.load();
          var endP = waitEnd(freeze);
          function tryPlay() { V.play().catch(function() {}); }
          V.onloadeddata = tryPlay;
          V.onerror = resolve;
          if (V.readyState >= 2) tryPlay();
          endP.then(resolve);
        }, 300);
      });
    }

    function ask(choices) {
      return new Promise(function(resolve) {
        choicesContainer.innerHTML = '';
        setDecisionState('Choose the next secret', 'is-warning');
        showGif('reveal', 2200);
        playSfx('tension', 220);
        progressBar.classList.remove('visible');
        choicesContainer.classList.add('visible');
        choices.forEach(function(text) {
          var btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = text;
          btn.addEventListener('click', function() {
            choiceCount += 1;
            setDecisionState('Choice ' + choiceCount + ' locked in', 'is-success');
            showGif('choice', 1800);
            playSfx('choose', 140);
            choicesContainer.classList.remove('visible');
            progressBar.classList.add('visible');
            resolve();
          });
          choicesContainer.appendChild(btn);
        });
      });
    }

    function story() {
      progressBar.classList.add('visible');
      feedbackHud.classList.add('visible');
      pauseBtn.classList.add('visible');
      setDecisionState('Episode in progress', '');
      setScene(0);

      var scene1End = waitEnd(true);
      V.play().catch(function() {});
      syncAmbience();

      scene1End.then(function() {
        return ask(['Confront the secret on camera', 'Stay quiet and keep recording']);
      }).then(function() {
        return playClip('vn2_scenes/scene2.mp4', true, 1);
      }).then(function() {
        return ask(['Push the argument outside', 'Demand the full story']);
      }).then(function() {
        return playClip('vn2_scenes/scene3.mp4', true, 2);
      }).then(function() {
        return ask(['Shut the door on the chaos', 'Hear the explanation out']);
      }).then(function() {
        return playClip('vn2_scenes/scene4.mp4', true, 3);
      }).then(function() {
        return ask(['Let the fallout happen', 'Leave one final warning']);
      }).then(function() {
        return playClip('vn2_scenes/scene5.mp4', true, 4);
      }).then(function() {
        return ask(['Search the mansion for answers', 'Call Mom before it gets worse']);
      }).then(function() {
        return playClip('vn2_scenes/scene6.mp4', false, 5);
      }).then(function() {
        pauseBtn.classList.remove('visible');
        progressBar.classList.remove('visible');
        setDecisionState('Mystery complete', 'is-success');
        showGif('reveal', 3200);
        playSfx('reveal', 200);
        playSfx('complete', 200);
        audioBank.ambience.pause();
        endScreen.classList.add('show');
      });
    }

    playGate.addEventListener('click', function() {
      playGate.classList.add('hidden');
      V.muted = false;
      V.removeAttribute('poster');
      unlockAudio();
      story();
    });

    pauseBtn.addEventListener('click', function() {
      if (V.paused) {
        V.play().catch(function() {});
        pauseBtn.textContent = '\u2016';
        playSfx('resume', 120);
        setDecisionState('Episode resumed', '');
        isPaused = false;
      } else {
        V.pause();
        pauseBtn.textContent = '\u25B6';
        playSfx('pause', 120);
        setDecisionState('Episode paused', 'is-warning');
        isPaused = true;
      }
      syncAmbience();
    });

    endScreen.querySelector('.end-replay-btn').addEventListener('click', function() {
      playSfx('start', 120);
      location.reload();
    });

    V.addEventListener('play', function() {
      if (pauseBtn.classList.contains('visible')) pauseBtn.style.display = 'flex';
      syncAmbience();
    });

    V.addEventListener('pause', function() {
      if (!isPaused && pauseBtn.classList.contains('visible')) pauseBtn.style.display = 'flex';
      syncAmbience();
    });
  </script>
</body>
</html>
