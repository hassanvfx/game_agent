<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Swarm 1K</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070812;
            --bg-deep: #04050b;
            --panel: rgba(8, 13, 24, 0.82);
            --panel-edge: rgba(120, 246, 255, 0.28);
            --panel-hot: rgba(255, 78, 162, 0.25);
            --signal: #78f6ff;
            --signal-strong: #9dff8f;
            --danger: #ff4ea2;
            --ink: #f5fbff;
            --muted: #8ea3bc;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 50%, rgba(120, 246, 255, 0.08), transparent 35%),
                radial-gradient(circle at 50% 100%, rgba(157, 255, 143, 0.08), transparent 30%),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--ink);
            touch-action: auto;
            user-select: none;
            -webkit-user-select: none;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(120, 246, 255, 0.05) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, rgba(120, 246, 255, 0.04) 0 1px, transparent 1px 100%);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at center, black 42%, transparent 85%);
            opacity: 0.45;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .glass {
            background:
                linear-gradient(180deg, rgba(14, 22, 38, 0.92), rgba(6, 10, 18, 0.82));
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.05),
                0 10px 28px rgba(0, 0, 0, 0.45),
                0 0 18px rgba(120, 246, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
        .glass::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 35%, transparent 65%, rgba(120,246,255,0.08));
        }
        .neon-text { text-shadow: 0 0 12px rgba(120, 246, 255, 0.8); color: var(--signal); }
        .neon-accent { text-shadow: 0 0 12px rgba(255, 78, 162, 0.8); color: var(--danger); }
        .label-text { color: var(--muted); letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; }
        .display-font { font-family: 'Orbitron', 'Rajdhani', sans-serif; }
        .ui-font { font-family: 'Rajdhani', system-ui, sans-serif; }
        .btn-disabled { opacity: 0.4; pointer-events: none; filter: grayscale(100%); }
        .gif-panel {
            position: fixed;
            right: clamp(0.5rem, 2vw, 1rem);
            z-index: 60;
            width: min(26vw, 108px);
            aspect-ratio: 1;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(120, 246, 255, 0.24);
            background: rgba(7, 10, 20, 0.72);
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }
        .gif-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gif-panel.show {
            opacity: 0.88;
            transform: translateY(0) scale(1);
        }
        #gif-collect-panel { top: max(0.75rem, env(safe-area-inset-top)); }
        #gif-spawn-panel { top: calc(max(0.75rem, env(safe-area-inset-top)) + min(26vw, 108px) + 0.65rem); }
        #ui-layer { pointer-events: none; }
        .interactive { pointer-events: auto; }
        #hud, #spawn-btn, #msg-toast { text-transform: uppercase; }
        #msg-toast {
            max-width: min(90vw, 32rem);
            padding: 0.5rem 0.85rem;
            border-radius: 999px;
            background: rgba(6, 10, 18, 0.7);
            border: 1px solid rgba(120, 246, 255, 0.18);
            box-shadow: 0 0 18px rgba(120, 246, 255, 0.12);
            color: #dffcff;
        }
        #spawn-btn {
            border: 1px solid rgba(157, 255, 143, 0.26);
            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.4),
                0 0 22px rgba(120, 246, 255, 0.08);
        }
        
        @keyframes pulse-border {
            0% { border-color: rgba(120, 246, 255, 0.3); box-shadow: 0 0 0 0 rgba(120, 246, 255, 0.18); }
            50% { border-color: rgba(157, 255, 143, 0.85); box-shadow: 0 0 26px 4px rgba(157, 255, 143, 0.18); }
            100% { border-color: rgba(120, 246, 255, 0.3); box-shadow: 0 0 0 0 rgba(120, 246, 255, 0.18); }
        }
        .can-afford { animation: pulse-border 1.0s infinite; background: rgba(157, 255, 143, 0.08); }
        
        .progress-track { background: rgba(255,255,255,0.1); height: 4px; width: 100%; border-radius: 2px; overflow: hidden; }
        .progress-fill {
            background: linear-gradient(90deg, var(--signal), var(--signal-strong));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px var(--signal);
        }

        @media (max-width: 640px) {
            #ui-layer { padding: 0.75rem; }
            #spawn-btn { padding: 0.9rem 1rem; }
            .gif-panel {
                width: 78px;
                right: 0.6rem;
            }
            #gif-spawn-panel { top: calc(max(0.75rem, env(safe-area-inset-top)) + 78px + 0.55rem); }
        }
    </style>
</head>
<body>

<!-- Asset Declaration -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: loop/ui/collect/blocked -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop preload="auto"></audio>
    <audio id="sfx_buy" data-editable="audio" data-label="Buy SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

    <audio id="sfx_blocked" data-editable="audio" data-label="Blocked SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3" preload="auto"></audio>
</div>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "swarmSpeed": { "type": "number", "label": "Drone Agility", "value": 1.2, "min": 0.5, "max": 3.0 },

}
</script>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: collect/spawn reactions -> catalogs/gifs.json -->
    <div id="gif-collect-panel" class="gif-panel" aria-hidden="true">
        <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Reward signal reaction">
    </div>
    <div id="gif-spawn-panel" class="gif-panel" aria-hidden="true">
        <img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Deploy unlock reaction">
    </div>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
        <!-- HUD -->
        <div id="hud" class="flex flex-col w-full gap-2">
            <div class="flex justify-between items-start w-full">
                <div class="flex flex-col glass px-5 py-2 rounded-lg border-l-4 border-[var(--signal)]">
                    <div class="text-xs label-text ui-font">Signal</div>
                    <div class="text-4xl font-bold neon-text tracking-wider leading-none display-font"><span id="score-display">0</span></div>

                <div class="flex flex-col items-end glass px-5 py-2 rounded-lg border-r-4 border-[var(--danger)]">

        <!-- Controls -->
        <div class="w-full flex flex-col items-center pb-8 gap-4">

            <button id="spawn-btn" class="interactive glass w-full max-w-sm py-4 rounded-xl flex flex-row items-center justify-between px-6 transition-all transform active:scale-95 btn-disabled">
                <div class="flex flex-col items-start">
                    <span class="text-2xl font-bold tracking-widest text-white display-font">Deploy</span>
                    <span class="text-xs label-text ui-font">Add drone to relay flock</span>
                </div>
                <div class="flex flex-col items-end">
                    <div class="text-xl neon-text font-bold display-font"><span id="cost-display">25</span></div>
                    <span class="ui-font text-[10px] text-slate-500 uppercase">Signal Cost</span>
                </div>
            </button>
        </div>

<script>
/** 
 * L0 System Invariants & Architecture 
 */

// --- Constants & Config ---
const CONFIG_DEFS = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(CONFIG_DEFS).map(([k, v]) => [k, v.value]));
window.gameConfigDefs = CONFIG_DEFS;

// --- State Management ---
const STATE = { PLAYING: 'PLAYING', GAMEOVER: 'GAMEOVER' };
let gameState = STATE.PLAYING;
let initialized = false;
let score = 0;
let lastTime = 0;
let comboTimer = 0;
let comboCount = 0;
let shakeTime = 0;
let blockedSfxCooldown = 0;
let collectSfxCooldown = 0;

// --- Canvas & Dimensions ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;

// --- Audio System (Web Audio API - Zero DOM Overhead) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const audioBuffers = {};

async function initAudio() {
    if (audioCtx) return;
    audioCtx = new AudioContext();
    
    const loadBuffer = async (id) => {
        const el = document.getElementById(id);
        if (!el || !el.src) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { console.warn('Audio load failed:', id); }
    };
    
    await Promise.all(['sfx_buy', 'sfx_spawn', 'sfx_collect', 'sfx_blocked'].map(loadBuffer));
}

function playSfx(id, pitchRand = 0.1) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    
    if (!audioBuffers[id]) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (id === 'sfx_collect') {
            const baseFreq = 760 + (comboCount * 40);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.7, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        } else if (id === 'sfx_blocked') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.09);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        } else {
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.18);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }
        return;
    }

    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffers[id];
    source.playbackRate.value = 1.0 + (Math.random() * pitchRand * 2 - pitchRand);
    
    const gainNode = audioCtx.createGain();
    gainNode.gain.value =
        id === 'sfx_buy' ? 0.32 :
        id === 'sfx_spawn' ? 0.42 :
        id === 'sfx_collect' ? 0.26 :
        0.22;
    
    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    source.start(0);
}

function playBgm() {
    const bgm = document.getElementById('bgm_main');
    if (bgm && bgm.paused) {
        bgm.volume = 0.22;
        bgm.play().catch(() => {});
    }
}

function unlockAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    playBgm();
}

function flashGif(id, duration = 900) {
    const panel = document.getElementById(id);
    if (!panel) return;
    panel.classList.add('show');
    clearTimeout(panel._hideTimer);
    panel._hideTimer = setTimeout(() => panel.classList.remove('show'), duration);
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 40);
    }
}

// --- Entities ---

class Pet {
    constructor() {
        this.reset();
    }
    
    reset() {
        this.x = cw / 2;
        this.y = ch / 2;
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 100 + 50) * window.gameConfig.swarmSpeed;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = 3 + Math.random() * 3;
        this.timer = Math.random() * 2;
        this.color = window.gameConfig.primaryColor;
        this.phase = Math.random() * Math.PI * 2;
        this.tilt = Math.random() * Math.PI * 2;
    }

    update(dt) {
        this.vx += (Math.random() - 0.5) * 800 * dt;
        this.vy += (Math.random() - 0.5) * 800 * dt;
        
        const dx = (cw/2) - this.x;
        const dy = (ch/2) - this.y;
        this.vx += dx * 0.5 * dt;
        this.vy += dy * 0.5 * dt;

        this.vx *= 0.98;
        this.vy *= 0.98;

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        
        const m = 5;
        if (this.x < m) { this.x = m; this.vx *= -1; }
        if (this.x > cw - m) { this.x = cw - m; this.vx *= -1; }
        if (this.y < m) { this.y = m; this.vy *= -1; }
        if (this.y > ch - m) { this.y = ch - m; this.vy *= -1; }

        this.timer += dt;
        const rate = 4.0;
        if (this.timer > rate) {
            this.timer = 0;
            if (Math.random() > (treats.length / 400)) {
                spawnTreat(this.x, this.y);
            }
        }
    }
}

class Treat {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 60;
        this.vy = (Math.random() - 0.5) * 60;
        this.life = 8.0; 
        this.scale = 0;
        this.active = true;
    }

    update(dt) {
        if (!this.active) return;
        
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        
        if (this.x < 0 || this.x > cw) this.vx *= -1;
        if (this.y < 0 || this.y > ch) this.vy *= -1;
        
        if (this.scale < 1) this.scale += dt * 5;
        
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 150 + 50;
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.life = 0.8;
        this.color = color;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2.0;
    }
}

// --- Global Lists ---
let pets = [];
let treats = [];
let particles = [];
let currentCost = window.gameConfig.spawnCost;

// --- Core Logic ---

function initGame() {
    score = 0;
    pets = [];
    treats = [];
    particles = [];
    currentCost = window.gameConfig.spawnCost;
    shakeTime = 0;
    
    for(let i=0; i<5; i++) spawnPet(true);
    
    updateUI();
    
    const toast = document.getElementById('msg-toast');
    toast.style.opacity = '1';
    setTimeout(() => toast.style.opacity = '0', 5000);
}

function spawnPet(silent = false) {
    if (pets.length >= 1000) return;
    pets.push(new Pet());
    
    if (!silent) {
        const center = { x: cw/2, y: ch/2 };
        for(let i=0; i<8; i++) {
            particles.push(new Particle(center.x, center.y, window.gameConfig.primaryColor));
        }
        playSfx('sfx_spawn');
        flashGif('gif-spawn-panel', 1100);
        shakeTime = 0.2;
    }
}

function spawnTreat(x, y) {
    if (treats.length > 300) return;
    treats.push(new Treat(x, y));
}

function updateUI() {
    document.getElementById('score-display').textContent = Math.floor(score);
    document.getElementById('count-display').textContent = pets.length;
    
    const pct = Math.min(100, (pets.length / 1000) * 100);
    document.getElementById('swarm-progress').style.width = `${pct}%`;
    
    currentCost = Math.floor(window.gameConfig.spawnCost * (1 + (pets.length * 0.15)));
    
    document.getElementById('cost-display').textContent = currentCost;
    
    const btn = document.getElementById('spawn-btn');
    const canAfford = score >= currentCost && pets.length < 1000;
    
    if (canAfford) {
        btn.classList.remove('btn-disabled');
        btn.classList.add('can-afford');
    } else {
        btn.classList.add('btn-disabled');
        btn.classList.remove('can-afford');
    }
}

// --- Input Handling ---

function handleGlobalInput(e) {
    unlockAudio();
    
    const target = e.target;
    
    if (target.closest('#spawn-btn')) {
        if (score >= currentCost && pets.length < 1000) {
            score -= currentCost;
            spawnPet();
            playSfx('sfx_buy');
            vibrate('heavy');
            updateUI();
        } else if (blockedSfxCooldown <= 0) {
            playSfx('sfx_blocked', 0);
            blockedSfxCooldown = 0.2;
        }
        return;
    }
    
    handleGameInput(e);
}

function handleGameInput(e) {
    if (gameState !== STATE.PLAYING) return;
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const radius = 70; 
    let collected = 0;
    
    const baseValue = 10;
    const swarmBonus = Math.floor(pets.length / 20);
    const treatValue = baseValue + swarmBonus;
    
    for (let i = treats.length - 1; i >= 0; i--) {
        const t = treats[i];
        if (!t.active) continue;
        
        const dx = x - t.x;
        const dy = y - t.y;
        if (dx*dx + dy*dy < radius*radius) {
            t.active = false;
            score += treatValue;
            collected++;
            particles.push(new Particle(t.x, t.y, '#ff0055'));
        }
    }
    
    if (collected > 0) {
        if (collectSfxCooldown <= 0) {
            playSfx('sfx_collect', 0.04);
            collectSfxCooldown = 0.08;
        }
        flashGif('gif-collect-panel', 900);
        vibrate('light');
        comboCount = Math.min(comboCount + 1, 20);
        comboTimer = 0.5;
        updateUI();
    }
}

// --- Game Loop ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    blockedSfxCooldown = Math.max(0, blockedSfxCooldown - dt);
    collectSfxCooldown = Math.max(0, collectSfxCooldown - dt);

    if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) comboCount = 0;
    }
    
    if (shakeTime > 0) shakeTime -= dt;

    pets.forEach(p => p.update(dt));
    treats.forEach(t => t.update(dt));
    particles.forEach(p => p.update(dt));
    
    treats = treats.filter(t => t.active);
    particles = particles.filter(p => p.life > 0);

    draw();
    requestAnimationFrame(loop);
}

function draw() {
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
        const intensity = 15;
        sx = (Math.random() - 0.5) * intensity * shakeTime;
        sy = (Math.random() - 0.5) * intensity * shakeTime;
    }

    ctx.save();
    ctx.translate(sx, sy);

    ctx.fillStyle = '#050505';
    ctx.fillRect(-sx, -sy, cw, ch);
    
    ctx.strokeStyle = 'rgba(90, 115, 160, 0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const gridSize = 50;
    for(let x=0; x<cw; x+=gridSize) { ctx.moveTo(x,0); ctx.lineTo(x,ch); }
    for(let y=0; y<ch; y+=gridSize) { ctx.moveTo(0,y); ctx.lineTo(cw,y); }
    ctx.stroke();

    const coreGradient = ctx.createRadialGradient(cw / 2, ch / 2, 20, cw / 2, ch / 2, Math.max(cw, ch) * 0.45);
    coreGradient.addColorStop(0, 'rgba(120, 246, 255, 0.12)');
    coreGradient.addColorStop(0.45, 'rgba(157, 255, 143, 0.05)');
    coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = coreGradient;
    ctx.fillRect(0, 0, cw, ch);

    if (pets.length > 0) {
        const petColor = window.gameConfig.primaryColor;
        pets.forEach(p => {
            const bob = Math.sin((lastTime * 0.005) + p.phase) * 0.8;
            const angle = Math.atan2(p.vy, p.vx);
            const bodyW = p.size * 2.4;
            const bodyH = p.size * 1.25;

            if (pets.length < 300) {
                ctx.shadowColor = petColor;
                ctx.shadowBlur = 10;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.save();
            ctx.translate(p.x, p.y + bob);
            ctx.rotate(angle + p.tilt * 0.08);

            ctx.strokeStyle = 'rgba(120, 246, 255, 0.28)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, bodyW * 0.9, 0, Math.PI * 2);
            ctx.stroke();

            const bodyGradient = ctx.createLinearGradient(-bodyW, 0, bodyW, 0);
            bodyGradient.addColorStop(0, 'rgba(120, 246, 255, 0.55)');
            bodyGradient.addColorStop(0.5, petColor);
            bodyGradient.addColorStop(1, 'rgba(157, 255, 143, 0.9)');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.roundRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH, bodyH * 0.7);
            ctx.fill();

            ctx.fillStyle = 'rgba(120, 246, 255, 0.22)';
            ctx.beginPath();
            ctx.moveTo(-bodyW * 0.2, 0);
            ctx.lineTo(-bodyW * 1.1, -bodyH * 0.85);
            ctx.lineTo(-bodyW * 0.75, 0);
            ctx.lineTo(-bodyW * 1.1, bodyH * 0.85);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(bodyW * 0.2, 0);
            ctx.lineTo(bodyW * 1.1, -bodyH * 0.85);
            ctx.lineTo(bodyW * 0.75, 0);
            ctx.lineTo(bodyW * 1.1, bodyH * 0.85);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f5fbff';
            ctx.beginPath();
            ctx.arc(bodyW * 0.18, 0, Math.max(1.2, p.size * 0.35), 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        });
        ctx.shadowBlur = 0;
    }

    if (treats.length > 0) {
        if (treats.length < 100) {
            ctx.shadowColor = '#ff4ea2';
            ctx.shadowBlur = 10;
        }
        
        treats.forEach(t => {
            const s = 6 * t.scale;
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate((8 - t.life) * 0.8);
            ctx.fillStyle = '#ff4ea2';
            ctx.fillRect(-s/2, -s/2, s, s);
            ctx.strokeStyle = 'rgba(245, 251, 255, 0.65)';
            ctx.lineWidth = 1;
            ctx.strokeRect(-s/2, -s/2, s, s);
            ctx.restore();
        });
        ctx.shadowBlur = 0;
    }

    if (particles.length > 0) {
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }
    
    ctx.restore();
}

// --- Initialization ---

function resize() {
    const rect = canvas.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    dpr = window.devicePixelRatio || 1;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const ro = new ResizeObserver(() => {
    resize();
    if (!initialized) {
        initGame();
        initialized = true;
        requestAnimationFrame(loop);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
    
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', handleGameInput, { passive: false });
    
    // [agent-note][stage4] repaired: mobile tap path | element: body/canvas input | action: keep gesture suppression on gameplay surface only
    canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
});
</script>
