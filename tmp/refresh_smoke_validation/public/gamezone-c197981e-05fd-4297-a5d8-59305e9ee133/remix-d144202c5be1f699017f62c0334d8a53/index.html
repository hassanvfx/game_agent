<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Skyblock Salvage Mobile</title>
    <!-- [agent-note][stage4] resolved-font: title/ui -> catalogs/fonts.json (Audiowide + Exo 2) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #120f2f;
            --sky-mid: #3d2f86;
            --sky-bottom: #ff8f70;
            --panel-bg: rgba(14, 16, 34, 0.7);
            --panel-border: rgba(138, 232, 255, 0.42);
            --panel-shadow: rgba(10, 12, 30, 0.45);
            --hud-text: #f4fbff;
            --accent-cyan: #82efff;
            --accent-gold: #ffd76a;
            --accent-pink: #ff7dc4;
            --accent-lime: #95ff9a;
            --danger-red: #ff6b7c;
        }

        /* Core Reset & Mobile Fixes */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background:
                radial-gradient(circle at top, rgba(151, 247, 255, 0.18), transparent 32%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-bottom) 100%);
            touch-action: none; -webkit-user-select: none; user-select: none;
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--hud-text);
        }

        /* Minimal utility layer replacing previous Tailwind runtime dependency */
        *, *::before, *::after { box-sizing: border-box; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .pt-4 { padding-top: 1rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .space-y-2 > * + * { margin-top: 0.5rem; }
        .rounded { border-radius: 0.25rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.75rem; }
        .rounded-xl { border-radius: 1rem; }
        .rounded-2xl { border-radius: 1.25rem; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-xs { font-size: 0.65rem; line-height: 1.35; }
        .text-sm { font-size: 0.82rem; line-height: 1.45; }
        .text-lg { font-size: 1rem; line-height: 1.4; }
        .text-3xl { font-size: 1.4rem; line-height: 1.3; }
        .text-4xl { font-size: 1.7rem; line-height: 1.2; }
        .font-bold { font-weight: 700; }
        .text-white { color: #fff; }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-white\/70 { color: rgba(255,255,255,0.7); }
        .text-red-400 { color: #f87171; }
        .text-gray-900 { color: #111827; }
        .bg-black\/60 { background: rgba(0,0,0,0.6); }
        .bg-black\/80 { background: rgba(0,0,0,0.8); }
        .bg-black\/30 { background: rgba(0,0,0,0.3); }
        .bg-black\/20 { background: rgba(0,0,0,0.2); }
        .bg-green-600 { background: #16a34a; }
        .hover\:bg-green-500:hover { background: #22c55e; }
        .bg-white { background: #fff; }
        .active\:bg-gray-200:active { background: #e5e7eb; }
        .shadow-lg { box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
        .drop-shadow-md { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .transition { transition: transform 0.15s ease, background-color 0.15s ease, opacity 0.15s ease; }
        .transform { transform: translateZ(0); }
        .active\:scale-95:active { transform: scale(0.95); }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .z-50 { z-index: 50; }
        .max-w-xs { max-width: 20rem; }
        .safe-area-inset {
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
        }
        .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .backdrop-blur-md { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        button {
            border: 0;
            cursor: pointer;
            font: inherit;
        }

        /* Canvas */
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        /* UI Elements */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(29, 35, 68, 0.82), rgba(11, 13, 31, 0.82));
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 10px 30px var(--panel-shadow),
                inset 0 0 0 1px rgba(255,255,255,0.06);
        }

        .arcade-card {
            position: relative;
            overflow: hidden;
        }
        .arcade-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(130, 239, 255, 0.12), transparent 40%),
                radial-gradient(circle at top right, rgba(255, 125, 196, 0.18), transparent 35%);
            pointer-events: none;
        }

        .title-font { font-family: 'Audiowide', system-ui, sans-serif; letter-spacing: 0.04em; }
        .ui-font { font-family: 'Exo 2', system-ui, sans-serif; }
        .gif-overlay {
            position: absolute;
            right: 12px;
            bottom: 236px;
            width: min(28vw, 116px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(130, 239, 255, 0.32);
            box-shadow: 0 10px 28px rgba(8, 12, 28, 0.34);
            background: rgba(7, 9, 21, 0.72);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            z-index: 18;
        }
        .gif-overlay.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .gif-overlay img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .gif-caption {
            padding: 0.35rem 0.45rem;
            font-size: 0.58rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: center;
            color: var(--accent-cyan);
            background: rgba(9, 13, 29, 0.9);
        }
        .feedback-pill {
            position: absolute;
            left: 50%;
            top: 88px;
            transform: translate(-50%, -10px);
            min-width: 132px;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(8, 12, 27, 0.76);
            box-shadow: 0 10px 24px rgba(0,0,0,0.24);
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 16;
        }
        .feedback-pill.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        .hud-label {
            text-transform: uppercase;
            letter-spacing: 0.12em;
            text-shadow: 0 0 8px rgba(130, 239, 255, 0.35);
        }

        .btn-push {
            transition: transform 0.1s, background-color 0.15s, box-shadow 0.15s, filter 0.15s;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.25);
        }
        .btn-push:active {
            transform: scale(0.95);
            filter: brightness(1.08);
        }

        .primary-btn {
            background: linear-gradient(180deg, #67ff9c, #2cbc73);
            color: #102419;
            border: 1px solid rgba(255,255,255,0.5);
            text-shadow: none;
        }

        .status-chip {
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(8, 12, 27, 0.55);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        /* Hotbar */
        .hotbar-slot {
            width: 44px; height: 44px;
            border: 2px solid rgba(130,239,255,0.2);
            background: linear-gradient(180deg, rgba(12, 17, 37, 0.85), rgba(28, 24, 54, 0.75));
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        .hotbar-slot.active {
            border-color: var(--accent-gold);
            background: linear-gradient(180deg, rgba(65, 58, 20, 0.9), rgba(124, 90, 31, 0.78));
            transform: translateY(-2px) scale(1.06);
            box-shadow: 0 0 12px rgba(255, 215, 106, 0.25);
        }
        .block-preview {
            width: 24px; height: 24px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 6px;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.12);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            font-size: 0.66rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-cyan);
        }

        .pilot-avatar {
            width: 88px;
            height: 88px;
            margin: 0 auto 1rem;
            border-radius: 24px;
            border: 2px solid rgba(130,239,255,0.35);
            background:
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.9) 0 10%, transparent 11%),
                radial-gradient(circle at 35% 42%, #ffe1c4 0 8%, transparent 9%),
                radial-gradient(circle at 65% 42%, #ffe1c4 0 8%, transparent 9%),
                radial-gradient(circle at 50% 45%, #f7b489 0 20%, transparent 21%),
                linear-gradient(180deg, #ffb86f 0 20%, #ff8d6e 20% 24%, transparent 24%),
                linear-gradient(180deg, #6af0ff 24% 55%, #1bc6de 55% 72%, #283f98 72% 100%);
            box-shadow:
                0 12px 24px rgba(0,0,0,0.28),
                0 0 20px rgba(106, 240, 255, 0.22);
            position: relative;
        }
        .pilot-avatar::before,
        .pilot-avatar::after {
            content: "";
            position: absolute;
            top: 34px;
            width: 8px;
            height: 8px;
            background: #12204b;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
        }
        .pilot-avatar::before { left: 26px; }
        .pilot-avatar::after { right: 26px; }

        /* Virtual Controls */
        #joystick-zone {
            position: absolute; bottom: 0; left: 0; width: 50%; height: 40%;
            z-index: 10; touch-action: none;
        }
        #jump-btn {
            position: absolute; bottom: 40px; right: 30px;
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.32), rgba(94, 174, 255, 0.18) 55%, rgba(14, 18, 42, 0.86) 100%);
            border: 2px solid rgba(130, 239, 255, 0.55);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 700; color: white;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 22px rgba(130,239,255,0.2);
            z-index: 20;
            touch-action: none;
        }
        #jump-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }

        /* Mode Toggle */
        #mode-toggle {
            position: absolute; bottom: 140px; right: 30px;
            width: 60px; height: 60px;
            background: linear-gradient(180deg, rgba(30, 33, 67, 0.9), rgba(8, 11, 27, 0.88));
            border: 2px solid rgba(255, 255, 255, 0.26);
            border-radius: 50%;
            z-index: 20;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px;
            box-shadow: 0 0 18px rgba(0,0,0,0.22);
        }
        #mode-toggle.mode-mine { background: linear-gradient(180deg, rgba(245, 87, 111, 0.88), rgba(148, 25, 45, 0.92)); border-color: rgba(255, 210, 216, 0.82); }
        #mode-toggle.mode-place { background: linear-gradient(180deg, rgba(103, 255, 156, 0.88), rgba(31, 132, 78, 0.94)); border-color: rgba(225, 255, 235, 0.78); }

        /* Joystick Visuals */
        .joystick-base {
            position: absolute; width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none; display: none;
        }
        .joystick-stick {
            position: absolute; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <!-- Dynamic Joystick Visuals -->
        <div id="joystick-visual" class="joystick-base">
            <div id="joystick-stick" class="joystick-stick"></div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between safe-area-inset">
            
            <!-- Top Bar -->
            <div id="top-bar" class="hidden pointer-events-auto w-full p-2 flex flex-col items-center gap-2 pt-4">
                <!-- Hotbar -->
                <div id="hotbar" class="flex gap-2 p-2 glass-panel arcade-card rounded-xl">
                    <div class="hotbar-slot active" data-id="1"><div class="block-preview" style="background:#5d4037"></div></div> <!-- Dirt -->
                    <div class="hotbar-slot" data-id="2"><div class="block-preview" style="background:#388e3c"></div></div> <!-- Grass -->
                    <div class="hotbar-slot" data-id="3"><div class="block-preview" style="background:#757575"></div></div> <!-- Stone -->
                    <div class="hotbar-slot" data-id="4"><div class="block-preview" style="background:#8d6e63"></div></div> <!-- Wood -->
                    <div class="hotbar-slot" data-id="5"><div class="block-preview" style="background:#b71c1c"></div></div> <!-- Brick -->
                </div>
                
                <div class="flex justify-between w-full px-4">
                     <button id="sound-btn" class="glass-panel status-chip w-10 h-10 rounded-full text-white flex items-center justify-center text-xs font-bold">♫</button>
                     <div class="text-white text-xs font-bold drop-shadow-md status-chip px-2 py-1 rounded hud-label">Pilot HUD</div>
                </div>
            </div>

            <!-- Controls (Bottom) -->
            <div id="controls-layer" class="hidden absolute inset-0 pointer-events-none">
                <!-- [agent-note][stage3] resolved-gif: mining/place-fail + game-over overlays -> catalogs/gifs.json -->
                <div id="action-gif" class="gif-overlay" aria-hidden="true">
                    <img id="action-gif-img" src="https://i.giphy.com/4IyIArvjvj5YJrcAch.webp" alt="salvage action feedback">
                    <div id="action-gif-caption" class="gif-caption title-font">MINING BEAM</div>
                </div>
                <div id="feedback-pill" class="feedback-pill title-font" aria-live="polite">SYSTEM READY</div>
                <!-- Left Touch Zone for Joystick -->
                <div id="joystick-zone" class="pointer-events-auto"></div>
                
                <!-- Action Buttons -->
                <button id="mode-toggle" class="pointer-events-auto mode-mine btn-push">
                    ⛏️
                </button>
                <button id="jump-btn" class="pointer-events-auto btn-push">
                    JUMP
                </button>
            </div>

            <!-- Screens -->
            <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-black/60 pointer-events-auto z-50 backdrop-blur-sm">
                <div class="glass-panel arcade-card p-8 rounded-2xl text-center max-w-xs mx-4">
                    <div class="hero-badge mb-2"><span>☁️</span><span>salvage pilot online</span></div>
                    <div class="pilot-avatar" aria-hidden="true"></div>
                    <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-md title-font">SKYBLOCK SALVAGE</h1>
                    <p class="text-white/80 text-sm mb-6">Neon sky-island recovery run</p>
                    <div class="text-left text-white/70 text-xs mb-6 space-y-2 status-chip p-4 rounded-lg">
                        <p>🕹️ <b>Left Side:</b> Drag to move along the ruins</p>
                        <p>⬆️ <b>Jump Ring:</b> Leap over broken skybridges</p>
                        <p>⛏️ <b>Tap World:</b> Cut debris or rebuild the route</p>
                    </div>
                    <button id="start-btn" class="w-full primary-btn font-bold py-4 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                        DEPLOY
                    </button>
                </div>
            </div>

            <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/80 pointer-events-auto z-50 backdrop-blur-md">
                <div class="absolute right-4 bottom-6 w-24 rounded-xl overflow-hidden border border-white/20 opacity-85">
                    <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="defeat reaction gif" style="display:block;width:100%;aspect-ratio:1/1;object-fit:cover;">
                </div>
                <div class="glass-panel arcade-card p-8 rounded-2xl text-center mx-4">
                    <h2 class="text-3xl font-bold text-red-400 mb-2 title-font">RUN LOST!</h2>
                    <p class="text-white/70 mb-6">The salvage diver missed the platform.</p>
                    <button id="restart-btn" class="bg-white text-gray-900 font-bold py-3 px-8 rounded-full shadow-lg active:bg-gray-200 transition">REDEPLOY</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    /** 
     * BLOCK WORLD MOBILE
     * Single-file HTML5 Game
     */

    document.addEventListener('DOMContentLoaded', () => {
        
        // --- CONFIGURATION ---
        const CONFIG = {
            tileSize: 32,
            worldW: 128,
            worldH: 64,
            gravity: 0.6,
            friction: 0.8,
            speed: 0.6,
            jumpForce: -11,
            reach: 5 * 32 // 5 blocks reach
        };

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                mine: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                place: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            gifs: {
                action: {
                    src: "https://i.giphy.com/4IyIArvjvj5YJrcAch.webp",
                    label: "MINING BEAM"
                },
                blocked: {
                    src: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp",
                    label: "OUT OF REACH"
                }
            }
        };

        const BLOCK = { AIR: 0, DIRT: 1, GRASS: 2, STONE: 3, WOOD: 4, BRICK: 5, BEDROCK: 99 };
        const COLORS = {
            [BLOCK.DIRT]: '#7a4d4d',
            [BLOCK.GRASS]: '#53c975',
            [BLOCK.STONE]: '#6b76bf',
            [BLOCK.WOOD]: '#b77a58',
            [BLOCK.BRICK]: '#ff6e8b',
            [BLOCK.BEDROCK]: '#17172a'
        };

        // --- AUDIO SYSTEM ---
        const audio = {
            bgm: new Audio(ASSETS.bgm),
            enabled: true,
            pools: {},
            lastPlay: {},
            init() {
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                Object.entries(ASSETS.sfx).forEach(([name, url]) => {
                    const clip = new Audio(url);
                    clip.preload = 'auto';
                    clip.volume = this.getVolume(name);
                    this.pools[name] = clip;
                });
            },
            getVolume(name) {
                return {
                    mine: 0.42,
                    place: 0.35,
                    jump: 0.4,
                    land: 0.32,
                    blocked: 0.34,
                    ui: 0.3,
                    start: 0.38,
                    gameOver: 0.45
                }[name] ?? 0.4;
            },
            playBGM() {
                if(this.enabled) this.bgm.play().catch(()=>{});
            },
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            },
            playSFX(name, minGap = 80) {
                if(!this.enabled || !this.pools[name]) return;
                const now = performance.now();
                if(this.lastPlay[name] && now - this.lastPlay[name] < minGap) return;
                this.lastPlay[name] = now;
                try {
                    const s = this.pools[name].cloneNode();
                    s.volume = this.getVolume(name);
                    s.play().catch(()=>{});
                } catch(_) {}
            },
            toggle() {
                this.enabled = !this.enabled;
                if(this.enabled) this.playBGM(); else this.bgm.pause();
                return this.enabled;
            }
        };
        audio.init();

        // --- GAME STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            active: false,
            width: 0, height: 0,
            camera: { x: 0, y: 0 },
            world: [],
            player: {
                x: 0, y: 0, w: 20, h: 56,
                vx: 0, vy: 0, grounded: false,
                facingRight: true, animFrame: 0
            },
            input: {
                x: 0, // -1 to 1 (Joystick)
                jump: false,
                interacting: false,
                interactX: 0, interactY: 0,
                interactTimer: 0
            },
            mode: 'MINE', // 'MINE' or 'PLACE'
            selectedBlock: BLOCK.DIRT,
            time: 0,
            prevGrounded: false,
            uiMessageTimer: 0,
            gifTimer: 0
        };

        // --- INPUT HANDLING (TOUCH) ---
        const joystick = {
            active: false,
            originX: 0, originY: 0,
            currX: 0, currY: 0,
            id: null
        };

        const els = {
            joyZone: document.getElementById('joystick-zone'),
            joyVisual: document.getElementById('joystick-visual'),
            joyStick: document.getElementById('joystick-stick'),
            jumpBtn: document.getElementById('jump-btn'),
            modeBtn: document.getElementById('mode-toggle'),
            hotbar: document.querySelectorAll('.hotbar-slot'),
            actionGif: document.getElementById('action-gif'),
            actionGifImg: document.getElementById('action-gif-img'),
            actionGifCaption: document.getElementById('action-gif-caption'),
            feedbackPill: document.getElementById('feedback-pill')
        };

        function showFeedback(message, accent = 'var(--accent-cyan)') {
            els.feedbackPill.textContent = message;
            els.feedbackPill.style.color = accent;
            els.feedbackPill.classList.add('visible');
            state.uiMessageTimer = 70;
        }

        function showActionGif(key = 'action') {
            const gif = ASSETS.gifs[key] || ASSETS.gifs.action;
            els.actionGifImg.src = gif.src;
            els.actionGifCaption.textContent = gif.label;
            els.actionGif.classList.add('visible');
            state.gifTimer = 55;
        }

        // Joystick Logic
        els.joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystick.id = touch.identifier;
            joystick.active = true;
            joystick.originX = touch.clientX;
            joystick.originY = touch.clientY;
            joystick.currX = touch.clientX;
            joystick.currY = touch.clientY;
            
            // Show Visual
            els.joyVisual.style.display = 'block';
            els.joyVisual.style.left = (joystick.originX - 50) + 'px';
            els.joyVisual.style.top = (joystick.originY - 50) + 'px';
            els.joyStick.style.transform = `translate(-50%, -50%)`;
        }, {passive: false});

        els.joyZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(!joystick.active) return;
            
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joystick.id) {
                    const t = e.changedTouches[i];
                    const dx = t.clientX - joystick.originX;
                    const dy = t.clientY - joystick.originY;
                    const dist = Math.min(50, Math.sqrt(dx*dx + dy*dy));
                    const angle = Math.atan2(dy, dx);
                    
                    const moveX = Math.cos(angle) * dist;
                    const moveY = Math.sin(angle) * dist;
                    
                    els.joyStick.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
                    
                    // Update Input State
                    state.input.x = moveX / 50; // Normalize -1 to 1
                }
            }
        }, {passive: false});

        const endJoystick = (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joystick.id) {
                    joystick.active = false;
                    joystick.id = null;
                    els.joyVisual.style.display = 'none';
                    state.input.x = 0;
                }
            }
        };
        els.joyZone.addEventListener('touchend', endJoystick);
        els.joyZone.addEventListener('touchcancel', endJoystick);

        // Jump Button
        els.jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            state.input.jump = true;
            if(state.active && state.player.grounded) {
                audio.playSFX('jump', 120);
                showFeedback('BOOST JUMP', 'var(--accent-gold)');
            }
        }, {passive: false});
        els.jumpBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            state.input.jump = false;
        });

        // Mode Toggle
        els.modeBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // prevent zoom
            state.mode = state.mode === 'MINE' ? 'PLACE' : 'MINE';
            els.modeBtn.innerHTML = state.mode === 'MINE' ? '⛏️' : '🧱';
            els.modeBtn.className = `pointer-events-auto btn-push ${state.mode === 'MINE' ? 'mode-mine' : 'mode-place'}`;
            audio.playSFX('ui', 100);
            showFeedback(state.mode === 'MINE' ? 'CUTTER MODE' : 'BUILD MODE', state.mode === 'MINE' ? 'var(--danger-red)' : 'var(--accent-lime)');
        });

        // World Interaction (Touch anywhere else)
        canvas.addEventListener('touchstart', (e) => {
            if(!state.active) return;
            // Only consider first touch that isn't on controls (already handled by z-index/propagation usually, but let's be safe)
            // Actually canvas is behind controls.
            const t = e.changedTouches[0];
            state.input.interacting = true;
            state.input.interactX = t.clientX;
            state.input.interactY = t.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if(!state.active || !state.input.interacting) return;
            const t = e.changedTouches[0];
            state.input.interactX = t.clientX;
            state.input.interactY = t.clientY;
        });

        const endInteract = () => {
            state.input.interacting = false;
            state.input.interactTimer = 0;
        };
        canvas.addEventListener('touchend', endInteract);
        canvas.addEventListener('touchcancel', endInteract);

        // Hotbar UI
        els.hotbar.forEach(slot => {
            slot.addEventListener('click', (e) => {
                els.hotbar.forEach(s => s.classList.remove('active'));
                slot.classList.add('active');
                state.selectedBlock = parseInt(slot.dataset.id);
                // Switch to place mode automatically if selecting a block
                state.mode = 'PLACE';
                els.modeBtn.innerHTML = '🧱';
                els.modeBtn.className = 'pointer-events-auto btn-push mode-place';
                audio.playSFX('ui', 100);
                showFeedback(`BLOCK ${slot.dataset.id} READY`, 'var(--accent-lime)');
            });
        });

        document.getElementById('sound-btn').addEventListener('click', (e) => {
            const on = audio.toggle();
            e.target.innerText = on ? '♫' : '✕';
            e.target.style.opacity = on ? '1' : '0.5';
            if(on) {
                audio.playSFX('ui', 80);
                showFeedback('AUDIO ONLINE', 'var(--accent-cyan)');
            } else {
                showFeedback('AUDIO MUTED', 'var(--danger-red)');
            }
        });

        // --- GAME LOGIC ---

        function initGame() {
            // Generate World
            state.world = new Array(CONFIG.worldW * CONFIG.worldH).fill(BLOCK.AIR);
            for(let x=0; x<CONFIG.worldW; x++) {
                // Terrain Height
                let h = Math.floor(CONFIG.worldH/2 + Math.sin(x*0.1)*6 + Math.cos(x*0.05)*4);
                for(let y=0; y<CONFIG.worldH; y++) {
                    let idx = y * CONFIG.worldW + x;
                    if(y > h) {
                        state.world[idx] = (y > h+4 && Math.random()>0.9) ? BLOCK.STONE : BLOCK.DIRT;
                    } else if(y === h) {
                        state.world[idx] = BLOCK.GRASS;
                        // Trees
                        if(x > 5 && x < CONFIG.worldW-5 && Math.random() < 0.08) generateTree(x, y-1);
                    } else if(y >= CONFIG.worldH-1) {
                        state.world[idx] = BLOCK.BEDROCK;
                    }
                }
            }
            
            // Reset Player
            state.player.x = (CONFIG.worldW/2) * CONFIG.tileSize;
            state.player.y = 0;
            state.player.vx = 0; state.player.vy = 0;
            
            // Find ground
            let px = Math.floor(state.player.x / CONFIG.tileSize);
            for(let y=0; y<CONFIG.worldH; y++) {
                if(getBlock(px, y) !== BLOCK.AIR) {
                    state.player.y = (y-3) * CONFIG.tileSize;
                    break;
                }
            }

            state.active = true;
            loop();
        }

        function generateTree(x, y) {
            let h = 3 + Math.floor(Math.random()*3);
            for(let i=0; i<h; i++) setBlock(x, y-i, BLOCK.WOOD);
            for(let lx=x-2; lx<=x+2; lx++) {
                for(let ly=y-h-1; ly<=y-h+1; ly++) {
                    if(Math.abs(lx-x)===2 && Math.abs(ly-(y-h))===1) continue;
                    if(getBlock(lx, ly) === BLOCK.AIR) setBlock(lx, ly, BLOCK.GRASS); // Leaves
                }
            }
        }

        function getBlock(x, y) {
            if(x<0 || x>=CONFIG.worldW || y<0 || y>=CONFIG.worldH) return BLOCK.AIR;
            return state.world[y*CONFIG.worldW + x];
        }
        function setBlock(x, y, id) {
            if(x<0 || x>=CONFIG.worldW || y<0 || y>=CONFIG.worldH) return;
            state.world[y*CONFIG.worldW + x] = id;
        }

        function checkCollision(rect) {
            let startX = Math.floor(rect.x / CONFIG.tileSize);
            let endX = Math.floor((rect.x + rect.w - 0.1) / CONFIG.tileSize);
            let startY = Math.floor(rect.y / CONFIG.tileSize);
            let endY = Math.floor((rect.y + rect.h - 0.1) / CONFIG.tileSize);

            for(let y=startY; y<=endY; y++) {
                for(let x=startX; x<=endX; x++) {
                    if(getBlock(x, y) !== BLOCK.AIR) return true;
                }
            }
            return false;
        }

        function update() {
            state.time++;
            const p = state.player;

            // Horizontal Movement
            if(Math.abs(state.input.x) > 0.1) {
                p.vx += state.input.x * CONFIG.speed;
                p.facingRight = state.input.x > 0;
            }
            p.vx *= CONFIG.friction;

            // X Collision
            if(!checkCollision({x: p.x + p.vx, y: p.y, w: p.w, h: p.h})) {
                p.x += p.vx;
            } else {
                p.vx = 0;
            }

            // Gravity & Jump
            p.vy += CONFIG.gravity;
            if(state.input.jump && p.grounded) {
                p.vy = CONFIG.jumpForce;
                p.grounded = false;
            }

            // Y Collision
            p.grounded = false;
            if(!checkCollision({x: p.x, y: p.y + p.vy, w: p.w, h: p.h})) {
                p.y += p.vy;
            } else {
                if(p.vy > 0) p.grounded = true;
                p.vy = 0;
                p.y = Math.round(p.y);
            }

            if(!state.prevGrounded && p.grounded) {
                audio.playSFX('land', 140);
            }
            state.prevGrounded = p.grounded;

            if(state.uiMessageTimer > 0) {
                state.uiMessageTimer--;
                if(state.uiMessageTimer === 0) els.feedbackPill.classList.remove('visible');
            }

            if(state.gifTimer > 0) {
                state.gifTimer--;
                if(state.gifTimer === 0) els.actionGif.classList.remove('visible');
            }

            // Death
            if(p.y > CONFIG.worldH * CONFIG.tileSize + 200) {
                gameOver();
            }

            // Camera Follow
            // Look ahead slightly based on facing
            let lookAhead = p.facingRight ? 50 : -50;
            let targetX = p.x + p.w/2 - state.width/2 + lookAhead;
            let targetY = p.y + p.h/2 - state.height/2;
            
            // Smooth lerp
            state.camera.x += (targetX - state.camera.x) * 0.1;
            state.camera.y += (targetY - state.camera.y) * 0.1;

            // Clamp Camera
            state.camera.x = Math.max(0, Math.min(state.camera.x, CONFIG.worldW*CONFIG.tileSize - state.width));
            state.camera.y = Math.max(-200, Math.min(state.camera.y, CONFIG.worldH*CONFIG.tileSize - state.height));

            // Interaction
            if(state.input.interacting) {
                handleInteraction();
            }
        }

        function handleInteraction() {
            // Convert screen touch to world coord
            let wx = state.input.interactX + state.camera.x;
            let wy = state.input.interactY + state.camera.y;
            
            let tx = Math.floor(wx / CONFIG.tileSize);
            let ty = Math.floor(wy / CONFIG.tileSize);
            
            // Range Check
            let px = state.player.x + state.player.w/2;
            let py = state.player.y + state.player.h/2;
            let dist = Math.sqrt(Math.pow((tx*CONFIG.tileSize + CONFIG.tileSize/2) - px, 2) + Math.pow((ty*CONFIG.tileSize + CONFIG.tileSize/2) - py, 2));
            
            if(dist > CONFIG.reach) {
                if(state.input.interactTimer === 0) {
                    audio.playSFX('blocked', 180);
                    showFeedback('OUT OF RANGE', 'var(--danger-red)');
                    showActionGif('blocked');
                }
                state.input.interactTimer = 1;
                return;
            }

            // Player bounds for placing check
            let pRect = { l: Math.floor(state.player.x/CONFIG.tileSize), r: Math.floor((state.player.x+state.player.w)/CONFIG.tileSize), t: Math.floor(state.player.y/CONFIG.tileSize), b: Math.floor((state.player.y+state.player.h)/CONFIG.tileSize) };
            let isPlayerSpace = (tx >= pRect.l && tx <= pRect.r && ty >= pRect.t && ty <= pRect.b);

            state.input.interactTimer++;

            // Visual feedback handled in draw, Logic here
            if(state.mode === 'MINE') {
                let blk = getBlock(tx, ty);
                if(blk !== BLOCK.AIR && blk !== BLOCK.BEDROCK) {
                    if(state.input.interactTimer > 20) { // 20 frames to mine
                        setBlock(tx, ty, BLOCK.AIR);
                        audio.playSFX('mine', 120);
                        state.input.interactTimer = 0;
                        createParticles(tx, ty, COLORS[blk]);
                        showFeedback('SALVAGE CLEARED', 'var(--accent-gold)');
                        showActionGif('action');
                    }
                }
            } else {
                // Place
                if(getBlock(tx, ty) === BLOCK.AIR && !isPlayerSpace) {
                    if(state.input.interactTimer > 5) { // slight delay to prevent accidental
                        setBlock(tx, ty, state.selectedBlock);
                        audio.playSFX('place', 110);
                        state.input.interactTimer = 0;
                        showFeedback('BRIDGE PATCHED', 'var(--accent-lime)');
                    }
                }
            }
        }

        let particles = [];
        function createParticles(tx, ty, color) {
            for(let i=0; i<5; i++) {
                particles.push({
                    x: tx * CONFIG.tileSize + CONFIG.tileSize/2,
                    y: ty * CONFIG.tileSize + CONFIG.tileSize/2,
                    vx: (Math.random()-0.5)*4,
                    vy: (Math.random()-0.5)*4,
                    life: 30,
                    color: color
                });
            }
        }

        // --- RENDER ---
        function draw() {
            // Resize if needed
            if(canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                state.width = window.innerWidth;
                state.height = window.innerHeight;
                canvas.width = state.width;
                canvas.height = state.height;
                ctx.imageSmoothingEnabled = false;
            }

            // Sky
            let grad = ctx.createLinearGradient(0, 0, 0, state.height);
            grad.addColorStop(0, "#120f2f");
            grad.addColorStop(0.55, "#4b3aa0");
            grad.addColorStop(1, "#ff9c72");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, state.width, state.height);

            // Parallax Clouds + signal lights
            ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
            let cloudOff = (Date.now() * 0.005) % state.width;
            for(let i=0; i<4; i++) {
                let cx = (i * 300 + cloudOff) % (state.width + 200) - 100;
                let cy = 50 + i*40;
                ctx.beginPath();
                ctx.arc(cx, cy, 30, 0, Math.PI*2);
                ctx.arc(cx+25, cy-10, 35, 0, Math.PI*2);
                ctx.arc(cx+50, cy, 30, 0, Math.PI*2);
                ctx.fill();

                ctx.fillStyle = i % 2 === 0 ? "rgba(130, 239, 255, 0.13)" : "rgba(255, 125, 196, 0.12)";
                ctx.fillRect(cx - 14, cy + 60, 6, 32);
                ctx.fillRect(cx + 56, cy + 75, 5, 24);
                ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
            }

            // World
            let startCol = Math.floor(state.camera.x / CONFIG.tileSize);
            let endCol = startCol + (state.width / CONFIG.tileSize) + 1;
            let startRow = Math.floor(state.camera.y / CONFIG.tileSize);
            let endRow = startRow + (state.height / CONFIG.tileSize) + 1;

            for(let y=Math.max(0, startRow); y<Math.min(CONFIG.worldH, endRow); y++) {
                for(let x=Math.max(0, startCol); x<Math.min(CONFIG.worldW, endCol); x++) {
                    let blk = getBlock(x, y);
                    if(blk !== BLOCK.AIR) {
                        let sx = Math.floor(x * CONFIG.tileSize - state.camera.x);
                        let sy = Math.floor(y * CONFIG.tileSize - state.camera.y);
                        
                        ctx.fillStyle = COLORS[blk];
                        ctx.fillRect(sx, sy, CONFIG.tileSize, CONFIG.tileSize);

                        // Block detail (bevel + scan glow)
                        ctx.fillStyle = "rgba(0,0,0,0.14)";
                        ctx.fillRect(sx, sy+CONFIG.tileSize-4, CONFIG.tileSize, 4);
                        ctx.fillRect(sx+CONFIG.tileSize-4, sy, 4, CONFIG.tileSize);
                        ctx.fillStyle = "rgba(255,255,255,0.12)";
                        ctx.fillRect(sx, sy, CONFIG.tileSize, 4);
                        ctx.fillRect(sx, sy, 4, CONFIG.tileSize);
                        ctx.fillStyle = "rgba(255,255,255,0.05)";
                        ctx.fillRect(sx + 6, sy + 6, CONFIG.tileSize - 12, 3);
                    }
                }
            }

            // Player
            let px = Math.floor(state.player.x - state.camera.x);
            let py = Math.floor(state.player.y - state.camera.y);
            
            // Draw Player Body - polished salvage pilot silhouette
            const armOff = Math.sin(state.time * 0.5) * (Math.abs(state.player.vx) > 0.1 ? 4 : 0);
            ctx.fillStyle = "rgba(130, 239, 255, 0.16)";
            ctx.fillRect(px - 4, py - 4, 28, 64);

            ctx.fillStyle = "#0d183f"; // visor trim
            ctx.fillRect(px+3, py, 14, 14);
            ctx.fillStyle = "#ffd3ad"; // Head
            ctx.fillRect(px+4, py+1, 12, 12);
            ctx.fillStyle = "#ff9c72"; // Hair/helmet stripe
            ctx.fillRect(px+4, py, 12, 4);
            ctx.fillStyle = "#f6fcff"; // visor glint
            ctx.fillRect(px+6, py+4, 8, 3);

            ctx.fillStyle = "#1bd0e3"; // Jacket
            ctx.fillRect(px+2, py+12, 16, 20);
            ctx.fillStyle = "#0f7d94"; // Jacket shadow
            ctx.fillRect(px+2, py+24, 16, 8);
            ctx.fillStyle = "#ffd76a"; // utility band
            ctx.fillRect(px+3, py+20, 14, 3);

            ctx.fillStyle = "#2f4aba"; // Pants
            ctx.fillRect(px+4, py+32, 5, 24);
            ctx.fillRect(px+11, py+32, 5, 24);
            ctx.fillStyle = "#10162f"; // boots
            ctx.fillRect(px+4, py+52, 5, 4);
            ctx.fillRect(px+11, py+52, 5, 4);

            // Arms (Swing based on vx)
            ctx.fillStyle = "#ffd3ad";
            if(state.player.facingRight) {
                ctx.fillRect(px+10+armOff, py+13, 6, 16);
                ctx.fillStyle = "#82efff";
                ctx.fillRect(px+11+armOff, py+15, 4, 8);
            } else {
                ctx.fillRect(px+4+armOff, py+13, 6, 16);
                ctx.fillStyle = "#82efff";
                ctx.fillRect(px+5+armOff, py+15, 4, 8);
            }

            ctx.fillStyle = "rgba(255,255,255,0.12)";
            ctx.fillRect(px+2, py+12, 3, 12);

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - state.camera.x, p.y - state.camera.y, 4, 4);
            }

            // Interaction Highlight / Reticle
            if(state.input.interacting) {
                let wx = state.input.interactX + state.camera.x;
                let wy = state.input.interactY + state.camera.y;
                let tx = Math.floor(wx / CONFIG.tileSize);
                let ty = Math.floor(wy / CONFIG.tileSize);
                
                let sx = tx * CONFIG.tileSize - state.camera.x;
                let sy = ty * CONFIG.tileSize - state.camera.y;

                // Range check for color
                let px = state.player.x + state.player.w/2;
                let py = state.player.y + state.player.h/2;
                let dist = Math.sqrt(Math.pow((tx*CONFIG.tileSize + CONFIG.tileSize/2) - px, 2) + Math.pow((ty*CONFIG.tileSize + CONFIG.tileSize/2) - py, 2));

                if(dist <= CONFIG.reach) {
                    ctx.strokeStyle = state.mode === 'MINE' ? "#ff6b7c" : "#95ff9a";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx, sy, CONFIG.tileSize, CONFIG.tileSize);

                    // Mining Progress
                    if(state.mode === 'MINE' && state.input.interactTimer > 0) {
                        let progress = state.input.interactTimer / 20;
                        ctx.fillStyle = "rgba(0,0,0,0.3)";
                        ctx.fillRect(sx + CONFIG.tileSize/2 - (CONFIG.tileSize*progress)/2, sy + CONFIG.tileSize/2 - (CONFIG.tileSize*progress)/2, CONFIG.tileSize*progress, CONFIG.tileSize*progress);
                    }
                }
            }
        }

        function loop() {
            if(!state.active) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            state.active = false;
            audio.stopBGM();
            audio.playSFX('gameOver', 0);
            showFeedback('RUN LOST', 'var(--danger-red)');
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('controls-layer').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // --- UI BINDINGS ---
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('controls-layer').classList.remove('hidden');
            audio.playSFX('start', 0);
            audio.playBGM();
            showFeedback('SALVAGE RUN LIVE', 'var(--accent-cyan)');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('controls-layer').classList.remove('hidden');
            audio.playSFX('start', 0);
            audio.playBGM();
            showFeedback('REDEPLOYED', 'var(--accent-cyan)');
            initGame();
        });

        // Initial resize
        window.addEventListener('resize', () => {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;
        });

    });
    </script>
</body>
</html>
