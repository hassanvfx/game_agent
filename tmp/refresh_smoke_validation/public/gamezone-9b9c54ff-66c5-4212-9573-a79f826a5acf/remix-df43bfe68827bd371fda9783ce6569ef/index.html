<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Arcade Track Rivals</title>
    <!-- [agent-note][stage4] remapped-font: title -> Orbitron, ui/body -> Exo 2 from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-dark: #070b18;
            --bg-grid: rgba(110, 198, 255, 0.08);
            --panel-bg: linear-gradient(180deg, rgba(12, 24, 54, 0.82), rgba(9, 15, 33, 0.92));
            --panel-border: rgba(130, 219, 255, 0.3);
            --text-main: #f4fbff;
            --text-muted: rgba(223, 242, 255, 0.78);
            --cyan-300: #79e8ff;
            --cyan-500: #18c6ff;
            --blue-500: #2979ff;
            --indigo-600: #4b3bff;
            --yellow-400: #ffd95e;
            --red-500: #ff5d73;
            --green-500: #57e39b;
            --amber-400: #ffbf47;
            --blue-600: #4f7dff;
            --gray-200: #e5f3ff;
            --gray-300: #c9dceb;
            --gray-900: #101827;
            --black-60: rgba(2, 6, 16, 0.68);
            --black-80: rgba(1, 4, 14, 0.82);
            --track-outline: rgba(141, 219, 255, 0.28);
            --glow-soft: 0 0 20px rgba(24, 198, 255, 0.2);
            --glow-strong: 0 0 28px rgba(24, 198, 255, 0.34);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(41, 121, 255, 0.24), transparent 38%),
                radial-gradient(circle at bottom, rgba(24, 198, 255, 0.14), transparent 30%),
                linear-gradient(180deg, #0a1021 0%, #050814 100%);
            background-color: var(--bg-dark);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }

        .title-font {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .ui-copy {
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.05em;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-overlay {
            position: absolute;
            inset: 0;
        }

        .ui-layer {
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: auto;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--glow-soft), 0 14px 36px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 36%, transparent 64%, rgba(121, 232, 255, 0.08));
            pointer-events: none;
        }

        .turn-panel {
            padding: 0.9rem 1.2rem 0.7rem;
            border-radius: 1rem;
            color: var(--text-main);
            min-width: 11rem;
        }

        .hud-label {
            font-size: 0.72rem;
            opacity: 0.76;
            letter-spacing: 0.18em;
            color: var(--cyan-300);
        }

        .turn-indicator {
            font-size: 1.24rem;
            font-weight: 700;
            text-shadow: 0 0 16px currentColor;
        }

        .controls-wrap {
            position: absolute;
            left: 50%;
            bottom: 2.5rem;
            transform: translateX(-50%);
            pointer-events: auto;
        }

        .roll-btn {
            width: 6rem;
            height: 6rem;
            border-radius: 1.15rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .roll-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            filter: brightness(1.08);
        }

        .roll-btn:active {
            transform: scale(0.95);
        }

        .roll-caption {
            font-size: 0.68rem;
            margin-bottom: 0.25rem;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(223, 242, 255, 0.84);
            letter-spacing: 0.18em;
        }

        .dice-display {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(121, 232, 255, 0.4));
        }

        .center-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .start-screen {
            background: var(--black-60);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .game-over-screen {
            background: var(--black-80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .start-card {
            padding: 1.85rem;
            border-radius: 1.5rem;
            text-align: center;
            max-width: 24rem;
            margin: 0 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-top: 4px solid var(--cyan-500);
            box-shadow: var(--glow-strong), 0 20px 40px rgba(0, 0, 0, 0.44);
        }

        .start-card:hover {
            transform: scale(1.05);
        }

        .game-title {
            margin: 0 0 0.65rem;
            font-size: clamp(2.55rem, 7vw, 4rem);
            line-height: 0.95;
            color: var(--text-main);
            text-shadow: 0 0 18px rgba(24, 198, 255, 0.28), 0 3px 10px rgba(0, 0, 0, 0.78);
        }

        .game-subtitle {
            display: inline-block;
            color: var(--cyan-300);
            font-size: 0.48em;
            letter-spacing: 0.22em;
            margin-top: 0.35rem;
        }

        .tagline {
            color: var(--gray-200);
            font-size: 1rem;
            margin: 0 0 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .instruction-copy {
            color: var(--text-muted);
            font-size: 0.94rem;
            margin: 0 0 1.35rem;
            line-height: 1.45;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
            margin: 0 0 1.5rem;
            opacity: 0.8;
        }

        .player-dot {
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 999px;
            margin: 0 auto;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.18), 0 10px 20px rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.9);
            position: relative;
        }

        .player-dot::after {
            content: "";
            position: absolute;
            inset: 0.28rem;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.92), transparent 38%);
            opacity: 0.75;
        }

        .start-btn {
            background: linear-gradient(90deg, var(--cyan-500), var(--indigo-600));
            color: var(--text-main);
            font-weight: 700;
            padding: 0.95rem 2.2rem;
            border-radius: 999px;
            box-shadow: 0 0 22px rgba(24, 198, 255, 0.3), 0 14px 32px rgba(59, 130, 246, 0.35);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            font-size: 1rem;
            letter-spacing: 0.16em;
        }

        .start-btn:hover {
            box-shadow: 0 0 26px rgba(24, 198, 255, 0.38), 0 14px 32px rgba(59, 130, 246, 0.5);
            filter: brightness(1.06);
        }

        .start-btn:active,
        .restart-btn:active {
            transform: scale(0.95);
        }

        .game-over-card {
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            animation: bounceIn 0.5s ease;
            box-shadow: var(--glow-strong), 0 18px 40px rgba(0, 0, 0, 0.5);
        }

        .winner-label {
            margin: 0 0 0.5rem;
            font-size: 2.2rem;
            color: var(--yellow-400);
            text-shadow: 0 0 18px rgba(255, 217, 94, 0.4), 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .winner-name {
            font-size: clamp(2.6rem, 10vw, 4.1rem);
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            text-shadow: 0 0 18px currentColor, 0 4px 12px rgba(0, 0, 0, 0.45);
        }

        .restart-btn {
            background: linear-gradient(90deg, #f4fbff, #c8f5ff);
            color: var(--gray-900);
            font-weight: 700;
            padding: 0.85rem 1.9rem;
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
            transition: background 0.18s ease, transform 0.18s ease, filter 0.18s ease;
            letter-spacing: 0.08em;
        }

        .restart-btn:hover {
            background: var(--gray-200);
            filter: brightness(1.03);
        }

        .track-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(121, 232, 255, 0.28);
            background: rgba(10, 23, 46, 0.72);
            color: var(--cyan-300);
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: inset 0 0 12px rgba(24, 198, 255, 0.12);
        }

        .track-badge::before {
            content: "";
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 999px;
            background: radial-gradient(circle, #ffffff 0%, var(--cyan-300) 45%, transparent 70%);
            box-shadow: 0 0 12px rgba(121, 232, 255, 0.8);
        }

        .hidden {
            display: none !important;
        }

        .feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 40;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: min(26vw, 10rem);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(121, 232, 255, 0.35);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38), 0 0 24px rgba(24, 198, 255, 0.24);
            opacity: 0;
            transform: translateY(0.5rem) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            background: rgba(9, 15, 33, 0.78);
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif--hit {
            bottom: 7rem;
        }

        .feedback-gif--win {
            top: 6.5rem;
        }

        .feedback-chip {
            position: absolute;
            left: 50%;
            top: 5.5rem;
            transform: translate(-50%, -0.35rem);
            padding: 0.55rem 1rem;
            border-radius: 999px;
            background: rgba(3, 10, 24, 0.78);
            border: 1px solid rgba(121, 232, 255, 0.34);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 41;
        }

        .feedback-chip.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .dice-anim { animation: shake 0.5s infinite; }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.04); opacity: 1; }
            100% { transform: scale(1); }
        }

        @media (max-width: 640px) {
            .ui-layer {
                padding: 0.75rem;
            }

            .turn-panel {
                padding: 0.75rem 1rem 0.6rem;
            }

            .turn-indicator {
                font-size: 1.2rem;
            }

            .controls-wrap {
                bottom: 1.25rem;
            }

            .roll-btn {
                width: 5.25rem;
                height: 5.25rem;
            }

            .start-card,
            .game-over-card {
                padding: 1.5rem;
            }

            .feedback-gif {
                right: 0.5rem;
                width: min(32vw, 7.25rem);
            }

            .feedback-gif--hit {
                bottom: 6.5rem;
            }

            .feedback-gif--win {
                top: 5.75rem;
            }

            .feedback-chip {
                top: 4.8rem;
                max-width: calc(100vw - 2rem);
                text-align: center;
                font-size: 0.88rem;
                padding: 0.48rem 0.8rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .instruction-copy {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer" class="fullscreen-overlay ui-layer">
            <div id="feedback-layer" class="feedback-layer">
                <!-- [agent-note][stage3] resolved-gif: hit-overlay + win-overlay -> catalogs/gifs.json | keep off core playfield for mobile safety -->
                <img id="hit-gif" class="feedback-gif feedback-gif--hit" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp" alt="Collision reaction effect">
                <img id="win-gif" class="feedback-gif feedback-gif--win" src="https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp" alt="Victory celebration effect">
                <div id="feedback-chip" class="feedback-chip title-font">Turbo clash!</div>
            </div>

            <!-- HUD -->
            <div id="hud" class="hidden hud-row">
                <div class="glass-panel turn-panel">
                    <div class="hud-label ui-copy">ACTIVE LANE</div>
                    <div id="turn-indicator" class="turn-indicator ui-copy" style="color: #ef4444;">RED RACER</div>
                </div>
            </div>

            <!-- Dice Control (Bottom Center) -->
            <div id="controls" class="hidden controls-wrap">
                <button id="roll-btn" class="glass-panel roll-btn">
                    <span class="roll-caption ui-copy">Tap</span>
                    <div id="dice-display" class="dice-display">🎲</div>
                </button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="fullscreen-overlay center-screen start-screen">
            <div class="glass-panel start-card">
                <div class="track-badge ui-copy">Turbo Neon League</div>
                <h1 class="game-title title-font">ARCADE<br><span class="game-subtitle">TRACK RIVALS</span></h1>
                <p class="tagline ui-copy">4 racers. One shared circuit.</p>
                <p class="instruction-copy ui-copy">Tap the die to surge ahead. Land on another racer to send them back to the start.</p>
                <div class="player-grid">
                    <div class="player-dot" style="background: var(--red-500);"></div>
                    <div class="player-dot" style="background: var(--green-500);"></div>
                    <div class="player-dot" style="background: var(--amber-400);"></div>
                    <div class="player-dot" style="background: var(--blue-600);"></div>
                </div>
                <button id="start-btn" class="start-btn title-font">START RACE</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden fullscreen-overlay center-screen game-over-screen">
            <div class="glass-panel game-over-card">
                <h2 class="winner-label title-font">Circuit Winner!</h2>
                <div id="winner-name" class="winner-name">RED</div>
                <button id="restart-btn" class="restart-btn ui-copy">Race Again</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                roll: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                move: "https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                reset: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = this.createAudio(ASSETS.bgm, 0.26, true);
                this.victoryLoop = this.createAudio(ASSETS.victoryLoop, 0.22, true);
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = this.createAudio(url, this.getDefaultVolume(key), false);
                }
            }

            createAudio(src, volume, loop = false) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = volume;
                return audio;
            }

            getDefaultVolume(key) {
                const volumes = {
                    start: 0.65,
                    uiClick: 0.55,
                    roll: 0.5,
                    move: 0.28,
                    blocked: 0.42,
                    hit: 0.58,
                    reset: 0.48,
                    win: 0.72
                };
                return volumes[key] ?? 0.5;
            }

            unlock() {
                this.ready = true;
            }

            safePlay(audio) {
                if (!this.ready || !audio) return;
                audio.play().catch(() => {});
            }

            playBGM() {
                if (!this.ready) return;
                this.victoryLoop.pause();
                this.victoryLoop.currentTime = 0;
                if (this.bgm.paused) {
                    this.safePlay(this.bgm);
                }
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playVictoryLoop() {
                if (!this.ready) return;
                this.stopBGM();
                if (this.victoryLoop.paused) {
                    this.safePlay(this.victoryLoop);
                }
            }

            stopAllLoops() {
                this.stopBGM();
                this.victoryLoop.pause();
                this.victoryLoop.currentTime = 0;
            }

            playSFX(key, minInterval = 90) {
                const base = this.sfx[key];
                const now = performance.now();
                if (!this.ready || !base) return;
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minInterval) return;
                this.lastPlayedAt[key] = now;
                const clone = base.cloneNode();
                clone.volume = base.volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let gameStarted = false;

        // Ludo Logic
        const GRID_SIZE = 11;
        let CELL_SIZE = 0;
        let BOARD_OFFSET_X = 0;
        let BOARD_OFFSET_Y = 0;

        // Path Definition (Indices on the 11x11 grid)
        // A simplified loop for MVP.
        // 0,0 is top left.
        // We define the "Main Track" as a sequence of x,y coordinates.
        // The track is 40 steps long.
        const MAIN_PATH = [
            // Red Arm (Top)
            {x:4,y:0}, {x:5,y:0}, {x:6,y:0},
            {x:6,y:1}, {x:6,y:2}, {x:6,y:3}, {x:6,y:4}, // Down right side of top arm
            // Right Arm
            {x:7,y:4}, {x:8,y:4}, {x:9,y:4}, {x:10,y:4},
            {x:10,y:5}, {x:10,y:6},
            {x:9,y:6}, {x:8,y:6}, {x:7,y:6}, {x:6,y:6},
            // Bottom Arm
            {x:6,y:7}, {x:6,y:8}, {x:6,y:9}, {x:6,y:10},
            {x:5,y:10}, {x:4,y:10},
            {x:4,y:9}, {x:4,y:8}, {x:4,y:7}, {x:4,y:6},
            // Left Arm
            {x:3,y:6}, {x:2,y:6}, {x:1,y:6}, {x:0,y:6},
            {x:0,y:5}, {x:0,y:4},
            {x:1,y:4}, {x:2,y:4}, {x:3,y:4}, {x:4,y:4},
            // Up Left side of top arm
            {x:4,y:3}, {x:4,y:2}, {x:4,y:1}
        ];
        // Note: The above path is manually traced. Let's verify loop closure.
        // Start (4,1) -> (4,0) is missing. Let's refine the loop to be perfectly circular.
        // Actually, let's use a simpler generated path logic or hardcode the 40 tiles perfectly.
        // Let's assume standard simplified Ludo track:
        // Top-Left Start for Red: index 0.

        // Corrected Circular Path (40 tiles)
        const TRACK = [
            {x:1,y:4}, {x:2,y:4}, {x:3,y:4}, {x:4,y:4}, {x:4,y:3}, {x:4,y:2}, {x:4,y:1}, {x:4,y:0}, {x:5,y:0}, {x:6,y:0}, // 0-9
            {x:6,y:1}, {x:6,y:2}, {x:6,y:3}, {x:6,y:4}, {x:7,y:4}, {x:8,y:4}, {x:9,y:4}, {x:10,y:4}, {x:10,y:5}, {x:10,y:6}, // 10-19
            {x:9,y:6}, {x:8,y:6}, {x:7,y:6}, {x:6,y:6}, {x:6,y:7}, {x:6,y:8}, {x:6,y:9}, {x:6,y:10}, {x:5,y:10}, {x:4,y:10}, // 20-29
            {x:4,y:9}, {x:4,y:8}, {x:4,y:7}, {x:4,y:6}, {x:3,y:6}, {x:2,y:6}, {x:1,y:6}, {x:0,y:6}, {x:0,y:5}, {x:0,y:4}  // 30-39
        ];
        // Home Paths (5 tiles into center)
        const HOMES = {
            0: [{x:1,y:5}, {x:2,y:5}, {x:3,y:5}, {x:4,y:5}, {x:5,y:5}], // Red
            1: [{x:5,y:1}, {x:5,y:2}, {x:5,y:3}, {x:5,y:4}, {x:5,y:5}], // Green (Top) - Wait, indices need to match visual
            2: [{x:9,y:5}, {x:8,y:5}, {x:7,y:5}, {x:6,y:5}, {x:5,y:5}], // Yellow (Right)
            3: [{x:5,y:9}, {x:5,y:8}, {x:5,y:7}, {x:5,y:6}, {x:5,y:5}]  // Blue (Bottom)
        };

        // Player Config
        // Colors: Red, Green, Yellow, Blue
        // Start Indices on TRACK: Red=0, Green=10, Yellow=20, Blue=30
        const PLAYERS = [
            { id: 0, name: "RED", color: "#ef4444", startIdx: 0, homeEntryIdx: 39, path: TRACK, homePath: HOMES[0], laneName: "RED RACER" },
            { id: 1, name: "GREEN", color: "#22c55e", startIdx: 10, homeEntryIdx: 9, path: TRACK, homePath: HOMES[1], laneName: "GREEN RACER" },
            { id: 2, name: "YELLOW", color: "#eab308", startIdx: 20, homeEntryIdx: 19, path: TRACK, homePath: HOMES[2], laneName: "YELLOW RACER" },
            { id: 3, name: "BLUE", color: "#3b82f6", startIdx: 30, homeEntryIdx: 29, path: TRACK, homePath: HOMES[3], laneName: "BLUE RACER" }
        ];

        let turn = 0;
        let diceValue = 1;
        let isRolling = false;
        let isMoving = false;

        // Player State: [ { pos: -1 (base) or 0-39 (track) or 100+ (home), stepCount: 0 } ]
        // To simplify: pos is simply the number of steps taken from START.
        // 0 = Start Tile.
        // 0-39 = On Track (relative to player start).
        // 40-44 = Home Path.
        // 45 = Goal.
        let playerStates = [];

        // Background Parallax
        let bgParticles = [];
        let loopStarted = false;
        let feedbackTimers = {};

        /** 4. INITIALIZATION & RESIZE */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Calculate Board Dimensions
            const minDim = Math.min(width, height);
            CELL_SIZE = Math.floor((minDim * 0.85) / GRID_SIZE);
            BOARD_OFFSET_X = (width - (CELL_SIZE * GRID_SIZE)) / 2;
            BOARD_OFFSET_Y = (height - (CELL_SIZE * GRID_SIZE)) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            clearFeedback();
            turn = 0;
            playerStates = [
                { steps: 0, finished: false },
                { steps: 0, finished: false },
                { steps: 0, finished: false },
                { steps: 0, finished: false }
            ];
            updateTurnUI();

            // Init Particles
            bgParticles = [];
            for(let i=0; i<20; i++) {
                bgParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 50 + 10,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    color: `rgba(255,255,255,${Math.random() * 0.05})`
                });
            }
        }

        /** 5. GAME LOGIC */
        function getCoordinates(playerIdx, steps) {
            const p = PLAYERS[playerIdx];

            // Check if Home
            if (steps >= 40) {
                const homeIdx = steps - 40;
                if (homeIdx >= p.homePath.length) return p.homePath[p.homePath.length-1]; // Cap at goal
                return p.homePath[homeIdx];
            }

            // On Track
            // Calculate absolute index on the shared TRACK array
            let trackIdx = (p.startIdx + steps) % 40;
            return TRACK[trackIdx];
        }

        function showFeedback(message, type = 'hit', duration = 1400) {
            const chip = document.getElementById('feedback-chip');
            const hitGif = document.getElementById('hit-gif');
            const winGif = document.getElementById('win-gif');
            const activeGif = type === 'win' ? winGif : hitGif;
            const inactiveGif = type === 'win' ? hitGif : winGif;

            chip.textContent = message;
            chip.classList.add('visible');
            activeGif.classList.add('visible');
            inactiveGif.classList.remove('visible');

            clearTimeout(feedbackTimers.chip);
            clearTimeout(feedbackTimers.gif);

            feedbackTimers.chip = setTimeout(() => {
                chip.classList.remove('visible');
            }, duration);

            feedbackTimers.gif = setTimeout(() => {
                activeGif.classList.remove('visible');
            }, duration + 250);
        }

        function clearFeedback() {
            document.getElementById('feedback-chip').classList.remove('visible');
            document.getElementById('hit-gif').classList.remove('visible');
            document.getElementById('win-gif').classList.remove('visible');
            clearTimeout(feedbackTimers.chip);
            clearTimeout(feedbackTimers.gif);
        }

        async function handleRoll() {
            if (isRolling || isMoving) return;
            isRolling = true;
            audio.playSFX('roll', 120);

            const diceEl = document.getElementById('dice-display');
            const rollBtn = document.getElementById('roll-btn');
            rollBtn.classList.add('dice-anim');

            // Simulate Roll
            let rolls = 10;
            const rollInterval = setInterval(() => {
                diceEl.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];
                rolls--;
                if (rolls <= 0) {
                    clearInterval(rollInterval);
                    finalizeRoll();
                }
            }, 50);
        }

        function finalizeRoll() {
            diceValue = Math.floor(Math.random() * 6) + 1;
            const diceChars = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            document.getElementById('dice-display').innerText = diceChars[diceValue - 1];
            document.getElementById('roll-btn').classList.remove('dice-anim');
            isRolling = false;

            movePiece();
        }

        async function movePiece() {
            isMoving = true;
            const pState = playerStates[turn];

            // Logic: Can we move?
            // If at goal, skip
            if (pState.finished) {
                nextTurn();
                return;
            }

            // Check if move exceeds goal (45 steps total: 0-39 track + 5 home)
            // Actually, let's say 40 steps is entry, +5 steps = 45 is center.
            // Start is 0.
            // Full loop is 40.
            // Home is 40, 41, 42, 43, 44(Goal).
            if (pState.steps + diceValue > 44) {
                // Cannot move
                audio.playSFX('blocked', 180);
                showFeedback(`${PLAYERS[turn].laneName} stalled out`, 'hit', 1200);
                await new Promise(r => setTimeout(r, 500));
                nextTurn();
                return;
            }

            // Animate Steps
            for (let i = 0; i < diceValue; i++) {
                pState.steps++;
                audio.playSFX('move', 120);
                await new Promise(r => setTimeout(r, 240));

                // Check Win
                if (pState.steps === 44) {
                    pState.finished = true;
                    audio.playSFX('win', 300);
                    showFeedback(`${PLAYERS[turn].laneName} wins the circuit!`, 'win', 2600);
                    gameOver(PLAYERS[turn]);
                    return;
                }
            }

            // Check Collision
            checkCollision();

            nextTurn();
        }

        function checkCollision() {
            const currentP = PLAYERS[turn];
            const currentSteps = playerStates[turn].steps;

            // Safe zones: Start tiles (0) and Home path (>39)
            if (currentSteps === 0 || currentSteps >= 40) return;

            // Get absolute track index
            const currentAbsIdx = (currentP.startIdx + currentSteps) % 40;

            PLAYERS.forEach((otherP, idx) => {
                if (idx !== turn) {
                    const otherSteps = playerStates[idx].steps;
                    // Only check if other is on track
                    if (otherSteps > 0 && otherSteps < 40) {
                        const otherAbsIdx = (otherP.startIdx + otherSteps) % 40;
                        if (currentAbsIdx === otherAbsIdx) {
                            // KILL!
                            audio.playSFX('hit', 180);
                            audio.playSFX('reset', 220);
                            showFeedback(`${currentP.laneName} bumps ${otherP.laneName}!`, 'hit', 1600);
                            playerStates[idx].steps = 0; // Send back to start
                        }
                    }
                }
            });
        }

        function nextTurn() {
            isMoving = false;
            turn = (turn + 1) % 4;
            // Skip finished players?
            let checks = 0;
            while (playerStates[turn].finished && checks < 4) {
                turn = (turn + 1) % 4;
                checks++;
            }
            updateTurnUI();
        }

        function updateTurnUI() {
            const p = PLAYERS[turn];
            const hud = document.getElementById('turn-indicator');
            hud.innerText = p.laneName;
            hud.style.color = p.color;

            const btn = document.getElementById('roll-btn');
            btn.style.borderColor = p.color;
            btn.style.boxShadow = `0 0 15px ${p.color}40`;
        }

        function drawBoard() {
            // Draw Background Particles
            bgParticles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                p.x += p.speedX;
                p.y += p.speedY;
                if(p.x < -50) p.x = width+50;
                if(p.x > width+50) p.x = -50;
                if(p.y < -50) p.y = height+50;
                if(p.y > height+50) p.y = -50;
            });

            // Draw Board Base
            // Cross Shape
            ctx.fillStyle = "#1f2937"; // Dark gray base
            // We can just draw the tiles

            // Draw Tiles
            TRACK.forEach((pos, i) => {
                const x = BOARD_OFFSET_X + pos.x * CELL_SIZE;
                const y = BOARD_OFFSET_Y + pos.y * CELL_SIZE;

                // Color tiles based on whose start/territory it is
                ctx.fillStyle = "#14233f"; // Default tile
                if (i === 0) ctx.fillStyle = PLAYERS[0].color + "66"; // Red Start
                if (i === 10) ctx.fillStyle = PLAYERS[1].color + "66";
                if (i === 20) ctx.fillStyle = PLAYERS[2].color + "66";
                if (i === 30) ctx.fillStyle = PLAYERS[3].color + "66";

                ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);

                ctx.strokeStyle = "rgba(141, 219, 255, 0.22)";
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);

                ctx.strokeStyle = "rgba(255,255,255,0.04)";
                ctx.strokeRect(x + CELL_SIZE * 0.18, y + CELL_SIZE * 0.18, CELL_SIZE * 0.64, CELL_SIZE * 0.64);
            });

            // Draw Home Paths
            PLAYERS.forEach(p => {
                p.homePath.forEach((pos, i) => {
                    const x = BOARD_OFFSET_X + pos.x * CELL_SIZE;
                    const y = BOARD_OFFSET_Y + pos.y * CELL_SIZE;
                    ctx.fillStyle = p.color + "44"; // Faded color
                    if (i === 4) ctx.fillStyle = p.color; // Center goal
                    ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                    ctx.strokeStyle = "rgba(255,255,255,0.08)";
                    ctx.strokeRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                });
            });

            // Draw Bases (Corners)
            const bases = [
                {x:0, y:0, c: PLAYERS[0].color}, // TL
                {x:7, y:0, c: PLAYERS[1].color}, // TR - wait, grid is 11x11, so 0-3 is base, 4 is track. 7-10 is base.
                {x:7, y:7, c: PLAYERS[2].color}, // BR
                {x:0, y:7, c: PLAYERS[3].color}  // BL
            ];
            // Adjust base coords for 11x11
            // Left Base: x 0-3, y 0-3.
            // Right Base: x 7-10, y 0-3.
            // etc.

            // Draw big colored squares for bases
            ctx.fillStyle = PLAYERS[0].color + "20"; ctx.fillRect(BOARD_OFFSET_X, BOARD_OFFSET_Y, CELL_SIZE*4, CELL_SIZE*4);
            ctx.fillStyle = PLAYERS[1].color + "20"; ctx.fillRect(BOARD_OFFSET_X + CELL_SIZE*7, BOARD_OFFSET_Y, CELL_SIZE*4, CELL_SIZE*4);
            ctx.fillStyle = PLAYERS[2].color + "20"; ctx.fillRect(BOARD_OFFSET_X + CELL_SIZE*7, BOARD_OFFSET_Y + CELL_SIZE*7, CELL_SIZE*4, CELL_SIZE*4);
            ctx.fillStyle = PLAYERS[3].color + "20"; ctx.fillRect(BOARD_OFFSET_X, BOARD_OFFSET_Y + CELL_SIZE*7, CELL_SIZE*4, CELL_SIZE*4);

            ctx.strokeStyle = "rgba(121, 232, 255, 0.12)";
            ctx.lineWidth = 2;
            ctx.strokeRect(BOARD_OFFSET_X, BOARD_OFFSET_Y, CELL_SIZE*11, CELL_SIZE*11);

            for (let i = 0; i <= GRID_SIZE; i++) {
                const px = BOARD_OFFSET_X + i * CELL_SIZE;
                const py = BOARD_OFFSET_Y + i * CELL_SIZE;
                ctx.strokeStyle = "rgba(121, 232, 255, 0.05)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(px, BOARD_OFFSET_Y);
                ctx.lineTo(px, BOARD_OFFSET_Y + CELL_SIZE * GRID_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(BOARD_OFFSET_X, py);
                ctx.lineTo(BOARD_OFFSET_X + CELL_SIZE * GRID_SIZE, py);
                ctx.stroke();
            }

            // Draw Players
            if (gameActive) {
                PLAYERS.forEach((p, idx) => {
                    const state = playerStates[idx];
                    const coords = getCoordinates(idx, state.steps);

                    const cx = BOARD_OFFSET_X + coords.x * CELL_SIZE + CELL_SIZE/2;
                    const cy = BOARD_OFFSET_Y + coords.y * CELL_SIZE + CELL_SIZE/2;

                    // Shadow
                    ctx.beginPath();
                    ctx.arc(cx + 4, cy + 5, CELL_SIZE/3, 0, Math.PI*2);
                    ctx.fillStyle = "rgba(0,0,0,0.45)";
                    ctx.fill();

                    // Glow ring
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL_SIZE/2.6, 0, Math.PI*2);
                    ctx.fillStyle = p.color + "22";
                    ctx.fill();

                    // Piece body
                    const pieceGradient = ctx.createRadialGradient(cx - CELL_SIZE * 0.12, cy - CELL_SIZE * 0.16, CELL_SIZE * 0.06, cx, cy, CELL_SIZE/2.2);
                    pieceGradient.addColorStop(0, "rgba(255,255,255,0.95)");
                    pieceGradient.addColorStop(0.22, p.color);
                    pieceGradient.addColorStop(1, "rgba(8,15,32,0.95)");
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL_SIZE/3, 0, Math.PI*2);
                    ctx.fillStyle = pieceGradient;
                    ctx.fill();

                    // Inner visor
                    ctx.beginPath();
                    ctx.arc(cx, cy - CELL_SIZE * 0.03, CELL_SIZE/7.5, 0, Math.PI*2);
                    ctx.fillStyle = "rgba(244, 251, 255, 0.92)";
                    ctx.fill();

                    // Highlight
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = "rgba(255,255,255,0.95)";
                    ctx.stroke();

                    // Active Player Indicator
                    if (turn === idx && !state.finished) {
                        ctx.beginPath();
                        ctx.arc(cx, cy, CELL_SIZE/2 + 2, 0, Math.PI*2);
                        ctx.strokeStyle = `rgba(121,232,255,${0.4 + Math.sin(Date.now()/200)*0.3})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);
            drawBoard();
            requestAnimationFrame(gameLoop);
        }

        function gameOver(winner) {
            gameActive = false;
            audio.playVictoryLoop();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            const winnerEl = document.getElementById('winner-name');
            winnerEl.innerText = winner.laneName;
            winnerEl.style.color = winner.color;
        }

        /** 6. CONTROLS */
        function beginRound() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            gameActive = true;
            gameStarted = true;
            initGame();
            audio.playBGM();
            if (!loopStarted) {
                loopStarted = true;
                gameLoop();
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 200);
            beginRound();
        });

        document.getElementById('roll-btn').addEventListener('click', () => {
            if (gameStarted) {
                audio.unlock();
                audio.playSFX('uiClick', 80);
            }
            if (gameActive) handleRoll();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('uiClick', 120);
            beginRound();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.playBGM();
            }
        });
    });
    </script>
</body>
</html>
