<style>
:root{--cream:#fff7df;--ink:#3b2552;--mint:#8ef3c5;--mint2:#43d899;--rose:#ff8ec7;--rose2:#ff5fac;--lav:#cbb7ff;--sky:#aeeaff;--gold:#ffd86b;--panel:rgba(255,255,255,.78);--edge:rgba(83,45,120,.18)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#ffeef8;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{font:inherit}#game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 8%,#fff 0 8%,transparent 22%),linear-gradient(180deg,#ffe9f8 0%,#e6f8ff 48%,#fff4d2 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.58);filter:blur(.2px);animation:float 9s ease-in-out infinite;pointer-events:none}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:999px}.cloud:before{width:50%;height:80%;left:16%;top:-40%}.cloud:after{width:42%;height:60%;right:13%;top:-23%}.c1{width:150px;height:46px;left:5%;top:12%}.c2{width:112px;height:34px;right:7%;top:24%;animation-delay:-3s}.c3{width:132px;height:38px;left:52%;top:7%;animation-delay:-5s}@keyframes float{50%{transform:translateY(12px) translateX(8px)}}#ui{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}.hud,.question-card,#answers,.end-card,.toast{pointer-events:auto}.hud{display:grid;gap:8px}.duel-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}.trainer{background:var(--panel);border:2px solid var(--edge);border-radius:22px;padding:8px 10px;box-shadow:0 12px 28px rgba(137,87,151,.14),inset 0 0 0 2px rgba(255,255,255,.45)}.trainer.right{text-align:right}.name{font-family:Bangers,cursive;font-size:clamp(18px,5vw,30px);letter-spacing:.03em;line-height:.9}.sub{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.72}.vibe{height:13px;border-radius:999px;background:rgba(59,37,82,.13);overflow:hidden;border:1px solid rgba(59,37,82,.18);margin-top:5px}.fill{height:100%;width:100%;border-radius:999px;transition:width .25s ease,background .25s ease}.player-fill{background:linear-gradient(90deg,var(--mint2),var(--mint),#faffbf)}.enemy-fill{background:linear-gradient(90deg,var(--rose2),var(--rose),#ffe0ef)}.vs{font-family:Bangers,cursive;background:linear-gradient(180deg,#fff,var(--gold));border:2px solid rgba(59,37,82,.2);border-radius:18px;padding:8px 10px;box-shadow:0 8px 16px rgba(59,37,82,.14);font-size:24px;transform:rotate(-3deg)}.timer-shell{height:9px;border-radius:99px;background:rgba(59,37,82,.14);overflow:hidden;border:1px solid rgba(59,37,82,.15)}#timer{height:100%;width:100%;background:linear-gradient(90deg,#8ef3c5,#ffd86b,#ff8ec7);transition:width .05s linear}.question-card{align-self:center;width:min(94vw,640px);margin-top:8vh;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,250,253,.82));border:2px solid rgba(92,52,132,.18);border-radius:30px;padding:16px 16px 18px;text-align:center;box-shadow:0 20px 48px rgba(114,73,130,.2),inset 0 0 0 3px rgba(255,255,255,.55);backdrop-filter:blur(9px);position:relative}.question-card:before{content:"✦";position:absolute;left:18px;top:-14px;font-size:34px;color:var(--gold);text-shadow:0 2px 0 #fff}.badge{display:inline-flex;gap:6px;align-items:center;border-radius:999px;background:#fff0aa;border:1px solid rgba(59,37,82,.14);padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.title{font-family:Bangers,cursive;font-size:clamp(32px,8vw,58px);line-height:.88;margin:8px 0 2px;color:#7b4bb3;text-shadow:2px 3px 0 #fff,4px 5px 0 rgba(255,142,199,.45)}.prompt{font-size:clamp(18px,5vw,25px);font-weight:700;line-height:1.1;margin:9px 0 0}.hint{margin:6px 0 0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7d5a90}#answers{display:grid;grid-template-columns:1fr;gap:10px;width:min(94vw,640px);align-self:center;padding-bottom:4px}.answer{min-height:58px;border:0;border-radius:22px;padding:12px 14px;background:linear-gradient(180deg,#fff,#fff2fb);color:var(--ink);font-weight:700;font-size:clamp(17px,4.5vw,22px);text-align:left;box-shadow:0 10px 18px rgba(95,55,125,.15),inset 0 0 0 2px rgba(100,62,128,.11);display:flex;align-items:center;gap:10px;transition:transform .1s ease,box-shadow .16s ease,background .18s ease}.answer:active{transform:scale(.985)}.answer .orb{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--sky),var(--lav));font-family:Bangers,cursive;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.16)}.answer.correct{background:linear-gradient(180deg,#eafff4,#baf9da);box-shadow:0 0 0 3px rgba(67,216,153,.35),0 14px 24px rgba(67,216,153,.18)}.answer.wrong{background:linear-gradient(180deg,#fff0f6,#ffc8df);box-shadow:0 0 0 3px rgba(255,95,172,.32),0 14px 24px rgba(255,95,172,.16);animation:shake .35s both}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.toast{position:absolute;right:12px;bottom:112px;z-index:20;max-width:min(230px,54vw);border-radius:22px;padding:10px 12px;background:rgba(255,255,255,.88);border:2px solid rgba(92,52,132,.14);box-shadow:0 15px 30px rgba(85,45,112,.18);font-weight:700;opacity:0;transform:translateY(12px) scale(.95);transition:.22s ease}.toast.show{opacity:1;transform:none}.toast b{font-family:Bangers,cursive;color:#7b4bb3;font-size:24px;display:block;line-height:.9}.end-card{position:absolute;inset:0;z-index:30;display:none;place-items:center;padding:22px;background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.7),rgba(255,238,248,.9) 48%,rgba(210,239,255,.94));text-align:center}.end-card.show{display:grid}.end-box{width:min(92vw,520px);border-radius:34px;padding:24px;background:rgba(255,255,255,.88);border:2px solid rgba(92,52,132,.18);box-shadow:0 24px 60px rgba(82,40,111,.2)}.end-box h2{font-family:Bangers,cursive;font-size:clamp(48px,13vw,78px);line-height:.85;margin:0 0 10px;color:#7b4bb3;text-shadow:2px 4px 0 #fff}.end-box p{font-weight:700;font-size:20px}.cta{border:0;border-radius:999px;background:linear-gradient(180deg,#fff0aa,#ffd86b);padding:14px 22px;min-height:54px;font-family:Bangers,cursive;font-size:28px;color:#4a315f;box-shadow:0 10px 0 rgba(112,74,45,.18),0 18px 28px rgba(83,45,120,.16)}.hidden{display:none!important}@media (min-width:700px){#answers{grid-template-columns:1fr 1fr}.question-card{margin-top:11vh}}@media (max-height:620px){.question-card{margin-top:3vh;padding:12px}.title{font-size:34px}.answer{min-height:50px}.toast{bottom:88px}}
</style>
</head>
<body>
<div id="game" aria-label="Pocket Quiz Critter trivia duel">
<canvas id="scene"></canvas><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_correct" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_wrong" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3" preload="auto"></audio>
<audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3" preload="auto"></audio>
<audio id="sfx_round" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>
<audio id="sfx_victory" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<div id="ui">
  <header id="hud" class="hud">
    <div class="duel-row">
      <section class="trainer"><div class="sub">Your pocket pal</div><div class="name">Bestie Sproutlet</div><div class="vibe"><div id="hp-player" class="fill player-fill"></div></div></section>
      <div class="vs">QUIZ!</div>
      <section class="trainer right"><div class="sub">Rival critter</div><div class="name">Snarkling</div><div class="vibe"><div id="hp-enemy" class="fill enemy-fill"></div></div></section>
    </div>
    <div class="timer-shell" aria-label="Round timer"><div id="timer"></div></div>
  </header>
  <main id="question-panel" class="question-card">
    <span id="q-category" class="badge">Badge Pop Quiz</span>
    <h1 class="title">Bestie Badge Blitz</h1>
    <p class="hint">Tap the true fact before the rival critter claps back.</p>
    <h2 id="q-text" class="prompt">Loading a cozy quiz...</h2>
  </main>
  <section id="answers" aria-label="Answer choices"></section>
</div>
<aside id="toast" class="toast" aria-live="polite"><b>Round live</b><span>Pick a fact, bestie.</span></aside>
<section id="game-over-screen" class="end-card"><div class="end-box"><h2 id="go-title">Badge Secured</h2><p id="go-score">The math is mathing, bestie.</p><button id="restart-btn" class="cta" type="button">One More Badge</button></div></section>
</div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});let cw=0,ch=0,dpr=1,lastTime=0,dt=0,initialized=false,gameState='INIT',aiTimeout=null,toastTimer=null,bgmStarted=false,audioCtx=null;const gameConfig={aiSpeed:4,themeColor:'#8ef3c5'};
const state={playerHp:100,enemyHp:100,currentQIndex:0,timer:0,maxTime:10,roundActive:false,score:0,particles:[],shake:0,roundResult:'live'};
const QUESTIONS=[
{cat:'WORD GAME',q:'Which word means a tiny creature you keep in a pocket battle journal?',a:['Companion','Algorithm','Spreadsheet','Volcano'],c:0},
{cat:'TRIVIA',q:'What does HTML stand for, bestie?',a:['HyperText Markup Language','HighText Meme Language','Happy Trivia Magic League','None of these'],c:0},
{cat:'SCIENCE',q:'Which planet is famous for its rings?',a:['Saturn','Mars','Venus','Mercury'],c:0},
{cat:'MATHING',q:'If your Sproutlet has 2 berries and finds 3 more, what is the vibe total?',a:['5','4','6','23 somehow'],c:0},
{cat:'CINEMA',q:'Who directed the dream-heist film Inception?',a:['Christopher Nolan','Steven Spielberg','Greta Gerwig','Hayao Miyazaki'],c:0},
{cat:'SPORTS',q:'A marathon is closest to which distance?',a:['42.195 km','10 km','5 km','100 km'],c:0},
{cat:'TECH',q:'Which language runs directly in most web browsers?',a:['JavaScript','C++','Swift only','Morse code'],c:0},
{cat:'NATURE',q:'What do bees collect from flowers to help make honey?',a:['Nectar','Pebbles','Moonlight','Wi-Fi'],c:0},
{cat:'WORD GAME',q:'Which option is a synonym for “cozy”?',a:['Comfy','Noisy','Jagged','Frozen'],c:0},
{cat:'TRIVIA',q:'Which company owns Android?',a:['Google','Apple','Nintendo','The snack drawer'],c:0}
];let questionDeck=[];
const $=id=>document.getElementById(id);
const AudioSys={ensure(){if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx=new C()}return audioCtx},resume(){const c=this.ensure();if(c&&c.state==='suspended')c.resume().catch(()=>{});if(!bgmStarted){const b=$('bgm');b.volume=.16;b.play().then(()=>bgmStarted=true).catch(()=>{})}},play(id){const el=$(id);if(el){el.currentTime=0;el.volume=id==='sfx_round'?.28:.42;el.play().catch(()=>this.beep(id));}else this.beep(id)},beep(id){const c=this.ensure();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=id.includes('wrong')?'sawtooth':'triangle';o.frequency.setValueAtTime(id.includes('wrong')?150:660,c.currentTime);o.frequency.exponentialRampToValueAtTime(id.includes('wrong')?80:1180,c.currentTime+.16);g.gain.setValueAtTime(.11,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.2);o.start();o.stop(c.currentTime+.21)}};
function vibrate(type){try{window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style:type==='heavy'?'heavy':'light'}})}catch(e){}}
class Particle{constructor(x,y,color,txt=''){this.x=x;this.y=y;this.color=color;this.txt=txt;const a=Math.random()*Math.PI*2,s=Math.random()*170+45;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s-30;this.life=1;this.decay=Math.random()*1.3+1.1;this.size=Math.random()*8+4}update(d){this.x+=this.vx*d;this.y+=this.vy*d;this.vy+=80*d;this.life-=this.decay*d}draw(){ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;if(this.txt){ctx.font=`${this.size+10}px Bangers`;ctx.fillText(this.txt,this.x,this.y)}else{ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}}
function drawCritter(x,y,scale,kind,hp){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const bob=Math.sin(Date.now()*.004+(kind==='enemy'?1:0))*4;ctx.translate(0,bob);ctx.globalAlpha=.96;ctx.fillStyle='rgba(75,45,92,.14)';ctx.beginPath();ctx.ellipse(0,86,70,18,0,0,Math.PI*2);ctx.fill();if(kind==='player'){ctx.fillStyle='#8ef3c5';ctx.beginPath();ctx.ellipse(0,20,54,62,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#43d899';ctx.beginPath();ctx.ellipse(-34,-30,22,38,-.55,0,Math.PI*2);ctx.ellipse(34,-30,22,38,.55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7df';ctx.beginPath();ctx.ellipse(0,32,31,26,0,0,Math.PI*2);ctx.fill();}else{ctx.fillStyle='#ff8ec7';ctx.beginPath();ctx.roundRect?ctx.roundRect(-54,-34,108,100,30):ctx.rect(-54,-34,108,100);ctx.fill();ctx.fillStyle='#cbb7ff';ctx.beginPath();ctx.moveTo(-38,-35);ctx.lineTo(-58,-72);ctx.lineTo(-12,-48);ctx.moveTo(38,-35);ctx.lineTo(58,-72);ctx.lineTo(12,-48);ctx.fill();ctx.fillStyle='#fff0fb';ctx.beginPath();ctx.ellipse(0,28,32,24,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#3b2552';ctx.beginPath();ctx.arc(-18,5,6,0,Math.PI*2);ctx.arc(18,5,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b2552';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,22,kind==='enemy'?13:15,0,Math.PI);ctx.stroke();if(hp<40){ctx.fillStyle='#ffd86b';ctx.font='26px Bangers';ctx.fillText('?!',-12,-68)}ctx.restore()}
function drawBackground(d){const grd=ctx.createLinearGradient(0,0,0,ch);grd.addColorStop(0,'#ffe9f8');grd.addColorStop(.55,'#dff8ff');grd.addColorStop(1,'#fff0c7');ctx.fillStyle=grd;ctx.fillRect(0,0,cw,ch);const t=Date.now()*.001;ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<16;i++){const x=((i*97+t*18)% (cw+120))-60,y=ch*.12+(i%5)*42+Math.sin(t+i)*9;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,58,28,10):ctx.rect(x,y,58,28);ctx.fill()}ctx.fillStyle='#c7f5cf';ctx.beginPath();ctx.ellipse(cw*.25,ch*.86,cw*.55,ch*.2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bceaff';ctx.beginPath();ctx.ellipse(cw*.78,ch*.88,cw*.6,ch*.22,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(123,75,179,.16)';ctx.lineWidth=2;for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(i*cw/6,ch*.76+Math.sin(t+i)*4);ctx.quadraticCurveTo(cw*.5,ch*.7+i*2,cw-i*cw/8,ch*.8);ctx.stroke()}ctx.font=`${Math.max(18,cw*.035)}px Bangers`;ctx.fillStyle='rgba(123,75,179,.22)';['ABC','2+3','QUIZ','BESTIE','?'].forEach((m,i)=>ctx.fillText(m,(i*.23*cw+t*13)%(cw+80)-40,ch*.18+(i%3)*62));drawCritter(cw*.24,ch*.63,Math.min(1.05,cw/390),'player',state.playerHp);drawCritter(cw*.76,ch*.63,Math.min(1.05,cw/390),'enemy',state.enemyHp)}
function initGame(){if(initialized)return;questionDeck=[...QUESTIONS].sort(()=>Math.random()-.5);resetMatch();initialized=true;requestAnimationFrame(loop)}
function resetMatch(){state.playerHp=100;state.enemyHp=100;state.currentQIndex=0;state.score=0;state.particles=[];updateHUD();setState('PLAYING');nextRound()}
function showToast(title,msg,duration=1050){const t=$('toast');t.innerHTML=`<b>${title}</b><span>${msg}</span>`;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),duration)}
function nextRound(){if(state.playerHp<=0||state.enemyHp<=0){setState('GAMEOVER');return}if(state.currentQIndex>=questionDeck.length){questionDeck=[...QUESTIONS].sort(()=>Math.random()-.5);state.currentQIndex=0}const q=questionDeck[state.currentQIndex++];state.timer=state.maxTime;state.roundActive=true;state.roundResult='live';$('q-category').textContent=q.cat;$('q-text').textContent=q.q;showToast('Round live','Pick a fact, bestie.',850);AudioSys.play('sfx_round');const wrap=$('answers');wrap.innerHTML='';q.a.forEach((ans,idx)=>{const btn=document.createElement('button');btn.type='button';btn.className='answer';btn.dataset.idx=idx;btn.innerHTML=`<span class="orb">${String.fromCharCode(65+idx)}</span><span>${ans}</span>`;btn.addEventListener('click',()=>handleInput(idx,q.c));wrap.appendChild(btn)});scheduleAI()}
function scheduleAI(){clearTimeout(aiTimeout);const reaction=(6-(gameConfig.aiSpeed*.5)+Math.random()*2)*1000;aiTimeout=setTimeout(()=>{if(!state.roundActive)return;Math.random()<.8?resolveRound('ENEMY_WIN'):resolveRound('ENEMY_FAIL')},reaction)}
function handleInput(selected,correct){if(!state.roundActive)return;AudioSys.resume();const btn=$('answers').children[selected];if(selected===correct){if(btn)btn.classList.add('correct');resolveRound('PLAYER_WIN')}else{if(btn)btn.classList.add('wrong');resolveRound('PLAYER_FAIL')}}
function resolveRound(result){state.roundActive=false;clearTimeout(aiTimeout);const damage=25;if(result==='PLAYER_WIN'){state.enemyHp=Math.max(0,state.enemyHp-damage);spawnParticles(cw/2,ch/2,'#43d899','✓');AudioSys.play('sfx_correct');AudioSys.play('sfx_hit');showToast('Math is mathing','Snarkling lost 25 vibe.',1200);vibrate('light')}else if(result==='ENEMY_WIN'){state.playerHp=Math.max(0,state.playerHp-damage);state.shake=.5;AudioSys.play('sfx_wrong');showToast('Oop, rival clapped','Sproutlet lost 25 vibe.',1200);vibrate('heavy')}else if(result==='PLAYER_FAIL'){state.playerHp=Math.max(0,state.playerHp-damage);state.shake=.3;AudioSys.play('sfx_wrong');showToast('Not that one','Sproutlet lost 25 vibe.',1200);vibrate('heavy')}else if(result==='ENEMY_FAIL'){state.enemyHp=Math.max(0,state.enemyHp-damage);spawnParticles(cw/2,ch/2,'#ffd86b','★');AudioSys.play('sfx_correct');AudioSys.play('sfx_hit');showToast('Rival fumbled','Snarkling lost 25 vibe.',1200)}else if(result==='TIMEOUT'){state.playerHp=Math.max(0,state.playerHp-10);state.enemyHp=Math.max(0,state.enemyHp-10);state.shake=.22;AudioSys.play('sfx_wrong');showToast('Timer said nope','Both critters lost 10 vibe.',1200)}updateHUD();setTimeout(nextRound,1200)}
function updateHUD(){$('hp-player').style.width=state.playerHp+'%';$('hp-enemy').style.width=state.enemyHp+'%';$('hp-player').style.background=state.playerHp<30?'linear-gradient(90deg,#ff6d8f,#ffd86b)':'linear-gradient(90deg,var(--mint2),var(--mint),#faffbf)'}
function spawnParticles(x,y,color,txt){for(let i=0;i<22;i++)state.particles.push(new Particle(x,y,color,txt&&i%3===0?txt:''))}
function setState(s){gameState=s;const playing=s==='PLAYING';$('hud').classList.toggle('hidden',!playing);$('question-panel').classList.toggle('hidden',!playing);$('answers').classList.toggle('hidden',!playing);$('game-over-screen').classList.toggle('show',s==='GAMEOVER');if(s==='GAMEOVER'){const won=state.playerHp>0;$('go-title').textContent=won?'Badge Secured':'Badge Bonked';$('go-score').textContent=won?'The math is mathing, bestie. Your Sproutlet out-quizzed the rival.':'Snarkling stole the snack badge. Queue one more level energy.';AudioSys.play(won?'sfx_victory':'sfx_gameover');showToast(won?'Cozy clutch':'Bestie, retry?',won?'Badge sparkle unlocked.':'The rival critter is smug.',1800)}}
function loop(ts){if(!lastTime)lastTime=ts;dt=Math.min(.05,(ts-lastTime)/1000);lastTime=ts;if(state.shake>0){const dx=(Math.random()-.5)*18*state.shake,dy=(Math.random()-.5)*18*state.shake;ctx.setTransform(dpr,0,0,dpr,dx,dy);state.shake=Math.max(0,state.shake-dt)}else ctx.setTransform(dpr,0,0,dpr,0,0);drawBackground(dt);if(gameState==='PLAYING'&&state.roundActive){state.timer-=dt;$('timer').style.width=Math.max(0,state.timer/state.maxTime)*100+'%';if(state.timer<=0)resolveRound('TIMEOUT')}ctx.textAlign='center';ctx.textBaseline='middle';for(let i=state.particles.length-1;i>=0;i--){state.particles[i].update(dt);state.particles[i].draw();if(state.particles[i].life<=0)state.particles.splice(i,1)}requestAnimationFrame(loop)}
$('restart-btn').addEventListener('click',()=>{AudioSys.resume();resetMatch()});document.addEventListener('visibilitychange',()=>{const b=$('bgm');if(document.hidden){b.pause();bgmStarted=false}else if(gameState!=='INIT')AudioSys.resume()});new ResizeObserver(e=>{const r=e[0].contentRect;dpr=window.devicePixelRatio||1;cw=r.width;ch=r.height;canvas.width=Math.max(1,cw*dpr);canvas.height=Math.max(1,ch*dpr);canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!initialized)initGame()}).observe($('game'));
</script>
