<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>World Circuit Combo Clash</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #07030f;
      --night: #10061f;
      --ring: #24103f;
      --gold: #ffd15a;
      --hero: #25f4ff;
      --hero-deep: #087dff;
      --rival: #ff315f;
      --rival-deep: #7c112b;
      --paper: #fff8df;
      --muted: #c9b7e8;
      --panel: rgba(15, 8, 31, 0.82);
      --edge: rgba(255, 209, 90, 0.38);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #05020a; color: var(--paper); font-family: 'Rajdhani', system-ui, sans-serif;
      touch-action: manipulation;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 3;
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 12%, transparent 82%, rgba(0,0,0,.42));
      mix-blend-mode: screen; opacity: .55;
    }
    #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 12px calc(14px + var(--safe-bottom)); pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }
    .hidden { display: none !important; }
    .brand-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
    .fighter-card { min-width: 0; padding: 8px; border: 2px solid rgba(255,255,255,.12); background: linear-gradient(180deg, rgba(29,13,57,.88), rgba(7,3,16,.76)); box-shadow: 0 8px 24px rgba(0,0,0,.34), inset 0 0 0 1px rgba(255,255,255,.04); transform: skewX(-4deg); }
    .fighter-card.rival { transform: skewX(4deg); text-align: right; }
    .name { font-family: 'Bangers', cursive; letter-spacing: .05em; font-size: clamp(1rem, 5vw, 1.55rem); line-height: .9; text-shadow: 0 3px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: .64rem; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); font-weight: 700; margin-top: 2px; }
    .life-shell { margin-top: 7px; height: 16px; border: 2px solid #1b082e; background: #08020f; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
    .life-fill { height: 100%; width: 100%; transition: width .28s ease, background .2s ease; background: linear-gradient(90deg, var(--hero-deep), var(--hero), #e9ffff); box-shadow: 0 0 16px rgba(37,244,255,.58); }
    .rival .life-fill { margin-left: auto; background: linear-gradient(90deg, #ffe3ea, var(--rival), var(--rival-deep)); box-shadow: 0 0 16px rgba(255,49,95,.55); }
    .versus-medal { align-self: center; width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--gold); display: grid; place-items: center; font-family: 'Bangers'; font-size: 1.55rem; color: #1a061c; background: radial-gradient(circle, #fff0a2, var(--gold) 64%, #b86c22); box-shadow: 0 0 24px rgba(255,209,90,.55), 0 6px 0 #421925; text-shadow: 0 1px rgba(255,255,255,.55); }
    .clock-strip { margin-top: 8px; padding: 5px; border: 1px solid rgba(255,209,90,.3); background: rgba(5,2,10,.66); }
    #timer-bar { height: 7px; width: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), #fff8bc, var(--rival)); box-shadow: 0 0 16px rgba(255,209,90,.35); transition: width .05s linear; }
    #announcer-panel { position: absolute; top: 15.5%; left: 12px; right: 12px; padding: 14px 14px 13px; border: 2px solid var(--edge); border-radius: 18px; background: linear-gradient(180deg, rgba(22,8,43,.9), rgba(7,3,16,.8)); box-shadow: 0 18px 42px rgba(0,0,0,.42), inset 0 0 24px rgba(255,209,90,.05); text-align: center; }
    .circuit-tag { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 999px; background: rgba(255,209,90,.1); border: 1px solid rgba(255,209,90,.42); color: #ffe79a; font-family: 'Press Start 2P'; font-size: .52rem; letter-spacing: .04em; }
    .title { margin: 8px 0 2px; font-family: 'Bangers'; font-size: clamp(2rem, 10vw, 3.45rem); letter-spacing: .035em; line-height: .82; color: #fff9df; text-shadow: 0 4px 0 #49152b, 0 0 22px rgba(255,209,90,.4); }
    .directive { margin: 7px auto 8px; max-width: 30rem; color: #e8dfff; text-transform: uppercase; font-size: .78rem; letter-spacing: .14em; font-weight: 700; }
    #q-text { margin: 0; font-size: clamp(1.03rem, 4.2vw, 1.32rem); line-height: 1.15; color: #fff; font-weight: 700; }
    #options-container { display: grid; grid-template-columns: 1fr; gap: 9px; width: 100%; padding-bottom: 2px; }
    .btn-opt { width: 100%; min-height: 58px; padding: 10px 12px; border: 2px solid rgba(255,255,255,.12); border-left: 7px solid var(--gold); border-radius: 16px; color: #fff; text-align: left; font-family: 'Rajdhani'; font-weight: 800; font-size: clamp(.98rem, 4.3vw, 1.18rem); letter-spacing: .015em; background: linear-gradient(105deg, rgba(35,12,61,.92), rgba(13,5,29,.92)); box-shadow: 0 10px 22px rgba(0,0,0,.36), inset 0 0 0 1px rgba(255,255,255,.04); position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn-opt::before { content: attr(data-move); display: inline-grid; place-items: center; width: 38px; height: 32px; margin-right: 10px; border-radius: 8px; background: linear-gradient(180deg, #ffe97d, #e57b27); color: #220817; font-family: 'Bangers'; font-size: 1.18rem; box-shadow: 0 3px 0 #5a1c20; vertical-align: middle; }
    .btn-opt::after { content: ''; position: absolute; inset: -40% -35%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent); transform: translateX(-80%) rotate(16deg); transition: transform .25s; pointer-events: none; }
    .btn-opt:active { transform: scale(.985); }
    .btn-opt:focus-visible { outline: 3px solid var(--hero); outline-offset: 2px; }
    .btn-opt:active::after, .btn-opt:focus-visible::after { transform: translateX(80%) rotate(16deg); }
    .btn-opt.is-correct { border-color: var(--hero); border-left-color: var(--hero); background: linear-gradient(105deg, rgba(7,91,128,.96), rgba(9,23,52,.92)); box-shadow: 0 0 28px rgba(37,244,255,.36); }
    .btn-opt.is-wrong { border-color: var(--rival); border-left-color: var(--rival); background: linear-gradient(105deg, rgba(112,12,43,.96), rgba(28,5,22,.92)); box-shadow: 0 0 28px rgba(255,49,95,.32); }
    .shake { animation: shake .38s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(4px); } 30%,50%,70% { transform: translateX(-7px); } 40%,60% { transform: translateX(7px); } }
    #gif-overlay { position: absolute; right: 12px; bottom: calc(268px + var(--safe-bottom)); width: clamp(82px, 20vw, 136px); height: clamp(82px, 20vw, 136px); border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,209,90,.5); background: #07030f; box-shadow: 0 16px 36px rgba(0,0,0,.45), 0 0 20px rgba(255,209,90,.16); opacity: 0; transform: translateY(14px) scale(.92); transition: opacity .22s ease, transform .22s ease; pointer-events: none; z-index: 25; }
    #gif-overlay.is-visible { opacity: .94; transform: translateY(0) scale(1); }
    #gif-overlay img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #gif-caption { position: absolute; left: 7px; right: 7px; bottom: 7px; padding: 5px 6px; border-radius: 999px; background: rgba(8,3,17,.78); color: #fff5c8; font-family: 'Press Start 2P'; font-size: .47rem; text-align: center; }
    #impact-callout { position: absolute; left: 50%; top: 49%; transform: translate(-50%, -50%) scale(.8); opacity: 0; z-index: 20; pointer-events: none; font-family: 'Bangers'; font-size: clamp(2.6rem, 14vw, 5rem); color: #fff8c6; text-shadow: 0 5px 0 #571a26, 0 0 22px rgba(255,209,90,.55); letter-spacing: .04em; transition: opacity .16s, transform .16s; white-space: nowrap; }
    #impact-callout.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #game-over-screen { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: radial-gradient(circle at top, rgba(255,209,90,.15), transparent 34%), linear-gradient(180deg, rgba(10,3,20,.95), rgba(3,1,9,.98)); }
    #go-title { margin: 0; font-family: 'Bangers'; font-size: clamp(3.2rem, 16vw, 6rem); line-height: .82; color: #fff5c8; text-shadow: 0 6px 0 #541629, 0 0 26px rgba(255,209,90,.44); }
    #go-score { margin: 0 0 12px; color: #e6d7ff; max-width: 24rem; font-weight: 700; font-size: 1.05rem; }
    #restart-btn { min-height: 58px; padding: 12px 22px; border: 3px solid #fff1ad; border-radius: 999px; background: linear-gradient(180deg, #ffe577, #e77b24); color: #210615; font-family: 'Bangers'; letter-spacing: .06em; font-size: 1.55rem; box-shadow: 0 7px 0 #651d21, 0 0 26px rgba(255,209,90,.35); -webkit-tap-highlight-color: transparent; }
    @media (min-width: 700px) { #game-container { max-width: 560px; margin: 0 auto; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 70px rgba(0,0,0,.75); } }
    @media (max-height: 640px) { #announcer-panel { top: 13%; padding: 10px; } .title { font-size: 2rem; } .directive { display: none; } .btn-opt { min-height: 49px; } #gif-overlay { bottom: 232px; } }
  </style>
</head>
<body>
  <audio id="bgm_main" data-editable="audio" data-label="Heroic Tournament BGM" src="https://gamezone-virid.vercel.app/assets/audios/bgm/heroic_bgm_01.mp3" preload="auto" loop></audio>
  <audio id="sfx_correct" data-editable="audio" data-label="Clean Hit SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/heroic_item_01.mp3" preload="auto"></audio>
  <audio id="sfx_wrong" data-editable="audio" data-label="Blocked Strike SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/heroic_enemy_01.mp3" preload="auto"></audio>
  <audio id="sfx_hit" data-editable="audio" data-label="Impact SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/heroic_enemy_02.mp3" preload="auto"></audio>
  <audio id="sfx_round" data-editable="audio" data-label="Round Bell SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/heroic_character_01.mp3" preload="auto"></audio>
  <audio id="sfx_victory" data-editable="audio" data-label="Circuit Victory SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/heroic_item_02.mp3" preload="auto"></audio>
  <audio id="sfx_gameover" data-editable="audio" data-label="Defeat SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/heroic_enemy_02.mp3" preload="auto"></audio>

  <script id="game-config" type="application/x-game-config">
  { "aiSpeed": { "type": "number", "label": "Rival Reaction Speed", "value": 4, "min": 1, "max": 10 }, "themeColor": { "type": "color", "label": "Arcade Accent", "value": "#25f4ff" } }
  </script>

  <div id="game-container">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>
    <div id="impact-callout" aria-hidden="true">COUNTER!</div>
    <div id="ui-layer">
      <div id="gif-overlay" class="hidden" aria-live="polite">
        <img id="gif-image" src="https://i.giphy.com/AYNwsHfAs2AIoWwFqX.webp" alt="Combo feedback">
        <div id="gif-caption">ROUND ONE</div>
      </div>
      <header id="hud">
        <div class="brand-row" aria-label="fighter life meters">
          <section class="fighter-card hero">
            <div class="name">Rising Dragon</div>
            <div class="sub">Player corner</div>
            <div class="life-shell"><div id="hp-player" class="life-fill"></div></div>
          </section>
          <div class="versus-medal">VS</div>
          <section class="fighter-card rival">
            <div class="name">Crimson Tiger</div>
            <div class="sub">Rival corner</div>
            <div class="life-shell"><div id="hp-enemy" class="life-fill"></div></div>
          </section>
        </div>
        <div class="clock-strip" aria-label="combo timer"><div id="timer-bar"></div></div>
      </header>

      <main id="announcer-panel">
        <div id="q-category" class="circuit-tag">WORLD CIRCUIT</div>
        <h1 class="title">Combo Clash</h1>
        <p class="directive">Read the callout. Tap the clean special before your rival reacts.</p>
        <h2 id="q-text">Loading the bracket...</h2>
      </main>

      <section id="options-container" aria-label="special move choices"></section>

      <section id="game-over-screen" class="hidden" aria-live="assertive">
        <h1 id="go-title">CHAMPION!</h1>
        <p id="go-score">The crowd is waiting for the next rivalry.</p>
        <button id="restart-btn" type="button">Runback Match</button>
      </section>
    </div>
  </div>

  <script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  let cw = 0, ch = 0, dpr = 1, initialized = false;
  let gameState = 'INIT';
  let lastTime = 0, dt = 0;
  let gameConfig = { aiSpeed: 4, themeColor: '#25f4ff' };
  let state = { playerHp: 100, enemyHp: 100, currentQIndex: 0, timer: 0, maxTime: 10, roundActive: false, score: 0, particles: [], shake: 0, lastResult: 'READY' };
  const QUESTIONS = [
    { cat: 'TOKYO TECH DOJO', q: 'What does HTML stand for?', a: ['HyperText Markup Language', 'HighText Machine Language', 'HyperText and Links', 'None of these'], c: 0 },
    { cat: 'METRO CINEMA RING', q: 'Who directed "Inception"?', a: ['Christopher Nolan', 'Steven Spielberg', 'James Cameron', 'Quentin Tarantino'], c: 0 },
    { cat: 'PARIS WORLD CUP ARENA', q: 'Which country won the 2018 FIFA World Cup?', a: ['France', 'Croatia', 'Brazil', 'Germany'], c: 0 },
    { cat: 'SILICON BACKSTREET', q: 'Which language runs in a web browser?', a: ['JavaScript', 'Java', 'C++', 'Python'], c: 0 },
    { cat: 'NEON ACTION LOT', q: 'Which movie features the quote "I\'ll be back"?', a: ['The Terminator', 'RoboCop', 'Total Recall', 'Predator'], c: 0 },
    { cat: 'MARATHON PLAZA', q: 'How long is a marathon?', a: ['42.195 km', '40 km', '50 km', '21 km'], c: 0 },
    { cat: 'CPU TRAINING HALL', q: 'What is the brain of the computer?', a: ['CPU', 'RAM', 'GPU', 'HDD'], c: 0 },
    { cat: 'ARMORED STAR STAGE', q: 'Who played Iron Man?', a: ['Robert Downey Jr.', 'Chris Evans', 'Chris Hemsworth', 'Mark Ruffalo'], c: 0 },
    { cat: 'CENTER COURT DUEL', q: 'In tennis, what is a score of zero called?', a: ['Love', 'Nil', 'Zero', 'O'], c: 0 },
    { cat: 'ANDROID ROOFTOP', q: 'Which company owns Android?', a: ['Google', 'Apple', 'Microsoft', 'Samsung'], c: 0 }
  ];
  let questionDeck = [];
  const MOVE_LABELS = ['Jab', 'Flash Kick', 'Dragon Palm', 'Tiger Guard'];
  const ROUND_GIFS = {
    hype: { src: 'https://i.giphy.com/AYNwsHfAs2AIoWwFqX.webp', label: 'ROUND LIVE' },
    win: { src: 'https://i.giphy.com/1zmG8avB83Uvm.webp', label: 'CLEAN HIT' },
    fail: { src: 'https://i.giphy.com/KBUVDT0bAjYpoHU8Wx.webp', label: 'COUNTERED' }
  };
  let audioCtx = null, audioUnlocked = false, bgmStarted = false, activeEffectTimeout = null, aiTimeout = null;
  const sfxBuffers = {};
  const bgm = document.getElementById('bgm_main');
  const AudioSys = {
    ensureContext() { if (!audioCtx) { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return null; audioCtx = new Ctx(); } return audioCtx; },
    async init() { /* AudioContext is created lazily from a user gesture for mobile autoplay safety. */ },
    playSfx(id) { if (!audioUnlocked) return; const ctxRef = this.ensureContext(); if (!ctxRef) return; if (ctxRef.state === 'suspended') ctxRef.resume().catch(() => {}); const buf = sfxBuffers[id]; if (buf) { const src = ctxRef.createBufferSource(); const gain = ctxRef.createGain(); src.buffer = buf; gain.gain.value = id === 'sfx_round' ? .3 : id === 'sfx_hit' ? .42 : .38; src.connect(gain); gain.connect(ctxRef.destination); src.start(0); return; } const osc = ctxRef.createOscillator(); const gain = ctxRef.createGain(); osc.connect(gain); gain.connect(ctxRef.destination); if (id.includes('correct') || id.includes('victory')) { osc.type = 'triangle'; osc.frequency.setValueAtTime(720, ctxRef.currentTime); osc.frequency.exponentialRampToValueAtTime(1320, ctxRef.currentTime + .13); } else if (id.includes('round')) { osc.type = 'square'; osc.frequency.setValueAtTime(260, ctxRef.currentTime); osc.frequency.exponentialRampToValueAtTime(620, ctxRef.currentTime + .11); } else { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(210, ctxRef.currentTime); osc.frequency.linearRampToValueAtTime(72, ctxRef.currentTime + .18); } gain.gain.setValueAtTime(.16, ctxRef.currentTime); gain.gain.exponentialRampToValueAtTime(.01, ctxRef.currentTime + .22); osc.start(); osc.stop(ctxRef.currentTime + .23); },
    startBgm() { if (bgmStarted) return; bgm.volume = .18; bgm.play().then(() => { bgmStarted = true; }).catch(() => {}); },
    resume() { audioUnlocked = true; const ctxRef = this.ensureContext(); if (ctxRef && ctxRef.state === 'suspended') ctxRef.resume().catch(() => {}); this.startBgm(); }
  };
  const vibrate = type => { try { window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({ action:'vibrate', requestId:'h5-' + Date.now(), version:'1.0', params:{ style: type === 'heavy' ? 'heavy' : 'light' } }); } catch(e) {} };
  try { const cfg = JSON.parse(document.getElementById('game-config').textContent); window.gameConfigDefs = cfg; for (const k in cfg) gameConfig[k] = cfg[k].value; } catch(e) {}
  class Particle { constructor(x, y, color, kind = 'spark') { this.x=x; this.y=y; this.color=color; this.kind=kind; const a = Math.random()*Math.PI*2; const s = Math.random()*240+70; this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s - (kind === 'slash' ? 80 : 0); this.life=1; this.decay=Math.random()*1.8+1.1; this.size=Math.random()*6+3; this.spin=Math.random()*6; } update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.vy+=80*dt; this.life-=this.decay*dt; } draw(ctx){ ctx.save(); ctx.globalAlpha=Math.max(0,this.life); ctx.translate(this.x,this.y); ctx.rotate(this.spin*this.life); ctx.fillStyle=this.color; if(this.kind==='slash'){ ctx.fillRect(-this.size*2,-1,this.size*4,3); } else { ctx.beginPath(); ctx.moveTo(0,-this.size); ctx.lineTo(this.size,0); ctx.lineTo(0,this.size); ctx.lineTo(-this.size,0); ctx.closePath(); ctx.fill(); } ctx.restore(); } }
  function drawFighter(ctx, x, y, scale, facing, palette, phase) { ctx.save(); ctx.translate(x, y + Math.sin(phase)*4); ctx.scale(facing*scale, scale); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.shadowBlur=18; ctx.shadowColor=palette.glow; ctx.fillStyle=palette.dark; ctx.strokeStyle=palette.trim; ctx.lineWidth=8; ctx.beginPath(); ctx.ellipse(0, -82, 23, 28, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=palette.main; ctx.beginPath(); ctx.moveTo(-30,-48); ctx.quadraticCurveTo(0,-75,32,-48); ctx.lineTo(24,22); ctx.quadraticCurveTo(0,38,-25,22); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.strokeStyle=palette.trim; ctx.lineWidth=11; ctx.beginPath(); ctx.moveTo(-24,-34); ctx.lineTo(-70,-16 + Math.sin(phase)*5); ctx.moveTo(26,-34); ctx.lineTo(72,-56 - Math.sin(phase)*5); ctx.stroke(); ctx.strokeStyle=palette.accent; ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(-14,24); ctx.lineTo(-42,78); ctx.moveTo(16,24); ctx.lineTo(44,76); ctx.stroke(); ctx.fillStyle=palette.trim; ctx.fillRect(-38, -55, 76, 13); ctx.fillStyle=palette.accent; ctx.beginPath(); ctx.moveTo(38,-88); ctx.lineTo(62,-98); ctx.lineTo(47,-72); ctx.closePath(); ctx.fill(); ctx.restore(); }
  let bgOffset = 0;
  function drawBackground(ctx, dt) { const t = Date.now()*.001; const g = ctx.createLinearGradient(0,0,0,ch); g.addColorStop(0,'#170735'); g.addColorStop(.48,'#2a0d3c'); g.addColorStop(1,'#07020d'); ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch); const shakeX = state.shake > 0 ? (Math.random()-.5)*16*state.shake : 0; ctx.save(); ctx.translate(shakeX,0); for(let i=0;i<8;i++){ const x=(i+.5)*cw/8 + Math.sin(t+i)*8; ctx.fillStyle = i%2 ? 'rgba(255,209,90,.12)' : 'rgba(37,244,255,.1)'; ctx.beginPath(); ctx.moveTo(x-18,0); ctx.lineTo(x+20,0); ctx.lineTo(x+8,ch*.27); ctx.lineTo(x-8,ch*.27); ctx.closePath(); ctx.fill(); } ctx.fillStyle='rgba(255,248,223,.12)'; for(let i=0;i<34;i++){ const x=(i/33)*cw; const y=ch*.42 + Math.sin(t*2+i)*10; ctx.beginPath(); ctx.arc(x,y,2+(i%4),0,Math.PI*2); ctx.fill(); } const ringTop=ch*.55; ctx.fillStyle='rgba(8,2,14,.9)'; ctx.fillRect(0, ringTop, cw, ch-ringTop); bgOffset=(bgOffset+26*dt)%44; ctx.strokeStyle='rgba(255,209,90,.18)'; ctx.lineWidth=1; for(let y=ringTop+bgOffset;y<ch;y+=44){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cw,y); ctx.stroke(); } for(let i=-8;i<16;i++){ const x=cw/2+i*50; ctx.beginPath(); ctx.moveTo(cw/2, ringTop); ctx.lineTo(x+i*40,ch); ctx.stroke(); } ctx.strokeStyle='rgba(255,248,223,.42)'; ctx.lineWidth=5; for(let r=0;r<3;r++){ const y=ch*.50+r*26; ctx.beginPath(); ctx.moveTo(0,y); ctx.quadraticCurveTo(cw/2,y-12,cw,y); ctx.stroke(); } const pulse=1+Math.sin(t*5)*.035; drawFighter(ctx, cw*.25, ch*.72, Math.max(.64, Math.min(1, cw/440))*pulse, 1, { main:'#106ee8', dark:'#061839', trim:'#25f4ff', accent:'#fff2a8', glow:'rgba(37,244,255,.58)' }, t*4); drawFighter(ctx, cw*.75, ch*.72, Math.max(.64, Math.min(1, cw/440))*pulse, -1, { main:'#901a34', dark:'#270612', trim:'#ff315f', accent:'#ffd15a', glow:'rgba(255,49,95,.5)' }, t*4+1.4); ctx.fillStyle='rgba(37,244,255,.16)'; ctx.beginPath(); ctx.ellipse(cw*.25,ch*.84,70*pulse,14,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,49,95,.15)'; ctx.beginPath(); ctx.ellipse(cw*.75,ch*.84,70*pulse,14,0,0,Math.PI*2); ctx.fill(); ctx.font=`${Math.max(12,Math.min(18,cw*.035))}px 'Press Start 2P'`; ctx.textAlign='center'; ctx.fillStyle='rgba(255,248,223,.64)'; ctx.fillText('RISING DRAGON', cw*.25, ch*.91); ctx.fillText('CRIMSON TIGER', cw*.75, ch*.91); ctx.restore(); }
  function initGame(){ if(initialized) return; AudioSys.init(); questionDeck=[...QUESTIONS].sort(()=>Math.random()-.5); resetMatch(); initialized=true; requestAnimationFrame(loop); }
  function resetMatch(){ state.playerHp=100; state.enemyHp=100; state.currentQIndex=0; state.score=0; state.lastResult='READY'; updateHUD(); setState('PLAYING'); nextRound(); }
  function showReactionGif(type, duration=1100){ const overlay=document.getElementById('gif-overlay'), image=document.getElementById('gif-image'), caption=document.getElementById('gif-caption'); const selected=ROUND_GIFS[type]||ROUND_GIFS.hype; if(!overlay||!image||!caption) return; image.src=selected.src; caption.textContent=selected.label; overlay.classList.remove('hidden'); requestAnimationFrame(()=>overlay.classList.add('is-visible')); if(activeEffectTimeout) clearTimeout(activeEffectTimeout); activeEffectTimeout=setTimeout(()=>{ overlay.classList.remove('is-visible'); setTimeout(()=>overlay.classList.add('hidden'),220); }, duration); }
  function impactText(text){ const el=document.getElementById('impact-callout'); el.textContent=text; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),520); }
  function nextRound(){ if(state.playerHp<=0 || state.enemyHp<=0){ setState('GAMEOVER'); return; } if(state.currentQIndex>=questionDeck.length){ questionDeck=[...QUESTIONS].sort(()=>Math.random()-.5); state.currentQIndex=0; } const q=questionDeck[state.currentQIndex++]; state.timer=state.maxTime; state.roundActive=true; document.getElementById('q-category').textContent=q.cat; document.getElementById('q-text').textContent=q.q; const optsCont=document.getElementById('options-container'); optsCont.innerHTML=''; showReactionGif('hype',900); AudioSys.playSfx('sfx_round'); q.a.forEach((ans,idx)=>{ const btn=document.createElement('button'); btn.type='button'; btn.className='btn-opt'; btn.textContent=ans; btn.dataset.idx=idx; btn.dataset.move=MOVE_LABELS[idx] || 'Strike'; btn.addEventListener('click',()=>handleInput(idx,q.c)); optsCont.appendChild(btn); }); scheduleAI(q); }
  function scheduleAI(q){ if(aiTimeout) clearTimeout(aiTimeout); const baseSpeed=6-(gameConfig.aiSpeed*.5); const reaction=(baseSpeed+Math.random()*2)*1000; aiTimeout=setTimeout(()=>{ if(!state.roundActive) return; const isCorrect=Math.random()<.8; resolveRound(isCorrect?'ENEMY_WIN':'ENEMY_FAIL'); }, reaction); }
  function handleInput(selectedIdx, correctIdx){ if(!state.roundActive) return; AudioSys.resume(); const btn=document.getElementById('options-container').children[selectedIdx]; if(selectedIdx===correctIdx){ if(btn) btn.classList.add('is-correct'); resolveRound('PLAYER_WIN'); } else { if(btn) btn.classList.add('is-wrong','shake'); resolveRound('PLAYER_FAIL'); } }
  function resolveRound(result){ state.roundActive=false; if(aiTimeout) clearTimeout(aiTimeout); const damage=25; state.lastResult=result; if(result==='PLAYER_WIN'){ state.enemyHp=Math.max(0,state.enemyHp-damage); spawnParticles(cw*.63,ch*.58,'#25f4ff','slash'); AudioSys.playSfx('sfx_correct'); AudioSys.playSfx('sfx_hit'); showReactionGif('win'); impactText('CLEAN HIT!'); vibrate('light'); } else if(result==='ENEMY_WIN'){ state.playerHp=Math.max(0,state.playerHp-damage); state.shake=.5; spawnParticles(cw*.37,ch*.58,'#ff315f','slash'); AudioSys.playSfx('sfx_wrong'); showReactionGif('fail'); impactText('COUNTER!'); vibrate('heavy'); } else if(result==='PLAYER_FAIL'){ state.playerHp=Math.max(0,state.playerHp-damage); state.shake=.3; spawnParticles(cw*.36,ch*.58,'#ff315f','spark'); AudioSys.playSfx('sfx_wrong'); showReactionGif('fail'); impactText('WHIFF!'); vibrate('heavy'); } else if(result==='ENEMY_FAIL'){ state.enemyHp=Math.max(0,state.enemyHp-damage); spawnParticles(cw*.64,ch*.58,'#ffd15a','spark'); AudioSys.playSfx('sfx_correct'); AudioSys.playSfx('sfx_hit'); showReactionGif('win'); impactText('PUNISH!'); } else if(result==='TIMEOUT'){ state.playerHp=Math.max(0,state.playerHp-10); state.enemyHp=Math.max(0,state.enemyHp-10); state.shake=.22; spawnParticles(cw*.5,ch*.58,'#ffd15a','spark'); AudioSys.playSfx('sfx_wrong'); showReactionGif('fail'); impactText('CLASH!'); } updateHUD(); setTimeout(()=>nextRound(),1200); }
  function updateHUD(){ const player=document.getElementById('hp-player'), enemy=document.getElementById('hp-enemy'); player.style.width=state.playerHp+'%'; enemy.style.width=state.enemyHp+'%'; player.style.background = state.playerHp < 30 ? 'linear-gradient(90deg,#7d1010,#ff3838,#ffd0d0)' : ''; }
  function spawnParticles(x,y,color,kind='spark'){ for(let i=0;i<24;i++) state.particles.push(new Particle(x,y,color,kind)); }
  function setState(newState){ gameState=newState; const hud=document.getElementById('hud'), qPanel=document.getElementById('announcer-panel'), opts=document.getElementById('options-container'), go=document.getElementById('game-over-screen'); if(newState==='PLAYING'){ hud.classList.remove('hidden'); qPanel.classList.remove('hidden'); opts.classList.remove('hidden'); go.classList.add('hidden'); } else if(newState==='GAMEOVER'){ hud.classList.add('hidden'); qPanel.classList.add('hidden'); opts.classList.add('hidden'); go.classList.remove('hidden'); const title=document.getElementById('go-title'), score=document.getElementById('go-score'); if(state.playerHp>0){ title.textContent='WORLD CHAMPION!'; score.textContent='Rising Dragon read the final callout and took the belt.'; AudioSys.playSfx('sfx_victory'); showReactionGif('win',1800); } else { title.textContent='KNOCKED OUT'; score.textContent='Crimson Tiger stole the spotlight. Train the matchup and run it back.'; AudioSys.playSfx('sfx_gameover'); showReactionGif('fail',1800); } } }
  function handleGlobalInput(e){ AudioSys.resume(); if(gameState==='GAMEOVER' && e.target.id==='restart-btn') resetMatch(); }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ bgm.pause(); bgmStarted=false; } else if(gameState!=='INIT') AudioSys.startBgm(); });
  window.addEventListener('pointerdown', handleGlobalInput, { passive: true });
  document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);
  function loop(timestamp){ if(!lastTime) lastTime=timestamp; dt=(timestamp-lastTime)/1000; lastTime=timestamp; if(dt>.05) dt=.05; ctx.setTransform(dpr,0,0,dpr,0,0); drawBackground(ctx,dt); if(gameState==='PLAYING' && state.roundActive){ state.timer-=dt; const pct=Math.max(0,state.timer/state.maxTime)*100; document.getElementById('timer-bar').style.width=pct+'%'; if(state.timer<=0) resolveRound('TIMEOUT'); } for(let i=state.particles.length-1;i>=0;i--){ const p=state.particles[i]; p.update(dt); p.draw(ctx); if(p.life<=0) state.particles.splice(i,1); } requestAnimationFrame(loop); }
  const ro = new ResizeObserver(entries=>{ const { width, height } = entries[0].contentRect; dpr=window.devicePixelRatio || 1; canvas.width=Math.max(1,Math.floor(width*dpr)); canvas.height=Math.max(1,Math.floor(height*dpr)); canvas.style.width=width+'px'; canvas.style.height=height+'px'; cw=width; ch=height; ctx.setTransform(dpr,0,0,dpr,0,0); if(!initialized) initGame(); });
  document.addEventListener('DOMContentLoaded',()=>ro.observe(document.getElementById('game-container')));
  </script>
