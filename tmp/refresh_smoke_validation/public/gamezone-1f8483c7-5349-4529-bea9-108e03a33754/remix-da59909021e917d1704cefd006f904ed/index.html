<head>

    <style>
        :root {
            --bg-deep: #070b17;
            --bg-mid: #0f172a;
            --panel: rgba(10, 18, 36, 0.8);
            --panel-edge: rgba(110, 231, 255, 0.22);
            --hero-cyan: #67f3ff;

            --bot-pink: #ff4f8f;
            --bot-pink-strong: #ff0055;
            --warning: #ffd966;
            --text-main: #f7fbff;
            --text-soft: #bbd8ff;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 240, 255, 0.12), transparent 30%),
                radial-gradient(circle at 85% 20%, rgba(255, 0, 85, 0.14), transparent 24%),

        .btn-opt {
            transition: transform 0.1s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
            min-height: 60px;

        }
        .btn-opt::before {
            content: '';

            transform: translateX(-100%);

        .btn-opt:focus-visible::before { transform: translateX(100%); }
        .btn-opt:active { transform: scale(0.98); }

        .btn-opt.is-wrong {
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.28), rgba(255, 79, 143, 0.16));
            border-color: var(--bot-pink-strong) !important;
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.2);
        }
        .badge-pill {
            background: rgba(103, 243, 255, 0.08);
            border: 1px solid rgba(103, 243, 255, 0.24);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }
        .hidden { display: none !important; }
        #ui-layer { pointer-events: none; }
        #ui-layer > * { pointer-events: auto; }
        #question-panel {
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(103, 243, 255, 0.1);
        }
        #game-over-screen {
            background:
                radial-gradient(circle at top, rgba(0, 240, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(5, 9, 22, 0.92), rgba(8, 11, 24, 0.95));
        }
        #restart-btn {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.08em;
        }
        #gif-overlay {
            position: absolute;
            right: 14px;
            bottom: 110px;
            width: clamp(86px, 18vw, 150px);
            height: clamp(86px, 18vw, 150px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(103, 243, 255, 0.26);

            transform: translateY(14px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 55;
        }
        #gif-overlay.is-visible {
            opacity: 0.95;

        }
        #gif-overlay img {
            width: 100%;

            object-fit: cover;

        }
        #gif-caption {

            }
        }
    </style>
</head>

<script>
// §2 System Invariants
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;
let initialized = false;
let gameState = 'INIT'; // INIT, PLAYING, ROUND_END, GAMEOVER
let lastTime = 0;
let dt = 0;

// Config & State
let gameConfig = { aiSpeed: 4, themeColor: '#00f0ff' };
let state = {
    playerHp: 100,
    enemyHp: 100,
    currentQIndex: 0,
    timer: 0,
    maxTime: 10,
    roundActive: false,
    score: 0,
    particles: [],
    shake: 0
};

// Question DB
const QUESTIONS = [
    { cat: 'TECH', q: 'What does HTML stand for?', a: ['HyperText Markup Language', 'HighText Machine Language', 'HyperText and Links', 'None of these'], c: 0 },
    { cat: 'CINEMA', q: 'Who directed "Inception"?', a: ['Christopher Nolan', 'Steven Spielberg', 'James Cameron', 'Quentin Tarantino'], c: 0 },
    { cat: 'SPORTS', q: 'Which country won the 2018 FIFA World Cup?', a: ['France', 'Croatia', 'Brazil', 'Germany'], c: 0 },
    { cat: 'TECH', q: 'Which language runs in a web browser?', a: ['JavaScript', 'Java', 'C++', 'Python'], c: 0 },
    { cat: 'CINEMA', q: 'Which movie features the quote "I\'ll be back"?', a: ['The Terminator', 'RoboCop', 'Total Recall', 'Predator'], c: 0 },
    { cat: 'SPORTS', q: 'How long is a marathon?', a: ['42.195 km', '40 km', '50 km', '21 km'], c: 0 },
    { cat: 'TECH', q: 'What is the brain of the computer?', a: ['CPU', 'RAM', 'GPU', 'HDD'], c: 0 },
    { cat: 'CINEMA', q: 'Who played Iron Man?', a: ['Robert Downey Jr.', 'Chris Evans', 'Chris Hemsworth', 'Mark Ruffalo'], c: 0 },
    { cat: 'SPORTS', q: 'In tennis, what is a score of zero called?', a: ['Love', 'Nil', 'Zero', 'O'], c: 0 },
    { cat: 'TECH', q: 'Which company owns Android?', a: ['Google', 'Apple', 'Microsoft', 'Samsung'], c: 0 }
];
let questionDeck = [];
const ROUND_GIFS = {
    hype: {
        src: 'https://i.giphy.com/45a5As2Su3RykbNB74.webp',
        label: 'DUEL LIVE'
    },
    win: {
        src: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp',
        label: 'CLUTCH POST'
    },
    fail: {
        src: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp',
        label: 'BOT BAITED'
    }
};

// Audio System
let audioCtx = null;
const sfxBuffers = {};
const bgm = document.getElementById('bgm_main');
let bgmStarted = false;
let activeEffectTimeout = null;

const AudioSys = {
    ensureContext() {
        if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            audioCtx = new Ctx();
        }
        return audioCtx;
    },
    async init() {
        const ctxRef = this.ensureContext();
        if (!ctxRef) return;
        const load = async (id) => {
            const el = document.getElementById(id);
            if(!el) return;
            try {
                const res = await fetch(el.src);
                const buf = await res.arrayBuffer();
                sfxBuffers[id] = await ctxRef.decodeAudioData(buf);
            } catch(e) { console.warn('SFX Load Fail', id); }
        };
        await Promise.all(['sfx_correct', 'sfx_wrong', 'sfx_hit', 'sfx_round', 'sfx_victory', 'sfx_gameover'].map(load));
    },
    playSfx(id) {
        const ctxRef = this.ensureContext();
        if (!ctxRef) return;
        if(ctxRef.state === 'suspended') ctxRef.resume().catch(() => {});
        const buf = sfxBuffers[id];
        if (buf) {
            const src = ctxRef.createBufferSource();
            const gain = ctxRef.createGain();
            src.buffer = buf;
            gain.gain.value = id === 'sfx_round' ? 0.32 : id === 'sfx_hit' ? 0.38 : 0.42;
            src.connect(gain);
            gain.connect(ctxRef.destination);
            src.start(0);
        } else {
            const osc = ctxRef.createOscillator();
            const gain = ctxRef.createGain();
            osc.connect(gain);
            gain.connect(ctxRef.destination);
            if (id.includes('correct') || id.includes('victory')) {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(680, ctxRef.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1240, ctxRef.currentTime + 0.14);
            } else if (id.includes('round')) {
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, ctxRef.currentTime);
                osc.frequency.exponentialRampToValueAtTime(540, ctxRef.currentTime + 0.08);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, ctxRef.currentTime);
                osc.frequency.linearRampToValueAtTime(70, ctxRef.currentTime + 0.18);
            }
            gain.gain.setValueAtTime(0.18, ctxRef.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctxRef.currentTime + 0.2);
            osc.start();
            osc.stop(ctxRef.currentTime + 0.2);
        }
    },
    startBgm() {
        if (bgmStarted) return;
        bgm.volume = 0.2;
        bgm.play().then(() => {
            bgmStarted = true;
        }).catch(() => {});
    },
    stopBgm() {
        bgm.pause();
        bgm.currentTime = 0;
        bgmStarted = false;
    },
    resume() {
        const ctxRef = this.ensureContext();
        if(ctxRef && ctxRef.state === 'suspended') ctxRef.resume().catch(() => {});
        this.startBgm();
    }
};

// Vibration
const vibrate = (type) => {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style: type === 'heavy' ? 'heavy' : 'light' }
    });
};

// Config Parser
try {
    const cfg = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfigDefs = cfg;
    for(let k in cfg) gameConfig[k] = cfg[k].value;
} catch(e) {}

// Particle System
class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 200 + 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 2 + 1;
        this.size = Math.random() * 4 + 2;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= this.decay * dt;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1.0;
    }
}

// Background Animation
let bgOffset = 0;
function drawBackground(ctx, dt) {
    // Clear
    const sky = ctx.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, '#111a31');
    sky.addColorStop(0.52, '#0d1730');
    sky.addColorStop(1, '#050912');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cw, ch);

    // Duel spotlights
    const cyanGlow = ctx.createRadialGradient(cw * 0.3, ch * 0.22, 10, cw * 0.3, ch * 0.22, ch * 0.45);
    cyanGlow.addColorStop(0, 'rgba(0, 240, 255, 0.2)');
    cyanGlow.addColorStop(1, 'rgba(0, 240, 255, 0)');
    ctx.fillStyle = cyanGlow;
    ctx.fillRect(0, 0, cw, ch);

    const pinkGlow = ctx.createRadialGradient(cw * 0.72, ch * 0.24, 10, cw * 0.72, ch * 0.24, ch * 0.42);
    pinkGlow.addColorStop(0, 'rgba(255, 0, 85, 0.18)');
    pinkGlow.addColorStop(1, 'rgba(255, 0, 85, 0)');
    ctx.fillStyle = pinkGlow;
    ctx.fillRect(0, 0, cw, ch);
    
    // Grid
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
    ctx.lineWidth = 1;
    bgOffset = (bgOffset + 20 * dt) % 50;
    
    // Perspective Grid
    const horizon = ch * 0.4;
    
    ctx.beginPath();
    // Vertical lines fanning out
    for (let i = -10; i <= 20; i++) {
        const x = cw/2 + (i * 50);
        ctx.moveTo(cw/2, horizon);
        ctx.lineTo(x + (i * 100), ch);
    }
    // Horizontal moving lines
    for (let y = horizon; y < ch; y += 50) {
        let drawY = y + bgOffset;
        if(drawY > ch) drawY -= (ch - horizon);
        // Add perspective scale
        const progress = (drawY - horizon) / (ch - horizon);
        const yPos = horizon + Math.pow(progress, 2) * (ch - horizon);
        
        ctx.moveTo(0, yPos);
        ctx.lineTo(cw, yPos);
    }
    ctx.stroke();
    
    // Floating Particles
    ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
    for(let i=0; i<5; i++) {
        const t = Date.now() * 0.001 + i;
        const x = (Math.sin(t) * 0.5 + 0.5) * cw;
        const y = (Math.cos(t * 0.7) * 0.5 + 0.5) * ch;
        ctx.beginPath();
        ctx.arc(x, y, 2 + i, 0, Math.PI*2);
        ctx.fill();
    }

    // Character-first idle avatars
    const pulse = 1 + Math.sin(Date.now() * 0.004) * 0.04;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${Math.max(48, Math.min(92, cw * 0.09))}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    ctx.globalAlpha = 0.95;
    ctx.shadowBlur = 26;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
    ctx.fillText('😎', cw * 0.24, ch * 0.64);
    ctx.shadowColor = 'rgba(255, 0, 85, 0.45)';
    ctx.fillText('🤖', cw * 0.76, ch * 0.64);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#67f3ff';
    ctx.beginPath();
    ctx.ellipse(cw * 0.24, ch * 0.77, 56 * pulse, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff4f8f';
    ctx.beginPath();
    ctx.ellipse(cw * 0.76, ch * 0.77, 56 * pulse, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.font = `${Math.max(12, Math.min(18, cw * 0.018))}px "Exo 2", sans-serif`;
    ctx.fillStyle = 'rgba(247, 251, 255, 0.72)';
    ctx.textAlign = 'center';
    ctx.fillText('PLAYER REACTOR', cw * 0.24, ch * 0.83);
    ctx.fillText('TREND BOT', cw * 0.76, ch * 0.83);
    ctx.restore();
}

// Core Game Logic
function initGame() {
    if(initialized) return;
    AudioSys.init();
    
    // Shuffle questions
    questionDeck = [...QUESTIONS].sort(() => Math.random() - 0.5);
    
    resetMatch();
    
    initialized = true;
    requestAnimationFrame(loop);
}

function resetMatch() {
    state.playerHp = 100;
    state.enemyHp = 100;
    state.currentQIndex = 0;
    state.score = 0;
    
    updateHUD();
    setState('PLAYING');
    nextRound();
}

function showReactionGif(type, duration = 1100) {
    const overlay = document.getElementById('gif-overlay');
    const image = document.getElementById('gif-image');
    const caption = document.getElementById('gif-caption');
    const selected = ROUND_GIFS[type] || ROUND_GIFS.hype;
    if (!overlay || !image || !caption) return;
    image.src = selected.src;
    caption.textContent = selected.label;
    overlay.classList.remove('hidden');
    requestAnimationFrame(() => overlay.classList.add('is-visible'));
    if (activeEffectTimeout) clearTimeout(activeEffectTimeout);
    activeEffectTimeout = setTimeout(() => {
        overlay.classList.remove('is-visible');
        setTimeout(() => overlay.classList.add('hidden'), 220);
    }, duration);
}

function nextRound() {
    if(state.playerHp <= 0 || state.enemyHp <= 0) {
        setState('GAMEOVER');
        return;
    }
    
    if(state.currentQIndex >= questionDeck.length) {
        // Reshuffle if ran out
        questionDeck = [...QUESTIONS].sort(() => Math.random() - 0.5);
        state.currentQIndex = 0;
    }
    
    const q = questionDeck[state.currentQIndex];
    state.currentQIndex++;
    state.timer = state.maxTime;
    state.roundActive = true;
    
    // UI Update
    const qPanel = document.getElementById('question-panel');
    const optsCont = document.getElementById('options-container');
    
    document.getElementById('q-category').textContent = q.cat;
    document.getElementById('q-text').textContent = q.q;
    showReactionGif('hype', 900);
    AudioSys.playSfx('sfx_round');
    
    // Generate Options
    optsCont.innerHTML = '';
    q.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-opt w-full p-4 glass rounded-xl text-white font-semibold text-base sm:text-lg border-l-2 border-transparent hover:border-cyan-400 flex items-center text-left shadow-lg';
        btn.textContent = ans;
        btn.dataset.idx = idx;
        
        // [agent-note][stage4] repaired: mobile-actionability | element: answer-buttons | action: use native button click path instead of pointerdown-only divs
        btn.addEventListener('click', () => {
            handleInput(idx, q.c);
        });
        
        optsCont.appendChild(btn);
    });
    
    // AI Logic
    scheduleAI(q);
}

let aiTimeout = null;
function scheduleAI(q) {
    if(aiTimeout) clearTimeout(aiTimeout);
    
    // AI reaction time based on difficulty + random variance
    // Speed 1 (slow) to 10 (fast). Map to 5s down to 1s.
    const baseSpeed = 6 - (gameConfig.aiSpeed * 0.5); 
    const reaction = (baseSpeed + Math.random() * 2) * 1000;
    
    aiTimeout = setTimeout(() => {
        if(!state.roundActive) return;
        // AI Answers
        // 80% chance to be right
        const isCorrect = Math.random() < 0.8;
        if(isCorrect) {
            resolveRound('ENEMY_WIN');
        } else {
            // AI wrong, player doesn't win immediately, but AI takes penalty? 
            // Simpler: AI wrong -> Player gets advantage or nothing happens?
            // Let's make it simple: AI Wrong -> AI takes damage -> Next round
            resolveRound('ENEMY_FAIL');
        }
    }, reaction);
}

function handleInput(selectedIdx, correctIdx) {
    if(!state.roundActive) return;
    
    // Unlock Audio L2
    AudioSys.resume();
    
    if(selectedIdx === correctIdx) {
        resolveRound('PLAYER_WIN');
        // Visual feedback on button
        const btn = document.getElementById('options-container').children[selectedIdx];
        if(btn) {
            btn.classList.add('is-correct');
        }
    } else {
        resolveRound('PLAYER_FAIL');
        const btn = document.getElementById('options-container').children[selectedIdx];
        if(btn) {
            btn.classList.add('is-wrong', 'shake');
        }
    }
}

function resolveRound(result) {
    state.roundActive = false;
    if(aiTimeout) clearTimeout(aiTimeout);
    
    const damage = 25;
    
    if(result === 'PLAYER_WIN') {
        state.enemyHp = Math.max(0, state.enemyHp - damage);
        spawnParticles(cw/2, ch/2, '#00f0ff'); // Burst center
        AudioSys.playSfx('sfx_correct');
        AudioSys.playSfx('sfx_hit');
        showReactionGif('win');
        vibrate('light');
    } else if (result === 'ENEMY_WIN') {
        state.playerHp = Math.max(0, state.playerHp - damage);
        state.shake = 0.5; // Screen shake
        AudioSys.playSfx('sfx_wrong');
        showReactionGif('fail');
        vibrate('heavy');
    } else if (result === 'PLAYER_FAIL') {
        state.playerHp = Math.max(0, state.playerHp - damage); // Penalty for wrong
        state.shake = 0.3;
        AudioSys.playSfx('sfx_wrong');
        showReactionGif('fail');
        vibrate('heavy');
    } else if (result === 'ENEMY_FAIL') {
        state.enemyHp = Math.max(0, state.enemyHp - damage); // AI messed up
        AudioSys.playSfx('sfx_correct'); // Good for player
        AudioSys.playSfx('sfx_hit');
        showReactionGif('win');
    } else if (result === 'TIMEOUT') {
        // Both take damage?
        state.playerHp -= 10;
        state.enemyHp -= 10;
        AudioSys.playSfx('sfx_wrong');
        showReactionGif('fail');
    }
    
    updateHUD();
    
    setTimeout(() => {
        nextRound();
    }, 1200);
}

function updateHUD() {
    document.getElementById('hp-player').style.width = state.playerHp + '%';
    document.getElementById('hp-enemy').style.width = state.enemyHp + '%';
    
    // Color shift on low HP
    if(state.playerHp < 30) document.getElementById('hp-player').classList.replace('bg-cyan-400', 'bg-red-500');
    else document.getElementById('hp-player').classList.replace('bg-red-500', 'bg-cyan-400');
}

function spawnParticles(x, y, color) {
    for(let i=0; i<20; i++) {
        state.particles.push(new Particle(x, y, color));
    }
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const qPanel = document.getElementById('question-panel');
    const opts = document.getElementById('options-container');
    const go = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        qPanel.classList.remove('hidden');
        opts.classList.remove('hidden');
        go.classList.add('hidden');
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        qPanel.classList.add('hidden');
        opts.classList.add('hidden');
        go.classList.remove('hidden');
        
        const title = document.getElementById('go-title');
        const score = document.getElementById('go-score');
        if(state.playerHp > 0) {
            title.textContent = "TREND SECURED";
            title.className = "teko text-6xl text-white mb-2 neon-text-cyan";
            score.textContent = "Your feed outposted the bot.";
            AudioSys.playSfx('sfx_victory');
            showReactionGif('win', 1800);
        } else {
            title.textContent = "TREND LOST";
            title.className = "teko text-6xl text-white mb-2 neon-text-pink";
            score.textContent = "The bot stole the spotlight.";
            AudioSys.playSfx('sfx_gameover');
            showReactionGif('fail', 1800);
        }
    }
}

// Global Input Handler
function handleGlobalInput(e) {
    AudioSys.resume();
    if (gameState === 'GAMEOVER') {
        // Check if clicked restart button
        if(e.target.id === 'restart-btn') {
            resetMatch();
        }
    }
}
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        bgm.pause();
        bgmStarted = false;
    } else if (gameState !== 'INIT') {
        AudioSys.startBgm();
    }
});
window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);

// Loop
function loop(timestamp) {
    if(!lastTime) lastTime = timestamp;
    dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if(dt > 0.05) dt = 0.05; // Cap dt

    // Canvas Resize Check (Logic only, resize happens in Observer)
    
    // Shake effect
    if(state.shake > 0) {
        const dx = (Math.random() - 0.5) * 20 * state.shake;
        const dy = (Math.random() - 0.5) * 20 * state.shake;
        ctx.setTransform(dpr, 0, 0, dpr, dx, dy);
        state.shake = Math.max(0, state.shake - dt);
    } else {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    drawBackground(ctx, dt);
    
    // Timer Logic
    if(gameState === 'PLAYING' && state.roundActive) {
        state.timer -= dt;
        const bar = document.getElementById('timer-bar');
        const pct = Math.max(0, state.timer / state.maxTime) * 100;
        bar.style.width = pct + '%';
        
        if(state.timer <= 0) {
            resolveRound('TIMEOUT');
        }
    }

    // Particles
    for(let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.update(dt);
        p.draw(ctx);
        if(p.life <= 0) state.particles.splice(i, 1);
    }

    requestAnimationFrame(loop);
}

// Lifecycle
const ro = new ResizeObserver(entries => {
    const entry = entries[0];
    const { width, height } = entry.contentRect;
    
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    
    dpr = window.devicePixelRatio;
    cw = width;
    ch = height;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if(!initialized) {
        initGame();
    }
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.getElementById('game-container'));
});

</script>
