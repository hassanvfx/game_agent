<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Meme Arcade: Viral Cleanup</title>
<!-- [agent-note][stage4] preserved-font-map: titles -> Orbitron, UI -> Rajdhani from catalogs/fonts.json -->

<style>
    :root {
        --bg: #070b16;
        --bg-deep: #05070d;
        --grid: rgba(77, 109, 173, 0.15);
        --panel: rgba(9, 16, 31, 0.84);
        --panel-border: rgba(126, 226, 255, 0.28);
        --panel-shadow: rgba(0, 0, 0, 0.55);
        --hero: #5ff8ff;
        --hero-core: #effdff;
        --accent: #7ce7ff;
        --accent-2: #a855f7;
        --warn: #ffbe55;
        --danger: #ff5f7f;
        --text: #f3f7ff;
        --muted: #9aa7c7;
        --success: #84ffb2;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background:
        radial-gradient(circle at top, rgba(85, 119, 255, 0.12), transparent 30%),
        radial-gradient(circle at bottom, rgba(168, 85, 247, 0.14), transparent 28%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--text); font-family: 'Rajdhani', system-ui, sans-serif; }
    body { position: relative; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    * { box-sizing: border-box; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .grid { display: grid; }
    .block { display: block; }
    .w-full { width: 100%; }
    .w-16 { width: 4rem; }
    .w-4\/5 { width: 80%; }
    .h-full { height: 100%; }
    .h-6 { height: 1.5rem; }
    .h-14 { height: 3.5rem; }
    .h-16 { height: 4rem; }
    .h-24 { height: 6rem; }
    .max-w-lg { max-width: 32rem; }
    .max-w-md { max-width: 28rem; }
    .inset-0 { inset: 0; }
    .top-24 { top: 6rem; }
    .left-4 { left: 1rem; }
    .right-4 { right: 1rem; }
    .-bottom-2 { bottom: -0.5rem; }
    .-right-2 { right: -0.5rem; }
    .z-10 { z-index: 10; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-20 { margin-bottom: 5rem; }
    .mt-2 { margin-top: 0.5rem; }
    .p-2 { padding: 0.5rem; }
    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .p-8 { padding: 2rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .px-8 { padding-left: 2rem; padding-right: 2rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .pb-2 { padding-bottom: 0.5rem; }
    .pb-8 { padding-bottom: 2rem; }
    .gap-1 { gap: 0.25rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-4 { gap: 1rem; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .justify-end { justify-content: flex-end; }
    .justify-start { justify-content: flex-start; }
    .justify-items-center { justify-items: center; }
    .flex-col { flex-direction: column; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .self-center { align-self: center; }
    .overflow-hidden { overflow: hidden; }
    .overflow-visible { overflow: visible; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .rounded { border-radius: 0.25rem; }
    .rounded-full { border-radius: 9999px; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-t-3xl { border-top-left-radius: 1.5rem; border-top-right-radius: 1.5rem; }
    .border { border-width: 1px; border-style: solid; }
    .border-2 { border-width: 2px; border-style: solid; }
    .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
    .border-t-4 { border-top-width: 4px; border-top-style: solid; }
    .border-white { border-color: #fff; }
    .border-gray-600 { border-color: #4b5563; }
    .border-gray-700 { border-color: #374151; }
    .border-red-900 { border-color: #7f1d1d; }
    .border-yellow-500 { border-color: #eab308; }
    .bg-black { background: #000; }
    .bg-black\/95 { background: rgba(0, 0, 0, 0.95); }
    .bg-gray-800 { background: #1f2937; }
    .bg-gray-900 { background: #111827; }
    .bg-green-900 { background: #14532d; }
    .bg-red-600 { background: #dc2626; }
    .bg-yellow-500 { background: #eab308; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
    .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
    .text-6xl { font-size: 3.75rem; line-height: 1; }
    .font-bold { font-weight: 700; }
    .uppercase { text-transform: uppercase; }
    .leading-tight { line-height: 1.25; }
    .tracking-wider { letter-spacing: 0.05em; }
    .tracking-widest { letter-spacing: 0.1em; }
    .tracking-tighter { letter-spacing: -0.05em; }
    .tracking-\[0\.5em\] { letter-spacing: 0.5em; }
    .text-black { color: #000; }
    .text-white { color: #fff; }
    .text-yellow-500 { color: #eab308; }
    .text-yellow-400 { color: #facc15; }
    .text-cyan-400 { color: #22d3ee; }
    .text-red-400 { color: #f87171; }
    .text-red-600 { color: #dc2626; }
    .text-green-400 { color: #4ade80; }
    .text-green-100 { color: #dcfce7; }
    .text-gray-400 { color: #9ca3af; }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
    .shadow-black { --shadow-color: #000; }
    .drop-shadow-md { filter: drop-shadow(0 4px 3px rgba(0,0,0,0.7)); }
    .opacity-0 { opacity: 0; }
    .transition-opacity { transition-property: opacity; }
    .duration-200 { transition-duration: 200ms; }
    .duration-500 { transition-duration: 500ms; }
    .hover\:bg-gray-700:hover { background: #374151; }
    .clip-path-none { clip-path: none; }
    .glass {
        background:
            linear-gradient(180deg, rgba(15, 25, 49, 0.92), rgba(8, 13, 26, 0.86)),
            radial-gradient(circle at top right, rgba(124, 231, 255, 0.18), transparent 38%);
        backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        box-shadow:
            0 10px 28px var(--panel-shadow),
            inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    .btn {
        background: linear-gradient(180deg, #ffe47a 0%, #ffb347 55%, #ff7a59 100%);
        border: none;
        color: #09111f;
        font-weight: 700;
        text-transform: uppercase;
        transform: skew(-10deg);
        transition: all 0.1s;
        clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        letter-spacing: 0.08em;
        box-shadow: 0 10px 24px rgba(255, 122, 89, 0.3);
        cursor: pointer;
    }
    .btn:active { transform: skew(-10deg) scale(0.95); filter: brightness(1.08); }
    .btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }
    .bomb-btn {
        background:
            radial-gradient(circle at 30% 30%, #ffe3f6 0%, #ff7ad6 18%, #8d3dff 55%, #2c1454 100%);
        border: 2px solid rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        box-shadow:
            0 0 18px rgba(255, 122, 214, 0.55),
            inset 0 0 12px rgba(255,255,255,0.28);
        transition: transform 0.1s, filter 0.1s;
    }
    .bomb-btn:active { transform: scale(0.9); filter: brightness(1.08); }
    #game-container, #ui-layer, #shop-overlay, #game-over-screen { width: 100%; height: 100%; }
    .feedback-gif {
        position: absolute;
        width: min(34vw, 140px);
        border-radius: 18px;
        border: 1px solid rgba(124, 231, 255, 0.35);
        box-shadow: 0 14px 32px rgba(0,0,0,0.45);
        opacity: 0;
        transform: translateY(16px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        object-fit: cover;
        background: rgba(4, 8, 18, 0.65);
    }
    .feedback-gif.is-active {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }
    .feedback-gif--combo {
        right: 0.8rem;
        bottom: 8.5rem;
    }
    .feedback-gif--fail {
        left: 0.8rem;
        bottom: 8.5rem;
    }
    #feedback-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 20;
    }
    @media (max-width: 640px) {
        .feedback-gif {
            width: min(30vw, 108px);
        }
        .feedback-gif--combo,
        .feedback-gif--fail {
            bottom: 7rem;
        }
    }
    #game-container::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 50% 50%, transparent 0 42%, rgba(8, 12, 24, 0.14) 78%, rgba(0, 0, 0, 0.34) 100%),
            linear-gradient(180deg, rgba(124, 231, 255, 0.04), transparent 26%, transparent 74%, rgba(168, 85, 247, 0.05));
        mix-blend-mode: screen;
    }
    #shop-panel { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .hidden-shop { transform: translateY(120%); }
    .visible-shop { transform: translateY(0); }
    .weapon-card {
        border: 1px solid rgba(124, 231, 255, 0.18);
        background: linear-gradient(180deg, rgba(4, 8, 18, 0.86), rgba(18, 27, 47, 0.7));
        transition: all 0.2s;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }
    .weapon-card.active { border-color: #ffe47a; background: linear-gradient(180deg, rgba(42, 20, 14, 0.85), rgba(72, 42, 16, 0.72)); }
    .hud-chip {
        border: 1px solid rgba(124, 231, 255, 0.22);
        box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .status-kicker {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.2em;
    }
    .bomb-label {
        color: #ff9ae5;
        text-shadow: 0 0 8px rgba(255, 122, 214, 0.5);
    }
    h1, h2, #boss-name, #wave-info { font-family: 'Orbitron', 'Rajdhani', sans-serif; }
    button { font: inherit; }
</style>
</head>
<body>

<!-- Assets -->
<div id="assets" style="display:none">
    <!-- [agent-note][stage3] resolved-audio: gameplay/ui cues -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_hit" data-editable="audio" data-label="Hit SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3" preload="auto"></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_bomb_pickup" data-editable="audio" data-label="Bomb Pickup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3" preload="auto"></audio>
    <audio id="sfx_weapon" data-editable="audio" data-label="Weapon Fire" src="https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3" preload="auto"></audio>
    <audio id="sfx_explosion" data-editable="audio" data-label="Explosion" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3" preload="auto"></audio>
    <audio id="sfx_warning" data-editable="audio" data-label="Damage Warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
    <audio id="sfx_success" data-editable="audio" data-label="Success UI" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Failure UI" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
    <audio id="sfx_menu_open" data-editable="audio" data-label="Menu Open" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3" preload="auto"></audio>
    <audio id="sfx_menu_close" data-editable="audio" data-label="Menu Close" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3" preload="auto"></audio>
    <audio id="sfx_game_over" data-editable="audio" data-label="Game Over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 240, "min": 150, "max": 400 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff9900" }
}
</script>

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage3] resolved-gif: combo/fail feedback -> catalogs/gifs.json -->
    <div id="feedback-layer" aria-hidden="true">
        <img id="gif-combo" class="feedback-gif feedback-gif--combo" alt="" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" loading="lazy" decoding="async">
        <img id="gif-fail" class="feedback-gif feedback-gif--fail" alt="" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" loading="lazy" decoding="async">
    </div>
    
    <!-- HUD -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-10">
        <!-- Top Bar -->
        <div class="flex justify-between items-start w-full pointer-events-auto">
            <!-- Bomb Button (Left) -->
            <div id="bomb-hud" class="flex flex-col items-center gap-1" onclick="useBomb()">
                <div class="bomb-btn w-16 h-16 flex items-center justify-center relative overflow-visible">
                    <span class="text-3xl">💣</span>
                    <div id="bomb-count" class="absolute -bottom-2 -right-2 bg-yellow-500 text-black font-bold px-2 rounded-full border border-white text-lg">0</div>
                </div>
                <span class="text-xs bomb-label font-bold tracking-widest">MEME WIPE</span>
            </div>

            <!-- Stats (Right) -->
            <div class="flex flex-col items-end gap-2">
                <div class="glass hud-chip px-4 py-1 rounded text-2xl text-yellow-400 tracking-wider text-right">
                    <span class="status-kicker block -mb-1">MEMES PURGED</span>
                    <span id="dmg-display">0</span>
                </div>
                <div class="glass hud-chip px-4 py-1 rounded text-xl text-cyan-400 tracking-wider">
                    <span class="status-kicker">CLIPS</span> <span id="score-display">0</span>
                </div>
            </div>
        </div>
        
        <!-- Boss HP Bar -->
        <div id="boss-hud" class="absolute top-24 left-4 right-4 hidden">
            <div class="w-full h-6 bg-gray-900 border border-red-900 rounded overflow-hidden relative">
                <div id="boss-hp-bar" class="h-full bg-red-600 transition-all duration-200" style="width: 100%"></div>
                <span id="boss-name" class="absolute inset-0 flex items-center justify-center text-xs font-bold tracking-[0.5em] text-white shadow-black drop-shadow-md">TREND SPIKE</span>
            </div>
        </div>

        <div class="glass hud-chip px-6 py-2 rounded-full text-3xl text-center self-center mb-20 text-cyan-400 opacity-0 transition-opacity duration-500" id="wave-info">
            FEED REFRESH
        </div>
    </div>

    <!-- Shop -->
    <div id="shop-overlay" class="absolute inset-0 z-40 flex items-end justify-center pointer-events-none">
        <div id="shop-panel" class="hidden-shop glass w-full max-w-lg p-6 pb-8 rounded-t-3xl pointer-events-auto flex flex-col gap-4 border-t-4 border-yellow-500 shadow-2xl bg-black/95">
            <h2 class="text-4xl text-center text-yellow-500 tracking-widest uppercase mb-2 border-b border-gray-700 pb-2">Loadout Lab</h2>
            
            <!-- Weapons Grid -->
            <div class="grid grid-cols-3 gap-2 mb-2">
                <div id="card-smg" class="weapon-card p-2 rounded flex flex-col items-center justify-between h-24" onclick="buyWeapon('smg')">
                    <span class="text-cyan-400 font-bold">SMG</span>
                    <span class="text-xs text-gray-400 text-center leading-tight">Fast<br>Steady</span>
                    <span class="text-yellow-500 text-sm" id="price-smg">OWNED</span>
                </div>
                <div id="card-shotgun" class="weapon-card p-2 rounded flex flex-col items-center justify-between h-24" onclick="buyWeapon('shotgun')">
                    <span class="text-red-400 font-bold">SHOTGUN</span>
                    <span class="text-xs text-gray-400 text-center leading-tight">Spam<br>Burst</span>
                    <span class="text-yellow-500 text-sm" id="price-shotgun">300</span>
                </div>
                <div id="card-sniper" class="weapon-card p-2 rounded flex flex-col items-center justify-between h-24" onclick="buyWeapon('sniper')">
                    <span class="text-green-400 font-bold">SNIPER</span>
                    <span class="text-xs text-gray-400 text-center leading-tight">Laser<br>Heavy</span>
                    <span class="text-yellow-500 text-sm" id="price-sniper">500</span>
                </div>
            </div>

            <!-- Only Heal is left, DMG UP removed per request -->
            <div class="grid grid-cols-1 gap-4">
                <button id="btn-heal" class="btn h-14 text-xl bg-green-900 text-green-100">PATCH RIG (50 CLIPS)</button>
            </div>
            <button id="btn-next-wave" class="mt-2 bg-gray-800 text-white border border-gray-600 py-3 text-2xl uppercase tracking-widest hover:bg-gray-700 w-full rounded clip-path-none">QUEUE NEXT DROP >></button>
        </div>
    </div>

    <!-- Game Over -->
    <div id="game-over-screen" class="hidden absolute inset-0 z-50 bg-black/95 flex items-center justify-center">
        <div class="glass p-8 rounded-xl text-center border-2 border-red-900 w-4/5 max-w-md">
            <h1 class="text-6xl text-red-600 mb-2 font-bold tracking-tighter">FEED FLOODED</h1>
            <p class="text-xl text-gray-400">MEMES PURGED: <span id="final-dmg" class="text-white">0</span></p>
            <p class="text-xl text-gray-400 mb-6">CLIPS BANKED: <span id="final-score" class="text-yellow-500">0</span></p>
            <button id="restart-btn" class="btn px-8 py-4 text-3xl w-full text-black">RUN IT BACK</button>
        </div>
    </div>
</div>

<script>
// §0 Core Constants
const CONSTANTS = {
    WORLD_W: 2000,
    WORLD_H: 2000,
    BASE_HP: 100,
    SCRAP_VALUE: 10,
    BOSS_WAVE: 5 // Boss every 5 waves
};

// Nerfed Weapons
const WEAPONS = {
    smg: { name: 'SMG', dmg: 5, rate: 100, spread: 0.2, speed: 650, count: 1, color: '#0ff', price: 0 },
    shotgun: { name: 'SHOTGUN', dmg: 8, rate: 100, spread: 0.5, speed: 550, count: 4, color: '#f00', price: 300, burst: 2, burstDelay: 100, reload: 1400 },
    sniper: { name: 'SNIPER', dmg: 80, rate: 1600, spread: 0.02, speed: 1100, count: 1, color: '#0f0', price: 500, pierce: true }
};

// §1 System State
let gameState = 'INIT';
let cw = 0, ch = 0;
let dpr = 1;
let lastTime = 0;
let initialized = false;
let gameConfig = {};

// Camera
let camera = { x: 0, y: 0 };

// Entities
let player = { 
    x: 0, y: 0, hp: 100, maxHp: 100, 
    scrap: 0, 
    weapon: 'smg', 
    lastShot: 0, 
    burstCount: 0, reloading: false,
    bombs: 1 // Start with 1 bomb
};
let totalDamage = 0;
let enemies = [];
let bullets = [];
let scraps = [];
let particles = [];
let bombPickups = [];
let wave = 1;
let enemiesToSpawn = 0;
let spawnTimer = 0;
let bossActive = false;
let unlockedWeapons = ['smg'];

// Input
let input = { active: false, x: 0, y: 0, originX: 0, originY: 0, dx: 0, dy: 0 };
let shakeTime = 0;
let shakePower = 0;
let lowHealthAlertAt = 0;

// §2 Audio System
const AudioSys = {
    ctx: null,
    buffers: {},
    initialized: false,
    lastPlayed: {},
    htmlFallback: {},
    config: {
        hit: { id: 'sfx_hit', volume: 0.24, playbackRate: [0.96, 1.07], cooldown: 70 },
        collect: { id: 'sfx_collect', volume: 0.28, playbackRate: [0.98, 1.08], cooldown: 90 },
        bomb_get: { id: 'sfx_bomb_pickup', volume: 0.34, playbackRate: [0.98, 1.05], cooldown: 120 },
        weapon: { id: 'sfx_weapon', volume: 0.16, playbackRate: [0.92, 1.05], cooldown: 45 },
        explosion: { id: 'sfx_explosion', volume: 0.4, playbackRate: [0.94, 1.02], cooldown: 180 },
        warning: { id: 'sfx_warning', volume: 0.22, playbackRate: [1, 1], cooldown: 450 },
        success: { id: 'sfx_success', volume: 0.24, playbackRate: [1, 1.03], cooldown: 160 },
        fail: { id: 'sfx_fail', volume: 0.24, playbackRate: [1, 1], cooldown: 160 },
        menu_open: { id: 'sfx_menu_open', volume: 0.22, playbackRate: [1, 1], cooldown: 200 },
        menu_close: { id: 'sfx_menu_close', volume: 0.22, playbackRate: [1, 1], cooldown: 200 },
        game_over: { id: 'sfx_game_over', volume: 0.3, playbackRate: [1, 1], cooldown: 500 },
        start: { id: 'sfx_success', volume: 0.22, playbackRate: [1.02, 1.02], cooldown: 500 }
    },

    init() {
        if (this.initialized) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
            this.ctx = new AC();

            Object.values(this.config).forEach(({ id }) => {
                const el = document.getElementById(id);
                if (!el || this.buffers[id]) return;
                el.preload = 'auto';
            });

            const bgm = document.getElementById('bgm_main');
            if (bgm) {
                bgm.volume = 0.18;
                bgm.loop = true;
                bgm.preload = 'auto';
            }
            this.initialized = true;
        } catch (e) {
            this.ctx = null;
        }
    },

    resume() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        const bgm = document.getElementById('bgm_main');
        if (bgm && bgm.paused) {
            bgm.volume = 0.18;
            bgm.play().catch(() => {});
        }
    },

    pauseMusic() {
        const bgm = document.getElementById('bgm_main');
        if (bgm && !bgm.paused) bgm.pause();
    },

    playSfx(type) {
        this.init();
        const cfg = this.config[type] || this.config.weapon;
        const now = performance.now();
        if (!cfg || (this.lastPlayed[type] && now - this.lastPlayed[type] < cfg.cooldown)) return;
        this.lastPlayed[type] = now;

        const [minRate, maxRate] = cfg.playbackRate;
        const playbackRate = minRate === maxRate ? minRate : (minRate + Math.random() * (maxRate - minRate));
        const sourceEl = document.getElementById(cfg.id);
        if (!sourceEl) return;

        if (this.ctx && this.buffers[cfg.id]) {
            const src = this.ctx.createBufferSource();
            src.buffer = this.buffers[cfg.id];
            src.playbackRate.value = playbackRate;
            const gain = this.ctx.createGain();
            gain.gain.value = cfg.volume;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
            return;
        }

        let fallback = this.htmlFallback[cfg.id];
        if (!fallback) {
            fallback = sourceEl.cloneNode();
            fallback.removeAttribute('id');
            fallback.preload = 'auto';
            fallback.loop = false;
            fallback.crossOrigin = 'anonymous';
            this.htmlFallback[cfg.id] = fallback;
        }

        try {
            fallback.pause();
            fallback.currentTime = 0;
        } catch (e) {}
        fallback.volume = cfg.volume;
        fallback.playbackRate = playbackRate;
        fallback.play().catch(() => {});
    }
};

const GifSys = {
    timers: {},
    show(id, duration = 900) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('is-active');
        clearTimeout(this.timers[id]);
        this.timers[id] = setTimeout(() => el.classList.remove('is-active'), duration);
    }
};

// §3 Input
function handleInput(e) {
    if (e.target.closest('#bomb-hud')) return; // Ignore bomb button
    if (e.type === 'pointerdown') {
        AudioSys.resume();
        if (gameState === 'GAMEOVER') return;
        
        input.active = true;
        input.originX = e.clientX;
        input.originY = e.clientY;
        input.x = e.clientX;
        input.y = e.clientY;
    } else if (e.type === 'pointermove' && input.active) {
        input.x = e.clientX;
        input.y = e.clientY;
        const dx = input.x - input.originX;
        const dy = input.y - input.originY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const max = 60;
        const angle = Math.atan2(dy, dx);
        const clamp = Math.min(dist, max);
        input.dx = (Math.cos(angle) * clamp) / max;
        input.dy = (Math.sin(angle) * clamp) / max;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        input.active = false;
        input.dx = 0; input.dy = 0;
    }
}

window.useBomb = () => {
    if (gameState !== 'PLAYING' || player.bombs <= 0) {
        AudioSys.playSfx('fail');
        GifSys.show('gif-fail', 850);
        return;
    }
    
    player.bombs--;
    updateHUD();
    AudioSys.playSfx('weapon');
    
    // Logic: Damage all enemies on screen
    const dmg = WEAPONS.smg.dmg; // Constraint: "damage equal to pistol"
    
    // Visuals
    shakeTime = 0.5; shakePower = 20;
    AudioSys.playSfx('explosion');
    GifSys.show('gif-combo', 950);
    
    // Shockwave particle
    particles.push({
        x: player.x, y: player.y,
        vx: 0, vy: 0, life: 0.5,
        type: 'SHOCKWAVE', radius: 10, maxRadius: 400, color: '#ffaa00'
    });

    // Apply Damage
    let hitCount = 0;
    enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < 400) { // AoE Radius
            e.hp -= dmg;
            totalDamage += dmg;
            hitCount++;
            // Pushback
            const ang = Math.atan2(e.y - player.y, e.x - player.x);
            e.x += Math.cos(ang) * 50;
            e.y += Math.sin(ang) * 50;
            
            particles.push({
                x: e.x, y: e.y,
                vx: Math.cos(ang)*200, vy: Math.sin(ang)*200,
                life: 0.4, color: '#fff'
            });
            
            if (e.hp <= 0) killEnemy(e);
        }
    });
    
    updateHUD();
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), params: { style: 'heavy' }
    });
};

// §4 Game Logic
function initGame() {
    try {
        const raw = JSON.parse(document.getElementById('game-config').textContent);
        gameConfig = Object.fromEntries(Object.entries(raw).map(([k,v]) => [k, v.value]));
    } catch(e) { gameConfig = { heroSpeed: 240, themeColor: '#ff9900' }; }

    // Reset World
    player = { 
        x: CONSTANTS.WORLD_W/2, y: CONSTANTS.WORLD_H/2, 
        hp: CONSTANTS.BASE_HP, maxHp: CONSTANTS.BASE_HP, 
        scrap: 0, 
        weapon: 'smg', lastShot: 0, burstCount: 0, reloading: false,
        bombs: 1
    };
    camera = { x: player.x - cw/2, y: player.y - ch/2 };
    
    enemies = []; bullets = []; scraps = []; particles = []; bombPickups = [];
    wave = 1;
    totalDamage = 0;
    unlockedWeapons = ['smg'];
    
    updateHUD();
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('shop-panel').classList.remove('visible-shop');
    document.getElementById('shop-panel').classList.add('hidden-shop');
    document.getElementById('boss-hud').classList.add('hidden');
    
    gameState = 'PLAYING';
    AudioSys.init();
    AudioSys.playSfx('start');
    startWave(1);
}

function startWave(n) {
    wave = n;
    bossActive = (wave % CONSTANTS.BOSS_WAVE === 0);
    
    if (bossActive) {
        spawnBoss();
        document.getElementById('boss-hud').classList.remove('hidden');
    } else {
        enemiesToSpawn = 10 + Math.floor(n * 3);
        spawnTimer = 0;
        document.getElementById('boss-hud').classList.add('hidden');
    }

    const info = document.getElementById('wave-info');
    info.textContent = bossActive ? "TREND SPIKE DETECTED" : `DROP ${n}`;
    if (bossActive) GifSys.show('gif-fail', 1000);
    info.style.opacity = 1;
    info.style.color = bossActive ? '#ff0000' : '#00f0ff';
    setTimeout(() => info.style.opacity = 0, 2500);
}

function spawnBoss() {
    // Boss Variety
    const type = Math.random() < 0.5 ? 'TITAN' : 'HIVE';
    const boss = {
        x: player.x, y: player.y - 600,
        hp: 5000 + (wave * 500), maxHp: 5000 + (wave * 500),
        speed: type === 'TITAN' ? 90 : 60,
        radius: 70,
        type: 'BOSS', bossType: type,
        color: type === 'TITAN' ? '#ff0000' : '#aa00ff',
        attackTimer: 0
    };
    
    enemies.push(boss);
    document.getElementById('boss-name').textContent = type === 'TITAN' ? "CAPS LOCK COLOSSUS" : "ALGO SWARM";
    
    // Minions
    for(let i=0; i<4; i++) {
        const angle = (Math.PI*2/4)*i;
        enemies.push({
            x: player.x + Math.cos(angle)*300, y: player.y + Math.sin(angle)*300,
            hp: 200, maxHp: 200, speed: 100, radius: 25, type: 'TANK', color: '#884400'
        });
    }
    
    shakeTime = 1.0; shakePower = 15;
}

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const spawnDist = 600 + Math.random() * 200;
    const ex = player.x + Math.cos(angle) * spawnDist;
    const ey = player.y + Math.sin(angle) * spawnDist;

    if(ex < 0 || ex > CONSTANTS.WORLD_W || ey < 0 || ey > CONSTANTS.WORLD_H) return;

    let type = 'CHASER';
    let hp = 25 + wave * 5;
    let speed = 90 + Math.random() * 40;
    let radius = 15;
    let color = '#ff4444';

    // Enemy Variety
    const r = Math.random();
    if (r < 0.2 && wave > 2) { 
        type = 'DASHER'; speed *= 2.0; hp *= 0.6; color = '#ffaa00'; radius = 12; 
    } else if (r < 0.35 && wave > 4) { 
        type = 'TANK'; speed *= 0.5; hp *= 3.0; color = '#880000'; radius = 28; 
    } else if (r < 0.5 && wave > 6) {
        type = 'SHOOTER'; speed *= 0.8; hp *= 0.8; color = '#aa00ff'; radius = 18;
    }

    enemies.push({ x: ex, y: ey, hp, maxHp: hp, speed, radius, type, color, timer: 0 });
}

function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    
    // Drop Scrap
    scraps.push({ x: e.x, y: e.y, life: 20 });
    
    // Drop Bomb (Chance)
    if (Math.random() < 0.08) { // 8% chance
        bombPickups.push({ x: e.x + (Math.random()-0.5)*20, y: e.y + (Math.random()-0.5)*20, life: 30 });
    }

    AudioSys.playSfx('hit');
    if (e.type === 'BOSS') GifSys.show('gif-combo', 900);
    
    // FX
    for(let k=0; k<6; k++) {
        particles.push({
            x: e.x, y: e.y,
            vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300,
            life: 0.5, color: e.color
        });
    }
    
    if (e.type === 'BOSS') {
        for(let k=0; k<40; k++) scraps.push({ x: e.x + (Math.random()-0.5)*150, y: e.y + (Math.random()-0.5)*150, life: 30 });
        bossActive = false;
        enemies = enemies.filter(en => en.type !== 'BOSS'); // Clear boss ref
    }
}

// Shop Logic
window.buyWeapon = (id) => {
    if (unlockedWeapons.includes(id)) {
        player.weapon = id;
        updateShopUI();
        return;
    }
    const cost = WEAPONS[id].price;
    if (player.scrap >= cost) {
        player.scrap -= cost;
        unlockedWeapons.push(id);
        player.weapon = id;
        AudioSys.playSfx('success');
        GifSys.show('gif-combo', 850);
        updateShopUI();
    }
};

document.getElementById('btn-heal').onclick = () => {
    if (player.scrap >= 50 && player.hp < player.maxHp) {
        player.scrap -= 50;
        player.hp = Math.min(player.maxHp, player.hp + 50);
        AudioSys.playSfx('success');
        updateShopUI();
    }
};

document.getElementById('btn-next-wave').onclick = () => {
    AudioSys.playSfx('menu_close');
    document.getElementById('shop-panel').classList.remove('visible-shop');
    document.getElementById('shop-panel').classList.add('hidden-shop');
    setTimeout(() => {
        gameState = 'PLAYING';
        startWave(wave + 1);
    }, 400);
};

function updateShopUI() {
    ['smg', 'shotgun', 'sniper'].forEach(id => {
        const card = document.getElementById(`card-${id}`);
        const priceEl = document.getElementById(`price-${id}`);
        const w = WEAPONS[id];
        
        if (player.weapon === id) {
            card.classList.add('active');
            card.style.borderColor = '#0f0';
        } else {
            card.classList.remove('active');
            card.style.borderColor = '#333';
        }

        if (unlockedWeapons.includes(id)) {
            priceEl.textContent = "EQUIP";
            priceEl.style.color = player.weapon === id ? '#0f0' : '#fff';
        } else {
            priceEl.textContent = w.price;
            priceEl.style.color = player.scrap >= w.price ? '#ff9900' : '#555';
            card.style.opacity = player.scrap < w.price ? 0.5 : 1;
        }
    });

    document.getElementById('btn-heal').disabled = player.scrap < 50 || player.hp >= player.maxHp;
    document.getElementById('btn-heal').style.opacity = (player.scrap < 50 || player.hp >= player.maxHp) ? 0.5 : 1;
    document.getElementById('score-display').textContent = player.scrap;
}

function updateHUD() {
    document.getElementById('score-display').textContent = player.scrap;
    document.getElementById('dmg-display').textContent = totalDamage;
    document.getElementById('bomb-count').textContent = player.bombs;
}

function gameOver() {
    gameState = 'GAMEOVER';
    AudioSys.pauseMusic();
    AudioSys.playSfx('game_over');
    GifSys.show('gif-fail', 1600);
    document.getElementById('final-score').textContent = player.scrap;
    document.getElementById('final-dmg').textContent = totalDamage;
    document.getElementById('game-over-screen').classList.remove('hidden');
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), params: { style: 'heavy' }
    });
}

document.getElementById('restart-btn').addEventListener('click', () => {
    AudioSys.resume();
    initGame();
});

// §5 Main Loop
function update(dt) {
    if (gameState !== 'PLAYING') return;

    // 1. Move Player
    if (input.active) {
        player.x += input.dx * gameConfig.heroSpeed * dt;
        player.y += input.dy * gameConfig.heroSpeed * dt;
        player.x = Math.max(20, Math.min(CONSTANTS.WORLD_W - 20, player.x));
        player.y = Math.max(20, Math.min(CONSTANTS.WORLD_H - 20, player.y));
    }

    // 2. Camera
    const targetCamX = player.x - cw/2;
    const targetCamY = player.y - ch/2;
    camera.x += (targetCamX - camera.x) * 5 * dt;
    camera.y += (targetCamY - camera.y) * 5 * dt;
    camera.x = Math.max(0, Math.min(CONSTANTS.WORLD_W - cw, camera.x));
    camera.y = Math.max(0, Math.min(CONSTANTS.WORLD_H - ch, camera.y));

    // 3. Combat
    const w = WEAPONS[player.weapon];
    const now = performance.now();
    
    let nearest = null;
    let minDst = Infinity;
    enemies.forEach(e => {
        if (e.dead) return;
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < minDst) { minDst = d; nearest = e; }
    });

    if (nearest && minDst < 600) {
        let canFire = false;
        
        if (player.weapon === 'shotgun') {
            if (!player.reloading) {
                if (now - player.lastShot > w.burstDelay) canFire = true;
            } else {
                if (now - player.lastShot > w.reload) {
                    player.reloading = false;
                    player.burstCount = 0;
                    canFire = true;
                }
            }
        } else {
            if (now - player.lastShot > w.rate) canFire = true;
        }

        if (canFire) {
            const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
            const pellets = w.count || 1;
            for(let i=0; i<pellets; i++) {
                const spread = (Math.random() - 0.5) * w.spread;
                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(angle + spread) * w.speed,
                    vy: Math.sin(angle + spread) * w.speed,
                    life: 1.5,
                    dmg: w.dmg, // No multiplier
                    color: w.color,
                    pierce: w.pierce || false
                });
            }

            player.lastShot = now;
            AudioSys.playSfx('weapon');
            
            if (player.weapon === 'sniper') { shakeTime = 0.2; shakePower = 8; }
            else if (player.weapon === 'shotgun') { shakeTime = 0.1; shakePower = 4; }

            if (player.weapon === 'shotgun') {
                player.burstCount++;
                if (player.burstCount >= w.burst) player.reloading = true;
            }
        }
    }

    // 4. Projectiles
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        
        // Enemy Bullet Logic
        if (b.isEnemy) {
            const d = Math.hypot(b.x - player.x, b.y - player.y);
            if (d < 15) {
                player.hp -= 10;
                shakeTime = 0.2; shakePower = 5;
                if (performance.now() - lowHealthAlertAt > 500 && player.hp <= player.maxHp * 0.35) {
                    lowHealthAlertAt = performance.now();
                    AudioSys.playSfx('warning');
                    GifSys.show('gif-fail', 700);
                }
                bullets.splice(i, 1);
                if (player.hp <= 0) gameOver();
            }
        } else if (b.life <= 0) {
            bullets.splice(i, 1);
        }
    }

    // 5. Spawning
    if (!bossActive && enemiesToSpawn > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            spawnEnemy();
            enemiesToSpawn--;
            spawnTimer = 0.4 + Math.random() * 0.4;
        }
    } else if (enemies.length === 0 && gameState === 'PLAYING') {
        gameState = 'SHOP';
        updateShopUI();
        AudioSys.playSfx('menu_open');
        GifSys.show('gif-combo', 800);
        const panel = document.getElementById('shop-panel');
        panel.classList.remove('hidden-shop');
        panel.classList.add('visible-shop');
    }

    // 6. Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.dead) { enemies.splice(i, 1); continue; }

        // AI
        if (e.type === 'SHOOTER') {
            const d = Math.hypot(player.x - e.x, player.y - e.y);
            if (d > 300) {
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed * dt;
                e.y += Math.sin(angle) * e.speed * dt;
            }
            e.timer = (e.timer || 0) + dt;
            if (e.timer > 2.0) {
                e.timer = 0;
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                bullets.push({
                    x: e.x, y: e.y, vx: Math.cos(angle)*300, vy: Math.sin(angle)*300,
                    life: 2, dmg: 10, color: '#f0f', isEnemy: true
                });
            }
        } else if (e.type === 'BOSS') {
            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(angle) * e.speed * dt;
            e.y += Math.sin(angle) * e.speed * dt;
            
            e.attackTimer = (e.attackTimer || 0) + dt;
            if (e.attackTimer > 3.0) {
                e.attackTimer = 0;
                // Boss Attack
                if (e.bossType === 'TITAN') {
                    // Charge
                    e.x += Math.cos(angle) * 200; e.y += Math.sin(angle) * 200;
                    shakeTime = 0.3; shakePower = 10;
                } else {
                    // Nova
                    for(let k=0; k<8; k++) {
                        const a = k * (Math.PI/4);
                        bullets.push({
                            x: e.x, y: e.y, vx: Math.cos(a)*250, vy: Math.sin(a)*250,
                            life: 3, dmg: 15, color: '#f0f', isEnemy: true
                        });
                    }
                }
            }
        } else {
            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += Math.cos(angle) * e.speed * dt;
            e.y += Math.sin(angle) * e.speed * dt;
        }
        
        // Player Collision
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < e.radius + 15) {
            player.hp -= (e.type === 'BOSS' ? 40 : 10) * dt;
            shakeTime = 0.2; shakePower = 5;
            if (player.hp <= 0) gameOver();
        }

        // Bullet Collision
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (b.isEnemy) continue;
            const bd = Math.hypot(b.x - e.x, b.y - e.y);
            if (bd < e.radius + 10) {
                e.hp -= b.dmg;
                totalDamage += b.dmg;
                updateHUD();
                
                if (!b.pierce) bullets.splice(j, 1);
                
                particles.push({
                    x: e.x, y: e.y,
                    vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200,
                    life: 0.2, color: '#fff'
                });

                if (e.hp <= 0) {
                    killEnemy(e);
                }
                break;
            }
        }
    }

    // Boss HUD
    if (bossActive) {
        const boss = enemies.find(e => e.type === 'BOSS');
        if (boss) {
            document.getElementById('boss-hp-bar').style.width = (boss.hp / boss.maxHp * 100) + '%';
        } else {
            document.getElementById('boss-hud').classList.add('hidden');
        }
    }

    // 7. Pickups (Scrap & Bombs)
    // Scrap
    for (let i = scraps.length - 1; i >= 0; i--) {
        const s = scraps[i];
        const d = Math.hypot(player.x - s.x, player.y - s.y);
        if (d < 150) {
            s.x += (player.x - s.x) * 8 * dt;
            s.y += (player.y - s.y) * 8 * dt;
        }
        if (d < 30) {
            player.scrap += CONSTANTS.SCRAP_VALUE;
            scraps.splice(i, 1);
            AudioSys.playSfx('collect');
            updateHUD();
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({ action: 'vibrate', params: { style: 'light' } });
        }
    }
    // Bombs
    for (let i = bombPickups.length - 1; i >= 0; i--) {
        const b = bombPickups[i];
        const d = Math.hypot(player.x - b.x, player.y - b.y);
        if (d < 150) {
            b.x += (player.x - b.x) * 8 * dt;
            b.y += (player.y - b.y) * 8 * dt;
        }
        if (d < 30) {
            player.bombs++;
            bombPickups.splice(i, 1);
            AudioSys.playSfx('bomb_get');
            GifSys.show('gif-combo', 800);
            updateHUD();
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({ action: 'vibrate', params: { style: 'medium' } });
        }
    }

    // 8. Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === 'SHOCKWAVE') {
            p.radius += (p.maxRadius - p.radius) * 10 * dt;
            p.life -= dt;
        } else {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
        }
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (shakeTime > 0) shakeTime -= dt;
}

function draw() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#081122');
    bgGradient.addColorStop(1, '#04070d');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    
    // Shake
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
        sx = (Math.random() - 0.5) * shakePower;
        sy = (Math.random() - 0.5) * shakePower;
    }
    ctx.translate(-camera.x + sx, -camera.y + sy);

    // Grid
    ctx.strokeStyle = 'rgba(80, 130, 220, 0.16)';
    ctx.lineWidth = 2;
    const gridSize = 100;
    const startX = Math.floor(camera.x / gridSize) * gridSize;
    const startY = Math.floor(camera.y / gridSize) * gridSize;
    ctx.beginPath();
    for (let x = startX; x < camera.x + cw; x += gridSize) {
        if(x >= 0 && x <= CONSTANTS.WORLD_W) { ctx.moveTo(x, Math.max(0, camera.y)); ctx.lineTo(x, Math.min(CONSTANTS.WORLD_H, camera.y + ch)); }
    }
    for (let y = startY; y < camera.y + ch; y += gridSize) {
        if(y >= 0 && y <= CONSTANTS.WORLD_H) { ctx.moveTo(Math.max(0, camera.x), y); ctx.lineTo(Math.min(CONSTANTS.WORLD_W, camera.x + cw), y); }
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(168, 85, 247, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = startX + gridSize / 2; x < camera.x + cw; x += gridSize) {
        if(x >= 0 && x <= CONSTANTS.WORLD_W) { ctx.moveTo(x, Math.max(0, camera.y)); ctx.lineTo(x, Math.min(CONSTANTS.WORLD_H, camera.y + ch)); }
    }
    for (let y = startY + gridSize / 2; y < camera.y + ch; y += gridSize) {
        if(y >= 0 && y <= CONSTANTS.WORLD_H) { ctx.moveTo(Math.max(0, camera.x), y); ctx.lineTo(Math.min(CONSTANTS.WORLD_W, camera.x + cw), y); }
    }
    ctx.stroke();

    // Pickups
    scraps.forEach(s => {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffe47a';
        ctx.fillStyle = '#ffe47a';
        ctx.beginPath(); ctx.moveTo(s.x, s.y-7); ctx.lineTo(s.x+7, s.y); ctx.lineTo(s.x, s.y+7); ctx.lineTo(s.x-7, s.y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff6ca';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    });
    
    bombPickups.forEach(b => {
        ctx.save();
        ctx.fillStyle = '#ff7ad6';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ff7ad6';
        ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px "Orbitron", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('💣', b.x, b.y+4);
        ctx.restore();
    });

    // Enemies
    enemies.forEach(e => {
        ctx.save();
        ctx.fillStyle = e.color;
        ctx.shadowBlur = e.type === 'BOSS' ? 28 : 18;
        ctx.shadowColor = e.color;
        ctx.beginPath();
        if (e.type === 'BOSS') {
            ctx.moveTo(e.x, e.y - e.radius);
            ctx.lineTo(e.x + e.radius, e.y + e.radius);
            ctx.lineTo(e.x - e.radius, e.y + e.radius);
            ctx.closePath();
        } else if (e.type === 'TANK') {
            ctx.roundRect(e.x - e.radius, e.y - e.radius, e.radius*2, e.radius*2, 8);
        } else if (e.type === 'SHOOTER') {
            ctx.moveTo(e.x+e.radius, e.y);
            ctx.lineTo(e.x-e.radius, e.y+e.radius);
            ctx.lineTo(e.x-e.radius, e.y-e.radius);
            ctx.closePath();
        } else {
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
        }
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        if (e.type !== 'BOSS') {
            const pct = e.hp / e.maxHp;
            ctx.fillStyle = 'rgba(10, 13, 20, 0.72)';
            ctx.fillRect(e.x - 16, e.y - e.radius - 12, 32, 5);
            ctx.fillStyle = '#ff7a8e';
            ctx.fillRect(e.x - 16, e.y - e.radius - 12, 32 * pct, 5);
        }
        ctx.restore();
    });

    // Player
    ctx.save();
    const heroGlow = ctx.createRadialGradient(player.x - 4, player.y - 6, 2, player.x, player.y, 28);
    heroGlow.addColorStop(0, '#fafeff');
    heroGlow.addColorStop(0.35, '#7ce7ff');
    heroGlow.addColorStop(1, 'rgba(95, 248, 255, 0.18)');
    ctx.fillStyle = heroGlow;
    ctx.beginPath(); ctx.arc(player.x, player.y, 22, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#5ff8ff';
    ctx.beginPath(); ctx.arc(player.x, player.y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#effdff';
    ctx.beginPath(); ctx.arc(player.x - 4, player.y - 5, 5, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = WEAPONS[player.weapon].color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, 22, 0, Math.PI * 2 * (player.hp / player.maxHp)); ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.x, player.y, 10, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
    ctx.restore();

    // Bullets
    bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10; ctx.shadowColor = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.pierce ? 6 : 4, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Particles
    particles.forEach(p => {
        if (p.type === 'SHOCKWAVE') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 4 * p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.stroke();
        } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life * 2;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
        }
    });

    ctx.restore();

    // Joystick
    if (input.active) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(input.originX, input.originY, 60, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath(); ctx.arc(input.originX + input.dx * 60, input.originY + input.dy * 60, 25, 0, Math.PI * 2); ctx.fill();
    }
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

// §6 Initialization
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const gameContainer = document.getElementById('game-container');
    const ro = new ResizeObserver(entries => {
        const r = entries[0].contentRect;
        cw = r.width;
        ch = r.height;
        dpr = window.devicePixelRatio || 1;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
        }
    });
    ro.observe(canvas);
    
    // [agent-note][stage4] repaired: mobile-action-risk | element: #gameCanvas | action: scoped pointer suppression to gameplay surface
    const handler = (e) => {
        if (e.target.closest('#bomb-hud') || e.target.closest('#shop-panel') || e.target.closest('#game-over-screen')) return;
        e.preventDefault();
        handleInput(e);
    };
    gameContainer.addEventListener('pointerdown', handler, { passive: false });
    gameContainer.addEventListener('pointermove', handler, { passive: false });
    gameContainer.addEventListener('pointerup', handler, { passive: false });
    gameContainer.addEventListener('pointercancel', handler, { passive: false });
});

window.updateGameConfig = (key, val) => {
    if(gameConfig[key] !== undefined) gameConfig[key] = val;
};
</script>
