<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Rail Race Multiplayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --bg-deep: #02070f;
            --panel: rgba(8, 20, 38, 0.82);
            --panel-border: rgba(119, 237, 255, 0.34);
            --rail-cyan: #6ff7ff;
            --rail-blue: #1bc4ff;
            --signal-purple: #b169ff;
            --warning: #ff6f91;
            --gold: #ffd870;
            --text: #f2fbff;
            --muted: #93a9c2;
            --shadow: 0 0 24px rgba(27, 196, 255, 0.16);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(27, 196, 255, 0.18), transparent 32%),
                radial-gradient(circle at 50% 110%, rgba(177, 105, 255, 0.16), transparent 36%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--text);
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .items-start { align-items: flex-start; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .transition-opacity { transition: opacity 0.3s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .duration-500 { transition-duration: 0.5s; }
        .opacity-0 { opacity: 0; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .select-none { user-select: none; }
        .z-50 { z-index: 50; }
        .z-40 { z-index: 40; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-12 { padding-bottom: 3rem; }
        .bottom-32 { bottom: 8rem; }
        .left-4 { left: 1rem; }
        .max-w-sm { max-width: 24rem; }
        .max-w-xs { max-width: 20rem; }
        .w-64 { width: 16rem; }
        .w-20 { width: 5rem; }
        .h-20 { height: 5rem; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .h-48 { height: 12rem; }
        .h-2 { height: 0.5rem; }
        .rounded { border-radius: 0.5rem; }
        .rounded-lg { border-radius: 1rem; }
        .rounded-full { border-radius: 999px; }
        .border { border: 1px solid rgba(255,255,255,0.16); }
        .border-2 { border: 2px solid transparent; }
        .text-xs { font-size: 0.8rem; }
        .text-sm { font-size: 0.95rem; }
        .text-xl { font-size: 1.4rem; }
        .text-2xl { font-size: 1.8rem; }
        .text-3xl { font-size: 2rem; }
        .text-4xl { font-size: clamp(1.8rem, 5vw, 2.8rem); }
        .text-5xl { font-size: clamp(2.3rem, 7vw, 4rem); }
        .text-6xl { font-size: clamp(2.6rem, 8vw, 4.75rem); }
        .text-8xl { font-size: clamp(3.6rem, 12vw, 6.5rem); }
        .font-black, .font-bold { font-family: 'Audiowide', 'Rajdhani', sans-serif; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 700; }
        .italic { font-style: italic; }
        .not-italic { font-style: normal; }
        .leading-none { line-height: 1; }
        .leading-tight { line-height: 0.95; }
        .tracking-tighter { letter-spacing: -0.06em; }
        .bg-slate-900, .bg-slate-900\/95, .bg-slate-900\/90 { background: rgba(3, 10, 20, 0.94); }
        .text-white { color: var(--text); }
        .text-gray-300 { color: #d3dff0; }
        .text-gray-400 { color: var(--muted); }
        .text-red-400, .text-red-500 { color: var(--warning); }
        .text-green-400 { color: #79f0af; }
        .text-neon-blue { color: var(--rail-cyan); }
        .text-neon-purple { color: #d3a0ff; }
        .border-neon-blue { border-color: var(--rail-cyan); }
        .border-neon-purple { border-color: var(--signal-purple); }
        .border-red-500, .border-red-400 { border-color: var(--warning); }
        .bg-neon-blue\/20 { background: rgba(27, 196, 255, 0.18); }
        .bg-neon-purple\/20 { background: rgba(177, 105, 255, 0.18); }
        .bg-red-500\/20 { background: rgba(255, 111, 145, 0.18); }
        .bg-red-600\/90 { background: rgba(255, 111, 145, 0.94); }
        .bg-gray-800 { background: rgba(18, 30, 46, 0.9); }
        .bg-black\/50 { background: rgba(4, 8, 16, 0.68); }
        .border-l-4 { border-left: 4px solid var(--rail-cyan); }
        .border-r-4 { border-right: 4px solid #ff7df1; }
        .border-l-2 { border-left: 2px solid var(--rail-cyan); }
        .font-mono { font-family: 'Audiowide', 'Rajdhani', sans-serif; }
        .drop-shadow-lg, .drop-shadow-\[0_0_30px_rgba\(0\,243\,255\,0\.5\)\] { filter: drop-shadow(0 0 20px rgba(111, 247, 255, 0.35)); }
        .shadow-lg, .shadow-\[0_0_20px_red\], .shadow-\[0_0_15px_rgba\(188\,19\,254\,0\.3\)\], .shadow-\[0_0_15px_rgba\(239\,68\,68\,0\.3\)\] { box-shadow: var(--shadow); }
        .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .overflow-hidden { overflow: hidden; }

        .glass-panel {
            background: linear-gradient(180deg, rgba(9, 21, 39, 0.88), rgba(4, 11, 22, 0.78));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        .glow-text { text-shadow: 0 0 10px currentColor, 0 0 20px rgba(111, 247, 255, 0.2); }

        .scanline {
            background:
                linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.16) 50%, rgba(0,0,0,0.16)),
                linear-gradient(90deg, rgba(111,247,255,0.06), transparent 36%, rgba(177,105,255,0.05));
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
        }

        .text-transparent { color: transparent; }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .bg-gradient-to-r { background-image: linear-gradient(90deg, var(--rail-cyan), #b98cff); }
        .group { position: relative; }
        .group-hover\:opacity-100:hover { opacity: 1; }
        .group-hover\:text-white:hover { color: var(--text); }
        .hover\:bg-white\/10:hover { background: rgba(255,255,255,0.1); }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .active\:bg-neon-purple:active { background: var(--signal-purple); }
        .active\:text-white:active { color: var(--text); }
        .active\:bg-red-500:active { background: var(--warning); }
        .transition { transition: transform 0.18s ease, color 0.18s ease, background 0.18s ease, opacity 0.18s ease; }
        .animate-pulse { animation: pulse 1.6s ease-in-out infinite; }
        .animate-bounce { animation: bounce 1s ease-in-out infinite; }
        .animate-ping-slow { animation: pulse-ring 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .scale-90 { transform: scale(0.9); }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 75%, rgba(111,247,255,0.11), transparent 24rem),
                linear-gradient(180deg, transparent 0%, rgba(2, 7, 15, 0.35) 100%);
            z-index: 0;
        }

        #ui-layer, #start-screen, #lobby-screen, #end-screen { z-index: 2; }
        #hud-top, #chat-container, #controls-area { position: relative; z-index: 3; }
        #hud-top > div:first-child > div,
        #controls-area button,
        #controls-area .glass-panel,
        #lobby-screen #player-list > div,
        #chat-container > div,
        #end-screen button,
        #lang-btn,
        #sound-btn {
            box-shadow: var(--shadow);
        }

        #start-screen h1, #end-title, #end-rank, #lobby-screen h2, #play-btn span {
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            text-transform: uppercase;
        }

        #play-btn .relative,
        #restart-btn,
        #lang-btn,
        #sound-btn,
        #brake-btn,
        #horn-btn {
            border: 1px solid rgba(255,255,255,0.16);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        }

        #play-btn .absolute {
            background-image: linear-gradient(90deg, var(--rail-cyan), var(--signal-purple));
            border-radius: 1rem;
        }

        #play-btn .relative {
            background: rgba(4, 10, 20, 0.92);
            border-radius: 1rem;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 9.5rem;
            width: min(28vw, 7rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(0, 0, 0, 0.28);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(0.5rem) scale(0.95);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 4;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #warning-gif {
            right: auto;
            left: 1rem;
            bottom: 10rem;
        }

        .feedback-caption {
            position: absolute;
            left: 50%;
            bottom: -1.4rem;
            transform: translateX(-50%);
            min-width: max-content;
            padding: 0.1rem 0.45rem;
            border-radius: 999px;
            background: rgba(3, 10, 20, 0.9);
            color: var(--text);
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 32px;
            width: 32px;
            border-radius: 0.5rem;
            background: linear-gradient(180deg, var(--rail-cyan), var(--rail-blue));
            cursor: pointer;
            margin-top: -14px;
            box-shadow: 0 0 15px rgba(111, 247, 255, 0.55);
            border: 2px solid rgba(255,255,255,0.85);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: linear-gradient(90deg, rgba(111,247,255,0.28), rgba(177,105,255,0.28));
            border-radius: 999px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @media (max-width: 640px) {
            .p-6 { padding: 1rem; }
            .p-8 { padding: 1.25rem; }
            .px-12 { padding-left: 1.75rem; padding-right: 1.75rem; }
            .text-6xl { font-size: 2.5rem; }
            .text-8xl { font-size: 4.25rem; }
            #controls-area { padding: 1rem 1rem 2rem; }
            #hud-top { padding: 1rem; }
            #chat-container { width: min(14rem, calc(100vw - 2rem)); bottom: 7.5rem; }
            #horn-btn { width: 4.25rem; height: 4.25rem; }
            #controls-area .h-48 { height: 10rem; }
            .feedback-gif {
                width: min(24vw, 5rem);
                bottom: 8.5rem;
            }
            #warning-gif {
                bottom: 9rem;
            }
        }
    </style>
</head>
<body class="text-white select-none">

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div class="absolute inset-0 scanline opacity-20 pointer-events-none"></div>

        <!-- [agent-note][stage3] resolved-gif: speed-warning + finish-celebration -> catalogs/gifs.json -->
        <div id="warning-gif" class="feedback-gif hidden" aria-hidden="true">
            <img id="warning-gif-img" class="w-full h-full rounded-lg" src="https://i.giphy.com/MFPZ483I4x41W.webp" alt="Speed warning reaction">
            <div class="feedback-caption">SPEED LIMIT</div>
        </div>
        <div id="finish-gif" class="feedback-gif hidden" aria-hidden="true">
            <img id="finish-gif-img" class="w-full h-full rounded-lg" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" alt="Finish celebration reaction">
            <div class="feedback-caption">TERMINAL CLEAR</div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between pointer-events-none p-safe">
            
            <!-- Top HUD -->
            <div id="hud-top" class="flex flex-col gap-2 p-4 w-full transition-opacity duration-300 opacity-0">
                <!-- Rank & Progress -->
                <div class="flex justify-between items-start">
                    <div class="glass-panel px-4 py-2 rounded-lg border-l-4 border-neon-blue">
                        <div class="text-xs text-gray-400">RANK</div>
                        <div class="text-3xl font-bold text-neon-blue"><span id="rank-display">1</span><span class="text-sm">/4</span></div>
                    </div>
                    
                    <div class="glass-panel px-4 py-2 rounded-lg text-right border-r-4 border-neon-pink">
                        <div class="text-xs text-gray-400">DIST</div>
                        <div class="text-xl font-bold font-mono"><span id="dist-display">0</span>m</div>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full h-2 bg-gray-800 rounded-full mt-2 relative overflow-hidden glass-panel">
                    <div id="progress-fill" class="h-full bg-neon-blue w-0 transition-all duration-200"></div>
                    <div id="minimap-dots" class="absolute inset-0 w-full h-full"></div>
                </div>

                <!-- Speed Limit Warning -->
                <div id="speed-warning" class="hidden self-center mt-4 bg-red-600/90 text-white px-6 py-2 rounded-full animate-bounce font-bold border-2 border-red-400 shadow-[0_0_20px_red]">
                    ⚠️ HOLD SPEED LIMIT
                </div>
            </div>

            <!-- Chat Overlay (Bottom Left) -->
            <div id="chat-container" class="absolute bottom-32 left-4 w-64 flex flex-col gap-1 pointer-events-none opacity-0 transition-opacity duration-300">
            </div>

            <!-- Controls (Bottom) -->
            <div id="controls-area" class="flex justify-between items-end p-6 pb-12 w-full transition-opacity duration-300 opacity-0 pointer-events-auto">
                
                <!-- Left: Horn -->
                <button id="horn-btn" class="w-20 h-20 rounded-full bg-neon-purple/20 border-2 border-neon-purple text-neon-purple shadow-[0_0_15px_rgba(188,19,254,0.3)] active:bg-neon-purple active:text-white transition flex flex-col items-center justify-center">
                    <span class="text-2xl">📢</span>
                    <span class="text-[10px] font-bold mt-1">HORN</span>
                </button>

                <!-- Center: Speedometer -->
                <div class="mb-4 text-center">
                    <div class="text-4xl font-black italic text-white glow-text"><span id="speed-val">0</span> <span class="text-sm not-italic text-gray-400">km/h</span></div>
                    <div id="limit-indicator" class="text-xs text-red-400 font-bold hidden">LIMIT: <span id="limit-val">100</span></div>
                </div>

                <!-- Right: Throttle -->
                <div class="flex flex-col gap-4 items-center">
                    <div class="h-48 w-16 glass-panel rounded-full p-2 relative">
                        <input type="range" id="throttle" min="0" max="100" value="0" orient="vertical" class="w-full h-full" style="writing-mode: bt-lr; -webkit-appearance: slider-vertical;">
                    </div>
                    <button id="brake-btn" class="w-16 h-16 rounded-lg bg-red-500/20 border-2 border-red-500 text-red-500 font-bold text-xs active:bg-red-500 active:text-white transition shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                        BRAKE
                    </button>
                </div>
            </div>
        </div>

        <!-- Screens -->
        <div id="start-screen" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center z-50 transition-opacity duration-500">
            <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9InJnYmEoMCwgMjQzLCAyNTUsIDAuMSkiLz48L3N2Zz4=')] opacity-50"></div>
            
            <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-neon-blue to-neon-purple mb-2 italic tracking-tighter drop-shadow-lg text-center leading-tight">
                RAIL RACE<br><span class="text-3xl not-italic text-white">MULTIPLAYER</span>
            </h1>
            
            <div class="flex gap-4 mb-8 z-10">
                <button id="lang-btn" class="px-4 py-1 rounded border border-white/20 hover:bg-white/10 text-xs font-mono">LANG: EN</button>
                <button id="sound-btn" class="px-4 py-1 rounded border border-white/20 hover:bg-white/10 text-xs font-mono">SOUND: ON</button>
            </div>

            <button id="play-btn" class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-neon-blue to-neon-purple rounded-lg blur opacity-75 group-hover:opacity-100 transition duration-200 animate-pulse"></div>
                <div class="relative px-12 py-4 bg-slate-900 rounded-lg leading-none flex items-center">
                    <span class="text-neon-blue font-bold text-xl group-hover:text-white transition">START DISPATCH RUN</span>
                </div>
            </button>
        </div>

        <div id="lobby-screen" class="absolute inset-0 bg-slate-900/95 z-40 hidden flex flex-col items-center justify-center p-8">
            <h2 class="text-2xl font-bold text-white mb-8 animate-pulse">SEARCHING FOR PLAYERS...</h2>
            <div id="player-list" class="w-full max-w-sm flex flex-col gap-3"></div>
            <div id="lobby-status" class="mt-8 text-neon-blue font-mono text-sm">Connecting to dispatch grid...</div>
        </div>

        <div id="end-screen" class="absolute inset-0 bg-slate-900/90 z-50 hidden flex flex-col items-center justify-center p-6 backdrop-blur-md">
            <div id="end-title" class="text-5xl font-black text-white mb-2 italic">FINISHED</div>
            <div id="end-rank" class="text-8xl font-black text-neon-blue mb-6 drop-shadow-[0_0_30px_rgba(0,243,255,0.5)]">#1</div>
            <p id="end-msg" class="text-gray-300 mb-8 text-center max-w-xs">Your line reached the terminal.</p>
            <button id="restart-btn" class="px-8 py-3 bg-white text-slate-900 font-bold rounded-full hover:scale-105 transition shadow-lg">
                RUN AGAIN
            </button>
        </div>

    </div>

    <script>
    /**
     * RAIL RACE MULTIPLAYER
     * Single-file implementation
     */

    // --- CONFIG & ASSETS ---
    const ASSETS = {
        // [agent-note][stage3] resolved-audio: mapped all gameplay/ui cues to catalogs/audios.json
        sounds: {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            horn: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
            win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
            uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            join: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
            warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
            brake: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
            finishLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3"
        },
        gifs: {
            warning: "https://i.giphy.com/MFPZ483I4x41W.webp",
            finish: "https://i.giphy.com/ye080RbECtcCnkrSyD.webp"
        }
    };

    const LANG = {
        en: {
            find: "START DISPATCH RUN", searching: "SEARCHING FOR TRAFFIC...", connecting: "CONNECTING...",
            ready: "READY", go: "GO!", rank: "RANK", dist: "DIST", speed: "SPEED",
            slow: "HOLD SPEED LIMIT", finish: "FINISHED", playAgain: "RUN AGAIN",
            you: "YOU"
        },
        es: {
            find: "START DISPATCH RUN", searching: "SEARCHING FOR TRAFFIC...", connecting: "CONNECTING...",
            ready: "READY", go: "GO!", rank: "RANK", dist: "DIST", speed: "SPEED",
            slow: "HOLD SPEED LIMIT", finish: "FINISHED", playAgain: "RUN AGAIN",
            you: "YOU"
        }
    };

    const BOT_NAMES = ["Turbo", "Viper", "Loco", "Diesel", "Spark", "Ghost", "Nitro", "Axel"];
    const CHAT_MSGS = [
        "See ya!", "Too slow!", "Wait for me!", "Choo Choo!", "Lag?", "Nice skin!", "Hahaha", "Gotta go fast!"
    ];

    // --- STATE ---
    let state = {
        lang: 'en',
        sound: true,
        screen: 'start',
        time: 0,
        players: [],
        trackLength: 5000,
        speedLimit: 999,
        limitZone: false,
        chatLog: [],
        audioReady: false,
        lastWarningAt: 0,
        lastBrakeCueAt: 0,
        lastHornAt: 0
    };

    // --- AUDIO SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {};

    function registerSound(key, url, opts = {}) {
        const audio = new Audio(url);
        audio.preload = 'auto';
        audio.loop = Boolean(opts.loop);
        audio.volume = opts.volume ?? 0.45;
        sounds[key] = { base: audio, volume: audio.volume, loop: audio.loop };
    }

    function initAudio() {
        if (state.audioReady) return;
        registerSound('bgm', ASSETS.sounds.bgm, { loop: true, volume: 0.22 });
        registerSound('finishLoop', ASSETS.sounds.finishLoop, { loop: true, volume: 0.18 });
        registerSound('horn', ASSETS.sounds.horn, { volume: 0.55 });
        registerSound('win', ASSETS.sounds.win, { volume: 0.5 });
        registerSound('uiClick', ASSETS.sounds.uiClick, { volume: 0.4 });
        registerSound('start', ASSETS.sounds.start, { volume: 0.48 });
        registerSound('join', ASSETS.sounds.join, { volume: 0.38 });
        registerSound('warning', ASSETS.sounds.warning, { volume: 0.42 });
        registerSound('brake', ASSETS.sounds.brake, { volume: 0.34 });
        state.audioReady = true;
    }

    function unlockAudio() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        initAudio();
    }

    function stopLoop(key) {
        const entry = sounds[key];
        if (!entry) return;
        entry.base.pause();
        entry.base.currentTime = 0;
    }

    function stopAllLoops() {
        stopLoop('bgm');
        stopLoop('finishLoop');
    }

    function playSound(key, opts = {}) {
        if (!state.sound) return;
        const entry = sounds[key];
        if (entry) {
            try {
                if (entry.loop || opts.loop) {
                    if (!entry.base.paused && !opts.restart) return;
                    entry.base.currentTime = 0;
                    entry.base.play().catch(() => {});
                    return;
                }
                const instance = entry.base.cloneNode();
                instance.volume = opts.volume ?? entry.volume;
                instance.play().catch(() => {});
                return;
            } catch (err) {}
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = key === 'warning' ? 280 : key === 'brake' ? 180 : 440;
        gain.gain.value = 0.05;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.18);
        osc.stop(audioCtx.currentTime + 0.18);
    }

    function setRaceLoop(active) {
        if (!state.sound) return;
        if (active) {
            stopLoop('finishLoop');
            playSound('bgm', { loop: true, restart: false });
        } else {
            stopLoop('bgm');
        }
    }

    function setFinishLoop(active) {
        if (!state.sound) return;
        if (active) {
            stopLoop('bgm');
            playSound('finishLoop', { loop: true, restart: true });
        } else {
            stopLoop('finishLoop');
        }
    }

    // --- FEEDBACK MEDIA ---
    const warningGif = document.getElementById('warning-gif');
    const finishGif = document.getElementById('finish-gif');
    document.getElementById('warning-gif-img').src = ASSETS.gifs.warning;
    document.getElementById('finish-gif-img').src = ASSETS.gifs.finish;

    let warningGifTimer = null;
    let finishGifTimer = null;

    function revealGif(el) {
        el.classList.remove('hidden');
        requestAnimationFrame(() => el.classList.add('visible'));
    }

    function hideGif(el) {
        el.classList.remove('visible');
        setTimeout(() => {
            if (!el.classList.contains('visible')) el.classList.add('hidden');
        }, 220);
    }

    function pulseWarningGif() {
        clearTimeout(warningGifTimer);
        revealGif(warningGif);
        warningGifTimer = setTimeout(() => hideGif(warningGif), 1400);
    }

    function showFinishGif() {
        clearTimeout(finishGifTimer);
        revealGif(finishGif);
        finishGifTimer = setTimeout(() => hideGif(finishGif), 3200);
    }

    function resetFeedbackMedia() {
        clearTimeout(warningGifTimer);
        clearTimeout(finishGifTimer);
        hideGif(warningGif);
        hideGif(finishGif);
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Train {
        constructor(isPlayer, laneIndex, name) {
            this.isPlayer = isPlayer;
            this.laneIndex = laneIndex;
            this.name = name;
            this.z = 0;
            this.speed = 0;
            this.throttle = 0;
            this.color = isPlayer ? '#00f3ff' : `hsl(${Math.random()*360}, 70%, 60%)`;
            this.finished = false;

            this.baseSpeed = 150 + Math.random() * 40;
            this.aggression = Math.random();
        }

        update() {
            if (this.finished) return;

            const maxSpeed = 300;
            if (this.isPlayer) {
                if (this.throttle > 0) this.speed += this.throttle * 0.1;
                else this.speed *= 0.98;

                if (keys.brake) this.speed *= 0.92;
            } else {
                let targetSpeed = this.baseSpeed;
                if (state.limitZone && state.speedLimit < 200) {
                    if (Math.random() > this.aggression * 0.5) targetSpeed = state.speedLimit - 10;
                }

                const playerZ = state.players[0].z;
                if (this.z < playerZ - 500) targetSpeed += 5;
                if (this.z > playerZ + 1000) targetSpeed -= 5;

                if (this.speed < targetSpeed) this.speed += 2;
                else this.speed *= 0.99;
            }

            if (state.limitZone && this.speed > state.speedLimit + 10) {
                this.speed *= 0.9;
                if (this.isPlayer && Math.random() < 0.05) showWarning();
            }

            this.speed = Math.max(0, Math.min(this.speed, maxSpeed));
            this.z += this.speed * 0.5;

            if (this.z >= state.trackLength * 10) {
                this.z = state.trackLength * 10;
                this.finished = true;
                this.speed = 0;
                if (this.isPlayer) endGame();
            }
        }
    }

    const keys = { brake: false };
    const camera = { x: 0, y: -200, z: -500, fov: 600 };

    function project(x, y, z) {
        const scale = camera.fov / (camera.fov + z);
        const x2d = (x * scale) + width / 2;
        const y2d = (y * scale) + height / 2;
        return { x: x2d, y: y2d, scale: scale };
    }

    function update() {
        if (state.screen !== 'race') return;

        const playerZ = state.players[0].z;
        const zoneCycle = Math.floor(playerZ / 5000);
        if (zoneCycle % 2 === 1) {
            state.limitZone = true;
            state.speedLimit = 120;
        } else {
            state.limitZone = false;
            state.speedLimit = 300;
        }

        state.players.forEach(p => p.update());

        const p = state.players[0];
        const targetZ = p.z - 600 - (p.speed * 2);
        camera.z += (targetZ - camera.z) * 0.1;
        const shake = p.speed > 200 ? (Math.random() - 0.5) * (p.speed / 50) : 0;
        camera.x = shake;
        camera.y = -250 + shake;

        updateHUD();

        if (Math.random() < 0.005) {
            const randomBot = state.players[1 + Math.floor(Math.random() * (state.players.length - 1))];
            if (randomBot) addChat(randomBot.name, CHAT_MSGS[Math.floor(Math.random() * CHAT_MSGS.length)]);
        }
    }

    function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);

        if (state.screen !== 'race' && state.screen !== 'end') return;

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, height / 2, width, height / 2);

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;

        const camZ = camera.z;
        const startZ = Math.floor(camZ / 200) * 200;
        const objects = [];

        const laneWidth = 120;
        const lanes = [-1.5, -0.5, 0.5, 1.5];

        for (let z = startZ; z < camZ + 4000; z += 200) {
            const screenZ = z - camZ;
            if (screenZ < 10) continue;

            lanes.forEach(l => {
                const lx = l * laneWidth;
                objects.push({ type: 'sleeper', x: lx, z: screenZ, w: laneWidth });
            });

            if (z % 1000 === 0) {
                objects.push({ type: 'pole', x: -400, z: screenZ, side: 'left' });
                objects.push({ type: 'pole', x: 400, z: screenZ, side: 'right' });
            }

            if (state.limitZone && z % 800 === 0) {
                objects.push({ type: 'sign', x: 300, z: screenZ, val: state.speedLimit });
            }
        }

        state.players.forEach(p => {
            const screenZ = p.z - camZ;
            if (screenZ > 10) {
                objects.push({
                    type: 'train',
                    x: lanes[p.laneIndex] * laneWidth,
                    z: screenZ,
                    color: p.color,
                    isPlayer: p.isPlayer,
                    name: p.name
                });
            }
        });

        const finishZ = (state.trackLength * 10) - camZ;
        if (finishZ > 10 && finishZ < 5000) {
            objects.push({ type: 'station', z: finishZ });
        }

        objects.sort((a, b) => b.z - a.z);

        objects.forEach(obj => {
            const p = project(obj.x || 0, 0, obj.z);
            const s = p.scale;

            if (obj.type === 'sleeper') {
                ctx.fillStyle = '#334155';
                const w = obj.w * s;
                const h = 10 * s;
                ctx.fillRect(p.x - w/2, p.y, w, h);
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(p.x - w/2, p.y - 5*s, 4*s, 5*s);
                ctx.fillRect(p.x + w/2 - 4*s, p.y - 5*s, 4*s, 5*s);
            }
            else if (obj.type === 'pole') {
                const ph = 300 * s;
                ctx.fillStyle = '#475569';
                ctx.fillRect(p.x - 5*s, p.y - ph, 10*s, ph);
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(p.x, p.y - ph, 10*s, 0, Math.PI*2);
                ctx.fill();
            }
            else if (obj.type === 'sign') {
                const h = 150 * s;
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(p.x, p.y - h, 60*s, 60*s);
                ctx.fillStyle = 'white';
                ctx.font = `bold ${20*s}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(obj.val, p.x + 30*s, p.y - h + 35*s);
                ctx.fillStyle = '#888';
                ctx.fillRect(p.x + 25*s, p.y, 10*s, -h + 60*s);
            }
            else if (obj.type === 'train') {
                const w = 80 * s;
                const h = 100 * s;

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(p.x - w/2, p.y, w, 10*s);

                ctx.fillStyle = obj.color;
                ctx.fillRect(p.x - w/2, p.y - h, w, h);

                if (obj.isPlayer) {
                    ctx.shadowColor = obj.color;
                    ctx.shadowBlur = 20;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = '#ccfbf1';
                ctx.fillRect(p.x - w/3, p.y - h*0.8, w/1.5, h/3);

                ctx.fillStyle = '#fef08a';
                ctx.shadowColor = '#fef08a';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x - w/3, p.y - h*0.2, 5*s, 0, Math.PI*2);
                ctx.arc(p.x + w/3, p.y - h*0.2, 5*s, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = `${14*s}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(obj.name, p.x, p.y - h - 10*s);
            }
            else if (obj.type === 'station') {
                const stP = project(0, 0, obj.z);
                const stS = stP.scale;
                const w = 1000 * stS;
                const h = 400 * stS;

                ctx.fillStyle = '#1e293b';
                ctx.fillRect(stP.x - w/2, stP.y - h, w, h);
                ctx.fillStyle = '#00f3ff';
                ctx.font = `bold ${40*stS}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText("TERMINAL", stP.x, stP.y - h + 60*stS);
            }
        });
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function startLobby() {
        state.screen = 'lobby';
        setRaceLoop(false);
        resetFeedbackMedia();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
        document.getElementById('lobby-screen').classList.add('flex');

        const list = document.getElementById('player-list');
        list.innerHTML = '';

        addLobbySlot(LANG[state.lang].you, true);

        let botsFound = 0;
        const interval = setInterval(() => {
            if (botsFound < 3) {
                const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
                addLobbySlot(name, false);
                botsFound++;
            } else {
                clearInterval(interval);
                document.getElementById('lobby-status').innerText = "DISPATCH SLOT READY. ROLLING OUT...";
                setTimeout(startRace, 1500);
            }
        }, 800);
    }

    function addLobbySlot(name, isMe) {
        const div = document.createElement('div');
        div.className = `p-3 rounded border flex justify-between items-center ${isMe ? 'bg-neon-blue/20 border-neon-blue' : 'bg-slate-800 border-slate-700'}`;
        div.innerHTML = `<span class="font-bold ${isMe ? 'text-neon-blue' : 'text-white'}">${name}</span> <span class="text-xs text-green-400">READY</span>`;
        document.getElementById('player-list').appendChild(div);
        playSound(isMe ? 'start' : 'join');
    }

    function startRace() {
        state.screen = 'race';
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('flex');

        document.getElementById('hud-top').classList.remove('opacity-0');
        document.getElementById('controls-area').classList.remove('opacity-0');
        document.getElementById('chat-container').classList.remove('opacity-0');

        state.players = [];
        state.players.push(new Train(true, 1, LANG[state.lang].you));
        const usedNames = [];
        for (let i = 0; i < 3; i++) {
            let name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
            while (usedNames.includes(name)) name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
            usedNames.push(name);
            const lanes = [0, 2, 3];
            state.players.push(new Train(false, lanes[i], name));
        }

        setRaceLoop(true);
        addChat("DISPATCH", "LINE CLEARED. GO!");
    }

    function updateHUD() {
        const p = state.players[0];
        document.getElementById('speed-val').innerText = Math.floor(p.speed);

        const limitEl = document.getElementById('limit-indicator');
        if (state.limitZone) {
            limitEl.classList.remove('hidden');
            document.getElementById('limit-val').innerText = state.speedLimit;
            if (p.speed > state.speedLimit) limitEl.classList.add('animate-pulse');
            else limitEl.classList.remove('animate-pulse');
        } else {
            limitEl.classList.add('hidden');
        }

        const dist = Math.floor(p.z / 10);
        document.getElementById('dist-display').innerText = dist;

        const sorted = [...state.players].sort((a,b) => b.z - a.z);
        const rank = sorted.indexOf(p) + 1;
        document.getElementById('rank-display').innerText = rank;

        const fill = document.getElementById('progress-fill');
        const pct = Math.min(100, (p.z / (state.trackLength * 10)) * 100);
        fill.style.width = `${pct}%`;

        const dotsContainer = document.getElementById('minimap-dots');
        dotsContainer.innerHTML = '';
        state.players.forEach(bot => {
            const d = document.createElement('div');
            const botPct = Math.min(100, (bot.z / (state.trackLength * 10)) * 100);
            d.className = `absolute top-0 bottom-0 w-2 rounded-full ${bot.isPlayer ? 'bg-white z-10 border border-black' : 'bg-red-500 opacity-70'}`;
            d.style.left = `${botPct}%`;
            dotsContainer.appendChild(d);
        });
    }

    function showWarning() {
        const now = performance.now();
        if (now - state.lastWarningAt < 900) return;
        state.lastWarningAt = now;
        const w = document.getElementById('speed-warning');
        w.classList.remove('hidden');
        pulseWarningGif();
        playSound('warning');
        setTimeout(() => w.classList.add('hidden'), 1000);
    }

    function addChat(name, msg) {
        const c = document.getElementById('chat-container');
        const d = document.createElement('div');
        d.className = "bg-black/50 text-white text-xs px-2 py-1 rounded border-l-2 border-neon-blue animate-pulse";
        d.innerHTML = `<span class="font-bold text-neon-blue">${name}:</span> ${msg}`;
        c.appendChild(d);
        if (c.children.length > 4) c.removeChild(c.firstChild);

        setTimeout(() => {
            d.style.opacity = '0';
            setTimeout(() => d.remove(), 500);
        }, 3000);
    }

    function endGame() {
        state.screen = 'end';
        stopLoop('bgm');
        playSound('win');
        setFinishLoop(true);
        showFinishGif();

        const sorted = [...state.players].sort((a,b) => b.z - a.z);
        const rank = sorted.indexOf(state.players[0]) + 1;

        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('end-screen').classList.add('flex');
        document.getElementById('end-rank').innerText = `#${rank}`;

        const msgs = ["LINE LEADER!", "STRONG ARRIVAL!", "SERVICE COMPLETE", "DELAYED ARRIVAL"];
        document.getElementById('end-msg').innerText = msgs[rank-1];

        document.getElementById('hud-top').classList.add('opacity-0');
        document.getElementById('controls-area').classList.add('opacity-0');
        document.getElementById('chat-container').classList.add('opacity-0');
    }

    function resetGame() {
        state.screen = 'start';
        stopAllLoops();
        resetFeedbackMedia();
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('flex');
        document.getElementById('start-screen').classList.remove('hidden');

        document.getElementById('throttle').value = 0;
        keys.brake = false;
        state.players = [];
        state.limitZone = false;
        state.speedLimit = 999;
        state.lastWarningAt = 0;
        state.lastBrakeCueAt = 0;
        state.lastHornAt = 0;
        document.getElementById('chat-container').innerHTML = '';
    }

    function safeUiClick() {
        unlockAudio();
        playSound('uiClick');
    }

    const throttleInput = document.getElementById('throttle');
    throttleInput.addEventListener('input', (e) => {
        if (state.players[0]) state.players[0].throttle = parseInt(e.target.value, 10);
    });

    const brakeBtn = document.getElementById('brake-btn');
    const setBrake = (v) => {
        keys.brake = v;
        if (v) {
            brakeBtn.classList.add('bg-red-500', 'text-white');
            const now = performance.now();
            if (now - state.lastBrakeCueAt > 250) {
                playSound('brake');
                state.lastBrakeCueAt = now;
            }
        } else {
            brakeBtn.classList.remove('bg-red-500', 'text-white');
        }
    };
    // [agent-note][stage4] repaired: mobile-actionability | element: #brake-btn | action: scoped touch suppression to brake control and added cancel-safe release handlers
    brakeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); unlockAudio(); setBrake(true); }, { passive: false });
    brakeBtn.addEventListener('touchend', (e) => { e.preventDefault(); setBrake(false); }, { passive: false });
    brakeBtn.addEventListener('touchcancel', () => setBrake(false));
    brakeBtn.addEventListener('mousedown', () => { unlockAudio(); setBrake(true); });
    brakeBtn.addEventListener('mouseup', () => setBrake(false));
    brakeBtn.addEventListener('mouseleave', () => setBrake(false));
    brakeBtn.addEventListener('pointerup', () => setBrake(false));
    brakeBtn.addEventListener('pointercancel', () => setBrake(false));

    const hornBtn = document.getElementById('horn-btn');
    hornBtn.addEventListener('click', () => {
        unlockAudio();
        const now = performance.now();
        if (now - state.lastHornAt < 180) return;
        state.lastHornAt = now;
        playSound('horn');
        addChat(LANG[state.lang].you, "SIGNAL BLAST!");
        hornBtn.classList.add('scale-90');
        setTimeout(() => hornBtn.classList.remove('scale-90'), 100);
    });

    document.getElementById('play-btn').addEventListener('click', () => {
        unlockAudio();
        safeUiClick();
        startLobby();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        safeUiClick();
        resetGame();
    });

    document.getElementById('lang-btn').addEventListener('click', (e) => {
        safeUiClick();
        state.lang = state.lang === 'en' ? 'es' : 'en';
        e.target.innerText = `LANG: ${state.lang.toUpperCase()}`;
        document.getElementById('play-btn').querySelector('span').innerText = LANG[state.lang].find;
        document.getElementById('restart-btn').innerText = LANG[state.lang].playAgain;
        document.getElementById('speed-warning').innerText = `⚠️ ${LANG[state.lang].slow}`;
    });

    document.getElementById('sound-btn').addEventListener('click', (e) => {
        unlockAudio();
        state.sound = !state.sound;
        e.target.innerText = `SOUND: ${state.sound ? 'ON' : 'OFF'}`;
        if (!state.sound) stopAllLoops();
        else if (state.screen === 'race') setRaceLoop(true);
        else if (state.screen === 'end') setFinishLoop(true);
        else playSound('uiClick');
    });

    gameLoop();
    </script>
