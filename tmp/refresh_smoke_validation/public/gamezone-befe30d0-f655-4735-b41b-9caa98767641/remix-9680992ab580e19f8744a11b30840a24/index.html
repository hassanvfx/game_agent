<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Pixel Podcast Studio</title>
    <!-- [agent-note][stage4] repaired-font: title/display -> Audiowide, ui/body -> Rajdhani from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-top: #140f25;
            --bg-bottom: #080713;
            --panel: rgba(17, 16, 33, 0.82);
            --panel-border: rgba(119, 226, 255, 0.34);
            --panel-highlight: rgba(255, 92, 176, 0.28);
            --text: #f6f7ff;
            --muted: #b9bfd8;
            --cyan: #6ef2ff;
            --cyan-strong: #a9fbff;
            --pink: #ff5ebc;
            --pink-strong: #ff8fd0;
            --gold: #ffd76f;
            --green: #6effa9;
            --red: #ff677c;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(110, 242, 255, 0.1), transparent 30%),
                radial-gradient(circle at 80% 20%, rgba(255, 94, 188, 0.18), transparent 24%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text);
            font-family: "Rajdhani", system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 18px 18px;
            opacity: 0.35;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 22%, transparent 78%, rgba(0, 0, 0, 0.2));
            mix-blend-mode: screen;
            opacity: 0.5;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(26, 24, 46, 0.94), rgba(13, 12, 29, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 50px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(255, 94, 188, 0.08);
        }

        .title-font {
            font-family: "Audiowide", "Rajdhani", sans-serif;
            letter-spacing: 0.04em;
        }

        .text-glow {
            text-shadow:
                0 0 10px rgba(110, 242, 255, 0.32),
                0 0 24px rgba(255, 94, 188, 0.24);
        }

        .chrome-pill {
            position: relative;
            overflow: hidden;
        }

        .chrome-pill::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 10%, rgba(255, 255, 255, 0.12) 50%, transparent 90%);
            transform: translateX(-100%);
            animation: sweep 5s linear infinite;
            pointer-events: none;
        }

        @keyframes sweep {
            to {
                transform: translateX(100%);
            }
        }

        #start-screen {
            position: relative;
            z-index: 50;
            width: min(100% - 32px, 420px);
            margin: 0 16px;
            padding: 28px 24px;
            border-radius: 28px;
            text-align: center;
            pointer-events: auto;
        }

        .brand-mark {
            width: 92px;
            height: 92px;
            margin: 0 auto 16px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            font-size: 48px;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.34), transparent 30%),
                linear-gradient(160deg, rgba(110, 242, 255, 0.28), rgba(255, 94, 188, 0.35));
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                0 0 28px rgba(110, 242, 255, 0.18),
                inset 0 0 24px rgba(255, 255, 255, 0.08);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            padding: 6px 12px;
            border-radius: 999px;
            color: var(--cyan-strong);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            background: rgba(110, 242, 255, 0.1);
            border: 1px solid rgba(110, 242, 255, 0.22);
        }

        #start-screen h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 7vw, 40px);
            line-height: 1;
        }

        #start-screen p {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.15;
        }

        .feature-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .feature-chip {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #e9ecff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-gradient {
            width: 100%;
            padding: 16px 20px;
            border-radius: 999px;
            color: #120c21;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--pink-strong) 100%);
            box-shadow:
                0 14px 28px rgba(255, 94, 188, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.18) inset;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .btn-gradient:hover,
        .btn-gradient:focus-visible {
            transform: translateY(-1px) scale(1.01);
            filter: brightness(1.03);
            box-shadow:
                0 18px 32px rgba(255, 94, 188, 0.28),
                0 0 24px rgba(110, 242, 255, 0.18);
        }

        .btn-gradient:active {
            transform: scale(0.97);
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .hud-card {
            min-width: 0;
            padding: 10px 14px;
            border-radius: 18px;
        }

        .hud-label {
            display: block;
            color: var(--muted);
            font-size: 11px;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .hud-value {
            display: block;
            margin-top: 6px;
            font-family: "Audiowide", "Rajdhani", sans-serif;
            font-size: clamp(18px, 5vw, 24px);
            line-height: 1;
            color: white;
        }

        #phase-display {
            font-family: "Orbitron", "Exo 2", sans-serif;
            font-size: clamp(16px, 4vw, 20px);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--pink-strong);
        }

        .phase-live {
            color: var(--pink-strong);
        }

        .phase-planning {
            color: var(--gold);
        }

        .phase-editing {
            color: var(--red);
            animation: pulseLive 1s ease-in-out infinite;
        }

        .phase-published {
            color: var(--green);
        }

        @keyframes pulseLive {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                text-shadow: 0 0 0 rgba(255, 103, 124, 0);
            }
            50% {
                opacity: 0.78;
                transform: scale(1.03);
                text-shadow: 0 0 18px rgba(255, 103, 124, 0.45);
            }
        }

        /* [agent-note][stage2] preserve: choice zone placement | reason: already thumb-safe on mobile */
        #interaction-overlay {
            position: absolute;
            bottom: 10px;
            width: 100%;
            padding: 0 12px calc(16px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: auto;
        }

        #choices-container {
            width: min(100%, 420px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            position: relative;
            width: 100%;
            padding: 14px 16px;
            text-align: left;
            color: #fff;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05)),
                rgba(11, 10, 26, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.26);
            transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
        }

        .choice-btn:hover,
        .choice-btn:focus-visible {
            transform: translateY(-1px);
            border-color: rgba(110, 242, 255, 0.32);
            box-shadow:
                0 16px 28px rgba(0, 0, 0, 0.32),
                0 0 18px rgba(110, 242, 255, 0.14);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        .choice-label {
            display: block;
            margin-bottom: 4px;
            color: var(--pink-strong);
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .choice-title {
            display: block;
            font-size: 20px;
            line-height: 1;
            font-weight: 600;
        }

        #tap-zone {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }

        /* [agent-note][stage3] resolved-gif: polish-feedback + publish-hype -> catalogs/gifs.json */
        #reaction-overlay {
            position: absolute;
            top: 78px;
            right: 12px;
            width: min(36vw, 126px);
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(10, 10, 22, 0.62);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
            z-index: 40;
        }

        #reaction-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tap-signal {
            position: relative;
            padding: 14px 20px;
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.8);
            font-family: "Orbitron", "Exo 2", sans-serif;
            font-size: clamp(18px, 4.4vw, 28px);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            background: rgba(7, 8, 22, 0.26);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 22px rgba(255, 94, 188, 0.12);
            animation: signalPulse 1.3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes signalPulse {
            0%, 100% {
                transform: scale(0.98);
                opacity: 0.45;
            }
            50% {
                transform: scale(1);
                opacity: 0.95;
            }
        }

        @media (max-width: 640px) {
            #start-screen {
                padding: 24px 18px;
                border-radius: 24px;
            }

            #start-screen p {
                font-size: 16px;
            }

            .feature-chip {
                font-size: 12px;
                padding: 7px 10px;
            }

            .choice-title {
                font-size: 18px;
            }

            .btn-gradient {
                font-size: 17px;
                padding: 15px 18px;
            }

            .hud-card {
                padding: 10px 12px;
            }

            #reaction-overlay {
                top: 86px;
                right: 10px;
                width: min(32vw, 102px);
            }

            .tap-signal {
                max-width: calc(100% - 32px);
                text-align: center;
                font-size: 18px;
                line-height: 1.2;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="reaction-overlay" class="hidden" aria-hidden="true">
                <img id="reaction-gif" alt="" loading="lazy">
            </div>

            <div id="start-screen" class="glass-panel chrome-pill">
                <div class="brand-mark">🎙️</div>
                <div class="eyebrow">Signal idol session</div>
                <h1 class="title-font text-glow">Podcast Studio</h1>
                <p>Pick a chaotic fantasy topic, tap to polish the show, then launch your episode into the neon airwaves.</p>
                <div class="feature-row" aria-hidden="true">
                    <span class="feature-chip">Host Avatar</span>
                    <span class="feature-chip">Tap Remix</span>
                    <span class="feature-chip">Live Hype</span>
                </div>
                <button id="start-btn" class="btn-gradient title-font">Go Live</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hidden">
                <div class="glass-panel hud-card chrome-pill">
                    <span class="hud-label">Audience Reach</span>
                    <span id="score-display" class="hud-value">0</span>
                </div>
                <div class="glass-panel hud-card chrome-pill">
                    <span id="phase-display" class="phase-live">On Air</span>
                </div>
            </div>

            <div id="interaction-overlay" class="hidden">
                <div id="choices-container"></div>
            </div>

            <div id="tap-zone" class="hidden">
                <div class="tap-signal">Tap to polish</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                choose: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                tap: "https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3",
                hype: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                publish: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3"
            },
            gifs: {
                polish: "https://i.giphy.com/1zmG8avB83Uvm.webp",
                publish: "https://i.giphy.com/ye080RbECtcCnkrSyD.webp"
            }
        };

        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.unlocked = false;
                this.sfx = {};
                this.lastPlayed = new Map();

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                const warmups = [this.bgm, ...Object.values(this.sfx)];
                warmups.forEach((audio) => {
                    try {
                        audio.muted = true;
                        const attempt = audio.play();
                        if (attempt && typeof attempt.then === 'function') {
                            attempt.then(() => {
                                audio.pause();
                                audio.currentTime = 0;
                                audio.muted = false;
                            }).catch(() => {
                                audio.muted = false;
                            });
                        } else {
                            audio.muted = false;
                        }
                    } catch (_) {}
                });
            }

            playBGM() {
                this.unlock();
                if (!this.bgm.paused) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                const source = this.sfx[key];
                if (!source) return;
                const now = performance.now();
                const cooldown = options.cooldown ?? 90;
                const last = this.lastPlayed.get(key) ?? 0;
                if (now - last < cooldown) return;
                this.lastPlayed.set(key, now);

                const clone = source.cloneNode();
                clone.volume = options.volume ?? 0.55;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionOverlay = document.getElementById('reaction-overlay');
        const reactionGif = document.getElementById('reaction-gif');

        let width, height;
        let listeners = 0;
        let gameState = 'MENU';
        let editProgress = 0;
        let currentTopic = "";
        let particles = [];
        let frameCount = 0;
        let reactionTimer = null;

        const TOPICS = [
            "Dragon Fight Debrief",
            "Potion Reviews That Backfired",
            "Top 10 Dungeon Haul Highlights",
            "Goblin Guest Hotline",
            "How the Rescue Went Sideways",
            "Slime Kitchen Test Episode",
            "Blade Sharpening ASMR",
            "Spell Mishap Confessional"
        ];

        const phaseDisplay = document.getElementById('phase-display');
        const phaseClassMap = {
            live: 'phase-live',
            planning: 'phase-planning',
            editing: 'phase-editing',
            published: 'phase-published'
        };

        function setPhase(text, phaseStyle) {
            phaseDisplay.textContent = text;
            phaseDisplay.className = phaseClassMap[phaseStyle] || 'phase-live';
        }

        function showReaction(src, label, duration = 1400) {
            if (!src) return;
            reactionGif.src = src;
            reactionGif.alt = label || "";
            reactionOverlay.classList.remove('hidden');
            if (reactionTimer) clearTimeout(reactionTimer);
            reactionTimer = setTimeout(() => {
                reactionOverlay.classList.add('hidden');
            }, duration);
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStudioBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#17122d');
            gradient.addColorStop(0.45, '#110f25');
            gradient.addColorStop(1, '#090713');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const panelSize = Math.max(28, Math.min(60, width / 12));
            for (let x = 0; x < width + panelSize; x += panelSize) {
                for (let y = 0; y < height + panelSize; y += panelSize) {
                    const evenCell = ((x / panelSize) + (y / panelSize)) % 2 === 0;
                    ctx.fillStyle = evenCell ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.015)';
                    ctx.beginPath();
                    ctx.roundRect(x, y, panelSize - 6, panelSize - 6, 6);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 16; i++) {
                const px = (i * 171 + frameCount * 0.4) % (width + 120) - 60;
                const py = 70 + (i % 6) * (height * 0.11);
                const radius = 2 + (i % 3);
                ctx.fillStyle = i % 2 === 0 ? 'rgba(110,242,255,0.5)' : 'rgba(255,94,188,0.42)';
                ctx.beginPath();
                ctx.arc(px, py, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            const signWidth = Math.min(180, width * 0.3);
            const signHeight = 42;
            const signX = width - signWidth - 14;
            const signY = 16;
            const liveActive = gameState === 'EDITING' || gameState === 'PUBLISHING';

            ctx.save();
            ctx.shadowBlur = liveActive ? 22 : 8;
            ctx.shadowColor = liveActive ? '#ff677c' : 'rgba(255,255,255,0.16)';
            ctx.fillStyle = liveActive ? 'rgba(71, 12, 27, 0.9)' : 'rgba(20, 20, 30, 0.6)';
            ctx.beginPath();
            ctx.roundRect(signX, signY, signWidth, signHeight, 18);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = liveActive ? 'rgba(255, 103, 124, 0.9)' : 'rgba(255,255,255,0.15)';
            ctx.stroke();

            ctx.fillStyle = liveActive ? '#ffd7df' : '#d8def5';
            ctx.font = '700 18px "Rajdhani"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(liveActive ? '● REC SIGNAL' : 'STUDIO READY', signX + signWidth / 2, signY + signHeight / 2 + 1);
            ctx.restore();
        }

        function drawCharacter() {
            const cx = width / 2;
            const cy = height * 0.63;
            const scale = Math.min(width, height) / 800;
            const bob = Math.sin(frameCount * 0.05) * 5;
            const talkingAmount = gameState === 'EDITING' ? Math.abs(Math.sin(frameCount * 0.5)) : 0.18;
            const auraPulse = 0.75 + Math.sin(frameCount * 0.06) * 0.08;

            ctx.save();
            ctx.translate(cx, cy + bob);
            ctx.scale(scale, scale);

            const glow = ctx.createRadialGradient(0, 18, 40, 0, 28, 180);
            glow.addColorStop(0, 'rgba(110, 242, 255, 0.3)');
            glow.addColorStop(0.5, 'rgba(255, 94, 188, 0.16)');
            glow.addColorStop(1, 'rgba(255, 94, 188, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.ellipse(0, 22, 170 * auraPulse, 190 * auraPulse, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1e1938';
            ctx.beginPath();
            ctx.ellipse(0, 198, 180, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            const bodyGradient = ctx.createLinearGradient(0, 40, 0, 190);
            bodyGradient.addColorStop(0, '#8d52ff');
            bodyGradient.addColorStop(0.55, '#5d43db');
            bodyGradient.addColorStop(1, '#2d286d');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.roundRect(-92, 44, 184, 154, 32);
            ctx.fill();

            ctx.fillStyle = '#201345';
            ctx.beginPath();
            ctx.roundRect(-28, 72, 56, 96, 20);
            ctx.fill();

            ctx.fillStyle = '#ff5ebc';
            ctx.beginPath();
            ctx.roundRect(-106, 60, 18, 80, 14);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(88, 60, 18, 80, 14);
            ctx.fill();

            const faceGradient = ctx.createRadialGradient(-8, -24, 12, 0, 4, 70);
            faceGradient.addColorStop(0, '#ffd9cd');
            faceGradient.addColorStop(0.65, '#ffb5b6');
            faceGradient.addColorStop(1, '#ff8ca3');
            ctx.fillStyle = faceGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 66, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#10101a';
            ctx.beginPath();
            ctx.arc(0, -72, 73, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(-73, -16, 26, 62);
            ctx.fillRect(47, -16, 26, 62);

            ctx.strokeStyle = '#64ecff';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(0, 0, 77, Math.PI + 0.08, -0.08, false);
            ctx.stroke();

            ctx.fillStyle = '#10101a';
            if (gameState === 'EDITING' && frameCount % 60 < 10) {
                ctx.fillRect(-28, -8, 17, 3);
                ctx.fillRect(11, -8, 17, 3);
            } else {
                ctx.fillRect(-30, -14, 18, 18);
                ctx.fillRect(12, -14, 18, 18);
                ctx.fillStyle = '#6ef2ff';
                ctx.fillRect(-24, -8, 6, 6);
                ctx.fillRect(18, -8, 6, 6);
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.fillRect(-10, 14, 20, 6);

            ctx.fillStyle = '#7e173d';
            ctx.beginPath();
            ctx.roundRect(-16, 26, 32, 8 + talkingAmount * 16, 6);
            ctx.fill();
            ctx.fillStyle = '#ff8ab4';
            ctx.beginPath();
            ctx.roundRect(-10, 32, 20, 4 + talkingAmount * 6, 4);
            ctx.fill();

            ctx.fillStyle = '#ff9ca3';
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.arc(-34, 15, 10, 0, Math.PI * 2);
            ctx.arc(34, 15, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#ffe37c';
            ctx.beginPath();
            ctx.arc(-76, 102, 11, 0, Math.PI * 2);
            ctx.arc(76, 102, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            const deskY = height * 0.79;
            const deskGradient = ctx.createLinearGradient(0, deskY - 30, 0, height);
            deskGradient.addColorStop(0, '#18162c');
            deskGradient.addColorStop(1, '#09070f');
            ctx.fillStyle = deskGradient;
            ctx.fillRect(0, deskY, width, height - deskY);

            ctx.fillStyle = 'rgba(110, 242, 255, 0.12)';
            ctx.fillRect(0, deskY, width, 4);

            const micX = width / 2;
            const micY = height * 0.64 + 88;

            ctx.save();
            ctx.translate(micX, micY);
            ctx.scale(scale, scale);

            ctx.strokeStyle = '#96d7ea';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(0, 106);
            ctx.lineTo(0, 198);
            ctx.stroke();

            ctx.fillStyle = '#121826';
            ctx.beginPath();
            ctx.roundRect(-24, -40, 48, 92, 18);
            ctx.fill();

            ctx.strokeStyle = '#6ef2ff';
            ctx.lineWidth = 3;
            ctx.stroke();

            for (let y = -28; y < 42; y += 8) {
                ctx.fillStyle = y % 16 === 0 ? '#ff84c6' : '#7aefff';
                ctx.fillRect(-13, y, 26, 3);
            }

            ctx.strokeStyle = 'rgba(255,255,255,0.24)';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-20, 108);
            ctx.lineTo(-42, 178);
            ctx.moveTo(20, 108);
            ctx.lineTo(42, 178);
            ctx.stroke();

            ctx.restore();
        }

        function drawWaveform() {
            if (gameState !== 'EDITING') return;

            const cy = height * 0.3;
            ctx.save();

            ctx.strokeStyle = 'rgba(255, 94, 188, 0.18)';
            ctx.lineWidth = 18;
            ctx.beginPath();
            for (let x = 0; x < width; x += 6) {
                const freq = 0.02;
                const amp = 50 * (0.5 + editProgress / 200);
                const y = cy + Math.sin(x * freq + frameCount * 0.2) * amp * Math.sin(frameCount * 0.1);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            const waveform = ctx.createLinearGradient(0, cy - 20, width, cy + 20);
            waveform.addColorStop(0, '#6ef2ff');
            waveform.addColorStop(0.5, '#ff5ebc');
            waveform.addColorStop(1, '#ffd76f');
            ctx.strokeStyle = waveform;
            ctx.lineWidth = 4;
            ctx.beginPath();

            for (let x = 0; x < width; x += 6) {
                const freq = 0.02;
                const amp = 50 * (0.5 + editProgress / 200);
                const y = cy + Math.sin(x * freq + frameCount * 0.2) * amp * Math.sin(frameCount * 0.1);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            const barW = Math.min(320, width - 48);
            const barH = 18;
            const barX = (width - barW) / 2;
            const barY = cy + 100;

            ctx.fillStyle = 'rgba(7, 10, 22, 0.8)';
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW, barH, 999);
            ctx.fill();

            const fillGradient = ctx.createLinearGradient(barX, barY, barX + barW, barY);
            fillGradient.addColorStop(0, '#6ef2ff');
            fillGradient.addColorStop(0.55, '#ff5ebc');
            fillGradient.addColorStop(1, '#ffd76f');
            ctx.fillStyle = fillGradient;
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW * (editProgress / 100), barH, 999);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW, barH, 999);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '700 22px "Rajdhani"';
            ctx.textAlign = 'center';
            ctx.fillText("Tap to polish the episode!", width / 2, barY - 18);
            ctx.restore();
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.y -= p.speed;
                p.life -= 0.02;

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.font = p.font || '700 20px "Rajdhani"';
                ctx.textAlign = 'center';
                ctx.fillText(p.text, p.x, p.y);
                ctx.globalAlpha = 1;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function spawnParticle(x, y, text, color = '#fff', font = '700 20px "Rajdhani"') {
            particles.push({
                x,
                y,
                text,
                speed: 1 + Math.random() * 1.4,
                life: 1,
                color,
                font
            });
        }

        function startChoosingPhase() {
            gameState = 'CHOOSING';
            setPhase('Planning', 'planning');
            document.getElementById('interaction-overlay').classList.remove('hidden');
            document.getElementById('tap-zone').classList.add('hidden');

            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            const shuffled = TOPICS.sort(() => 0.5 - Math.random());
            const choices = shuffled.slice(0, 3);

            choices.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span class="choice-label">Episode</span><span class="choice-title">${topic}</span>`;
                btn.onclick = () => {
                    audio.playSFX('choose', { volume: 0.44, cooldown: 120 });
                    currentTopic = topic;
                    startEditingPhase();
                };
                container.appendChild(btn);
            });
        }

        function startEditingPhase() {
            gameState = 'EDITING';
            editProgress = 0;
            setPhase('Editing', 'editing');
            document.getElementById('interaction-overlay').classList.add('hidden');
            document.getElementById('tap-zone').classList.remove('hidden');
            showReaction(ASSETS.gifs.polish, 'Studio polish boost', 1200);
            audio.playSFX('hype', { volume: 0.32, cooldown: 160 });
        }

        function handleEditTap(e) {
            if (gameState !== 'EDITING') return;

            audio.playSFX('tap', { volume: 0.42, cooldown: 70 });
            editProgress += 5;

            const x = e.clientX || width / 2;
            const y = e.clientY || height / 2;
            spawnParticle(x, y, "✦", "#6ef2ff", '700 24px "Rajdhani"');
            spawnParticle(x + (Math.random() * 16 - 8), y - 14, "♫", "#ff8fd0", '700 22px "Rajdhani"');

            if (editProgress >= 100) {
                publishPodcast();
            }
        }

        function publishPodcast() {
            gameState = 'PUBLISHING';
            document.getElementById('tap-zone').classList.add('hidden');
            showReaction(ASSETS.gifs.publish, 'Episode published celebration', 2200);
            audio.playSFX('publish', { volume: 0.6, cooldown: 300 });

            const newListeners = Math.floor(Math.random() * 500) + 100 + (listeners * 0.1);
            const actualGain = Math.floor(newListeners);
            listeners += actualGain;

            document.getElementById('score-display').innerText = listeners.toLocaleString();
            setPhase('Published!', 'published');

            for (let i = 0; i < 10; i++) {
                spawnParticle(width / 2 + (Math.random() - 0.5) * 220, height / 2, "+" + Math.floor(actualGain / 10), "#6effa9", '700 24px "Rajdhani"');
            }
            spawnParticle(width / 2, height / 2 - 52, currentTopic ? `${currentTopic} live!` : "Episode uploaded!", "#ffd76f", '700 24px "Rajdhani"');

            setTimeout(() => {
                startChoosingPhase();
            }, 3000);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);
            drawStudioBackground();
            drawCharacter();
            drawWaveform();
            drawParticles();
            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.5, cooldown: 250 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameLoop();
            startChoosingPhase();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopBGM();
            } else if (gameState !== 'MENU') {
                audio.playBGM();
            }
        });

        const tapZone = document.getElementById('tap-zone');
        tapZone.addEventListener('mousedown', handleEditTap);
        tapZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleEditTap(e.touches[0]);
        }, { passive: false });
    });
    </script>
</body>
</html>
