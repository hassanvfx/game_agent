<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0ff">
  <link rel="icon" href="data:,">
  <title>Streamer Tycoon: Spellbound Bestie Studio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Bangers&family=Rajdhani:wght@400;600;700&display=swap">
  <style>
    :root{
      --ink:#291331; --cream:#fff8e9; --rose:#ff6fbd; --aqua:#6ff3ff; --lemon:#ffe66d; --lilac:#b589ff; --mint:#9cffcb; --danger:#ff5b7d; --glass:rgba(255,255,255,.72); --edge:rgba(255,255,255,.82); --shadow:rgba(74,31,93,.24);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#180b25;color:var(--ink);font-family:"Rajdhani",system-ui,sans-serif;touch-action:manipulation}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.8),transparent 18%),radial-gradient(circle at 80% 20%,rgba(111,243,255,.38),transparent 21%),linear-gradient(180deg,#fff0ff 0%,#f2edff 43%,#d8fbff 100%);z-index:-3}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(#000,transparent 78%);z-index:-2}
    canvas{display:block;width:100%;height:100%}
    button{font:inherit;border:0;cursor:pointer;color:inherit}
    #game-container{position:relative;width:100%;height:100%;overflow:hidden;max-width:700px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.04));box-shadow:0 0 80px rgba(255,111,189,.24)}
    #ui-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
    .hidden{display:none!important}.title-font{font-family:"Cinzel",serif;letter-spacing:.025em}.meme-font{font-family:"Bangers",cursive;letter-spacing:.035em}
    .glass-panel{background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,245,255,.68));border:2px solid var(--edge);box-shadow:0 18px 45px var(--shadow),inset 0 1px 0 rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    #start-screen{position:relative;z-index:20;width:min(100% - 28px,430px);border-radius:34px;padding:24px 20px 20px;text-align:center;pointer-events:auto;overflow:hidden}
    #start-screen:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--rose),var(--aqua),var(--lemon),var(--lilac),transparent);opacity:.18;animation:spin 12s linear infinite;z-index:-1}@keyframes spin{to{transform:rotate(1turn)}}
    .brand-mark{width:112px;height:112px;margin:0 auto 14px;position:relative;filter:drop-shadow(0 14px 22px rgba(181,137,255,.28))}.brand-mark .crystal{position:absolute;inset:9px 18px 12px;border-radius:34% 34% 46% 46%;background:linear-gradient(145deg,#fff,var(--aqua) 30%,var(--rose) 66%,#a173ff);border:3px solid rgba(255,255,255,.92);transform:rotate(-4deg)}.brand-mark .ears:before,.brand-mark .ears:after{content:"";position:absolute;top:1px;width:34px;height:45px;border-radius:50% 50% 35% 35%;background:#fff0fb;border:3px solid #fff}.brand-mark .ears:before{left:13px;transform:rotate(-18deg)}.brand-mark .ears:after{right:13px;transform:rotate(18deg)}.brand-mark .face{position:absolute;left:36px;top:46px;font-size:34px}.brand-mark .wand{position:absolute;right:3px;bottom:13px;font-size:36px;transform:rotate(24deg)}
    .eyebrow{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:999px;background:rgba(111,243,255,.24);border:1px solid rgba(41,19,49,.12);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#522360}.eyebrow:before{content:"●";color:var(--danger);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}
    h1{margin:12px 0 8px;font-size:clamp(30px,8vw,44px);line-height:.96;color:#4d215c;text-shadow:0 3px 0 rgba(255,255,255,.75),0 0 24px rgba(255,111,189,.28)}
    #start-screen p{margin:0 auto 18px;max-width:34ch;font-size:18px;line-height:1.15;color:#68436f;font-weight:600}.feature-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}.feature-chip{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(82,35,96,.12);font-weight:700;font-size:13px;color:#63346a}
    .btn-gradient{width:100%;min-height:58px;border-radius:999px;background:linear-gradient(135deg,var(--lemon),var(--rose) 52%,var(--aqua));font-size:20px;font-weight:700;text-transform:uppercase;color:#3b173c;box-shadow:0 14px 24px rgba(255,111,189,.25),inset 0 2px 0 rgba(255,255,255,.62);transition:transform .16s ease,filter .16s ease}.btn-gradient:active{transform:scale(.97);filter:saturate(1.2)}
    #hud{position:absolute;top:0;left:0;width:100%;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:12}.hud-card{min-width:112px;border-radius:22px;padding:9px 12px}.hud-label{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#7b4b84}.hud-value{display:block;font-family:"Bangers";font-size:32px;line-height:.92;color:#4d215c;text-shadow:0 2px 0 #fff}.phase-pill{border-radius:999px;padding:10px 13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px}.phase-live{color:#e53d78}.phase-planning{color:#8853d7}.phase-editing{color:#009bb0}.phase-published{color:#14985c}
    #interaction-overlay{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:center;z-index:14;pointer-events:none}#choices-container{width:min(100% - 24px,430px);display:grid;gap:10px}.choice-btn{pointer-events:auto;width:100%;border-radius:24px;padding:13px 15px;text-align:left;background:linear-gradient(90deg,rgba(255,255,255,.88),rgba(255,242,253,.78));border:2px solid rgba(255,255,255,.86);box-shadow:0 10px 24px rgba(74,31,93,.16);transition:transform .13s ease}.choice-btn:active{transform:scale(.98)}.choice-label{display:block;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800;color:#b04482}.choice-title{display:block;font-size:19px;line-height:1.05;font-weight:800;color:#43204c}
    #tap-zone{position:absolute;inset:0;z-index:10;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}.tap-signal{border-radius:999px;padding:13px 20px;background:rgba(255,255,255,.78);border:2px solid rgba(255,255,255,.9);font-weight:900;color:#51275e;text-transform:uppercase;letter-spacing:.11em;box-shadow:0 12px 26px rgba(74,31,93,.16);animation:floaty 1.8s ease-in-out infinite}@keyframes floaty{50%{transform:translateY(-5px)}}
    #reaction-overlay{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 82px);z-index:18;width:92px;height:92px;border-radius:28px;overflow:hidden;border:3px solid white;box-shadow:0 12px 30px rgba(74,31,93,.22);pointer-events:none;background:white}#reaction-gif{width:100%;height:100%;object-fit:cover}.toast{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:17;max-width:min(88vw,390px);padding:12px 16px;border-radius:22px;background:rgba(255,255,255,.82);border:2px solid white;box-shadow:0 14px 28px rgba(74,31,93,.18);font-weight:900;text-align:center;color:#51275e;pointer-events:none}
    @media (max-height:620px){.brand-mark{width:88px;height:88px}#start-screen{padding:18px 16px}.feature-row{display:none}#start-screen p{font-size:16px}.hud-value{font-size:27px}.choice-title{font-size:17px}}
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" aria-label="Spellbound streamer tycoon studio"></canvas>
    <div id="ui-layer">
      <div id="reaction-overlay" class="hidden" aria-hidden="true"><img id="reaction-gif" alt="" loading="lazy"></div>
      <div id="start-screen" class="glass-panel" data-testid="start-screen">
        <div class="brand-mark" aria-hidden="true"><div class="ears"></div><div class="crystal"></div><div class="face">◕‿◕</div><div class="wand">✦</div></div>
        <div class="eyebrow">Anti-anxiety live session</div>
        <h1 class="title-font">Streamer Tycoon</h1>
        <p>Bestie, pick a wizard-school content arc, tap one-thumb hype spells, and grow cozy viewers without doomscroll stress.</p>
        <div class="feature-row" aria-hidden="true"><span class="feature-chip">Rainbowcore setup</span><span class="feature-chip">Idle tycoon vibes</span><span class="feature-chip">Labubu mascot</span></div>
        <button id="start-btn" class="btn-gradient meme-font" data-testid="start-button">Go Live, Bestie</button>
      </div>
      <div id="hud" class="hidden" data-testid="hud">
        <div class="glass-panel hud-card"><span class="hud-label">Cozy Viewers</span><span id="score-display" class="hud-value" data-testid="score-display">0</span></div>
        <div class="glass-panel phase-pill"><span id="phase-display" class="phase-live" data-testid="phase-display">Lobby</span></div>
      </div>
      <div id="interaction-overlay" class="hidden" data-testid="choices-overlay"><div id="choices-container"></div></div>
      <div id="tap-zone" class="hidden" data-testid="tap-zone"><div class="tap-signal">Tap hype spell</div></div>
      <div id="toast" class="toast hidden" data-testid="toast"></div>
    </div>
  </div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const ASSETS={gifs:{polish:'https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp',publish:'https://i.giphy.com/U89KtC4wdeKat7fH9X.webp'}};
  class AudioController{constructor(){this.ctx=null;this.unlocked=false;this.lastPlayed=new Map();this.bgmTimer=null;this.notes={start:[523,659],choose:[587,784],tap:[880],hype:[659,988],publish:[523,784,1046]}}unlock(){if(this.unlocked)return;this.unlocked=true;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=C?new C():null;if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}catch(_){this.ctx=null}}tone(freq,dur=.12,vol=.035,type='sine',delay=0){if(!this.ctx)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur+.03)}playBGM(){this.unlock();if(!this.ctx||this.bgmTimer)return;this.bgmTimer=setInterval(()=>{if(document.hidden)return;this.tone(392,.22,.018,'triangle',0);this.tone(523,.24,.014,'sine',.16)},1800)}stopBGM(){if(this.bgmTimer){clearInterval(this.bgmTimer);this.bgmTimer=null}}playSFX(k,o={}){this.unlock();const now=performance.now(),cd=o.cooldown??90,last=this.lastPlayed.get(k)??0;if(now-last<cd)return;this.lastPlayed.set(k,now);(this.notes[k]||[660]).forEach((n,i)=>this.tone(n,.11,o.volume?Math.min(o.volume*.08,.045):.035,i%2?'sine':'triangle',i*.055))}}
  const audio=new AudioController(),canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');let width=0,height=0,listeners=0,gameState='MENU',editProgress=0,currentTopic='',particles=[],frameCount=0,reactionTimer=null,loopStarted=false;
  const TOPICS=['Sorting Hat Hot Takes','Potion GRWM: No Burnout Edition','Forbidden Forest Cozy Desk Tour','Quidditch Clip Farm Challenge','Owl Mail Unboxing Drama','Defense Against Troll Comments','Goblin Bank Budget Stream','Butterbeer Cafe Study With Me'];
  const phaseDisplay=document.getElementById('phase-display'),scoreDisplay=document.getElementById('score-display'),tapZone=document.getElementById('tap-zone'),toast=document.getElementById('toast'),reactionOverlay=document.getElementById('reaction-overlay'),reactionGif=document.getElementById('reaction-gif');
  const phaseClassMap={live:'phase-live',planning:'phase-planning',editing:'phase-editing',published:'phase-published'};
  function setPhase(text,style){phaseDisplay.textContent=text;phaseDisplay.className=phaseClassMap[style]||'phase-live'}
  function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);width=canvas.width=Math.floor(innerWidth*dpr);height=canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);width=innerWidth;height=innerHeight}window.addEventListener('resize',resize);resize();
  function showReaction(src,label,duration=1400){if(!src)return;reactionGif.src=src;reactionGif.alt=label||'';reactionOverlay.classList.remove('hidden');clearTimeout(reactionTimer);reactionTimer=setTimeout(()=>reactionOverlay.classList.add('hidden'),duration)}
  function showToast(text,duration=1300){toast.textContent=text;toast.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.add('hidden'),duration)}
  function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function drawBackground(){const g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,'#fff0ff');g.addColorStop(.46,'#efeaff');g.addColorStop(1,'#cff8ff');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);for(let i=0;i<7;i++){const y=(i*86+frameCount*.18)%(height+120)-60;ctx.fillStyle=i%2?'rgba(255,111,189,.12)':'rgba(111,243,255,.14)';ctx.beginPath();ctx.ellipse(width*(.12+i*.13%1),y,150,28,Math.sin(i)*.25,0,Math.PI*2);ctx.fill()}const shelfY=height*.17;ctx.fillStyle='rgba(255,255,255,.32)';roundedRect(18,shelfY,Math.min(170,width*.42),16,8);roundedRect(width-Math.min(190,width*.46)-18,shelfY+54,Math.min(190,width*.46),16,8);for(let i=0;i<15;i++){const x=(i*83+frameCount*.35)%(width+80)-40;const y=64+(i%8)*height*.087;ctx.fillStyle=['#ff6fbd','#6ff3ff','#ffe66d','#b589ff','#9cffcb'][i%5];ctx.globalAlpha=.45;ctx.font=(18+i%4*3)+'px Bangers';ctx.fillText(['✦','♡','☾','⚡','✿'][i%5],x,y);ctx.globalAlpha=1}const signW=Math.min(205,width*.48),signX=(width-signW)/2,signY=height*.095;ctx.fillStyle='rgba(255,255,255,.62)';roundedRect(signX,signY,signW,48,24);ctx.strokeStyle=gameState==='EDITING'||gameState==='PUBLISHING'?'#ff5b7d':'rgba(81,39,94,.25)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=gameState==='EDITING'||gameState==='PUBLISHING'?'#e53d78':'#68436f';ctx.font='800 17px Rajdhani';ctx.textAlign='center';ctx.fillText(gameState==='EDITING'||gameState==='PUBLISHING'?'● LIVE SPELLCAST':'SOFT LAUNCH LOBBY',width/2,signY+30)}
  function drawAvatar(){const cx=width/2,cy=height*.58,scale=Math.min(width,height)/760,bob=Math.sin(frameCount*.052)*5,talk=gameState==='EDITING'?Math.abs(Math.sin(frameCount*.48)):.2;ctx.save();ctx.translate(cx,cy+bob);ctx.scale(scale,scale);const aura=ctx.createRadialGradient(0,20,20,0,24,190);aura.addColorStop(0,'rgba(255,111,189,.30)');aura.addColorStop(.54,'rgba(111,243,255,.18)');aura.addColorStop(1,'rgba(181,137,255,0)');ctx.fillStyle=aura;ctx.beginPath();ctx.ellipse(0,16,175,190,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(82,35,96,.18)';ctx.beginPath();ctx.ellipse(0,205,178,28,0,0,Math.PI*2);ctx.fill();let bg=ctx.createLinearGradient(0,34,0,194);bg.addColorStop(0,'#fff');bg.addColorStop(.42,'#ffb4de');bg.addColorStop(1,'#9b80ff');ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(-93,45,186,154,42);ctx.fill();ctx.fillStyle='#fff9ff';ctx.beginPath();ctx.roundRect(-34,68,68,106,24);ctx.fill();ctx.fillStyle='#6ff3ff';ctx.fillRect(-28,82,56,10);ctx.fillStyle='#ffe66d';ctx.fillRect(-28,103,56,10);ctx.fillStyle='#ff6fbd';ctx.fillRect(-28,124,56,10);ctx.fillStyle='#fff1fb';ctx.beginPath();ctx.ellipse(-62,-71,32,48,-.35,0,Math.PI*2);ctx.ellipse(62,-71,32,48,.35,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f4b5ff';ctx.lineWidth=5;ctx.stroke();let fg=ctx.createRadialGradient(-12,-16,15,0,0,74);fg.addColorStop(0,'#fff3de');fg.addColorStop(.7,'#ffc6c8');fg.addColorStop(1,'#ff9bb8');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,68,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3b173c';ctx.beginPath();ctx.arc(0,-69,76,Math.PI,0);ctx.fill();ctx.fillRect(-76,-20,24,62);ctx.fillRect(52,-20,24,62);ctx.strokeStyle='#6ff3ff';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,80,Math.PI+.05,-.05,false);ctx.stroke();ctx.fillStyle='#291331';if(gameState==='EDITING'&&frameCount%56<8){ctx.fillRect(-30,-10,20,4);ctx.fillRect(10,-10,20,4)}else{ctx.beginPath();ctx.arc(-21,-9,10,0,Math.PI*2);ctx.arc(21,-9,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-17,-12,3,0,Math.PI*2);ctx.arc(25,-12,3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(-12,14,24,6);ctx.fillStyle='#7e173d';ctx.beginPath();ctx.roundRect(-17,27,34,8+talk*18,7);ctx.fill();ctx.fillStyle='#ff8fbd';ctx.beginPath();ctx.roundRect(-10,33,20,4+talk*7,5);ctx.fill();ctx.fillStyle='#ff6fbd';ctx.globalAlpha=.32;ctx.beginPath();ctx.arc(-39,16,11,0,Math.PI*2);ctx.arc(39,16,11,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(-78,105,12,0,Math.PI*2);ctx.arc(78,105,12,0,Math.PI*2);ctx.fill();ctx.restore();drawDesk(scale)}
  function drawDesk(scale){const deskY=height*.79;const dg=ctx.createLinearGradient(0,deskY-24,0,height);dg.addColorStop(0,'rgba(255,255,255,.82)');dg.addColorStop(1,'rgba(255,219,248,.86)');ctx.fillStyle=dg;ctx.fillRect(0,deskY,width,height-deskY);ctx.fillStyle='rgba(181,137,255,.28)';ctx.fillRect(0,deskY,width,5);const micX=width/2,micY=height*.64+88;ctx.save();ctx.translate(micX,micY);ctx.scale(scale,scale);ctx.strokeStyle='#7a4b86';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,94);ctx.lineTo(0,190);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-30,-46,60,96,20);ctx.fill();ctx.strokeStyle='#ff6fbd';ctx.lineWidth=4;ctx.stroke();for(let y=-31;y<41;y+=9){ctx.fillStyle=y%18===0?'#6ff3ff':'#b589ff';ctx.fillRect(-15,y,30,4)}ctx.fillStyle='#ffe66d';ctx.font='34px Bangers';ctx.textAlign='center';ctx.fillText('LIVE',0,88);ctx.restore()}
  function drawWaveform(){if(gameState!=='EDITING')return;const cy=height*.31;ctx.save();ctx.lineWidth=17;ctx.strokeStyle='rgba(255,111,189,.16)';ctx.beginPath();for(let x=0;x<width;x+=6){const amp=48*(.5+editProgress/200),y=cy+Math.sin(x*.02+frameCount*.2)*amp*Math.sin(frameCount*.1);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();const wg=ctx.createLinearGradient(0,cy-20,width,cy+20);wg.addColorStop(0,'#ff6fbd');wg.addColorStop(.34,'#ffe66d');wg.addColorStop(.68,'#6ff3ff');wg.addColorStop(1,'#b589ff');ctx.strokeStyle=wg;ctx.lineWidth=5;ctx.beginPath();for(let x=0;x<width;x+=6){const amp=48*(.5+editProgress/200),y=cy+Math.sin(x*.02+frameCount*.2)*amp*Math.sin(frameCount*.1);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();const barW=Math.min(326,width-48),barH=20,barX=(width-barW)/2,barY=cy+94;ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.roundRect(barX,barY,barW,barH,999);ctx.fill();ctx.fillStyle=wg;ctx.beginPath();ctx.roundRect(barX,barY,barW*(editProgress/100),barH,999);ctx.fill();ctx.strokeStyle='rgba(82,35,96,.2)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#51275e';ctx.font='900 21px Rajdhani';ctx.textAlign='center';ctx.fillText('Tap to charge the hype spell',width/2,barY-18);ctx.restore()}
  function spawnParticle(x,y,text,color='#fff',font='800 22px Rajdhani'){particles.push({x,y,text,speed:1+Math.random()*1.4,life:1,color,font})}
  function drawParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.y-=p.speed;p.life-=.02;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.font=p.font;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}}
  function startChoosingPhase(){gameState='CHOOSING';setPhase('Choose Arc','planning');document.getElementById('interaction-overlay').classList.remove('hidden');tapZone.classList.add('hidden');const container=document.getElementById('choices-container');container.innerHTML='';const choices=[...TOPICS].sort(()=>.5-Math.random()).slice(0,3);choices.forEach(topic=>{const btn=document.createElement('button');btn.className='choice-btn';btn.dataset.testid='choice-button';btn.innerHTML='<span class="choice-label">Content Arc</span><span class="choice-title">'+topic+'</span>';btn.onclick=()=>{audio.playSFX('choose',{volume:.42,cooldown:120});currentTopic=topic;startEditingPhase()};container.appendChild(btn)})}
  function startEditingPhase(){gameState='EDITING';editProgress=0;setPhase('Spellcast','editing');document.getElementById('interaction-overlay').classList.add('hidden');tapZone.classList.remove('hidden');showReaction(ASSETS.gifs.polish,'Cozy mascot hype boost',1200);showToast('Soft focus mode: no timers, just taps ✦',1250);audio.playSFX('hype',{volume:.28,cooldown:160})}
  function handleEditTap(e){if(gameState!=='EDITING')return;audio.playSFX('tap',{volume:.38,cooldown:70});editProgress+=5;const x=e.clientX||width/2,y=e.clientY||height/2;spawnParticle(x,y,['✦','♡','bestie','+hype'][Math.floor(Math.random()*4)],['#ff6fbd','#6ff3ff','#ffe66d','#b589ff'][Math.floor(Math.random()*4)],'800 23px Rajdhani');spawnParticle(x+(Math.random()*18-9),y-16,'☾','#fff','700 22px Cinzel');if(editProgress>=100)publishStream()}
  function publishStream(){gameState='PUBLISHING';tapZone.classList.add('hidden');showReaction(ASSETS.gifs.publish,'Published celebration',2200);audio.playSFX('publish',{volume:.54,cooldown:300});const actualGain=Math.floor(Math.floor(Math.random()*500)+100+(listeners*.1));listeners+=actualGain;scoreDisplay.innerText=listeners.toLocaleString();setPhase('Viral Cozy','published');showToast('+'+actualGain.toLocaleString()+' cozy viewers from '+(currentTopic||'the stream')+'!',1900);for(let i=0;i<10;i++)spawnParticle(width/2+(Math.random()-.5)*230,height/2,'+'+Math.floor(actualGain/10),'#14985c','800 24px Rajdhani');spawnParticle(width/2,height/2-54,'Arc uploaded ✦','#b04482','800 25px Rajdhani');setTimeout(startChoosingPhase,3000)}
  function gameLoop(){ctx.clearRect(0,0,width,height);drawBackground();drawAvatar();drawWaveform();drawParticles();frameCount++;requestAnimationFrame(gameLoop)}
  document.getElementById('start-btn').addEventListener('click',()=>{audio.unlock();audio.playSFX('start',{volume:.45,cooldown:250});audio.playBGM();document.getElementById('start-screen').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');if(!loopStarted){loopStarted=true;gameLoop()}startChoosingPhase()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)audio.stopBGM();else if(gameState!=='MENU')audio.playBGM()});tapZone.addEventListener('mousedown',handleEditTap);tapZone.addEventListener('touchstart',e=>{e.preventDefault();handleEditTap(e.touches[0])},{passive:false});
  window.__STREAMER_TYCOON_STATE__=()=>({listeners,gameState,editProgress,currentTopic,particles:particles.length,topics:TOPICS.length});
});
</script>
