<body>
<div id="game-container">

      <button id="restart-btn" class="interactive btn secondary">Run for Love Again</button>
    </div>
  </section>
</div>
</div>
<script>
'use strict';

const RNG={seed:1337,next(){this.seed=(this.seed*1664525+1013904223)>>>0;return this.seed/4294967296;},range(a,b){return a+(b-a)*this.next();},pick(a,b){return this.next()>.5?a:b;}};

class AudioManager{constructor(){this.ctx=null;this.unlocked=false;this.muted=false;this.isPlaying=false;this.els={};this.lastTone={}}unlock(){if(this.unlocked)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.ctx.resume().catch(()=>{});Object.entries(AUDIO_URLS).forEach(([k,u])=>{const a=new Audio(u);a.preload='auto';a.playsInline=true;a.loop=k==='loop'||k==='wind';a.volume=k==='loop'?0.18:k==='wind'?0.12:0.55;this.els[k]=a});this.unlocked=true}catch(e){this.unlocked=true}}setMuted(v){this.muted=v;Object.values(this.els).forEach(a=>{a.muted=v;if(v)a.pause()});if(!v&&this.isPlaying)this.play('loop',true)}play(k,loop=false){if(!this.unlocked||this.muted)return;const a=this.els[k];if(a){if(!loop){a.pause();a.currentTime=0}a.play().catch(()=>{})}}tone(id,from,to,dur,type='sine',vol=.06){if(!this.ctx||this.muted)return;const now=this.ctx.currentTime;if(now-(this.lastTone[id]||0)<.07)return;this.lastTone[id]=now;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(from,now);o.frequency.exponentialRampToValueAtTime(Math.max(1,to),now+dur);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(this.ctx.destination);o.start(now);o.stop(now+dur)}start(){this.isPlaying=true;this.play('loop',true);this.play('wind',true);this.tone('start',220,440,.2,'triangle',.07)}stop(){this.isPlaying=false;['loop','wind'].forEach(k=>{const a=this.els[k];if(a){a.pause();a.currentTime=0}})}sfx(t){if(t==='jump'){this.play('lane');this.tone('jump',180,360,.12)}if(t==='collect'){this.play('collect');this.tone('collect',650,1180,.16,'triangle',.08)}if(t==='crash'){this.play('crash');this.tone('crash',180,40,.45,'sawtooth',.12)}if(t==='over'){this.play('over');this.tone('over',240,70,.34,'square',.07)}}}
class Game{constructor(){this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d',{alpha:false});this.audio=new AudioManager();this.state='START';this.score=0;this.speed=0;this.lastTime=0;this.distance=0;this.player={lane:0,y:0,animY:0,bounce:0,coat:0};this.entities=[];this.particles=[];this.fog=[];this.hotels=[];this.gifs={};this.messages=['For the vow.','No siren steals love.','Crew close. Heart closer.','The vault remembers us.'];this.resize();window.addEventListener('resize',()=>this.resize());this.initWorld();this.bindInput();requestAnimationFrame(t=>this.loop(t))}resize(){this.width=innerWidth;this.height=innerHeight;this.dpr=devicePixelRatio||1;this.canvas.width=this.width*this.dpr;this.canvas.height=this.height*this.dpr;this.canvas.style.width=this.width+'px';this.canvas.style.height=this.height+'px';this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);const c=this.height*.70;this.laneY=[c-60,c+60];if(this.state==='START'){this.player.y=this.laneY[0];this.player.animY=this.player.y}this.initHotels()}initWorld(){for(let i=0;i<24;i++)this.fog.push({x:rand()*this.width,y:rand()*this.height*.85,r:50+rand()*160,s:8+rand()*24,a:.025+rand()*.065});for(let i=0;i<18;i++)this.particles.push(this.makeDrift())}initHotels(){this.hotels=[];for(let i=0;i<9;i++)this.hotels.push({x:i*this.width/7+rand()*60,y:this.height*.28+rand()*50,w:70+rand()*55,h:120+rand()*150,phase:rand()*6})}makeDrift(){return{x:rand()*this.width,y:rand()*this.height,vx:-20-rand()*38,vy:-8+rand()*16,life:.4+rand()*.6,c:rand()>.5?'#ffd1dc':'#d8d1c3',kind:rand()>.78?'heart':'ash'}}bindInput(){const act=()=>{if(this.state==='START'||this.state==='GAMEOVER')this.startGame();else if(this.state==='PLAYING')this.switchLane()};this.canvas.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;e.preventDefault();this.audio.unlock();act()},{passive:false});addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();this.audio.unlock();act()}},{passive:false});document.getElementById('start-btn').addEventListener('click',()=>{this.audio.unlock();this.startGame()});document.getElementById('restart-btn').addEventListener('click',()=>{this.audio.unlock();this.startGame()});document.getElementById('mute-btn').addEventListener('click',e=>{e.stopPropagation();this.audio.unlock();this.audio.setMuted(!this.audio.muted);document.getElementById('mute-icon').textContent=this.audio.muted?'🔇':'🔊'})}startGame(){this.state='PLAYING';this.score=0;this.speed=CONFIG.baseSpeed;this.distance=0;this.entities=[];this.particles=[];for(let i=0;i<18;i++)this.particles.push(this.makeDrift());this.player.lane=0;this.player.y=this.laneY[0];this.player.animY=this.player.y;document.getElementById('start-screen').classList.add('hidden');document.getElementById('game-over-screen').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('score').textContent='0';this.hideGif('collect-gif');this.hideGif('danger-gif');this.say('Love is the exit plan.');this.audio.start()}switchLane(){this.player.lane=this.player.lane===0?1:0;this.player.coat=1;this.audio.sfx('jump');for(let i=0;i<8;i++)this.spawnParticle(100,this.player.animY+30,'#d8d1c3',(rand()-.5)*110,rand()*65)}say(txt){const b=document.getElementById('leader-speech');b.textContent=txt;b.classList.add('active');if(this.sayTimer)clearTimeout(this.sayTimer);this.sayTimer=setTimeout(()=>b.classList.remove('active'),1300)}showGif(id,d=900){const el=document.getElementById(id);if(!el)return;el.classList.add('active');if(this.gifs[id])clearTimeout(this.gifs[id]);this.gifs[id]=setTimeout(()=>this.hideGif(id),d)}hideGif(id){const el=document.getElementById(id);if(el)el.classList.remove('active')}spawnObstacle(){const lane=rand()>.5?1:0;const isBad=rand()>.3;this.entities.push({x:this.width+100,lane,type:isBad?'ROCK':'NOTE',collected:false,spin:rand()*6})}spawnParticle(x,y,c,vx,vy){this.particles.push({x,y,c,vx,vy,life:1,kind:'spark'})}update(dt){const move=this.state==='PLAYING'?this.speed:50;for(const f of this.fog){f.x-=f.s*dt;if(f.x<-f.r){f.x=this.width+f.r;f.y=rand()*this.height*.82}}for(const h of this.hotels){h.x-=move*.08*dt;if(h.x<-h.w){h.x=this.width+40;h.h=120+rand()*150}}const target=this.laneY[this.player.lane];this.player.animY+=(target-this.player.animY)*10*dt;this.player.bounce=Math.sin(Date.now()/95)*3;this.player.coat=Math.max(0,this.player.coat-dt*3);const bubble=document.getElementById('leader-speech');if(bubble.classList.contains('active')){bubble.style.top=(this.player.animY-98)+'px';bubble.style.left=(this.width<520?'76px':'96px')}if(this.state!=='PLAYING'){this.updateParticles(dt);return}this.distance+=this.speed*dt;this.speed+=CONFIG.accel*dt;if(this.entities.length===0||(this.width-this.entities[this.entities.length-1].x)>(CONFIG.spawnBase+rand()*CONFIG.spawnRandom))this.spawnObstacle();for(let i=this.entities.length-1;i>=0;i--){const e=this.entities[i];e.x-=this.speed*dt;e.spin+=dt*3;if(!e.collected&&Math.abs(e.x-100)<50&&Math.abs(this.player.animY-this.laneY[e.lane])<40){if(e.type==='NOTE'){e.collected=true;this.score++;document.getElementById('score').textContent=this.score;this.audio.sfx('collect');this.showGif('collect-gif',900);this.say(this.messages[this.score%this.messages.length]);for(let k=0;k<12;k++)this.spawnParticle(e.x,this.laneY[e.lane],'#ffd1dc',(rand()-.5)*310,(rand()-.5)*300)}else{this.showGif('danger-gif',1400);this.gameOver()}}if(e.x<-100||e.collected)this.entities.splice(i,1)}this.updateParticles(dt)}updateParticles(dt){for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='spark')p.vy+=420*dt;p.life-=p.kind==='spark'?dt*2:dt*.28;if(p.life<=0){this.particles.splice(i,1);if(this.particles.length<34)this.particles.push(this.makeDrift())}}}gameOver(){if(this.state==='GAMEOVER')return;this.state='GAMEOVER';this.audio.sfx('crash');this.audio.stop();this.audio.sfx('over');document.getElementById('final-score').textContent=this.score;document.getElementById('game-over-screen').classList.remove('hidden');document.getElementById('hud').classList.add('hidden');this.say('The fog found the route.');for(let i=0;i<32;i++)this.spawnParticle(100,this.player.animY,'#ff3838',(rand()-.5)*520,(rand()-.5)*520)}phase(){return Math.min(4,Math.floor(this.score/4))}draw(){const c=this.ctx,w=this.width,h=this.height,ph=this.phase();let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#08090c');g.addColorStop(.48,ph>2?'#211018':'#171016');g.addColorStop(1,'#050507');c.fillStyle=g;c.fillRect(0,0,w,h);this.drawMoon(c,w,h,ph);this.drawHotels(c,w,h,ph);for(const f of this.fog){c.globalAlpha=f.a+.01*ph;c.fillStyle='#d8d1c3';c.beginPath();c.ellipse(f.x,f.y,f.r,f.r*.28,0,0,Math.PI*2);c.fill()}c.globalAlpha=1;this.drawRoad(c,w,h,ph);for(const e of this.entities)this.drawEntity(c,e);if(this.state!=='GAMEOVER')this.drawLeader(c,100,this.player.animY+this.player.bounce);this.drawParticles(c);c.globalAlpha=1}drawMoon(c,w,h,ph){const x=w*.74,y=h*.18,r=Math.min(w,h)*.105;c.save();c.shadowColor='rgba(255,107,147,.55)';c.shadowBlur=34;c.fillStyle='rgba(247,234,223,.9)';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.shadowBlur=0;c.fillStyle='rgba(143,15,45,.72)';c.beginPath();c.moveTo(x,y+r*.55);c.bezierCurveTo(x-r*.9,y-r*.05,x-r*.42,y-r*.72,x,y-r*.25);c.bezierCurveTo(x+r*.42,y-r*.72,x+r*.9,y-r*.05,x,y+r*.55);c.fill();c.strokeStyle='rgba(20,8,12,.62)';c.lineWidth=3;c.beginPath();c.arc(x,y,r*.58,0,Math.PI*2);c.stroke();c.restore()}drawHotels(c,w,h,ph){for(const b of this.hotels){c.fillStyle='rgba(0,0,0,.46)';c.fillRect(b.x,b.y,b.w,b.h);c.strokeStyle='rgba(216,209,195,.12)';c.strokeRect(b.x,b.y,b.w,b.h);for(let yy=b.y+18;yy<b.y+b.h-8;yy+=28){for(let xx=b.x+12;xx<b.x+b.w-10;xx+=24){c.fillStyle=(Math.sin(Date.now()/700+b.phase+xx)>.78?'rgba(255,107,147,.25)':'rgba(216,209,195,.06)');c.fillRect(xx,yy,10,14)}}}}drawRoad(c,w,h,ph){const top=this.laneY[0]-54,bot=this.laneY[1]+54;
