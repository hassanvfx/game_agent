<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Patch-Up Patrol</title>
    <!-- [agent-note][stage3] resolved-font: title -> Bangers | ui -> Exo 2 | source: catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-skin: #FFE0BD;
            --accent-warm: #ff6f6a;
            --accent-cool: #78d7ff;
            --accent-sunny: #ffd96b;
            --accent-heal: #95f2c7;
            --text-dark: #28304d;
            --text-soft: #51607e;
            --panel-bg: rgba(255, 255, 255, 0.68);
            --panel-border: rgba(255, 255, 255, 0.92);
            --overlay-light: rgba(255, 248, 252, 0.7);
            --overlay-strong: rgba(255, 248, 252, 0.82);
            --sky-top: #8ad8ff;
            --sky-bottom: #ffe9d5;
            --cloud: rgba(255, 255, 255, 0.7);
            --shadow-soft: rgba(64, 81, 125, 0.16);
            --shadow-strong: rgba(56, 73, 118, 0.24);
            --font-title: 'Bangers', 'Trebuchet MS', system-ui, sans-serif;
            --font-ui: 'Exo 2', system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.6), transparent 30%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 58%, #ffd4b7 100%);
            font-family: var(--font-ui);
        }

        body {
            touch-action: auto;
            user-select: none;
            color: var(--text-dark);
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: auto;
            pointer-events: none;
            z-index: 0;
            border-radius: 999px;
            background: var(--cloud);
            filter: blur(4px);
            opacity: 0.75;
        }

        body::before {
            top: 10%;
            left: 8%;
            width: 120px;
            height: 34px;
            box-shadow:
                36px -10px 0 10px var(--cloud),
                82px 0 0 4px var(--cloud);
        }

        body::after {
            top: 18%;
            right: 10%;
            width: 110px;
            height: 30px;
            box-shadow:
                -34px -8px 0 10px var(--cloud),
                30px 0 0 6px var(--cloud);
        }

        body.cursor-none {
            cursor: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        .glass {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), var(--panel-bg));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 12px 24px var(--shadow-soft),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .screen-title,
        .screen-subtitle,
        .cta-button,
        .hud-badge,
        .win-title {
            letter-spacing: 0.04em;
        }

        .screen-title,
        .win-title,
        .cta-button,
        .hud-badge {
            font-family: var(--font-title);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2px),
                radial-gradient(circle at 82% 14%, rgba(255, 255, 255, 0.8) 0 1.5px, transparent 3px),
                radial-gradient(circle at 68% 30%, rgba(255, 255, 255, 0.75) 0 1px, transparent 2px),
                radial-gradient(circle at 22% 68%, rgba(255, 255, 255, 0.7) 0 1px, transparent 2px);
            opacity: 0.7;
        }

        #game-container::after {
            inset: 12px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 24px;
            box-shadow: inset 0 0 0 1px rgba(120, 215, 255, 0.28);
            opacity: 0.85;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(16px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom)) 24px;
            box-sizing: border-box;
        }

        #hud {
            display: flex;
            justify-content: center;
            width: 100%;
            transition: opacity 0.5s ease;
        }

        .hud-pill {
            padding: 10px 24px;
            border-radius: 999px;
            position: relative;
            overflow: hidden;
        }

        .hud-pill::after {
            content: '🩹';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%) rotate(-8deg);
            font-size: 1rem;
            opacity: 0.8;
        }

        .hud-badge {
            font-size: clamp(1rem, 2.8vw, 1.5rem);
            font-weight: 400;
            color: var(--text-dark);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
            padding-right: 20px;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: auto;
            padding: 24px;
            box-sizing: border-box;
            z-index: 2;
        }

        #start-screen {
            background: var(--overlay-light);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #win-screen {
            background: var(--overlay-strong);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #win-screen.opacity-100 {
            opacity: 1;
        }

        .screen-title {
            margin: 0 0 12px;
            font-size: clamp(3rem, 10vw, 5.5rem);
            line-height: 0.95;
            color: var(--accent-warm);
            text-shadow:
                0 3px 0 rgba(255, 255, 255, 0.85),
                0 12px 18px rgba(255, 111, 106, 0.22);
        }

        .screen-subtitle {
            margin: 0 0 28px;
            font-size: clamp(1rem, 3.6vw, 1.4rem);
            color: var(--text-soft);
            animation: pulse 1.6s ease-in-out infinite;
            font-weight: 600;
        }

        .instruction-copy {
            margin: 0 0 22px;
            max-width: 32rem;
            font-size: clamp(0.95rem, 3.2vw, 1.1rem);
            line-height: 1.45;
            color: var(--text-soft);
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 22px;
            padding: 14px 18px;
            box-shadow: 0 8px 20px rgba(64, 81, 125, 0.08);
        }

        .cta-button {
            border: 0;
            border-radius: 999px;
            color: #fff;
            font-size: clamp(1.3rem, 4.5vw, 2rem);
            padding: 16px 40px;
            box-shadow:
                0 10px 24px var(--shadow-strong),
                inset 0 -4px 0 rgba(0, 0, 0, 0.08);
            transform: scale(1);
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            cursor: pointer;
            pointer-events: auto;
            position: relative;
        }

        .cta-button:hover {
            transform: scale(1.05);
            filter: brightness(1.04);
        }

        .cta-button:active {
            transform: scale(0.95);
        }

        .cta-start {
            background: linear-gradient(180deg, #7fe4ff 0%, #4fb8ff 100%);
        }

        .cta-start:hover {
            background: linear-gradient(180deg, #91e8ff 0%, #5ec0ff 100%);
        }

        .cta-next {
            background: linear-gradient(180deg, #ff8a7f 0%, #ff6f6a 100%);
        }

        .cta-next:hover {
            background: linear-gradient(180deg, #ff968c 0%, #ff766f 100%);
        }

        .win-title {
            margin: 0 0 12px;
            font-size: clamp(2.75rem, 8vw, 4.75rem);
            color: var(--accent-cool);
            text-shadow:
                0 3px 0 rgba(255, 255, 255, 0.86),
                0 12px 18px rgba(120, 215, 255, 0.2);
        }

        .win-burst {
            margin: 0 0 28px;
            font-size: clamp(2.75rem, 8vw, 4.5rem);
        }

        .status-note {
            margin: 0 0 22px;
            font-size: clamp(1rem, 3.2vw, 1.1rem);
            color: var(--text-soft);
        }

        .hero-mascot,
        .win-mascot {
            font-size: clamp(4rem, 16vw, 7rem);
            line-height: 1;
            margin: 0 0 12px;
            filter: drop-shadow(0 14px 18px rgba(64, 81, 125, 0.18));
            animation: floaty 2.2s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .hero-mascot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: min(180px, 46vw);
            aspect-ratio: 1;
            border-radius: 32px;
            background:
                radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.95) 0 14%, transparent 15%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.48));
            border: 2px solid rgba(255, 255, 255, 0.82);
            box-shadow:
                0 18px 26px rgba(64, 81, 125, 0.14),
                inset 0 -10px 18px rgba(120, 215, 255, 0.15);
        }

        .feedback-gif {
            position: absolute;
            right: 16px;
            bottom: 18px;
            width: clamp(92px, 24vw, 148px);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 10px 24px rgba(64, 81, 125, 0.2);
            background: rgba(255, 255, 255, 0.42);
            object-fit: cover;
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            transition: opacity 0.28s ease, transform 0.28s ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.win-gif {
            left: 50%;
            right: auto;
            bottom: 138px;
            width: clamp(116px, 28vw, 180px);
            transform: translate(-50%, 14px) scale(0.92);
        }

        .feedback-gif.win-gif.visible {
            transform: translate(-50%, 0) scale(1);
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        @media (max-width: 640px) {
            #game-container::after {
                inset: 8px;
                border-radius: 18px;
            }

            #ui-layer {
                padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) 16px;
            }

            .hud-pill {
                padding: 8px 18px;
            }

            .instruction-copy {
                padding: 12px 14px;
                border-radius: 18px;
            }

            .cta-button {
                width: min(100%, 320px);
            }

            .hero-mascot,
            .win-mascot {
                margin-bottom: 10px;
            }

            .feedback-gif {
                right: 12px;
                bottom: 12px;
                width: clamp(82px, 28vw, 116px);
            }

            .feedback-gif.win-gif {
                bottom: 126px;
                width: clamp(104px, 34vw, 148px);
            }
        }
    </style>
</head>

<script>
/**
 * §2 & §4 Technical Core
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config & State ---
    window.gameConfig = {
        cleaningSpeed: 15,
        debrisCount: 4,
        skinColor: "#FFE0BD",
        bloodColor: "#FF6B6B"
    };

    // Config Loader
    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (const key in rawConfig) {
            window.gameConfig[key] = rawConfig[key].value;
        }
    } catch(e) { console.error("Config load error", e); }

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'skinColor' || key === 'bloodColor') initLevel();
        }
    };

    // --- Audio System ---
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtor ? new AudioCtor() : null;
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        pick: document.getElementById('sfx_pick'),
        clean: document.getElementById('sfx_clean'),
        place: document.getElementById('sfx_place'),
        ui: document.getElementById('sfx_ui'),
        win: document.getElementById('sfx_win')
    };
    Object.entries({
        bgm: 0.2,
        pick: 0.45,
        clean: 0.38,
        place: 0.42,
        ui: 0.36,
        win: 0.5
    }).forEach(([name, volume]) => {
        if (sounds[name]) sounds[name].volume = volume;
    });

    let audioUnlocked = false;
    const sfxCooldowns = new Map();
    const reactionGif = document.getElementById('reaction-gif');
    const winGif = document.getElementById('win-gif');
    let reactionGifTimer = null;

    const showReactionGif = (mode) => {
        if (!reactionGif) return;
        if (reactionGifTimer) clearTimeout(reactionGifTimer);
        reactionGif.src = mode === 'clean'
            ? 'https://i.giphy.com/1zmG8avB83Uvm.webp'
            : 'https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp';
        reactionGif.classList.add('visible');
        reactionGifTimer = setTimeout(() => {
            reactionGif.classList.remove('visible');
        }, mode === 'clean' ? 720 : 900);
    };

    const unlockAudio = () => {
        if (audioUnlocked) return;
        const resumePromise = audioCtx ? audioCtx.resume().catch(() => {}) : Promise.resolve();
        resumePromise.then(() => {
            audioUnlocked = true;
            if (sounds.bgm) {
                sounds.bgm.currentTime = 0;
                sounds.bgm.play().catch(() => {});
            }
        });
    };

    const playSfx = (name, cooldown = 0) => {
        if (!audioUnlocked) return;
        const now = performance.now();
        const lastPlayed = sfxCooldowns.get(name) || 0;
        if (cooldown > 0 && now - lastPlayed < cooldown) return;
        sfxCooldowns.set(name, now);

        const el = sounds[name];
        if (el) {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => playSynthFallback(name));
        } else {
            playSynthFallback(name);
        }
    };

    const playSynthFallback = (type) => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'pick') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(720, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'clean') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(360, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(620, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        } else if (type === 'place') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(760, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.18);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    };

    // --- Canvas & Loop ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width, height, dpr;
    let lastTime = 0;
    let isGameActive = false;

    // Game State
    const STAGE_PLUCKING = 0;
    const STAGE_CLEANING = 1;
    const STAGE_BANDAGING = 2;
    const STAGE_DONE = 3;

    let currentStage = STAGE_PLUCKING;
    let particles = []; // Dirt/Sparkles
    let debris = []; // Shards
    let bandage = { x: 0, y: 0, progress: 0 };
    let pointer = { x: 0, y: 0, isDown: false, holdTime: 0 };
    let heldDebris = null;
    let woundCenter = { x: 0, y: 0, radius: 100 };
    let inflammation = 1.0; // 1.0 = red, 0.0 = healed
    let characterBlink = 0;

    // Resize
    const resize = () => {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Re-center wound if resizing
        woundCenter.x = width / 2;
        woundCenter.y = height / 2;
        woundCenter.radius = Math.min(width, height) * 0.25;
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Game Logic ---

    function initLevel() {
        currentStage = STAGE_PLUCKING;
        particles = [];
        debris = [];
        inflammation = 1.0;
        bandage.progress = 0;

        document.getElementById('instruction-text').innerText = "CLEAR THE SPLINTERS";
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('win-screen').classList.add('hidden');
        document.getElementById('win-screen').classList.remove('opacity-100');
        if (reactionGif) reactionGif.classList.remove('visible');
        if (winGif) winGif.classList.remove('visible');

        // Generate Debris (Shards)
        for (let i = 0; i < window.gameConfig.debrisCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (woundCenter.radius * 0.5);
            debris.push({
                x: woundCenter.x + Math.cos(angle) * dist,
                y: woundCenter.y + Math.sin(angle) * dist,
                angle: Math.random() * Math.PI * 2,
                length: 20 + Math.random() * 20,
                width: 4 + Math.random() * 4,
                color: '#5D4037',
                id: i
            });
        }

        // Generate Dirt
        for (let i = 0; i < 150; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (woundCenter.radius * 0.9);
            particles.push({
                x: woundCenter.x + Math.cos(angle) * dist,
                y: woundCenter.y + Math.sin(angle) * dist,
                r: 2 + Math.random() * 4,
                alpha: 0.6 + Math.random() * 0.4,
                type: 'dirt'
            });
        }
    }

    function spawnSparkles(x, y, count = 5) {
        for(let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                r: 2 + Math.random() * 3,
                alpha: 1,
                life: 1.0,
                type: 'sparkle',
                color: `hsl(${Math.random() * 60 + 40}, 100%, 70%)`
            });
        }
    }

    function update(dt) {
        if (!isGameActive) return;

        // Particle Logic
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            if (p.type === 'sparkle') {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= dt * 2;
                p.alpha = p.life;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // Stage Logic
        if (currentStage === STAGE_PLUCKING) {
            if (pointer.isDown && !heldDebris) {
                for (const d of debris) {
                    const dx = pointer.x - d.x;
                    const dy = pointer.y - d.y;
                    if (dx * dx + dy * dy < 900) {
                        heldDebris = d;
                        break;
                    }
                }
            } else if (pointer.isDown && heldDebris) {
                const dx = pointer.x - heldDebris.x;
                const dy = pointer.y - heldDebris.y;
                heldDebris.x += dx * 0.2;
                heldDebris.y += dy * 0.2;

                const distFromCenter = Math.hypot(heldDebris.x - woundCenter.x, heldDebris.y - woundCenter.y);
                if (distFromCenter > woundCenter.radius + 50) {
                    spawnSparkles(heldDebris.x, heldDebris.y, 10);
                    playSfx('pick', 90);
                    showReactionGif('pick');
                    debris = debris.filter(d => d !== heldDebris);
                    heldDebris = null;

                    if (debris.length === 0) {
                        currentStage = STAGE_CLEANING;
                        document.getElementById('instruction-text').innerText = "WIPE THE SCRAPE";
                    }
                }
            } else {
                heldDebris = null;
            }
        }
        else if (currentStage === STAGE_CLEANING) {
            if (pointer.isDown) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    if (p.type === 'dirt') {
                        const dx = pointer.x - p.x;
                        const dy = pointer.y - p.y;
                        if (dx * dx + dy * dy < 900) {
                            p.alpha -= dt * (window.gameConfig.cleaningSpeed * 0.1);
                            if (p.alpha <= 0) {
                                particles.splice(i, 1);
                                spawnSparkles(p.x, p.y, 1);
                            }
                        }
                    }
                }

                const dirtyCount = particles.filter(p => p.type === 'dirt').length;
                inflammation = Math.max(0.2, dirtyCount / 150);

                if (dirtyCount === 0) {
                    currentStage = STAGE_BANDAGING;
                    document.getElementById('instruction-text').innerText = "PLACE THE BANDAGE";
                    inflammation = 0.1;
                    playSfx('clean', 240);
                    showReactionGif('clean');
                }
            }
        }
        else if (currentStage === STAGE_BANDAGING) {
            if (pointer.isDown) {
                const dx = pointer.x - woundCenter.x;
                const dy = pointer.y - woundCenter.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 50) {
                    bandage.progress += dt * 2;
                    if (bandage.progress >= 1) {
                        playSfx('place', 240);
                        currentStage = STAGE_DONE;
                        gameWin();
                    }
                }
            }
        }
    }

    function gameWin() {
        playSfx('win');
        document.getElementById('hud').classList.add('hidden');
        const winScreen = document.getElementById('win-screen');
        winScreen.classList.remove('hidden');
        if (reactionGif) reactionGif.classList.remove('visible');

        requestAnimationFrame(() => {
            winScreen.classList.add('opacity-100');
            if (winGif) winGif.classList.add('visible');
        });

        for (let i = 0; i < 50; i++) {
            spawnSparkles(width / 2 + (Math.random() - 0.5) * width, height / 2 + (Math.random() - 0.5) * height, 1);
        }
    }

    function draw() {
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, '#8ad8ff');
        skyGrad.addColorStop(0.58, '#ffe9d5');
        skyGrad.addColorStop(1, '#ffd4b7');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        drawClinicBackdrop();

        if (currentStage !== STAGE_DONE) {
            const grad = ctx.createRadialGradient(woundCenter.x, woundCenter.y, 0, woundCenter.x, woundCenter.y, woundCenter.radius);
            const r = parseInt(window.gameConfig.bloodColor.slice(1, 3), 16);
            const g = parseInt(window.gameConfig.bloodColor.slice(3, 5), 16);
            const b = parseInt(window.gameConfig.bloodColor.slice(5, 7), 16);
            const alpha = 0.3 + inflammation * 0.4;

            grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
            grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(woundCenter.x, woundCenter.y, woundCenter.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = "#5D4037";
        for (const p of particles) {
            if (p.type === 'dirt') {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1.0;

        ctx.strokeStyle = "#3E2723";
        ctx.lineWidth = 2;
        for (const d of debris) {
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.rotate(d.angle);
            ctx.fillStyle = "#4E342E";
            ctx.beginPath();
            ctx.moveTo(-d.width, -d.length / 2);
            ctx.lineTo(d.width, -d.length / 2);
            ctx.lineTo(0, d.length / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        for (const p of particles) {
            if (p.type === 'sparkle') {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1.0;

        if (currentStage === STAGE_BANDAGING || currentStage === STAGE_DONE) {
            if (bandage.progress > 0) {
                ctx.save();
                ctx.translate(woundCenter.x, woundCenter.y);
                ctx.rotate(-Math.PI / 4);
                ctx.globalAlpha = Math.min(1, bandage.progress);
                const bandageImg = document.getElementById('asset_bandage');
                const bw = 200;
                const bh = 80;
                ctx.drawImage(bandageImg, -bw / 2, -bh / 2, bw, bh);
                ctx.restore();
            }
        }

        drawCharacterFace();
        drawTool();
    }

    function drawClinicBackdrop() {
        const hillGrad = ctx.createLinearGradient(0, height * 0.58, 0, height);
        hillGrad.addColorStop(0, '#c9f7da');
        hillGrad.addColorStop(1, '#9ee6bb');

        ctx.fillStyle = hillGrad;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.72);
        ctx.quadraticCurveTo(width * 0.22, height * 0.6, width * 0.45, height * 0.72);
        ctx.quadraticCurveTo(width * 0.72, height * 0.84, width, height * 0.68);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath();
        ctx.arc(width * 0.14, height * 0.16, Math.min(width, height) * 0.05, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(0, height * 0.78, width, height * 0.22);
    }

    function drawCharacterFace() {
        const faceRadius = woundCenter.radius * 0.88;
        const faceY = woundCenter.y - woundCenter.radius * 0.14;
        const faceGrad = ctx.createRadialGradient(
            woundCenter.x - faceRadius * 0.3,
            faceY - faceRadius * 0.35,
            faceRadius * 0.12,
            woundCenter.x,
            faceY,
            faceRadius
        );
        faceGrad.addColorStop(0, '#fff3e4');
        faceGrad.addColorStop(1, window.gameConfig.skinColor);

        ctx.save();
        ctx.fillStyle = faceGrad;
        ctx.beginPath();
        ctx.arc(woundCenter.x, faceY, faceRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.arc(woundCenter.x - faceRadius * 0.3, faceY - faceRadius * 0.34, faceRadius * 0.22, 0, Math.PI * 2);
        ctx.fill();

        const eyeOffsetX = faceRadius * 0.34;
        const eyeY = faceY - faceRadius * 0.12;
        const eyeWidth = faceRadius * 0.12;
        const blink = Math.max(0.12, Math.abs(Math.sin(Date.now() / 900 + characterBlink)));

        ctx.strokeStyle = '#28304d';
        ctx.lineWidth = Math.max(2, faceRadius * 0.03);
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(woundCenter.x - eyeOffsetX - eyeWidth * 0.5, eyeY);
        ctx.quadraticCurveTo(woundCenter.x - eyeOffsetX, eyeY - eyeWidth * blink, woundCenter.x - eyeOffsetX + eyeWidth * 0.5, eyeY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(woundCenter.x + eyeOffsetX - eyeWidth * 0.5, eyeY);
        ctx.quadraticCurveTo(woundCenter.x + eyeOffsetX, eyeY - eyeWidth * blink, woundCenter.x + eyeOffsetX + eyeWidth * 0.5, eyeY);
        ctx.stroke();

        ctx.fillStyle = '#ff9ab1';
        ctx.beginPath();
        ctx.arc(woundCenter.x - faceRadius * 0.46, faceY + faceRadius * 0.12, faceRadius * 0.11, 0, Math.PI * 2);
        ctx.arc(woundCenter.x + faceRadius * 0.46, faceY + faceRadius * 0.12, faceRadius * 0.11, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = currentStage === STAGE_DONE ? '#4fb8ff' : '#ff8b8b';
        ctx.lineWidth = Math.max(3, faceRadius * 0.04);
        ctx.beginPath();
        if (currentStage === STAGE_DONE) {
            ctx.arc(woundCenter.x, faceY + faceRadius * 0.16, faceRadius * 0.26, 0.12 * Math.PI, 0.88 * Math.PI);
        } else {
            ctx.arc(woundCenter.x, faceY + faceRadius * 0.28, faceRadius * 0.2, 1.1 * Math.PI, 1.9 * Math.PI);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawTool() {
        if (!isGameActive || currentStage === STAGE_DONE) return;

        ctx.save();
        ctx.translate(pointer.x, pointer.y);

        const tilt = Math.sin(Date.now() / 200) * 0.1;
        ctx.rotate(tilt);

        if (currentStage === STAGE_PLUCKING) {
            const img = document.getElementById('asset_tweezers');
            const pinch = heldDebris ? 5 : 0;
            ctx.drawImage(img, -10 + pinch, -100, 50, 150);
        } else if (currentStage === STAGE_CLEANING) {
            const img = document.getElementById('asset_swab');
            const bob = pointer.isDown ? Math.sin(Date.now() / 50) * 5 : 0;
            ctx.drawImage(img, -15, -120 + bob, 30, 150);
        } else if (currentStage === STAGE_BANDAGING) {
            const img = document.getElementById('asset_bandage');
            ctx.globalAlpha = 0.5;
            ctx.drawImage(img, -100, -40, 200, 80);
        }

        ctx.restore();
    }

    function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error("Loop error:", e);
        }

        requestAnimationFrame(loop);
    }

    characterBlink = Math.random() * Math.PI * 2;

    const handlePointer = (e, isDown) => {
        if (e.cancelable) e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        pointer.x = e.clientX - rect.left;
        pointer.y = e.clientY - rect.top;
        if (isDown !== null) pointer.isDown = isDown;

        if (isDown === true) unlockAudio();
    };

    canvas.addEventListener('pointerdown', e => handlePointer(e, true), { passive: false });
    canvas.addEventListener('pointermove', e => handlePointer(e, null), { passive: false });
    canvas.addEventListener('pointerup', e => handlePointer(e, false), { passive: false });
    canvas.addEventListener('pointercancel', e => handlePointer(e, false), { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        unlockAudio();
        playSfx('ui', 120);
        document.getElementById('start-screen').classList.add('hidden');
        isGameActive = true;
        initLevel();
    });

    document.getElementById('next-btn').addEventListener('click', () => {
        playSfx('ui', 120);
        initLevel();
    });

    requestAnimationFrame(loop);
});
</script>
</body>
