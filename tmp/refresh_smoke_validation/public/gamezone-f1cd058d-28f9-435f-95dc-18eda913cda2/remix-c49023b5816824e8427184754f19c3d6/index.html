<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Plush Pet Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#211633;--muted:#75658f;--panel:rgba(255,255,255,.76);--line:rgba(255,255,255,.86);--neon:#7df9ff;--pink:#ff6fd8;--sun:#ffe66d;--leaf:#7cffaa;--violet:#9b7cff;--night:#18102f}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#16102a;color:var(--ink);font-family:'Exo 2',system-ui,sans-serif;touch-action:manipulation}body{background:radial-gradient(circle at 50% 6%,rgba(255,111,216,.34),transparent 24%),linear-gradient(180deg,#17102f 0%,#2f2157 48%,#15372f 100%)}canvas{display:block;touch-action:none}.no-select{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.layer{position:absolute;inset:0}.hud{pointer-events:none;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 12px);z-index:10}.top{width:min(94vw,440px);margin:0 auto;display:grid;gap:9px;opacity:0;transition:.45s}.top.show,.actions.show{opacity:1}.meter{display:grid;grid-template-columns:38px 1fr 58px;align-items:center;gap:9px;padding:9px 11px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.58));border:1.5px solid var(--line);box-shadow:0 10px 26px rgba(17,6,42,.18),inset 0 0 18px rgba(255,255,255,.3);backdrop-filter:blur(12px)}.meter i{font-style:normal;font-size:24px;text-align:center}.track{height:13px;border-radius:999px;background:rgba(33,22,51,.15);overflow:hidden;border:1px solid rgba(255,255,255,.75)}.fill{height:100%;width:50%;border-radius:999px;box-shadow:0 0 16px currentColor;transition:width .35s ease}.label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.actions{pointer-events:auto;display:flex;justify-content:center;gap:13px;opacity:0;transition:.45s}.care{width:64px;height:64px;border:0;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.56));box-shadow:0 14px 26px rgba(11,7,32,.28),inset 0 0 0 2px rgba(255,255,255,.7);font-size:29px;display:grid;place-items:center;cursor:pointer;transition:transform .08s,filter .2s}.care:active{transform:scale(.93)}.care.sleeping{filter:hue-rotate(45deg) brightness(.9);box-shadow:0 0 28px rgba(125,249,255,.44),inset 0 0 0 2px rgba(125,249,255,.9)}.start{z-index:30;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 18%,rgba(125,249,255,.25),transparent 28%),linear-gradient(180deg,rgba(24,16,47,.72),rgba(13,38,34,.84))}.card{width:min(92vw,430px);text-align:center;border-radius:30px;padding:28px 20px;background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.62));border:2px solid rgba(255,255,255,.86);box-shadow:0 24px 70px rgba(0,0,0,.32),inset 0 0 30px rgba(255,255,255,.35);backdrop-filter:blur(16px);position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 180deg,transparent,rgba(255,111,216,.18),transparent,rgba(125,249,255,.2),transparent);animation:spin 12s linear infinite}.card>*{position:relative}.kicker{margin:0 0 8px;color:#5e4b7c;font-weight:700}.title{font-family:'Audiowide',system-ui,sans-serif;font-size:clamp(2.2rem,10vw,3.7rem);line-height:.95;margin:0;color:#261a45;text-shadow:0 0 18px rgba(255,111,216,.36)}.subtitle{margin:8px 0 14px;color:#705c91;font-weight:700}.mascot{font-size:55px;filter:drop-shadow(0 8px 18px rgba(255,230,109,.4));animation:floaty 1.8s ease-in-out infinite}.instructions{font-size:1rem;line-height:1.35;color:#57476f;margin:14px 0 20px}.start button{border:0;border-radius:999px;padding:14px 26px;background:linear-gradient(90deg,var(--pink),var(--neon));font-family:'Audiowide';font-size:1rem;color:white;text-shadow:0 1px 4px rgba(0,0,0,.28);box-shadow:0 12px 24px rgba(255,111,216,.28);cursor:pointer}.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,18px) scale(.95);z-index:18;opacity:0;pointer-events:none;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);font-weight:800;color:#4b386d;box-shadow:0 14px 28px rgba(0,0,0,.22);transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.reaction{position:absolute;right:14px;bottom:102px;width:min(28vw,100px);aspect-ratio:1;border-radius:22px;object-fit:cover;border:2px solid rgba(255,255,255,.9);box-shadow:0 18px 32px rgba(0,0,0,.22);opacity:0;transform:translateY(14px) scale(.9);transition:.25s;z-index:15;pointer-events:none}.reaction.show{opacity:.94;transform:translateY(0) scale(1)}.hidden{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes floaty{50%{transform:translateY(-8px)}}@media (max-width:420px){.hud{padding-left:10px;padding-right:10px}.care{width:60px;height:60px;border-radius:22px}.meter{grid-template-columns:32px 1fr 48px;padding:8px}.label{font-size:10px}.actions{gap:10px}}
  </style>
</head>
<body class="no-select">
  <audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3" preload="auto" loop></audio>
  <audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>
  <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
  <audio id="sfx_pet" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
  <audio id="sfx_feed" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
  <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
  <audio id="sfx_play" src="https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3" preload="auto"></audio>
  <audio id="sfx_sleep" src="https://gamezone-virid.vercel.app/assets/audios/ui/pause_02.mp3" preload="auto"></audio>
  <audio id="sfx_wake" src="https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3" preload="auto"></audio>
  <audio id="sfx_blocked" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3" preload="auto"></audio>
  <canvas id="gameCanvas" class="layer"></canvas>
  <img id="gif-love" class="reaction hidden" src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp" alt="happy pet reaction">
  <img id="gif-snooze" class="reaction hidden" src="https://i.giphy.com/U89KtC4wdeKat7fH9X.webp" alt="sleepy pet reaction">
  <div class="hud">
    <div id="hud-stats" class="top">
      <div class="meter"><i>🍜</i><div class="track"><div id="bar-hunger" class="fill" style="color:var(--sun);background:linear-gradient(90deg,#ff9b54,var(--sun));width:50%"></div></div><span class="label">snack</span></div>
      <div class="meter"><i>💗</i><div class="track"><div id="bar-love" class="fill" style="color:var(--pink);background:linear-gradient(90deg,#ff78bf,var(--pink));width:50%"></div></div><span class="label">bond</span></div>
      <div class="meter"><i>⚡</i><div class="track"><div id="bar-energy" class="fill" style="color:var(--neon);background:linear-gradient(90deg,#69d7ff,var(--neon));width:80%"></div></div><span class="label">zen</span></div>
    </div>
    <div id="hud-actions" class="actions">
      <button id="btn-feed" class="care" aria-label="Feed neon noodles">🍜</button>
      <button id="btn-play" class="care" aria-label="Play with glow toy">🧶</button>
      <button id="btn-sleep" class="care" aria-label="Toggle sleep pod">💤</button>
    </div>
  </div>
  <div id="toast" class="toast">cozy combo</div>
  <div id="start-screen" class="start">
    <section class="card">
      <p class="kicker">anti-anxiety one-thumb pet simulator</p>
      <h1 class="title">Neon Plush<br>Pet Simulator</h1>
      <p class="subtitle">lo-fi fairy garden city, tiny meme energy</p>
      <div class="mascot">⚡🐾</div>
      <p class="instructions">Tap Pika-Plush to comfort. Tap the garden street to toss a glow toy. Use the bottom buttons to feed, play, or let your main character nap.</p>
      <button id="start-btn">START COZY SESSION</button>
    </section>
  </div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});
const STATE={IDLE:0,WALK:1,EAT:2,SLEEP:3,PLAY:4};
const pet={x:0,y:0,targetX:0,state:STATE.IDLE,timer:0,facingRight:true,scaleY:1,scaleX:1,blinkTimer:0,blinkOpen:true,tailAngle:0,hunger:50,love:50,energy:80};
const particles=[],noodles={x:0,y:0,full:false,amount:0},toy={x:0,y:0,active:false};
let width=0,height=0,lastTime=0,dayTime=true,skyOffset=0,started=false,feedbackTimer=null,toastTimer=null;
const audio={ctx:null,unlocked:false,last:{},init(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();const bgm=document.getElementById('bgm');if(bgm)bgm.volume=.18;['sfx_start','sfx_ui','sfx_pet','sfx_feed','sfx_collect','sfx_play','sfx_sleep','sfx_wake','sfx_blocked'].forEach(id=>{const el=document.getElementById(id);if(el)el.volume=id==='sfx_ui'?.32:.44})},unlock(){if(this.ctx)this.ctx.resume().catch(()=>{});this.unlocked=true;const bgm=document.getElementById('bgm');if(bgm)bgm.play().catch(()=>{})},pauseLoop(){const bgm=document.getElementById('bgm');if(bgm&&!bgm.paused)bgm.pause()},playLoop(){if(!this.unlocked)return;const bgm=document.getElementById('bgm');if(bgm)bgm.play().catch(()=>{})},play(id,debounce=90){if(!this.unlocked)return;const now=performance.now();if(this.last[id]&&now-this.last[id]<debounce)return;this.last[id]=now;const el=document.getElementById(id);if(el){el.pause();el.currentTime=0;el.play().catch(()=>this.synth(id))}else this.synth(id)},synth(type){if(!this.ctx)return;const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.connect(gain);gain.connect(this.ctx.destination);osc.type=type.includes('blocked')?'square':type.includes('sleep')?'triangle':'sine';osc.frequency.setValueAtTime(type.includes('blocked')?190:520,this.ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(type.includes('sleep')?240:980,this.ctx.currentTime+.16);gain.gain.setValueAtTime(.12,this.ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+.22);osc.start();osc.stop(this.ctx.currentTime+.24)}};
function resize(){width=innerWidth;height=innerHeight;const dpr=devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!pet.y){pet.x=width/2;pet.targetX=pet.x}pet.y=height*.69;noodles.x=width*.2;noodles.y=height*.76}
function spawnParticle(x,y,type){particles.push({x,y,type,vx:(Math.random()-.5)*2,vy:-Math.random()*2-1,life:1,color:type==='heart'?'#ff6fd8':type==='zzz'?'#dffbff':'#ffe66d'})}
function update(dt){const speed=1;if(pet.state!==STATE.SLEEP){pet.hunger=Math.max(0,pet.hunger-.5*dt*speed);pet.energy=Math.max(0,pet.energy-.3*dt*speed);pet.love=Math.max(0,pet.love-.2*dt*speed)}else{pet.energy=Math.min(100,pet.energy+5*dt*speed);if(pet.energy>=100)wakeUp()}pet.timer-=dt;pet.blinkTimer-=dt;pet.tailAngle+=dt*2;if(pet.blinkTimer<0){pet.blinkOpen=!pet.blinkOpen;pet.blinkTimer=pet.blinkOpen?Math.random()*3+2:.15}const dx=pet.targetX-pet.x,dist=Math.abs(dx);if(dist>5){const step=Math.sign(dx)*100*speed*dt;pet.x+=Math.abs(step)>dist?dx:step;pet.facingRight=dx>0;pet.y=height*.69+Math.sin(Date.now()/100)*5}else pet.y=height*.69;switch(pet.state){case STATE.IDLE:if(pet.timer<0){if(Math.random()<.3)pet.targetX=Math.max(54,Math.min(width-54,pet.x+(Math.random()-.5)*200));pet.timer=Math.random()*3+2}break;case STATE.EAT:if(noodles.full){pet.targetX=noodles.x+44;if(Math.abs(pet.x-pet.targetX)<10){noodles.amount-=dt*20;pet.hunger=Math.min(100,pet.hunger+10*dt);if(Math.random()<.12)spawnParticle(noodles.x,noodles.y-10,'crumb');if(noodles.amount<=0){noodles.full=false;pet.state=STATE.IDLE;audio.play('sfx_collect',140);showReaction('gif-love',1200);toast('noodle aura restored')}}}else pet.state=STATE.IDLE;break;case STATE.PLAY:if(toy.active){pet.targetX=toy.x;if(Math.abs(pet.x-toy.x)<20){pet.love=Math.min(100,pet.love+15*dt);pet.energy=Math.max(0,pet.energy-5*dt);toy.active=false;pet.state=STATE.IDLE;spawnParticle(pet.x,pet.y-50,'heart');audio.play('sfx_collect',140);showReaction('gif-love',1200);toast('bond sparkle +1')}}break}pet.scaleX+=(1-pet.scaleX)*10*dt;pet.scaleY+=(1-pet.scaleY)*10*dt;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx;p.y+=p.vy;if(p.type==='zzz')p.x+=Math.sin(p.life*10)*.5;if(p.life<=0)particles.splice(i,1)}skyOffset+=dt*5;bar('bar-hunger',pet.hunger);bar('bar-love',pet.love);bar('bar-energy',pet.energy)}
function bar(id,v){document.getElementById(id).style.width=Math.max(0,Math.min(100,v))+'%'}
function draw(){drawBackground();drawProps();drawPet(pet.x,pet.y);drawParticles();if(!dayTime){ctx.fillStyle='rgba(7,6,26,.38)';ctx.fillRect(0,0,width,height);drawSleepDome()}}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,dayTime?'#201344':'#0f0b25');g.addColorStop(.55,dayTime?'#392166':'#17254b');g.addColorStop(1,dayTime?'#143b31':'#071b19');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);for(let i=0;i<36;i++){const x=(i*97+skyOffset*8)%(width+120)-60,y=40+(i*41)%Math.max(180,height*.48),r=1+(i%3);ctx.fillStyle=i%5?'rgba(125,249,255,.45)':'rgba(255,111,216,.55)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='rgba(125,249,255,.22)';ctx.lineWidth=2;for(let x=-80+(skyOffset%80);x<width+80;x+=80){ctx.beginPath();ctx.moveTo(x,height*.18);ctx.lineTo(x+44,height*.58);ctx.stroke()}for(let i=0;i<7;i++){const x=(i/(6))*width,base=height*.63,h=80+(i%3)*40;ctx.fillStyle=i%2?'rgba(255,111,216,.18)':'rgba(125,249,255,.16)';ctx.fillRect(x-32,base-h,54,h);ctx.fillStyle='rgba(255,230,109,.35)';for(let w=0;w<3;w++)ctx.fillRect(x-22+w*16,base-h+14,7,7)}ctx.fillStyle='rgba(14,47,39,.92)';ctx.fillRect(0,height*.7,width,height*.3);ctx.strokeStyle='rgba(124,255,170,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,height*.7);ctx.bezierCurveTo(width*.25,height*.66,width*.62,height*.75,width,height*.69);ctx.stroke();for(let i=0;i<18;i++){const x=(i*67+Math.sin(skyOffset*.2+i)*14)%width,y=height*.72+(i%5)*18;drawMushroom(x,y,6+(i%3)*3)}}
function drawMushroom(x,y,s){ctx.fillStyle='rgba(255,111,216,.55)';ctx.beginPath();ctx.ellipse(x,y,s*1.4,s,0,Math.PI,0);ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(x-s*.25,y,s*.5,s*1.25)}
function drawProps(){ctx.save();ctx.shadowColor='rgba(255,230,109,.7)';ctx.shadowBlur=14;ctx.fillStyle='#ff6f8d';ctx.beginPath();ctx.ellipse(noodles.x,noodles.y,32,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.82)';ctx.font='13px Exo 2';ctx.textAlign='center';ctx.fillText('RAMEN',noodles.x,noodles.y+4);if(noodles.full){ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.ellipse(noodles.x,noodles.y-7,22,9,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff7a8';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(noodles.x+i*7,noodles.y-9,5,0,Math.PI);ctx.stroke()}}ctx.restore();if(toy.active){ctx.save();ctx.shadowColor='#7df9ff';ctx.shadowBlur=18;ctx.fillStyle='#7df9ff';ctx.beginPath();ctx.arc(toy.x,toy.y-12,11,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff6fd8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(toy.x,toy.y-12,17,0,Math.PI*1.4);ctx.stroke();ctx.restore()}}
function drawPet(x,y){ctx.save();ctx.translate(x,y);if(!pet.facingRight)ctx.scale(-1,1);ctx.scale(pet.scaleX,pet.scaleY);ctx.shadowColor='rgba(255,230,109,.75)';ctx.shadowBlur=22;ctx.strokeStyle='#ffe66d';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-32,-12);ctx.quadraticCurveTo(-58+Math.sin(pet.tailAngle)*12,-42,-30+Math.sin(pet.tailAngle)*5,-64);ctx.stroke();const body=ctx.createLinearGradient(-40,-75,40,12);body.addColorStop(0,'#ffe66d');body.addColorStop(1,'#ffbf5e');ctx.fillStyle=body;roundRect(ctx,-43,-42,86,53,28);ctx.fill();ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(0,-48,37,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.moveTo(-24,-70);ctx.lineTo(-35,-105);ctx.lineTo(-6,-78);ctx.moveTo(24,-70);ctx.lineTo(35,-105);ctx.lineTo(6,-78);ctx.fill();ctx.fillStyle='#211633';if(pet.state===STATE.SLEEP||!pet.blinkOpen){ctx.strokeStyle='#211633';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-17,-52);ctx.lineTo(-5,-52);ctx.moveTo(17,-52);ctx.lineTo(5,-52);ctx.stroke()}else{ctx.beginPath();ctx.arc(-12,-53,4,0,Math.PI*2);ctx.arc(12,-53,4,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ff6fd8';ctx.beginPath();ctx.arc(0,-43,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#211633';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(-4,-34);ctx.moveTo(0,-40);ctx.lineTo(4,-34);ctx.stroke();ctx.fillStyle='rgba(255,111,216,.55)';ctx.beginPath();ctx.arc(-22,-42,6,0,Math.PI*2);ctx.arc(22,-42,6,0,Math.PI*2);ctx.fill();ctx.restore()}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawParticles(){particles.forEach(p=>{ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.font="20px 'Exo 2'";ctx.textAlign='center';if(p.type==='heart')ctx.fillText('💗',p.x,p.y);else if(p.type==='zzz')ctx.fillText('Zzz',p.x,p.y);else{ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.restore()})}
function drawSleepDome(){ctx.save();ctx.strokeStyle='rgba(125,249,255,.7)';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.ellipse(pet.x,pet.y-34,76,64,0,Math.PI,0);ctx.stroke();ctx.restore()}
function showReaction(id,duration=1400){const target=document.getElementById(id);document.querySelectorAll('.reaction').forEach(g=>{g.classList.add('hidden');g.classList.remove('show')});if(!target)return;target.classList.remove('hidden');requestAnimationFrame(()=>target.classList.add('show'));clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>{target.classList.remove('show');target.classList.add('hidden')},duration)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1200)}
function blocked(){audio.play('sfx_blocked',160);showReaction('gif-snooze',1100);toast('sleep pod says: later bestie')}
function petAction(){if(pet.state===STATE.SLEEP){blocked();return}pet.scaleY=.8;pet.scaleX=1.2;pet.love=Math.min(100,pet.love+5);spawnParticle(pet.x,pet.y-60,'heart');audio.play('sfx_pet',120);showReaction('gif-love',1300);toast('comfort tap received')}
function wakeUp(){pet.state=STATE.IDLE;dayTime=true;document.getElementById('btn-sleep').classList.remove('sleeping');audio.play('sfx_wake',180);audio.playLoop();toast('zen battery full')}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(!started)return;const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;const dx=x-pet.x,dy=y-(pet.y-30);if(Math.abs(dx)<60&&Math.abs(dy)<60)petAction();else if(dayTime){if(pet.state!==STATE.SLEEP){toy.x=x;toy.y=height*.7;toy.active=true;pet.state=STATE.PLAY;audio.play('sfx_play',130);toast('glow toy tossed')}}else blocked()},{passive:false});
document.getElementById('btn-feed').onclick=()=>{if(pet.state===STATE.SLEEP){blocked();return}noodles.full=true;noodles.amount=100;pet.state=STATE.EAT;audio.play('sfx_ui',120);audio.play('sfx_feed',120);toast('neon noodles served')};
document.getElementById('btn-play').onclick=()=>{if(pet.state===STATE.SLEEP){blocked();return}toy.x=Math.random()*(width-100)+50;toy.y=height*.7;toy.active=true;pet.state=STATE.PLAY;audio.play('sfx_ui',120);audio.play('sfx_play',130);showReaction('gif-love',900);toast('random yarn quest')};
document.getElementById('btn-sleep').onclick=()=>{audio.play('sfx_ui',120);if(pet.state===STATE.SLEEP)wakeUp();else{pet.state=STATE.SLEEP;dayTime=false;spawnParticle(pet.x,pet.y-50,'zzz');document.getElementById('btn-sleep').classList.add('sleeping');audio.play('sfx_sleep',180);audio.pauseLoop();showReaction('gif-snooze',1500);toast('lo-fi nap mode')}};
document.getElementById('start-btn').onclick=()=>{audio.init();audio.unlock();audio.play('sfx_start',180);started=true;document.getElementById('start-screen').classList.add('hidden');document.getElementById('hud-stats').classList.add('show');document.getElementById('hud-actions').classList.add('show');showReaction('gif-love',1200);lastTime=performance.now();gameLoop()};
function gameLoop(){const now=performance.now(),dt=Math.min((now-lastTime)/1000,.1);lastTime=now;update(dt);draw();requestAnimationFrame(gameLoop)}
addEventListener('resize',resize);addEventListener('DOMContentLoaded',()=>{resize();draw()});
window.__qaState={pet,noodles,toy,STATE};
</script>
</body>
</html>
