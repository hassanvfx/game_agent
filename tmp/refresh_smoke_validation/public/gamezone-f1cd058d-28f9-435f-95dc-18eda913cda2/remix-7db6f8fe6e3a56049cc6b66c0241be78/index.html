<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cozy Cat Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] remapped-font: title=Bangers | ui=Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #f8f4ff;
            --panel-white: rgba(255, 255, 255, 0.72);
            --panel-border: rgba(255,255,255,0.88);
            --text-main: #31274e;
            --text-muted: #6f6793;
            --orange: #ff9a5c;
            --orange-dark: #ff7a45;
            --pink: #ff71b8;
            --blue: #67b9ff;
            --blue-dark: #8fd5ff;
            --orange-soft: #fff0dc;
            --pink-soft: #ffe4f3;
            --blue-soft: #dff3ff;
            --lavender: #a98cff;
            --lavender-soft: rgba(169, 140, 255, 0.14);
            --sky-glow: rgba(103, 185, 255, 0.25);
            --cat-glow: rgba(255, 122, 69, 0.22);
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-cream);
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text-main);
        }
        body {
            position: relative;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.75), transparent 38%),
                linear-gradient(180deg, #f6efff 0%, #f7f8ff 45%, #fff4e8 100%);
        }
        canvas { display: block; touch-action: none; }
        button { font: inherit; border: 0; cursor: pointer; }
        .no-select { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-3 { padding: 0.75rem; }
        .p-6 { padding: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .flex { display: flex; }
        .hidden { display: none; }
        .flex-1 { flex: 1 1 0%; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: clamp(2.8rem, 8vw, 4.2rem); }
        .text-white { color: #fff; }
        .text-gray-500 { color: var(--text-muted); }
        .text-gray-700 { color: var(--text-main); }
        .text-orange-400 { color: var(--orange); }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .tracking-wide { letter-spacing: 0.06em; }
        .rounded-full { border-radius: 9999px; }
        .rounded-2xl { border-radius: 1rem; }
        .overflow-hidden { overflow: hidden; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .transition { transition: all 0.2s ease; }
        .transition-all { transition: all 0.5s ease; }
        .transition-opacity { transition: opacity 0.5s ease; }
        .duration-500 { transition-duration: 0.5s; }
        .opacity-0 { opacity: 0; }
        .shadow-lg { box-shadow: 0 10px 24px rgba(0,0,0,0.12); }
        .drop-shadow-sm { text-shadow: 0 2px 4px rgba(0,0,0,0.12); }
        .bg-white\/80 { background: rgba(255,255,255,0.8); }
        .bg-orange-100 { background: var(--orange-soft); }
        .bg-orange-400 { background: var(--orange); }
        .bg-orange-500 { background: var(--orange-dark); }
        .bg-pink-100 { background: var(--pink-soft); }
        .bg-blue-100 { background: var(--blue-soft); }
        .bg-blue-300 { background: var(--blue-dark); }
        .bg-gray-200 { background: rgba(107, 114, 128, 0.22); }
        .bg-pink-400 { background: var(--pink); }
        .bg-blue-400 { background: var(--blue); }
        .border { border: 1px solid rgba(255,255,255,0.85); }
        .max-w-md { max-width: 28rem; }
        .h-4 { height: 1rem; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .glass {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.62));
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 10px 30px rgba(105, 79, 170, 0.12),
                inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .btn-action {
            transition: transform 0.1s, background-color 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(105, 79, 170, 0.18);
            filter: saturate(1.05);
        }
        .btn-action:active { transform: scale(0.95); }
        .animate-bounce { animation: bounce 1.5s infinite; }
        .start-card {
            width: min(92vw, 28rem);
            padding: 2rem 1.5rem;
            border-radius: 1.5rem;
            text-align: center;
        }
        .start-kicker {
            margin: 0 0 0.75rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .start-instructions {
            margin: 0 0 1.5rem;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.35;
        }
        .title-display {
            font-family: 'Bangers', system-ui, sans-serif;
            line-height: 0.95;
            letter-spacing: 0.05em;
            text-shadow: 0 6px 18px rgba(255, 113, 184, 0.2);
        }
        .feedback-gif {
            position: absolute;
            right: min(4vw, 1rem);
            bottom: 6.5rem;
            width: min(30vw, 7rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.88);
            box-shadow: 0 12px 22px rgba(49, 39, 78, 0.18);
            background: rgba(255,255,255,0.55);
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .feedback-gif.is-visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }
        #hud-stats,
        #hud-actions,
        .start-kicker,
        .start-instructions,
        .start-card h2,
        button {
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 18%, rgba(255,255,255,0.85), transparent 18%),
                radial-gradient(circle at 85% 14%, var(--sky-glow), transparent 20%),
                radial-gradient(circle at 50% 100%, rgba(255, 122, 69, 0.18), transparent 32%);
        }
        #hud-stats .glass {
            border-radius: 1.15rem;
        }
        #hud-stats .glass span,
        #hud-actions button {
            filter: drop-shadow(0 4px 10px rgba(255,255,255,0.45));
        }
        #start-screen {
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.82), rgba(248,244,255,0.92)),
                linear-gradient(180deg, rgba(239,235,255,0.78), rgba(255,245,232,0.82));
        }
        .start-card {
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 42px rgba(105, 79, 170, 0.18);
        }
        .start-card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at top right, rgba(255,255,255,0.6), transparent 30%),
                linear-gradient(135deg, rgba(169,140,255,0.08), rgba(255,113,184,0.08));
        }
        .start-kicker,
        .start-instructions,
        .start-card h1,
        .start-card h2,
        .start-card button,
        .start-card .animate-bounce {
            position: relative;
            z-index: 1;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        @media (max-width: 640px) {
            .p-6 { padding: 1rem; }
            .gap-4 { gap: 0.75rem; }
            .text-3xl { font-size: 1.6rem; }
            .text-4xl { font-size: 2rem; }
            .w-16, .h-16 { width: 3.5rem; height: 3.5rem; }
            .start-card { padding: 1.5rem 1rem; }
        }
    </style>
</head>

    <script>
        // --- §1 Configuration & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let gameConfig = {
            catName: "Mochi",
            catColor: "#FFB74D",
            gameSpeed: 1
        };

        // Parse Config
        try {
            const el = document.getElementById('game-config');
            if (el) {
                const defs = JSON.parse(el.textContent);
                window.gameConfigDefs = defs;
                for (const key in defs) {
                    gameConfig[key] = defs[key].value;
                }
                document.title = "Cozy Cat Care";
            }
        } catch(e) { console.error("Config parse error", e); }

        window.updateGameConfig = (key, val) => {
            if (gameConfig.hasOwnProperty(key)) {
                    gameConfig[key] = val;
                    if (key === 'catName') document.title = val + "'s Cozy Care";
            }
        };

        // --- §2 Audio System ---
        const AudioSys = {
            ctx: null,
            bgm: null,
            unlocked: false,
            lastPlayedAt: {},
            
            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                this.ctx = new AudioContext();
                this.bgm = document.getElementById('bgm_lazy');
                if (this.bgm) this.bgm.volume = 0.2;
                ['sfx_start', 'sfx_ui', 'sfx_pet', 'sfx_feed', 'sfx_collect', 'sfx_play', 'sfx_sleep', 'sfx_wake', 'sfx_blocked'].forEach((id) => {
                    const el = document.getElementById(id);
                    if (el) el.volume = id === 'sfx_ui' ? 0.35 : 0.45;
                });
            },

            unlock() {
                if (!this.ctx) return;
                this.ctx.resume().then(() => {
                    this.unlocked = true;
                    this.playLoop();
                }).catch(() => {});
            },

            playLoop() {
                if (!this.unlocked || !this.bgm) return;
                this.bgm.play().catch(() => {});
            },

            pauseLoop() {
                if (this.bgm && !this.bgm.paused) this.bgm.pause();
            },

            playSFX(id, debounceMs = 90) {
                if (!this.unlocked) return;
                const now = performance.now();
                if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < debounceMs) return;
                this.lastPlayedAt[id] = now;
                const el = document.getElementById(id);
                if (el) {
                    el.pause();
                    el.currentTime = 0;
                    el.play().catch(() => this.synthesizeFallback(id));
                } else {
                    this.synthesizeFallback(id);
                }
            },

            synthesizeFallback(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type.includes('pet') || type.includes('collect') || type.includes('start')) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(620, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1120, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.22);
                } else if (type.includes('sleep') || type.includes('wake')) {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.24);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.24);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                }
            }
        };

        // --- §3 Game Logic ---
        
        const STATE = {
            IDLE: 0,
            WALK: 1,
            EAT: 2,
            SLEEP: 3,
            PLAY: 4
        };

        const cat = {
            x: 0, y: 0,
            targetX: 0,
            state: STATE.IDLE,
            timer: 0,
            facingRight: true,
            
            // Visuals
            scaleY: 1,
            scaleX: 1,
            blinkTimer: 0,
            blinkOpen: true,
            tailAngle: 0,
            
            // Stats (0-100)
            hunger: 50,
            love: 50,
            energy: 80
        };

        const particles = [];
        const foodBowl = { x: 0, y: 0, full: false, amount: 0 };
        const toy = { x: 0, y: 0, active: false };
        
        let lastTime = 0;
        let width, height;
        let dayTime = true;
        let skyOffset = 0;
        let feedbackGifTimer = null;

        // --- §4 Rendering & Update ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            // [agent-note][stage4] repaired: resize-drift | element: #gameCanvas | action: reset transform before DPR scaling
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            // Reposition elements if needed
            if (cat.y === 0) {
                cat.x = width / 2;
                cat.y = height * 0.7;
                cat.targetX = cat.x;
                foodBowl.x = width * 0.2;
                foodBowl.y = height * 0.75;
            } else {
                // Keep relative floor position
                cat.y = height * 0.7;
                foodBowl.y = height * 0.75;
                foodBowl.x = width * 0.2;
            }
        }

        function spawnParticle(x, y, type) {
            particles.push({
                x, y, type,
                vx: (Math.random() - 0.5) * 2,
                vy: -Math.random() * 2 - 1,
                life: 1.0,
                color: type === 'heart' ? '#FF6B6B' : (type === 'zzz' ? '#FFFFFF' : '#D4A017')
            });
        }

        function update(dt) {
            const speedMult = gameConfig.gameSpeed;
            
            // Stats Decay
            if (cat.state !== STATE.SLEEP) {
                cat.hunger = Math.max(0, cat.hunger - 0.5 * dt * speedMult);
                cat.energy = Math.max(0, cat.energy - 0.3 * dt * speedMult);
                cat.love = Math.max(0, cat.love - 0.2 * dt * speedMult);
            } else {
                cat.energy = Math.min(100, cat.energy + 5 * dt * speedMult);
                if (cat.energy >= 100) {
                    wakeUp();
                }
            }

            // State Machine
            cat.timer -= dt;
            cat.blinkTimer -= dt;
            cat.tailAngle += dt * 2;

            if (cat.blinkTimer < 0) {
                cat.blinkOpen = !cat.blinkOpen;
                cat.blinkTimer = cat.blinkOpen ? Math.random() * 3 + 2 : 0.15;
            }

            // Movement Physics
            const dx = cat.targetX - cat.x;
            const dist = Math.abs(dx);
            
            if (dist > 5) {
                const moveSpeed = 100 * speedMult; // px per sec
                const step = Math.sign(dx) * moveSpeed * dt;
                cat.x += step;
                cat.facingRight = dx > 0;
                
                // Bobbing animation
                cat.y = height * 0.7 + Math.sin(Date.now() / 100) * 5;
            } else {
                cat.y = height * 0.7;
            }

            // Logic
            switch (cat.state) {
                case STATE.IDLE:
                    if (cat.timer < 0) {
                        // Random wander
                        if (Math.random() < 0.3) {
                            cat.targetX = Math.max(50, Math.min(width - 50, cat.x + (Math.random() - 0.5) * 200));
                        }
                        cat.timer = Math.random() * 3 + 2;
                    }
                    break;
                case STATE.EAT:
                    if (foodBowl.full) {
                        // Move to bowl
                        cat.targetX = foodBowl.x + 40;
                        if (Math.abs(cat.x - cat.targetX) < 10) {
                            // Eating
                            foodBowl.amount -= dt * 20;
                            cat.hunger = Math.min(100, cat.hunger + 10 * dt);
                            if (Math.random() < 0.1) spawnParticle(foodBowl.x, foodBowl.y - 10, 'crumb');
                            if (foodBowl.amount <= 0) {
                                foodBowl.full = false;
                                cat.state = STATE.IDLE;
                                AudioSys.playSFX('sfx_collect', 140);
                                showFeedbackGif('gif-love', 1200);
                            }
                        }
                    } else {
                        cat.state = STATE.IDLE;
                    }
                    break;
                case STATE.PLAY:
                    if (toy.active) {
                        cat.targetX = toy.x;
                        if (Math.abs(cat.x - toy.x) < 20) {
                            cat.love = Math.min(100, cat.love + 15 * dt);
                            cat.energy = Math.max(0, cat.energy - 5 * dt);
                            toy.active = false; // Caught it
                            cat.state = STATE.IDLE;
                            spawnParticle(cat.x, cat.y - 50, 'heart');
                            AudioSys.playSFX('sfx_collect', 140);
                            showFeedbackGif('gif-love', 1200);
                        }
                    }
                    break;
            }

            // Spring physics for scale (squish effect)
            cat.scaleX += (1 - cat.scaleX) * 10 * dt;
            cat.scaleY += (1 - cat.scaleY) * 10 * dt;

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= dt;
                p.x += p.vx;
                p.y += p.vy;
                if (p.type === 'zzz') {
                    p.x += Math.sin(p.life * 10) * 0.5;
                }
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Background
            skyOffset += dt * 5;

            // Update UI Bars
            document.getElementById('bar-hunger').style.width = cat.hunger + '%';
            document.getElementById('bar-love').style.width = cat.love + '%';
            document.getElementById('bar-energy').style.width = cat.energy + '%';
        }

        function draw(ctx) {
            // 1. Background (Room)
            // Wall
            ctx.fillStyle = dayTime ? '#FFF8E1' : '#2C3E50';
            ctx.fillRect(0, 0, width, height);

            // Window
            const wx = width * 0.5 - 100;
            const wy = height * 0.2;
            ctx.save();
            ctx.beginPath();
            ctx.rect(wx, wy, 200, 150);
            ctx.clip();
            // Sky
            ctx.fillStyle = dayTime ? '#81D4FA' : '#1A237E';
            ctx.fillRect(wx, wy, 200, 150);
            // Clouds
            ctx.fillStyle = '#FFFFFF';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(wx + 50 + (skyOffset % 250) - 50, wy + 50, 30, 0, Math.PI*2);
            ctx.arc(wx + 90 + (skyOffset % 250) - 50, wy + 40, 40, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            // Window Frame
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#8D6E63';
            ctx.strokeRect(wx, wy, 200, 150);
            ctx.beginPath();
            ctx.moveTo(wx + 100, wy);
            ctx.lineTo(wx + 100, wy + 150);
            ctx.moveTo(wx, wy + 75);
            ctx.lineTo(wx + 200, wy + 75);
            ctx.stroke();

            // Floor
            ctx.fillStyle = '#D7CCC8';
            ctx.fillRect(0, height * 0.7, width, height * 0.3);

            // 2. Props
            // Food Bowl
            ctx.fillStyle = '#EF5350';
            ctx.beginPath();
            ctx.ellipse(foodBowl.x, foodBowl.y, 30, 15, 0, 0, Math.PI*2);
            ctx.fill();
            if (foodBowl.full) {
                ctx.fillStyle = '#795548'; // Kibble
                ctx.beginPath();
                ctx.ellipse(foodBowl.x, foodBowl.y - 5, 20, 10, 0, 0, Math.PI*2);
                ctx.fill();
            }

            // Toy (if active)
            if (toy.active) {
                ctx.fillStyle = '#FF4081';
                ctx.beginPath();
                ctx.arc(toy.x, toy.y - 10, 10, 0, Math.PI*2);
                ctx.fill();
            }

            // 3. Cat
            drawCat(ctx, cat.x, cat.y);

            // 4. Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.font = "20px 'Exo 2'";
                if (p.type === 'heart') ctx.fillText("❤️", p.x, p.y);
                else if (p.type === 'zzz') ctx.fillText("Zzz", p.x, p.y);
                else { // crumb
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1;

            // 5. Night Overlay
            if (!dayTime) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, width, height);
            }
        }

        function drawCat(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            if (!cat.facingRight) ctx.scale(-1, 1);
            ctx.scale(cat.scaleX, cat.scaleY);

            const color = gameConfig.catColor || '#FFB74D';

            // Tail
            ctx.strokeStyle = color;
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-30, -10);
            ctx.quadraticCurveTo(-50 + Math.sin(cat.tailAngle)*10, -40, -30 + Math.sin(cat.tailAngle)*5, -60);
            ctx.stroke();

            // Body (Rounded Rect)
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-40, -40, 80, 50, 25);
            ctx.fill();

            // Head
            ctx.translate(0, -45);
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI*2);
            ctx.fill();

            // Ears
            ctx.beginPath();
            ctx.moveTo(-25, -20);
            ctx.lineTo(-35, -50);
            ctx.lineTo(-10, -30);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(25, -20);
            ctx.lineTo(35, -50);
            ctx.lineTo(10, -30);
            ctx.fill();

            // Face
            ctx.fillStyle = '#3E2723';
            // Eyes
            if (cat.state === STATE.SLEEP || !cat.blinkOpen) {
                ctx.beginPath();
                ctx.moveTo(-15, -5); ctx.lineTo(-5, -5);
                ctx.moveTo(15, -5); ctx.lineTo(5, -5);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(-10, -5, 4, 0, Math.PI*2);
                ctx.arc(10, -5, 4, 0, Math.PI*2);
                ctx.fill();
            }

            // Mouth
            ctx.beginPath();
            ctx.arc(0, 5, 2, 0, Math.PI*2); // nose
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 5);
            ctx.lineTo(-3, 12);
            ctx.moveTo(0, 5);
            ctx.lineTo(3, 12);
            ctx.stroke();

            // Whiskers
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.moveTo(15, 5); ctx.lineTo(35, 2);
            ctx.moveTo(15, 8); ctx.lineTo(35, 10);
            ctx.moveTo(-15, 5); ctx.lineTo(-35, 2);
            ctx.moveTo(-15, 8); ctx.lineTo(-35, 10);
            ctx.stroke();

            ctx.restore();
        }

        // --- §5 Interaction ---

        function showFeedbackGif(id, duration = 1500) {
            const target = document.getElementById(id);
            if (!target) return;
            document.querySelectorAll('.feedback-gif').forEach((gif) => {
                if (gif !== target) {
                    gif.classList.add('hidden');
                    gif.classList.remove('is-visible');
                }
            });
            target.classList.remove('hidden');
            requestAnimationFrame(() => target.classList.add('is-visible'));
            clearTimeout(feedbackGifTimer);
            feedbackGifTimer = setTimeout(() => {
                target.classList.remove('is-visible');
                target.classList.add('hidden');
            }, duration);
        }

        function blockedActionFeedback() {
            AudioSys.playSFX('sfx_blocked', 160);
            showFeedbackGif('gif-snooze', 1100);
        }

        function petCat() {
            if (cat.state === STATE.SLEEP) {
                blockedActionFeedback();
                return;
            }
            
            cat.scaleY = 0.8;
            cat.scaleX = 1.2;
            cat.love = Math.min(100, cat.love + 5);
            spawnParticle(cat.x, cat.y - 60, 'heart');
            AudioSys.playSFX('sfx_pet', 120);
            showFeedbackGif('gif-love', 1400);
        }

        function wakeUp() {
            cat.state = STATE.IDLE;
            dayTime = true;
            document.getElementById('btn-sleep').classList.remove('bg-blue-300');
            document.getElementById('btn-sleep').classList.add('bg-blue-100');
            AudioSys.playSFX('sfx_wake', 180);
            AudioSys.playLoop();
        }

        // Pointer Events
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * window.devicePixelRatio;
            const y = (e.clientY - rect.top) * window.devicePixelRatio;

            // Check if tapped cat
            const dx = x - cat.x * window.devicePixelRatio;
            const dy = y - (cat.y - 30) * window.devicePixelRatio; // Adjust for center
            
            // Simple hit test
            if (Math.abs(dx) < 60 * window.devicePixelRatio && Math.abs(dy) < 60 * window.devicePixelRatio) {
                petCat();
            } else if (dayTime) {
                // Place toy
                if (cat.state !== STATE.SLEEP) {
                    toy.x = x / window.devicePixelRatio;
                    toy.y = height * 0.7; // Floor level
                    toy.active = true;
                    cat.state = STATE.PLAY;
                    AudioSys.playSFX('sfx_play', 130);
                }
            } else {
                blockedActionFeedback();
            }
        }, { passive: false });

        // Buttons
        document.getElementById('btn-feed').onclick = () => {
            if (cat.state === STATE.SLEEP) {
                blockedActionFeedback();
                return;
            }
            foodBowl.full = true;
            foodBowl.amount = 100;
            cat.state = STATE.EAT;
            AudioSys.playSFX('sfx_ui', 120);
            AudioSys.playSFX('sfx_feed', 120);
        };

        document.getElementById('btn-play').onclick = () => {
             if (cat.state === STATE.SLEEP) {
                 blockedActionFeedback();
                 return;
             }
             // Just a visual cue, actual play is tap to place toy
             toy.x = Math.random() * (width - 100) + 50;
             toy.y = height * 0.7;
             toy.active = true;
             cat.state = STATE.PLAY;
             AudioSys.playSFX('sfx_ui', 120);
             AudioSys.playSFX('sfx_play', 130);
             showFeedbackGif('gif-love', 1000);
        };

        document.getElementById('btn-sleep').onclick = () => {
            AudioSys.playSFX('sfx_ui', 120);
            if (cat.state === STATE.SLEEP) {
                wakeUp();
            } else {
                cat.state = STATE.SLEEP;
                dayTime = false;
                spawnParticle(cat.x, cat.y - 50, 'zzz');
                document.getElementById('btn-sleep').classList.remove('bg-blue-100');
                document.getElementById('btn-sleep').classList.add('bg-blue-300');
                AudioSys.playSFX('sfx_sleep', 180);
                AudioSys.pauseLoop();
                showFeedbackGif('gif-snooze', 1500);
            }
        };

        document.getElementById('start-btn').onclick = () => {
            AudioSys.init();
            AudioSys.unlock();
            AudioSys.playSFX('sfx_start', 180);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud-stats').classList.remove('opacity-0');
            document.getElementById('hud-actions').classList.remove('opacity-0');
            showFeedbackGif('gif-love', 1300);
            gameLoop();
        };

        // --- Loop ---
        function gameLoop() {
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            update(dt);
            draw(ctx);
            requestAnimationFrame(gameLoop);
        }

        // Init
        window.addEventListener('resize', resize);
        window.addEventListener('DOMContentLoaded', () => {
            resize();
            // Pre-draw or setup if needed
        });

    </script>
</body>
