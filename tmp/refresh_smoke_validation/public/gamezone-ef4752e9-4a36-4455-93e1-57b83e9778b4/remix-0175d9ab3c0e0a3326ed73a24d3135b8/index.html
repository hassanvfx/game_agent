<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Bullet Train Velocity</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

        :root {
            --cyan: #5fe7ff;
            --cyan-bright: #c7fdff;
            --cyan-soft: rgba(226, 251, 255, 0.88);
            --cyan-dim: rgba(95, 231, 255, 0.76);
            --bg-dark: #000;
            --panel-bg: rgba(5, 16, 40, 0.72);
            --panel-border: rgba(99, 226, 255, 0.42);
            --danger: #ff5876;
            --warning: #ff3657;
            --success: #53f5a8;
            --amber: #ffcc66;
            --track-shadow: rgba(115, 238, 255, 0.26);
            --title-font: 'Orbitron', sans-serif;
            --ui-font: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(129, 246, 255, 0.18), transparent 34%),
                radial-gradient(circle at 50% 120%, rgba(142, 83, 255, 0.18), transparent 40%),
                linear-gradient(180deg, #020816 0%, #03040b 58%, #050816 100%);
            color: white;
            font-family: var(--ui-font);
        }

        body {
            position: relative;
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
            background:
                radial-gradient(circle at 50% 20%, rgba(0, 255, 255, 0.08), transparent 30%),
                linear-gradient(180deg, #000000 0%, #020b13 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 10;
        }

        .speed-grid {
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: 0.72;
            background:
                linear-gradient(rgba(112, 239, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(112, 239, 255, 0.08) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(0, 220, 255, 0.14), transparent 42%);
            background-size: 100% 56px, 56px 100%, 100% 100%;
            filter: contrast(1.18) brightness(0.92);
        }

        .speed-grid::before,
        .speed-grid::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .speed-grid::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(184, 128, 255, 0.2) 50%, transparent 100%);
            opacity: 0.45;
            animation: railSweep 7s linear infinite;
        }

        .speed-grid::after {
            background:
                radial-gradient(circle at 22% 28%, rgba(255, 255, 255, 0.22), transparent 2.5%),
                radial-gradient(circle at 72% 18%, rgba(95, 231, 255, 0.24), transparent 2.2%),
                radial-gradient(circle at 84% 62%, rgba(159, 117, 255, 0.18), transparent 2.8%);
            opacity: 0.75;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(13, 30, 66, 0.9), rgba(4, 11, 30, 0.88));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 18px 40px rgba(0, 0, 0, 0.45),
                0 0 26px rgba(95, 231, 255, 0.18);
        }

        .hud-text {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 24px;
        }

        #start-screen,
        #game-over-screen {
            pointer-events: auto;
            text-align: center;
            width: min(92vw, 560px);
            padding: 40px 32px;
            transition: transform 0.3s ease;
        }

        #start-screen:hover {
            transform: scale(1.03);
        }

        .screen-title {
            margin: 0 0 10px;
            font-family: var(--title-font);
            font-size: clamp(2.3rem, 8vw, 4.4rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--cyan-bright);
            text-shadow:
                0 0 12px rgba(95, 231, 255, 0.72),
                0 0 34px rgba(114, 87, 255, 0.42);
        }

        .screen-subtitle {
            margin: 0 0 28px;
            color: var(--cyan-soft);
            font-size: clamp(1rem, 2.8vw, 1.2rem);
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .instruction-list {
            margin: 0 0 28px;
            color: var(--cyan-dim);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.45;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .instruction-list p {
            margin: 0.25rem 0;
        }

        .green-zone {
            color: var(--success);
            font-weight: 700;
        }

        .danger-line {
            color: #f87171;
            font-weight: 700;
        }

        .primary-btn,
        .secondary-btn {
            display: inline-block;
            padding: 14px 30px;
            border-radius: 999px;
            font-family: var(--title-font);
            font-size: 1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(135deg, #8af8ff 0%, #5fe7ff 52%, #7c70ff 100%);
            color: #06111b;
            box-shadow:
                0 0 24px rgba(95, 231, 255, 0.45),
                0 10px 24px rgba(11, 20, 48, 0.45);
        }

        .secondary-btn {
            background: linear-gradient(135deg, #f5fbff 0%, #d2e7ff 100%);
            color: #08111e;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-1px);
        }

        .primary-btn:hover { background: #67e8f9; }
        .secondary-btn:hover { background: #e5e7eb; }

        #game-over-screen.hidden,
        #start-screen.hidden,
        #hud.hidden {
            display: none;
        }

        .game-over-title {
            margin: 0 0 10px;
            font-family: var(--title-font);
            font-size: clamp(2rem, 7vw, 3.1rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ff99af;
        }

        .final-distance {
            margin: 0 0 24px;
            font-size: 1.4rem;
            color: white;
        }

        .final-distance span {
            color: var(--cyan);
        }

        .fail-reason {
            margin: 0 0 28px;
            color: #fca5a5;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
        }

        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hud-panel {
            position: absolute;
            top: 24px;
            color: var(--cyan);
            padding: 10px 12px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(10, 24, 56, 0.78), rgba(4, 11, 28, 0.72));
            border: 1px solid rgba(95, 231, 255, 0.25);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 16px rgba(95, 231, 255, 0.12);
        }

        .hud-panel.left { left: 24px; }
        .hud-panel.right { right: 24px; text-align: right; }

        .hud-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .health-track {
            width: 192px;
            height: 16px;
            margin-top: 6px;
            background: rgba(5, 18, 35, 0.86);
            border: 1px solid #164e63;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.45);
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #67f6c6, #4fd6ff);
            box-shadow: 0 0 14px rgba(95, 231, 255, 0.5);
            transition: width 0.2s ease, background-color 0.2s ease;
        }

        .score-readout {
            font-family: var(--title-font);
            font-size: clamp(1.65rem, 5vw, 2.7rem);
            font-weight: 400;
            letter-spacing: 0.06em;
        }

        .score-unit {
            color: var(--amber);
            letter-spacing: 0.12em;
        }

        @keyframes railSweep {
            0% { transform: translateX(-42%); opacity: 0.18; }
            50% { opacity: 0.48; }
            100% { transform: translateX(42%); opacity: 0.18; }
        }

        .score-unit {
            font-size: 0.9rem;
        }

        .feedback-gif {
            position: absolute;
            right: 24px;
            bottom: 112px;
            width: min(28vw, 156px);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transform-origin: bottom right;
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            z-index: 25;
            filter: drop-shadow(0 0 18px rgba(95, 231, 255, 0.3));
            border-radius: 18px;
            border: 1px solid rgba(95, 231, 255, 0.28);
            background: rgba(3, 12, 26, 0.38);
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 50%;
            right: auto;
            bottom: 128px;
            width: min(48vw, 220px);
            transform: translate(-50%, 10px) scale(0.92);
            transform-origin: center bottom;
            border-color: rgba(255, 114, 144, 0.4);
            filter: drop-shadow(0 0 18px rgba(255, 88, 118, 0.32));
        }

        .feedback-gif.fail.visible {
            transform: translate(-50%, 0) scale(1);
        }

        @media (max-width: 640px) {
            #ui-layer { padding: 16px; }
            #start-screen,
            #game-over-screen { padding: 28px 20px; }
            .instruction-list { font-size: 0.76rem; letter-spacing: 0.12em; }
            .hud-panel { top: 16px; }
            .hud-panel.left { left: 16px; }
            .hud-panel.right { right: 16px; }
            .health-track { width: 148px; }
            .score-readout { font-size: 2rem; }
            .feedback-gif {
                right: 12px;
                bottom: 164px;
                width: min(36vw, 124px);
            }
            .feedback-gif.fail {
                bottom: 122px;
                width: min(54vw, 176px);
            }
            .primary-btn,
            .secondary-btn {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="speed-grid" aria-hidden="true"></div>

        <canvas id="gameCanvas"></canvas>
        <div class="scanlines"></div>

        <!-- [agent-note][stage4] repaired: font-remap | source: inline imports | action: aligned title/ui fonts with catalogs/fonts.json Orbitron + Rajdhani -->
        <!-- [agent-note][stage3] resolved-gif: warning/fail overlays -> catalogs/gifs.json compact HUD-safe feedback -->
        <img
            id="warning-gif"
            class="feedback-gif"
            src="https://i.giphy.com/1zmG8avB83Uvm.webp"
            alt="Rail drive warning feedback"
            aria-hidden="true"
        />
        <img
            id="fail-gif"
            class="feedback-gif fail"
            src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            alt="Failure reaction feedback"
            aria-hidden="true"
        />

        <div id="ui-layer">

            <div id="start-screen" class="glass-panel">
                <h1 class="screen-title hud-text">BULLET COMET</h1>
                <p class="screen-subtitle">Ride the neon rail and stabilize the reactor core</p>
                <div class="instruction-list">
                    <p>Hold screen to feed the engine</p>
                    <p>Release to cool the rail drive</p>
                    <p>Keep speed in the <span class="green-zone">green zone</span></p>
                    <p class="danger-line">Do not exceed 430 km/h</p>
                </div>
                <button id="start-btn" class="primary-btn">Launch Train</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel">
                <h2 class="game-over-title hud-text">Reactor Offline</h2>
                <div class="final-distance">Distance: <span id="finalScore">0</span> KM</div>
                <p id="fail-reason" class="fail-reason">System Overload</p>
                <button id="restart-btn" class="secondary-btn">Relaunch Rail</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-panel left">
                    <div class="hud-label">Integrity</div>
                    <div class="health-track">
                        <div id="health-bar"></div>
                    </div>
                </div>
                <div class="hud-panel right">
                    <div class="hud-label">Distance</div>
                    <div class="score-readout hud-text"><span id="score">0</span> <span class="score-unit">KM</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                warn: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3"
            },
            gifs: {
                warning: "https://i.giphy.com/1zmG8avB83Uvm.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const node = new Audio(v);
                    node.preload = 'auto';
                    this.sfx[k] = node;
                }
            }

            unlock() {
                this.unlocked = true;
                const warmup = [this.bgm, ...Object.values(this.sfx)];
                warmup.forEach((audioNode) => {
                    try {
                        audioNode.load();
                    } catch (_) {}
                });
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.72, cooldown = 160) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) || 0;
                if (now - last < cooldown) return;
                this.lastPlayed.set(key, now);

                try {
                    const clone = this.sfx[key].cloneNode();
                    clone.volume = volume;
                    clone.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const warningGif = document.getElementById('warning-gif');
        const failGif = document.getElementById('fail-gif');

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;

        // Game Variables
        let speed = 0;
        let maxSpeed = 480;
        let criticalSpeed = 430;
        let acceleration = 0;
        let isAccelerating = false;
        let distance = 0;
        let health = 100;
        let lastZoneState = false;
        let lastCriticalState = false;
        let gameOverTriggered = false;
        let warningGifTimer = 0;

        // Target Zone logic
        let targetMin = 200;
        let targetMax = 280;
        let targetTimer = 0;

        // Visual Shake
        let shakeX = 0;
        let shakeY = 0;
        let shakeIntensity = 0;

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 5. GAME LOGIC */
        function showFeedback(type, duration = 900) {
            const target = type === 'fail' ? failGif : warningGif;
            if (!target) return;
            target.classList.add('visible');
            clearTimeout(target._hideTimer);
            target._hideTimer = setTimeout(() => {
                target.classList.remove('visible');
            }, duration);
        }

        function initGame() {
            speed = 0;
            distance = 0;
            health = 100;
            acceleration = 0;
            targetMin = 150;
            targetMax = 250;
            targetTimer = 0;
            shakeIntensity = 0;
            lastZoneState = false;
            lastCriticalState = false;
            gameOverTriggered = false;
            warningGifTimer = 0;
            isAccelerating = false;
            warningGif.classList.remove('visible');
            failGif.classList.remove('visible');

            document.getElementById('health-bar').style.width = '100%';
            document.getElementById('health-bar').style.backgroundColor = '#06b6d4';
            document.getElementById('score').innerText = '0';
        }

        function updatePhysics() {
            if (isAccelerating) {
                acceleration = Math.min(acceleration + 0.1, 2.5);
                speed += acceleration;
            } else {
                acceleration = 0;
                speed *= 0.985;
            }

            if (speed < 0) speed = 0;

            targetTimer++;
            if (targetTimer > 300) {
                targetTimer = 0;
                const range = 60 + Math.random() * 40;
                targetMin = 100 + Math.random() * 200;
                targetMax = targetMin + range;
                audio.playSFX('warn', 0.5, 500);
            }

            if (speed > 10) {
                distance += (speed / 3600) * 0.1;
                document.getElementById('score').innerText = distance.toFixed(1);
            }

            let inZone = (speed >= targetMin && speed <= targetMax);
            let isCritical = (speed > criticalSpeed);

            if (inZone) {
                if (!lastZoneState && distance > 0.25) {
                    audio.playSFX('score', 0.5, 260);
                }
                if (health < 100) health += 0.05;
            } else if (isCritical) {
                health -= 0.5;
                shakeIntensity = (speed - criticalSpeed) / 5;
                audio.playSFX('damage', 0.55, 260);
                warningGifTimer = 12;
            } else {
                if (speed > 5 && speed < 50 && distance > 0.5) {
                    health -= 0.1;
                }
            }

            if (isCritical && !lastCriticalState) {
                audio.playSFX('warn', 0.62, 220);
                showFeedback('warning', 850);
            }

            const hpBar = document.getElementById('health-bar');
            hpBar.style.width = `${Math.max(0, health)}%`;
            hpBar.style.backgroundColor = (health < 30 || isCritical) ? '#ef4444' : '#06b6d4';

            if (!isCritical) shakeIntensity *= 0.9;
            if (shakeIntensity < 0.5) shakeIntensity = 0;

            shakeX = (Math.random() - 0.5) * shakeIntensity * 4;
            shakeY = (Math.random() - 0.5) * shakeIntensity * 4;

            if (warningGifTimer > 0) {
                warningGifTimer--;
                warningGif.classList.add('visible');
            } else if (!failGif.classList.contains('visible')) {
                warningGif.classList.remove('visible');
            }

            lastZoneState = inZone;
            lastCriticalState = isCritical;

            if (health <= 0 && !gameOverTriggered) {
                gameOver("Structural Failure");
            }
        }

        function drawHUD() {
            ctx.save();
            ctx.translate(shakeX, shakeY);

            const cx = width / 2;
            const cy = height - 150;
            const radius = 120;

            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, 0);
            ctx.lineWidth = 20;
            ctx.strokeStyle = "rgba(0, 40, 60, 0.8)";
            ctx.stroke();

            const startAngle = Math.PI + (criticalSpeed / maxSpeed) * Math.PI;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, startAngle, 2 * Math.PI);
            ctx.strokeStyle = "rgba(255, 0, 0, 0.6)";
            ctx.stroke();

            const tStart = Math.PI + (targetMin / maxSpeed) * Math.PI;
            const tEnd = Math.PI + (targetMax / maxSpeed) * Math.PI;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, tStart, tEnd);
            ctx.lineWidth = 20;
            ctx.strokeStyle = "rgba(0, 255, 100, 0.8)";
            ctx.shadowColor = "#00ff66";
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.shadowBlur = 0;

            const speedAngle = Math.PI + (Math.min(speed, maxSpeed) / maxSpeed) * Math.PI;
            const nx = cx + Math.cos(speedAngle) * (radius - 10);
            const ny = cy + Math.sin(speedAngle) * (radius - 10);

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(nx, ny);
            ctx.lineWidth = 4;
            ctx.strokeStyle = speed > criticalSpeed ? "#ff0000" : "#00ffff";
            ctx.stroke();

            ctx.fillStyle = speed > criticalSpeed ? "#ff7f95" : "#f8feff";
            ctx.shadowColor = speed > criticalSpeed ? "rgba(255, 92, 122, 0.75)" : "rgba(95, 231, 255, 0.85)";
            ctx.shadowBlur = 16;
            ctx.font = "700 56px Orbitron";
            ctx.textAlign = "center";
            ctx.fillText(Math.floor(speed), cx, cy - 30);

            ctx.shadowBlur = 0;
            ctx.font = "700 24px Rajdhani";
            ctx.fillStyle = "#8df8ff";
            ctx.fillText("KM/H", cx, cy + 30);

            const barW = 300;
            const barH = 10;
            const barX = cx - barW / 2;
            const barY = cy + 60;

            ctx.fillStyle = "#333";
            ctx.fillRect(barX, barY, barW, barH);

            if (isAccelerating) {
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(barX, barY, barW, barH);
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 10;
                ctx.fillRect(barX, barY, barW, barH);
                ctx.shadowBlur = 0;
            }

            if (speed > criticalSpeed) {
                if (Math.floor(Date.now() / 200) % 2 === 0) {
                    ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
                    ctx.fillRect(0, -height, width * 2, height * 2);

                    ctx.fillStyle = "#ff9bad";
                    ctx.font = "700 38px Orbitron";
                    ctx.fillText("WARNING", cx, cy - 180);
                }
            }

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            updatePhysics();
            drawHUD();

            requestAnimationFrame(gameLoop);
        }

        function gameOver(reason) {
            if (gameOverTriggered) return;
            gameOverTriggered = true;
            gameActive = false;
            isAccelerating = false;
            audio.stopBGM();
            audio.playSFX('fail', 0.78, 0);
            showFeedback('fail', 1600);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = distance.toFixed(1);
            document.getElementById('fail-reason').innerText = reason;
        }

        /** 6. CONTROLS */
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameContainer = document.getElementById('game-container');

        const startAccel = (e) => {
            if (!gameActive) return;
            if (e.type === 'touchstart') e.preventDefault();
            isAccelerating = true;
        };
        const stopAccel = () => {
            if (!gameActive) return;
            isAccelerating = false;
        };

        gameContainer.addEventListener('mousedown', startAccel);
        gameContainer.addEventListener('mouseup', stopAccel);
        gameContainer.addEventListener('mouseleave', stopAccel);

        gameContainer.addEventListener('touchstart', startAccel, { passive: false });
        gameContainer.addEventListener('touchend', stopAccel);

        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.72, 0);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('ui', 0.68, 0);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
