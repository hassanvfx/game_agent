<script>
(()=>{
// ----- Config System -----
window.gameConfigDefs = {};
window.gameConfig = {};
window.updateGameConfig = function(key, val){
  if(!(key in window.gameConfigDefs)) return;
  const def = window.gameConfigDefs[key];
  if(def.type === 'number'){
    const num = Number(val);
    if(!isFinite(num)) return;
    const clamped = Math.max(def.min, Math.min(def.max, num));
    window.gameConfig[key] = clamped;
  } else if(def.type === 'color'){
    if(typeof val === 'string' && /^#[0-9a-fA-F]{6}$/.test(val)){
      window.gameConfig[key] = val;
      rebuildThemeFromColor(val);
    }
  }
};
function rebuildThemeFromColor(color){
  // For simplicity, just adjust CSS variables / accents by updating CSS custom property
  document.documentElement.style.setProperty('--theme-color', color);
}

// ----- Global State -----
let canvas, ctx;
let cw = 360, ch = 640;
let dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'PLAYING';
let lastTime = 0;

// Entities
const characters = [
  'SCOUT','SPARK','SHIFT','COMET','NOVA',
  'GLITCH','PIXEL','JET','RIFT','VIBE'
];
let currentCharacterIndex = 0;
let hero = null;
let cards = [];
let lanes = [];
let score = 0;
let lap = 1;
let maxLaps = 3;
let positionRank = 1;
let multiplier = 1;
let inputLocked = false;

// Audio
let audioCtx;
let audioUnlocked = false;
let bgmMainEl, bgmAltEl;
let usingAltBgm = false;
let sfxEls = {};
let sfxCooldowns = new Map();
let feedbackGifEl;
let feedbackGifTimer = null;

// UI refs
let hudCharacterEl, hudPositionEl, hudLapEl, hudScoreEl, hudMultiplierEl;
let gameOverScreenEl, gameOverTitleEl, gameOverSubtitleEl, gameOverScoreEl;
let gameOverGifWinEl, gameOverGifLoseEl, restartBtnEl;
let gameContainerEl;

// ----- Utility -----
function setState(next){
  gameState = next;
  const hud = document.getElementById('hud');
  if(hud) hud.style.display = (next === 'PLAYING') ? 'flex' : 'none';
  if(gameOverScreenEl){
    gameOverScreenEl.classList.toggle('hidden', next !== 'GAMEOVER');
    gameOverScreenEl.classList.toggle('flex', next === 'GAMEOVER');
  }
}
function vibrate(style){
  try{
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
      action: 'vibrate',
      requestId: 'h5-' + Date.now(),
      version: '1.0',
      params: { style: style || 'light' }
    });
  }catch(e){}
}
function randRange(a,b){ return a + Math.random()*(b-a); }
function clamp(v,min,max){ return v<min?min:(v>max?max:v); }

// ----- Audio System -----
function initAudio(){
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }catch(e){
    audioCtx = null;
  }
  bgmMainEl = document.getElementById('bgm_main');
  bgmAltEl = document.getElementById('bgm_alt');
  sfxEls = {
    ui: document.getElementById('sfx_ui_click'),
    coin: document.getElementById('sfx_pickup'),
    boost: document.getElementById('sfx_bonus'),
    hit: document.getElementById('sfx_hit'),
    fail: document.getElementById('sfx_fail'),
    win: document.getElementById('sfx_win'),
    gameover: document.getElementById('sfx_game_over')
  };
}
function playBgm(){
  const el = usingAltBgm ? bgmAltEl : bgmMainEl;
  if(el){
    el.volume = 0.2;
    el.play().catch(()=>{
      if(!usingAltBgm && bgmAltEl){
        usingAltBgm = true;
        bgmAltEl.volume = 0.2;
        bgmAltEl.play().catch(()=>{});
      }
    });
  }
}
function playSfx(id){
  if(!audioUnlocked) return;
  const now = performance.now();
  const cooldown = id === 'ui' ? 90 : 140;
  if((sfxCooldowns.get(id) || 0) > now) return;
  sfxCooldowns.set(id, now + cooldown);
  const el = sfxEls[id];
  if(!el) return;
  try{
    el.pause();
    el.currentTime = 0;
    if(id === 'hit' || id === 'fail' || id === 'gameover'){
      el.volume = 0.42;
    } else if(id === 'boost' || id === 'win'){
      el.volume = 0.5;
    } else {
      el.volume = 0.34;
    }
    el.play().catch(()=>{});
  }catch(_){}
}
function showFeedbackGif(kind){
  if(!feedbackGifEl) return;
  const sources = {
    boost: 'https://i.giphy.com/09YpqSjkbY8DrZXgQz.gif',
    hit: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.gif',
    coin: 'https://i.giphy.com/443DE4MxVGnbM8vCi6.gif'
  };
  const src = sources[kind];
  if(!src) return;
  feedbackGifEl.src = src;
  feedbackGifEl.classList.add('is-visible');
  clearTimeout(feedbackGifTimer);
  feedbackGifTimer = setTimeout(()=>{
    feedbackGifEl && feedbackGifEl.classList.remove('is-visible');
  }, 900);
}
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(()=>{});
    }
  }catch(e){}
  playBgm();
}

// ----- Game Init -----
function initGame(){
  // choose a random pilot alias for the current run
  currentCharacterIndex = Math.floor(Math.random()*characters.length);
  const themeColor = window.gameConfig.themeColor || '#ffde38';
  document.documentElement.style.setProperty('--theme-color', themeColor);

  // hero entity
  const radius = Math.min(cw,ch) * 0.04;
  hero = {
    x: cw*0.5,
    y: ch*0.32,
    r: radius,
    laneIndex: 1,
    floatPhase: Math.random()*Math.PI*2
  };

  // lanes positions (3 lanes)
  lanes = [cw*0.23, cw*0.5, cw*0.77];

  // cards at bottom (3)
  cards = [];
  const cardW = cw*0.24;
  const cardH = ch*0.13;
  const gap = cw*0.04;
  const totalWidth = cardW*3 + gap*2;
  let startX = (cw-totalWidth)/2 + cardW/2;
  const y = ch*0.8;
  for(let i=0;i<3;i++){
    cards.push({
      x: startX + i*(cardW+gap),
      y,
      w: cardW,
      h: cardH,
      laneIndex: i,
      revealed: false,
      effect: null,
      scale: 1
    });
  }
  generateCardEffects();

  score = 0;
  lap = 1;
  positionRank = 1;
  multiplier = 1;
  inputLocked = false;
  updateHud();
}
function generateCardEffects(){
  const effectsPool = ['BOOST','COIN','HAZARD','COIN','BOOST','RIVAL'];
  // [agent-note][stage1] role: future-audio | trigger: card-reveal | intent: accent each route call without changing timing
  for(const card of cards){
    const idx = Math.floor(Math.random()*effectsPool.length);
    card.effect = effectsPool[idx];
    card.revealed = false;
    card.scale = 1;
  }
}

// ----- HUD -----
function updateHud(){
  if(hudCharacterEl) hudCharacterEl.textContent = characters[currentCharacterIndex];
  if(hudPositionEl) hudPositionEl.textContent = 'RANK ' + positionRank + ' / ' + characters.length;
  if(hudLapEl) hudLapEl.textContent = lap + ' / ' + maxLaps;
  if(hudScoreEl) hudScoreEl.textContent = score.toString().padStart(4,'0');
  if(hudMultiplierEl){
    hudMultiplierEl.innerHTML = '';
    for(let i=0;i<multiplier;i++){
      const dot = document.createElement('div');
      dot.className = 'w-3 h-3 rounded-sm bg-lime-400 shadow shadow-lime-300/60';
      hudMultiplierEl.appendChild(dot);
    }
  }
}

// ----- Game Logic -----
function handleCardSelection(card){
  if(card.revealed || inputLocked) return;
  inputLocked = true;
  card.revealed = true;
  card.scale = 1.12;
  playSfx('ui');
  vibrate('light');

  // animate hero switching lane
  hero.laneIndex = card.laneIndex;

  // resolve effect
  let scoreChange = 0;
  if(card.effect === 'BOOST'){
    multiplier = Math.min(multiplier+1, 5);
    scoreChange = 120 * multiplier;
    positionRank = Math.max(1, positionRank-1);
    playSfx('boost');
    showFeedbackGif('boost');
  } else if(card.effect === 'COIN'){
    scoreChange = 80 * multiplier;
    playSfx('coin');
    showFeedbackGif('coin');
  } else if(card.effect === 'HAZARD'){
    scoreChange = -60;
    multiplier = Math.max(1, multiplier-1);
    positionRank = Math.min(characters.length, positionRank+1);
    playSfx('fail');
    showFeedbackGif('hit');
    vibrate('heavy');
    triggerHitFlash();
  } else if(card.effect === 'RIVAL'){
    scoreChange = -40;
    positionRank = Math.min(characters.length, positionRank+1);
    playSfx('hit');
    showFeedbackGif('hit');
    vibrate('medium');
    triggerHitFlash();
  }

  score = Math.max(0, score + scoreChange);

  // progress lap
  if(card.effect === 'BOOST' || card.effect === 'COIN'){
    if(Math.random() < 0.6){
      lap += 1;
      if(lap > maxLaps){
        // race finished
        endRace();
        return;
      }
    }
  } else {
    // hazards less likely to progress lap
    if(Math.random() < 0.3){
      lap += 1;
      if(lap > maxLaps){
        endRace();
        return;
      }
    }
  }
  updateHud();

  // small timeout then re-roll cards
  setTimeout(()=>{
    generateCardEffects();
    inputLocked = false;
  }, 450);
}
function endRace(){
  // determine win / lose by position
  const isWin = positionRank === 1;
  setTimeout(()=>{
    showGameOver(isWin);
  }, 400);
}

// ----- Visual Feedback -----
function triggerHitFlash(){
  if(!gameContainerEl) return;
  gameContainerEl.classList.remove('flash-hit');
  void gameContainerEl.offsetWidth;
  gameContainerEl.classList.add('flash-hit','shake');
  setTimeout(()=>{
    gameContainerEl.classList.remove('shake');
  },260);
}

// ----- Game Over -----
function showGameOver(isWin){
  setState('GAMEOVER');
  if(bgmMainEl) bgmMainEl.pause();
  if(bgmAltEl) bgmAltEl.pause();
  playSfx(isWin ? 'win' : 'gameover');
  if(!gameOverTitleEl || !gameOverSubtitleEl || !gameOverScoreEl) return;
  if(isWin){
    gameOverTitleEl.textContent = 'VICTORY!';
    gameOverSubtitleEl.textContent = 'YOUR CALLS OWNED THE WHOLE CIRCUIT.';
    if(gameOverGifWinEl){
      gameOverGifWinEl.style.opacity = '0.95';
    }
    if(gameOverGifLoseEl){
      gameOverGifLoseEl.style.opacity = '0';
    }
  } else {
    gameOverTitleEl.textContent = 'DEFEAT!';
    gameOverSubtitleEl.textContent = 'ANOTHER RACER READ THE TRACK BETTER.';
    if(gameOverGifWinEl){
      gameOverGifWinEl.style.opacity = '0';
    }
    if(gameOverGifLoseEl){
      gameOverGifLoseEl.style.opacity = '0.95';
    }
  }
  gameOverScoreEl.textContent = score.toString().padStart(4,'0');
}
function restartGame(){
  lap = 1;
  positionRank = Math.floor(randRange(2, characters.length)); // start mid-pack
  multiplier = 1;
  score = 0;
  initGame();
  setState('PLAYING');
}

// ----- Input System -----
function handleGameInput(e){
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  // check cards
  for(const card of cards){
    const hw = card.w/2;
    const hh = card.h/2;
    if(x >= card.x-hw && x <= card.x+hw && y >= card.y-hh && y <= card.y+hh){
      handleCardSelection(card);
      break;
    }
  }
}

function handleGlobalInput(e){
  unlockAudio();
  if(gameState === 'GAMEOVER'){
    if(e && typeof e.preventDefault === 'function'){
      e.preventDefault();
    }
    restartGame();
    return;
  }
  if(gameState === 'PLAYING' && e.type === 'pointerdown'){
    handleGameInput(e);
  }
}
window.addEventListener('pointerdown', handleGlobalInput, { passive: true });

// ----- Resize & Canvas -----
function resizeCanvas(width, height){
  cw = width;
  ch = height;
  dpr = window.devicePixelRatio || 1;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // clamp entities
  if(hero){
    hero.x = clamp(hero.x, hero.r, cw-hero.r);
    hero.y = clamp(hero.y, hero.r, ch-hero.r);
  }
}
function setupResizeObserver(){
  const ro = new ResizeObserver(entries=>{
    for(const entry of entries){
      if(entry.target !== canvas) continue;
      const cr = entry.contentRect;
      const w = cr.width;
      const h = cr.height;
      if(w <= 0 || h <= 0) return;
      resizeCanvas(w,h);
      if(!initialized){
        initialized = true;
        initGame();
        setState('PLAYING');
        playBgm();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      } else {
        // already initialized; just clamp handled in resize
      }
    }
  });
  ro.observe(canvas);
}

// ----- Drawing -----
function drawBackground(){
  const grad = ctx.createLinearGradient(0,0,0,ch);
  grad.addColorStop(0,'#120a2f');
  grad.addColorStop(0.3,'#1a1451');
  grad.addColorStop(0.78,'#0e1230');
  grad.addColorStop(1,'#070918');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,cw,ch);

  // pseudo track perspective
  const trackWidthTop = cw*0.45;
  const trackWidthBottom = cw*0.9;
  const trackHeight = ch*0.9;
  const cx = cw*0.5;
  const topY = ch*0.12;
  const bottomY = ch*0.95;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-trackWidthTop/2, topY);
  ctx.lineTo(cx+trackWidthTop/2, topY);
  ctx.lineTo(cx+trackWidthBottom/2, bottomY);
  ctx.lineTo(cx-trackWidthBottom/2, bottomY);
  ctx.closePath();
  const trackGrad = ctx.createLinearGradient(0, topY, 0, bottomY);
  trackGrad.addColorStop(0, '#26345c');
  trackGrad.addColorStop(0.55, '#101a36');
  trackGrad.addColorStop(1, '#050914');
  ctx.fillStyle = trackGrad;
  ctx.fill();

  // lane lines
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--track-line') || 'rgba(162, 235, 255, 0.22)';
  ctx.lineWidth = 2;
  for(let i=1;i<=2;i++){
    const t = i/3;
    const xTop = cx - trackWidthTop/2 + trackWidthTop*t;
    const xBottom = cx - trackWidthBottom/2 + trackWidthBottom*t;
    ctx.beginPath();
    ctx.moveTo(xTop, topY);
    ctx.lineTo(xBottom, bottomY);
    ctx.stroke();
  }

  // chequered finish band
  const bandY = ch*0.2;
  const bandH = ch*0.02;
  const bandWidthTop = trackWidthTop*0.9;
  const bandWidthBottom = trackWidthTop*1.1;
  const leftTop = cx-bandWidthTop/2;
  const leftBottom = cx-bandWidthBottom/2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(leftTop, bandY);
  ctx.lineTo(leftTop+bandWidthTop, bandY);
  ctx.lineTo(leftBottom+bandWidthBottom, bandY+bandH);
  ctx.lineTo(leftBottom, bandY+bandH);
  ctx.closePath();
  ctx.clip();
  const tile = cw*0.035;
  for(let y=bandY- tile; y<bandY+bandH+tile; y+=tile){
    for(let x=leftTop- tile; x<leftTop+bandWidthTop+tile; x+=tile){
      const even = ((Math.floor(x/tile) + Math.floor(y/tile))%2===0);
      ctx.fillStyle = even ? '#ffffff' : '#000000';
      ctx.fillRect(x,y,tile,tile);
    }
  }
  ctx.restore();
  ctx.restore();
}
function drawHero(dt){
  if(!hero) return;
  hero.floatPhase += dt*4;
  const floatOffset = Math.sin(hero.floatPhase)* (ch*0.008);

  const targetX = lanes[hero.laneIndex];
  const speed = window.gameConfig.heroSpeed || 6;
  const lerpFactor = clamp(dt*speed,0,1);
  hero.x += (targetX-hero.x)*lerpFactor;

  if(!isFinite(hero.x) || !isFinite(hero.y)){
    hero.x = cw*0.5;
    hero.y = ch*0.32;
  }
  const r = Math.max(0, hero.r);
  // glow
  const glowGrad = ctx.createRadialGradient(hero.x, hero.y+floatOffset+5, r*0.2, hero.x, hero.y+floatOffset+5, r*1.8);
  glowGrad.addColorStop(0,'rgba(130,245,255,0.9)');
  glowGrad.addColorStop(0.45,'rgba(255,79,180,0.35)');
  glowGrad.addColorStop(1,'rgba(255,130,0,0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(hero.x, hero.y+floatOffset+5, r*1.6, 0, Math.PI*2);
  ctx.fill();

  // kart body
  ctx.save();
  ctx.translate(hero.x, hero.y+floatOffset);
  const enginePulse = 0.92 + Math.sin(hero.floatPhase * 1.5) * 0.08;
  ctx.fillStyle = '#ff4fb4';
  ctx.strokeStyle = '#081126';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-r*1.28, -r*0.62, r*2.56, r*1.24, r*0.34);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#84f6ff';
  ctx.beginPath();
  ctx.roundRect(-r*0.18, -r*0.48, r*0.92, r*0.24, r*0.12);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,224,102,0.92)';
  ctx.beginPath();
  ctx.roundRect(-r*0.98, -r*0.14, r*1.96, r*0.34, r*0.12);
  ctx.fill();

  // wheels
  ctx.fillStyle = '#081126';
  ctx.beginPath();
  ctx.roundRect(-r*1.38, -r*0.76, r*0.54, r*0.44, r*0.12);
  ctx.roundRect(-r*1.38, r*0.32, r*0.54, r*0.44, r*0.12);
  ctx.roundRect(r*0.84, -r*0.76, r*0.54, r*0.44, r*0.12);
  ctx.roundRect(r*0.84, r*0.32, r*0.54, r*0.44, r*0.12);
  ctx.fill();

  ctx.fillStyle = 'rgba(132,246,255,0.7)';
  ctx.beginPath();
  ctx.ellipse(-r*1.34, 0, r*0.18, r*0.46, 0, 0, Math.PI*2);
  ctx.ellipse(r*1.34, 0, r*0.18, r*0.46, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = 'rgba(132,245,255,' + (0.35 + (enginePulse * 0.22)) + ')';
  ctx.beginPath();
  ctx.ellipse(0, r*0.7, r*0.52, r*0.18, 0, 0, Math.PI*2);
  ctx.fill();

  // driver head
  ctx.fillStyle = '#ffd88e';
  ctx.beginPath();
  ctx.arc(0, -r*0.8, r*0.7, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#081126';
  ctx.stroke();

  // helmet / visor color based on character index
  const cidx = currentCharacterIndex;
  let hatColor = '#00ffcc';
  if(cidx === 0) hatColor = '#9bff4b';
  else if(cidx === 1) hatColor = '#ff3b3b';
  else if(cidx === 2) hatColor = '#3b8bff';
  else if(cidx === 3) hatColor = '#ffde38';
  else if(cidx === 4) hatColor = '#ff6b00';
  else if(cidx === 5) hatColor = '#c8793b';
  else if(cidx === 6) hatColor = '#ffffff';
  else if(cidx === 7) hatColor = '#ff7ad9';
  else if(cidx === 8) hatColor = '#c8ff3b';
  else if(cidx === 9) hatColor = '#9b59ff';
  ctx.fillStyle = hatColor;
  ctx.beginPath();
  ctx.arc(0, -r*1.0, r*0.82, Math.PI, 0);
  ctx.fill();

  ctx.fillStyle = 'rgba(132,246,255,0.82)';
  ctx.beginPath();
  ctx.roundRect(-r*0.42, -r*0.95, r*0.84, r*0.28, r*0.12);
  ctx.fill();

  ctx.fillStyle = '#081126';
  ctx.beginPath();
  ctx.arc(-r*0.22, -r*0.82, r*0.08, 0, Math.PI*2);
  ctx.arc(r*0.22, -r*0.82, r*0.08, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#081126';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -r*0.58, r*0.23, 0.15, Math.PI - 0.15);
  ctx.stroke();

  ctx.restore();
}
function drawCards(dt){
  for(const card of cards){
    const t = dt*12;
    const targetScale = card.revealed ? 1.05 : 1.0;
    card.scale += (targetScale-card.scale) * clamp(t,0,1);
    const w = card.w*card.scale;
    const h = card.h*card.scale;
    const x = card.x;
    const y = card.y;
    const hw = w/2;
    const hh = h/2;

    // card base
    const grad = ctx.createLinearGradient(x-hw, y-hh, x+hw, y+hh);
    if(!card.revealed){
      grad.addColorStop(0, '#1c2655');
      grad.addColorStop(1, '#283f88');
    } else {
      if(card.effect === 'BOOST'){
        grad.addColorStop(0, '#84f6ff');
        grad.addColorStop(1, '#16d2ff');
      } else if(card.effect === 'COIN'){
        grad.addColorStop(0, '#ffe066');
        grad.addColorStop(1, '#ffaf45');
      } else if(card.effect === 'HAZARD'){
        grad.addColorStop(0, '#ff5a95');
        grad.addColorStop(1, '#ff8b45');
      } else {
        grad.addColorStop(0, '#d59dff');
        grad.addColorStop(1, '#84f6ff');
      }
    }
    ctx.fillStyle = grad;
    ctx.strokeStyle = card.revealed ? '#ffffff' : 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const radius = Math.min(hw,hh)*0.3;
    ctx.roundRect(x-hw, y-hh, w, h, radius);
    ctx.fill();
    ctx.stroke();

    // symbol
    ctx.save();
    ctx.translate(x,y);
    if(!card.revealed){
      // ? symbol
      ctx.fillStyle = '#ffde38';
      ctx.font = Math.floor(h*0.7)+'px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?',0,2);
    } else {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if(card.effect === 'BOOST'){
        ctx.fillStyle = '#0b1020';
        ctx.font = Math.floor(h*0.5)+'px "Press Start 2P"';
        ctx.fillText('BOOST',0,0);
      } else if(card.effect === 'COIN'){
        ctx.fillStyle = '#0b1020';
        ctx.font = Math.floor(h*0.5)+'px "Press Start 2P"';
        ctx.fillText('LINE',0,0);
      } else if(card.effect === 'HAZARD'){
        ctx.fillStyle = '#0b1020';
        ctx.font = Math.floor(h*0.4)+'px "Press Start 2P"';
        ctx.fillText('TRAP',0,-h*0.18);
        ctx.fillText('CARD',0,h*0.18);
      } else if(card.effect === 'RIVAL'){
        ctx.fillStyle = '#0b1020';
        ctx.font = Math.floor(h*0.4)+'px "Press Start 2P"';
        ctx.fillText('RIVAL',0,0);
      }
    }
    ctx.restore();
  }
}

// ----- Game Loop -----
function gameLoop(ts){
  requestAnimationFrame(gameLoop);
  const dtRaw = (ts - lastTime) / 1000;
  lastTime = ts;
  const dt = Math.min(dtRaw, 0.05);

  try{
    if(!ctx) return;
    drawBackground();
    drawHero(dt);
    drawCards(dt);

    // HUD continues to be updated with small idle effects if needed
  }catch(e){
    // Loop resilience: do not break
    try{
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }catch(_){}
  }
}

// ----- DOMContentLoaded -----
document.addEventListener('DOMContentLoaded', ()=>{
  // parse config
  const cfgScript = document.getElementById('game-config');
  if(cfgScript){
    try{
      const defs = JSON.parse(cfgScript.textContent.trim());
      window.gameConfigDefs = defs;
      const vals = {};
      for(const k in defs){
        if(defs[k].type === 'number'){
          vals[k] = Number(defs[k].value);
        } else if(defs[k].type === 'color'){
          const val = defs[k].value;
          vals[k] = /^#[0-9a-fA-F]{6}$/.test(val) ? val : '#ffde38';
        }
      }
      window.gameConfig = vals;
      rebuildThemeFromColor(window.gameConfig.themeColor);
    }catch(e){
      window.gameConfigDefs = {};
      window.gameConfig = { heroSpeed: 6, themeColor: '#ffde38' };
    }
  }

  canvas = document.getElementById('gameCanvas');
  if(canvas){
    ctx = canvas.getContext('2d');
  }
  hudCharacterEl = document.getElementById('hud-character');
  hudPositionEl = document.getElementById('hud-position');
  hudLapEl = document.getElementById('hud-lap');
  hudScoreEl = document.getElementById('hud-score');
  hudMultiplierEl = document.getElementById('hud-multiplier');
  gameOverScreenEl = document.getElementById('game-over-screen');
  gameOverTitleEl = document.getElementById('game-over-title');
  gameOverSubtitleEl = document.getElementById('game-over-subtitle');
  gameOverScoreEl = document.getElementById('game-over-score');
  gameOverGifWinEl = document.getElementById('game-over-gif-win');
  gameOverGifLoseEl = document.getElementById('game-over-gif-lose');
  restartBtnEl = document.getElementById('restart-btn');
  gameContainerEl = document.getElementById('game-container');
  feedbackGifEl = document.getElementById('feedback-gif');

  if(restartBtnEl){
    restartBtnEl.addEventListener('click', handleGlobalInput, { passive: false });
  }

  initAudio();
  if(canvas){
    setupResizeObserver();
  }
});
})();
