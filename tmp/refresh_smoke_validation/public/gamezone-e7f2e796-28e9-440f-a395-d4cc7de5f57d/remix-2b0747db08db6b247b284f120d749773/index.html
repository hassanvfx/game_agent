<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Vault</title>
    <!-- [agent-note][stage3] resolved-font: title->Audiowide | ui->Orbitron via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050814;
            --bg-mid: #0a1330;
            --bg-glow: #13285f;
            --panel: rgba(7, 16, 39, 0.78);
            --panel-border: rgba(111, 222, 255, 0.28);
            --text-main: #f3fbff;
            --text-soft: #93afd9;
            --accent: #63e6ff;
            --accent-strong: #22d3ee;
            --jackpot: #ffe067;
            --danger: #ff6f91;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 20%, rgba(68, 225, 255, 0.18), transparent 28%),
                radial-gradient(circle at 50% 110%, rgba(108, 71, 255, 0.18), transparent 35%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(115deg, rgba(255,255,255,0.02) 0%, transparent 35%, transparent 65%, rgba(255,255,255,0.02) 100%),
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.03) 0 1px,
                    transparent 1px 4px
                );
            opacity: 0.24;
            mix-blend-mode: screen;
        }

        body::after {
            background: radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.34) 100%);
        }

        canvas { display: block; touch-action: none; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-pulse-text { animation: pulse-text 2s infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-text { 0%, 100% { transform: scale(1); opacity: 0.82; } 50% { transform: scale(1.04); opacity: 1; } }
        @keyframes vault-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes sparkFloat { 0%, 100% { transform: translateY(0) scale(0.85); opacity: 0.18; } 50% { transform: translateY(-10px) scale(1.05); opacity: 0.8; } }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .hidden.flex { display: none !important; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .p-6 { padding: 1.5rem; box-sizing: border-box; }
        .text-center { text-align: center; }
        .uppercase { text-transform: uppercase; }
        .leading-none { line-height: 0.95; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .h-6 { height: 1.5rem; }
        .opacity-0 { opacity: 0; }
        .opacity-80 { opacity: 0.8; }
        .transition-opacity { transition-property: opacity; }
        .duration-300 { transition-duration: 300ms; }
        .text-gray-400 { color: var(--text-soft); }
        .text-white { color: var(--text-main); }
        .text-yellow-400 { color: var(--jackpot); }
        .text-black { color: #020617; }
        .text-transparent { color: transparent; }
        .text-xl { font-size: 1.125rem; }
        .text-2xl { font-size: 1.375rem; }
        .text-3xl { font-size: 1.65rem; }
        .text-7xl { font-size: clamp(3.1rem, 10vw, 4.5rem); }
        .text-8xl { font-size: clamp(3.8rem, 14vw, 6rem); }
        .font-bold { font-weight: 700; }
        .tracking-widest { letter-spacing: 0.28em; }
        .bg-black\/80 { background: rgba(1, 5, 14, 0.78); }
        .bg-cyan-500 { background: linear-gradient(180deg, #8df8ff, #29d4f5); }
        .hover\:bg-cyan-400:hover { background: linear-gradient(180deg, #b5feff, #47e8ff); }
        .rounded-full { border-radius: 9999px; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .drop-shadow-\[0_0_10px_rgba\(255\,255\,255\,0\.5\)\] { text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .drop-shadow-lg { text-shadow: 0 8px 18px rgba(0,0,0,0.45); }
        .shadow-\[0_0_20px_rgba\(56\,189\,248\,0\.6\)\] { box-shadow: 0 0 20px rgba(56,189,248,0.6); }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .bg-gradient-to-b { background-image: linear-gradient(to bottom, var(--grad-from), var(--grad-to)); }
        .from-cyan-300 { --grad-from: #9fffff; }
        .to-blue-600 { --grad-to: #3d64ff; }
        .backdrop-blur-sm { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .active\:scale-95:active { transform: scale(0.95); }

        button {
            border: 0;
            font: inherit;
            cursor: pointer;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 50%, rgba(99, 230, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 18%, transparent 82%, rgba(255,255,255,0.03));
        }

        #ui-layer {
            position: relative;
        }

        #hud {
            padding-top: max(env(safe-area-inset-top), 0.25rem);
        }

        #hud > .vault-hud-panel {
            min-width: min(84vw, 21rem);
            padding: 0.7rem 1rem 0.85rem;
            border: 1px solid var(--panel-border);
            border-radius: 1.2rem;
            background:
                linear-gradient(180deg, rgba(16, 31, 72, 0.72), rgba(3, 10, 28, 0.88));
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 10px 28px rgba(0,0,0,0.28),
                0 0 28px rgba(34, 211, 238, 0.14);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .vault-tag {
            font-family: 'Audiowide', sans-serif;
            font-size: 0.88rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--text-soft);
            text-shadow: 0 0 12px rgba(99, 230, 255, 0.18);

        #score-display {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.04em;

        #combo-display {
            color: #f7fcff;
            letter-spacing: 0.18em;
            text-shadow: 0 0 14px rgba(255,255,255,0.22);
        }

        #start-screen {
            overflow: hidden;
        }

        #start-screen::before {
            content: "";
            position: absolute;
            width: min(58vw, 22rem);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(127, 245, 255, 0.28);
            box-shadow:
                0 0 30px rgba(99, 230, 255, 0.22),
                inset 0 0 35px rgba(99, 230, 255, 0.12);
            animation: vault-spin 18s linear infinite;
        }

        #start-screen::after {
            content: "";
            position: absolute;
            inset: 12% 8%;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 38%, rgba(110, 220, 255, 0.14), transparent 18%),
                radial-gradient(circle at 50% 74%, rgba(255, 224, 103, 0.1), transparent 16%);
            filter: blur(18px);
        }

        .start-shell {
            position: relative;
            z-index: 1;
            width: min(92vw, 31rem);
            padding: 1.35rem 1.1rem 1.4rem;
            border: 1px solid rgba(143, 244, 255, 0.24);

                0 0 42px rgba(34, 211, 238, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .vault-mark {
            position: relative;
            width: 5.5rem;
            height: 5.5rem;
            margin-bottom: 0.1rem;
            border-radius: 50%;
            border: 2px solid rgba(120, 234, 255, 0.38);
            background:

            box-shadow:
                0 0 30px rgba(99, 230, 255, 0.35),
                inset 0 0 30px rgba(255,255,255,0.1);
        }

        .vault-mark::before,
        .vault-mark::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            background: rgba(255,255,255,0.88);
            left: 50%;
            transform: translateX(-50%);
        }

        .vault-mark::before {
            width: 0.9rem;
            height: 2.05rem;
            top: 1.18rem;
            box-shadow: 0 0 16px rgba(255,255,255,0.38);
        }

        .vault-mark::after {
            width: 2rem;
            height: 0.9rem;
            bottom: 1.34rem;
            box-shadow: 0 0 16px rgba(255,255,255,0.32);
        }

        .spark-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .spark {
            position: absolute;
            width: 0.38rem;
            height: 0.38rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 0 12px rgba(99, 230, 255, 0.6);
            animation: sparkFloat 1.8s ease-in-out infinite;
        }

        .spark:nth-child(1) { left: 18%; top: 72%; }
        .spark:nth-child(2) { left: 35%; top: 30%; animation-delay: 0.35s; }
        .spark:nth-child(3) { left: 68%; top: 28%; animation-delay: 0.7s; }
        .spark:nth-child(4) { left: 79%; top: 68%; animation-delay: 1.05s; }

        .title-stack {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.1em;
            text-shadow:
                0 0 16px rgba(108, 245, 255, 0.48),
                0 0 34px rgba(58, 122, 255, 0.26);
        }

        .subtitle-copy {
            max-width: 24rem;
            line-height: 1.2;
            color: rgba(240, 248, 255, 0.86);
            font-size: 1rem;
        }

        .vault-note {
            font-size: 0.94rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 224, 103, 0.86);
        }

        #start-btn {
            min-width: min(78vw, 19rem);
            border: 1px solid rgba(255,255,255,0.14);
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.12em;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 0 22px rgba(56,189,248,0.34),
                0 12px 24px rgba(0,0,0,0.28);
        }

        #start-btn:hover {
            filter: brightness(1.05);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 0 26px rgba(56,189,248,0.42),
                0 14px 28px rgba(0,0,0,0.32);
        }

        .feedback-gif {
            position: absolute;
            right: clamp(0.6rem, 2vw, 1rem);
            bottom: clamp(0.75rem, 3vw, 1.25rem);
            width: min(30vw, 7.5rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(143, 244, 255, 0.25);
            background: rgba(5, 8, 20, 0.7);
            box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 18px rgba(34, 211, 238, 0.16);
            opacity: 0;
            transform: translateY(0.5rem) scale(0.9);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 30;
        }

        .feedback-gif.active {
            opacity: 0.88;
            transform: translateY(0) scale(1);
        }

        .feedback-gif--jackpot {
            top: clamp(5rem, 10vw, 6.5rem);
            bottom: auto;
            width: min(34vw, 8rem);
            border-color: rgba(255, 224, 103, 0.4);
            box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 22px rgba(255, 224, 103, 0.24);
        }

        @media (max-width: 640px) {
            .p-6 { padding: 1rem; }
            .text-xl { font-size: 1rem; }
            .text-2xl { font-size: 1.06rem; }
            .text-3xl { font-size: 1.2rem; }
            .tracking-widest { letter-spacing: 0.16em; }
            .px-12 { padding-left: 2.25rem; padding-right: 2.25rem; }

            #hud > .vault-hud-panel {
                min-width: min(92vw, 19rem);
                padding: 0.62rem 0.82rem 0.72rem;
                border-radius: 1rem;
            }

            .vault-tag {
                font-size: 0.72rem;
                letter-spacing: 0.24em;
            }

            .subtitle-copy {
                font-size: 0.92rem;
            }

            .vault-note {
                font-size: 0.8rem;
                letter-spacing: 0.13em;
            }

            .feedback-gif {
                width: min(28vw, 5.5rem);
                right: 0.55rem;
                bottom: 0.55rem;
                border-radius: 0.8rem;
            }

            .feedback-gif--jackpot {
                top: 4.6rem;
                width: min(29vw, 6rem);
            }

            .start-shell {
                width: min(92vw, 28rem);
                padding: 1.05rem 0.9rem 1.15rem;
                gap: 0.68rem;
            }

            .vault-mark {
                width: 4.65rem;
                height: 4.65rem;
            }
        }
    </style>
</head>

<script>
/** 
 * Game Logic & Engine 
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    window.gameConfig = {
        holdTime: 1.5,
        themeColor: "#38bdf8",
        jackpotColor: "#facc15"
    };
    
    try {
        const configEl = document.getElementById('game-config');
        if (configEl) {
            const defs = JSON.parse(configEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                window.gameConfig[key] = defs[key].value;
            }
        }
    } catch (e) { console.error("Config parse error", e); }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'themeColor') player.color = val;
        }
    };

    // --- Audio System ---
        const AudioSys = {
            ctx: null,
            bgm: null,
            sfx: {},
            initialized: false,
            lastPlayedAt: {},
            init() {
                if (this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.bgm = document.getElementById('bgm_main');
                this.sfx.start = document.getElementById('sfx_start');
                this.sfx.click = document.getElementById('sfx_click');
                this.sfx.collect = document.getElementById('sfx_collect');
                this.sfx.charge = document.getElementById('sfx_charge');
                this.sfx.jackpot = document.getElementById('sfx_jackpot');
                if (this.bgm) this.bgm.volume = 0.2;
                if (this.sfx.start) this.sfx.start.volume = 0.5;
                if (this.sfx.click) this.sfx.click.volume = 0.3;
                if (this.sfx.collect) this.sfx.collect.volume = 0.45;
                if (this.sfx.charge) this.sfx.charge.volume = 0.42;
                if (this.sfx.jackpot) this.sfx.jackpot.volume = 0.72;
                this.initialized = true;
            },
            async unlock() {
                if (!this.initialized) this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    try { await this.ctx.resume(); } catch (_) {}
                }
            },
            playBgm() {
                if (!this.bgm) return;
                this.unlock().finally(() => {
                    this.bgm.play().catch(() => {});
                });
            },
            pauseBgm() {
                if (this.bgm) this.bgm.pause();
            },
            playSfx(type) {
                if (!this.initialized) this.init();
                const now = performance.now();
                const debounceMs = { click: 70, collect: 90, charge: 240, jackpot: 400, start: 250 };
                if (this.lastPlayedAt[type] && now - this.lastPlayedAt[type] < (debounceMs[type] || 80)) return;
                this.lastPlayedAt[type] = now;
                this.unlock();
                const el = this.sfx[type];
                if (el) {
                    const clone = el.cloneNode();
                    clone.volume = el.volume || 0.4;
                    clone.play().catch(() => this.synthFallback(type));
                    clone.addEventListener('ended', () => clone.remove(), { once: true });
                } else {
                    this.synthFallback(type);
                }
            },
            synthFallback(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'jackpot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1100, this.ctx.currentTime + 0.55);
                    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.9);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.9);
                } else if (type === 'charge') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(780, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1180, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                }
            }
        };

    // --- Game State ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const scoreEl = document.getElementById('score-display');
    const comboEl = document.getElementById('combo-display');
    const startScreen = document.getElementById('start-screen');
    const hud = document.getElementById('hud');
    const chargeGif = document.getElementById('charge-gif');
    const jackpotGif = document.getElementById('jackpot-gif');

    let state = {
        score: 0,
        isPlaying: false,
        lastTime: 0,
        width: 0,
        height: 0,
        dpr: 1,
        shake: 0,
        flash: 0,
        chargeCueFired: false,
        jackpotGifTimer: 0,
        chargeGifTimer: 0
    };

    let input = {
        isDown: false,
        downTime: 0,
        x: 0,
        y: 0
    };

    // --- Entities ---
    const player = {
        x: 0,
        y: 0,
        radius: 80,
        baseRadius: 80,
        scale: 1,
        color: window.gameConfig.themeColor,
        charge: 0 // 0 to 1
    };

    let particles = [];
    let floatingTexts = [];

    class Particle {
        constructor(x, y, color, speed, size) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.01;
            this.color = color;
            this.size = size;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
            this.vy += 0.2; // Gravity
        }
        draw(ctx) {
            const radius = Math.max(0, this.size * this.life);
            if (radius <= 0) return;
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class FloatingText {
        constructor(x, y, text, color, isBig) {
            this.x = x;
            this.y = y;
            this.text = text;
            this.color = color;
            this.vy = isBig ? -5 : -2;
            this.life = 1.0;
            this.isBig = isBig;
            this.scale = 0;
        }
        update() {
            this.y += this.vy;
            this.vy *= 0.95;
            this.life -= 0.01;
            if (this.scale < 1) this.scale += 0.1;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.textAlign = "center";
            ctx.font = this.isBig ? `700 80px Audiowide` : `700 38px Orbitron`;
            
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);
            
            // Text Stroke
            ctx.strokeStyle = "rgba(3, 9, 25, 0.9)";
            ctx.lineWidth = this.isBig ? 8 : 4;
            ctx.strokeText(this.text, 0, 0);
            ctx.fillText(this.text, 0, 0);
            
            ctx.restore();
        }
    }

    // --- Core Functions ---
    function resize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        state.dpr = window.devicePixelRatio || 1;
        
        canvas.style.width = state.width + 'px';
        canvas.style.height = state.height + 'px';
        canvas.width = state.width * state.dpr;
        canvas.height = state.height * state.dpr;
        
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        
        player.x = state.width / 2;
        player.y = state.height / 2;
        player.baseRadius = Math.min(state.width, state.height) * 0.15;
    }

    function spawnParticles(x, y, count, color, speedMode) {
        for (let i = 0; i < count; i++) {
            const s = speedMode === 'burst' ? Math.random() * 15 + 5 : Math.random() * 5 + 2;
            const sz = speedMode === 'burst' ? Math.random() * 8 + 4 : Math.random() * 4 + 2;
            particles.push(new Particle(x, y, color, s, sz));
        }
    }

    function showGif(el, durationMs) {
        if (!el) return;
        el.classList.add('active');
        const timerKey = el === jackpotGif ? 'jackpotGifTimer' : 'chargeGifTimer';
        clearTimeout(state[timerKey]);
        state[timerKey] = setTimeout(() => el.classList.remove('active'), durationMs);
    }

    function addScore(amount, isJackpot) {
        state.score += amount;
        scoreEl.innerText = state.score.toLocaleString();

        if (isJackpot) {
            state.shake = 30;
            state.flash = 1.0;
            AudioSys.playSfx('jackpot');
            showGif(jackpotGif, 1800);
            floatingTexts.push(new FloatingText(player.x, player.y - 100, "+1,000,000", window.gameConfig.jackpotColor, true));
            spawnParticles(player.x, player.y, 100, window.gameConfig.jackpotColor, 'burst');
            spawnParticles(player.x, player.y, 50, "#ffffff", 'burst');
        } else {
            state.shake = 2;
            AudioSys.playSfx('collect');
            floatingTexts.push(new FloatingText(input.x, input.y - 50, "+1", "#ffffff", false));
            spawnParticles(input.x, input.y, 8, window.gameConfig.themeColor, 'normal');
        }
    }

    function drawVaultCore(timestamp) {
        const pulse = Math.sin(timestamp / 200) * 0.05 + 1;
        const chargeScale = 1 + player.charge * 0.3;
        const r = player.baseRadius * pulse * chargeScale;
        const glowColor = player.charge >= 1 ? window.gameConfig.jackpotColor : window.gameConfig.themeColor;
        const ringColor = player.charge >= 1 ? "rgba(255, 224, 103, 0.85)" : "rgba(99, 230, 255, 0.85)";

        ctx.save();

        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = "rgba(120, 220, 255, 0.14)";
        ctx.lineWidth = Math.max(2, r * 0.05);
        ctx.beginPath();
        ctx.arc(player.x, player.y, r * 1.38, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = Math.max(3, r * 0.08);
        ctx.beginPath();
        ctx.arc(player.x, player.y, r * 1.14, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * Math.max(0.12, player.charge)));
        ctx.stroke();

        ctx.shadowBlur = 26 + player.charge * 60;
        ctx.shadowColor = glowColor;
        const outerGrad = ctx.createRadialGradient(player.x - r * 0.25, player.y - r * 0.32, r * 0.18, player.x, player.y, r);
        outerGrad.addColorStop(0, "rgba(235, 253, 255, 0.98)");
        outerGrad.addColorStop(0.2, player.charge >= 1 ? "rgba(255, 241, 180, 0.98)" : "rgba(157, 245, 255, 0.98)");
        outerGrad.addColorStop(0.55, player.charge >= 1 ? "rgba(255, 214, 70, 0.95)" : "rgba(34, 211, 238, 0.92)");
        outerGrad.addColorStop(1, "rgba(10, 19, 48, 0.95)");

        ctx.fillStyle = outerGrad;
        ctx.beginPath();
        ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(9, 18, 45, 0.92)";
        ctx.beginPath();
        ctx.arc(player.x, player.y, r * 0.73, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.22)";
        ctx.lineWidth = Math.max(2, r * 0.035);
        ctx.beginPath();
        ctx.arc(player.x, player.y, r * 0.74, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255,255,255,0.88)";
        ctx.lineWidth = Math.max(5, r * 0.08);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - r * 0.18);
        ctx.lineTo(player.x, player.y + r * 0.16);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(player.x, player.y + r * 0.15, r * 0.18, Math.PI * 0.1, Math.PI * 0.9, false);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = `700 ${Math.max(22, 28 * chargeScale)}px Audiowide`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(255,255,255,0.24)";
        ctx.fillText(player.charge >= 1 ? "BANK!" : "TAP", player.x, player.y + r * 1.38);

        ctx.restore();
    }

    function gameLoop(timestamp) {
        if (!state.lastTime) state.lastTime = timestamp;
        const dt = (timestamp - state.lastTime) / 1000;
        state.lastTime = timestamp;

        const backgroundGrad = ctx.createLinearGradient(0, 0, 0, state.height);
        backgroundGrad.addColorStop(0, "#091126");
        backgroundGrad.addColorStop(0.45, "#0a1637");
        backgroundGrad.addColorStop(1, "#040813");
        ctx.fillStyle = backgroundGrad;
        ctx.fillRect(0, 0, state.width, state.height);

        const haloGrad = ctx.createRadialGradient(state.width / 2, state.height * 0.44, 0, state.width / 2, state.height * 0.44, Math.max(state.width, state.height) * 0.62);
        haloGrad.addColorStop(0, "rgba(70, 204, 255, 0.16)");
        haloGrad.addColorStop(0.45, "rgba(45, 91, 255, 0.08)");
        haloGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = haloGrad;
        ctx.fillRect(0, 0, state.width, state.height);

        // Flash Effect
        if (state.flash > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${state.flash})`;
            ctx.fillRect(0, 0, state.width, state.height);
            state.flash -= 2 * dt;
        }

        // Camera Shake
        ctx.save();
        if (state.shake > 0) {
            const dx = (Math.random() - 0.5) * state.shake;
            const dy = (Math.random() - 0.5) * state.shake;
            ctx.translate(dx, dy);
            state.shake = Math.max(0, state.shake - 60 * dt);
        }

        if (state.isPlaying) {
            // Logic
                if (input.isDown) {
                    const holdDur = (Date.now() - input.downTime) / 1000;
                    player.charge = Math.min(holdDur / window.gameConfig.holdTime, 1);

                    if (player.charge > 0.2) {
                        state.shake = Math.max(state.shake, player.charge * 5);
                    }

                    if (player.charge > 0.55 && !state.chargeCueFired) {
                        AudioSys.playSfx('charge');
                        showGif(chargeGif, 900);
                        state.chargeCueFired = true;
                    }

                    comboEl.style.opacity = player.charge > 0.1 ? 1 : 0;
                    comboEl.innerText = player.charge >= 1 ? "RELEASE FOR OVERCHARGE!" : "OVERCHARGING...";
                    comboEl.style.color = player.charge >= 1 ? window.gameConfig.jackpotColor : "#ffffff";

                } else {
                    player.charge = Math.max(0, player.charge - 5 * dt);
                    if (player.charge < 0.1) comboEl.style.opacity = 0;
                    if (player.charge < 0.2) state.chargeCueFired = false;
                }

            // Draw Background Grid
            ctx.strokeStyle = "rgba(133, 226, 255, 0.08)";
            ctx.lineWidth = 1;
            const gridSize = 50;
            const offset = (timestamp / 50) % gridSize;
            ctx.beginPath();
            for (let x = 0; x < state.width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, state.height);
            }
            for (let y = offset; y < state.height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(state.width, y);
            }
            ctx.stroke();

            drawVaultCore(timestamp);

            particles.forEach((p, i) => {
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            });

            floatingTexts.forEach((t, i) => {
                t.update();
                t.draw(ctx);
                if (t.life <= 0) floatingTexts.splice(i, 1);
            });
        }

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    // --- Input Handling ---
    const handleStart = (e) => {
        if (!state.isPlaying) return;
        e.preventDefault();
        input.isDown = true;
        input.downTime = Date.now();
        state.chargeCueFired = false;
        AudioSys.unlock();

        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        input.x = clientX - rect.left;
        input.y = clientY - rect.top;
        AudioSys.playSfx('click');
    };

    const handleEnd = (e) => {
        if (!state.isPlaying || !input.isDown) return;
        e.preventDefault();
        input.isDown = false;

        const holdDuration = (Date.now() - input.downTime) / 1000;

        if (holdDuration >= window.gameConfig.holdTime) {
            addScore(1000000, true);
        } else {
            addScore(1, false);
        }

        state.chargeCueFired = false;
    };

    // --- Event Listeners ---
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('pointerdown', handleStart, { passive: false });
    canvas.addEventListener('pointerup', handleEnd, { passive: false });
    canvas.addEventListener('pointercancel', handleEnd, { passive: false });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            AudioSys.pauseBgm();
        } else if (state.isPlaying) {
            AudioSys.playBgm();
        }
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        AudioSys.init();
        AudioSys.playSfx('start');
        AudioSys.playBgm();

        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        hud.classList.add('fade-in');

        state.isPlaying = true;
        resize();
    });

    resize();
    requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
