<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Market Rush</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- [agent-note][stage4] repaired: font-remap | action: replaced required non-catalog pair with approved catalog-backed Exo 2 + Russo One -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #150f36;
            --bg-bottom: #2f1459;
            --lane-glow: rgba(76, 214, 255, 0.18);
            --panel-bg: rgba(18, 14, 44, 0.74);
            --panel-border: rgba(111, 241, 255, 0.42);
            --panel-shadow: rgba(3, 6, 20, 0.42);
            --text-main: #f7fbff;
            --text-soft: #c6dafc;
            --accent: #63ffd2;
            --accent-2: #6fd2ff;
            --warning: #ff6b81;
            --coin: #ffd86b;
            --hero-main: #45f7c8;
            --hero-dark: #098e74;
            --hero-trim: #ffe884;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #3f2d7e 0%, rgba(63, 45, 126, 0) 42%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.12), transparent 18%),
                radial-gradient(circle at 80% 10%, rgba(111,210,255,0.15), transparent 22%),
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 28%);
            opacity: 0.95;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        .glass {
            background: linear-gradient(180deg, rgba(22, 18, 53, 0.88), rgba(11, 10, 31, 0.78));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 14px 32px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.14);
        }
        .hidden { display: none !important; }
        .brand-display {
            font-family: 'Russo One', 'Exo 2', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .hud-pill {
            min-height: 44px;
            color: var(--text-main);
        }
        .score-chip {
            text-shadow: 0 0 12px rgba(111, 210, 255, 0.3);
        }
        .warning-chip {
            color: #fff3f5;
            background: linear-gradient(180deg, rgba(255, 92, 129, 0.95), rgba(178, 20, 74, 0.92));
            border-color: rgba(255, 220, 228, 0.3);
            box-shadow: 0 12px 22px rgba(132, 12, 56, 0.36);
        }
        .modal-panel {
            width: min(20rem, calc(100vw - 2rem));
            max-height: min(32rem, 90vh);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-radius: 1.75rem;
            border: 1px solid rgba(132, 243, 255, 0.45);
            background:
                radial-gradient(circle at top, rgba(111, 210, 255, 0.22), transparent 32%),
                linear-gradient(180deg, rgba(18, 16, 49, 0.97), rgba(8, 8, 25, 0.94));
            box-shadow:
                0 18px 48px rgba(5, 8, 27, 0.52),
                0 0 24px rgba(111, 210, 255, 0.18);
        }
        .modal-copy {
            overflow-y: auto;
        }
        .final-score {
            font-family: 'Russo One', 'Exo 2', sans-serif;
            color: var(--coin);
            text-shadow: 0 0 18px rgba(255, 216, 107, 0.32);
        }
        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            bottom: 1rem;
            width: clamp(84px, 22vw, 132px);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.24);
            box-shadow: 0 10px 24px rgba(2, 6, 18, 0.36);
            opacity: 0;
            transform: translateY(12px) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            background: rgba(9, 12, 31, 0.75);
        }
        .feedback-gif.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        .feedback-gif.fail {
            right: auto;
            left: 0.75rem;
            bottom: 1rem;
        }
        .arcade-btn {
            position: sticky;
            bottom: 0;
            border: 0;
            background: linear-gradient(180deg, #51ffd7, #18bb8f);
            color: #041d18;
            box-shadow: 0 14px 28px rgba(8, 102, 81, 0.32);
            transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
        }
        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            filter: brightness(1.06);
            box-shadow: 0 18px 34px rgba(8, 102, 81, 0.4);
        }
        .arcade-btn:active {
            transform: scale(0.97);
        }
        /* Juice animations */
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .pop-anim { animation: pop 0.2s ease-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake-anim { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

    <!-- ASSETS -->
    <div style="display: none;">
        <!-- [agent-note][stage3] resolved-audio: bgm/collect/crash/ui -> catalogs/audios.json -->
        <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
        <audio id="sfx_collect" data-editable="audio" data-label="Collect SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
        <audio id="sfx_bonus" data-editable="audio" data-label="Bonus Streak SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
        <audio id="sfx_crash" data-editable="audio" data-label="Crash SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
        <audio id="sfx_gameover" data-editable="audio" data-label="Game Over SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
        <audio id="sfx_ui" data-editable="audio" data-label="UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    </div>

    <!-- CONFIG -->
    <script id="game-config" type="application/x-game-config">
    {
        "heroSpeed": { "type": "number", "label": "Steering Sensitivity", "value": 8, "min": 1, "max": 15 },
        "baseSpeed": { "type": "number", "label": "Scroll Speed", "value": 400, "min": 200, "max": 800 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#00C853" }
    }
    </script>

    <!-- GAME CONTAINER -->
    <div id="game-container" class="relative w-full h-full select-none">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI LAYER -->
            <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
                <!-- [agent-note][stage3] resolved-gif: collect/fail feedback -> catalogs/gifs.json -->
                <img id="collect-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Collect streak reaction" loading="lazy" decoding="async">
                <img id="fail-gif" class="feedback-gif fail" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Crash reaction" loading="lazy" decoding="async">
            
            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start hidden">
                <div class="glass hud-pill score-chip px-4 py-2 rounded-full text-sm sm:text-base font-bold flex items-center gap-2">
                    <span aria-hidden="true">🛒</span>
                    <span class="brand-display text-[11px] sm:text-xs text-cyan-200">Market Rush</span>
                    <span id="score-display" class="text-xl sm:text-2xl font-bold text-white">0</span>
                </div>
                    <div class="glass warning-chip px-3 py-1 rounded-full text-[11px] sm:text-sm font-bold hidden" id="warning-msg">
                        RUSH HOUR!
                    </div>
            </div>

            <!-- GAME OVER -->
            <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center bg-black/55 hidden pointer-events-auto px-4">
                <div id="game-over-panel" class="modal-panel p-6 sm:p-8 text-center transform transition-all scale-100">
                    <div class="modal-copy">
                        <div class="text-xs uppercase tracking-[0.35em] text-cyan-200 mb-2">Checkout Chaos</div>
                        <h2 class="brand-display text-[30px] sm:text-4xl text-rose-300 mb-2">Spill Out!</h2>
                        <p class="text-slate-200/90 mb-6 text-base sm:text-lg">Your turbo cart clipped the wet floor sign.</p>
                        <div class="final-score text-4xl sm:text-5xl mb-8" id="final-score">0</div>
                    </div>
                    <button id="restart-btn" class="arcade-btn w-full text-lg sm:text-xl font-bold py-4 rounded-xl">
                        DASH AGAIN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- §2 System Invariants & Globals ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        let cw = 0, ch = 0;
        let dpr = 1;
        let lastTime = 0;
        let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
        let animationFrameId;

        // Config
        let config = {}; 
        
        // State
        let score = 0;
        let gameSpeed = 0;
        let distance = 0;
        
        // Entities
        let hero = { x: 0, y: 0, width: 60, height: 80, targetX: 0 };
        let items = [];
        let particles = [];
        let floaters = []; // Floating text
        
        // Input
        let inputActive = false;
        let inputX = 0;

        // Audio Context
        let audioCtx;
        let soundEnabled = false;
        let audioUnlocked = false;
        let lastCollectSoundAt = 0;
        let gifTimers = {};

        // --- §3 Implementation Spec ---

        // 3.7 Config System
        function parseConfig() {
            const el = document.getElementById('game-config');
            if (!el) return;
            try {
                const defs = JSON.parse(el.textContent);
                window.gameConfigDefs = defs;
                config = {};
                for (const key in defs) {
                    config[key] = defs[key].value;
                }
                window.gameConfig = config;
            } catch (e) {
                console.error("Config parse error", e);
                config = { heroSpeed: 8, baseSpeed: 400, themeColor: "#00C853" }; // Fallback
            }
        }

        window.updateGameConfig = (key, val) => {
            if (config[key] !== undefined) {
                config[key] = val;
                if (key === 'themeColor') {
                    document.documentElement.style.setProperty('--accent', val);
                    document.getElementById('restart-btn').style.background = `linear-gradient(180deg, ${val}, ${val})`;
                }
            }
        };

        // 3.5 Audio System
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function unlockAudio() {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            audioUnlocked = true;
            if (!soundEnabled) {
                soundEnabled = true;
            }
            syncAudioForState();
        }

        function playSound(id, options = {}) {
            if (!soundEnabled || !audioUnlocked) return;
            const { volume = 0.55, restart = true } = options;
            const el = document.getElementById(id);
            if (el) {
                el.volume = volume;
                if (restart) el.currentTime = 0;
                el.play().catch(() => playSynthFallback(id));
            } else {
                playSynthFallback(id);
            }
        }

        function playSynthFallback(id) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (id === 'sfx_collect' || id === 'sfx_bonus' || id === 'sfx_ui') {
                osc.type = id === 'sfx_ui' ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(id === 'sfx_bonus' ? 620 : 800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(id === 'sfx_bonus' ? 1480 : 1200, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(id === 'sfx_ui' ? 0.18 : 0.28, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } else if (id === 'sfx_crash' || id === 'sfx_gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(id === 'sfx_gameover' ? 120 : 100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function syncAudioForState() {
            const bgm = document.getElementById('bgm_main');
            if (!bgm) return;
            bgm.volume = 0.22;
            if (!audioUnlocked || !soundEnabled) return;
            if (gameState === 'PLAYING') {
                bgm.play().catch(() => {});
            } else {
                bgm.pause();
            }
        }

        function showGif(id, duration = 900) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add('show');
            clearTimeout(gifTimers[id]);
            gifTimers[id] = setTimeout(() => {
                el.classList.remove('show');
            }, duration);
        }

        function vibrate(style) {
            if (window.navigator && window.navigator.vibrate) {
                 window.navigator.vibrate(style === 'heavy' ? 200 : 50);
            }
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style: style }
            });
        }

        // 3.1 Viewport & Canvas
        function resize() {
            dpr = window.devicePixelRatio || 1;
            const rect = document.getElementById('game-container').getBoundingClientRect();
            cw = rect.width;
            ch = rect.height;
            
            canvas.width = cw * dpr;
            canvas.height = ch * dpr;
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // 3.3 Hero & Game Init
        function initGame() {
            score = 0;
            gameSpeed = config.baseSpeed;
            distance = 0;
            items = [];
            particles = [];
            floaters = [];
            
            // Hero Setup
            hero.width = 60;
            hero.height = 90;
            hero.x = cw / 2;
            hero.y = ch - 150;
            hero.targetX = cw / 2;
            
            // Initial input state
            inputX = cw / 2;
            inputActive = false;

            // Update UI
            document.getElementById('score-display').innerText = '0';
        }

        function setState(newState) {
            gameState = newState;
            const hud = document.getElementById('hud');
            const gameOver = document.getElementById('game-over-screen');
            
            if (newState === 'PLAYING') {
                hud.classList.remove('hidden');
                gameOver.classList.add('hidden');
                canvas.classList.remove('shake-anim');
                document.getElementById('fail-gif')?.classList.remove('show');
            } else if (newState === 'GAMEOVER') {
                hud.classList.add('hidden');
                gameOver.classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                canvas.classList.add('shake-anim');
                showGif('fail-gif', 1800);
                playSound('sfx_gameover', { volume: 0.5 });
            }
            syncAudioForState();
        }

        function restartGame() {
            playSound('sfx_ui', { volume: 0.42 });
            initGame();
            setState('PLAYING');
        }

        // 3.2 Input System
        function handleGlobalInput(e) {
            unlockAudio();
            
            // Route based on state
            if (gameState === 'GAMEOVER') {
                // Click handled by button, but screen tap can also trigger if needed (sticking to button for safety)
                return;
            }
            
            if (gameState === 'PLAYING') {
                inputActive = true;
                const rect = canvas.getBoundingClientRect();
                inputX = e.clientX - rect.left;
            }
        }
        
        function handleMove(e) {
            if (gameState === 'PLAYING' && inputActive) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                inputX = e.clientX - rect.left;
            }
        }

        function handleEnd(e) {
            inputActive = false;
        }

        window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
        window.addEventListener('pointermove', handleMove, { passive: false });
        window.addEventListener('pointerup', handleEnd, { passive: false });
        window.addEventListener('pointercancel', handleEnd, { passive: false });
        
        document.getElementById('restart-btn').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent double trigger
            unlockAudio();
            restartGame();
        });

        // --- Logic & Drawing ---

        function spawnItem() {
            const laneCount = 4;
            const laneWidth = cw / laneCount;
            const lane = Math.floor(Math.random() * laneCount);
            const x = lane * laneWidth + laneWidth / 2;
            
            // Types: 0=Apple, 1=Milk, 2=Bread, 3=OBSTACLE
            const rand = Math.random();
            let type = 'apple';
            if (rand < 0.3) type = 'obstacle';
            else if (rand < 0.5) type = 'milk';
            else if (rand < 0.7) type = 'bread';
            
            items.push({
                x: x,
                y: -50,
                type: type,
                angle: (Math.random() - 0.5) * 0.5,
                active: true
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 400,
                    vy: (Math.random() - 0.5) * 400,
                    life: 1.0,
                    color: color
                });
            }
        }

        function createFloater(x, y, text) {
            floaters.push({ x, y, text, life: 1.0, vy: -100 });
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            // Difficulty ramping
            gameSpeed += dt * 10; 
            distance += gameSpeed * dt;

            // Spawning
            if (Math.random() < dt * (gameSpeed / 400) * 2) {
                spawnItem();
            }

            // Hero Movement
            if (inputActive) {
                hero.targetX = inputX;
            }
            // Smooth lerp
            const lerpFactor = Math.min(1, dt * config.heroSpeed);
            hero.x += (hero.targetX - hero.x) * lerpFactor;
            
            // Clamp
            const margin = hero.width / 2;
            hero.x = Math.max(margin, Math.min(cw - margin, hero.x));
            
            // Safety check
            if (!isFinite(hero.x)) hero.x = cw / 2;

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += gameSpeed * dt;
                
                // Collision
                const dx = hero.x - it.x;
                const dy = hero.y - it.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (it.active && dist < (hero.width/2 + 20)) {
                    if (it.type === 'obstacle') {
                        // CRASH
                        vibrate('heavy');
                        playSound('sfx_crash', { volume: 0.62 });
                        createParticles(hero.x, hero.y, '#FFD600');
                        setState('GAMEOVER');
                    } else {
                        // COLLECT
                        it.active = false;
                        score += 10;
                        document.getElementById('score-display').innerText = score;
                        vibrate('light');
                        const now = performance.now();
                        if (now - lastCollectSoundAt > 90) {
                            playSound('sfx_collect', { volume: 0.46 });
                            lastCollectSoundAt = now;
                        }
                        if (score > 0 && score % 50 === 0) {
                            playSound('sfx_bonus', { volume: 0.54 });
                            showGif('collect-gif', 1100);
                        }
                        
                        let color = '#F44336'; // Apple Red
                        if (it.type === 'milk') color = '#2196F3';
                        if (it.type === 'bread') color = '#FF9800';
                        
                        createParticles(it.x, it.y, color);
                        createFloater(it.x, it.y, "+10");
                    }
                }
                
                if (it.y > ch + 50) {
                    items.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update Floaters
            for (let i = floaters.length - 1; i >= 0; i--) {
                let f = floaters[i];
                f.y += f.vy * dt;
                f.life -= dt;
                if (f.life <= 0) floaters.splice(i, 1);
            }
        }

        function draw() {
            // Background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
            bgGradient.addColorStop(0, '#1f1654');
            bgGradient.addColorStop(0.45, '#31196a');
            bgGradient.addColorStop(1, '#100f2c');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, cw, ch);

            const glowGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.08, 0, cw * 0.5, ch * 0.08, Math.max(cw, ch) * 0.55);
            glowGradient.addColorStop(0, 'rgba(127, 235, 255, 0.18)');
            glowGradient.addColorStop(1, 'rgba(127, 235, 255, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, 0, cw, ch);

            // Floor lanes (parallax/scroll effect)
            const gridSize = 100;
            const offset = distance % gridSize;
            const laneWidth = cw / 4;

            for (let lane = 0; lane < 4; lane++) {
                const laneX = lane * laneWidth;
                const laneGrad = ctx.createLinearGradient(laneX, 0, laneX + laneWidth, 0);
                const laneAlpha = lane % 2 === 0 ? 0.08 : 0.14;
                laneGrad.addColorStop(0, `rgba(111, 210, 255, ${laneAlpha})`);
                laneGrad.addColorStop(0.5, 'rgba(255,255,255,0.03)');
                laneGrad.addColorStop(1, `rgba(99, 255, 210, ${laneAlpha})`);
                ctx.fillStyle = laneGrad;
                ctx.fillRect(laneX, 0, laneWidth, ch);
            }

            ctx.strokeStyle = 'rgba(186, 226, 255, 0.14)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x <= cw; x += laneWidth) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, ch);
            }
            for (let y = -offset; y <= ch; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(cw, y);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(111, 210, 255, 0.25)';
            ctx.beginPath();
            for (let y = -offset; y <= ch; y += gridSize) {
                ctx.moveTo(cw * 0.2, y);
                ctx.lineTo(cw * 0.8, y);
            }
            ctx.stroke();

            // Draw Items
            items.forEach(it => {
                if (!it.active) return;
                ctx.save();
                ctx.translate(it.x, it.y);
                ctx.rotate(it.angle);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.ellipse(0, 30, 20, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                if (it.type === 'apple') {
                    ctx.fillStyle = '#ff6478';
                    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.beginPath(); ctx.arc(-7, -8, 7, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#69f08a';
                    ctx.fillRect(-2, -22, 4, 10);
                    ctx.beginPath(); ctx.ellipse(7, -20, 8, 4, -0.5, 0, Math.PI*2); ctx.fill();
                } else if (it.type === 'milk') {
                    const milkGrad = ctx.createLinearGradient(0, -20, 0, 20);
                    milkGrad.addColorStop(0, '#93f0ff');
                    milkGrad.addColorStop(1, '#3f86ff');
                    ctx.fillStyle = milkGrad;
                    ctx.fillRect(-15, -20, 30, 40);
                    ctx.fillStyle = '#f2fcff';
                    ctx.fillRect(-15, -20, 30, 10);
                    ctx.fillStyle = '#1d4ed8';
                    ctx.fillRect(-8, -4, 16, 14);
                } else if (it.type === 'bread') {
                    const breadGrad = ctx.createLinearGradient(0, -25, 0, 25);
                    breadGrad.addColorStop(0, '#ffd27a');
                    breadGrad.addColorStop(1, '#ff9c46');
                    ctx.fillStyle = breadGrad;
                    ctx.beginPath();
                    ctx.roundRect(-15, -25, 30, 50, 10);
                    ctx.fill();
                    ctx.fillStyle = '#fff0bf';
                    ctx.fillRect(-15, -5, 30, 5);
                    ctx.fillRect(-15, 10, 30, 5);
                } else if (it.type === 'obstacle') {
                    // Wet Floor Sign
                    ctx.fillStyle = '#ffe05c';
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(25, 20);
                    ctx.lineTo(-25, 20);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#b88900';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#1d1b22';
                    ctx.font = 'bold 20px "Russo One", "Exo 2", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('!', 0, 5);
                }
                ctx.restore();
            });

            // Draw Hero (Cart)
            if (gameState !== 'BOOT') {
                ctx.save();
                ctx.translate(hero.x, hero.y);
                // Tilt based on movement
                const tilt = (hero.x - hero.targetX) * -0.005;
                ctx.rotate(Math.max(-0.2, Math.min(0.2, tilt)));

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(0, 40, 35, 10, 0, 0, Math.PI*2);
                ctx.fill();

                // Cart Body: expressive neon runner cart
                const basketGrad = ctx.createLinearGradient(0, -30, 0, 24);
                basketGrad.addColorStop(0, '#73ffe0');
                basketGrad.addColorStop(1, '#0aa182');
                ctx.fillStyle = basketGrad;
                ctx.beginPath();
                ctx.moveTo(-25, -30);
                ctx.lineTo(25, -30);
                ctx.lineTo(20, 20);
                ctx.lineTo(-20, 20);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#d9fff6';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Face panel / mascot personality
                ctx.fillStyle = 'rgba(4, 22, 28, 0.55)';
                ctx.fillRect(-16, -10, 32, 18);
                ctx.fillStyle = '#ffe884';
                ctx.beginPath(); ctx.arc(-8, -2, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, -2, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#ffe884';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 4, 8, 0.15, Math.PI - 0.15);
                ctx.stroke();

                // Grid lines on basket
                ctx.strokeStyle = '#0b7461';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-22, -15); ctx.lineTo(22, -15);
                ctx.moveTo(-21, 0); ctx.lineTo(21, 0);
                ctx.moveTo(0, -30); ctx.lineTo(0, 20);
                ctx.stroke();

                // Handle
                ctx.strokeStyle = '#ff7a92';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-25, -30);
                ctx.lineTo(-30, -40);
                ctx.lineTo(30, -40);
                ctx.lineTo(25, -30);
                ctx.stroke();

                // Filled groceries peeking out
                ctx.fillStyle = '#ff6b81';
                ctx.beginPath(); ctx.arc(-10, -24, 7, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#6fd2ff';
                ctx.fillRect(2, -31, 11, 12);
                ctx.fillStyle = '#ffd86b';
                ctx.beginPath(); ctx.arc(10, -22, 5, 0, Math.PI*2); ctx.fill();

                // Wheels
                ctx.fillStyle = '#15171f';
                ctx.beginPath(); ctx.arc(-20, 35, 7, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, 35, 7, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#8ef5ff';
                ctx.beginPath(); ctx.arc(-20, 35, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, 35, 3, 0, Math.PI*2); ctx.fill();

                // Legs
                ctx.strokeStyle = '#9be8df';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-20, 20); ctx.lineTo(-20, 35);
                ctx.moveTo(20, 20); ctx.lineTo(20, 35);
                ctx.stroke();

                // Hero speed trail
                ctx.strokeStyle = 'rgba(111, 210, 255, 0.22)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-40, 0);
                ctx.lineTo(-60, 8);
                ctx.moveTo(40, 0);
                ctx.lineTo(60, 8);
                ctx.stroke();

                ctx.restore();
            }

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Floaters
            ctx.font = 'bold 24px "Russo One", "Exo 2", sans-serif';
            ctx.textAlign = 'center';
            floaters.forEach(f => {
                ctx.globalAlpha = f.life;
                ctx.fillStyle = '#63ffd2';
                ctx.strokeStyle = '#082633';
                ctx.lineWidth = 4;
                ctx.strokeText(f.text, f.x, f.y);
                ctx.fillText(f.text, f.x, f.y);
                ctx.globalAlpha = 1;
            });
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
            lastTime = timestamp;

            try {
                update(dt);
                draw();
            } catch (e) {
                console.error("Loop error:", e);
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        // --- §3.4 Lifecycle ---
        document.addEventListener('DOMContentLoaded', () => {
            parseConfig();
            resize();
            initGame();
            setState('PLAYING');
            
            // L1 Audio Unlock
            const bgm = document.getElementById('bgm_main');
            if (bgm) bgm.play().catch(() => {});

            requestAnimationFrame(loop);
        });

        window.addEventListener('resize', resize);

    </script>
</body>
