<script>
/**
 * AUDIO MANAGER
 * Handles Web Audio API contexts, unlocking, and fallback synthesis.
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.isUnlocked = false;
        this.muted = false;
        this.sfxGains = {};
        this.lastPlayedAt = {};
    }

    init() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        try {
            this.ctx = new AudioContext();
        } catch (e) {
            console.warn('Audio context unavailable.');
            return;
        }
        
        const unlock = () => {
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.isUnlocked = true;
            this.playBgm();
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };

        document.addEventListener('pointerdown', unlock, { passive: true });
        document.addEventListener('keydown', unlock);

        ['sfx_start', 'sfx_merge', 'sfx_warn', 'sfx_blocked', 'sfx_over'].forEach(id => this.loadSound(id));
    }

    async loadSound(id) {
        const el = document.getElementById(id);
        if (!el || !this.ctx) return;

        try {
            const response = await fetch(el.src, { mode: 'cors' });
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using fallback.`);
            this.buffers[id] = 'fallback';
        }
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el || !this.isUnlocked || this.muted) return;
        el.volume = 0.2;
        el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, minGap = 90) {
        if (!this.ctx || this.muted) return;

        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < minGap) return;
        this.lastPlayedAt[id] = now;

        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        const buffer = this.buffers[id];
        if (buffer && buffer !== 'fallback') {
            const source = this.ctx.createBufferSource();
            source.buffer = buffer;

            const gain = this.ctx.createGain();
            gain.gain.value = ({
                sfx_start: 0.35,
                sfx_merge: 0.24,
                sfx_warn: 0.2,
                sfx_blocked: 0.18,
                sfx_over: 0.32
            })[id] || 0.24;

            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(id);
        }
    }

    synthesize(id) {
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (id === 'sfx_start') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.22, this.ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.19);
        } else if (id === 'sfx_merge') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.2, this.ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.14);
        } else if (id === 'sfx_warn') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.22);
            gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.22);
        } else if (id === 'sfx_blocked') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.11, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.09);
        } else {
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.5);
        }
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audio = new AudioManager();

// Config
window.gameConfigDefs = {
    "swipeThreshold": { "type": "number", "label": "Swipe Sensitivity", "value": 30, "min": 10, "max": 100 },
    "animSpeed": { "type": "number", "label": "Animation Speed", "value": 0.25, "min": 0.05, "max": 0.5 },
    "gridGap": { "type": "number", "label": "Grid Gap", "value": 10, "min": 0, "max": 20 }
};
window.gameConfig = {
    swipeThreshold: 30,
    animSpeed: 0.25,
    gridGap: 10
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) window.gameConfig[key] = val;
};

// State
let gameState = 'START'; // START, PLAYING, GAMEOVER
let score = 0;
let bestScore = localStorage.getItem('meme_stack_best') || 0;
let grid = []; // 4x4
let particles = [];
let steveState = 'idle'; // idle, happy, worried
let steveTimer = 0;
let shakeTime = 0;
let warningAudioCooldown = 0;
let feedbackTimers = {
    combo: null,
    warning: null
};

// Input
let touchStart = { x: 0, y: 0 };
let isDragging = false;

// Assets / Colors
const TILE_COLORS = {
    2: '#8B5A2B', // Wood
    4: '#A0522D', // Planks
    8: '#DEB887', // Stick
    16: '#808080', // Cobble
    32: '#A9A9A9', // Stone Tool
    64: '#E0E0E0', // Iron
    128: '#F5F5F5', // Iron Tool
    256: '#FFD700', // Gold
    512: '#DAA520', // Gold Tool
    1024: '#00FFFF', // Diamond
    2048: '#E0FFFF', // Diamond Tool
    4096: '#303030'  // Netherite
};

const TILE_NAMES = {
    2: 'Post', 4: 'Loop', 8: 'Clip', 16: 'Trend', 32: 'Bit',
    64: 'Remix', 128: 'Spam', 256: 'Hype', 512: 'Boost',
    1024: 'Viral', 2048: 'Legend', 4096: 'Chaos'
};

const feedbackEls = {
    combo: document.getElementById('combo-burst'),
    warning: document.getElementById('warning-burst')
};

function showFeedbackGif(kind) {
    const img = feedbackEls[kind];
    const asset = document.getElementById(kind === 'combo' ? 'gif_combo' : 'gif_warn');
    if (!img || !asset) return;

    img.src = asset.src;
    img.classList.remove('hidden');
    requestAnimationFrame(() => img.classList.add('is-visible'));

    if (feedbackTimers[kind]) clearTimeout(feedbackTimers[kind]);
    feedbackTimers[kind] = setTimeout(() => {
        img.classList.remove('is-visible');
        setTimeout(() => img.classList.add('hidden'), 220);
    }, kind === 'combo' ? 1100 : 1400);
}

// Core Functions
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Input Listeners
    canvas.addEventListener('pointerdown', handleInputStart, { passive: false });
    canvas.addEventListener('pointermove', handleInputMove, { passive: false });
    canvas.addEventListener('pointerup', handleInputEnd, { passive: false });
    canvas.addEventListener('pointercancel', handleInputEnd, { passive: false });
    
    // UI Buttons
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    
    // Audio
    audio.init();
    
    // Loop
    requestAnimationFrame(loop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = document.getElementById('game-container').getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function startGame() {
    audio.playSfx(gameState === 'GAMEOVER' ? 'sfx_start' : 'sfx_start', 40);
    audio.playBgm();
    gameState = 'PLAYING';
    score = 0;
    grid = Array(4).fill().map(() => Array(4).fill(null));
    particles = [];
    steveState = 'idle';
    warningAudioCooldown = 0;
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    if (feedbackEls.combo) feedbackEls.combo.className = 'feedback-gif feedback-gif-top hidden';
    if (feedbackEls.warning) feedbackEls.warning.className = 'feedback-gif feedback-gif-bottom hidden';

    updateScore(0);
    spawnTile();
    spawnTile();
}

function spawnTile() {
    let empty = [];
    for(let y=0; y<4; y++) {
        for(let x=0; x<4; x++) {
            if(!grid[y][x]) empty.push({x, y});
        }
    }
    if(empty.length === 0) return;
    
    const pos = empty[Math.floor(Math.random() * empty.length)];
    grid[pos.y][pos.x] = {
        val: Math.random() < 0.9 ? 2 : 4,
        x: pos.x,
        y: pos.y, // Visual pos
        scale: 0,
        merged: false
    };
}

// Input Logic
function handleInputStart(e) {
    if(gameState !== 'PLAYING') return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    touchStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    isDragging = true;
}

function handleInputMove(e) {
    if(!isDragging) return;
    e.preventDefault();
}

function handleInputEnd(e) {
    if(!isDragging || gameState !== 'PLAYING') return;
    e.preventDefault();
    isDragging = false;
    
    const rect = canvas.getBoundingClientRect();
    const touchEnd = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    
    const dx = touchEnd.x - touchStart.x;
    const dy = touchEnd.y - touchStart.y;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    
    if(Math.max(absDx, absDy) > window.gameConfig.swipeThreshold) {
        if(absDx > absDy) {
            move(dx > 0 ? 1 : -1, 0); // Right : Left
        } else {
            move(0, dy > 0 ? 1 : -1); // Down : Up
        }
    }
}

// Game Logic
function move(dx, dy) {
    let moved = false;
    let mergedScore = 0;
    
    // Reset merge flags
    for(let y=0; y<4; y++) 
        for(let x=0; x<4; x++) 
            if(grid[y][x]) grid[y][x].merged = false;

    // Logic for sliding (Standard 2048 algo)
    const traverseX = dx === 1 ? [3,2,1,0] : [0,1,2,3];
    const traverseY = dy === 1 ? [3,2,1,0] : [0,1,2,3];

    traverseY.forEach(y => {
        traverseX.forEach(x => {
            if (!grid[y][x]) return;
            
            let cell = grid[y][x];
            let nextX = x + dx;
            let nextY = y + dy;
            let destX = x;
            let destY = y;
            
            // Find furthest position
            while(nextX >= 0 && nextX < 4 && nextY >= 0 && nextY < 4) {
                let nextCell = grid[nextY][nextX];
                if (!nextCell) {
                    destX = nextX;
                    destY = nextY;
                } else if (nextCell.val === cell.val && !nextCell.merged) {
                    // Merge target found
                    destX = nextX;
                    destY = nextY;
                    break; // Stop here
                } else {
                    break; // Blocked
                }
                nextX += dx;
                nextY += dy;
            }
            
            // Execute Move
            if (destX !== x || destY !== y) {
                let target = grid[destY][destX];
                if (target && target.val === cell.val) {
                    // Merge
                    target.val *= 2;
                    target.merged = true;
                    target.scale = 1.2; // Pop effect
                    score += target.val;
                    mergedScore += target.val;
                    grid[y][x] = null;
                    spawnParticles(destX, destY, TILE_COLORS[target.val] || '#fff');
                    moved = true;
                } else {
                    // Slide
                    grid[destY][destX] = cell;
                    grid[y][x] = null;
                    moved = true;
                }
                // Animate visual position
                // Note: In a robust implementation we'd separate logical and visual, 
                // but for single file we lerp visual to logical in update()
            }
        });
    });

    if (moved) {
        spawnTile();
        updateScore(score);
        if (mergedScore > 0) {
            audio.playSfx('sfx_merge', 70);
            showFeedbackGif('combo');
            steveState = 'happy';
            steveTimer = 30;
        }
        checkState();
    } else {
        audio.playSfx('sfx_blocked', 120);
    }
}

function checkState() {
    // Check Game Over
    let full = true;
    let canMove = false;
    let count = 0;
    
    for(let y=0; y<4; y++) {
        for(let x=0; x<4; x++) {
            if(!grid[y][x]) {
                full = false;
            } else {
                count++;
                // Check neighbors
                [[0,1],[1,0]].forEach(d => {
                    let ny = y + d[1], nx = x + d[0];
                    if(ny<4 && nx<4 && grid[ny][nx] && grid[ny][nx].val === grid[y][x].val) canMove = true;
                });
            }
        }
    }
    
    if (full && !canMove) {
        audio.playSfx('sfx_over', 400);
        audio.stopBgm();
        showFeedbackGif('warning');
        gameState = 'GAMEOVER';
        document.getElementById('finalScore').innerText = score;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
    } else if (count >= 12) {
        steveState = 'worried';
        showFeedbackGif('warning');
        if (count >= 14 && warningAudioCooldown <= 0) {
             shakeTime = 5;
             warningAudioCooldown = 32;
             audio.playSfx('sfx_warn', 220);
        }
    }
}

function updateScore(s) {
    score = s;
    if(score > bestScore) {
        bestScore = score;
        localStorage.setItem('meme_stack_best', bestScore);
    }
    document.getElementById('scoreDisplay').innerText = score;
    document.getElementById('bestDisplay').innerText = bestScore;
}

function spawnParticles(gx, gy, color) {
    const rect = getGridRect();
    const cellSize = (rect.w - window.gameConfig.gridGap * 5) / 4;
    const cx = rect.x + window.gameConfig.gridGap + gx * (cellSize + window.gameConfig.gridGap) + cellSize/2;
    const cy = rect.y + window.gameConfig.gridGap + gy * (cellSize + window.gameConfig.gridGap) + cellSize/2;
    
    for(let i=0; i<10; i++) {
        particles.push({
            x: cx, y: cy,
            vx: (Math.random()-0.5) * 10,
            vy: (Math.random()-0.5) * 10,
            life: 1.0,
            color: color
        });
    }
}

// Drawing
function getGridRect() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const sidePadding = Math.min(20, w * 0.05);
    const reservedTop = h < 680 ? 132 : 160;
    const reservedBottom = h < 680 ? 28 : 40;
    const size = Math.max(220, Math.min(w - sidePadding * 2, h - reservedTop - reservedBottom));
    return {
        x: (w - size) / 2,
        y: reservedTop + Math.max(0, (h - reservedTop - reservedBottom - size) / 2),
        w: size,
        h: size
    };
}

function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
    ctx.fill();
}

function drawSteve(ctx, x, y, size) {
    const bob = steveState === 'happy' ? Math.sin(Date.now() * 0.012) * 2.5 : 0;
    const pulse = steveState === 'worried' ? 1.04 : 1;
    const s = size * pulse;
    const left = x - s / 2;
    const top = y - s / 2 + bob;

    ctx.save();
    ctx.shadowColor = 'rgba(129, 244, 255, 0.24)';
    ctx.shadowBlur = 18;

    // Hoodie / streamer glow
    ctx.fillStyle = '#1c294b';
    drawRoundedRect(ctx, x - s * 0.46, y + s * 0.18 + bob, s * 0.92, s * 0.44, s * 0.08);

    // Hair cap
    ctx.fillStyle = '#2e203b';
    drawRoundedRect(ctx, left, top, s, s * 0.58, s * 0.08);

    // Face
    ctx.fillStyle = '#f4b18f';
    drawRoundedRect(ctx, left + s * 0.04, top + s * 0.18, s * 0.92, s * 0.74, s * 0.08);

    // Headset pads
    ctx.fillStyle = '#81f4ff';
    drawRoundedRect(ctx, left - s * 0.05, top + s * 0.38, s * 0.08, s * 0.23, s * 0.03);
    drawRoundedRect(ctx, left + s * 0.97, top + s * 0.38, s * 0.08, s * 0.23, s * 0.03);

    // Headset band
    ctx.strokeStyle = '#81f4ff';
    ctx.lineWidth = Math.max(2, s * 0.05);
    ctx.beginPath();
    ctx.arc(x, top + s * 0.26, s * 0.5, Math.PI, Math.PI * 2);
    ctx.stroke();

    // Eyes
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    drawRoundedRect(ctx, x - s * 0.34, y - s * 0.02 + bob, s * 0.16, s * 0.18, s * 0.03);
    drawRoundedRect(ctx, x + s * 0.18, y - s * 0.02 + bob, s * 0.16, s * 0.18, s * 0.03);

    const px = steveState === 'worried' ? (Math.random() - 0.5) * 3 : steveState === 'happy' ? 1 : 0;
    ctx.fillStyle = '#1b1630';
    drawRoundedRect(ctx, x - s * 0.29 + px, y + s * 0.03 + bob, s * 0.07, s * 0.08, s * 0.02);
    drawRoundedRect(ctx, x + s * 0.23 + px, y + s * 0.03 + bob, s * 0.07, s * 0.08, s * 0.02);

    // Blush / status lights
    if (steveState !== 'idle') {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = steveState === 'happy' ? '#ff7cc8' : '#ffd86b';
        ctx.beginPath();
        ctx.arc(x - s * 0.22, y + s * 0.22 + bob, s * 0.07, 0, Math.PI * 2);
        ctx.arc(x + s * 0.22, y + s * 0.22 + bob, s * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Mouth
    ctx.fillStyle = '#6a334a';
    if (steveState === 'happy') {
        ctx.fillRect(x - s * 0.18, y + s * 0.33 + bob, s * 0.36, s * 0.05);
        ctx.fillRect(x - s * 0.18, y + s * 0.28 + bob, s * 0.05, s * 0.05);
        ctx.fillRect(x + s * 0.13, y + s * 0.28 + bob, s * 0.05, s * 0.05);
    } else if (steveState === 'worried') {
        drawRoundedRect(ctx, x - s * 0.09, y + s * 0.3 + bob, s * 0.18, s * 0.14, s * 0.04);
    } else {
        ctx.fillRect(x - s * 0.16, y + s * 0.35 + bob, s * 0.32, s * 0.05);
    }

    ctx.restore();
}

function loop() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    if (warningAudioCooldown > 0) warningAudioCooldown--;
    
    // Update Shake
    let shakeX = 0, shakeY = 0;
    if (shakeTime > 0) {
        shakeTime--;
        shakeX = (Math.random() - 0.5) * 10;
        shakeY = (Math.random() - 0.5) * 10;
    }
    
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(shakeX, shakeY);
    
    // Draw Steve
    if (steveTimer > 0) steveTimer--;
    else if (steveState === 'happy') steveState = 'idle';
    
    drawSteve(ctx, w/2, 80, 60);

    // Draw Grid Background
    const rect = getGridRect();
    const gap = window.gameConfig.gridGap;
    const cellSize = (rect.w - gap * 5) / 4;
    
    const shellGradient = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.h);
    shellGradient.addColorStop(0, '#241830');
    shellGradient.addColorStop(1, '#120f21');
    ctx.fillStyle = shellGradient;
    drawRoundedRect(ctx, rect.x, rect.y, rect.w, rect.h, 18);

    ctx.strokeStyle = 'rgba(129, 244, 255, 0.18)';
    ctx.lineWidth = 2;
    ctx.strokeRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
    
    // Draw Empty Cells
    ctx.fillStyle = 'rgba(7, 7, 15, 0.34)';
    for(let y=0; y<4; y++) {
        for(let x=0; x<4; x++) {
            const cx = rect.x + gap + x * (cellSize + gap);
            const cy = rect.y + gap + y * (cellSize + gap);
            drawRoundedRect(ctx, cx, cy, cellSize, cellSize, 5);
        }
    }
    
    // Draw Tiles
    for(let y=0; y<4; y++) {
        for(let x=0; x<4; x++) {
            let t = grid[y][x];
            if(t) {
                // Lerp visual pos
                t.x += (x - t.x) * window.gameConfig.animSpeed;
                t.y += (y - t.y) * window.gameConfig.animSpeed;
                
                // Pop animation
                if (t.scale > 1) t.scale -= 0.05;
                else if (t.scale < 1) t.scale += 0.1;
                if (Math.abs(t.scale - 1) < 0.05) t.scale = 1;
                
                const cx = rect.x + gap + t.x * (cellSize + gap);
                const cy = rect.y + gap + t.y * (cellSize + gap);
                const size = cellSize * (t.scale || 1);
                const offset = (cellSize - size) / 2;
                
                const tileGradient = ctx.createLinearGradient(cx, cy, cx, cy + size);
                tileGradient.addColorStop(0, TILE_COLORS[t.val] || '#333');
                tileGradient.addColorStop(1, t.val >= 1024 ? '#d7f7ff' : '#2b1f35');
                ctx.fillStyle = tileGradient;
                drawRoundedRect(ctx, cx + offset, cy + offset, size, size, 10);

                ctx.strokeStyle = t.val >= 256 ? 'rgba(255, 255, 255, 0.5)' : 'rgba(255, 255, 255, 0.14)';
                ctx.lineWidth = 2;
                ctx.strokeRect(cx + offset + 2, cy + offset + 2, size - 4, size - 4);
                
                // Text
                ctx.fillStyle = (t.val >= 8 && t.val < 1024) ? '#201726' : '#fff';
                ctx.font = `${Math.max(10, size/4.1)}px "Press Start 2P", monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let label = t.val;
                if(size > 40) {
                    ctx.fillText(label, cx + cellSize/2, cy + cellSize/2);
                    // Optional: Draw icon representation here for polish
                }
            }
        }
    }
    
    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if(p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

// Boot
document.addEventListener('DOMContentLoaded', init);

</script>
