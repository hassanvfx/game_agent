<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Street Hoops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | title-ui -> Orbitron + Bangers -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
    <style>
        :root {
            --bg-top: #07111f;
            --bg-bottom: #142844;
            --panel-bg: rgba(7, 17, 31, 0.76);
            --panel-border: rgba(123, 214, 255, 0.28);
            --panel-shadow: rgba(0, 0, 0, 0.45);
            --text-main: #f5fbff;
            --text-soft: rgba(223, 244, 255, 0.82);
            --accent: #ff8a2b;
            --accent-2: #ffd44d;
            --accent-cool: #72dcff;
            --danger: #ff5c73;
            --success: #7cffb4;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(114, 220, 255, 0.16), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        }

        body {
            touch-action: manipulation;
            font-family: "Orbitron", Arial, sans-serif;
            color: var(--text-main);
        }

        button {
            font-family: "Orbitron", Arial, sans-serif;
            font-size: 1rem;
            font-weight: 400;
            border: 0;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 166, 0, 0.18), transparent 22%),
                linear-gradient(180deg, #0a1324 0%, #13223b 100%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 212, 77, 0.12), transparent 14%),
                radial-gradient(circle at 82% 12%, rgba(114, 220, 255, 0.14), transparent 18%),
                repeating-linear-gradient(
                    90deg,
                    transparent 0 44px,
                    rgba(255,255,255,0.015) 44px 45px
                );
            opacity: 0.95;
        }

        #game-container::after {
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.16));
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .screen-card {
            position: relative;
            width: min(92vw, 24rem);
            margin: 1rem;
            padding: 1.1rem 1rem 1rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(16, 29, 50, 0.94), rgba(7, 16, 29, 0.92));
            border: 1px solid var(--panel-border);
            box-shadow:
                0 1rem 2.2rem var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(114,220,255,0.12), transparent 32%),
                radial-gradient(circle at top right, rgba(255, 164, 58, 0.18), transparent 28%);
            pointer-events: none;
        }

        .screen-card > * {
            position: relative;
            z-index: 1;
        }

        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
            padding: 0.38rem 0.72rem;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #eefbff;
            background: rgba(114, 220, 255, 0.13);
            border: 1px solid rgba(114, 220, 255, 0.24);
        }

        .screen-title {
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: clamp(2rem, 8vw, 3.6rem);
            text-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.25);
        }

        .title-main {
            display: block;
            color: #f7fcff;
        }

        .title-accent {
            display: block;
            color: transparent;
            font-family: 'Bangers', cursive;
            font-size: clamp(1rem, 4.2vw, 1.7rem);
            line-height: 1.2;
            margin-top: 0.75rem;
            background: linear-gradient(180deg, #ffe27b 0%, #ff8a2b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: none;
        }

        .screen-copy {
            margin: 0.85rem auto 1rem;
            max-width: 18rem;
            color: var(--text-soft);
            font-size: clamp(0.88rem, 3.2vw, 1rem);
            line-height: 1.4;
        }

        .shot-tip {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0 0 1rem;
            color: #d8f5ff;
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.95;
        }

        .shot-tip span {
            padding: 0.3rem 0.55rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .action-btn {
            min-width: 12.5rem;
            max-width: 100%;
            padding: 0.92rem 1.25rem;
            border-radius: 999px;
            font-size: clamp(1rem, 3.8vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #101825;
            background: linear-gradient(180deg, #ffd95f 0%, #ff9b36 100%);
            box-shadow:
                0 0.9rem 1.6rem rgba(255, 144, 53, 0.34),
                inset 0 1px 0 rgba(255,255,255,0.55);
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-2px);
            filter: brightness(1.03);
            box-shadow:
                0 1rem 1.8rem rgba(255, 144, 53, 0.42),
                0 0 0 3px rgba(114, 220, 255, 0.18);
            outline: none;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .secondary-btn {
            background: linear-gradient(180deg, #f7fbff 0%, #bed5e5 100%);
            box-shadow:
                0 0.9rem 1.5rem rgba(96, 132, 171, 0.26),
                inset 0 1px 0 rgba(255,255,255,0.68);
        }

        .hidden {
            display: none !important;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: max(0.85rem, env(safe-area-inset-top));
            left: max(0.85rem, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.56rem 0.82rem;
            border-radius: 999px;
            background: rgba(7, 18, 33, 0.76);
            border: 1px solid rgba(114, 220, 255, 0.22);
            box-shadow:
                0 0.45rem 1rem rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.1);
            color: #ffffff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .hud-ball {
            position: relative;
            width: 1.1rem;
            height: 1.1rem;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.42), transparent 24%),
                linear-gradient(145deg, #ffb24a, #ff7d1d 62%, #d95906);
            box-shadow: 0 0 0.9rem rgba(255, 145, 53, 0.45);
        }

        .hud-ball::before,
        .hud-ball::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.8px solid rgba(34, 24, 12, 0.86);
        }

        .hud-ball::before {
            clip-path: inset(0 45% 0 45%);
        }

        .hud-ball::after {
            clip-path: inset(45% 0 45% 0);
        }

        .hud-label {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1;
        }

        .hud-label small {
            font-family: 'Bangers', cursive;
            font-size: 0.46rem;
            color: rgba(216, 245, 255, 0.8);
            letter-spacing: 0.08em;
            margin-bottom: 0.24rem;
        }

        #score {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: var(--accent-2);
            text-shadow: 0 0 0.7rem rgba(255, 212, 77, 0.38);
        }

        .final-score {
            margin: 0 0 1rem;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .final-score strong {
            color: var(--accent-2);
            font-size: 1.55rem;
            margin-left: 0.25rem;
            text-shadow: 0 0 0.9rem rgba(255, 212, 77, 0.35);
        }

        .arena-flavor {
            margin-top: 1rem;
            font-family: 'Bangers', cursive;
            font-size: 0.58rem;
            line-height: 1.6;
            color: rgba(214, 240, 255, 0.7);
        }

        .feedback-gif {
            position: absolute;
            z-index: 3;
            width: clamp(5.5rem, 18vw, 8rem);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: translateY(0) scale(0.88);
            transition: opacity 180ms ease, transform 180ms ease;
            filter: drop-shadow(0 0.6rem 1rem rgba(0, 0, 0, 0.35));
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(7, 17, 31, 0.28);
        }

        .feedback-gif.active {
            opacity: 0.92;
            transform: translateY(-0.25rem) scale(1);
        }

        #score-gif {
            right: max(0.85rem, env(safe-area-inset-right));
            top: max(1rem, env(safe-area-inset-top) + 4.4rem);
        }

        #fail-gif {
            left: max(0.75rem, env(safe-area-inset-left));
            bottom: max(0.75rem, env(safe-area-inset-bottom) + 0.75rem);
        }

        @media (max-width: 480px) {
            .screen-card {
                width: min(92vw, 22rem);
                padding: 1rem 0.9rem 0.95rem;
                border-radius: 1.25rem;
            }

            .action-btn {
                min-width: 0;
                width: 100%;
            }

            #hud {
                gap: 0.55rem;
                padding: 0.5rem 0.72rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="start-screen" class="screen-card">
                <div class="card-badge">🔥 Night Court Challenge</div>
                <h1 class="screen-title">
                    <span class="title-main">Street</span>
                    <span class="title-accent">Hoops</span>
                </h1>
                <p class="screen-copy">Line up a clean launch, arc the ball high, and light up the scoreboard one shot at a time.</p>
                <div class="shot-tip">
                    <span>Drag</span>
                    <span>Arc</span>
                    <span>Swish</span>
                </div>
                <button id="start-btn" class="action-btn">Start Run</button>
                <div class="arena-flavor">Pixel HUD • Neon asphalt • one-ball pressure</div>
            </div>

            <div id="game-over-screen" class="screen-card hidden">
                <div class="card-badge">🏁 End Of Run</div>
                <h2 class="screen-title" style="font-size: clamp(1.8rem, 7vw, 3rem);">
                    <span class="title-main">Round</span>
                    <span class="title-accent" style="font-size: clamp(0.9rem, 4vw, 1.4rem);">Over</span>
                </h2>
                <p class="final-score">Score:<strong id="finalScore">0</strong></p>
                <button id="restart-btn" class="action-btn secondary-btn">Try Another Shot</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-ball" aria-hidden="true"></div>
                <div class="hud-label">
                    <small>Score</small>
                    <span id="score">0</span>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: score/fail reactions -> catalogs/gifs.json -->
            <img id="score-gif" class="feedback-gif" alt="" aria-hidden="true" loading="lazy">
            <img id="fail-gif" class="feedback-gif" alt="" aria-hidden="true" loading="lazy">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                swish: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                rim: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                bounce: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            },
            gifs: {
                score: "https://i.giphy.com/yMzmW9yOXaDFHcKBlb.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};

                for (const [key, value] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(value);
                    sample.preload = 'auto';
                    sample.volume = {
                        start: 0.65,
                        shoot: 0.5,
                        score: 0.58,
                        swish: 0.52,
                        fail: 0.6,
                        rim: 0.4,
                        bounce: 0.34,
                        ui: 0.42
                    }[key] ?? 0.5;
                    this.sfx[key] = sample;
                }
            }

            unlock() {
                if (this.ready) return;
                this.ready = true;
                const warmups = [this.bgm, ...Object.values(this.sfx)];
                warmups.forEach((audioEl) => {
                    audioEl.play()
                        .then(() => {
                            audioEl.pause();
                            audioEl.currentTime = 0;
                        })
                        .catch(() => {});
                });
            }

            playBGM() {
                this.unlock();
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, minGap = 80) {
                const sample = this.sfx[key];
                if (!sample) return;

                const now = performance.now();
                if ((this.lastPlayedAt[key] ?? 0) + minGap > now) return;
                this.lastPlayedAt[key] = now;

                try {
                    sample.currentTime = 0;
                    sample.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const scoreGif = document.getElementById('score-gif');
        const failGif = document.getElementById('fail-gif');
        let scoreGifTimer = 0;
        let failGifTimer = 0;

        scoreGif.src = ASSETS.gifs.score;
        failGif.src = ASSETS.gifs.fail;

        function showFeedbackGif(element, timerRef, duration = 1400) {
            if (!element) return timerRef;
            element.classList.add('active');
            clearTimeout(timerRef);
            return setTimeout(() => element.classList.remove('active'), duration);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let animationFrameId;
        let glowPulse = 0;

        // Physics Constants
        let GRAVITY = 0.5;
        let DRAG_POWER = 0.15;
        let FRICTION = 0.98;
        let BOUNCE = 0.7;

        // Game Objects
        let ball = {
            x: 0, y: 0, r: 20,
            vx: 0, vy: 0,
            isDragging: false,
            isFlying: false,
            startX: 0, startY: 0,
            dragX: 0, dragY: 0,
            rotation: 0
        };

        let hoop = {
            x: 0, y: 0,
            w: 80,
            h: 10,
            scored: false
        };

        let particles = [];
        let clouds = [];
        let stars = [];

        function updateScoreDisplays() {
            document.getElementById('score').innerText = score;
            document.getElementById('finalScore').innerText = score;
        }

        // Resize Handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            ball.r = Math.min(width, height) * 0.04;
            hoop.w = ball.r * 2.8;

            if (!gameActive) {
                resetBall();
                randomizeHoop();
            }
        }
        window.addEventListener('resize', resize);

        /** 4. PARALLAX & VISUALS */
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2.1),
                    v: 0.2 + Math.random() * 0.3,
                    size: 30 + Math.random() * 50
                });
            }
        }

        function initStars() {
            stars = [];
            const count = Math.max(24, Math.floor(width / 28));
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.5),
                    r: Math.random() * 1.7 + 0.3,
                    alpha: Math.random() * 0.5 + 0.2,
                    pulse: Math.random() * Math.PI * 2
                });
            }
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#08111f');
            grad.addColorStop(0.5, '#10213a');
            grad.addColorStop(1, '#1a3455');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.fillStyle = 'rgba(255, 176, 66, 0.22)';
            ctx.beginPath();
            ctx.arc(width * 0.78, height * 0.22, Math.min(width, height) * 0.11, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            stars.forEach((star, index) => {
                const alpha = star.alpha + Math.sin(glowPulse * 0.03 + star.pulse + index * 0.05) * 0.12;
                ctx.globalAlpha = Math.max(0.08, alpha);
                ctx.fillStyle = '#dff8ff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            clouds.forEach(c => {
                c.x += c.v;
                if (c.x > width + 100) c.x = -100;

                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.2, c.size * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x - c.size * 0.7, c.y + c.size * 0.1, c.size * 0.55, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = '#04101d';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let i = 0; i <= width; i += 45) {
                const skyline = 92 + Math.sin(i * 0.011) * 44 + Math.cos(i * 0.045) * 18;
                ctx.lineTo(i, height - skyline);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            ctx.fillStyle = '#0a1a2f';
            for (let i = 0; i < width + 40; i += 44) {
                const towerHeight = 40 + Math.abs(Math.sin(i * 0.02)) * 80;
                const towerTop = height - towerHeight - 20;
                ctx.fillRect(i, towerTop, 28, towerHeight + 20);
                ctx.fillStyle = 'rgba(255, 214, 77, 0.14)';
                for (let j = towerTop + 8; j < height - 20; j += 12) {
                    ctx.fillRect(i + 6, j, 4, 4);
                    ctx.fillRect(i + 16, j + 2, 4, 4);
                }
                ctx.fillStyle = '#0a1a2f';
            }

            const floorGrad = ctx.createLinearGradient(0, height * 0.72, 0, height);
            floorGrad.addColorStop(0, 'rgba(5, 11, 20, 0)');
            floorGrad.addColorStop(1, 'rgba(3, 7, 14, 0.9)');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, height * 0.72, width, height * 0.28);

            ctx.strokeStyle = 'rgba(114, 220, 255, 0.18)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, height * 0.87);
            ctx.lineTo(width, height * 0.87);
            ctx.stroke();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        /** 5. GAME LOGIC */
        function resetBall() {
            ball.x = width * 0.2;
            ball.y = height * 0.7;
            ball.vx = 0;
            ball.vy = 0;
            ball.isFlying = false;
            ball.isDragging = false;
            ball.rotation = 0;
            hoop.scored = false;
        }

        function randomizeHoop() {
            const minX = width * 0.5;
            const maxX = width * 0.9;
            const minY = height * 0.2;
            const maxY = height * 0.6;

            hoop.x = minX + Math.random() * (maxX - minX);
            hoop.y = minY + Math.random() * (maxY - minY);
        }

        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rotation);

            const ballGrad = ctx.createRadialGradient(-ball.r * 0.3, -ball.r * 0.35, ball.r * 0.2, 0, 0, ball.r);
            ballGrad.addColorStop(0, '#ffd385');
            ballGrad.addColorStop(0.35, '#ffad49');
            ballGrad.addColorStop(0.72, '#ff7f1d');
            ballGrad.addColorStop(1, '#d95804');

            ctx.shadowColor = 'rgba(255, 145, 53, 0.4)';
            ctx.shadowBlur = hoop.scored ? 22 : 12;

            ctx.beginPath();
            ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = ballGrad;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.lineWidth = Math.max(2, ball.r * 0.1);
            ctx.strokeStyle = '#2a1305';

            ctx.beginPath();
            ctx.moveTo(0, -ball.r);
            ctx.lineTo(0, ball.r);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-ball.r, 0);
            ctx.lineTo(ball.r, 0);
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 0, ball.r, ball.r / 2, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-ball.r * 0.34, -ball.r * 0.34, ball.r * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.fill();

            if (!ball.isFlying && !ball.isDragging) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(114, 220, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.arc(0, 0, ball.r + 6 + Math.sin(glowPulse * 0.08) * 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawHoop() {
            const pulse = hoop.scored ? 1 : 0.6 + Math.sin(glowPulse * 0.09) * 0.08;

            ctx.save();

            ctx.strokeStyle = 'rgba(106, 224, 255, 0.22)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(hoop.x + hoop.w / 2 + 12, hoop.y - 82);
            ctx.lineTo(hoop.x + hoop.w / 2 + 12, hoop.y + 24);
            ctx.stroke();

            const boardGrad = ctx.createLinearGradient(hoop.x, hoop.y - 80, hoop.x, hoop.y + 20);
            boardGrad.addColorStop(0, 'rgba(242, 250, 255, 0.94)');
            boardGrad.addColorStop(1, 'rgba(168, 206, 232, 0.9)');
            ctx.fillStyle = boardGrad;
            ctx.fillRect(hoop.x + hoop.w / 2 + 6, hoop.y - 80, 14, 100);

            ctx.strokeStyle = 'rgba(114, 220, 255, 0.55)';
            ctx.lineWidth = 2;
            ctx.strokeRect(hoop.x + hoop.w / 2 + 6, hoop.y - 80, 14, 100);

            ctx.strokeStyle = 'rgba(255,255,255,0.52)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 4; i++) {
                const x = hoop.x - hoop.w / 2 + i * (hoop.w / 4);
                ctx.beginPath();
                ctx.moveTo(x, hoop.y + 2);
                ctx.lineTo(hoop.x - hoop.w / 2 + 10 + i * (hoop.w / 6), hoop.y + 38);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w / 2, hoop.y + 2);
            ctx.quadraticCurveTo(hoop.x, hoop.y + 46, hoop.x + hoop.w / 2, hoop.y + 2);
            ctx.stroke();

            ctx.shadowColor = 'rgba(255, 89, 89, 0.55)';
            ctx.shadowBlur = 14 * pulse;
            ctx.strokeStyle = '#ff5f5f';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w / 2, hoop.y);
            ctx.lineTo(hoop.x + hoop.w / 2, hoop.y);
            ctx.stroke();

            ctx.restore();
        }

        function drawTrajectory() {
            if (ball.isDragging) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(114, 220, 255, 0.7)';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);
                ctx.moveTo(ball.x, ball.y);

                let simX = ball.x;
                let simY = ball.y;
                let simVx = (ball.startX - ball.dragX) * DRAG_POWER;
                let simVy = (ball.startY - ball.dragY) * DRAG_POWER;

                for (let i = 0; i < 15; i++) {
                    simX += simVx;
                    simY += simVy;
                    simVy += GRAVITY;
                    ctx.lineTo(simX, simY);
                }

                ctx.stroke();
                ctx.setLineDash([]);

                ctx.beginPath();
                ctx.fillStyle = 'rgba(255, 212, 77, 0.85)';
                ctx.arc(ball.dragX, ball.dragY, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function checkCollision() {
            if (ball.y + ball.r > height) {
                ball.y = height - ball.r;
                ball.vy *= -BOUNCE;
                ball.vx *= FRICTION;

                if (Math.abs(ball.vy) < 2 && Math.abs(ball.vx) < 0.5) {
                    if (!hoop.scored) {
                        gameOver();
                    } else {
                        score++;
                        updateScoreDisplays();
                        randomizeHoop();
                        resetBall();
                    }
                }

                if (Math.abs(ball.vy) <= 5 && !hoop.scored) {
                    gameOver();
                }

                if (Math.abs(ball.vy) > 1.5) {
                    audio.playSFX('bounce', 110);
                }
            }

            if (ball.x - ball.r < 0 || ball.x + ball.r > width) {
                ball.vx *= -1;
                ball.x = ball.x < 0 ? ball.r : width - ball.r;
            }

            const rimY = hoop.y;
            const leftRimX = hoop.x - hoop.w / 2;
            const rightRimX = hoop.x + hoop.w / 2;
            const rimRadius = 5;

            function checkPointCollision(px, py) {
                const dx = ball.x - px;
                const dy = ball.y - py;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < ball.r + rimRadius) {
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const vDotN = ball.vx * nx + ball.vy * ny;
                    ball.vx = ball.vx - 2 * vDotN * nx;
                    ball.vy = ball.vy - 2 * vDotN * ny;

                    const overlap = (ball.r + rimRadius) - dist;
                    ball.x += nx * overlap;
                    ball.y += ny * overlap;

                    ball.vx *= 0.8;
                    ball.vy *= 0.8;

                    audio.playSFX('rim', 90);
                    createParticles(px, py, '#ff6464');
                }
            }

            checkPointCollision(leftRimX, rimY);
            checkPointCollision(rightRimX, rimY);

            if (!hoop.scored && ball.vy > 0) {
                if (ball.y > hoop.y && ball.y - ball.vy <= hoop.y) {
                    if (ball.x > leftRimX + ball.r / 2 && ball.x < rightRimX - ball.r / 2) {
                        hoop.scored = true;
                        audio.playSFX('score', 180);
                        audio.playSFX('swish', 180);
                        scoreGifTimer = showFeedbackGif(scoreGif, scoreGifTimer, 1250);
                        createParticles(ball.x, ball.y, '#ffd44d');
                        setTimeout(() => {
                            if (gameActive) {
                                score++;
                                updateScoreDisplays();
                                randomizeHoop();
                                resetBall();
                            }
                        }, 1000);
                    }
                }
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            glowPulse += 1;
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            if (ball.isFlying) {
                ball.vy += GRAVITY;
                ball.vx *= 0.995;
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.rotation += ball.vx * 0.05;
                checkCollision();
            }

            drawHoop();
            drawBall();
            drawTrajectory();

            updateParticles();
            drawParticles();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            cancelAnimationFrame(animationFrameId);
            audio.stopBGM();
            audio.playSFX('fail', 180);
            failGifTimer = showFeedbackGif(failGif, failGifTimer, 1800);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function initGame() {
            score = 0;
            updateScoreDisplays();
            resize();
            initClouds();
            initStars();
            resetBall();
            randomizeHoop();
        }

        /** 6. CONTROLS */
        function getPointerPos(e) {
            if (e.touches) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function handleStart(e) {
            if (!gameActive || ball.isFlying) return;
            const pos = getPointerPos(e);

            const dx = pos.x - ball.x;
            const dy = pos.y - ball.y;
            if (Math.sqrt(dx * dx + dy * dy) < ball.r * 3) {
                ball.isDragging = true;
                ball.startX = ball.x;
                ball.startY = ball.y;
                ball.dragX = pos.x;
                ball.dragY = pos.y;
            }
        }

        function handleMove(e) {
            if (!gameActive || !ball.isDragging) return;
            const pos = getPointerPos(e);
            ball.dragX = pos.x;
            ball.dragY = pos.y;

            const dx = ball.dragX - ball.startX;
            const dy = ball.dragY - ball.startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 200;
            if (dist > maxDist) {
                const ratio = maxDist / dist;
                ball.dragX = ball.startX + dx * ratio;
                ball.dragY = ball.startY + dy * ratio;
            }
        }

        function handleEnd() {
            if (!gameActive || !ball.isDragging) return;

            ball.isDragging = false;
            ball.isFlying = true;

            ball.vx = (ball.startX - ball.dragX) * DRAG_POWER;
            ball.vy = (ball.startY - ball.dragY) * DRAG_POWER;
            audio.playSFX('shoot', 120);
        }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            handleStart(e);
        }, { passive: false });
        window.addEventListener('touchmove', (e) => {
            if (!gameActive || !ball.isDragging) return;
            e.preventDefault();
            handleMove(e);
        }, { passive: false });
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchcancel', handleEnd);

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 120);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            failGif.classList.remove('active');
            scoreGif.classList.remove('active');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            failGif.classList.remove('active');
            scoreGif.classList.remove('active');
            audio.playSFX('ui', 100);
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        resize();
        initClouds();
        initStars();
    });
    </script>
</body>
</html>
