<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Boggo Batting Drill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Russo One', sans-serif;
            --font-ui: 'Press Start 2P', monospace;
            --font-accent: 'Bangers', cursive;
            --sky-top: #102652;
            --sky-bottom: #3c8de0;
            --panel-bg: rgba(8, 18, 44, 0.76);
            --panel-border: rgba(123, 224, 255, 0.65);
            --panel-glow: rgba(31, 193, 255, 0.35);
            --lime: #8bff7a;
            --gold: #ffd85b;
            --danger: #ff5879;
            --chalk: #f4fbff;
            --ink: #071321;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.16), transparent 25%),
                linear-gradient(180deg, var(--sky-top) 0%, #183b79 42%, var(--sky-bottom) 100%);
            font-family: var(--font-ui);
        }
        body { color: var(--chalk); }
        canvas { display: block; touch-action: none; }
        .glass {
            background: linear-gradient(180deg, rgba(13, 29, 63, 0.92), rgba(10, 20, 44, 0.88));
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 14px 32px rgba(0, 0, 0, 0.3),
                0 0 24px var(--panel-glow),
                inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .text-shadow {
            text-shadow:
                0 3px 0 rgba(6, 17, 38, 0.95),
                0 0 12px rgba(80, 219, 255, 0.25);
        }
        .hidden { display: none !important; }
        #ui-layer { user-select: none; -webkit-user-select: none; }
        .display-font { font-family: var(--font-display); }
        .accent-font { font-family: var(--font-accent); letter-spacing: 0.06em; }
        .hud-chip {
            min-width: 132px;
            padding: 0.45rem 0.8rem 0.5rem;
            border-radius: 0.95rem;
            border: 2px solid rgba(255,255,255,0.18);
            background: linear-gradient(180deg, rgba(7, 18, 41, 0.86), rgba(10, 32, 56, 0.86));
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }
        .hud-label {
            display: block;
            font-size: 0.55rem;
            line-height: 1.2;
            letter-spacing: 0.16em;
            color: rgba(226, 246, 255, 0.8);
        }
        .hud-value {
            display: block;
            font-family: var(--font-display);
            font-size: 1.2rem;
            line-height: 1.15;
        }
        .arcade-btn {
            font-family: var(--font-accent);
            letter-spacing: 0.08em;
            box-shadow: 0 10px 0 rgba(9, 16, 32, 0.45), 0 0 22px rgba(255,255,255,0.12);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            touch-action: manipulation;
        }
        .arcade-btn:hover { filter: brightness(1.08); }
        .arcade-btn:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 6px 0 rgba(9, 16, 32, 0.4), 0 0 14px rgba(255,255,255,0.12);
        }
        .sparkle {
            position: absolute;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.75);
            box-shadow: 0 0 10px rgba(255,255,255,0.65);
            animation: drift 3.4s ease-in-out infinite;
        }
        .sparkle:nth-child(1) { top: 12%; left: 8%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 18%; right: 12%; animation-delay: 0.8s; }
        .sparkle:nth-child(3) { bottom: 24%; left: 14%; animation-delay: 1.5s; }
        .sparkle:nth-child(4) { bottom: 16%; right: 10%; animation-delay: 2.2s; }
        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 45;
            overflow: hidden;
        }
        .reaction-badge {
            position: absolute;
            right: 1rem;
            width: min(26vw, 132px);
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.45);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            background: rgba(7, 19, 33, 0.4);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .reaction-badge.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        #hit-gif {
            top: 1rem;
        }
        #miss-gif {
            bottom: 1rem;
        }
        .feedback-banner {
            position: absolute;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
            transform: translateX(-50%) translateY(14px);
            padding: 0.7rem 1rem;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(7, 19, 33, 0.82);
            color: white;
            font-family: var(--font-accent);
            font-size: clamp(1rem, 2.8vw, 1.5rem);
            letter-spacing: 0.08em;
            box-shadow: 0 12px 28px rgba(0,0,0,0.28);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            text-align: center;
            max-width: min(84vw, 24rem);
        }
        .feedback-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @keyframes drift {
            0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.25; }
            50% { transform: translateY(-10px) scale(1.2); opacity: 0.9; }
        }
        @media (max-width: 640px) {
            #hud { top: 0.75rem; left: 0.75rem; gap: 0.45rem; }
            .hud-chip { min-width: 104px; padding: 0.38rem 0.58rem 0.44rem; }
            .hud-label { font-size: 0.48rem; }
            .hud-value { font-size: 1rem; }
            #start-screen, #game-over-screen {
                width: min(90vw, 24rem);
                padding: 1.25rem;
                border-radius: 1.2rem;
            }
            .reaction-badge {
                width: min(30vw, 96px);
                right: 0.5rem;
                border-radius: 0.75rem;
            }
            #hit-gif { top: 0.75rem; }
            #miss-gif { bottom: 4.75rem; }
            .feedback-banner {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
                font-size: 0.95rem;
                padding: 0.62rem 0.9rem;
            }
        }
    </style>
</head>
<body>

            <button id="start-btn" class="arcade-btn bg-[#ff4f6d] hover:bg-[#ff6e84] text-white text-xl sm:text-2xl px-10 sm:px-12 py-3 sm:py-4 rounded-full border-4 border-white">

            <div class="text-white text-base sm:text-xl mb-6">Total Runs: <span id="finalScore" class="text-yellow-300 text-3xl sm:text-4xl display-font">0</span></div>
            <button id="restart-btn" class="arcade-btn bg-[#59e58b] hover:bg-[#73f2a0] text-slate-950 text-xl sm:text-2xl px-10 py-3 rounded-full border-4 border-white">
                SWING AGAIN

<script>
/**
 * §2 Technical Contract Implementation
 */

// --- Config System ---
window.gameConfigDefs = {
    "ballSpeed": { "type": "number", "label": "Ball Speed", "value": 10, "min": 5, "max": 25 },
    "gravity": { "type": "number", "label": "Gravity", "value": 0.5, "min": 0.1, "max": 1.0 },
    "hitWindow": { "type": "number", "label": "Hit Window (px)", "value": 100, "min": 50, "max": 200 }
};

window.gameConfig = {};
for (let key in window.gameConfigDefs) {
    window.gameConfig[key] = window.gameConfigDefs[key].value;
}

window.updateGameConfig = function(key, val) {
    if (window.gameConfigDefs[key]) {
        const def = window.gameConfigDefs[key];
        if (def.type === 'number') val = parseFloat(val);
        window.gameConfig[key] = val;
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.unlocked = false;
        this.failedIds = new Set();
        this.lastPlayedAt = {};
        this.loopElement = document.getElementById('bgm_main');
        this.activeLoop = null;
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
    }

    ensureContext() {
        if (this.ctx) return this.ctx;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        try {
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.sfxGain = this.ctx.createGain();
            this.bgmGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.sfxGain.connect(this.masterGain);
            this.bgmGain.connect(this.masterGain);
            this.masterGain.gain.value = 0.92;
            this.sfxGain.gain.value = 0.72;
            this.bgmGain.gain.value = 0.42;
        } catch (e) {
            console.warn('Audio context unavailable', e);
            this.ctx = null;
        }
        return this.ctx;
    }

    async loadSound(id, src) {
        const ctx = this.ensureContext();
        if (!ctx || !src) return;
        try {
            const srcUrl = new URL(src, window.location.href);
            if (srcUrl.origin !== window.location.origin) {
                this.failedIds.add(id);
                return;
            }
            const res = await fetch(srcUrl.href);
            const arrayBuffer = await res.arrayBuffer();
            const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
            this.buffers[id] = audioBuffer;
        } catch (e) {
            this.failedIds.add(id);
            console.warn(`Audio load failed for ${id}.`, e);
        }
    }

    async unlock() {
        if (this.unlocked) return true;
        const ctx = this.ensureContext();
        try {
            if (ctx && ctx.state !== 'running') {
                await ctx.resume();
            }
            this.unlocked = true;
            return true;
        } catch (e) {
            console.warn('Audio unlock failed', e);
            return false;
        }
    }

    startLoop() {
        if (!this.unlocked || !this.loopElement) return;
        this.stopLoop();
        try {
            this.loopElement.volume = 0.2;
            this.loopElement.currentTime = 0;
            this.loopElement.play().then(() => {
                this.activeLoop = this.loopElement;
            }).catch(() => {});
        } catch (e) {
            console.warn('Loop start failed', e);
        }
    }

    stopLoop() {
        if (this.activeLoop) {
            try {
                this.activeLoop.pause();
                this.activeLoop.currentTime = 0;
            } catch (e) {
                console.warn('Loop stop failed', e);
            }
        }
        this.activeLoop = null;
    }

    setLoopMuted(muted) {
        if (!this.loopElement) return;
        this.loopElement.muted = muted;
    }

    playSfx(id, options = {}) {
        if (!this.unlocked) return;
        const now = performance.now();
        const cooldown = options.cooldown ?? 90;
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        const ctx = this.ensureContext();
        const buffer = ctx ? this.buffers[id] : null;
        if (ctx && buffer && this.sfxGain) {
            try {
                const source = ctx.createBufferSource();
                const gain = ctx.createGain();
                gain.gain.value = options.volume ?? 1;
                source.buffer = buffer;
                source.connect(gain);
                gain.connect(this.sfxGain);
                source.start(0);
                return;
            } catch (e) {
                console.warn('Buffer playback failed, using synth fallback', e);
            }
        }

        this.playElementFallback(id, options.volume);
        if (!this.failedIds.has(id)) {
            this.synthesize(id);
        }
    }

    playElementFallback(id, volume = 1) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const clone = el.cloneNode();
            clone.volume = Math.min(1, (el.volume || 1) * volume);
            clone.play().catch(() => {});
        } catch (e) {
            console.warn('Element fallback failed', e);
        }
    }

    synthesize(id) {
        const ctx = this.ensureContext();
        if (!ctx || !this.sfxGain) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(this.sfxGain);

        const t = ctx.currentTime;
        if (id === 'sfx_hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.exponentialRampToValueAtTime(90, t + 0.08);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        } else if (id === 'sfx_cheer') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.linearRampToValueAtTime(780, t + 0.16);
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.start(t);
            osc.stop(t + 0.18);
        } else if (id === 'sfx_ui') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, t);
            osc.frequency.linearRampToValueAtTime(620, t + 0.08);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(240, t);
            osc.frequency.linearRampToValueAtTime(120, t + 0.18);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            osc.start(t);
            osc.stop(t + 0.2);
        }
    }
}

// --- Game Engine ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();
    const scoreEl = document.getElementById('score');
    const strikesEl = document.getElementById('strikes');
    const finalScoreEl = document.getElementById('finalScore');
    const hitGif = document.getElementById('hit-gif');
    const missGif = document.getElementById('miss-gif');
    const feedbackBanner = document.getElementById('feedback-banner');

    const assets = {
        player: document.getElementById('asset_player'),
    };

    ['sfx_hit', 'sfx_miss', 'sfx_cheer', 'sfx_ui'].forEach(id => {
        const el = document.getElementById(id);
        if (el && el.src) audio.loadSound(id, el.src);
    });

    let state = 'MENU';
    let lastTime = 0;
    let score = 0;
    let strikes = 0;
    let shake = 0;
    let hitPause = 0;
    let hitFeedbackTimer = 0;
    let missFeedbackTimer = 0;
    let bannerTimer = 0;

    let player = {
        x: 0, y: 0,
        baseY: 0,
        width: 100, height: 100,
        punching: false,
        punchTimer: 0,
        punchDuration: 0.2
    };

    let balls = [];
    let particles = [];
    let texts = [];
    let ballTimer = 0;
    let ballInterval = 2.5;
    const palette = {
        skyTop: '#0e244b',
        skyBottom: '#53a9ef',
        sun: '#fff2a8',
        cloud: 'rgba(243, 251, 255, 0.72)',
        grassA: '#45d66f',
        grassB: '#2ca85f',
        dirt: '#bd6b27',
        dirtShade: '#8e4718',
        chalk: '#f6fdff',
        playerGlow: '#5ef7cb',
        playerShadow: '#117d6d',
        glove: '#ff5f7f',
        gloveTrim: '#fff2b0',
        ballCore: '#ffffff',
        ballShadow: '#d2ecff'
    };

    function showGif(kind, message) {
        if (kind === 'hit') {
            hitFeedbackTimer = 1.1;
            hitGif.classList.add('show');
        } else if (kind === 'miss') {
            missFeedbackTimer = 1.25;
            missGif.classList.add('show');
        }
        if (message) {
            feedbackBanner.textContent = message;
            bannerTimer = 1.1;
            feedbackBanner.classList.add('show');
        }
    }

    function updateFeedback(dt) {
        if (hitFeedbackTimer > 0) {
            hitFeedbackTimer -= dt;
            if (hitFeedbackTimer <= 0) hitGif.classList.remove('show');
        }
        if (missFeedbackTimer > 0) {
            missFeedbackTimer -= dt;
            if (missFeedbackTimer <= 0) missGif.classList.remove('show');
        }
        if (bannerTimer > 0) {
            bannerTimer -= dt;
            if (bannerTimer <= 0) feedbackBanner.classList.remove('show');
        }
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        player.baseY = window.innerHeight * 0.75;
        player.x = window.innerWidth * 0.2;
        player.y = player.baseY;
    }
    window.addEventListener('resize', resize);
    resize();

    function handleInput(e) {
        if (e.type !== 'keydown') e.preventDefault();

        if (state === 'MENU') return;
        if (state === 'GAMEOVER') return;

        if (!player.punching) {
            player.punching = true;
            player.punchTimer = player.punchDuration;
            checkHit();
        }
    }

    async function unlockAudioAndMaybeLoop() {
        await audio.unlock();
        if (state === 'PLAYING') {
            audio.startLoop();
        }
    }

    canvas.addEventListener('pointerdown', async (e) => {
        await unlockAudioAndMaybeLoop();
        handleInput(e);
    }, { passive: false });

    window.addEventListener('keydown', async (e) => {
        if (e.code === 'Space') {
            await unlockAudioAndMaybeLoop();
            handleInput(e);
        }
    });

    function spawnBall() {
        balls.push({
            x: window.innerWidth + 50,
            y: player.baseY - 40,
            vx: -window.gameConfig.ballSpeed * (1 + score * 0.05),
            vy: 0,
            radius: 15,
            state: 'PITCHED',
            rotation: 0
        });
    }

    function spawnParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1.0,
                color: color,
                size: Math.random() * 8 + 2
            });
        }
    }

    function spawnText(str, x, y, color) {
        texts.push({
            str, x, y, color,
            life: 1.0,
            vy: -2
        });
    }

    function checkHit() {
        let hit = false;
        const hitZone = window.gameConfig.hitWindow;

        for (let b of balls) {
            if (b.state !== 'PITCHED') continue;

            const dist = Math.abs(b.x - (player.x + 50));

            if (dist < hitZone) {
                hit = true;
                b.state = 'HIT';
                b.vx = 25;
                b.vy = -25;

                shake = 20;
                hitPause = 0.1;
                spawnParticles(b.x, b.y, 20, '#ffffff');
                spawnParticles(b.x, b.y, 10, '#ffff00');

                let points = 1;
                let msg = "CONTACT!";
                let col = "#fff";
                let bannerMsg = "Clean contact!";

                if (dist < hitZone * 0.3) {
                    points = 3;
                    msg = "PERFECT DRIVE!";
                    col = "#ffd700";
                    bannerMsg = "Perfect drive! Crowd goes wild!";
                    audio.playSfx('sfx_cheer', { cooldown: 150, volume: 0.95 });
                    spawnParticles(b.x, b.y, 30, '#ff0055');
                } else {
                    audio.playSfx('sfx_hit', { cooldown: 80, volume: 0.9 });
                }

                showGif('hit', bannerMsg);
                score += points;
                scoreEl.innerText = String(score);
                spawnText(msg, player.x, player.y - 100, col);
                break;
            }
        }

        if (!hit) {
            showGif('miss', "Swing and a miss!");
            audio.playSfx('sfx_miss', { cooldown: 120, volume: 0.55 });
        }
    }

    function gameOver() {
        state = 'GAMEOVER';
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        finalScoreEl.innerText = score;
        showGif('miss', "Drill over! Reset and mash another homer.");
        audio.playSfx('sfx_miss', { cooldown: 150, volume: 0.9 });
        audio.stopLoop();
    }

    function resetGame() {
        score = 0;
        strikes = 0;
        balls = [];
        particles = [];
        texts = [];
        ballTimer = 0;
        hitFeedbackTimer = 0;
        missFeedbackTimer = 0;
        bannerTimer = 0;
        hitGif.classList.remove('show');
        missGif.classList.remove('show');
        feedbackBanner.classList.remove('show');
        scoreEl.innerText = '0';
        strikesEl.innerText = '0/3';
        state = 'PLAYING';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        audio.startLoop();
        showGif('hit', "Boggo steps up to the plate!");
    }

    function update(dt) {
        updateFeedback(dt);

        if (hitPause > 0) {
            hitPause -= dt;
            return;
        }

        if (state === 'PLAYING') {
            ballTimer -= dt;
            if (ballTimer <= 0) {
                spawnBall();
                ballTimer = ballInterval - Math.min(1.5, score * 0.05);
            }

            if (player.punching) {
                player.punchTimer -= dt;
                if (player.punchTimer <= 0) player.punching = false;
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                const timeScale = dt * 60;
                b.x += b.vx * timeScale;
                b.y += b.vy * timeScale;
                b.rotation += 0.2 * timeScale;

                if (b.state === 'HIT') {
                    b.vy += window.gameConfig.gravity * timeScale;
                }

                if (b.state === 'PITCHED' && b.x < -50) {
                    b.state = 'DEAD';
                    strikes++;
                    strikesEl.innerText = strikes + "/3";
                    audio.playSfx('sfx_miss', { cooldown: 120, volume: 0.75 });
                    showGif('miss', strikes >= 2 ? "Pressure's on! Don't whiff the next one." : "Missed pitch! Stay sharp.");
                    spawnText("MISS!", 100, window.innerHeight / 2, "#ff0000");
                    shake = 10;
                    if (strikes >= 3) gameOver();
                }

                if (b.y > window.innerHeight + 100 || b.x > window.innerWidth + 200 || b.state === 'DEAD') {
                    balls.splice(i, 1);
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life -= dt * 2;
            p.x += p.vx * (dt * 60);
            p.y += p.vy * (dt * 60);
            p.vy += 0.5 * (dt * 60);
            if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i];
            t.life -= dt;
            t.y += t.vy * (dt * 60);
            if (t.life <= 0) texts.splice(i, 1);
        }

        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    function draw() {
        const skyGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        skyGradient.addColorStop(0, palette.skyTop);
        skyGradient.addColorStop(0.55, '#2058a5');
        skyGradient.addColorStop(1, palette.skyBottom);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const sunGlow = ctx.createRadialGradient(window.innerWidth * 0.82, window.innerHeight * 0.18, 18, window.innerWidth * 0.82, window.innerHeight * 0.18, 84);
        sunGlow.addColorStop(0, 'rgba(255, 244, 187, 0.95)');
        sunGlow.addColorStop(0.45, 'rgba(255, 218, 117, 0.5)');
        sunGlow.addColorStop(1, 'rgba(255, 218, 117, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(window.innerWidth * 0.82, window.innerHeight * 0.18, 84, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }

        ctx.fillStyle = palette.cloud;
        ctx.beginPath();
        ctx.arc(window.innerWidth * 0.18, window.innerHeight * 0.2, 54, 0, Math.PI * 2);
        ctx.arc(window.innerWidth * 0.24, window.innerHeight * 0.18, 68, 0, Math.PI * 2);
        ctx.arc(window.innerWidth * 0.29, window.innerHeight * 0.21, 42, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(window.innerWidth * 0.68, window.innerHeight * 0.25, 72, 0, Math.PI * 2);
        ctx.arc(window.innerWidth * 0.76, window.innerHeight * 0.22, 54, 0, Math.PI * 2);
        ctx.arc(window.innerWidth * 0.82, window.innerHeight * 0.26, 34, 0, Math.PI * 2);
        ctx.fill();

        const horizon = player.baseY - 20;
        ctx.fillStyle = 'rgba(7, 18, 41, 0.32)';
        ctx.fillRect(0, horizon - 52, window.innerWidth, 16);
        ctx.fillStyle = 'rgba(255, 216, 91, 0.4)';
        for (let i = 0; i < window.innerWidth; i += 34) {
            ctx.fillRect(i, horizon - 48, 16, 8);
        }

        const grassGradient = ctx.createLinearGradient(0, horizon, 0, window.innerHeight);
        grassGradient.addColorStop(0, palette.grassA);
        grassGradient.addColorStop(1, palette.grassB);
        ctx.fillStyle = grassGradient;
        ctx.fillRect(0, horizon, window.innerWidth, window.innerHeight - horizon);

        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = '#dcffb2';
        for (let i = -window.innerHeight; i < window.innerWidth; i += 60) {
            ctx.beginPath();
            ctx.moveTo(i, horizon);
            ctx.lineTo(i + 35, horizon);
            ctx.lineTo(i + 155, window.innerHeight);
            ctx.lineTo(i + 120, window.innerHeight);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();

        const dirtGradient = ctx.createLinearGradient(0, horizon, 0, window.innerHeight);
        dirtGradient.addColorStop(0, palette.dirt);
        dirtGradient.addColorStop(1, palette.dirtShade);
        ctx.fillStyle = dirtGradient;
        ctx.beginPath();
        ctx.moveTo(0, window.innerHeight);
        ctx.lineTo(window.innerWidth * 0.4, horizon);
        ctx.lineTo(window.innerWidth * 0.6, horizon);
        ctx.lineTo(window.innerWidth, window.innerHeight);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(player.x + 50, player.baseY + 58);
        ctx.lineTo(window.innerWidth * 0.42, horizon + 8);
        ctx.moveTo(player.x + 50, player.baseY + 58);
        ctx.lineTo(window.innerWidth * 0.58, horizon + 8);
        ctx.stroke();

        ctx.fillStyle = palette.chalk;
        const plateX = player.x + 30;
        const plateY = player.baseY + 60;
        ctx.beginPath();
        ctx.moveTo(plateX, plateY);
        ctx.lineTo(plateX + 40, plateY);
        ctx.lineTo(plateX + 20, plateY + 20);
        ctx.fill();

        ctx.save();
        let px = player.x;
        let py = player.y;

        if (player.punching) {
            px += 30;
            ctx.translate(px + player.width / 2, py + player.height);
            ctx.scale(1.2, 0.8);
            ctx.translate(-(px + player.width / 2), -(py + player.height));
        }

        ctx.fillStyle = 'rgba(0,0,0,0.26)';
        ctx.beginPath();
        ctx.ellipse(px + player.width / 2, py + player.height - 5, 40, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        const playerGlow = ctx.createRadialGradient(px + player.width / 2, py + player.height / 2, 12, px + player.width / 2, py + player.height / 2, 60);
        playerGlow.addColorStop(0, 'rgba(94, 247, 203, 0.18)');
        playerGlow.addColorStop(1, 'rgba(94, 247, 203, 0)');
        ctx.fillStyle = playerGlow;
        ctx.beginPath();
        ctx.arc(px + player.width / 2, py + player.height / 2, 60, 0, Math.PI * 2);
        ctx.fill();

        if (assets.player && assets.player.complete && assets.player.naturalWidth > 0) {
            ctx.save();
            ctx.shadowColor = 'rgba(94, 247, 203, 0.45)';
            ctx.shadowBlur = 20;
            ctx.drawImage(assets.player, px, py, player.width, player.height);
            ctx.restore();

            const eyeY = py + player.height * 0.4;
            const eyeOffset = player.width * 0.18;
            ctx.fillStyle = '#07263a';
            ctx.beginPath();
            ctx.arc(px + player.width / 2 - eyeOffset, eyeY, 4, 0, Math.PI * 2);
            ctx.arc(px + player.width / 2 + eyeOffset, eyeY, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#0b3e45';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(px + player.width / 2, py + player.height * 0.56, 16, 0.15, Math.PI - 0.15);
            ctx.stroke();

            if (!player.punching) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(px + player.width * 0.34, py + player.height * 0.26, 9, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            ctx.fillStyle = palette.playerGlow;
            ctx.beginPath();
            ctx.arc(px + player.width / 2, py + player.height / 2, 40, 0, Math.PI * 2);
            ctx.fill();
        }

        if (player.punching) {
            ctx.fillStyle = palette.glove;
            ctx.beginPath();
            ctx.arc(px + player.width + 10, py + player.height / 2, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = palette.gloveTrim;
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.beginPath();
            ctx.moveTo(px + player.width / 2, py + player.height / 2);
            ctx.lineTo(px + player.width + 20, py + player.height / 2);
            ctx.lineWidth = 10;
            ctx.stroke();
        }

        ctx.restore();

        balls.forEach(b => {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rotation);

            const ballGradient = ctx.createRadialGradient(-4, -5, 2, 0, 0, b.radius + 2);
            ballGradient.addColorStop(0, palette.ballCore);
            ballGradient.addColorStop(1, palette.ballShadow);
            ctx.fillStyle = ballGradient;
            ctx.beginPath();
            ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff4d61';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, b.radius - 2, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-10, -5);
            ctx.quadraticCurveTo(0, 0, 10, -5);
            ctx.moveTo(-10, 5);
            ctx.quadraticCurveTo(0, 0, 10, 5);
            ctx.stroke();

            ctx.restore();
        });

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            if (p.color === '#ffff00') {
                ctx.rect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            } else {
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        ctx.textAlign = 'center';
        texts.forEach(t => {
            ctx.fillStyle = t.color;
            ctx.font = `700 26px ${getComputedStyle(document.documentElement).getPropertyValue('--font-display').trim()}`;
            ctx.strokeStyle = '#071321';
            ctx.lineWidth = 4;
            ctx.strokeText(t.str, t.x, t.y);
            ctx.fillText(t.str, t.x, t.y);
        });

        ctx.restore();
    }

    function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(loop);
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
        await audio.unlock();
        audio.playSfx('sfx_ui', { cooldown: 100, volume: 0.85 });
        resetGame();
    });

    document.getElementById('restart-btn').addEventListener('click', async () => {
        await audio.unlock();
        audio.playSfx('sfx_ui', { cooldown: 100, volume: 0.85 });
        resetGame();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.stopLoop();
        } else if (state === 'PLAYING' && audio.unlocked) {
            audio.startLoop();
        }
    });

    requestAnimationFrame(loop);
});
</script>
