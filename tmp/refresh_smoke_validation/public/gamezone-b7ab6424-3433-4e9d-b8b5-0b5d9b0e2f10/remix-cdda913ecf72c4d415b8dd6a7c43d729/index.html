<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Ascent</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #040814;
        --bg-bottom: #0d1430;
        --panel: rgba(9, 16, 40, 0.78);
        --panel-strong: rgba(10, 19, 48, 0.9);
        --line: rgba(119, 231, 255, 0.28);
        --glow: rgba(48, 212, 255, 0.28);
        --glow-strong: rgba(124, 92, 255, 0.45);
        --text: #f4fbff;
        --muted: #9dd8ff;
        --accent: #6ef2ff;
        --accent-2: #8a6dff;
        --hazard: #ff5d8f;
        --platform: #49f2bf;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(96, 102, 255, 0.2), transparent 32%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text);
    }

    body::before,
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            radial-gradient(circle at 20% 18%, rgba(110, 242, 255, 0.16), transparent 18%),
            radial-gradient(circle at 78% 14%, rgba(138, 109, 255, 0.16), transparent 22%),
            radial-gradient(circle at 50% 82%, rgba(73, 242, 191, 0.12), transparent 24%);
        opacity: 0.95;
    }

    body::after {
        background:
            repeating-linear-gradient(
                90deg,
                transparent 0 48px,
                rgba(255, 255, 255, 0.035) 48px 49px
            );
        opacity: 0.3;
        mix-blend-mode: screen;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .glass {
        background:
            linear-gradient(180deg, rgba(12, 22, 52, 0.88), rgba(7, 14, 34, 0.78));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.04) inset,
            0 0 24px var(--glow),
            0 18px 36px rgba(0, 0, 0, 0.3);
    }

    .hidden { display: none !important; }
    #ui-layer { pointer-events: none; position: relative; z-index: 1; }
    #ui-layer > * { pointer-events: auto; }

    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
        40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 0 18px rgba(110, 242, 255, 0.2); }
        50% { box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 0 26px rgba(138, 109, 255, 0.34); }
    }

    @keyframes beaconFloat {
        0%, 100% { transform: translateY(0); opacity: 0.55; }
        50% { transform: translateY(-5px); opacity: 1; }
    }

    .neon-text {
        text-shadow:
            0 0 8px rgba(110, 242, 255, 0.35),
            0 0 18px rgba(138, 109, 255, 0.22);
    }

    .brand-kicker,
    .brand-title,
    .signal-title,
    .restart-label {
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
    }

    .hud-stack {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
    }

    .hud-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        width: fit-content;
        padding: 0.35rem 0.7rem;
        margin-bottom: 0.55rem;
        border-radius: 999px;
        background: rgba(10, 20, 46, 0.76);
        border: 1px solid rgba(110, 242, 255, 0.24);
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        animation: pulseGlow 2.2s ease-in-out infinite;
    }

    .hud-chip::before {
        content: '';
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), #ffffff);
        box-shadow: 0 0 10px rgba(110, 242, 255, 0.8);
        animation: beaconFloat 1.6s ease-in-out infinite;
    }

    .brand-kicker {
        color: #a5deff;
        font-size: 0.9rem;
        font-weight: 400;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0.95;
    }

    .brand-title {
        color: var(--accent);
        font-size: clamp(1.15rem, 3vw, 1.5rem);
        letter-spacing: 0.22em;
        text-transform: uppercase;
    }

    #score-display {
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        font-size: clamp(2.25rem, 7vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: 0.05em;
    }

    .feedback-gif {
        position: absolute;
        right: clamp(0.75rem, 3vw, 1.4rem);
        width: clamp(4.25rem, 18vw, 7rem);
        opacity: 0;
        transform: translateY(10px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
        z-index: 55;
        filter: drop-shadow(0 0 14px rgba(110, 242, 255, 0.35));
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(7, 14, 34, 0.42);
    }

    .feedback-gif.active {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }

    #jump-gif {
        top: clamp(5.5rem, 16vw, 7.75rem);
    }

    #gameover-gif {
        bottom: clamp(6.25rem, 16vw, 8.5rem);
        width: clamp(4.75rem, 20vw, 7.5rem);
    }

    .info-panel {
        max-width: min(17rem, 48vw);
        border-radius: 1.1rem;
        padding: 0.9rem 1rem 0.85rem;
    }

    .info-title {
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .info-subtitle {
        margin-top: 0.35rem;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.2;
    }

    .game-over-screen {
        background:
            linear-gradient(180deg, rgba(2, 5, 18, 0.5), rgba(2, 5, 18, 0.74)),
            radial-gradient(circle at center, rgba(138, 109, 255, 0.12), transparent 45%);
    }

    .game-over-panel {
        max-width: min(22rem, calc(100vw - 2rem));
        width: 100%;
        padding: 1.4rem;
        border-radius: 1.4rem;
        border-top: 4px solid var(--accent);
        text-align: center;
    }

    .panel-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.3rem 0.7rem;
        margin-bottom: 0.8rem;
        border-radius: 999px;
        background: rgba(255, 93, 143, 0.12);
        border: 1px solid rgba(255, 93, 143, 0.25);
        color: #ff9abb;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .panel-eyebrow::before {
        content: '';
        width: 0.48rem;
        height: 0.48rem;
        border-radius: 999px;
        background: var(--hazard);
        box-shadow: 0 0 10px rgba(255, 93, 143, 0.8);
    }

    .signal-title {
        margin: 0 0 0.35rem;
        font-size: clamp(2.1rem, 9vw, 3rem);
        letter-spacing: 0.14em;
        color: var(--text);
    }

    .final-score-line {
        margin: 0 0 1.1rem;
        color: var(--muted);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .restart-btn {
        width: 100%;
        border: 0;
        border-radius: 1rem;
        padding: 1rem 1rem 0.95rem;
        background:
            linear-gradient(135deg, rgba(19, 146, 255, 0.95), rgba(138, 109, 255, 0.95));
        color: white;
        box-shadow:
            0 0 18px rgba(92, 187, 255, 0.28),
            0 12px 24px rgba(47, 83, 180, 0.35);
        transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
        cursor: pointer;
    }

    .restart-btn:hover { filter: brightness(1.08); }
    .restart-btn:active { transform: scale(0.97); }
    .restart-label {
        display: block;
        font-size: clamp(1.2rem, 5vw, 1.7rem);
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }
    .restart-sub {
        display: block;
        margin-top: 0.12rem;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(235, 248, 255, 0.9);
    }

    @media (max-width: 640px) {
        #ui-layer { padding: 1rem; }
        #hud { gap: 0.75rem; }
        .hud-chip { margin-bottom: 0.45rem; padding: 0.3rem 0.58rem; font-size: 0.62rem; }
        .brand-kicker { font-size: 0.72rem; letter-spacing: 0.2em; }
        .brand-title { font-size: 0.95rem; letter-spacing: 0.15em; }
        #score-display { font-size: clamp(2rem, 14vw, 2.8rem); }
        .info-panel {
            max-width: min(12rem, 47vw);
            padding: 0.72rem 0.8rem 0.7rem;
            border-radius: 0.95rem;
        }
        .info-title { font-size: 0.74rem; letter-spacing: 0.14em; }
        .info-subtitle { font-size: 0.67rem; letter-spacing: 0.06em; }
        .game-over-panel { padding: 1.15rem; }
        .signal-title { font-size: clamp(1.7rem, 10vw, 2.4rem); }
        .final-score-line { font-size: 1rem; }
        .feedback-gif {
            right: 0.7rem;
            width: clamp(3.8rem, 20vw, 5.6rem);
        }
        #jump-gif { top: 5.2rem; }
        #gameover-gif { bottom: 6.2rem; }
    }
</style>
</head>
<body>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 16, "min": 10, "max": 25 },

    "heroColor": { "type": "color", "label": "Hero Color", "value": "#3B82F6" }
}
 </script>
 
 <!-- Assets -->
 <!-- [agent-note][stage4] repaired: mobile-input-scope | element: #game-container | action: kept gesture prevention on gameplay surface and preserved native button taps -->

<audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop preload="auto"></audio>
<audio id="sfx_jump" data-editable="audio" data-label="SFX Jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
<audio id="sfx_land" data-editable="audio" data-label="SFX Land" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>
<audio id="sfx_score" data-editable="audio" data-label="SFX Score" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>
<audio id="sfx_die" data-editable="audio" data-label="SFX Die" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>

<!-- Game Container -->
 <div id="game-container" class="relative w-full h-full select-none bg-slate-900" style="touch-action:none;">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-6">

        <div id="hud" class="flex justify-between items-start w-full gap-4">

<script>
/**
 * §0 System Constants & State
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;
const ENABLE_ANIMATIONS = true;

// Config
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = {};
Object.keys(gameConfigDefs).forEach(k => gameConfig[k] = gameConfigDefs[k].value);
window.gameConfigDefs = gameConfigDefs;
window.gameConfig = gameConfig;
window.updateGameConfig = (k, v) => { 
    if(gameConfig[k] !== undefined) gameConfig[k] = v; 
};

// State
let gameState = 'BOOT'; 
let lastTime = 0;
let score = 0;
let maxScore = 0;
let cameraY = 0;

// Entities
let hero = null;
let platforms = [];
let particles = [];
let inputX = 0; 
let platformPool = []; // Object pooling for performance

// Audio Context
let audioCtx = null;
let audioUnlocked = false;
let lastJumpSfxAt = 0;
let lastScoreCue = 0;
const GIF_HIDE_DELAY = 900;
let gifTimers = {};
let scoreMilestone = 0;
const feedbackEls = {
    jump: document.getElementById('jump-gif'),
    gameover: document.getElementById('gameover-gif')
};
const sounds = {
    bgm: document.getElementById('bgm_main'),
    jump: document.getElementById('sfx_jump'),
    land: document.getElementById('sfx_land'),
    score: document.getElementById('sfx_score'),
    die: document.getElementById('sfx_die'),
    ui: document.getElementById('sfx_ui')
};
Object.values(sounds).forEach(sound => {
    sound.load();
});

/**
 * §1 Lifecycle & Initialization
 */
document.addEventListener('DOMContentLoaded', () => {
    resize();
    window.addEventListener('resize', resize);
    
    // Input
    const gameContainer = document.getElementById('game-container');
    gameContainer.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    gameContainer.addEventListener('pointermove', handleGameInput, { passive: false });
    gameContainer.addEventListener('pointerup', handleGameInput, { passive: false });
    gameContainer.addEventListener('pointercancel', handleGameInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);

    // Initial Start
    initGame();
    setState('PLAYING');
    
    requestAnimationFrame(loop);
});

function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = document.body.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Recenter input on resize
    if (gameState === 'BOOT') inputX = cw / 2;
}

function initGame() {
    score = 0;
    maxScore = 0;
    cameraY = 0;
    particles = [];
    platforms = [];
    scoreMilestone = 0;
    hideFeedback('jump');
    hideFeedback('gameover');
    
    // Hero Init
    hero = {
        x: cw / 2,
        y: ch - 200,
        w: 30,
        h: 30,
        vx: 0,
        vy: 0,
        color: gameConfig.heroColor,
        blinkPhase: 0,
        auraPulse: 0
    };
    inputX = cw / 2;
    
    // Initial Platforms
    generatePlatform(cw/2, ch - 100, 100); // Starter platform
    let y = ch - 100;
    while (y > 0) {
        y -= 80 + Math.random() * 40;
        generatePlatform(Math.random() * (cw - 60) + 30, y, 60 + Math.random() * 40);
    }
    
    updateHUD();
}

function generatePlatform(x, y, w) {
    platforms.push({ x, y, w, h: 12, type: 'normal', color: '#10b981' });
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOverScreen = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
    } else if (newState === 'GAMEOVER') {
        document.getElementById('final-score').innerText = Math.floor(maxScore);
        gameOverScreen.classList.remove('hidden');
    }
}

function restartGame() {
    stopBgm();
    initGame();
    setState('PLAYING');
    startBgm();
}

function ensureAudioReady() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    if (!audioUnlocked) {
        Object.values(sounds).forEach(sound => {
            sound.muted = true;
            const playAttempt = sound.play();
            if (playAttempt && typeof playAttempt.then === 'function') {
                playAttempt
                    .then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                        sound.muted = false;
                    })
                    .catch(() => {
                        sound.muted = false;
                    });
            } else {
                sound.muted = false;
            }
        });
        audioUnlocked = true;
    }
}

function startBgm() {
    sounds.bgm.volume = 0.18;
    sounds.bgm.play().catch(() => {});
}

function stopBgm() {
    sounds.bgm.pause();
    sounds.bgm.currentTime = 0;
}

function playManagedSound(sound, volume = 0.3, clone = true) {
    const target = clone ? sound.cloneNode() : sound;
    target.volume = volume;
    target.currentTime = 0;
    target.play().catch(() => {});
}

function flashFeedback(kind, duration = GIF_HIDE_DELAY) {
    const el = feedbackEls[kind];
    if (!el) return;
    el.hidden = false;
    el.classList.add('active');
    clearTimeout(gifTimers[kind]);
    gifTimers[kind] = setTimeout(() => hideFeedback(kind), duration);
}

function hideFeedback(kind) {
    const el = feedbackEls[kind];
    if (!el) return;
    el.classList.remove('active');
    clearTimeout(gifTimers[kind]);
    gifTimers[kind] = setTimeout(() => {
        if (!el.classList.contains('active')) {
            el.hidden = true;
        }
    }, 180);
}

/**
 * §2 Input & Audio
 */
function handleGlobalInput(e) {
    const isGameplaySurface = e.target === canvas || canvas.contains(e.target);
    if (isGameplaySurface) {
        e.preventDefault();
    }
    
    ensureAudioReady();
    startBgm();

    if (gameState === 'GAMEOVER') {
        playSfx('ui');
        setTimeout(() => restartGame(), 100);
        return;
    }
    
    if (gameState === 'PLAYING' && isGameplaySurface) {
        handleGameInput(e);
    }
}

function handleGameInput(e) {
    if (gameState !== 'PLAYING') return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    inputX = e.clientX - rect.left;
}

function playSfx(type) {
    if (type === 'jump') {
        const now = performance.now();
        if (now - lastJumpSfxAt < 90) return;
        lastJumpSfxAt = now;
        playManagedSound(sounds.jump, 0.28, true);
    } else if (type === 'land') {
        playManagedSound(sounds.land, 0.22, true);
    } else if (type === 'score') {
        playManagedSound(sounds.score, 0.18, true);
    } else if (type === 'ui') {
        playManagedSound(sounds.ui, 0.22, true);
    } else if (type === 'die') {
        playManagedSound(sounds.die, 0.34, false);
    }
}

function synthFallback(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'beep') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }
}

function vibrate(style) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 40);
    }
}

/**
 * §3 Game Loop
 */
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05); 
    lastTime = timestamp;

    try {
        update(dt, timestamp);
        draw(timestamp);
    } catch (e) {
        console.error("Game Loop Error:", e);
        if (hero && (!isFinite(hero.x) || !isFinite(hero.y))) {
            initGame();
        }
    }

    requestAnimationFrame(loop);
}

function update(dt, time) {
    if (gameState !== 'PLAYING') return;
    
    // Physics
    hero.vy += gameConfig.gravity;
    hero.y += hero.vy;
    hero.blinkPhase = (hero.blinkPhase + dt * 9) % (Math.PI * 2);
    hero.auraPulse = (hero.auraPulse + dt * 4) % (Math.PI * 2);
    
    // Horizontal Movement (Smooth Lerp)
    const targetX = inputX;
    hero.x += (targetX - hero.x) * 10 * dt;
    
    // Screen Wrap
    if (hero.x < -hero.w/2) hero.x = cw + hero.w/2;
    if (hero.x > cw + hero.w/2) hero.x = -hero.w/2;

    // Platform Collisions (Only when falling)
    if (hero.vy > 0) {
        platforms.forEach(p => {
            // Check relative to camera
            const relativeHeroY = hero.y; 
            // Simple AABB
            if (hero.x + hero.w/2 > p.x - p.w/2 && 
                hero.x - hero.w/2 < p.x + p.w/2 &&
                hero.y + hero.h/2 >= p.y - p.h/2 && 
                hero.y + hero.h/2 <= p.y + p.h/2 + 15) { // Tolerance
                
                // Bounce
                hero.vy = -gameConfig.jumpForce;
                createParticles(hero.x, hero.y + hero.h/2, 10, p.color);
                playSfx('jump');
                playSfx('land');
                flashFeedback('jump', 720);
                vibrate('light');
            }
        });
    }

    // Camera Scroll (Move world down if hero goes high)
    const threshold = ch * 0.4;
    if (hero.y < threshold) {
        const diff = threshold - hero.y;
        hero.y = threshold;
        
        // Move platforms down
        platforms.forEach(p => p.y += diff);
        particles.forEach(p => p.y += diff);
        
        score += diff;
        if (score > maxScore) maxScore = score;
        const nextMilestone = Math.floor(maxScore / 250);
        if (nextMilestone > scoreMilestone && time - lastScoreCue > 260) {
            scoreMilestone = nextMilestone;
            lastScoreCue = time;
            playSfx('score');
        }
        updateHUD();

        // Cull platforms
        for (let i = platforms.length - 1; i >= 0; i--) {
            if (platforms[i].y > ch) {
                platforms.splice(i, 1);
            }
        }

        // Generate new platforms
        const highestPlatformY = platforms.reduce((min, p) => Math.min(min, p.y), ch);
        if (highestPlatformY > 50) {
            const newY = highestPlatformY - (80 + Math.random() * 60);
            const newW = Math.max(40, 100 - (score / 500)); // Platforms get smaller
            const newX = Math.random() * (cw - newW) + newW/2;
            generatePlatform(newX, newY, newW);
        }
    }

    // Death Check
    if (hero.y > ch + 100) {
        die();
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function die() {
    vibrate('heavy');
    stopBgm();
    playSfx('die');
    flashFeedback('gameover', 2200);
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 500);
    setState('GAMEOVER');
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 150 + 50;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function updateHUD() {
    document.getElementById('score-display').innerText = Math.floor(maxScore);
}

/**
 * §4 Rendering
 */
function draw(time = 0) {
    // Clear
    const backgroundGradient = ctx.createLinearGradient(0, 0, 0, ch);
    backgroundGradient.addColorStop(0, '#040814');
    backgroundGradient.addColorStop(0.55, '#091230');
    backgroundGradient.addColorStop(1, '#130f2d');
    ctx.fillStyle = backgroundGradient;
    ctx.fillRect(0, 0, cw, ch);

    // Ambient skyline glow
    const skylineGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.18, 20, cw * 0.5, ch * 0.18, Math.max(cw, ch) * 0.7);
    skylineGlow.addColorStop(0, 'rgba(110, 242, 255, 0.1)');
    skylineGlow.addColorStop(0.45, 'rgba(124, 92, 255, 0.08)');
    skylineGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = skylineGlow;
    ctx.fillRect(0, 0, cw, ch);

    // Grid Background (Parallax)
    ctx.strokeStyle = 'rgba(61, 95, 142, 0.36)';
    ctx.lineWidth = 1.4;
    const gridY = (maxScore * 0.5) % 50;
    
    ctx.beginPath();
    // Vertical
    for (let x = 0; x <= cw; x += 50) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
    }
    // Horizontal
    for (let y = gridY - 50; y <= ch; y += 50) {
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
    }
    ctx.stroke();

    // Horizon bands
    ctx.save();
    ctx.globalAlpha = 0.18;
    for (let i = 0; i < 5; i++) {
        const bandY = ch - i * 90 + (maxScore * 0.18 % 90);
        ctx.strokeStyle = i % 2 === 0 ? '#6ef2ff' : '#8a6dff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, bandY);
        ctx.lineTo(cw, bandY);
        ctx.stroke();
    }
    ctx.restore();

    // Ambient sparks
    ctx.save();
    for (let i = 0; i < 18; i++) {
        const sparkX = (i * 97 + maxScore * 0.12) % (cw + 80) - 40;
        const sparkY = ((i * 61) + time * 0.03) % (ch + 120) - 60;
        const alpha = 0.08 + (i % 4) * 0.03;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = i % 2 === 0 ? '#6ef2ff' : '#ffffff';
        ctx.beginPath();
        ctx.arc(sparkX, sparkY, 1.6 + (i % 3) * 0.7, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Draw Platforms
    platforms.forEach((p, index) => {
        const plateGradient = ctx.createLinearGradient(p.x, p.y - p.h/2, p.x, p.y + p.h/2);
        plateGradient.addColorStop(0, '#b8fff2');
        plateGradient.addColorStop(0.35, '#49f2bf');
        plateGradient.addColorStop(1, '#148d7a');

        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(73, 242, 191, 0.7)';
        ctx.fillStyle = plateGradient;
        
        // Rounded Rect
        const r = 6;
        ctx.beginPath();
        ctx.roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h, r);
        ctx.fill();

        // Base underglow
        ctx.fillStyle = 'rgba(110, 242, 255, 0.18)';
        ctx.fillRect(p.x - p.w/2 + 4, p.y + p.h/2 - 2, p.w - 8, 5);
        
        // Detail line
        ctx.fillStyle = 'rgba(255,255,255,0.48)';
        ctx.fillRect(p.x - p.w/2 + 4, p.y - p.h/2 + 2, p.w - 8, 3);

        // Corner beacons
        ctx.fillStyle = index % 2 === 0 ? '#6ef2ff' : '#8a6dff';
        ctx.beginPath();
        ctx.arc(p.x - p.w/2 + 8, p.y, 2.2, 0, Math.PI * 2);
        ctx.arc(p.x + p.w/2 - 8, p.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
    });

    // Draw Hero
    if (hero) {
        ctx.save();
        ctx.translate(hero.x, hero.y);

        const floatOffset = Math.sin(hero.auraPulse) * 1.5;
        ctx.translate(0, floatOffset);

        // Aura rings
        const auraRadius = hero.w * (0.86 + (ENABLE_ANIMATIONS ? (Math.sin(hero.auraPulse) * 0.08) : 0));
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = 'rgba(110, 242, 255, 0.65)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, auraRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = 'rgba(138, 109, 255, 0.75)';
        ctx.beginPath();
        ctx.arc(0, 0, auraRadius + 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Glow
        ctx.shadowBlur = 22;
        ctx.shadowColor = 'rgba(110, 242, 255, 0.85)';

        // Body outer shell
        const bodyGradient = ctx.createLinearGradient(-hero.w/2, -hero.h/2, hero.w/2, hero.h/2);
        bodyGradient.addColorStop(0, '#f8fdff');
        bodyGradient.addColorStop(0.2, '#85f7ff');
        bodyGradient.addColorStop(0.65, hero.color);
        bodyGradient.addColorStop(1, '#6b5cff');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.roundRect(-hero.w/2, -hero.h/2, hero.w, hero.h, 9);
        ctx.fill();

        // Inner prism core
        const coreGradient = ctx.createLinearGradient(0, -hero.h/3, 0, hero.h/3);
        coreGradient.addColorStop(0, '#ffffff');
        coreGradient.addColorStop(1, '#b2eeff');
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.fillStyle = coreGradient;
        ctx.beginPath();
        ctx.roundRect(-hero.w/4, -hero.h/4, hero.w/2, hero.h/2, 5);
        ctx.fill();

        // Eyes / personality
        const blink = Math.abs(Math.sin(hero.blinkPhase)) < 0.08 ? 1 : 0;
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#07111f';
        if (blink) {
            ctx.fillRect(-7, -1, 4, 1.5);
            ctx.fillRect(3, -1, 4, 1.5);
        } else {
            ctx.beginPath();
            ctx.arc(-5.2, -1.5, 1.8, 0, Math.PI * 2);
            ctx.arc(5.2, -1.5, 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-4.7, -2.1, 0.65, 0, Math.PI * 2);
            ctx.arc(5.7, -2.1, 0.65, 0, Math.PI * 2);
            ctx.fill();
        }

        // Smile
        ctx.strokeStyle = 'rgba(6, 18, 34, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 3.2, 5.4, 0.18 * Math.PI, 0.82 * Math.PI);
        ctx.stroke();

        // Crest
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.78;
        ctx.beginPath();
        ctx.moveTo(0, -hero.h/2 - 4);
        ctx.lineTo(4, -hero.h/2 + 2);
        ctx.lineTo(-4, -hero.h/2 + 2);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;

        // Trail effect
        if (hero.vy < 0) {
            ctx.shadowBlur = 18;
            ctx.shadowColor = 'rgba(110, 242, 255, 0.5)';
            ctx.fillStyle = 'rgba(110, 242, 255, 0.32)';
            ctx.beginPath();
            ctx.moveTo(-hero.w/3, hero.h/2);
            ctx.lineTo(hero.w/3, hero.h/2);
            ctx.lineTo(hero.w/5, hero.h/2 + 22);
            ctx.lineTo(-hero.w/5, hero.h/2 + 22);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(138, 109, 255, 0.22)';
            ctx.beginPath();
            ctx.moveTo(-hero.w/5, hero.h/2 + 12);
            ctx.lineTo(hero.w/5, hero.h/2 + 12);
            ctx.lineTo(hero.w/8, hero.h/2 + 34);
            ctx.lineTo(-hero.w/8, hero.h/2 + 34);
            ctx.closePath();
            ctx.fill();
        }
        
        ctx.restore();
    }
}
