<html lang="en">
<head>

    <!-- [agent-note][stage4] preserved-font-role: title -> Audiowide, ui -> Exo 2 via catalogs/fonts.json -->

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>

<script>
/** 
 * §2 Technical Contract Implementation 
 */

// Global Config & State
window.gameConfig = {
    playerSpeed: 15,
    baseSpeed: 600,
    laneColor: "#ffffff"
};

// Editor Hook
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

// Game State
let gameState = 'START'; // START, PLAYING, GAMEOVER
let difficulty = 0; // 0=Easy, 1=Normal, 2=Hard
let score = 0;
let gameTime = 0;
let lastTime = 0;
let speedMultiplier = 1;
let shakeTime = 0;
let scoreFlashTimer = 0;
let crashFlashTimer = 0;

// Entities
const player = { x: 0.5, y: 0.8, w: 0.12, h: 0.08, targetX: 0.5, tilt: 0 };
let enemies = [];
let particles = [];
let roadOffset = 0;

const feedbackEls = {
    scoreGif: document.getElementById('score-gif'),
    crashGif: document.getElementById('crash-gif')
};

// Canvas
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let canvasWidth, canvasHeight;

// Input State
let inputActive = false;
let inputX = 0.5;

/**
 * §A.2 Audio System
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.buffers = {};
        this.masterGain = null;
        this.sfxGain = null;
        this.lastPlayedAt = {};
        this.bgmEl = document.getElementById('bgm_race');
    }

    ensureContext() {
        if (this.ctx) return true;
        const AudioContextRef = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextRef) return false;
        this.ctx = new AudioContextRef();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.82;
        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.72;
        this.sfxGain.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);
        return true;
    }

    unlock() {
        if (!this.ensureContext()) {
            this.unlocked = true;
            this.playBgm();
            return;
        }
        const resumeResult = this.ctx.state === 'suspended' ? this.ctx.resume() : Promise.resolve();
        resumeResult
            .then(() => {
                this.unlocked = true;
                this.playBgm();
            })
            .catch(() => {
                this.unlocked = true;
                this.playBgm();
            });
    }

    async load(id, elementId) {
        const el = document.getElementById(elementId);
        if (!el || !this.ensureContext()) return;
        if (new URL(el.src, window.location.href).origin !== window.location.origin) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer.slice(0));
        } catch (e) {
            console.warn('Audio load failed', id);
        }
    }

    playBgm() {
        const el = this.bgmEl;
        if (!el || !this.unlocked) return;
        el.volume = 0.2;
        el.currentTime = 0;
        el.play().catch(() => {});
    }

    stopBgm() {
        const el = this.bgmEl;
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, { debounceMs = 90, volume = 1 } = {}) {
        const now = performance.now();
        if ((this.lastPlayedAt[id] || 0) + debounceMs > now) return;
        this.lastPlayedAt[id] = now;

        if (!this.unlocked || !this.ensureContext() || !this.buffers[id]) {
            if (id === 'crash') this.synthesizeExplosion();
            if (id === 'pass' || id === 'menu' || id === 'start') this.synthesizeBeep(id === 'pass' ? 980 : 720);
            return;
        }

        const source = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        gain.gain.value = volume;
        source.buffer = this.buffers[id];
        source.connect(gain);
        gain.connect(this.sfxGain);
        source.start(0);
    }

    synthesizeExplosion() {
        if (!this.ensureContext()) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(24, this.ctx.currentTime + 0.45);
        gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.45);
    }

    synthesizeBeep(baseFreq = 880) {
        if (!this.ensureContext()) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.18, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.11);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.11);
    }
}

const audioManager = new AudioManager();

/**
 * Core Logic
 */

function resize() {
    canvasWidth = window.innerWidth;
    canvasHeight = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;
    
    canvas.style.width = canvasWidth + 'px';
    canvas.style.height = canvasHeight + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Update player aspect ratio based on screen
    player.w = 0.15; // 15% of screen width
    player.h = player.w * (canvasWidth / canvasHeight) * 2.0; // Maintain rough aspect
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Audio Loading
    audioManager.load('crash', 'sfx_crash');
    audioManager.load('pass', 'sfx_pass');
    audioManager.load('start', 'sfx_start');
    audioManager.load('menu', 'sfx_menu');

    // Input Handling
    const handleInput = (e) => {
        if (gameState !== 'PLAYING') return;
        inputActive = true;
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        inputX = Math.max(0, Math.min(1, clientX / canvasWidth));
        
        // Unlock audio on first interaction
        audioManager.unlock();
    };

    const endInput = () => {
        inputActive = false;
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    canvas.addEventListener('pointerup', endInput);
    canvas.addEventListener('pointercancel', endInput);

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    requestAnimationFrame(loop);
}

// Difficulty Logic
window.setDifficulty = (level) => {
    audioManager.unlock();
    audioManager.playSfx('menu', { debounceMs: 70, volume: 0.72 });
    difficulty = level;
    const btns = document.querySelectorAll('.difficulty-btn');
    btns.forEach((btn, i) => {
        if (i === level) {
            btn.classList.add('active');
            // Update colors based on difficulty
            if(i===0) btn.style.boxShadow = "0 0 15px #00cec9";
            if(i===1) btn.style.boxShadow = "0 0 15px #fdcb6e";
            if(i===2) btn.style.boxShadow = "0 0 15px #ff7675";
        } else {
            btn.classList.remove('active');
            btn.style.boxShadow = "none";
        }
    });
};

function startGame() {
    gameState = 'PLAYING';
    score = 0;
    speedMultiplier = 1;
    gameTime = 0;
    enemies = [];
    particles = [];
    player.x = 0.5;
    player.targetX = 0.5;
    inputX = 0.5;
    scoreFlashTimer = 0;
    crashFlashTimer = 0;
    feedbackEls.scoreGif.classList.remove('visible');
    feedbackEls.crashGif.classList.remove('visible');

    // Hide UI
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');

    audioManager.unlock();
    audioManager.playSfx('start', { debounceMs: 120, volume: 0.9 });
}

function gameOver() {
    gameState = 'GAMEOVER';
    shakeTime = 0.5;
    crashFlashTimer = 1.2;
    feedbackEls.crashGif.classList.add('visible');
    audioManager.playSfx('crash', { debounceMs: 250, volume: 1 });
    audioManager.stopBgm();

    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = Math.floor(score);
}

function spawnEnemy() {
    // Difficulty Settings
    let spawnRate, enemySpeedMin, enemySpeedMax;
    
    switch(difficulty) {
        case 0: // Easy
            spawnRate = 1.5; 
            enemySpeedMin = 0.3; enemySpeedMax = 0.5;
            break;
        case 1: // Normal
            spawnRate = 0.8;
            enemySpeedMin = 0.5; enemySpeedMax = 0.8;
            break;
        case 2: // Hard
            spawnRate = 0.4;
            enemySpeedMin = 0.8; enemySpeedMax = 1.2;
            break;
    }

    // Random lane logic (approximate lanes for cleaner gameplay)
    const lanes = [0.2, 0.4, 0.6, 0.8];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    // Add some jitter
    const x = lane + (Math.random() * 0.1 - 0.05);
    
    const type = Math.floor(Math.random() * 3);
    const colors = ['#ff7675', '#fdcb6e', '#6c5ce7'];
    
    enemies.push({
        x: Math.max(0.1, Math.min(0.9, x)),
        y: -0.2,
        w: player.w,
        h: player.h,
        speed: (enemySpeedMin + Math.random() * (enemySpeedMax - enemySpeedMin)) * (1 + score/1000), // Speed up over time
        color: colors[type],
        passed: false
    });
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            life: 1.0,
            color: color
        });
    }
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }

    requestAnimationFrame(loop);
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    gameTime += dt;
    
    // Speed progression
    speedMultiplier = 1 + (score / 2000) + (difficulty * 0.5);
    const currentSpeed = window.gameConfig.baseSpeed * speedMultiplier * dt;

    // Road Scroll
    roadOffset = (roadOffset + currentSpeed * 0.005) % 1;

    // Player Movement
    // Smooth lerp to input
    const lerpSpeed = window.gameConfig.playerSpeed * dt;
    player.x += (inputX - player.x) * lerpSpeed;
    
    // Tilt effect
    player.tilt = (inputX - player.x) * -30;
    
    // Clamp
    player.x = Math.max(0.1, Math.min(0.9, player.x));

    // Particle emissions from tires if moving fast laterally
    if (Math.abs(inputX - player.x) > 0.01) {
        if (Math.random() < 0.3) {
            createParticles(player.x - player.w/2, player.y + player.h/2, '#b2bec3', 1);
            createParticles(player.x + player.w/2, player.y + player.h/2, '#b2bec3', 1);
        }
    }

    // Spawn Enemies
    const spawnChance = (difficulty === 0 ? 0.02 : (difficulty === 1 ? 0.03 : 0.05)) * (1 + score/5000);
    if (Math.random() < spawnChance) {
        // Prevent overlapping spawns roughly
        const lastEnemy = enemies[enemies.length - 1];
        if (!lastEnemy || lastEnemy.y > 0.1) {
            spawnEnemy();
        }
    }

    // Update Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        // Relative speed: Enemy moves down screen
        // But actually, world moves down. Enemy has its own forward speed.
        // If enemy is slower than player, it moves down.
        // Let's simplify: Enemies move down at relative speed.
        
        const relativeSpeed = 0.5 * speedMultiplier * dt; // Base flow
        e.y += relativeSpeed + (0.2 * dt); // They come towards you

        // Collision
        if (
            player.x < e.x + e.w &&
            player.x + player.w > e.x &&
            player.y < e.y + e.h &&
            player.y + player.h > e.y
        ) {
            createParticles(player.x, player.y, '#ff0000', 20);
            gameOver();
        }

        // Scoring
        if (!e.passed && e.y > player.y) {
            e.passed = true;
            score += 10 * (difficulty + 1);
            scoreFlashTimer = 0.8;
            feedbackEls.scoreGif.classList.add('visible');
            audioManager.playSfx('pass', { debounceMs: 110, volume: 0.78 });
            // Floating text effect could go here
        }

        // Cleanup
        if (e.y > 1.2) {
            enemies.splice(i, 1);
        }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update HUD
    document.getElementById('score-display').innerText = Math.floor(score);
    document.getElementById('speed-display').innerText = "FLOW: " + Math.floor(100 * speedMultiplier) + " KB/S";

    if (scoreFlashTimer > 0) {
        scoreFlashTimer -= dt;
        if (scoreFlashTimer <= 0) feedbackEls.scoreGif.classList.remove('visible');
    }

    if (crashFlashTimer > 0) {
        crashFlashTimer -= dt;
        if (crashFlashTimer <= 0) feedbackEls.crashGif.classList.remove('visible');
    }

    // Shake decay
    if (shakeTime > 0) shakeTime -= dt;
}

function draw() {
    // Clear
    const skyGradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    skyGradient.addColorStop(0, '#10243d');
    skyGradient.addColorStop(0.55, '#091626');
    skyGradient.addColorStop(1, '#040914');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Shake
    ctx.save();
    if (shakeTime > 0) {
        const shakeAmt = 10 * shakeTime;
        ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);
    }

    // Data lane glow
    const laneGlow = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    laneGlow.addColorStop(0, 'rgba(108, 229, 255, 0.08)');
    laneGlow.addColorStop(1, 'rgba(64, 150, 255, 0.02)');
    ctx.fillStyle = laneGlow;
    ctx.fillRect(canvasWidth * 0.08, 0, canvasWidth * 0.84, canvasHeight);

    // Road Markings
    ctx.strokeStyle = 'rgba(217, 248, 255, 0.92)';
    ctx.lineWidth = 4;
    ctx.setLineDash([40, 60]);
    ctx.lineDashOffset = -roadOffset * 1000; // Animate dash
    
    const laneCount = 4;
    for(let i=1; i<laneCount; i++) {
        const x = (canvasWidth / laneCount) * i;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvasHeight);
        ctx.stroke();
    }
    
    // Road Shoulders
    const shoulderGradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    shoulderGradient.addColorStop(0, '#18324e');
    shoulderGradient.addColorStop(1, '#071321');
    ctx.fillStyle = shoulderGradient;
    ctx.fillRect(0, 0, 20, canvasHeight);
    ctx.fillRect(canvasWidth - 20, 0, 20, canvasHeight);

    // Neon rails
    ctx.fillStyle = 'rgba(108, 229, 255, 0.45)';
    ctx.fillRect(20, 0, 4, canvasHeight);
    ctx.fillRect(canvasWidth - 24, 0, 4, canvasHeight);

    // Draw Player
    drawCar(player.x, player.y, player.w, player.h, '#6ce5ff', player.tilt, true);

    // Draw Enemies
    enemies.forEach(e => {
        drawCar(e.x, e.y, e.w, e.h, e.color, 0, false);
    });

    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        const px = p.x * canvasWidth;
        const py = p.y * canvasHeight;
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Speed Lines (High Speed Visual)
    if (speedMultiplier > 1.5) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        for(let i=0; i<5; i++) {
            const x = Math.random() * canvasWidth;
            const y = Math.random() * canvasHeight;
            const len = Math.random() * 100 + 50;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + len);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function drawCar(nx, ny, nw, nh, color, tilt, isPlayer) {
    const x = nx * canvasWidth;
    const y = ny * canvasHeight;
    const w = nw * canvasWidth;
    const h = nh * canvasHeight; // Note: h is calculated based on w in resize, but here we use relative

    ctx.save();
    ctx.translate(x, y);
    if (tilt) ctx.rotate(tilt * Math.PI / 180);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.52)';
    ctx.beginPath();
    ctx.roundRect(-w/2 + 6, -h/2 + 8, w, h, 10);
    ctx.fill();

    // Glow shell
    ctx.shadowBlur = isPlayer ? 18 : 10;
    ctx.shadowColor = isPlayer ? 'rgba(108, 229, 255, 0.85)' : color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, 10);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Body stripe
    ctx.fillStyle = isPlayer ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.14)';
    ctx.beginPath();
    ctx.roundRect(-w * 0.12, -h/2 + 8, w * 0.24, h - 16, 6);
    ctx.fill();

    // Roof / Windshield
    const roofGradient = ctx.createLinearGradient(0, -h/2, 0, h/2);
    roofGradient.addColorStop(0, 'rgba(248, 252, 255, 0.24)');
    roofGradient.addColorStop(0.45, 'rgba(14, 28, 48, 0.88)');
    roofGradient.addColorStop(1, 'rgba(4, 10, 20, 0.92)');
    ctx.fillStyle = roofGradient;
    ctx.beginPath();
    ctx.roundRect(-w/2 + 5, -h/2 + 9, w - 10, h - 24, 5);
    ctx.fill();

    // Headlights
    ctx.fillStyle = isPlayer ? '#e8f7ff' : '#ff8197'; // Cool headlights for player, magenta taillights for enemies
    if (isPlayer) {
        // Front lights
        ctx.fillRect(-w/2 + 2, -h/2, 6, 4);
        ctx.fillRect(w/2 - 8, -h/2, 6, 4);
        
        // Light Beams
        ctx.fillStyle = 'rgba(255, 234, 167, 0.3)';
        ctx.beginPath();
        ctx.moveTo(-w/2 + 5, -h/2);
        ctx.lineTo(-w/2 - 10, -h/2 - 100);
        ctx.lineTo(-w/2 + 20, -h/2 - 100);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(w/2 - 5, -h/2);
        ctx.lineTo(w/2 + 10, -h/2 - 100);
        ctx.lineTo(w/2 - 20, -h/2 - 100);
        ctx.fill();
    } else {
        // Rear lights (facing player)
        ctx.fillRect(-w/2 + 2, h/2 - 4, 6, 4);
        ctx.fillRect(w/2 - 8, h/2 - 4, 6, 4);
    }

    ctx.restore();
}

// Polyfill for roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    };
}

// Boot
window.addEventListener('DOMContentLoaded', init);

</script>
