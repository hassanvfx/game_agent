ight)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card{min-width:108px;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(36,14,82,.84),rgba(4,1,14,.72));box-shadow:0 12px 30px rgba(0,0,0,.38),inset 0 0 22px rgba(116,255,241,.08)}.label{font-family:var(--sigil);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 9px rgba(255,217,106,.55)}.value{font-family:var(--title);font-size:34px;line-height:1;color:#fff;text-shadow:2px 0 var(--pink),-2px 0 var(--cyan),0 0 18px rgba(255,255,255,.35)}.right{text-align:right}.mission{align-self:center;max-width:min(430px,calc(100vw - 24px));padding:10px 46px 10px 14px;border:1px solid rgba(116,255,241,.25);border-radius:18px;background:linear-gradient(90deg,rgba(255,79,216,.2),rgba(12,4,30,.78),rgba(116,255,241,.15));box-shadow:0 12px 28px rgba(0,0,0,.36);position:relative;text-align:center}.mission:after{content:"◆";position:absolute;right:16px;top:13px;color:var(--pink);font-size:24px;animation:pulse .8s steps(2) infinite}@keyframes pulse{50%{opacity:.25}}.mission b{display:block;font:13px var(--sigil);letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}.mission span{display:block;font-size:19px;color:#fff}.feedback{position:absolute;z-index:7;width:clamp(82px,20vw,126px);aspect-ratio:1;object-fit:cover;border:2px solid rgba(255,255,255,.22);border-radius:17px;opacity:0;transform:scale(.85) rotate(-5deg);box-shadow:0 0 24px rgba(255,79,216,.4);transition:.18s;pointer-events:none}.feedback.visible{opacity:.95;transform:scale(1) rotate(2deg)}#celebration-gif{right:12px;bottom:124px}#fail-gif{left:12px;top:96px}.gameover{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(2,0,8,.86);backdrop-filter:blur(6px);pointer-events:auto;padding:18px}.gameover.show{display:flex}.panel{width:min(370px,100%);max-height:90vh;overflow:auto;border:1px solid rgba(255,79,216,.4);border-radius:26px;text-align:center;background:linear-gradient(180deg,rgba(54,32,107,.94),rgba(8,1,20,.96));box-shadow:0 0 42px rgba(255,79,216,.23),inset 0 0 30px rgba(116,255,241,.08);padding:24px}.panel h1{font:44px/0.95 var(--title);margin:0 0 10px;text-shadow:2px 0 var(--cyan),-2px 0 var(--pink)}.panel p{font-size:22px;margin:8px 0;color:#f9eaff}.panel small{display:block;color:#c8fff9;font-size:18px;margin:12px 0 18px}button{width:100%;border:0;border-radius:16px;padding:16px 18px;font:700 16px var(--sigil);letter-spacing:.08em;color:#160015;background:linear-gradient(180deg,#fff0a0,#ff61de 52%,#74fff1);box-shadow:0 9px 0 #4b174d,0 0 24px rgba(116,255,241,.35);touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 5px 0 #4b174d}audio{display:none}@media(max-width:480px){.card{min-width:94px;padding:9px 10px}.label{font-size:10px}.value{font-size:30px}.mission span{font-size:17px}.panel h1{font-size:38px}}</style>

<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreDisplay=document.getElementById('score-display'),streakDisplay=document.getElementById('streak-display'),gameOverScreen=document.getElementById('game-over-screen'),finalScore=document.getElementById('final-score'),restartBtn=document.getElementById('restart-btn'),bgm=document.getElementById('bgm_main'),celebrationGif=document.getElementById('celebration-gif'),failGif=document.getElementById('fail-gif');let cw=0,ch=0,dpr=1,initialized=false,lastTime=0,gameState='PLAYING',audioUnlocked=false,scrubCooldown=0,warningPlayedForCurrentDish=false;let relics=[],particles=[],score=0,streak=0,inputPos={x:0,y:0},lastInputPos={x:0,y:0},tool={x:0,y:0,vx:0,vy:0,isScrubbing:false},activeGifTimeouts={};const relicTypes=['crown','key','wing','heart','eye'];const SFX_URLS={scrub:'https://gamezone-virid.vercel.app/assets/audios/sfx/dungeon_enemy_01.mp3',clean:'https://gamezone-virid.vercel.app/assets/audios/sfx/dungeon_item_01.mp3',fail:'https://gamezone-virid.vercel.app/assets/audios/sfx/dungeon_defeat_02.mp3',warning:'https://gamezone-virid.vercel.app/assets/audios/sfx/dungeon_wind_02.mp3',ui:'https://gamezone-virid.vercel.app/assets/audios/sfx/dungeon_npc_01.mp3',start:'https://gamezone-virid.vercel.app/assets/audios/sfx/dungeon_item_02.mp3'};const configData=JSON.parse(document.getElementById('game-config').textContent);window.gameConfigDefs=configData;window.gameConfig={};for(const k in configData)window.gameConfig[k]=configData[k].value;window.updateGameConfig=(k,v)=>{if(window.gameConfigDefs[k])window.gameConfig[k]=v};const AudioManager={sfx:{},init(){Object.entries(SFX_URLS).forEach(([id,url])=>{const a=new Audio(url);a.preload='auto';this.sfx[id]=a});bgm.volume=.18},playSfx(id,vol=.4){if(!audioUnlocked)return;try{const a=this.sfx[id]?.cloneNode();if(!a)return;a.volume=vol;a.play().catch(()=>{})}catch(e){}},playBgm(){if(audioUnlocked){bgm.volume=.18;bgm.play().catch(()=>{})}},stopBgm(){bgm.pause();bgm.currentTime=0}};function vibrate(style){try{window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style}})}catch(e){}}function showFeedbackGif(el,d=1200){el.classList.add('visible');clearTimeout(activeGifTimeouts[el.id]);activeGifTimeouts[el.id]=setTimeout(()=>el.classList.remove('visible'),d)}function unlockAudio(){if(!audioUnlocked){audioUnlocked=true;AudioManager.playBgm()}}function setState(s){gameState=s;if(s==='PLAYING'){gameOverScreen.classList.remove('show');failGif.classList.remove('visible')}else if(s==='GAMEOVER'){gameOverScreen.classList.add('show');finalScore.textContent=score;showFeedbackGif(failGif,2400);AudioManager.playSfx('fail',.55);bgm.pause();vibrate('heavy')}}function initGame(startCue=false){relics=[];particles=[];score=0;streak=0;scrubCooldown=0;warningPlayedForCurrentDish=false;tool.x=cw/2;tool.y=ch*.7;lastInputPos.x=inputPos.x=tool.x;lastInputPos.y=inputPos.y=tool.y;scoreDisplay.textContent='0';streakDisplay.textContent='0';celebrationGif.classList.remove('visible');failGif.classList.remove('visible');spawnRelic();setState('PLAYING');AudioManager.playBgm();if(startCue)AudioManager.playSfx('start',.38)}function spawnRelic(){const m=60;warningPlayedForCurrentDish=false;relics.push({type:relicTypes[Math.floor(Math.random()*relicTypes.length)],x:m+Math.random()*Math.max(1,cw-m*2),y:ch*.6,r:35,cleanliness:0,maxClean:100,timer:window.gameConfig.patienceTime||8,maxTimer:window.gameConfig.patienceTime||8,state:'dirty',wobble:Math.random()*Math.PI*2})}function resize(w,h){cw=w;ch=h;dpr=window.devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(initialized)relics.forEach(r=>r.x=Math.min(Math.max(r.x,r.r),cw-r.r))}new ResizeObserver(es=>{for(const e of es){resize(e.contentRect.width,e.contentRect.height);if(!initialized){AudioManager.init();initGame(false);initialized=true;requestAnimationFrame(loop)}}}).observe(canvas);function updateInput(e){const r=canvas.getBoundingClientRect();inputPos.x=e.clientX-r.left;inputPos.y=e.clientY-r.top}function handleCanvasInput(e){unlockAudio();if(gameState!=='PLAYING')return;e.preventDefault();updateInput(e);if(e.type==='pointerdown'){lastInputPos.x=inputPos.x;lastInputPos.y=inputPos.y}}canvas.addEventListener('pointerdown',handleCanvasInput,{passive:false});canvas.addEventListener('pointermove',e=>{if(gameState!=='PLAYING')return;e.preventDefault();updateInput(e)},{passive:false});canvas.addEventListener('pointerup',handleCanvasInput,{passive:false});canvas.addEventListener('pointercancel',handleCanvasInput,{passive:false});restartBtn.addEventListener('pointerdown',()=>{unlockAudio();AudioManager.playSfx('ui',.35)});restartBtn.addEventListener('click',()=>{unlockAudio();if(gameState==='GAMEOVER')initGame(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(audioUnlocked&&gameState==='PLAYING')AudioManager.playBgm()});function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*.9,y-s*.25,x-s*.42,y-s*.9,x,y-s*.45);c.bezierCurveTo(x+s*.42,y-s*.9,x+s*.9,y-s*.25,x,y+s*.35)}function drawRelic(g,r){const cr=r.cleanliness/r.maxClean,tr=r.timer/r.maxTimer;g.save();g.translate(r.x,r.y);g.rotate(Math.sin(r.wobble)*.05);g.shadowColor=tr<.25?'rgba(255,65,109,.8)':'rgba(116,255,241,.45)';g.shadowBlur=24;g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,r.r*.92,r.r*1.15,r.r*.38,0,0,Math.PI*2);g.fill();const grad=g.createRadialGradient(-10,-14,3,0,0,r.r*1.2);grad.addColorStop(0,'#fff6d1');grad.addColorStop(.45,'#ffd96a');grad.addColorStop(1,'#8e46ff');g.fillStyle=grad;heartPath(g,0,0,r.r*.9);g.fill();g.lineWidth=4;g.strokeStyle='#12051f';g.stroke();g.strokeStyle='#74fff1';g.lineWidth=2;g.beginPath();g.moveTo(-r.r*.95,0);g.lineTo(r.r*.95,0);g.moveTo(-r.r*.55,-r.r*.42);g.lineTo(r.r*.55,r.r*.42);g.stroke();g.fillStyle='#05000b';g.font=`${r.r*.55}px Creepster`;g.textAlign='center';g.textBaseline='middle';const glyph={crown:'♛',key:'⚿',wing:'⌁',heart:'♥',eye:'◉'}[r.type];g.fillText(glyph,0,2);if(cr<1){g.globalCompositeOperation='source-atop';g.fillStyle=`rgba(20,0,30,${.82*(1-cr)})`;g.fillRect(-r.r*1.3,-r.r*1.2,r.r*2.6,r.r*2.5);g.globalCompositeOperation='source-over'}g.globalAlpha=.9;g.strokeStyle=tr<.25?'#ff416d':'#ff4fd8';g.lineWidth=3;g.beginPath();g.arc(0,0,r.r+9,-Math.PI/2,-Math.PI/2+Math.PI*2*tr);g.stroke();g.restore()}function drawTool(g){g.save();g.translate(tool.x,tool.y+Math.sin(performance.now()*.009)*2);g.shadowColor='rgba(255,79,216,.8)';g.shadowBlur=28;g.fillStyle='rgba(0,0,0,.26)';g.beginPath();g.ellipse(0,29,26,8,0,0,Math.PI*2);g.fill();const body=g.createLinearGradient(0,-31,0,30);body.addColorStop(0,'rgba(255,255,255,.95)');body.addColorStop(.48,'rgba(116,255,241,.76)');body.addColorStop(1,'rgba(255,79,216,.58)');g.fillStyle=body;g.beginPath();g.moveTo(0,-30);g.bezierCurveTo(-27,-26,-24,15,-14,28);g.quadraticCurveTo(0,18,14,28);g.bezierCurveTo(25,14,27,-25,0,-30);g.fill();g.strokeStyle='#fff6a4';g.lineWidth=3;g.stroke();g.fillStyle='#05000b';g.beginPath();g.arc(-8,-7,4,0,Math.PI*2);g.arc(8,-7,4,0,Math.PI*2);g.fill();g.strokeStyle=tool.isScrubbing?'#ff416d':'#05000b';g.lineWidth=2.5;g.beginPath();g.arc(0,6,7,tool.isScrubbing?0:0.15*Math.PI,tool.isScrubbing?Math.PI:0.85*Math.PI);g.stroke();g.strokeStyle='#ffd96a';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(-22,20);g.lineTo(24,20);g.moveTo(15,10);g.lineTo(30,20);g.lineTo(15,30);g.stroke();if(tool.isScrubbing){for(let i=0;i<4;i++){g.strokeStyle=`rgba(116,255,241,${.5-i*.1})`;g.lineWidth=2;g.beginPath();g.arc(-26-i*7,-8-i*3,9+i*3,1.1*Math.PI,1.9*Math.PI);g.stroke()}}g.restore()}function drawBackground(g){const grad=g.createLinearGradient(0,0,0,ch);grad.addColorStop(0,'#160334');grad.addColorStop(.6,'#0a0419');grad.addColorStop(1,'#020006');g.fillStyle=grad;g.fillRect(0,0,cw,ch);const t=performance.now()*.001;for(let i=0;i<9;i++){const x=(cw*((i*.137+t*.025)%1));const y=ch*(.16+(i%4)*.09);g.strokeStyle=`rgba(${i%2?255:116},${i%2?79:255},${i%2?216:241},.16)`;g.lineWidth=2;g.beginPath();g.moveTo(x-80,y);g.bezierCurveTo(x-20,y-24,x+20,y+24,x+90,y);g.stroke()}g.fillStyle='rgba(255,217,106,.07)';for(let i=0;i<7;i++){const x=cw*(.12+i*.14),y=ch*.78+Math.sin(t+i)*8;g.save();g.translate(x,y);g.rotate(Math.PI/4);g.fillRect(-25,-25,50,50);g.restore()}g.fillStyle='rgba(5,0,15,.55)';g.fillRect(0,ch*.72,cw,ch*.28);g.strokeStyle='rgba(255,255,255,.08)';for(let i=0;i<5;i++){g.beginPath();g.moveTo(0,ch*(.72+i*.05));g.quadraticCurveTo(cw*.45,ch*(.70+i*.06),cw,ch*(.74+i*.05));g.stroke()}}function update(dt){if(gameState!=='PLAYING')return;scrubCooldown=Math.max(0,scrubCooldown-dt);tool.vx=(inputPos.x-tool.x)*.2;tool.vy=(inputPos.y-tool.y)*.2;tool.x+=tool.vx;tool.y+=tool.vy;const dist=Math.hypot(tool.x-lastInputPos.x,tool.y-lastInputPos.y);tool.isScrubbing=dist>5;if(tool.isScrubbing){const dx=tool.x-lastInputPos.x,dy=tool.y-lastInputPos.y,segs=Math.floor(dist/5);for(let i=0;i<segs;i++){const q=i/Math.max(1,segs);particles.push({x:lastInputPos.x+dx*q,y:lastInputPos.y+dy*q,vx:(Math.random()-.5)*100,vy:-50-Math.random()*100,life:.3+Math.random()*.2,r:2+Math.random()*3,color:'#74fff1'})}}lastInputPos.x=tool.x;lastInputPos.y=tool.y;const speed=window.gameConfig.scrubSpeed||60;relics.forEach((r,idx)=>{r.wobble+=dt*2;r.timer-=dt;if(r.state==='dirty'){const d=Math.hypot(tool.x-r.x,tool.y-r.y);if(d<r.r+20&&tool.isScrubbing&&r.cleanliness<r.maxClean){r.cleanliness+=speed*dt;vibrate('light');if(scrubCooldown<=0){AudioManager.playSfx('scrub',.15);scrubCooldown=.09}if(Math.random()<.13)particles.push({x:r.x+(Math.random()-.5)*r.r,y:r.y+(Math.random()-.5)*r.r,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.4,r:4,color:'#ff4fd8'});if(r.cleanliness>=r.maxClean){r.cleanliness=r.maxClean;r.state='clean';AudioManager.playSfx('clean',.42);showFeedbackGif(celebrationGif,1100);vibrate('medium');score++;streak++;scoreDisplay.textContent=score;streakDisplay.textContent=streak;for(let i=0;i<13;i++)particles.push({x:r.x,y:r.y,vx:(Math.random()-.5)*310,vy:(Math.random()-.5)*310,life:.5,r:4,color:i%2?'#ffd96a':'#74fff1'});setTimeout(()=>{relics.splice(idx,1);spawnRelic()},300)}}if(r.timer<=0){r.timer=0;setState('GAMEOVER')}else if(!warningPlayedForCurrentDish&&r.timer/r.maxTimer<.28){warningPlayedForCurrentDish=true;AudioManager.playSfx('warning',.32)}}});particles.forEach((p,i)=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)});if(!isFinite(tool.x)||!isFinite(tool.y)){tool.x=cw/2;tool.y=ch/2}}function draw(){drawBackground(ctx);relics.forEach(r=>{drawRelic(ctx,r);const tr=r.timer/r.maxTimer,bw=64,bh=9,bx=r.x-bw/2,by=r.y-r.r-24;ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(bx-3,by-3,bw+6,bh+6,6);ctx.fill();const gr=ctx.createLinearGradient(bx,by,bx+bw,by);if(tr>.5){gr.addColorStop(0,'#74fff1');gr.addColorStop(1,'#ffd96a')}else if(tr>.25){gr.addColorStop(0,'#ffd96a');gr.addColorStop(1,'#ff4fd8')}else{gr.addColorStop(0,'#ff416d');gr.addColorStop(1,'#fff')}ctx.fillStyle=gr;ctx.beginPath();ctx.roundRect(bx,by,bw*tr,bh,5);ctx.fill()});drawTool(ctx);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.5);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.r),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}function loop(ts){const dt=Math.min((ts-lastTime)/1000,.05)||0;lastTime=ts;try{update(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
window.__qaGetRelic=()=>relics[0]?{x:relics[0].x,y:relics[0].y,r:relics[0].r,score,cleanliness:relics[0].cleanliness,timer:relics[0].timer,toolX:tool.x,toolY:tool.y}:null;
window.__qaForceGameOver=()=>setState('GAMEOVER');
</script>
