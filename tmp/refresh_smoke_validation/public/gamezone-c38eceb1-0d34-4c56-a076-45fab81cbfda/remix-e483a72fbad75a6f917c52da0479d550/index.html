<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Stream Tycoon: Global</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage4] preserved: approved catalog-backed font set | source: workspace mirrored google font assets -->
    <link rel="stylesheet" href="assets/fonts.googleapis.com/css2-family_Chakra_Petch_wght_400_600_700_family_JetBrains_Mono_wght_400_800_display_swap.css">
    <style>
        :root {
            --brand-main: #9146FF;
            --brand-dark: #451093;
            --brand-accent: #00ff9d;
            --brand-hot: #ff7a00;
            --brand-sky: #67e8f9;
            --bg-dark: #050505;
            --bg-panel: #12091f;
            --panel-edge: rgba(255,255,255,0.12);
            --text-main: #f7f5ff;
            --text-dim: rgba(233, 228, 255, 0.7);
        }

        body {
            background:
                radial-gradient(circle at top, rgba(145, 70, 255, 0.28), transparent 32%),
                radial-gradient(circle at bottom, rgba(0, 255, 157, 0.14), transparent 30%),
                linear-gradient(180deg, #040308 0%, #0b0615 55%, #050505 100%);
            color: var(--text-main);
            font-family: 'Chakra Petch', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        #app {
            border: 1px solid rgba(145, 70, 255, 0.28);
            background:
                linear-gradient(180deg, rgba(18, 9, 31, 0.98), rgba(6, 5, 12, 0.98)),
                #000;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 24px 64px rgba(0,0,0,0.55),
                0 0 40px rgba(145, 70, 255, 0.22);
        }

        #stream-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 18%, rgba(103, 232, 249, 0.18), transparent 26%),
                radial-gradient(circle at 50% 100%, rgba(145, 70, 255, 0.12), transparent 50%);
            pointer-events: none;
        }

        #control-panel {
            background:
                linear-gradient(180deg, rgba(19, 12, 31, 0.98), rgba(8, 7, 16, 0.98));
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .stream-chip {
            background: linear-gradient(180deg, rgba(11, 8, 18, 0.82), rgba(30, 20, 48, 0.82));
            border: 1px solid var(--panel-edge);
            box-shadow: 0 8px 18px rgba(0,0,0,0.28);
            backdrop-filter: blur(10px);
        }

        .hud-label {
            font-family: 'Chakra Petch', system-ui, sans-serif;
            letter-spacing: 0.12em;
        }

        .retro-data {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            letter-spacing: 0.04em;
            font-size: 0.92em;
        }

        /* Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Deck Button Styles */
        .deck-btn {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.1), transparent 35%),
                linear-gradient(145deg, #2a2a2e, #1f1f23);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 
                0 4px 0 #111, 
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 10px 22px rgba(0,0,0,0.24);
            border-radius: 16px;
            transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .deck-btn::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 15px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 45%);
            opacity: 0.9;
            pointer-events: none;
        }
        .deck-btn > * {
            position: relative;
            z-index: 1;
        }
        .deck-btn:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 0 0 #111;
            background: #18181b;
            filter: brightness(1.1);
        }
        
        /* Animations */
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; }
        }
        .float-text { animation: floatUp 0.8s ease-out forwards; }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-live { animation: pulse-live 1.5s infinite; }

        /* Mode Card Selection */
        .mode-card {
            transition: all 0.2s ease;
            border: 2px solid transparent;
            opacity: 0.6;
        }
        .mode-card.selected {
            border-color: var(--brand-main);
            background-color: rgba(145, 70, 255, 0.1);
            opacity: 1;
            transform: scale(1.02);
        }

        canvas {
            touch-action: none;
        }

        .title-marquee {
            font-family: 'Chakra Petch', system-ui, sans-serif;
            text-shadow:
                0 0 12px rgba(145, 70, 255, 0.6),
                0 4px 0 rgba(69, 16, 147, 0.9);
        }

        .stream-backdrop {
            background:
                radial-gradient(circle at top, rgba(145,70,255,0.35), transparent 45%),
                linear-gradient(180deg, rgba(5,5,5,0.15), rgba(5,5,5,0.9)),
                url('https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png') center/cover no-repeat;
        }

        .reaction-gif {
            position: absolute;
            width: 88px;
            height: 88px;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
            z-index: 25;
            background: rgba(10, 8, 18, 0.7);
        }

        .reaction-gif--attack {
            top: 18px;
            left: 18px;
        }

        .reaction-gif--hype {
            right: 18px;
            bottom: 18px;
        }

        .reaction-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .panel-shell {
            background: linear-gradient(180deg, rgba(24,24,27,0.95), rgba(14,14,16,0.98));
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.05),
                0 12px 28px rgba(0,0,0,0.28);
        }

        .modal-shell {
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            overflow: hidden;
        }

        .modal-shell__content {
            overflow-y: auto;
        }

        .modal-shell__actions {
            position: sticky;
            bottom: 0;
        }
        
        /* Language Select Reset */
        select {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: none;
            color: transparent;
        }
        select:focus {
            outline: none;
        }
    </style>
</head>
<body>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="w-full h-full flex flex-col max-w-md mx-auto bg-black relative shadow-2xl overflow-hidden">
        
        <!-- TOP: GAME VIEW (STREAM) -->
        <div id="stream-container" class="relative flex-grow-[6] bg-[#111] overflow-hidden border-b-4 border-[#222]">
            <canvas id="gameCanvas" class="block w-full h-full"></canvas>
            
            <!-- OVERLAY UI -->
            <div class="scanlines absolute inset-0 pointer-events-none"></div>
            
            <div id="ui-layer" class="absolute inset-0 z-20 flex flex-col justify-between p-3 pointer-events-none">
                <!-- Header -->
                <div class="flex justify-between items-start w-full">
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2">
                            <div class="stream-chip bg-red-600/85 text-white text-[10px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider animate-live hud-label">LIVE</div>
                            <div class="stream-chip text-white text-xs font-bold flex items-center gap-1 drop-shadow-md px-2 py-1 rounded-full">
                                <span class="text-red-500">●</span> <span id="viewers" class="retro-data">0</span>
                            </div>
                        </div>
                        <div id="stream-title" class="stream-chip text-white/90 font-bold text-xs tracking-tight drop-shadow-md px-2 py-1 rounded-full inline-flex w-fit max-w-full">Connecting...</div>
                    </div>
                    
                    <div class="flex flex-col items-end">
                        <div id="lbl-rank-hud" class="text-[9px] text-gray-300 font-bold uppercase tracking-widest hud-label">Global Rank</div>
                        <div class="text-2xl font-bold text-white italic leading-none hud-label">
                            #<span id="rank" class="text-yellow-300 retro-data">999</span>
                        </div>
                    </div>
                </div>

                <!-- Exit Button -->
                <button id="btn-exit" class="pointer-events-auto absolute top-3 right-3 w-8 h-8 bg-white/10 hover:bg-red-600/90 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/20 transition-colors z-50 active:scale-90">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>

                <!-- Footer Info -->
                <div class="mt-auto w-full flex items-end justify-between gap-2">
                    <!-- Joystick Hint (Only visible in Play Mode) -->
                    <div id="joystick-hint" class="stream-chip text-[9px] text-white/60 font-bold uppercase animate-pulse hidden px-2 py-1 rounded-full hud-label">
                        Drag to Move
                    </div>

                    <!-- Health Bar -->
                    <div class="flex-1 max-w-[180px] flex flex-col gap-1 items-end ml-auto">
                        <div class="flex items-center gap-2 text-xs font-bold text-white drop-shadow-md">
                            <span class="hud-label text-[9px] text-white/55">HP</span>
                            <span id="hp-text" class="retro-data text-lg leading-none text-green-300">100%</span>
                        </div>
                        <div class="w-full h-3 bg-gray-800/80 rounded-full overflow-hidden border border-cyan-200/15 backdrop-blur stream-chip">
                            <div id="hp-bar" class="h-full bg-gradient-to-r from-emerald-500 via-lime-300 to-cyan-300 w-full transition-all duration-300"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: attack/fail + hype -> catalogs/gifs.json; compact corners only to protect controls -->
            <img id="gif-attack" class="reaction-gif reaction-gif--attack" alt="Attack reaction overlay">
            <img id="gif-hype" class="reaction-gif reaction-gif--hype" alt="Hype reaction overlay">
            <!-- Popups Container -->
            <div id="popups" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>
        </div>

        <!-- BOTTOM: CONTROL DECK -->
        <div id="control-panel" class="flex-grow-[4] bg-[#0e0e10] flex flex-col p-3 pb-[max(1rem,env(safe-area-inset-bottom))] gap-3 shadow-[0_-4px_20px_rgba(0,0,0,0.5)] z-30 relative">
            
            <!-- Stats Bar -->
            <div class="panel-shell flex justify-between items-center px-3 py-2 rounded-lg">
                <div class="flex items-center gap-2">
                    <span id="lbl-donations" class="text-[10px] text-violet-200/50 font-bold uppercase tracking-widest hud-label">DONATIONS</span>
                    <span id="score" class="text-2xl retro-data font-bold text-emerald-300 drop-shadow-sm">$0</span>
                </div>
                <div id="hype-badge" class="hidden bg-yellow-300 text-black text-[10px] font-black px-2 py-0.5 rounded animate-bounce uppercase hud-label">
                    HYPE TRAIN!
                </div>
            </div>

            <!-- Buttons Grid -->
            <div id="controls-grid" class="flex-1 grid grid-cols-2 gap-2 h-full">
                <button class="deck-btn bg-green-900/40 border-b-4 border-green-700" onclick="Game.action('donate')">
                    <span class="text-2xl mb-1">💸</span>
                    <span id="lbl-btn-donate" class="text-xs font-bold text-green-200">DONATE</span>
                </button>
                <button class="deck-btn bg-orange-900/40 border-b-4 border-orange-700" onclick="Game.action('attack')">
                    <span class="text-2xl mb-1">⚔️</span>
                    <span id="lbl-btn-attack" class="text-xs font-bold text-orange-200">ATTACK</span>
                </button>
                <button class="deck-btn bg-yellow-900/40 border-b-4 border-yellow-700" onclick="Game.action('heal')">
                    <span class="text-2xl mb-1">🍕</span>
                    <span id="lbl-btn-heal" class="text-xs font-bold text-yellow-200">PIZZA</span>
                </button>
                <button class="deck-btn bg-purple-900/40 border-b-4 border-purple-700" onclick="Game.action('skin')">
                    <span class="text-2xl mb-1">🎭</span>
                    <span id="lbl-btn-skin" class="text-xs font-bold text-purple-200">STYLE</span>
                </button>
            </div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="fixed inset-0 z-50 bg-[#0e0e10] flex flex-col items-center justify-center p-6 text-center overflow-y-auto">
        <div class="absolute inset-0 stream-backdrop opacity-30"></div>
        
        <!-- Language Selector (10 Languages) -->
        <div class="absolute top-6 right-6 z-50">
            <div class="relative bg-black/50 backdrop-blur border border-white/20 text-white px-3 py-1.5 rounded-full text-xs font-bold hover:bg-white/10 transition-colors flex items-center gap-2 shadow-lg">
                <!-- Visual Display -->
                <span id="lang-flag" class="text-base">🇺🇸</span>
                <span id="lang-code" class="uppercase">EN</span>
                <span class="text-[8px] opacity-50">▼</span>
                
                <!-- Native Select Overlay (Invisible but clickable) -->
                <select id="lang-select" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
        </div>

        <div class="relative z-10 w-full max-w-sm flex flex-col gap-6 my-auto">
            <div class="flex flex-col items-center">
                <div class="mb-3 text-6xl" aria-hidden="true">🕹️✨</div>
                <h1 class="title-marquee text-5xl font-bold text-white mb-2 leading-none">
                    ARENA<br><span class="text-[#67e8f9]">CHANNEL</span>
                </h1>
                <div id="lbl-subtitle" class="text-[10px] text-gray-400 uppercase tracking-[0.3em] font-bold">Broadcast Battle Sim</div>
            </div>

            <div class="panel-shell backdrop-blur p-5 rounded-2xl flex flex-col gap-4 text-left">
                <div>
                    <label id="lbl-channel-name" class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Channel Name</label>
                    <input type="text" id="input-name" value="ProGamer_99" maxlength="12" class="w-full bg-black border border-gray-700 rounded-lg px-3 py-3 text-white font-mono focus:border-[#9146FF] outline-none transition-colors">
                </div>

                <label id="lbl-select-mode" class="text-[10px] font-bold text-gray-500 uppercase block mt-2">Select Mode</label>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Streamer Mode (Play) -->
                    <div id="mode-play" class="mode-card selected bg-[#2a2a2e] p-3 rounded-xl cursor-pointer" onclick="UI.selectMode('play')">
                        <div class="text-2xl mb-1">🎮</div>
                        <div id="lbl-mode-play" class="text-xs font-bold text-white">Streamer</div>
                        <div id="lbl-mode-play-desc" class="text-[9px] text-gray-400 leading-tight mt-1">You play. Manual control.</div>
                    </div>
                    <!-- Viewer Mode (Watch) -->
                    <div id="mode-watch" class="mode-card bg-[#2a2a2e] p-3 rounded-xl cursor-pointer" onclick="UI.selectMode('watch')">
                        <div class="text-2xl mb-1">📺</div>
                        <div id="lbl-mode-watch" class="text-xs font-bold text-white">Viewer</div>
                        <div id="lbl-mode-watch-desc" class="text-[9px] text-gray-400 leading-tight mt-1">AI plays. You watch & help.</div>
                    </div>
                </div>
            </div>

            <button id="btn-start" class="w-full bg-green-600 hover:bg-green-500 text-white font-black text-2xl py-5 rounded-xl shadow-[0_4px_0_#15803d] active:translate-y-1 active:shadow-none transition-all uppercase tracking-wide flex items-center justify-center gap-3">
                <span class="text-3xl">▶</span> <span id="lbl-btn-start">GO LIVE</span>
            </button>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="hidden fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-6 text-center backdrop-blur-md">
        <div class="modal-shell w-full items-center">
        <h2 id="lbl-offline" class="text-6xl font-bold text-red-400 mb-2 -rotate-2 drop-shadow-lg hud-label">SIGNAL LOST</h2>
        
        <div class="panel-shell modal-shell__content p-6 rounded-2xl w-full max-w-xs mb-8 shadow-2xl">
            <div id="lbl-total-donations" class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Total Donations</div>
            <div class="text-4xl font-mono font-bold text-green-400 mb-6" id="final-score">$0</div>
            
            <div class="flex justify-between border-t border-white/10 pt-4 gap-4">
                <div class="text-left">
                    <div id="lbl-final-rank" class="text-[10px] text-gray-500 uppercase">Rank</div>
                    <div class="text-xl font-bold text-white" id="final-rank">#--</div>
                </div>
                <div class="text-right">
                    <div id="lbl-peak-viewers" class="text-[10px] text-gray-500 uppercase">Peak Viewers</div>
                    <div class="text-xl font-bold text-white" id="final-viewers">0</div>
                </div>
            </div>
        </div>

        <div class="modal-shell__actions w-full flex flex-col items-center">
        <button id="btn-restart" class="w-full max-w-xs bg-[#9146FF] hover:bg-[#7c3aed] text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all uppercase hud-label">
            Start New Stream
        </button>
        <button id="btn-menu" class="mt-4 text-xs text-gray-500 hover:text-white underline">Back to Menu</button>
        </div>
        </div>
    </div>

    <script>
        /* =========================================
           LANGUAGE SYSTEM (10 LANGUAGES)
           ========================================= */
        const Lang = {
            current: 'en',
            flags: {
                en: '🇺🇸', es: '🇪🇸', fr: '🇫🇷', de: '🇩🇪', it: '🇮🇹',
                pt: '🇧🇷', ru: '🇷🇺', ja: '🇯🇵', ko: '🇰🇷', zh: '🇨🇳'
            },
            data: {
                en: {
                    subtitle: "Broadcast Battle Sim", channelName: "Channel Name", selectMode: "Select Mode",
                    modePlay: "Pilot", modePlayDesc: "You steer the avatar manually.",
                    modeWatch: "Director", modeWatchDesc: "Auto-pilot runs. You trigger boosts.",
                    btnStart: "START SHOW", connecting: "Signal syncing...", rankHud: "Arena Rank",
                    dragHint: "Drag to Move", donations: "SUPPORT",
                    btnDonate: "BOOST", btnAttack: "BLAST", btnHeal: "PATCH", btnSkin: "SWAP",
                    offline: "SIGNAL LOST", totalDonations: "Total Support", finalRank: "Rank",
                    peakViewers: "Peak Crowd", btnRestart: "Run It Again", btnMenu: "Back to Menu",
                    popDonate: "BOOST +500", popHeal: "PATCHED!", popAttack: "CROWD BLAST!", popSkin: "NEW LOADOUT!",
                    streamTitleSuffix: " // live run"
                }
            },

            init() {
                const select = document.getElementById('lang-select');
                select.addEventListener('change', (e) => {
                    this.set(e.target.value);
                });
                this.set('en'); // Default
            },

            set(langCode) {
                if (!this.data[langCode]) return;
                this.current = langCode;
                
                // Update UI Display
                document.getElementById('lang-flag').innerText = this.flags[langCode];
                document.getElementById('lang-code').innerText = langCode.toUpperCase();
                
                this.apply();
            },

            get(key) {
                return this.data[this.current][key] || key;
            },

            apply() {
                const d = this.data[this.current];
                const map = {
                    'lbl-subtitle': 'subtitle',
                    'lbl-channel-name': 'channelName',
                    'lbl-select-mode': 'selectMode',
                    'lbl-mode-play': 'modePlay',
                    'lbl-mode-play-desc': 'modePlayDesc',
                    'lbl-mode-watch': 'modeWatch',
                    'lbl-mode-watch-desc': 'modeWatchDesc',
                    'lbl-btn-start': 'btnStart',
                    'stream-title': 'connecting',
                    'lbl-rank-hud': 'rankHud',
                    'joystick-hint': 'dragHint',
                    'lbl-donations': 'donations',
                    'lbl-btn-donate': 'btnDonate',
                    'lbl-btn-attack': 'btnAttack',
                    'lbl-btn-heal': 'btnHeal',
                    'lbl-btn-skin': 'btnSkin',
                    'lbl-offline': 'offline',
                    'lbl-total-donations': 'totalDonations',
                    'lbl-final-rank': 'finalRank',
                    'lbl-peak-viewers': 'peakViewers',
                    'btn-restart': 'btnRestart',
                    'btn-menu': 'btnMenu'
                };

                for (const [id, key] of Object.entries(map)) {
                    const el = document.getElementById(id);
                    if (el) el.innerText = d[key];
                }
            }
        };

        /* =========================================
           AUDIO SYSTEM
           ========================================= */
        const AudioSys = {
            sounds: {},
            bgm: null,
            muted: false,
            unlocked: false,
            soundVolumes: {
                donate: 0.45,
                heal: 0.42,
                hit: 0.35,
                fail: 0.5,
                shoot: 0.28,
                attack: 0.4,
                skin: 0.34,
                start: 0.45
            },
            lastPlayed: {},
            init() {
                const assets = {
                    bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
                    donate: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                    heal: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3",
                    hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                    fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                    shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                    attack: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3",
                    skin: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                    start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3"
                };

                this.bgm = new Audio(assets.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.22;
                this.bgm.preload = 'auto';

                Object.entries(assets).forEach(([key, src]) => {
                    if (key === 'bgm') return;
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    this.sounds[key] = audio;
                });
            },
            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                if (this.bgm) {
                    this.bgm.load();
                }
                Object.values(this.sounds).forEach(sound => sound.load());
            },
            play(key, cooldown = 90) {
                if (this.muted || !this.unlocked || !this.sounds[key]) return;
                const now = performance.now();
                if ((this.lastPlayed[key] || 0) + cooldown > now) return;
                this.lastPlayed[key] = now;

                const base = this.sounds[key];
                const clone = base.cloneNode();
                clone.volume = this.soundVolumes[key] ?? 0.4;
                clone.play().catch(() => {});
            },
            playBGM() {
                if (!this.unlocked || this.muted || !this.bgm) return;
                this.bgm.play().catch(() => {});
            },
            stopBGM(reset = true) {
                if (!this.bgm) return;
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }
        };

        /* =========================================
           JOYSTICK SYSTEM (Touch Control)
           ========================================= */
        const Joystick = {
            active: false,
            origin: { x: 0, y: 0 },
            current: { x: 0, y: 0 },
            vector: { x: 0, y: 0 },
            radius: 50,
            touchId: null,

            init(canvas) {
                canvas.addEventListener('touchstart', (e) => this.start(e), { passive: false });
                canvas.addEventListener('touchmove', (e) => this.move(e), { passive: false });
                canvas.addEventListener('touchend', (e) => this.end(e), { passive: false });
                canvas.addEventListener('touchcancel', (e) => this.end(e), { passive: false });
            },

            start(e) {
                e.preventDefault();
                if (this.active) return;
                const touch = e.changedTouches[0];
                this.touchId = touch.identifier;
                this.active = true;
                
                const rect = e.target.getBoundingClientRect();
                this.origin.x = touch.clientX - rect.left;
                this.origin.y = touch.clientY - rect.top;
                this.current.x = this.origin.x;
                this.current.y = this.origin.y;
                this.vector = { x: 0, y: 0 };
            },

            move(e) {
                e.preventDefault();
                if (!this.active) return;
                
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === this.touchId) {
                        const touch = e.changedTouches[i];
                        const rect = e.target.getBoundingClientRect();
                        const x = touch.clientX - rect.left;
                        const y = touch.clientY - rect.top;

                        const dx = x - this.origin.x;
                        const dy = y - this.origin.y;
                        const dist = Math.hypot(dx, dy);
                        
                        const maxDist = this.radius;
                        const scale = dist > maxDist ? maxDist / dist : 1;
                        
                        this.current.x = this.origin.x + dx * scale;
                        this.current.y = this.origin.y + dy * scale;

                        this.vector.x = (this.current.x - this.origin.x) / maxDist;
                        this.vector.y = (this.current.y - this.origin.y) / maxDist;
                        break;
                    }
                }
            },

            end(e) {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === this.touchId) {
                        this.active = false;
                        this.touchId = null;
                        this.vector = { x: 0, y: 0 };
                        break;
                    }
                }
            },

            draw(ctx) {
                if (!this.active) return;
                
                ctx.beginPath();
                ctx.arc(this.origin.x, this.origin.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.current.x, this.current.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(145, 70, 255, 0.8)';
                ctx.fill();
            }
        };

        /* =========================================
           GAME ENGINE
           ========================================= */
        const Game = {
            active: false,
            mode: 'play',
            width: 0,
            height: 0,
            lastTime: 0,
            
            score: 0,
            rank: 999,
            viewers: 100,
            name: "Player",
            
            player: { x: 0, y: 0, r: 15, hp: 100, color: '#9146FF', speed: 220, mood: 0 },
            enemies: [],
            projectiles: [],
            particles: [],
            
            spawnTimer: 0,
            shootTimer: 0,
            viewerTimer: 0,

            init() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                Joystick.init(this.canvas);
                AudioSys.init();
                Lang.init(); // Initialize 10-language system
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                UI.init();
            },

            resize() {
                const container = document.getElementById('stream-container');
                this.width = container.clientWidth;
                this.height = container.clientHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            },

            start(mode, name) {
                this.mode = mode;
                this.name = name || "Streamer";
                this.active = true;
                
                this.score = 0;
                this.rank = 999;
                this.viewers = 100;
                this.player.hp = 100;
                this.player.x = this.width / 2;
                this.player.y = this.height / 2;
                this.player.color = '#9146FF';
                this.enemies = [];
                this.projectiles = [];
                this.particles = [];
                
                // Localized Title
                document.getElementById('stream-title').innerText = `${this.name}${Lang.get('streamTitleSuffix')}`;
                document.getElementById('joystick-hint').classList.toggle('hidden', mode !== 'play');
                
                AudioSys.playBGM();
                this.lastTime = performance.now();
                requestAnimationFrame(t => this.loop(t));
            },

            loop(timestamp) {
                if (!this.active) return;
                const dt = (timestamp - this.lastTime) / 1000;
                this.lastTime = timestamp;

                this.update(dt);
                this.draw();
                requestAnimationFrame(t => this.loop(t));
            },

            update(dt) {
                this.spawnTimer += dt;
                const difficulty = Math.min(1.5, this.score / 20000);
                const spawnRate = Math.max(0.3, 1.5 - difficulty);
                
                if (this.spawnTimer > spawnRate) {
                    this.spawnEnemy();
                    this.spawnTimer = 0;
                }

                if (this.mode === 'play') {
                    if (Joystick.active) {
                        this.player.x += Joystick.vector.x * this.player.speed * dt;
                        this.player.y += Joystick.vector.y * this.player.speed * dt;
                    }
                } else {
                    let nearest = null;
                    let minDist = 200;
                    
                    this.enemies.forEach(e => {
                        const d = Math.hypot(e.x - this.player.x, e.y - this.player.y);
                        if (d < minDist) { minDist = d; nearest = e; }
                    });

                    let dx = 0, dy = 0;
                    if (nearest) {
                        const angle = Math.atan2(nearest.y - this.player.y, nearest.x - this.player.x);
                        dx = -Math.cos(angle); 
                        dy = -Math.sin(angle);
                    } else {
                        const cx = this.width / 2, cy = this.height / 2;
                        if (Math.hypot(cx - this.player.x, cy - this.player.y) > 50) {
                            const angle = Math.atan2(cy - this.player.y, cx - this.player.x);
                            dx = Math.cos(angle); dy = Math.sin(angle);
                        }
                    }
                    this.player.x += dx * this.player.speed * dt;
                    this.player.y += dy * this.player.speed * dt;
                }

                this.player.x = Math.max(this.player.r, Math.min(this.width - this.player.r, this.player.x));
                this.player.y = Math.max(this.player.r, Math.min(this.height - this.player.r, this.player.y));

                this.shootTimer += dt;
                if (this.shootTimer > 0.4) {
                    const target = this.findNearestEnemy();
                    if (target) {
                        const angle = Math.atan2(target.y - this.player.y, target.x - this.player.x);
                        this.projectiles.push({
                            x: this.player.x, y: this.player.y,
                            vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
                            life: 2, color: '#00ff9d', size: 4
                        });
                        this.player.mood = Math.min(1, this.player.mood + 0.18);
                        AudioSys.play('shoot', 120);
                        this.shootTimer = 0;
                    }
                }

                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];
                    p.x += p.vx * dt * 60;
                    p.y += p.vy * dt * 60;
                    p.life -= dt;

                    let hit = false;
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        const e = this.enemies[j];
                        if (Math.hypot(p.x - e.x, p.y - e.y) < (p.size + e.r)) {
                            e.hp -= 35;
                            hit = true;
                            this.spawnParticles(e.x, e.y, '#FFF', 2);
                            this.player.mood = Math.min(1, this.player.mood + 0.1);
                            
                            if (e.hp <= 0) {
                                this.spawnParticles(e.x, e.y, e.color, 5);
                                this.enemies.splice(j, 1);
                                this.addScore(100);
                            }
                            break;
                        }
                    }
                    if (hit || p.life <= 0) this.projectiles.splice(i, 1);
                }

                this.enemies.forEach(e => {
                    const angle = Math.atan2(this.player.y - e.y, this.player.x - e.x);
                    e.x += Math.cos(angle) * e.speed * dt * 60;
                    e.y += Math.sin(angle) * e.speed * dt * 60;

                        if (Math.hypot(this.player.x - e.x, this.player.y - e.y) < (this.player.r + e.r)) {
                            this.player.hp -= 25 * dt;
                            this.player.mood = Math.max(-1, this.player.mood - 0.04);
                            if (Math.random() < 0.1) {
                                this.spawnParticles(this.player.x, this.player.y, '#FF0000', 2);
                                AudioSys.play('hit', 180);
                            }
                        }
                    });

                    this.player.mood *= 0.95;

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= dt;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }

                if (this.player.hp <= 0) this.endGame();

                this.viewerTimer += dt;
                if (this.viewerTimer > 1) {
                    this.viewers += Math.floor((Math.random() - 0.3) * 10);
                    if (this.viewers < 0) this.viewers = 0;
                    this.addScore(10);
                    this.viewerTimer = 0;
                }
                UI.updateHUD();
            },

            draw() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.width, this.height);

                ctx.strokeStyle = '#222';
                ctx.lineWidth = 1;
                const gridSize = 40;
                const offset = (Date.now() / 50) % gridSize;
                ctx.beginPath();
                for (let x = 0; x <= this.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, this.height); }
                for (let y = offset - gridSize; y <= this.height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(this.width, y); }
                ctx.stroke();

                ctx.save();
                ctx.translate(this.player.x, this.player.y);

                const moodLift = this.player.mood * 1.5;
                const auraPulse = 12 + Math.sin(Date.now() / 150) * 4;
                ctx.shadowBlur = 18 + auraPulse;
                ctx.shadowColor = this.player.color;
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath();
                ctx.arc(0, 0, this.player.r + 9, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = this.player.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.player.r + 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#14071f';
                ctx.beginPath();
                ctx.arc(0, 0, this.player.r - 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-5, -3 - moodLift, 2.5, 0, Math.PI * 2);
                ctx.arc(5, -3 - moodLift, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                if (this.player.mood >= 0) {
                    ctx.arc(0, 4, 6, 0.2, Math.PI - 0.2, false);
                } else {
                    ctx.arc(0, 12, 6, Math.PI + 0.2, -0.2, true);
                }
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.fillRect(-11, -this.player.r - 8, 22, 4);
                ctx.restore();

                this.enemies.forEach(e => {
                    ctx.fillStyle = e.color;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(0,0,0,0.28)';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y + 2, e.r - 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fff5f5';
                    ctx.beginPath();
                    ctx.arc(e.x - 4, e.y - 3, 2, 0, Math.PI * 2);
                    ctx.arc(e.x + 4, e.y - 3, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#2b0b0b';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(e.x - 5, e.y + 5);
                    ctx.lineTo(e.x, e.y + 1);
                    ctx.lineTo(e.x + 5, e.y + 5);
                    ctx.stroke();

                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.moveTo(e.x - 7, e.y - 8);
                    ctx.lineTo(e.x - 1, e.y - 11);
                    ctx.lineTo(e.x - 2, e.y - 5);
                    ctx.moveTo(e.x + 7, e.y - 8);
                    ctx.lineTo(e.x + 1, e.y - 11);
                    ctx.lineTo(e.x + 2, e.y - 5);
                    ctx.stroke();
                });

                this.projectiles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                });

                this.particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1;
                });

                if (this.mode === 'play') {
                    Joystick.draw(ctx);
                }
            },

            spawnEnemy() {
                const edge = Math.floor(Math.random() * 4);
                const r = 12;
                let x, y;
                if (edge === 0) { x = Math.random() * this.width; y = -r; }
                else if (edge === 1) { x = this.width + r; y = Math.random() * this.height; }
                else if (edge === 2) { x = Math.random() * this.width; y = this.height + r; }
                else { x = -r; y = Math.random() * this.height; }

                this.enemies.push({
                    x, y, r,
                    hp: 50,
                    speed: 1.5 + (Math.random() * 0.5) + (this.score / 50000),
                    color: Math.random() > 0.5 ? '#ef4444' : '#f59e0b'
                });
            },

            findNearestEnemy() {
                let target = null;
                let minDist = 300;
                this.enemies.forEach(e => {
                    const d = Math.hypot(e.x - this.player.x, e.y - this.player.y);
                    if (d < minDist) { minDist = d; target = e; }
                });
                return target;
            },

            spawnParticles(x, y, color, count) {
                for(let i=0; i<count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 0.5 + Math.random() * 0.5,
                        color
                    });
                }
            },

            addScore(amt) {
                this.score += amt;
                const ranks = [999, 500, 100, 50, 20, 10, 5, 1];
                const tier = Math.floor(this.score / 5000);
                this.rank = ranks[Math.min(tier, ranks.length - 1)];
            },

            action(type) {
                if (!this.active) return;
                
                if (type === 'donate') {
                    this.addScore(500);
                    AudioSys.play('donate', 120);
                    UI.showPopup(`${Lang.get('popDonate')}: $500`, this.player.x, this.player.y - 40, '#22c55e');
                    UI.flashGif('hype');
                } 
                else if (type === 'heal') {
                    this.player.hp = Math.min(100, this.player.hp + 30);
                    AudioSys.play('heal', 140);
                    UI.showPopup(Lang.get('popHeal'), this.player.x, this.player.y - 40, '#eab308');
                    this.spawnParticles(this.player.x, this.player.y, '#eab308', 10);
                    UI.flashGif('hype');
                } 
                else if (type === 'attack') {
                    this.enemies.forEach(e => {
                        e.hp -= 100;
                        this.spawnParticles(e.x, e.y, '#ef4444', 5);
                    });
                    this.enemies = this.enemies.filter(e => e.hp > 0);
                    AudioSys.play('attack', 180);
                    UI.showPopup(Lang.get('popAttack'), this.player.x, this.player.y - 40, '#ef4444');
                    UI.flashGif('attack');
                }
                else if (type === 'skin') {
                    const colors = ['#9146FF', '#3b82f6', '#ec4899', '#14b8a6'];
                    this.player.color = colors[Math.floor(Math.random() * colors.length)];
                    this.player.mood = Math.min(1, this.player.mood + 0.3);
                    AudioSys.play('skin', 120);
                    UI.showPopup(Lang.get('popSkin'), this.player.x, this.player.y - 40, '#a855f7');
                }
            },

            endGame() {
                this.active = false;
                AudioSys.stopBGM();
                AudioSys.play('fail', 250);
                UI.flashGif('attack');
                UI.showGameOver();
            }
        };

        /* =========================================
           UI MANAGER
           ========================================= */
        const UI = {
            selectedMode: 'play',
            gifTimers: {},
            gifMap: {
                attack: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                hype: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
            },

            init() {
                document.getElementById('gif-attack').src = this.gifMap.attack;
                document.getElementById('gif-hype').src = this.gifMap.hype;

                document.getElementById('btn-start').onclick = () => {
                    const name = document.getElementById('input-name').value;
                    AudioSys.unlock();
                    AudioSys.play('start', 250);
                    document.getElementById('start-screen').classList.add('hidden');
                    Game.start(this.selectedMode, name);
                };

                document.getElementById('btn-restart').onclick = () => {
                    AudioSys.unlock();
                    AudioSys.play('start', 250);
                    document.getElementById('game-over-screen').classList.add('hidden');
                    Game.start(this.selectedMode, Game.name);
                };

                document.getElementById('btn-menu').onclick = () => {
                    document.getElementById('game-over-screen').classList.add('hidden');
                    AudioSys.stopBGM();
                    document.getElementById('start-screen').classList.remove('hidden');
                };

                document.getElementById('btn-exit').onclick = () => {
                    Game.active = false;
                    AudioSys.stopBGM();
                    document.getElementById('start-screen').classList.remove('hidden');
                };
            },

            selectMode(mode) {
                this.selectedMode = mode;
                document.querySelectorAll('.mode-card').forEach(el => el.classList.remove('selected'));
                document.getElementById(`mode-${mode}`).classList.add('selected');
            },

            updateHUD() {
                document.getElementById('score').innerText = '$' + Game.score.toLocaleString();
                document.getElementById('rank').innerText = Game.rank;
                document.getElementById('viewers').innerText = Game.viewers.toLocaleString();
                
                const hpPct = Math.max(0, Game.player.hp);
                document.getElementById('hp-bar').style.width = hpPct + '%';
                document.getElementById('hp-text').innerText = Math.floor(hpPct) + '%';
                
                if (Game.rank <= 10) {
                    document.getElementById('hype-badge').classList.remove('hidden');
                } else {
                    document.getElementById('hype-badge').classList.add('hidden');
                }
            },

            showPopup(text, x, y, color) {
                const el = document.createElement('div');
                el.className = 'absolute font-black text-sm float-text drop-shadow-md whitespace-nowrap z-40 hud-label';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.color = color;
                el.innerText = text;
                document.getElementById('popups').appendChild(el);
                setTimeout(() => el.remove(), 800);
            },

            flashGif(type) {
                const el = document.getElementById(type === 'attack' ? 'gif-attack' : 'gif-hype');
                if (!el) return;
                el.classList.add('is-visible');
                clearTimeout(this.gifTimers[type]);
                this.gifTimers[type] = setTimeout(() => el.classList.remove('is-visible'), 950);
            },

            showGameOver() {
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = '$' + Game.score.toLocaleString();
                document.getElementById('final-rank').innerText = '#' + Game.rank;
                document.getElementById('final-viewers').innerText = Game.viewers.toLocaleString();
            }
        };

        window.addEventListener('DOMContentLoaded', () => Game.init());

    </script>
