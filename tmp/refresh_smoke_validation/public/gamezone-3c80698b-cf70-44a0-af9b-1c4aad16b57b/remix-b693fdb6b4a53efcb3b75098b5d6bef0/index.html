<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idle Vault Tycoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: display/accent/ui -> Orbitron, Bangers, Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Bangers&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0f1736;
            --bg-bottom: #030712;
            --panel: rgba(10, 18, 38, 0.82);
            --panel-strong: rgba(14, 25, 52, 0.94);
            --panel-soft: rgba(15, 27, 54, 0.62);
            --line: rgba(123, 207, 255, 0.34);
            --line-strong: rgba(255, 220, 112, 0.48);
            --gold: #ffd760;
            --gold-strong: #ffef9f;
            --cyan: #85f6ff;
            --cyan-strong: #2bd2ff;
            --ink: #04111f;
            --danger: #ff6c7f;
            --text: #f4fbff;
            --muted: #b9d4ea;
            --vault-red: #ff6f61;
            --vault-green: #44d493;
            --vault-blue: #58a8ff;
            --shadow: 0 14px 36px rgba(0, 0, 0, 0.32);
            --outer-glow: 0 0 24px rgba(43, 210, 255, 0.24);
            --font-display: 'Orbitron', sans-serif;
            --font-accent: 'Bangers', cursive;
            --font-ui: 'Exo 2', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-ui);
        }

        html, body {
            height: 100%;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(76, 162, 255, 0.28), transparent 38%),
                radial-gradient(circle at 20% 20%, rgba(255, 215, 96, 0.16), transparent 22%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text);
            overflow: hidden;
            touch-action: manipulation;
            width: 100vw;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.42;
            mix-blend-mode: soft-light;
        }

        #start-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(95, 212, 255, 0.25), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 206, 93, 0.2), transparent 28%),
                linear-gradient(180deg, #101936, #040711 72%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 28px 18px;
            z-index: 2000;
            overflow: hidden;
        }

        #start-screen::before,
        #start-screen::after {
            content: '💠';
            position: absolute;
            font-size: clamp(52px, 11vw, 110px);
            opacity: 0.15;
            filter: drop-shadow(0 0 20px rgba(43, 210, 255, 0.45));
            animation: driftGlyph 7s ease-in-out infinite;
        }

        #start-screen::before {
            top: 10%;
            left: 8%;
        }

        #start-screen::after {
            right: 10%;
            bottom: 11%;
            content: '🔐';
            animation-delay: -2.4s;
        }

        .start-marquee {
            font-family: var(--font-accent);
            font-size: clamp(22px, 6vw, 42px);
            color: var(--gold);
            letter-spacing: 1px;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.24), 0 0 22px rgba(255, 215, 96, 0.26);
            transform: rotate(-2deg);
        }

        .start-card {
            width: min(100%, 420px);
            padding: 24px 20px 20px;
            border-radius: 26px;
            background: linear-gradient(180deg, rgba(11, 23, 48, 0.92), rgba(6, 13, 29, 0.95));
            border: 1px solid rgba(134, 227, 255, 0.32);
            box-shadow: var(--shadow), var(--outer-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .start-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 34%, transparent 66%, rgba(255, 215, 96, 0.12));
            pointer-events: none;
        }

        .hero-vault {
            position: relative;
            width: 158px;
            height: 158px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 35% 30%, #fff7c9 0%, #ffd760 22%, #d38a20 58%, #7a3b10 100%);
            box-shadow:
                inset 0 4px 12px rgba(255, 255, 255, 0.42),
                inset 0 -10px 16px rgba(74, 26, 4, 0.34),
                0 0 0 8px rgba(14, 25, 52, 0.7),
                0 0 0 14px rgba(133, 246, 255, 0.12),
                0 18px 40px rgba(0, 0, 0, 0.45);
            animation: heroVaultPulse 2.6s ease-in-out infinite;
        }

        .hero-vault::before {
            content: '🤖';
            position: absolute;
            font-size: 54px;
            top: 22px;
            filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.28));
        }

        .hero-vault::after {
            content: '🔐';
            position: absolute;
            font-size: 34px;
            bottom: 24px;
            filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.28));
        }

        .start-title {
            font-family: var(--font-display);
            font-size: clamp(28px, 8vw, 42px);
            color: var(--text);
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.28), 0 0 20px rgba(43, 210, 255, 0.24);
            margin-bottom: 10px;
            line-height: 1.02;
        }

        .start-subtitle {
            font-size: 17px;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-bottom: 18px;
        }

        .start-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .start-buttons button {
            min-height: 58px;
            font-size: 20px;
            font-family: var(--font-accent);
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffb44c, #ff7a1c);
            border: 2px solid rgba(255, 226, 154, 0.66);
            border-radius: 16px;
            color: #fffdf6;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            text-shadow: 0 2px 0 rgba(73, 27, 2, 0.36);
            box-shadow: 0 10px 22px rgba(255, 122, 28, 0.28);
        }

        .start-buttons button:active {
            transform: scale(0.96);
        }

        .start-buttons button:hover {
            filter: brightness(1.06);
        }

        #continue-btn {
            background: linear-gradient(180deg, #48e0ab, #179b79);
            box-shadow: 0 10px 22px rgba(23, 155, 121, 0.28);
            border-color: rgba(197, 255, 235, 0.62);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 14px 18px;
            background:
                radial-gradient(circle at top, rgba(62, 179, 255, 0.18), transparent 28%),
                linear-gradient(180deg, rgba(11, 20, 42, 0.72), rgba(2, 5, 14, 0.92));
            overflow: hidden;
        }

        #game-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 54%, rgba(255, 215, 96, 0.09), transparent 16%),
                radial-gradient(circle at 50% 58%, rgba(43, 210, 255, 0.08), transparent 26%);
            pointer-events: none;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 12px;
            background: linear-gradient(180deg, rgba(12, 24, 48, 0.88), rgba(8, 16, 34, 0.88));
            border-radius: 18px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1000;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }

        #money-display {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 10px;
            font-family: var(--font-display);
            font-size: clamp(18px, 4.4vw, 28px);
            color: var(--gold);
            text-shadow: 0 0 14px rgba(255, 215, 96, 0.22);
        }

        #money-icon {
            width: 34px;
            height: 34px;
            margin-right: 0;
            padding: 4px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(255,215,96,0.9) 32%, rgba(214,134,17,0.98) 70%);
            box-shadow: 0 0 0 2px rgba(255, 235, 168, 0.2), 0 0 18px rgba(255, 205, 83, 0.32);
        }

        #money-amount {
            white-space: nowrap;
        }

        #shop-button {
            min-width: 112px;
            height: 50px;
            background: linear-gradient(180deg, rgba(63, 244, 255, 0.96), rgba(12, 154, 220, 0.95));
            border: 1px solid rgba(170, 250, 255, 0.7);
            border-radius: 15px;
            color: #03111f;
            font-family: var(--font-accent);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
            position: relative;
            padding: 10px 14px;
            text-shadow: none;
            box-shadow: 0 10px 20px rgba(12, 154, 220, 0.26);
        }

        #shop-button::before {
            content: '🧰';
            margin-right: 6px;
        }

        #shop-button.can-upgrade {
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 rgba(255, 215, 96, 0.12), 0 10px 20px rgba(12, 154, 220, 0.26); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 96, 0.45), 0 10px 20px rgba(12, 154, 220, 0.36); }
            100% { box-shadow: 0 0 0 rgba(255, 215, 96, 0.12), 0 10px 20px rgba(12, 154, 220, 0.26); }
        }

        #shop-button:active {
            transform: scale(0.95);
        }

        #mine-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 3;
        }

        .vault-stage {
            position: relative;
            width: min(84vw, 320px);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -6px;
            pointer-events: none;
        }

        .vault-stage::before,
        .vault-stage::after {
            content: '';
            position: absolute;
            inset: 8%;
            border-radius: 50%;
            border: 1px solid rgba(133, 246, 255, 0.16);
            box-shadow: 0 0 30px rgba(43, 210, 255, 0.08);
            animation: orbitPulse 4s ease-in-out infinite;
        }

        .vault-stage::after {
            inset: 2%;
            border-color: rgba(255, 215, 96, 0.14);
            animation-delay: -2s;
        }

        #mine-button {
            width: min(62vw, 220px);
            height: min(62vw, 220px);
            pointer-events: auto;
            background:
                radial-gradient(circle at 30% 25%, #fff8cd 0%, #ffd760 20%, #de9225 44%, #8a4714 72%, #52230a 100%);
            border: 7px solid rgba(255, 234, 171, 0.72);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.05s ease, filter 0.12s ease, box-shadow 0.2s ease;
            position: relative;
            touch-action: manipulation;
            box-shadow:
                inset 0 6px 10px rgba(255, 255, 255, 0.32),
                inset 0 -16px 24px rgba(77, 35, 8, 0.4),
                0 0 0 14px rgba(14, 25, 52, 0.72),
                0 0 0 24px rgba(43, 210, 255, 0.08),
                0 22px 36px rgba(0, 0, 0, 0.38);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #mine-button::before {
            content: '';
            position: absolute;
            inset: 16%;
            border-radius: 50%;
            border: 4px dashed rgba(7, 17, 31, 0.24);
            opacity: 0.82;
        }

        #mine-button::after {
            content: '🤖';
            position: absolute;
            top: 24%;
            font-size: clamp(42px, 12vw, 60px);
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.26));
        }

        .vault-core {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 32px;
        }

        .vault-core .tap-label {
            font-family: var(--font-accent);
            font-size: clamp(26px, 7vw, 38px);
            color: #211006;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(255, 249, 219, 0.42);
            line-height: 0.95;
        }

        .vault-core .tap-sub {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: rgba(20, 11, 5, 0.88);
        }

        #mine-button:active {
            transform: scale(0.97);
            filter: brightness(1.04);
        }

        .vault-sparks {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .vault-sparks span {
            position: absolute;
            font-size: 20px;
            opacity: 0.65;
            animation: sparkFloat 2.2s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(255, 215, 96, 0.32));
        }

        .vault-sparks span:nth-child(1) { left: 16%; top: 28%; animation-delay: 0s; }
        .vault-sparks span:nth-child(2) { right: 14%; top: 30%; animation-delay: 0.5s; }
        .vault-sparks span:nth-child(3) { left: 22%; bottom: 22%; animation-delay: 1s; }
        .vault-sparks span:nth-child(4) { right: 18%; bottom: 18%; animation-delay: 1.5s; }

        #coin-popup {
            position: absolute;
            font-size: 24px;
            color: var(--gold);
            font-weight: 700;
            font-family: var(--font-display);
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 16px rgba(255, 215, 96, 0.34);
        }

        #shop-panel {
            z-index: 900;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72%;
            background: linear-gradient(180deg, rgba(7, 15, 31, 0.98), rgba(4, 10, 22, 0.98));
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            padding: 18px 16px 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            border-top: 1px solid rgba(133, 246, 255, 0.24);
            box-shadow: 0 -14px 26px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(8px);
        }

        #shop-panel.open {
            transform: translateY(0);
        }

        #shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        #shop-title,
        #stats-title {
            font-family: var(--font-display);
            font-size: clamp(24px, 6vw, 30px);
            color: var(--gold);
            text-shadow: 0 0 14px rgba(255, 215, 96, 0.22);
            letter-spacing: 1px;
        }

        #close-shop {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 24px;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
        }

        .upgrade-item {
            background: linear-gradient(180deg, rgba(21, 36, 69, 0.9), rgba(10, 20, 43, 0.92));
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(123, 207, 255, 0.24);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
        }

        .upgrade-info {
            flex: 1;
            min-width: 0;
        }

        .upgrade-name {
            font-family: var(--font-display);
            font-size: clamp(18px, 4.8vw, 21px);
            margin-bottom: 4px;
            color: var(--cyan);
        }

        .upgrade-description {
            font-size: 16px;
            color: var(--muted);
            font-family: var(--font-ui);
        }

        .upgrade-level {
            font-size: 14px;
            color: #ff9baa;
            margin-top: 5px;
            font-weight: 600;
        }

        .upgrade-button {
            background: linear-gradient(180deg, #ffd760, #ff9a1f);
            border: 1px solid rgba(255, 236, 176, 0.66);
            border-radius: 12px;
            padding: 10px 12px;
            color: #2b1304;
            font-family: var(--font-accent);
            font-size: 18px;
            min-width: 110px;
            cursor: pointer;
            transition: filter 0.2s ease, transform 0.1s ease;
            line-height: 0.95;
            box-shadow: 0 10px 20px rgba(255, 154, 31, 0.18);
        }

        .upgrade-button:active {
            transform: scale(0.97);
        }

        .upgrade-button:disabled {
            background: linear-gradient(180deg, #53657d, #334255);
            border-color: rgba(176, 191, 205, 0.22);
            color: rgba(234, 243, 255, 0.75);
            cursor: not-allowed;
            box-shadow: none;
        }

        .upgrade-button:not(:disabled):hover {
            filter: brightness(1.05);
        }

        .upgrade-cost {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            margin-top: 6px;
            color: var(--gold-strong);
            font-weight: 600;
            font-size: 15px;
        }

        .upgrade-cost img {
            width: 18px;
            height: 18px;
            margin-right: 0;
            border-radius: 50%;
            padding: 2px;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.96), rgba(255,215,96,0.92) 34%, rgba(214,134,17,0.98) 72%);
        }

        #stats-section {
            margin-top: 6px;
            width: 100%;
            background: linear-gradient(180deg, rgba(14, 26, 55, 0.9), rgba(8, 17, 38, 0.9));
            border-radius: 16px;
            padding: 15px 14px;
            border: 1px solid rgba(255, 215, 96, 0.18);
        }

        #stats-title {
            margin-bottom: 10px;
            text-align: center;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
            font-family: var(--font-ui);
            font-size: 15px;
            align-items: center;
        }

        .stat-label {
            color: var(--muted);
        }

        .stat-value {
            color: var(--text);
            font-weight: 700;
            text-align: right;
        }

        #floating-coins {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #media-feedback {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 850;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(72px, 20vw, 112px);
            aspect-ratio: 1;
            object-fit: cover;
            opacity: 0;
            transform: scale(0.78) translateY(10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.3));
            border-radius: 18px;
            mix-blend-mode: screen;
        }

        .feedback-gif.show {
            opacity: 0.88;
            transform: scale(1) translateY(0);
        }

        #reward-gif {
            right: 12px;
            bottom: 116px;
        }

        #vault-gif {
            left: 10px;
            top: 92px;
        }

        .floating-coin {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        @keyframes pulse-title {
            0% { transform: scale(1); text-shadow: 0 3px 0 rgba(0,0,0,0.28), 0 0 18px rgba(43,210,255,0.22); }
            50% { transform: scale(1.04); text-shadow: 0 3px 0 rgba(0,0,0,0.28), 0 0 26px rgba(43,210,255,0.4); }
            100% { transform: scale(1); text-shadow: 0 3px 0 rgba(0,0,0,0.28), 0 0 18px rgba(43,210,255,0.22); }
        }

        @keyframes heroVaultPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.03); }
        }

        @keyframes driftGlyph {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }

        @keyframes orbitPulse {
            0%, 100% { transform: scale(1); opacity: 0.72; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.24; }
            50% { transform: translateY(-10px) scale(1.15); opacity: 0.85; }
        }

        @media (max-width: 600px) {
            .start-card {
                padding: 22px 16px 16px;
            }

            .start-subtitle {
                font-size: 15px;
            }

            #header {
                padding: 10px;
                margin-bottom: 12px;
            }

            #shop-button {
                min-width: 102px;
                font-size: 20px;
            }

            .upgrade-item {
                align-items: flex-start;
            }

            .upgrade-button {
                min-width: 96px;
                font-size: 16px;
                padding: 9px 10px;
            }

            .stat-item {
                font-size: 14px;
            }

            #shop-panel {
                height: 74%;
                padding: 16px 14px 18px;
            }

            #reward-gif {
                right: 8px;
                bottom: 126px;
            }

            #vault-gif {
                left: 8px;
                top: 106px;
            }
        }
    </style>
</head>
<body>
        <div id="start-screen">
            <div class="start-marquee">Cyber Vault Crew</div>
            <div class="start-card">
                <div class="hero-vault" aria-hidden="true"></div>
                <div class="start-title">Idle Vault Tycoon</div>
                <div class="start-subtitle">Guide your cheerful vault bot through a neon credit haul.</div>
                <div class="start-buttons">

        let loopAudio = null;
        const audioPools = {};

        function createAudioPool(url, volume, size = 3) {
            const clips = Array.from({ length: size }, () => {
                const audio = new Audio(url);
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            });
            return { clips, index: 0 };
        }

        function ensureAudio() {
            if (audioUnlocked) return;
            audioPools.tap = createAudioPool(APPROVED_MEDIA.audio.tap, 0.18, 3);
            audioPools.collect = createAudioPool(APPROVED_MEDIA.audio.collect, 0.28, 2);
            audioPools.blocked = createAudioPool(APPROVED_MEDIA.audio.blocked, 0.24, 2);
            audioPools.unlock = createAudioPool(APPROVED_MEDIA.audio.unlock, 0.34, 2);
            audioPools.menuOpen = createAudioPool(APPROVED_MEDIA.audio.menuOpen, 0.22, 2);
            audioPools.menuClose = createAudioPool(APPROVED_MEDIA.audio.menuClose, 0.22, 2);
            audioPools.start = createAudioPool(APPROVED_MEDIA.audio.start, 0.32, 1);
            loopAudio = new Audio(APPROVED_MEDIA.audio.loop);
            loopAudio.loop = true;
            loopAudio.preload = 'auto';
            loopAudio.volume = 0.18;
            audioUnlocked = true;
        }

        async function unlockAudio() {
            ensureAudio();
            audioEnabled = true;
            if (!loopStarted && loopAudio) {
                try {
                    await loopAudio.play();
                    loopStarted = true;
                } catch (err) {
                    audioEnabled = false;
                }
            }
        }

        function startLoopIfPossible() {
            if (!audioEnabled || !loopAudio) return;
            if (!loopStarted) {
                loopAudio.play().then(() => {
                    loopStarted = true;
                }).catch(() => {});
            }
        }

        function playSfx(name, cooldown = 0) {
            if (!audioEnabled || !audioPools[name]) return;
            if (cooldown) {
                const now = Date.now();
                if (name === 'tap' && now - lastTapSoundAt < cooldown) return;
                if (name === 'tap') lastTapSoundAt = now;
            }
            const pool = audioPools[name];
            const clip = pool.clips[pool.index];
            pool.index = (pool.index + 1) % pool.clips.length;
            try {
                clip.currentTime = 0;
                clip.play().catch(() => {});
            } catch (err) {}
        }

        function showFeedbackGif(element, duration = 900) {
            if (!element) return;
            clearTimeout(gifTimers[element.id]);

        // Prestige button will be added to the upgrades menu instead of as a floating button

        // Format large numbers with letter notation after trillion
        function formatNumber(num) {
            if (num < 1000) return num.toString().padStart(3, '0');
            if (num < 1000000) return (num / 1000).toFixed(1) + 'K';
            if (num < 1000000000) return (num / 1000000).toFixed(1) + 'M';
            if (num < 1000000000000) return (num / 1000000000).toFixed(1) + 'B';
            
            // After trillion, use letter notation (Aa, Ab, Ac, etc.)
            const alphabet = 'abcdefghijklmnopqrstuvwxyz';
            const tier = Math.floor(Math.log(num / 1000000000000) / Math.log(1000));
            const secondLetter = alphabet[tier % 26];
            const firstLetter = tier >= 26 ? alphabet[Math.floor(tier / 26) - 1].toUpperCase() : 'A';
            
            const scale = Math.pow(1000, tier + 1) * 1000000000000;
            const scaled = num / scale;
            
            return scaled.toFixed(2) + firstLetter + secondLetter;
        }

        // Check if any upgrades are affordable and highlight shop button if so
        function checkForAvailableUpgrades() {
            const canAffordAny = gameState.upgrades.some(upgrade => {
                // Skip if upgrade should be hidden
                if (upgrade.isVisible && !upgrade.isVisible()) {
                    return false;
                }
                // Skip if already at max level
                if (upgrade.level >= upgrade.maxLevel) {
                    return false;
                }
                // Check if player can afford it
                return gameState.money >= upgrade.getCost();
            });
            
            if (canAffordAny) {
                shopButton.classList.add('can-upgrade');
            } else {

        // Create a floating coin animation
        function createFloatingCoin(x, y) {
            const coin = document.createElement('img');
            coin.src = 'https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png';
            coin.className = 'floating-coin';
            coin.style.backgroundColor = '#f39c12';
            coin.style.borderRadius = '50%';
            coin.style.padding = '2px';
            coin.style.left = `${x - 15}px`;
            coin.style.top = `${y - 15}px`;
            
            floatingCoinsContainer.appendChild(coin);
            
            // Animate the coin
            const targetX = x + (Math.random() * 100 - 50);
            const targetY = y - 100 - Math.random() * 50;
            
            let startTime = null;
            const duration = 1000 + Math.random() * 500;
            
            function animateCoin(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function for smooth animation
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                // Calculate current position
                const currentX = x + (targetX - x) * easeOut;
                const currentY = y + (targetY - y) * easeOut;
                
                // Update position
                coin.style.left = `${currentX - 15}px`;
                coin.style.top = `${currentY - 15}px`;
                
                // Update opacity for fade-out effect
                coin.style.opacity = 1 - easeOut;
                
                if (progress < 1) {
                    requestAnimationFrame(animateCoin);
                } else {
                    floatingCoinsContainer.removeChild(coin);
                }
            }
            
            requestAnimationFrame(animateCoin);
        }

        // Show coin popup animation optimized for rapid clicking
        let popupTimeouts = [];
        function showCoinPopup(amount, clickCount) {
            // Clear any existing timeouts to prevent conflicts

                newPopup.style.left = `${buttonRect.left + buttonRect.width / 2 + offsetX}px`;
                newPopup.style.top = `${buttonRect.top + offsetY}px`;
                
                document.body.appendChild(newPopup);
                
                // Animate and remove
                let start = null;
                const duration = 500;
                
                function animatePopup(timestamp) {
                    if (!start) start = timestamp;
                    const progress = (timestamp - start) / duration;
                    
                    if (progress < 1) {
                        newPopup.style.opacity = 1 - progress;
                        newPopup.style.transform = `translateY(${-20 * progress}px)`;
                        popupTimeouts.push(requestAnimationFrame(animatePopup));
                    } else {
                        document.body.removeChild(newPopup);
                    }
                }
                
                popupTimeouts.push(requestAnimationFrame(animatePopup));
            } else {
                // Use the original popup for single clicks
                coinPopup.textContent = `+${formatNumber(amount)}`;
                coinPopup.style.opacity = 1;
                coinPopup.style.transform = 'translateY(0)';
                
                popupTimeouts.push(setTimeout(() => {
                    coinPopup.style.opacity = 0;
                    coinPopup.style.transform = 'translateY(-20px)';

            // Increment click counter for rapid click detection

            const amount = gameState.clickValue;
            gameState.money += amount;

            updateMoneyDisplay();
            playSfx('tap', 90);
            if (clickCount === 1 || clickCount % 8 === 0) {

            // Only update stats occasionally during rapid clicking to improve performance
            if (clickCount % 5 === 0 || timeSinceLastClick > 300) {
                updateStats();
            }
            
            // Show popup with earned amount (with different positions for rapid clicks)
            showCoinPopup(amount, clickCount);
            
            // Create floating coins
            const rect = mineButton.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Limit coin animations during rapid clicking for performance
            const numCoins = timeSinceLastClick < 100 ? 1 : Math.min(3, Math.max(1, Math.floor(amount / 5)));
            for (let i = 0; i < numCoins; i++) {
                const coin = document.createElement('img');
                coin.src = 'https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png';

                );
            }
            
            return false; // Prevent event propagation
        }
        
        // Add both click and touch events for better responsiveness
        mineButton.addEventListener('click', handleMineClick);
        // Toggle shop panel
        shopButton.addEventListener('click', () => {
            unlockAudio();
            playSfx('menuOpen');
            shopPanel.classList.add('open');
            renderUpgrades();
            // Remove the glow effect when shop is opened
            shopButton.classList.remove('can-upgrade');
        });

        closeShopButton.addEventListener('click', () => {
            playSfx('menuClose');
            shopPanel.classList.remove('open');
        });

        // Render upgrades in shop
        function renderUpgrades() {
            upgradesContainer.innerHTML = '';
            
            gameState.upgrades.forEach(upgrade => {
                // Check if upgrade should be visible
                if (upgrade.isVisible && !upgrade.isVisible()) {
                    return; // Skip this upgrade
                }
                
                const upgradeElement = document.createElement('div');
                upgradeElement.className = 'upgrade-item';
                
                const cost = upgrade.getCost();
                const canAfford = gameState.money >= cost;
                const isMaxLevel = upgrade.level >= upgrade.maxLevel;
                
                upgradeElement.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-name">${upgrade.name}</div>
                        <div class="upgrade-description">${upgrade.description}</div>
                        <div class="upgrade-level">Level: ${upgrade.level}${isMaxLevel ? ' (MAX)' : ''}</div>
                        <div class="upgrade-cost">
                            <img src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png" alt="">
                            ${isMaxLevel ? 'MAXED' : formatNumber(cost)}
                        </div>
                    </div>
                    <button class="upgrade-button" ${(!canAfford || isMaxLevel) ? 'disabled' : ''}>
                        ${isMaxLevel ? 'MAXED' : canAfford ? 'UNLOCK' : 'NEED MORE CREDITS'}
                    </button>
                `;
                
                if (!isMaxLevel) {
                    const button = upgradeElement.querySelector('.upgrade-button');
                    button.addEventListener('click', () => {
                        // Allow rapid clicking by removing the temporary disable
                        if (gameState.money >= cost) {
                            gameState.money -= cost;
                            upgrade.level++;
                            upgrade.effect();
                            updateMoneyDisplay();
                            renderUpgrades();
                            playSfx('unlock');
                            showFeedbackGif(rewardGif, 1100);
                        } else {
                            playSfx('blocked');
                        }
                    });
                }
                
                upgradesContainer.appendChild(upgradeElement);
            });
            
            // Prestige button removed
        }

        // Passive income update loop
        function updatePassiveIncome() {
            const now = Date.now();
            const deltaTime = (now - gameState.lastUpdate) / 1000; // Convert to seconds
            gameState.lastUpdate = now;
            
            if (gameState.passiveIncome > 0) {
                const income = gameState.passiveIncome * deltaTime;
                gameState.money += income;
                gameState.totalEarned += income;
                updateMoneyDisplay();
            }
        }

        // Game loop
        function gameLoop() {
            updatePassiveIncome();
            requestAnimationFrame(gameLoop);
        }

        // Add a money bag to the game
        function addMoneyBag(value = 100, type = 'red') {
            const bag = document.createElement('img');
            bag.src = 'https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png';
            bag.style.position = 'absolute';
            bag.style.width = '30px';
            bag.style.height = '30px';
            bag.style.backgroundColor = '#f4a62c';
            bag.style.borderRadius = '50%';
            bag.style.padding = '3px';
            bag.style.boxShadow = '0 0 14px rgba(255, 215, 96, 0.26)';
            
            // Apply color filter based on type
            if (type === 'red') {
                bag.style.backgroundColor = 'var(--vault-red)';
                bag.style.filter = 'hue-rotate(320deg) saturate(2)';
            } else if (type === 'green') {
                bag.style.backgroundColor = 'var(--vault-green)';
                bag.style.filter = 'hue-rotate(100deg) saturate(2)';
                bag.style.width = '35px';
                bag.style.height = '35px';
            } else if (type === 'blue') {
                bag.style.backgroundColor = 'var(--vault-blue)';
                bag.style.filter = 'hue-rotate(210deg) saturate(2)';
                bag.style.width = '40px';
                bag.style.height = '40px';
                bag.style.boxShadow = '0 0 14px rgba(88, 168, 255, 0.55)';
            }
            
            bag.style.pointerEvents = 'none';
            bag.style.zIndex = '200';
            
            // Random position within the game container
            const containerRect = gameContainer.getBoundingClientRect();
            const x = Math.random() * (containerRect.width - 40) + 20;
            const y = Math.random() * (containerRect.height - 100) + 50;
            
            bag.style.left = `${x}px`;
            bag.style.top = `${y}px`;
            
            // Add subtle animation
            bag.style.animation = 'pulse 2s infinite';
            
            // Add value indicator
            const valueLabel = document.createElement('div');
            valueLabel.textContent = '+' + formatNumber(Math.floor(value)) + '/s';
            valueLabel.style.position = 'absolute';
            valueLabel.style.fontSize = '10px';
            valueLabel.style.color = '#FFD700';
            valueLabel.style.fontFamily = "var(--font-ui)";
            valueLabel.style.fontWeight = '700';
            valueLabel.style.textShadow = '1px 1px 1px black';
            valueLabel.style.left = `${x + 15}px`;
            valueLabel.style.top = `${y - 15}px`;
            valueLabel.style.transform = 'translateX(-50%)';
            valueLabel.style.pointerEvents = 'none';
            valueLabel.style.zIndex = '201';
            
            gameContainer.appendChild(bag);
            gameContainer.appendChild(valueLabel);
            
            // Store reference to the bag
            gameState.bags.push({
                element: bag,
                valueLabel: valueLabel,
                x: x,
                y: y,
                value: value,
                type: type
            });
            
            // Add a small animation to show it's generating money
            setInterval(() => {
                if (Math.random() > 0.7) {
                    createFloatingCoin(x + 15, y + 15);
                }
            }, 2000);
        }
        
        // Prestige function removed
        
        // Prestige button event listener will be added when rendering upgrades
        
        // Initialize game
        function initGame(newGame = false) {
            // If starting a new game, clear saved data
            if (newGame) {
                localStorage.removeItem('idleMinerGame');
            }
            // Initialize bag upgrade level if not set
            gameState.bagUpgradeLevel = gameState.bagUpgradeLevel || 0;
            
            updateMoneyDisplay();
            updateStats();
            renderUpgrades();
            checkForAvailableUpgrades();
            if (!gameLoopStarted) {
                gameLoop();
                gameLoopStarted = true;
            }
            if (saveIntervalId === null) {
                saveIntervalId = setInterval(() => {
                    localStorage.setItem('idleMinerGame', JSON.stringify(gameState));
                }, 10000);
            }
            startLoopIfPossible();
            
            // Add style for bag animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes pulse {
                    0% { transform: scale(1); }
                    50% { transform: scale(1.1); }
                    100% { transform: scale(1); }
                }
            `;
            document.head.appendChild(style);
            
            // Position coin popup relative to mine button
            const buttonRect = mineButton.getBoundingClientRect();
            coinPopup.style.left = `${buttonRect.left + buttonRect.width / 2}px`;
            coinPopup.style.top = `${buttonRect.top - 30}px`;
            
            // Load saved game if available
            const savedGame = localStorage.getItem('idleMinerGame');
            if (savedGame) {
                try {
                    const parsed = JSON.parse(savedGame);
                    // Carefully merge saved data without overwriting methods
                    gameState.money = parsed.money || 0;
                    gameState.clickValue = parsed.clickValue || 1;
                    gameState.passiveIncome = parsed.passiveIncome || 0;
                    gameState.totalClicks = parsed.totalClicks || 0;
                    gameState.totalEarned = parsed.totalEarned || 0;
                    
                    // Restore bag upgrade levels
                    gameState.bagUpgradeLevel = parsed.bagUpgradeLevel || 0;
                    gameState.greenBagUpgradeLevel = parsed.greenBagUpgradeLevel || 0;
                    gameState.blueBagUpgradeLevel = parsed.blueBagUpgradeLevel || 0;
                    gameState.blueBagSuperUpgradeLevel = parsed.blueBagSuperUpgradeLevel || 0;
                    
                    // Restore bags
                    if (parsed.upgrades) {
                        const redBagUpgrade = parsed.upgrades.find(u => u.id === 'bag');
                        if (redBagUpgrade && redBagUpgrade.level > 0) {
                            for (let i = 0; i < redBagUpgrade.level; i++) {
                                const bagValue = 100 * Math.pow(2.5, gameState.bagUpgradeLevel);
                                addMoneyBag(bagValue, 'red');
                            }
                        }
                        
                        const greenBagUpgrade = parsed.upgrades.find(u => u.id === 'greenBag');
                        if (greenBagUpgrade && greenBagUpgrade.level > 0) {
                            for (let i = 0; i < greenBagUpgrade.level; i++) {
                                const greenBagValue = 300 * Math.pow(3.5, gameState.greenBagUpgradeLevel || 0);
                                addMoneyBag(greenBagValue, 'green');
                            }
                        }
                        
                        const blueBagUpgrade = parsed.upgrades.find(u => u.id === 'blueBag');
                        if (blueBagUpgrade && blueBagUpgrade.level > 0) {
                            for (let i = 0; i < blueBagUpgrade.level; i++) {
                                const blueBagValue = 1000 * Math.pow(4, gameState.blueBagUpgradeLevel || 0);
                                addMoneyBag(blueBagValue, 'blue');
                            }
                        }
                    }
                    
                    // Restore upgrade levels without losing the methods
                    if (parsed.upgrades && Array.isArray(parsed.upgrades)) {
                        parsed.upgrades.forEach((savedUpgrade, index) => {
                            if (index < gameState.upgrades.length) {
                                gameState.upgrades[index].level = savedUpgrade.level || 0;
                            }
                        });
                    }
                    
                    updateMoneyDisplay();
                    updateStats();
                } catch (e) {
                    console.error('Failed to load saved game:', e);
                }
            }
            
            // Save game periodically handled once per session
        }

        // Handle start screen buttons
        document.getElementById('new-game-btn').addEventListener('click', async function() {
            await unlockAudio();
            playSfx('start');
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            initGame(true); // Start a new game
        });
        
        document.getElementById('continue-btn').addEventListener('click', async function() {
            const savedGame = localStorage.getItem('idleMinerGame');
            if (savedGame) {
                await unlockAudio();
                playSfx('start');
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'flex';
                initGame(false); // Continue existing game
            } else {
                playSfx('blocked');
                // If no saved game exists, shake the button to indicate it's not available
                const button = document.getElementById('continue-btn');
                button.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    button.style.animation = '';
                }, 500);
            }
        });
        
        // Add shake animation for the continue button when no save exists
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // [agent-note][stage4] repaired: mobile-actionability | scope: preserve native tap/click for UI buttons while still suppressing multi-touch zoom
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(event) {
            event.preventDefault();
        }, { passive: false });
        
        // Disable context menu to prevent long-press issues on the gameplay button only
        document.addEventListener('contextmenu', function(event) {
            if (event.target === mineButton) {
                event.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
