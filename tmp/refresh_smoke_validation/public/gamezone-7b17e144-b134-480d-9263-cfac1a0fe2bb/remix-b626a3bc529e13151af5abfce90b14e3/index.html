<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Skate Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- [agent-note][stage3] resolved-font: primary-display -> Russo One, secondary-ui -> Rajdhani, accent-retro -> Press Start 2P -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap">
<style>
    :root {
        --bg-deep: #070912;
        --bg-mid: #0e1630;
        --panel-fill: rgba(10, 16, 33, 0.8);
        --panel-border: #7cf7ff;
        --panel-shadow: rgba(0, 0, 0, 0.45);
        --neon-cyan: #7cf7ff;
        --neon-pink: #ff4fa3;
        --neon-lime: #9dff47;
        --neon-gold: #ffd95d;
        --text-main: #f6fbff;
        --text-dark: #071018;
    }
    * { box-sizing: border-box; }
    body, input, select, button { font-family: "Rajdhani", ui-sans-serif, system-ui, sans-serif !important; }
    .memphis-text, h2, h3, #race-banner, #bet-amount, #player-name-hud, #coin-count, #stamina-count { font-family: "Russo One", "Rajdhani", sans-serif !important; letter-spacing: 1px; }
    .mono-text, #dialog-text { font-family: "Press Start 2P", "Courier New", monospace !important; }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(124, 247, 255, 0.12), transparent 34%),
            radial-gradient(circle at bottom, rgba(255, 79, 163, 0.14), transparent 38%),
            linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
        color: var(--text-main);
        touch-action: manipulation;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(transparent 0 96%, rgba(124, 247, 255, 0.07) 96% 100%),
            linear-gradient(90deg, rgba(124, 247, 255, 0.03), transparent 25%, transparent 75%, rgba(255, 79, 163, 0.03));
        background-size: 100% 6px, 100% 100%;
        opacity: 0.75;
        mix-blend-mode: screen;
    }
    #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #game-container::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 15% 18%, rgba(255, 79, 163, 0.2), transparent 18%),
            radial-gradient(circle at 82% 14%, rgba(124, 247, 255, 0.2), transparent 16%),
            radial-gradient(circle at 60% 78%, rgba(157, 255, 71, 0.16), transparent 20%);
        opacity: 0.9;
    }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; filter: saturate(1.05) contrast(1.02); }
    .memphis-border {
        border: 2px solid var(--panel-border);
        box-shadow:
            0 0 0 1px rgba(255, 255, 255, 0.18) inset,
            0 10px 24px var(--panel-shadow),
            0 0 18px rgba(124, 247, 255, 0.16);
        border-radius: 14px;
    }
    .memphis-text {
        text-shadow: 0 0 10px rgba(124, 247, 255, 0.3);
        letter-spacing: 1px;
        font-weight: bold;
    }
    .mono-text { font-weight: normal; }
    #ui-layer { pointer-events: none; position: relative; }
    #ui-layer > * { pointer-events: auto; }
    .hidden-safe { display: none !important; }
    .btn-action {
        transition: transform 0.1s, box-shadow 0.18s, filter 0.18s, background-color 0.18s;
        cursor: pointer;
    }
    .btn-action:hover,
    .btn-action:focus-visible {
        filter: brightness(1.08);
        box-shadow:
            0 0 0 1px rgba(255, 255, 255, 0.18) inset,
            0 10px 24px var(--panel-shadow),
            0 0 22px rgba(255, 79, 163, 0.24);
    }
    .btn-action:active { transform: scale(0.95) translate(1px, 1px); }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .floating { animation: float 2s ease-in-out infinite; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { inset: 0; }
    .bottom-4 { bottom: 1rem; }
    .left-4 { left: 1rem; }
    .right-4 { right: 1rem; }
    .z-50 { z-index: 50; }
    .flex { display: flex; }
    .grid { display: grid; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-start { align-items: flex-start; }
    .items-end { align-items: flex-end; }
    .items-center { align-items: center; }
    .w-full { width: 100%; }
    .max-w-sm { max-width: 24rem; }
    .p-4 { padding: 1rem; }
    .p-3 { padding: 0.75rem; }
    .p-2 { padding: 0.5rem; }
    .p-1 { padding: 0.25rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .pb-1 { padding-bottom: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .ml-1 { margin-left: 0.25rem; }
    .ml-2 { margin-left: 0.5rem; }
    .gap-1 { gap: 0.25rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .text-center { text-align: center; }
    .text-white { color: #fff; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-4xl { font-size: 2.25rem; }
    .italic { font-style: italic; }
    .font-bold { font-weight: 700; }
    .font-normal { font-weight: 400; }
    .overflow-y-auto { overflow-y: auto; }
    .max-h-\[90vh\] { max-height: 90vh; }
    .max-h-\[95vh\] { max-height: 95vh; }
    .min-h-\[3em\] { min-height: 3em; }
    .pointer-events-none { pointer-events: none; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .flex-wrap { flex-wrap: wrap; }
    .bg-white { background: #fff; }
    .bg-red-500 { background: #ef4444; }
    .bg-black\/50 { background: rgba(0, 0, 0, 0.5); }
    .bg-gray-50 { background: #f9fafb; }
    .bg-gray-400 { background: #9ca3af; }
    .border-b-2 { border-bottom: 2px solid currentColor; }
    .col-span-2 { grid-column: span 2 / span 2; }
    .w-5 { width: 1.25rem; }
    .h-5 { height: 1.25rem; }
    #hud > div,
    #shop-screen > div,
    #profile-screen > div,
    #dialog-box,
    #bet-screen > div,
    #race-banner {
        background: linear-gradient(180deg, rgba(19, 27, 52, 0.92), rgba(7, 10, 20, 0.94));
        backdrop-filter: blur(8px);
    }
    #hud > div {
        padding: 0.35rem;
        border-radius: 18px;
    }
    #hud .memphis-border,
    #dialog-box .memphis-border,
    #shop-screen .memphis-border,
    #profile-screen .memphis-border,
    #bet-screen .memphis-border {
        border-color: rgba(124, 247, 255, 0.85);
    }
    #race-banner {
        color: var(--text-main);
        border-color: var(--neon-pink);
        box-shadow:
            0 0 0 1px rgba(255, 255, 255, 0.22) inset,
            0 0 28px rgba(255, 79, 163, 0.45),
            0 12px 24px rgba(0, 0, 0, 0.35);
    }
    #profile-screen,
    #shop-screen,
    #bet-screen {
        background:
            linear-gradient(180deg, rgba(5, 10, 20, 0.78), rgba(4, 6, 14, 0.88));
        touch-action: pan-y;
    }
    #dialog-box {
        background: linear-gradient(180deg, rgba(12, 17, 34, 0.95), rgba(7, 10, 18, 0.96));
    }
    #dialog-speaker {
        font-family: "Russo One", "Rajdhani", sans-serif !important;
        text-shadow: 0 0 12px rgba(255, 79, 163, 0.28);
    }
    #feedback-gif-layer {
        position: absolute;
        top: 5.25rem;
        right: 0.75rem;
        width: min(28vw, 132px);
        display: flex;
        justify-content: flex-end;
        pointer-events: none;
        z-index: 55;
    }
    #feedback-gif {
        max-width: 100%;
        border-radius: 14px;
        border: 2px solid rgba(124, 247, 255, 0.8);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 18px rgba(255, 79, 163, 0.2);
        background: rgba(7, 10, 20, 0.7);
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
        transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #feedback-gif-layer.active #feedback-gif {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    #friendship-status {
        color: var(--text-dark);
        background: var(--neon-lime);
        border-color: var(--panel-border);
    }
    #dialog-text {
        color: var(--text-main);
        line-height: 1.65;
    }
    #profile-screen input,
    #profile-screen select {
        background: linear-gradient(180deg, rgba(255, 217, 93, 0.96), rgba(255, 184, 66, 0.96)) !important;
        border-radius: 12px;
    }
    #skin-selector button,
    #shirt-selector button,
    #pants-selector button {
        border-radius: 999px;
        box-shadow: 0 0 0 2px rgba(7, 16, 24, 0.7), 0 0 10px rgba(255, 255, 255, 0.12);
    }
    #shop-items > div {
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(17, 24, 45, 0.96), rgba(9, 12, 24, 0.96));
        color: var(--text-main);
    }
    #shop-items .mono-text {
        color: #bdefff;
    }
    @media (max-width: 640px) {
        #ui-layer { padding: 0.65rem; }
        #hud { gap: 0.5rem; }
        #hud > div { max-width: 48%; }
        #dialog-box { left: 0.5rem; right: 0.5rem; bottom: 0.5rem; }
        #feedback-gif-layer {
            top: auto;
            bottom: 5rem;
            right: 0.5rem;
            width: min(34vw, 108px);
        }
    }
</style>
<script type="application/x-game-config">{}</script>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
        
        <!-- HUD -->
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <!-- [agent-note][stage3] resolved-gif: social/fail feedback uses compact overlay from catalogs/gifs.json -->
        <div id="feedback-gif-layer" class="hidden-safe" aria-hidden="true">
            <img id="feedback-gif" alt="Reaction feedback overlay">
        </div>
        <div id="hud" class="flex justify-between items-start w-full hidden-safe">
            <div class="flex flex-col gap-2">
                <div class="memphis-border px-2 py-1 text-white font-bold text-sm" style="background:linear-gradient(135deg, #61f6ff, #229dff); text-shadow: 0 0 10px rgba(7,16,24,0.5);">
                    <span id="player-name-hud">CHARACTE</span>
                    <span id="city-name-hud" class="text-[10px] ml-1 text-[#FFE600]">CITY</span>
                </div>
                <div class="memphis-border px-2 py-1 text-white memphis-text text-sm" style="background:linear-gradient(135deg, #ff4fa3, #ff7a5c);">
                    <span id="coin-label">TOKENS:</span> <span id="coin-count">10</span>
                </div>
                <div class="memphis-border px-2 py-1 text-[#071018] memphis-text text-sm" style="background:linear-gradient(135deg, #9dff47, #59f3b0);">
                    <span id="energy-label">STAMINA:</span> <span id="stamina-count">100</span>
                </div>
            </div>
            <div class="flex flex-col gap-2 items-end">
                <button id="btn-call-friend" class="memphis-border px-2 py-1 memphis-text text-sm text-[#071018] btn-action" style="background:linear-gradient(135deg, #7cf7ff, #41d5ff);">CALL CREW</button>
                <button id="btn-shop" class="memphis-border px-2 py-1 memphis-text text-sm text-[#071018] btn-action" style="background:linear-gradient(135deg, #9dff47, #59f3b0);">DECKS</button>
                <button id="btn-profile" class="memphis-border px-2 py-1 memphis-text text-sm text-white btn-action" style="background:linear-gradient(135deg, #7d59ff, #ff4fa3);">RIDER CARD</button>
            </div>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="hidden-safe absolute inset-0 flex items-center justify-center p-4">
            <div class="memphis-border w-full max-w-sm p-4 flex flex-col gap-3 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center">
                    <h2 id="shop-title" class="memphis-text text-2xl text-[#FF007F]">SHOP</h2>
                    <button id="btn-close-shop" class="bg-red-500 text-white px-2 py-1 text-sm memphis-border memphis-text btn-action">✕</button>
                </div>
                <div id="shop-items" class="flex flex-col gap-2"></div>
            </div>
        </div>

        <!-- Profile / Character Creation -->
        <div id="profile-screen" class="absolute inset-0 flex items-center justify-center p-4">
            <div class="memphis-border w-full max-w-sm p-4 flex flex-col gap-3 max-h-[95vh] overflow-y-auto">
                <h2 id="profile-title" class="memphis-text text-2xl text-center text-[#FF007F]">RIDER CARD</h2>
                
                <div class="flex flex-col gap-1">
                    <span id="label-lang" class="mono-text font-bold text-xs">LANGUAGE:</span>
                    <select id="lang-selector" class="memphis-border p-1 font-bold text-[#111] bg-[#FFE600] memphis-text text-sm text-center">
                        <option value="en">ENGLISH</option>
                        <option value="es">ESPAÑOL</option>
                        <option value="de">DEUTSCH</option>
                        <option value="tr">TÜRKÇE</option>
                        <option value="it">ITALIANO</option>
                        <option value="el">ΕΛΛΗΝΙΚΑ</option>
                        <option value="fr">FRANÇAIS</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1">
                    <span id="label-name" class="mono-text font-bold text-xs">TAG:</span>
                    <input type="text" id="input-name" maxlength="8" class="memphis-border p-1 font-bold text-[#111] bg-[#FFE600] text-sm text-center">
                </div>
                <div class="flex flex-col gap-1">
                    <span id="label-gender" class="mono-text font-bold text-xs">STYLE:</span>
                    <select id="gender-selector" class="memphis-border p-1 font-bold text-[#111] bg-[#FFE600] memphis-text text-sm text-center">
                        <option value="M">MALE</option>
                        <option value="F">FEMALE</option>
                        <option value="NB">NON-BINARY</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <span id="label-skin" class="mono-text font-bold text-xs">SKIN:</span>
                    <div class="flex flex-wrap gap-1 justify-center" id="skin-selector"></div>
                </div>
                <div class="flex flex-col gap-1">
                    <span id="label-shirt" class="mono-text font-bold text-xs">TOP:</span>
                    <div class="flex flex-wrap gap-1 justify-center" id="shirt-selector"></div>
                </div>
                <div class="flex flex-col gap-1">
                    <span id="label-pants" class="mono-text font-bold text-xs">BOTTOM:</span>
                    <div class="flex flex-wrap gap-1 justify-center" id="pants-selector"></div>
                </div>
                <button id="btn-save-profile" class="w-full bg-[#00F0FF] memphis-border px-2 py-1 text-white memphis-text text-sm btn-action mt-2">SAVE & ROLL</button>
            </div>
        </div>

        <!-- Dialogue Box -->
        <div id="dialog-box" class="hidden-safe absolute bottom-4 left-4 right-4 memphis-border p-3 flex flex-col gap-2">
            <div class="flex justify-between items-center border-b-2 border-[#111] pb-1">
                <div>
                    <span id="dialog-speaker" class="font-bold text-lg text-[#ff8dc3]" style="text-shadow: 0 0 12px rgba(255,79,163,0.32);">NAME</span>
                    <span id="friendship-status" class="mono-text text-[10px] bg-[#39FF14] px-1 border-2 border-[#111] ml-2">STRANGER</span>
                </div>
                <button id="btn-close-dialog" class="bg-red-500 text-white px-2 py-1 text-sm memphis-border memphis-text btn-action">✕</button>
            </div>
            <p id="dialog-text" class="mono-text text-xs text-[#111] leading-tight min-h-[3em]">Tap a skater to talk, race, or stir up drama.</p>
            <div class="grid grid-cols-2 gap-2" id="dialog-options"></div>
        </div>

        <!-- Betting Overlay -->
        <div id="bet-screen" class="hidden-safe absolute inset-0 flex items-center justify-center p-4">
            <div class="memphis-border p-4 flex flex-col gap-3 items-center w-full max-w-sm">
                <h3 id="bet-title" class="memphis-text text-xl text-[#FF007F]">PLACE YOUR BET</h3>
                <p id="bet-max-text" class="mono-text text-xs">MAX BET: 20 COINS</p>
                <div class="flex items-center gap-3">
                    <button id="bet-minus" class="bg-[#111] text-white px-3 py-1 text-sm memphis-border btn-action">-</button>
                    <span id="bet-amount" class="memphis-text text-2xl">5</span>
                    <button id="bet-plus" class="bg-[#111] text-white px-3 py-1 text-sm memphis-border btn-action">+</button>
                </div>
                <button id="btn-confirm-bet" class="bg-[#39FF14] memphis-border px-2 py-1 w-full memphis-text text-sm btn-action">RACE!</button>
                <button id="btn-cancel-bet" class="bg-red-500 memphis-border px-2 py-1 w-full memphis-text text-sm text-white btn-action">CANCEL</button>
            </div>
        </div>

        <!-- Race Overlay -->
        <div id="race-overlay" class="hidden-safe absolute inset-0 flex items-center justify-center pointer-events-none">
            <div id="race-banner" class="memphis-border p-3 text-white memphis-text text-4xl italic floating" style="background:linear-gradient(135deg, #ff4fa3, #7d59ff);">GO!</div>
        </div>

    </div>
</div>

<!-- [agent-note][stage3] resolved-audio: loops and sfx mapped semantically from catalogs/audios.json -->
<audio id="bgm_profile" data-editable="audio" data-label="Profile BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop=""></audio>
<audio id="bgm_explore_cheriville" data-editable="audio" data-label="Cheriville BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3" preload="auto" loop=""></audio>
<audio id="bgm_explore_tompline" data-editable="audio" data-label="Tompline BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop=""></audio>
<audio id="bgm_explore_marzovia" data-editable="audio" data-label="Marzovia BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop=""></audio>
<audio id="bgm_race" data-editable="audio" data-label="Race BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop=""></audio>
<audio id="bgm_shop" data-editable="audio" data-label="Shop BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop=""></audio>
<audio id="bgm_house" data-editable="audio" data-label="House BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_02.mp3" preload="auto" loop=""></audio>
<audio id="bgm_skate_club" data-editable="audio" data-label="Skate Club BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop=""></audio>
<audio id="sfx_ui_click" data-editable="audio" data-label="UI Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_success" data-editable="audio" data-label="Success SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Fail SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
<audio id="sfx_hit" data-editable="audio" data-label="Hit SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3" preload="auto"></audio>
<audio id="sfx_pickup" data-editable="audio" data-label="Pickup SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_blocked" data-editable="audio" data-label="Blocked SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>

<script>
const skins = ["#FFC0CB", "#8D5524", "#F1C27D", "#E0AC69", "#3D2C23", "#FFDBAC", "#C68642", "#4A2E1B", "#39FF14", "#00F0FF", "#FFFFFF", "#8A2BE2", "#FF4500", "#A9A9A9"];
const shirts = ["#00F0FF", "#FF007F", "#FFE600", "#111111", "#39FF14", "#FFFFFF", "#8A2BE2", "#FFA500", "#00FFFF", "#FFC0CB", "#8B0000", "#00008B"];
const pants = ["#111111", "#FFFFFF", "#39FF14", "#FF007F", "#00F0FF", "#FFA500", "#FFE600", "#8A2BE2", "#8B4513", "#808080", "#008000", "#FFC0CB"];
const names = ["AXEL", "ROXY", "BEAT", "GUM", "CORN", "TAB", "MEW", "RIYO"];

const skateboards = [
    { id: 'classic', name: 'Classic Board', cost: 0, speedMult: 1.0, color: '#FFFFFF', city: 'all' },
    { id: 'jaguar', name: 'Jaguar Board', cost: 15, speedMult: 1.2, color: '#FFA500', city: 'all' },
    { id: 'jaguar_plus', name: 'Jaguar +', cost: 30, speedMult: 1.4, color: '#FF4500', city: 'all' },
    { id: 'moon', name: 'Moon Block', cost: 50, speedMult: 1.7, color: '#00F0FF', city: 'all' },

function setupResizeObserver() {
    const ro = new ResizeObserver(entries => {
        for (let entry of entries) {
            resize(entry.contentRect.width, entry.contentRect.height);
            if (!initialized) {
                loadGameData();
                initGame();
                updateSelectors(); updateProfileLanguage(); setState('PLAY');
                initialized = true;
                requestAnimationFrame(gameLoop);
            }
        }
    });
    ro.observe(canvas);
}

function resize(w, h) {
    if (w === 0 || h === 0) return;
    cw = w; ch = h;
    dpr = window.devicePixelRatio || 1;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function playTone(freq, type, duration) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function renderShop(type = 'skate') {
    const t = texts[currentLang];
    const container = document.getElementById('shop-items');
    container.innerHTML = '';
    document.getElementById('shop-title').innerText = type === 'skate' ? t.shop_title : type === 'hair' ? t.shop_hair : t.shop_acc;
    
    const items = type === 'skate' ? skateboards.filter(s => !s.city || s.city === 'all' || s.city === charData.currentCity || charData.inventory.includes(s.id)) : type === 'hair' ? hairs : accessories;
    
    items.forEach(s => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-gray-50 p-2 memphis-border";
        const isOwned = type === 'skate' ? charData.inventory.includes(s.id) : type === 'hair' ? charData.ownedHairs.includes(s.id) : charData.ownedAccessories.includes(s.id);
        const isEquipped = type === 'skate' ? charData.equippedSkate === s.id : type === 'hair' ? charData.equippedHair === s.id : charData.equippedAccessory === s.id;
        const info = type === 'skate' ? `SPEED: x${s.speedMult}` : `STYLE UP`;
        
        div.innerHTML = `
            <div><div class="memphis-text text-sm">${s.name}</div><div class="mono-text text-[10px]">${info} | COST: ${s.cost}</div></div>
            <button class="shop-buy-btn px-2 py-1 text-sm memphis-border memphis-text btn-action ${isEquipped ? 'bg-gray-400' : isOwned ? 'bg-[#39FF14]' : 'bg-[#FF007F] text-white'}">${isEquipped ? 'EQUIPPED' : isOwned ? 'EQUIP' : 'BUY'}</button>
        `;
        
        div.querySelector('button').onclick = () => {
            if (isOwned) {
                if (type === 'skate') charData.equippedSkate = s.id;
                else if (type === 'hair') charData.equippedHair = (charData.equippedHair === s.id ? null : s.id);
                else charData.equippedAccessory = (charData.equippedAccessory === s.id ? null : s.id);
                playTone(880, 'sine', 0.1); vibrate('light');
            } else if (charData.coins >= s.cost) {
                charData.coins -= s.cost;
                if (type === 'skate') { charData.inventory.push(s.id); charData.equippedSkate = s.id; }
                else if (type === 'hair') { charData.ownedHairs.push(s.id); charData.equippedHair = s.id; }
                else { charData.ownedAccessories.push(s.id); charData.equippedAccessory = s.id; }
                playTone(1200, 'sine', 0.2); vibrate('medium');
            } else { playTone(220, 'sawtooth', 0.2); alert("Not enough tokens!"); }
            saveGame(); updateHUD(); renderShop(type);
        };
        container.appendChild(div);
    });
}

    addOpt(t.friendly, "#FF007F", () => {
        npc.chatCount = (npc.chatCount || 0) + 1;
        if (npc.chatCount >= 5 && !charData.friends.includes(npc.id) && !(charData.partners && charData.partners.includes(npc.id))) {
            charData.friends.push(npc.id);
            showDialogMessage("We keep crossing paths. Crew unlocked — call me anytime.", npc);
            saveGame(); document.getElementById('friendship-status').innerText = "FRIEND";
        } else { showDialogMessage(t.res_f, npc); }
    });
    
    addOpt(t.mock, "#111111", () => {
        npc.mockCount = (npc.mockCount || 0) + 1;
        if (npc.mockCount >= 5) {
            showDialogMessage(npc.name + " " + t.fight_msg, npc);
            charData.stamina = Math.floor(charData.stamina / 2);
            updateHUD();
            playTone(150, 'sawtooth', 0.5); vibrate('heavy');
            shakeTime = 0.5;
            spawnParticles(charData.x, charData.y, '#FF0000');
            spawnParticles(npc.x, npc.y, '#FF0000');
            npc.mockCount = 0;
        } else {
            if (activeFriend) {
                showDialogMessage(activeFriend.name + " backed you up. " + npc.name + " bailed and dropped 5 tokens!", npc);
                charData.coins += 5; saveGame(); updateHUD();
            } else {
                showDialogMessage(npc.name + ": Keep chirping and catch this.\n(Lost 10 Stamina)", npc);
                charData.stamina = Math.max(0, charData.stamina - 10); updateHUD();
            }
        }
    });

    addOpt(t.hit || "Hit", "#FF4500", () => {
        charData.stamina = Math.max(0, charData.stamina - 20);
        updateHUD();
        playTone(150, 'sawtooth', 0.5); vibrate('heavy');
        shakeTime = 0.5;
        spawnParticles(charData.x, charData.y, '#FF0000');
        spawnParticles(npc.x, npc.y, '#FF0000');
        showDialogMessage(t.hit_msg || "BAM! (Lost 20 Energy)", npc);
    });

    addOpt(t.flirt || "Flirt", "#FF69B4", () => {
        if (charData.partners && charData.partners.includes(npc.id)) {
            showDialogMessage("Already linked up.", npc);
            return;
        }
        if (Math.random() < 0.5) {
            if (!charData.partners) charData.partners = [];
            charData.partners.push(npc.id);
            saveGame();
            document.getElementById('friendship-status').innerText = t.partner || "PARTNER";
            showDialogMessage(t.flirt_success || "Success!", npc);
            playTone(880, 'sine', 0.3); vibrate('medium');
            spawnParticles(npc.x, npc.y, '#FF69B4');
        } else {
            showDialogMessage(t.flirt_fail || "Failed!", npc);
            playTone(220, 'sawtooth', 0.3); vibrate('light');
        }
    });
    
    addOpt(t.bet, "#39FF14", () => { currentBet = 5; updateBetUI(); setState('BETTING'); });
    addOpt(t.race, "#00F0FF", () => { currentBet = 0; startRace(npc); });
}

function playSfx(name, { volume = 0.45, debounceMs = 90 } = {}) {
    const clip = sfx[name];
    if (!clip) return;
    const now = performance.now();
    if (lastSfxAt[name] && now - lastSfxAt[name] < debounceMs) return;
    lastSfxAt[name] = now;
    try {
        clip.pause();
        clip.currentTime = 0;
        clip.volume = volume;
        clip.play().catch(() => {});
    } catch (e) {}
}

function showFeedbackGif(type) {
    const src = feedbackGif[type];
    if (!src || !feedbackGif.layer || !feedbackGif.image) return;
    feedbackGif.image.src = src;
    feedbackGif.layer.classList.remove('hidden-safe');
    feedbackGif.layer.classList.add('active');
    clearTimeout(feedbackGifTimer);
    feedbackGifTimer = setTimeout(() => {
        feedbackGif.layer.classList.remove('active');
        feedbackGif.layer.classList.add('hidden-safe');
    }, 1800);
}

function spawnParticles(x, y, color) {
    for(let i=0; i<12; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300,
            life: 0.3 + Math.random()*0.3, color: color
        });
    }
}

function update(dt) {
    if (gameState === 'PLAY' || gameState === 'RACING') {
        if (charData.stamina < 100) {
            charData.stamina = Math.min(100, charData.stamina + gameConfig.staminaRegen * dt);
            updateHUD();
        }

        if (charData.trickTimer > 0) {
            charData.trickTimer -= dt;
        }

        if (isMoving) {
            const skate = skateboards.find(s => s.id === charData.equippedSkate);
            const speed = (gameState === 'RACING' ? gameConfig.raceSpeed : gameConfig.walkSpeed) * (skate ? skate.speedMult : 1);
            const nx = charData.x + moveVector.x * speed * dt;
            const ny = charData.y + moveVector.y * speed * dt;
            
            if (isFinite(nx) && isFinite(ny)) {
                let hit = false;
                for(let b of buildings) {
                    if(Math.abs(nx-b.x) < b.w/2+15 && Math.abs(ny-b.y) < b.h/2+15 && b.type !== 'travel') hit = true;
                }
                if(!hit) {
                    charData.x = Math.max(20, Math.min(worldSize-20, nx));
                    charData.y = Math.max(20, Math.min(worldSize-20, ny));
                }
            }
        }

        if (!charData.isJumping && isMoving && gameState !== 'RACING') {
            for (let r of ramps) {
                if (Math.abs(charData.x - r.x) < r.w/2 && Math.abs(charData.y - r.y) < r.h/2) {
                    charData.isJumping = true; charData.jumpZ = 1; charData.jumpVZ = 400; charData.spin = 0;
                    charData.trickText = trickNames[Math.floor(Math.random() * trickNames.length)];
                    charData.trickTimer = 1.0;
                    playTone(600, 'sine', 0.2); playSfx('uiClick', { volume: 0.2, debounceMs: 120 }); vibrate('light');
                    break;
                }
            }
        } else if (charData.isJumping) {
            charData.jumpZ += charData.jumpVZ * dt;
            charData.jumpVZ -= 800 * dt; 
            charData.spin += 15 * dt;
            if (charData.jumpZ <= 0) {
                charData.jumpZ = 0; charData.isJumping = false; charData.spin = 0;
                charData.coins += 2; 
                updateHUD(); playTone(800, 'square', 0.1); playSfx('pickup', { volume: 0.35, debounceMs: 180 }); vibrate('medium');
                spawnParticles(charData.x, charData.y, '#FFFFFF');
            }
        }

        if (gameState === 'RACING' && raceData) {
            raceData.npc.y -= gameConfig.raceSpeed * 0.95 * dt;
            if (charData.y <= raceData.targetY) {
                if (raceData.bet > 0) { charData.coins += raceData.bet; alert(`YOU WON ${raceData.bet} TOKENS!`); }
                else { alert(`YOU TOOK THE HEAT!`); }
                playTone(880, 'sine', 0.4); playSfx('success', { volume: 0.42, debounceMs: 200 }); showFeedbackGif('social'); vibrate('medium'); endRace();
            } else if (raceData.npc.y <= raceData.targetY) {
                if (raceData.bet > 0) { charData.coins = Math.max(0, charData.coins - raceData.bet); alert(`YOU LOST ${raceData.bet} TOKENS!`); }
                else { alert(`YOU GOT DUSTED!`); }
                playTone(220, 'sawtooth', 0.5); playSfx('fail', { volume: 0.45, debounceMs: 200 }); showFeedbackGif('fail'); vibrate('heavy'); endRace();
            }
        }
        camera.x = charData.x - cw/2; camera.y = charData.y - ch/2;
        if (shakeTime > 0) {
            shakeTime -= dt;
            camera.x += (Math.random() - 0.5) * 20;
            camera.y += (Math.random() - 0.5) * 20;
        }
    }

    npcs.forEach(npc => {
        if (gameState === 'DIALOG' && currentInteractingEntity === npc) return;
        if (gameState === 'RACING' && raceData && raceData.npc === npc) return;
        
        if (npc.state === 'follow') {
            let dx = charData.x - npc.x; let dy = charData.y - npc.y; let dist = Math.hypot(dx, dy);
            if (dist > 60) { npc.x += (dx / dist) * npc.speed * 1.5 * dt; npc.y += (dy / dist) * npc.speed * 1.5 * dt; }
            return; 
        }

        npc.timer -= dt;
        if (npc.timer <= 0) {
            npc.state = Math.random() > 0.7 ? 'wander' : 'wait';
            npc.timer = 1 + Math.random() * 3; npc.dir = Math.random() * Math.PI * 2;
        }
        if (npc.state === 'wander') {
            npc.x += Math.cos(npc.dir) * npc.speed * dt; npc.y += Math.sin(npc.dir) * npc.speed * dt;
            npc.x = Math.max(100, Math.min(worldSize-100, npc.x)); npc.y = Math.max(100, Math.min(worldSize-100, npc.y));
        }
    });

    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function endRace() { saveGame(); updateHUD(); setState('PLAY'); raceData = null; }

function drawEntity(ctx, x, y, data, isNpc = false) {
    if (!isFinite(x) || !isFinite(y)) return;
    let z = data.jumpZ || 0; let spin = data.spin || 0;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x + 6, y + 24, Math.max(1, 14 - (z/10)), Math.max(1, 7 - (z/20)), 0, 0, Math.PI*2); ctx.fill();

    ctx.save();
    ctx.translate(x, y - z);
    if (spin > 0) ctx.rotate(spin);
    
    let cx = 0, cy = 0;
    const skateId = isNpc ? 'classic' : (data.equippedSkate || 'classic');
    const skate = skateboards.find(s => s.id === skateId);
    ctx.fillStyle = skate ? skate.color : '#FFF'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(cx - 15, cy + 12, 30, 8, 4); ctx.fill(); ctx.stroke();
    
    ctx.fillStyle = '#111'; ctx.fillRect(cx-12, cy+18, 4, 4); ctx.fillRect(cx+8, cy+18, 4, 4);

    ctx.fillStyle = pants[data.pantsIdx || 0] || '#111';
    ctx.fillRect(cx - 10, cy + 2, 20, 10); ctx.strokeRect(cx - 10, cy + 2, 20, 10);

    ctx.fillStyle = shirts[data.shirtIdx || 0] || '#FFF';
    ctx.fillRect(cx - 10, cy - 10, 20, 12); ctx.strokeRect(cx - 10, cy - 10, 20, 12);
    
    ctx.fillStyle = skins[data.skinIdx || 0] || skins[0];
    ctx.beginPath(); ctx.arc(cx, cy - 18, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    
    const hair = data.equippedHair;
    if (hair) {
        ctx.fillStyle = '#3D2C23';
        if (hair === 'mullet') { ctx.fillRect(cx - 10, cy - 28, 20, 8); ctx.fillRect(cx - 12, cy - 18, 24, 8); }
        else if (hair === 'mohawk') { ctx.fillRect(cx - 3, cy - 32, 6, 14); }
        else if (hair === 'fade') { ctx.fillRect(cx - 8, cy - 28, 16, 6); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(cx - 10, cy - 22, 2, 8); ctx.fillRect(cx + 8, cy - 22, 2, 8); }
        else if (hair === 'afro') { ctx.beginPath(); ctx.arc(cx, cy - 22, 14, 0, Math.PI*2); ctx.fill(); }
        else if (hair === 'curls' || hair === 'ringlets') {
            for(let i=0; i<5; i++) { ctx.beginPath(); ctx.arc(cx - 8 + i*4, cy - 26 + (i%2)*2, 4, 0, Math.PI*2); ctx.fill(); }
            if (hair === 'ringlets') { ctx.beginPath(); ctx.arc(cx - 10, cy - 18, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 10, cy - 18, 3, 0, Math.PI*2); ctx.fill(); }
        } else if (hair === 'semi_bald') { ctx.fillRect(cx - 11, cy - 20, 4, 10); ctx.fillRect(cx + 7, cy - 20, 4, 10); ctx.fillRect(cx - 11, cy - 10, 22, 4); }
    }

    const acc = data.equippedAccessory;
    if (acc === 'glasses') { ctx.fillStyle = '#111'; ctx.fillRect(cx - 8, cy - 22, 6, 4); ctx.fillRect(cx + 2, cy - 22, 6, 4); ctx.fillRect(cx - 2, cy - 21, 4, 2); }
    else if (acc === 'nose') { ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.arc(cx, cy - 18, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
    else if (acc === 'hat') { ctx.fillStyle = '#00F0FF'; ctx.fillRect(cx - 12, cy - 28, 24, 4); ctx.fillRect(cx - 8, cy - 36, 16, 8); ctx.strokeRect(cx - 12, cy - 28, 24, 4); ctx.strokeRect(cx - 8, cy - 36, 16, 8); }
    else if (acc === 'elegant_hat') { ctx.fillStyle = '#111'; ctx.fillRect(cx - 14, cy - 28, 28, 4); ctx.fillRect(cx - 8, cy - 40, 16, 12); }
    else if (acc === 'elegant_glasses') { ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx - 4, cy - 20, 3, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 4, cy - 20, 3, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx - 1, cy - 20); ctx.lineTo(cx + 1, cy - 20); ctx.stroke(); }
    else if (acc === 'monocle') { ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx + 4, cy - 20, 3, 0, Math.PI*2); ctx.stroke(); ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx + 7, cy - 20); ctx.lineTo(cx + 10, cy - 15); ctx.stroke(); }
    else if (acc === 'pipe') { ctx.fillStyle = '#8B4513'; ctx.fillRect(cx + 2, cy - 14, 8, 2); ctx.fillRect(cx + 8, cy - 16, 4, 4); }
    else if (acc === 'wool_hat') { ctx.fillStyle = '#FF007F'; ctx.beginPath(); ctx.arc(cx, cy - 24, 10, Math.PI, 0); ctx.fill(); ctx.fillRect(cx - 11, cy - 24, 22, 6); ctx.beginPath(); ctx.arc(cx, cy - 34, 4, 0, Math.PI*2); ctx.fill(); }
    else if (acc === 'helmet') { ctx.fillStyle = '#39FF14'; ctx.beginPath(); ctx.arc(cx, cy - 22, 11, Math.PI, 0); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 11, cy - 22); ctx.lineTo(cx + 11, cy - 22); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx - 10, cy - 22); ctx.lineTo(cx, cy - 12); ctx.lineTo(cx + 10, cy - 22); ctx.stroke(); }
    else if (acc === 'swim_cap') { ctx.fillStyle = '#00F0FF'; ctx.beginPath(); ctx.arc(cx, cy - 20, 10, Math.PI, 0); ctx.fill(); ctx.fillRect(cx - 10, cy - 20, 20, 4); }

    ctx.restore();

    ctx.fillStyle = '#111'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(data.name || 'PLAYER', x, y - 48 - z);

    if (!isNpc && data.trickTimer > 0) {
        ctx.fillStyle = '#FF007F'; ctx.font = 'italic bold 20px sans-serif';
        ctx.fillText(data.trickText, x, y - 70 - z - (1 - data.trickTimer)*20);
    }
}

function draw() {
    const city = cities[charData.currentCity || 'house'];
    ctx.fillStyle = city.bg; ctx.fillRect(0, 0, cw, ch);
    ctx.save();
    ctx.translate(-camera.x, -camera.y);
    
    ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 2;
    let offsetX = camera.x % 40; let offsetY = camera.y % 40;
    for(let x = -offsetX; x < cw + 40; x += 40) { ctx.beginPath(); ctx.moveTo(camera.x + x, camera.y); ctx.lineTo(camera.x + x, camera.y + ch); ctx.stroke(); }
    for(let y = -offsetY; y < ch + 40; y += 40) { ctx.beginPath(); ctx.moveTo(camera.x, camera.y + y); ctx.lineTo(camera.x + cw, camera.y + y); ctx.stroke(); }

    ramps.forEach(r => {
        ctx.fillStyle = '#111'; ctx.fillRect(r.x-r.w/2 + 6, r.y-r.h/2 + 6, r.w, r.h);
        ctx.fillStyle = '#00F0FF'; ctx.fillRect(r.x-r.w/2, r.y-r.h/2, r.w, r.h);
        ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.strokeRect(r.x-r.w/2, r.y-r.h/2, r.w, r.h);
        ctx.beginPath(); ctx.moveTo(r.x-r.w/2, r.y-r.h/2 + 10); ctx.lineTo(r.x+r.w/2, r.y-r.h/2 + 10); ctx.moveTo(r.x-r.w/2, r.y+r.h/2 - 10); ctx.lineTo(r.x+r.w/2, r.y+r.h/2 - 10); ctx.stroke();
    });

    buildings.forEach(b => {
        ctx.fillStyle = '#111'; ctx.fillRect(b.x-b.w/2 + 8, b.y-b.h/2 + 8, b.w, b.h);
        ctx.fillStyle = b.color; ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
        ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.strokeRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
        
        ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
        if (b.type === 'metro' || b.type === 'travel') {
            ctx.fillStyle = '#39FF14';
            ctx.fillText(b.label, b.x, b.y + 8);
        } else if (b.type === 'job' || b.type === 'shop' || b.type === 'food' || b.type === 'decor' || b.type === 'sleep') {
            ctx.fillStyle = '#111';
            ctx.fillText(b.label || '', b.x, b.y + 8);
        } else {
            ctx.fillStyle = 'white'; ctx.fillRect(b.x-b.w/2+10, b.y-b.h/2+10, 15, 15);
        }
    });

    npcs.forEach(npc => drawEntity(ctx, npc.x, npc.y, npc, true));
    drawEntity(ctx, charData.x, charData.y, charData);

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    });

    if (gameState === 'RACING') {
        ctx.strokeStyle = '#FF007F'; ctx.lineWidth = 10; ctx.setLineDash([20, 20]);
        ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(worldSize, 100); ctx.stroke();
        ctx.setLineDash([]);
    }

    ctx.restore();
}

function gameLoop(t) {
    let dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    try { update(dt); draw(); } catch(e) { console.error(e); }
    requestAnimationFrame(gameLoop);
}

function setupInputs() {
    const isGameplayTarget = (target) => target === canvas;
    const handle = (e) => {
        if (!isGameplayTarget(e.target)) {
            if (e.type === 'pointerup' || e.type === 'pointercancel' || e.type === 'touchend') {
                isMoving = false;
            }
            return;
        }

        unlockAudio();
        if (gameState === 'PROFILE' && bgm.profile.paused) bgm.profile.play().catch(()=>{});
        const point = e.touches && e.touches[0] ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        const x = point.clientX - rect.left;
        const y = point.clientY - rect.top;

        if (gameState === 'PLAY' || gameState === 'RACING') {
            if (e.type === 'pointerdown' || e.type === 'touchstart') {
                e.preventDefault();
                isMoving = true;
                updateMove(x, y);
                if (gameState === 'PLAY') checkInteraction(x + camera.x, y + camera.y);
            } else if ((e.type === 'pointermove' || e.type === 'touchmove') && isMoving) {
                e.preventDefault();
                updateMove(x, y);
            } else {
                isMoving = false;
            }
        }
    };

    /* [agent-note][stage4] repaired: mobile-tap-flow | action: scoped gesture prevention to canvas so overlay buttons keep native tap/scroll */
    ['pointerdown','pointermove','pointerup','pointercancel'].forEach(evt => {
        canvas.addEventListener(evt, handle, { passive: false });
    });
    ['touchstart','touchmove','touchend'].forEach(evt => {
        canvas.addEventListener(evt, handle, { passive: false });
    });
}

function updateMove(x, y) {
    const dx = x - cw/2, dy = y - ch/2; const d = Math.hypot(dx, dy);
    if (d > 15) { moveVector = { x: dx/d, y: dy/d }; } else { moveVector = { x: 0, y: 0 }; }
}

function checkInteraction(wx, wy) {
    for (let npc of npcs) {
        if (Math.hypot(npc.x - wx, npc.y - wy) < 50) { playTone(440, 'square', 0.1); playSfx('uiClick', { volume: 0.25, debounceMs: 120 }); showFeedbackGif('social'); interactWithNPC(npc); isMoving = false; return; }
    }
    for (let b of buildings) {
        if (Math.abs(b.x - wx) < b.w/2 + 30 && Math.abs(b.y - wy) < b.h/2 + 30) {
            playTone(440, 'square', 0.1);
            playSfx('uiClick', { volume: 0.25, debounceMs: 120 });
            if (b.type === 'job') interactWithJob(b);
            else if (b.type === 'shop') { renderShop(b.shopType); setState('SHOP'); }
            else if (b.type === 'food') interactWithFood(b);
            else if (b.type === 'metro') interactWithMetro(b);
            else if (b.type === 'sleep') interactWithSleep(b);
            else if (b.type === 'travel') {
                charData.currentCity = b.targetCity;
                playTone(1200, 'sine', 0.3); vibrate('heavy');
                initGame();
                charData.x = worldSize / 2;
                charData.y = worldSize / 2 + 100;
                saveGame();
                setState('PLAY');
            }
            isMoving = false; return;
        }
    }
}

function unlockAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx?.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    Object.values([...Object.values(bgm), ...Object.values(sfx)]).forEach((clip) => {
        if (!clip) return;
        clip.volume = clip.id.startsWith('bgm_') ? 0.2 : clip.volume || 0.42;
        clip.load?.();
    });
}

function vibrate(s) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style: s }
    });
}

function saveGame() { localStorage.setItem('memSkateSave_v14', JSON.stringify(charData)); }
function loadGameData() {
    const s = localStorage.getItem('memSkateSave_v14');
    if (s) {
        const data = JSON.parse(s); charData = { ...charData, ...data };
        charData.isJumping = false; charData.jumpZ = 0;
    } else {
        charData.skinIdx = Math.floor(Math.random() * skins.length); charData.shirtIdx = Math.floor(Math.random() * shirts.length);
        charData.pantsIdx = Math.floor(Math.random() * pants.length); charData.name = names[Math.floor(Math.random() * names.length)];
        charData.lang = 'en';
        charData.gender = 'M';
        charData.currentCity = 'house';
    }
    if (!charData.ownedAccessories) charData.ownedAccessories = [];
    if (!charData.ownedHairs) charData.ownedHairs = [];
    if (!charData.friends) charData.friends = [];
    if (!charData.partners) charData.partners = [];
    if (!charData.currentCity) charData.currentCity = 'house';
    if (!charData.inventory) charData.inventory = ['classic'];
    if (!charData.gender) charData.gender = 'M';
    if (charData.lang) { currentLang = charData.lang; document.getElementById('lang-selector').value = currentLang; }
    if (charData.gender) document.getElementById('gender-selector').value = charData.gender;
    document.getElementById('input-name').value = charData.name;
}
</script>
