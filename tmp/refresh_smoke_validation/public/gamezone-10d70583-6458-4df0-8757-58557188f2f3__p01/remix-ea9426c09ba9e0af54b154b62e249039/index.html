<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Arcane Bakewatch: Retro Recipe Recall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
:root{--orange:#ff9f3f;--cream:#fff1c7;--teal:#48f0d4;--berry:#ff5f9f;--dark:#17102a;--panel:rgba(35,19,48,.78);--ink:#211020}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#120d24;color:var(--cream);font-family:Rajdhani,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,rgba(255,159,63,.22),transparent 28%),radial-gradient(circle at 84% 42%,rgba(72,240,212,.15),transparent 24%),linear-gradient(180deg,#1e1235,#120d24 58%,#090713);pointer-events:none}
#game-container{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;position:relative;z-index:1;width:100%;height:100%;touch-action:none;image-rendering:auto}
#ui-layer{position:absolute;inset:0;z-index:20;pointer-events:none}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));min-width:104px;padding:10px 12px;border:2px solid rgba(255,241,199,.35);background:linear-gradient(135deg,rgba(62,31,62,.92),rgba(25,15,42,.78));box-shadow:0 0 0 2px rgba(72,240,212,.14),0 12px 28px rgba(0,0,0,.35);clip-path:polygon(0 0,92% 0,100% 26%,100% 100%,8% 100%,0 74%);font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.7vw,14px);line-height:1.7;text-shadow:2px 2px #000}.hud small{display:block;color:var(--teal);font-family:Rajdhani,sans-serif;font-size:11px;letter-spacing:.16em}.hud b{color:var(--cream);font-weight:400}#score-display{left:max(10px,env(safe-area-inset-left))}#level-display{right:max(10px,env(safe-area-inset-right));text-align:right;transform:scaleX(1)}
#message-display{position:absolute;top:12%;left:50%;width:min(90vw,430px);transform:translate(-50%,-8px);padding:12px 14px;border:2px solid rgba(255,159,63,.55);border-radius:8px;background:rgba(25,15,42,.84);box-shadow:0 0 30px rgba(255,159,63,.18),inset 0 0 22px rgba(72,240,212,.07);font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.2vw,18px);letter-spacing:.05em;text-align:center;color:var(--orange);opacity:0;transition:.22s ease}.visible#message-display{opacity:1;transform:translate(-50%,0)}#message-display:before,#message-display:after{content:"";position:absolute;top:50%;width:28px;height:8px;background:var(--teal);transform:translateY(-50%)}#message-display:before{left:-16px}#message-display:after{right:-16px}
#subtitle{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);padding:8px 12px;border:1px solid rgba(72,240,212,.28);border-radius:999px;background:rgba(10,7,19,.52);color:#ffdca4;text-align:center;font-size:clamp(13px,3.4vw,16px);letter-spacing:.04em;pointer-events:none}
#game-over-screen{display:none;position:absolute;inset:0;z-index:40;align-items:center;justify-content:center;padding:18px;background:rgba(12,7,21,.78);backdrop-filter:blur(8px);pointer-events:auto}.visible#game-over-screen{display:flex}.panel{width:min(94vw,410px);padding:24px 18px calc(18px + env(safe-area-inset-bottom));border:3px solid var(--orange);background:linear-gradient(180deg,rgba(54,28,57,.96),rgba(19,12,32,.96));box-shadow:0 18px 48px rgba(0,0,0,.55),0 0 0 6px rgba(72,240,212,.12),inset 0 0 28px rgba(255,159,63,.1);text-align:center;clip-path:polygon(0 0,94% 0,100% 8%,100% 100%,6% 100%,0 92%)}h1{margin:0 0 14px;color:var(--berry);font-family:'Press Start 2P',monospace;font-size:clamp(20px,6vw,32px);line-height:1.35;text-shadow:3px 3px #000}.panel p{margin:9px 0;color:var(--cream);font-size:clamp(16px,4vw,20px)}button{width:100%;margin-top:14px;padding:16px 18px;border:0;border-radius:10px;background:linear-gradient(180deg,#fff1c7,#ff9f3f);color:#251326;font-family:'Press Start 2P',monospace;font-size:clamp(13px,3.5vw,18px);box-shadow:0 7px 0 #9b4d23,0 0 24px rgba(72,240,212,.28);cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 3px 0 #9b4d23}
@media(max-width:520px){#message-display{top:13.5%}.hud{min-width:92px;padding:8px 9px}.hud small{font-size:9px}#subtitle{font-size:12px}.panel{margin-top:18px}}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" aria-label="Arcane Bakewatch recipe recall playfield"></canvas>
  <div id="ui-layer">
    <div id="score-display" class="hud"><small>TIPS</small><b>0</b></div>
    <div id="level-display" class="hud"><small>SERVICE</small><b>1</b></div>
    <div id="message-display">READ THE RECIPE</div>
    <div id="subtitle">Tap pastries in the remembered order. Tap plated pastries to send them back.</div>
    <div id="game-over-screen">
      <div class="panel">
        <h1>BATCH<br>COLLAPSED</h1>
        <p>The spell souffle fell out of formation.</p>
        <p id="final-score">Tips: 0</p>
        <button id="restart-btn">REHEAT RUN</button>
      </div>
    </div>
  </div>
</div>
<script id="game-config" type="application/x-game-config">
{"baseTime":{"value":1.5},"timePerTile":{"value":0.8},"tileSpeed":{"value":10}}
</script>
<script>
'use strict';
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
let cw=0,ch=0,dpr=1,initialized=false,lastTime=0,rafStarted=false;
const defs=JSON.parse(document.getElementById('game-config').textContent);const gameConfig={baseTime:defs.baseTime.value,timePerTile:defs.timePerTile.value,tileSpeed:defs.tileSpeed.value};
let gameState='LOADING',score=0,level=1,sequence=[],playerSequence=[],tiles=[],slots=[],memorizeTimer=0,maxMemorizeTime=0,particles=[];
let audioCtx=null;const pastryNames=['','Croissant','Cupcake','Bread','Donut','Pie','Macaron','Tart','Bun','Eclair'];const pastryGlyph=['','🥐','🧁','🍞','🍩','🥧','●','◇','◒','▰'];
function seeded(levelNum){let s=(levelNum*9301+49297)%233280;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function playTone(type){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=type==='fail'?'sawtooth':type==='blocked'?'square':'triangle';let f=type==='success'?660:type==='click'?360:type==='blocked'?180:120;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(type==='success'?990:type==='click'?520:70,now+(type==='success'?.22:.16));g.gain.setValueAtTime(type==='success'?.18:.12,now);g.gain.exponentialRampToValueAtTime(.001,now+.28);o.start(now);o.stop(now+.3)}catch(e){}}
function vibrate(style){if(navigator.vibrate)navigator.vibrate(style==='heavy'?180:45)}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
class Tile{constructor(val,x,y){this.val=val;this.x=x;this.y=y;this.tx=x;this.ty=y;this.w=80;this.h=80;this.state='SLOT';this.slotIndex=-1;this.poolIndex=-1;this.shake=0;this.spark=0}update(dt){const speed=gameConfig.tileSpeed*dt*60;this.x+=(this.tx-this.x)*Math.min(1,.2*speed);this.y+=(this.ty-this.y)*Math.min(1,.2*speed);if(this.shake>0)this.shake=Math.max(0,this.shake-dt*30);if(this.spark>0)this.spark=Math.max(0,this.spark-dt*3)}draw(c,time){const sx=this.shake>0?(Math.random()-.5)*this.shake*10:0,sy=this.shake>0?(Math.random()-.5)*this.shake*10:0;c.save();c.translate(this.x+sx,this.y+sy);c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=12;c.shadowOffsetY=8;roundRect(c,-40,-40,80,80,16);const grad=c.createLinearGradient(-38,-38,38,38);grad.addColorStop(0,'#fff1c7');grad.addColorStop(.55,'#ffb35b');grad.addColorStop(1,'#c66b36');c.fillStyle=grad;c.fill();c.shadowBlur=0;c.lineWidth=3;c.strokeStyle=this.state==='SLOT'?'#48f0d4':'#ff5f9f';c.stroke();c.strokeStyle='rgba(255,255,255,.38)';c.lineWidth=1;c.strokeRect(-29,-30,58,6);c.fillStyle='rgba(90,42,28,.2)';c.beginPath();c.arc(0,4,24,0,Math.PI*2);c.fill();c.fillStyle='#231326';c.font='700 22px Rajdhani, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(pastryGlyph[this.val],0,-8);c.font='400 18px "Press Start 2P", monospace';c.fillText(String(this.val),0,22);if(this.spark>0){c.strokeStyle=`rgba(72,240,212,${this.spark})`;c.lineWidth=2;c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4+time*.004;c.moveTo(Math.cos(a)*44,Math.sin(a)*44);c.lineTo(Math.cos(a)*52,Math.sin(a)*52)}c.stroke()}c.restore()}}
class Particle{constructor(x,y,col){this.x=x;this.y=y;this.vx=(Math.random()-.5)*130;this.vy=(Math.random()-.8)*130;this.life=1;this.size=Math.random()*4+2;this.col=col||'#fff1c7'}update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=50*dt;this.life-=dt*1.8}draw(c){c.globalAlpha=Math.max(0,this.life);c.fillStyle=this.col;c.fillRect(this.x,this.y,this.size,this.size);c.globalAlpha=1}}
function spawnParticles(x,y,count,col){for(let i=0;i<count;i++)particles.push(new Particle(x,y,col))}
function updateHud(){document.querySelector('#score-display b').textContent=score;document.querySelector('#level-display b').textContent=level}
function layoutSlots(count){const w=80,gap=20,total=(w*count)+(gap*(count-1));let scale=Math.min(1,(cw-28)/total);const sw=w*scale,sg=gap*scale,start=(cw-(sw*count+sg*(count-1)))/2+sw/2;const y=ch*.34;slots=[];for(let i=0;i<count;i++)slots.push({x:start+i*(sw+sg),y,val:null,w:sw});tiles.forEach((t,i)=>{if(t.state==='SLOT'||gameState==='MEMORIZE'){t.tx=slots[i]?.x||t.tx;t.ty=y;if(gameState==='MEMORIZE'){t.x=t.tx;t.y=t.ty;t.slotIndex=i}}})}
function layoutPool(shuffle=true){const poolY=ch*.70,count=tiles.length,cols=Math.min(count,4),w=80,gap=20,total=(w*cols)+(gap*(cols-1));let scale=Math.min(1,(cw-28)/total);const sw=w*scale,sg=gap*scale,start=(cw-(sw*cols+sg*(cols-1)))/2+sw/2;let positions=[];for(let i=0;i<count;i++){const r=Math.floor(i/cols),c=i%cols;positions.push({x:start+c*(sw+sg),y:poolY+r*(sw+sg)})}if(shuffle){const rnd=seeded(level*17+3);positions.sort(()=>rnd()-.5)}tiles.forEach((t,i)=>{t.tx=positions[i].x;t.ty=positions[i].y;t.state='POOL';t.slotIndex=-1;t.w=80*scale;t.h=80*scale;t.poolIndex=i});slots.forEach(s=>s.val=null);playerSequence=[]}
function initLevel(){sequence=[];tiles=[];playerSequence=[];const count=Math.min(3+Math.floor((level-1)/3),6);const pool=[1,2,3,4,5,6,7,8,9],rnd=seeded(level);for(let i=0;i<count;i++){const idx=Math.floor(rnd()*pool.length);sequence.push(pool[idx]);pool.splice(idx,1)}layoutSlots(count);for(let i=0;i<count;i++){const s=slots[i];const t=new Tile(sequence[i],s.x,s.y);t.slotIndex=i;t.w=s.w;t.h=s.w;tiles.push(t)}maxMemorizeTime=gameConfig.baseTime+count*gameConfig.timePerTile;memorizeTimer=maxMemorizeTime;setState('MEMORIZE')}
function setState(s){gameState=s;const msg=document.getElementById('message-display'),go=document.getElementById('game-over-screen');if(s==='MEMORIZE'){msg.textContent='READ THE RECIPE';msg.style.color='#ff9f3f';msg.classList.add('visible');go.classList.remove('visible')}else if(s==='INPUT'){msg.textContent='PLATE THE SPELL';msg.style.color='#48f0d4';msg.classList.add('visible');layoutPool(true)}else if(s==='CHECK'){msg.textContent='TASTING...';msg.style.color='#fff1c7';checkSequence()}else if(s==='GAMEOVER'){msg.classList.remove('visible');document.getElementById('final-score').textContent=`Tips: ${score}`;go.classList.add('visible');playTone('fail');vibrate('heavy')}}
function checkSequence(){let correct=true;for(let i=0;i<sequence.length;i++){const tile=playerSequence[i];if(!tile||tile.val!==sequence[i]){correct=false;break}}setTimeout(()=>{if(correct){score+=100+level*50;level++;updateHud();playTone('success');spawnParticles(cw/2,ch*.35,28,'#48f0d4');initLevel()}else{tiles.forEach(t=>t.shake=1);playTone('fail');vibrate('heavy');spawnParticles(cw/2,ch*.35,24,'#ff5f9f');setTimeout(()=>setState('GAMEOVER'),850)}},450)}
function returnPoolGrid(){const poolTiles=tiles.filter(t=>t.state==='POOL');const count=tiles.length,cols=Math.min(count,4),w=80,gap=20,total=(w*cols)+(gap*(cols-1));let scale=Math.min(1,(cw-28)/total);const sw=w*scale,sg=gap*scale,start=(cw-(sw*cols+sg*(cols-1)))/2+sw/2,poolY=ch*.70;poolTiles.forEach((pt,i)=>{const r=Math.floor(i/cols),c=i%cols;pt.tx=start+c*(sw+sg);pt.ty=poolY+r*(sw+sg);pt.w=80*scale;pt.h=80*scale})}
function handleInput(e){if(e.target&&e.target.id==='restart-btn')return;if(gameState==='GAMEOVER'){initGame();return}if(gameState!=='INPUT')return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let tapped=null;for(let i=tiles.length-1;i>=0;i--){const t=tiles[i],hw=t.w/2,hh=t.h/2;if(Math.abs(x-t.x)<hw&&Math.abs(y-t.y)<hh){tapped=t;break}}if(!tapped)return;playTone('click');vibrate('light');spawnParticles(tapped.x,tapped.y,6,'#fff1c7');tapped.spark=1;if(tapped.state==='POOL'){const slotIdx=slots.findIndex(s=>s.val===null);if(slotIdx!==-1){const s=slots[slotIdx];tapped.tx=s.x;tapped.ty=s.y;tapped.state='SLOT';tapped.slotIndex=slotIdx;s.val=tapped;playerSequence[slotIdx]=tapped;if(slots.every(s=>s.val!==null))setState('CHECK')}else playTone('blocked')}else if(tapped.state==='SLOT'){const old=tapped.slotIndex;tapped.state='POOL';if(slots[old])slots[old].val=null;playerSequence[old]=null;tapped.slotIndex=-1;returnPoolGrid()}}
function initGame(){score=0;level=1;updateHud();document.getElementById('game-over-screen').classList.remove('visible');initLevel();initialized=true;if(!rafStarted){rafStarted=true;requestAnimationFrame(gameLoop)}}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cw=canvas.clientWidth;ch=canvas.clientHeight;canvas.width=Math.max(1,cw*dpr);canvas.height=Math.max(1,ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!initialized)initGame();else{layoutSlots(tiles.length);if(gameState==='INPUT')returnPoolGrid()}}
function drawChef(c,time){const x=Math.min(84,cw*.18),y=ch*.53,blink=Math.sin(time*.004)*2;c.save();c.translate(x,y);c.globalAlpha=.95;c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,72,52,12,0,0,Math.PI*2);c.fill();c.fillStyle='#fff1c7';c.fillRect(-23,-54,46,28);c.beginPath();c.arc(-18,-54,16,Math.PI,0);c.arc(0,-61,18,Math.PI,0);c.arc(18,-54,16,Math.PI,0);c.fill();c.strokeStyle='#48f0d4';c.lineWidth=3;c.stroke();c.fillStyle='#d98345';c.fillRect(-25,-25,50,55);c.fillStyle='#fff1c7';c.fillRect(-18,-18,36,45);c.fillStyle='#5b2c35';c.beginPath();c.arc(0,-26,23,0,Math.PI*2);c.fill();c.fillStyle='#fff1c7';c.fillRect(-13,-21,26,18);c.fillStyle='#211020';c.fillRect(-9,-25,5,5+blink);c.fillRect(5,-25,5,5+blink);c.fillStyle='#ff5f9f';c.fillRect(-4,-14,8,3);c.strokeStyle='#ff9f3f';c.lineWidth=6;c.beginPath();c.moveTo(22,2);c.lineTo(52,-28);c.stroke();c.strokeStyle='#48f0d4';c.lineWidth=2;for(let i=0;i<4;i++){c.beginPath();c.moveTo(52,-28);c.lineTo(62+Math.cos(time*.006+i)*4,-42+i*9);c.stroke()}c.fillStyle='rgba(72,240,212,.18)';c.beginPath();c.arc(0,-58,44,0,Math.PI*2);c.fill();c.restore()}
function drawBackground(c,time){const heat=Math.min(1,level/9);let g=c.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#25153d');g.addColorStop(.52,'#17102a');g.addColorStop(1,'#0b0715');c.fillStyle=g;c.fillRect(0,0,cw,ch);c.fillStyle=`rgba(255,159,63,${.10+heat*.08})`;c.beginPath();c.ellipse(cw*.5,ch*.42,cw*.42,ch*.18,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(255,241,199,.08)';c.lineWidth=1;for(let x=-cw;x<cw*2;x+=36){c.beginPath();c.moveTo(x+(time*.018%36),ch*.58);c.lineTo((x-cw*.5)*1.7+cw*.5,ch);c.stroke()}for(let y=ch*.60;y<ch;y+=28){c.beginPath();c.moveTo(0,y);c.lineTo(cw,y);c.stroke()}c.fillStyle='rgba(72,240,212,.14)';for(let i=0;i<10;i++){const px=(i*73+time*.025*(i+1))%(cw+90)-45,py=80+(i*47)%Math.max(100,ch*.52);c.fillRect(px,py,8,8)}c.strokeStyle='rgba(72,240,212,.3)';c.lineWidth=2;c.strokeRect(18,ch*.18,56,88);c.strokeRect(cw-74,ch*.18,56,88);c.fillStyle='rgba(255,159,63,.22)';c.fillRect(23,ch*.18+8,46,10);c.fillRect(cw-69,ch*.18+8,46,10)}
function drawSlots(c,time){if(!(gameState==='INPUT'||gameState==='CHECK'))return;slots.forEach((s,i)=>{const w=s.w||80;c.save();c.translate(s.x,s.y);c.fillStyle='rgba(18,10,27,.58)';roundRect(c,-w/2-5,-w/2-5,w+10,w+10,18);c.fill();c.strokeStyle=`rgba(72,240,212,${.30+Math.sin(time*.005+i)*.12})`;c.lineWidth=3;c.stroke();c.strokeStyle='rgba(255,159,63,.45)';c.lineWidth=2;c.beginPath();c.moveTo(-w/2+12,0);c.lineTo(w/2-12,0);c.stroke();c.fillStyle='rgba(255,241,199,.45)';c.font='600 12px Rajdhani';c.textAlign='center';c.fillText('TRAY '+(i+1),0,w/2+18);c.restore()})}
function drawTimer(c){if(gameState!=='MEMORIZE')return;const pct=Math.max(0,memorizeTimer/maxMemorizeTime);c.fillStyle='rgba(255,241,199,.12)';c.fillRect(0,0,cw,8);let tg=c.createLinearGradient(0,0,cw,0);tg.addColorStop(0,'#ff9f3f');tg.addColorStop(.55,'#fff1c7');tg.addColorStop(1,'#48f0d4');c.fillStyle=tg;c.fillRect(0,0,cw*pct,8)}
function gameLoop(time){const dt=Math.min((time-lastTime)/1000,.05)||0;lastTime=time;if(gameState==='MEMORIZE'){memorizeTimer-=dt;if(memorizeTimer<=0)setState('INPUT')}tiles.forEach(t=>t.update(dt));for(let i=particles.length-1;i>=0;i--){particles[i].update(dt);if(particles[i].life<=0)particles.splice(i,1)}drawBackground(ctx,time);drawChef(ctx,time);drawSlots(ctx,time);drawTimer(ctx);tiles.forEach(t=>t.draw(ctx,time));particles.forEach(p=>p.draw(ctx));ctx.fillStyle='rgba(255,241,199,.65)';ctx.font='600 13px Rajdhani';ctx.textAlign='center';ctx.fillText(gameState==='MEMORIZE'?'Memorize the glowing pastry callout.':'Plate pastries left-to-right from the prep pool.',cw/2,ch*.585);requestAnimationFrame(gameLoop)}
window.addEventListener('DOMContentLoaded',()=>{new ResizeObserver(resize).observe(canvas);window.addEventListener('pointerdown',handleInput,{passive:true});document.getElementById('restart-btn').addEventListener('click',()=>initGame());});
window.__gameDebug={get state(){return gameState},get score(){return score},get level(){return level},get sequence(){return sequence.slice()},get tiles(){return tiles.map(t=>({val:t.val,x:t.x,y:t.y,state:t.state,slotIndex:t.slotIndex}))},forceInput(){memorizeTimer=0},clickValue(v){const t=tiles.find(q=>q.val===v&&q.state==='POOL');if(t)handleInput({clientX:t.x,clientY:t.y,target:canvas})},wrongOrder(){memorizeTimer=0;setTimeout(()=>{const wrong=sequence.slice().reverse();if(wrong.join(',')===sequence.join(','))wrong.push(wrong.shift());wrong.forEach(v=>this.clickValue(v))},80)}};
</script>
</body>
</html>
