<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Climb</title>
    <!-- [agent-note][stage4] resolved-font-remap: display -> Orbitron, ui -> Exo 2 via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #07111f;
            --bg-bottom: #170b2f;
            --panel: rgba(11, 21, 44, 0.82);
            --panel-border: rgba(120, 243, 255, 0.4);
            --panel-shadow: rgba(0, 0, 0, 0.45);
            --accent: #78f3ff;
            --accent-strong: #8ef7c0;
            --danger: #ff4d6d;
            --warning: #ffd166;
            --text: #f6fbff;
            --muted: rgba(246, 251, 255, 0.62);
        }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at top, var(--bg-top), var(--bg-bottom) 70%); font-family: 'Exo 2', system-ui, sans-serif; }
        body { color: var(--text); }
        canvas { display: block; width: 100%; height: 100%; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .text-white { color: #fff; }
        .text-white\/50 { color: rgba(255, 255, 255, 0.5); }
        .text-white\/80 { color: rgba(255, 255, 255, 0.8); }
        .text-black { color: #000; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .font-bold { font-weight: 700; }
        .drop-shadow-md { text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45); }
        .bg-black\/80 { background: rgba(0, 0, 0, 0.8); }
        .bg-yellow-400 { background: #facc15; }
        .hover\:bg-yellow-500:hover { background: #eab308; }
        .p-8 { padding: 2rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .shadow-lg { box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3); }
        .transform { transform: translateZ(0); }
        .scale-100 { transform: scale(1); }
        .transition-all { transition: all 150ms ease; }
        .transition-transform { transition: transform 150ms ease; }
        .active\:scale-95:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        .glass {
            background: linear-gradient(180deg, rgba(18, 30, 60, 0.86), rgba(7, 10, 23, 0.92));
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 40px var(--panel-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }
        .hud-score {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.04em;
        }
        .ui-font, button, #debug-mood, #go-score {
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.04em;
        }
        .danger-font {
            font-family: 'Orbitron', system-ui, sans-serif;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.55), 0 0 24px rgba(255, 77, 109, 0.28);
            letter-spacing: 0.08em;
        }
        button {
            border: 0;
            cursor: pointer;
            touch-action: manipulation;
        }
        #game-container {
            touch-action: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(120, 243, 255, 0.18), transparent 36%),
                radial-gradient(circle at 20% 80%, rgba(142, 247, 192, 0.12), transparent 30%),
                linear-gradient(180deg, #0b1830 0%, #120722 52%, #04060d 100%);
        }
        #ui-layer::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 12%, rgba(120, 243, 255, 0.2), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(120,243,255,0.08));
            opacity: 0.85;
        }
        #hud {
            gap: 0.75rem;
        }
        #hud > * {
            background: linear-gradient(180deg, rgba(7, 18, 38, 0.92), rgba(11, 9, 26, 0.78));
            border: 1px solid rgba(120, 243, 255, 0.35);
            border-radius: 999px;
            padding: 0.45rem 0.85rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        #score-display {
            color: #f7fdff;
            text-shadow: 0 0 14px rgba(120, 243, 255, 0.45);
        }
        #debug-mood {
            min-width: 6.5rem;
            text-align: center;
            color: var(--muted);
        }
        #game-over-panel {
            width: min(84vw, 22rem);
            border-radius: 1.35rem;
        }
        #restart-btn {
            background: linear-gradient(180deg, var(--warning), #ffb703);
            box-shadow: 0 12px 24px rgba(255, 183, 3, 0.28);
        }
        #restart-btn:hover {
            filter: brightness(1.04);
        }
        #restart-btn:active {
            box-shadow: 0 6px 14px rgba(255, 183, 3, 0.24);
        }
        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            width: min(30vw, 7rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 12px 24px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(0.75rem) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease, filter 220ms ease;
            background: rgba(8, 15, 32, 0.6);
        }
        .feedback-gif.show {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }
        #combo-gif {
            top: 4.5rem;
        }
        #panic-gif {
            bottom: 1rem;
            width: min(34vw, 7.5rem);
            filter: hue-rotate(-18deg) saturate(1.05);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        @media (max-width: 520px) {
            .feedback-gif {
                width: min(28vw, 5.25rem);
                border-radius: 0.8rem;
            }
            #combo-gif {
                top: 4.25rem;
            }
            #panic-gif {
                bottom: 0.75rem;
                width: min(30vw, 5.75rem);
            }
        }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
</head>
<body>

<!-- ASSETS -->
<div id="assets" hidden>
    <!-- [agent-note][stage3] resolved-audio: loop + sfx remapped with catalogs/audios.json -->

<!-- CONFIG -->

{
    "heroSpeed": { "type": "number", "label": "Sensitivity", "value": 6, "min": 3, "max": 10 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 16, "min": 10, "max": 25 },

<!-- UI -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
        <!-- HUD -->
        <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start">
            <div class="text-white text-3xl drop-shadow-md hud-score">
                <span id="score-display">0m</span>
            </div>
            <div id="debug-mood" class="text-xs text-white/50 ui-font">SIGNAL: BRIGHT</div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: jump feedback + danger reaction from catalogs/gifs.json; kept off playfield edges -->
        <div id="feedback-layer" aria-hidden="true">
            <img id="combo-gif" class="feedback-gif" alt="" src="https://i.giphy.com/RPPgfntVAIhsRzSBgG.webp">
            <img id="panic-gif" class="feedback-gif" alt="" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">

        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/80 pointer-events-auto">

                <p id="go-score" class="text-xl text-white/80 mb-6 ui-font">Tower Height: 0m</p>

                    Reconnect
                </button>

        </div>

<script>
// --- §0 SYSTEM INVARIANTS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;

// State
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let gameConfig = {};
let lastTime = 0;
let frameId = null;

// Audio Context
let audioCtx = null;
let masterGain = null;
let audioUnlocked = false;
let warningArmed = true;
let lastJumpSfxAt = 0;
let lastLandSfxAt = 0;
let lastWarningSfxAt = 0;
let lastGameOverSfxAt = 0;
let lastRestartSfxAt = 0;
let previousVy = 0;

// Feedback
let comboGifTimeout = null;
let panicGifTimeout = null;

// --- §1 CONFIG & INIT ---
window.gameConfigDefs = {};
try {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in rawConfig) {
        window.gameConfigDefs[k] = rawConfig[k];
        gameConfig[k] = rawConfig[k].value;
    }
} catch (e) { console.error("Config parse error", e); }

window.updateGameConfig = (key, val) => {
    if (gameConfig.hasOwnProperty(key)) gameConfig[key] = val;
};

// --- §2 AUDIO SYSTEM ---
function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = new AudioContext();
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    masterGain.gain.value = 0.6;
}

function primeAudioEl(el, volume) {
    if (!el) return;
    el.preload = 'auto';
    el.volume = volume;
    el.crossOrigin = 'anonymous';
}

function safePlayMedia(el, options = {}) {
    if (!el) return;
    const now = performance.now();
    const reset = options.reset !== false;
    const minGap = options.minGap || 0;
    const volume = typeof options.volume === 'number' ? options.volume : el.volume;
    const lastKey = options.lastKey;

    if (lastKey && safePlayMedia[lastKey] && now - safePlayMedia[lastKey] < minGap) return;
    if (lastKey) safePlayMedia[lastKey] = now;

    try {
        if (reset) el.currentTime = 0;
        el.volume = volume;
        const playPromise = el.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    } catch (e) {}
}

function ensureLoopState(shouldPlay) {
    const bgm = document.getElementById('bgm_loop');
    if (!bgm) return;
    if (shouldPlay && audioUnlocked) {
        bgm.loop = true;
        bgm.volume = 0.28;
        if (bgm.paused) {
            const playPromise = bgm.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        }
    } else if (!bgm.paused) {
        bgm.pause();
    }
}

function unlockAudio() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    audioUnlocked = true;
    ensureLoopState(gameState === 'PLAYING');
}

function playSfx(type) {
    if (!audioUnlocked) return;

    if (type === 'jump') {
        const el = document.getElementById('sfx_jump');
        if (el) {
            el.playbackRate = 1 + (world.horrorFactor * 0.08);
            safePlayMedia(el, { volume: 0.35, minGap: 80, lastKey: 'jump' });
        }
    } else if (type === 'land') {
        const el = document.getElementById('sfx_land');
        if (el) {
            el.playbackRate = 1 - (world.horrorFactor * 0.12);
            safePlayMedia(el, { volume: 0.28, minGap: 120, lastKey: 'land' });
        }
    } else if (type === 'warning') {
        const el = document.getElementById('sfx_warning');
        if (el) {
            el.playbackRate = 0.92;
            safePlayMedia(el, { volume: 0.22, minGap: 900, lastKey: 'warning' });
        }
    } else if (type === 'death') {
        const el = document.getElementById('sfx_gameover');
        if (el) {
            el.playbackRate = 0.95;
            safePlayMedia(el, { volume: 0.4, minGap: 1200, lastKey: 'gameover' });
        }
    } else if (type === 'restart') {
        const el = document.getElementById('sfx_restart');
        if (el) {
            safePlayMedia(el, { volume: 0.22, minGap: 250, lastKey: 'restart' });
        }
    }
}

function showFeedbackGif(id, duration = 700) {
    const el = document.getElementById(id);
    if (!el) return;
    const timerKey = id === 'combo-gif' ? 'comboGifTimeout' : 'panicGifTimeout';
    if (window[timerKey]) clearTimeout(window[timerKey]);
    el.classList.add('show');
    window[timerKey] = setTimeout(() => el.classList.remove('show'), duration);
}

function updateFeedbackState() {
    const panicGif = document.getElementById('panic-gif');
    if (!panicGif) return;

    if (world.horrorFactor > 0.72 && gameState === 'PLAYING') {
        panicGif.classList.add('show');
    } else if (!panicGifTimeout) {
        panicGif.classList.remove('show');
    }
}

function vibrate(intensity) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: intensity }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(intensity === 'heavy' ? 200 : 50);
    }
}

// --- §3 GAME ENTITIES ---
const world = {
    gravity: 0.8,
    cameraY: 0,
    score: 0,
    horrorFactor: 0, // 0 to 1
    platforms: [],
    particles: [],
    targetCameraY: 0
};

const hero = {
    x: 0, y: 0, w: 40, h: 40,
    vx: 0, vy: 0,
    state: 'IDLE', // IDLE, JUMP, FALL
    faceTimer: 0
};

const input = {
    x: 0,
    active: false
};

function createPlatform(y) {
    const w = Math.max(60, cw * 0.25 - (world.horrorFactor * 40)); 
    const x = Math.random() * (cw - w);
    return {
        x, y, w, h: 20,
        type: Math.random() > 0.9 ? 'fragile' : 'normal',
        osc: Math.random() * Math.PI * 2,
        vx: (Math.random() - 0.5) * (world.horrorFactor * 5)
    };
}

function initGame() {
    // Reset World
    world.score = 0;
    world.cameraY = 0;
    world.targetCameraY = 0;
    world.horrorFactor = 0;
    world.platforms = [];
    world.particles = [];
    warningArmed = true;
    previousVy = 0;
    
    // Reset Hero
    hero.w = 40; hero.h = 40;
    hero.x = cw / 2 - hero.w / 2;
    hero.y = ch - 200;
    hero.vx = 0; hero.vy = -15;
    
    // Create initial platforms
    let y = ch;
    while (y > -ch) {
        y -= 120;
        world.platforms.push(createPlatform(y));
    }
    world.platforms.push({ x: 0, y: ch - 50, w: cw, h: 50, type: 'normal', vx: 0 });
    const starterCenterX = hero.x + hero.w / 2;
    const starterPlatforms = [
        { y: ch - 180, w: Math.max(96, cw * 0.24), offset: -Math.min(80, cw * 0.18) },
        { y: ch - 320, w: Math.max(92, cw * 0.22), offset: Math.min(70, cw * 0.16) },
        { y: ch - 455, w: Math.max(88, cw * 0.2), offset: -Math.min(60, cw * 0.14) }
    ];
    starterPlatforms.forEach((platform) => {
        const x = Math.max(0, Math.min(cw - platform.w, starterCenterX - (platform.w / 2) + platform.offset));
        world.platforms.push({ x, y: platform.y, w: platform.w, h: 20, type: 'normal', vx: 0 });
    });

    // Reset Audio
    const bgm = document.getElementById('bgm_loop');
    if (bgm) {
        bgm.playbackRate = 1.0;
        bgm.volume = 0.28;
    }
    ensureLoopState(audioUnlocked && gameState !== 'GAMEOVER');
    
    // Reset UI
    document.getElementById('score-display').innerText = '0m';
    document.getElementById('score-display').style.fontFamily = "'Orbitron', system-ui, sans-serif";
    document.getElementById('score-display').style.color = '#f7fdff';
    document.getElementById('debug-mood').innerText = 'SIGNAL: BRIGHT';
    document.getElementById('go-title').classList.remove('danger-font');
    document.getElementById('combo-gif').classList.remove('show');
    document.getElementById('panic-gif').classList.remove('show');
}

function spawnParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        world.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color || '#fff'
        });
    }
}

// --- §4 GAME LOGIC ---
function update(dt) {
    if (input.active) {
        const targetX = input.x - hero.w / 2;
        hero.x += (targetX - hero.x) * (gameConfig.heroSpeed * dt * 2);
    }
    
    hero.vy += world.gravity;
    hero.y += hero.vy * (dt * 60);
    
    if (hero.x < -hero.w) hero.x = cw;
    if (hero.x > cw) hero.x = -hero.w;

    if (hero.vy > 0) {
        const footY = hero.y + hero.h;
        
        for (let p of world.platforms) {
            if (hero.x + hero.w > p.x && hero.x < p.x + p.w) {
                const relativeY = footY - (p.y - world.cameraY);
                if (relativeY >= 0 && relativeY <= 25) {
                    if (previousVy > 1.5) {
                        playSfx('land');
                    }
                    hero.vy = -gameConfig.jumpForce;
                    playSfx('jump');
                    showFeedbackGif('combo-gif', 650);
                    vibrate('light');
                    
                    spawnParticles(hero.x + hero.w/2, footY, 5, world.horrorFactor > 0.5 ? '#8a0303' : '#fff');
                    
                    if (p.type === 'fragile') {
                        p.dead = true;
                    }
                    break;
                }
            }
        }
    }
    
    const thresh = ch * 0.45;
    if (hero.y < thresh) {
        const diff = thresh - hero.y;
        hero.y = thresh;
        world.score += diff;
        
        for (let p of world.platforms) {
            p.y += diff;
            if (p.y > ch) p.dead = true;
        }
    }
    
    const horrorStart = 1000;
    const horrorMax = 4000;
    world.horrorFactor = Math.max(0, Math.min(1, (world.score - horrorStart) / (horrorMax - horrorStart)));
    
    const bgm = document.getElementById('bgm_loop');
    if (bgm) {
        const targetRate = 1.0 - (world.horrorFactor * 0.28);
        if (Math.abs(bgm.playbackRate - targetRate) > 0.01) {
            bgm.playbackRate += (targetRate - bgm.playbackRate) * 0.05;
        }
        bgm.volume = 0.24 + (world.horrorFactor * 0.05);
    }

    if (world.horrorFactor > 0.58 && warningArmed) {
        playSfx('warning');
        showFeedbackGif('panic-gif', 1500);
        warningArmed = false;
    } else if (world.horrorFactor < 0.35) {
        warningArmed = true;
    }
    
    world.platforms = world.platforms.filter(p => !p.dead);
    const highestP = world.platforms.reduce((min, p) => p.y < min ? p.y : min, ch);
    if (highestP > 100) {
        world.platforms.push(createPlatform(highestP - (100 + Math.random() * 60)));
    }
    
    if (world.horrorFactor > 0.3) {
        for (let p of world.platforms) {
            p.x += p.vx;
            if (p.x < 0 || p.x > cw - p.w) p.vx *= -1;
        }
    }

    if (hero.y > ch) {
        playSfx('death');
        vibrate('heavy');
        setState('GAMEOVER');
    }

    for (let p of world.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= 0.05;
    }
    world.particles = world.particles.filter(p => p.life > 0);
    
    document.getElementById('score-display').innerText = Math.floor(world.score / 10) + 'm';
    const signalLabel = document.getElementById('debug-mood');
    if (signalLabel) {
        signalLabel.innerText = world.horrorFactor > 0.8 ? 'SIGNAL: CORRUPTED' : world.horrorFactor > 0.45 ? 'SIGNAL: FADING' : 'SIGNAL: BRIGHT';
        signalLabel.style.color = world.horrorFactor > 0.8 ? '#ff9aa9' : world.horrorFactor > 0.45 ? '#ffd166' : 'rgba(246, 251, 255, 0.62)';
    }
    
    if (world.horrorFactor > 0.8) {
        document.getElementById('score-display').style.fontFamily = "'Orbitron', system-ui, sans-serif";
        document.getElementById('score-display').style.color = '#ff4d6d';
    } else {
        document.getElementById('score-display').style.fontFamily = "'Orbitron', system-ui, sans-serif";
        document.getElementById('score-display').style.color = '#f7fdff';
    }

    updateFeedbackState();
    previousVy = hero.vy;
}

// --- §5 RENDER ---
function draw() {
    const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
    skyGradient.addColorStop(0, world.horrorFactor > 0.65 ? '#2d0620' : '#11284a');
    skyGradient.addColorStop(0.55, world.horrorFactor > 0.35 ? '#160d2d' : '#173666');
    skyGradient.addColorStop(1, world.horrorFactor > 0.75 ? '#020205' : gameConfig.startColor);
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, cw, ch);
    
    const beamGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.18, 10, cw * 0.5, ch * 0.18, cw * 0.55);
    beamGradient.addColorStop(0, `rgba(120, 243, 255, ${0.24 - world.horrorFactor * 0.12})`);
    beamGradient.addColorStop(1, 'rgba(120, 243, 255, 0)');
    ctx.fillStyle = beamGradient;
    ctx.fillRect(0, 0, cw, ch);
    
    if (world.horrorFactor > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${world.horrorFactor * 0.95})`;
        ctx.fillRect(0, 0, cw, ch);
        
        if (world.horrorFactor > 0.5) {
            ctx.fillStyle = `rgba(100, 0, 0, ${(world.horrorFactor - 0.5) * 0.4})`;
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillRect(0, 0, cw, ch);
            ctx.globalCompositeOperation = 'source-over';
        }
        
        if (Math.random() < world.horrorFactor * 0.2) {
            ctx.fillStyle = `rgba(255, 255, 255, 0.1)`;
            const h = Math.random() * ch;
            ctx.fillRect(0, h, cw, Math.random() * 20);
        }
        
        if (world.horrorFactor > 0.6 && Math.random() < 0.05) {
            const ex = Math.random() * cw;
            const ey = Math.random() * ch;
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(ex, ey, 3, 0, Math.PI*2);
            ctx.arc(ex + 10, ey, 3, 0, Math.PI*2);
            ctx.fill();
        }
    }
    
    const shake = world.horrorFactor * 5;
    const dx = (Math.random() - 0.5) * shake;
    const dy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(dx, dy);

    for (let p of world.platforms) {
        const platformGradient = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        if (world.horrorFactor < 0.5) {
            platformGradient.addColorStop(0, '#8ef7c0');
            platformGradient.addColorStop(1, '#3bc9db');
            ctx.fillStyle = platformGradient;
            roundRect(ctx, p.x, p.y, p.w, p.h, 10);
            ctx.strokeStyle = 'rgba(247, 253, 255, 0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'rgba(247, 253, 255, 0.25)';
            roundRect(ctx, p.x + 6, p.y + 4, Math.max(12, p.w * 0.35), 5, 3);
        } else {
            platformGradient.addColorStop(0, '#5f1831');
            platformGradient.addColorStop(1, '#1c0911');
            ctx.fillStyle = platformGradient;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = 'rgba(255, 77, 109, 0.4)';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
            if (world.horrorFactor > 0.8) {
                ctx.fillStyle = '#8a0303';
                ctx.fillRect(p.x + 5, p.y + p.h, 4, 10);
                ctx.fillRect(p.x + p.w - 10, p.y + p.h, 4, 15);
            }
        }
    }

    ctx.save();
    ctx.translate(hero.x + hero.w/2, hero.y + hero.h/2);
    
    let sx = 1, sy = 1;
    if (hero.vy < 0) { sx = 0.9; sy = 1.1; }
    else if (hero.vy > 0) { sx = 1.1; sy = 0.9; }
    ctx.scale(sx, sy);
    
    if (world.horrorFactor < 0.6) {
        const heroGradient = ctx.createLinearGradient(0, -hero.h/2, 0, hero.h/2);
        heroGradient.addColorStop(0, '#fff1a8');
        heroGradient.addColorStop(0.5, '#ffd166');
        heroGradient.addColorStop(1, '#ff9f1c');
        ctx.shadowColor = 'rgba(255, 209, 102, 0.65)';
        ctx.shadowBlur = 20;
        ctx.fillStyle = heroGradient;
        roundRect(ctx, -hero.w/2, -hero.h/2, hero.w, hero.h, 12);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        roundRect(ctx, -hero.w/2 + 5, -hero.h/2 + 5, hero.w - 16, 8, 5);
        ctx.fillStyle = '#122033';
        ctx.beginPath();
        ctx.arc(-8, -4, 4, 0, Math.PI*2);
        ctx.arc(8, -4, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#122033';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 4, 8, 0.15, Math.PI - 0.15, false);
        ctx.stroke();
        ctx.fillStyle = '#78f3ff';
        ctx.beginPath();
        ctx.arc(-13, -15, 4, 0, Math.PI*2);
        ctx.arc(13, -15, 4, 0, Math.PI*2);
        ctx.fill();
    } else {
        const glitchGradient = ctx.createLinearGradient(0, -hero.h/2, 0, hero.h/2);
        glitchGradient.addColorStop(0, '#280712');
        glitchGradient.addColorStop(1, '#000000');
        ctx.fillStyle = glitchGradient;
        ctx.fillRect(-hero.w/2, -hero.h/2, hero.w, hero.h);
        ctx.strokeStyle = 'rgba(255, 77, 109, 0.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(-hero.w/2, -hero.h/2, hero.w, hero.h);
        ctx.fillStyle = '#f44f67';
        ctx.fillRect(-10, -5, 6, 6);
        ctx.fillRect(6, -5, 6, 6);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.fillRect(-hero.w/2, -hero.h/2 + 6, hero.w, 3);
        if (Math.random() < 0.3) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(-hero.w/2 + Math.random()*hero.w, -hero.h/2 + Math.random()*hero.h, 4, 4);
        }
    }
    
    ctx.restore();

    for (let p of world.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
}

// --- §6 CORE LIFECYCLE ---
function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function setState(s) {
    gameState = s;
    const hud = document.getElementById('hud');
    const go = document.getElementById('game-over-screen');
    
    if (s === 'PLAYING') {
        hud.classList.remove('hidden');
        go.classList.add('hidden');
        ensureLoopState(true);
    } else if (s === 'GAMEOVER') {
        go.classList.remove('hidden');
        document.getElementById('go-score').innerText = `Tower Height: ${Math.floor(world.score/10)}m`;
        ensureLoopState(false);
        document.getElementById('panic-gif').classList.add('show');
        
        if (world.horrorFactor > 0.8) {
            document.getElementById('go-title').innerText = "THE STATIC FOUND YOU";
            document.getElementById('go-title').classList.add('danger-font');
            document.getElementById('game-over-panel').style.background = 'linear-gradient(180deg, rgba(64, 0, 16, 0.94), rgba(17, 0, 6, 0.96))';
        } else {
            document.getElementById('go-title').innerText = "Signal Lost";
            document.getElementById('go-title').classList.remove('danger-font');
            document.getElementById('game-over-panel').style.background = 'linear-gradient(180deg, rgba(18, 30, 60, 0.9), rgba(7, 10, 23, 0.94))';
        }
    }
}

function handleGlobalInput(e) {
    if (e.cancelable) e.preventDefault();
    unlockAudio();
    
    if (gameState === 'PLAYING') {
        const point = 'touches' in e ? e.touches[0] : e;
        if (!point) return;
        const rect = canvas.getBoundingClientRect();
        input.x = point.clientX - rect.left;
        input.active = true;
    }
}

function handleInputEnd(e) {
    if (e?.cancelable) e.preventDefault();
    input.active = false;
}

function restartGame() {
    initGame();
    setState('PLAYING');
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    if (gameState === 'PLAYING') {
        try {
            update(dt);
        } catch (e) {
            console.error(e);
            hero.y = 0;
        }
    }
    
    draw();
    frameId = requestAnimationFrame(loop);
}

window.addEventListener('DOMContentLoaded', () => {
    resize();
    window.addEventListener('resize', resize);

    primeAudioEl(document.getElementById('bgm_loop'), 0.28);
    primeAudioEl(document.getElementById('sfx_jump'), 0.35);
    primeAudioEl(document.getElementById('sfx_land'), 0.28);
    primeAudioEl(document.getElementById('sfx_warning'), 0.22);
    primeAudioEl(document.getElementById('sfx_gameover'), 0.4);
    primeAudioEl(document.getElementById('sfx_restart'), 0.22);
    
    // [agent-note][stage4] repaired: mobile-action-path | action: gameplay input stays on canvas so UI taps keep native activation
    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    canvas.addEventListener('pointermove', (e) => {
        if (gameState === 'PLAYING' && input.active) {
            if (e.cancelable) e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            input.x = e.clientX - rect.left;
        }
    }, { passive: false });
    canvas.addEventListener('pointerup', handleInputEnd, { passive: false });
    canvas.addEventListener('pointercancel', handleInputEnd, { passive: false });
    canvas.addEventListener('touchstart', handleGlobalInput, { passive: false });
    canvas.addEventListener('touchmove', handleGlobalInput, { passive: false });
    canvas.addEventListener('touchend', handleInputEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleInputEnd, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', () => {
        playSfx('restart');
        restartGame();
    });
    
    initGame();
    setState('PLAYING');
    requestAnimationFrame(loop);
});

</script>
