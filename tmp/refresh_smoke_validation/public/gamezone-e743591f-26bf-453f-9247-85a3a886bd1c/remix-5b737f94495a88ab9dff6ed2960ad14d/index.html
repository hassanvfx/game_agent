<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COBRA CLUTCH</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <!-- [agent-note][stage3] resolved-font: title-display -> Russo One | ui-hud -> Rajdhani from catalogs/fonts.json -->
    <style>
        :root {
            --bg-top: #07111f;
            --bg-bottom: #02060e;
            --panel: rgba(7, 18, 35, 0.82);
            --panel-strong: rgba(6, 15, 30, 0.94);
            --line: rgba(95, 244, 201, 0.26);
            --teal: #2df0bf;
            --teal-strong: #11c58e;
            --gold: #ffd452;
            --gold-soft: #ffea99;
            --danger: #ff5f67;
            --ink: #dffcf6;
            --muted: #8dbab0;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(17, 197, 142, 0.18), transparent 32%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: white;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%, transparent 82%, rgba(255,255,255,0.03)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.03) 0 1px,
                    transparent 1px 4px
                );
            opacity: 0.28;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .font-sport {
            font-family: 'Russo One', Impact, sans-serif;
            letter-spacing: 0.06em;
        }

        .font-ui {
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .fixed { position: fixed; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .top-1\/4 { top: 25%; }
        .top-1\/2 { top: 50%; }
        .left-0 { left: 0; }
        .left-1\/2 { left: 50%; }
        .w-full { width: 100%; }
        .w-12 { width: 3rem; }
        .w-64 { width: min(16rem, calc(100vw - 3rem)); }
        .w-80 { width: min(20rem, calc(100vw - 2rem)); }
        .w-96 { width: min(24rem, 78vw); }
        .h-full { height: 100%; }
        .h-2 { height: 0.5rem; }
        .h-12 { height: 3rem; }
        .h-96 { height: min(24rem, 78vw); }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .my-2 { margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .gap-0 { gap: 0; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .rounded { border-radius: 0.75rem; }
        .rounded-lg { border-radius: 1rem; }
        .rounded-full { border-radius: 999px; }
        .rounded-sm { border-radius: 0.5rem; }
        .border { border: 1px solid rgba(255,255,255,0.15); }
        .border-2 { border: 2px solid rgba(255,255,255,0.15); }
        .border-8 { border: 8px solid rgba(255,255,255,0.15); }
        .border-l-4 { border-left: 4px solid; }
        .shadow-lg { box-shadow: 0 14px 28px rgba(0,0,0,0.32); }
        .z-10 { z-index: 10; }
        .z-50 { z-index: 50; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.1rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.4rem; }
        .text-2xl { font-size: 1.5rem; line-height: 1.6rem; }
        .text-3xl { font-size: clamp(1.55rem, 4.4vw, 2rem); line-height: 1.1; }
        .text-4xl { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.02; }
        .text-5xl { font-size: clamp(2.3rem, 7vw, 3.2rem); line-height: 1; }
        .text-6xl { font-size: clamp(2.5rem, 11vw, 4.5rem); line-height: 0.95; }
        .font-bold { font-weight: 700; }
        .leading-none { line-height: 1; }
        .leading-tight { line-height: 0.98; }
        .uppercase { text-transform: uppercase; }
        .block { display: block; }
        .opacity-20 { opacity: 0.2; }
        .opacity-50 { opacity: 0.5; }
        .opacity-60 { opacity: 0.6; }
        .opacity-80 { opacity: 0.8; }
        .transform { transform-origin: center; }
        .-translate-x-1\/2 { transform: translateX(-50%); }
        .-translate-y-1\/2 { transform: translateY(-50%); }
        .-skew-x-6 { transform: skewX(-6deg); }
        .transition-colors { transition: color 0.18s ease, border-color 0.18s ease, background-color 0.18s ease; }
        .drop-shadow-md { text-shadow: 0 4px 12px rgba(0,0,0,0.45); }
        .drop-shadow-lg { text-shadow: 0 6px 18px rgba(0,0,0,0.55); }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .text-transparent { color: transparent; }
        .animate-pulse { animation: pulse 1.4s ease-in-out infinite; }

        #game-container {
            background:
                radial-gradient(circle at 50% 15%, rgba(45, 240, 191, 0.12), transparent 32%),
                linear-gradient(180deg, #07111f, #02060e 58%, #020409 100%);
        }

        #ui-layer {
            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
        }

        .sport-panel {
            background:
                linear-gradient(180deg, rgba(16, 28, 49, 0.96), rgba(3, 10, 20, 0.96));
            border: 2px solid rgba(255, 212, 82, 0.72);
            box-shadow:
                0 18px 40px rgba(0,0,0,0.56),
                inset 0 0 0 1px rgba(255,255,255,0.06),
                0 0 24px rgba(45, 240, 191, 0.12);
            backdrop-filter: blur(10px);
        }

        .hud-card {
            background: linear-gradient(180deg, rgba(6, 18, 32, 0.82), rgba(4, 10, 19, 0.94));
            border: 1px solid rgba(45, 240, 191, 0.22);
            box-shadow:
                0 10px 20px rgba(0,0,0,0.26),
                inset 0 0 0 1px rgba(255,255,255,0.04);
            border-radius: 0.9rem;
            backdrop-filter: blur(8px);
        }

        .score-card {
            position: relative;
            overflow: hidden;
        }

        .score-card::before,
        .lives-card::before,
        .sport-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.12), transparent 30%),
                linear-gradient(180deg, transparent, rgba(45,240,191,0.05));
        }

        .score-title,
        .lives-title,
        .capsule-label {
            color: var(--muted);
            letter-spacing: 0.26em;
            text-shadow: 0 0 8px rgba(45, 240, 191, 0.2);
        }

        .score-value {
            color: #ffffff;
            text-shadow:
                0 2px 0 rgba(0,0,0,0.5),
                0 0 18px rgba(255, 212, 82, 0.22);
        }

        .btn-start,
        .btn-secondary,
        #mute-btn {
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .btn-start {
            background:
                linear-gradient(180deg, #1ef2bb 0%, #11c58e 52%, #0f8f67 100%);
            border: 2px solid rgba(219, 255, 244, 0.74);
            color: #08261f;
            text-transform: uppercase;
            box-shadow:
                0 8px 0 #0a6549,
                0 14px 28px rgba(0,0,0,0.36),
                0 0 22px rgba(45, 240, 191, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.18s ease;
        }

        .btn-start:hover {
            filter: brightness(1.05);
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #0a6549,
                0 8px 16px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background: linear-gradient(180deg, rgba(54, 70, 98, 0.96), rgba(26, 35, 53, 0.96));
            border: 1px solid rgba(151, 176, 220, 0.35);
            color: #d7e8ff;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        .btn-secondary:hover {
            background: linear-gradient(180deg, rgba(71, 89, 123, 0.96), rgba(31, 42, 63, 0.96));
        }

        #mute-btn {
            border-color: rgba(45, 240, 191, 0.32);
            background: rgba(8, 15, 28, 0.88);
            color: #cffbf0;
            box-shadow:
                0 10px 18px rgba(0,0,0,0.28),
                inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        #mute-btn:hover {
            color: white;
            border-color: rgba(45, 240, 191, 0.72);
            background: rgba(10, 23, 39, 0.95);
        }

        #msg-text {
            color: var(--gold);
            text-shadow:
                0 0 0 rgba(0,0,0,0),
                0 3px 0 rgba(0,0,0,0.8),
                0 0 18px rgba(255, 212, 82, 0.35);
            -webkit-text-stroke: 2px rgba(5, 12, 20, 0.9);
        }

        .hero-shell {
            position: relative;
            width: min(17rem, 72vw);
            aspect-ratio: 1 / 1;
            margin-bottom: 1.25rem;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 42%, rgba(45, 240, 191, 0.3), rgba(45, 240, 191, 0.08) 32%, transparent 58%),
                radial-gradient(circle at 50% 50%, rgba(255, 212, 82, 0.12), transparent 64%);
            box-shadow:
                inset 0 0 0 2px rgba(45, 240, 191, 0.16),
                0 0 36px rgba(45, 240, 191, 0.1);
        }

        .hero-shell::before,
        .hero-shell::after {
            content: "";
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            border: 2px solid rgba(45, 240, 191, 0.14);
        }

        .hero-shell::after {
            inset: 2%;
            border-color: rgba(255, 212, 82, 0.24);
            opacity: 0.6;
        }

        .cobra-emblem {
            position: absolute;
            inset: 50% auto auto 50%;
            width: 56%;
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
        }

        .cobra-ring {
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            border: 3px solid rgba(255, 212, 82, 0.72);
            box-shadow: 0 0 16px rgba(255, 212, 82, 0.26);
        }

        .cobra-head {
            position: absolute;
            width: 60%;
            height: 60%;
            background:
                linear-gradient(180deg, #34f5c7 0%, #0fae7d 60%, #0a6f56 100%);
            clip-path: polygon(50% 0%, 76% 18%, 88% 40%, 79% 74%, 50% 100%, 21% 74%, 12% 40%, 24% 18%);
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.16);
        }

        .cobra-head::before,
        .cobra-head::after {
            content: "";
            position: absolute;
            top: 30%;
            width: 12%;
            height: 12%;
            border-radius: 50%;
            background: #07111f;
            box-shadow: 0 0 8px rgba(255,255,255,0.16);
        }

        .cobra-head::before { left: 24%; }
        .cobra-head::after { right: 24%; }

        .cobra-hood {
            position: absolute;
            inset: 16%;
            border-radius: 50%;
            border-top: 16px solid rgba(255, 212, 82, 0.88);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            transform: rotate(180deg);
            opacity: 0.9;
        }

        .cobra-fangs {
            position: absolute;
            bottom: 21%;
            width: 20%;
            height: 18%;
        }

        .cobra-fangs::before,
        .cobra-fangs::after {
            content: "";
            position: absolute;
            bottom: 0;
            width: 24%;
            height: 88%;
            background: #f9feff;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }

        .cobra-fangs::before { left: 18%; }
        .cobra-fangs::after { right: 18%; }

        .cobra-tongue {
            position: absolute;
            bottom: 12%;
            width: 12%;
            height: 18%;
            background: linear-gradient(180deg, #ff8c8c, #ff5262);
            clip-path: polygon(50% 0%, 82% 28%, 64% 100%, 50% 74%, 36% 100%, 18% 28%);
        }

        .start-tag {
            color: var(--danger);
            text-shadow: 0 0 14px rgba(255, 95, 103, 0.28);
            letter-spacing: 0.42em;
        }

        .title-stack {
            position: relative;
            z-index: 10;
            padding: 0 1rem;
        }

        .title-stack h1 {
            margin: 0;
            text-shadow:
                0 4px 0 rgba(0,0,0,0.46),
                0 0 20px rgba(45, 240, 191, 0.18);
        }

        .title-main {
            background-image: linear-gradient(180deg, #ffef98 0%, #ffd452 32%, #28edba 100%);
        }

        .subtitle {
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(0.98rem, 3vw, 1.2rem);
            letter-spacing: 0.4em;
            color: #effffb;
            opacity: 0.9;
            margin-top: 0.45rem;
        }

        .danger-line {
            display: inline-block;
            margin-top: 0.35rem;
            color: #ff7d89;
            text-shadow: 0 0 12px rgba(255, 95, 103, 0.25);
        }

        .rules-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 2.25rem;
            padding: 0.5rem 0.9rem;
            margin-bottom: 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(45, 240, 191, 0.22);
            background: rgba(4, 14, 27, 0.78);
            color: #c8f8ed;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }

        .modal-card {
            position: relative;
            max-height: min(90vh, 42rem);
            display: flex;
            flex-direction: column;
        }

        .modal-content {
            overflow-y: auto;
        }

        .panel-glow {
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04),
                0 0 24px rgba(45, 240, 191, 0.1),
                0 16px 32px rgba(0,0,0,0.4);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(45, 240, 191, 0.45), transparent);
        }

        .mini-note {
            color: rgba(220, 241, 255, 0.68);
            font-size: 0.78rem;
            letter-spacing: 0.18em;
        }

        .reaction-badge {
            min-width: 7.5rem;
            padding: 0.38rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(5, 14, 26, 0.86);
            color: #f6fffc;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            backdrop-filter: blur(8px);
        }

        .gif-overlay {
            position: absolute;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));
            width: min(8.75rem, 32vw);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(4, 12, 24, 0.88);
            box-shadow: 0 14px 24px rgba(0,0,0,0.36);
            opacity: 0;
            transform: translateY(18px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .gif-overlay.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .gif-overlay img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .gif-caption {
            padding: 0.4rem 0.55rem 0.5rem;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #dffcf6;
            text-align: center;
            background: linear-gradient(180deg, rgba(3, 12, 22, 0.2), rgba(3, 12, 22, 0.82));
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake-anim { animation: shake 0.2s ease-in-out; }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1.0); opacity: 1; }
        }

        .pop-in { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes pulse {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }

        @keyframes floatRing {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -51.5%) scale(1.03); }
        }

        .hero-shell .cobra-emblem {
            animation: floatRing 2.6s ease-in-out infinite;
        }

        @media (max-width: 640px) {
            #hud { padding: 0.35rem; }
            #msg-overlay { top: 17%; }
            .sport-panel { border-radius: 0.9rem; }
            .p-8 { padding: 1.25rem; }
            .p-6 { padding: 1rem; }
            .btn-start { box-shadow: 0 7px 0 #0a6549, 0 12px 18px rgba(0,0,0,0.34); }
            .score-title,
            .lives-title,
            .capsule-label { letter-spacing: 0.18em; }
            .subtitle { letter-spacing: 0.22em; }
            .start-tag { letter-spacing: 0.32em; }
            .gif-overlay {
                width: min(6.5rem, 28vw);
                bottom: max(82px, env(safe-area-inset-bottom) + 66px);
            }
            .reaction-badge {
                min-width: 6.5rem;
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>

    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between z-10">

            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="w-full p-4 flex justify-between items-start hidden">
                <div class="hud-card score-card flex flex-col gap-0 p-2">
                    <div class="text-xs font-bold uppercase score-title">CLUTCH</div>
                    <div class="text-5xl font-sport leading-none score-value" id="score-display">0</div>
                </div>

                <div class="flex flex-col items-end gap-2">
                    <div id="reaction-badge" class="reaction-badge hidden">Game face</div>
                    <div class="lives-card hud-card flex flex-col items-end gap-1 p-2 relative overflow-hidden">
                        <div class="text-xs font-bold uppercase lives-title">SHOTS LEFT</div>
                        <div class="flex gap-2" id="lives-display">
                            <!-- Filled by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Message Overlay -->
            <div id="msg-overlay" class="absolute top-1/4 w-full text-center hidden pointer-events-none">
                <div id="msg-text" class="text-6xl font-sport">CLUTCH!</div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: score + miss overlays -> catalogs/gifs.json webp assets kept off playfield -->
            <div id="gif-overlay" class="gif-overlay pointer-events-none" aria-hidden="true">
                <img id="gif-image" alt="reaction overlay" loading="lazy">
                <div id="gif-caption" class="gif-caption">COBRA MODE</div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto z-50">
                <div class="absolute inset-0 overflow-hidden opacity-20 pointer-events-none">
                    <div class="absolute inset-0"></div>
                </div>

                <div class="hero-shell" aria-hidden="true">
                    <div class="cobra-emblem">
                        <div class="cobra-ring"></div>
                        <div class="cobra-hood"></div>
                        <div class="cobra-head"></div>
                        <div class="cobra-fangs"></div>
                        <div class="cobra-tongue"></div>
                    </div>
                </div>

                <div class="text-center mb-8 title-stack">
                    <div class="text-sm font-bold start-tag mb-2 animate-pulse">NEON STRIKE</div>
                    <h1 class="text-6xl font-sport text-transparent bg-clip-text title-main leading-tight">
                        COBRA<br>
                        <span class="subtitle block">CLUTCH</span>
                        <span class="danger-line">RUN</span>
                    </h1>
                </div>

                <div class="rules-chip">Swipe back and launch the fang shot</div>

                <button id="start-btn" class="btn-start w-64 p-6 rounded-sm text-center relative overflow-hidden mb-6">
                    <div class="text-3xl font-sport relative z-10 drop-shadow-md">START RUN</div>
                    <div class="text-xs relative z-10 mt-1 opacity-80">DRAG TO ARC EACH SHOT</div>
                </button>

                <button id="mute-btn" class="w-12 h-12 rounded-full border-2 flex items-center justify-center text-xl transition-colors">🔊</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center pointer-events-auto hidden z-50" style="background: rgba(1, 4, 10, 0.9);">
                <div class="sport-panel modal-card modal-content p-8 rounded-lg text-center w-80 relative overflow-hidden panel-glow">
                    <div class="absolute top-0 left-0 w-full h-2" style="background: linear-gradient(90deg, #ff5f67, #ffd452, #2df0bf);"></div>

                    <div class="rules-chip" style="margin-inline: auto;">Run complete</div>
                    <h2 class="text-4xl font-sport mb-1">RUN OVER</h2>
                    <div class="capsule-label mb-8 text-xs uppercase">CLUTCH SUMMARY</div>

                    <div class="hud-card rounded p-4 mb-6 relative overflow-hidden">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-sm font-bold" style="color: var(--gold-soft);">SINKS</span>
                            <span id="go-score" class="text-5xl font-sport score-value">0</span>
                        </div>
                        <div class="divider my-2"></div>
                        <div class="flex justify-between items-end">
                            <span class="mini-note uppercase">BEST RUN</span>
                            <span id="go-best" class="text-xl font-bold" style="color: #f1fbff;">0</span>
                        </div>
                    </div>

                    <button id="restart-btn" class="w-full py-4 btn-start font-sport text-2xl rounded shadow-lg mb-3">
                        RUN IT BACK
                    </button>
                    <button id="menu-btn" class="w-full py-3 btn-secondary rounded text-sm font-bold">
                        MAIN MENU
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /*
         * COBRAS vs WILDCATS
         * Single File Implementation
         */

        // --- Configuration ---
        const CFG = {
            gravity: 0.65,
            friction: 0.99,
            restitution: 0.7,
            ballRadius: 18,
            rimRadius: 4,
            hoopWidth: 75,
            dragScale: 0.18,
            maxDrag: 220,
            colors: {
                cobraPrimary: '#2df0bf',
                cobraDark: '#0d7d63',
                cobraGold: '#ffd452',
                wildcatRed: '#ff5f67',
                wildcatWhite: '#ffffff',
                court: '#08101d',
                courtLine: '#123149',
                ball: '#12d5a0'
            },
            media: {
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3',
                shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3',
                bounce: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',
                rim: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3',
                score: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3',
                swish: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3',
                fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',
                gameover: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3',
                ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3',
                menu: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3',
                scoreGif: 'https://i.giphy.com/ye080RbECtcCnkrSyD.webp',
                missGif: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
            }
        };

        // --- Audio System ---
        // [agent-note][stage3] resolved-audio: bgm + shoot + score + fail + ui from catalogs/audios.json with gesture-safe playback
        const AudioSys = {
            ctx: null,
            muted: false,
            started: false,
            bgm: null,
            sounds: {},
            lastPlayAt: {},
            baseVolumes: {
                bgm: 0.24,
                shoot: 0.8,
                bounce: 0.4,
                rim: 0.48,
                score: 0.82,
                swish: 0.6,
                fail: 0.58,
                gameover: 0.72,
                ui: 0.5,
                start: 0.64,
                menu: 0.54
            },
            init() {
                if (this.ctx) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) this.ctx = new AC();
            },
            unlock() {
                this.init();
                this.started = true;
                if (!this.ctx) return Promise.resolve();
                if (this.ctx.state === 'suspended') {
                    return this.ctx.resume().catch(() => {});
                }
                return Promise.resolve();
            },
            ensureAudio(id, options = {}) {
                if (this.sounds[id]) return this.sounds[id];
                const audio = new Audio(CFG.media[id]);
                audio.preload = 'auto';
                audio.playsInline = true;
                audio.crossOrigin = 'anonymous';
                audio.loop = Boolean(options.loop);
                audio.volume = options.volume ?? this.baseVolumes[id] ?? 0.6;
                this.sounds[id] = audio;
                return audio;
            },
            play(id, options = {}) {
                if (this.muted || !this.started) return;
                const now = performance.now();
                const cooldown = options.cooldown ?? 0;
                if (cooldown && this.lastPlayAt[id] && now - this.lastPlayAt[id] < cooldown) return;
                this.lastPlayAt[id] = now;

                const loop = Boolean(options.loop);
                const base = this.ensureAudio(id, { loop, volume: options.volume });
                const volume = options.volume ?? this.baseVolumes[id] ?? 0.6;

                if (loop) {
                    base.loop = true;
                    base.volume = volume;
                    if (this.bgm !== base) {
                        if (this.bgm) this.stopLoop();
                        this.bgm = base;
                    }
                    if (base.paused) {
                        base.currentTime = options.keepTime ? base.currentTime : 0;
                        base.play().catch(() => {});
                    }
                    return;
                }

                let player = base;
                if (!base.paused && base.currentTime > 0.02 && !base.ended) {
                    player = base.cloneNode();
                    player.preload = 'auto';
                    player.playsInline = true;
                    player.crossOrigin = 'anonymous';
                }
                player.volume = volume;
                player.currentTime = 0;
                player.play().catch(() => {});
            },
            startLoop() {
                this.play('bgm', { loop: true, volume: this.baseVolumes.bgm });
            },
            stopLoop() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            },
            pauseLoop() {
                if (!this.bgm) return;
                this.bgm.pause();
            },
            toggleMute() {
                this.muted = !this.muted;
                if (this.muted) {
                    Object.values(this.sounds).forEach(audio => audio.pause());
                } else if (state.mode === 'PLAY') {
                    this.startLoop();
                }
                return this.muted;
            }
        };

        // --- Game State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const reactionBadge = document.getElementById('reaction-badge');
        const gifOverlay = document.getElementById('gif-overlay');
        const gifImage = document.getElementById('gif-image');
        const gifCaption = document.getElementById('gif-caption');

        let state = {
            mode: 'MENU',
            width: 0,
            height: 0,
            score: 0,
            lives: 3,
            best: localStorage.getItem('cobras_best') || 0,
            phase: 'AIM',
            dragStart: null,
            dragCurr: null,
            shake: 0
        };

        let ball = { x: 0, y: 0, vx: 0, vy: 0, r: CFG.ballRadius, rot: 0 };
        let hoop = { x: 0, y: 0, w: CFG.hoopWidth, rimY: 0 };
        let particles = [];
        let msgTimer = 0;
        let scoreFlash = 0;
        let gifTimer = null;

        // --- Core Functions ---
        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;
        }
        window.addEventListener('resize', resize);
        resize();

        function setReaction(text, tone = 'neutral') {
            reactionBadge.textContent = text;
            reactionBadge.classList.remove('hidden');
            reactionBadge.style.borderColor = tone === 'good'
                ? 'rgba(45, 240, 191, 0.55)'
                : tone === 'bad'
                    ? 'rgba(255, 95, 103, 0.55)'
                    : 'rgba(255,255,255,0.18)';
            reactionBadge.style.color = tone === 'bad' ? '#ffd8dc' : '#f6fffc';
        }

        function showGif(type) {
            if (gifTimer) clearTimeout(gifTimer);
            if (type === 'score') {
                gifImage.src = CFG.media.scoreGif;
                gifCaption.textContent = 'COBRA HEAT';
            } else {
                gifImage.src = CFG.media.missGif;
                gifCaption.textContent = 'SHAKE IT OFF';
            }
            gifOverlay.classList.add('visible');
            gifTimer = setTimeout(() => {
                gifOverlay.classList.remove('visible');
            }, 1800);
        }

        function hideGif() {
            gifOverlay.classList.remove('visible');
        }

        function resetGame() {
            state.score = 0;
            state.lives = 3;
            state.phase = 'AIM';
            scoreFlash = 0;
            setReaction('Game face', 'neutral');
            hideGif();
            updateHUD();
            resetRound(true);
            AudioSys.startLoop();
            requestAnimationFrame(loop);
        }

        function resetRound(first = false) {
            const pad = 60;
            const hoopX = pad + Math.random() * (state.width - pad * 2);
            const hoopY = state.height * 0.25 + Math.random() * (state.height * 0.2);

            hoop.x = hoopX;
            hoop.y = hoopY;
            hoop.rimY = hoopY;

            const ballX = pad + Math.random() * (state.width - pad * 2);
            ball.x = ballX;
            ball.y = state.height - 120;
            ball.vx = 0;
            ball.vy = 0;
            ball.rot = 0;

            state.phase = 'AIM';
            state.dragStart = null;
            state.dragCurr = null;

            if (Math.abs(ball.x - hoop.x) < 60) {
                ball.x = (ball.x < state.width / 2) ? ball.x + 120 : ball.x - 120;
            }

            if (!first) {
                particles.push({
                    x: ball.x,
                    y: ball.y,
                    vx: 0,
                    vy: -0.6,
                    life: 0.9,
                    color: 'rgba(45, 240, 191, 0.45)',
                    size: 24,
                    ring: true
                });
            }
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = state.score;
            const livesContainer = document.getElementById('lives-display');
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const div = document.createElement('div');
                const isActive = i < state.lives;
                div.className = 'w-12 h-12 relative';
                div.style.width = '1.35rem';
                div.style.height = '1.35rem';
                div.style.borderRadius = '999px';
                div.style.border = isActive ? '2px solid rgba(255, 212, 82, 0.9)' : '2px solid rgba(95, 119, 132, 0.45)';
                div.style.background = isActive
                    ? 'radial-gradient(circle at 35% 35%, #7dffe0, #19d8a4 42%, #0d7d63 100%)'
                    : 'linear-gradient(180deg, rgba(29, 42, 58, 0.9), rgba(10, 18, 29, 0.9))';
                div.style.boxShadow = isActive ? '0 0 10px rgba(45, 240, 191, 0.2)' : 'none';
                div.style.opacity = isActive ? '1' : '0.45';
                div.style.position = 'relative';
                div.style.overflow = 'hidden';

                const eye = document.createElement('div');
                eye.style.position = 'absolute';
                eye.style.inset = '28% 34% auto auto';
                eye.style.width = '24%';
                eye.style.height = '24%';
                eye.style.borderRadius = '50%';
                eye.style.background = isActive ? '#04131f' : 'rgba(255,255,255,0.15)';
                eye.style.left = '34%';

                const tongue = document.createElement('div');
                tongue.style.position = 'absolute';
                tongue.style.left = '42%';
                tongue.style.bottom = '12%';
                tongue.style.width = '16%';
                tongue.style.height = '22%';
                tongue.style.background = isActive ? '#ff6673' : 'rgba(255,255,255,0.08)';
                tongue.style.clipPath = 'polygon(50% 0%, 100% 50%, 68% 100%, 50% 72%, 32% 100%, 0 50%)';

                div.appendChild(eye);
                div.appendChild(tongue);
                livesContainer.appendChild(div);
            }
        }

        function showMsg(text) {
            const el = document.getElementById('msg-overlay');
            const txt = document.getElementById('msg-text');
            txt.innerText = text;
            el.classList.remove('hidden');
            txt.classList.add('pop-in');
            void txt.offsetWidth;
            msgTimer = 80;
        }

        // --- Physics & Logic ---
        function update() {
            if (state.shake > 0) state.shake *= 0.85;
            if (state.shake < 0.5) state.shake = 0;
            if (scoreFlash > 0) scoreFlash *= 0.9;
            if (scoreFlash < 0.08) scoreFlash = 0;

            if (msgTimer > 0) {
                msgTimer--;
                if (msgTimer <= 0) {
                    document.getElementById('msg-overlay').classList.add('hidden');
                    document.getElementById('msg-text').classList.remove('pop-in');
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.ring ? 0.035 : 0.02;
                if (!p.ring) p.vy += 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (state.phase === 'FLY') {
                ball.vy += CFG.gravity;
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.rot += ball.vx * 0.05;

                const floorY = state.height - 80;
                if (ball.y > floorY - ball.r) {
                    ball.y = floorY - ball.r;
                    ball.vy *= -CFG.restitution;
                    ball.vx *= CFG.friction;
                    if (Math.abs(ball.vy) > 2) AudioSys.play('bounce', { cooldown: 90 });
                    handleMiss();
                }

                if (ball.x < ball.r) {
                    ball.x = ball.r;
                    ball.vx *= -CFG.restitution;
                    AudioSys.play('bounce', { cooldown: 90 });
                }
                if (ball.x > state.width - ball.r) {
                    ball.x = state.width - ball.r;
                    ball.vx *= -CFG.restitution;
                    AudioSys.play('bounce', { cooldown: 90 });
                }

                checkHoopCollision();

                if (ball.y > state.height + 50) {
                    handleMiss();
                }
            }
        }

        function checkHoopCollision() {
            const rimL = { x: hoop.x - hoop.w / 2, y: hoop.rimY };
            const rimR = { x: hoop.x + hoop.w / 2, y: hoop.rimY };

            [rimL, rimR].forEach(rim => {
                const dx = ball.x - rim.x;
                const dy = ball.y - rim.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
                const minDist = ball.r + CFG.rimRadius;

                if (dist < minDist) {
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const pen = minDist - dist;

                    ball.x += nx * pen;
                    ball.y += ny * pen;

                    const dot = ball.vx * nx + ball.vy * ny;
                    ball.vx = (ball.vx - 2 * dot * nx) * 0.5;
                    ball.vy = (ball.vy - 2 * dot * ny) * 0.5;

                    AudioSys.play('rim', { cooldown: 120 });
                }
            });

            const inX = ball.x > rimL.x + ball.r / 3 && ball.x < rimR.x - ball.r / 3;
            const crossedY = (ball.y - ball.vy < hoop.rimY) && (ball.y >= hoop.rimY);

            if (inX && crossedY && ball.vy > 0) {
                handleScore();
            }
        }

        function handleScore() {
            if (state.phase !== 'FLY') return;
            state.phase = 'RESET';

            state.score++;
            scoreFlash = 1;

            AudioSys.play('swish', { cooldown: 150 });
            AudioSys.play('score', { cooldown: 180 });

            const phrases = ['CLUTCH!', 'FANG SHOT!', 'SNAKE EYES!', 'PURE ARC!'];
            showMsg(phrases[Math.floor(Math.random() * phrases.length)]);
            setReaction(state.score >= 3 ? 'Hot streak' : 'Buckets up', 'good');
            showGif('score');

            createParticles(ball.x, ball.y, CFG.colors.cobraPrimary);
            createParticles(ball.x, ball.y, CFG.colors.cobraGold);
            state.shake = 5;

            updateHUD();

            setTimeout(() => {
                resetRound();
            }, 1000);
        }

        function handleMiss() {
            if (state.phase !== 'FLY') return;
            state.phase = 'RESET';

            state.lives--;
            updateHUD();
            state.shake = 5;
            setReaction(state.lives > 0 ? 'Reset focus' : 'Run busted', 'bad');
            showGif('miss');
            AudioSys.play('fail', { cooldown: 200 });

            if (state.lives <= 0) {
                AudioSys.play('gameover', { cooldown: 220 });
                gameOver();
            } else {
                setTimeout(() => {
                    resetRound();
                }, 800);
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function gameOver() {
            state.mode = 'OVER';
            AudioSys.pauseLoop();
            if (state.score > state.best) {
                state.best = state.score;
                localStorage.setItem('cobras_best', state.best);
            }
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('go-score').innerText = state.score;
            document.getElementById('go-best').innerText = state.best;
        }

        // --- Rendering ---
        function drawCourtBackground() {
            const floorY = state.height - 80;

            const bgGrad = ctx.createLinearGradient(0, 0, 0, state.height);
            bgGrad.addColorStop(0, '#07111f');
            bgGrad.addColorStop(0.55, '#091728');
            bgGrad.addColorStop(1, '#02060e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, state.width, state.height);

            const spotlight = ctx.createRadialGradient(state.width / 2, state.height * 0.28, 30, state.width / 2, state.height * 0.28, state.width * 0.45);
            spotlight.addColorStop(0, 'rgba(45, 240, 191, 0.12)');
            spotlight.addColorStop(0.55, 'rgba(45, 240, 191, 0.03)');
            spotlight.addColorStop(1, 'rgba(45, 240, 191, 0)');
            ctx.fillStyle = spotlight;
            ctx.fillRect(0, 0, state.width, state.height);

            for (let i = 0; i < 18; i++) {
                const y = (state.height / 18) * i;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.01)' : 'rgba(255,255,255,0.018)';
                ctx.fillRect(0, y, state.width, 2);
            }

            const floorGrad = ctx.createLinearGradient(0, floorY - 12, 0, state.height);
            floorGrad.addColorStop(0, 'rgba(24, 43, 65, 0.24)');
            floorGrad.addColorStop(1, 'rgba(4, 8, 15, 0.7)');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, floorY - 10, state.width, state.height - floorY + 10);

            ctx.strokeStyle = 'rgba(45, 240, 191, 0.32)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(state.width, floorY);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 212, 82, 0.18)';
            ctx.lineWidth = 2;
            const keyWidth = 160;
            const keyX = state.width / 2 - keyWidth / 2;
            ctx.fillStyle = 'rgba(15, 31, 48, 0.46)';
            ctx.fillRect(keyX, floorY, keyWidth, 80);
            ctx.strokeRect(keyX, floorY, keyWidth, 80);

            ctx.beginPath();
            ctx.arc(state.width / 2, floorY + 100, 300, Math.PI, 0);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 212, 82, 0.06)';
            ctx.beginPath();
            ctx.arc(state.width / 2, floorY + 100, 300, Math.PI, 0);
            ctx.lineTo(state.width / 2 + 300, floorY + 100);
            ctx.lineTo(state.width / 2 - 300, floorY + 100);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            drawCourtBackground();

            ctx.save();
            if (state.shake > 0) {
                ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
            }

            if (state.phase === 'AIM' && state.dragCurr) {
                const start = state.dragStart;
                const curr = state.dragCurr;
                const dx = start.x - curr.x;
                const dy = start.y - curr.y;

                const len = Math.sqrt(dx * dx + dy * dy);
                const maxLen = CFG.maxDrag;
                const scale = (len > maxLen) ? maxLen / len : 1;

                const vx = dx * scale * CFG.dragScale;
                const vy = dy * scale * CFG.dragScale;

                ctx.beginPath();
                let simX = ball.x;
                let simY = ball.y;
                let simVy = vy;
                let simVx = vx;

                ctx.moveTo(simX, simY);
                for (let i = 0; i < 12; i++) {
                    simX += simVx;
                    simY += simVy;
                    simVy += CFG.gravity;
                    ctx.lineTo(simX, simY);
                }
                ctx.strokeStyle = 'rgba(255, 212, 82, 0.65)';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 8]);
                ctx.shadowColor = 'rgba(255, 212, 82, 0.28)';
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
            }

            drawHoop();
            drawBall();

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(p.life, 0);
                if (p.ring) {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * (1.6 - p.life), 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1.0;

            if (state.phase === 'AIM' && state.dragCurr) {
                ctx.strokeStyle = 'rgba(255,255,255,0.24)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(state.dragStart.x, state.dragStart.y, 25, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#ffd452';
                ctx.shadowColor = 'rgba(255, 212, 82, 0.2)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(state.dragStart.x, state.dragStart.y);
                ctx.lineTo(state.dragCurr.x, state.dragCurr.y);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();

            if (scoreFlash > 0) {
                ctx.fillStyle = `rgba(255, 212, 82, ${0.12 * scoreFlash})`;
                ctx.fillRect(0, 0, state.width, state.height);
            }
        }

        function drawHoop() {
            ctx.save();
            ctx.strokeStyle = 'rgba(146, 171, 192, 0.85)';
            ctx.lineWidth = 6;
            const wallX = (hoop.x > state.width / 2) ? state.width : 0;
            ctx.beginPath();
            ctx.moveTo(wallX, hoop.y - 20);
            ctx.lineTo(hoop.x, hoop.y - 20);
            ctx.stroke();

            const bbW = 12;
            const bbH = 70;
            const bbX = (hoop.x > state.width / 2) ? hoop.x + hoop.w / 2 : hoop.x - hoop.w / 2 - bbW;

            const boardGrad = ctx.createLinearGradient(bbX, hoop.y - 55, bbX + bbW, hoop.y + 15);
            boardGrad.addColorStop(0, '#f6fbff');
            boardGrad.addColorStop(1, '#d5e1eb');
            ctx.fillStyle = boardGrad;
            ctx.shadowColor = 'rgba(255,255,255,0.25)';
            ctx.shadowBlur = 8;
            ctx.fillRect(bbX, hoop.y - 55, bbW, bbH);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = CFG.colors.wildcatRed;
            ctx.lineWidth = 2;
            ctx.strokeRect(bbX, hoop.y - 55, bbW, bbH);
            ctx.strokeRect(bbX + 2, hoop.y - 35, bbW - 4, 25);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w / 2, hoop.y);
            ctx.lineTo(hoop.x + hoop.w / 2, hoop.y);
            ctx.lineTo(hoop.x + hoop.w / 3, hoop.y + 45);
            ctx.lineTo(hoop.x - hoop.w / 3, hoop.y + 45);
            ctx.fill();

            ctx.strokeStyle = 'rgba(230, 246, 255, 0.45)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w / 2, hoop.y); ctx.lineTo(hoop.x, hoop.y + 45);
            ctx.moveTo(hoop.x + hoop.w / 2, hoop.y); ctx.lineTo(hoop.x, hoop.y + 45);
            ctx.stroke();

            ctx.strokeStyle = CFG.colors.wildcatRed;
            ctx.shadowColor = 'rgba(255, 95, 103, 0.45)';
            ctx.shadowBlur = 14;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w / 2, hoop.y);
            ctx.lineTo(hoop.x + hoop.w / 2, hoop.y);
            ctx.stroke();
            ctx.restore();
        }

        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rot);

            const glow = ctx.createRadialGradient(-ball.r * 0.2, -ball.r * 0.35, 2, 0, 0, ball.r * 1.2);
            glow.addColorStop(0, '#9effea');
            glow.addColorStop(0.36, CFG.colors.ball);
            glow.addColorStop(1, CFG.colors.cobraDark);
            ctx.fillStyle = glow;
            ctx.shadowColor = 'rgba(45, 240, 191, 0.28)';
            ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#062317';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -ball.r); ctx.lineTo(0, ball.r);
            ctx.moveTo(-ball.r, 0); ctx.lineTo(ball.r, 0);
            ctx.moveTo(-ball.r * 0.7, -ball.r * 0.7);
            ctx.quadraticCurveTo(0, 0, ball.r * 0.7, ball.r * 0.7);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 212, 82, 0.95)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-ball.r * 0.66, -ball.r * 0.2);
            ctx.quadraticCurveTo(0, -ball.r * 0.95, ball.r * 0.66, -ball.r * 0.2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.beginPath();
            ctx.arc(-ball.r * 0.3, -ball.r * 0.3, ball.r * 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(5, 20, 15, 0.9)';
            ctx.beginPath();
            ctx.arc(-ball.r * 0.25, -ball.r * 0.14, ball.r * 0.07, 0, Math.PI * 2);
            ctx.arc(ball.r * 0.25, -ball.r * 0.14, ball.r * 0.07, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff6a76';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-ball.r * 0.12, ball.r * 0.18);
            ctx.lineTo(0, ball.r * 0.38);
            ctx.lineTo(ball.r * 0.12, ball.r * 0.18);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            if (state.mode === 'PLAY') {
                update();
            }
            draw();
            requestAnimationFrame(loop);
        }

        // --- Input Handling ---
        const handleStart = (x, y) => {
            if (state.phase !== 'AIM') return;
            state.dragStart = { x, y };
            state.dragCurr = { x, y };
        };

        const handleMove = (x, y) => {
            if (!state.dragStart) return;
            state.dragCurr = { x, y };
        };

        const handleEnd = () => {
            if (!state.dragStart || state.phase !== 'AIM') return;

            const dx = state.dragStart.x - state.dragCurr.x;
            const dy = state.dragStart.y - state.dragCurr.y;
            const len = Math.sqrt(dx * dx + dy * dy);

            if (len > 15) {
                const maxLen = CFG.maxDrag;
                const scale = (len > maxLen) ? maxLen / len : 1;

                ball.vx = dx * scale * CFG.dragScale;
                ball.vy = dy * scale * CFG.dragScale;

                state.phase = 'FLY';
                AudioSys.play('shoot', { cooldown: 90 });
                setReaction('Fang launched', 'neutral');
            }

            state.dragStart = null;
            state.dragCurr = null;
        };

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleStart(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            handleEnd();
        });

        canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', handleEnd);

        document.getElementById('start-btn').onclick = async () => {
            await AudioSys.unlock();
            AudioSys.play('start', { cooldown: 200 });
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            state.mode = 'PLAY';
            resetGame();
        };

        document.getElementById('restart-btn').onclick = async () => {
            await AudioSys.unlock();
            AudioSys.play('ui', { cooldown: 120 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            state.mode = 'PLAY';
            resetGame();
        };

        document.getElementById('menu-btn').onclick = async () => {
            await AudioSys.unlock();
            AudioSys.play('menu', { cooldown: 150 });
            AudioSys.pauseLoop();
            hideGif();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            state.mode = 'MENU';
            setReaction('Back to menu', 'neutral');
        };

        document.getElementById('mute-btn').onclick = async function () {
            await AudioSys.unlock();
            const m = AudioSys.toggleMute();
            this.innerText = m ? '🔇' : '🔊';
            this.style.borderColor = m ? '#ff5f67' : '#2df0bf';
        };

        draw();
    </script>
</body>
</html>
