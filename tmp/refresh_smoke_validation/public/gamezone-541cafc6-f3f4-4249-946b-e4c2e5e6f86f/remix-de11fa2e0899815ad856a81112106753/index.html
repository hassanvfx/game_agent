<style>
    :root {
        --bg-top: #0a1230;
        --bg-bottom: #22156b;
        --panel: rgba(9, 16, 45, 0.78);
        --panel-border: rgba(140, 228, 255, 0.45);
        --panel-shadow: rgba(2, 8, 28, 0.45);
        --text-main: #ecf8ff;
        --text-soft: #a6d1ff;
        --accent: #8cf3ff;
        --accent-2: #ff8ad8;
        --danger: #ff6d85;
        --success: #82ffd5;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, #1b4eb8 0%, rgba(27, 78, 184, 0) 28%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text-main);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    #game-container::before,
    #game-container::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    #game-container::before {
        background:
            radial-gradient(circle at 15% 18%, rgba(255,255,255,0.95) 0 1px, transparent 2px),
            radial-gradient(circle at 73% 24%, rgba(140,243,255,0.75) 0 1.5px, transparent 3px),
            radial-gradient(circle at 28% 66%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
            radial-gradient(circle at 83% 74%, rgba(255,138,216,0.7) 0 1.5px, transparent 3px),
            radial-gradient(circle at 52% 12%, rgba(255,255,255,0.8) 0 1px, transparent 2px);
        opacity: 0.95;
    }
    #game-container::after {
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0));
        mix-blend-mode: screen;
    }
    canvas {
        display: block;
        touch-action: none;
        width: 100%;
        height: 100%;
    }
    #ui-layer,
    button {
        touch-action: manipulation;
    }
    .clay-btn {
        position: relative;
        background: linear-gradient(180deg, rgba(11, 28, 73, 0.95), rgba(23, 58, 132, 0.92));
        box-shadow:
            0 10px 24px rgba(0, 0, 0, 0.24),
            inset 0 1px 0 rgba(255,255,255,0.24),
            0 0 0 1px rgba(140, 243, 255, 0.24);
        border-radius: 18px;
        border: 1px solid rgba(140, 243, 255, 0.35);
        color: var(--text-main);
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-shadow: 0 0 10px rgba(140, 243, 255, 0.3);
    }
    .clay-btn:active {
        transform: scale(0.96);
        filter: brightness(1.08);
        box-shadow:
            0 4px 10px rgba(0, 0, 0, 0.26),
            inset 0 0 18px rgba(140, 243, 255, 0.14);
    }
    .clay-panel {
        background: linear-gradient(180deg, rgba(10, 20, 56, 0.84), rgba(14, 29, 73, 0.72));
        box-shadow:
            0 18px 36px var(--panel-shadow),
            inset 0 1px 0 rgba(255,255,255,0.14),
            0 0 0 1px var(--panel-border);
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    .status-title {
        font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }
    .hud-card {
        max-width: min(84vw, 360px);
    }
    .mood-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        background: rgba(140, 243, 255, 0.14);
        border: 1px solid rgba(140, 243, 255, 0.22);
    }
    .ui-btn {
        min-width: 0;
    }
    #dressup-controls {
        padding-bottom: max(0.25rem, env(safe-area-inset-bottom));
    }
    #game-over-screen {
        background: rgba(4, 9, 28, 0.48);
    }
    .feedback-gif {
        width: min(36vw, 120px);
        max-height: 100px;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid rgba(140, 243, 255, 0.35);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
        background: rgba(10, 20, 56, 0.75);
        opacity: 0.92;
    }
    @media (max-width: 640px) {
        #ui-layer {
            padding-bottom: 1rem;
        }
        #hud {
            padding: 0.8rem;
        }
        .hud-card {
            max-width: calc(100vw - 1.6rem);
        }
        #dressup-controls {
            gap: 0.75rem;
            padding-inline: 0.8rem;
        }
        .ui-btn {
            flex: 1 1 0;
            padding: 0.95rem 0.85rem;
            font-size: 0.95rem;
            line-height: 1.15;
        }
        #game-over-screen .clay-panel {
            width: min(88vw, 340px);
            padding: 1.35rem;
        }
    }
</style>

<!-- Media Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm/sfx -> catalogs/audios.json selections -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_happy" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
<audio id="sfx_annoyed" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

<script>
// --- L0: System Invariants & Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const uiLayer = document.getElementById('ui-layer');
const gameOverScreen = document.getElementById('game-over-screen');
const moodText = document.getElementById('mood-text');
const dressupControls = document.getElementById('dressup-controls');
const happyGif = document.getElementById('happy-gif');
const failGif = document.getElementById('fail-gif');

let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER
let lastTime = 0;

// Config
window.gameConfigDefs = {};
window.gameConfig = {};
try {
    const cfg = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfigDefs = cfg;
    for (let k in cfg) window.gameConfig[k] = cfg[k].value;
} catch(e) { console.error("Config parse error", e); }

window.updateGameConfig = (key, val) => {
    if(window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
};

// Audio System
let audioCtx = null;
let audioUnlocked = false;
const bgm = document.getElementById('bgm_main');
const audioEls = {
    ui: document.getElementById('sfx_ui'),
    happy: document.getElementById('sfx_happy'),
    annoyed: document.getElementById('sfx_annoyed'),
    gameover: document.getElementById('sfx_gameover'),
    restart: document.getElementById('sfx_restart')
};
const sfxCooldowns = new Map();
let activeGifTimer = 0;

function initAudio() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
    }
}

function safePlayMedia(el, volume = 0.5, fromStart = true) {
    if (!el) return;
    try {
        el.volume = volume;
        if (fromStart) el.currentTime = 0;
        const playPromise = el.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    } catch (e) {}
}

function playSfx(name, volume = 0.5, cooldownMs = 90) {
    const now = performance.now();
    const lastPlayed = sfxCooldowns.get(name) || 0;
    if (now - lastPlayed < cooldownMs) return;
    sfxCooldowns.set(name, now);
    safePlayMedia(audioEls[name], volume, true);
}

function setBgmPlayback(shouldPlay) {
    try {
        bgm.volume = 0.26;
        if (shouldPlay) {
            safePlayMedia(bgm, 0.26, false);
        } else {
            bgm.pause();
        }
    } catch (e) {}
}

function unlockAudio() {
    if (!audioUnlocked) {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch?.(() => {});
        audioUnlocked = true;
    }
    setBgmPlayback(gameState === 'PLAYING');
}

function setGifState(target) {
    [happyGif, failGif].forEach((gif) => gif?.classList.add('hidden'));
    activeGifTimer = 0;
    if (target === 'happy') {
        happyGif?.classList.remove('hidden');
        activeGifTimer = 1.4;
    } else if (target === 'fail') {
        failGif?.classList.remove('hidden');
        activeGifTimer = 1.8;
    }
}

function vibrate(style = 'light') {
    try {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style }
        });
    } catch(e) {}
}

// --- Game Entities ---
const alien = {
    x: 0, y: 0, scale: 1,
    state: 'IDLE', // IDLE, HAPPY, ANNOYED, DIZZY
    stateTimer: 0,
    annoyCount: 0,
    hatIdx: 0,
    glassesIdx: 0,
    hats: ['none', 'flower', 'lei'],
    glasses: ['none', 'shades', '3d']
};

let particles = [];

// --- Core Logic ---
function setState(newState) {
    gameState = newState;
    if (gameState === 'PLAYING') {
        gameOverScreen.classList.add('hidden');
        dressupControls.classList.remove('hidden');
        setBgmPlayback(audioUnlocked);
        setGifState(null);
    } else if (gameState === 'GAMEOVER') {
        gameOverScreen.classList.remove('hidden');
        dressupControls.classList.add('hidden');
        setBgmPlayback(false);
        setGifState('fail');
        playSfx('gameover', 0.5, 400);
    }
}

function initGame() {
    alien.x = cw / 2;
    alien.y = ch / 2 + 50;
    alien.scale = Math.min(cw, ch) / 450;
    alien.state = 'IDLE';
    alien.stateTimer = 0;
    alien.annoyCount = 0;
    particles = [];
    setState('PLAYING');
}

function restartGame() {
    initGame();
}

function spawnParticles(x, y, type) {
    for(let i=0; i<8; i++) {
        particles.push({
            x: x + (Math.random()-0.5)*60,
            y: y + (Math.random()-0.5)*60,
            vx: (Math.random()-0.5)*150,
            vy: (Math.random()-1)*150,
            life: 1.0,
            type: type
        });
    }
}

// --- Input Routing ---
function handleGlobalInput(e) {
    unlockAudio();
    
    // Handle UI Buttons
    const btn = e.target.closest('.ui-btn');
    if (btn) {
        const action = btn.getAttribute('data-action');
        if (action === 'restart') {
            playSfx('restart', 0.45, 160);
            restartGame();
        } else if (action === 'hat' && gameState === 'PLAYING') {
            alien.hatIdx = (alien.hatIdx + 1) % alien.hats.length;
            playSfx('ui', 0.4, 120);
            vibrate('light');
        } else if (action === 'glasses' && gameState === 'PLAYING') {
            alien.glassesIdx = (alien.glassesIdx + 1) % alien.glasses.length;
            playSfx('ui', 0.4, 120);
            vibrate('light');
        }
        return;
    }

    if (gameState !== 'PLAYING') return;

    // Canvas Interaction
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    // Hitboxes (scaled)
    const headY = alien.y - 100 * alien.scale;
    const bellyY = alien.y + 40 * alien.scale;
    const hitRadius = 90 * alien.scale;

    const distHead = Math.hypot(px - alien.x, py - headY);
    const distBelly = Math.hypot(px - alien.x, py - bellyY);

    if (e.type === 'pointerdown') {
        if (distHead < hitRadius) {
            alien.state = 'ANNOYED';
            alien.stateTimer = 1.0;
            alien.annoyCount++;
            playSfx('annoyed', 0.46, 140);
            setGifState(alien.annoyCount >= 4 ? 'fail' : null);
            vibrate('heavy');
            spawnParticles(alien.x, headY, 'sweat');
            
            if (alien.annoyCount >= 5) {
                alien.state = 'DIZZY';
                setState('GAMEOVER');
            }
        } else if (distBelly < hitRadius) {
            alien.state = 'HAPPY';
            alien.stateTimer = 1.5;
            alien.annoyCount = Math.max(0, alien.annoyCount - 1);
            playSfx('happy', 0.42, 100);
            setGifState('happy');
            vibrate('light');
            spawnParticles(alien.x, bellyY, 'heart');
        }
    } else if (e.type === 'pointermove' && e.buttons > 0) {
        // Rubbing belly
        if (distBelly < hitRadius && Math.random() < 0.1) {
            alien.state = 'HAPPY';
            alien.stateTimer = 1.5;
            playSfx('happy', 0.3, 220);
            setGifState('happy');
            vibrate('light');
            spawnParticles(alien.x, bellyY, 'heart');
        }
    }
}

window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', handleGlobalInput, { passive: false });

// --- ResizeObserver ---
const ro = new ResizeObserver(entries => {
    for (let entry of entries) {
        const cr = entry.contentRect;
        cw = cr.width;
        ch = cr.height;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(gameLoop);
        } else {
            // Clamp
            if(isFinite(alien.x) && isFinite(alien.y)) {
                alien.x = Math.max(50, Math.min(cw - 50, alien.x));
                alien.y = Math.max(50, Math.min(ch - 50, alien.y));
                alien.scale = Math.min(cw, ch) / 450;
            } else {
                initGame();
            }
        }
    }
});

// --- Drawing ---
function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();
}

function drawAlien(dt) {
    ctx.save();
    ctx.translate(alien.x, alien.y);
    ctx.scale(alien.scale, alien.scale);

    const time = Date.now();
    const breath = alien.state === 'IDLE' ? Math.sin(time * 0.003) * 5 : 0;
    const shake = alien.state === 'ANNOYED' ? (Math.random() - 0.5) * 10 : 0;
    const dizzyRot = alien.state === 'DIZZY' ? Math.sin(time * 0.01) * 0.2 : 0;
    const antennaBob = Math.sin(time * 0.006) * 6;
    const tailSway = Math.sin(time * 0.004) * 0.18;

    ctx.translate(shake, breath);
    ctx.rotate(dizzyRot);

    const colorMain = window.gameConfig.alienColor;
    const colorBelly = window.gameConfig.bellyColor;
    const colorEar = window.gameConfig.earColor;

    // Shadow
    ctx.fillStyle = 'rgba(4, 10, 30, 0.22)';
    ctx.beginPath();
    ctx.ellipse(0, 164, 112, 28, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tail silhouette for stronger character read
    ctx.save();
    ctx.translate(-58, 70);
    ctx.rotate(-0.55 + tailSway);
    const tailGrad = ctx.createLinearGradient(0, -10, 0, 95);
    tailGrad.addColorStop(0, '#9defff');
    tailGrad.addColorStop(1, colorMain);
    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    ctx.moveTo(-10, 10);
    ctx.quadraticCurveTo(-44, 42, -12, 94);
    ctx.quadraticCurveTo(24, 54, 12, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 16, 8, 18, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Antennae
    ctx.strokeStyle = '#8cf3ff';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-32, -168);
    ctx.quadraticCurveTo(-42, -220 + antennaBob, -14, -244);
    ctx.moveTo(32, -168);
    ctx.quadraticCurveTo(42, -220 - antennaBob, 14, -244);
    ctx.stroke();
    ctx.fillStyle = '#ff8ad8';
    ctx.beginPath();
    ctx.arc(-14, -244, 11, 0, Math.PI * 2);
    ctx.arc(14, -244, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(-18, -248, 4, 0, Math.PI * 2);
    ctx.arc(10, -248, 4, 0, Math.PI * 2);
    ctx.fill();

    // Ears
    const earGrad = ctx.createLinearGradient(0, -180, 0, -70);
    earGrad.addColorStop(0, '#b5fbff');
    earGrad.addColorStop(1, colorMain);
    ctx.fillStyle = earGrad;
    ctx.beginPath();
    ctx.ellipse(-110, -130, 90, 40, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(110, -130, 90, 40, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = colorEar;
    ctx.beginPath();
    ctx.ellipse(-110, -130, 60, 25, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(110, -130, 60, 25, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const bodyGrad = ctx.createLinearGradient(0, -20, 0, 150);
    bodyGrad.addColorStop(0, '#aef4ff');
    bodyGrad.addColorStop(0.35, colorMain);
    bodyGrad.addColorStop(1, '#2954bf');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 60, 78, 98, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(0, 52, 64, 3.7, 5.2);
    ctx.stroke();

    // Belly
    const bellyGrad = ctx.createLinearGradient(0, 15, 0, 130);
    bellyGrad.addColorStop(0, '#f1ffff');
    bellyGrad.addColorStop(1, colorBelly);
    ctx.fillStyle = bellyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 72, 48, 64, 0, 0, Math.PI * 2);
    ctx.fill();

    // Arms
    ctx.strokeStyle = colorMain;
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(-52, 30);
    ctx.quadraticCurveTo(-120, 48, -118, 105);
    ctx.moveTo(52, 30);
    ctx.quadraticCurveTo(120, 48, 118, 105);
    ctx.stroke();
    ctx.fillStyle = '#8cf3ff';
    ctx.beginPath();
    ctx.arc(-118, 106, 10, 0, Math.PI * 2);
    ctx.arc(118, 106, 10, 0, Math.PI * 2);
    ctx.fill();

    // Head
    const headGrad = ctx.createLinearGradient(0, -200, 0, 0);
    headGrad.addColorStop(0, '#d8ffff');
    headGrad.addColorStop(0.25, '#90e8ff');
    headGrad.addColorStop(1, colorMain);
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(0, -100, 106, 94, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.34)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(-10, -118, 78, 3.95, 5.35);
    ctx.stroke();

    // Cheeks
    if (alien.state === 'HAPPY' || alien.state === 'IDLE') {
        ctx.fillStyle = 'rgba(255, 138, 216, 0.22)';
        ctx.beginPath();
        ctx.ellipse(-70, -62, 18, 10, 0, 0, Math.PI * 2);
        ctx.ellipse(70, -62, 18, 10, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-45, -110, 35, 45, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(45, -110, 35, 45, 0.2, 0, Math.PI * 2);
    ctx.fill();

        ctx.fillStyle = '#000';
        if (alien.state === 'HAPPY') {
            ctx.strokeStyle = '#0f173d';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(-45, -100, 20, Math.PI, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(45, -100, 20, Math.PI, 0);
            ctx.stroke();
        } else if (alien.state === 'DIZZY') {
            ctx.font = "bold 40px 'Rajdhani'";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('X', -45, -110);
            ctx.fillText('X', 45, -110);
    } else {
        const pupilOffsetX = alien.state === 'ANNOYED' ? 4 : 0;
        const pupilOffsetY = alien.state === 'ANNOYED' ? 2 : 0;
        ctx.beginPath();
        ctx.ellipse(-45 + pupilOffsetX, -110 + pupilOffsetY, 15, 20, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(45 + pupilOffsetX, -110 + pupilOffsetY, 15, 20, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-50 + pupilOffsetX, -120 + pupilOffsetY, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(40 + pupilOffsetX, -120 + pupilOffsetY, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    // Brows for annoyed readability
    if (alien.state === 'ANNOYED') {
        ctx.strokeStyle = '#1f1945';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-72, -150);
        ctx.lineTo(-24, -136);
        ctx.moveTo(24, -136);
        ctx.lineTo(72, -150);
        ctx.stroke();
    }

    // Nose
    ctx.fillStyle = '#16203f';
    ctx.beginPath();
    ctx.ellipse(0, -60, 25, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6c82c8';
    ctx.beginPath();
    ctx.arc(-8, -65, 5, 0, Math.PI * 2);
    ctx.fill();

    // Mouth
    ctx.strokeStyle = '#09112d';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (alien.state === 'HAPPY') {
        ctx.arc(0, -40, 25, 0.2, Math.PI - 0.2);
    } else if (alien.state === 'ANNOYED') {
        ctx.moveTo(-20, -50);
        ctx.lineTo(20, -50);
    } else {
        ctx.arc(0, -50, 15, 0.5, Math.PI - 0.5);
    }
    ctx.stroke();

    // Feet
    ctx.fillStyle = '#70d8ff';
    ctx.beginPath();
    ctx.ellipse(-34, 146, 24, 12, -0.15, 0, Math.PI * 2);
    ctx.ellipse(34, 146, 24, 12, 0.15, 0, Math.PI * 2);
    ctx.fill();

    // Dressup: Glasses
    const gType = alien.glasses[alien.glassesIdx];
    if (gType === 'shades') {
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.ellipse(-45, -110, 40, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(45, -110, 40, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(-25, -115, 50, 15);
        ctx.strokeStyle = 'rgba(140,243,255,0.3)';
        ctx.lineWidth = 3;
        ctx.strokeRect(-83, -130, 76, 40);
        ctx.strokeRect(7, -130, 76, 40);
    } else if (gType === '3d') {
        ctx.fillStyle = '#E53E3E';
        ctx.beginPath();
        ctx.ellipse(-45, -110, 35, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4299E1';
        ctx.beginPath();
        ctx.ellipse(45, -110, 35, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-10, -110);
        ctx.lineTo(10, -110);
        ctx.stroke();
    }

    // Dressup: Hat/Accessories
    const hType = alien.hats[alien.hatIdx];
    if (hType === 'flower') {
        ctx.save();
        ctx.translate(90, -140);
        ctx.rotate(0.5);
        ctx.fillStyle = '#E53E3E';
        for (let i = 0; i < 5; i++) {
            ctx.rotate(Math.PI * 2 / 5);
            ctx.beginPath();
            ctx.ellipse(0, 20, 15, 30, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = '#F6E05E';
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    } else if (hType === 'lei') {
        ctx.strokeStyle = '#F6E05E';
        ctx.lineWidth = 15;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 20, 60, 0.2, Math.PI - 0.2);
        ctx.stroke();
        ctx.fillStyle = '#E53E3E';
        ctx.beginPath();
        ctx.arc(-40, 40, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(40, 40, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 70, 8, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        
        if (p.type === 'heart') {
            ctx.fillStyle = '#E53E3E';
            ctx.beginPath();
            ctx.moveTo(0, 5);
            ctx.bezierCurveTo(-10, -5, -20, 5, 0, 20);
            ctx.bezierCurveTo(20, 5, 10, -5, 0, 5);
            ctx.fill();
        } else if (p.type === 'sweat') {
            ctx.fillStyle = '#63B3ED';
            ctx.beginPath();
            ctx.arc(0, 5, 6, 0, Math.PI);
            ctx.lineTo(0, -12);
            ctx.fill();
        }
        ctx.restore();
    }
}

// --- Main Loop ---
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;

    try {
        // Clear & Background
        const skyGrad = ctx.createLinearGradient(0, 0, 0, ch);
        skyGrad.addColorStop(0, '#08122f');
        skyGrad.addColorStop(0.55, '#172c74');
        skyGrad.addColorStop(1, '#2a1c79');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, cw, ch);

        const nebula = ctx.createRadialGradient(cw * 0.5, ch * 0.35, 0, cw * 0.5, ch * 0.35, Math.max(cw, ch) * 0.7);
        nebula.addColorStop(0, 'rgba(255,255,255,0.22)');
        nebula.addColorStop(0.3, 'rgba(140,243,255,0.14)');
        nebula.addColorStop(0.75, 'rgba(255,138,216,0.1)');
        nebula.addColorStop(1, 'rgba(255,138,216,0)');
        ctx.fillStyle = nebula;
        ctx.fillRect(0, 0, cw, ch);

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        [
            [cw * 0.15, ch * 0.12, 1.4],
            [cw * 0.28, ch * 0.22, 1.9],
            [cw * 0.47, ch * 0.08, 1.2],
            [cw * 0.68, ch * 0.16, 1.6],
            [cw * 0.84, ch * 0.1, 1.3],
            [cw * 0.76, ch * 0.28, 1.8]
        ].forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        });

        const floorGrad = ctx.createLinearGradient(0, ch * 0.72, 0, ch);
        floorGrad.addColorStop(0, 'rgba(111, 229, 255, 0)');
        floorGrad.addColorStop(1, 'rgba(111, 229, 255, 0.22)');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, ch * 0.72, cw, ch * 0.28);

        // Logic update
        if (gameState === 'PLAYING') {
            if (alien.stateTimer > 0) {
                alien.stateTimer -= dt;
                if (alien.stateTimer <= 0) alien.state = 'IDLE';
            }
            moodText.innerText = alien.state === 'IDLE' ? 'Calm' : (alien.state === 'HAPPY' ? 'Happy!' : 'Annoyed');
            moodText.style.color = alien.state === 'ANNOYED' ? '#E53E3E' : '#2B6CB0';
            
            // Red flash if annoyed
            if (alien.state === 'ANNOYED' && alien.stateTimer > 0.8) {
                ctx.fillStyle = `rgba(255, 0, 0, ${ (alien.stateTimer - 0.8)*2 })`;
                ctx.fillRect(0, 0, cw, ch);
            }
        }

        if (activeGifTimer > 0) {
            activeGifTimer -= dt;
            if (activeGifTimer <= 0) setGifState(null);
        }

        drawAlien(dt);
        drawParticles(dt);

    } catch (e) {
        console.error("Loop error", e);
    }

    requestAnimationFrame(gameLoop);
}

// --- Init ---
document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        setBgmPlayback(false);
    } else if (audioUnlocked && gameState === 'PLAYING') {
        setBgmPlayback(true);
    }
});

</script>
