<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.isMuted = false;
        this.unlocked = false;
        this.sfxCooldowns = new Map();

        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                window.removeEventListener('pointerdown', unlock);
                window.removeEventListener('keydown', unlock);
            }).catch(() => {});
        };
        window.addEventListener('pointerdown', unlock);
        window.addEventListener('keydown', unlock);
    }

    getAudio(id) {
        return document.getElementById(id);
    }

    playClip(id, volume = 0.5, cooldownMs = 0) {
        if (!this.unlocked) return;
        const now = performance.now();
        const last = this.sfxCooldowns.get(id) || 0;
        if (cooldownMs && now - last < cooldownMs) return;
        this.sfxCooldowns.set(id, now);

        const audio = this.getAudio(id);
        if (!audio || !audio.src) return;
        try {
            audio.pause();
            audio.currentTime = 0;
            audio.volume = volume;
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (_) {}
    }

    playBgm() {
        if (!this.unlocked) return;
        const bgmEl = this.getAudio('bgm_main');
        if (bgmEl && bgmEl.src) {
            try {
                bgmEl.loop = true;
                bgmEl.volume = 0.2;
                const playPromise = bgmEl.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
                return;
            } catch (_) {}
        }
        this.playDrone();
    }

    stopBgm() {
        const bgmEl = this.getAudio('bgm_main');
        if (bgmEl) {
            try {
                bgmEl.pause();
                bgmEl.currentTime = 0;
            } catch (_) {}
        }
    }

    playDrone() {
        if (!this.unlocked) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 50;
        gain.gain.value = 0.02;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
    }

    playStart() {
        this.playClip('sfx_start', 0.55, 180);
    }

    playShoot() {
        this.playClip('sfx_shoot', 0.18, 70);
    }

    playEnemyDefeat() {
        this.playClip('sfx_enemy_defeat', 0.35, 90);
    }

    playGameOver() {
        this.playClip('sfx_game_over', 0.5, 250);
    }

    playWarning() {
        this.playClip('sfx_warning', 0.32, 500);
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const gameContainer = document.getElementById('game-container');
const startButton = document.getElementById('start-btn');
const restartButton = document.getElementById('restart-btn');
const ctx = canvas.getContext('2d', { alpha: false });
const audioManager = new AudioManager();

// Config
let gameConfig = {
    heroSpeed: 280,
    zombieSpeed: 140,
    fireRate: 150
};

// State
let gameState = 'START'; // START, PLAYING, GAMEOVER
let lastTime = 0;
let score = 0;
let gameTime = 0;

// Entities
const player = { x: 0, y: 0, radius: 12, angle: 0, cooldown: 0 };
let zombies = [];
let bullets = [];
let particles = [];
let shake = 0;
let warningArmed = false;
let hitGifTimer = 0;
let gameOverGifTimer = 0;

// Input
const input = {
    active: false,
    originX: 0,
    originY: 0,
    currentX: 0,
    currentY: 0,
    vectorX: 0,
    vectorY: 0
};

// Resize
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
document.addEventListener('DOMContentLoaded', () => {
    resize();
    initGame();
    requestAnimationFrame(loop);
    
    // Config parsing
    if (window.gameConfigDefs) {
        // Editor hook would go here
    }
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const parsed = JSON.parse(configEl.textContent);
            gameConfig.heroSpeed = parsed.heroSpeed.value;
            gameConfig.zombieSpeed = parsed.zombieSpeed.value;
            gameConfig.fireRate = parsed.fireRate.value;
        } catch(e) {}
    }
});

// Input Handling
function handlePointerDown(e) {
    if (gameState !== 'PLAYING') return;

    if (e.pointerType === 'touch') {
        e.preventDefault();
    }

    // Virtual Joystick Logic
    input.active = true;
    input.originX = e.clientX;
    input.originY = e.clientY;
    input.currentX = e.clientX;
    input.currentY = e.clientY;
    input.vectorX = 0;
    input.vectorY = 0;
}

function handlePointerMove(e) {
    if (!input.active || gameState !== 'PLAYING') return;

    if (e.pointerType === 'touch') {
        e.preventDefault();
    }

    input.currentX = e.clientX;
    input.currentY = e.clientY;
    
    const dx = input.currentX - input.originX;
    const dy = input.currentY - input.originY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 50; // Joystick radius
    
    if (dist > 0) {
        const clampedDist = Math.min(dist, maxDist);
        input.vectorX = (dx / dist) * (clampedDist / maxDist);
        input.vectorY = (dy / dist) * (clampedDist / maxDist);
    } else {
        input.vectorX = 0;
        input.vectorY = 0;
    }
}

function handlePointerUp(e) {
    if (e.pointerType === 'touch') {
        e.preventDefault();
    }

    input.active = false;
    input.vectorX = 0;
    input.vectorY = 0;
}

gameContainer.addEventListener('pointerdown', handlePointerDown, { passive: false });
window.addEventListener('pointermove', handlePointerMove, { passive: false });
window.addEventListener('pointerup', handlePointerUp, { passive: false });
window.addEventListener('pointercancel', handlePointerUp, { passive: false });
startButton.addEventListener('click', startGame);
restartButton.addEventListener('click', startGame);
// Keyboard support for desktop
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'START' || gameState === 'GAMEOVER') startGame();
});
window.addEventListener('keyup', e => keys[e.code] = false);

function initGame() {
    player.x = window.innerWidth / 2;
    player.y = window.innerHeight / 2;
    zombies = [];
    bullets = [];
    particles = [];
    score = 0;
    gameTime = 0;
    shake = 0;
    warningArmed = false;
    hitGifTimer = 0;
    gameOverGifTimer = 0;
    setFeedbackGif('hit-gif', false);
    setFeedbackGif('gameover-gif', false);
}

function startGame() {
    if (gameState === 'PLAYING') return;

    gameState = 'PLAYING';
    initGame();

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('score').innerText = '0';

    audioManager.playStart();
    audioManager.playBgm();
}

function gameOver() {
    gameState = 'GAMEOVER';
    shake = 20;
    gameOverGifTimer = 2.2;
    setFeedbackGif('gameover-gif', true);
    audioManager.stopBgm();
    audioManager.playWarning();
    audioManager.playGameOver();
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('finalScore').innerText = score;
}

// Logic
function update(dt) {
    if (hitGifTimer > 0) {
        hitGifTimer -= dt;
        if (hitGifTimer <= 0) setFeedbackGif('hit-gif', false);
    }
    if (gameOverGifTimer > 0) {
        gameOverGifTimer -= dt;
        if (gameOverGifTimer <= 0 && gameState !== 'GAMEOVER') setFeedbackGif('gameover-gif', false);
    }

    // Shake decay
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    if (gameState !== 'PLAYING') return;

    gameTime += dt;

    // Player Move
    let vx = input.vectorX;
    let vy = input.vectorY;
    
    // Keyboard override
    if (keys['ArrowUp'] || keys['KeyW']) vy = -1;
    if (keys['ArrowDown'] || keys['KeyS']) vy = 1;
    if (keys['ArrowLeft'] || keys['KeyA']) vx = -1;
    if (keys['ArrowRight'] || keys['KeyD']) vx = 1;
    
    // Normalize keyboard
    if (vx !== 0 || vy !== 0) {
        const len = Math.sqrt(vx*vx + vy*vy);
        if (len > 1) { vx /= len; vy /= len; } // Clamp length to 1
    }

    player.x += vx * gameConfig.heroSpeed * dt;
    player.y += vy * gameConfig.heroSpeed * dt;
    
    // Bounds
    player.x = Math.max(15, Math.min(window.innerWidth - 15, player.x));
    player.y = Math.max(15, Math.min(window.innerHeight - 15, player.y));

    // Auto Aim & Shoot
    let nearestDist = Infinity;
    let target = null;
    
    zombies.forEach(z => {
        const dx = z.x - player.x;
        const dy = z.y - player.y;
        const d = dx*dx + dy*dy;
        if (d < nearestDist) {
            nearestDist = d;
            target = z;
        }
    });

    if (target) {
        player.angle = Math.atan2(target.y - player.y, target.x - player.x);
        
        // Shoot
        if (player.cooldown <= 0) {
            shoot(player.angle);
            player.cooldown = gameConfig.fireRate / 1000;
        }
    } else if (vx !== 0 || vy !== 0) {
        // Face movement dir if no target
        player.angle = Math.atan2(vy, vx);
    }
    
    if (player.cooldown > 0) player.cooldown -= dt;

    const nearestDistancePx = Number.isFinite(nearestDist) ? Math.sqrt(nearestDist) : Infinity;
    if (nearestDistancePx < 160 && !warningArmed) {
        warningArmed = true;
        audioManager.playWarning();
    } else if (nearestDistancePx > 220) {
        warningArmed = false;
    }

    // Spawn Zombies
    // Difficulty curve: start slow, ramp up
    const spawnRate = Math.max(0.3, 1.5 - gameTime / 60); 
    if (Math.random() < dt / spawnRate) {
        spawnZombie();
    }

    // Update Zombies
    zombies.forEach(z => {
        const dx = player.x - z.x;
        const dy = player.y - z.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            z.x += (dx / dist) * gameConfig.zombieSpeed * dt;
            z.y += (dy / dist) * gameConfig.zombieSpeed * dt;
        }
        
        // Collision Player
        if (dist < player.radius + z.radius) {
            gameOver();
        }
    });

    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += Math.cos(b.angle) * 800 * dt;
        b.y += Math.sin(b.angle) * 800 * dt;
        b.life -= dt;
        
        // OOB or Dead
        if (b.life <= 0) {
            bullets.splice(i, 1);
            continue;
        }
        
        // Collision Zombie
        let hit = false;
        for (let j = zombies.length - 1; j >= 0; j--) {
            const z = zombies[j];
            const dx = b.x - z.x;
            const dy = b.y - z.y;
            if (dx*dx + dy*dy < (z.radius + 5) * (z.radius + 5)) {
                // Kill
                createExplosion(z.x, z.y, '#39ff14');
                zombies.splice(j, 1);
                hit = true;
                score += 10;
                document.getElementById('score').innerText = score;
                shake = 5;
                hitGifTimer = 0.65;
                setFeedbackGif('hit-gif', true);
                audioManager.playEnemyDefeat();
                break;
            }
        }
        if (hit) bullets.splice(i, 1);
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function shoot(angle) {
    bullets.push({
        x: player.x + Math.cos(angle) * 20,
        y: player.y + Math.sin(angle) * 20,
        angle: angle,
        life: 1.5
    });
    audioManager.playShoot();
    shake = 2;
    
    // Muzzle flash particle
    particles.push({
        x: player.x + Math.cos(angle) * 25,
        y: player.y + Math.sin(angle) * 25,
        vx: Math.cos(angle) * 100,
        vy: Math.sin(angle) * 100,
        life: 0.1,
        color: '#fff',
        size: 5
    });
}

function setFeedbackGif(id, visible) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('hidden', !visible);
}

function spawnZombie() {
    // Spawn at edge
    let x, y;
    if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -20 : window.innerWidth + 20;
        y = Math.random() * window.innerHeight;
    } else {
        x = Math.random() * window.innerWidth;
        y = Math.random() < 0.5 ? -20 : window.innerHeight + 20;
    }
    
    zombies.push({
        x: x,
        y: y,
        radius: 15,
        hp: 1
    });
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 100 + Math.random() * 200;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.3 + Math.random() * 0.3,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

// Render
function draw() {
    // Clear
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Camera Shake
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // Grid Background
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    const gridSize = 50;
    const offsetX = Math.floor(player.x / gridSize) * gridSize; // Parallax illusion? No, static grid better for orientation
    
    ctx.beginPath();
    for (let x = 0; x <= window.innerWidth; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, window.innerHeight);
    }
    for (let y = 0; y <= window.innerHeight; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(window.innerWidth, y);
    }
    ctx.stroke();

    // Joystick (UI Layer but drawn on canvas for performance)
    if (input.active) {
        ctx.beginPath();
        ctx.arc(input.originX, input.originY, 50, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(input.currentX, input.currentY, 20, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
        ctx.fill();
    }

    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life * 3; // Fade out
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    // Draw Bullets
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff0055';
    ctx.fillStyle = '#ff0055';
    bullets.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);
        ctx.fillRect(-10, -2, 20, 4); // Long streak
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // Draw Zombies
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#39ff14';
    ctx.fillStyle = '#39ff14'; // Neon Green
    zombies.forEach(z => {
        ctx.beginPath();
        ctx.rect(z.x - 12, z.y - 12, 24, 24);
        ctx.fill();
        // Glitch effect
        if (Math.random() < 0.1) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(z.x - 10, z.y - 2, 20, 4);
            ctx.fillStyle = '#39ff14';
        }
    });

    // Draw Player
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00f0ff';
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    
    // Body
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();
    
    // Gun
    ctx.fillStyle = '#fff';
    ctx.fillRect(10, -4, 15, 8);
    
    ctx.restore();
    ctx.shadowBlur = 0;

    ctx.restore(); // End Shake
    
    // Vignette
    const grad = ctx.createRadialGradient(window.innerWidth/2, window.innerHeight/2, window.innerHeight/3, window.innerWidth/2, window.innerHeight/2, window.innerHeight);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// Loop
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

// Start animation on load (Attract Mode)
function attractMode() {
    if (gameState === 'START') {
        const t = Date.now() / 1000;
        // Move dummy player
        player.x = window.innerWidth/2 + Math.cos(t) * 100;
        player.y = window.innerHeight/2 + Math.sin(t*1.5) * 50;
        player.angle = t;
        
        // Spawn effects
        if (Math.random() < 0.05) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: 0, vy: -50, life: 2, color: '#112233', size: 2
            });
        }
    }
}
setInterval(attractMode, 16);

</script>
