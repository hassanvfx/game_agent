<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Alex's Meme Airlift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap');
        
        :root {
            --bg-deep: #050816;
            --bg-mid: #0e1533;
            --panel-fill: rgba(9, 16, 34, 0.88);
            --panel-line: #67f7ff;
            --panel-shadow: rgba(0, 0, 0, 0.55);
            --hero-accent: #ffe45c;
            --hero-hot: #ff6bb8;
            --hero-cool: #6cf3ff;
            --text-main: #f4fbff;
            --text-soft: #a8c7de;
            --danger: #ff556d;
            --success: #4dff8c;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: manipulation; 
            background:
                radial-gradient(circle at top, rgba(108, 243, 255, 0.18), transparent 34%),
                radial-gradient(circle at 20% 85%, rgba(255, 107, 184, 0.16), transparent 30%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 62%, #03040b 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%),
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.025) 0px,
                    rgba(255,255,255,0.025) 2px,
                    transparent 2px,
                    transparent 6px
                );
            opacity: 0.65;
            mix-blend-mode: screen;
        }
        
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            image-rendering: pixelated; 
        }

        /* UI Styles */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(20, 33, 63, 0.96), rgba(7, 13, 28, 0.94));
            border: 3px solid var(--panel-line);
            box-shadow:
                0 0 0 3px rgba(255, 228, 92, 0.22),
                0 16px 30px var(--panel-shadow),
                inset 0 0 18px rgba(108, 243, 255, 0.12);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.14), transparent 32%),
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 45%);
        }

        .pixel-btn {
            background: linear-gradient(180deg, rgba(38, 54, 96, 0.96), rgba(22, 30, 58, 0.98));
            border: 2px solid #ffffff;
            box-shadow:
                0 0 0 2px rgba(103, 247, 255, 0.35),
                4px 4px 0px #000;
            transition: transform 0.05s, background-color 0.1s, box-shadow 0.18s, filter 0.18s;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            letter-spacing: 0.05em;
            position: relative;
            text-align: center;
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.7);
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
        .pixel-btn.selected {
            background-color: #fbbf24; /* Amber-400 */
            color: #000;
            border-color: #000;
        }

        .pixel-btn:hover {
            filter: brightness(1.08);
            box-shadow:
                0 0 0 2px rgba(255, 228, 92, 0.5),
                0 0 20px rgba(108, 243, 255, 0.28),
                4px 4px 0px #000;
        }

        .mc-text {
            text-shadow: 0 2px 0 #000, 0 0 10px rgba(103, 247, 255, 0.22);
        }

        .pixel-font { font-family: 'Press Start 2P', cursive; }
        .hero-font { font-family: 'Orbitron', 'Audiowide', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
        .ui-font { font-family: 'Rajdhani', system-ui, sans-serif; }
        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            bottom: max(6.5rem, env(safe-area-inset-bottom) + 5rem);
            width: min(28vw, 140px);
            border: 2px solid rgba(103, 247, 255, 0.9);
            border-radius: 14px;
            background: rgba(4, 10, 20, 0.85);
            box-shadow: 0 10px 24px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            overflow: hidden;
        }
        .feedback-gif.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .feedback-gif img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .feedback-gif-label {
            padding: 0.35rem 0.5rem 0.45rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            line-height: 1.3;
            color: var(--hero-accent);
            text-align: center;
            letter-spacing: 0.04em;
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .bottom-24 { bottom: 6rem; }
        .w-full { width: 100%; }
        .h-full { height: 100vh; }
        .max-w-sm { max-width: 24rem; }
        .max-w-md { max-width: 28rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-1 { padding-bottom: 0.25rem; }
        .pb-4 { padding-bottom: 1rem; }
        .rounded, .rounded-none { border-radius: 0; }
        .text-center { text-align: center; }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-yellow-400 { color: #facc15; }
        .text-yellow-200 { color: #fde68a; }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .text-red-500 { color: #ef4444; }
        .text-blue-300 { color: #93c5fd; }
        .text-green-400 { color: #4ade80; }
        .text-green-100 { color: #dcfce7; }
        .text-red-900 { color: #7f1d1d; }
        .text-red-800 { color: #991b1b; }
        .text-cyan-400 { color: #22d3ee; }
        .text-pink-500 { color: #ec4899; }
        .text-green-400 { color: #4ade80; }
        .text-amber-900 { color: #78350f; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-5xl { font-size: 3rem; }
        .text-6xl { font-size: 3.75rem; }
        .text-xl { font-size: 1.25rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xs { font-size: 0.75rem; }
        .leading-none { line-height: 1; }
        .font-bold { font-weight: 700; }
        .border-b { border-bottom: 1px solid; }
        .border-gray-600 { border-color: #4b5563; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .select-none { user-select: none; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .flex { display: flex; }
        .grid { display: grid; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1 1 0%; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .space-y-6 > * + * { margin-top: 1.5rem; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .drop-shadow-md { filter: drop-shadow(0 4px 3px rgba(0,0,0,0.35)); }
        .animate-pulse { animation: pulse 1.2s ease-in-out infinite; }
        .bg-black\/50 { background: rgba(0,0,0,0.5); }
        .bg-green-600 { background-color: #16a34a; }
        .bg-green-500 { background-color: #22c55e; }
        .bg-purple-600 { background-color: #9333ea; }
        .bg-purple-500 { background-color: #a855f7; }
        .bg-red-600 { background-color: #dc2626; }
        .bg-gray-600 { background-color: #4b5563; }
        .bg-black { background-color: #000; }
        .bg-orange-200 { background-color: #fed7aa; }
        .bg-white { background-color: #fff; }
        .bg-green-800 { background-color: #166534; }
        .bg-red-800 { background-color: #991b1b; }
        .bg-blue-600 { background-color: #2563eb; }
        .bg-green-700 { background-color: #15803d; }
        .bg-slate-700 { background-color: #334155; }
        .bg-amber-700 { background-color: #b45309; }
        .bg-indigo-900 { background-color: #312e81; }
        .bg-pink-600 { background-color: #db2777; }
        .bg-gray-800 { background-color: #1f2937; }
        .bg-zinc-400 { background-color: #a1a1aa; }
        .bg-lime-900 { background-color: #365314; }
        .bg-pink-400 { background-color: #f472b6; }
        .border-blue-700 { border-color: #1d4ed8; }
        .border-orange-400 { border-color: #fb923c; }
        .border-gray-400 { border-color: #9ca3af; }
        .border-yellow-600 { border-color: #ca8a04; }
        .border-yellow-500 { border-color: #eab308; }
        .border-red-500 { border-color: #ef4444; }
        .h-\[90vh\] { height: 90vh; }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 16% 14%, rgba(255, 228, 92, 0.18), transparent 15%),
                radial-gradient(circle at 82% 20%, rgba(108, 243, 255, 0.14), transparent 18%),
                radial-gradient(circle at 74% 80%, rgba(255, 107, 184, 0.16), transparent 18%);
            z-index: 0;
        }

        #main-menu,
        #customize-screen,
        #game-over-screen,
        #hud,
        #cutscene-ui {
            position: relative;
        }

        #main-menu {
            border-radius: 18px;
        }

        #main-menu h1,
        #game-over-screen h2 {
            color: var(--hero-accent);
            -webkit-text-stroke: 1px rgba(255,255,255,0.08);
        }

        #hud {
            padding: 0.5rem 0.9rem;
            border: 2px solid rgba(103, 247, 255, 0.9);
            border-radius: 999px;
            background: rgba(3, 10, 20, 0.72);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 0 12px rgba(108,243,255,0.15);
        }

        #cutscene-ui span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.9);
            border-radius: 999px;
            box-shadow: 0 0 16px rgba(108,243,255,0.2);
            background: rgba(2, 7, 16, 0.72);
        }

        .landmark-btn,
        .style-btn {
            min-height: 4rem;
        }

        .landmark-btn.selected,
        .style-btn.selected {
            background: linear-gradient(180deg, #ffe45c, #ffb703);
            color: #06101f;
            border-color: #ffffff;
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.4),
                0 0 18px rgba(255, 228, 92, 0.35),
                4px 4px 0px #000;
            text-shadow: none;
        }

        @media (max-width: 640px) {
            #main-menu,
            #game-over-screen {
                padding: 1.1rem;
            }

            #main-menu h1 {
                font-size: 2.35rem;
            }

            #customize-screen {
                max-width: calc(100vw - 1rem);
            }

            .pixel-btn {
                font-size: 1rem;
            }

            #hud {
                font-size: 1.9rem;
                top: max(0.75rem, env(safe-area-inset-top));
                left: 0.75rem;
            }

            .feedback-gif {
                width: min(33vw, 118px);
                right: 0.6rem;
                bottom: max(6rem, env(safe-area-inset-bottom) + 4.5rem);
            }

            .feedback-gif-label {
                font-size: 0.52rem;
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* CSS Filters for Styles */
        .style-1930s canvas { filter: sepia(0.8) grayscale(0.2) contrast(1.1) brightness(0.9); }
        .style-neon canvas { filter: contrast(1.2) saturate(1.3); }
        .style-gothic canvas { filter: contrast(1.2) brightness(0.8) grayscale(0.4); }
        .style-robots canvas { filter: contrast(1.3) grayscale(0.3) brightness(0.9) drop-shadow(0 0 2px rgba(0,255,255,0.3)); }
        .style-police canvas { filter: contrast(1.4) saturate(0.8) hue-rotate(-10deg) brightness(0.9); }
        .style-cookie canvas { filter: sepia(0.3) contrast(1.1) saturate(1.2) brightness(0.95); }
        .style-lego canvas { filter: contrast(1.2) saturate(1.5); }
        .style-cinema canvas { filter: grayscale(1) contrast(1.3) brightness(0.9); }
        .style-aliens canvas { filter: hue-rotate(40deg) contrast(1.2) saturate(1.4); }
        .style-cardboard canvas { filter: sepia(0.4) contrast(0.95) brightness(1.05); }
        .style-valentine canvas { filter: contrast(1.1) saturate(1.2) hue-rotate(-10deg); }
        .style-tiktok canvas { filter: contrast(1.15) brightness(1.05) saturate(1.1); }
        .style-animals canvas { filter: saturate(1.4) contrast(1.05) sepia(0.1); }
        .style-puppets canvas { filter: contrast(0.9) brightness(1.1) sepia(0.2); }
        .style-nintendo canvas { filter: contrast(1.3) saturate(1.5); }
        .style-doodle canvas { filter: grayscale(1) contrast(1.2) brightness(1.05); }
        .style-superbowl canvas { filter: saturate(1.4) contrast(1.1) brightness(1.05); }
        
        /* New Styles Filters */
        .style-pacman canvas { filter: contrast(1.3) saturate(1.2); }
        .style-oilpaint canvas { filter: contrast(1.1) saturate(1.3) blur(0.5px); }

    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full select-none overflow-hidden">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none z-10">
            
            <!-- Main Menu -->
            <div id="main-menu" class="glass-panel p-6 rounded-none text-center pointer-events-auto max-w-sm w-full mx-4 flex flex-col gap-4">
                <div>
                    <h1 class="hero-font text-6xl text-yellow-400 leading-none mc-text mb-1">ALEX'S<br>MEME AIRLIFT</h1>
                    <p class="text-gray-300 text-lg mc-text">Pilot the emoji ace through chaos clouds, snag sparkle gems, and dodge sky spam.</p>
                </div>
                
                <button id="btn-fly" class="pixel-btn pixel-font py-4 text-3xl bg-green-600 hover:bg-green-500 text-white">✈️ START RUN</button>
                <button id="btn-customize" class="pixel-btn pixel-font py-3 text-2xl bg-purple-600 hover:bg-purple-500 text-white">🎨 MEME FILTERS</button>
                
                <div class="text-xs text-gray-400 mt-2">Tap or press Space to flap through the feed.</div>
            </div>

            <!-- Customize Screen -->
            <div id="customize-screen" class="hidden glass-panel p-4 pointer-events-auto max-w-md w-full text-white mx-4 h-[90vh] flex flex-col">
                <h2 class="pixel-font text-3xl mb-2 mc-text text-yellow-400 text-center">Meme Filters</h2>
                
                <div class="flex-1 overflow-y-auto space-y-6 px-2 pb-4">
                    
                    <!-- Landmark Selector -->
                    <div>
                        <h3 class="pixel-font text-xl mb-2 mc-text text-blue-300 border-b border-gray-600 pb-1">Backdrop</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="squid">🗿 Squid House</button>
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="adventurebay">🐶 Adv. Bay</button>
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="eiffel">🗼 Eiffel</button>
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="castle">🏰 Castle</button>
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="donut">🍩 Donuts</button>
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="liberty">🗽 Statue</button>
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="station">🚓 Police</button>
                            <button class="landmark-btn pixel-btn py-3 text-xl" data-landmark="train">🚂 Train Stn</button>
                        </div>
                    </div>

                    <!-- Theme Selector -->
                    <div>
                        <h3 class="pixel-font text-xl mb-2 mc-text text-blue-300 border-b border-gray-600 pb-1">Visual Remix</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <!-- New Styles -->
                            <button class="style-btn pixel-btn py-4 text-xl bg-black text-yellow-400 border-blue-700" data-style="pacman">🍒 Pac-Man</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-orange-200 text-red-900 border-orange-400" data-style="oilpaint">🎨 Oil Paint</button>

                            <!-- Existing Styles -->
                            <button class="style-btn pixel-btn py-4 text-xl bg-white text-black border-gray-400" data-style="doodle">✏️ Doodle</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-green-800 text-yellow-400 border-yellow-600" data-style="superbowl">🏈 Super Bowl</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-red-800 text-yellow-200 border-yellow-500" data-style="puppets">🎭 Puppets</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-blue-600 text-white border-red-500" data-style="nintendo">🎮 Nintendo</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-black text-cyan-400 border-pink-500" data-style="tiktok">🎵 TikTok</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-green-700 text-green-100" data-style="animals">🦁 Animals</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-slate-700" data-style="robots">🤖 Robots</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-blue-600" data-style="lego">🧱 Lego</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-amber-700" data-style="cookie">🍪 Cookie</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-indigo-900" data-style="police">🚓 Police</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-pink-600" data-style="neon">🌃 Neon</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-gray-800" data-style="gothic">🦇 Gothic</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-zinc-400 text-black" data-style="cinema">🎬 Cinema</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-lime-900 text-green-400" data-style="aliens">👽 Aliens</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-orange-200 text-amber-900" data-style="cardboard">📦 Box</button>
                            <button class="style-btn pixel-btn py-4 text-xl bg-pink-400 text-red-900" data-style="valentine">💘 Love</button>
                        </div>
                    </div>
                </div>

                <button id="btn-back-cust" class="pixel-btn pixel-font w-full py-3 bg-red-600 mt-2 text-2xl">LOCK IT IN</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-8 text-center pointer-events-auto mx-4 max-w-sm w-full">
                <h2 class="pixel-font text-5xl font-bold text-red-500 mb-2 mc-text">FEED WIPEOUT!</h2>
                <div class="text-3xl text-white mb-6 mc-text">Reaction Gems: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="pixel-btn pixel-font py-3 px-8 bg-green-600 w-full mb-4 text-2xl text-white">REPOST</button>
                <button id="menu-btn" class="pixel-btn pixel-font py-3 px-8 bg-gray-600 w-full text-2xl text-white">LOBBY</button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="absolute top-4 left-4 text-5xl font-bold text-white mc-text hidden flex items-center gap-2 drop-shadow-md z-20">
                <span class="text-green-400">♦</span> <span id="score" class="pixel-font">0</span>
            </div>

            <!-- Cutscene Prompt -->
            <div id="cutscene-ui" class="absolute bottom-24 w-full text-center hidden animate-pulse z-20 pointer-events-none">
                <span class="pixel-font text-white text-2xl mc-text bg-black/50 px-4 py-2 rounded">TAP TO DROP IN</span>
            </div>

            <!-- [agent-note][stage3] resolved-gif: fail + streak feedback use catalogs/gifs.json and stay off the playfield -->
            <div id="feedback-gif-shell" class="feedback-gif z-20" aria-live="polite">
                <img id="feedback-gif-image" alt="Meme reaction feedback overlay">
                <div id="feedback-gif-label" class="feedback-gif-label">AIRLIFT HYPE</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. CONFIG & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        let width, height;
        let gameState = 'MENU'; 
        let score = 0;
        let frames = 0;
        let gameSpeed = 4;
        let bgScroll = 0; 
        
        // Settings
        let currentStyle = 'pacman'; 
        let currentLandmark = 'squid'; 
        let cameraScale = 1.0;
        
        // Entities
        let player = { x: 50, y: 200, w: 60, h: 30, dy: 0, gravity: 0.4, lift: -7, angle: 0 };
        const CHARACTER_THEME = {
            hull: "#ffe45c",
            visor: "#6cf3ff",
            trim: "#ff6bb8",
            glow: "rgba(255, 228, 92, 0.35)"
        };
        let obstacles = [];
        let clouds = [];

        // Audio + feedback media
        // [agent-note][stage3] resolved-audio: ui, pickup, jump, fail, and gameplay loop are mapped from catalogs/audios.json
        // [agent-note][stage3] resolved-font: title/ui accents use approved catalog fonts Audiowide, Exo 2, and Press Start 2P
        const APPROVED_AUDIO = {
            flap: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3',
            pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
            crash: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',
            uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
            start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
            menuOpen: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3',
            menuClose: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3',
            gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
            bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
        };

        const FEEDBACK_GIFS = {
            fail: {
                src: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp',
                label: 'FEED MELTDOWN'
            },
            streak: {
                src: 'https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp',
                label: 'GEM STREAK'
            }
        };

        const feedbackGifShell = document.getElementById('feedback-gif-shell');
        const feedbackGifImage = document.getElementById('feedback-gif-image');
        const feedbackGifLabel = document.getElementById('feedback-gif-label');

        const audioState = {
            enabled: false,
            unlocked: false,
            sfx: new Map(),
            bgm: null,
            lastPlayed: new Map()
        };

        function getAudio(url, volume = 0.4, loop = false) {
            const key = `${url}|${loop}|${volume}`;
            if (!audioState.sfx.has(key)) {
                const audio = new Audio(url);
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = volume;
                audioState.sfx.set(key, audio);
            }
            return audioState.sfx.get(key);
        }

        function unlockAudio() {
            if (audioState.unlocked) return;
            audioState.unlocked = true;
            audioState.enabled = true;
            audioState.bgm = getAudio(APPROVED_AUDIO.bgm, 0.22, true);
            Object.values(APPROVED_AUDIO).forEach((url, index) => {
                const audio = getAudio(url, url === APPROVED_AUDIO.bgm ? 0.22 : 0.42, url === APPROVED_AUDIO.bgm);
                audio.load();
                if (index < 2) {
                    const warm = audio.cloneNode();
                    warm.volume = 0;
                    warm.play().then(() => {
                        warm.pause();
                        warm.currentTime = 0;
                    }).catch(() => {});
                }
            });
        }

        function playSfx(name, cooldown = 80) {
            if (!audioState.enabled) return;
            const now = performance.now();
            const last = audioState.lastPlayed.get(name) || 0;
            if (now - last < cooldown) return;
            audioState.lastPlayed.set(name, now);

            const url = APPROVED_AUDIO[name];
            if (!url) return;

            try {
                const source = getAudio(url, name === 'pickup' ? 0.34 : 0.4, false).cloneNode();
                source.volume = name === 'pickup' ? 0.34 : name === 'crash' || name === 'gameOver' ? 0.4 : 0.28;
                source.play().catch(() => {});
            } catch (_) {}
        }

        function syncBgm() {
            if (!audioState.enabled || !audioState.bgm) return;
            if (gameState === 'PLAYING' || gameState === 'CUTSCENE') {
                audioState.bgm.play().catch(() => {});
            } else {
                audioState.bgm.pause();
            }
        }

        let feedbackGifTimer = null;
        function showFeedbackGif(type) {
            const config = FEEDBACK_GIFS[type];
            if (!config) return;
            feedbackGifImage.src = config.src;
            feedbackGifLabel.textContent = config.label;
            feedbackGifShell.classList.add('visible');
            clearTimeout(feedbackGifTimer);
            feedbackGifTimer = setTimeout(() => {
                feedbackGifShell.classList.remove('visible');
            }, type === 'fail' ? 1800 : 1300);
        }

        /** 2. RESIZE */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 3. DRAWING HELPERS */
        function drawRoundedRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function drawHeroPilot(ctx, x, y, w, h, angle) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            ctx.rotate(angle);

            ctx.shadowColor = CHARACTER_THEME.glow;
            ctx.shadowBlur = 18;

            ctx.fillStyle = CHARACTER_THEME.hull;
            ctx.beginPath();
            ctx.moveTo(-w / 2, 0);
            ctx.quadraticCurveTo(-4, -h / 2 - 5, w / 2 - 4, -2);
            ctx.quadraticCurveTo(w / 2 + 8, 0, w / 2 - 4, h / 3);
            ctx.quadraticCurveTo(0, h / 2 + 4, -w / 2, 0);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = CHARACTER_THEME.trim;
            ctx.beginPath();
            ctx.moveTo(-10, -2);
            ctx.lineTo(5, -h / 2 - 4);
            ctx.lineTo(16, -4);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-8, 4);
            ctx.lineTo(8, h / 2 + 6);
            ctx.lineTo(18, 7);
            ctx.fill();

            ctx.fillStyle = CHARACTER_THEME.visor;
            ctx.beginPath();
            ctx.ellipse(6, -2, 10, 8, -0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#06101f";
            ctx.beginPath();
            ctx.arc(10, -2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(13, -4, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#fff7c2";
            ctx.beginPath();
            ctx.arc(-14, 0, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#09111f";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        /** 4. LANDMARK RENDERER */
        function drawLandmark(ctx, w, h, scroll) {
            const parallaxX = (w * 0.7) - ((scroll * 0.1) % (w * 4)); 
            if (parallaxX < -500 || parallaxX > w + 200) return; 

            ctx.save();
            ctx.translate(parallaxX, h); 

            if (currentLandmark === 'squid') drawSquidHouse(ctx);
            else if (currentLandmark === 'castle') drawCastle(ctx);
            else if (currentLandmark === 'donut') drawDonutShop(ctx);
            else if (currentLandmark === 'station') drawPoliceStation(ctx);
            else if (currentLandmark === 'train') drawTrainStation(ctx);
            else if (currentLandmark === 'eiffel') drawEiffel(ctx);
            else if (currentLandmark === 'adventurebay') drawAdventureBay(ctx);
            else drawStatue(ctx);

            ctx.restore();
        }

        // --- NEW LANDMARK: SQUID HOUSE ---
        function drawSquidHouse(ctx) {
            const scale = 1.4; ctx.scale(scale, scale);
            
            let baseColor = "#546e7a"; // Blue-grey
            let detailColor = "#37474f";
            let windowColor = "#cfd8dc";

            // Style overrides
            if (currentStyle === 'pacman') { baseColor = "#0000ff"; detailColor = "#000"; windowColor = "#000"; }
            if (currentStyle === 'oilpaint') { baseColor = "#78909c"; detailColor = "#455a64"; windowColor = "#eceff1"; }
            if (currentStyle === 'doodle') { baseColor = "#fff"; detailColor = "#000"; windowColor = "#fff"; }

            // Head Shape (Cylinder-ish)
            ctx.fillStyle = baseColor;
            if (currentStyle === 'doodle' || currentStyle === 'pacman') {
                ctx.strokeStyle = (currentStyle === 'pacman') ? "#00f" : "#000";
                ctx.lineWidth = 3;
            }

            // Main body
            ctx.beginPath();
            ctx.moveTo(-40, 0); 
            ctx.lineTo(-45, -120); // Taper up
            ctx.quadraticCurveTo(0, -160, 45, -120); // Top dome
            ctx.lineTo(40, 0);
            ctx.closePath();
            ctx.fill();
            if (currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();

            // Nose
            ctx.fillStyle = baseColor;
            ctx.beginPath();
            ctx.moveTo(-10, -80);
            ctx.quadraticCurveTo(0, -20, 10, -80); // Droopy nose
            ctx.quadraticCurveTo(0, -90, -10, -80);
            ctx.fill();
            if (currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();
            // Nose shadow/outline for definition in non-outline styles
            if (currentStyle !== 'doodle' && currentStyle !== 'pacman') {
                ctx.strokeStyle = detailColor; ctx.lineWidth = 1; ctx.stroke();
            }

            // Eyes (Windows)
            ctx.fillStyle = (currentStyle === 'pacman') ? "#000" : "#ffeb3b"; // Yellow light inside
            ctx.beginPath(); ctx.arc(-25, -90, 12, 0, Math.PI*2); ctx.fill(); // Left
            if (currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();
            else { ctx.strokeStyle = detailColor; ctx.lineWidth = 2; ctx.stroke(); }

            ctx.beginPath(); ctx.arc(25, -90, 12, 0, Math.PI*2); ctx.fill(); // Right
            if (currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();
            else { ctx.strokeStyle = detailColor; ctx.lineWidth = 2; ctx.stroke(); }

            // Mouth (Door)
            ctx.fillStyle = "#5d4037"; // Wood
            if (currentStyle === 'pacman') ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.ellipse(0, -20, 15, 20, 0, Math.PI, 0); // Arch door
            ctx.fill();
            if (currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();

            // Ears (Side blocks)
            ctx.fillStyle = baseColor;
            ctx.fillRect(-55, -80, 10, 40);
            ctx.fillRect(45, -80, 10, 40);
            if (currentStyle === 'doodle' || currentStyle === 'pacman') {
                ctx.strokeRect(-55, -80, 10, 40);
                ctx.strokeRect(45, -80, 10, 40);
            }
        }

        // --- UPDATED ADVENTURE BAY ---
        function drawAdventureBay(ctx) {
            const scale = 1.4; ctx.scale(scale, scale);
            
            // Comprehensive Palette Map
            const palettes = {
                default: { base: "#bdc3c7", stripe: "#3498db", top: "#e74c3c", glass: "#95a5a6", peri: "#f1c40f" },
                nintendo: { base: "#999", stripe: "#00f", top: "#f00", glass: "#000", peri: "#ff0" },
                puppets: { base: "#8d6e63", stripe: "#5d4037", top: "#b71c1c", glass: "#3e2723", peri: "#ffb300" },
                neon: { base: "#111", stripe: "#0ff", top: "#f0f", glass: "#000", peri: "#ff0" },
                tiktok: { base: "#000", stripe: "#00f2ea", top: "#ff0050", glass: "#222", peri: "#fff" },
                animals: { base: "#5d4037", stripe: "#388e3c", top: "#ff9800", glass: "#8d6e63", peri: "#ffeb3b" },
                lego: { base: "#f1c40f", stripe: "#0055bf", top: "#c91a09", glass: "#fff", peri: "#f1c40f" },
                cinema: { base: "#333", stripe: "#666", top: "#999", glass: "#000", peri: "#fff" },
                aliens: { base: "#004d40", stripe: "#00e676", top: "#1de9b6", glass: "#000", peri: "#69f0ae" },
                cardboard: { base: "#d7ccc8", stripe: "#a1887f", top: "#8d6e63", glass: "#5d4037", peri: "#ffccbc" },
                valentine: { base: "#f8bbd0", stripe: "#f48fb1", top: "#e91e63", glass: "#ad1457", peri: "#ff80ab" },
                robots: { base: "#546e7a", stripe: "#29b6f6", top: "#ef5350", glass: "#37474f", peri: "#ffee58" },
                police: { base: "#2c3e50", stripe: "#fff", top: "#003366", glass: "#000", peri: "#c0392b" },
                cookie: { base: "#d2691e", stripe: "#8b4513", top: "#f4a460", glass: "#a0522d", peri: "#deb887" },
                gothic: { base: "#212121", stripe: "#424242", top: "#616161", glass: "#000", peri: "#757575" },
                doodle: { base: "#f0f0f0", stripe: "#000", top: "#e0e0e0", glass: "#fff", peri: "#333" },
                superbowl: { base: "#fbc02d", stripe: "#fff", top: "#795548", glass: "#1a237e", peri: "#fff" },
                // NEW PALETTES
                pacman: { base: "#000", stripe: "#00f", top: "#000", glass: "#000", peri: "#ff0" },
                oilpaint: { base: "#b0bec5", stripe: "#546e7a", top: "#ef5350", glass: "#cfd8dc", peri: "#ffee58" }
            };

            const p = palettes[currentStyle] || palettes['default'];

            // Tower Base (Legs)
            ctx.fillStyle = p.base;
            ctx.beginPath();
            ctx.moveTo(-40, 0); ctx.lineTo(-20, -80); ctx.lineTo(20, -80); ctx.lineTo(40, 0);
            ctx.fill();
            
            // Outline for doodle/pacman
            if (currentStyle === 'doodle' || currentStyle === 'pacman') {
                ctx.strokeStyle = (currentStyle === 'pacman') ? "#00f" : "#000"; 
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-20, -80); ctx.lineTo(20, -80); ctx.lineTo(40, 0); ctx.stroke();
            }

            // Elevator Shaft
            ctx.fillStyle = p.glass;
            ctx.fillRect(-15, -120, 30, 120);
            if(currentStyle === 'doodle' || currentStyle === 'pacman') ctx.strokeRect(-15, -120, 30, 120);
            
            // Badge / Shield
            ctx.fillStyle = p.stripe;
            ctx.beginPath(); ctx.arc(0, -90, 15, 0, Math.PI*2); ctx.fill();
            if(currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();
            
            // Lookout Top (Bulb)
            ctx.fillStyle = p.top;
            ctx.beginPath(); ctx.ellipse(0, -140, 50, 25, 0, 0, Math.PI*2); ctx.fill();
            if(currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();
            
            // Windows
            ctx.fillStyle = "#89cff0";
            if(currentStyle === 'pacman') ctx.fillStyle = "#000";
            if(currentStyle === 'doodle') ctx.fillStyle = "#fff";
            
            ctx.beginPath(); ctx.ellipse(0, -140, 40, 15, 0, 0, Math.PI*2); ctx.fill();
            if(currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();

            // Roof
            ctx.fillStyle = p.top;
            ctx.beginPath(); ctx.moveTo(-50, -140); ctx.quadraticCurveTo(0, -180, 50, -140); ctx.fill();
            if(currentStyle === 'doodle' || currentStyle === 'pacman') ctx.stroke();

            // Periscope
            ctx.fillStyle = p.peri;
            ctx.fillRect(-5, -170, 10, 30);
            ctx.fillRect(-15, -175, 20, 10);
            if(currentStyle === 'doodle' || currentStyle === 'pacman') { ctx.strokeRect(-5, -170, 10, 30); ctx.strokeRect(-15, -175, 20, 10); }
        }

        function drawEiffel(ctx) {
            const scale = 1.5; ctx.scale(scale, scale);
            let color = "#555";
            if (currentStyle === 'pacman') color = "#00f";
            if (currentStyle === 'oilpaint') color = "#8d6e63";
            if (currentStyle === 'doodle') color = "#000";
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            ctx.moveTo(-40, -10); ctx.lineTo(0, -180); ctx.lineTo(40, -10);
            ctx.stroke();
            
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-30, -50); ctx.lineTo(30, -50);
            ctx.moveTo(-15, -110); ctx.lineTo(15, -110);
            ctx.stroke();
        }

        function drawTrainStation(ctx) {
            const scale = 1.3; ctx.scale(scale, scale);
            let mainColor = "#795548"; let roofColor = "#3e2723";
            if (currentStyle === 'pacman') { mainColor = "#000"; roofColor = "#00f"; }
            if (currentStyle === 'doodle') { mainColor = "#fff"; roofColor = "#fff"; }

            ctx.fillStyle = mainColor; ctx.fillRect(-60, -80, 120, 80);
            if(currentStyle==='doodle' || currentStyle==='pacman') { ctx.strokeStyle=(currentStyle==='pacman'?"#00f":"#000"); ctx.lineWidth=3; ctx.strokeRect(-60,-80,120,80); }

            ctx.fillStyle = roofColor;
            ctx.beginPath(); ctx.moveTo(-70, -80); ctx.quadraticCurveTo(0, -130, 70, -80); ctx.fill();
            if(currentStyle==='doodle' || currentStyle==='pacman') ctx.stroke();
        }

        function drawCastle(ctx) {
            const scale = 1.3; ctx.scale(scale, scale);
            let color = "#7f8c8d";
            if (currentStyle === 'pacman') color = "#000";
            if (currentStyle === 'doodle') color = "#fff";
            
            ctx.fillStyle = color; 
            ctx.fillRect(-80, -120, 160, 120);
            if(currentStyle==='doodle' || currentStyle==='pacman') { ctx.strokeStyle=(currentStyle==='pacman'?"#00f":"#000"); ctx.lineWidth=3; ctx.strokeRect(-80,-120,160,120); }
            
            const drawTower = (x) => {
                ctx.fillStyle = (currentStyle === 'pacman') ? "#000" : "#95a5a6";
                if(currentStyle==='doodle') ctx.fillStyle="#fff";
                ctx.fillRect(x, -160, 40, 160);
                if(currentStyle==='doodle' || currentStyle==='pacman') ctx.strokeRect(x,-160,40,160);
            };
            drawTower(-100); drawTower(60);
            
            ctx.fillStyle = "#4a3c31"; 
            if (currentStyle === 'pacman') ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(0, 0, 40, Math.PI, 0); ctx.fill();
        }

        function drawDonutShop(ctx) {
            const scale = 1.3; ctx.scale(scale, scale);
            ctx.fillStyle = "#ecf0f1"; 
            if (currentStyle === 'pacman') ctx.fillStyle = "#000";
            if (currentStyle === 'doodle') ctx.fillStyle = "#fff";
            ctx.fillRect(-70, -90, 140, 90); 
            if(currentStyle==='doodle' || currentStyle==='pacman') { ctx.strokeStyle=(currentStyle==='pacman'?"#00f":"#000"); ctx.lineWidth=3; ctx.strokeRect(-70,-90,140,90); }
            
            ctx.save(); ctx.translate(0, -150); 
            ctx.fillStyle = "#d35400"; 
            if (currentStyle === 'pacman') ctx.fillStyle = "#ff0";
            if (currentStyle === 'doodle') ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.fill(); 
            if(currentStyle==='doodle' || currentStyle==='pacman') ctx.stroke();
            ctx.restore();
        }

        function drawPoliceStation(ctx) {
            const scale = 1.3; ctx.scale(scale, scale);
            ctx.fillStyle = "#2c3e50"; 
            if(currentStyle==='doodle') ctx.fillStyle="#fff";
            if(currentStyle==='pacman') ctx.fillStyle="#000";
            ctx.fillRect(-60, -100, 120, 100);
            if(currentStyle==='doodle' || currentStyle==='pacman') { ctx.strokeStyle=(currentStyle==='pacman'?"#00f":"#000"); ctx.lineWidth=3; ctx.strokeRect(-60,-100,120,100); }
        }

        function drawStatue(ctx) {
            const scale = 1.3; ctx.scale(scale, scale);
            ctx.fillStyle = "#27ae60"; 
            if (currentStyle === 'pacman') ctx.fillStyle = "#000";
            if (currentStyle === 'doodle') ctx.fillStyle = "#fff";
            ctx.fillRect(-20, -100, 40, 100); 
            if(currentStyle === 'doodle' || currentStyle === 'pacman') { ctx.strokeStyle=(currentStyle==='pacman'?"#00f":"#000"); ctx.lineWidth=3; ctx.strokeRect(-20,-100,40,100); }

            ctx.beginPath(); ctx.arc(0, -120, 20, 0, Math.PI*2); ctx.fill(); 
            if(currentStyle==='doodle' || currentStyle==='pacman') ctx.stroke();
        }

        /** 5. STYLE DEFINITIONS */
        const STYLES = {
            'pacman': {
                bg: (ctx, w, h) => {
                    ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
                    // Dot grid
                    ctx.fillStyle = "#ffb8ae"; 
                    const spacing = 60;
                    const offset = -(bgScroll % spacing);
                    for(let x=offset; x<w; x+=spacing) {
                        for(let y=0; y<h; y+=spacing) {
                            ctx.fillRect(x+28, y+28, 4, 4);
                        }
                    }
                },
                plane: (ctx, x, y, w, h, angle) => {
                    drawHeroPilot(ctx, x, y, w, h, angle);
                },
                obs: (ctx, x, y, w, h, type) => {
                    // Maze Walls
                    ctx.strokeStyle = "#2121ff"; // Arcade Blue
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x+4, y+4, w-8, h-8);
                    ctx.strokeStyle = "#a5a5ff"; // Inner lighter blue
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x+8, y+8, w-16, h-16);
                }
            },
            'oilpaint': {
                bg: (ctx, w, h) => {
                    ctx.fillStyle = "#f5f5dc"; // Beige Canvas
                    ctx.fillRect(0,0,w,h);
                    
                    // Random paint splotches
                    // Since we can't do expensive randoms every frame, use deterministic psuedo-random based on scroll
                    for(let i=0; i<5; i++) {
                        let lx = ((i * 137) + bgScroll * 0.5) % (w + 200) - 100;
                        let ly = ((i * 293)) % h;
                        ctx.fillStyle = `hsla(${(i*50)%360}, 60%, 70%, 0.3)`;
                        ctx.beginPath();
                        ctx.ellipse(lx, ly, 60, 40, i, 0, Math.PI*2);
                        ctx.fill();
                    }
                },
                plane: (ctx, x, y, w, h, angle) => {
                    drawHeroPilot(ctx, x, y, w, h, angle);
                },
                obs: (ctx, x, y, w, h, type) => {
                    // Paint tubes / Brushes logic or just abstract shapes
                    ctx.fillStyle = "#795548"; // Brown obstacles
                    
                    // Draw as series of circles to look like a thick stroke
                    for(let i=y; i<y+h; i+=20) {
                        let jitter = Math.sin(i*0.1)*5;
                        ctx.beginPath();
                        ctx.arc(x+w/2+jitter, i, w/2, 0, Math.PI*2);
                        ctx.fill();
                    }
                    
                    // Highlights
                    ctx.fillStyle = "rgba(255,255,255,0.2)";
                    for(let i=y; i<y+h; i+=30) {
                        ctx.beginPath();
                        ctx.arc(x+w/2-5, i, 5, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
            },
            'doodle': {
                bg: (ctx, w, h) => {
                    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
                    ctx.strokeStyle = "#a0c0ff"; ctx.lineWidth = 1;
                    const spacing = 40;
                    for(let i=spacing; i<h; i+=spacing) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }
                    ctx.strokeStyle = "#ffcccc"; ctx.lineWidth = 2;

        // Fallback
        ['gothic','firefighter'].forEach(k => { if(!STYLES[k]) STYLES[k] = STYLES['liberty']; });

        /** 6. GAME LOGIC */
        function resetGame() {
            player.y = height / cameraScale / 2;
            player.dy = 0;
            player.angle = 0;
            score = 0;
            obstacles = [];
            frames = 0;
            bgScroll = 0;
            gameSpeed = 4;
            feedbackGifShell.classList.remove('visible');
            document.getElementById('score').innerText = score;
        }

        function createCloud(far) {
            return {
                x: (width/cameraScale) + Math.random() * 200,
                y: Math.random() * ((height/cameraScale) * 0.6),
                w: 60 + Math.random() * 80,
                h: 30 + Math.random() * 30,
                speed: far ? 0.5 : 1.5,
                far: far
            };
        }

        for(let i=0; i<8; i++) clouds.push(createCloud(i%2===0));

        function update() {
            frames++;
            
            // Clear & Setup Camera
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            ctx.clearRect(0, 0, width, height);
            
            const renderer = STYLES[currentStyle] || STYLES['liberty'];
            renderer.bg(ctx, width, height);

            // Apply Camera Zoom
            ctx.scale(cameraScale, cameraScale);
            const viewW = width / cameraScale;
            const viewH = height / cameraScale;

            if (gameState === 'PLAYING' || gameState === 'CUTSCENE' || gameState === 'GAMEOVER') {
                if (gameState === 'PLAYING') bgScroll += gameSpeed;
                
                // Draw Landmark
                drawLandmark(ctx, viewW, viewH, bgScroll);

                // Clouds
                clouds.forEach(c => {
                    c.x -= c.speed;
                    if(c.x + c.w < 0) Object.assign(c, createCloud(c.far));
                    
                    // Style specific cloud rendering
                    ctx.fillStyle = (currentStyle === 'neon' || currentStyle === 'aliens' || currentStyle === 'tiktok' || currentStyle === 'pacman') ? "rgba(0,0,0,0)" : "rgba(255,255,255,0.4)";
                    if (currentStyle === 'nintendo') ctx.fillStyle = "rgba(0,0,0,0)"; // Handled in BG
                    
                    if (currentStyle === 'doodle') {
                        ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(c.x+c.w/2, c.y+c.h/2, c.w/2, 0, Math.PI*2); ctx.stroke();
                    } else if (currentStyle === 'neon') { 
                        ctx.strokeStyle = "#333"; ctx.strokeRect(c.x, c.y, c.w, c.h); 
                    } else if (currentStyle === 'oilpaint') {
                        // Smudged clouds
                        ctx.fillStyle = "rgba(255,255,255,0.3)";
                        ctx.beginPath(); ctx.ellipse(c.x+c.w/2, c.y+c.h/2, c.w/2, c.h/2, 0, 0, Math.PI*2); ctx.fill();
                    } else if (currentStyle !== 'aliens' && currentStyle !== 'tiktok' && currentStyle !== 'nintendo' && currentStyle !== 'pacman') {
                        ctx.fillRect(c.x, c.y, c.w, c.h);
                    }
                });

                // Logic
                if (gameState === 'PLAYING') {
                    player.dy += player.gravity;
                    player.y += player.dy;
                    player.angle = Math.min(0.8, Math.max(-0.8, player.dy * 0.1));

                    if (player.y < 0 || player.y + player.h > viewH) gameOver();

                    if (frames % 100 === 0) {
                        let h = 50 + Math.random() * 150;
                        let isTop = Math.random() > 0.5;
                        obstacles.push({
                            type: 'island',
                            x: viewW,
                            y: isTop ? 0 : viewH - h,
                            w: 50 + Math.random() * 30,
                            h: h
                        });
                    }
                    if (frames % 60 === 0) {
                        obstacles.push({ type: 'coin', x: viewW, y: Math.random()*(viewH-50), w: 20, h: 20 });
                    }

                    obstacles.forEach((obs, i) => {
                        obs.x -= gameSpeed;
                        if(obs.type === 'coin') {
                            ctx.fillStyle = (currentStyle === 'doodle') ? "#000" : "#f1c40f"; 
                            if(currentStyle === 'pacman') ctx.fillStyle = "#fff"; // Pac-dots
                            
                            if(currentStyle === 'pacman') {
                                ctx.fillRect(obs.x+5, obs.y+5, 10, 10);
                            } else {
                                ctx.beginPath(); ctx.arc(obs.x+10, obs.y+10, 10, 0, Math.PI*2); ctx.fill();
                            }

                            if(currentStyle === 'doodle') { ctx.fillStyle = "#fff"; ctx.font="12px monospace"; ctx.fillText("$", obs.x+7, obs.y+14); }
                        } else {
                            renderer.obs(ctx, obs.x, obs.y, obs.w, obs.h, obs.type);
                        }

                        if (
                            player.x < obs.x + obs.w &&
                            player.x + player.w > obs.x &&
                            player.y < obs.y + obs.h &&
                            player.y + player.h > obs.y
                        ) {
                            if (obs.type === 'coin') {
                                score++;
                                document.getElementById('score').innerText = score;
                                playSfx('pickup', 60);
                                obstacles.splice(i, 1);
                                if(score % 5 === 0) {
                                    gameSpeed += 0.5;
                                    showFeedbackGif('streak');
                                }
                            } else {
                                gameOver();
                            }
                        }
                        if(obs.x + obs.w < 0) obstacles.splice(i, 1);
                    });
                }

                // Draw Player
                renderer.plane(ctx, player.x, player.y, player.w, player.h, player.angle);
                
                // Draw Ground for Cutscene
                if (gameState === 'CUTSCENE') {
                    ctx.fillStyle = (currentStyle === 'doodle') ? "#fff" : "#333";
                    if(currentStyle === 'pacman') ctx.fillStyle = "#000";
                    ctx.fillRect(0, viewH - 50, viewW, 50);
                    if(currentStyle === 'doodle') { ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0, viewH-50); ctx.lineTo(viewW, viewH-50); ctx.stroke(); }
                    if(currentStyle === 'pacman') { ctx.strokeStyle="#00f"; ctx.lineWidth=2; ctx.strokeRect(0, viewH-50, viewW, 50); }
                    
                    // Simple text prompt
                    ctx.fillStyle = (currentStyle === 'doodle') ? "#000" : "#fff"; 
                    ctx.font = "24px 'Orbitron'";
                    ctx.fillText("LOCK IN. TAP TO DIVE.", 40, viewH - 80);
                }
            }

            requestAnimationFrame(update);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSfx('crash', 120);
            playSfx('gameOver', 120);
            syncBgm();
            showFeedbackGif('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function startGame(skip) {
            resetGame();
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('customize-screen').classList.add('hidden');
            
            if(!skip) {
                gameState = 'CUTSCENE';
                player.y = (height/cameraScale) - 80;
                document.getElementById('cutscene-ui').classList.remove('hidden');
                playSfx('start', 120);
            } else {
                gameState = 'PLAYING';
                document.getElementById('hud').classList.remove('hidden');
                playSfx('menuClose', 120);
            }
            syncBgm();
        }

        /** 7. INPUT */
        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type !== 'keydown') e.preventDefault();
            unlockAudio();

            if (gameState === 'PLAYING') {
                player.dy = player.lift;
                playSfx('flap', 90);
            } else if (gameState === 'CUTSCENE') {
                gameState = 'PLAYING';
                document.getElementById('cutscene-ui').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                player.y = height/cameraScale/2;
                syncBgm();
            }
        }

        window.addEventListener('keydown', handleInput);
        // [agent-note][stage4] repaired: mobile-action-path | scope gesture suppression to play surface so menu taps keep native click behavior
        gameContainer.style.touchAction = 'manipulation';
        canvas.style.touchAction = 'none';
        canvas.addEventListener('pointerdown', handleInput);

        // UI Listeners
        document.getElementById('btn-fly').onclick = (e) => {
            e.stopPropagation();
            unlockAudio();
            playSfx('uiClick', 80);
            startGame(false);
        };
        document.getElementById('restart-btn').onclick = (e) => {
            e.stopPropagation();
            unlockAudio();
            playSfx('uiClick', 80);
            startGame(true);
        };
        document.getElementById('menu-btn').onclick = (e) => { 
            e.stopPropagation();
            unlockAudio();
            playSfx('menuOpen', 120);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            gameState = 'MENU';
            syncBgm();
        };

        // Customize Menu
        document.getElementById('btn-customize').onclick = (e) => {
            e.stopPropagation();
            unlockAudio();
            playSfx('menuOpen', 120);
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('customize-screen').classList.remove('hidden');
            updateSelectionUI();
        };
        document.getElementById('btn-back-cust').onclick = (e) => {
            e.stopPropagation();
            unlockAudio();
            playSfx('menuClose', 120);
            document.getElementById('customize-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        };

        // Style Selection
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                currentStyle = btn.dataset.style;
                document.body.className = `style-${currentStyle}`;
                updateSelectionUI();
            };
        });

        // Landmark Selection
        document.querySelectorAll('.landmark-btn').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                currentLandmark = btn.dataset.landmark;
                updateSelectionUI();
            };
        });

        function updateSelectionUI() {
            document.querySelectorAll('.style-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.style === currentStyle);
            });
            document.querySelectorAll('.landmark-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.landmark === currentLandmark);
            });
        }

        // Set initial body class
        document.body.className = `style-${currentStyle}`;
        updateSelectionUI();
        update();
    });
    </script>
</body>
</html>
