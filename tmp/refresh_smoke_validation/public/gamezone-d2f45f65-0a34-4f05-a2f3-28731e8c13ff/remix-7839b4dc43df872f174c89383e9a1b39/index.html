<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Salvage Run</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded');
        :root {
            --bg-deep: #050816;
            --bg-mid: #0a1231;
            --panel-fill: rgba(8, 16, 40, 0.76);
            --panel-stroke: rgba(118, 236, 255, 0.36);
            --hud-glow: rgba(0, 217, 255, 0.22);
            --hero-accent: #76ecff;
            --hero-core: #9d7bff;
            --enemy-accent: #ff4d8d;
            --enemy-shadow: #511033;
            --gem-accent: #8effd7;
            --text-main: #f4f8ff;
            --text-soft: #afc7df;
            --grid-line: rgba(118, 236, 255, 0.08);
            --border-danger: #ff3f72;
            --success: #76ffbf;
            --warning: #ffd56a;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(83, 126, 255, 0.18), transparent 42%),
                radial-gradient(circle at bottom, rgba(0, 217, 255, 0.12), transparent 36%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Exo 2', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            color: var(--text-main);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            mix-blend-mode: screen;
            opacity: 0.18;
            pointer-events: none;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }

        .hud-top { padding: max(12px, env(safe-area-inset-top)) 14px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .hud-cluster { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
        .score-board {
            background: linear-gradient(180deg, rgba(23, 36, 79, 0.92), rgba(8, 14, 35, 0.92));
            padding: 8px 14px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 0 1px var(--panel-stroke), 0 10px 22px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.08);
            color: var(--text-main);
            font-weight: 600;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            letter-spacing: 0.04em;
            min-width: 88px;
            justify-content: center;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
        }
        .status-board {
            min-width: 136px;
            justify-content: flex-start;
        }
        .gem-icon { color: var(--gem-accent); text-shadow: 0 0 12px rgba(142, 255, 215, 0.9); }
        .status-text {
            font-size: 14px;
            color: var(--text-soft);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.1em;
            line-height: 1;
        }

        .center-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: auto; transition: opacity 0.3s; width: min(88vw, 420px); }
        .panel-content {
            background:
                linear-gradient(180deg, rgba(18, 29, 70, 0.94), rgba(6, 10, 27, 0.94));
            backdrop-filter: blur(16px);
            padding: 28px 22px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px var(--panel-stroke);
            position: relative;
            overflow: hidden;
        }
        .panel-content::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top center, rgba(118, 236, 255, 0.2), transparent 45%);
            pointer-events: none;
        }
        h1 {
            color: var(--text-main);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(28px, 7vw, 44px);
            letter-spacing: 0.08em;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(118, 236, 255, 0.4);
        }
        p {
            color: var(--text-soft);
            font-size: clamp(14px, 3.8vw, 17px);
            margin: 0 0 24px 0;
            line-height: 1.4;
            font-family: 'Exo 2', Arial, sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c7cff, #1fe4ff);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 14px 28px;
            border-radius: 999px;
            color: #031120;
            font-size: clamp(16px, 4.5vw, 20px);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(31, 228, 255, 0.22);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            min-width: 180px;
        }
        .btn-primary:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(0, 210, 255, 0.2); filter: brightness(1.06); }

        #tutorial-hint {
            position: absolute;
            bottom: calc(84px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            color: rgba(216,236,255,0.74);
            font-size: clamp(12px, 3.5vw, 15px);
            letter-spacing: 0.12em;
            animation: pulse 2s infinite;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(118, 236, 255, 0.35);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
        }

        .feedback-stack {
            position: absolute;
            right: 12px;
            bottom: calc(18px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            width: min(42vw, 180px);
            pointer-events: none;
        }
        .feedback-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 18px;
            background: rgba(7, 13, 35, 0.84);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 0 1px var(--panel-stroke);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--text-main);
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.18s ease, transform 0.18s ease;
            max-width: 100%;
            backdrop-filter: blur(10px);
        }
        .feedback-badge.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .feedback-badge.success { box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 0 1px rgba(118,255,191,0.48); }
        .feedback-badge.danger { box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 0 1px rgba(255,92,140,0.42); }
        .feedback-badge.warning { box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 0 1px rgba(255,213,106,0.42); }

        .gif-reaction {
            position: absolute;
            width: min(32vw, 148px);
            aspect-ratio: 1 / 1;
            border-radius: 22px;
            object-fit: cover;
            background: rgba(12, 20, 46, 0.55);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 14px 30px rgba(0,0,0,0.3), 0 0 0 1px rgba(118,236,255,0.24);
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }
        .gif-reaction.visible {
            opacity: 0.92;
            transform: scale(1);
        }
        #combo-gif {
            left: 12px;
            bottom: calc(18px + env(safe-area-inset-bottom));
        }
        #danger-gif {
            right: 12px;
            top: calc(88px + env(safe-area-inset-top));
        }

        .hidden { opacity: 0; pointer-events: none; }

        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

        @media (max-width: 640px) {
            .score-board { font-size: 15px; padding: 7px 10px; border-radius: 14px; gap: 8px; }
            .status-board { min-width: 120px; }
            .panel-content { padding: 24px 18px; border-radius: 24px; }
            .hud-top { padding-left: 10px; padding-right: 10px; }
            .feedback-stack { width: min(48vw, 156px); right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); }
            .feedback-badge { font-size: 11px; padding: 7px 10px; }
            .gif-reaction { width: min(30vw, 116px); border-radius: 18px; }
            #danger-gif { top: calc(78px + env(safe-area-inset-top)); }
        }
    </style>
</head>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- 1. CONFIG & STATE ---
    window.gameConfig = {
        heroSpeed: 6,
        enemySpawnRate: 1500,
        themeColor: "#00d2ff"
    };

    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (const key in rawConfig) {
            window.gameConfig[key] = rawConfig[key].value;
        }
    } catch(e) { console.error("Config Parse Error", e); }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
    let currentState = STATE.MENU;
    let score = 0;
    let wave = 1;
    let frameCount = 0;
    let loopStarted = false;
    let lastDamageAudioAt = 0;
    let lowHealthWarningShown = false;
    let lowHealthSoundAt = 0;

    const ui = {
        score: document.getElementById('score-display'),
        hp: document.getElementById('hp-display'),
        finalScore: document.getElementById('final-score'),
        statusText: document.getElementById('status-text'),
        startScreen: document.getElementById('start-screen'),
        gameOverScreen: document.getElementById('game-over-screen'),
        tutorialHint: document.getElementById('tutorial-hint'),
        pickupToast: document.getElementById('pickup-toast'),
        warningToast: document.getElementById('warning-toast'),
        crashToast: document.getElementById('crash-toast'),
        comboGif: document.getElementById('combo-gif'),
        dangerGif: document.getElementById('danger-gif'),
        startBtn: document.getElementById('start-btn'),
        restartBtn: document.getElementById('restart-btn')
    };

    function setStatus(text) {
        ui.statusText.textContent = text;
    }

    function flashBadge(el, duration = 700) {
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => el.classList.remove('visible'), duration);
    }

    function flashGif(el, duration = 900) {
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => el.classList.remove('visible'), duration);
    }

    // --- 2. AUDIO (catalog-backed HTMLAudio) ---
    class CatalogAudio {
        constructor() {
            this.enabled = false;
            this.masterVolume = 0.5;
            this.sfxVolume = 0.55;
            this.musicVolume = 0.28;
            this.pools = new Map();
            this.loopPlayers = {};
            this.sources = {
                shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',
                hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3',
                collect: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
                explosion: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3',
                damage: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3',
                warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3',
                uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'
            };
        }

        unlock() {
            this.enabled = true;
            this.ensureLoop('bgm', this.sources.bgm);
        }

        createAudio(url, volume, loop = false) {
            const audio = new Audio(url);
            audio.preload = 'auto';
            audio.crossOrigin = 'anonymous';
            audio.loop = loop;
            audio.volume = volume;
            return audio;
        }

        ensureLoop(name, url) {
            if (this.loopPlayers[name]) return this.loopPlayers[name];
            const loop = this.createAudio(url, this.musicVolume * this.masterVolume, true);
            this.loopPlayers[name] = loop;
            return loop;
        }

        startLoop(name = 'bgm') {
            if (!this.enabled) return;
            const loop = this.ensureLoop(name, this.sources[name] || this.sources.bgm);
            loop.volume = this.musicVolume * this.masterVolume;
            const promise = loop.play();
            if (promise && typeof promise.catch === 'function') promise.catch(() => {});
        }

        stopLoop(name = 'bgm') {
            const loop = this.loopPlayers[name];
            if (!loop) return;
            loop.pause();
            try { loop.currentTime = 0; } catch (e) {}
        }

        suspendLoops() {
            Object.values(this.loopPlayers).forEach(loop => loop.pause());
        }

        play(key, { volume = 1 } = {}) {
            if (!this.enabled || !this.sources[key]) return;
            const poolKey = this.sources[key];
            if (!this.pools.has(poolKey)) this.pools.set(poolKey, []);
            const pool = this.pools.get(poolKey);

            let player = pool.find(a => a.paused || a.ended);
            if (!player) {
                player = this.createAudio(poolKey, this.sfxVolume * this.masterVolume * volume, false);
                if (pool.length < 5) pool.push(player);
            }

            player.volume = Math.min(1, this.sfxVolume * this.masterVolume * volume);
            try { player.currentTime = 0; } catch (e) {}
            const promise = player.play();
            if (promise && typeof promise.catch === 'function') promise.catch(() => {});
        }
    }
    const audio = new CatalogAudio();

    // --- 3. CANVAS & INPUT ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let dpr = 1;

    const input = {
        active: false,
        origin: { x: 0, y: 0 },
        current: { x: 0, y: 0 },
        vector: { x: 0, y: 0 }
    };

    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function armAudio() {
        audio.unlock();
    }

    canvas.addEventListener('pointerdown', e => {
        if (currentState !== STATE.PLAYING) return;
        e.preventDefault();
        armAudio();
        const rect = canvas.getBoundingClientRect();
        input.active = true;
        input.origin.x = e.clientX - rect.left;
        input.origin.y = e.clientY - rect.top;
        input.current.x = input.origin.x;
        input.current.y = input.origin.y;
        input.vector.x = 0;
        input.vector.y = 0;
    }, { passive: false });

    const handleMove = e => {
        if (!input.active) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        input.current.x = e.clientX - rect.left;
        input.current.y = e.clientY - rect.top;

        const dx = input.current.x - input.origin.x;
        const dy = input.current.y - input.origin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 60;

        if (dist > 0) {
            const scale = Math.min(dist, maxDist) / maxDist;
            input.vector.x = (dx / dist) * scale;
            input.vector.y = (dy / dist) * scale;
        }
    };

    const handleEnd = () => {
        input.active = false;
        input.vector.x = 0;
        input.vector.y = 0;
    };

    canvas.addEventListener('pointermove', handleMove, { passive: false });
    canvas.addEventListener('pointerup', handleEnd, { passive: false });
    canvas.addEventListener('pointercancel', handleEnd, { passive: false });

    // --- 4. GAME ENTITIES ---
    const camera = { x: 0, y: 0 };
    const imgPlayer = document.getElementById('asset_player');
    const imgEnemy = document.getElementById('asset_enemy');

    class Entity {
        constructor(x, y, radius) {
            this.x = x;
            this.y = y;
            this.radius = radius;
            this.markedForDeletion = false;
        }
    }

    class Player extends Entity {
        constructor() {
            super(0, 0, 25);
            this.speed = window.gameConfig.heroSpeed;
            this.hp = 100;
            this.maxHp = 100;
            this.cooldown = 0;
            this.angle = 0;
        }

        update(dt) {
            this.x += input.vector.x * this.speed * (dt * 60);
            this.y += input.vector.y * this.speed * (dt * 60);

            const limit = 1000;
            this.x = Math.max(-limit, Math.min(limit, this.x));
            this.y = Math.max(-limit, Math.min(limit, this.y));

            if (this.cooldown > 0) this.cooldown -= dt * 1000;

            let nearest = null;
            let minDst = 400;

            for (const e of enemies) {
                const dx = e.x - this.x;
                const dy = e.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDst) {
                    minDst = dist;
                    nearest = e;
                }
            }

            if (nearest) {
                this.angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                if (this.cooldown <= 0) {
                    this.shoot(this.angle);
                    this.cooldown = 300;
                }
            } else if (input.vector.x !== 0 || input.vector.y !== 0) {
                this.angle = Math.atan2(input.vector.y, input.vector.x);
            }
        }

        shoot(angle) {
            bullets.push(new Bullet(this.x, this.y, angle));
            audio.play('shoot', { volume: 0.75 });
            this.x -= Math.cos(angle) * 5;
            this.y -= Math.sin(angle) * 5;
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            ctx.fillStyle = "rgba(8, 12, 28, 0.9)";
            ctx.fillRect(-22, -48, 44, 7);
            ctx.fillStyle = "#6cffb8";
            ctx.fillRect(-22, -48, 44 * (this.hp / this.maxHp), 7);

            ctx.rotate(this.angle);

            ctx.fillStyle = "rgba(0,0,0,0.28)";
            ctx.beginPath();
            ctx.ellipse(0, 13, 28, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 18;
            ctx.shadowColor = "rgba(118, 236, 255, 0.45)";
            ctx.fillStyle = "#0d1b47";
            ctx.beginPath();
            ctx.moveTo(-26, -4);
            ctx.quadraticCurveTo(-16, -24, 0, -28);
            ctx.quadraticCurveTo(18, -24, 28, 0);
            ctx.quadraticCurveTo(18, 24, 0, 28);
            ctx.quadraticCurveTo(-18, 24, -26, -4);
            ctx.fill();

            ctx.fillStyle = "#1d2f70";
            ctx.beginPath();
            ctx.moveTo(-10, -18);
            ctx.lineTo(-24, -8);
            ctx.lineTo(-14, 0);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-10, 18);
            ctx.lineTo(-24, 8);
            ctx.lineTo(-14, 0);
            ctx.closePath();
            ctx.fill();

            const heroGlow = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
            heroGlow.addColorStop(0, "#f5fbff");
            heroGlow.addColorStop(0.3, window.gameConfig.themeColor);
            heroGlow.addColorStop(0.75, "#7c6bff");
            heroGlow.addColorStop(1, "rgba(124, 107, 255, 0)");
            ctx.fillStyle = heroGlow;
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f5fbff";
            ctx.beginPath();
            ctx.arc(6, -4, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#d4e9ff";
            ctx.fillRect(12, -4, 22, 8);
            ctx.fillStyle = "#6af4ff";
            ctx.fillRect(24, -2, 10, 4);

            ctx.fillStyle = "rgba(128, 230, 255, 0.8)";
            ctx.beginPath();
            ctx.moveTo(-26, 0);
            ctx.lineTo(-36, -8 + Math.sin(frameCount * 0.3) * 2);
            ctx.lineTo(-32, 0);
            ctx.lineTo(-36, 8 - Math.sin(frameCount * 0.3) * 2);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }
    }

    class Enemy extends Entity {
        constructor(x, y) {
            super(x, y, 22);
            this.hp = 30 + (wave * 5);
            this.speed = 2 + Math.random();
        }

        update(dt, player, time) {
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 0) {
                this.x += (dx / dist) * this.speed * (dt * 60);
                this.y += (dy / dist) * this.speed * (dt * 60);
            }

            if (dist < this.radius + player.radius) {
                player.hp -= 0.5;
                shake = 5;
                flashBadge(ui.crashToast, 450);
                flashGif(ui.dangerGif, 900);

                if (time - lastDamageAudioAt > 350) {
                    audio.play('damage', { volume: 0.9 });
                    lastDamageAudioAt = time;
                }

                if (player.hp <= 0) currentState = STATE.GAMEOVER;
            }
        }

        takeDamage(amt) {
            this.hp -= amt;
            if (this.hp <= 0) {
                this.markedForDeletion = true;
                audio.play('explosion', { volume: 0.9 });
                spawnParticles(this.x, this.y, "#ff2e63", 8);
                gems.push(new Gem(this.x, this.y));
                flashGif(ui.comboGif, 700);
                setStatus('TARGET PURGED');
            } else {
                audio.play('hit', { volume: 0.7 });
                spawnParticles(this.x, this.y, "#fff", 2);
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            ctx.fillStyle = "rgba(0,0,0,0.32)";
            ctx.beginPath();
            ctx.ellipse(0, 11, 23, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 12;
            ctx.shadowColor = "rgba(255, 77, 141, 0.35)";
            ctx.fillStyle = "#3d0f2a";
            ctx.beginPath();
            ctx.moveTo(0, -24);
            ctx.lineTo(20, -8);
            ctx.lineTo(24, 10);
            ctx.lineTo(0, 24);
            ctx.lineTo(-24, 10);
            ctx.lineTo(-20, -8);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ff4d8d";
            ctx.beginPath();
            ctx.moveTo(0, -17);
            ctx.lineTo(14, -6);
            ctx.lineTo(18, 7);
            ctx.lineTo(0, 17);
            ctx.lineTo(-18, 7);
            ctx.lineTo(-14, -6);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#14030a";
            ctx.beginPath();
            ctx.arc(-6, -4, 4, 0, Math.PI * 2);
            ctx.arc(6, -4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#14030a";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-8, 9);
            ctx.lineTo(0, 3);
            ctx.lineTo(8, 9);
            ctx.stroke();
            ctx.restore();
        }
    }

    class Bullet extends Entity {
        constructor(x, y, angle) {
            super(x, y, 8);
            this.vx = Math.cos(angle) * 12;
            this.vy = Math.sin(angle) * 12;
            this.life = 60;
        }

        update(dt) {
            this.x += this.vx * (dt * 60);
            this.y += this.vy * (dt * 60);
            this.life--;
            if (this.life <= 0) this.markedForDeletion = true;
        }

        draw(ctx) {
            ctx.save();
            const bulletGlow = ctx.createRadialGradient(this.x, this.y, 1, this.x, this.y, 10);
            bulletGlow.addColorStop(0, "#ffffff");
            bulletGlow.addColorStop(0.35, "#c7f7ff");
            bulletGlow.addColorStop(1, "rgba(0, 210, 255, 0)");
            ctx.fillStyle = bulletGlow;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    class Gem extends Entity {
        constructor(x, y) {
            super(x, y, 10);
            this.magnet = false;
        }

        update(dt, player) {
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 150) this.magnet = true;

            if (this.magnet && dist > 0) {
                this.x += (dx / dist) * 10 * (dt * 60);
                this.y += (dy / dist) * 10 * (dt * 60);
            }

            if (dist < player.radius + this.radius) {
                this.markedForDeletion = true;
                score++;
                player.hp = Math.min(player.maxHp, player.hp + 5);
                audio.play('collect', { volume: 0.85 });
                flashBadge(ui.pickupToast, 650);
                if (score % 3 === 0) flashGif(ui.comboGif, 1000);
                setStatus(`CORES ${score}`);
            }
        }

        draw(ctx) {
            ctx.save();
            const bob = Math.sin((frameCount + this.x) * 0.08) * 2;
            ctx.translate(0, bob);
            ctx.fillStyle = "#8effd7";
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - 12);
            ctx.lineTo(this.x + 11, this.y);
            ctx.lineTo(this.x, this.y + 12);
            ctx.lineTo(this.x - 11, this.y);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "rgba(255,255,255,0.6)";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "rgba(255,255,255,0.65)";
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - 10);
            ctx.lineTo(this.x + 4, this.y - 4);
            ctx.lineTo(this.x, this.y);
            ctx.fill();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = 0.05 + Math.random() * 0.05;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 4, 4);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- 5. GAME LOGIC ---
    let player;
    let enemies = [];
    let bullets = [];
    let gems = [];
    let particles = [];
    let shake = 0;
    let lastSpawn = 0;

    function initGame() {
        player = new Player();
        enemies = [];
        bullets = [];
        gems = [];
        particles = [];
        score = 0;
        wave = 1;
        lastSpawn = 0;
        lowHealthWarningShown = false;
        lowHealthSoundAt = 0;
        currentState = STATE.PLAYING;

        ui.startScreen.classList.add('hidden');
        ui.gameOverScreen.classList.add('hidden');
        ui.tutorialHint.classList.remove('hidden');
        setStatus('SALVAGE RUN LIVE');
        setTimeout(() => ui.tutorialHint.classList.add('hidden'), 4000);

        armAudio();
        audio.startLoop('bgm');
        audio.play('start', { volume: 0.9 });
    }

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }

    function checkCollisions() {
        for (const b of bullets) {
            for (const e of enemies) {
                const dx = b.x - e.x;
                const dy = b.y - e.y;
                if (dx * dx + dy * dy < (b.radius + e.radius) ** 2) {
                    b.markedForDeletion = true;
                    e.takeDamage(10);
                    const angle = Math.atan2(e.y - b.y, e.x - b.x);
                    e.x += Math.cos(angle) * 10;
                    e.y += Math.sin(angle) * 10;
                    break;
                }
            }
        }
    }

    function handleStatusEffects(time) {
        if (!player) return;
        if (player.hp <= 35 && currentState === STATE.PLAYING) {
            flashBadge(ui.warningToast, 700);
            flashGif(ui.dangerGif, 950);
            setStatus('HULL CRITICAL');
            if (time - lowHealthSoundAt > 3000) {
                audio.play('warning', { volume: 0.7 });
                lowHealthSoundAt = time;
            }
            lowHealthWarningShown = true;
        } else if (currentState === STATE.PLAYING && score > 0) {
            setStatus(`CORES ${score}`);
            lowHealthWarningShown = false;
        } else if (currentState === STATE.PLAYING) {
            setStatus('SECTOR CLEAR');
            lowHealthWarningShown = false;
        }
    }

    function gameLoop(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;

        if (currentState === STATE.PLAYING) {
            frameCount++;

            if (time - lastSpawn > window.gameConfig.enemySpawnRate) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 600;
                enemies.push(new Enemy(player.x + Math.cos(angle) * dist, player.y + Math.sin(angle) * dist));
                lastSpawn = time;
            }

            player.update(dt);

            enemies.forEach(e => e.update(dt, player, time));
            enemies = enemies.filter(e => !e.markedForDeletion);

            bullets.forEach(b => b.update(dt));
            bullets = bullets.filter(b => !b.markedForDeletion);

            gems.forEach(g => g.update(dt, player));
            gems = gems.filter(g => !g.markedForDeletion);

            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);

            checkCollisions();
            handleStatusEffects(time);

            const targetX = width / 2 - player.x;
            const targetY = height / 2 - player.y;
            camera.x += (targetX - camera.x) * 0.1;
            camera.y += (targetY - camera.y) * 0.1;

            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;

            ui.score.textContent = score;
            ui.hp.textContent = Math.ceil(player.hp);
        } else if (currentState === STATE.GAMEOVER) {
            ui.gameOverScreen.classList.remove('hidden');
            ui.finalScore.textContent = score;
            setStatus('SYSTEM DOWN');
            audio.suspendLoops();
            if (!ui.gameOverScreen.dataset.reported) {
                audio.play('gameOver', { volume: 1 });
                flashGif(ui.dangerGif, 1400);
                ui.gameOverScreen.dataset.reported = 'true';
            }
        }

        ctx.clearRect(0, 0, width, height);

        ctx.save();

        const shakeX = (Math.random() - 0.5) * shake;
        const shakeY = (Math.random() - 0.5) * shake;

        ctx.translate(camera.x + shakeX, camera.y + shakeY);

        const gridSize = 100;
        const startX = -camera.x - width;
        const startY = -camera.y - height;
        const endX = -camera.x + width * 2;
        const endY = -camera.y + height * 2;

        const bgGradient = ctx.createRadialGradient(player ? player.x : 0, player ? player.y : 0, 120, player ? player.x : 0, player ? player.y : 0, 1400);
        bgGradient.addColorStop(0, "rgba(46, 92, 255, 0.16)");
        bgGradient.addColorStop(0.45, "rgba(18, 30, 78, 0.1)");
        bgGradient.addColorStop(1, "rgba(2, 6, 17, 0)");
        ctx.fillStyle = bgGradient;
        ctx.fillRect(startX, startY, endX - startX, endY - startY);

        ctx.strokeStyle = "rgba(118, 236, 255, 0.08)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = Math.floor(startX / gridSize) * gridSize; x < endX; x += gridSize) {
            ctx.moveTo(x, startY);
            ctx.lineTo(x, endY);
        }
        for (let y = Math.floor(startY / gridSize) * gridSize; y < endY; y += gridSize) {
            ctx.moveTo(startX, y);
            ctx.lineTo(endX, y);
        }
        ctx.stroke();

        ctx.strokeStyle = "rgba(118, 236, 255, 0.12)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = Math.floor(startX / (gridSize * 2)) * (gridSize * 2); x < endX; x += gridSize * 2) {
            ctx.moveTo(x, startY);
            ctx.lineTo(x, endY);
        }
        for (let y = Math.floor(startY / (gridSize * 2)) * (gridSize * 2); y < endY; y += gridSize * 2) {
            ctx.moveTo(startX, y);
            ctx.lineTo(endX, y);
        }
        ctx.stroke();

        ctx.shadowBlur = 16;
        ctx.shadowColor = "rgba(255, 63, 114, 0.55)";
        ctx.strokeStyle = "#ff3f72";
        ctx.lineWidth = 10;
        ctx.strokeRect(-1000, -1000, 2000, 2000);
        ctx.shadowBlur = 0;

        gems.forEach(g => g.draw(ctx));
        bullets.forEach(b => b.draw(ctx));
        enemies.forEach(e => e.draw(ctx));
        if (currentState === STATE.PLAYING && player) player.draw(ctx);
        particles.forEach(p => p.draw(ctx));

        ctx.restore();

        if (input.active && currentState === STATE.PLAYING) {
            ctx.save();
            ctx.translate(input.origin.x, input.origin.y);

            ctx.beginPath();
            ctx.arc(0, 0, 60, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(14, 23, 56, 0.34)";
            ctx.strokeStyle = "rgba(118, 236, 255, 0.35)";
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, 36, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,255,255,0.16)";
            ctx.stroke();

            const stickX = input.vector.x * 60;
            const stickY = input.vector.y * 60;

            ctx.beginPath();
            ctx.arc(stickX, stickY, 25, 0, Math.PI * 2);
            const stickGradient = ctx.createRadialGradient(stickX - 4, stickY - 4, 2, stickX, stickY, 25);
            stickGradient.addColorStop(0, "#ffffff");
            stickGradient.addColorStop(0.35, window.gameConfig.themeColor);
            stickGradient.addColorStop(1, "#4434c4");
            ctx.fillStyle = stickGradient;
            ctx.fill();

            ctx.restore();
        }

        requestAnimationFrame(gameLoop);
    }

    let lastTime = 0;

    ui.startBtn.addEventListener('click', () => {
        ui.gameOverScreen.dataset.reported = '';
        audio.play('uiClick', { volume: 0.7 });
        initGame();
        if (!loopStarted) {
            loopStarted = true;
            requestAnimationFrame(gameLoop);
        }
    });

    ui.restartBtn.addEventListener('click', () => {
        ui.gameOverScreen.dataset.reported = '';
        audio.play('uiClick', { volume: 0.7 });
        initGame();
    });

    resize();
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, 0, width, height);

    if (!loopStarted) {
        loopStarted = true;
        requestAnimationFrame(gameLoop);
    }
});
</script>
</body>
