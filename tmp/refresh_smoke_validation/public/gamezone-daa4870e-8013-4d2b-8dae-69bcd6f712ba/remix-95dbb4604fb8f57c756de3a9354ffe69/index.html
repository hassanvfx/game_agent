<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet" />
  <title>Arcade Feed Frenzy</title>
  <style>
    :root {
      --bg1: #090118;
      --bg2: #170231;
      --panel: rgba(18, 8, 40, 0.78);
      --panel-strong: rgba(34, 15, 68, 0.92);
      --accent1: #7cf6ff;
      --accent2: #35c7ff;
      --accent3: #ff4fb3;
      --accent4: #8c68ff;
      --ok: #8ac926;
      --danger: #ff595e;
      --ink: #f8f9ff;
      --muted: rgba(248, 249, 255, 0.82);
      --glow: rgba(124, 246, 255, 0.38);
      --gold: #ffd56a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Exo 2", system-ui, sans-serif;
      background:
        radial-gradient(900px 600px at 16% 12%, rgba(124, 246, 255, 0.18) 0%, transparent 48%),
        radial-gradient(1000px 640px at 82% 88%, rgba(255, 79, 179, 0.14) 0%, transparent 48%),
        radial-gradient(700px 500px at 50% 0%, rgba(140, 104, 255, 0.22) 0%, transparent 52%),
        linear-gradient(180deg, #1a0834 0%, var(--bg2) 32%, var(--bg1) 100%);
      color: var(--ink);
    }
    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom) 8px;
    }
    #stage {
      position: relative;
      width: min(100vw, 560px);
      height: min(100vh, 980px);
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.5),
        0 0 0 2px rgba(124, 246, 255, 0.08),
        inset 0 0 0 2px rgba(255,255,255,.08),
        inset 0 24px 42px rgba(255,255,255,.04);
      background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
      backdrop-filter: blur(4px);
    }
    #stage::before,
    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #stage::before {
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 18%, transparent 82%, rgba(255,255,255,.03)),
        repeating-linear-gradient(
          180deg,
          rgba(124, 246, 255, 0.04) 0 2px,
          transparent 2px 10px
        );
      mix-blend-mode: screen;
      opacity: 0.5;
    }
    #stage::after {
      inset: 10px;
      border-radius: 18px;
      border: 1px solid rgba(124, 246, 255, 0.2);
      box-shadow: inset 0 0 28px rgba(124, 246, 255, 0.08);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      image-rendering: auto;
    }
    #overlayStart {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 22%, rgba(124, 246, 255, 0.16), transparent 30%),
        linear-gradient(180deg, rgba(7,1,24,.74), rgba(18,4,43,.92));
      z-index: 5;
    }
    .panel {
      width: min(92%, 420px);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03)),
        var(--panel);
      border: 2px solid rgba(124, 246, 255, 0.28);
      padding: 18px 16px 14px;
      text-align: center;
      box-shadow:
        0 16px 40px rgba(0,0,0,.36),
        0 0 24px rgba(124, 246, 255, 0.12),
        inset 0 1px 0 rgba(255,255,255,.2);
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(124, 246, 255, 0.16), transparent 46%),
        linear-gradient(135deg, transparent 0 35%, rgba(255,255,255,.05) 35% 44%, transparent 44% 100%);
      pointer-events: none;
    }
    .hero-badge {
      position: relative;
      width: 86px;
      height: 86px;
      margin: 0 auto 10px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,.18) 28%, transparent 30%),
        linear-gradient(160deg, rgba(124, 246, 255, 0.95), rgba(53, 199, 255, 0.65) 48%, rgba(255, 79, 179, 0.92));
      box-shadow:
        0 0 0 3px rgba(255,255,255,.12),
        0 0 24px rgba(124, 246, 255, 0.26),
        inset 0 -14px 24px rgba(28, 14, 59, 0.45);
      display: grid;
      place-items: center;
      animation: mascotPulse 2.8s ease-in-out infinite;
    }
    .hero-badge::before {
      content: "😎";
      font-size: 42px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.28));
      transform: translateY(-1px);
    }
    .hero-badge::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 32px;
      border: 1px solid rgba(124, 246, 255, 0.3);
      opacity: 0.8;
    }
    .title {
      position: relative;
      margin: 0 0 6px;
      font-family: "Russo One", system-ui, sans-serif;
      font-size: clamp(32px, 6vw, 40px);
      line-height: 1.02;
      letter-spacing: 1.4px;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255, 213, 106, 0.3), 0 4px 12px rgba(0,0,0,.45);
    }
    .subtitle {
      position: relative;
      margin: 6px 0 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .btn {
      position: relative;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 12px 22px;
      font-family: "Russo One", system-ui, sans-serif;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.8px;
      color: #130027;
      background: linear-gradient(90deg, #7cf6ff, #ffd56a 58%, #ff78bf);
      box-shadow: 0 10px 22px rgba(53, 199, 255, 0.3);
      transform: translateY(0);
      transition: transform .08s ease, filter .08s ease, box-shadow .18s ease;
    }
    .btn:active { transform: translateY(1px) scale(.99); filter: brightness(.95); }
    .btn:hover { box-shadow: 0 12px 28px rgba(53, 199, 255, 0.38); }
    #hudHint {
      position: relative;
      margin-top: 10px;
      opacity: .82;
      font-size: 12px;
      color: rgba(248,249,255,.72);
    }
    .feedback-gif {
      position: absolute;
      right: 12px;
      width: min(24vw, 112px);
      border-radius: 18px;
      border: 2px solid rgba(124, 246, 255, 0.35);
      box-shadow: 0 10px 26px rgba(0,0,0,.34);
      object-fit: cover;
      background: rgba(8, 4, 22, 0.65);
      opacity: 0;
      transform: scale(.88) translateY(10px);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
      z-index: 4;
    }
    .feedback-gif.visible {
      opacity: .94;
      transform: scale(1) translateY(0);
    }
    #comboGif {
      top: 104px;
      aspect-ratio: 1 / 1;
    }
    #failGif {
      bottom: 18px;
      aspect-ratio: 1 / 1;
    }
    @media (max-width: 480px) {
      .feedback-gif {
        width: 84px;
        right: 8px;
      }
      #comboGif { top: 92px; }
      #failGif { bottom: 10px; }
    }
    @keyframes mascotPulse {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 0 3px rgba(255,255,255,.12), 0 0 24px rgba(124, 246, 255, 0.26), inset 0 -14px 24px rgba(28, 14, 59, 0.45); }
      50% { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 0 3px rgba(255,255,255,.12), 0 0 28px rgba(255, 79, 179, 0.26), inset 0 -14px 24px rgba(28, 14, 59, 0.45); }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <!-- [agent-note][stage3] resolved-gif: combo/fail overlays -> catalogs/gifs.json -->
    <img id="comboGif" class="feedback-gif" alt="Combo reaction" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" />
    <img id="failGif" class="feedback-gif" alt="Fail reaction" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" />
    <div id="overlayStart">
      <div class="panel">
        <div class="hero-badge" aria-hidden="true"></div>
        <h1 class="title">ARCADE FEED FRENZY</h1>
        <p class="subtitle">
          Swap adjacent feed tiles to match 3+.<br />
          4 in a line = 2x score • 5 in a line = 3x score.
        </p>
        <button id="startBtn" class="btn">Launch Run</button>
        <div id="hudHint">Tip: tap or click two neighboring tiles.</div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ======== Config ========
  const COLS = 6;
  const ROWS = 8;
  const GAME_SECONDS = 75;
  const BASE_MATCH_SCORE = 100;
  const MEME_BULLETS = [
    "Clean Sweep!", "Combo Locked!", "Feed Boost!", "Hot Streak!",
    "Perfect Sync!", "Chain Reaction!", "Fast Hands!", "Board Cleared!"
  ];
  const TILE_THEMES = [
    { accent: "#7cf6ff", accentSoft: "rgba(124, 246, 255, 0.22)", core: "🤖", ring: "#d9fdff" },
    { accent: "#ff78bf", accentSoft: "rgba(255, 120, 191, 0.22)", core: "😎", ring: "#ffd7ec" },
    { accent: "#ffd56a", accentSoft: "rgba(255, 213, 106, 0.22)", core: "🔥", ring: "#fff0bf" },
    { accent: "#8c68ff", accentSoft: "rgba(140, 104, 255, 0.22)", core: "⚡", ring: "#e3daff" }
  ];

  const ASSET_URLS = [
    "https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png",
    "https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png",
    "https://gamezone-virid.vercel.app/assets/images/sprites/runner/spike.png",
    "https://gamezone-virid.vercel.app/assets/images/sprites/runner/magnet.png"
  ];

  // [agent-note][stage3] resolved-audio: ui/start/fail/collect/combo/loop -> catalogs/audios.json
  const AUDIO_URLS = {
    start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
    click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
    fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
    pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
    bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
    combo: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
    loop: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3"
  };

  // ======== State ========
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlayStart = document.getElementById("overlayStart");
  const startBtn = document.getElementById("startBtn");
  const comboGif = document.getElementById("comboGif");
  const failGif = document.getElementById("failGif");

  const state = {
    w: 0, h: 0, dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
    boardX: 0, boardY: 0, boardW: 0, boardH: 0, cell: 0,
    hudH: 0,
    images: [],
    grid: [],
    selected: null,
    score: 0,
    comboChain: 0,
    timeLeft: GAME_SECONDS,
    running: false,
    ended: false,
    busy: false,
    bullets: [],
    particles: [],
    lastTs: 0,
    audioReady: false,
    audioUnlocked: false,
    musicEl: null,
    sfxPool: {},
    gifTimers: {}
  };

  // ======== Utilities ========
  const randInt = (n) => Math.floor(Math.random() * n);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function showGif(el, ms = 1200) {
    if (!el) return;
    el.classList.add("visible");
    clearTimeout(state.gifTimers[el.id]);
    state.gifTimers[el.id] = setTimeout(() => el.classList.remove("visible"), ms);
  }

  // ======== Audio ========
  function createAudio(url, volume, loop = false) {
    const audio = new Audio(url);
    audio.preload = "auto";
    audio.crossOrigin = "anonymous";
    audio.volume = volume;
    audio.loop = loop;
    return audio;
  }

  function initAudio() {
    if (state.audioReady) return;
    state.musicEl = createAudio(AUDIO_URLS.loop, 0.18, true);
    state.sfxPool = {
      start: createAudio(AUDIO_URLS.start, 0.42),
      click: createAudio(AUDIO_URLS.click, 0.34),
      fail: createAudio(AUDIO_URLS.fail, 0.38),
      pickup: createAudio(AUDIO_URLS.pickup, 0.32),
      bonus: createAudio(AUDIO_URLS.bonus, 0.34),
      combo: createAudio(AUDIO_URLS.combo, 0.36)
    };
    state.audioReady = true;
  }

  async function unlockAudio() {
    initAudio();
    if (state.audioUnlocked) return;
    state.audioUnlocked = true;
    try {
      state.sfxPool.click.currentTime = 0;
      await state.sfxPool.click.play();
      state.sfxPool.click.pause();
      state.sfxPool.click.currentTime = 0;
    } catch (_) {}
  }

  function playSfx(name) {
    if (!state.audioUnlocked || !state.sfxPool[name]) return;
    try {
      const source = state.sfxPool[name];
      source.pause();
      source.currentTime = 0;
      source.play().catch(() => {});
    } catch (_) {}
  }

  function startMusic() {
    if (!state.audioUnlocked || !state.musicEl) return;
    state.musicEl.play().catch(() => {});
  }

  function stopMusic() {
    if (!state.musicEl) return;
    state.musicEl.pause();
    state.musicEl.currentTime = 0;
  }

  function sfxEliminate(chain) {
    playSfx(chain > 1 ? "bonus" : "pickup");
  }

  function sfxCombo() {
    playSfx("combo");
  }

  function sfxFail() {
    playSfx("fail");
    showGif(failGif, 1100);
  }

  // ======== Assets ========
  function loadImage(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  async function loadAssets() {
    const imgs = await Promise.all(ASSET_URLS.map(loadImage));
    state.images = imgs.filter(Boolean);
    if (state.images.length === 0) {
      state.images = null;
    }
  }

  // ======== Board ========
  function makeTile(type, row, col) {
    return {
      type,
      row,
      col,
      x: state.boardX + col * state.cell,
      y: state.boardY + row * state.cell,
      px: 0, py: 0,
      removing: false
    };
  }

  function randomType() {
    const count = state.images ? state.images.length : ASSET_URLS.length;
    return randInt(Math.max(4, count));
  }

  function initBoardNoMatches() {
    state.grid = Array.from({ length: ROWS }, (_, r) =>
      Array.from({ length: COLS }, (_, c) => {
        let t = randomType();
        while (
          (c >= 2 && state.grid?.[r]?.[c - 1]?.type === t && state.grid?.[r]?.[c - 2]?.type === t) ||
          (r >= 2 && state.grid?.[r - 1]?.[c]?.type === t && state.grid?.[r - 2]?.[c]?.type === t)
        ) {
          t = randomType();
        }
        return makeTile(t, r, c);
      })
    );
  }

  function neighbors(a, b) {
    return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
  }

  function swapTiles(a, b) {
    const ga = state.grid[a.row][a.col];
    const gb = state.grid[b.row][b.col];
    state.grid[a.row][a.col] = gb;
    state.grid[b.row][b.col] = ga;
    const ar = ga.row, ac = ga.col;
    ga.row = gb.row; ga.col = gb.col;
    gb.row = ar; gb.col = ac;
  }

  function findMatches() {
    const groups = [];
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        const start = c;
        const t = state.grid[r][c]?.type;
        if (t == null) { c++; continue; }
        c++;
        while (c < COLS && state.grid[r][c] && state.grid[r][c].type === t) c++;
        const len = c - start;
        if (len >= 3) {
          const cells = [];
          for (let k = start; k < c; k++) cells.push({ row: r, col: k });
          groups.push({ cells, len });
        }
      }
    }
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        const start = r;
        const t = state.grid[r][c]?.type;
        if (t == null) { r++; continue; }
        r++;
        while (r < ROWS && state.grid[r][c] && state.grid[r][c].type === t) r++;
        const len = r - start;
        if (len >= 3) {
          const cells = [];
          for (let k = start; k < r; k++) cells.push({ row: k, col: c });
          groups.push({ cells, len });
        }
      }
    }
    if (!groups.length) return null;

    const keySet = new Set();
    let maxLen = 3;
    for (const g of groups) {
      maxLen = Math.max(maxLen, g.len);
      for (const c of g.cells) keySet.add(`${c.row},${c.col}`);
    }
    const cells = Array.from(keySet).map((k) => {
      const [row, col] = k.split(",").map(Number);
      return { row, col };
    });
    return { cells, maxLen };
  }

  async function animateSwap(a, b, back = false) {
    const dur = 130;
    const t0 = performance.now();
    const tileA = state.grid[a.row][a.col];
    const tileB = state.grid[b.row][b.col];

    const ax0 = tileA.col, ay0 = tileA.row;
    const bx0 = tileB.col, by0 = tileB.row;

    return new Promise((resolve) => {
      function step(ts) {
        const t = clamp((ts - t0) / dur, 0, 1);
        const e = 1 - Math.pow(1 - t, 3);
        const dir = back ? -1 : 1;

        tileA.px = (bx0 - ax0) * state.cell * e * dir;
        tileA.py = (by0 - ay0) * state.cell * e * dir;
        tileB.px = (ax0 - bx0) * state.cell * e * dir;
        tileB.py = (ay0 - by0) * state.cell * e * dir;

        if (t < 1) requestAnimationFrame(step);
        else {
          tileA.px = tileA.py = 0;
          tileB.px = tileB.py = 0;
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  async function handleSwap(first, second) {
    if (state.busy || !state.running || state.ended) return;
    if (!neighbors(first, second)) return;
    state.busy = true;

    await animateSwap(first, second, false);
    swapTiles(first, second);

    let match = findMatches();
    if (!match) {
      await animateSwap(second, first, false);
      swapTiles(second, first);
      sfxFail();
      vibrate(30);
      state.busy = false;
      return;
    }

    state.comboChain = 0;
    while (match) {
      state.comboChain++;
      processMatch(match);
      await animateFallAndRefill();
      match = findMatches();
    }

    state.selected = null;
    state.busy = false;
  }

  function processMatch(match) {
    const mult = match.maxLen >= 5 ? 3 : match.maxLen >= 4 ? 2 : 1;
    const gain = match.cells.length * BASE_MATCH_SCORE * mult * state.comboChain;
    state.score += gain;

    for (const c of match.cells) {
      spawnBurst(c.row, c.col);
      state.grid[c.row][c.col] = null;
    }

    pushBullet(
      `${MEME_BULLETS[randInt(MEME_BULLETS.length)]}  +${gain}`,
      state.comboChain
    );

    if (state.comboChain > 1 || match.maxLen >= 4) {
      sfxCombo();
      showGif(comboGif, 1350);
      vibrate([20, 40, 30]);
    } else {
      sfxEliminate(state.comboChain);
      vibrate(15);
    }
  }

  async function animateFallAndRefill() {
    const dur = 190;
    const t0 = performance.now();

    for (let c = 0; c < COLS; c++) {
      const compact = [];
      for (let r = ROWS - 1; r >= 0; r--) {
        if (state.grid[r][c]) compact.push(state.grid[r][c]);
      }
      let writeR = ROWS - 1;
      for (let i = 0; i < compact.length; i++) {
        const tile = compact[i];
        const oldR = tile.row;
        tile.row = writeR;
        tile.col = c;
        tile.py = (oldR - writeR) * state.cell;
        state.grid[writeR][c] = tile;
        writeR--;
      }
      while (writeR >= 0) {
        const t = makeTile(randomType(), writeR, c);
        t.py = -(writeR + 1) * state.cell;
        state.grid[writeR][c] = t;
        writeR--;
      }
    }

    return new Promise((resolve) => {
      function step(ts) {
        const t = clamp((ts - t0) / dur, 0, 1);
        const e = 1 - Math.pow(1 - t, 3);
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const tile = state.grid[r][c];
            if (!tile) continue;
            tile.py = tile.py * (1 - e);
          }
        }
        if (t < 1) requestAnimationFrame(step);
        else {
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const tile = state.grid[r][c];
              if (tile) tile.py = 0;
            }
          }
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  // ======== Effects ========
  function pushBullet(text, chain) {
    state.bullets.push({
      text,
      x: state.w + 20,
      y: state.hudH + 30 + randInt(70),
      speed: 80 + randInt(60) + chain * 20,
      life: 2.8,
      color: chain > 1 ? "#ffea00" : "#ffffff"
    });
  }

  function spawnBurst(row, col) {
    const cx = state.boardX + col * state.cell + state.cell / 2;
    const cy = state.boardY + row * state.cell + state.cell / 2;
    const n = 8 + randInt(6);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 160;
      state.particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.45 + Math.random() * 0.35,
        max: 0.8,
        size: 2 + Math.random() * 4,
        color: ["#ffbe0b", "#fb5607", "#ff006e", "#3a86ff"][randInt(4)]
      });
    }
  }

  // ======== Layout ========
  function resize() {
    const rect = canvas.getBoundingClientRect();
    state.w = rect.width;
    state.h = rect.height;
    canvas.width = Math.floor(state.w * state.dpr);
    canvas.height = Math.floor(state.h * state.dpr);
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

    state.hudH = Math.max(110, Math.min(140, state.h * 0.16));
    const maxBoardH = state.h - state.hudH - 18;
    const maxBoardW = state.w - 20;
    state.cell = Math.floor(Math.min(maxBoardW / COLS, maxBoardH / ROWS));
    state.boardW = state.cell * COLS;
    state.boardH = state.cell * ROWS;
    state.boardX = Math.floor((state.w - state.boardW) / 2);
    state.boardY = Math.floor(state.hudH + (maxBoardH - state.boardH) / 2 + 4);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = state.grid?.[r]?.[c];
        if (!t) continue;
        t.x = state.boardX + c * state.cell;
        t.y = state.boardY + r * state.cell;
      }
    }
  }

  const ro = new ResizeObserver(resize);
  ro.observe(document.getElementById("stage"));

  // ======== Input ========
  function pointToCell(x, y) {
    if (
      x < state.boardX || y < state.boardY ||
      x >= state.boardX + state.boardW || y >= state.boardY + state.boardH
    ) return null;
    const col = Math.floor((x - state.boardX) / state.cell);
    const row = Math.floor((y - state.boardY) / state.cell);
    return { row, col };
  }

  function onPress(clientX, clientY) {
    if (!state.running || state.ended || state.busy) return;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const cell = pointToCell(x, y);
    if (!cell) return;

    playSfx("click");

    if (!state.selected) {
      state.selected = cell;
      return;
    }
    const prev = state.selected;
    if (prev.row === cell.row && prev.col === cell.col) {
      state.selected = null;
      return;
    }
    if (Math.abs(prev.row - cell.row) + Math.abs(prev.col - cell.col) === 1) {
      handleSwap(prev, cell);
    } else {
      state.selected = cell;
    }
  }

  canvas.addEventListener("pointerdown", (e) => onPress(e.clientX, e.clientY), { passive: true });

  // ======== Game Loop ========
  function update(dt) {
    if (state.running && !state.ended) {
      state.timeLeft -= dt;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        state.ended = true;
        state.running = false;
        state.busy = true;
        pushBullet(`Time! Final Score: ${state.score}`, 3);
        sfxCombo();
        showGif(comboGif, 1800);
        stopMusic();
        vibrate([60, 30, 60]);
        setTimeout(() => {
          overlayStart.style.display = "grid";
          document.querySelector(".subtitle").innerHTML =
            `Final Score: <b>${state.score}</b><br />Tap Launch Run for a fresh board.`;
          state.busy = false;
        }, 600);
      }
    }

    for (const b of state.bullets) {
      b.x -= b.speed * dt;
      b.life -= dt;
    }
    state.bullets = state.bullets.filter((b) => b.life > 0 && b.x > -320);

    for (const p of state.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 420 * dt;
      p.life -= dt;
    }
    state.particles = state.particles.filter((p) => p.life > 0);
  }

  function drawRoundedRect(x, y, w, h, r, fillStyle, strokeStyle = null, lw = 1) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    if (fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lw;
      ctx.stroke();
    }
  }

  function drawHUD() {
    const pad = 10;
    const barH = 24;
    const fullW = state.w - pad * 2;

    const panelGrad = ctx.createLinearGradient(0, 10, 0, 54);
    panelGrad.addColorStop(0, "rgba(36, 17, 68, 0.92)");
    panelGrad.addColorStop(1, "rgba(17, 8, 37, 0.9)");
    drawRoundedRect(pad, 10, fullW, 44, 13, panelGrad, "rgba(124,246,255,0.28)", 2);
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(pad + 12, 24);
    ctx.lineTo(pad + fullW - 12, 24);
    ctx.stroke();

    ctx.save();
    ctx.shadowColor = "rgba(124, 246, 255, 0.35)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#fff";
    ctx.font = '400 18px "Press Start 2P", monospace';
    ctx.fillText(`SCORE ${state.score}`, pad + 12, 38);
    ctx.restore();

    drawRoundedRect(pad, 62, fullW, barH, 12, "rgba(16,10,34,0.82)", "rgba(124,246,255,0.22)", 2);
    const t = state.timeLeft / GAME_SECONDS;
    const fillW = (fullW - 6) * t;
    const grad = ctx.createLinearGradient(pad, 0, pad + fullW, 0);
    grad.addColorStop(0, "#8ac926");
    grad.addColorStop(0.4, "#7cf6ff");
    grad.addColorStop(0.72, "#ffd56a");
    grad.addColorStop(1, "#ff595e");
    drawRoundedRect(pad + 3, 65, Math.max(0, fillW), barH - 6, 9, grad);
    ctx.fillStyle = "#10002b";
    ctx.font = '400 12px "Press Start 2P", monospace';
    ctx.fillText(`TIME ${Math.ceil(state.timeLeft)}s`, pad + 10, 79);
  }

  function drawBoard() {
    const shellGrad = ctx.createLinearGradient(0, state.boardY, 0, state.boardY + state.boardH);
    shellGrad.addColorStop(0, "rgba(36,17,68,0.88)");
    shellGrad.addColorStop(1, "rgba(10,6,22,0.92)");
    drawRoundedRect(
      state.boardX - 4, state.boardY - 4, state.boardW + 8, state.boardH + 8, 16,
      shellGrad, "rgba(124,246,255,0.2)", 2
    );

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = state.boardX + c * state.cell;
        const y = state.boardY + r * state.cell;
        const isSel = state.selected && state.selected.row === r && state.selected.col === c;

        drawRoundedRect(
          x + 3, y + 3, state.cell - 6, state.cell - 6, 12,
          isSel ? "rgba(124,246,255,0.3)" : "rgba(255,255,255,0.08)",
          isSel ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.06)",
          1
        );

        const tile = state.grid[r][c];
        if (!tile) continue;

        const tx = x + tile.px + 6;
        const ty = y + tile.py + 6;
        const tw = state.cell - 12;
        const th = state.cell - 12;
        const theme = TILE_THEMES[tile.type % TILE_THEMES.length];
        const cardGrad = ctx.createLinearGradient(tx, ty, tx, ty + th);
        cardGrad.addColorStop(0, "rgba(255,255,255,0.18)");
        cardGrad.addColorStop(1, theme.accentSoft);

        drawRoundedRect(tx, ty, tw, th, 10, cardGrad, isSel ? "rgba(255,255,255,0.7)" : theme.accent, isSel ? 3 : 2);

        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = theme.accent;
        ctx.beginPath();
        ctx.arc(tx + tw * 0.5, ty + th * 0.42, Math.min(tw, th) * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (state.images) {
          const img = state.images[tile.type % state.images.length];
          if (img) {
            ctx.save();
            ctx.beginPath();
            drawRoundedRect(tx + 3, ty + 3, tw - 6, th - 6, 9, null);
            ctx.clip();
            ctx.drawImage(img, tx + 3, ty + 5, tw - 6, th - 10);
            ctx.restore();
          }
        } else {
          ctx.fillStyle = theme.accent;
          ctx.beginPath();
          ctx.arc(tx + tw / 2, ty + th / 2, Math.min(tw, th) * 0.34, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.save();
        ctx.font = `400 ${Math.max(20, state.cell * 0.28)}px "Exo 2", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = theme.ring;
        ctx.shadowColor = theme.accent;
        ctx.shadowBlur = 14;
        ctx.fillText(theme.core, tx + tw / 2, ty + th * 0.8);
        ctx.restore();
      }
    }
  }

  function drawEffects() {
    for (const p of state.particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.font = '400 20px "Russo One", sans-serif';
    ctx.textBaseline = "top";
    for (const b of state.bullets) {
      const alpha = clamp(b.life / 2.8, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = b.color;
      ctx.shadowColor = "rgba(0,0,0,0.45)";
      ctx.shadowBlur = 10;
      ctx.fillText(b.text, b.x, b.y);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, state.w, state.h);

    const bgGlow = ctx.createRadialGradient(state.w * 0.5, state.h * 0.1, 10, state.w * 0.5, state.h * 0.1, state.h * 0.9);
    bgGlow.addColorStop(0, "rgba(124,246,255,0.12)");
    bgGlow.addColorStop(0.5, "rgba(140,104,255,0.08)");
    bgGlow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0, 0, state.w, state.h);

    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 16; i++) {
      ctx.fillStyle = i % 2 ? "#7cf6ff" : "#ff78bf";
      const x = (i * 79) % state.w;
      const y = (i * 137) % state.h;
      ctx.fillRect(x, y, 6 + (i % 3) * 4, 6 + ((i + 1) % 3) * 4);
    }
    ctx.globalAlpha = 1;

    drawHUD();
    drawBoard();
    drawEffects();

    if (!state.running && !state.ended && overlayStart.style.display === "none") {
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(0, 0, state.w, state.h);
    }
  }

  function loop(ts) {
    if (!state.lastTs) state.lastTs = ts;
    const dt = Math.min(0.033, (ts - state.lastTs) / 1000);
    state.lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ======== Start/Reset ========
  function resetGame() {
    state.score = 0;
    state.comboChain = 0;
    state.timeLeft = GAME_SECONDS;
    state.selected = null;
    state.bullets = [];
    state.particles = [];
    state.running = true;
    state.ended = false;
    state.busy = false;
    initBoardNoMatches();
    resize();
    pushBullet("Board Live!", 1);
  }

  startBtn.addEventListener("click", async () => {
    await unlockAudio();
    overlayStart.style.display = "none";
    playSfx("start");
    startMusic();
    resetGame();
  });

  // ======== Boot ========
  (async function boot() {
    await loadAssets();
    initBoardNoMatches();
    resize();
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
