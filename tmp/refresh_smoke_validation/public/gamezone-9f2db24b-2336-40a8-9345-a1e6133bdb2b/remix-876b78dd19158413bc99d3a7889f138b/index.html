<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Signal Sweep</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #06111f;
            --bg-mid: #0d2036;
            --bg-grid: rgba(136, 206, 255, 0.08);
            --panel: rgba(7, 18, 33, 0.84);
            --panel-strong: rgba(10, 28, 48, 0.94);
            --line: rgba(134, 207, 255, 0.28);
            --line-strong: rgba(134, 207, 255, 0.55);
            --text-main: #f4fbff;
            --text-soft: #99b9d9;
            --text-dim: rgba(228, 243, 255, 0.52);
            --cyan: #67e8f9;
            --cyan-strong: #22d3ee;
            --violet: #7c8cff;
            --pink: #ff5fb2;
            --amber: #ffd36b;
            --danger: #ff6f83;
            --danger-deep: #8f2437;
            --good: #9af6d4;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.36);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(82, 165, 255, 0.2), transparent 36%),
                linear-gradient(180deg, #102540 0%, var(--bg-deep) 52%, #050b13 100%);
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent 0, transparent calc(100% - 1px), var(--bg-grid) calc(100% - 1px)),
                linear-gradient(transparent 0, transparent calc(100% - 1px), var(--bg-grid) calc(100% - 1px));
            background-size: 34px 34px;
            opacity: 0.55;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 24%, transparent 76%, rgba(0,0,0,0.2));
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        .font-display {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        .font-ui {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* [agent-note][stage4] repaired: mobile-tap-risk | element: canvas/ui buttons | action: kept gesture suppression on canvas only so menu/start taps keep native activation */
        #gameCanvas {
            touch-action: none;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 18% 16%, rgba(103, 232, 249, 0.18), transparent 18%),
                radial-gradient(circle at 82% 12%, rgba(255, 95, 178, 0.14), transparent 16%),
                radial-gradient(circle at 50% 82%, rgba(124, 140, 255, 0.12), transparent 24%);
        }

        #game-container::after {
            inset: 14px;
            border: 1px solid rgba(140, 213, 255, 0.08);
            border-radius: 24px;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: max(14px, env(safe-area-inset-top));
            padding-right: max(14px, env(safe-area-inset-right));
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            padding: 8px;
        }

        .hud-cluster {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .hud-cluster.end {
            align-items: flex-end;
        }

        .hud-card {
            min-width: 104px;
            padding: 12px 14px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(13, 30, 48, 0.95), rgba(7, 18, 31, 0.9));
            border: 1px solid var(--line);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .score-value,
        .combo-value,
        .final-score-value,
        .heading-primary,
        .heading-secondary {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        .score-value {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-shadow: 0 0 18px rgba(103, 232, 249, 0.22);
        }

        .hud-label {
            margin-top: 4px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            color: var(--text-soft);
        }

        .lives-shell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            min-width: 104px;
            padding: 12px 14px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(40, 15, 32, 0.88), rgba(21, 8, 18, 0.88));
            border: 1px solid rgba(255, 125, 169, 0.3);
            box-shadow: var(--shadow);
            text-shadow: 0 0 16px rgba(255, 95, 178, 0.22);
        }

        #lives-display {
            font-size: clamp(1.35rem, 4vw, 1.8rem);
            letter-spacing: 0.14em;
        }

        #combo-container {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .combo-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 88px;
            min-height: 44px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 211, 107, 0.16);
            border: 1px solid rgba(255, 211, 107, 0.36);
            box-shadow: inset 0 0 18px rgba(255, 211, 107, 0.12);
        }

        .combo-value {
            font-size: clamp(1.2rem, 4vw, 1.65rem);
            font-weight: 700;
            color: var(--amber);
            text-shadow: 0 0 12px rgba(255, 211, 107, 0.28);
        }

        #fever-container {
            width: 100%;
            padding: 0 8px 8px;
            margin-bottom: 8px;
        }

        .meter-shell {
            position: relative;
            width: 100%;
            height: 16px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(4, 10, 20, 0.88);
            border: 1px solid rgba(118, 154, 203, 0.4);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 10px 28px rgba(0,0,0,0.28);
        }

        .meter-shell::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(255,255,255,0.04), transparent);
        }

        #fever-fill {
            position: relative;
            z-index: 1;
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--cyan-strong), var(--violet), var(--pink));
            box-shadow: 0 0 18px rgba(103, 232, 249, 0.35);
            transition: width 0.2s ease;
        }

        .meter-label {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: rgba(244, 251, 255, 0.82);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        .screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            pointer-events: auto;
        }

        .start-screen {
            background: rgba(2, 10, 19, 0.58);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .game-over-screen {
            background: rgba(58, 8, 20, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .panel {
            position: relative;
            width: min(100%, 360px);
            max-height: min(90vh, 720px);
            overflow-y: auto;
            padding: 22px 20px 20px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, rgba(11, 29, 46, 0.97), rgba(7, 17, 30, 0.96));
            border: 1px solid var(--line);
            box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.03) inset;
            text-align: center;
        }

        .panel::-webkit-scrollbar {
            width: 8px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: rgba(139, 184, 222, 0.24);
            border-radius: 999px;
        }

        .panel-accent {
            position: absolute;
            inset: 0 0 auto 0;
            height: 4px;
            border-radius: 28px 28px 0 0;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
        }

        .hero-badge {
            position: relative;
            display: inline-grid;
            place-items: center;
            width: 112px;
            height: 112px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(103, 232, 249, 0.25), rgba(23, 42, 76, 0.9));
            border: 1px solid rgba(133, 219, 255, 0.24);
            box-shadow: 0 0 30px rgba(103, 232, 249, 0.16);
        }

        .hero-avatar {
            position: relative;
            font-size: 3.6rem;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));
            animation: orbitPulse 2.3s ease-in-out infinite;
        }

        .hero-avatar::after {
            content: "◌";
            position: absolute;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%) scale(1.75);
            font-size: 3rem;
            color: rgba(103, 232, 249, 0.3);
            pointer-events: none;
        }

        .hero-spark {
            position: absolute;
            top: 12px;
            right: 12px;
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: #fff5b5;
            background: rgba(255, 211, 107, 0.16);
            box-shadow: 0 0 18px rgba(255, 211, 107, 0.24);
            animation: sparkOrbit 1.8s ease-in-out infinite;
        }

        .heading-primary {
            margin: 0;
            font-size: clamp(2rem, 8vw, 2.7rem);
            line-height: 0.95;
            letter-spacing: 0.1em;
            font-weight: 700;
            text-shadow: 0 0 18px rgba(103, 232, 249, 0.22);
        }

        .heading-secondary {
            margin: 6px 0 18px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.38em;
            color: var(--pink);
            text-transform: uppercase;
        }

        .intro-copy,
        .footer-copy,
        .status-copy,
        .score-caption {
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .intro-copy {
            margin: 0 0 16px;
            color: var(--text-soft);
        }

        .mode-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mode-button,
        .primary-button,
        .text-button {
            pointer-events: auto;
            border: 0;
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mode-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(14, 28, 46, 0.96), rgba(9, 18, 30, 0.96));
            border: 1px solid rgba(121, 164, 219, 0.2);
            color: var(--text-main);
            text-align: left;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        .mode-button:active,
        .primary-button:active {
            transform: scale(0.97);
        }

        .mode-button:hover,
        .primary-button:hover,
        .text-button:hover {
            filter: brightness(1.05);
        }

        .mode-button.standard:hover {
            border-color: rgba(103, 232, 249, 0.45);
            box-shadow: 0 0 20px rgba(103, 232, 249, 0.12);
        }

        .mode-button.intense {
            background: linear-gradient(90deg, rgba(39, 89, 145, 0.95), rgba(140, 46, 117, 0.96));
            border-color: rgba(255, 163, 211, 0.34);
            box-shadow: 0 12px 28px rgba(111, 35, 92, 0.28);
        }

        .mode-button.intense:hover {
            box-shadow: 0 16px 36px rgba(111, 35, 92, 0.34);
        }

        .mode-copy {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .mode-copy small {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: rgba(233, 244, 255, 0.7);
        }

        .mode-copy strong {
            font-size: 1.02rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .mode-icon {
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.08);
        }

        .footer-copy {
            margin: 16px 0 0;
            color: var(--text-dim);
        }

        .status-copy {
            margin: 0 0 18px;
            color: #ffb7c6;
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .score-panel {
            margin-bottom: 20px;
            padding: 14px 14px 16px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .score-caption {
            color: rgba(244, 251, 255, 0.62);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .final-score-value {
            margin-top: 8px;
            font-size: clamp(2.4rem, 9vw, 3.3rem);
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(103, 232, 249, 0.14);
        }

        .primary-button {
            width: 100%;
            padding: 14px 18px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ffffff, #dff6ff);
            color: var(--danger-deep);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: 0 12px 24px rgba(255,255,255,0.12);
        }

        .text-button {
            margin-top: 14px;
            background: transparent;
            color: rgba(255,255,255,0.72);
            font-size: 0.88rem;
            text-decoration: underline;
        }

        #floating-text-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .shake-ui {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .pulse-flare {
            animation: pulseFlare 1s ease-in-out infinite;
        }

        #feedback-gif-layer {
            position: absolute;
            right: max(14px, env(safe-area-inset-right));
            bottom: calc(max(14px, env(safe-area-inset-bottom)) + 84px);
            z-index: 35;
            width: min(34vw, 120px);
            pointer-events: none;
            display: flex;
            justify-content: flex-end;
        }

        .feedback-gif {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
            background: rgba(4, 10, 20, 0.58);
        }

        .feedback-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        @keyframes pulseFlare {
            0%, 100% {
                filter: saturate(1);
                box-shadow: 0 0 16px rgba(255, 95, 178, 0.25);
            }
            50% {
                filter: saturate(1.2);
                box-shadow: 0 0 24px rgba(255, 95, 178, 0.4);
            }
        }

        @keyframes orbitPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.04); }
        }

        @keyframes sparkOrbit {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.86; }
            50% { transform: translateY(-4px) scale(1.08); opacity: 1; }
        }

        @media (max-width: 640px) {
            #hud {
                padding: 4px;
                gap: 10px;
            }

            .hud-card,
            .lives-shell {
                min-width: 88px;
                padding: 10px 12px;
                border-radius: 16px;
            }

            #fever-container {
                padding: 0 4px 6px;
                margin-bottom: 4px;
            }

            .panel {
                width: min(100%, 340px);
                padding: 20px 16px 18px;
                border-radius: 24px;
            }

            .heading-secondary {
                font-size: 0.88rem;
                letter-spacing: 0.28em;
            }

            .footer-copy,
            .intro-copy,
            .status-copy,
            .score-caption {
                font-size: 0.84rem;
            }

            .mode-button {
                padding: 12px 14px;
                border-radius: 16px;
            }

            .mode-copy strong {
                font-size: 0.96rem;
            }

            .mode-icon {
                width: 38px;
                height: 38px;
                font-size: 1.35rem;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, styling upgraded without shifting control zones -->
            <div id="hud" class="hidden">
                <div class="hud-cluster">
                    <div class="hud-card">
                        <div class="score-value"><span id="score">0</span></div>
                        <div class="hud-label">Signal</div>
                    </div>
                </div>

                <div class="hud-cluster end">
                    <div class="lives-shell">
                        <div id="lives-display">❤️❤️❤️</div>
                    </div>
                    <div id="combo-container">
                        <div class="combo-chip">
                            <span id="combo-count" class="combo-value">x0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="fever-container" class="hidden">
                <div class="meter-shell">
                    <div id="fever-fill"></div>
                    <div class="meter-label">Boost Meter</div>
                </div>
            </div>

            <div id="start-screen" class="screen start-screen">
                <div class="panel">
                    <div class="panel-accent"></div>
                    <div class="hero-badge" aria-hidden="true">
                        <div class="hero-avatar">🎧</div>
                        <div class="hero-spark">⚡</div>
                    </div>
                    <h1 class="heading-primary">SIGNAL</h1>
                    <h2 class="heading-secondary">SWEEP</h2>

                    <p class="intro-copy">Pilot the smiling scout beacon, sweep up bright signals, and dodge the jagged static storm.</p>

                    <div class="mode-list">
                        <button id="btn-normal" class="mode-button standard">
                            <span class="mode-copy">
                                <small>Standard</small>
                                <strong>Calm Sweep</strong>
                            </span>
                            <span class="mode-icon" aria-hidden="true">📡</span>
                        </button>

                        <button id="btn-hype" class="mode-button intense">
                            <span class="mode-copy">
                                <small>Intense</small>
                                <strong>Surge Sweep</strong>
                            </span>
                            <span class="mode-icon" aria-hidden="true">⚡</span>
                        </button>
                    </div>

                    <p class="footer-copy">Drag to collect signals • Avoid static • Fill Boost</p>
                </div>
            </div>

            <div id="game-over-screen" class="screen game-over-screen hidden">
                <div class="panel">
                    <div class="panel-accent"></div>
                    <h2 class="heading-primary">STATIC STORM</h2>
                    <p class="status-copy">Signal Link Collapsed</p>

                    <div class="score-panel">
                        <div class="score-caption">Recovered Signals</div>
                        <div class="final-score-value"><span id="finalScore">0</span></div>
                    </div>

                    <button id="restart-btn" class="primary-button">Sweep Again</button>
                    <button id="menu-btn" class="text-button">Back to Menu</button>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: collect/fail feedback overlays -> catalogs/gifs.json | keep off playfield center -->
            <div id="feedback-gif-layer" aria-hidden="true">
                <img id="gif-success" class="feedback-gif" alt="" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp">
                <img id="gif-fail" class="feedback-gif" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
            </div>

            <div id="floating-text-layer"></div>
        </div>
    </div>

    <script>
    /**
     * SIGNAL SWEEP
     * A single-file HTML5 casual game.
     *
     * Core Logic:
     * - Canvas rendering loop
     * - Touch-based input
     * - Dynamic audio rate control for "Fever" and "Hype" modes
     */

     const ASSETS = {
         bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
         sfx: {
             collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
             combo: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
             fever: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
             fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
             gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
             start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
             menu: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3"
         },
         gifs: {
             success: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
             fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
         }
     };

    const ENABLE_ANIMATIONS = true;
    const PALETTE = {
        bg: '#06111f',
        lane: '#12243d',
        laneBright: '#1f3b61',
        playerCore: '#89f7ff',
        playerShell: '#3aa8ff',
        playerFever: '#ff8dce',
        playerShadow: '#67e8f9',
        danger: '#ff6f83',
        dangerDark: '#6e1123',
        note: '#8dd6ff',
        noteCore: '#f2feff',
        sparkle: '#ffd36b',
        text: '#f4fbff'
    };

    /* --- AUDIO SYSTEM --- */
     class AudioSystem {
         constructor() {
             this.bgm = new Audio(ASSETS.bgm);
             this.bgm.loop = true;
             this.bgm.preload = 'auto';
             this.bgm.volume = 0.2;
             this.baseRate = 1.0;
             this.enabled = false;
             this.ready = false;
             this.lastPlayed = new Map();
             this.cooldowns = {
                 collect: 70,
                 combo: 120,
                 fever: 260,
                 fail: 180,
                 gameOver: 500,
                 start: 180,
                 menu: 180
             };

             this.sfx = {};
             for (const [key, url] of Object.entries(ASSETS.sfx)) {
                 const sound = new Audio(url);
                 sound.preload = 'auto';
                 sound.volume = ({
                     collect: 0.42,
                     combo: 0.5,
                     fever: 0.56,
                     fail: 0.52,
                     gameOver: 0.62,
                     start: 0.48,
                     menu: 0.4
                 })[key] ?? 0.45;
                 this.sfx[key] = sound;
             }

             this.ctx = new (window.AudioContext || window.webkitAudioContext)();
         }

         unlock() {
             this.enabled = true;
             if (this.ctx?.state === 'suspended') {
                 this.ctx.resume().catch(() => {});
             }
         }

         playBGM(mode = 'normal') {
             this.unlock();
             this.baseRate = mode === 'hype' ? 1.1 : 1.0;
             this.bgm.playbackRate = this.baseRate;
             this.bgm.currentTime = 0;
             this.bgm.play().then(() => {
                 this.ready = true;
             }).catch(() => {});
         }

         setFever(active) {
             const targetRate = active ? this.baseRate + 0.16 : this.baseRate;
             this.bgm.playbackRate = targetRate;
         }

         stopBGM() {
             this.bgm.pause();
             this.bgm.currentTime = 0;
         }

         playSFX(key) {
             if (!this.enabled || !this.sfx[key]) return;
             const now = performance.now();
             const cooldown = this.cooldowns[key] ?? 0;
             if (now - (this.lastPlayed.get(key) ?? 0) < cooldown) return;
             this.lastPlayed.set(key, now);

             const source = this.sfx[key];
             source.pause();
             source.currentTime = 0;
             source.play().catch(() => {});
         }
     }

    /* --- GAME ENGINE --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
     const audio = new AudioSystem();
     const feedbackGifLayer = document.getElementById('feedback-gif-layer');
     const feedbackGifs = {
         success: document.getElementById('gif-success'),
         fail: document.getElementById('gif-fail')
     };
     let feedbackGifTimer = null;

     function showFeedbackGif(type) {
         const target = feedbackGifs[type];
         if (!target) return;

         clearTimeout(feedbackGifTimer);
         Object.values(feedbackGifs).forEach(img => img.classList.remove('active'));
         feedbackGifLayer.classList.remove('hidden');
         target.classList.add('active');

         feedbackGifTimer = setTimeout(() => {
             target.classList.remove('active');
         }, type === 'success' ? 850 : 1050);
     }

     let state = {
        active: false,
        width: 0,
        height: 0,
        score: 0,
        lives: 3,
        combo: 0,
        fever: 0,
        feverActive: false,
        gameMode: 'normal',
        frameCount: 0,
        shake: 0
    };

    let player = { x: 0, y: 0, r: 30, trail: [] };
    let notes = [];
    let particles = [];
    let backgroundBars = [];

    let inputX = 0;

    function resize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = state.width;
        canvas.height = state.height;
        player.y = state.height - 120;

        if (backgroundBars.length === 0) {
            const count = 15;
            const w = state.width / count;
            for (let i = 0; i < count; i++) {
                backgroundBars.push({
                    x: i * w,
                    w: w - 2,
                    h: 10,
                    targetH: 50,
                    color: `hsl(${i * 18 + 190}, 75%, 56%)`
                });
            }
        }
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 100));

    function handleInput(x) {
        if (!state.active) return;
        inputX = x;
    }

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        handleInput(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        handleInput(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('mousemove', e => {
        if (e.buttons === 1) handleInput(e.clientX);
    });

    canvas.addEventListener('mousedown', e => handleInput(e.clientX));

    function createExplosion(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 1.0,
                color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function spawnFloatingText(text, x, y, color) {
        const el = document.createElement('div');
        el.textContent = text;
        el.style.position = 'absolute';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.color = color;
        el.style.fontWeight = '700';
        el.style.fontSize = '24px';
        el.style.letterSpacing = '0.06em';
        el.style.textShadow = '0 0 8px rgba(0,0,0,0.45)';
        el.style.pointerEvents = 'none';
        el.style.transition = 'all 0.8s ease-out';
        el.style.transform = 'translate(-50%, -50%)';
         el.style.fontFamily = "'Orbitron', 'Exo 2', sans-serif";

        document.getElementById('floating-text-layer').appendChild(el);

        requestAnimationFrame(() => {
            el.style.top = (y - 100) + 'px';
            el.style.opacity = '0';
        });

        setTimeout(() => el.remove(), 800);
    }

    function triggerShake(intensity) {
        state.shake = intensity;
    }

    function startGame(mode) {
        state.active = true;
        state.score = 0;
        state.lives = 3;
        state.combo = 0;
        state.fever = 0;
        state.feverActive = false;
        state.gameMode = mode;
        state.frameCount = 0;
        state.shake = 0;

        notes = [];
        particles = [];
        player.trail = [];
        inputX = state.width / 2;
        player.x = inputX;

         document.getElementById('start-screen').classList.add('hidden');
         document.getElementById('game-over-screen').classList.add('hidden');
         document.getElementById('hud').classList.remove('hidden');
         document.getElementById('fever-container').classList.remove('hidden');
         updateUI();

         audio.playSFX('start');
         audio.playBGM(mode);
        resize();
        requestAnimationFrame(loop);
    }

    function updateUI() {
        document.getElementById('score').innerText = state.score;
        document.getElementById('lives-display').innerText = "❤️".repeat(state.lives);

        const comboEl = document.getElementById('combo-container');
        const comboCount = document.getElementById('combo-count');
        if (state.combo > 1) {
            comboEl.classList.remove('hidden');
            comboEl.style.opacity = '1';
            comboCount.innerText = "x" + state.combo;
            comboCount.style.transform = `scale(${1 + Math.min(state.combo * 0.05, 0.5)})`;
        } else {
            comboEl.style.opacity = '0';
        }

        const feverFill = document.getElementById('fever-fill');
        if (state.feverActive) {
            feverFill.style.width = '100%';
            feverFill.classList.add('pulse-flare');
            feverFill.style.background = 'linear-gradient(90deg, #ffd36b, #ff90d0, #ff5fb2)';
        } else {
            feverFill.style.width = state.fever + '%';
            feverFill.classList.remove('pulse-flare');
            feverFill.style.background = 'linear-gradient(90deg, #22d3ee, #7c8cff, #ff5fb2)';
        }
    }

     function gameOver() {
         state.active = false;
         audio.playSFX('gameOver');
         audio.stopBGM();
         showFeedbackGif('fail');
         document.getElementById('hud').classList.add('hidden');
         document.getElementById('fever-container').classList.add('hidden');
         document.getElementById('game-over-screen').classList.remove('hidden');
         document.getElementById('finalScore').innerText = state.score;
     }

    function spawnNote() {
        let rate = 60;
        if (state.gameMode === 'hype') rate = 40;
        if (state.feverActive) rate = 20;

        rate = Math.max(15, rate - Math.floor(state.score / 50));

        if (state.frameCount % rate === 0) {
            const isBad = Math.random() > 0.75;
            const size = isBad ? 25 : 15;
            notes.push({
                x: Math.random() * (state.width - 40) + 20,
                y: -50,
                type: isBad ? 'bad' : 'good',
                radius: size,
                speed: (state.feverActive ? 10 : 5) + (Math.random() * 2) + (state.score * 0.01),
                angle: 0,
                spin: (Math.random() - 0.5) * 0.2
            });
        }
    }

    function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, state.height);
        gradient.addColorStop(0, '#102540');
        gradient.addColorStop(0.55, PALETTE.bg);
        gradient.addColorStop(1, '#040912');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, state.width, state.height);

        ctx.save();
        ctx.globalAlpha = 0.4;
        for (let i = 0; i < 8; i++) {
            const radius = 80 + i * 45 + Math.sin((state.frameCount + i * 10) * 0.02) * 6;
            ctx.beginPath();
            ctx.arc(state.width * 0.5, state.height * 0.25, radius, Math.PI * 1.08, Math.PI * 1.92);
            ctx.strokeStyle = i % 2 === 0 ? 'rgba(103, 232, 249, 0.08)' : 'rgba(255, 95, 178, 0.06)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        ctx.restore();

        backgroundBars.forEach((bar, index) => {
            const tone = state.feverActive
                ? `hsla(${(state.frameCount * 5 + index * 20) % 360}, 90%, 66%, 0.24)`
                : `rgba(${index % 2 === 0 ? '103, 232, 249' : '124, 140, 255'}, 0.12)`;
            ctx.fillStyle = tone;
            ctx.fillRect(bar.x, state.height - bar.h, bar.w, bar.h);

            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(bar.x, state.height - bar.h, bar.w, 3);
        });
    }

    function drawPlayer() {
        player.trail.forEach((t, index) => {
            ctx.beginPath();
            ctx.arc(t.x, t.y, player.r * (0.64 + index * 0.02), 0, Math.PI * 2);
            ctx.fillStyle = state.feverActive ? '#ff90d0' : '#4aa6ff';
            ctx.globalAlpha = t.alpha * 0.34;
            ctx.fill();
            t.alpha -= 0.05;
        });
        ctx.globalAlpha = 1;

        const bob = Math.sin(state.frameCount * 0.08) * 2;
        const coreColor = state.feverActive ? PALETTE.playerFever : PALETTE.playerCore;
        const shellColor = state.feverActive ? '#ffd4eb' : PALETTE.playerShell;

        ctx.save();
        ctx.translate(player.x, player.y + bob);

        ctx.shadowBlur = 22;
        ctx.shadowColor = state.feverActive ? 'rgba(255, 95, 178, 0.6)' : 'rgba(103, 232, 249, 0.48)';

        const shellGradient = ctx.createRadialGradient(-10, -14, 4, 0, 0, player.r + 10);
        shellGradient.addColorStop(0, '#ffffff');
        shellGradient.addColorStop(0.3, coreColor);
        shellGradient.addColorStop(1, shellColor);

        ctx.fillStyle = shellGradient;
        ctx.beginPath();
        ctx.arc(0, 0, player.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 4;
        ctx.strokeStyle = state.feverActive ? '#5c1130' : '#113058';
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 4, Math.PI, 0);
        ctx.stroke();

        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(-(player.r + 3), 1, 7, 0, Math.PI * 2);
        ctx.arc(player.r + 3, 1, 7, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.26)';
        ctx.beginPath();
        ctx.arc(-10, -10, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = state.feverActive ? '#4d0f26' : '#0e2340';
        const blink = state.frameCount % 150 < 10;
        if (!blink) {
            ctx.beginPath();
            ctx.arc(-8, -3, 3, 0, Math.PI * 2);
            ctx.arc(8, -3, 3, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillRect(-11, -3, 6, 2);
            ctx.fillRect(5, -3, 6, 2);
        }

        ctx.strokeStyle = state.feverActive ? '#4d0f26' : '#0e2340';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (state.feverActive) {
            ctx.arc(0, 9, 6, 0, Math.PI * 2);
        } else {
            ctx.arc(0, 5, 8, 0.08 * Math.PI, 0.92 * Math.PI);
        }
        ctx.stroke();

        ctx.strokeStyle = state.feverActive ? 'rgba(255, 211, 107, 0.9)' : 'rgba(103, 232, 249, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 10 + Math.sin(state.frameCount * 0.07) * 1.5, Math.PI * 1.06, Math.PI * 1.94);
        ctx.stroke();

        ctx.restore();
    }

    function drawGoodNote(n) {
        ctx.shadowBlur = 16;
        ctx.shadowColor = 'rgba(141, 214, 255, 0.7)';
        const goodGradient = ctx.createRadialGradient(-4, -6, 3, 0, 0, n.radius + 8);
        goodGradient.addColorStop(0, PALETTE.noteCore);
        goodGradient.addColorStop(0.45, PALETTE.note);
        goodGradient.addColorStop(1, '#3967d8');

        ctx.fillStyle = goodGradient;
        ctx.beginPath();
        ctx.arc(0, 0, n.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.48)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, n.radius - 2, 0.2, Math.PI * 1.8);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-4, -5, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0a1e37';
        ctx.beginPath();
        ctx.arc(0, 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = PALETTE.sparkle;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(n.radius - 4, -n.radius + 2);
        ctx.lineTo(n.radius + 4, -n.radius - 6);
        ctx.moveTo(n.radius + 4, -n.radius + 2);
        ctx.lineTo(n.radius - 4, -n.radius - 6);
        ctx.stroke();
    }

    function drawBadNote(n) {
        ctx.shadowBlur = 18;
        ctx.shadowColor = 'rgba(255, 111, 131, 0.55)';
        ctx.fillStyle = PALETTE.dangerDark;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i;
            const radius = i % 2 === 0 ? n.radius : n.radius * 0.52;
            const px = Math.cos(angle) * radius;
            const py = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = PALETTE.danger;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffd2d8';
        ctx.beginPath();
        ctx.arc(0, 0, n.radius * 0.38, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#450814';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-7, -6);
        ctx.lineTo(-2, -1);
        ctx.moveTo(-2, -6);
        ctx.lineTo(-7, -1);
        ctx.moveTo(2, -6);
        ctx.lineTo(7, -1);
        ctx.moveTo(7, -6);
        ctx.lineTo(2, -1);
        ctx.moveTo(-7, 7);
        ctx.lineTo(7, 7);
        ctx.stroke();
    }

    function loop() {
        if (!state.active) return;

        state.frameCount++;

        if (state.shake > 0) state.shake *= 0.9;
        if (state.shake < 0.5) state.shake = 0;

        player.x += (inputX - player.x) * 0.2;

        if (state.frameCount % 3 === 0) {
            player.trail.push({ x: player.x, y: player.y, alpha: 0.6 });
            if (player.trail.length > 8) player.trail.shift();
        }

        if (state.feverActive) {
            state.fever -= 0.5;
            if (state.fever <= 0) {
                state.feverActive = false;
                audio.setFever(false);
            }
        }

        backgroundBars.forEach(bar => {
            bar.targetH = (Math.random() * state.height * 0.4) + (state.feverActive ? 100 : 0);
            bar.h += (bar.targetH - bar.h) * 0.1;
        });

        spawnNote();

        drawBackground();

        ctx.save();
        if (state.shake > 0) {
            const dx = (Math.random() - 0.5) * state.shake;
            const dy = (Math.random() - 0.5) * state.shake;
            ctx.translate(dx, dy);
        }

        drawPlayer();

        for (let i = notes.length - 1; i >= 0; i--) {
            let n = notes[i];
            n.y += n.speed;
            n.angle += n.spin;

            ctx.save();
            ctx.translate(n.x, n.y);
            ctx.rotate(n.angle);

            if (n.type === 'good') {
                drawGoodNote(n);
            } else {
                drawBadNote(n);
            }
            ctx.restore();

            const dist = Math.hypot(n.x - player.x, n.y - player.y);
            if (dist < player.r + n.radius) {
                if (n.type === 'good') {
                    const points = state.feverActive ? 2 : 1;
                    state.score += points;
                    state.combo++;

                     if (!state.feverActive) {
                         state.fever += 10;
                         if (state.fever >= 100) {
                             state.fever = 100;
                             state.feverActive = true;
                             audio.setFever(true);
                             audio.playSFX('fever');
                             triggerShake(10);
                             showFeedbackGif('success');
                             spawnFloatingText("BOOST!", player.x, player.y - 50, '#ffb8df');
                         }
                     }

                     audio.playSFX(state.combo >= 4 ? 'combo' : 'collect');
                     if (state.combo >= 4 || state.feverActive) {
                         showFeedbackGif('success');
                     }
                     createExplosion(n.x, n.y, '#8dd6ff', 5);
                     spawnFloatingText("+" + points, n.x, n.y, '#ffffff');
                } else {
                    state.lives--;
                    state.combo = 0;
                     state.fever = 0;
                     state.feverActive = false;
                     audio.setFever(false);
                     triggerShake(20);
                     audio.playSFX('fail');
                     showFeedbackGif('fail');
                     createExplosion(n.x, n.y, '#ff6f83', 15);
                     spawnFloatingText("STATIC!", n.x, n.y, '#ff6f83');

                    if (state.lives <= 0) {
                        gameOver();
                    }
                }
                updateUI();
                notes.splice(i, 1);
            } else if (n.y > state.height + 50) {
                if (n.type === 'good') {
                    state.combo = 0;
                    updateUI();
                }
                notes.splice(i, 1);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;

            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();

            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        requestAnimationFrame(loop);
    }

     function enableAudioFromGesture() {
         audio.unlock();
         window.removeEventListener('pointerdown', enableAudioFromGesture);
         window.removeEventListener('keydown', enableAudioFromGesture);
     }

     window.addEventListener('pointerdown', enableAudioFromGesture, { once: true });
     window.addEventListener('keydown', enableAudioFromGesture, { once: true });

     document.getElementById('btn-normal').addEventListener('click', () => startGame('normal'));
     document.getElementById('btn-hype').addEventListener('click', () => startGame('hype'));

     document.getElementById('restart-btn').addEventListener('click', () => startGame(state.gameMode));
     document.getElementById('menu-btn').addEventListener('click', () => {
         audio.playSFX('menu');
         document.getElementById('game-over-screen').classList.add('hidden');
         document.getElementById('start-screen').classList.remove('hidden');
         resize();
     });

    resize();
    </script>
