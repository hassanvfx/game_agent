<script>
/**
 * §4 Iron Laws & Technical Implementation
 */

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.isMuted = false;
        this.initialized = false;
        this.masterGain = null;
        this.musicGain = null;
        this.sfxGain = null;
        this.lastPlayedAt = {};
    }

    init() {
        if (this.initialized) {
            this.resumeContext();
            this.playBgm();
            return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.musicGain = this.ctx.createGain();
        this.sfxGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.88;
        this.musicGain.gain.value = 0.32;
        this.sfxGain.gain.value = 0.72;
        this.musicGain.connect(this.masterGain);
        this.sfxGain.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);

        const unlock = () => {
            this.resumeContext();
            this.playBgm();
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };
        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock);

        this.loadSound('catch', document.getElementById('sfx_catch').src, 'beep');
        this.loadSound('fail', document.getElementById('sfx_fail').src, 'explosion');
        this.loadSound('bonus', document.getElementById('sfx_bonus').src, 'sparkle');
        this.loadSound('ui', document.getElementById('sfx_ui').src, 'click');
        this.initialized = true;
    }

    resumeContext() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    }

    async loadSound(id, url, fallbackType) {
        try {
            const soundUrl = new URL(url, window.location.href);
            if (soundUrl.origin !== window.location.origin) {
                this.buffers[id] = { fallback: fallbackType, remoteOnly: true };
                return;
            }

            const response = await fetch(soundUrl.href);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
            this.buffers[id] = { buffer: audioBuffer, fallback: fallbackType };
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using fallback.`);
            this.buffers[id] = { fallback: fallbackType, error: true };
        }
    }

    playBgm() {
        const bgmEl = document.getElementById('bgm_main');
        if (!bgmEl || this.isMuted) return;
        bgmEl.volume = 0.22;
        if (bgmEl.paused) {
            bgmEl.play().catch(() => {});
        }
    }

    pauseBgm() {
        const bgmEl = document.getElementById('bgm_main');
        if (bgmEl && !bgmEl.paused) bgmEl.pause();
    }

    playSfx(id, options = {}) {
        if (!this.ctx || this.isMuted) return;
        this.resumeContext();

        const now = performance.now();
        const minInterval = options.minInterval ?? 90;
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < minInterval) return;
        this.lastPlayedAt[id] = now;

        const bufferData = this.buffers[id];
        if (bufferData && bufferData.buffer) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = bufferData.buffer;
            gain.gain.value = options.volume ?? 0.9;
            source.connect(gain);
            gain.connect(this.sfxGain);
            source.start(0);
        } else if (bufferData) {
            this.synthesize(bufferData.fallback, options.volume ?? 0.8);
        }
    }

    synthesize(type, volume = 0.8) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.sfxGain);

        if (type === 'beep') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.22 * volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(340, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15 * volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.07);
        } else if (type === 'sparkle') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(720, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1240, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.18 * volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.16);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.28 * volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        }
    }
}

// --- Game Configuration ---
window.gameConfigDefs = {
    heroSpeed: { type: "number", label: "Plate Speed", value: 15, min: 5, max: 30 },
    spawnRate: { type: "number", label: "Spawn Rate (ms)", value: 1200, min: 300, max: 2000 },
    gravity: { type: "number", label: "Gravity", value: 400, min: 100, max: 1000 }, // px/sec^2
    themeColor: { type: "color", label: "Theme Color", value: "#FF6F00" }
};

window.gameConfig = {};
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'themeColor') {
            document.querySelectorAll('.btn').forEach(b => b.style.backgroundColor = val);
            // Re-render handled in loop
        }
    }
};

// Initialize Config
Object.keys(window.gameConfigDefs).forEach(k => {
    window.gameConfig[k] = window.gameConfigDefs[k].value;
});

// --- Game Logic ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audioManager = new AudioManager();

    // Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const comboGif = document.getElementById('combo-gif');
    const failGif = document.getElementById('fail-gif');

    const PAL = {
        skyTop: '#331a63',
        skyBottom: '#12051f',
        cloud: 'rgba(255, 233, 196, 0.08)',
        star: '#fff2b8',
        glow: 'rgba(255, 178, 71, 0.18)',
        playerGlow: 'rgba(255, 196, 110, 0.34)',
        pattyMain: '#7f3f1f',
        pattyShadow: '#4d230f',
        pattyHighlight: '#b56532',
        cheeseMain: '#ffcf33',
        cheeseShadow: '#ff9f1c',
        lettuceMain: '#72d86f',
        lettuceShadow: '#338f4f',
        tomatoMain: '#ff5c5c',
        tomatoShadow: '#c92f47',
        bunMain: '#ffbd69',
        bunShadow: '#e1803f',
        bunSeed: '#fff3d2',
        rottenMain: '#7e4df8',
        rottenShadow: '#36206d',
        uiGlow: '#ffbe56'
    };

    // State
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let lastTime = 0;
    let score = 0;
    let particles = [];
    let ingredients = [];
    let stack = [];
    let spawnTimer = 0;
    let cameraY = 0;
    let shake = 0;
    let bestScore = 0;
    let feedbackTimers = { combo: null, fail: null };
    
    // Player
    const player = {
        x: 0,
        targetX: 0,
        width: 100,
        height: 30,
        y: 0, // Set on resize
        squish: 1.0
    };

    // Ingredient Types
    const TYPES = ['patty', 'cheese', 'lettuce', 'tomato', 'bun_top'];
    const BAD_TYPES = ['rotten'];

    // Input Handling
    let isPointerDown = false;

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        player.y = window.innerHeight - 100;
        if (gameState === 'MENU') {
            player.x = window.innerWidth / 2;
            player.targetX = player.x;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Events
    const handleInput = (e) => {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        player.targetX = clientX - rect.left;
        isPointerDown = true;
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        if (isPointerDown) handleInput(e);
    }, { passive: false });

    const endInput = (e) => {
        isPointerDown = false;
    };
    canvas.addEventListener('pointerup', endInput);
    canvas.addEventListener('pointercancel', endInput);

    // Game Loop
    function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        if (gameState !== 'PLAYING') return;

        // Player Movement (Lerp)
        const lerpSpeed = window.gameConfig.heroSpeed;
        player.x += (player.targetX - player.x) * Math.min(1, lerpSpeed * dt);
        
        // Clamp player
        player.x = Math.max(player.width/2, Math.min(window.innerWidth - player.width/2, player.x));

        // Spawn Ingredients
        spawnTimer -= dt * 1000;
        if (spawnTimer <= 0) {
            spawnTimer = window.gameConfig.spawnRate;
            spawnIngredient();
        }

        // Update Ingredients
        for (let i = ingredients.length - 1; i >= 0; i--) {
            let ing = ingredients[i];
            ing.y += ing.vy * dt;
            ing.vy += window.gameConfig.gravity * dt;

            // Collision with Stack Top
            const topY = stack.length > 0 ? stack[stack.length - 1].y : player.y;
            const topX = stack.length > 0 ? stack[stack.length - 1].x : player.x;
            const catchDist = 60; // Horizontal forgiveness

            // Check if hitting the "top" of the stack
            if (ing.y + ing.height/2 >= topY - 10 && ing.y - ing.height/2 <= topY + 10) {
                if (Math.abs(ing.x - topX) < catchDist) {
                    // CAUGHT!
                    if (ing.type === 'rotten') {
                        gameOver();
                    } else {
                        catchIngredient(ing, i);
                    }
                    continue; // Skip rest of update for this item
                }
            }

            // Remove if off screen
            if (ing.y > window.innerHeight + 100) {
                ingredients.splice(i, 1);
            }
        }

        // Update Stack Position (Follow player with slight delay/sway)
        if (stack.length > 0) {
            stack[0].x = player.x;
            stack[0].y = player.y - 20 * player.squish;
            for (let i = 1; i < stack.length; i++) {
                // Each item follows the one below it
                const below = stack[i-1];
                const curr = stack[i];
                curr.x += (below.x - curr.x) * 20 * dt; // Stiff spring
                curr.y = below.y - 25 * player.squish; // Stack height
            }
        }

        // Camera Logic
        let targetCamY = 0;
        if (stack.length > 5) {
            targetCamY = (stack.length - 5) * 25;
        }
        cameraY += (targetCamY - cameraY) * 2 * dt;

        // Player Squish Recovery
        player.squish += (1.0 - player.squish) * 10 * dt;

        // Shake Decay
        if (shake > 0) shake = Math.max(0, shake - 10 * dt);

        // Particles
        updateParticles(dt);
    }

    function spawnIngredient() {
        const types = Math.random() < 0.2 ? BAD_TYPES : TYPES;
        const type = types[Math.floor(Math.random() * types.length)];
        ingredients.push({
            type: type,
            x: Math.random() * (window.innerWidth - 100) + 50,
            y: -50,
            vy: 100, // Initial velocity
            width: 80,
            height: 25,
            rotation: (Math.random() - 0.5) * 0.5
        });
    }

    function showGif(el, key, duration = 1100) {
        if (!el) return;
        clearTimeout(feedbackTimers[key]);
        el.hidden = false;
        el.classList.add('show');
        feedbackTimers[key] = setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => {
                el.hidden = true;
            }, 220);
        }, duration);
    }

    function catchIngredient(ing, index) {
        ingredients.splice(index, 1);
        stack.push({
            type: ing.type,
            x: player.x,
            y: player.y, // Will be corrected in update
            width: ing.width,
            height: ing.height
        });
        
        player.squish = 0.7;
        audioManager.playSfx('catch', { minInterval: 70, volume: 0.82 });
        createParticles(player.x, stack[stack.length-1].y, ing.type);
        
        score++;
        scoreEl.innerText = score;

        if (score % 5 === 0) {
            audioManager.playSfx('bonus', { minInterval: 180, volume: 0.88 });
            showGif(comboGif, 'combo', 1200);
        }
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        audioManager.playSfx('fail', { minInterval: 250, volume: 0.95 });
        audioManager.pauseBgm();
        shake = 20;
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalScoreEl.innerText = score;
        bestScore = Math.max(bestScore, score);
        showGif(failGif, 'fail', 1500);
    }

    function resetGame() {
        score = 0;
        scoreEl.innerText = 0;
        stack = [];
        ingredients = [];
        particles = [];
        spawnTimer = 0;
        cameraY = 0;
        shake = 0;
        player.x = window.innerWidth / 2;
        player.targetX = player.x;
        player.squish = 1.0;
        comboGif.classList.remove('show');
        comboGif.hidden = true;
        failGif.classList.remove('show');
        failGif.hidden = true;
        
        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        
        audioManager.init();
        audioManager.playBgm();
    }

    // --- Rendering ---
    function draw() {
        // Clear Background
        const skyGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        skyGradient.addColorStop(0, PAL.skyTop);
        skyGradient.addColorStop(1, PAL.skyBottom);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Parallax Background Pattern
        ctx.save();
        const patternSize = 110;
        const offset = (Date.now() / 50) % patternSize;
        for (let x = -patternSize; x < window.innerWidth + patternSize; x += patternSize) {
            for (let y = -patternSize; y < window.innerHeight + patternSize; y += patternSize) {
                ctx.fillStyle = (x + y) % (patternSize * 2) === 0 ? PAL.cloud : 'rgba(255,255,255,0.03)';
                ctx.beginPath();
                ctx.arc(x - offset / 3, y + offset, 16, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 24; i++) {
            const starX = (i * 137 + offset * 2) % window.innerWidth;
            const starY = ((i * 97) % Math.max(160, window.innerHeight * 0.65)) + 12;
            ctx.fillStyle = PAL.star;
            ctx.globalAlpha = 0.35 + (i % 4) * 0.12;
            ctx.fillRect(starX, starY, 2 + (i % 2), 2 + (i % 2));
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        // Camera & Shake Transform
        ctx.save();
        ctx.translate(0, cameraY);
        if (shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        }

        // Draw Player (Bottom Bun)
        drawBunBottom(player.x, player.y, player.width * player.squish, player.height * player.squish);

        // Draw Stack
        stack.forEach(item => {
            drawIngredient(item.type, item.x, item.y, item.width, item.height);
        });

        // Draw Falling Ingredients
        ingredients.forEach(ing => {
            drawIngredient(ing.type, ing.x, ing.y, ing.width, ing.height, ing.rotation);
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        ctx.restore();
    }

    // --- Procedural Assets ---
    function drawIngredient(type, x, y, w, h, rot=0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);

        // Check for asset replacement
        const img = document.getElementById(`asset_${type}`);
        if (img && img.src && img.src !== window.location.href) {
             ctx.drawImage(img, -w/2, -h/2, w, h);
        } else {
            ctx.shadowBlur = 12;
            ctx.shadowColor = PAL.glow;

            switch(type) {
                case 'patty':
                    ctx.fillStyle = PAL.pattyMain;
                    roundRect(ctx, -w/2, -h/2, w, h, 12);
                    ctx.fillStyle = PAL.pattyHighlight;
                    roundRect(ctx, -w/2 + 4, -h/2 + 3, w - 8, h * 0.25, 10);
                    ctx.fillStyle = PAL.pattyShadow;
                    ctx.fillRect(-w/3, -h/2 + 1, 5, h - 2);
                    ctx.fillRect(0, -h/2 + 1, 5, h - 2);
                    ctx.fillRect(w/3, -h/2 + 1, 5, h - 2);
                    break;
                case 'cheese':
                    ctx.fillStyle = PAL.cheeseMain;
                    ctx.beginPath();
                    ctx.rect(-w/2, -h/2, w, h - 6);
                    ctx.moveTo(-w/2, h/2 - 6);
                    ctx.lineTo(-w/2 + 10, h/2 + 5);
                    ctx.lineTo(-w/2 + 22, h/2 - 5);
                    ctx.lineTo(w/2 - 24, h/2 - 5);
                    ctx.lineTo(w/2 - 10, h/2 + 6);
                    ctx.lineTo(w/2, h/2 - 6);
                    ctx.fill();
                    ctx.fillStyle = PAL.cheeseShadow;
                    ctx.fillRect(-w/2 + 6, -h/2 + 4, w - 12, 4);
                    break;
                case 'lettuce':
                    ctx.fillStyle = PAL.lettuceMain;
                    ctx.beginPath();
                    ctx.moveTo(-w/2, 0);
                    for (let i = 0; i <= w; i += 10) {
                        ctx.lineTo(-w/2 + i, (i % 20 === 0 ? -h/2 : -h/2 - 7));
                    }
                    ctx.lineTo(w/2, h/2);
                    ctx.lineTo(-w/2, h/2);
                    ctx.fill();
                    ctx.strokeStyle = PAL.lettuceShadow;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-w/2 + 8, 0);
                    ctx.quadraticCurveTo(0, -h/2, w/2 - 8, 0);
                    ctx.stroke();
                    break;
                case 'tomato':
                    ctx.fillStyle = PAL.tomatoMain;
                    roundRect(ctx, -w/2, -h/2, w, h, 10);
                    ctx.fillStyle = PAL.tomatoShadow;
                    roundRect(ctx, -w/2 + 4, -h/2 + 4, w - 8, h - 8, 8);
                    ctx.fillStyle = '#ffd4d4';
                    ctx.beginPath();
                    ctx.arc(-15, 0, 5, 0, Math.PI * 2);
                    ctx.arc(15, 0, 5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'bun_top':
                    ctx.fillStyle = PAL.bunMain;
                    ctx.beginPath();
                    ctx.arc(0, h/2, w/2, Math.PI, 0);
                    ctx.fill();
                    ctx.fillStyle = PAL.bunShadow;
                    ctx.fillRect(-w/2 + 6, h/2 - 8, w - 12, 6);
                    ctx.fillStyle = PAL.bunSeed;
                    ctx.beginPath();
                    ctx.ellipse(-15, -15, 4, 2, -0.3, 0, Math.PI * 2);
                    ctx.ellipse(10, -20, 4, 2, 0.2, 0, Math.PI * 2);
                    ctx.ellipse(20, -10, 4, 2, 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'rotten':
                    ctx.shadowColor = 'rgba(126, 77, 248, 0.4)';
                    ctx.fillStyle = PAL.rottenMain;
                    ctx.beginPath();
                    ctx.arc(0, 0, w / 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = PAL.rottenShadow;
                    ctx.beginPath();
                    ctx.arc(-6, 4, w / 8, 0, Math.PI * 2);
                    ctx.arc(8, -3, w / 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#050505';
                    ctx.fillRect(-20 + Math.random() * 5, -20, 4, 4);
                    ctx.fillRect(20, -10 + Math.random() * 5, 4, 4);
                    break;
            }
        }
        ctx.restore();
    }

    function drawBunBottom(x, y, w, h) {
        const img = document.getElementById('asset_bun_bottom');
        if (img && img.src && img.src !== window.location.href) {
            ctx.drawImage(img, x - w/2, y - h/2, w, h);
        } else {
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = PAL.playerGlow;
            ctx.fillStyle = PAL.bunMain;
            ctx.beginPath();
            ctx.moveTo(x - w/2, y - h/2);
            ctx.lineTo(x + w/2, y - h/2);
            ctx.quadraticCurveTo(x + w/2, y + h/2 + 12, x, y + h/2 + 12);
            ctx.quadraticCurveTo(x - w/2, y + h/2 + 12, x - w/2, y - h/2);
            ctx.fill();
            ctx.fillStyle = PAL.bunShadow;
            ctx.fillRect(x - w/2 + 6, y + h/2 - 2, w - 12, 8);
            ctx.restore();
        }
    }

    function roundRect(ctx, x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fill();
    }

    // --- Particle System ---
    function createParticles(x, y, type) {
        let color = '#FFFFFF';
        if (type === 'patty') color = PAL.pattyHighlight;
        if (type === 'cheese') color = PAL.cheeseMain;
        if (type === 'lettuce') color = PAL.lettuceMain;
        if (type === 'tomato') color = PAL.tomatoMain;
        if (type === 'bun_top') color = PAL.bunMain;

        for (let i = 0; i < 10; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 200,
                vy: (Math.random() - 0.5) * 200,
                life: 1.0,
                color: color,
                size: Math.random() * 5 + 2
            });
        }
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= 2 * dt;
            p.size *= 0.95;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // --- Event Bindings ---
    startBtn.addEventListener('click', () => {
        audioManager.init();
        audioManager.playSfx('ui', { minInterval: 120, volume: 0.7 });
        resetGame();
    });

    restartBtn.addEventListener('click', () => {
        audioManager.playSfx('ui', { minInterval: 120, volume: 0.7 });
        resetGame();
    });

    // Start Loop
    requestAnimationFrame(gameLoop);
});
</script>
