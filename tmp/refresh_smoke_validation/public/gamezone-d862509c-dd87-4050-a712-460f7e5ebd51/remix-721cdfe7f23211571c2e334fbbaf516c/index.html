<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Titan Grind: Cardio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Bangers&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #050816;
            --color-bg-2: #101a3b;
            --color-glass: rgba(9, 15, 37, 0.82);
            --color-border: rgba(120, 193, 255, 0.22);
            --color-cash: #4ade80;
            --color-accent: #5eead4;
            --color-accent-2: #60a5fa;
            --color-danger: #fb7185;
            --color-gold: #facc15;
            --font-ui: 'Orbitron', system-ui, sans-serif;
            --font-display: 'Bangers', 'Orbitron', system-ui, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(94, 234, 212, 0.12), transparent 28%),
                radial-gradient(circle at bottom, rgba(96, 165, 250, 0.14), transparent 36%),
                linear-gradient(180deg, var(--color-bg), var(--color-bg-2));
            font-family: var(--font-ui);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            color: white;
        }
        canvas {
            display: block;
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        /* Compact UI Components */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(13, 24, 54, 0.94), rgba(7, 12, 29, 0.92));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--color-border);
            box-shadow:
                0 8px 28px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.025));
            border: 1px solid rgba(136, 207, 255, 0.14);
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.12) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.16s ease;
            pointer-events: none;
        }
        .glass-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }
        .glass-card:hover::before,
        .glass-card:focus-visible::before {
            opacity: 1;
        }
        .glass-card.disabled {
            opacity: 0.5;
            filter: grayscale(1);
            pointer-events: none;
        }
        .glass-card.owned {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        .glass-card.danger {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }
        
        /* Compact Tab System */
        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            font-family: var(--font-display);
            color: rgba(255,255,255,0.4);
            transition: all 0.2s;
            text-transform: uppercase;
            border: 1px solid transparent;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        .tab-btn.active {
            background: rgba(255,255,255,0.1);
            color: white;
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 0 10px rgba(255,255,255,0.05);
        }
        .tab-btn.danger-tab.active {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }
        
        /* Stat Bars */
        .micro-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.2s ease-out;
            box-shadow: 0 0 6px currentColor;
        }
        
        .hidden { display: none !important; }
        #ui-layer { pointer-events: none; }
        #ui-layer > * { pointer-events: auto; }

        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 15px currentColor; }
        }
        .glow-anim { animation: pulse-glow 2s infinite; }
        
        .godlike-text {
            background: linear-gradient(to right, #60a5fa, #facc15);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .hud-shell {
            position: relative;
        }
        .hud-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 18px rgba(96,165,250,0.08);
            pointer-events: none;
        }
        .hero-emblem {
            position: absolute;
            left: 50%;
            top: 18%;
            transform: translateX(-50%);
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 36%, rgba(255,255,255,0.92) 0 9%, transparent 10%),
                radial-gradient(circle at 36% 36%, rgba(255,255,255,0.9) 0 6%, transparent 7%),
                radial-gradient(circle at 64% 36%, rgba(255,255,255,0.9) 0 6%, transparent 7%),
                radial-gradient(circle at 50% 52%, rgba(250,204,21,0.95) 0 28%, rgba(251,146,60,0.7) 29%, transparent 31%),
                linear-gradient(180deg, rgba(96,165,250,0.9), rgba(45,212,191,0.82));
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow:
                0 0 30px rgba(94,234,212,0.22),
                0 0 64px rgba(96,165,250,0.2);
            z-index: 1;
            opacity: 0.95;
            pointer-events: none;
        }
        .hero-emblem::before,
        .hero-emblem::after {
            content: "";
            position: absolute;
            top: 48px;
            width: 32px;
            height: 18px;
            border-top: 4px solid rgba(255,255,255,0.95);
            border-radius: 50%;
            opacity: 0.9;
        }
        .hero-emblem::before {
            left: -10px;
            transform: rotate(-16deg);
        }
        .hero-emblem::after {
            right: -10px;
            transform: rotate(16deg);
        }
        .world-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 28%, rgba(96,165,250,0.12), transparent 18%),
                radial-gradient(circle at 50% 32%, rgba(250,204,21,0.08), transparent 14%);
            z-index: 0;
        }
        .display-font { font-family: var(--font-display); }

        /* Death Flash */
        @keyframes death-flash {
            0% { background: white; }
            100% { background: transparent; }
        }
        .death-overlay {
            animation: death-flash 0.5s ease-out forwards;
            pointer-events: none;
        }

<body>

<!-- GAME CANVAS -->
<canvas id="gameCanvas"></canvas>

<!-- UI LAYER -->
<div id="ui-layer" class="absolute inset-0 z-10 flex flex-col justify-between">
    <!-- [agent-note][stage3] resolved-font: display=Bangers ui=Orbitron via catalogs/fonts.json -->
    <!-- [agent-note][stage3] caution: compact-gifs-kept-off-controls | reason: protect mobile taps -->
    <img id="win-gif" class="reaction-overlay" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Rare mutation reaction" aria-hidden="true">
    <img id="fight-gif" class="reaction-overlay" src="https://i.giphy.com/45a5As2Su3RykbNB74.webp" alt="Fight impact reaction" aria-hidden="true">
    <div class="world-glow"></div>
    <div class="hero-emblem" aria-hidden="true"></div>
    
    <!-- HUD (Compact) -->
    <div class="w-full p-2 flex flex-col gap-1 pt-safe-top">
        <!-- Top Row: HP & NRG -->
        <div class="flex justify-between items-center gap-2">
            <!-- HP -->
            <div class="glass-panel rounded-full px-3 py-1 flex flex-col w-20 gap-0.5">
                <div class="flex justify-between items-center text-[9px] font-bold text-red-400">
                    <span>HP</span>
                    <span id="hp-val">10</span>
                </div>
                <div class="micro-bar">
                    <div id="hp-fill" class="bar-fill bg-red-500 text-red-500" style="width: 100%"></div>
                </div>
            </div>

            <!-- Strength Badge (Center - Compact) -->
            <div class="glass-panel hud-shell rounded-xl px-4 py-1 flex flex-col items-center border-yellow-500/30">
                <span class="text-[8px] uppercase text-yellow-500/80 tracking-[0.2em] font-bold">STR</span>
                <span id="strength-val" class="display-font text-xl font-black text-yellow-400 drop-shadow-lg leading-none">0</span>
            </div>

            <!-- NRG -->
            <div class="glass-panel rounded-full px-3 py-1 flex flex-col w-20 gap-0.5">
                <div class="flex justify-between items-center text-[9px] font-bold text-cyan-400">
                    <span>NRG</span>
                    <span id="energy-val">10</span>
                </div>
                <div class="micro-bar">
                    <div id="energy-fill" class="bar-fill bg-cyan-400 text-cyan-400" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- REROLL BADGE -->
    <div id="reroll-badge" class="absolute top-24 right-2 glass-panel rounded-lg px-2 py-1 hidden border-purple-500/50 scale-90 origin-right">
        <span class="text-[8px] text-purple-300 uppercase tracking-widest">Rerolls</span>
        <div class="text-lg font-bold text-white flex items-center gap-1 justify-center">

<script>
/** 
 * DATA & CONFIG
 */
const RACES = [
    { id: 'human', name: 'Natural Human', chance: 40, str: 1.0, nrg: 1.0, color: '#94a3b8', icon: '👤', desc: 'Balanced' },
    { id: 'steroid', name: 'Steroid Boy', chance: 25, str: 1.3, nrg: 0.8, color: '#f97316', icon: '💊', desc: 'Strong but Tired' },
    { id: 'lean', name: 'Lean', chance: 15, str: 1.1, nrg: 1.5, color: '#22d3ee', icon: '⚡', desc: 'Fast Regen' },
    { id: 'powerlifter', name: 'Powerlifter', chance: 8.5, str: 1.6, nrg: 0.5, color: '#cbd5e1', icon: '🦍', desc: 'Massive Arms', visual: 'big_arms' },
    { id: 'demon', name: 'Demon', chance: 5, str: 1.6, nrg: 1.6, color: '#ef4444', icon: '👹', desc: 'Horns of Power', visual: 'horns' },
    { id: 'angel', name: 'Angel', chance: 5, str: 1.3, nrg: 2.2, color: '#fef08a', icon: '👼', desc: 'Divine Wings', visual: 'wings' },
    { id: 'godlike', name: 'GODLIKE', chance: 1.5, str: 2.0, nrg: 2.0, color: '#60a5fa', icon: '🔱', desc: 'Absolute Power', visual: 'godlike' }
];

const CONFIG = { dpr: window.devicePixelRatio || 1, width: 0, height: 0 };

const STATE = {
    player: {
        hp: 10, maxHp: 10,
        energy: 10, baseMaxEnergy: 10,
        strength: 0,
        cash: 0.00,
        x: 0, y: 0,
        race: null,
        rerolls: 0,
        hasKilledGoblin: false
    },
    upgrades: { 
        betterBed: false,
        dumbbells: 0,
        protein: 0,
        treadmill: false
    },
    particles: [],
    floatTexts: [],
    parallax: { l1: [], l2: [] },
    shake: 0,
    isSleeping: false,
    rockHoldTime: 0,
    isHoldingRock: false,
    walkHoldTime: 0,
    isWalking: false,
    walkAccumulator: 0,
    activeTab: 'train',
    animTime: 0,
    uiFlashTimeout: null,
    feedbackTimeouts: {}
};

const FEEDBACK_GIFS = {
    win: 'win-gif',
    fight: 'fight-gif'
};

let canvas, ctx, lastTime = 0;
window.gameConfig = {};

/**
 * AUDIO SYSTEM
 */
const AudioSys = {
    ctx: null,
    unlocked: false,
    lastPlayed: {},
    init() {
        if (this.unlocked) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
            this.ctx = new AC();
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        }
        this.startBgm();
        this.unlocked = true;
    },
    startBgm() {
        const bgm = document.getElementById('bgm_main');
        if (!bgm) return;
        bgm.volume = 0.2;
        bgm.play().catch(() => {});
    },
    stopBgm() {
        const bgm = document.getElementById('bgm_main');
        if (!bgm) return;
        bgm.pause();
        bgm.currentTime = 0;
    },
    play(id, pitch = 1.0, { cooldown = 0 } = {}) {
        const now = performance.now();
        if (cooldown && this.lastPlayed[id] && now - this.lastPlayed[id] < cooldown) return;
        this.lastPlayed[id] = now;
        const el = document.getElementById(id);
        if (el) {
            el.currentTime = 0;
            el.playbackRate = pitch;
            el.play().catch(() => this.synth(pitch));
            return;
        }
        this.synth(pitch);
    },
    synth(pitch) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.connect(g); g.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(200 * pitch, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
        g.gain.setValueAtTime(0.1, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    },
    playCash() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const g = this.ctx.createGain();
        g.connect(this.ctx.destination);
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.exponentialRampToValueAtTime(1800, t + 0.1);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
        
        const osc2 = this.ctx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1800, t + 0.1);
        osc2.frequency.exponentialRampToValueAtTime(2400, t + 0.2);
        const g2 = this.ctx.createGain();
        g2.connect(this.ctx.destination);
        g2.gain.setValueAtTime(0.1, t + 0.1);
        g2.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        osc2.start(t + 0.1); osc2.stop(t + 0.4);
    },
    playCombat(type) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const g = this.ctx.createGain();
        g.connect(this.ctx.destination);
        
        if (type === 'hit') {
            const osc = this.ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(10, t + 0.2);
            g.gain.setValueAtTime(0.2, t);
            g.gain.linearRampToValueAtTime(0, t + 0.2);
            osc.start(t); osc.stop(t + 0.2);
        } else if (type === 'die') {
            const osc = this.ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.linearRampToValueAtTime(50, t + 0.5);
            g.gain.setValueAtTime(0.3, t);
            g.gain.linearRampToValueAtTime(0, t + 0.5);
            osc.start(t); osc.stop(t + 0.5);
        }
    },
    playRockRumble() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(40, t);
        osc.connect(g); g.connect(this.ctx.destination);
        g.gain.setValueAtTime(0.05, t);
        g.gain.linearRampToValueAtTime(0, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
    },
    playTreadmill() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.linearRampToValueAtTime(60, t + 0.1);
        osc.connect(g); g.connect(this.ctx.destination);
        g.gain.setValueAtTime(0.05, t);
        g.gain.linearRampToValueAtTime(0, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
    },
    playRockBreak() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.5;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, t);
        
        noise.connect(filter); filter.connect(g); g.connect(this.ctx.destination);
        noise.start(t);
    },
    playRoll() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.connect(g); g.connect(this.ctx.destination);
        const t = this.ctx.currentTime;
        osc.frequency.setValueAtTime(100, t);
        osc.frequency.linearRampToValueAtTime(1200, t + 0.8);
        g.gain.setValueAtTime(0.1, t);
        g.gain.linearRampToValueAtTime(0, t + 0.8);
        osc.start(); osc.stop(t + 0.8);
    },
    playWin(type) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const g = this.ctx.createGain();
        g.connect(this.ctx.destination);
        
        if (type === 'godlike') {
            [220, 330, 440, 554, 660].forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(g);
                osc.start(t); osc.stop(t + 2.0);
            });
            g.gain.setValueAtTime(0.3, t);
            g.gain.exponentialRampToValueAtTime(0.01, t + 2.0);
        } else {
            const osc = this.ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, t);
            osc.frequency.linearRampToValueAtTime(880, t + 0.1);
            osc.connect(g);
            g.gain.setValueAtTime(0.1, t);
            g.gain.linearRampToValueAtTime(0, t + 0.3);
            osc.start(); osc.stop(t + 0.3);
        }
    },
    playReward() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const g = this.ctx.createGain();
        g.connect(this.ctx.destination);
        const osc = this.ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(500, t);
        osc.frequency.exponentialRampToValueAtTime(1000, t + 0.1);
        osc.frequency.exponentialRampToValueAtTime(500, t + 0.2);
        g.gain.setValueAtTime(0.1, t);
        g.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
    }
};

/**
 * VISUALS
 */
class Particle {
    constructor(x, y, color, type) {
        this.x = x; this.y = y; this.color = color; this.type = type;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 5 + 2;
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.life = 1.0;
        this.size = Math.random() * 3 + 2;
        if (type === 'sleep') { this.vx *= 0.2; this.vy = -2 - Math.random(); }
        if (type === 'blood') { this.vy = Math.random() * 5; this.life = 0.6; }
        if (type === 'rock') { this.size = Math.random() * 5 + 2; this.life = 0.8; }
        if (type === 'sweat') { this.vy = Math.random() * 3 + 2; this.vx *= 0.3; this.life = 0.8; this.color = '#22d3ee'; }
        if (type === 'godlike') { this.vx *= 2; this.vy *= 2; this.life = 2.0; }
        if (type === 'dna') { this.vx *= 0.5; this.vy = -Math.random()*3 - 1; this.life = 1.5; }
        if (type === 'cash') { this.vy = -Math.random()*5 - 2; this.life = 1.2; this.vx *= 0.5; }
    }
    update(dt) {
        this.x += this.vx; this.y += this.vy;
        this.life -= dt * (this.type === 'sleep' ? 0.8 : 1.5);
        if (this.type === 'blood' || this.type === 'rock' || this.type === 'sweat') this.vy += 1.0; // Gravity
        else if (this.type === 'dna') this.x += Math.sin(this.y * 0.1) * 2;
        else if (this.type === 'cash') this.vy += 0.2;
        else if (this.type !== 'sleep') this.vy += 0.5;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, Math.min(1, this.life));
        if (this.type === 'sleep') {
            ctx.fillStyle = this.color; ctx.font = '700 20px "Orbitron"'; ctx.fillText('Z', this.x, this.y);
        } else if (this.type === 'dna') {
            ctx.fillStyle = this.color; ctx.font = '12px Arial'; ctx.fillText('🧬', this.x, this.y);
        } else if (this.type === 'cash') {
            ctx.fillStyle = this.color; ctx.font = 'bold 16px Arial'; ctx.fillText('$', this.x, this.y);
        } else {
            ctx.fillStyle = this.color; ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

class FloatText {
    constructor(x, y, text, color) {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.life = 1.0; this.vy = -40;
    }
    update(dt) { this.y += this.vy * dt; this.life -= dt * 1.5; }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = '700 20px "Bangers"';
        ctx.strokeStyle = 'black'; ctx.lineWidth = 2;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

function init() {
    try {
        const c = JSON.parse(document.getElementById('game-config').textContent);
        Object.keys(c).forEach(k => window.gameConfig[k] = c[k].value);
    } catch(e) {}

    STATE.parallax.l1 = Array(15).fill(0).map(() => ({ x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, r: Math.random()*50+20 }));
    STATE.parallax.l2 = Array(25).fill(0).map(() => ({ x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, r: Math.random()*10+2 }));

    resize();
    updateUI();
    AudioSys.startBgm();
}

function resize() {
    CONFIG.width = window.innerWidth; CONFIG.height = window.innerHeight;
    canvas.width = CONFIG.width * CONFIG.dpr; canvas.height = CONFIG.height * CONFIG.dpr;
    canvas.style.width = CONFIG.width + 'px'; canvas.style.height = CONFIG.height + 'px';
    ctx.setTransform(CONFIG.dpr, 0, 0, CONFIG.dpr, 0, 0);
    STATE.player.x = CONFIG.width / 2; STATE.player.y = CONFIG.height * 0.35;
}

function showReaction(key, duration = 1800) {
    const id = FEEDBACK_GIFS[key];
    const el = id ? document.getElementById(id) : null;
    if (!el) return;
    clearTimeout(STATE.feedbackTimeouts[key]);
    el.classList.add('visible');
    STATE.feedbackTimeouts[key] = setTimeout(() => {
        el.classList.remove('visible');
    }, duration);
}

function notifyBlocked() {
    AudioSys.play('sfx_blocked', 1, { cooldown: 180 });
}

function switchTab(tab) {
    STATE.activeTab = tab;
    ['train', 'shop', 'race', 'fight'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const sec = document.getElementById(`section-${t}`);
        if (t === tab) {
            btn.classList.add('active'); sec.classList.remove('hidden');
        } else {
            btn.classList.remove('active'); sec.classList.add('hidden');
        }
    });
    AudioSys.play('sfx_ui', 1, { cooldown: 90 });
}

function rollRace() {
    const p = STATE.player;
    if (p.race && p.rerolls <= 0) return;
    if (p.race) p.rerolls--;

    AudioSys.playRoll();
    
    const rand = Math.random() * 100;
    let accum = 0;
    let selected = RACES[0];
    
    for (let r of RACES) {
        accum += r.chance;
        if (rand <= accum) { selected = r; break; }
    }
    
    p.race = selected;
    
    let pType = 'spark';
    let soundType = 'normal';
    let shakeAmt = 0.5;

        if (selected.id === 'godlike') { shakeAmt = 4.0; soundType = 'godlike'; pType = 'godlike'; }
        else if (selected.id === 'angel' || selected.id === 'demon') { shakeAmt = 2.0; }

        STATE.shake = shakeAmt;
        AudioSys.play('sfx_reward', selected.id === 'godlike' ? 1.2 : 1.05, { cooldown: 120 });
        AudioSys.playWin(soundType);
        showReaction('win', selected.id === 'godlike' ? 2600 : 1800);
    
    for(let i=0; i<50; i++) STATE.particles.push(new Particle(p.x, p.y, selected.color, pType));
    STATE.floatTexts.push(new FloatText(p.x, p.y - 120, selected.name.toUpperCase() + "!", selected.color));
    updateUI();
}

function getStats() {
    const p = STATE.player;
    const dbLvl = STATE.upgrades.dumbbells;
    const protLvl = STATE.upgrades.protein;
    
    // Multipliers
    const dbMult = Math.pow(1.2, dbLvl);
    const dbCostMult = Math.pow(1.3, dbLvl);
    const protMult = Math.pow(1.1, protLvl); // 1.1x per level
    
    // Base Max Energy Logic
    let currentMaxEnergy = p.baseMaxEnergy * protMult;
    
    // Strength Gain
    const raceStr = p.race ? p.race.str : 1.0;
    const strGain = 1.0 * raceStr * dbMult * protMult;
    
    return { dbMult, dbCostMult, protMult, currentMaxEnergy, strGain };
}

function handleGym() {
    const p = STATE.player;
    const stats = getStats();
    const cost = window.gameConfig.gymCost * stats.dbCostMult;
    
    if (p.energy >= cost) {
        p.energy -= cost;
        p.strength += stats.strGain;
        AudioSys.play('sfx_gym', 1, { cooldown: 120 });
        AudioSys.play('sfx_reward', 0.95, { cooldown: 160 });
        STATE.shake = 0.3;
        AudioSys.play('sfx_gym');
        STATE.floatTexts.push(new FloatText(p.x, p.y - 80, `+${stats.strGain.toFixed(1)} STR`, "#fbbf24"));
        for(let i=0; i<8; i++) STATE.particles.push(new Particle(p.x, p.y-50, '#fbbf24', 'spark'));
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: 'light' }
            });
        }
        updateUI();
    } else {
        notifyBlocked();
    }
}

function handleShopBuy(item) {
    const p = STATE.player;
    const stats = getStats();
    
    if (item === 'bed' && !STATE.upgrades.betterBed) {
        const cost = window.gameConfig.bedPrice;
        if (p.strength >= cost) {
            p.strength -= cost;
            STATE.upgrades.betterBed = true;
            p.baseMaxEnergy = 25;
            AudioSys.play('sfx_reward', 0.9, { cooldown: 120 });
            STATE.shake = 0.5;
            STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "MAX NRG UP!", "#a855f7"));
            updateUI();
        }
    }
    else if (item === 'dumbbells' && STATE.upgrades.dumbbells < 5) {
        const cost = 10 * Math.pow(1.3, STATE.upgrades.dumbbells);
        if (p.strength >= cost) {
            p.strength -= cost;
            STATE.upgrades.dumbbells++;
            AudioSys.play('sfx_reward', 0.98, { cooldown: 120 });
            STATE.shake = 0.5;
            STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "WEIGHTS UP!", "#3b82f6"));
            updateUI();
        }
    }
    else if (item === 'protein' && STATE.upgrades.protein < 5) {
        const cost = 2.50 * Math.pow(1.25, STATE.upgrades.protein);
        if (p.cash >= cost) {
            p.cash -= cost;
            STATE.upgrades.protein++;
            AudioSys.play('sfx_reward', 1.05, { cooldown: 120 });
            AudioSys.playCash();
            STATE.shake = 0.5;
            STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "PROTEIN UP!", "#4ade80"));
            for(let i=0; i<15; i++) STATE.particles.push(new Particle(p.x, p.y-50, '#4ade80', 'spark'));
            updateUI();
        }
    }
    else if (item === 'creatine') {
        if (p.cash >= 1.00) {
            p.cash -= 1.00;
            p.strength += 15;
            p.energy = Math.min(stats.currentMaxEnergy, p.energy + 15);
            AudioSys.play('sfx_reward', 1.1, { cooldown: 120 });
            AudioSys.playCash();
            STATE.shake = 0.4;
            STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "CREATINE!", "#f472b6"));
            STATE.floatTexts.push(new FloatText(p.x, p.y - 70, "+15 STR/NRG", "#f472b6"));
            for(let i=0; i<20; i++) STATE.particles.push(new Particle(p.x, p.y-50, '#f472b6', 'spark'));
            if (window.webkit?.messageHandlers?.gamezoneBridge) {
                window.webkit.messageHandlers.gamezoneBridge.postMessage({
                    action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: 'medium' }
                });
            }
            updateUI();
        }
    }
    else if (item === 'treadmill' && !STATE.upgrades.treadmill) {
        if (p.cash >= 10.00) {
            p.cash -= 10.00;
            STATE.upgrades.treadmill = true;
            AudioSys.play('sfx_reward', 1, { cooldown: 120 });
            AudioSys.playCash();
            STATE.shake = 0.5;
            STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "TREADMILL UNLOCKED!", "#22d3ee"));
            for(let i=0; i<30; i++) STATE.particles.push(new Particle(p.x, p.y-50, '#22d3ee', 'spark'));
            updateUI();
        }
    }
} 
 
function handleFight() {
    const p = STATE.player;
    if (p.strength >= 50 && p.energy >= 25) {
        p.strength -= 50;
        p.energy -= 25;
        p.hp -= 15;
        STATE.shake = 2.0;
        
        if (p.hp <= 0) {
            p.hp = 0;
            handleDeath();
        } else {
            // Success
            AudioSys.play('sfx_fight', 1, { cooldown: 150 });
            AudioSys.playCombat('hit');
            showReaction('fight', 1500);
            
            // Rewards
            p.strength += 100;
            p.cash += 5.00;
            AudioSys.playCash();
            
            STATE.floatTexts.push(new FloatText(p.x, p.y - 120, "+100 STR!", "#fbbf24"));
            STATE.floatTexts.push(new FloatText(p.x + 40, p.y - 150, "+$5.00", "#4ade80"));
            
            // Reward: Reroll (First time only)
            if (!p.hasKilledGoblin) {
                p.hasKilledGoblin = true;
                p.rerolls++;
                AudioSys.playReward();
                STATE.floatTexts.push(new FloatText(p.x, p.y - 180, "REROLL UNLOCKED!", "#d8b4fe"));
                for(let i=0; i<30; i++) STATE.particles.push(new Particle(p.x, p.y-80, '#d8b4fe', 'dna'));
            } else {
                STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "GOBLIN SLAIN!", "#ef4444"));
            }
            
            for(let i=0; i<15; i++) STATE.particles.push(new Particle(p.x, p.y-50, '#ef4444', 'blood'));
            for(let i=0; i<15; i++) STATE.particles.push(new Particle(p.x, p.y-50, '#4ade80', 'cash'));
            
            if (window.webkit?.messageHandlers?.gamezoneBridge) {
                window.webkit.messageHandlers.gamezoneBridge.postMessage({
                    action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: 'heavy' }
                });
            }
            updateUI();
        }
    } else {
        notifyBlocked();
    }
}

function handleDeath() {
    const p = STATE.player;
    p.strength = 0;
    p.energy = p.baseMaxEnergy; 
    p.hp = p.maxHp; 
    p.rerolls = 0;
    p.cash = 0;
    p.hasKilledGoblin = false;
    STATE.upgrades.betterBed = false;
    STATE.upgrades.dumbbells = 0;
    STATE.upgrades.protein = 0;
    STATE.upgrades.treadmill = false;
    p.baseMaxEnergy = 10; 
    
    AudioSys.play('sfx_fail', 1, { cooldown: 200 });
    AudioSys.stopBgm();
    AudioSys.playCombat('die');
    const flash = document.createElement('div');
    flash.className = 'absolute inset-0 z-50 bg-white death-overlay';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);
    
    STATE.floatTexts.push(new FloatText(p.x, p.y - 120, "CRITICAL FAILURE", "#ff0000"));
    STATE.floatTexts.push(new FloatText(p.x, p.y - 90, "ALL PROGRESS LOST", "#ff0000"));
    
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: 'heavy' }
        });
    }
    setTimeout(() => AudioSys.startBgm(), 700);
    updateUI();
}

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    const p = STATE.player;
    const stats = getStats();
    const maxNrg = stats.currentMaxEnergy;
    
    // Rock Holding Logic
    if (STATE.isHoldingRock) {
        if (p.energy >= 5) {
            STATE.rockHoldTime += dt;
            STATE.shake = 0.5 + (STATE.rockHoldTime * 0.5); 
            if (Math.random() < 0.2) AudioSys.playRockRumble();
            
            if (STATE.rockHoldTime >= 3.0) {
                STATE.isHoldingRock = false;
                STATE.rockHoldTime = 0;
                p.energy -= 5;
                p.maxHp += 1;
                p.hp = Math.min(p.hp + 1, p.maxHp);
                
                AudioSys.playRockBreak();
                STATE.shake = 3.0;
                STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "+1 MAX HP", "#94a3b8"));
                for(let i=0; i<20; i++) STATE.particles.push(new Particle(p.x, p.y-50, '#94a3b8', 'rock'));
                if (window.webkit?.messageHandlers?.gamezoneBridge) {
                    window.webkit.messageHandlers.gamezoneBridge.postMessage({
                        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: 'medium' }
                    });
                }
                updateUI();
            }
        } else {
            STATE.isHoldingRock = false;
            STATE.rockHoldTime = 0;
        }
    } else {
        if (STATE.rockHoldTime > 0) {
            STATE.rockHoldTime -= dt * 5; // Decay
            if (STATE.rockHoldTime < 0) STATE.rockHoldTime = 0;
        }
    }
    document.getElementById('rock-progress').style.width = `${Math.min(100, (STATE.rockHoldTime / 3.0) * 100)}%`;

    // Walking Logic
    if (STATE.isWalking && STATE.upgrades.treadmill) {
        const drain = 4 * dt;
        if (p.energy >= drain) {
            p.energy -= drain;
            STATE.walkAccumulator += dt;
            if (Math.random() < 0.3) AudioSys.playTreadmill();
            if (Math.random() < 0.1) STATE.particles.push(new Particle(p.x + (Math.random()-0.5)*20, p.y-60, '#22d3ee', 'sweat'));
            
            if (STATE.walkAccumulator >= 2.0) {
                STATE.walkAccumulator -= 2.0;
                p.baseMaxEnergy += 0.5;
                AudioSys.play('sfx_gym', 1.5);
                STATE.floatTexts.push(new FloatText(p.x, p.y - 100, "+0.5 MAX NRG", "#22d3ee"));
                if (window.webkit?.messageHandlers?.gamezoneBridge) {
                    window.webkit.messageHandlers.gamezoneBridge.postMessage({
                        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: 'light' }
                    });
                }
            }
            updateUI();
        } else {
            STATE.isWalking = false;
        }
    } else {
        if (STATE.walkAccumulator > 0) {
            STATE.walkAccumulator -= dt; // Decay slowly
            if (STATE.walkAccumulator < 0) STATE.walkAccumulator = 0;
        }
    }
    document.getElementById('walk-progress').style.width = `${Math.min(100, (STATE.walkAccumulator / 2.0) * 100)}%`;

    // Sleep Logic
    if (STATE.isSleeping) {
        const raceMult = (p.race ? p.race.nrg : 1.0);
        const regenRate = window.gameConfig.sleepRate * raceMult;
        let changed = false;
        if (p.energy < maxNrg) {
            p.energy += regenRate * dt;
            if (p.energy > maxNrg) p.energy = maxNrg;
            changed = true;
        }
        if (p.hp < p.maxHp) {
            p.hp += (regenRate * 0.5) * dt;
            if (p.hp > p.maxHp) p.hp = p.maxHp;
            changed = true;
        }
        if (changed) {
            if (Math.random() < 0.1) STATE.particles.push(new Particle(p.x+(Math.random()-0.5)*40, p.y-80, '#22d3ee', 'sleep'));
            updateUI();
        }
    }
    
    if (STATE.shake > 0) STATE.shake = Math.max(0, STATE.shake - dt * 5);
    
    for (let i = STATE.particles.length - 1; i >= 0; i--) {
        STATE.particles[i].update(dt);
        if (STATE.particles[i].life <= 0) STATE.particles.splice(i, 1);
    }
    for (let i = STATE.floatTexts.length - 1; i >= 0; i--) {
        STATE.floatTexts[i].update(dt);
        if (STATE.floatTexts[i].life <= 0) STATE.floatTexts.splice(i, 1);
    }
    
    STATE.animTime += dt * window.gameConfig.heroSpeed;
}

function draw() {
    ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);
    ctx.save();
    
    // Shake
    if (STATE.shake > 0) {
        const s = STATE.shake * 10;
        ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }
    
    // Parallax
    ctx.fillStyle = STATE.player.race?.id === 'godlike' ? 'rgba(96, 165, 250, 0.1)' : 'rgba(255, 255, 255, 0.02)';
    STATE.parallax.l1.forEach(c => {
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
    });
    
    ctx.strokeStyle = STATE.player.race ? STATE.player.race.color : 'rgba(34, 211, 238, 0.05)';
    ctx.globalAlpha = 0.1;
    ctx.lineWidth = 1;
    STATE.parallax.l2.forEach(c => {
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + 20, c.y + 20); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Hero Draw
    const p = STATE.player;
    const breathe = Math.sin(STATE.animTime) * 3;
    const muscle = 5; // Fixed size to prevent infinite growth
    const race = p.race || { id: 'none', color: '#e2e8f0', visual: 'none' };
    
    const isBigArms = race.visual === 'big_arms';
    const isHorns = race.visual === 'horns';
    const isWings = race.visual === 'wings';
    const isGodlike = race.visual === 'godlike';

    if (isGodlike) { ctx.shadowBlur = 40; ctx.shadowColor = '#60a5fa'; }
    else if (isHorns) { ctx.shadowBlur = 20; ctx.shadowColor = '#ef4444'; }
    else if (isWings) { ctx.shadowBlur = 20; ctx.shadowColor = '#fef08a'; }

    // Wings
    if (isWings || isGodlike) {
        ctx.fillStyle = isGodlike ? 'rgba(96, 165, 250, 0.5)' : 'rgba(254, 240, 138, 0.5)';
        ctx.beginPath();
        ctx.moveTo(p.x - 10, p.y - 40 + breathe);
        ctx.quadraticCurveTo(p.x - 60, p.y - 80 + breathe, p.x - 70, p.y - 20 + breathe);
        ctx.quadraticCurveTo(p.x - 40, p.y - 10 + breathe, p.x - 10, p.y - 30 + breathe);
        ctx.moveTo(p.x + 10, p.y - 40 + breathe);
        ctx.quadraticCurveTo(p.x + 60, p.y - 80 + breathe, p.x + 70, p.y - 20 + breathe);
        ctx.quadraticCurveTo(p.x + 40, p.y - 10 + breathe, p.x + 10, p.y - 30 + breathe);
        ctx.fill();
    }

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = race.color;
    ctx.lineWidth = 4 + muscle + (isBigArms ? 6 : 0);

    // Body
    ctx.beginPath();
    ctx.arc(p.x, p.y - 70 + breathe, 12, 0, Math.PI * 2); // Head
    ctx.stroke();
    
    if (isHorns || isGodlike) {
        ctx.save();
        ctx.strokeStyle = isGodlike ? '#facc15' : race.color;
        ctx.beginPath();
        ctx.moveTo(p.x - 8, p.y - 80 + breathe); ctx.lineTo(p.x - 15, p.y - 95 + breathe);
        ctx.moveTo(p.x + 8, p.y - 80 + breathe); ctx.lineTo(p.x + 15, p.y - 95 + breathe);
        ctx.stroke();
        ctx.restore();
    }

    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 58 + breathe); ctx.lineTo(p.x, p.y - 20); // Torso
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x - 15, p.y + 20); // Legs
    ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x + 15, p.y + 20);
    ctx.stroke();
    
    // Arms
    const armY = p.y - 50 + breathe;
    const lift = Math.abs(Math.sin(STATE.animTime)) * 10;
    const armBulk = isBigArms ? 5 : 0;
    
    ctx.beginPath();
    ctx.moveTo(p.x, armY);
    ctx.lineTo(p.x - 20 - muscle - armBulk, armY + 10 - lift); 
    ctx.lineTo(p.x - 30 - muscle - armBulk, armY - 10 - lift); 
    ctx.moveTo(p.x, armY);
    ctx.lineTo(p.x + 20 + muscle + armBulk, armY + 10 - lift); 
    ctx.lineTo(p.x + 30 + muscle + armBulk, armY - 10 - lift); 
    ctx.stroke();
    
    // Dumbbells
    if (lift > 5) {
        ctx.fillStyle = '#64748b'; ctx.shadowBlur = 0;
        const dbScale = 1 + (STATE.upgrades.dumbbells * 0.2);
        const w = 20 * dbScale;
        const h = 6 * dbScale;
        ctx.fillRect(p.x - 30 - muscle - armBulk - w/2, armY - 15 - lift, w, h);
        ctx.fillRect(p.x + 30 + muscle + armBulk - w/2, armY - 15 - lift, w, h);
    }
    
    ctx.shadowBlur = 0;
    STATE.particles.forEach(pt => pt.draw(ctx));
    STATE.floatTexts.forEach(ft => ft.draw(ctx));
    ctx.restore();
}

/**
 * INPUT
 */
document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    window.addEventListener('resize', resize);
    
    // Navigation
    ['train', 'shop', 'race', 'fight'].forEach(t => {
        document.getElementById(`tab-${t}`).addEventListener('pointerdown', (e) => {
            e.preventDefault(); AudioSys.init(); switchTab(t);
        });
    });

    // Actions
    const gymBtn = document.getElementById('gym-btn');
    gymBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        if (gymBtn.classList.contains('disabled')) notifyBlocked();
        handleGym();
        gymBtn.style.transform = 'scale(0.95)';
    });
    gymBtn.addEventListener('pointerup', () => gymBtn.style.transform = 'scale(1)');
    gymBtn.addEventListener('pointerleave', () => gymBtn.style.transform = 'scale(1)');

    // Sleep
    const sleepBtn = document.getElementById('sleep-btn');
    const startSleep = (e) => {
        e.preventDefault(); AudioSys.init(); STATE.isSleeping = true;
        sleepBtn.style.transform = 'scale(0.95)'; sleepBtn.style.background = 'rgba(34, 211, 238, 0.1)';
    };
    const endSleep = (e) => {
        e.preventDefault(); STATE.isSleeping = false;
        sleepBtn.style.transform = 'scale(1)'; sleepBtn.style.background = '';
    };
    sleepBtn.addEventListener('pointerdown', startSleep);
    sleepBtn.addEventListener('pointerup', endSleep);
    sleepBtn.addEventListener('pointercancel', endSleep);
    sleepBtn.addEventListener('pointerleave', endSleep);

    // Rock Hit
    const rockBtn = document.getElementById('rock-btn');
    const startRock = (e) => {
        e.preventDefault(); AudioSys.init(); STATE.isHoldingRock = true;
        rockBtn.style.transform = 'scale(0.98)';
    };
    const endRock = (e) => {
        e.preventDefault(); STATE.isHoldingRock = false;
        rockBtn.style.transform = 'scale(1)';
    };
    rockBtn.addEventListener('pointerdown', (e) => {
        if (rockBtn.classList.contains('disabled')) notifyBlocked();
        startRock(e);
    });
    rockBtn.addEventListener('pointerup', endRock);
    rockBtn.addEventListener('pointercancel', endRock);
    rockBtn.addEventListener('pointerleave', endRock);

    // Walking (New)
    const walkBtn = document.getElementById('walk-btn');
    const startWalk = (e) => {
        e.preventDefault(); AudioSys.init(); STATE.isWalking = true;
        walkBtn.style.transform = 'scale(0.98)';
    };
    const endWalk = (e) => {
        e.preventDefault(); STATE.isWalking = false;
        walkBtn.style.transform = 'scale(1)';
    };
    walkBtn.addEventListener('pointerdown', (e) => {
        if (walkBtn.classList.contains('disabled')) notifyBlocked();
        startWalk(e);
    });
    walkBtn.addEventListener('pointerup', endWalk);
    walkBtn.addEventListener('pointercancel', endWalk);
    walkBtn.addEventListener('pointerleave', endWalk);

    // Shop
    const bedBtn = document.getElementById('shop-bed-btn');
    bedBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        if (!STATE.upgrades.betterBed) {
            handleShopBuy('bed'); bedBtn.style.transform = 'scale(0.95)';
        }
    });
    bedBtn.addEventListener('pointerup', () => bedBtn.style.transform = 'scale(1)');

    const dbBtn = document.getElementById('shop-dumbbells-btn');
    dbBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        handleShopBuy('dumbbells'); dbBtn.style.transform = 'scale(0.95)';
    });
    dbBtn.addEventListener('pointerup', () => dbBtn.style.transform = 'scale(1)');

    const protBtn = document.getElementById('shop-protein-btn');
    protBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        handleShopBuy('protein'); protBtn.style.transform = 'scale(0.95)';
    });
    protBtn.addEventListener('pointerup', () => protBtn.style.transform = 'scale(1)');

    const creatineBtn = document.getElementById('shop-creatine-btn');
    creatineBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        handleShopBuy('creatine'); creatineBtn.style.transform = 'scale(0.95)';
    });
    creatineBtn.addEventListener('pointerup', () => creatineBtn.style.transform = 'scale(1)');

    const treadBtn = document.getElementById('shop-treadmill-btn');
    treadBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        handleShopBuy('treadmill'); treadBtn.style.transform = 'scale(0.95)';
    });
    treadBtn.addEventListener('pointerup', () => treadBtn.style.transform = 'scale(1)');
    
    // Race Roll
    const rollBtn = document.getElementById('btn-roll-race');
    rollBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        rollRace(); 
        rollBtn.style.transform = 'scale(0.95)';
    });
    rollBtn.addEventListener('pointerup', () => rollBtn.style.transform = 'scale(1)');

    // Fight
    const fightBtn = document.getElementById('fight-goblin-btn');
    fightBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); AudioSys.init();
        if (fightBtn.classList.contains('disabled')) notifyBlocked();
        handleFight();
        fightBtn.style.transform = 'scale(0.95)';
    });
    fightBtn.addEventListener('pointerup', () => fightBtn.style.transform = 'scale(1)');

    init();
    requestAnimationFrame(gameLoop);
});

window.updateGameConfig = (key, val) => { window.gameConfig[key] = val; updateUI(); };
</script>
</body>
