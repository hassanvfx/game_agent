<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Gap Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        
        :root {
            --synth-bg: #0f0518;
            --synth-grid: #2a1d3d;
            --synth-pink: #ff00ff;
            --synth-gold: #ffd700;
            --synth-cyan: #00ffff;
            --synth-danger: #ff2a2a;
            --synth-panel: rgba(16, 8, 30, 0.88);
            --synth-panel-edge: rgba(0, 255, 255, 0.35);
            --synth-panel-glow: rgba(255, 0, 255, 0.18);
            --synth-amber: #ffb347;
            --white: #ffffff;
            --black: #000000;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Orbitron', system-ui, sans-serif; 
            background:
                radial-gradient(circle at top, rgba(0, 255, 255, 0.12), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 0, 255, 0.16), transparent 36%),
                linear-gradient(180deg, #12051f 0%, var(--synth-bg) 48%, #080311 100%);
            color: var(--white);
            -webkit-user-select: none;
            user-select: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .screen {
            position: absolute;
            inset: 0;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .hidden { display: none !important; }
        .full-size { width: 100%; height: 100%; }
        .overflow-hidden { overflow: hidden; }
        .center-stack {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .overlay-ui {
            pointer-events: none;
            z-index: 20;
        }
        .panel {
            padding: 1.5rem;
            border-radius: 1.35rem;
            text-align: center;
            pointer-events: auto;
            transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
            max-width: 22rem;
            width: min(90%, 22rem);
            position: relative;
            overflow: hidden;
        }
        .panel-start { border-top: 4px solid var(--synth-cyan); }
        .panel-gameover { border-top: 4px solid var(--synth-danger); }
        .title-main {
            font-family: 'Press Start 2P', 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 7vw, 2.7rem);
            line-height: 1.15;
            margin: 0 0 0.8rem;
            color: var(--white);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .divider {
            height: 4px;
            width: 100%;
            margin-bottom: 1.5rem;
            opacity: 0.8;
            background: linear-gradient(90deg, transparent, var(--synth-pink), transparent);
        }
        .intro-copy {
            color: rgba(255,255,255,0.78);
            font-size: 0.88rem;
            margin: 0 0 1.6rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            line-height: 1.6;
            text-transform: uppercase;
        }
        .accent-pink { color: var(--synth-pink); }
        .accent-cyan { color: var(--synth-cyan); }
        .btn-primary,
        .btn-secondary {
            width: 100%;
            padding: 0.95rem 1.15rem;
            border-radius: 999px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.08em;
            font-size: 0.95rem;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--synth-cyan), #8ef7ff);
            color: var(--black);
            box-shadow: 0 0 25px rgba(0,255,255,0.5);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #ffffff, #ffe3f8);
            color: var(--black);
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        }
        .hud {
            position: absolute;
            top: max(0px, env(safe-area-inset-top));
            left: 0;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .hud-label {
            font-family: 'Press Start 2P', 'Orbitron', sans-serif;
            font-size: 0.62rem;
            color: var(--synth-gold);
            font-weight: 400;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.45rem;
        }
        .score-value,
        .final-score {
            font-weight: 700;
            color: var(--white);
        }
        .score-value {
            font-family: 'Press Start 2P', 'Orbitron', sans-serif;
            font-size: clamp(1.55rem, 6vw, 2.35rem);
            text-shadow: 0 0 12px rgba(0,255,255,0.4), 0 2px 4px rgba(0,0,0,0.8);
            transition: transform 0.12s ease, color 0.12s ease;
        }
        .final-score-wrap {
            font-size: 1.125rem;
            color: var(--white);
            margin-bottom: 2rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .final-score {
            font-size: 1.9rem;
            color: var(--synth-gold);
            margin-left: 0.5rem;
        }
        .status-title {
            font-family: 'Press Start 2P', 'Orbitron', sans-serif;
            font-size: clamp(1.7rem, 7vw, 2.5rem);
            font-weight: 400;
            color: var(--synth-danger);
            margin: 0 0 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .tutorial {
            position: absolute;
            bottom: 25%;
            width: 100%;
            text-align: center;
            color: rgba(0,255,255,0.88);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0,255,255,0.45);
        }
        .pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .score-flash {
            color: var(--synth-pink);
            transform: scale(1.12);
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(18, 8, 35, 0.94), rgba(11, 5, 21, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--synth-panel-edge);
            box-shadow: 0 0 30px var(--synth-panel-glow), inset 0 0 0 1px rgba(255,255,255,0.06);
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(0,255,255,0.12), transparent 32%),
                linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
            pointer-events: none;
        }

        .panel > * {
            position: relative;
            z-index: 1;
        }

        .hud > div {
            padding: 0.7rem 0.95rem 0.8rem;
            border-radius: 1rem;
            background: var(--synth-panel);
            border: 1px solid rgba(255, 179, 71, 0.4);
            box-shadow: 0 0 18px rgba(255, 179, 71, 0.12);
        }

        .final-score,
        .score-value {
            font-variant-numeric: tabular-nums;
        }

        .btn-primary:active,
        .btn-secondary:active {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.4);
        }

        .text-glow-danger {
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.8);
        }

        /* 3D Grid Effect */
        .retro-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(42, 29, 61, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(42, 29, 61, 0.4) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 3s linear infinite;
            z-index: 0;
            pointer-events: none;
            opacity: 0.9;
        }

        .starfield,
        .character-aura {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .starfield {
            z-index: 1;
            overflow: hidden;
        }

        .starfield span {
            position: absolute;
            width: 0.35rem;
            height: 0.35rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.7);
            box-shadow: 0 0 12px rgba(0,255,255,0.55);
            animation: driftSpark 3.2s ease-in-out infinite;
        }

        .starfield span:nth-child(1) { top: 15%; left: 12%; animation-delay: 0s; }
        .starfield span:nth-child(2) { top: 24%; right: 18%; animation-delay: 0.5s; }
        .starfield span:nth-child(3) { top: 58%; left: 10%; animation-delay: 0.9s; }
        .starfield span:nth-child(4) { top: 68%; right: 12%; animation-delay: 1.4s; }
        .starfield span:nth-child(5) { top: 38%; left: 78%; animation-delay: 1.8s; }

        .character-aura {
            z-index: 2;
            background:
                radial-gradient(circle at 20% 50%, rgba(0,255,255,0.14), transparent 16%),
                radial-gradient(circle at 21% 50%, rgba(255,0,255,0.1), transparent 24%);
            mix-blend-mode: screen;
        }

        @keyframes driftSpark {
            0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.2; }
            50% { transform: translateY(-8px) scale(1.25); opacity: 0.95; }
        }

        @media (max-width: 480px) {
            .panel {
                padding: 1.2rem;
                width: min(92%, 21rem);
            }

            .hud {
                padding: max(0.85rem, env(safe-area-inset-top)) 0.85rem 0.85rem;
            }

            .tutorial {
                bottom: 22%;
                padding: 0 1rem;
                line-height: 1.45;
            }
        }

        .fx-badge {
            position: absolute;
            right: 1rem;
            bottom: max(1rem, env(safe-area-inset-bottom));
            width: min(28vw, 6rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            background: rgba(9, 3, 18, 0.72);
            border: 1px solid rgba(0, 255, 255, 0.28);
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.18);
            overflow: hidden;
            opacity: 0;
            transform: translateY(0.6rem) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 15;
        }

        .fx-badge.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .fx-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fx-badge--fail {
            left: 50%;
            top: 50%;
            right: auto;
            bottom: auto;
            width: min(44vw, 10rem);
            transform: translate(-50%, -50%) scale(0.9);
            border-color: rgba(255, 42, 42, 0.45);
            box-shadow: 0 0 24px rgba(255, 42, 42, 0.24);
        }

        .fx-badge--fail.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .fx-caption {
            position: absolute;
            left: 50%;
            bottom: 0.35rem;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', 'Orbitron', sans-serif;
            font-size: 0.48rem;
            letter-spacing: 0.08em;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.85);
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .fx-badge {
                right: 0.7rem;
                width: min(24vw, 4.5rem);
            }

            .fx-badge--fail {
                width: min(48vw, 8.5rem);
            }

            .fx-caption {
                font-size: 0.42rem;
            }
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative full-size overflow-hidden">
        <!-- Background Grid -->
        <div class="retro-grid"></div>
        <div class="starfield" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="character-aura" aria-hidden="true"></div>

        <!-- [agent-note][stage3] resolved-gif: score/fail feedback -> catalogs/gifs.json -->
        <div id="score-gif" class="fx-badge" aria-hidden="true">
            <img src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="">
            <span class="fx-caption">Gate Cleared</span>
        </div>
        <div id="fail-gif" class="fx-badge fx-badge--fail" aria-hidden="true">
            <img src="https://i.giphy.com/3qKs2fWAFDCJQmndSt.webp" alt="">
            <span class="fx-caption">Run Lost</span>
        </div>

        <canvas id="gameCanvas" class="relative full-size"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="screen center-stack overlay-ui">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel panel panel-start">
                <h1 class="title-main text-glow">NEON<br>GAP RUNNER</h1>
                <div class="divider"></div>
                <p class="intro-copy">
                    THREAD THE <span class="accent-pink">SLANTED</span> GATES<br>
                    <span class="accent-cyan">HOLD TO CLIMB</span><br>
                    <span>RELEASE TO DROP</span>
                </p>
                
                <button id="start-btn" class="btn-primary">
                    Launch Run
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel panel panel-gameover">
                <h2 class="status-title text-glow-danger">Run Lost</h2>
                <div class="final-score-wrap">Gates Cleared: <span id="finalScore" class="final-score">0</span></div>
                <button id="restart-btn" class="btn-secondary">
                    Run Again
                </button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <div>
                    <span class="hud-label">Gates</span>
                    <span id="score" class="score-value">0</span>
                </div>
            </div>
            
            <!-- Tutorial Hint -->
            <div id="tutorial" class="tutorial pulse-fast hidden">
                HOLD TO CLIMB THROUGH THE NEXT GATE
            </div>
        </div>
    </div>

    <script>
        /** 
         * NEON ZIGZAG: DIAGONAL RUSH
         * Mechanic: Diagonal Movement through Slanted Obstacles
         */

        /* --- 1. CONFIG & ASSETS --- */
        const CONFIG = {
            verticalSpeedRatio: 0.85, // Player vertical speed relative to forward speed
            gameSpeedStart: 6,
            obstacleGap: 170, // Narrower gap for "estrechamente"
            obstacleWidth: 140, // Wider obstacles to emphasize the tunnel effect
            obstacleSpacing: 400, // Distance between obstacles
            colors: {
                player: '#7cf7ff',
                playerCore: '#fff0a8',
                playerAccent: '#ff4dd8',
                trail: '#ff00ff',
                obstacleBody: '#160a28',
                obstacleBorder: '#ff4dd8',
                obstacleGlow: '#431c5d',
                obstacleEdge: '#7cf7ff'
            }
        };

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: { 
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                ascend: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"
            },
            gifs: {
                score: "https://i.giphy.com/1AjEBGWggGXh9onllB.webp",
                fail: "https://i.giphy.com/3qKs2fWAFDCJQmndSt.webp"
            }
        };

        /* --- 2. AUDIO SYSTEM --- */
        class AudioController {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';

                this.sfx = {};
                this.lastPlayed = {};
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const sound = new Audio(url);
                    sound.preload = 'auto';
                    this.sfx[key] = sound;
                }
                this.enabled = true;
            }

            unlock() {
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            resume() {
                this.unlock();
                if (this.bgm.paused) {
                    this.bgm.play().catch(() => {});
                }
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                if (!this.enabled) return;
                const sound = this.sfx[key];
                if (!sound) return;

                const now = performance.now();
                const minGap = options.minGap ?? 90;
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < minGap) return;
                this.lastPlayed[key] = now;

                const clone = sound.cloneNode();
                clone.volume = options.volume ?? 0.55;
                clone.play().catch(() => {});
            }
        }

        /* --- 3. GAME ENGINE --- */
        const canvas = document.getElementById('gameCanvas');
        const gameContainer = document.getElementById('game-container');
        const ctx = canvas.getContext('2d', { alpha: true });
        let width, height;
        let audio;
        let scoreGifTimer = 0;
        let failGifTimer = 0;
        let lastAscendAt = 0;

        // State
        let state = {
            active: false,
            frames: 0,
            score: 0,
            speed: CONFIG.gameSpeedStart,
            isAscending: false,
            distance: 0
        };

        // Entities
        let player = {
            x: 0,
            y: 0,
            radius: 12, // Slightly smaller radius for tighter gaps
            rotation: 0
        };

        let obstacles = [];
        let trail = []; 
        let particles = [];

        const scoreGifEl = document.getElementById('score-gif');
        const failGifEl = document.getElementById('fail-gif');

        function flashGif(element, duration = 900) {
            if (!element) return;
            element.classList.add('show');
            if (element === scoreGifEl) {
                clearTimeout(scoreGifTimer);
                scoreGifTimer = window.setTimeout(() => element.classList.remove('show'), duration);
            } else if (element === failGifEl) {
                clearTimeout(failGifTimer);
                failGifTimer = window.setTimeout(() => element.classList.remove('show'), duration);
            }
        }

        function hideGif(element) {
            if (element) element.classList.remove('show');
        }

        /* --- 4. INITIALIZATION & RESIZE --- */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Adjust player X based on screen width
            if (!state.active) {
                player.x = width * 0.2;
                player.y = height * 0.5;
            }
        }

        function initGame() {
            state.active = true;
            state.frames = 0;
            state.score = 0;
            state.speed = CONFIG.gameSpeedStart;
            state.isAscending = false;
            state.distance = 0;
            
            player.y = height * 0.5;
            player.x = width * 0.2;
            player.rotation = 0;

            obstacles = [];
            trail = [];
            particles = [];
            hideGif(failGifEl);
            hideGif(scoreGifEl);
            lastAscendAt = 0;
            
            // Initial trail point
            trail.push({x: player.x, y: player.y});
            
            document.getElementById('score').innerText = '0';
        }

        /* --- 5. LOGIC --- */
        function spawnObstacle() {
            // Determine random slope for the tunnel
            // Slope is dy/dx. 
            // Max playable slope depends on player speed ratio (0.85). 
            // We keep it slightly lower to ensure it's passable.
            const maxSlope = 0.6; 
            const slope = (Math.random() * maxSlope * 2) - maxSlope;

            // Determine entry height (left side of obstacle)
            // Ensure both entry and exit (right side) are within screen bounds
            const w = CONFIG.obstacleWidth;
            const yChange = slope * w;
            
            const minH = height * 0.15;
            const maxH = height * 0.85;
            
            // Safe range for the Gap Center
            // We need:
            // gapCenterLeft > minH + gap/2
            // gapCenterLeft < maxH - gap/2
            // gapCenterRight > minH + gap/2
            // gapCenterRight < maxH - gap/2
            
            const safeBuffer = CONFIG.obstacleGap / 2 + 20;
            const minSafeY = minH + safeBuffer;
            const maxSafeY = height - minH - safeBuffer;

            // We pick a random Y for the LEFT side, but constrain it so the RIGHT side is also valid
            // leftY + yChange = rightY
            // so: minSafeY <= leftY <= maxSafeY
            // AND: minSafeY <= leftY + yChange <= maxSafeY
            
            const validMin = Math.max(minSafeY, minSafeY - yChange);
            const validMax = Math.min(maxSafeY, maxSafeY - yChange);

            if (validMin > validMax) {
                // Should rarely happen with current params, but fallback to flat if calculation fails
                const safeY = height / 2;
                obstacles.push({
                    x: width,
                    w: w,
                    gapCenterY: safeY,
                    slope: 0,
                    passed: false
                });
                return;
            }

            const gapCenterY = Math.random() * (validMax - validMin) + validMin;

            obstacles.push({
                x: width,
                w: w,
                gapCenterY: gapCenterY,
                slope: slope,
                passed: false
            });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function update() {
            if (!state.active) return;

            state.frames++;
            state.distance += state.speed;
            
            // Speed scaling
            if (state.frames % 600 === 0) state.speed += 0.4;

            // --- MOVEMENT ---
            const vSpeed = state.speed * CONFIG.verticalSpeedRatio;
            
            if (state.isAscending) {
                player.y -= vSpeed;
                player.rotation = -Math.PI / 8; 
            } else {
                player.y += vSpeed;
                player.rotation = Math.PI / 8; 
            }

            // --- TRAIL ---
            for (let i = trail.length - 1; i >= 0; i--) {
                trail[i].x -= state.speed;
                if (trail[i].x < -50) trail.splice(i, 1);
            }
            if (state.frames % 2 === 0) trail.push({x: player.x, y: player.y});

            // --- PARTICLES ---
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // --- BOUNDS CHECK (Floor/Ceiling) ---
            if (player.y < player.radius || player.y > height - player.radius) {
                gameOver();
                return;
            }

            // --- OBSTACLES SPAWN ---
            // Spawn based on distance traveled to keep spacing consistent regardless of speed
            const lastObs = obstacles[obstacles.length - 1];
            if (!lastObs || (width - lastObs.x > CONFIG.obstacleSpacing)) {
                spawnObstacle();
            }

            // --- OBSTACLES UPDATE & COLLISION ---
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= state.speed;

                // Collision Logic for Slanted Gap
                // Check if player X is within the horizontal range of the obstacle
                // We add a small buffer to the hitbox to make it feel "fair" (slightly forgiving)
                const hitBuffer = player.radius * 0.5; 

                if (player.x + hitBuffer > obs.x && player.x - hitBuffer < obs.x + obs.w) {
                    
                    // Calculate the Y position of the gap center at the player's current X
                    // y = y_start + slope * (x_current - x_start)
                    const dx = player.x - obs.x;
                    const currentGapCenter = obs.gapCenterY + (obs.slope * dx);
                    
                    const gapTop = currentGapCenter - CONFIG.obstacleGap / 2;
                    const gapBottom = currentGapCenter + CONFIG.obstacleGap / 2;

                    // Check vertical collision
                    // If player is ABOVE the gap top OR BELOW the gap bottom
                    if (player.y - player.radius < gapTop || player.y + player.radius > gapBottom) {
                        createParticles(player.x, player.y, CONFIG.colors.player);
                        gameOver();
                        return;
                    }
                }

                // Score Logic
                if (!obs.passed && player.x > obs.x + obs.w) {
                    obs.passed = true;
                    state.score++;
                    document.getElementById('score').innerText = state.score;
                    audio.playSFX('score', { volume: 0.5, minGap: 120 });
                    flashGif(scoreGifEl, 820);
                    
                    // UI Juice
                    const scoreEl = document.getElementById('score');
                    scoreEl.classList.add('score-flash');
                    setTimeout(() => {
                        scoreEl.classList.remove('score-flash');
                    }, 100);
                }

                if (obs.x < -300) obstacles.splice(i, 1);
            }
        }

        /* --- 6. RENDER --- */
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // --- DRAW TRAIL ---
            if (trail.length > 1) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    // Quadratic bezier for smoothness
                    // const xc = (trail[i].x + trail[i+1].x) / 2;
                    // const yc = (trail[i].y + trail[i+1].y) / 2;
                    // ctx.quadraticCurveTo(trail[i].x, trail[i].y, xc, yc);
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = CONFIG.colors.trail;
                ctx.strokeStyle = CONFIG.colors.trail;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.restore();
            }

            // --- DRAW OBSTACLES (Polygons) ---
            ctx.shadowBlur = 15;
            ctx.shadowColor = CONFIG.colors.obstacleGlow;
            
            obstacles.forEach(obs => {
                const gapHalf = CONFIG.obstacleGap / 2;
                
                // Calculate corners
                const yTopLeft = obs.gapCenterY - gapHalf;
                const yBottomLeft = obs.gapCenterY + gapHalf;
                
                const yTopRight = (obs.gapCenterY + obs.slope * obs.w) - gapHalf;
                const yBottomRight = (obs.gapCenterY + obs.slope * obs.w) + gapHalf;

                // Draw Top Polygon
                const topGradient = ctx.createLinearGradient(obs.x, 0, obs.x + obs.w, yTopRight);
                topGradient.addColorStop(0, '#12061f');
                topGradient.addColorStop(1, CONFIG.colors.obstacleBody);
                ctx.fillStyle = topGradient;
                ctx.strokeStyle = CONFIG.colors.obstacleBorder;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(obs.x, 0);
                ctx.lineTo(obs.x + obs.w, 0);
                ctx.lineTo(obs.x + obs.w, yTopRight);
                ctx.lineTo(obs.x, yTopLeft);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Draw Bottom Polygon
                const bottomGradient = ctx.createLinearGradient(obs.x, yBottomLeft, obs.x + obs.w, height);
                bottomGradient.addColorStop(0, CONFIG.colors.obstacleBody);
                bottomGradient.addColorStop(1, '#09030f');
                ctx.fillStyle = bottomGradient;
                ctx.beginPath();
                ctx.moveTo(obs.x, yBottomLeft);
                ctx.lineTo(obs.x + obs.w, yBottomRight);
                ctx.lineTo(obs.x + obs.w, height);
                ctx.lineTo(obs.x, height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Diagonal Danger Stripes on the inner faces
                ctx.save();
                ctx.clip(); // Clip to the last path (bottom polygon) or we can just draw lines
                // Actually, let's just draw a highlight line on the gap edge
                ctx.strokeStyle = CONFIG.colors.obstacleEdge;
                ctx.lineWidth = 3;
                
                // Top edge highlight
                ctx.beginPath();
                ctx.moveTo(obs.x, yTopLeft);
                ctx.lineTo(obs.x + obs.w, yTopRight);
                ctx.stroke();

                // Bottom edge highlight
                ctx.beginPath();
                ctx.moveTo(obs.x, yBottomLeft);
                ctx.lineTo(obs.x + obs.w, yBottomRight);
                ctx.stroke();
                ctx.restore();
            });
            ctx.shadowBlur = 0;

            // --- DRAW PARTICLES ---
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // --- DRAW PLAYER ---
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);
            
            // Glow
            ctx.shadowBlur = 25;
            ctx.shadowColor = CONFIG.colors.player;
            
            // Body (Comet Dart)
            ctx.fillStyle = '#02030a';
            ctx.strokeStyle = CONFIG.colors.player;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(16, 0); 
            ctx.lineTo(-5, -11);
            ctx.lineTo(-12, -4);
            ctx.lineTo(-12, 4);
            ctx.lineTo(-5, 11);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Accent fin
            ctx.strokeStyle = CONFIG.colors.playerAccent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-9, -7);
            ctx.lineTo(-3, 0);
            ctx.lineTo(-9, 7);
            ctx.stroke();

            // Core
            ctx.fillStyle = CONFIG.colors.playerCore;
            ctx.beginPath();
            ctx.arc(-1, 0, 4.5, 0, Math.PI*2);
            ctx.fill();

            // Canopy highlight
            ctx.fillStyle = 'rgba(124, 247, 255, 0.5)';
            ctx.beginPath();
            ctx.ellipse(4, -1, 4.5, 3, -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            if (state.active) requestAnimationFrame(loop);
        }

        function gameOver() {
            state.active = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.65, minGap: 300 });
            flashGif(failGifEl, 1800);
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = state.score;
        }

        /* --- 7. INPUT HANDLING --- */
        function handleInputStart(e) {
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
            if (e.type === 'touchstart') e.preventDefault();
            
            if (state.active) {
                state.isAscending = true;
                const now = performance.now();
                if (now - lastAscendAt > 180) {
                    audio.playSFX('ascend', { volume: 0.24, minGap: 180 });
                    lastAscendAt = now;
                }
            }
        }

        function handleInputEnd(e) {
            state.isAscending = false;
        }

        gameContainer.style.touchAction = 'none';
        gameContainer.addEventListener('mousedown', handleInputStart);
        gameContainer.addEventListener('touchstart', handleInputStart, { passive: false });
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchend', handleInputEnd);
        window.addEventListener('resize', resize);

        /* --- 8. UI BINDING --- */
            document.addEventListener('DOMContentLoaded', () => {
                audio = new AudioController();
                resize();

                // [agent-note][stage4] repaired: font-remap + mobile-tap-safety | fonts: Press Start 2P + Orbitron from catalogs/fonts.json | input: touch suppression scoped to game surface
                scoreGifEl.querySelector('img').src = ASSETS.gifs.score;
                failGifEl.querySelector('img').src = ASSETS.gifs.fail;

                // Start Button
                document.getElementById('start-btn').addEventListener('click', () => {
                    audio.unlock();
                    audio.playSFX('start', { volume: 0.55, minGap: 250 });
                    audio.resume();
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('hud').classList.remove('hidden');
                    document.getElementById('tutorial').classList.remove('hidden');
                    
                    setTimeout(() => {
                        document.getElementById('tutorial').classList.add('hidden');
                    }, 2500);

                    initGame();
                    loop();
                });

                // Restart Button
                document.getElementById('restart-btn').addEventListener('click', () => {
                    audio.unlock();
                    audio.playSFX('click', { volume: 0.45, minGap: 200 });
                    document.getElementById('game-over-screen').classList.add('hidden');
                    document.getElementById('hud').classList.remove('hidden');
                    audio.resume();
                    initGame();
                    loop();
                });
            });

    </script>
