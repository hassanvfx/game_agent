<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Block Runner: Trap Course</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --title-font: 'Audiowide', system-ui, sans-serif;
            --ui-font: 'Rajdhani', system-ui, sans-serif;
            --panel-bg: rgba(17, 22, 47, 0.84);
            --panel-border: #8af8ff;
            --button-border: #173061;
            --button-bg: linear-gradient(180deg, #ffe572 0%, #ff9f43 100%);
            --button-bg-hover: linear-gradient(180deg, #fff2a2 0%, #ffb55d 100%);
            --hud-bg: rgba(11, 18, 39, 0.78);
            --text-main: #f7fbff;
            --text-accent: #8af8ff;
            --danger: #ff6b7f;
            --shadow-deep: rgba(4, 11, 28, 0.5);
            --sky-top: #1d2960;
            --sky-bottom: #5f49c7;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: var(--ui-font);
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.18), transparent 18%),
                radial-gradient(circle at 80% 12%, rgba(138, 248, 255, 0.14), transparent 16%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%, #120d33 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.16) 0 2px, transparent 3px),
                radial-gradient(circle at 35% 12%, rgba(138, 248, 255, 0.35) 0 1px, transparent 2px),
                radial-gradient(circle at 68% 18%, rgba(255, 255, 255, 0.14) 0 2px, transparent 3px),
                radial-gradient(circle at 88% 10%, rgba(255, 229, 114, 0.28) 0 2px, transparent 3px);
            opacity: 0.9;
        }

        #game-container::after {
            background: linear-gradient(180deg, transparent 0%, rgba(9, 12, 30, 0.08) 55%, rgba(4, 8, 20, 0.24) 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(0.8rem, env(safe-area-inset-top)) max(0.8rem, env(safe-area-inset-right)) max(0.8rem, env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(28, 37, 79, 0.95), rgba(12, 18, 43, 0.92));
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 3px solid var(--panel-border);
            border-radius: 1.15rem;
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.08) inset,
                0 18px 40px var(--shadow-deep),
                0 0 24px rgba(138, 248, 255, 0.18);
            padding: 1.55rem;
            text-align: center;
            pointer-events: auto;
            max-width: min(92vw, 28rem);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "🟨  🤖  💎";
            position: absolute;
            top: 0.7rem;
            right: 0.9rem;
            font-size: 0.95rem;
            letter-spacing: 0.22rem;
            opacity: 0.72;
        }

        .title {
            margin: 0 0 0.75rem;
            color: var(--text-main);
            font-family: var(--title-font);
            font-size: clamp(1.7rem, 6vw, 3rem);
            line-height: 1.05;
            letter-spacing: 0.08em;
            text-shadow:
                0 0 12px rgba(138, 248, 255, 0.18),
                0 3px 0 rgba(7, 14, 31, 0.9);
        }

        .subtitle {
            margin: 0 0 1.25rem;
            color: #d7ebff;
            font-size: clamp(0.95rem, 2.8vw, 1.15rem);
            line-height: 1.45;
            font-weight: 600;
        }

        .result-title {
            color: var(--danger);
        }

        .score-line {
            color: #fff9e8;
            font-size: clamp(1rem, 2.8vw, 1.35rem);
            margin: 0 0 1.25rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .pixel-btn {
            border: 0;
            border-bottom: 4px solid var(--button-border);
            box-shadow:
                0 10px 24px rgba(6, 10, 28, 0.28),
                0 0 0 2px rgba(255, 255, 255, 0.12) inset;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, background 0.12s ease;
            background: var(--button-bg);
            color: #13203d;
            font-family: var(--title-font);
            font-size: clamp(0.92rem, 2.5vw, 1.1rem);
            letter-spacing: 0.08em;
            padding: 0.9rem 1.35rem;
            border-radius: 999px;
            cursor: pointer;
            min-width: 11rem;
        }

        .pixel-btn:hover {
            background: var(--button-bg-hover);
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        .pixel-btn:active {
            transform: translateY(2px);
            box-shadow:
                0 4px 12px rgba(6, 10, 28, 0.2),
                0 0 0 2px rgba(255, 255, 255, 0.12) inset;
        }

        .hidden {
            display: none !important;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--text-main);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.92rem, 2.3vw, 1.1rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            background: var(--hud-bg);
            border: 2px solid rgba(138, 248, 255, 0.72);
            border-radius: 999px;
            padding: 0.45rem 0.85rem;
            box-shadow:
                0 8px 18px rgba(5, 10, 24, 0.35),
                0 0 16px rgba(138, 248, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #feedback-strip {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(24vw, 7rem);
            min-width: 4.25rem;
            aspect-ratio: 1;
            padding: 0.45rem;
            border-radius: 1rem;
            border: 2px solid rgba(138, 248, 255, 0.55);
            background: rgba(10, 16, 36, 0.62);
            box-shadow: 0 12px 26px rgba(5, 10, 24, 0.34);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
            opacity: 0;
            transform: translateY(0.5rem) scale(0.94);
            transition: opacity 0.2s ease, transform 0.2s ease;
            overflow: hidden;
        }

        #feedback-strip.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #feedback-strip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.7rem;
            display: block;
        }

        .hud-icon {
            width: 1.1rem;
            height: 1.1rem;
            display: inline-grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #7cf6ff 36%, #1ed3e8 100%);
            box-shadow: 0 0 12px rgba(124, 246, 255, 0.45);
        }

        .hud-icon::before {
            content: "◆";
            font-size: 0.78rem;
            color: #08314b;
            line-height: 1;
        }

        #score {
            min-width: 2ch;
            color: #fffaf0;
        }

        @media (max-width: 640px) {
            .glass-panel {
                padding: 1.25rem 1.05rem 1.15rem;
                max-width: min(92vw, 24rem);
            }

            .glass-panel::before {
                top: 0.55rem;
                right: 0.75rem;
                font-size: 0.82rem;
                letter-spacing: 0.16rem;
            }

            #hud {
                top: 0.75rem;
                left: 0.75rem;
                padding: 0.38rem 0.72rem;
            }

            #feedback-strip {
                right: 0.75rem;
                bottom: 0.75rem;
                width: min(23vw, 5.25rem);
                min-width: 3.75rem;
                padding: 0.3rem;
            }

            .pixel-btn {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <!-- [agent-note][stage1] role: future-audio | trigger: collect-diamond | intent: make pickups feel more rewarding -->
            <div id="start-screen" class="glass-panel">
                <h1 class="title">NEON RUNNER</h1>
                <p class="subtitle">Guide the stunt bot over trap blocks and grab bright diamonds to push your run score higher.</p>
                <button id="start-btn" class="pixel-btn">START RUN</button>
            </div>

            <!-- [agent-note][stage1] role: future-gif | trigger: game-over-state | intent: emphasize wipeout moment without changing gameplay -->
            <div id="game-over-screen" class="hidden glass-panel">
                <h2 class="title result-title">RUN OVER</h2>
                <div class="score-line">Run Score: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="pixel-btn">RUN AGAIN</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-icon"></div>
                <span id="score">0</span>
            </div>

            <!-- [agent-note][stage3] resolved-gif: pickup-and-wipeout-feedback -> catalogs/gifs.json -->
            <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
            <div id="feedback-strip" aria-hidden="true">
                <img id="feedback-gif" alt="" />
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            },
            gifs: {
                collect: "https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.audioEnabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayTimes = {};
                this.sfxVolumes = {
                    start: 0.62,
                    jump: 0.52,
                    land: 0.38,
                    collect: 0.62,
                    fail: 0.7,
                    hit: 0.6,
                    ui: 0.5
                };
                this.cooldowns = {
                    jump: 120,
                    land: 110,
                    collect: 100,
                    ui: 120
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const el = new Audio(v);
                    el.preload = 'auto';
                    this.sfx[k] = el;
                }
            }

            unlock() {
                this.audioEnabled = true;
            }

            playBGM() {
                if (!this.audioEnabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.audioEnabled || !this.sfx[key]) return;
                const now = performance.now();
                const cooldown = this.cooldowns[key] || 0;
                if (cooldown && this.lastPlayTimes[key] && now - this.lastPlayTimes[key] < cooldown) return;
                this.lastPlayTimes[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolumes[key] ?? 0.6;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        const feedbackStrip = document.getElementById('feedback-strip');
        const feedbackGif = document.getElementById('feedback-gif');
        let feedbackTimer = null;

        function showFeedbackGif(type, duration = 1500) {
            const src = ASSETS.gifs[type];
            if (!src || !feedbackGif) return;
            feedbackGif.src = src;
            feedbackStrip.classList.add('visible');
            window.clearTimeout(feedbackTimer);
            feedbackTimer = window.setTimeout(() => {
                feedbackStrip.classList.remove('visible');
            }, duration);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;
        let gameSpeed = 5;
        let wasGrounded = false;

        const ENABLE_ANIMATIONS = true;

        // Entities
        let player = {
            x: 50, y: 0, w: 40, h: 40,
            dy: 0, jumpForce: -14, gravity: 0.7, grounded: false,
            colorHead: '#FFE2B8', colorBody: '#4BC0FF', colorLegs: '#19254F'
        };

        let obstacles = []; // {type: 'cactus'|'tnt'|'pit', x, y, w, h, collected}
        let particles = []; // {x, y, dx, dy, life, color}
        let clouds = []; // {x, y, w, h, speed}

        // Colors
        const COLORS = {
            sky: '#4F46B8',
            grass: '#4AD66D',
            dirt: '#2B2A5A',
            cactus: '#30D27C',
            tnt: '#FF5C70',
            tntLabel: '#FFFFFF',
            diamond: '#7CF6FF',
            glow: '#FFE572',
            track: '#12183B'
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            groundY = height - 100;
        }
        let groundY = 0;
        window.addEventListener('resize', resize);
        resize();

        /** 4. PARALLAX & GENERATION */
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2),
                    w: 60 + Math.random() * 100,
                    h: 30 + Math.random() * 30,
                    speed: 0.5 + Math.random() * 0.5
                });
            }
        }

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function drawGlowRect(x, y, w, h, color, blur = 14) {
            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = blur;
            drawRect(x, y, w, h, color);
            ctx.restore();
        }

        function spawnObstacle() {
            const typeRoll = Math.random();
            let obs = { x: width, w: 40, h: 40, collected: false };

            if (typeRoll < 0.4) {
                obs.type = 'cactus';
                obs.y = groundY - 40;
                obs.color = COLORS.cactus;
            } else if (typeRoll < 0.6) {
                obs.type = 'tnt';
                obs.y = groundY - 40;
                obs.color = COLORS.tnt;
            } else if (typeRoll < 0.8) {
                obs.type = 'diamond';
                obs.y = groundY - 120 - (Math.random() * 50);
                obs.w = 30;
                obs.h = 30;
                obs.color = COLORS.diamond;
            } else {
                obs.type = 'lava';
                obs.y = groundY - 20;
                obs.h = 20;
                obs.color = '#FF6A00';
            }
            obstacles.push(obs);
        }

        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 8 + 4
                });
            }
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            frame = 0;
            gameSpeed = 6;
            player.y = groundY - 100;
            player.dy = 0;
            obstacles = [];
            particles = [];
            initClouds();
            document.getElementById('score').innerText = score;
            feedbackStrip.classList.remove('visible');
            wasGrounded = false;
        }

        function updatePlayer() {
            const previouslyGrounded = player.grounded;
            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y + player.h >= groundY) {
                player.y = groundY - player.h;
                player.dy = 0;
                player.grounded = true;
                if (!previouslyGrounded && wasGrounded !== true) {
                    audio.playSFX('land');
                    wasGrounded = true;
                }
            } else {
                player.grounded = false;
                wasGrounded = false;
            }
        }

        function jump() {
            if (player.grounded) {
                player.dy = player.jumpForce;
                player.grounded = false;
                wasGrounded = false;
                audio.playSFX('jump');
                createParticles(player.x + player.w / 2, player.y + player.h, '#9DEBFF', 5);
            }
        }

        function drawPlayer() {
            const idleBounce = ENABLE_ANIMATIONS ? Math.sin(frame * 0.16) * 2 : 0;
            const runSwing = ENABLE_ANIMATIONS ? Math.sin(frame * 0.22) * 5 : 0;
            const botY = player.y + idleBounce;

            drawGlowRect(player.x + 2, botY + 6, player.w - 4, 6, 'rgba(124, 246, 255, 0.24)', 10);
            drawRect(player.x + 8, botY - 4, 24, 8, COLORS.glow);
            drawRect(player.x + 6, botY + 4, 28, 10, player.colorHead);
            drawRect(player.x + 4, botY + 14, 32, 14, player.colorBody);
            drawRect(player.x + 8, botY + 28, 8, 12, player.colorLegs);
            drawRect(player.x + 24, botY + 28, 8, 12, player.colorLegs);

            drawRect(player.x + 10, botY + 8, 6, 4, '#13203D');
            drawRect(player.x + 24, botY + 8, 6, 4, '#13203D');
            drawRect(player.x + 11, botY + 9, 3, 2, '#7CF6FF');
            drawRect(player.x + 25, botY + 9, 3, 2, '#7CF6FF');

            drawRect(player.x + 4, botY + 18, 6, 6, player.colorHead);
            drawRect(player.x + 30, botY + 18, 6, 6, player.colorHead);
            drawRect(player.x + 10 + runSwing, botY + 16, 7, 12, player.colorHead);
        }

        function drawEnvironment() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#1E2D6D');
            skyGradient.addColorStop(0.58, COLORS.sky);
            skyGradient.addColorStop(1, '#140E34');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.w < 0) c.x = width;
                drawRect(c.x, c.y, c.w, c.h, 'rgba(239, 248, 255, 0.85)');
                drawRect(c.x + 12, c.y - 8, c.w * 0.45, c.h * 0.9, 'rgba(255, 255, 255, 0.62)');
                drawRect(c.x + c.w * 0.45, c.y - 4, c.w * 0.32, c.h * 0.78, 'rgba(255, 255, 255, 0.56)');
            });

            const skylineBase = groundY - 110;
            for (let x = 0; x < width + 80; x += 70) {
                const heightOffset = 20 + ((x / 70) % 3) * 16;
                drawRect(x, skylineBase + 20 - heightOffset, 42, heightOffset + 10, 'rgba(31, 41, 89, 0.45)');
                drawRect(x + 8, skylineBase + 8 - heightOffset, 8, 8, 'rgba(255, 229, 114, 0.25)');
            }

            const groundOffset = (frame * gameSpeed) % 40;

            ctx.fillStyle = COLORS.grass;
            ctx.fillRect(0, groundY, width, 16);

            ctx.fillStyle = '#1FCB77';
            for (let x = -groundOffset; x < width; x += 20) {
                drawRect(x, groundY - 6, 10, 6, '#62F09B');
            }

            ctx.fillStyle = COLORS.track;
            ctx.fillRect(0, groundY + 16, width, 24);

            ctx.fillStyle = COLORS.dirt;
            ctx.fillRect(0, groundY + 40, width, height - (groundY + 40));

            ctx.strokeStyle = 'rgba(106, 205, 255, 0.14)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = -groundOffset; x < width; x += 40) {
                ctx.moveTo(x, groundY + 16);
                ctx.lineTo(x + 12, height);
            }
            ctx.stroke();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            frame++;

            if (frame % 600 === 0) gameSpeed += 0.5;

            drawEnvironment();
            updatePlayer();
            drawPlayer();

            if (frame % Math.floor(1000 / gameSpeed) === 0 || (Math.random() < 0.01 && frame > 100)) {
                if (obstacles.length === 0 || width - obstacles[obstacles.length - 1].x > 250) {
                    spawnObstacle();
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (obs.type === 'cactus') {
                    drawGlowRect(obs.x + 10, obs.y, 20, 40, COLORS.cactus, 8);
                    drawRect(obs.x + 6, obs.y + 6, 8, 22, '#9AFFC2');
                    drawRect(obs.x + 22, obs.y + 12, 8, 16, '#118C4E');
                    drawRect(obs.x, obs.y + 12, 10, 10, COLORS.cactus);
                    drawRect(obs.x + 30, obs.y + 8, 10, 10, COLORS.cactus);
                } else if (obs.type === 'tnt') {
                    drawGlowRect(obs.x, obs.y, 40, 40, COLORS.tnt, 10);
                    drawRect(obs.x + 4, obs.y + 4, 32, 32, '#8A1022');
                    ctx.fillStyle = 'white';
                    ctx.font = '700 16px var(--title-font), system-ui, sans-serif';
                    ctx.fillText("TNT", obs.x + 8, obs.y + 24);
                    if (Math.random() > 0.5) drawRect(obs.x + 18, obs.y - 6, 4, 6, '#FFE572');
                } else if (obs.type === 'lava') {
                    drawGlowRect(obs.x, obs.y, 40, 20, '#FF6A00', 12);
                    drawRect(obs.x + 4, obs.y + 4, 32, 8, '#FFE572');
                    if (Math.random() > 0.8) drawRect(obs.x + Math.random() * 30, obs.y - 5, 4, 4, '#FFF2A2');
                } else if (obs.type === 'diamond') {
                    let offset = Math.sin(frame * 0.1) * 5;
                    drawGlowRect(obs.x + 8, obs.y + offset + 4, 14, 14, COLORS.diamond, 14);
                    drawRect(obs.x + 10, obs.y + offset, 10, 10, '#D8FDFF');
                    drawRect(obs.x + 5, obs.y + offset + 10, 20, 10, COLORS.diamond);
                    drawRect(obs.x + 10, obs.y + offset + 20, 10, 10, '#47DDF0');
                }

                if (
                    player.x < obs.x + obs.w &&
                    player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.y + player.h > obs.y
                ) {
                    if (obs.type === 'diamond') {
                        if (!obs.collected) {
                            score += 100;
                            obs.collected = true;
                            audio.playSFX('collect');
                            showFeedbackGif('collect', 1200);
                            document.getElementById('score').innerText = score;
                            obstacles.splice(i, 1);
                            createParticles(obs.x, obs.y, COLORS.diamond, 5);
                        }
                    } else {
                        if (obs.type === 'tnt' || obs.type === 'lava') {
                            audio.playSFX('hit');
                        }
                        gameOver();
                        if (obs.type === 'tnt') createParticles(obs.x, obs.y, COLORS.tnt, 20);
                        return;
                    }
                }

                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.05;
                p.dy += 0.5;

                ctx.globalAlpha = p.life;
                drawRect(p.x, p.y, p.size, p.size, p.color);
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }

            if (frame % 10 === 0) {
                score++;
                document.getElementById('score').innerText = score;
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedbackGif('fail', 2200);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
            if (gameActive) jump();
        }

        window.addEventListener('keydown', handleInput);
        // [agent-note][stage4] repaired: mobile-tap-actionability | element: #start-btn | action: keep native tap lifecycle outside gameplay surface
        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            jump();
        }, { passive: false });
        canvas.addEventListener('mousedown', () => {
            if (gameActive) jump();
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('ui');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
