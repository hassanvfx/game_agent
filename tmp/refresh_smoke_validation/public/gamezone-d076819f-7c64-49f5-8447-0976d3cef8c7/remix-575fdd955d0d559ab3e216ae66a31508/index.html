<script>
/** 
 * CORE ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let animationId;
let lastTime = 0;

// Game State
const STATE = {
    MENU: 0,
    PLAYING: 1,
    SHOP: 2,
    GAMEOVER: 3
};
let currentState = STATE.MENU;

// Config Accessor
const getCfg = (key) => window.gameConfig ? window.gameConfig[key] : window.gameConfigDefs[key].value;

// Audio Manager
const AudioSys = {
    ctx: null,
    elements: {},
    hitCooldownUntil: 0,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.elements = {
                shoot: document.getElementById('sfx_shoot'),
                hit: document.getElementById('sfx_hit'),
                die: document.getElementById('sfx_die'),
                buy: document.getElementById('sfx_buy'),
                fail: document.getElementById('sfx_fail'),
                start: document.getElementById('sfx_start'),
                wave: document.getElementById('sfx_wave')
            };
            this.hitCooldownUntil = 0;
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    },
    play(id, vol=1, pitch=1) {
        const audio = this.elements[id];
        if (!audio) return;
        if (id === 'hit') {
            const now = performance.now();
            if (this.hitCooldownUntil && now < this.hitCooldownUntil) return;
            this.hitCooldownUntil = now + 70;
        }
        const instance = audio.cloneNode();
        instance.volume = Math.max(0, Math.min(vol, 1));
        instance.playbackRate = pitch;
        instance.play().catch(() => {});
    },
    playBGM() {
        const bgm = document.getElementById('bgm_battle');
        bgm.volume = 0.2;
        bgm.play().catch(()=>{});
    },
    stopBGM() {
        document.getElementById('bgm_battle').pause();
    }
};

// Input System
const Input = {
    active: false,
    x: 0, y: 0,
    originX: 0, originY: 0,
    dx: 0, dy: 0,
    init() {
        const h = (e) => {
            e.preventDefault();
            const t = e.touches ? e.touches[0] : e;
            const rect = canvas.getBoundingClientRect();
            const cx = t.clientX - rect.left;
            const cy = t.clientY - rect.top;

            if (e.type === 'pointerdown') {
                this.active = true;
                this.originX = cx;
                this.originY = cy;
                this.x = cx;
                this.y = cy;
            } else if (e.type === 'pointermove' && this.active) {
                this.x = cx;
                this.y = cy;
                this.dx = this.x - this.originX;
                this.dy = this.y - this.originY;
                // Clamp joystick visual logic here if needed
            } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
                this.active = false;
                this.dx = 0;
                this.dy = 0;
            }
        };
        canvas.addEventListener('pointerdown', h, { passive: false });
        window.addEventListener('pointermove', h, { passive: false });
        window.addEventListener('pointerup', h, { passive: false });
        window.addEventListener('pointercancel', h, { passive: false });
    }
};

// Game Objects
let hero = { x: 0, y: 0, hp: 100, maxHp: 100, weapon: 'revolver', ammo: 6, reloadTimer: 0 };
let zombies = [];
let bullets = [];
let particles = [];
let texts = [];
let wave = 1;
let score = 0;
let money = 0;
let waveTimer = 0;
let spawnTimer = 0;
let shake = 0;

// Inventory
let inventory = {
    hammer: 0,
    pearl: 0,
    crossbowUnlocked: false,
    revolverUnlocked: true // Default
};

// Weapon Stats
const WEAPONS = {
    revolver: { damage: 25, cd: 400, speed: 15, color: '#ffff00', pierce: 1, range: 400 },
    crossbow: { damage: 40, cd: 800, speed: 20, color: '#00ffff', pierce: 4, range: 600 }
};
let lastShotTime = 0;
let heroDamageCooldownUntil = 0;
let overlayTimers = {};

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initGame() {
    hero.x = window.innerWidth / 2;
    hero.y = window.innerHeight / 2;
    hero.hp = 100;
    hero.weapon = 'revolver';
    
    inventory.hammer = 0;
    inventory.pearl = 0;
    inventory.crossbowUnlocked = false;
    
    zombies = [];
    bullets = [];
    particles = [];
    texts = [];
    wave = 1;
    score = 0;
    money = 0;
    shake = 0;
    
    updateHUD();
    startWave();
}

function startWave() {
    currentState = STATE.PLAYING;
    waveTimer = 30000 + (wave * 5000); // Wave lasts longer each time
    spawnTimer = 0;
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('shop-screen').classList.add('hidden');
}

function spawnZombie() {
    const edge = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
    let zx, zy;
    const pad = 50;
    if (edge === 0) { zx = Math.random() * window.innerWidth; zy = -pad; }
    else if (edge === 1) { zx = window.innerWidth + pad; zy = Math.random() * window.innerHeight; }
    else if (edge === 2) { zx = Math.random() * window.innerWidth; zy = window.innerHeight + pad; }
    else { zx = -pad; zy = Math.random() * window.innerHeight; }

    const type = Math.random() < (0.1 * wave) ? 'tank' : 'normal';
    zombies.push({
        x: zx,
        y: zy,
        hp: type === 'tank' ? 100 + (wave * 20) : 30 + (wave * 10),
        maxHp: type === 'tank' ? 100 + (wave * 20) : 30 + (wave * 10),
        speed: type === 'tank' ? getCfg('zombieSpeed') * 0.5 : getCfg('zombieSpeed') + (Math.random() * 0.5),
        type: type,
        radius: type === 'tank' ? 25 : 15,
        color: type === 'tank' ? '#ff0055' : '#00ff55'
    });
}

function spawnParticle(x, y, color, count, speed) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const sp = Math.random() * speed;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * sp,
            vy: Math.sin(angle) * sp,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function spawnText(x, y, txt, color) {
    texts.push({ x, y, txt, color, life: 1.0, vy: -1 });
}

function showOverlay(id, duration = 700) {
    const node = document.getElementById(id);
    if (!node) return;
    node.classList.add('visible');
    clearTimeout(overlayTimers[id]);
    overlayTimers[id] = setTimeout(() => node.classList.remove('visible'), duration);
}

function showBanner(message, duration = 1300) {
    const banner = document.getElementById('wave-banner');
    if (!banner) return;
    banner.textContent = message;
    showOverlay('wave-banner', duration);
}

function useHammer() {
    if (inventory.hammer <= 0) {
        AudioSys.play('fail', 0.35, 1);
        return;
    }
    inventory.hammer--;
    updateHUD();
    
    shake = 20;
    AudioSys.play('wave', 0.45, 0.86);
    showOverlay('impact-gif', 720);
    
    // AOE
    const range = 200;
    let killed = 0;
    
    // Visual Shockwave
    particles.push({
        x: hero.x, y: hero.y,
        vx: 0, vy: 0, life: 0.5, color: '#ffaa00', size: 10, type: 'shockwave', r: 10
    });

    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const dx = z.x - hero.x;
        const dy = z.y - hero.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < range) {
            if (killed < 3) {
                z.hp = 0; // Instakill
                killed++;
            } else {
                // Pushback others
                const angle = Math.atan2(dy, dx);
                z.x += Math.cos(angle) * 100;
                z.y += Math.sin(angle) * 100;
            }
        }
    }
}

function usePearl() {
    if (inventory.pearl <= 0) {
        AudioSys.play('fail', 0.35, 1.08);
        return;
    }
    inventory.pearl--;
    updateHUD();
    
    spawnParticle(hero.x, hero.y, '#aa00ff', 20, 5);
    
    // Teleport to random safe spot
    hero.x = Math.random() * (window.innerWidth - 100) + 50;
    hero.y = Math.random() * (window.innerHeight - 100) + 50;
    
    shake = 5;
    AudioSys.play('buy', 0.7, 1.35);
    showOverlay('reward-gif', 900);
    spawnParticle(hero.x, hero.y, '#ffffff', 20, 5);
}

function update(dt) {
    if (currentState !== STATE.PLAYING) return;

    // Shake decay
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    // Movement
    if (Input.active) {
        const speed = getCfg('heroSpeed');
        const angle = Math.atan2(Input.dy, Input.dx);
        // Deadzone
        const dist = Math.sqrt(Input.dx*Input.dx + Input.dy*Input.dy);
        if (dist > 10) {
            hero.x += Math.cos(angle) * speed;
            hero.y += Math.sin(angle) * speed;
        }
    }
    
    // Clamp Hero
    hero.x = Math.max(20, Math.min(window.innerWidth - 20, hero.x));
    hero.y = Math.max(20, Math.min(window.innerHeight - 20, hero.y));

    // Spawning
    spawnTimer += dt;
    const rate = Math.max(200, getCfg('spawnRate') - (wave * 50));
    if (spawnTimer > rate) {
        spawnZombie();
        spawnTimer = 0;
    }

    // Auto Shoot
    const now = Date.now();
    const wStats = WEAPONS[hero.weapon];
    if (now - lastShotTime > wStats.cd) {
        // Find nearest
        let nearest = null;
        let minDst = wStats.range;
        for (const z of zombies) {
            const d = Math.sqrt((z.x-hero.x)**2 + (z.y-hero.y)**2);
            if (d < minDst) {
                minDst = d;
                nearest = z;
            }
        }
        
        if (nearest) {
            lastShotTime = now;
            const angle = Math.atan2(nearest.y - hero.y, nearest.x - hero.x);
            bullets.push({
                x: hero.x, y: hero.y,
                vx: Math.cos(angle) * wStats.speed,
                vy: Math.sin(angle) * wStats.speed,
                life: 100,
                damage: wStats.damage,
                pierce: wStats.pierce,
                color: wStats.color
            });
            AudioSys.play('shoot', 0.3, 1.0 + Math.random()*0.2);
            shake = 2;
        }
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        
        // Out of bounds
        if (b.x < 0 || b.x > window.innerWidth || b.y < 0 || b.y > window.innerHeight || b.life <= 0) {
            bullets.splice(i, 1);
            continue;
        }

        // Collision
        let hit = false;
        for (const z of zombies) {
            const dist = Math.sqrt((z.x - b.x)**2 + (z.y - b.y)**2);
            if (dist < z.radius + 5) {
                z.hp -= b.damage;
                spawnParticle(z.x, z.y, z.color, 3, 2);
                AudioSys.play('hit', 0.18, 0.96 + Math.random() * 0.16);
                hit = true;
                
                // Knockback
                const kAngle = Math.atan2(b.vy, b.vx);
                z.x += Math.cos(kAngle) * 10;
                z.y += Math.sin(kAngle) * 10;

                if (z.hp <= 0) {
                    // Kill logic handled in zombie loop to avoid double counting
                }
                break; // One hit per frame per bullet to avoid insta-pierce all in one tick logic issue? No, pierce handles this.
            }
        }
        
        if (hit) {
            b.pierce--;
            if (b.pierce <= 0) bullets.splice(i, 1);
        }
    }

    // Zombies
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        
        // Move to hero
        const angle = Math.atan2(hero.y - z.y, hero.x - z.x);
        z.x += Math.cos(angle) * z.speed;
        z.y += Math.sin(angle) * z.speed;
        
        // Collision with Hero
        const dist = Math.sqrt((z.x - hero.x)**2 + (z.y - hero.y)**2);
        if (dist < z.radius + 15) {
            hero.hp -= 0.5; // Drain HP
            shake = 5;
            const now = performance.now();
            if (now > heroDamageCooldownUntil) {
                heroDamageCooldownUntil = now + 350;
                AudioSys.play('fail', 0.22, 0.92);
            }
            if (hero.hp <= 0) gameOver();
        }
        
        // Death
        if (z.hp <= 0) {
            score += z.type === 'tank' ? 50 : 10;
            money += z.type === 'tank' ? 20 : 5;
            spawnParticle(z.x, z.y, '#ff0000', 10, 4);
            spawnText(z.x, z.y, "+$" + (z.type === 'tank' ? 20 : 5), '#ffff00');
            AudioSys.play('die', 0.4, 0.8 + Math.random()*0.4);
            zombies.splice(i, 1);
            updateHUD();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === 'shockwave') {
            p.r += 10;
            p.life -= 0.05;
        } else {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
        }
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Floating Text
    for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        t.y += t.vy;
        t.life -= 0.02;
        if (t.life <= 0) texts.splice(i, 1);
    }

    // Wave Logic
    waveTimer -= dt;
    if (waveTimer <= 0) {
        openShop();
    }
}

function draw() {
    // Clear
        const screenW = canvas.width / window.devicePixelRatio;
        const screenH = canvas.height / window.devicePixelRatio;

        const bgGradient = ctx.createLinearGradient(0, 0, 0, screenH);
        bgGradient.addColorStop(0, '#182347');
        bgGradient.addColorStop(0.55, '#0d1325');
        bgGradient.addColorStop(1, '#06070c');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, screenW, screenH);

        ctx.fillStyle = 'rgba(120, 231, 255, 0.035)';
        for (let i = 0; i < 18; i++) {
            const px = (i * 97 + wave * 23) % screenW;
            const py = (i * 53 + wave * 17) % screenH;
            ctx.beginPath();
            ctx.arc(px, py, 1.5 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Grid
        ctx.strokeStyle = 'rgba(120, 231, 255, 0.08)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    const offX = -hero.x * 0.1 % gridSize;
    const offY = -hero.y * 0.1 % gridSize;
    
    ctx.beginPath();
    for(let x=offX; x<canvas.width/window.devicePixelRatio; x+=gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    for(let y=offY; y<canvas.height/window.devicePixelRatio; y+=gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    ctx.save();
    // Camera Shake
    const dx = (Math.random() - 0.5) * shake;
    const dy = (Math.random() - 0.5) * shake;
    ctx.translate(dx, dy);

    // Draw Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        if (p.type === 'shockwave') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.stroke();
        } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
    }
    ctx.globalAlpha = 1;

    // Draw Bullets
    for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

        // Draw Zombies
        for (const z of zombies) {
            const jitter = Math.sin((Date.now() * 0.01) + z.x * 0.03) * 1.5;
            const isTank = z.type === 'tank';

            ctx.save();
            ctx.translate(z.x, z.y + jitter);
            ctx.shadowBlur = isTank ? 18 : 12;
            ctx.shadowColor = z.color;

            ctx.fillStyle = isTank ? '#4b1330' : '#173c2e';
            ctx.beginPath();
            ctx.roundRect(-z.radius, -z.radius, z.radius * 2, z.radius * 2, isTank ? 10 : 8);
            ctx.fill();

            ctx.strokeStyle = z.color;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = isTank ? '#ff7aa7' : '#7aff9f';
            ctx.beginPath();
            ctx.arc(-z.radius * 0.28, -3, 3, 0, Math.PI * 2);
            ctx.arc(z.radius * 0.28, -3, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#091018';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-z.radius * 0.45, z.radius * 0.15);
            ctx.lineTo(z.radius * 0.45, z.radius * 0.15);
            ctx.stroke();
            ctx.restore();

            // Health Bar
            const hpPct = z.hp / z.maxHp;
            ctx.fillStyle = 'rgba(20, 10, 25, 0.9)';
            ctx.fillRect(z.x - z.radius, z.y - z.radius - 10, z.radius * 2, 5);
            ctx.fillStyle = isTank ? '#ff4d6d' : '#61ff93';
            ctx.fillRect(z.x - z.radius, z.y - z.radius - 10, z.radius * 2 * hpPct, 5);
        }

        // Draw Hero
        const bob = Math.sin(Date.now() * 0.012) * 2;
        ctx.save();
        ctx.translate(hero.x, hero.y + bob);

        ctx.shadowBlur = 22;
        ctx.shadowColor = '#1dd9ff';
        ctx.fillStyle = '#1dd9ff';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f3fbff';
        ctx.beginPath();
        ctx.arc(-5, -4, 3.4, 0, Math.PI * 2);
        ctx.arc(5, -4, 3.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#08263b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-7, 5);
        ctx.quadraticCurveTo(0, 10, 7, 5);
        ctx.stroke();

        ctx.fillStyle = '#ff4fd8';
        ctx.beginPath();
        ctx.arc(0, -18, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(120, 231, 255, 0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        
        // Hero HP Ring
        ctx.strokeStyle = '#ff4d6d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(hero.x, hero.y + bob, 24, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * (hero.hp / hero.maxHp)));
        ctx.stroke();

    // Joystick Visual
    if (Input.active) {
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(Input.originX, Input.originY, 40, 0, Math.PI*2);
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(Input.originX + Input.dx, Input.originY + Input.dy, 15, 0, Math.PI*2);
        ctx.fill();
    }

    // Texts
    for (const t of texts) {
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.life;
        ctx.font = '16px "Bangers"';
        ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
}

function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    animationId = requestAnimationFrame(loop);
}

function updateHUD() {
    document.getElementById('wave-num').innerText = wave;
    document.getElementById('score-num').innerText = money;
    
    const btnHammer = document.getElementById('btn-hammer');
    const btnPearl = document.getElementById('btn-pearl');
    
    if (inventory.hammer > 0) {
        btnHammer.classList.remove('hidden');
        document.getElementById('hammer-count').innerText = inventory.hammer;
    } else {
        btnHammer.classList.add('hidden');
    }

    if (inventory.pearl > 0) {
        btnPearl.classList.remove('hidden');
        document.getElementById('pearl-count').innerText = inventory.pearl;
    } else {
        btnPearl.classList.add('hidden');
    }
}

function openShop() {
    currentState = STATE.SHOP;
    document.getElementById('shop-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('shop-next-wave').innerText = wave + 1;
    AudioSys.play('wave', 0.45, 1);
    showBanner('TREND CLEARED');
    showOverlay('reward-gif', 1200);
    
    // Shop Logic
    const btnCrossbow = document.getElementById('buy-crossbow');
    if (inventory.crossbowUnlocked) {
        btnCrossbow.classList.add('hidden');
    } else {
        btnCrossbow.classList.remove('hidden');
    }
}

function gameOver() {
    currentState = STATE.GAMEOVER;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-wave').innerText = wave;
    document.getElementById('hud').classList.add('hidden');
    showOverlay('impact-gif', 1100);
    showBanner('CHANNEL DOWN', 1400);
    AudioSys.play('fail', 0.45, 0.78);
    AudioSys.stopBGM();
}

// UI Bindings
document.addEventListener('DOMContentLoaded', () => {
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    for(let k in window.gameConfigDefs) window.gameConfig[k] = window.gameConfigDefs[k].value;

    resize();
    window.addEventListener('resize', resize);
    Input.init();
    AudioSys.init();

    // Start
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('ui-layer').classList.add('pointer-events-none');
        document.getElementById('start-screen').classList.add('hidden');
        AudioSys.play('start', 0.5, 1);
        AudioSys.playBGM();
        showBanner('STREAM ONLINE', 1000);
        initGame();
        lastTime = performance.now();
        loop(lastTime);
    });

    // Restart
    document.getElementById('restart-btn').addEventListener('click', () => {
        document.getElementById('game-over-screen').classList.add('hidden');
        AudioSys.play('start', 0.45, 0.94);
        AudioSys.playBGM();
        showBanner('REBOOTING FEED', 1000);
        initGame();
    });

    // Active Items
    document.getElementById('btn-hammer').addEventListener('pointerdown', (e) => { e.stopPropagation(); useHammer(); });
    document.getElementById('btn-pearl').addEventListener('pointerdown', (e) => { e.stopPropagation(); usePearl(); });

    // Shop Buttons
    const buy = (cost, action) => {
        if (money >= cost) {
            money -= cost;
            action();
            AudioSys.play('buy', 0.55, 1.04);
            showOverlay('reward-gif', 820);
            document.getElementById('score-num').innerText = money; // Update visual in shop if needed, though HUD hidden
            updateHUD();
            return true;
        }
        AudioSys.play('fail', 0.4, 1);
        showBanner('NOT ENOUGH CLOUT', 900);
        return false;
    };

    document.getElementById('buy-crossbow').addEventListener('click', () => {
        if (buy(500, () => {
            inventory.crossbowUnlocked = true;
            hero.weapon = 'crossbow';
            document.getElementById('buy-crossbow').classList.add('hidden');
        }));
    });

    document.getElementById('buy-hammer').addEventListener('click', () => {
        buy(150, () => inventory.hammer++);
    });

    document.getElementById('buy-pearl').addEventListener('click', () => {
        buy(100, () => inventory.pearl++);
    });

    document.getElementById('buy-heal').addEventListener('click', () => {
        buy(200, () => hero.hp = Math.min(hero.hp + 50, hero.maxHp));
    });

    document.getElementById('next-wave-btn').addEventListener('click', () => {
        wave++;
        AudioSys.play('wave', 0.35, 1.12);
        showBanner('TREND ' + wave + ' LIVE', 1000);
        startWave();
    });
});

</script>
