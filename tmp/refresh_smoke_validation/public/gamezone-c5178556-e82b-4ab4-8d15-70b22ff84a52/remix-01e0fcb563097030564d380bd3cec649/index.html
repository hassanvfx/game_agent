<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Living Sketchbook: Chatterbox Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #fff9ef;
        --bg-bottom: #ffe8ef;
        --panel-border: rgba(255, 255, 255, 0.62);
        --ink: #3f3558;
        --shadow-soft: 0 10px 30px rgba(91, 63, 130, 0.14);
        --shadow-strong: 0 16px 36px rgba(255, 111, 145, 0.18);
        --accent-gold: #ffd166;
    }
    /* Mobile Fundamentals */
    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        overflow: hidden; background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
        touch-action: auto; /* Preserve native button taps on mobile */
    }
    
    /* Canvas & Layers */
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }
    
    /* UI Styling */
    .glass {
        background:
            linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,248,254,0.76)),
            radial-gradient(circle at top left, rgba(255,209,102,0.18), transparent 45%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid var(--panel-border);
        box-shadow: var(--shadow-soft);
    }
    .btn-push {
        transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-push:active { transform: scale(0.92); }
    
    /* Paper Texture for Drawing Area */
    .paper-bg {
        background:
            radial-gradient(circle at top, rgba(255,255,255,0.96), rgba(255,251,247,0.92)),
            radial-gradient(#eadff8 1px, transparent 1px);
        background-size: auto, 20px 20px;
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    #game-container::before {
        background:
            radial-gradient(circle at 18% 18%, rgba(255, 209, 102, 0.24), transparent 22%),
            radial-gradient(circle at 80% 14%, rgba(164, 141, 255, 0.2), transparent 24%),
            radial-gradient(circle at 50% 92%, rgba(84, 216, 198, 0.18), transparent 28%);
    }

    #game-container::after {
        opacity: 0.3;
        background-image: radial-gradient(circle at center, rgba(255,255,255,0.7) 0 1px, transparent 1px);
        background-size: 32px 32px;
        mix-blend-mode: soft-light;
    }

    .mascot-chip {
        position: relative;
        overflow: hidden;
    }

    .mascot-chip::after {
        content: "✦";
        position: absolute;
        right: 0.55rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent-gold);
        font-size: 0.8rem;
        opacity: 0.95;
    }

    .story-panel {
        position: relative;
        overflow: hidden;
    }

    .story-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.14), transparent 52%);
        pointer-events: none;
    }

    .bubble-glow {
        box-shadow: 0 0 0 1px rgba(255,255,255,0.45), var(--shadow-strong);
    }

    /* Animations */
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .animate-float { animation: float 3s ease-in-out infinite; }
    
    /* Custom Range Slider */
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; height: 28px; width: 28px;
        border-radius: 50%; background: #FF6B6B; border: 3px solid #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2); margin-top: -12px;
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%; height: 6px; background: #e5e7eb; border-radius: 3px;
    }

    /* Speech Bubble Styling (rendered in Canvas, but font styles here for reference) */
    .hidden { display: none !important; }

    /* Minimal utility layer replacing the removed Tailwind runtime */
    .absolute { position: absolute; }
    .relative { position: relative; }

    .top-0 { top: 0; }
    .left-0 { left: 0; }

    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1 1 0%; }
    .items-center { align-items: center; }

    .pointer-events-auto { pointer-events: auto; }

    .shadow-sm { box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .shadow-md { box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
    .shadow-lg { box-shadow: 0 10px 24px rgba(0,0,0,0.12); }
    .shadow-xl { box-shadow: var(--shadow-strong); }
    .shadow-inner { box-shadow: inset 0 2px 12px rgba(91,63,130,0.12); }
    .shadow-\[0_-10px_40px_rgba\(0\,0\,0\,0\.05\)\] { box-shadow: 0 -12px 34px rgba(91,63,130,0.10); }
    .cursor-pointer { cursor: pointer; }
    .transform { transform: translateZ(0); }
    .transition-transform { transition: transform 0.15s ease; }
    .hover\:scale-110:hover { transform: scale(1.1); }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }
    .opacity-20 { opacity: 0.2; }
    .-inset-4 { inset: -1rem; }
    .safe-area-inset { padding-bottom: env(safe-area-inset-bottom, 0); }
    .font-display { font-family: 'Russo One', system-ui, sans-serif; letter-spacing: 0.06em; }
    .font-ui { font-family: 'Rajdhani', system-ui, sans-serif; }
    .gif-badge {
        position: absolute;

<body>

<div id="game-container">
    <!-- Main Game Canvas -->
    <canvas id="mainCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between safe-area-inset">
        
        <!-- Top Bar -->
        <div class="flex justify-between items-start p-4 pointer-events-auto">
            <div class="glass mascot-chip px-4 py-2 rounded-full flex items-center gap-2 animate-float">
                <div class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></div>
                <span class="text-gray-700 font-bold tracking-wide text-sm font-ui">LIVING SKETCHBOOK</span>
            </div>
            <button id="btn-sound" class="glass w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-sm btn-push">
                🔊
            </button>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 bg-[#FFFDF5] z-50 flex flex-col items-center justify-center pointer-events-auto p-6 text-center">
            <div class="glass story-panel bubble-glow rounded-3xl p-6 max-w-xs">
                <div class="mb-8 relative">
                    <div class="absolute -inset-4 bg-yellow-200 rounded-full opacity-20 animate-pulse"></div>
                    <h1 class="text-6xl font-bold text-[#FF6B6B] leading-tight relative z-10 font-display">Living<br>Sketchbook</h1>
                </div>
                <p class="text-gray-500 mb-8 text-lg max-w-xs font-ui">Draw a chatterbox doodle buddy.<br>Sketch snacks and tap for reactions.</p>
                <button id="btn-start" class="bg-[#FF6B6B] text-white text-xl px-10 py-5 rounded-full font-bold shadow-xl btn-push border-4 border-[#ff8787]">
                    OPEN THE PAGE

            </div>
        </div>

        <!-- Drawing UI (Overlay) -->
        <div id="drawing-ui" class="absolute inset-0 bg-[#FFFDF5] z-40 hidden flex flex-col pointer-events-auto">
            <div class="p-4 text-center pt-8">
                <h2 id="draw-title" class="text-3xl font-bold text-gray-700 font-display">Draw Your Star Doodle</h2>
                <p class="text-gray-400 text-sm mt-1 font-ui">Sketch inside the page to bring your chatterbox to life.</p>
            </div>
            
            <!-- Drawing Area -->
            <div class="flex-1 relative m-4 border-4 border-dashed border-gray-300 rounded-2xl paper-bg shadow-inner overflow-hidden touch-none" id="canvas-container">
                <!-- Canvas injected here -->
            </div>
            
            <!-- Tools -->
            <div class="p-6 glass rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex gap-3" id="color-palette">
                        <!-- Colors injected via JS -->
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                        <input type="range" id="brush-slider" min="5" max="40" value="12" class="w-24">

                <div class="flex gap-4">
                    <button id="btn-clear" class="flex-1 py-4 rounded-2xl bg-gray-100 font-bold text-gray-500 btn-push font-ui">RESET</button>
                    <button id="btn-done" class="flex-1 py-4 rounded-2xl bg-[#4ECDC4] font-bold text-white shadow-lg btn-push text-lg font-ui">DONE ✨</button>
                </div>

        </div>

        <!-- Gameplay HUD -->
        <div id="game-hud" class="absolute bottom-8 left-0 right-0 flex justify-center gap-4 pointer-events-auto hidden px-4">
            <button id="btn-feed" class="glass px-8 py-4 rounded-full font-bold text-gray-700 shadow-lg flex items-center gap-2 btn-push bg-orange-50/80 font-ui">
                ✏️ Sketch Snack
            </button>
            <button id="btn-pet" class="glass px-8 py-4 rounded-full font-bold text-gray-700 shadow-lg flex items-center gap-2 btn-push bg-pink-50/80 font-ui">
                👋 Cheer Up
            </button>
        </div>

        <!-- [agent-note][stage3] resolved-gif: snack-pop + cheer-hearts -> catalogs/gifs.json -->
        <img id="gif-snack" class="gif-badge" src="https://i.giphy.com/DX3i6ABlOz0mYVcLj9.webp" alt="Snack celebration reaction" loading="lazy" decoding="async">
        <img id="gif-cheer" class="gif-badge gif-badge-left" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Cheer hearts reaction" loading="lazy" decoding="async">
    </div>
</div>

<script>
/* 
 * LIVING SKETCHBOOK: CHATTERBOX EDITION
 * Single-file implementation
 */

// --- Constants & Config ---
const CONFIG = {
    gravity: 1200,
    floorHeight: 150,
    colors: ['#2d3436', '#FF6B6B', '#4ECDC4', '#ffeaa7', '#a29bfe', '#fd79a8'],
    phrases: {
        idle: [
            "Page feels quiet...", "Sketch me a surprise!", "Am I gallery-ready?", 
            "Do I look iconic?", "Zzz...", "Fresh page energy!", 
            "I could use more doodles...", "Hello, artist!", "Add me a sidekick?",
            "What's today's snack?", "I feel extra sketchy.", "Paper is cozy."
        ],
        eat: [
            "Masterpiece meal!", "Crunchy lines!", "Delicious sketch!", "More page snacks!", 
            "Nom nom nom", "Tastes like fresh ink!", "Gallery favorite!"
        ],
        happy: [
            "You're my favorite artist!", "Hehe!", "Best page pals!", "Yay!", 
            "So inspired!", "That boosts morale!", "You're the best!"
        ],
        spawn: [
            "Sketchbook online!", "New page, who dis?", "Hello, gallery!", "Nice to meet you!"
        ]
    }
};

// --- Audio System ---
// [agent-note][stage3] resolved-audio: ui/start/pickup/powerup/ambient loop -> catalogs/audios.json
const AUDIO_MAP = {
    uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
    pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
    cheer: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
    blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
    ambient: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
};

const AudioSys = {
    ctx: null,
    muted: false,
    mediaUnlocked: false,
    sfxCooldowns: new Map(),
    sounds: {},
    bgm: null,

    init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.prepareMedia();
        this.resume();
    },

    prepareMedia() {
        if (this.mediaUnlocked) return;
        Object.entries(AUDIO_MAP).forEach(([key, url]) => {
            const audio = new Audio(url);
            audio.preload = key === 'ambient' ? 'auto' : 'metadata';
            audio.crossOrigin = 'anonymous';
            if (key === 'ambient') {
                audio.loop = true;
                audio.volume = 0.2;
                this.bgm = audio;
            } else {
                audio.volume = key === 'uiClick' ? 0.38 : 0.42;
                this.sounds[key] = audio;
            }
        });
        this.mediaUnlocked = true;
    },

    resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        this.startLoop();
    },

    startLoop() {
        if (this.muted || !this.bgm) return;
        const playPromise = this.bgm.paused ? this.bgm.play() : null;
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    },

    stopLoop() {
        if (this.bgm && !this.bgm.paused) {
            this.bgm.pause();
        }
    },

    setMuted(nextMuted) {
        this.muted = nextMuted;
        if (nextMuted) {
            this.stopLoop();
        } else {
            this.resume();
        }
    },

    playSfx(name, cooldown = 0) {
        if (this.muted || !this.mediaUnlocked) return;
        const now = performance.now();
        const readyAt = this.sfxCooldowns.get(name) || 0;
        if (now < readyAt) return;
        this.sfxCooldowns.set(name, now + cooldown);

        const source = this.sounds[name];
        if (!source) return;
        const audio = source.cloneNode();
        audio.volume = source.volume;
        const playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    },

    playTone(type) {
        if (type === 'pop') {
            this.playSfx('uiClick', 90);
        } else if (type === 'eat') {
            this.playSfx('pickup', 160);
        } else if (type === 'happy') {
            this.playSfx('cheer', 180);
        } else if (type === 'blocked') {
            this.playSfx('blocked', 220);
        }

        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'pop') {
            osc.frequency.setValueAtTime(420, t);
            osc.frequency.exponentialRampToValueAtTime(760, t + 0.08);
            gain.gain.setValueAtTime(0.035, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
            osc.start(t);
            osc.stop(t + 0.09);
        } else if (type === 'eat') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(160, t);
            osc.frequency.linearRampToValueAtTime(110, t + 0.08);
            gain.gain.setValueAtTime(0.03, t);
            gain.gain.linearRampToValueAtTime(0.0001, t + 0.12);
            osc.start(t);
            osc.stop(t + 0.12);
        } else if (type === 'happy') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(620, t);
            osc.frequency.linearRampToValueAtTime(920, t + 0.08);
            osc.frequency.linearRampToValueAtTime(700, t + 0.18);
            gain.gain.setValueAtTime(0.03, t);
            gain.gain.linearRampToValueAtTime(0.0001, t + 0.22);
            osc.start(t);
            osc.stop(t + 0.22);
        } else if (type === 'talk') {
            const pitch = 300 + Math.random() * 300;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(pitch, t);
            osc.frequency.exponentialRampToValueAtTime(pitch * 0.82, t + 0.06);
            gain.gain.setValueAtTime(0.012, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
            osc.start(t);
            osc.stop(t + 0.06);
        } else if (type === 'blocked') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, t);
            osc.frequency.linearRampToValueAtTime(160, t + 0.14);
            gain.gain.setValueAtTime(0.026, t);
            gain.gain.linearRampToValueAtTime(0.0001, t + 0.16);
            osc.start(t);
            osc.stop(t + 0.16);
        }
    }
};

// --- Game State & Entities ---
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'START'; // START, DRAW_PET, PLAY, DRAW_FOOD
let lastTime = 0;
let particles = [];
let foods = [];
let lastDrawStrokeAt = 0;

// The Pet Object
const pet = {
    x: 0, y: 0, w: 100, h: 100,
    vx: 0, vy: 0,
    sprite: null,
    state: 'IDLE',
    timer: 0,
    squash: 1, stretch: 1, rot: 0,
    target: null,
    speech: { text: null, timer: 0, opacity: 0, scale: 0 },
    
    say(text) {
        this.speech.text = text;
        this.speech.timer = 2.5; // Duration
        this.speech.opacity = 1;
        this.speech.scale = 0; // Pop in
        AudioSys.playTone('talk');
    }
};

// Drawing State
let drawCanvas = document.createElement('canvas');
let drawCtx = drawCanvas.getContext('2d');
let isDrawing = false;
let brushColor = '#2d3436';
let brushSize = 12;

const gifEls = {
    snack: document.getElementById('gif-snack'),
    cheer: document.getElementById('gif-cheer')
};

function triggerGif(name, duration = 1400) {
    const el = gifEls[name];
    if (!el) return;
    el.classList.add('is-visible');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => el.classList.remove('is-visible'), duration);
}

// --- Core Functions ---

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initDrawing(mode) {
    const container = document.getElementById('canvas-container');
    container.innerHTML = ''; // Clear previous
    const rect = container.getBoundingClientRect();
    
    drawCanvas.width = rect.width;
    drawCanvas.height = rect.height;
    
    // Transparent background, round caps
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    
    drawCanvas.style.width = '100%';
    drawCanvas.style.height = '100%';
    drawCanvas.style.touchAction = 'none';
    
    container.appendChild(drawCanvas);
    
    const title = document.getElementById('draw-title');
    title.innerText = mode === 'PET' ? "Draw Your Star Doodle" : "Sketch a Snack";
}

function cropSprite(sourceCanvas) {
    const w = sourceCanvas.width;
    const h = sourceCanvas.height;
    const data = sourceCanvas.getContext('2d').getImageData(0,0,w,h).data;
    
    let minX = w, maxX = 0, minY = h, maxY = 0;
    let found = false;
    
    // Scan alpha
    for(let y=0; y<h; y++) {
        for(let x=0; x<w; x++) {
            const alpha = data[(y*w + x)*4 + 3];
            if(alpha > 0) {
                if(x < minX) minX = x;
                if(x > maxX) maxX = x;
                if(y < minY) minY = y;
                if(y > maxY) maxY = y;
                found = true;
            }
        }
    }
    
    if(!found) return null;
    
    const cw = maxX - minX + 24; // Padding
    const ch = maxY - minY + 24;
    
    const tempC = document.createElement('canvas');
    tempC.width = cw;
    tempC.height = ch;
    const tCtx = tempC.getContext('2d');
    
    // White Sticker Outline
    tCtx.shadowColor = 'rgba(255,255,255,1)';
    tCtx.shadowBlur = 0;
    // Actually, simple white stroke effect is hard with canvas path.
    // Let's just draw a white circle background for "sticker" feel or just the drawing.
    // Let's draw the image directly.
    
    tCtx.drawImage(sourceCanvas, minX-12, minY-12, cw, ch, 0, 0, cw, ch);
    
    return tempC;
}

// --- Game Logic ---

function update(dt) {
    if(gameState !== 'PLAY') return;
    
    const floorY = (canvas.height / (window.devicePixelRatio||1)) - CONFIG.floorHeight;
    const width = canvas.width / (window.devicePixelRatio||1);
    
    // -- Pet Physics --
    
    // Gravity
    if(pet.y < floorY) {
        pet.vy += CONFIG.gravity * dt;
    } else if(pet.vy > 0) {
        pet.vy = 0;
        pet.y = floorY;
        // Landed
        if(pet.state === 'HAPPY') {
            pet.vy = -300; // Bounce
        }
    }
    
    // Speech Bubble Logic
    if(pet.speech.timer > 0) {
        pet.speech.timer -= dt;
        if(pet.speech.scale < 1) pet.speech.scale += dt * 5;
        if(pet.speech.scale > 1) pet.speech.scale = 1;
    } else {
        pet.speech.opacity -= dt * 2;
    }
    
    // Random Speech Trigger
    if(pet.state === 'IDLE' && pet.speech.timer <= 0 && pet.speech.opacity <= 0) {
        if(Math.random() < 0.005) { // Low chance per frame
            const phrase = CONFIG.phrases.idle[Math.floor(Math.random() * CONFIG.phrases.idle.length)];
            pet.say(phrase);
        }
    }

    // AI State Machine
    pet.timer -= dt;
    if(pet.timer <= 0) {
        // Decide new state
        if(foods.length > 0) {
            pet.state = 'EAT';
            pet.target = foods[0];
            pet.timer = 5;
                pet.say("Ooh! Snack sketch!");
        } else {
            const r = Math.random();
            if(r < 0.4) {
                pet.state = 'IDLE';
                pet.vx = 0;
                pet.timer = 2 + Math.random()*2;
            } else {
                pet.state = 'WALK';
                pet.vx = (Math.random() - 0.5) * 150;
                pet.timer = 2 + Math.random()*2;
            }
        }
    }
    
    // Behavior execution
    if(pet.state === 'EAT' && pet.target) {
        const dx = pet.target.x - pet.x;
        if(Math.abs(dx) > 10) {
            pet.vx = Math.sign(dx) * 100;
            // Walk anim
            pet.squash = 1 - Math.abs(Math.sin(Date.now()/100))*0.1;
            pet.stretch = 1 + Math.abs(Math.sin(Date.now()/100))*0.1;
        } else {
            pet.vx = 0;
            // Eating anim
            pet.squash = 1 + Math.sin(Date.now()/50)*0.1;
            pet.stretch = 1 - Math.sin(Date.now()/50)*0.1;
            pet.target.life -= dt;
            if(pet.target.life <= 0) {
                // Ate it
                AudioSys.playTone('eat');
                spawnParticles(pet.target.x, pet.target.y, 10, '#FF6B6B');
                foods.shift();
                pet.state = 'HAPPY';
                pet.timer = 2;
                pet.vy = -250;
                pet.say(CONFIG.phrases.eat[Math.floor(Math.random()*CONFIG.phrases.eat.length)]);
            }
        }
    } else if(pet.state === 'WALK') {
        pet.squash = 1 - Math.abs(Math.sin(Date.now()/150))*0.05;
        pet.stretch = 1 + Math.abs(Math.sin(Date.now()/150))*0.05;
        pet.rot = Math.sin(Date.now()/150) * 0.1;
        
        // Bounds
        if(pet.x < 50) { pet.x = 50; pet.vx *= -1; }
        if(pet.x > width-50) { pet.x = width-50; pet.vx *= -1; }
    } else if(pet.state === 'HAPPY') {
        pet.rot = Math.sin(Date.now()/50) * 0.2;
    } else {
        // Idle breathing
        pet.vx = 0;
        pet.squash = 1 + Math.sin(Date.now()/500)*0.02;
        pet.stretch = 1 - Math.sin(Date.now()/500)*0.02;
        pet.rot = 0;
    }
    
    pet.x += pet.vx * dt;
    pet.y += pet.vy * dt;
    
    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if(p.life <= 0) particles.splice(i,1);
    }
}

function draw() {
    // Clear
    ctx.clearRect(0,0,canvas.width, canvas.height);
    
    if(gameState === 'PLAY') {
        const width = canvas.width / (window.devicePixelRatio||1);
        const height = canvas.height / (window.devicePixelRatio||1);
        const floorY = height - CONFIG.floorHeight;
        
        // Draw Floor (Wobbly line)
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        for(let x=0; x<=width; x+=20) {
            ctx.lineTo(x, floorY + Math.sin(x*0.02 + Date.now()*0.001)*5);
        }
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // Draw Foods
        foods.forEach(f => {
            ctx.save();
            ctx.translate(f.x, f.y);
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(0, f.h/2, f.w/2, 8, 0, 0, Math.PI*2);
            ctx.fill();
            // Sprite
            ctx.drawImage(f.sprite, -f.w/2, -f.h/2, f.w, f.h);
            ctx.restore();
        });
        
        // Draw Pet
        if(pet.sprite) {
            ctx.save();
            ctx.translate(pet.x, pet.y);
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(0, pet.h/2, pet.w/2, 10, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Transform
            ctx.scale(pet.vx < 0 ? -1 : 1, 1);
            ctx.rotate(pet.rot);
            ctx.scale(pet.squash, pet.stretch);
            
            // White outline/sticker effect behind
            ctx.shadowColor = 'white';
            ctx.shadowBlur = 10;
            ctx.drawImage(pet.sprite, -pet.w/2, -pet.h/2, pet.w, pet.h);
            ctx.shadowBlur = 0;
            
            ctx.restore();
        }
        
        // Draw Speech Bubble
        if(pet.speech.opacity > 0 && pet.speech.text) {
            ctx.save();
            ctx.globalAlpha = pet.speech.opacity;
            ctx.translate(pet.x, pet.y - pet.h/2 - 40);
            ctx.scale(pet.speech.scale, pet.speech.scale);
            
            // Bubble shape
            const text = pet.speech.text;
            ctx.font = "700 20px 'Rajdhani'";
            const m = ctx.measureText(text);
            const p = 15; // padding
            const bw = m.width + p*2;
            const bh = 40;
            
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#2d3436';
            ctx.lineWidth = 3;
            
            // Bubble body
            ctx.beginPath();
            ctx.roundRect(-bw/2, -bh, bw, bh, 15);
            ctx.fill();
            ctx.stroke();
            
            // Tail
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(0, 10);
            ctx.lineTo(5, 0);
            ctx.fill();
            ctx.stroke();
            
            // Text
            ctx.fillStyle = '#2d3436';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 0, -bh/2);
            
            ctx.restore();
        }
        
        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
    }
}

function spawnParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*300,
            vy: -Math.random()*300,
            life: 1.0,
            size: Math.random()*5 + 2,
            color: color
        });
    }
}

// --- Interaction Handlers ---

// Start
document.getElementById('btn-start').addEventListener('click', () => {
    AudioSys.init();
    AudioSys.playSfx('start', 250);
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('drawing-ui').classList.remove('hidden');
    gameState = 'DRAW_PET';
    initDrawing('PET');
    resize();
});

// Sound Toggle
document.getElementById('btn-sound').addEventListener('click', (e) => {
    AudioSys.init();
    AudioSys.setMuted(!AudioSys.muted);
    e.currentTarget.innerText = AudioSys.muted ? '🔇' : '🔊';
});

// Drawing Inputs
const palette = document.getElementById('color-palette');
CONFIG.colors.forEach(c => {
    const d = document.createElement('div');
    d.className = 'w-8 h-8 rounded-full border-2 border-white shadow-md cursor-pointer transform transition-transform hover:scale-110';
    d.style.backgroundColor = c;
    d.onclick = () => {
        brushColor = c;
        AudioSys.playTone('pop');
        Array.from(palette.children).forEach(k => k.style.transform = 'scale(1)');
        d.style.transform = 'scale(1.25)';
    };
    palette.appendChild(d);
});

document.getElementById('brush-slider').addEventListener('input', (e) => brushSize = parseInt(e.target.value));
document.getElementById('btn-clear').addEventListener('click', () => {
    drawCtx.clearRect(0,0,drawCanvas.width, drawCanvas.height);
    AudioSys.playTone('pop');
});

// Pointer Events for Drawing
function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

window.addEventListener('pointerdown', (e) => {
    if(e.target !== drawCanvas) return;
    isDrawing = true;
    const p = getPos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(p.x, p.y);
    drawCtx.strokeStyle = brushColor;
    drawCtx.lineWidth = brushSize;
    lastDrawStrokeAt = performance.now();
    AudioSys.resume();
});
window.addEventListener('pointermove', (e) => {
    if(!isDrawing || e.target !== drawCanvas) return;
    const p = getPos(e);
    drawCtx.lineTo(p.x, p.y);
    drawCtx.stroke();
    if (performance.now() - lastDrawStrokeAt > 160) {
        AudioSys.playTone('talk');
        lastDrawStrokeAt = performance.now();
    }
});
window.addEventListener('pointerup', () => isDrawing = false);

// Done Drawing
document.getElementById('btn-done').addEventListener('click', () => {
    const sprite = cropSprite(drawCanvas);

    if(gameState === 'DRAW_PET') {
        AudioSys.playTone('happy');
        if(sprite) {
            pet.sprite = sprite;
            pet.w = sprite.width;
            pet.h = sprite.height;
        } else {
            const fb = document.createElement('canvas'); fb.width=100; fb.height=100;
            const fctx = fb.getContext('2d');
            fctx.fillStyle = '#FF6B6B'; fctx.beginPath(); fctx.arc(50,50,40,0,Math.PI*2); fctx.fill();
            fctx.fillStyle = 'white'; fctx.font='30px sans-serif'; fctx.fillText('?', 40, 60);
            pet.sprite = fb;
        }

        pet.x = (canvas.width/window.devicePixelRatio)/2;
        pet.y = (canvas.height/window.devicePixelRatio)/2;

        gameState = 'PLAY';
        document.getElementById('drawing-ui').classList.add('hidden');
        document.getElementById('game-hud').classList.remove('hidden');
        triggerGif('cheer', 1800);

        setTimeout(() => pet.say(CONFIG.phrases.spawn[Math.floor(Math.random()*CONFIG.phrases.spawn.length)]), 500);

    } else if(gameState === 'DRAW_FOOD') {
        if(sprite) {
            AudioSys.playTone('eat');
            foods.push({
                x: Math.random() * ((canvas.width/window.devicePixelRatio)-100) + 50,
                y: (canvas.height/window.devicePixelRatio) - 200,
                w: sprite.width * 0.6,
                h: sprite.height * 0.6,
                sprite: sprite,
                life: 1.0
            });
            triggerGif('snack');
        } else {
            AudioSys.playTone('blocked');
        }
        gameState = 'PLAY';
        document.getElementById('drawing-ui').classList.add('hidden');
        document.getElementById('game-hud').classList.remove('hidden');
    }
});

// HUD Actions
document.getElementById('btn-feed').addEventListener('click', () => {
    gameState = 'DRAW_FOOD';
    document.getElementById('game-hud').classList.add('hidden');
    document.getElementById('drawing-ui').classList.remove('hidden');
    initDrawing('FOOD');
    AudioSys.playTone('pop');
});

document.getElementById('btn-pet').addEventListener('click', () => {
    if(pet.state !== 'HAPPY') {
        pet.state = 'HAPPY';
        pet.timer = 1.5;
        pet.vy = -200;
        AudioSys.playTone('happy');
        spawnParticles(pet.x, pet.y - 50, 8, '#fd79a8');
        triggerGif('cheer');
        pet.say(CONFIG.phrases.happy[Math.floor(Math.random()*CONFIG.phrases.happy.length)]);
    } else {
        AudioSys.playTone('blocked');
    }
});

// Canvas Interaction (Tap Pet)
canvas.addEventListener('pointerdown', (e) => {
    if(gameState !== 'PLAY') return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (window.devicePixelRatio||1);
    const y = (e.clientY - rect.top) * (window.devicePixelRatio||1);
    
    // Check collision with pet
    const dx = x - pet.x * (window.devicePixelRatio||1);
    const dy = y - pet.y * (window.devicePixelRatio||1);
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if(dist < pet.w) {
        // Tapped pet
        pet.state = 'HAPPY';
        pet.timer = 1.0;
        pet.vy = -150;
        AudioSys.playTone('happy');
        pet.say("Encore!");
    }
});

// Loop
function loop(t) {
    if(!lastTime) lastTime = t;
    const dt = Math.min((t - lastTime)/1000, 0.1);
    lastTime = t;
    
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

// Init
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        AudioSys.stopLoop();
    } else if (gameState !== 'START') {
        AudioSys.resume();
    }
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

</script>
