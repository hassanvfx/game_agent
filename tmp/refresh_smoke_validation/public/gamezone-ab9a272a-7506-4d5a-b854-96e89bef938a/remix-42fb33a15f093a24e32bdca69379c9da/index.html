<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Relic Merge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-top: #08111f;
            --bg-bottom: #190d35;
            --panel-top: rgba(19, 27, 54, 0.84);
            --panel-bottom: rgba(9, 13, 31, 0.9);
            --panel-border: rgba(144, 231, 255, 0.45);
            --text-main: #eff8ff;
            --text-dim: #bfd5ff;
            --accent-cyan: #8cf0ff;
            --accent-gold: #ffd76b;
            --accent-pink: #ff7bd5;
            --danger: #ff5f7a;
            --shadow-deep: rgba(2, 8, 22, 0.48);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(92, 163, 255, 0.22), transparent 40%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
            touch-action: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(140, 240, 255, 0.18), transparent 18%),
                radial-gradient(circle at 80% 12%, rgba(255, 123, 213, 0.16), transparent 14%),
                radial-gradient(circle at 50% 72%, rgba(255, 215, 107, 0.12), transparent 18%);
        }

        body::after {
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.8) 0 1px, transparent 1.5px);
            background-size: 42px 42px;
            opacity: 0.18;
            mix-blend-mode: screen;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 0%, rgba(140, 240, 255, 0.14), transparent 34%),
                radial-gradient(circle at 50% 100%, rgba(255, 123, 213, 0.12), transparent 28%),
                linear-gradient(180deg, rgba(11, 18, 37, 0.3), rgba(5, 8, 20, 0.7));
            user-select: none;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, rgba(140, 240, 255, 0.08) 0 1px, transparent 1px),
                linear-gradient(180deg, rgba(140, 240, 255, 0.05) 0 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
        }

        #game-container::after {
            inset: auto 0 0 0;
            height: 34%;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 215, 107, 0.16), transparent 30%),
                linear-gradient(180deg, transparent, rgba(7, 10, 24, 0.88));
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: max(0.75rem, env(safe-area-inset-top)) 0.85rem 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.65rem;
            box-sizing: border-box;
        }

        .clay-panel {
            background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
            backdrop-filter: blur(12px);
            border-radius: 22px;
            box-shadow:
                0 14px 30px var(--shadow-deep),
                inset 0 1px 0 rgba(255,255,255,0.16),
                inset 0 -1px 0 rgba(140, 240, 255, 0.16),
                0 0 0 1px rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
        }

        #score-display {
            min-width: 5.5rem;
            padding: 0.7rem 1rem;
            font-family: 'Press Start 2P', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(0.86rem, 3.6vw, 1.05rem);
            font-weight: 400;
            line-height: 1.2;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255, 215, 107, 0.35);
            letter-spacing: 0.04em;
        }

        .next-panel {
            padding: 0.55rem 0.8rem 0.65rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-transform: uppercase;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .next-label {
            font-family: 'Press Start 2P', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
            font-size: 0.68rem;
        }

        #nextCanvas {
            margin-top: 0.3rem;
        }

        #feedback-deck {
            position: absolute;
            right: 0.85rem;
            bottom: max(0.85rem, env(safe-area-inset-bottom));
            width: min(34vw, 9rem);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.55rem;
        }

        .feedback-gif {
            width: 100%;
            max-height: 6.5rem;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.24);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            background: rgba(5, 8, 20, 0.55);
        }

        .feedback-gif.visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-tag {
            align-self: stretch;
            padding: 0.35rem 0.55rem;
            border-radius: 999px;
            background: rgba(9, 13, 31, 0.66);
            border: 1px solid rgba(140, 240, 255, 0.24);
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.03em;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-tag.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(2, 5, 16, 0.62);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
            pointer-events: auto;
        }

        #game-over-screen.hidden {
            display: none;
        }

        .game-over-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            max-width: 20rem;
            width: min(100%, 20rem);
            max-height: 90vh;
            margin: 0;
            box-sizing: border-box;
        }

        .game-over-title {
            margin: 0 0 0.4rem;
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(1.9rem, 7vw, 2.6rem);
            font-weight: 400;
            color: var(--accent-gold);
            text-align: center;
            text-shadow: 0 0 18px rgba(255, 215, 107, 0.2);
            letter-spacing: 0.06em;
        }

        .game-over-copy {
            margin: 0 0 1rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 600;
        }

        #final-score {
            color: var(--accent-pink);
            font-size: 1.15rem;
        }

        .instructions {
            margin: 0 0 1.15rem;
            text-align: center;
            color: rgba(239, 248, 255, 0.82);
            font-size: 0.9rem;
            line-height: 1.35;
        }

        .clay-btn {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 0.95rem 1rem;
            background: linear-gradient(180deg, #ff9df0 0%, #9b68ff 100%);
            border-radius: 999px;
            box-shadow:
                0 10px 22px rgba(124, 58, 237, 0.34),
                inset 0 1px 0 rgba(255,255,255,0.4);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            color: #fff8fe;
            text-shadow: 0 1px 0 rgba(58,12,77,0.4);
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: auto;
            cursor: pointer;
        }

        .clay-btn:active {
            transform: scale(0.97) translateY(1px);
            box-shadow:
                0 6px 12px rgba(124, 58, 237, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.35);
            filter: brightness(1.08);
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 480px) {
            #hud {
                padding-left: 0.7rem;
                padding-right: 0.7rem;
            }

            .clay-panel {
                border-radius: 18px;
            }

            #score-display {
                min-width: 4.8rem;
                padding: 0.62rem 0.82rem;
                font-size: 0.74rem;
            }

            .next-panel {
                padding: 0.5rem 0.7rem 0.55rem;
                font-size: 0.7rem;
            }

            .next-label {
                font-size: 0.56rem;
            }

            #feedback-deck {
                right: 0.7rem;
                width: min(38vw, 7.5rem);
            }

            .game-over-card {
                padding: 1.25rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "gravity": { "type": "number", "label": "Gravity", "value": 1500, "min": 500, "max": 3000 },
        "bounciness": { "type": "number", "label": "Bounciness", "value": 0.15, "min": 0, "max": 0.5 },
        "friction": { "type": "number", "label": "Friction", "value": 0.98, "min": 0.8, "max": 1 }
    }
    </script>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud">
            <div class="clay-panel" id="score-display" aria-label="Vault score">0</div>
            <div class="clay-panel next-panel">
                <span class="next-label">Next Relic</span>
                <canvas id="nextCanvas" width="40" height="40"></canvas>
            </div>
        </div>

        <div id="feedback-deck" aria-live="polite">
            <!-- [agent-note][stage3] resolved-gif: merge-feedback + fail-feedback -> catalogs/gifs.json -->
            <div id="feedback-tag" class="feedback-tag">Relics resonating...</div>
            <img
                id="merge-gif"
                class="feedback-gif"
                src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                alt="Retro explosion feedback for relic merges"
                decoding="async"
                loading="lazy"
            >
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden">
            <div class="clay-panel game-over-card">
                <img
                    id="fail-gif"
                    class="feedback-gif visible"
                    src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
                    alt="Confused reaction after the vault seals"
                    decoding="async"
                    loading="lazy"
                >
                <h2 class="game-over-title">Vault Sealed</h2>
                <p class="game-over-copy">Relics archived: <span id="final-score">0</span></p>
                <p class="instructions">Release to drop. Match relics to forge larger wonders before the vault line locks the chamber.</p>
                <button id="restart-btn" class="clay-btn">Sort Again</button>
            </div>
        </div>
    </div>
</div>

<!-- [agent-note][stage4] repaired: catalog-remap | element: body/hud/fonts + bgm | action: switched ui body fallback to Rajdhani and replaced flagged local bgm with catalog gameplay loop -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_drop" src="https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3" preload="auto"></audio>
<audio id="sfx_merge" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
<audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>

<script>
// ==========================================
// System L0 & Config
// ==========================================
let gameConfig = {};
try {
    const confStr = document.getElementById('game-config').textContent;
    const defs = JSON.parse(confStr);
    for (let k in defs) gameConfig[k] = defs[k].value;
} catch (e) {
    gameConfig = { gravity: 1500, bounciness: 0.15, friction: 0.98 };
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const nextCanvas = document.getElementById('nextCanvas');
const nextCtx = nextCanvas.getContext('2d');
const mergeGif = document.getElementById('merge-gif');
const failGif = document.getElementById('fail-gif');
const feedbackTag = document.getElementById('feedback-tag');
const restartBtn = document.getElementById('restart-btn');

let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
let lastTime = 0;
let score = 0;

// ==========================================
// Audio & Vibration System
// ==========================================
let audioCtx = null;
let audioUnlocked = false;
const bgm = document.getElementById('bgm_main');
const audioElements = {
    drop: document.getElementById('sfx_drop'),
    merge: document.getElementById('sfx_merge'),
    warning: document.getElementById('sfx_warning'),
    over: document.getElementById('sfx_gameover'),
    restart: document.getElementById('sfx_restart')
};

Object.values(audioElements).forEach((audio) => {
    audio.volume = 0.34;
});
audioElements.warning.volume = 0.24;
audioElements.over.volume = 0.4;
audioElements.restart.volume = 0.26;
bgm.volume = 0.2;

function ensureAudioContext() {
    if (!audioCtx) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (AudioCtor) {
            try {
                audioCtx = new AudioCtor();
            } catch (e) {
                audioCtx = null;
            }
        }
    }
    return audioCtx;
}

function playAudioCue(name, options = {}) {
    if (!audioUnlocked) return;
    const audio = audioElements[name];
    if (!audio) return;

    const now = performance.now();
    if (audio.__cooldownUntil && audio.__cooldownUntil > now) return;
    audio.__cooldownUntil = now + (options.cooldown ?? 0);

    try {
        audio.currentTime = 0;
        const playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    } catch (e) {
        // Fail silently; audio must never affect mechanics.
    }
}

function startBgm() {
    if (!audioUnlocked) return;
    try {
        const playPromise = bgm.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    } catch (e) {
        // Ignore playback failures.
    }
}

function stopBgm() {
    try {
        bgm.pause();
    } catch (e) {
        // Ignore playback failures.
    }
}

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    const ctxMaybe = ensureAudioContext();
    if (ctxMaybe && ctxMaybe.state === 'suspended') {
        ctxMaybe.resume().catch(() => {});
    }
    startBgm();
}

function synthesizeSFX(type) {
    const ctxMaybe = ensureAudioContext();
    if (!ctxMaybe || ctxMaybe.state !== 'running') return;
    const osc = ctxMaybe.createOscillator();
    const gain = ctxMaybe.createGain();
    osc.connect(gain);
    gain.connect(ctxMaybe.destination);

    const now = ctxMaybe.currentTime;
    if (type === 'mergeSpark') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.linearRampToValueAtTime(920, now + 0.08);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
    } else if (type === 'warningPulse') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.linearRampToValueAtTime(240, now + 0.12);
        gain.gain.setValueAtTime(0.025, now);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
    }
}

function vibrate(style = 'light') {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
}

function showMergeFeedback(message = 'Relics merged!') {
    feedbackTag.textContent = message;
    feedbackTag.classList.add('visible');
    mergeGif.classList.add('visible');
    clearTimeout(showMergeFeedback.timeoutId);
    showMergeFeedback.timeoutId = setTimeout(() => {
        mergeGif.classList.remove('visible');
        feedbackTag.classList.remove('visible');
    }, 1100);
}

// ==========================================
// Game Entities & Logic
// ==========================================
const TIERS = [
    { r: 15, color: '#ff7aa8', mass: 1, name: 'Sprite Seed', emoji: '✨', mood: 'bright' },
    { r: 22, color: '#65d9ff', mass: 1.5, name: 'Cloud Charm', emoji: '☁️', mood: 'calm' },
    { r: 32, color: '#ffd76b', mass: 2.2, name: 'Sun Idol', emoji: '☀️', mood: 'warm' },
    { r: 45, color: '#ff8ce6', mass: 3.5, name: 'Dream Bloom', emoji: '🌸', mood: 'sweet' },
    { r: 60, color: '#ac8dff', mass: 5, name: 'Moon Orb', emoji: '🌙', mood: 'mystic' },
    { r: 80, color: '#7ef0ff', mass: 7, name: 'Star Crown', emoji: '⭐', mood: 'spark' },
    { r: 105, color: '#ffae57', mass: 10, name: 'Skyphinx', emoji: '🦁', mood: 'bold' },
    { r: 135, color: '#ff65cf', mass: 14, name: 'Aurora Map', emoji: '🗺️', mood: 'guide' },
    { r: 170, color: '#7ae96a', mass: 20, name: 'Dragon Crest', emoji: '🐉', mood: 'wild' },
    { r: 210, color: '#5a86ff', mass: 28, name: 'Celestial Gate', emoji: '🏛️', mood: 'royal' },
    { r: 260, color: '#1b2238', mass: 40, name: 'Sky Myth', emoji: '👑', mood: 'legend' }
];

let balls = [];
let particles = [];
let dropper = null;
let nextTier = 0;
let pointerX = 0;
let dropCooldown = 0;
let dangerLineY = 0;
let gameOverTimer = 0;
let screenShake = 0;
let warningActive = false;
let warningAudioAt = 0;

function getNextTier() {
    return Math.floor(Math.random() * 4);
}

function initGame() {
    balls = [];
    particles = [];
    score = 0;
    dangerLineY = ch * 0.15;
    nextTier = getNextTier();
    spawnDropper();
    updateUI();
    gameOverTimer = 0;
    screenShake = 0;
    warningActive = false;
    document.getElementById('final-score').textContent = 0;
    setState('PLAYING');
    startBgm();
}

function spawnDropper() {
    dropper = {
        x: cw / 2,
        y: dangerLineY - TIERS[nextTier].r - 10,
        tier: nextTier,
        r: TIERS[nextTier].r,
        vx: 0, vy: 0,
        isDropping: false
    };
    nextTier = getNextTier();
    drawNext();
}

function drawNext() {
    nextCtx.clearRect(0, 0, 40, 40);
    const t = TIERS[nextTier];
    const scale = Math.min(1, 16 / t.r);
    nextCtx.save();
    nextCtx.translate(20, 20);
    nextCtx.scale(scale, scale);
    drawClayBall(nextCtx, 0, 0, t.r, t.color, 0, nextTier);
    nextCtx.restore();
}

function handleInput(e) {
    unlockAudio();
    if (gameState === 'GAMEOVER') return;

    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;

    if (gameState === 'PLAYING' && dropper && !dropper.isDropping && dropCooldown <= 0) {
        dropper.x = Math.max(dropper.r, Math.min(cw - dropper.r, pointerX));

        if (e.type === 'pointerup' || e.type === 'pointercancel') {
            dropper.isDropping = true;
            dropper.mass = TIERS[dropper.tier].mass;
            dropper.id = Math.random();
            dropper.merged = false;
            dropper.angle = 0;
            dropper.av = 0;
            balls.push(dropper);
            dropper = null;
            dropCooldown = 0.5;
            playAudioCue('drop', { cooldown: 70 });
            vibrate('light');

            setTimeout(() => {
                if (gameState === 'PLAYING') spawnDropper();
            }, 500);
        }
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 400,
            vy: (Math.random() - 0.5) * 400,
            life: 1,
            color: color,
            size: Math.random() * 6 + 2
        });
    }
}

function updatePhysics(dt) {
    if (dt > 0.05) dt = 0.05;

    for (let i = 0; i < balls.length; i++) {
        let b = balls[i];
        if (!isFinite(b.x) || !isFinite(b.y)) { b.x = cw / 2; b.y = ch / 2; b.vx = 0; b.vy = 0; }

        b.vy += gameConfig.gravity * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.angle += b.av * dt;

        if (b.y > ch - b.r) {
            b.y = ch - b.r;
            b.vy *= -gameConfig.bounciness;
            b.vx *= gameConfig.friction;
            b.av *= gameConfig.friction;
        }
        if (b.x < b.r) {
            b.x = b.r;
            b.vx *= -gameConfig.bounciness;
            b.av -= b.vy * 0.01;
        } else if (b.x > cw - b.r) {
            b.x = cw - b.r;
            b.vx *= -gameConfig.bounciness;
            b.av += b.vy * 0.01;
        }
    }

    const iterations = 8;
    for (let iter = 0; iter < iterations; iter++) {
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                let b1 = balls[i], b2 = balls[j];
                if (b1.merged || b2.merged) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let distSq = dx * dx + dy * dy;
                let minDist = b1.r + b2.r;

                if (distSq < minDist * minDist) {
                    let dist = Math.sqrt(distSq);
                    if (dist === 0) { dx = 1; dy = 0; dist = 1; }

                    if (b1.tier === b2.tier && b1.tier < TIERS.length - 1) {
                        b1.merged = true;
                        b2.merged = true;

                        let nx = (b1.x + b2.x) / 2;
                        let ny = (b1.y + b2.y) / 2;
                        let newTier = b1.tier + 1;

                        score += (newTier * 10);
                        updateUI();
                        playAudioCue('merge', { cooldown: 90 });
                        synthesizeSFX('mergeSpark');
                        vibrate('medium');
                        screenShake = 5;
                        spawnParticles(nx, ny, TIERS[newTier].color);
                        showMergeFeedback(`${TIERS[newTier].name} forged!`);

                        balls.push({
                            x: nx, y: ny,
                            vx: (b1.vx + b2.vx) * 0.5,
                            vy: (b1.vy + b2.vy) * 0.5 - 200,
                            tier: newTier,
                            r: TIERS[newTier].r,
                            mass: TIERS[newTier].mass,
                            angle: 0, av: 0,
                            id: Math.random(), merged: false
                        });
                        continue;
                    }

                    let overlap = minDist - dist;
                    let nx = dx / dist, ny = dy / dist;
                    let totalMass = b1.mass + b2.mass;
                    let m1Ratio = b2.mass / totalMass;
                    let m2Ratio = b1.mass / totalMass;

                    b1.x -= nx * overlap * m1Ratio;
                    b1.y -= ny * overlap * m1Ratio;
                    b2.x += nx * overlap * m2Ratio;
                    b2.y += ny * overlap * m2Ratio;

                    let dvx = b2.vx - b1.vx;
                    let dvy = b2.vy - b1.vy;
                    let velAlongNormal = dvx * nx + dvy * ny;

                    if (velAlongNormal < 0) {
                        let e = gameConfig.bounciness;
                        let j = -(1 + e) * velAlongNormal;
                        j /= (1 / b1.mass + 1 / b2.mass);

                        let impulseX = j * nx;
                        let impulseY = j * ny;

                        b1.vx -= impulseX / b1.mass;
                        b1.vy -= impulseY / b1.mass;
                        b2.vx += impulseX / b2.mass;
                        b2.vy += impulseY / b2.mass;

                        let tangentX = -ny, tangentY = nx;
                        let velAlongTangent = dvx * tangentX + dvy * tangentY;
                        b1.av += velAlongTangent * 0.05;
                        b2.av -= velAlongTangent * 0.05;
                    }
                }
            }
        }
    }

    balls = balls.filter(b => !b.merged);

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function checkGameOver(dt) {
    let overLine = false;
    for (let b of balls) {
        if (b.y - b.r < dangerLineY && Math.abs(b.vy) < 50 && Math.abs(b.vx) < 50) {
            overLine = true;
            break;
        }
    }

    if (overLine) {
        gameOverTimer += dt;
        if (!warningActive) {
            warningActive = true;
            warningAudioAt = 0;
        }

        if (warningAudioAt <= 0 && gameState === 'PLAYING') {
            playAudioCue('warning', { cooldown: 0 });
            synthesizeSFX('warningPulse');
            warningAudioAt = 0.75;
        } else {
            warningAudioAt -= dt;
        }

        if (gameOverTimer > 2) {
            setState('GAMEOVER');
            playAudioCue('over', { cooldown: 0 });
            vibrate('heavy');
            document.getElementById('final-score').textContent = score;
        }
    } else {
        gameOverTimer = 0;
        warningActive = false;
        warningAudioAt = 0;
    }
}

// ==========================================
// Rendering
// ==========================================
function darken(color, percent = 40) {
    let num = parseInt(color.replace("#", ""), 16),
    amt = Math.round(2.55 * percent),
    R = (num >> 16) - amt,
    G = (num >> 8 & 0x00FF) - amt,
    B = (num & 0x0000FF) - amt;
    return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 + (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 + (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
}

function drawClayBall(context, x, y, r, color, angle, tierIndex = 0) {
    const tierData = TIERS[tierIndex] || TIERS[0];
    const glowColor = tierIndex >= 8 ? 'rgba(255, 215, 107, 0.4)' : 'rgba(140, 240, 255, 0.28)';

    context.save();
    context.translate(x, y);
    context.rotate(angle);

    context.beginPath();
    context.arc(r * 0.12, r * 0.18, r * 1.04, 0, Math.PI * 2);
    context.fillStyle = 'rgba(0, 0, 0, 0.18)';
    context.fill();

    context.beginPath();
    context.arc(0, 0, r * 1.06, 0, Math.PI * 2);
    context.fillStyle = glowColor;
    context.globalAlpha = 0.7;
    context.fill();
    context.globalAlpha = 1;

    const shell = context.createRadialGradient(-r * 0.34, -r * 0.42, r * 0.14, 0, 0, r * 1.08);
    shell.addColorStop(0, '#ffffff');
    shell.addColorStop(0.22, color);
    shell.addColorStop(0.75, darken(color, 18));
    shell.addColorStop(1, darken(color, 36));

    context.beginPath();
    context.arc(0, 0, r, 0, Math.PI * 2);
    context.fillStyle = shell;
    context.fill();

    const core = context.createRadialGradient(-r * 0.22, -r * 0.24, r * 0.05, 0, 0, r * 0.76);
    core.addColorStop(0, 'rgba(255,255,255,0.82)');
    core.addColorStop(0.45, 'rgba(255,255,255,0.12)');
    core.addColorStop(1, 'rgba(255,255,255,0)');
    context.beginPath();
    context.arc(0, 0, r * 0.82, 0, Math.PI * 2);
    context.fillStyle = core;
    context.fill();

    context.beginPath();
    context.arc(0, 0, r * 0.96, 0, Math.PI * 2);
    context.lineWidth = Math.max(2, r * 0.06);
    context.strokeStyle = 'rgba(255,255,255,0.22)';
    context.stroke();

    context.beginPath();
    context.arc(0, 0, r * 0.72, 0, Math.PI * 2);
    context.lineWidth = Math.max(1, r * 0.03);
    context.strokeStyle = 'rgba(255,255,255,0.12)';
    context.stroke();

    context.fillStyle = 'rgba(255,255,255,0.9)';
    context.beginPath();
    context.ellipse(-r * 0.24, -r * 0.34, r * 0.18, r * 0.1, -0.5, 0, Math.PI * 2);
    context.fill();

    context.fillStyle = '#152033';
    const eyeR = Math.max(2, r * 0.085);
    context.beginPath(); context.arc(-r * 0.26, -r * 0.08, eyeR, 0, Math.PI * 2); context.fill();
    context.beginPath(); context.arc(r * 0.26, -r * 0.08, eyeR, 0, Math.PI * 2); context.fill();

    context.fillStyle = '#ffffff';
    context.beginPath(); context.arc(-r * 0.3, -r * 0.12, eyeR * 0.34, 0, Math.PI * 2); context.fill();
    context.beginPath(); context.arc(r * 0.22, -r * 0.12, eyeR * 0.34, 0, Math.PI * 2); context.fill();

    context.beginPath();
    context.arc(0, r * 0.12, r * 0.2, 0.18, Math.PI - 0.18, false);
    context.lineWidth = Math.max(1.5, r * 0.04);
    context.strokeStyle = '#152033';
    context.lineCap = 'round';
    context.stroke();

    const glyphSize = Math.max(10, r * 0.48);
    context.font = `${glyphSize}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillText(tierData.emoji || '✨', 0, r * 0.38);

    context.restore();
}

function render() {
    ctx.clearRect(0, 0, cw, ch);

    ctx.save();
    if (screenShake > 0) {
        let sx = (Math.random() - 0.5) * screenShake;
        let sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.beginPath();
    ctx.moveTo(0, dangerLineY);
    ctx.lineTo(cw, dangerLineY);
    ctx.setLineDash([10, 10]);
    ctx.lineWidth = 4;
    let lineAlpha = 0.3 + (gameOverTimer > 0 ? (Math.sin(Date.now() * 0.01) * 0.2 + 0.2) : 0);
    ctx.strokeStyle = `rgba(255, 50, 50, ${lineAlpha})`;
    ctx.stroke();
    ctx.setLineDash([]);

    for (let b of balls) {
        drawClayBall(ctx, b.x, b.y, b.r, TIERS[b.tier].color, b.angle, b.tier);
    }

    if (dropper && !dropper.isDropping) {
        ctx.beginPath();
        ctx.moveTo(dropper.x, dropper.y);
        ctx.lineTo(dropper.x, ch);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();

        drawClayBall(ctx, dropper.x, dropper.y, dropper.r, TIERS[dropper.tier].color, 0, dropper.tier);
    }

    for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, p.size * p.life), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

// ==========================================
// Main Loop & State
// ==========================================
function setState(newState) {
    gameState = newState;
    document.getElementById('game-over-screen').classList.toggle('hidden', newState !== 'GAMEOVER');
    if (newState === 'GAMEOVER') {
        stopBgm();
        failGif.classList.add('visible');
        feedbackTag.textContent = 'Vault sealed!';
        feedbackTag.classList.add('visible');
    } else if (newState === 'PLAYING') {
        failGif.classList.remove('visible');
        feedbackTag.classList.remove('visible');
        if (audioUnlocked) startBgm();
    }
}

function updateUI() {
    document.getElementById('score-display').textContent = score;
}

function restartGame() {
    playAudioCue('restart', { cooldown: 0 });
    initGame();
}

function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            if (dropCooldown > 0) dropCooldown -= dt;
            updatePhysics(dt);
            checkGameOver(dt);
        }
        render();
    } catch (e) {
        console.error("Loop error:", e);
    }
}

// ==========================================
// Lifecycle & Input Binding
// ==========================================
function resize(entries) {
    for (let entry of entries) {
        let width = entry.contentRect.width;
        let height = entry.contentRect.height;

        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = width * dpr;
        canvas.height = height * dpr;

        cw = width;
        ch = height;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!initialized) {
            initialized = true;
            initGame();
            requestAnimationFrame(gameLoop);
        } else {
            dangerLineY = ch * 0.15;
            for (let b of balls) {
                if (b.x < b.r) b.x = b.r;
                if (b.x > cw - b.r) b.x = cw - b.r;
                if (b.y > ch - b.r) b.y = ch - b.r;
            }
            if (dropper) dropper.y = dangerLineY - dropper.r - 10;
        }
    }
}

function handleGlobalInput(e) {
    const isCanvasGesture = e.target === canvas;
    if (isCanvasGesture && e.cancelable) {
        e.preventDefault();
    }

    if (e.target.id === 'restart-btn') {
        unlockAudio();
        restartGame();
        return;
    }

    if (!isCanvasGesture) return;
    handleInput(e);
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopBgm();
    } else if (gameState === 'PLAYING' && audioUnlocked) {
        startBgm();
    }
});

document.addEventListener('DOMContentLoaded', () => {
    const ro = new ResizeObserver(resize);
    ro.observe(document.getElementById('game-container'));

    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    canvas.addEventListener('pointermove', handleGlobalInput, { passive: false });
    canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
    canvas.addEventListener('pointercancel', handleGlobalInput, { passive: false });
    restartBtn.addEventListener('click', handleGlobalInput);
});
</script>
