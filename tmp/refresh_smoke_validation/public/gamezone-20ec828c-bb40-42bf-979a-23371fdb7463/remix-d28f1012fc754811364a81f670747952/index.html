<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Runner: Data Rush</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json | primary=Orbitron secondary=Exo 2 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #060816;
            --bg-bottom: #120a27;
            --panel: rgba(15, 22, 43, 0.82);
            --panel-border: rgba(80, 244, 255, 0.32);
            --panel-glow: rgba(80, 244, 255, 0.16);
            --theme-color: #22d3ee;
            --theme-soft: #67e8f9;
            --hero-main: #8b5cf6;
            --hero-accent: #22d3ee;
            --hero-core: #f8fafc;
            --coin: #facc15;
            --danger: #fb7185;
            --text-main: #f8fbff;
            --text-dim: #9fb4d8;
            --platform-fill: #1a2142;
            --platform-edge: rgba(34, 211, 238, 0.9);
            --shadow-deep: rgba(4, 8, 20, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(34, 211, 238, 0.14), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(8, 14, 30, 0.15), rgba(18, 10, 39, 0.4)),
                radial-gradient(circle at 20% 15%, rgba(139, 92, 246, 0.16), transparent 28%),
                radial-gradient(circle at 80% 20%, rgba(34, 211, 238, 0.14), transparent 24%),
                #070b18;
        }

        .game-shell::before,
        .game-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-shell::before {
            background:
                linear-gradient(90deg, transparent 0, rgba(103, 232, 249, 0.05) 50%, transparent 100%);
            opacity: 0.35;
            mix-blend-mode: screen;
        }

        .game-shell::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.25)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.025) 0,
                    rgba(255, 255, 255, 0.025) 2px,
                    transparent 2px,
                    transparent 5px
                );
            opacity: 0.35;
        }

        .glass {
            background: linear-gradient(180deg, rgba(13, 20, 39, 0.92), rgba(8, 14, 28, 0.82));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 24px var(--panel-glow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .neon-text {
            text-shadow:
                0 0 8px rgba(34, 211, 238, 0.5),
                0 0 18px rgba(34, 211, 238, 0.22);
        }

        .panel-card {
            position: relative;
            padding: 2rem 1.6rem 1.5rem;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            width: min(88vw, 460px);
        }

        .panel-card::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        .start-screen {
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .start-screen:hover {
            transform: scale(1.02);
        }

        .title {
            margin: 0 0 0.35rem;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(2.2rem, 9vw, 4.1rem);
            line-height: 0.92;
            letter-spacing: 0.06em;
            color: var(--text-main);
        }

        .subtitle {
            margin: 0 0 1.35rem;
            color: var(--theme-soft);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(1rem, 3.6vw, 1.35rem);
            letter-spacing: 0.32em;
            animation: pulseGlow 1.4s ease-in-out infinite;
        }

        .subline {
            margin: 0;
            font-size: 0.98rem;
            line-height: 1.35;
            color: var(--text-dim);
            padding: 0 0.4rem;
        }

        .button-row {
            margin: 0 0 0.85rem;
        }

        .neon-btn {
            appearance: none;
            border: 2px solid var(--theme-color);
            background: linear-gradient(180deg, rgba(34, 211, 238, 0.08), rgba(139, 92, 246, 0.1));
            color: var(--theme-soft);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(1rem, 4.2vw, 1.28rem);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            padding: 0.95rem 1.4rem;
            border-radius: 16px;
            box-shadow:
                0 0 10px rgba(34, 211, 238, 0.25),
                inset 0 0 20px rgba(34, 211, 238, 0.06);
            transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease, color 120ms ease;
            cursor: pointer;
            min-width: min(72vw, 250px);
        }

        .neon-btn:active {
            background: linear-gradient(180deg, rgba(34, 211, 238, 0.85), rgba(103, 232, 249, 0.9));
            color: #08111f;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.48);
            transform: scale(0.97);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: none;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 1rem 0.65rem;
            border-radius: 18px;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(0.8rem, 3vw, 1.05rem);
            letter-spacing: 0.16em;
            color: var(--text-main);
            text-transform: uppercase;
            background: rgba(7, 14, 28, 0.76);
            border: 1px solid rgba(34, 211, 238, 0.25);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.14);
        }

        .hud::before {
            content: "⬢";
            color: var(--theme-soft);
            font-size: 1rem;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.35);
        }

        .score-display {
            color: #fff5a8;
        }

        .status-title {
            margin: 0 0 0.7rem;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(1.9rem, 7vw, 3.3rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-title.danger {
            color: var(--danger);
            text-shadow: 0 0 14px rgba(251, 113, 133, 0.42);
        }

        .final-score-line {
            margin: 0 0 1.25rem;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(1rem, 4vw, 1.4rem);
            color: var(--text-main);
            letter-spacing: 0.12em;
        }

        .final-score {
            color: var(--theme-soft);
        }

        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        .controls-layer {
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            display: none;
        }

        .dpad-wrap {
            position: absolute;
            bottom: max(1.4rem, env(safe-area-inset-bottom));
            left: 1.1rem;
            display: flex;
            gap: 0.85rem;
            pointer-events: auto;
        }

        .jump-wrap {
            position: absolute;
            bottom: max(1.2rem, env(safe-area-inset-bottom));
            right: 1.1rem;
            pointer-events: auto;
        }

        .d-pad-btn,
        .jump-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
            overflow: hidden;
        }

        .d-pad-btn::before,
        .jump-btn::before {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .d-pad-btn::before {
            border-radius: 12px;
        }

        .d-pad-btn {
            width: 4.4rem;
            height: 4.4rem;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03)),
                rgba(13, 20, 39, 0.8);
            border: 2px solid rgba(103, 232, 249, 0.28);
            backdrop-filter: blur(6px);
            box-shadow:
                0 14px 24px var(--shadow-deep),
                inset 0 0 20px rgba(103, 232, 249, 0.06);
        }

        .d-pad-btn:active {
            background:
                linear-gradient(180deg, rgba(34, 211, 238, 0.38), rgba(139, 92, 246, 0.22)),
                rgba(13, 20, 39, 0.92);
            border-color: var(--theme-color);
            transform: translateY(1px) scale(0.97);
        }

        .jump-btn {
            width: 5.2rem;
            height: 5.2rem;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), transparent 34%),
                linear-gradient(180deg, rgba(244, 114, 182, 0.42), rgba(139, 92, 246, 0.42));
            border: 2px solid rgba(244, 114, 182, 0.7);
            box-shadow:
                0 18px 28px rgba(12, 10, 28, 0.55),
                0 0 18px rgba(244, 114, 182, 0.24);
        }

        .jump-btn:active {
            transform: scale(0.96);
            box-shadow:
                0 10px 18px rgba(12, 10, 28, 0.45),
                0 0 24px rgba(244, 114, 182, 0.36);
        }

        .jump-label {
            color: #fff;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.24);
        }

        .icon-arrow {
            width: 1.8rem;
            height: 1.8rem;
            fill: white;
            filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.2));
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.7; text-shadow: 0 0 8px rgba(34, 211, 238, 0.3); }
            50% { opacity: 1; text-shadow: 0 0 16px rgba(34, 211, 238, 0.45); }
        }

        .feedback-layer {
            position: absolute;
            inset: 0;
            z-index: 45;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(72px, 18vw, 124px);
            height: clamp(72px, 18vw, 124px);
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(103, 232, 249, 0.35);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
            background: rgba(6, 8, 22, 0.55);
            opacity: 0;
            transform: scale(0.85) translateY(16px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.visible {
            opacity: 0.94;
            transform: scale(1) translateY(0);
        }

        .feedback-gif.collect {
            top: 5.4rem;
            right: 1rem;
        }

        .feedback-gif.fail {
            bottom: calc(max(6.5rem, env(safe-area-inset-bottom) + 5rem));
            right: 1rem;
        }

        .feedback-caption {
            position: absolute;
            min-width: 128px;
            max-width: min(42vw, 220px);
            padding: 0.45rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(103, 232, 249, 0.28);
            background: rgba(7, 14, 28, 0.76);
            color: var(--theme-soft);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(0.7rem, 2.4vw, 0.9rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-caption.collect {
            top: calc(5.4rem + clamp(78px, 19vw, 134px));
            right: 1rem;
        }

        .feedback-caption.fail {
            bottom: calc(max(4rem, env(safe-area-inset-bottom) + 3rem));
            right: 1rem;
        }

        @media (max-width: 640px) {
            .panel-card {
                width: min(92vw, 420px);
                padding: 1.45rem 1.05rem 1.1rem;
                border-radius: 20px;
            }

            .subline {
                font-size: 0.9rem;
            }

            .hud {
                top: 0.75rem;
                left: 0.75rem;
                padding: 0.62rem 0.82rem 0.58rem;
                border-radius: 15px;
            }

            .dpad-wrap {
                left: 0.85rem;
                gap: 0.7rem;
            }

            .jump-wrap {
                right: 0.85rem;
            }

            .d-pad-btn {
                width: 4rem;
                height: 4rem;
            }

            .jump-btn {
                width: 4.8rem;
                height: 4.8rem;
            }

            .jump-label {
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Run Speed", "value": 6, "min": 3, "max": 12 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 16, "min": 10, "max": 25 },
    "gravity": { "type": "number", "label": "Gravity", "value": 0.8, "min": 0.4, "max": 1.5 },
    "themeColor": { "type": "color", "label": "Neon Color", "value": "#22d3ee" }
}
</script>

<!-- [agent-note][stage3] resolved-audio: start/collect/jump/land/die/bgm -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Action Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="SFX Collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_die" data-editable="audio" data-label="SFX Game Over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<audio id="sfx_jump" data-editable="audio" data-label="SFX Jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3" preload="auto"></audio>
<audio id="sfx_land" data-editable="audio" data-label="SFX Land" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>
<audio id="sfx_start" data-editable="audio" data-label="SFX Start Run" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

<div id="game-container" class="game-shell">
    <canvas id="gameCanvas"></canvas>

    <div id="controls-layer" class="controls-layer hidden">
        <div class="dpad-wrap">
            <div id="btn-left" class="d-pad-btn">
                <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path></svg>
            </div>
            <div id="btn-right" class="d-pad-btn">
                <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path></svg>
            </div>
        </div>
        <div class="jump-wrap">
            <div id="btn-jump" class="jump-btn">
                <span class="jump-label">Boost</span>
            </div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: collect/fail feedback -> catalogs/gifs.json | keep off playfield -->
    <div id="feedback-layer" class="feedback-layer" aria-hidden="true">
        <img
            id="gif-collect"
            class="feedback-gif collect"
            src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp"
            alt=""
            loading="lazy"
            decoding="async"
        >
        <div id="caption-collect" class="feedback-caption collect">Shard secured</div>
        <img
            id="gif-fail"
            class="feedback-gif fail"
            src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            alt=""
            loading="lazy"
            decoding="async"
        >
        <div id="caption-fail" class="feedback-caption fail">Signal lost</div>
    </div>

    <div id="ui-layer" class="ui-layer">
        <div id="hud" class="hud neon-text hidden">
            Data: <span id="score-display" class="score-display">0</span>
        </div>

        <div id="start-screen" class="glass panel-card start-screen">
            <h1 class="title neon-text">Data Rush</h1>
            <p class="subtitle">BYTE SPRINTER ONLINE</p>
            <div class="button-row">
                <button id="start-btn" class="neon-btn">Start Run</button>
            </div>
            <p class="subline">Dash between signal rails, harvest bright data shards, and tap Boost to clear every gap without losing the line.</p>
        </div>

        <div id="game-over-screen" class="glass panel-card hidden">
            <h2 class="status-title danger">Signal Lost</h2>
            <p class="final-score-line">Data secured: <span id="final-score" class="final-score">0</span></p>
            <div class="button-row">
                <button id="restart-btn" class="neon-btn">Retry Run</button>
            </div>
        </div>
    </div>
</div>

<script>
window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Run Speed", "value": 6, "min": 3, "max": 12 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 16, "min": 10, "max": 25 },
    "gravity": { "type": "number", "label": "Gravity", "value": 0.8, "min": 0.4, "max": 1.5 },
    "themeColor": { "type": "color", "label": "Neon Color", "value": "#22d3ee" }
};
window.gameConfig = {};
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            document.documentElement.style.setProperty('--theme-color', val);
        }
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let animationId;
let lastTime = 0;

const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
let currentState = STATE.MENU;
let score = 0;
let cameraX = 0;

const input = { left: false, right: false, jump: false, jumpPressed: false };

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    collect: document.getElementById('sfx_collect'),
    die: document.getElementById('sfx_die'),
    jump: document.getElementById('sfx_jump'),
    land: document.getElementById('sfx_land'),
    start: document.getElementById('sfx_start')
};
const soundVolumes = {
    bgm: 0.2,
    collect: 0.6,
    die: 0.68,
    jump: 0.45,
    land: 0.35,
    start: 0.5
};
let audioUnlocked = false;
let wasGrounded = false;
let landSoundCooldown = 0;
let feedbackTimeoutId = 0;

Object.entries(sounds).forEach(([key, el]) => {
    if (el) {
        el.volume = soundVolumes[key] ?? 0.5;
    }
});

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    audioCtx.resume().catch(() => {});
}

function playSound(id) {
    const el = sounds[id];
    if (!el) return;
    try {
        if (id === 'bgm') {
            if (el.paused) {
                el.currentTime = 0;
                el.play().catch(() => {});
            }
            return;
        }
        el.pause();
        el.currentTime = 0;
        el.play().catch(() => {});
    } catch (_) {}
}

function syncBgm() {
    if (!sounds.bgm) return;
    if (currentState === STATE.PLAYING && audioUnlocked) {
        if (sounds.bgm.paused) {
            sounds.bgm.play().catch(() => {});
        }
    } else if (!sounds.bgm.paused) {
        sounds.bgm.pause();
    }
}

function flashFeedback(type, text) {
    const gif = document.getElementById(`gif-${type}`);
    const caption = document.getElementById(`caption-${type}`);
    if (!gif || !caption) return;

    caption.textContent = text;
    gif.classList.add('visible');
    caption.classList.add('visible');

    window.clearTimeout(feedbackTimeoutId);
    feedbackTimeoutId = window.setTimeout(() => {
        gif.classList.remove('visible');
        caption.classList.remove('visible');
    }, 1200);
}

let player = {
    x: 100, y: 300, w: 30, h: 50,
    vx: 0, vy: 0,
    grounded: false,
    facing: 1,
    animTimer: 0
};

let platforms = [];
let particles = [];
let coins = [];

function initLevel() {
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.facing = 1;
    player.animTimer = 0;
    score = 0;
    cameraX = 0;
    wasGrounded = false;
    landSoundCooldown = 0;

    platforms = [];
    coins = [];
    particles = [];

    platforms.push({ x: -100, y: 400, w: 1000, h: 100 });

    let cx = 900;
    for (let i = 0; i < 5; i++) {
        generatePlatform(cx);
        cx += 300 + Math.random() * 200;
    }
}

function generatePlatform(startX) {
    const y = 300 + (Math.random() * 100 - 50);
    const w = 200 + Math.random() * 300;
    platforms.push({ x: startX, y: y, w: w, h: 50 });

    if (Math.random() > 0.3) {
        coins.push({
            x: startX + w / 2 - 15,
            y: y - 60,
            w: 30, h: 30,
            active: true,
            floatOffset: Math.random() * Math.PI
        });
    }
}

function update(dt) {
    if (currentState !== STATE.PLAYING) return;

    if (landSoundCooldown > 0) {
        landSoundCooldown -= dt;
    }

    const speed = window.gameConfig.heroSpeed;
    if (input.left) {
        player.vx = -speed;
        player.facing = -1;
    } else if (input.right) {
        player.vx = speed;
        player.facing = 1;
    } else {
        player.vx *= 0.8;
    }

    if (input.jumpPressed && player.grounded) {
        player.vy = -window.gameConfig.jumpForce;
        player.grounded = false;
        input.jumpPressed = false;
        playSound('jump');
        createParticles(player.x + player.w / 2, player.y + player.h, 10, '#fff');
    }
    input.jumpPressed = false;

    player.vy += window.gameConfig.gravity;

    player.x += player.vx;
    player.y += player.vy;

    const targetCamX = player.x - canvas.width / 4;
    cameraX += (targetCamX - cameraX) * 0.1;

    player.grounded = false;
    platforms.forEach(p => {
        if (player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 20 &&
            player.vy >= 0) {

            player.grounded = true;
            player.vy = 0;
            player.y = p.y - player.h;
        }
    });

    if (player.grounded && !wasGrounded && landSoundCooldown <= 0) {
        playSound('land');
        landSoundCooldown = 140;
    }
    wasGrounded = player.grounded;

    if (player.y > canvas.height + 100) {
        gameOver();
    }

    const rightmost = platforms[platforms.length - 1];
    if (rightmost.x < cameraX + canvas.width + 200) {
        generatePlatform(rightmost.x + rightmost.w + 100 + Math.random() * 150);
    }

    if (platforms[0].x + platforms[0].w < cameraX - 200) {
        platforms.shift();
    }

    coins.forEach(c => {
        if (!c.active) return;
        c.floatOffset += dt * 0.005;
        const cy = c.y + Math.sin(c.floatOffset) * 10;

        if (player.x < c.x + c.w && player.x + player.w > c.x &&
            player.y < cy + c.h && player.y + player.h > cy) {
            c.active = false;
            score += 100;
            document.getElementById('score-display').innerText = score;
            playSound('collect');
            flashFeedback('collect', '+100 Data');
            createParticles(c.x + c.w / 2, cy + c.h / 2, 15, '#facc15');
        }
    });

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }

    player.animTimer += dt;
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function gameOver() {
    currentState = STATE.GAMEOVER;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('controls-layer').classList.add('hidden');
    document.getElementById('final-score').innerText = score;
    flashFeedback('fail', 'Run crashed');
    playSound('die');
    syncBgm();
}

function drawSkyline() {
    const skylineSpeed = 0.18;
    const baseY = canvas.height * 0.72;
    const towerWidths = [50, 76, 62, 90, 54, 72, 58, 84];
    let x = -((cameraX * skylineSpeed) % 546) - 70;
    let i = 0;
    ctx.save();
    while (x < canvas.width + 120) {
        const width = towerWidths[i % towerWidths.length];
        const height = 70 + (i % 5) * 28;
        const towerTop = baseY - height;
        const gradient = ctx.createLinearGradient(0, towerTop, 0, baseY);
        gradient.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
        gradient.addColorStop(1, 'rgba(15, 23, 42, 0.85)');
        ctx.fillStyle = gradient;
        ctx.fillRect(x, towerTop, width, height);

        ctx.fillStyle = 'rgba(103, 232, 249, 0.22)';
        for (let row = 0; row < Math.floor(height / 18); row++) {
            for (let col = 0; col < Math.floor(width / 14); col++) {
                if ((row + col + i) % 3 === 0) {
                    ctx.fillRect(x + 8 + col * 12, towerTop + 8 + row * 14, 4, 5);
                }
            }
        }
        x += width + 18;
        i++;
    }
    ctx.restore();
}

function drawPlatform(p) {
    const topGlow = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    topGlow.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
    topGlow.addColorStop(1, 'rgba(15, 23, 42, 0.94)');
    ctx.fillStyle = topGlow;
    ctx.fillRect(p.x, p.y, p.w, p.h);

    ctx.fillStyle = 'rgba(139, 92, 246, 0.2)';
    ctx.fillRect(p.x, p.y + p.h - 10, p.w, 10);

    ctx.strokeStyle = window.gameConfig.themeColor;
    ctx.lineWidth = 2;
    ctx.shadowColor = window.gameConfig.themeColor;
    ctx.shadowBlur = 10;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.09)';
    for (let i = 10; i < p.w - 14; i += 22) {
        ctx.fillRect(p.x + i, p.y + 8, 12, 3);
    }
}

function drawCoin(c) {
    const cy = c.y + Math.sin(c.floatOffset) * 10;
    const cx = c.x + c.w / 2;
    const ringPulse = 10 + Math.sin(c.floatOffset * 2) * 2;

    ctx.save();
    ctx.shadowColor = '#fde047';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(cx, cy + c.h / 2, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 248, 196, 0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy + c.h / 2, ringPulse, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(cx - 2, cy + c.h / 2 - 6, 4, 12);
    ctx.restore();
}

function drawPlayer() {
    const px = player.x;
    const py = player.y;
    const pw = player.w;
    const ph = player.h;
    const bob = player.grounded ? Math.sin(player.animTimer * 0.012) * 1.8 : -2;
    const walkCycle = Math.sin(player.animTimer * 0.02);
    const pulse = 0.72 + Math.sin(player.animTimer * 0.016) * 0.18;

    ctx.save();
    ctx.translate(px + pw / 2, py + ph / 2 + bob);

    if (player.facing === -1) {
        ctx.scale(-1, 1);
    }

    ctx.shadowColor = 'rgba(139, 92, 246, 0.45)';
    ctx.shadowBlur = 18;

    ctx.fillStyle = 'rgba(34, 211, 238, 0.14)';
    ctx.beginPath();
    ctx.ellipse(0, 34, 22, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    const bodyGradient = ctx.createLinearGradient(0, -28, 0, 24);
    bodyGradient.addColorStop(0, '#c084fc');
    bodyGradient.addColorStop(1, '#6d28d9');
    ctx.fillStyle = bodyGradient;
    ctx.beginPath();
    ctx.roundRect(-13, -8, 26, 34, 8);
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-10, -3, 20, 5);

    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(0, -19, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(0, -19, 12, 0, Math.PI);
    ctx.fill();

    ctx.fillStyle = '#22d3ee';
    ctx.shadowColor = 'rgba(34, 211, 238, 0.9)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.roundRect(-8, -22, 16, 7, 3);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#f472b6';
    ctx.beginPath();
    ctx.arc(8, -3, 4 + pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#67e8f9';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(13, -6);
    ctx.lineTo(22, -12);
    ctx.lineTo(18, -1);
    ctx.stroke();

    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(-7, 2);
    ctx.lineTo(-16, 13 + walkCycle * 3);
    ctx.moveTo(7, 2);
    ctx.lineTo(15, 14 - walkCycle * 3);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-6, 26);
    ctx.lineTo(-10 + walkCycle * 4, 39);
    ctx.moveTo(6, 26);
    ctx.lineTo(10 - walkCycle * 4, 39);
    ctx.stroke();

    ctx.fillStyle = '#22d3ee';
    ctx.fillRect(-12, 5, 4, 10);
    ctx.fillRect(8, 5, 4, 10);
    ctx.restore();
}

function draw() {
    const backgroundGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    backgroundGradient.addColorStop(0, '#060816');
    backgroundGradient.addColorStop(0.58, '#120b28');
    backgroundGradient.addColorStop(1, '#090d1f');
    ctx.fillStyle = backgroundGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    const starCount = Math.max(18, Math.floor(canvas.width / 65));
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < starCount; i++) {
        const sx = (i * 97 - cameraX * 0.1) % (canvas.width + 40);
        const sy = 20 + (i * 37) % Math.max(60, canvas.height * 0.42);
        const size = (i % 3) + 1;
        ctx.globalAlpha = 0.2 + ((i % 5) * 0.12);
        ctx.fillRect(sx < 0 ? sx + canvas.width + 40 : sx, sy, size, size);
    }
    ctx.globalAlpha = 1;

    drawSkyline();

    const gridSize = 48;
    const offsetX = -(cameraX * 0.5) % gridSize;
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.moveTo(x, canvas.height * 0.45);
        ctx.lineTo(x, canvas.height);
    }
    for (let y = canvas.height * 0.45; y < canvas.height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    ctx.translate(-cameraX, 0);

    platforms.forEach(drawPlatform);

    coins.forEach(c => {
        if (c.active) drawCoin(c);
    });

    drawPlayer();

    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    ctx.restore();
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    animationId = requestAnimationFrame(gameLoop);
}

document.addEventListener('DOMContentLoaded', () => {
    try {
        const configElement = document.getElementById('game-config');
        if (configElement) {
            const parsed = JSON.parse(configElement.textContent);
            for (const key in parsed) {
                window.gameConfigDefs[key] = parsed[key];
                window.gameConfig[key] = parsed[key].value;
            }
        }
    } catch (e) {
        console.error("Config Parse Error", e);
    }

    const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', resize);
    resize();

    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const controls = document.getElementById('controls-layer');

    const startGame = () => {
        unlockAudio();
        playSound('start');

        currentState = STATE.PLAYING;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.style.display = 'flex';
        hud.classList.remove('hidden');
        controls.style.display = 'block';
        controls.classList.remove('hidden');

        document.getElementById('score-display').innerText = '0';
        initLevel();
        syncBgm();
    };

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    const bindBtn = (id, key) => {
        const el = document.getElementById(id);
        if (!el) return;

        const down = (e) => {
            e.preventDefault();
            if (key === 'jump') {
                input.jump = true;
                input.jumpPressed = true;
            } else {
                input[key] = true;
            }
        };
        const up = (e) => {
            e.preventDefault();
            input[key] = false;
        };

        el.addEventListener('pointerdown', down, { passive: false });
        el.addEventListener('pointerup', up, { passive: false });
        el.addEventListener('pointerleave', up, { passive: false });
        el.addEventListener('pointercancel', up, { passive: false });
    };

    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');
    bindBtn('btn-jump', 'jump');

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') input.left = true;
        if (e.code === 'ArrowRight') input.right = true;
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            if (!input.jump) input.jumpPressed = true;
            input.jump = true;
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft') input.left = false;
        if (e.code === 'ArrowRight') input.right = false;
        if (e.code === 'Space' || e.code === 'ArrowUp') input.jump = false;
    });

    requestAnimationFrame(gameLoop);
});
</script>
