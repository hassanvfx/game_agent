<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Loop Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--sky0:#04030f;--sky1:#10104a;--cyan:#2df7ff;--blue:#1587ff;--deep:#071330;--gold:#ffd84d;--pink:#ff3bd5;--red:#ff4b69;--white:#f8fbff;--panel:rgba(5,12,34,.78)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050610;color:var(--white);font-family:Audiowide,system-ui,sans-serif}button{font:inherit}canvas{display:block;width:100%;height:100%;touch-action:none}.hidden{display:none!important}
#game-container{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(45,247,255,.22),transparent 32%),linear-gradient(#070725,#121058 58%,#2a0e54)}
#game-container:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px),radial-gradient(circle at 15% 18%,rgba(255,59,213,.2),transparent 22%);mix-blend-mode:screen;opacity:.65}
.ui-layer{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none}.panel{width:min(91vw,460px);padding:1.45rem 1.15rem 1.25rem;border-radius:28px;text-align:center;pointer-events:auto;background:linear-gradient(180deg,rgba(9,23,62,.88),rgba(4,7,27,.82));border:2px solid rgba(45,247,255,.42);box-shadow:0 0 34px rgba(45,247,255,.2),inset 0 0 28px rgba(255,59,213,.08)}
.title{font-family:Bangers,Audiowide,cursive;margin:.1rem 0 .25rem;font-size:clamp(3.1rem,14vw,5.7rem);line-height:.82;letter-spacing:.035em;color:#fff;text-shadow:4px 4px 0 #0f57ff,0 0 22px rgba(45,247,255,.75),-3px 0 0 var(--pink)}.subtitle{margin:0 0 .9rem;color:var(--gold);font-size:clamp(.85rem,3.5vw,1.08rem);letter-spacing:.12em;text-transform:uppercase}.subline{margin:.75rem auto 0;max-width:28rem;color:#cce9ff;font-size:clamp(.83rem,3.35vw,.98rem);line-height:1.38}.neon-btn{min-width:min(74vw,270px);padding:.95rem 1.25rem;border:0;border-radius:999px;color:#06112b;background:linear-gradient(180deg,#fff56b,#ffb627);box-shadow:0 8px 0 #a95a00,0 0 22px rgba(255,216,77,.42);text-transform:uppercase;letter-spacing:.12em;cursor:pointer}.neon-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #a95a00,0 0 28px rgba(255,216,77,.55)}
.hud{position:absolute;top:max(.72rem,env(safe-area-inset-top));left:.72rem;z-index:35;display:none;align-items:center;gap:.55rem;padding:.55rem .72rem;border-radius:18px;background:rgba(3,10,28,.74);border:1px solid rgba(45,247,255,.4);box-shadow:0 0 20px rgba(45,247,255,.18);font-size:clamp(.75rem,3vw,.98rem);text-transform:uppercase;letter-spacing:.1em}.ring-dot{width:1.05rem;height:1.05rem;border:3px solid var(--gold);border-radius:50%;box-shadow:0 0 11px var(--gold);display:inline-block}.score-display{color:#fff3a0}.status-title{font-family:Bangers,cursive;margin:.05rem 0 .4rem;font-size:clamp(2.7rem,11vw,4.9rem);line-height:.86;color:#fff;text-shadow:4px 3px 0 #7f1237,0 0 18px rgba(255,75,105,.62)}.final-score-line{color:#d8f4ff;margin:.2rem 0 1rem}.final-score{color:var(--gold)}
.controls-layer{position:absolute;inset:0;z-index:25;display:none;pointer-events:none}.dpad-wrap{position:absolute;left:.85rem;bottom:max(1rem,env(safe-area-inset-bottom));display:flex;gap:.7rem;pointer-events:auto}.jump-wrap{position:absolute;right:.85rem;bottom:max(.9rem,env(safe-area-inset-bottom));pointer-events:auto}.d-pad-btn,.jump-btn{display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;backdrop-filter:blur(8px);color:white}.d-pad-btn{width:4.05rem;height:4.05rem;border-radius:19px;background:rgba(5,16,48,.66);border:2px solid rgba(45,247,255,.44);box-shadow:0 12px 26px rgba(0,0,0,.38),inset 0 0 22px rgba(45,247,255,.1)}.jump-btn{width:5rem;height:5rem;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8,transparent 28%),linear-gradient(160deg,#20f5ff,#1262ff 56%,#ff3bd5);border:2px solid #fff7;box-shadow:0 14px 28px rgba(0,0,0,.42),0 0 24px rgba(45,247,255,.28)}.jump-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;text-shadow:0 2px 4px #001}.d-pad-btn:active,.jump-btn:active{transform:scale(.96)}.icon-arrow{width:1.9rem;height:1.9rem;fill:#fff;filter:drop-shadow(0 0 8px var(--cyan))}.toast{position:absolute;right:.8rem;top:4.8rem;z-index:34;pointer-events:none;padding:.55rem .8rem;border-radius:999px;background:rgba(5,13,38,.82);border:1px solid rgba(255,216,77,.55);color:var(--gold);font-size:clamp(.72rem,2.7vw,.92rem);letter-spacing:.08em;opacity:0;transform:translateY(10px);transition:.18s}.toast.visible{opacity:1;transform:translateY(0)}
@media(max-width:430px){.panel{padding:1.2rem .9rem}.d-pad-btn{width:3.75rem;height:3.75rem}.jump-btn{width:4.65rem;height:4.65rem}.subline{font-size:.82rem}}
</style>
</head>
<body>
<script id="game-config" type="application/x-game-config">{"heroSpeed":{"type":"number","label":"Run Speed","value":6,"min":3,"max":12},"jumpForce":{"type":"number","label":"Jump Force","value":16,"min":10,"max":25},"gravity":{"type":"number","label":"Gravity","value":0.8,"min":0.4,"max":1.5},"themeColor":{"type":"color","label":"Neon Color","value":"#2df7ff"}}</script>
<audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/sfx/tense_character_01.mp3" preload="auto"></audio>
<audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/triumphant_character_01.mp3" preload="auto"></audio>
<audio id="sfx_die" src="https://gamezone-virid.vercel.app/assets/audios/sfx/tense_character_02.mp3" preload="auto"></audio>
<audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3" preload="auto"></audio>
<audio id="sfx_land" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_02.mp3" preload="auto"></audio>
<div id="game-container"><canvas id="gameCanvas"></canvas><div id="toast" class="toast">+100 Rings</div>
<div id="controls-layer" class="controls-layer hidden"><div class="dpad-wrap"><div id="btn-left" class="d-pad-btn"><svg class="icon-arrow" viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div><div id="btn-right" class="d-pad-btn"><svg class="icon-arrow" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div></div><div class="jump-wrap"><div id="btn-jump" class="jump-btn"><span class="jump-label">Boost</span></div></div></div>
<div id="ui-layer" class="ui-layer"><div id="hud" class="hud hidden"><span class="ring-dot"></span>Rings <span id="score-display" class="score-display">0</span></div><div id="start-screen" class="panel"><h1 class="title">Neon Loop Rush</h1><p class="subtitle">Blue Bolt vs the gravity gaps</p><button id="start-btn" class="neon-btn">Start Dash</button><p class="subline">Hold arrows or thumb pads to master momentum. Tap Boost when grounded, snatch gold rings, and outrun the neon loop city.</p></div><div id="game-over-screen" class="panel hidden"><h2 class="status-title">Wipeout!</h2><p class="final-score-line">Rings banked: <span id="final-score" class="final-score">0</span></p><button id="restart-btn" class="neon-btn">Retry Dash</button></div></div></div>
<script>
window.gameConfigDefs={heroSpeed:{value:6},jumpForce:{value:16},gravity:{value:.8},themeColor:{value:'#2df7ff'}};window.gameConfig={heroSpeed:6,jumpForce:16,gravity:.8,themeColor:'#2df7ff'};window.updateGameConfig=(k,v)=>{if(k in window.gameConfig){window.gameConfig[k]=v;if(k==='themeColor')document.documentElement.style.setProperty('--cyan',v)}};
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let animationId,lastTime=0;const STATE={MENU:0,PLAYING:1,GAMEOVER:2};let currentState=STATE.MENU,score=0,cameraX=0;const input={left:false,right:false,jump:false,jumpPressed:false};let player={x:100,y:300,w:30,h:50,vx:0,vy:0,grounded:false,facing:1,animTimer:0};let platforms=[],coins=[],particles=[],wasGrounded=false,landSoundCooldown=0,toastTimer=0;const sounds={start:document.getElementById('sfx_start'),collect:document.getElementById('sfx_collect'),die:document.getElementById('sfx_die'),jump:document.getElementById('sfx_jump'),land:document.getElementById('sfx_land')};Object.values(sounds).forEach(s=>{if(s)s.volume=.48});
function playSound(id){const s=sounds[id];if(!s)return;try{s.pause();s.currentTime=0;s.play().catch(()=>{})}catch(e){}}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resize);resize();
function initLevel(){player={x:100,y:300,w:30,h:50,vx:0,vy:0,grounded:false,facing:1,animTimer:0};score=0;cameraX=0;wasGrounded=false;landSoundCooldown=0;platforms=[];coins=[];particles=[];platforms.push({x:-100,y:400,w:1000,h:100,loop:true});let cx=900;for(let i=0;i<5;i++){generatePlatform(cx);cx+=300+Math.random()*200}document.getElementById('score-display').textContent='0'}
function generatePlatform(startX){const y=300+(Math.random()*100-50),w=200+Math.random()*300;platforms.push({x:startX,y,w,h:50,loop:Math.random()>.45});if(Math.random()>.3)coins.push({x:startX+w/2-15,y:y-60,w:30,h:30,active:true,floatOffset:Math.random()*Math.PI})}
function startGame(){playSound('start');currentState=STATE.PLAYING;document.getElementById('start-screen').classList.add('hidden');document.getElementById('game-over-screen').classList.add('hidden');const hud=document.getElementById('hud'),controls=document.getElementById('controls-layer');hud.style.display='flex';hud.classList.remove('hidden');controls.style.display='block';controls.classList.remove('hidden');initLevel()}
function gameOver(){if(currentState!==STATE.PLAYING)return;currentState=STATE.GAMEOVER;document.getElementById('game-over-screen').classList.remove('hidden');document.getElementById('controls-layer').classList.add('hidden');document.getElementById('final-score').textContent=score;flashToast('Wipeout!');playSound('die')}
function flashToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),950)}
function update(dt){if(currentState!==STATE.PLAYING)return;if(landSoundCooldown>0)landSoundCooldown-=dt;const speed=window.gameConfig.heroSpeed;if(input.left){player.vx=-speed;player.facing=-1}else if(input.right){player.vx=speed;player.facing=1}else player.vx*=.8;if(input.jumpPressed&&player.grounded){player.vy=-window.gameConfig.jumpForce;player.grounded=false;input.jumpPressed=false;playSound('jump');createParticles(player.x+player.w/2,player.y+player.h,18,'#2df7ff')}input.jumpPressed=false;player.vy+=window.gameConfig.gravity;player.x+=player.vx;player.y+=player.vy;const targetCamX=player.x-canvas.width/4;cameraX+=(targetCamX-cameraX)*.1;player.grounded=false;platforms.forEach(p=>{if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+20&&player.vy>=0){player.grounded=true;player.vy=0;player.y=p.y-player.h}});if(player.grounded&&!wasGrounded&&landSoundCooldown<=0){playSound('land');landSoundCooldown=140;createParticles(player.x+player.w/2,player.y+player.h,7,'#ffffff')}wasGrounded=player.grounded;if(player.y>canvas.height+100)gameOver();const rightmost=platforms[platforms.length-1];if(rightmost.x<cameraX+canvas.width+200)generatePlatform(rightmost.x+rightmost.w+100+Math.random()*150);if(platforms[0].x+platforms[0].w<cameraX-200)platforms.shift();coins.forEach(c=>{if(!c.active)return;c.floatOffset+=dt*.005;const cy=c.y+Math.sin(c.floatOffset)*10;if(player.x<c.x+c.w&&player.x+player.w>c.x&&player.y<cy+c.h&&player.y+player.h>cy){c.active=false;score+=100;document.getElementById('score-display').textContent=score;playSound('collect');flashToast('+100 Rings');createParticles(c.x+c.w/2,cy+c.h/2,22,'#ffd84d')}});for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.045;if(p.life<=0)particles.splice(i,1)}player.animTimer+=dt}
function createParticles(x,y,count,color){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.7)*10,life:1,color,size:Math.random()*4+2})}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#05051d');g.addColorStop(.55,'#101258');g.addColorStop(1,'#3a1158');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();for(let i=0;i<9;i++){const x=((i*170-cameraX*.12)%(canvas.width+220))-120,y=canvas.height*.17+(i%4)*38;ctx.strokeStyle=i%2?'rgba(255,59,213,.28)':'rgba(45,247,255,.28)';ctx.lineWidth=8;ctx.beginPath();ctx.arc(x,y,44+(i%3)*14,0,Math.PI*2);ctx.stroke()}for(let i=0;i<22;i++){const sx=(i*73-cameraX*.65)%(canvas.width+80);ctx.fillStyle=i%3?'rgba(45,247,255,.35)':'rgba(255,216,77,.38)';ctx.fillRect(sx<0?sx+canvas.width+80:sx,60+(i*41)%Math.max(120,canvas.height*.55),28+(i%4)*16,2)}const base=canvas.height*.72;for(let i=-1;i<10;i++){const x=((i*88-cameraX*.2)%(canvas.width+140))-70,h=80+(i%5)*30;ctx.fillStyle='rgba(7,16,49,.82)';ctx.fillRect(x,base-h,58,h);ctx.fillStyle='rgba(45,247,255,.22)';for(let r=10;r<h-6;r+=20)ctx.fillRect(x+10,base-h+r,30,3)}ctx.restore()}
function drawPlatform(p){ctx.save();const edge=window.gameConfig.themeColor;ctx.fillStyle='rgba(3,13,34,.96)';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='rgba(255,59,213,.26)';ctx.fillRect(p.x,p.y+p.h-11,p.w,11);ctx.strokeStyle=edge;ctx.shadowColor=edge;ctx.shadowBlur=14;ctx.lineWidth=3;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.14)';for(let i=12;i<p.w-18;i+=26)ctx.fillRect(p.x+i,p.y+9,15,4);if(p.loop){ctx.strokeStyle='rgba(255,216,77,.38)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x+p.w*.72,p.y-2,42,Math.PI,0);ctx.stroke()}ctx.restore()}
function drawCoin(c){const cy=c.y+Math.sin(c.floatOffset)*10,cx=c.x+c.w/2;ctx.save();ctx.translate(cx,cy+c.h/2);ctx.rotate(c.floatOffset*.55);ctx.shadowColor='#ffd84d';ctx.shadowBlur=18;ctx.strokeStyle='#ffd84d';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(0,0,11,15,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,6,9,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawPlayer(){const px=player.x,py=player.y,pw=player.w,ph=player.h,bob=player.grounded?Math.sin(player.animTimer*.018)*2:-2,spin=Math.sin(player.animTimer*.035),leg=Math.sin(player.animTimer*.03);ctx.save();ctx.translate(px+pw/2,py+ph/2+bob);if(player.facing<0)ctx.scale(-1,1);ctx.shadowColor='rgba(45,247,255,.8)';ctx.shadowBlur=18;ctx.fillStyle='rgba(45,247,255,.22)';ctx.beginPath();ctx.ellipse(-8,33,28,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(21,135,255,.42)';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-10-i*6,-10+i*8);ctx.lineTo(-36-i*8,-22+i*9+spin*3);ctx.lineTo(-15-i*3,2+i*6);ctx.closePath();ctx.fill()}const bg=ctx.createRadialGradient(2,-5,3,0,0,28);bg.addColorStop(0,'#59f5ff');bg.addColorStop(.42,'#188fff');bg.addColorStop(1,'#0c3cc4');ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,1,18,25,-.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe7c4';ctx.beginPath();ctx.ellipse(9,-4,11,14,.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(13,-8,5,7,.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0b1025';ctx.beginPath();ctx.arc(15,-7,2.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-4,21);ctx.lineTo(-13+leg*5,35);ctx.moveTo(7,21);ctx.lineTo(17-leg*5,35);ctx.stroke();ctx.fillStyle='#ff3b3b';ctx.fillRect(-22+leg*5,35,16,6);ctx.fillRect(9-leg*5,35,17,6);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-10,1);ctx.lineTo(-23,-4+leg*3);ctx.stroke();ctx.restore()}
function draw(){drawBackground();ctx.save();ctx.translate(-cameraX,0);platforms.forEach(drawPlatform);coins.forEach(c=>{if(c.active)drawCoin(c)});drawPlayer();particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.restore()}
function loop(ts){if(!lastTime)lastTime=ts;const dt=ts-lastTime;lastTime=ts;try{update(dt);draw()}catch(e){console.error(e)}animationId=requestAnimationFrame(loop)}
document.getElementById('start-btn').addEventListener('click',startGame);document.getElementById('restart-btn').addEventListener('click',startGame);function bindBtn(id,key){const el=document.getElementById(id);const down=e=>{e.preventDefault();if(key==='jump'){input.jump=true;input.jumpPressed=true}else input[key]=true};const up=e=>{e.preventDefault();input[key]=false};el.addEventListener('pointerdown',down,{passive:false});el.addEventListener('pointerup',up,{passive:false});el.addEventListener('pointerleave',up,{passive:false});el.addEventListener('pointercancel',up,{passive:false})}bindBtn('btn-left','left');bindBtn('btn-right','right');bindBtn('btn-jump','jump');addEventListener('keydown',e=>{if(e.code==='ArrowLeft')input.left=true;if(e.code==='ArrowRight')input.right=true;if(e.code==='Space'||e.code==='ArrowUp'){if(!input.jump)input.jumpPressed=true;input.jump=true}});addEventListener('keyup',e=>{if(e.code==='ArrowLeft')input.left=false;if(e.code==='ArrowRight')input.right=false;if(e.code==='Space'||e.code==='ArrowUp')input.jump=false});requestAnimationFrame(loop);
</script>
</body>
</html>
