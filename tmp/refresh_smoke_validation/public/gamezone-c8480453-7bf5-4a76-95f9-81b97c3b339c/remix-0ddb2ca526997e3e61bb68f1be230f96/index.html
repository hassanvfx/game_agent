<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Dash</title>
    <!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | title=Bangers ui=Exo_2 -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #080b1f;
            --bg-bottom: #120327;
            --panel: rgba(14, 20, 46, 0.76);
            --panel-border: rgba(110, 236, 255, 0.34);
            --panel-shadow: rgba(0, 0, 0, 0.34);
            --hero-primary: #73f7ff;
            --hero-secondary: #b8f8ff;
            --hero-core: #ffffff;
            --hazard-primary: #ff5a87;
            --hazard-secondary: #ff9e5f;
            --hud-accent: #ffe169;
            --text-main: #f4fbff;
            --text-soft: #c5d6f8;
            --grid-line: rgba(77, 115, 219, 0.24);
            --ground-glow: rgba(115, 247, 255, 0.52);
            --button-dark: #0c1230;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(81, 160, 255, 0.18), transparent 34%),
                radial-gradient(circle at 50% 120%, rgba(255, 79, 170, 0.16), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(17, 27, 63, 0.9), rgba(11, 15, 38, 0.84));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 1.1rem 2rem var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .neon-text {
            text-shadow:
                0 0 0.45rem currentColor,
                0 0 1rem currentColor;
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-6 { left: 1.5rem; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .select-none {
            -webkit-user-select: none;
            user-select: none;
        }
        .p-8 { padding: 2rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .text-center { text-align: center; }
        .transition-opacity { transition: opacity 0.3s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .text-6xl { font-size: clamp(2.8rem, 10vw, 4.5rem); line-height: 1; }
        .text-5xl { font-size: clamp(2.25rem, 8vw, 3.5rem); line-height: 1; }
        .text-3xl { font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.1; }
        .text-2xl { font-size: clamp(1.15rem, 3vw, 1.5rem); line-height: 1.2; }
        .text-xl { font-size: clamp(1rem, 2.4vw, 1.25rem); line-height: 1.4; }
        .font-bold { font-weight: 700; }
        .italic { font-style: italic; }
        .tracking-widest { letter-spacing: 0.18em; }
        .tracking-wider { letter-spacing: 0.08em; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-gray-300 { color: var(--text-soft); }
        .text-red-500 { color: #ff7b9e; }
        .text-yellow-400 { color: var(--hud-accent); }
        .bg-white { background: #fff; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .rounded { border-radius: 0.25rem; }
        .hover\:scale-105 { transition: transform 0.2s ease; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 20%),
                repeating-linear-gradient(
                    90deg,
                    transparent 0 5.5vw,
                    rgba(122, 181, 255, 0.04) 5.5vw 5.8vw
                );
            mix-blend-mode: screen;
            opacity: 0.35;
        }

        #game-container::after {
            background:
                radial-gradient(circle at 20% 24%, rgba(115, 247, 255, 0.18), transparent 0.9rem),
                radial-gradient(circle at 80% 16%, rgba(255, 90, 135, 0.2), transparent 1rem),
                radial-gradient(circle at 68% 34%, rgba(255, 225, 105, 0.14), transparent 0.85rem);
            background-repeat: no-repeat;
            opacity: 0.7;
        }

        #start-screen, #game-over-screen {
            width: min(90vw, 32rem);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        #start-screen::before,
        #game-over-screen::before {
            content: "";
            position: absolute;
            inset: auto -10% -35% auto;
            width: 12rem;
            height: 12rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(115, 247, 255, 0.24), transparent 70%);
            pointer-events: none;
        }

        .title-font {
            font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
        }

        .panel-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.88rem;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--hero-primary);
            margin-bottom: 0.75rem;
        }

        .emoji-badge {
            display: inline-grid;
            place-items: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 999px;
            background: rgba(115, 247, 255, 0.14);
            box-shadow: inset 0 0 0 1px rgba(115, 247, 255, 0.28);
            font-size: 1.25rem;
        }

        .character-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin: 0 auto 1rem;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            font-size: 0.96rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .runner-face {
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 0.5rem;
            display: inline-grid;
            place-items: center;
            background: linear-gradient(135deg, var(--hero-primary), #5dc6ff);
            color: #091325;
            font-weight: 700;
            box-shadow: 0 0 1rem rgba(115, 247, 255, 0.28);
        }

        .arcade-button {
            min-width: 10rem;
            padding: 0.85rem 2rem;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--hero-primary), #8d8bff);
            color: #08111f;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
            box-shadow:
                0 0.8rem 1.6rem rgba(75, 105, 255, 0.32),
                inset 0 -0.18rem 0 rgba(0, 0, 0, 0.18);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .arcade-button:hover {
            transform: translateY(-1px) scale(1.03);
            filter: brightness(1.06);
            box-shadow:
                0 1rem 1.8rem rgba(75, 105, 255, 0.36),
                inset 0 -0.18rem 0 rgba(0, 0, 0, 0.18);
        }

        .arcade-button:active,
        .arcade-button.is-pressed {
            transform: translateY(1px) scale(0.98);
            filter: brightness(0.98);
            box-shadow:
                0 0.45rem 1rem rgba(75, 105, 255, 0.26),
                inset 0 0.12rem 0 rgba(0, 0, 0, 0.2);
        }

        #hud {
            padding: 0.35rem 0.8rem 0.45rem;
            border-radius: 999px;
            background: rgba(7, 14, 34, 0.72);
            border: 1px solid rgba(115, 247, 255, 0.24);
            box-shadow:
                0 0.6rem 1.2rem rgba(0, 0, 0, 0.25),
                inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        #hud .text-3xl {
            font-size: clamp(1rem, 3vw, 1.4rem);
            line-height: 1;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-style: normal;
        }

        #score {
            color: var(--hud-accent);
        }

        .hud-label {
            color: var(--hero-primary);
            margin-right: 0.35rem;
        }

        .support-copy {
            margin-top: 0.95rem;
            font-size: 0.9rem;
            color: rgba(244, 251, 255, 0.78);
        }

        @media (max-width: 640px) {
            .p-8 { padding: 1.25rem; }
            #start-screen, #game-over-screen { width: min(92vw, 28rem); }
            .panel-kicker { font-size: 0.75rem; }
            .support-copy { font-size: 0.82rem; }
            .top-4 { top: 0.75rem; }
            .left-6 { left: 0.75rem; }
            .px-8 { padding-left: 1.45rem; padding-right: 1.45rem; }
            .py-3 { padding-top: 0.72rem; padding-bottom: 0.72rem; }
        }
    </style>

<script>
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.soundFallbacks = {
            sfx_start: 'start',
            sfx_jump: 'jump',
            sfx_land: 'land',
            sfx_score: 'score',
            sfx_die: 'die',
            sfx_warning: 'warning'
        };
        this.soundVolumes = {
            sfx_start: 0.34,
            sfx_jump: 0.2,
            sfx_land: 0.14,
            sfx_score: 0.2,
            sfx_die: 0.34,
            sfx_warning: 0.16
        };
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();

            Object.entries(this.soundFallbacks).forEach(([id, fallback]) => {
                this.loadSound(id, fallback);
            });
        }

        const unlock = () => {
            if (!this.ctx || this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
            }).catch(() => {});
            window.removeEventListener('pointerdown', unlock);
            window.removeEventListener('keydown', unlock);
        };

        window.addEventListener('pointerdown', unlock);
        window.addEventListener('keydown', unlock);
    }

    loadSound(id, fallbackType) {
        const el = document.getElementById(id);
        if (!el || !this.ctx) return;
        fetch(el.src)
            .then(r => r.arrayBuffer())
            .then(data => this.ctx.decodeAudioData(data))
            .then(buf => {
                this.buffers[id] = buf;
            })
            .catch(() => {
                this.buffers[id] = fallbackType;
            });
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el || !this.unlocked) return;
        el.volume = 0.2;
        el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, options = {}) {
        if (!this.ctx || !this.unlocked) return;

        const now = performance.now();
        const minInterval = options.minInterval ?? 70;
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < minInterval) return;
        this.lastPlayedAt[id] = now;

        const buf = this.buffers[id];
        if (buf && typeof buf !== 'string') {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = options.volume ?? this.soundVolumes[id] ?? 0.22;
            src.buffer = buf;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(typeof buf === 'string' ? buf : (this.soundFallbacks[id] || 'score'), options.volume);
        }
    }

    synthesize(type, volume = 0.2) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const t = this.ctx.currentTime;
        osc.type = 'square';

        if (type === 'jump') {
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.exponentialRampToValueAtTime(860, t + 0.08);
            gain.gain.setValueAtTime(volume, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        } else if (type === 'land') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, t);
            osc.frequency.exponentialRampToValueAtTime(120, t + 0.07);
            gain.gain.setValueAtTime(volume * 0.9, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.09);
            osc.start(t);
            osc.stop(t + 0.09);
        } else if (type === 'start') {
            osc.frequency.setValueAtTime(420, t);
            osc.frequency.linearRampToValueAtTime(760, t + 0.12);
            gain.gain.setValueAtTime(volume, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
            osc.start(t);
            osc.stop(t + 0.16);
        } else if (type === 'warning') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.linearRampToValueAtTime(240, t + 0.12);
            gain.gain.setValueAtTime(volume * 0.9, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.14);
            osc.start(t);
            osc.stop(t + 0.14);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.exponentialRampToValueAtTime(28, t + 0.28);
            gain.gain.setValueAtTime(volume * 1.2, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
            osc.start(t);
            osc.stop(t + 0.28);
        } else {
            osc.frequency.setValueAtTime(880, t);
            osc.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
            gain.gain.setValueAtTime(volume, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
            osc.start(t);
            osc.stop(t + 0.08);
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    window.gameConfig = {};
    window.gameConfigDefs = {};

    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (const [key, def] of Object.entries(rawConfig)) {
            window.gameConfigDefs[key] = def;
            window.gameConfig[key] = def.value;
        }
    } catch (e) {
        console.error('Config parse error', e);
    }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();
    const pressableButtons = document.querySelectorAll('.arcade-button');

    pressableButtons.forEach((button) => {
        button.addEventListener('pointerdown', () => button.classList.add('is-pressed'));
        ['pointerup', 'pointerleave', 'pointercancel'].forEach((eventName) => {
            button.addEventListener(eventName, () => button.classList.remove('is-pressed'));
        });
    });

    let state = 'START';
    let lastTime = 0;
    let score = 0;
    let speed = 0;
    let distance = 0;

    let hero = { x: 50, y: 0, w: 30, h: 30, vy: 0, grounded: false, rotation: 0 };
    let obstacles = [];
    let particles = [];
    let shake = 0;

    let W = 0, H = 0;
    let groundY = 0;
    let previousGrounded = true;
    let lastWarningDistanceBucket = -1;
    let obstacleSpawnCooldown = 0;
    const gifFeedback = document.getElementById('gif-feedback');
    const gifFeedbackImage = document.getElementById('gif-feedback-image');
    const feedbackGifs = {
        jump: 'https://i.giphy.com/3o6YgaiHLlJ9020xUc.webp',
        crash: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp'
    };
    let gifTimer = null;

    function showGifFeedback(type, duration = 850) {
        const src = feedbackGifs[type];
        if (!gifFeedback || !gifFeedbackImage || !src) return;
        gifFeedbackImage.src = src;
        gifFeedback.classList.remove('hidden');
        clearTimeout(gifTimer);
        gifTimer = setTimeout(() => {
            gifFeedback.classList.add('hidden');
        }, duration);
    }

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;

        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        groundY = H * 0.75;
        if (state === 'START') hero.y = groundY - hero.h;
    }
    window.addEventListener('resize', resize);
    resize();

    function jump() {
        if (state !== 'PLAY') return;
        if (hero.grounded) {
            hero.vy = -window.gameConfig.jumpForce;
            hero.grounded = false;
            audio.playSfx('sfx_jump', { minInterval: 120 });
            showGifFeedback('jump', 520);
            for (let i = 0; i < 5; i++) {
                spawnParticle(hero.x + hero.w / 2, hero.y + hero.h, '#ffffff', 2);
            }
        }
    }

    const inputHandler = (e) => {
        e.preventDefault();
        if (state === 'START' || state === 'GAMEOVER') return;
        jump();
        audio.init();
    };

    canvas.addEventListener('pointerdown', inputHandler, { passive: false });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            if (state === 'PLAY') jump();
        }
    });

    function spawnParticle(x, y, color, speedMulti = 1) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 200 * speedMulti,
            vy: (Math.random() - 0.5) * 200 * speedMulti,
            life: 1.0,
            color
        });
    }

    function spawnObstacle(dt) {
        if (obstacleSpawnCooldown > 0) {
            obstacleSpawnCooldown = Math.max(0, obstacleSpawnCooldown - dt);
            return;
        }

        const minGap = (window.gameConfig.baseSpeed * 1.5);
        const lastObs = obstacles[obstacles.length - 1];

        if (!lastObs || (W - (lastObs.x + lastObs.w)) > minGap + Math.random() * 200) {
            if (Math.random() < 0.02) {
                const type = Math.random() > 0.5 ? 'SPIKE' : 'BLOCK';
                obstacles.push({
                    x: W + 50,
                    y: groundY - (type === 'BLOCK' ? 40 : 30),
                    w: 30,
                    h: type === 'BLOCK' ? 40 : 30,
                    type: type,
                    passed: false
                });
            }
        }
    }

    function resetGame() {
        state = 'PLAY';
        score = 0;
        distance = 0;
        speed = window.gameConfig.baseSpeed;
        hero.y = groundY - hero.h;
        hero.vy = 0;
        hero.rotation = 0;
        hero.grounded = true;
        previousGrounded = true;
        lastWarningDistanceBucket = -1;
        obstacleSpawnCooldown = 1.05;
        obstacles = [];
        particles = [];
        shake = 0;
        gifFeedback.classList.add('hidden');

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('score').innerText = '0';

        audio.playSfx('sfx_start', { minInterval: 160, volume: 0.28 });
        audio.playBgm();
    }

    function gameOver() {
        state = 'GAMEOVER';
        shake = 20;
        audio.playSfx('sfx_die', { minInterval: 200, volume: 0.32 });
        audio.stopBgm();
        showGifFeedback('crash', 1500);
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = Math.floor(distance);

        for (let i = 0; i < 30; i++) {
            spawnParticle(hero.x + hero.w / 2, hero.y + hero.h / 2, window.gameConfig.heroColor, 3);
        }
    }

    function update(dt) {
        if (state !== 'PLAY') return;

        speed += dt * 5;
        distance += speed * dt * 0.01;
        document.getElementById('score').innerText = Math.floor(distance);

        hero.vy += window.gameConfig.gravity * dt;
        hero.y += hero.vy * dt;

        if (hero.y + hero.h >= groundY) {
            hero.y = groundY - hero.h;
            hero.vy = 0;
            hero.grounded = true;
            hero.rotation = 0;
        } else {
            hero.rotation += dt * 5;
            hero.grounded = false;
        }

        if (hero.grounded && !previousGrounded) {
            audio.playSfx('sfx_land', { minInterval: 120, volume: 0.12 });
        }
        previousGrounded = hero.grounded;

        spawnObstacle(dt);
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let ob = obstacles[i];
            ob.x -= speed * dt;

            const hitboxPadding = 5;
            if (
                hero.x + hitboxPadding < ob.x + ob.w - hitboxPadding &&
                hero.x + hero.w - hitboxPadding > ob.x + hitboxPadding &&
                hero.y + hitboxPadding < ob.y + ob.h - hitboxPadding &&
                hero.y + hero.h - hitboxPadding > ob.y + hitboxPadding
            ) {
                gameOver();
            }

            if (!ob.passed && ob.x + ob.w < hero.x - 24) {
                ob.passed = true;
                audio.playSfx('sfx_score', { minInterval: 90, volume: 0.18 });
            }

            if (ob.x - (hero.x + hero.w) < 115 && ob.x > hero.x && lastWarningDistanceBucket !== Math.floor(distance / 10)) {
                lastWarningDistanceBucket = Math.floor(distance / 10);
                audio.playSfx('sfx_warning', { minInterval: 280, volume: 0.1 });
            }

            if (ob.x + ob.w < 0) {
                obstacles.splice(i, 1);
                score += 10;
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }

        if (shake > 0) shake = Math.max(0, shake - dt * 60);
    }

    function drawSkyline() {
        const skylineBase = groundY - 58;
        const buildingWidth = 26;
        const gap = 18;
        for (let x = -((distance * 18) % (buildingWidth + gap)); x < W + buildingWidth; x += buildingWidth + gap) {
            const h = 18 + ((Math.floor((x + distance) / 7) % 4 + 4) % 4) * 10;
            ctx.fillStyle = 'rgba(24, 33, 72, 0.9)';
            ctx.fillRect(x, skylineBase - h, buildingWidth, h);
            ctx.fillStyle = 'rgba(115, 247, 255, 0.2)';
            ctx.fillRect(x + 5, skylineBase - h + 6, 4, 4);
            ctx.fillRect(x + 13, skylineBase - h + 14, 4, 4);
        }
    }

    function drawObstacle(ob) {
        const glow = ctx.createLinearGradient(ob.x, ob.y, ob.x + ob.w, ob.y + ob.h);
        glow.addColorStop(0, window.gameConfig.obstacleColor);
        glow.addColorStop(1, '#ffb15f');
        ctx.fillStyle = glow;
        ctx.shadowBlur = 18;
        ctx.shadowColor = window.gameConfig.obstacleColor;

        if (ob.type === 'SPIKE') {
            ctx.beginPath();
            ctx.moveTo(ob.x, ob.y + ob.h);
            ctx.lineTo(ob.x + ob.w / 2, ob.y - 4);
            ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.beginPath();
            ctx.moveTo(ob.x + ob.w * 0.48, ob.y + 4);
            ctx.lineTo(ob.x + ob.w * 0.66, ob.y + ob.h * 0.72);
            ctx.lineTo(ob.x + ob.w * 0.4, ob.y + ob.h * 0.72);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 5);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
            ctx.fillRect(ob.x + 4, ob.y + 4, ob.w - 8, 5);
        }
        ctx.shadowBlur = 0;
    }

    function drawHero() {
        if (state === 'GAMEOVER') return;

        const halfW = hero.w / 2;
        const halfH = hero.h / 2;
        const pulse = 0.92 + Math.sin(distance * 0.18) * 0.08;

        ctx.save();
        ctx.translate(hero.x + halfW, hero.y + halfH);
        ctx.rotate(hero.rotation);

        ctx.shadowBlur = 22;
        ctx.shadowColor = window.gameConfig.heroColor;

        ctx.fillStyle = window.gameConfig.heroColor;
        ctx.beginPath();
        ctx.roundRect(-halfW, -halfH, hero.w, hero.h, 9);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.beginPath();
        ctx.roundRect(-halfW + 4, -halfH + 4, hero.w - 8, hero.h * 0.28, 5);
        ctx.fill();

        ctx.fillStyle = '#08111f';
        ctx.beginPath();
        ctx.arc(-7, -3, 2.5, 0, Math.PI * 2);
        ctx.arc(7, -3, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#08111f';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-8, 7);
        ctx.quadraticCurveTo(0, 11 + pulse, 8, 7);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(0, 0, 5.4 * pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.fillStyle = '#070a17';
        ctx.fillRect(0, 0, W, H);

        const skyGlow = ctx.createLinearGradient(0, 0, 0, groundY);
        skyGlow.addColorStop(0, '#12234f');
        skyGlow.addColorStop(1, '#120327');
        ctx.fillStyle = skyGlow;
        ctx.fillRect(0, 0, W, groundY);

        drawSkyline();

        let sx = (Math.random() - 0.5) * shake;
        let sy = (Math.random() - 0.5) * shake;
        ctx.save();
        ctx.translate(sx, sy);

        ctx.strokeStyle = 'rgba(62, 100, 195, 0.26)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let offset = (distance * 50) % 100;
        for (let x = -offset; x < W; x += 100) {
            ctx.moveTo(x + (x - W / 2) * 2, H);
            ctx.lineTo(x, groundY);
        }
        for (let y = groundY; y < H; y += 40) {
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
        }
        ctx.stroke();

        const groundGradient = ctx.createLinearGradient(0, groundY - 2, 0, groundY + 10);
        groundGradient.addColorStop(0, window.gameConfig.heroColor);
        groundGradient.addColorStop(1, '#886dff');
        ctx.strokeStyle = groundGradient;
        ctx.shadowBlur = 22;
        ctx.shadowColor = 'rgba(115, 247, 255, 0.6)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(W, groundY);
        ctx.stroke();
        ctx.shadowBlur = 0;

        obstacles.forEach(drawObstacle);
        drawHero();

        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, 4, 4, 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error('Game Loop Error:', e);
        }

        requestAnimationFrame(loop);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
        audio.init();
        resetGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.init();
        resetGame();
    });

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
