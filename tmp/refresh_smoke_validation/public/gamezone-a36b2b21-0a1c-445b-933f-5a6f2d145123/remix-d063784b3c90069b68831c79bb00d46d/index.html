<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Star Forge Grid</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --panel-bg: rgba(7, 15, 34, 0.74);
            --panel-border: rgba(138, 207, 255, 0.26);
            --panel-edge: rgba(255, 255, 255, 0.08);
            --text-main: #f5fbff;
            --text-soft: rgba(206, 233, 255, 0.84);
            --accent-a: #78e6ff;
            --accent-b: #8b8cff;
            --accent-c: #ff8fe1;
            --accent-hot: #ffe27a;
            --void-bg: #030712;
            --grid-line: rgba(133, 183, 255, 0.12);
            --forge-glow: rgba(120, 230, 255, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(120, 230, 255, 0.16), transparent 36%),
                linear-gradient(180deg, #07101f 0%, var(--void-bg) 55%, #02050d 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 50% 18%, rgba(139, 140, 255, 0.22), transparent 26%),
                radial-gradient(circle at 20% 80%, rgba(255, 143, 225, 0.1), transparent 24%);
        }

        .screen-wrap::before,
        .screen-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .screen-wrap::before {
            background:
                linear-gradient(90deg, transparent 0, rgba(120, 230, 255, 0.08) 50%, transparent 100%),
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 100% 100%, 100% 56px, 56px 100%;
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        .screen-wrap::after {
            background:
                radial-gradient(circle at 15% 22%, rgba(255, 255, 255, 0.38) 0 2px, transparent 3px),
                radial-gradient(circle at 78% 30%, rgba(120, 230, 255, 0.45) 0 2px, transparent 3px),
                radial-gradient(circle at 28% 72%, rgba(255, 143, 225, 0.35) 0 1.5px, transparent 3px),
                radial-gradient(circle at 66% 84%, rgba(255, 226, 122, 0.3) 0 2px, transparent 3px);
            animation: driftStars 14s linear infinite;
            opacity: 0.75;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .center-card {
            width: min(100% - 32px, 460px);
            margin: 0 16px;
            padding: 40px 32px;
            border-radius: 22px;
            text-align: center;
            pointer-events: auto;
            transform: translateZ(0);
            transition: transform 0.45s ease, box-shadow 0.45s ease;
        }

        .center-card:hover {
            transform: scale(1.03);
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(12, 28, 58, 0.86), rgba(8, 14, 28, 0.78)),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                inset 0 0 0 1px var(--panel-edge),
                0 18px 42px rgba(0, 0, 0, 0.42),
                0 0 22px rgba(120, 230, 255, 0.12);
        }

        .title-font {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .hero-title {
            margin: 0 0 14px;
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 0.95;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(90deg, var(--accent-a), var(--accent-hot) 35%, var(--accent-b) 68%, var(--accent-c));
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 18px rgba(120, 230, 255, 0.42));
            text-shadow: 0 0 22px rgba(139, 140, 255, 0.3);
        }

        .subtitle {
            margin: 0 0 14px;
            color: var(--text-soft);
            font-size: 0.98rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .instructions {
            margin: 0 0 28px;
            color: rgba(245, 251, 255, 0.9);
            font-size: 1.05rem;
            line-height: 1.45;
        }

        .character-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(120, 230, 255, 0.24);
            background: rgba(7, 15, 34, 0.55);
            color: rgba(245, 251, 255, 0.92);
            font-size: 0.92rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(120, 230, 255, 0.12);
        }

        .character-badge-emoji {
            font-size: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(120, 230, 255, 0.5));
        }

        @keyframes shimmer {
            0% { background-position: -100% 0; }
            100% { background-position: 100% 0; }
        }

        @keyframes driftStars {
            0% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(-12px, 10px, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        .btn,
        .btn-shine {
            appearance: none;
            border: 0;
            cursor: pointer;
            border-radius: 14px;
            color: #fff;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            padding: 16px 28px;
            transition: transform 0.15s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        .btn:active,
        .btn-shine:active {
            transform: scale(0.96);
        }

        .btn-shine {
            background: linear-gradient(90deg, #1772ff 0%, #67d8ff 42%, #a56cff 74%, #ff8fe1 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
            box-shadow: 0 0 26px rgba(23, 114, 255, 0.38);
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(120, 230, 255, 0.22);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
        }

        .btn:hover,
        .btn-shine:hover {
            box-shadow: 0 0 28px rgba(129, 140, 248, 0.35);
        }

        .hidden {
            display: none !important;
        }

        .feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 20vw, 150px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(120, 230, 255, 0.28);
            background: rgba(5, 12, 24, 0.72);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .feedback-gif.visible {
            opacity: 0.94;
            transform: scale(1);
        }

        .feedback-gif.combo-gif {
            top: 86px;
            right: 12px;
        }

        .feedback-gif.fail-gif {
            bottom: 18px;
            left: 12px;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: none;
        }

        .hud-pill {
            min-width: 122px;
            padding: 10px 22px;
            border-radius: 999px;
            text-align: center;
            background:
                linear-gradient(180deg, rgba(11, 22, 44, 0.92), rgba(10, 17, 31, 0.78)),
                var(--panel-bg);
        }

        .hud-label {
            display: block;
            color: var(--text-soft);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .hud-value {
            margin-top: 4px;
            font-size: 1.85rem;
            font-weight: 400;
            line-height: 1;
            text-shadow: 0 0 12px rgba(120, 230, 255, 0.34);
        }

        .results-label {
            margin: 0 0 10px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .results-value {
            margin: 0 0 28px;
            font-size: clamp(3.2rem, 10vw, 5rem);
            line-height: 1;
            font-weight: 700;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
        }

        @media (max-width: 640px) {
            .center-card {
                padding: 32px 22px;
            }

            .subtitle {
                letter-spacing: 0.18em;
                font-size: 0.92rem;
            }

            .instructions {
                font-size: 0.98rem;
            }

            .hud {
                padding: 12px;
            }

            .hud-pill {
                min-width: 106px;
                padding: 8px 16px;
            }

            .hud-value {
                font-size: 1.45rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-wrap">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div class="feedback-layer" aria-hidden="true">
                <img id="combo-gif" class="feedback-gif combo-gif" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" alt="">
                <img id="fail-gif" class="feedback-gif fail-gif" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="">
            </div>

            <div id="start-screen" class="glass-panel center-card">
                <div class="character-badge"><span class="character-badge-emoji" aria-hidden="true">🤖</span> Forge Core Online</div>
                <h1 class="hero-title title-font">Star Forge Grid</h1>
                <p class="subtitle title-font">Match 3 • Align • Energize</p>
                <p class="instructions">Guide the cheerful forge core through a lattice of radiant crystals. Tap one crystal, then a neighboring crystal, to reroute the grid and build charged constellations.</p>
                <button id="start-btn" class="btn-shine">Begin Shift</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel center-card">
                <h2 class="hero-title title-font" style="font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 10px;">Grid Offline</h2>
                <div class="results-label">Energy Stored</div>
                <div class="results-value title-font" id="finalScore">0</div>
                <button id="restart-btn" class="btn">Restart Shift</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="glass-panel hud-pill">
                    <span class="hud-label">Energy</span>
                    <div id="score" class="hud-value title-font">0</div>
                </div>
                <div class="glass-panel hud-pill">
                    <span class="hud-label">Chain</span>
                    <div id="combo" class="hud-value title-font">x1</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & CONFIG */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                select: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                swap: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                match: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"
            },
            gifs: {
                combo: "https://i.giphy.com/ye080RbECtcCnkrSyD.webp",
                fail: "https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
            }
        };

        const GRID_ROWS = 8;
        const GRID_COLS = 8;
        const ANIMATION_SPEED = 0.2; // 0-1 lerp factor

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.bgmStarted = false;
                this.sfx = {};
                this.lastPlayedAt = new Map();
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    audio.volume = {
                        select: 0.34,
                        swap: 0.46,
                        match: 0.54,
                        fail: 0.38,
                        streak: 0.42,
                        start: 0.5
                    }[k] ?? 0.4;
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                if (this.bgmStarted) return;
                this.bgmStarted = true;
                this.playBGM();
            }

            playBGM() {
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
                this.bgmStarted = false;
            }

            playSFX(key, debounceMs = 80) {
                const source = this.sfx[key];
                if (!source) return;
                const now = performance.now();
                if (now - (this.lastPlayedAt.get(key) ?? -Infinity) < debounceMs) return;
                this.lastPlayedAt.set(key, now);
                try {
                    source.currentTime = 0;
                    source.play().catch(() => {});
                } catch {
                    const clone = source.cloneNode();
                    clone.volume = source.volume;
                    clone.play().catch(() => {});
                }
            }
        }

        const audio = new AudioController();

        /** 3. GRAPHICS & PARTICLES */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let boardOffset = { x: 0, y: 0 };
        let cellSize = 0;

        // Crystal channels used by the star forge grid
        const GEM_TYPES = [
            { name: 'Diamond', color: '#c8f3ff', dark: '#165fc6', aura: '#67d8ff', shape: 'circle', glyph: '✦' },
            { name: 'Ruby', color: '#ff667a', dark: '#7a1028', aura: '#ff8fa2', shape: 'square', glyph: '✹' },
            { name: 'Emerald', color: '#6effb0', dark: '#0d764d', aura: '#8affcf', shape: 'hex', glyph: '⬢' },
            { name: 'Sapphire', color: '#74a5ff', dark: '#1a2d8f', aura: '#94baff', shape: 'triangle', glyph: '▲' },
            { name: 'Topaz', color: '#ffd27a', dark: '#9d6208', aura: '#ffe27a', shape: 'kite', glyph: '◆' },
            { name: 'Amethyst', color: '#d4a7ff', dark: '#5c1f88', aura: '#eea8ff', shape: 'oval', glyph: '◉' }
        ];

        const FORGE_CORE = {
            emoji: '🤖',
            glow: '#78e6ff',
            pulse: 0
        };

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.decay = 0.03 + Math.random() * 0.02;
                this.size = Math.random() * 5 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }
        let particles = [];

        /** 4. GAME LOGIC */
        let grid = [];
        let state = 'IDLE'; // IDLE, SELECTED, SWAP, REVERT, MATCH, FILL
        let selectedGem = null;
        let swapTarget = null;
        let score = 0;
        let comboMultiplier = 1;
        let gameActive = false;
        let comboGifTimeout = null;
        let failGifTimeout = null;

        class Gem {
            constructor(r, c, type) {
                this.r = r;
                this.c = c;
                this.type = type;
                this.x = c * cellSize;
                this.y = r * cellSize;
                this.targetX = this.x;
                this.targetY = this.y;
                this.scale = 1;
                this.rotation = 0;
                this.alpha = 1;
                this.toDelete = false;
            }

            update() {
                this.x += (this.targetX - this.x) * ANIMATION_SPEED;
                this.y += (this.targetY - this.y) * ANIMATION_SPEED;

                if (Math.abs(this.x - this.targetX) < 1) this.x = this.targetX;
                if (Math.abs(this.y - this.targetY) < 1) this.y = this.targetY;

                if (selectedGem && selectedGem.r === this.r && selectedGem.c === this.c) {
                    this.rotation += 0.05;
                } else if (this.rotation > 0) {
                    this.rotation *= 0.8;
                    if (this.rotation < 0.01) this.rotation = 0;
                }
            }

            draw(ctx, xOff, yOff) {
                if (this.alpha <= 0) return;

                const cx = xOff + this.x + cellSize / 2;
                const cy = yOff + this.y + cellSize / 2;
                const size = (cellSize * 0.85) * this.scale;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.alpha;

                const gType = GEM_TYPES[this.type];

                ctx.shadowColor = gType.aura;
                ctx.shadowBlur = selectedGem && selectedGem.r === this.r && selectedGem.c === this.c ? 28 : 18;

                ctx.beginPath();
                this.drawShape(ctx, gType.shape, size);

                const grad = ctx.createRadialGradient(0, 0, size * 0.2, 0, 0, size);
                grad.addColorStop(0, gType.color);
                grad.addColorStop(1, gType.dark);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(-size * 0.3, -size * 0.3, size * 0.15, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.78)';
                ctx.font = `${Math.max(12, size * 0.32)}px "Orbitron", system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(gType.glyph, 0, 1);

                ctx.restore();
            }

            drawShape(ctx, shape, s) {
                const hs = s / 2;
                if (shape === 'circle') {
                    ctx.arc(0, 0, hs, 0, Math.PI * 2);
                } else if (shape === 'square') {
                    ctx.rect(-hs, -hs, s, s);
                } else if (shape === 'hex') {
                    for (let i = 0; i < 6; i++) {
                        const angle = i * Math.PI / 3;
                        const px = Math.cos(angle) * hs;
                        const py = Math.sin(angle) * hs;
                        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                } else if (shape === 'triangle') {
                    ctx.moveTo(0, -hs);
                    ctx.lineTo(hs, hs);
                    ctx.lineTo(-hs, hs);
                    ctx.closePath();
                } else if (shape === 'kite') {
                    ctx.moveTo(0, -hs);
                    ctx.lineTo(hs, 0);
                    ctx.lineTo(0, hs);
                    ctx.lineTo(-hs, 0);
                    ctx.closePath();
                } else if (shape === 'oval') {
                    ctx.ellipse(0, 0, hs, hs * 0.7, 0, 0, Math.PI * 2);
                }
            }
        }

        function initGrid() {
            grid = [];
            for (let r = 0; r < GRID_ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < GRID_COLS; c++) {
                    let type;
                    do {
                        type = Math.floor(Math.random() * GEM_TYPES.length);
                    } while (
                        (r >= 2 && grid[r - 1][c].type === type && grid[r - 2][c].type === type) ||
                        (c >= 2 && grid[r][c - 1].type === type && grid[r][c - 2].type === type)
                    );
                    grid[r][c] = new Gem(r, c, type);
                }
            }
            state = 'IDLE';
            selectedGem = null;
            score = 0;
            updateHUD();
        }

        function getGemAtInput(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const mx = clientX - rect.left - boardOffset.x;
            const my = clientY - rect.top - boardOffset.y;

            const c = Math.floor(mx / cellSize);
            const r = Math.floor(my / cellSize);

            if (r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS) {
                return { r, c };
            }
            return null;
        }

        const comboGif = document.getElementById('combo-gif');
        const failGif = document.getElementById('fail-gif');

        function showGif(element, timeoutRefName, duration = 900) {
            if (!element) return;
            if (timeoutRefName === 'comboGifTimeout' && comboGifTimeout) clearTimeout(comboGifTimeout);
            if (timeoutRefName === 'failGifTimeout' && failGifTimeout) clearTimeout(failGifTimeout);
            element.classList.add('visible');
            const timeoutId = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
            if (timeoutRefName === 'comboGifTimeout') comboGifTimeout = timeoutId;
            if (timeoutRefName === 'failGifTimeout') failGifTimeout = timeoutId;
        }

        function flashInvalidMove() {
            showGif(failGif, 'failGifTimeout', 820);
            audio.playSFX('fail', 120);
        }

        function handleInput(e) {
            if (!gameActive || (state !== 'IDLE' && state !== 'SELECTED')) return;

            const pos = e.type.includes('touch')
                ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY }
                : { x: e.clientX, y: e.clientY };

            const target = getGemAtInput(pos.x, pos.y);
            if (!target) return;

            if (!selectedGem) {
                selectedGem = target;
                state = 'SELECTED';
                audio.playSFX('select');
                return;
            }

            if (selectedGem.r === target.r && selectedGem.c === target.c) {
                selectedGem = null;
                state = 'IDLE';
                return;
            }

            const dr = Math.abs(selectedGem.r - target.r);
            const dc = Math.abs(selectedGem.c - target.c);

            if (dr + dc === 1) {
                swapTarget = target;
                startSwap(selectedGem, swapTarget);
            } else {
                selectedGem = target;
                audio.playSFX('select');
                flashInvalidMove();
            }
        }

        function startSwap(p1, p2) {
            state = 'SWAP';
            audio.playSFX('swap', 50);

            const gem1 = grid[p1.r][p1.c];
            const gem2 = grid[p2.r][p2.c];

            grid[p1.r][p1.c] = gem2;
            grid[p2.r][p2.c] = gem1;

            gem2.r = p1.r; gem2.c = p1.c;
            gem1.r = p2.r; gem1.c = p2.c;

            gem1.targetX = gem1.c * cellSize;
            gem1.targetY = gem1.r * cellSize;
            gem2.targetX = gem2.c * cellSize;
            gem2.targetY = gem2.r * cellSize;

            selectedGem = null;

            setTimeout(() => {
                const matches = findMatches();
                if (matches.length > 0) {
                    processMatches(matches);
                } else {
                    state = 'REVERT';
                    const temp = grid[p1.r][p1.c];
                    grid[p1.r][p1.c] = grid[p2.r][p2.c];
                    grid[p2.r][p2.c] = temp;

                    grid[p1.r][p1.c].r = p1.r; grid[p1.r][p1.c].c = p1.c;
                    grid[p2.r][p2.c].r = p2.r; grid[p2.r][p2.c].c = p2.c;

                    grid[p1.r][p1.c].targetX = grid[p1.r][p1.c].c * cellSize;
                    grid[p1.r][p1.c].targetY = grid[p1.r][p1.c].r * cellSize;
                    grid[p2.r][p2.c].targetX = grid[p2.r][p2.c].c * cellSize;
                    grid[p2.r][p2.c].targetY = grid[p2.r][p2.c].r * cellSize;

                    setTimeout(() => {
                        state = 'IDLE';
                        flashInvalidMove();
                    }, 300);
                }
            }, 300);
        }

        function findMatches() {
            let matched = new Set();

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS - 2; c++) {
                    const type = grid[r][c].type;
                    if (grid[r][c + 1].type === type && grid[r][c + 2].type === type) {
                        matched.add(grid[r][c]);
                        matched.add(grid[r][c + 1]);
                        matched.add(grid[r][c + 2]);
                    }
                }
            }

            for (let c = 0; c < GRID_COLS; c++) {
                for (let r = 0; r < GRID_ROWS - 2; r++) {
                    const type = grid[r][c].type;
                    if (grid[r + 1][c].type === type && grid[r + 2][c].type === type) {
                        matched.add(grid[r][c]);
                        matched.add(grid[r + 1][c]);
                        matched.add(grid[r + 2][c]);
                    }
                }
            }

            return Array.from(matched);
        }

        function processMatches(matches) {
            state = 'MATCH';
            audio.playSFX('match', 90);

            const points = matches.length * 100 * comboMultiplier;
            score += points;
            comboMultiplier++;
            if (matches.length >= 4 || comboMultiplier > 2) {
                showGif(comboGif, 'comboGifTimeout', 980);
                audio.playSFX('streak', 140);
            }
            updateHUD();

            matches.forEach(gem => {
                gem.toDelete = true;
                for (let i = 0; i < 8; i++) {
                    particles.push(new Particle(
                        boardOffset.x + gem.x + cellSize / 2,
                        boardOffset.y + gem.y + cellSize / 2,
                        GEM_TYPES[gem.type].color
                    ));
                }
            });

            setTimeout(() => {
                refillBoard();
            }, 400);
        }

        function refillBoard() {
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (grid[r][c].toDelete) {
                        grid[r][c] = null;
                    }
                }
            }

            for (let c = 0; c < GRID_COLS; c++) {
                let emptySlots = 0;
                for (let r = GRID_ROWS - 1; r >= 0; r--) {
                    if (grid[r][c] === null) {
                        emptySlots++;
                    } else if (emptySlots > 0) {
                        grid[r + emptySlots][c] = grid[r][c];
                        grid[r + emptySlots][c].r += emptySlots;
                        grid[r + emptySlots][c].targetY = grid[r + emptySlots][c].r * cellSize;
                        grid[r][c] = null;
                    }
                }

                for (let r = 0; r < emptySlots; r++) {
                    const type = Math.floor(Math.random() * GEM_TYPES.length);
                    const gem = new Gem(r, c, type);
                    gem.y = -cellSize * (emptySlots - r);
                    gem.targetY = r * cellSize;
                    grid[r][c] = gem;
                }
            }

            state = 'FILL';

            setTimeout(() => {
                const newMatches = findMatches();
                if (newMatches.length > 0) {
                    processMatches(newMatches);
                } else {
                    state = 'IDLE';
                    comboMultiplier = 1;
                    updateHUD();
                }
            }, 500);
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            document.getElementById('combo').innerText = 'x' + comboMultiplier;
            const finalScore = document.getElementById('finalScore');
            if (finalScore) finalScore.innerText = score;
        }

        /** 5. RENDER LOOP */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            const minDim = Math.min(width, height);
            cellSize = (minDim * 0.9) / GRID_ROWS;

            boardOffset.x = (width - (cellSize * GRID_COLS)) / 2;
            boardOffset.y = (height - (cellSize * GRID_ROWS)) / 2;

            if (grid.length > 0) {
                grid.forEach(row => row.forEach(gem => {
                    if (gem) {
                        gem.x = gem.c * cellSize;
                        gem.y = gem.r * cellSize;
                        gem.targetX = gem.x;
                        gem.targetY = gem.y;
                    }
                }));
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            const grad = ctx.createRadialGradient(width / 2, height / 2, height / 6, width / 2, height / 2, height);
            grad.addColorStop(0, '#16254d');
            grad.addColorStop(0.52, '#071224');
            grad.addColorStop(1, '#02050d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const nebula = ctx.createRadialGradient(width * 0.2, height * 0.26, 20, width * 0.2, height * 0.26, width * 0.35);
            nebula.addColorStop(0, 'rgba(120, 230, 255, 0.18)');
            nebula.addColorStop(1, 'rgba(120, 230, 255, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, width, height);

            const pulse = Date.now() * 0.0012;
            for (let i = 0; i < 44; i++) {
                const x = (Date.now() * 0.01 + i * 137) % width;
                const y = (i * 173) % height;
                const radius = 1.2 + ((i % 5) * 0.3);
                ctx.globalAlpha = 0.2 + Math.sin(pulse + i) * 0.18;
                ctx.fillStyle = i % 3 === 0 ? '#78e6ff' : i % 3 === 1 ? '#ffffff' : '#ff8fe1';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            FORGE_CORE.pulse += 0.04;
            const coreX = width * 0.12;
            const coreY = height * 0.16;
            const bob = Math.sin(FORGE_CORE.pulse) * 5;
            ctx.globalAlpha = 1;
            ctx.shadowColor = FORGE_CORE.glow;
            ctx.shadowBlur = 28;
            ctx.fillStyle = 'rgba(120, 230, 255, 0.18)';
            ctx.beginPath();
            ctx.arc(coreX, coreY + bob, 38, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.font = `${Math.max(28, Math.min(width, height) * 0.048)}px system-ui`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(FORGE_CORE.emoji, coreX, coreY + bob);

            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawBackground();

            const boardGrad = ctx.createLinearGradient(boardOffset.x, boardOffset.y, boardOffset.x, boardOffset.y + (cellSize * GRID_ROWS));
            boardGrad.addColorStop(0, 'rgba(9, 20, 44, 0.76)');
            boardGrad.addColorStop(1, 'rgba(5, 10, 24, 0.82)');
            ctx.fillStyle = boardGrad;
            ctx.fillRect(boardOffset.x - 10, boardOffset.y - 10, (cellSize * GRID_COLS) + 20, (cellSize * GRID_ROWS) + 20);

            ctx.strokeStyle = 'rgba(120, 230, 255, 0.22)';
            ctx.lineWidth = 2;
            ctx.strokeRect(boardOffset.x - 10, boardOffset.y - 10, (cellSize * GRID_COLS) + 20, (cellSize * GRID_ROWS) + 20);

            for (let line = 0; line <= GRID_ROWS; line++) {
                const y = boardOffset.y + line * cellSize;
                ctx.strokeStyle = 'rgba(120, 230, 255, 0.08)';
                ctx.beginPath();
                ctx.moveTo(boardOffset.x, y);
                ctx.lineTo(boardOffset.x + cellSize * GRID_COLS, y);
                ctx.stroke();
            }

            for (let line = 0; line <= GRID_COLS; line++) {
                const x = boardOffset.x + line * cellSize;
                ctx.beginPath();
                ctx.moveTo(x, boardOffset.y);
                ctx.lineTo(x, boardOffset.y + cellSize * GRID_ROWS);
                ctx.stroke();
            }

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const gem = grid[r][c];
                    if (gem) {
                        if (gem.toDelete) {
                            gem.scale -= 0.1;
                            if (gem.scale < 0) gem.scale = 0;
                        }
                        gem.update();
                        gem.draw(ctx, boardOffset.x, boardOffset.y);
                    }
                }
            }

            if (selectedGem) {
                const x = boardOffset.x + selectedGem.c * cellSize;
                const y = boardOffset.y + selectedGem.r * cellSize;
                ctx.strokeStyle = 'rgba(255, 226, 122, 0.92)';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ffe27a';
                ctx.shadowBlur = 16;
                ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
                ctx.shadowBlur = 0;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        /** 6. CONTROLS */
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            resize();
            initGrid();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.unlock();
            audio.playSFX('start', 0);
            gameActive = true;
            initGrid();
            gameLoop();
        });
    });
    </script>
