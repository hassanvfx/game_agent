<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Signal Sweep: Lost Echoes</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #09111f;
    --bg-bottom: #02050b;
    --panel: rgba(10, 20, 35, 0.62);
    --panel-border: rgba(103, 220, 255, 0.32);
    --panel-glow: rgba(74, 190, 255, 0.22);
    --text-main: #ecf8ff;
    --text-soft: #b8eaff;
    --accent: #5cf2ff;
    --accent-strong: #7b8cff;
    --danger: #ff4d7e;
    --danger-deep: #7d1433;
    --hero-core: #8cf7ff;
    --hero-shell: #57bfff;
    --zone-fill: rgba(24, 138, 194, 0.08);
    --zone-stroke: rgba(134, 233, 255, 0.34);
  }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 15%, #112742 0%, #040814 60%, #010204 100%); font-family: 'Exo 2', system-ui, sans-serif; color: var(--text-main); }
  #game-container { width: 100%; height: 100%; position: relative; user-select: none; overflow: hidden; background:
    radial-gradient(circle at 18% 12%, rgba(92,242,255,0.14), transparent 36%),
    radial-gradient(circle at 78% 78%, rgba(123,140,255,0.20), transparent 42%),
    linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  }
  #game-container::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), transparent 18%, transparent 82%, rgba(255,255,255,0.03)),
      repeating-linear-gradient(90deg, rgba(92,242,255,0.04) 0 1px, transparent 1px 54px);
    mix-blend-mode: screen;
  }
  #game-container::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
    background-image: radial-gradient(rgba(255,255,255,.22) 0.6px, transparent 0.6px);
    background-size: 3px 3px; mix-blend-mode: soft-light;
  }
  canvas { display: block; touch-action: none; width: 100%; height: 100%; }
  #ui-layer { pointer-events: none; }
  #game-over-screen,
  #game-over-panel,
  #restart-btn { pointer-events: auto; }
  .glass { background: linear-gradient(180deg, rgba(10,20,35,0.8), rgba(7,13,24,0.64)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--panel-border); box-shadow: 0 0 24px var(--panel-glow), inset 0 0 0 1px rgba(255,255,255,0.04); }
  .screen-shake { animation: shake 300ms linear 1; }
  @keyframes shake {
    0% { transform: translate(0,0); } 20% { transform: translate(-6px,2px); } 40% { transform: translate(6px,-2px); }
    60% { transform: translate(-4px,-2px);} 80% { transform: translate(4px,2px);} 100% { transform: translate(0,0);}
  }
  .flash {
    position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#d9fbff 0%,#5cf2ff 35%,transparent 75%);
  }
  .flash.on{animation:fl 220ms ease-out 1;}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}

  .relative { position: relative; }
  .absolute { position: absolute; }
  .hidden { display: none !important; }
  .flex { display: flex; }
  .inset-0 { inset: 0; }
  .top-2 { top: 0.5rem; }
  .left-2 { left: 0.5rem; }
  .right-2 { right: 0.5rem; }
  .left-1\/2 { left: 50%; }
  .bottom-\[10\%\] { bottom: 10%; }
  .top-\[18\%\] { top: 18%; }
  .z-50 { z-index: 50; }
  .w-full { width: 100%; }
  .h-full { height: 100%; }
  .w-\[88\%\] { width: 88%; }
  .w-\[85\%\] { width: 85%; }
  .max-w-\[420px\] { max-width: 420px; }
  .max-w-\[440px\] { max-width: 440px; }
  .select-none { user-select: none; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .text-center { text-align: center; }
  .rounded-xl { border-radius: 0.75rem; }
  .rounded-2xl { border-radius: 1rem; }
  .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
  .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
  .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
  .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
  .p-4 { padding: 1rem; }
  .p-6 { padding: 1.5rem; }
  .mt-2 { margin-top: 0.5rem; }
  .mt-4 { margin-top: 1rem; }
  .text-2xl { font-size: 1.1rem; }
  .text-3xl { font-size: 1.35rem; }
  .text-6xl { font-size: 2.6rem; }
  .leading-7 { line-height: 1.5; }
  .tracking-wide { letter-spacing: 0.08em; }
  .tracking-wider { letter-spacing: 0.14em; }
  .text-pink-100 { color: var(--text-main); }
  .text-red-100 { color: var(--text-soft); }
  .text-red-200 { color: #d2efff; }
  .text-white { color: #ffffff; }
  .bg-red-700 { background: linear-gradient(180deg, #2451a6, #142d61); }
  .-translate-x-1\/2 { transform: translateX(-50%); }
  .active\:scale-95:active { transform: scale(0.95); }
  #hud, #letterBox, #cinemaBox, #game-over-panel, #restart-btn {
    font-family: 'Exo 2', system-ui, sans-serif;
  }
  #hud > div,
  #letterBox,
  #cinemaBox,
  #game-over-panel {
    position: relative;
    overflow: hidden;
  }
  #hud > div::after,
  #letterBox::after,
  #cinemaBox::after,
  #game-over-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.06) 35%, transparent 65%);
    opacity: 0.5;
  }
  #hud > div {
    min-height: 34px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }
  #game-over-panel h2 {
    font-family: 'Audiowide', system-ui, sans-serif;
    font-weight: 400;
    text-shadow: 0 0 16px rgba(92,242,255,0.45);
  }
  #restart-btn {
    border: 1px solid rgba(155, 218, 255, 0.32);
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(13, 34, 79, 0.35);
    font-weight: 700;
  }
  #signal-gif-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .feedback-gif {
    position: absolute;
    width: min(32vw, 128px);
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 16px;
    border: 1px solid rgba(140, 247, 255, 0.26);
    box-shadow: 0 0 22px rgba(92, 242, 255, 0.22);
    opacity: 0;
    transform: translateY(10px) scale(0.92);
    transition: opacity 180ms ease, transform 180ms ease;
    background: rgba(4, 8, 20, 0.45);
  }
  .feedback-gif.show {
    opacity: 0.88;
    transform: translateY(0) scale(1);
  }
  #collect-gif {
    right: 3.5vw;
    top: 5.5rem;
  }
  #danger-gif {
    left: 50%;
    bottom: 12vh;
    transform: translateX(-50%) translateY(10px) scale(0.92);
    width: min(42vw, 156px);
  }
  #danger-gif.show {
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .hud-label,
  #letterBox,
  #cinemaBox {
    font-family: 'Audiowide', system-ui, sans-serif;
  }
  @media (max-width: 640px) {
    #collect-gif {
      top: 4.8rem;
      right: 0.75rem;
      width: min(28vw, 104px);
    }
    #danger-gif {
      bottom: 14vh;
      width: min(38vw, 132px);
    }
  }
</style>
</head>
<body>
<div id="game-container" class="relative w-full h-full select-none">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer" class="absolute inset-0 z-50">
    <div id="hud" class="absolute top-2 left-2 right-2 flex justify-between items-center">
      <div class="glass rounded-xl px-3 py-1 text-pink-100 text-2xl tracking-wide hud-label">📡 Signals: <span id="score">0</span>/<span id="goal">12</span></div>
      <div class="glass rounded-xl px-3 py-1 text-red-200 text-2xl tracking-wide hud-label">🛰️ Mode: <span id="phaseLabel">SWEEP</span></div>
    </div>
    <div id="letterBox" class="hidden absolute left-1/2 top-[18%] -translate-x-1/2 w-[88%] max-w-[420px] glass rounded-2xl p-4 text-pink-100 text-3xl leading-7 tracking-wide"></div>
    <div id="cinemaBox" class="hidden absolute left-1/2 bottom-[10%] -translate-x-1/2 w-[88%] max-w-[440px] glass rounded-2xl p-4 text-red-100 text-3xl leading-7 tracking-wide"></div>
    <div id="game-over-screen" class="hidden absolute inset-0 items-center justify-center">
      <div id="game-over-panel" class="glass rounded-2xl p-6 w-[85%] max-w-[420px] text-center">
        <h2 class="text-6xl text-red-200 tracking-wider">SIGNAL LOST</h2>
        <p id="endText" class="text-3xl text-pink-100 mt-2 leading-7">The sweep collapsed before every echo was secured.</p>
        <button id="restart-btn" class="mt-4 px-6 py-2 rounded-xl bg-red-700 text-white text-3xl tracking-wide active:scale-95">RUN SWEEP AGAIN</button>
      </div>
    </div>
    <div id="flashFx" class="flash"></div>
    <div id="signal-gif-layer" aria-hidden="true">
      <!-- [agent-note][stage3] resolved-gif: collect/danger feedback -> catalogs/gifs.json -->
      <img id="collect-gif" class="feedback-gif" alt="" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" loading="lazy" decoding="async">
      <img id="danger-gif" class="feedback-gif" alt="" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" loading="lazy" decoding="async">
    </div>
  </div>

  <img id="asset_player" data-editable="image" data-label="Player Sprite" hidden
    src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc2NCcgaGVpZ2h0PSc2NCc+PHJlY3Qgd2lkdGg9JzY0JyBoZWlnaHQ9JzY0JyBmaWxsPScjZmYyYTU1Jy8+PC9zdmc+" />
  <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/danger/win/defeat -> catalogs/audios.json -->
  <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop></audio>
  <audio id="sfx_monster" data-editable="audio" data-label="Monster SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3" preload="auto"></audio>
  <audio id="sfx_teleport" data-editable="audio" data-label="Teleport SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
  <audio id="sfx_ui" data-editable="audio" data-label="UI Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
  <audio id="sfx_win" data-editable="audio" data-label="Victory SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
  <audio id="sfx_fail" data-editable="audio" data-label="Game Over SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
</div>

<script id="game-config" type="application/x-game-config">
{
  "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 5.4, "min": 1, "max": 12 },
  "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff2a55" }
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const parsedDefs = JSON.parse(document.getElementById('game-config').textContent);
  window.gameConfigDefs = parsedDefs;
  window.gameConfig = Object.fromEntries(Object.entries(parsedDefs).map(([k, v]) => [k, v.value]));
  window.updateGameConfig = (key, val) => {
    if (!window.gameConfigDefs[key]) return;
    const def = window.gameConfigDefs[key];
    if (def.type === 'number') {
      const num = Number(val);
      if (!Number.isFinite(num)) return;
      window.gameConfig[key] = Math.max(def.min ?? num, Math.min(def.max ?? num, num));
    } else if (def.type === 'color') {
      if (!/^#[0-9a-fA-F]{6}$/.test(val)) return;
      window.gameConfig[key] = val;
    } else {
      window.gameConfig[key] = val;
    }
  };

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('game-container');
  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const goalEl = document.getElementById('goal');
  const phaseLabel = document.getElementById('phaseLabel');
  const gameOverScreen = document.getElementById('game-over-screen');
  const restartBtn = document.getElementById('restart-btn');
  const letterBox = document.getElementById('letterBox');
  const cinemaBox = document.getElementById('cinemaBox');
  const flashFx = document.getElementById('flashFx');
  const collectGif = document.getElementById('collect-gif');
  const dangerGif = document.getElementById('danger-gif');
  const bgm = document.getElementById('bgm_main');
  bgm.volume = 0.2;

  const GAME = { totalKids: 12, title: 'Signal Sweep: Lost Echoes' };
  let cw = 360, ch = 640, dpr = Math.max(1, window.devicePixelRatio || 1);
  let gifTimers = {};
  let initialized = false;
  let audioUnlocked = false;
  let lastTs = 0;
  let gameState = 'PLAYING';

  const world = {
    phase: 'gameplay',
    score: 0,
    hero: null,
    monster: null,
    kids: [],
    kidZone: { x: 0, y: 0, w: 0, h: 0 },
    particles: [],
    popups: [],
    pointer: { active: false, x: 0, y: 0 },
    phaseTime: 0,
    hospitalLineIndex: 0,
    hospitalLineTimer: 0,
    lines: [
      'Monitor: ...beep...beep...',
      'Dispatcher: The sweep is stable for now.',
      'Dispatcher: Every recovered echo confirms who was still calling out.',
      'Archive: Hold the trace. Do not let the static take the room.'
    ],
    backgroundDrift: 0
  };

  class Particle {
    constructor(x, y, vx, vy, life, color, size) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.life = life; this.maxLife = life; this.color = color; this.size = size;
    }
    update(dt) {
      this.life -= dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vy += 18 * dt;
    }
    draw() {
      const a = Math.max(0, this.life / this.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(0, this.size * a), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  const audioManager = {
    ctx: null,
    gain: null,
    buffers: {},
    ready: false,
    async init() {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.gain = this.ctx.createGain();
        this.gain.gain.value = 0.45;
        this.gain.connect(this.ctx.destination);
        const map = {
          monster: 'sfx_monster',
          teleport: 'sfx_teleport',
          ui: 'sfx_ui',
          win: 'sfx_win',
          fail: 'sfx_fail'
        };
        for (const key in map) {
          const el = document.getElementById(map[key]);
          if (!el || !el.src) continue;
          try {
            const res = await fetch(el.src);
            const arr = await res.arrayBuffer();
            const buf = await this.ctx.decodeAudioData(arr.slice(0));
            this.buffers[key] = buf;
          } catch (_) {}
        }
        this.ready = true;
      } catch (_) {}
    },
    unlock() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      this.ctx?.resume?.().catch(()=>{});
      bgm.play().catch(()=>{});
    },
    playSfx(name) {
      if (!this.ctx || !this.gain) { this.synth(name); return; }
      const b = this.buffers[name];
      if (b) {
        const src = this.ctx.createBufferSource();
        src.buffer = b;
        const g = this.ctx.createGain();
        g.gain.value =
          name === 'monster' ? 0.8 :
          name === 'fail' ? 0.62 :
          name === 'win' ? 0.55 :
          name === 'ui' ? 0.38 : 0.6;
        src.connect(g);
        g.connect(this.gain);
        src.start(0);
      } else this.synth(name);
    },
    synth(name) {
      if (!this.ctx || !this.gain) return;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = name === 'monster' || name === 'fail' ? 'sawtooth' : 'triangle';
      const now = this.ctx.currentTime;
      if (name === 'monster') {
        o.frequency.setValueAtTime(80, now);
        o.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.3, now + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      } else if (name === 'fail') {
        o.frequency.setValueAtTime(220, now);
        o.frequency.exponentialRampToValueAtTime(90, now + 0.3);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      } else if (name === 'win') {
        o.frequency.setValueAtTime(540, now);
        o.frequency.exponentialRampToValueAtTime(880, now + 0.11);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      } else if (name === 'ui') {
        o.frequency.setValueAtTime(420, now);
        o.frequency.exponentialRampToValueAtTime(520, now + 0.04);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
      } else {
        o.frequency.setValueAtTime(620, now);
        o.frequency.exponentialRampToValueAtTime(960, now + 0.08);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
      }
      o.connect(g); g.connect(this.gain); o.start(now); o.stop(now + 0.4);
    }
  };

  function triggerGif(el, duration = 1200) {
    if (!el) return;
    clearTimeout(gifTimers[el.id]);
    el.classList.add('show');
    gifTimers[el.id] = setTimeout(() => {
      el.classList.remove('show');
    }, duration);
  }

  function vibrate(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
      action: 'vibrate',
      requestId: 'h5-' + Date.now(),
      version: '1.0',
      params: { style }
    });
  }

  function setState(next) {
    gameState = next;
    if (next === 'PLAYING') {
      hud.classList.remove('hidden');
      gameOverScreen.classList.add('hidden');
      gameOverScreen.classList.remove('flex');
    } else {
      hud.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
      gameOverScreen.classList.add('flex');
    }
    if (next !== 'PLAYING') {
      bgm.pause();
    }
  }

  function randomRange(a, b) { return a + Math.random() * (b - a); }

  function setupKidZone() {
    world.kidZone.w = Math.min(cw * 0.62, 280);
    world.kidZone.h = Math.min(ch * 0.38, 250);
    world.kidZone.x = (cw - world.kidZone.w) * 0.5;
    world.kidZone.y = ch * 0.36;
  }

  function spawnKids() {
    world.kids = [];
    setupKidZone();
    for (let i = 0; i < GAME.totalKids; i++) {
      const r = 11;
      let x = cw * 0.5, y = ch * 0.55;
      let tries = 0;
      do {
        x = randomRange(world.kidZone.x + r + 6, world.kidZone.x + world.kidZone.w - r - 6);
        y = randomRange(world.kidZone.y + r + 6, world.kidZone.y + world.kidZone.h - r - 6);
        tries++;
      } while (tries < 20 && world.kids.some(k => Math.hypot(k.x - x, k.y - y) < r + k.r + 2));
      world.kids.push({ x, y, r, found: false, pulse: Math.random() * 3 });
    }
  }

  function spawnBurst(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = randomRange(35, 180);
      world.particles.push(new Particle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, randomRange(0.25, 0.65), color, randomRange(1.8, 5.2)));
    }
  }

  function chainExplosion(x, y) {
    for (let i = 0; i < 5; i++) {
      const ox = x + Math.cos(i * 1.3) * (10 + i * 10);
      const oy = y + Math.sin(i * 1.1) * (10 + i * 8);
      spawnBurst(ox, oy, 24, i % 2 ? '#ff2a55' : '#ffd3dc');
    }
  }

  function popScore(x, y, txt) {
    world.popups.push({ x, y, txt, life: 0.7, max: 0.7 });
  }

  function initGame() {
    const r = 14;
    world.score = 0;
    world.phase = 'gameplay';
    world.phaseTime = 0;
    world.hospitalLineIndex = 0;
    world.hospitalLineTimer = 0;
    world.particles = [];
    world.popups = [];
    world.hero = { x: cw * 0.5, y: ch * 0.72, r, tx: cw * 0.5, ty: ch * 0.72 };
    world.monster = { x: cw * 0.5, y: ch * 0.16, r: 24, speed: 72, blink: 0, droolTimer: 0 };
    spawnKids();
    world.hero.x = Math.max(r, Math.min(cw - r, world.hero.x));
    world.hero.y = Math.max(r, Math.min(ch - r, world.hero.y));
    scoreEl.textContent = '0';
    goalEl.textContent = String(GAME.totalKids);
    phaseLabel.textContent = 'SWEEP';
    document.title = GAME.title;
    letterBox.classList.add('hidden');
    cinemaBox.classList.add('hidden');
    cinemaBox.textContent = '';
    collectGif?.classList.remove('show');
    dangerGif?.classList.remove('show');
    container.classList.remove('screen-shake');
  }

  function restartGame() {
    initGame();
    setState('PLAYING');
    audioManager.playSfx('ui');
    if (audioUnlocked) bgm.play().catch(()=>{});
  }

  function resize(w, h) {
    cw = w; ch = h;
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (initialized && world.hero && world.monster) {
      const hr = world.hero.r, mr = world.monster.r;
      setupKidZone();
      world.hero.x = Math.max(hr, Math.min(cw - hr, world.hero.x));
      world.hero.y = Math.max(hr, Math.min(ch - hr, world.hero.y));
      world.hero.tx = Math.max(hr, Math.min(cw - hr, world.hero.tx));
      world.hero.ty = Math.max(hr, Math.min(ch - hr, world.hero.ty));
      world.monster.x = Math.max(mr, Math.min(cw - mr, world.monster.x));
      world.monster.y = Math.max(mr, Math.min(ch - mr, world.monster.y));
      for (const k of world.kids) {
        k.x = Math.max(world.kidZone.x + k.r, Math.min(world.kidZone.x + world.kidZone.w - k.r, k.x));
        k.y = Math.max(world.kidZone.y + k.r, Math.min(world.kidZone.y + world.kidZone.h - k.r, k.y));
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function handleGameInput(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if (e.type === 'pointerdown' || e.type === 'pointermove') {
      world.pointer.active = true;
      world.pointer.x = x; world.pointer.y = y;
      if (world.hero) { world.hero.tx = x; world.hero.ty = y; }
      spawnBurst(x, y, 5, '#ff2a55');
    } else {
      world.pointer.active = false;
    }
  }

  function handleGlobalInput(e) {
    audioManager.unlock();
    const isCanvasInput = e.target === canvas;
    const isRestartInput = e.target === restartBtn;

    // [agent-note][stage4] repaired: mobile-action-risk | scope: input suppression | action: preventDefault only on game canvas / restart control
    if (isCanvasInput || isRestartInput) {
      e.preventDefault();
    }

    if (e.type === 'pointerdown' || e.type === 'click') {
      audioManager.playSfx('ui');
    }

    if (gameState === 'GAMEOVER') {
      if (isRestartInput || isCanvasInput) restartGame();
      return;
    }

    if (gameState === 'PLAYING' && isCanvasInput) {
      handleGameInput(e);
    }
  }

  function dist(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return Math.hypot(dx, dy);
  }

  function update(dt) {
    dt = Math.min(dt, 0.05);
    world.backgroundDrift += dt;
    if (world.phase === 'gameplay') {
      phaseLabel.textContent = 'SWEEP';
      const h = world.hero, m = world.monster;
      if (!Number.isFinite(h.x) || !Number.isFinite(h.y)) { h.x = cw * 0.5; h.y = ch * 0.72; h.tx = h.x; h.ty = h.y; }
      const speed = Math.max(1, Math.min(12, window.gameConfig.heroSpeed)) * 95;
      const dx = h.tx - h.x, dy = h.ty - h.y;
      const d = Math.hypot(dx, dy) || 1;
      const step = Math.min(d, speed * dt);
      h.x += (dx / d) * step;
      h.y += (dy / d) * step;
      h.x = Math.max(h.r, Math.min(cw - h.r, h.x));
      h.y = Math.max(h.r, Math.min(ch - h.r, h.y));

      const mdx = h.x - m.x, mdy = h.y - m.y;
      const md = Math.hypot(mdx, mdy) || 1;
      m.x += (mdx / md) * m.speed * dt;
      m.y += (mdy / md) * m.speed * dt;
      m.blink += dt * 8;
      m.droolTimer -= dt;
      if (m.droolTimer <= 0) {
        m.droolTimer = randomRange(0.05, 0.11);
        spawnBurst(m.x + randomRange(-6, 6), m.y + 8, 2, '#7a0019');
      }

      for (const kid of world.kids) {
        if (kid.found) continue;
        kid.pulse += dt * 5;
        if (dist(h.x, h.y, kid.x, kid.y) < h.r + kid.r + 6) {
          kid.found = true;
          world.score++;
          scoreEl.textContent = String(world.score);
          flashFx.classList.remove('on'); void flashFx.offsetWidth; flashFx.classList.add('on');
          popScore(kid.x, kid.y, '+1');
          spawnBurst(kid.x, kid.y, 20, '#ffd3dc');
          triggerGif(collectGif, 1000);
          audioManager.playSfx('teleport');
          vibrate('light');
        }
      }

      if (dist(h.x, h.y, m.x, m.y) < h.r + m.r - 2) {
        chainExplosion(h.x, h.y);
        triggerGif(dangerGif, 1400);
        audioManager.playSfx('monster');
        audioManager.playSfx('fail');
        vibrate('heavy');
        container.classList.remove('screen-shake'); void container.offsetWidth; container.classList.add('screen-shake');
        world.phase = 'end';
        world.phaseTime = 0;
      }

      if (world.score >= GAME.totalKids && world.phase === 'gameplay') {
        world.phase = 'house';
        world.phaseTime = 0;
          letterBox.textContent = 'Field Note: Twelve echoes locked. Keep the trace alive while the safehouse relay rebuilds.';
          letterBox.classList.remove('hidden');
          phaseLabel.textContent = 'RELAY';
        spawnBurst(h.x, h.y, 40, '#ffd3dc');
        triggerGif(collectGif, 1800);
        audioManager.playSfx('teleport');
        audioManager.playSfx('win');
      }
    } else if (world.phase === 'house') {
      world.phaseTime += dt;
      phaseLabel.textContent = 'RELAY';
      if (world.phaseTime > 15) {
        letterBox.classList.add('hidden');
        world.phase = 'hospital';
        world.phaseTime = 0;
        world.hospitalLineIndex = 0;
        world.hospitalLineTimer = 0;
        cinemaBox.classList.remove('hidden');
        phaseLabel.textContent = 'ARCHIVE';
        audioManager.playSfx('teleport');
      }
    } else if (world.phase === 'hospital') {
      world.phaseTime += dt;
      world.hospitalLineTimer += dt;
      if (world.hospitalLineIndex < world.lines.length && world.hospitalLineTimer > 2.5) {
        cinemaBox.textContent = world.lines[world.hospitalLineIndex];
        world.hospitalLineIndex++;
        world.hospitalLineTimer = 0;
      }
      if (world.phaseTime > 10) {
        world.phase = 'end';
        world.phaseTime = 0;
      }
    } else if (world.phase === 'end') {
      world.phaseTime += dt;
      if (world.phaseTime > 1) {
        cinemaBox.classList.add('hidden');
        letterBox.classList.add('hidden');
        setState('GAMEOVER');
      }
    }

    world.particles = world.particles.filter(p => (p.update(dt), p.life > 0));
    world.popups = world.popups.filter(p => {
      p.life -= dt; p.y -= 24 * dt;
      return p.life > 0;
    });
  }

  function drawParallax() {
    const t = world.backgroundDrift;
      ctx.fillStyle = '#040814';
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.globalAlpha = 0.32;
    for (let i = 0; i < 18; i++) {
      const x = ((i * 47 + t * 16) % (cw + 60)) - 30;
      const y = (i * 83) % ch;
        ctx.fillStyle = i % 2 ? '#0d2237' : '#09111f';
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0, 18 + (i % 4) * 6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#0c1e33';
    ctx.beginPath();
    ctx.moveTo(0, ch * 0.78);
    for (let x = 0; x <= cw; x += 30) {
      const y = ch * 0.78 + Math.sin((x * 0.02) + t * 2.2) * 10;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(cw, ch); ctx.lineTo(0, ch); ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.34;
      ctx.strokeStyle = '#23527d';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const y = 60 + i * (ch / 9) + Math.sin(t * 2 + i) * 5;
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= cw; x += 20) {
        ctx.lineTo(x, y + Math.sin(x * 0.02 + i + t * 1.5) * 4);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGameplay() {
    ctx.save();
    ctx.strokeStyle = 'rgba(134, 233, 255, 0.34)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(world.kidZone.x, world.kidZone.y, world.kidZone.w, world.kidZone.h);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(24, 138, 194, 0.08)';
    ctx.fillRect(world.kidZone.x, world.kidZone.y, world.kidZone.w, world.kidZone.h);
    ctx.restore();

    for (const kid of world.kids) {
      if (kid.found) continue;
      const p = 0.5 + Math.sin(kid.pulse) * 0.5;
      ctx.fillStyle = `rgba(190,246,255,${0.5 + p * 0.5})`;
      ctx.beginPath();
      ctx.arc(kid.x, kid.y, Math.max(0, kid.r + p * 1.8), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#163249';
      ctx.fillRect(kid.x - 4, kid.y - 2, 8, 10);
      ctx.beginPath();
      ctx.arc(kid.x, kid.y - 8, Math.max(0, 4), 0, Math.PI * 2);
      ctx.fill();
    }

    const h = world.hero;
    const heroBob = Math.sin(world.backgroundDrift * 7) * 1.5;
    ctx.save();
    ctx.translate(h.x, h.y + heroBob);
    ctx.shadowColor = 'rgba(92,242,255,0.8)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#1e5ea8';
    ctx.beginPath();
    ctx.moveTo(0, -h.r - 6);
    ctx.lineTo(h.r + 7, 0);
    ctx.lineTo(0, h.r + 7);
    ctx.lineTo(-h.r - 7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(122,140,255,0.55)';
    ctx.beginPath();
    ctx.arc(0, 0, h.r + 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--hero-shell').trim() || '#57bfff';
    ctx.beginPath();
    ctx.arc(0, 0, h.r + 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--hero-core').trim() || '#8cf7ff';
    ctx.beginPath();
    ctx.arc(0, 0, h.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-4, -3, 1.8, 0, Math.PI * 2);
    ctx.arc(4, -3, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0d2237';
    ctx.beginPath();
    ctx.arc(-4, -3, 0.85, 0, Math.PI * 2);
    ctx.arc(4, -3, 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 2.2, 4.5, 0.15, Math.PI - 0.15);
    ctx.stroke();
    ctx.restore();

    const m = world.monster;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.shadowColor = 'rgba(255,77,126,0.45)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#35061f';
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = (Math.PI * 2 / 16) * i;
      const rr = i % 2 ? m.r + 10 : m.r - 2;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7d1433';
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(0, m.r), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,151,187,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(0, m.r - 4), 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#ffe7ef';
    ctx.beginPath();
    ctx.arc(-8, -5, Math.max(0, 4), 0, Math.PI * 2);
    ctx.arc(8, -5, Math.max(0, 4), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#12060a';
    ctx.beginPath();
    ctx.arc(-8 + Math.sin(m.blink) * 1.5, -5, Math.max(0, 2), 0, Math.PI * 2);
    ctx.arc(8 - Math.sin(m.blink) * 1.5, -5, Math.max(0, 2), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff7aa0';
    ctx.beginPath();
    ctx.moveTo(-8, 9);
    ctx.lineTo(0, 14);
    ctx.lineTo(8, 9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawHouseHospital() {
    if (world.phase === 'house') {
       ctx.fillStyle = '#07111f';
       ctx.fillRect(0, 0, cw, ch);
       ctx.fillStyle = '#12263b';
       ctx.fillRect(cw*0.2, ch*0.38, cw*0.6, ch*0.34);
       ctx.fillStyle = '#17354e';
       ctx.beginPath();
       ctx.moveTo(cw*0.15, ch*0.38); ctx.lineTo(cw*0.5, ch*0.2); ctx.lineTo(cw*0.85, ch*0.38); ctx.closePath(); ctx.fill();
       ctx.fillStyle = '#5cf2ff';
       ctx.fillRect(cw*0.46, ch*0.55, cw*0.08, ch*0.17);
    } else if (world.phase === 'hospital') {
       ctx.fillStyle = '#07101c';
       ctx.fillRect(0,0,cw,ch);
       ctx.fillStyle = '#18293b';
       ctx.fillRect(cw*0.1,ch*0.2,cw*0.8,ch*0.5);
       ctx.fillStyle = '#b2dbf2';
       ctx.fillRect(cw*0.18,ch*0.42,cw*0.64,ch*0.1);
       ctx.fillStyle = '#5c7fa0';
       ctx.fillRect(cw*0.25,ch*0.31,cw*0.22,ch*0.07);
       ctx.fillStyle = '#d4f4ff';
       ctx.fillRect(cw*0.55,ch*0.31,cw*0.22,ch*0.07);
       ctx.fillStyle = '#5cf2ff';
      ctx.beginPath();
      ctx.arc(cw*0.7,ch*0.34,Math.max(0,4+Math.sin(world.backgroundDrift*7)*1.2),0,Math.PI*2);
      ctx.fill();
    }
  }

  function render() {
    drawParallax();
    if (world.phase === 'gameplay') drawGameplay();
    else drawHouseHospital();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of world.particles) p.draw();
    ctx.restore();

    for (const pop of world.popups) {
      ctx.globalAlpha = Math.max(0, pop.life / pop.max);
      ctx.fillStyle = '#d9fbff';
      ctx.font = "26px 'Audiowide'";
      ctx.fillText(pop.txt, pop.x, pop.y);
      ctx.globalAlpha = 1;
    }
  }

  function loop(ts) {
    try {
      const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
      lastTs = ts;
      if (gameState === 'PLAYING') update(dt);
      render();
    } catch (_) {}
    requestAnimationFrame(loop);
  }

  const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    resize(rect.width, rect.height);
    if (!initialized) {
      initGame();
      setState('PLAYING');
      audioManager.init();
      initialized = true;
      requestAnimationFrame(loop);
    }
  });

  canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointermove', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointercancel', handleGlobalInput, { passive: false });
  if (restartBtn) restartBtn.addEventListener('click', handleGlobalInput, { passive: false });

  ro.observe(canvas);
});
</script>
