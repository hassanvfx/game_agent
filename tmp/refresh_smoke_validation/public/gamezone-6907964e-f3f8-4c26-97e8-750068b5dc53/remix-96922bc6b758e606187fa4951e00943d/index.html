<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbit Relay</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json (Audiowide + Exo 2) -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070b1a;
            --bg-mid: #111b3d;
            --bg-glow: #18397f;
            --panel-fill: rgba(10, 18, 44, 0.72);
            --panel-stroke: rgba(116, 223, 255, 0.38);
            --title-cyan: #8ff6ff;
            --title-violet: #b886ff;
            --signal-hot: #74f8ff;
            --signal-core: #34d8ff;
            --signal-warm: #ffd76a;
            --danger: #ff5f87;
            --text-main: #f4fbff;
            --text-soft: #cedaf9;
            --shadow-deep: rgba(1, 8, 24, 0.5);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: auto;
            user-select: none;
            -webkit-user-select: none;
            background:
                radial-gradient(circle at top, rgba(143, 246, 255, 0.16), transparent 28%),
                radial-gradient(circle at 20% 80%, rgba(184, 134, 255, 0.14), transparent 30%),
                linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 55%, #040611 100%);
        }

        body {
            font-family: "Exo 2", system-ui, sans-serif;
            color: var(--text-main);
        }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .glass {
            background:
                linear-gradient(180deg, rgba(23, 35, 78, 0.82), rgba(7, 14, 35, 0.78)),
                var(--panel-fill);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 10px 30px rgba(0,0,0,0.28),
                0 0 18px rgba(52, 216, 255, 0.14);
        }

        .text-glow {
            text-shadow:
                0 0 10px rgba(52, 216, 255, 0.45),
                0 0 24px rgba(184, 134, 255, 0.22);
        }

        .ui-anim { transition: transform 0.1s ease-out; }

        #ui-title {
            font-family: "Audiowide", sans-serif;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow:
                0 0 10px rgba(143, 246, 255, 0.6),
                0 0 30px rgba(143, 246, 255, 0.28),
                0 10px 24px rgba(0, 0, 0, 0.45);
        }

        .title-top {
            display: inline-block;
            background: linear-gradient(180deg, #ffffff 0%, var(--title-cyan) 45%, #8de1ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .title-bottom {
            display: inline-block;
            background: linear-gradient(180deg, #f9e9ff 0%, #d4b0ff 48%, #8aa8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 0.65rem rgba(184, 134, 255, 0.35));
        }

        #ui-cta {
            font-family: "Exo 2", system-ui, sans-serif;
            color: rgba(244, 251, 255, 0.92);
            text-shadow: 0 0 16px rgba(52, 216, 255, 0.22);
        }

        .cta-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            max-width: min(90vw, 34rem);
            padding: 0.9rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(143, 246, 255, 0.28);
            background: rgba(7, 14, 35, 0.58);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 0 18px rgba(52, 216, 255, 0.12);
        }

        .cta-dot {
            width: 0.62rem;
            height: 0.62rem;
            border-radius: 999px;
            background: radial-gradient(circle, #fff6b3 0%, var(--signal-warm) 52%, rgba(255, 215, 106, 0.2) 100%);
            box-shadow: 0 0 12px rgba(255, 215, 106, 0.7);
            flex: 0 0 auto;
        }

        .signal-caption {
            margin-top: 0.55rem;
            font-size: 0.76rem;
            line-height: 1.3;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(206, 218, 249, 0.86);
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            min-height: 2.75rem;
            padding: 0.52rem 1rem 0.52rem 0.7rem;
        }

        .hud-badge {
            display: grid;
            place-items: center;
            width: 1.95rem;
            height: 1.95rem;
            border-radius: 999px;
            background:
                radial-gradient(circle at 35% 30%, #fefbd5 0%, var(--signal-warm) 40%, #ff9a3c 100%);
            color: #162033;
            font-size: 0.95rem;
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.08),
                0 0 16px rgba(255, 215, 106, 0.38);
        }

        .hud-copy {
            display: flex;
            align-items: baseline;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .hud-label {
            color: #9feeff;
            font-size: 0.78rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .hud-value {
            color: var(--text-main);
            text-shadow: 0 0 12px rgba(52, 216, 255, 0.22);
        }

        .scanline-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 14%, transparent 84%, rgba(255,255,255,0.03)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.028) 0 2px, transparent 2px 6px);
            opacity: 0.24;
            mix-blend-mode: screen;
        }

        .signal-orb {
            position: absolute;
            right: 7vw;
            top: 14vh;
            width: clamp(96px, 24vw, 160px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.9;
            background:
                radial-gradient(circle at 32% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 10%, rgba(143,246,255,0.9) 22%, rgba(52,216,255,0.44) 38%, rgba(17,27,61,0) 70%),
                radial-gradient(circle, rgba(184,134,255,0.22), transparent 68%);
            filter: drop-shadow(0 0 22px rgba(52, 216, 255, 0.3));
        }

        .signal-orb::before,
        .signal-orb::after {
            content: "";
            position: absolute;
            inset: -10%;
            border-radius: 50%;
            border: 1px solid rgba(143, 246, 255, 0.22);
        }

        .signal-orb::before {
            animation: orbitPulse 2.6s ease-in-out infinite;
        }

        .signal-orb::after {
            inset: 10%;
            border-color: rgba(184, 134, 255, 0.24);
            animation: orbitPulse 2.6s ease-in-out infinite reverse;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .z-50 { z-index: 50; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .overflow-hidden { overflow: hidden; }
        .gap-4 { gap: 1rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .text-6xl { font-size: 3.75rem; line-height: 1; }
        .text-4xl { font-size: 2.25rem; line-height: 1.1; }
        .text-xl { font-size: 1.25rem; line-height: 1.4; }
        .text-lg { font-size: 1.125rem; line-height: 1.4; }
        .text-2xl { font-size: 1.5rem; line-height: 1.3; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .tracking-widest { letter-spacing: 0.2em; }
        .tracking-wider { letter-spacing: 0.08em; }
        .text-white { color: #fff; }
        .text-gray-200 { color: #e5e7eb; }
        .text-cyan-300 { color: #67e8f9; }
        .bg-black\/40 { background: rgba(0,0,0,0.4); }
        .backdrop-blur-sm { backdrop-filter: blur(4px); }
        .bg-cyan-500 { background: linear-gradient(180deg, #7af3ff 0%, #2fd7ff 100%); }
        .hover\:bg-cyan-400:hover { filter: brightness(1.08); }
        .text-black { color: #04101e; }
        .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.25); }
        .shadow-cyan-500\/50 { box-shadow: 0 0 24px rgba(6,182,212,0.5); }
        .transition-all { transition: all 0.2s ease; }
        .active\:scale-95:active { transform: scale(0.95); }
        .transform { transform-origin: center; }
        .scale-95 { transform: scale(0.95); }
        .scale-100 { transform: scale(1); }
        .opacity-0 { opacity: 0; }
        .opacity-100 { opacity: 1; }
        .animate-pulse { animation: pulse 1.8s ease-in-out infinite; }
        .animate-bounce { animation: bounce 1.4s infinite; }
        .inline-block { display: inline-block; }
        .font-mono { font-family: "Exo 2", system-ui, sans-serif; }
        .md\:text-8xl, .md\:text-2xl { }
        .font-display { font-family: "Audiowide", sans-serif; }
        .font-ui { font-family: "Exo 2", system-ui, sans-serif; }

        #start-screen {
            justify-content: center;
            text-align: center;
        }

        #game-over-panel {
            padding: 1.55rem 1.35rem;
            border-radius: 1.4rem;
            min-width: min(90vw, 360px);
            max-width: min(90vw, 360px);
        }

        #restart-btn {
            border: none;
            cursor: pointer;
            font-family: "Exo 2", system-ui, sans-serif;
            min-height: 48px;
            width: 100%;
            letter-spacing: 0.08em;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: clamp(88px, 24vw, 144px);
            aspect-ratio: 1 / 1;
            border-radius: 1rem;
            border: 1px solid rgba(143, 246, 255, 0.28);
            background: rgba(5, 10, 26, 0.72);
            box-shadow: 0 10px 24px rgba(0,0,0,0.22), 0 0 20px rgba(52, 216, 255, 0.16);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 55;
        }

        .feedback-gif.is-visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 50%;
            right: auto;
            top: 18vh;
            bottom: auto;
            width: min(42vw, 176px);
            transform: translate(-50%, -8px) scale(0.92);
        }

        .feedback-gif.fail.is-visible {
            transform: translate(-50%, 0) scale(1);
        }

        .panel-tag {
            font-size: 0.76rem;
            line-height: 1.2;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(159, 238, 255, 0.78);
        }

        .panel-stat {
            color: var(--text-soft);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.03); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes orbitPulse {
            0%, 100% { transform: scale(0.96); opacity: 0.5; }
            50% { transform: scale(1.04); opacity: 0.95; }
        }

        @media (max-width: 767px) {
            #ui-title {
                top: 16vh !important;
                font-size: clamp(2.8rem, 16vw, 4.25rem);
            }

            #ui-cta {
                bottom: 7.5vh !important;
                font-size: 0.92rem;
                padding: 0 1rem;
            }

            .cta-chip {
                padding: 0.85rem 0.9rem;
                border-radius: 1.1rem;
            }

            #game-over-panel h2 {
                font-size: 1.9rem;
            }

            .feedback-gif {
                right: 0.75rem;
                bottom: 0.75rem;
                width: 96px;
            }

            .feedback-gif.fail {
                top: 15vh;
                width: min(38vw, 132px);
            }
        }

        @media (min-width: 768px) {
            .md\:text-8xl { font-size: 6rem; line-height: 1; }
            .md\:text-2xl { font-size: 1.5rem; line-height: 1.3; }
        }
    </style>

<script>
/** 
 * ENGINE CORE 
 * Handles Loop, Input, Audio, Config
 */
const CONFIG = {
    // Defaults overwritten by game-config
    heroGravity: 1200,
    jumpForce: 700,
    moveSpeed: 350,
    platformGap: 140
};

// Editor Protocol
window.gameConfigDefs = {
    "heroGravity": { "type": "number", "label": "Gravity", "value": 1200, "min": 500, "max": 2000 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 700, "min": 400, "max": 1200 },
    "moveSpeed": { "type": "number", "label": "Move Speed", "value": 350, "min": 100, "max": 800 },
    "platformGap": { "type": "number", "label": "Platform Gap", "value": 140, "min": 80, "max": 300 }
};
window.gameConfig = { ...CONFIG };
window.updateGameConfig = (key, val) => {
    if(window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot update logic if needed
    }
};

// Audio System
class AudioController {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.bgmEl = document.getElementById("bgm_main");
        this.initialized = false;
        this.lastPlayedAt = {};
        this.soundConfig = {
            collect: { volume: 0.34, cooldown: 80 },
            fail: { volume: 0.5, cooldown: 260 },
            start: { volume: 0.36, cooldown: 180 },
            score: { volume: 0.3, cooldown: 220 }
        };
    }

    ensureContext() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
        }
        return this.ctx;
    }

    init() {
        if (this.initialized) {
            this.resumeContext();
            this.playBGM();
            return;
        }
        this.initialized = true;
        this.resumeContext();
        this.loadSound("collect", document.getElementById("sfx_collect").src);
        this.loadSound("fail", document.getElementById("sfx_fail").src);
        this.loadSound("start", document.getElementById("sfx_start").src);
        this.loadSound("score", document.getElementById("sfx_score").src);
        this.playBGM();
    }

    resumeContext() {
        const ctx = this.ensureContext();
        if (ctx && ctx.state === "suspended") {
            ctx.resume().catch(() => {});
        }
    }

    async loadSound(id, url) {
        const ctx = this.ensureContext();
        if (!ctx || !url) {
            this.buffers[id] = "synth";
            return;
        }

        try {
            const res = await fetch(url);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await ctx.decodeAudioData(arrayBuffer.slice(0));
        } catch (e) {
            console.warn("Audio load failed, using synth fallback", id, e);
            this.buffers[id] = "synth";
        }
    }

    playBGM() {
        if (!this.bgmEl) return;
        this.bgmEl.volume = 0.22;
        this.bgmEl.play().catch(() => {});
    }

    stopBGM() {
        if (!this.bgmEl) return;
        this.bgmEl.pause();
        this.bgmEl.currentTime = 0;
    }

    playSFX(id) {
        const now = performance.now();
        const config = this.soundConfig[id] || { volume: 0.32, cooldown: 120 };
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < config.cooldown) return;
        this.lastPlayedAt[id] = now;

        const ctx = this.ensureContext();
        if (ctx && ctx.state === "suspended") {
            ctx.resume().catch(() => {});
        }

        if (ctx && this.buffers[id] && this.buffers[id] !== "synth") {
            const src = ctx.createBufferSource();
            src.buffer = this.buffers[id];
            const gain = ctx.createGain();
            gain.gain.value = config.volume;
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
        } else {
            this.synth(id);
        }
    }

    synth(type) {
        const ctx = this.ensureContext();
        if (!ctx) return;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "collect") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(640, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.22, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
        } else if (type === "start") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(420, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(760, ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
        } else if (type === "score") {
            osc.type = "square";
            osc.frequency.setValueAtTime(520, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.14, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.16);
            osc.start();
            osc.stop(ctx.currentTime + 0.16);
        } else if (type === "fail") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(110, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(52, ctx.currentTime + 0.32);
            gain.gain.setValueAtTime(0.32, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.32);
            osc.start();
            osc.stop(ctx.currentTime + 0.32);
        }
    }
}

/**
 * GAME LOGIC
 */
const GAME = {
    state: 'start', // start, playing, gameover
    width: 0,
    height: 0,
    ctx: null,
    lastTime: 0,
    score: 0,
    cameraY: 0,
    shake: 0,
    
    // Entities
    player: { x: 0, y: 0, vx: 0, vy: 0, w: 50, h: 50, facingRight: true },
    platforms: [],
    particles: [],
    lastMilestone: 0,
    
    // Input
    input: { left: false, right: false },
    
    // Assets
    assets: {
        bg: null,
        hero: null
    },

    init() {
        const canvas = document.getElementById('gameCanvas');
        this.ctx = canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Parse Config
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            try {
                const parsed = JSON.parse(cfgEl.textContent);
                Object.keys(parsed).forEach(k => {
                    window.gameConfigDefs[k] = parsed[k];
                    window.gameConfig[k] = parsed[k].value;
                });
            } catch(e) {}
        }

        // Assets
        this.assets.bg = document.getElementById('asset_bg');
        this.assets.hero = document.getElementById('asset_player');
        
        // Audio
        this.audio = new AudioController();

        // Input Listeners
        this.bindInput();

        // Start Loop
        requestAnimationFrame(t => this.loop(t));
        
        // Initial setup for start screen background
        this.resetGame();
        this.state = 'start';
    },

    bindInput() {
        const gameContainer = document.getElementById('game-container');
        const restartBtn = document.getElementById('restart-btn');

        const handleStart = () => {
            if (this.state === "start") {
                this.startGame();
            } else if (this.state === "gameover") {
                // Handled by button, but just in case
            } else {
                this.audio.init();
            }
        };

        const onDown = (e) => {
            if (!gameContainer.contains(e.target) || e.target.closest('button')) return;
            e.preventDefault();
            handleStart();
            const x = e.clientX;
            if (x < window.innerWidth / 2) this.input.left = true;
            else this.input.right = true;
        };

        const onUp = (e) => {
            if (!gameContainer.contains(e.target) && this.state !== 'playing') return;
            e.preventDefault();
            this.input.left = false;
            this.input.right = false;
        };

        gameContainer.addEventListener('pointerdown', onDown, { passive: false });
        window.addEventListener('pointerup', onUp, { passive: false });
        window.addEventListener('pointercancel', onUp, { passive: false });
        
        // Keyboard fallback
        window.addEventListener('keydown', (e) => {
            handleStart();
            if (e.code === 'ArrowLeft') this.input.left = true;
            if (e.code === 'ArrowRight') this.input.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') this.input.left = false;
            if (e.code === 'ArrowRight') this.input.right = false;
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.resetGame();
            this.startGame();
        });
    },

    resize() {
        const canvas = document.getElementById('gameCanvas');
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        canvas.style.width = this.width + 'px';
        canvas.style.height = this.height + 'px';
        canvas.width = this.width * window.devicePixelRatio;
        canvas.height = this.height * window.devicePixelRatio;
        this.ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    },

    resetGame() {
        this.score = 0;
        this.cameraY = 0;
        this.shake = 0;
        this.lastMilestone = 0;
        this.player = {
            x: this.width / 2 - 25,
            y: this.height - 200,
            vx: 0,
            vy: -window.gameConfig.jumpForce,
            w: 60,
            h: 60,
            facingRight: true
        };
        
        this.platforms = [];
        // Initial platform
        this.platforms.push({ x: this.width/2 - 60, y: this.height - 100, w: 120, h: 20, type: 'normal' });
        
        // Generate initial batch
        let y = this.height - 100;
        for(let i=0; i<10; i++) {
            y -= window.gameConfig.platformGap;
            this.generatePlatform(y);
        }
        
        this.particles = [];
        document.getElementById("bounce-gif")?.classList.remove("is-visible");
        document.getElementById("fail-gif")?.classList.remove("is-visible");
        
        // UI Reset
        document.getElementById('score').innerText = '0m';
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('game-over-panel').classList.remove('scale-100', 'opacity-100');
        document.getElementById('game-over-panel').classList.add('scale-95', 'opacity-0');
    },

    startGame() {
        this.state = 'playing';
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').classList.remove('hidden');
        this.resetGame();
        this.audio.init();
        this.audio.playSFX("start");
    },

    gameOver() {
        this.state = 'gameover';
        this.audio.playSFX('fail');
        this.showGif("fail-gif", 1600);
        this.shake = 20;
        
        setTimeout(() => {
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = Math.floor(this.score);
            // Animation
            requestAnimationFrame(() => {
                document.getElementById('game-over-panel').classList.remove('scale-95', 'opacity-0');
                document.getElementById('game-over-panel').classList.add('scale-100', 'opacity-100');
            });
        }, 500);
    },

    generatePlatform(y) {
        const w = 80 + Math.random() * 60;
        const x = Math.random() * (this.width - w);
        this.platforms.push({ x, y, w, h: 18, type: 'normal', passed: false });
    },

    spawnParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 300,
                vy: (Math.random() - 0.5) * 300,
                life: 1.0,
                color: color || '#22d3ee'
            });
        }
    },

    showGif(id, duration = 900) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add("is-visible");
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => {
            el.classList.remove("is-visible");
        }, duration);
    },

    update(dt) {
        // Shake decay
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.5) this.shake = 0;

        // Background particles/stars logic could go here
        
        if (this.state !== 'playing') {
            // Idle animation for start screen
            if (this.state === 'start') {
                this.player.y += Math.sin(Date.now() / 300) * 0.5;
            }
            return;
        }

        // Player Physics
        // Horizontal
        if (this.input.left) {
            this.player.vx = -window.gameConfig.moveSpeed;
            this.player.facingRight = false;
        } else if (this.input.right) {
            this.player.vx = window.gameConfig.moveSpeed;
            this.player.facingRight = true;
        } else {
            this.player.vx *= 0.9; // friction
        }
        
        this.player.x += this.player.vx * dt;
        
        // Screen wrap
        if (this.player.x < -this.player.w/2) this.player.x = this.width - this.player.w/2;
        if (this.player.x > this.width - this.player.w/2) this.player.x = -this.player.w/2;

        // Vertical
        this.player.vy += window.gameConfig.heroGravity * dt;
        this.player.y += this.player.vy * dt;

        // Platform Collision (only when falling)
        if (this.player.vy > 0) {
            for (let p of this.platforms) {
                if (this.player.x + this.player.w * 0.8 > p.x && 
                    this.player.x + this.player.w * 0.2 < p.x + p.w &&
                    this.player.y + this.player.h > p.y &&
                    this.player.y + this.player.h < p.y + p.h + 20) { // +20 tolerance
                    
                    // Bounce
                    this.player.vy = -window.gameConfig.jumpForce;
                    this.audio.playSFX('collect'); // Relay pulse sound on each successful bounce.
                    this.showGif("bounce-gif", 520);
                    this.spawnParticles(this.player.x + this.player.w/2, this.player.y + this.player.h, 5, '#ffffff');
                    
                    // Juice: Platform dip
                    p.y += 5; 
                }
            }
        }

        // Camera / Score
        const targetY = this.height * 0.4;
        if (this.player.y < targetY) {
            const diff = targetY - this.player.y;
            this.player.y = targetY;
            this.score += diff / 10; // Convert pixels to meters roughly
            document.getElementById('score').innerText = Math.floor(this.score) + 'm';
            const milestone = Math.floor(this.score / 50);
            if (milestone > this.lastMilestone) {
                this.lastMilestone = milestone;
                this.audio.playSFX("score");
            }
            
            // Move platforms
            this.platforms.forEach(p => p.y += diff);
            
            // Generate new
            const highestP = this.platforms[this.platforms.length-1];
            if (highestP.y > window.gameConfig.platformGap) {
                this.generatePlatform(highestP.y - window.gameConfig.platformGap);
            }
            
            // Remove old
            this.platforms = this.platforms.filter(p => p.y < this.height + 50);
        }

        // Platform return to pos
        this.platforms.forEach(p => {
             // Simple lerp back if we dipped it
             // Not implemented for simplicity, just letting them stay static relative to world
        });

        // Death
        if (this.player.y > this.height) {
            this.gameOver();
        }

        // Particles
        this.particles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
        });
        this.particles = this.particles.filter(p => p.life > 0);
    },

    draw() {
        // Clear
        const gradient = this.ctx.createLinearGradient(0, 0, 0, this.height);
        gradient.addColorStop(0, '#14295b');
        gradient.addColorStop(0.45, '#0b1531');
        gradient.addColorStop(1, '#040611');
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Shake
        this.ctx.save();
        if (this.shake > 0) {
            const dx = (Math.random() - 0.5) * this.shake;
            const dy = (Math.random() - 0.5) * this.shake;
            this.ctx.translate(dx, dy);
        }

        // Background
        if (this.assets.bg) {
            const img = this.assets.bg;
            const ratio = Math.max(this.width / img.width, this.height / img.height);
            const cx = (this.width - img.width * ratio) / 2;
            const cy = (this.height - img.height * ratio) / 2;
            this.ctx.globalAlpha = 0.18;
            this.ctx.drawImage(img, cx, cy, img.width * ratio, img.height * ratio);
            this.ctx.globalAlpha = 1.0;
        }

        // Atmospheric halos
        const haloA = this.ctx.createRadialGradient(this.width * 0.5, this.height * 0.18, 20, this.width * 0.5, this.height * 0.18, this.width * 0.36);
        haloA.addColorStop(0, 'rgba(143, 246, 255, 0.20)');
        haloA.addColorStop(0.35, 'rgba(52, 216, 255, 0.08)');
        haloA.addColorStop(1, 'rgba(52, 216, 255, 0)');
        this.ctx.fillStyle = haloA;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const haloB = this.ctx.createRadialGradient(this.width * 0.78, this.height * 0.28, 10, this.width * 0.78, this.height * 0.28, this.width * 0.28);
        haloB.addColorStop(0, 'rgba(184, 134, 255, 0.16)');
        haloB.addColorStop(1, 'rgba(184, 134, 255, 0)');
        this.ctx.fillStyle = haloB;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Parallax Stars (Procedural)
        for(let i=0; i<28; i++) {
            const y = (this.score * 2 + i * 92) % this.height;
            const x = (i * 137 + (i % 2) * 53) % this.width;
            const s = (i % 3) + 1;
            this.ctx.globalAlpha = 0.3 + Math.sin(Date.now()/500 + i) * 0.2;
            this.ctx.fillStyle = i % 4 === 0 ? '#ffd76a' : '#d7f8ff';
            this.ctx.beginPath();
            this.ctx.arc(x, y, s, 0, Math.PI*2);
            this.ctx.fill();
        }
        this.ctx.globalAlpha = 1.0;

        // Relay beams
        this.platforms.forEach((p, index) => {
            const beamAlpha = Math.max(0, 0.12 - index * 0.004);
            if (beamAlpha <= 0) return;
            const beamGradient = this.ctx.createLinearGradient(p.x + p.w / 2, p.y, p.x + p.w / 2, this.height);
            beamGradient.addColorStop(0, `rgba(116, 248, 255, ${beamAlpha})`);
            beamGradient.addColorStop(1, 'rgba(116, 248, 255, 0)');
            this.ctx.strokeStyle = beamGradient;
            this.ctx.lineWidth = 1.5;
            this.ctx.beginPath();
            this.ctx.moveTo(p.x + p.w / 2, p.y + 2);
            this.ctx.lineTo(p.x + p.w / 2, Math.min(this.height, p.y + 140));
            this.ctx.stroke();
        });

        // Platforms
        this.platforms.forEach(p => {
            const fill = this.ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
            fill.addColorStop(0, 'rgba(142, 242, 255, 0.42)');
            fill.addColorStop(0.55, 'rgba(65, 137, 221, 0.34)');
            fill.addColorStop(1, 'rgba(12, 27, 67, 0.95)');
            this.ctx.fillStyle = fill;
            this.ctx.strokeStyle = 'rgba(207, 247, 255, 0.45)';
            this.ctx.lineWidth = 1.2;

            const r = 8;
            this.ctx.beginPath();
            this.ctx.roundRect(p.x, p.y, p.w, p.h, r);
            this.ctx.fill();
            this.ctx.stroke();

            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            this.ctx.fillRect(p.x + 8, p.y + 3, p.w - 16, 2);

            this.ctx.fillStyle = 'rgba(52, 216, 255, 0.85)';
            this.ctx.fillRect(p.x + 4, p.y + 1, p.w - 8, 2);

            this.ctx.globalAlpha = 0.28;
            this.ctx.fillStyle = '#74f8ff';
            this.ctx.beginPath();
            this.ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.h * 0.9, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1.0;
        });

        // Player
        if (this.assets.hero) {
            this.ctx.save();
            this.ctx.translate(this.player.x + this.player.w/2, this.player.y + this.player.h/2);
            if (!this.player.facingRight) this.ctx.scale(-1, 1);

            const stretch = 1 + Math.abs(this.player.vy) / 2000;
            const squash = 1 / stretch;
            this.ctx.scale(squash, stretch);

            const aura = this.ctx.createRadialGradient(0, 0, 4, 0, 0, this.player.w * 0.9);
            aura.addColorStop(0, 'rgba(255,255,255,0.7)');
            aura.addColorStop(0.3, 'rgba(116,248,255,0.45)');
            aura.addColorStop(1, 'rgba(116,248,255,0)');
            this.ctx.fillStyle = aura;
            this.ctx.beginPath();
            this.ctx.arc(0, 4, this.player.w * 0.82, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.globalAlpha = 0.95;
            this.ctx.drawImage(this.assets.hero, -this.player.w/2, -this.player.h/2, this.player.w, this.player.h);
            this.ctx.globalAlpha = 1.0;

            this.ctx.strokeStyle = 'rgba(255,255,255,0.32)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, this.player.w * 0.42, -0.8, 0.8);
            this.ctx.stroke();

            this.ctx.restore();
        } else {
            this.ctx.fillStyle = '#f472b6';
            this.ctx.fillRect(this.player.x, this.player.y, this.player.w, this.player.h);
        }

        // Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1.0;

        this.ctx.restore();
    },

    loop(t) {
        const dt = Math.min((t - this.lastTime) / 1000, 0.1); // Cap dt
        this.lastTime = t;

        try {
            this.update(dt);
            this.draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(time => this.loop(time));
    }
};

// Boot
document.addEventListener('DOMContentLoaded', () => {
    GAME.init();
});
