<script>

let seed=1889;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}

const Sfx={ctx:null,unlocked:false,sounds:{},bgm:null,bgmFailed:false,useSynthOnly:['127.0.0.1','localhost'].includes(location.hostname),lastPlayed:{},init(){if(this.unlocked){this.startLoop();return}const AC=window.AudioContext||window.webkitAudioContext;if(AC){try{this.ctx=new AC()}catch(e){this.ctx=null}}if(!this.useSynthOnly){Object.entries(AUDIO_MAP).forEach(([k,u])=>{const a=new Audio(u);a.preload=k==='bgm'?'auto':'none';a.crossOrigin='anonymous';a.addEventListener('error',()=>{if(k==='bgm'){this.bgmFailed=true;this.bgm=null}else delete this.sounds[k]});if(k==='bgm'){a.loop=true;a.volume=.18;this.bgm=a}else{a.volume=k==='drag'?.16:.34;this.sounds[k]=a}})}this.unlocked=true;this.startLoop()},ensure(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},play(n,cool=0){if(!this.unlocked)return;const now=performance.now();if(cool&&this.lastPlayed[n]&&now-this.lastPlayed[n]<cool)return;this.lastPlayed[n]=now;const b=this.sounds[n];if(!b){this.synth(n);return}try{const clip=b.cloneNode();clip.volume=b.volume;clip.play().catch(()=>this.synth(n))}catch(e){this.synth(n)}},synth(n){if(!this.ctx)return;this.ensure();const p={start:['triangle',220,660,.07,.22],spawn:['square',180,380,.05,.08],drag:['sawtooth',160,120,.03,.05],collision:['sawtooth',150,55,.07,.13],milkCollision:['triangle',520,240,.05,.11],reset:['sine',190,80,.06,.18]}[n];if(!p)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=p[0];o.frequency.setValueAtTime(p[1],t);o.frequency.exponentialRampToValueAtTime(Math.max(40,p[2]),t+p[4]);g.gain.setValueAtTime(p[3],t);g.gain.exponentialRampToValueAtTime(.001,t+p[4]);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+p[4])},startLoop(){if(!this.bgm||this.bgmFailed)return;this.ensure();this.bgm.play().catch(()=>{this.bgmFailed=true;this.bgm=null})},stopLoop(){if(this.bgm){this.bgm.pause();this.bgm.currentTime=0}},playCrash(isOoze){this.play(isOoze?'milkCollision':'collision',140);if(!this.ctx)return;this.ensure();const t=this.ctx.currentTime,g=this.ctx.createGain(),len=this.ctx.sampleRate*(isOoze ? .22 : .18),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(rand()*2-1)*(1-i/len);const src=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter();src.buffer=buf;f.type=isOoze?'lowpass':'bandpass';f.frequency.value=isOoze?520:980;g.gain.setValueAtTime(isOoze ? .08 : .11,t);g.gain.exponentialRampToValueAtTime(.01,t+(isOoze ? .22 : .18));src.connect(f);f.connect(g);g.connect(this.ctx.destination);src.start();src.stop(t+(isOoze ? .22 : .18))},playSpawn(){this.play('spawn',90)},playDrag(){this.play('drag',70)},playStart(){this.play('start')},playReset(){this.play('reset')}};
const Feedback={comboEl:null,chaosEl:null,timers:{},init(){this.comboEl=document.getElementById('combo-badge');this.chaosEl=document.getElementById('chaos-badge')},flash(type,label){const el=type==='chaos'?this.chaosEl:this.comboEl;if(!el)return;const text=el.querySelector('span');if(text&&label)text.textContent=label;el.classList.remove('hidden');requestAnimationFrame(()=>el.classList.add('visible'));clearTimeout(this.timers[type]);this.timers[type]=setTimeout(()=>{el.classList.remove('visible');setTimeout(()=>el.classList.add('hidden'),220)},type==='chaos'?1400:950)}};
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let width=0,height=0,entities=[],particles=[],running=false,activeDrag=null,dragOffset={x:0,y:0},collisionBurstCount=0,time=0;

function roundRectPath(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function fillRoundRect(x,y,w,h,r,c){roundRectPath(x,y,w,h,r);ctx.fillStyle=c;ctx.fill()}function strokeRoundRect(x,y,w,h,r,c,l=2){roundRectPath(x,y,w,h,r);ctx.lineWidth=l;ctx.strokeStyle=c;ctx.stroke()}
function drawRaccoonSigil(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=.2;ctx.fillStyle=THEME.ooze;ctx.beginPath();ctx.ellipse(0,0,34,24,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(-22,-5,44,10);ctx.restore()}function drawClaw(x,y,s,c){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=c;ctx.lineWidth=3;ctx.lineCap='round';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*7,12);ctx.quadraticCurveTo(i*10,-2,i*5,-15);ctx.stroke()}ctx.restore()}
function drawBackground(){time+=.016;const g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,'#121120');g.addColorStop(.55,'#070a0d');g.addColorStop(1,'#020303');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);ctx.fillStyle='#171521';const bh=54;for(let y=0;y<height;y+=bh){for(let x=((Math.floor(y/bh)%2)*-45);x<width+90;x+=90){ctx.fillStyle=(x/90+y/bh)%2?'#171622':'#211d2b';ctx.fillRect(x,y,88,bh-2);ctx.strokeStyle='rgba(137,255,56,.045)';ctx.strokeRect(x,y,88,bh-2)}}ctx.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<5;i++){let ax=(i+.5)*width/5+Math.sin(time+i)*12;ctx.beginPath();ctx.ellipse(ax,height*.55,70,220,0,Math.PI,Math.PI*2);ctx.fill()}const riverY=height*.76+Math.sin(time*1.7)*5;const rg=ctx.createLinearGradient(0,riverY-50,0,height);rg.addColorStop(0,'rgba(137,255,56,.08)');rg.addColorStop(.45,'rgba(30,230,110,.22)');rg.addColorStop(1,'rgba(4,10,8,.75)');ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(0,height);for(let x=0;x<=width;x+=30){ctx.lineTo(x,riverY+Math.sin(x*.02+time*2)*9)}ctx.lineTo(width,height);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(137,255,56,.28)';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=width;x+=20){const y=riverY+Math.sin(x*.025+time*2.2)*7;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.strokeStyle='rgba(137,255,56,.11)';ctx.lineWidth=1;const step=Math.max(58,Math.min(78,width/7));ctx.beginPath();for(let x=0;x<width;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,height)}for(let y=0;y<height;y+=step){ctx.moveTo(0,y);ctx.lineTo(width,y)}ctx.stroke();drawRaccoonSigil(width*.18,height*.2,1.1);drawRaccoonSigil(width*.82,height*.34,.9);drawClaw(46,42,.8,'rgba(255,65,65,.38)');drawClaw(width-46,height-42,.8,'rgba(137,255,56,.38)');ctx.font='22px Bangers';ctx.fillStyle='rgba(137,255,56,.16)';ctx.save();ctx.translate(width*.56,height*.17);ctx.rotate(-.12);ctx.fillText('SHELLS FEAR THE DARK',-90,0);ctx.restore()}
class Entity{constructor(x,y,typeKey){this.x=x;this.y=y;this.type=typeKey;this.def=ITEMS[typeKey];this.w=this.def.w;this.h=this.def.h;this.angle=rand()*.5-.25;this.vx=0;this.vy=0;this.isDragging=false}update(){if(this.isDragging)return;this.x+=this.vx;this.y+=this.vy;this.vx*=CONFIG.friction;this.vy*=CONFIG.friction;if(this.x<0){this.x=0;this.vx*=-CONFIG.bounce}if(this.x>width){this.x=width;this.vx*=-CONFIG.bounce}if(this.y<0){this.y=0;this.vy*=-CONFIG.bounce}if(this.y>height){this.y=height;this.vy*=-CONFIG.bounce}}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.shadowColor=this.isDragging?'rgba(137,255,56,.65)':'rgba(139,77,255,.24)';ctx.shadowBlur=this.isDragging?18:10;ctx.fillStyle='rgba(0,0,0,.38)';if(this.def.shape==='circle'){ctx.beginPath();ctx.ellipse(4,7,this.w/2,this.h/2,0,0,Math.PI*2);ctx.fill()}else fillRoundRect(-this.w/2+4,-this.h/2+6,this.w,this.h,8,'rgba(0,0,0,.35)');if(this.type==='MASK'){fillRoundRect(-25,-16,50,32,14,'#8b4dff');ctx.fillStyle='#14101d';ctx.beginPath();ctx.ellipse(-12,-2,9,6,0,0,Math.PI*2);ctx.ellipse(12,-2,9,6,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=THEME.ooze;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(28,0);ctx.stroke()}else if(this.type==='VIAL'){fillRoundRect(-10,-25,20,50,7,'rgba(137,255,56,.75)');strokeRoundRect(-12,-28,24,56,8,'#d9ffd0',2);ctx.fillStyle='#4b306b';ctx.fillRect(-9,-31,18,8);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(-5,-18,4,24)}else if(this.type==='LID'){ctx.fillStyle='#59656b';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#252a2d';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle=THEME.ooze;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.stroke();ctx.font='12px VT323';ctx.textAlign='center';ctx.fillStyle='#15181a';ctx.fillText('SEWER',0,4)}else if(this.type==='BATON'){fillRoundRect(-8,-36,16,72,6,'#6f4b2f');ctx.strokeStyle='#d9c091';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(0,30);ctx.stroke();drawClaw(0,-26,.42,THEME.red)}else if(this.type==='PIZZA'){ctx.fillStyle=THEME.gold;ctx.beginPath();ctx.moveTo(0,25);ctx.lineTo(-26,-17);ctx.lineTo(26,-17);ctx.closePath();ctx.fill();ctx.fillStyle='#b5412d';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*10,-4+Math.abs(i)*8,4,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#64330c';ctx.lineWidth=3;ctx.stroke()}else if(this.type==='FAN'){ctx.fillStyle='#c7d1d7';ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#343940';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#171b20';for(let i=0;i<4;i++){ctx.save();ctx.rotate(i*Math.PI/2+time);ctx.beginPath();ctx.ellipse(9,0,11,5,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.fillStyle=THEME.red;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;if(this.isDragging){ctx.strokeStyle='rgba(137,255,56,.8)';ctx.lineWidth=2;if(this.def.shape==='circle'){ctx.beginPath();ctx.arc(0,0,this.w/2+5,0,Math.PI*2);ctx.stroke()}else strokeRoundRect(-this.w/2-4,-this.h/2-4,this.w+8,this.h+8,11,'rgba(137,255,56,.8)',2)}ctx.restore()}getBounds(){return{x:this.x,y:this.y,r:Math.max(this.w,this.h)/2}}}
class Particle{constructor(x,y,type){this.x=x;this.y=y;this.life=1;this.type=type;const speed=rand()*5+2,ang=rand()*Math.PI*2;this.vx=Math.cos(ang)*speed;this.vy=Math.sin(ang)*speed;if(type==='MILK'){this.size=rand()*6+2;this.color=rand()>.35?THEME.ooze:'#d9ffd0';this.drag=.96}else{this.size=rand()*8+4;this.color=rand()>.5?THEME.mask:THEME.red;this.drag=.9}}update(){this.x+=this.vx;this.y+=this.vy;this.vx*=this.drag;this.vy*=this.drag;this.life-=.02;this.size*=.95}draw(){ctx.globalAlpha=Math.max(0,this.life);ctx.shadowColor=this.type==='MILK'?'rgba(137,255,56,.65)':'rgba(255,65,65,.55)';ctx.shadowBlur=10;fillRoundRect(this.x,this.y,this.size,this.size,2,this.color);ctx.globalAlpha=1;ctx.shadowBlur=0}}
function spawnItem(){const key=ITEM_KEYS[Math.floor(rand()*ITEM_KEYS.length)],pad=CONFIG.spawnPadding,x=pad+rand()*(width-pad*2),y=pad+rand()*(height-pad*2);entities.push(new Entity(x,y,key));Sfx.playSpawn();updateUI()}function explode(entity){const isOoze=entity.type==='VIAL';const count=isOoze?40:15;for(let i=0;i<count;i++)particles.push(new Particle(entity.x,entity.y,isOoze?'MILK':'FIRE'));Sfx.playCrash(isOoze);collisionBurstCount++}function checkCollisions(){const rem=new Set();for(let i=0;i<entities.length;i++){for(let j=i+1;j<entities.length;j++){const a=entities[i],b=entities[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.sqrt(dx*dx+dy*dy),minDist=(Math.min(a.w,a.h)+Math.min(b.w,b.h))/1.5;if(dist<minDist){rem.add(i);rem.add(j)}}}if(rem.size>0){collisionBurstCount=0;Array.from(rem).sort((a,b)=>b-a).forEach(idx=>{const ent=entities[idx];explode(ent);if(ent===activeDrag)activeDrag=null;entities.splice(idx,1)});if(collisionBurstCount>=2)Feedback.flash('combo',collisionBurstCount>=4?'MUTANT SPLASH x'+collisionBurstCount:'OOZE CLASH x'+collisionBurstCount);updateUI()}}function updateUI(){document.getElementById('score-display').innerText=`STASH: ${entities.length}`}
function loop(){if(!running)return;drawBackground();entities.forEach(e=>e.update());checkCollisions();entities.sort((a,b)=>a.y-b.y);entities.forEach(e=>e.draw());for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw();if(particles[i].life<=0)particles.splice(i,1)}requestAnimationFrame(loop)}function getPos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}}function onStart(e){if(!running)return;const p=getPos(e);for(let i=entities.length-1;i>=0;i--){const ent=entities[i],dx=p.x-ent.x,dy=p.y-ent.y;if(Math.abs(dx)<ent.w&&Math.abs(dy)<ent.h){activeDrag=ent;ent.isDragging=true;dragOffset.x=dx;dragOffset.y=dy;entities.splice(i,1);entities.push(ent);Sfx.playDrag();break}}}function onMove(e){if(!activeDrag)return;const p=getPos(e),nx=p.x-dragOffset.x,ny=p.y-dragOffset.y;activeDrag.vx=(nx-activeDrag.x)*.2;activeDrag.vy=(ny-activeDrag.y)*.2;activeDrag.x=nx;activeDrag.y=ny}function onEnd(){if(activeDrag){activeDrag.isDragging=false;activeDrag=null}}
canvas.addEventListener('mousedown',onStart);window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onEnd);canvas.style.touchAction='none';canvas.addEventListener('touchstart',e=>{e.preventDefault();onStart(e)},{passive:false});window.addEventListener('touchmove',e=>{if(!activeDrag)return;e.preventDefault();onMove(e)},{passive:false});window.addEventListener('touchend',onEnd);window.addEventListener('touchcancel',onEnd);Feedback.init();
function bootGame(){if(running)return;Sfx.init();Sfx.playStart();document.getElementById('start-screen').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('score-display').classList.remove('hidden');running=true;for(let i=0;i<3;i++)spawnItem();loop()}document.getElementById('start-btn').addEventListener('click',bootGame);document.getElementById('spawn-btn').addEventListener('click',()=>{spawnItem();if(entities.length>=8)Feedback.flash('combo','STASH OVERFLOW')});document.getElementById('reset-btn').addEventListener('click',()=>{if(!entities.length){Feedback.flash('chaos','TUNNEL ALREADY EMPTY');Sfx.playReset();return}Feedback.flash('chaos','TUNNEL FLUSHED');Sfx.playReset();entities.forEach(e=>explode(e));entities=[];updateUI()});document.addEventListener('visibilitychange',()=>{if(document.hidden)Sfx.stopLoop();else if(running)Sfx.startLoop()});
</script>
