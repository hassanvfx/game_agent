<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Escape Run</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-night: #170d2f;
            --bg-haze: #2e1b58;
            --track-glow: #65f6ff;
            --track-gold: #ffd84f;
            --panel-coral: #ff6a6a;
            --panel-purple: #281347;
            --cloud: rgba(255, 255, 255, 0.16);
            --ink: #12081f;
            --text-main: #f8f5ff;
            --danger: #ff4f7d;
            --hero-highlight: #ffe88a;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #432089 0%, transparent 45%),
                linear-gradient(180deg, var(--bg-haze) 0%, var(--bg-night) 68%, #090312 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .memphis-border {
            border: 3px solid rgba(255, 255, 255, 0.88);
            box-shadow:
                0 0 0 2px rgba(16, 8, 31, 0.9),
                0 0 24px rgba(101, 246, 255, 0.18);
        }

        .text-outline {
            text-shadow:
                0 2px 0 rgba(11, 5, 21, 0.9),
                0 0 16px rgba(101, 246, 255, 0.4),
                0 0 24px rgba(255, 216, 79, 0.2);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.85rem;
            pointer-events: none;
        }

        #hud {
            display: flex;
            justify-content: center;
            margin-top: 1.1rem;
        }

        #score-display {
            color: var(--text-main);
            font-size: clamp(2.15rem, 7vw, 3.4rem);
            line-height: 1;
            letter-spacing: 0.12em;
            transition: transform 100ms ease;
            padding: 0.55rem 1rem 0.45rem;
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06)),
                linear-gradient(135deg, rgba(101, 246, 255, 0.2), rgba(255, 106, 106, 0.22));
            border: 2px solid rgba(255, 255, 255, 0.72);
            box-shadow:
                0 0 0 2px rgba(18, 8, 31, 0.9),
                0 0 20px rgba(101, 246, 255, 0.28);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 600;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
        }

        .reaction-gif {
            position: absolute;
            width: min(30vw, 8.5rem);
            max-width: 136px;
            opacity: 0;
            transform: translateY(12px) scale(0.88);
            transition: opacity 180ms ease, transform 180ms ease;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.4));
            border-radius: 1rem;
        }

        .reaction-gif.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #jump-gif {
            left: 0.8rem;
            bottom: 5.2rem;
        }

        #impact-gif {
            right: 0.8rem;
            top: 5.4rem;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            pointer-events: auto;
        }

        #game-over-screen.hidden,
        #hud.hidden {
            display: none;
        }

        #game-over-panel {
            background:
                radial-gradient(circle at top, rgba(255, 216, 79, 0.24), transparent 34%),
                linear-gradient(180deg, rgba(56, 30, 93, 0.96), rgba(24, 10, 44, 0.98));
            padding: 1.65rem;
            border-radius: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.95);
            transition: transform 180ms ease;
            text-align: center;
            max-width: min(90vw, 28rem);
            gap: 0.2rem;
        }

        #game-over-panel.scale-100 {
            transform: scale(1);
        }

        #game-over-title {
            margin: 0 0 0.4rem;
            color: var(--text-main);
            font-family: 'Bangers', system-ui, sans-serif;
            font-size: clamp(2.2rem, 9vw, 3.35rem);
            line-height: 0.95;
            letter-spacing: 0.08em;
        }

        #game-over-copy {
            margin: 0 0 1.15rem;
            color: rgba(248, 245, 255, 0.96);
            font-size: clamp(0.95rem, 4vw, 1.25rem);
            line-height: 1.35;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 600;
        }

        button {
            pointer-events: auto;
            border: none;
            cursor: pointer;
            font-family: 'Bangers', system-ui, sans-serif;
            touch-action: manipulation;
            min-height: 44px;
        }

        button:focus-visible {
            outline: 3px solid rgba(101, 246, 255, 0.92);
            outline-offset: 3px;
        }

        #restart-btn {
            background: linear-gradient(180deg, var(--track-gold), #ff8e53);
            color: #261238;
            font-size: clamp(1.15rem, 5vw, 1.7rem);
            letter-spacing: 0.08em;
            padding: 0.75rem 1.7rem;
            border-radius: 999px;
            transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        }

        #restart-btn:hover {
            filter: brightness(1.05);
        }

        #restart-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow:
                0 0 0 2px rgba(18, 8, 31, 0.9),
                0 0 12px rgba(255, 216, 79, 0.3);
        }

        @media (max-width: 480px) {
            #ui-layer {
                padding: 0.65rem;
            }

            #hud {
                margin-top: 0.8rem;
            }

            #jump-gif {
                left: 0.45rem;
                bottom: 4.6rem;
            }

            #impact-gif {
                right: 0.45rem;
                top: 4.9rem;
            }

            #game-over-panel {
                padding: 1.3rem 1rem;
                width: min(92vw, 28rem);
            }

            #restart-btn {
                width: 100%;
            }
        }

        @media (max-height: 520px) {
            #hud {
                margin-top: 0.45rem;
            }

            #game-over-panel {
                gap: 0.1rem;
                padding: 1rem;
            }

            #game-over-copy {
                margin-bottom: 0.8rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 5, "min": 1, "max": 12 },
        "gravity": { "type": "number", "label": "Gravity", "value": 1800, "min": 500, "max": 3000 },
        "jumpForce": { "type": "number", "label": "Jump Force", "value": 600, "min": 200, "max": 1000 },
        "pipeSpeed": { "type": "number", "label": "Pipe Speed", "value": 250, "min": 100, "max": 600 },
        "gapSize": { "type": "number", "label": "Gap Size", "value": 200, "min": 100, "max": 400 }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="feedback-layer" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: jump-feedback + hit-feedback -> catalogs/gifs.json -->
            <img id="jump-gif" class="reaction-gif" src="https://i.giphy.com/JC5lKmUsUNwcw.webp" alt="" loading="lazy" decoding="async" hidden>
            <img id="impact-gif" class="reaction-gif" src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp" alt="" loading="lazy" decoding="async" hidden>
        </div>
        <div id="ui-layer">
            <div id="hud">
                <span id="score-display" class="text-outline" aria-label="Escapes">0</span>
            </div>
            <div id="game-over-screen" class="hidden">
                <div id="game-over-panel" class="memphis-border">
                    <h2 id="game-over-title" class="text-outline">CAUGHT!</h2>
                    <p id="game-over-copy" class="text-outline">Escapes: <span id="final-score">0</span></p>
                    <button id="restart-btn" class="memphis-border">
                        RUN AGAIN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Assets -->
    <img id="asset_player" data-editable="image" data-label="Player Sprite" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" crossorigin="anonymous" hidden>
    <img id="asset_bg" data-editable="image" data-label="Game Over BG" src="https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png" crossorigin="anonymous" hidden>

    <!-- [agent-note][stage3] resolved-font: display=Bangers | ui=Rajdhani -> catalogs/fonts.json -->
    <!-- [agent-note][stage3] resolved-audio: jump/score/restart/defeat/loop -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_jump" data-editable="audio" data-label="Jump SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
    <audio id="sfx_score" data-editable="audio" data-label="Score SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
    <audio id="sfx_restart" data-editable="audio" data-label="Restart UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_defeat" data-editable="audio" data-label="Defeat SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>

    <script>
        // --- Configuration & State ---
        let gameConfig = {};
        let cw = 0, ch = 0, dpr = 1;
        let canvas, ctx, ro;
        let initialized = false;
        let gameState = 'PLAYING'; // PLAYING, GAMEOVER
        let lastTime = 0;
        
        // Entities
        let player = { x: 0, y: 0, vy: 0, r: 25, angle: 0 };
        let pipes = [];
        let score = 0;
        let pipeTimer = 0;
        let screenShake = 0;
        let particles = [];

        // Media feedback
        let gifTimeouts = {};
        let lastJumpAt = 0;
        let lastScoreAt = 0;
        let lastDefeatAt = 0;

        // Audio System
        const AudioSys = {
            unlocked: false,
            bgmStarted: false,
            volumes: {
                bgm_main: 0.22,
                sfx_jump: 0.36,
                sfx_score: 0.34,
                sfx_restart: 0.35,
                sfx_defeat: 0.42
            },
            applyMix() {
                Object.entries(this.volumes).forEach(([id, volume]) => {
                    const audio = document.getElementById(id);
                    if (audio) audio.volume = volume;
                });
            },
            init() {
                this.applyMix();
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.stopBgm();
                    } else if (this.unlocked && gameState === 'PLAYING') {
                        this.startBgm();
                    }
                });
            },
            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.applyMix();
                this.startBgm();
            },
            play(id) {
                const el = document.getElementById(id);
                if (!el || !this.unlocked) return;
                try {
                    el.pause();
                    el.currentTime = 0;
                    el.play().catch(() => {});
                } catch (e) {}
            },
            startBgm() {
                const bgm = document.getElementById('bgm_main');
                if (!bgm || !this.unlocked || gameState !== 'PLAYING') return;
                if (!this.bgmStarted) {
                    bgm.currentTime = 0;
                    this.bgmStarted = true;
                }
                bgm.play().catch(() => {});
            },
            stopBgm() {
                const bgm = document.getElementById('bgm_main');
                if (bgm) bgm.pause();
            },
            resetBgm() {
                const bgm = document.getElementById('bgm_main');
                this.bgmStarted = false;
                if (bgm) {
                    bgm.pause();
                    bgm.currentTime = 0;
                }
            }
        };

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
        }

        function pulseGif(id, duration = 650) {
            const gif = document.getElementById(id);
            if (!gif) return;
            gif.hidden = false;
            gif.classList.add('active');
            clearTimeout(gifTimeouts[id]);
            gifTimeouts[id] = window.setTimeout(() => {
                gif.classList.remove('active');
            }, duration);
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // Parse Config
            const configScript = document.getElementById('game-config');
            if (configScript) {
                try {
                    const defs = JSON.parse(configScript.textContent);
                    for (let k in defs) gameConfig[k] = defs[k].value;
                } catch(e) {}
            }
            
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d', { alpha: false });
            AudioSys.init();

            ro = new ResizeObserver(entries => {
                const rect = entries[0].contentRect;
                resize(rect.width, rect.height);
            });
            ro.observe(canvas);

            // [agent-note][stage4] repaired: mobile-actionability | element: #restart-btn | action: keep taps native while pointer gameplay input stays canvas-safe
            // Input binding
            const handleGlobalInput = (e) => {
                if (e.type !== 'pointermove') AudioSys.unlock();
                if (e.type === 'pointerdown' || e.type === 'click') {
                    if (e.target.id === 'restart-btn') {
                        AudioSys.play('sfx_restart');
                        restartGame();
                        return;
                    }
                    if (gameState === 'GAMEOVER') return;
                    
                    if (gameState === 'PLAYING') {
                        if (e.cancelable) e.preventDefault();
                        player.vy = -gameConfig.jumpForce;
                        const now = performance.now();
                        if (now - lastJumpAt > 120) {
                            AudioSys.play('sfx_jump');
                            pulseGif('jump-gif', 540);
                            lastJumpAt = now;
                        }
                        createParticles(player.x, player.y, 5, '#FFFFFF');
                    }
                }
            };

            window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
            document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);
        });

        function resize(w, h) {
            cw = w; ch = h;
            dpr = window.devicePixelRatio || 1;
            canvas.width = cw * dpr;
            canvas.height = ch * dpr;
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            if (!initialized) {
                initGame();
                initialized = true;
                requestAnimationFrame(gameLoop);
            } else {
                // Clamp player
                if (player.y > ch) player.y = ch - player.r;
            }
        }

        function initGame() {
            player.x = cw * 0.3;
            player.y = ch * 0.5;
            player.vy = 0;
            player.angle = 0;
            pipes = [];
            particles = [];
            score = 0;
            pipeTimer = 0;
            screenShake = 0;
            updateScoreDisplay();
            setState('PLAYING');
            
            AudioSys.resetBgm();
            if (AudioSys.unlocked) {
                AudioSys.startBgm();
            }

            const sfxDefeat = document.getElementById('sfx_defeat');
            if (sfxDefeat) sfxDefeat.pause();
            document.getElementById('jump-gif')?.classList.remove('active');
            document.getElementById('impact-gif')?.classList.remove('active');
        }

        function restartGame() {
            initGame();
        }

        function setState(state) {
            gameState = state;
            const goScreen = document.getElementById('game-over-screen');
            const hud = document.getElementById('hud');
            
            if (state === 'PLAYING') {
                goScreen.classList.add('hidden');
                hud.classList.remove('hidden');
            } else if (state === 'GAMEOVER') {
                goScreen.classList.remove('hidden');
                hud.classList.add('hidden');
                document.getElementById('final-score').innerText = score;
                document.getElementById('game-over-panel').classList.remove('scale-95');
                document.getElementById('game-over-panel').classList.add('scale-100');
            }
        }

        function updateScoreDisplay() {
            const el = document.getElementById('score-display');
            if (el) {
                el.innerText = score;
                el.style.transform = 'scale(1.5)';
                setTimeout(() => el.style.transform = 'scale(1)', 100);
            }
        }

        function createParticles(x, y, count, color) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 200,
                    vy: (Math.random() - 0.5) * 200,
                    life: 1,
                    color: color
                });
            }
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.05) dt = 0.05; // cap dt

            try {
                update(dt);
                draw();
            } catch (e) {
                console.error("Loop error:", e);
            }
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            // Player physics
            player.vy += gameConfig.gravity * dt;
            player.y += player.vy * dt;
            
            // Tilt based on velocity
            player.angle = Math.min(Math.max(player.vy / 1000, -0.5), 0.5);

            if (!isFinite(player.y)) player.y = ch/2;

            // Pipe spawning
            pipeTimer += dt;
            const spawnRate = 1.5; // seconds
            if (pipeTimer > spawnRate) {
                pipeTimer = 0;
                const gap = gameConfig.gapSize;
                const minHeight = 50;
                const maxPos = ch - minHeight - gap;
                const gapY = minHeight + Math.random() * (maxPos - minHeight);
                
                pipes.push({
                    x: cw,
                    width: 80,
                    gapY: gapY,
                    gapSize: gap,
                    passed: false
                });
            }

            // Pipe movement & collision
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= gameConfig.pipeSpeed * dt;

                // Collision Box
                const hitX = player.x + player.r > p.x && player.x - player.r < p.x + p.width;
                const hitTop = player.y - player.r < p.gapY;
                const hitBot = player.y + player.r > p.gapY + p.gapSize;

                if (hitX && (hitTop || hitBot)) {
                    die();
                }

                // Scoring
                if (!p.passed && p.x + p.width < player.x) {
                    p.passed = true;
                    score++;
                    updateScoreDisplay();
                    const now = performance.now();
                    if (now - lastScoreAt > 120) {
                        AudioSys.play('sfx_score');
                        pulseGif('jump-gif', 420);
                        lastScoreAt = now;
                    }
                    vibrate('light');
                }

                if (p.x + p.width < 0) {
                    pipes.splice(i, 1);
                }
            }

            // Floor / Ceiling collision
            if (player.y + player.r > ch || player.y - player.r < 0) {
                die();
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx * dt;
                pt.y += pt.vy * dt;
                pt.life -= dt * 2;
                if (pt.life <= 0) particles.splice(i, 1);
            }
            
            if (screenShake > 0) screenShake -= dt * 10;
        }

        function die() {
            if (gameState === 'GAMEOVER') return;
            setState('GAMEOVER');
            vibrate('heavy');
            screenShake = 0.5;
            AudioSys.stopBgm();
            const now = performance.now();
            if (now - lastDefeatAt > 250) {
                AudioSys.play('sfx_defeat');
                pulseGif('impact-gif', 1200);
                lastDefeatAt = now;
            }
            createParticles(player.x, player.y, 20, '#FF0000');
        }

        function drawHand(x, y, w, h, isTop) {
            if (h <= 0) return;

            const palmGradient = ctx.createLinearGradient(x, y, x + w, y + h);
            palmGradient.addColorStop(0, isTop ? '#ff6a6a' : '#6f4dff');
            palmGradient.addColorStop(1, isTop ? '#ff9a5a' : '#56d8ff');

            ctx.save();
            ctx.fillStyle = palmGradient;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.82)';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.roundRect(x + 6, y, w - 12, h);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(x + 14, y + (isTop ? h * 0.12 : 10), 10, Math.max(16, h * 0.25));

            const fingerBaseY = isTop ? y + h - 16 : y;
            const fingerDir = isTop ? -1 : 1;
            const fingerWidth = Math.max(12, w / 4.5);

            for (let i = 0; i < 4; i++) {
                const fx = x - 4 + i * (fingerWidth + 6);
                const fingerHeight = 18 + (i % 2) * 8;

                ctx.beginPath();
                ctx.roundRect(fx, fingerBaseY, fingerWidth, fingerHeight * fingerDir, 10);
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(18, 8, 31, 0.34)';
            ctx.beginPath();
            ctx.arc(x + w * 0.5, isTop ? y + h * 0.28 : y + h * 0.72, Math.min(16, w * 0.16), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.save();
            
            // Screen shake
            if (screenShake > 0) {
                const mag = screenShake * 20;
                ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
            }

            // Background
            if (gameState === 'GAMEOVER') {
                const bgImg = document.getElementById('asset_bg');
                if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
                    const scale = Math.max(cw / bgImg.naturalWidth, ch / bgImg.naturalHeight);
                    const iw = bgImg.naturalWidth * scale;
                    const ih = bgImg.naturalHeight * scale;
                    const ix = (cw - iw) / 2;
                    const iy = (ch - ih) / 2;
                    ctx.drawImage(bgImg, ix, iy, iw, ih);
                    ctx.fillStyle = 'rgba(12, 5, 24, 0.64)';
                    ctx.fillRect(0, 0, cw, ch);
                } else {
                    const lostGradient = ctx.createLinearGradient(0, 0, 0, ch);
                    lostGradient.addColorStop(0, '#2e1b58');
                    lostGradient.addColorStop(1, '#090312');
                    ctx.fillStyle = lostGradient;
                    ctx.fillRect(0, 0, cw, ch);
                }
            } else {
                const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
                skyGradient.addColorStop(0, '#3f2188');
                skyGradient.addColorStop(0.58, '#1e0f46');
                skyGradient.addColorStop(1, '#090312');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, cw, ch);

                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                for (let i = 0; i < 6; i++) {
                    const cloudX = (cw * (0.17 + i * 0.15) + (i % 2) * 30) % (cw + 60);
                    const cloudY = 40 + (i % 3) * 48;
                    ctx.beginPath();
                    ctx.arc(cloudX, cloudY, 20, 0, Math.PI * 2);
                    ctx.arc(cloudX + 22, cloudY + 4, 16, 0, Math.PI * 2);
                    ctx.arc(cloudX - 18, cloudY + 6, 14, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = 'rgba(101, 246, 255, 0.14)';
                for (let i = 0; i < 18; i++) {
                    const stripeX = (i * (cw / 17)) % cw;
                    const stripeH = 24 + (i % 5) * 10;
                    ctx.fillRect(stripeX, ch - stripeH, Math.max(10, cw * 0.02), stripeH);
                }

                ctx.strokeStyle = 'rgba(255, 216, 79, 0.42)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 4; i++) {
                    const y = ch * (0.22 + i * 0.15);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(cw, y + 12);
                    ctx.stroke();
                }
            }

            // Draw Pipes (Hands)
            for (let p of pipes) {
                // Top hand
                drawHand(p.x, 0, p.width, p.gapY, true);
                // Bottom hand
                drawHand(p.x, p.gapY + p.gapSize, p.width, ch - (p.gapY + p.gapSize), false);
            }

            // Draw Particles
            for (let pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 5 * pt.life, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // Draw Player
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            const pImg = document.getElementById('asset_player');
            ctx.save();

            const heroGlow = ctx.createRadialGradient(0, 0, player.r * 0.2, 0, 0, player.r * 1.7);
            heroGlow.addColorStop(0, 'rgba(255, 232, 138, 0.5)');
            heroGlow.addColorStop(1, 'rgba(255, 232, 138, 0)');
            ctx.fillStyle = heroGlow;
            ctx.beginPath();
            ctx.arc(0, 0, player.r * 1.7, 0, Math.PI * 2);
            ctx.fill();

            if (pImg && pImg.complete && pImg.naturalWidth > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, player.r, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(pImg, -player.r, -player.r, player.r * 2, player.r * 2);
                ctx.restore();
            } else {
                const heroGradient = ctx.createLinearGradient(-player.r, -player.r, player.r, player.r);
                heroGradient.addColorStop(0, '#ffe88a');
                heroGradient.addColorStop(1, '#ff7b7b');
                ctx.fillStyle = heroGradient;
                ctx.beginPath();
                ctx.arc(0, 0, player.r, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, player.r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(18, 8, 31, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, player.r + 3.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#fff6da';
            ctx.beginPath();
            ctx.arc(-player.r * 0.22, -player.r * 0.18, player.r * 0.18, 0, Math.PI * 2);
            ctx.arc(player.r * 0.15, -player.r * 0.14, player.r * 0.16, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#241238';
            ctx.beginPath();
            ctx.arc(-player.r * 0.22, -player.r * 0.18, player.r * 0.07, 0, Math.PI * 2);
            ctx.arc(player.r * 0.15, -player.r * 0.14, player.r * 0.07, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#241238';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-player.r * 0.22, player.r * 0.15);
            ctx.quadraticCurveTo(0, player.r * 0.32, player.r * 0.22, player.r * 0.08);
            ctx.stroke();

            ctx.restore();

            ctx.restore();
        }
    </script>
</body>
</html>
