<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Signal Relay</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #070816;
        --bg-bottom: #02030c;
        --panel: rgba(15, 21, 48, 0.68);
        --panel-border: rgba(122, 244, 255, 0.26);
        --text-main: #ecf7ff;
        --text-soft: rgba(236, 247, 255, 0.84);
        --cyan: #62f1ff;
        --magenta: #ff4fb5;
        --gold: #ffe76a;
        --lime: #73ffb2;
        --danger: #ff5f91;
        --shadow: rgba(0, 0, 0, 0.38);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(98, 241, 255, 0.12), transparent 35%),
            radial-gradient(circle at 80% 12%, rgba(255, 79, 181, 0.12), transparent 28%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        font-family: 'Exo 2', system-ui, sans-serif;
        color: var(--text-main);
    }
    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    body::before {
        background:
            linear-gradient(90deg, transparent 24%, rgba(255,255,255,0.03) 25%, transparent 26%) 0 0 / 4.5rem 4.5rem,
            linear-gradient(transparent 24%, rgba(255,255,255,0.03) 25%, transparent 26%) 0 0 / 4.5rem 4.5rem;
        opacity: 0.4;
    }
    body::after {
        background:
            radial-gradient(circle at 20% 15%, rgba(98, 241, 255, 0.22), transparent 0.35rem),
            radial-gradient(circle at 75% 28%, rgba(255, 231, 106, 0.18), transparent 0.3rem),
            radial-gradient(circle at 64% 70%, rgba(255, 79, 181, 0.18), transparent 0.28rem);
        background-repeat: repeat;
        background-size: 12rem 12rem, 14rem 14rem, 16rem 16rem;
        animation: starDrift 18s linear infinite;
        opacity: 0.55;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; position: relative; z-index: 1; }
    #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
    .glass {
        background: linear-gradient(180deg, rgba(19, 26, 59, 0.78), rgba(8, 12, 30, 0.78));
        backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 10px 30px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 24%, transparent 72%, rgba(98, 241, 255, 0.08));
        opacity: 0.8;
    }
    .hidden { display: none !important; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { inset: 0; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .rounded-xl { border-radius: 1rem; }
    .text-center { text-align: center; }
    .text-white { color: #fff; }
    .text-black { color: #000; }
    .text-cyan-400 { color: var(--cyan); }
    .bg-white { background: linear-gradient(180deg, #ffffff, #c8f6ff); }
    .font-bold { font-weight: 700; }
    .hover\:bg-gray-200:hover { background: linear-gradient(180deg, #ffffff, #def8ff); }
    .p-8 { padding: 2rem; }
    .px-8 { padding-left: 2rem; padding-right: 2rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-3xl { font-size: 1.875rem; }
    .text-6xl { font-size: clamp(2.75rem, 8vw, 4.5rem); }
    #hud {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        padding: max(14px, env(safe-area-inset-top, 0px)) 14px 0;
        font-size: clamp(0.95rem, 2.8vw, 1.1rem);
        color: var(--text-main);
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }
    .hud-pill {
        min-width: 0;
        padding: 0.6rem 0.8rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.09);
        background: linear-gradient(180deg, rgba(13, 18, 43, 0.9), rgba(8, 10, 24, 0.78));
        box-shadow: 0 0 0 1px rgba(98, 241, 255, 0.12), 0 0 20px rgba(98, 241, 255, 0.12);
        text-shadow: 0 0 10px rgba(98, 241, 255, 0.35);
        white-space: nowrap;
        font-weight: 600;
    }
    #game-over-screen { display: flex; align-items: center; justify-content: center; background: rgba(3, 5, 15, 0.9); padding: 1rem; }
    #game-over-panel { max-width: min(92vw, 34rem); position: relative; }
    #title-banner {
        position: absolute;
        top: calc(max(3.9rem, env(safe-area-inset-top, 0px) + 3.5rem));
        left: 50%;
        transform: translateX(-50%);
        width: min(92vw, 34rem);
        padding: 0.9rem 1rem;
        color: var(--text-main);
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-radius: 1.1rem;
    }
    #title-banner h1,
    #game-over-panel h1 {
        margin: 0 0 0.35rem;
        font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
        font-size: clamp(1.35rem, 4.8vw, 2.35rem);
        color: #9ffbff;
        text-shadow: 0 0 18px rgba(98, 241, 255, 0.74), 0 0 28px rgba(255, 79, 181, 0.18);
        letter-spacing: 0.08em;
    }
    #title-banner p {
        margin: 0;
        font-size: clamp(0.82rem, 2.5vw, 1rem);
        line-height: 1.45;
        color: var(--text-soft);
    }
    .banner-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        margin-bottom: 0.35rem;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(98, 241, 255, 0.22), rgba(255, 79, 181, 0.06));
        box-shadow: 0 0 18px rgba(98, 241, 255, 0.28);
        font-size: 1rem;
    }
    .reaction-gif {
        position: absolute;
        right: 0.8rem;
        bottom: 1rem;
        width: clamp(4.8rem, 18vw, 7.2rem);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 20px rgba(98, 241, 255, 0.18);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transition: opacity 0.18s ease, transform 0.18s ease;
        pointer-events: none;
        z-index: 60;
        background: rgba(4, 8, 18, 0.82);
    }
    .reaction-gif.visible {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }
    .reaction-gif--success {
        top: calc(max(6.8rem, env(safe-area-inset-top, 0px) + 6rem));
        bottom: auto;
    }
    .reaction-gif--fail {
        bottom: max(1rem, env(safe-area-inset-bottom, 0px) + 0.6rem);
    }
    button {
        pointer-events: auto;
        font-family: 'Exo 2', system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        box-shadow: 0 0 0 1px rgba(98, 241, 255, 0.16), 0 0 18px rgba(98, 241, 255, 0.24);
        font-weight: 600;
    }
    button:active { transform: scale(0.95); filter: brightness(1.05); }
    #restart-btn { max-width: 100%; }
    @keyframes starDrift {
        from { transform: translateY(0); }
        to { transform: translateY(12rem); }
    }
    @media (max-width: 640px) {
        #hud { padding-left: 10px; padding-right: 10px; }
        .hud-pill { padding: 0.52rem 0.7rem; }
        #title-banner { top: calc(max(3.55rem, env(safe-area-inset-top, 0px) + 3.15rem)); padding: 0.8rem 0.85rem; }
        #game-over-panel { padding: 1.5rem 1rem; }
        .reaction-gif {
            width: clamp(4.1rem, 20vw, 5.4rem);
            right: 0.5rem;
        }
        .reaction-gif--success {
            top: calc(max(7.8rem, env(safe-area-inset-top, 0px) + 7rem));
        }
    }
</style>
</head>
<body>

<!-- Assets Declaration -->
<div id="assets" style="display: none;">
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop preload="none"></audio>
</div>

<div id="media-overlays" aria-hidden="true">
    <!-- [agent-note][stage3] resolved-gif: success/fail feedback -> catalogs/gifs.json -->
    <img id="gif-success" class="reaction-gif reaction-gif--success" alt="" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" decoding="async" loading="lazy">
    <img id="gif-fail" class="reaction-gif reaction-gif--fail" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" decoding="async" loading="lazy">
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "bpm": { "type": "number", "label": "BPM", "value": 130, "min": 60, "max": 200 },
    "noteSpeed": { "type": "number", "label": "Note Speed", "value": 8, "min": 4, "max": 15 },
    "laneColors": { "type": "text", "label": "Lane Colors (CSV)", "value": "#FF0055,#00FFFF,#FFFF00,#00FF55" }
}
</script>

<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="title-banner" class="glass">
            <div class="banner-icon" aria-hidden="true">📡</div>
            <h1>Neon Signal Relay</h1>
            <p>Tap the lane to catch each incoming pulse at the ring. Build your relay streak and keep the uplink clean.</p>
        </div>
        <div id="hud">
            <div id="score-display" class="hud-pill">SIGNAL: 0</div>
            <div id="combo-display" class="hud-pill">STREAK: 0</div>
        </div>
        <div id="game-over-screen" class="absolute inset-0 hidden">
            <div id="game-over-panel" class="glass p-8 rounded-xl text-center">
                <h1 class="text-6xl text-white mb-2" style="color: #FF0055; text-shadow: 0 0 20px #FF0055;">SIGNAL LOST</h1>
                <p id="final-score" class="text-3xl text-cyan-400 mb-8">FINAL SIGNAL: 0</p>
                <button id="restart-btn" class="px-8 py-3 bg-white text-black text-2xl font-bold hover:bg-gray-200">RECONNECT</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * Core Architecture & State
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const dpr = window.devicePixelRatio || 1;

// Config Parsing
let gameConfig = {};
const configEl = document.getElementById('game-config');
try {
    const raw = JSON.parse(configEl.textContent);
    for (let k in raw) gameConfig[k] = raw[k].value;
    gameConfig.colors = gameConfig.laneColors.split(',');
} catch (e) {
    console.error("Config Parse Error", e);
    gameConfig = { bpm: 130, noteSpeed: 8, colors: ["#FF0055","#00FFFF","#FFFF00","#00FF55"] };
}

// Global State
let cw = 0, ch = 0;
let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
let initialized = false;
let lastTime = 0;
let score = 0;
let combo = 0;
let health = 100;
let laneWidth = 0;
let targetY = 0;

// Entities
let notes = [];
let particles = [];
let popups = [];
let shake = 0;
let beatTimer = 0;

// Audio + Media
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const audioBuffers = {};
const sfxGainLevels = {
    hit: 0.42,
    perfect: 0.48,
    miss: 0.32,
    restart: 0.28,
    gameover: 0.35
};
const mediaEls = {
    success: document.getElementById('gif-success'),
    fail: document.getElementById('gif-fail')
};
let gifTimers = {};
let bgmStarted = false;
let bgmUnlocked = false;

/**
 * Audio Manager
 * [agent-note][stage3] resolved-audio: hit/perfect/miss/restart/gameover + bgm -> catalogs/audios.json
 */
async function initAudio() {
    if (!audioCtx) return;

    const loadBuffer = async (id, url) => {
        try {
            const res = await fetch(url);
            const arrayBuffer = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Failed to load audio ${id}`, e);
        }
    };

    await Promise.all([
        loadBuffer('hit', 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3'),
        loadBuffer('perfect', 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3'),
        loadBuffer('miss', 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3'),
        loadBuffer('restart', 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3'),
        loadBuffer('gameover', 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3')
    ]);

    const bgmEl = document.getElementById('bgm_main');
    if (bgmEl) {
        bgmEl.volume = 0.2;
    }
}

function unlockAudio() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    bgmUnlocked = true;
}

function playSfx(id, playbackRate = 1) {
    if (!audioCtx) return;
    unlockAudio();

    if (audioBuffers[id]) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        gain.gain.value = sfxGainLevels[id] ?? 0.35;
        source.buffer = audioBuffers[id];
        source.playbackRate.value = playbackRate;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
        return;
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (id === 'perfect') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.09);
    } else if (id === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(980, audioCtx.currentTime + 0.08);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(65, audioCtx.currentTime + 0.12);
    }
    gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
}

function playBgm() {
    const bgmEl = document.getElementById('bgm_main');
    if (!bgmEl || !bgmUnlocked || bgmStarted) return;
    bgmEl.play().then(() => {
        bgmStarted = true;
    }).catch(() => {});
}

function stopBgm(reset = true) {
    const bgmEl = document.getElementById('bgm_main');
    if (!bgmEl) return;
    bgmEl.pause();
    bgmStarted = false;
    if (reset) {
        bgmEl.currentTime = 0;
    }
}

function showReaction(type, duration = 900) {
    const el = mediaEls[type];
    if (!el) return;
    clearTimeout(gifTimers[type]);
    el.classList.add('visible');
    gifTimers[type] = setTimeout(() => {
        el.classList.remove('visible');
    }, duration);
}

function clearReactions() {
    Object.values(mediaEls).forEach((el) => el?.classList.remove('visible'));
    Object.keys(gifTimers).forEach((key) => clearTimeout(gifTimers[key]));
    gifTimers = {};
}

function vibrate(type) {
    if (!window.navigator.vibrate) return;
    const pattern = type === 'heavy' ? [50, 50, 50] : [15];
    window.navigator.vibrate(pattern);

    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate',
        requestId: 'h5-' + Date.now(),
        version: '1.0',
        params: { style: type }
    });
}

/**
 * Game Logic
 */
function initGame() {
    score = 0;
    combo = 0;
    health = 100;
    notes = [];
    particles = [];
    popups = [];
    shake = 0;
    beatTimer = 0;
    clearReactions();

    laneWidth = cw / 4;
    targetY = ch * 0.15;

    updateHUD();
    setState('PLAYING');
    playSfx('restart', 1);
    playBgm();
}

function spawnNote() {
    const lane = Math.floor(Math.random() * 4);
    const radius = laneWidth * 0.3;
    notes.push({
        lane: lane,
        x: (lane * laneWidth) + (laneWidth / 2),
        y: ch + radius,
        r: radius,
        color: gameConfig.colors[lane],
        active: true,
        missed: false
    });
}

function updateHUD() {
    document.getElementById('score-display').textContent = `SIGNAL: ${score}`;
    document.getElementById('combo-display').textContent = `STREAK: ${combo}`;
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');

    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').textContent = `FINAL SIGNAL: ${score}`;
        stopBgm();
        playSfx('gameover', 1);
        showReaction('fail', 1800);
        vibrate('heavy');
    }
}

function triggerExplosion(x, y, color) {
    for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function showPopup(text, x, y, color) {
    popups.push({
        text: text,
        x: x,
        y: y,
        life: 1.0,
        color: color
    });
}

function checkHit(laneIndex) {
    let bestNote = null;
    let minDist = Infinity;

    for (let note of notes) {
        if (note.lane === laneIndex && note.active && !note.missed) {
            const dist = Math.abs(note.y - targetY);
            if (dist < minDist) {
                minDist = dist;
                bestNote = note;
            }
        }
    }

    const hitWindow = laneWidth * 0.8;

    if (bestNote && minDist < hitWindow) {
        bestNote.active = false;

        let points = 100;
        let label = "LOCKED";
        let sfxId = 'hit';
        let gifDuration = 850;

        if (minDist < hitWindow * 0.3) {
            points = 300;
            label = "SYNCED";
            sfxId = 'perfect';
            shake = 5;
            gifDuration = 1200;
            triggerExplosion(bestNote.x, bestNote.y, bestNote.color);
        } else {
            triggerExplosion(bestNote.x, bestNote.y, "#ffffff");
        }

        score += points + (combo * 10);
        combo++;
        playSfx(sfxId, 1 + Math.min(combo, 8) * 0.015);
        vibrate('light');
        showPopup(label, bestNote.x, bestNote.y - 50, bestNote.color);
        if (combo >= 2 || sfxId === 'perfect') {
            showReaction('success', gifDuration);
        }
    } else {
        combo = 0;
        playSfx('miss', 1);
        showReaction('fail', 900);
    }
    updateHUD();
}

function endRun() {
    if (gameState !== 'PLAYING') return;
    setState('GAMEOVER');
}

/**
 * Loop
 */
function loop(timestamp) {
    if (!initialized) return;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (gameState === 'PLAYING') {
        beatTimer += dt;
        const beatInterval = 60 / gameConfig.bpm;
        if (beatTimer >= beatInterval) {
            spawnNote();
            beatTimer -= beatInterval;
        }

        const speed = gameConfig.noteSpeed * (ch / 1000) * 60;

        for (let note of notes) {
            if (!note.active) continue;
            note.y -= speed * dt;

            if (!note.missed && note.y < targetY - laneWidth) {
                note.missed = true;
                note.active = false;
                combo = 0;
                health = Math.max(0, health - 20);
                shake = 5;
                playSfx('miss', 0.95);
                vibrate('heavy');
                showReaction('fail', 950);
                showPopup("DROPPED", note.x, targetY, "#ff0000");
                updateHUD();

                if (health <= 0) {
                    endRun();
                }
            }
        }

        notes = notes.filter(n => n.y > -100 && (n.active || n.missed));
    }

    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        p.size *= 0.95;
    }
    particles = particles.filter(p => p.life > 0);

    for (let p of popups) {
        p.y -= 50 * dt;
        p.life -= dt * 1.5;
    }
    popups = popups.filter(p => p.life > 0);

    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    render();
    requestAnimationFrame(loop);
}

function render() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (shake > 0) {
        const dx = (Math.random() - 0.5) * shake * dpr;
        const dy = (Math.random() - 0.5) * shake * dpr;
        ctx.translate(dx, dy);
    }

    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        const x = i * laneWidth;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
        ctx.stroke();

        const cx = x + laneWidth / 2;
        ctx.strokeStyle = gameConfig.colors[i];
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, targetY, laneWidth * 0.3, 0, Math.PI * 2);
        ctx.stroke();

        ctx.shadowBlur = 20;
        ctx.shadowColor = gameConfig.colors[i];
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    ctx.globalCompositeOperation = 'lighter';
    for (let note of notes) {
        if (!note.active) continue;

        const grad = ctx.createLinearGradient(note.x, note.y, note.x, note.y + note.r * 4);
        grad.addColorStop(0, note.color);
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(note.x - note.r, note.y);
        ctx.lineTo(note.x + note.r, note.y);
        ctx.lineTo(note.x, note.y + note.r * 6);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(note.x, note.y, note.r * 0.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = note.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(note.x, note.y, note.r, 0, Math.PI * 2);
        ctx.stroke();
    }

    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    ctx.textAlign = 'center';
    ctx.font = `600 ${Math.max(20, 40 * (cw / 400))}px "Exo 2"`;
    for (let p of popups) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
}

/**
 * Input Handling
 */
function handleInput(e) {
    unlockAudio();
    playBgm();

    if (gameState === 'GAMEOVER') {
        restartGame();
        return;
    }

    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const laneIndex = Math.floor(x / (cw / 4));
        if (laneIndex >= 0 && laneIndex < 4) {
            checkHit(laneIndex);
        }
    }
}

function restartGame() {
    initGame();
}

// Event Listeners
// [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas/#restart-btn | action: scoped pointer prevention to canvas so UI buttons keep native tap/click behavior
canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleInput(e);
}, { passive: false });

document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    handleInput(e);
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopBgm(false);
    } else if (gameState === 'PLAYING') {
        playBgm();
    }
});

/**
 * Lifecycle & Resize
 */
function resize() {
    const rect = document.getElementById('game-container').getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;

    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    laneWidth = cw / 4;
    targetY = ch * 0.15;
}

const ro = new ResizeObserver(() => {
    resize();
    if (!initialized) {
        initAudio();
        initGame();
        initialized = true;
        requestAnimationFrame(loop);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.getElementById('game-container'));
});
</script>
