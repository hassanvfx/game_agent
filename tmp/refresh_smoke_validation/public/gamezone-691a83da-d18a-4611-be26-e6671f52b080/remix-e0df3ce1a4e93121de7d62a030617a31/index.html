<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Sweep</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #050816;
            --bg-grid: #0f1631;
            --panel: rgba(10, 18, 37, 0.9);
            --panel-border: rgba(96, 229, 255, 0.9);
            --text: #f4fbff;
            --muted: #9cb5d4;
            --accent: #ff4d8d;
            --accent-strong: #60e5ff;
            --accent-gold: #ffe072;
            --accent-glow: rgba(96, 229, 255, 0.35);
            --danger-glow: rgba(255, 77, 141, 0.42);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(96, 229, 255, 0.14), transparent 38%),
                radial-gradient(circle at bottom, rgba(255, 77, 141, 0.12), transparent 32%),
                var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .display-text {
            font-family: 'Orbitron', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        .hidden { display: none !important; }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud {
            position: absolute;
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            right: max(1rem, env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
            gap: 1rem;
            flex-wrap: wrap;
        }

        .hud-item-large,
        .hud-item-small {
            padding: 0.55rem 0.8rem;
            border: 1px solid rgba(96, 229, 255, 0.4);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(9, 18, 35, 0.9), rgba(9, 18, 35, 0.55));
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.28), inset 0 0 12px rgba(96, 229, 255, 0.08);
            backdrop-filter: blur(6px);
        }

        .hud-item-large { font-size: clamp(1.1rem, 2vw, 1.5rem); }
        .hud-item-small { font-size: clamp(0.95rem, 1.8vw, 1.2rem); }
        .accent {
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255, 224, 114, 0.55);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(1.25rem, env(safe-area-inset-top))
                max(1.25rem, env(safe-area-inset-right))
                max(1.25rem, env(safe-area-inset-bottom))
                max(1.25rem, env(safe-area-inset-left));
            pointer-events: auto;
        }

        .panel {
            width: min(92vw, 36rem);
            border: 3px solid var(--panel-border);
            border-radius: 1.2rem;
            background:
                linear-gradient(180deg, rgba(14, 24, 48, 0.98), rgba(8, 14, 30, 0.96)),
                var(--panel);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 34px var(--accent-glow), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .panel::before,
        .panel::after {
            content: '';
            position: absolute;
            pointer-events: none;
        }

        .panel::before {
            inset: 0.55rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.9rem;
        }

        .panel::after {
            width: 7rem;
            height: 7rem;
            right: -1.5rem;
            top: -1.5rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96, 229, 255, 0.28), transparent 70%);
        }

        .panel-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 8vw, 3.4rem);
            line-height: 0.95;
        }

        .panel-subtitle {
            margin: 0 0 1rem;
            font-size: clamp(1rem, 3.5vw, 1.35rem);
            color: var(--muted);
            text-shadow: 0 0 12px rgba(96, 229, 255, 0.2);
        }

        .panel-copy {
            margin: 0.35rem 0;
            font-size: clamp(1rem, 3vw, 1.15rem);
            color: #e8ecf3;
            max-width: 28rem;
        }

        .panel-copy strong {
            color: var(--text);
            font-weight: 600;
        }

        .action-btn {
            margin-top: 1.25rem;
            padding: 0.9rem 1.5rem;
            background: linear-gradient(135deg, var(--accent), #ff7f6a);
            color: var(--text);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            font-size: clamp(1rem, 3vw, 1.35rem);
            cursor: pointer;
            transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
            font-family: 'Orbitron', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            box-shadow: 0 0 20px var(--danger-glow);
        }

        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            width: min(26vw, 7rem);
            max-height: 7rem;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(96, 229, 255, 0.45);
            background: rgba(8, 14, 30, 0.72);
            box-shadow: 0 0 22px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-gif.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 50%;
            right: auto;
            bottom: 1rem;
            width: min(56vw, 12rem);
            max-height: 8.5rem;
            transform: translate(-50%, 12px) scale(0.96);
        }

        .feedback-gif.fail.show {
            transform: translate(-50%, 0) scale(1);
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            background: linear-gradient(135deg, var(--accent-strong), #7cf7ff);
            color: #08101f;
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-1px);
            box-shadow: 0 0 24px var(--accent-glow);
            outline: none;
        }

        .damage-overlay {
            position: absolute;
            inset: 0;
            background: rgba(220, 38, 38, 0);
            transition: background-color 100ms linear;
        }

        .damage-overlay.flash {
            background: rgba(255, 77, 141, 0.35);
        }

        .signal-sparks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 6;
        }

        .signal-spark {
            position: absolute;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9), rgba(96, 229, 255, 0.15));
            box-shadow: 0 0 12px rgba(96, 229, 255, 0.7);
            animation: signalFloat 3s ease-in-out infinite;
            opacity: 0.35;
        }

        .signal-spark:nth-child(1) { left: 12%; top: 22%; animation-delay: 0s; }
        .signal-spark:nth-child(2) { left: 82%; top: 28%; animation-delay: 0.8s; }
        .signal-spark:nth-child(3) { left: 20%; top: 74%; animation-delay: 1.5s; }
        .signal-spark:nth-child(4) { left: 72%; top: 68%; animation-delay: 2.2s; }

        @keyframes signalFloat {
            0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.18; }
            50% { transform: translateY(-10px) scale(1.15); opacity: 0.55; }
        }

        @media (max-width: 600px) {
            .hud {
                top: max(0.75rem, env(safe-area-inset-top));
                left: max(0.75rem, env(safe-area-inset-left));
                right: max(0.75rem, env(safe-area-inset-right));
                gap: 0.5rem;
            }

            .hud-item-large,
            .hud-item-small {
                padding: 0.45rem 0.65rem;
            }

            .panel {
                max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 1.5rem);
                overflow-y: auto;
                padding: 1.25rem 1rem;
            }

            .feedback-gif {
                width: min(30vw, 5rem);
                max-height: 5rem;
            }

            .feedback-gif.fail {
                width: min(44vw, 8rem);
                max-height: 6rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 10, "min": 1, "max": 12 },
        "fireRate": { "type": "number", "label": "Fire Rate (shots/sec)", "value": 5, "min": 1, "max": 10 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff003c" }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="crt-overlay"></div>
        <div class="signal-sparks" aria-hidden="true">
            <span class="signal-spark"></span>
            <span class="signal-spark"></span>
            <span class="signal-spark"></span>
            <span class="signal-spark"></span>
        </div>
        <div id="ui-layer" class="ui-layer">
            <div id="hud" class="hud display-text hidden">
                <div class="hud-item-large">SIGNAL: <span id="score-val" class="accent">0</span></div>
                <div class="hud-item-small">SURGE: <span id="wave-val">1</span></div>
            </div>

            <div id="start-screen" class="overlay-screen">
                <div class="panel">
                    <h1 class="panel-title display-text">Signal Sweep</h1>
                    <p class="panel-subtitle display-text">Hold the line against a descending glitch storm.</p>
                    <p class="panel-copy"><strong>Drag or hold</strong> to slide the beacon left and right.</p>
                    <p class="panel-copy">Your pulse fires automatically. Clear as many rogue signals as you can.</p>
                    <button id="start-btn" class="action-btn">Start Sweep</button>
                </div>
            </div>

            <div id="game-over-screen" class="overlay-screen hidden">
                <div class="panel">
                    <h1 class="panel-title display-text">Signal Lost</h1>
                    <p class="panel-subtitle display-text">Signals Cleared: <span id="final-score" class="accent">0</span></p>
                    <p class="panel-copy">A rogue signal reached your beacon.</p>
                    <button id="restart-btn" class="action-btn">Restart Sweep</button>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: hit/fail overlays -> catalogs/gifs.json | keep compact off playfield -->
            <img
                id="combo-gif"
                class="feedback-gif"
                src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                alt="Signal burst reaction"
                aria-hidden="true"
                loading="lazy"
                decoding="async"
            >
            <img
                id="fail-gif"
                class="feedback-gif fail"
                src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
                alt="Signal lost reaction"
                aria-hidden="true"
                loading="lazy"
                decoding="async"
            >

            <div id="damage-overlay" class="damage-overlay"></div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-font: display=Orbitron ui=Rajdhani -> catalogs/fonts.json -->
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/combat -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
    <audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_shoot" src="https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3" preload="auto"></audio>
    <audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_01.mp3" preload="auto"></audio>
    <audio id="sfx_danger" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
    <audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>

    <script>
        // --- System & Config ---
        let gameConfig = {};
        let cw = 0, ch = 0, dpr = 1;
        let initialized = false;
        let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // --- Audio System ---
        let audioCtx = null;
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const comboGif = document.getElementById('combo-gif');
        const failGif = document.getElementById('fail-gif');
        const audioNodes = {
            start: document.getElementById('sfx_start'),
            restart: document.getElementById('sfx_restart'),
            shoot: document.getElementById('sfx_shoot'),
            hit: document.getElementById('sfx_hit'),
            danger: document.getElementById('sfx_danger'),
            gameover: document.getElementById('sfx_gameover')
        };
        const sfxCooldowns = {
            shoot: 0,
            hit: 0,
            danger: 0
        };
        let comboGifTimer = null;
        let failGifTimer = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            bgm.volume = 0.2;
            bgm.play().catch(() => {});
            Object.values(audioNodes).forEach(audio => {
                audio.volume = audio.id === 'sfx_shoot' ? 0.18 : audio.id === 'sfx_danger' ? 0.24 : 0.42;
                audio.load();
            });
            audioUnlocked = true;
        }

        function playSfx(name, { restart = true, cooldown = 0 } = {}) {
            const audio = audioNodes[name];
            if (!audio) return;
            const now = performance.now();
            if (cooldown && sfxCooldowns[name] && now - sfxCooldowns[name] < cooldown) return;
            sfxCooldowns[name] = now;
            try {
                if (restart) audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch (_) {}
        }

        function syncAudioForState() {
            if (gameState === 'PLAYING') {
                if (audioUnlocked) bgm.play().catch(() => {});
            } else {
                bgm.pause();
            }
        }

        function showGif(element, duration = 700) {
            if (!element) return;
            element.classList.add('show');
            const isFailGif = element.id === 'fail-gif';
            clearTimeout(isFailGif ? failGifTimer : comboGifTimer);
            const timer = setTimeout(() => element.classList.remove('show'), duration);
            if (isFailGif) {
                failGifTimer = timer;
            } else {
                comboGifTimer = timer;
            }
        }

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
        }

        // --- Game State & Entities ---
        let score = 0;
        let wave = 1;
        let player = { x: 0, y: 0, r: 15, targetX: 0, color: '#00ffff' };
        let bullets = [];
        let zombies = [];
        let particles = [];
        let fireCooldown = 0;
        let zombieSpawnTimer = 0;
        let screenShake = 0;
        let timeElapsed = 0;

        function setState(newState) {
            gameState = newState;
            const goScreen = document.getElementById('game-over-screen');
            const hud = document.getElementById('hud');
            const startScreen = document.getElementById('start-screen');

            if (newState === 'INIT') {
                startScreen.classList.remove('hidden');
                goScreen.classList.add('hidden');
                hud.classList.add('hidden');
                failGif?.classList.remove('show');
            } else if (newState === 'PLAYING') {
                startScreen.classList.add('hidden');
                goScreen.classList.add('hidden');
                hud.classList.remove('hidden');
                failGif?.classList.remove('show');
            } else if (newState === 'GAMEOVER') {
                startScreen.classList.add('hidden');
                goScreen.classList.remove('hidden');
                hud.classList.add('hidden');
                document.getElementById('final-score').innerText = score;
                playSfx('gameover', { cooldown: 300 });
                playSfx('danger', { cooldown: 300 });
                showGif(failGif, 2400);
            }
            syncAudioForState();
        }

        function initGame(mode = 'start') {
            score = 0;
            wave = 1;
            timeElapsed = 0;
            player.x = cw / 2;
            player.y = ch - 100;
            player.targetX = player.x;
            bullets = [];
            zombies = [];
            particles = [];
            screenShake = 0;
            zombieSpawnTimer = 0;
            fireCooldown = 0;
            updateHUD();
            setState('PLAYING');
            bgm.currentTime = 0;
            playSfx(mode === 'restart' ? 'restart' : 'start', { cooldown: 250 });
            syncAudioForState();
        }

        function restartGame() {
            initGame('restart');
        }

        function updateHUD() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('wave-val').innerText = wave;
        }

        function spawnZombie() {
            const r = 12 + Math.random() * 8;
            zombies.push({
                x: r + Math.random() * (cw - r * 2),
                y: -r,
                r: r,
                hp: 1 + Math.floor(wave / 2),
                speed: (50 + Math.random() * 50) * (1 + wave * 0.1),
                wobbleOffset: Math.random() * Math.PI * 2
            });
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 150;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.2 + Math.random() * 0.3,
                    maxLife: 0.5,
                    color: color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        function flashScreen() {
            const overlay = document.getElementById('damage-overlay');
            overlay.classList.add('flash');
            setTimeout(() => {
                overlay.classList.remove('flash');
            }, 100);
        }

        // --- Input Handling ---
        function handleInput(e) {
            unlockAudio();

            if (gameState === 'INIT') {
                if (e.type === 'click' || e.type === 'pointerdown' || e.target.id === 'start-btn') {
                    initGame('start');
                }
                return;
            }

            if (gameState === 'GAMEOVER') {
                if (e.target.id === 'restart-btn') restartGame();
                return;
            }

            if (gameState === 'PLAYING') {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
                if (!Number.isFinite(clientX)) return;
                player.targetX = clientX - rect.left;
            }
        }

        // [agent-note][stage4] repaired: mobile drag/actionability | element: canvas/start/restart inputs | action: keep UI taps native, scope movement to pointer events without global touch cancellation
        window.addEventListener('pointerdown', (e) => {
            if (e.target.id === 'start-btn' || e.target.id === 'restart-btn' || gameState === 'PLAYING') {
                handleInput(e);
                if (gameState === 'PLAYING' && e.target === canvas && typeof canvas.setPointerCapture === 'function') {
                    try {
                        canvas.setPointerCapture(e.pointerId);
                    } catch (_) {}
                }
            }
        }, { passive: false });

        window.addEventListener('pointermove', (e) => {
            if (gameState !== 'PLAYING') return;
            const isPointerActive = e.pointerType === 'mouse' ? e.buttons > 0 : e.pressure > 0 || e.buttons > 0;
            if (isPointerActive) handleInput(e);
        }, { passive: false });

        window.addEventListener('pointerup', (e) => {
            if (e.target === canvas && typeof canvas.releasePointerCapture === 'function' && canvas.hasPointerCapture?.(e.pointerId)) {
                try {
                    canvas.releasePointerCapture(e.pointerId);
                } catch (_) {}
            }
        });

        document.getElementById('start-btn').addEventListener('click', handleInput);
        document.getElementById('restart-btn').addEventListener('click', handleInput);

        // --- Main Loop ---
        let lastTime = 0;
        function loop(timestamp) {
            requestAnimationFrame(loop);
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.05) dt = 0.05; // Cap dt
            lastTime = timestamp;

            try {
                if (gameState === 'PLAYING') update(dt);
                draw();
            } catch (err) {
                console.error("Loop error:", err);
            }
        }

        function update(dt) {
            timeElapsed += dt;
            wave = 1 + Math.floor(timeElapsed / 15);

            // Player movement
            const speed = gameConfig.heroSpeed * 60 * dt;
            const dx = player.targetX - player.x;
            if (Math.abs(dx) > speed) {
                player.x += Math.sign(dx) * speed;
            } else {
                player.x = player.targetX;
            }
            player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
            if (!isFinite(player.x) || !isFinite(player.y)) {
                player.x = cw / 2;
                player.y = ch - 100;
            }

            // Shooting
            fireCooldown -= dt;
            if (fireCooldown <= 0) {
                bullets.push({ x: player.x, y: player.y - player.r, r: 3, vy: -500 });
                playSfx('shoot', { cooldown: 90 });
                fireCooldown = 1 / gameConfig.fireRate;
            }

            // Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y += b.vy * dt;
                if (b.y < -10) bullets.splice(i, 1);
            }

            // Incoming signals
            zombieSpawnTimer -= dt;
            const spawnRate = Math.max(0.2, 1.0 - wave * 0.1);
            if (zombieSpawnTimer <= 0) {
                spawnZombie();
                zombieSpawnTimer = spawnRate;
            }

            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                z.y += z.speed * dt;
                z.x += Math.sin(timeElapsed * 5 + z.wobbleOffset) * 30 * dt; // Wobble
                z.x = Math.max(z.r, Math.min(cw - z.r, z.x));

                // Collision with bullets
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let dist = Math.hypot(z.x - b.x, z.y - b.y);
                    if (dist < z.r + b.r) {
                        z.hp--;
                        bullets.splice(j, 1);
                        spawnParticles(b.x, b.y, '#ffaa00', 3);
                        if (z.hp <= 0) {
                            spawnParticles(z.x, z.y, gameConfig.themeColor, 15);
                            playSfx('hit', { cooldown: 120 });
                            showGif(comboGif, 680);
                            vibrate('light');
                            score += 10;
                            updateHUD();
                            zombies.splice(i, 1);
                            screenShake = 2;
                        } else {
                            z.hitFlash = 0.1;
                        }
                        break; // Signal might be cleared, move to next one
                    }
                }

                if (zombies[i]) {
                    // Collision with player
                    let pDist = Math.hypot(z.x - player.x, z.y - player.y);
                    if (pDist < z.r + player.r) {
                        vibrate('heavy');
                        flashScreen();
                        spawnParticles(player.x, player.y, player.color, 30);
                        setState('GAMEOVER');
                        return;
                    }

                    // Off screen
                    if (z.y > ch + z.r) {
                        zombies.splice(i, 1);
                    }
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (screenShake > 0) {
                screenShake -= dt * 10;
                if (screenShake < 0) screenShake = 0;
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, cw, ch);

            // Grid (Depth cue)
            ctx.strokeStyle = '#220000';
            ctx.lineWidth = 1;
            const gridSize = 40;
            const offset = (timeElapsed * 20) % gridSize;
            ctx.beginPath();
            for (let x = 0; x < cw; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, ch);
            }
            for (let y = offset; y < ch; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(cw, y);
            }
            ctx.stroke();

            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake * 5;
                const sy = (Math.random() - 0.5) * screenShake * 5;
                ctx.translate(sx, sy);
            }

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Bullets
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffff00';
            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, Math.max(0, b.r), 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x, b.y + 15);
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Incoming signals
            zombies.forEach(z => {
                ctx.shadowBlur = 15;
                ctx.shadowColor = z.hitFlash > 0 ? '#ffffff' : gameConfig.themeColor;
                ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : gameConfig.themeColor;
                if (z.hitFlash > 0) z.hitFlash -= 0.016;

                ctx.save();
                ctx.translate(z.x, z.y);
                ctx.rotate(timeElapsed * 2);
                ctx.beginPath();
                ctx.rect(-z.r, -z.r, z.r * 2, z.r * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#220000';
                ctx.fillRect(-z.r * 0.5, -z.r * 0.5, z.r, z.r);
                ctx.restore();
            });

            // Beacon
            if (gameState === 'PLAYING') {
                ctx.shadowBlur = 20;
                ctx.shadowColor = player.color;
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.r);
                ctx.lineTo(player.x + player.r, player.y + player.r);
                ctx.lineTo(player.x - player.r, player.y + player.r);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(player.x, player.y + player.r * 0.3, Math.max(0, player.r * 0.3), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Initialization ---
        function resize(w, h) {
            cw = w;
            ch = h;
            dpr = window.devicePixelRatio || 1;
            canvas.width = cw * dpr;
            canvas.height = ch * dpr;
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (!initialized) {
                player.x = cw / 2;
                player.y = ch - 100;
                player.targetX = player.x;
                setState('INIT');
                initialized = true;
                requestAnimationFrame(loop);
            } else {
                player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
                player.y = Math.max(player.r, Math.min(ch - player.r, player.y));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const configScript = document.getElementById('game-config');
            if (configScript) {
                try {
                    const defs = JSON.parse(configScript.textContent);
                    window.gameConfigDefs = defs;
                    for (let key in defs) {
                        gameConfig[key] = defs[key].value;
                    }
                } catch (e) {
                    console.error("Config parse error", e);
                }
            }

            const gameContainer = document.getElementById('game-container');
            const ro = new ResizeObserver(entries => {
                for (let entry of entries) {
                    resize(entry.contentRect.width, entry.contentRect.height);
                }
            });
            ro.observe(gameContainer);
        });
    </script>
</body>
