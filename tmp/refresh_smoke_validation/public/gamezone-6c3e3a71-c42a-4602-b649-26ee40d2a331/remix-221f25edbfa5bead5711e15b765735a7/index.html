<script>
/**
 * §4 Iron Laws & Core Systems
 */

// --- Configuration System ---
window.gameConfig = {
    gravity: 0.5,
    bounce: 0.7,
    inkColor: "#22d3ee",
    gameTitle: "Neon Relay"
};

window.gameConfigDefs = {};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.buffers = {};
        this.unlocked = false;
        this.muted = false;
        this.lastPlayed = {};
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        
        const unlockHandler = () => {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            this.playBgm();
            this.unlocked = true;
            window.removeEventListener('pointerdown', unlockHandler);
            window.removeEventListener('keydown', unlockHandler);
        };
        
        window.addEventListener('pointerdown', unlockHandler);
        window.addEventListener('keydown', unlockHandler);
        
        this.loadAssets();
    }

    loadAssets() {
        const sounds = [
            { id: 'sfx_start', fallback: 'beep' },
            { id: 'sfx_ui', fallback: 'beep' },
            { id: 'sfx_draw', fallback: 'beep' },
            { id: 'sfx_win', fallback: 'success' },
            { id: 'sfx_bounce', fallback: 'hit' },
            { id: 'sfx_fail', fallback: 'fail' }
        ];

        sounds.forEach(s => {
            const el = document.getElementById(s.id);
            if (el && el.src) {
                fetch(el.src)
                    .then(r => r.arrayBuffer())
                    .then(data => this.ctx.decodeAudioData(data))
                    .then(buffer => { this.buffers[s.id] = buffer; })
                    .catch(() => console.warn('Audio load failed, using fallback'));
            }
        });
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (el && !this.muted) {
            el.volume = 0.2;
            el.play().catch(() => {});
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id, options = {}) {
        if (this.muted || !this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const now = performance.now();
        const debounceMs = options.debounceMs ?? 80;
        if (debounceMs > 0 && this.lastPlayed[id] && now - this.lastPlayed[id] < debounceMs) return;
        this.lastPlayed[id] = now;

        if (this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = this.buffers[id];
            gain.gain.value = options.volume ?? 0.35;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(options.fallback || (id === 'sfx_fail' ? 'fail' : 'beep'));
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.36);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.36);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.36);
        } else if (type === 'hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(280, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.16);
        } else if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.24);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.24);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.24);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
}

const audio = new AudioManager();

// --- Game Logic ---

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// State
let gameState = 'START'; // START, EDIT, RUN, WIN, GAME_OVER
let level = 1;
let ink = 1000;
const MAX_INK = 1000;
let lines = []; // Array of { points: [{x,y}], hit: 0 }
let currentLine = null;
let particles = [];
let stars = [];
let drawSfxCooldown = 0;
let feedbackTimeouts = {};

// Physics Objects
let hero = { x: 0, y: 0, vx: 0, vy: 0, r: 10, active: false };
let goal = { x: 0, y: 0, r: 20, angle: 0 };
let obstacles = [];

// Viewport
let width, height;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Regenerate stars on resize
    stars = [];
    for(let i=0; i<50; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 1.5,
            a: Math.random()
        });
    }
}

function initLevel() {
    // Reset hero
    hero.x = width * 0.1 + Math.random() * (width * 0.8);
    hero.y = height * 0.15;
    hero.vx = 0;
    hero.vy = 0;
    hero.active = false;

    // Set Goal (ensure it's far from hero)
    let safeDist = false;
    while(!safeDist) {
        goal.x = width * 0.1 + Math.random() * (width * 0.8);
        goal.y = height * 0.6 + Math.random() * (height * 0.3);
        const dx = goal.x - hero.x;
        const dy = goal.y - hero.y;
        if (Math.sqrt(dx*dx + dy*dy) > height * 0.4) safeDist = true;
    }

    // Obstacles (Red zones)
    obstacles = [];
    const obsCount = Math.min(5, Math.floor(level / 2));
    for(let i=0; i<obsCount; i++) {
        obstacles.push({
            x: Math.random() * width,
            y: height * 0.3 + Math.random() * (height * 0.4),
            r: 15 + Math.random() * 20,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2
        });
    }

    // Reset lines but keep ink if we want persistent difficulty? No, reset ink.
    lines = [];
    ink = MAX_INK;
    updateUI();
    
    gameState = 'EDIT';
    document.getElementById('play-btn').classList.remove('opacity-50', 'pointer-events-none');
    document.getElementById('play-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
}

// Vector Math
const distSq = (p1, p2) => (p1.x - p2.x)**2 + (p1.y - p2.y)**2;
const sub = (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y });
const dot = (v1, v2) => v1.x * v2.x + v1.y * v2.y;
const normalize = (v) => {
    const len = Math.sqrt(v.x*v.x + v.y*v.y);
    return len === 0 ? {x:0, y:0} : {x: v.x/len, y: v.y/len};
};

function closestPointOnSegment(p, a, b) {
    const ab = sub(b, a);
    const t = Math.max(0, Math.min(1, dot(sub(p, a), ab) / dot(ab, ab)));
    return {
        x: a.x + t * ab.x,
        y: a.y + t * ab.y
    };
}

function showFeedbackGif(id, duration = 1400) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('is-visible');
    clearTimeout(feedbackTimeouts[id]);
    feedbackTimeouts[id] = setTimeout(() => el.classList.remove('is-visible'), duration);
}

function spawnParticles(x, y, color, count = 10) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color
        });
    }
}

function updatePhysics() {
    if (!hero.active) return;

    // Gravity
    hero.vy += window.gameConfig.gravity;
    hero.x += hero.vx;
    hero.y += hero.vy;

    // Bounds
    if (hero.x < 0 || hero.x > width || hero.y > height) {
        gameOver();
        return;
    }

    // Line Collision
    let hit = false;
    for (let line of lines) {
        for (let i = 0; i < line.points.length - 1; i++) {
            const p1 = line.points[i];
            const p2 = line.points[i+1];
            const closest = closestPointOnSegment(hero, p1, p2);
            const d = Math.sqrt(distSq(hero, closest));

            if (d < hero.r + 2) { // +2 for line thickness
                // Collision Normal
                const normal = normalize(sub(hero, closest));
                
                // Reflect velocity
                const vDotN = dot({x: hero.vx, y: hero.vy}, normal);
                
                // Only bounce if moving towards the line
                if (vDotN < 0) {
                    hero.vx -= 2 * vDotN * normal.x * window.gameConfig.bounce;
                    hero.vy -= 2 * vDotN * normal.y * window.gameConfig.bounce;
                    
                    // Push out
                    const overlap = (hero.r + 2) - d;
                    hero.x += normal.x * overlap;
                    hero.y += normal.y * overlap;
                    
                    hit = true;
                    line.hit = 10; // Visual feedback
                    spawnParticles(closest.x, closest.y, window.gameConfig.inkColor);
                }
            }
        }
    }
    if (hit) {
        audio.playSfx('sfx_bounce', { debounceMs: 120, volume: 0.28, fallback: 'hit' });
    }

    // Obstacle Collision
    for (let obs of obstacles) {
        if (Math.sqrt(distSq(hero, obs)) < hero.r + obs.r) {
            spawnParticles(hero.x, hero.y, '#f43f5e', 30);
            gameOver();
            return;
        }
        // Move obstacles slightly
        obs.x += obs.vx;
        obs.y += obs.vy;
        if(obs.x < 0 || obs.x > width) obs.vx *= -1;
        if(obs.y < 0 || obs.y > height) obs.vy *= -1;
    }

    // Goal
    if (Math.sqrt(distSq(hero, goal)) < hero.r + goal.r) {
        winLevel();
    }
}

function winLevel() {
    gameState = 'WIN';
    audio.playSfx('sfx_win', { debounceMs: 250, volume: 0.34, fallback: 'success' });
    showFeedbackGif('gif-win', 1400);
    spawnParticles(goal.x, goal.y, '#fbbf24', 50);
    setTimeout(() => {
        level++;
        initLevel();
    }, 1500);
}

function gameOver() {
    gameState = 'GAME_OVER';
    audio.playSfx('sfx_fail', { debounceMs: 250, volume: 0.34, fallback: 'fail' });
    showFeedbackGif('gif-fail', 1800);
    audio.stopBgm();
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('final-level').innerText = level;
}

function updateUI() {
    document.getElementById('level-display').innerText = level;
    document.getElementById('ink-bar').style.width = (ink / MAX_INK * 100) + '%';
    
    // Change bar color if low
    const bar = document.getElementById('ink-bar');
    if (ink < MAX_INK * 0.2) bar.classList.replace('bg-cyan-400', 'bg-red-500');
    else bar.classList.replace('bg-red-500', 'bg-cyan-400');
}

// --- Input Handling ---
function handleInput(e) {
    if (gameState !== 'EDIT') return;
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        if (ink > 0) {
            currentLine = { points: [{x, y}], hit: 0 };
            lines.push(currentLine);
        }
    } else if (e.type === 'pointermove' && currentLine) {
        if (ink > 0) {
            const lastPt = currentLine.points[currentLine.points.length - 1];
            const dist = Math.sqrt((x - lastPt.x)**2 + (y - lastPt.y)**2);
            
            if (dist > 5) { // Minimum segment length
                currentLine.points.push({x, y});
                ink -= dist;
                if (ink < 0) ink = 0;
                if (performance.now() > drawSfxCooldown) {
                    audio.playSfx('sfx_draw', { debounceMs: 0, volume: 0.14 });
                    drawSfxCooldown = performance.now() + 120;
                }
                updateUI();
            }
        } else {
            currentLine = null; // Stop drawing if out of ink
        }
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        currentLine = null;
    }
}

// --- Main Loop ---
function loop() {
    requestAnimationFrame(loop);
    
    // Clear
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, width, height);

    // Draw Stars (Parallax)
    ctx.fillStyle = '#ffffff';
    stars.forEach(s => {
        ctx.globalAlpha = s.a * 0.5 + Math.sin(Date.now() * 0.002 + s.x) * 0.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Draw Goal
    goal.angle += 0.05;
    ctx.save();
    ctx.translate(goal.x, goal.y);
    ctx.rotate(goal.angle);
    
    // Vortex effect
    for(let i=0; i<4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = i % 2 === 0 ? '#fbbf24' : '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, goal.r + Math.sin(Date.now()*0.01)*5, 0, Math.PI/2);
        ctx.fill();
    }
    ctx.restore();
    
    // Goal Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#fbbf24';
    ctx.beginPath();
    ctx.arc(goal.x, goal.y, goal.r * 0.8, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw Obstacles
    ctx.fillStyle = '#f43f5e';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#f43f5e';
    obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.shadowBlur = 0;

    // Draw Lines
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    lines.forEach(line => {
        if (line.points.length < 2) return;
        
        ctx.beginPath();
        ctx.moveTo(line.points[0].x, line.points[0].y);
        for(let i=1; i<line.points.length; i++) {
            ctx.lineTo(line.points[i].x, line.points[i].y);
        }
        
        // Visual feedback on hit
        if (line.hit > 0) {
            ctx.lineWidth = 6 + Math.sin(line.hit) * 2;
            ctx.strokeStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 15;
            line.hit--;
        } else {
            ctx.lineWidth = 4;
            ctx.strokeStyle = window.gameConfig.inkColor;
            ctx.shadowColor = window.gameConfig.inkColor;
            ctx.shadowBlur = 8;
        }
        ctx.stroke();
    });
    ctx.shadowBlur = 0;

    // Draw Hero
    if (gameState === 'EDIT' || gameState === 'RUN') {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.r, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Hero Trail
        if (hero.active) {
            spawnParticles(hero.x, hero.y, '#38bdf8', 1);
        }
    }

    // Draw Particles
    for(let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Physics Step
    if (gameState === 'RUN') {
        updatePhysics();
    }
}

// --- Initialization ---

document.addEventListener('DOMContentLoaded', () => {
    // Config Parsing
    try {
        const configEl = document.getElementById('game-config');
        if (configEl) {
            const defs = JSON.parse(configEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                window.gameConfig[key] = defs[key].value;
            }
        }
    } catch (e) { console.error("Config parse error", e); }

    // Init Audio
    audio.init();

    // DOM Elements
    const startBtn = document.getElementById('start-btn');
    const playBtn = document.getElementById('play-btn');
    const clearBtn = document.getElementById('clear-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Event Bindings
    startBtn.addEventListener('click', () => {
        audio.playSfx('sfx_start', { debounceMs: 200, volume: 0.28 });
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('controls').classList.remove('hidden');
        audio.playBgm();
        initLevel();
    });

    playBtn.addEventListener('click', () => {
        if (gameState === 'EDIT') {
            gameState = 'RUN';
            hero.active = true;
            // Visual change to stop button
            playBtn.classList.add('opacity-50', 'pointer-events-none');
            audio.playSfx('sfx_ui', { debounceMs: 140, volume: 0.22 }); // Feedback sound
        }
    });

    clearBtn.addEventListener('click', () => {
        if (gameState === 'EDIT') {
            lines = [];
            ink = MAX_INK;
            audio.playSfx('sfx_ui', { debounceMs: 140, volume: 0.22 });
            updateUI();
        } else if (gameState === 'RUN') {
            // If running, "Clear" acts as "Retry Level"
            audio.playSfx('sfx_ui', { debounceMs: 140, volume: 0.22 });
            initLevel();
        }
    });

    restartBtn.addEventListener('click', () => {
        audio.playSfx('sfx_ui', { debounceMs: 140, volume: 0.22 });
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('controls').classList.remove('hidden');
        document.getElementById('hud').classList.remove('hidden');
        audio.playBgm();
        level = 1;
        initLevel();
    });

    // Canvas Input
    // [agent-note][stage4] repaired: mobile-action-risk | element: canvas pointer handlers | action: preventDefault scoped to active drawing path only
    canvas.addEventListener('pointerdown', (e) => {
        if (gameState !== 'EDIT') return;
        e.preventDefault();
        handleInput(e);
    }, { passive: false });
    window.addEventListener('pointermove', (e) => {
        if (gameState !== 'EDIT' || !currentLine) return;
        e.preventDefault();
        handleInput(e);
    }, { passive: false });
    window.addEventListener('pointerup', (e) => {
        if (!currentLine) return;
        e.preventDefault();
        handleInput(e);
    }, { passive: false });
    window.addEventListener('pointercancel', (e) => {
        if (!currentLine) return;
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    // Setup
    resize();
    window.addEventListener('resize', resize);
    
    // Config Title Sync
        document.title = window.gameConfig.gameTitle;
        document.getElementById('ui-title').innerText = window.gameConfig.gameTitle.split(' ')[0] || "NEON";
    
    // Start Loop
    requestAnimationFrame(loop);
});

// Editor Interface
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') {
             document.title = val;
             document.getElementById('ui-title').innerText = val;
        }
        if (key === 'inkColor') {
            // Immediate feedback
        }
    }
};
