<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Streamer Tycoon: Chat Update</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Bangers&display=swap">
    <!-- [agent-note][stage4] repaired: font-remap | display -> Bangers, ui -> Exo 2 from workspace catalog -->
    <style>
        :root {
            --bg: #07111f;
            --bg-deep: #020817;
            --panel: rgba(6, 18, 36, 0.74);
            --panel-strong: rgba(13, 28, 52, 0.92);
            --panel-soft: rgba(17, 24, 39, 0.54);
            --line: rgba(148, 163, 184, 0.22);
            --text: #f8fbff;
            --text-soft: #d4def0;
            --cyan: #67e8f9;
            --blue: #60a5fa;
            --violet: #a78bfa;
            --pink: #f472b6;
            --lime: #a3e635;
            --danger: #fb7185;
            --gold: #fbbf24;
            --shadow: 0 18px 50px rgba(1, 8, 20, 0.45);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            touch-action: auto;
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(96, 165, 250, 0.14), transparent 30%),
                radial-gradient(circle at bottom, rgba(244, 114, 182, 0.12), transparent 35%),
                linear-gradient(180deg, #08101d 0%, #030712 100%);
            color: var(--text);
        }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .font-ui { font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif; }
        .font-display { font-family: 'Bangers', 'Exo 2', sans-serif; letter-spacing: 0.04em; }
        .font-tech { font-family: 'Bangers', 'Exo 2', sans-serif; }
        .font-data { font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.08em; }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .bottom-4 { bottom: 1rem; }
        .left-4 { left: 1rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .h-2 { height: 0.5rem; }
        .w-32 { width: 8rem; }
        .w-64 { width: min(16rem, calc(100vw - 2rem)); }
        .h-64 { height: min(16rem, 34vh); }
        .max-w-sm { max-width: 24rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .ml-1 { margin-left: 0.25rem; }
        .ml-2 { margin-left: 0.5rem; }
        .ml-auto { margin-left: auto; }
        .p-1 { padding: 0.25rem; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-1\.5 { padding-left: 0.375rem; padding-right: 0.375rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }
        .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-4 { padding-bottom: 1rem; }
        .flex { display: flex; }
        .grid { display: grid; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .flex-1 { flex: 1 1 0%; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .justify-center { justify-content: center; }
        .justify-end { justify-content: flex-end; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 0.25rem; }
        .gap-1\.5 { gap: 0.375rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .space-y-1\.5 > * + * { margin-top: 0.375rem; }
        .self-center { align-self: center; }
        .overflow-hidden { overflow: hidden; }
        .break-words { overflow-wrap: anywhere; }
        .rounded-full { border-radius: 999px; }
        .rounded-r { border-radius: 0 0.5rem 0.5rem 0; }
        .rounded-lg { border-radius: 0.75rem; }
        .rounded-xl { border-radius: 1rem; }
        .rounded-2xl { border-radius: 1.4rem; }
        .rounded-3xl { border-radius: 1.8rem; }
        .border { border: 1px solid var(--line); }
        .border-b { border-bottom: 1px solid var(--line); }
        .border-slate-700 { border-color: rgba(51, 65, 85, 0.8); }
        .border-l-2 { border-left: 2px solid currentColor; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }
        .leading-relaxed { line-height: 1.55; }
        .leading-tight { line-height: 1.1; }
        .tracking-tight { letter-spacing: -0.02em; }
        .tracking-wide { letter-spacing: 0.08em; }
        .tracking-wider { letter-spacing: 0.12em; }
        .tracking-widest { letter-spacing: 0.22em; }
        .text-\[10px\] { font-size: 0.625rem; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.92rem; }
        .text-lg { font-size: 1.05rem; }
        .text-xl { font-size: 1.3rem; }
        .text-2xl { font-size: 1.7rem; }
        .text-4xl { font-size: clamp(2.2rem, 8vw, 3rem); }
        .text-5xl { font-size: clamp(2.6rem, 9vw, 3.4rem); }
        .text-7xl { font-size: clamp(3.5rem, 14vw, 4.75rem); }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .text-white { color: #ffffff; }
        .text-white\/90 { color: rgba(255,255,255,0.9); }
        .text-slate-900 { color: #0f172a; }
        .text-gray-300 { color: #cbd5e1; }
        .text-gray-400 { color: #94a3b8; }
        .text-gray-500 { color: #64748b; }
        .text-green-300 { color: #86efac; }
        .text-green-400 { color: #4ade80; }
        .text-blue-100 { color: #dbeafe; }
        .text-blue-200 { color: #bfdbfe; }
        .text-blue-300 { color: #93c5fd; }
        .text-blue-400 { color: #60a5fa; }
        .text-purple-200 { color: #e9d5ff; }
        .text-purple-400 { color: #c084fc; }
        .text-red-400 { color: #f87171; }
        .text-transparent { color: transparent; }
        .bg-black\/70 { background: rgba(0,0,0,0.7); }
        .bg-black\/90 { background: rgba(0,0,0,0.9); }
        .backdrop-blur-sm { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .bg-white { background: #ffffff; }
        .bg-gray-700 { background: rgba(51, 65, 85, 0.85); }
        .bg-blue-500 { background: #3b82f6; }
        .bg-blue-500\/20 { background: rgba(59, 130, 246, 0.2); }
        .bg-green-500\/20 { background: rgba(34, 197, 94, 0.2); }
        .bg-purple-900\/60 { background: rgba(88, 28, 135, 0.6); }
        .bg-slate-800 { background: rgba(30, 41, 59, 0.95); }
        .bg-slate-800\/50 { background: rgba(30, 41, 59, 0.5); }
        .bg-slate-900 { background: var(--bg); }
        .bg-gradient-to-r {
            background-image: linear-gradient(90deg, var(--grad-from, #60a5fa), var(--grad-via, #a855f7), var(--grad-to, #f472b6));
        }
        .from-blue-500 { --grad-from: #3b82f6; }
        .via-purple-500 { --grad-via: #a855f7; }
        .to-pink-500 { --grad-to: #ec4899; }
        .from-blue-400 { --grad-from: #60a5fa; }
        .to-purple-400 { --grad-to: #c084fc; }
        .from-blue-600 { --grad-from: #2563eb; }
        .to-purple-600 { --grad-to: #9333ea; }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .shadow-lg { box-shadow: 0 12px 24px rgba(2, 6, 23, 0.28); }
        .shadow-xl { box-shadow: 0 16px 34px rgba(2, 6, 23, 0.32); }
        .shadow-2xl { box-shadow: 0 24px 50px rgba(2, 6, 23, 0.42); }
        .shadow-black { text-shadow: 0 3px 10px rgba(0, 0, 0, 0.45); }
        .drop-shadow-md { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.36)); }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .z-50 { z-index: 50; }
        .transition-all { transition: all 0.3s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .duration-500 { transition-duration: 0.5s; }
        .transform { transform: translateY(0); }
        .opacity-0 { opacity: 0; }
        .translate-y-\[-20px\] { transform: translateY(-20px); }
        .animate-bounce { animation: mascotPulse 1.8s ease-in-out infinite; }

        .safe-area-inset {
            padding-top: max(env(safe-area-inset-top), 0px);
            padding-bottom: max(env(safe-area-inset-bottom), 0px);
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(15, 28, 51, 0.82), rgba(6, 13, 27, 0.72)),
                radial-gradient(circle at top, rgba(103, 232, 249, 0.1), transparent 45%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: var(--shadow);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent 35%, transparent 70%, rgba(103,232,249,0.08));
            opacity: 0.8;
        }

        .glass-panel > * { position: relative; z-index: 1; }

        .score-pill,
        .followers-panel,
        .status-pill,
        .chat-shell,
        .modal-shell,
        .feature-card,
        .summary-card,
        .action-button,
        .start-button {
            position: relative;
            overflow: hidden;
        }

        .score-pill {
            border-color: rgba(74, 222, 128, 0.25);
            box-shadow: 0 12px 24px rgba(13, 148, 136, 0.14);
        }

        .followers-panel {
            border-color: rgba(96, 165, 250, 0.34);
            box-shadow: 0 16px 30px rgba(37, 99, 235, 0.18);
        }

        .status-pill {
            border: 1px solid rgba(192, 132, 252, 0.35);
            box-shadow: 0 12px 24px rgba(147, 51, 234, 0.18);
        }

        .health-track {
            background:
                linear-gradient(180deg, rgba(51, 65, 85, 0.95), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
        }

        #health-bar {
            background: linear-gradient(90deg, #fb7185, #ef4444);
            box-shadow: 0 0 18px rgba(248, 113, 113, 0.45);
        }

        .verified-pill {
            border: 1px solid rgba(96, 165, 250, 0.45);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.26);
        }

        .chat-shell {
            background: linear-gradient(180deg, rgba(8, 15, 29, 0.28), rgba(8, 15, 29, 0.08));
            border-radius: 1.4rem;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .chat-mask {
            mask-image: linear-gradient(to bottom, transparent 0%, black 24%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 24%);
        }

        .chat-msg {
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            animation: slideIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .chat-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 4px;
            font-weight: 800;
        }

        .hero-card,
        .modal-shell {
            background:
                linear-gradient(180deg, rgba(11, 21, 40, 0.96), rgba(5, 9, 18, 0.92)),
                radial-gradient(circle at top, rgba(96,165,250,0.16), transparent 38%);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 26px 60px rgba(2, 6, 23, 0.52);
        }

        .hero-stripe {
            height: 0.45rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
        }

        .stream-icon {
            width: 5.6rem;
            height: 5.6rem;
            margin: 0 auto;
            border-radius: 1.6rem;
            display: grid;
            place-items: center;
            font-size: 3rem;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.32), transparent 34%),
                linear-gradient(145deg, rgba(59,130,246,0.65), rgba(168,85,247,0.52));
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 16px 34px rgba(59, 130, 246, 0.26);
        }

        .feature-card,
        .summary-card {
            background: linear-gradient(180deg, rgba(20, 31, 53, 0.74), rgba(10, 18, 33, 0.92));
            border: 1px solid rgba(148, 163, 184, 0.12);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .start-button,
        .action-button {
            border: none;
            cursor: pointer;
            font-family: 'Bangers', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
        }

        .start-button {
            background: linear-gradient(90deg, #67e8f9, #60a5fa, #c084fc);
            color: #08101d;
            box-shadow: 0 20px 36px rgba(96, 165, 250, 0.28);
        }

        .action-button {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: #fff;
            box-shadow: 0 18px 34px rgba(79, 70, 229, 0.28);
        }

        .start-button:hover,
        .action-button:hover { filter: brightness(1.06); transform: translateY(-1px); }
        .start-button:active,
        .action-button:active { transform: scale(0.97); }

        .stream-title { line-height: 0.9; }
        .arcade-gradient-text {
            background-image: linear-gradient(90deg, #7dd3fc, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-label,
        .micro-label {
            font-family: 'Bangers', 'Exo 2', sans-serif;
        }

        /* Animations */
        @keyframes slideIn {
            from { transform: translateX(-20px) scale(0.9); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }

        @keyframes mascotPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.04); }
        }

        .animate-float-up { animation: floatUp 1.2s ease-out forwards; }

        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }

        /* No scrollbars */
        ::-webkit-scrollbar { display: none; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

        @media (max-width: 640px) {
            #hud { padding: 0.75rem; gap: 0.5rem; }
            #chat-container { left: 0.75rem; bottom: 0.75rem; }
            .text-xl { font-size: 1.15rem; }
            .text-lg { font-size: 1rem; }
            .p-8 { padding: 1.5rem; }
            .py-4 { padding-top: 0.85rem; padding-bottom: 0.85rem; }
            .px-8 { padding-left: 1.2rem; padding-right: 1.2rem; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full overflow-hidden bg-slate-900">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col pointer-events-none safe-area-inset">
            
            <!-- HUD Top -->
                <div id="hud" class="absolute top-0 left-0 w-full p-3 flex flex-col gap-2 z-20 hidden">
                <!-- Top Row: Stats -->
                <div class="flex justify-between items-start w-full">
                    <!-- Left: Money & Health -->
                    <div class="flex flex-col gap-2">
                        <div class="glass-panel score-pill px-3 py-1.5 rounded-full flex items-center gap-2">
                            <span class="text-green-400 text-lg">💵</span>
                            <span id="score" class="text-lg font-bold text-white tracking-wide font-data">$0</span>
                        </div>
                        <div class="glass-panel score-pill px-3 py-1.5 rounded-full flex items-center gap-2 w-32">
                            <span class="text-red-400 text-sm">❤️</span>
                            <div class="flex-1 h-2 health-track">
                                <div id="health-bar" class="h-full w-full transition-all duration-300"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Followers -->
                    <div class="glass-panel followers-panel px-4 py-2 rounded-2xl flex flex-col items-end">
                        <div class="flex items-center gap-1.5">
                            <span class="text-blue-400 text-xl">👥</span>
                            <span id="followers" class="text-xl font-bold text-white tracking-tight font-data">0</span>
                        </div>
                        <div class="flex items-center gap-1 mt-1">
                            <span id="verified-badge" class="hidden verified-pill text-[10px] bg-blue-500 text-white px-1.5 py-0.5 rounded-full font-bold shadow-lg status-label">VERIFIED ✓</span>
                            <span id="multiplier" class="text-[10px] text-blue-200 uppercase tracking-wider font-bold status-label">1.0x HYPE</span>
                        </div>
                    </div>
                </div>

                <!-- Game Status Notification -->
                <div id="game-status" class="self-center mt-2 glass-panel status-pill px-4 py-1.5 rounded-full bg-purple-900/60 transform transition-all duration-500 opacity-0 translate-y-[-20px]">
                    <span class="text-[10px] text-purple-200 uppercase tracking-widest status-label">Now Playing</span>
                    <span id="current-game-name" class="text-sm font-bold text-white ml-2 font-tech">Just Chatting</span>
                </div>
            </div>

            <!-- CHAT OVERLAY (Enhanced) -->
            <div id="chat-container" class="absolute bottom-4 left-4 w-64 h-64 flex flex-col justify-end pointer-events-none z-10 hidden">
                <div class="chat-shell chat-mask w-full h-full flex flex-col justify-end overflow-hidden p-2 space-y-1.5" id="chat-messages">
                    <!-- Messages injected here -->
                </div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="absolute inset-0 flex items-center justify-center pointer-events-auto z-50 bg-black/70 backdrop-blur-sm">
                <div class="hero-card glass-panel p-8 rounded-3xl text-center max-w-sm mx-4 shadow-2xl relative overflow-hidden">
                    <div class="hero-stripe absolute top-0 left-0 w-full"></div>
                    <div class="stream-icon mb-6 animate-bounce">📡</div>
                    <h1 class="stream-title text-4xl font-black text-white mb-2 tracking-tight font-display">STREAMER<br><span class="arcade-gradient-text">RUSH</span></h1>
                    <p class="text-gray-300 text-sm mb-8 leading-relaxed font-medium">
                        Swipe to catch <span class="text-green-400">Donations</span> & <span class="text-blue-400">Subs</span>.<br>
                        Keep the Chat Hype alive!
                    </p>
                    
                    <div class="grid grid-cols-2 gap-3 mb-8">
                        <div class="feature-card p-3 rounded-xl border">
                            <div class="text-2xl mb-1">🎮</div>
                            <div class="text-[10px] text-gray-400 uppercase font-bold micro-label">Switch Games</div>
                        </div>
                        <div class="feature-card p-3 rounded-xl border">
                            <div class="text-2xl mb-1">💬</div>
                            <div class="text-[10px] text-gray-400 uppercase font-bold micro-label">Chat Reacts</div>
                        </div>
                    </div>

                    <button id="start-btn" class="start-button w-full font-black py-4 px-8 rounded-2xl shadow-xl transition-all text-lg uppercase tracking-wide">
                        Go Live Now
                    </button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center pointer-events-auto z-50 bg-black/90 backdrop-blur-md">
                <div class="modal-shell glass-panel p-8 rounded-3xl text-center max-w-sm mx-4 w-full">
                    <h2 class="text-5xl font-black text-white mb-1 font-display">OFFLINE</h2>
                    <p class="text-red-400 font-bold mb-8 uppercase tracking-widest text-[10px] status-label">Stream Ended</p>
                    
                    <div class="summary-card bg-slate-800 rounded-2xl p-6 mb-8 border">
                        <div class="flex justify-between items-end mb-4 border-b border-slate-700 pb-4">
                            <div class="text-left">
                                <div class="text-[10px] text-gray-500 uppercase font-bold status-label">Total Earnings</div>
                                <div class="text-2xl text-green-400 font-black font-data" id="finalScore">$0</div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] text-gray-500 uppercase font-bold status-label">New Subs</div>
                                <div class="text-2xl text-blue-400 font-black font-data" id="finalFollowers">0</div>
                            </div>
                        </div>
                        <div id="final-verified" class="hidden verified-pill bg-blue-500/20 text-blue-300 py-2 rounded-lg text-sm font-bold border status-label">
                            Verified Streamer! ✅
                        </div>
                    </div>

                    <button id="restart-btn" class="action-button w-full font-bold py-4 px-8 rounded-2xl shadow-lg transition-all text-lg">
                        Start New Stream
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. CONFIG & ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3",
            sfx: {
                coin: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                verify: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
                switch: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3"
            },
            gifs: {
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp",
                verified: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp"
            }
        };

        const GAMES_LIST = [
            { name: "Just Chatting", color: "#a855f7", icon: "💬" },
            { name: "Block Craft", color: "#22c55e", icon: "⛏️" },
            { name: "Space Shooter", color: "#3b82f6", icon: "🚀" },
            { name: "Horror Mansion", color: "#ef4444", icon: "👻" },
            { name: "Battle Royale", color: "#f59e0b", icon: "🔫" }
        ];

        // Advanced Chat Data
        const CHAT_DATA = {
            users: [
                { name: "NinjaFan99", color: "#ef4444" },
                { name: "CozyVibes", color: "#f9a8d4" },
                { name: "SpeedRunnerX", color: "#3b82f6" },
                { name: "PixelArtist", color: "#a855f7" },
                { name: "Mod_Steve", color: "#22c55e", badge: "⚔️" },
                { name: "Sub_Sarah", color: "#f59e0b", badge: "⭐" },
                { name: "Lurker_01", color: "#94a3b8" },
                { name: "ProGamer", color: "#fbbf24" }
            ],
            comments: {
                generic: ["Hi youtube", "First", "Notice me", "Cool stream", "Hello from Brazil", "Is this live?", "Setup specs?"],
                good: ["POG", "NICE", "PRO", "EZ CLAP", "Rich!", "Stonks 📈", "GIGACHAD", "Insane plays"],
                bad: ["F", "RIP", "Lag?", "Oof", "Missed it", "Sadge", "Throwing?", "?????"],
                verified: ["VERIFIED POG", "OMG 100K", "FAMOUS", "LETS GOOO", "KING 👑", "W STREAMER"],
                hype: ["HYPE HYPE", "TRAIN 🚂", "LETS GO", "DONT STOP", "🔥🔥🔥"]
            }
        };

        /** 2. SYSTEMS */
        
        // Audio System
        const audio = {
            bgm: new Audio(ASSETS.bgm),
            sfx: {},
            enabled: false,
            lastPlayed: {},
            init: function() {
                this.bgm.loop = true;
                this.bgm.volume = 0.18;
                this.bgm.preload = 'auto';
                Object.keys(ASSETS.sfx).forEach(k => {
                    const sound = new Audio(ASSETS.sfx[k]);
                    sound.preload = 'auto';
                    this.sfx[k] = sound;
                });
            },
            unlock: function() {
                this.enabled = true;
            },
            playBGM: function() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(()=>{});
            },
            stopBGM: function() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            },
            playSFX: function(k, { volume = 0.42, cooldown = 80 } = {}) {
                if (!this.enabled || !this.sfx[k]) return;
                const now = performance.now();
                if (this.lastPlayed[k] && now - this.lastPlayed[k] < cooldown) return;
                this.lastPlayed[k] = now;
                const s = this.sfx[k].cloneNode();
                s.volume = volume;
                s.play().catch(()=>{});
            }
        };
        audio.init();

        // Advanced Chat System
        const feedbackOverlay = document.createElement('div');
        feedbackOverlay.id = 'feedback-overlay';
        feedbackOverlay.className = 'absolute right-4 bottom-4 w-32 h-32 pointer-events-none z-20 hidden';
        feedbackOverlay.innerHTML = `
            <img id="reaction-gif" alt="" class="w-full h-full rounded-2xl border border-slate-700 shadow-xl opacity-0 transition-all duration-500" />
            <div id="reaction-label" class="absolute bottom-0 left-0 right-0 text-center text-[10px] uppercase tracking-widest status-label bg-black/70 text-white py-0.5 rounded-lg">react</div>
        `;
        document.getElementById('game-container').appendChild(feedbackOverlay);
        const reactionGif = document.getElementById('reaction-gif');
        const reactionLabel = document.getElementById('reaction-label');
        let reactionTimer = null;

        function showReaction(type, label) {
            const gifUrl = ASSETS.gifs[type];
            if (!gifUrl || !reactionGif) return;
            feedbackOverlay.classList.remove('hidden');
            reactionGif.src = gifUrl;
            reactionGif.style.opacity = '1';
            reactionLabel.textContent = label;
            clearTimeout(reactionTimer);
            reactionTimer = setTimeout(() => {
                reactionGif.style.opacity = '0';
                feedbackOverlay.classList.add('hidden');
            }, 1800);
        }

        const Chat = {
            el: document.getElementById('chat-messages'),
            timer: null,
            
            // Generate a random user
            getUser: function() {
                return CHAT_DATA.users[Math.floor(Math.random() * CHAT_DATA.users.length)];
            },

            // Add a message to the DOM
            add: function(type, content, extra = {}) {
                const user = this.getUser();
                const msg = document.createElement('div');
                msg.className = 'chat-msg flex items-start text-sm leading-tight';
                
                // Styles based on type
                let innerHTML = '';
                
                if (type === 'donation') {
                    // Donation Style
                    msg.classList.add('bg-green-500/20', 'border-l-2', 'border-green-400', 'p-1', 'rounded-r');
                    innerHTML = `
                        <div class="flex flex-col w-full">
                            <div class="flex items-center gap-1">
                                <span class="font-bold text-green-300 text-xs">${user.name}</span>
                                <span class="text-green-400 font-bold text-xs ml-auto">$${extra.amount}</span>
                            </div>
                            <span class="text-white/90 text-xs italic">"Keep it up!"</span>
                        </div>
                    `;
                } else if (type === 'sub') {
                    // Sub Style
                    msg.classList.add('bg-blue-500/20', 'border-l-2', 'border-blue-400', 'p-1', 'rounded-r');
                    innerHTML = `
                        <div class="flex items-center gap-1 w-full">
                            <span class="chat-badge bg-blue-500 text-white">★</span>
                            <span class="font-bold text-blue-300 text-xs">${user.name}</span>
                            <span class="text-blue-100 text-xs ml-1">Subscribed!</span>
                        </div>
                    `;
                } else if (type === 'system') {
                    // Game System Message
                    innerHTML = `
                            <span class="font-bold text-purple-400 uppercase text-[10px] tracking-wider ml-2 status-label">SYSTEM</span>
                        <span class="text-purple-200 font-bold">${content}</span>
                    `;
                } else {
                    // Normal Chat
                    const badge = user.badge ? `<span class="chat-badge bg-gray-700 text-white">${user.badge}</span>` : '';
                    const color = user.color || '#cbd5e1';
                    innerHTML = `
                        <div class="break-words w-full shadow-black drop-shadow-md">
                            ${badge}
                            <span class="font-bold mr-1" style="color:${color}">${user.name}:</span>
                            <span class="text-white/90 font-medium">${content}</span>
                        </div>
                    `;
                }

                msg.innerHTML = innerHTML;
                this.el.appendChild(msg);

                // Cleanup old messages
                if(this.el.children.length > 8) {
                    this.el.removeChild(this.el.firstChild);
                }
                
                // Auto scroll is handled by flex-col-reverse logic visually, but here we append to end
                // We want the newest at the bottom.
            },

            // Trigger specific events
            trigger: function(event, value) {
                if (event === 'money') {
                    this.add('donation', '', { amount: value });
                } else if (event === 'follower') {
                    // Only show sub message sometimes to avoid spam
                    if (Math.random() < 0.3) this.add('sub', '');
                    else this.react('good');
                } else if (event === 'damage') {
                    // Spam F
                    for(let i=0; i<3; i++) setTimeout(() => this.react('bad'), i*100);
                } else if (event === 'switch') {
                    this.add('system', `Switching to ${value}...`);
                    setTimeout(() => this.react('hype'), 500);
                } else if (event === 'verified') {
                    for(let i=0; i<5; i++) setTimeout(() => this.react('verified'), i*150);
                }
            },

            react: function(category) {
                const pool = CHAT_DATA.comments[category] || CHAT_DATA.comments.generic;
                const txt = pool[Math.floor(Math.random() * pool.length)];
                this.add('chat', txt);
            },

            startLoop: function() {
                if(this.timer) clearInterval(this.timer);
                // Speed depends on followers in gameLoop, but base loop here
                this.timer = setInterval(() => {
                    if(Math.random() > 0.3) this.react('generic');
                }, 2000);
            },
            
            stop: function() {
                if(this.timer) clearInterval(this.timer);
            }
        };

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let state = {
            active: false,
            score: 0,
            followers: 0,
            health: 100,
            verified: false,
            gameIndex: 0,
            gameSwitchTimer: 0,
            frameCount: 0
        };

        let player = { x: 0, y: 0, width: 80, height: 80, targetX: 0 };
        let entities = [];
        let particles = [];
        let floaters = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 160; // Lifted up slightly for bottom UI safety
            if(!state.active) player.x = width/2 - player.width/2;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GAME LOGIC */
        
        function switchGame() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * GAMES_LIST.length);
            } while(newIndex === state.gameIndex);
            
            state.gameIndex = newIndex;
            const game = GAMES_LIST[state.gameIndex];
            
            // UI Feedback
            const badge = document.getElementById('game-status');
            document.getElementById('current-game-name').innerText = game.name;
            badge.classList.remove('opacity-0', 'translate-y-[-20px]');
            badge.style.borderColor = game.color;
            
            audio.playSFX('switch', { volume: 0.3, cooldown: 120 });
            Chat.trigger('switch', game.name);
            
            // Hide badge after 3s
            setTimeout(() => {
                badge.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        }

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.emoji = ['❤️', '👍', '🔥', '😂', '💎'][Math.floor(Math.random()*5)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                if (this.type === 'emoji') {
                    ctx.font = "20px Arial";
                    ctx.fillText(this.emoji, this.x, this.y);
                } else {
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        }

        class Floater {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 50;
                this.vy = -3;
            }
            update() {
                this.y += this.vy;
                this.life--;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life/50);
                ctx.fillStyle = this.color;
                ctx.font = "700 24px 'Exo 2'";
                ctx.strokeStyle = "black";
                ctx.lineWidth = 4;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        class Item {
            constructor() {
                this.size = 56;
                this.x = Math.random() * (width - this.size);
                this.y = -80;
                // Difficulty scaling
                this.speed = 6 + Math.random() * 3 + (state.followers / 40000); 
                this.angle = 0;
                this.spin = (Math.random() - 0.5) * 0.2;
                
                const rand = Math.random();
                if (rand < 0.2) {
                    this.type = 'hater';
                    this.val = -20;
                    this.icon = '😡';
                } else if (rand < 0.45) {
                    this.type = 'follower';
                    this.val = 500 + Math.floor(Math.random() * 1000);
                    this.icon = '➕'; // Follower Icon
                } else {
                    this.type = 'money';
                    this.val = 10 + Math.floor(Math.random() * 50);
                    this.icon = rand > 0.8 ? '💎' : '💵';
                }
            }
            update() {
                this.y += this.speed;
                this.angle += this.spin;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.size/2, this.y + this.size/2);
                ctx.rotate(this.angle);
                ctx.font = "48px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.type === 'hater' ? 'red' : (this.type === 'follower' ? 'cyan' : 'lime');
                ctx.fillText(this.icon, 0, 0);
                ctx.restore();
            }
        }

        function initGame() {
            state.active = true;
            state.score = 0;
            state.followers = 0;
            state.health = 100;
            state.verified = false;
            state.gameIndex = 0;
            state.frameCount = 0;
            state.gameSwitchTimer = 0;
            state.warnedLowHealth = false;
            
            entities = [];
            particles = [];
            floaters = [];
            
            player.x = width/2 - player.width/2;
            player.targetX = player.x;
            
            // Reset UI
            document.getElementById('verified-badge').classList.add('hidden');
            document.getElementById('game-status').classList.add('opacity-0');
            Chat.el.innerHTML = '';
            Chat.add('system', 'Stream Started! Good Luck!');
            Chat.startLoop();
            
            updateUI();
        }

        function updateUI() {
            document.getElementById('score').innerText = `$${Math.floor(state.score).toLocaleString()}`;
            
            let fText = state.followers;
            if(state.followers >= 1000000) fText = (state.followers/1000000).toFixed(1) + 'M';
            else if(state.followers >= 1000) fText = (state.followers/1000).toFixed(1) + 'k';
            document.getElementById('followers').innerText = fText;
            
            document.getElementById('health-bar').style.width = `${Math.max(0, state.health)}%`;
            
            const mult = 1 + Math.floor(state.followers / 10000) * 0.1;
            document.getElementById('multiplier').innerText = `${mult.toFixed(1)}x HYPE`;
        }

        function checkUnlocks() {
            if (!state.verified && state.followers >= 100000) {
                state.verified = true;
                document.getElementById('verified-badge').classList.remove('hidden');
                audio.playSFX('verify', { volume: 0.45, cooldown: 250 });
                Chat.trigger('verified');
                showReaction('verified', 'verified');
                floaters.push(new Floater(width/2, height/2, "VERIFIED!", "#3b82f6"));
                
                // Explosion
                for(let i=0; i<40; i++) {
                    particles.push(new Particle(width/2, height/2, 'star'));
                }
            }
        }

        function gameLoop() {
            if(!state.active) return;
            
            ctx.clearRect(0, 0, width, height);
            state.frameCount++;
            
            // 1. Background
            const currentGame = GAMES_LIST[state.gameIndex];
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0f172a');
            gradient.addColorStop(1, currentGame.color + '33'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 2. Logic Updates
            state.gameSwitchTimer++;
            if (state.gameSwitchTimer > 1000) { 
                switchGame();
                state.gameSwitchTimer = 0;
            }

            // Chat Auto-Spam based on Hype
            if (state.frameCount % Math.max(20, 120 - Math.floor(state.followers/2000)) === 0) {
                Chat.react('generic');
            }

            if (state.health <= 35 && !state.warnedLowHealth) {
                state.warnedLowHealth = true;
                audio.playSFX('warning', { volume: 0.32, cooldown: 500 });
            } else if (state.health > 35) {
                state.warnedLowHealth = false;
            }

            // Player Movement
            player.x += (player.targetX - player.x) * 0.15;
            
             // Draw Player
             ctx.save();
             ctx.translate(player.x, player.y);

             const bob = Math.sin(state.frameCount * 0.16) * 2;
             const pulse = 0.92 + Math.sin(state.frameCount * 0.08) * 0.04;
             ctx.translate(0, bob);

             // Neon aura
             const aura = ctx.createRadialGradient(40, 38, 10, 40, 38, 60);
             aura.addColorStop(0, currentGame.color + '66');
             aura.addColorStop(1, 'transparent');
             ctx.fillStyle = aura;
             ctx.beginPath();
             ctx.arc(40, 40, 54, 0, Math.PI * 2);
             ctx.fill();

             // Body shell
             ctx.fillStyle = currentGame.color;
             ctx.shadowColor = currentGame.color;
             ctx.shadowBlur = 30;
             ctx.beginPath();
             ctx.roundRect(2, 4, player.width - 4, player.height - 6, 24);
             ctx.fill();
             ctx.shadowBlur = 0;

             // Screen bezel
             const bezel = ctx.createLinearGradient(8, 8, 64, 72);
             bezel.addColorStop(0, '#172554');
             bezel.addColorStop(1, '#0f172a');
             ctx.fillStyle = bezel;
             ctx.beginPath();
             ctx.roundRect(8, 10, player.width - 16, player.height - 22, 18);
             ctx.fill();

             // Face glow
             const screenGlow = ctx.createLinearGradient(16, 18, 58, 58);
             screenGlow.addColorStop(0, 'rgba(125, 211, 252, 0.95)');
             screenGlow.addColorStop(1, 'rgba(216, 180, 254, 0.88)');
             ctx.fillStyle = screenGlow;
             ctx.globalAlpha = 0.22;
             ctx.beginPath();
             ctx.roundRect(14, 16, player.width - 28, player.height - 34, 14);
             ctx.fill();
             ctx.globalAlpha = 1;

             // Broadcast ring
             ctx.strokeStyle = 'rgba(255,255,255,0.28)';
             ctx.lineWidth = 2;
             ctx.beginPath();
             ctx.arc(40, 14, 8 + pulse * 3, Math.PI, Math.PI * 2);
             ctx.stroke();

             // Eyes
             if (state.health < 30) {
                 ctx.strokeStyle = '#f8fafc';
                 ctx.lineWidth = 3;
                 ctx.beginPath();
                 ctx.moveTo(22, 32); ctx.lineTo(30, 40);
                 ctx.moveTo(30, 32); ctx.lineTo(22, 40);
                 ctx.moveTo(50, 32); ctx.lineTo(58, 40);
                 ctx.moveTo(58, 32); ctx.lineTo(50, 40);
                 ctx.stroke();
             } else {
                 ctx.fillStyle = '#f8fafc';
                 ctx.beginPath();
                 ctx.ellipse(26, 36, 5, 7, 0, 0, Math.PI * 2);
                 ctx.ellipse(54, 36, 5, 7, 0, 0, Math.PI * 2);
                 ctx.fill();

                 ctx.fillStyle = '#0f172a';
                 ctx.beginPath();
                 ctx.arc(27, 37, 2.2, 0, Math.PI * 2);
                 ctx.arc(55, 37, 2.2, 0, Math.PI * 2);
                 ctx.fill();
             }

             // Mouth expression
             ctx.strokeStyle = state.health < 30 ? '#fda4af' : '#f8fafc';
             ctx.lineWidth = 3;
             ctx.beginPath();
             if (state.health < 30) {
                 ctx.arc(40, 52, 8, Math.PI, Math.PI * 2, true);
             } else {
                 ctx.arc(40, 48, 9, 0.15, Math.PI - 0.15);
             }
             ctx.stroke();

             // Side accents
             ctx.fillStyle = 'rgba(255,255,255,0.16)';
             ctx.fillRect(14, 20, 4, 26);
             ctx.fillRect(62, 20, 4, 26);

             // Signature game icon badge
             ctx.fillStyle = 'rgba(8, 15, 29, 0.8)';
             ctx.beginPath();
             ctx.roundRect(40, 58, 24, 16, 8);
             ctx.fill();
             ctx.font = "700 16px 'Exo 2'";
             ctx.fillStyle = '#fff';
             ctx.fillText(currentGame.icon, 45, 71);

             ctx.restore();

            // 3. Spawning
            if (Math.random() < 0.035) entities.push(new Item());

            // 4. Entities Loop
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.update();
                
                // Collision
                if (
                    e.x < player.x + player.width &&
                    e.x + e.size > player.x &&
                    e.y < player.y + player.height &&
                    e.y + e.size > player.y
                ) {
                    if (e.type === 'hater') {
                        state.health -= 25;
                        audio.playSFX('fail', { volume: 0.42, cooldown: 120 });
                        Chat.trigger('damage');
                        showReaction('fail', 'hater raid');
                        floaters.push(new Floater(player.x, player.y - 50, "HATER!", "red"));
                        // Screen Shake
                        canvas.style.transform = `translate(${Math.random()*16-8}px, ${Math.random()*16-8}px)`;
                        setTimeout(()=>canvas.style.transform='none', 60);
                    } else {
                        // Good item
                        if (e.type === 'follower') {
                            state.followers += e.val;
                            floaters.push(new Floater(player.x, player.y - 50, `+${e.val} Subs`, "cyan"));
                            Chat.trigger('follower');
                        } else {
                            // Money
                            let gain = e.val * (1 + Math.floor(state.followers / 10000) * 0.1);
                            state.score += gain;
                            floaters.push(new Floater(player.x, player.y - 50, `+$${Math.floor(gain)}`, "lime"));
                            Chat.trigger('money', Math.floor(gain));
                        }
                        audio.playSFX('coin', { volume: 0.34, cooldown: 70 });
                        
                        // Particles
                        for(let k=0; k<6; k++) particles.push(new Particle(player.x + 40, player.y, 'star'));
                    }
                    
                    checkUnlocks();
                    updateUI();
                    entities.splice(i, 1);
                    
                    if(state.health <= 0) gameOver();
                    continue;
                }
                
                if (e.y > height) entities.splice(i, 1);
                else e.draw(ctx);
            }

            // 5. FX Loop
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            
            for (let i = floaters.length - 1; i >= 0; i--) {
                floaters[i].update();
                floaters[i].draw(ctx);
                if(floaters[i].life <= 0) floaters.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state.active = false;
            audio.playSFX('gameOver', { volume: 0.45, cooldown: 250 });
            audio.stopBGM();
            Chat.stop();
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('chat-container').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            
            document.getElementById('finalScore').innerText = `$${Math.floor(state.score).toLocaleString()}`;
            document.getElementById('finalFollowers').innerText = state.followers.toLocaleString();
            
            if (state.verified) document.getElementById('final-verified').classList.remove('hidden');
            else document.getElementById('final-verified').classList.add('hidden');
        }

        /** 5. INPUT */
        function handleInput(e) {
            if(!state.active) return;
            e.preventDefault();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            player.targetX = cx - player.width/2;
            if(player.targetX < 0) player.targetX = 0;
            if(player.targetX > width - player.width) player.targetX = width - player.width;
        }
        canvas.addEventListener('touchmove', handleInput, {passive:false});
        canvas.addEventListener('touchstart', handleInput, {passive:false});
        canvas.addEventListener('mousemove', handleInput);

        // Buttons
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.36, cooldown: 150 });
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            audio.playBGM();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.36, cooldown: 150 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            audio.playBGM();
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
