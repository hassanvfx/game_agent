<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Overlord's Choice: The Interview</title>
    <!-- [agent-note][stage3] resolved-font: primary-title -> Creepster, secondary-ui -> Rajdhani, accent-hud -> Press Start 2P via catalogs/fonts.json -->
    <style>
        /* [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | roles: display=Creepster, ui=Rajdhani, hud=Press Start 2P */
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-dark: #0b0614;
            --bg-vignette: rgba(6, 2, 12, 0.96);
            --panel-bg: linear-gradient(180deg, rgba(30, 12, 47, 0.92) 0%, rgba(14, 6, 26, 0.96) 100%);
            --panel-border: rgba(255, 109, 197, 0.2);
            --panel-glow: rgba(255, 68, 150, 0.24);
            --text-main: #fdf7ff;
            --text-muted: #ddd2f3;
            --text-subtle: #998dba;
            --accent-red: #ff4d6d;
            --accent-pink: #ff4fc8;
            --accent-cyan: #69e7ff;
            --accent-al: #ff7849;
            --accent-gold: #ffd166;
            --font-primary: 'Rajdhani', system-ui, sans-serif;
            --font-display: 'Creepster', fantasy, cursive;
            --font-hud: 'Press Start 2P', 'Courier New', monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 79, 200, 0.16), transparent 32%),
                radial-gradient(circle at 85% 18%, rgba(105, 231, 255, 0.14), transparent 22%),
                linear-gradient(180deg, #13091f 0%, var(--bg-dark) 62%, #05030a 100%);
            color: var(--text-main);
            font-family: var(--font-primary);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.84);
            pointer-events: auto;
            z-index: 50;
        }

        .glass-panel {
            width: min(100%, 520px);
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.03) inset, 0 0 28px var(--panel-glow);
            border-radius: 28px;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 40%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 10px);
            pointer-events: none;
            opacity: 0.85;
        }

        .glass-panel > * {
            position: relative;
            z-index: 1;
        }

        #start-screen .glass-panel {
            text-align: center;
            border-top: 4px solid #dc2626;
        }

        .title-display,
        .ending-display {
            font-family: var(--font-display);
        }

        #dialogue-text {
            font-family: var(--font-primary);
        }

        .title-display {
            margin: 0 0 8px;
            color: #ff86da;
            font-size: clamp(2.4rem, 6vw, 3.8rem);
            line-height: 0.95;
            letter-spacing: 0.06em;
            text-shadow: 0 0 10px rgba(255, 0, 102, 0.45), 0 0 24px rgba(255, 79, 200, 0.28);
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--text-muted);
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .primary-btn {
            width: 100%;
            padding: 16px 24px;
            border-radius: 999px;
            border: 1px solid rgba(255, 173, 214, 0.75);
            background: linear-gradient(90deg, #7f1dff, #ff3d81 54%, #ff7a45);
            color: #fffdfd;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 22px rgba(255, 79, 200, 0.24);
        }

        .primary-btn:hover,
        .primary-btn:focus-visible {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.05);
        }

        .start-note {
            margin: 18px 0 0;
            color: var(--text-subtle);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #game-ui {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            width: 100%;
            padding:
                max(24px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(32px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
            pointer-events: auto;
        }

        .hud-strip {
            align-self: center;
            width: min(100%, 960px);
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 0 auto 12px;
            padding: 10px 12px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(19, 7, 31, 0.82), rgba(10, 4, 18, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
            font-family: var(--font-hud);
            font-size: clamp(0.5rem, 2vw, 0.68rem);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .hud-pill {
            flex: 1;
            min-width: 0;
            text-align: center;
            padding: 8px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .hud-pill span {
            display: block;
            margin-top: 6px;
            font-size: 1.05em;
        }

        .hud-pill.val span { color: #ff86da; }
        .hud-pill.vox span { color: #69e7ff; }
        .hud-pill.al span { color: #ffb066; }

        .dialogue-box {
            position: relative;
            width: min(100%, 960px);
            margin: 0 auto 16px;
            padding: 28px 24px 24px;
            border-radius: 20px;
            background:
                linear-gradient(180deg, rgba(18, 6, 31, 0.92) 0%, rgba(11, 4, 20, 0.95) 100%);
            border: 1px solid rgba(255, 109, 197, 0.18);
            border-top: 2px solid var(--accent-pink);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 22px rgba(255, 79, 200, 0.12);
        }

        #speaker-name {
            position: absolute;
            top: -16px;
            left: 24px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #dc2626;
            text-transform: uppercase;
        }

        #dialogue-text {
            margin: 0;
            min-height: 60px;
            font-size: clamp(1.08rem, 2.8vw, 1.42rem);
            line-height: 1.5;
            font-weight: 600;
        }

        #choices-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: min(100%, 960px);
            margin: 0 auto;
        }

        .choice-btn {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(180deg, rgba(31, 18, 47, 0.88), rgba(15, 8, 24, 0.96));
            color: #fff;
            text-align: left;
            backdrop-filter: blur(6px);
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.22);
            font-weight: 600;
        }

        .choice-btn:hover,
        .choice-btn:focus-visible {
            padding-left: 24px;
            transform: translateY(-1px);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        .choice-prefix {
            display: inline-block;
            width: 18px;
            opacity: 0.5;
            margin-right: 8px;
        }

        .style-val:hover,
        .style-val:focus-visible {
            background: var(--accent-pink);
            border-color: #ff99cc;
            color: white;
            box-shadow: 0 0 15px var(--accent-pink);
        }

        .style-vox:hover,
        .style-vox:focus-visible {
            background: var(--accent-cyan);
            border-color: #ccffff;
            color: black;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .style-al:hover,
        .style-al:focus-visible {
            background: var(--accent-al);
            border-color: #ffaaaa;
            color: white;
            box-shadow: 0 0 15px var(--accent-al);
        }

        .feedback-stack {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            width: min(34vw, 180px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
            align-items: flex-end;
        }

        .feedback-gif {
            width: 100%;
            max-width: 170px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(14, 6, 24, 0.78);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(12, 5, 20, 0.84);
            color: var(--text-muted);
            font-family: var(--font-hud);
            font-size: clamp(0.42rem, 1.6vw, 0.58rem);
            line-height: 1.5;
            text-align: center;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-caption.active {
            opacity: 1;
            transform: translateY(0);
        }

        #ending-screen {
            background: rgba(0, 0, 0, 0.95);
        }

        #ending-panel {
            text-align: center;
            width: min(100%, 560px);
            border-radius: 22px;
        }

        #ending-title {
            color: #ffbbf0;
            text-shadow: 0 0 14px rgba(255, 79, 200, 0.26);
        }

        .ending-display {
            margin: 0 0 16px;
            font-size: clamp(2rem, 5vw, 2.8rem);
        }

        #ending-desc {
            margin: 0 0 28px;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .score-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            color: var(--text-subtle);
            font-size: 0.95rem;
            font-family: var(--font-hud);
        }

        .score-row strong {
            font-weight: 600;
            color: #f3f4f6;
        }

        .score-val { color: #ec4899; }
        .score-vox { color: #22d3ee; }
        .score-al { color: #ef4444; }

        @media (max-width: 640px) {
            .glass-panel,
            #ending-panel {
                padding: 24px 20px;
            }

            #game-ui {
                padding:
                    max(20px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(24px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
            }

            .hud-strip {
                gap: 6px;
                padding: 8px;
            }

            .dialogue-box {
                padding: 26px 16px 18px;
            }

            #speaker-name {
                left: 16px;
            }

            .choice-btn {
                padding: 14px 14px;
            }

            .feedback-stack {
                width: 112px;
                top: max(10px, env(safe-area-inset-top));
                right: max(8px, env(safe-area-inset-right));
            }

            .feedback-caption {
                font-size: 0.42rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: affection-reward + fail-reaction from catalogs/gifs.json; kept compact off-playfield for mobile safety -->
            <div class="feedback-stack" aria-live="polite">
                <img id="reaction-gif" class="feedback-gif" alt="Reaction effect overlay">
                <div id="reaction-caption" class="feedback-caption"></div>
            </div>

            <div id="start-screen" class="overlay-screen">
                <div class="glass-panel">
                    <h1 class="title-display">HELL'S STYLIST</h1>
                    <p class="subtitle">Dress for doom. Pitch for glory.</p>
                    <button id="start-btn" class="primary-btn">ENTER STUDIO</button>
                    <p class="start-note">Includes 10 unique endings</p>
                </div>
            </div>

            <div id="game-ui" class="hidden">
                <div class="hud-strip">
                    <div class="hud-pill val">VAL <span id="hud-val">00</span></div>
                    <div class="hud-pill vox">VOX <span id="hud-vox">00</span></div>
                    <div class="hud-pill al">AL <span id="hud-al">00</span></div>
                </div>

                <div class="dialogue-box">
                    <div id="speaker-name">UNKNOWN</div>
                    <p id="dialogue-text">...</p>
                </div>

                <div id="choices-container">
                    <!-- [agent-note][stage1] role: future-audio | trigger: choice-select | intent: reinforce each interview pick with sharper faction identity -->
                </div>
            </div>

            <div id="ending-screen" class="overlay-screen hidden">
                <div id="ending-panel" class="glass-panel">
                    <h2 id="ending-title" class="ending-display">ENDING TITLE</h2>
                    <div id="ending-desc">Description of fate...</div>
                    <div class="score-row">
                        <div><strong>VAL:</strong> <span id="score-val" class="score-val">0</span></div>
                        <div><strong>VOX:</strong> <span id="score-vox" class="score-vox">0</span></div>
                        <div><strong>AL:</strong> <span id="score-al" class="score-al">0</span></div>
                    </div>
                    <button id="restart-btn" class="primary-btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & CONFIG */
        const ASSETS = {
            bgm: {
                main: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
                vox: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
                val: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
                al: "https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3"
            },
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                select: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                success: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        /** 2. AUDIO ENGINE */
        class AudioController {
            constructor() {
                this.tracks = {};
                this.currentBGM = null;
                this.enabled = false;
                this.sfxPools = {};
                this.lastPlayedAt = {};

                for (const [key, url] of Object.entries(ASSETS.bgm)) {
                    const track = new Audio(url);
                    track.loop = true;
                    track.preload = 'auto';
                    track.volume = 0.2;
                    this.tracks[key] = track;
                }

                this.tracks.fail.loop = true;
                this.tracks.fail.volume = 0.2;
                this.tracks.val.volume = 0.2;
                this.tracks.vox.volume = 0.2;
                this.tracks.al.volume = 0.2;

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    this.sfxPools[key] = Array.from({ length: 3 }, () => {
                        const audio = new Audio(url);
                        audio.preload = 'auto';
                        audio.volume = key === 'fail' ? 0.5 : 0.58;
                        if (key === 'score') audio.volume = 0.46;
                        if (key === 'success') audio.volume = 0.62;
                        return audio;
                    });
                }

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pauseCurrent();
                    } else if (this.enabled && gameState.active && this.currentBGM) {
                        this.currentBGM.play().catch(() => {});
                    }
                });
            }

            unlock() {
                if (this.enabled) return;
                this.enabled = true;
                Object.values(this.tracks).forEach(track => {
                    track.load();
                });
                Object.values(this.sfxPools).flat().forEach(sample => {
                    sample.load();
                });
            }

            pauseCurrent() {
                if (this.currentBGM) {
                    this.currentBGM.pause();
                }
            }

            stopAll() {
                Object.values(this.tracks).forEach(track => {
                    track.pause();
                    track.currentTime = 0;
                });
                this.currentBGM = null;
            }

            playBGM(key) {
                if (!this.enabled || !this.tracks[key]) return;
                if (this.currentBGM === this.tracks[key]) {
                    this.currentBGM.play().catch(() => {});
                    return;
                }

                if (this.currentBGM) {
                    this.currentBGM.pause();
                    this.currentBGM.currentTime = 0;
                }

                this.currentBGM = this.tracks[key];
                this.currentBGM.currentTime = 0;
                this.currentBGM.play().catch(() => {});
            }

            playSFX(key, cooldown = 90) {
                if (!this.enabled || !this.sfxPools[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) {
                    return;
                }
                this.lastPlayedAt[key] = now;

                const pool = this.sfxPools[key];
                const sample = pool.find(audio => audio.paused || audio.ended) || pool[0];
                try {
                    sample.currentTime = 0;
                    sample.play().catch(() => {});
                } catch (_) {}
            }
        }
        const audio = new AudioController();

        /** 3. GAME DATA (Dialogue & Logic) */
        const SCRIPT = [
            {
                speaker: "VAL", charIdx: 0,
                text: "Darling, the studio brand is slipping. What look says, 'I'm still untouchable'?",
                choices: [
                    { text: "A velvet crimson suit with gold trim.", affinity: 'val', score: 2 },
                    { text: "Something with LED screens and wires.", affinity: 'vox', score: 2 },
                    { text: "A classic 1920s pinstripe vest.", affinity: 'al', score: 2 }
                ]
            },
            {
                speaker: "VOX", charIdx: 1,
                text: "Ignore the drama. The audience graph crashed. How do we win back attention fast?",
                choices: [
                    { text: "Launch a swarm of camera drones.", affinity: 'vox', score: 2 },
                    { text: "Host a glamorous charity gala.", affinity: 'val', score: 2 },
                    { text: "Broadcast a cryptic radio signal.", affinity: 'al', score: 2 }
                ]
            },
            {
                speaker: "ALASTOR", charIdx: 2,
                text: "A proper pitch needs spectacle. What makes an audience stay glued to the show?",
                choices: [
                    { text: "A screaming radio drama!", affinity: 'al', score: 3 },
                    { text: "A 24/7 reality TV stream.", affinity: 'vox', score: -1 },
                    { text: "A private fashion runway.", affinity: 'val', score: -1 }
                ]
            },
            {
                speaker: "VAL", charIdx: 0,
                text: "Mm, now we're talking branding. Which accessory seals the persona?",
                choices: [
                    { text: "Heart-shaped glasses.", affinity: 'val', score: 3 },
                    { text: "A high-tech headset.", affinity: 'vox', score: 1 },
                    { text: "A vintage microphone.", affinity: 'al', score: 1 }
                ]
            },
            {
                speaker: "VOX", charIdx: 1,
                text: "Final pitch. Which empire should own the city's spotlight?",
                choices: [
                    { text: "VoxTek Enterprises, obviously.", affinity: 'vox', score: 3 },
                    { text: "The Radio Demon.", affinity: 'al', score: 3 },
                    { text: "Valentino Studios.", affinity: 'val', score: 3 }
                ]
            }
        ];

        /** 4. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionGif = document.getElementById('reaction-gif');
        const reactionCaption = document.getElementById('reaction-caption');
        let width, height;
        let reactionTimer = null;

        let gameState = {
            active: false,
            turn: 0,
            affinity: { val: 0, vox: 0, al: 0 },
            currentCharIdx: 0
        };

        let particles = [];
        function initParticles() {
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 3 + 1,
                    speedY: Math.random() * 0.5 + 0.1,
                    color: Math.random() > 0.5 ? '#ff0055' : (Math.random() > 0.5 ? '#00ccff' : '#ff3333')
                });
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resize);
        resize();

        function updateHud() {
            document.getElementById('hud-val').textContent = String(gameState.affinity.val).padStart(2, '0');
            document.getElementById('hud-vox').textContent = String(gameState.affinity.vox).padStart(2, '0');
            document.getElementById('hud-al').textContent = String(gameState.affinity.al).padStart(2, '0');
        }

        function showReaction(type, text) {
            const src = ASSETS.gifs[type];
            if (!src) return;
            reactionGif.src = src;
            reactionGif.alt = type === 'success' ? 'Positive reaction overlay' : 'Failure reaction overlay';
            reactionCaption.textContent = text;
            reactionGif.classList.add('active');
            reactionCaption.classList.add('active');

            clearTimeout(reactionTimer);
            reactionTimer = setTimeout(() => {
                reactionGif.classList.remove('active');
                reactionCaption.classList.remove('active');
            }, 2200);
        }

        function drawSpeakerAura(idx) {
            const centerX = width / 2;
            const centerY = height * 0.56;
            const radius = Math.min(width, height) * 0.24;

            const palettes = [
                {
                    inner: 'rgba(255, 79, 200, 0.46)',
                    outer: 'rgba(255, 153, 204, 0.02)',
                    ring: '#ff73d9',
                    face: '#ffd7f4',
                    suit: '#7a1037',
                    accent: '#ff7bb0',
                    icon: '♥'
                },
                {
                    inner: 'rgba(105, 231, 255, 0.42)',
                    outer: 'rgba(204, 255, 255, 0.02)',
                    ring: '#69e7ff',
                    face: '#d2fbff',
                    suit: '#0a3550',
                    accent: '#8ef5ff',
                    icon: '◈'
                },
                {
                    inner: 'rgba(255, 120, 73, 0.42)',
                    outer: 'rgba(255, 170, 170, 0.02)',
                    ring: '#ffae57',
                    face: '#ffe1c5',
                    suit: '#5f1710',
                    accent: '#ffd166',
                    icon: '✦'
                }
            ];

            const palette = palettes[idx] || palettes[0];
            const aura = ctx.createRadialGradient(centerX, centerY, radius * 0.1, centerX, centerY, radius);
            aura.addColorStop(0, palette.inner);
            aura.addColorStop(1, palette.outer);

            ctx.save();
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = palette.ring;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.72, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath();
            ctx.arc(centerX, centerY - radius * 0.1, radius * 0.34, 0, Math.PI * 2);
            ctx.fill();

            const headY = centerY - radius * 0.18;
            const bodyY = centerY + radius * 0.08;

            ctx.fillStyle = palette.face;
            ctx.beginPath();
            ctx.arc(centerX, headY, radius * 0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = palette.suit;
            ctx.beginPath();
            ctx.moveTo(centerX - radius * 0.28, bodyY + radius * 0.18);
            ctx.quadraticCurveTo(centerX, bodyY - radius * 0.22, centerX + radius * 0.28, bodyY + radius * 0.18);
            ctx.lineTo(centerX + radius * 0.18, bodyY + radius * 0.42);
            ctx.lineTo(centerX - radius * 0.18, bodyY + radius * 0.42);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = palette.accent;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(centerX - radius * 0.09, headY - radius * 0.02);
            ctx.lineTo(centerX - radius * 0.02, headY - radius * 0.07);
            ctx.moveTo(centerX + radius * 0.02, headY - radius * 0.07);
            ctx.lineTo(centerX + radius * 0.09, headY - radius * 0.02);
            ctx.stroke();

            ctx.fillStyle = '#1a1020';
            ctx.beginPath();
            ctx.arc(centerX - radius * 0.055, headY + radius * 0.03, radius * 0.015, 0, Math.PI * 2);
            ctx.arc(centerX + radius * 0.055, headY + radius * 0.03, radius * 0.015, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = palette.accent;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(centerX, headY + radius * 0.05, radius * 0.055, 0.2, Math.PI - 0.2, false);
            ctx.stroke();

            ctx.fillStyle = palette.accent;
            ctx.font = `${Math.max(28, radius * 0.34)}px var(--font-display)`;
            ctx.textAlign = 'center';
            ctx.fillText(palette.icon, centerX, centerY + radius * 0.12);

            ctx.restore();
        }

        /** 5. RENDER LOOP */
        function render() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);

            let grad = ctx.createLinearGradient(0, 0, 0, height);
            if (gameState.currentCharIdx === 0) {
                grad.addColorStop(0, '#2a001a');
                grad.addColorStop(1, '#000');
            } else if (gameState.currentCharIdx === 1) {
                grad.addColorStop(0, '#001a2a');
                grad.addColorStop(1, '#000');
            } else {
                grad.addColorStop(0, '#2a0a0a');
                grad.addColorStop(1, '#000');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });

            if (gameState.active) {
                drawSpeakerAura(gameState.currentCharIdx);
            }

            requestAnimationFrame(render);
        }
        render();

        /** 6. GAME LOGIC */
        function loadTurn() {
            if (gameState.turn >= SCRIPT.length) {
                calculateEnding();
                return;
            }

            const data = SCRIPT[gameState.turn];
            gameState.currentCharIdx = data.charIdx;

            const nameBox = document.getElementById('speaker-name');
            nameBox.innerText = data.speaker;

            if (data.charIdx === 0) {
                nameBox.className = "";
                nameBox.style.background = "#db2777";
                nameBox.style.color = "#ffffff";
                nameBox.style.boxShadow = "0 0 10px #ff0066";
            } else if (data.charIdx === 1) {
                nameBox.className = "";
                nameBox.style.background = "#0891b2";
                nameBox.style.color = "#000000";
                nameBox.style.boxShadow = "0 0 10px #00ccff";
            } else {
                nameBox.className = "";
                nameBox.style.background = "#b91c1c";
                nameBox.style.color = "#ffffff";
                nameBox.style.boxShadow = "0 0 10px #ff0000";
            }

            document.getElementById('dialogue-text').innerText = data.text;

            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            data.choices.forEach(choice => {
                const btn = document.createElement('button');
                const styleClass = choice.affinity === 'val' ? 'style-val' : (choice.affinity === 'vox' ? 'style-vox' : 'style-al');

                btn.className = `choice-btn ${styleClass}`;
                btn.innerHTML = `<span class="choice-prefix">></span>${choice.text}`;

                btn.onclick = () => {
                    audio.playSFX('select', 70);
                    gameState.affinity[choice.affinity] += choice.score;
                    updateHud();

                    if (choice.score > 1) {
                        audio.playSFX('score', 80);
                    }

                    if (choice.affinity === 'val' && choice.score > 1) {
                        showReaction('success', 'Val is obsessed.');
                    } else if (choice.score < 0) {
                        showReaction('fail', 'That pitch bombed.');
                    }

                    gameState.turn++;
                    loadTurn();
                };
                container.appendChild(btn);
            });
        }

        function calculateEnding() {
            gameState.active = false;
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('ending-screen').classList.remove('hidden');

            const { val, vox, al } = gameState.affinity;
            let winner = 'fail';
            let maxScore = -999;
            let title = "FIRED";
            let desc = "You failed to impress anyone. Your pitch died the moment you walked into the room.";
            let bgmKey = 'fail';

            if (val > maxScore) { maxScore = val; winner = 'val'; }
            if (vox > maxScore) { maxScore = vox; winner = 'vox'; }
            if (al > maxScore) { maxScore = al; winner = 'al'; }

            if (maxScore < 3) {
                winner = 'fail';
            }

            if (winner === 'fail') {
                title = "ENDING 1/10: EVICTED";
                desc = "None of the Overlords bought your angle. You're back on the street with no badge, no desk, and no future slot.";
                bgmKey = 'fail';
                audio.playSFX('fail', 40);
                showReaction('fail', 'Rejected by every overlord.');
            }
            else if (winner === 'val') {
                bgmKey = 'val';
                audio.playSFX('success', 40);
                showReaction('success', 'Val gives the look her blessing.');
                if (maxScore >= 8) {
                    title = "ENDING 2/10: VAL'S FAVORITE";
                    desc = "Valentino loves your instincts. You become the face behind every explosive relaunch and every dangerous new trend.";
                } else if (maxScore >= 5) {
                    title = "ENDING 3/10: STUDIO HAND";
                    desc = "Val sees potential. You stay on payroll, close to the cameras, and one mistake away from trouble.";
                } else {
                    title = "ENDING 4/10: BARELY TOLERATED";
                    desc = "Val keeps you nearby, mostly for errands and emergency touch-ups between shoots.";
                }
            }
            else if (winner === 'vox') {
                bgmKey = 'vox';
                audio.playSFX('success', 40);
                showReaction('success', 'Signal restored. Vox approves.');
                if (maxScore >= 8) {
                    title = "ENDING 5/10: VOXTEK EXECUTIVE";
                    desc = "Vox backs your strategy. You now shape the city's attention economy from the brightest control room in Hell.";
                } else if (maxScore >= 5) {
                    title = "ENDING 6/10: TECH SUPPORT";
                    desc = "Vox hires you to keep the signal alive. The drones crash often, but the access badge is real.";
                } else {
                    title = "ENDING 7/10: INTERN";
                    desc = "You get a desk, a headset, and a workload no one else wanted. Vox still forgets your name.";
                }
            }
            else if (winner === 'al') {
                bgmKey = 'al';
                audio.playSFX('success', 40);
                showReaction('success', 'Alastor finds the chaos delightful.');
                if (maxScore >= 8) {
                    title = "ENDING 8/10: RADIO CO-HOST";
                    desc = "Alastor delights in your timing. You now help package every grisly broadcast into must-hear entertainment.";
                } else if (maxScore >= 5) {
                    title = "ENDING 9/10: HOTEL GUEST";
                    desc = "Alastor spares you and keeps you close, amused by the way you sell chaos with a smile.";
                } else {
                    title = "ENDING 10/10: DINNER GUEST";
                    desc = "Alastor invites you to a private supper. The menu suggests your contract ended before dessert.";
                }
            }

            document.getElementById('ending-title').innerText = title;
            document.getElementById('ending-desc').innerText = desc;

            document.getElementById('score-val').innerText = val;
            document.getElementById('score-vox').innerText = vox;
            document.getElementById('score-al').innerText = al;

            audio.playBGM(bgmKey);
        }

        function resetGame() {
            gameState.active = true;
            gameState.turn = 0;
            gameState.affinity = { val: 0, vox: 0, al: 0 };
            gameState.currentCharIdx = 0;
            updateHud();
        }

        /** 7. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 40);

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');

            resetGame();
            audio.playBGM('main');
            loadTurn();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('restart', 40);

            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');

            resetGame();
            audio.playBGM('main');
            loadTurn();
        });

        updateHud();
    });
    </script>
</body>
</html>
