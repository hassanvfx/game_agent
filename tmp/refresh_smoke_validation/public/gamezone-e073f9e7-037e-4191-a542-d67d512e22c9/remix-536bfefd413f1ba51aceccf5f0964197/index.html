<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
<title>Throne of Petty Crowns</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E%E2%99%9B%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
:root{--ink:#1b1110;--paper:#f3dfb0;--paper2:#c99d55;--ember:#e55a32;--frost:#80d9ff;--thorn:#77c66e;--iron:#111827;--gold:#f5c76a;--shadow:rgba(0,0,0,.5);--ui:'Rajdhani',system-ui,sans-serif;--title:'Cinzel',Georgia,serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060914;color:#fff;font-family:var(--ui);touch-action:manipulation}button{font:inherit}#game{position:relative;width:100vw;height:100vh;min-height:100dvh;overflow:hidden;background:#080b12}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.layer{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 20%,rgba(229,90,50,.18),transparent 38%),rgba(3,5,12,.83);z-index:20;pointer-events:auto}.hidden{display:none!important}.panel{width:min(94vw,560px);border:2px solid rgba(245,199,106,.55);border-radius:24px;padding:24px 20px;background:linear-gradient(180deg,rgba(38,25,18,.94),rgba(15,17,23,.96));box-shadow:0 24px 60px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06);text-align:center;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:8px;border:1px dashed rgba(245,199,106,.24);border-radius:18px;pointer-events:none}.sigil-row{display:flex;gap:10px;justify-content:center;margin:8px 0 18px}.sigil{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;background:#111827;font-size:25px;box-shadow:0 0 18px rgba(245,199,106,.16)}.ember{color:var(--ember)}.frost{color:var(--frost)}.thorn{color:var(--thorn)}h1,h2{font-family:var(--title);font-weight:700;letter-spacing:.05em;line-height:1;margin:0;color:var(--gold);text-shadow:0 2px 0 #000,0 0 22px rgba(245,199,106,.28)}h1{font-size:clamp(2.15rem,9vw,4.2rem)}h2{font-size:clamp(1.7rem,7vw,3rem)}.subtitle{margin:14px auto 18px;max-width:32rem;color:#f7e7c4;font-size:clamp(1rem,3.6vw,1.22rem);line-height:1.35}.note{color:#c7b28a;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase}.primary{width:100%;min-height:54px;border:0;border-radius:999px;padding:15px 20px;color:#1c130c;background:linear-gradient(180deg,#ffe7a1,#d49a34);box-shadow:0 8px 0 #7b4b16,0 18px 30px rgba(0,0,0,.35);font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.primary:active{transform:translateY(4px);box-shadow:0 4px 0 #7b4b16,0 12px 20px rgba(0,0,0,.28)}#hud{padding:max(12px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));z-index:4}.topline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;width:min(100%,760px);margin:0 auto;pointer-events:auto}.house{min-width:0;border:1px solid rgba(245,199,106,.45);border-radius:14px;padding:7px 4px;background:linear-gradient(180deg,rgba(243,223,176,.91),rgba(191,143,70,.86));color:#21140a;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.25)}.house b{display:block;font-size:clamp(.58rem,2.7vw,.78rem);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.house span{font-family:var(--title);font-weight:700;font-size:clamp(1.05rem,5vw,1.4rem)}#council{margin-top:auto;padding:0 max(10px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));z-index:5;pointer-events:none}.dialogue{width:min(100%,760px);margin:0 auto 10px;padding:22px 16px 15px;border:1px solid rgba(245,199,106,.55);border-radius:20px;background:linear-gradient(180deg,rgba(32,24,20,.9),rgba(12,14,20,.94));box-shadow:0 16px 42px rgba(0,0,0,.48);position:relative}.speaker{position:absolute;top:-15px;left:14px;padding:5px 12px;border-radius:999px;background:#1f2937;border:1px solid currentColor;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.turn{position:absolute;top:-15px;right:14px;padding:5px 10px;border-radius:999px;background:#2b1d12;border:1px solid rgba(245,199,106,.45);font-size:.75rem;color:#f3dfb0}#text{margin:0;color:#fff7df;font-size:clamp(1.03rem,4vw,1.28rem);font-weight:600;line-height:1.34}.choices{display:grid;gap:9px;width:min(100%,760px);margin:0 auto;pointer-events:auto}.choice{width:100%;min-height:52px;padding:12px 13px;border-radius:16px;border:1px solid rgba(245,199,106,.32);background:linear-gradient(180deg,rgba(246,226,182,.96),rgba(202,157,83,.96));color:#21140a;text-align:left;font-weight:700;line-height:1.18;box-shadow:0 8px 0 rgba(75,50,21,.9),0 14px 24px rgba(0,0,0,.24);cursor:pointer}.choice:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(75,50,21,.9),0 10px 18px rgba(0,0,0,.2)}.choice small{display:block;margin-top:3px;color:#56391e;font-weight:600}.choice.ember{border-left:8px solid var(--ember)}.choice.frost{border-left:8px solid var(--frost)}.choice.thorn{border-left:8px solid var(--thorn)}#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);z-index:12;padding:10px 14px;border-radius:999px;background:rgba(7,10,18,.9);border:1px solid rgba(245,199,106,.55);color:#ffe7a1;font-weight:700;letter-spacing:.04em;opacity:0;transition:.25s;pointer-events:none;text-align:center}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.score-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px 0;color:#f3dfb0}.score-row strong{color:var(--gold)}@media (min-width:720px){.choices{grid-template-columns:1fr 1fr 1fr}.choice{min-height:84px}.dialogue{padding:24px 22px 18px}}@media (max-height:700px){h1{font-size:2rem}.panel{padding:18px 16px}.sigil{width:42px;height:42px}.dialogue{padding:18px 13px 12px}.choice{min-height:47px;padding:10px 12px}.subtitle{margin:10px auto}}
</style>
</head>
<body>
<div id="game"><canvas id="scene"></canvas><div id="toast"></div><div class="layer" id="ui">
<section id="start-screen" class="screen"><div class="panel"><div class="sigil-row"><div class="sigil ember">♛</div><div class="sigil frost">❄</div><div class="sigil thorn">♞</div></div><h1>Throne of Petty Crowns</h1><p class="subtitle">A royal Hand, three ridiculous houses, one Iron Ledger, and a winter apocalypse everyone keeps using for leverage.</p><button id="start-btn" class="primary">Open the Council</button><p class="note">Five decrees • Ten possible fates • Portrait first</p></div></section>
<section id="hud" class="hidden"><div class="topline"><div class="house ember"><b>Embercourt</b><span id="hud-ember">00</span></div><div class="house frost"><b>Frostwatch</b><span id="hud-frost">00</span></div><div class="house thorn"><b>Thornledger</b><span id="hud-thorn">00</span></div></div></section>
<section id="council" class="hidden"><div class="dialogue"><div id="speaker" class="speaker">Council</div><div id="turn" class="turn">1/5</div><p id="text">...</p></div><div id="choices" class="choices"></div></section>
<section id="ending-screen" class="screen hidden"><div class="panel"><h2 id="ending-title">Ending</h2><p id="ending-desc" class="subtitle"></p><div class="score-row"><div><strong>Ember:</strong> <span id="score-ember">0</span></div><div><strong>Frost:</strong> <span id="score-frost">0</span></div><div><strong>Thorn:</strong> <span id="score-thorn">0</span></div></div><button id="restart-btn" class="primary">Rewrite the Ledger</button></div></section>
</div></div>
<script>
(()=>{'use strict';
const SCRIPT=[
{speaker:'Queen Cindra of Embercourt',house:'ember',text:'The old king has inconveniently died during brunch. Which opening decree makes your Handship look legitimate?',choices:[{text:'Stage a dragon-lit oath ceremony with tasteful screaming.',hint:'+2 Embercourt influence',affinity:'ember',score:2},{text:'Send ravens to the Wall before the corpse cools.',hint:'+2 Frostwatch influence',affinity:'frost',score:2},{text:'Audit every cousin with a claim and a dagger budget.',hint:'+2 Thornledger influence',affinity:'thorn',score:2}]},
{speaker:'Lord Varric of Frostwatch',house:'frost',text:'The smallfolk demand reassurance, bread, and fewer flaming nobles. What spectacle buys one more week?',choices:[{text:'Release three dragons over the harbor spelling TAX RELIEF.',hint:'+2 Embercourt influence',affinity:'ember',score:2},{text:'Announce a northern defense lottery with matching cloaks.',hint:'+2 Frostwatch influence',affinity:'frost',score:2},{text:'Leak a scandal so everyone argues about shoes instead.',hint:'+2 Thornledger influence',affinity:'thorn',score:2}]},
{speaker:'Maester Sleet, Very Tired',house:'frost',text:'Blue fires flicker beyond the Wall. The dead are walking, slowly, because the budget committee tabled horses.',choices:[{text:'Fund Frostwatch and read the apocalypse memo aloud.',hint:'+3 Frostwatch influence',affinity:'frost',score:3},{text:'Hold a dragon parade; surely winter respects pageantry.',hint:'-1 Embercourt influence',affinity:'ember',score:-1},{text:'Classify the dead as an opposition rumor.',hint:'-1 Thornledger influence',affinity:'thorn',score:-1}]},
{speaker:'Lady Quill of Thornledger',house:'thorn',text:'A marriage pact could end the succession war, or at least make the seating chart funnier. Whose clause do you hide?',choices:[{text:'Promise Embercourt firstborn naming rights and a dragon prenup.',hint:'+3 Embercourt influence',affinity:'ember',score:3},{text:'Let Frostwatch inspect every wedding guest for undeath.',hint:'+1 Frostwatch influence',affinity:'frost',score:1},{text:'Give Thornledger the guest list, the locks, and plausible deniability.',hint:'+1 Thornledger influence',affinity:'thorn',score:1}]},
{speaker:'The Iron Ledger',house:'thorn',text:'Final vote. The realm needs one patron before crowns, claws, and frozen accountants devour the minutes.',choices:[{text:'Crown Embercourt: fire solves succession and most upholstery.',hint:'+3 Embercourt influence',affinity:'ember',score:3},{text:'Crown Frostwatch: winter is coming with receipts.',hint:'+3 Frostwatch influence',affinity:'frost',score:3},{text:'Crown Thornledger: the knife behind the throne files on time.',hint:'+3 Thornledger influence',affinity:'thorn',score:3}]}
];
const $=id=>document.getElementById(id), canvas=$('scene'), ctx=canvas.getContext('2d');let W=0,H=0,t=0,toastTimer=null;const state={active:false,turn:0,affinity:{ember:0,frost:0,thorn:0},currentHouse:'ember',leader:'ember'};window.__gameState=state;
class Sound{constructor(){this.ctx=null}unlock(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended')this.ctx.resume()}tone(freq=330,dur=.08,type='triangle',gain=.035){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(this.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+dur);o.stop(this.ctx.currentTime+dur)}}const sound=new Sound();
function resize(){W=canvas.width=Math.floor(innerWidth*devicePixelRatio);H=canvas.height=Math.floor(innerHeight*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize,{passive:true});resize();
function updateHud(){for(const k of ['ember','frost','thorn']){$('hud-'+k).textContent=String(state.affinity[k]).padStart(2,'0')}const order=['ember','frost','thorn'];state.leader=order.reduce((a,b)=>state.affinity[b]>state.affinity[a]?b:a,'ember')}
function toast(msg,kind){const el=$('toast');el.textContent=msg;el.style.color=kind==='bad'?'#ffc4c4':'#ffe7a1';el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1250)}
function loadTurn(){if(state.turn>=SCRIPT.length){ending();return}const d=SCRIPT[state.turn];state.currentHouse=d.house;$('speaker').textContent=d.speaker;$('speaker').className='speaker '+d.house;$('turn').textContent=(state.turn+1)+'/'+SCRIPT.length;$('text').textContent=d.text;const c=$('choices');c.innerHTML='';d.choices.forEach((ch,i)=>{const b=document.createElement('button');b.className='choice '+ch.affinity;b.innerHTML='<span>'+(i+1)+'. '+ch.text+'</span><small>'+ch.hint+'</small>';b.addEventListener('click',()=>choose(ch));c.appendChild(b)})}
function choose(ch){sound.tone(ch.score<0?150:430, ch.score<0?.16:.09, ch.score<0?'sawtooth':'triangle', ch.score<0?.028:.04);state.affinity[ch.affinity]+=ch.score;updateHud();toast((ch.score>=0?'+':'')+ch.score+' '+ch.affinity.toUpperCase()+' influence',ch.score<0?'bad':'good');state.turn++;loadTurn()}
function resetGame(){state.active=true;state.turn=0;state.affinity={ember:0,frost:0,thorn:0};state.currentHouse='ember';state.leader='ember';updateHud();loadTurn()}
function start(){sound.unlock();sound.tone(260,.06);sound.tone(392,.11);$('start-screen').classList.add('hidden');$('ending-screen').classList.add('hidden');$('hud').classList.remove('hidden');$('council').classList.remove('hidden');resetGame()}
function ending(){state.active=false;$('hud').classList.add('hidden');$('council').classList.add('hidden');$('ending-screen').classList.remove('hidden');const {ember,frost,thorn}=state.affinity;let winner='fail',max=-999,title='ENDING 1/10: EXILED TO MINUTES',desc='No house trusted your ledger. You are appointed Deputy Undersecretary of Snow Shovels and forgotten before supper.';if(ember>max){max=ember;winner='ember'}if(frost>max){max=frost;winner='frost'}if(thorn>max){max=thorn;winner='thorn'}if(max<3)winner='fail';if(winner==='ember'){sound.tone(520,.18);if(max>=8){title='ENDING 2/10: DRAGON REGENT';desc='Embercourt adores your combustible policy. You rule beside dragons, and every committee meeting now has a burn ward.'}else if(max>=5){title='ENDING 3/10: WAX-SEAL FAVORITE';desc='The dragon court keeps you close: glamorous, dangerous, and paid mostly in singed compliments.'}else{title='ENDING 4/10: CANDLEBEARER OF CLAIMS';desc='Embercourt tolerates you as the person who lights royal decrees and occasionally survives them.'}}
else if(winner==='frost'){sound.tone(660,.18);if(max>=8){title='ENDING 5/10: WARDEN OF THE LAST DAWN';desc='Frostwatch wins the crown with your grim paperwork. The realm finally funds the Wall, only three centuries late.'}else if(max>=5){title='ENDING 6/10: CLOAKED STRATEGIST';desc='Frostwatch grants you a fur collar and a desk facing north, so you can watch consequences approach.'}else{title='ENDING 7/10: ASSISTANT TO THE APOCALYPSE';desc='You join Frostwatch as junior memo carrier. The dead remember your name better than the court does.'}}
else if(winner==='thorn'){sound.tone(310,.08,'square');sound.tone(465,.14,'square');if(max>=8){title='ENDING 8/10: SHADOW ON THE THRONE';desc='Thornledger crowns nobody publicly and you privately. Every raven bows, every dagger invoices correctly.'}else if(max>=5){title='ENDING 9/10: MASTER OF USEFUL LIES';desc='The spymasters hire you to organize betrayal into neat columns. Morale drops; efficiency soars.'}else{title='ENDING 10/10: DINNER WITH THE DAGGERS';desc='Thornledger invites you to supper. The soup is excellent, the chairs are numbered, and yours is missing.'}}
else{sound.tone(120,.3,'sawtooth',.03);toast('The realm has filed a complaint.', 'bad')}$('ending-title').textContent=title;$('ending-desc').textContent=desc;$('score-ember').textContent=ember;$('score-frost').textContent=frost;$('score-thorn').textContent=thorn}
$('start-btn').addEventListener('click',start);$('restart-btn').addEventListener('click',()=>{sound.unlock();$('ending-screen').classList.add('hidden');$('hud').classList.remove('hidden');$('council').classList.remove('hidden');resetGame()});
function banner(x,y,w,h,color,icon){ctx.save();ctx.fillStyle=color;ctx.globalAlpha=.78;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w/2,y+h-18);ctx.lineTo(x,y+h);ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#ffe7a1';ctx.font='28px serif';ctx.textAlign='center';ctx.fillText(icon,x+w/2,y+54);ctx.restore()}
function drawSigil(cx,cy,r,house){const map={ember:['#e55a32','♛'],frost:['#80d9ff','❄'],thorn:['#77c66e','♞']},m=map[house];ctx.save();ctx.shadowColor=m[0];ctx.shadowBlur=18;ctx.fillStyle='rgba(8,10,18,.9)';ctx.strokeStyle=m[0];ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=m[0];ctx.font=(r*1.15)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(m[1],cx,cy+2);ctx.restore()}
function render(){t+=.016;const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#09111e');g.addColorStop(.55,'#171016');g.addColorStop(1,'#05070d');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(128,217,255,.10)';ctx.fillRect(0,0,w,Math.max(70,h*.18));ctx.fillStyle='rgba(229,90,50,.09)';ctx.beginPath();ctx.arc(w*.15,h*.15,170+Math.sin(t)*20,0,7);ctx.fill();ctx.fillStyle='rgba(119,198,110,.08)';ctx.beginPath();ctx.arc(w*.86,h*.16,150+Math.cos(t)*18,0,7);ctx.fill();for(let i=0;i<46;i++){const x=(i*83+(t*18*(i%3+1)))%(w+80)-40,y=(i*47+(Math.sin(t+i)*18))%h;ctx.fillStyle=i%3===0?'rgba(229,90,50,.45)':i%3===1?'rgba(128,217,255,.38)':'rgba(119,198,110,.32)';ctx.beginPath();ctx.arc(x,y,(i%4)+1.2,0,7);ctx.fill()}banner(w*.08,42,54,150,'#7c2d12','♛');banner(w*.43,34,54,150,'#0e7490','❄');banner(w*.78,42,54,150,'#166534','♞');ctx.save();ctx.translate(w/2,h*.39);ctx.fillStyle='rgba(6,8,13,.82)';ctx.strokeStyle='rgba(245,199,106,.32)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-95,95);ctx.lineTo(95,95);ctx.lineTo(68,-24);ctx.lineTo(28,-58);ctx.lineTo(0,-98);ctx.lineTo(-28,-58);ctx.lineTo(-68,-24);ctx.closePath();ctx.fill();ctx.stroke();for(let i=-4;i<=4;i++){ctx.strokeStyle='rgba(197,211,226,.32)';ctx.beginPath();ctx.moveTo(i*18,88);ctx.lineTo(i*9,-70-Math.abs(i)*4);ctx.stroke()}ctx.fillStyle='rgba(243,223,176,.92)';ctx.fillRect(-43,-16,86,62);ctx.strokeStyle='rgba(91,56,20,.75)';ctx.strokeRect(-43,-16,86,62);ctx.fillStyle='#38220d';ctx.font='700 13px Rajdhani';ctx.textAlign='center';ctx.fillText('IRON',0,8);ctx.fillText('LEDGER',0,27);ctx.restore();const active=state.active?state.currentHouse:state.leader;drawSigil(w*.5,h*.29,Math.min(54,w*.11),active);drawSigil(w*.18,h*.54,30,'ember');drawSigil(w*.50,h*.56,30,'frost');drawSigil(w*.82,h*.54,30,'thorn');ctx.fillStyle='rgba(0,0,0,.33)';ctx.fillRect(0,h*.72,w,h*.28);requestAnimationFrame(render)}render();updateHud();})();
</script>
</body>
</html>
