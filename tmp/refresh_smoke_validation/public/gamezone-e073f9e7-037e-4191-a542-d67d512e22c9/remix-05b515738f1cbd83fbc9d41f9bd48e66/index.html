<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
  <title>Neon Afterglow: Five Texts Before Sunrise</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    :root {
      --ink:#fdf7ff; --soft:#e8d8ff; --muted:#a99bc7; --void:#06020c;
      --glass:rgba(19,8,35,.74); --line:rgba(255,255,255,.14);
      --glitter:#ff4fd8; --static:#46eaff; --ache:#ff7a63; --gold:#ffe176;
      --display:'Audiowide', system-ui, sans-serif; --ui:'Rajdhani', system-ui, sans-serif; --mono:'VT323', monospace;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020a;color:var(--ink);font-family:var(--ui)}
    button{font:inherit;color:inherit;cursor:pointer;border:0}
    .hidden{display:none!important}
    #game{position:relative;width:100vw;height:100svh;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 8%,rgba(255,79,216,.22),transparent 28%),linear-gradient(180deg,#10051d,#05020a 68%,#020105)}
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    #grain{position:absolute;inset:-20%;opacity:.18;pointer-events:none;background:repeating-radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 1px,transparent 1px 5px);mix-blend-mode:screen;animation:drift 9s linear infinite}
    @keyframes drift{from{transform:translate3d(-2%,0,0)}to{transform:translate3d(2%,3%,0)}}
    .ui{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;z-index:5}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 20%,rgba(255,79,216,.18),transparent 36%),rgba(3,1,8,.78);backdrop-filter:blur(10px);pointer-events:auto;z-index:20}
    .panel{width:min(100%,520px);position:relative;overflow:hidden;padding:28px 22px;border-radius:32px;background:linear-gradient(155deg,rgba(41,15,73,.84),rgba(9,4,20,.93));border:1px solid rgba(255,255,255,.16);box-shadow:0 28px 70px rgba(0,0,0,.58),0 0 40px rgba(255,79,216,.22),inset 0 1px rgba(255,255,255,.16);text-align:center}
    .panel:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.12),transparent 30%),repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 12px);pointer-events:none}
    .panel>*{position:relative;z-index:1}
    .title{margin:0;font-family:var(--display);font-size:clamp(2rem,9vw,3.45rem);line-height:.95;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 0 10px var(--glitter),0 0 24px rgba(70,234,255,.45),0 0 54px rgba(255,79,216,.3)}
    .subtitle{margin:14px auto 24px;max-width:32ch;color:var(--soft);font-size:clamp(1rem,3.5vw,1.18rem);line-height:1.35;font-weight:600;letter-spacing:.04em}
    .tagline{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:#ffe9fb;background:rgba(255,255,255,.06);font-family:var(--mono);font-size:1.05rem;margin-bottom:16px}
    .primary{width:100%;min-height:54px;border-radius:999px;padding:15px 20px;background:linear-gradient(90deg,#9227ff,var(--glitter) 48%,#ff7a63);box-shadow:0 12px 28px rgba(0,0,0,.38),0 0 25px rgba(255,79,216,.36);font-weight:700;text-transform:uppercase;letter-spacing:.1em;border:1px solid rgba(255,255,255,.25)}
    .primary:active,.choice:active{transform:scale(.985)}
    .note{margin:15px 0 0;color:var(--muted);font-family:var(--mono);font-size:1rem;line-height:1.25}
    #play-ui{height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));pointer-events:auto}
    .hud{width:min(100%,720px);margin:0 auto 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px;border-radius:20px;background:rgba(6,2,14,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);font-family:var(--mono);box-shadow:0 12px 34px rgba(0,0,0,.28)}
    .meter{min-width:0;border-radius:15px;padding:7px 5px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));font-size:clamp(.83rem,3.1vw,1.05rem);letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
    .meter span{display:block;margin-top:4px;font-family:var(--display);font-size:clamp(.85rem,3vw,1.08rem)}
    .glitter span{color:var(--glitter)}.static span{color:var(--static)}.ache span{color:var(--ache)}
    .dialogue{width:min(100%,720px);margin:0 auto 10px;position:relative;padding:28px 18px 18px;border-radius:24px;background:linear-gradient(180deg,rgba(18,7,36,.86),rgba(7,3,16,.92));border:1px solid rgba(255,255,255,.14);border-top:2px solid var(--glitter);box-shadow:0 18px 42px rgba(0,0,0,.42),0 0 28px rgba(70,234,255,.12);backdrop-filter:blur(10px)}
    #speaker{position:absolute;top:-15px;left:18px;padding:6px 14px;border-radius:999px;background:#ff4fd8;box-shadow:0 0 15px rgba(255,79,216,.55);font-family:var(--mono);font-size:1.08rem;letter-spacing:.12em;text-transform:uppercase}
    #text{margin:0;min-height:62px;font-size:clamp(1.04rem,4.3vw,1.32rem);font-weight:600;line-height:1.38;color:#fff7ff}
    #choices{width:min(100%,720px);margin:0 auto;display:grid;grid-template-columns:1fr;gap:10px}
    .choice{min-height:52px;text-align:left;padding:13px 15px;border-radius:18px;background:linear-gradient(180deg,rgba(28,12,50,.9),rgba(10,4,22,.95));border:1px solid rgba(255,255,255,.13);box-shadow:0 10px 22px rgba(0,0,0,.28);font-weight:700;font-size:clamp(.98rem,3.8vw,1.12rem);line-height:1.22;transition:transform .16s,background .16s,border-color .16s}
    .choice b{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border-radius:50%;font-family:var(--mono);font-size:1rem;background:rgba(255,255,255,.1);vertical-align:middle}
    .choice.glitter-choice:focus-visible,.choice.glitter-choice:hover{background:linear-gradient(90deg,rgba(255,79,216,.9),rgba(44,11,77,.95));border-color:rgba(255,170,236,.8)}
    .choice.static-choice:focus-visible,.choice.static-choice:hover{background:linear-gradient(90deg,rgba(70,234,255,.88),rgba(10,40,66,.95));color:#031018;border-color:rgba(190,250,255,.9)}
    .choice.ache-choice:focus-visible,.choice.ache-choice:hover{background:linear-gradient(90deg,rgba(255,122,99,.88),rgba(70,15,35,.95));border-color:rgba(255,203,190,.85)}
    .toast{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:min(40vw,168px);display:grid;gap:7px;justify-items:end;z-index:12;pointer-events:none}
    .toast img{width:100%;border-radius:18px;border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.38);opacity:0;transform:translateY(-8px) scale(.96);transition:.24s;background:rgba(0,0,0,.42)}
    .toast div{max-width:100%;padding:7px 10px;border-radius:12px;background:rgba(6,2,14,.82);border:1px solid rgba(255,255,255,.12);font-family:var(--mono);font-size:clamp(.82rem,2.6vw,1rem);line-height:1.12;text-align:center;color:#ffe9fb;opacity:0;transform:translateY(-5px);transition:.24s}
    .toast.active img,.toast.active div{opacity:1;transform:none}
    .scores{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0;color:var(--soft);font-family:var(--mono);font-size:1.05rem}.scores strong{color:white}
    .ending-title{margin:0 0 12px;font-family:var(--display);font-size:clamp(1.7rem,7vw,2.5rem);line-height:1;color:#fff;text-shadow:0 0 18px rgba(255,79,216,.5)}
    #ending-desc{margin:0;color:var(--soft);font-size:clamp(1.02rem,3.8vw,1.2rem);line-height:1.45;font-weight:600}
    .phone{position:absolute;left:50%;top:41%;width:min(41vw,180px);height:min(60vw,270px);transform:translate(-50%,-50%) rotate(-5deg);border-radius:30px;background:linear-gradient(180deg,rgba(13,17,32,.8),rgba(0,0,0,.72));border:2px solid rgba(255,255,255,.22);box-shadow:0 0 34px rgba(70,234,255,.24),inset 0 0 22px rgba(255,79,216,.13);pointer-events:none;opacity:.82}
    .phone:before{content:"5 unread feelings";position:absolute;left:10%;right:10%;top:17%;padding:8px 7px;border-radius:14px;background:rgba(255,255,255,.1);font-family:var(--mono);font-size:clamp(.8rem,3vw,1.1rem);text-align:center;color:#eaffff;text-shadow:0 0 10px var(--static)}
    .phone:after{content:"";position:absolute;left:25%;right:25%;bottom:7%;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
    @media (orientation:landscape) and (max-height:520px){.panel{padding:18px}.title{font-size:2rem}.subtitle{margin:8px auto 14px}.dialogue{padding:22px 14px 13px}#text{min-height:42px}.choice{min-height:44px;padding:9px 12px}.phone{opacity:.38}}
    @media (min-width:760px){#choices{grid-template-columns:1fr 1fr 1fr}.choice{text-align:center}.choice b{display:block;margin:0 auto 6px}.phone{top:38%}}
  </style>
</head>
<body>
<div id="game">
  <canvas id="stage" aria-hidden="true"></canvas><div id="grain"></div><div class="phone" aria-hidden="true"></div>
  <div class="toast" id="toast"><img id="react" alt="compact mood reaction"><div id="caption"></div></div>
  <div class="ui">
    <section id="start" class="overlay">
      <div class="panel">
        <div class="tagline">✦ portrait-first interactive drama ✦</div>
        <h1 class="title">Neon Afterglow</h1>
        <p class="subtitle">Five texts before sunrise. Choose which version of yourself survives the party.</p>
        <button id="startBtn" class="primary">Open the Group Chat</button>
        <p class="note">10 endings • toxic romance • glitter melancholy</p>
      </div>
    </section>
    <main id="play-ui" class="hidden" aria-live="polite">
      <div class="hud">
        <div class="meter glitter">Glitter<span id="hud-glitter">00</span></div>
        <div class="meter static">Static<span id="hud-static">00</span></div>
        <div class="meter ache">Heartache<span id="hud-ache">00</span></div>
      </div>
      <section class="dialogue">
        <div id="speaker">UNKNOWN</div>
        <p id="text">...</p>
      </section>
      <div id="choices"></div>
    </main>
    <section id="ending" class="overlay hidden">
      <div class="panel">
        <h2 id="ending-title" class="ending-title">ENDING</h2>
        <p id="ending-desc"></p>
        <div class="scores">
          <div><strong>Glitter:</strong> <span id="score-glitter">0</span></div>
          <div><strong>Static:</strong> <span id="score-static">0</span></div>
          <div><strong>Heartache:</strong> <span id="score-ache">0</span></div>
        </div>
        <button id="restartBtn" class="primary">Replay the Night</button>
      </div>
    </section>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const ASSETS={
    bgm:{main:'https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3',static:'https://gamezone-virid.vercel.app/assets/audios/bgm/tense_bgm_01.mp3',glitter:'https://gamezone-virid.vercel.app/assets/audios/bgm/triumphant_bgm_01.mp3',ache:'https://gamezone-virid.vercel.app/assets/audios/bgm/romantic_bgm_01.mp3',fail:'https://gamezone-virid.vercel.app/assets/audios/bgm/eerie_bgm_01.mp3'},
    sfx:{start:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3',select:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3',score:'https://gamezone-virid.vercel.app/assets/audios/sfx/triumphant_wind_01.mp3',success:'https://gamezone-virid.vercel.app/assets/audios/sfx/romantic_npc_01.mp3',fail:'https://gamezone-virid.vercel.app/assets/audios/sfx/eerie_defeat_01.mp3',restart:'https://gamezone-virid.vercel.app/assets/audios/sfx/melancholic_npc_01.mp3'},
    gifs:{success:'https://i.giphy.com/1AjEBGWggGXh9onllB.webp',fail:'https://i.giphy.com/12GxI1Eqg7S6f6.webp'}
  };
  class AudioController{constructor(){this.enabled=false;this.currentBGM=null;this.tracks={};this.sfxPools={};this.last={};for(const[k,u]of Object.entries(ASSETS.bgm)){const a=new Audio(u);a.loop=true;a.preload='auto';a.volume=.18;this.tracks[k]=a}for(const[k,u]of Object.entries(ASSETS.sfx)){this.sfxPools[k]=Array.from({length:2},()=>{const a=new Audio(u);a.preload='auto';a.volume=k==='fail'?.42:.5;return a})}document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pauseCurrent();else if(this.enabled&&state.active&&this.currentBGM)this.currentBGM.play().catch(()=>{})})}unlock(){if(this.enabled)return;this.enabled=true;Object.values(this.tracks).forEach(a=>a.load());Object.values(this.sfxPools).flat().forEach(a=>a.load())}pauseCurrent(){if(this.currentBGM)this.currentBGM.pause()}playBGM(k){if(!this.enabled||!this.tracks[k])return;if(this.currentBGM===this.tracks[k]){this.currentBGM.play().catch(()=>{});return}if(this.currentBGM){this.currentBGM.pause();this.currentBGM.currentTime=0}this.currentBGM=this.tracks[k];this.currentBGM.currentTime=0;this.currentBGM.play().catch(()=>{})}playSFX(k,cool=90){if(!this.enabled||!this.sfxPools[k])return;const now=performance.now();if(this.last[k]&&now-this.last[k]<cool)return;this.last[k]=now;const pool=this.sfxPools[k],a=pool.find(x=>x.paused||x.ended)||pool[0];try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}}
  const audio=new AudioController();
  const SCRIPT=[
    {speaker:'MIRROR SELF',charIdx:0,text:'The bathroom mirror is a ring light and a crime scene. What story do you post before anyone sees you shaking?',choices:[{text:'A glitter-lashed selfie: perfect, unreal, untouchable.',affinity:'glitter',score:2},{text:'A blurry close-friends video with the bass clipping.',affinity:'static',score:2},{text:'A lyric screenshot aimed at exactly one person.',affinity:'ache',score:2}]},
    {speaker:'GROUP CHAT',charIdx:1,text:'Your phone is vibrating like a second heartbeat. The party wants a reply, a location, a version of you. What do you send?',choices:[{text:'Drop a live location and let the night choose you.',affinity:'static',score:2},{text:'Send a flawless outfit check with no caption.',affinity:'glitter',score:2},{text:'Type "miss you" then delete it, twice, then send a dot.',affinity:'ache',score:2}]},
    {speaker:'EX AT THE DOOR',charIdx:2,text:'They are outside under violet rain, saying they changed. Your friends are watching your face. What wins?',choices:[{text:'Tell the truth: love is not proof of safety.',affinity:'ache',score:3},{text:'Go live for the drama and pretend it is content.',affinity:'static',score:-1},{text:'Smile for photos while your stomach disappears.',affinity:'glitter',score:-1}]},
    {speaker:'BEST FRIEND',charIdx:0,text:'Your best friend catches the crack in your eyeliner. "Who are you trying to be tonight?"',choices:[{text:'The luminous myth everyone will remember.',affinity:'glitter',score:3},{text:'The person whose notifications never stop.',affinity:'static',score:1},{text:'The soft disaster who finally asks to be held.',affinity:'ache',score:1}]},
    {speaker:'SUNRISE ROOF',charIdx:1,text:'The city goes lavender. One final text decides what follows you home.',choices:[{text:'"Do not call. I am choosing myself."',affinity:'static',score:3},{text:'"I forgive you, but I am not coming back."',affinity:'ache',score:3},{text:'"If I vanish, make it iconic."',affinity:'glitter',score:3}]}
  ];
  const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');let w=0,h=0,particles=[],toastTimer=null,t=0;
  const state={active:false,turn:0,affinity:{glitter:0,static:0,ache:0},currentCharIdx:0};
  const palettes=[{key:'glitter',inner:'rgba(255,79,216,.5)',ring:'#ff7ce6',face:'#ffe5fb',jacket:'#6b145f',accent:'#fff083',icon:'✦'},{key:'static',inner:'rgba(70,234,255,.46)',ring:'#46eaff',face:'#e4fdff',jacket:'#123a62',accent:'#9effff',icon:'⌁'},{key:'ache',inner:'rgba(255,122,99,.45)',ring:'#ff7a63',face:'#ffe6de',jacket:'#5c1932',accent:'#ffb39f',icon:'♡'}];
  function resize(){w=canvas.width=Math.floor(innerWidth*devicePixelRatio);h=canvas.height=Math.floor(innerHeight*devicePixelRatio);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight;initParticles()}addEventListener('resize',resize,{passive:true});resize();
  function initParticles(){particles=Array.from({length:42},(_,i)=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.6+1,vy:Math.random()*.45+.12,vx:(Math.random()-.5)*.22,c:['#ff4fd8','#46eaff','#ff7a63','#ffe176'][i%4],kind:i%5}))}
  function updateHud(){document.getElementById('hud-glitter').textContent=String(state.affinity.glitter).padStart(2,'0');document.getElementById('hud-static').textContent=String(state.affinity.static).padStart(2,'0');document.getElementById('hud-ache').textContent=String(state.affinity.ache).padStart(2,'0')}
  function showReaction(type,text){const toast=document.getElementById('toast'),img=document.getElementById('react'),cap=document.getElementById('caption');img.src=ASSETS.gifs[type];cap.textContent=text;toast.classList.add('active');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('active'),2100)}
  function drawTeenAura(idx){const p=palettes[idx]||palettes[0],cx=w/2,cy=h*.42,r=Math.min(w,h)*.22;const g=ctx.createRadialGradient(cx,cy,r*.1,cx,cy,r*1.25);g.addColorStop(0,p.inner);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.35,0,Math.PI*2);ctx.fill();ctx.strokeStyle=p.ring;ctx.lineWidth=2.5;ctx.shadowBlur=18;ctx.shadowColor=p.ring;ctx.beginPath();ctx.ellipse(cx,cy,r*.7,r*.9,Math.sin(t*.01)*.08,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.ellipse(cx,cy-r*.05,r*.42,r*.62,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.face;ctx.beginPath();ctx.arc(cx,cy-r*.28,r*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.jacket;ctx.beginPath();ctx.moveTo(cx-r*.38,cy+r*.42);ctx.quadraticCurveTo(cx,cy-r*.02,cx+r*.38,cy+r*.42);ctx.lineTo(cx+r*.24,cy+r*.73);ctx.lineTo(cx-r*.24,cy+r*.73);ctx.closePath();ctx.fill();ctx.strokeStyle=p.accent;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-r*.18,cy-r*.34);ctx.quadraticCurveTo(cx-r*.05,cy-r*.48,cx+r*.18,cy-r*.34);ctx.stroke();ctx.fillStyle='#16051b';ctx.beginPath();ctx.arc(cx-r*.055,cy-r*.26,r*.018,0,Math.PI*2);ctx.arc(cx+r*.055,cy-r*.26,r*.018,0,Math.PI*2);ctx.fill();ctx.strokeStyle=p.accent;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy-r*.2,r*.055,.1,Math.PI-.1,false);ctx.stroke();ctx.font=`${Math.max(28,r*.34)}px Audiowide`;ctx.fillStyle=p.accent;ctx.textAlign='center';ctx.fillText(p.icon,cx,cy+r*.22)}
  function render(){t++;const activePal=palettes[state.currentCharIdx]||palettes[0];const grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,state.currentCharIdx===1?'#031d2b':state.currentCharIdx===2?'#2b0818':'#21062e');grad.addColorStop(.58,'#080313');grad.addColorStop(1,'#020105');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle=activePal.ring;ctx.lineWidth=1;for(let i=0;i<9;i++){const y=h*.1+i*h*.095+Math.sin((t+i*25)*.01)*8;ctx.beginPath();ctx.moveTo(w*.08,y);ctx.lineTo(w*.92,y+Math.sin(t*.015+i)*10);ctx.stroke()}ctx.restore();for(const p of particles){p.y-=p.vy;p.x+=p.vx+Math.sin((t+p.y)*.01)*.08;if(p.y<-8){p.y=h+8;p.x=Math.random()*w}ctx.fillStyle=p.c;ctx.globalAlpha=p.kind===0?.82:.48;ctx.beginPath();if(p.kind===0){ctx.moveTo(p.x,p.y-p.r*2);ctx.lineTo(p.x+p.r,p.y);ctx.lineTo(p.x,p.y+p.r*2);ctx.lineTo(p.x-p.r,p.y);ctx.closePath()}else ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(state.active)drawTeenAura(state.currentCharIdx);requestAnimationFrame(render)}render();
  function applySpeakerStyle(idx){const el=document.getElementById('speaker'),p=palettes[idx]||palettes[0];el.style.background=p.ring;el.style.color=idx===1?'#031018':'#fff';el.style.boxShadow=`0 0 14px ${p.ring}`} 
  function loadTurn(){if(state.turn>=SCRIPT.length){calculateEnding();return}const data=SCRIPT[state.turn];state.currentCharIdx=data.charIdx;document.getElementById('speaker').textContent=data.speaker;applySpeakerStyle(data.charIdx);document.getElementById('text').textContent=data.text;const box=document.getElementById('choices');box.innerHTML='';data.choices.forEach((choice,i)=>{const btn=document.createElement('button');btn.className=`choice ${choice.affinity}-choice`;btn.innerHTML=`<b>${i+1}</b>${choice.text}`;btn.addEventListener('click',()=>{audio.playSFX('select',70);state.affinity[choice.affinity]+=choice.score;updateHud();if(choice.score>1)audio.playSFX('score',80);if(choice.affinity==='glitter'&&choice.score>1)showReaction('success','The mask sparkles back.');else if(choice.score<0)showReaction('fail','The room goes quiet.');state.turn++;loadTurn()});box.appendChild(btn)})}
  function calculateEnding(){state.active=false;document.getElementById('play-ui').classList.add('hidden');document.getElementById('ending').classList.remove('hidden');const{glitter,static,ache}=state.affinity;let winner='fail',maxScore=-999,title='GHOSTED BY DAWN',desc='The night keeps your secrets, but none of the selves you performed felt like home.',bgmKey='fail';if(glitter>maxScore){maxScore=glitter;winner='glitter'}if(static>maxScore){maxScore=static;winner='static'}if(ache>maxScore){maxScore=ache;winner='ache'}if(maxScore<3)winner='fail';if(winner==='fail'){title='ENDING 1/10: LEFT ON READ';desc='No fantasy held. The chat fades, the party forgets, and you walk home with glitter stuck to your cheeks.';bgmKey='fail';audio.playSFX('fail',40);showReaction('fail','No one knew what you needed.')}else if(winner==='glitter'){bgmKey='glitter';audio.playSFX('success',40);showReaction('success','Every flash finds you.');if(maxScore>=8){title='ENDING 2/10: NEON MYTH';desc='You become the photo everyone reposts: dazzling, unreachable, and privately exhausted by your own legend.'}else if(maxScore>=5){title='ENDING 3/10: PARTY SAINT';desc='People follow your glow from room to room. You are adored, even when you cannot tell if you are seen.'}else{title='ENDING 4/10: GLITTER ARMOR';desc='The look works. The ache waits under it, quiet but not gone.'}}else if(winner==='static'){bgmKey='static';audio.playSFX('success',40);showReaction('success','Signal accepted.');if(maxScore>=8){title='ENDING 5/10: MAIN CHARACTER ONLINE';desc='Your phone becomes a constellation. Every message arrives, every story watches, and intimacy feels electric.'}else if(maxScore>=5){title='ENDING 6/10: CLOSE FRIENDS ONLY';desc='You keep the night curated and half-private. The right people see enough to stay curious.'}else{title='ENDING 7/10: TYPING...';desc='You almost say everything. The dots blink longer than the truth.'}}else if(winner==='ache'){bgmKey='ache';audio.playSFX('success',40);showReaction('success','The soft truth lands.');if(maxScore>=8){title='ENDING 8/10: CLEAN BREAK SUNRISE';desc='You choose tenderness without surrender. The toxic orbit breaks, and the dawn feels survivable.'}else if(maxScore>=5){title='ENDING 9/10: VIOLET APOLOGY';desc='You set a boundary in a shaking voice. It is imperfect, but it is yours.'}else{title='ENDING 10/10: BACKSEAT CONFESSION';desc='You say the vulnerable thing too late, in the wrong car, to someone who still matters.'}}document.getElementById('ending-title').textContent=title;document.getElementById('ending-desc').textContent=desc;document.getElementById('score-glitter').textContent=glitter;document.getElementById('score-static').textContent=static;document.getElementById('score-ache').textContent=ache;audio.playBGM(bgmKey)}
  function resetGame(){state.active=true;state.turn=0;state.affinity={glitter:0,static:0,ache:0};state.currentCharIdx=0;updateHud()}
  document.getElementById('startBtn').addEventListener('click',()=>{audio.unlock();audio.playSFX('start',40);document.getElementById('start').classList.add('hidden');document.getElementById('ending').classList.add('hidden');document.getElementById('play-ui').classList.remove('hidden');resetGame();audio.playBGM('main');loadTurn()});
  document.getElementById('restartBtn').addEventListener('click',()=>{audio.unlock();audio.playSFX('restart',40);document.getElementById('ending').classList.add('hidden');document.getElementById('play-ui').classList.remove('hidden');resetGame();audio.playBGM('main');loadTurn()});
  updateHud();
});
</script>
