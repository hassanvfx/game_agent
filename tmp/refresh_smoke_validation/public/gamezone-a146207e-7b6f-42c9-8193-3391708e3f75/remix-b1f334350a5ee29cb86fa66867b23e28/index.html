<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Palm Route Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --sky-top: #1d1340;
            --sky-bottom: #0a3d3d;
            --panel-bg: rgba(13, 20, 47, 0.78);
            --panel-border: rgba(90, 237, 219, 0.42);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text-main: #f8fbff;
            --text-soft: rgba(239, 255, 252, 0.9);
            --accent-cyan: #67f7e7;
            --accent-lime: #bef264;
            --accent-gold: #ffd54f;
            --accent-red: #ff6b7a;
            --road-dark: #20223a;
            --road-edge: #6ae7d8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(103, 247, 231, 0.12), transparent 38%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .hidden { display: none !important; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .top-16 { top: 4rem; }
        .left-1\/2 { left: 50%; }
        .transform { transform: translateX(0); }
        .-translate-x-1\/2 { transform: translateX(-50%); }
        .w-full { width: 100%; }
        .h-full { height: 100vh; }
        .max-w-md { max-width: 28rem; }
        .max-w-xs { max-width: 20rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .rounded-full { border-radius: 999px; }
        .rounded-xl { border-radius: 1rem; }
        .rounded-2xl { border-radius: 1.25rem; }
        .text-center { text-align: center; }
        .text-black { color: #111827; }
        .text-white { color: #ffffff; }
        .text-white\/90 { color: rgba(255, 255, 255, 0.9); }
        .text-yellow-300 { color: #fde047; }
        .text-yellow-400 { color: #facc15; }
        .text-green-300 { color: #86efac; }
        .text-green-400 { color: #4ade80; }
        .text-red-500 { color: #ef4444; }
        .text-gray-800 { color: #1f2937; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.375rem; }
        .text-2xl { font-size: 1.75rem; }
        .text-3xl { font-size: 2.25rem; }
        .text-4xl { font-size: 2.75rem; }
        .font-bold { font-weight: 700; }
        .opacity-75 { opacity: 0.75; }
        .bg-black\/30 { background: rgba(0, 0, 0, 0.3); }
        .bg-white\/90 { background: rgba(255, 255, 255, 0.9); }
        .bg-white { background: #ffffff; }
        .shadow-lg, .shadow-xl {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }
        .drop-shadow-lg, .drop-shadow-md {
            filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.55));
        }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }

        .glass-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(23, 32, 72, 0.92), rgba(10, 18, 40, 0.84));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 10px 32px var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(103, 247, 231, 0.18), transparent 42%, rgba(255, 213, 79, 0.16));
        }

        .text-shadow {
            text-shadow:
                0 2px 0 rgba(5, 8, 21, 0.9),
                0 0 12px rgba(103, 247, 231, 0.28);
        }

        #game-container {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 213, 79, 0.08), transparent 22%),
                linear-gradient(180deg, rgba(14, 17, 37, 0.18), rgba(4, 8, 20, 0.34));
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 255, 255, 0.2) 0 2px, transparent 2px),
                radial-gradient(circle at 75% 22%, rgba(255, 255, 255, 0.18) 0 1.5px, transparent 1.5px),
                radial-gradient(circle at 48% 9%, rgba(255, 255, 255, 0.22) 0 1.8px, transparent 1.8px),
                radial-gradient(circle at 84% 12%, rgba(255, 255, 255, 0.15) 0 1.4px, transparent 1.4px),
                radial-gradient(circle at 28% 8%, rgba(255, 255, 255, 0.12) 0 1.2px, transparent 1.2px);
            opacity: 0.85;
        }

        #game-container::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 18%),
                linear-gradient(0deg, rgba(1, 5, 13, 0.25), transparent 20%);
        }

        #start-screen h1, #game-over-screen h2 {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.05em;
        }

        #ui-layer h2,
        #start-btn,
        #restart-btn,
        #question-text {
            font-family: 'Audiowide', system-ui, sans-serif;
        }

        #start-screen,
        #game-over-screen {
            width: min(28rem, calc(100% - 2rem));
            border-radius: 1.5rem;
        }

        #start-btn,
        #restart-btn {
            position: relative;
            min-height: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        #start-btn:active,
        #restart-btn:active {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        #start-btn {
            color: #ffffff;
            font-weight: 700;
            background: linear-gradient(90deg, #00b894, #0f766e);
        }

        #restart-btn {
            color: #082f49;
            background: linear-gradient(180deg, #f8fafc, #bfdbfe);
        }

        #hud {
            padding-top: max(1rem, env(safe-area-inset-top));
        }

        #hud > div:first-child {
            border: 1px solid rgba(103, 247, 231, 0.4);
            background: rgba(8, 14, 30, 0.72);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
        }

        #question-box {
            border: 1px solid rgba(103, 247, 231, 0.28);
            background:
                linear-gradient(180deg, rgba(243, 255, 252, 0.96), rgba(208, 255, 241, 0.92));
            box-shadow:
                0 12px 30px rgba(5, 10, 24, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        #question-text {
            letter-spacing: 0.03em;
        }

        .animate-bounce { animation: bounce 1s ease; }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        @media (max-width: 767px) {
            .text-4xl { font-size: 2.3rem; }
            .text-5xl { font-size: 3.2rem; }
            .text-2xl { font-size: 1.5rem; }
            .top-16 { top: 4.75rem; }
            #question-box { width: calc(100% - 2rem); }
        }

        @media (min-width: 768px) {
            .md\:text-5xl { font-size: 3.4rem; }
            .md\:max-w-md { max-width: 28rem; }
            .md\:text-xl { font-size: 1.375rem; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
            <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
                <!-- [agent-note][stage3] resolved-font: title=Audiowide | hud/body=Press Start 2P from catalogs/fonts.json -->
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-8 rounded-2xl text-center pointer-events-auto max-w-md mx-4">
                <div class="mb-4 text-4xl" aria-hidden="true">🚚✨🌴</div>
                <h1 class="text-4xl md:text-5xl font-bold text-yellow-400 mb-2 drop-shadow-lg">PALM ROUTE QUIZ</h1>
                <h2 class="text-2xl text-green-300 font-bold mb-4 drop-shadow-md">Neon Cargo Sprint</h2>
                <p class="text-white/90 text-lg mb-6">Drive the glowing hauler into the correct answer gate.<br><span class="text-sm opacity-75">(Tap left/right or use arrow keys to steer)</span></p>
                <button id="start-btn" class="text-white font-bold py-3 px-10 rounded-full shadow-lg">START RUN</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-8 rounded-2xl text-center pointer-events-auto max-w-md mx-4">
                <div class="mb-4 text-4xl" aria-hidden="true">💥🚧</div>
                <h2 class="text-4xl font-bold text-red-500 mb-2 drop-shadow-md">RUN OVER</h2>
                <p class="text-white mb-4 text-xl">Wrong gate.</p>
                <div class="text-3xl text-yellow-300 mb-8 font-bold text-shadow">Score: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="bg-white font-bold py-3 px-10 rounded-full shadow-lg">TRY AGAIN</button>
            </div>
            
            <!-- HUD -->
            <div id="feedback-layer" class="absolute inset-0 pointer-events-none hidden" aria-live="polite">
                <div id="reaction-banner" class="absolute left-1/2 -translate-x-1/2 top-16 glass-panel rounded-2xl p-4 text-center hidden">
                    <img id="reaction-gif" alt="" class="hidden" style="width:min(42vw, 160px); max-height:110px; object-fit:cover; border-radius:0.9rem; border:1px solid rgba(255,255,255,0.22); margin:0 auto 0.75rem auto;">
                    <div id="reaction-text" class="text-xl text-yellow-300 text-shadow">Perfect route!</div>
                </div>
            </div>

            <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start hidden">
                <div class="text-2xl font-bold text-white text-shadow bg-black/30 px-4 py-1 rounded-full">
                    Score: <span id="score">0</span>
                </div>
                <div id="question-box" class="absolute top-16 left-1/2 transform -translate-x-1/2 bg-white/90 text-black px-6 py-3 rounded-xl shadow-xl text-center max-w-xs md:max-w-md">
                    <p id="question-text" class="text-lg md:text-xl font-bold text-gray-800">Ready?</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                gateSpawn: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                steer: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/cQNRp4QA8z7B6.webp",
                fail: "https://i.giphy.com/l378giAZgxPw3eO52.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                this.soundConfig = {
                    start: { volume: 0.55, cooldown: 180 },
                    gateSpawn: { volume: 0.28, cooldown: 250 },
                    score: { volume: 0.45, cooldown: 120 },
                    streak: { volume: 0.5, cooldown: 180 },
                    steer: { volume: 0.2, cooldown: 90 },
                    fail: { volume: 0.5, cooldown: 180 },
                    gameOver: { volume: 0.55, cooldown: 250 }
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audioEl = new Audio(v);
                    audioEl.preload = 'auto';
                    this.sfx[k] = audioEl;
                }
            }
            unlock() {
                this.enabled = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((audioEl) => audioEl.load());
            }
            playBGM() {
                if (!this.enabled) return;
                if (this.bgm.paused) {
                    this.bgm.play().catch(() => {});
                }
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const { volume = 0.45, cooldown = 0 } = this.soundConfig[key] || {};
                if ((now - (this.lastPlayedAt[key] || 0)) < cooldown) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME DATA (Quiz) */
        const QUESTIONS = [
            { q: "First President of Indonesia?", a: "Soekarno", w: "Soeharto" },
            { q: "Seventh President of Indonesia?", a: "Jokowi", w: "SBY" },
            { q: "Indonesia's woman president?", a: "Megawati", w: "Kartini" },
            { q: "Known as the Father of Development?", a: "Soeharto", w: "Habibie" },
            { q: "Third President of Indonesia?", a: "Habibie", w: "Gus Dur" },
            { q: "Capital city of Indonesia?", a: "Jakarta", w: "Bali" },
            { q: "Main source of cooking oil here?", a: "Palm", w: "Teak" },
            { q: "Colors of Indonesia's flag?", a: "Red White", w: "White Red" },
            { q: "National emblem?", a: "Garuda", w: "Tiger" },
            { q: "First Vice President of Indonesia?", a: "Moh. Hatta", w: "Adam Malik" }
        ];

        /** 4. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let speed = 0;
        let frameCount = 0;
        
        // Player
        let player = { x: 0, y: 0, width: 60, height: 100, lane: 0 }; // Lane: -1 (Left), 1 (Right)
        
        // Gates/Quiz
        let currentGate = null; // { y, correctLane, qIndex, answered }
        let nextQuestionDelay = 0;

        // Parallax State
        let scrollY = 0;
        let pulseFrame = 0;
        let feedbackTimeout = null;
        let gifCooldownUntil = 0;

        /** 5. RESIZE & INPUT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 150;
            player.x = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Controls
        function movePlayer(e) {
            if (!gameActive) return;
            const centerX = width / 2;
            const previousLane = player.lane;
            let clientX;
            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }

            if (clientX < centerX) player.lane = -1;
            else player.lane = 1;

            if (player.lane !== previousLane) {
                audio.playSFX('steer');
            }
        }
        canvas.addEventListener('mousedown', movePlayer);
        canvas.addEventListener('touchstart', movePlayer, { passive: true });
        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            const previousLane = player.lane;
            if (e.key === 'ArrowLeft') player.lane = -1;
            if (e.key === 'ArrowRight') player.lane = 1;
            if (player.lane !== previousLane) {
                audio.playSFX('steer');
            }
        });

        function showReaction(type, message) {
            const feedbackLayer = document.getElementById('feedback-layer');
            const banner = document.getElementById('reaction-banner');
            const text = document.getElementById('reaction-text');
            const gif = document.getElementById('reaction-gif');

            text.textContent = message;
            gif.src = ASSETS.gifs[type];
            gif.alt = type === 'success' ? 'Victory dance reaction' : 'Wrong answer fail reaction';
            gif.classList.remove('hidden');
            feedbackLayer.classList.remove('hidden');
            banner.classList.remove('hidden');

            if (feedbackTimeout) clearTimeout(feedbackTimeout);
            feedbackTimeout = setTimeout(() => {
                banner.classList.add('hidden');
                feedbackLayer.classList.add('hidden');
            }, 1500);
        }

        /** 6. GAME LOGIC */
        function initGame() {
            score = 0;
            speed = 5;
            scrollY = 0;
            pulseFrame = 0;
            player.lane = -1; // Start left
            currentGate = null;
            nextQuestionDelay = 60; // Frames before first question
            document.getElementById('score').innerText = score;
            document.getElementById('question-text').innerText = 'Ready?';
            document.getElementById('question-box').classList.add('hidden');
            document.getElementById('feedback-layer').classList.add('hidden');
            document.getElementById('reaction-banner').classList.add('hidden');
        }

        function spawnGate() {
            const qIdx = Math.floor(Math.random() * QUESTIONS.length);
            const correctLane = Math.random() > 0.5 ? 1 : -1;

            currentGate = {
                y: -200,
                correctLane: correctLane,
                qIndex: qIdx,
                answered: false
            };

            const qText = document.getElementById('question-text');
            qText.innerText = QUESTIONS[qIdx].q;
            document.getElementById('question-box').classList.remove('hidden');
            document.getElementById('question-box').classList.add('animate-bounce');
            setTimeout(() => document.getElementById('question-box').classList.remove('animate-bounce'), 1000);
            audio.playSFX('gateSpawn');
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, "#180d38");
            grad.addColorStop(0.45, "#104a52");
            grad.addColorStop(1, "#06131e");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const moonGlow = ctx.createRadialGradient(width * 0.5, height * 0.16, 10, width * 0.5, height * 0.16, width * 0.28);
            moonGlow.addColorStop(0, "rgba(255, 221, 117, 0.55)");
            moonGlow.addColorStop(1, "rgba(255, 221, 117, 0)");
            ctx.fillStyle = moonGlow;
            ctx.fillRect(0, 0, width, height);

            const roadWidth = Math.min(width * 0.8, 500);
            const roadX = (width - roadWidth) / 2;

            for (let i = 0; i < 10; i++) {
                const stripeY = (scrollY * 0.15 + i * 120) % (height + 120);
                ctx.fillStyle = "rgba(103, 247, 231, 0.05)";
                ctx.fillRect(roadX - 14, stripeY - 40, roadWidth + 28, 2);
            }

            const roadGrad = ctx.createLinearGradient(roadX, 0, roadX + roadWidth, 0);
            roadGrad.addColorStop(0, "#15172b");
            roadGrad.addColorStop(0.5, "#262b45");
            roadGrad.addColorStop(1, "#15172b");
            ctx.fillStyle = roadGrad;
            ctx.fillRect(roadX, 0, roadWidth, height);

            ctx.fillStyle = "rgba(106, 231, 216, 0.4)";
            ctx.fillRect(roadX, 0, 5, height);
            ctx.fillRect(roadX + roadWidth - 5, 0, 5, height);

            ctx.strokeStyle = "#f8fafc";
            ctx.setLineDash([34, 26]);
            ctx.lineWidth = 5;
            ctx.lineDashOffset = -scrollY;
            ctx.beginPath();
            ctx.moveTo(width / 2, 0);
            ctx.lineTo(width / 2, height);
            ctx.stroke();
            ctx.setLineDash([]);

            const treeSpacing = 150;
            const offset = scrollY % treeSpacing;
            for (let i = -1; i < (height / treeSpacing) + 2; i++) {
                let ty = i * treeSpacing + offset;
                drawPalmTree(roadX - 62, ty, false);
                drawPalmTree(roadX + roadWidth + 62, ty, true);
            }
        }

        function drawPalmTree(cx, cy, mirrored) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(mirrored ? -1 : 1, 1);

            ctx.fillStyle = "#6b4f38";
            ctx.fillRect(-5, 2, 10, 42);

            ctx.strokeStyle = "#7ddf77";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            [[0, 0, -18, -20], [0, 0, -28, -4], [0, 0, 18, -22], [0, 0, 30, -6], [0, 0, 0, -28]].forEach(([x1, y1, x2, y2]) => {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            });

            ctx.fillStyle = "#ff8a3d";
            ctx.beginPath(); ctx.arc(-5, -3, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(5, 1, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, 7, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawPlayer(roadX, roadWidth) {
            const laneWidth = roadWidth / 2;
            const targetX = player.lane === -1
                ? roadX + laneWidth / 2
                : roadX + roadWidth * 0.75;

            player.x += (targetX - player.x) * 0.2;
            const bob = Math.sin(pulseFrame * 0.18) * 2.5;

            ctx.save();
            ctx.translate(player.x, player.y + bob);

            const bodyGrad = ctx.createLinearGradient(-24, 0, 24, 0);
            bodyGrad.addColorStop(0, "#ffd54f");
            bodyGrad.addColorStop(0.5, "#ff9f1c");
            bodyGrad.addColorStop(1, "#ff7b00");

            ctx.shadowColor = "rgba(255, 196, 82, 0.45)";
            ctx.shadowBlur = 20;

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(-26, -42, 52, 84, 14);
            ctx.fill();

            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            ctx.roundRect(-14, -48, 28, 16, 8);
            ctx.fill();

            const windshield = ctx.createLinearGradient(-16, -28, 16, -4);
            windshield.addColorStop(0, "#d8f9ff");
            windshield.addColorStop(1, "#38bdf8");
            ctx.fillStyle = windshield;
            ctx.beginPath();
            ctx.roundRect(-18, -28, 36, 20, 8);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#083344";
            ctx.fillRect(-22, -4, 44, 30);

            ctx.fillStyle = "#ef4444";
            ctx.beginPath(); ctx.arc(-10, 10, 8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, 14, 8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, 24, 8, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-16, -16);
            ctx.lineTo(16, -16);
            ctx.stroke();

            ctx.fillStyle = "#111827";
            [[-29, -22], [21, -22], [-29, 20], [21, 20]].forEach(([x, y]) => {
                ctx.beginPath();
                ctx.roundRect(x, y, 8, 16, 4);
                ctx.fill();
            });

            ctx.fillStyle = "#67f7e7";
            ctx.fillRect(-18, 36, 10, 4);
            ctx.fillRect(8, 36, 10, 4);

            ctx.restore();
        }

        function drawGate(roadX, roadWidth) {
            if (!currentGate) return;

            const laneWidth = roadWidth / 2;
            const q = QUESTIONS[currentGate.qIndex];
            
            // Left Answer Box
            const leftX = roadX + 10;
            const w = laneWidth - 20;
            const h = 80;
            
            // Determine text
            const leftText = currentGate.correctLane === -1 ? q.a : q.w;
            const rightText = currentGate.correctLane === 1 ? q.a : q.w;

            // Draw Left Gate
            drawGateBox(leftX, currentGate.y, w, h, leftText, "#3b82f6"); // Blue
            
            // Draw Right Gate
            const rightX = roadX + laneWidth + 10;
            drawGateBox(rightX, currentGate.y, w, h, rightText, "#ef4444"); // Red
        }

        function drawGateBox(x, y, w, h, text, color) {
            const gateGrad = ctx.createLinearGradient(x, y, x, y + h);
            gateGrad.addColorStop(0, color);
            gateGrad.addColorStop(1, "#111827");
            ctx.fillStyle = gateGrad;
            ctx.shadowColor = color;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 14);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.strokeStyle = "rgba(103,247,231,0.45)";
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 8, y + 8, w - 16, h - 16);

            ctx.fillStyle = "#f8fafc";
            ctx.font = "400 16px 'Press Start 2P'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x + w / 2, y + h / 2);
        }

        function gameLoop() {
            if (!gameActive) return;
            
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Update Scroll
            scrollY += speed;
            pulseFrame++;
            
            // Draw World
            drawBackground();
            
            const roadWidth = Math.min(width * 0.8, 500);
            const roadX = (width - roadWidth) / 2;

            // Logic: Gates
            if (!currentGate) {
                nextQuestionDelay--;
                if (nextQuestionDelay <= 0) {
                    spawnGate();
                }
            } else {
                currentGate.y += speed;
                
                // Collision Check
                // Player Y is roughly height - 150. Gate height is 80.
                // Check if gate passes player
                if (!currentGate.answered && currentGate.y + 80 > player.y && currentGate.y < player.y + 80) {
                    // Check Lane
                    if (player.lane === currentGate.correctLane) {
                        score++;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('score');
                        if (score > 0 && score % 3 === 0) {
                            audio.playSFX('streak');
                        }
                        currentGate.answered = true;
                        speed += 0.2;

                        const scoreEl = document.getElementById('score');
                        scoreEl.classList.add('text-green-400');
                        setTimeout(() => scoreEl.classList.remove('text-green-400'), 200);

                        if (performance.now() > gifCooldownUntil) {
                            showReaction('success', score % 3 === 0 ? 'Combo route!' : 'Correct gate!');
                            gifCooldownUntil = performance.now() + 1000;
                        }

                    } else {
                        // Wrong
                        gameOver();
                        return;
                    }
                }

                // Despawn
                if (currentGate.y > height) {
                    currentGate = null;
                    nextQuestionDelay = 60;
                    document.getElementById('question-box').classList.add('hidden');
                }
            }

            drawGate(roadX, roadWidth);
            drawPlayer(roadX, roadWidth);

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            audio.playSFX('gameOver');
            showReaction('fail', 'Wrong gate!');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 7. EVENT LISTENERS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playSFX('start');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
