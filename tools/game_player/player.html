<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FriendJam</title>
  <style>
    :root {
      --bg: #060814;
      --surface-strong: rgba(17, 22, 40, 0.88);
      --surface-soft: rgba(11, 15, 30, 0.78);
      --text: #eef4ff;
      --text-soft: #9aa6c7;
      --line: rgba(132, 154, 210, 0.14);
      --primary: #53d8ff;
      --secondary: #b56cff;
      --primary-soft: rgba(83, 216, 255, 0.14);
      --shadow: 0 18px 48px rgba(2, 6, 23, 0.52);
      --glow: 0 0 0 1px rgba(83, 216, 255, 0.12), 0 0 32px rgba(90, 128, 255, 0.14);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --rail-width: 240px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 10%, rgba(83, 216, 255, 0.16), transparent 24%),
        radial-gradient(circle at 85% 12%, rgba(181, 108, 255, 0.18), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(72, 109, 255, 0.12), transparent 30%),
        linear-gradient(180deg, #080b17 0%, #060814 46%, #04060f 100%);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
      border: 0;
      transition: 0.2s ease;
    }

    button {
      cursor: pointer;
    }

    .player-shell {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.995) 0%, rgba(0, 0, 0, 0.985) 42%, rgba(3, 5, 12, 0.98) 100%),
        linear-gradient(180deg, #020304 0%, #04060b 100%);
      overflow: hidden;
    }

    .player-shell.landscape {
      display: grid;
      grid-template-columns: minmax(180px, var(--rail-width)) minmax(0, 1fr);
    }

    .title-rail {
      display: none;
      padding: calc(24px + var(--safe-top)) 20px calc(18px + var(--safe-bottom));
      border-right: 1px solid rgba(120, 149, 221, 0.08);
      background: linear-gradient(180deg, rgba(2, 3, 6, 0.98), rgba(4, 6, 10, 0.96));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: flex-start;
      justify-content: flex-start;
    }

    .player-shell.landscape .title-rail {
      display: flex;
    }

    .title-rail-card {
      width: 100%;
      padding: 4px 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand-label {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      text-decoration: none;
      flex: 0 0 auto;
    }

    .brand-link:focus-visible,
    .install-button:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.9);
      outline-offset: 3px;
    }

    .logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      object-fit: cover;
      flex: 0 0 auto;
      border: 1px solid rgba(140, 160, 220, 0.22);
      background: linear-gradient(180deg, rgba(17, 22, 40, 0.98), rgba(8, 10, 20, 0.98));
      box-shadow:
        0 10px 24px rgba(2, 6, 23, 0.4),
        0 0 0 1px rgba(83, 216, 255, 0.08),
        0 0 22px rgba(83, 216, 255, 0.14);
    }

    .brand-text {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .rail-actions {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    .topbar-brand .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
    }

    .title-rail-card h1,
    .topbar-title {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.08;
      letter-spacing: -0.03em;
      word-break: break-word;
      color: #f6f8ff;
      text-shadow: 0 0 18px rgba(83, 216, 255, 0.08);
    }

    .main-panel {
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      padding: calc(8px + var(--safe-top)) 12px 8px;
      background: linear-gradient(180deg, rgba(2, 3, 6, 0.98), rgba(4, 6, 10, 0.96));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(120, 149, 221, 0.08);
      z-index: 2;
      box-shadow: inset 0 -1px 0 rgba(83, 216, 255, 0.03);
    }

    .player-shell.landscape .topbar {
      display: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    .icon-button,
    .share-button {
      border-radius: 14px;
      min-height: 42px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      background: linear-gradient(180deg, rgba(21, 26, 46, 0.92), rgba(11, 15, 30, 0.92));
      box-shadow: var(--shadow);
      color: #f4f8ff;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      border: 1px solid rgba(140, 160, 220, 0.16);
    }

    .share-button {
      min-width: 72px;
      padding: 10px 14px;
      background:
        linear-gradient(90deg, rgba(162, 83, 255, 0.88), rgba(83, 216, 255, 0.92));
      color: #08111d;
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      box-shadow:
        0 14px 28px rgba(55, 94, 255, 0.2),
        0 0 24px rgba(83, 216, 255, 0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .share-button.copied {
      background: linear-gradient(90deg, rgba(110, 244, 194, 0.94), rgba(83, 216, 255, 0.92));
      color: #071119;
    }

    .install-button {
      min-width: 112px;
      padding: 10px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(14, 14, 16, 0.98), rgba(2, 2, 4, 0.98));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    .install-button:hover,
    .install-button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.42);
      box-shadow:
        0 16px 32px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .install-glyph {
      font-size: 1rem;
      line-height: 1;
    }

    .share-glyph {
      font-size: 1rem;
      line-height: 1;
    }

    .iframe-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.995) 46%, rgba(4, 6, 10, 0.98) 100%),
        linear-gradient(180deg, #010101 0%, #05070b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 14px;
    }

    .iframe-frame {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      background: linear-gradient(180deg, #08101d 0%, #050913 100%);
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(120, 149, 221, 0.16);
      box-shadow:
        0 24px 48px rgba(2, 6, 23, 0.5),
        0 0 0 1px rgba(83, 216, 255, 0.08),
        0 0 30px rgba(83, 216, 255, 0.08);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #111827;
    }

    iframe.ready {
      display: block;
    }

    .status-layer {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(83, 216, 255, 0.16), transparent 28%),
        radial-gradient(circle at bottom, rgba(181, 108, 255, 0.12), transparent 30%),
        linear-gradient(180deg, #0b1020 0%, #060913 100%);
      color: white;
    }

    .status-card {
      width: min(100%, 360px);
      padding: 20px 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(15, 20, 37, 0.88), rgba(9, 13, 25, 0.92));
      border: 1px solid rgba(145, 166, 224, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.28), var(--glow);
    }

    .status-card h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
    }

    .status-card p {
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .status-card code {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.76rem;
    }

    .hidden {
      display: none;
    }

    .status-card code {
      color: #f4f8ff;
    }

    @media (max-width: 767px) {
      .iframe-wrap {
        padding: 0;
      }

      .iframe-frame {
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="player-shell" id="player-shell">
    <aside class="title-rail">
      <div class="title-rail-card">
        <div class="brand-lockup">
          <a class="brand-link" data-install-link href="https://apps.apple.com/us/app/id6745799162" target="_blank" rel="noreferrer" aria-label="Open FriendJam on the App Store">
            <img class="logo-badge" data-logo alt="FriendJam logo" />
          </a>
          <div class="brand-text">
            <p class="brand-label">FriendJam</p>
            <h1 id="rail-title">FriendJam</h1>
          </div>
        </div>
        <div class="rail-actions">
          <a class="install-button" data-install-link href="https://apps.apple.com/us/app/id6745799162" target="_blank" rel="noreferrer" aria-label="Install the FriendJam app">
            <span class="install-glyph"></span>
            <span>Get App</span>
          </a>
          <button class="share-button" data-share-button type="button" aria-label="Copy share link">
            <span class="share-glyph">⤴</span>
            <span>Share</span>
          </button>
        </div>
      </div>
    </aside>

    <section class="main-panel">
      <div class="topbar">
        <div class="brand-lockup topbar-brand">
          <a class="brand-link" data-install-link href="https://apps.apple.com/us/app/id6745799162" target="_blank" rel="noreferrer" aria-label="Open FriendJam on the App Store">
            <img class="logo-badge" data-logo alt="FriendJam logo" />
          </a>
          <div class="brand-text">
            <h1 class="topbar-title" id="player-title">FriendJam</h1>
          </div>
        </div>
        <div class="controls">
          <a class="install-button" data-install-link href="https://apps.apple.com/us/app/id6745799162" target="_blank" rel="noreferrer" aria-label="Install the FriendJam app">
            <span class="install-glyph"></span>
            <span>Get App</span>
          </a>
          <button class="share-button" data-share-button type="button" aria-label="Copy share link">
            <span class="share-glyph">⤴</span>
            <span>Share</span>
          </button>
        </div>
      </div>

      <div class="iframe-wrap" id="iframe-wrap">
        <div class="iframe-frame" id="iframe-frame">
          <iframe id="game-iframe" title="Embedded game player" allowfullscreen></iframe>

          <div class="status-layer" id="status-layer">
            <div class="status-card">
              <h2 id="status-title">Connecting</h2>
              <p id="status-message">Pass a URL in <code>?url=...</code> or a base64 URL in <code>?url_b64=...</code> to start the player.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const FRIENDJAM_LOGO_URL = "https://www.krea.ai/api/img?f=webp&i=https%3A%2F%2Fapp-uploads.krea.ai%2Fpublic%2Fffc6baa2-4556-4517-9f21-bfc9227e6d56.png&s=1024";
    const APP_STORE_URL = "https://apps.apple.com/us/app/id6745799162";
    const FRAME_RATIO_WIDTH = 9;
    const FRAME_RATIO_HEIGHT = 16;
    const MIXPANEL_TOKEN = "919399d0433ce2ef7ba9e515b1c8567a";
    const MIXPANEL_INSTANCE_NAME = "friendjam";
    const ANALYTICS_PRODUCT = "friendjam-webplayer";

    const el = {
      shell: document.getElementById("player-shell"),
      logos: document.querySelectorAll("[data-logo]"),
      installLinks: document.querySelectorAll("[data-install-link]"),
      shareButtons: document.querySelectorAll("[data-share-button]"),
      railTitle: document.getElementById("rail-title"),
      title: document.getElementById("player-title"),
      iframeWrap: document.getElementById("iframe-wrap"),
      iframeFrame: document.getElementById("iframe-frame"),
      iframe: document.getElementById("game-iframe"),
      statusLayer: document.getElementById("status-layer"),
      statusTitle: document.getElementById("status-title"),
      statusMessage: document.getElementById("status-message")
    };

    let playerTitle = "FriendJam";
    let shareFeedbackTimer = null;

    const FALLBACK_VISIBLE_TITLE = "Play Now";
    const analytics = {
      ready: false,
      queue: [],
      sessionStartedAt: Date.now(),
      heartbeatId: null,
      sessionEnded: false,
      targetUrl: "",
      title: "",
      gameId: ""
    };

    function shortenTitle(value) {
      const normalized = String(value || "").trim();
      return normalized ? normalized.slice(0, 18) : FALLBACK_VISIBLE_TITLE;
    }

    function setPlayerTitle(value, fullTitle = null) {
      playerTitle = String(value || "").trim() || FALLBACK_VISIBLE_TITLE;
      const resolvedFullTitle = String(fullTitle || playerTitle).trim();
      document.title = resolvedFullTitle && resolvedFullTitle !== FALLBACK_VISIBLE_TITLE
        ? `FriendJam - ${resolvedFullTitle}`
        : "FriendJam";
      el.title.textContent = playerTitle;
      el.railTitle.textContent = playerTitle;
    }

    function currentLayoutMode() {
      return el.shell.classList.contains("landscape") ? "landscape" : "portrait";
    }

    function readGameIdParam() {
      const params = new URLSearchParams(window.location.search);
      const gameId = params.get("gameId");
      return String(gameId || "").trim();
    }

    function analyticsProperties(extra = {}) {
      return {
        product: ANALYTICS_PRODUCT,
        url: analytics.targetUrl || "",
        title: analytics.title || "",
        gameId: analytics.gameId || "",
        page_url: window.location.href,
        layout_mode: currentLayoutMode(),
        viewport_w: window.innerWidth,
        viewport_h: window.innerHeight,
        elapsed_ms: Date.now() - analytics.sessionStartedAt,
        ...extra
      };
    }

    function ensureMixpanelBootstrap() {
      if (window.mixpanel?.__SV) return;

      (function(documentRef, mixpanelName) {
        if (window[mixpanelName] && window[mixpanelName].__SV) return;
        const mixpanel = window[mixpanelName] = window[mixpanelName] || [];
        mixpanel._i = mixpanel._i || [];
        mixpanel.__SV = 1.2;

        function factory(target, methodName) {
          return function() {
            target.push([methodName].concat(Array.prototype.slice.call(arguments, 0)));
          };
        }

        function createStub(instanceName) {
          const instance = [];
          const methods = "disable time_event track track_pageview track_links track_forms track_with_groups add_group set_group remove_group register register_once alias unregister identify name_tag set_config reset people.set people.set_once people.unset people.increment people.append people.union people.track_charge people.clear_charges people.delete_user people.remove".split(" ");
          let methodIndex = 0;

          for (; methodIndex < methods.length; methodIndex += 1) {
            const methodName = methods[methodIndex];
            const parts = methodName.split(".");
            if (parts.length === 2) {
              instance[parts[0]] = instance[parts[0]] || [];
              instance[parts[0]][parts[1]] = factory(instance, methodName);
            } else {
              instance[methodName] = factory(instance, methodName);
            }
          }

          if (!instance.get_group) {
            instance.get_group = function() {
              const args = ["get_group"].concat(Array.prototype.slice.call(arguments, 0));
              const groupStub = [];
              const groupMethods = ["set", "set_once", "union", "unset", "remove", "delete"];
              for (let groupIndex = 0; groupIndex < groupMethods.length; groupIndex += 1) {
                const groupMethodName = groupMethods[groupIndex];
                groupStub[groupMethodName] = function() {
                  const groupArgs = [groupMethodName].concat(Array.prototype.slice.call(arguments, 0));
                  instance.push(args.concat([groupArgs]));
                };
              }
              return groupStub;
            };
          }

          return instance;
        }

        mixpanel.init = function(token, config, instanceName) {
          const targetName = instanceName || "mixpanel";
          const instance = createStub(targetName);
          mixpanel[targetName] = instance;
          mixpanel._i.push([token, config, targetName]);
        };

        const script = documentRef.createElement("script");
        script.type = "text/javascript";
        script.async = true;
        script.src = "https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js";

        const firstScript = documentRef.getElementsByTagName("script")[0];
        if (firstScript?.parentNode) {
          firstScript.parentNode.insertBefore(script, firstScript);
        } else {
          documentRef.head.appendChild(script);
        }
      })(document, "mixpanel");
    }

    function getMixpanelTracker() {
      return window.mixpanel?.[MIXPANEL_INSTANCE_NAME] || null;
    }

    function flushAnalyticsQueue() {
      const tracker = getMixpanelTracker();
      if (!analytics.ready || !tracker?.track) return;
      analytics.queue.splice(0).forEach(({ event, props }) => {
        tracker.track(event, props);
      });
    }

    function trackAnalytics(event, extra = {}) {
      const props = analyticsProperties(extra);
      const tracker = getMixpanelTracker();
      if (analytics.ready && tracker?.track) {
        tracker.track(event, props);
        return;
      }
      analytics.queue.push({ event, props });
    }

    function loadMixpanel() {
      ensureMixpanelBootstrap();
      if (!window.mixpanel?.init) return;

      window.mixpanel.init(MIXPANEL_TOKEN, { track_pageview: false }, MIXPANEL_INSTANCE_NAME);

      if (!getMixpanelTracker()?.track) return;
      analytics.ready = true;
      flushAnalyticsQueue();
    }

    function stopAliveHeartbeat() {
      if (!analytics.heartbeatId) return;
      window.clearInterval(analytics.heartbeatId);
      analytics.heartbeatId = null;
    }

    function startAliveHeartbeat() {
      stopAliveHeartbeat();
      analytics.heartbeatId = window.setInterval(() => {
        trackAnalytics("play_alive");
      }, 5000);
    }

    function endAnalyticsSession(reason) {
      if (analytics.sessionEnded) return;
      analytics.sessionEnded = true;
      stopAliveHeartbeat();
      trackAnalytics("player_session_ended", {
        reason,
        duration_ms: Date.now() - analytics.sessionStartedAt
      });
      flushAnalyticsQueue();
    }

    function activeRequestedTitle() {
      return readTitleParam();
    }

    function showStatus(title, message) {
      el.statusTitle.textContent = title;
      el.statusMessage.textContent = message;
      el.statusLayer.classList.remove("hidden");
      el.iframe.classList.remove("ready");
      el.iframe.removeAttribute("src");
      const requestedTitle = activeRequestedTitle();
      setPlayerTitle(requestedTitle ? shortenTitle(requestedTitle) : FALLBACK_VISIBLE_TITLE, requestedTitle || null);
    }

    function showPlayer(url) {
      const requestedTitle = activeRequestedTitle();
      setPlayerTitle(requestedTitle ? shortenTitle(requestedTitle) : FALLBACK_VISIBLE_TITLE, requestedTitle || null);
      el.iframe.src = url;
      el.iframe.classList.add("ready");
      el.statusLayer.classList.add("hidden");
    }

    function normalizeBase64(input) {
      const normalized = String(input || "").trim().replace(/-/g, "+").replace(/_/g, "/").replace(/\s+/g, "");
      if (!normalized) return "";
      const padding = normalized.length % 4;
      if (!padding) return normalized;
      return normalized + "=".repeat(4 - padding);
    }

    function decodeUtf8Base64(value) {
      const binary = atob(normalizeBase64(value));
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function readTargetUrl() {
      const params = new URLSearchParams(window.location.search);
      const plainUrl = params.get("url");
      if (plainUrl) {
        const parsedPlain = new URL(plainUrl);
        if (!["http:", "https:"].includes(parsedPlain.protocol)) {
          throw new Error("Only http and https URLs are supported.");
        }
        return parsedPlain.toString();
      }

      const encoded = params.get("url_b64");
      if (!encoded) return null;
      const decoded = decodeUtf8Base64(encoded);
      const parsed = new URL(decoded);
      if (!["http:", "https:"].includes(parsed.protocol)) {
        throw new Error("Only http and https URLs are supported.");
      }
      return parsed.toString();
    }

    function readTitleParam() {
      const params = new URLSearchParams(window.location.search);
      const title = params.get("title");
      return String(title || "").trim();
    }

    function updateLayoutMode() {
      const landscape = window.innerWidth > window.innerHeight;
      el.shell.classList.toggle("landscape", landscape);
      window.requestAnimationFrame(layoutIframeFrame);
    }

    function layoutIframeFrame() {
      if (!el.iframeWrap || !el.iframeFrame) return;

      const computed = window.getComputedStyle(el.iframeWrap);
      const paddingX = (parseFloat(computed.paddingLeft) || 0) + (parseFloat(computed.paddingRight) || 0);
      const paddingY = (parseFloat(computed.paddingTop) || 0) + (parseFloat(computed.paddingBottom) || 0);

      const availableWidth = Math.max(0, el.iframeWrap.clientWidth - paddingX);
      const availableHeight = Math.max(0, el.iframeWrap.clientHeight - paddingY);

      if (!availableWidth || !availableHeight) return;

      const widthFromHeight = availableHeight * FRAME_RATIO_WIDTH / FRAME_RATIO_HEIGHT;
      const heightFromWidth = availableWidth * FRAME_RATIO_HEIGHT / FRAME_RATIO_WIDTH;

      let frameWidth = widthFromHeight;
      let frameHeight = availableHeight;

      if (widthFromHeight > availableWidth) {
        frameWidth = availableWidth;
        frameHeight = heightFromWidth;
      }

      el.iframeFrame.style.width = `${Math.round(frameWidth)}px`;
      el.iframeFrame.style.height = `${Math.round(frameHeight)}px`;
    }

    async function copyShareUrl() {
      const value = window.location.href;
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
        return;
      }

      const input = document.createElement("textarea");
      input.value = value;
      input.setAttribute("readonly", "readonly");
      input.style.position = "absolute";
      input.style.left = "-9999px";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
    }

    function setShareButtonState(copied) {
      el.shareButtons.forEach(button => {
        button.classList.toggle("copied", copied);
        button.innerHTML = copied
          ? '<span class="share-glyph">✓</span><span>Copied</span>'
          : '<span class="share-glyph">⤴</span><span>Share</span>';
      });
    }

    async function handleShare() {
      try {
        trackAnalytics("share_clicked");
        await copyShareUrl();
        window.clearTimeout(shareFeedbackTimer);
        setShareButtonState(true);
        shareFeedbackTimer = window.setTimeout(() => setShareButtonState(false), 1400);
        trackAnalytics("share_copied");
      } catch (error) {
        // Ignore clipboard failures silently.
      }
    }

    function handleInstallTap(event) {
      const trigger = event.currentTarget?.classList.contains("brand-link") ? "logo" : "button";
      trackAnalytics("install_clicked", {
        destination_url: APP_STORE_URL,
        trigger
      });
    }

    function initialize() {
      updateLayoutMode();
      loadMixpanel();
      el.installLinks.forEach(node => {
        node.href = APP_STORE_URL;
      });
      el.logos.forEach(node => {
        node.src = FRIENDJAM_LOGO_URL;
      });
      setShareButtonState(false);
      const requestedTitle = activeRequestedTitle();
      analytics.title = requestedTitle;
      analytics.gameId = readGameIdParam();
      setPlayerTitle(requestedTitle ? shortenTitle(requestedTitle) : FALLBACK_VISIBLE_TITLE, requestedTitle || null);

      try {
        const target = readTargetUrl();
        analytics.targetUrl = target || "";
        trackAnalytics("player_page_loaded", {
          has_title_param: Boolean(requestedTitle),
          has_game_id: Boolean(analytics.gameId),
          target_present: Boolean(target)
        });

        if (!target) {
          showStatus("Connecting", "Pass a URL in ?url=... or a base64 URL in ?url_b64=... to start the player.");
          return;
        }

        showPlayer(target);
        startAliveHeartbeat();
      } catch (error) {
        trackAnalytics("player_page_loaded", {
          has_title_param: Boolean(requestedTitle),
          has_game_id: Boolean(analytics.gameId),
          target_present: false
        });
        showStatus("Unable to connect", error.message || "The provided URL could not be decoded.");
      }
    }

    el.shareButtons.forEach(button => {
      button.addEventListener("click", handleShare);
    });

    el.installLinks.forEach(link => {
      link.addEventListener("click", handleInstallTap);
    });

    if (window.ResizeObserver) {
      const stageObserver = new ResizeObserver(() => {
        layoutIframeFrame();
      });
      stageObserver.observe(el.iframeWrap);
    }

    el.iframe.addEventListener("load", () => {
      if (!el.iframe.src) return;
      el.statusLayer.classList.add("hidden");
      el.iframe.classList.add("ready");
      trackAnalytics("player_iframe_loaded");
    });

    window.addEventListener("resize", updateLayoutMode);
    window.addEventListener("pagehide", () => endAnalyticsSession("pagehide"));
    window.addEventListener("beforeunload", () => endAnalyticsSession("beforeunload"));

    initialize();
  </script>
</body>
</html>
