[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giphy-cli-wrapper"
version = "0.1.0"
description = "Thin CLI wrapper around the Giphy API using the official Python client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "giphy_client",
  "python-dotenv",
]

[project.scripts]
giphy = "giphy_cli.cli:main"

[tool.setuptools]
packages = ["giphy_cli"]