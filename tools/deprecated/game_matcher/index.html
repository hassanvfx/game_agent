<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Matcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.25), transparent 35%),
        linear-gradient(180deg, #081120 0%, #0f172a 45%, #111827 100%);
    }
    .glass {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    .card-glow:hover {
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <div class="mx-auto flex min-h-screen max-w-6xl flex-col px-4 py-4 sm:px-6 lg:px-8">
    <header class="mb-4 flex items-center justify-between">
      <div>
        <div class="text-xs uppercase tracking-[0.3em] text-sky-300">Standalone</div>
        <h1 class="text-2xl font-bold sm:text-3xl">Game Matcher</h1>
      </div>
      <button
        id="settingsButton"
        class="glass inline-flex h-11 w-11 items-center justify-center rounded-2xl text-slate-200 transition hover:border-sky-400 hover:text-sky-300"
        aria-label="Settings"
      >
        ⚙️
      </button>
    </header>

    <main class="flex-1 space-y-4">
      <section class="glass rounded-3xl p-4 sm:p-6">
        <label for="promptInput" class="mb-2 block text-sm font-medium text-slate-200">
          Match game idea
        </label>
        <textarea
          id="promptInput"
          rows="5"
          placeholder="Describe the game you want to generate. Example: A funny casual mobile endless runner with zombies, lane switching, and a meme vibe."
          class="w-full rounded-2xl border border-slate-700 bg-slate-950/60 px-4 py-3 text-base text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-sky-400"
        ></textarea>

        <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div id="statusText" class="text-sm text-slate-400">
            Ready.
          </div>
          <button
            id="generateButton"
            class="inline-flex items-center justify-center rounded-2xl bg-sky-500 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-sky-400 disabled:cursor-not-allowed disabled:bg-slate-600 disabled:text-slate-300"
          >
            Match
          </button>
        </div>
      </section>

      <section class="glass rounded-3xl p-4 sm:p-6">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-semibold">Translated query matches</h2>
          <span id="queryCount" class="text-sm text-slate-400">0 queries</span>
        </div>
        <div id="translatedQueries" class="flex flex-wrap gap-2"></div>
      </section>

      <section class="glass rounded-3xl p-4 sm:p-6">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-semibold">Ranked games</h2>
          <span id="resultCount" class="text-sm text-slate-400">0 results</span>
        </div>
        <div id="resultsGrid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
      </section>
    </main>
  </div>

  <div id="settingsModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-950/70 p-4 sm:items-center">
    <div class="glass w-full max-w-md rounded-3xl p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-lg font-semibold">Settings</h2>
        <button id="closeSettingsButton" class="rounded-xl px-3 py-2 text-slate-400 hover:text-white">✕</button>
      </div>

      <label for="apiKeyInput" class="mb-2 block text-sm font-medium text-slate-200">
        Chat Completions API Key
      </label>
      <input
        id="apiKeyInput"
        type="password"
        placeholder="Paste your API key"
        class="w-full rounded-2xl border border-slate-700 bg-slate-950/60 px-4 py-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-sky-400"
      />

      <div class="mt-4 flex gap-3">
        <button
          id="saveSettingsButton"
          class="flex-1 rounded-2xl bg-sky-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-sky-400"
        >
          Save
        </button>
        <button
          id="clearSettingsButton"
          class="rounded-2xl border border-slate-700 px-4 py-3 text-sm font-semibold text-slate-200 transition hover:border-rose-400 hover:text-rose-300"
        >
          Clear
        </button>
      </div>

      <p class="mt-3 text-xs text-slate-400">
        Your key is stored only in this browser via localStorage.
      </p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "game_matcher_api_key";
    const CHAT_COMPLETIONS_URL = "https://api.openai.com/v1/chat/completions";
    const MODEL_NAME = "gpt-4.1-mini";

    const state = {
      apiKey: localStorage.getItem(STORAGE_KEY) || "",
      allQueries: [],
      reverseIndex: null,
      translatedQueries: [],
      rankedGames: [],
    };

    const elements = {
      settingsButton: document.getElementById("settingsButton"),
      settingsModal: document.getElementById("settingsModal"),
      closeSettingsButton: document.getElementById("closeSettingsButton"),
      apiKeyInput: document.getElementById("apiKeyInput"),
      saveSettingsButton: document.getElementById("saveSettingsButton"),
      clearSettingsButton: document.getElementById("clearSettingsButton"),
      promptInput: document.getElementById("promptInput"),
      generateButton: document.getElementById("generateButton"),
      statusText: document.getElementById("statusText"),
      translatedQueries: document.getElementById("translatedQueries"),
      queryCount: document.getElementById("queryCount"),
      resultCount: document.getElementById("resultCount"),
      resultsGrid: document.getElementById("resultsGrid"),
    };

    function setStatus(message) {
      elements.statusText.textContent = message;
    }

    function openSettings() {
      elements.apiKeyInput.value = state.apiKey;
      elements.settingsModal.classList.remove("hidden");
      elements.settingsModal.classList.add("flex");
    }

    function closeSettings() {
      elements.settingsModal.classList.add("hidden");
      elements.settingsModal.classList.remove("flex");
    }

    function saveApiKey() {
      state.apiKey = elements.apiKeyInput.value.trim();
      localStorage.setItem(STORAGE_KEY, state.apiKey);
      setStatus(state.apiKey ? "API key saved." : "API key cleared.");
      closeSettings();
    }

    function clearApiKey() {
      state.apiKey = "";
      localStorage.removeItem(STORAGE_KEY);
      elements.apiKeyInput.value = "";
      setStatus("API key cleared.");
    }

    function renderTranslatedQueries(queries) {
      elements.translatedQueries.innerHTML = "";
      elements.queryCount.textContent = `${queries.length} quer${queries.length === 1 ? "y" : "ies"}`;

      if (!queries.length) {
        const empty = document.createElement("div");
        empty.className = "text-sm text-slate-400";
        empty.textContent = "No translated queries yet.";
        elements.translatedQueries.appendChild(empty);
        return;
      }

      for (const query of queries) {
        const chip = document.createElement("span");
        chip.className = "rounded-full border border-sky-400/30 bg-sky-400/10 px-3 py-1 text-sm text-sky-200";
        chip.textContent = query;
        elements.translatedQueries.appendChild(chip);
      }
    }

    function createMetric(label, value) {
      const wrap = document.createElement("div");
      wrap.className = "rounded-xl bg-slate-900/60 px-3 py-2";
      const labelEl = document.createElement("div");
      labelEl.className = "text-[11px] uppercase tracking-wide text-slate-400";
      labelEl.textContent = label;
      const valueEl = document.createElement("div");
      valueEl.className = "mt-1 text-sm font-semibold text-slate-100";
      valueEl.textContent = value;
      wrap.appendChild(labelEl);
      wrap.appendChild(valueEl);
      return wrap;
    }

    function renderResults(games) {
      elements.resultsGrid.innerHTML = "";
      elements.resultCount.textContent = `${games.length} result${games.length === 1 ? "" : "s"}`;

      if (!games.length) {
        const empty = document.createElement("div");
        empty.className = "col-span-full text-sm text-slate-400";
        empty.textContent = "No matching games found.";
        elements.resultsGrid.appendChild(empty);
        return;
      }

      for (const game of games) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card-glow overflow-hidden rounded-3xl border border-slate-800 bg-slate-950/60 text-left transition";
        card.addEventListener("click", () => {
          if (game.url) {
            window.open(game.url, "_blank", "noopener,noreferrer");
          }
        });

        const cover = document.createElement("div");
        cover.className = "aspect-[16/10] bg-slate-900";
        if (game.cover_url) {
          const img = document.createElement("img");
          img.src = game.cover_url;
          img.alt = game.name || "Game cover";
          img.className = "h-full w-full object-cover";
          img.loading = "lazy";
          cover.appendChild(img);
        } else {
          cover.classList.add("flex", "items-center", "justify-center", "text-slate-500");
          cover.textContent = "No cover";
        }

        const body = document.createElement("div");
        body.className = "space-y-3 p-4";

        const title = document.createElement("div");
        title.className = "line-clamp-2 text-base font-semibold text-white";
        title.textContent = game.name || `Game ${game.game_id}`;

        const matches = document.createElement("div");
        matches.className = "flex flex-wrap gap-2";
        for (const query of game.matched_queries.slice(0, 4)) {
          const chip = document.createElement("span");
          chip.className = "rounded-full border border-emerald-400/30 bg-emerald-400/10 px-2.5 py-1 text-xs text-emerald-200";
          chip.textContent = query;
          matches.appendChild(chip);
        }

        const metrics = document.createElement("div");
        metrics.className = "grid grid-cols-2 gap-2";
        metrics.appendChild(createMetric("Coverage", `${Math.round((game.coverage || 0) * 100)}%`));
        metrics.appendChild(createMetric("Distance", game.distance.toFixed(2)));
        metrics.appendChild(createMetric("Name overlap", game.prompt_name_overlap ?? 0));
        metrics.appendChild(createMetric("Best feed", game.best_feed_position ?? "-"));

        body.appendChild(title);
        body.appendChild(matches);
        body.appendChild(metrics);

        card.appendChild(cover);
        card.appendChild(body);
        elements.resultsGrid.appendChild(card);
      }
    }

    function tokenize(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]+/g, " ")
        .split(/\s+/)
        .filter(token => token.length > 1);
    }

    function overlapCount(aTokens, bTokens) {
      const bSet = new Set(bTokens);
      let count = 0;
      for (const token of aTokens) {
        if (bSet.has(token)) count += 1;
      }
      return count;
    }

    function rankGames(prompt, translatedQueries) {
      const weightedQueries = translatedQueries.map((query, index) => ({
        query,
        lower: query.toLowerCase(),
        weight: Math.max(0.15, 1 - index * 0.08),
        tokens: tokenize(query),
      }));

      const promptTokens = tokenize(prompt);
      const games = state.reverseIndex.games || [];
      const ranked = [];
      const missingPenalty = 150;
      const exactMismatchPenalty = 8;
      const bestPositionPenaltyFactor = 1.5;
      const avgPositionPenaltyFactor = 0.5;

      for (const game of games) {
        const matchMap = new Map();

        for (const match of game.query_matches || []) {
          const query = String(match.query || "").toLowerCase();
          const weighted = weightedQueries.find(item => item.lower === query);
          if (!weighted) continue;

          const existing = matchMap.get(weighted.lower);
          if (!existing || match.feed_position < existing.feed_position) {
            matchMap.set(weighted.lower, {
              query: match.query,
              feed_position: match.feed_position,
              exact_match: Boolean(match.exact_match),
              weight: weighted.weight,
            });
          }
        }

        const matchedEntries = Array.from(matchMap.values()).sort((a, b) => a.feed_position - b.feed_position);
        const matchedQueries = matchedEntries.map(item => item.query);
        const matchedCount = matchedEntries.length;
        const coverage = weightedQueries.length ? matchedCount / weightedQueries.length : 0;
        const exactMatchCount = matchedEntries.filter(item => item.exact_match).length;

        let distance = 0;
        for (const weighted of weightedQueries) {
          const match = matchMap.get(weighted.lower);
          if (!match) {
            distance += weighted.weight * missingPenalty;
            continue;
          }

          const effectivePosition = Math.min(match.feed_position, 10);
          distance += weighted.weight * (effectivePosition ** 2);
          if (!match.exact_match) {
            distance += weighted.weight * exactMismatchPenalty;
          }
        }

        const bestFeedPosition = matchedEntries.length
          ? Math.min(...matchedEntries.map(item => item.feed_position))
          : 9999;
        const avgMatchedPosition = matchedEntries.length
          ? matchedEntries.reduce((sum, item) => sum + item.feed_position, 0) / matchedEntries.length
          : 9999;

        distance += bestPositionPenaltyFactor * (Math.min(bestFeedPosition, 10) ** 2);
        distance += avgPositionPenaltyFactor * (Math.min(avgMatchedPosition, 10) ** 2);

        const gameNameTokens = tokenize(game.name);
        const matchedQueryTokens = matchedQueries.flatMap(query => tokenize(query));
        const promptNameOverlap = overlapCount(promptTokens, gameNameTokens);
        const promptQueryOverlap = overlapCount(promptTokens, matchedQueryTokens);

        const queryLexicalBonus = weightedQueries.reduce((sum, item) => {
          const nameOverlap = overlapCount(item.tokens, gameNameTokens);
          return sum + item.weight * nameOverlap * 10;
        }, 0);

        const popularityBoost = Math.min(game.query_count || 0, 100) * 0.05
          + Math.min((game.stats?.played_count || 0) / 5000, 20);

        const finalDistance =
          distance
          - exactMatchCount * 25
          - promptNameOverlap * 40
          - promptQueryOverlap * 15
          - queryLexicalBonus
          - popularityBoost;

        ranked.push({
          ...game,
          matched_queries: matchedQueries,
          matched_count: matchedCount,
          coverage,
          best_feed_position: matchedEntries.length ? bestFeedPosition : null,
          avg_matched_position: matchedEntries.length ? Number(avgMatchedPosition.toFixed(3)) : null,
          distance: Number(finalDistance.toFixed(3)),
          raw_distance: Number(distance.toFixed(3)),
          exact_match_count: exactMatchCount,
          prompt_name_overlap: promptNameOverlap,
          prompt_query_overlap: promptQueryOverlap,
          played_count: game.played_count ?? game.stats?.played_count ?? 0,
        });
      }

      ranked.sort((a, b) =>
        b.prompt_name_overlap - a.prompt_name_overlap ||
        b.prompt_query_overlap - a.prompt_query_overlap ||
        b.coverage - a.coverage ||
        a.distance - b.distance ||
        a.best_feed_position - b.best_feed_position ||
        b.exact_match_count - a.exact_match_count ||
        (b.query_count || 0) - (a.query_count || 0) ||
        (b.played_count || 0) - (a.played_count || 0)
      );

      return ranked;
    }

    async function translatePromptToQueries(prompt) {
      if (!state.apiKey) {
        throw new Error("Missing API key. Open settings and save your Chat Completions API key.");
      }

      const systemPrompt = [
        "You translate a user's game idea into the best matching search queries.",
        "You are given a fixed vocabulary of valid query strings.",
        "Return ONLY a JSON array of up to 10 strings.",
        "Every returned string must be copied exactly from the provided vocabulary.",
        "Do not include any explanation, markdown, or extra text."
      ].join(" ");

      const userPrompt = {
        task: "Select the top 10 best matching query strings for this game idea.",
        game_prompt: prompt,
        valid_queries: state.allQueries
      };

      const response = await fetch(CHAT_COMPLETIONS_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${state.apiKey}`,
        },
        body: JSON.stringify({
          model: MODEL_NAME,
          temperature: 0.2,
          response_format: { type: "json_object" },
          messages: [
            { role: "system", content: systemPrompt },
            {
              role: "user",
              content: JSON.stringify({
                instruction: userPrompt,
                required_output_shape: {
                  queries: ["query string 1", "query string 2"]
                }
              })
            }
          ],
        }),
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`Chat Completions request failed: ${response.status} ${text}`);
      }

      const payload = await response.json();
      const content = payload?.choices?.[0]?.message?.content;
      if (!content) {
        throw new Error("No content returned from Chat Completions API.");
      }

      let parsed;
      try {
        parsed = JSON.parse(content);
      } catch (error) {
        throw new Error("Model did not return valid JSON.");
      }

      const queries = Array.isArray(parsed?.queries) ? parsed.queries : [];
      const allowed = new Set(state.allQueries);
      const filtered = [];
      for (const query of queries) {
        if (typeof query === "string" && allowed.has(query) && !filtered.includes(query)) {
          filtered.push(query);
        }
      }

      return filtered.slice(0, 10);
    }

    async function loadData() {
      setStatus("Loading query vocabulary and reverse index...");
      const [queryRes, reverseRes] = await Promise.all([
        fetch("./fixtures/consolidated/all_queries.json"),
        fetch("./fixtures/consolidated/master_game_reverse_index.json"),
      ]);

      if (!queryRes.ok) throw new Error("Failed to load all_queries.json");
      if (!reverseRes.ok) throw new Error("Failed to load full reverse index");

      state.allQueries = await queryRes.json();
      state.reverseIndex = await reverseRes.json();
      setStatus(`Loaded ${state.allQueries.length} queries and ${(state.reverseIndex.games || []).length} games.`);
    }

    async function handleMatch() {
      const prompt = elements.promptInput.value.trim();
      if (!prompt) {
        setStatus("Enter a prompt first.");
        return;
      }

      elements.generateButton.disabled = true;
      setStatus("Translating prompt into top query matches...");

      try {
        const translatedQueries = await translatePromptToQueries(prompt);
        state.translatedQueries = translatedQueries;
        renderTranslatedQueries(translatedQueries);

        setStatus("Ranking all games by query-match distance...");
        const rankedGames = rankGames(prompt, translatedQueries);
        state.rankedGames = rankedGames;
        renderResults(rankedGames.slice(0, 60));

        setStatus(`Done. ${translatedQueries.length} translated queries, ${rankedGames.length} ranked games sorted by highest coverage and lowest distance.`);
      } catch (error) {
        console.error(error);
        setStatus(error.message || "Something went wrong.");
      } finally {
        elements.generateButton.disabled = false;
      }
    }

    elements.settingsButton.addEventListener("click", openSettings);
    elements.closeSettingsButton.addEventListener("click", closeSettings);
    elements.saveSettingsButton.addEventListener("click", saveApiKey);
    elements.clearSettingsButton.addEventListener("click", clearApiKey);
    elements.generateButton.addEventListener("click", handleMatch);
    elements.settingsModal.addEventListener("click", (event) => {
      if (event.target === elements.settingsModal) closeSettings();
    });

    renderTranslatedQueries([]);
    renderResults([]);

    loadData().catch((error) => {
      console.error(error);
      setStatus(error.message || "Failed to load app data.");
    });
  </script>
</body>
</html>
