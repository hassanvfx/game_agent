<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SYSTEM: FIREWALL RUN</title>
    <!-- [agent-note][stage4] resolved-font: title-display=Audiowide | sci-fi-accent=Orbitron | ui-readability=Rajdhani via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #04030c;
            --bg-mid: #0c1130;
            --panel: rgba(8, 14, 36, 0.84);
            --panel-strong: rgba(10, 20, 50, 0.94);
            --panel-edge: #38bdf8;
            --panel-glow: rgba(56, 189, 248, 0.24);
            --hero-core: #7dd3fc;
            --hero-accent: #22d3ee;
            --enemy-core: #fb7185;
            --pickup-core: #86efac;
            --warning: #f59e0b;
            --text-main: #eff6ff;
            --text-soft: #bfdbfe;
            --grid-line: rgba(82, 146, 255, 0.14);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(34, 211, 238, 0.12), transparent 35%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 55%, #020208 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            color: var(--text-main);
        }

        body { position: relative; }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 18%, rgba(34, 211, 238, 0.14), transparent 20%),
                radial-gradient(circle at 80% 22%, rgba(244, 114, 182, 0.12), transparent 18%),
                linear-gradient(120deg, transparent 0%, rgba(56, 189, 248, 0.035) 45%, transparent 100%);
            z-index: 0;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            box-sizing: border-box;
        }

        .pointer-events-auto { pointer-events: auto; }

        /* Utility replacements for removed Tailwind runtime */
        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 12px;
        }

        .hud-left {
            min-width: 200px;
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 8px;
        }

        .avatar-box {
            width: 40px;
            height: 40px;
            background:
                radial-gradient(circle at 35% 30%, rgba(125, 211, 252, 0.85), rgba(34, 211, 238, 0.25) 42%, rgba(3, 7, 18, 0.95) 43%),
                linear-gradient(145deg, #051120, #0a1b34);
            border: 1px solid var(--panel-edge);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            animation: pulse 1.2s infinite;
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.25), inset 0 0 12px rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .avatar-box::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(125, 211, 252, 0.22);
            border-radius: 9px;
        }

        .hud-main { flex: 1; }

        .hud-topline {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: var(--text-soft);
            font-size: 13px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .bar-shell {
            width: 100%;
            height: 8px;
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.28);
            box-sizing: border-box;
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.1s;
        }

        .hp-fill {
            background: linear-gradient(90deg, var(--hero-accent), var(--hero-core));
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
        }

        .xp-shell {
            width: 100%;
            height: 4px;
            margin-top: 4px;
            background: rgba(2, 6, 23, 0.75);
            border-radius: 999px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #facc15, #fb7185);
            transition: width 0.3s;
        }

        .score-panel {
            padding: 8px 16px;
        }

        .score-label {
            font-size: 12px;
            color: var(--text-soft);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .score-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.18em;
            font-family: 'Audiowide', cursive;
            text-shadow: 0 0 12px rgba(125, 211, 252, 0.35);
        }

        /* Cyber Glass UI */
        .cyber-panel {
            background:
                linear-gradient(180deg, rgba(14, 24, 52, 0.96), var(--panel));
            border: 1px solid rgba(125, 211, 252, 0.42);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 0 18px var(--panel-glow),
                inset 0 0 28px rgba(56, 189, 248, 0.08);
            backdrop-filter: blur(8px);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        /* Text Styling */
        .neon-text { color: var(--hero-core); text-shadow: 0 0 8px rgba(125, 211, 252, 0.8); }
        .neon-text-warn { color: var(--enemy-core); text-shadow: 0 0 8px rgba(251, 113, 133, 0.7); }

        /* Start Screen */
        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 50;
            pointer-events: auto;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        #start-screen.hidden,
        #controls.hidden,
        #joystick-hint.hidden {
            display: none;
        }

        .intro-line {
            color: var(--hero-core);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            margin-bottom: 12px;
            animation: pulse 1.2s infinite;
        }

        .game-title {
            margin: 0 0 16px;
            color: #fff;
            font-size: clamp(48px, 11vw, 104px);
            font-family: 'Audiowide', cursive;
            font-weight: 400;
            letter-spacing: 0.08em;
            line-height: 0.9;
            text-shadow: 0 0 0 #fff, 0 0 16px rgba(34, 211, 238, 0.4), 5px 5px 0 rgba(8, 20, 50, 0.95);
            text-transform: uppercase;
        }

        .intro-copy {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 28px;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.35;
            max-width: 540px;
        }

        .intro-copy p {
            margin: 0;
        }

        .start-button {
            padding: 15px 34px;
            background: linear-gradient(180deg, #0ea5e9, #0369a1);
            border: 1px solid #93c5fd;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            transition: transform 0.1s, background 0.1s, box-shadow 0.1s, filter 0.1s;
            cursor: pointer;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .start-button:hover {
            background: linear-gradient(180deg, #38bdf8, #0284c7);
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.5);
        }
        .start-button:active { transform: scale(0.95); filter: brightness(1.08); }

        /* Skill Buttons */
        #controls {
            position: absolute;
            right: 24px;
            bottom: 24px;
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .skill-btn {
            width: 64px;
            height: 64px;
            background: linear-gradient(180deg, rgba(12, 20, 44, 0.96), rgba(2, 6, 23, 0.96));
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            line-height: 1;
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 8px 18px rgba(2, 6, 23, 0.35);
        }

        .skill-btn::before {
            content:'';
            position:absolute;
            inset:1px;
            border-radius: 16px;
            border: 1px solid rgba(125, 211, 252, 0.12);
            pointer-events: none;
        }

        .skill-btn::after {
            content:'';
            position:absolute;
            inset:0;
            background: linear-gradient(to bottom, rgba(125, 211, 252, 0.12), transparent 44%, rgba(14, 165, 233, 0.08) 45%, transparent 100%);
            background-size: 100% 100%;
            pointer-events: none;
        }

        .skill-btn.active { border-color: #38bdf8; box-shadow: 0 0 18px rgba(56, 189, 248, 0.32); color: #e0f2fe; }
        .skill-btn:active { transform: scale(0.95); }
        .skill-btn.cooldown { filter: grayscale(1); border-color: rgba(71, 85, 105, 0.65); opacity: 0.5; }
        .skill-label {
            font-size: 0.58rem;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 600;
            opacity: 0.78;
            margin-top: 4px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #joystick-hint {
            position: absolute;
            left: 40px;
            bottom: 96px;
            color: rgba(125, 211, 252, 0.68);
            font-size: 13px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            animation: pulse 1.2s infinite;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }

        /* Damage Numbers */
        #damage-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .dmg-num { position: absolute; font-weight: bold; font-size: 20px; animation: glitchFloat 0.6s forwards; white-space: nowrap; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 12px currentColor; }
        @keyframes glitchFloat {
            0% { opacity: 1; transform: translate(0,0) scale(1); clip-path: inset(0 0 0 0); }
            20% { clip-path: inset(20% 0 0 0); transform: translate(-2px, -10px); }
            40% { clip-path: inset(0 0 20% 0); transform: translate(2px, -20px); }
            100% { opacity: 0; transform: translate(0, -50px) scale(1.2); }
        }

        /* Scanline Overlay */
        .scanlines {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.12) 50%, rgba(0,0,0,0.12)),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05), transparent 18%, transparent 82%, rgba(244, 114, 182, 0.05));
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.34;
            mix-blend-mode: screen;
        }

        #feedback-gifs {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 18;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(96px, 20vw, 160px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            opacity: 0;
            transform: scale(0.72);
            transition: opacity 0.18s ease, transform 0.18s ease;
            filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.35));
            border: 1px solid rgba(125, 211, 252, 0.32);
            border-radius: 16px;
            background: rgba(2, 6, 23, 0.75);
        }

        .feedback-gif.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .feedback-gif.active {
            opacity: 0.92;
            visibility: visible;
            transform: scale(1);
        }

        #gif-hit {
            right: 16px;
            top: 104px;
        }

        #gif-patch {
            left: 16px;
            bottom: 156px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        @media (max-width: 720px) {
            #ui-layer { padding: 12px; }
            .hud-row { gap: 8px; }
            .hud-left { min-width: 0; flex: 1; }
            .avatar-box { width: 34px; height: 34px; font-size: 18px; }
            .hud-topline { font-size: 10px; }
            .score-label { font-size: 10px; }
            .score-value { font-size: 18px; letter-spacing: 0.1em; }
            .intro-line { font-size: 14px; }
            .game-title { font-size: clamp(42px, 14vw, 68px); }
            .intro-copy { font-size: 16px; margin-bottom: 24px; }
            .start-button { font-size: 16px; padding: 13px 24px; }
            #controls { right: 12px; bottom: 12px; gap: 8px; }
            .skill-btn { width: 56px; height: 56px; font-size: 0.95rem; }
            #joystick-hint { left: 12px; bottom: 78px; font-size: 11px; }
        }
    </style>
</head>

<script>
/**
 * SYSTEM: FIREWALL_RUN
 * Arena survival reinterpreted as a live cyber defense drill.
 */

// --- CONFIG & STATE ---
const CONFIG = {
    heroSpeed: 8,
    colors: {
        bg: '#04030c',
        grid: 'rgba(82, 146, 255, 0.14)',
        hero: '#22d3ee',
        enemy: '#fb7185',
        pickup: '#86efac',
        shadow: 'rgba(0,0,0,0.38)'
    },
    glitchIntensity: 1.0
};

const STATE = {
    screen: 'start', // start, playing, gameover
    t: 0,
    dt: 0,
    cam: { x: 0, y: 0, zoom: 1, shake: 0 },
    pointer: { x: 0, y: 0, isDown: false, startX: 0, startY: 0 },
    score: 0,
    level: 1,
    xp: 0,
    xpNext: 100,
    hero: null,
    enemies: [],
    pickups: [],
    particles: [],
    feedbackTimers: { hit: 0, patch: 0 },
    lowHealthWarnAt: 0,
    gameOverHandled: false
};

// --- AUDIO SYSTEM ---
const AUDIO = {
    ctx: null,
    bgmNode: null,
    muted: false,

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    play(id, loop = false, pitch = 1.0, vol = 1.0) {
        if (this.muted) return null;
        const el = document.getElementById(id);
        if (!el) return null;

        const resolvedVolume = Math.min(1, Math.max(0, vol * (id.includes('bgm') ? 0.2 : 0.5)));

        try {
            if (loop) {
                el.pause();
                el.currentTime = 0;
                el.loop = true;
                el.playbackRate = pitch;
                el.volume = resolvedVolume;
                const playPromise = el.play();
                if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
                return el;
            }

            const clone = el.cloneNode(true);
            clone.loop = false;
            clone.playbackRate = pitch;
            clone.volume = resolvedVolume;
            clone.addEventListener('ended', () => clone.remove(), { once: true });
            document.body.appendChild(clone);
            const playPromise = clone.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => clone.remove());
            }
            return clone;
        } catch (e) {
            return null;
        }
    },

    startBGM() {
        if (!this.bgmNode) this.bgmNode = this.play('bgm_main', true, 0.95);
    },

    stopBGM() {
        if (!this.bgmNode) return;
        try {
            this.bgmNode.pause();
            this.bgmNode.currentTime = 0;
        } catch (e) {}
        this.bgmNode = null;
    },

    synthExplosion() {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
};

// --- ENTITIES ---
class Entity {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.z = 0;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.w = 30; this.h = 30; this.d = 60; // d is height
        this.color = color;
        this.hp = 100; this.maxHp = 100;
        this.dead = false;
        this.facing = 1;
        this.flash = 0;
    }

    update(dt) {
        // Physics
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Gravity
        if (this.z > 0 || this.vz > 0) {
            this.vz -= 900 * dt;
            this.z += this.vz * dt;
            if (this.z <= 0) { this.z = 0; this.vz = 0; }
        }

        // Friction
        this.vx *= 0.9;
        this.vy *= 0.9;
        if (this.flash > 0) this.flash -= dt;
    }

    draw(ctx) {
        const drawX = this.x;
        const drawY = this.y - this.z;
        const c = this.flash > 0 ? '#fff' : this.color;
        const topShade = adjustColor(c, 55);
        const sideShade = adjustColor(c, -55);

        // Shadow
        ctx.fillStyle = CONFIG.colors.shadow;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.w/1.45, this.w/3.2, 0, 0, Math.PI*2);
        ctx.fill();

        // Ambient glow
        ctx.save();
        ctx.globalAlpha = this.type === 'enemy' ? 0.18 : 0.24;
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(drawX, drawY - this.d * 0.55, this.w * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 3D block projection
        ctx.fillStyle = topShade;
        ctx.fillRect(drawX - this.w/2, drawY - this.d - this.w/2, this.w, this.w/2);

        ctx.fillStyle = c;
        ctx.fillRect(drawX - this.w/2, drawY - this.d, this.w, this.d);

        ctx.fillStyle = sideShade;
        ctx.beginPath();
        ctx.moveTo(drawX + this.w/2, drawY - this.d - this.w/2);
        ctx.lineTo(drawX + this.w/2 + 10, drawY - this.d - this.w/2 - 5);
        ctx.lineTo(drawX + this.w/2 + 10, drawY - 5);
        ctx.lineTo(drawX + this.w/2, drawY);
        ctx.fill();

        ctx.strokeStyle = adjustColor(c, 95);
        ctx.lineWidth = 2;
        ctx.strokeRect(drawX - this.w/2 + 1, drawY - this.d + 1, this.w - 2, this.d - 2);

        if (this.type === 'hero') {
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.fillRect(drawX - this.w/2 + 4, drawY - this.d + 5, this.w - 8, 6);

            ctx.fillStyle = '#031525';
            ctx.beginPath();
            ctx.arc(drawX, drawY - this.d + 24, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e0f2fe';
            ctx.fillRect(drawX - 8 + this.facing * 2, drawY - this.d + 21, 4, 4);
            ctx.fillRect(drawX + 4 + this.facing * 2, drawY - this.d + 21, 4, 4);

            ctx.strokeStyle = '#67e8f9';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(drawX, drawY - this.d + 24, 16, Math.PI * 1.08, Math.PI * 1.92);
            ctx.stroke();
        } else if (this.type === 'enemy') {
            ctx.fillStyle = '#22040b';
            const eyeY = drawY - this.d + 15;
            const eyeOff = this.facing * 4;
            ctx.fillRect(drawX - 7 + eyeOff, eyeY, 5, 5);
            ctx.fillRect(drawX + 2 + eyeOff, eyeY, 5, 5);
            ctx.fillStyle = '#fecdd3';
            ctx.fillRect(drawX - 6 + eyeOff, eyeY + 1, 3, 2);
            ctx.fillRect(drawX + 3 + eyeOff, eyeY + 1, 3, 2);
        } else if (this.type === 'pickup') {
            ctx.strokeStyle = 'rgba(255,255,255,0.75)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(drawX, drawY - this.d - 6);
            ctx.lineTo(drawX, drawY + 6);
            ctx.moveTo(drawX - 6, drawY - this.d/2);
            ctx.lineTo(drawX + 6, drawY - this.d/2);
            ctx.stroke();
        }
    }

    takeDamage(amt, srcX, srcY) {
        this.hp -= amt;
        this.flash = 0.1;

        if (this.type === 'hero') {
            triggerFeedback('hit', 680);
        }

        // Knockback
        const angle = Math.atan2(this.y - srcY, this.x - srcX);
        this.vx = Math.cos(angle) * 300;
        this.vy = Math.sin(angle) * 300;
        this.vz = 200;

        spawnText(this.x, this.y - this.d, amt, '#ef4444');
        spawnParticles(this.x, this.y - this.d/2, this.color, 5);

        if (this.hp <= 0) {
            this.dead = true;
            this.onDeath();
        } else {
            AUDIO.play('sfx_hit', false, 1.2 + Math.random()*0.4);
        }
    }

    onDeath() {}
}

class Hero extends Entity {
    constructor() {
        super(0, 0, CONFIG.colors.hero);
        this.type = 'hero';
        this.cooldowns = { z:0, x:0, c:0 };
        this.mode = 'DEFAULT'; // DEFAULT, FIREWALL, CRYO
    }

    update(dt) {
        super.update(dt);

        // Input Movement
        if (STATE.pointer.isDown) {
            const dx = STATE.pointer.x - STATE.pointer.startX;
            const dy = STATE.pointer.y - STATE.pointer.startY;
            const dist = Math.hypot(dx, dy);
            if (dist > 10) {
                const angle = Math.atan2(dy, dx);
                const spd = CONFIG.heroSpeed * 60;
                this.x += Math.cos(angle) * spd * dt;
                this.y += Math.sin(angle) * spd * dt;
                this.facing = Math.sign(dx) || 1;
            }
        }

        // Bounds
        this.x = Math.max(-800, Math.min(800, this.x));
        this.y = Math.max(-800, Math.min(800, this.y));

        // Cooldowns
        for(let k in this.cooldowns) this.cooldowns[k] = Math.max(0, this.cooldowns[k] - dt);
    }

    skill(key) {
        if (this.cooldowns[key] > 0) return;

        let range = 80, dmg = 20, cd = 0.5, color = '#fff';

        if (key === 'z') { // Fast
            range = 100; dmg = 15 + STATE.level*2; cd = 0.4;
            color = '#0ea5e9';
        } else if (key === 'x') { // AoE
            range = 160; dmg = 25 + STATE.level*3; cd = 1.5;
            color = '#f59e0b';
        } else if (key === 'c') { // Ultimate
            range = 250; dmg = 50 + STATE.level*5; cd = 4.0;
            color = '#ec4899';
            STATE.cam.shake = 10;
        }

        this.cooldowns[key] = cd;

        // Effect
        spawnParticles(this.x, this.y, color, 15);
        AUDIO.play('sfx_skill', false, key === 'c' ? 0.78 : 1 + (key === 'z' ? 0.22 : 0.08), key === 'c' ? 0.95 : 0.7);

        STATE.enemies.forEach(e => {
            if (Math.hypot(e.x - this.x, e.y - this.y) < range) {
                e.takeDamage(dmg, this.x, this.y);
            }
        });

        updateSkillUI();
    }
}

class Enemy extends Entity {
    constructor() {
        const ang = Math.random() * 6.28;
        const dist = 500 + Math.random()*200;
        super(STATE.hero.x + Math.cos(ang)*dist, STATE.hero.y + Math.sin(ang)*dist, CONFIG.colors.enemy);
        this.type = 'enemy';
        this.hp = 30 + STATE.level * 10;
        this.speed = 3 + Math.random() * 2;
        this.atkTimer = 0;
    }

    update(dt) {
        super.update(dt);
        if (this.z > 5) return;

        const dx = STATE.hero.x - this.x;
        const dy = STATE.hero.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 40) {
            this.x += (dx/dist) * this.speed * 60 * dt;
            this.y += (dy/dist) * this.speed * 60 * dt;
            this.facing = Math.sign(dx) || 1;
        } else {
            this.atkTimer += dt;
            if (this.atkTimer > 1.0) {
                STATE.hero.takeDamage(5 + STATE.level, this.x, this.y);
                this.atkTimer = 0;
                this.vz = 150; // Hop attack
            }
        }
    }

    onDeath() {
        STATE.score += 100;
        STATE.xp += 20;
        if (STATE.xp >= STATE.xpNext) levelUp();
        spawnParticles(this.x, this.y, this.color, 10);
        AUDIO.synthExplosion();
        updateHUD();
    }
}

class Pickup extends Entity {
    constructor() {
        const ang = Math.random() * 6.28;
        const dist = 300 + Math.random()*300;
        super(STATE.hero.x + Math.cos(ang)*dist, STATE.hero.y + Math.sin(ang)*dist, CONFIG.colors.pickup);
        this.type = 'pickup';
        this.w = 15; this.h = 15; this.d = 15;
        this.bob = Math.random() * 10;
    }

    update(dt) {
        this.bob += dt * 4;
        this.z = 20 + Math.sin(this.bob) * 5;

        if (Math.hypot(STATE.hero.x - this.x, STATE.hero.y - this.y) < 40) {
            this.dead = true;
            STATE.hero.hp = Math.min(STATE.hero.maxHp, STATE.hero.hp + 20);
            spawnText(STATE.hero.x, STATE.hero.y - 60, "PATCHED", "#22c55e");
            AUDIO.play('sfx_collect', false, 1.5);
            triggerFeedback('patch', 950);
            updateHUD();
        }
    }
}

// --- PARTICLES & FX ---
function spawnParticles(x, y, c, n) {
    for(let i=0; i<n; i++) {
        STATE.particles.push({
            x, y, z: 20,
            vx: (Math.random()-0.5)*400, vy: (Math.random()-0.5)*400, vz: Math.random()*300,
            life: 1.0, color: c, size: 4 + Math.random()*6
        });
    }
}

function spawnText(x, y, txt, c) {
    const el = document.createElement('div');
    el.className = 'dmg-num';
    el.style.color = c;
    el.innerText = txt;
    // Position will be set in loop
    el._worldPos = {x, y};
    document.getElementById('damage-container').appendChild(el);
    setTimeout(() => el.remove(), 600);
}

// --- GAME LOOP ---
function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min((t - STATE.t) / 1000, 0.05);
    STATE.t = t;

    if (STATE.screen !== 'playing') return;

    // Logic
    STATE.hero.update(dt);
    updateFeedback(dt);
    handleGameStateAudio();

    // Spawner
    if (Math.random() < 0.02 && STATE.enemies.length < 10 + STATE.level) STATE.enemies.push(new Enemy());
    if (Math.random() < 0.005) STATE.pickups.push(new Pickup());

    STATE.enemies.forEach(e => e.update(dt));
    STATE.pickups.forEach(p => p.update(dt));

    // Cleanup
    STATE.enemies = STATE.enemies.filter(e => !e.dead);
    STATE.pickups = STATE.pickups.filter(p => !p.dead);

    // Particles
    for(let i=STATE.particles.length-1; i>=0; i--) {
        let p = STATE.particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vz -= 800 * dt; p.z += p.vz * dt;
        if (p.z < 0) { p.z = 0; p.vz *= -0.5; p.vx *= 0.7; }
        p.life -= dt;
        if(p.life <= 0) STATE.particles.splice(i,1);
    }

    // Camera
    STATE.cam.shake = Math.max(0, STATE.cam.shake - dt * 30);
    const shakeX = (Math.random()-0.5) * STATE.cam.shake;
    const shakeY = (Math.random()-0.5) * STATE.cam.shake;
    STATE.cam.x += (STATE.hero.x - STATE.cam.x) * 0.1;
    STATE.cam.y += (STATE.hero.y - STATE.cam.y) * 0.1;

    updateSkillUI();
    render(dt, shakeX, shakeY);
    updateDamageNumbers();
}

function render(dt, sx, sy) {
    const cvs = document.getElementById('gameCanvas');
    const ctx = cvs.getContext('2d');
    const cw = cvs.width;
    const ch = cvs.height;

    // Clear
    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.translate(cw/2 - STATE.cam.x + sx, ch/2 - STATE.cam.y + sy);

    // Parallax layer 1: background grid
    ctx.strokeStyle = CONFIG.colors.grid;
    ctx.lineWidth = 1.5;
    const gSz = 100;
    const startX = Math.floor((STATE.cam.x - cw/2)/gSz)*gSz;
    const startY = Math.floor((STATE.cam.y - ch/2)/gSz)*gSz;

    ctx.beginPath();
    for(let x = startX; x < startX + cw + gSz; x+=gSz) {
        ctx.moveTo(x, startY); ctx.lineTo(x, startY + ch + gSz);
    }
    for(let y = startY; y < startY + ch + gSz; y+=gSz) {
        ctx.moveTo(startX, y); ctx.lineTo(startX + cw + gSz, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(34, 211, 238, 0.08)';
    ctx.beginPath();
    for(let x = startX; x < startX + cw + gSz; x += gSz * 2) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x + gSz, startY + ch + gSz);
    }
    ctx.stroke();

    // Parallax layer 2: floating data shards
    for(let i=0; i<20; i++) {
        const px = (i * 300) % 2000 - 1000;
        const py = (i * 437) % 2000 - 1000;
        const paraX = px + STATE.cam.x * 0.2;
        const paraY = py + STATE.cam.y * 0.2;
        ctx.fillStyle = i % 3 === 0 ? 'rgba(251, 113, 133, 0.09)' : 'rgba(56, 189, 248, 0.11)';
        ctx.fillRect(paraX, paraY, 40, 40);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.strokeRect(paraX + 4, paraY + 4, 32, 32);
    }

    // Entities (Y-Sort)
    const all = [STATE.hero, ...STATE.enemies, ...STATE.pickups].sort((a,b) => a.y - b.y);
    all.forEach(e => e.draw(ctx));

    // Particles
    STATE.particles.forEach(p => {
        ctx.fillStyle = p.color;
        const s = p.size * p.life;
        ctx.fillRect(p.x - s/2, p.y - p.z - s, s, s);
    });

    ctx.restore();
}

function updateDamageNumbers() {
    const cvs = document.getElementById('gameCanvas');
    const els = document.getElementsByClassName('dmg-num');
    const cx = cvs.width/2 - STATE.cam.x;
    const cy = cvs.height/2 - STATE.cam.y;

    for(let el of els) {
        if (el._worldPos) {
            el.style.left = (el._worldPos.x + cx) + 'px';
            el.style.top = (el._worldPos.y + cy) + 'px';
        }
    }
}

// --- CORE HELPERS ---
function adjustColor(hex, amt) {
    let usePound = false;
    if (hex[0] == "#") { hex = hex.slice(1); usePound = true; }
    let num = parseInt(hex, 16);
    let r = (num >> 16) + amt;
    let b = ((num >> 8) & 0x00FF) + amt;
    let g = (num & 0x0000FF) + amt;
    r = Math.max(0, Math.min(255, r));
    b = Math.max(0, Math.min(255, b));
    g = Math.max(0, Math.min(255, g));
    return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
}

function levelUp() {
    STATE.level++;
    STATE.xp -= STATE.xpNext;
    STATE.xpNext = Math.floor(STATE.xpNext * 1.3);
    STATE.hero.maxHp += 20;
    STATE.hero.hp = STATE.hero.maxHp;
    spawnText(STATE.hero.x, STATE.hero.y - 80, "UPGRADED", "#facc15");
    updateHUD();
    AUDIO.play('sfx_collect', false, 1.12, 0.68);
    triggerFeedback('patch', 1100);
}

function updateHUD() {
    document.getElementById('score-val').innerText = STATE.score.toString().padStart(6, '0');
    document.getElementById('hp-text').innerText = Math.ceil(STATE.hero.hp) + '/' + STATE.hero.maxHp;
    document.getElementById('hp-bar').style.width = (STATE.hero.hp / STATE.hero.maxHp * 100) + '%';
    document.getElementById('xp-bar').style.width = (STATE.xp / STATE.xpNext * 100) + '%';
}

function updateSkillUI() {
    ['z','x','c'].forEach(k => {
        const btn = document.getElementById('skill-'+k);
        if (STATE.hero.cooldowns[k] > 0) {
            btn.classList.add('cooldown');
            btn.classList.remove('active');
        } else {
            btn.classList.remove('cooldown');
            btn.classList.add('active');
        }
    });
}

function triggerFeedback(kind, duration = 800) {
    STATE.feedbackTimers[kind] = Math.max(STATE.feedbackTimers[kind] || 0, duration);
    const el = document.getElementById('gif-' + kind);
    if (el) {
        el.classList.remove('hidden');
        el.classList.add('active');
    }
}

function updateFeedback(dt) {
    Object.entries(STATE.feedbackTimers).forEach(([kind, time]) => {
        if (time <= 0) return;
        STATE.feedbackTimers[kind] = Math.max(0, time - dt * 1000);
        const el = document.getElementById('gif-' + kind);
        if (el && STATE.feedbackTimers[kind] <= 0) {
            el.classList.remove('active');
            el.classList.add('hidden');
        }
    });
}

function handleGameStateAudio() {
    if (!STATE.hero || STATE.screen !== 'playing') return;

    if (STATE.hero.hp <= STATE.hero.maxHp * 0.3 && STATE.t - STATE.lowHealthWarnAt > 3000) {
        STATE.lowHealthWarnAt = STATE.t;
        AUDIO.play('sfx_warning', false, 1, 0.5);
    }

    if (STATE.hero.hp <= 0 && !STATE.gameOverHandled) {
        STATE.gameOverHandled = true;
        STATE.screen = 'gameover';
        AUDIO.play('sfx_gameover', false, 1, 0.85);
        AUDIO.stopBGM();
        triggerFeedback('hit', 1400);
        document.getElementById('start-screen').classList.remove('hidden');
        document.querySelector('#start-screen .intro-line').textContent = '>> SYSTEM FAILURE — CORE BREACHED';
        document.querySelector('#start-screen .intro-copy').innerHTML = '<p>Firewall collapsed under swarm pressure.</p><p>Tap start to reboot the defense grid.</p><p>Drag to move. Tap Z, X, and C to purge nearby threats.</p>';
        document.getElementById('start-btn').textContent = 'RESTART DEFENSE';
    }
}

// --- INIT ---
function init() {
    const cvs = document.getElementById('gameCanvas');
    const resize = () => {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
    };
    window.addEventListener('resize', resize);
    resize();

    // Controls
    const start = (e) => {
        if (STATE.screen !== 'playing' || e.target !== cvs) return;
        e.preventDefault();
        const t = e.touches ? e.touches[0] : e;
        STATE.pointer.isDown = true;
        STATE.pointer.startX = t.clientX;
        STATE.pointer.startY = t.clientY;
        STATE.pointer.x = t.clientX;
        STATE.pointer.y = t.clientY;
    };
    const move = (e) => {
        if (!STATE.pointer.isDown) return;
        e.preventDefault();
        const t = e.touches ? e.touches[0] : e;
        STATE.pointer.x = t.clientX;
        STATE.pointer.y = t.clientY;
    };
    const end = (e) => {
        if (!STATE.pointer.isDown) return;
        e.preventDefault();
        STATE.pointer.isDown = false;
    };

    cvs.addEventListener('pointerdown', start, {passive:false});
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);

    // Skill bindings
    ['z','x','c'].forEach(k => {
        document.getElementById('skill-'+k).addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if(STATE.hero) STATE.hero.skill(k);
        });
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        AUDIO.init();
        AUDIO.play('sfx_start', false, 1, 0.8);
        AUDIO.startBGM();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('controls').classList.remove('hidden');
        document.getElementById('joystick-hint').classList.remove('hidden');

        STATE.hero = new Hero();
        STATE.enemies = [];
        STATE.pickups = [];
        STATE.particles = [];
        STATE.score = 0;
        STATE.level = 1;
        STATE.xp = 0;
        STATE.xpNext = 100;
        STATE.lowHealthWarnAt = -9999;
        STATE.gameOverHandled = false;
        STATE.feedbackTimers.hit = 0;
        STATE.feedbackTimers.patch = 0;
        STATE.screen = 'playing';
        document.querySelector('#start-screen .intro-line').textContent = '>> ALERT: MALWARE SWARM DETECTED';
        document.querySelector('#start-screen .intro-copy').innerHTML = '<p>Clear the swarm closing in on your core.</p><p>Collect recovery patches to restore firewall strength.</p><p>Drag to move. Tap Z, X, and C to purge nearby threats.</p>';
        document.getElementById('start-btn').textContent = 'START DEFENSE';
        updateHUD();
    });

    requestAnimationFrame(loop);
}

document.addEventListener('DOMContentLoaded', () => {
    try {
        const c = JSON.parse(document.getElementById('game-config').textContent);
        if(c.heroSpeed) CONFIG.heroSpeed = c.heroSpeed.value;
        if(c.themeColor) CONFIG.colors.hero = c.themeColor.value;
    } catch(e){}
    init();
});
</script>
