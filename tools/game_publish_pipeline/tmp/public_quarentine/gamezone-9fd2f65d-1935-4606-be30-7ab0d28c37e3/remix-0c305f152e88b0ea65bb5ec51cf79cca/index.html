<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Cleanup Rush</title>
    <!-- [agent-note][stage4] repaired: font-remap | action: switched to approved catalogs/fonts.json families to avoid stale mirrored font refs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg: #070b1b;
            --bg-deep: #040611;
            --panel: rgba(12, 20, 48, 0.82);
            --panel-strong: rgba(20, 33, 76, 0.92);
            --line: rgba(126, 248, 255, 0.42);
            --glow: rgba(89, 236, 255, 0.4);
            --cyan: #73f3ff;
            --mint: #8effc8;
            --gold: #ffe27a;
            --danger: #ff647c;
            --ink: #f4fbff;
            --muted: #bad4ff;
            --sludge: #223343;
            --sludge-2: #345161;
            --brush-core: rgba(255, 255, 255, 0.86);
            --brush-aura: rgba(115, 243, 255, 0.25);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(78, 145, 255, 0.18), transparent 30%),
                radial-gradient(circle at bottom, rgba(120, 255, 220, 0.14), transparent 35%),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            color: var(--ink);
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(20, 31, 71, 0.92), rgba(8, 15, 37, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 14px 30px rgba(0, 0, 0, 0.32),
                0 0 24px rgba(89, 236, 255, 0.12);
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .w-24 { width: 6rem; }
        .h-4 { height: 1rem; }
        .max-w-xs { max-width: 20rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .overflow-hidden { overflow: hidden; }
        .text-center { text-align: center; }
        .text-white { color: var(--ink); }
        .text-blue-200 { color: var(--muted); }
        .text-blue-600 { color: #14255b; }
        .text-green-400 { color: var(--mint); }
        .text-red-400 { color: #ff8ea0; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: 3rem; }
        .font-bold { font-weight: 700; }
        .shadow-lg { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28); }
        .shadow-2xl { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
        .drop-shadow-md { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35)); }
        .border-white\/20 { border-color: rgba(126, 248, 255, 0.25); }
        .border { border-width: 1px; border-style: solid; }
        .border-4 { border-width: 4px; border-style: solid; }
        .bg-gray-900 { background: transparent; }
        .bg-gray-700 { background: rgba(255, 255, 255, 0.12); }
        .bg-blue-400 {
            background:
                linear-gradient(90deg, #73f3ff 0%, #7da6ff 55%, #8effc8 100%);
        }
        .bg-red-500 { background: var(--danger); }
        .bg-white {
            background:
                linear-gradient(180deg, #fdfefe 0%, #c7f8ff 100%);
        }
        .bg-black\/60 { background: rgba(2, 6, 16, 0.68); }
        .opacity-20 { opacity: 0.2; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .transition-all { transition: all 0.2s ease; }
        .duration-200 { transition-duration: 0.2s; }
        .active\:scale-95:active { transform: scale(0.95); }
        .backdrop-blur-sm { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        #ui-layer { pointer-events: none; }
        #ui-layer > * { pointer-events: auto; }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(115, 243, 255, 0.2), transparent 22%),
                radial-gradient(circle at 82% 18%, rgba(255, 226, 122, 0.12), transparent 20%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.04));
            mix-blend-mode: screen;
        }

        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 24px, 24px 100%;
            opacity: 0.45;
        }

        .hud-card {
            position: relative;
            overflow: hidden;
            min-height: 2.85rem;
            letter-spacing: 0.04em;
        }

        .hud-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.15) 45%, transparent 60%);
            transform: translateX(-100%);
            animation: hudSweep 3.6s linear infinite;
            opacity: 0.75;
        }

        .hud-label,
        #timer-display,
        #result-title,
        #restart-btn {
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
        }

        .hud-value,
        #percent-display {
            font-family: 'Press Start 2P', 'Rajdhani', monospace;
            font-size: 0.74rem;
            line-height: 1.45;
        }

        .hud-label {
            color: var(--cyan);
            text-shadow: 0 0 14px rgba(115, 243, 255, 0.45);
        }

        .mess-meter {
            position: relative;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.28));
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 10px rgba(115, 243, 255, 0.1);
        }

        .mess-meter::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        #clean-bar {
            border-radius: inherit;
            box-shadow:
                0 0 12px rgba(115, 243, 255, 0.3),
                0 0 18px rgba(142, 255, 200, 0.24);
        }

        #timer-shell {
            background:
                radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.22), transparent 30%),
                linear-gradient(180deg, rgba(17, 25, 58, 0.95), rgba(7, 11, 27, 0.95));
            box-shadow:
                0 0 0 1px rgba(126, 248, 255, 0.24) inset,
                0 0 24px rgba(115, 243, 255, 0.16),
                0 14px 24px rgba(0, 0, 0, 0.32);
        }

        #timer-shell::after {
            content: "BOT";
            position: absolute;
            bottom: 0.25rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', 'Rajdhani', monospace;
            font-size: 0.38rem;
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.5);
        }

        #timer-display {
            text-shadow: 0 0 18px rgba(115, 243, 255, 0.45);
        }

        #scrub-bot {
            position: absolute;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%);
            width: min(34vw, 9.5rem);
            aspect-ratio: 1 / 1;
            pointer-events: none;
            filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.32));
        }

        #scrub-bot .bot-shell {
            position: absolute;
            inset: 12% 14%;
            border-radius: 42% 42% 38% 38%;
            background:
                radial-gradient(circle at 50% 35%, #ffffff 0%, #c8faff 18%, #70ddff 45%, #2d5f99 100%);
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow:
                0 0 22px rgba(115, 243, 255, 0.28),
                inset 0 -10px 18px rgba(15, 31, 69, 0.42);
            animation: botFloat 2.8s ease-in-out infinite;
        }

        #scrub-bot .bot-eye {
            position: absolute;
            top: 34%;
            width: 18%;
            height: 13%;
            border-radius: 999px;
            background: #06233d;
            box-shadow:
                0 0 12px rgba(115, 243, 255, 0.42),
                inset 0 0 8px rgba(255, 255, 255, 0.18);
        }

        #scrub-bot .bot-eye.left { left: 26%; }
        #scrub-bot .bot-eye.right { right: 26%; }

        #scrub-bot .bot-eye::after {
            content: "";
            position: absolute;
            inset: 24%;
            border-radius: inherit;
            background: linear-gradient(180deg, #7bfcff 0%, #ffffff 100%);
            transform-origin: center;
            animation: botBlink 5s infinite;
        }

        #scrub-bot .bot-mouth {
            position: absolute;
            left: 50%;
            top: 57%;
            width: 28%;
            height: 10%;
            transform: translateX(-50%);
            border-radius: 0 0 999px 999px;
            border: 3px solid rgba(4, 23, 43, 0.95);
            border-top: 0;
            opacity: 0.85;
        }

        #scrub-bot .bot-cap {
            position: absolute;
            inset: 0;
        }

        #scrub-bot .bot-cap::before,
        #scrub-bot .bot-cap::after {
            content: "";
            position: absolute;
            top: 2%;
            width: 18%;
            height: 18%;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffe27a 0%, #ff8b60 100%);
            box-shadow: 0 0 14px rgba(255, 226, 122, 0.38);
        }

        #scrub-bot .bot-cap::before { left: 18%; }
        #scrub-bot .bot-cap::after { right: 18%; }

        #scrub-bot .bot-squeegee {
            position: absolute;
            bottom: 5%;
            left: 50%;
            width: 56%;
            height: 10%;
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, #183d62 0%, #0a1a33 100%);
            border: 2px solid rgba(255, 255, 255, 0.18);
        }

        #scrub-bot .bot-squeegee::after {
            content: "";
            position: absolute;
            inset: auto 8% -18% 8%;
            height: 40%;
            border-radius: 999px;
            background: linear-gradient(90deg, #73f3ff 0%, #f5ffff 50%, #8effc8 100%);
            box-shadow: 0 0 12px rgba(115, 243, 255, 0.4);
        }

        #game-over-screen {
            padding: 1rem;
            box-sizing: border-box;
        }

        #game-over-panel {
            max-height: min(90vh, 30rem);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.65rem;
            position: relative;
            overflow: hidden;
            overflow-y: auto;
        }

        #game-over-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at top, rgba(115, 243, 255, 0.24), transparent 32%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 36%);
        }


        #result-gif-wrap {
            position: relative;
            z-index: 1;
            width: min(100%, 12rem);
            margin: 0 auto 0.6rem;
            border-radius: 0.9rem;
            overflow: hidden;
            border: 1px solid rgba(126, 248, 255, 0.25);
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.28),
                0 0 18px rgba(115, 243, 255, 0.12);
            background: rgba(7, 11, 27, 0.72);
        }

        #result-gif {
            display: block;
            width: 100%;
            aspect-ratio: 1.25 / 1;
            object-fit: cover;
        }

        #result-gif-wrap.hidden {
            display: none !important;
        }

        #result-title {
            letter-spacing: 0.06em;
            font-size: clamp(1.7rem, 6vw, 2.45rem);
            margin-top: 0.4rem;
        }

        #result-desc {
            font-size: clamp(0.95rem, 3.8vw, 1.1rem);
        }

        #result-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
            margin: 0 auto 0.5rem;
            border-radius: 999px;
            background:
                radial-gradient(circle at 35% 28%, #ffffff 0%, #ffe27a 25%, #73f3ff 68%, #173460 100%);
            box-shadow:
                0 0 28px rgba(115, 243, 255, 0.32),
                0 0 42px rgba(255, 226, 122, 0.18);
            font-size: 2.2rem;
        }

        #result-badge::after {
            content: "";
            position: absolute;
            inset: -0.45rem;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.18);
            opacity: 0.7;
        }

        #restart-btn {
            position: sticky;
            bottom: 0;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #102249;
            box-shadow:
                0 14px 28px rgba(10, 24, 52, 0.3),
                0 0 20px rgba(115, 243, 255, 0.18);
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        #restart-btn:active {
            transform: scale(0.97);
            filter: brightness(1.06);
        }

        /* Animation for level complete */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes hudSweep {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(140%); }
        }

        @keyframes botFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes botBlink {
            0%, 45%, 48%, 100% { transform: scaleY(1); }
            46%, 47% { transform: scaleY(0.15); }
        }

        .pop-in { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @media (max-width: 640px) {
            .p-4 { padding: 0.75rem; }
            .px-4 { padding-left: 0.8rem; padding-right: 0.8rem; }
            .py-2 { padding-top: 0.45rem; padding-bottom: 0.45rem; }
            .text-xl { font-size: 1rem; }
            .text-lg { font-size: 0.95rem; }
            .w-16 { width: 3.5rem; }
            .h-16 { height: 3.5rem; }
            .w-24 { width: 5.4rem; }
            .h-4 { height: 0.9rem; }

            #ui-layer {
                padding-top: max(0.75rem, env(safe-area-inset-top));
                padding-right: max(0.75rem, env(safe-area-inset-right));
                padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
                padding-left: max(0.75rem, env(safe-area-inset-left));
            }

            #game-over-panel {
                max-height: min(82vh, 28rem);
                padding: 1.35rem;
            }

            #scrub-bot {
                width: min(38vw, 8.2rem);
                bottom: calc(0.5rem + env(safe-area-inset-bottom));
            }

            #result-gif-wrap {
            position: relative;
            z-index: 1;
            width: min(100%, 12rem);
            margin: 0 auto 0.6rem;
            border-radius: 0.9rem;
            overflow: hidden;
            border: 1px solid rgba(126, 248, 255, 0.25);
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.28),
                0 0 18px rgba(115, 243, 255, 0.12);
            background: rgba(7, 11, 27, 0.72);
        }

        #result-gif {
            display: block;
            width: 100%;
            aspect-ratio: 1.25 / 1;
            object-fit: cover;
        }

        #result-gif-wrap.hidden {
            display: none !important;
        }

        #result-title {
                font-size: clamp(1.45rem, 8vw, 2rem);
            }

            #restart-btn {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: scrub/ui/result loop and sfx mapped to catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_win" data-editable="audio" data-label="Win SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Fail SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_clean" data-editable="audio" data-label="Clean SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_alert" data-editable="audio" data-label="Alert SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "brushSize": { "type": "number", "label": "Brush Size", "value": 45, "min": 20, "max": 80 },
    "baseTime": { "type": "number", "label": "Level Time (s)", "value": 15, "min": 5, "max": 60 },
    "themeColor": { "type": "color", "label": "UI Color", "value": "#00bcd4" }
}
</script>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none bg-gray-900">
    <canvas id="gameCanvas"></canvas>
    <div id="scrub-bot" aria-hidden="true">
        <div class="bot-shell"></div>
        <div class="bot-eye left"></div>
        <div class="bot-eye right"></div>
        <div class="bot-mouth"></div>
        <div class="bot-cap"></div>
        <div class="bot-squeegee"></div>
    </div>

    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
        <!-- [agent-note][stage3] resolved-gif: success/fail overlays mapped to catalogs/gifs.json and kept off the playfield -->
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full">
            <div class="flex flex-col gap-2">
                <div class="glass hud-card px-4 py-2 rounded-full text-white font-bold text-xl shadow-lg">
                    <span class="hud-label">POINTS</span>:
                    <span id="score-display" class="hud-value">0</span>
                </div>
                <div class="glass hud-card px-4 py-2 rounded-full text-white font-bold text-lg shadow-lg flex items-center gap-2">
                    <span class="hud-label">MESS</span>
                    <div class="w-24 h-4 mess-meter rounded-full overflow-hidden border border-white/20">
                        <div id="clean-bar" class="h-full bg-blue-400 transition-all duration-200" style="width: 0%"></div>
                    </div>
                    <span id="percent-display" class="hud-value">0%</span>
                </div>
            </div>
            <div id="timer-shell" class="glass w-16 h-16 rounded-full flex items-center justify-center text-white font-bold text-2xl shadow-lg border-4 border-white/20 relative overflow-hidden">
                <div id="timer-bg" class="absolute inset-0 bg-red-500 opacity-20 hidden"></div>
                <span id="timer-display">15</span>
            </div>
        </div>

        <!-- Game Over / Level Complete Overlay -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-50">
            <div id="game-over-panel" class="glass p-8 rounded-2xl text-center shadow-2xl pop-in max-w-xs w-full">
                <div id="result-gif-wrap" class="hidden">
                    <img id="result-gif" alt="" />
                </div>
                <h2 id="result-title" class="text-4xl font-bold text-white mb-2 drop-shadow-md">ZONE CLEARED!</h2>
                <p id="result-desc" class="text-blue-200 text-lg mb-6">Cleanup zone 1 secured</p>
                <div id="result-badge" class="mb-6">🫧</div>
                <button id="restart-btn" class="w-full bg-white text-blue-600 font-bold py-3 px-6 rounded-xl shadow-lg active:scale-95 transition-transform text-xl">
                    DEPLOY NEXT
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * §2 System Invariants
 */
const CONFIG = {
    gridRes: 32, // Resolution of the cleaning grid (32x32)
    particles: {
        max: 100,
        spawnRate: 2
    }
};

const ENABLE_ANIMATIONS = true;

let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER, LEVEL_END
let canvas, ctx;
let cw, ch;
let dirtCanvas, dirtCtx; // Offscreen canvas for dirt mask
let lastTime = 0;
let gameTime = 0;
let level = 1;
let score = 0;
let timeLeft = 0;
let cleanPercent = 0;
let grid = []; // 2D array for dirt tracking
let particles = [];
let input = { x: null, y: null, down: false, lastX: null, lastY: null };
let audioCtx = null;
let scrubOsc = null;
let scrubGain = null;
let isScrubbing = false;
let audioUnlocked = false;
let lowTimeTriggered = false;
let scrubTickAt = 0;
let lastCleanPercentAudio = 0;
let activeResultMode = null;

const GIFS = {
    win: 'https://i.giphy.com/YUacjDxhp6cYteVMVf.webp',
    fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
};

// Config proxy
window.gameConfigDefs = {};
window.gameConfig = {};

// Audio State
let bgmPlaying = false;

function primeAudioElement(id, volume) {
    const el = document.getElementById(id);
    if (!el) return null;
    if (typeof volume === 'number') el.volume = volume;
    el.preload = 'auto';
    try { el.load(); } catch (e) {}
    return el;
}

function safePause(el) {
    if (!el) return;
    try {
        el.pause();
        el.currentTime = 0;
    } catch (e) {}
}

function setResultGif(mode) {
    const wrap = document.getElementById('result-gif-wrap');
    const img = document.getElementById('result-gif');
    if (!wrap || !img) return;
    if (!mode || !GIFS[mode]) {
        wrap.classList.add('hidden');
        img.removeAttribute('src');
        img.alt = '';
        return;
    }
    img.src = GIFS[mode];
    img.alt = mode === 'win' ? 'celebration reaction animation' : 'fail reaction animation';
    wrap.classList.remove('hidden');
}

function playResultLoop(mode) {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    const nextSrc = mode === 'win'
        ? 'https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3'
        : 'https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3';

    if (activeResultMode === mode && bgmPlaying) return;

    activeResultMode = mode;
    bgmPlaying = false;
    bgm.pause();
    if (bgm.getAttribute('src') !== nextSrc) {
        bgm.setAttribute('src', nextSrc);
        try { bgm.load(); } catch (e) {}
    }
    bgm.volume = mode === 'win' ? 0.2 : 0.2;
    bgm.play().then(() => { bgmPlaying = true; }).catch(() => {});
}

function restoreGameplayLoop() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    const gameplaySrc = 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3';
    activeResultMode = null;
    bgm.pause();
    if (bgm.getAttribute('src') !== gameplaySrc) {
        bgm.setAttribute('src', gameplaySrc);
        try { bgm.load(); } catch (e) {}
    }
    bgm.volume = 0.2;
    if (audioUnlocked) {
        bgm.play().then(() => { bgmPlaying = true; }).catch(() => {});
    } else {
        bgmPlaying = false;
    }
}

/**
 * §3 Implementation
 */

// 3.7 Config System
function parseConfig() {
    try {
        const raw = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfigDefs = raw;
        for (let k in raw) {
            window.gameConfig[k] = raw[k].value;
        }
    } catch (e) {
        console.error("Config parse error", e);
        // Fallback defaults
        window.gameConfig = { brushSize: 45, baseTime: 15, themeColor: '#00bcd4' };
    }
}

// 3.5 Audio System
function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;

    audioCtx = new AudioContext();

    // Create scrub synth
    scrubOsc = audioCtx.createBufferSource();
    const bufferSize = audioCtx.sampleRate * 2; // 2 seconds of noise
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    scrubOsc.buffer = buffer;
    scrubOsc.loop = true;

    // Filter for "swish" sound
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;

    scrubGain = audioCtx.createGain();
    scrubGain.gain.value = 0;

    scrubOsc.connect(filter);
    filter.connect(scrubGain);
    scrubGain.connect(audioCtx.destination);

    scrubOsc.start();
}

function unlockAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    audioUnlocked = true;
    const bgm = document.getElementById('bgm_main');
    if (bgm && !bgmPlaying) {
        bgm.volume = 0.2;
        bgm.play().then(() => { bgmPlaying = true; }).catch(() => {});
    }
}

function setScrubSound(active) {
    if (!scrubGain) return;
    // Smooth transition
    const now = audioCtx.currentTime;
    if (active) {
        scrubGain.gain.setTargetAtTime(0.15, now, 0.05);
    } else {
        scrubGain.gain.setTargetAtTime(0, now, 0.05);
    }
}

function playSfx(id) {
    const el = document.getElementById(id);
    if (el) {
        try { el.currentTime = 0; } catch (e) {}
        el.play().catch(() => playSynthFallback(id));
    } else {
        playSynthFallback(id);
    }
}

function playSynthFallback(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'sfx_win' || type === 'sfx_clean') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(type === 'sfx_clean' ? 520 : 400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(type === 'sfx_clean' ? 880 : 800, audioCtx.currentTime + 0.1);
    } else if (type === 'sfx_ui') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(460, audioCtx.currentTime + 0.12);
    } else if (type === 'sfx_alert') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(420, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(240, audioCtx.currentTime + 0.18);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    }

    gain.gain.setValueAtTime(type === 'sfx_ui' ? 0.18 : 0.24, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.28);
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 15);
    }
}

// 3.3 Lifecycle
document.addEventListener('DOMContentLoaded', () => {
    parseConfig();

    primeAudioElement('bgm_main', 0.2);
    primeAudioElement('sfx_win', 0.6);
    primeAudioElement('sfx_fail', 0.6);
    primeAudioElement('sfx_clean', 0.22);
    primeAudioElement('sfx_alert', 0.3);
    primeAudioElement('sfx_ui', 0.35);
    setResultGif(null);

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false }); // Optimize

    // Setup offscreen dirt canvas
    dirtCanvas = document.createElement('canvas');
    dirtCtx = dirtCanvas.getContext('2d');

    window.addEventListener('resize', resize);
    resize();

    // Input
    const inputHandler = (e) => {
        unlockAudio();
        if (gameState === 'GAMEOVER' || gameState === 'LEVEL_END') {
            return;
        }

        handleInput(e);
    };

    // [agent-note][stage4] repaired: mobile-action-path | action: scope pointer suppression to canvas so overlay buttons keep native tap/click behavior
    canvas.addEventListener('pointerdown', inputHandler, { passive: false });
    canvas.addEventListener('pointermove', inputHandler, { passive: false });
    canvas.addEventListener('pointerup', inputHandler, { passive: false });
    canvas.addEventListener('pointercancel', inputHandler, { passive: false });
    canvas.addEventListener('pointerleave', () => {
        input.down = false;
        input.lastX = null;
        input.lastY = null;
        isScrubbing = false;
        setScrubSound(false);
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        unlockAudio();
        playSfx('sfx_ui');
        if (gameState === 'GAMEOVER') {
            score = 0;
            level = 1;
            restartGame();
        } else {
            // Level Complete -> Next Level
            level++;
            restartGame();
        }
    });

    initGame();
    setState('PLAYING');

    requestAnimationFrame(loop);
});

function resize() {
    const dpr = window.devicePixelRatio || 1;
    cw = document.documentElement.clientWidth;
    ch = document.documentElement.clientHeight;

    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Resize dirt canvas
    // We create a temp canvas to save current dirt state if possible, but for simplicity/robustness on resize we reset or redraw
    // To keep it simple: resize resets the dirt layer to "dirty" but keeps score.
    // Ideally we would scale it, but that's complex. Let's just re-init dirt layer size.
    dirtCanvas.width = cw * 0.5; // Lower res for performance
    dirtCanvas.height = ch * 0.5;

    // Re-fill dirt if playing
    if (gameState === 'PLAYING') {
        initDirtLayer();
    }
}

function initGame() {
    particles = [];
    input.down = false;
    lowTimeTriggered = false;
    scrubTickAt = 0;
    lastCleanPercentAudio = cleanPercent;
    input.lastX = null;
    input.lastY = null;

    // Difficulty scaling
    const timeBonus = Math.max(5, window.gameConfig.baseTime - (level * 0.5));
    timeLeft = timeBonus;

    cleanPercent = 0;
    initDirtLayer();
    initGrid();

    updateHUD();
}

function initDirtLayer() {
    const w = dirtCanvas.width;
    const h = dirtCanvas.height;

    dirtCtx.globalCompositeOperation = 'source-over';

    // Base dirt color
    dirtCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--sludge').trim() || '#223343';
    dirtCtx.fillRect(0, 0, w, h);

    // Add some noise/texture to dirt
    dirtCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--sludge-2').trim() || '#345161';
    for (let i = 0; i < 50; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 100 + 50;
        dirtCtx.beginPath();
        dirtCtx.arc(x, y, r, 0, Math.PI * 2);
        dirtCtx.fill();
    }

    for (let i = 0; i < 18; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        dirtCtx.fillStyle = i % 2 ? 'rgba(255, 226, 122, 0.08)' : 'rgba(115, 243, 255, 0.07)';
        dirtCtx.fillRect(x, y, Math.random() * 50 + 20, Math.random() * 18 + 8);
    }
}

function initGrid() {
    grid = [];
    const cols = CONFIG.gridRes;
    const rows = Math.ceil(cols * (ch / cw));

    for (let y = 0; y < rows; y++) {
        let row = [];
        for (let x = 0; x < cols; x++) {
            row.push(false); // false = dirty, true = clean
        }
        grid.push(row);
    }
}

function restartGame() {
    initGame();
    setState('PLAYING');
}

function setState(state) {
    gameState = state;
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const badge = document.getElementById('result-badge');

    if (state === 'PLAYING') {
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        setResultGif(null);
        restoreGameplayLoop();
    } else {
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');

        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        const btn = document.getElementById('restart-btn');

        if (state === 'LEVEL_END') {
            title.textContent = "ZONE CLEARED!";
            title.className = "text-4xl font-bold text-green-400 mb-2 drop-shadow-md";
            desc.textContent = `Cleanup zone ${level} secured`;
            btn.textContent = "DEPLOY NEXT";
            badge.textContent = "🫧";
            setResultGif('win');
            playSfx('sfx_win');
            playResultLoop('win');
            vibrate('heavy');
        } else {
            title.textContent = "SHIFT OVER!";
            title.className = "text-4xl font-bold text-red-400 mb-2 drop-shadow-md";
            desc.textContent = `You secured zone ${level}`;
            btn.textContent = "RUN IT BACK";
            badge.textContent = "⚠️";
            setResultGif('fail');
            playSfx('sfx_fail');
            playResultLoop('fail');
            vibrate('heavy');
        }
    }
}

function handleInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        input.down = true;
        input.x = x;
        input.y = y;
        input.lastX = x;
        input.lastY = y;
    } else if (e.type === 'pointermove') {
        input.x = x;
        input.y = y;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        input.down = false;
        input.lastX = null;
        input.lastY = null;
    }
}

function updateHUD() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('timer-display').textContent = Math.ceil(timeLeft);
    document.getElementById('clean-bar').style.width = `${cleanPercent}%`;
    document.getElementById('percent-display').textContent = `${Math.floor(cleanPercent)}%`;

    // Timer warning
    const timerBg = document.getElementById('timer-bg');
    if (timeLeft <= 5) {
        timerBg.classList.remove('hidden');
        if (!lowTimeTriggered && gameState === 'PLAYING') {
            playSfx('sfx_alert');
            lowTimeTriggered = true;
        }
    } else {
        timerBg.classList.add('hidden');
    }
}

// Logic
function update(dt) {
    if (gameState !== 'PLAYING') {
        setScrubSound(false);
        return;
    }

    // Timer
    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        setState('GAMEOVER');
        return;
    }

    // Cleaning Logic
    if (input.down && input.x !== null && input.y !== null) {
        isScrubbing = true;

        // Interpolate movement for smooth lines
        const lx = input.lastX === null ? input.x : input.lastX;
        const ly = input.lastY === null ? input.y : input.lastY;

        const dist = Math.hypot(input.x - lx, input.y - ly);
        const steps = Math.ceil(dist / 5); // Step every 5px
        void steps;

        const brushR = window.gameConfig.brushSize;

        // Draw on dirt canvas (erase)
        dirtCtx.globalCompositeOperation = 'destination-out';
        dirtCtx.lineWidth = brushR * 2;
        dirtCtx.lineCap = 'round';
        dirtCtx.lineJoin = 'round';

        // Scale coords for dirt canvas (0.5x)
        const s = 0.5;
        dirtCtx.beginPath();
        dirtCtx.moveTo(lx * s, ly * s);
        dirtCtx.lineTo(input.x * s, input.y * s);
        dirtCtx.stroke();

        // Update Grid (Logic)
        // Optimization: Only check grid cells near the line
        updateGrid(lx, ly, input.x, input.y, brushR);

        // Particles
        if (Math.random() < 0.3) {
            spawnParticles(input.x, input.y);
        }

        if (audioUnlocked && gameTime >= scrubTickAt && cleanPercent >= lastCleanPercentAudio + 6) {
            playSfx('sfx_clean');
            scrubTickAt = gameTime + 0.16;
            lastCleanPercentAudio = cleanPercent;
        }

        // Vibration (throttled)
        if (gameTime % 0.15 < dt) {
            vibrate('light');
        }

        input.lastX = input.x;
        input.lastY = input.y;
    } else {
        isScrubbing = false;
        input.lastX = null;
    }

    setScrubSound(isScrubbing);

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt * 2;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.size *= 0.95;
        if (p.life <= 0) particles.splice(i, 1);
    }

    updateHUD();

    // Check Win
    if (cleanPercent >= 95) {
        score += Math.ceil(timeLeft * 100);
        setState('LEVEL_END');
    }
}

function updateGrid(x1, y1, x2, y2, r) {
    const cols = CONFIG.gridRes;
    const rows = grid.length;
    const cellW = cw / cols;
    const cellH = ch / rows;

    // Bounding box of the stroke
    const minX = Math.min(x1, x2) - r;
    const maxX = Math.max(x1, x2) + r;
    const minY = Math.min(y1, y2) - r;
    const maxY = Math.max(y1, y2) + r;

    // Convert to grid indices
    const startCol = Math.max(0, Math.floor(minX / cellW));
    const endCol = Math.min(cols - 1, Math.floor(maxX / cellW));
    const startRow = Math.max(0, Math.floor(minY / cellH));
    const endRow = Math.min(rows - 1, Math.floor(maxY / cellH));

    let changed = false;

    for (let gy = startRow; gy <= endRow; gy++) {
        for (let gx = startCol; gx <= endCol; gx++) {
            if (grid[gy][gx]) continue; // Already clean

            // Center of cell
            const cx = (gx + 0.5) * cellW;
            const cy = (gy + 0.5) * cellH;

            // Distance to line segment
            const dist = distToSegment(cx, cy, x1, y1, x2, y2);

            if (dist < r) {
                grid[gy][gx] = true;
                changed = true;
            }
        }
    }

    if (changed) {
        recalcPercent();
    }
}

function distToSegment(px, py, x1, y1, x2, y2) {
    const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
    if (l2 === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

function recalcPercent() {
    let total = 0;
    let clean = 0;
    for (let row of grid) {
        for (let cell of row) {
            total++;
            if (cell) clean++;
        }
    }
    cleanPercent = (clean / total) * 100;
}

function spawnParticles(x, y) {
    const count = 3;
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 40,
            y: y + (Math.random() - 0.5) * 40,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            life: 1.0,
            size: Math.random() * 10 + 5,
            color: Math.random() > 0.5 ? '#ffffff' : '#8effc8'
        });
    }
}

// Drawing
function draw() {
    // 1. Draw Clean Pattern (Background)
    // Procedural pattern based on level
    const hue = (level * 36 + 195) % 360;
    const grad = ctx.createLinearGradient(0, 0, cw, ch);
    grad.addColorStop(0, `hsl(${hue}, 92%, 15%)`);
    grad.addColorStop(0.5, `hsl(${(hue + 32) % 360}, 88%, 20%)`);
    grad.addColorStop(1, `hsl(${(hue + 68) % 360}, 82%, 12%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    const sweep = (Math.sin(gameTime * 0.7) + 1) * 0.5;
    const beam = ctx.createLinearGradient(0, 0, cw, ch);
    beam.addColorStop(0, 'rgba(115,243,255,0.04)');
    beam.addColorStop(Math.max(0, sweep - 0.1), 'rgba(115,243,255,0.04)');
    beam.addColorStop(sweep, 'rgba(255,255,255,0.16)');
    beam.addColorStop(Math.min(1, sweep + 0.14), 'rgba(142,255,200,0.08)');
    beam.addColorStop(1, 'rgba(255,255,255,0.03)');
    ctx.fillStyle = beam;
    ctx.fillRect(0, 0, cw, ch);
    ctx.restore();

    // Pattern details
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.strokeStyle = 'rgba(115,243,255,0.16)';
    const patternType = level % 3;
    if (patternType === 0) {
        // Bubbles
        for (let i = 0; i < cw; i += 42) {
            for (let j = 0; j < ch; j += 42) {
                ctx.beginPath();
                ctx.arc(i, j, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(i, j, 14, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    } else if (patternType === 1) {
        // Squeegee stripes
        ctx.beginPath();
        for (let i = -ch; i < cw; i += 58) {
            ctx.moveTo(i, 0);
            ctx.lineTo(i + ch, ch);
        }
        ctx.lineWidth = 18;
        ctx.stroke();
    } else {
        // Gloss tiles
        const size = 58;
        for (let i = 0; i < cw; i += size) {
            for (let j = 0; j < ch; j += size) {
                if ((i / size + j / size) % 2 === 0) {
                    ctx.fillRect(i, j, size, size);
                }
            }
        }
    }
    ctx.restore();

    // 2. Draw Dirt Layer
    // Draw the offscreen canvas scaled up
    ctx.drawImage(dirtCanvas, 0, 0, cw, ch);

    // 3. Draw Particles (Foam)
    ctx.save();
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        // Shine
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // 4. Draw Squeegee/Brush Cursor
    if (input.down && input.x !== null) {
        const r = window.gameConfig.brushSize;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(input.x, input.y, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--brush-aura').trim() || 'rgba(115, 243, 255, 0.25)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(input.x, input.y, r * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--brush-core').trim() || 'rgba(255,255,255,0.86)';
        ctx.fill();
    }
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    gameTime += dt;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(loop);
}

</script>
