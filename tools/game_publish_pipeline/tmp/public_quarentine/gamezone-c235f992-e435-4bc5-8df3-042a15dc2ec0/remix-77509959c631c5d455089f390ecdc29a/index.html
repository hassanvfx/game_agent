<body>

<div id="app" class="app">

<script>
/*
 * BIOME DESK
 * Stage 01 narrative pass: reframed as a world sandbox while preserving simulation mechanics.
 */

const CFG = {
    w: 64, h: 96,
    fps: 30,
    colors: {
        deep: '#172554', water: '#3b82f6', sand: '#fde047', mud: '#78350f',
        grass: '#4ade80', forest: '#16a34a', cactus: '#15803d', mountain: '#57534e',
        snow: '#f8fafc', ice: '#cffafe', lava: '#ef4444',
        stone: '#78716c', ash: '#292524', road: '#525252', wall: '#e5e5e5', gold: '#fbbf24',
        civ1: '#f87171', civ2: '#60a5fa', civ3: '#c084fc', civ4: '#fbbf24',
        monster: '#be185d', wolf: '#475569', cow: '#d97706', chicken: '#fca5a5', sheep: '#fff',
        zombie: '#65a30d', dragon: '#a855f7',
        tornado: '#94a3b8', projectile: '#fff'
    }
};

const TILES = {
    DEEP:0, WATER:1, SAND:2, MUD:3, GRASS:4, FOREST:5,
    MOUNTAIN:6, SNOW:7, ICE:8, LAVA:9, STONE:10, ASH:11,
    ROAD:12, WALL:13, GOLD:14, CACTUS:15
};

const State = {
    map: new Uint8Array(CFG.w * CFG.h),
    fire: new Uint8Array(CFG.w * CFG.h),
    units: [],
    buildings: [],
    particles: [],
    projectiles: [],
    villages: [],
    tick: 0,
    year: 1,
    speed: 1,
    paused: false,
    selectedTool: 'inspect',
    selectedCat: 'nature',
    selectedBiome: 'normal',
    eventTimer: 0,
    nextEvent: 300
};

const MEDIA = {
    burstGif: 'https://i.giphy.com/1zmG8avB83Uvm.webp',
    eventGif: 'https://i.giphy.com/DX3i6ABlOz0mYVcLj9.webp',
    audio: {
        uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        startGame: null,
        pause: 'https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3',
        resume: 'https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3',
        menuOpen: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3',
        build: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
        magic: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
        shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3',
        hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
        boom: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3',
        danger: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3',
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
    }
};

const AudioSys = {
    ctx: null,
    enabled: false,
    unlocked: false,
    pools: new Map(),
    lastPlayed: new Map(),
    music: null,
    init: () => {
        if (!AudioSys.ctx) AudioSys.ctx = new (window.AudioContext || window.webkitAudioContext)();
        AudioSys.enabled = true;
    },
    unlock: async () => {
        AudioSys.init();
        if (AudioSys.unlocked) return;
        try {
            if (AudioSys.ctx?.state === 'suspended') await AudioSys.ctx.resume();
            AudioSys.unlocked = true;
            AudioSys.ensureMusic();
        } catch (_) {}
    },
    ensureMusic: () => {
        if (AudioSys.music) return AudioSys.music;
        const music = new Audio(MEDIA.audio.bgm);
        music.loop = true;
        music.volume = 0.2;
        music.preload = 'auto';
        music.playsInline = true;
        AudioSys.music = music;
        return music;
    },
    playMusic: async () => {
        if (!AudioSys.enabled) return;
        const music = AudioSys.ensureMusic();
        try {
            await AudioSys.unlock();
            if (music.paused) await music.play();
        } catch (_) {}
    },
    pauseMusic: () => {
        if (AudioSys.music) AudioSys.music.pause();
    },
    playSample: async (key, { volume = 0.45, debounce = 90 } = {}) => {
        if (!AudioSys.enabled) return;
        const now = performance.now();
        const last = AudioSys.lastPlayed.get(key) || 0;
        if (now - last < debounce) return;
        AudioSys.lastPlayed.set(key, now);
        try {
            const pool = AudioSys.pools.get(key) || [];
            let audio = pool.find(item => item.paused || item.ended);
            if (!audio) {
                audio = new Audio(MEDIA.audio[key]);
                audio.preload = 'auto';
                audio.playsInline = true;
                pool.push(audio);
                AudioSys.pools.set(key, pool);
            }
            audio.volume = volume;
            audio.currentTime = 0;
            await audio.play();
        } catch (_) {}
    },
    playTone: (freq, type='sine', dur=0.1, vol=0.1) => {
        if (!AudioSys.ctx || !AudioSys.unlocked) return;
        const o = AudioSys.ctx.createOscillator();
        const g = AudioSys.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, AudioSys.ctx.currentTime);
        g.gain.setValueAtTime(vol, AudioSys.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, AudioSys.ctx.currentTime + dur);
        o.connect(g);
        g.connect(AudioSys.ctx.destination);
        o.start();
        o.stop(AudioSys.ctx.currentTime + dur);
    },
    playEvent: (type) => {
        if (type === 'war') {
            AudioSys.playSample('danger', { volume: 0.38, debounce: 350 });
            AudioSys.playTone(150, 'sawtooth', 0.45, 0.12);
            setTimeout(() => AudioSys.playTone(100, 'sawtooth', 0.3, 0.1), 140);
        } else if (type === 'fire') {
            AudioSys.playSample('magic', { volume: 0.4, debounce: 150 });
            AudioSys.playTone(800, 'triangle', 0.22, 0.06);
        } else if (type === 'monster') {
            AudioSys.playSample('danger', { volume: 0.42, debounce: 300 });
            AudioSys.playTone(60, 'square', 0.45, 0.12);
        } else if (type === 'build') {
            AudioSys.playSample('build', { volume: 0.36, debounce: 60 });
            AudioSys.playTone(600, 'square', 0.05, 0.05);
        } else if (type === 'magic') {
            AudioSys.playSample('magic', { volume: 0.42, debounce: 120 });
            AudioSys.playTone(1200, 'sine', 0.18, 0.05);
            setTimeout(() => AudioSys.playTone(800, 'sine', 0.18, 0.05), 100);
        } else if (type === 'shoot') {
            AudioSys.playSample('shoot', { volume: 0.32, debounce: 120 });
            AudioSys.playTone(400, 'square', 0.08, 0.05);
        } else if (type === 'boom') {
            AudioSys.playSample('boom', { volume: 0.48, debounce: 180 });
            AudioSys.playTone(50, 'sawtooth', 0.42, 0.12);
        } else if (type === 'hit') {
            AudioSys.playSample('hit', { volume: 0.34, debounce: 120 });
        } else if (type === 'uiClick') {
            AudioSys.playSample('uiClick', { volume: 0.24, debounce: 70 });
            } else if (type === 'start') {
                AudioSys.playTone(520, 'triangle', 0.08, 0.05);
                setTimeout(() => AudioSys.playTone(780, 'triangle', 0.14, 0.045), 90);
        } else if (type === 'pause') {
            AudioSys.playSample('pause', { volume: 0.3, debounce: 180 });
        } else if (type === 'resume') {
            AudioSys.playSample('resume', { volume: 0.3, debounce: 180 });
        } else if (type === 'menu') {
            AudioSys.playSample('menuOpen', { volume: 0.26, debounce: 180 });
        }
    }
};

let burstTimer = null;
let reelTimer = null;

function showBurstGif(src = MEDIA.burstGif) {
    const burst = document.getElementById('media-burst');
    if (!burst) return;
    burst.src = `${src}?t=${Date.now()}`;
    burst.classList.add('active');
    clearTimeout(burstTimer);
    burstTimer = setTimeout(() => burst.classList.remove('active'), 1000);
}

function showEventGif(src = MEDIA.eventGif) {
    const reel = document.getElementById('event-reel');
    const gif = document.getElementById('event-gif');
    if (!reel || !gif) return;
    gif.src = `${src}?t=${Date.now()}`;
    reel.classList.add('active');
    clearTimeout(reelTimer);
    reelTimer = setTimeout(() => reel.classList.remove('active'), 2200);
}

function generateWorld(biome = 'normal') {
    const { w, h } = CFG;
    const noise = (x, y, scale) => Math.sin(x*scale)*Math.cos(y*scale) + Math.sin((x+y)*scale*2)*0.5;

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const idx = y*w+x;
            const dx = x/w - 0.5, dy = y/h - 0.5;
            const dist = Math.sqrt(dx*dx + dy*dy) * 2.2;
            const seed = Math.random() * 100;

            let val = noise(x+seed, y+seed, 0.1) - dist;
            val += Math.random()*0.1;

            let t = TILES.DEEP;

            if (biome === 'hell') {
                if (val < -0.3) t = TILES.LAVA;
                else if (val < 0.2) t = TILES.ASH;
                else if (val < 0.4) t = TILES.STONE;
                else t = TILES.MOUNTAIN;
            } else if (biome === 'desert') {
                if (val < -0.4) t = TILES.WATER;
                else if (val < 0.6) t = TILES.SAND;
                else if (val < 0.7) t = TILES.CACTUS;
                else t = TILES.MOUNTAIN;
            } else if (biome === 'winter') {
                if (val < -0.2) t = TILES.ICE;
                else if (val < 0.5) t = TILES.SNOW;
                else if (val < 0.7) t = TILES.FOREST;
                else t = TILES.MOUNTAIN;
            } else {
                if (val < -0.25) t = TILES.DEEP;
                else if (val < 0.0) t = TILES.WATER;
                else if (val < 0.1) t = TILES.SAND;
                else if (val < 0.15 && Math.random() < 0.3) t = TILES.MUD;
                else if (val < 0.5) t = TILES.GRASS;
                else if (val < 0.7) t = TILES.FOREST;
                else if (val < 0.85) t = Math.random() < 0.05 ? TILES.GOLD : TILES.MOUNTAIN;
                else t = TILES.SNOW;
            }

            State.map[idx] = t;
            State.fire[idx] = 0;
        }
    }

    State.units = [];
    State.buildings = [];
    State.villages = [];
    State.particles = [];
    State.projectiles = [];

    const colors = [CFG.colors.civ1, CFG.colors.civ2, CFG.colors.civ3, CFG.colors.civ4];
    for (let i = 0; i < 4; i++) {
        let placed = false, attempts = 0;
        while (!placed && attempts < 100) {
            const x = Math.floor(Math.random()*(w-10)+5);
            const y = Math.floor(Math.random()*(h-10)+5);
            const t = State.map[y*w+x];

            const habitable = (t === TILES.GRASS || t === TILES.FOREST || t === TILES.SAND || t === TILES.SNOW || t === TILES.ASH);

            if (habitable && !State.villages.some(v => Math.hypot(v.x-x, v.y-y) < 15)) {
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        const ni = (y+dy)*w+(x+dx);
                        if (State.map[ni] === TILES.FOREST || State.map[ni] === TILES.CACTUS) State.map[ni] = TILES.GRASS;
                    }
                }

                State.buildings.push({x, y, civId: i, hp: 500, type: 'hall'});
                State.villages.push({id: i, x, y, color: colors[i], pop: 0, atWarWith: null});
                for (let u = 0; u < 5; u++) spawnUnit(x, y, i, 'human');
                placed = true;
            }
            attempts++;
        }
    }

    for (let i = 0; i < 10; i++) {
        const x = Math.floor(Math.random()*w), y = Math.floor(Math.random()*h);
        const t = State.map[y*w+x];
        if (t !== TILES.WATER && t !== TILES.LAVA && t !== TILES.DEEP) spawnUnit(x, y, -1, 'cow');
    }

    State.year = 1;
    State.tick = 0;
    State.eventTimer = 0;
}

function spawnUnit(x, y, civId, type='human') {
    let hp = 20;
    if (type === 'monster') hp = 400;
    if (type === 'dragon') hp = 1000;
    if (type === 'zombie') hp = 30;
    if (type === 'cow') hp = 30;
    if (type === 'wolf') hp = 40;
    if (type === 'chicken') hp = 5;
    if (type === 'tornado') hp = 200;

    State.units.push({
        x: x + (Math.random()-0.5)*2,
        y: y + (Math.random()-0.5)*2,
        tx: x, ty: y,
        civId, type, hp,
        age: 0,
        timer: Math.random()*10,
        plagued: false
    });
}

function update() {
    if (State.paused) return;

    const steps = State.speed === 3 ? 4 : State.speed;

    for (let s = 0; s < steps; s++) {
        State.tick++;
        if (State.tick % 30 === 0) State.year++;

        updateUnits();
        updateBuildings();
        updateProjectiles();
        updateWorld();

        State.eventTimer++;
        if (State.eventTimer > State.nextEvent) {
            triggerRandomEvent();
            State.eventTimer = 0;
            State.nextEvent = 400 + Math.random() * 400;
        }
    }

    updateParticles();

    document.getElementById('year-display').textContent = State.year;
    document.getElementById('pop-display').textContent = State.units.filter(u => u.type === 'human').length;
}

function updateBuildings() {
    if (State.tick % 30 !== 0) return;

    State.buildings.forEach(b => {
        if (b.type === 'tower') {
            const target = State.units.find(u => {
                if (u.civId === b.civId) return false;
                if (u.type === 'human' && State.villages[b.civId].atWarWith !== u.civId) return false;
                if (u.type === 'cow' || u.type === 'sheep' || u.type === 'chicken') return false;
                return Math.hypot(u.x-b.x, u.y-b.y) < 8;
            });

            if (target) {
                State.projectiles.push({
                    x: b.x, y: b.y, tx: target.x, ty: target.y,
                    speed: 0.5, damage: 10, color: '#fff'
                });
                AudioSys.playEvent('shoot');
            }
        } else if (b.type === 'farm') {
            if (Math.random() < 0.05) spawnUnit(b.x, b.y, b.civId, 'human');
        }
    });
}

function updateProjectiles() {
    for (let i = State.projectiles.length - 1; i >= 0; i--) {
        const p = State.projectiles[i];
        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 0.5) {
            State.units.forEach(u => {
                if (Math.hypot(u.x-p.tx, u.y-p.ty) < 1.5) {
                    u.hp -= p.damage;
                    spawnParticle(u.x, u.y, '#fff');
                    AudioSys.playEvent('hit');
                    showBurstGif();
                }
            });
            State.projectiles.splice(i, 1);
        } else {
            p.x += (dx/dist) * p.speed;
            p.y += (dy/dist) * p.speed;
            spawnParticle(p.x, p.y, p.color, 0.3);
        }
    }
}

function updateUnits() {
    const { w, h } = CFG;

    for (let i = State.units.length - 1; i >= 0; i--) {
        const u = State.units[i];

        if (u.type !== 'tornado') u.age++;

        if (u.plagued) {
            if (State.tick % 20 === 0) {
                u.hp -= 1;
                spawnParticle(u.x, u.y, '#10b981');
                State.units.forEach(other => {
                    if (other !== u && !other.plagued && Math.hypot(other.x-u.x, other.y-u.y) < 1.5) {
                        other.plagued = true;
                    }
                });
            }
        }

        if (u.type === 'tornado') {
            u.hp--;
            if (u.hp <= 0) { State.units.splice(i, 1); continue; }
            const ix = Math.round(u.x), iy = Math.round(u.y);
            if (ix >= 0 && ix < w && iy >= 0 && iy < h) {
                const idx = iy*w+ix;
                if (State.map[idx] !== TILES.WATER && State.map[idx] !== TILES.DEEP) State.map[idx] = TILES.SAND;
                const bIdx = State.buildings.findIndex(b => Math.abs(b.x-ix) < 1 && Math.abs(b.y-iy) < 1);
                if (bIdx !== -1) {
                    State.buildings.splice(bIdx, 1);
                    spawnParticle(ix, iy, '#fbbf24');
                }
            }
            State.units.forEach(other => {
                if (other !== u && Math.hypot(other.x-u.x, other.y-u.y) < 3) {
                    other.x += (Math.random()-0.5)*4;
                    other.y += (Math.random()-0.5)*4;
                    other.hp -= 5;
                }
            });
        } else if (u.hp <= 0 || (u.type !== 'monster' && u.type !== 'dragon' && u.age > 1500)) {
            if (u.type === 'human' && u.plagued) {
                if (Math.random() < 0.5) spawnUnit(u.x, u.y, -1, 'zombie');
            }
            State.units.splice(i, 1);
            continue;
        }

        u.timer--;
        if (u.timer <= 0) {
            u.timer = 5 + Math.random()*5;

            if (u.type === 'dragon') {
                u.tx = u.x + (Math.random()-0.5)*20;
                u.ty = u.y + (Math.random()-0.5)*20;
                if (Math.random() < 0.1) {
                    ignite(Math.floor(u.x), Math.floor(u.y), 2);
                    AudioSys.playEvent('fire');
                }
            } else if (u.type === 'tornado') {
                u.tx = u.x + (Math.random()-0.5)*6;
                u.ty = u.y + (Math.random()-0.5)*6;
            } else if (['wolf','monster','zombie'].includes(u.type)) {
                let closest = null, minDist = 20;
                State.units.forEach(other => {
                    if (other === u) return;
                    let isPrey = false;
                    if (u.type === 'wolf') isPrey = ['sheep','cow','chicken','human'].includes(other.type);
                    if (u.type === 'zombie') isPrey = other.type === 'human';
                    if (u.type === 'monster') isPrey = other.type !== 'monster';

                    if (isPrey) {
                        const d = Math.hypot(other.x-u.x, other.y-u.y);
                        if (d < minDist) { minDist = d; closest = other; }
                    }
                });

                if (closest) {
                    u.tx = closest.x;
                    u.ty = closest.y;
                    if (minDist < 1.5) {
                        closest.hp -= (u.type === 'monster' ? 10 : 5);
                        spawnParticle(closest.x, closest.y, '#f00');
                        if (u.type === 'zombie' && closest.hp <= 0 && closest.type === 'human') {
                            spawnUnit(closest.x, closest.y, -1, 'zombie');
                        }
                    }
                } else {
                    u.tx = u.x + (Math.random()-0.5)*10;
                    u.ty = u.y + (Math.random()-0.5)*10;
                }
            } else if (u.type === 'human') {
                const village = State.villages[u.civId];
                if (village && village.atWarWith !== null) {
                    const enemyV = State.villages[village.atWarWith];
                    if (enemyV) {
                        u.tx = enemyV.x + (Math.random()-0.5)*5;
                        u.ty = enemyV.y + (Math.random()-0.5)*5;
                        const enemy = State.units.find(e => e.civId === enemyV.id && Math.hypot(e.x-u.x, e.y-u.y) < 2);
                        if (enemy) {
                            enemy.hp -= 5;
                            spawnParticle(enemy.x, enemy.y, '#fff');
                            u.timer = 10;
                        }
                    }
                } else {
                    if (Math.random() < 0.05 && State.buildings.length < 200) {
                        const ix = Math.round(u.x), iy = Math.round(u.y);
                        const t = State.map[iy*w+ix];
                        if ((t===TILES.GRASS || t===TILES.SAND || t===TILES.SNOW) && !State.buildings.some(b => Math.abs(b.x-ix) < 1 && Math.abs(b.y-iy) < 1)) {
                            let bType = 'house';
                            if (Math.random() < 0.1) bType = 'tower';
                            if (Math.random() < 0.1) bType = 'farm';

                            State.buildings.push({x: ix, y: iy, civId: u.civId, hp: 50, type: bType});
                            if (bType === 'house') spawnUnit(ix, iy, u.civId);
                        }
                    }
                    if (Math.random() < 0.2 && village) {
                        u.tx = village.x + (Math.random()-0.5)*20;
                        u.ty = village.y + (Math.random()-0.5)*20;
                    }
                }
            } else {
                u.tx = u.x + (Math.random()-0.5)*8;
                u.ty = u.y + (Math.random()-0.5)*8;
            }
        }

        const dx = u.tx - u.x;
        const dy = u.ty - u.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist > 0.1) {
            let baseSpeed = 0.08;
            if (u.type === 'monster') baseSpeed = 0.06;
            if (u.type === 'dragon') baseSpeed = 0.15;
            if (u.type === 'zombie') baseSpeed = 0.05;
            if (u.type === 'cow') baseSpeed = 0.04;
            if (u.type === 'chicken') baseSpeed = 0.12;
            if (u.type === 'wolf') baseSpeed = 0.11;
            if (u.type === 'tornado') baseSpeed = 0.2;

            const cx = Math.floor(u.x), cy = Math.floor(u.y);
            if (u.type !== 'dragon' && u.type !== 'tornado' && cx >= 0 && cx < w && cy >= 0 && cy < h) {
                const tile = State.map[cy*w+cx];
                if (tile === TILES.ROAD) baseSpeed *= 1.5;
                if (tile === TILES.MUD) baseSpeed *= 0.5;
                if (tile === TILES.SNOW) baseSpeed *= 0.8;
                if (tile === TILES.WATER || tile === TILES.DEEP || tile === TILES.LAVA) baseSpeed *= 0.3;
            }

            const moveX = (dx/dist) * baseSpeed;
            const moveY = (dy/dist) * baseSpeed;

            const nextX = Math.floor(u.x + moveX * 2);
            const nextY = Math.floor(u.y + moveY * 2);
            let blocked = false;
            if (u.type !== 'dragon' && u.type !== 'tornado' && nextX >= 0 && nextX < w && nextY >= 0 && nextY < h) {
                if (State.map[nextY*w+nextX] === TILES.WALL) blocked = true;
            }

            if (!blocked) {
                u.x += moveX;
                u.y += moveY;
            } else {
                u.tx = u.x - dx;
                u.ty = u.y - dy;
            }
        }

        u.x = Math.max(0, Math.min(w-1, u.x));
        u.y = Math.max(0, Math.min(h-1, u.y));
    }
}

function updateWorld() {
    const { w, h } = CFG;
    for (let i = 0; i < 60; i++) {
        const idx = Math.floor(Math.random() * w * h);

        if (State.fire[idx] > 0) {
            State.fire[idx]--;
            if (State.fire[idx] === 0) {
                State.map[idx] = TILES.ASH;
            } else if (Math.random() < 0.2) {
                const n = idx + (Math.random()<0.5?1:-1) * (Math.random()<0.5?1:w);
                if (n >= 0 && n < w*h) {
                    const t = State.map[n];
                    if (t === TILES.FOREST || t === TILES.GRASS || t === TILES.CACTUS) State.fire[n] = 100;
                }
            }
            if (Math.random() < 0.1) spawnParticle((idx%w), Math.floor(idx/w), '#f97316');
        }

        if (State.map[idx] === TILES.ASH && Math.random() < 0.005) State.map[idx] = TILES.GRASS;
        if (State.map[idx] === TILES.GRASS && Math.random() < 0.002) State.map[idx] = TILES.FOREST;
        if (State.map[idx] === TILES.MUD && Math.random() < 0.005) State.map[idx] = TILES.GRASS;
    }
}

function updateParticles() {
    for (let i = State.particles.length - 1; i >= 0; i--) {
        const p = State.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) State.particles.splice(i, 1);
    }
}

function spawnParticle(x, y, color, life=1.0) {
    if (State.particles.length > 80) return;
    State.particles.push({
        x, y, color, life,
        vx: (Math.random()-0.5)*0.2,
        vy: (Math.random()-0.5)*0.2 - 0.1
    });
}

function triggerRandomEvent() {
    const r = Math.random();

    if (r < 0.25) {
        const v1 = State.villages[Math.floor(Math.random()*State.villages.length)];
        const v2 = State.villages.find(v => v !== v1);
        if (v1 && v2) {
            v1.atWarWith = v2.id;
            v2.atWarWith = v1.id;
            showToast(`⚔️ Clash: ${getCivName(v1.id)} vs ${getCivName(v2.id)}`, 'red');
            AudioSys.playEvent('war');
            showEventGif('https://i.giphy.com/1AjEBGWggGXh9onllB.webp');
        }
    } else if (r < 0.5) {
        const x = Math.floor(Math.random()*CFG.w);
        const y = Math.floor(Math.random()*CFG.h);
        spawnUnit(x, y, -1, 'dragon');
        showToast('🐉 Apex creature sighted', 'purple');
        AudioSys.playEvent('monster');
        showEventGif('https://i.giphy.com/DX3i6ABlOz0mYVcLj9.webp');
    } else if (r < 0.75) {
        const x = Math.floor(Math.random()*CFG.w);
        const y = Math.floor(Math.random()*CFG.h);
        spawnUnit(x, y, -1, 'tornado');
        showToast('🌪️ Storm front crossing map', 'slate');
        AudioSys.playEvent('monster');
    } else {
        const x = Math.floor(Math.random()*CFG.w);
        const y = Math.floor(Math.random()*CFG.h);
        for (let i = 0; i < 3; i++) spawnUnit(x, y, -1, 'wolf');
        showToast('🐺 Predator pack roaming', 'slate');
        AudioSys.playEvent('monster');
    }
}

function getCivName(id) { return ['Red Camp', 'Blue Camp', 'Violet Camp', 'Gold Camp'][id] || 'Camp'; }

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

function resize() {
    const r = document.getElementById('app').getBoundingClientRect();
    canvas.width = r.width;
    canvas.height = r.height;
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

function render() {
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const scale = Math.min(canvas.width / CFG.w, canvas.height / CFG.h);
    const ox = (canvas.width - CFG.w*scale)/2;
    const oy = (canvas.height - CFG.h*scale)/2;

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    const { w, h } = CFG;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const idx = y*w+x;
            const t = State.map[idx];
            const f = State.fire[idx];

            if (f > 0) {
                ctx.fillStyle = Math.random() < 0.5 ? '#fbbf24' : '#ef4444';
            } else {
                switch (t) {
                    case TILES.DEEP: ctx.fillStyle = CFG.colors.deep; break;
                    case TILES.WATER: ctx.fillStyle = CFG.colors.water; break;
                    case TILES.SAND: ctx.fillStyle = CFG.colors.sand; break;
                    case TILES.MUD: ctx.fillStyle = CFG.colors.mud; break;
                    case TILES.GRASS: ctx.fillStyle = CFG.colors.grass; break;
                    case TILES.FOREST: ctx.fillStyle = CFG.colors.forest; break;
                    case TILES.CACTUS: ctx.fillStyle = CFG.colors.cactus; break;
                    case TILES.MOUNTAIN: ctx.fillStyle = CFG.colors.mountain; break;
                    case TILES.SNOW: ctx.fillStyle = CFG.colors.snow; break;
                    case TILES.ICE: ctx.fillStyle = CFG.colors.ice; break;
                    case TILES.LAVA: ctx.fillStyle = CFG.colors.lava; break;
                    case TILES.STONE: ctx.fillStyle = CFG.colors.stone; break;
                    case TILES.ASH: ctx.fillStyle = CFG.colors.ash; break;
                    case TILES.ROAD: ctx.fillStyle = CFG.colors.road; break;
                    case TILES.WALL: ctx.fillStyle = CFG.colors.wall; break;
                    case TILES.GOLD: ctx.fillStyle = CFG.colors.gold; break;
                }
            }
            ctx.fillRect(x, y, 1, 1);
        }
    }

    State.buildings.forEach(b => {
        const v = State.villages[b.civId];
        if (b.type === 'hall') ctx.fillStyle = (v ? v.color : '#fff');
        else if (b.type === 'tower') ctx.fillStyle = '#525252';
        else if (b.type === 'farm') ctx.fillStyle = '#fcd34d';
        else ctx.fillStyle = '#713f12';

        ctx.fillRect(b.x, b.y, 1, 1);
        if (b.type === 'tower') {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(b.x+0.25, b.y+0.25, 0.5, 0.5);
        }
    });

    State.units.forEach(u => {
        if (u.type === 'monster') ctx.fillStyle = CFG.colors.monster;
        else if (u.type === 'dragon') ctx.fillStyle = CFG.colors.dragon;
        else if (u.type === 'zombie') ctx.fillStyle = CFG.colors.zombie;
        else if (u.type === 'tornado') ctx.fillStyle = CFG.colors.tornado;
        else if (u.type === 'wolf') ctx.fillStyle = CFG.colors.wolf;
        else if (u.type === 'cow') ctx.fillStyle = CFG.colors.cow;
        else if (u.type === 'chicken') ctx.fillStyle = CFG.colors.chicken;
        else if (u.type === 'sheep') ctx.fillStyle = CFG.colors.sheep;
        else {
            const v = State.villages[u.civId];
            ctx.fillStyle = v ? v.color : '#fff';
        }

        if (u.plagued) ctx.fillStyle = '#10b981';

        if (u.type === 'dragon') ctx.fillRect(u.x-1, u.y-1, 2, 2);
        else if (u.type === 'monster' || u.type === 'tornado') ctx.fillRect(u.x-0.5, u.y-0.5, 2, 2);
        else ctx.fillRect(u.x, u.y, 1, 1);
    });

    State.projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 0.5, 0.5);
    });

    State.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 1, 1);
    });
    ctx.globalAlpha = 1;

    ctx.restore();
}

const Tools = {
    nature: [
        { id: 'water', icon: '💧', label: 'Water', act: (x,y) => setTile(x,y,TILES.WATER) },
        { id: 'sand', icon: '🏖️', label: 'Sand', act: (x,y) => setTile(x,y,TILES.SAND) },
        { id: 'forest', icon: '🌲', label: 'Forest', act: (x,y) => setTile(x,y,TILES.FOREST) },
        { id: 'cactus', icon: '🌵', label: 'Cactus', act: (x,y) => setTile(x,y,TILES.CACTUS) },
        { id: 'snow', icon: '❄️', label: 'Snow', act: (x,y) => setTile(x,y,TILES.SNOW) },
        { id: 'mtn', icon: '⛰️', label: 'Peak', act: (x,y) => setTile(x,y,TILES.MOUNTAIN) },
        { id: 'rain', icon: '🌧️', label: 'Rain', act: (x,y) => rain(x,y) },
        { id: 'bolt', icon: '⚡', label: 'Bolt', act: (x,y) => lightning(x,y) }
    ],
    civ: [

        { id: 'wall', icon: '🧱', label: 'Wall', act: (x,y) => setTile(x,y,TILES.WALL) },
        { id: 'house', icon: '🏠', label: 'Home', act: (x,y) => spawnBuilding(x,y, 'house') },
        { id: 'tower', icon: '🏯', label: 'Tower', act: (x,y) => spawnBuilding(x,y, 'tower') },
        { id: 'farm', icon: '🌾', label: 'Farm', act: (x,y) => spawnBuilding(x,y, 'farm') },

    ],
    life: [
        { id: 'cow', icon: '🐮', label: 'Cow', act: (x,y) => spawnUnit(x,y, -1, 'cow') },
        { id: 'sheep', icon: '🐑', label: 'Sheep', act: (x,y) => spawnUnit(x,y, -1, 'sheep') },
        { id: 'wolf', icon: '🐺', label: 'Wolf', act: (x,y) => spawnUnit(x,y, -1, 'wolf') },
        { id: 'zombie', icon: '🧟', label: 'Zombie', act: (x,y) => spawnUnit(x,y, -1, 'zombie') },
        { id: 'monster', icon: '👹', label: 'Beast', act: (x,y) => spawnUnit(x,y, -1, 'monster') },
        { id: 'dragon', icon: '🐉', label: 'Dragon', act: (x,y) => spawnUnit(x,y, -1, 'dragon') }
    ],
    chaos: [
        { id: 'fire', icon: '🔥', label: 'Fire', act: (x,y) => ignite(x,y) },
        { id: 'tnt', icon: '🧨', label: 'Blast', act: (x,y) => explode(x,y, 2) },
        { id: 'meteor', icon: '☄️', label: 'Meteor', act: (x,y) => meteor(x,y) },
        { id: 'plague', icon: '🦠', label: 'Plague', act: (x,y) => infect(x,y) },
        { id: 'nuke', icon: '☢️', label: 'Nuke', act: (x,y) => nuke(x,y) },
        { id: 'tornado', icon: '🌪️', label: 'Wind', act: (x,y) => spawnUnit(x,y, -1, 'tornado') }
    ]
};

function setTile(x, y, t) {
    if (x >= 0 && x < CFG.w && y >= 0 && y < CFG.h) {
        State.map[y*CFG.w+x] = t;
        State.fire[y*CFG.w+x] = 0;
        if (t === TILES.WATER || t === TILES.DEEP || t === TILES.LAVA) {
            const bIdx = State.buildings.findIndex(b => Math.abs(b.x-x) < 1 && Math.abs(b.y-y) < 1);
            if (bIdx !== -1) State.buildings.splice(bIdx, 1);
        }
        AudioSys.playEvent('build');
        showBurstGif();
    }
}

function spawnBuilding(x, y, type='house') {
    if (x >= 0 && x < CFG.w && y >= 0 && y < CFG.h) {
        State.buildings.push({x, y, civId: Math.floor(Math.random()*4), hp: 100, type});
        AudioSys.playEvent('build');
    }
}

function ignite(x, y, r=1) {
    for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
            const ni = (y+dy)*CFG.w+(x+dx);
            if (ni >= 0 && ni < CFG.w*CFG.h) State.fire[ni] = 100;
        }
    }
    AudioSys.playEvent('fire');
}

function rain(x, y) {
    const r = 3;
    for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
            const ni = (y+dy)*CFG.w+(x+dx);
            if (ni >= 0 && ni < CFG.w*CFG.h) {
                State.fire[ni] = 0;
                if (State.map[ni] === TILES.ASH || State.map[ni] === TILES.MUD) State.map[ni] = TILES.GRASS;
                if (State.map[ni] === TILES.SAND && Math.random() < 0.1) State.map[ni] = TILES.GRASS;
            }
        }
    }
    AudioSys.playEvent('magic');
}

function lightning(x, y) {
    ignite(x, y, 0);
    State.units.forEach(u => {
        if (Math.hypot(u.x-x, u.y-y) < 2) {
            u.hp = 0;
            spawnParticle(u.x, u.y, '#fbbf24');
        }
    });
    AudioSys.playEvent('war');
}

function explode(x, y, r=2) {
    for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
            if (dx*dx+dy*dy <= r*r) {
                setTile(x+dx, y+dy, TILES.SAND);
                State.units = State.units.filter(u => Math.hypot(u.x-(x+dx), u.y-(y+dy)) > 1);
                State.buildings = State.buildings.filter(b => Math.hypot(b.x-(x+dx), b.y-(y+dy)) > 1);
                spawnParticle(x+dx, y+dy, '#fbbf24');
            }
        }
    }
    AudioSys.playEvent('boom');
    showBurstGif('https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp');
}

function meteor(x, y) {
    explode(x, y, 5);
    ignite(x, y, 4);
    setTile(x, y, TILES.LAVA);
    showToast('☄️ Meteor strike recorded', 'red');
}

function infect(x, y) {
    let count = 0;
    State.units.forEach(u => {
        if (Math.hypot(u.x-x, u.y-y) < 5) {
            u.plagued = true;
            count++;
        }
    });
    if (count > 0) showToast('🦠 Contagion released', 'green');
    AudioSys.playEvent('magic');
}

function nuke(x, y) {
    explode(x, y, 8);
    ignite(x, y, 6);
    for (let dy = -3; dy <= 3; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
            if (dx*dx+dy*dy < 9) setTile(x+dx, y+dy, TILES.LAVA);
        }
    }
    showToast('☢️ Total wipe launched', 'red');
}

let isDrawing = false;
function handleInput(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;

    const scale = Math.min(canvas.width / CFG.w, canvas.height / CFG.h);
    const ox = (canvas.width - CFG.w*scale)/2;
    const oy = (canvas.height - CFG.h*scale)/2;

    const x = Math.floor((touch.clientX - rect.left - ox) / scale);
    const y = Math.floor((touch.clientY - rect.top - oy) / scale);

    const tool = Object.values(Tools).flat().find(t => t.id === State.selectedTool);
    if (tool) tool.act(x, y);
}

canvas.addEventListener('pointerdown', e => { isDrawing = true; handleInput(e); });
canvas.addEventListener('pointermove', handleInput);
canvas.addEventListener('pointerup', () => isDrawing = false);
canvas.addEventListener('pointerleave', () => isDrawing = false);

function initUI() {
    const scroll = document.getElementById('tool-scroll');
    const cats = document.querySelectorAll('.cat-pill');
    const biomeBtns = document.querySelectorAll('.biome-btn');

    biomeBtns.forEach(btn => {
        btn.onclick = () => {
            AudioSys.playEvent('uiClick');
            biomeBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            State.selectedBiome = btn.dataset.biome;
        };
    });

    function renderTools(cat) {
        scroll.innerHTML = '';
        Tools[cat].forEach(t => {
            const btn = document.createElement('button');
            btn.className = `tool-btn ${State.selectedTool===t.id ? 'active' : ''}`;
            btn.innerHTML = `<span class="tool-icon">${t.icon}</span><span class="tool-label">${t.label}</span>`;
            btn.onclick = () => {
                AudioSys.playEvent('uiClick');
                State.selectedTool = t.id;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
            scroll.appendChild(btn);
        });
    }

    cats.forEach(c => {
        c.onclick = () => {
            AudioSys.playEvent('uiClick');
            cats.forEach(x => x.classList.remove('active'));
            c.classList.add('active');
            renderTools(c.dataset.cat);
        };
    });

    renderTools('nature');

    document.getElementById('speed-btn').onclick = function() {
        AudioSys.playEvent('uiClick');
        State.speed = State.speed >= 3 ? 1 : State.speed + 1;
        this.innerText = State.speed + 'x';
    };

    document.getElementById('pause-btn').onclick = function() {
        State.paused = !State.paused;
        this.innerText = State.paused ? '▶️' : '⏸️';
        AudioSys.playEvent(State.paused ? 'pause' : 'resume');
        if (State.paused) AudioSys.pauseMusic();
        else AudioSys.playMusic();
    };

    document.getElementById('menu-btn').onclick = function() {
        AudioSys.playEvent('menu');
        document.getElementById('start-screen').style.display = 'flex';
        State.paused = true;
        AudioSys.pauseMusic();
    };

    document.getElementById('start-btn').onclick = async () => {
        document.getElementById('start-screen').style.display = 'none';
        await AudioSys.unlock();
        AudioSys.playEvent('start');
        generateWorld(State.selectedBiome);
        State.paused = false;
        AudioSys.playMusic();
        showEventGif();
        setTimeout(() => showToast(`🌍 ${getBiomeLabel(State.selectedBiome)} region generated`, 'yellow'), 500);
    };
}

function getBiomeLabel(biome) {
    return {
        normal: 'Temperate',
        desert: 'Desert',
        winter: 'Winter',
        hell: 'Volcanic'
    }[biome] || 'Custom';
}

function showToast(msg, tone='yellow') {
    const el = document.createElement('div');
    el.className = `toast glass-panel ${tone}`;
    el.innerText = msg;
    const area = document.getElementById('toast-area');
    area.appendChild(el);
    if (area.children.length > 3) area.firstChild.remove();
    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        setTimeout(() => el.remove(), 300);
    }, 3000);
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

initUI();
loop();
</script>
