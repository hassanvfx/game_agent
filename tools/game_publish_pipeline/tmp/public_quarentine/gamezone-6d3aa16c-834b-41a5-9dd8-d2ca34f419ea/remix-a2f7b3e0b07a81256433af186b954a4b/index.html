<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Culinary Duel: Idle Chef</title>
    <!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | title-display: Orbitron | ui-body: Rajdhani | icons: Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Material+Symbols+Rounded" rel="stylesheet">
    <style>
        :root {
            --bg-top: #1d1036;
            --bg-bottom: #090612;
            --panel: rgba(22, 16, 45, 0.82);
            --panel-strong: rgba(35, 23, 70, 0.95);
            --panel-soft: rgba(255, 255, 255, 0.08);
            --line: rgba(255, 255, 255, 0.18);
            --text: #fff7ea;
            --muted: #dccde9;
            --chef-gold: #ffcc4d;
            --chef-orange: #ff8d3b;
            --chef-red: #ff5c72;
            --chef-blue: #58f2ff;
            --player-main: #56f2a4;
            --player-dark: #1ca267;
            --rival-main: #ff7b7b;
            --rival-dark: #c83d58;
            --food: #ffb14a;
            --money: #a0ff7f;
            --shadow: rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at top, #3d236e 0%, #1b1031 38%, #090612 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 18%, rgba(88, 242, 255, 0.18), transparent 28%),
                radial-gradient(circle at 82% 15%, rgba(255, 92, 114, 0.16), transparent 24%),
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.02) 0 2px,
                    transparent 2px 40px
                );
            opacity: 0.9;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        .glass {
            background: linear-gradient(180deg, rgba(43, 27, 84, 0.9), rgba(17, 10, 36, 0.86));
            backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            box-shadow:
                0 12px 28px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .primary-btn,
        .secondary-btn,
        .upgrade-btn,
        .settings-toggle,
        .icon-btn {
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
        }

        .primary-btn:active,
        .secondary-btn:active,
        .upgrade-btn:active,
        .settings-toggle:active,
        .icon-btn:active {
            transform: scale(0.96);
        }

        .screen-title,
        .result-title,
        .brand-text {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: auto auto 16% auto;
            pointer-events: none;
            width: 34vw;
            height: 34vw;
            max-width: 240px;
            max-height: 240px;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.22;
        }

        #game-container::before {
            left: -6%;
            background: var(--chef-blue);
        }

        #game-container::after {
            right: -6%;
            background: var(--chef-red);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #hud {
            width: 100%;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .hud-card {
            min-width: 110px;
            padding: 10px 12px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(31, 20, 58, 0.92), rgba(17, 10, 36, 0.92));
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 10px 20px rgba(0,0,0,0.22);
        }

        .hud-card.player {
            box-shadow: 0 0 0 1px rgba(86, 242, 164, 0.2), 0 10px 20px rgba(0,0,0,0.22);
        }

        .hud-card.rival {
            align-items: flex-end;
            box-shadow: 0 0 0 1px rgba(255, 123, 123, 0.22), 0 10px 20px rgba(0,0,0,0.22);
        }

        .hud-label {
            font-size: 11px;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            font-weight: 600;
        }

        .hud-score {
            margin-top: 3px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 32px;
            line-height: 1;
        }

        .hud-score.player { color: var(--player-main); }
        .hud-score.rival { color: var(--rival-main); }

        .icon-btn {
            pointer-events: auto;
            width: 50px;
            height: 50px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            color: var(--text);
            background: linear-gradient(180deg, rgba(50, 32, 95, 0.94), rgba(22, 13, 43, 0.96));
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 26px;
            line-height: 1;
        }

        #upgrade-panel {
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            pointer-events: auto;
        }

        .upgrade-shell {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 14px;
            border-radius: 22px;
        }

        .upgrade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .upgrade-title {
            margin: 0;
            font-size: 20px;
            line-height: 1;
            color: var(--text);
            letter-spacing: 0.02em;
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .money-chip {
            color: #102116;
            background: linear-gradient(180deg, #caff8e, #7fe85f);
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 999px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .upgrade-btn {
            padding: 12px 10px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08));
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .upgrade-btn:hover,
        .primary-btn:hover,
        .secondary-btn:hover,
        .settings-toggle:hover,
        .icon-btn:hover {
            filter: brightness(1.06);
        }

        .upgrade-tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            font-weight: 600;
        }

        .upgrade-value {
            font-size: 16px;
            font-weight: 700;
        }

        .upgrade-cost {
            margin-top: 2px;
            font-size: 13px;
            font-weight: 700;
            color: #ffd27d;
        }

        #reaction-layer {
            position: absolute;
            inset: 0;
            z-index: 45;
            pointer-events: none;
        }

        .reaction-gif {
            position: absolute;
            right: 12px;
            bottom: 132px;
            width: min(30vw, 120px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 14px 28px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .reaction-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .overlay-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(255, 193, 94, 0.1), transparent 26%),
                linear-gradient(180deg, rgba(12, 7, 24, 0.34), rgba(11, 8, 20, 0.74));
            pointer-events: none;
        }

        .screen-card {
            position: relative;
            width: min(100%, 420px);
            padding: 24px 22px 22px;
            border-radius: 28px;
            overflow: hidden;
        }

        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.08), transparent 45%),
                radial-gradient(circle at 50% 0%, rgba(255, 204, 77, 0.14), transparent 36%);
            pointer-events: none;
        }

        .chef-badge {
            position: relative;
            width: 122px;
            height: 122px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #fff4cf 0 10%, #ffd99b 12%, #f7b566 43%, #ff8d3b 75%, #d15a18 100%);
            box-shadow:
                0 0 0 6px rgba(255,255,255,0.07),
                0 18px 30px rgba(0,0,0,0.3),
                0 0 28px rgba(255, 177, 74, 0.25);
        }

        .chef-badge::before,
        .chef-badge::after {
            content: "";
            position: absolute;
            background: #231644;
        }

        .chef-badge::before {
            width: 72px;
            height: 30px;
            left: 25px;
            top: 12px;
            border-radius: 20px 20px 10px 10px;
            background:
                radial-gradient(circle at 20% 70%, #ffffff 0 30%, transparent 31%),
                radial-gradient(circle at 50% 26%, #ffffff 0 34%, transparent 35%),
                radial-gradient(circle at 78% 72%, #ffffff 0 30%, transparent 31%),
                #f9fdff;
            box-shadow: 0 4px 0 #d7e4ef;
        }

        .chef-badge::after {
            width: 58px;
            height: 10px;
            left: 32px;
            top: 56px;
            border-radius: 999px;
            background:
                radial-gradient(circle, #231644 0 26%, transparent 27%) left center / 50% 100% no-repeat,
                radial-gradient(circle, #231644 0 26%, transparent 27%) right center / 50% 100% no-repeat;
        }

        .chef-emoji {
            position: absolute;
            inset: auto 0 16px 0;
            font-size: 38px;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.18));
        }

        .screen-title {
            position: relative;
            margin: 0 0 8px;
            font-size: clamp(30px, 8vw, 54px);
            line-height: 0.95;
            color: #fff6d4;
            text-shadow: 0 4px 0 rgba(41, 22, 8, 0.34);
        }

        .screen-copy {
            position: relative;
            margin: 0 auto 18px;
            max-width: 290px;
            font-size: 17px;
            line-height: 1.2;
            color: var(--muted);
        }

        .primary-btn,
        .secondary-btn {
            position: relative;
            width: 100%;
            min-height: 52px;
            border-radius: 999px;
            padding: 14px 18px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            box-shadow: 0 14px 26px rgba(0,0,0,0.22);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .primary-btn {
            color: #2a1700;
            background: linear-gradient(180deg, #ffe07f, #ffab34);
        }

        .secondary-btn {
            color: var(--text);
            background: linear-gradient(180deg, #44d87d, #15985f);
        }

        .result-card {
            width: min(100%, 270px);
            margin: 0 auto 18px;
            padding: 18px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.06));
            border: 1px solid rgba(255,255,255,0.14);
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--muted);
            font-weight: 600;
        }

        .result-score {
            margin-top: 8px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 48px;
            line-height: 1;
        }

        #settings-modal {
            position: absolute;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(5, 3, 15, 0.5);
            backdrop-filter: blur(8px);
        }

        .modal-card {
            width: min(100%, 360px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-radius: 26px;
            background: linear-gradient(180deg, rgba(31, 19, 58, 0.98), rgba(15, 10, 31, 0.98));
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }

        .modal-title {
            margin: 0 0 16px;
            text-align: center;
            font-size: 28px;
            line-height: 1;
            color: #fff0b8;
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .modal-content {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .settings-label {
            font-size: 18px;
            font-weight: 600;
        }

        .toggle-pill {
            width: 58px;
            height: 32px;
            border-radius: 999px;
            position: relative;
            background: linear-gradient(180deg, #3ddc86, #14975e);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.26);
        }

        .toggle-pill .knob {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            transition: transform 160ms ease;
        }

        .settings-toggle {
            padding: 8px 14px;
            border-radius: 14px;
            color: var(--text);
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.16);
            font-weight: 700;
        }

        .modal-actions {
            position: sticky;
            bottom: 0;
            padding-top: 16px;
            background: linear-gradient(180deg, transparent, rgba(15, 10, 31, 0.96) 30%);
        }

        /* Custom Scrollbar for upgrades */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

        @media (max-width: 640px) {
            #hud,
            #upgrade-panel {
                padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
            }

            .hud-card {
                min-width: 96px;
                padding: 9px 10px;
            }

            .hud-score {
                font-size: 28px;
            }

            .upgrade-shell {
                padding: 12px;
            }

            .upgrade-grid {
                gap: 8px;
            }

            .upgrade-btn {
                padding: 10px 8px;
            }

            .reaction-gif {
                right: 10px;
                bottom: 146px;
                width: min(28vw, 96px);
            }

            .screen-card {
                padding: 20px 16px 18px;
                border-radius: 24px;
            }

            .screen-copy {
                font-size: 16px;
                margin-bottom: 16px;
            }

            .primary-btn,
            .secondary-btn {
                font-size: 17px;
                padding: 13px 16px;
            }

            .modal-card {
                padding: 18px;
                border-radius: 22px;
            }

            .settings-label {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

<!-- CONFIG DECLARATION -->
<script id="game-config" type="application/x-game-config">
{
    "musicVolume": { "type": "number", "label": "Music Volume", "value": 0.5, "min": 0, "max": 1 },
    "sfxVolume": { "type": "number", "label": "SFX Volume", "value": 0.8, "min": 0, "max": 1 },
    "difficulty": { "type": "number", "label": "Rival Speed", "value": 1.0, "min": 0.5, "max": 2.0 }
}
</script>

<!-- ASSETS -->
<!-- [agent-note][stage3] resolved-audio: bgm/score/ui/win/fail -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Kitchen Rush Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="none" loop></audio>
<audio id="sfx_score" data-editable="audio" data-label="Dish Complete" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_win" data-editable="audio" data-label="Victory" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
<audio id="sfx_tap" data-editable="audio" data-label="Rapid Tap" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_upgrade" data-editable="audio" data-label="Upgrade Success" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Not Enough Cash" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
<audio id="sfx_menu" data-editable="audio" data-label="Menu Open" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3" preload="auto"></audio>

<!-- UI STRUCTURE -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage3] resolved-gif: win/fail overlays -> catalogs/gifs.json -->
    <div id="reaction-layer" aria-hidden="true">
        <img id="reaction-win" class="reaction-gif hidden" alt="" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp">
        <img id="reaction-fail" class="reaction-gif hidden" alt="" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
    </div>

    <!-- UI LAYER -->
    <div id="ui-layer" class="pointer-events-none">

        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-card player">
                <span class="hud-label">Your Line</span>
                <span id="score-p1" class="hud-score player">0</span>
            </div>

            <div>
                <button id="settings-btn" class="icon-btn" aria-label="Open settings">
                    <span class="material-symbols-rounded">settings</span>
                </button>
            </div>

            <div class="hud-card rival">
                <span class="hud-label">Rival Line</span>
                <span id="score-p2" class="hud-score rival">0</span>
            </div>
        </div>

        <!-- UPGRADES PANEL -->
        <div id="upgrade-panel" class="hidden">
            <div class="glass upgrade-shell">
                <div class="upgrade-header">
                    <h3 class="upgrade-title">Station Upgrades</h3>
                    <span id="money-display" class="money-chip">$0</span>
                </div>
                <div class="upgrade-grid">
                    <button id="btn-upgrade-speed" class="upgrade-btn">
                        <span class="upgrade-tag">Prep Team</span>
                        <span class="upgrade-value">Speed +1</span>
                        <span id="cost-speed" class="upgrade-cost">$10</span>
                    </button>
                    <button id="btn-upgrade-profit" class="upgrade-btn">
                        <span class="upgrade-tag">Premium Menu</span>
                        <span class="upgrade-value">Value x1.2</span>
                        <span id="cost-profit" class="upgrade-cost">$50</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREENS -->
    <div id="start-screen" class="overlay-screen glass">
        <div class="screen-card glass">
            <div class="chef-badge" aria-hidden="true">
                <div class="chef-emoji">🍳</div>
            </div>
            <h1 class="screen-title">Kitchen Rush</h1>
            <p class="screen-copy">Tap your station to plate dishes faster, stack upgrades, and outcook the rival crew in a neon kitchen showdown.</p>
            <button id="start-btn" class="primary-btn">Start Service</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay-screen glass hidden">
        <div class="screen-card glass">
            <div class="chef-badge" aria-hidden="true">
                <div class="chef-emoji">🏆</div>
            </div>
            <h2 id="end-title" class="screen-title result-title">Service Won</h2>
            <div class="result-card">
                <p class="result-label">Dishes Served</p>
                <p id="final-score" class="result-score">0</p>
            </div>
            <button id="restart-btn" class="secondary-btn">Run It Back</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden">
        <div class="modal-card">
            <h3 class="modal-title">Settings</h3>

            <div class="modal-content">
                <div class="settings-row">
                    <span class="settings-label">Music</span>
                    <button id="toggle-music" class="toggle-pill" aria-label="Toggle music">
                        <div class="knob"></div>
                    </button>
                </div>

                <div class="settings-row">
                    <span class="settings-label">Graphics</span>
                    <button id="toggle-graphics" class="settings-toggle">HIGH</button>
                </div>
            </div>

            <div class="modal-actions">
                <button id="close-settings" class="primary-btn">Resume</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * CORE ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimization
let dpr = 1;
let winConfettiTimer = null;
let reactionTimer = null;
let lastTapSfxAt = 0;

// Config
const CONFIG = {
    targetScore: 50,
    baseEnemySpeed: 0.05,
    highGraphics: true,
    musicEnabled: true,
    colors: {
        bg: '#12091f',
        p1: '#56F2A4',
        p2: '#FF7B7B',
        ui: '#FFF7EA',
        food: '#FFB14A',
        glow: '#58F2FF',
        counter: '#45255F',
        floor: '#2C1739'
    }
};

// State
let gameState = 'INIT'; // INIT, INTRO, PLAYING, END
let lastTime = 0;
let particles = [];
let entities = [];

// Game Data
const gameData = {
    p1: { score: 0, progress: 0, speed: 0.1, money: 0, level: 1, profitMult: 1 },
    p2: { score: 0, progress: 0, speed: 0.08 }, // AI
    costs: { speed: 10, profit: 50 }
};

// Editor Config Bridge
window.gameConfigDefs = {
    "musicVolume": { "type": "number", "label": "Music Volume", "value": 0.5, "min": 0, "max": 1 },
    "sfxVolume": { "type": "number", "label": "SFX Volume", "value": 0.8, "min": 0, "max": 1 },
    "difficulty": { "type": "number", "label": "Rival Speed", "value": 1.0, "min": 0.5, "max": 2.0 }
};
window.gameConfig = {
    musicVolume: 0.5,
    sfxVolume: 0.8,
    difficulty: 1.0
};
window.updateGameConfig = (key, val) => {
    if(window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if(key === 'difficulty') CONFIG.baseEnemySpeed = 0.05 * val;
    }
};

/**
 * AUDIO SYSTEM
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    score: document.getElementById('sfx_score'),
    win: document.getElementById('sfx_win'),
    tap: document.getElementById('sfx_tap'),
    upgrade: document.getElementById('sfx_upgrade'),
    fail: document.getElementById('sfx_fail'),
    menu: document.getElementById('sfx_menu'),
    close: document.getElementById('sfx_close')
};

const playSound = (id) => {
    const sound = sounds[id];
    if (!sound) return;
    if (!CONFIG.musicEnabled && id === 'bgm') return;
    if (id === 'bgm') {
        sound.volume = Math.max(0, Math.min(0.2, window.gameConfig.musicVolume * 0.4));
        sound.play().catch(() => {});
        return;
    }

    const instance = sound.cloneNode();
    const volumeMap = {
        tap: 0.28,
        menu: 0.35,
        close: 0.32,
        fail: 0.4,
        upgrade: 0.5,
        score: 0.42,
        win: 0.62
    };
    instance.volume = Math.max(0, Math.min(1, window.gameConfig.sfxVolume * (volumeMap[id] ?? 0.45)));
    instance.play().catch(() => playSynth(id));
};

const showReaction = (type) => {
    const winEl = document.getElementById('reaction-win');
    const failEl = document.getElementById('reaction-fail');
    if (!winEl || !failEl) return;

    clearTimeout(reactionTimer);
    winEl.classList.add('hidden');
    winEl.classList.remove('show');
    failEl.classList.add('hidden');
    failEl.classList.remove('show');

    const target = type === 'win' ? winEl : failEl;
    target.classList.remove('hidden');
    requestAnimationFrame(() => target.classList.add('show'));
    reactionTimer = setTimeout(() => {
        target.classList.remove('show');
        setTimeout(() => target.classList.add('hidden'), 180);
    }, 1800);
};

const playSynth = (type) => {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'win' || type === 'upgrade') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(type === 'upgrade' ? 520 : 400, now);
        osc.frequency.linearRampToValueAtTime(type === 'upgrade' ? 980 : 800, now + 0.22);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
    } else if (type === 'fail' || type === 'menu' || type === 'close' || type === 'tap') {
        osc.type = type === 'fail' ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(type === 'fail' ? 240 : 360, now);
        osc.frequency.linearRampToValueAtTime(type === 'fail' ? 170 : 280, now + 0.08);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    }
};

const toggleMusic = () => {
    CONFIG.musicEnabled = !CONFIG.musicEnabled;
    const btn = document.getElementById('toggle-music');
    const knob = btn.firstElementChild;

    if (CONFIG.musicEnabled) {
        btn.style.background = 'linear-gradient(180deg, #3ddc86, #14975e)';
        knob.style.transform = 'translateX(0)';
        playSound('bgm');
    } else {
        btn.style.background = 'linear-gradient(180deg, #7e7a93, #4d4860)';
        knob.style.transform = 'translateX(-26px)';
        sounds.bgm.pause();
    }
};

/**
 * GRAPHICS SYSTEM
 */
const resize = () => {
    const rect = document.getElementById('game-container').getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = `${rect.width}px`;
    canvas.style.height = `${rect.height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};

class Particle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'steam', 'sparkle', 'confetti'
        this.life = 1.0;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 1) * 2;
        this.color = type === 'steam' ? '#FFFFFF' :
                     type === 'sparkle' ? '#FFD86A' :
                     `hsl(${Math.random()*360}, 78%, 58%)`;
        this.size = Math.random() * 5 + 2;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= dt * 1.5;
        if (this.type === 'steam') {
            this.y -= 1;
            this.size += 0.1;
        } else if (this.type === 'confetti') {
            this.vy += 0.1; // Gravity
        }
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        if (this.type === 'steam') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
        ctx.globalAlpha = 1.0;
    }
}

const drawChef = (x, y, color, isPlayer, progress) => {
    const accent = isPlayer ? '#58F2FF' : '#FF9AC2';
    const apron = isPlayer ? '#1CA267' : '#C83D58';
    const face = '#FFD79B';
    const hatShadow = '#D8E8F2';
    const side = isPlayer ? -1 : 1;
    const bounce = gameState === 'PLAYING' ? Math.sin(performance.now() / 160) * 2.2 : 0;
    const bodyY = y + bounce;

    if (CONFIG.highGraphics) {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(x, bodyY + 58, 44, 12, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Aura
    ctx.fillStyle = `${accent}22`;
    ctx.beginPath();
    ctx.arc(x, bodyY - 8, 58, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = apron;
    ctx.beginPath();
    ctx.roundRect(x - 34, bodyY - 12, 68, 78, 26);
    ctx.fill();

    // Collar
    ctx.fillStyle = '#FFF5E8';
    ctx.beginPath();
    ctx.moveTo(x - 20, bodyY + 6);
    ctx.lineTo(x, bodyY + 25);
    ctx.lineTo(x + 20, bodyY + 6);
    ctx.closePath();
    ctx.fill();

    // Face
    ctx.fillStyle = face;
    ctx.beginPath();
    ctx.arc(x, bodyY - 22, 31, 0, Math.PI * 2);
    ctx.fill();

    // Hat base
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x - 26, bodyY - 62, 52, 24);

    // Hat puff
    ctx.beginPath();
    ctx.arc(x - 18, bodyY - 52, 16, Math.PI, 0);
    ctx.arc(x, bodyY - 60, 18, Math.PI, 0);
    ctx.arc(x + 18, bodyY - 52, 16, Math.PI, 0);
    ctx.fill();

    // Hat shadow line
    ctx.fillStyle = hatShadow;
    ctx.fillRect(x - 26, bodyY - 40, 52, 4);

    // Eyes
    ctx.fillStyle = '#231644';
    ctx.beginPath();
    ctx.arc(x - 11, bodyY - 25, 4.2, 0, Math.PI * 2);
    ctx.arc(x + 11, bodyY - 25, 4.2, 0, Math.PI * 2);
    ctx.fill();

    // Brows
    ctx.strokeStyle = '#231644';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 18, bodyY - 34);
    ctx.lineTo(x - 6, bodyY - 36 + (isPlayer ? -1 : 1));
    ctx.moveTo(x + 6, bodyY - 36 + (isPlayer ? -1 : 1));
    ctx.lineTo(x + 18, bodyY - 34);
    ctx.stroke();

    // Smile / rival smirk
    ctx.beginPath();
    ctx.strokeStyle = isPlayer ? '#9A4D2A' : '#7D1732';
    ctx.lineWidth = 2.5;
    if (isPlayer) {
        ctx.arc(x, bodyY - 14, 10, 0.2, Math.PI - 0.2);
    } else {
        ctx.arc(x + 2, bodyY - 15, 9, 0.45, Math.PI - 0.65);
    }
    ctx.stroke();

    // Blush
    ctx.fillStyle = isPlayer ? 'rgba(255,126,137,0.25)' : 'rgba(255,180,200,0.28)';
    ctx.beginPath();
    ctx.ellipse(x - 20, bodyY - 16, 7, 4, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 20, bodyY - 16, 7, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Arms
    ctx.strokeStyle = color;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 28, bodyY + 8);
    ctx.lineTo(x - 46, bodyY + 24 + side * 2);
    ctx.moveTo(x + 28, bodyY + 8);
    ctx.lineTo(x + 46, bodyY + 24 - side * 2);
    ctx.stroke();

    // Pan / tray
    ctx.fillStyle = '#3B3E59';
    ctx.beginPath();
    ctx.roundRect(x + side * 34, bodyY + 26, 32, 10, 6);
    ctx.fill();

    // Accent scarf
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.roundRect(x - 16, bodyY + 4, 32, 8, 6);
    ctx.fill();

    // Progress Ring
    if (gameState === 'PLAYING') {
        ctx.beginPath();
        ctx.arc(x, bodyY - 4, 57, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress));
        ctx.strokeStyle = accent;
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, bodyY - 4, 57, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 7;
        ctx.stroke();
    }
};

const drawFood = (x, y, isPlayerSide) => {
    const pulse = Math.sin(performance.now() / 220) * 1.8;
    const steamChance = isPlayerSide ? 0.82 : 0.88;

    // Plate glow
    ctx.fillStyle = isPlayerSide ? 'rgba(88, 242, 255, 0.16)' : 'rgba(255, 123, 123, 0.13)';
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 38 + pulse, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // Plate
    ctx.fillStyle = '#FFF9F0';
    ctx.beginPath();
    ctx.ellipse(x, y, 34, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Dish base
    ctx.fillStyle = '#F6B04D';
    ctx.beginPath();
    ctx.arc(x, y - 11, 17, 0, Math.PI * 2);
    ctx.fill();

    // Garnish
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath();
    ctx.arc(x - 8, y - 14, 6, 0, Math.PI * 2);
    ctx.arc(x + 7, y - 9, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#9EF45B';
    ctx.beginPath();
    ctx.ellipse(x + 4, y - 18, 7, 3, 0.5, 0, Math.PI * 2);
    ctx.ellipse(x - 4, y - 5, 5, 2.5, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // Cloche shine
    if (CONFIG.highGraphics) {
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x - 4, y - 12, 10, Math.PI * 1.1, Math.PI * 1.75);
        ctx.stroke();
    }

    // Steam
    if (CONFIG.highGraphics && Math.random() > steamChance) {
        particles.push(new Particle(x, y - 20, 'steam'));
    }
};

/**
 * LOGIC
 */
const spawnParticles = (x, y, count, type) => {
    if (!CONFIG.highGraphics) return;
    for(let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, type));
    }
};

const clearWinTimer = () => {
    if (winConfettiTimer) {
        clearInterval(winConfettiTimer);
        winConfettiTimer = null;
    }
};

const checkWin = () => {
    if (gameData.p1.score >= CONFIG.targetScore) {
        endGame(true);
    } else if (gameData.p2.score >= CONFIG.targetScore) {
        endGame(false);
    }
};

const endGame = (playerWon) => {
    gameState = 'END';
    document.getElementById('ui-layer').classList.add('pointer-events-none'); // Disable game UI
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('upgrade-panel').classList.add('hidden');

    const screen = document.getElementById('game-over-screen');
    const title = document.getElementById('end-title');

    clearWinTimer();
    screen.classList.remove('hidden');
    document.getElementById('final-score').innerText = gameData.p1.score;

    if (playerWon) {
        title.innerText = "Service Won";
        title.style.color = '#9effa7';
        playSound('win');
        showReaction('win');
        winConfettiTimer = setInterval(() => {
            if (gameState === 'END') spawnParticles(canvas.width / 2 / dpr, canvas.height / 2 / dpr, 5, 'confetti');
        }, 100);
    } else {
        title.innerText = "Service Lost";
        title.style.color = '#ff90a2';
        playSound('fail');
        showReaction('fail');
    }
};

const updateLogic = (dt) => {
    if (gameState !== 'PLAYING') return;

    // AI Logic
    gameData.p2.progress += gameData.p2.speed * CONFIG.baseEnemySpeed * dt * 10; // Normalized speed
    if (gameData.p2.progress >= 1) {
        gameData.p2.progress = 0;
        gameData.p2.score++;
        document.getElementById('score-p2').innerText = gameData.p2.score;
        checkWin();
    }

    // Player Auto Logic (Idle aspect)
    gameData.p1.progress += gameData.p1.speed * 0.5 * dt * 5;
    if (gameData.p1.progress >= 1) {
        completeDish();
    }
};

const completeDish = () => {
    gameData.p1.progress = 0;
    gameData.p1.score++;

    // Money
    const earned = Math.floor(10 * gameData.p1.profitMult);
    gameData.p1.money += earned;

    // UI Updates
    document.getElementById('score-p1').innerText = gameData.p1.score;
    document.getElementById('money-display').innerText = `$${gameData.p1.money}`;

    // Feedback
    playSound('score');

    const cw = canvas.width / dpr;
    const ch = canvas.height / dpr;
    spawnParticles(cw * 0.25, ch * 0.6, 10, 'sparkle');

    checkWin();
    updateButtons();
};

const updateButtons = () => {
    const sBtn = document.getElementById('btn-upgrade-speed');
    const pBtn = document.getElementById('btn-upgrade-profit');

    sBtn.style.opacity = gameData.p1.money >= gameData.costs.speed ? 1 : 0.5;
    pBtn.style.opacity = gameData.p1.money >= gameData.costs.profit ? 1 : 0.5;
};

/**
 * INPUT
 */
const handleTap = (e) => {
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Check if tapped on player side (Left half)
    if (x < rect.width / 2) {
        gameData.p1.progress += 0.15; // Tap boost
        spawnParticles(x, y, 3, 'steam');

        const now = performance.now();
        if (now - lastTapSfxAt > 90) {
            playSound('tap');
            lastTapSfxAt = now;
        }

        if (gameData.p1.progress >= 1) {
            completeDish();
        }
    }
};

const drawBackground = (cw, ch) => {
    const grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, '#2A1651');
    grad.addColorStop(0.48, '#1A102F');
    grad.addColorStop(1, '#090612');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    // Ceiling glow
    ctx.fillStyle = 'rgba(88,242,255,0.08)';
    ctx.beginPath();
    ctx.ellipse(cw * 0.2, ch * 0.14, cw * 0.18, ch * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,92,114,0.07)';
    ctx.beginPath();
    ctx.ellipse(cw * 0.8, ch * 0.16, cw * 0.2, ch * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();

    // Neon divider
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(cw * 0.498, ch * 0.18, cw * 0.004, ch * 0.56);

    // Kitchen tiles
    const tileSize = Math.max(24, cw * 0.06);
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let x = 0; x < cw; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, ch * 0.12);
        ctx.lineTo(x, ch * 0.72);
        ctx.stroke();
    }
    for (let y = ch * 0.12; y < ch * 0.72; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }

    // Floor
    const floorGrad = ctx.createLinearGradient(0, ch * 0.72, 0, ch);
    floorGrad.addColorStop(0, '#46255D');
    floorGrad.addColorStop(1, '#21102C');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, ch * 0.72, cw, ch * 0.28);

    // Floor highlights
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    for (let i = 0; i < 6; i++) {
        ctx.fillRect(cw * (i / 6), ch * 0.78, cw * 0.08, ch * 0.18);
    }
};

const drawStations = (cw, ch) => {
    const counterY = ch * 0.61;
    const counterHeight = Math.max(18, ch * 0.025);

    const drawCounter = (x, width, baseColor, accentColor) => {
        const grad = ctx.createLinearGradient(0, counterY, 0, counterY + counterHeight);
        grad.addColorStop(0, accentColor);
        grad.addColorStop(1, baseColor);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, counterY, width, counterHeight, 10);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(x + 10, counterY + 3, width - 20, 3);
    };

    drawCounter(cw * 0.09, cw * 0.32, '#3E415E', '#7780B5');
    drawCounter(cw * 0.59, cw * 0.32, '#593A48', '#AC6E8D');
};

/**
 * GAME LOOP
 */
const loop = (timestamp) => {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    updateLogic(dt);

    // Render
    const cw = canvas.width / dpr;
    const ch = canvas.height / dpr;

    drawBackground(cw, ch);

    if (gameState === 'PLAYING' || gameState === 'END') {
        drawStations(cw, ch);

        // Draw chefs
        drawChef(cw * 0.25, ch * 0.5, CONFIG.colors.p1, true, gameData.p1.progress);
        drawChef(cw * 0.75, ch * 0.5, CONFIG.colors.p2, false, gameData.p2.progress);

        // Draw food on tables
        drawFood(cw * 0.25, ch * 0.6, true);
        drawFood(cw * 0.75, ch * 0.6, false);
    } else if (gameState === 'INTRO') {
        // Intro Animation Logic could go here, but using DOM overlay for simplicity
    }

    // Particles
    if (CONFIG.highGraphics) {
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            particles[i].draw(ctx);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
    }

    requestAnimationFrame(loop);
};

/**
 * INITIALIZATION
 */
document.addEventListener('DOMContentLoaded', () => {
    resize();
    window.addEventListener('resize', resize);

    // Input
    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleTap(e);
    }, { passive: false });

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('upgrade-panel').classList.remove('hidden');
        document.getElementById('ui-layer').classList.remove('pointer-events-none');

        // Audio unlock
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playSound('menu');
        playSound('bgm');

        gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        // Reset
        clearWinTimer();
        gameData.p1.score = 0;
        gameData.p1.progress = 0;
        gameData.p1.money = 0;
        gameData.p1.speed = 0.1;
        gameData.p1.profitMult = 1;
        gameData.p2.score = 0;
        gameData.p2.progress = 0;
        gameData.costs.speed = 10;
        gameData.costs.profit = 50;
        particles = [];

        document.getElementById('score-p1').innerText = '0';
        document.getElementById('score-p2').innerText = '0';
        document.getElementById('money-display').innerText = '$0';
        document.getElementById('cost-speed').innerText = '$10';
        document.getElementById('cost-profit').innerText = '$50';

        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('upgrade-panel').classList.remove('hidden');
        document.getElementById('ui-layer').classList.remove('pointer-events-none');

        gameState = 'PLAYING';
        updateButtons();
    });

    // Upgrades
    document.getElementById('btn-upgrade-speed').addEventListener('click', () => {
        if (gameData.p1.money >= gameData.costs.speed) {
            gameData.p1.money -= gameData.costs.speed;
            gameData.p1.speed += 0.05;
            gameData.costs.speed = Math.floor(gameData.costs.speed * 1.5);

            document.getElementById('money-display').innerText = `$${gameData.p1.money}`;
            document.getElementById('cost-speed').innerText = `$${gameData.costs.speed}`;
            updateButtons();
            playSound('upgrade');
            spawnParticles(canvas.width / dpr * 0.25, canvas.height / dpr * 0.5, 5, 'sparkle');
        } else {
            playSound('fail');
        }
    });

    document.getElementById('btn-upgrade-profit').addEventListener('click', () => {
        if (gameData.p1.money >= gameData.costs.profit) {
            gameData.p1.money -= gameData.costs.profit;
            gameData.p1.profitMult *= 1.2;
            gameData.costs.profit = Math.floor(gameData.costs.profit * 1.8);

            document.getElementById('money-display').innerText = `$${gameData.p1.money}`;
            document.getElementById('cost-profit').innerText = `$${gameData.costs.profit}`;
            updateButtons();
            playSound('upgrade');
            spawnParticles(canvas.width / dpr * 0.25, canvas.height / dpr * 0.5, 5, 'sparkle');
        } else {
            playSound('fail');
        }
    });

    // Settings
    document.getElementById('settings-btn').addEventListener('click', () => {
        playSound('menu');
        document.getElementById('settings-modal').classList.remove('hidden');
    });

    document.getElementById('close-settings').addEventListener('click', () => {
        playSound('close');
        document.getElementById('settings-modal').classList.add('hidden');
    });

    document.getElementById('toggle-music').addEventListener('click', toggleMusic);

    document.getElementById('toggle-graphics').addEventListener('click', (e) => {
        CONFIG.highGraphics = !CONFIG.highGraphics;
        e.target.innerText = CONFIG.highGraphics ? 'HIGH' : 'LOW';
        e.target.style.background = CONFIG.highGraphics ? 'rgba(255,255,255,0.1)' : 'rgba(126,122,147,0.32)';
        e.target.style.color = CONFIG.highGraphics ? 'var(--text)' : '#d3c8dd';
        if (!CONFIG.highGraphics) particles = [];
    });

    updateButtons();
    requestAnimationFrame(loop);
});
</script>
</body>
</html>
