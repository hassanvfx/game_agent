<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Relay Run</title>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide, ui=Exo 2 | source: catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #070412;
            --bg-mid: #131f31;
            --bg-bottom: #041812;
            --panel: rgba(8, 22, 30, 0.82);
            --panel-strong: rgba(10, 32, 40, 0.92);
            --line: rgba(90, 255, 196, 0.38);
            --glow: rgba(0, 255, 179, 0.26);
            --glow-strong: rgba(0, 238, 255, 0.36);
            --danger: #ff4f75;
            --danger-dark: #7d1f3f;
            --gold: #ffe56b;
            --text: #f4fbff;
            --muted: rgba(232, 250, 255, 0.72);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f0b1e;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(0, 245, 180, 0.08), transparent 32%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 55%, var(--bg-bottom));
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hidden { display: none !important; }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 0%, rgba(0, 255, 196, 0.08), transparent 36%),
                linear-gradient(180deg, #090414, #051318 80%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) 0 calc(12px + var(--safe-left));
            gap: 10px;
        }

        .hud-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .hud-card,
        .status-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 10px 14px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(7, 29, 33, 0.94), rgba(4, 14, 20, 0.88));
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 0 18px var(--glow),
                inset 0 0 28px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .hud-card::before,
        .status-card::before,
        .modal-panel::before,
        .control-button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.12), transparent 30%, transparent 70%, rgba(0,255,196,0.08));
            pointer-events: none;
        }

        .status-card {
            justify-content: center;
            min-width: 88px;
        }

        .score-icon,
        .status-icon {
            font-size: 20px;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255,229,107,0.35));
        }

        .font-hud {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            text-shadow: 0 0 8px currentColor;
        }

        .font-ui {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .score-value,
        .time-value {
            font-size: 24px;
            letter-spacing: 0.14em;
            line-height: 1;
            white-space: nowrap;
        }

        .time-value { color: #6af7cb; }

        .lives-row {
            display: flex;
            gap: 5px;
            padding-left: 3px;
            min-height: 32px;
            align-items: center;
        }

        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(138px + var(--safe-bottom));
            display: flex;
            pointer-events: auto;
            padding-bottom: var(--safe-bottom);
            background: linear-gradient(180deg, rgba(3,10,15,0), rgba(2,10,14,0.42) 40%, rgba(2,8,12,0.72));
        }

        .control-button {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #71ffd0;
            border-top: 1px solid rgba(113,255,208,0.14);
            transition: background-color 120ms ease, transform 120ms ease, filter 120ms ease;
            overflow: hidden;
        }

        .control-button + .control-button {
            border-left: 1px solid rgba(113,255,208,0.18);
        }

        .control-button:active {
            transform: scale(0.98);
            filter: brightness(1.08);
        }

        .control-button svg {
            width: 58px;
            height: 58px;
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(113,255,208,0.35));
        }

        .screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(24px + var(--safe-top)) calc(20px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(20px + var(--safe-left));
            background: rgba(1, 5, 10, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
        }

        .start-screen {
            background:
                radial-gradient(circle at 50% 18%, rgba(0,255,208,0.14), transparent 30%),
                rgba(1, 5, 10, 0.82);
        }

        .title-wrap {
            position: relative;
            margin-bottom: 12px;
            padding: 18px 18px 8px;
        }

        .title-wrap::before,
        .title-wrap::after {
            content: "✦";
            position: absolute;
            top: 0;
            color: rgba(114,255,222,0.75);
            font-size: 18px;
            text-shadow: 0 0 12px rgba(114,255,222,0.5);
        }

        .title-wrap::before { left: 2px; }
        .title-wrap::after { right: 2px; }

        .game-title {
            margin: 0;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(30px, 9vw, 64px);
            line-height: 0.92;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(180deg, #b8fff3 0%, #65ffe0 38%, #00e4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 16px rgba(0,255,208,0.32));
        }

        .subtitle {
            margin: 0 0 22px;
            max-width: 320px;
            color: var(--muted);
            font-size: 16px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .character-card {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 14px;
            width: min(100%, 360px);
            margin-bottom: 24px;
            padding: 14px 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(7, 24, 28, 0.92), rgba(5, 12, 18, 0.96));
            border: 1px solid rgba(103,255,224,0.28);
            box-shadow: 0 0 22px rgba(0, 255, 179, 0.18);
            text-align: left;
        }

        .character-badge {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 32%, rgba(225,255,255,0.9), rgba(145,255,228,0.25) 34%, transparent 35%),
                linear-gradient(180deg, rgba(0,255,200,0.18), rgba(0,92,92,0.12));
            border: 1px solid rgba(103,255,224,0.38);
            box-shadow: inset 0 0 18px rgba(255,255,255,0.08), 0 0 18px rgba(0,255,179,0.2);
            font-size: 34px;
            animation: pilotFloat 2.6s ease-in-out infinite;
        }

        .character-copy strong {
            display: block;
            margin-bottom: 4px;
            font-size: 17px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #92ffde;
        }

        .character-copy span {
            display: block;
            color: rgba(244, 251, 255, 0.78);
            font-size: 14px;
            line-height: 1.2;
        }

        .btn-press {
            transition: transform 120ms ease, filter 120ms ease, box-shadow 160ms ease;
        }

        .btn-press:active {
            transform: scale(0.96);
            filter: brightness(1.08);
        }

        .action-button {
            position: relative;
            min-width: 210px;
            padding: 14px 26px;
            border: 1px solid rgba(119,255,221,0.42);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(15, 67, 69, 0.95), rgba(4, 34, 42, 0.98));
            color: #faffff;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 19px;
            letter-spacing: 0.12em;
            box-shadow: 0 0 22px rgba(0,255,196,0.22), inset 0 0 18px rgba(255,255,255,0.06);
            cursor: pointer;
        }

        .action-button-danger {
            background: linear-gradient(180deg, rgba(125, 31, 63, 0.98), rgba(71, 10, 31, 0.98));
            border-color: rgba(255, 111, 146, 0.42);
            box-shadow: 0 0 22px rgba(255,79,117,0.24), inset 0 0 18px rgba(255,255,255,0.05);
        }

        .modal-panel {
            position: relative;
            width: min(100%, 290px);
            margin: 0 0 24px;
            padding: 18px 18px 16px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(10, 23, 30, 0.95), rgba(7, 13, 22, 0.96));
            border: 1px solid rgba(108,255,224,0.26);
            box-shadow: 0 0 24px rgba(0, 255, 179, 0.16);
        }

        .modal-title {
            margin: 0 0 18px;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(28px, 8vw, 44px);
            line-height: 0.95;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .modal-title-danger {
            color: #ff6f92;
            text-shadow: 0 0 14px rgba(255,79,117,0.36);
        }

        .stat-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            color: rgba(255,255,255,0.66);
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .stat-value-main {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 42px;
            color: #ffffff;
            line-height: 1;
        }

        .stat-value-sub {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 22px;
            color: #6af7cb;
            line-height: 1;
        }

        .feedback-overlay {
            position: absolute;
            top: calc(88px + var(--safe-top));
            right: calc(12px + var(--safe-right));
            z-index: 55;
            width: min(32vw, 120px);
            border-radius: 18px;
            border: 1px solid rgba(109, 255, 216, 0.28);
            background: rgba(3, 14, 20, 0.68);
            box-shadow: 0 0 18px rgba(0, 255, 196, 0.18);
            opacity: 0;
            transform: translateY(-6px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        .feedback-overlay.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay.danger {
            border-color: rgba(255, 111, 146, 0.45);
            box-shadow: 0 0 18px rgba(255, 79, 117, 0.25);
        }

        .feedback-overlay.reward {
            border-color: rgba(255, 229, 107, 0.45);
            box-shadow: 0 0 18px rgba(255, 229, 107, 0.24);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
            margin: 8px 0;
        }

        .text-glow-green { color: #00ff66; text-shadow: 0 0 10px #00ff66; }
        .text-glow-red { color: #ff5d7b; text-shadow: 0 0 10px rgba(255, 56, 99, 0.9); }

        /* [agent-note][stage2] visual-intent: neon courier cockpit overlay | scope: menus,hud */
        .scanline {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:

            background-size: 100% 4px, 100% 100%;
            z-index: 10;
            opacity: 0.9;
        }

        .scanline::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(98,255,227,0.08), transparent);
            animation: scanBeam 5.5s linear infinite;
        }

        .cockpit-frame {
            position: absolute;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            border: 1px solid rgba(113,255,208,0.08);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);

        .cockpit-frame::after {
            content: "";
            position: absolute;
            top: 16px;
            width: 88px;
            height: 88px;
            border-top: 2px solid rgba(113,255,208,0.18);
        }

        .cockpit-frame::before {
            left: 16px;
            border-left: 2px solid rgba(113,255,208,0.18);
            border-top-left-radius: 18px;
        }

        .cockpit-frame::after {
            right: 16px;
            border-right: 2px solid rgba(113,255,208,0.18);
            border-top-right-radius: 18px;
        }

        .starfield,
        .spark-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .starfield span,
        .spark-layer span {
            position: absolute;
            display: block;
            border-radius: 999px;
        }

        .starfield span {
            width: 2px;
            height: 2px;
            background: rgba(230,255,255,0.9);
            box-shadow: 0 0 10px rgba(108,255,224,0.25);
            animation: twinkle 4.6s ease-in-out infinite;
        }

        .spark-layer span {
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, rgba(255,238,159,0.9), rgba(255,238,159,0.12));
            animation: sparkFloat 2.4s ease-in-out infinite;
            opacity: 0.45;
        }

        .starfield span:nth-child(1) { left: 12%; top: 16%; animation-delay: 0s; }
        .starfield span:nth-child(2) { left: 22%; top: 9%; animation-delay: 1.4s; }
        .starfield span:nth-child(3) { left: 40%; top: 14%; animation-delay: 0.7s; }
        .starfield span:nth-child(4) { left: 68%; top: 10%; animation-delay: 2.2s; }
        .starfield span:nth-child(5) { left: 82%; top: 17%; animation-delay: 1.1s; }
        .starfield span:nth-child(6) { left: 88%; top: 27%; animation-delay: 2.8s; }

        .spark-layer span:nth-child(1) { left: 14%; bottom: 24%; animation-delay: 0.2s; }
        .spark-layer span:nth-child(2) { left: 50%; bottom: 18%; animation-delay: 1s; }
        .spark-layer span:nth-child(3) { left: 84%; bottom: 26%; animation-delay: 1.8s; }

        @keyframes scanBeam {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes pilotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.18; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.4); }
        }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.2; }
            50% { transform: translateY(-12px) scale(1.15); opacity: 0.65; }
        }

        @media (max-width: 640px) {
            .hud {
                padding-top: calc(10px + var(--safe-top));
                padding-left: calc(10px + var(--safe-left));
                padding-right: calc(10px + var(--safe-right));
            }

            .hud-card,
            .status-card {
                min-height: 42px;
                padding: 8px 10px;
                border-radius: 14px;
            }

            .score-value,
            .time-value {
                font-size: 18px;
            }

            .subtitle {
                font-size: 13px;
                letter-spacing: 0.14em;
                margin-bottom: 18px;
            }

            .character-card {
                width: min(100%, 330px);
                gap: 10px;
                padding: 12px 14px;
                margin-bottom: 20px;
            }

            .character-badge {
                width: 58px;
                height: 58px;
                font-size: 28px;
            }

            .character-copy strong {
                font-size: 15px;
            }

            .character-copy span {
                font-size: 13px;
            }

            .action-button {
                min-width: 190px;
                padding: 13px 22px;
                font-size: 17px;
            }

            .control-button svg {
                width: 52px;
                height: 52px;
            }

            .controls {
                height: calc(128px + var(--safe-bottom));
            }
        }
    </style>
</head>

</div>

<!-- Game Container -->
<div id="game-container" class="game-shell">

                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M9 5l7 7-7 7"></path></svg>

<script>
/*
 * NEON RELAY RUN
 * Narrative framing:
 * - Player is a courier node riding a hover rig
 * - Stars represent relay cores
 * - Red blockers represent firewall gates
 */

// --- Audio System ---
const AudioSys = {
    ctx: null,
    muted: false,
    channels: new Map(),
    coolDowns: new Map(),
    init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
    },
    unlock() {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    },
    play(id, vol = 0.5, throttleMs = 0) {
        if (this.muted) return;
        const el = document.getElementById(id);
        if (!el) return;
        this.unlock();
        const now = performance.now();
        const last = this.coolDowns.get(id) || 0;
        if (throttleMs && now - last < throttleMs) return;
        this.coolDowns.set(id, now);

        let channel = this.channels.get(id);
        if (!channel) {
            channel = el.cloneNode();
            this.channels.set(id, channel);
        }
        channel.pause();
        channel.currentTime = 0;
        channel.volume = vol;
        channel.play().catch(() => {});
    },
    playBGM() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        this.unlock();
        el.volume = 0.2;
        el.play().catch(() => {});
    },
    stopBGM(reset = true) {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        if (reset) el.currentTime = 0;
    }
};

const Feedback = {
    rewardTimer: null,
    dangerTimer: null,
    rewardEl: null,
    dangerEl: null,
    init() {
        this.rewardEl = document.getElementById('feedback-reward');
        this.dangerEl = document.getElementById('feedback-danger');
        if (this.rewardEl) this.rewardEl.src = 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp';
        if (this.dangerEl) this.dangerEl.src = 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';
    },
    pulse(type, duration = 900) {
        const isReward = type === 'reward';
        const el = isReward ? this.rewardEl : this.dangerEl;
        if (!el) return;
        clearTimeout(isReward ? this.rewardTimer : this.dangerTimer);
        el.classList.add('show');
        const timer = setTimeout(() => el.classList.remove('show'), duration);
        if (isReward) this.rewardTimer = timer;
        else this.dangerTimer = timer;
    }
};

// --- Game Constants ---
const CONST = {
    LANE_WIDTH: 140, // World units
    LANE_SPEED: 8,   // Lerp speed
    BASE_SPEED: 600, // Forward speed (pixels/sec relative)
    SPAWN_DIST: 2000,
    FOV: 300,
    HOVER_HEIGHT: 50, // How high the UFO floats
    COLORS: {
        SKY_TOP: '#04020d',
        SKY_BOT: '#173744',
        GRID: '#69ffd3',
        ROAD: '#07131b'
    }
};

// --- Game State ---
const State = {
    mode: 'START', // START, PLAY, OVER
    score: 0,
    lives: 3,
    time: 0,
    speed: CONST.BASE_SPEED,
    lastTime: 0,
    spawnTimer: 0,

    player: {
        lane: 0, // -1, 0, 1
        x: 0,    // Current interpolated X
        z: 0
    },

    obstacles: [], // { type, x, z, active }
    particles: []
};

// --- Initialization ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Input Handling ---
function moveLeft() {
    if (State.mode !== 'PLAY') return;
    if (State.player.lane > -1) {
        State.player.lane--;
        AudioSys.play('sfx_move', 0.22, 70);
    }
}

function moveRight() {
    if (State.mode !== 'PLAY') return;
    if (State.player.lane < 1) {
        State.player.lane++;
        AudioSys.play('sfx_move', 0.22, 70);
    }
}

// Bindings
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Touch/Mouse bindings
const bindPress = (id, action) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        action();
        el.style.backgroundColor = 'rgba(113,255,208,0.12)';
    });
    el.addEventListener('pointerup', () => el.style.backgroundColor = '');
    el.addEventListener('pointerleave', () => el.style.backgroundColor = '');
};

bindPress('btn-left', moveLeft);
bindPress('btn-right', moveRight);

// --- Core Game Logic ---
function startGame() {
    AudioSys.init();
    Feedback.init();
    AudioSys.play('sfx_start', 0.42, 120);
    AudioSys.playBGM();

    State.mode = 'PLAY';
    State.score = 0;
    State.lives = 3;
    State.time = 0;
    State.speed = CONST.BASE_SPEED;
    State.spawnTimer = 0;

    State.player.lane = 0;
    State.player.x = 0;

    State.obstacles = [];
    State.particles = [];

    // UI Reset
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');

    updateHUD();

    State.lastTime = performance.now();
    requestAnimationFrame(loop);
}

function gameOver() {
    State.mode = 'OVER';
    AudioSys.stopBGM();
    AudioSys.play('sfx_gameover', 0.5, 120);
    Feedback.pulse('danger', 1400);

    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');

    document.getElementById('final-score').innerText = State.score;
    document.getElementById('final-time').innerText = Math.floor(State.time) + 's';
}

function addScore(amount) {
    const oldScore = State.score;
    State.score += amount;

    // Speed up every 10 points
    if (Math.floor(State.score / 10) > Math.floor(oldScore / 10)) {
        State.speed += 30;
        AudioSys.play('sfx_boost', 0.34, 120);
        Feedback.pulse('reward', 1000);
        showFloatingText('BOOST SYNC!', '#58ffd2');
    }

    updateHUD();
}

function takeDamage() {
    State.lives--;
    AudioSys.play('sfx_hit', 0.48, 120);
    Feedback.pulse('danger', 950);
    shakeScreen();
    updateHUD();

    if (State.lives <= 0) {
        gameOver();
    }
}

// --- Main Loop ---
function loop(timestamp) {
    if (State.mode !== 'PLAY') return;

    const dt = Math.min((timestamp - State.lastTime) / 1000, 0.1);
    State.lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function update(dt) {
    State.time += dt;

    // 1. Player Movement (Lerp)
    const targetX = State.player.lane * CONST.LANE_WIDTH;
    State.player.x += (targetX - State.player.x) * CONST.LANE_SPEED * dt;

    // 2. Spawning
    State.spawnTimer += dt;
    const currentSpawnRate = 2.0 * (CONST.BASE_SPEED / State.speed);

    if (State.spawnTimer > currentSpawnRate) {
        spawnEntity();
        State.spawnTimer = 0;
    }

    // 3. Obstacle Logic
    for (let i = State.obstacles.length - 1; i >= 0; i--) {
        let ob = State.obstacles[i];
        ob.z -= State.speed * dt;

        // Collision Detection (Hitbox)
        if (ob.active && Math.abs(ob.z) < 40) {
            if (Math.abs(ob.x - State.player.x) < 60) {
                handleCollision(ob);
            }
        }

        // Cleanup
        if (ob.z < -200) {
            State.obstacles.splice(i, 1);
        }
    }

    updateParticles(dt);
    updateHUD();
}

function spawnEntity() {
    const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
    const x = lane * CONST.LANE_WIDTH;
    const z = CONST.SPAWN_DIST;

    const type = Math.random() > 0.5 ? 'obstacle' : 'star';

    State.obstacles.push({ type, x, z, active: true, lane });
}

function handleCollision(ob) {
    if (ob.type === 'star') {
        ob.active = false;
        AudioSys.play('sfx_collect', 0.34, 90);
        Feedback.pulse('reward', 700);
        addScore(1);
        spawnParticles(ob.x, 0, '#ffe56b', 10);
    } else if (ob.type === 'obstacle') {
        if (ob.active) {
            ob.active = false;
            takeDamage();
            spawnParticles(ob.x, 0, '#ff4f75', 20);
        }
    }
}

// --- Rendering ---
let shake = 0;
function shakeScreen() { shake = 15; }

function project(x, y, z) {
    const camH = 150;
    const camZ = 200;
    const scale = CONST.FOV / (CONST.FOV + z + camZ);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    return {
        x: cx + x * scale,
        y: cy - (y - camH) * scale * 0.5,
        s: scale
    };
}

function draw() {
    // Shake
    let sx = 0, sy = 0;
    if (shake > 0) {
        sx = (Math.random() - 0.5) * shake;
        sy = (Math.random() - 0.5) * shake;
        shake *= 0.9;
    }

    ctx.save();
    ctx.translate(sx, sy);

    // 1. Background
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, CONST.COLORS.SKY_TOP);
    grad.addColorStop(0.52, CONST.COLORS.SKY_BOT);
    grad.addColorStop(1, '#041512');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const sunY = canvas.height * 0.2;
    const sunGrad = ctx.createRadialGradient(canvas.width * 0.5, sunY, 10, canvas.width * 0.5, sunY, canvas.width * 0.22);
    sunGrad.addColorStop(0, 'rgba(186,255,248,0.9)');
    sunGrad.addColorStop(0.2, 'rgba(105,255,211,0.42)');
    sunGrad.addColorStop(1, 'rgba(105,255,211,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(canvas.width * 0.5, sunY, canvas.width * 0.22, 0, Math.PI * 2);
    ctx.fill();

    // 2. Horizon accents
    const horizonY = canvas.height / 2;
    ctx.strokeStyle = 'rgba(105, 255, 211, 0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    ctx.lineTo(canvas.width, horizonY);
    ctx.stroke();

    for (let i = 0; i < 6; i++) {
        const mountainBase = (i / 5) * canvas.width;
        const peakX = mountainBase + canvas.width * 0.1;
        const peakY = horizonY - (30 + (i % 3) * 18);
        ctx.fillStyle = i % 2 === 0 ? 'rgba(8, 25, 34, 0.9)' : 'rgba(10, 34, 42, 0.84)';
        ctx.beginPath();
        ctx.moveTo(mountainBase - canvas.width * 0.14, horizonY + 1);
        ctx.lineTo(peakX, peakY);
        ctx.lineTo(mountainBase + canvas.width * 0.22, horizonY + 1);
        ctx.closePath();
        ctx.fill();
    }

    // 3. Retro Grid Floor
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, horizonY, canvas.width, canvas.height / 2);
    ctx.clip();

    ctx.strokeStyle = 'rgba(105, 255, 211, 0.18)';
    ctx.lineWidth = 1;

    for (let i = -10; i <= 10; i++) {
        const p1 = project(i * 200, 0, 5000);
        const p2 = project(i * 200, 0, -500);
        ctx.beginPath();
        ctx.moveTo(p1.x, horizonY);
        ctx.lineTo(p2.x, canvas.height);
        ctx.stroke();
    }

    for (let z = 0; z < 18; z++) {
        const depth = ((z * 260) + (State.time * State.speed * 0.55)) % 4600;
        const py = project(0, 0, 4200 - depth).y;
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
        ctx.stroke();
    }

    ctx.restore();

    // 4. Road Surface
    const roadW = CONST.LANE_WIDTH * 2.5;
    const pFarL = project(-roadW, 0, CONST.SPAWN_DIST);
    const pFarR = project(roadW, 0, CONST.SPAWN_DIST);
    const pNearL = project(-roadW, 0, -200);
    const pNearR = project(roadW, 0, -200);

    const roadGrad = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
    roadGrad.addColorStop(0, '#0a1621');
    roadGrad.addColorStop(1, '#03080d');
    ctx.fillStyle = roadGrad;
    ctx.beginPath();
    ctx.moveTo(pFarL.x, horizonY);
    ctx.lineTo(pFarR.x, horizonY);
    ctx.lineTo(pNearR.x, canvas.height);
    ctx.lineTo(pNearL.x, canvas.height);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pFarL.x, horizonY);
    ctx.lineTo(pNearL.x, canvas.height);
    ctx.moveTo(pFarR.x, horizonY);
    ctx.lineTo(pNearR.x, canvas.height);
    ctx.stroke();

    // Road Lines (Glow)
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#69ffd3';
    ctx.strokeStyle = '#69ffd3';
    ctx.lineWidth = 2;

    [-0.5, 0.5].forEach(offset => {
        const lx = offset * CONST.LANE_WIDTH;
        const pf = project(lx, 0, CONST.SPAWN_DIST);
        const pn = project(lx, 0, -200);
        ctx.beginPath();
        ctx.moveTo(pf.x, horizonY);
        ctx.lineTo(pn.x, canvas.height);
        ctx.stroke();
    });
    ctx.shadowBlur = 0;

    // 5. Entities (Sorted by Z)
    const renderList = [...State.obstacles];
    renderList.push({ type: 'player', x: State.player.x, z: 0, active: true });
    renderList.sort((a, b) => b.z - a.z);

    renderList.forEach(ent => {
        if (!ent.active && ent.type !== 'player') return;

        const pShadow = project(ent.x, 0, ent.z);
        const size = 100 * pShadow.s;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(pShadow.x, pShadow.y + size / 4, size / 2, size / 8, 0, 0, Math.PI * 2);
        ctx.fill();

        if (ent.type === 'player') {
            const hoverY = CONST.HOVER_HEIGHT + Math.sin(State.time * 4) * 5;
            const pUFO = project(ent.x, hoverY, ent.z);

            const beamWTop = size * 0.3;
            const beamWBot = size * 0.7;

            const beamGrad = ctx.createLinearGradient(0, pUFO.y, 0, pShadow.y);
            beamGrad.addColorStop(0, 'rgba(110, 255, 224, 0.42)');
            beamGrad.addColorStop(0.6, 'rgba(110, 255, 224, 0.12)');
            beamGrad.addColorStop(1, 'rgba(110, 255, 224, 0)');
            ctx.fillStyle = beamGrad;
            ctx.beginPath();
            ctx.moveTo(pUFO.x - beamWTop, pUFO.y);
            ctx.lineTo(pUFO.x + beamWTop, pUFO.y);
            ctx.lineTo(pShadow.x + beamWBot, pShadow.y);
            ctx.lineTo(pShadow.x - beamWBot, pShadow.y);
            ctx.fill();

            ctx.strokeStyle = 'rgba(184,255,243,0.34)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(pUFO.x, pUFO.y + size * 0.12);
            ctx.lineTo(pUFO.x, pShadow.y - size * 0.04);
            ctx.stroke();

            const img = document.getElementById('asset_ufo');
            const tilt = (State.player.x - (State.player.lane * CONST.LANE_WIDTH)) * -0.1;
            drawSprite(img, pUFO.x, pUFO.y, size, tilt);

        } else if (ent.type === 'obstacle') {
            const p = project(ent.x, 0, ent.z);
            const img = document.getElementById('asset_obstacle');
            drawSprite(img, p.x, p.y, size * 0.82, 0);
        } else if (ent.type === 'star') {
            const bounce = Math.sin(State.time * 5 + ent.z * 0.01) * 10;
            const p = project(ent.x, 20 + bounce, ent.z);
            const img = document.getElementById('asset_star');
            drawSprite(img, p.x, p.y, size * 0.62, State.time * 2);
        }
    });

    // 6. Particles
    drawParticles();

    ctx.restore();
}

function drawSprite(img, x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y - size / 2);
    ctx.rotate(rot);
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
    ctx.restore();
}

// --- Particles ---
function spawnParticles(x, z, color, count) {
    for (let i = 0; i < count; i++) {
        State.particles.push({
            x: x, y: 0, z: z,
            vx: (Math.random() - 0.5) * 200,
            vy: -Math.random() * 200 - 100,
            vz: (Math.random() - 0.5) * 200,
            life: 1,
            color: color
        });
    }
}

function updateParticles(dt) {
    for (let i = State.particles.length - 1; i >= 0; i--) {
        const p = State.particles[i];
        p.life -= dt * 1.5;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt - State.speed * dt;
        p.vy += 500 * dt;

        if (p.y > 0) p.y = 0;

        if (p.life <= 0) State.particles.splice(i, 1);
    }
}

function drawParticles() {
    State.particles.forEach(pt => {
        const p = project(pt.x, pt.y, pt.z);
        const s = 15 * p.s * pt.life;
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.shadowBlur = 14;
        ctx.shadowColor = pt.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, s), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    });
}

// --- UI Helpers ---
function updateHUD() {
    document.getElementById('score-display').innerText = State.score;
    document.getElementById('time-display').innerText = Math.floor(State.time) + 's';

    const lc = document.getElementById('lives-container');
    lc.innerHTML = '';
    for (let i = 0; i < 3; i++) {
        const heart = document.createElement('span');
        heart.innerText = i < State.lives ? '🟢' : '⚫';
        heart.style.fontSize = '24px';
        heart.style.lineHeight = '1';
        heart.style.filter = i < State.lives ? 'drop-shadow(0 0 8px rgba(105,255,211,0.55))' : 'none';
        heart.style.opacity = i < State.lives ? '1' : '0.45';
        lc.appendChild(heart);
    }
}

function showFloatingText(text, color) {
    const el = document.getElementById('score-display').parentElement;
    el.style.background = `linear-gradient(180deg, ${color}, rgba(4, 14, 20, 0.9))`;
    setTimeout(() => {
        el.style.background = '';
    }, 200);
}
</script>
