<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Cab: Letter Run</title>
    <style>
        @import url('./assets/fonts.googleapis.com/css2-family_Fredoka_wght_400_700_family_Teko_wght_600_display_swap.css');
        :root {
            --bg-top: #07111f;
            --bg-bottom: #120718;
            --panel: rgba(11, 22, 37, 0.78);
            --panel-strong: rgba(14, 28, 48, 0.92);
            --line: rgba(129, 242, 255, 0.34);
            --cyan: #81f2ff;
            --cyan-strong: #35cfff;
            --magenta: #ff4fd8;
            --gold: #ffd65c;
            --ink: #02060d;
            --text: #f3fbff;
            --muted: rgba(214, 237, 255, 0.74);
            --danger: #ff5f6d;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(53, 207, 255, 0.18), transparent 28%),
                radial-gradient(circle at 50% 100%, rgba(255, 79, 216, 0.12), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Fredoka', system-ui, sans-serif;
        }
        body { color: var(--text); }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(129, 242, 255, 0.08), transparent 18%, transparent 82%, rgba(255, 79, 216, 0.08)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px);
            opacity: 0.45;
            mix-blend-mode: screen;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        .hidden { display: none !important; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .transition-opacity { transition: opacity 0.3s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .glass {
            background: linear-gradient(180deg, rgba(12, 29, 48, 0.86), rgba(8, 16, 29, 0.78));
            backdrop-filter: blur(12px);

        }
        .hud-label {
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.32em;
            margin-top: 0.35rem;
        }
        .hud-card {
            padding: 0.72rem 0.95rem;
            border-radius: 1rem;
            color: var(--text);
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 6.5rem;

        .hud-mini { font-size: 0.7rem; text-transform: uppercase; opacity: 0.76; letter-spacing: 0.2em; }
        .hud-accent {

            color: var(--gold);
            font-weight: 600;
            font-family: 'Teko', sans-serif;

        }
        .overlay { background: rgba(3, 9, 17, 0.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .panel {
            padding: 1.7rem;
            border-radius: 1.5rem;
            text-align: center;
            border: 1px solid rgba(129, 242, 255, 0.28);
            width: min(100%, 25rem);
            margin: 1rem;
            box-shadow: 0 20px 45px rgba(0,0,0,0.45), 0 0 24px rgba(53, 207, 255, 0.12);
            background:
                radial-gradient(circle at top, rgba(53, 207, 255, 0.12), transparent 38%),

        }
        .status-title {
            font-size: clamp(2.6rem, 11vw, 4.1rem);
            font-weight: 400;
            margin: 0 0 0.5rem;
            line-height: 0.92;
            letter-spacing: 0.05em;
            font-family: 'Teko', sans-serif;
        }
        .status-title-danger { color: var(--danger); text-shadow: 0 0 12px rgba(255, 95, 109, 0.35); }
        .summary-wrap { padding: 1.2rem 0; }
        .summary-label { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.28em; margin-bottom: 0.3rem; }
        .summary-score {
            font-size: clamp(3.2rem, 13vw, 5rem);
            font-weight: 400;
            color: var(--gold);
            font-family: 'Teko', sans-serif;
            text-shadow: 0 0 12px rgba(255, 214, 92, 0.36);
        }
        .primary-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--gold), #ff9d42);
            color: var(--ink);
            border: none;
            font-weight: 700;
            padding: 0.95rem;
            border-radius: 0.9rem;
            font-size: clamp(1.05rem, 4.8vw, 1.45rem);
            font-family: 'Teko', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 16px rgba(255, 214, 92, 0.2);
            transform: scale(1);
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }
        .primary-btn:hover { filter: brightness(1.06); box-shadow: 0 12px 28px rgba(0,0,0,0.32), 0 0 20px rgba(255, 214, 92, 0.3); }
        .primary-btn:active { transform: scale(0.97); }
        .briefing {
            max-width: min(34rem, calc(100% - 3rem));
            margin: 1.15rem auto 0;
            padding: 0.95rem 1rem;
            border-radius: 1rem;
            background:
                linear-gradient(180deg, rgba(7, 17, 30, 0.84), rgba(10, 20, 36, 0.7));
            border: 1px solid rgba(129, 242, 255, 0.18);
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        }
        .briefing-kicker {
            display: block;
            color: var(--magenta);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.34em;
            margin-bottom: 0.38rem;
        }
        .briefing-title {
            margin: 0;
            font-size: clamp(1.45rem, 5vw, 2.1rem);
            line-height: 1.05;
            font-family: 'Teko', sans-serif;
            color: var(--text);
        }
        .briefing-copy { margin: 0.45rem 0 0; color: var(--muted); font-size: 0.95rem; line-height: 1.28; }
        #ui-layer { pointer-events: none; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); box-sizing: border-box; }
        #ui-layer > * { pointer-events: auto; }
        #feedback-stack {
            right: max(0.9rem, env(safe-area-inset-right));
            bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 1rem);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6rem;
            pointer-events: none;
        }
        .feedback-gif {
            width: clamp(4.2rem, 18vw, 6rem);
            height: clamp(4.2rem, 18vw, 6rem);
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(129, 242, 255, 0.28);
            background: rgba(2, 6, 13, 0.58);
            box-shadow: 0 10px 20px rgba(0,0,0,0.35), 0 0 18px rgba(53, 207, 255, 0.16);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .feedback-gif.is-visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>

<!-- Assets -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: title/ui/gameover/collect/crash -> catalogs/audios.json -->
    <!-- Approved catalog-backed audio mappings -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Pickup SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_crash" data-editable="audio" data-label="Impact SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3" preload="auto"></audio>
    <audio id="sfx_horn" data-editable="audio" data-label="Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>

    <audio id="sfx_game_over" data-editable="audio" data-label="Game Over SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between">
        <div id="hud" class="flex justify-between items-start w-full transition-opacity duration-300">
            <div class="flex flex-col">
                <div class="hud-score">
                    <span id="score-display">0</span>
                </div>
                <div class="hud-label">Route Score</div>
            </div>
            <div class="glass hud-card">
                <span class="hud-mini">Last Letter</span>

            </div>
        </div>

        <div id="briefing" class="briefing">
            <span class="briefing-kicker">Night Dispatch</span>
            <h1 class="briefing-title">Signal Cab: Letter Run</h1>
            <p class="briefing-copy">Drag left or right to weave through traffic and snag letter tokens for extra route score.</p>
            <!-- [agent-note][stage1] role: future-audio | trigger: first-seconds | intent: support the dispatch intro without changing controls -->
        </div>

        <div id="feedback-stack" class="absolute z-50">
            <!-- [agent-note][stage3] resolved-gif: collect/crash reactions -> catalogs/gifs.json -->
            <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
            <img id="pickup-gif" class="feedback-gif hidden" alt="Pickup reaction" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp">
            <img id="crash-gif" class="feedback-gif hidden" alt="Crash reaction" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
        </div>

        <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center overlay hidden">
            <div id="game-over-panel" class="glass panel">
                <h2 class="status-title status-title-danger">ROUTE LOST</h2>
                <div class="summary-wrap">
                    <p class="summary-label">Route Score</p>
                    <p class="summary-score"><span id="final-score">0</span></p>
                </div>
                <p class="briefing-copy" style="margin: 0 0 1.25rem;">Traffic sealed the lane. Restart the run and keep the signal moving.</p>
                <button id="restart-btn" class="primary-btn">
                    RESTART RUN
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * AUDIO SYSTEM (Web Audio API - Zero DOM Overhead)
 */
const AudioSys = (() => {
    let ctx = null;
    const buffers = {};
    let isMuted = false;
    const cooldowns = new Map();
    let bgmStarted = false;

    const loadBuffer = (id) => {
        const el = document.getElementById(id);
        if (!ctx || !el || !el.src) return;
        fetch(el.src)
            .then(res => res.arrayBuffer())
            .then(data => ctx.decodeAudioData(data))
            .then(buffer => { buffers[id] = buffer; })
            .catch(() => {});
    };

    const init = () => {
        if (ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        ctx = new AudioContext();

        ['sfx_crash', 'sfx_collect', 'sfx_horn', 'sfx_start', 'sfx_restart', 'sfx_game_over'].forEach(loadBuffer);

        const bgmEl = document.getElementById('bgm_main');
        if (bgmEl) {
            bgmEl.volume = 0.2;
        }

        document.addEventListener('visibilitychange', () => {
            if (!bgmEl) return;
            if (document.hidden) {
                bgmEl.pause();
            } else if (bgmStarted && !isMuted) {
                bgmEl.play().catch(() => {});
            }
        });
    };

    const unlock = () => {
        if (!ctx) init();
        if (ctx && ctx.state === 'suspended') ctx.resume();
        const bgmEl = document.getElementById('bgm_main');
        if (bgmEl && !bgmStarted) {
            bgmStarted = true;
            bgmEl.play().catch(() => {});
        }
    };

    const playSfx = (id, options = {}) => {
        if (!ctx || isMuted) return;
        const now = performance.now();
        const cooldown = options.cooldown ?? 0;
        if (cooldown && cooldowns.has(id) && now - cooldowns.get(id) < cooldown) return;
        cooldowns.set(id, now);

        if (buffers[id]) {
            const source = ctx.createBufferSource();
            const gain = ctx.createGain();
            source.buffer = buffers[id];
            source.connect(gain);
            gain.connect(ctx.destination);

            const volume = options.volume ?? (
                id === 'sfx_crash' ? 0.5 :
                id === 'sfx_horn' ? 0.18 :
                id === 'sfx_game_over' ? 0.42 :
                0.24
            );
            gain.gain.value = volume;

            if (id === 'sfx_collect') {
                source.playbackRate.value = 0.94 + Math.random() * 0.12;
            } else if (id === 'sfx_horn') {
                source.playbackRate.value = 0.92 + Math.random() * 0.16;
            }

            source.start(0);
        } else {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (id === 'sfx_crash' || id === 'sfx_game_over') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(18, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.36, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } else if (id === 'sfx_horn' || id === 'sfx_restart') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(250, ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.18);
                osc.start();
                osc.stop(ctx.currentTime + 0.18);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(780, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1180, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.22, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            }
        }
    };

    const setBgmPaused = (paused) => {
        const bgmEl = document.getElementById('bgm_main');
        if (!bgmEl) return;
        if (paused) {
            bgmEl.pause();
        } else if (bgmStarted && !isMuted) {
            bgmEl.play().catch(() => {});
        }
    };

    const vibrate = (type) => {
        if (!window.navigator) return;
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate',
                requestId: 'h5-' + Date.now(),
                version: '1.0',
                params: { style: type }
            });
        } else if (navigator.vibrate) {
            navigator.vibrate(type === 'heavy' ? 200 : 50);
        }
    };

    return { init, unlock, playSfx, setBgmPaused, vibrate };
})();

/**
 * GAME ENGINE
 */
const Game = (() => {
    // DOM
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const finalScoreDisplay = document.getElementById('final-score');
    const lastCoinDisplay = document.getElementById('last-coin-display');
    const pickupGif = document.getElementById('pickup-gif');
    const crashGif = document.getElementById('crash-gif');

    // Config
    let config = {};
    let dpr = 1;
    let cw = 0, ch = 0;
    let initialized = false;
    let gameState = 'IDLE'; // IDLE, PLAYING, GAMEOVER

    // State
    let score = 0;
    let speed = 0;
    let laneWidth = 0;
    let gameTime = 0;
    let spawnTimer = 0;
    
    // Entities
    let player = { x: 0, y: 0, w: 0, h: 0, targetX: 0, tilt: 0 };
    let enemies = []; // Cars and Houses
    let coins = []; // Alphabet coins
    let particles = [];
    let roadOffset = 0;
    let shakeIntensity = 0;
    let pickupFlashUntil = 0;
    let crashFlashUntil = 0;

    // Assets & Constants
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const CAR_COLORS = [
        '#FF4444', // Red
        '#4488FF', // Blue
        '#44FF88', // Green
        '#FFFF44', // Yellow
        '#FF44FF', // Magenta
        '#44FFFF', // Cyan
        '#FF8800', // Orange
        '#8844FF', // Purple
        '#FF0055', // Hot Pink
        '#00FFCC'  // Teal
    ];

    // Input
    let isDragging = false;
    let dragStartX = 0;
    let playerStartX = 0;

    // Helpers
    const rand = (min, max) => Math.random() * (max - min) + min;
    const toggleFeedbackGif = (el, duration = 900) => {
        if (!el) return;
        el.classList.remove('hidden');
        el.classList.add('is-visible');
        window.clearTimeout(el._feedbackTimeout);
        el._feedbackTimeout = window.setTimeout(() => {
            el.classList.remove('is-visible');
            window.setTimeout(() => el.classList.add('hidden'), 180);
        }, duration);
    };
    
    // Config Parser
    const parseConfig = () => {
        try {
            const raw = JSON.parse(document.getElementById('game-config').textContent);
            config = Object.fromEntries(Object.entries(raw).map(([k, v]) => [k, v.value]));
            window.gameConfigDefs = raw;
            window.gameConfig = config;
        } catch (e) {
            console.error("Config Parse Error", e);
            config = { baseSpeed: 600, heroColor: '#FFD700', laneCount: 4 };
        }
    };

    // Initialization
    const initGame = () => {
        if (initialized) return;
        resetGameLogic();
        initialized = true;
        gameState = 'PLAYING';
        AudioSys.unlock();
        AudioSys.setBgmPaused(false);
        AudioSys.playSfx('sfx_start', { cooldown: 600, volume: 0.22 });
        requestAnimationFrame(loop);
    };

    const resetGameLogic = () => {
        score = 0;
        speed = config.baseSpeed;
        gameTime = 0;
        spawnTimer = 0;
        enemies = [];
        coins = [];
        particles = [];
        shakeIntensity = 0;
        pickupFlashUntil = 0;
        crashFlashUntil = 0;
        
        // Player Setup
        const pWidth = cw * 0.12;
        const pHeight = pWidth * 1.8;
        player = {
            x: cw / 2,
            y: ch - pHeight - (ch * 0.1),
            w: pWidth,
            h: pHeight,
            targetX: cw / 2,
            tilt: 0
        };
        
        laneWidth = cw / config.laneCount;
        
        // UI
        scoreDisplay.textContent = '0';
        lastCoinDisplay.textContent = '-';
        gameOverScreen.classList.add('hidden');
        hud.style.opacity = '1';
    };

    const resize = () => {
        const rect = canvas.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        cw = rect.width;
        ch = rect.height;
        
        laneWidth = cw / config.laneCount;

        if (!initialized) {
            initGame();
        } else {
            // Clamp player
            player.x = Math.max(player.w / 2, Math.min(cw - player.w / 2, player.x));
            player.y = ch - player.h - (ch * 0.1);
        }
    };

    // Input Handling
    const handleInput = (e) => {
        if (e.cancelable) e.preventDefault();
        AudioSys.unlock();
        
        if (gameState === 'GAMEOVER') return;

        const clientX = e.clientX - canvas.getBoundingClientRect().left;

        if (e.type === 'pointerdown') {
            isDragging = true;
            dragStartX = clientX;
            playerStartX = player.x;
        } else if (e.type === 'pointermove' && isDragging) {
            const delta = clientX - dragStartX;
            player.targetX = playerStartX + delta * 1.5; // Sensitivity
        } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
            isDragging = false;
        }
    };

    const restartGame = () => {
        resetGameLogic();
        gameState = 'PLAYING';
        AudioSys.unlock();
        AudioSys.setBgmPaused(false);
        AudioSys.playSfx('sfx_restart', { cooldown: 250, volume: 0.18 });
    };

    // Game Logic
    const spawnWave = () => {
        // Determine number of cars to spawn (1 to laneCount - 1) to ensure at least one path
        // Difficulty increases density
        const difficulty = Math.min(score / 15000, 1);
        const maxDensity = Math.max(1, Math.floor(config.laneCount - 1));
        
        // Chance to spawn more cars increases with difficulty
        let count = 1;
        if (Math.random() < difficulty * 0.8) {
            count = Math.floor(rand(1, maxDensity + 0.9));
        }

        // Pick random lanes
        const lanes = Array.from({ length: config.laneCount }, (_, i) => i);
        // Shuffle
        for (let i = lanes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
        }
        
        const spawnLanes = lanes.slice(0, count);

        spawnLanes.forEach(lane => {
            const type = Math.random() > 0.15 ? 'car' : 'house'; // Mostly cars
            
            let finalLane = lane;
            // Houses only on edges
            if (type === 'house') {
                if (lane !== 0 && lane !== config.laneCount - 1) return; // Skip if not edge
            }

            const eW = type === 'house' ? laneWidth * 0.8 : laneWidth * 0.6;
            const eH = type === 'house' ? eW : eW * 1.8;
            
            // Check vertical overlap with existing enemies in this lane
            const xPos = (finalLane * laneWidth) + (laneWidth / 2);
            const tooClose = enemies.some(e => Math.abs(e.y - (-eH - 50)) < 250 && Math.abs(e.x - xPos) < 10);
            
            if (!tooClose) {
                const color = type === 'house' ? '#44FF88' : CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
                
                enemies.push({
                    x: xPos,
                    y: -eH - 50,
                    w: eW,
                    h: eH,
                    type: type,
                    speed: type === 'car' ? speed * rand(0.5, 0.85) : 0,
                    color: color
                });

                // Horn sound occasionally
                if (type === 'car' && Math.random() < 0.1) {
                    AudioSys.playSfx('sfx_horn', { cooldown: 1400, volume: 0.14 });
                }
            }
        });
    };

    const spawnCoin = () => {
        if (Math.random() < 0.03) {
            const lane = Math.floor(Math.random() * config.laneCount);
            const cx = (lane * laneWidth) + (laneWidth / 2);
            const cy = -100;
            const size = laneWidth * 0.3;

            // Check overlap with enemies
            let overlap = false;
            for (let e of enemies) {
                if (Math.abs(e.y - cy) < 200 && Math.abs(e.x - cx) < laneWidth) {
                    overlap = true;
                    break;
                }
            }
            // Check overlap with other coins
            for (let c of coins) {
                if (Math.abs(c.y - cy) < 100 && Math.abs(c.x - cx) < laneWidth) {
                    overlap = true;
                    break;
                }
            }

            if (!overlap) {
                coins.push({
                    x: cx,
                    y: cy,
                    w: size,
                    char: ALPHABET[Math.floor(Math.random() * ALPHABET.length)],
                    collected: false,
                    osc: Math.random() * Math.PI
                });
            }
        }
    };

    const update = (dt) => {
        if (gameState !== 'PLAYING') return;

        gameTime += dt;
        
        // Difficulty ramp
        speed = config.baseSpeed + (gameTime * 25);
        
        // Player Movement
        player.x += (player.targetX - player.x) * 12 * dt;
        
        // Clamp
        const margin = player.w / 2;
        if (player.x < margin) player.x = margin;
        if (player.x > cw - margin) player.x = cw - margin;
        player.tilt = (player.targetX - player.x) * 0.08;

        // Road Scroll
        roadOffset += speed * dt;
        if (roadOffset > 100) roadOffset = 0;

        // Shake decay
        if (shakeIntensity > 0) {
            shakeIntensity -= dt * 30;
            if (shakeIntensity < 0) shakeIntensity = 0;
        }

        // Spawning Logic
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            spawnWave();
            // Calculate next spawn time
            // Starts at 0.8s, drops to 0.3s
            const difficulty = Math.min(score / 20000, 1);
            spawnTimer = 0.8 - (difficulty * 0.5);
            spawnTimer = Math.max(0.3, spawnTimer);
        }

        spawnCoin();

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            const relativeSpeed = speed - (e.speed || 0);
            e.y += relativeSpeed * dt;

            // Collision AABB
            if (Math.abs(player.x - e.x) < (player.w / 2 + e.w / 2) * 0.75 &&
                Math.abs(player.y - e.y) < (player.h / 2 + e.h / 2) * 0.75) {
                
                AudioSys.playSfx('sfx_crash', { cooldown: 800, volume: 0.5 });
                AudioSys.playSfx('sfx_game_over', { cooldown: 1000, volume: 0.34 });
                AudioSys.setBgmPaused(true);
                AudioSys.vibrate('heavy');
                shakeIntensity = 30;
                crashFlashUntil = performance.now() + 1400;
                toggleFeedbackGif(crashGif, 1400);
                createParticles(player.x, player.y, 50, config.heroColor);
                gameState = 'GAMEOVER';
                finalScoreDisplay.textContent = Math.floor(score);
                hud.style.opacity = '0';
                gameOverScreen.classList.remove('hidden');
            }

            if (e.y > ch + 100) enemies.splice(i, 1);
        }

        // Update Coins
        for (let i = coins.length - 1; i >= 0; i--) {
            const c = coins[i];
            c.y += speed * dt;
            c.osc += dt * 5;

            // Collision Circle-Rect approx
            const dx = player.x - c.x;
            const dy = player.y - c.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (!c.collected && dist < (player.w / 2 + c.w / 2)) {
                c.collected = true;
                score += 100;
                scoreDisplay.textContent = Math.floor(score);
                lastCoinDisplay.textContent = c.char;
                
                AudioSys.playSfx('sfx_collect', { cooldown: 70, volume: 0.22 });
                AudioSys.vibrate('light');
                pickupFlashUntil = performance.now() + 900;
                toggleFeedbackGif(pickupGif, 900);
                
                // Floating Text Particle
                particles.push({
                    x: c.x, y: c.y, vx: 0, vy: -150,
                    life: 1.0, color: '#FFD700', text: c.char, size: 36
                });
                
                coins.splice(i, 1);
            } else if (c.y > ch + 50) {
                coins.splice(i, 1);
            }
        }

        updateParticles(dt);
        
        // Exhaust
        if (gameTime % 0.08 < dt) {
            createParticles(player.x, player.y + player.h / 2, 1, '#fff', 0.4);
        }
    };

    const createParticles = (x, y, count, color, lifeScale = 1) => {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 350,
                vy: (Math.random() - 0.5) * 350 + (speed * 0.5),
                life: 1.0 * lifeScale,
                color: color,
                size: Math.random() * 6 + 2,
                text: null
            });
        }
    };

    const updateParticles = (dt) => {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            
            if (!p.text) p.y += speed * dt; // Debris moves with world
            
            p.life -= dt * (p.text ? 1.8 : 2.5);
            if (p.life <= 0) particles.splice(i, 1);
        }
    };

    // Drawing
    const draw = () => {
        // Background
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, cw, ch);

        // Shake
        if (shakeIntensity > 0) {
            const sx = (Math.random() - 0.5) * shakeIntensity;
            const sy = (Math.random() - 0.5) * shakeIntensity;
            ctx.save();
            ctx.translate(sx, sy);
        }

        // Road Markings
        ctx.fillStyle = '#444';
        ctx.beginPath();
        for (let i = 1; i < config.laneCount; i++) {
            const x = i * laneWidth;
            const dashH = 40;
            const total = 80;
            const offset = roadOffset % total;
            
            for (let y = -total; y < ch + total; y += total) {
                ctx.rect(x - 2, y + offset, 4, dashH);
            }
        }
        ctx.fill();

        // Coins
        coins.forEach(c => {
            const scale = 1 + Math.sin(c.osc) * 0.1;
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(scale, scale);
            
            // Outer Glow
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 15;
            
            // Letter token body
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, c.w / 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Inner Rim
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Text
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#B8860B';
             ctx.font = `700 ${c.w * 0.42}px Teko`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(c.char, 0, 2);
            
            ctx.restore();
        });

        // Enemies
        enemies.forEach(e => {
            ctx.save();
            ctx.translate(e.x, e.y);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-e.w / 2 + 5, -e.h / 2 + 5, e.w, e.h);

            // Body
            ctx.fillStyle = e.color;
            if (e.type === 'house') {
                ctx.fillRect(-e.w / 2, -e.h / 2, e.w, e.h);
                // Roof
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.moveTo(-e.w / 2, -e.h / 2);
                ctx.lineTo(0, -e.h / 2 - 10);
                ctx.lineTo(e.w / 2, -e.h / 2);
                ctx.fill();
                // Windows
                ctx.fillStyle = '#FFD';
                ctx.fillRect(-e.w / 4, -e.h / 4, e.w / 2, e.w / 2);
            } else {
                // Car Body
                ctx.beginPath();
                ctx.roundRect(-e.w / 2, -e.h / 2, e.w, e.h, 4);
                ctx.fill();
                
                // Windshield
                ctx.fillStyle = '#111';
                ctx.fillRect(-e.w / 2 + 2, -e.h / 4, e.w - 4, e.h / 5);
                
                // Headlights
                ctx.fillStyle = '#FF0';
                ctx.shadowColor = '#FF0';
                ctx.shadowBlur = 10;
                ctx.fillRect(-e.w / 2 + 2, e.h / 2 - 4, 6, 4);
                ctx.fillRect(e.w / 2 - 8, e.h / 2 - 4, 6, 4);
                ctx.shadowBlur = 0;

                // Roof Detail
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(-e.w / 2 + 4, -e.h / 2 + 4, e.w - 8, e.h * 0.6);
            }
            ctx.restore();
        });

        // Player
        if (gameState === 'PLAYING' || (gameState === 'GAMEOVER' && Math.floor(Date.now() / 100) % 2 === 0)) {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.tilt);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-player.w / 2 + 5, -player.h / 2 + 5, player.w, player.h);

            // Body
            ctx.fillStyle = config.heroColor;
            ctx.beginPath();
            ctx.roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 5);
            ctx.fill();

            // Cab stripe markers
            ctx.fillStyle = '#000';
            const checkSize = player.w / 4;
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(-player.w / 2 + (i * checkSize), -player.h / 2, checkSize, checkSize / 2);
                ctx.fillRect(-player.w / 2 + (i * checkSize), player.h / 2 - checkSize / 2, checkSize, checkSize / 2);
            }

            // Roof light
            ctx.fillStyle = '#FFF';
            ctx.fillRect(-player.w / 4, -player.h / 6, player.w / 2, player.h / 6);
            ctx.fillStyle = '#000';
             ctx.font = '700 10px Fredoka';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CAB', 0, -player.h / 12);

            // Windshield
            ctx.fillStyle = '#222';
            ctx.fillRect(-player.w / 2 + 2, -player.h / 2 + checkSize, player.w - 4, player.h / 4);

            ctx.restore();
        }

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            if (p.text) {
                // Text Particle
                ctx.save();
                ctx.translate(p.x, p.y);
                const s = 1 + (1 - p.life);
                ctx.scale(s, s);
                ctx.fillStyle = p.color;
                ctx.font = `700 ${p.size}px Teko`;
                ctx.textAlign = 'center';
                ctx.fillText(p.text, 0, 0);
                ctx.restore();
            } else {
                // Dot Particle
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        });
        ctx.globalAlpha = 1.0;

        if (pickupFlashUntil > performance.now()) {
            ctx.save();
            ctx.fillStyle = 'rgba(255, 214, 92, 0.08)';
            ctx.fillRect(0, 0, cw, ch);
            ctx.restore();
        }

        if (crashFlashUntil > performance.now()) {
            ctx.save();
            ctx.fillStyle = 'rgba(255, 95, 109, 0.14)';
            ctx.fillRect(0, 0, cw, ch);
            ctx.restore();
        }

        // Speed Lines
        if (speed > 800) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${(speed - 800) / 2000})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const lx = Math.random() * cw;
                const ly = Math.random() * ch;
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx, ly + 80);
            }
            ctx.stroke();
        }

        if (shakeIntensity > 0) ctx.restore();
    };

    const loop = (timestamp) => {
        if (!initialized) return;
        
        const dt = Math.min((timestamp - (window.lastTime || timestamp)) / 1000, 0.05);
        window.lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(loop);
    };

    // Setup
    window.addEventListener('DOMContentLoaded', () => {
        parseConfig();
        AudioSys.init();
        
        const ro = new ResizeObserver(() => {
            resize();
        });
        ro.observe(canvas);

        // Input
        // [agent-note][stage4] repaired: mobile-action-risk | element: canvas input | action: scoped pointer suppression away from global window listeners
        canvas.addEventListener('pointerdown', handleInput, { passive: false });
        canvas.addEventListener('pointermove', handleInput, { passive: false });
        canvas.addEventListener('pointerup', handleInput, { passive: false });
        canvas.addEventListener('pointercancel', handleInput, { passive: false });
        
        document.getElementById('restart-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            restartGame();
        });
    });

})();
</script>
