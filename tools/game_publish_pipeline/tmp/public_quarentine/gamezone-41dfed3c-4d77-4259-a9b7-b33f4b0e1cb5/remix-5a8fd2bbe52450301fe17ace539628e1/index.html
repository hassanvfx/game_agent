<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Route</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide ui=Rajdhani accent=Press Start 2P via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-void: #090d1f;
            --sky-panel: rgba(12, 18, 40, 0.86);
            --sky-panel-strong: rgba(22, 30, 58, 0.94);
            --sky-line: rgba(136, 214, 255, 0.34);
            --sky-glow: rgba(95, 214, 255, 0.24);
            --sky-gold: #fee761;
            --sky-mint: #63c74d;
            --sky-cyan: #6de7ff;
            --sky-violet: #6c7cff;
            --sky-pink: #ff6bb7;
            --text-main: #eff8ff;
            --text-soft: rgba(239, 248, 255, 0.78);
            --font-display: 'Audiowide', system-ui, sans-serif;
            --font-ui: 'Rajdhani', system-ui, sans-serif;
            --font-accent: 'Press Start 2P', monospace;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; 
            background:
                radial-gradient(circle at top, rgba(91, 192, 255, 0.22), transparent 32%),
                linear-gradient(180deg, #10162f 0%, #090d1f 100%);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-ui);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 0%, rgba(109, 231, 255, 0.14), transparent 30%),
                linear-gradient(180deg, #060810, #04050a);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 0 49.4%, rgba(255,255,255,0.035) 49.5% 50.5%, transparent 50.6% 100%),
                linear-gradient(transparent 0 94%, rgba(109, 231, 255, 0.08) 100%);
            background-size: 100% 100%, 100% 20px;
            pointer-events: none;
            opacity: 0.35;
            z-index: 0;
        }

        canvas { 
            display: block;
            image-rendering: pixelated; 
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: none;
            position: relative;
            z-index: 1;
            filter: saturate(1.08) contrast(1.04);
        }

        .pixel-panel {
            background:
                linear-gradient(180deg, rgba(25, 37, 72, 0.96), rgba(10, 15, 30, 0.96)),
                rgba(26, 28, 44, 0.95);
            border: 2px solid rgba(109, 231, 255, 0.7);
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.06) inset,
                0 0 20px rgba(99, 199, 77, 0.18),
                0 0 32px rgba(95, 214, 255, 0.2),
                inset 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
            color: var(--sky-gold);
            position: relative;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        .pixel-panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            pointer-events: none;
        }
        
        .pixel-panel.editor-ui {
            border-color: #3b5dc9;
            box-shadow: 0 0 10px rgba(59, 93, 201, 0.4);
            background: rgba(26, 28, 44, 0.9);
        }

        .pixel-btn {
            background: linear-gradient(180deg, #7ef16b, #45a95d);
            border: 2px solid #dfffd7;
            color: #09111c;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #21623d, 0 5px 10px rgba(0,0,0,0.4), 0 0 16px rgba(99, 199, 77, 0.2);
            transition: transform 0.05s, box-shadow 0.05s, filter 0.1s;
            position: relative;
            pointer-events: auto;
            letter-spacing: 0.08em;
        }
        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2a5d34;
        }
        
        .pixel-btn-secondary {
            background: linear-gradient(180deg, #5d8eff, #4056c8);
            box-shadow: 0 4px 0 #283786, 0 5px 10px rgba(0,0,0,0.4), 0 0 16px rgba(92, 125, 255, 0.22);
            color: white;
            pointer-events: auto;
        }
        .pixel-btn-secondary:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e326e;
        }

        .pixel-btn-tool {
            background: #2a2c3c;
            border: 2px solid #555;
            color: #aaa;
            box-shadow: 0 2px 0 #111;
            pointer-events: auto;
            transition: all 0.1s;
        }
        .pixel-btn-tool.selected {
            background: #3b5dc9;
            border-color: #fee761;
            color: #fff;
            box-shadow: 0 2px 0 #1e326e;
            transform: scale(1.1);
        }
        .pixel-btn-tool.erase-active {
            background: #b13e53;
            border-color: #ffcccc;
            color: #fff;
        }

        .control-btn {
            background: radial-gradient(circle at 30% 30%, rgba(125, 227, 255, 0.28), rgba(255, 255, 255, 0.08));
            border: 2px solid rgba(180, 241, 255, 0.34);
            border-radius: 50%;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            transition: all 0.1s;
            touch-action: none;
            pointer-events: auto;
            box-shadow: inset 0 0 18px rgba(255,255,255,0.06), 0 0 18px rgba(95, 214, 255, 0.12);
        }
        .control-btn:active, .control-btn.pressed {
            background: rgba(99, 199, 77, 0.5);
            border-color: #fee761;
            transform: scale(0.95);
        }

        .text-glow { text-shadow: 2px 2px 0px #000, 0 0 15px rgba(254, 231, 97, 0.8); }
        .font-pixel { font-family: var(--font-accent); }
        .font-ui { font-family: var(--font-ui); }
        .font-display { font-family: var(--font-display); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .palette-item {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            border: 2px solid #444;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #aaa;
            cursor: pointer;
            pointer-events: auto;
        }
        .palette-item.selected {
            border-color: #fee761;
            background: #3b5dc9;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(254, 231, 97, 0.5);
        }
        .palette-preview {
            width: 30px;
            height: 10px;
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* UI Overlays */
        #ui-layer { pointer-events: none; }
        .pointer-auto { pointer-events: auto; }
        
        #danger-vignette {
            background: radial-gradient(circle, transparent 40%, rgba(200, 0, 0, 0.2) 80%, rgba(255, 0, 0, 0.5) 100%);
            opacity: 0;
            transition: opacity 0.2s;
            mix-blend-mode: multiply;
        }

        .absolute { position: absolute; }
        .relative { position: relative; }
        .inset-0 { inset: 0; }
        .inset-x-0 { left: 0; right: 0; }
        .top-4 { top: 1rem; }
        .right-4 { right: 1rem; }
        .bottom-4 { bottom: 1rem; }
        .z-0 { z-index: 0; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .z-50 { z-index: 50; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-grow { flex: 1 1 auto; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .w-full { width: 100%; }
        .w-12 { width: 3rem; }
        .w-14 { width: 3.5rem; }
        .w-20 { width: 5rem; }
        .w-24 { width: 6rem; }
        .w-28 { width: 7rem; }
        .h-12 { height: 3rem; }
        .h-14 { height: 3.5rem; }
        .h-20 { height: 5rem; }
        .h-24 { height: 6rem; }
        .max-w-sm { max-width: 24rem; }
        .max-h-\[85vh\] { max-height: 85vh; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mx-6 { margin-left: 1.5rem; margin-right: 1.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-2 { padding-bottom: 0.5rem; }
        .pb-8 { padding-bottom: 2rem; }
        .pr-1 { padding-right: 0.25rem; }
        .rounded { border-radius: 0.5rem; }
        .rounded-lg { border-radius: 1rem; }
        .rounded-full { border-radius: 999px; }
        .border { border-width: 1px; border-style: solid; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-b-2 { border-bottom-width: 2px; border-bottom-style: solid; }
        .border-t-2 { border-top-width: 2px; border-top-style: solid; }
        .border-white\/10 { border-color: rgba(255,255,255,0.1); }
        .border-white\/20 { border-color: rgba(255,255,255,0.2); }
        .border-white\/30 { border-color: rgba(255,255,255,0.3); }
        .border-green-300\/40 { border-color: rgba(134, 239, 172, 0.4); }
        .bg-black\/30 { background-color: rgba(0,0,0,0.3); }
        .bg-black\/40 { background-color: rgba(0,0,0,0.4); }
        .bg-black\/60 { background-color: rgba(0,0,0,0.6); }
        .bg-black\/80 { background-color: rgba(0,0,0,0.8); }
        .bg-black\/90 { background-color: rgba(0,0,0,0.9); }
        .bg-red-800 { background-color: #991b1b; }
        .bg-gray-800 { background: linear-gradient(180deg, rgba(23,32,60,0.96), rgba(10,14,28,0.96)); }
        .bg-green-500\/20 { background-color: rgba(34, 197, 94, 0.2); }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-sm { font-size: 0.75rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: 3rem; }
        .text-6xl { font-size: 3.75rem; }
        .text-7xl { font-size: 4.5rem; }
        .leading-none { line-height: 1; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tracking-wider { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .text-white { color: #fff; }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-white\/50 { color: rgba(255,255,255,0.5); }
        .text-gray-400 { color: #94a3b8; }
        .text-yellow-300 { color: #fde047; }
        .text-blue-400 { color: #60a5fa; }
        .text-red-400 { color: #f87171; }
        .opacity-70 { opacity: 0.7; }
        .drop-shadow-lg { filter: drop-shadow(0 10px 15px rgba(0,0,0,0.45)); }
        .shadow-inner { box-shadow: inset 0 2px 18px rgba(0, 0, 0, 0.35); }
        .shadow-lg { box-shadow: 0 12px 28px rgba(0,0,0,0.35); }
        .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md { backdrop-filter: blur(10px); }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .active\:scale-95:active { transform: scale(0.95); }
        .hover\:bg-black\/60:hover { background-color: rgba(0,0,0,0.6); }
        .hover\:text-white:hover { color: #fff; }
        .hover\:border-green-400:hover { border-color: #4ade80; }
        .transition-transform, .transition-colors { transition: all 0.15s ease; }
        .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .scale-110 { transform: scale(1.1); }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        @keyframes media-pop {
            0% { opacity: 0; transform: translateY(8px) scale(0.92); }
            12% { opacity: 1; transform: translateY(0) scale(1); }
            88% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-6px) scale(0.98); }
        }

        .feedback-stack {
            position: absolute;
            left: 0.85rem;
            bottom: 8.5rem;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            width: min(38vw, 9rem);
            pointer-events: none;
        }

        .feedback-card {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 0.9rem;
            background: rgba(6, 10, 22, 0.72);
            box-shadow: 0 10px 20px rgba(0,0,0,0.28);
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.2s ease;
        }

        .feedback-card.active {
            animation: media-pop 2s ease forwards;
        }

        .feedback-card img {
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 0.7rem;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.06);
        }

        .feedback-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .feedback-title {
            font-family: var(--font-display);
            font-size: 0.72rem;
            color: var(--sky-gold);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.05;
        }

        .feedback-subtitle {
            font-family: var(--font-ui);
            font-size: 0.82rem;
            color: rgba(255,255,255,0.84);
            line-height: 1;
        }

        .start-card {
            overflow: hidden;
        }

        .start-card::after {
            content: "";
            position: absolute;
            inset: auto -20% -35% auto;
            width: 12rem;
            height: 12rem;
            background: radial-gradient(circle, rgba(109, 231, 255, 0.22), transparent 65%);
            pointer-events: none;
        }

        .route-tag {
            font-family: var(--font-ui);
            font-weight: 700;
        }

        .media-symbol {
            font-family: var(--font-display);
            font-size: 0.9rem;
            color: var(--sky-cyan);
        }

        @media (max-width: 640px) {
            .text-7xl { font-size: 3rem; }
            .text-6xl { font-size: 2.6rem; }
            .text-5xl { font-size: 2.25rem; }
            .text-4xl { font-size: 1.6rem; }
            .text-3xl { font-size: 1.3rem; }
            .text-2xl { font-size: 1.1rem; }
            .text-xl { font-size: 0.95rem; }
            .mx-6, .mx-4 { margin-left: 1rem; margin-right: 1rem; }
            .p-8 { padding: 1.25rem; }
            .p-6 { padding: 1rem; }
            .px-8 { padding-left: 1rem; padding-right: 1rem; }
            .w-20 { width: 4.5rem; }
            .h-20 { height: 4.5rem; }
            .w-24 { width: 5.25rem; }
            .h-24 { height: 5.25rem; }
            #controls { padding: 1rem 1rem 2rem; }
            #hud { padding: 0.9rem; }
            .feedback-stack {
                width: min(46vw, 8rem);
                left: 0.65rem;
                bottom: 7.25rem;
            }
            .feedback-card img {
                width: 2.35rem;
                height: 2.35rem;
            }
            .feedback-title {
                font-size: 0.62rem;
            }
            .feedback-subtitle {
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between z-10">
            
             <div id="danger-vignette" class="absolute inset-0 pointer-events-none z-0"></div>

             <!-- [agent-note][stage3] resolved-gif: jump/fail feedback overlays use catalogs/gifs.json and stay off the playfield -->
             <div id="feedback-stack" class="feedback-stack" aria-hidden="true">
                 <div id="jump-feedback" class="feedback-card">
                     <img src="https://i.giphy.com/dVthC95ZSGB1OUzUFH.webp" alt="Jump reaction">
                     <div class="feedback-copy">
                         <span class="feedback-title">Air Boost</span>
                         <span class="feedback-subtitle">Thrusters hot</span>
                     </div>
                 </div>
                 <div id="fail-feedback" class="feedback-card">
                     <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction">
                     <div class="feedback-copy">
                         <span class="feedback-title">Signal Loss</span>
                         <span class="feedback-subtitle">Route unstable</span>
                     </div>
                 </div>
             </div>

            <!-- HUD -->
            <div id="hud" class="w-full p-4 flex justify-between items-start hidden safe-area-top z-10">
                <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
                <div class="flex flex-col drop-shadow-lg pointer-events-auto">
                    <div class="text-white font-pixel text-5xl leading-none text-glow" id="score">0m</div>
                    <div class="text-white/80 font-pixel text-xl uppercase tracking-widest bg-black/30 px-2 rounded" id="score-label">Height</div>
                </div>
                <button id="mute-btn" class="pointer-events-auto bg-black/40 border-2 border-white/30 text-white p-2 rounded-full w-12 h-12 flex items-center justify-center text-xl backdrop-blur-sm active:scale-95 transition-transform hover:bg-black/60">
                    🔊
                </button>
            </div>

            <!-- Editor UI (Container is pointer-events-none, children are auto) -->
            <div id="editor-ui" class="absolute inset-0 hidden flex flex-col z-20 pointer-events-none">
                <!-- Top Bar -->
                <div class="w-full p-2 bg-black/80 backdrop-blur flex justify-between items-center border-b-2 border-white/20 pointer-events-auto">
                    <div class="flex gap-2">
                        <button id="editor-exit" class="pixel-btn-secondary px-3 py-1 font-pixel text-lg rounded border border-white/20">EXIT</button>
                        <button id="editor-clear" class="pixel-btn-secondary bg-red-800 px-3 py-1 font-pixel text-lg rounded border border-white/20">CLR</button>
                    </div>
                    <button id="editor-biome" class="pixel-btn-secondary px-3 py-1 font-pixel text-lg rounded border border-white/20 w-28 truncate">SUNSET</button>
                    <button id="editor-play" class="pixel-btn px-4 py-1 font-pixel text-2xl rounded shadow-lg animate-pulse-fast">PLAY</button>
                </div>

                <!-- Center Area (Transparent, lets clicks through to canvas) -->
                <div class="flex-grow relative pointer-events-none">
                    <!-- Floating Tool Toggle -->
                    <div class="absolute right-4 top-4 flex flex-col gap-2 pointer-events-auto">
                        <button id="tool-pan" class="pixel-btn-tool w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg">🖐</button>
                        <button id="tool-draw" class="pixel-btn-tool selected w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg">✏️</button>
                        <button id="tool-erase" class="pixel-btn-tool w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg">🗑️</button>
                    </div>
                    
                    <!-- Editor Instructions Overlay (Fades out) -->
                    <div id="editor-hint" class="absolute inset-x-0 bottom-4 text-center text-white/50 font-pixel text-xl pointer-events-none">
                        DRAG TO BUILD • USE ERASER TO CLEAR
                    </div>
                </div>

                <!-- Bottom Palette -->
                <div class="w-full bg-black/90 border-t-2 border-white/20 p-2 pointer-events-auto">
                    <div class="text-white font-pixel text-sm mb-1 text-center opacity-70">SELECT TILE</div>
                    <div id="palette-container" class="flex gap-2 overflow-x-auto hide-scrollbar pb-2 px-2">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Virtual Controls -->
            <div id="controls" class="w-full p-6 flex justify-between items-end hidden safe-area-bottom pb-8 z-10 pointer-events-none">
                <div class="flex gap-4 pointer-events-auto">
                    <div id="btn-left" class="control-btn w-20 h-20">←</div>
                    <div id="btn-right" class="control-btn w-20 h-20">→</div>
                </div>
                <div id="btn-jump" class="control-btn w-24 h-24 bg-green-500/20 border-green-300/40 text-2xl font-bold tracking-wider pointer-events-auto">JUMP</div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-50 pointer-events-auto">

        // --- AUDIO SYSTEM ---
        class AudioSynth {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.initialized = false;
                this.bgmElement = this.createAudio(AUDIO_ASSETS.bgm, 0.2, true);
                this.sfx = {
                    jump: this.createAudio(AUDIO_ASSETS.jump, 0.35),
                    land: this.createAudio(AUDIO_ASSETS.land, 0.32),
                    fail: this.createAudio(AUDIO_ASSETS.fail, 0.45),
                    click: this.createAudio(AUDIO_ASSETS.click, 0.24),
                    place: this.createAudio(AUDIO_ASSETS.place, 0.22),
                    delete: this.createAudio(AUDIO_ASSETS.delete, 0.2),
                    start: this.createAudio(AUDIO_ASSETS.start, 0.36)
                };
            }
            createAudio(src, volume = 0.3, loop = false) {
                const el = new Audio(src);
                el.preload = 'auto';
                el.volume = volume;
                el.loop = loop;
                return el;
            }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.initialized = true;
                this.syncBgm(true);
            }
            syncBgm(shouldPlay) {
                if (this.muted || !this.initialized) {
                    this.bgmElement.pause();
                    return;
                }
                if (shouldPlay) this.bgmElement.play().catch(() => {});
                else this.bgmElement.pause();
            }
            playSfx(name, { restart = true } = {}) {
                if (this.muted || !this.initialized) return;
                const clip = this.sfx[name];
                if (!clip) return;
                try {
                    if (restart) clip.currentTime = 0;
                    clip.play().catch(() => {});
                } catch (_) {}
            }
            toggleMute() {
                this.muted = !this.muted;
                if (this.muted) {
                    this.bgmElement.pause();
                    Object.values(this.sfx).forEach((clip) => clip.pause());
                } else {
                    this.syncBgm(gameActive || !document.getElementById('start-screen').classList.contains('hidden'));
                }
                return this.muted;
            }
            playJump() { this.playSfx('jump'); }
            playLand() { this.playSfx('land'); }
            playFail() { this.playSfx('fail'); this.syncBgm(false); this.bgmElement.currentTime = 0; }

            playDelete() { this.playSfx('delete'); }
            playStart() { this.playSfx('start'); }

        const audio = new AudioSynth();

        // --- PARALLAX & VISUALS ---
        class ParallaxLayer {
            constructor(speed, color, type) {
                this.speed = speed; this.color = color; this.type = type; this.elements = [];
                for(let y=-500; y<LOGICAL_HEIGHT+500; y+=Math.random()*50+20) this.elements.push({x:Math.random()*LOGICAL_WIDTH, y, size: type==='star'?Math.random()*2+1:Math.random()*40+20});
            }
            draw(ctx, camY, nightFactor) {
                let alpha = this.type === 'star' ? nightFactor : 1.0 - (nightFactor * 0.6);
                if (!currentMap.showCelestial && this.type === 'cloud') alpha = 0.3 + (nightFactor * 0.2);
                if (alpha <= 0.01) return;
                ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = this.color;
                this.elements.forEach(el => {
                    let dy = el.y - (camY * this.speed);
                    if (dy > LOGICAL_HEIGHT+200) el.y -= (LOGICAL_HEIGHT+400); else if (dy < -200) el.y += (LOGICAL_HEIGHT+400);
                    if (this.type==='star') ctx.fillRect(el.x, dy, el.size, el.size);
                    else { ctx.beginPath(); ctx.arc(el.x, dy, el.size, 0, Math.PI*2); ctx.fill(); }
                });
                ctx.restore();
            }

        // --- HELPER FUNCTIONS ---
        function hexToRgb(hex) { const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return r ? {r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)} : null; }
        function rgbToHex(r,g,b) { return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
        function lerpColor(c1, c2, t) {
            const r1=hexToRgb(c1), r2=hexToRgb(c2);
            return rgbToHex(Math.round(r1.r+(r2.r-r1.r)*t), Math.round(r1.g+(r2.g-r1.g)*t), Math.round(r1.b+(r2.b-r1.b)*t));
        }

        function drawPixelSprite(spriteKey, px, py, flip, sx, sy) {
            const rows = SPRITES[spriteKey]; if (!rows) return;
            ctx.save(); ctx.translate(px+6, py+7); ctx.scale(sx, sy); ctx.translate(-(px+6), -(py+7));
            for(let y=0; y<rows.length; y++) for(let x=0; x<rows[y].length; x++) {
                const c = rows[y][flip ? rows[y].length-1-x : x];
                if (c!=='0') { ctx.fillStyle = SPRITE_COLORS[c]; ctx.fillRect(Math.floor(px+x), Math.floor(py+y), 1, 1); }
            }
            ctx.restore();
        }

        function drawBackground(cycleT) {
            const mapId = currentMap.id === 'custom' ? editor.biome : currentMap.id;
            const refMap = MAPS[mapId] || MAPS.sunset;
            const phases = refMap.phases.length ? refMap.phases : MAPS.sunset.phases;
            
            let p1 = phases[0], p2 = phases[1];
            for (let i=0; i<phases.length-1; i++) if (cycleT >= phases[i].t && cycleT < phases[i+1].t) { p1=phases[i]; p2=phases[i+1]; break; }
            
            const range = p2.t - p1.t;
            const localT = range === 0 ? 0 : (cycleT - p1.t) / range;
            const grad = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
            grad.addColorStop(0, lerpColor(p1.top, p2.top, localT));
            grad.addColorStop(1, lerpColor(p1.bottom, p2.bottom, localT));
            ctx.fillStyle = grad; ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        }

        function getPlatformPalette(theme) {
            const map = Object.values(MAPS).find(m => m.id === theme) || MAPS.sunset;
            return map.palette;
        }

        function drawWorld(camY) {
            platforms.forEach(p => {
                const drawY = p.y - camY;
                if (drawY < -50 || drawY > LOGICAL_HEIGHT + 50) return;
                
                const theme = p.theme || currentMap.id;
                const pal = getPlatformPalette(theme);
                
                let sx = 0;
                if ((p.isLilypad || p.isSugar) && p.standTime > 0 && !p.falling) sx = Math.sin(globalTime * 0.8) * (p.standTime / 10);
                const fx = p.x + sx;

                if (p.isHolo) {
                    if (p.active) {
                        ctx.fillStyle = 'rgba(0,255,255,0.2)'; ctx.strokeStyle = pal.grassTop; ctx.lineWidth = 2;
                        ctx.fillRect(fx, drawY, p.w, p.h); ctx.strokeRect(fx, drawY, p.w, p.h);
                        ctx.fillStyle = pal.grassTop; ctx.globalAlpha = 0.5;
                        for(let i=4; i<p.w; i+=8) ctx.fillRect(fx+i, drawY, 1, p.h);
                        ctx.globalAlpha = 1.0;
                    } else {
                        ctx.strokeStyle = pal.grassTop; ctx.globalAlpha = 0.2; ctx.setLineDash([4,4]);
                        ctx.strokeRect(fx, drawY, p.w, p.h); ctx.setLineDash([]); ctx.globalAlpha = 1.0;
                    }
                    return;
                }

                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(fx+4, drawY+4, p.w, p.h);

                if (theme === 'factory') {
                    ctx.fillStyle = pal.grassBot; ctx.fillRect(fx, drawY, p.w, p.h);
                    ctx.fillStyle = pal.decor1; 
                    for(let i=0; i<p.w; i+=10) { ctx.beginPath(); ctx.moveTo(fx+i, drawY); ctx.lineTo(fx+i+5, drawY); ctx.lineTo(fx+i, drawY+p.h); ctx.lineTo(fx+i-5, drawY+p.h); ctx.fill(); }
                    ctx.strokeStyle = pal.grassTop; ctx.strokeRect(fx, drawY, p.w, p.h);
                } else if (theme === 'heaven') {
                    ctx.fillStyle = pal.grassTop;
                    ctx.beginPath(); ctx.arc(fx+10, drawY+6, 10, 0, Math.PI*2); ctx.arc(fx+p.w/2, drawY+4, 12, 0, Math.PI*2); ctx.arc(fx+p.w-10, drawY+6, 10, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = pal.dirtDark; ctx.globalCompositeOperation = 'source-atop'; ctx.fillRect(fx, drawY+10, p.w, 10); ctx.globalCompositeOperation = 'source-over';
                } else if (p.isJelly) {
                    ctx.fillStyle = 'rgba(255,105,180,0.6)'; ctx.beginPath(); ctx.roundRect(fx, drawY, p.w, p.h, 8); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(fx+p.w/2, drawY+4, p.w/2-4, 3, 0, 0, Math.PI*2); ctx.fill();
                } else if (p.isSugar) {
                    ctx.fillStyle = '#fff0f5'; ctx.fillRect(fx, drawY, p.w, p.h);
                    ctx.fillStyle = noisePattern; ctx.globalAlpha = 0.2; ctx.fillRect(fx, drawY, p.w, p.h); ctx.globalAlpha = 1.0;
                } else if (theme === 'swamp') {
                    ctx.fillStyle = '#2f421e'; ctx.fillRect(fx, drawY, p.w, p.h);
                    ctx.fillStyle = '#4b692f'; ctx.fillRect(fx, drawY, p.w, 4);
                    if (p.w > 30) { ctx.fillStyle = '#4b692f'; ctx.fillRect(fx+5, drawY+p.h, 2, 6); ctx.fillRect(fx+p.w-10, drawY+p.h, 2, 8); }
                } else {
                    ctx.fillStyle = pal.dirtLight; ctx.fillRect(fx, drawY+4, p.w, p.h-4);
                    ctx.fillStyle = noisePattern; ctx.fillRect(fx, drawY+4, p.w, p.h-4);
                    ctx.fillStyle = pal.grassTop; ctx.fillRect(fx, drawY, p.w, 4);
                    ctx.fillStyle = pal.grassBot; ctx.fillRect(fx, drawY+4, p.w, 1);
                }
            });

            if (gameActive) {
                if (player.grounded) { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(player.x+6, player.y-camY+13, 5, 2, 0, 0, Math.PI*2); ctx.fill(); }
                drawPixelSprite(player.state, player.x, player.y-camY, !player.facingRight, player.scaleX, player.scaleY);
            }
        }

        // --- EDITOR LOGIC ---
        function initEditor() {
            gameActive = false;
            editorActive = true;
            editor.camY = LOGICAL_HEIGHT - 300; 
            const saved = localStorage.getItem('sunset-custom-level');
            editor.platforms = saved ? JSON.parse(saved) : [];
            
            if (editor.platforms.length === 0) {
                editor.platforms.push({x: 0, y: LOGICAL_HEIGHT - 40, w: LOGICAL_WIDTH, h: 40, theme: 'sunset'});
            }
            
            document.getElementById('editor-ui').classList.remove('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            
            // Reset tool to draw by default
            editor.tool = 'draw';
            updateToolUI();
            
            renderPalette();
            resize();
            requestAnimationFrame(editorLoop);
        }

        function renderPalette() {
            const container = document.getElementById('palette-container');
            container.innerHTML = '';
            BLOCK_PALETTE.forEach((block, idx) => {
                const el = document.createElement('div');
                el.className = `palette-item ${editor.selectedBlock === idx ? 'selected' : ''}`;
                el.innerHTML = `<div class="palette-preview" style="background:${block.color}"></div><span>${block.name}</span>`;
                el.onclick = (e) => {
                    e.stopPropagation();
                    editor.selectedBlock = idx;
                    audio.playClick();
                    renderPalette();
                    editor.tool = 'draw';
                    updateToolUI();
                };
                container.appendChild(el);
            });
        }
        
        function updateToolUI() {
            const tools = ['pan', 'draw', 'erase'];
            tools.forEach(t => {
                const btn = document.getElementById(`tool-${t}`);
                if (editor.tool === t) {
                    btn.classList.add('selected');
                    if (t === 'erase') btn.classList.add('erase-active');
                } else {
                    btn.classList.remove('selected', 'erase-active');
                }
            });
        }

        function drawEditor() {
            ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
            drawBackground(0.15); 
            
            // Grid
            const gridSize = editor.gridSize;
            const startY = Math.floor(editor.camY / gridSize) * gridSize;
            const offsetY = editor.camY % gridSize;
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            
            // Vertical lines
            for(let x=0; x<=LOGICAL_WIDTH; x+=gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, LOGICAL_HEIGHT); ctx.stroke();
            }
            // Horizontal lines
            for(let y=-offsetY; y<LOGICAL_HEIGHT; y+=gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LOGICAL_WIDTH, y); ctx.stroke();
            }

            // Draw Platforms
            const oldPlats = platforms;
            platforms = editor.platforms;
            drawWorld(editor.camY);
            platforms = oldPlats;
            
            // Start Line
            const startYDraw = (LOGICAL_HEIGHT - 40) - editor.camY;
            if (startYDraw > -50 && startYDraw < LOGICAL_HEIGHT + 50) {
                ctx.strokeStyle = '#0f0'; ctx.setLineDash([5,5]); ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, startYDraw); ctx.lineTo(LOGICAL_WIDTH, startYDraw); ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#0f0'; ctx.font = '12px monospace'; ctx.fillText("START LINE", 5, startYDraw - 5);
            }

            // Ghost Block (Preview)
            if (editor.ghostX >= 0) {
                if (editor.tool === 'draw') {
                    const blockType = BLOCK_PALETTE[editor.selectedBlock];
                    ctx.fillStyle = blockType.color;
                    ctx.globalAlpha = 0.5;
                    ctx.fillRect(editor.ghostX, editor.ghostY - editor.camY, 60, 20);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    ctx.strokeRect(editor.ghostX, editor.ghostY - editor.camY, 60, 20);
                    ctx.globalAlpha = 1.0;
                } else if (editor.tool === 'erase') {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.fillRect(editor.ghostX, editor.ghostY - editor.camY, 20, 20); // Grid cell size for delete preview
                    ctx.strokeStyle = 'red'; ctx.lineWidth = 2;
                    ctx.strokeRect(editor.ghostX, editor.ghostY - editor.camY, 20, 20);
                }
            }
        }

        function editorLoop() {
            if (!editorActive) return;
            drawEditor();
            requestAnimationFrame(editorLoop);
        }

        function handleEditorTouch(e, type) {
            if (!editorActive) return;
            
            // Prevent default to stop scrolling
            if(type !== 'end') e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const touch = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
            
            // If it's a mouse event and no button pressed, ignore move
            if (e.type.startsWith('mouse') && e.buttons === 0 && type === 'move') {
                // Just update ghost cursor
                const x = (e.clientX - rect.left) * scaleX;
                const y = (e.clientY - rect.top) * scaleY;
                const worldY = editor.camY + y;
                
                if (editor.tool === 'draw') {
                    editor.ghostX = Math.floor(x / editor.gridSize) * editor.gridSize;
                    editor.ghostY = Math.floor(worldY / editor.gridSize) * editor.gridSize;
                } else if (editor.tool === 'erase') {
                    editor.ghostX = Math.floor(x / editor.gridSize) * editor.gridSize;
                    editor.ghostY = Math.floor(worldY / editor.gridSize) * editor.gridSize;
                }
                return;
            }

            // Touch coordinates
            let x, y;
            if (type === 'end') {
                x = editor.lastTouchX; 
                y = editor.lastTouchY;
            } else {
                x = (touch.clientX - rect.left) * scaleX;
                y = (touch.clientY - rect.top) * scaleY;
            }

            if (type === 'start') {
                editor.isDragging = true;
                editor.lastTouchX = x;
                editor.lastTouchY = y;
                editor.lastGridX = -1;
                editor.lastGridY = -1;
            }

            if (editor.tool === 'pan') {
                if (editor.isDragging && type === 'move') {
                    const dy = y - editor.lastTouchY;
                    editor.camY -= dy;
                    editor.lastTouchY = y;
                }
            } else if (editor.tool === 'draw') {
                if (editor.isDragging && (type === 'start' || type === 'move')) {
                    const worldY = editor.camY + y;
                    const gridX = Math.floor(x / editor.gridSize) * editor.gridSize;
                    const gridY = Math.floor(worldY / editor.gridSize) * editor.gridSize;

                    editor.ghostX = gridX;
                    editor.ghostY = gridY;

                    if (gridX === editor.lastGridX && gridY === editor.lastGridY) return;
                    
                    // Check collision - if something exists, do nothing (eraser is for deleting now)
                    const clickedIndex = editor.platforms.findIndex(p => 
                        x >= p.x && x <= p.x + p.w && worldY >= p.y && worldY <= p.y + p.h
                    );

                    if (clickedIndex === -1) {
                        // Place new
                        const blockType = BLOCK_PALETTE[editor.selectedBlock];
                        editor.platforms.push({
                            x: gridX,
                            y: gridY,
                            w: 60, 
                            h: 20,
                            theme: blockType.theme,
                            isJelly: blockType.isJelly,
                            isSugar: blockType.isSugar,
                            isHolo: blockType.isHolo
                        });
                        audio.playPlace();
                        editor.lastGridX = gridX;
                        editor.lastGridY = gridY;
                    }
                }
            } else if (editor.tool === 'erase') {
                if (editor.isDragging && (type === 'start' || type === 'move')) {
                    const worldY = editor.camY + y;
                    const gridX = Math.floor(x / editor.gridSize) * editor.gridSize;
                    const gridY = Math.floor(worldY / editor.gridSize) * editor.gridSize;
                    
                    editor.ghostX = gridX;
                    editor.ghostY = gridY;

                    // Delete if touching
                    const clickedIndex = editor.platforms.findIndex(p => 
                        x >= p.x && x <= p.x + p.w && worldY >= p.y && worldY <= p.y + p.h
                    );

                    if (clickedIndex !== -1) {
                        editor.platforms.splice(clickedIndex, 1);
                        audio.playDelete();
                    }
                }
            }
            
            if (type === 'end') {
                editor.isDragging = false;
                localStorage.setItem('sunset-custom-level', JSON.stringify(editor.platforms));
            }
        }

        // --- GAME LOGIC ---
        function initGame(mapId) {
            currentMap = MAPS[mapId];
            scoreVal = 0; frameCount = 0; cycleTimer = 0.15 * CYCLE_DURATION; screenShake = 0;
            platforms = [];
            
            // Player Reset
            player.x = LOGICAL_WIDTH / 2 - 6;
            player.y = LOGICAL_HEIGHT - 100;
            player.vx = 0; player.vy = 0;
            camera.y = LOGICAL_HEIGHT - 300; 

            if (mapId === 'custom') {
                // Load custom platforms
                platforms = JSON.parse(JSON.stringify(editor.platforms)); // Deep copy
                // Init dynamic props
                platforms.forEach(p => {
                    p.active = true; p.standTime = 0; p.falling = false; p.vx = 0; p.vy = 0;
                    if (p.isHolo) { p.holoOffset = Math.random() * 200; p.holoPhase = 0; }
                });
                // Ensure there's a floor if user deleted it
                if (platforms.length === 0) {
                     platforms.push({x: 0, y: LOGICAL_HEIGHT - 40, w: LOGICAL_WIDTH, h: 40, theme: 'sunset'});
                }
            } else {
                spawnPlatformRaw(0, LOGICAL_HEIGHT - 40, LOGICAL_WIDTH, 40);
                let currentY = LOGICAL_HEIGHT - 100;
                for(let i=0; i<10; i++) {
                    spawnPlatformAt(currentY - (40 + Math.random() * 40));
                    currentY = platforms[platforms.length-1].y;
                }
            }
            
            initParallax();
            document.getElementById('score').innerText = "0m";
            document.getElementById('danger-vignette').style.opacity = 0;
        }

        function spawnPlatformRaw(x, y, w, h) {
            platforms.push({ x, y, w, h, decorations: [], active: true, standTime: 0, falling: false, vy: 0, vx: 0 });
        }

        function spawnPlatformAt(yPos) {
            const w = Math.floor(Math.random() * 60 + 40);
            const x = Math.random() * (LOGICAL_WIDTH - w);
            const theme = currentMap.id;
            const isJelly = currentMap.features.jelly && Math.random()<0.3;
            const isSugar = currentMap.features.sugar && Math.random()<0.3;
            const isHolo = currentMap.features.holoPlatforms && Math.random()<0.3;
            
            platforms.push({
                x, y: yPos, w, h: 16,
                theme: theme,
                isJelly, isSugar, isHolo,
                active: true, standTime: 0, falling: false, vy: 0, vx: 0,
                holoOffset: Math.random() * 200, holoPhase: 0
            });
        }

        function update() {
            globalTime++;
            cycleTimer = (cycleTimer + 1) % CYCLE_DURATION;
            if (screenShake > 0) screenShake *= 0.9;
            player.scaleX += (1 - player.scaleX) * 0.15;
            player.scaleY += (1 - player.scaleY) * 0.15;

            // Physics
            const friction = (player.platform && player.platform.theme === 'frozen') ? 0.96 : currentMap.physics.friction;
            
            if (input.left) { player.vx -= currentMap.physics.accel; player.facingRight = false; }
            else if (input.right) { player.vx += currentMap.physics.accel; player.facingRight = true; }
            else { player.vx *= friction; if(Math.abs(player.vx)<0.1) player.vx=0; }
            
            if (player.vx > player.speed) player.vx = player.speed;
            if (player.vx < -player.speed) player.vx = -player.speed;

            if (input.jumpPressed) {
                if (player.grounded) {
                    player.vy = player.jumpPower; player.grounded = false; player.platform = null; player.jumpCount = 1;
                    player.scaleX = 0.7; player.scaleY = 1.3; audio.playJump(); triggerFeedback('jump');
                } else if (player.jumpCount < player.maxJumps) {
                    player.vy = player.jumpPower * 0.9; player.jumpCount++;
                    player.scaleX = 0.8; player.scaleY = 1.2; audio.playJump(); triggerFeedback('jump');
                }
                input.jumpPressed = false;
            }
            player.vy += currentMap.physics.gravity;
            player.x += player.vx; player.y += player.vy;

            // Platforms
            platforms.forEach(p => {
                if (p.falling) { p.vy += 0.2; p.y += p.vy; }
                if (p.isHolo) { p.holoPhase = (globalTime + p.holoOffset) % 240; p.active = p.holoPhase < 180; }
            });

            // Bounds
            if (player.x < 0) { player.x = 0; player.vx = 0; }
            if (player.x + player.w > LOGICAL_WIDTH) { player.x = LOGICAL_WIDTH - player.w; player.vx = 0; }

            // Collision
            player.grounded = false;
            player.platform = null;
            const hitbox = { x: player.x+4, y: player.y, w: player.w-8, h: player.h };
            
            for (let p of platforms) {
                if (p.falling && p.vy > player.vy) continue;
                if (p.isHolo && !p.active) continue;
                if (player.vy >= 0 && hitbox.x+hitbox.w > p.x && hitbox.x < p.x+p.w && player.y+player.h >= p.y && player.y+player.h <= p.y+14) {
                    if (p.isJelly) {
                        player.vy = -13; player.jumpCount = 1; player.scaleX = 0.6; player.scaleY = 1.4; audio.playJump(); triggerFeedback('jump');
                    } else {
                        if (!player.grounded) { audio.playLand(); player.scaleX = 1.3; player.scaleY = 0.7; }
                        player.grounded = true; player.platform = p; player.vy = 0; player.y = p.y - player.h; player.jumpCount = 0;
                        if (p.isSugar && !p.falling) { p.standTime++; if (p.standTime > 30) { p.falling = true; p.vy = 3; } }
                    }
                }
            }

            player.state = !player.grounded ? 'jump' : (Math.abs(player.vx) > 0.5 ? ((Math.floor(globalTime/6)%2===0)?'run1':'run2') : 'idle');

            // Camera
            const targetLine = camera.y + (LOGICAL_HEIGHT * 0.6);
            if (player.y < targetLine) camera.y -= (targetLine - player.y);
            
            // Score
            const currentAlt = Math.floor((LOGICAL_HEIGHT - player.y) / 10);
            if (currentAlt > scoreVal) { scoreVal = currentAlt; if (frameCount%10===0) document.getElementById('score').innerText = scoreVal+"m"; }

            // Procedural Gen (Only if not custom)
            if (currentMap.id !== 'custom') {
                const highest = platforms.reduce((min, p) => p.y < min.y ? p : min, platforms[0]);
                if (highest.y > camera.y - 100) spawnPlatformAt(highest.y - (50 + Math.random()*30));
                if (platforms.length > 0 && platforms[0].y > camera.y + LOGICAL_HEIGHT + 100) platforms.shift();
            }

            // Fall Death
            if (player.y > camera.y + LOGICAL_HEIGHT + 50) gameOver();

            parallaxLayers.forEach(l => l.draw(ctx, camera.y, 0));
        }

        function gameLoop() {
            if (!gameActive) return;
            frameCount++; update();
            ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
            
            // Draw Game
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            drawBackground(cycleTimer/CYCLE_DURATION);
            parallaxLayers.forEach(l => l.draw(ctx, camera.y, 0));
            drawWorld(camera.y);
            ctx.restore();
            
            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false; cancelAnimationFrame(animationId); audio.playFail(); triggerFeedback('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = scoreVal;
        }

        // --- UI BINDINGS ---
        function startGame(mapId) {
            document.getElementById('map-select-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            gameActive = true;
            initGame(mapId);
            audio.syncBgm(true);
            gameLoop();
        }

        // Map Select
        const mapList = document.getElementById('map-list');
        Object.values(MAPS).forEach(map => {
            if(map.id === 'custom') return;
            const btn = document.createElement('button');
            btn.className = "w-full bg-gray-800 border-2 border-white/20 p-3 text-left font-pixel text-xl text-white hover:border-green-400 mb-2 pointer-events-auto rounded shadow-lg";
            btn.innerText = map.name;
            btn.onclick = () => startGame(map.id);
            mapList.appendChild(btn);
        });

        document.getElementById('start-btn').onclick = () => {
            audio.init();
            audio.playStart();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('map-select-screen').classList.remove('hidden');
            audio.syncBgm(false);
        };
        document.getElementById('editor-btn').onclick = () => {
            audio.init();
            audio.playClick();
            audio.syncBgm(false);
            initEditor();
        };
        document.getElementById('back-to-start-btn').onclick = () => {
            audio.playClick();
            document.getElementById('map-select-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            audio.syncBgm(false);
        };
        document.getElementById('restart-btn').onclick = () => {
            audio.playClick();
            startGame(currentMap.id);
        };
        document.getElementById('menu-btn').onclick = () => {
            audio.playClick();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            audio.syncBgm(false);
        };
        document.getElementById('mute-btn').onclick = () => { const m=audio.toggleMute(); document.getElementById('mute-btn').innerText = m ? '🔇' : '🔊'; };

        // Editor Controls
        document.getElementById('editor-exit').onclick = () => {
            audio.playClick();
            editorActive = false;
            document.getElementById('editor-ui').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            audio.syncBgm(false);
        };
        document.getElementById('editor-clear').onclick = () => {
            audio.playClick();
            if(confirm("Clear all blocks?")) {
                editor.platforms = [{x: 0, y: LOGICAL_HEIGHT - 40, w: LOGICAL_WIDTH, h: 40, theme: 'sunset'}];
                localStorage.setItem('sunset-custom-level', JSON.stringify(editor.platforms));
            }
        };
        document.getElementById('editor-play').onclick = () => {
            audio.playStart();
            editorActive = false;
            document.getElementById('editor-ui').classList.add('hidden');
            localStorage.setItem('sunset-custom-level', JSON.stringify(editor.platforms));
            startGame('custom');
        };
        document.getElementById('editor-biome').onclick = () => {
            audio.playClick();
            const biomes = ['sunset', 'cyber', 'frozen', 'heaven', 'factory', 'swamp', 'volcano', 'candyland', 'abyss'];
            const idx = biomes.indexOf(editor.biome);
            editor.biome = biomes[(idx + 1) % biomes.length];
            document.getElementById('editor-biome').innerText = editor.biome.toUpperCase();
        };
        
        const toolPan = document.getElementById('tool-pan');
        const toolDraw = document.getElementById('tool-draw');
        const toolErase = document.getElementById('tool-erase');
        
        toolPan.onclick = () => { audio.playClick(); editor.tool = 'pan'; updateToolUI(); };
        toolDraw.onclick = () => { audio.playClick(); editor.tool = 'draw'; updateToolUI(); };
        toolErase.onclick = () => { audio.playClick(); editor.tool = 'erase'; updateToolUI(); };

        // Editor Canvas Input
        // Note: The UI layer is pointer-events-none, so these fire on the canvas.
        canvas.addEventListener('mousedown', e => handleEditorTouch(e, 'start'));
        canvas.addEventListener('mousemove', e => handleEditorTouch(e, 'move'));
        canvas.addEventListener('mouseup', e => handleEditorTouch(e, 'end'));
        canvas.addEventListener('mouseleave', e => handleEditorTouch(e, 'end'));
        canvas.addEventListener('touchstart', e => { handleEditorTouch(e, 'start'); }, {passive:false});
        canvas.addEventListener('touchmove', e => { handleEditorTouch(e, 'move'); }, {passive:false});
        canvas.addEventListener('touchend', e => { handleEditorTouch(e, 'end'); });

        // Game Controls
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');
        const addTouch = (el, key) => {
            const start = (e) => { e.preventDefault(); input[key]=true; if(key==='jump') input.jumpPressed=true; el.classList.add('pressed'); };
            const end = (e) => { e.preventDefault(); input[key]=false; el.classList.remove('pressed'); };
            el.addEventListener('touchstart', start, {passive:false}); el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
        };
        addTouch(btnLeft, 'left'); addTouch(btnRight, 'right'); addTouch(btnJump, 'jump');

        function resize() {
            const aspect = window.innerHeight / window.innerWidth;
            LOGICAL_HEIGHT = Math.floor(LOGICAL_WIDTH * aspect);
            canvas.width = LOGICAL_WIDTH; canvas.height = LOGICAL_HEIGHT;
            if(!gameActive && !editorActive) drawBackground(0.15);
        }
        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
