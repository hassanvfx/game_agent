<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">

            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto z-10 pulse-accent">
                <div class="brand-chip"><span class="emoji">🌆</span><span>Neon Rope Circuit</span></div>
                <h1 class="text-6xl font-bold text-white mb-4 title-text">SKYLINE SKIP</h1>
                <p class="text-white/90 text-xl mb-2 font-semibold subhead">10 runners, one clean rhythm</p>
                <p class="text-blue-100 text-sm mb-8">Tap, click, or press Space to clear the glowing cable and outlast the rooftop field.</p>
                <button id="start-btn" class="font-bold py-4 px-12 rounded-full shadow-lg text-xl border-2 border-white/20">ENTER SHOWDOWN</button>
                <div class="spark-row" aria-hidden="true"><span>⚡</span><span>🏃</span><span>🌃</span></div>
            </div>

            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-3xl text-center pointer-events-auto z-10 ui-text">
                <div class="brand-chip"><span class="emoji">🏁</span><span>Results Board</span></div>
                <h2 id="go-title" class="text-5xl font-bold text-white mb-4 drop-shadow-lg">RUN OVER</h2>
                <div class="text-2xl text-white mb-8">Placement: <span id="finalRank" class="font-bold text-yellow-400">#10</span></div>
                <button id="restart-btn" class="bg-white text-blue-600 font-bold py-3 px-10 rounded-full shadow-lg text-lg">Run It Back</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="absolute top-6 left-6 text-2xl font-bold text-white drop-shadow-md hidden flex gap-4 ui-text">
                <div class="px-4 py-2 rounded-xl backdrop-blur-sm border border-white/10">
                    Still in: <span id="alive-count" class="text-green-400">10</span>/10
                </div>
                <div class="px-4 py-2 rounded-xl backdrop-blur-sm border border-white/10">
                    Beat: <span id="beat-status" class="text-yellow-400">Steady</span>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: victory/fail reactions from catalogs/gifs.json -->
            <div id="status-badge" class="status-badge" aria-live="polite"></div>
            <img id="victory-gif" class="feedback-gif" alt="Victory reaction overlay" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
            <img id="fail-gif" class="feedback-gif" alt="Fail reaction overlay" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                danger: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                uiStart: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3"
            },
            gifs: {
                victory: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        const PLAYER_THEME = {
            suit: '#70e8ff',
            trim: '#ffe57a',
            visor: '#ff72ba',
            aura: 'rgba(112, 232, 255, 0.35)',
            tag: '#fff5bf'
        };

        const RIVAL_PALETTES = [
            { suit: '#ff6f9f', trim: '#ffd973', visor: '#fff2c5' },
            { suit: '#8f86ff', trim: '#86f3ff', visor: '#eef7ff' },
            { suit: '#57d7b3', trim: '#c9ff83', visor: '#effff5' },
            { suit: '#ff9c63', trim: '#ffe7a2', visor: '#fff7d9' }
        ];

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            async unlock() {
                if (this.ready) return;
                this.ready = true;
                try {
                    this.bgm.load();
                    Object.values(this.sfx).forEach(sound => sound.load());
                } catch (_) {}
            }

            playBGM() {
                if (!this.ready) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM(reset = true) {
                this.bgm.pause();
                if (reset) {
                    this.bgm.currentTime = 0;
                }
            }

            playSFX(key, volume = 0.6, cooldown = 90) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) || 0;
                if (now - last < cooldown) return;
                this.lastPlayed.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const statusBadge = document.getElementById('status-badge');
        const victoryGif = document.getElementById('victory-gif');
        const failGif = document.getElementById('fail-gif');
        const beatStatus = document.getElementById('beat-status');
        let feedbackTimer = null;

        function showStatus(message, tone = 'success', duration = 1100) {
            statusBadge.textContent = message;
            statusBadge.className = `status-badge show ${tone}`;
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                statusBadge.className = 'status-badge';
            }, duration);
        }

        function showReaction(type) {
            victoryGif.classList.toggle('show', type === 'victory');
            failGif.classList.toggle('show', type === 'fail');
        }

        function clearReaction() {
            victoryGif.classList.remove('show');
            failGif.classList.remove('show');
            statusBadge.className = 'status-badge';
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let frameCount = 0;

        // Game Variables
        let characters = [];
        let ropeAngle = 0;
        let ropeSpeed = 0.05;
        let baseRopeSpeed = 0.05;
        let groundY = 0;
        let clouds = [];
        let playerIndex = 4; // Player is in the middle
        let aliveCount = 10;
        let playerAlive = true;

        // Resize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            groundY = height * 0.75;
            initClouds();
        }
        window.addEventListener('resize', resize);

        /** 4. PARALLAX & VISUALS */
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.34),
                    size: 36 + Math.random() * 56,
                    speed: 0.16 + Math.random() * 0.24
                });
            }
        }

        function drawBackground() {
            // Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#120f24');
            grad.addColorStop(0.45, '#201c48');
            grad.addColorStop(1, '#38175f');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.5, height * 0.18, 20, width * 0.5, height * 0.18, width * 0.45);
            glow.addColorStop(0, 'rgba(132, 240, 255, 0.22)');
            glow.addColorStop(0.45, 'rgba(132, 240, 255, 0.08)');
            glow.addColorStop(1, 'rgba(132, 240, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            // Moon / spotlight
            ctx.fillStyle = 'rgba(255, 245, 199, 0.95)';
            ctx.beginPath();
            ctx.arc(width * 0.82, height * 0.16, Math.min(width, height) * 0.05, 0, Math.PI * 2);
            ctx.fill();

            // Clouds
            clouds.forEach(c => {
                const cloudGrad = ctx.createRadialGradient(c.x, c.y, c.size * 0.1, c.x, c.y, c.size * 1.9);
                cloudGrad.addColorStop(0, 'rgba(231, 243, 255, 0.38)');
                cloudGrad.addColorStop(1, 'rgba(231, 243, 255, 0)');
                ctx.fillStyle = cloudGrad;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.2, c.size * 0.9, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 1.5, c.y, c.size * 0.8, 0, Math.PI * 2);
                ctx.fill();
                c.x += c.speed;
                if (c.x > width + 120) c.x = -120;
            });

            // Skyline
            const skylineBase = groundY - 10;
            for (let i = 0; i < width + 80; i += 44) {
                const towerHeight = 80 + ((i / 44) % 5) * 18 + Math.abs(Math.sin(i * 0.03)) * 36;
                ctx.fillStyle = (i / 44) % 2 === 0 ? '#161235' : '#262152';
                ctx.fillRect(i, skylineBase - towerHeight, 34, towerHeight);

                ctx.fillStyle = 'rgba(134, 243, 255, 0.55)';
                for (let wy = skylineBase - towerHeight + 10; wy < skylineBase - 8; wy += 14) {
                    if (((wy + i) / 14) % 2 < 1) {
                        ctx.fillRect(i + 7, wy, 5, 6);
                        ctx.fillRect(i + 19, wy + 2, 5, 6);
                    }
                }
            }

            // Crowd strip / stage deck
            const deckGrad = ctx.createLinearGradient(0, groundY - 26, 0, groundY + 10);
            deckGrad.addColorStop(0, '#2b2558');
            deckGrad.addColorStop(1, '#0f1023');
            ctx.fillStyle = deckGrad;
            ctx.fillRect(0, groundY - 26, width, 28);

            for (let i = 0; i < width + 12; i += 18) {
                const bob = Math.sin((frameCount * 0.08) + (i * 0.1)) * 2;
                ctx.fillStyle = i % 36 === 0 ? '#ff6fb3' : '#86f3ff';
                ctx.beginPath();
                ctx.arc(i + 8, groundY - 32 + bob, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Ground
            const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
            groundGrad.addColorStop(0, '#56f0b6');
            groundGrad.addColorStop(0.2, '#1fb890');
            groundGrad.addColorStop(1, '#0e6e5a');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, width, height);

            // Track lines
            ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 12]);
            for (let y = groundY + 28; y < height; y += 34) {
                ctx.beginPath();
                ctx.moveTo(width * 0.08, y);
                ctx.lineTo(width * 0.92, y);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        /** 5. GAME LOGIC */
        class Character {
            constructor(index, isPlayer) {
                this.index = index;
                this.isPlayer = isPlayer;
                this.x = 0;
                this.y = 0;
                this.vy = 0;
                this.isJumping = false;
                this.isOut = false;
                const rivalPalette = RIVAL_PALETTES[index % RIVAL_PALETTES.length];
                this.palette = isPlayer ? PLAYER_THEME : rivalPalette;
                this.color = this.palette.suit;
                this.jumpStrength = 15;
                this.gravity = 0.8;
                this.bobSeed = Math.random() * Math.PI * 2;

                // Bot AI props
                this.reactionError = (Math.random() - 0.5) * 0.5;
                this.skill = 0.8 + Math.random() * 0.15;
            }

            jump() {
                if (!this.isJumping && !this.isOut) {
                    this.isJumping = true;
                    this.vy = -this.jumpStrength;
                    if (this.isPlayer) audio.playSFX('jump');
                }
            }

            update() {
                if (this.isOut) {
                    this.y = groundY + 10;
                    return;
                }

                if (this.isJumping) {
                    this.y += this.vy;
                    this.vy += this.gravity;
                    if (this.y >= groundY) {
                        this.y = groundY;
                        this.isJumping = false;
                        this.vy = 0;
                        if (this.isPlayer) audio.playSFX('land', 0.2, 70);
                    }
                } else {
                    this.y = groundY;
                }

                if (!this.isPlayer && !this.isOut) {
                    const normAngle = ropeAngle % (Math.PI * 2);
                    const distanceToHitBase = (Math.PI / 2) - normAngle;
                    let distanceToHit = distanceToHitBase;
                    if (distanceToHit < 0) distanceToHit += Math.PI * 2;

                    const reaction = 0.5 + this.reactionError;
                    const failChance = (ropeSpeed - 0.05) * 2;

                    if (distanceToHit < reaction && distanceToHit > 0.1 && !this.isJumping) {
                        if (Math.random() > failChance * (1 - this.skill)) {
                            this.jump();
                        }
                    }
                }
            }

            draw(ctx, xPos) {
                this.x = xPos;
                const hoverLift = !this.isOut ? Math.sin(frameCount * 0.08 + this.bobSeed) * 1.8 : 0;

                if (!this.isOut) {
                    ctx.fillStyle = this.isPlayer ? 'rgba(112, 232, 255, 0.24)' : 'rgba(0,0,0,0.18)';
                    const shadowWidth = 30 * (1 - (groundY - this.y) / 200);
                    ctx.beginPath();
                    ctx.ellipse(this.x, groundY + 8, shadowWidth + (this.isPlayer ? 6 : 0), this.isPlayer ? 10 : 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.save();
                ctx.translate(this.x, this.y + hoverLift);

                if (this.isOut) {
                    ctx.rotate(Math.PI / 2);
                    ctx.translate(20, -20);
                    ctx.fillStyle = '#57586c';
                }

                if (this.isPlayer && !this.isOut) {
                    ctx.fillStyle = PLAYER_THEME.aura;
                    ctx.beginPath();
                    ctx.ellipse(0, -32, 28, 40, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Legs
                ctx.strokeStyle = this.isOut ? '#444a55' : this.palette.trim;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-8, -4);
                ctx.lineTo(-10, 16);
                ctx.moveTo(8, -4);
                ctx.lineTo(10, 16);
                ctx.stroke();

                // Body suit
                ctx.fillStyle = this.isOut ? '#57586c' : this.palette.suit;
                ctx.beginPath();
                ctx.roundRect(-16, -58, 32, 56, 16);
                ctx.fill();

                // Chest stripe
                if (!this.isOut) {
                    ctx.fillStyle = this.palette.trim;
                    ctx.beginPath();
                    ctx.roundRect(-13, -42, 26, 10, 5);
                    ctx.fill();
                }

                // Head
                ctx.fillStyle = this.isOut ? '#6d7382' : this.palette.trim;
                ctx.beginPath();
                ctx.arc(0, -66, 16, 0, Math.PI * 2);
                ctx.fill();

                // Visor
                if (!this.isOut) {
                    ctx.fillStyle = this.palette.visor;
                    ctx.beginPath();
                    ctx.roundRect(-10, -70, 20, 8, 4);
                    ctx.fill();

                    // Eyes / expression
                    ctx.fillStyle = '#0b1020';
                    ctx.beginPath();
                    ctx.arc(-4.5, -66, 1.8, 0, Math.PI * 2);
                    ctx.arc(4.5, -66, 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#0b1020';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    if (this.isPlayer) {
                        ctx.arc(0, -60, 5, 0.15, Math.PI - 0.15);
                    } else {
                        ctx.moveTo(-4, -59);
                        ctx.lineTo(4, -59);
                    }
                    ctx.stroke();
                }

                // Arms
                ctx.strokeStyle = this.isOut ? '#444a55' : this.palette.trim;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(-16, -38);
                ctx.lineTo(-26, -18);
                ctx.moveTo(16, -38);
                ctx.lineTo(26, -18);
                ctx.stroke();

                // Player Indicator
                if (this.isPlayer && !this.isOut) {
                    ctx.fillStyle = PLAYER_THEME.tag;
                    ctx.font = '700 16px "Rajdhani"';
                    ctx.textAlign = 'center';
                    ctx.fillText('ACE', 0, -90);

                    ctx.fillStyle = PLAYER_THEME.visor;
                    ctx.beginPath();
                    ctx.moveTo(0, -82);
                    ctx.lineTo(-7, -94);
                    ctx.lineTo(7, -94);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function initGame() {
            characters = [];
            playerAlive = true;
            ropeAngle = -Math.PI / 2;
            ropeSpeed = baseRopeSpeed;
            aliveCount = 10;

            for (let i = 0; i < 10; i++) {
                characters.push(new Character(i, i === playerIndex));
            }

            resize();
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('alive-count').innerText = aliveCount;
            const dangerWindow = Math.sin(ropeAngle) > 0.65;
            beatStatus.innerText = dangerWindow ? 'Jump!' : 'Steady';
            beatStatus.className = dangerWindow ? 'text-red-500' : 'text-yellow-400';
        }

        function gameLoop() {
            if (!gameActive) return;

            frameCount++;
            ctx.clearRect(0, 0, width, height);
            drawBackground();

            ropeSpeed += 0.00005;
            ropeAngle += ropeSpeed;
            if (ropeAngle > Math.PI * 2) ropeAngle -= Math.PI * 2;
            updateHUD();

            const ropeYFactor = Math.sin(ropeAngle);
            const ropeHeight = 150;
            const ropeRealY = groundY - (ropeHeight * -ropeYFactor);
            const isRopeDangerous = ropeYFactor > 0.85;

            let activeChars = 0;
            characters.forEach(c => {
                c.update();
                if (!c.isOut) {
                    activeChars++;
                    if (isRopeDangerous && !c.isJumping && !c.isOut) {
                        c.isOut = true;
                        c.vy = -5;
                        c.isJumping = true;
                        audio.playSFX(c.isPlayer ? 'fail' : 'danger', c.isPlayer ? 0.62 : 0.18, c.isPlayer ? 400 : 180);
                        if (c.isPlayer) {
                            playerAlive = false;
                            showStatus('Beat missed!', 'fail', 1400);
                            showReaction('fail');
                            setTimeout(endGame, 1000);
                        }
                    }
                }
            });

            if (aliveCount !== activeChars) {
                aliveCount = activeChars;
                updateHUD();
            }

            if (aliveCount === 1 && playerAlive) {
                audio.playSFX('win', 0.66, 500);
                showStatus('Showdown cleared!', 'success', 1700);
                showReaction('victory');
                endGame(true);
                return;
            } else if (aliveCount === 0) {
                endGame(false);
                return;
            }

            const margin = width * 0.1;
            const spacing = (width - margin * 2) / 9;
            const startX = margin - 50;
            const endX = margin + (spacing * 9) + 50;

            // Posts (neon pylons)
            drawPost(startX, ropeRealY);
            drawPost(endX, ropeRealY);

            const controlY = (groundY - 60) + (ropeYFactor * 250);
            const ropeInFront = ropeYFactor > 0;

            if (!ropeInFront) {
                drawRopeCurve(startX, endX, controlY);
            }

            characters.forEach((c, i) => {
                c.draw(ctx, margin + i * spacing);
            });

            if (ropeInFront) {
                drawRopeCurve(startX, endX, controlY);
            }

            requestAnimationFrame(gameLoop);
        }

        function drawPost(x, ropeRealY) {
            const postGrad = ctx.createLinearGradient(x, groundY - 118, x, groundY);
            postGrad.addColorStop(0, '#8df7ff');
            postGrad.addColorStop(0.18, '#3556b6');
            postGrad.addColorStop(1, '#161331');
            ctx.fillStyle = postGrad;
            ctx.beginPath();
            ctx.roundRect(x - 11, groundY - 112, 22, 112, 10);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.fillRect(x - 4, groundY - 104, 4, 80);

            ctx.strokeStyle = 'rgba(134, 243, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, groundY - 112);
            ctx.lineTo(x, ropeRealY - 20);
            ctx.stroke();
            ctx.lineWidth = 1;
        }

        function drawRopeCurve(x1, x2, cy) {
            ctx.beginPath();
            ctx.moveTo(x1, groundY - 60);
            ctx.quadraticCurveTo((x1 + x2) / 2, cy, x2, groundY - 60);
            ctx.lineWidth = 10;
            ctx.strokeStyle = 'rgba(255, 215, 108, 0.18)';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x1, groundY - 60);
            ctx.quadraticCurveTo((x1 + x2) / 2, cy, x2, groundY - 60);
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffd76c';
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(255, 215, 108, 0.55)';
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 1;
        }

        function endGame(victory = false) {
            gameActive = false;
            audio.stopBGM();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');

            const title = document.getElementById('go-title');
            const rank = document.getElementById('finalRank');

            if (victory) {
                title.innerText = "SHOWDOWN CLEARED";
                title.className = "text-5xl font-bold text-yellow-400 mb-4 drop-shadow-lg title-text";
                rank.innerText = "SOLE SURVIVOR";
                rank.className = "font-bold text-yellow-400";
                showReaction('victory');
            } else {
                title.innerText = "YOU MISSED THE BEAT";
                title.className = "text-5xl font-bold text-red-500 mb-4 drop-shadow-lg title-text";
                rank.innerText = "#" + (aliveCount + 1);
                rank.className = "font-bold text-white";
                showReaction('fail');
            }
        }

        /** 6. CONTROLS */
        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
            if (gameActive && playerAlive) {
                characters[playerIndex].jump();
            }
        }

        document.getElementById('start-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('uiStart', 0.46, 0);
            audio.playBGM();
            clearReaction();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('uiClick', 0.42, 0);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            clearReaction();
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        window.addEventListener('keydown', handleInput);
        window.addEventListener('touchstart', () => {
            if (gameActive && playerAlive) characters[playerIndex].jump();
        }, { passive: false });
        window.addEventListener('mousedown', () => {
            if (gameActive && playerAlive) characters[playerIndex].jump();
        });

        resize();
    });
    </script>
</body>
</html>
