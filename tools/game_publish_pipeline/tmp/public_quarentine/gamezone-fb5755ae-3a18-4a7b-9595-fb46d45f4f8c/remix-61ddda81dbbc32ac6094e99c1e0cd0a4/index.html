<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Skyline Sprint: Courier Shift v1.4</title>
<script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    /* CORE SETUP */
    :root {
        --c-bg: #070b18;
        --c-bg-deep: #030611;
        --c-panel: rgba(12, 22, 43, 0.88);
        --c-panel-strong: rgba(24, 39, 71, 0.96);
        --c-line: #63f3ff;
        --c-line-soft: rgba(99, 243, 255, 0.25);
        --c-accent: #55d9ff;
        --c-accent-2: #8b5cf6;
        --c-warn: #ff5f7e;
        --c-gold: #ffd24d;
        --c-text: #f8fbff;
        --c-muted: #98a7c6;
        --font-display: 'Audiowide', system-ui, sans-serif;
        --font-ui: 'Rajdhani', system-ui, sans-serif;
        --safe-top: env(safe-area-inset-top, 20px);
        --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    
    html, body { 
        width: 100%; height: 100%; margin: 0; padding: 0; 
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(85, 217, 255, 0.15), transparent 34%),
            radial-gradient(circle at bottom, rgba(139, 92, 246, 0.18), transparent 30%),
            linear-gradient(180deg, var(--c-bg) 0%, var(--c-bg-deep) 100%);
        font-family: var(--font-ui);
        -webkit-user-select: none; user-select: none;
        touch-action: manipulation;
        color: var(--c-text);
    }
    
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* UI COMPONENTS */
    .panel { 
        background:
            linear-gradient(180deg, rgba(17, 28, 54, 0.96), rgba(7, 14, 31, 0.96)),
            var(--c-panel);
        border: 2px solid var(--c-line-soft);
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.06) inset,
            0 12px 28px rgba(0,0,0,0.48),
            0 0 26px rgba(85, 217, 255, 0.16);
        border-radius: 24px;
        backdrop-filter: blur(10px);
    }
    
    .btn { 
        position: relative;
        border: none; outline: none;
        font-family: var(--font-display);
        font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.08em;
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        touch-action: manipulation;
        cursor: pointer;
    }
    
    .btn:active { 
        transform: translateY(2px) scale(0.98);
        box-shadow: 0 0 0 transparent !important;
        filter: brightness(1.05);
    }

    .btn-primary {
        background: linear-gradient(180deg, #69e6ff, #2790ff);
        color: #02111f;
        border: 2px solid rgba(255,255,255,0.35);
        box-shadow: 0 8px 18px rgba(39, 144, 255, 0.38);
        border-radius: 16px;
    }

    .btn-accent {
        background: linear-gradient(180deg, #ff7da2, #ff4f7c);
        color: white;
        border: 2px solid rgba(255,255,255,0.32);
        box-shadow: 0 8px 18px rgba(255, 79, 124, 0.32);
        border-radius: 16px;
    }
    
    .btn-icon {
        background: linear-gradient(180deg, rgba(56, 77, 120, 0.95), rgba(22, 34, 63, 0.95));
        color: white;
        border: 1px solid rgba(121, 220, 255, 0.24);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.34);
        border-radius: 12px;
    }

    .btn-level {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        height: 5rem;
        border-width: 2px;
        display: flex;
        align-items: center;
        padding: 0 1.25rem;
        color: white;
        text-align: left;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 10px 18px rgba(0,0,0,0.22);
    }

    .btn-level::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.13), transparent);
        transform: translateX(-100%);
        transition: transform 0.5s ease;
    }

    .btn-level:hover::after,
    .btn-level:focus-visible::after {
        transform: translateX(100%);
    }

    .hidden { display: none !important; }
    
    /* ANIMATIONS */
    @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes title-glow { 0%, 100% { text-shadow: 0 0 8px rgba(85,217,255,0.3), 0 0 16px rgba(139,92,246,0.18); } 50% { text-shadow: 0 0 14px rgba(85,217,255,0.55), 0 0 22px rgba(139,92,246,0.32); } }
    .anim-bounce { animation: bounce-slow 3s infinite ease-in-out; }

    .safe-pt { padding-top: var(--safe-top); }
    .safe-pb { padding-bottom: var(--safe-bottom); }
    .scroll-y { overflow-y: auto; max-height: 60vh; -webkit-overflow-scrolling: touch; }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(4, 8, 20, 0.7), rgba(4, 8, 20, 0.12));
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    #game-container::before {
        background:
            linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 100% 32px, 32px 100%;
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), transparent 75%);
        opacity: 0.35;
    }

    #game-container::after {
        background: radial-gradient(circle at 50% 0%, rgba(85,217,255,0.08), transparent 48%);
    }

    #menu-screen,
    #news-screen,
    #level-screen,
    #char-screen,
    #settings-screen,
    #pause-screen,
    #game-over-screen,
    #victory-screen {
        position: relative;
        overflow: hidden;
    }

    #menu-screen::before,
    #news-screen::before,
    #level-screen::before,
    #char-screen::before,
    #settings-screen::before,
    #pause-screen::before,
    #game-over-screen::before,
    #victory-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(99,243,255,0.12), transparent 35%, rgba(139,92,246,0.15) 100%);
    }

    #menu-screen h1,
    #pause-screen h2,
    #game-over-screen h2,
    #victory-screen h2,
    #news-screen h2,
    #level-screen h2,
    #char-screen h2,
    #settings-screen h2 {
        font-family: var(--font-display);
        animation: title-glow 2.8s ease-in-out infinite;
    }

    #hud { gap: 0.55rem; }

    #bar-container-normal,
    #bar-container-boss {
        backdrop-filter: blur(8px);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 20px rgba(0,0,0,0.25);
    }

    #progress-fill {
        background: linear-gradient(90deg, #ffe45e, #ff9f43 55%, #ff5f7e);
    }

    #boss-fill {
        background: linear-gradient(90deg, #ff6a88, #ff3d71 60%, #7f1d1d);
    }

    #score-display {
        font-family: var(--font-display);
        color: var(--c-gold);
        text-shadow: 0 0 10px rgba(255, 210, 77, 0.45);
        letter-spacing: 0.06em;
    }

    #boss-hint {
        border: 1px solid rgba(99,243,255,0.25);
        box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        backdrop-filter: blur(8px);
    }

    #char-screen .runner-card {
        position: relative;
        box-shadow: 0 10px 18px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.16);
    }

    #char-screen .runner-card::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        border: 2px solid transparent;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    #char-screen .runner-card.is-selected::after {
        opacity: 1;
        border-color: rgba(255,255,255,0.9);
        box-shadow: 0 0 18px rgba(99,243,255,0.32);
    }

    @media (max-width: 480px) {
        #menu-screen,
        #news-screen,
        #level-screen,
        #char-screen,
        #settings-screen,
        #pause-screen,
        #game-over-screen,
        #victory-screen {
            width: min(20rem, 92vw);
        }

        #hud .score-pill {
            font-size: 1rem;
            padding: 0.35rem 0.85rem;
        }

        #btn-pause {
            width: 2.8rem;
            height: 2.8rem;
        }
    }
    .feedback-gif {
        position: absolute;
        width: min(34vw, 8rem);
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.28);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transform: translateY(12px) scale(0.9);
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        object-fit: cover;
        background: rgba(3, 6, 17, 0.4);
        z-index: 35;
    }

    .feedback-gif.is-active {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }

    #gif-hit {
        right: 0.75rem;
        top: calc(var(--safe-top) + 4.75rem);
    }

    #gif-win {
        left: 50%;
        bottom: calc(var(--safe-bottom) + 1rem);
        transform: translateX(-50%) translateY(12px) scale(0.9);
        width: min(52vw, 11rem);
    }

    #gif-win.is-active {
        transform: translateX(-50%) translateY(0) scale(1);
    }

    @media (max-width: 480px) {
        .feedback-gif {
            width: min(42vw, 7rem);
        }

        #gif-hit {
            top: calc(var(--safe-top) + 5.5rem);
            right: 0.5rem;
        }
    }
</style>
</head>
<body>

<!-- ASSETS -->
<div id="assets" style="display:none;">
    <img id="asset_bg_sunset" src="https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/desert.png">
    <!-- [agent-note][stage3] resolved-audio: menu/game/ui/fail/powerup -> catalogs/audios.json -->
    <audio id="bgm_menu" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" loop preload="auto"></audio>
    <audio id="bgm_game" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
    <audio id="sfx_coin" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
    <audio id="sfx_land" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_pause" src="https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3" preload="auto"></audio>
    <audio id="sfx_resume" src="https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3" preload="auto"></audio>
    <audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
    <audio id="sfx_powerup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3" preload="auto"></audio>
</div>

<!-- GAME CONTAINER -->
<div id="game-container" class="relative w-full h-full bg-slate-900 overflow-hidden">
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: hit/win feedback overlays -> catalogs/gifs.json -->
    <img id="gif-hit" class="feedback-gif" alt="impact feedback" src="https://i.giphy.com/y3XLMfoP3fHrawyNXH.webp">
    <img id="gif-win" class="feedback-gif" alt="victory feedback" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp">

    <!-- UI LAYER -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center safe-pt safe-pb">
        
        <!-- MAIN MENU -->
        <div id="menu-screen" class="panel p-8 text-center pointer-events-auto flex flex-col gap-6 w-80 max-w-[90%] anim-bounce relative">
            
            <!-- NEW UPDATE BUTTON -->
            <button id="btn-news" class="absolute -top-6 -right-4 btn btn-accent w-14 h-14 rounded-full flex items-center justify-center text-2xl animate-pulse z-10 shadow-lg border-white">
                🔔
            </button>

            <div>
                <h1 class="text-5xl font-black text-yellow-400 drop-shadow-md tracking-tighter" data-i18n="title">SKYLINE SPRINT</h1>
                <div class="mt-3 text-xs uppercase tracking-[0.35em] text-cyan-200 font-bold">Neon Courier League</div>
                <p class="text-slate-400 text-sm font-bold uppercase tracking-widest mt-1" data-i18n="subtitle">Courier Run to the Finish</p>
            </div>
            
            <button id="btn-play-menu" class="btn btn-primary py-5 text-2xl w-full" data-i18n="play">START</button>
            
            <div class="flex gap-3 w-full">
                <button id="btn-chars" class="btn btn-icon flex-1 py-4 flex flex-col items-center gap-1">
                    <span class="text-2xl">🦸</span>
                    <span class="text-xs font-bold" data-i18n="hero">RUNNER</span>
                </button>
                <button id="btn-settings" class="btn btn-icon flex-1 py-4 flex flex-col items-center gap-1">
                    <span class="text-2xl">⚙️</span>
                    <span class="text-xs font-bold" data-i18n="setup">SETTINGS</span>
                </button>
            </div>
        </div>

        <!-- NEWS / UPDATE MODAL -->
        <div id="news-screen" class="hidden panel p-6 text-center pointer-events-auto w-80 max-w-[95%] border-emerald-500 relative">
            <div class="absolute -top-5 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-4 py-1 rounded-full font-black text-sm border-2 border-emerald-700">v1.4</div>
            <h2 class="text-2xl font-black mb-4 text-emerald-400 mt-2" data-i18n="news_title">SECTOR NOTES</h2>
            <div class="bg-slate-800 p-4 rounded-xl text-left mb-4 border-2 border-slate-700">
                <ul class="list-disc list-inside text-slate-200 space-y-2 font-bold text-sm">
                    <li data-i18n="news_1">Sector 4: Drone Core</li>
                    <li data-i18n="news_2">Sector 5: Storm Factory</li>
                    <li data-i18n="news_3">Route fixes</li>
                </ul>
            </div>
            <button id="btn-close-news" class="btn btn-primary w-full py-3" data-i18n="ok">GOT IT</button>
        </div>

        <!-- LEVEL SELECT -->
        <div id="level-screen" class="hidden panel p-6 text-center pointer-events-auto w-80 max-w-[95%] flex flex-col max-h-[85vh]">
            <h2 class="text-2xl font-black mb-4 text-white uppercase" data-i18n="select_act">Select Sector</h2>
            <div class="grid grid-cols-1 gap-3 scroll-y px-1 pb-2">
                <!-- ACT 1 -->
                <button id="lvl-1" class="btn btn-level border-sky-600 bg-sky-500 shadow-[4px_4px_0px_#0369a1]">
                    <div class="flex-1">
                        <div class="text-xs font-bold uppercase opacity-80">Act 1</div>
                        <div class="text-xl font-black" data-i18n="morning">DAWN ROUTE</div>
                    </div>
                    <span class="text-3xl">☀️</span>
                </button>
                
                <!-- ACT 2 -->
                <button id="lvl-2" class="btn btn-level border-orange-600 bg-orange-500 shadow-[4px_4px_0px_#c2410c]">
                    <div class="flex-1">
                        <div class="text-xs font-bold uppercase opacity-80">Act 2</div>
                        <div class="text-xl font-black" data-i18n="sunset">DUSK ROUTE</div>
                    </div>
                    <span class="text-3xl">🌅</span>
                </button>

                <!-- ACT 3 -->
                <button id="lvl-3" class="btn btn-level border-indigo-900 bg-indigo-950 shadow-[4px_4px_0px_#1e1b4b]">
                    <div class="flex-1">
                        <div class="text-xs font-bold uppercase opacity-80">Act 3</div>
                        <div class="text-xl font-black" data-i18n="night">NIGHT RUN</div>
                    </div>
                    <span class="text-3xl">🌙</span>
                </button>

                <!-- ACT 4 BOSS -->
                <button id="lvl-4" class="btn btn-level border-red-800 bg-red-700 shadow-[4px_4px_0px_#7f1d1d]">
                    <div class="flex-1">
                        <div class="text-xs font-bold uppercase opacity-80">Act 4</div>
                        <div class="text-xl font-black" data-i18n="boss">DRONE CORE</div>
                    </div>
                    <span class="text-3xl">🟥</span>
                </button>

                <!-- ACT 5 FACTORY -->
                <button id="lvl-5" class="btn btn-level border-slate-600 bg-slate-500 shadow-[4px_4px_0px_#334155]">
                    <div class="flex-1">
                        <div class="text-xs font-bold uppercase opacity-80">Act 5</div>
                        <div class="text-xl font-black" data-i18n="factory">STORM YARD</div>
                    </div>
                    <span class="text-3xl">🏭</span>
                </button>
            </div>
            <button id="btn-back-level" class="mt-4 text-slate-400 hover:text-white font-bold py-2 px-6 uppercase" data-i18n="back">BACK</button>
        </div>

        <!-- CHARACTER SELECT -->
        <div id="char-screen" class="hidden panel p-6 text-center pointer-events-auto w-80">
            <h2 class="text-2xl font-black mb-6 uppercase" data-i18n="choose_hero">Choose Runner</h2>
            <div class="flex justify-center gap-4 mb-8">
                <div id="char-0" class="runner-card is-selected w-20 h-20 bg-red-500 rounded-xl border-4 border-white shadow-lg cursor-pointer transform hover:scale-105 transition flex items-center justify-center text-3xl">🟥</div>
                <div id="char-1" class="runner-card w-20 h-20 bg-blue-500 rounded-full border-4 border-transparent opacity-50 shadow-lg cursor-pointer transform hover:scale-105 transition flex items-center justify-center text-3xl">🔵</div>
                <div id="char-2" class="runner-card w-20 h-20 bg-yellow-400 rounded-lg border-4 border-transparent opacity-50 shadow-lg cursor-pointer transform hover:scale-105 transition rotate-6 flex items-center justify-center text-3xl">⭐</div>
            </div>
            <button id="btn-back-char" class="btn btn-primary px-8 py-3 w-full" data-i18n="confirm">CONFIRM</button>
        </div>

        <!-- SETTINGS -->
        <div id="settings-screen" class="hidden panel p-6 text-center pointer-events-auto w-80">
            <h2 class="text-2xl font-black mb-6 uppercase" data-i18n="settings">Settings</h2>
            <div class="bg-slate-800 rounded-xl p-4 mb-4 border-2 border-slate-700">
                <button id="btn-toggle-sound" class="btn w-full bg-emerald-500 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1">
                    <span id="snd-icon">🔊</span> <span id="snd-text" data-i18n="sound_on">Sound: ON</span>
                </button>
            </div>
            <div class="bg-slate-800 rounded-xl p-4 mb-6 border-2 border-slate-700">
                <div class="flex gap-2">
                    <button class="lang-btn btn flex-1 bg-slate-600 py-2 rounded-lg text-sm font-bold border-b-4 border-slate-800 active:border-b-0 active:translate-y-1" data-lang="en">ENGLISH</button>
                    <button class="lang-btn btn flex-1 bg-indigo-500 py-2 rounded-lg text-sm font-bold border-b-4 border-indigo-700 active:border-b-0 active:translate-y-1" data-lang="es">ESPAÑOL</button>
                </div>
            </div>
            <button id="btn-back-settings" class="btn text-slate-400 hover:text-white font-bold py-2" data-i18n="back">BACK</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 flex flex-col items-center pointer-events-none safe-pt">
            <!-- Progress Bar (Normal) -->
            <div id="bar-container-normal" class="w-64 max-w-[80%] h-6 bg-slate-800 rounded-full overflow-hidden border-2 border-slate-600 mb-3">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-yellow-400 to-orange-500 w-0 transition-all duration-100 ease-linear"></div>
            </div>
            
            <!-- Boss HP Bar (Act 4 only) -->
            <div id="bar-container-boss" class="hidden w-64 max-w-[80%] h-8 bg-slate-900 rounded-lg overflow-hidden border-2 border-red-500 mb-3 relative">
                <div id="boss-fill" class="h-full bg-red-600 w-full transition-all duration-100 ease-linear"></div>
                <div class="absolute inset-0 flex items-center justify-center text-xs font-black text-white uppercase tracking-widest drop-shadow-md">CORE</div>
            </div>

            <div class="flex justify-between w-full px-2 items-center">
                <div class="score-pill bg-slate-800 border-2 border-slate-600 px-4 py-1 rounded-full text-xl font-black text-yellow-400 shadow-md">
                    <span id="score-display">0</span>
                </div>
                <button id="btn-pause" class="pointer-events-auto bg-slate-800 border-2 border-slate-600 text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl active:scale-90 transition">||</button>
            </div>
            
            <!-- Boss Tutorial Hint -->
            <div id="boss-hint" class="hidden mt-20 bg-black/50 px-4 py-2 rounded text-white font-bold text-center animate-pulse">
                <span data-i18n="boss_hint">Slide to Dodge • Tap to Vault</span>
            </div>
        </div>

        <!-- PAUSE MENU -->
        <div id="pause-screen" class="hidden panel p-8 text-center pointer-events-auto w-72">
            <h2 class="text-3xl font-black mb-6 text-yellow-400" data-i18n="paused">PAUSED</h2>
            <div class="flex flex-col gap-4">
                <button id="btn-resume" class="btn btn-primary py-3 text-lg" data-i18n="resume">RESUME</button>
                <button id="btn-quit" class="btn btn-accent py-3 text-lg" data-i18n="quit">QUIT</button>
            </div>
        </div>

        <!-- GAME OVER -->
        <div id="game-over-screen" class="hidden panel p-8 text-center pointer-events-auto w-80 max-w-[90%] border-red-500">
            <h2 class="text-4xl font-black text-red-500 mb-2 drop-shadow-sm" data-i18n="crashed">ROUTE LOST!</h2>
            <div class="flex gap-4 justify-center mt-6">
                <button id="btn-home-fail" class="btn btn-icon w-16 h-16 rounded-full text-2xl">🏠</button>
                <button id="btn-restart-fail" class="btn btn-primary w-24 h-16 rounded-full font-bold text-3xl">↺</button>
            </div>
        </div>

        <!-- VICTORY -->
        <div id="victory-screen" class="hidden panel p-8 text-center pointer-events-auto w-80 max-w-[90%] border-yellow-400">
            <div class="text-6xl mb-2">🏆</div>
            <h2 class="text-4xl font-black text-yellow-400 mb-2" data-i18n="goal">DELIVERY MADE!</h2>
            <div class="flex gap-4 justify-center mt-6">
                <button id="btn-home-win" class="btn btn-icon w-16 h-16 rounded-full text-2xl">🏠</button>
                <button id="btn-restart-win" class="btn btn-primary w-24 h-16 rounded-full font-bold text-3xl">➜</button>
            </div>
        </div>

    </div>
</div>

<script>
/**
 * SKYLINE SPRINT - courier remix v1.4
 */

// --- LOCALIZATION ---
const LANG = {
    current: 'es', 
    data: {
        en: {
            title: "SKYLINE SPRINT", subtitle: "Courier Run to the Finish", play: "START",
            hero: "RUNNER", setup: "SETTINGS", select_act: "SELECT SECTOR",
            morning: "DAWN ROUTE", sunset: "DUSK ROUTE", night: "NIGHT RUN",
            boss: "DRONE CORE", factory: "STORM YARD",
            back: "BACK", choose_hero: "CHOOSE RUNNER", confirm: "CONFIRM",
            settings: "SETTINGS", sound_on: "Sound: ON", sound_off: "Sound: OFF",
            paused: "PAUSED", resume: "RESUME", quit: "QUIT",
            crashed: "ROUTE LOST!", goal: "DELIVERY MADE!", boss_hint: "Slide to Dodge • Tap to Vault",
            news_title: "SECTOR NOTES", news_1: "Sector 4: Drone Core", news_2: "Sector 5: Storm Factory", news_3: "Route fixes", ok: "GOT IT"
        },
        es: {
            title: "SKYLINE SPRINT", subtitle: "Courier Run to the Finish", play: "START",
            hero: "RUNNER", setup: "SETTINGS", select_act: "SELECT SECTOR",
            morning: "DAWN ROUTE", sunset: "DUSK ROUTE", night: "NIGHT RUN",
            boss: "DRONE CORE", factory: "STORM YARD",
            back: "BACK", choose_hero: "CHOOSE RUNNER", confirm: "CONFIRM",
            settings: "SETTINGS", sound_on: "Sound: ON", sound_off: "Sound: OFF",
            paused: "PAUSED", resume: "RESUME", quit: "QUIT",
            crashed: "ROUTE LOST!", goal: "DELIVERY MADE!", boss_hint: "Slide to Dodge • Tap to Vault",
            news_title: "SECTOR NOTES", news_1: "Sector 4: Drone Core", news_2: "Sector 5: Storm Factory", news_3: "Route fixes", ok: "GOT IT"
        }
    },
    update() {
        const dict = this.data[this.current];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) el.innerText = dict[key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
            const isActive = btn.dataset.lang === this.current;
            btn.className = `lang-btn btn flex-1 py-2 rounded-lg text-sm font-bold border-b-4 active:border-b-0 active:translate-y-1 ${isActive ? 'bg-indigo-500 border-indigo-700' : 'bg-slate-600 border-slate-800'}`;
        });
    }
};

// --- CONFIGURATION ---
const CONFIG = {
    gravity: 0.7,
    jumpForce: 13,
    baseSpeed: 6,
    levels: {
        1: { id: 1, type: 'runner', goal: 2000, color: "#38bdf8", ground: "#166534", track: "game", rate: 1.0 },
        2: { id: 2, type: 'runner', goal: 3000, color: "#1e1b4b", ground: "#451a03", track: "game", rate: 0.85 },
        3: { id: 3, type: 'runner', goal: 4000, color: "#020617", ground: "#0f172a", track: "game", rate: 0.65 },
        4: { id: 4, type: 'boss',   goal: 100,  color: "#450a0a", ground: "#7f1d1d", track: "game", rate: 0.6 }, 
        5: { id: 5, type: 'runner', goal: 4000, color: "#475569", ground: "#334155", track: "game", rate: 0.5 } // Gray factory
    }
};

// --- STATE ---
const State = {
    screen: 'menu',
    level: 1,
    isPlaying: false,
    isPaused: false,
    score: 0,
    distance: 0,
    frames: 0,
    soundOn: true,
    hero: { type: 0, color: '#ef4444' },
    stars: [],
    rain: [],
    clouds: [],
    boss: { hp: 100, maxHp: 100, x: 0, y: 50, dir: 1, phase: 0 },
    dragX: null
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    tracks: {},
    factoryInterval: null,
    uiCooldown: 0,
    sfxCooldowns: Object.create(null),
    
    init() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.tracks.menu = document.getElementById('bgm_menu');
        this.tracks.game = document.getElementById('bgm_game');
        this.tracks.fail = document.getElementById('sfx_fail');
        this.tracks.coin = document.getElementById('sfx_coin');
        this.tracks.jump = document.getElementById('sfx_jump');
        this.tracks.land = document.getElementById('sfx_land');
        this.tracks.ui = document.getElementById('sfx_ui');
        this.tracks.pause = document.getElementById('sfx_pause');
        this.tracks.resume = document.getElementById('sfx_resume');
        this.tracks.win = document.getElementById('sfx_win');
        this.tracks.powerup = document.getElementById('sfx_powerup');
    },

    unlock() {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    playBGM(type, rate = 1.0) {
        if (!State.soundOn) return;
        this.stopBGM();
        
        let track = (type === 'menu') ? this.tracks.menu : this.tracks.game;
        if (track) {
            track.currentTime = 0;
            track.volume = 0.2;
            track.playbackRate = rate; 
            track.play().catch(() => {});
        }
        
        if (State.level === 5 && type === 'game') {
            this.startFactorySound();
        }
    },

    stopBGM() {
        this.tracks.menu.pause();
        this.tracks.game.pause();
        this.stopFactorySound();
    },

    playSFX(type) {
        if (!State.soundOn) return;
        const now = performance.now();
        const cooldowns = {
            ui: 80,
            jump: 110,
            land: 120,
            coin: 90,
            powerup: 140,
            fail: 250,
            win: 220,
            pause: 120,
            resume: 120
        };
        const last = this.sfxCooldowns[type] || 0;
        if (now - last < (cooldowns[type] || 0)) return;
        this.sfxCooldowns[type] = now;

        const sfx = this.tracks[type];
        if (sfx) {
            sfx.pause();
            sfx.currentTime = 0;
            sfx.volume = ({
                ui: 0.45,
                jump: 0.55,
                land: 0.4,
                coin: 0.55,
                powerup: 0.62,
                fail: 0.68,
                win: 0.65,
                pause: 0.45,
                resume: 0.45
            })[type] || 0.6;
            sfx.playbackRate = 1.0;
            sfx.play().catch(() => {});
        } else {
            this.synthTone(400, 'sine');
        }
    },

    playUI() {
        this.playSFX('ui');
    },

    synthTone(freq, type='sine') {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.frequency.value = freq;
        osc.type = type;
        osc.start();
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
        osc.stop(this.ctx.currentTime + 0.1);
    },

    startFactorySound() {
        if (!this.ctx || !State.soundOn) return;
        this.stopFactorySound();
        const playClank = () => {
            if(!State.isPlaying || State.isPaused) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.15);
        };
        this.factoryInterval = setInterval(playClank, 800);
    },

    stopFactorySound() {
        if (this.factoryInterval) {
            clearInterval(this.factoryInterval);
            this.factoryInterval = null;
        }
    }
};

// --- GAME ENGINE ---
const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    player: { x: 50, y: 0, w: 40, h: 40, vy: 0, grounded: false },
    obstacles: [],
    particles: [],
    finishLine: null,
    
    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input Handling
        const startInput = (e) => {
            AudioSys.unlock();
            if (State.screen === 'menu') return;
            
            if (State.isPlaying && !State.isPaused) {
                // Jump Logic
                 if (this.player.grounded) {
                     this.player.vy = -CONFIG.jumpForce;
                     this.player.grounded = false;
                     this.spawnParticles(this.player.x + this.player.w/2, this.player.y + this.player.h, 10, '#fff');
                     AudioSys.playSFX('jump');
                 }
                
                // Act 4: Initialize Drag
                if (CONFIG.levels[State.level].type === 'boss') {
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    State.dragX = cx;
                }
            }
        };

        const moveInput = (e) => {
            if (State.isPlaying && !State.isPaused && CONFIG.levels[State.level].type === 'boss') {
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                if (State.dragX !== null) {
                    const dx = cx - State.dragX;
                    this.player.x += dx;
                    this.player.x = Math.max(0, Math.min(this.width - this.player.w, this.player.x));
                    State.dragX = cx;
                }
            }
        };

        const endInput = () => { State.dragX = null; };

        this.canvas.addEventListener('mousedown', startInput);
        this.canvas.addEventListener('mousemove', moveInput);
        this.canvas.addEventListener('mouseup', endInput);
        
        this.canvas.addEventListener('touchstart', startInput, {passive: false});
        this.canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveInput(e); }, {passive: false});
        this.canvas.addEventListener('touchend', endInput);

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    },

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    },

    reset(lvl) {
        State.level = lvl;
        State.score = 0;
        State.distance = 0;
        State.frames = 0;
        State.isPlaying = true;
        State.isPaused = false;
        
        const isBoss = CONFIG.levels[lvl].type === 'boss';
        
        this.player.y = 0;
        this.player.vy = 0;
        this.player.x = isBoss ? this.width / 2 - 20 : 50; 
        
        this.obstacles = [];
        this.particles = [];
        this.finishLine = null;
        
        // Act 4 Setup
        if (isBoss) {
            State.boss.hp = 100;
            State.boss.x = this.width / 2;
            State.boss.y = 80;
            State.boss.dir = 1;
            UI.toggleBossUI(true);
        } else {
            UI.toggleBossUI(false);
        }

        // Act 3 Stars
        if (lvl === 3) {
            State.stars = Array.from({length: 50}, () => ({
                x: Math.random() * this.width, y: Math.random() * (this.height - 150),
                r: Math.random() * 2, a: Math.random()
            }));
        }
        
        // Act 5 Rain & Clouds
        if (lvl === 5) {
            State.rain = Array.from({length: 120}, () => ({
                x: Math.random() * this.width, y: Math.random() * this.height,
                l: 15 + Math.random() * 25, s: 12 + Math.random() * 8
            }));
            State.clouds = Array.from({length: 6}, () => ({
                x: Math.random() * this.width, y: Math.random() * 200,
                r: 40 + Math.random() * 40, s: 0.2 + Math.random() * 0.3
            }));
        }
        
        UI.updateHUD();
        const lvlCfg = CONFIG.levels[lvl];
        AudioSys.playBGM(lvlCfg.track, lvlCfg.rate);
    },

    loop() {
        requestAnimationFrame(this.loop);
        if (State.isPlaying && !State.isPaused) {
            if (CONFIG.levels[State.level].type === 'boss') this.updateBossMode();
            else this.updateRunnerMode();
        }
        this.render();
    },

    // --- RUNNER MODE LOGIC ---
    updateRunnerMode() {
        State.frames++;
        const lvlConfig = CONFIG.levels[State.level];
        const speed = CONFIG.baseSpeed + (State.distance * 0.001);
        State.distance += speed * 0.1;
        
        // Win
        if (State.distance >= lvlConfig.goal && !this.finishLine) {
            this.finishLine = { x: this.width + 100 };
        }
        
        // Physics
        this.player.vy += CONFIG.gravity;
        this.player.y += this.player.vy;
        const groundY = this.height - 120;
         if (this.player.y + this.player.h > groundY) {
             const wasAirborne = !this.player.grounded && this.player.vy > 1.5;
             this.player.y = groundY - this.player.h;
             this.player.vy = 0;
             this.player.grounded = true;
             if (wasAirborne) AudioSys.playSFX('land');
         }

        // Spawn Obstacles
        if (!this.finishLine && State.frames % Math.max(50, 100 - Math.floor(speed * 2)) === 0) {
            if (Math.random() > 0.3) {
                const type = Math.random() > 0.6 ? 'bird' : 'box';
                this.obstacles.push({
                    x: this.width,
                    y: type === 'bird' ? groundY - 110 : groundY - 50,
                    w: 50, h: 50,
                    type: type, passed: false
                });
            }
        }

        // Update Obstacles
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let ob = this.obstacles[i];
            ob.x -= speed;
            if (this.checkRectCollide(this.player, ob)) this.gameOver();
            if (!ob.passed && ob.x + ob.w < this.player.x) {
                State.score += 10;
                ob.passed = true;
                UI.updateHUD();
                AudioSys.playSFX('coin');
            }
            if (ob.x < -100) this.obstacles.splice(i, 1);
        }

        // Finish Line
        if (this.finishLine) {
            this.finishLine.x -= speed;
            if (this.finishLine.x < this.player.x) this.victory();
        }

        this.updateParticles();
        if (State.level === 5) {
            this.updateRain();
            this.updateClouds();
        }
        
        UI.updateProgress(State.distance / lvlConfig.goal);
    },

    // --- BOSS MODE LOGIC ---
    updateBossMode() {
        State.frames++;
        
        this.player.vy += CONFIG.gravity;
        this.player.y += this.player.vy;
        const groundY = this.height - 120;
        
        if (this.player.y + this.player.h > groundY) {
            this.player.y = groundY - this.player.h;
            this.player.vy = 0;
            this.player.grounded = true;
        }

        // Boss Movement
        State.boss.x += 3 * State.boss.dir;
        if (State.boss.x < 50 || State.boss.x > this.width - 50) State.boss.dir *= -1;

        // Boss Attacks (Drop Cubes)
        if (State.frames % 60 === 0) {
            this.obstacles.push({
                x: State.boss.x, y: State.boss.y + 40,
                w: 40, h: 40, type: 'cube_bad', vy: 5
            });
        }

        // Boss Drops Powerups
        if (State.frames % 140 === 0) {
            this.obstacles.push({
                x: Math.random() * (this.width - 60) + 30, y: -50,
                w: 30, h: 30, type: 'powerup', vy: 4
            });
        }

        // Update Objects
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let ob = this.obstacles[i];
            ob.y += ob.vy;
            
            if (this.checkRectCollide(this.player, ob)) {
                if (ob.type === 'cube_bad') {
                    this.gameOver();
                } else if (ob.type === 'powerup') {
                     State.boss.hp -= 20; 
                     State.score += 50;
                     AudioSys.playSFX('powerup');
                    this.spawnParticles(ob.x, ob.y, 10, '#fbbf24');
                    this.obstacles.splice(i, 1);
                    UI.updateBossBar();
                    UI.updateHUD();
                    
                    if (State.boss.hp <= 0) this.victory();
                    continue;
                }
            }

            if (ob.y > this.height) this.obstacles.splice(i, 1);
        }

        this.updateParticles();
    },

    updateParticles() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life--;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    },

    updateRain() {
        State.rain.forEach(r => {
            r.y += r.s;
            if (r.y > this.height) {
                r.y = -20;
                r.x = Math.random() * this.width;
            }
        });
    },

    updateClouds() {
        State.clouds.forEach(c => {
            c.x -= c.s;
            if (c.x < -100) c.x = this.width + 100;
        });
    },

    render() {
        const w = this.width;
        const h = this.height;
        const lvl = State.level;
        const lvlCfg = CONFIG.levels[lvl];

        this.ctx.clearRect(0, 0, w, h);

        // --- BACKGROUNDS ---
        if (lvl === 1) {
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#38bdf8'); grad.addColorStop(1, '#bae6fd');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            this.ctx.fillStyle = '#fde047';
            this.ctx.beginPath(); this.ctx.arc(w - 60, 80, 40, 0, Math.PI*2); this.ctx.fill();
        } else if (lvl === 2) {
            const img = document.getElementById('asset_bg_sunset');
            if (img && img.complete) {
                const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
                const iw = img.naturalWidth * scale; const ih = img.naturalHeight * scale;
                this.ctx.drawImage(img, (w - iw)/2, (h - ih)/2, iw, ih);
            } else {
                this.ctx.fillStyle = '#7c2d12'; this.ctx.fillRect(0, 0, w, h);
            }
            this.ctx.fillStyle = 'rgba(76, 29, 149, 0.3)'; this.ctx.fillRect(0, 0, w, h);
        } else if (lvl === 3) {
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#020617'); grad.addColorStop(1, '#1e1b4b');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            this.ctx.fillStyle = '#fff';
            State.stars.forEach(s => {
                this.ctx.globalAlpha = s.a;
                this.ctx.beginPath(); this.ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); this.ctx.fill();
            });
            this.ctx.globalAlpha = 1.0;
        } else if (lvl === 4) { // BOSS
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#450a0a'); grad.addColorStop(1, '#000');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            // Boss Aura
            this.ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
            this.ctx.beginPath(); this.ctx.arc(w/2, h/2, w*0.8, 0, Math.PI*2); this.ctx.fill();
        } else if (lvl === 5) { // FACTORY OUTSIDE
            // Gray Sky
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#64748b'); grad.addColorStop(1, '#334155');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            
            // Background Smokestacks (Silhouettes)
            this.ctx.fillStyle = '#1e293b'; // Dark slate
            for(let i=0; i<w; i+=150) {
                const hStack = 200 + Math.sin(i)*50;
                this.ctx.fillRect(i - (State.distance * 0.2 % 300), h - 120 - hStack, 40, hStack);
                // Smoke
                this.ctx.fillStyle = 'rgba(255,255,255,0.1)';
                this.ctx.beginPath();
                this.ctx.arc(i - (State.distance * 0.2 % 300) + 20, h - 120 - hStack - 20, 20, 0, Math.PI*2);
                this.ctx.fill();
                this.ctx.fillStyle = '#1e293b';
            }

            // Clouds
            this.ctx.fillStyle = '#94a3b8';
            State.clouds.forEach(c => {
                this.ctx.beginPath(); this.ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); this.ctx.fill();
                this.ctx.beginPath(); this.ctx.arc(c.x + c.r, c.y + 10, c.r*0.8, 0, Math.PI*2); this.ctx.fill();
            });
        }

        // --- GAME ELEMENTS ---
        // Ground
        this.ctx.fillStyle = lvlCfg.ground;
        this.ctx.fillRect(0, h - 120, w, 120);
        this.ctx.fillStyle = 'rgba(0,0,0,0.3)';
        this.ctx.fillRect(0, h - 120, w, 10);

        if (State.isPlaying || State.screen === 'gameover' || State.screen === 'victory') {
            // Finish Line (Runner Only)
            if (this.finishLine) {
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(this.finishLine.x, h - 300, 10, 180);
                this.ctx.fillRect(this.finishLine.x + 100, h - 300, 10, 180);
                this.ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#fbbf24' : '#000';
                this.ctx.fillRect(this.finishLine.x, h - 300, 110, 40);
            }

            // Boss Entity (Act 4 - CUBE)
            if (lvl === 4) {
                const b = State.boss;
                const size = 80;
                
                // Draw Cube Body
                this.ctx.fillStyle = '#ef4444'; // Red base
                this.ctx.fillRect(b.x - size/2, b.y - size/2, size, size);
                
                // 3D effect border
                this.ctx.lineWidth = 4;
                this.ctx.strokeStyle = '#7f1d1d';
                this.ctx.strokeRect(b.x - size/2, b.y - size/2, size, size);

                // Face (Angry Square Face)
                this.ctx.fillStyle = '#000';
                // Left Eye
                this.ctx.fillRect(b.x - 25, b.y - 15, 15, 15);
                // Right Eye
                this.ctx.fillRect(b.x + 10, b.y - 15, 15, 15);
                // Mouth (Line)
                this.ctx.fillRect(b.x - 25, b.y + 15, 50, 8);
                
                // Eyebrows
                this.ctx.fillStyle = '#000';
                this.ctx.beginPath();
                this.ctx.moveTo(b.x - 30, b.y - 25);
                this.ctx.lineTo(b.x - 5, b.y - 10);
                this.ctx.lineTo(b.x - 5, b.y - 15);
                this.ctx.fill();
                
                this.ctx.beginPath();
                this.ctx.moveTo(b.x + 30, b.y - 25);
                this.ctx.lineTo(b.x + 5, b.y - 10);
                this.ctx.lineTo(b.x + 5, b.y - 15);
                this.ctx.fill();
            }

            // Player - polished courier silhouette only, no mechanic changes
            this.ctx.save();
            this.ctx.translate(this.player.x + this.player.w/2, this.player.y + this.player.h/2);
            const hoverBob = Math.sin(State.frames * 0.18) * 1.5;
            this.ctx.translate(0, hoverBob);
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = State.hero.color;

            if (State.hero.type === 1) {
                this.ctx.fillStyle = State.hero.color;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, this.player.w / 2, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.fillStyle = 'rgba(255,255,255,0.92)';
                this.ctx.beginPath();
                this.ctx.arc(-6, -5, 4, 0, Math.PI * 2);
                this.ctx.arc(6, -5, 4, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.fillStyle = '#03111f';
                this.ctx.beginPath();
                this.ctx.arc(-6, -5, 1.8, 0, Math.PI * 2);
                this.ctx.arc(6, -5, 1.8, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.arc(0, 5, 8, 0.15, Math.PI - 0.15);
                this.ctx.stroke();
                this.ctx.fillStyle = '#dbeafe';
                this.ctx.fillRect(-4, -18, 8, 10);
            } else if (State.hero.type === 2) {
                this.ctx.rotate(State.frames * 0.08);
                this.ctx.fillStyle = '#ffe15c';
                this.ctx.beginPath();
                for (let p = 0; p < 5; p++) {
                    const outer = (-Math.PI / 2) + (p * Math.PI * 2 / 5);
                    const inner = outer + Math.PI / 5;
                    this.ctx.lineTo(Math.cos(outer) * 18, Math.sin(outer) * 18);
                    this.ctx.lineTo(Math.cos(inner) * 8, Math.sin(inner) * 8);
                }
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
                this.ctx.fillStyle = '#5b21b6';
                this.ctx.beginPath();
                this.ctx.arc(0, 1, 4, 0, Math.PI * 2);
                this.ctx.fill();
            } else {
                this.ctx.fillStyle = State.hero.color;
                this.ctx.beginPath();
                this.ctx.roundRect(-this.player.w/2, -this.player.h/2 + 2, this.player.w, this.player.h - 2, 10);
                this.ctx.fill();
                this.ctx.fillStyle = '#e0f2fe';
                this.ctx.fillRect(-6, -18, 12, 9);
                this.ctx.fillStyle = '#03111f';
                this.ctx.fillRect(-11, -7, 7, 7);
                this.ctx.fillRect(4, -7, 7, 7);
                this.ctx.fillStyle = '#7dd3fc';
                this.ctx.fillRect(-8, 5, 16, 6);
                this.ctx.strokeStyle = 'rgba(255,255,255,0.72)';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(-this.player.w/2 + 3, -this.player.h/2 + 5, this.player.w - 6, this.player.h - 10);
            }
            this.ctx.restore();

            // Obstacles
            this.obstacles.forEach(ob => {
                this.ctx.save();
                this.ctx.shadowBlur = 10;
                if (ob.type === 'cube_bad') {
                    this.ctx.fillStyle = '#7f1d1d';
                    this.ctx.shadowColor = 'rgba(239,68,68,0.5)';
                } else if (ob.type === 'powerup') {
                    this.ctx.fillStyle = '#3b82f6';
                    this.ctx.shadowColor = 'rgba(96,165,250,0.45)';
                } else {
                    this.ctx.fillStyle = ob.type === 'bird' ? '#f43f5e' : '#fbbf24';
                    this.ctx.shadowColor = ob.type === 'bird' ? 'rgba(244,63,94,0.35)' : 'rgba(251,191,36,0.35)';
                }
                
                if (ob.type === 'powerup') {
                    this.ctx.beginPath();
                    this.ctx.arc(ob.x + ob.w/2, ob.y + ob.h/2, ob.w/2, 0, Math.PI*2);
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#fff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                } else if (ob.type === 'bird') {
                    this.ctx.beginPath();
                    this.ctx.moveTo(ob.x + 4, ob.y + ob.h / 2);
                    this.ctx.lineTo(ob.x + ob.w / 2, ob.y + 6);
                    this.ctx.lineTo(ob.x + ob.w - 4, ob.y + ob.h / 2);
                    this.ctx.lineTo(ob.x + ob.w / 2, ob.y + ob.h - 6);
                    this.ctx.closePath();
                    this.ctx.fill();
                } else {
                    this.ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
                }
                this.ctx.restore();
            });

            // Particles
            this.particles.forEach(p => {
                this.ctx.fillStyle = p.color;
                this.ctx.globalAlpha = p.life / 20;
                this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); this.ctx.fill();
                this.ctx.globalAlpha = 1;
            });
            
            // Rain (Act 5)
            if (lvl === 5) {
                this.ctx.strokeStyle = 'rgba(200, 200, 220, 0.5)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                State.rain.forEach(r => {
                    this.ctx.moveTo(r.x, r.y);
                    this.ctx.lineTo(r.x, r.y + r.l);
                });
                this.ctx.stroke();
            }
        }
    },

    checkRectCollide(p, o) {
        const pad = 8;
        return (p.x + pad < o.x + o.w - pad &&
                p.x + p.w - pad > o.x + pad &&
                p.y + pad < o.y + o.h - pad &&
                p.y + p.h - pad > o.y + pad);
    },

    spawnParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                life: 20 + Math.random() * 10,
                color: color, r: 2 + Math.random() * 4
            });
        }
    },

    gameOver() {
        State.isPlaying = false;
        AudioSys.stopBGM();
        AudioSys.playSFX('fail');
        UI.showGif('hit', 1300);
        UI.showScreen('gameover');
    },

    victory() {
        State.isPlaying = false;
        AudioSys.stopBGM();
        AudioSys.playSFX('win');
        setTimeout(() => AudioSys.playSFX('coin'), 180);
        UI.showGif('win', 2200);
        UI.showScreen('victory');
        this.spawnParticles(this.width/2, this.height/2, 50, '#fbbf24');
    }
};

// --- UI MANAGER ---
const UI = {
    gifTimers: {},
    screens: {
        menu: document.getElementById('menu-screen'),
        news: document.getElementById('news-screen'),
        level: document.getElementById('level-screen'),
        char: document.getElementById('char-screen'),
        settings: document.getElementById('settings-screen'),
        hud: document.getElementById('hud'),
        pause: document.getElementById('pause-screen'),
        gameover: document.getElementById('game-over-screen'),
        victory: document.getElementById('victory-screen')
    },

    init() {
        const bind = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
        
        bind('btn-play-menu', () => { AudioSys.playUI(); this.showScreen('level'); });
        bind('btn-chars', () => { AudioSys.playUI(); this.showScreen('char'); });
        bind('btn-settings', () => { AudioSys.playUI(); this.showScreen('settings'); });
        bind('btn-news', () => { AudioSys.playUI(); this.showScreen('news'); });
        bind('btn-close-news', () => { AudioSys.playUI(); this.showScreen('menu'); });
        
        bind('btn-back-level', () => { AudioSys.playUI(); this.showScreen('menu'); });
        bind('btn-back-char', () => { AudioSys.playUI(); this.showScreen('menu'); });
        bind('btn-back-settings', () => { AudioSys.playUI(); this.showScreen('menu'); });
        
        bind('lvl-1', () => { AudioSys.playUI(); this.startGame(1); });
        bind('lvl-2', () => { AudioSys.playUI(); this.startGame(2); });
        bind('lvl-3', () => { AudioSys.playUI(); this.startGame(3); });
        bind('lvl-4', () => { AudioSys.playUI(); this.startGame(4); });
        bind('lvl-5', () => { AudioSys.playUI(); this.startGame(5); });
        
        bind('btn-pause', () => { State.isPaused = true; AudioSys.playSFX('pause'); this.showScreen('pause'); });
        bind('btn-resume', () => { State.isPaused = false; AudioSys.playSFX('resume'); this.showScreen('hud'); });
        bind('btn-quit', () => { AudioSys.playUI(); AudioSys.playBGM('menu'); this.showScreen('menu'); });
        
        bind('btn-home-fail', () => { AudioSys.playUI(); AudioSys.playBGM('menu'); this.showScreen('menu'); });
        bind('btn-home-win', () => { AudioSys.playUI(); AudioSys.playBGM('menu'); this.showScreen('menu'); });
        bind('btn-restart-fail', () => { AudioSys.playUI(); this.startGame(State.level); });
        bind('btn-restart-win', () => {
            AudioSys.playUI();
            let next = State.level + 1;
            if (next > 5) next = 1;
            this.startGame(next);
        });

        // Character Select
        [0,1,2].forEach(idx => {
            document.getElementById(`char-${idx}`).onclick = (e) => {
                State.hero.type = idx;
                State.hero.color = idx === 0 ? '#ef4444' : (idx === 1 ? '#3b82f6' : '#facc15');
            document.querySelectorAll('.runner-card').forEach(d => {
                d.style.opacity = '0.5';
                d.style.borderColor = 'transparent';
                d.classList.remove('is-selected');
            });
            e.currentTarget.style.opacity = '1';
            e.currentTarget.style.borderColor = 'white';
            e.currentTarget.classList.add('is-selected');
            };
        });

        // Settings
        bind('btn-toggle-sound', () => {
            State.soundOn = !State.soundOn;
            const dict = LANG.data[LANG.current];
            document.getElementById('snd-text').innerText = State.soundOn ? dict.sound_on : dict.sound_off;
            document.getElementById('snd-icon').innerText = State.soundOn ? "🔊" : "🔇";
            const btn = document.getElementById('btn-toggle-sound');
            btn.className = `btn w-full text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 border-b-4 active:border-b-0 active:translate-y-1 ${State.soundOn ? 'bg-emerald-500 border-emerald-700' : 'bg-red-500 border-red-700'}`;
            if (State.soundOn) AudioSys.playBGM('menu'); else AudioSys.stopBGM();
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.onclick = () => {
                LANG.current = btn.dataset.lang;
                LANG.update();
                const dict = LANG.data[LANG.current];
                document.getElementById('snd-text').innerText = State.soundOn ? dict.sound_on : dict.sound_off;
            };
        });
        
        LANG.update();
    },

    showScreen(id) {
        State.screen = id;
        Object.values(this.screens).forEach(s => s.classList.add('hidden'));
        if (this.screens[id]) this.screens[id].classList.remove('hidden');
        if (id === 'hud') {
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud').classList.add('flex');
        }
    },

    showGif(id, duration = 1600) {
        const el = document.getElementById(`gif-${id}`);
        if (!el) return;
        clearTimeout(this.gifTimers[id]);
        el.classList.add('is-active');
        this.gifTimers[id] = setTimeout(() => {
            el.classList.remove('is-active');
        }, duration);
    },

    startGame(lvl) {
        AudioSys.unlock();
        Game.reset(lvl);
        this.showScreen('hud');
        
        // Show tutorial hint for boss
        const hint = document.getElementById('boss-hint');
        if (lvl === 4) {
            hint.classList.remove('hidden');
            setTimeout(() => hint.classList.add('hidden'), 4000);
        } else {
            hint.classList.add('hidden');
        }
    },

    toggleBossUI(show) {
        const normal = document.getElementById('bar-container-normal');
        const boss = document.getElementById('bar-container-boss');
        if (show) {
            normal.classList.add('hidden');
            boss.classList.remove('hidden');
            this.updateBossBar();
        } else {
            normal.classList.remove('hidden');
            boss.classList.add('hidden');
        }
    },

    updateBossBar() {
        const pct = Math.max(0, State.boss.hp / State.boss.maxHp) * 100;
        document.getElementById('boss-fill').style.width = `${pct}%`;
    },

    updateHUD() {
        document.getElementById('score-display').innerText = State.score;
    },

    updateProgress(pct) {
        const p = Math.min(Math.max(pct, 0), 1) * 100;
        document.getElementById('progress-fill').style.width = `${p}%`;
    }
};

// --- BOOTSTRAP ---
window.onload = () => {
    AudioSys.init();
    Game.init();
    UI.init();
    document.body.addEventListener('pointerdown', () => {
        if (AudioSys.ctx && AudioSys.ctx.state === 'suspended') AudioSys.unlock();
    }, { once: true });
    setTimeout(() => AudioSys.playBGM('menu'), 500);
};
</script>
