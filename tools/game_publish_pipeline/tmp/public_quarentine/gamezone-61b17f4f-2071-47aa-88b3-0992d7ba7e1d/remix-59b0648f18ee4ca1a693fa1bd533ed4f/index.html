<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>DATA RUN: OVERRIDE CIRCUIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: titles -> Russo One, HUD/UI -> Exo 2, terminal boot -> VT323 via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#050505',
                            green: '#00ff41',
                            dim: '#003b00',
                            cyan: '#00f3ff',
                            red: '#ff003c',
                            yellow: '#fcee0a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Exo 2"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"VT323"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace'],
                        display: ['"Russo One"', '"Exo 2"', 'sans-serif']
                    },
                    animation: {
                        'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glitch': 'glitch 1s linear infinite',
                    },
                    keyframes: {
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                            '62%': { transform: 'translate(0,0) skew(5deg)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-deep: #040613;
            --bg-core: #0a1130;
            --panel: rgba(10, 18, 48, 0.78);
            --panel-strong: rgba(7, 14, 36, 0.92);
            --line: rgba(90, 235, 255, 0.65);
            --line-soft: rgba(113, 255, 190, 0.35);
            --text-main: #ebfbff;
            --text-soft: #8ce9ff;
            --accent-mint: #71ffbe;
            --accent-cyan: #5aebff;
            --accent-violet: #9d7bff;
            --accent-alert: #ff5f8f;
            --accent-gold: #ffd76a;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(90, 235, 255, 0.15), transparent 34%),
                radial-gradient(circle at bottom, rgba(113, 255, 190, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg-core), var(--bg-deep) 60%);
            color: var(--accent-mint);
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .font-display {
            font-family: 'Russo One', 'Exo 2', sans-serif;
        }

        .font-terminal {
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        #gameCanvas {
            touch-action: none;
        }

        button,
        [role="button"] {
            touch-action: manipulation;
        }

        .panel-holo {
            border: 1px solid rgba(90, 235, 255, 0.48);
            background: linear-gradient(180deg, rgba(12, 21, 54, 0.9), rgba(5, 10, 26, 0.78));
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 16px rgba(90, 235, 255, 0.12),
                0 12px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .avatar-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 999px;
            border: 1px solid rgba(113, 255, 190, 0.7);
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0) 22%),
                radial-gradient(circle at 50% 50%, rgba(113, 255, 190, 0.28), rgba(90, 235, 255, 0.12) 45%, rgba(6, 10, 28, 0.95) 70%);
            color: var(--text-main);
            font-size: 1.6rem;
            box-shadow: 0 0 18px rgba(113, 255, 190, 0.28);
        }
        
        /* CRT Scanline Effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        /* Custom Scrollbar hide */
        ::-webkit-scrollbar { display: none; }

        .btn-cyber {
            background: linear-gradient(180deg, rgba(13, 27, 70, 0.96), rgba(8, 15, 40, 0.96));
            border: 1px solid rgba(90, 235, 255, 0.55);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 0 12px rgba(90, 235, 255, 0.14);
            transition: transform 0.1s ease, box-shadow 0.14s ease, filter 0.14s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .btn-cyber:active {
            background: linear-gradient(180deg, rgba(113,255,190,0.94), rgba(90,235,255,0.92));
            color: #02050f;
            box-shadow: 0 0 22px rgba(113, 255, 190, 0.45);
            transform: scale(0.98);
            filter: brightness(1.05);
        }
        .btn-cyber:disabled {
            border-color: #333;
            color: #555;
            background: #111;
            box-shadow: none;
        }

        .text-glow {
            text-shadow: 0 0 8px currentColor;
        }

        .title-glow {
            text-shadow:
                0 0 8px rgba(90, 235, 255, 0.75),
                0 0 20px rgba(157, 123, 255, 0.32);
        }

        .feedback-gif {
            position: absolute;
            width: min(34vw, 160px);
            aspect-ratio: 1 / 1;
            border-radius: 1rem;
            border: 1px solid rgba(90, 235, 255, 0.4);
            background: rgba(3, 8, 24, 0.84);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(90, 235, 255, 0.18);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 18;
        }

        .feedback-gif.is-visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        #crash-gif {
            top: max(1rem, env(safe-area-inset-top));
            right: 1rem;
        }

        #victory-gif {
            bottom: calc(6.5rem + env(safe-area-inset-bottom));
            left: 1rem;
        }

        .feedback-caption {
            position: absolute;
            left: 0.65rem;
            right: 0.65rem;
            bottom: 0.5rem;
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ebfbff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 640px) {
            .feedback-gif {
                width: min(30vw, 118px);
            }

            #victory-gif {
                bottom: calc(7.5rem + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body class="crt h-screen w-screen flex flex-col relative">

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full block z-0"></canvas>

    <!-- [agent-note][stage3] resolved-gif: crash-feedback + victory-feedback -> catalogs/gifs.json | caution: compact corner overlays preserve controls -->
    <div id="feedback-layer" class="absolute inset-0 z-[18] pointer-events-none" aria-hidden="true">
        <div id="crash-gif" class="feedback-gif">

            <div class="feedback-caption">run complete</div>
        </div>
    </div>

    <!-- UI LAYER -->
    <div id="ui-layer" class="absolute inset-0 z-10 flex flex-col pointer-events-none">
        
        <!-- BOOT SEQUENCE -->
        <div id="boot-screen" class="absolute inset-0 bg-black z-50 flex flex-col justify-end p-8 pointer-events-auto font-terminal text-sm leading-tight text-cyber-green">
            <div id="boot-log" class="mb-4 whitespace-pre-wrap opacity-80"></div>
            <div class="animate-pulse-fast">_</div>

        <!-- MAIN MENU (ROOT) -->
        <div id="menu-screen" class="hidden absolute inset-0 bg-black/90 backdrop-blur-sm pointer-events-auto flex flex-col p-6 overflow-y-auto">
            <header class="text-center mt-8 mb-6">
                <div class="mx-auto mb-4 flex items-center justify-center gap-3">

            <!-- Stats Panel -->

                            </div>
                            <button id="btn-upg-speed" class="btn-cyber px-2 py-1 text-xs w-20 h-8 flex items-center justify-center">

                    <!-- Boost -->

                    START DATA RUN

        <!-- HUD (Race) -->

                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="flex items-end gap-4 pointer-events-auto">
                <!-- Nitro Gauge -->
                <div class="panel-holo flex-1 h-16 relative rounded overflow-hidden">
                    <div class="absolute bottom-1 left-1 text-[10px] text-gray-400 z-10">BOOST</div>
                    <div id="hud-nitro-bar" class="absolute bottom-0 left-0 top-0 bg-cyber-red/80 w-full origin-left transition-transform duration-75" style="transform: scaleX(1)"></div>
                    <!-- Grid overlay on bar -->
                    <div class="absolute inset-0 bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhhYWGMYAEYB8RmROaABADeOQ8CXl/xfgAAAABJRU5ErkJggg==')] opacity-20"></div>
                </div>

                <!-- Boost Button -->
                <button id="btn-boost" class="w-24 h-24 rounded-full bg-gradient-to-b from-cyber-red to-red-900 border-2 border-red-500 shadow-[0_0_20px_rgba(255,0,60,0.4)] active:scale-95 transition-transform flex items-center justify-center flex-col">

        <!-- RESULTS SCREEN -->
        <div id="result-screen" class="hidden absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-8 pointer-events-auto z-50">

                ★ CLAIM BONUS ★
            </button>

            <button id="btn-menu" class="w-full max-w-xs btn-cyber py-4 bg-white text-black font-bold border-white hover:bg-gray-200">
                RETURN TO HUB

    </div>

    <script>
        // --- GAME CONFIG & STATE ---
        const CONFIG = {
            baseSpeed: 15,
            laneWidth: 0, // Calculated
            totalDist: 10000,
            colors: {
                player: '#71ffbe',
                rival: '#ff5f8f',
                traffic: '#ebfbff',
                road: '#0d1a44',
                cyan: '#5aebff',
                red: '#ff5f8f'
            }
        };

        // [agent-note][stage3] resolved-audio: gameplay loop + ui/start/boost/crash/win/bonus using catalogs/audios.json
        const AUDIO_URLS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            menu: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3",
            click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
            boost: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
            crash: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
            blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3",
            win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3",
            bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3"
        };

        let audioCtx = null;
        let sounds = {};
        let audioEnabled = true;
        let boostAudioLatch = false;
        let gifTimers = {};
        let sfxLastPlayed = {};

        let state = {
            screen: 'boot', // boot, menu, race, result
            money: 0,
            upgrades: { speed: 1, boost: 1 },
            costs: { speed: 50, boost: 50 },
            
            // Race State
            active: false,
            paused: false,
            frame: 0,
            dist: 0,
            speed: 0,
            nitro: 100,
            isBoosting: false,
            
            playerX: 0.5, // 0 to 1
            shake: 0,
            
            entities: [], // rivals and traffic
            particles: [],
            
            lastTime: 0
        };

        // --- AUDIO SYSTEM ---
        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
            }
            
            for (const [key, url] of Object.entries(AUDIO_URLS)) {
                const audio = new Audio(url);
                audio.preload = 'auto';
                if (key === 'bgm') {
                    audio.loop = true;
                    audio.volume = 0.2;
                } else if (key === 'boost') {
                    audio.volume = 0.35;
                } else if (key === 'crash' || key === 'win' || key === 'bonus') {
                    audio.volume = 0.45;
                } else {
                    audio.volume = 0.3;
                }
                sounds[key] = audio;
            }
        }

        function resumeAudioContext() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }

        function stopLoopedAudio() {
            if (sounds.bgm) {
                sounds.bgm.pause();
                sounds.bgm.currentTime = 0;
            }
        }

        function startLoopedAudio() {
            if (!audioEnabled || !sounds.bgm || state.screen === 'boot') return;
            resumeAudioContext();
            sounds.bgm.play().catch(() => {});
        }

        function playSound(key, options = {}) {
            if (!audioEnabled || !sounds[key]) return;
            const now = performance.now();
            const minGap = options.minGap ?? 0;
            if (minGap && sfxLastPlayed[key] && now - sfxLastPlayed[key] < minGap) return;
            sfxLastPlayed[key] = now;
            resumeAudioContext();

            if (key === 'bgm') {
                startLoopedAudio();
                return;
            }

            const s = sounds[key].cloneNode();
            s.volume = sounds[key].volume;
            s.play().catch(() => {});
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            if (!audioEnabled) {
                stopLoopedAudio();
            } else if (state.screen === 'menu' || state.screen === 'race') {
                startLoopedAudio();
                playSound('menu', { minGap: 250 });
            }
            
            document.getElementById('btn-sound').innerText = `AUDIO: ${audioEnabled ? 'ON' : 'OFF'}`;
        }

        function showFeedbackGif(id, duration = 1500) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add('is-visible');
            clearTimeout(gifTimers[id]);
            gifTimers[id] = setTimeout(() => {
                el.classList.remove('is-visible');
            }, duration);
        }

        // --- SAVE SYSTEM ---
        function loadGame() {
            const saved = localStorage.getItem('dataRunSave');
            if (saved) {
                const data = JSON.parse(saved);
                state.money = data.money || 0;
                state.upgrades = data.upgrades || { speed: 1, boost: 1 };
                state.costs = data.costs || { speed: 50, boost: 50 };
            }
        }

        function saveGame() {
            localStorage.setItem('dataRunSave', JSON.stringify({
                money: state.money,
                upgrades: state.upgrades,
                costs: state.costs
            }));
        }

        // --- BOOT SEQUENCE ---
        function runBootSequence() {
            const log = document.getElementById('boot-log');
            const lines = [
                "> RUN_SEQUENCE_INIT...",
                "> CHECKING_LINK_NODES... OK",
                "> CALIBRATING_VECTOR_LANES... OK",
                "> ESTABLISHING_DATA_STREAM...",
                "> TARGET_CIRCUIT_FOUND: NODE-04",
                "> ROUTING_AROUND_TRAFFIC...",
                "> RUN_CHANNEL_OPEN."
            ];
            
            let lineIdx = 0;
            let charIdx = 0;
            
            const typeInterval = setInterval(() => {
                if (lineIdx >= lines.length) {
                    clearInterval(typeInterval);
                    setTimeout(() => {
                        document.getElementById('boot-screen').classList.add('hidden');
                        showMenu();
                    }, 800);
                    return;
                }
                
                const currentLine = lines[lineIdx];
                if (charIdx === 0) {
                    log.innerHTML += (lineIdx > 0 ? "\n" : "");
                }
                
                log.innerHTML += currentLine.charAt(charIdx);
                charIdx++;
                
                if (charIdx >= currentLine.length) {
                    charIdx = 0;
                    lineIdx++;
                }
                // Auto scroll
                log.scrollTop = log.scrollHeight;
            }, 30);
        }

        // --- GAME LOOP & LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function showMenu() {
            state.screen = 'menu';
            state.active = false;
            boostAudioLatch = false;
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('hud-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('crash-gif').classList.remove('is-visible');
            document.getElementById('victory-gif').classList.remove('is-visible');
            
            updateMenuUI();
            initAudio();
            startLoopedAudio();
            playSound('menu', { minGap: 250 });
            
            // Start idle render loop
            if(!state.active) requestAnimationFrame(renderLoop);
        }

        function updateMenuUI() {
            document.getElementById('menu-money').innerText = state.money;
            
            // Speed Upg
            document.getElementById('lvl-speed-val').innerText = (1.0 + state.upgrades.speed * 0.1).toFixed(1) + " GHz";
            document.getElementById('cost-speed').innerText = "$" + state.costs.speed;
            document.getElementById('bar-speed').style.width = Math.min(100, state.upgrades.speed * 5) + "%";
            
            const btnSpeed = document.getElementById('btn-upg-speed');
            btnSpeed.disabled = state.money < state.costs.speed;

            // Boost Upg
            document.getElementById('lvl-boost-val').innerText = (128 + state.upgrades.boost * 32) + " MB";
            document.getElementById('cost-boost').innerText = "$" + state.costs.boost;
            document.getElementById('bar-boost').style.width = Math.min(100, state.upgrades.boost * 5) + "%";
            
            const btnBoost = document.getElementById('btn-upg-boost');
            btnBoost.disabled = state.money < state.costs.boost;
        }

        function startGame() {
            state.screen = 'race';
            state.active = true;
            state.dist = 0;
            state.speed = 0;
            state.nitro = 100;
            state.isBoosting = false;
            state.playerX = 0.5;
            state.shake = 0;
            state.entities = [];
            state.particles = [];
            state.frame = 0;
            boostAudioLatch = false;

            // Generate Rivals
            for(let i=0; i<3; i++) {
                state.entities.push({
                    type: 'rival',
                    x: 0.2 + (i * 0.3),
                    y: 0, // Relative to player dist
                    dist: 500 + (i * 200),
                    speed: CONFIG.baseSpeed * (0.8 + Math.random() * 0.3) + (state.upgrades.speed * 0.5),
                    color: CONFIG.colors.rival
                });
            }

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('hud-screen').classList.remove('hidden');
            
            state.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(now) {
            if (!state.active) {
                renderLoop(now); // Fallback to menu render
                return;
            }
            
            const dt = (now - state.lastTime) / 16.66; // Normalize to 60fps
            state.lastTime = now;
            
            update(dt);
            render();
            
            requestAnimationFrame(gameLoop);
        }

        // Just render background for menu
        function renderLoop(now) {
            if(state.active) return;
            state.frame++;
            renderBackground(ctx, 0);
            requestAnimationFrame(renderLoop);
        }

        function update(dt) {
            // Player Stats
            const maxSpeed = CONFIG.baseSpeed + (state.upgrades.speed * 1.5);
            const boostMult = 1.6;
            
            // Nitro Logic
            if (state.isBoosting && state.nitro > 0) {
                state.nitro -= (0.5 / (1 + state.upgrades.boost * 0.1)) * dt;
                state.speed += 0.5 * dt;
                state.shake = 2;
                spawnParticles(state.playerX * width, height * 0.85, CONFIG.colors.cyan, 1);
                
                if (state.speed > maxSpeed * boostMult) state.speed = maxSpeed * boostMult;
            } else {
                state.nitro += 0.2 * dt;
                if (state.speed > maxSpeed) state.speed *= 0.98; // Drag
                else if (state.speed < maxSpeed) state.speed += 0.2 * dt; // Accel
            }
            state.nitro = Math.max(0, Math.min(100, state.nitro));
            
            // Movement
            state.dist += state.speed * dt;
            
            // Traffic Gen
            if (Math.random() < 0.02) {
                state.entities.push({
                    type: 'traffic',
                    x: Math.random() * 0.8 + 0.1,
                    dist: state.dist + height * 2 + Math.random() * 1000,
                    speed: maxSpeed * 0.4,
                    color: CONFIG.colors.traffic,
                    width: width * 0.1
                });
            }

            // Entity Logic
            for (let i = state.entities.length - 1; i >= 0; i--) {
                let e = state.entities[i];
                
                if (e.type === 'rival') {
                    e.dist += e.speed * dt;
                    // Simple AI
                    if (Math.random() < 0.01) e.x += (Math.random() - 0.5) * 0.1;
                    e.x = Math.max(0.1, Math.min(0.9, e.x));
                }
                
                // Cleanup behind
                if (e.dist < state.dist - height) {
                    state.entities.splice(i, 1);
                    continue;
                }

                // Collision
                if (Math.abs(e.dist - state.dist) < 100) {
                    let pX = state.playerX * width;
                    let eX = e.x * width;
                    let w = width * 0.12; // Car width approx
                    
                    if (Math.abs(pX - eX) < w) {
                        // Crash
                        playSound('crash', { minGap: 250 });
                        showFeedbackGif('crash-gif', 1200);
                        state.speed *= 0.6;
                        state.shake = 15;
                        spawnParticles(pX, height * 0.8, CONFIG.colors.red, 10);
                        // Push away
                        if (pX < eX) state.playerX -= 0.05; else state.playerX += 0.05;
                        e.dist += 150; // Bump forward
                    }
                }
            }

            // Particles
            for (let i = state.particles.length - 1; i >= 0; i--) {
                let p = state.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.05 * dt;
                if (p.life <= 0) state.particles.splice(i, 1);
            }

            // Shake decay
            state.shake *= 0.9;

            // UI Update
            document.getElementById('hud-nitro-bar').style.transform = `scaleX(${state.nitro/100})`;
            document.getElementById('hud-dist').innerText = Math.floor((state.dist / CONFIG.totalDist) * 100);
            
            // Rank Calc
            let rank = 1;
            state.entities.forEach(e => {
                if (e.type === 'rival' && e.dist > state.dist) rank++;
            });
            document.getElementById('hud-pos').innerText = rank;

            // Finish
            if (state.dist >= CONFIG.totalDist) {
                finishRace(rank);
            }
        }

        function finishRace(rank) {
            state.active = false;
            boostAudioLatch = false;
            playSound('win', { minGap: 300 });
            showFeedbackGif('victory-gif', 2200);
            
            let reward = 0;
            if (rank === 1) reward = 150;
            else if (rank === 2) reward = 100;
            else if (rank === 3) reward = 50;
            else reward = 20;

            state.money += reward;
            saveGame();

            document.getElementById('hud-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('res-title').innerText = rank === 1 ? "SYNC COMPLETE" : "SYNC STABLE";
            document.getElementById('res-title').className = rank === 1 ? "text-4xl font-black text-cyber-green italic mb-2 text-glow" : "text-4xl font-black text-white italic mb-2";
            
            document.getElementById('res-reward').innerText = reward;
            document.getElementById('res-total').innerText = state.money;

            // Reset Commend
            const btnC = document.getElementById('btn-commend');
            btnC.disabled = false;
            btnC.innerHTML = "★ CLAIM BONUS ★";
            btnC.classList.remove('border-green-500', 'text-green-500');
            btnC.classList.add('border-cyber-yellow', 'text-cyber-yellow');
        }

        // --- RENDERER ---
        function render() {
            // Clear
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Shake
            ctx.save();
            let sx = (Math.random() - 0.5) * state.shake;
            let sy = (Math.random() - 0.5) * state.shake;
            ctx.translate(sx, sy);

            renderBackground(ctx, state.dist);

            // Objects
            // Project 3D-ish: y = screenY - (objDist - playerDist)
            const playerScreenY = height * 0.85;
            
            // Draw Entities
            // Sort by distance (far first)
            let drawList = state.entities.filter(e => e.dist > state.dist - 200 && e.dist < state.dist + 2000);
            drawList.sort((a, b) => b.dist - a.dist);

            drawList.forEach(e => {
                let y = playerScreenY - (e.dist - state.dist);
                let scale = 1.0 - ((e.dist - state.dist) / 3000); // Fake perspective scale
                if (scale < 0) scale = 0;
                
                drawCar(ctx, e.x * width, y, e.width || width * 0.12, e.color, scale, e.type === 'rival');
            });

            // Player
            drawCar(ctx, state.playerX * width, playerScreenY, width * 0.12, CONFIG.colors.player, 1.0, true);

            // Particles
            state.particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function renderBackground(ctx, dist) {
            // Cyber Grid
            ctx.fillStyle = '#040613';
            ctx.fillRect(0, 0, width, height);

            const skyGlow = ctx.createLinearGradient(0, 0, 0, height);
            skyGlow.addColorStop(0, 'rgba(90, 235, 255, 0.18)');
            skyGlow.addColorStop(0.45, 'rgba(10, 17, 48, 0.04)');
            skyGlow.addColorStop(1, 'rgba(4, 6, 19, 0.94)');
            ctx.fillStyle = skyGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = '#17387d';
            ctx.lineWidth = 2;
            
            const offset = (dist % 100);
            
            // Horizontal lines
            for (let i = 0; i < height; i += 50) {
                let y = (i + offset) % height;
                // Fade out at top
                ctx.globalAlpha = y / height;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Vertical lines (Perspective)
            ctx.globalAlpha = 0.5;
            const center = width / 2;
            for (let i = -2; i <= 2; i++) {
                let x = center + (i * width * 0.3);
                ctx.beginPath();
                ctx.moveTo(x, height);
                ctx.lineTo(center + (i * width * 0.05), 0); // Converge at top
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            const horizon = ctx.createLinearGradient(0, height * 0.18, 0, height * 0.88);
            horizon.addColorStop(0, 'rgba(157, 123, 255, 0)');
            horizon.addColorStop(0.45, 'rgba(157, 123, 255, 0.08)');
            horizon.addColorStop(0.7, 'rgba(90, 235, 255, 0.18)');
            horizon.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = horizon;
            ctx.fillRect(0, 0, width, height);

            // Vignette
            const grad = ctx.createRadialGradient(width/2, height/2, width/4, width/2, height/2, height);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, 'rgba(0,0,0,0.84)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawCar(ctx, x, y, w, color, scale, isCar) {
            const h = w * 1.6;
            w *= scale;
            const h_scaled = h * scale;

            ctx.save();
            ctx.translate(x, y);

            const glowColor = isCar ? '#71ffbe' : color;
            ctx.shadowBlur = isCar ? 24 : 16;
            ctx.shadowColor = glowColor;

            ctx.strokeStyle = glowColor;
            ctx.lineWidth = Math.max(1.5, 3 * scale);
            ctx.fillStyle = '#040613';

            ctx.beginPath();
            ctx.moveTo(0, -h_scaled / 2);
            ctx.lineTo(w / 2, -h_scaled * 0.08);
            ctx.lineTo(w * 0.42, h_scaled / 2);
            ctx.lineTo(-w * 0.42, h_scaled / 2);
            ctx.lineTo(-w / 2, -h_scaled * 0.08);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = isCar ? 'rgba(113,255,190,0.16)' : 'rgba(255,255,255,0.08)';
            ctx.beginPath();
            ctx.moveTo(0, -h_scaled * 0.38);
            ctx.lineTo(w * 0.28, -h_scaled * 0.02);
            ctx.lineTo(-w * 0.28, -h_scaled * 0.02);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(90,235,255,0.85)';
            ctx.fillRect(-w * 0.24, -h_scaled * 0.05, w * 0.48, Math.max(2, 4 * scale));

            ctx.fillStyle = isCar ? '#ffd76a' : '#ff5f8f';
            ctx.fillRect(-w * 0.3, h_scaled * 0.22, w * 0.22, Math.max(2, 4 * scale));
            ctx.fillRect(w * 0.08, h_scaled * 0.22, w * 0.22, Math.max(2, 4 * scale));

            if (isCar) {
                ctx.fillStyle = '#71ffbe';
                ctx.globalAlpha = 0.55 + Math.random() * 0.35;
                ctx.fillRect(-w / 4, h_scaled / 2, w / 2, Math.max(3, 5 * scale));
                ctx.globalAlpha = 1;
            }

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                state.particles.push({
                    x: x + (Math.random()-0.5)*20,
                    y: y,
                    vx: (Math.random()-0.5)*2,
                    vy: Math.random()*5 + 2,
                    life: 1.0,
                    color: color
                });
            }
        }

        // --- INPUTS ---
        // Touch Drag for Steering
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scroll
            if (state.active) {
                const touch = e.touches[0];
                state.playerX = touch.clientX / width;
                state.playerX = Math.max(0.1, Math.min(0.9, state.playerX));
            }
        }, { passive: false });
        
        canvas.addEventListener('touchstart', (e) => {
             if (state.active) {
                e.preventDefault();
                const touch = e.touches[0];
                state.playerX = touch.clientX / width;
             }
        }, { passive: false });

        // Boost Button
        const btnBoost = document.getElementById('btn-boost');
        const startBoost = (e) => {
            e.preventDefault(); e.stopPropagation();
            state.isBoosting = true;
            if (!boostAudioLatch) {
                playSound('boost', { minGap: 200 });
                boostAudioLatch = true;
            }
        };
        const endBoost = (e) => {
            e.preventDefault(); e.stopPropagation();
            state.isBoosting = false;
            boostAudioLatch = false;
        };
        
        btnBoost.addEventListener('touchstart', startBoost, {passive: false});
        btnBoost.addEventListener('touchend', endBoost, {passive: false});
        btnBoost.addEventListener('mousedown', startBoost);
        btnBoost.addEventListener('mouseup', endBoost);
        btnBoost.addEventListener('mouseleave', endBoost);

        // UI Buttons
        document.getElementById('btn-start').addEventListener('click', () => {
            playSound('start', { minGap: 250 });
            startGame();
        });

        document.getElementById('btn-menu').addEventListener('click', () => {
            playSound('click');
            showMenu();
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            toggleAudio();
        });

        // Upgrades
        document.getElementById('btn-upg-speed').addEventListener('click', () => {
            if (state.money >= state.costs.speed) {
                state.money -= state.costs.speed;
                state.upgrades.speed++;
                state.costs.speed = Math.floor(state.costs.speed * 1.5);
                playSound('click', { minGap: 150 });
                saveGame();
                updateMenuUI();
            } else {
                playSound('blocked', { minGap: 200 });
            }
        });

        document.getElementById('btn-upg-boost').addEventListener('click', () => {
            if (state.money >= state.costs.boost) {
                state.money -= state.costs.boost;
                state.upgrades.boost++;
                state.costs.boost = Math.floor(state.costs.boost * 1.5);
                playSound('click', { minGap: 150 });
                saveGame();
                updateMenuUI();
            } else {
                playSound('blocked', { minGap: 200 });
            }
        });

        document.getElementById('btn-commend').addEventListener('click', function() {
            if (!this.disabled) {
                const bonus = 50;
                state.money += bonus;
                saveGame();
                playSound('bonus', { minGap: 250 });
                showFeedbackGif('victory-gif', 1800);
                this.disabled = true;
                this.innerHTML = "BONUS CLAIMED";
                this.classList.remove('border-cyber-yellow', 'text-cyber-yellow');
                this.classList.add('border-green-500', 'text-green-500');
                document.getElementById('res-total').innerText = state.money;
            }
        });

        // --- INIT ---
        loadGame();
        runBootSequence();

    </script>
</body>
