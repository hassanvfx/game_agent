<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Atelier</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title -> Audiowide | ui/body -> Orbitron via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #120f2f;
            --bg-bottom: #060713;
            --panel: rgba(17, 21, 45, 0.82);
            --panel-strong: rgba(30, 36, 77, 0.94);
            --panel-soft: rgba(255, 255, 255, 0.08);
            --line: rgba(128, 227, 255, 0.22);
            --cyan-300: #9af2ff;
            --cyan-400: #64e8ff;
            --cyan-500: #2cc7ff;
            --violet-400: #9b7cff;
            --violet-500: #7a5cff;
            --magenta-400: #ff67d6;
            --gold-400: #ffd166;
            --success-400: #4ade80;
            --danger-400: #fb7185;
            --ink-100: #f6f8ff;
            --ink-200: #d6def8;
            --ink-300: #aab6de;
            --ink-500: #5f6d96;
            --ink-900: #0d1023;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(123, 92, 255, 0.35), transparent 32%),
                radial-gradient(circle at 20% 20%, rgba(44, 199, 255, 0.18), transparent 28%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            font-family: 'Orbitron', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            color: var(--ink-100);
        }

        button {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: inherit;
            border: 0;
            cursor: pointer;
        }

        .safe-area {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .app-shell {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .audio-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            min-width: 3rem;
            height: 3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.5rem 0.8rem;
            background: linear-gradient(180deg, rgba(22, 28, 59, 0.96), rgba(12, 16, 34, 0.92));
            border: 1px solid var(--line);
            color: var(--ink-100);
            border-radius: 9999px;
            box-shadow: 0 0 24px rgba(44, 199, 255, 0.18);
            opacity: 0.92;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .app-header {
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .app-title {
            margin: 0;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 2.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--cyan-300), var(--magenta-400), var(--gold-400));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(44, 199, 255, 0.24);
        }

        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            overflow: hidden;
            padding: 0 1rem 0.75rem;
        }

        .game-footer {
            width: 100%;
            padding: 1rem 1.1rem calc(1rem + env(safe-area-inset-bottom));
            flex-shrink: 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(10, 13, 29, 0.6), rgba(12, 16, 34, 0.94));
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            border-radius: 1.5rem 1.5rem 0 0;
            box-shadow: 0 -16px 40px rgba(0,0,0,0.28);
        }

        .menu-card,
        .result-card {
            text-align: center;
            width: min(100%, 22rem);
            padding: 1.2rem 1rem;
            background: linear-gradient(180deg, rgba(24, 29, 63, 0.92), rgba(11, 14, 31, 0.94));
            border: 1px solid var(--line);
            border-radius: 1.5rem;
            box-shadow: 0 18px 40px rgba(0,0,0,0.28);
            position: relative;
            overflow: hidden;
        }

        .menu-emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 18px rgba(255, 103, 214, 0.28));
        }

        .menu-subtitle {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink-200);
            line-height: 1.45;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            width: 100%;
            max-width: 20rem;
            padding: 0 1rem;
        }

        .category-btn {
            background: linear-gradient(180deg, rgba(25, 31, 67, 0.94), rgba(14, 18, 38, 0.98));
            padding: 1rem 1.1rem;
            border-radius: 1rem;
            border: 1px solid rgba(154, 242, 255, 0.16);
            box-shadow: 0 12px 24px rgba(0,0,0,0.22);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.1s, border-color 0.15s, box-shadow 0.15s;
            text-align: left;
            color: var(--ink-100);
        }

        .category-btn:active {
            transform: scale(0.97);
            border-color: var(--cyan-400);
            box-shadow: 0 0 0 2px rgba(44, 199, 255, 0.18);
        }

        .category-icon {
            font-size: 2.5rem;
        }

        .category-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink-100);
        }

        .footer-note {
            margin: 0;
            font-size: 0.8rem;
            color: var(--ink-300);
            text-align: center;
            line-height: 1.45;
        }

        .progress-panel {
            width: 100%;
            max-width: 20rem;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--cyan-300);
        }

        .progress-track {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 9999px;
            height: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--magenta-400), var(--cyan-400));
            height: 100%;
            width: 0;
            transition: width 0.3s;
            box-shadow: 0 0 12px rgba(44, 199, 255, 0.35);
        }

        .design-controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 24rem;
        }

        .swatch-row,
        .deco-row,
        .result-actions {
            display: flex;
            justify-content: center;
            gap: 0.85rem;
            flex-wrap: wrap;
        }

        .deco-row {
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .btn-deco {
            font-size: 2rem;
            padding: 0.5rem 0.7rem;
            background: rgba(255,255,255,0.08);
            color: var(--ink-100);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.75rem;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.94); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }

        @keyframes bannerShow {
            0% { opacity: 0; transform: translate(-50%, 12px) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pop { animation: popIn 0.35s ease-out forwards; }

        .sew-point {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 35% 35%, var(--gold-400), var(--magenta-400));
            border: 3px solid rgba(255,255,255,0.9);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 20;
            animation: pulse-glow 1.5s infinite;
        }

        .sew-point.hit {
            background: var(--success-400);
            animation: none;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s;
        }

        #canvas-container {
            position: relative;
            width: min(78vw, 300px);
            height: min(78vw, 300px);
            max-width: 300px;
            max-height: 300px;
            margin: 0 auto;
            touch-action: none;
        }

        .item-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 18px 24px rgba(0,0,0,0.28));
            transition: fill 0.3s ease;
        }

        .feedback-banner {
            position: absolute;
            left: 50%;
            bottom: 0.4rem;
            transform: translateX(-50%);
            z-index: 35;
            min-width: 10rem;
            max-width: calc(100% - 1rem);
            padding: 0.55rem 0.85rem;
            border-radius: 999px;
            text-align: center;
            font-size: 0.72rem;
            line-height: 1.35;
            background: rgba(8, 12, 28, 0.86);
            border: 1px solid rgba(154, 242, 255, 0.22);
            box-shadow: 0 10px 20px rgba(0,0,0,0.24);
            animation: bannerShow 0.18s ease-out;
        }

        .feedback-banner.success {
            color: var(--success-400);
            border-color: rgba(74, 222, 128, 0.35);
        }

        .feedback-banner.warning {
            color: var(--danger-400);
            border-color: rgba(251, 113, 133, 0.35);
        }

        .feedback-banner.info {
            color: var(--cyan-300);
        }

        .feedback-gif {
            position: absolute;
            z-index: 15;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(154, 242, 255, 0.22);
            box-shadow: 0 14px 24px rgba(0,0,0,0.24);
            background: rgba(8, 10, 22, 0.72);
            pointer-events: none;
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-gif.is-visible {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feedback-gif.hit-gif {
            top: 0.3rem;
            right: 0.3rem;
            width: 5.25rem;
            height: 5.25rem;
        }

        .feedback-gif.win-gif {
            left: 50%;
            top: 50%;
            width: 7rem;
            height: 7rem;
            transform: translate(-50%, -50%) scale(0.92);
        }

        .feedback-gif.win-gif.is-visible {
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--magenta-400), var(--violet-500), var(--cyan-500));
            color: white;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.95rem 1.6rem;
            border-radius: 9999px;
            box-shadow: 0 8px 22px rgba(122, 92, 255, 0.35);
            transition: transform 0.1s, filter 0.1s;
            text-align: center;
        }

        .btn-primary:active {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.09);
            color: var(--ink-100);
            font-weight: 700;
            padding: 1rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 14px rgba(0,0,0,0.14);
        }

        .wide-button {
            width: min(100%, 16rem);
        }

        .color-swatch {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.88);
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-swatch:active { transform: scale(0.9); }
        .color-swatch.selected { border-color: var(--cyan-300); transform: scale(1.1); }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255,255,255,0.24);
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        .hero-avatar {
            width: 9rem;
            height: 9rem;
            margin: 0 auto 1rem;
            border-radius: 2rem;
            display: grid;
            place-items: center;
            font-size: 4.4rem;
            background:
                radial-gradient(circle at 30% 25%, rgba(255,255,255,0.36), transparent 18%),
                linear-gradient(145deg, rgba(255, 103, 214, 0.95), rgba(122, 92, 255, 0.95) 55%, rgba(44, 199, 255, 0.95));
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12),
                0 18px 30px rgba(0,0,0,0.28),
                0 0 28px rgba(44, 199, 255, 0.24);
            position: relative;
        }

        .hero-avatar::after {
            content: '';
            position: absolute;
            inset: 0.5rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.24);
        }

        .menu-kicker {
            margin: 0 0 0.35rem;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--cyan-300);
        }

        .selection-hint {
            margin-top: 0.35rem;
            display: block;
            font-size: 0.72rem;
            color: var(--ink-300);
            letter-spacing: 0.04em;
        }

        .stage-card {
            position: relative;
            background:
                radial-gradient(circle at top, rgba(44, 199, 255, 0.15), transparent 52%),
                linear-gradient(180deg, rgba(23, 29, 62, 0.96), rgba(10, 12, 28, 0.98));
            border: 1px solid rgba(154, 242, 255, 0.16);
            border-radius: 1.8rem;
            padding: 1rem;
            box-shadow: 0 24px 50px rgba(0,0,0,0.26);
        }

        .stage-card::before {
            content: '';
            position: absolute;
            inset: 0.55rem;
            border-radius: 1.3rem;
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }

        .stage-glow {
            position: absolute;
            inset: auto 14% -0.6rem 14%;
            height: 1.2rem;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(44, 199, 255, 0.42), transparent 70%);
            filter: blur(10px);
            pointer-events: none;
        }

        .section-title {
            margin: 0 0 0.7rem;
            font-size: 0.82rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--cyan-300);
        }

        @media (max-width: 420px) {
            .app-title {
                font-size: 1.75rem;
            }

            .game-footer {
                padding: 0.9rem 0.9rem calc(0.9rem + env(safe-area-inset-bottom));
            }

            .feedback-gif.hit-gif {
                width: 4.4rem;
                height: 4.4rem;
            }

            .feedback-gif.win-gif {
                width: 6rem;
                height: 6rem;
            }
        }
    </style>
</head>
<body>

    <button id="audio-toggle" class="audio-toggle safe-area" type="button" aria-pressed="false" aria-label="Enable sound">
        <span id="audio-toggle-icon">🔇</span>
        <span id="audio-toggle-label">Audio</span>
    </button>

    <div id="app" class="app-shell safe-area">
        <header class="app-header">
            <h1 class="app-title">Arcade Atelier</h1>
        </header>

        <main id="game-content" class="game-main">
        </main>

        <footer id="game-controls" class="game-footer">
        </footer>
    </div>

<script>
/**
 * Arcade Atelier MVP
 * Stage 03 media mapping:
 * - fonts remapped to catalogs/fonts.json
 * - audio upgraded to catalog-backed HTMLAudioElement playback
 * - GIF overlays added for hit/win feedback from catalogs/gifs.json
 */

const MEDIA = {
    audio: {
        uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        startGame: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        menuOpen: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3',
        hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
        pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
        success: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
        levelComplete: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        gameplayLoop: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
        victoryLoop: 'https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3'
    },
    gifs: {
        hit: 'https://i.giphy.com/1AjEBGWggGXh9onllB.webp',
        win: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp'
    }
};

const AudioSystem = (() => {
    let enabled = false;
    const pools = new Map();
    const lastPlayedAt = new Map();
    const loopPlayers = {
        gameplay: null,
        victory: null
    };

    const createAudio = (url, { loop = false, volume = 0.5 } = {}) => {
        const audio = new Audio(url);
        audio.preload = 'auto';
        audio.crossOrigin = 'anonymous';
        audio.loop = loop;
        audio.volume = volume;
        return audio;
    };

    const getPool = (key, url, volume = 0.5, poolSize = 3) => {
        if (!pools.has(key)) {
            const pool = Array.from({ length: poolSize }, () => createAudio(url, { volume }));
            pools.set(key, pool);
        }
        return pools.get(key);
    };

    const safePlay = (audio) => {
        if (!enabled || !audio) return;
        try {
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (_) {}
    };

    const throttledPlay = (key, url, { volume = 0.5, cooldown = 90, poolSize = 3 } = {}) => {
        if (!enabled) return;
        const now = performance.now();
        const lastTime = lastPlayedAt.get(key) || 0;
        if (now - lastTime < cooldown) return;
        lastPlayedAt.set(key, now);

        const pool = getPool(key, url, volume, poolSize);
        const player = pool.find((audio) => audio.paused || audio.ended) || pool[0];
        try {
            player.currentTime = 0;
        } catch (_) {}
        safePlay(player);
    };

    const ensureLoops = () => {
        if (!loopPlayers.gameplay) {
            loopPlayers.gameplay = createAudio(MEDIA.audio.gameplayLoop, { loop: true, volume: 0.2 });
        }
        if (!loopPlayers.victory) {
            loopPlayers.victory = createAudio(MEDIA.audio.victoryLoop, { loop: true, volume: 0.22 });
        }
    };

    const stopLoop = (name) => {
        const player = loopPlayers[name];
        if (!player) return;
        player.pause();
        try {
            player.currentTime = 0;
        } catch (_) {}
    };

    const startLoop = (name) => {
        if (!enabled) return;
        ensureLoops();
        const target = loopPlayers[name];
        if (!target) return;

        Object.keys(loopPlayers).forEach((otherName) => {
            if (otherName !== name) stopLoop(otherName);
        });

        safePlay(target);
    };

    const warmUp = () => {
        ensureLoops();
        Object.entries({
            uiClick: [MEDIA.audio.uiClick, 0.35],
            startGame: [MEDIA.audio.startGame, 0.45],
            menuOpen: [MEDIA.audio.menuOpen, 0.4],
            hit: [MEDIA.audio.hit, 0.4],
            pickup: [MEDIA.audio.pickup, 0.42],
            success: [MEDIA.audio.success, 0.45],
            levelComplete: [MEDIA.audio.levelComplete, 0.5],
            blocked: [MEDIA.audio.blocked, 0.4]
        }).forEach(([key, [url, volume]]) => {
            getPool(key, url, volume);
        });
    };

    return {
        enable() {
            enabled = true;
            warmUp();
        },
        toggle() {
            enabled = !enabled;
            if (enabled) {
                warmUp();
            } else {
                stopLoop('gameplay');
                stopLoop('victory');
            }
            return enabled;
        },
        isEnabled() {
            return enabled;
        },
        playUIClick() {
            throttledPlay('uiClick', MEDIA.audio.uiClick, { volume: 0.35, cooldown: 60 });
        },
        playStart() {
            throttledPlay('startGame', MEDIA.audio.startGame, { volume: 0.45, cooldown: 120 });
        },
        playMenuOpen() {
            throttledPlay('menuOpen', MEDIA.audio.menuOpen, { volume: 0.4, cooldown: 120 });
        },
        playHit() {
            throttledPlay('hit', MEDIA.audio.hit, { volume: 0.4, cooldown: 70 });
        },
        playPickup() {
            throttledPlay('pickup', MEDIA.audio.pickup, { volume: 0.42, cooldown: 110 });
        },
        playSuccess() {
            throttledPlay('success', MEDIA.audio.success, { volume: 0.45, cooldown: 140 });
        },
        playLevelComplete() {
            throttledPlay('levelComplete', MEDIA.audio.levelComplete, { volume: 0.5, cooldown: 180 });
        },
        playBlocked() {
            throttledPlay('blocked', MEDIA.audio.blocked, { volume: 0.4, cooldown: 120 });
        },
        startGameplayLoop() {
            startLoop('gameplay');
        },
        startVictoryLoop() {
            startLoop('victory');
        },
        stopAllLoops() {
            stopLoop('gameplay');
            stopLoop('victory');
        }
    };
})();

const ASSETS = {
    shirt: `
        <svg class="item-svg" viewBox="0 0 200 200" aria-label="Stage outfit">
            <path id="item-base" d="M50 50 L20 80 L40 100 L60 80 L60 180 L140 180 L140 80 L160 100 L180 80 L150 50 Q100 70 50 50 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
            <path id="item-detail" d="M60 80 L60 180 M140 180 L140 80" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
            <g id="decoration-layer"></g>
        </svg>
    `,
    bag: `
        <svg class="item-svg" viewBox="0 0 200 200" aria-label="Gear bag">
            <path d="M70 60 Q100 10 130 60" fill="none" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
            <path id="item-base" d="M40 60 H160 V160 Q160 180 140 180 H60 Q40 180 40 160 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
            <path id="item-detail" d="M40 80 H160" fill="none" stroke="#374151" stroke-width="1" opacity="0.3"/>
            <g id="decoration-layer"></g>
        </svg>
    `,
    shoe: `
        <svg class="item-svg" viewBox="0 0 200 200" aria-label="Speed kicks">
            <path id="item-base" d="M20 120 Q20 80 60 70 L100 60 Q140 50 160 90 L170 140 Q170 170 140 170 H40 Q20 170 20 140 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
            <path d="M20 140 H170" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="2 2"/>
            <circle cx="70" cy="90" r="2" fill="#374151"/>
            <circle cx="85" cy="85" r="2" fill="#374151"/>
            <circle cx="100" cy="80" r="2" fill="#374151"/>
            <g id="decoration-layer"></g>
        </svg>
    `
};

const DECORATIONS = {
    star: `<polygon points="100,70 110,90 130,90 115,105 120,125 100,110 80,125 85,105 70,90 90,90" fill="#fbbf24" stroke="white" stroke-width="2"/>`,
    heart: `<path d="M100 130 C 80 110, 60 90, 70 70 A 15 15 0 0 1 100 85 A 15 15 0 0 1 130 70 C 140 90, 120 110, 100 130 Z" fill="#f43f5e" stroke="white" stroke-width="2"/>`,
    bow: `<path d="M100 100 L80 80 L80 120 Z M100 100 L120 80 L120 120 Z" fill="#8b5cf6" stroke="white" stroke-width="2"/>`
};

const Game = {
    state: 'MENU',
    selectedCategory: null,
    totalPoints: 0,
    pointsHit: 0,
    feedbackTimer: null,
    gifTimers: {},
    currentDesign: {
        color: '#e5e7eb',
        decoration: null
    },

    init() {
        this.renderMenu();

        document.getElementById('audio-toggle').addEventListener('click', () => {
            const isOn = AudioSystem.toggle();
            if (isOn) {
                this.unlockAudio();
                AudioSystem.playUIClick();
                if (this.state === 'SEW' || this.state === 'DESIGN') {
                    AudioSystem.startGameplayLoop();
                } else if (this.state === 'RESULT') {
                    AudioSystem.startVictoryLoop();
                }
            }
            this.updateAudioToggle(isOn);
            this.showFeedback(isOn ? 'Audio online. Neon floor ambience unlocked.' : 'Audio muted. Play stays fully functional.', isOn ? 'info' : 'warning');
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                AudioSystem.stopAllLoops();
            } else if (AudioSystem.isEnabled()) {
                if (this.state === 'SEW' || this.state === 'DESIGN') {
                    AudioSystem.startGameplayLoop();
                } else if (this.state === 'RESULT') {
                    AudioSystem.startVictoryLoop();
                }
            }
        });
    },

    unlockAudio() {
        AudioSystem.enable();
    },

    updateAudioToggle(isOn) {
        document.getElementById('audio-toggle').setAttribute('aria-pressed', String(isOn));
        document.getElementById('audio-toggle').setAttribute('aria-label', isOn ? 'Mute sound' : 'Enable sound');
        document.getElementById('audio-toggle-icon').textContent = isOn ? '🔊' : '🔇';
        document.getElementById('audio-toggle-label').textContent = isOn ? 'On' : 'Off';
        document.getElementById('audio-toggle').style.opacity = isOn ? '1' : '0.72';
    },

    renderMenu() {
        this.state = 'MENU';
        AudioSystem.stopAllLoops();
        const content = document.getElementById('game-content');
        const controls = document.getElementById('game-controls');

        content.innerHTML = `
            <div class="menu-card animate-float">
                <div class="menu-kicker">Arcade Idol</div>
                <div class="hero-avatar" aria-hidden="true">🎧</div>
                <div class="menu-emoji">✨</div>
                <h2 class="menu-subtitle">Style the neon mascot for one fast show-floor round.</h2>
            </div>
        `;

        controls.innerHTML = `
            <button id="btn-start" class="btn-primary wide-button">Start Round</button>
        `;

        document.getElementById('btn-start').onclick = () => {
            this.unlockAudio();
            this.updateAudioToggle(AudioSystem.isEnabled());
            AudioSystem.playStart();
            this.renderCategorySelect();
        };
    },

    renderCategorySelect() {
        this.state = 'SELECT';
        AudioSystem.stopAllLoops();
        AudioSystem.playMenuOpen();
        const content = document.getElementById('game-content');
        const controls = document.getElementById('game-controls');

        content.innerHTML = `
            <div class="category-grid animate-pop">
                <button class="category-btn" data-cat="shirt">
                    <span class="category-icon">👕</span>
                    <span>
                        <span class="category-label">Stage Outfit</span>
                        <span class="selection-hint">Main costume shell</span>
                    </span>
                </button>
                <button class="category-btn" data-cat="bag">
                    <span class="category-icon">👜</span>
                    <span>
                        <span class="category-label">Gear Bag</span>
                        <span class="selection-hint">Backstage supply kit</span>
                    </span>
                </button>
                <button class="category-btn" data-cat="shoe">
                    <span class="category-icon">👟</span>
                    <span>
                        <span class="category-label">Speed Kicks</span>
                        <span class="selection-hint">Dash-ready footwear</span>
                    </span>
                </button>
            </div>
        `;

        controls.innerHTML = `<p class="footer-note">Pick one piece to prep for the show floor.</p>`;

        document.querySelectorAll('.category-btn').forEach((btn) => {
            btn.onclick = () => {
                AudioSystem.playUIClick();
                this.selectedCategory = btn.dataset.cat;
                this.startSewingPhase();
            };
        });
    },

    startSewingPhase() {
        this.state = 'SEW';
        this.pointsHit = 0;
        this.currentDesign = { color: '#e5e7eb', decoration: null };
        AudioSystem.startGameplayLoop();

        const content = document.getElementById('game-content');
        const controls = document.getElementById('game-controls');

        content.innerHTML = `
            <div class="stage-card animate-pop">
                <div class="section-title">Repair Bay</div>
                <div id="canvas-container">
                    ${ASSETS[this.selectedCategory]}
                    <!-- [agent-note][stage3] resolved-gif: sewing-hit and win feedback -> catalogs/gifs.json -->
                    <div id="sew-overlay"></div>
                    <div id="feedback-banner" class="feedback-banner info" hidden></div>
                    <div id="hit-gif" class="feedback-gif hit-gif" aria-hidden="true">
                        <img src="${MEDIA.gifs.hit}" alt="Impact spark feedback">
                    </div>
                    <div id="win-gif" class="feedback-gif win-gif" aria-hidden="true">
                        <img src="${MEDIA.gifs.win}" alt="Celebration feedback">
                    </div>
                </div>
                <div class="stage-glow" aria-hidden="true"></div>
            </div>
        `;

        controls.innerHTML = `
            <div class="progress-panel">
                <div class="progress-labels">
                    <span>Patch Points</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        `;

        this.showFeedback('Tap every flashing seam. Finish the full repair combo.', 'info');
        this.generateSewPoints();
    },

    generateSewPoints() {
        const overlay = document.getElementById('sew-overlay');
        overlay.innerHTML = '';
        overlay.style.position = 'absolute';
        overlay.style.inset = '0';

        let points = [];
        if (this.selectedCategory === 'shirt') {
            points = [[50,50], [150,50], [20,80], [180,80], [60,180], [140,180]];
        } else if (this.selectedCategory === 'bag') {
            points = [[70,60], [130,60], [40,60], [160,60], [40,160], [160,160]];
        } else if (this.selectedCategory === 'shoe') {
            points = [[20,120], [60,70], [160,90], [170,140], [140,170], [40,170]];
        }

        this.totalPoints = points.length;
        this.pointsHit = 0;

        points.forEach((pos, index) => {
            const el = document.createElement('div');
            el.className = 'sew-point animate-pop';
            el.style.left = (pos[0] / 200 * 100) + '%';
            el.style.top = (pos[1] / 200 * 100) + '%';
            el.style.animationDelay = (index * 0.1) + 's';

            el.onpointerdown = (e) => {
                e.preventDefault();
                this.handleSewHit(el);
            };

            overlay.appendChild(el);
        });
    },

    handleSewHit(el) {
        if (el.classList.contains('hit')) {
            AudioSystem.playBlocked();
            this.showFeedback('That seam is already repaired.', 'warning');
            return;
        }

        el.classList.add('hit');
        AudioSystem.playHit();
        this.showGIF('hit', 420);
        this.pointsHit++;

        const pct = Math.round((this.pointsHit / this.totalPoints) * 100);
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-text').innerText = pct + '%';

        if (pct < 100) {
            AudioSystem.playPickup();
            this.showFeedback(`Repair combo ${pct}% — keep stitching.`, 'info');
        }

        if (this.pointsHit >= this.totalPoints) {
            AudioSystem.playLevelComplete();
            this.showGIF('win', 1200);
            this.showFeedback('Repair complete. Move into style polish mode.', 'success');
            setTimeout(() => {
                this.startDesignPhase();
            }, 650);
        }
    },

    startDesignPhase() {
        this.state = 'DESIGN';
        AudioSystem.startGameplayLoop();
        const controls = document.getElementById('game-controls');
        const overlay = document.getElementById('sew-overlay');
        if (overlay) overlay.innerHTML = '';

        controls.innerHTML = `
            <div class="design-controls">
                <div class="swatch-row">
                    <button class="color-swatch" style="background:#f87171" data-color="#f87171" aria-label="Coral"></button>
                    <button class="color-swatch" style="background:#60a5fa" data-color="#60a5fa" aria-label="Sky"></button>
                    <button class="color-swatch" style="background:#4ade80" data-color="#4ade80" aria-label="Mint"></button>
                    <button class="color-swatch" style="background:#facc15" data-color="#facc15" aria-label="Gold"></button>
                    <button class="color-swatch" style="background:#c084fc" data-color="#c084fc" aria-label="Neon Violet"></button>
                </div>
                <div class="deco-row">
                    <button class="btn-deco" data-deco="star" aria-label="Star">⭐</button>
                    <button class="btn-deco" data-deco="heart" aria-label="Heart">❤️</button>
                    <button class="btn-deco" data-deco="bow" aria-label="Bow">🎀</button>
                </div>
                <button id="btn-finish" class="btn-primary">Lock In Look</button>
            </div>
        `;

        this.showFeedback('Choose one neon palette and a final accent.', 'info');

        document.querySelectorAll('.color-swatch').forEach((btn) => {
            btn.onclick = () => {
                AudioSystem.playUIClick();
                this.applyColor(btn.dataset.color);
                document.querySelectorAll('.color-swatch').forEach((b) => b.classList.remove('selected'));
                btn.classList.add('selected');
                this.showFeedback('Palette synced.', 'success');
            };
        });

        document.querySelectorAll('.btn-deco').forEach((btn) => {
            btn.onclick = () => {
                AudioSystem.playSuccess();
                this.applyDecoration(btn.dataset.deco);
                this.showFeedback('Accent attached to the outfit.', 'success');
            };
        });

        document.getElementById('btn-finish').onclick = () => {
            if (!this.currentDesign.decoration) {
                AudioSystem.playBlocked();
                this.showFeedback('Add one accent before locking the look.', 'warning');
                return;
            }
            AudioSystem.playLevelComplete();
            this.showResult();
        };
    },

    applyColor(color) {
        this.currentDesign.color = color;
        const base = document.getElementById('item-base');
        if (base) base.style.fill = color;
    },

    applyDecoration(type) {
        this.currentDesign.decoration = type;
        const layer = document.getElementById('decoration-layer');
        if (layer && DECORATIONS[type]) {
            layer.innerHTML = DECORATIONS[type];
        }
    },

    showResult() {
        this.state = 'RESULT';
        AudioSystem.startVictoryLoop();
        const controls = document.getElementById('game-controls');

        this.spawnConfetti();
        this.showGIF('win', 1600);

        controls.innerHTML = `
            <div class="result-card animate-pop">
                <div class="menu-kicker">Performance Locked</div>
                <h3 style="margin:0 0 0.5rem; font-size:1.6rem; color:var(--gold-400); font-family:'Audiowide', system-ui, sans-serif; letter-spacing:0.05em; text-transform:uppercase;">Show Ready!</h3>
                <p class="footer-note" style="margin-bottom:1rem;">The neon idol is stage-ready with your chosen finish.</p>
                <div class="result-actions">
                    <button id="btn-restart" class="btn-primary">Prep Another</button>
                    <button id="btn-menu" class="btn-secondary">Menu</button>
                </div>
            </div>
        `;

        this.showFeedback('Look locked. Victory loop is now active.', 'success');

        document.getElementById('btn-restart').onclick = () => {
            AudioSystem.playUIClick();
            this.renderCategorySelect();
        };

        document.getElementById('btn-menu').onclick = () => {
            AudioSystem.playUIClick();
            this.renderMenu();
        };
    },

    showFeedback(message, type = 'info') {
        const banner = document.getElementById('feedback-banner');
        if (!banner) return;
        banner.hidden = false;
        banner.className = `feedback-banner ${type}`;
        banner.textContent = message;
        clearTimeout(this.feedbackTimer);
        this.feedbackTimer = setTimeout(() => {
            if (banner) banner.hidden = true;
        }, 1600);
    },

    showGIF(kind, duration = 900) {
        const map = {
            hit: document.getElementById('hit-gif'),
            win: document.getElementById('win-gif')
        };
        const el = map[kind];
        if (!el) return;
        el.classList.add('is-visible');
        clearTimeout(this.gifTimers[kind]);
        this.gifTimers[kind] = setTimeout(() => {
            el.classList.remove('is-visible');
        }, duration);
    },

    spawnConfetti() {
        const colors = ['#ec4899', '#8b5cf6', '#facc15', '#4ade80'];
        for (let i = 0; i < 50; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            el.style.animationDuration = (Math.random() * 2 + 2) + 's';
            el.style.top = '-10px';
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 4000);
        }
    }
};

window.onload = () => Game.init();
</script>
</body>
</html>
