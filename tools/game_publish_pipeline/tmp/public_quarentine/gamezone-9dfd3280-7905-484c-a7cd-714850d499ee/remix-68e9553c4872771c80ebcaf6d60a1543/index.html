<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Flappy Briefing: Skyboard Meme Flight</title>
  <!-- [agent-note][stage3] resolved-font: titles -> Bangers | ui -> Rajdhani from catalogs/fonts.json -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Bangers&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #6ee7ff;
      --bg-mid: #79d7ff;
      --bg-bottom: #ffd98a;
      --panel: rgba(15, 96, 138, 0.82);
      --panel-strong: rgba(9, 66, 108, 0.94);
      --stroke: #08314d;
      --cyan: #dffcff;
      --pink: #ff8a2a;
      --gold: #ffe766;
      --peach: #fff8dc;
      --danger: #ff5d73;
      --lime: #9cff6e;
      --shadow: rgba(8, 49, 77, 0.92);
      --text: #fffdf2;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.36), transparent 34%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 50%, var(--bg-bottom));
      font-family: 'Rajdhani', system-ui, sans-serif;
      color: var(--text);
    }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .hidden { display: none !important; }
    .inset-0 { inset: 0; }
    .top-2 { top: 0.5rem; }
    .left-2 { left: 0.5rem; }
    .right-2 { right: 0.5rem; }
    .left-3 { left: 0.75rem; }
    .right-3 { right: 0.75rem; }
    .bottom-3 { bottom: 0.75rem; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { width: 100%; height: 100%; }
    .max-w-xs { max-width: 20rem; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .flex { display: flex; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: minmax(0, 1fr); }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 1rem; }
    .text-center { text-align: center; }
    .text-sm { font-size: 0.95rem; }
    .text-2xl { font-size: 1.5rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .leading-snug { line-height: 1.35; }
    .rounded-xl { border-radius: 0.75rem; }
    .text-white { color: #fff; }
    .panel {
      background: linear-gradient(180deg, rgba(15, 96, 138, 0.94), rgba(9, 66, 108, 0.94));
      border: 3px solid rgba(255, 231, 102, 0.92);
      box-shadow: 0 10px 26px rgba(6, 52, 82, 0.34), inset 0 0 0 2px rgba(156, 255, 110, 0.24);
      border-radius: 18px;
      color: var(--text);
      font-family: 'Rajdhani', system-ui, sans-serif;
      backdrop-filter: blur(6px);
    }
    .hud-pill {
      background: linear-gradient(180deg, rgba(255, 253, 242, 0.98), rgba(255, 248, 220, 0.94));
      border: 2px solid var(--shadow);
      box-shadow: 0 4px 0 var(--shadow), 0 0 16px rgba(255, 231, 102, 0.24);
      border-radius: 999px;
      color: #08314d;
      font-weight: 600;
      font-family: 'Rajdhani', system-ui, sans-serif;
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
    }
    .hud-pill::before {
      content: '';
      display: inline-block;
      width: 0.78em;
      height: 0.78em;
      margin-right: 0.38em;
      border-radius: 50% 50% 50% 10%;
      background: linear-gradient(135deg, var(--gold), var(--pink));
      box-shadow: inset -1px -1px 0 rgba(8,49,77,0.18);
      transform: rotate(-24deg);
      vertical-align: -0.08em;
    }
    #hpLabel::before {
      border-radius: 55% 55% 42% 42%;
      background: linear-gradient(180deg, #fffdf2, var(--lime));
      transform: rotate(0deg);
    }
    .route-pill {
      align-self: center;
      max-width: min(92vw, 23rem);
      padding: 0.26rem 0.72rem;
      border-radius: 999px;
      border: 2px solid rgba(8,49,77,0.72);
      color: #08314d;
      background:
        radial-gradient(circle at 14% 50%, rgba(255,255,255,0.95) 0 9px, transparent 10px),
        linear-gradient(90deg, rgba(156,255,110,0.94), rgba(255,231,102,0.96));
      box-shadow: 0 3px 0 rgba(8,49,77,0.74), 0 0 18px rgba(255,231,102,0.2);
      font-weight: 700;
      font-size: 0.76rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .choice-btn {
      min-height: 52px;
      border: 2px solid rgba(8, 49, 77, 0.95);
      box-shadow: 0 5px 0 rgba(8, 49, 77, 0.95), 0 0 20px rgba(255, 231, 102, 0.24);
      border-radius: 14px;
      font-weight: 700;
      color: #08314d;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.26) 0 7px, transparent 7px 14px),
        linear-gradient(180deg, #fffdf2, #b8f7b2);
      background-size: 22px 100%, auto;
      font-family: 'Rajdhani', system-ui, sans-serif;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
      position: relative;
      overflow: hidden;
    }
    .choice-btn::after {
      content: '';
      position: absolute;
      right: 10px;
      top: 50%;
      width: 18px;
      height: 10px;
      border-radius: 70% 44% 55% 22%;
      background: rgba(255,231,102,0.72);
      border: 1px solid rgba(8,49,77,0.36);
      transform: translateY(-50%) rotate(-12deg);
      pointer-events: none;
    }
    .choice-btn:hover,
    .choice-btn:focus-visible {
      filter: brightness(1.04);
      outline: none;
    }
    h2, #restart-btn {
      font-family: 'Bangers', system-ui, sans-serif;
      letter-spacing: 0.05em;
    }
    #hud {
      pointer-events: none;
    }
    #promptLabel {
      border-color: rgba(156, 255, 110, 0.92);
      position: relative;
      overflow: hidden;
    }
    #promptLabel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 45%, transparent 100%);
      pointer-events: none;
    }
    #choice-panel {
      /* [agent-note][stage2] preserve: control-zone | reason: already mobile-safe */
      padding-bottom: max(0px, env(safe-area-inset-bottom));
    }
    #restart-btn {
      background: linear-gradient(180deg, #ffb347, #ff8a2a);
      border: 3px solid rgba(8, 49, 77, 0.96);
      box-shadow: 0 4px 0 rgba(8, 49, 77, 0.96), 0 0 18px rgba(255, 231, 102, 0.32);
    }
    #restart-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(22, 11, 53, 0.96);
    }
    .choice-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(22, 11, 53, 0.96); }
    #feedback-gifs {
      pointer-events: none;
      inset: auto 0 calc(5.5rem + env(safe-area-inset-bottom)) 0;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 0 0.75rem;
    }
    .feedback-gif {
      width: min(26vw, 92px);
      max-height: 92px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 20px rgba(7, 5, 24, 0.28);
      opacity: 0;
      transform: translateY(10px) scale(0.92);
      transition: opacity 180ms ease, transform 180ms ease;
      background: rgba(255,255,255,0.08);
    }
    .feedback-gif.show {
      opacity: 0.95;
      transform: translateY(0) scale(1);
    }
    .feedback-gif.fail {
      border-color: rgba(255, 110, 160, 0.8);
    }
    .feedback-gif.win {
      border-color: rgba(255, 227, 123, 0.88);
    }
    .shake { animation: kshake 180ms linear; }
    @keyframes kshake {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(-4px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-3px, 1px); }
      100% { transform: translate(0px, 0px); }
    }
  </style>
</head>

  <script id="game-config" type="application/x-game-config">
  {
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 6, "min": 1, "max": 12 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff5fa2" }
  }
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const hud = document.getElementById('hud');
    const choicePanel = document.getElementById('choice-panel');
    const choiceA = document.getElementById('choiceA');
    const choiceB = document.getElementById('choiceB');
    const promptLabel = document.getElementById('promptLabel');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('finalScore');
    const scoreLabel = document.getElementById('scoreLabel');
    const hpLabel = document.getElementById('hpLabel');
    const routeLabel = document.getElementById('routeLabel');
    const restartBtn = document.getElementById('restart-btn');
    const bgm = document.getElementById('bgm_main');
    const successGif = document.getElementById('gif-success');
    if (bgm) bgm.volume = 0.2;
    const failGif = document.getElementById('gif-fail');

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));
    window.updateGameConfig = (key, val) => {
      if (!window.gameConfigDefs[key]) return;
      const def = window.gameConfigDefs[key];
      if (def.type === 'number') {
        const n = Number(val);
        if (Number.isFinite(n)) window.gameConfig[key] = Math.max(def.min, Math.min(def.max, n));
      } else if (def.type === 'color') {
        if (/^#[0-9a-fA-F]{6}$/.test(String(val))) {
          window.gameConfig[key] = String(val);
          if (choiceA) choiceA.style.borderColor = '#2e1b62';
          if (choiceB) choiceB.style.borderColor = '#2e1b62';
        }
      }
      document.title = 'Flappy Briefing: Skyboard Meme Flight';
    };

    let cw = 360, ch = 640, dpr = Math.max(1, window.devicePixelRatio || 1);
    let initialized = false;
    let gameState = 'PLAYING';
    let lastTime = 0;
    let flashTimer = 0;
    let shakeTimer = 0;
    let pulseTimer = 0;
    let score = 0;
    let lives = 3;
    let pointer = { x: 0, y: 0, down: false };
    let hero = null;
    const particles = [];
    const petals = [];
    let storyIndex = 0;
    let choiceCooldown = 0;
    let starsOffsetA = 0;
    let starsOffsetB = 0;
    let gifTimer = 0;
    let activeGif = null;

    const storyNodes = [
      { prompt: "Cloud Lobby Takeoff: the first pipe gap opens in the sky-boardroom. Choose the reply that keeps lift.", options: ["Glide through: “Let’s sync before we sign anything.”", "Nosedive off-route and leave the pitch hanging."], good: 0 },
      { prompt: "Pipe Hallway Sync: the next green tower asks what future deserves the hype.", options: ["Hold altitude: “A fair team-up with trust and good vibes.”", "Clip the low pipe: “Just show me the stock options.”"], good: 0 },
      { prompt: "Meme Monsoon Midflight: chatter turns into gusts around the route.", options: ["Ride the wind and hear the plan out.", "Slam the pipe by roasting the whole room."], good: 0 },
      { prompt: "Viral Tower Gauntlet: storm lights flash as a save keeps the courier airborne.", options: ["Stabilize: “That save was elite, thanks.”", "Bump the pipe and blame the helper anyway."], good: 0 },
      { prompt: "Golden Gap Finale: thread the legendary closing route without losing Focus.", options: ["“We build trust first, then the legend.”", "Dive away: “Nope, I’m staying frosty for the clip.”"], good: 0 }
    ];

    const flightLegs = [
      { level: 1, short: 'Cloud Lobby', sky: ['#6ee7ff', '#79d7ff', '#ffd98a'], sun: 'rgba(255,248,190,0.56)', accent: '#9cff6e', wind: false, neon: false },
      { level: 2, short: 'Pipe Hallway', sky: ['#5fe5ff', '#72d6f8', '#ffe08f'], sun: 'rgba(255,245,178,0.5)', accent: '#39b54a', wind: false, neon: false },
      { level: 3, short: 'Meme Monsoon', sky: ['#76b9ff', '#7d87ec', '#ffd2a0'], sun: 'rgba(204,244,255,0.34)', accent: '#7cf6ff', wind: true, neon: false },
      { level: 4, short: 'Viral Towers', sky: ['#3269cf', '#6243c7', '#ff9aa8'], sun: 'rgba(255,120,220,0.3)', accent: '#ff8ad8', wind: true, neon: true },
      { level: 5, short: 'Golden Gap', sky: ['#62d9ff', '#ffb96e', '#ffe766'], sun: 'rgba(255,231,102,0.68)', accent: '#ffe766', wind: false, neon: true }
    ];

    function getFlightLeg() {
      return flightLegs[Math.max(0, Math.min(flightLegs.length - 1, storyIndex))] || flightLegs[0];
    }

    const audioManager = {
      ctx: null,
      unlocked: false,
      buffers: {},
      initDone: false,
      async init() {
        if (this.initDone) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = AC ? new AC() : null;
        const sfxEls = [
          document.getElementById('sfx_collect'),
          document.getElementById('sfx_hit'),
          document.getElementById('sfx_ui'),
          document.getElementById('sfx_gameover')
        ].filter(Boolean);
        for (const el of sfxEls) {
          try {
            const res = await fetch(el.src);
            const arr = await res.arrayBuffer();
            if (this.ctx) this.buffers[el.id] = await this.ctx.decodeAudioData(arr.slice(0));
          } catch (_) {}
        }
        this.initDone = true;
      },
      unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        try { this.ctx && this.ctx.resume(); } catch (_) {}
        if (bgm) bgm.play().catch(() => {});
      },
      playSfx(id) {
        const synthType = id === 'sfx_hit' || id === 'sfx_gameover' ? 'hit' : id === 'sfx_ui' ? 'ui' : 'collect';
        if (!this.ctx) return this.synth(synthType);
        const b = this.buffers[id];
        if (b) {
          const src = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          gain.gain.value = id === 'sfx_gameover' ? 0.18 : id === 'sfx_hit' ? 0.2 : id === 'sfx_ui' ? 0.12 : 0.16;
          src.buffer = b;
          src.connect(gain).connect(this.ctx.destination);
          src.start(0);
        } else this.synth(synthType);
      },
      synth(type) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type === 'hit' ? 'square' : type === 'ui' ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(type === 'hit' ? 160 : type === 'ui' ? 480 : 640, now);
        osc.frequency.exponentialRampToValueAtTime(type === 'hit' ? 90 : type === 'ui' ? 720 : 910, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(type === 'ui' ? 0.07 : 0.11, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
    };

    function vibrate(style) {
      window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate',
        requestId: 'h5-' + Date.now(),
        version: '1.0',
        params: { style }
      });
    }

    function setState(next) {
      gameState = next;
      if (gameState === 'PLAYING') {
        hud.classList.remove('hidden');
        choicePanel.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
      } else {
        hud.classList.add('hidden');
        choicePanel.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
      }
    }

    function buildPetals() {
      petals.length = 0;
      for (let i = 0; i < 20; i++) {
        petals.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          s: 4 + Math.random() * 8,
          vy: 16 + Math.random() * 20,
          vx: -12 + Math.random() * 24,
          rot: Math.random() * Math.PI * 2
        });
      }
    }

    function updateStoryText() {
      const node = storyNodes[storyIndex] || storyNodes[storyNodes.length - 1];
      const leg = getFlightLeg();
      promptLabel.textContent = node.prompt;
      choiceA.textContent = node.options[0];
      choiceB.textContent = node.options[1];
      if (routeLabel) routeLabel.textContent = `Leg ${leg.level}/5 · ${leg.short}`;
      document.body.dataset.flightLeg = String(leg.level);
    }

    function showFeedbackGif(kind) {
      gifTimer = 0.85;
      activeGif = kind;
      if (successGif) successGif.classList.toggle('show', kind === 'success');
      if (failGif) failGif.classList.toggle('show', kind === 'fail');
    }

    function hideFeedbackGifs() {
      activeGif = null;
      gifTimer = 0;
      if (successGif) successGif.classList.remove('show');
      if (failGif) failGif.classList.remove('show');
    }

    function initGame() {
      score = 0;
      lives = 3;
      flashTimer = 0;
      shakeTimer = 0;
      pulseTimer = 0;
      storyIndex = 0;
      choiceCooldown = 0;
      hideFeedbackGifs();
      pointer.x = cw * 0.5;
      pointer.y = ch * 0.82;
      pointer.down = false;
      hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      particles.length = 0;
      buildPetals();
      updateStoryText();
      updateHUD();
    }

    function restartGame() {
      audioManager.playSfx('sfx_ui');
      initGame();
      setState('PLAYING');
      if (bgm) bgm.play().catch(() => {});
    }

    function updateHUD() {
      scoreLabel.textContent = `Feathers: ${score}`;
      hpLabel.textContent = `Focus: ${lives}`;
    }

    function emitParticles(x, y, good) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() * 2 - 1) * (good ? 110 : 140),
          vy: -30 - Math.random() * 130,
          life: 0.35 + Math.random() * 0.35,
          t: 0,
          good
        });
      }
    }

    function applyChoice(choiceIndex) {
      if (choiceCooldown > 0 || gameState !== 'PLAYING') return;
      const node = storyNodes[storyIndex];
      if (!node) return;
      choiceCooldown = 0.25;
      const good = choiceIndex === node.good;
      if (good) {
        score += 20;
        pulseTimer = 0.16;
        flashTimer = 0.08;
        audioManager.playSfx('sfx_collect');
        showFeedbackGif('success');
        vibrate('light');
        emitParticles(cw * 0.5, ch * 0.58, true);
      } else {
        lives -= 1;
        shakeTimer = 0.16;
        flashTimer = 0.16;
        audioManager.playSfx('sfx_hit');
        showFeedbackGif('fail');
        vibrate(lives <= 0 ? 'heavy' : 'medium');
        emitParticles(cw * 0.5, ch * 0.58, false);
      }
      storyIndex = Math.min(storyNodes.length - 1, storyIndex + 1);
      updateStoryText();
      updateHUD();
      if (lives <= 0) {
        audioManager.playSfx('sfx_gameover');
        setState('GAMEOVER');
        finalScore.textContent = `Feathers banked: ${score}`;
      }
    }

    function handleGameInput(e, type) {
      const px = typeof e.clientX === 'number' ? e.clientX : pointer.x;
      const py = typeof e.clientY === 'number' ? e.clientY : pointer.y;
      if (type === 'pointerdown') pointer.down = true;
      if (type === 'pointerup' || type === 'pointercancel') pointer.down = false;
      pointer.x = Math.max(0, Math.min(cw, px));
      pointer.y = Math.max(0, Math.min(ch, py));
      if (hero) {
        hero.targetX = pointer.x;
        hero.targetY = ch * 0.82;
      }
    }

    function handleGlobalInput(e) {
      unlockAudio();
      const t = e && e.type ? e.type : 'pointerdown';

      if (e && e.currentTarget === restartBtn) {
        if (gameState === 'GAMEOVER') restartGame();
        return;
      }
      if (e && e.currentTarget === choiceA) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(0);
        }
        return;
      }
      if (e && e.currentTarget === choiceB) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(1);
        }
        return;
      }

      if (e && e.currentTarget !== canvas) return;
      if (e && e.cancelable && t !== 'pointermove') e.preventDefault();

      if (gameState === 'GAMEOVER') {
        if (t === 'pointerdown') restartGame();
        return;
      }
      if (gameState === 'PLAYING') handleGameInput(e, t);
    }

    function unlockAudio() {
      audioManager.unlock();
      if (bgm) bgm.play().catch(() => {});
    }

    function resize(width, height) {
      cw = width;
      ch = height;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(cw * dpr);
      canvas.height = Math.floor(ch * dpr);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      if (hero) {
        hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
        hero.targetX = Math.max(hero.r, Math.min(cw - hero.r, hero.targetX));
        hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));
        hero.targetY = Math.max(hero.r, Math.min(ch - hero.r, hero.targetY));
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawFeatherShape(x, y, size, angle, color, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.48, size * 1.08, -0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(8,49,77,0.24)';
      ctx.lineWidth = Math.max(1, size * 0.08);
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.78);
      ctx.lineTo(0, size * 0.82);
      ctx.stroke();
      ctx.restore();
    }

    function drawBackground(dt) {
      const leg = getFlightLeg();
      const g = ctx.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, leg.sky[0]);
      g.addColorStop(0.48, leg.sky[1]);
      g.addColorStop(1, leg.sky[2]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cw, ch);

      const sun = ctx.createRadialGradient(cw * 0.82, ch * 0.16, 0, cw * 0.82, ch * 0.16, cw * 0.34);
      sun.addColorStop(0, leg.sun);
      sun.addColorStop(1, 'rgba(255,248,190,0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, cw, ch);

      starsOffsetA += dt * (10 + leg.level * 1.8);
      starsOffsetB += dt * (16 + leg.level * 2.2);

      // [agent-note][world-design-superprompt] authored-background: procedural sky, clouds, and pipes own the scene; no static stock backdrop.
      for (let i = 0; i < 9; i++) {
        const x = (i * 112 - starsOffsetB * (0.42 + i * 0.01)) % (cw + 180) - 90;
        const y = ch * (0.14 + (i % 4) * 0.075);
        const s = 22 + (i % 3) * 7 + leg.level * 0.8;
        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.beginPath();
        ctx.ellipse(x, y, s * 1.5, s * 0.62, 0, 0, Math.PI * 2);
        ctx.ellipse(x + s * 0.8, y + 3, s * 1.25, s * 0.55, 0, 0, Math.PI * 2);
        ctx.ellipse(x - s * 0.7, y + 5, s, s * 0.48, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (leg.wind) {
        ctx.strokeStyle = leg.neon ? 'rgba(255,255,255,0.24)' : 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 10; i++) {
          const x = (i * 70 - starsOffsetB * 1.3) % (cw + 120) - 60;
          const y = ch * 0.18 + (i % 5) * ch * 0.07;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + 30, y - 10, x + 72, y + 3);
          ctx.stroke();
        }
      }

      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        p.y += p.vy * dt;
        p.x += p.vx * dt + Math.sin((performance.now() * 0.001) + i) * 0.22;
        p.rot += dt * 1.2;
        if (p.y > ch + 20) { p.y = -20; p.x = Math.random() * cw; }
        if (p.x < -20) p.x = cw + 20;
        if (p.x > cw + 20) p.x = -20;
        drawFeatherShape(p.x, p.y, p.s, p.rot, i % 3 === 0 ? '#ffe766' : '#fffdf2', i % 3 === 0 ? 0.58 : 0.62);
      }

      for (let i = 0; i < 8; i++) {
        const w = 38 + (i % 3) * 8;
        const h = 92 + i * 15 + Math.max(0, leg.level - 1) * 8;
        const x = (i * 86 + starsOffsetA * (0.82 + i * 0.035)) % (cw + 130) - 65;
        const y = ch * 0.58 - Math.max(0, leg.level - 2) * 5;
        ctx.fillStyle = i % 2 ? 'rgba(57,181,74,0.72)' : 'rgba(22,122,45,0.72)';
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 8);
        ctx.fill();
        ctx.strokeStyle = 'rgba(8,49,77,0.32)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = leg.level === 5 && i % 3 === 0 ? 'rgba(255,231,102,0.82)' : 'rgba(156,255,110,0.76)';
        ctx.beginPath();
        ctx.roundRect(x - 5, y - 12, w + 10, 18, 7);
        ctx.fill();
        ctx.strokeStyle = 'rgba(8,49,77,0.26)';
        ctx.stroke();
        ctx.fillStyle = 'rgba(8,49,77,0.18)';
        ctx.fillRect(x + 8, y + 14, 5, Math.max(18, h * 0.34));
        if (leg.neon && i % 2 === 0) {
          ctx.fillStyle = leg.accent;
          ctx.globalAlpha = 0.55;
          ctx.fillRect(x + w * 0.5, y + 26, w * 0.28, 7);
          ctx.globalAlpha = 1;
        }
      }

      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(0, ch * 0.54, cw, 2);

      const runway = ctx.createLinearGradient(0, ch * 0.54, 0, ch);
      runway.addColorStop(0, 'rgba(255,248,220,0.12)');
      runway.addColorStop(1, leg.level >= 4 ? 'rgba(28,20,92,0.32)' : 'rgba(8,49,77,0.24)');
      ctx.fillStyle = runway;
      ctx.fillRect(0, ch * 0.54, cw, ch * 0.46);

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < 7; i++) {
        const x = (i * 74 - starsOffsetA * 0.35) % (cw + 90) - 45;
        const y = ch * 0.68 + (i % 3) * 18;
        ctx.beginPath();
        ctx.roundRect(x, y, 54, 9, 6);
        ctx.fill();
      }
    }

    function drawCharacters() {
      const y = ch * 0.47;
      const r = Math.max(24, cw * 0.09);
      const bob = Math.sin(performance.now() * 0.0035) * 2.5;

      // protagonist: skyboard ally bird executive silhouette
      ctx.save();
      ctx.translate(cw * 0.3, y + bob);
      ctx.shadowColor = 'rgba(255,231,102,0.45)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffd84f';
      ctx.strokeStyle = '#08314d';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff8a2a';
      ctx.beginPath(); ctx.moveTo(r * 0.92, -r * 0.08); ctx.lineTo(r * 1.42, r * 0.1); ctx.lineTo(r * 0.92, r * 0.28); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fffdf2';
      ctx.beginPath(); ctx.arc(r * 0.24, -r * 0.18, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#08314d';
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.16, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff1a6';
      ctx.beginPath(); ctx.ellipse(-r * 0.22, r * 0.16, r * 0.54, r * 0.28, -0.35, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#08314d';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#39b54a';
      ctx.beginPath(); ctx.roundRect(-r * 0.42, r * 0.82, r * 0.84, r * 0.28, 8); ctx.fill();
      ctx.fillStyle = '#ffe766';
      ctx.fillRect(-r * 0.1, r * 0.84, r * 0.2, r * 0.24);
      drawFeatherShape(-r * 0.52, -r * 0.35, r * 0.42, -0.9, '#fffdf2', 0.82);
      ctx.restore();

      // guide: pipe-tower executive bird marks the social gap route
      ctx.save();
      ctx.translate(cw * 0.7, y - 6 - bob * 0.8);
      ctx.shadowColor = 'rgba(57,181,74,0.38)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#fff8dc';
      ctx.strokeStyle = '#08314d';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.02, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#167a2d';
      ctx.beginPath();
      ctx.moveTo(-r, -r * 0.1); ctx.quadraticCurveTo(-r * 0.2, -r * 1.15, r, -r * 0.25); ctx.lineTo(r, -r * 0.55);
      ctx.quadraticCurveTo(0, -r * 1.34, -r, -r * 0.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, -r * 0.22); ctx.lineTo(-r * 0.08, -r * 0.3);
      ctx.moveTo(r * 0.08, -r * 0.3); ctx.lineTo(r * 0.55, -r * 0.22);
      ctx.stroke();
      ctx.fillStyle = '#08314d';
      ctx.beginPath(); ctx.arc(-r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#39b54a'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, r * 0.12, r * 0.31, 0.4, Math.PI - 0.4); ctx.stroke();
      ctx.fillStyle = 'rgba(9,66,108,0.92)';
      ctx.beginPath(); ctx.roundRect(-r * 0.95, r * 1.0, r * 1.9, r * 1.95, 10); ctx.fill();
      ctx.fillStyle = '#ffe766';
      ctx.beginPath();
      ctx.moveTo(0, r * 1.05); ctx.lineTo(-r * 0.18, r * 1.65); ctx.lineTo(0, r * 2.28); ctx.lineTo(r * 0.18, r * 1.65); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(-r * 0.42, r * 1.25 + i * r * 0.46, r * 0.32, r * 0.22);
        ctx.fillRect(r * 0.1, r * 1.25 + i * r * 0.46, r * 0.32, r * 0.22);
      }
      ctx.restore();
    }

    function drawHero() {
      if (!hero) return;
      const x = hero.x;
      const y = hero.y + Math.sin(performance.now() * 0.006) * 2;
      const r = Math.max(0, hero.r);
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowColor = 'rgba(255,231,102,0.52)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffd84f';
      ctx.strokeStyle = '#08314d';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff8a2a';
      ctx.beginPath(); ctx.moveTo(r * 0.72, -r * 0.05); ctx.lineTo(r * 1.25, r * 0.12); ctx.lineTo(r * 0.72, r * 0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fffdf2';
      ctx.beginPath(); ctx.arc(r * 0.22, -r * 0.16, r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#08314d';
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.13, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff1a6';
      ctx.beginPath(); ctx.ellipse(-r * 0.24, r * 0.16, r * 0.46, r * 0.25, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#08314d';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.fillStyle = '#39b54a';
      ctx.beginPath(); ctx.roundRect(-r * 0.55, r * 0.78, r * 1.1, r * 0.18, 6); ctx.fill();
      ctx.fillStyle = '#ffe766';
      ctx.beginPath(); ctx.arc(-r * 0.46, r * 0.87, r * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function update(dt) {
      if (!hero || !Number.isFinite(hero.x) || !Number.isFinite(hero.y)) {
        hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      }

      const moveFactor = Math.max(0, Math.min(1, dt * (window.gameConfig.heroSpeed * 1.6)));
      hero.x += (hero.targetX - hero.x) * moveFactor;
      hero.y += (hero.targetY - hero.y) * Math.max(0, Math.min(1, dt * 9));
      hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
      hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));

      if (choiceCooldown > 0) choiceCooldown -= dt;
      if (flashTimer > 0) flashTimer -= dt;
      if (shakeTimer > 0) shakeTimer -= dt;
      if (pulseTimer > 0) pulseTimer -= dt;
      if (gifTimer > 0) {
        gifTimer -= dt;
        if (gifTimer <= 0) hideFeedbackGifs();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 210 * dt;
        if (p.t >= p.life) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, cw, ch);
      drawBackground(Math.min(0.05, (performance.now() - lastTime) / 1000 || 0.016));

      if (shakeTimer > 0) gameContainer.classList.add('shake');
      else gameContainer.classList.remove('shake');

      ctx.save();
      if (pulseTimer > 0 && hero) {
        const s = 1 + pulseTimer * 0.08;
        ctx.translate(hero.x, hero.y);
        ctx.scale(s, s);
        ctx.translate(-hero.x, -hero.y);
      }
      drawCharacters();
      drawHero();

      for (const p of particles) {
        const a = Math.max(0, 1 - p.t / p.life);
        if (p.good) {
          drawFeatherShape(p.x, p.y, Math.max(3, 4 + a * 5), p.t * 8 + p.x * 0.01, '#ffe766', a);
        } else {
          ctx.fillStyle = `rgba(255,90,120,${a})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0, 2 + a * 3), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      if (flashTimer > 0) {
        const red = shakeTimer > 0 ? 'rgba(255,50,75,0.22)' : 'rgba(255,255,255,0.10)';
        ctx.fillStyle = red;
        ctx.fillRect(0, 0, cw, ch);
      }
    }

    function loop(ts) {
      try {
        const dt = Math.min(0.05, Math.max(0.001, (ts - (lastTime || ts)) / 1000));
        lastTime = ts;
        if (gameState === 'PLAYING') update(dt);
        render();
      } catch (_) {}
      requestAnimationFrame(loop);
    }

    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) {
        resize(entry.contentRect.width, entry.contentRect.height);
      }
      if (!initialized) {
        initGame();
        setState('PLAYING');
        if (bgm) bgm.play().catch(() => {});
        audioManager.init().then(() => {}).catch(() => {});
        initialized = true;
        requestAnimationFrame(loop);
      }
    });
    ro.observe(canvas);

    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach((ev) => {
      canvas.addEventListener(ev, handleGlobalInput, { passive: false });
    });

    if (choiceA) choiceA.addEventListener('click', handleGlobalInput, { passive: false });
    if (choiceB) choiceB.addEventListener('click', handleGlobalInput, { passive: false });
    if (restartBtn) restartBtn.addEventListener('click', handleGlobalInput, { passive: false });
  });
  </script>
</body>
</html>
