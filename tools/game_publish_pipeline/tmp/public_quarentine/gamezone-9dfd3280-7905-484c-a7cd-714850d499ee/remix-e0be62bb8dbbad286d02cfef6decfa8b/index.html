<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hogwarts Hearts: Spellbound Choices</title>
  <!-- [agent-note][world-design-v4] authored-world: wizard-school choice journey | protect: two-choice scoring/lives loop -->
  <!-- [agent-note][stage3] resolved-font: titles -> Bangers | ui -> Rajdhani from catalogs/fonts.json -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Bangers&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #071226;
      --bg-mid: #17264f;
      --bg-bottom: #3d2a13;
      --panel: rgba(42, 31, 18, 0.86);
      --panel-strong: rgba(24, 25, 54, 0.95);
      --stroke: #1b1308;
      --cyan: #9cecff;
      --pink: #b986ff;
      --gold: #f8d978;
      --peach: #fff0cf;
      --text: #fff8e6;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at top, rgba(248, 217, 120, 0.16), transparent 32%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
      font-family: 'Rajdhani', system-ui, sans-serif;
      color: var(--text);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 16%, rgba(248,217,120,0.16), transparent 11%),
        radial-gradient(circle at 78% 22%, rgba(156,236,255,0.12), transparent 12%),
        repeating-linear-gradient(115deg, transparent 0 34px, rgba(255,248,221,0.025) 35px 36px);
      mix-blend-mode: screen;
      animation: ambientSpellWash 9s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes ambientSpellWash {
      from { opacity: 0.42; transform: translateY(0); }
      to { opacity: 0.68; transform: translateY(-10px); }
    }
    #game-container { position: relative; width: 100%; height: 100%; z-index: 1; }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .hidden { display: none !important; }
    .inset-0 { inset: 0; }
    .top-2 { top: 0.5rem; }
    .left-2 { left: 0.5rem; }
    .right-2 { right: 0.5rem; }
    .left-3 { left: 0.75rem; }
    .right-3 { right: 0.75rem; }
    .bottom-3 { bottom: 0.75rem; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { width: 100%; height: 100%; }
    .max-w-xs { max-width: 20rem; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .flex { display: flex; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: minmax(0, 1fr); }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 1rem; }
    .text-center { text-align: center; }
    .text-sm { font-size: 0.95rem; }
    .text-2xl { font-size: 1.5rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .leading-snug { line-height: 1.35; }
    .rounded-xl { border-radius: 0.75rem; }
    .text-white { color: #fff; }
    .panel {
      position: relative;
      background:
        radial-gradient(circle at 12% 10%, rgba(248, 217, 120, 0.18), transparent 22%),
        linear-gradient(180deg, rgba(51, 39, 20, 0.96), rgba(24, 25, 54, 0.94));
      border: 3px solid rgba(248, 217, 120, 0.88);
      box-shadow: 0 10px 26px rgba(6, 5, 22, 0.38), inset 0 0 0 2px rgba(156, 236, 255, 0.18);
      border-radius: 18px;
      color: var(--text);
      font-family: 'Rajdhani', system-ui, sans-serif;
      backdrop-filter: blur(6px);
    }
    .panel::before {
      content: '✦';
      position: absolute;
      top: -0.58rem;
      right: 0.8rem;
      width: 1.25rem;
      height: 1.25rem;
      display: grid;
      place-items: center;
      color: var(--gold);
      background: rgba(24, 25, 54, 0.94);
      border: 1px solid rgba(248, 217, 120, 0.7);
      border-radius: 50%;
      font-size: 0.72rem;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(248,217,120,0.35);
    }
    .hud-pill {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,0.66), transparent 20%),
        linear-gradient(180deg, rgba(255, 247, 219, 0.98), rgba(235, 205, 138, 0.94));
      border: 2px solid rgba(45, 29, 8, 0.92);
      box-shadow: 0 4px 0 rgba(45, 29, 8, 0.92), 0 0 16px rgba(248, 217, 120, 0.2);
      border-radius: 999px;
      color: #24190a;
      font-weight: 700;
      font-family: 'Rajdhani', system-ui, sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .hud-pill::after {
      content: '';
      position: absolute;
      inset: 2px 8px auto auto;
      width: 22px;
      height: 8px;
      border-top: 2px solid rgba(27,19,8,0.22);
      border-radius: 50%;
      pointer-events: none;
    }
    .choice-btn {
      position: relative;
      min-height: 52px;
      border: 2px solid rgba(45, 29, 8, 0.95);
      box-shadow: 0 5px 0 rgba(45, 29, 8, 0.95), 0 0 20px rgba(248, 217, 120, 0.22);
      border-radius: 14px;
      font-weight: 700;
      color: #24190a;
      background:
        linear-gradient(90deg, rgba(138,38,52,0.16), transparent 12%, transparent 88%, rgba(185,134,255,0.14)),
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.7), transparent 28%),
        linear-gradient(180deg, #fff8dd, #eac779);
      font-family: 'Rajdhani', system-ui, sans-serif;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }
    .choice-btn::before {
      content: '✧';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(45, 29, 8, 0.58);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .choice-btn:hover,
    .choice-btn:focus-visible {
      filter: brightness(1.04);
      outline: none;
    }
    h2, #restart-btn {
      font-family: 'Bangers', system-ui, sans-serif;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 0 rgba(27,19,8,0.55), 0 0 16px rgba(248,217,120,0.25);
    }
    #hud {
      pointer-events: none;
    }
    #promptLabel {
      border-color: rgba(156, 236, 255, 0.72);
      position: relative;
      overflow: hidden;
    }
    #promptLabel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 45%, transparent 100%);
      pointer-events: none;
    }
    #choice-panel {
      /* [agent-note][stage2] preserve: control-zone | reason: already mobile-safe */
      padding-bottom: max(0px, env(safe-area-inset-bottom));
    }
    #restart-btn {
      background: linear-gradient(180deg, #b986ff, #6544b8);
      border: 3px solid rgba(45, 29, 8, 0.96);
      box-shadow: 0 4px 0 rgba(45, 29, 8, 0.96), 0 0 18px rgba(248, 217, 120, 0.28);
    }
    #restart-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(22, 11, 53, 0.96);
    }
    .choice-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(22, 11, 53, 0.96); }
    @media (max-width: 420px) {
      .choice-btn { min-height: 50px; font-size: 0.86rem; line-height: 1.15; padding-left: 1.55rem; padding-right: 0.65rem; }
      #promptLabel { font-size: 0.86rem; line-height: 1.2; }
      .hud-pill { font-size: 0.82rem; padding-left: 0.75rem; padding-right: 0.75rem; }
    }
    #feedback-gifs {
      pointer-events: none;
      inset: auto 0 calc(5.5rem + env(safe-area-inset-bottom)) 0;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 0 0.75rem;
    }
    .feedback-gif {
      width: min(26vw, 92px);
      max-height: 92px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 20px rgba(7, 5, 24, 0.28);
      opacity: 0;
      transform: translateY(10px) scale(0.92);
      transition: opacity 180ms ease, transform 180ms ease;
      background: rgba(255,255,255,0.08);
    }
    .feedback-gif.show {
      opacity: 0.95;
      transform: translateY(0) scale(1);
    }
    .feedback-gif.fail {
      border-color: rgba(255, 110, 160, 0.8);
    }
    .feedback-gif.win {
      border-color: rgba(255, 227, 123, 0.88);
    }
    .shake { animation: kshake 180ms linear; }
    @keyframes kshake {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(-4px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-3px, 1px); }
      100% { transform: translate(0px, 0px); }
    }
  </style>
</head>

  <script id="game-config" type="application/x-game-config">
  {
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 6, "min": 1, "max": 12 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#f8d978" }
  }
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    if (ctx && !ctx.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        const radius = Math.max(0, Math.min(Number(r) || 0, Math.abs(w) / 2, Math.abs(h) / 2));
        this.moveTo(x + radius, y);
        this.arcTo(x + w, y, x + w, y + h, radius);
        this.arcTo(x + w, y + h, x, y + h, radius);
        this.arcTo(x, y + h, x, y, radius);
        this.arcTo(x, y, x + w, y, radius);
        return this;
      };
    }
    const gameContainer = document.getElementById('game-container');
    const hud = document.getElementById('hud');
    const choicePanel = document.getElementById('choice-panel');
    const choiceA = document.getElementById('choiceA');
    const choiceB = document.getElementById('choiceB');
    const promptLabel = document.getElementById('promptLabel');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('finalScore');
    const scoreLabel = document.getElementById('scoreLabel');
    const hpLabel = document.getElementById('hpLabel');
    const restartBtn = document.getElementById('restart-btn');
    const bgm = document.getElementById('bgm_main');
    const successGif = document.getElementById('gif-success');
    if (bgm) bgm.volume = 0.2;
    const failGif = document.getElementById('gif-fail');

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));
    window.updateGameConfig = (key, val) => {
      if (!window.gameConfigDefs[key]) return;
      const def = window.gameConfigDefs[key];
      if (def.type === 'number') {
        const n = Number(val);
        if (Number.isFinite(n)) window.gameConfig[key] = Math.max(def.min, Math.min(def.max, n));
      } else if (def.type === 'color') {
        if (/^#[0-9a-fA-F]{6}$/.test(String(val))) {
          window.gameConfig.themeColor = String(val);
          if (choiceA) choiceA.style.borderColor = '#2d1d08';
          if (choiceB) choiceB.style.borderColor = '#2d1d08';
        }
      }
      document.title = 'Hogwarts Hearts: Spellbound Choices';
    };

    let cw = 360, ch = 640, dpr = Math.max(1, window.devicePixelRatio || 1);
    let initialized = false;
    let gameState = 'PLAYING';
    let lastTime = 0;
    let flashTimer = 0;
    let shakeTimer = 0;
    let pulseTimer = 0;
    let score = 0;
    let lives = 3;
    let pointer = { x: 0, y: 0, down: false };
    let hero = null;
    const particles = [];
    const petals = [];
    let storyIndex = 0;
    let choiceCooldown = 0;
    let starsOffsetA = 0;
    let starsOffsetB = 0;
    let gifTimer = 0;
    let activeGif = null;

    const storyNodes = [
      { prompt: "Trial 1/5 — First Wand Lesson: a charm sputters on your desk. What keeps the room safe?", options: ["Steady the wand, breathe, and cast the simple spark charm.", "Wave harder and hope the wild sparks impress everyone."], good: 0 },
      { prompt: "Trial 2/5 — Moving Staircase Hall: a lost first-year asks for help as portraits whisper clues.", options: ["Follow the map marks and guide them to class.", "Dash ahead alone before the stairs shift again."], good: 0 },
      { prompt: "Trial 3/5 — Potion Lab: a bubbling cauldron starts smoking beside your partner.", options: ["Lower the flame and call the professor before adding more.", "Dump in a mystery vial to make the potion look powerful."], good: 0 },
      { prompt: "Trial 4/5 — Quidditch Storm Practice: thunder rattles the hoops and your team looks nervous.", options: ["Call a calm team play and shield the newest flyer.", "Showboat through the storm and ignore the formation."], good: 0 },
      { prompt: "Final Trial — Forbidden Forest: a shadow crosses the path while your wand glows.", options: ["Stand with your friends and cast a protective light.", "Run for glory and leave the group in the dark."], good: 0 }
    ];

    const audioManager = {
      ctx: null,
      unlocked: false,
      buffers: {},
      initDone: false,
      async init() {
        if (this.initDone) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = AC ? new AC() : null;
        const sfxEls = [
          document.getElementById('sfx_collect'),
          document.getElementById('sfx_hit'),
          document.getElementById('sfx_ui'),
          document.getElementById('sfx_gameover')
        ].filter(Boolean);
        for (const el of sfxEls) {
          try {
            const res = await fetch(el.src);
            const arr = await res.arrayBuffer();
            if (this.ctx) this.buffers[el.id] = await this.ctx.decodeAudioData(arr.slice(0));
          } catch (_) {}
        }
        this.initDone = true;
      },
      unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        try { this.ctx && this.ctx.resume(); } catch (_) {}
        if (bgm) bgm.play().catch(() => {});
      },
      playSfx(id) {
        const synthType = id === 'sfx_hit' || id === 'sfx_gameover' ? 'hit' : id === 'sfx_ui' ? 'ui' : 'collect';
        if (!this.ctx) return this.synth(synthType);
        const b = this.buffers[id];
        if (b) {
          const src = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          gain.gain.value = id === 'sfx_gameover' ? 0.18 : id === 'sfx_hit' ? 0.2 : id === 'sfx_ui' ? 0.12 : 0.16;
          src.buffer = b;
          src.connect(gain).connect(this.ctx.destination);
          src.start(0);
        } else this.synth(synthType);
      },
      synth(type) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type === 'hit' ? 'square' : type === 'ui' ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(type === 'hit' ? 160 : type === 'ui' ? 480 : 640, now);
        osc.frequency.exponentialRampToValueAtTime(type === 'hit' ? 90 : type === 'ui' ? 720 : 910, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(type === 'ui' ? 0.07 : 0.11, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
    };

    function vibrate(style) {
      window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate',
        requestId: 'h5-' + Date.now(),
        version: '1.0',
        params: { style }
      });
    }

    function setState(next) {
      gameState = next;
      if (gameState === 'PLAYING') {
        hud.classList.remove('hidden');
        choicePanel.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
      } else {
        hud.classList.add('hidden');
        choicePanel.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
      }
    }

    function buildPetals() {
      petals.length = 0;
      for (let i = 0; i < 20; i++) {
        petals.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          s: 4 + Math.random() * 8,
          vy: 16 + Math.random() * 20,
          vx: -12 + Math.random() * 24,
          rot: Math.random() * Math.PI * 2
        });
      }
    }

    function updateStoryText() {
      const node = storyNodes[storyIndex] || storyNodes[storyNodes.length - 1];
      promptLabel.textContent = node.prompt;
      choiceA.textContent = node.options[0];
      choiceB.textContent = node.options[1];
      document.documentElement.dataset.trial = String(Math.min(storyIndex + 1, storyNodes.length));
    }

    function showFeedbackGif(kind) {
      gifTimer = 0.85;
      activeGif = kind;
      if (successGif) successGif.classList.toggle('show', kind === 'success');
      if (failGif) failGif.classList.toggle('show', kind === 'fail');
    }

    function hideFeedbackGifs() {
      activeGif = null;
      gifTimer = 0;
      if (successGif) successGif.classList.remove('show');
      if (failGif) failGif.classList.remove('show');
    }

    function initGame() {
      score = 0;
      lives = 3;
      flashTimer = 0;
      shakeTimer = 0;
      pulseTimer = 0;
      storyIndex = 0;
      choiceCooldown = 0;
      hideFeedbackGifs();
      pointer.x = cw * 0.5;
      pointer.y = ch * 0.82;
      pointer.down = false;
      hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      particles.length = 0;
      buildPetals();
      updateStoryText();
      updateHUD();
    }

    function restartGame() {
      audioManager.playSfx('sfx_ui');
      initGame();
      setState('PLAYING');
      if (bgm) bgm.play().catch(() => {});
    }

    function updateHUD() {
      scoreLabel.textContent = `House Points: ${score}`;
      hpLabel.textContent = `Focus: ${lives}`;
    }

    function emitParticles(x, y, good) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() * 2 - 1) * (good ? 110 : 140),
          vy: -30 - Math.random() * 130,
          life: 0.35 + Math.random() * 0.35,
          t: 0,
          good
        });
      }
    }

    function applyChoice(choiceIndex) {
      if (choiceCooldown > 0 || gameState !== 'PLAYING') return;
      const node = storyNodes[storyIndex];
      if (!node) return;
      choiceCooldown = 0.25;
      const good = choiceIndex === node.good;
      if (good) {
        score += 20;
        pulseTimer = 0.16;
        flashTimer = 0.08;
        audioManager.playSfx('sfx_collect');
        showFeedbackGif('success');
        vibrate('light');
        emitParticles(cw * 0.5, ch * 0.58, true);
      } else {
        lives -= 1;
        shakeTimer = 0.16;
        flashTimer = 0.16;
        audioManager.playSfx('sfx_hit');
        showFeedbackGif('fail');
        vibrate(lives <= 0 ? 'heavy' : 'medium');
        emitParticles(cw * 0.5, ch * 0.58, false);
      }
      storyIndex = Math.min(storyNodes.length - 1, storyIndex + 1);
      updateStoryText();
      updateHUD();
      if (lives <= 0) {
        audioManager.playSfx('sfx_gameover');
        setState('GAMEOVER');
        finalScore.textContent = `House Points earned: ${score}`;
      }
    }

    function handleGameInput(e, type) {
      const px = typeof e.clientX === 'number' ? e.clientX : pointer.x;
      const py = typeof e.clientY === 'number' ? e.clientY : pointer.y;
      if (type === 'pointerdown') pointer.down = true;
      if (type === 'pointerup' || type === 'pointercancel') pointer.down = false;
      pointer.x = Math.max(0, Math.min(cw, px));
      pointer.y = Math.max(0, Math.min(ch, py));
      if (hero) {
        hero.targetX = pointer.x;
        hero.targetY = ch * 0.82;
      }
    }

    function handleGlobalInput(e) {
      unlockAudio();
      const t = e && e.type ? e.type : 'pointerdown';

      if (e && e.currentTarget === restartBtn) {
        if (gameState === 'GAMEOVER') restartGame();
        return;
      }
      if (e && e.currentTarget === choiceA) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(0);
        }
        return;
      }
      if (e && e.currentTarget === choiceB) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(1);
        }
        return;
      }

      if (e && e.currentTarget !== canvas) return;
      if (e && e.cancelable && t !== 'pointermove') e.preventDefault();

      if (gameState === 'GAMEOVER') {
        if (t === 'pointerdown') restartGame();
        return;
      }
      if (gameState === 'PLAYING') handleGameInput(e, t);
    }

    function unlockAudio() {
      audioManager.unlock();
      if (bgm) bgm.play().catch(() => {});
    }

    function resize(width, height) {
      cw = width;
      ch = height;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(cw * dpr);
      canvas.height = Math.floor(ch * dpr);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      if (hero) {
        hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
        hero.targetX = Math.max(hero.r, Math.min(cw - hero.r, hero.targetX));
        hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));
        hero.targetY = Math.max(hero.r, Math.min(ch - hero.r, hero.targetY));
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawBackground(dt) {
      const trial = Math.min(storyIndex, 4);
      const palettes = [
        ['#071226', '#17264f', '#3d2a13'],
        ['#08162d', '#1b2f62', '#1a2032'],
        ['#071226', '#18344a', '#14331f'],
        ['#050b1e', '#10264b', '#143120'],
        ['#030815', '#0c1831', '#06170f']
      ];
      const pal = palettes[trial];
      const t = performance.now() * 0.001;
      const g = ctx.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, pal[0]);
      g.addColorStop(0.46, pal[1]);
      g.addColorStop(1, pal[2]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cw, ch);

      const glowA = ctx.createRadialGradient(cw * (trial === 4 ? 0.72 : 0.22), ch * 0.18, 0, cw * (trial === 4 ? 0.72 : 0.22), ch * 0.18, cw * 0.42);
      glowA.addColorStop(0, trial === 4 ? 'rgba(205,239,255,0.30)' : 'rgba(248,217,120,0.25)');
      glowA.addColorStop(1, 'rgba(248,217,120,0)');
      ctx.fillStyle = glowA;
      ctx.fillRect(0, 0, cw, ch);

      const glowB = ctx.createRadialGradient(cw * 0.78, ch * 0.28, 0, cw * 0.78, ch * 0.28, cw * 0.34);
      glowB.addColorStop(0, trial === 2 ? 'rgba(78,225,144,0.20)' : 'rgba(156,236,255,0.20)');
      glowB.addColorStop(1, 'rgba(156,236,255,0)');
      ctx.fillStyle = glowB;
      ctx.fillRect(0, 0, cw, ch);

      starsOffsetA += dt * (9 + trial * 2);
      starsOffsetB += dt * (14 + trial * 2);

      for (let i = 0; i < 28; i++) {
        const x = (i * 47 + starsOffsetB * (1 + i * 0.02)) % (cw + 60) - 30;
        const y = ((i * 71) % Math.floor(ch * 0.58 + 40)) - 20;
        const r = i % 5 === 0 ? 2.2 : 1.15;
        ctx.fillStyle = i % 4 === 0 ? 'rgba(248,217,120,0.86)' : 'rgba(205,239,255,0.66)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        if (i % 7 === 0) {
          ctx.strokeStyle = 'rgba(248,217,120,0.35)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - r * 3, y);
          ctx.lineTo(x + r * 3, y);
          ctx.moveTo(x, y - r * 3);
          ctx.lineTo(x, y + r * 3);
          ctx.stroke();
        }
      }

      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        p.y += p.vy * dt;
        p.x += p.vx * dt + Math.sin(t + i) * 0.22;
        p.rot += dt * 1.2;
        if (p.y > ch + 20) { p.y = -20; p.x = Math.random() * cw; }
        if (p.x < -20) p.x = cw + 20;
        if (p.x > cw + 20) p.x = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = trial === 3 ? 'rgba(205,239,255,0.32)' : trial === 2 ? 'rgba(82,228,143,0.28)' : i % 3 === 0 ? 'rgba(248,217,120,0.42)' : 'rgba(156,236,255,0.32)';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.s, p.s * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // authored wizard-school background: five cosmetic trial scenes, no gameplay collisions
      ctx.fillStyle = 'rgba(8,12,30,0.48)';
      if (trial === 0 || trial === 1) {
        for (let i = 0; i < 8; i++) {
          const w = 42 + i * 7;
          const h = 84 + i * 13;
          const x = (i * 82 + starsOffsetA * (0.7 + i * 0.03)) % (cw + 120) - 60;
          ctx.beginPath();
          ctx.roundRect(x, ch * 0.57, w, h, 8);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(x - 3, ch * 0.57);
          ctx.lineTo(x + w * 0.5, ch * 0.57 - 30);
          ctx.lineTo(x + w + 3, ch * 0.57);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = 'rgba(248,217,120,0.18)';
          ctx.fillRect(x + 10, ch * 0.57 + 16, 6, Math.max(16, h * 0.32));
          ctx.fillStyle = 'rgba(8,12,30,0.48)';
        }
      }

      if (trial === 1) {
        ctx.strokeStyle = 'rgba(248,217,120,0.32)';
        ctx.lineWidth = 5;
        for (let i = 0; i < 5; i++) {
          const y = ch * (0.25 + i * 0.075);
          ctx.beginPath();
          ctx.moveTo(-20, y);
          ctx.lineTo(cw * 0.38, y + 18);
          ctx.lineTo(cw + 20, y - 8);
          ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,248,221,0.20)';
        for (let i = 0; i < 4; i++) {
          const x = (i * 102 - (starsOffsetA * 0.6) % 120);
          ctx.strokeRect(x, ch * 0.22 + (i % 2) * 48, 50, 68);
        }
      } else if (trial === 2) {
        ctx.fillStyle = 'rgba(8,12,30,0.52)';
        ctx.fillRect(0, ch * 0.33, cw, 12);
        for (let i = 0; i < 7; i++) {
          const x = i * (cw / 6) - 18;
          ctx.fillStyle = i % 2 ? 'rgba(156,236,255,0.30)' : 'rgba(82,228,143,0.30)';
          ctx.beginPath();
          ctx.roundRect(x, ch * 0.25, 22, 58, 8);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,248,221,0.22)';
          ctx.fillRect(x + 5, ch * 0.29, 12, 6);
        }
        ctx.fillStyle = 'rgba(4,10,18,0.62)';
        ctx.beginPath();
        ctx.ellipse(cw * 0.5, ch * 0.62, cw * 0.22, ch * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(82,228,143,0.44)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 5; i++) {
          const x = cw * (0.34 + i * 0.08) + Math.sin(t * 2 + i) * 8;
          ctx.beginPath();
          ctx.arc(x, ch * (0.48 - i * 0.018), 9 + i * 1.5, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else if (trial === 3) {
        ctx.strokeStyle = 'rgba(248,217,120,0.50)';
        ctx.lineWidth = 5;
        for (let i = 0; i < 3; i++) {
          const x = cw * (0.22 + i * 0.28);
          ctx.beginPath();
          ctx.ellipse(x, ch * 0.36, 20, 34, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(8,12,30,0.42)';
          ctx.fillRect(x - 3, ch * 0.395, 6, ch * 0.16);
        }
        ctx.strokeStyle = 'rgba(205,239,255,0.28)';
        ctx.lineWidth = 1.4;
        for (let i = 0; i < 18; i++) {
          const x = (i * 31 + starsOffsetB * 3) % (cw + 80) - 40;
          ctx.beginPath();
          ctx.moveTo(x, ch * 0.1);
          ctx.lineTo(x - 26, ch * 0.56);
          ctx.stroke();
        }
      } else if (trial === 4) {
        ctx.fillStyle = 'rgba(2,7,13,0.58)';
        for (let i = 0; i < 9; i++) {
          const x = i * (cw / 8) - 10;
          const h = ch * (0.28 + (i % 3) * 0.045);
          ctx.beginPath();
          ctx.moveTo(x, ch * 0.68);
          ctx.lineTo(x + 18, h);
          ctx.lineTo(x + 36, ch * 0.68);
          ctx.closePath();
          ctx.fill();
          ctx.fillRect(x + 15, h, 6, ch * 0.35);
        }
        ctx.strokeStyle = 'rgba(156,236,255,0.28)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cw * 0.5, ch * 0.52, 52 + Math.sin(t * 2) * 4, 0.15, Math.PI - 0.15);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(248,217,120,0.16)';
      ctx.fillRect(0, ch * 0.54, cw, 2);
      const carpet = ctx.createLinearGradient(0, ch * 0.54, 0, ch);
      carpet.addColorStop(0, trial === 4 ? 'rgba(156,236,255,0.07)' : 'rgba(248,217,120,0.08)');
      carpet.addColorStop(1, 'rgba(14,15,34,0.48)');
      ctx.fillStyle = carpet;
      ctx.fillRect(0, ch * 0.54, cw, ch * 0.46);
    }

    function drawCharacters() {
      const y = ch * 0.47;
      const r = Math.max(24, cw * 0.09);
      const bob = Math.sin(performance.now() * 0.0035) * 2.5;

      // protagonist: brave student wizard silhouette
      ctx.save();
      ctx.translate(cw * 0.3, y + bob);
      ctx.shadowColor = 'rgba(248,217,120,0.42)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffe8df';
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#4b2d1d';
      ctx.beginPath(); ctx.arc(0, -r * 0.35, r * 0.72, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a244d';
      ctx.beginPath(); ctx.moveTo(-r * 0.8, -r * 0.15); ctx.quadraticCurveTo(0, -r * 0.95, r * 0.8, -r * 0.15); ctx.lineTo(0, -r * 0.42); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#160b35';
      ctx.beginPath(); ctx.arc(-r * 0.28, -2, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.28, -2, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f8d978';
      ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.arc(0, r * 0.16, r * 0.34, 0.25, Math.PI - 0.25); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.12, r * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#181936';
      ctx.beginPath(); ctx.roundRect(-r * 0.7, r * 0.98, r * 1.4, r * 1.5, 12); ctx.fill();
      ctx.fillStyle = '#8a2634';
      ctx.fillRect(-r * 0.12, r * 1.08, r * 0.24, r * 1.3);
      ctx.strokeStyle = '#f8d978';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r * 0.68, r * 1.36);
      ctx.lineTo(r * 1.28, r * 0.96);
      ctx.stroke();
      ctx.fillStyle = '#f8d978';
      ctx.beginPath(); ctx.arc(r * 1.34, r * 0.92, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // mentor/rival wizard: sharp contrast, polished magical ally silhouette
      ctx.save();
      ctx.translate(cw * 0.7, y - 6 - bob * 0.8);
      ctx.shadowColor = 'rgba(156,236,255,0.36)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#fff1e9';
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.02, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#111122';
      ctx.beginPath();
      ctx.moveTo(-r, -r * 0.1); ctx.quadraticCurveTo(-r * 0.2, -r * 1.15, r, -r * 0.25); ctx.lineTo(r, -r * 0.55);
      ctx.quadraticCurveTo(0, -r * 1.34, -r, -r * 0.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, -r * 0.22); ctx.lineTo(-r * 0.08, -r * 0.3);
      ctx.moveTo(r * 0.08, -r * 0.3); ctx.lineTo(r * 0.55, -r * 0.22);
      ctx.stroke();
      ctx.fillStyle = '#160b35';
      ctx.beginPath(); ctx.arc(-r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#9cecff'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, r * 0.12, r * 0.31, 0.4, Math.PI - 0.4); ctx.stroke();
      ctx.fillStyle = 'rgba(24,16,53,0.92)';
      ctx.beginPath(); ctx.roundRect(-r * 0.95, r * 1.0, r * 1.9, r * 1.95, 10); ctx.fill();
      ctx.fillStyle = '#f8d978';
      ctx.beginPath();
      ctx.moveTo(0, r * 1.05); ctx.lineTo(-r * 0.18, r * 1.65); ctx.lineTo(0, r * 2.28); ctx.lineTo(r * 0.18, r * 1.65); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(-r * 0.42, r * 1.25 + i * r * 0.46, r * 0.32, r * 0.22);
        ctx.fillRect(r * 0.1, r * 1.25 + i * r * 0.46, r * 0.32, r * 0.22);
      }
      ctx.restore();
    }

    function drawHero() {
      if (!hero) return;
      const x = hero.x;
      const y = hero.y + Math.sin(performance.now() * 0.006) * 2;
      const r = Math.max(0, hero.r);
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowColor = 'rgba(248,217,120,0.5)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff4fb';
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#181936';
      ctx.beginPath();
      ctx.moveTo(-r * 0.92, r * 0.95);
      ctx.lineTo(0, -r * 0.1);
      ctx.lineTo(r * 0.92, r * 0.95);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = window.gameConfig.themeColor;
      ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.12, r * 0.22, 0, Math.PI * 2); ctx.arc(r * 0.35, -r * 0.12, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.18, -r * 0.12);
      ctx.lineTo(r * 0.18, -r * 0.12);
      ctx.stroke();
      ctx.fillStyle = '#160b35';
      ctx.beginPath(); ctx.arc(-r * 0.15, r * 0.12, r * 0.06, 0, Math.PI * 2); ctx.arc(r * 0.15, r * 0.12, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#9cecff';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(0, r * 0.23, r * 0.24, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.strokeStyle = '#f8d978';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r * 0.55, -r * 0.82);
      ctx.lineTo(r * 1.18, -r * 1.16);
      ctx.stroke();
      ctx.fillStyle = '#f8d978';
      ctx.beginPath(); ctx.arc(r * 1.24, -r * 1.18, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function update(dt) {
      if (!hero || !Number.isFinite(hero.x) || !Number.isFinite(hero.y)) {
        hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      }

      const moveFactor = Math.max(0, Math.min(1, dt * (window.gameConfig.heroSpeed * 1.6)));
      hero.x += (hero.targetX - hero.x) * moveFactor;
      hero.y += (hero.targetY - hero.y) * Math.max(0, Math.min(1, dt * 9));
      hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
      hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));

      if (choiceCooldown > 0) choiceCooldown -= dt;
      if (flashTimer > 0) flashTimer -= dt;
      if (shakeTimer > 0) shakeTimer -= dt;
      if (pulseTimer > 0) pulseTimer -= dt;
      if (gifTimer > 0) {
        gifTimer -= dt;
        if (gifTimer <= 0) hideFeedbackGifs();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 210 * dt;
        if (p.t >= p.life) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, cw, ch);
      drawBackground(Math.min(0.05, (performance.now() - lastTime) / 1000 || 0.016));

      if (shakeTimer > 0) gameContainer.classList.add('shake');
      else gameContainer.classList.remove('shake');

      ctx.save();
      if (pulseTimer > 0 && hero) {
        const s = 1 + pulseTimer * 0.08;
        ctx.translate(hero.x, hero.y);
        ctx.scale(s, s);
        ctx.translate(-hero.x, -hero.y);
      }
      drawCharacters();
      drawHero();

      for (const p of particles) {
        const a = Math.max(0, 1 - p.t / p.life);
        ctx.fillStyle = p.good ? `rgba(248,217,120,${a})` : `rgba(154,168,185,${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, 2 + a * 3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      if (flashTimer > 0) {
        const red = shakeTimer > 0 ? 'rgba(255,50,75,0.22)' : 'rgba(255,255,255,0.10)';
        ctx.fillStyle = red;
        ctx.fillRect(0, 0, cw, ch);
      }
    }

    function loop(ts) {
      try {
        const dt = Math.min(0.05, Math.max(0.001, (ts - (lastTime || ts)) / 1000));
        lastTime = ts;
        if (gameState === 'PLAYING') update(dt);
        render();
      } catch (_) {}
      requestAnimationFrame(loop);
    }

    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) {
        resize(entry.contentRect.width, entry.contentRect.height);
      }
      if (!initialized) {
        initGame();
        setState('PLAYING');
        if (bgm) bgm.play().catch(() => {});
        audioManager.init().then(() => {}).catch(() => {});
        initialized = true;
        requestAnimationFrame(loop);
      }
    });
    ro.observe(canvas);

    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach((ev) => {
      canvas.addEventListener(ev, handleGlobalInput, { passive: false });
    });

    if (choiceA) choiceA.addEventListener('click', handleGlobalInput, { passive: false });
    if (choiceB) choiceB.addEventListener('click', handleGlobalInput, { passive: false });
    if (restartBtn) restartBtn.addEventListener('click', handleGlobalInput, { passive: false });
  });
  </script>
</body>
</html>
