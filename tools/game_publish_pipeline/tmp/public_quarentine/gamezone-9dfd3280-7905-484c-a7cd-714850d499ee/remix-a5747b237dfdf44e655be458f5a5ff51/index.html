<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Portal Choices: C-137 Arcade</title>
  <!-- [agent-note][world-design-superprompt] resolved-font: title -> Orbitron | ui -> Exo 2 from catalogs/fonts.json -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #06161a;
      --bg-mid: #0b3037;
      --bg-bottom: #14203f;
      --panel: rgba(4, 27, 31, 0.84);
      --panel-strong: rgba(7, 37, 42, 0.95);
      --stroke: #071015;
      --cyan: #55f7ff;
      --pink: #b35cff;
      --gold: #d7ff3f;
      --peach: #e8ffd6;
      --portal: #39ff72;
      --text: #f2fff4;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 24% 16%, rgba(57, 255, 114, 0.22), transparent 30%),
        radial-gradient(circle at 78% 24%, rgba(85, 247, 255, 0.16), transparent 32%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
      font-family: 'Exo 2', system-ui, sans-serif;
      color: var(--text);
    }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .hidden { display: none !important; }
    .inset-0 { inset: 0; }
    .top-2 { top: 0.5rem; }
    .left-2 { left: 0.5rem; }
    .right-2 { right: 0.5rem; }
    .left-3 { left: 0.75rem; }
    .right-3 { right: 0.75rem; }
    .bottom-3 { bottom: 0.75rem; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { width: 100%; height: 100%; }
    .max-w-xs { max-width: 20rem; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .flex { display: flex; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: minmax(0, 1fr); }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 1rem; }
    .text-center { text-align: center; }
    .text-sm { font-size: 0.95rem; }
    .text-2xl { font-size: 1.5rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .leading-snug { line-height: 1.35; }
    .rounded-xl { border-radius: 0.75rem; }
    .text-white { color: #fff; }
    .panel {
      background: linear-gradient(180deg, rgba(5, 42, 45, 0.96), rgba(6, 23, 35, 0.94));
      border: 3px solid rgba(57, 255, 114, 0.82);
      box-shadow: 0 10px 26px rgba(2, 8, 12, 0.42), inset 0 0 0 2px rgba(85, 247, 255, 0.18), 0 0 24px rgba(57, 255, 114, 0.16);
      border-radius: 18px;
      color: var(--text);
      font-family: 'Exo 2', system-ui, sans-serif;
      backdrop-filter: blur(6px);
    }
    .hud-pill {
      background:
        radial-gradient(circle at 18% 16%, rgba(255,255,255,0.72), transparent 22%),
        linear-gradient(180deg, rgba(238, 255, 219, 0.96), rgba(185, 255, 104, 0.9));
      border: 2px solid rgba(7, 16, 21, 0.94);
      box-shadow: 0 4px 0 rgba(7, 16, 21, 0.94), 0 0 16px rgba(57, 255, 114, 0.24), inset 0 0 0 1px rgba(85,247,255,0.28);
      border-radius: 999px 18px 999px 18px;
      color: #062018;
      font-weight: 600;
      font-family: 'Exo 2', system-ui, sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    #dimensionBadge {
      flex: 0 1 auto;
      max-width: 38vw;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #dfffe8;
      background:
        linear-gradient(90deg, rgba(57,255,114,0.22), rgba(85,247,255,0.18)),
        rgba(5, 24, 30, 0.82);
      border-color: rgba(85,247,255,0.88);
      box-shadow: 0 4px 0 rgba(7, 16, 21, 0.9), 0 0 18px rgba(85, 247, 255, 0.22);
      text-transform: uppercase;
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }
    .choice-btn {
      position: relative;
      overflow: hidden;
      min-height: 52px;
      border: 2px solid rgba(7, 16, 21, 0.95);
      box-shadow: 0 5px 0 rgba(7, 16, 21, 0.95), 0 0 20px rgba(57, 255, 114, 0.22);
      border-radius: 16px 10px 16px 10px;
      font-weight: 600;
      color: #071015;
      background:
        radial-gradient(circle at 12% 28%, rgba(255,255,255,0.86), transparent 18%),
        linear-gradient(90deg, rgba(85,247,255,0.20), transparent 40%),
        linear-gradient(180deg, #ecffd8, #68ff81);
      font-family: 'Exo 2', system-ui, sans-serif;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }
    .choice-btn::after {
      content: '';
      position: absolute;
      top: 8px;
      right: 12px;
      width: 34px;
      height: 8px;
      border-top: 2px solid rgba(7,16,21,0.32);
      border-bottom: 2px solid rgba(7,16,21,0.18);
      border-radius: 999px;
      pointer-events: none;
      opacity: 0.75;
    }
    .choice-btn:hover,
    .choice-btn:focus-visible {
      filter: brightness(1.04);
      outline: none;
    }
    h2, #restart-btn {
      font-family: 'Orbitron', system-ui, sans-serif;
      letter-spacing: 0.05em;
    }
    #hud {
      pointer-events: none;
    }
    #promptLabel {
      border-color: rgba(85, 247, 255, 0.82);
      position: relative;
      overflow: hidden;
    }
    #promptLabel::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0 18px, rgba(85,247,255,0.055) 18px 20px),
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 45%, transparent 100%);
      pointer-events: none;
    }
    #choice-panel {
      /* [agent-note][stage2] preserve: control-zone | reason: already mobile-safe */
      padding-bottom: max(0px, env(safe-area-inset-bottom));
    }
    #restart-btn {
      background: linear-gradient(180deg, #65ff7a, #16c954);
      border: 3px solid rgba(7, 16, 21, 0.96);
      box-shadow: 0 4px 0 rgba(7, 16, 21, 0.96), 0 0 18px rgba(57, 255, 114, 0.32);
    }
    #restart-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(7, 16, 21, 0.96);
    }
    .choice-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(7, 16, 21, 0.96); }
    #feedback-gifs {
      pointer-events: none;
      inset: auto 0 calc(5.5rem + env(safe-area-inset-bottom)) 0;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 0 0.75rem;
    }
    .feedback-gif {
      width: min(26vw, 92px);
      max-height: 92px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 20px rgba(7, 5, 24, 0.28);
      opacity: 0;
      transform: translateY(10px) scale(0.92);
      transition: opacity 180ms ease, transform 180ms ease;
      background: rgba(255,255,255,0.08);
    }
    .feedback-gif.show {
      opacity: 0.95;
      transform: translateY(0) scale(1);
    }
    .feedback-gif.fail {
      border-color: rgba(255, 110, 160, 0.8);
    }
    .feedback-gif.win {
      border-color: rgba(255, 227, 123, 0.88);
    }
    @media (max-width: 420px) {
      .px-4 { padding-left: 0.72rem; padding-right: 0.72rem; }
      .text-sm { font-size: 0.84rem; }
      #dimensionBadge { font-size: 0.62rem; max-width: 30vw; }
      #promptLabel { line-height: 1.26; }
      .choice-btn { min-height: 50px; }
    }
    .shake { animation: kshake 180ms linear; }
    @keyframes kshake {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(-4px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-3px, 1px); }
      100% { transform: translate(0px, 0px); }
    }
  </style>
</head>

  <script id="game-config" type="application/x-game-config">
  {
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 6, "min": 1, "max": 12 },
    "themeColor": { "type": "color", "label": "Portal Core Color", "value": "#39ff72" }
  }
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const hud = document.getElementById('hud');
    const choicePanel = document.getElementById('choice-panel');
    const choiceA = document.getElementById('choiceA');
    const choiceB = document.getElementById('choiceB');
    const promptLabel = document.getElementById('promptLabel');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('finalScore');
    const scoreLabel = document.getElementById('scoreLabel');
    const hpLabel = document.getElementById('hpLabel');
    const dimensionBadge = document.getElementById('dimensionBadge');
    const restartBtn = document.getElementById('restart-btn');
    const bgm = document.getElementById('bgm_main');
    const successGif = document.getElementById('gif-success');
    if (bgm) bgm.volume = 0.2;
    const failGif = document.getElementById('gif-fail');

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));
    window.updateGameConfig = (key, val) => {
      if (!window.gameConfigDefs[key]) return;
      const def = window.gameConfigDefs[key];
      if (def.type === 'number') {
        const n = Number(val);
        if (Number.isFinite(n)) window.gameConfig[key] = Math.max(def.min, Math.min(def.max, n));
      } else if (def.type === 'color') {
        if (/^#[0-9a-fA-F]{6}$/.test(String(val))) {
          window.gameConfig[key] = String(val);
          if (choiceA) choiceA.style.borderColor = '#2e1b62';
          if (choiceB) choiceB.style.borderColor = '#2e1b62';
        }
      }
          document.title = 'Portal Choices: C-137 Arcade';
    };

    let cw = 360, ch = 640, dpr = Math.max(1, window.devicePixelRatio || 1);
    let initialized = false;
    let gameState = 'PLAYING';
    let lastTime = 0;
    let flashTimer = 0;
    let shakeTimer = 0;
    let pulseTimer = 0;
    let score = 0;
    let lives = 3;
    let pointer = { x: 0, y: 0, down: false };
    let hero = null;
    const particles = [];
    const petals = [];
    let storyIndex = 0;
    let choiceCooldown = 0;
    let starsOffsetA = 0;
    let starsOffsetB = 0;
    let gifTimer = 0;
    let activeGif = null;

    const storyNodes = [
      { prompt: "Garage Portal Calibration: Rick asks which wire stops the portal from burping up Cronenberg sludge.", options: ["Plug the green coil into the portal battery.", "Kick the portal gun and blame Morty."], good: 0, label: "Garage" },
      { prompt: "Dimension C-137 Back Alley: an alien demands the coordinates before the rift closes.", options: ["Trade a clean coordinate packet and keep moving.", "Yell “wubba lubba” and hand over pocket lint."], good: 0, label: "C-137" },
      { prompt: "Citadel Bureaucracy Breach: a Council drone wants Form 88-B signed in triplicate.", options: ["Stamp the portal permit and fake confidence.", "Tell the drone paperwork is a social construct."], good: 0, label: "Citadel" },
      { prompt: "Cronenberg Containment Zone: the antidote vial starts fizzing beside a mutant silhouette.", options: ["Seal it in the stabilizer tube right now.", "Shake it like soda for science."], good: 0, label: "Contain" },
      { prompt: "Central Finite Curve Collapse: only one line keeps the portal chain synced.", options: ["Lock the final coordinate and drag Morty through.", "Take a selfie while reality folds."], good: 0, label: "Curve" }
    ];

    const audioManager = {
      ctx: null,
      unlocked: false,
      buffers: {},
      initDone: false,
      async init() {
        if (this.initDone) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = AC ? new AC() : null;
        const sfxEls = [
          document.getElementById('sfx_collect'),
          document.getElementById('sfx_hit'),
          document.getElementById('sfx_ui'),
          document.getElementById('sfx_gameover')
        ].filter(Boolean);
        for (const el of sfxEls) {
          try {
            const audioUrl = new URL(el.currentSrc || el.src, window.location.href);
            if (audioUrl.origin !== window.location.origin) continue;
            const res = await fetch(audioUrl.href);
            const arr = await res.arrayBuffer();
            if (this.ctx) this.buffers[el.id] = await this.ctx.decodeAudioData(arr.slice(0));
          } catch (_) {}
        }
        this.initDone = true;
      },
      unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        try { this.ctx && this.ctx.resume(); } catch (_) {}
        if (bgm) bgm.play().catch(() => {});
      },
      playSfx(id) {
        const synthType = id === 'sfx_hit' || id === 'sfx_gameover' ? 'hit' : id === 'sfx_ui' ? 'ui' : 'collect';
        if (!this.ctx) return this.synth(synthType);
        const b = this.buffers[id];
        if (b) {
          const src = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          gain.gain.value = id === 'sfx_gameover' ? 0.18 : id === 'sfx_hit' ? 0.2 : id === 'sfx_ui' ? 0.12 : 0.16;
          src.buffer = b;
          src.connect(gain).connect(this.ctx.destination);
          src.start(0);
        } else this.synth(synthType);
      },
      synth(type) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type === 'hit' ? 'square' : type === 'ui' ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(type === 'hit' ? 160 : type === 'ui' ? 480 : 640, now);
        osc.frequency.exponentialRampToValueAtTime(type === 'hit' ? 90 : type === 'ui' ? 720 : 910, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(type === 'ui' ? 0.07 : 0.11, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
    };

    function vibrate(style) {
      window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate',
        requestId: 'h5-' + Date.now(),
        version: '1.0',
        params: { style }
      });
    }

    function setState(next) {
      gameState = next;
      if (gameState === 'PLAYING') {
        hud.classList.remove('hidden');
        choicePanel.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
      } else {
        hud.classList.add('hidden');
        choicePanel.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
      }
    }

    function buildPetals() {
      petals.length = 0;
      for (let i = 0; i < 20; i++) {
        petals.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          s: 4 + Math.random() * 8,
          vy: 16 + Math.random() * 20,
          vx: -12 + Math.random() * 24,
          rot: Math.random() * Math.PI * 2
        });
      }
    }

    function updateStoryText() {
      const node = storyNodes[storyIndex] || storyNodes[storyNodes.length - 1];
      promptLabel.textContent = node.prompt;
      choiceA.textContent = node.options[0];
      choiceB.textContent = node.options[1];
      if (dimensionBadge) dimensionBadge.textContent = `D${Math.min(storyIndex + 1, storyNodes.length)} · ${node.label}`;
    }

    function showFeedbackGif(kind) {
      gifTimer = 0.85;
      activeGif = kind;
      if (successGif) successGif.classList.toggle('show', kind === 'success');
      if (failGif) failGif.classList.toggle('show', kind === 'fail');
    }

    function hideFeedbackGifs() {
      activeGif = null;
      gifTimer = 0;
      if (successGif) successGif.classList.remove('show');
      if (failGif) failGif.classList.remove('show');
    }

    function initGame() {
      score = 0;
      lives = 3;
      flashTimer = 0;
      shakeTimer = 0;
      pulseTimer = 0;
      storyIndex = 0;
      choiceCooldown = 0;
      hideFeedbackGifs();
      pointer.x = cw * 0.5;
      pointer.y = ch * 0.82;
      pointer.down = false;
      hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      particles.length = 0;
      buildPetals();
      updateStoryText();
      updateHUD();
    }

    function restartGame() {
      audioManager.playSfx('sfx_ui');
      initGame();
      setState('PLAYING');
      if (bgm) bgm.play().catch(() => {});
    }

    function updateHUD() {
      scoreLabel.textContent = `Portal Data: ${score}`;
      hpLabel.textContent = `Stability: ${lives}`;
    }

    function emitParticles(x, y, good) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() * 2 - 1) * (good ? 110 : 140),
          vy: -30 - Math.random() * 130,
          life: 0.35 + Math.random() * 0.35,
          t: 0,
          good
        });
      }
    }

    function applyChoice(choiceIndex) {
      if (choiceCooldown > 0 || gameState !== 'PLAYING') return;
      const node = storyNodes[storyIndex];
      if (!node) return;
      choiceCooldown = 0.25;
      const good = choiceIndex === node.good;
      if (good) {
        score += 20;
        pulseTimer = 0.16;
        flashTimer = 0.08;
        audioManager.playSfx('sfx_collect');
        showFeedbackGif('success');
        vibrate('light');
        emitParticles(cw * 0.5, ch * 0.58, true);
      } else {
        lives -= 1;
        shakeTimer = 0.16;
        flashTimer = 0.16;
        audioManager.playSfx('sfx_hit');
        showFeedbackGif('fail');
        vibrate(lives <= 0 ? 'heavy' : 'medium');
        emitParticles(cw * 0.5, ch * 0.58, false);
      }
      storyIndex = Math.min(storyNodes.length - 1, storyIndex + 1);
      updateStoryText();
      updateHUD();
      if (lives <= 0) {
        audioManager.playSfx('sfx_gameover');
        setState('GAMEOVER');
        finalScore.textContent = `Portal Data secured: ${score}`;
      }
    }

    function handleGameInput(e, type) {
      const px = typeof e.clientX === 'number' ? e.clientX : pointer.x;
      const py = typeof e.clientY === 'number' ? e.clientY : pointer.y;
      if (type === 'pointerdown') pointer.down = true;
      if (type === 'pointerup' || type === 'pointercancel') pointer.down = false;
      pointer.x = Math.max(0, Math.min(cw, px));
      pointer.y = Math.max(0, Math.min(ch, py));
      if (hero) {
        hero.targetX = pointer.x;
        hero.targetY = ch * 0.82;
      }
    }

    function handleGlobalInput(e) {
      unlockAudio();
      const t = e && e.type ? e.type : 'pointerdown';

      if (e && e.currentTarget === restartBtn) {
        if (gameState === 'GAMEOVER') restartGame();
        return;
      }
      if (e && e.currentTarget === choiceA) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(0);
        }
        return;
      }
      if (e && e.currentTarget === choiceB) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(1);
        }
        return;
      }

      if (e && e.currentTarget !== canvas) return;
      if (e && e.cancelable && t !== 'pointermove') e.preventDefault();

      if (gameState === 'GAMEOVER') {
        if (t === 'pointerdown') restartGame();
        return;
      }
      if (gameState === 'PLAYING') handleGameInput(e, t);
    }

    function unlockAudio() {
      audioManager.unlock();
      if (bgm) bgm.play().catch(() => {});
    }

    function resize(width, height) {
      cw = width;
      ch = height;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(cw * dpr);
      canvas.height = Math.floor(ch * dpr);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      if (hero) {
        hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
        hero.targetX = Math.max(hero.r, Math.min(cw - hero.r, hero.targetX));
        hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));
        hero.targetY = Math.max(hero.r, Math.min(ch - hero.r, hero.targetY));
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawDimensionLayer(t) {
      const level = Math.max(0, Math.min(storyNodes.length - 1, storyIndex));
      ctx.save();
      ctx.globalAlpha = 0.72;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (level === 0) {
        ctx.strokeStyle = 'rgba(85,247,255,0.18)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 4; i++) {
          const y = ch * (0.16 + i * 0.06);
          ctx.beginPath();
          ctx.moveTo(-20, y);
          ctx.bezierCurveTo(cw * 0.28, y + Math.sin(t + i) * 10, cw * 0.62, y - 16, cw + 20, y + 6);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(57,255,114,0.14)';
        for (let i = 0; i < 5; i++) {
          const x = cw * 0.08 + i * cw * 0.19;
          ctx.beginPath();
          ctx.roundRect(x, ch * 0.61 + Math.sin(t + i) * 2, 22, 44, 9);
          ctx.fill();
          ctx.strokeStyle = 'rgba(7,16,21,0.42)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      } else if (level === 1) {
        ctx.fillStyle = 'rgba(179,92,255,0.16)';
        ctx.strokeStyle = 'rgba(57,255,114,0.30)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
          const x = (i * 89 + t * 22) % (cw + 70) - 35;
          const y = ch * (0.23 + (i % 3) * 0.08);
          ctx.beginPath();
          ctx.ellipse(x, y, 18, 7, Math.sin(t + i) * 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = 'rgba(215,255,63,0.62)';
          ctx.beginPath();
          ctx.arc(x - 6, y - 1, 2.2, 0, Math.PI * 2);
          ctx.arc(x + 6, y - 1, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(179,92,255,0.16)';
        }
      } else if (level === 2) {
        for (let i = 0; i < 7; i++) {
          const x = (i * 72 + Math.sin(t * 0.5 + i) * 10) % (cw + 80) - 30;
          const y = ch * 0.18 + (i % 2) * 24;
          ctx.fillStyle = 'rgba(85,247,255,0.11)';
          ctx.beginPath();
          ctx.roundRect(x, y, 46, 70 + (i % 3) * 20, 8);
          ctx.fill();
          ctx.fillStyle = 'rgba(215,255,63,0.18)';
          for (let k = 0; k < 4; k++) ctx.fillRect(x + 9, y + 12 + k * 14, 24, 4);
        }
        ctx.strokeStyle = 'rgba(255,210,80,0.24)';
        ctx.lineWidth = 2;
        ctx.strokeRect(cw * 0.08, ch * 0.40, cw * 0.18, 26);
        ctx.strokeRect(cw * 0.72, ch * 0.36, cw * 0.2, 26);
      } else if (level === 3) {
        for (let i = 0; i < 9; i++) {
          const x = (i * 53 + Math.sin(t + i) * 8) % (cw + 60) - 30;
          const y = ch * (0.22 + (i % 4) * 0.08);
          const rr = 10 + (i % 3) * 8;
          const grad = ctx.createRadialGradient(x, y, 0, x, y, rr * 1.9);
          grad.addColorStop(0, 'rgba(179,92,255,0.22)');
          grad.addColorStop(1, 'rgba(57,255,114,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, rr * (1 + Math.sin(t * 2 + i) * 0.08), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = 'rgba(57,255,114,0.22)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(cw * 0.5, ch * 0.52, cw * 0.36, 24, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(215,255,63,0.28)';
        ctx.fillStyle = 'rgba(85,247,255,0.12)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) {
          const a = t * 0.35 + i * Math.PI * 2 / 12;
          const x = cw * 0.5 + Math.cos(a) * cw * (0.22 + (i % 3) * 0.045);
          const y = ch * 0.34 + Math.sin(a) * ch * 0.14;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, -13);
          ctx.lineTo(9, 9);
          ctx.lineTo(-7, 7);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }

      ctx.restore();
    }

    function drawBackground(dt) {
      const g = ctx.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, '#06161a');
      g.addColorStop(0.48, '#0b3037');
      g.addColorStop(1, '#14203f');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cw, ch);

      // [agent-note][world-design-superprompt] authored-bg: procedural Rick & Morty garage portal; non-mechanic, keep behind interactives.
      const t = performance.now() * 0.001;
      const portalX = cw * 0.5;
      const portalY = ch * 0.32;
      const portalR = Math.min(cw, ch) * 0.22;
      for (let i = 0; i < 5; i++) {
        ctx.save();
        ctx.translate(portalX, portalY);
        ctx.rotate(t * (0.35 + i * 0.08) + i);
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(57,255,114,0.30)' : 'rgba(85,247,255,0.22)';
        ctx.lineWidth = Math.max(2, portalR * (0.11 - i * 0.012));
        ctx.beginPath();
        ctx.ellipse(0, 0, portalR * (1 - i * 0.13), portalR * (0.62 - i * 0.055), 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      const glowA = ctx.createRadialGradient(portalX, portalY, 0, portalX, portalY, portalR * 1.65);
      glowA.addColorStop(0, 'rgba(57,255,114,0.24)');
      glowA.addColorStop(0.42, 'rgba(85,247,255,0.12)');
      glowA.addColorStop(1, 'rgba(57,255,114,0)');
      ctx.fillStyle = glowA;
      ctx.fillRect(0, 0, cw, ch);

      drawDimensionLayer(t);

      starsOffsetA += dt * 10;
      starsOffsetB += dt * 16;

      for (let i = 0; i < 24; i++) {
        const x = (i * 47 + starsOffsetB * (1 + i * 0.02)) % (cw + 60) - 30;
        const y = ((i * 71) % Math.floor(ch * 0.58 + 40)) - 20;
        const r = i % 3 === 0 ? 2 : 1.2;
        ctx.fillStyle = i % 4 === 0 ? 'rgba(215,255,63,0.75)' : 'rgba(169,255,196,0.62)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        p.y += p.vy * dt;
        p.x += p.vx * dt + Math.sin(t + i) * 0.22;
        p.rot += dt * 1.2;
        if (p.y > ch + 20) { p.y = -20; p.x = Math.random() * cw; }
        if (p.x < -20) p.x = cw + 20;
        if (p.x > cw + 20) p.x = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = i % 3 === 0 ? 'rgba(57,255,114,0.38)' : 'rgba(85,247,255,0.36)';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.s, p.s * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(7,16,21,0.28)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }

      ctx.fillStyle = 'rgba(4,14,18,0.48)';
      for (let i = 0; i < 8; i++) {
        const w = 66 + i * 12;
        const h = 70 + i * 12;
        const x = (i * 82 + starsOffsetA * (0.8 + i * 0.04)) % (cw + 120) - 60;
        ctx.beginPath();
        ctx.roundRect(x, ch * 0.58, w, h, 10);
        ctx.fill();
        ctx.fillStyle = 'rgba(57,255,114,0.16)';
        ctx.fillRect(x + 8, ch * 0.58 + 10, 6, Math.max(16, h * 0.36));
        ctx.fillStyle = 'rgba(85,247,255,0.10)';
        ctx.fillRect(x + 22, ch * 0.58 + 18, 18, 5);
        ctx.fillStyle = 'rgba(4,14,18,0.48)';
      }
      ctx.fillStyle = 'rgba(215,255,63,0.14)';
      ctx.fillRect(0, ch * 0.54, cw, 2);

      const floor = ctx.createLinearGradient(0, ch * 0.54, 0, ch);
      floor.addColorStop(0, 'rgba(57,255,114,0.08)');
      floor.addColorStop(1, 'rgba(7,16,21,0.54)');
      ctx.fillStyle = floor;
      ctx.fillRect(0, ch * 0.54, cw, ch * 0.46);
    }

    function drawCharacters() {
      const y = ch * 0.47;
      const r = Math.max(24, cw * 0.09);
      const bob = Math.sin(performance.now() * 0.0035) * 2.5;

      // Rick: spiky scientist silhouette, cosmetic only.
      ctx.save();
      ctx.translate(cw * 0.3, y + bob);
      ctx.shadowColor = 'rgba(57,255,114,0.42)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#dff3e9';
      ctx.strokeStyle = '#071015';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#baf8ff';
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const a = Math.PI + i * Math.PI / 8;
        const spike = i % 2 === 0 ? r * 1.25 : r * 0.68;
        ctx.lineTo(Math.cos(a) * spike, -r * 0.28 + Math.sin(a) * spike);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#071015';
      ctx.beginPath(); ctx.arc(-r * 0.28, -2, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.28, -2, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#39ff72';
      ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.32, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.74)';
      ctx.beginPath(); ctx.roundRect(-r * 0.78, r * 0.98, r * 1.56, r * 1.55, 12); ctx.fill();
      ctx.fillStyle = '#7be1ff';
      ctx.fillRect(-r * 0.13, r * 1.08, r * 0.26, r * 1.3);
      ctx.restore();

      // Morty/Citadel monitor: anxious sidekick silhouette, cosmetic only.
      ctx.save();
      ctx.translate(cw * 0.7, y - 6 - bob * 0.8);
      ctx.shadowColor = 'rgba(85,247,255,0.32)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffd7b3';
      ctx.strokeStyle = '#071015';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.02, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#6f4a24';
      ctx.beginPath();
      ctx.moveTo(-r * 0.9, -r * 0.25); ctx.quadraticCurveTo(0, -r * 1.05, r * 0.9, -r * 0.28); ctx.lineTo(r * 0.58, -r * 0.52);
      ctx.quadraticCurveTo(0, -r * 1.16, -r * 0.8, -r * 0.42); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#071015';
      ctx.beginPath(); ctx.arc(-r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#55f7ff'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, r * 0.17, r * 0.30, 0.35, Math.PI - 0.35); ctx.stroke();
      ctx.fillStyle = '#f4e44b';
      ctx.beginPath(); ctx.roundRect(-r * 0.88, r * 1.0, r * 1.76, r * 1.72, 10); ctx.fill();
      ctx.fillStyle = 'rgba(7,16,21,0.18)';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(-r * 0.42, r * 1.25 + i * r * 0.38, r * 0.84, r * 0.12);
      }
      ctx.restore();
    }

    function drawPortalProps() {
      const baseY = ch * 0.66;
      const t = performance.now() * 0.001;
      ctx.save();
      ctx.globalAlpha = 0.86;
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(7,16,21,0.78)';

      const x1 = cw * 0.16;
      ctx.fillStyle = 'rgba(57,255,114,0.62)';
      ctx.beginPath();
      ctx.ellipse(x1, baseY + Math.sin(t) * 2, 9, 21, 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      ctx.fillRect(x1 - 3, baseY - 14, 3, 18);

      const x2 = cw * 0.84;
      ctx.fillStyle = 'rgba(85,247,255,0.62)';
      ctx.beginPath();
      ctx.roundRect(x2 - 19, baseY - 14 + Math.cos(t) * 2, 38, 28, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(215,255,63,0.78)';
      ctx.fillRect(x2 - 11, baseY - 5, 22, 4);

      ctx.strokeStyle = 'rgba(57,255,114,0.36)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(cw * 0.5, ch * 0.73, cw * 0.26, 10, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawHero() {
      if (!hero) return;
      const x = hero.x;
      const y = hero.y + Math.sin(performance.now() * 0.006) * 2;
      const r = Math.max(0, hero.r);
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowColor = 'rgba(57,255,114,0.55)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#eaffd5';
      ctx.strokeStyle = '#071015';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = window.gameConfig.themeColor;
      ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.12, r * 0.26, 0, Math.PI * 2); ctx.arc(r * 0.35, -r * 0.12, r * 0.26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#071015';
      ctx.beginPath(); ctx.arc(-r * 0.15, r * 0.12, r * 0.07, 0, Math.PI * 2); ctx.arc(r * 0.15, r * 0.12, r * 0.07, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#55f7ff';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(0, r * 0.22, r * 0.26, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.restore();
    }

    function update(dt) {
      if (!hero || !Number.isFinite(hero.x) || !Number.isFinite(hero.y)) {
        hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      }

      const moveFactor = Math.max(0, Math.min(1, dt * (window.gameConfig.heroSpeed * 1.6)));
      hero.x += (hero.targetX - hero.x) * moveFactor;
      hero.y += (hero.targetY - hero.y) * Math.max(0, Math.min(1, dt * 9));
      hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
      hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));

      if (choiceCooldown > 0) choiceCooldown -= dt;
      if (flashTimer > 0) flashTimer -= dt;
      if (shakeTimer > 0) shakeTimer -= dt;
      if (pulseTimer > 0) pulseTimer -= dt;
      if (gifTimer > 0) {
        gifTimer -= dt;
        if (gifTimer <= 0) hideFeedbackGifs();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 210 * dt;
        if (p.t >= p.life) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, cw, ch);
      drawBackground(Math.min(0.05, (performance.now() - lastTime) / 1000 || 0.016));

      if (shakeTimer > 0) gameContainer.classList.add('shake');
      else gameContainer.classList.remove('shake');

      ctx.save();
      if (pulseTimer > 0 && hero) {
        const s = 1 + pulseTimer * 0.08;
        ctx.translate(hero.x, hero.y);
        ctx.scale(s, s);
        ctx.translate(-hero.x, -hero.y);
      }
      drawCharacters();
      drawPortalProps();
      drawHero();

      for (const p of particles) {
        const a = Math.max(0, 1 - p.t / p.life);
        ctx.fillStyle = p.good ? `rgba(215,255,63,${a})` : `rgba(179,92,255,${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, 2 + a * 3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      if (flashTimer > 0) {
        const red = shakeTimer > 0 ? 'rgba(255,50,75,0.22)' : 'rgba(255,255,255,0.10)';
        ctx.fillStyle = red;
        ctx.fillRect(0, 0, cw, ch);
      }
    }

    function loop(ts) {
      try {
        const dt = Math.min(0.05, Math.max(0.001, (ts - (lastTime || ts)) / 1000));
        lastTime = ts;
        if (gameState === 'PLAYING') update(dt);
        render();
      } catch (_) {}
      requestAnimationFrame(loop);
    }

    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) {
        resize(entry.contentRect.width, entry.contentRect.height);
      }
      if (!initialized) {
        initGame();
        setState('PLAYING');
        if (bgm) bgm.play().catch(() => {});
        audioManager.init().then(() => {}).catch(() => {});
        initialized = true;
        requestAnimationFrame(loop);
      }
    });
    ro.observe(canvas);

    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach((ev) => {
      canvas.addEventListener(ev, handleGlobalInput, { passive: false });
    });

    if (choiceA) choiceA.addEventListener('click', handleGlobalInput, { passive: false });
    if (choiceB) choiceB.addEventListener('click', handleGlobalInput, { passive: false });
    if (restartBtn) restartBtn.addEventListener('click', handleGlobalInput, { passive: false });
  });
  </script>
</body>
