<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Math Crown Trial</title>
    <!-- [agent-note][stage3] resolved-font: title -> Cinzel, ui/body -> Rajdhani, retro-accent -> Press Start 2P from catalogs/fonts.json -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600;700&family=Press+Start+2P&display=swap');

        :root {
            --bg-dark: #140f2b;
            --panel-bg: rgba(22, 16, 52, 0.88);
            --panel-border: #8cf0ff;
            --panel-shadow: 0 0 0 3px rgba(10, 8, 30, 0.9), 0 0 24px rgba(100, 210, 255, 0.18);
            --btn-blue: #7856ff;
            --btn-border: #c1f4ff;
            --gold: #ffe066;
            --green: #67f7b3;
            --red: #ff7a90;
            --sky: #8cf0ff;
            --ink: #0b0820;
            --parchment: #efe7ff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(119, 95, 255, 0.35), transparent 34%),
                linear-gradient(180deg, #24145d 0%, #140f2b 58%, #090611 100%);
            color: var(--parchment);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center top, rgba(139, 92, 246, 0.2), transparent 38%),
                linear-gradient(180deg, #0f0b24 0%, #05040b 100%);
            overflow: hidden;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .screen {
            pointer-events: auto;
            z-index: 50;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(35, 26, 82, 0.96), rgba(16, 12, 40, 0.96));
            border: 4px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            image-rendering: pixelated;
            position: relative;
        }

        .glass-panel::after {
            content: "";
            position: absolute;
            inset: 6px;
            border: 2px solid rgba(255, 224, 102, 0.28);
            pointer-events: none;
        }

        .pixel-btn {
            background: linear-gradient(180deg, #8b6bff 0%, var(--btn-blue) 100%);
            border: 4px solid var(--btn-border);
            box-shadow: 0 0 0 3px rgba(11, 8, 32, 0.9), 4px 4px 0 rgba(0, 0, 0, 0.6);
            color: #fff;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            touch-action: manipulation;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 3px rgba(11, 8, 32, 0.9), 2px 2px 0 rgba(0, 0, 0, 0.6);
            filter: brightness(1.08);
        }

        .hidden {
            display: none !important;
        }

        #start-screen,
        #game-over-screen {
            max-width: min(92vw, 440px);
            padding: 24px;
            text-align: center;
        }

        .title-text {
            margin: 0 0 16px;
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 3vw, 2.6rem);
            line-height: 1.15;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .body-copy {
            margin: 0 0 24px;
            color: #d7d2ff;
            font-size: 1.05rem;
            line-height: 1.4;
            letter-spacing: 0.03em;
            font-weight: 600;
        }

        .primary-btn {
            padding: 16px 24px;
            font-size: 0.8rem;
        }

        #game-ui {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 32px;
            pointer-events: auto;
        }

        .problem-panel {
            width: 100%;
            max-width: 448px;
            margin-bottom: 16px;
            padding: 16px;
            text-align: center;
        }

        .problem-label {
            margin-bottom: 8px;
            color: var(--gold);
            font-size: 0.76rem;
            font-family: 'Press Start 2P', cursive;
        }

        #math-problem {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.45rem, 5vw, 2.2rem);
            line-height: 1.25;
            color: #fff;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        }

        .answer-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        #options-container .pixel-btn {
            padding: 12px 6px;
            font-size: 1rem;
            font-weight: 700;
        }

        #hud {
            position: absolute;
            top: 8px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            font-size: 10px;
            font-weight: 700;
            color: var(--parchment);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
        }

        .hud-box {
            padding: 8px 10px;
            border: 2px solid rgba(140, 240, 255, 0.95);
            background: linear-gradient(180deg, rgba(30, 22, 75, 0.9), rgba(11, 8, 32, 0.9));
            box-shadow: 0 0 12px rgba(140, 240, 255, 0.16);
            font-family: 'Press Start 2P', cursive;
        }

        .score-good {
            color: var(--green);
        }

        .score-bad {
            color: var(--red);
        }

        .result-score {
            margin-bottom: 16px;
            color: var(--gold);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .result-score span {
            color: #fff;
        }

        .end-title-win {
            color: var(--green);
        }

        .end-title-loss {
            color: #ef4444;
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            width: min(26vw, 110px);
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
            background: rgba(9, 6, 17, 0.75);
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 20;
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: scale(1);
        }

        #success-gif {
            top: 72px;
        }

        #fail-gif {
            bottom: 146px;
        }

        @media (max-width: 480px) {
            #hud {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .answer-grid {
                max-width: 100%;
            }

            #options-container .pixel-btn {
                font-size: 0.9rem;
            }

            .body-copy {
                font-size: 0.92rem;
            }

            .feedback-gif {
                width: 88px;
                right: 8px;
            }

            #success-gif {
                top: 102px;
            }

            #fail-gif {
                bottom: 170px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel screen">
                <h1 class="title-text">MATH CROWN<br>TRIAL</h1>
                <p class="body-copy">Clear 100 royal sums.<br>Miss fewer than 10 answers.</p>
                <button id="start-btn" class="pixel-btn primary-btn">START TRIAL</button>
            </div>

            <div id="game-ui" class="hidden">
                <div class="glass-panel problem-panel">
                    <div class="problem-label">ROYAL SUM:</div>
                    <div id="math-problem">1 + 1 = ?</div>
                </div>
                <div id="options-container" class="answer-grid">
                </div>
            </div>

            <div id="game-over-screen" class="hidden glass-panel screen">
                <h2 id="end-title" class="title-text end-title-loss">TRIAL FAILED</h2>
                <p id="end-message" class="body-copy">...</p>
                <div class="result-score">Score: <span id="finalScore">0</span>/100</div>
                <button id="restart-btn" class="pixel-btn primary-btn">TRY AGAIN</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-box">CLEARED: <span id="score" class="score-good">0</span>/100</div>
                <div class="hud-box">MISSES: <span id="wrong" class="score-bad">0</span>/10</div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: success/fail overlays -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
            <img
                id="success-gif"
                class="feedback-gif hidden"
                src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
                alt="Victory reaction"
            >
            <img
                id="fail-gif"
                class="feedback-gif hidden"
                src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
                alt="Fail reaction"
            >
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: null,
            sfx: {},
            images: {
                challenger: null,
                monarch: null
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = ASSETS.bgm ? new Audio(ASSETS.bgm) : null;
                if (this.bgm) {
                    this.bgm.loop = true;
                    this.bgm.volume = 0.2;
                }
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    if (!url) continue;
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                if (this.bgm) {
                    this.bgm.load();
                }
                Object.values(this.sfx).forEach((audio) => audio.load());
            }

            playBGM() {
                if (!this.unlocked || !this.bgm) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { volume = 0.65, cooldown = 120 } = {}) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME ENGINE & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GAME_WIDTH = 320;
        const GAME_HEIGHT = 480;

        const imgChallenger = new Image();
        const imgMonarch = new Image();

        if (ASSETS.images.challenger) {
            imgChallenger.src = ASSETS.images.challenger;
        }
        if (ASSETS.images.monarch) {
            imgMonarch.src = ASSETS.images.monarch;
        }

        const successGif = document.getElementById('success-gif');
        const failGif = document.getElementById('fail-gif');

        let gameState = 'MENU';
        let frame = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let currentProblem = {};
        let hasLoopStarted = false;
        let animationFrameId = null;

        let projectile = { active: false, x: 0, y: 0, targetX: 0, targetY: 0, speed: 8 };
        let challengerScaleY = 1.0;

        function flashGif(element, duration = 1000) {
            element.classList.remove('hidden');
            void element.offsetWidth;
            element.classList.add('show');

            clearTimeout(element._hideTimer);
            element._hideTimer = setTimeout(() => {
                element.classList.remove('show');
                setTimeout(() => element.classList.add('hidden'), 180);
            }, duration);
        }

        /** 4. GAME LOGIC */
        function generateProblem() {
            const isAddition = Math.random() > 0.5;
            const a = Math.floor(Math.random() * 50) + 1;
            const b = Math.floor(Math.random() * 50) + 1;
            let answer = isAddition ? a + b : a - b;

            let finalA = a, finalB = b, finalAns = answer;
            if (!isAddition && a < b) {
                finalA = b;
                finalB = a;
                finalAns = b - a;
            }

            const options = new Set();
            options.add(finalAns);
            while (options.size < 3) {
                let offset = Math.floor(Math.random() * 10) - 5;
                let wrong = finalAns + offset;
                if (wrong !== finalAns && wrong >= 0) options.add(wrong);
            }

            return {
                text: `${finalA} ${isAddition ? '+' : '-'} ${finalB} = ?`,
                answer: finalAns,
                options: Array.from(options).sort(() => Math.random() - 0.5)
            };
        }

        function updateUI() {
            document.getElementById('score').innerText = correctCount;
            document.getElementById('wrong').innerText = wrongCount;

            if (gameState === 'PLAYING') {
                document.getElementById('math-problem').innerText = currentProblem.text;
                const container = document.getElementById('options-container');
                container.innerHTML = '';
                currentProblem.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'pixel-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        audio.playSFX('click', { volume: 0.45, cooldown: 50 });
                        handleAnswer(opt);
                    };
                    container.appendChild(btn);
                });
            }
        }

        function handleAnswer(val) {
            if (gameState !== 'PLAYING') return;

            if (val === currentProblem.answer) {
                correctCount++;
                audio.playSFX('correct', { volume: 0.45, cooldown: 90 });
                if (correctCount % 10 === 0 || correctCount >= 98) {
                    flashGif(successGif, 900);
                }

                if (correctCount >= 100) {
                    winGame();
                } else {
                    currentProblem = generateProblem();
                    updateUI();
                }
            } else {
                wrongCount++;
                audio.playSFX('fail', { volume: 0.7, cooldown: 140 });
                flashGif(failGif, 1100);

                if (wrongCount >= 10) {
                    startLossCutscene();
                } else {
                    ctx.fillStyle = 'rgba(255,0,0,0.3)';
                    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                    currentProblem = generateProblem();
                    updateUI();
                }
            }
            updateUI();
        }

        function startLossCutscene() {
            gameState = 'CUTSCENE';
            document.getElementById('game-ui').classList.add('hidden');

            projectile.active = true;
            projectile.x = GAME_WIDTH * 0.75;
            projectile.y = 100;
            projectile.targetX = GAME_WIDTH * 0.25;
            projectile.targetY = 300;
        }

        function winGame() {
            gameState = 'END';
            audio.stopBGM();
            audio.playSFX('win', { volume: 0.7, cooldown: 200 });
            flashGif(successGif, 1600);
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('end-title').innerText = 'TRIAL CLEARED';
            document.getElementById('end-title').className = 'title-text end-title-win';
            document.getElementById('end-message').innerText = 'The crown accepts your perfect count.';
            document.getElementById('finalScore').innerText = correctCount;
        }

        function loseGame() {
            gameState = 'END';
            audio.stopBGM();
            audio.playSFX('lose', { volume: 0.72, cooldown: 200 });
            flashGif(failGif, 1500);
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('end-title').innerText = 'TRIAL FAILED';
            document.getElementById('end-title').className = 'title-text end-title-loss';
            document.getElementById('end-message').innerText = 'The royal test ends before your score is complete.';
            document.getElementById('finalScore').innerText = correctCount;
        }

        /** 5. RENDER LOOP */
        function drawBackground() {
            if (gameState === 'CUTSCENE' || (gameState === 'END' && wrongCount >= 10)) {
                const flicker = Math.random() * 0.2;
                const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                grad.addColorStop(0, '#300');
                grad.addColorStop(0.5, `rgba(255, 50, 0, ${0.5 + flicker})`);
                grad.addColorStop(1, '#500');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                for (let i = 0; i < 20; i++) {
                    ctx.fillStyle = `rgba(255, ${Math.random() * 200}, 0, 0.8)`;
                    ctx.fillRect(Math.random() * GAME_WIDTH, Math.random() * GAME_HEIGHT, 4, 4);
                }
            } else {
                ctx.fillStyle = '#e8f4f8';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.fillStyle = '#2d5a27';
                ctx.fillRect(20, 20, GAME_WIDTH - 40, 150);
                ctx.strokeStyle = '#8a5a27';
                ctx.lineWidth = 4;
                ctx.strokeRect(20, 20, GAME_WIDTH - 40, 150);
                ctx.fillStyle = '#d2b48c';
                ctx.fillRect(0, 300, GAME_WIDTH, GAME_HEIGHT - 300);
            }
        }

        function drawCharacters() {
            const monarchBob = Math.sin(frame * 0.05) * 5;

            ctx.save();
            ctx.translate(GAME_WIDTH * 0.75, 100 + monarchBob);
            if (imgMonarch.complete && imgMonarch.naturalWidth > 0) {
                ctx.drawImage(imgMonarch, -40, -40, 80, 80);
            } else {
                ctx.fillStyle = '#7c3aed';
                ctx.fillRect(-26, -34, 52, 68);
                ctx.fillStyle = '#f8d66d';
                ctx.beginPath();
                ctx.moveTo(-24, -34);
                ctx.lineTo(-10, -52);
                ctx.lineTo(0, -34);
                ctx.lineTo(10, -52);
                ctx.lineTo(24, -34);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#dbeafe';
                ctx.fillRect(-14, -8, 28, 20);
            }
            ctx.fillStyle = '#140f2b';
            ctx.font = '700 12px Rajdhani';
            ctx.textAlign = 'center';
            ctx.fillText('CROWN JUDGE', 0, 50);
            ctx.restore();

            ctx.save();
            const challengerX = GAME_WIDTH * 0.25;
            const challengerY = 300;

            ctx.translate(challengerX, challengerY);

            if (gameState === 'CUTSCENE' || (gameState === 'END' && wrongCount >= 10)) {
                ctx.scale(1, challengerScaleY);
            } else {
                ctx.scale(1, 1 + Math.sin(frame * 0.1) * 0.02);
            }

            if (imgChallenger.complete && imgChallenger.naturalWidth > 0) {
                ctx.drawImage(imgChallenger, -40, -40, 80, 80);
            } else {
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(-22, -26, 44, 52);
                ctx.fillStyle = '#fde68a';
                ctx.beginPath();
                ctx.arc(0, -34, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-18, -4, 36, 20);
            }

            if (challengerScaleY > 0.5) {
                ctx.fillStyle = '#140f2b';
                ctx.font = '700 12px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('CHALLENGER', 0, 50);
            }
            ctx.restore();
        }

        function updateCutscene() {
            if (projectile.active) {
                const dx = projectile.targetX - projectile.x;
                const dy = projectile.targetY - projectile.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 10) {
                    projectile.active = false;
                    audio.playSFX('hit', { volume: 0.75, cooldown: 200 });
                    flashGif(failGif, 1300);
                    const flattenInterval = setInterval(() => {
                        challengerScaleY -= 0.1;
                        if (challengerScaleY <= 0.1) {
                            challengerScaleY = 0.1;
                            clearInterval(flattenInterval);
                            setTimeout(loseGame, 1000);
                        }
                    }, 50);
                } else {
                    projectile.x += (dx / dist) * projectile.speed;
                    projectile.y += (dy / dist) * projectile.speed;
                }

                ctx.fillStyle = '#ff7a90';
                ctx.font = '28px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('F', projectile.x, projectile.y);
            }
        }

        function gameLoop() {
            frame++;
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawBackground();
            drawCharacters();

            if (gameState === 'CUTSCENE') {
                updateCutscene();
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        /** 6. INIT */
        function startGame() {
            correctCount = 0;
            wrongCount = 0;
            challengerScaleY = 1.0;
            projectile.active = false;
            currentProblem = generateProblem();
            successGif.classList.add('hidden');
            successGif.classList.remove('show');
            failGif.classList.add('hidden');
            failGif.classList.remove('show');

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-ui').classList.remove('hidden');

            gameState = 'PLAYING';
            updateUI();

            if (!hasLoopStarted) {
                hasLoopStarted = true;
                gameLoop();
            } else if (animationFrameId === null) {
                gameLoop();
            }
        }

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        function bindTapAndClick(button, handler) {
            let touchHandled = false;
            button.addEventListener('touchend', (event) => {
                touchHandled = true;
                event.preventDefault();
                handler();
            }, { passive: false });

            button.addEventListener('click', () => {
                if (touchHandled) {
                    touchHandled = false;
                    return;
                }
                handler();
            });
        }

        // [agent-note][stage4] repaired: mobile-cta-actionability | scope: buttons keep native tap flow while gameplay touch suppression stays on canvas only
        bindTapAndClick(startBtn, () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.55, cooldown: 200 });
            audio.playBGM();
            startGame();
        });

        bindTapAndClick(restartBtn, () => {
            audio.unlock();
            audio.playSFX('click', { volume: 0.5, cooldown: 120 });
            audio.playBGM();
            startGame();
        });

        ctx.fillStyle = '#202020';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.fillStyle = 'white';
        ctx.font = '700 16px Rajdhani';
        ctx.textAlign = 'center';
        ctx.fillText('Tap Start To Begin', GAME_WIDTH / 2, GAME_HEIGHT / 2);
    });
    </script>
</body>
</html>
