<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Metro Heist: Missions</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-black: rgba(0, 0, 0, 0.85);
            --panel-black: rgba(7, 11, 24, 0.78);
            --panel-border: rgba(109, 200, 255, 0.22);
            --road-black: #0b1020;
            --road-glow: #102040;
            --hud-gray: #243657;
            --hud-gray-dark: #0d1528;
            --hud-gray-mid: #395177;
            --text-white: #f8fbff;
            --text-gray: #d9e7ff;
            --text-muted: #9bb2d1;
            --yellow: #ffd84d;
            --yellow-bright: #fff08a;
            --yellow-dark: #c38c1e;
            --green: #69f0ae;
            --red: #ff5f7d;
            --cyan: #5fd7ff;
            --cyan-soft: rgba(95, 215, 255, 0.18);
            --violet: #8b5cf6;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: 'Orbitron', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(95, 215, 255, 0.12), transparent 34%),
                linear-gradient(180deg, #0a1020 0%, var(--road-black) 100%);
            background-color: var(--road-black);
            color: var(--text-white);
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        .absolute { position: absolute; }
        .relative { position: relative; }
        .inset-0 { inset: 0; }
        .full-size { width: 100%; height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }

        #game-container {
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, rgba(95, 215, 255, 0.12), transparent 28%),
                linear-gradient(180deg, #10172b 0%, #060914 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .pointer-auto {
            pointer-events: auto;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 27, 49, 0.88), rgba(7, 11, 24, 0.84));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 20px rgba(95, 215, 255, 0.08);
        }

        .title-font {
            font-family: 'Bangers', 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .wasted-text {
            font-family: 'Bangers', 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.12em;
            text-shadow: 0 0 14px rgba(95, 215, 255, 0.32), 2px 2px 0 #000;
            text-transform: uppercase;
        }

        .mission-text {
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }

        #hud {
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        #hud > .flex:first-child,
        .score-box {
            padding: 8px 10px;
            border: 1px solid rgba(95, 215, 255, 0.18);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(8, 15, 32, 0.75), rgba(8, 15, 32, 0.48));
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24);
        }

        #wanted-stars {
            display: flex;
            gap: 4px;
        }

        .wanted-star {
            width: 20px;
            height: 20px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1;
        }

        .wanted-star.active {
            background: radial-gradient(circle at 30% 30%, #fff5b0, var(--yellow));
            box-shadow: 0 0 10px rgba(255, 216, 77, 0.85);
            animation: pulse 1s ease-in-out infinite;
        }

        .wanted-star.inactive {
            background: rgba(28, 40, 68, 0.9);
            border: 1px solid rgba(116, 141, 181, 0.55);
            color: rgba(255, 255, 255, 0.32);
        }

        .mission-box {
            position: absolute;
            left: 50%;
            top: 16px;
            transform: translateX(-50%);
            width: 256px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mission-pill {
            background: linear-gradient(180deg, rgba(30, 44, 70, 0.92), rgba(10, 15, 28, 0.9));
            padding: 4px 16px;
            border-radius: 999px;
            border: 1px solid rgba(95, 215, 255, 0.45);
            margin-bottom: 4px;
            box-shadow: 0 0 14px rgba(95, 215, 255, 0.14);
        }

        #mission-title {
            color: var(--cyan);
            font-family: 'Press Start 2P', 'Orbitron', monospace;
            font-weight: 400;
            font-size: 0.56rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #mission-desc {
            color: var(--text-white);
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1;
            text-align: center;
            text-shadow: 0 0 10px rgba(95, 215, 255, 0.18);
        }

        .mission-progress-track {
            width: 100%;
            height: 6px;
            margin-top: 4px;
            background: var(--hud-gray);
            border: 1px solid rgba(6, 10, 20, 0.85);
            border-radius: 999px;
            overflow: hidden;
        }

        #mission-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--cyan), var(--yellow));
            box-shadow: 0 0 12px rgba(95, 215, 255, 0.42);
            transition: width 0.2s ease;
        }

        .score-box {
            color: var(--green);
            font-family: 'Press Start 2P', 'Orbitron', monospace;
            font-weight: 400;
            font-size: clamp(1rem, 2.7vw, 1.35rem);
            line-height: 1.6;
            text-align: right;
            text-shadow: 0 0 10px rgba(105, 240, 174, 0.28);
        }

        #mission-passed-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .overlay-title {
            margin: 0;
            color: var(--yellow);
            font-size: clamp(2.7rem, 9vw, 4.7rem);
            text-shadow: 0 4px 4px rgba(0, 0, 0, 0.8);
        }

        .overlay-subtitle {
            margin-top: 8px;
            padding: 4px 16px;
            border-radius: 8px;
            background: rgba(5, 10, 18, 0.65);
            color: var(--text-white);
            font-family: 'Press Start 2P', 'Orbitron', monospace;
            font-size: 0.78rem;
            box-shadow: 0 0 16px rgba(95, 215, 255, 0.14);
        }

        #feedback-gif-layer {
            position: absolute;
            right: 12px;
            bottom: 96px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }

        .feedback-gif {
            width: clamp(84px, 22vw, 132px);
            border-radius: 16px;
            border: 1px solid rgba(95, 215, 255, 0.32);
            background: rgba(7, 11, 24, 0.8);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.crash {
            width: clamp(110px, 30vw, 160px);
        }

        #start-screen,
        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }

        #start-screen {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #game-over-screen {
            z-index: 40;
            background: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            padding: 24px;
        }

        .start-card {
            width: min(92vw, 380px);
            padding: 32px;
            border-radius: 20px;
            border: 1px solid rgba(95, 215, 255, 0.28);
            border-left: 4px solid var(--yellow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .start-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(95, 215, 255, 0.14), transparent 36%),
                linear-gradient(135deg, transparent 0 58%, rgba(255, 255, 255, 0.04) 58% 62%, transparent 62% 100%);
            pointer-events: none;
        }

        .start-title {
            position: relative;
            margin: 0 0 10px;
            color: var(--yellow);
            font-size: clamp(2.8rem, 10vw, 4rem);
        }

        .start-subtitle {
            position: relative;
            margin: 0 0 24px;
            color: var(--text-gray);
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .instruction-list {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            padding: 16px;
            border-radius: 14px;
            background: rgba(8, 14, 30, 0.58);
            border: 1px solid rgba(95, 215, 255, 0.14);
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        .instruction-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .instruction-item span:last-child {
            color: var(--text-white);
        }

        .primary-btn,
        .secondary-btn {
            display: inline-flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-family: 'Rajdhani', 'Orbitron', system-ui, sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .primary-btn {
            background: linear-gradient(180deg, var(--yellow), #ffb627);
            color: #07101f;
            box-shadow: 0 10px 24px rgba(255, 184, 39, 0.28);
        }

        .primary-btn:hover {
            background: linear-gradient(180deg, #ffe67c, var(--yellow));
        }

        .secondary-btn {
            max-width: 280px;
            background: linear-gradient(180deg, #ffffff, #dcecff);
            color: #07101f;
            font-size: 1rem;
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(95, 215, 255, 0.18);
        }

        .secondary-btn:hover {
            background: linear-gradient(180deg, #ffffff, #edf5ff);
        }

        .primary-btn:active,
        .secondary-btn:active {
            transform: scale(0.96);
        }

        .game-over-title {
            margin: 0 0 16px;
            color: var(--red);
            font-size: clamp(3.8rem, 11vw, 5.8rem);
            animation: pulse 1.2s ease-in-out infinite;
        }

        .summary-line {
            margin-bottom: 8px;
            color: var(--text-muted);
            font-family: 'Press Start 2P', 'Orbitron', monospace;
            font-size: clamp(0.76rem, 2.8vw, 0.95rem);
            line-height: 1.8;
            text-transform: uppercase;
            text-align: center;
        }

        .summary-line .value {
            color: var(--text-white);
        }

        .summary-line.cash {
            margin-bottom: 28px;
            color: var(--green);
            font-size: clamp(1.4rem, 4.8vw, 1.9rem);
        }

        @keyframes missionPass {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.2); opacity: 1; }
            30% { transform: scale(1.0); opacity: 1; }
            80% { transform: scale(1.0); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .animate-mission-pass {
            animation: missionPass 3s ease-out forwards;
        }

        @media (max-width: 640px) {
            #hud {
                padding: 12px;
            }

            .mission-box {
                width: 220px;
                top: 12px;
            }

            #mission-title {
                font-size: 0.5rem;
            }

            #mission-desc {
                font-size: 0.95rem;
            }

            .score-box {
                font-size: 0.86rem;
                padding: 8px;
            }

            .start-card {
                padding: 24px;
            }

            .instruction-list {
                font-size: 0.86rem;
            }

            .primary-btn,
            .secondary-btn {
                font-size: 1rem;
                padding: 14px 18px;
            }

            #feedback-gif-layer {
                right: 8px;
                bottom: 80px;
                gap: 8px;
            }

            .feedback-gif {
                width: 80px;
            }

            .feedback-gif.crash {
                width: 108px;
            }

            .summary-line {
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="hud" class="hidden">
                <div class="flex flex-col">
                    <div id="wanted-stars">
                        <!-- [agent-note][stage1] role: future-emoji | element: heat-meter | intent: stylize pursuit level without changing gameplay -->
                    </div>
                </div>

                <div class="mission-box">
                    <div class="mission-pill">
                        <span id="mission-title">MISSION</span>
                    </div>
                    <div id="mission-desc" class="mission-text">DRIVE 500m</div>
                    <div class="mission-progress-track">
                        <div id="mission-bar"></div>
                    </div>
                </div>

                <div class="score-box">$<span id="score">0</span></div>
            </div>

            <div id="mission-passed-overlay" class="hidden">
                <div class="overlay-stack">
                    <h2 class="overlay-title title-font animate-mission-pass">MISSION CLEARED</h2>
                    <p class="overlay-subtitle">HEAT +</p>
                </div>
            </div>

            <div id="feedback-gif-layer" aria-hidden="true">
                <!-- [agent-note][stage3] resolved-gif: mission-clear + crash-feedback -> catalogs/gifs.json -->
                <img id="success-gif" class="feedback-gif" alt="Mission clear celebration reaction" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp">
                <img id="crash-gif" class="feedback-gif crash" alt="Crash reaction effect" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
            </div>

            <div id="start-screen" class="pointer-auto">
                <div class="glass-panel start-card">
                    <h1 class="start-title wasted-text">GETAWAY</h1>
                    <p class="start-subtitle">Complete each getaway objective.<br>Stay ahead of the pursuit.</p>
                    <div class="instruction-list">
                        <p class="instruction-item">👆 <span>Drag to steer</span></p>
                        <p class="instruction-item">🎯 <span>Finish the current objective</span></p>
                    </div>
                    <button id="start-btn" class="primary-btn">Start Run</button>
                </div>
            </div>

            <div id="game-over-screen" class="hidden pointer-auto">
                <h2 class="game-over-title wasted-text">BUSTED</h2>
                <div class="summary-line">Missions cleared: <span id="finalMissions" class="value">0</span></div>
                <div class="summary-line cash">Cash: $<span id="finalScore" class="value">0</span></div>
                <button id="restart-btn" class="secondary-btn">Retry Run</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                missionTick: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                pass: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                crash: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp",
                crash: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
            }
        };
        // [agent-note][stage3] resolved-audio: gameplay loop + ui + collect + crash -> catalogs/audios.json
        // [agent-note][stage3] resolved-font: display/body/hud -> catalogs/fonts.json

        const MISSIONS = [
            { type: 'DISTANCE', target: 500, desc: "Drive 500m" },
            { type: 'CASH', target: 300, desc: "Collect $300" },
            { type: 'PASS', target: 10, desc: "Pass 10 cars" },
            { type: 'DISTANCE', target: 1500, desc: "Escape 1.5km" },
            { type: 'CASH', target: 1000, desc: "Big score: $1000" },
            { type: 'PASS', target: 25, desc: "Weave through 25 cars" },
            { type: 'DISTANCE', target: 5000, desc: "Survive 5km" },
            { type: 'CASH', target: 5000, desc: "Retirement fund: $5000" }
        ];

        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayTimes = {};
                this.gestureUnlocked = false;
                this.muted = false;
                this.volumes = {
                    collect: 0.5,
                    missionTick: 0.42,
                    pass: 0.58,
                    fail: 0.52,
                    crash: 0.56,
                    start: 0.48,
                    click: 0.42
                };

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                if (this.gestureUnlocked) return;
                this.gestureUnlocked = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((audio) => audio.load());
            }

            playBGM() {
                if (this.muted || !this.gestureUnlocked) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                if (this.muted || !this.gestureUnlocked || !this.sfx[key]) return;

                const now = performance.now();
                const minInterval = options.minInterval ?? 90;
                if (this.lastPlayTimes[key] && now - this.lastPlayTimes[key] < minInterval) {
                    return;
                }
                this.lastPlayTimes[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = options.volume ?? this.volumes[key] ?? 0.5;
                clone.play().catch(() => {});
            }
        }

        function flashGif(id, duration = 1500) {
            const node = document.getElementById(id);
            if (!node) return;
            clearTimeout(node._hideTimer);
            node.classList.add('visible');
            node._hideTimer = setTimeout(() => node.classList.remove('visible'), duration);
        }

        const audio = new AudioController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let frameCount = 0;
        let gameSpeed = 0;
        let roadY = 0;

        let score = 0;
        let distanceTraveled = 0;
        let carsPassed = 0;

        let currentMissionIndex = 0;
        let missionProgress = 0;

        let player = {
            x: 0,
            y: 0,
            width: 50,
            height: 90,
            color: '#3b82f6',
            targetX: 0,
            tilt: 0,
            sirenPhase: 0
        };

        let obstacles = [];
        let collectibles = [];
        let buildings = [];

        const COLORS = {
            road: '#262626',
            grass: '#101010',
            lane: '#eab308',
            police: '#1f2937',
            civilian: ['#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899']
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 160;
            player.targetX = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        let isDragging = false;
        const handleInput = (clientX) => {
            if (!gameActive) return;
            player.targetX = clientX;
            const roadWidth = Math.min(width * 0.95, 600);
            const roadLeft = (width - roadWidth) / 2;
            if (player.targetX < roadLeft + 30) player.targetX = roadLeft + 30;
            if (player.targetX > roadLeft + roadWidth - 30) player.targetX = roadLeft + roadWidth - 30;
        };

        canvas.addEventListener('mousedown', (e) => { isDragging = true; handleInput(e.clientX); });
        canvas.addEventListener('mousemove', (e) => { if (isDragging) handleInput(e.clientX); });
        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('touchstart', (e) => { isDragging = true; handleInput(e.touches[0].clientX); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { if (isDragging) handleInput(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchend', () => { isDragging = false; });

        function initGame() {
            score = 0;
            distanceTraveled = 0;
            carsPassed = 0;
            frameCount = 0;
            gameSpeed = 8;
            roadY = 0;

            currentMissionIndex = 0;
            missionProgress = 0;

            obstacles = [];
            collectibles = [];
            buildings = [];

            player.x = width / 2;
            player.targetX = width / 2;

            document.getElementById('mission-passed-overlay').classList.add('hidden');
            document.getElementById('success-gif').classList.remove('visible');
            document.getElementById('crash-gif').classList.remove('visible');

            updateMissionUI();
            updateWantedLevel(1);
            document.getElementById('score').innerText = score;

            for (let i = 0; i < 8; i++) spawnBuilding(-height + (i * (height / 4)));
        }

        function updateWantedLevel(level) {
            const container = document.getElementById('wanted-stars');
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const star = document.createElement('div');
                star.className = `wanted-star ${i < level ? 'active' : 'inactive'}`;
                star.textContent = '🚨';
                container.appendChild(star);
            }
        }

        function updateMissionUI() {
            if (currentMissionIndex >= MISSIONS.length) {
                document.getElementById('mission-desc').innerText = "FREE DRIVE";
                document.getElementById('mission-bar').style.width = '100%';
                return;
            }

            const m = MISSIONS[currentMissionIndex];
            document.getElementById('mission-desc').innerText = m.desc;

            const pct = Math.min(100, (missionProgress / m.target) * 100);
            document.getElementById('mission-bar').style.width = `${pct}%`;
        }

        function checkMission() {
            if (currentMissionIndex >= MISSIONS.length) return;

            const m = MISSIONS[currentMissionIndex];
            if (missionProgress >= m.target) {
                currentMissionIndex++;
                missionProgress = 0;

                const overlay = document.getElementById('mission-passed-overlay');
                const title = overlay.querySelector('h2');
                overlay.classList.remove('hidden');
                title.classList.remove('animate-mission-pass');
                void title.offsetWidth;
                title.classList.add('animate-mission-pass');

                audio.playSFX('pass', { minInterval: 120 });
                setTimeout(() => audio.playSFX('missionTick', { minInterval: 120 }), 180);
                flashGif('success-gif', 2100);

                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 2500);

                gameSpeed += 1;
                updateWantedLevel(Math.min(5, Math.floor(currentMissionIndex / 2) + 1));
                updateMissionUI();
            } else {
                updateMissionUI();
            }
        }

        function spawnBuilding(yPos) {
            const roadWidth = Math.min(width * 0.95, 600);
            const roadLeft = (width - roadWidth) / 2;

            buildings.push({
                x: roadLeft - (80 + Math.random() * 100) - 10,
                y: yPos,
                w: 80 + Math.random() * 100,
                h: 150 + Math.random() * 200,
                z: 40,
                color: Math.random() > 0.5 ? '#1f2937' : '#111827'
            });

            buildings.push({
                x: roadLeft + roadWidth + 10,
                y: yPos,
                w: 80 + Math.random() * 100,
                h: 150 + Math.random() * 200,
                z: 40,
                color: Math.random() > 0.5 ? '#1f2937' : '#111827'
            });
        }

        function spawnObstacle() {
            const roadWidth = Math.min(width * 0.95, 600);
            const laneCount = 4;
            const laneWidth = roadWidth / laneCount;
            const roadLeft = (width - roadWidth) / 2;

            const lane = Math.floor(Math.random() * laneCount);
            const wanted = Math.min(5, Math.floor(currentMissionIndex / 2) + 1);
            const isPolice = Math.random() < (0.1 * wanted);

            obstacles.push({
                x: roadLeft + (lane * laneWidth) + (laneWidth - 46) / 2,
                y: -150,
                width: 46,
                height: 85,
                type: isPolice ? 'police' : 'civilian',
                speed: isPolice ? gameSpeed * 1.2 : gameSpeed * 0.8,
                color: isPolice ? COLORS.police : COLORS.civilian[Math.floor(Math.random() * COLORS.civilian.length)],
                passed: false
            });
        }

        function spawnCollectible() {
            const roadWidth = Math.min(width * 0.95, 600);
            const laneCount = 4;
            const laneWidth = roadWidth / laneCount;
            const roadLeft = (width - roadWidth) / 2;
            const lane = Math.floor(Math.random() * laneCount);

            collectibles.push({
                x: roadLeft + (lane * laneWidth) + (laneWidth - 30) / 2,
                y: -100,
                width: 30,
                height: 30,
                active: true
            });
        }

        function drawCar(c) {
            const isPlayer = c === player;
            const bodyRadius = isPlayer ? 10 : 6;
            const glowColor = isPlayer ? 'rgba(95, 215, 255, 0.45)' : 'rgba(0,0,0,0.18)';

            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.34)';
            ctx.beginPath();
            ctx.ellipse(c.x + c.width / 2, c.y + c.height + 8, c.width * 0.42, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = glowColor;
            ctx.shadowBlur = isPlayer ? 18 : 0;
            ctx.fillStyle = isPlayer ? '#1d4ed8' : c.color;
            ctx.beginPath();
            ctx.roundRect(c.x, c.y, c.width, c.height, bodyRadius);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (isPlayer) {
                ctx.fillStyle = '#60a5fa';
                ctx.beginPath();
                ctx.roundRect(c.x + 6, c.y + 6, c.width - 12, c.height - 12, 8);
                ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.roundRect(c.x + 9, c.y + 14, c.width - 18, 22, 7);
                ctx.fill();

                ctx.fillStyle = '#93c5fd';
                ctx.globalAlpha = 0.92;
                ctx.fillRect(c.x + 12, c.y + 18, c.width - 24, 7);
                ctx.globalAlpha = 1;

                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.arc(c.x + 14, c.y + 18, 4, 0, Math.PI * 2);
                ctx.arc(c.x + c.width - 14, c.y + 18, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = frameCount % 24 < 12 ? '#ef4444' : '#22d3ee';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 14;
                ctx.fillRect(c.x + c.width / 2 - 9, c.y + 6, 18, 6);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#facc15';
                ctx.fillRect(c.x + 5, c.y + 6, 6, 4);
                ctx.fillRect(c.x + c.width - 11, c.y + 6, 6, 4);

                ctx.fillStyle = '#fb7185';
                ctx.fillRect(c.x + 6, c.y + c.height - 6, 7, 4);
                ctx.fillRect(c.x + c.width - 13, c.y + c.height - 6, 7, 4);

                ctx.fillStyle = 'rgba(255,255,255,0.16)';
                ctx.beginPath();
                ctx.moveTo(c.x + 8, c.y + c.height - 24);
                ctx.lineTo(c.x + c.width - 8, c.y + c.height - 34);
                ctx.lineTo(c.x + c.width - 8, c.y + c.height - 18);
                ctx.lineTo(c.x + 8, c.y + c.height - 8);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(c.x + 4, c.y + 18, c.width - 8, 16);
                ctx.fillRect(c.x + 4, c.y + c.height - 22, c.width - 8, 10);

                ctx.fillStyle = c.color;
                ctx.globalAlpha = 0.9;
                ctx.fillRect(c.x + 5, c.y + 32, c.width - 10, c.height - 50);
                ctx.globalAlpha = 1;

                ctx.fillStyle = '#fef08a';
                ctx.fillRect(c.x + 2, c.y, 8, 4);
                ctx.fillRect(c.x + c.width - 10, c.y, 8, 4);

                ctx.fillStyle = '#ef4444';
                ctx.fillRect(c.x + 2, c.y + c.height - 3, 8, 3);
                ctx.fillRect(c.x + c.width - 10, c.y + c.height - 3, 8, 3);

                if (c.type === 'police') {
                    const tick = Math.floor(Date.now() / 150) % 2;
                    ctx.fillStyle = tick ? '#ef4444' : '#3b82f6';
                    ctx.shadowColor = tick ? 'red' : 'blue';
                    ctx.shadowBlur = 15;
                    ctx.fillRect(c.x + c.width / 2 - 8, c.y + 25, 16, 6);
                    ctx.shadowBlur = 0;
                }
            }

            ctx.restore();
        }

        function drawCash(c) {
            ctx.save();
            ctx.translate(c.x + c.width / 2, c.y + c.height / 2);
            ctx.rotate(frameCount * 0.1);
            ctx.fillStyle = '#22c55e';
            ctx.shadowColor = '#4ade80';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', 0, 1);
            ctx.restore();
        }

        function drawBuilding(b) {
            const cx = width / 2;
            const cy = height / 2;
            const bx = b.x, by = b.y;
            const dx = (bx + b.w / 2) - cx;
            const dy = (by + b.h / 2) - cy;
            const hFactor = 0.04;
            const tx = bx + dx * hFactor;
            const ty = by + dy * hFactor;

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + b.w, by);
            ctx.lineTo(tx + b.w, ty);
            ctx.lineTo(tx, ty);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(bx, by + b.h);
            ctx.lineTo(bx + b.w, by + b.h);
            ctx.lineTo(tx + b.w, ty + b.h);
            ctx.lineTo(tx, ty + b.h);
            ctx.fill();

            ctx.fillStyle = b.color;
            ctx.fillRect(tx, ty, b.w, b.h);

            ctx.fillStyle = '#fef3c7';
            ctx.globalAlpha = 0.1;
            if (b.x < width / 2) {
                ctx.fillRect(tx + b.w - 10, ty + 10, 5, b.h - 20);
            } else {
                ctx.fillRect(tx + 5, ty + 10, 5, b.h - 20);
            }
            ctx.globalAlpha = 1;
        }

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y
            );
        }

        function gameLoop() {
            if (!gameActive) return;

            frameCount++;
            player.x += (player.targetX - player.width / 2 - player.x) * 0.15;
            player.tilt = (player.targetX - player.width / 2 - player.x) * 0.05;

            const frameDist = gameSpeed / 10;
            distanceTraveled += frameDist;

            if (currentMissionIndex < MISSIONS.length && MISSIONS[currentMissionIndex].type === 'DISTANCE') {
                missionProgress += frameDist;
            }

            if (frameCount % Math.max(25, 80 - Math.floor(gameSpeed)) === 0) spawnObstacle();
            if (frameCount % 120 === 0) spawnCollectible();
            if (frameCount % 30 === 0) spawnBuilding(-300);

            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#0f1a32');
            skyGradient.addColorStop(1, '#060914');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#08111f';
            ctx.fillRect(0, 0, width * 0.14, height);
            ctx.fillRect(width * 0.86, 0, width * 0.14, height);

            const roadWidth = Math.min(width * 0.95, 600);
            const roadLeft = (width - roadWidth) / 2;

            const roadGradient = ctx.createLinearGradient(roadLeft, 0, roadLeft + roadWidth, 0);
            roadGradient.addColorStop(0, '#161f37');
            roadGradient.addColorStop(0.08, COLORS.road);
            roadGradient.addColorStop(0.92, COLORS.road);
            roadGradient.addColorStop(1, '#161f37');
            ctx.fillStyle = roadGradient;
            ctx.fillRect(roadLeft, 0, roadWidth, height);

            ctx.fillStyle = 'rgba(95, 215, 255, 0.08)';
            ctx.fillRect(roadLeft + 8, 0, 4, height);
            ctx.fillRect(roadLeft + roadWidth - 12, 0, 4, height);

            roadY = (roadY + gameSpeed) % 80;
            ctx.fillStyle = COLORS.lane;
            const laneW = roadWidth / 4;
            for (let i = 1; i < 4; i++) {
                for (let j = -1; j < height / 80 + 1; j++) {
                    ctx.fillRect(roadLeft + i * laneW - 2, j * 80 + roadY, 4, 40);
                }
            }

            buildings.forEach(b => {
                b.y += gameSpeed;
                drawBuilding(b);
            });
            buildings = buildings.filter(b => b.y < height + 300);

            collectibles.forEach(c => {
                c.y += gameSpeed;
                if (c.active) {
                    drawCash(c);
                    if (checkCollision(player, c)) {
                        c.active = false;
                        score += 100;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('collect', { minInterval: 110 });

                        if (currentMissionIndex < MISSIONS.length && MISSIONS[currentMissionIndex].type === 'CASH') {
                            missionProgress += 100;
                            audio.playSFX('missionTick', { minInterval: 160, volume: 0.36 });
                        }
                    }
                }
            });
            collectibles = collectibles.filter(c => c.y < height + 50);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.y += o.speed;

                if (o.type === 'police' && o.y > 0 && o.y < player.y - 150) {
                    if (player.x > o.x + 10) o.x += 0.5;
                    else if (player.x < o.x - 10) o.x -= 0.5;
                }

                drawCar(o);

                const pBox = { x: player.x + 8, y: player.y + 8, width: player.width - 16, height: player.height - 16 };
                const oBox = { x: o.x + 5, y: o.y + 5, width: o.width - 10, height: o.height - 10 };

                if (checkCollision(pBox, oBox)) {
                    gameOver();
                    return;
                }

                if (!o.passed && o.y > player.y + player.height) {
                    o.passed = true;
                    carsPassed++;
                    if (currentMissionIndex < MISSIONS.length && MISSIONS[currentMissionIndex].type === 'PASS') {
                        missionProgress += 1;
                    }
                }
            }
            obstacles = obstacles.filter(o => o.y < height + 200);

            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.rotate(player.tilt * 0.002);
            ctx.translate(-(player.x + player.width / 2), -(player.y + player.height / 2));
            drawCar(player);
            ctx.restore();

            const grad = ctx.createRadialGradient(width / 2, height / 2, height / 3, width / 2, height / 2, height);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(95, 215, 255, 0.05)';
            for (let i = 0; i < 10; i++) {
                const stripeY = (frameCount * gameSpeed * 0.3 + i * 120) % (height + 120) - 120;
                ctx.fillRect(roadLeft - 28, stripeY, 8, 60);
                ctx.fillRect(roadLeft + roadWidth + 20, stripeY, 8, 60);
            }

            checkMission();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('crash', { minInterval: 120, volume: 0.5 });
            setTimeout(() => audio.playSFX('fail', { minInterval: 120, volume: 0.46 }), 140);
            flashGif('crash-gif', 2200);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('mission-passed-overlay').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalMissions').innerText = currentMissionIndex;
            // [agent-note][stage1] role: future-audio | trigger: game-over-state | intent: sharper failure sting
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { minInterval: 120 });
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            audio.playBGM();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', { minInterval: 120 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            audio.playBGM();
            initGame();
            gameLoop();
        });
    });
    </script>
