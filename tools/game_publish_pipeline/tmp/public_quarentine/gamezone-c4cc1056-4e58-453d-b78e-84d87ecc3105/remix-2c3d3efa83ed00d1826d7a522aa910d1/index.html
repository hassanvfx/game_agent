        /* Controls */
        .d-pad { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); width: 160px; height: 160px; pointer-events: none; z-index: 100; }
        .d-btn {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, rgba(247,255,247,0.78), rgba(56,166,200,0.95));
            border-radius: 50%;
            pointer-events: auto;
            border: 2px solid rgba(247, 255, 247, 0.82);
            box-shadow: 0 8px 0 rgba(23, 50, 77, 0.72), inset 0 2px 8px rgba(255,255,255,0.36), 0 0 18px rgba(56,166,200,0.22);
            display: flex; align-items: center; justify-content: center;
            color: #f4fbff; font-size: 24px; touch-action: none;

        .d-btn:active { transform: translateY(4px) scale(0.97); box-shadow: 0 0 0 rgba(2,8,20,0.92), inset 0 2px 8px rgba(255,255,255,0.1); }
        .d-left { top: 52px; left: 0; }
        .d-right { top: 52px; right: 0; }

        .action-pad { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); right: max(22px, env(safe-area-inset-right)); pointer-events: none; z-index: 100; }
        .act-btn {
            width: 88px; height: 88px;
            background: radial-gradient(circle at 30% 30%, #fff6b8, #ffd65a 34%, #ff7f2f 100%);
            border-radius: 50%; pointer-events: auto;
            border: 3px solid rgba(255,255,255,0.82);
            box-shadow: 0 8px 0 #8c3f00, 0 16px 24px rgba(0,0,0,0.44), 0 0 22px rgba(255,214,90,0.32);
            display: flex; align-items: center; justify-content: center;
            color: #132554; font-weight: 700; font-size: 1.2rem;
            font-family: var(--font-display);
            letter-spacing: 0.04em;
            text-shadow: none;

        .act-btn:active { transform: translateY(6px) scale(0.97); box-shadow: 0 0 0 #8c3f00, 0 8px 16px rgba(0,0,0,0.32); }

<script>
/** 
 * § Core Architecture 
 */
const CONFIG = {
    heroSpeed: 14,
    jumpForce: 20,
    gravity: 0.9,
    baseBossHp: 6,
    friction: 0.85,
    accel: 1.5,
    maxLevels: 10
};

// Dynamic Theme System
const THEMES = [
    // 1: Morning Feather Lane
    { skyTop: '#70C5CE', skyBot: '#B9F3F0', water: '#38A6C8', grass: '#58C84A', dirt: '#2B8A2E' },
    // 2: Sunset Pipe Orchard
    { skyTop: '#7A5BC8', skyBot: '#FFB45C', water: '#E97645', grass: '#58C84A', dirt: '#2B8A2E' },
    // 3: Storm Beak Canyon
    { skyTop: '#314C70', skyBot: '#88B9D6', water: '#38688A', grass: '#3E9D4D', dirt: '#245F3C' },
    // 4: Neon Night Migration
    { skyTop: '#203B73', skyBot: '#3C6FA4', water: '#13254F', grass: '#39D083', dirt: '#17324D' },
    // 5: Golden Final Gate
    { skyTop: '#70C5CE', skyBot: '#FFE66D', water: '#38A6C8', grass: '#A8F06A', dirt: '#2B8A2E' },
    // 6: High Cloud Lane
    { skyTop: '#4FB9D4', skyBot: '#E8FFF5', water: '#2D91B0', grass: '#65D957', dirt: '#2B8A2E' },
    // 7: Pipe Garden
    { skyTop: '#7ED6D5', skyBot: '#F7FFF7', water: '#38A6C8', grass: '#58C84A', dirt: '#27772E' },
    // 8: Pale Sky Sanctuary
    { skyTop: '#BEEFFF', skyBot: '#FFFFFF', water: '#80DCE9', grass: '#A8F06A', dirt: '#6FA34A' },
    // 9: Moon Feather Flight
    { skyTop: '#142C5C', skyBot: '#315D98', water: '#203B73', grass: '#58C84A', dirt: '#17324D' },
    // 10: Crimson Pipe Finale
    { skyTop: '#203B73', skyBot: '#E94B35', water: '#3B255F', grass: '#FFE66D', dirt: '#2B1B39' }
];

let currentColors = { ...THEMES[0] };

try {
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);
} catch(e) {
    window.gameConfig = CONFIG;
}

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgmMain: document.getElementById('bgm_main'),
    bgmBoss: document.getElementById('bgm_boss'),
    bgmVictory: document.getElementById('bgm_victory'),
    bgmDefeat: document.getElementById('bgm_defeat'),
    collect: document.getElementById('sfx_collect'),
    hit: document.getElementById('sfx_hit'),
    jump: document.getElementById('sfx_jump'),
    land: document.getElementById('sfx_land'),
    ui: document.getElementById('sfx_ui'),
    start: document.getElementById('sfx_start'),
    powerup: document.getElementById('sfx_powerup'),
    win: document.getElementById('sfx_win'),
    fail: document.getElementById('sfx_fail')
};
const SOUND_VOLUMES = {
    bgmMain: 0.28,
    bgmBoss: 0.34,
    bgmVictory: 0.32,
    bgmDefeat: 0.24,
    collect: 0.6,
    hit: 0.72,
    jump: 0.52,
    land: 0.45,
    ui: 0.45,
    start: 0.58,
    powerup: 0.68,
    win: 0.72,
    fail: 0.62
};
let audioUnlocked = false;
let currentLoop = null;
let lastGrounded = false;
let lastSoundAt = {};
const reactionEls = {
    powerup: document.getElementById('powerup-reaction'),
    fail: document.getElementById('fail-reaction')
};
let reactionTimers = {};

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    Object.values(sounds).forEach(el => {
        if (!el) return;
        el.volume = SOUND_VOLUMES[el.id.replace('sfx_', '').replace('bgm_', 'bgm').replace('main', 'Main')] || el.volume || 0.5;
        el.load?.();
    });
}

function stopMusic() {
    Object.entries(sounds).forEach(([key, el]) => {
        if (!key.startsWith('bgm') || !el) return;
        el.pause();
        el.currentTime = 0;
    });
    currentLoop = null;
}

function playSound(id, { reset = true, debounce = 0 } = {}) {
    const now = performance.now();
    if (debounce > 0 && lastSoundAt[id] && now - lastSoundAt[id] < debounce) return;
    lastSoundAt[id] = now;
    const el = sounds[id];
    if (el) {
        unlockAudio();
        if (reset) el.currentTime = 0;
        el.volume = SOUND_VOLUMES[id] ?? 0.55;
        el.play().catch(() => playTone(id));
    } else {
        playTone(id);
    }
}

function showReaction(type, duration = 1200) {
    const el = reactionEls[type];
    if (!el) return;
    clearTimeout(reactionTimers[type]);
    el.classList.add('active');
    reactionTimers[type] = setTimeout(() => el.classList.remove('active'), duration);
}

const playTone = (type) => {
    if (!audioUnlocked && !['collect', 'hit', 'jump', 'land', 'ui', 'start', 'powerup', 'win', 'fail'].includes(type)) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;

    if (type === 'jump') {
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(600, t + 0.15);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
    } else if (type === 'collect') {
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.linearRampToValueAtTime(2000, t + 0.1);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, t);
        osc.frequency.exponentialRampToValueAtTime(20, t + 0.3);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'land') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
    } else if (type === 'ui' || type === 'start' || type === 'win') {
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.14);
        osc.start(t); osc.stop(t + 0.14);
    } else if (type === 'fail') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(110, t + 0.25);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.28);
        osc.start(t); osc.stop(t + 0.28);
    }
};

const playMusic = (mode = 'main') => {
    if (!audioUnlocked) return;
    const target = sounds[mode];
    if (!target || currentLoop === mode) return;
    unlockAudio();
    stopMusic();
    currentLoop = mode;
    target.currentTime = 0;
    target.volume = SOUND_VOLUMES[mode] ?? 0.3;
    target.play().catch(() => {});
};

/**
 * § Game Logic
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let lastTime = 0;
let animationId;

const STATE = { MENU: 0, PLAY: 1, TRANSFORM: 2, BOSS: 3, GAMEOVER: 4, LEVEL_COMPLETE: 5 };
let gameState = STATE.MENU;
let currentLevel = 1;
let score = 0;
let particles = [];
let cameraX = 0;
let shake = 0;
let frameCount = 0;

const keys = { ArrowLeft: false, ArrowRight: false, ArrowDown: false, Space: false };

const player = {
    x: 100, y: 0, vx: 0, vy: 0,
    w: 40, h: 40,
    grounded: false, rolling: false, facing: 1, super: false,
    invincibleTimer: 0, angle: 0, animFrame: 0
};

const emeralds = [];
let obstacles = [];
let clouds = [];
let decor = [];
let boss = null;
let levelLength = 6000;

function init() {
    resize();
    window.addEventListener('resize', resize);
    setupInputs();
    
    // Generate static clouds once
    for(let i=0; i<30; i++) {
        clouds.push({
            x: Math.random() * 2000,
            y: Math.random() * 300,
            w: 60 + Math.random() * 100,
            speed: 0.2 + Math.random() * 0.3
        });
    }
    
    requestAnimationFrame(loop);
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    const safeDt = Math.min(dt, 50);

    update(safeDt);
    draw();
    animationId = requestAnimationFrame(loop);
}

function getLevelTheme(level) {
    const idx = (level - 1) % THEMES.length;
    return THEMES[idx];
}

function resetGame(level) {
    currentLevel = level;
    currentColors = getLevelTheme(currentLevel);
    
    // Difficulty Scaling
    const difficultyMult = (currentLevel - 1) * 0.5;
    levelLength = 6000 + (currentLevel - 1) * 800;
    const obstacleCount = 15 + (currentLevel * 3);
    
    player.x = 100;
    player.y = canvas.height - 150;
    player.vx = 0; player.vy = 0;
    player.super = false; player.rolling = false; player.invincibleTimer = 0;
    score = 0; cameraX = 0; boss = null;
    emeralds.length = 0; obstacles = []; particles = []; decor = [];
    
    // Emeralds
    for(let i=0; i<7; i++) {
        const ex = 800 + (i * (levelLength / 8)) + Math.random() * 200;
        emeralds.push({ x: ex, y: canvas.height - 220 - Math.random() * 150, collected: false, color: `hsl(${i * 55}, 100%, 60%)`, angle: 0 });
    }

    // Obstacles
    for(let i=0; i<obstacleCount; i++) {
        const ox = 800 + Math.random() * (levelLength - 1200);
        let safe = true;
        emeralds.forEach(e => { if(Math.abs(ox - e.x) < 200) safe = false; }); // Don't spawn right on emeralds
        if(!safe) continue;

        const type = Math.random() > 0.4 ? 'spike' : 'badnik';
        obstacles.push({
            x: ox, y: canvas.height - 100, w: 40, h: 40,
            type: type,
            vx: type === 'badnik' ? -2 - (difficultyMult * 0.2) : 0,
            patrolStart: ox - 150, patrolEnd: ox + 150,
            active: true, anim: 0
        });
    }
    
    // Decor
    for(let i=0; i<40; i++) {
        decor.push({
            x: Math.random() * levelLength,
            y: canvas.height - 100,
            type: Math.random() > 0.7 ? 'tree' : 'flower',
            scale: 0.8 + Math.random() * 0.4
        });
    }
    decor.sort((a,b) => a.x - b.x);
    obstacles.sort((a,b) => a.x - b.x);

    updateUI();
    lastGrounded = player.grounded;
    playMusic('bgmMain');
    document.getElementById('boss-hud').classList.add('opacity-0', 'translate-y-[-20px]');
    document.getElementById('boss-hud').classList.remove('opacity-100', 'translate-y-0');
    document.getElementById('super-msg').classList.add('hidden');
}

function update(dt) {
    if (gameState === STATE.MENU || gameState === STATE.GAMEOVER || gameState === STATE.LEVEL_COMPLETE) {
        frameCount++;
        return;
    }

    frameCount++;
    const targetCamX = player.x - canvas.width * 0.3;
    cameraX += (targetCamX - cameraX) * 0.1;
    if (cameraX < 0) cameraX = 0;
    
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    // Physics
    const maxSpeed = player.super ? window.gameConfig.heroSpeed * 1.5 : window.gameConfig.heroSpeed;
    const accel = CONFIG.accel * (player.grounded ? 1 : 0.4);
    
    if (keys.ArrowRight) { player.vx += accel; player.facing = 1; }
    else if (keys.ArrowLeft) { player.vx -= accel; player.facing = -1; }
    else { player.vx *= CONFIG.friction; }

    // Roll
    if (keys.ArrowDown && player.grounded && Math.abs(player.vx) > 1) {
        player.rolling = true; player.h = 20;
        if(frameCount % 5 === 0) createParticles(player.x, player.y + 20, 1, '#fff', 0, -2);
    } else if (!keys.ArrowDown && player.rolling) {
        player.rolling = false; player.h = 40; player.y -= 20;
    }

    player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));

    // Jump
    if (keys.Space && player.grounded) {
        player.vy = -window.gameConfig.jumpForce;
        player.grounded = false; player.rolling = true;
        playSound('jump', { debounce: 90 });
        createParticles(player.x, player.y + 40, 8, '#fff', 0, 0);
    }

    player.vy += window.gameConfig.gravity;
    player.x += player.vx;
    player.y += player.vy;
    
    // Rotation
    if (player.rolling || !player.grounded) player.angle += player.vx * 0.25;
    else player.angle = 0;
    
    if (Math.abs(player.vx) > 0.1) player.animFrame += 0.2 + Math.abs(player.vx) * 0.05;

    // Floor
    const floorY = canvas.height - 100;
    if (player.y + player.h > floorY) {
        player.y = floorY - player.h;
        player.vy = 0;
        player.grounded = true;
        if (!keys.ArrowDown) player.rolling = false;
        if(Math.abs(player.vx) > 8 && frameCount % 6 === 0) {
            createParticles(player.x - (player.facing * 20), player.y + 40, 2, '#ddd', -player.facing*2, -1);
        }
    } else {
        player.grounded = false;
    }

    if (player.grounded && !lastGrounded) {
        playSound('land', { debounce: 120 });
    }
    lastGrounded = player.grounded;

    // Collisions
    if (gameState === STATE.PLAY) {
        obstacles.forEach(obs => {
            if (!obs.active) return;
            if (obs.type === 'badnik') {
                obs.x += obs.vx;
                obs.anim += 0.2;
                if (obs.x < obs.patrolStart || obs.x > obs.patrolEnd) obs.vx *= -1;
            }

            if (checkRectCollide(player, obs)) {
                if (player.super) {
                    destroyObstacle(obs);
                } else if (obs.type === 'spike') {
                    endGame(false, "PIPE TEETH!");
                } else if (obs.type === 'badnik') {
                    const hitTop = (player.y + player.h - player.vy) <= obs.y + 15 && player.vy > 0;
                    if (player.rolling || hitTop) {
                        destroyObstacle(obs);
                        player.vy = -12;
                    } else {
                        endGame(false, "CAGE BONK!");
                    }
                }
            }
        });

        emeralds.forEach(e => {
            e.angle += 0.05;
            if (!e.collected && checkRectCollide(player, {x: e.x, y: e.y, w: 30, h: 30})) {
                e.collected = true;
                score++;
                playSound('collect');
                createParticles(e.x, e.y, 15, e.color, 0, 0);
                updateUI();
                if (score >= 7) triggerTransformation();
            }
        });
    }

    // Boss Fight
    if (gameState === STATE.BOSS && boss) {
        boss.timer += dt * 0.002;
        // Boss hovers near camera right edge
        boss.x = cameraX + canvas.width - 250 + Math.sin(boss.timer) * 120;
        boss.y = canvas.height - 350 + Math.cos(boss.timer * 2.5) * 80;

        if (checkRectCollide(player, boss)) {
            if (player.rolling || player.super) {
                if (boss.invuln <= 0) {
                    boss.hp--;
                    boss.invuln = 80;
                    shake = 25;
                    playSound('hit', { debounce: 80 });
                    createParticles(boss.x + boss.w/2, boss.y + boss.h/2, 20, '#F44336', 0, 0);
                    player.vy = -12; player.vx = -10;
                    updateUI();
                    if (boss.hp <= 0) {
                        if (currentLevel >= CONFIG.maxLevels) {
                            endGame(true, "MIGRATION CLEAR!");
                        } else {
                            levelComplete();
                        }
                    }
                }
            } else if (!player.super) {
                endGame(false, "GATE BONK!");
            }
        }
        if (boss.invuln > 0) boss.invuln--;
    }

    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--; p.vy += 0.2;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function destroyObstacle(obs) {
    obs.active = false;
    playSound('hit', { debounce: 80 });
    shake = 8;
    createParticles(obs.x + obs.w/2, obs.y + obs.h/2, 15, obs.type === 'spike' ? '#A8F06A' : '#E94B35', 0, -5);
}

function triggerTransformation() {
    gameState = STATE.TRANSFORM;
    player.vx = 0; player.vy = 0;
    setTimeout(() => {
        player.super = true;
        gameState = STATE.BOSS;
        playSound('powerup', { debounce: 200 });
        showReaction('powerup', 1500);
        playMusic('bgmBoss');
        
        // Scale Boss HP
        const hp = window.gameConfig.baseBossHp + (currentLevel * 2);
        boss = { x: cameraX + 800, y: 200, w: 100, h: 90, hp: hp, maxHp: hp, invuln: 0, timer: 0 };
        
        document.getElementById('super-msg').classList.remove('hidden');
        document.getElementById('boss-hud').classList.remove('hidden');
        setTimeout(() => {
            document.getElementById('boss-hud').classList.remove('opacity-0', 'translate-y-[-20px]');
            document.getElementById('boss-hud').classList.add('opacity-100', 'translate-y-0');
        }, 100);
    }, 2000);
}

/**
 * § Rendering System
 */
function draw() {
    // Dynamic Sky Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, currentColors.skyTop);
    grad.addColorStop(1, currentColors.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

    drawParallaxLayers();

    ctx.save();
    ctx.translate(-cameraX, 0);

    decor.forEach(d => drawDecor(d));
    drawTerrain();

    obstacles.forEach(obs => {
        if (!obs.active) return;
        if (obs.type === 'spike') drawSpike(obs);
        else drawBadnik(obs);
    });

    if (gameState === STATE.PLAY) {
        emeralds.forEach(e => {
            if (!e.collected) drawEmerald(e);
        });
    }

    if (boss) drawBoss(boss);
    drawPlayer();

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 30;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.restore();
    ctx.restore();
}

function drawParallaxLayers() {
    const phase = ((currentLevel - 1) % 5) + 1;
    const sunX = canvas.width * (phase >= 4 ? 0.78 : 0.18);
    const sunY = canvas.height * 0.16;
    
    // Soft sun / moon disk.
    ctx.save();
    ctx.globalAlpha = phase === 4 ? 0.42 : 0.72;
    ctx.fillStyle = phase === 4 ? '#F7FFF7' : '#FFE66D';
    ctx.beginPath();
    ctx.arc(sunX, sunY, phase === 4 ? 30 : 42, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Wind streak motion layer, strictly decorative and behind gameplay.
    ctx.strokeStyle = phase >= 4 ? 'rgba(247,255,247,0.28)' : 'rgba(255,255,255,0.34)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 0; i < 14; i++) {
        const y = 58 + i * 38 + Math.sin((frameCount + i * 21) * 0.018) * 8;
        const x = ((i * 127 - cameraX * 0.34 - frameCount * 0.9) % (canvas.width + 160)) - 80;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 34 + (i % 3) * 18, y);
        ctx.stroke();
    }

    // Parallax cloud puffs.
    clouds.forEach((c, idx) => {
        const x = (c.x - cameraX * 0.18 - frameCount * c.speed * 0.18) % (canvas.width + 420) - 210;
        const y = c.y * 0.82 + 22 + Math.sin((frameCount + idx * 19) * 0.01) * 4;
        ctx.fillStyle = idx % 3 === 0 ? 'rgba(247,255,247,0.72)' : 'rgba(255,255,255,0.58)';
        ctx.beginPath();
        ctx.arc(x, y, c.w/2, 0, Math.PI*2);
        ctx.arc(x + c.w*0.45, y + 9, c.w/3, 0, Math.PI*2);
        ctx.arc(x - c.w*0.45, y + 11, c.w/3.4, 0, Math.PI*2);
        ctx.arc(x + c.w*0.08, y - 15, c.w/3.2, 0, Math.PI*2);
        ctx.fill();
    });

    // Distant non-colliding pipe skyline / sky islands.
    const horizonY = canvas.height - 176;
    const offset = cameraX * 0.11;
    for (let i = -1; i <= canvas.width / 120 + 2; i++) {
        const x = i * 120 - (offset % 120);
        const pipeH = 58 + ((i + phase) % 4) * 18;
        const alpha = phase >= 4 ? 0.24 : 0.18;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#2B8A2E';
        ctx.fillRect(x + 22, horizonY - pipeH, 34, pipeH);
        ctx.fillStyle = '#58C84A';
        ctx.fillRect(x + 16, horizonY - pipeH - 10, 46, 14);
        ctx.fillStyle = '#A8F06A';
        ctx.fillRect(x + 21, horizonY - pipeH - 8, 8, 10);
    }
    ctx.globalAlpha = 1;

    // Air river below the play lane, replacing old water with moving sky bands.
    const airY = canvas.height - 124;
    const wGrad = ctx.createLinearGradient(0, airY, 0, canvas.height);
    wGrad.addColorStop(0, currentColors.water);
    wGrad.addColorStop(0.55, '#B9F3F0');
    wGrad.addColorStop(1, currentColors.skyBot);
    ctx.fillStyle = wGrad;
    ctx.fillRect(0, airY, canvas.width, 124);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.38)';
    ctx.lineWidth = 2;
    for(let i=0; i<12; i++) {
        const y = airY + 12 + i * 9;
        const x = ((i * 118) - cameraX * 0.45 + frameCount * 0.6) % (canvas.width + 120) - 60;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(x + 38, y - 5, x + 74, y + 5, x + 116, y);
        ctx.stroke();
    }
    ctx.restore();
}

function drawTerrain() {
    const tileSize = 64;
    const floorY = canvas.height - 100;
    const startX = Math.floor(cameraX / tileSize) * tileSize;
    const endX = startX + canvas.width + tileSize;

    for (let x = startX; x < endX; x += tileSize) {
        for (let y = floorY; y < canvas.height; y += tileSize) {
            const isDark = ((x/tileSize) + (y/tileSize)) % 2 === 0;
            ctx.fillStyle = isDark ? currentColors.dirt : shadeColor(currentColors.dirt, -18);
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = isDark ? 'rgba(168,240,106,0.08)' : 'rgba(255,255,255,0.06)';
            ctx.fillRect(x + 7, y + 8, 16, 5);
            ctx.fillRect(x + 38, y + 32, 18, 5);
        }
        
        // Rounded pipe-runway top: visual only, preserves floor position.
        ctx.fillStyle = '#2B8A2E';
        ctx.fillRect(x, floorY, tileSize, 18);
        ctx.fillStyle = currentColors.grass;
        ctx.fillRect(x, floorY - 4, tileSize, 12);
        ctx.fillStyle = '#A8F06A';
        ctx.fillRect(x + 6, floorY - 2, 15, 5);
        
        // Pipe lip scallops.
        ctx.fillStyle = '#58C84A';
        ctx.beginPath();
        ctx.arc(x + 16, floorY + 14, 15, 0, Math.PI, false);
        ctx.arc(x + 48, floorY + 14, 15, 0, Math.PI, false);
        ctx.fill();
    }
}

function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);

    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);

    R = (R<255)?R:255;  
    G = (G<255)?G:255;  
    B = (B<255)?B:255;  

    let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
    let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
    let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

    return "#"+RR+GG+BB;
}

function drawDecor(d) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.scale(d.scale, d.scale);
    if(d.type === 'tree') {
        // Far non-colliding pipe prop with cloud cap.
        ctx.fillStyle = '#2B8A2E';
        ctx.fillRect(-12, -112, 24, 112);
        ctx.fillStyle = '#58C84A';
        ctx.fillRect(-20, -122, 40, 16);
        ctx.fillStyle = '#A8F06A';
        ctx.fillRect(-15, -108, 6, 92);
        ctx.globalAlpha = 0.72;
        ctx.fillStyle = '#F7FFF7';
        ctx.beginPath();
        ctx.arc(-26, -132, 16, 0, Math.PI * 2);
        ctx.arc(-8, -140, 20, 0, Math.PI * 2);
        ctx.arc(13, -132, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    } else {
        // Small wind feather tuft.
        ctx.strokeStyle = '#17324D';
        ctx.lineWidth = 1.5;
        ctx.fillStyle = '#FFD64D';
        ctx.beginPath();
        ctx.ellipse(0, -26, 7, 18, 0.55, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#F66B2D';
        ctx.beginPath();
        ctx.moveTo(-5, -14);
        ctx.lineTo(5, -38);
        ctx.stroke();
    }
    ctx.restore();
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    
    if (player.super) {
        ctx.shadowBlur = 20 + Math.sin(frameCount * 0.5) * 10;
        ctx.shadowColor = '#FFD64D';
    }

    if (player.rolling) {
        // Tucked-wing dive ball, still drawn inside the existing player box.
        ctx.rotate(player.angle);
        const body = player.super ? '#FFE66D' : '#FFD64D';
        ctx.fillStyle = body;
        ctx.strokeStyle = '#17324D';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FF9F1C';
        ctx.beginPath(); ctx.ellipse(-2, 4, 14, 7, -0.45, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#F66B2D';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 12, 0.2, Math.PI*1.55); ctx.stroke();
    } else {
        ctx.scale(player.facing, 1);
        const body = player.super ? '#FFE66D' : '#FFD64D';
        const wing = player.super ? '#FFF1A9' : '#FF9F1C';
        const beak = '#F66B2D';

        // Tail feathers.
        ctx.fillStyle = '#38A6C8';
        ctx.strokeStyle = '#17324D';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-18, 3); ctx.lineTo(-34, -7); ctx.lineTo(-25, 7);
        ctx.moveTo(-18, 8); ctx.lineTo(-32, 18); ctx.lineTo(-20, 15);
        ctx.fill(); ctx.stroke();

        // Body.
        ctx.fillStyle = body;
        ctx.strokeStyle = '#17324D';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(0, 4, 20, 16, 0.05, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        // Wing flap.
        const flap = Math.sin(player.animFrame * 0.8 + frameCount * 0.12) * 0.32;
        ctx.fillStyle = wing;
        ctx.strokeStyle = '#17324D';
        ctx.lineWidth = 2;
        ctx.save();
        ctx.rotate(flap);
        ctx.beginPath();
        ctx.ellipse(-4, 8, 13, 7, -0.55, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.restore();

        // Head and beak.
        ctx.fillStyle = body;
        ctx.strokeStyle = '#17324D';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(10, -7, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = beak;
        ctx.strokeStyle = '#17324D';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(22, -6); ctx.lineTo(36, 0); ctx.lineTo(22, 5); ctx.closePath();
        ctx.fill(); ctx.stroke();

        // Eye.
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(15, -12, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#17324D';
        ctx.beginPath(); ctx.arc(17, -11, 2.5, 0, Math.PI*2); ctx.fill();

        // Tucked feet.
        ctx.strokeStyle = '#F66B2D';
        ctx.lineWidth = 3;
        const runCycle = Math.sin(player.animFrame);
        ctx.beginPath(); ctx.moveTo(-2, 18); ctx.lineTo(-8 - runCycle*3, 23); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, 17); ctx.lineTo(12 + runCycle*3, 22); ctx.stroke();
    }
    ctx.restore();
}

function drawBadnik(obs) {
    ctx.save();
    ctx.translate(obs.x + obs.w/2, obs.y + obs.h/2);
    ctx.scale(obs.vx > 0 ? -1 : 1, 1);
    
    // Cranky cage drone / pipe chick, same 40x40 footprint.
    const wAng = obs.anim;
    ctx.strokeStyle = '#17324D';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = '#F7FFF7';
    ctx.beginPath(); ctx.arc(0, 3, 17, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#58C84A';
    ctx.fillRect(-16, -5, 32, 5);
    ctx.fillRect(-16, 9, 32, 5);
    ctx.fillStyle = '#2B8A2E';
    for (let i=-10; i<=10; i+=10) ctx.fillRect(i, -12, 4, 30);

    // Tiny flapping angry wings.
    ctx.strokeStyle = '#F66B2D';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-17, 2); ctx.lineTo(-25, 2 + Math.sin(wAng) * 7);
    ctx.moveTo(17, 2); ctx.lineTo(25, 2 - Math.sin(wAng) * 7);
    ctx.stroke();

    ctx.fillStyle = '#FFD64D';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#17324D';
    ctx.beginPath(); ctx.arc(3, -2, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F66B2D';
    ctx.beginPath(); ctx.moveTo(7, 1); ctx.lineTo(15, 4); ctx.lineTo(7, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawSpike(obs) {
    ctx.save();
    ctx.translate(obs.x, obs.y);
    // Pipe teeth hazard inside the original 40x40 rectangle.
    const grad = ctx.createLinearGradient(0, 0, 0, 40);
    grad.addColorStop(0, '#A8F06A');
    grad.addColorStop(0.42, '#58C84A');
    grad.addColorStop(1, '#2B8A2E');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#17324D';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, 40); ctx.lineTo(8, 10); ctx.lineTo(16, 40);
    ctx.lineTo(22, 4); ctx.lineTo(29, 40);
    ctx.lineTo(36, 12); ctx.lineTo(40, 40);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(9, 18, 5, 18);
    ctx.restore();
}

function drawEmerald(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.translate(0, Math.sin(frameCount * 0.1) * 5);
    ctx.rotate(Math.sin(e.angle) * 0.45);
    ctx.strokeStyle = '#17324D';
    ctx.lineWidth = 2;
    ctx.fillStyle = '#FFD64D';
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 18, 0.42, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#F66B2D';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, 13); ctx.lineTo(7, -15); ctx.stroke();
    ctx.strokeStyle = e.color;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawBoss(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    
    // Pipe Gate Core boss, same boss rect/position semantics.
    ctx.fillStyle = `rgba(246, 107, 45, ${0.42 + Math.random()*0.22})`;
    ctx.beginPath(); ctx.moveTo(-18, 44); ctx.lineTo(0, 82 + Math.random()*12); ctx.lineTo(18, 44); ctx.fill();

    const pulse = Math.sin(frameCount * 0.08) * 3;
    ctx.strokeStyle = '#17324D';
    ctx.lineWidth = 3;
    ctx.fillStyle = '#2B8A2E';
    ctx.fillRect(-46, -8, 92, 82);
    ctx.strokeRect(-46, -8, 92, 82);
    ctx.fillStyle = '#58C84A';
    ctx.fillRect(-56, -18, 112, 22);
    ctx.strokeRect(-56, -18, 112, 22);
    ctx.fillStyle = '#A8F06A';
    ctx.fillRect(-36, -2, 10, 68);
    ctx.fillRect(26, -2, 10, 68);

    // Central lock eye / nest core.
    ctx.fillStyle = '#F7FFF7';
    ctx.beginPath(); ctx.arc(0, 24, 26 + pulse, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFD64D';
    ctx.beginPath(); ctx.arc(0, 24, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#17324D';
    ctx.beginPath(); ctx.arc(5, 20, 5, 0, Math.PI*2); ctx.fill();

    // Pipe teeth frame.
    ctx.fillStyle = '#F66B2D';
    for (let x=-34; x<=30; x+=16) {
        ctx.beginPath();
        ctx.moveTo(x, 62);
        ctx.lineTo(x + 8, 48);
        ctx.lineTo(x + 16, 62);
        ctx.fill();
    }

    if (b.invuln > 0 && Math.floor(frameCount/4)%2===0) {
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-58, -22, 116, 112);
    }
    ctx.restore();
}

function createParticles(x, y, count, color, vxOff=0, vyOff=0) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6 + vxOff,
            vy: (Math.random() - 0.5) * 6 + vyOff,
            life: 20 + Math.random() * 20,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('level-display').innerText = currentLevel;
    if (boss) {
        const pct = (boss.hp / boss.maxHp) * 100;
        document.getElementById('boss-hp-bar').style.width = `${pct}%`;
    }
}

function levelComplete() {
    gameState = STATE.LEVEL_COMPLETE;
    playSound('win', { debounce: 180 });
    playMusic('bgmVictory');
    showEndScreen("NEST CLEAR", `NEST ${currentLevel} OPEN`, false, true);
}

function endGame(win, reason) {
    gameState = win ? STATE.GAMEOVER : STATE.GAMEOVER; // Victory is technically a game over state in terms of flow
    if (win) {
        playSound('win', { debounce: 180 });
        playMusic('bgmVictory');
    } else {
        playSound('fail', { debounce: 180 });
        playMusic('bgmDefeat');
        showReaction('fail', 1600);
    }
    showEndScreen(win ? "SKYWAY CLEAR" : "PIPE BONK", reason || "TRY AGAIN", win, false);
}

function showEndScreen(titleText, msgText, isVictory, isLevelComplete) {
    const title = document.getElementById('end-title');
    const msg = document.getElementById('end-msg');
    const screen = document.getElementById('end-screen');
    const nextBtn = document.getElementById('next-level-btn');
    const retryBtn = document.getElementById('retry-btn');
    const menuBtn = document.getElementById('menu-btn');
    
    title.innerText = titleText;
    msg.innerText = msgText;
    
    // Hide all buttons first
    nextBtn.classList.add('hidden');
    retryBtn.classList.add('hidden');
    menuBtn.classList.add('hidden');
    
    if (isLevelComplete) {
        title.className = "text-8xl font-black text-green-400 mb-2 text-stroke drop-shadow-lg transform -skew-x-12";
        screen.className = "absolute inset-0 flex flex-col items-center justify-center bg-green-900/90 backdrop-blur-md pointer-events-auto z-50";
        nextBtn.classList.remove('hidden');
    } else if (isVictory) {
        title.className = "text-8xl font-black text-yellow-400 mb-2 text-stroke drop-shadow-lg transform -skew-x-12";
        screen.className = "absolute inset-0 flex flex-col items-center justify-center bg-blue-900/90 backdrop-blur-md pointer-events-auto z-50";
        menuBtn.classList.remove('hidden');
    } else {
        title.className = "text-8xl font-black text-red-600 mb-2 text-stroke drop-shadow-lg transform -skew-x-12";
        screen.className = "absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md pointer-events-auto z-50";
        retryBtn.classList.remove('hidden');
    }
    
    screen.classList.remove('hidden');
    document.getElementById('ui-layer').classList.remove('pointer-events-none');
}

/**
 * § Input System
 */
function setupInputs() {
    window.addEventListener('keydown', e => {
        if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
        if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', e => {
        if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
    });

    const btns = document.querySelectorAll('.d-btn, .act-btn');
    btns.forEach(btn => {
        const key = btn.dataset.key;
        const start = (e) => { e.preventDefault(); unlockAudio(); keys[key] = true; if(key==='Space') keys.Space = true; };
        const end = (e) => { e.preventDefault(); keys[key] = false; };
        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointercancel', end);
        btn.addEventListener('pointerleave', end);
    });

    const startRun = () => {
        if (gameState !== STATE.MENU) return;
        unlockAudio();
        playSound('start', { debounce: 150 });
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('mobile-controls').classList.remove('hidden');
        gameState = STATE.PLAY;
        resetGame(1);
    };

    // Start Game (Level 1)
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', startRun);
    // [agent-note][stage4] repaired: mobile-cta-actionability | element: #start-btn | action: pointerup mirrors click so menu start still fires when browsers suppress synthetic click timing
    startBtn.addEventListener('pointerup', (e) => {
        if (e.pointerType !== 'mouse') startRun();
    });

    // Retry Level
    document.getElementById('retry-btn').addEventListener('click', () => {
        unlockAudio();
        playSound('ui', { debounce: 120 });
        document.getElementById('end-screen').classList.add('hidden');
        gameState = STATE.PLAY;
        resetGame(currentLevel); // Retry same level
    });

    // Next Level
    document.getElementById('next-level-btn').addEventListener('click', () => {
        unlockAudio();
        playSound('ui', { debounce: 120 });
        document.getElementById('end-screen').classList.add('hidden');
        gameState = STATE.PLAY;
        resetGame(currentLevel + 1);
    });
    
    // Main Menu (after Victory)
    document.getElementById('menu-btn').addEventListener('click', () => {
        unlockAudio();
        playSound('ui', { debounce: 120 });
        stopMusic();
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        gameState = STATE.MENU;
    });

    ['pointerdown', 'keydown', 'touchstart'].forEach(eventName => {
        window.addEventListener(eventName, unlockAudio, { passive: true, once: true });
    });
}

function checkRectCollide(r1, r2) {
    return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('DOMContentLoaded', init);
</script>
