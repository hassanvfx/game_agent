<script>
/**
 * §0 System & Audio Architecture
 */
const CONFIG_DEF = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(CONFIG_DEF).map(([k, v]) => [k, v.value]));
window.gameConfigDefs = CONFIG_DEF;
window.updateGameConfig = (key, val) => {
    if(window.gameConfig[key] !== undefined) {
        window.gameConfig[key] = val;
        if(key === 'gameTitle') document.getElementById('title-display').innerText = val;
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw, ch;
let audioUnlocked = false;
let isMuted = false;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const sounds = {
    bgm: document.getElementById('bgm_main'),
    harvest: document.getElementById('sfx_harvest'),
    action: document.getElementById('sfx_action'),
    water: document.getElementById('sfx_water'),
    error: document.getElementById('sfx_error'),
    build: document.getElementById('sfx_build'),
    menuOpen: document.getElementById('sfx_menu_open'),
    menuClose: document.getElementById('sfx_menu_close'),
    start: document.getElementById('sfx_start'),
    gameOver: document.getElementById('sfx_game_over')
};

const feedbackEls = {
    harvest: document.getElementById('harvest-gif'),
    fail: document.getElementById('oops-gif')
};
let feedbackTimers = { harvest: null, fail: null };
let gameOverShown = false;

window.addEventListener('load', () => {
    if (sounds.bgm) {
        sounds.bgm.volume = 0.18;
    }
});

function flashFeedback(kind) {
    const el = feedbackEls[kind];
    if (!el) return;
    el.classList.add('show');
    clearTimeout(feedbackTimers[kind]);
    feedbackTimers[kind] = setTimeout(() => el.classList.remove('show'), 1400);
}

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    audioCtx.resume();
    if(!isMuted && sounds.bgm) sounds.bgm.play().catch(() => {});
}

function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
    if (isMuted) sounds.bgm.pause();
    else if (audioUnlocked) sounds.bgm.play().catch(() => {});
}

function playSfx(id, { restart = true } = {}) {
    if (!audioUnlocked || isMuted) return;
    const el = sounds[id];
    if (el) {
        if (restart) el.currentTime = 0;
        el.play().catch(() => playSynth(id));
    } else {
        playSynth(id);
    }
}

function playSynth(type) {
    if(isMuted || !audioUnlocked) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;

    if (type === 'water') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.linearRampToValueAtTime(200, t + 0.2);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(); osc.stop(t + 0.2);
    } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.setValueAtTime(1200, t + 0.05);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.15);
        osc.start(); osc.stop(t + 0.15);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, t);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(); osc.stop(t + 0.2);
    } else if (type === 'cluck') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.05);
        gain.gain.setValueAtTime(0.05, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.1);
        osc.start(); osc.stop(t + 0.1);
    } else if (type === 'build') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, t);
        osc.frequency.linearRampToValueAtTime(300, t + 0.1);
        osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.4);
        osc.start(); osc.stop(t + 0.4);
    }
}

function vibrate(style) {
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 40 : 15);
}

/**
 * §1 Game Logic & Data
 */
const WORLD_SIZE = 24;
const TILE_SIZE = 44;

const SEED_DB = {
    carrot: { id: 'carrot', name: 'Carrot', icon: '🥕', cost: 5,  sell: 12,  growTime: 4,  unlockPrice: 0,   color: '#EF6C00' },
    wheat:  { id: 'wheat',  name: 'Wheat',  icon: '🌾', cost: 2,  sell: 5,   growTime: 2.5,unlockPrice: 0,   color: '#FDD835' },
    potato: { id: 'potato', name: 'Potato', icon: '🥔', cost: 8,  sell: 20,  growTime: 6,  unlockPrice: 50,  color: '#D7CCC8' },
    tomato: { id: 'tomato', name: 'Tomato', icon: '🍅', cost: 15, sell: 40,  growTime: 8,  unlockPrice: 150, color: '#F44336' },
    corn:   { id: 'corn',   name: 'Corn',   icon: '🌽', cost: 35, sell: 100, growTime: 12, unlockPrice: 300, color: '#FFEB3B' },
    pumpkin:{ id: 'pumpkin',name: 'Pumpkin',icon: '🎃', cost: 60, sell: 180, growTime: 18, unlockPrice: 500, color: '#FF6D00' }
};

const BARN_LEVELS = [
    { cost: 250, name: "Build Barn", desc: "Start livestock", cows: 1, chickens: 1 },
    { cost: 600, name: "Upgrade Lvl 2", desc: "+Silo & Animals", cows: 1, chickens: 2 },
    { cost: 1500, name: "Upgrade Lvl 3", desc: "+Wing & Animals", cows: 2, chickens: 2 }
];

let gameState = 'MENU';
let money = 10;
let currentTool = 'seed';
let activeSeed = 'carrot';
let unlockedSeeds = ['carrot', 'wheat'];
let barnLevel = 0; 

let hero = { x: 12, y: 12, facing: 1, animTime: 0, walkTimer: 0 };
let workers = [];
let animals = [];
let camera = { x: 0, y: 0 };
let tiles = []; 
let particles = [];
let floatTexts = [];
let parallaxBg = [];
let parallaxFg = [];

let input = { active: false, startX: 0, startY: 0, currX: 0, currY: 0 };
let shopOpen = false;

function initGame() {
    tiles = [];
    money = 10;
    unlockedSeeds = ['carrot', 'wheat'];
    barnLevel = 0;
    workers = [];
    animals = [];
    activeSeed = 'carrot';
    currentTool = 'seed';
    hero.x = 12; hero.y = 12; hero.walkTimer = 0;
    gameOverShown = false;
    
    for(let x=0; x<WORLD_SIZE; x++) {
        tiles[x] = [];
        for(let y=0; y<WORLD_SIZE; y++) {
            let deco = Math.random() < 0.12 ? (Math.random() < 0.4 ? 'tree' : 'bush') : null;
            tiles[x][y] = { type: 'grass', wet: 0, crop: null, deco: deco };
        }
    }
    
    // Starting patch
    for(let i=11; i<=13; i++) {
        for(let j=11; j<=13; j++) {
            tiles[i][j].deco = null;
            tiles[i][j].type = 'soil';
        }
    }
    
    // Parallax
    parallaxBg = Array.from({length: 15}, () => ({
        x: Math.random() * 3000 - 1500,
        y: Math.random() * 1500 - 750,
        r: 80 + Math.random() * 150,
        color: `rgba(255, 235, 180, ${0.08 + Math.random()*0.1})`,
        speed: 0.2 + Math.random() * 0.8
    }));

    parallaxFg = Array.from({length: 12}, () => ({
        x: Math.random() * 3000 - 1500,
        y: Math.random() * 2000 - 1000,
        r: 4 + Math.random() * 10,
        speed: 4 + Math.random() * 6
    }));

    selectTool('seed');
    updateUI();
    updateShopUI();
    document.getElementById('game-over-modal').classList.add('hidden');
    document.getElementById('overlay-screen').classList.remove('hidden');
}

function checkBankruptcy() {
    if (barnLevel > 0 || money >= 2) return;
    let hasActiveCrops = false;
    for(let x=0; x<WORLD_SIZE; x++) {
        for(let y=0; y<WORLD_SIZE; y++) {
            if (tiles[x][y].crop) { hasActiveCrops = true; break; }
        }
        if(hasActiveCrops) break;
    }
    if (!hasActiveCrops && !gameOverShown) {
        gameOverShown = true;
        setTimeout(() => {
            playSfx('gameOver');
            flashFeedback('fail');
            document.getElementById('game-over-modal').classList.remove('hidden');
        }, 1500);
    }
}

function selectTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tool-' + tool).classList.add('active');
    
    const icons = { hoe: '⛏️', water: '💧', seed: SEED_DB[activeSeed].icon, hand: '✋' };
    document.getElementById('action-icon').innerText = icons[tool];
    if(tool === 'seed') document.getElementById('seed-cost-display').innerText = '$' + SEED_DB[activeSeed].cost;
}

function setActiveSeed(seedId) {
    if (!unlockedSeeds.includes(seedId)) return;
    activeSeed = seedId;
    const seed = SEED_DB[seedId];
    document.getElementById('seed-tool-icon').innerText = seed.icon;
    document.getElementById('seed-cost-display').innerText = '$' + seed.cost;
    if (currentTool === 'seed') document.getElementById('action-icon').innerText = seed.icon;
    updateShopUI();
    showMsg(`${seed.name} ready`);
}

function performAction() {
    const tx = Math.floor(hero.x);
    const ty = Math.floor(hero.y);
    if (tx < 0 || tx >= WORLD_SIZE || ty < 0 || ty >= WORLD_SIZE) return;
    
    const tile = tiles[tx][ty];
    let success = false;

    if (barnLevel > 0 && tx < 3 && ty < 3) return;

    if (currentTool === 'hoe') {
        if (tile.type === 'grass') {
            const cost = window.gameConfig.plotCost;
            if (money >= cost) {
                money -= cost;
                tile.type = 'soil';
                tile.deco = null;
                spawnParticles(tx, ty, '#795548', 12);
                spawnFloatText(tx, ty, `-$${cost}`, '#ef5350');
                playSfx('action');
                success = true;
                checkBankruptcy();
            } else {
                showMsg(`Need $${cost} cash`);
                playSfx('error');
                flashFeedback('fail');
            }
        }
    } else if (currentTool === 'water') {
        if (tile.type === 'soil') {
            tile.wet = 100;
                spawnParticles(tx, ty, '#4FC3F7', 8);
                playSfx('water');
                success = true;
        }
    } else if (currentTool === 'seed') {
        if (tile.type === 'soil' && !tile.crop) {
            const seed = SEED_DB[activeSeed];
            if (money >= seed.cost) {
                money -= seed.cost;
                tile.crop = { type: activeSeed, age: 0, maxAge: seed.growTime }; 
                spawnParticles(tx, ty, '#66BB6A', 5);
                spawnFloatText(tx, ty, `-$${seed.cost}`, '#FFFFFF');
                playSfx('action');
                success = true;
                checkBankruptcy();
            } else {
                showMsg("Need $" + seed.cost + " cash");
                playSfx('error');
                flashFeedback('fail');
            }
        }
    } else if (currentTool === 'hand') {
        if (tile.crop && tile.crop.age >= tile.crop.maxAge) {
            harvestCrop(tx, ty);
            success = true;
        }
    }

    if (success) {
        vibrate('medium');
        hero.animTime = 0.25; 
    }
    updateUI();
}

function harvestCrop(x, y) {
    const tile = tiles[x][y];
    if(tile && tile.crop) {
        const seed = SEED_DB[tile.crop.type];
        money += seed.sell;
        tile.crop = null;
        tile.wet = 0;
        spawnParticles(x, y, seed.color, 15);
        spawnFloatText(x, y, "+$" + seed.sell, '#FFD700');
        playSfx('harvest');
        flashFeedback('harvest');
        checkBankruptcy();
    }
}

function buyBarn() {
    if (barnLevel >= 3) return;
    const nextLevel = BARN_LEVELS[barnLevel];
    if (money >= nextLevel.cost) {
        money -= nextLevel.cost;
        barnLevel++;
        
        if (barnLevel === 1) {
            for(let i=0; i<3; i++) {
                for(let j=0; j<3; j++) {
                    tiles[i][j].type = 'grass';
                    tiles[i][j].deco = null;
                    tiles[i][j].crop = null;
                }
            }
        }

        for(let i=0; i<nextLevel.cows; i++) {
            animals.push({ type: 'cow', x: 1.5, y: 1.5, tx: 1.5, ty: 1.5, timer: 0, produceTimer: 10 + Math.random()*5 });
        }
        for(let i=0; i<nextLevel.chickens; i++) {
            animals.push({ type: 'chicken', x: 1, y: 1, tx: 1, ty: 1, timer: 0, produceTimer: 8 + Math.random()*5 });
        }

        playSfx('build');
        flashFeedback('harvest');
        spawnParticles(1.5, 1.5, '#D32F2F', 60);
        spawnParticles(1.5, 1.5, '#FFEB3B', 30);
        updateUI();
        updateShopUI();
        showMsg(barnLevel === 1 ? "Barn ready!" : "Barn upgraded!");
    } else {
        showMsg("Need $" + nextLevel.cost);
        playSfx('error');
        flashFeedback('fail');
    }
}

function buyWorker() {
    const cost = 150;
    if (money >= cost) {
        money -= cost;
        workers.push({ x: 12, y: 12, target: null, state: 'IDLE', timer: 0, facing: 1 });
        spawnParticles(12, 12, '#1976D2', 20);
        updateUI();
        updateShopUI();
        showMsg("Helper hired!");
        checkBankruptcy();
    } else {
        showMsg("Need $" + cost);
        playSfx('error');
        flashFeedback('fail');
    }
}

function buyOrSelectSeed(seedId) {
    const seed = SEED_DB[seedId];
    if (unlockedSeeds.includes(seedId)) {
        setActiveSeed(seedId);
    } else {
        if (money >= seed.unlockPrice) {
            money -= seed.unlockPrice;
            unlockedSeeds.push(seedId);
            spawnParticles(hero.x, hero.y, seed.color, 30);
            setActiveSeed(seedId);
            updateUI();
            updateShopUI();
            checkBankruptcy();
        } else {
            showMsg("Need $" + seed.unlockPrice + " cash");
            playSfx('error');
            flashFeedback('fail');
        }
    }
}

function updateShopUI() {
    const list = document.getElementById('seed-shop-list');
    list.innerHTML = ''; 
    const barnBtn = document.getElementById('buy-barn-btn');
    const barnName = document.getElementById('barn-name');
    const barnDesc = document.getElementById('barn-desc');
    const barnCost = document.getElementById('barn-cost');
    const barnLabel = document.getElementById('barn-btn-label');

    if (barnLevel >= 3) {
        barnName.innerText = "Mega Barn";
        barnDesc.innerText = "Max Level Reached";
        barnBtn.innerHTML = '<span class="text-xs">Maxed</span>';
        barnBtn.disabled = true;
        barnBtn.className = 'bg-gray-300 text-white font-bold py-2 px-3 rounded-xl flex flex-col items-center min-w-[70px] cursor-not-allowed';
    } else {
        const next = BARN_LEVELS[barnLevel];
        barnName.innerText = barnLevel === 0 ? "Barn" : `Barn Lvl ${barnLevel+1}`;
        barnDesc.innerText = next.desc;
        barnLabel.innerText = barnLevel === 0 ? "Build" : "Upgrade";
        barnCost.innerText = "$" + next.cost;
        barnBtn.disabled = false;
        barnBtn.className = 'bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-3 rounded-xl shadow-md btn-press flex flex-col items-center min-w-[70px]';
    }

    Object.values(SEED_DB).forEach(seed => {
        const isUnlocked = unlockedSeeds.includes(seed.id);
        const isSelected = activeSeed === seed.id;
        const item = document.createElement('div');
        item.className = `bg-white rounded-xl p-3 flex items-center justify-between border-2 ${isSelected ? 'border-orange-400 bg-orange-50' : 'border-gray-100'} shadow-sm`;
        
        let btnHtml = isUnlocked ? 
            `<button onclick="buyOrSelectSeed('${seed.id}')" class="${isSelected ? 'bg-gray-200' : 'bg-green-500'} text-white font-bold py-1.5 px-3 rounded-lg text-xs min-w-[70px]">${isSelected ? 'Active' : 'Select'}</button>` :
            `<button onclick="buyOrSelectSeed('${seed.id}')" class="bg-yellow-500 text-white font-bold py-1.5 px-3 rounded-lg flex flex-col items-center min-w-[70px]"><span class="text-xs">Unlock</span><span class="text-[10px]">$${seed.unlockPrice}</span></button>`;

        item.innerHTML = `<div class="flex items-center gap-3"><div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-xl">${seed.icon}</div><div><div class="font-bold text-gray-800 text-sm">${seed.name}</div><div class="text-[10px] text-gray-500 font-medium">Sell: $${seed.sell}</div></div></div>${btnHtml}`;
        list.appendChild(item);
    });
}

function showMsg(txt) {
    const el = document.getElementById('center-msg');
    el.firstElementChild.innerText = txt;
    el.classList.remove('opacity-0');
    setTimeout(() => el.classList.add('opacity-0'), 1500);
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x + 0.5, y: y + 0.5, z: 0.5,
            vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, vz: Math.random()*6 + 2,
            color, life: 0.8
        });
    }
}

function spawnFloatText(x, y, text, color) {
    floatTexts.push({ x: x + 0.5, y: y + 0.5, z: 1.5, text, color, life: 1.5 });
}

function updateUI() {
    document.getElementById('money-display').innerText = '$' + Math.floor(money);
}

function updateWorkers(dt) {
    workers.forEach(f => {
        if (f.state === 'IDLE') {
            let bestDist = 20;
            let target = null;
            let action = null;
            for(let x=0; x<WORLD_SIZE; x++) {
                for(let y=0; y<WORLD_SIZE; y++) {
                    const tile = tiles[x][y];
                    const d = Math.abs(x - f.x) + Math.abs(y - f.y);
                    if (tile.crop && tile.crop.age >= tile.crop.maxAge) {
                        if (d < bestDist) { bestDist = d; target = {x, y}; action = 'HARVEST'; }
                    } else if (tile.type === 'soil' && tile.wet <= 0) {
                        if (!action && d < bestDist) { bestDist = d; target = {x, y}; action = 'WATER'; }
                    }
                }
            }
            if (target) { f.target = target; f.action = action; f.state = 'MOVING'; }
            else if (Math.random() < 0.01) {
                f.target = { x: Math.max(0, Math.min(WORLD_SIZE-1, f.x + (Math.random()-0.5)*6)), y: Math.max(0, Math.min(WORLD_SIZE-1, f.y + (Math.random()-0.5)*6)) };
                f.action = 'WANDER'; f.state = 'MOVING';
            }
        } else if (f.state === 'MOVING') {
            const dx = f.target.x - f.x, dy = f.target.y - f.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 0.1) { f.x = f.target.x; f.y = f.target.y; f.state = 'WORKING'; f.timer = 0.6; }
            else { const s = 4 * dt; f.x += (dx/dist)*s; f.y += (dy/dist)*s; f.facing = dx > 0 ? 1 : -1; }
        } else if (f.state === 'WORKING') {
            f.timer -= dt;
            if (f.timer <= 0) {
                const tx = Math.floor(f.x), ty = Math.floor(f.y);
                const tile = tiles[tx][ty];
                if (f.action === 'HARVEST' && tile.crop && tile.crop.age >= tile.crop.maxAge) harvestCrop(tx, ty);
                else if (f.action === 'WATER' && tile.type === 'soil') { tile.wet = 100; spawnParticles(tx, ty, '#4FC3F7', 5); }
                f.state = 'IDLE';
                updateUI();
            }
        }
    });
}

function updateAnimals(dt) {
    animals.forEach(a => {
        if (a.timer <= 0) {
            if (Math.random() < 0.02) {
                a.tx = Math.max(0, Math.min(2.5, a.x + (Math.random()-0.5)*2));
                a.ty = Math.max(0, Math.min(2.5, a.y + (Math.random()-0.5)*2));
                a.timer = 2 + Math.random() * 3;
            }
        } else {
            a.timer -= dt;
            const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
            if (dist > 0.05) { const s = (a.type === 'chicken' ? 1.5 : 0.8) * dt; a.x += (dx/dist)*s; a.y += (dy/dist)*s; }
        }
        a.produceTimer -= dt;
        if (a.produceTimer <= 0) {
            a.produceTimer = a.type === 'chicken' ? 12 : 25;
            const val = a.type === 'chicken' ? 2 : 6;
            spawnFloatText(a.x, a.y, `+$${val}`, '#FFD700');
            money += val;
            playSfx('water');
            updateUI();
        }
    });
}

function update(dt) {
    if (gameState !== 'PLAYING' || shopOpen) return;

    let dx = 0, dy = 0;
    if (input.active) {
        const dist = Math.hypot(input.currX - input.startX, input.currY - input.startY);
        if (dist > 10) {
            const angle = Math.atan2(input.currY - input.startY, input.currX - input.startX);
            const force = Math.min(dist, 50) / 50;
            const sin45 = 0.7071;
            const sDx = Math.cos(angle) * force;
            const sDy = Math.sin(angle) * force;
            dx = (sDx * sin45 + sDy * sin45);
            dy = (-sDx * sin45 + sDy * sin45);
            hero.facing = sDx > 0 ? 1 : -1;
            
            // Walk Animation Logic
            hero.walkTimer += dt * 10;
            if(Math.random() < 0.1) {
                spawnParticles(hero.x, hero.y, '#E0E0E0', 1);
            }
        } else {
            // Decay to idle
            hero.walkTimer *= 0.8;
        }
    } else {
        hero.walkTimer *= 0.8;
    }

    const speed = window.gameConfig.heroSpeed * dt;
    hero.x = Math.max(0, Math.min(WORLD_SIZE, hero.x + dx * speed));
    hero.y = Math.max(0, Math.min(WORLD_SIZE, hero.y + dy * speed));
    if (hero.animTime > 0) hero.animTime -= dt;

    for(let x=0; x<WORLD_SIZE; x++) {
        for(let y=0; y<WORLD_SIZE; y++) {
            const t = tiles[x][y];
            if (t.type === 'soil') {
                if (t.wet > 0) t.wet -= 2.5 * dt;
                if (t.crop && t.crop.age < t.crop.maxAge) {
                    t.crop.age += (window.gameConfig.growthSpeed * (t.wet > 0 ? 3 : 1)) * dt;
                }
            }
        }
    }

    updateWorkers(dt);
    updateAnimals(dt);

    particles.forEach(p => {
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        p.vz -= 18 * dt; p.life -= dt;
    });
    particles = particles.filter(p => p.life > 0);

    floatTexts.forEach(t => { t.z += 0.8 * dt; t.life -= dt; });
    floatTexts = floatTexts.filter(t => t.life > 0);

    parallaxBg.forEach(p => { p.x += p.speed * 10 * dt; if(p.x > 1500) p.x = -1500; });
    parallaxFg.forEach(p => { p.x += p.speed * 20 * dt; if(p.x > 1500) p.x = -1500; });
}

/**
 * §2 Input Handling
 */
function handleStart(e) {
    if (shopOpen) return;
    const touch = e.touches ? e.touches[0] : e;
    if (e.target.closest('.tool-btn') || e.target.closest('button')) return;
    input.active = true;
    input.startX = touch.clientX; input.startY = touch.clientY;
    input.currX = touch.clientX; input.currY = touch.clientY;
    unlockAudio();
}
function handleMove(e) { if (input.active) { const t = e.touches ? e.touches[0] : e; input.currX = t.clientX; input.currY = t.clientY; } }
function handleEnd() { input.active = false; }

window.addEventListener('pointerdown', handleStart);
window.addEventListener('pointermove', handleMove);
window.addEventListener('pointerup', handleEnd);
window.addEventListener('pointercancel', handleEnd);

const actionBtn = document.getElementById('action-btn');
actionBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); performAction(); });
actionBtn.addEventListener('click', (e) => { e.stopPropagation(); performAction(); });
document.getElementById('shop-btn').addEventListener('click', () => {

    document.getElementById('shop-overlay').classList.add('hidden');

});
document.getElementById('buy-worker-btn').addEventListener('click', buyWorker);
document.getElementById('buy-barn-btn').addEventListener('click', buyBarn);
document.getElementById('restart-btn').addEventListener('click', () => {
    playSfx('start');

});
document.getElementById('start-btn').addEventListener('click', () => {

/**
 * §3 Rendering
 */
function toIso(x, y, z=0) {
    const isoX = (x - y) * TILE_SIZE;
    const isoY = (x + y) * (TILE_SIZE * 0.5) - z * TILE_SIZE;
    return { x: isoX + cw/2 - camera.x, y: isoY + ch/2 - camera.y + 100 };
}

function drawTile(x, y, tile) {
    const p1 = toIso(x, y, 0), p2 = toIso(x+1, y, 0), p3 = toIso(x+1, y+1, 0), p4 = toIso(x, y+1, 0);
    let color = '#AED581';
    if (tile.type === 'soil') color = tile.wet > 0 ? '#5D4037' : '#8D6E63';
    if (barnLevel > 0 && x < 3 && y < 3) color = '#795548';

    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1; ctx.stroke();

    if (tile.deco) {
        const cp = toIso(x+0.5, y+0.5, 0);
        if (tile.deco === 'tree') {
            ctx.fillStyle = '#6D4C41'; ctx.fillRect(cp.x-3, cp.y-12, 6, 12);
            ctx.fillStyle = '#43A047'; ctx.beginPath(); ctx.arc(cp.x, cp.y-20, 12, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = '#66BB6A'; ctx.beginPath(); ctx.arc(cp.x, cp.y-4, 7, 0, Math.PI*2); ctx.fill();
        }
    }

    if (tile.crop) {
        const progress = tile.crop.age / tile.crop.maxAge;
        const size = Math.max(0, progress * 0.8 + 0.2);
        const cp = toIso(x + 0.5, y + 0.5, 0);
        if (progress >= 1) { ctx.shadowColor = '#FFF'; ctx.shadowBlur = 10; }
        ctx.fillStyle = SEED_DB[tile.crop.type].color;
        ctx.beginPath(); ctx.arc(cp.x, cp.y - 10*size, 8*size, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function drawBarn() {
    if (barnLevel === 0) return;
    const p = toIso(1.5, 1.5, 0);
    
    // Base Barn
    ctx.fillStyle = '#C62828'; ctx.fillRect(p.x-30, p.y-60, 60, 60);
    ctx.fillStyle = '#ECEFF1'; ctx.beginPath(); ctx.moveTo(p.x-35, p.y-60); ctx.lineTo(p.x+35, p.y-60); ctx.lineTo(p.x, p.y-90); ctx.fill();
    ctx.fillStyle = '#3E2723'; ctx.fillRect(p.x-10, p.y-30, 20, 30); 

    if (barnLevel >= 2) {
        ctx.fillStyle = '#90A4AE'; ctx.fillRect(p.x+35, p.y-50, 20, 50);
        ctx.beginPath(); ctx.arc(p.x+45, p.y-50, 10, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#546E7A'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x+35, p.y-40); ctx.lineTo(p.x+55, p.y-40); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.x+35, p.y-20); ctx.lineTo(p.x+55, p.y-20); ctx.stroke();
    }

    if (barnLevel >= 3) {
        ctx.fillStyle = '#B71C1C'; ctx.fillRect(p.x-60, p.y-40, 30, 40);
        ctx.fillStyle = '#CFD8DC'; ctx.beginPath(); ctx.moveTo(p.x-65, p.y-40); ctx.lineTo(p.x-25, p.y-40); ctx.lineTo(p.x-45, p.y-60); ctx.fill();
    }
}

function drawCharacter(char, type) {
    const isHero = type === 'hero';
    
    // Animation Logic
    let jump = 0;
    let tilt = 0;
    
    if (isHero) {
        if (char.animTime > 0) {
            // Action Jump
            jump = Math.sin(char.animTime * Math.PI * 4) * 12;
        } else if (char.walkTimer > 0.1) {
            // Walking Bob
            jump = Math.abs(Math.sin(char.walkTimer)) * 6;
            tilt = Math.sin(char.walkTimer) * 0.1 * char.facing;
        }
    }

    const p = toIso(char.x, char.y, 0);
    const yOff = p.y - 15 - jump;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; 
    ctx.beginPath(); 
    ctx.ellipse(p.x, p.y, 10 - jump*0.2, 5 - jump*0.1, 0, 0, Math.PI*2); 
    ctx.fill();

    ctx.save();
    ctx.translate(p.x, yOff);
    ctx.rotate(tilt);

    if (isHero || type === 'worker') {
        ctx.fillStyle = isHero ? window.gameConfig.themeColor : '#1976D2'; 
        // Body
        ctx.fillRect(-8, -10, 16, 20);
        
        // Head
        ctx.fillStyle = '#FFE0B2'; 
        ctx.beginPath(); 
        ctx.arc(0, -12, 9, 0, Math.PI*2); 
        ctx.fill();
        
        // Eyes (Directional)
        const eyeOff = char.facing * 2;
        ctx.fillStyle = '#5D4037'; 
        ctx.beginPath(); 
        ctx.ellipse(eyeOff - 2, -14, 2, 3, 0, 0, Math.PI*2); 
        ctx.ellipse(eyeOff + 2, -14, 2, 3, 0, 0, Math.PI*2); 
        ctx.fill();

        // Backpack
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(-6 - char.facing*4, -6, 12, 10);
    } else {
        ctx.fillStyle = type === 'cow' ? '#EEE' : '#FFF';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
        if(type === 'cow') { ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-3, -2, 2, 0, Math.PI*2); ctx.fill(); }
    }
    
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#FFF3E0'; ctx.fillRect(0, 0, cw, ch);
    parallaxBg.forEach(p => {
        ctx.fillStyle = p.color; ctx.beginPath();
        ctx.arc(cw/2 + p.x - camera.x * 0.1, ch/2 + p.y - camera.y * 0.1, p.r, 0, Math.PI*2); ctx.fill();
    });

    // Tighter Camera Follow
    const isoX = (hero.x - hero.y) * TILE_SIZE;
    const isoY = (hero.x + hero.y) * (TILE_SIZE * 0.5);
    camera.x += (isoX - camera.x) * 0.2; 
    camera.y += (isoY - camera.y) * 0.2;

    for(let sum=0; sum<WORLD_SIZE*2; sum++) {
        for(let x=0; x<=sum; x++) {
            let y = sum - x;
            if(x < WORLD_SIZE && y < WORLD_SIZE) drawTile(x, y, tiles[x][y]);
        }
    }

    drawBarn();
    const all = [{c:hero, t:'hero'}, ...workers.map(w=>({c:w, t:'worker'})), ...animals.map(a=>({c:a, t:a.type}))];
    all.sort((a,b)=>(a.c.x+a.c.y)-(b.c.x+b.c.y)).forEach(o=>drawCharacter(o.c, o.t));

    particles.forEach(p => {
        const pos = toIso(p.x, p.y, p.z);
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath(); ctx.arc(pos.x, pos.y, 3, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    });

    floatTexts.forEach(t => {
        const pos = toIso(t.x, t.y, t.z);
        ctx.fillStyle = t.color; ctx.font = '700 20px "VT323"';
        ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
        ctx.fillText(t.text, pos.x, pos.y); ctx.shadowBlur = 0;
    });

    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    parallaxFg.forEach(p => {
        ctx.beginPath(); ctx.arc(cw/2 + p.x - camera.x * 0.3, ch/2 + p.y - camera.y * 0.3, p.r, 0, Math.PI*2); ctx.fill();
    });

    if (input.active) {
        ctx.beginPath(); ctx.arc(input.startX, input.startY, 40, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(239, 108, 0, 0.4)'; ctx.lineWidth = 4; ctx.stroke();
        ctx.beginPath(); ctx.arc(input.currX, input.currY, 15, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(239, 108, 0, 0.6)'; ctx.fill();
    }
}

let lastTime = 0;
function loop(time) {
    try {
        const dt = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        update(dt); draw();
        requestAnimationFrame(loop);
    } catch(e) { console.error(e); }
}

function resize() {
    cw = canvas.clientWidth; ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio; canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}

window.addEventListener('resize', resize);
document.addEventListener('DOMContentLoaded', () => { resize(); initGame(); requestAnimationFrame(loop); });
</script>
</body></html>
