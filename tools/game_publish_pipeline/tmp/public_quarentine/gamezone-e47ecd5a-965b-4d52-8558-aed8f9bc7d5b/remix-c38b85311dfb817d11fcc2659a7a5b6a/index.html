<style>
    @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap');
    
    :root {
        --bg-deep: #071521;
        --bg-tide: #0f2940;
        --sand-light: #f3d9a2;
        --sand-mid: #dcac67;
        --coral: #ff7a5c;
        --coral-deep: #c83f36;
        --foam: #dffcff;
        --gold: #ffd85f;
        --panel-border: rgba(223, 252, 255, 0.24);
        --shadow: rgba(0, 0, 0, 0.32);
    }
    
    html, body { 
        width: 100%;

            radial-gradient(circle at top, rgba(124, 234, 255, 0.18), transparent 30%),

    body::before {

            radial-gradient(circle at 20% 15%, rgba(255,255,255,0.18), transparent 18%),

    #game-container {
        position: relative;

    canvas {

    #ui-layer {

    /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */

    #game-over-screen {

    .panel {

    h1 {

    p {
        margin: 0 0 18px;

        font-size: clamp(14px, 3.8vw, 18px);
    }
    
    button {
        background: linear-gradient(180deg, #ff8f66, var(--coral));
        color: #fffdf8;
        border: none;
        padding: 14px 28px;
        font-size: clamp(16px, 4.8vw, 24px);

        transition: transform 0.1s, filter 0.12s;
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;

    }
    
    button:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--coral-deep);

    /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
    #joystick-hint {
        position: absolute;
        bottom: max(8%, 20px);
        width: 100%;
        text-align: center;
        color: rgba(223, 252, 255, 0.72);
        font-size: clamp(11px, 3.2vw, 16px);

    @keyframes pulse {
        0% { opacity: 0.28; }

    #feedback-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 9;
        overflow: hidden;

    #impact-gif,
    #gameover-gif {
        position: absolute;
        width: clamp(90px, 18vw, 150px);
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 18px;

        box-shadow: 0 12px 30px rgba(0,0,0,0.24);
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }

    #impact-gif {
        right: 12px;
        top: 82px;
    }

    #gameover-gif {
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%) scale(0.85);
        width: clamp(120px, 26vw, 180px);
    }

    #impact-gif.visible {
        opacity: 0.88;
        transform: scale(1);
    }

    #gameover-gif.visible {
        opacity: 0.92;
        transform: translateX(-50%) scale(1);
    }

    @media (max-width: 480px) {
        .panel {
            width: calc(100% - 32px);
            max-width: none;
            padding: 22px 18px;
        }
    }
</style>

<script>
/**
 * IRON ELBOW: IMMORTAL CRAB
 * A single-file HTML5 game about an immortal beach guardian collecting treasure while swatting raiders.
 */

// --- §0 Constants & Globals ---
const CONFIG = {
    colors: {
        hero: '#ff7a5c',
        heroDark: '#c83f36',
        enemy: '#00CC88',
        enemyDark: '#008855',
        gold: '#FFD700',
        sand: '#dcac67',
        water: 'rgba(223, 252, 255, 0.16)',
        deepWater: '#0b2134',
        foam: '#dffcff',
        coral: '#ff7a5c',
        coralDark: '#c83f36',
        shell: '#ffa98b',
        sandLight: '#f3d9a2',
        enemyGlow: '#98ffe4'
    },
    physics: {
        drag: 0.92,
        elbowReach: 80,
        elbowSpeed: 15
    }
};

let canvas, ctx;
let cw = 0, ch = 0; // Logical dimensions
let dpr = 1;
let lastTime = 0;
let initialized = false;
let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
let gameConfig = {}; // Populated from DOM
let score = 0;
let timeLeft = 60;
let shakeIntensity = 0;

// Audio Context
let audioCtx;
let audioBuffers = {};
let isMuted = false;
let sfxGainNode;
let bgmStarted = false;
let feedbackTimers = {};
let lastSfxAt = {};

// Entities
let hero;
let enemies = [];
let golds = [];
let particles = [];
let joystick = { active: false, originX: 0, originY: 0, currX: 0, currY: 0, dx: 0, dy: 0 };

// --- §1 Initialization & Lifecycle ---

document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });

    // Input Handling
    window.addEventListener('pointerdown', handleInputStart, { passive: false });
    window.addEventListener('pointermove', handleInputMove, { passive: false });
    window.addEventListener('pointerup', handleInputEnd, { passive: false });
    window.addEventListener('pointercancel', handleInputEnd, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('restart');
        restartGame();
    });

    // Resize Observer
    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        const { width, height } = entry.contentRect;
        resize(width, height);
        
        if (!initialized && width > 0 && height > 0) {
            initAudio(); // Preload sounds
            initGame();
            initialized = true;
            requestAnimationFrame(gameLoop);
        }
    });
    ro.observe(canvas);
});

function parseConfig() {
    try {
        const el = document.getElementById('game-config');
        const defs = JSON.parse(el.textContent);
        window.gameConfigDefs = defs;
        for (const key in defs) {
            gameConfig[key] = defs[key].value;
        }
    } catch(e) {
        console.error("Config parse error", e);
        gameConfig = { heroSpeed: 350, enemySpeed: 180, roundTime: 60 };
    }
}

function resize(width, height) {
    dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    
    cw = width;
    ch = height;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Clamp entities
    if (initialized && hero) {
        hero.x = clamp(hero.x, 20, cw - 20);
        hero.y = clamp(hero.y, 20, ch - 20);
    }
}

function initGame() {
    // Reset State
    score = 0;
    timeLeft = gameConfig.roundTime;
    updateUI();
    
    // Create Hero
    hero = {
        x: cw / 2,
        y: ch / 2,
        radius: 20,
        angle: 0,
        elbowAngle: 0,
        elbowState: 'IDLE', // IDLE, PUNCHING, RETRACTING
        elbowExt: 0,
        vx: 0, vy: 0
    };
    
    enemies = [];
    golds = [];
    particles = [];
    
    document.getElementById('game-over-screen').classList.remove('visible');
    document.getElementById('joystick-hint').style.display = 'block';
    
    setState('PLAYING');
    
    // Spawn initial
    for(let i=0; i<5; i++) spawnEnemy();
    for(let i=0; i<3; i++) spawnGold();
}

function restartGame() {
    initGame();
}

function setState(newState) {
    gameState = newState;
    syncBgm();
}

// --- §2 Input System ---

function handleInputStart(e) {
    unlockAudio();
    if (gameState !== 'PLAYING') return;
    
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    joystick.active = true;
    joystick.originX = x;
    joystick.originY = y;
    joystick.currX = x;
    joystick.currY = y;
    joystick.dx = 0;
    joystick.dy = 0;
    
    document.getElementById('joystick-hint').style.display = 'none';
}

function handleInputMove(e) {
    if (!joystick.active) return;
    e.preventDefault();
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    joystick.currX = x;
    joystick.currY = y;
    
    const maxDist = 60;
    let dx = x - joystick.originX;
    let dy = y - joystick.originY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > maxDist) {
        const ratio = maxDist / dist;
        dx *= ratio;
        dy *= ratio;
        joystick.currX = joystick.originX + dx;
        joystick.currY = joystick.originY + dy;
    }
    
    joystick.dx = dx / maxDist; // Normalized -1 to 1
    joystick.dy = dy / maxDist;
}

function handleInputEnd(e) {
    e.preventDefault();
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
}

// --- §3 Audio System ---

function initAudio() {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        sfxGainNode = audioCtx.createGain();
        sfxGainNode.gain.value = 0.35;
        sfxGainNode.connect(audioCtx.destination);

        const sfxList = [
            { id: 'punch', src: document.getElementById('sfx_punch').src },
            { id: 'coin', src: document.getElementById('sfx_coin').src },
            { id: 'alert', src: document.getElementById('sfx_alert').src },
            { id: 'restart', src: document.getElementById('sfx_restart').src }
        ];

        sfxList.forEach(item => {
            if (item.src) {
                fetch(item.src)
                    .then(r => r.arrayBuffer())
                    .then(buf => audioCtx.decodeAudioData(buf))
                    .then(decoded => { audioBuffers[item.id] = decoded; })
                    .catch(() => {});
            }
        });

        const bgm = document.getElementById('bgm_main');
        if (bgm) {
            bgm.volume = 0.2;
            bgm.preload = 'auto';
        }
    } catch (e) {
        console.warn("Audio init failed", e);
    }
}

function syncBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    if (gameState === 'PLAYING' && bgmStarted) {
        bgm.play().catch(() => {});
    } else {
        bgm.pause();
        if (gameState === 'GAMEOVER') bgm.currentTime = 0;
    }
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    bgmStarted = true;
    syncBgm();
}

function playSfx(type) {
    if (!audioCtx) return;

    const nowMs = performance.now();
    const throttleMs = type === 'punch' ? 90 : 140;
    if (lastSfxAt[type] && nowMs - lastSfxAt[type] < throttleMs) return;
    lastSfxAt[type] = nowMs;

    if (audioBuffers[type]) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = audioBuffers[type];
        gain.gain.value = ({ punch: 0.55, coin: 0.5, alert: 0.38, restart: 0.42 }[type]) || 0.4;
        src.connect(gain);
        gain.connect(sfxGainNode || audioCtx.destination);
        src.start(0);
    } else {
        synthesizeSfx(type);
    }
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    if (type === 'punch') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.linearRampToValueAtTime(1800, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'alert') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.linearRampToValueAtTime(420, now + 0.22);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.24);
        osc.start(now);
        osc.stop(now + 0.24);
    } else if (type === 'restart') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.linearRampToValueAtTime(720, now + 0.12);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.16);
    } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

function showFeedback(id, duration = 700) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('visible');
    clearTimeout(feedbackTimers[id]);
    feedbackTimers[id] = setTimeout(() => el.classList.remove('visible'), duration);
}

function vibrate(type) {
    if (window.navigator && window.navigator.vibrate) {
        if (type === 'heavy') window.navigator.vibrate(200);
        else window.navigator.vibrate(50);
    }
}

// --- §4 Game Logic ---

function spawnEnemy() {
    const edge = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
    let ex, ey;
    const pad = 50;
    
    if (edge === 0) { ex = Math.random() * cw; ey = -pad; }
    else if (edge === 1) { ex = cw + pad; ey = Math.random() * ch; }
    else if (edge === 2) { ex = Math.random() * cw; ey = ch + pad; }
    else { ex = -pad; ey = Math.random() * ch; }
    
    enemies.push({
        x: ex, y: ey,
        radius: 15 + Math.random() * 10,
        hp: 1,
        speed: gameConfig.enemySpeed * (0.8 + Math.random() * 0.4),
        color: CONFIG.colors.enemy
    });
}

function spawnGold() {
    golds.push({
        x: 40 + Math.random() * (cw - 80),
        y: 40 + Math.random() * (ch - 80),
        radius: 12,
        collected: false
    });
}

function update(dt) {
    if (gameState !== 'PLAYING') return;
    
    // Timer
    if (timeLeft > 0) {
        timeLeft -= dt;
        if (timeLeft <= 0) {
            timeLeft = 0;
            gameState = 'GAMEOVER';
            playSfx('alert');
            showFeedback('gameover-gif', 1800);
            syncBgm();
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.add('visible');
            return;
        }
        document.getElementById('timer-val').innerText = Math.ceil(timeLeft);
    }

    // Hero Movement
    if (joystick.active) {
        hero.vx = joystick.dx * gameConfig.heroSpeed;
        hero.vy = joystick.dy * gameConfig.heroSpeed;
        // Face direction of movement
        if (Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1) {
            hero.angle = Math.atan2(joystick.dy, joystick.dx);
        }
    } else {
        hero.vx *= CONFIG.physics.drag;
        hero.vy *= CONFIG.physics.drag;
    }
    
    hero.x += hero.vx * dt;
    hero.y += hero.vy * dt;
    
    // Clamp
    hero.x = clamp(hero.x, hero.radius, cw - hero.radius);
    hero.y = clamp(hero.y, hero.radius, ch - hero.radius);
    
    // Elbow Logic (Auto-Aim)
    let target = null;
    let minDist = 150;
    
    enemies.forEach(e => {
        const d = Math.hypot(e.x - hero.x, e.y - hero.y);
        if (d < minDist) {
            minDist = d;
            target = e;
        }
    });
    
    // Elbow State Machine
    if (hero.elbowState === 'IDLE') {
        // Rotate towards movement or target
        let targetAngle = hero.angle;
        if (target) {
            targetAngle = Math.atan2(target.y - hero.y, target.x - hero.x);
            // Trigger Punch
            if (minDist < CONFIG.physics.elbowReach + 20) {
                hero.elbowState = 'PUNCHING';
                playSfx('punch');
                showFeedback('impact-gif', 280);
            }
        }
        // Smooth rotate elbow
        let diff = targetAngle - hero.elbowAngle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        hero.elbowAngle += diff * 10 * dt;
        
        hero.elbowExt = Math.max(0, hero.elbowExt - 200 * dt);
        
    } else if (hero.elbowState === 'PUNCHING') {
        hero.elbowExt += 600 * dt;
        if (hero.elbowExt >= CONFIG.physics.elbowReach) {
            hero.elbowExt = CONFIG.physics.elbowReach;
            hero.elbowState = 'RETRACTING';
            shakeIntensity = 10;
            vibrate('heavy');
        }
    } else if (hero.elbowState === 'RETRACTING') {
        hero.elbowExt -= 400 * dt;
        if (hero.elbowExt <= 0) {
            hero.elbowExt = 0;
            hero.elbowState = 'IDLE';
        }
    }
    
    // Elbow Hitbox (Circle at end of arm)
    const elbowX = hero.x + Math.cos(hero.elbowAngle) * (30 + hero.elbowExt);
    const elbowY = hero.y + Math.sin(hero.elbowAngle) * (30 + hero.elbowExt);
    const fistRadius = 25;
    
    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        
        // Move towards hero
        const angle = Math.atan2(hero.y - e.y, hero.x - e.x);
        e.x += Math.cos(angle) * e.speed * dt;
        e.y += Math.sin(angle) * e.speed * dt;
        
        // Collision with Fist
        if (hero.elbowState === 'PUNCHING') {
            const distToFist = Math.hypot(e.x - elbowX, e.y - elbowY);
            if (distToFist < fistRadius + e.radius) {
                // Kill Enemy
                createExplosion(e.x, e.y, CONFIG.colors.enemy);
                enemies.splice(i, 1);
                spawnEnemy(); // Respawn immediately
                continue;
            }
        }
        
        // Collision with Body (Push back, no damage - Immortal)
        const distToBody = Math.hypot(e.x - hero.x, e.y - hero.y);
        if (distToBody < hero.radius + e.radius) {
            const pushAngle = Math.atan2(e.y - hero.y, e.x - hero.x);
            e.x += Math.cos(pushAngle) * 5;
            e.y += Math.sin(pushAngle) * 5;
        }
    }
    
    // Maintain Enemy Count
    if (Math.random() < dt * 0.5) spawnEnemy();
    
    // Gold
    for (let i = golds.length - 1; i >= 0; i--) {
        let g = golds[i];
        const d = Math.hypot(g.x - hero.x, g.y - hero.y);
        if (d < hero.radius + g.radius + 20) { // Magnet range
            g.x += (hero.x - g.x) * 5 * dt;
            g.y += (hero.y - g.y) * 5 * dt;
        }
        if (d < hero.radius + g.radius) {
            score += 10;
            createExplosion(g.x, g.y, CONFIG.colors.gold, 5);
            playSfx('coin');
            if (score > 0 && score % 50 === 40) playSfx('alert');
            vibrate('light');
            updateUI();
            golds.splice(i, 1);
            spawnGold();
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Shake decay
    if (shakeIntensity > 0) shakeIntensity *= 0.9;
    if (shakeIntensity < 0.5) shakeIntensity = 0;
}

function createExplosion(x, y, color, count=15) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 100 + Math.random() * 200;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.3,
            color: color,
            size: 3 + Math.random() * 5
        });
    }
}

function updateUI() {
    document.getElementById('score-val').innerText = score;
}

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

// --- §5 Rendering ---

function draw() {
    // Clear
    const seaGradient = ctx.createLinearGradient(0, 0, 0, ch);
    seaGradient.addColorStop(0, CONFIG.colors.deepWater);
    seaGradient.addColorStop(0.4, '#0f2940');
    seaGradient.addColorStop(1, CONFIG.colors.sand);
    ctx.fillStyle = seaGradient;
    ctx.fillRect(0, 0, cw, ch);
    
    const shoreGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.78, 40, cw * 0.5, ch * 0.78, cw * 0.65);
    shoreGlow.addColorStop(0, 'rgba(255, 216, 95, 0.18)');
    shoreGlow.addColorStop(1, 'rgba(255, 216, 95, 0)');
    ctx.fillStyle = shoreGlow;
    ctx.fillRect(0, 0, cw, ch);
    
    // Shake
    let shakeX = 0, shakeY = 0;
    if (shakeIntensity > 0) {
        shakeX = (Math.random() - 0.5) * shakeIntensity;
        shakeY = (Math.random() - 0.5) * shakeIntensity;
    }
    
    ctx.save();
    ctx.translate(shakeX, shakeY);
    
    // Background Caustics and shoreline bands
    ctx.strokeStyle = CONFIG.colors.water;
    ctx.lineWidth = 2;
    const time = Date.now() * 0.001;
    for(let i=0; i<10; i++) {
        const y = (i * 100 + time * 20) % (ch + 100) - 50;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for(let x=0; x<=cw; x+=50) {
            ctx.lineTo(x, y + Math.sin(x * 0.01 + time) * 20);
        }
        ctx.stroke();
    }

    for (let i = 0; i < 4; i++) {
        const bandY = ch * (0.72 + i * 0.08);
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 243, 206, 0.1)' : 'rgba(255, 214, 140, 0.08)';
        ctx.fillRect(0, bandY, cw, ch * 0.06);
    }

    // Draw Gold
    golds.forEach(g => {
        ctx.fillStyle = CONFIG.colors.gold;
        ctx.shadowColor = '#FFAA00';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Shine
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(g.x - 4, g.y - 4, 3, 0, Math.PI*2);
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(255, 244, 189, 0.65)';
        ctx.beginPath();
        ctx.moveTo(g.x - 8, g.y);
        ctx.lineTo(g.x + 8, g.y);
        ctx.moveTo(g.x, g.y - 8);
        ctx.lineTo(g.x, g.y + 8);
        ctx.stroke();
    });

    // Draw Enemies
    enemies.forEach(e => {
        ctx.shadowColor = CONFIG.colors.enemyGlow;
        ctx.shadowBlur = 8;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        // Spiky body
        for(let i=0; i<8; i++) {
            const angle = (i / 8) * Math.PI * 2 + time * 2;
            const r = i % 2 === 0 ? e.radius : e.radius * 0.6;
            const px = e.x + Math.cos(angle) * r;
            const py = e.y + Math.sin(angle) * r;
            if (i===0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.strokeStyle = 'rgba(6, 32, 26, 0.55)';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Eye
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(e.x, e.y - 5, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(e.x, e.y - 5, 2, 0, Math.PI*2);
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.moveTo(e.x - 5, e.y + e.radius * 0.5);
        ctx.lineTo(e.x + 6, e.y + e.radius * 0.2);
        ctx.stroke();
    });

    // Draw Hero
    if (hero) {
        const ax = Math.cos(hero.elbowAngle);
        const ay = Math.sin(hero.elbowAngle);
        const shellPulse = 1 + Math.sin(time * 5) * 0.04;
        
        // Legs
        ctx.strokeStyle = CONFIG.colors.heroDark;
        ctx.lineWidth = 4;
        const legOffset = Math.sin(time * 15) * 5;
        for(let i=-1; i<=1; i+=2) {
            ctx.beginPath();
            ctx.moveTo(hero.x + i*10, hero.y + 2);
            ctx.lineTo(hero.x + i*28, hero.y + 15 + legOffset * i);
            ctx.stroke();
        }

        // Arm (The Elbow)
        ctx.fillStyle = CONFIG.colors.shell;
        ctx.beginPath();
        ctx.arc(hero.x + ax * 15, hero.y + ay * 15, 13, 0, Math.PI*2);
        ctx.fill();
        
        // Forearm
        const forearmLen = 20 + hero.elbowExt * 0.5;
        const fx = hero.x + ax * (25 + forearmLen);
        const fy = hero.y + ay * (25 + forearmLen);
        
        ctx.strokeStyle = CONFIG.colors.hero;
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(hero.x + ax * 15, hero.y + ay * 15);
        ctx.lineTo(fx, fy);
        ctx.stroke();
        
        // Fist
        const fistX = hero.x + ax * (30 + hero.elbowExt);
        const fistY = hero.y + ay * (30 + hero.elbowExt);
        ctx.fillStyle = CONFIG.colors.coralDark;
        ctx.shadowColor = 'rgba(255, 122, 92, 0.45)';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(fistX, fistY, 20, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Body
        ctx.fillStyle = CONFIG.colors.hero;
        ctx.beginPath();
        ctx.ellipse(hero.x, hero.y, hero.radius * shellPulse, hero.radius * 0.84 * shellPulse, 0, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = CONFIG.colors.shell;
        ctx.beginPath();
        ctx.ellipse(hero.x, hero.y + 1, hero.radius * 0.68, hero.radius * 0.5, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Crest + claws silhouette
        ctx.strokeStyle = 'rgba(255, 214, 196, 0.95)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(hero.x - 10, hero.y - 2);
        ctx.lineTo(hero.x + 10, hero.y - 2);
        ctx.moveTo(hero.x - 4, hero.y + 4);
        ctx.lineTo(hero.x + 4, hero.y + 4);
        ctx.stroke();
        
        // Eyes
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(hero.x - 8, hero.y - 8, 6, 0, Math.PI*2);
        ctx.arc(hero.x + 8, hero.y - 8, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(hero.x - 8 + ax*2, hero.y - 8 + ay*2, 2, 0, Math.PI*2);
        ctx.arc(hero.x + 8 + ax*2, hero.y - 8 + ay*2, 2, 0, Math.PI*2);
        ctx.fill();
        
        // Crown bubbles
        ctx.fillStyle = 'rgba(223,252,255,0.45)';
        ctx.beginPath();
        ctx.arc(hero.x - 14, hero.y - 20, 3, 0, Math.PI*2);
        ctx.arc(hero.x + 14, hero.y - 18, 2.5, 0, Math.PI*2);
        ctx.fill();
        
        // Immortal Text
        ctx.fillStyle = 'rgba(223,252,255,0.7)';
        ctx.font = '600 10px "Exo 2"';
        ctx.textAlign = 'center';
        ctx.fillText('ON DUTY', hero.x, hero.y + 34);
    }

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    // Joystick
    if (joystick.active) {
        ctx.strokeStyle = 'rgba(223,252,255,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(joystick.originX, joystick.originY, 60, 0, Math.PI*2);
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(255, 122, 92, 0.35)';
        ctx.beginPath();
        ctx.arc(joystick.originX, joystick.originY, 60, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(255, 216, 95, 0.65)';
        ctx.beginPath();
        ctx.arc(joystick.currX, joystick.currY, 25, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Loop Error:", e);
    }

    requestAnimationFrame(gameLoop);
}

</script>
