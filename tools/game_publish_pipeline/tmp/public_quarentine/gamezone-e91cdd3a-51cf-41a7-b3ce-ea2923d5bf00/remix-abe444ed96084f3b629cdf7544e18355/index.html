<html lang="en">

<style>
    :root {
        --font-title: 'Cinzel', Georgia, serif;
        --font-ui: 'Rajdhani', Arial, sans-serif;
        --font-dialogue: 'VT323', 'Courier New', monospace;
        --bg-top: #07040d;
        --bg-bottom: #160815;
        --mist: rgba(209, 96, 255, 0.1);
        --signal: #7cf1ff;
        --signal-strong: #d593ff;
        --warning: #ff5370;
        --text-main: #f5ecff;
        --text-dim: #bda7d9;
        --panel: rgba(10, 6, 18, 0.72);
        --panel-border: rgba(160, 121, 255, 0.4);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 12%, rgba(124, 241, 255, 0.15), transparent 24%),
            radial-gradient(circle at 50% 120%, rgba(213, 147, 255, 0.14), transparent 30%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text-main);
        font-family: var(--font-ui);
        user-select: none;
        -webkit-user-select: none;
    }
    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    body::before {
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 18%),
            radial-gradient(circle at 80% 15%, rgba(124, 241, 255, 0.08), transparent 16%),
            radial-gradient(circle at 50% 55%, rgba(213, 147, 255, 0.08), transparent 28%);
        mix-blend-mode: screen;
    }
    body::after {
        background:
            repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 5px);
        opacity: 0.28;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; position: relative; z-index: 1; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    #start-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at center, rgba(124, 241, 255, 0.08), transparent 24%),
            linear-gradient(180deg, rgba(4, 2, 12, 0.42), rgba(4, 2, 12, 0.84));
    }
    #start-screen::before,
    #start-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    #start-screen::before {
        background:
            radial-gradient(circle at 50% 24%, rgba(255,255,255,0.08), transparent 12%),
            radial-gradient(circle at 50% 50%, rgba(213, 147, 255, 0.07), transparent 22%);
        animation: fogDrift 10s linear infinite;
    }
    #start-screen::after {
        inset: 10vh 8vw;
        border: 1px solid rgba(190, 165, 255, 0.18);
        border-radius: 28px;
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.04) inset,
            0 0 40px rgba(124, 241, 255, 0.08);
    }
    #ui-title {
        position: absolute;
        top: 15vh;
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(2.9rem, 8vw, 5rem);
        color: #f7f0ff;
        text-shadow:
            0 0 12px rgba(213, 147, 255, 0.5),
            0 0 28px rgba(124, 241, 255, 0.2),
            0 14px 32px rgba(0,0,0,0.55);
        -webkit-text-stroke: 1px rgba(20, 0, 34, 0.72);
        font-family: var(--font-title);
        font-weight: 400;
        letter-spacing: 4px;
    }
    #ui-title span { display: inline-block; animation: breathe 4s infinite ease-in-out; }
    #ui-cta {
        position: absolute;
        bottom: max(9vh, env(safe-area-inset-bottom, 0px) + 18px);
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-family: var(--font-ui);
        font-size: clamp(0.9rem, 3.6vw, 1.2rem);
        color: var(--text-main);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        padding: 0.8rem 1.15rem;
        border: 1px solid rgba(124, 241, 255, 0.4);
        border-radius: 999px;
        background: rgba(6, 8, 18, 0.48);
        box-shadow: 0 0 24px rgba(124, 241, 255, 0.12), inset 0 0 24px rgba(213, 147, 255, 0.08);
        backdrop-filter: blur(4px);
        min-width: min(78vw, 320px);
        max-width: calc(100vw - 32px);
        cursor: pointer;
        pointer-events: auto;
    }
    #ui-cta span { display: inline-block; animation: pulse 2s infinite; }
    @keyframes breathe {
        0%, 100% { opacity: 0.84; transform: scale(1) translateY(0); }
        50% { opacity: 1; transform: scale(0.975) translateY(4px); }
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.72; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes fogDrift {
        0% { transform: translateY(0); opacity: 0.42; }
        50% { transform: translateY(-1.25vh); opacity: 0.62; }
        100% { transform: translateY(0); opacity: 0.42; }
    }
    #feedback-gif {
        position: absolute;
        right: 4vw;
        bottom: 4vh;
        width: min(32vw, 170px);
        aspect-ratio: 1 / 1;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(124, 241, 255, 0.35);
        background: rgba(9, 7, 18, 0.48);
        box-shadow: 0 0 28px rgba(124, 241, 255, 0.12);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    #feedback-gif img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0.88;
    }
    .hidden { display: none !important; }
</style>
</head>

}
</script>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none bg-black">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="start-screen">
            <h1 id="ui-title"><span>ETERNAL WAKE</span></h1>
            <!-- [agent-note][stage4] repaired: mobile-actionability | element: #ui-cta | action: semantic button + safe-area spacing -->
            <button id="ui-cta" type="button" aria-label="Tap to begin"><span>[ TAP TO BEGIN ]</span></button>
        </div>
        <div id="feedback-gif" class="hidden" aria-hidden="true"></div>

<script>
// --- Core Engine & State ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height, dpr;
let lastTime = 0;
let time = 0;
let frameCount = 0;

// Config
window.gameConfigDefs = {
    "textSpeed": { "type": "number", "label": "Text Speed", "value": 1, "min": 0.5, "max": 2 },
    "shakeIntensity": { "type": "number", "label": "Shake Intensity", "value": 10, "min": 0, "max": 30 }
};
window.gameConfig = { textSpeed: 1, shakeIntensity: 10 };
window.updateGameConfig = (k, v) => { if(window.gameConfig[k] !== undefined) window.gameConfig[k] = v; };

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioState = {
    unlocked: false,
    lastUiAt: 0
};
const feedbackGif = document.getElementById('feedback-gif');
const feedbackMedia = {
    phoneAlert: document.getElementById('gif_phone_alert'),
    jumpscare: document.getElementById('gif_jumpscare')
};
const sounds = {
    bgm: document.getElementById('bgm_main'),
    start: document.getElementById('sfx_start'),
    ui: document.getElementById('sfx_ui'),
    warning: document.getElementById('sfx_warning'),
    scare: document.getElementById('sfx_scare'),
    shot: document.getElementById('sfx_shot'),
    end: document.getElementById('sfx_end')
};

function unlockAudio() {
    if (audioState.unlocked) return;
    audioState.unlocked = true;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    Object.values(sounds).forEach((audio) => {
        if (!audio) return;
        audio.volume = audio === sounds.bgm ? 0.2 : 0.48;
        audio.load?.();
    });
}

function playSound(audio, { reset = true } = {}) {
    if (!audioState.unlocked || !audio) return;
    try {
        if (reset) audio.currentTime = 0;
        audio.play().catch(() => {});
    } catch (_) {}
}

function syncBgmForState() {
    if (!audioState.unlocked || !sounds.bgm) return;
    const shouldPlay = currentState !== SCENES.START && currentState !== SCENES.END;
    try {
        if (shouldPlay) sounds.bgm.play().catch(() => {});
        else sounds.bgm.pause();
    } catch (_) {}
}

function showGif(kind, duration = 1600) {
    const img = feedbackMedia[kind];
    if (!img || !feedbackGif) return;
    feedbackGif.innerHTML = '';
    feedbackGif.appendChild(img.cloneNode(true));
    feedbackGif.classList.remove('hidden');
    clearTimeout(showGif.hideTimer);
    showGif.hideTimer = setTimeout(() => feedbackGif.classList.add('hidden'), duration);
}

// Game State
const SCENES = {
    START: 0,
    BED_1: 1,
    PHONE_TEXT: 2,
    PHONE_TRANS: 3,
    WINDOW: 4,
    JUMPSCARE: 5,
    HEAVEN: 6,
    FALL: 7,
    BED_2: 8,
    DIALOGUE: 9,
    GUN_AIM: 10,
    SHOT: 11,
    END: 12
};

let currentState = SCENES.START;
let stateTimer = 0;
let shake = 0;
let textType = "";
let textIndex = 0;
let particles = [];
let noiseCanvas;

// Scene Data
const TEXT_CRYPTIC = "(№Æ⁹Ωμ↑∞)";
const TEXT_TRANS = "YOU CAN'T OUTRUN\nTHIS LOOP FOREVER";
const TEXT_DIALOGUE = "I'm done waking up to this.";
const TEXT_END = "RUNNING FROM THE SIGNAL\nONLY FEEDS THE LOOP.";

// --- Initialization ---
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Noise texture
    noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = 256;
    noiseCanvas.height = 256;
    const nCtx = noiseCanvas.getContext('2d');
    const idata = nCtx.createImageData(256, 256);
    for(let i=0; i<idata.data.length; i+=4) {
        const v = Math.random() * 255;
        idata.data[i] = v;
        idata.data[i+1] = v;
        idata.data[i+2] = v;
        idata.data[i+3] = 30; // low alpha
    }
    nCtx.putImageData(idata, 0, 0);

    // Input
    const container = document.getElementById('game-container');
    container.addEventListener('pointerdown', handleInput, { passive: false });
    document.addEventListener('keydown', (e) => {
        if(e.code === 'Space' || e.code === 'Enter') handleInput(e);
    });

    requestAnimationFrame(loop);
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function startGame() {
    if(currentState !== SCENES.START) return;
    
    unlockAudio();
    playSound(sounds.start);
    syncBgmForState();
    
    document.getElementById('start-screen').classList.add('hidden');
    transitionTo(SCENES.BED_1);
}

function handleInput(e) {
    if (e.type !== 'keydown') e.preventDefault();
    unlockAudio();
    
    if (currentState === SCENES.START) {
        startGame();
        return;
    }

    // Interaction Logic
    switch(currentState) {
        case SCENES.BED_1:
            if(stateTimer > 2) transitionTo(SCENES.PHONE_TEXT);
            break;
        case SCENES.PHONE_TEXT:
            if(stateTimer > 1) transitionTo(SCENES.PHONE_TRANS);
            break;
        case SCENES.PHONE_TRANS:
            if(stateTimer > 2) transitionTo(SCENES.WINDOW);
            break;
        case SCENES.WINDOW:
            if(stateTimer > 3) transitionTo(SCENES.JUMPSCARE);
            break;
        case SCENES.BED_2:
            if(stateTimer > 2) transitionTo(SCENES.DIALOGUE);
            break;
        case SCENES.DIALOGUE:
            if(textIndex >= TEXT_DIALOGUE.length) transitionTo(SCENES.GUN_AIM);
            else textIndex = TEXT_DIALOGUE.length; // speed up
            break;
        case SCENES.GUN_AIM:
            transitionTo(SCENES.SHOT);
            break;
        case SCENES.END:
            // Restart
            window.location.reload();
            break;
    }
    
    // Feedback
    if (performance.now() - audioState.lastUiAt > 120) {
        playSound(sounds.ui);
        audioState.lastUiAt = performance.now();
    }
    createParticles(e.clientX || width/2, e.clientY || height/2, 5, '#fff');
}

function transitionTo(newState) {
    currentState = newState;
    stateTimer = 0;
    textIndex = 0;
    syncBgmForState();
    
    if (newState === SCENES.PHONE_TEXT || newState === SCENES.PHONE_TRANS) {
        playSound(sounds.warning);
        showGif('phoneAlert', 1400);
    }
    if (newState === SCENES.JUMPSCARE) {
        shake = 30;
        playSound(sounds.scare);
        showGif('jumpscare', 1500);
        setTimeout(() => transitionTo(SCENES.HEAVEN), 1500);
    }
    if (newState === SCENES.HEAVEN) {
        setTimeout(() => transitionTo(SCENES.FALL), 4000);
    }
    if (newState === SCENES.FALL) {
        setTimeout(() => transitionTo(SCENES.BED_2), 2000);
    }
    if (newState === SCENES.SHOT) {
        shake = 50;
        playSound(sounds.shot);
        createParticles(width/2, height/2, 50, '#ffaa00');
        setTimeout(() => transitionTo(SCENES.END), 1000);
    }
    if (newState === SCENES.END) {
        playSound(sounds.end);
        if (feedbackGif) feedbackGif.classList.add('hidden');
    }
}

// --- Rendering & Logic ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;
    stateTimer += dt;

    update(dt);
    render();
    
    requestAnimationFrame(loop);
}

function update(dt) {
    // Shake decay
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Text typing
    let targetText = "";
    if (currentState === SCENES.PHONE_TEXT) targetText = TEXT_CRYPTIC;
    if (currentState === SCENES.PHONE_TRANS) targetText = TEXT_TRANS;
    if (currentState === SCENES.DIALOGUE) targetText = TEXT_DIALOGUE;
    if (currentState === SCENES.END) targetText = TEXT_END;

    if (targetText) {
        if (textIndex < targetText.length) {
            textIndex += dt * 10 * window.gameConfig.textSpeed;
        }
    }
}

function render() {
    // Clear
    ctx.fillStyle = currentState === SCENES.HEAVEN ? '#fff' : '#050505';
    ctx.fillRect(0, 0, width, height);

    // Shake transform
    const sx = (Math.random() - 0.5) * shake * window.gameConfig.shakeIntensity * 0.1;
    const sy = (Math.random() - 0.5) * shake * window.gameConfig.shakeIntensity * 0.1;
    ctx.save();
    ctx.translate(sx, sy);

    // Scene Rendering
    switch(currentState) {
        case SCENES.START:
            drawStaticBackground();
            // Start screen is HTML overlay, but we draw something behind
            drawBed(0.3);
            break;
        case SCENES.BED_1:
        case SCENES.BED_2:
            drawBed(1);
            if (currentState === SCENES.BED_1 && stateTimer > 1) drawPhoneNotification();
            if (currentState === SCENES.BED_2 && stateTimer > 1) drawPhoneNotification();
            break;
        case SCENES.PHONE_TEXT:
        case SCENES.PHONE_TRANS:
            drawPhoneCloseUp();
            break;
        case SCENES.WINDOW:
            drawWindowView();
            break;
        case SCENES.JUMPSCARE:
            drawJumpscare();
            break;
        case SCENES.HEAVEN:
            drawHeaven();
            break;
        case SCENES.FALL:
            drawFall();
            break;
        case SCENES.DIALOGUE:
            drawBed(0.5);
            drawDialogue();
            break;
        case SCENES.GUN_AIM:
            drawBed(0.5);
            drawGunAim();
            break;
        case SCENES.SHOT:
            ctx.fillStyle = '#fff';
            ctx.fillRect(0,0,width,height);
            break;
        case SCENES.END:
            drawEnd();
            break;
    }

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Noise Overlay
    ctx.globalCompositeOperation = 'overlay';
    const pattern = ctx.createPattern(noiseCanvas, 'repeat');
    ctx.fillStyle = pattern;
    ctx.save();
    ctx.translate(Math.random()*100, Math.random()*100);
    ctx.fillRect(-100, -100, width+200, height+200);
    ctx.restore();
    
    // Vignette
    ctx.globalCompositeOperation = 'multiply';
    const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,width,height);

    ctx.restore();
}

// --- Draw Functions ---

function applyPanelText(style = 'ui') {
    if (style === 'dialogue') {
        ctx.font = `${Math.max(20, Math.min(32, width * 0.06))}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-dialogue').trim()}`;
        return;
    }
    if (style === 'cta') {
        ctx.font = `700 ${Math.max(14, Math.min(20, width * 0.04))}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-ui').trim()}`;
        return;
    }
    ctx.font = `700 ${Math.max(16, Math.min(24, width * 0.045))}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-ui').trim()}`;
}

function drawSignalOrb(x, y, radius, hueShift = 0, alpha = 1) {
    const glow = ctx.createRadialGradient(x, y, radius * 0.2, x, y, radius);
    glow.addColorStop(0, `rgba(${124 + hueShift}, ${220 - hueShift}, 255, ${0.85 * alpha})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
}

function drawBed(opacity) {
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, `rgba(14, 8, 28, ${0.7 * opacity})`);
    sky.addColorStop(1, `rgba(5, 4, 8, ${0.95 * opacity})`);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    drawSignalOrb(width * 0.5, height * 0.2, width * 0.16, 10, 0.45 * opacity);

    ctx.fillStyle = `rgba(18, 16, 28, ${0.82 * opacity})`;
    ctx.beginPath();
    ctx.moveTo(0, height);
    ctx.lineTo(width * 0.18, height * 0.58);
    ctx.lineTo(width * 0.82, height * 0.58);
    ctx.lineTo(width, height);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = `rgba(124, 241, 255, ${0.24 * opacity})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, height);
    ctx.lineTo(width * 0.2, height * 0.6);
    ctx.lineTo(width * 0.8, height * 0.6);
    ctx.lineTo(width, height);
    ctx.stroke();

    ctx.strokeStyle = `rgba(213, 147, 255, ${0.3 * opacity})`;
    ctx.beginPath();
    ctx.moveTo(width * 0.3, height);
    ctx.bezierCurveTo(width*0.4, height*0.8, width*0.6, height*0.8, width*0.7, height);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255,255,255,${0.08 * opacity})`;
    for (let i = 0; i < 5; i++) {
        const y = height * (0.66 + i * 0.05);
        ctx.beginPath();
        ctx.moveTo(width * 0.2, y);
        ctx.quadraticCurveTo(width * (0.35 + i * 0.05), y - 12, width * 0.8, y);
        ctx.stroke();
    }
}

function drawPhoneNotification() {
    const x = width/2 - 34;
    const y = height * 0.68;
    const g = Math.sin(time * 10) * 0.5 + 0.5;
    ctx.shadowBlur = 24;
    ctx.shadowColor = `rgba(124, 241, 255, ${0.6 + g * 0.4})`;
    ctx.fillStyle = '#080910';
    ctx.fillRect(x, y, 68, 112);
    const screenGlow = ctx.createLinearGradient(x + 6, y + 6, x + 62, y + 106);
    screenGlow.addColorStop(0, '#f4f6ff');
    screenGlow.addColorStop(0.55, '#c9f7ff');
    screenGlow.addColorStop(1, '#f2ccff');
    ctx.fillStyle = screenGlow;
    ctx.fillRect(x+6, y+6, 56, 100);
    ctx.fillStyle = `rgba(18, 12, 32, ${0.7 + g * 0.2})`;
    ctx.fillRect(x + 14, y + 18, 40, 8);
    ctx.fillRect(x + 14, y + 34, 28, 6);
    ctx.fillRect(x + 14, y + 46, 34, 6);
    ctx.shadowBlur = 0;
}

function drawPhoneCloseUp() {
    ctx.fillStyle = '#111';
    ctx.fillRect(width*0.1, height*0.1, width*0.8, height*0.8);
    // Screen
    ctx.fillStyle = '#eef';
    ctx.fillRect(width*0.15, height*0.15, width*0.7, height*0.7);
    
    // Text
    ctx.fillStyle = '#08121c';
    applyPanelText('ui');
    ctx.textAlign = 'center';
    
    let txt = currentState === SCENES.PHONE_TEXT ? TEXT_CRYPTIC : TEXT_TRANS;
    let showTxt = txt.substring(0, Math.floor(textIndex));
    
    const lines = showTxt.split('\n');
    lines.forEach((line, i) => {
        ctx.fillText(line, width/2, height*0.4 + i * 30);
    });
    
    // Hint
    ctx.fillStyle = '#6d5d89';
    applyPanelText('cta');
    ctx.fillText(currentState === SCENES.PHONE_TEXT ? "[ TAP TO DECODE ]" : "[ TAP TO LOOK OUT ]", width/2, height*0.75);
}

function drawWindowView() {
    ctx.fillStyle = '#06070c';
    ctx.fillRect(0,0,width,height);
    const padding = Math.max(28, width * 0.08);
    const sky = ctx.createLinearGradient(0, padding, 0, height - padding);
    sky.addColorStop(0, '#1a1531');
    sky.addColorStop(0.55, '#15182f');
    sky.addColorStop(1, '#080910');
    ctx.fillStyle = sky;
    ctx.fillRect(padding, padding, width-padding*2, height-padding*2);

    drawSignalOrb(width * 0.34, height * 0.34, width * 0.12, 0, 0.34);

    ctx.fillStyle = 'rgba(245, 244, 255, 0.92)';
    for(let i=0; i<3; i++) {
        const floatY = Math.sin(time * 2 + i) * 20;
        const fx = width * (0.3 + i*0.2);
        const fy = height * 0.6 + floatY;
        ctx.beginPath();
        ctx.arc(fx, fy - 22, 15, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(fx - 16, fy - 10);
        ctx.quadraticCurveTo(fx, fy + 54, fx + 16, fy - 10);
        ctx.closePath();
        ctx.fill();
        drawSignalOrb(fx, fy + 8, 30, 25, 0.2);
    }

    ctx.strokeStyle = 'rgba(12, 7, 18, 0.92)';
    ctx.lineWidth = 20;
    ctx.strokeRect(padding, padding, width-padding*2, height-padding*2);
    ctx.strokeStyle = 'rgba(168, 140, 255, 0.18)';
    ctx.lineWidth = 2;
    ctx.strokeRect(padding + 10, padding + 10, width-padding*2-20, height-padding*2-20);
    ctx.beginPath();
    ctx.moveTo(width/2, padding);
    ctx.lineTo(width/2, height-padding);
    ctx.strokeStyle = 'rgba(8, 7, 14, 0.92)';
    ctx.lineWidth = 18;
    ctx.stroke();
}

function drawJumpscare() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,width,height);
    
    // Flash
    if (Math.random() > 0.5) {
        const img = document.getElementById('asset_monster');
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, 0, 0, width, height);
        } else {
            // Procedural Face
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(width/2, height/2, width*0.4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(width/2 - 50, height/2 - 20, 30, 0, Math.PI*2); // Eye L
            ctx.arc(width/2 + 50, height/2 - 20, 30, 0, Math.PI*2); // Eye R
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(width/2, height/2 + 80, 40, 80, 0, 0, Math.PI*2); // Mouth
            ctx.fill();
        }
    }
}

function drawHeaven() {
    const t = stateTimer;
    // Clouds
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,width,height);
    
    ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
    for(let i=0; i<5; i++) {
        ctx.beginPath();
        ctx.arc(width/2 + (i-2)*100, height/2 + Math.sin(time+i)*50, 100 + t*50, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Gates
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 5;
    const scale = 1 + t * 0.5;
    ctx.save();
    ctx.translate(width/2, height/2);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.moveTo(-100, 200);
    ctx.lineTo(-100, -100);
    ctx.arc(0, -100, 100, Math.PI, 0);
    ctx.lineTo(100, 200);
    ctx.stroke();
    
    // Bars
    for(let i=-80; i<=80; i+=20) {
        ctx.beginPath();
        ctx.moveTo(i, -100);
        ctx.lineTo(i, 200);
        ctx.stroke();
    }
    ctx.restore();
}

function drawFall() {
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0,0,width,height);
    // Speed lines
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    for(let i=0; i<20; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const l = Math.random() * 100;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - l);
        ctx.stroke();
    }
    // Clouds parting
    const gap = stateTimer * 200;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(width/2 - 300 - gap, height/2, 400, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(width/2 + 300 + gap, height/2, 400, 0, Math.PI*2);
    ctx.fill();
}

function drawDialogue() {
    // Text Box
    const panelY = height * 0.6;
    ctx.fillStyle = 'rgba(8, 6, 18, 0.84)';
    ctx.fillRect(20, panelY, width-40, height*0.3);
    ctx.strokeStyle = 'rgba(124, 241, 255, 0.45)';
    ctx.strokeRect(20, panelY, width-40, height*0.3);
    ctx.fillStyle = 'rgba(213, 147, 255, 0.12)';
    ctx.fillRect(28, panelY + 8, width - 56, 18);

    ctx.fillStyle = '#f6edff';
    applyPanelText('dialogue');
    ctx.textAlign = 'left';
    ctx.fillText(TEXT_DIALOGUE.substring(0, Math.floor(textIndex)), 40, height*0.75);
}

function drawGunAim() {
    // Phone on bed
    drawPhoneNotification();
    
    // Gun Hand
    ctx.fillStyle = '#333';
    ctx.save();
    ctx.translate(width*0.7, height);
    ctx.rotate(-0.2);
    ctx.fillRect(-50, -300, 100, 300); // Arm
    ctx.fillStyle = '#111';
    ctx.fillRect(-60, -350, 120, 100); // Gun Body
    ctx.fillRect(-20, -450, 40, 100); // Barrel
    ctx.restore();
    
    // Crosshair
    ctx.strokeStyle = '#f00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(width/2, height*0.75, 20, 0, Math.PI*2);
    ctx.moveTo(width/2 - 30, height*0.75);
    ctx.lineTo(width/2 + 30, height*0.75);
    ctx.moveTo(width/2, height*0.75 - 30);
    ctx.lineTo(width/2, height*0.75 + 30);
    ctx.stroke();
    
    ctx.fillStyle = '#ff5d79';
    ctx.textAlign = 'center';
    applyPanelText('cta');
    ctx.fillText("[ TAP TO BREAK THE LOOP ]", width/2, height*0.9);
}

function drawEnd() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,width,height);
    
    ctx.fillStyle = '#fff';
    applyPanelText('dialogue');
    ctx.textAlign = 'center';
    const lines = TEXT_END.split('\n');
    const alpha = Math.min(1, stateTimer * 0.5);
    ctx.globalAlpha = alpha;
    lines.forEach((line, i) => {
        ctx.fillText(line, width/2, height/2 + i * 30);
    });
    ctx.globalAlpha = 1;
}

function drawStaticBackground() {
    // Just the noise overlay handles this mostly, but let's add some dark shapes
    ctx.fillStyle = '#080808';
    ctx.fillRect(0,0,width,height);
}

function createParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 3
        });
    }
}

// Start
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
