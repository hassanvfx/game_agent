<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Terra Invicta: Tactical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        /* Base & Touch */
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        :root {
            --bg-deep: #020611;
            --bg-grid: rgba(0, 240, 255, 0.1);
            --panel-bg: rgba(3, 18, 36, 0.82);
            --panel-border: rgba(110, 233, 255, 0.82);
            --panel-glow: rgba(79, 235, 255, 0.26);
            --accent-cyan: #67f4ff;
            --accent-gold: #ffd166;
            --accent-red: #ff6b8c;
            --accent-green: #68ff9b;
            --text-main: #eafcff;
            --text-dim: #95b8c4;
            --hero-shadow: rgba(0, 0, 0, 0.5);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background:
                radial-gradient(circle at 50% 15%, rgba(60, 131, 255, 0.16), transparent 30%),
                radial-gradient(circle at 50% 120%, rgba(0, 240, 255, 0.14), transparent 35%),
                linear-gradient(180deg, #040812 0%, #000 100%);
            color: var(--accent-cyan); 
            touch-action: auto;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .font-display {
            font-family: 'Russo One', system-ui, sans-serif;
        }

        .font-mono {
            font-family: 'Press Start 2P', 'Courier New', monospace;
        }

        .font-ui {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .app-root,
        .absolute,
        .relative { position: relative; }

        .absolute { position: absolute; }
        .fixed { position: fixed; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .top-2 { top: 0.5rem; }
        .right-4 { right: 1rem; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .hidden { display: none !important; }
        .block { display: block; }
        .flex { display: flex; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: 1fr; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .h-4 { height: 1rem; }
        .w-12 { width: 3rem; }
        .h-12 { height: 3rem; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .max-w-xs { max-width: 20rem; }
        .max-w-sm { max-width: 24rem; }
        .max-w-md { max-width: 28rem; }
        .max-w-\[140px\] { max-width: 140px; }
        .max-w-\[140px\], .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .max-h-\[80vh\] { max-height: 80vh; }
        .min-h-\[1\.5rem\] { min-height: 1.5rem; }
        .flex-1 { flex: 1; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .overflow-y-auto { overflow-y: auto; }
        .overflow-hidden { overflow: hidden; }
        .rounded-sm { border-radius: 0.125rem; }
        .rounded-full { border-radius: 9999px; }
        .border { border: 1px solid; }
        .border-1 { border-width: 1px; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-4 { border-width: 4px; border-style: solid; }
        .border-cyber { border-color: #00f0ff; }
        .border-yellow-500 { border-color: #eab308; }
        .border-gray-700 { border-color: #374151; }
        .border-gray-800 { border-color: #1f2937; }
        .border-t-cyber { border-top-color: #00f0ff; }
        .border-b { border-bottom: 1px solid #00f0ff; }
        .bg-black { background: #000; }
        .bg-dark { background: #050510; }
        .bg-gray-800 { background: #1f2937; }
        .bg-black\/80 { background: rgba(0, 0, 0, 0.8); }
        .bg-black\/90 { background: rgba(0, 0, 0, 0.9); }
        .bg-gray-900\/50 { background: rgba(17, 24, 39, 0.5); }
        .text-white { color: #fff; }
        .text-cyber { color: #00f0ff; }
        .text-yellow-300 { color: #fde047; }
        .text-yellow-400 { color: #facc15; }
        .text-yellow-500 { color: #eab308; }
        .text-green-400 { color: #4ade80; }
        .text-red-400 { color: #f87171; }
        .text-red-500 { color: #ef4444; }
        .text-red-600 { color: #dc2626; }
        .text-orange-400 { color: #fb923c; }
        .text-gray-400 { color: #9ca3af; }
        .text-gray-500 { color: #6b7280; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-5xl { font-size: 3rem; }
        .text-6xl { font-size: 3.75rem; }
        .text-xl { font-size: 1.25rem; }
        .text-lg { font-size: 1.125rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-\[10px\] { font-size: 10px; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .tracking-widest { letter-spacing: 0.25em; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-\[0\.2em\] { letter-spacing: 0.2em; }
        .drop-shadow-\[0_0_10px_rgba\(0\,240\,255\,0\.8\)\] { text-shadow: 0 0 10px rgba(0,240,255,0.8); }
        .shadow-\[0_0_15px_rgba\(0\,255\,0\,0\.3\)\] { box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .drop-shadow-md { text-shadow: 0 0 8px rgba(0, 0, 0, 0.9); }
        .opacity-0 { opacity: 0; }
        .transition-opacity { transition-property: opacity; }
        .duration-500 { transition-duration: 0.5s; }
        .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        .backdrop-blur-sm { backdrop-filter: blur(4px); }
        .backdrop-blur-md { backdrop-filter: blur(12px); }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .pt-16 { padding-top: 4rem; }
        .pb-1 { padding-bottom: 0.25rem; }
        .pb-8 { padding-bottom: 2rem; }
        .pb-16 { padding-bottom: 4rem; }
        .pr-2 { padding-right: 0.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .gap-1 { gap: 0.25rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-5 { padding-top: 1.25rem; padding-bottom: 1.25rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* UI Styling - Cyber Theme */
        .glass {
            background:
                linear-gradient(180deg, rgba(7, 28, 50, 0.92), rgba(3, 12, 26, 0.88)),
                radial-gradient(circle at top left, rgba(103, 244, 255, 0.1), transparent 40%);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 18px var(--panel-glow),
                0 12px 28px rgba(0, 0, 0, 0.34);
            color: var(--accent-cyan);
        }

        .btn {
            position: relative;
            overflow: hidden;
            transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border: 1px solid var(--panel-border);
            background: linear-gradient(180deg, rgba(18, 63, 87, 0.42), rgba(2, 27, 41, 0.5));
            color: var(--text-main);
            box-shadow: 0 0 0 1px rgba(103, 244, 255, 0.08) inset, 0 0 10px rgba(0, 240, 255, 0.14);
            text-shadow: 0 0 8px var(--hero-shadow);
        }
        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.16) 50%, transparent 100%);
            transform: translateX(-120%);
            transition: transform 0.18s ease;
        }
        .btn:active { transform: scale(0.96); background: rgba(0, 240, 255, 0.3); }
        .btn:hover::after,
        .btn:focus-visible::after { transform: translateX(120%); }
        .btn:disabled { opacity: 0.4; border-color: #555; color: #555; pointer-events: none; }

        /* Custom Colors for Buttons */
        .btn-green { border-color: var(--accent-green); color: var(--accent-green); background: rgba(21, 104, 60, 0.2); }
        .btn-red { border-color: var(--accent-red); color: #ff8ea8; background: rgba(120, 17, 55, 0.24); }
        .btn-gold { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(122, 81, 15, 0.22); }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.18)),
                linear-gradient(to right, transparent, rgba(103, 244, 255, 0.03), transparent);
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
        }

        /* Float Text */
        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        /* Flag Box */
        .flag-box {
            width: 40px;
            height: 24px;
            border: 1px solid #fff;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255,255,255,0.18);
        }

        #game-root::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(103, 244, 255, 0.12), transparent 35%),
                linear-gradient(90deg, transparent 0%, rgba(103, 244, 255, 0.04) 45%, rgba(255, 209, 102, 0.04) 55%, transparent 100%);
            z-index: 1;
        }

        #worldCanvas,
        #loading-screen,
        #menu-overlay,
        #game-ui,
        #modal-overlay,
        #transform-overlay,
        #game-over {
            position: relative;
            z-index: 2;
        }

        #worldCanvas {
            filter: saturate(1.1) contrast(1.08);
        }

        #hud-country,
        #modal-title,
        #go-title,
        #selected-country-name {
            text-shadow: 0 0 14px rgba(103, 244, 255, 0.24);
        }

        #action-feedback,
        #modal-msg {
            letter-spacing: 0.08em;
        }

        #reaction-layer {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 4.5rem 0.75rem 8rem;
        }

        .reaction-card {
            width: min(34vw, 132px);
            min-width: 88px;
            border: 1px solid rgba(255, 209, 102, 0.75);
            background: rgba(2, 8, 20, 0.82);
            box-shadow: 0 0 18px rgba(103, 244, 255, 0.22);
            border-radius: 0.35rem;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .reaction-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .reaction-gif {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.45);
        }

        .reaction-label {
            padding: 0.35rem 0.45rem 0.4rem;
            font-size: 0.65rem;
            text-align: center;
            color: var(--accent-gold);
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            #reaction-layer {
                justify-content: center;
                align-items: flex-end;
                padding: 0.75rem 0.75rem 7.75rem;
            }

            .reaction-card {
                width: min(42vw, 124px);
            }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <!-- Game Root -->
    <div id="game-root" class="app-root w-full h-full bg-dark">
        
        <canvas id="worldCanvas"></canvas>

        <!-- Loading -->
        <div id="loading-screen" class="absolute inset-0 z-50 bg-black flex flex-col items-center justify-center">
            <div class="w-16 h-16 border-4 border-gray-800 border-t-cyber rounded-full animate-spin mb-4"></div>
            <h2 class="text-cyber text-2xl tracking-[0.2em] animate-pulse font-display">INITIALIZING...</h2>
            <p class="text-gray-500 text-xs mt-2 font-ui">Loading Geo-Tactical Data</p>
        </div>

        <!-- Start Menu -->
        <div id="menu-overlay" class="absolute inset-0 z-40 bg-black/80 flex flex-col justify-between hidden">
            <div class="w-full p-8 text-center pt-16">
                <h1 class="text-5xl font-bold text-white tracking-tighter drop-shadow-[0_0_10px_rgba(0,240,255,0.8)] font-display">TERRA<span class="text-cyber">INVICTA</span></h1>
                <p class="text-gray-400 text-sm mt-2 tracking-widest font-ui">TACTICAL COMMAND INTERFACE</p>
            </div>
            <div class="w-full p-6 pb-16 flex flex-col items-center gap-6">
                <div id="selection-info" class="text-center opacity-0 transition-opacity duration-500">
                    <div class="text-gray-500 text-xs uppercase mb-1">Target Nation</div>
                    <div id="selected-country-name" class="text-3xl font-bold text-white font-mono border-b border-cyber pb-1">---</div>
                </div>
                <button id="btn-play" class="w-full max-w-xs btn py-5 text-xl tracking-widest" disabled>
                    ESTABLISH UPLINK
                </button>
            </div>
        </div>

        <!-- HUD -->
        <div id="game-ui" class="absolute inset-0 pointer-events-none hidden flex flex-col justify-between">
            <!-- Top Stats -->
            <div class="w-full p-2 pointer-events-auto">
                <div class="glass p-3 flex justify-between items-center rounded-sm">
                    <div class="flex items-center">
                        <div id="player-flag" class="flag-box bg-gray-800"></div>
                        <div>
                            <div id="hud-country" class="text-white font-bold text-sm truncate max-w-[140px]">USA</div>
                            <div class="text-[10px] text-cyber">COMMANDER</div>
                        </div>
                    </div>
                    <div class="flex gap-4 text-right">
                        <div>
                            <div class="text-[10px] text-gray-400 uppercase">Manpower</div>
                            <div id="hud-manpower" class="text-yellow-400 font-mono font-bold">10.0k</div>
                        </div>
                        <div>
                            <div class="text-[10px] text-gray-400 uppercase">Army</div>
                            <div id="hud-army" class="text-green-400 font-mono font-bold">5.0k</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="w-full p-4 pb-8 pointer-events-auto flex flex-col gap-3 items-center">
                <div id="action-feedback" class="h-4 text-center text-xs font-bold text-white drop-shadow-md"></div>

                <!-- Transform Button -->
                <button id="btn-open-transform" class="btn btn-gold w-full max-w-md py-2 text-xs tracking-widest mb-1">
                    OPEN TRANSFORMER MENU
                </button>

                <!-- Recruit -->
                <div class="glass p-2 flex items-center gap-3 w-full max-w-md bg-black/90 rounded-sm">
                    <button id="btn-recruit-minus" class="btn btn-red w-12 h-12 text-2xl font-bold">-</button>
                    <div class="flex-1 text-center">
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest">RECRUITMENT</div>
                        <div class="text-white font-mono text-lg font-bold">5,000</div>
                        <div class="text-[10px] text-cyber">Cost: 5k MP</div>
                    </div>
                    <button id="btn-recruit-plus" class="btn btn-green w-12 h-12 text-2xl font-bold">+</button>
                </div>
            </div>
        </div>

        <!-- Interaction Modal -->
        <div id="modal-overlay" class="absolute inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="glass w-full max-w-sm p-6 text-center relative rounded-sm border-2 border-cyber">
                <button id="modal-close" class="absolute top-2 right-4 text-2xl text-gray-500 hover:text-white">&times;</button>
                
                 <h2 id="modal-title" class="text-2xl font-bold text-white mb-1 font-mono">TARGET</h2>
                 <div id="modal-stats" class="text-sm text-gray-400 font-mono mb-6">INTEL: ???</div>

                <div class="grid grid-cols-1 gap-4">
                    <button id="btn-action-ally" class="btn btn-green py-4 font-bold">PROPOSE ALLIANCE</button>
                    <button id="btn-action-war" class="btn btn-red py-4 font-bold">DECLARE WAR</button>
                </div>
                
                <p id="modal-msg" class="mt-4 text-xs min-h-[1.5rem] font-bold text-yellow-300"></p>
            </div>
        </div>

        <!-- Transformer Menu -->
        <div id="transform-overlay" class="absolute inset-0 z-50 bg-black/90 hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <div class="glass w-full max-w-md p-6 relative rounded-sm border-2 border-yellow-500 max-h-[80vh] flex flex-col">
                <button id="transform-close" class="absolute top-2 right-4 text-2xl text-gray-500 hover:text-white">&times;</button>
                
                <h2 class="text-2xl font-bold text-yellow-400 mb-2 font-mono text-center">EMPIRE PROTOCOL</h2>
                <p class="text-xs text-gray-400 text-center mb-4 font-ui">Select a target form. You must control a key constituent nation.</p>
                
                <div id="empire-list" class="overflow-y-auto flex-1 space-y-3 pr-2">
                    <!-- Items injected by JS -->
                </div>
            </div>
        </div>

        <div id="reaction-layer" class="absolute inset-0 z-40 pointer-events-none hidden">
            <div id="reaction-card" class="reaction-card hidden">
                <img id="reaction-gif" class="reaction-gif" alt="Diplomatic reaction">
                <div id="reaction-label" class="reaction-label font-ui"></div>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="absolute inset-0 z-50 bg-black flex flex-col items-center justify-center hidden p-6 text-center">
            <h1 id="go-title" class="text-6xl font-bold text-red-600 mb-4 tracking-tighter">DEFEATED</h1>
            <p id="go-msg" class="text-gray-400 mb-8 max-w-xs font-mono">SIGNAL LOST.</p>
            <button onclick="location.reload()" class="btn btn-green px-12 py-4 font-bold text-lg">
                REINITIALIZE
            </button>
        </div>

    </div>

    <script>
        // --- Configuration ---
        const CONFIG = {
            baseManpowerGrowth: 80,
            recruitCost: 5000,
            recruitAmount: 5000,
            maxAttackRange: 60, // Map units. World width is approx 360.
            colors: {
                water: '#050510',
                land: '#0f172a',
                border: '#00f0ff',
                player: '#00f0ff',
                ally: '#22c55e',
                enemy: '#ef4444',
                selected: '#fbbf24',
                empire: '#a855f7'
            }
        };

        const EMPIRES = [
            { id: 'roman', name: "Roman Empire", req: ["Italy", "Greece", "Spain", "Turkey", "Egypt", "France"] },
            { id: 'soviet', name: "Soviet Union", req: ["Russia", "Ukraine", "Belarus", "Kazakhstan"] },
            { id: 'usa_super', name: "Pan-American Union", req: ["United States", "Canada", "Mexico", "Brazil"] },
            { id: 'asia_dyn', name: "Asian Dynasty", req: ["China", "Japan", "South Korea", "India", "Vietnam"] },
            { id: 'africa_u', name: "African Union", req: ["South Africa", "Nigeria", "Egypt", "Ethiopia", "Kenya"] },
            { id: 'euro_fed', name: "Euro Federation", req: ["Germany", "France", "United Kingdom", "Poland", "Italy"] },
            { id: 'persian', name: "Persian Empire", req: ["Iran", "Iraq", "Turkey", "Saudi Arabia"] },
            { id: 'oceania', name: "Oceanic Republic", req: ["Australia", "New Zealand", "Indonesia"] }
        ];

        // --- State ---
        const STATE = {
            phase: 'LOADING',
            countries: [],
            playerIdx: -1,
            selectedIdx: -1,
            camera: { x: 0, y: 0, scale: 1 },
            lastTick: 0,
            isDragging: false,
            lastTouch: { x: 0, y: 0 },
            dragMoved: false,
            playerFlag: null // CSS gradient string
        };

        // --- Media Mapping ---
        // [agent-note][stage4] repaired: mobile-ui-input | action: restored native button taps outside canvas and removed duplicate recruit touch/click firing
        // [agent-note][stage4] repaired: feedback-overlay | action: restored missing reaction DOM nodes so alliance/war visuals can render safely
        // [agent-note][stage4] resolved-font: titles -> Russo One, UI -> Exo 2, tactical mono -> Press Start 2P from catalogs/fonts.json
        const MEDIA = {
            gifs: {
                alliance: {
                    webp: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',
                    gif: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.gif',
                    label: 'Alliance Link'
                },
                war: {
                    webp: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp',
                    gif: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.gif',
                    label: 'Conflict Surge'
                }
            },
            audio: {
                uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                success: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
                fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3',
                war: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3',
                blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
                transform: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3',
                recruit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
                defeat: 'https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3'
            }
        };

        const AudioSys = {
            enabled: false,
            unlocked: false,
            masterVolume: 0.45,
            cache: new Map(),
            lastPlayed: new Map(),
            music: null,
            loopKey: null,
            ensureUnlocked() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.enabled = true;
            },
            getAudio(key, volume = 1, loop = false) {
                const src = MEDIA.audio[key];
                if (!src) return null;
                let audio = this.cache.get(key);
                if (!audio) {
                    audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.playsInline = true;
                    this.cache.set(key, audio);
                }
                audio.loop = loop;
                audio.volume = Math.max(0, Math.min(1, volume * this.masterVolume));
                return audio;
            },
            play(key, { volume = 1, debounce = 0 } = {}) {
                if (!this.enabled) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) || 0;
                if (debounce && now - last < debounce) return;
                this.lastPlayed.set(key, now);
                const base = this.getAudio(key, volume, false);
                if (!base) return;
                try {
                    const node = base.cloneNode();
                    node.volume = base.volume;
                    node.playsInline = true;
                    const playPromise = node.play();
                    if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
                } catch (err) {}
            },
            startLoop(key, { volume = 0.55 } = {}) {
                if (!this.enabled || this.loopKey === key) return;
                this.stopLoop();
                const audio = this.getAudio(key, volume, true);
                if (!audio) return;
                this.music = audio;
                this.loopKey = key;
                audio.currentTime = 0;
                const playPromise = audio.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {
                        this.music = null;
                        this.loopKey = null;
                    });
                }
            },
            stopLoop() {
                if (!this.music) return;
                try {
                    this.music.pause();
                    this.music.currentTime = 0;
                } catch (err) {}
                this.music = null;
                this.loopKey = null;
            },
            click() { this.play('uiClick', { volume: 0.75, debounce: 40 }); },
            success() { this.play('success', { volume: 0.9, debounce: 120 }); },
            error() { this.play('fail', { volume: 0.85, debounce: 140 }); },
            war() { this.play('war', { volume: 0.9, debounce: 220 }); },
            blocked() { this.play('blocked', { volume: 0.8, debounce: 180 }); },
            transform() { this.play('transform', { volume: 0.95, debounce: 240 }); },
            recruit() { this.play('recruit', { volume: 0.8, debounce: 90 }); },
            startGame() {
                this.play('start', { volume: 0.9, debounce: 200 });
                this.startLoop('bgm', { volume: 0.42 });
            },
            gameOver() {
                this.stopLoop();
                this.play('defeat', { volume: 0.8, debounce: 300 });
            }
        };

        const ReactionFX = {
            timer: null,
            layer: null,
            card: null,
            img: null,
            label: null,
            init() {
                this.layer = document.getElementById('reaction-layer');
                this.card = document.getElementById('reaction-card');
                this.img = document.getElementById('reaction-gif');
                this.label = document.getElementById('reaction-label');
            },
            show(type, duration = 1800) {
                const cfg = MEDIA.gifs[type];
                if (!cfg || !this.layer) return;
                clearTimeout(this.timer);
                this.layer.classList.remove('hidden');
                this.card.classList.remove('hidden');
                this.img.src = cfg.webp || cfg.gif;
                this.img.onerror = () => {
                    this.img.onerror = null;
                    this.img.src = cfg.gif;
                };
                this.label.innerText = cfg.label;
                requestAnimationFrame(() => this.card.classList.add('show'));
                this.timer = setTimeout(() => this.hide(), duration);
            },
            hide() {
                if (!this.layer) return;
                this.card.classList.remove('show');
                setTimeout(() => {
                    this.card.classList.add('hidden');
                    this.layer.classList.add('hidden');
                }, 180);
            }
        };

        // --- Utils ---
        function generateFlag() {
            // Generate a random CSS gradient flag
            const colors = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#000000', '#ffffff'];
            const c1 = colors[Math.floor(Math.random() * colors.length)];
            const c2 = colors[Math.floor(Math.random() * colors.length)];
            const type = Math.random() > 0.5 ? 'to right' : 'to bottom';
            return `linear-gradient(${type}, ${c1} 50%, ${c2} 50%)`;
        }

        function formatNum(n) {
            return n >= 1000 ? (n/1000).toFixed(1) + 'k' : Math.floor(n);
        }

        // --- Country Class ---
        class Country {
            constructor(feature, index) {
                this.index = index;
                this.id = feature.id || `c_${index}`;
                this.name = feature.properties.name || "Unknown";
                this.geometry = feature.geometry;
                this.center = this.calcCenter();
                this.area = this.calcArea();
                
                this.manpower = 10000 + Math.floor(this.area * 500);
                this.army = 5000 + Math.floor(this.area * 100);
                this.color = CONFIG.colors.land;
                
                this.allies = [];
                this.enemies = [];
            }

            calcCenter() {
                let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
                const coords = this.geometry.type === 'MultiPolygon' ? this.geometry.coordinates[0][0] : this.geometry.coordinates[0];
                for (let p of coords) {
                    if (Array.isArray(p[0])) p = p[0];
                    if (p[0]<minX) minX=p[0]; if (p[0]>maxX) maxX=p[0];
                    if (p[1]<minY) minY=p[1]; if (p[1]>maxY) maxY=p[1];
                }
                return { x: (minX+maxX)/2, y: (minY+maxY)/2 };
            }

            calcArea() {
                let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
                const coords = this.geometry.type === 'MultiPolygon' ? this.geometry.coordinates[0][0] : this.geometry.coordinates[0];
                for (let p of coords) {
                    if (Array.isArray(p[0])) p = p[0];
                    if (p[0]<minX) minX=p[0]; if (p[0]>maxX) maxX=p[0];
                    if (p[1]<minY) minY=p[1]; if (p[1]>maxY) maxY=p[1];
                }
                return (maxX-minX)*(maxY-minY);
            }
        }

        // --- Engine ---
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }
        window.addEventListener('resize', resize);

        function project(lon, lat) {
            return { x: lon * 5, y: -lat * 5 };
        }

        function render() {
            ctx.fillStyle = CONFIG.colors.water;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid effect
            ctx.strokeStyle = '#0a1a2f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<canvas.width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
            for(let i=0; i<canvas.height; i+=50) { ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); }
            ctx.stroke();

            ctx.save();
            ctx.translate(canvas.width/2 + STATE.camera.x, canvas.height/2 + STATE.camera.y);
            ctx.scale(STATE.camera.scale, STATE.camera.scale);

            STATE.countries.forEach(c => {
                ctx.beginPath();
                drawGeometry(ctx, c.geometry);
                
                let fill = c.color;
                if (STATE.phase === 'MENU') {
                    if (c.index === STATE.selectedIdx) fill = CONFIG.colors.player;
                } else if (STATE.phase === 'PLAYING') {
                    if (c.index === STATE.playerIdx) fill = CONFIG.colors.player;
                    else if (STATE.countries[STATE.playerIdx].allies.includes(c.index)) fill = CONFIG.colors.ally;
                    else if (STATE.countries[STATE.playerIdx].enemies.includes(c.index)) fill = CONFIG.colors.enemy;
                    
                    if (c.index === STATE.selectedIdx) {
                        ctx.shadowColor = '#fff';
                        ctx.shadowBlur = 15 / STATE.camera.scale;
                    }
                }

                ctx.fillStyle = fill;
                ctx.fill();

                ctx.lineWidth = 0.8 / STATE.camera.scale;
                ctx.strokeStyle = (c.index === STATE.selectedIdx) ? '#fff' : CONFIG.colors.border;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            ctx.restore();
        }

        function drawGeometry(ctx, geo) {
            if (geo.type === 'Polygon') drawPolygon(ctx, geo.coordinates);
            else if (geo.type === 'MultiPolygon') geo.coordinates.forEach(p => drawPolygon(ctx, p));
        }

        function drawPolygon(ctx, rings) {
            rings.forEach(ring => {
                const p0 = project(ring[0][0], ring[0][1]);
                ctx.moveTo(p0.x, p0.y);
                for (let i=1; i<ring.length; i++) {
                    const p = project(ring[i][0], ring[i][1]);
                    ctx.lineTo(p.x, p.y);
                }
            });
        }

        // --- Interaction ---
        canvas.addEventListener('pointerdown', e => {
            STATE.isDragging = true;
            STATE.lastTouch = { x: e.clientX, y: e.clientY };
            STATE.dragMoved = false;
        });
        canvas.addEventListener('pointermove', e => {
            if (!STATE.isDragging) return;
            const dx = e.clientX - STATE.lastTouch.x;
            const dy = e.clientY - STATE.lastTouch.y;
            if (Math.hypot(dx, dy) > 5) STATE.dragMoved = true;
            STATE.camera.x += dx;
            STATE.camera.y += dy;
            STATE.lastTouch = { x: e.clientX, y: e.clientY };
            render();
        });
        canvas.addEventListener('pointerup', e => {
            STATE.isDragging = false;
            if (!STATE.dragMoved) handleClick(e.clientX, e.clientY);
        });

        function handleClick(x, y) {
            const c = getCountryAt(x, y);
            if (c) {
                AudioSys.click();
                if (STATE.phase === 'MENU') {
                    STATE.selectedIdx = c.index;
                    updateMenuUI();
                    render();
                } else if (STATE.phase === 'PLAYING') {
                    if (c.index === STATE.playerIdx) {
                        createFloatText(x, y, "COMMAND", "#00f0ff");
                    } else {
                        STATE.selectedIdx = c.index;
                        openModal(c);
                        render();
                    }
                }
            } else {
                if (STATE.phase === 'PLAYING') {
                    STATE.selectedIdx = -1;
                    document.getElementById('modal-overlay').classList.add('hidden');
                    render();
                }
            }
        }

        function getCountryAt(sx, sy) {
            const cx = canvas.width/2 + STATE.camera.x;
            const cy = canvas.height/2 + STATE.camera.y;
            const wx = (sx - cx) / STATE.camera.scale;
            const wy = (sy - cy) / STATE.camera.scale;
            
            let closest = null, minDist = Infinity;
            for (let c of STATE.countries) {
                const center = project(c.center.x, c.center.y);
                const d = Math.hypot(center.x - wx, center.y - wy);
                if (d < 200) { // Optimization
                    if (d < Math.max(Math.sqrt(c.area)*2.5, 3)) return c;
                }
                if (d < minDist) {
                    minDist = d;
                    closest = c;
                }
            }
            return minDist <= 12 ? closest : null;
        }

        // --- Game Logic ---
        function initGame() {
            ReactionFX.init();
            fetch('assets/raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
                .then(res => res.json())
                .then(data => {
                    STATE.countries = data.features.map((f, i) => new Country(f, i));
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('menu-overlay').classList.remove('hidden');
                    STATE.phase = 'MENU';
                    STATE.camera.scale = Math.min(canvas.width, canvas.height) / 180;
                    resize();
                })
                .catch(err => {
                    console.error(err);
                    alert("Data Error. Reloading.");
                    location.reload();
                });
        }

        function updateMenuUI() {
            const c = STATE.countries[STATE.selectedIdx];
            document.getElementById('selected-country-name').innerText = c.name;
            document.getElementById('selection-info').classList.remove('opacity-0');
            const btn = document.getElementById('btn-play');
            btn.disabled = false;
            btn.className = "w-full max-w-xs btn btn-green py-5 text-xl tracking-widest shadow-[0_0_15px_rgba(0,255,0,0.3)]";
        }

        function startGame() {
            if (STATE.selectedIdx === -1) return;
            STATE.playerIdx = STATE.selectedIdx;
            STATE.phase = 'PLAYING';
            STATE.playerFlag = generateFlag();
            
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('player-flag').style.background = STATE.playerFlag;

            AudioSys.ensureUnlocked();
            AudioSys.startGame();
            AudioSys.success();

            const p = STATE.countries[STATE.playerIdx];
            const pc = project(p.center.x, p.center.y);
            STATE.camera.x = -pc.x * 5; 
            STATE.camera.y = -pc.y * 5;
            STATE.camera.scale = 5;

            requestAnimationFrame(gameLoop);
            updateHUD();
        }

        function gameLoop(time) {
            if (STATE.phase !== 'PLAYING') return;
            const dt = (time - STATE.lastTick) / 1000;
            if (dt > 1) {
                STATE.lastTick = time;
                tickEconomy();
            }
            requestAnimationFrame(gameLoop);
        }

        function tickEconomy() {
            const p = STATE.countries[STATE.playerIdx];
            p.manpower += CONFIG.baseManpowerGrowth + (p.area * 5);
            
            STATE.countries.forEach((c, i) => {
                if (i === STATE.playerIdx) return;
                c.manpower += CONFIG.baseManpowerGrowth;
                if (c.manpower > 8000) {
                    c.manpower -= 5000;
                    c.army += 5000;
                }
            });
            updateHUD();
        }

        function updateHUD() {
            const p = STATE.countries[STATE.playerIdx];
            document.getElementById('hud-country').innerText = p.name;
            document.getElementById('hud-manpower').innerText = formatNum(p.manpower);
            document.getElementById('hud-army').innerText = formatNum(p.army);
            
            const btnPlus = document.getElementById('btn-recruit-plus');
            const btnMinus = document.getElementById('btn-recruit-minus');
            btnPlus.disabled = p.manpower < CONFIG.recruitCost;
            btnMinus.disabled = p.army < CONFIG.recruitAmount;
        }

        function recruit(amount) {
            const p = STATE.countries[STATE.playerIdx];
            if (amount > 0) {
                if (p.manpower >= CONFIG.recruitCost) {
                    p.manpower -= CONFIG.recruitCost;
                    p.army += CONFIG.recruitAmount;
                    AudioSys.recruit();
                    createFloatText(window.innerWidth/2, window.innerHeight-150, "+5k TROOPS", "#0f0");
                } else AudioSys.blocked();
            } else {
                if (p.army >= CONFIG.recruitAmount) {
                    p.army -= CONFIG.recruitAmount;
                    p.manpower += CONFIG.recruitCost;
                    AudioSys.click();
                } else AudioSys.blocked();
            }
            updateHUD();
        }

        function createFloatText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        // --- Modals & Actions ---
        function openModal(target) {
            const p = STATE.countries[STATE.playerIdx];
            const modal = document.getElementById('modal-overlay');
            
            document.getElementById('modal-title').innerText = target.name.toUpperCase();
            document.getElementById('modal-stats').innerText = `INTEL: ~${formatNum(target.army)} ARMY`;
            document.getElementById('modal-msg').innerText = "";
            
            const btnAlly = document.getElementById('btn-action-ally');
            const btnWar = document.getElementById('btn-action-war');

            btnAlly.disabled = false;
            btnWar.disabled = false;
            btnAlly.innerText = "PROPOSE ALLIANCE";
            btnWar.innerText = "DECLARE WAR";

            if (p.allies.includes(target.index)) {
                btnAlly.innerText = "ALLIANCE ACTIVE";
                btnAlly.disabled = true;
                btnWar.disabled = true;
            } else if (p.enemies.includes(target.index)) {
                btnWar.innerText = "ATTACK (BATTLE)";
                btnAlly.disabled = true;
            }

            // Distance Check for War
            const dist = Math.hypot(p.center.x - target.center.x, p.center.y - target.center.y);
            const inRange = dist <= CONFIG.maxAttackRange;

            btnAlly.onclick = () => {
                if (Math.random() > 0.4) {
                    p.allies.push(target.index);
                    target.allies.push(p.index);
                    document.getElementById('modal-msg').innerText = "ALLIANCE ESTABLISHED.";
                    document.getElementById('modal-msg').className = "mt-4 text-xs font-bold text-green-400";
                    AudioSys.success();
                    setTimeout(() => modal.classList.add('hidden'), 1000);
                    render();
                } else {
                    document.getElementById('modal-msg').innerText = "PROPOSAL REJECTED.";
                    document.getElementById('modal-msg').className = "mt-4 text-xs font-bold text-red-400";
                    AudioSys.error();
                }
            };

            btnWar.onclick = () => {
                if (!inRange && !p.enemies.includes(target.index)) {
                    document.getElementById('modal-msg').innerText = "TARGET OUT OF RANGE (" + Math.floor(dist) + ")";
                    document.getElementById('modal-msg').className = "mt-4 text-xs font-bold text-red-500";
                    AudioSys.error();
                    return;
                }

                if (p.enemies.includes(target.index)) {
                    // Battle
                    const myLoss = Math.floor(target.army * 0.1);
                    const enemyLoss = Math.floor(p.army * 0.15);
                    
                    p.army = Math.max(0, p.army - myLoss);
                    target.army = Math.max(0, target.army - enemyLoss);
                    AudioSys.war();
                    
                    if (target.army <= 0) {
                        p.manpower += target.area * 1000;
                        target.army = 1000;
                        target.color = CONFIG.colors.player;
                        p.enemies = p.enemies.filter(e => e !== target.index);
                        p.allies.push(target.index); // Subjugated
                        document.getElementById('modal-msg').innerText = "SECTOR CONQUERED.";
                        document.getElementById('modal-msg').className = "mt-4 text-xs font-bold text-yellow-400";
                    } else if (p.army <= 0) {
                        STATE.phase = 'GAMEOVER';
                        document.getElementById('game-ui').classList.add('hidden');
                        modal.classList.add('hidden');
                        document.getElementById('game-over').classList.remove('hidden');
                    } else {
                        document.getElementById('modal-msg').innerText = `ENGAGEMENT: -${formatNum(myLoss)} UNITS.`;
                        document.getElementById('modal-msg').className = "mt-4 text-xs font-bold text-orange-400";
                        document.getElementById('modal-stats').innerText = `INTEL: ~${formatNum(target.army)} ARMY`;
                    }
                    updateHUD();
                } else {
                    p.enemies.push(target.index);
                    target.enemies.push(p.index);
                    document.getElementById('modal-msg').innerText = "WAR DECLARED.";
                    document.getElementById('modal-msg').className = "mt-4 text-xs font-bold text-red-500";
                    AudioSys.war();
                    btnWar.innerText = "ATTACK (BATTLE)";
                    btnAlly.disabled = true;
                    render();
                }
            };

            modal.classList.remove('hidden');
        }

        // --- Transformer Menu Logic ---
        function openTransformer() {
            const p = STATE.countries[STATE.playerIdx];
            const list = document.getElementById('empire-list');
            list.innerHTML = "";
            
            EMPIRES.forEach(emp => {
                const div = document.createElement('div');
                div.className = "p-3 border border-gray-700 bg-gray-900/50 rounded flex flex-col gap-1";
                
                const header = document.createElement('div');
                header.className = "flex justify-between items-center";
                header.innerHTML = `<span class="font-bold text-yellow-500">${emp.name}</span>`;
                
                const reqs = document.createElement('div');
                reqs.className = "text-[10px] text-gray-400";
                reqs.innerText = "Requires: " + emp.req.join(", ");

                const btn = document.createElement('button');
                btn.className = "btn btn-gold mt-2 py-2 text-xs w-full";
                btn.innerText = "TRANSFORM";

                // Check eligibility
                const isEligible = emp.req.some(r => p.name.includes(r));
                
                if (isEligible) {
                    btn.onclick = () => {
                        p.name = emp.name;
                        p.color = CONFIG.colors.empire;
                        p.manpower += 50000;
                        p.army += 50000;
                        AudioSys.transform();
                        document.getElementById('transform-overlay').classList.add('hidden');
                        updateHUD();
                        render();
                        createFloatText(window.innerWidth/2, window.innerHeight/2, "EMPIRE FORMED", "#a855f7");
                    };
                } else {
                    btn.disabled = true;
                    btn.innerText = "UNAVAILABLE";
                }

                div.appendChild(header);
                div.appendChild(reqs);
                div.appendChild(btn);
                list.appendChild(div);
            });

            document.getElementById('transform-overlay').classList.remove('hidden');
        }

        // --- Listeners ---
        document.getElementById('btn-play').addEventListener('click', startGame);
        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('modal-overlay').classList.add('hidden');
            STATE.selectedIdx = -1;
            render();
        });
        document.getElementById('btn-open-transform').addEventListener('click', openTransformer);
        document.getElementById('transform-close').addEventListener('click', () => {
            document.getElementById('transform-overlay').classList.add('hidden');
        });

        const handleRecruit = (amt, e) => {
            e.preventDefault();
            recruit(amt);
        };
        const bp = document.getElementById('btn-recruit-plus');
        const bm = document.getElementById('btn-recruit-minus');
        bp.addEventListener('click', (e) => handleRecruit(1, e));
        bm.addEventListener('click', (e) => handleRecruit(-1, e));

        initGame();
    </script>
