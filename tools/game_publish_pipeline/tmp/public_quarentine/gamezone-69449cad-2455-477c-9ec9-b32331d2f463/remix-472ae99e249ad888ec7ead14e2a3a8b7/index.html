        .feedback-gif {

        .feedback-caption {

<body class="bg-app">

    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: success/fail feedback -> catalogs/gifs.json -->

        <div id="success-gif" class="feedback-gif success hidden" aria-hidden="true">

        </div>

        <div id="ui-layer" class="ui-layer">

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->

                    <span class="hud-label">Breaches</span>

                    <span id="attempts" class="hud-value red">5</span>

            <div id="message-overlay" class="message-overlay hidden">
                <h1 id="message-text" class="message-text text-green">BREACH!</h1>

            <div id="start-screen" class="overlay-screen start">
                <div class="discord-card screen-card">
                    <div class="screen-badge" aria-hidden="true">

                    </div>

                    <p class="subtitle">Guide the breach bot through the gate.<br>Tap to align. Tap again to launch.</p>

            </div>

    <script>
    /**
     * FIREWALL PENALTY
     * A cyber-heist reframe of a fixed two-tap penalty shootout.
     * Mechanics remain unchanged: aim, set power, then launch.
     */

    document.addEventListener('DOMContentLoaded', () => {

        /* --- ASSETS & CONFIG --- */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                aim: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                launch: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3",
                goal: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                miss: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const COLORS = {
            bg: '#050816',
            bgGlow: '#0b1531',
            field: '#0c1a39',
            fieldEdge: '#13295d',
            grid: 'rgba(122, 247, 255, 0.16)',
            accent: '#37d4ff',
            accentSoft: '#7af7ff',
            violet: '#8d76ff',
            ball: '#dffbff',
            keeper: '#ff5f86',
            keeperDark: '#411329',
            goal: '#7af7ff',
            text: '#eef6ff',
            green: '#62ffb0',
            red: '#ff5f86',
            yellow: '#ffd86b'
        };

        /* --- AUDIO SYSTEM --- */
        class AudioController {
            constructor() {
                this.enabled = true;
                this.initialized = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                this.initialized = true;
            }

            playBGM() {
                if (!this.enabled || !this.initialized) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.7) {
                if (!this.enabled || !this.initialized || !this.sfx[key]) return;
                const sound = this.sfx[key].cloneNode();
                sound.volume = volume;
                sound.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /* --- FEEDBACK MEDIA --- */
        const feedbackTimers = {};
        function createFeedbackNode(id, src, label, className) {
            const node = document.createElement('div');
            node.id = id;
            node.className = `feedback-gif ${className} hidden`;

            const img = document.createElement('img');
            img.src = src;
            img.alt = '';
            img.className = 'feedback-gif-image';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            img.style.borderRadius = 'inherit';
            img.style.display = 'block';

            const caption = document.createElement('span');
            caption.className = 'feedback-caption';
            caption.textContent = label;

            node.appendChild(img);
            node.appendChild(caption);
            document.getElementById('game-container').appendChild(node);
            return node;
        }

        const feedbackNodes = {
            success: createFeedbackNode('feedback-success', ASSETS.gifs.success, 'Access spike', 'success'),
            fail: createFeedbackNode('feedback-fail', ASSETS.gifs.fail, 'Security panic', 'fail')
        };

        function pulseFeedback(type, duration = 1400) {
            const node = feedbackNodes[type];
            if (!node) return;
            clearTimeout(feedbackTimers[type]);
            node.classList.remove('hidden');
            requestAnimationFrame(() => node.classList.add('active'));
            feedbackTimers[type] = setTimeout(() => {
                node.classList.remove('active');
                setTimeout(() => node.classList.add('hidden'), 220);
            }, duration);
        }

        /* --- GAME STATE & CONSTANTS --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let attempts = 5;
        let frames = 0;

        const STATE_AIMING = 0;
        const STATE_POWER = 1;
        const STATE_SHOOTING = 2;
        const STATE_RESULT = 3;
        let currentState = STATE_AIMING;

        let ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, rotation: 0 };
        let keeper = { x: 0, targetX: 0, width: 0.15, height: 0.25 };
        let aim = { angle: 0, speed: 0.04, dir: 1 };
        let power = { level: 0, speed: 0.025, dir: 1 };

        let particles = [];

        /* --- RESIZE & INIT --- */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function initRound() {
            currentState = STATE_AIMING;
            ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, rotation: 0 };
            aim.angle = 0;
            power.level = 0;
            keeper.x = 0;

            updateHint("TAP TO ALIGN");
        }

        function startGame() {
            score = 0;
            attempts = 5;
            updateHUD();
            initRound();
            gameActive = true;
            loop();
        }

        /* --- UPDATE LOGIC --- */
        function update() {
            frames++;

            if (currentState !== STATE_RESULT) {
                let target = 0;
                if (currentState === STATE_SHOOTING) {
                    target = ball.x * 1.2;
                } else {
                    target = Math.sin(frames * 0.05) * 0.15;
                }
                target = Math.max(-0.4, Math.min(0.4, target));
                keeper.x += (target - keeper.x) * 0.1;
            }

            if (currentState === STATE_AIMING) {
                aim.angle += aim.speed * aim.dir;
                if (aim.angle > 0.7 || aim.angle < -0.7) aim.dir *= -1;

            } else if (currentState === STATE_POWER) {
                power.level += power.speed * power.dir;
                if (power.level >= 1) {
                    power.level = 1;
                    power.dir = -1;
                } else if (power.level <= 0) {
                    power.level = 0;
                    power.dir = 1;
                }

            } else if (currentState === STATE_SHOOTING) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.z += ball.vz;

                ball.vy += 0.0012;
                ball.rotation += 0.15;

                if (ball.z >= 1.0) {
                    resolveShot();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function resolveShot() {
            currentState = STATE_RESULT;

            const goalHalfWidth = 0.28;

            let resultText = "TRACE LOST";
            let resultColor = "text-red";

            if (Math.abs(ball.x) < goalHalfWidth && ball.y < 0 && ball.y > -0.35) {
                if (Math.abs(ball.x - keeper.x) < 0.12 && ball.y > -0.25) {
                    resultText = "BLOCKED";
                    audio.playSFX('blocked', 0.72);
                    pulseFeedback('fail');
                } else {
                    resultText = "BREACH!";
                    resultColor = "text-green";
                    audio.playSFX('goal', 0.7);
                    audio.playSFX('bonus', 0.45);
                    score += 100 + Math.floor(power.level * 50);
                    spawnConfetti();
                    pulseFeedback('success');
                }
            } else {
                audio.playSFX('miss', 0.75);
                pulseFeedback('fail');
                if (Math.abs(ball.x) >= goalHalfWidth) resultText = "OFF-PORT";
                else if (ball.y <= -0.35) resultText = "TOO HIGH";
                else resultText = "UNDERPOWERED";
            }

            showOverlay(resultText, resultColor);
            attempts--;
            updateHUD();

            setTimeout(() => {
                if (attempts <= 0) {
                    endGame();
                } else {
                    initRound();
                }
            }, 2000);
        }

        /* --- RENDER LOGIC --- */
        function draw() {
            const centerX = width / 2;
            const horizonY = height * 0.35;

            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, COLORS.bgGlow);
            bgGrad.addColorStop(1, COLORS.bg);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.18;
            for (let i = 0; i < 36; i++) {
                const starX = (i * 197) % width;
                const starY = ((i * 131) % Math.max(horizonY, 1));
                const size = (i % 3) + 1;
                ctx.fillStyle = i % 2 === 0 ? COLORS.accentSoft : COLORS.violet;
                ctx.beginPath();
                ctx.arc(starX, starY, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            const fieldWidthFar = width * 0.4;
            const fieldWidthNear = width * 1.5;

            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, COLORS.fieldEdge);
            grad.addColorStop(1, COLORS.field);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(centerX - fieldWidthFar / 2, horizonY);
            ctx.lineTo(centerX + fieldWidthFar / 2, horizonY);
            ctx.lineTo(centerX + fieldWidthNear / 2, height);
            ctx.lineTo(centerX - fieldWidthNear / 2, height);
            ctx.fill();

            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 1;
            for (let i = -5; i <= 5; i++) {
                const t = i / 5;
                const xFar = centerX + (fieldWidthFar / 2 * t);
                const xNear = centerX + (fieldWidthNear / 2 * t);
                ctx.beginPath();
                ctx.moveTo(xFar, horizonY);
                ctx.lineTo(xNear, height);
                ctx.stroke();
            }
            for (let i = 0; i < 10; i++) {
                const p = i / 10;
                const y = horizonY + (height - horizonY) * (p * p);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const goalW = fieldWidthFar * 0.6;
            const goalH = goalW * 0.5;
            const postY = horizonY + 20;

            ctx.save();
            ctx.beginPath();
            ctx.rect(centerX - goalW / 2, postY - goalH, goalW, goalH);
            const goalGlow = ctx.createLinearGradient(centerX, postY - goalH, centerX, postY);
            goalGlow.addColorStop(0, 'rgba(122, 247, 255, 0.16)');
            goalGlow.addColorStop(1, 'rgba(55, 212, 255, 0.04)');
            ctx.fillStyle = goalGlow;
            ctx.fill();

            ctx.strokeStyle = 'rgba(122, 247, 255, 0.22)';
            ctx.beginPath();
            for (let i = 0; i <= 5; i++) {
                const x = (centerX - goalW / 2) + (goalW * (i / 5));
                ctx.moveTo(x, postY - goalH);
                ctx.lineTo(x, postY);
                const y = (postY - goalH) + (goalH * (i / 5));
                ctx.moveTo(centerX - goalW / 2, y);
                ctx.lineTo(centerX + goalW / 2, y);
            }
            ctx.stroke();
            ctx.restore();

            ctx.strokeStyle = COLORS.goal;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 18;
            ctx.shadowColor = COLORS.goal;

            ctx.beginPath();
            ctx.moveTo(centerX - goalW / 2, postY);
            ctx.lineTo(centerX - goalW / 2, postY - goalH);
            ctx.lineTo(centerX + goalW / 2, postY - goalH);
            ctx.lineTo(centerX + goalW / 2, postY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            const kX = centerX + (keeper.x * width * 0.8);
            const kY = postY;
            const kW = 42;
            const kH = 62;

            ctx.save();
            const bodyGrad = ctx.createLinearGradient(kX, kY - kH, kX, kY);
            bodyGrad.addColorStop(0, '#ff86a4');
            bodyGrad.addColorStop(1, COLORS.keeper);
            ctx.fillStyle = bodyGrad;
            roundRect(ctx, kX - kW / 2, kY - kH, kW, kH, 10);
            ctx.fill();

            ctx.fillStyle = COLORS.keeperDark;
            roundRect(ctx, kX - 14, kY - kH - 10, 28, 18, 9);
            ctx.fill();

            ctx.fillStyle = '#081225';
            ctx.fillRect(kX - kW / 2 + 5, kY - kH + 17, kW - 10, 10);
            ctx.fillStyle = COLORS.green;
            ctx.beginPath();
            ctx.arc(kX - 7 + (Math.sin(frames * 0.1) * 2), kY - kH + 22, 3, 0, Math.PI * 2);
            ctx.arc(kX + 7 + (Math.sin(frames * 0.1) * 2), kY - kH + 22, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(122, 247, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(kX, kY - 6);
            ctx.lineTo(kX, kY + 8);
            ctx.moveTo(kX - 14, kY + 5);
            ctx.lineTo(kX + 14, kY + 5);
            ctx.stroke();
            ctx.restore();

            const scale = 1.0 - (ball.z * 0.6);
            const startY = height * 0.85;
            const endY = postY;
            const groundY = startY * (1 - ball.z) + endY * ball.z;
            const screenY = groundY + (ball.y * height * 0.8 * scale);
            const screenX = centerX + (ball.x * width * 0.8);
            const radius = 20 * scale;

            if (ball.z < 1.0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(screenX, groundY, radius, radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(ball.rotation);

            const orbGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.4, radius * 0.2, 0, 0, radius);
            orbGrad.addColorStop(0, '#ffffff');
            orbGrad.addColorStop(0.6, COLORS.ball);
            orbGrad.addColorStop(1, '#70e7ff');
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = orbGrad;
            ctx.fill();

            ctx.lineWidth = Math.max(2, radius * 0.12);
            ctx.strokeStyle = COLORS.violet;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.62, 0.3, Math.PI + 0.2, false);
            ctx.stroke();

            ctx.strokeStyle = COLORS.accent;
            ctx.beginPath();
            ctx.moveTo(-radius * 0.55, 0);
            ctx.lineTo(radius * 0.55, 0);
            ctx.moveTo(0, -radius * 0.55);
            ctx.lineTo(0, radius * 0.55);
            ctx.stroke();
            ctx.restore();

            particles.forEach((p) => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            if (currentState === STATE_AIMING) {
                ctx.save();
                ctx.translate(centerX, height * 0.85);
                ctx.rotate(aim.angle);

                ctx.shadowBlur = 14;
                ctx.shadowColor = COLORS.yellow;

                ctx.fillStyle = COLORS.yellow;
                ctx.beginPath();
                ctx.moveTo(-15, 0);
                ctx.lineTo(15, 0);
                ctx.lineTo(0, -120);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 216, 107, 0.35)';
                ctx.beginPath();
                ctx.moveTo(-7, -24);
                ctx.lineTo(7, -24);
                ctx.lineTo(0, -102);
                ctx.fill();

                ctx.restore();
            } else if (currentState === STATE_POWER) {
                const barW = 30;
                const barH = 200;
                const barX = width - 50;
                const barY = height / 2 - 100;

                ctx.fillStyle = 'rgba(7, 16, 34, 0.88)';
                roundRect(ctx, barX, barY, barW, barH, 10);
                ctx.fill();

                const fillH = power.level * barH;
                const pColor = power.level > 0.8 ? COLORS.red : (power.level > 0.5 ? COLORS.yellow : COLORS.green);

                ctx.save();
                ctx.beginPath();
                roundRect(ctx, barX + 3, barY + 3 + (barH - fillH), barW - 6, Math.max(0, fillH - 6), 8);
                ctx.clip();

                const powerGrad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
                powerGrad.addColorStop(0, COLORS.red);
                powerGrad.addColorStop(0.5, COLORS.yellow);
                powerGrad.addColorStop(1, COLORS.green);
                ctx.fillStyle = powerGrad;
                ctx.shadowBlur = 12;
                ctx.shadowColor = pColor;
                ctx.fillRect(barX, barY + (barH - fillH), barW, fillH);
                ctx.restore();

                ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                ctx.lineWidth = 2;
                roundRect(ctx, barX, barY, barW, barH, 10);
                ctx.stroke();
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (w <= 0 || h <= 0) return;
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function spawnConfetti() {
            const colors = [COLORS.accent, COLORS.green, COLORS.yellow, '#ffffff', COLORS.violet];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: width / 2,
                    y: height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.5,
                    size: Math.random() * 6 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function loop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        /* --- UI HELPERS --- */
        function updateHUD() {
            document.getElementById('score').innerText = score;
            document.getElementById('attempts').innerText = attempts;
        }

        function updateHint(text) {
            const hint = document.getElementById('controls-hint');
            const hintText = document.getElementById('hint-text');
            hint.classList.remove('hidden');
            hintText.innerText = text;
        }

        function showOverlay(text, colorClass) {
            const overlay = document.getElementById('message-overlay');
            const msg = document.getElementById('message-text');
            msg.innerText = text;
            msg.className = `message-text animate-pop ${colorClass}`;
            overlay.classList.remove('hidden');

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 1500);
        }

        function endGame() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('gameOver', 0.75);
            pulseFeedback('fail', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls-hint').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /* --- INPUT --- */
        function handleInput(e) {
            if (!gameActive) return;
            if (e.type === 'touchstart') e.preventDefault();

            if (currentState === STATE_AIMING) {
                currentState = STATE_POWER;
                audio.playSFX('aim', 0.55);
                updateHint("TAP TO LAUNCH");
            } else if (currentState === STATE_POWER) {
                currentState = STATE_SHOOTING;

                ball.vz = 0.025 + (power.level * 0.035);
                ball.vx = Math.sin(aim.angle) * 0.02;
                ball.vy = -0.035 - (power.level * 0.01);

                audio.playSFX('launch', 0.62);
                updateHint("");
            }
        }

        const container = document.getElementById('game-container');
        container.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') handleInput(e);
        });
        container.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON') handleInput(e);
        }, { passive: false });

        function beginRun() {
            const startScreen = document.getElementById('start-screen');
            if (startScreen.classList.contains('hidden')) return;
            audio.unlock();
            audio.playSFX('start', 0.6);
            startScreen.classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            startGame();
        }

        function restartRun() {
            const gameOverScreen = document.getElementById('game-over-screen');
            if (gameOverScreen.classList.contains('hidden')) return;
            audio.unlock();
            audio.playSFX('start', 0.55);
            gameOverScreen.classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            startGame();
        }

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // [agent-note][stage4] repaired: mobile-action-path | elements: #start-btn,#restart-btn | action: native click kept, touchend fallback added
        startBtn.addEventListener('click', beginRun);
        restartBtn.addEventListener('click', restartRun);
        startBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            beginRun();
        }, { passive: false });
        restartBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            restartRun();
        }, { passive: false });
    });
    </script>
