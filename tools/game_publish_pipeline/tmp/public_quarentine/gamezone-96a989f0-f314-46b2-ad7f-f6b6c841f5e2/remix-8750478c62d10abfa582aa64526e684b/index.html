<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Skyline Forge</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0a1024;
            --bg-bottom: #120d2f;
            --panel: rgba(8, 16, 40, 0.72);
            --panel-border: rgba(107, 243, 255, 0.38);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text-main: #f4fbff;
            --text-soft: rgba(229, 243, 255, 0.72);
            --accent-cyan: #6bf3ff;
            --accent-pink: #ff65d4;
            --accent-lime: #afff7a;
            --accent-gold: #ffd86b;
        }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: radial-gradient(circle at top, #1c2e6d 0%, var(--bg-top) 42%, var(--bg-bottom) 100%); font-family: 'Rajdhani', system-ui, sans-serif; color: var(--text-main); }
        body { position: relative; }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 18%, rgba(107, 243, 255, 0.18), transparent 24%),
                radial-gradient(circle at 82% 20%, rgba(255, 101, 212, 0.16), transparent 22%),
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 22%);
            opacity: 0.95;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button { font: inherit; border: 0; background: transparent; color: inherit; }
        .glass {
            background: linear-gradient(180deg, rgba(14, 27, 63, 0.78), rgba(9, 15, 36, 0.68));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 30px var(--panel-shadow), inset 0 0 0 1px rgba(255,255,255,0.04);
        }
        .btn-active { transform: scale(0.95); background: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.8); }
        #ui-layer { pointer-events: none; }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-around { justify-content: space-around; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .h-full { width: 100%; height: 100%; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .p-4 { padding: 1rem; }
        .p-2 { padding: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .m-1 { margin: 0.25rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.5rem; }
        .text-white { color: #fff; }
        .text-white\/50 { color: rgba(221, 238, 255, 0.62); }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .font-bold { font-weight: 700; }
        .opacity-70 { opacity: 0.7; }
        .text-center { text-align: center; }
        .max-w-md { max-width: 28rem; }
        .overflow-x-auto { overflow-x: auto; }
        .cursor-pointer { cursor: pointer; }
        .transition-transform, .transition-all { transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease; }
        .active\:scale-90:active { transform: scale(0.9); }
        .w-10 { width: 2.5rem; }
        .h-10 { height: 2.5rem; }
        .border-2 { border-width: 2px; border-style: solid; }
        .ring-2 { box-shadow: 0 0 0 2px rgba(255,255,255,0.95); }
        .ring-white { box-shadow: 0 0 0 2px rgba(255,255,255,0.95); }
        .scale-110 { transform: scale(1.1); }
        .z-50 { z-index: 50; }
        .h-6 { height: 1.5rem; }
        .w-6 { width: 1.5rem; }
        .hud-card { min-width: 5.75rem; }
        .hud-label, .hint-line { letter-spacing: 0.22em; text-transform: uppercase; }
        .hud-label { color: var(--text-soft); font-size: 0.68rem; }
        .hud-value, .wordmark { font-family: 'Orbitron', 'Rajdhani', sans-serif; }
        .hud-value {
            color: var(--accent-gold);
            text-shadow: 0 0 12px rgba(255, 216, 107, 0.45);
        }
        .wordmark {
            font-size: clamp(1rem, 2.6vw, 1.35rem);
            letter-spacing: 0.08em;
            color: #fff5f1;
            text-shadow: 0 0 14px rgba(255, 101, 212, 0.4);
        }
        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            margin-top: 0.35rem;
            background: rgba(107, 243, 255, 0.12);
            border: 1px solid rgba(107, 243, 255, 0.2);
            font-size: 0.72rem;
            color: var(--text-soft);
        }
        .badge-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--accent-cyan), #ffffff);
            box-shadow: 0 0 10px rgba(107, 243, 255, 0.8);
            animation: pulseDot 1.8s ease-in-out infinite;
        }
        .hud-icon-btn {
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        }
        .hud-icon-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 45%);
        }
        #palette {
            gap: 0.25rem;
            padding-inline: 0.45rem;
        }
        .palette-chip {
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), 0 6px 16px rgba(0,0,0,0.3);
        }
        .palette-chip::before {
            content: "";
            position: absolute;
            inset: 0.15rem;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0.28), transparent 45%);
            opacity: 0.9;
        }
        .hint-panel {
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
        }
        .hint-line {
            display: inline-block;
            padding: 0.28rem 0.7rem;
            border-radius: 999px;
            background: rgba(10, 18, 46, 0.55);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.7rem;
        }
        .feedback-panel {
            position: absolute;
            right: 1rem;
            bottom: calc(5.5rem + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 0.7rem;
            width: min(17rem, calc(100vw - 2rem));
            padding: 0.65rem;
            opacity: 0;
            transform: translateY(0.75rem) scale(0.98);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
            z-index: 40;
        }
        .feedback-panel.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .feedback-gif {
            width: 4.2rem;
            height: 4.2rem;
            object-fit: cover;
            border-radius: 0.8rem;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(7, 10, 24, 0.6);
            flex-shrink: 0;
        }
        .feedback-copy {
            min-width: 0;
        }
        .feedback-title {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 0.2rem;
        }
        .feedback-text {
            font-size: 0.75rem;
            color: var(--text-soft);
            line-height: 1.3;
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.18); opacity: 1; }
        }
        @media (max-width: 480px) {
            .p-4 { padding: 0.75rem; }
            .wordmark { font-size: 0.92rem; }
            .hud-card { min-width: 5rem; }
            .hud-value { font-size: 1.05rem; line-height: 1.35rem; }
            #palette { max-width: calc(100vw - 1.5rem); }
            .feedback-panel {
                right: 0.75rem;
                bottom: calc(6.25rem + env(safe-area-inset-bottom));
                width: min(15rem, calc(100vw - 1.5rem));
                padding: 0.55rem;
                gap: 0.55rem;
            }
            .feedback-gif {
                width: 3.4rem;
                height: 3.4rem;
            }
        }
    </style>
</head>
<body>

<!-- Asset Declarations -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: loop/build/ui/bonus/blocked -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Neon Grid Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="none" loop crossorigin="anonymous"></audio>
    <audio id="sfx_build" data-editable="audio" data-label="Forge Pulse" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="none" crossorigin="anonymous"></audio>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between p-4 z-50">
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full">

        <!-- Palette -->

        <div id="feedback-panel" class="glass feedback-panel" aria-live="polite">

            <img id="feedback-gif" class="feedback-gif" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Skyline feedback animation" loading="lazy" decoding="async">
            <div class="feedback-copy">
                <div id="feedback-title" class="feedback-title">Skyline Combo</div>

<script>
/**
 * System Invariants & Constants
 */
const CONFIG = {
    blocks: [
        { id: 1, name: 'Steel', color: '#95A5A6', top: '#BDC3C7', side: '#7F8C8D' },
        { id: 2, name: 'Signal', color: '#C0392B', top: '#E74C3C', side: '#922B21' },
        { id: 3, name: 'Amber', color: '#D35400', top: '#E67E22', side: '#A04000' },
        { id: 4, name: 'Glass', color: '#2980B9', top: '#3498DB', side: '#1F618D', alpha: 0.6 },
        { id: 5, name: 'Greenway', color: '#27AE60', top: '#2ECC71', side: '#1E8449' }
    ],
    tileSize: 32, // Base tile size, scales with canvas
    maxHeight: 12
};

// Global State
let canvas, ctx;
let cw = 0, ch = 0;
let dpr = 1;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING only
let lastTime = 0;
let ro; // ResizeObserver

// Game State
let grid = {}; // Key: "x,y,z", Value: blockId
let particles = [];
let camera = { x: 0, y: 0, zoom: 1 };
let selectedBlockId = 1;
let blockCount = 0;
let pointer = { x: 0, y: 0, isDown: false, downTime: 0, startX: 0, startY: 0 };
let activeTouchId = null;

// Audio Context
let audioCtx = null;
let sfxBuffers = {};
let bgmEl = null;
let bgmStarted = false;
let ambientGain = null;
let ambientNodes = null;
let lastSfxAt = {};
let feedbackTimeout = null;

/**
 * Audio System (Web Audio API)
 */
async function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    
    // Load SFX
    const loadBuffer = async (id, url) => {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            sfxBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`SFX Load Fail: ${id}`, e);
        }
    };

    const sfxList = [
        { id: 'build', el: 'sfx_build' },
        { id: 'remove', el: 'sfx_remove' },
        { id: 'ui', el: 'sfx_ui' },
        { id: 'bonus', el: 'sfx_bonus' },
        { id: 'blocked', el: 'sfx_blocked' }
    ];

    await Promise.all(sfxList.map(s => loadBuffer(s.id, document.getElementById(s.el).src)));
    
    bgmEl = document.getElementById('bgm_main');
}

function playSfx(id, options = {}) {
    if (!audioCtx) return;

    const now = performance.now();
    const minInterval = options.minInterval ?? 90;
    if (lastSfxAt[id] && now - lastSfxAt[id] < minInterval) return;
    lastSfxAt[id] = now;
    
    // Unlock if suspended
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (sfxBuffers[id]) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = sfxBuffers[id];
        gain.gain.value = options.volume ?? 0.35;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } else {
        // Fallback Synthesis
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (id === 'build') {
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else {
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }
    }
}

function ensureAmbientLoop() {
    if (!audioCtx) return;
    if (ambientNodes) return;
    ambientGain = audioCtx.createGain();
    ambientGain.gain.value = 0.12;
    ambientGain.connect(audioCtx.destination);

    const oscA = audioCtx.createOscillator();
    const oscB = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();

    oscA.type = 'triangle';
    oscB.type = 'sine';
    oscA.frequency.value = 132;
    oscB.frequency.value = 198;
    lfo.type = 'sine';
    lfo.frequency.value = 0.18;
    lfoGain.gain.value = 8;

    lfo.connect(lfoGain);
    lfoGain.connect(oscA.frequency);

    const gainA = audioCtx.createGain();
    const gainB = audioCtx.createGain();
    gainA.gain.value = 0.035;
    gainB.gain.value = 0.02;

    oscA.connect(gainA);
    oscB.connect(gainB);
    gainA.connect(ambientGain);
    gainB.connect(ambientGain);

    oscA.start();
    oscB.start();
    lfo.start();

    ambientNodes = { oscA, oscB, lfo, gainA, gainB };
}

function setAmbientEnabled(enabled) {
    if (!audioCtx) return;
    ensureAmbientLoop();
    if (ambientGain) {
        ambientGain.gain.cancelScheduledValues(audioCtx.currentTime);
        ambientGain.gain.setTargetAtTime(enabled ? 0.12 : 0.0001, audioCtx.currentTime, 0.18);
    }
    bgmStarted = enabled;
}

function startBgm() {
    if (!audioCtx || bgmStarted) return;
    setAmbientEnabled(true);
}

function unlockAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    startBgm();
}

function syncBgmPlayback(shouldPlay) {
    if (shouldPlay) {
        startBgm();
        if (!bgmStarted && audioCtx) {
            setAmbientEnabled(true);
        }
        return;
    }
    if (bgmEl && !bgmEl.paused) {
        bgmEl.pause();
    }
    if (ambientGain && audioCtx) {
        setAmbientEnabled(false);
    }
    bgmStarted = false;
}

function showFeedback(mode) {
    const panel = document.getElementById('feedback-panel');
    const img = document.getElementById('feedback-gif');
    const title = document.getElementById('feedback-title');
    const text = document.getElementById('feedback-text');
    if (!panel || !img || !title || !text) return;

    const states = {
        success: {
            title: 'Skyline Combo',
            text: 'Bonus glow locked into the skyline.',
            src: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
        },
        blocked: {
            title: 'Grid Jam',
            text: 'That stack is capped. Scrap or switch lanes.',
            src: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp'
        }
    };

    const state = states[mode] || states.success;
    title.textContent = state.title;
    text.textContent = state.text;
    img.src = state.src;
    img.alt = state.title;
    panel.classList.add('is-visible');
    clearTimeout(feedbackTimeout);
    feedbackTimeout = setTimeout(() => panel.classList.remove('is-visible'), 1600);
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: type === 'heavy' ? 'heavy' : 'light' }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 20 : 10);
    }
}

/**
 * Config & Init
 */
window.gameConfigDefs = {
    "gridSize": { "type": "number", "label": "Plot Size", "value": 8, "min": 4, "max": 12 },
    "skyColor": { "type": "color", "label": "Sky Color", "value": "#2C3E50" },
    "groundColor": { "type": "color", "label": "Ground Color", "value": "#34495E" }
};
window.gameConfig = {
    gridSize: 8,
    skyColor: "#2C3E50",
    groundColor: "#34495E"
};

function updateGameConfig(key, val) {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'gridSize') resetGame();
    }
}

document.addEventListener('DOMContentLoaded', () => {
    // Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const usrCfg = JSON.parse(cfgEl.textContent);
            Object.keys(usrCfg).forEach(k => {
                if (window.gameConfigDefs[k]) window.gameConfig[k] = usrCfg[k].value;
            });
        }
    } catch(e) {}

    // Setup Canvas
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // Setup UI
    setupPalette();
    document.getElementById('reset-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('ui', { volume: 0.22, minInterval: 120 });
        resetGame();
    });

    document.addEventListener('visibilitychange', () => {
        syncBgmPlayback(!document.hidden);
    });

    // Observer
    ro = new ResizeObserver(entries => {
        for (let entry of entries) {
            const cr = entry.contentRect;
            resize(cr.width, cr.height);
        }
    });
    ro.observe(canvas);

    // Input
    window.addEventListener('pointerdown', handleInputStart, { passive: false });
    window.addEventListener('pointermove', handleInputMove, { passive: false });
    window.addEventListener('pointerup', handleInputEnd, { passive: false });
    window.addEventListener('pointercancel', handleInputEnd, { passive: false });
});

function setupPalette() {
    const p = document.getElementById('palette');
    p.innerHTML = '';
    CONFIG.blocks.forEach(b => {
        const btn = document.createElement('div');
        btn.className = `w-10 h-10 rounded-lg m-1 cursor-pointer transition-all border-2 flex items-center justify-center interactive palette-chip`;
        btn.title = `${b.name} block`;
        btn.setAttribute('aria-label', `${b.name} block`);
        btn.style.background = `linear-gradient(180deg, ${b.top}, ${b.color} 55%, ${b.side})`;
        btn.style.borderColor = b.top;
        if (b.id === selectedBlockId) btn.classList.add('ring-2', 'ring-white');
        
        btn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            unlockAudio();
            playSfx('ui');
            selectedBlockId = b.id;
            updatePaletteUI();
        });
        p.appendChild(btn);
    });
}

function updatePaletteUI() {
    const btns = document.getElementById('palette').children;
    Array.from(btns).forEach((btn, idx) => {
        if (CONFIG.blocks[idx].id === selectedBlockId) {
            btn.classList.add('ring-2', 'ring-white', 'scale-110');
        } else {
            btn.classList.remove('ring-2', 'ring-white', 'scale-110');
        }
    });
}

function resize(width, height) {
    cw = width;
    ch = height;
    dpr = window.devicePixelRatio || 1;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Center camera
    camera.x = cw / 2;
    camera.y = ch / 2 + (window.gameConfig.gridSize * CONFIG.tileSize) / 2;
    camera.zoom = Math.min(cw, ch) / (window.gameConfig.gridSize * CONFIG.tileSize * 2.5);

    if (!initialized) {
        initGame();
        initialized = true;
        requestAnimationFrame(gameLoop);
    }
}

function initGame() {
    resetGame();
    unlockAudio(); // Attempt L1 unlock
}

function resetGame() {
    grid = {};
    blockCount = 0;
    particles = [];
    document.getElementById('score-display').innerText = '0';
    
    // Create base floor
    // Actually, we render a grid, no need to store floor blocks to save memory
}

/**
 * Logic & Physics
 */
function handleInputStart(e) {
    if (e.target.closest('.interactive')) return;
    e.preventDefault();
    unlockAudio();
    
    activeTouchId = e.pointerId;
    pointer.isDown = true;
    pointer.startX = e.clientX - canvas.getBoundingClientRect().left;
    pointer.startY = e.clientY - canvas.getBoundingClientRect().top;
    pointer.downTime = Date.now();
    pointer.x = pointer.startX;
    pointer.y = pointer.startY;
}

function handleInputMove(e) {
    if (e.pointerId !== activeTouchId) return;
    e.preventDefault();
    pointer.x = e.clientX - canvas.getBoundingClientRect().left;
    pointer.y = e.clientY - canvas.getBoundingClientRect().top;
}

function handleInputEnd(e) {
    if (e.pointerId !== activeTouchId) return;
    e.preventDefault();
    
    const dx = pointer.x - pointer.startX;
    const dy = pointer.y - pointer.startY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const duration = Date.now() - pointer.downTime;
    
    if (dist < 10) {
        // Tap detected
        handleTap(pointer.x, pointer.y, duration > 300);
    }
    
    pointer.isDown = false;
    activeTouchId = null;
}

function isoToScreen(gx, gy, gz) {
    const tileW = CONFIG.tileSize * camera.zoom * 2;
    const tileH = CONFIG.tileSize * camera.zoom;
    
    const sx = (gx - gy) * tileW / 2 + camera.x;
    const sy = (gx + gy) * tileH / 2 + camera.y - (gz * tileH);
    return { x: sx, y: sy };
}

function screenToIso(sx, sy) {
    const tileW = CONFIG.tileSize * camera.zoom * 2;
    const tileH = CONFIG.tileSize * camera.zoom;
    
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;

    // This is tricky for 3D stacks. We raycast from top z down.
    // Check intersection with bounding box of each column
    
    // Simple ground plane intersection first
    const gy = (adjY / (tileH/2) - adjX / (tileW/2)) / 2;
    const gx = (adjY / (tileH/2) + adjX / (tileW/2)) / 2;
    
    return { x: Math.round(gx), y: Math.round(gy) };
}

function handleTap(sx, sy, isLongPress) {
    // Raycast logic: Iterate all possible visible blocks from front to back (painter's algo reversed)
    // Or simpler: Iterate grid positions and check bounds
    
    const size = window.gameConfig.gridSize;
    let hit = null;
    let hitZ = -1;

    // Check existing blocks (Top-down check)
    // We need to check in reverse draw order (Front-most first)
    // Draw order is X+Y ascending, Z ascending.
    // Reverse: Z descending, X+Y descending.
    
    // Optimization: Just check the ground plane click, then find the stack height
    // This assumes vertical stacking only, which is true for this game
    
    // But clicking the SIDE of a block should probably place next to it?
    // For simplicity in portrait mobile: Tap a column -> Add to top. Long press -> Remove top.
    
    // Adjust touch for camera
    const rawIso = screenToIso(sx, sy);
    
    // Check bounds
    // Since we have height, the 'y' on screen is shifted up.
    // We need to correct for height.
    // Iterative approach: assume z=0, get x,y. Check stack height. 
    // If stack height > 0, re-project with that z and see if click is still within.
    
    // Better approach for "Stacker":
    // 1. Calculate ground coord (gx, gy) assuming z=0.
    // 2. But since blocks have height, a click at (sx, sy) could be a block at z=5.
    // 3. We iterate all columns (x,y) and check if (sx, sy) is inside the projected rect of the top block.
    
    let bestHit = null;
    let bestZ = -1;

    for (let x = 0; x < size; x++) {
        for (let y = 0; y < size; y++) {
            // Find height of this column
            let z = 0;
            while (grid[`${x},${y},${z}`]) z++;
            
            // Check intersection with the "top" face of the stack (at z)
            // Or the ground tile if z=0
            const pos = isoToScreen(x, y, z); // Position of the POTENTIAL new block or top face
            
            // Hit test radius approx
            const radius = CONFIG.tileSize * camera.zoom * 0.8;
            const dx = sx - pos.x;
            const dy = sy - (pos.y + CONFIG.tileSize * camera.zoom / 2); // Center adjustment
            
            // Simple circular hit test for ease
            if (dx*dx + dy*dy < radius*radius) {
                // We found a candidate. Since we iterate x,y, we need to know which is "closest" to camera.
                // In iso, higher z is closer, higher x+y is closer.
                // Just keep the one with highest visual Z score?
                // Visual sort key: (x+y) + z*2
                const score = (x+y) + z;
                if (score > bestZ) {
                    bestZ = score;
                    bestHit = { x, y, z };
                }
            }
        }
    }

    if (bestHit) {
        if (isLongPress) {
            // Remove top block
            if (bestHit.z > 0) {
                const targetZ = bestHit.z - 1;
                delete grid[`${bestHit.x},${bestHit.y},${targetZ}`];
                spawnParticles(bestHit.x, bestHit.y, targetZ, 'destroy');
                blockCount--;
                vibrate('heavy');
                playSfx('remove', { volume: 0.28, minInterval: 120 });
            }
        } else {
            // Add block
            if (bestHit.z < CONFIG.maxHeight) {
                grid[`${bestHit.x},${bestHit.y},${bestHit.z}`] = selectedBlockId;
                spawnParticles(bestHit.x, bestHit.y, bestHit.z, 'build');
                blockCount++;
                vibrate('light');
                playSfx('build', { volume: 0.26, minInterval: 90 });
                if (blockCount > 0 && blockCount % 6 === 0) {
                    playSfx('bonus', { volume: 0.3, minInterval: 220 });
                    showFeedback('success');
                }
            }
        }
        document.getElementById('score-display').innerText = blockCount;
    } else {
        playSfx('blocked', { volume: 0.24, minInterval: 160 });
        showFeedback('blocked');
    }
}

function spawnParticles(gx, gy, gz, type) {
    const pos = isoToScreen(gx, gy, gz);
    const color = type === 'build' ? '#FFFFFF' : '#7F8C8D';
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: pos.x,
            y: pos.y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5 - 2,
            life: 1.0,
            color: color
        });
    }
}

/**
 * Render
 */
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 10 * dt; // Gravity
        p.life -= 2 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // Background
    ctx.fillStyle = window.gameConfig.skyColor;
    ctx.fillRect(0, 0, cw, ch);
    
     // Draw Neon skyline backdrop
     drawCityBackground();

    // Draw Grid & Blocks
    // Order: x+y ascending, z ascending
    const size = window.gameConfig.gridSize;
    
    // Draw Ground Cursor Highlight
    // (Optional, skipped for simplicity, we highlight on tap)

    for (let sum = 0; sum <= (size-1)*2; sum++) {
        for (let x = 0; x < size; x++) {
            let y = sum - x;
            if (y < 0 || y >= size) continue;
            
            // Draw Ground Tile
            drawIsoTile(x, y);

            // Draw Stack
            let z = 0;
            while (true) {
                const bid = grid[`${x},${y},${z}`];
                if (!bid) break;
                drawBlock(x, y, z, bid);
                z++;
            }
        }
    }

    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * dpr, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

function drawCityBackground() {
    const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
    skyGradient.addColorStop(0, '#1e3477');
    skyGradient.addColorStop(0.45, '#121c49');
    skyGradient.addColorStop(1, '#0b0d20');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, cw, ch);

    const glowGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.14, 10, cw * 0.5, ch * 0.14, cw * 0.45);
    glowGradient.addColorStop(0, 'rgba(107, 243, 255, 0.12)');
    glowGradient.addColorStop(0.35, 'rgba(255, 101, 212, 0.08)');
    glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glowGradient;
    ctx.fillRect(0, 0, cw, ch);

    const moonX = cw * 0.82;
    const moonY = ch * 0.16;
    const moonR = Math.max(28, Math.min(cw, ch) * 0.06);
    const moonGradient = ctx.createRadialGradient(moonX, moonY, moonR * 0.2, moonX, moonY, moonR);
    moonGradient.addColorStop(0, 'rgba(255, 250, 220, 0.95)');
    moonGradient.addColorStop(0.4, 'rgba(255, 216, 107, 0.62)');
    moonGradient.addColorStop(1, 'rgba(255, 216, 107, 0)');
    ctx.fillStyle = moonGradient;
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.strokeStyle = 'rgba(107, 243, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let y = ch * 0.55; y < ch; y += 28) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }
    ctx.restore();

    const buildingWidth = 42;
    const numBuildings = Math.ceil(cw / buildingWidth) + 2;

    for (let i = 0; i < numBuildings; i++) {
        const x = i * buildingWidth;
        const h = ch * 0.16 + Math.abs(Math.sin(i * 1.713)) * ch * 0.18 + ((i % 5) * 10);
        const towerGradient = ctx.createLinearGradient(0, ch - h, 0, ch);
        towerGradient.addColorStop(0, i % 2 === 0 ? '#223178' : '#1a225a');
        towerGradient.addColorStop(1, '#09111f');
        ctx.fillStyle = towerGradient;
        ctx.fillRect(x, ch - h, buildingWidth + 3, h);

        if (i % 3 === 1) {
            ctx.fillStyle = 'rgba(255, 101, 212, 0.4)';
            ctx.fillRect(x + buildingWidth * 0.72, ch - h + 6, 2, h - 6);
        }

        for (let wy = ch - h + 14; wy < ch - 8; wy += 18) {
            for (let wx = x + 8; wx < x + buildingWidth - 8; wx += 10) {
                const lit = ((i + Math.floor(wy)) % 3 === 0) || (wx % 4 === 0);
                if (!lit) continue;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(107, 243, 255, 0.75)' : 'rgba(255, 216, 107, 0.72)';
                ctx.fillRect(wx, wy, 4, 8);
            }
        }
    }

    ctx.fillStyle = 'rgba(17, 28, 58, 0.75)';
    ctx.fillRect(0, ch * 0.84, cw, ch * 0.16);

    ctx.save();
    ctx.font = `${Math.max(12, cw * 0.018)}px "Orbitron", "Rajdhani", sans-serif`;
    ctx.fillStyle = 'rgba(107, 243, 255, 0.5)';
    ctx.textAlign = 'left';
    ctx.fillText('NEON GRID // BUILD TO THE BEAT', 18, Math.max(26, ch * 0.08));
    ctx.restore();
}

function drawIsoTile(gx, gy) {
    const pos = isoToScreen(gx, gy, 0);
    const tileW = CONFIG.tileSize * camera.zoom * 2;
    const tileH = CONFIG.tileSize * camera.zoom;
    const centerX = pos.x;
    const centerY = pos.y + tileH * 0.5;

    const tileGradient = ctx.createLinearGradient(pos.x, pos.y, pos.x, pos.y + tileH);
    tileGradient.addColorStop(0, shadeColor(window.gameConfig.groundColor, 20));
    tileGradient.addColorStop(1, shadeColor(window.gameConfig.groundColor, -18));
    ctx.fillStyle = tileGradient;

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineTo(pos.x + tileW/2, pos.y + tileH/2);
    ctx.lineTo(pos.x, pos.y + tileH);
    ctx.lineTo(pos.x - tileW/2, pos.y + tileH/2);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(107, 243, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y + 1);
    ctx.lineTo(pos.x + tileW/2 - 2, pos.y + tileH/2);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = `rgba(107, 243, 255, ${0.05 + ((gx + gy) % 3) * 0.015})`;
    ctx.beginPath();
    ctx.arc(centerX, centerY, Math.max(2, tileH * 0.08), 0, Math.PI * 2);
    ctx.fill();
}

function drawBlock(gx, gy, gz, typeId) {
    const pos = isoToScreen(gx, gy, gz);
    const tileW = CONFIG.tileSize * camera.zoom * 2;
    const tileH = CONFIG.tileSize * camera.zoom;
    const blockH = tileH;
    const block = CONFIG.blocks.find(b => b.id === typeId) || CONFIG.blocks[0];
    const pulse = 0.92 + Math.sin((performance.now() * 0.0025) + gx + gy + gz) * 0.04;

    if (block.alpha) ctx.globalAlpha = block.alpha;

    ctx.save();
    ctx.shadowColor = block.top;
    ctx.shadowBlur = 14 * pulse;

    const topGradient = ctx.createLinearGradient(pos.x, pos.y - blockH, pos.x, pos.y - blockH + tileH);
    topGradient.addColorStop(0, shadeColor(block.top, 18));
    topGradient.addColorStop(1, block.top);
    ctx.fillStyle = topGradient;
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y - blockH);
    ctx.lineTo(pos.x + tileW/2, pos.y - blockH + tileH/2);
    ctx.lineTo(pos.x, pos.y - blockH + tileH);
    ctx.lineTo(pos.x - tileW/2, pos.y - blockH + tileH/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    const rightGradient = ctx.createLinearGradient(pos.x + tileW/2, pos.y - blockH, pos.x, pos.y + tileH);
    rightGradient.addColorStop(0, shadeColor(block.side, 8));
    rightGradient.addColorStop(1, shadeColor(block.side, -12));
    ctx.fillStyle = rightGradient;
    ctx.beginPath();
    ctx.moveTo(pos.x + tileW/2, pos.y - blockH + tileH/2);
    ctx.lineTo(pos.x + tileW/2, pos.y + tileH/2);
    ctx.lineTo(pos.x, pos.y + tileH);
    ctx.lineTo(pos.x, pos.y - blockH + tileH);
    ctx.closePath();
    ctx.fill();

    const leftGradient = ctx.createLinearGradient(pos.x - tileW/2, pos.y - blockH, pos.x, pos.y + tileH);
    leftGradient.addColorStop(0, shadeColor(block.color, 12));
    leftGradient.addColorStop(1, shadeColor(block.color, -12));
    ctx.fillStyle = leftGradient;
    ctx.beginPath();
    ctx.moveTo(pos.x - tileW/2, pos.y - blockH + tileH/2);
    ctx.lineTo(pos.x - tileW/2, pos.y + tileH/2);
    ctx.lineTo(pos.x, pos.y + tileH);
    ctx.lineTo(pos.x, pos.y - blockH + tileH);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(107,243,255,0.18)';
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y - blockH + 2);
    ctx.lineTo(pos.x + tileW/2 - 2, pos.y - blockH + tileH/2);
    ctx.stroke();

    if (gz === 0 && typeId === selectedBlockId) {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y + tileH * 0.2, Math.max(4, tileH * 0.22), 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1.0;
}

function shadeColor(hex, percent) {
    const value = hex.replace('#', '');
    const num = parseInt(value, 16);
    const amt = Math.round(2.55 * percent);
    const r = Math.min(255, Math.max(0, (num >> 16) + amt));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
    return `rgb(${r}, ${g}, ${b})`;
}
