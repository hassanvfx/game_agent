<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Route Courier</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide, ui=Exo 2 via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-gold: #ffd76a;
            --color-purple-dark: #070b18;
            --color-accent: #41f0ff;
            --color-panel: rgba(7, 16, 33, 0.86);
            --color-panel-strong: rgba(13, 24, 48, 0.94);
            --color-sky: #78d7ff;
            --color-warning: #ff6b8f;
            --color-route: rgba(124, 92, 255, 0.28);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background:
                radial-gradient(circle at top, rgba(65, 240, 255, 0.1), transparent 38%),
                linear-gradient(180deg, #08101f 0%, #070b18 48%, #13081e 100%);
            color: #fff;
            font-family: 'Exo 2', system-ui, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        h1, h2, h3, .font-cinzel, .font-display { font-family: 'Audiowide', 'Exo 2', sans-serif; letter-spacing: 0.05em; }
        .font-sans { font-family: 'Exo 2', system-ui, sans-serif; }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            touch-action: none;
            pointer-events: none;
        }

        /* UI Components */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(15, 26, 52, 0.94), rgba(7, 13, 28, 0.9)),
                radial-gradient(circle at top, rgba(65, 240, 255, 0.14), transparent 56%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(120, 215, 255, 0.24);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 18px rgba(65, 240, 255, 0.08);
        }

        .text-gold { color: var(--color-gold); text-shadow: 0 0 12px rgba(255, 215, 106, 0.35); }
        .text-accent { color: var(--color-accent); text-shadow: 0 0 10px rgba(65, 240, 255, 0.35); }
        .text-shadow { text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        
        .safe-area-inset::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 12%, rgba(65, 240, 255, 0.08), transparent 22%),
                linear-gradient(180deg, rgba(120, 215, 255, 0.05), transparent 26%);
        }

        .btn {
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, filter 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; filter: grayscale(1); pointer-events: none; }

        .btn-primary {
            background: linear-gradient(135deg, #ffe18a 0%, #ffb85c 100%);
            color: #172033;
            box-shadow: 0 6px 18px rgba(255, 190, 95, 0.24);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #1a4678 0%, #312a7d 100%);
            color: #dbf8ff;
            box-shadow: 0 6px 18px rgba(42, 112, 255, 0.24);
        }

        /* Map Nodes */
        .btn-map-node {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), transparent 30%),
                linear-gradient(180deg, #14213f 0%, #0a1022 100%);
            border: 2px solid rgba(116, 143, 193, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            box-shadow: 0 8px 18px rgba(0,0,0,0.45);
        }
        .btn-map-node.unlocked {
            border-color: #78d7ff;
            background: linear-gradient(135deg, #182a57 0%, #27357a 55%, #11203c 100%);
            color: #fff;
            box-shadow: 0 0 18px rgba(120, 215, 255, 0.34);
        }
        .btn-map-node:active { transform: translate(-50%, -50%) scale(0.9); }
        
        .map-line {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0.1), var(--color-route));
            transform-origin: 0 50%;
            z-index: 5;
            border-radius: 2px;
            pointer-events: none;
        }
        .map-line.unlocked { background: linear-gradient(90deg, #78d7ff, #ffd76a); box-shadow: 0 0 10px rgba(120,215,255,0.3); }

        .map-label {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .unlocked .map-label { color: #FFD700; border-color: #FFD700; }

        .hidden { display: none !important; }
        
        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.2); }
            50% { box-shadow: 0 0 25px rgba(255,215,0,0.5); }
        }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }

        @keyframes float-up {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
        }
        .float-text {
            position: absolute;
            color: #FFD700;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            animation: float-up 1s ease-out forwards;
            z-index: 100;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #toast {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 50;
            width: 80%;
            text-align: center;
        }
        #toast.show { opacity: 1; }

        /* Map Container */
        #map-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background-color: #0b1226;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(65, 240, 255, 0.16) 0%, transparent 50%),
                radial-gradient(circle at 20% 20%, rgba(255, 215, 106, 0.08) 0%, transparent 24%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            position: relative;
            cursor: grab;
        }
        #map-container:active { cursor: grabbing; }
        #map-container::-webkit-scrollbar { display: none; }
        #map-content {
            width: 200%;
            height: 150%;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.1s ease-out;
        }

        /* Shop Tabs */
        .btn-tab {
            background: rgba(0,0,0,0.3);
            color: #9aa9c6;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .btn-tab.active {
            background: rgba(255,255,255,0.05);
            color: #78d7ff;
            border-bottom: 2px solid #78d7ff;
        }

        .hero-emblem {
            width: 126px;
            height: 126px;
            margin: 0 auto 0.5rem;
            border-radius: 34px;
            position: relative;
            background:
                radial-gradient(circle at 50% 32%, rgba(255,255,255,0.45), transparent 18%),
                linear-gradient(180deg, rgba(116, 211, 255, 0.28), rgba(255, 215, 106, 0.12)),
                rgba(5, 12, 26, 0.8);
            border: 1px solid rgba(120, 215, 255, 0.28);
            box-shadow:
                0 0 28px rgba(65, 240, 255, 0.16),
                inset 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .hero-emblem::before {
            content: "";
            position: absolute;
            inset: 18px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, rgba(44, 95, 169, 0.9), rgba(13, 30, 64, 0.95));
            clip-path: polygon(50% 0%, 88% 20%, 100% 66%, 74% 100%, 26% 100%, 0% 66%, 12% 20%);
            box-shadow: 0 0 18px rgba(120, 215, 255, 0.22);
        }

        .hero-emblem::after {
            content: "🚀";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 3.3rem;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
            transform: translateY(-2px);
        }

        .hud-badge {
            background: linear-gradient(180deg, rgba(14, 27, 53, 0.95), rgba(8, 14, 30, 0.88));
            border: 1px solid rgba(120, 215, 255, 0.22);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.24);
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 6.5rem;
            width: min(28vw, 120px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 35;
            background: rgba(3, 8, 20, 0.75);
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.loss {
            right: auto;
            left: 1rem;
            bottom: 7rem;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col safe-area-inset">
        
        <!-- HUD -->
        <div id="hud" class="w-full p-4 flex justify-between items-start hidden z-10 pt-12">
            <div class="flex flex-col gap-1">
                <div class="glass-panel hud-badge px-3 py-1 rounded-full flex items-center gap-2">
                    <span class="text-xl">🪙</span>
                    <span id="score-display" class="text-xl font-bold text-white font-cinzel">0</span>
                </div>
                <div class="flex flex-col">
                    <div class="text-[10px] text-white/60 font-bold tracking-widest uppercase pl-2">Distance</div>
                    <div class="w-24 h-1 bg-white/20 rounded-full mt-1 ml-1 overflow-hidden">
                        <div id="distance-bar" class="h-full bg-gold w-0"></div>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <div id="lives-container" class="flex gap-1 text-xl drop-shadow-md"></div>
                <div id="powerup-hud" class="hidden flex items-center gap-2 bg-black/40 px-2 py-1 rounded-full border border-cyan-500/30">
                    <span class="text-xs">🧲</span>
                    <div class="w-12 h-1 bg-gray-700 rounded-full overflow-hidden">
                        <div id="powerup-bar" class="h-full bg-cyan-400"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="glass-panel px-6 py-3 rounded-xl text-gold font-bold font-cinzel text-sm shadow-lg border-gold/50">
            <div id="toast-title" class="text-lg mb-1">NOTIFICATION</div>
            <div id="toast-msg" class="text-xs text-white/80 font-sans">Message body</div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto z-20 bg-black/40 backdrop-blur-sm transition-opacity duration-300">
            <div class="glass-panel p-8 rounded-2xl text-center w-11/12 max-w-sm flex flex-col gap-6 animate-float">
                <div>
                    <div class="hero-emblem" aria-hidden="true"></div>
                    <h1 class="text-4xl font-bold text-gold tracking-widest mb-1 text-shadow">SKY ROUTE COURIER</h1>
                    <p class="text-[10px] text-white/50 tracking-[0.4em] uppercase">Stormlane Dispatch</p>
                </div>

                <div class="bg-black/40 rounded-lg p-4 border border-white/10 relative overflow-hidden">
                    <div class="flex justify-between text-sm font-bold mb-2 font-cinzel items-end">
                        <span id="menu-level" class="text-purple-300 text-lg">Tier 1</span>
                        <div class="text-right">
                            <div id="menu-coins" class="text-gold text-xl">0 🪙</div>
                            <div id="menu-income" class="text-[10px] text-green-400 font-sans tracking-wide">+0/sec</div>
                        </div>
                    </div>
                    <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mb-1">
                        <div id="menu-xp-bar" class="h-full bg-green-500 w-0 transition-all duration-500"></div>
                    </div>
                    <div class="text-[9px] text-white/30 uppercase tracking-widest text-left">Progress to Tier Bonus</div>
                </div>

                <div class="space-y-3 w-full">
                    <button id="btn-open-map" class="btn btn-primary w-full py-4 rounded-xl text-lg animate-pulse-glow">
                        Flight Map
                    </button>
                    <button id="btn-shop" class="btn btn-secondary w-full py-3 rounded-xl text-sm">
                        Hangar & Upgrades
                    </button>
                </div>
            </div>
        </div>

        <!-- Map Screen -->
        <div id="map-screen" class="absolute inset-0 pointer-events-auto hidden z-20 bg-black">
            <div id="map-container">
                <div id="map-content">
                    <!-- Nodes generated by JS -->
                </div>
            </div>
            
            <!-- Map UI Overlay -->
            <div class="absolute top-0 left-0 w-full p-4 pt-12 pointer-events-none flex justify-between items-start bg-gradient-to-b from-black/80 to-transparent">
                <div class="pointer-events-auto">
                    <button id="btn-map-back" class="btn btn-secondary px-4 py-2 rounded-lg text-xs">Back</button>
                </div>
                <div class="text-right">
                    <h2 class="text-gold font-cinzel text-lg font-bold">Delivery Routes</h2>
                    <p class="text-[10px] text-white/60 uppercase tracking-widest">Unlock New Air Corridors</p>
                </div>
            </div>
            
            <div class="absolute bottom-6 left-0 w-full text-center pointer-events-none">
                <span class="bg-black/60 px-3 py-1 rounded-full text-[10px] text-white/50 uppercase tracking-widest backdrop-blur-sm">
                    Drag to Pan • Tap a Route to Launch
                </span>
            </div>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="absolute inset-0 bg-black/95 pointer-events-auto hidden z-30 flex flex-col">
            <div class="p-4 pt-12 border-b border-white/10 flex justify-between items-center bg-[#1a0b2e]">
                <div>
                    <h2 class="text-xl text-gold font-bold font-cinzel">The Hangar</h2>
                    <div id="shop-income-display" class="text-[10px] text-green-400 font-bold">+0/sec</div>
                </div>
                <div id="shop-coins-display" class="font-bold text-white text-xl">0 🪙</div>
            </div>

            <div class="flex w-full text-sm font-bold bg-[#1a0b2e]/50">
                <button id="tab-upgrades" class="flex-1 py-4 btn-tab active" onclick="game.switchShopTab('upgrades')">UPGRADES</button>
                <button id="tab-ships" class="flex-1 py-4 btn-tab" onclick="game.switchShopTab('ships')">GLIDERS</button>
            </div>

            <div id="shop-content" class="flex-1 overflow-y-auto p-4 space-y-3 pb-24"></div>

            <div class="p-4 border-t border-white/10 bg-[#1a0b2e] absolute bottom-0 w-full safe-area-bottom">
                <button id="btn-close-shop" class="btn btn-secondary w-full py-3 rounded-xl font-bold">Back</button>
            </div>
        </div>

        <!-- Game Over / Win Screen -->
        <img id="hit-gif" class="feedback-gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Impact reaction" aria-hidden="true">
        <img id="result-gif" class="feedback-gif loss" src="https://i.giphy.com/3qKs2fWAFDCJQmndSt.webp" alt="Route result reaction" aria-hidden="true">

        <div id="result-screen" class="absolute inset-0 flex items-center justify-center pointer-events-auto hidden z-30 bg-black/80 backdrop-blur-md">
            <div class="glass-panel p-6 rounded-2xl text-center w-11/12 max-w-sm border-white/10">
                <h2 id="result-title" class="text-3xl font-bold mb-1 font-cinzel text-shadow">TITLE</h2>
                <p id="result-subtitle" class="text-xs text-white/40 mb-6 uppercase tracking-widest">Subtitle</p>
                
                <div class="bg-black/40 p-4 rounded-lg mb-6 space-y-3 border border-white/5">
                    <div class="flex justify-between items-center">
                        <span class="text-white/60 text-sm">Delivery Pay</span>
                        <span id="result-coins" class="text-gold font-bold">+0</span>
                    </div>
                    
                    <!-- Level Up Section -->
                    <div id="levelup-section" class="hidden">
                        <div class="h-px bg-white/10 w-full my-2"></div>
                        <div class="flex flex-col gap-1 bg-green-900/20 p-2 rounded border border-green-500/30 animate-pulse-glow">
                            <div class="text-accent font-bold text-sm tracking-widest">TIER UP!</div>
                            <div class="flex justify-between items-center">
                                <span class="text-white/80 text-xs">Tier Bonus</span>
                                <span id="result-levelup-reward" class="text-gold font-bold">+500</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="btn-result-action" class="btn btn-primary w-full py-3 rounded-xl font-bold">Continue</button>
                </div>
            </div>
        </div>
    </div>

    <script>
         /**
          * SKY ROUTE COURIER
          * Features: Vertical scroller, branching route map, passive income, delivery-run framing
          */

        const CONFIG = {
            baseSpeed: 6,
            speedInc: 0.001,
            maxSpeed: 15,
            passiveTickRate: 1000 // ms
        };

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            resultLoops: {
                win: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
                lose: "https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3"
            },
            sfx: {
                coin: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                magic: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3",
                levelup: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                success: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/1AjEBGWggGXh9onllB.webp",
                win: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp",
                lose: "https://i.giphy.com/3qKs2fWAFDCJQmndSt.webp"
            }
        };

        // --- Expanded World Data (Including Kore Update) ---
        const ZONES = [
            // Tier 1: Start
            { id: 'oasis', name: 'Hidden Oasis', icon: '🏜️', x: 50, y: 90, distance: 1000, colors: ['#0f0518', '#240b36'], difficulty: 1.0, unlocks: ['canyon', 'dunes'] },
            
            // Tier 2: Split Paths
            { id: 'canyon', name: 'Crimson Canyon', icon: '🌋', x: 20, y: 75, distance: 1500, colors: ['#3E0000', '#8B0000'], difficulty: 1.2, unlocks: ['peaks'] },
            { id: 'dunes', name: 'Whispering Dunes', icon: '🦂', x: 80, y: 80, distance: 1500, colors: ['#4b3621', '#d4af37'], difficulty: 1.2, unlocks: ['citadel'] },
            
            // Tier 3: Mid-Game
            { id: 'peaks', name: 'Sapphire Peaks', icon: '🏔️', x: 25, y: 50, distance: 2000, colors: ['#001020', '#004050'], difficulty: 1.4, unlocks: ['bazaar'] },
            { id: 'citadel', name: 'Iron Citadel', icon: '🏭', x: 85, y: 55, distance: 2200, colors: ['#1a1a1a', '#b7410e'], difficulty: 1.5, unlocks: ['bazaar'] },
            
            // Tier 4: Convergence Hub
            { id: 'bazaar', name: 'Cloud Bazaar', icon: '🎪', x: 55, y: 40, distance: 2500, colors: ['#2e003e', '#ff00cc'], difficulty: 1.6, unlocks: ['palace', 'crater', 'kore_gate'] },
            
            // Tier 5A: Celestial Path
            { id: 'palace', name: 'Celestial Palace', icon: '🏰', x: 85, y: 25, distance: 3000, colors: ['#202030', '#E0E0E0'], difficulty: 1.8, unlocks: ['void'] },
            { id: 'crater', name: 'Starfall Crater', icon: '☄️', x: 20, y: 25, distance: 3200, colors: ['#051e3e', '#85d9bf'], difficulty: 1.9, unlocks: ['void'] },

            // Tier 5B: Kore Worlds (New Update)
            { id: 'kore_gate', name: 'Gate of Kore', icon: '⛩️', x: 55, y: 28, distance: 3500, colors: ['#1a0505', '#4a0000'], difficulty: 1.7, unlocks: ['kore_depths'] },
            { id: 'kore_depths', name: 'Crystal Hollow', icon: '💎', x: 55, y: 18, distance: 4000, colors: ['#000022', '#00ffff'], difficulty: 2.0, unlocks: ['kore_throne'] },
            { id: 'kore_throne', name: 'Queen\'s Throne', icon: '👑', x: 55, y: 10, distance: 4500, colors: ['#000000', '#9c27b0'], difficulty: 2.2, unlocks: ['void'] },

            // Tier 6: Final Challenge
            { id: 'void', name: 'The Void Edge', icon: '🌌', x: 55, y: 2, distance: 6000, colors: ['#000000', '#4a00e0'], difficulty: 2.5, unlocks: [] }
        ];

        const SHIPS = [
            { id: 'nomad', name: 'Courier', desc: 'A dependable starter glider.', cost: 0, color: '#8e24aa', accent: '#FFD700', trail: '#FFD700' },
            { id: 'royal', name: 'Express', desc: 'A polished frame built for fast lanes.', cost: 1500, color: '#1565c0', accent: '#E0E0E0', trail: '#40c4ff' },
            { id: 'shadow', name: 'Stealth', desc: 'Quiet handling for risky routes.', cost: 3500, color: '#212121', accent: '#00e676', trail: '#00e676' },
            { id: 'inferno', name: 'Afterburn', desc: 'A hotshot shell for elite dispatches.', cost: 8000, color: '#b71c1c', accent: '#ff6e40', trail: '#ff3d00' }
        ];

        const UPGRADES = [
            { id: 'lives', name: 'Reinforced Hull', desc: 'Start with +1 Hull', icon: '❤️', max: 3, cost: l => 500 * (l + 1) },
            { id: 'magnet', name: 'Cargo Magnet', desc: 'Pickup Range +20%', icon: '🧲', max: 5, cost: l => 300 * (l + 1) },
            { id: 'luck', name: 'Lucky Dispatch', desc: 'More bonus drops', icon: '✨', max: 5, cost: l => 600 * (l + 1) }
        ];

        // --- Save System ---
        const DEFAULT_SAVE = {
            coins: 0,
            xp: 0,
            level: 1,
            unlockedShips: ['nomad'],
            activeShip: 'nomad',
            upgrades: { lives: 0, magnet: 0, luck: 0 },
            unlockedZones: ['oasis'],
            lastSaveTime: Date.now()
        };

        let saveData = JSON.parse(localStorage.getItem('skyRiderMK_v3')) || JSON.parse(JSON.stringify(DEFAULT_SAVE));
        
        // Migration check
        if (!saveData.lastSaveTime) saveData.lastSaveTime = Date.now();
        if (!saveData.unlockedZones.includes('oasis')) saveData.unlockedZones.push('oasis');

        function saveGame() {
            saveData.lastSaveTime = Date.now();
            localStorage.setItem('skyRiderMK_v3', JSON.stringify(saveData));
            game.updateMenuUI();
        }

        // --- Audio Manager ---
        const AudioSys = {
            ctx: null, buffers: {}, bgm: null, resultLoop: null, muted: false, initializedByGesture: false,
            init: function() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    for (let key in ASSETS.sfx) {
                        fetch(ASSETS.sfx[key]).then(r => r.arrayBuffer()).then(b => this.ctx.decodeAudioData(b)).then(d => { this.buffers[key] = d; }).catch(() => {});
                    }
                }
                if (!this.bgm) {
                    this.bgm = new Audio(ASSETS.bgm);
                    this.bgm.loop = true;
                    this.bgm.volume = 0.2;
                    this.bgm.preload = 'auto';
                }
                if (!this.resultLoop) {
                    this.resultLoop = new Audio();
                    this.resultLoop.loop = true;
                    this.resultLoop.volume = 0.2;
                    this.resultLoop.preload = 'auto';
                }
                this.initializedByGesture = true;
            },
            playSFX: function(key, pitchVar = 0, volume = 0.5) {
                if (!this.ctx || this.muted || !this.buffers[key]) return;
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                const src = this.ctx.createBufferSource();
                src.buffer = this.buffers[key];
                if (pitchVar > 0) src.playbackRate.value = 1.0 + (Math.random() * pitchVar * 2 - pitchVar);
                const gain = this.ctx.createGain();
                gain.gain.value = volume;
                src.connect(gain);
                gain.connect(this.ctx.destination);
                src.start(0);
            },
            playLoop: function(audioEl, shouldPlay) {
                if (!audioEl) return;
                if (shouldPlay && !this.muted && this.initializedByGesture) audioEl.play().catch(() => {});
                else {
                    audioEl.pause();
                    audioEl.currentTime = 0;
                }
            },
            toggleBGM: function(play) {
                this.playLoop(this.bgm, play);
            },
            playResultLoop: function(type) {
                if (!this.resultLoop || !ASSETS.resultLoops[type]) return;
                this.resultLoop.src = ASSETS.resultLoops[type];
                this.playLoop(this.resultLoop, true);
            },
            stopResultLoop: function() {
                this.playLoop(this.resultLoop, false);
            },
            stopAll: function() {
                this.toggleBGM(false);
                this.stopResultLoop();
            }
        };

        // --- Map System ---
        const MapSys = {
            container: document.getElementById('map-content'),
            isDragging: false, startX: 0, startY: 0, scrollLeft: 0, scrollTop: 0,
            init: function() {
                this.render();
                const wrapper = document.getElementById('map-container');
                // Scroll to bottom center initially (start zone)
                setTimeout(() => {
                    wrapper.scrollTop = wrapper.scrollHeight;
                    wrapper.scrollLeft = (wrapper.scrollWidth - wrapper.clientWidth) / 2;
                }, 100);

                wrapper.addEventListener('touchstart', e => {
                    this.isDragging = true;
                    this.startX = e.touches[0].pageX - wrapper.offsetLeft;
                    this.startY = e.touches[0].pageY - wrapper.offsetTop;
                    this.scrollLeft = wrapper.scrollLeft;
                    this.scrollTop = wrapper.scrollTop;
                }, {passive: true});
                wrapper.addEventListener('touchend', () => { this.isDragging = false; });
                wrapper.addEventListener('touchmove', e => {
                    if (!this.isDragging) return;
                    const x = e.touches[0].pageX - wrapper.offsetLeft;
                    const y = e.touches[0].pageY - wrapper.offsetTop;
                    wrapper.scrollLeft = this.scrollLeft - (x - this.startX) * 1.5;
                    wrapper.scrollTop = this.scrollTop - (y - this.startY) * 1.5;
                }, {passive: true});
            },
            render: function() {
                this.container.innerHTML = '';
                ZONES.forEach(zone => {
                    if (zone.unlocks.length > 0) {
                        zone.unlocks.forEach(targetId => {
                            const target = ZONES.find(z => z.id === targetId);
                            if (target) this.drawPath(zone, target);
                        });
                    }
                });
                ZONES.forEach(zone => {
                    const isUnlocked = saveData.unlockedZones.includes(zone.id);
                    const btn = document.createElement('div');
                    btn.className = `btn-map-node ${isUnlocked ? 'unlocked' : ''}`;
                    btn.style.left = `${zone.x}%`;
                    btn.style.top = `${zone.y}%`;
                    btn.innerHTML = `<div>${zone.icon}</div><div class="map-label">${zone.name}</div>`;
                    if (isUnlocked) btn.onclick = () => game.startRun(zone.id);
                    else { btn.style.opacity = '0.5'; btn.style.filter = 'grayscale(1)'; }
                    this.container.appendChild(btn);
                });
            },
            drawPath: function(z1, z2) {
                const line = document.createElement('div');
                const isUnlocked = saveData.unlockedZones.includes(z2.id);
                line.className = `map-line ${isUnlocked ? 'unlocked' : ''}`;
                const dist = Math.sqrt(Math.pow(z2.x-z1.x, 2) + Math.pow(z2.y-z1.y, 2));
                const angle = Math.atan2(z2.y-z1.y, z2.x-z1.x) * 180 / Math.PI;
                line.style.width = `${dist}%`;
                line.style.left = `${z1.x}%`;
                line.style.top = `${z1.y}%`;
                line.style.transform = `rotate(${angle}deg)`;
                this.container.appendChild(line);
            }
        };

        // --- Game Engine ---
        const game = {
            canvas: document.getElementById('gameCanvas'),
            ctx: null,
            width: 0, height: 0,
            state: 'MENU',
            
            // Gameplay Stats
            frame: 0, score: 0, runCoins: 0, lives: 3, speed: CONFIG.baseSpeed,
            currentZone: null,
            
            // Entities
            player: { x: 0, y: 0, targetX: 0, tilt: 0, invincible: 0 },
            obstacles: [], coins: [], particles: [], stars: [],
            
            // Systems
            powerupTimer: 0, djinnTimer: 0, shake: 0, bgOffset: 0,
            
            // Passive Income System
            lastTime: 0,
            incomeAccumulator: 0,

            init: function() {
                this.ctx = this.canvas.getContext('2d', { alpha: false });
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                const handleInput = (x) => {
                    if (this.state !== 'PLAY') return;
                    this.player.targetX = Math.max(30, Math.min(this.width - 30, x));
                };

                this.canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(e.touches[0].clientX); }, { passive: false });
                this.canvas.addEventListener('touchmove', e => { e.preventDefault(); handleInput(e.touches[0].clientX); }, { passive: false });
                this.canvas.addEventListener('mousemove', e => { if(e.buttons === 1) handleInput(e.clientX); });

                // Init Stars
                for(let i=0; i<50; i++) this.stars.push({ x: Math.random(), y: Math.random(), size: Math.random() * 2, alpha: Math.random() });

                // Offline Earnings
                this.processOfflineEarnings();
                
                this.lastTime = performance.now();
                this.updateMenuUI();
                MapSys.init();
                requestAnimationFrame(t => this.loop(t));
            },

            getIncomeRate: function() {
                // Rate = Unlocked Zones * (1 + Level * 0.1)
                const base = saveData.unlockedZones.length;
                const mult = 1 + (saveData.level * 0.1);
                return Math.floor(base * mult * 10) / 10; // 1 decimal place
            },

            processOfflineEarnings: function() {
                const now = Date.now();
                const diffSeconds = (now - saveData.lastSaveTime) / 1000;
                
                if (diffSeconds > 60) { // Minimum 1 minute to show popup
                    const rate = this.getIncomeRate();
                    // Cap at 24 hours (86400 seconds)
                    const cappedSeconds = Math.min(diffSeconds, 86400);
                    const earnings = Math.floor(cappedSeconds * rate);
                    
                    if (earnings > 0) {
                        saveData.coins += earnings;
                        saveGame();
                        this.showToast("ROUTE REPORT", `While you were away, your routes earned ${earnings} coins.`);
                    }
                }
                saveData.lastSaveTime = now;
            },

            resize: function() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                if (this.ctx && this.ctx.setTransform) {
                    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                if (this.state === 'MENU') {
                    this.player.x = this.width / 2;
                    this.player.targetX = this.width / 2;
                    this.player.y = this.height * 0.8;
                }
            },

            startRun: function(zoneId) {
                this.currentZone = ZONES.find(z => z.id === zoneId);
                if (!this.currentZone) return;

                AudioSys.init();
                AudioSys.stopResultLoop();
                AudioSys.toggleBGM(true);
                AudioSys.playSFX('click', 0, 0.28);
                
                this.state = 'PLAY';
                this.canvas.style.pointerEvents = 'auto';
                this.score = 0;
                this.runCoins = 0;
                this.lives = 3 + saveData.upgrades.lives;
                this.speed = CONFIG.baseSpeed * this.currentZone.difficulty;
                this.frame = 0;
                this.powerupTimer = 0;
                this.djinnTimer = 600; 
                this.obstacles = []; this.coins = []; this.particles = [];
                
                this.player.x = this.width / 2;
                this.player.targetX = this.width / 2;
                this.player.y = this.height * 0.8;
                this.player.invincible = 0;
                
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('map-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                this.updateHUD();
            },

            endRun: function(victory) {
                this.state = victory ? 'WIN' : 'OVER';
                this.canvas.style.pointerEvents = 'none';
                AudioSys.toggleBGM(false);
                
                saveData.coins += this.runCoins;
                const xpEarned = Math.floor(this.score / 10);
                saveData.xp += xpEarned;
                
                // Level Up Logic
                const xpNeeded = saveData.level * 500;
                let leveledUp = false;
                let levelReward = 0;

                if (saveData.xp >= xpNeeded) {
                    saveData.xp -= xpNeeded;
                    saveData.level++;
                    leveledUp = true;
                    levelReward = saveData.level * 500; // Reward scales with level
                    saveData.coins += levelReward;
                    AudioSys.playSFX('levelup');
                }

                if (victory) {
                    let newUnlock = false;
                    this.currentZone.unlocks.forEach(uid => {
                        if (!saveData.unlockedZones.includes(uid)) {
                            saveData.unlockedZones.push(uid);
                            newUnlock = true;
                        }
                    });
                    const bonus = 500 * this.currentZone.difficulty;
                    saveData.coins += bonus;
                    this.runCoins += Math.floor(bonus); // Add bonus to display
                }
                
                saveGame();
                MapSys.render();

                // UI Setup
                document.getElementById('hud').classList.add('hidden');
                const screen = document.getElementById('result-screen');
                screen.classList.remove('hidden');
                
                const title = document.getElementById('result-title');
                const sub = document.getElementById('result-subtitle');
                const btn = document.getElementById('btn-result-action');
                const lvlSection = document.getElementById('levelup-section');

                document.getElementById('result-coins').innerText = `+${this.runCoins}`;

                if (leveledUp) {
                    lvlSection.classList.remove('hidden');
                    document.getElementById('result-levelup-reward').innerText = `+${levelReward}`;
                } else {
                    lvlSection.classList.add('hidden');
                }

                if (victory) {
                    AudioSys.playSFX('success', 0.05, 0.42);
                    AudioSys.playResultLoop('win');
                    this.showFeedbackGif('win', 2800);
                    title.innerText = "DELIVERED!";
                    title.className = "text-3xl font-bold mb-1 font-cinzel text-shadow text-gold";
                    sub.innerText = "Route completed";
                    btn.innerText = "Choose Next Route";
                    btn.onclick = () => {
                        AudioSys.playSFX('click', 0, 0.25);
                        AudioSys.stopResultLoop();
                        screen.classList.add('hidden');
                        document.getElementById('map-screen').classList.remove('hidden');
                    };
                } else {
                    AudioSys.playSFX('fail', 0, 0.4);
                    AudioSys.playResultLoop('lose');
                    this.showFeedbackGif('lose', 2800);
                    title.innerText = "ROUTE LOST";
                    title.className = "text-3xl font-bold mb-1 font-cinzel text-shadow text-red-500";
                    sub.innerText = `Distance: ${Math.floor(this.score)}m`;
                    btn.innerText = "Return to Routes";
                    btn.onclick = () => {
                        AudioSys.playSFX('click', 0, 0.25);
                        AudioSys.stopResultLoop();
                        screen.classList.add('hidden');
                        document.getElementById('map-screen').classList.remove('hidden');
                    };
                }
            },

            spawnObstacle: function() {
                const size = 40 + Math.random() * 20;
                this.obstacles.push({
                    x: Math.random() * (this.width - size * 2) + size,
                    y: -100, size: size,
                    speed: this.speed * (0.8 + Math.random() * 0.4),
                    angle: Math.random() * 6, spin: (Math.random() - 0.5) * 0.1
                });
            },

            spawnCoins: function() {
                const x = Math.random() * (this.width - 60) + 30;
                if (Math.random() > 0.95) {
                    this.coins.push({ x: x, y: -50, type: 'magnet', collected: false, anim: 0, fade: 1 });
                } else {
                    for(let i=0; i<5; i++) {
                        this.coins.push({ x: x + Math.sin(i)*10, y: -50 - (i * 40), type: 'coin', collected: false, anim: i, fade: 1 });
                    }
                }
            },

            spawnDjinnGift: function() {
                this.showToast("BONUS DROP!", "Cargo tokens incoming!");
                AudioSys.playSFX('magic');
                const cx = Math.random() * (this.width - 100) + 50;
                const cy = this.height * 0.3;
                for(let i=0; i<10; i++) {
                    const angle = (i / 10) * Math.PI * 2;
                    this.coins.push({ x: cx + Math.cos(angle) * 40, y: cy + Math.sin(angle) * 40, type: 'coin', collected: false, anim: i, fade: 0, fadeIn: true });
                }
                this.spawnExplosion(cx, cy, '#FFD700', 30);
            },

            spawnExplosion: function(x, y, color, count) {
                for(let i=0; i<count; i++) {
                    this.particles.push({
                        x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                        life: 1.0, color: color, size: Math.random() * 3 + 1
                    });
                }
            },

            showToast: function(title, msg) {
                const t = document.getElementById('toast');
                document.getElementById('toast-title').innerText = title;
                document.getElementById('toast-msg').innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            },

            showFeedbackGif: function(type, duration = 1200) {
                const id = type === 'hit' ? 'hit-gif' : 'result-gif';
                const gif = document.getElementById(id);
                if (!gif) return;
                gif.src = ASSETS.gifs[type];
                gif.classList.toggle('loss', type !== 'hit');
                gif.classList.add('show');
                clearTimeout(gif._hideTimer);
                gif._hideTimer = setTimeout(() => gif.classList.remove('show'), duration);
            },

            update: function() {
                if (this.state !== 'PLAY') return;
                
                this.frame++;
                this.speed = Math.min(CONFIG.maxSpeed, this.speed + CONFIG.speedInc);
                this.score += this.speed * 0.05;

                if (this.score >= this.currentZone.distance) { this.endRun(true); return; }
                
                // Physics
                const dx = this.player.targetX - this.player.x;
                this.player.x += dx * 0.15;
                this.player.tilt = dx * -0.01; 
                
                if (this.player.invincible > 0) this.player.invincible--;
                if (this.powerupTimer > 0) this.powerupTimer--;
                if (this.shake > 0) this.shake--;

                this.djinnTimer--;
                if (this.djinnTimer <= 0) {
                    this.spawnDjinnGift();
                    this.djinnTimer = 1000 - (saveData.upgrades.luck * 100) + Math.random() * 500; 
                }

                // Spawning
                const spawnRate = Math.floor(600 / (this.speed * this.currentZone.difficulty));
                if (this.frame % Math.max(20, spawnRate) === 0) this.spawnObstacle();
                if (this.frame % 150 === 0) this.spawnCoins();

                const magnetRange = this.powerupTimer > 0 ? 300 + (saveData.upgrades.magnet * 50) : 100;

                // Entities
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    let ob = this.obstacles[i];
                    ob.y += ob.speed; ob.angle += ob.spin;
                    const dist = Math.hypot(this.player.x - ob.x, this.player.y - ob.y);
                    if (dist < ob.size * 0.5 + 20 && this.player.invincible <= 0) {
                        this.lives--;
                        this.player.invincible = 120;
                        this.shake = 20;
                        AudioSys.playSFX('hit', 0.02, 0.5);
                        this.showFeedbackGif('hit', 700);
                        this.spawnExplosion(this.player.x, this.player.y, '#ff0000', 20);
                        this.updateHUD();
                        if (this.lives <= 0) this.endRun(false);
                    }
                    if (ob.y > this.height + 100) this.obstacles.splice(i, 1);
                }

                for (let i = this.coins.length - 1; i >= 0; i--) {
                    let c = this.coins[i];
                    if (c.fadeIn) { c.fade += 0.05; if (c.fade >= 1) { c.fade = 1; c.fadeIn = false; } }
                    
                    if (!c.collected && magnetRange > 0 && c.fade > 0.5) {
                        const dist = Math.hypot(this.player.x - c.x, this.player.y - c.y);
                        if (dist < magnetRange) { c.x += (this.player.x - c.x)*0.15; c.y += (this.player.y - c.y)*0.15; }
                        else c.y += this.speed;
                    } else c.y += this.speed;
                    
                    c.anim += 0.1;
                    const dist = Math.hypot(this.player.x - c.x, this.player.y - c.y);
                    if (!c.collected && dist < 40 && c.fade > 0.8) {
                        c.collected = true;
                        if (c.type === 'magnet') {
                            this.powerupTimer = 600 + (saveData.upgrades.magnet * 60);
                            AudioSys.playSFX('magic', 0.2);
                            this.spawnExplosion(c.x, c.y, '#00ffff', 15);
                        } else {
                            this.runCoins++;
                            this.score += 10;
                            AudioSys.playSFX('coin', 0.1);
                            this.spawnExplosion(c.x, c.y, '#FFD700', 5);
                        }
                        this.coins.splice(i, 1);
                        this.updateHUD();
                    } else if (c.y > this.height + 50) this.coins.splice(i, 1);
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= 0.03;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
                
                this.updateHUD();
            },

            draw: function() {
                // BG
                const colors = this.currentZone ? this.currentZone.colors : ['#0f0518', '#240b36'];
                const g = this.ctx.createLinearGradient(0, 0, 0, this.height);
                g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);
                this.ctx.fillStyle = g; this.ctx.fillRect(0, 0, this.width, this.height);

                // Stars
                this.ctx.fillStyle = '#fff';
                this.bgOffset += this.speed * 0.2;
                this.stars.forEach(s => {
                    let y = (s.y * this.height + this.bgOffset * s.size) % this.height;
                    this.ctx.globalAlpha = s.alpha;
                    this.ctx.beginPath(); this.ctx.arc(s.x * this.width, y, s.size, 0, Math.PI*2); this.ctx.fill();
                });
                this.ctx.globalAlpha = 1;

                // Shake
                this.ctx.save();
                if (this.shake > 0) this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);

                if (['PLAY', 'WIN', 'OVER'].includes(this.state)) {
                    // Coins
                    this.coins.forEach(c => {
                        this.ctx.globalAlpha = c.fade;
                        const scale = 1 + Math.sin(c.anim) * 0.2;
                        this.ctx.shadowBlur = 10;
                        if (c.type === 'magnet') {
                            this.ctx.shadowColor = '#00ffff'; this.ctx.fillStyle = '#00ffff';
                        } else {
                            this.ctx.shadowColor = '#FFD700'; this.ctx.fillStyle = '#FFD700';
                        }
                        this.ctx.beginPath(); this.ctx.arc(c.x, c.y, (c.type==='magnet'?8:10)*scale, 0, Math.PI*2); this.ctx.fill();
                        this.ctx.shadowBlur = 0; this.ctx.globalAlpha = 1;
                    });

                    // Player
                const ship = SHIPS.find(s => s.id === saveData.activeShip) || SHIPS[0];
                if (this.frame % 3 === 0 && this.state === 'PLAY') {
                    this.particles.push({
                        x: this.player.x + (Math.random()-0.5)*20, y: this.player.y + 20,
                        vx: (Math.random()-0.5)*2, vy: this.speed, life: 0.5, color: ship.trail, size: Math.random()*3+2
                    });
                }

                this.ctx.save();
                this.ctx.translate(this.player.x, this.player.y);
                this.ctx.rotate(this.player.tilt);
                if (this.player.invincible > 0 && Math.floor(this.frame/4)%2===0) this.ctx.globalAlpha = 0.5;

                const shipGradient = this.ctx.createLinearGradient(0, -34, 0, 36);
                shipGradient.addColorStop(0, ship.accent);
                shipGradient.addColorStop(0.45, ship.color);
                shipGradient.addColorStop(1, '#09111f');

                this.ctx.shadowBlur = 20; this.ctx.shadowColor = ship.trail;
                this.ctx.fillStyle = shipGradient;
                this.ctx.beginPath();
                this.ctx.moveTo(0, -38);
                this.ctx.quadraticCurveTo(16, -30, 22, -10);
                this.ctx.lineTo(26, 20);
                this.ctx.quadraticCurveTo(0, 40, -26, 20);
                this.ctx.lineTo(-22, -10);
                this.ctx.quadraticCurveTo(-16, -30, 0, -38);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.strokeStyle = 'rgba(255,255,255,0.65)';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();

                this.ctx.fillStyle = 'rgba(120, 215, 255, 0.88)';
                this.ctx.beginPath();
                this.ctx.moveTo(0, -24);
                this.ctx.lineTo(10, 10);
                this.ctx.lineTo(0, 18);
                this.ctx.lineTo(-10, 10);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.fillStyle = 'rgba(255, 214, 106, 0.95)';
                this.ctx.beginPath();
                this.ctx.arc(0, 1, 6, 0, Math.PI*2);
                this.ctx.fill();

                this.ctx.fillStyle = '#07111f';
                this.ctx.beginPath();
                this.ctx.arc(-2, -1, 1.2, 0, Math.PI*2);
                this.ctx.arc(2, -1, 1.2, 0, Math.PI*2);
                this.ctx.fill();

                this.ctx.strokeStyle = ship.trail;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(-10, 24);
                this.ctx.quadraticCurveTo(-4, 34, -1, 42);
                this.ctx.moveTo(10, 24);
                this.ctx.quadraticCurveTo(4, 34, 1, 42);
                this.ctx.stroke();

                if (this.powerupTimer > 0) {
                    this.ctx.strokeStyle = `rgba(65,240,255,${0.25 + Math.abs(Math.sin(this.frame*0.1))*0.4})`;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 60, 0, Math.PI*2);
                    this.ctx.stroke();

                    this.ctx.strokeStyle = `rgba(255,215,106,${0.12 + Math.abs(Math.cos(this.frame*0.08))*0.25})`;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 48, 0, Math.PI*2);
                    this.ctx.stroke();
                }
                this.ctx.restore();

                    // Obstacles
                    this.obstacles.forEach(ob => {
                        this.ctx.save();
                        this.ctx.translate(ob.x, ob.y);
                        this.ctx.rotate(ob.angle);
                        const grad = this.ctx.createRadialGradient(0, 0, 5, 0, 0, ob.size/2);
                        grad.addColorStop(0, 'rgba(255, 107, 143, 0.95)');
                        grad.addColorStop(0.55, 'rgba(117, 45, 92, 0.88)');
                        grad.addColorStop(1, 'rgba(0,0,0,0)');
                        this.ctx.fillStyle = grad;
                        this.ctx.beginPath();
                        this.ctx.arc(0, 0, ob.size/2, 0, Math.PI*2);
                        this.ctx.fill();

                        this.ctx.strokeStyle = 'rgba(255, 184, 95, 0.9)';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.beginPath();
                        this.ctx.moveTo(-ob.size * 0.18, -ob.size * 0.24);
                        this.ctx.lineTo(-ob.size * 0.04, ob.size * 0.1);
                        this.ctx.lineTo(-ob.size * 0.24, ob.size * 0.24);
                        this.ctx.moveTo(ob.size * 0.18, -ob.size * 0.24);
                        this.ctx.lineTo(ob.size * 0.04, ob.size * 0.1);
                        this.ctx.lineTo(ob.size * 0.24, ob.size * 0.24);
                        this.ctx.stroke();

                        this.ctx.shadowBlur = 10;
                        this.ctx.shadowColor = '#ffd76a';
                        this.ctx.fillStyle = '#ffd76a';
                        this.ctx.beginPath();
                        this.ctx.arc(-8, -3, 3.5, 0, Math.PI*2);
                        this.ctx.arc(8, -3, 3.5, 0, Math.PI*2);
                        this.ctx.fill();
                        this.ctx.restore();
                    });

                    // Particles
                    this.particles.forEach(p => {
                        this.ctx.globalAlpha = p.life;
                        this.ctx.fillStyle = p.color;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); this.ctx.fill();
                    });
                }
                this.ctx.restore();
            },

            loop: function(timestamp) {
                const dt = timestamp - this.lastTime;
                this.lastTime = timestamp;

                // Passive Income Logic (Independent of Game State)
                this.incomeAccumulator += dt;
                if (this.incomeAccumulator >= CONFIG.passiveTickRate) {
                    this.incomeAccumulator -= CONFIG.passiveTickRate;
                    const rate = this.getIncomeRate();
                    if (rate > 0) {
                        saveData.coins += rate;
                        saveGame(); // Also saves lastSaveTime
                        
                        // Visual feedback if in menu
                        if (this.state === 'MENU' && !document.getElementById('start-screen').classList.contains('hidden')) {
                            const coinEl = document.getElementById('menu-coins');
                            coinEl.style.transform = 'scale(1.2)';
                            setTimeout(() => coinEl.style.transform = 'scale(1)', 100);
                        }
                    }
                }

                this.update();
                this.draw();
                requestAnimationFrame(t => this.loop(t));
            },

            updateHUD: function() {
                document.getElementById('score-display').innerText = Math.floor(this.score);
                if (this.currentZone) {
                    const pct = Math.min(100, (this.score / this.currentZone.distance) * 100);
                    document.getElementById('distance-bar').style.width = `${pct}%`;
                }
                const livesContainer = document.getElementById('lives-container');
                livesContainer.innerHTML = '';
                const maxLives = 3 + saveData.upgrades.lives;
                for(let i=0; i<maxLives; i++) {
                    const span = document.createElement('span');
                    span.innerText = '❤️';
                    span.style.filter = i < this.lives ? '' : 'grayscale(100%) opacity(0.3)';
                    livesContainer.appendChild(span);
                }
                const puHud = document.getElementById('powerup-hud');
                if (this.powerupTimer > 0) {
                    puHud.classList.remove('hidden');
                    const max = 600 + (saveData.upgrades.magnet * 60);
                    document.getElementById('powerup-bar').style.width = `${(this.powerupTimer/max)*100}%`;
                } else puHud.classList.add('hidden');
            },

            updateMenuUI: function() {
                const rate = this.getIncomeRate();
                const incomeStr = `+${rate}/sec`;
                
                document.getElementById('menu-level').innerText = `Tier ${saveData.level}`;
                document.getElementById('menu-coins').innerText = `${Math.floor(saveData.coins)} 🪙`;
                document.getElementById('menu-income').innerText = incomeStr;
                
                document.getElementById('shop-coins-display').innerText = `${Math.floor(saveData.coins)} 🪙`;
                document.getElementById('shop-income-display').innerText = incomeStr;
                
                const maxXP = saveData.level * 500;
                const pct = Math.min(100, (saveData.xp / maxXP) * 100);
                document.getElementById('menu-xp-bar').style.width = `${pct}%`;
            },

            activeShopTab: 'upgrades',
            switchShopTab: function(tab) {
                this.activeShopTab = tab;
                document.getElementById('tab-upgrades').classList.toggle('active', tab === 'upgrades');
                document.getElementById('tab-ships').classList.toggle('active', tab === 'ships');
                this.renderShop();
            },

            renderShop: function() {
                const container = document.getElementById('shop-content');
                container.innerHTML = '';
                if (this.activeShopTab === 'upgrades') {
                    UPGRADES.forEach(u => {
                        const lvl = saveData.upgrades[u.id];
                        const cost = u.cost(lvl);
                        const isMax = lvl >= u.max;
                        const canAfford = saveData.coins >= cost;
                        const div = document.createElement('div');
                        div.className = 'bg-white/5 p-3 rounded-lg flex justify-between items-center';
                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <div class="text-2xl">${u.icon}</div>
                                <div>
                                    <div class="text-gold font-bold text-sm">${u.name}</div>
                                    <div class="text-xs text-white/50">${u.desc}</div>
                                    <div class="text-[10px] text-purple-300 mt-1">Lvl ${lvl}/${u.max}</div>
                                </div>
                            </div>
                            <button class="px-4 py-2 rounded-lg text-xs font-bold ${isMax ? 'bg-gray-700 text-gray-400' : (canAfford ? 'btn-primary' : 'bg-gray-800 text-gray-500')}"
                                onclick="game.buyUpgrade('${u.id}')" ${!canAfford || isMax ? 'disabled' : ''}>${isMax ? 'MAX' : `${cost} 🪙`}</button>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    SHIPS.forEach(s => {
                        const unlocked = saveData.unlockedShips.includes(s.id);
                        const equipped = saveData.activeShip === s.id;
                        const canAfford = saveData.coins >= s.cost;
                        const div = document.createElement('div');
                        div.className = `bg-white/5 p-3 rounded-lg flex justify-between items-center ${equipped ? 'border border-green-500' : ''}`;
                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full border-2 border-white/20 flex items-center justify-center" style="background: ${s.color}">
                                    <div class="w-2 h-2 bg-white rounded-full"></div>
                                </div>
                                <div>
                                    <div class="text-gold font-bold text-sm">${s.name}</div>
                                    <div class="text-xs text-white/50">${s.desc}</div>
                                </div>
                            </div>
                            <div>
                                ${equipped ? `<span class="text-green-400 text-xs font-bold px-3">EQUIPPED</span>`
                                    : unlocked ? `<button class="px-3 py-2 rounded-lg text-xs font-bold btn-secondary" onclick="game.equipShip('${s.id}')">EQUIP</button>`
                                    : `<button class="px-3 py-2 rounded-lg text-xs font-bold ${canAfford ? 'btn-primary' : 'bg-gray-800 text-gray-500'}" onclick="game.buyShip('${s.id}')" ${!canAfford ? 'disabled' : ''}>${s.cost} 🪙</button>`
                                }
                            </div>
                        `;
                        container.appendChild(div);
                    });
                }
            },

            buyUpgrade: function(id) {
                const u = UPGRADES.find(x => x.id === id);
                const lvl = saveData.upgrades[id];
                const cost = u.cost(lvl);
                if (saveData.coins >= cost && lvl < u.max) {
                    saveData.coins -= cost;
                    saveData.upgrades[id]++;
                    AudioSys.playSFX('magic', 0.04, 0.34);
                    saveGame();
                    this.renderShop();
                    this.updateMenuUI();
                }
            },

            buyShip: function(id) {
                const s = SHIPS.find(x => x.id === id);
                if (saveData.coins >= s.cost && !saveData.unlockedShips.includes(id)) {
                    saveData.coins -= s.cost;
                    saveData.unlockedShips.push(id);
                    saveData.activeShip = id;
                    AudioSys.playSFX('success', 0.03, 0.34);
                    saveGame();
                    this.renderShop();
                    this.updateMenuUI();
                }
            },

            equipShip: function(id) {
                if (saveData.unlockedShips.includes(id)) {
                    saveData.activeShip = id;
                    AudioSys.playSFX('click', 0, 0.24);
                    saveGame();
                    this.renderShop();
                }
            }
        };

        // --- Event Listeners ---
        document.getElementById('btn-open-map').onclick = () => {
            AudioSys.init();
            AudioSys.playSFX('click', 0, 0.24);
            game.canvas.style.pointerEvents = 'none';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            MapSys.render();
        };
        document.getElementById('btn-map-back').onclick = () => {
            AudioSys.playSFX('click', 0, 0.22);
            AudioSys.stopResultLoop();
            game.canvas.style.pointerEvents = 'none';
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            game.updateMenuUI();
        };
        document.getElementById('btn-shop').onclick = () => {
            AudioSys.init();
            AudioSys.playSFX('click', 0, 0.24);
            game.canvas.style.pointerEvents = 'none';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('shop-screen').classList.remove('hidden');
            game.switchShopTab('upgrades');
        };
        document.getElementById('btn-close-shop').onclick = () => {
            AudioSys.playSFX('click', 0, 0.22);
            game.canvas.style.pointerEvents = 'none';
            document.getElementById('shop-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            game.updateMenuUI();
        };

        window.onload = () => game.init();

    </script>
</body>
</html>
