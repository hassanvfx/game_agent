<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Arcade Vault Runner</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #06152d;
            --sky-bottom: #142f63;
            --vault-haze: rgba(123, 230, 255, 0.12);
            --panel-bg: rgba(7, 16, 38, 0.78);
            --panel-border: rgba(130, 230, 255, 0.55);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --panel-glow: rgba(94, 225, 255, 0.18);
            --text-main: #f4fbff;
            --text-soft: #b8d8ff;
            --accent-cyan: #67f0ff;
            --accent-blue: #67a6ff;
            --accent-gold: #ffd66f;
            --accent-orange: #ffaf52;
            --danger: #ff5875;
            --danger-dark: #8f2036;
            --success: #5ef0a1;
            --success-dark: #168d57;
            --ground: #1f3656;
            --ground-edge: #3e79ca;
            --ground-tile: rgba(113, 206, 255, 0.28);
            --vault-trim: #6ff6ff;
            --runner-head: #ffd37b;
            --runner-visor: #14294e;
            --runner-suit: #53c1ff;
            --runner-core: #95f6ff;
            --runner-boots: #7d6dff;
            --laser-core: #ff7d90;
            --laser-glow: rgba(255, 81, 113, 0.38);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 18%, rgba(103, 240, 255, 0.22), transparent 30%),
                radial-gradient(circle at 80% 10%, rgba(103, 166, 255, 0.18), transparent 26%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            font-family: 'Rajdhani', system-ui, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            border-top: 0;
            border-left: 0;
            border-right: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.12), transparent 35%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0));
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                repeating-linear-gradient(90deg, transparent 0 78px, rgba(103, 240, 255, 0.06) 78px 80px),
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 35%);
            opacity: 0.7;
        }

        #game-container::after {
            background:
                radial-gradient(circle at center, transparent 58%, rgba(4, 9, 25, 0.28) 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(14, 28, 61, 0.92), rgba(8, 18, 43, 0.82));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 44px var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04),
                0 0 28px var(--panel-glow);
        }

        .stud-pattern {
            background-image:
                radial-gradient(circle at 20px 20px, rgba(111, 246, 255, 0.16) 0 3px, transparent 3.5px),
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
            background-size: 40px 40px, 100% 100%;
        }

        .panel {
            padding: 2rem 1.7rem;
            border-radius: 1.4rem;
            text-align: center;
            pointer-events: auto;
            width: min(88vw, 28rem);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0.65rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            pointer-events: none;
        }

        #start-screen,
        #game-over-screen {
            transition: transform 0.24s ease, box-shadow 0.24s ease;
        }

        #start-screen:hover,
        #game-over-screen:hover {
            transform: translateY(-2px);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.46),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04),
                0 0 32px rgba(103, 240, 255, 0.24);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.85rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            background: rgba(103, 240, 255, 0.1);
            border: 1px solid rgba(103, 240, 255, 0.28);
            color: var(--accent-cyan);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-badge::before {
            content: "⚡";
            font-size: 0.9rem;
        }

        .screen-title,
        .game-over-title {
            margin: 0;
            font-family: 'Orbitron', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .screen-title {
            margin-bottom: 0.65rem;
            font-size: clamp(2rem, 9vw, 3.15rem);
            line-height: 1;
            color: var(--text-main);
            text-shadow:
                0 0 18px rgba(103, 240, 255, 0.18),
                0 4px 0 rgba(0, 0, 0, 0.28);
        }

        .screen-subtitle {
            margin: 0 0 0.75rem;
            font-size: clamp(1rem, 3vw, 1.28rem);
            font-weight: 600;
            color: var(--text-soft);
            letter-spacing: 0.03em;
        }

        .screen-instructions {
            margin: 0 0 1.5rem;
            font-size: clamp(0.95rem, 2.3vw, 1.05rem);
            font-weight: 600;
            color: var(--text-main);
            opacity: 0.92;
        }

        .screen-instructions strong {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .action-button {
            min-width: 10.5rem;
            font-weight: 700;
            font-size: clamp(1rem, 2.8vw, 1.22rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.82rem 1.35rem;
            border-radius: 0.95rem;
            border-bottom-width: 4px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        .action-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .action-button:active {
            transform: translateY(2px);
            border-bottom-width: 1px;
        }

        .action-button--start {
            background: linear-gradient(180deg, #ffe79b, var(--accent-gold));
            border-bottom-color: #c88e1e;
            color: #513100;
        }

        .action-button--restart {
            background: linear-gradient(180deg, #7affbf, var(--success));
            border-bottom-color: var(--success-dark);
            color: #083b23;
        }

        #game-over-screen.hidden,
        #hud.hidden,
        .hidden {
            display: none;
        }

        .game-over-title {
            margin-bottom: 0.6rem;
            font-size: clamp(2rem, 7vw, 3rem);
            color: #ffd2db;
            text-shadow:
                0 0 16px rgba(255, 88, 117, 0.22),
                0 4px 14px rgba(0, 0, 0, 0.28);
        }

        .final-score {
            margin: 0 0 1.45rem;
            font-size: clamp(1.2rem, 4vw, 1.65rem);
            font-weight: 700;
            color: var(--text-main);
        }

        #hud {
            position: absolute;
            top: 1.1rem;
            left: 1rem;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud-card {
            position: relative;
            min-width: 9.2rem;
            padding: 0.55rem 0.85rem 0.58rem;
            border-radius: 0.9rem;
            background:
                linear-gradient(180deg, rgba(7, 16, 38, 0.86), rgba(10, 22, 48, 0.72));
            border: 1px solid rgba(103, 240, 255, 0.35);
            backdrop-filter: blur(10px);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.28),
                inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .hud-card::before {
            content: "";
            position: absolute;
            inset: 0.3rem;
            border-radius: 0.65rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .hud-label,
        .hud-value {
            position: relative;
            z-index: 1;
        }

        .hud-label {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            font-size: clamp(0.9rem, 2.8vw, 1.08rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .hud-value {
            color: var(--accent-gold);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 1.05em;
            text-shadow: 0 0 10px rgba(255, 214, 111, 0.25);
        }

        .feedback-gif {
            position: absolute;
            right: clamp(0.7rem, 2vw, 1.25rem);
            bottom: clamp(1rem, 3vw, 1.6rem);
            width: clamp(86px, 18vw, 132px);
            aspect-ratio: 1;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
            object-fit: cover;
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #combo-gif {
            bottom: clamp(1rem, 3vw, 1.5rem);
        }

        #fail-gif {
            top: clamp(1rem, 4vw, 1.8rem);
            right: clamp(1rem, 3vw, 1.8rem);
            bottom: auto;
            width: clamp(94px, 22vw, 152px);
        }

        @media (max-width: 640px) {
            .panel {
                width: min(90vw, 26rem);
                padding: 1.7rem 1.1rem;
            }

            .hero-badge {
                margin-bottom: 0.7rem;
                font-size: 0.78rem;
            }

            #hud {
                top: 0.9rem;
                left: 0.8rem;
            }

            .hud-card {
                min-width: 8.4rem;
                padding: 0.5rem 0.78rem 0.52rem;
            }

            .hud-label {
                font-size: 0.82rem;
            }

            .action-button {
                width: 100%;
                min-width: 0;
            }

            .feedback-gif {
                width: 84px;
            }

            #fail-gif {
                width: 96px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: score-streak + fail-state -> catalogs/gifs.json -->
        <img id="combo-gif" class="feedback-gif" alt="score streak reaction" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp">
        <img id="fail-gif" class="feedback-gif" alt="lockout reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">

        <div id="ui-layer">
            <div id="start-screen" class="glass-panel stud-pattern panel">
                <div class="hero-badge">Neon Courier</div>
                <h1 class="screen-title">Arcade Vault Run</h1>
                <p class="screen-subtitle">Dash through a laser-locked vault lane.</p>
                <p class="screen-instructions">Tap, click, or press <strong>Space / Up</strong> to vault each security block.</p>
                <button id="start-btn" class="action-button action-button--start">Start Run</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel stud-pattern panel">
                <div class="hero-badge">System Alert</div>
                <h2 class="game-over-title">Lockout</h2>
                <div class="final-score">Vault Score: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="action-button action-button--restart">Run Again</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-card">
                    <span class="hud-label">Vault Score <span id="score" class="hud-value">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.sfx = {};
                this.lastPlayed = {};
                for (const [key, value] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(value);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const minInterval = options.minInterval ?? 0;
                const last = this.lastPlayed[key] ?? 0;
                if (now - last < minInterval) return;
                this.lastPlayed[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = options.volume ?? 0.72;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const comboGif = document.getElementById('combo-gif');
        const failGif = document.getElementById('fail-gif');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let frameCount = 0;
        let score = 0;
        let gameSpeed = 6;
        let lastGroundedState = true;
        let feedbackTimer = null;

        const COLORS = {
            skyTop: '#06152d',
            skyBottom: '#142f63',
            skylineA: 'rgba(111, 246, 255, 0.12)',
            skylineB: 'rgba(103, 166, 255, 0.18)',
            groundTop: '#2a4b77',
            ground: '#1f3656',
            groundEdge: '#67a6ff',
            tileGlow: 'rgba(111, 246, 255, 0.22)',
            playerSkin: '#ffd37b',
            playerSuit: '#53c1ff',
            playerGlow: '#95f6ff',
            playerBoots: '#7d6dff',
            playerVisor: '#14294e',
            obstacle: '#ff6b83',
            obstacleEdge: '#ffbd65',
            obstacleDark: '#8f2036',
            laserGlow: 'rgba(255, 81, 113, 0.38)'
        };

        let player = {
            x: 100,
            y: 0,
            width: 40,
            height: 80,
            dy: 0,
            jumpForce: -14,
            grounded: false,
            rotation: 0
        };

        const GRAVITY = 0.7;
        const GROUND_HEIGHT = 150;
        let obstacles = [];
        let clouds = [];

        function showGif(element, duration = 900) {
            element.classList.add('is-visible');
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                element.classList.remove('is-visible');
            }, duration);
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            lastGroundedState = true;
            comboGif.classList.remove('is-visible');
            failGif.classList.remove('is-visible');
            document.getElementById('score').innerText = score;

            player.y = height - GROUND_HEIGHT - player.height;
            player.dy = 0;
            player.rotation = 0;
            player.grounded = true;

            obstacles = [];
            clouds = [];

            for (let i = 0; i < 5; i++) {
                clouds.push(createCloud(Math.random() * width));
            }
        }

        function createCloud(xOverride) {
            return {
                x: xOverride !== undefined ? xOverride : width + 100,
                y: Math.random() * (height / 2),
                width: 80 + Math.random() * 100,
                speed: 0.5 + Math.random() * 0.5
            };
        }

        function createObstacle() {
            const h = 40 + Math.random() * 40;
            return {
                x: width + 220,
                y: height - GROUND_HEIGHT - h,
                width: 40,
                height: h,
                passed: false
            };
        }

        function drawBackground() {
            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, COLORS.skyTop);
            sky.addColorStop(1, COLORS.skyBottom);
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = COLORS.skylineA;
            for (let i = 0; i < 6; i++) {
                const x = ((i * 220) - (frameCount * 0.35)) % (width + 260) - 120;
                const towerHeight = 90 + (i % 3) * 40;
                ctx.fillRect(x, height - GROUND_HEIGHT - towerHeight - 28, 96, towerHeight);
                ctx.fillRect(x + 18, height - GROUND_HEIGHT - towerHeight - 58, 26, 30);
            }

            ctx.fillStyle = COLORS.skylineB;
            for (let i = 0; i < 9; i++) {
                const x = ((i * 150) - (frameCount * 0.58)) % (width + 200) - 80;
                const y = 90 + (i % 4) * 34;
                ctx.fillRect(x, y, 2, height - GROUND_HEIGHT - y - 30);
            }
        }

        function drawStuds(offsetX) {
            const groundGradient = ctx.createLinearGradient(0, height - GROUND_HEIGHT, 0, height);
            groundGradient.addColorStop(0, COLORS.groundTop);
            groundGradient.addColorStop(1, COLORS.ground);
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, height - GROUND_HEIGHT, width, GROUND_HEIGHT);

            ctx.fillStyle = COLORS.groundEdge;
            ctx.fillRect(0, height - GROUND_HEIGHT, width, 6);

            ctx.strokeStyle = 'rgba(103, 240, 255, 0.18)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                const y = height - GROUND_HEIGHT + 22 + (i * 26);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const studSize = 24;
            const gap = 46;
            const shift = offsetX % gap;

            for (let y = height - GROUND_HEIGHT + 16; y < height; y += gap) {
                for (let x = -shift; x < width + gap; x += gap) {
                    ctx.fillStyle = COLORS.tileGlow;
                    ctx.beginPath();
                    ctx.roundRect(x, y, studSize, 10, 4);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
                    ctx.stroke();
                }
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            if (!player.grounded) {
                player.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, player.dy * 0.05));
            } else {
                player.rotation = 0;
            }
            ctx.rotate(player.rotation);
            ctx.translate(-(player.x + player.width / 2), -(player.y + player.height / 2));

            const pX = player.x;
            const pY = player.y;
            const w = player.width;
            const h = player.height;

            ctx.shadowColor = 'rgba(149, 246, 255, 0.3)';
            ctx.shadowBlur = 14;

            ctx.fillStyle = COLORS.playerBoots;
            ctx.fillRect(pX + 4, pY + h * 0.68, 12, h * 0.3);
            ctx.fillRect(pX + 24, pY + h * 0.68, 12, h * 0.3);

            ctx.fillStyle = COLORS.playerSuit;
            ctx.fillRect(pX + 2, pY + h * 0.28, w - 4, h * 0.38);
            ctx.fillStyle = COLORS.playerGlow;
            ctx.fillRect(pX + 10, pY + h * 0.36, w - 20, 10);

            ctx.fillStyle = COLORS.playerSkin;
            ctx.fillRect(pX + 7, pY + 2, w - 14, h * 0.26);
            ctx.fillStyle = COLORS.playerVisor;
            ctx.fillRect(pX + 10, pY + 8, w - 20, 8);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#08111f';
            ctx.fillRect(pX + 12, pY + h * 0.78, 10, 6);
            ctx.fillRect(pX + 22, pY + h * 0.78, 10, 6);

            ctx.restore();
        }

        function drawCloud(c) {
            ctx.fillStyle = 'rgba(241, 250, 255, 0.1)';
            ctx.fillRect(c.x, c.y, c.width, 20);
            ctx.fillStyle = 'rgba(241, 250, 255, 0.18)';
            ctx.fillRect(c.x + 18, c.y - 12, c.width - 36, 16);
            ctx.fillRect(c.x + 8, c.y + 20, c.width - 16, 6);
        }

        function drawObstacle(obs) {
            const glow = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.width, obs.y + obs.height);
            glow.addColorStop(0, COLORS.obstacleEdge);
            glow.addColorStop(1, COLORS.obstacle);
            ctx.fillStyle = glow;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            ctx.fillStyle = COLORS.obstacleDark;
            ctx.fillRect(obs.x + obs.width - 6, obs.y + 4, 6, obs.height - 4);
            ctx.fillRect(obs.x + 4, obs.y + 6, obs.width - 12, 5);

            ctx.shadowColor = COLORS.laserGlow;
            ctx.shadowBlur = 14;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (!gameActive) return;

            drawBackground();

            player.dy += GRAVITY;
            player.y += player.dy;

            if (player.y + player.height > height - GROUND_HEIGHT) {
                player.y = height - GROUND_HEIGHT - player.height;
                player.dy = 0;
                player.grounded = true;
                if (!lastGroundedState) {
                    audio.playSFX('land', { volume: 0.4, minInterval: 120 });
                }
            } else {
                player.grounded = false;
            }
            lastGroundedState = player.grounded;

            clouds.forEach((c, index) => {
                c.x -= c.speed;
                drawCloud(c);
                if (c.x + c.width < 0) {
                    clouds[index] = createCloud();
                }
            });

            drawStuds(frameCount * gameSpeed);

            const spawnInterval = Math.floor(1000 / (gameSpeed * 2));
            const firstSpawnDelay = Math.ceil((player.x + player.width + 120) / gameSpeed);

            if (frameCount >= firstSpawnDelay && frameCount % spawnInterval === 0) {
                obstacles.push(createObstacle());
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;
                drawObstacle(obs);

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameOver();
                    return;
                }

                if (!obs.passed && player.x > obs.x + obs.width) {
                    score++;
                    obs.passed = true;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', { volume: 0.62, minInterval: 90 });
                    if (score % 5 === 0) {
                        gameSpeed += 0.5;
                        audio.playSFX('streak', { volume: 0.74, minInterval: 120 });
                        showGif(comboGif, 900);
                    }
                }

                if (obs.x + obs.width < -50) {
                    obstacles.splice(i, 1);
                }
            }

            drawPlayer();

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function jump() {
            if (gameActive && player.grounded) {
                player.dy = player.jumpForce;
                player.grounded = false;
                lastGroundedState = false;
                audio.playSFX('jump', { volume: 0.55, minInterval: 100 });
            }
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.76, minInterval: 200 });
            showGif(failGif, 1600);

            ctx.fillStyle = '#ffe4ea';
            ctx.strokeStyle = '#3b0f18';
            ctx.lineWidth = 3;
            ctx.font = 'bold 34px "Orbitron", system-ui, sans-serif';
            ctx.strokeText("LOCKOUT", player.x - 8, player.y - 18);
            ctx.fillText("LOCKOUT", player.x - 8, player.y - 18);

            setTimeout(() => {
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = score;
            }, 500);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        }, { passive: false });

        canvas.addEventListener('mousedown', jump);

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.66, minInterval: 120 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.58, minInterval: 120 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
