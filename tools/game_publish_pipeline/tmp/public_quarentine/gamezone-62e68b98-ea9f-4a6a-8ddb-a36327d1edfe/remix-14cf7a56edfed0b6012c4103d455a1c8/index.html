    <style>

</head>
<body class="wood-texture">
    <div id="game-container" class="screen-fill">
        <canvas id="gameCanvas"></canvas>

            <div id="ui-layer" class="screen-overlay">

                </div>

            <div id="start-screen" class="modal-screen modal-backdrop-start">
                <div class="overlay-panel ghost-frame start-card">
                    <div class="ritual-seal" aria-hidden="true">
                        <div class="seal-glyph">☽</div>
                    </div>
                    <h1 class="horror-title">OUIJA</h1>
                    <p class="subhead">DO NOT PLAY ALONE</p>
                    <p class="session-copy">Guide the planchette through a candlelit séance and listen for the whisper beneath the wood grain. <strong>Keep your hands steady.</strong></p>
                    <button id="start-btn" class="primary-button">
                        <span class="button-glyph" aria-hidden="true">✦</span>

                </div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                letter: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3",
                choice: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                goodEnd: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3"
            },
            gifs: {
                omen: "https://i.giphy.com/XDwmOz5h3w6fQnnJM9.webp",
                endingGood: "https://i.giphy.com/8vVG16AeVFt6eJkKMu.webp",
                endingBad: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.cooldowns = {};
                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const base = new Audio(src);
                    base.preload = 'auto';
                    this.sfx[key] = base;
                    this.cooldowns[key] = 0;
                }
            }

            unlock() {
                this.unlocked = true;
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                if (!this.unlocked || !this.sfx[key]) return;

                const now = performance.now();
                const cooldown = options.cooldown ?? 0;
                if (cooldown && now - this.cooldowns[key] < cooldown) return;
                this.cooldowns[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = options.volume ?? (key === 'letter' ? 0.22 : 0.58);
                clone.playbackRate = options.playbackRate ?? 1;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const omenGif = document.getElementById('omen-gif');
        const endingGif = document.getElementById('ending-gif');
        let gifHideTimers = {};

        function showReactionGif(kind, src, duration = 2400) {
            const img = kind === 'ending' ? endingGif : omenGif;
            if (!img) return;
            clearTimeout(gifHideTimers[kind]);
            img.src = src;
            img.classList.add('show');
            gifHideTimers[kind] = setTimeout(() => {
                img.classList.remove('show');
            }, duration);
        }

        function hideAllReactionGifs() {
            [omenGif, endingGif].forEach((img) => img && img.classList.remove('show'));
            Object.values(gifHideTimers).forEach((timer) => clearTimeout(timer));
            gifHideTimers = {};
        }

        /** 3. GAME STATE & DATA */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;

        const STORY_NODES = {
            start: {
                message: "I... AM... HERE...",
                options: [
                    { text: "Who are you?", next: "identity" },
                    { text: "Are you friendly?", next: "friendly" }
                ]
            },
            identity: {
                message: "A-L-I-C-E",
                options: [
                    { text: "How did you die?", next: "death" },
                    { text: "Do you know my name?", next: "knowledge" }
                ]
            },
            friendly: {
                message: "N-O...",
                options: [
                    { text: "Leave now!", next: "angry" },
                    { text: "What do you want?", next: "greed" }
                ]
            },
            death: {
                message: "F-I-R-E... H-O-T...",
                options: [
                    { text: "I'm sorry.", next: "peace" },
                    { text: "Who burned you?", next: "murder" }
                ]
            },
            knowledge: {
                message: "Y-O-U... A-R-E... N-E-X-T",
                isEnd: true,
                bad: true,
                endText: "The spirit has marked you."
            },
            angry: {
                message: "Y-O-U... C-A-N-T... H-I-D-E",
                isEnd: true,
                bad: true,
                endText: "You angered the spirit."
            },
            greed: {
                message: "S-O-U-L",
                isEnd: true,
                bad: true,
                endText: "It wants your soul."
            },
            peace: {
                message: "T-H-A-N-K... Y-O-U...",
                isEnd: true,
                bad: false,
                endText: "Alice found peace."
            },
            murder: {
                message: "F-A-T-H-E-R...",
                isEnd: true,
                bad: true,
                endText: "You uncovered a dark secret."
            }
        };

        const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890";
        const LETTER_POSITIONS = {};
        const SPECIAL_POSITIONS = {
            YES: { x: 0.3, y: 0.3 },
            NO: { x: 0.7, y: 0.3 },
            GOODBYE: { x: 0.5, y: 0.85 }
        };

        let planchette = {
            x: 0.5, y: 0.5,
            targetX: 0.5, targetY: 0.5,
            angle: 0,
            velocity: { x: 0, y: 0 }
        };

        let messageQueue = [];
        let currentTargetChar = null;
        let isSpelling = false;
        let spellingTimer = 0;
        let currentSpelledWord = "";

        let particles = [];

        /** 4. RESIZE & INIT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            calculateLetterPositions();
        }
        window.addEventListener('resize', resize);

        function calculateLetterPositions() {
            const centerX = width / 2;
            const centerY = height * 0.9;
            const radius = Math.min(width, height) * 0.7;

            for (let i = 0; i < 13; i++) {
                const angle = Math.PI + (Math.PI / 14) * (i + 1);
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle) - height * 0.3;
                LETTER_POSITIONS[LETTERS[i]] = { x: x / width, y: y / height };
            }

            for (let i = 13; i < 26; i++) {
                const angle = Math.PI + (Math.PI / 14) * ((i - 13) + 1);
                const x = centerX + (radius * 0.85) * Math.cos(angle);
                const y = centerY + (radius * 0.85) * Math.sin(angle) - height * 0.3;
                LETTER_POSITIONS[LETTERS[i]] = { x: x / width, y: y / height };
            }

            for (let i = 26; i < 36; i++) {
                const x = (width * 0.25) + ((width * 0.5) / 9) * (i - 26);
                const y = height * 0.75;
                LETTER_POSITIONS[LETTERS[i]] = { x: x / width, y: y / height };
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2,
                    size: Math.random() * 3 + 1,
                    alpha: Math.random() * 0.3
                });
            }
        }

        /** 5. GAME LOGIC */
        function startStory(nodeKey) {
            const node = STORY_NODES[nodeKey];
            const cleanMsg = node.message.replace(/[^A-Z0-9]/g, '');
            messageQueue = cleanMsg.split('');

            isSpelling = true;
            currentSpelledWord = "";
            document.getElementById('current-spelling').innerText = "";
            document.getElementById('choices-container').classList.add('hidden');

            processNextChar();
        }

        function processNextChar() {
            if (messageQueue.length === 0) {
                isSpelling = false;
                planchette.targetX = 0.5;
                planchette.targetY = 0.5;

                setTimeout(() => {
                    presentChoices();
                }, 1000);
                return;
            }

            const char = messageQueue.shift();
            currentTargetChar = char;

            if (char && Math.random() > 0.58) {
                showReactionGif('omen', ASSETS.gifs.omen, 1100);
            }

            let target = LETTER_POSITIONS[char];
            if (!target) target = { x: 0.5, y: 0.5 };

            const noise = 0.02;
            planchette.targetX = target.x + (Math.random() - 0.5) * noise;
            planchette.targetY = target.y + (Math.random() - 0.5) * noise;
        }

        let currentNodeKey = 'start';

        function presentChoices() {
            const node = STORY_NODES[currentNodeKey];
            const chatLog = document.getElementById('chat-log');

            const p = document.createElement('p');
            p.className = "story-spirit fade-in";
            p.innerText = `Spirit: "${node.message}"`;
            chatLog.appendChild(p);
            chatLog.scrollTop = chatLog.scrollHeight;

            if (node.isEnd) {
                setTimeout(() => {
                    endGame(node.bad, node.endText);
                }, 1500);
                return;
            }

            const container = document.getElementById('choices-box');
            container.innerHTML = '';
            document.getElementById('choices-container').classList.remove('hidden');

            node.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "session-button";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    audio.playSFX('choice', { volume: 0.42, cooldown: 120 });
                    const pPlayer = document.createElement('p');
                    pPlayer.className = "story-player";
                    pPlayer.innerText = `You: ${opt.text}`;
                    chatLog.appendChild(pPlayer);

                    currentNodeKey = opt.next;
                    startStory(currentNodeKey);
                };
                container.appendChild(btn);
            });
        }

        function endGame(isBad, text) {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX(isBad ? 'fail' : 'goodEnd', { volume: isBad ? 0.62 : 0.52, cooldown: 250 });
            showReactionGif('ending', isBad ? ASSETS.gifs.endingBad : ASSETS.gifs.endingGood, 3600);

            document.getElementById('ui-layer').classList.add('pointer-events-none');
            document.getElementById('story-hud').classList.add('hidden');
            document.getElementById('choices-container').classList.add('hidden');

            const goScreen = document.getElementById('game-over-screen');
            goScreen.classList.remove('hidden');
            document.getElementById('end-reason').innerText = text;
        }

        /** 6. RENDER & LOOP */
        function drawBoard() {
            const boardGlow = ctx.createRadialGradient(width * 0.5, height * 0.54, 0, width * 0.5, height * 0.54, Math.min(width, height) * 0.62);
            boardGlow.addColorStop(0, 'rgba(114, 39, 29, 0.18)');
            boardGlow.addColorStop(0.45, 'rgba(38, 16, 16, 0.08)');
            boardGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = boardGlow;
            ctx.fillRect(0, 0, width, height);

            const sigilRadius = Math.min(width, height) * 0.33;
            ctx.save();
            ctx.translate(width * 0.5, height * 0.56);
            ctx.strokeStyle = 'rgba(255, 208, 155, 0.08)';
            ctx.lineWidth = Math.max(1, Math.min(width, height) * 0.002);
            ctx.beginPath();
            ctx.arc(0, 0, sigilRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, sigilRadius * 0.72, 0, Math.PI * 2);
            ctx.stroke();
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * sigilRadius * 0.72, Math.sin(angle) * sigilRadius * 0.72);
                ctx.lineTo(Math.cos(angle) * sigilRadius, Math.sin(angle) * sigilRadius);
                ctx.stroke();
            }
            ctx.restore();

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#d9a25f";
            ctx.font = `bold ${Math.max(20, Math.min(width, height) * 0.04)}px "Creepster"`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (const char in LETTER_POSITIONS) {
                const pos = LETTER_POSITIONS[char];
                const x = pos.x * width;
                const y = pos.y * height;

                if (
                    isSpelling && char === currentTargetChar &&
                    Math.abs(planchette.x - pos.x) < 0.03 &&
                    Math.abs(planchette.y - pos.y) < 0.03
                ) {
                    ctx.fillStyle = "#fff7e8";
                    ctx.shadowColor = "rgba(201, 230, 255, 0.9)";
                    ctx.shadowBlur = 24;
                } else {
                    ctx.fillStyle = "rgba(217, 162, 95, 0.68)";
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(char, x, y);
            }

            ctx.font = `bold ${Math.max(16, Math.min(width, height) * 0.03)}px "Creepster"`;
            ctx.fillStyle = "rgba(235, 181, 124, 0.42)";
            ctx.fillText("YES", SPECIAL_POSITIONS.YES.x * width, SPECIAL_POSITIONS.YES.y * height);
            ctx.fillText("NO", SPECIAL_POSITIONS.NO.x * width, SPECIAL_POSITIONS.NO.y * height);
            ctx.fillText("GOODBYE", SPECIAL_POSITIONS.GOODBYE.x * width, SPECIAL_POSITIONS.GOODBYE.y * height);
            ctx.shadowBlur = 0;
        }

        function drawPlanchette() {
            const x = planchette.x * width;
            const y = planchette.y * height;
            const size = Math.min(width, height) * 0.15;

            ctx.save();
            ctx.translate(x, y);
            const targetAngle = (planchette.targetX - planchette.x) * 5;
            planchette.angle += (targetAngle - planchette.angle) * 0.1;
            ctx.rotate(planchette.angle);

            ctx.beginPath();
            ctx.moveTo(0, -size * 0.8);
            ctx.quadraticCurveTo(size * 0.6, size * 0.5, 0, size * 0.5);
            ctx.quadraticCurveTo(-size * 0.6, size * 0.5, 0, -size * 0.8);
            ctx.closePath();

            const grad = ctx.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
            grad.addColorStop(0, '#a66d50');
            grad.addColorStop(0.55, '#6f3f2f');
            grad.addColorStop(1, '#361b1c');
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.85)';
            ctx.shadowBlur = 18;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255, 214, 170, 0.22)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, size * 0.27, 0, Math.PI * 2);
            const lensGlow = ctx.createRadialGradient(0, 0, size * 0.02, 0, 0, size * 0.28);
            lensGlow.addColorStop(0, 'rgba(244, 253, 255, 0.92)');
            lensGlow.addColorStop(0.35, 'rgba(166, 219, 255, 0.38)');
            lensGlow.addColorStop(1, 'rgba(130, 176, 214, 0.08)');
            ctx.fillStyle = lensGlow;
            ctx.fill();
            ctx.strokeStyle = '#d8b08d';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, size * 0.09, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 249, 239, 0.92)';
            ctx.shadowColor = 'rgba(185, 230, 255, 0.65)';
            ctx.shadowBlur = 18;
            ctx.fill();

            ctx.restore();
        }

        function updatePlanchette() {
            const speed = 0.04;
            const dx = planchette.targetX - planchette.x;
            const dy = planchette.targetY - planchette.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 0.005) {
                planchette.x += dx * speed;
                planchette.y += dy * speed;
            } else {
                if (isSpelling && currentTargetChar) {
                    if (spellingTimer === 0) {
                        audio.playSFX('letter', { volume: 0.2, playbackRate: 0.94 + Math.random() * 0.12, cooldown: 50 });
                        currentSpelledWord += currentTargetChar;
                        document.getElementById('current-spelling').innerText = currentSpelledWord;
                    }

                    spellingTimer++;
                    if (spellingTimer > 40) {
                        spellingTimer = 0;
                        currentTargetChar = null;
                        processNextChar();
                    }
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                const particleGlow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3.5);
                particleGlow.addColorStop(0, `rgba(214, 231, 255, ${0.18 + p.alpha})`);
                particleGlow.addColorStop(1, 'rgba(214, 231, 255, 0)');
                ctx.fillStyle = particleGlow;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `rgba(240, 243, 255, ${0.12 + p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawParticles();
            drawBoard();

            if (gameActive) {
                updatePlanchette();
            }
            drawPlanchette();

            requestAnimationFrame(gameLoop);
        }

        /** 7. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.46, cooldown: 250 });
            audio.playBGM();
            hideAllReactionGifs();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('story-hud').classList.remove('hidden');

            gameActive = true;
            resize();
            initParticles();

            currentNodeKey = 'start';
            document.getElementById('chat-log').innerHTML = '<p class="session-note">The session begins...</p>';
            startStory('start');

            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            hideAllReactionGifs();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('pointer-events-none');
            document.getElementById('story-hud').classList.remove('hidden');
            audio.playSFX('choice', { volume: 0.38, cooldown: 120 });
            audio.playBGM();
            gameActive = true;

            planchette.x = 0.5; planchette.y = 0.5;
            planchette.targetX = 0.5; planchette.targetY = 0.5;

            currentNodeKey = 'start';
            document.getElementById('chat-log').innerHTML = '<p class="session-note">The session begins...</p>';
            startStory('start');
        });

        resize();
        initParticles();
        gameLoop();
    });
    </script>
</body>
</html>
