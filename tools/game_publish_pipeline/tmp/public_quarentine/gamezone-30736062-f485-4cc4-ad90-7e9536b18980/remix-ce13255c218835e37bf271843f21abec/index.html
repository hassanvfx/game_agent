<![CDATA[<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Meme Maker Mini World</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap');
    :root {
      --bg: #120f24;
      --bg-2: #1c1840;
      --panel: rgba(32, 26, 58, 0.9);
      --panel-strong: rgba(49, 38, 88, 0.96);
      --accent: #8cf0ff;
      --accent-2: #ffe066;
      --accent-3: #ff7ab6;
      --text: #f7f4ff;
      --muted: #b5b2d4;
      --line: rgba(140, 240, 255, 0.22);
      --shadow: rgba(6, 10, 24, 0.52);
      --success: #7dffb1;
      --danger: #ff8da6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(140, 240, 255, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      color: var(--text);
      font-family: 'Rajdhani', system-ui, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100%;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    #app::before,
    #app::after {
      content: '';
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
      border-radius: 999px;
      filter: blur(16px);
      opacity: 0.45;
    }
    #app::before {
      width: 140px;
      height: 140px;
      top: 72px;
      left: -28px;
      background: rgba(255, 122, 182, 0.22);
    }
    #app::after {
      width: 180px;
      height: 180px;
      right: -54px;
      bottom: 120px;
      background: rgba(140, 240, 255, 0.18);
    }
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px 4px;
      position: relative;
      z-index: 1;
    }
    header h1 {
      font-size: 21px;
      margin: 0;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: 'Audiowide', system-ui, sans-serif;
      line-height: 1.05;
      color: #ffe066;
      text-shadow: 0 0 14px rgba(140, 240, 255, 0.28);
    }
    header .mode {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(19, 24, 46, 0.5);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      font-family: 'Rajdhani', system-ui, sans-serif;
    }
    #canvas-wrap {
      width: min(92vw, 520px);
      aspect-ratio: 9 / 16;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0)),
        #0f1220;
      border: 2px solid rgba(140, 240, 255, 0.28);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      touch-action: none;
      box-shadow:
        0 18px 40px var(--shadow),
        0 0 0 1px rgba(255,255,255,0.05),
        0 0 24px rgba(140, 240, 255, 0.1);
      z-index: 1;
    }
    #canvas-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 10%, transparent 90%, rgba(255,255,255,0.04)),
        repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 4px);
      mix-blend-mode: screen;
      opacity: 0.45;
      z-index: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(#1b2440, #131826);
    }
    .feedback-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }
    .feedback-card {
      position: absolute;
      right: 10px;
      width: min(34vw, 120px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(9, 13, 30, 0.74);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: translateY(14px) scale(0.92);
      transition: opacity 180ms ease, transform 180ms ease;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }
    .feedback-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .feedback-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: rgba(255,255,255,0.06);
    }
    .feedback-card span {
      display: block;
      padding: 6px 8px 8px;
      font-size: 10px;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text);
      font-weight: 700;
      font-family: 'Rajdhani', system-ui, sans-serif;
    }
    #collectGif {
      top: 10px;
    }
    #goalGif {
      bottom: 10px;
      width: min(38vw, 136px);
    }
    #panel {
      width: min(92vw, 520px);
      background: linear-gradient(180deg, var(--panel-strong), var(--panel));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      box-shadow: 0 14px 24px rgba(6, 10, 24, 0.25);
      position: relative;
      z-index: 1;
    }
    button, select {
      border: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, rgba(82, 89, 130, 0.9), rgba(47, 52, 78, 0.95));
      color: var(--text);
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 12px;
      font-family: 'Rajdhani', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
    }
    button:active {
      transform: scale(0.98);
      filter: brightness(1.08);
    }
    button.active {
      background: linear-gradient(180deg, var(--accent), #5dd6ff);
      color: #07111d;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(140, 240, 255, 0.22);
    }
    button.warn {
      background: linear-gradient(180deg, #ff8d72, #e76f51);
    }
    #footer {
      width: min(92vw, 520px);
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      padding: 0 12px 12px;
      line-height: 1.2;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
      font-family: 'Rajdhani', system-ui, sans-serif;
    }
    .row {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
    }
    .row button { flex: 1; }
    @media (max-width: 420px) {
      header h1 {
        font-size: 18px;
      }
      header .mode,
      button,
      select {
        font-size: 11px;
      }
      #footer {
        font-size: 12px;
      }
      .feedback-card {
        width: min(32vw, 106px);
      }
      #goalGif {
        width: min(34vw, 116px);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Meme Maker Mini World</h1>
      <div class="mode" id="modeLabel">Mode: Studio</div>
    </header>

    <div id="canvas-wrap">
      <canvas id="game" width="360" height="640" aria-label="Game canvas"></canvas>
      <div class="feedback-layer" aria-hidden="true">
        <!-- [agent-note][stage3] resolved-gif: collect/win feedback -> catalogs/gifs.json | keep overlays compact off center playfield -->
        <div class="feedback-card" id="collectGif">
          <img
            src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
            alt=""
            loading="lazy"
            decoding="async"
          />
          <span>Laugh chain</span>
        </div>
        <div class="feedback-card" id="goalGif">
          <img
            src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
            alt=""
            loading="lazy"
            decoding="async"
          />
          <span>Punchline landed</span>
        </div>
      </div>
    </div>

    <div id="panel">
        <button id="modeEdit" class="active">Studio</button>
        <button id="modePlay">Preview</button>
        <button id="btnSave">Save</button>
        <button id="btnLoad">Load</button>

        <button id="toolPlatform">Stage</button>
        <button id="toolCoin">Laugh</button>
        <button id="toolGoal">Punchline</button>
        <button id="toolErase">Erase</button>

        <div class="row">
          <button id="btnClear" class="warn">Clear</button>
          <button id="btnTestJump">Jump</button>
          <button id="btnBgm">Mix On</button>
        </div>
    </div>

    <div id="footer">
      Build the meme run. In Preview, drag the avatar to move, tap Jump, collect laughs, and reach the punchline.
    </div>
  </div>

  <audio id="bgm" loop preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const modeLabel = document.getElementById('modeLabel');
    const bgm = document.getElementById('bgm');
    const btnBgm = document.getElementById('btnBgm');
    const collectGif = document.getElementById('collectGif');
    const goalGif = document.getElementById('goalGif');

    const GRID = 20;
    const COLS = Math.floor(canvas.width / GRID);
    const ROWS = Math.floor(canvas.height / GRID);

    const Tile = {
      Empty: 0,
      Platform: 1,
      Coin: 2,
      Goal: 3,
    };

    const toolButtons = {
      platform: document.getElementById('toolPlatform'),
      coin: document.getElementById('toolCoin'),
      goal: document.getElementById('toolGoal'),
      erase: document.getElementById('toolErase'),
    };

    const audioState = {
      unlocked: false,
      sfxCooldowns: new Map(),
      pools: {},
      uiButtons: new Set(),
    };

    const SFX_SOURCES = {
      click: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
      blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
      jump: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3',
      land: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',
      pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
      goal: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
      save: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
      clear: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3',
      modePlay: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
      modeEdit: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3',
    };

    let mode = 'edit';
    let tool = 'platform';
    let tiles = makeEmpty();
    let player = { x: 2 * GRID, y: 2 * GRID, w: 16, h: 18, vx: 0, vy: 0, onGround: false };
    let dragPlayer = false;
    let coinsCollected = 0;
    let goalReached = false;
    let bgmOn = true;
    let wasOnGround = false;
    let goalCelebrationPlayed = false;
    let collectGifTimer = 0;
    let goalGifTimer = 0;

    function makeEmpty() {
      const grid = [];
      for (let y = 0; y < ROWS; y++) {
        const row = [];
        for (let x = 0; x < COLS; x++) row.push(Tile.Empty);
        grid.push(row);
      }
      return grid;
    }

    function createAudioPool(src, volume = 0.5, size = 3) {
      const nodes = Array.from({ length: size }, () => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = volume;
        return audio;
      });
      return {
        nodes,
        next: 0,
      };
    }

    function unlockAudio() {
      if (audioState.unlocked) return;
      audioState.unlocked = true;
      bgm.volume = 0.2;
      bgm.preload = 'auto';
      audioState.pools.click = createAudioPool(SFX_SOURCES.click, 0.35, 3);
      audioState.pools.blocked = createAudioPool(SFX_SOURCES.blocked, 0.38, 2);
      audioState.pools.jump = createAudioPool(SFX_SOURCES.jump, 0.45, 3);
      audioState.pools.land = createAudioPool(SFX_SOURCES.land, 0.28, 2);
      audioState.pools.pickup = createAudioPool(SFX_SOURCES.pickup, 0.42, 3);
      audioState.pools.goal = createAudioPool(SFX_SOURCES.goal, 0.5, 2);
      audioState.pools.save = createAudioPool(SFX_SOURCES.save, 0.38, 2);
      audioState.pools.clear = createAudioPool(SFX_SOURCES.clear, 0.33, 2);
      audioState.pools.modePlay = createAudioPool(SFX_SOURCES.modePlay, 0.4, 2);
      audioState.pools.modeEdit = createAudioPool(SFX_SOURCES.modeEdit, 0.34, 2);
      if (bgmOn) syncBgm();
    }

    function playSfx(name, cooldownMs = 80) {
      if (!audioState.unlocked) return;
      const pool = audioState.pools[name];
      if (!pool) return;
      const now = performance.now();
      const lastPlayed = audioState.sfxCooldowns.get(name) || 0;
      if (now - lastPlayed < cooldownMs) return;
      audioState.sfxCooldowns.set(name, now);
      const audio = pool.nodes[pool.next];
      pool.next = (pool.next + 1) % pool.nodes.length;
      try {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } catch (_) {}
    }

    function syncBgm() {
      if (!audioState.unlocked) return;
      if (bgmOn) {
        bgm.play().catch(() => {});
      } else {
        bgm.pause();
      }
      btnBgm.textContent = bgmOn ? 'Mix On' : 'Mix Off';
    }

    function showGif(el, duration = 1400) {
      el.classList.add('show');
      if (el === collectGif) collectGifTimer = duration;
      if (el === goalGif) goalGifTimer = duration;
    }

    function hideGif(el) {
      el.classList.remove('show');
      if (el === collectGif) collectGifTimer = 0;
      if (el === goalGif) goalGifTimer = 0;
    }

    function updateFeedback(dt) {
      if (collectGifTimer > 0) {
        collectGifTimer -= dt * 1000;
        if (collectGifTimer <= 0) hideGif(collectGif);
      }
      if (goalGifTimer > 0) {
        goalGifTimer -= dt * 1000;
        if (goalGifTimer <= 0) hideGif(goalGif);
      }
    }

    function resetPlayState() {
      player.x = 2 * GRID;
      player.y = 2 * GRID;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      wasOnGround = false;
      coinsCollected = 0;
      goalReached = false;
      goalCelebrationPlayed = false;
      hideGif(goalGif);
      hideGif(collectGif);
    }

    function setMode(next) {
      const previous = mode;
      mode = next;
      modeLabel.textContent = `Mode: ${mode === 'edit' ? 'Studio' : 'Preview'}`;
      document.getElementById('modeEdit').classList.toggle('active', mode === 'edit');
      document.getElementById('modePlay').classList.toggle('active', mode === 'play');
      if (mode === 'play') {
        resetPlayState();
        playSfx('modePlay', 180);
      } else if (previous !== next) {
        playSfx('modeEdit', 180);
      }
    }

    function setTool(next) {
      tool = next;
      Object.values(toolButtons).forEach(b => b.classList.remove('active'));
      toolButtons[next]?.classList.add('active');
      playSfx('click', 40);
    }

    function saveLevel() {
      const data = {
        tiles,
      };
      localStorage.setItem('gm-mini-world', JSON.stringify(data));
      playSfx('save', 120);
    }

    function loadLevel() {
      const raw = localStorage.getItem('gm-mini-world');
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (Array.isArray(data.tiles)) {
          tiles = data.tiles;
          playSfx('save', 120);
        }
      } catch (_) {}
    }

    function clearLevel() {
      tiles = makeEmpty();
      playSfx('clear', 160);
    }

    function gridPosFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
      const gx = Math.floor(cx / GRID);
      const gy = Math.floor(cy / GRID);
      return { gx, gy, cx, cy };
    }

    function paintAt(gx, gy) {
      if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return;
      if (tool === 'erase') {
        tiles[gy][gx] = Tile.Empty;
      } else if (tool === 'platform') {
        tiles[gy][gx] = Tile.Platform;
      } else if (tool === 'coin') {
        tiles[gy][gx] = Tile.Coin;
      } else if (tool === 'goal') {
        tiles[gy][gx] = Tile.Goal;
      }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function tileRect(x, y) {
      return { x: x * GRID, y: y * GRID, w: GRID, h: GRID };
    }

    function update(dt) {
      if (mode !== 'play') {
        updateFeedback(dt);
        return;
      }

      player.vy += 900 * dt;
      player.vx *= 0.9;

      player.x += player.vx * dt;
      collide('x');
      player.y += player.vy * dt;
      player.onGround = false;
      collide('y');

      if (!wasOnGround && player.onGround && Math.abs(player.vy) < 1) {
        playSfx('land', 90);
      }
      wasOnGround = player.onGround;

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const t = tiles[y][x];
          if (t === Tile.Coin) {
            const r = tileRect(x, y);
            if (rectsOverlap(player, r)) {
              tiles[y][x] = Tile.Empty;
              coinsCollected += 1;
              playSfx('pickup', 65);
              showGif(collectGif, 1050);
            }
          } else if (t === Tile.Goal) {
            const r = tileRect(x, y);
            if (rectsOverlap(player, r)) {
              goalReached = true;
              if (!goalCelebrationPlayed) {
                goalCelebrationPlayed = true;
                playSfx('goal', 200);
                showGif(goalGif, 2200);
              }
            }
          }
        }
      }

      updateFeedback(dt);
    }

    function collide(axis) {
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (tiles[y][x] !== Tile.Platform) continue;
          const r = tileRect(x, y);
          if (rectsOverlap(player, r)) {
            if (axis === 'x') {
              if (player.vx > 0) player.x = r.x - player.w;
              else if (player.vx < 0) player.x = r.x + r.w;
              player.vx = 0;
            } else {
              if (player.vy > 0) {
                player.y = r.y - player.h;
                player.vy = 0;
                player.onGround = true;
              } else if (player.vy < 0) {
                player.y = r.y + r.h;
                player.vy = 0;
              }
            }
          }
        }
      }
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * GRID, 0);
        ctx.lineTo(x * GRID, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * GRID);
        ctx.lineTo(canvas.width, y * GRID);
        ctx.stroke();
      }
    }

    function drawBackdrop() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#2d1f66');
      gradient.addColorStop(0.45, '#1b2558');
      gradient.addColorStop(1, '#0d1328');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(140, 240, 255, 0.08)';
      for (let i = 0; i < 18; i++) {
        const x = (i * 37) % canvas.width;
        const y = 28 + (i % 6) * 54;
        ctx.beginPath();
        ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
      for (let i = 0; i < 9; i++) {
        ctx.fillRect(i * 48, canvas.height - 110 + (i % 2) * 10, 26, 70);
      }
    }

    function drawPlatform(r) {
      const top = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      top.addColorStop(0, '#88f4ff');
      top.addColorStop(0.4, '#6ea7ff');
      top.addColorStop(1, '#2e3a82');
      ctx.fillStyle = top;
      ctx.fillRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
      ctx.fillStyle = 'rgba(10, 15, 24, 0.32)';
      ctx.fillRect(r.x + 2, r.y + r.h - 5, r.w - 4, 3);
    }

    function drawLaugh(r) {
      const cx = r.x + r.w / 2;
      const cy = r.y + r.h / 2;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a3b00';
      ctx.beginPath();
      ctx.arc(cx - 2.5, cy - 1.5, 1, 0, Math.PI * 2);
      ctx.arc(cx + 2.5, cy - 1.5, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#5a3b00';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(cx, cy + 0.5, 3.3, 0.15, Math.PI - 0.15);
      ctx.stroke();
    }

    function drawGoal(r) {
      ctx.fillStyle = '#ff7ab6';
      ctx.beginPath();
      ctx.moveTo(r.x + r.w / 2, r.y + 3);
      ctx.lineTo(r.x + r.w - 3, r.y + r.h - 4);
      ctx.lineTo(r.x + 3, r.y + r.h - 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(r.x + 7, r.y + 6, 6, 2);
    }

    function drawAvatar() {
      const x = player.x;
      const y = player.y;
      ctx.fillStyle = '#7af0ff';
      ctx.beginPath();
      ctx.roundRect(x, y + 5, player.w, player.h - 5, 6);
      ctx.fill();

      ctx.fillStyle = '#ffd8f1';
      ctx.beginPath();
      ctx.arc(x + player.w / 2, y + 5, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0d1328';
      ctx.beginPath();
      ctx.arc(x + 5, y + 4.5, 1.1, 0, Math.PI * 2);
      ctx.arc(x + 11, y + 4.5, 1.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#0d1328';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x + player.w / 2, y + 6.2, 2.5, 0.2, Math.PI - 0.2);
      ctx.stroke();

      ctx.fillStyle = '#ff7ab6';
      ctx.fillRect(x + 3, y + 10, player.w - 6, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(x + 4, y + 12, player.w - 8, 2);
    }

    function drawHudPill(x, y, w, h, fill) {
      ctx.fillStyle = 'rgba(9, 13, 30, 0.78)';
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140, 240, 255, 0.24)';
      ctx.stroke();
      ctx.fillStyle = fill;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackdrop();
      drawGrid();

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const t = tiles[y][x];
          if (t === Tile.Empty) continue;
          const r = tileRect(x, y);
          if (t === Tile.Platform) {
            drawPlatform(r);
          } else if (t === Tile.Coin) {
            drawLaugh(r);
          } else if (t === Tile.Goal) {
            drawGoal(r);
          }
        }
      }

      if (mode === 'play') {
        drawAvatar();

        ctx.font = "700 13px 'Rajdhani', system-ui, sans-serif";
        drawHudPill(8, 8, 110, 24, '#ffe066');
        ctx.fillText(`😂 ${coinsCollected}`, 18, 24);
        if (goalReached) {
          drawHudPill(70, 8, 228, 24, '#8cf0ff');
          ctx.fillText('Punchline landed! Keep remixing!', 79, 24);
        }
      } else {
        ctx.font = "700 13px 'Rajdhani', system-ui, sans-serif";
        drawHudPill(8, 8, 192, 24, '#f7f4ff');
        ctx.fillText('Studio: tap to place tiles', 16, 24);
      }
    }

    let last = performance.now();
    function loop(t) {
      const dt = Math.min(0.033, (t - last) / 1000);
      last = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function jump() {
      if (mode !== 'play') {
        playSfx('blocked', 160);
        return;
      }
      if (player.onGround) {
        player.vy = -360;
        player.onGround = false;
        playSfx('jump', 80);
      } else {
        playSfx('blocked', 160);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      unlockAudio();
      const { gx, gy, cx, cy } = gridPosFromEvent(e);
      if (mode === 'edit') {
        paintAt(gx, gy);
      } else {
        const p = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (cx >= p.x && cx <= p.x + p.w && cy >= p.y && cy <= p.y + p.h) {
          dragPlayer = true;
        } else {
          if (cx < player.x) player.vx = -120;
          if (cx > player.x + player.w) player.vx = 120;
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (mode !== 'edit') {
        if (!dragPlayer) return;
        const { cx, cy } = gridPosFromEvent(e);
        player.x = cx - player.w / 2;
        player.y = cy - player.h / 2;
        return;
      }
      if (e.buttons) {
        const { gx, gy } = gridPosFromEvent(e);
        paintAt(gx, gy);
      }
    });

    canvas.addEventListener('pointerup', () => { dragPlayer = false; });
    canvas.addEventListener('pointercancel', () => { dragPlayer = false; });

    document.getElementById('modeEdit').addEventListener('click', () => setMode('edit'));
    document.getElementById('modePlay').addEventListener('click', () => setMode('play'));
    document.getElementById('btnSave').addEventListener('click', saveLevel);
    document.getElementById('btnLoad').addEventListener('click', loadLevel);
    document.getElementById('btnClear').addEventListener('click', clearLevel);
    document.getElementById('btnTestJump').addEventListener('click', jump);

    btnBgm.addEventListener('click', () => {
      unlockAudio();
      bgmOn = !bgmOn;
      syncBgm();
      playSfx('click', 40);
    });

    toolButtons.platform.addEventListener('click', () => setTool('platform'));
    toolButtons.coin.addEventListener('click', () => setTool('coin'));
    toolButtons.goal.addEventListener('click', () => setTool('goal'));
    toolButtons.erase.addEventListener('click', () => setTool('erase'));

    document.querySelectorAll('button').forEach((button) => {
      button.addEventListener('pointerdown', () => {
        unlockAudio();
        if (audioState.uiButtons.has(button.id)) return;
        audioState.uiButtons.add(button.id);
      });
      button.addEventListener('click', () => {
        playSfx('click', 25);
      });
    });

    setTool('platform');
    setMode('edit');
    loadLevel();

    document.body.addEventListener('pointerdown', () => {
      unlockAudio();
    }, { once: true });
  </script>
</body>
</html>
