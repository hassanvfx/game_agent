<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal Shard Stabilizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-deep: #06110c;
            --bg-mid: #102112;
            --bg-glow: #19351b;
            --panel-fill: rgba(8, 22, 17, 0.78);
            --panel-stroke: rgba(124, 255, 64, 0.28);
            --text-main: #f2fff1;
            --text-soft: #c2dfc5;
            --accent-cyan: #73f7ff;
            --accent-blue: #5aa7ff;
            --accent-pink: #ff4fd8;
            --accent-gold: #ffe36a;
            --shadow-core: rgba(0, 0, 0, 0.45);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(124, 255, 64, 0.16), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 79, 216, 0.13), transparent 28%),
                linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0 49.5%, rgba(124, 255, 64, 0.05) 49.5% 50.5%, transparent 50.5% 100%),
                linear-gradient(transparent 0 49.4%, rgba(115, 247, 255, 0.04) 49.4% 50.6%, transparent 50.6% 100%);
            background-size: 84px 84px;
            opacity: 0.34;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 14%, transparent 86%, rgba(0, 0, 0, 0.22));
            mix-blend-mode: screen;
            opacity: 0.6;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(16, 24, 44, 0.9), rgba(9, 14, 27, 0.76));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                0 10px 36px var(--shadow-core),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                 0 0 30px rgba(124, 255, 64, 0.13);
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                 radial-gradient(circle at 50% 50%, rgba(124, 255, 64, 0.12), transparent 20%),
                 radial-gradient(circle at 50% 50%, rgba(255, 79, 216, 0.07), transparent 32%);
            z-index: 0;
        }

        #game-container::after {
            content: "C-137";
            position: absolute;
            right: clamp(0.85rem, 3vw, 1.4rem);
            top: clamp(0.85rem, 3vw, 1.4rem);
            z-index: 4;
            pointer-events: none;
            color: rgba(124, 255, 64, 0.22);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(0.7rem, 2.6vw, 0.95rem);
            letter-spacing: 0.22em;
            text-shadow: 0 0 14px rgba(124, 255, 64, 0.42);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel {
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            max-width: min(88vw, 34rem);
            margin: 1rem;
            position: relative;
            overflow: hidden;
        }

        .panel::after {
            content: "";
            position: absolute;
            inset: 0.55rem;
            border-radius: 1rem;
            border: 1px dashed rgba(115, 247, 255, 0.18);
            box-shadow: inset 0 0 20px rgba(124, 255, 64, 0.05);
            pointer-events: none;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                 linear-gradient(135deg, rgba(124, 255, 64, 0.11), transparent 45%),
                 radial-gradient(circle at top right, rgba(255, 79, 216, 0.18), transparent 34%);
            pointer-events: none;
        }

        .screen-title {
            margin: 0 0 0.35rem;
            color: var(--text-main);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(2.05rem, 8vw, 3.35rem);
            font-weight: 400;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-shadow:
                 0 0 10px rgba(124, 255, 64, 0.78),
                 0 0 28px rgba(115, 247, 255, 0.42);
            position: relative;
            z-index: 1;
        }

        .screen-subtitle {
            margin: 0 0 0.75rem;
            color: var(--accent-gold);
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .screen-instructions {
            margin: 0 0 1.75rem;
            color: var(--text-soft);
            font-size: 1rem;
            line-height: 1.45;
            position: relative;
            z-index: 1;
        }

        .action-btn {
            padding: 0.9rem 2rem;
            border: 1px solid rgba(122, 240, 255, 0.4);
            border-radius: 9999px;
             background:
                radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.58), transparent 18%),
                linear-gradient(180deg, #b8ff66 0%, #62e83f 100%);
            color: #04111f;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            box-shadow:
                 0 0 20px rgba(124, 255, 64, 0.36),
                 0 0 0 4px rgba(124, 255, 64, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
            position: relative;
            z-index: 1;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-1px) scale(1.03);
            box-shadow:
                 0 0 24px rgba(124, 255, 64, 0.48),
                0 8px 16px rgba(0, 0, 0, 0.24);
            filter: brightness(1.05);
        }

        #level-screen-title {
            margin: 0 0 1rem;
            color: var(--text-main);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(1.85rem, 6vw, 2.7rem);
            font-weight: 400;
            letter-spacing: 0.12em;
             text-shadow: 0 0 18px rgba(124, 255, 64, 0.34);
            position: relative;
            z-index: 1;
        }

        #score-display {
            margin-bottom: 1.5rem;
            color: var(--accent-cyan);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(1rem, 4vw, 1.4rem);
            font-weight: 400;
            letter-spacing: 0.06em;
            position: relative;
            z-index: 1;
        }

        #hud {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            pointer-events: none;
        }

        .hud-label {
            color: var(--text-main);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(0.78rem, 2.8vw, 1rem);
            font-weight: 400;
            letter-spacing: 0.1em;
            opacity: 0.96;
            padding: 0.5rem 0.78rem;
            border-radius: 999px;
            background:
                linear-gradient(90deg, rgba(124, 255, 64, 0.16), transparent 34%),
                linear-gradient(180deg, rgba(12, 18, 34, 0.86), rgba(8, 11, 21, 0.72));
             border: 1px solid rgba(124, 255, 64, 0.28);
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.26),
                 0 0 16px rgba(124, 255, 64, 0.2);
            text-shadow: 0 0 10px rgba(115, 247, 255, 0.32);
            max-width: calc(100vw - 2rem);
            white-space: nowrap;
        }

        #feedback-gifs {
            position: absolute;
            right: clamp(0.6rem, 2.5vw, 1.25rem);
            bottom: clamp(0.7rem, 3vw, 1.4rem);
            z-index: 35;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        .feedback-gif {
            width: clamp(72px, 18vw, 124px);
            height: clamp(72px, 18vw, 124px);
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(122, 240, 255, 0.35);
            background: rgba(5, 11, 19, 0.72);
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.34),
                0 0 18px rgba(89, 168, 255, 0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.9);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.is-visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        @media (max-width: 640px) {
            .panel {
                padding: 1.4rem;
                border-radius: 1.1rem;
            }

            .screen-title {
                font-size: clamp(2.05rem, 12vw, 3rem);
                letter-spacing: 0.14em;
            }

            .screen-instructions {
                font-size: 0.95rem;
            }

            .action-btn {
                width: 100%;
            }

            #hud {
                top: 1rem;
                left: 1rem;
            }

            .hud-label {
                padding: 0.48rem 0.7rem;
            }

            .feedback-gif {
                width: 72px;
                height: 72px;
                border-radius: 0.8rem;
            }
        }
    </style>
</head>
<body>

<!-- Editable Config -->
<script id="game-config" type="application/x-game-config">
{
    "snapDistance": { "type": "number", "label": "Snap Distance", "value": 40, "min": 10, "max": 100 },
     "primaryColor": { "type": "color", "label": "Portal Glow", "value": "#7cff40" },
     "secondaryColor": { "type": "color", "label": "Rift Glitch", "value": "#ff4fd8" },
    "bgSpeed": { "type": "number", "label": "Background Speed", "value": 0.5, "min": 0, "max": 5 }
}
</script>

    <!-- [agent-note][world-design-superprompt] resolved-font-remap: primary=Orbitron secondary=Rajdhani via catalogs/fonts.json -->
    <!-- [agent-note][world-design-superprompt] resolved-audio: portal ambience/snap/win/start/ui/fail use scifi catalog URLs; hooks unchanged -->
    <!-- Audio Assets -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM (Portal Garage Loop)" src="https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_snap" data-editable="audio" data-label="SFX (Portal Shard Lock)" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3" preload="auto"></audio>
    <audio id="sfx_win" data-editable="audio" data-label="SFX (Dimension Stabilized)" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_02.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX (Portal Device Boot)" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="SFX (Portal UI Click)" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="SFX (Timeline Sputter)" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3" preload="auto"></audio>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">

         <!-- [agent-note][stage3] resolved-gif: fail + win overlays via catalogs/gifs.json; keep compact off-playfield -->
         <div id="feedback-gifs" aria-hidden="true">
             <img id="fail-gif" class="feedback-gif hidden" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="">
             <img id="win-gif" class="feedback-gif hidden" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="">
         </div>

         <!-- Start Screen -->
         <div id="start-screen" class="glass panel fade-in">
              <h1 class="screen-title">PORTAL SHARDS</h1>
               <p class="screen-subtitle">Rick's prism is busted across dimensions.</p>
               <p class="screen-instructions">Drag each sentient shard into the center rift. Release near the core to lock the signal.</p>
              <button id="start-btn" class="action-btn">INIT PORTAL</button>
         </div>

        <!-- Level Complete Screen -->
        <div id="level-screen" class="hidden glass panel">
            <h2 id="level-screen-title">PORTAL STABLE</h2>
            <div id="score-display">Dimension 1</div>
            <button id="next-btn" class="action-btn">NEXT DIMENSION</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-label"><span id="level-indicator">DIMENSION 1 / GARAGE LINK</span></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- §1 Configuration & State ---
    window.gameConfig = {
        snapDistance: 40,
        primaryColor: "#7cff40",
        secondaryColor: "#ff4fd8",
        bgSpeed: 0.5
    };

    // Config Hot Reload Support
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let gameState = 'START'; // START, PLAYING, ANIMATING, WIN
    let level = 1;
    let pieces = [];
    let particles = [];
    let bgParticles = [];
    let dragInfo = { active: false, piece: null, offsetX: 0, offsetY: 0, startX: 0, startY: 0 };
    let lastTime = 0;
    let winTimer = 0;
    let audioUnlocked = false;
    let feedbackTimer = null;

    const dimensionStyles = [
        {
            label: 'DIMENSION 1 / GARAGE LINK',
            win: 'Garage Link Stabilized',
            colors: ['#7cff40', '#73f7ff', '#ffe36a', '#31f2aa', '#9d65ff'],
            accent: '#7cff40',
            secondary: '#73f7ff'
        },
        {
            label: 'DIMENSION 2 / MORTY SIGNAL',
            win: 'Morty Signal Stabilized',
            colors: ['#ffe36a', '#7cff40', '#ff9f43', '#73f7ff', '#ff4fd8'],
            accent: '#ffe36a',
            secondary: '#ff4fd8'
        },
        {
            label: 'DIMENSION 3 / MEESEEKS ALIGNMENT',
            win: 'Meeseeks Alignment Stable',
            colors: ['#42cfff', '#73f7ff', '#7cff40', '#ffffff', '#9d65ff'],
            accent: '#42cfff',
            secondary: '#7cff40'
        },
        {
            label: 'DIMENSION 4 / CITADEL GRID',
            win: 'Citadel Grid Authorized',
            colors: ['#9d65ff', '#73f7ff', '#7cff40', '#ffe36a', '#ff4fd8'],
            accent: '#9d65ff',
            secondary: '#73f7ff'
        },
        {
            label: 'DIMENSION 5 / RIFT SEAL',
            win: 'Cronenberg Rift Sealed',
            colors: ['#7cff40', '#ff4fd8', '#9d65ff', '#ffe36a', '#73f7ff'],
            accent: '#ff4fd8',
            secondary: '#7cff40'
        }
    ];

    function currentDimensionStyle() {
        return dimensionStyles[(Math.max(1, level) - 1) % dimensionStyles.length];
    }

    function updateDimensionCopy() {
        const style = currentDimensionStyle();
        document.getElementById('level-indicator').innerText = style.label;
    }

    // --- §2 Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        snap: document.getElementById('sfx_snap'),
        win: document.getElementById('sfx_win'),
        start: document.getElementById('sfx_start'),
        ui: document.getElementById('sfx_ui'),
        fail: document.getElementById('sfx_fail')
    };
    const feedbackEls = {
        fail: document.getElementById('fail-gif'),
        win: document.getElementById('win-gif')
    };

    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        audioCtx.resume().catch(() => {});
        sounds.bgm.volume = 0.18;
        sounds.bgm.play().catch(() => {});
    }

    function playSfx(name) {
        if (!audioUnlocked) return;
        const el = sounds[name];
        if (el) {
            if (!el.paused && el.currentTime < 0.08) return;
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => playSynth(name));
        } else {
            playSynth(name);
        }
    }

    function showFeedback(type, duration = 1200) {
        const el = feedbackEls[type];
        if (!el) return;
        Object.values(feedbackEls).forEach(node => node.classList.remove('is-visible'));
        clearTimeout(feedbackTimer);
        el.classList.remove('hidden');
        requestAnimationFrame(() => el.classList.add('is-visible'));
        feedbackTimer = setTimeout(() => {
            el.classList.remove('is-visible');
        }, duration);
    }

    function playSynth(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'snap') {
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'win' || type === 'start') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.24, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === 'fail' || type === 'ui') {
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }
    }

    // --- §3 Geometry & Level Gen ---
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (gameState === 'PLAYING') resetLevel();
    }
    window.addEventListener('resize', resize);

    function createPoly(sides, radius, cx, cy) {
        const points = [];
        for (let i = 0; i < sides; i++) {
            const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
            points.push({
                x: cx + Math.cos(angle) * radius,
                y: cy + Math.sin(angle) * radius
            });
        }
        return points;
    }

    function generatePieces(lvl) {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const radius = Math.min(window.innerWidth, window.innerHeight) * 0.35;
        const sides = 3 + (lvl % 5); // 3, 4, 5, 6, 7 sides
        const poly = createPoly(sides, radius, cx, cy);

        // Split polygon into triangles connecting to center
        const newPieces = [];
        const colors = currentDimensionStyle().colors;

        for (let i = 0; i < sides; i++) {
            const p1 = poly[i];
            const p2 = poly[(i + 1) % sides];
            const center = { x: cx, y: cy };

            // Define shape path relative to (0,0)
            const shape = [
                { x: 0, y: 0 }, // Center relative to itself
                { x: p1.x - cx, y: p1.y - cy },
                { x: p2.x - cx, y: p2.y - cy }
            ];

            // Random scatter position
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.min(window.innerWidth, window.innerHeight) * 0.4 + Math.random() * 50;
            const startX = cx + Math.cos(angle) * dist;
            const startY = cy + Math.sin(angle) * dist;

            newPieces.push({
                id: i,
                shape: shape, // Array of {x,y} relative to origin
                targetX: cx,
                targetY: cy,
                x: startX,
                y: startY,
                color: colors[i % colors.length],
                locked: false,
                scale: 1,
                rotation: (Math.random() - 0.5) * 1 // Random start rotation
            });
        }
        return newPieces;
    }

    function resetLevel() {
        pieces = generatePieces(level);
        // Ensure pieces stay within bounds roughly
        pieces.forEach(p => {
            p.x = Math.max(50, Math.min(window.innerWidth - 50, p.x));
            p.y = Math.max(50, Math.min(window.innerHeight - 50, p.y));
        });

        updateDimensionCopy();

        // Reset BG particles
        bgParticles = [];
        for (let i = 0; i < 38; i++) {
            bgParticles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.5 + 0.1,
                alpha: Math.random() * 0.5 + 0.1,
                wobble: Math.random() * Math.PI * 2,
                tone: i % 5
            });
        }
    }

    // --- §4 Input Handling ---
    function isPointInPiece(px, py, piece) {
        // Simple bounding box check first
        // Then detailed polygon check if needed.
        // Since we have rotation, we must transform point to local space or shape to world.
        // For this game, let's assume no rotation during gameplay (it corrects itself) or simplified check.
        // Actually, we added random rotation. Let's simplify: pieces rotate to 0 when dragged?
        // Better: Pieces have fixed rotation 0 for target, but random rotation when scattered.
        // When picked up, they rotate smoothly to 0.

        // Simplified hit test: Check distance to center of mass approx
        // Centroid of triangle (0,0), (x1,y1), (x2,y2) is average.
        const cx = piece.x + (piece.shape[0].x + piece.shape[1].x + piece.shape[2].x) / 3;
        const cy = piece.y + (piece.shape[0].y + piece.shape[1].y + piece.shape[2].y) / 3;
        const dx = px - cx;
        const dy = py - cy;
        return (dx * dx + dy * dy) < 3000; // Approx radius 55
    }

    canvas.addEventListener('pointerdown', e => {
        if (gameState !== 'PLAYING') return;
        unlockAudio();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check unlocked pieces, top one first (reverse order)
        for (let i = pieces.length - 1; i >= 0; i--) {
            const p = pieces[i];
            if (!p.locked && isPointInPiece(x, y, p)) {
                dragInfo.active = true;
                dragInfo.piece = p;
                dragInfo.offsetX = x - p.x;
                dragInfo.offsetY = y - p.y;
                dragInfo.startX = p.x;
                dragInfo.startY = p.y;

                // Move to top of stack
                pieces.splice(i, 1);
                pieces.push(p);

                // Juice
                createParticles(x, y, 5, p.color);
                break;
            }
        }
    }, { passive: false });

    canvas.addEventListener('pointermove', e => {
        if (!dragInfo.active) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        dragInfo.piece.x = x - dragInfo.offsetX;
        dragInfo.piece.y = y - dragInfo.offsetY;
    }, { passive: false });

    function handleEnd() {
        if (!dragInfo.active) return;
        const p = dragInfo.piece;

        // Check snap
        const dx = p.x - p.targetX;
        const dy = p.y - p.targetY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < window.gameConfig.snapDistance) {
            p.x = p.targetX;
            p.y = p.targetY;
            p.locked = true;
            p.rotation = 0;
            playSfx('snap');
            createParticles(p.x, p.y, 20, '#ffffff');

            // Check Win
            if (pieces.every(pc => pc.locked)) {
                winLevel();
            }
        } else {
            playSfx('fail');
            showFeedback('fail', 900);
        }

        dragInfo.active = false;
        dragInfo.piece = null;
    }

    canvas.addEventListener('pointerup', handleEnd);
    canvas.addEventListener('pointercancel', handleEnd);

    // --- §5 Visuals & Juice ---
    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    function drawRickSilhouette(ctx, x, y, scale, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = 'rgba(115, 247, 255, 0.46)';
        ctx.fillStyle = 'rgba(124, 255, 64, 0.05)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 9; i++) {
            const angle = -Math.PI / 2 + i * Math.PI * 2 / 9;
            const r = i % 2 === 0 ? 28 : 14;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r - 18);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 8, 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-18, 30);
        ctx.lineTo(-34, 72);
        ctx.lineTo(34, 72);
        ctx.lineTo(18, 30);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawMortySignal(ctx, x, y, width, time, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = 'rgba(255, 227, 106, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i <= 9; i++) {
            const px = x + (i / 9) * width;
            const py = y + Math.sin(time * 1.5 + i) * 7 + (i % 2 ? 10 : -10);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawMeeseeksBean(ctx, x, y, radius, time, alpha) {
        ctx.save();
        ctx.translate(x, y + Math.sin(time + x * 0.01) * 3);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(66, 207, 255, 0.12)';
        ctx.strokeStyle = 'rgba(115, 247, 255, 0.38)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 0.72, radius, -0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(242, 255, 241, 0.55)';
        ctx.beginPath();
        ctx.arc(-radius * 0.18, -radius * 0.2, 2.2, 0, Math.PI * 2);
        ctx.arc(radius * 0.18, -radius * 0.2, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawCitadelStamp(ctx, x, y, size, time, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(time * 0.12);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = 'rgba(157, 101, 255, 0.45)';
        ctx.lineWidth = 2;
        ctx.strokeRect(-size / 2, -size / 2, size, size);
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.28, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-size * 0.32, 0);
        ctx.lineTo(size * 0.32, 0);
        ctx.moveTo(0, -size * 0.32);
        ctx.lineTo(0, size * 0.32);
        ctx.stroke();
        ctx.restore();
    }

    function drawRiftTendril(ctx, x, y, length, time, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = 'rgba(255, 79, 216, 0.38)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(
            x + Math.sin(time) * 26,
            y + length * 0.28,
            x - 38,
            y + length * 0.55,
            x + Math.cos(time * 0.8) * 18,
            y + length
        );
        ctx.stroke();
        ctx.strokeStyle = 'rgba(124, 255, 64, 0.22)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    function drawProceduralBackground(width, height, time) {
        const style = currentDimensionStyle();
        const dimIndex = (Math.max(1, level) - 1) % dimensionStyles.length;

        const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
        bgGradient.addColorStop(0, dimIndex === 3 ? '#0b1020' : '#06130c');
        bgGradient.addColorStop(0.48, dimIndex === 4 ? '#1b101c' : '#102418');
        bgGradient.addColorStop(1, '#040907');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalAlpha = 0.65;
        ctx.strokeStyle = dimIndex === 3 ? 'rgba(157, 101, 255, 0.16)' : 'rgba(115, 247, 255, 0.11)';
        ctx.lineWidth = 1;
        const grid = 58;
        const drift = (time * 10 * window.gameConfig.bgSpeed) % grid;
        for (let x = -grid + drift; x < width + grid; x += grid) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x - width * 0.08, height);
            ctx.stroke();
        }
        for (let y = -grid + drift * 0.55; y < height + grid; y += grid) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
        ctx.restore();

        const coreGlow = ctx.createRadialGradient(width / 2, height / 2, 30, width / 2, height / 2, Math.min(width, height) * 0.46);
        coreGlow.addColorStop(0, `${style.accent}55`);
        coreGlow.addColorStop(0.35, 'rgba(115, 247, 255, 0.10)');
        coreGlow.addColorStop(1, 'rgba(8, 22, 13, 0)');
        ctx.fillStyle = coreGlow;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.rotate(time * 0.18);
        for (let ring = 1; ring <= 5; ring++) {
            ctx.strokeStyle = ring % 2 ? 'rgba(124, 255, 64, 0.13)' : 'rgba(115, 247, 255, 0.10)';
            ctx.lineWidth = ring === 1 ? 2 : 1;
            ctx.setLineDash(ring % 2 ? [18, 12] : [4, 16]);
            ctx.beginPath();
            ctx.arc(0, 0, Math.min(width, height) * (0.08 + ring * 0.055), 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();

        drawRickSilhouette(ctx, Math.max(34, width * 0.12), height * 0.78, 1.05, dimIndex === 0 ? 0.28 : 0.13);
        drawMortySignal(ctx, width * 0.1, height * 0.25, width * 0.32, time, dimIndex === 1 ? 0.44 : 0.14);
        drawMeeseeksBean(ctx, width * 0.84, height * 0.72, 34, time, dimIndex === 2 ? 0.42 : 0.13);
        drawCitadelStamp(ctx, width * 0.82, height * 0.22, 54, time, dimIndex === 3 ? 0.4 : 0.12);
        drawRiftTendril(ctx, width * 0.08, height * 0.06, height * 0.22, time, dimIndex === 4 ? 0.42 : 0.1);
        drawRiftTendril(ctx, width * 0.92, height * 0.58, height * 0.24, time + 1.7, dimIndex === 4 ? 0.36 : 0.08);
    }

    function drawShape(ctx, p, isOutline = false) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);

        const scale = p.scale || 1;
        ctx.scale(scale, scale);

        ctx.beginPath();
        ctx.moveTo(p.shape[0].x, p.shape[0].y);
        for (let i = 1; i < p.shape.length; i++) {
            ctx.lineTo(p.shape[i].x, p.shape[i].y);
        }
        ctx.closePath();

        if (isOutline) {
            const outlineStyle = currentDimensionStyle();
            ctx.strokeStyle = 'rgba(115, 247, 255, 0.28)';
            ctx.lineWidth = 2;
            ctx.setLineDash([7, 7]);
            ctx.stroke();
            ctx.setLineDash([]);

            const shardGlow = ctx.createRadialGradient(0, 0, 12, 0, 0, 132);
            shardGlow.addColorStop(0, `${outlineStyle.accent}24`);
            shardGlow.addColorStop(0.5, 'rgba(115, 247, 255, 0.07)');
            shardGlow.addColorStop(1, 'rgba(122, 240, 255, 0)');
            ctx.fillStyle = shardGlow;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(124, 255, 64, 0.24)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        } else {
            const fillColor = p.color + (p.locked ? 'e6' : '9c');
            const innerGlow = ctx.createLinearGradient(-80, -80, 90, 110);
            innerGlow.addColorStop(0, '#ffffff');
            innerGlow.addColorStop(0.2, p.color);
            innerGlow.addColorStop(1, '#08111f');

            ctx.fillStyle = fillColor;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = p.locked ? 24 : (dragInfo.piece === p ? 34 : 14);
            ctx.fill();

            ctx.globalAlpha = 0.4;
            ctx.fillStyle = innerGlow;
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.save();
            ctx.clip();
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 1.3;
            for (let stripe = -120; stripe <= 120; stripe += 22) {
                ctx.beginPath();
                ctx.moveTo(stripe, -130);
                ctx.lineTo(stripe + 70, 130);
                ctx.stroke();
            }
            ctx.restore();

            if (p.locked) {
                ctx.beginPath();
                ctx.moveTo(p.shape[0].x, p.shape[0].y);
                for (let i = 1; i < p.shape.length; i++) {
                    ctx.lineTo(p.shape[i].x, p.shape[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fill();
            }

            const centroidX = (p.shape[0].x + p.shape[1].x + p.shape[2].x) / 3;
            const centroidY = (p.shape[0].y + p.shape[1].y + p.shape[2].y) / 3;
            const eyeOffset = dragInfo.piece === p ? 6 : 0;
            const blinkScale = p.locked ? 0.55 : 1;

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#031018';
            ctx.beginPath();
            ctx.arc(centroidX - 14, centroidY - 8, 5, 0, Math.PI * 2);
            ctx.arc(centroidX + 14, centroidY - 8, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centroidX - 12 + eyeOffset, centroidY - 10, 2.1 * blinkScale, 0, Math.PI * 2);
            ctx.arc(centroidX + 12 + eyeOffset, centroidY - 10, 2.1 * blinkScale, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = p.locked ? 'rgba(255, 226, 122, 0.95)' : '#ecfbff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = p.locked ? 'rgba(255, 226, 122, 0.95)' : 'rgba(236, 251, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.moveTo(centroidX - 21, centroidY - 8);
            ctx.lineTo(centroidX + 21, centroidY - 8);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = p.locked ? 'rgba(255, 226, 122, 0.95)' : 'rgba(236, 251, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.arc(centroidX, centroidY + 6, 12, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
        }
        ctx.restore();
    }

    function updateAndDraw(dt) {
        const width = window.innerWidth;
        const height = window.innerHeight;

        // Clear + authored procedural portal-garage world
        const time = performance.now() * 0.001;
        drawProceduralBackground(width, height, time);

        // Background Particles
        bgParticles.forEach((p, index) => {
            p.y -= p.speed * window.gameConfig.bgSpeed;
            p.x += Math.sin(time + p.wobble) * 0.08;
            if (p.y < -10) p.y = height + 10;

            const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 6);
            halo.addColorStop(0, `rgba(122, 240, 255, ${0.14 + p.alpha * 0.2})`);
            halo.addColorStop(1, 'rgba(122, 240, 255, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = p.tone === 1 ? 'rgba(255, 226, 122, 0.65)' : (p.tone === 4 ? 'rgba(255, 79, 216, 0.45)' : 'rgba(236, 251, 255, 0.55)');
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.save();
        ctx.strokeStyle = 'rgba(122, 240, 255, 0.09)';
        ctx.lineWidth = 1;
        for (let ring = 1; ring <= 3; ring++) {
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, Math.min(width, height) * (0.09 + ring * 0.08), 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();

        // Draw Target Silhouette (Center)
        pieces.forEach(p => {
            drawShape(ctx, { ...p, x: p.targetX, y: p.targetY, rotation: 0, scale: 1 }, true);
        });

        // Update & Draw Pieces
        pieces.forEach(p => {
            if (p.locked) {
                p.rotation = 0;
            } else if (dragInfo.piece === p) {
                p.rotation = p.rotation * 0.8;
            }

            const targetScale = (dragInfo.piece === p) ? 1.1 : 1.0;
            p.scale += (targetScale - p.scale) * 0.2;
            drawShape(ctx, p);
        });

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            p.vx *= 0.9;
            p.vy *= 0.9;

            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.globalAlpha = p.life;
                const sparkle = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 8);
                sparkle.addColorStop(0, '#ffffff');
                sparkle.addColorStop(0.35, p.color);
                sparkle.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = sparkle;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }
    }

    function winLevel() {
        gameState = 'WIN';
        playSfx('win');
        showFeedback('win', 1800);

        // Explode particles from center
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        createParticles(cx, cy, 50, window.gameConfig.primaryColor);
        createParticles(cx, cy, 50, window.gameConfig.secondaryColor);

        setTimeout(() => {
            document.getElementById('score-display').innerText = currentDimensionStyle().win;
            document.getElementById('level-screen').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
        }, 1500);
    }

    function gameLoop(timestamp) {
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        try {
            updateAndDraw(dt);
        } catch (err) {
            console.error(err);
        }

        requestAnimationFrame(gameLoop);
    }

    // --- §6 UI Control ---
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        unlockAudio();
        playSfx('start');
        level = 1;
        gameState = 'PLAYING';
        resize(); // Init pieces
    });

    document.getElementById('next-btn').addEventListener('click', () => {
        document.getElementById('level-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        level++;
        updateDimensionCopy();
        playSfx('ui');
        gameState = 'PLAYING';
        resetLevel();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            sounds.bgm.pause();
        } else if (audioUnlocked && (gameState === 'PLAYING' || gameState === 'START')) {
            sounds.bgm.play().catch(() => {});
        }
    });

    // Init
    resize();
    requestAnimationFrame(gameLoop);
});
</script>
