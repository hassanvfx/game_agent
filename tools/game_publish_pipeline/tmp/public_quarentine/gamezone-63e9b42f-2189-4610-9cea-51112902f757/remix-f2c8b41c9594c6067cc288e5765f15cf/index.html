<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>$1 or Mystery Box?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap">
    <style>
        * { box-sizing: border-box; }

        :root {
            --bg-top: #120f2f;
            --bg-bottom: #060814;
            --panel: rgba(14, 18, 38, 0.78);
            --panel-border: rgba(126, 247, 255, 0.35);
            --panel-shadow: rgba(0, 0, 0, 0.48);
            --text-main: #f8fbff;
            --text-soft: #b8c5e0;
            --mint: #7cf6a6;
            --mint-strong: #24d66d;
            --violet: #9c6bff;
            --violet-strong: #6e46ff;
            --gold: #ffd452;
            --rose: #ff6b7a;
            --cyan: #79f2ff;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(121, 242, 255, 0.18), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 15%, rgba(124, 246, 166, 0.12), transparent 22%),
                radial-gradient(circle at 80% 18%, rgba(156, 107, 255, 0.18), transparent 24%),
                radial-gradient(circle at 50% 80%, rgba(255, 212, 82, 0.08), transparent 26%);
            opacity: 0.9;
        }

        #game-container::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 16%, transparent 84%, rgba(121, 242, 255, 0.08)),
                repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 6px);
            mix-blend-mode: screen;
            opacity: 0.32;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #start-screen,
        #game-over-screen {
            width: min(91.666667%, 32rem);
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            z-index: 50;
        }

        #start-screen {
            transition: transform 0.3s ease;
        }

        #start-screen:hover {
            transform: scale(1.03);
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(20, 26, 52, 0.9), var(--panel));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 20px 50px var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 24px rgba(121, 242, 255, 0.12);
        }

        .title,
        .game-over-title,
        .primary-button,
        .hud-score,
        .risk-level,
        .floating-reaction-label {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .title {
            margin: 0 0 0.5rem;
            font-size: clamp(2.1rem, 8vw, 3.8rem);
            font-weight: 800;
            letter-spacing: 0.06em;
            line-height: 0.95;
            text-transform: uppercase;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45));
        }

        .gradient-text {
            background: linear-gradient(to right, var(--mint), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mystery-text {
            background: linear-gradient(to right, #d8adff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lead {
            margin: 0 0 1.5rem;
            color: var(--text-soft);
            font-size: 0.82rem;
            line-height: 1.7;
        }

        .character-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
            padding: 0.5rem 0.9rem;
            border: 1px solid rgba(121, 242, 255, 0.28);
            border-radius: 999px;
            background: rgba(121, 242, 255, 0.08);
            color: var(--cyan);
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .badge-orb {
            width: 0.8rem;
            height: 0.8rem;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 35%, #ffffff, var(--cyan) 42%, #1d9cff 100%);
            box-shadow: 0 0 14px rgba(121, 242, 255, 0.65);
        }

        .text-green-400 { color: #4ade80; }
        .text-purple-400 { color: #c084fc; }
        .text-yellow-400 { color: #facc15; }
        .text-red-400 { color: #f87171; }
        .text-gray-400 { color: #9ca3af; }

        .legend {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            margin-bottom: 1.25rem;
            color: var(--text-soft);
            font-size: 0.58rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
        }

        .swatch {
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
            border-radius: 0.25rem;
        }

        .swatch.safe {
            background: linear-gradient(135deg, var(--mint), var(--mint-strong));
            box-shadow: 0 0 12px rgba(36, 214, 109, 0.35);
        }

        .swatch.risk {
            background: linear-gradient(135deg, var(--violet), var(--violet-strong));
            border: 2px solid var(--gold);
            box-shadow: 0 0 12px rgba(156, 107, 255, 0.35);
        }

        .primary-button,
        .secondary-button {
            display: inline-block;
            width: 100%;
            padding: 0.95rem 1.4rem;
            border-radius: 9999px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .primary-button {
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            color: #07111f;
            font-size: 0.92rem;
            font-weight: 800;
        }

        .primary-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(147, 51, 234, 0.45);
        }

        .secondary-button {
            background: linear-gradient(180deg, #fff7dc, #ffd452);
            color: #1f2937;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .game-over-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 8vw, 3.3rem);
            font-weight: 800;
            color: var(--rose);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.4));
        }

        .final-score {
            margin: 0 0 1.5rem;
            color: #ffffff;
            font-size: 1rem;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        /* [agent-note][stage4] repaired: font-remap + mobile-tap-safety | action: catalog fonts + body touch-action relaxation */

        .hud-score,
        .hud-risk {
            padding: 0.65rem 0.8rem;
            border-radius: 1rem;
            box-shadow: 0 0 18px rgba(121, 242, 255, 0.08);
        }

        .hud-score {
            border: 1px solid rgba(121, 242, 255, 0.22);
            background: rgba(7, 11, 27, 0.5);
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
        }

        .hud-risk {
            text-align: right;
            border: 1px solid rgba(255, 212, 82, 0.18);
            background: rgba(16, 12, 28, 0.54);
        }

        .hud-risk-label {
            color: var(--text-soft);
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 0.25rem;
        }

        .risk-level {
            font-size: 0.72rem;
            font-weight: 700;
        }

        .risk-low { color: var(--mint); }
        .risk-med { color: var(--gold); }
        .risk-high { color: var(--rose); }

        #reaction-burst {
            position: absolute;
            right: 0.8rem;
            bottom: 1rem;
            width: min(28vw, 8rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            pointer-events: none;
            z-index: 40;
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        #reaction-burst.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #reaction-burst img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
            background: rgba(9, 13, 28, 0.65);
        }

        .floating-reaction-label {
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            background: rgba(8, 12, 30, 0.8);
            border: 1px solid rgba(121, 242, 255, 0.25);
            color: #fff;
            font-size: 0.56rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @media (max-width: 640px) {
            #start-screen,
            #game-over-screen {
                padding: 1.6rem 1rem;
            }

            .title {
                font-size: clamp(1.8rem, 10vw, 3rem);
            }

            .lead {
                font-size: 0.72rem;
            }

            .hud-score {
                font-size: 0.82rem;
            }

            #reaction-burst {
                width: min(31vw, 6.5rem);
                right: 0.55rem;
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="start-screen" class="glass-panel">
                <div class="character-badge"><span class="badge-orb" aria-hidden="true"></span> Lucky Runner Protocol</div>
                <h1 class="title"><span class="gradient-text">$1</span> or <span class="mystery-text">Box?</span></h1>
                <p class="lead">Catch the <span class="text-green-400">$1</span> for steady cash.<br>Take the <span class="text-purple-400">Mystery Box</span> if you want a wild payout.</p>

                <div class="legend">
                    <div class="legend-item"><div class="swatch safe"></div>Safe (+1)</div>
                    <div class="legend-item"><div class="swatch risk"></div>Risk (bonus or bust)</div>
                </div>

                <button id="start-btn" class="primary-button">Play Now</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel">
                <h2 class="game-over-title">Bad Luck!</h2>
                <p class="lead">That box was a trap.</p>
                <div class="final-score">Cash Out: <span id="finalScore" class="text-green-400">0</span></div>
                <button id="restart-btn" class="secondary-button">Try Again</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-score">
                    <span><span class="text-green-400">$</span> <span id="score">0</span></span>
                </div>
                <div class="hud-risk">
                    <div class="hud-risk-label">Risk Level</div>
                    <div class="risk-level risk-low" id="risk-level">LOW</div>
                </div>
            </div>

            <div id="reaction-burst" aria-live="polite" aria-atomic="true">
                <!-- [agent-note][stage3] resolved-gif: jackpot/fail feedback overlays -> catalogs/gifs.json -->
                <img id="reaction-gif" alt="" src="">
                <div class="floating-reaction-label" id="reaction-label">Lucky!</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const MEDIA = {
            audio: {
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
                bonus: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3',
                fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',
                click: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3'
            },
            gifs: {
                jackpot: 'https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp',
                fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
            }
        };

        class AudioController {
            constructor() {
                this.enabled = false;
                this.unlocked = false;
                this.bgm = new Audio(MEDIA.audio.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.pools = {
                    pickup: this.createPool(MEDIA.audio.pickup, 3, 0.38),
                    bonus: this.createPool(MEDIA.audio.bonus, 3, 0.52),
                    fail: this.createPool(MEDIA.audio.fail, 2, 0.6),
                    click: this.createPool(MEDIA.audio.click, 2, 0.3)
                };
            }

            createPool(src, size, volume) {
                return Array.from({ length: size }, () => {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = volume;
                    return audio;
                });
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.enabled = true;
                const warmup = new Audio(MEDIA.audio.click);
                warmup.volume = 0;
                warmup.play().then(() => {
                    warmup.pause();
                    warmup.currentTime = 0;
                }).catch(() => {});
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.enabled || !this.pools[key]) return;
                const clip = this.pools[key].find(audio => audio.paused || audio.ended) || this.pools[key][0];
                try {
                    clip.currentTime = 0;
                    clip.play().catch(() => {});
                } catch (_) {}
            }
        }

        class ReactionOverlay {
            constructor() {
                this.root = document.getElementById('reaction-burst');
                this.image = document.getElementById('reaction-gif');
                this.label = document.getElementById('reaction-label');
                this.timer = null;
            }

            show(type, text) {
                const src = MEDIA.gifs[type];
                if (!src) return;
                this.image.src = src;
                this.image.alt = text;
                this.label.textContent = text;
                this.root.classList.add('active');
                clearTimeout(this.timer);
                this.timer = setTimeout(() => {
                    this.root.classList.remove('active');
                }, type === 'fail' ? 1500 : 1100);
            }

            hide() {
                this.root.classList.remove('active');
                clearTimeout(this.timer);
            }
        }

        const audio = new AudioController();
        const reactionOverlay = new ReactionOverlay();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;
        let difficulty = 1;

        let player = { x: 0, y: 0, radius: 25, blink: 0 };
        let items = [];
        let particles = [];
        let floatingTexts = [];
        let bgStars = [];
        let inputX = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            bgStars = [];
            for (let i = 0; i < 50; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        function handleInput(e) {
            if (!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            inputX = clientX;
        }

        window.addEventListener('mousemove', handleInput);
        window.addEventListener('touchmove', handleInput, { passive: false });
        window.addEventListener('touchstart', handleInput, { passive: false });

        function spawnItem() {
            const isBox = Math.random() < (0.2 + (difficulty * 0.05));
            const type = isBox ? 'box' : 'dollar';
            const size = type === 'box' ? 40 : 30;

            items.push({
                x: Math.random() * (width - 60) + 30,
                y: -50,
                type,
                width: size,
                height: type === 'box' ? size : size * 0.6,
                speed: (Math.random() * 2 + 3) * difficulty,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function createParticles(x, y, color, count = 10, speedMult = 1) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10 * speedMult,
                    vy: (Math.random() - 0.5) * 10 * speedMult,
                    life: 1,
                    color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function createFloatingText(x, y, text, color, size = 30) {
            floatingTexts.push({ x, y, text, life: 1, color, size });
        }

        function resolveMysteryBox() {
            const roll = Math.random();
            if (roll < 0.15) return { type: 'trap' };
            if (roll < 0.45) return { type: 'dud' };
            if (Math.random() < 0.1) return { type: 'jackpot' };
            return { type: 'prize', amount: Math.floor(Math.random() * 50) + 10 };
        }

        function initGame() {
            score = 0;
            frame = 0;
            difficulty = 1;
            items = [];
            particles = [];
            floatingTexts = [];
            inputX = width / 2;
            reactionOverlay.hide();
            document.getElementById('score').innerText = '0';
            const riskLevel = document.getElementById('risk-level');
            riskLevel.innerText = 'LOW';
            riskLevel.className = 'risk-level risk-low';
        }

        function updateRiskDisplay() {
            const riskLevel = document.getElementById('risk-level');
            if (difficulty > 1.5) {
                riskLevel.innerText = 'HIGH';
                riskLevel.className = 'risk-level risk-high';
            } else if (difficulty > 1.2) {
                riskLevel.innerText = 'MED';
                riskLevel.className = 'risk-level risk-med';
            } else {
                riskLevel.innerText = 'LOW';
                riskLevel.className = 'risk-level risk-low';
            }
        }

        function drawBackground() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#140f35');
            skyGradient.addColorStop(1, '#050713');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            const floorGlow = ctx.createLinearGradient(0, height * 0.7, 0, height);
            floorGlow.addColorStop(0, 'rgba(0, 0, 0, 0)');
            floorGlow.addColorStop(1, 'rgba(41, 20, 92, 0.55)');
            ctx.fillStyle = floorGlow;
            ctx.fillRect(0, height * 0.7, width, height * 0.3);

            bgStars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) star.y = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.12 + (star.size / 14)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawPlayer() {
            player.x += (inputX - player.x) * 0.15;
            player.blink += 0.12;

            const pulse = Math.sin(frame * 0.12) * 2;
            const bodyRadius = player.radius + pulse * 0.3;

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.shadowBlur = 26;
            ctx.shadowColor = '#74f7ff';

            const bodyGradient = ctx.createRadialGradient(-8, -12, 6, 0, 0, bodyRadius + 6);
            bodyGradient.addColorStop(0, '#ffffff');
            bodyGradient.addColorStop(0.22, '#8af5ff');
            bodyGradient.addColorStop(0.68, '#4d8dff');
            bodyGradient.addColorStop(1, '#6d49ff');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.arc(0, 0, bodyRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath();
            ctx.arc(-8, -10, bodyRadius * 0.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#07111f';
            ctx.beginPath();
            ctx.arc(-8, -4, 4, 0, Math.PI * 2);
            ctx.arc(8, -4, 4, 0, Math.PI * 2);
            ctx.fill();

            const blinkScale = Math.abs(Math.sin(player.blink)) > 0.96 ? 0.2 : 1;
            ctx.strokeStyle = '#07111f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-13, -4);
            ctx.lineTo(-3, -4 * blinkScale);
            ctx.moveTo(3, -4 * blinkScale);
            ctx.lineTo(13, -4);
            ctx.stroke();

            ctx.strokeStyle = '#fff7dc';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 8, 9, 0.2, Math.PI - 0.2, false);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(121, 242, 255, 0.45)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, bodyRadius + 8 + Math.sin(frame * 0.08) * 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawItems() {
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;
                item.rotation += item.rotSpeed;

                const dx = player.x - (item.x + item.width / 2);
                const dy = player.y - (item.y + item.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + item.width / 2) {
                    if (item.type === 'dollar') {
                        score += 1;
                        audio.playSFX('pickup');
                        createParticles(item.x, item.y, '#4ade80', 5);
                        createFloatingText(player.x, player.y - 50, '+1$', '#4ade80', 24);
                    } else {
                        const result = resolveMysteryBox();
                        if (result.type === 'trap') {
                            audio.playSFX('fail');
                            createParticles(player.x, player.y, '#ef4444', 30, 2);
                            createFloatingText(player.x, player.y - 50, 'TRAP!', '#ef4444', 40);
                            reactionOverlay.show('fail', 'Trap Box');
                            gameOver();
                            return;
                        } else if (result.type === 'dud') {
                            audio.playSFX('click');
                            createFloatingText(player.x, player.y - 50, 'Empty...', '#9ca3af', 20);
                        } else if (result.type === 'prize') {
                            score += result.amount;
                            audio.playSFX('bonus');
                            createParticles(item.x, item.y, '#fbbf24', 10);
                            createFloatingText(player.x, player.y - 50, `+${result.amount}$`, '#fbbf24', 30);
                        } else if (result.type === 'jackpot') {
                            score += 1000;
                            audio.playSFX('bonus');
                            createParticles(item.x, item.y, '#d8b4fe', 50, 2);
                            createFloatingText(player.x, player.y - 80, '1QA$!!!', '#facc15', 60);
                            reactionOverlay.show('jackpot', 'Jackpot!');
                        }
                    }

                    items.splice(i, 1);
                    document.getElementById('score').innerText = score;
                    continue;
                }

                if (item.y > height) {
                    items.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(item.x + item.width / 2, item.y + item.height / 2);
                ctx.rotate(item.rotation);

                if (item.type === 'dollar') {
                    const cashGradient = ctx.createLinearGradient(-item.width / 2, -item.height / 2, item.width / 2, item.height / 2);
                    cashGradient.addColorStop(0, '#92ffb7');
                    cashGradient.addColorStop(1, '#15b86f');
                    ctx.fillStyle = cashGradient;
                    ctx.fillRect(-item.width / 2, -item.height / 2, item.width, item.height);
                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-item.width / 2 + 2, -item.height / 2 + 2, item.width - 4, item.height - 4);
                    ctx.fillStyle = '#f8fff3';
                    ctx.font = '700 16px "Orbitron"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('$', 0, 0);
                } else {
                    const boxGradient = ctx.createLinearGradient(-item.width / 2, -item.height / 2, item.width / 2, item.height / 2);
                    boxGradient.addColorStop(0, '#c18dff');
                    boxGradient.addColorStop(1, '#6841f5');
                    ctx.fillStyle = boxGradient;
                    ctx.fillRect(-item.width / 2, -item.height / 2, item.width, item.height);
                    ctx.strokeStyle = '#ffd452';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(-item.width / 2, -item.height / 2, item.width, item.height);

                    ctx.beginPath();
                    ctx.moveTo(-item.width / 2, 0);
                    ctx.lineTo(item.width / 2, 0);
                    ctx.moveTo(0, -item.height / 2);
                    ctx.lineTo(0, item.height / 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '700 18px "Orbitron"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', 0, 0);
                }

                ctx.restore();
            }
        }

        function drawParticlesAndText() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 1;
                ft.life -= 0.015;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.font = `700 ${ft.size}px "Orbitron"`;
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            drawBackground();
            drawPlayer();

            frame++;
            if (frame % Math.max(20, 60 - Math.floor(score / 50)) === 0) {
                spawnItem();
            }

            difficulty = 1 + (score / 500);
            updateRiskDisplay();
            drawItems();
            drawParticlesAndText();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score + '$';
        }

        function startGame() {
            audio.unlock();
            audio.playSFX('click');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    });
    </script>
</body>
</html>
