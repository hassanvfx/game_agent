<script>
/**
 * §0 System Invariants & Core
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
const dpr = window.devicePixelRatio || 1;

// State
let gameState = 'IDLE'; // IDLE, MEMORIZE, INPUT, GAMEOVER
let initialized = false;
let lastTime = 0;
let frameId = null;

// Game Data
let lives = 3;
let coins = parseInt(localStorage.getItem('chroma_coins') || '0');
let ownedThemes = JSON.parse(localStorage.getItem('chroma_themes') || '["default"]');
let currentThemeId = localStorage.getItem('chroma_current_theme') || 'default';

// Config
let gameConfig = {
    memorizeDuration: 3,
    sequenceLength: 5,
    baseColor: "#FDF6E3"
};

// Themes
const THEMES = {
    'default': { name: 'First-Year Sparks', cost: 0, bg: '#F4DFB6', palette: ['#B71C2C', '#1C7C54', '#FFD166', '#2D5D9F', '#8F5CFF', '#F28C28'] },
    'dark': { name: 'Great Hall Night', cost: 50, bg: '#23213D', palette: ['#C0392B', '#62D7FF', '#F1C40F', '#8E44AD', '#1ABC9C', '#ECF0F1'] },
    'forest': { name: 'Lumos Forest', cost: 100, bg: '#183A2E', palette: ['#7BE495', '#2E7D32', '#A5D6A7', '#62D7FF', '#C8E6C9', '#0B3D2E'] },
    'neon': { name: 'Potion Pattern Lab', cost: 200, bg: '#241334', palette: ['#B71C2C', '#00C2A8', '#FFD166', '#6D3CCF', '#7BE495', '#62D7FF'] }
};

// Runtime Entities
let sequence = []; // Array of color indices
let playerInputIndex = 0;
let memorizeTimer = 0;
let shakeTime = 0;

// Particles
let particles = [];

// UI Elements
const els = {
    lives: document.getElementById('lives-display'),
    coins: document.getElementById('coins-display'),
    msgBox: document.getElementById('message-box'),
    msgTitle: document.getElementById('msg-title'),
    msgSub: document.getElementById('msg-sub'),
    actionBtn: document.getElementById('action-btn'),
    shopBtn: document.getElementById('shop-btn'),
    shopModal: document.getElementById('shop-modal'),
    closeShop: document.getElementById('close-shop'),
    shopContent: document.getElementById('shop-content')
};

/**
 * §1 Audio System (Web Audio API)
 */
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const audioBuffers = {};
let bgmStarted = false;
let bgmEnabled = true;
let lastUiSoundAt = 0;
let feedbackGifTimeout = null;
const FEEDBACK_GIFS = {
    success: {
        src: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
        label: 'Charm locked'
    },
    fail: {
        src: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp',
        label: 'Miscast charm'
    }
};

async function loadAudio() {
    if (!audioCtx) return;
    const load = async (id) => {
        const el = document.getElementById(id);
        if (!el || !el.src) return;
        try {
            const srcUrl = new URL(el.src, window.location.href);
            if (srcUrl.origin !== window.location.origin) {
                el.preload = 'auto';
                return;
            }
            const res = await fetch(el.src);
            const buf = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(buf);
        } catch (e) { console.warn('Audio load fail', id); }
    };
    await Promise.all(['sfx_correct', 'sfx_incorrect', 'sfx_win', 'sfx_ui', 'sfx_shop', 'sfx_shop_close', 'sfx_game_over'].map(load));
}

function playAudioElement(id, volume = 0.45) {
    const el = document.getElementById(id);
    if (!el || !el.src) return false;
    try {
        const instance = el.cloneNode(true);
        instance.volume = Math.max(0, Math.min(1, volume));
        instance.currentTime = 0;
        instance.play().catch(() => {});
        return true;
    } catch (e) {
        return false;
    }
}

function playSfx(id, volume = 0.45) {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const buf = audioBuffers[id];
    if (audioCtx && buf) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = buf;
        gain.gain.value = volume;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else if (!playAudioElement(id, volume)) {
        synthesizeSfx(id, volume);
    }
}

function playUiSfx(id = 'sfx_ui', volume = 0.26) {
    const now = performance.now();
    if (now - lastUiSoundAt < 120) return;
    lastUiSoundAt = now;
    playSfx(id, volume);
}

function synthesizeSfx(type, volume = 0.35) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if (type === 'sfx_correct' || type === 'sfx_win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.linearRampToValueAtTime(54, now + 0.22);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
    }
}

function playBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm || !bgmEnabled) return;
    bgm.volume = 0.22;
    if (bgmStarted && !bgm.paused) return;
    bgmStarted = true;
    bgm.play().catch(() => {
        bgmStarted = false;
    });
}

function stopBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    bgm.pause();
    bgm.currentTime = 0;
    bgmStarted = false;
}

function showFeedbackGif(type) {
    const config = FEEDBACK_GIFS[type];
    const gif = document.getElementById('feedback-gif');
    const caption = document.getElementById('feedback-caption');
    if (!config || !gif || !caption) return;
    gif.src = config.src;
    caption.textContent = config.label;
    gif.classList.add('is-visible');

    clearTimeout(feedbackGifTimeout);
    feedbackGifTimeout = setTimeout(() => {

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
            params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

/**
 * §2 Visual System
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.02;
        this.size = Math.random() * 6 + 4;
        this.rotation = Math.random() * Math.PI;
        this.vRot = (Math.random() - 0.5) * 0.2;
        this.points = Math.random() > 0.35 ? 4 : 5;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // Gravity
        this.life -= this.decay;
        this.rotation += this.vRot;
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.size * 1.6;
        ctx.beginPath();
        for (let i = 0; i < this.points * 2; i++) {
            const a = (Math.PI * i) / this.points;
            const r = i % 2 === 0 ? this.size : this.size * 0.32;
            ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

function spawnParticles(x, y, color, count = 10) {
    for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
}

const BG_MOTES = Array.from({ length: 36 }, (_, i) => ({
    x: (i * 0.61803398875) % 1,
    y: ((i * 37) % 101) / 100,
    r: 0.7 + (i % 5) * 0.34,
    speed: 0.12 + (i % 7) * 0.025,
    hue: i % 3
}));

const RUNE_MARKS = ['✦', '☾', '✧', '⚚', '✶', '◇'];

function drawPaperBg() {
    const theme = THEMES[currentThemeId];
    const t = performance.now() * 0.001;
    const gradient = ctx.createLinearGradient(0, 0, 0, ch);
    gradient.addColorStop(0, shadeColor(theme.bg, currentThemeId === 'default' ? -72 : -18));
    gradient.addColorStop(0.48, theme.bg);
    gradient.addColorStop(1, shadeColor(theme.bg, -38));
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cw, ch);

    drawGreatHallGlow(t, theme);
    drawCastleSilhouette(t);
    drawSpellCircles(t);
    drawThemeProps(t);
    drawFloatingCandles(t);
    drawAmbientMotes(t);
    drawStudentWand(t);
}

function drawGreatHallGlow(t, theme) {
    const stateTint = gameState === 'MEMORIZE' ? 'rgba(255, 209, 102, 0.2)' : gameState === 'INPUT' ? 'rgba(98, 215, 255, 0.16)' : 'rgba(143, 92, 255, 0.12)';
    const pulse = 0.92 + Math.sin(t * 1.5) * 0.08;
    const glow = ctx.createRadialGradient(cw * 0.5, ch * 0.24, 10, cw * 0.5, ch * 0.24, Math.max(cw, ch) * 0.62 * pulse);
    glow.addColorStop(0, stateTint);
    glow.addColorStop(0.38, 'rgba(255, 209, 102, 0.08)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, cw, ch);
}

function drawCastleSilhouette(t) {
    const baseY = ch * 0.58;
    ctx.save();
    ctx.fillStyle = 'rgba(9, 12, 28, 0.38)';
    ctx.beginPath();
    ctx.moveTo(0, baseY + 34);
    const towers = [
        [cw * 0.04, 72], [cw * 0.16, 116], [cw * 0.29, 84],
        [cw * 0.5, 132], [cw * 0.71, 86], [cw * 0.84, 112], [cw * 0.96, 74]
    ];
    towers.forEach(([x, h], i) => {
        const w = Math.max(24, cw * 0.055);
        ctx.lineTo(x - w * 0.58, baseY);
        ctx.lineTo(x - w * 0.38, baseY - h);
        ctx.lineTo(x, baseY - h - 26 - (i % 2) * 14);
        ctx.lineTo(x + w * 0.38, baseY - h);
        ctx.lineTo(x + w * 0.58, baseY);
    });
    ctx.lineTo(cw, baseY + 34);
    ctx.lineTo(cw, ch);
    ctx.lineTo(0, ch);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 209, 102, 0.11)';
    for (let i = 0; i < 14; i++) {
        const x = ((i * 89 + Math.sin(t * 0.2) * 6) % Math.max(cw, 1));
        const y = baseY - 90 + (i % 4) * 22;
        roundRect(ctx, x, y, 6, 14, 3);
        ctx.fill();
    }
    ctx.restore();
}

function drawSpellCircles(t) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.14)';
    ctx.lineWidth = 1.4;
    const rings = [
        [cw * 0.18, ch * 0.28, 48],
        [cw * 0.82, ch * 0.35, 58],
        [cw * 0.5, ch * 0.48, 84]
    ];
    rings.forEach(([x, y, r], i) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * (i % 2 ? -0.08 : 0.08));
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * (r - 8), Math.sin(a) * (r - 8));
            ctx.lineTo(Math.cos(a) * (r + 8), Math.sin(a) * (r + 8));
            ctx.stroke();
        }
        ctx.restore();
    });
    ctx.restore();
}

function drawThemeProps(t) {
    ctx.save();
    ctx.globalAlpha = 0.26;
    if (currentThemeId === 'forest') {
        ctx.fillStyle = 'rgba(4, 18, 16, 0.58)';
        for (let i = 0; i < 9; i++) {
            const x = (i / 8) * cw;
            const sway = Math.sin(t * 0.5 + i) * 5;
            roundRect(ctx, x + sway - 8, ch * 0.34 + (i % 3) * 22, 16, ch * 0.42, 8);
            ctx.fill();
        }
    } else if (currentThemeId === 'neon') {
        ctx.strokeStyle = 'rgba(123, 228, 149, 0.32)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            const x = cw * (0.18 + i * 0.16);
            const y = ch * 0.55 + Math.sin(t + i) * 4;
            ctx.beginPath();
            ctx.arc(x, y, 14 + i * 2, 0, Math.PI * 2);
            ctx.stroke();
        }
    } else if (currentThemeId === 'dark') {
        ctx.fillStyle = 'rgba(183, 28, 44, 0.22)';
        for (let i = 0; i < 4; i++) {
            const x = cw * (0.22 + i * 0.18);
            ctx.beginPath();
            ctx.moveTo(x, ch * 0.22);
            ctx.lineTo(x + 18, ch * 0.22);
            ctx.lineTo(x + 14, ch * 0.36);
            ctx.lineTo(x + 4, ch * 0.32);
            ctx.closePath();
            ctx.fill();
        }
    }
    ctx.restore();
}

function drawFloatingCandles(t) {
    ctx.save();
    for (let i = 0; i < 7; i++) {
        const x = cw * (0.08 + i * 0.14);
        const y = ch * (0.12 + (i % 3) * 0.06) + Math.sin(t * 0.75 + i) * 5;
        ctx.fillStyle = 'rgba(244, 223, 182, 0.72)';
        roundRect(ctx, x - 3, y, 6, 18, 3);
        ctx.fill();
        const flame = ctx.createRadialGradient(x, y - 4, 1, x, y - 4, 12);
        flame.addColorStop(0, 'rgba(255, 245, 198, 0.95)');
        flame.addColorStop(0.42, 'rgba(255, 209, 102, 0.45)');
        flame.addColorStop(1, 'rgba(255, 209, 102, 0)');
        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.arc(x, y - 4, 12, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawAmbientMotes(t) {
    ctx.save();
    BG_MOTES.forEach((m, i) => {
        const x = (m.x * cw + Math.sin(t * m.speed + i) * 18 + cw) % Math.max(cw, 1);
        const y = ((m.y * ch - t * 10 * m.speed) % (ch + 40) + ch + 40) % (ch + 40) - 20;
        ctx.fillStyle = m.hue === 0 ? 'rgba(255, 209, 102, 0.42)' : m.hue === 1 ? 'rgba(98, 215, 255, 0.32)' : 'rgba(255, 255, 255, 0.26)';
        ctx.beginPath();
        ctx.arc(x, y, m.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();
}

function drawStudentWand(t) {
    const x = Math.max(30, cw * 0.08);
    const y = ch * 0.78;
    ctx.save();
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = 'rgba(12, 11, 23, 0.78)';
    ctx.beginPath();
    ctx.arc(x, y - 30, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 20, y + 26);
    ctx.quadraticCurveTo(x, y - 20, x + 20, y + 26);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 16, y - 10);
    ctx.lineTo(x + 58, y - 42 + Math.sin(t * 1.4) * 3);
    ctx.stroke();
    ctx.fillStyle = 'rgba(98, 215, 255, 0.75)';
    ctx.beginPath();
    ctx.arc(x + 61, y - 44 + Math.sin(t * 1.4) * 3, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawSlots() {
    const theme = THEMES[currentThemeId];
    const totalW = Math.min(cw * 0.9, 500);
    const slotSize = totalW / gameConfig.sequenceLength;
    const startX = (cw - totalW) / 2 + slotSize/2;
    const y = ch * 0.35;

    for (let i = 0; i < gameConfig.sequenceLength; i++) {
        const x = startX + i * slotSize;
        const r = slotSize * 0.35;

        ctx.beginPath();
        ctx.arc(x, y + 7, r * 1.03, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fill();

        const slotGradient = ctx.createRadialGradient(x - r * 0.25, y - r * 0.35, 4, x, y, r * 1.2);
        slotGradient.addColorStop(0, 'rgba(255,243,214,0.9)');
        slotGradient.addColorStop(0.35, 'rgba(255, 209, 102, 0.28)');
        slotGradient.addColorStop(1, 'rgba(21, 15, 34, 0.94)');
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = slotGradient;
        ctx.fill();
        ctx.strokeStyle = gameState === 'MEMORIZE' ? 'rgba(255, 209, 102, 0.64)' : 'rgba(98, 215, 255, 0.36)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        let colorToShow = null;
        if (gameState === 'MEMORIZE') {
            colorToShow = theme.palette[sequence[i]];
        } else if (gameState === 'INPUT' && i < playerInputIndex) {
            colorToShow = theme.palette[sequence[i]];
        }

        if (colorToShow) {
            const crystalGlow = ctx.createRadialGradient(x, y, 2, x, y, r);
            crystalGlow.addColorStop(0, lightenColor(colorToShow, 35));
            crystalGlow.addColorStop(0.6, colorToShow);
            crystalGlow.addColorStop(1, shadeColor(colorToShow, -32));
            ctx.beginPath();
            ctx.arc(x, y, r - 5, 0, Math.PI * 2);
            ctx.fillStyle = crystalGlow;
            ctx.fill();

            drawGlyphCrystal(x, y, r - 10, colorToShow);

            ctx.beginPath();
            ctx.arc(x - r*0.28, y - r*0.32, r*0.16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fill();
        } else {
            drawGlyphCrystal(x, y, r - 16, 'rgba(117, 228, 255, 0.18)');
        }
    }

    if (gameState === 'MEMORIZE') {
        const progress = memorizeTimer / gameConfig.memorizeDuration;
        const barW = totalW * progress;
        const barX = (cw - totalW)/2;
        const barY = y + slotSize/2 + 20;
        ctx.fillStyle = 'rgba(8, 14, 32, 0.6)';
        roundRect(ctx, barX, barY, totalW, 8, 999);
        ctx.fill();
        const timerGradient = ctx.createLinearGradient(barX, barY, barX + barW, barY);
        timerGradient.addColorStop(0, '#62d7ff');
        timerGradient.addColorStop(0.56, '#ffd166');
        timerGradient.addColorStop(1, '#8f5cff');
        ctx.fillStyle = timerGradient;
        roundRect(ctx, barX, barY, barW, 8, 999);
        ctx.fill();
    }
}

function drawPalette() {
    if (gameState !== 'INPUT') return;
    const theme = THEMES[currentThemeId];
    const palette = theme.palette;
    const cols = 3;
    const rows = 2;
    const gap = 20;
    const btnSize = Math.min(80, (cw - gap*4)/cols);

    const gridW = cols * btnSize + (cols-1) * gap;
    const gridH = rows * btnSize + (rows-1) * gap;
    const startX = (cw - gridW) / 2;
    const startY = ch * 0.65;

    palette.forEach((color, idx) => {
        const c = idx % cols;
        const r = Math.floor(idx / cols);
        const x = startX + c * (btnSize + gap) + btnSize/2;
        const y = startY + r * (btnSize + gap) + btnSize/2;
        const radius = btnSize / 2;

        ctx.beginPath();
        ctx.arc(x, y + 6, radius * 1.02, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fill();

        const orbGradient = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.34, 4, x, y, radius * 1.15);
        orbGradient.addColorStop(0, lightenColor(color, 45));
        orbGradient.addColorStop(0.55, color);
        orbGradient.addColorStop(1, shadeColor(color, -38));

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI*2);
        ctx.fillStyle = orbGradient;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.82)';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, radius * 0.7, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.stroke();

        drawGlyphCrystal(x, y, radius * 0.52, color);
        ctx.save();
        ctx.font = `${Math.max(18, radius * 0.42)}px Cinzel, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255, 243, 214, 0.78)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 6;
        ctx.fillText(RUNE_MARKS[idx % RUNE_MARKS.length], x, y + 1);
        ctx.restore();
    });
}

function roundRect(ctx, x, y, w, h, radius) {
    const r = Math.min(radius, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function clampColor(value) {
    return Math.max(0, Math.min(255, value));
}

function shadeColor(hex, amount) {
    const safeHex = hex.replace('#', '');
    const num = parseInt(safeHex, 16);
    const r = clampColor((num >> 16) + amount);
    const g = clampColor(((num >> 8) & 0x00FF) + amount);
    const b = clampColor((num & 0x0000FF) + amount);
    return `rgb(${r}, ${g}, ${b})`;
}

function lightenColor(hex, amount) {
    return shadeColor(hex, amount);
}

function drawGlyphCrystal(x, y, size, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.24;
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.strokeStyle = 'rgba(255,243,214,0.58)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-size / 2, -size / 2, size, size);
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.38);
    ctx.lineTo(0, size * 0.38);
    ctx.moveTo(-size * 0.38, 0);
    ctx.lineTo(size * 0.38, 0);
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.32)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
}

function draw() {
    // Shake effect
    ctx.save();
    if (shakeTime > 0) {
        const dx = (Math.random() - 0.5) * 10 * (shakeTime * 2);
        const dy = (Math.random() - 0.5) * 10 * (shakeTime * 2);
        ctx.translate(dx, dy);
    }

    drawPaperBg();
    drawSlots();
    drawPalette();

    // Particles
    particles.forEach(p => p.draw(ctx));

    ctx.restore();
}

/**
 * §3 Game Logic
 */
function update(dt) {
    if (shakeTime > 0) shakeTime -= dt;

    if (gameState === 'MEMORIZE') {
        memorizeTimer -= dt;
        if (memorizeTimer <= 0) {
            gameState = 'INPUT';
            showMessage(null); // Clear message
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function startRound() {
    if (lives <= 0) {
        lives = 3;
        updateHud();
    }
    
    sequence = [];
    const theme = THEMES[currentThemeId];
    for (let i = 0; i < gameConfig.sequenceLength; i++) {
        sequence.push(Math.floor(Math.random() * theme.palette.length));
    }
    
    playerInputIndex = 0;
    memorizeTimer = gameConfig.memorizeDuration;
    gameState = 'MEMORIZE';
    
    showMessage(null); // Hide any overlay
}

function handleInput(x, y) {
    if (gameState !== 'INPUT') return;

    const theme = THEMES[currentThemeId];
    const palette = theme.palette;
    const cols = 3;
    const gap = 20;
    const btnSize = Math.min(80, (cw - gap*4)/cols);
    
    const gridW = cols * btnSize + (cols-1) * gap;
    const startX = (cw - gridW) / 2;
    const startY = ch * 0.65;

    // Check palette clicks
    for (let idx = 0; idx < palette.length; idx++) {
        const c = idx % cols;
        const r = Math.floor(idx / cols);
        const bx = startX + c * (btnSize + gap) + btnSize/2;
        const by = startY + r * (btnSize + gap) + btnSize/2;
        
        const dist = Math.hypot(x - bx, y - by);
        if (dist < btnSize/2 + 10) {
            checkColor(idx, bx, by);
            return;
        }
    }
}

function checkColor(colorIdx, x, y) {
    const expected = sequence[playerInputIndex];
    const theme = THEMES[currentThemeId];
    
    if (colorIdx === expected) {
        // Correct
        playSfx('sfx_correct');
        vibrate('light');
        spawnParticles(x, y, theme.palette[colorIdx], 10);
        playerInputIndex++;
        
        if (playerInputIndex >= sequence.length) {
            // Win Round
            coins += 10;
            localStorage.setItem('chroma_coins', coins);
            updateHud();
            spawnParticles(cw/2, ch/2, '#FFD700', 50);
            playSfx('sfx_win', 0.4);
            showFeedbackGif('success');
            setTimeout(() => {
                showMessage('Charm Locked', 'The spell sequence held. Claim your sparks and try the next charm.', 'NEXT CHARM', startRound);
            }, 500);
            gameState = 'IDLE';
        }
    } else {
        // Incorrect
        playSfx('sfx_incorrect', 0.36);
        vibrate('heavy');
        shakeTime = 0.5;
        lives--;
        updateHud();
        spawnParticles(x, y, '#555', 5);
        
        if (lives <= 0) {
            gameState = 'GAMEOVER';
            playSfx('sfx_game_over', 0.42);
            showFeedbackGif('fail');
            stopBgm();
            setTimeout(() => {
                showMessage('Miscast Charm', 'The rune order slipped. Restore your shield and retry the lesson.', 'RETRY LESSON', () => {
                    lives = 3;
                    updateHud();
                    startRound();
                });
            }, 500);
        }
    }
}

/**
 * §4 UI & Lifecycle
 */
function showMessage(title, sub, btnText, action) {
    if (!title) {
        els.msgBox.classList.remove('scale-100', 'opacity-100');
        els.msgBox.classList.add('scale-0', 'opacity-0');
        return;
    }
    els.msgTitle.textContent = title;
    els.msgSub.textContent = sub;
    els.actionBtn.textContent = btnText;
    els.actionBtn.onclick = (e) => {
        e.stopPropagation(); // Prevent canvas click
        unlockAudio();
        playUiSfx('sfx_ui', 0.22);
        action();
    };
    els.msgBox.classList.remove('scale-0', 'opacity-0');
    els.msgBox.classList.add('scale-100', 'opacity-100');
}

function updateHud() {
    els.lives.textContent = lives;
    els.coins.textContent = coins;
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    playBgm();
}

function initGame() {
    if (initialized) return;
    initialized = true;
    
    // Parse Config
    try {
        const cfg = JSON.parse(document.getElementById('game-config').textContent);
        if(cfg) {
            gameConfig.memorizeDuration = cfg.memorizeDuration.value;
            gameConfig.sequenceLength = cfg.sequenceLength.value;
        }
    } catch(e) {}

    loadAudio();
    updateHud();
    
    // Initial State
    showMessage('Hogwarts Spell Recall', 'Memorize the glowing runes, then tap the same spell orbs back in order.', 'BEGIN LESSON', startRound);
    
    // Shop Logic
    els.shopBtn.onclick = () => {
        unlockAudio();
        playUiSfx('sfx_shop', 0.24);
        renderShop();
        els.shopModal.classList.remove('hidden');
    };
    els.closeShop.onclick = () => {
        playUiSfx('sfx_shop_close', 0.2);
        els.shopModal.classList.add('hidden');
    };
    
    requestAnimationFrame(loop);
}

function renderShop() {
    els.shopContent.innerHTML = '';
    Object.entries(THEMES).forEach(([id, theme]) => {
        const isOwned = ownedThemes.includes(id);
        const isSelected = currentThemeId === id;
        
        const div = document.createElement('div');
        div.className = `shop-item glass ${isSelected ? 'selected' : ''} ${!isOwned ? 'locked' : ''}`;
        div.innerHTML = `
            <div class="h-16 rounded-lg mb-2 flex overflow-hidden">
                ${theme.palette.map(c => `<div style="background:${c};flex:1"></div>`).join('')}
            </div>
            <div class="flex justify-between items-center">
                <span class="font-bold text-sm text-slate-700">${theme.name}</span>
                <button class="btn text-xs px-2 py-1 rounded ${isOwned ? 'bg-slate-200' : 'bg-amber-400 text-white'}">
                    ${isOwned ? (isSelected ? 'Active' : 'Use') : theme.cost + ' ✨'}
                </button>
            </div>
        `;
        
        div.querySelector('button').onclick = () => {
            unlockAudio();
            if (isOwned) {
                currentThemeId = id;
                localStorage.setItem('chroma_current_theme', id);
                playUiSfx('sfx_ui', 0.2);
                renderShop();
            } else {
                if (coins >= theme.cost) {
                    coins -= theme.cost;
                    ownedThemes.push(id);
                    localStorage.setItem('chroma_coins', coins);
                    localStorage.setItem('chroma_themes', JSON.stringify(ownedThemes));
                    updateHud();
                    playSfx('sfx_correct', 0.32);
                    renderShop();
                } else {
                    playSfx('sfx_incorrect', 0.3);
                    vibrate('heavy');
                }
            }
        };
        
        els.shopContent.appendChild(div);
    });
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    
    // Clear
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    
    draw();
    
    frameId = requestAnimationFrame(loop);
}

// Resize Observer
const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    cw = rect.width;
    ch = rect.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    if (!initialized) initGame();
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
    
    // Input Handling
    const handleInputEvent = (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        if (gameState === 'INPUT') {
            handleInput(x, y);
        }
    };
    
    canvas.addEventListener('pointerdown', handleInputEvent, { passive: false });
});

</script>
