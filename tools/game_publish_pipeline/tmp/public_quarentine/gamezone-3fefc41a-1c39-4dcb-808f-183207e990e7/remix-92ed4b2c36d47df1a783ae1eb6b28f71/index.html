<script>
/**
 * §0 System Invariants & Core
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
const dpr = window.devicePixelRatio || 1;

// State
let gameState = 'IDLE'; // IDLE, MEMORIZE, INPUT, GAMEOVER
let initialized = false;
let lastTime = 0;
let frameId = null;

// Game Data
let lives = 3;
let coins = parseInt(localStorage.getItem('chroma_coins') || '0');
let ownedThemes = JSON.parse(localStorage.getItem('chroma_themes') || '["default"]');
let currentThemeId = localStorage.getItem('chroma_current_theme') || 'default';

// Config
let gameConfig = {
    memorizeDuration: 3,
    sequenceLength: 5,
    baseColor: "#FDF6E3"
};

// Themes
    const THEMES = {
    'default': { name: 'Nest Beacon', cost: 0, bg: '#72d7ff', palette: ['#FF6B6B', '#4ECDC4', '#FFE66D', '#1A535C', '#FF9F1C', '#FF006E'] },
    'dark': { name: 'Storm Relay', cost: 50, bg: '#4b5f9f', palette: ['#E74C3C', '#3498DB', '#F1C40F', '#9B59B6', '#1ABC9C', '#ECF0F1'] },
    'forest': { name: 'Pipe Meadow', cost: 100, bg: '#96e8c8', palette: ['#2E7D32', '#81C784', '#A5D6A7', '#66BB6A', '#388E3C', '#1B5E20'] },
    'neon': { name: 'Aurora Flight', cost: 200, bg: '#323d85', palette: ['#ff00ff', '#00ffff', '#ffff00', '#ff0000', '#00ff00', '#0000ff'] }
};

// Runtime Entities
let sequence = []; // Array of color indices
let playerInputIndex = 0;
let memorizeTimer = 0;
let shakeTime = 0;

// Particles
let particles = [];

// UI Elements
const els = {
    lives: document.getElementById('lives-display'),
    coins: document.getElementById('coins-display'),
    msgBox: document.getElementById('message-box'),
    msgTitle: document.getElementById('msg-title'),
    msgSub: document.getElementById('msg-sub'),
    actionBtn: document.getElementById('action-btn'),
    shopBtn: document.getElementById('shop-btn'),
    shopModal: document.getElementById('shop-modal'),
    closeShop: document.getElementById('close-shop'),
    shopContent: document.getElementById('shop-content')
};

/**
 * §1 Audio System (Web Audio API)
 */
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const audioBuffers = {};
let bgmStarted = false;
let bgmEnabled = true;
let lastUiSoundAt = 0;
let feedbackGifTimeout = null;
const FEEDBACK_GIFS = {
    success: {
        src: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
        label: 'Route cleared'
    },
    fail: {
        src: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp',
        label: 'Route clipped'
    }
};

async function loadAudio() {
    if (!audioCtx) return;
    const load = async (id) => {
        const el = document.getElementById(id);
        if (!el || !el.src) return;
        try {
            const srcUrl = new URL(el.src, window.location.href);
            if (srcUrl.origin !== window.location.origin) {
                el.preload = 'auto';
                return;
            }
            const res = await fetch(el.src);
            const buf = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(buf);
        } catch (e) { console.warn('Audio load fail', id); }
    };
    await Promise.all(['sfx_correct', 'sfx_incorrect', 'sfx_win', 'sfx_ui', 'sfx_shop', 'sfx_shop_close', 'sfx_game_over'].map(load));
}

function playAudioElement(id, volume = 0.45) {
    const el = document.getElementById(id);
    if (!el || !el.src) return false;
    try {
        const instance = el.cloneNode(true);
        instance.volume = Math.max(0, Math.min(1, volume));
        instance.currentTime = 0;
        instance.play().catch(() => {});
        return true;
    } catch (e) {
        return false;
    }
}

function playSfx(id, volume = 0.45) {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const buf = audioBuffers[id];
    if (audioCtx && buf) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = buf;
        gain.gain.value = volume;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else if (!playAudioElement(id, volume)) {
        synthesizeSfx(id, volume);
    }
}

function playUiSfx(id = 'sfx_ui', volume = 0.26) {
    const now = performance.now();
    if (now - lastUiSoundAt < 120) return;
    lastUiSoundAt = now;
    playSfx(id, volume);
}

function synthesizeSfx(type, volume = 0.35) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if (type === 'sfx_correct' || type === 'sfx_win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.linearRampToValueAtTime(54, now + 0.22);
        gain.gain.setValueAtTime(volume, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
    }
}

function playBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm || !bgmEnabled) return;
    bgm.volume = 0.22;
    if (bgmStarted && !bgm.paused) return;
    bgmStarted = true;
    bgm.play().catch(() => {
        bgmStarted = false;
    });
}

function stopBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    bgm.pause();
    bgm.currentTime = 0;
    bgmStarted = false;
}

function showFeedbackGif(type) {
    const config = FEEDBACK_GIFS[type];
    const gif = document.getElementById('feedback-gif');
    const caption = document.getElementById('feedback-caption');
    if (!config || !gif || !caption) return;
    gif.src = config.src;
    caption.textContent = config.label;
    gif.classList.add('is-visible');
    caption.classList.add('is-visible');
    clearTimeout(feedbackGifTimeout);
    feedbackGifTimeout = setTimeout(() => {
        gif.classList.remove('is-visible');
        caption.classList.remove('is-visible');
    }, 1600);
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
            params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

/**
 * §2 Visual System
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.02;
        this.size = Math.random() * 6 + 4;
        this.rotation = Math.random() * Math.PI;
        this.vRot = (Math.random() - 0.5) * 0.2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // Gravity
        this.life -= this.decay;
        this.rotation += this.vRot;
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.34, this.size * 0.78, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -this.size * 0.5);
        ctx.quadraticCurveTo(this.size * 0.08, -this.size * 0.04, 0, this.size * 0.52);
        ctx.stroke();
        ctx.restore();
    }
}

function spawnParticles(x, y, color, count = 10) {
    for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
}

function drawPaperBg() {
    const theme = THEMES[currentThemeId];
    const t = performance.now() * 0.00008;
    const region = {
        default: { top: '#72d7ff', mid: theme.bg, bottom: '#6f9cff', gate: 'rgba(92, 211, 150, 0.22)', accent: 'rgba(255, 209, 102, 0.34)' },
        forest: { top: '#98f0de', mid: theme.bg, bottom: '#6abf9f', gate: 'rgba(48, 154, 95, 0.24)', accent: 'rgba(255, 235, 151, 0.28)' },
        dark: { top: '#6776bb', mid: theme.bg, bottom: '#27335f', gate: 'rgba(255, 107, 138, 0.18)', accent: 'rgba(255, 138, 168, 0.25)' },
        neon: { top: '#263378', mid: theme.bg, bottom: '#111946', gate: 'rgba(126, 232, 255, 0.2)', accent: 'rgba(143, 124, 255, 0.33)' }
    }[currentThemeId] || {};
    const gradient = ctx.createLinearGradient(0, 0, 0, ch);
    gradient.addColorStop(0, region.top || lightenColor(theme.bg, 20));
    gradient.addColorStop(0.55, region.mid || theme.bg);
    gradient.addColorStop(1, region.bottom || shadeColor(theme.bg, -24));
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cw, ch);

    const sunGlow = ctx.createRadialGradient(cw * 0.16, ch * 0.16, 8, cw * 0.16, ch * 0.16, Math.max(cw, ch) * 0.42);
    sunGlow.addColorStop(0, currentThemeId === 'neon' ? 'rgba(126, 232, 255, 0.3)' : 'rgba(255, 236, 167, 0.42)');
    sunGlow.addColorStop(0.45, region.accent || 'rgba(255, 209, 102, 0.12)');
    sunGlow.addColorStop(1, 'rgba(255, 209, 102, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, cw, ch);

    // [agent-note][visuals_unified] preserve: background is decorative only; it must never change hit targets or timing.
    drawSkyRibbons(t, region);
    drawCloudLayer(t);
    drawWindGates(t, region);
    drawNestRings(t);
    drawFlockSilhouettes(t);
    drawFinchCourier();
}

function drawSkyRibbons(t, region) {
    if (currentThemeId !== 'neon' && currentThemeId !== 'dark') return;
    ctx.save();
    ctx.globalAlpha = currentThemeId === 'neon' ? 0.34 : 0.18;
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        const y = ch * (0.16 + i * 0.1);
        ctx.moveTo(-40, y);
        for (let x = -40; x <= cw + 40; x += 42) {
            ctx.quadraticCurveTo(x + 20, y + Math.sin(x * 0.012 + t * 80 + i) * 18, x + 42, y);
        }
        ctx.strokeStyle = i % 2 ? 'rgba(126,232,255,0.7)' : (region.accent || 'rgba(143,124,255,0.65)');
        ctx.lineWidth = 8 - i * 1.8;
        ctx.stroke();
    }
    ctx.restore();
}

function drawCloudLayer(t) {
    ctx.save();
    ctx.globalAlpha = 0.46;
    for (let i = 0; i < 7; i++) {
        const baseX = ((i * 0.18 + t * (0.32 + i * 0.025)) % 1) * (cw + 190) - 95;
        const y = ch * (0.14 + (i % 4) * 0.1);
        const r = 18 + (i % 3) * 9;
        ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.64)' : 'rgba(247,251,255,0.76)';
        ctx.beginPath();
        ctx.arc(baseX, y, r, 0, Math.PI * 2);
        ctx.arc(baseX + r * 0.95, y + r * 0.12, r * 0.78, 0, Math.PI * 2);
        ctx.arc(baseX - r * 0.9, y + r * 0.25, r * 0.64, 0, Math.PI * 2);
        ctx.arc(baseX + r * 1.65, y + r * 0.3, r * 0.46, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawWindGates(t, region) {
    ctx.save();
    for (let i = 0; i < 5; i++) {
        const gateX = ((i * 0.27 - t * 0.18) % 1) * (cw + 220) - 110;
        const gapY = ch * (0.3 + (i % 2) * 0.13);
        const gateW = Math.max(28, cw * 0.048);
        const gateH = ch * 0.17;
        const pipeGradient = ctx.createLinearGradient(gateX, gapY - gateH, gateX + gateW, gapY + gateH);
        pipeGradient.addColorStop(0, region.gate || 'rgba(92, 211, 150, 0.16)');
        pipeGradient.addColorStop(1, 'rgba(37, 142, 104, 0.08)');
        ctx.fillStyle = pipeGradient;
        roundRect(ctx, gateX, gapY - gateH - 42, gateW, gateH, 13);
        ctx.fill();
        roundRect(ctx, gateX, gapY + 42, gateW, gateH, 13);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.lineWidth = 2;
        ctx.stroke();
        drawWindCurl(gateX + gateW * 0.5, gapY, gateW * 1.1);
    }
    ctx.restore();
}

function drawWindCurl(x, y, size) {
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, size, Math.PI * 0.1, Math.PI * 1.55);
    ctx.arc(x + size * 0.2, y, size * 0.52, Math.PI * 1.2, Math.PI * 0.05, true);
    ctx.stroke();
    ctx.restore();
}

function drawNestRings(t) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.8)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        const x = ((i * 0.33 + t * 0.12) % 1) * (cw + 120) - 60;
        const y = ch * (0.46 + (i % 2) * 0.08);
        ctx.beginPath();
        ctx.ellipse(x, y, 28, 11, -0.15, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();
}

function drawFlockSilhouettes(t) {
    ctx.save();
    ctx.globalAlpha = 0.26;
    ctx.strokeStyle = 'rgba(22, 58, 105, 0.72)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
        const x = ((0.1 + i * 0.13 + t * 0.22) % 1) * (cw + 90) - 45;
        const y = ch * (0.23 + Math.sin(i + t * 80) * 0.045);
        ctx.beginPath();
        ctx.moveTo(x - 7, y);
        ctx.quadraticCurveTo(x, y - 7, x + 7, y);
        ctx.quadraticCurveTo(x + 14, y - 7, x + 21, y);
        ctx.stroke();
    }
    ctx.restore();
}

function drawFinchCourier() {
    ctx.save();
    ctx.globalAlpha = 0.74;
    const birdX = cw * 0.18;
    const birdY = ch * 0.49 + Math.sin(performance.now() * 0.002) * 5;
    ctx.translate(birdX, birdY);
    ctx.rotate(Math.sin(performance.now() * 0.0017) * 0.06);
    ctx.fillStyle = 'rgba(255, 209, 102, 0.95)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 138, 168, 0.92)';
    ctx.beginPath();
    ctx.ellipse(-7, 4, 15, 7, -0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.58)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-3, -10, 13, Math.PI * 1.1, Math.PI * 1.8);
    ctx.stroke();
    ctx.fillStyle = '#ff8f3d';
    ctx.beginPath();
    ctx.moveTo(20, -3);
    ctx.lineTo(35, 4);
    ctx.lineTo(20, 11);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#243b63';
    ctx.beginPath();
    ctx.arc(9, -6, 2.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(126,232,255,0.82)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(9, -6, 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(47, 143, 215, 0.92)';
    roundRect(ctx, -18, -20, 17, 7, 4);
    ctx.fill();
    ctx.restore();
}

function drawSlots() {
    const theme = THEMES[currentThemeId];
    const totalW = Math.min(cw * 0.9, 500);
    const slotSize = totalW / gameConfig.sequenceLength;
    const startX = (cw - totalW) / 2 + slotSize/2;
    const y = ch * 0.35;

    for (let i = 0; i < gameConfig.sequenceLength; i++) {
        const x = startX + i * slotSize;
        const r = slotSize * 0.35;

        ctx.beginPath();
        ctx.arc(x, y + 7, r * 1.03, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fill();

        const slotGradient = ctx.createRadialGradient(x - r * 0.25, y - r * 0.35, 4, x, y, r * 1.2);
        slotGradient.addColorStop(0, 'rgba(255,255,255,0.88)');
        slotGradient.addColorStop(0.35, 'rgba(140, 216, 255, 0.3)');
        slotGradient.addColorStop(1, 'rgba(15, 23, 42, 0.92)');
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = slotGradient;
        ctx.fill();
        ctx.strokeStyle = 'rgba(117, 228, 255, 0.34)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        let colorToShow = null;
        if (gameState === 'MEMORIZE') {
            colorToShow = theme.palette[sequence[i]];
        } else if (gameState === 'INPUT' && i < playerInputIndex) {
            colorToShow = theme.palette[sequence[i]];
        }

        if (colorToShow) {
            const crystalGlow = ctx.createRadialGradient(x, y, 2, x, y, r);
            crystalGlow.addColorStop(0, lightenColor(colorToShow, 35));
            crystalGlow.addColorStop(0.6, colorToShow);
            crystalGlow.addColorStop(1, shadeColor(colorToShow, -32));
            ctx.beginPath();
            ctx.arc(x, y, r - 5, 0, Math.PI * 2);
            ctx.fillStyle = crystalGlow;
            ctx.fill();

            drawGlyphCrystal(x, y, r - 10, colorToShow);
            drawTinyWing(x, y, r * 0.55);

            ctx.beginPath();
            ctx.arc(x - r*0.28, y - r*0.32, r*0.16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fill();
        } else {
            drawGlyphCrystal(x, y, r - 16, 'rgba(117, 228, 255, 0.18)');
        }
    }

    if (gameState === 'MEMORIZE') {
        const progress = memorizeTimer / gameConfig.memorizeDuration;
        const barW = totalW * progress;
        const barX = (cw - totalW)/2;
        const barY = y + slotSize/2 + 20;
        ctx.fillStyle = 'rgba(8, 14, 32, 0.6)';
        roundRect(ctx, barX, barY, totalW, 8, 999);
        ctx.fill();
        const timerGradient = ctx.createLinearGradient(barX, barY, barX + barW, barY);
        timerGradient.addColorStop(0, '#75e4ff');
        timerGradient.addColorStop(1, '#ff71c8');
        ctx.fillStyle = timerGradient;
        roundRect(ctx, barX, barY, barW, 8, 999);
        ctx.fill();
    }
}

function drawPalette() {
    if (gameState !== 'INPUT') return;
    const theme = THEMES[currentThemeId];
    const palette = theme.palette;
    const cols = 3;
    const rows = 2;
    const gap = 20;
    const btnSize = Math.min(80, (cw - gap*4)/cols);

    const gridW = cols * btnSize + (cols-1) * gap;
    const gridH = rows * btnSize + (rows-1) * gap;
    const startX = (cw - gridW) / 2;
    const startY = ch * 0.65;

    palette.forEach((color, idx) => {
        const c = idx % cols;
        const r = Math.floor(idx / cols);
        const x = startX + c * (btnSize + gap) + btnSize/2;
        const y = startY + r * (btnSize + gap) + btnSize/2;
        const radius = btnSize / 2;

        ctx.beginPath();
        ctx.arc(x, y + 6, radius * 1.02, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fill();

        const orbGradient = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.34, 4, x, y, radius * 1.15);
        orbGradient.addColorStop(0, lightenColor(color, 45));
        orbGradient.addColorStop(0.55, color);
        orbGradient.addColorStop(1, shadeColor(color, -38));

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI*2);
        ctx.fillStyle = orbGradient;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.82)';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, radius * 0.7, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.stroke();

        drawGlyphCrystal(x, y, radius * 0.52, color);
        drawTinyWing(x, y, radius * 0.36);
    });
}

function roundRect(ctx, x, y, w, h, radius) {
    const r = Math.min(radius, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function clampColor(value) {
    return Math.max(0, Math.min(255, value));
}

function shadeColor(hex, amount) {
    const safeHex = hex.replace('#', '');
    const num = parseInt(safeHex, 16);
    const r = clampColor((num >> 16) + amount);
    const g = clampColor(((num >> 8) & 0x00FF) + amount);
    const b = clampColor((num & 0x0000FF) + amount);
    return `rgb(${r}, ${g}, ${b})`;
}

function lightenColor(hex, amount) {
    return shadeColor(hex, amount);
}

function drawTinyWing(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = 'rgba(255,255,255,0.46)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-size * 0.12, size * 0.05, size * 0.72, Math.PI * 1.15, Math.PI * 1.78);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(size * 0.08, size * 0.04, size * 0.52, Math.PI * 1.1, Math.PI * 1.7);
    ctx.stroke();
    ctx.restore();
}

function drawGlyphCrystal(x, y, size, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.35);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.28;
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.42, size * 0.78, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.52)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.68);
    ctx.quadraticCurveTo(size * 0.16, -size * 0.1, 0, size * 0.7);
    ctx.quadraticCurveTo(-size * 0.16, -size * 0.1, 0, -size * 0.68);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.42);
    ctx.lineTo(size * 0.18, -size * 0.12);
    ctx.moveTo(0, -size * 0.1);
    ctx.lineTo(-size * 0.18, size * 0.18);
    ctx.stroke();
    ctx.restore();
}

function draw() {
    // Shake effect
    ctx.save();
    if (shakeTime > 0) {
        const dx = (Math.random() - 0.5) * 10 * (shakeTime * 2);
        const dy = (Math.random() - 0.5) * 10 * (shakeTime * 2);
        ctx.translate(dx, dy);
    }

    drawPaperBg();
    drawSlots();
    drawPalette();

    // Particles
    particles.forEach(p => p.draw(ctx));

    ctx.restore();
}

/**
 * §3 Game Logic
 */
function update(dt) {
    if (shakeTime > 0) shakeTime -= dt;

    if (gameState === 'MEMORIZE') {
        memorizeTimer -= dt;
        if (memorizeTimer <= 0) {
            gameState = 'INPUT';
            showMessage(null); // Clear message
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function startRound() {
    if (lives <= 0) {
        lives = 3;
        updateHud();
    }
    
    sequence = [];
    const theme = THEMES[currentThemeId];
    for (let i = 0; i < gameConfig.sequenceLength; i++) {
        sequence.push(Math.floor(Math.random() * theme.palette.length));
    }
    
    playerInputIndex = 0;
    memorizeTimer = gameConfig.memorizeDuration;
    gameState = 'MEMORIZE';
    
    showMessage(null); // Hide any overlay
}

function handleInput(x, y) {
    if (gameState !== 'INPUT') return;

    const theme = THEMES[currentThemeId];
    const palette = theme.palette;
    const cols = 3;
    const gap = 20;
    const btnSize = Math.min(80, (cw - gap*4)/cols);
    
    const gridW = cols * btnSize + (cols-1) * gap;
    const startX = (cw - gridW) / 2;
    const startY = ch * 0.65;

    // Check palette clicks
    for (let idx = 0; idx < palette.length; idx++) {
        const c = idx % cols;
        const r = Math.floor(idx / cols);
        const bx = startX + c * (btnSize + gap) + btnSize/2;
        const by = startY + r * (btnSize + gap) + btnSize/2;
        
        const dist = Math.hypot(x - bx, y - by);
        if (dist < btnSize/2 + 10) {
            checkColor(idx, bx, by);
            return;
        }
    }
}

function checkColor(colorIdx, x, y) {
    const expected = sequence[playerInputIndex];
    const theme = THEMES[currentThemeId];
    
    if (colorIdx === expected) {
        // Correct
        playSfx('sfx_correct');
        vibrate('light');
        spawnParticles(x, y, theme.palette[colorIdx], 10);
        playerInputIndex++;
        
        if (playerInputIndex >= sequence.length) {
            // Win Round
            coins += 10;
            localStorage.setItem('chroma_coins', coins);
            updateHud();
            spawnParticles(cw/2, ch/2, '#FFD166', 50);
            playSfx('sfx_win', 0.4);
            showFeedbackGif('success');
            setTimeout(() => {
                showMessage('Route Cleared', 'The finch made the gate line. Bank the sky coins and fly the next route.', 'NEXT', startRound);
            }, 500);
            gameState = 'IDLE';
        }
    } else {
        // Incorrect
        playSfx('sfx_incorrect', 0.36);
        vibrate('heavy');
        shakeTime = 0.5;
        lives--;
        updateHud();
        spawnParticles(x, y, '#555', 5);
        
        if (lives <= 0) {
            gameState = 'GAMEOVER';
            playSfx('sfx_game_over', 0.42);
            showFeedbackGif('fail');
            stopBgm();
            setTimeout(() => {
                showMessage('Wing Guard Lost', 'The route clipped the crosswind. Reset the flock and try again.', 'RESTART', () => {
                    lives = 3;
                    updateHud();
                    startRound();
                });
            }, 500);
        }
    }
}

/**
 * §4 UI & Lifecycle
 */
function showMessage(title, sub, btnText, action) {
    if (!title) {
        els.msgBox.classList.remove('scale-100', 'opacity-100');
        els.msgBox.classList.add('scale-0', 'opacity-0');
        return;
    }
    els.msgTitle.textContent = title;
    els.msgSub.textContent = sub;
    els.actionBtn.textContent = btnText;
    els.actionBtn.onclick = (e) => {
        e.stopPropagation(); // Prevent canvas click
        unlockAudio();
        playUiSfx('sfx_ui', 0.22);
        action();
    };
    els.msgBox.classList.remove('scale-0', 'opacity-0');
    els.msgBox.classList.add('scale-100', 'opacity-100');
}

function updateHud() {
    els.lives.textContent = lives;
    els.coins.textContent = coins;
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    playBgm();
}

function initGame() {
    if (initialized) return;
    initialized = true;
    
    // Parse Config
    try {
        const cfg = JSON.parse(document.getElementById('game-config').textContent);
        if(cfg) {
            gameConfig.memorizeDuration = cfg.memorizeDuration.value;
            gameConfig.sequenceLength = cfg.sequenceLength.value;
        }
    } catch(e) {}

    loadAudio();
    updateHud();
    
    // Initial State
    showMessage('Flappy Finch', 'Memorize the glowing feather route, then tap the same colors back in order.', 'TAKE OFF', startRound);
    
    // Shop Logic
    els.shopBtn.onclick = () => {
        unlockAudio();
        playUiSfx('sfx_shop', 0.24);
        renderShop();
        els.shopModal.classList.remove('hidden');
    };
    els.closeShop.onclick = () => {
        playUiSfx('sfx_shop_close', 0.2);
        els.shopModal.classList.add('hidden');
    };
    
    requestAnimationFrame(loop);
}

function renderShop() {
    els.shopContent.innerHTML = '';
    Object.entries(THEMES).forEach(([id, theme]) => {
        const isOwned = ownedThemes.includes(id);
        const isSelected = currentThemeId === id;
        
        const div = document.createElement('div');
        div.className = `shop-item glass ${isSelected ? 'selected' : ''} ${!isOwned ? 'locked' : ''}`;
        div.innerHTML = `
            <div class="h-16 rounded-lg mb-2 flex overflow-hidden">
                ${theme.palette.map(c => `<div style="background:${c};flex:1"></div>`).join('')}
            </div>
            <div class="flex justify-between items-center">
                <span class="font-bold text-sm text-slate-700">${theme.name}</span>
                <button class="btn text-xs px-2 py-1 rounded ${isOwned ? 'bg-slate-200' : 'bg-amber-400 text-white'}">
                    ${isOwned ? (isSelected ? 'Active' : 'Use') : theme.cost + ' 🪙'}
                </button>
            </div>
        `;
        
        div.querySelector('button').onclick = () => {
            unlockAudio();
            if (isOwned) {
                currentThemeId = id;
                localStorage.setItem('chroma_current_theme', id);
                playUiSfx('sfx_ui', 0.2);
                renderShop();
            } else {
                if (coins >= theme.cost) {
                    coins -= theme.cost;
                    ownedThemes.push(id);
                    localStorage.setItem('chroma_coins', coins);
                    localStorage.setItem('chroma_themes', JSON.stringify(ownedThemes));
                    updateHud();
                    playSfx('sfx_correct', 0.32);
                    renderShop();
                } else {
                    playSfx('sfx_incorrect', 0.3);
                    vibrate('heavy');
                }
            }
        };
        
        els.shopContent.appendChild(div);
    });
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    
    // Clear
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    
    draw();
    
    frameId = requestAnimationFrame(loop);
}

// Resize Observer
const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    cw = rect.width;
    ch = rect.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    if (!initialized) initGame();
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
    
    // Input Handling
    const handleInputEvent = (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        if (gameState === 'INPUT') {
            handleInput(x, y);
        }
    };
    
    canvas.addEventListener('pointerdown', handleInputEvent, { passive: false });
});

</script>
