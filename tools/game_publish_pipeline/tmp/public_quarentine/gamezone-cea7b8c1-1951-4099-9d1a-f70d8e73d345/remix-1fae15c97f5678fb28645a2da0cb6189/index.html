<script>
/* 
 * ENGINE & CONFIG
 */
const CONFIG = {
    spinSpeed: 40,
    reelCount: 3,
    symbolHeight: 120, // px
    colors: {
        bg: '#070b1d',
        green: '#7bffb2',
        pink: '#ff4fd8',
        gold: '#ffe067',
        cyan: '#60eeff',
        panel: '#142042'
    }
};

// 0:7, 1:Circle, 2:Triangle, 3:Star
const SYMBOLS = ['🚀', '🛰️', '▲', '★']; 
const SYMBOL_COLORS = [CONFIG.colors.gold, CONFIG.colors.pink, CONFIG.colors.green, CONFIG.colors.cyan];

/* 
 * AUDIO SYSTEM 
 */
const AudioSys = {
    ctx: null,
    initialized: false,
    lastPlayed: new Map(),
    init: function() {
        if (this.initialized) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
        this.bgm = document.getElementById('bgm');
        this.sfx = {
            start: document.getElementById('sfx_start'),
            stop: document.getElementById('sfx_stop'),
            win: document.getElementById('sfx_win'),
            fail: document.getElementById('sfx_fail'),
            bonus: document.getElementById('sfx_bonus'),
            powerup: document.getElementById('sfx_powerup'),
            gameover: document.getElementById('sfx_gameover')
        };
        this.initialized = true;
    },
    unlock: function() {
        if (!this.initialized) this.init();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    },
    playBGM: function() {
        if (!this.initialized) this.init();
        if (!this.bgm) return;
        this.bgm.volume = 0.2;
        this.bgm.play().catch(()=>{});
    },
    stopBGM: function() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    },
    playSFX: function(name, volume=0.62, cooldown=90) {
        if (!this.initialized) this.init();
        const source = this.sfx[name];
        if (!source) return;
        const now = performance.now();
        const last = this.lastPlayed.get(name) || 0;
        if (now - last < cooldown) return;
        this.lastPlayed.set(name, now);
        const clone = source.cloneNode();
        clone.volume = volume;
        clone.play().catch(()=>{});
    }
};

/* 
 * GAME STATE 
 */
const State = {
    mode: 'START', // START, PLAY, SPEED_RUSH, GAMEOVER
    score: 0,
    reels: [],
    reelIndex: 0, // Which reel is currently stopping
    luckActive: false,
    speedActive: false,
    immortal: false,
    immortalTimer: 0,
    shake: 0
};

/* 
 * REEL CLASS 
 */
class Reel {
    constructor(id, x) {
        this.id = id;
        this.x = x;
        this.y = 0;
        this.speed = 0;
        this.symbols = []; // Array of ints
        this.locked = false;
        this.finalSymbol = null;
        this.generateStrip(false);
    }

    generateStrip(isLucky) {
        this.symbols = [];
        // Generate a strip of 30 symbols
        for(let i=0; i<30; i++) {
            let sym;
            if (isLucky && Math.random() < 0.4) {
                sym = 0; // Force '7'
            } else {
                sym = Math.floor(Math.random() * SYMBOLS.length);
            }
            this.symbols.push(sym);
        }
    }

    reset() {
        this.locked = false;
        this.finalSymbol = null;
        this.speed = CONFIG.spinSpeed + (this.id * 5); // Stagger speeds
        this.y = 0;
        // Regenerate based on luck state
        this.generateStrip(State.luckActive);
    }

    update(dt) {
        if (!this.locked) {
            this.y += this.speed * dt * 60;
            const totalH = this.symbols.length * CONFIG.symbolHeight;
            if (this.y >= totalH) this.y -= totalH;
        } else {
            // Snap animation
            const target = Math.round(this.y / CONFIG.symbolHeight) * CONFIG.symbolHeight;
            this.y += (target - this.y) * 0.2;
        }
    }

    stop() {
        if(this.locked) return;
        this.locked = true;
        AudioSys.playSFX('stop', 0.46, 70);
        
        // Calculate which symbol is at the center line
        // Center line is roughly offset 0 visually in our draw logic relative to y
        // We use index = round(y / h)
        const idx = Math.round(this.y / CONFIG.symbolHeight) % this.symbols.length;
        // The strip moves down, so index increases.
        // To be safe, let's just pick the symbol at that index.
        this.finalSymbol = this.symbols[(this.symbols.length - idx) % this.symbols.length];
        
        State.shake = 5;
    }

    draw(ctx, centerY) {
        const h = CONFIG.symbolHeight;
        const w = 100;
        
        ctx.save();
        // Clip area
        ctx.beginPath();
        ctx.rect(this.x - w/2, centerY - 150, w, 300);
        ctx.clip();

        // Background
        const reelGradient = ctx.createLinearGradient(this.x, centerY - 150, this.x, centerY + 150);
        reelGradient.addColorStop(0, 'rgba(12, 18, 40, 0.92)');
        reelGradient.addColorStop(0.5, 'rgba(24, 37, 79, 0.88)');
        reelGradient.addColorStop(1, 'rgba(6, 10, 23, 0.92)');
        ctx.fillStyle = reelGradient;
        ctx.fillRect(this.x - w/2, centerY - 150, w, 300);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '700 76px "Orbitron"';

        // Draw symbols
        const totalH = this.symbols.length * h;
        for(let i=0; i<this.symbols.length; i++) {
            // Calculate relative Y
            let sy = (this.y + i * h) % totalH;
            let drawY = (centerY - h/2) + sy;
            
            // Wrap logic for infinite scroll illusion
            if (drawY > centerY + totalH/2) drawY -= totalH;
            
            // Only draw if visible
            if (drawY > centerY - 200 && drawY < centerY + 200) {
                const sIdx = this.symbols[i];
                ctx.fillStyle = SYMBOL_COLORS[sIdx];
                
                // Glow if immortal or 7
                if (State.immortal || sIdx === 0) {
                    ctx.shadowColor = SYMBOL_COLORS[sIdx];
                    ctx.shadowBlur = 15;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillText(SYMBOLS[sIdx], this.x, drawY);
            }
        }
        
        // Border / Highlight
        ctx.strokeStyle = this.locked ? CONFIG.colors.gold : CONFIG.colors.cyan;
        ctx.lineWidth = 3;
        ctx.shadowColor = this.locked ? CONFIG.colors.gold : CONFIG.colors.cyan;
        ctx.shadowBlur = this.locked ? 18 : 10;
        ctx.strokeRect(this.x - w/2, centerY - 150, w, 300);
        ctx.shadowBlur = 0;

        // Payline
        ctx.strokeStyle = 'rgba(255, 0, 85, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x - w/2 - 10, centerY);
        ctx.lineTo(this.x + w/2 + 10, centerY);
        ctx.stroke();

        ctx.restore();
    }
}

/* 
 * MAIN LOGIC 
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let lastTime = 0;
let particles = [];
let gifTimeout = null;

function showReactionGif(kind, duration = 1200) {
    const winGif = document.getElementById('gif-win');
    const failGif = document.getElementById('gif-fail');
    if (!winGif || !failGif) return;
    clearTimeout(gifTimeout);
    winGif.classList.remove('is-visible');
    failGif.classList.remove('is-visible');
    const active = kind === 'win' ? winGif : failGif;
    active.classList.add('is-visible');
    gifTimeout = setTimeout(() => active.classList.remove('is-visible'), duration);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateLayoutMetrics();
}
window.addEventListener('resize', resize);

function updateLayoutMetrics() {
    const narrowScreen = window.innerWidth <= 640;
    CONFIG.symbolHeight = narrowScreen ? 96 : 120;
    const cx = window.innerWidth / 2;
    const spacing = Math.min(110, Math.max(72, window.innerWidth * 0.22));
    State.reels.forEach((reel, index) => {
        reel.x = cx + ((index - 1) * spacing);
    });
}

function initGame() {
    State.reels = [
        new Reel(0, window.innerWidth * 0.2),
        new Reel(1, window.innerWidth * 0.5),
        new Reel(2, window.innerWidth * 0.8)
    ];
    updateLayoutMetrics();
}

function startGame() {
    AudioSys.unlock();
    AudioSys.playSFX('start', 0.55, 0);
    AudioSys.playBGM();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    State.score = 0;
    State.luckActive = false;
    State.speedActive = false;
    State.immortal = false;
    State.mode = 'PLAY';
    updateHUD();
    startRound();
}

function startRound() {
    if (State.mode === 'GAMEOVER') return;
    
    // If Speed Active, do special routine
    if (State.speedActive) {
        doSpeedRush();
        return;
    }

    State.reelIndex = 0;
    State.reels.forEach(r => r.reset());
    document.getElementById('instruction-text').innerText = "TAP TO LOCK";
}

function handleInput() {
    if (State.mode !== 'PLAY') return;

    if (State.reelIndex < 3) {
        State.reels[State.reelIndex].stop();
        State.reelIndex++;
        
        if (State.reelIndex === 3) {
            setTimeout(checkResult, 300);
        }
    }
}

function checkResult() {
    const r = State.reels;
    const s1 = r[0].finalSymbol;
    const s2 = r[1].finalSymbol;
    const s3 = r[2].finalSymbol;
    
    const isMatch = (s1 === s2 && s2 === s3);
    const has7 = (s1 === 0 || s2 === 0 || s3 === 0);
    const hasCircle = (s1 === 1 || s2 === 1 || s3 === 1);
    
    let won = false;
    let jackpot = false;

    if (isMatch) {
        won = true;
        if (s1 === 0) jackpot = true; // 777
    }

    // Logic Handling
    if (jackpot) {
        triggerJackpot();
    } else if (won) {
        // Normal Win
        const baseScore = 100;
        const multiplier = State.immortal ? 5 : 1;
        addScore(baseScore * multiplier);
        AudioSys.playSFX('win', 0.62, 0);
        AudioSys.playSFX('bonus', 0.48, 0);
        showReactionGif('win', 1200);
        showPopup("SYNCED!", CONFIG.colors.green);
        
        // Reset modifiers on win? Maybe keep them?
        // Let's consume luck on win to balance
        if (State.luckActive) {
            State.luckActive = false;
            showPopup("CLEARANCE SPENT", CONFIG.colors.gold, 500);
        }
        
        setTimeout(startRound, 1000);
    } else {
        // LOSS
        AudioSys.playSFX('fail', 0.58, 0);
        showReactionGif('fail', 1100);
        State.shake = 10;
        
        // --- MODIFIER LOGIC ---
        let modTriggered = false;

        // Condition 1: Mismatch (Loss) AND No 7s -> Luck Mod
        if (!has7) {
            if (!State.luckActive) {
                State.luckActive = true;
                AudioSys.playSFX('powerup', 0.5, 0);
                showPopup("CLEARANCE READY!", CONFIG.colors.gold);
                modTriggered = true;
            }
        }

        // Condition 2: No 7s AND No Circles -> Speed Mod
        // (Only Triangles/Stars)
        if (!has7 && !hasCircle) {
            State.speedActive = true;
            AudioSys.playSFX('powerup', 0.52, 0);
            showPopup("FAST RELAY READY!", CONFIG.colors.cyan, 300);
            modTriggered = true;
        }

        if (!modTriggered) {
             showPopup("STATIC...", CONFIG.colors.pink);
        }

        // Game Over condition? 
        // Original game ended on miss unless immortal.
        // We want to allow modifiers to work, so we need a life system or score penalty.
        // Or simply: If Immortal, you survive. If not, Game Over?
        // But if Game Over happens immediately, modifiers are useless.
        // Let's change rules: You have 3 Hearts? Or just infinite play for score until you quit?
        // The prompt implies a flow. "If you get 3 wrong... you activate mod". This implies the game CONTINUES after a wrong result.
        // Therefore: NO Game Over on simple miss. Game Over only if you miss AND have no modifiers/lives?
        // Let's make it a Score Attack. You have limited "Spins" or Time?
        // Let's stick to the prompt's spirit: "Idle Death Gamble".
        // If you miss, you usually die. BUT Modifiers save you.
        // Implementation: If you miss and trigger a modifier, you SURVIVE.
        // If you miss and NO modifier is triggered (e.g. you have a 7 but no match), you DIE?
        // "If you get 3 wrong numbers and none is a 7 -> Luck".
        // So if you get 3 wrong numbers AND one IS a 7 -> You don't get luck. Do you die?
        // Let's make it forgiving: Game Over only if Score < 0? No.
        // Let's make it: Miss resets score streak?
        // Let's go with: Miss without triggering modifier = GAME OVER. Miss WITH modifier = CONTINUE.
        
        const savedByMod = modTriggered || State.immortal;
        
        if (savedByMod) {
            setTimeout(startRound, 1200);
        } else {
            setTimeout(gameOver, 1000);
        }
    }
    
    updateHUD();
}

function triggerJackpot() {
    State.immortal = true;
    State.score += 777;
    State.shake = 30;
    AudioSys.playSFX('win', 0.68, 0);
    AudioSys.playSFX('bonus', 0.52, 0);
    AudioSys.playSFX('powerup', 0.48, 0);
    showReactionGif('win', 1800);
    showPopup("FULL RELAY!!!", CONFIG.colors.gold);
    showPopup("OVERCLOCK MODE", CONFIG.colors.green, 500);
    
    // Clear modifiers
    State.luckActive = false;
    State.speedActive = false;
    
    createExplosion(window.innerWidth/2, window.innerHeight/2, CONFIG.colors.gold);
    setTimeout(startRound, 2000);
}

/* 
 * SPEED RUSH MECHANIC 
 */
async function doSpeedRush() {
    State.mode = 'SPEED_RUSH';
    showPopup("FAST RELAY!!!", CONFIG.colors.cyan);
    document.getElementById('instruction-text').innerText = "AUTO RELAY x3";
    
    // Consume speed mod
    State.speedActive = false;
    updateHUD();

    // 3 Rapid Spins
    for(let i=1; i<=3; i++) {
        await new Promise(r => setTimeout(r, 400));
        
        // Spin visuals
        State.reels.forEach(reel => {
            reel.reset();
            reel.speed *= 2; // Faster visual
        });
        
        await new Promise(r => setTimeout(r, 400));
        
        // Force stop all
        State.reels.forEach(r => r.stop());
        
        // Calc result for this mini-spin
        // We'll just give random points or check logic?
        // To make it feel like "3 bets", we check logic 3 times.
        const r = State.reels;
        const s1 = r[0].finalSymbol;
        const s2 = r[1].finalSymbol;
        const s3 = r[2].finalSymbol;
        
        if (s1 === s2 && s2 === s3) {
            const val = (s1 === 0) ? 777 : 100;
            addScore(val);
            AudioSys.playSFX('bonus', 0.48, 0);
            showReactionGif('win', 900);
            showPopup(`SYNC! +${val}`, CONFIG.colors.green);
            createExplosion(window.innerWidth/2, window.innerHeight/2, CONFIG.colors.green);
        } else {
            // Consolation points in speed rush
            addScore(10); 
            showPopup("+10", "#fff");
        }
        updateHUD();
    }
    
    State.mode = 'PLAY';
    setTimeout(startRound, 1000);
}

function gameOver() {
    AudioSys.playSFX('gameover', 0.68, 0);
    showReactionGif('fail', 1800);
    AudioSys.stopBGM();
    State.mode = 'GAMEOVER';
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = State.score;
}

function addScore(val) {
    State.score += val;
    // Animate score?
    const el = document.getElementById('score-display');
    el.style.transform = "scale(1.5)";
    el.style.color = CONFIG.colors.gold;
    setTimeout(() => {
        el.style.transform = "scale(1)";
        el.style.color = "white";
    }, 200);
}

function updateHUD() {
    document.getElementById('score-display').innerText = State.score;
    
    const luckEl = document.getElementById('mod-luck');
    if (State.luckActive) luckEl.classList.remove('hidden');
    else luckEl.classList.add('hidden');
    
    const speedEl = document.getElementById('mod-speed');
    if (State.speedActive) speedEl.classList.remove('hidden');
    else speedEl.classList.add('hidden');
}

function showPopup(text, color, delay=0) {
    setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'text-6xl font-bold neon-text anim-slide-in absolute';
        div.style.color = color;
        div.innerText = text;
        div.style.textShadow = `0 0 20px ${color}`;
        div.style.left = '50%';
        div.style.top = '50%';
        div.style.transform = 'translate(-50%, -50%)';
        div.style.textAlign = 'center';
        div.style.maxWidth = 'min(88vw, 24rem)';
        document.getElementById('message-area').appendChild(div);
        setTimeout(() => div.remove(), 800);
    }, delay);
}

/* 
 * PARTICLES 
 */
function createExplosion(x, y, color) {
    for(let i=0; i<30; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5) * 20,
            vy: (Math.random()-0.5) * 20,
            life: 1,
            color: color
        });
    }
}

function updateParticles(dt) {
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5; // Gravity
        p.life -= dt * 2;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles(ctx) {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

/* 
 * LOOP 
 */
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    // Clear
    const bgGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    bgGradient.addColorStop(0, '#13214a');
    bgGradient.addColorStop(0.45, CONFIG.colors.bg);
    bgGradient.addColorStop(1, '#040611');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < 18; i++) {
        const starX = ((i * 97) % window.innerWidth);
        const starY = ((i * 53) % window.innerHeight);
        const twinkle = 0.25 + 0.2 * Math.sin((timestamp / 250) + i);
        ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
        ctx.fillRect(starX, starY, 2, 2);
    }

    // Shake
    let sx = 0, sy = 0;
    if (State.shake > 0) {
        sx = (Math.random() - 0.5) * State.shake;
        sy = (Math.random() - 0.5) * State.shake;
        State.shake *= 0.9;
        if (State.shake < 0.5) State.shake = 0;
    }
    ctx.save();
    ctx.translate(sx, sy);

    // Background FX
    if (State.immortal) {
        ctx.globalAlpha = 0.1;
        ctx.fillStyle = CONFIG.colors.gold;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
    }

    // Draw Reels
    const cy = window.innerHeight / 2;
    State.reels.forEach(r => {
        r.update(dt);
        r.draw(ctx, cy);
    });

    // Particles
    updateParticles(dt);
    drawParticles(ctx);

    ctx.restore();
    requestAnimationFrame(loop);
}

// Input
window.addEventListener('pointerdown', (e) => {
    AudioSys.unlock();
    
    if (e.target.tagName === 'BUTTON') return; // Let buttons work
    handleInput();
});

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

// Init
window.addEventListener('load', () => {
    resize();
    initGame();
    requestAnimationFrame(loop);
});

</script>
