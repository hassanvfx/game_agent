<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Credit Run</title>
    <!-- [agent-note][stage4] remap-fonts: title/ui -> Orbitron, body -> Fredoka from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --bg-top: #050816;
            --bg-bottom: #120f2e;
            --bg-glow: rgba(43, 214, 255, 0.18);
            --panel-bg: rgba(11, 17, 42, 0.8);
            --panel-border: rgba(121, 229, 255, 0.34);
            --text-main: #f4fbff;
            --text-soft: rgba(217, 242, 255, 0.88);
            --text-muted: #91a6d6;
            --cyan: #67e8f9;
            --cyan-strong: #22d3ee;
            --blue: #4f46e5;
            --purple: #8b5cf6;
            --green: #5cf2a5;
            --yellow: #ffd86b;
            --red: #ff7a90;
            --red-strong: #ff4d6d;
            --gray-life: rgba(100, 116, 139, 0.4);
            --lane-glow: rgba(34, 211, 238, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, var(--bg-glow), transparent 36%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Fredoka', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(17, 24, 58, 0.94), rgba(8, 12, 32, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 18px 48px rgba(0, 0, 0, 0.38),
                0 0 42px rgba(34, 211, 238, 0.14);
            border-radius: 28px;
            text-align: center;
            pointer-events: auto;
            width: min(92vw, 560px);
            padding: 32px 28px;
        }

        .start-screen {
            transition: transform 0.35s ease;
        }

        .start-screen:hover {
            transform: scale(1.03);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, transparent 0%, rgba(103, 232, 249, 0.12) 34%, transparent 62%),
                radial-gradient(circle at top right, rgba(139, 92, 246, 0.18), transparent 30%);
            pointer-events: none;
        }

        .game-title,
        .game-over-title,
        .hud-label,
        .rank-value,
        .cta-btn {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .tagline,
        .intro-copy,
        .result-line,
        .final-score,
        .score-display,
        .runner-badge,
        .lives-display {
            font-family: 'Fredoka', system-ui, sans-serif;
        }

        .game-title {
            position: relative;
            z-index: 1;
            margin: 0 0 10px;
            font-size: clamp(2.7rem, 9vw, 4.8rem);
            line-height: 0.95;
            font-weight: 400;
            letter-spacing: 0.05em;
            background: linear-gradient(90deg, #8bf6ff, #6d8cff 56%, #bb7cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        .money-text {
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
        }

        .tagline {
            position: relative;
            z-index: 1;
            margin: 0 0 18px;
            color: var(--text-soft);
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .runner-badge {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 20px;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(103, 232, 249, 0.1);
            border: 1px solid rgba(103, 232, 249, 0.24);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.12);
            color: var(--text-soft);
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .runner-avatar {
            font-size: 1.5rem;
            filter: drop-shadow(0 0 10px rgba(103, 232, 249, 0.45));
            animation: hoverPulse 2.4s ease-in-out infinite;
        }

        .intro-copy {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0 0 28px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .intro-copy p {
            margin: 0;
        }

        .cta-btn {
            position: relative;
            z-index: 1;
            border: 0;
            border-radius: 999px;
            padding: 16px 28px;
            min-width: 220px;
            color: #fff;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            cursor: pointer;
            pointer-events: auto;
            background: linear-gradient(90deg, var(--cyan-strong), var(--blue), var(--purple));
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.38);
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        .cta-btn:hover {
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.8);
            filter: brightness(1.05);
        }

        .cta-btn:active {
            transform: scale(0.97);
        }

        .game-over-title {
            margin: 0 0 10px;
            font-size: clamp(2rem, 7vw, 3.2rem);
            color: var(--red-strong);
        }

        .result-line {
            margin: 0 0 8px;
            font-size: 1.05rem;
            color: #cbd5e1;
        }

        .result-accent {
            color: var(--yellow);
            font-weight: 700;
        }

        .final-score {
            margin: 0 0 28px;
            font-size: clamp(2rem, 6vw, 2.8rem);
            color: var(--text-main);
        }

        .hud {
            position: absolute;
            inset: 0 0 auto 0;
            width: 100%;
            padding: max(16px, env(safe-area-inset-top)) max(16px, 4vw) 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */

        .hud-block {
            display: flex;
            flex-direction: column;
            padding: 10px 12px;
            border-radius: 18px;
            background: rgba(8, 13, 35, 0.42);
            border: 1px solid rgba(103, 232, 249, 0.14);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.08);
        }

        .hud-block.right {
            align-items: flex-end;
        }

        .hud-label {
            margin-bottom: 4px;
            font-size: 0.82rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .hud-label.cyan {
            color: #67e8f9;
        }

        .hud-label.red {
            color: #fca5a5;
        }

        .score-display {
            font-size: clamp(2rem, 5.5vw, 2.8rem);
            font-weight: 700;
            color: var(--green);
        }

        .score-display,
        .rank-value,
        .lives-display {
            position: relative;
            z-index: 1;
        }

        .rank-value {
            margin-top: 6px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--yellow);
            letter-spacing: 0.08em;
        }

        .lives-display {
            display: flex;
            gap: 6px;
            min-height: 16px;
        }

        .life-dot {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            background: var(--gray-life);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .life-dot.active {
            background: radial-gradient(circle at 35% 35%, #ffd1da, var(--red-strong));
            box-shadow: 0 0 12px rgba(255, 77, 109, 0.9);
        }

        .bounce {
            animation: bounce 1s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
            60% { transform: translateY(0); }
            80% { transform: translateY(-4px); }
        }

        @keyframes hoverPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.06); }
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            width: min(28vw, 120px);
            border-radius: 16px;
            border: 1px solid rgba(103, 232, 249, 0.28);
            background: rgba(8, 13, 35, 0.78);
            box-shadow: 0 0 24px rgba(34, 211, 238, 0.18);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.collect {
            top: max(90px, calc(env(safe-area-inset-top) + 76px));
        }

        .feedback-gif.fail {
            bottom: 18px;
        }

        @media (max-width: 640px) {
            .feedback-gif {
                width: min(32vw, 92px);
                right: 10px;
            }

            .feedback-gif.collect {
                top: max(82px, calc(env(safe-area-inset-top) + 68px));
            }

            .feedback-gif.fail {
                bottom: 12px;
            }

            .glass-panel {
                padding: 24px 18px;
                border-radius: 22px;
            }

            .tagline {
                letter-spacing: 0.2em;
                margin-bottom: 20px;
            }

            .intro-copy {
                font-size: 0.88rem;
                margin-bottom: 22px;
            }

            .cta-btn {
                width: 100%;
                min-width: 0;
                padding: 15px 18px;
            }

            .hud {
                padding-top: max(12px, env(safe-area-inset-top));
            }

            .hud-label {
                font-size: 0.72rem;
                letter-spacing: 0.16em;
            }

            .rank-value {
                font-size: 0.88rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-root">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel start-screen">
                <h1 class="game-title neon-text">NEON CREDIT RUN</h1>
                <p class="tagline">Catch the cash flow</p>
                <div class="runner-badge" aria-hidden="true">
                    <span class="runner-avatar">🤖</span>
                    <span>Vault Runner online</span>
                </div>
                <div class="intro-copy">
                    <p>Slide left and right to catch every falling credit.</p>
                    <p>Miss too many drops and the run crashes out.</p>
                </div>
                <button id="start-btn" class="cta-btn">START RUN</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel">
                <h2 class="game-over-title">RUN OVER</h2>
                <div class="result-line">Final Rank: <span id="finalTitle" class="result-accent">ROOKIE</span></div>
                <div class="final-score money-text">Credit Total: <span id="finalScore">$0</span></div>
                <button id="restart-btn" class="cta-btn">Run Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-block">
                    <div class="hud-label cyan">Credit Total</div>
                    <div class="score-display money-text" id="scoreDisplay">$0</div>
                    <div class="rank-value" id="titleDisplay">ROOKIE</div>
                </div>
                <div class="hud-block right">
                    <div class="hud-label red">Stability</div>
                    <div class="lives-display" id="livesDisplay">
                    </div>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: collect/fail feedback -> catalogs/gifs.json -->
            <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
            <img
                id="collect-gif"
                class="feedback-gif collect"
                src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp"
                alt="Reward feedback animation"
                decoding="async"
                loading="eager"
            >
            <img
                id="fail-gif"
                class="feedback-gif fail"
                src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
                alt="Crash feedback animation"
                decoding="async"
                loading="eager"
            >
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                levelup: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            gifs: {
                collect: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayed = {};
                this.ready = false;

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    audio.volume = this.getVolume(key);
                    this.sfx[key] = audio;
                }
            }

            getVolume(key) {
                const volumes = {
                    start: 0.5,
                    collect: 0.42,
                    fail: 0.55,
                    levelup: 0.6,
                    gameOver: 0.7
                };
                return volumes[key] ?? 0.5;
            }

            unlock() {
                if (this.ready) return;
                this.ready = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(sound => sound.load());
            }

            playBGM() {
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 120) {
                const source = this.sfx[key];
                if (!source) return;

                const now = performance.now();
                const lastTime = this.lastPlayed[key] ?? 0;
                if (now - lastTime < cooldown) return;
                this.lastPlayed[key] = now;

                const clone = source.cloneNode();
                clone.volume = source.volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const feedbackTimers = {};
        const collectGif = document.getElementById('collect-gif');
        const failGif = document.getElementById('fail-gif');

        function flashGif(type, duration = 850) {
            const target = type === 'collect' ? collectGif : failGif;
            if (!target) return;

            clearTimeout(feedbackTimers[type]);
            target.classList.add('show');
            feedbackTimers[type] = setTimeout(() => {
                target.classList.remove('show');
            }, duration);
        }

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let frameCount = 0;

        let netWorth = 0;
        let lives = 5;
        let playerX = 0;
        let playerWidth = 100;
        let difficultyMultiplier = 1;

        const TITLES = [
            { threshold: 0, label: "ROOKIE" },
            { threshold: 1000, label: "RUNNER" },
            { threshold: 5000, label: "BROKER" },
            { threshold: 15000, label: "DEALER" },
            { threshold: 50000, label: "DIRECTOR" },
            { threshold: 100000, label: "MOGUL" },
            { threshold: 500000, label: "LEGEND" }
        ];
        let currentTitleIndex = 0;

        let items = [];
        let particles = [];
        let backgroundNodes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            playerX = width / 2;
            initBackground();
        }
        window.addEventListener('resize', resize);

        function handleInput(x) {
            if (!gameActive) return;
            playerX = x;
            if (playerX < playerWidth / 2) playerX = playerWidth / 2;
            if (playerX > width - playerWidth / 2) playerX = width - playerWidth / 2;
        }

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 4. PARALLAX & VISUALS */
        function initBackground() {
            backgroundNodes = [];
            for (let i = 0; i < 30; i++) {
                backgroundNodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    speed: 0.5 + Math.random() * 1.5,
                    char: Math.random() > 0.5 ? '$' : '¥',
                    size: 10 + Math.random() * 30,
                    opacity: 0.05 + Math.random() * 0.1
                });
            }
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050816');
            grad.addColorStop(0.55, '#120f2e');
            grad.addColorStop(1, '#1b1140');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const halo = ctx.createRadialGradient(width * 0.5, height * 0.12, 20, width * 0.5, height * 0.12, width * 0.5);
            halo.addColorStop(0, 'rgba(103, 232, 249, 0.24)');
            halo.addColorStop(1, 'rgba(103, 232, 249, 0)');
            ctx.fillStyle = halo;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            backgroundNodes.forEach(node => {
                ctx.globalAlpha = node.opacity;
                ctx.font = `${node.size}px monospace`;
                ctx.fillText(node.char, node.x, node.y);

                node.y -= node.speed;
                if (node.y < -50) {
                    node.y = height + 50;
                    node.x = Math.random() * width;
                }
            });
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = 'rgba(103, 232, 249, 0.14)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < width; i += 44) {
                ctx.moveTo(i, height);
                ctx.lineTo(i + (i - width / 2), height + 220);
            }
            ctx.stroke();
        }

        /** 5. GAME LOGIC */
        class Item {
            constructor() {
                this.radius = 15 + Math.random() * 10;
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = -50;

                const rand = Math.random();
                if (rand > 0.95) {
                    this.type = 'diamond';
                    this.value = 500;
                    this.color = '#a5f3fc';
                    this.speed = 4 + Math.random() * 2;
                } else if (rand > 0.7) {
                    this.type = 'cash';
                    this.value = 100;
                    this.color = '#86efac';
                    this.speed = 3 + Math.random() * 2;
                } else {
                    this.type = 'coin';
                    this.value = 10;
                    this.color = '#fde047';
                    this.speed = 2 + Math.random() * 2;
                }

                this.speed *= difficultyMultiplier;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                if (this.type === 'coin') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.fillStyle = '#b45309';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('$', 0, 1);
                } else if (this.type === 'cash') {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.radius, -this.radius / 1.5, this.radius * 2, this.radius * 1.3);
                    ctx.fillStyle = '#14532d';
                    ctx.fillRect(-this.radius / 2, -this.radius / 4, this.radius, this.radius / 2);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.lineTo(this.radius, 0);
                    ctx.lineTo(0, this.radius);
                    ctx.lineTo(-this.radius, 0);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.life = 1.0;
                this.color = color;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = '$' + netWorth.toLocaleString();

            let newTitleIndex = currentTitleIndex;
            for (let i = TITLES.length - 1; i >= 0; i--) {
                if (netWorth >= TITLES[i].threshold) {
                    newTitleIndex = i;
                    break;
                }
            }

            if (newTitleIndex > currentTitleIndex) {
                currentTitleIndex = newTitleIndex;
                audio.playSFX('levelup', 300);
                flashGif('collect', 1000);
                const titleDisplay = document.getElementById('titleDisplay');
                titleDisplay.classList.add('bounce');
                setTimeout(() => titleDisplay.classList.remove('bounce'), 1000);
            }
            document.getElementById('titleDisplay').innerText = TITLES[currentTitleIndex].label;

            const livesContainer = document.getElementById('livesDisplay');
            livesContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const div = document.createElement('div');
                div.className = `life-dot${i < lives ? ' active' : ''}`;
                livesContainer.appendChild(div);
            }
        }

        function initGame() {
            netWorth = 0;
            lives = 5;
            items = [];
            particles = [];
            currentTitleIndex = 0;
            difficultyMultiplier = 1;
            frameCount = 0;
            playerX = width / 2;
            updateHUD();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawBackground();

            frameCount++;
            if (frameCount % 600 === 0) difficultyMultiplier += 0.1;

            if (frameCount % Math.max(20, Math.floor(60 - difficultyMultiplier * 5)) === 0) {
                items.push(new Item());
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update();
                item.draw();

                const pY = height - 100;
                const pH = 20;

                let hit = false;
                if (item.y + item.radius > pY && item.y - item.radius < pY + pH) {
                    if (item.x > playerX - playerWidth / 2 && item.x < playerX + playerWidth / 2) {
                        hit = true;
                    }
                }

                if (hit) {
                    netWorth += item.value;
                    audio.playSFX('collect', 70);
                    if (item.type === 'diamond' || item.type === 'cash') {
                        flashGif('collect', 820);
                    }
                    spawnParticles(item.x, item.y, item.color);
                    items.splice(i, 1);
                    updateHUD();
                    continue;
                }

                if (item.y > height) {
                    items.splice(i, 1);
                    lives--;
                    audio.playSFX('fail', 220);
                    flashGif('fail', 900);
                    updateHUD();

                    canvas.style.transform = `translate(${Math.random() * 10 - 5}px, ${Math.random() * 10 - 5}px)`;
                    setTimeout(() => canvas.style.transform = 'none', 50);

                    if (lives <= 0) {
                        gameOver();
                    }
                }
            }

            ctx.save();
            ctx.shadowBlur = 22;
            ctx.shadowColor = '#67e8f9';

            const runnerY = height - 100;
            const runnerLeft = playerX - playerWidth / 2;
            const runnerTop = runnerY - 14;
            const runnerHeight = 28;

            ctx.fillStyle = 'rgba(103, 232, 249, 0.1)';
            ctx.beginPath();
            ctx.ellipse(playerX, runnerY + 24, playerWidth * 0.46, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#b9c7ff';
            ctx.beginPath();
            ctx.roundRect(runnerLeft, runnerTop, playerWidth, runnerHeight, 12);
            ctx.fill();

            ctx.fillStyle = '#22d3ee';
            ctx.beginPath();
            ctx.roundRect(runnerLeft + 8, runnerTop + 6, playerWidth - 16, runnerHeight - 12, 10);
            ctx.fill();

            ctx.fillStyle = '#081223';
            ctx.beginPath();
            ctx.arc(playerX, runnerTop - 12, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#67e8f9';
            ctx.beginPath();
            ctx.arc(playerX - 5, runnerTop - 13, 3, 0, Math.PI * 2);
            ctx.arc(playerX + 5, runnerTop - 13, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(103, 232, 249, 0.65)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(playerX, runnerTop - 2, playerWidth * 0.55, Math.PI * 1.08, Math.PI * 1.92);
            ctx.stroke();

            ctx.restore();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('gameOver', 400);
            flashGif('fail', 1400);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = '$' + netWorth.toLocaleString();
            document.getElementById('finalTitle').innerText = TITLES[currentTitleIndex].label;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            resize();
            audio.unlock();
            audio.playSFX('start', 250);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 250);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        resize();
    });
    </script>
</body>
</html>
