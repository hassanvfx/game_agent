<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --sky: #071019;
            --sky-deep: #10243a;
            --panel: rgba(10, 26, 45, 0.9);
            --panel-border: #041018;
            --panel-glow: rgba(57, 255, 136, 0.35);
            --hero: #ff4fb3;

            --coin: #ffe45a;
            --mint: #39ff88;
            --danger: #ff4d57;
            --portal-cyan: #58f5ff;
            --rick-blue: #9fe8ff;
            --citadel-violet: #32114a;
            --text: #f8fbff;
            --shadow: #05070f;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 18%, rgba(57, 255, 136, 0.22), transparent 22%),
                radial-gradient(circle at 82% 28%, rgba(88, 245, 255, 0.16), transparent 24%),
                linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
            font-family: 'Bangers', system-ui, sans-serif;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(57, 255, 136, 0.34) 0 2px, transparent 3px),
                radial-gradient(circle at 80% 25%, rgba(88, 245, 255, 0.25) 0 3px, transparent 4px),
                radial-gradient(circle at 65% 70%, rgba(159, 232, 255, 0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 30% 78%, rgba(255, 228, 90, 0.2) 0 6px, transparent 7px);
            background-size: 22rem 22rem, 20rem 20rem, 18rem 18rem, 26rem 26rem;
            opacity: 0.75;
        }
        body::after {
            background:
                linear-gradient(135deg, transparent 0 47%, rgba(57, 255, 136, 0.08) 47% 49%, transparent 49% 100%),
                linear-gradient(225deg, transparent 0 47%, rgba(88, 245, 255, 0.08) 47% 49%, transparent 49% 100%);
            background-size: 56px 56px;
            mix-blend-mode: soft-light;
            opacity: 0.7;
        }
        button, input { font: inherit; }
        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 1; }
        #ui-layer { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
        .hidden { display: none !important; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .top-20 { top: 5rem; }

        .left-0 { left: 0; }
        .left-1\/2 { left: 50%; }
        .right-4 { right: 1rem; }
        .bottom-0 { bottom: 0; }
        .bottom-8 { bottom: max(2rem, env(safe-area-inset-bottom, 0px) + 1rem); }
        .w-full { width: 100%; }
        .w-11\/12 { width: 91.666667%; }
        .w-64 { width: min(16rem, calc(100vw - 2rem)); }
        .w-8 { width: 2rem; }
        .w-6 { width: 1.5rem; }
        .w-fit, .w-max { width: fit-content; }
        .h-full { height: 100%; }
        .h-8 { height: 2rem; }

        .min-w-\[70px\] { min-width: 70px; }
        .max-w-sm { max-width: 26rem; }
        .max-h-\[45vh\] { max-height: 45vh; }

        .z-\[70\] { z-index: 70; }
        .z-\[75\] { z-index: 75; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1rem; }
        .p-8 { padding: 1.25rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 1.5rem; padding-right: 1.5rem; }

        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .shrink-0 { flex-shrink: 0; }
        .inline-block { display: inline-block; }
        .overflow-hidden { overflow: hidden; }
        .overflow-x-auto { overflow-x: auto; }
        .overflow-y-auto { overflow-y: auto; }
        .rounded-lg { border-radius: 14px; }
        .rounded-xl { border-radius: 18px; }

        .border-4 { border-width: 4px; border-style: solid; }
        .border-t-4 { border-top-width: 4px; border-top-style: solid; }
        .select-none, .touch-none { user-select: none; -webkit-user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .appearance-none { appearance: none; -webkit-appearance: none; }
        .cursor-pointer { cursor: pointer; }

        .bg-white { background: rgba(255, 255, 255, 0.92); }
        .text-black { color: #111; }
        .text-white { color: #f8fbff; }
        .text-blue-800 { color: #123778; }
        .text-yellow-300 { color: var(--coin); }
        .text-red-500 { color: #ff7366; }
        .text-\[\#FF007F\] { color: var(--hero); }
        .bg-\[\#FF007F\] { background: linear-gradient(180deg, rgba(255,79,179,0.97), rgba(255,43,142,0.92)); }
        .bg-\[\#FFEB3B\] { background: var(--coin); }
        .bg-\[\#00E5FF\] { background: linear-gradient(180deg, rgba(108,231,255,0.98), rgba(42,169,246,0.95)); }
        .bg-orange-400 { background: #ff9468; }
        .bg-red-400 { background: #ff6f7a; }
        .bg-gray-400 { background: #9aa7bd; }
        .bg-pink-400 { background: #ff7dc5; }
        .bg-yellow-400 { background: #ffd447; }
        .bg-pink-600 { background: #d6298d; }
        .bg-red-600 { background: #df3c52; }
        .bg-gray-600 { background: #5c6980; }
        .bg-red-800 { background: #86243a; }
        .bg-cyan-200 { background: #b3f6ff; }
        .text-xs { font-size: 0.7rem; }
        .text-sm { font-size: 0.78rem; }
        .text-lg { font-size: 1rem; }
        .text-xl { font-size: 1.08rem; }
        .text-2xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.55rem; }
        .text-4xl { font-size: clamp(1.6rem, 4vw, 2rem); }
        .text-5xl { font-size: clamp(2rem, 5vw, 2.4rem); }
        .font-bold { font-weight: 700; }
        .memphis-text {
            font-family: 'Press Start 2P', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.35;
            text-shadow: 2px 2px 0 var(--shadow), 0 0 12px rgba(255, 255, 255, 0.18);
            color: var(--text);
        }
        .memphis-panel {
            background:
                linear-gradient(180deg, rgba(34, 41, 98, 0.96), rgba(18, 21, 58, 0.96));
            border: 4px solid var(--panel-border);
            box-shadow:
                0 12px 0 rgba(5, 7, 15, 0.7),
                0 0 0 2px rgba(255, 255, 255, 0.12) inset,
                0 0 24px var(--panel-glow);
            border-radius: 24px;
            color: var(--text);
        }
        #media-overlays {
            position: absolute;
            inset: 0;
            z-index: 55;
            pointer-events: none;
            overflow: hidden;
        }
        .reaction-gif {
            position: absolute;
            right: 0.9rem;
            width: min(28vw, 120px);
            border-radius: 16px;
            border: 3px solid rgba(11, 16, 45, 0.9);
            box-shadow: 0 8px 18px rgba(5, 7, 15, 0.35);
            background: rgba(255, 255, 255, 0.14);
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            object-fit: cover;
        }
        .reaction-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        #reward-gif {
            top: max(4.8rem, env(safe-area-inset-top, 0px) + 4rem);
        }
        #danger-gif {
            bottom: max(7rem, env(safe-area-inset-bottom, 0px) + 5rem);
        }
        .memphis-btn {
            background: linear-gradient(180deg, #fff089 0%, #ffd447 100%);
            border: 3px solid var(--panel-border);
            box-shadow: 0 5px 0 var(--shadow), 0 0 0 1px rgba(255,255,255,0.2) inset;
            color: #121212;
            text-shadow: none;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            font-family: 'Bangers', system-ui, sans-serif;
            letter-spacing: 1px;
        }
        .memphis-btn:active:not(:disabled) {
            transform: translate(0, 4px);
            box-shadow: 0 1px 0 var(--shadow), 0 0 0 1px rgba(255,255,255,0.18) inset;
            filter: brightness(0.98);
        }
        .memphis-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 5px 0 var(--shadow);
        }
        .tool-btn.selected {
            background: linear-gradient(180deg, #7fffd1 0%, #31f5ab 100%);
            transform: translate(0, 2px);
            box-shadow: 0 3px 0 var(--shadow), 0 0 16px rgba(115, 255, 216, 0.45);
        }
        #hud > div:first-child,
        #hud > div:last-child,
        #magma-hud > div,
        #btn-pickup-magnet,
        #editor-panel,
        #jetpack-ui {
            filter: drop-shadow(0 8px 14px rgba(4, 6, 16, 0.3));
        }
        #hud {
            padding-top: max(0.75rem, env(safe-area-inset-top, 0px) + 0.35rem);
        }
        #hud .memphis-text,
        #magma-hud .memphis-text,
        #jetpack-ui {
            background:
                radial-gradient(circle at 12% 18%, rgba(57, 255, 136, 0.18), transparent 34%),
                linear-gradient(180deg, rgba(7, 16, 25, 0.84), rgba(16, 36, 58, 0.72));
            border: 2px solid rgba(88, 245, 255, 0.42);
            border-radius: 12px;
            padding: 0.34rem 0.48rem;
            box-shadow:
                0 0 0 2px rgba(5, 7, 15, 0.62),
                inset 0 0 14px rgba(57, 255, 136, 0.10),
                0 0 18px rgba(88, 245, 255, 0.12);
        }
        #coin-display,
        #score-display,
        #high-score-display,
        #fuel-display,
        #final-score,
        #final-coins {
            color: var(--coin);
        }
        #btn-map {
            max-width: min(54vw, 260px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #btn-jump {
            background:
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.75), transparent 22%),
                linear-gradient(180deg, var(--mint), #18c774);
            box-shadow: 0 5px 0 var(--shadow), 0 0 20px rgba(57, 255, 136, 0.22);
        }
        #editor-panel {
            padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px) + 0.5rem);
            background: linear-gradient(180deg, rgba(28, 34, 87, 0.96), rgba(18, 21, 58, 0.98));
            border-color: var(--panel-border);
            box-shadow: 0 -10px 22px rgba(5, 7, 15, 0.35);
        }
        #btn-pickup-magnet {
            background: linear-gradient(180deg, #fff 0%, #ffe9a8 100%);
            min-width: 104px;
        }
        .shop-scroll::-webkit-scrollbar { width: 8px; }
        .shop-scroll::-webkit-scrollbar-track { background: transparent; }
        .shop-scroll::-webkit-scrollbar-thumb { background: rgba(11, 16, 45, 0.8); border-radius: 4px; }
        .editor-scroll::-webkit-scrollbar { height: 8px; }
        .editor-scroll::-webkit-scrollbar-track { background: transparent; }
        .editor-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.5); border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--hero);
            border: 3px solid var(--panel-border);
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 0 var(--shadow);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--panel-border);
            border-radius: 4px;
        }
        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--hero);
            border: 3px solid var(--panel-border);
            cursor: pointer;
        }
        input[type=range]::-moz-range-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--panel-border);
            border-radius: 4px;
        }
        @media (max-width: 640px) {
            .p-6 { padding: 0.9rem; }
            .p-8 { padding: 1rem; }
            .px-6 { padding-left: 0.8rem; padding-right: 0.8rem; }
            .gap-4 { gap: 0.75rem; }
            .text-3xl { font-size: 1.2rem; }
            .text-2xl { font-size: 1rem; }
            .text-xl { font-size: 0.92rem; }
            .text-lg { font-size: 0.9rem; }
            .w-16 { width: 3.5rem; }
            .h-16 { height: 3.5rem; }
            .bottom-8 { bottom: max(1rem, env(safe-area-inset-bottom, 0px) + 0.25rem); }
            .memphis-text { letter-spacing: 0.5px; text-shadow: 1.5px 1.5px 0 var(--shadow); }
            #btn-pickup-magnet { right: 0.75rem; padding: 0.6rem; }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "gravity": { "type": "number", "label": "Gravity", "value": 0.4, "min": 0.1, "max": 1.0 },
        "driveForce": { "type": "number", "label": "Drive Force", "value": 0.8, "min": 0.1, "max": 2.0 },
        "spinForce": { "type": "number", "label": "Spin Force", "value": 0.35, "min": 0.1, "max": 1.0 }
    }
    </script>
</head>
<body>
    <div id="game-container" class="select-none">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
            
            <!-- Contextual Magnet Pickup Button -->
            <button id="btn-pickup-magnet" class="hidden absolute right-4 top-1/2 -translate-y-1/2 memphis-btn p-3 rounded-xl flex-col items-center pointer-events-auto z-50">
                <span class="memphis-text text-xl text-black" style="text-shadow:none">PICK UP</span>
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 10V6a8 8 0 0 1 16 0v4"></path>
                    <rect x="2" y="10" width="4" height="4" fill="silver"></rect>
                    <rect x="18" y="10" width="4" height="4" fill="silver"></rect>
                </svg>
            </button>

            <!-- [agent-note][stage3] resolved-gif: reward/fail feedback overlays from catalogs/gifs.json -->
            <div id="media-overlays" aria-hidden="true">
                <img
                    id="reward-gif"
                    class="reaction-gif"
                    alt=""
                    src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
                <img
                    id="danger-gif"
                    class="reaction-gif"
                    alt=""
                    src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
            </div>

            <!-- HUD -->
            <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none transition-opacity">
                <div class="flex flex-col">
                    <div class="flex items-center gap-4">
                        <div class="memphis-text text-3xl">Chaos: <span id="score-display">0</span></div>
                        <button id="btn-editor-open" class="memphis-btn p-2 rounded-xl flex items-center justify-center pointer-events-auto">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                        </button>
                    </div>
                    <div class="memphis-text text-2xl text-yellow-300 mt-1 flex items-center gap-2">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFEB3B" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 12h8"/></svg>
                        <span id="coin-display">0</span>
                    </div>
                    <div id="jetpack-ui" class="hidden memphis-text text-xl text-[#FF007F] mt-2 bg-white border-2 border-black px-2 py-1 rounded-lg shadow-[2px_2px_0px_#000] inline-block w-fit transition-all">
                        PORTAL: <span id="fuel-display">0</span>%
                    </div>
                </div>
                <div class="flex flex-col items-end pointer-events-auto gap-2">
                    <div class="memphis-text text-2xl text-white">Best: <span id="high-score-display">0</span></div>
                    <button id="btn-shop-open" class="memphis-btn p-2 rounded-xl flex items-center justify-center">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    </button>
                    <button id="btn-settings-open" class="memphis-btn p-2 rounded-xl flex items-center justify-center mt-1">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Magma HUD -->
            <div id="magma-hud" class="hidden absolute top-20 left-1/2 -translate-x-1/2 flex-col items-center pointer-events-none w-full px-4">
                <div class="memphis-text text-3xl text-red-500" id="eruption-timer" style="text-shadow: 2px 2px 0 #000;">PORTAL SURGE: 30</div>
                <div class="w-64 h-8 bg-black border-4 border-white mt-2 rounded-full overflow-hidden">
                    <div id="health-bar-fill" class="h-full bg-red-600 w-full transition-all duration-200"></div>
                </div>
            </div>
            
            <!-- Controls -->

    <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/hazard mapped from catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3" preload="auto"></audio>
    <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_hazard" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_menu_open" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3" preload="auto"></audio>
    <audio id="sfx_menu_close" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_02.mp3" preload="auto"></audio>
    <audio id="sfx_game_over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>

    <script>
        let gameConfig = {};
        let cw = 0, ch = 0, dpr = 1;
        let canvas, ctx;
        let initialized = false;
        let gameState = 'PLAYING'; 
        let lastTime = 0;
        let animationFrameId;

        let audioCtx = null;
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const audioSprites = {
            jump: document.getElementById('sfx_jump'),
            collect: document.getElementById('sfx_collect'),
            hazard: document.getElementById('sfx_hazard'),
            ui: document.getElementById('sfx_ui'),
            menuOpen: document.getElementById('sfx_menu_open'),
            menuClose: document.getElementById('sfx_menu_close'),
            gameOver: document.getElementById('sfx_game_over')
        };
        const gifEls = {
            reward: document.getElementById('reward-gif'),
            danger: document.getElementById('danger-gif')
        };
        let gifTimers = { reward: null, danger: null };
        let lastSfxAt = { jump: 0, collect: 0, hazard: 0, ui: 0, menuOpen: 0, menuClose: 0, gameOver: 0 };
        let previousState = 'PLAYING';
        
        let masterVolume = 1.0;
        let colorblindMode = false;
        let skaterColor = '#FF4FB3';
        
        const MAPS = [
            { id: 'grass', name: 'GARAGE LAB', bg: '#10243A', terrain: '#39FF88', dots: '#58F5FF', friction: 0.99, driveMult: 1 },
            { id: 'ice', name: 'TIME SLICK', bg: '#092B34', terrain: '#DFFBFF', dots: '#39FF88', friction: 1.0, driveMult: 0.2 },
            { id: 'ramp', name: 'BLIPS CHITZ', bg: '#251350', terrain: '#FFE45A', dots: '#FF4FB3', friction: 0.99, driveMult: 1 },
            { id: 'magma', name: 'CITADEL SURGE', bg: '#32114A', terrain: '#FF8B32', dots: '#39FF88', friction: 0.98, driveMult: 0.8 }
        ];
        let currentMapIdx = 0;
        let currentColors = { bg: MAPS[0].bg, terrain: MAPS[0].terrain, dots: MAPS[0].dots };

        let mapState = {
            timer: 30,
            erupting: false,
            health: 100,
            lava: [],
            nextRampSpawnX: 0
        };

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function updateAudioLevels() {
            bgm.volume = Math.min(0.2, masterVolume * 0.2);
            Object.values(audioSprites).forEach((audio) => {
                if (!audio) return;
                audio.volume = Math.min(1, Math.max(0, masterVolume * 0.72));
            });
            if (audioSprites.hazard) audioSprites.hazard.volume = Math.min(1, masterVolume * 0.58);
            if (audioSprites.ui) audioSprites.ui.volume = Math.min(1, masterVolume * 0.5);
            if (audioSprites.menuOpen) audioSprites.menuOpen.volume = Math.min(1, masterVolume * 0.5);
            if (audioSprites.menuClose) audioSprites.menuClose.volume = Math.min(1, masterVolume * 0.5);
            if (audioSprites.gameOver) audioSprites.gameOver.volume = Math.min(1, masterVolume * 0.6);
        }
        function unlockAudio() {
            if (audioUnlocked) return;
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            updateAudioLevels();
            bgm.play().catch(() => {});
            audioUnlocked = true;
        }
        function triggerGif(type, duration = 1400) {
            const el = gifEls[type];
            if (!el) return;
            el.classList.add('active');
            if (gifTimers[type]) clearTimeout(gifTimers[type]);
            gifTimers[type] = setTimeout(() => {
                el.classList.remove('active');
                gifTimers[type] = null;
            }, duration);
        }
        function playMappedSfx(name, minGap = 120) {
            if (!audioUnlocked || masterVolume <= 0) return;
            const audio = audioSprites[name];
            if (!audio) return;
            const now = performance.now();
            if (now - (lastSfxAt[name] || 0) < minGap) return;
            lastSfxAt[name] = now;
            try {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch (e) {}
        }

        function playSynth(type, intensity = 1) {
            if (!audioCtx || audioCtx.state !== 'running' || masterVolume <= 0) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                let volMult = masterVolume;
                
                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1000 + (intensity * 200), now);
                    osc.frequency.exponentialRampToValueAtTime(2000 + (intensity * 400), now + 0.1);
                    gain.gain.setValueAtTime(0.3 * volMult, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.4 * volMult, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'jump') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.1 * volMult, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'place') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.2 * volMult, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'magnet') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(350, now + 0.1);
                    gain.gain.setValueAtTime(0.1 * volMult, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                }
            } catch (e) {}
        }

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
        }

        let score = 0, coins = 0, highScore = localStorage.getItem('beanSkaterHighScore') || 0;
        let isLeftDown = false, isRightDown = false, isJumpDown = false;
        let camera = { x: 0, y: 0 };
        const board = {
            w1: { x: 0, y: 0, oldx: 0, oldy: 0, radius: 12 },
            w2: { x: 0, y: 0, oldx: 0, oldy: 0, radius: 12 },
            length: 60, thickness: 12, prevAngle: 0, accumulatedAngle: 0, onGround: false
        };
        let particles = [], popups = [];
        let jumpForce = 15, gravityMod = 1.0, spinMod = 1.0;
        let terrainPattern;
        
        let hasDoubleJump = false;
        let canDoubleJump = false;
        let jetpackFuel = 0;
        let collectibles = [];
        let nextSpawnX = 0;

        let stuckInGum = false;
        let gumStruggleCount = 0;
        let activeGumItem = null;
        
        let tiresPopped = false;
        let tirePopTimer = 0;

        // Magnet mechanics
        let playerHasMagnet = false;
        let magnetActive = false;
        let pickupTarget = null;

        let customRamps = [];
        let customItems = [];
        let selectedToolType = 'bump';
        let selectedToolCat = 'ramp';
        let editorPan = { active: false, startX: 0, startY: 0, camStartX: 0, camStartY: 0, moved: false };

        function buildTerrainPattern() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 40; pCanvas.height = 40;
            const pCtx = pCanvas.getContext('2d');
            pCtx.fillStyle = currentColors.terrain; pCtx.fillRect(0, 0, 40, 40);
            pCtx.strokeStyle = 'rgba(5, 7, 15, 0.75)'; pCtx.lineWidth = 4;
            pCtx.beginPath(); pCtx.moveTo(-10, -10); pCtx.lineTo(50, 50); pCtx.stroke();
            pCtx.strokeStyle = 'rgba(255, 255, 255, 0.28)'; pCtx.lineWidth = 2;
            pCtx.beginPath(); pCtx.moveTo(40, -4); pCtx.lineTo(-4, 40); pCtx.stroke();
            terrainPattern = ctx.createPattern(pCanvas, 'repeat');
            document.body.style.backgroundColor = currentColors.bg;
        }

        function updateShopUI() {
            document.getElementById('btn-upg-jump').disabled = coins < 15;
            document.getElementById('btn-upg-fall').disabled = coins < 35;
            document.getElementById('btn-upg-spin').disabled = coins < 55;
            
            const btnDJump = document.getElementById('btn-upg-djump');
            btnDJump.disabled = coins < 140 || hasDoubleJump;
            btnDJump.innerText = hasDoubleJump ? "MAX" : "140 C";
            
            document.getElementById('btn-upg-jetpack').disabled = coins < 400;
            document.getElementById('shop-coins-display').innerText = coins;
        }

        function updateHUD() {
            const ui = document.getElementById('jetpack-ui');
            if (jetpackFuel > 0) {
                ui.classList.remove('hidden');
                document.getElementById('fuel-display').innerText = Math.ceil(jetpackFuel);
            } else {
                ui.classList.add('hidden');
            }
            
            if (currentMapIdx === 3) {
                document.getElementById('health-bar-fill').style.width = Math.max(0, mapState.health) + '%';
                let t = Math.ceil(mapState.timer);
                document.getElementById('eruption-timer').innerText = mapState.erupting ? `SURGING: ${t}` : `SURGE IN: ${t}`;
                document.getElementById('eruption-timer').style.color = mapState.erupting ? '#FFEB3B' : '#EF4444';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const configScript = document.getElementById('game-config');
            if (configScript) {
                const defs = JSON.parse(configScript.textContent);
                for (let key in defs) gameConfig[key] = defs[key].value;
            }
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d', { alpha: false });
            buildTerrainPattern();

            const ro = new ResizeObserver(entries => {
                const rect = entries[0].contentRect;
                resize(rect.width, rect.height);
                if (!initialized) { initGame(); initialized = true; requestAnimationFrame(gameLoop); }
            });
            ro.observe(canvas);

            window.addEventListener('pointerdown', (e) => { unlockAudio(); }, { passive: false });
            
            window.addEventListener('pointerup', () => { 
                isLeftDown = false; isRightDown = false; isJumpDown = false; 
                magnetActive = false;
            });
            window.addEventListener('pointercancel', () => { 
                isLeftDown = false; isRightDown = false; isJumpDown = false; 
                magnetActive = false;
            });
            
            canvas.addEventListener('pointerdown', (e) => {
                if (gameState === 'EDITOR') {
                    e.preventDefault();
                    editorPan.active = true;
                    editorPan.startX = e.clientX;
                    editorPan.startY = e.clientY;
                    editorPan.camStartX = camera.x;
                    editorPan.camStartY = camera.y;
                    editorPan.moved = false;
                } else if (gameState === 'PLAYING') {
                    if (playerHasMagnet) {
                        magnetActive = true;
                        playSynth('magnet', 1);
                        vibrate('light');
                    }
                }
            }, { passive: false });

            window.addEventListener('pointermove', (e) => {
                if (gameState === 'EDITOR' && editorPan.active) {
                    let dx = e.clientX - editorPan.startX;
                    let dy = e.clientY - editorPan.startY;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) editorPan.moved = true;
                    camera.x = editorPan.camStartX - dx;
                    camera.y = editorPan.camStartY - dy;
                }
            });

            window.addEventListener('pointerup', (e) => {
                if (gameState === 'EDITOR' && editorPan.active) {
                    editorPan.active = false;
                    if (!editorPan.moved) {
                        let rect = canvas.getBoundingClientRect();
                        let worldX = (e.clientX - rect.left) + camera.x;
                        
                        if (selectedToolCat === 'clear') {
                            customRamps = customRamps.filter(r => !(worldX >= r.x && worldX <= r.x + r.w));
                            customItems = customItems.filter(i => Math.abs(worldX - i.x) > 40);
                            playSynth('place'); vibrate('light');
                        } else if (selectedToolCat === 'item') {
                            customItems.push({ x: worldX, y: getTerrainY(worldX), vx: 0, vy: 0, type: selectedToolType, active: true, cooldown: 0 });
                            playSynth('place'); vibrate('medium');
                            spawnParticles(worldX, getTerrainY(worldX), '#FFF', 15);
                        } else {
                            customRamps.push({ x: worldX - 150, w: 300, type: selectedToolType });
                            playSynth('place'); vibrate('medium');
                            spawnParticles(worldX, getTerrainY(worldX), '#FFF', 15);
                        }
                    }
                }
            });
            
            document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); isLeftDown = true; });
            document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); isRightDown = true; });
            
            const btnJump = document.getElementById('btn-jump');

                        addPopup((board.w1.x + board.w2.x)/2, (board.w1.y + board.w2.y)/2 - 60, `${5 - gumStruggleCount} LEFT!`, "#FF69B4", 1);
                        
                        if (gumStruggleCount >= 5) {
                            stuckInGum = false;
                            if (activeGumItem) activeGumItem.active = false;
                            activeGumItem = null;
                            playSynth('jump'); vibrate('heavy');
                            addPopup((board.w1.x + board.w2.x)/2, (board.w1.y + board.w2.y)/2 - 80, "PORTAL FREE!", "#39FF88", 1.5);
                            board.w1.oldy = board.w1.y + jumpForce; board.w2.oldy = board.w2.y + jumpForce;
                        }
                        return;
                    }

                    if (board.onGround) {
                        board.w1.oldy = board.w1.y + jumpForce; board.w2.oldy = board.w2.y + jumpForce;
                        playSynth('jump'); playMappedSfx('jump', 140); vibrate('medium');
                        spawnParticles((board.w1.x + board.w2.x)/2, (board.w1.y + board.w2.y)/2, '#FFF', 10);
                    } else if (hasDoubleJump && canDoubleJump) {
                        board.w1.oldy = board.w1.y + jumpForce * 0.85; 
                        board.w2.oldy = board.w2.y + jumpForce * 0.85;
                        canDoubleJump = false;
                        playSynth('jump'); vibrate('medium');
                        spawnParticles((board.w1.x + board.w2.x)/2, (board.w1.y + board.w2.y)/2, '#00E5FF', 15);
                        addPopup((board.w1.x + board.w2.x)/2, (board.w1.y + board.w2.y)/2 - 40, "EXTRA BOOST!", "#58F5FF");
                    }
                }
            });

            document.getElementById('btn-pickup-magnet').addEventListener('click', (e) => {
                if (pickupTarget && pickupTarget.active) {
                    pickupTarget.active = false;
                    playerHasMagnet = true;
                    playSynth('coin', 2); vibrate('medium');
                    spawnParticles(pickupTarget.x, getTerrainY(pickupTarget.x), '#FF0000', 30);
                    addPopup(pickupTarget.x, getTerrainY(pickupTarget.x) - 40, "TRACTOR GIZMO!", "#FF4D57", 1.5);
                    document.getElementById('btn-pickup-magnet').classList.add('hidden');
                }

            document.getElementById('restart-btn').addEventListener('click', () => { initGame(); setState('PLAYING'); });
            
            document.getElementById('btn-editor-open').addEventListener('click', () => {

            });
            document.getElementById('btn-editor-close').addEventListener('click', () => {

            });

            document.getElementById('btn-map').addEventListener('click', () => {
                currentMapIdx = (currentMapIdx + 1) % MAPS.length;
                document.getElementById('btn-map').innerText = `ZONE: ${MAPS[currentMapIdx].name}`;
                currentColors = { bg: MAPS[currentMapIdx].bg, terrain: MAPS[currentMapIdx].terrain, dots: MAPS[currentMapIdx].dots };
                buildTerrainPattern();
                initGame();
                playSynth('coin', 1); vibrate('medium');

            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('selected'));
                    e.currentTarget.classList.add('selected');
                    selectedToolType = e.currentTarget.getAttribute('data-type');
                    selectedToolCat = e.currentTarget.getAttribute('data-cat');
                    playSynth('jump'); playMappedSfx('ui', 80);
                });

            document.getElementById('btn-shop-open').addEventListener('click', () => {
                if (gameState === 'PLAYING') { setState('INGAME_SHOP'); updateShopUI(); }
            });
            document.getElementById('btn-shop-close').addEventListener('click', () => setState('PLAYING'));

            document.getElementById('btn-upg-jump').addEventListener('click', () => {
                if (coins >= 15) { coins -= 15; jumpForce += 2; updateScoreDisplay(); updateShopUI(); playSynth('coin', 1); }
            });
            document.getElementById('btn-upg-fall').addEventListener('click', () => {
                if (coins >= 35) { coins -= 35; gravityMod *= 0.8; updateScoreDisplay(); updateShopUI(); playSynth('coin', 1); }
            });
            document.getElementById('btn-upg-spin').addEventListener('click', () => {
                if (coins >= 55) { coins -= 55; spinMod += 0.5; updateScoreDisplay(); updateShopUI(); playSynth('coin', 1); }
            });
            document.getElementById('btn-upg-djump').addEventListener('click', () => {
                if (coins >= 140 && !hasDoubleJump) { coins -= 140; hasDoubleJump = true; updateScoreDisplay(); updateShopUI(); playSynth('coin', 1); }
            });
            document.getElementById('btn-upg-jetpack').addEventListener('click', () => {
                if (coins >= 400) { coins -= 400; jetpackFuel = Math.min(100, jetpackFuel + 10); updateScoreDisplay(); updateShopUI(); updateHUD(); playSynth('coin', 1); }
            });

            document.getElementById('btn-settings-open').addEventListener('click', () => {
