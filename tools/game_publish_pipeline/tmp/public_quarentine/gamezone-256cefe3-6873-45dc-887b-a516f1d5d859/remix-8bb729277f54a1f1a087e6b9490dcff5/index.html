            });
            document.getElementById('btn-settings-back').addEventListener('click', () => setState('PLAYING'));
            
            document.getElementById('vol-slider').addEventListener('input', (e) => {
                masterVolume = parseFloat(e.target.value);
                updateAudioLevels();
            });

            document.getElementById('btn-colorblind').addEventListener('click', () => {
                colorblindMode = !colorblindMode;
                document.getElementById('cb-check').classList.toggle('hidden', !colorblindMode);
            });

            document.getElementById('high-score-display').innerText = highScore;
        });

        function resize(width, height) {
            cw = width; ch = height; dpr = window.devicePixelRatio || 1;
            canvas.width = cw * dpr; canvas.height = ch * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function initGame() {
            score = 0; jumpForce = 15; gravityMod = 1.0; spinMod = 1.0; 
            hasDoubleJump = false; jetpackFuel = 0; collectibles = [];
            stuckInGum = false; gumStruggleCount = 0; activeGumItem = null;
            tiresPopped = false; tirePopTimer = 0;
            playerHasMagnet = false; magnetActive = false; pickupTarget = null;
            document.getElementById('btn-pickup-magnet').classList.add('hidden');

            board.w1.radius = 12; board.w2.radius = 12;
            customItems.forEach(i => { 
                i.active = true; i.cooldown = 0; 
                i.y = getTerrainY(i.x); i.vx = 0; i.vy = 0; 
            });
            
            customRamps = []; 
            mapState.timer = 30;
            mapState.erupting = false;
            mapState.health = 100;
            mapState.lava = [];
            mapState.nextRampSpawnX = 0;

            updateScoreDisplay(); updateHUD();
            
            let startX = 0, startY = getTerrainY(startX) - 200;
            board.w1.x = startX - 30; board.w1.y = startY; board.w1.oldx = board.w1.x; board.w1.oldy = board.w1.y;
            board.w2.x = startX + 30; board.w2.y = startY; board.w2.oldx = board.w2.x; board.w2.oldy = board.w2.y;
            board.prevAngle = 0; board.accumulatedAngle = 0; board.onGround = false;
            camera.x = startX - cw / 2; camera.y = startY - ch / 2;
            nextSpawnX = camera.x + 800;
            particles = []; popups = [];
            setState('PLAYING');
        }

        function setState(state) {
            const prevState = gameState;
            previousState = prevState;
            gameState = state;
            document.getElementById('settings-screen').classList.toggle('hidden', state !== 'SETTINGS');
            document.getElementById('ingame-shop-screen').classList.toggle('hidden', state !== 'INGAME_SHOP');
            document.getElementById('game-over-screen').classList.toggle('hidden', state !== 'GAMEOVER');
            
            document.getElementById('hud').classList.toggle('hidden', (state !== 'PLAYING' && state !== 'EDITOR' && state !== 'INGAME_SHOP' && state !== 'SETTINGS'));
            document.getElementById('controls').classList.toggle('hidden', state !== 'PLAYING');
            document.getElementById('editor-panel').classList.toggle('hidden', state !== 'EDITOR');
            document.getElementById('btn-editor-open').classList.toggle('hidden', state === 'EDITOR');
            
            document.getElementById('magma-hud').classList.toggle('hidden', (state !== 'PLAYING' || currentMapIdx !== 3));

            if (state === 'PLAYING') {
                if (prevState !== 'PLAYING') {
                    if (prevState === 'SETTINGS' || prevState === 'INGAME_SHOP' || prevState === 'EDITOR') playMappedSfx('menuClose', 120);
                    bgm.play().catch(() => {});
                }
            } else {
                if (state === 'SETTINGS' || state === 'INGAME_SHOP' || state === 'EDITOR') playMappedSfx('menuOpen', 120);
                bgm.pause();
            }

            if (state === 'GAMEOVER') {
                playMappedSfx('gameOver', 300);
                triggerGif('danger', 2200);
                document.getElementById('final-score').innerText = score;
                document.getElementById('final-coins').innerText = coins;
                if (score > highScore) { highScore = score; localStorage.setItem('beanSkaterHighScore', highScore); document.getElementById('high-score-display').innerText = highScore; }
            }
        }

        function getTerrainY(x) {
            let baseY = 300;
            let displacement = 0;
            for (let i = 0; i < customRamps.length; i++) {
                let r = customRamps[i];
                if (x >= r.x && x <= r.x + r.w) {
                    let p = (x - r.x) / r.w;
                    let d = 0;
                    if (r.type === 'bump') d = -Math.sin(p * Math.PI) * 100;
                    else if (r.type === 'curve') d = -Math.sin(p * Math.PI) * 200;
                    else if (r.type === 'ramp') {
                        if (p < 0.8) d = -(p / 0.8) * 150;
                        else d = -150 + ((p - 0.8) / 0.2) * 150;
                    }
                    else if (r.type === 'wave') d = -Math.sin(p * Math.PI * 4) * 80;
                    else if (r.type === 'step') d = -(p > 0.2 && p < 0.8 ? 100 : 0);
                    else if (r.type === 'spike') d = -(p < 0.5 ? p * 2 : 2 - p * 2) * 150;
                    else if (r.type === 'pit') d = Math.sin(p * Math.PI) * 100;
                    else if (r.type === 'halfpipe') d = -150 + Math.pow(p * 2 - 1, 2) * 150;
                    displacement += d;
                }
            }
            return baseY + displacement;
        }

        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 1, color, size: Math.random()*8+4 });
        }
        function addPopup(x, y, text, color, scale = 1) { popups.push({ x, y, text, color, life: 1, scale }); }

        function updatePhysics(dt) {
            if (tiresPopped) {
                tirePopTimer -= dt;
                isLeftDown = false;
                isRightDown = false;
                board.w1.radius = 6;
                board.w2.radius = 6;
                if (tirePopTimer <= 0) {
                    tiresPopped = false;
                    board.w1.radius = 12;
                    board.w2.radius = 12;
                    board.w1.y -= 6;
                    board.w2.y -= 6;
                    playSynth('jump'); vibrate('light');
                    addPopup((board.w1.x + board.w2.x)/2, (board.w1.y + board.w2.y)/2 - 40, "WHEELS REALIGNED!", "#39FF88", 1.5);
                }
            }

            if (stuckInGum) {
                board.w1.oldx = board.w1.x;
                board.w2.oldx = board.w2.x;
                board.w1.oldy = board.w1.y;
                board.w2.oldy = board.w2.y;
                isLeftDown = false;
                isRightDown = false;
            }

            let onIce = false;
            let cx = (board.w1.x + board.w2.x)/2, cy = (board.w1.y + board.w2.y)/2;

            pickupTarget = null;

            customItems.forEach(item => {
                if (item.cooldown > 0) item.cooldown -= dt;
                
                if (item.type === 'ice_path' && item.active) {
                    let ty = getTerrainY(item.x);
                    if (Math.abs(item.x - cx) < 80 && Math.abs(cy - ty) < 60) {
                        onIce = true;
                    }
                }

                if (item.type === 'magnet_pickup' && item.active) {
                    let ty = getTerrainY(item.x);
                    if (Math.hypot(item.x - cx, ty - cy) < 150) {
                        pickupTarget = item;
                    }
                }

                if (item.type === 'metal_spike' && item.active) {
                    if (magnetActive) {
                        let dx = cx - item.x;
                        let dy = cy - item.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist < 500 && dist > 10) {
                            item.vx += (dx / dist) * 800 * dt;
                            item.vy += (dy / dist) * 800 * dt;
                            if (Math.random() < 0.2) spawnParticles(item.x, item.y, '#FFF', 1);
                        }
                    }
                    
                    item.vy += gameConfig.gravity * 800 * dt; // gravity for metal spike
                    item.x += item.vx * dt;
                    item.y += item.vy * dt;
                    
                    let ty = getTerrainY(item.x);
                    if (item.y > ty) {
                        item.y = ty;
                        item.vy *= -0.4;
                        item.vx *= 0.8;
                        if (Math.abs(item.vx) > 50 && Math.random() < 0.3) spawnParticles(item.x, item.y, '#FFD700', 2);
                    }

                    if (Math.hypot(item.x - cx, item.y - cy) < 30) {
                        playSynth('crash'); vibrate('heavy');
                        spawnParticles(item.x, item.y, '#FF0000', 50);
                        addPopup(item.x, item.y - 40, "DRONE HIT!", "#FF4D57", 2);
                        setTimeout(() => { if (gameState === 'PLAYING') setState('GAMEOVER'); }, 100);
                    }
                }

                if (item.type === 'moving_spike' && item.active) {
                    let ty = getTerrainY(item.x);
                    let spikeY = ty - 20 + Math.sin(Date.now() / 400 + item.x) * 80;
                    if (Math.abs(item.x - cx) < 40 && Math.abs(spikeY - cy) < 40) {
                        playSynth('crash'); vibrate('heavy');
                        spawnParticles(item.x, spikeY, '#FF0000', 50);
                        addPopup(item.x, spikeY - 40, "COUNCIL TRAP!", "#FF4D57", 2);
                        setTimeout(() => { if (gameState === 'PLAYING') setState('GAMEOVER'); }, 100);
                    }
                }
            });

            if (pickupTarget && gameState === 'PLAYING') {
                document.getElementById('btn-pickup-magnet').classList.remove('hidden');
            } else {
                document.getElementById('btn-pickup-magnet').classList.add('hidden');
            }

            let mapDef = MAPS[currentMapIdx];
            const g = gameConfig.gravity * gravityMod;
            let friction = mapDef.friction;
            if (tiresPopped) friction = 0.90;
            if (onIce) friction = 1.0;
            const airDrag = 0.995;
            
            if (currentMapIdx === 2) {
                if (mapState.nextRampSpawnX < camera.x + cw + 1000) {
                    let types = ['ramp', 'halfpipe', 'wave', 'bump', 'curve'];
                    let type = types[Math.floor(Math.random()*types.length)];
                    customRamps.push({ x: mapState.nextRampSpawnX, w: 300 + Math.random()*300, type: type });
                    mapState.nextRampSpawnX += 600 + Math.random()*400;
                }
                customRamps = customRamps.filter(r => r.x + r.w > camera.x - 1000);
            }

            if (currentMapIdx === 3) {
                mapState.timer -= dt;
                if (!mapState.erupting && mapState.timer <= 0) {
                    mapState.erupting = true; mapState.timer = 30;
                    addPopup(cx, cy - 100, "PORTAL SURGE!", "#FF4D57", 2); vibrate('heavy');
                } else if (mapState.erupting && mapState.timer <= 0) {
                    mapState.erupting = false; mapState.timer = 20;
                    addPopup(cx, cy - 100, "DIMENSION STABLE...", "#39FF88", 2);
                }

                if (mapState.erupting && Math.random() < 0.2) {
                    mapState.lava.push({
                        x: camera.x + Math.random() * (cw + 400) - 200, y: camera.y - 100,
                        vx: (Math.random() - 0.5) * 100, vy: 200 + Math.random() * 300, r: 6 + Math.random() * 10
                    });
                }

                for (let i = mapState.lava.length - 1; i >= 0; i--) {
                    let l = mapState.lava[i];
                    l.x += l.vx * dt; l.y += l.vy * dt;
                    
                    if (Math.hypot(l.x - cx, l.y - cy) < l.r + 15) {
                        mapState.health -= 15;
                        playSynth('crash'); vibrate('medium'); spawnParticles(l.x, l.y, '#FF4500', 15);
                        mapState.lava.splice(i, 1);
                        if (mapState.health <= 0) { playSynth('crash'); vibrate('heavy'); setState('GAMEOVER'); }
                        continue;
                    }
                    if (l.y > getTerrainY(l.x)) { spawnParticles(l.x, l.y, '#FF4500', 5); mapState.lava.splice(i, 1); }
                }
                updateHUD();
            }

            if (isJumpDown && !board.onGround && jetpackFuel > 0 && !stuckInGum && !tiresPopped) {
                jetpackFuel -= dt * 30; if (jetpackFuel < 0) jetpackFuel = 0;
                board.w1.y -= (g + 0.3); board.w2.y -= (g + 0.3);
                if (Math.random() < 0.4) spawnParticles((board.w1.x + board.w2.x)/2, (board.w1.y + board.w2.y)/2 + 10, '#FF007F', 2);
                updateHUD();
            }

            let wheels = [board.w1, board.w2], touching = 0;
            wheels.forEach(w => {
                let vx = (w.x - w.oldx), vy = (w.y - w.oldy);
                w.oldx = w.x; w.oldy = w.y;
                w.x += vx * (board.onGround ? friction : airDrag);
                w.y += vy * (board.onGround ? friction : airDrag) + g;
            });
            
            let input = isLeftDown ? -1 : (isRightDown ? 1 : 0);
            if (input !== 0) {
                if (board.onGround) { 
                    let force = gameConfig.driveForce * mapDef.driveMult;
                    if (onIce) force *= 0.1;
                    board.w1.x += input * force; board.w2.x += input * force; 
                }
                else {
                    let torque = input * gameConfig.spinForce * spinMod * 0.1, cos = Math.cos(torque), sin = Math.sin(torque);
                    [board.w1, board.w2].forEach(w => {
                        let dx = w.x - cx, dy = w.y - cy;
                        w.x = cx + dx * cos - dy * sin; w.y = cy + dx * sin + dy * cos;
                    });
                }
            }
            
            for(let i=0; i<3; i++) {
                let dx = board.w2.x - board.w1.x, dy = board.w2.y - board.w1.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 0) {
                    let percent = (board.length - dist) / dist / 2;
                    board.w1.x -= dx * percent; board.w1.y -= dy * percent;
                    board.w2.x += dx * percent; board.w2.y += dy * percent;
                }
            }
            
            wheels.forEach(w => {
                let ty = getTerrainY(w.x);
                if (w.y + w.radius > ty) {
                    w.y = ty - w.radius; touching++;
                    if (Math.random() < 0.1) particles.push({ x: w.x, y: w.y + w.radius, vx: (w.x - w.oldx)*-0.2, vy: -2, life: 0.5, color: '#FFF', size: 3 });
                }
            });
            
            let wasOnGround = board.onGround; board.onGround = touching > 0;
            if (board.onGround) canDoubleJump = true;

            let currentAngle = Math.atan2(board.w2.y - board.w1.y, board.w2.x - board.w1.x);
            let delta = currentAngle - board.prevAngle;
            while (delta > Math.PI) delta -= Math.PI * 2; while (delta < -Math.PI) delta += Math.PI * 2;
            
            if (!board.onGround) board.accumulatedAngle += delta;
            else if (!wasOnGround) {
                let flips = Math.floor(Math.abs(board.accumulatedAngle) / (Math.PI * 1.8));
                let slope = (getTerrainY(cx+1) - getTerrainY(cx-1))/2, tAngle = Math.atan(slope);
                let rel = currentAngle - tAngle;
                while (rel > Math.PI) rel -= Math.PI * 2; while (rel < -Math.PI) rel += Math.PI * 2;
                if (Math.abs(rel) < Math.PI * 0.4) {
                    if (flips > 0) {
                        let earned = (flips * (flips + 1)) / 2;
                        coins += earned; score += flips * 500; updateScoreDisplay();
                        playSynth('coin', flips); playMappedSfx('collect', 100); triggerGif('reward', 1800); vibrate(flips > 3 ? 'heavy' : 'medium');
                        spawnParticles(cx, cy, '#FFEB3B', 10 * flips);
                        let msg = flips === 1 ? "FLIP!" : (flips === 2 ? "DOUBLE!" : (flips === 3 ? "TRIPLE!" : flips + "X COMBO!"));
                        addPopup(cx, cy - 60, `${msg} +${earned} CREDITS`, flips > 3 ? "#00E5FF" : "#FFEB3B", 1 + flips * 0.2);
                    }
                } else {
                        if (flips > 0 && !stuckInGum && !tiresPopped) { addPopup(cx, cy - 60, "PORTAL RIGHTED!", "#58F5FF"); playSynth('jump'); vibrate('light'); }
                    let cos = Math.cos(tAngle), sin = Math.sin(tAngle), hL = board.length/2;
                    board.w1.x = cx - hL * cos; board.w1.y = cy - hL * sin - 5;
                    board.w2.x = cx + hL * cos; board.w2.y = cy + hL * sin - 5;
                    board.w1.oldx = board.w1.x; board.w1.oldy = board.w1.y;
                    board.w2.oldx = board.w2.x; board.w2.oldy = board.w2.y;
                }
                board.accumulatedAngle = 0;
            }
            board.prevAngle = currentAngle;
            
            customItems.forEach(item => {
                if (!item.active) return;
                let ty = getTerrainY(item.x);
                if (Math.hypot(item.x - cx, ty - cy) < 40 && item.type !== 'metal_spike' && item.type !== 'moving_spike' && item.type !== 'magnet_pickup') {
                    if (item.type === 'gum') {
                        if (!stuckInGum) {
                            stuckInGum = true; gumStruggleCount = 0; activeGumItem = item;
                            playSynth('crash'); playMappedSfx('hazard', 180); triggerGif('danger', 1500); vibrate('heavy');
                            spawnParticles(item.x, ty, '#FF69B4', 20);
                            addPopup(item.x, ty - 40, "GOO! TRICK 5X!", "#FF4FB3", 1.5);
                            let dx = item.x - cx; board.w1.x += dx; board.w2.x += dx;
                            board.w1.oldx = board.w1.x; board.w2.oldx = board.w2.x;
                            board.w1.oldy = board.w1.y; board.w2.oldy = board.w2.y;
                        }
                    } else if (item.type === 'bomb') {
                        playSynth('crash'); playMappedSfx('hazard', 180); triggerGif('danger', 1600); vibrate('heavy');
                        spawnParticles(item.x, ty, '#FF0000', 50); spawnParticles(item.x, ty, '#FFA500', 50);
                        addPopup(item.x, ty - 40, "PLASMA!", "#FF4D57", 2);
                        item.active = false; setTimeout(() => { if (gameState === 'PLAYING') setState('GAMEOVER'); }, 100);
                    } else if (item.type === 'killbrick') {
                        playSynth('crash'); playMappedSfx('hazard', 180); triggerGif('danger', 1600); vibrate('heavy');
                        spawnParticles(item.x, ty, '#FF0000', 50);
                        addPopup(item.x, ty - 40, "VOIDED!", "#FF4D57", 2);
                        setTimeout(() => { if (gameState === 'PLAYING') setState('GAMEOVER'); }, 100);
                    } else if (item.type === 'tire_spike') {
                        if ((!item.cooldown || item.cooldown <= 0) && !tiresPopped) {
                            tiresPopped = true; tirePopTimer = 5.0;
                            playSynth('crash'); playMappedSfx('hazard', 180); triggerGif('danger', 1400); vibrate('heavy');
                            spawnParticles(item.x, ty, '#000000', 30);
                            addPopup(item.x, ty - 40, "WHEELS GLITCHED!", "#FF4D57", 1.5);
                            item.cooldown = 10.0;
                        }
                    } else if (item.type !== 'ice_path') {
                        item.active = false;
                        if (item.type === 'jetpack') {
                            jetpackFuel = 100; playSynth('coin', 2); playMappedSfx('collect', 100); triggerGif('reward', 1400); vibrate('light');
                            spawnParticles(item.x, ty, '#FFEB3B', 20); addPopup(item.x, ty - 20, "PORTAL BOOST!", "#FFEB3B", 1.2); updateHUD();
                        } else if (item.type === 'banana') {
                            let tempX = board.w1.x; board.w1.x = board.w2.x; board.w2.x = tempX;
                            let tempOldX = board.w1.oldx; board.w1.oldx = board.w2.oldx; board.w2.oldx = tempOldX;
                            board.w1.y -= 40; board.w2.y -= 40;
                            board.w1.oldy = board.w1.y + 10; board.w2.oldy = board.w2.y + 10;
                            board.prevAngle += Math.PI; if (board.prevAngle > Math.PI) board.prevAngle -= Math.PI * 2;
                            board.onGround = false;
                            playSynth('crash'); playMappedSfx('hazard', 180); triggerGif('danger', 1500); vibrate('heavy');
                            spawnParticles(item.x, ty, '#FFFF00', 20); addPopup(item.x, ty - 40, "SLUDGE FLIP!", "#FFFF00", 1.5);
                        }
                    }
                }
            });

            let targetX = cx - cw/2, targetY = cy - ch*0.6;
            camera.x += (targetX - camera.x) * 0.1; camera.y += (targetY - camera.y) * 0.1;
            
            if (camera.x + cw > nextSpawnX) {
                let ix = nextSpawnX + 300 + Math.random() * 500;
                let iy = getTerrainY(ix) - 150 - Math.random() * 100;
                collectibles.push({ x: ix, y: iy, active: true, floatOffset: Math.random()*Math.PI*2 });
                nextSpawnX += 1200 + Math.random() * 1000;
            }
            
            collectibles.forEach(item => {
                if (!item.active) return;
                item.floatOffset += dt * 3;
                let drawY = item.y + Math.sin(item.floatOffset) * 15;
                if (Math.hypot(item.x - cx, drawY - cy) < 45) {
                    item.active = false;
                    jetpackFuel = Math.min(100, jetpackFuel + 4);
                    playSynth('coin', 2); playMappedSfx('collect', 100); triggerGif('reward', 1200); vibrate('light');
                    spawnParticles(item.x, drawY, '#FFEB3B', 20);
                    addPopup(item.x, drawY, "+4% PORTAL", "#FFEB3B", 1.2);
                    updateHUD();
                }
            });
            collectibles = collectibles.filter(c => c.active && c.x > camera.x - 200);

            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02; if (p.life <= 0) particles.splice(i, 1); });
            popups.forEach((p, i) => { p.y -= 1; p.life -= 0.015; if (p.life <= 0) popups.splice(i, 1); });
            
            if (board.w1.y > getTerrainY(board.w1.x) + 100) {
                playSynth('crash'); vibrate('heavy'); setState('GAMEOVER');
            } else if (board.onGround && Math.abs(currentAngle) > Math.PI * 0.6 && !stuckInGum && !tiresPopped) {
                let slope = (getTerrainY(cx+1) - getTerrainY(cx-1))/2, tAngle = Math.atan(slope);
                let cos = Math.cos(tAngle), sin = Math.sin(tAngle), hL = board.length/2;
                board.w1.x = cx - hL * cos; board.w1.y = cy - hL * sin - 5;
                board.w2.x = cx + hL * cos; board.w2.y = cy + hL * sin - 5;
                board.w1.oldx = board.w1.x; board.w1.oldy = board.w1.y;
                board.w2.oldx = board.w2.x; board.w2.oldy = board.w2.y;
                board.prevAngle = tAngle;
                board.accumulatedAngle = 0;
                addPopup(cx, cy - 60, "PORTAL RIGHTED!", "#58F5FF");
                playSynth('jump'); vibrate('light');
            }
        }

        function updateScoreDisplay() { 
            document.getElementById('score-display').innerText = score; 
            document.getElementById('coin-display').innerText = coins; 
            document.getElementById('shop-coins-display').innerText = coins;
        }

        // [agent-note][world-design-v4] authored-background: procedural portal lab/multiverse layers replace generic static sky ownership; decorative only.
        function drawPortalBackground() {
            const t = performance.now() * 0.001;
            const grad = ctx.createLinearGradient(0, 0, 0, ch);
            grad.addColorStop(0, currentColors.bg);
            grad.addColorStop(0.56, currentMapIdx === 2 ? '#1a1040' : currentMapIdx === 3 ? '#1d0b2d' : '#081d2a');
            grad.addColorStop(1, currentMapIdx === 3 ? '#071019' : '#050d18');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, cw, ch);

            ctx.save();
            ctx.globalAlpha = 0.14;
            ctx.strokeStyle = '#58F5FF';
            ctx.lineWidth = 1;
            const grid = 48;
            const gx = (-camera.x * 0.05) % grid;
            const gy = (-camera.y * 0.04) % grid;
            for (let x = gx; x < cw + grid; x += grid) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 24, ch); ctx.stroke();
            }
            for (let y = gy; y < ch + grid; y += grid) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y - 12); ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = 0.62;
            ctx.translate((-camera.x * 0.08) % 180, 0);

            if (currentMapIdx === 0) {
                ctx.fillStyle = 'rgba(159, 232, 255, 0.14)';
                for (let x = -220; x < cw + 260; x += 220) {
                    ctx.fillRect(x, ch * 0.15, 118, 38);
                    ctx.fillRect(x + 20, ch * 0.15 - 46, 14, 46);
                    ctx.fillRect(x + 56, ch * 0.15 - 32, 12, 32);
                    ctx.fillStyle = 'rgba(57, 255, 136, 0.13)';
                    ctx.fillRect(x + 10, ch * 0.15 + 9, 94, 5);
                    ctx.fillStyle = 'rgba(159, 232, 255, 0.14)';
                }
                ctx.strokeStyle = 'rgba(88, 245, 255, 0.28)';
                ctx.lineWidth = 2;
                for (let x = -160; x < cw + 260; x += 260) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.bezierCurveTo(x + 40, ch * 0.16, x - 20, ch * 0.32, x + 70, ch * 0.44);
                    ctx.stroke();
                    ctx.save();
                    ctx.translate(x + 94, ch * 0.12 + Math.sin(t + x) * 3);
                    ctx.strokeStyle = 'rgba(57, 255, 136, 0.34)';
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(0, 0, 20, Math.PI * 0.12, Math.PI * 1.78); ctx.stroke();
                    ctx.restore();
                }
            } else if (currentMapIdx === 1) {
                for (let x = -180; x < cw + 240; x += 210) {
                    ctx.fillStyle = 'rgba(57, 255, 136, 0.12)';
                    ctx.fillRect(x, ch * 0.18, 150, 28);
                    ctx.fillStyle = 'rgba(255, 79, 179, 0.2)';
                    ctx.fillRect(x + 18, ch * 0.18 + 6 + Math.sin(t * 5 + x) * 2, 64, 9);
                    ctx.fillStyle = 'rgba(255, 228, 90, 0.15)';
                    ctx.fillRect(x + 96, ch * 0.18 + 5, 22, 12);
                    ctx.fillStyle = 'rgba(57, 255, 136, 0.10)';
                    ctx.beginPath(); ctx.ellipse(x + 76, ch * 0.32, 46, 10 + Math.sin(t + x) * 3, 0, 0, Math.PI * 2); ctx.fill();
                }
            } else if (currentMapIdx === 2) {
                for (let x = -160; x < cw + 220; x += 150) {
                    ctx.fillStyle = x % 300 === 0 ? 'rgba(255, 228, 90, 0.16)' : 'rgba(255, 79, 179, 0.14)';
                    ctx.fillRect(x, ch * 0.16, 78, 100);
                    ctx.fillStyle = 'rgba(88, 245, 255, 0.22)';
                    ctx.fillRect(x + 12, ch * 0.19 + Math.sin(t * 2 + x) * 3, 54, 28);
                    ctx.fillStyle = 'rgba(5, 7, 15, 0.35)';
                    ctx.fillRect(x + 12, ch * 0.25, 54, 8);
                }
                ctx.strokeStyle = `rgba(255, 77, 87, ${0.16 + Math.sin(t * 2) * 0.06})`;
                ctx.lineWidth = 9;
                for (let y = ch * 0.18; y < ch * 0.56; y += 88) {
                    ctx.beginPath(); ctx.moveTo(-220, y); ctx.lineTo(cw + 220, y + Math.sin(t + y) * 18); ctx.stroke();
                }
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
                for (let x = -200; x < cw + 260; x += 120) {
                    const h = 90 + Math.abs((x * 7) % 90);
                    ctx.fillRect(x, ch * 0.25 - h * 0.22, 72, h);
                    ctx.strokeStyle = 'rgba(57, 255, 136, 0.2)';
                    ctx.beginPath();
                    ctx.moveTo(x + 8, ch * 0.24 - h * 0.16);
                    ctx.lineTo(x + 62, ch * 0.24 + h * 0.42);
                    ctx.stroke();
                }
                ctx.fillStyle = `rgba(255, 139, 50, ${0.08 + Math.sin(t * 3) * 0.03})`;
                for (let x = -80; x < cw + 120; x += 96) {
                    ctx.fillRect(x + Math.sin(t + x) * 7, 0, 4, ch * 0.52);
                }
            }
            ctx.restore();

            const portalCount = currentMapIdx === 3 ? 6 : 4;
            for (let i = 0; i < portalCount; i++) {
                const px = ((i * 230 - camera.x * 0.16 + t * (18 + i * 2)) % (cw + 320)) - 160;
                const py = ch * (0.14 + (i % 3) * 0.15);
                const r = 30 + (i % 2) * 18 + Math.sin(t * 1.6 + i) * 3;
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(t * 0.42 + i);
                ctx.globalAlpha = 0.48;
                ctx.strokeStyle = i % 2 ? '#58F5FF' : '#39FF88';
                ctx.lineWidth = 5;
                for (let ring = 0; ring < 3; ring++) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r + ring * 8, (r + ring * 8) * 0.55, ring * 0.14, 0, Math.PI * 1.72);
                    ctx.stroke();
                }
                ctx.globalAlpha = 0.13;
                ctx.lineWidth = 18;
                ctx.beginPath();
                ctx.ellipse(0, 0, r + 5, r * 0.62, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            ctx.fillStyle = currentColors.dots;
            ctx.globalAlpha = 0.5;
            for(let x = (-camera.x*0.3)%80-80; x < cw+80; x+=80) {
                for(let y = (-camera.y*0.3)%80-80; y < ch+80; y+=80) {
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5 + Math.sin(t * 2 + x * 0.02 + y * 0.02), 0, Math.PI*2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
        }

        function draw() {
            drawPortalBackground();
            ctx.save(); ctx.translate(-camera.x, -camera.y);
            
            let sX = Math.floor(camera.x/10)*10-20, eX = sX+cw+40, bY = camera.y+ch+200;
            ctx.beginPath(); ctx.moveTo(sX, bY);
            for (let x = sX; x <= eX; x += 10) ctx.lineTo(x, getTerrainY(x));
            ctx.lineTo(eX, bY); ctx.closePath(); ctx.fillStyle = terrainPattern; ctx.fill();
            ctx.beginPath(); for (let x = sX; x <= eX; x += 10) { if(x===sX) ctx.moveTo(x, getTerrainY(x)); else ctx.lineTo(x, getTerrainY(x)); }
            ctx.lineWidth = 10; ctx.strokeStyle = '#000'; ctx.stroke();
            
            customItems.forEach(item => {
                if (!item.active && gameState !== 'EDITOR') return;
                let ty = getTerrainY(item.x);
                ctx.save(); 
                
                if (item.type === 'metal_spike') {
                    ctx.translate(item.x, item.y);
                } else {
                    ctx.translate(item.x, ty - 15);
                }

                if (!item.active) ctx.globalAlpha = 0.3;
                
                if (item.type === 'jetpack') {
                    ctx.fillStyle = '#FF4FB3'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.roundRect(-12, -18, 24, 36, 6); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#39FF88'; ctx.beginPath(); ctx.roundRect(-6, -12, 12, 24, 5); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#58F5FF'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.strokeStyle = 'rgba(57,255,136,0.85)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(0, 0, 18, Math.PI * 0.15, Math.PI * 1.85); ctx.stroke();
                } else if (item.type === 'banana') {
                    ctx.translate(0, 8);
                    ctx.fillStyle = '#FFE45A'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.ellipse(0, 0, 22, 10, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#39FF88'; ctx.beginPath(); ctx.ellipse(-8, -2, 8, 4, -0.4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#FF4FB3'; ctx.beginPath(); ctx.arc(12, -2, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                } else if (item.type === 'gum') {
                    ctx.translate(0, 10);
                    ctx.fillStyle = '#FF4FB3'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.ellipse(0, 0, 24, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#FFA6D9'; ctx.beginPath(); ctx.ellipse(-6, -4, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#39FF88'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(9, -1, 7, Math.PI * 0.2, Math.PI * 1.7); ctx.stroke();
                } else if (item.type === 'bomb') {
                    ctx.translate(0, 8);
                    ctx.fillStyle = '#111827'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.strokeStyle = '#FF8B32'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI * 0.1, Math.PI * 1.65); ctx.stroke();
                    ctx.fillStyle = '#39FF88'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath(); ctx.arc(13, -18, 4 + Math.sin(Date.now()*0.02)*2, 0, Math.PI * 2); ctx.fill();
                } else if (item.type === 'killbrick') {
                    ctx.translate(0, 5);
                    ctx.fillStyle = '#FF0000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
                    ctx.fillRect(-15, -20, 30, 30); ctx.strokeRect(-15, -20, 30, 30);
                    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '20px "Bangers"'; ctx.fillText('X', 0, -5);
                } else if (item.type === 'ice_path') {
                    ctx.translate(0, 15);
                    ctx.fillStyle = 'rgba(150, 240, 255, 0.7)'; ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.ellipse(0, 0, 80, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                } else if (item.type === 'tire_spike') {
                    ctx.translate(0, 15);
                    ctx.fillStyle = (item.cooldown > 0) ? '#444' : '#888';
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(0, -20); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                } else if (item.type === 'moving_spike') {
                    let spikeY = -5 + Math.sin(Date.now() / 400 + item.x) * 80;
                    ctx.translate(0, spikeY);
                    ctx.fillStyle = '#FF8C00'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
                    ctx.fillRect(-20, 0, 40, 10); ctx.strokeRect(-20, 0, 40, 10);
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(0, -20); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                } else if (item.type === 'magnet_pickup') {
                    ctx.translate(0, 5 + Math.sin(Date.now()/200)*5);
                    ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 8;
                    ctx.beginPath(); ctx.arc(0, -5, 12, Math.PI, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-12, 5); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(12, -5); ctx.lineTo(12, 5); ctx.stroke();
                    ctx.strokeStyle = 'silver';
                    ctx.beginPath(); ctx.moveTo(-12, 5); ctx.lineTo(-12, 10); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(12, 5); ctx.lineTo(12, 10); ctx.stroke();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(0, -5, 16, Math.PI, 0); ctx.stroke();
                } else if (item.type === 'metal_spike') {
                    ctx.fillStyle = 'silver'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(0, -25); ctx.lineTo(12, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(5, -5); ctx.lineTo(0, -5); ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            });

            collectibles.forEach(item => {
                if (!item.active) return;
                let drawY = item.y + Math.sin(item.floatOffset) * 15;
                ctx.save(); ctx.translate(item.x, drawY);
                ctx.rotate(Math.sin(item.floatOffset) * 0.08);
                ctx.fillStyle = '#FF4FB3'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.roundRect(-12, -20, 24, 40, 7); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#39FF88'; ctx.beginPath(); ctx.roundRect(-7, -14, 14, 28, 5); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#58F5FF'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = 'rgba(57,255,136,0.85)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.ellipse(0, 0, 24, 14, item.floatOffset * 0.2, 0, Math.PI * 1.8); ctx.stroke();
                ctx.restore();
            });

            if (currentMapIdx === 3) {
                mapState.lava.forEach(l => {
                    ctx.fillStyle = '#FF4500'; ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(l.x, l.y, l.r*0.5, 0, Math.PI*2); ctx.fill();
                });
            }

            particles.forEach(p => { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.size*p.life), 0, Math.PI*2); ctx.fill(); ctx.stroke(); });
            
            let cx = (board.w1.x + board.w2.x)/2, cy = (board.w1.y + board.w2.y)/2, angle = Math.atan2(board.w2.y - board.w1.y, board.w2.x - board.w1.x);
            
            if (magnetActive && playerHasMagnet) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.strokeStyle = `rgba(0, 229, 255, ${0.5 + Math.sin(Date.now()/50)*0.3})`;
                ctx.lineWidth = 3;
                for(let i=1; i<=3; i++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 50 * i + (Date.now()%500)/10, 0, Math.PI*2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
            
            if (jetpackFuel > 0) {
                ctx.fillStyle = '#FF007F'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.roundRect(-25, -20, 14, 20, 4); ctx.fill(); ctx.stroke();
            }

            if (playerHasMagnet) {
                ctx.fillStyle = '#FF0000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(15, -15, 6, Math.PI, 0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(9, -15); ctx.lineTo(9, -10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(21, -15); ctx.lineTo(21, -10); ctx.stroke();
            }

            ctx.fillStyle = skaterColor; ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.roundRect(-30, -6, 60, 12, 6); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#000'; ctx.fillRect(-20, -6, 40, 4);
            ctx.fillStyle = '#FFE45A'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(-5, -24, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#7B4B2A';
            ctx.beginPath(); ctx.moveTo(-13, -30); ctx.lineTo(-2, -36); ctx.lineTo(6, -29); ctx.lineTo(0, -25); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#58F5FF'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(-13, -16, 16, 18, 4); ctx.fill(); ctx.stroke();
            
            const drawW = (ox) => {
                ctx.save(); ctx.translate(ox, 10); ctx.rotate((cx+ox)*0.05);
                if (tiresPopped) {
                    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(0, 3, 10, 4, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                } else {
                    ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(3, 0, 3, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            };
            drawW(-20); drawW(20); 

            ctx.restore();
            
            ctx.textAlign = 'center'; ctx.font = '32px "Bangers"';
            popups.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.life; ctx.translate(p.x, p.y); ctx.scale(p.scale, p.scale);
                ctx.fillStyle = p.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
                ctx.strokeText(p.text, 0, 0); ctx.fillText(p.text, 0, 0); ctx.restore();
            });
            ctx.restore();
        }

        function gameLoop(ts) {
            let dt = Math.min((ts - lastTime)/1000, 0.05); lastTime = ts;
            if (gameState === 'PLAYING') { 
                updatePhysics(dt); 
                if (board.onGround && Math.abs(board.w1.x - board.w1.oldx) > 1 && !stuckInGum && !tiresPopped && currentMapIdx !== 1) { score++; updateScoreDisplay(); } 
                else if (board.onGround && Math.abs(board.w1.x - board.w1.oldx) > 1 && currentMapIdx === 1) { score++; updateScoreDisplay(); } 
            }
            draw(); animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
