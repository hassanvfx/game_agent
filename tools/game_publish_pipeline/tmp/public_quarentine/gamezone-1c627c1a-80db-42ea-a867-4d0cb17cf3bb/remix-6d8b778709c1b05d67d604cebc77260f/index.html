<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Orbital Fusion Bay</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json (Orbitron + Rajdhani) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #060816;
            --bg-bottom: #120f2f;
            --panel: rgba(10, 16, 34, 0.72);
            --panel-strong: rgba(17, 26, 50, 0.88);
            --panel-border: rgba(120, 208, 255, 0.3);
            --panel-danger: rgba(255, 123, 146, 0.38);
            --text-main: #eff7ff;
            --text-soft: #9cbfe1;
            --accent: #78d0ff;
            --accent-strong: #54a6ff;
            --accent-warm: #7ef2ff;
            --danger: #ff6b87;
            --shadow: rgba(0, 0, 0, 0.46);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(84, 166, 255, 0.14), transparent 30%),
                radial-gradient(circle at 20% 20%, rgba(126, 242, 255, 0.16), transparent 22%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(120, 208, 255, 0.18), transparent 16%),
                radial-gradient(circle at 82% 22%, rgba(255, 107, 135, 0.14), transparent 18%),
                radial-gradient(circle at 52% 84%, rgba(126, 242, 255, 0.09), transparent 18%);
        }

        #game-container::after {
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.55) 0 1px, transparent 1.5px),
                radial-gradient(circle, rgba(120, 208, 255, 0.35) 0 1px, transparent 1.8px);
            background-size: 140px 140px, 220px 220px;
            background-position: 0 0, 50px 60px;
            opacity: 0.45;
        }

        #danger-line {
            position: absolute;
            top: 15%;
            left: 0;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 10px,
                rgba(255, 107, 135, 0.58) 10px,
                rgba(255, 107, 135, 0.58) 20px
            );
            pointer-events: none;
            z-index: 1;
            display: none;
            box-shadow: 0 0 18px rgba(255, 107, 135, 0.4);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            padding: 16px;
        }

        .panel {
            pointer-events: auto;
            position: relative;
            max-width: min(92vw, 460px);
            width: 100%;
            padding: 28px 22px 24px;
            border-radius: 28px;
            text-align: center;
            background: linear-gradient(180deg, rgba(17, 26, 50, 0.9), rgba(8, 13, 28, 0.9));
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 50px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 24px rgba(84, 166, 255, 0.15);
            overflow: hidden;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(126, 242, 255, 0.18), transparent 38%),
                radial-gradient(circle at top right, rgba(120, 208, 255, 0.15), transparent 32%);
            pointer-events: none;
        }

        .panel-start {
            border-top: 4px solid var(--accent-strong);
        }

        .panel-over {
            border-top: 4px solid var(--danger);
            border-color: var(--panel-danger);
        }

        .title {
            position: relative;
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2rem, 8vw, 3.4rem);
            line-height: 0.96;
            letter-spacing: 0.08em;
            color: #f9fdff;
            text-transform: uppercase;
            text-shadow:
                0 0 10px rgba(126, 242, 255, 0.35),
                0 0 24px rgba(84, 166, 255, 0.4);
        }

        .subtitle {
            position: relative;
            margin: 0 0 24px;
            font-size: clamp(0.98rem, 3.6vw, 1.15rem);
            line-height: 1.45;
            color: var(--text-soft);
        }

        .status-heading {
            position: relative;
            margin: 0 0 8px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.9rem, 7vw, 2.8rem);
            letter-spacing: 0.06em;
            color: #ffb7c2;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(255, 107, 135, 0.32);
        }

        .status-text {
            position: relative;
            margin: 0 0 8px;
            font-size: 1rem;
            color: var(--text-soft);
        }

        .final-score {
            position: relative;
            margin: 0 0 22px;
            font-size: clamp(1.55rem, 5vw, 2.35rem);
            font-weight: 600;
            color: var(--text-main);
        }

        .action-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            width: 100%;
            max-width: 260px;
            border: none;
            border-radius: 999px;
            padding: 14px 20px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.95rem, 3.5vw, 1.05rem);
            letter-spacing: 0.04em;
            color: #f8fdff;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.06);
            outline: none;
        }

        .action-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .action-btn-primary {
            background: linear-gradient(135deg, #2b74ff, #45b8ff 60%, #7ef2ff);
            box-shadow: 0 10px 30px rgba(69, 184, 255, 0.32);
        }

        .action-btn-secondary {
            background: linear-gradient(135deg, #ff7b92, #ff5e74);
            box-shadow: 0 10px 30px rgba(255, 94, 116, 0.28);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: 14px;
            left: 14px;
            display: none;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            min-width: min(64vw, 240px);
            pointer-events: none;
        }

        .hud-card {
            display: inline-flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 14px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(13, 21, 42, 0.78), rgba(8, 13, 27, 0.88));
            border: 1px solid rgba(120, 208, 255, 0.26);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hud-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: rgba(156, 191, 225, 0.82);
        }

        .hud-score-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .hud-score-value {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.15rem, 4.4vw, 1.55rem);
            color: #f5fbff;
            text-shadow: 0 0 14px rgba(84, 166, 255, 0.24);
        }

        .hud-score-accent {
            color: var(--accent-warm);
        }

        .hud-feedback {
            margin-top: 8px;
            min-height: 112px;
            display: grid;
            place-items: center;
        }

        .feedback-gif {
            width: min(44vw, 150px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(120, 208, 255, 0.28);
            background: rgba(9, 14, 26, 0.68);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            opacity: 0;
            transform: scale(0.88);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.active {
            opacity: 0.96;
            transform: scale(1);
        }

        .feedback-caption {
            margin-top: 6px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(239, 247, 255, 0.8);
            text-align: center;
        }

        .hud-next-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
            color: var(--text-soft);
        }

        .next-ball-preview {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.18),
                0 0 14px rgba(126, 242, 255, 0.24);
            flex-shrink: 0;
        }

        .hud-tip {
            font-size: 0.76rem;
            color: rgba(156, 191, 225, 0.74);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 12px;
            }

            .panel {
                padding: 24px 18px 20px;
                border-radius: 24px;
            }

            #hud {
                top: 10px;
                left: 10px;
                min-width: 0;
                max-width: calc(100vw - 20px);
            }

            .hud-card {
                padding: 10px 12px;
                border-radius: 16px;
            }

            .hud-next-row {
                font-size: 0.84rem;
            }

            .hud-tip {
                font-size: 0.72rem;
            }

            .feedback-gif {
                width: min(38vw, 116px);
                border-radius: 14px;
            }

            .feedback-caption {
                font-size: 0.64rem;
            }

            .action-btn {
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="danger-line"></div>

        <div id="ui-layer">
            <!-- [agent-note][stage4] repaired: mobile-tap-risk | element: body/canvas | action: native button taps preserved, gesture suppression scoped to gameplay surface -->
            <div id="start-screen" class="panel panel-start">
                <h1 class="title">Orbital Fusion Bay</h1>
                <p class="subtitle">Guide glowing star cores into the bay, fuse matching colors, and keep the stack below the overload rail.</p>
                <button id="start-btn" class="action-btn action-btn-primary">Begin Shift</button>
            </div>

            <div id="game-over-screen" class="panel panel-over hidden">
                <h2 class="status-heading">Bay Overload</h2>
                <div class="status-text">The fusion stack crossed the safety line.</div>
                <div class="final-score">Fusion Score: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="action-btn action-btn-secondary">Run It Back</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-card">
                    <div class="hud-label">Fusion Score</div>
                    <div class="hud-score-row">
                        <span id="score" class="hud-score-value hud-score-accent">0</span>
                        <span class="hud-score-value">PTS</span>
                    </div>
                    <div class="hud-next-row">
                        <span>Next Core</span>
                        <span id="next-ball-preview" class="next-ball-preview"></span>
                    </div>
                    <!-- [agent-note][stage3] resolved-gif: merge-warning reactions -> catalogs/gifs.json -->
                    <div class="hud-feedback">
                        <img id="feedback-gif" class="feedback-gif" alt="Fusion status reaction" />
                    </div>
                    <div id="feedback-caption" class="feedback-caption">Bay Calm</div>
                    <div class="hud-tip">Drag, tap, and drop with one thumb.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                drop: "https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3",
                merge: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"
            },
            gifs: {
                merge: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                danger: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const WORLD_THEME = {
            bgGlow: ['#78d0ff', '#7ef2ff', '#ff7b92'],
            dropBeam: '#b7ecff',
            hazard: '#ff6b87',
            previewRing: '#ecfbff'
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.started = false;
                this.lastPlayTimes = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(v);
                    sample.preload = 'auto';
                    this.sfx[k] = sample;
                }
            }

            unlock() {
                this.enabled = true;
                this.started = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(sample => sample.load());
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, debounceMs = 100) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayTimes[key] && now - this.lastPlayTimes[key] < debounceMs) return;
                this.lastPlayTimes[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = {
                    drop: 0.34,
                    merge: 0.58,
                    warning: 0.48,
                    fail: 0.72,
                    start: 0.5,
                    restart: 0.44
                }[key] ?? 0.45;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME CONFIG & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const feedbackGif = document.getElementById('feedback-gif');
        const feedbackCaption = document.getElementById('feedback-caption');
        let width, height;
        let gameActive = false;
        let score = 0;
        let mouseX = 0;
        let isMouseDown = false;
        let gameOverTimer = 0;
        let warningCueArmed = true;
        let feedbackTimeout = null;

        function showFeedback(mode = 'calm') {
            const config = {
                calm: { src: '', label: 'Bay Calm' },
                merge: { src: ASSETS.gifs.merge, label: 'Fusion Pulse' },
                danger: { src: ASSETS.gifs.danger, label: 'Overload Risk' }
            }[mode];

            feedbackGif.classList.remove('active');

            if (!config.src) {
                feedbackGif.removeAttribute('src');
                feedbackCaption.textContent = config.label;
                return;
            }

            feedbackGif.src = config.src;
            feedbackCaption.textContent = config.label;
            requestAnimationFrame(() => feedbackGif.classList.add('active'));

            clearTimeout(feedbackTimeout);
            if (mode !== 'danger') {
                feedbackTimeout = setTimeout(() => showFeedback('calm'), 1400);
            }
        }

        const starfield = Array.from({ length: 36 }, () => ({
            x: Math.random(),
            y: Math.random(),
            size: 1 + Math.random() * 2.4,
            speed: 0.1 + Math.random() * 0.25,
            alpha: 0.18 + Math.random() * 0.4
        }));

        // Physics Constants
        const GRAVITY = 0.5;
        const FRICTION = 0.98; // Air resistance / Rolling friction
        const BOUNCE = 0.4; // Restitution
        const SUBSTEPS = 8; // Physics iterations per frame for stability

        // Ball Types (Radius increases, color changes)
        const BALL_TYPES = [
            { r: 15, color: '#67b7ff', glow: '#cdeaff', score: 10, icon: '✦' },
            { r: 25, color: '#62e4ca', glow: '#cffff5', score: 20, icon: '✧' },
            { r: 35, color: '#ff7fbd', glow: '#ffd7ee', score: 40, icon: '✹' },
            { r: 45, color: '#ffc95b', glow: '#fff0b8', score: 80, icon: '✷' },
            { r: 60, color: '#a99aff', glow: '#ede8ff', score: 160, icon: '✺' },
            { r: 75, color: '#ff7b92', glow: '#ffd6df', score: 320, icon: '✦' },
            { r: 95, color: '#40e2ff', glow: '#ddfbff', score: 640, icon: '✹' },
            { r: 120, color: '#ff8eff', glow: '#ffe0ff', score: 1280, icon: '✪' }
        ];

        let balls = []; // Active balls in the pit
        let particles = []; // Explosion particles
        let nextBallType = 0;
        let dropCooldown = 0;
        let currentDropperX = 0;

        /** 4. RESIZE HANDLER */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (!gameActive) currentDropperX = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 5. INPUT HANDLING */
        canvas.addEventListener('pointermove', (e) => {
            if (!gameActive) return;
            mouseX = e.clientX;
            currentDropperX = Math.max(BALL_TYPES[nextBallType].r, Math.min(width - BALL_TYPES[nextBallType].r, mouseX));
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            isMouseDown = true;
            mouseX = e.clientX;
            currentDropperX = Math.max(BALL_TYPES[nextBallType].r, Math.min(width - BALL_TYPES[nextBallType].r, mouseX));
            tryDropBall();
        });

        /** 6. PHYSICS ENGINE */
        class Ball {
            constructor(x, y, typeIdx) {
                this.x = x;
                this.y = y;
                this.typeIdx = typeIdx;
                this.radius = BALL_TYPES[typeIdx].r;
                this.color = BALL_TYPES[typeIdx].color;
                this.glow = BALL_TYPES[typeIdx].glow;
                this.icon = BALL_TYPES[typeIdx].icon;
                this.vx = 0;
                this.vy = 0;
                this.mass = this.radius;
                this.markedForDeletion = false;
                this.isStatic = false;
            }

            update() {
                if (this.isStatic) return;

                this.vy += GRAVITY;
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = -this.vx * BOUNCE;
                } else if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx = -this.vx * BOUNCE;
                }

                if (this.y + this.radius > height) {
                    this.y = height - this.radius;
                    this.vy = -this.vy * BOUNCE;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

                const grad = ctx.createRadialGradient(
                    this.x - this.radius / 3,
                    this.y - this.radius / 3,
                    this.radius / 10,
                    this.x,
                    this.y,
                    this.radius
                );
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.18, this.glow);
                grad.addColorStop(0.48, this.color);
                grad.addColorStop(1, adjustColor(this.color, -48));

                ctx.shadowColor = this.color;
                ctx.shadowBlur = Math.max(12, this.radius * 0.38);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.lineWidth = 2.5;
                ctx.strokeStyle = 'rgba(255,255,255,0.36)';
                ctx.stroke();

                ctx.globalAlpha = 0.55;
                ctx.beginPath();
                ctx.arc(this.x - this.radius / 3.2, this.y - this.radius / 3.2, this.radius / 4.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.globalAlpha = 0.24;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.62, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1.5, this.radius * 0.06);
                ctx.stroke();

                ctx.globalAlpha = 0.75;
                ctx.fillStyle = 'rgba(7, 16, 32, 0.38)';
                ctx.beginPath();
                ctx.arc(this.x + this.radius * 0.18, this.y + this.radius * 0.2, this.radius * 0.54, 0.1, Math.PI + 0.2);
                ctx.fill();

                ctx.globalAlpha = 0.82;
                ctx.fillStyle = '#f9fdff';
                ctx.font = `${Math.max(12, this.radius * 0.5)}px Orbitron`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, this.x, this.y + 1);
                ctx.restore();
            }
        }

        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, value => (
                '0' + Math.min(255, Math.max(0, parseInt(value, 16) + amount)).toString(16)
            ).slice(-2));
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.03;
                this.size = 2 + Math.random() * 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawBackdrop() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#060816');
            gradient.addColorStop(0.58, '#120f2f');
            gradient.addColorStop(1, '#050711');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const haloTop = ctx.createRadialGradient(width * 0.5, height * 0.12, 10, width * 0.5, height * 0.12, width * 0.6);
            haloTop.addColorStop(0, 'rgba(84, 166, 255, 0.18)');
            haloTop.addColorStop(0.35, 'rgba(84, 166, 255, 0.08)');
            haloTop.addColorStop(1, 'rgba(84, 166, 255, 0)');
            ctx.fillStyle = haloTop;
            ctx.fillRect(0, 0, width, height);

            const bayGlow = ctx.createRadialGradient(width * 0.5, height * 0.78, 30, width * 0.5, height * 0.78, width * 0.75);
            bayGlow.addColorStop(0, 'rgba(126, 242, 255, 0.09)');
            bayGlow.addColorStop(0.35, 'rgba(126, 242, 255, 0.04)');
            bayGlow.addColorStop(1, 'rgba(126, 242, 255, 0)');
            ctx.fillStyle = bayGlow;
            ctx.fillRect(0, 0, width, height);

            starfield.forEach((star, index) => {
                const drift = (Date.now() * 0.00004 * star.speed) % 1;
                const sx = (star.x * width + Math.sin(Date.now() * 0.0005 + index) * 6 + width) % width;
                const sy = (star.y * height + drift * height) % height;
                ctx.globalAlpha = star.alpha + Math.sin(Date.now() * 0.0012 + index) * 0.08;
                ctx.fillStyle = index % 4 === 0 ? 'rgba(126, 242, 255, 0.95)' : 'rgba(255, 255, 255, 0.92)';
                ctx.beginPath();
                ctx.arc(sx, sy, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawBayFrame(dangerY) {
            ctx.save();
            const wallGradient = ctx.createLinearGradient(0, 0, width, 0);
            wallGradient.addColorStop(0, 'rgba(120, 208, 255, 0.13)');
            wallGradient.addColorStop(0.5, 'rgba(126, 242, 255, 0.03)');
            wallGradient.addColorStop(1, 'rgba(255, 123, 146, 0.13)');
            ctx.fillStyle = wallGradient;
            ctx.fillRect(0, dangerY, width, height - dangerY);

            ctx.strokeStyle = 'rgba(120, 208, 255, 0.18)';
            ctx.lineWidth = 4;
            ctx.strokeRect(6, dangerY + 10, width - 12, height - dangerY - 16);

            ctx.strokeStyle = 'rgba(126, 242, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let y = dangerY + 40; y < height; y += 80) {
                ctx.beginPath();
                ctx.moveTo(12, y);
                ctx.lineTo(width - 12, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function resolveCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distSq = dx * dx + dy * dy;
                    const minDist = b1.radius + b2.radius;

                    if (distSq < minDist * minDist) {
                        const dist = Math.sqrt(distSq) || 0.0001;
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        const totalMass = b1.mass + b2.mass;
                        const m1Ratio = b2.mass / totalMass;
                        const m2Ratio = b1.mass / totalMass;

                        b1.x -= nx * overlap * m1Ratio;
                        b1.y -= ny * overlap * m1Ratio;
                        b2.x += nx * overlap * m2Ratio;
                        b2.y += ny * overlap * m2Ratio;

                        const dvx = b2.vx - b1.vx;
                        const dvy = b2.vy - b1.vy;
                        const velAlongNormal = dvx * nx + dvy * ny;

                        if (velAlongNormal > 0) continue;

                        let jVal = -(1 + BOUNCE) * velAlongNormal;
                        jVal /= (1 / b1.mass + 1 / b2.mass);

                        const impulseX = jVal * nx;
                        const impulseY = jVal * ny;

                        b1.vx -= impulseX / b1.mass;
                        b1.vy -= impulseY / b1.mass;
                        b2.vx += impulseX / b2.mass;
                        b2.vy += impulseY / b2.mass;

                        if (b1.typeIdx === b2.typeIdx && !b1.markedForDeletion && !b2.markedForDeletion) {
                            if (b1.typeIdx < BALL_TYPES.length - 1) {
                                b1.markedForDeletion = true;
                                b2.markedForDeletion = true;

                                const midX = (b1.x + b2.x) / 2;
                                const midY = (b1.y + b2.y) / 2;

                                createMergedBall(midX, midY, b1.typeIdx + 1);

                                score += BALL_TYPES[b1.typeIdx].score;
                                document.getElementById('score').innerText = score;

                                audio.playSFX('merge', 120);
                                showFeedback('merge');

                                for (let p = 0; p < 10; p++) {
                                    particles.push(new Particle(midX, midY, BALL_TYPES[b1.typeIdx + 1].color));
                                }
                            }
                        }
                    }
                }
            }
        }

        function createMergedBall(x, y, typeIdx) {
            setTimeout(() => {
                const newBall = new Ball(x, y, typeIdx);
                newBall.vy = -2;
                balls.push(newBall);
            }, 0);
        }

        function tryDropBall() {
            if (dropCooldown > 0) return;

            const type = nextBallType;
            const spawnY = 50;

            const b = new Ball(currentDropperX, spawnY, type);
            balls.push(b);
            audio.playSFX('drop', 70);

            dropCooldown = 30;
            nextBallType = Math.floor(Math.random() * 3);

            const preview = document.getElementById('next-ball-preview');
            preview.style.backgroundColor = BALL_TYPES[nextBallType].color;
            preview.style.boxShadow = `0 0 0 2px rgba(255,255,255,0.18), 0 0 14px ${BALL_TYPES[nextBallType].color}`;
        }

        function checkGameOver() {
            const dangerY = height * 0.15;
            let overLine = false;

            for (const b of balls) {
                if (b.y - b.radius < dangerY && Math.abs(b.vy) < 0.5 && Math.abs(b.vx) < 0.5) {
                    overLine = true;
                    break;
                }
            }

            if (overLine) {
                gameOverTimer++;
                if (warningCueArmed && gameOverTimer > 24) {
                    audio.playSFX('warning', 800);
                    showFeedback('danger');
                    warningCueArmed = false;
                }
                ctx.save();
                ctx.fillStyle = `rgba(255, 50, 90, ${Math.min(0.38, gameOverTimer / 110)})`;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
            } else {
                gameOverTimer = Math.max(0, gameOverTimer - 2);
                warningCueArmed = true;
                if (gameOverTimer === 0) {
                    showFeedback('calm');
                }
            }

            if (gameOverTimer > 180) {
                gameOver();
            }
        }

        /** 7. GAME LOOP */
        function initGame() {
            balls = [];
            particles = [];
            score = 0;
            gameOverTimer = 0;
            dropCooldown = 0;
            nextBallType = 0;
            currentDropperX = width / 2;
            warningCueArmed = true;
            showFeedback('calm');
            document.getElementById('score').innerText = '0';
            document.getElementById('danger-line').style.display = 'block';

            const preview = document.getElementById('next-ball-preview');
            preview.style.backgroundColor = BALL_TYPES[0].color;
            preview.style.boxShadow = `0 0 0 2px rgba(255,255,255,0.18), 0 0 14px ${BALL_TYPES[0].color}`;
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawBackdrop();

            const dangerY = height * 0.15;
            drawBayFrame(dangerY);

            ctx.beginPath();
            ctx.moveTo(0, dangerY);
            ctx.lineTo(width, dangerY);
            ctx.strokeStyle = `rgba(255, 107, 135, ${0.38 + (Math.sin(Date.now() / 220) * 0.18)})`;
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(255, 107, 135, 0.5)';
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.moveTo(currentDropperX, 0);
            ctx.lineTo(currentDropperX, dangerY - 20);
            ctx.strokeStyle = 'rgba(183, 236, 255, 0.36)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            if (dropCooldown <= 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(currentDropperX, 50, BALL_TYPES[nextBallType].r, 0, Math.PI * 2);
                ctx.fillStyle = BALL_TYPES[nextBallType].color + '66';
                ctx.shadowColor = BALL_TYPES[nextBallType].color;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.strokeStyle = WORLD_THEME.previewRing;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#f9fdff';
                ctx.globalAlpha = 0.8;
                ctx.font = `${Math.max(12, BALL_TYPES[nextBallType].r * 0.5)}px Orbitron`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(BALL_TYPES[nextBallType].icon, currentDropperX, 51);
                ctx.restore();
            }

            for (let s = 0; s < SUBSTEPS; s++) {
                balls.forEach(b => b.update());
                resolveCollisions();
            }

            balls = balls.filter(b => !b.markedForDeletion);
            balls.forEach(b => b.draw(ctx));

            particles.forEach((p, i) => {
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            });

            if (dropCooldown > 0) dropCooldown--;
            checkGameOver();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 400);
            showFeedback('danger');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('danger-line').style.display = 'none';
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 8. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!audio.started) {
                audio.unlock();
            }
            audio.playSFX('start', 200);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            if (!audio.started) {
                audio.unlock();
            }
            audio.playSFX('restart', 200);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
