<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal Closet Remix Studio</title>
    <!-- [agent-note][stage3] resolved-font: title/display -> Audiowide | ui/body -> Exo 2 | icons -> Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <style>
        :root {
            --bg: #07140f;
            --bg-deep: #020806;
            --grid: rgba(99, 255, 72, 0.16);
            --panel: rgba(12, 31, 28, 0.8);
            --panel-solid: rgba(14, 37, 31, 0.96);
            --text-dark: #f1ffe8;
            --text-mid: #a8ff8f;
            --text-soft: #79bda1;
            --accent: #63ff48;
            --accent-dark: #16c44a;
            --accent-soft: rgba(99, 255, 72, 0.15);
            --accent-secondary: #31d7ff;
            --warning: #ffe66d;
            --button-soft: rgba(255, 255, 255, 0.08);
            --shadow-lg: 0 18px 36px rgba(0, 0, 0, 0.34);
            --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.28);
            --radius-xl: 18px;
            --radius-2xl: 24px;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(99, 255, 72, 0.2), transparent 32%),
                radial-gradient(circle at bottom, rgba(49, 215, 255, 0.16), transparent 36%),
                linear-gradient(180deg, #10251e 0%, var(--bg) 46%, var(--bg-deep) 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            color: var(--text-dark);
            background-color: var(--bg);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }

        .hidden { display: none !important; }
        .glass {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(135deg, rgba(99, 255, 72, 0.08), transparent 34%),
                linear-gradient(180deg, rgba(13, 42, 33, 0.92), rgba(4, 15, 12, 0.9));
            backdrop-filter: blur(14px) saturate(1.18);
            border: 1px solid rgba(99, 255, 72, 0.28);
            box-shadow:
                inset 0 1px 0 rgba(241, 255, 232, 0.12),
                inset 0 0 24px rgba(49, 215, 255, 0.06),
                0 8px 32px rgba(0, 0, 0, 0.28),
                0 0 22px rgba(99, 255, 72, 0.08);
        }
        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(90deg, transparent 0 19px, rgba(49, 215, 255, 0.045) 20px 21px),
                linear-gradient(90deg, rgba(49, 215, 255, 0.14), transparent 18%, transparent 82%, rgba(99, 255, 72, 0.12));
            opacity: 0.55;
            pointer-events: none;
        }
        .glass > * { position: relative; z-index: 1; }
        .btn-press {
            transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-press:active { transform: scale(0.95); }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .screen {
            position: absolute;
            inset: 0;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .full-size { width: 100%; height: 100%; }
        .select-none { user-select: none; }

        #game-container { position: relative; width: 100%; height: 100%; }
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .title-pill {
            padding: 9px 14px;
            border-radius: var(--radius-xl);
        }
        .title-pill::after {
            content: "PORTAL-LAB";
            position: absolute;
            right: 12px;
            bottom: 3px;
            font-size: 0.55rem;
            letter-spacing: 0.18em;
            color: rgba(49, 215, 255, 0.78);
            font-family: 'Exo 2', system-ui, sans-serif;
            pointer-events: none;
        }

        .ui-title {
            margin: 0 74px 8px 0;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(1.12rem, 3vw, 1.65rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dark);
            text-shadow: 0 0 18px rgba(99, 255, 72, 0.48), 0 0 6px rgba(49, 215, 255, 0.22);
        }

        .icon-button {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background:
                radial-gradient(circle at 50% 45%, rgba(99, 255, 72, 0.22), transparent 42%),
                var(--panel-solid);
            box-shadow: var(--shadow-md), 0 0 18px rgba(99, 255, 72, 0.2);
            color: var(--accent);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 26px;
            line-height: 1;
        }

        #editor-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        #category-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .cat-btn {
            position: relative;
            padding: 10px 15px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
            background:
                linear-gradient(180deg, rgba(49, 215, 255, 0.09), rgba(255, 255, 255, 0.045));
            color: var(--text-mid);
            box-shadow: inset 0 0 0 1px rgba(99, 255, 72, 0.18);
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        .cat-btn::before {
            content: "";
            position: absolute;
            left: 10px;
            right: 10px;
            top: 4px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(49, 215, 255, 0.55), transparent);
            opacity: 0.55;
            pointer-events: none;
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent));
            color: #08101e;
             box-shadow: 0 0 18px rgba(99, 255, 72, 0.34);
        }

        .option-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px;
            border-radius: var(--radius-2xl);
            background:
                radial-gradient(circle at 50% 0%, rgba(99, 255, 72, 0.16), transparent 38%),
                linear-gradient(180deg, rgba(13, 42, 33, 0.96), rgba(4, 15, 12, 0.98));
            box-shadow: var(--shadow-lg), 0 0 24px rgba(49, 215, 255, 0.08);
            border: 1px solid rgba(99, 255, 72, 0.22);
        }

        .option-nav {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background:
                radial-gradient(circle at 50% 50%, rgba(99, 255, 72, 0.18), transparent 58%),
                var(--button-soft);
            color: var(--text-dark);
            font-size: 1.5rem;
            font-weight: 700;
            box-shadow: inset 0 0 0 1px rgba(99, 255, 72, 0.2), 0 0 14px rgba(49, 215, 255, 0.08);
        }

        .option-copy {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .option-label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-soft);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .option-value {
            display: block;
            margin-top: 4px;
            font-size: clamp(1.15rem, 3vw, 1.4rem);
            color: var(--text-dark);
            font-weight: 700;
             text-shadow: 0 0 12px rgba(99, 255, 72, 0.22);
        }

        .finish-button,
        .primary-button,
        .secondary-button {
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
        }

        .finish-button,
        .primary-button {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent));
            color: #08101e;
        }

        .finish-button:hover,
        .primary-button:hover {
            filter: brightness(1.06);
        }

        .finish-button {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-2xl);
            font-size: 1.08rem;
            letter-spacing: 0.08em;
            position: relative;
            overflow: hidden;
        }
        .finish-button::after,
        .primary-button::after {
            content: "";
            position: absolute;
            inset: -60%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.22), transparent 32%);
            animation: portalSweep 5s linear infinite;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .start-emoji {
            margin-bottom: 16px;
            font-size: 4rem;
            animation: bounce 1.6s ease-in-out infinite;
        }

        .overlay-title {
            margin: 0 0 8px;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(1.85rem, 6vw, 3rem);
            color: var(--text-dark);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 24px rgba(99, 255, 72, 0.5), 0 0 8px rgba(49, 215, 255, 0.35);
        }

        .overlay-subtitle {
            margin: 0 0 24px;
            color: var(--text-mid);
            font-size: clamp(0.98rem, 3vw, 1.1rem);
            max-width: 440px;
            line-height: 1.45;
        }

        .primary-button {
            position: relative;
            overflow: hidden;
            padding: 16px 36px;
            border-radius: 999px;
            font-size: clamp(1.05rem, 4vw, 1.45rem);
            letter-spacing: 0.08em;
        }

        .showcase-screen {
            background:
                radial-gradient(ellipse at center 28%, rgba(99, 255, 72, 0.18), transparent 34%),
                radial-gradient(circle at 50% 56%, rgba(49, 215, 255, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(9, 36, 28, 0.95), rgba(2, 8, 6, 0.98));
        }

        .showcase-title {
            margin: 0 0 8px;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            color: var(--accent);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .score-wrap {
            margin-bottom: 24px;
            text-align: center;
        }

        .score-label {
            margin: 0;
            color: var(--text-soft);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .score-value {
            margin: 4px 0 0;
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 700;
            color: var(--text-dark);
        }

        .showcase-actions {
            display: flex;
            gap: 16px;
        }

        .feedback-gif {
            width: min(42vw, 180px);
            max-width: 180px;
            border-radius: 18px;
            border: 1px solid rgba(158, 214, 255, 0.28);
            box-shadow: var(--shadow-md);
            object-fit: cover;
            pointer-events: none;
            align-self: center;
            margin-bottom: 14px;
            background: rgba(8, 11, 24, 0.72);
        }

        .feedback-gif-top {
            position: absolute;
            top: 88px;
            right: 16px;
            z-index: 55;
            width: min(34vw, 132px);
            margin-bottom: 0;
            opacity: 0.92;
        }

        .secondary-button {
            padding: 12px 32px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-dark);
            border: 1px solid rgba(158, 214, 255, 0.18);
        }

        /* [agent-note][stage4] repaired: touch-action scope | element: #gameCanvas | action: keep drag gestures on canvas without suppressing UI taps */
        /* [agent-note][world-design-superprompt] authored-bg: replace generic studio void with procedural portal-garage/citadel/council motifs; decorative only, never mechanics-bearing */
         #gameCanvas {
             background:
                 radial-gradient(circle at 50% 18%, rgba(99, 255, 72, 0.12), transparent 20%),
                 linear-gradient(180deg, #10251e 0%, #07140f 45%, #020806 100%);
             touch-action: none;
         }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-4deg); filter: drop-shadow(0 0 10px rgba(99, 255, 72, 0.48)); }
            50% { transform: translateY(-10px) rotate(5deg); filter: drop-shadow(0 0 18px rgba(49, 215, 255, 0.45)); }
        }

        @keyframes portalSweep {
            to { transform: rotate(1turn); }
        }

        @media (max-width: 640px) {
            #ui-layer { padding: 12px; }
            .title-pill { max-width: calc(100vw - 88px); }
            .ui-title { margin-right: 62px; font-size: 1.02rem; }
            .option-panel { padding: 12px; }
            .option-nav { width: 52px; height: 52px; }
            .finish-button { font-size: 0.98rem; }
            .overlay { padding: 18px; }
            .showcase-actions { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "rotationSpeed": { "type": "number", "label": "Spin Speed", "value": 0.5, "min": 0, "max": 5 },
    "bgGridColor": { "type": "color", "label": "Grid Color", "value": "#B2EBF2" },
    "gameTitle": { "type": "text", "label": "Studio Name", "value": "Portal Closet Remix Studio" }
}
</script>

<!-- Assets -->
    <!-- [agent-note][world-design-superprompt] resolved-audio: portal-lab bgm/change/start/finish/back -> approved scifi entries from catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Portal Lab" src="https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_click" data-editable="audio" data-label="SFX Console Click" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3" preload="auto"></audio>
    <audio id="sfx_change" data-editable="audio" data-label="SFX Portal Option Change" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Portal Boot" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3" preload="auto"></audio>
    <audio id="sfx_finish" data-editable="audio" data-label="SFX Council Scan Complete" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_02.mp3" preload="auto"></audio>
    <audio id="sfx_back" data-editable="audio" data-label="SFX Return to Console" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_wind_01.mp3" preload="auto"></audio>

<div id="game-container" class="relative full-size select-none">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="pointer-events-none">
        <div class="header-row pointer-events-auto">
            <div class="glass title-pill">
                <h1 id="ui-title" class="ui-title">Portal Closet Remix Studio</h1>
            </div>
            <button id="btn-random" class="glass icon-button btn-press" aria-label="Shuffle portal disguise">
                <span class="material-symbols-rounded" aria-hidden="true">shuffle</span>

        <div id="editor-controls" class="pointer-events-auto">
            <div id="category-list" class="hide-scroll"></div>

            <div class="glass option-panel">
                <button id="btn-prev" class="option-nav btn-press" aria-label="Previous option"><</button>
                <div class="option-copy">
                    <span id="current-part-name" class="option-label">SPECIES SKIN</span>
                    <span id="current-option-name" class="option-value">Garage Human Yellow</span>
                </div>
                <button id="btn-next" class="option-nav btn-press" aria-label="Next option">></button>
            </div>

            <button id="btn-finish" class="finish-button btn-press">
                RUN STYLE SCAN
            </button>
        </div>
    </div>

    <img id="status-gif" class="feedback-gif feedback-gif-top hidden" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Reaction feedback" loading="lazy">
    <div id="start-screen" class="overlay glass pointer-events-auto">
        <div class="start-emoji">🌀</div>
        <h1 class="overlay-title">Portal Closet Remix Studio</h1>
        <p class="overlay-subtitle">Assemble a portal-ready traveler, spin the scan platform, then lock a multiverse style rating.</p>
        <button id="start-btn" class="primary-button btn-press">
            START PORTAL FITTING
        </button>
    </div>

    <div id="showcase-screen" class="overlay glass showcase-screen hidden pointer-events-auto">
        <!-- [agent-note][stage3] resolved-gif: fail reaction -> confused player reaction puzzle fail game gif | showcase celebration -> victory dance win celebration game gif -->
        <img id="showcase-gif" class="feedback-gif hidden" src="https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp" alt="Celebration reaction" loading="lazy">
        <h2 class="showcase-title">SCAN LOCKED!</h2>
        <div class="score-wrap">
            <p class="score-label">Multiverse Style Score</p>
            <p id="style-score" class="score-value">99/100</p>
        </div>
        <div class="showcase-actions">
            <button id="btn-back" class="secondary-button btn-press">
                REOPEN PORTAL CLOSET
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Core Systems ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // Config
    window.gameConfigDefs = {
        "rotationSpeed": { "type": "number", "label": "Spin Speed", "value": 0.5, "min": 0, "max": 5 },
        "bgGridColor": { "type": "color", "label": "Grid Color", "value": "#B2EBF2" },
        "gameTitle": { "type": "text", "label": "Studio Name", "value": "Portal Closet Remix Studio" }
    };
    window.gameConfig = {
        rotationSpeed: 0.5,
        bgGridColor: "#B2EBF2",
        gameTitle: "Portal Closet Remix Studio"
    };
    window.updateGameConfig = (key, val) => {
        if(window.gameConfig.hasOwnProperty(key)) window.gameConfig[key] = val;
        if(key === 'gameTitle') {
            const el = document.getElementById('ui-title');
            if(el) el.innerText = val;
        }
    };

    // --- Audio + Feedback System ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtx ? new AudioCtx() : null;
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        click: document.getElementById('sfx_click'),
        change: document.getElementById('sfx_change'),
        start: document.getElementById('sfx_start'),
        finish: document.getElementById('sfx_finish'),
        back: document.getElementById('sfx_back')
    };
    const statusGif = document.getElementById('status-gif');
    const showcaseGif = document.getElementById('showcase-gif');
    const soundVolumes = {
        bgm: 0.2,
        click: 0.45,
        change: 0.4,
        start: 0.5,
        finish: 0.55,
        back: 0.4
    };
    const soundCooldowns = {
        click: 90,
        change: 80,
        start: 250,
        finish: 500,
        back: 250
    };
    let audioReady = false;
    let bgmStarted = false;
    let bgmMode = 'idle';
    let feedbackTimer = null;
    const lastSoundAt = {};

    const ensureAudioReady = () => {
        audioReady = true;
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        if (bgmMode === 'edit') {
            startBgm();
        }
    };

    const playFallbackTone = (mode = 'soft') => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = mode === 'celebrate' ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(mode === 'celebrate' ? 420 : 280, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(mode === 'celebrate' ? 820 : 180, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    };

    const startBgm = () => {
        const bgm = sounds.bgm;
        if (!bgm || !audioReady) return;
        bgm.volume = soundVolumes.bgm;
        if (bgmStarted && !bgm.paused) return;
        bgm.currentTime = bgm.currentTime || 0;
        bgm.play().then(() => {
            bgmStarted = true;
        }).catch(() => {
            bgmStarted = false;
        });
    };

    const pauseBgm = () => {
        const bgm = sounds.bgm;
        if (!bgm) return;
        bgm.pause();
        bgmStarted = false;
    };

    const setBgmMode = (mode) => {
        bgmMode = mode;
        if (mode === 'edit') {
            startBgm();
        } else {
            pauseBgm();
        }
    };

    const playSound = (id, options = {}) => {
        const el = sounds[id];
        const now = performance.now();
        const cooldown = options.cooldown ?? soundCooldowns[id] ?? 0;
        if (cooldown && lastSoundAt[id] && now - lastSoundAt[id] < cooldown) return;
        lastSoundAt[id] = now;
        ensureAudioReady();
        if (el) {
            el.pause();
            el.currentTime = 0;
            el.volume = options.volume ?? soundVolumes[id] ?? 0.45;
            el.play().catch(() => {
                playFallbackTone(options.fallbackMode);
            });
        } else {
            playFallbackTone(options.fallbackMode);
        }
    };

    const showStatusGif = (kind) => {
        if (!statusGif) return;
        clearTimeout(feedbackTimer);
        if (kind === 'edit') {
            statusGif.src = 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp';
            statusGif.alt = 'Confused reaction';
            statusGif.classList.remove('hidden');
            feedbackTimer = setTimeout(() => {
                statusGif.classList.add('hidden');
            }, 1200);
        } else {
            statusGif.classList.add('hidden');
        }
    };

    const updateShowcaseGif = (visible) => {
        if (!showcaseGif) return;
        showcaseGif.classList.toggle('hidden', !visible);
    };

    document.addEventListener('pointerdown', ensureAudioReady, { once: true });
    document.addEventListener('keydown', ensureAudioReady, { once: true });

    // --- Game State ---
    let gameState = 'START'; // START, EDIT, SHOWCASE
    let time = 0;
    let particles = [];
    let confetti = [];
    let sparkles = [];
    
    // Avatar Data
    const categories = ['skin', 'face', 'shirt', 'pants', 'hat'];
    const categoryLabels = { skin: 'Species Skin', face: 'Scan Face', shirt: 'Lab Layer', pants: 'Portal Pants', hat: 'Head Rig' };
    
    let avatar = {
        skin: 0,
        face: 0,
        shirt: 0,
        pants: 0,
        hat: 0
    };

    let currentCategoryIndex = 0;
    
    // Asset Definitions (Procedural Data)
    const db = {
        skin: [
            { name: "Garage Human Yellow", val: "#FFD54F" },
            { name: "Morty-Beige Panic", val: "#F5D0BA" },
            { name: "Council Pale Clone", val: "#FFE0BD" },
            { name: "Cronenberg Bronze", val: "#8D5524" },
            { name: "Deep Space Espresso", val: "#3E2723" },
            { name: "Portal Slime Green", val: "#63FF48" },
            { name: "Meeseeks Cyan", val: "#31D7FF" },
            { name: "Ghost Dimension White", val: "#F5F5F5" }
        ],
        face: [
            { name: "Nervous Smile", type: 0 },
            { name: "Deadpan Rick Squint", type: 1 },
            { name: "Portal Shock", type: 2 },
            { name: "Cool Goggles", type: 3 },
            { name: "Council Determined", type: 4 },
            { name: "Dimension Wink", type: 5 }
        ],
        shirt: [
            { name: "Garage Lab Grey", val: "#9E9E9E" },
            { name: "Red Teen Hoodie", val: "#F44336" },
            { name: "Meeseeks Blue Tee", val: "#2196F3" },
            { name: "Portal Flannel", val: "#4CAF50" },
            { name: "Council Coat Black", val: "#212121" },
            { name: "Cronenberg Purple Stripe", val: "#9C27B0" },
            { name: "Blips Prize Vest", val: "#FF9800" }
        ],
        pants: [
            { name: "Citadel Blue Jeans", val: "#1565C0" },
            { name: "Council Black Slacks", val: "#212121" },
            { name: "Garage Khakis", val: "#D7CCC8" },
            { name: "Portal Shorts Green", val: "#81C784" },
            { name: "Dimension Joggers", val: "#ECEFF1" }
        ],
        hat: [
            { name: "Bare Portal Hair", type: -1 },
            { name: "Garage Baseball Cap", type: 0, color: "#D32F2F" },
            { name: "Council Top Hat", type: 1, color: "#212121" },
            { name: "Cronenberg Beanie", type: 2, color: "#FF5722" },
            { name: "Scanner Headphones", type: 3, color: "#31D7FF" },
            { name: "Council Crown", type: 4, color: "#FFE66D" }
        ]
    };

    // --- Input Handling ---
    let pointerDown = false;
    let lastX = 0;
    let rotation = 0;
    let targetRotation = 0;
    let bounceY = 0;

    const handleInput = (e) => {
        if(gameState !== 'EDIT' && gameState !== 'SHOWCASE') return;
        if(e.target.tagName !== 'CANVAS') return;
        
        pointerDown = true;
        lastX = e.clientX;
    };

    const handleMove = (e) => {
        if (!pointerDown) return;
        const delta = e.clientX - lastX;
        targetRotation += delta * 0.01;
        lastX = e.clientX;
    };

    const handleEnd = () => {
        pointerDown = false;
    };

    window.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('pointermove', handleMove, { passive: false });
    window.addEventListener('pointerup', handleEnd);
    window.addEventListener('pointercancel', handleEnd);

    // --- UI Logic ---
    const initUI = () => {
        const catList = document.getElementById('category-list');
        catList.innerHTML = '';
        categories.forEach((cat, idx) => {
            const btn = document.createElement('button');
            btn.className = `cat-btn btn-press${idx === 0 ? ' active' : ''}`;
            btn.innerText = categoryLabels[cat];
            btn.onclick = () => selectCategory(idx);
            catList.appendChild(btn);
        });
        updateUI();
    };

    const selectCategory = (idx) => {
        currentCategoryIndex = idx;
        
        const btns = document.querySelectorAll('.cat-btn');
        btns.forEach((b, i) => {
            b.classList.toggle('active', i === idx);
        });
        updateUI();
        playSound('click', { fallbackMode: 'soft' });
    };

    const changeOption = (dir) => {
        const cat = categories[currentCategoryIndex];
        const len = db[cat].length;
        let val = avatar[cat] + dir;
        if (val < 0) val = len - 1;
        if (val >= len) val = 0;
        avatar[cat] = val;
        
        bounceY = 15;
        spawnParticles(0, -50, 10, db[cat][val].val || '#FFD700');
        
        updateUI();
        playSound('change', { fallbackMode: 'soft' });
    };

    const updateUI = () => {
        const cat = categories[currentCategoryIndex];
        const optIndex = avatar[cat];
        const optData = db[cat][optIndex];
        
        document.getElementById('current-part-name').innerText = categoryLabels[cat];
        document.getElementById('current-option-name').innerText = optData.name;
    };

    const randomizeAvatar = () => {
        categories.forEach(cat => {
            const len = db[cat].length;
            avatar[cat] = Math.floor(Math.random() * len);
        });
        bounceY = 20;
        spawnParticles(0, -50, 30, '#FFFFFF');
        playSound('change', { fallbackMode: 'soft' });
        updateUI();
    };

    document.getElementById('btn-prev').onclick = () => changeOption(-1);
    document.getElementById('btn-next').onclick = () => changeOption(1);
    document.getElementById('btn-random').onclick = randomizeAvatar;
    
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('pointer-events-none');
        gameState = 'EDIT';
        setBgmMode('edit');
        playSound('start', { fallbackMode: 'soft' });
        showStatusGif('hide');
        initUI();
    };

    document.getElementById('btn-finish').onclick = () => {
        gameState = 'SHOWCASE';
        document.getElementById('editor-controls').classList.add('hidden');
        document.getElementById('showcase-screen').classList.remove('hidden');
        document.getElementById('btn-random').classList.add('hidden');
        
        const score = Math.floor(80 + Math.random() * 20);
        document.getElementById('style-score').innerText = score + "/100";
        
        setBgmMode('idle');
        updateShowcaseGif(true);
        showStatusGif('hide');
        playSound('finish', { fallbackMode: 'celebrate' });
        for(let i=0; i<50; i++) {
            confetti.push({
                x: 0, y: 0,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 1) * 20 - 10,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                life: 100
            });
        }
    };

    document.getElementById('btn-back').onclick = () => {
        gameState = 'EDIT';
        document.getElementById('showcase-screen').classList.add('hidden');
        document.getElementById('editor-controls').classList.remove('hidden');
        document.getElementById('btn-random').classList.remove('hidden');
        updateShowcaseGif(false);
        showStatusGif('edit');
        setBgmMode('edit');
        playSound('back', { fallbackMode: 'soft' });
    };

    // --- Rendering ---
    const drawRoundedRect = (ctx, x, y, w, h, r, color, stroke=true) => {
        ctx.beginPath();
        ctx.moveTo(x+r, y);
        ctx.arcTo(x+w, y, x+w, y+h, r);
        ctx.arcTo(x+w, y+h, x, y+h, r);
        ctx.arcTo(x, y+h, x, y, r);
        ctx.arcTo(x, y, x+w, y, r);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        if(stroke) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.stroke();
        }
    };

    const glowCircle = (ctx, x, y, radius, color, alpha = 0.3) => {
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, color.replace('ALPHA', alpha));
        gradient.addColorStop(1, color.replace('ALPHA', 0));
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    };

    const drawAvatar = (ctx, scale) => {
        const skinColor = db.skin[avatar.skin].val;
        const shirtColor = db.shirt[avatar.shirt].val;
        const pantsColor = db.pants[avatar.pants].val;
        
        const headSize = 50;
        const torsoW = 50, torsoH = 50;
        const limbW = 20, limbH = 50;
        
        const bounce = Math.sin(time * 3) * 3 + bounceY;
        
        ctx.save();
        ctx.translate(0, -bounce);

        glowCircle(ctx, 0, -15, 96, 'rgba(99, 255, 72, ALPHA)', 0.2);
        glowCircle(ctx, 0, -72, 60, 'rgba(49, 215, 255, ALPHA)', 0.18);

        drawRoundedRect(ctx, -25, 30, limbW, limbH, 5, pantsColor);
        drawRoundedRect(ctx, 5, 30, limbW, limbH, 5, pantsColor);
        
        drawRoundedRect(ctx, -25, -20, torsoW, torsoH, 5, shirtColor);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.arc(0, 5, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(-13, -10, 26, 6);

        const armAngle = Math.sin(time * 2) * 0.1;
        
        ctx.save();
        ctx.translate(-25, -15);
        ctx.rotate(armAngle);
        drawRoundedRect(ctx, -limbW, 0, limbW, limbH, 5, skinColor);
        drawRoundedRect(ctx, -limbW, 0, limbW, 15, 2, shirtColor, false);
        ctx.restore();

        ctx.save();
        ctx.translate(25, -15);
        ctx.rotate(-armAngle);
        drawRoundedRect(ctx, 0, 0, limbW, limbH, 5, skinColor);
        drawRoundedRect(ctx, 0, 0, limbW, 15, 2, shirtColor, false);
        ctx.restore();

        drawRoundedRect(ctx, -25, -75, headSize, headSize, 8, skinColor);
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.arc(-8, -66, 10, 0, Math.PI * 2);
        ctx.fill();

        const hatData = db.hat[avatar.hat];
        if (hatData.type === -1) {
            ctx.fillStyle = '#a7e7ff';
            ctx.beginPath();
            ctx.moveTo(-28, -75);
            ctx.lineTo(-18, -104);
            ctx.lineTo(-8, -80);
            ctx.lineTo(2, -108);
            ctx.lineTo(11, -80);
            ctx.lineTo(24, -101);
            ctx.lineTo(27, -75);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(7,17,26,0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(49, 215, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -50, 33, -0.25, Math.PI + 0.25);
        ctx.stroke();
        
        const faceType = db.face[avatar.face].type;
        ctx.strokeStyle = '#07111a';
        ctx.lineWidth = 3;
        ctx.fillStyle = '#07111a';
        
        if (faceType === 0) {
            ctx.beginPath(); ctx.arc(-10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -45, 8, 0, Math.PI, false); ctx.stroke();
        } else if (faceType === 1) {
            ctx.fillRect(-15, -55, 10, 3);
            ctx.fillRect(5, -55, 10, 3);
            ctx.beginPath(); ctx.moveTo(-5, -45); ctx.lineTo(5, -45); ctx.stroke();
        } else if (faceType === 2) {
            ctx.beginPath(); ctx.arc(-10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -40, 6, 0, Math.PI*2); ctx.fill();
        } else if (faceType === 3) {
            ctx.fillStyle = '#111';
            ctx.fillRect(-20, -60, 40, 10);
            ctx.beginPath(); ctx.moveTo(-5, -45); ctx.lineTo(5, -45); ctx.stroke();
        } else if (faceType === 4) {
            ctx.beginPath(); ctx.moveTo(-15, -60); ctx.lineTo(-5, -55); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(15, -60); ctx.lineTo(5, -55); ctx.stroke();
            ctx.beginPath(); ctx.arc(-10, -52, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -52, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-5, -40); ctx.lineTo(5, -40); ctx.stroke();
        } else if (faceType === 5) {
            ctx.beginPath(); ctx.arc(-10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(5, -55); ctx.lineTo(15, -55); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, -45, 8, 0, Math.PI, false); ctx.stroke();
        }

        if (hatData.type !== -1) {
            ctx.fillStyle = hatData.color;
            if (hatData.type === 0) {
                ctx.fillRect(-26, -80, 52, 15);
                ctx.fillRect(-26, -80, 60, 5);
            } else if (hatData.type === 1) {
                ctx.fillRect(-35, -75, 70, 5);
                ctx.fillRect(-20, -115, 40, 40);
            } else if (hatData.type === 2) {
                ctx.beginPath();
                ctx.arc(0, -75, 26, Math.PI, 0);
                ctx.fill();
                ctx.fillRect(-26, -75, 52, 10);
            } else if (hatData.type === 3) {
                ctx.lineWidth = 4;
                ctx.strokeStyle = hatData.color;
                ctx.beginPath(); ctx.arc(0, -75, 30, Math.PI, 0); ctx.stroke();
                ctx.fillRect(-35, -75, 10, 20);
                ctx.fillRect(25, -75, 10, 20);
            } else if (hatData.type === 4) {
                ctx.beginPath();
                ctx.moveTo(-25, -75);
                ctx.lineTo(-25, -95);
                ctx.lineTo(-12, -85);
                ctx.lineTo(0, -100);
                ctx.lineTo(12, -85);
                ctx.lineTo(25, -95);
                ctx.lineTo(25, -75);
                ctx.fill();
            }
        }

        ctx.restore();
    };

    const spawnParticles = (x, y, count, color) => {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    };

    const drawParticles = (ctx) => {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            
            if(p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }
            
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    };

    const drawSparkles = (ctx, w, h) => {
        if (sparkles.length < 24 && Math.random() > 0.8) {
            sparkles.push({
                x: Math.random() * w,
                y: Math.random() * h * 0.72,
                size: 1 + Math.random() * 3,
                life: 0.4 + Math.random() * 0.6,
                drift: 0.2 + Math.random() * 0.8
            });
        }

        for (let i = sparkles.length - 1; i >= 0; i--) {
            const s = sparkles[i];
            s.y += s.drift;
            s.life -= 0.01;
            if (s.life <= 0) {
                sparkles.splice(i, 1);
                continue;
            }

            ctx.globalAlpha = s.life;
            ctx.fillStyle = '#9dff57';
            ctx.fillRect(s.x, s.y, s.size, s.size);
            ctx.globalAlpha = 1;
        }
    };

    const drawConfetti = (ctx) => {
        for(let i=confetti.length-1; i>=0; i--) {
            let p = confetti[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5;
            p.life--;
            
            if(p.life <= 0) {
                confetti.splice(i, 1);
                continue;
            }
            
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 8, 8);
        }
    };

    const drawPortalRings = (ctx, x, y, r) => {
        ctx.save();
        ctx.translate(x, y);
        for (let i = 0; i < 5; i++) {
            ctx.save();
            ctx.rotate(time * (0.18 + i * 0.035) + i * 0.7);
            ctx.strokeStyle = `rgba(${i % 2 ? '49, 215, 255' : '99, 255, 72'}, ${0.32 - i * 0.04})`;
            ctx.lineWidth = 8 - i;
            ctx.setLineDash(i % 2 ? [18, 12, 4, 10] : [34, 10]);
            ctx.beginPath();
            ctx.ellipse(0, 0, r * (1 - i * 0.1), r * (0.58 - i * 0.035), i * 0.62, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        ctx.setLineDash([]);
        const core = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
        core.addColorStop(0, 'rgba(241,255,232,0.2)');
        core.addColorStop(0.45, 'rgba(99,255,72,0.11)');
        core.addColorStop(1, 'rgba(99,255,72,0)');
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.98, r * 0.58, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };

    const drawCitadelSilhouettes = (ctx, w, h) => {
        const baseY = h * 0.58;
        ctx.save();
        ctx.fillStyle = 'rgba(3, 10, 8, 0.42)';
        ctx.strokeStyle = 'rgba(99, 255, 72, 0.08)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 7; i++) {
            const x = w * (0.08 + i * 0.15);
            const towerW = Math.max(12, w * 0.035);
            const towerH = h * (0.08 + (i % 3) * 0.035);
            ctx.beginPath();
            ctx.moveTo(x - towerW, baseY);
            ctx.lineTo(x - towerW * 0.7, baseY - towerH);
            ctx.lineTo(x, baseY - towerH - towerW * 0.7);
            ctx.lineTo(x + towerW * 0.7, baseY - towerH);
            ctx.lineTo(x + towerW, baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillRect(x - 2, baseY - towerH - towerW * 0.5, 4, towerH * 0.75);
        }
        ctx.restore();
    };

    const drawGarageLabBackground = (ctx, w, h) => {
        const backgroundGradient = ctx.createLinearGradient(0, 0, 0, h);
        backgroundGradient.addColorStop(0, '#10251e');
        backgroundGradient.addColorStop(0.46, '#07140f');
        backgroundGradient.addColorStop(1, '#020806');
        ctx.fillStyle = backgroundGradient;
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(w * 0.5, h * 0.24, 0, w * 0.5, h * 0.24, Math.min(w, h) * 0.58);
        glow.addColorStop(0, 'rgba(99,255,72,0.2)');
        glow.addColorStop(0.42, 'rgba(49,215,255,0.07)');
        glow.addColorStop(1, 'rgba(2,8,6,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        drawCitadelSilhouettes(ctx, w, h);

        ctx.strokeStyle = 'rgba(49, 215, 255, 0.08)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            const y = h * (0.16 + i * 0.1);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.bezierCurveTo(w * 0.22, y + Math.sin(time + i) * 10, w * 0.78, y - 14, w, y + Math.cos(time + i) * 8);
            ctx.stroke();
        }

        const portalX = w * 0.5 + Math.sin(time * 0.45) * Math.min(w, h) * 0.03;
        const portalY = h * 0.23;
        const portalR = Math.min(w, h) * 0.2;
        drawPortalRings(ctx, portalX, portalY, portalR);

        ctx.fillStyle = 'rgba(49,215,255,0.09)';
        ctx.beginPath();
        ctx.arc(w * 0.18, h * 0.18, Math.min(w, h) * 0.14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(156,39,176,0.08)';
        ctx.beginPath();
        ctx.arc(w * 0.82, h * 0.25, Math.min(w, h) * 0.18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(99, 255, 72, 0.12)';
        for (let i = 0; i < 7; i++) {
            const x = ((time * 18 + i * w * 0.17) % (w + 80)) - 40;
            const y = h * (0.1 + (i % 4) * 0.1);
            ctx.fillRect(x, y, 32, 3);
            ctx.fillRect(x + 9, y - 8, 3, 19);
        }

        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = '#63ff48';
        ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
            const x = w * (0.08 + i * 0.17);
            const y = h * (0.63 + (i % 2) * 0.05);
            ctx.beginPath();
            ctx.arc(x, y, 9 + (i % 3) * 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = i % 2 ? 'rgba(49,215,255,0.12)' : 'rgba(99,255,72,0.12)';
            ctx.fill();
        }
        ctx.restore();
    };

    const drawGrid = (ctx, w, h) => {
        ctx.strokeStyle = 'rgba(99, 255, 72, 0.22)';
        ctx.lineWidth = 1;
        const spacing = 40;
        const offset = (time * 20) % spacing;
        
        ctx.beginPath();
        for(let x = 0; x <= w; x += spacing) {
            ctx.moveTo(x, 0); ctx.lineTo(x, h);
        }
        for(let y = offset; y <= h; y += spacing) {
            ctx.moveTo(0, y); ctx.lineTo(w, y);
        }
        ctx.stroke();
    };

    // --- Main Loop ---
    const loop = () => {
        requestAnimationFrame(loop);
        
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        const w = rect.width;
        const h = rect.height;

        time += 0.016;
        if (bounceY > 0) bounceY *= 0.8;
        
        if (gameState === 'SHOWCASE') {
            targetRotation += 0.01;
        } else {
            targetRotation += window.gameConfig.rotationSpeed * 0.01;
        }
        
        rotation += (targetRotation - rotation) * 0.1;

        drawGarageLabBackground(ctx, w, h);
        drawGrid(ctx, w, h);
        drawSparkles(ctx, w, h);

        try {
            ctx.save();
            ctx.translate(w/2, h/2 + 50);
            
             ctx.save();
             ctx.scale(1, 0.3);
             ctx.fillStyle = 'rgba(241,255,232,0.12)';
             ctx.beginPath(); ctx.arc(0, 200, 128, 0, Math.PI*2); ctx.fill();
             ctx.strokeStyle = 'rgba(49,215,255,0.35)';
             ctx.lineWidth = 4;
             ctx.beginPath(); ctx.arc(0, 200, 112 + Math.sin(time * 2) * 4, 0, Math.PI*2); ctx.stroke();
             ctx.fillStyle = 'rgba(99,255,72,0.24)';
             ctx.beginPath(); ctx.arc(0, 210, 120, 0, Math.PI*2); ctx.fill();
             ctx.restore();

            ctx.scale(2, 2);
            drawAvatar(ctx, 1);
            drawParticles(ctx);
            drawConfetti(ctx);

            ctx.restore();

        } catch (e) {
            console.error(e);
        }
    };

    loop();
});
</script>
