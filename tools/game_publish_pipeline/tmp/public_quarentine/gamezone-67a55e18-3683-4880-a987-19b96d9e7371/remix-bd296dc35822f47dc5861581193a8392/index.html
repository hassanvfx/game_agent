<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Run: Recover the 8 Logs</title>
    <!-- [agent-note][stage4] resolved-font: title/hud -> Orbitron, body/ui -> Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #040812;
            --bg-bottom: #090f22;
            --lane-glow: rgba(65, 245, 255, 0.12);
            --panel-bg: rgba(8, 14, 28, 0.78);
            --panel-border: rgba(110, 247, 255, 0.48);
            --panel-shadow: rgba(0, 0, 0, 0.44);
            --accent-cyan: #6ff7ff;
            --accent-pink: #ff5ca8;
            --accent-gold: #ffe082;
            --text-main: #f4fbff;
            --text-dim: #bad6f0;
            --danger: #ff6e82;
            --success: #84f6a1;
            --scanline: rgba(255, 255, 255, 0.035);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(32, 108, 170, 0.18), transparent 42%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(11, 18, 34, 0.88), rgba(8, 12, 24, 0.78));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 10px 30px var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .glitch-text {
            text-shadow:
                1px 0 var(--accent-pink),
                -1px 0 var(--accent-cyan),
                0 0 16px rgba(111, 247, 255, 0.22);
            animation: glitch 0.7s infinite alternate-reverse;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-1.5deg); }
            40% { transform: skew(1.5deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes pulse-chip {
            0%, 100% { box-shadow: 0 0 0 rgba(111, 247, 255, 0.0); }
            50% { box-shadow: 0 0 18px rgba(111, 247, 255, 0.2); }
        }

        @keyframes signal-shift {
            0%, 100% { opacity: 0.4; transform: translateX(0); }
            50% { opacity: 0.9; transform: translateX(6px); }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.18) 100%),
                repeating-linear-gradient(
                    180deg,
                    transparent 0 4px,
                    var(--scanline) 4px 5px
                );
            opacity: 0.52;
            z-index: 2;
        }

        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 16%, rgba(111, 247, 255, 0.14), transparent 28%),
                radial-gradient(circle at 50% 80%, rgba(255, 92, 168, 0.12), transparent 34%);
            z-index: 1;
        }

        #ui-layer {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            box-sizing: border-box;
        }

        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .hud-chip {
            min-width: 0;
            padding: 0.75rem 0.85rem 0.68rem;
            border-radius: 16px;
            animation: pulse-chip 2.4s ease-in-out infinite;
        }

        .hud-label {
            display: block;
            margin-bottom: 0.3rem;
            color: var(--text-dim);
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-family: 'Orbitron', system-ui, sans-serif;
            line-height: 1.45;
        }

        .hud-value {
            display: block;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.82rem, 3vw, 1.16rem);
            line-height: 1.35;
            text-shadow: 0 0 14px rgba(111, 247, 255, 0.22);
        }

        #score-panel {
            color: var(--text-main);
        }

        #score-display {
            color: var(--accent-gold);
        }

        #dist-panel {
            color: var(--text-main);
        }

        #dist-display {
            color: var(--accent-cyan);
        }

        #mission-banner {
            align-self: center;
            margin-top: 0.75rem;
            max-width: 31rem;
            padding: 0.72rem 0.95rem;
            text-align: center;
            color: var(--text-dim);
            font-size: clamp(0.8rem, 2.4vw, 0.95rem);
            letter-spacing: 0.04em;
            line-height: 1.35;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
        }

        #mission-banner::before {
            content: "SIGNAL";
            position: absolute;
            top: 0.35rem;
            left: 0.7rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.46rem;
            color: rgba(111, 247, 255, 0.68);
            letter-spacing: 0.18em;
        }

        #mission-banner::after {
            content: "";
            position: absolute;
            right: 0.8rem;
            top: 50%;
            width: 1.35rem;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            animation: signal-shift 1.4s ease-in-out infinite;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 16, 0.84);
            z-index: 50;
            padding: 1rem;
            box-sizing: border-box;
        }

        #game-over-card {
            padding: 1.5rem 1.15rem 1.15rem;
            border-left: 4px solid var(--danger);
            border-radius: 20px;
            text-align: center;
            max-width: 22rem;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        #game-over-card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at top, rgba(255, 92, 168, 0.14), transparent 42%),
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 45%);
        }

        #game-over-title {
            margin: 0 0 0.5rem;
            color: var(--text-main);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.45rem, 6vw, 2.3rem);
            line-height: 1.3;
        }

        #game-over-copy {
            margin: 0 0 1.25rem;
            color: var(--text-dim);
            font-size: 0.98rem;
            letter-spacing: 0.06em;
            line-height: 1.45;
        }

        #final-score {
            margin-bottom: 1.4rem;
            color: var(--accent-gold);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.95rem, 4vw, 1.2rem);
            line-height: 1.6;
            text-shadow: 0 0 16px rgba(255, 224, 130, 0.24);
        }

        #restart-btn {
            width: 100%;
            border: 1px solid rgba(111, 247, 255, 0.62);
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(111, 247, 255, 0.18), rgba(32, 88, 134, 0.85));
            color: var(--text-main);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.82rem;
            line-height: 1.45;
            padding: 0.95rem 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 0 18px rgba(111, 247, 255, 0.16);
        }

        #restart-btn:hover {
            filter: brightness(1.08);
        }

        #restart-btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 520px) {
            #ui-layer {
                padding: 0.75rem;
            }

            #hud {
                gap: 0.55rem;
            }

            .hud-chip {
                padding: 0.62rem 0.68rem 0.58rem;
                border-radius: 14px;
            }

            .hud-label {
                font-size: 0.54rem;
                letter-spacing: 0.16em;
            }

            #mission-banner {
                margin-top: 0.55rem;
                padding: 0.72rem 0.8rem 0.78rem;
                font-size: 0.76rem;
            }

            #mission-banner::after {
                display: none;
            }

            #game-over-card {
                padding: 1.2rem 0.95rem 0.95rem;
            }

            #restart-btn {
                font-size: 0.74rem;
            }
        }

        #feedback-layer {
            position: absolute;
            right: 0.85rem;
            bottom: 1rem;
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6rem;
            pointer-events: none;
        }

        .feedback-gif {
            width: min(30vw, 110px);
            max-width: 110px;
            border-radius: 16px;
            border: 1px solid rgba(111, 247, 255, 0.45);
            background: rgba(7, 13, 24, 0.72);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            object-fit: cover;
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-gif.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .status-toast {
            min-width: 0;
            max-width: min(70vw, 220px);
            padding: 0.55rem 0.75rem;
            border-radius: 14px;
            color: var(--text-main);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .status-toast.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 520px) {
            #feedback-layer {
                right: 0.7rem;
                bottom: 0.8rem;
                gap: 0.45rem;
            }

            .feedback-gif {
                width: min(28vw, 88px);
                max-width: 88px;
            }

            .status-toast {
                max-width: 58vw;
                font-size: 0.68rem;
                padding: 0.46rem 0.58rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets Declaration -->
<img id="asset_player" data-editable="image" data-label="Courier" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" hidden>
<audio id="bgm_main" data-editable="audio" data-label="Gameplay Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="Pickup Ping" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_crash" data-editable="audio" data-label="Hazard Crash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="UI Confirm" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_success" data-editable="audio" data-label="Mission Success" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "baseSpeed": { "type": "number", "label": "Base Speed", "value": 600, "min": 300, "max": 1000 },
    "sensitivity": { "type": "number", "label": "Steering Sensitivity", "value": 0.15, "min": 0.05, "max": 0.5 },
    "glitchIntensity": { "type": "number", "label": "Glitch FX", "value": 1, "min": 0, "max": 2 }
}
</script>

<!-- Game Structure -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- [agent-note][stage3] resolved-gif: collect/crash feedback -> catalogs/gifs.json -->
        <div id="feedback-layer" aria-hidden="true">
            <div id="status-toast" class="status-toast glass">Signal linked</div>
            <img id="gif-success" class="feedback-gif" alt="Recovery feedback" src="https://i.giphy.com/jslPJhwV73VZYgcGTd.webp">
            <img id="gif-fail" class="feedback-gif" alt="Hazard feedback" src="https://i.giphy.com/rtxxvAkfoOALPS75m2.webp">
        </div>
        <div id="hud">
            <div id="score-panel" class="hud-chip glass">
                <span class="hud-label">Recovered Logs</span>
                <span class="hud-value"><span id="score-display">0/8</span></span>
            </div>
            <div id="dist-panel" class="hud-chip glass">
                <span class="hud-label">Range</span>
                <span class="hud-value"><span id="dist-display">0</span>m</span>
            </div>
        </div>

        <div id="mission-banner" class="glass">
            Guide the courier lane to lane and recover all 8 lost logs before a hazard wipes the run.
        </div>

        <div id="game-over-screen" class="hidden interactive">
            <div id="game-over-card" class="glass">
                <h2 id="game-over-title" class="glitch-text">SIGNAL LOST</h2>
                <p id="game-over-copy">A road hazard cut the retrieval run short.</p>
                <div id="final-score">0 LOGS SECURED</div>
                <button id="restart-btn">
                    Run Again
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * §0 System Invariants & Globals
 */
const CONFIG_DEF = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(CONFIG_DEF).map(([k, v]) => [k, v.value]));
window.gameConfigDefs = CONFIG_DEF; // Exposure for editor

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
let cw = 0, ch = 0; // Logical dimensions
let dpr = 1;

// State
let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
let initialized = false;
let lastTime = 0;
let score = 0;
let distance = 0;
let gameSpeed = 0;

// Audio Context
let audioCtx;
const audioBuffers = {};
const audioElements = {
    collect: document.getElementById('sfx_collect'),
    crash: document.getElementById('sfx_crash'),
    ui: document.getElementById('sfx_ui'),
    success: document.getElementById('sfx_success'),
    bgm: document.getElementById('bgm_main')
};
let bgmStarted = false;
let successPlayed = false;
let activeLoopNode = null;
let activeLoopGain = null;
let activeToastTimer = 0;
let successGifTimer = 0;
let failGifTimer = 0;
const gifSuccess = document.getElementById('gif-success');
const gifFail = document.getElementById('gif-fail');
const statusToast = document.getElementById('status-toast');

/**
 * §1 Audio System (Web Audio API - Zero DOM Overhead)
 */
async function initAudio() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    const loadBuffer = async (id, url) => {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Failed to load audio ${id}, fallback enabled`);
        }
    };

    // Preload SFX
    const sfxList = [
        ['collect', document.getElementById('sfx_collect').src],
        ['crash', document.getElementById('sfx_crash').src],
        ['ui', document.getElementById('sfx_ui').src],
        ['success', document.getElementById('sfx_success').src],
        ['bgm', document.getElementById('bgm_main').src]
    ];
    await Promise.all(sfxList.map(([id, url]) => loadBuffer(id, url)));
}

function playMediaElementSfx(id, options = {}) {
    const element = audioElements[id];
    if (!element) return false;

    try {
        const clone = element.cloneNode();
        clone.volume = Math.max(0, Math.min(1, options.volume ?? 0.4));
        clone.loop = false;
        clone.play().catch(() => {});
        return true;
    } catch (e) {
        return false;
    }
}

function playSfx(id, options = {}) {
    if (!audioCtx) {
        if (!playMediaElementSfx(id, options)) synthesizeSfx(id);
        return;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const buffer = audioBuffers[id];
    if (buffer) {
        const source = audioCtx.createBufferSource();
        const gainNode = audioCtx.createGain();
        source.buffer = buffer;
        gainNode.gain.value = options.volume ?? 0.4;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
    } else if (!playMediaElementSfx(id, options)) {
        synthesizeSfx(id);
    }
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

function startLoopedBgm() {
    if (!audioCtx || !audioBuffers.bgm || activeLoopNode) return;
    const source = audioCtx.createBufferSource();
    const gainNode = audioCtx.createGain();
    source.buffer = audioBuffers.bgm;
    source.loop = true;
    gainNode.gain.value = 0.18;
    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    source.start(0);
    activeLoopNode = source;
    activeLoopGain = gainNode;
    source.onended = () => {
        if (activeLoopNode === source) {
            activeLoopNode = null;
            activeLoopGain = null;
        }
    };
}

function stopLoopedBgm() {
    if (activeLoopNode) {
        try {
            activeLoopNode.stop();
        } catch (e) {}
        activeLoopNode = null;
        activeLoopGain = null;
    }
}

function showFeedback(kind, label) {
    if (statusToast) {
        statusToast.textContent = label;
        statusToast.classList.add('active');
        clearTimeout(activeToastTimer);
        activeToastTimer = setTimeout(() => statusToast.classList.remove('active'), 900);
    }

    if (kind === 'success' && gifSuccess) {
        gifSuccess.classList.add('active');
        clearTimeout(successGifTimer);
        successGifTimer = setTimeout(() => gifSuccess.classList.remove('active'), 1200);
    }

    if (kind === 'fail' && gifFail) {
        gifFail.classList.add('active');
        clearTimeout(failGifTimer);
        failGifTimer = setTimeout(() => gifFail.classList.remove('active'), 1400);
    }
}

function unlockAudio() {
    if (!audioCtx) initAudio().then(() => {
        if (audioCtx?.state === 'suspended') audioCtx.resume();
        if (!bgmStarted) {
            startLoopedBgm();
            bgmStarted = true;
            playSfx('ui', { volume: 0.25 });
        }
    });
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (audioCtx && !bgmStarted) {
        startLoopedBgm();
        bgmStarted = true;
        playSfx('ui', { volume: 0.25 });
    }
}

function vibrate(type) {
    if (!window.navigator) return;
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

/**
 * §2 Game Entities & Logic
 */
const hero = { x: 0, y: 0, w: 60, h: 100, tilt: 0 };
let obstacles = [];
let particles = [];
let pages = [];
let shake = 0;

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 200;
        this.vy = (Math.random() - 0.5) * 200;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 4 + 2;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1.0;
    }
}

function spawnObstacle() {
    const type = Math.random() > 0.3 ? 'tree' : 'static';
    const w = type === 'tree' ? 40 : 60;
    const h = type === 'tree' ? 120 : 60;
    obstacles.push({
        x: Math.random() * (cw - w),
        y: -150,
        w: w,
        h: h,
        type: type,
        active: true
    });
}

function spawnPage() {
    pages.push({
        x: Math.random() * (cw - 40) + 20,
        y: -100,
        w: 30,
        h: 40,
        active: true
    });
}

function initGame() {
    if (gameState === 'PLAYING') return;

    hero.x = cw / 2;
    hero.y = ch - 150;
    obstacles = [];
    particles = [];
    pages = [];
    score = 0;
    distance = 0;
    gameSpeed = window.gameConfig.baseSpeed;
    shake = 0;

    // Initial spawn
    for (let i = 0; i < 3; i++) spawnObstacle();

    setState('PLAYING');

    successPlayed = false;
    showFeedback('success', 'Run live');
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');

    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
        document.getElementById('score-display').innerText = `0/8`;
        document.getElementById('dist-display').innerText = `0`;
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} LOGS SECURED`;
        showFeedback('fail', 'Signal lost');
        playSfx('crash', { volume: 0.42 });
        playSfx('ui', { volume: 0.2 });
        stopLoopedBgm();
        bgmStarted = false;
    }
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Difficulty scaling
    gameSpeed += dt * 10;
    distance += (gameSpeed * dt) / 100;
    document.getElementById('dist-display').innerText = Math.floor(distance);

    // Hero Movement (Input Driven)
    const targetX = inputState.x;
    const diff = targetX - hero.x;
    hero.x += diff * window.gameConfig.sensitivity * 60 * dt;
    hero.tilt = diff * 0.1;

    // Clamp
    hero.x = Math.max(hero.w / 2, Math.min(cw - hero.w / 2, hero.x));

    // Obstacles
    if (Math.random() < 0.02) spawnObstacle();
    obstacles.forEach(obs => {
        obs.y += gameSpeed * dt;
        // Collision
        if (obs.active &&
            hero.x - hero.w / 2 < obs.x + obs.w &&
            hero.x + hero.w / 2 > obs.x &&
            hero.y - hero.h / 2 < obs.y + obs.h &&
            hero.y + hero.h / 2 > obs.y) {

            handleCollision();
        }
    });
    obstacles = obstacles.filter(o => o.y < ch + 100);

    // Pages
    if (Math.random() < 0.005) spawnPage();
    pages.forEach(p => {
        p.y += gameSpeed * dt;
        if (p.active &&
            hero.x - hero.w / 2 < p.x + p.w &&
            hero.x + hero.w / 2 > p.x &&
            hero.y - hero.h / 2 < p.y + p.h &&
            hero.y + hero.h / 2 > p.y) {

            p.active = false;
            score++;
            document.getElementById('score-display').innerText = `${score}/8`;
            playSfx('collect', { volume: 0.34 });
            showFeedback('success', score >= 8 ? 'Logs secured' : 'Log recovered');
            vibrate('light');
            shake = 5;
            // Particles
            for (let i = 0; i < 10; i++) particles.push(new Particle(p.x, p.y, '#ffffff'));

            if (score >= 8 && !successPlayed) {
                successPlayed = true;
                playSfx('success', { volume: 0.38 });
                showFeedback('success', 'Mission complete');
            }
        }
    });
    pages = pages.filter(p => p.y < ch + 100);

    // Particles
    particles.forEach(p => p.update(dt));
    particles = particles.filter(p => p.life > 0);

    // Shake decay
    if (shake > 0) shake -= dt * 20;
    if (shake < 0) shake = 0;
}

function handleCollision() {
    vibrate('heavy');
    shake = 20;
    setState('GAMEOVER');

    // Explosion particles
    for (let i = 0; i < 30; i++) {
        particles.push(new Particle(hero.x, hero.y, '#ff0044'));
    }
}

/**
 * §3 Rendering
 */
function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, ch);
    gradient.addColorStop(0, '#06101f');
    gradient.addColorStop(0.55, '#09162d');
    gradient.addColorStop(1, '#04070f');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();

    const horizon = ch * 0.24;
    const laneCenter = hero.x || cw / 2;
    const laneDrift = (laneCenter - cw / 2) * 0.12;

    ctx.globalAlpha = 0.16;
    for (let i = 0; i < 4; i++) {
        const glowWidth = cw * (0.12 + i * 0.06);
        ctx.fillStyle = i % 2 === 0 ? '#6ff7ff' : '#ff5ca8';
        ctx.beginPath();
        ctx.moveTo(cw / 2 + laneDrift - glowWidth, ch);
        ctx.lineTo(cw / 2 + laneDrift - glowWidth * 0.1, horizon);
        ctx.lineTo(cw / 2 + laneDrift + glowWidth * 0.1, horizon);
        ctx.lineTo(cw / 2 + laneDrift + glowWidth, ch);
        ctx.closePath();
        ctx.fill();
    }

    ctx.globalAlpha = 1;
    const offset = (Date.now() / 1000 * gameSpeed) % 90;

    ctx.strokeStyle = 'rgba(111, 247, 255, 0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
        const ratio = i / 8;
        const baseX = ratio * cw;
        ctx.moveTo(baseX, ch);
        ctx.lineTo(cw / 2 + (baseX - cw / 2) * 0.16 - laneDrift, horizon);
    }
    for (let i = 0; i < ch; i += 70) {
        const y = horizon + ((i + offset) % (ch - horizon + 70));
        const perspective = (y - horizon) / Math.max(1, ch - horizon);
        const span = cw * (0.16 + perspective * 0.92);
        ctx.moveTo(cw / 2 - span / 2 - laneDrift * 0.5, y);
        ctx.lineTo(cw / 2 + span / 2 - laneDrift * 0.5, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 224, 130, 0.28)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const centerPulse = ((Date.now() / 14) % 44);
    for (let y = horizon; y < ch; y += 44) {
        const pulseY = y + centerPulse;
        if (pulseY > ch) continue;
        const perspective = (pulseY - horizon) / Math.max(1, ch - horizon);
        const dash = 16 + perspective * 20;
        ctx.moveTo(cw / 2 - laneDrift * 0.3, pulseY);
        ctx.lineTo(cw / 2 - laneDrift * 0.3, Math.min(ch, pulseY + dash));
    }
    ctx.stroke();

    for (let i = 0; i < 12; i++) {
        const x = (i * 193 + Date.now() * 0.02) % (cw + 120) - 60;
        const y = ((i * 91) % Math.max(ch * 0.4, 1));
        ctx.fillStyle = i % 2 === 0 ? 'rgba(111, 247, 255, 0.25)' : 'rgba(255, 92, 168, 0.18)';
        ctx.fillRect(x, y, 2, 2);
    }

    ctx.restore();
}

function drawObstacle(o) {
    if (o.type === 'tree') {
        ctx.save();
        const trunkX = o.x + o.w / 2;
        const baseY = o.y + o.h;
        ctx.fillStyle = '#102139';
        ctx.beginPath();
        ctx.moveTo(trunkX, o.y - 6);
        ctx.lineTo(o.x + o.w + 6, baseY);
        ctx.lineTo(o.x - 6, baseY);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 92, 168, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#08111f';
        ctx.fillRect(trunkX - 6, baseY - 24, 12, 24);

        ctx.shadowColor = '#ff5ca8';
        ctx.shadowBlur = 12;
        ctx.fillStyle = 'rgba(255, 92, 168, 0.18)';
        ctx.beginPath();
        ctx.moveTo(trunkX, o.y + 10);
        ctx.lineTo(o.x + o.w, baseY);
        ctx.lineTo(o.x, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    } else {
        ctx.save();
        const stripe = Math.sin((Date.now() + o.y * 8) * 0.04) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255, 92, 168, ${0.4 + stripe * 0.35})`;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = 'rgba(255, 224, 130, 0.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        if (Math.random() > 0.4) {
            ctx.fillRect(o.x + 4, o.y + Math.random() * (o.h - 6), o.w - 8, 2);
        }
        ctx.restore();
    }
}

function drawPage(p) {
    if (!p.active) return;
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.rotate(Math.sin((Date.now() + p.x * 10) * 0.01) * 0.18);

    ctx.fillStyle = '#f8fbff';
    ctx.shadowColor = '#6ff7ff';
    ctx.shadowBlur = 14;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0f2740';
    ctx.fillRect(-p.w / 2 + 5, -p.h / 2 + 7, p.w - 10, 3);
    ctx.fillRect(-p.w / 2 + 5, -p.h / 2 + 14, p.w - 14, 3);
    ctx.fillStyle = '#ff5ca8';
    ctx.fillRect(p.w / 2 - 8, -p.h / 2, 8, 10);
    ctx.restore();
}

function drawFallbackHero() {
    const bob = Math.sin(Date.now() * 0.014) * 3;
    ctx.translate(0, bob);

    ctx.shadowColor = '#6ff7ff';
    ctx.shadowBlur = 18;

    ctx.fillStyle = '#1f3556';
    ctx.beginPath();
    ctx.roundRect(-18, -34, 36, 56, 14);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffe9c7';
    ctx.beginPath();
    ctx.arc(0, -42, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#08111f';
    ctx.beginPath();
    ctx.arc(-4, -44, 2, 0, Math.PI * 2);
    ctx.arc(4, -44, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#08111f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -38, 4, 0.15, Math.PI - 0.15);
    ctx.stroke();

    ctx.fillStyle = '#ff5ca8';
    ctx.fillRect(-16, -18, 32, 8);
    ctx.fillStyle = '#6ff7ff';
    ctx.fillRect(-10, -12, 20, 4);

    ctx.fillStyle = '#0d172a';
    ctx.fillRect(-13, 18, 10, 20);
    ctx.fillRect(3, 18, 10, 20);

    ctx.fillStyle = '#1a2235';
    ctx.beginPath();
    ctx.roundRect(-28, 34, 56, 10, 8);
    ctx.fill();
    ctx.fillStyle = '#ffe082';
    ctx.fillRect(-20, 36, 40, 3);

    ctx.fillStyle = '#6ff7ff';
    ctx.beginPath();
    ctx.arc(-16, 44, 4, 0, Math.PI * 2);
    ctx.arc(16, 44, 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlayer() {
    ctx.save();
    ctx.translate(hero.x, hero.y);
    ctx.rotate(hero.tilt * 0.05);

    const img = document.getElementById('asset_player');
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.shadowColor = '#6ff7ff';
        ctx.shadowBlur = 16;
        ctx.drawImage(img, -hero.w / 2, -hero.h / 2, hero.w, hero.h);

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 224, 130, 0.78)';
        ctx.lineWidth = 2;
        ctx.strokeRect(-hero.w / 2 + 2, hero.h / 2 - 12, hero.w - 4, 8);
    } else {
        drawFallbackHero();
    }

    ctx.restore();
}

function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (shake > 0) {
        const dx = (Math.random() - 0.5) * shake;
        const dy = (Math.random() - 0.5) * shake;
        ctx.translate(dx, dy);
    }

    drawBackground();

    obstacles.forEach(drawObstacle);
    pages.forEach(drawPage);
    drawPlayer();

    particles.forEach(p => p.draw(ctx));

    const rad = ctx.createRadialGradient(cw / 2, ch * 0.44, ch * 0.12, cw / 2, ch / 2, ch);
    rad.addColorStop(0, 'transparent');
    rad.addColorStop(1, 'rgba(0,0,0,0.76)');
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, cw, ch);
}

/**
 * §4 Lifecycle & Input
 */
const inputState = { x: 0, active: false };

function getPointerClientX(e) {
    if (typeof e.clientX === 'number') return e.clientX;
    const touch = e.touches?.[0] || e.changedTouches?.[0];
    return touch ? touch.clientX : null;
}

function handleGameplayStart(e) {
    if (gameState !== 'PLAYING') return;
    e.preventDefault();
    unlockAudio();

    const rect = canvas.getBoundingClientRect();
    const clientX = getPointerClientX(e);
    const pointerX = typeof clientX === 'number' ? clientX : rect.left + rect.width / 2;

    inputState.active = true;
    inputState.x = pointerX - rect.left;
}

function handleInputMove(e) {
    if (!inputState.active || gameState !== 'PLAYING') return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = getPointerClientX(e);
    if (typeof clientX === 'number') {
        inputState.x = clientX - rect.left;
    }
}

function handleInputEnd() {
    inputState.active = false;
}

function restartGame() {
    unlockAudio();
    playSfx('ui', { volume: 0.26 });
    initGame();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Loop error:", e);
    }
    requestAnimationFrame(loop);
}

// Initialization
window.addEventListener('DOMContentLoaded', () => {
    // [agent-note][stage4] repaired: mobile-action-path | scope: gameplay input -> canvas, restart CTA -> native click
    canvas.addEventListener('pointerdown', handleGameplayStart, { passive: false });
    canvas.addEventListener('pointermove', handleInputMove, { passive: false });
    window.addEventListener('pointerup', handleInputEnd, { passive: false });
    window.addEventListener('pointercancel', handleInputEnd, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', restartGame);

    // Resize Observer
    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        const { width, height } = entry.contentRect;

        // Update logical dimensions
        cw = width;
        ch = height;
        dpr = window.devicePixelRatio || 1;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Clamp hero
        if (initialized) {
            hero.x = Math.max(30, Math.min(cw - 30, hero.x));
            hero.y = ch - 150;
        } else {
            // First time init
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
        }
    });

    ro.observe(canvas);
});

// Helper for config updates
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
};
</script>
