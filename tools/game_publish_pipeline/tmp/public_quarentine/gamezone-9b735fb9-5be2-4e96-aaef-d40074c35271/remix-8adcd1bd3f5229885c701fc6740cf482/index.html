<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hogwarts Herbology Market</title>
    <!-- [agent-note][world-design] remapped-font: title -> Cinzel, ui -> Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #182f35;
            --sky-bottom: #31583d;
            --panel-bg: rgba(248, 233, 187, 0.9);
            --panel-border: rgba(255, 246, 207, 0.95);
            --panel-shadow: rgba(30, 24, 12, 0.28);
            --mint: #8acb76;
            --mint-deep: #315d31;
            --soil: #8b5a2b;
            --soil-deep: #4f3119;
            --gold: #f5c84b;
            --gold-deep: #b88622;
            --berry: #7d2948;
            --berry-deep: #54192e;
            --ink: #24190f;
            --hud-text: #2a2415;
            --soft-text: #5d4a27;
            --white: #fff8df;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 5%, rgba(245,200,75,0.24), transparent 38%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--ink);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent 0 10%, rgba(255,246,207,0.12) 10% 11%, transparent 11% 22%, rgba(255,246,207,0.1) 22% 23%, transparent 23%),
                radial-gradient(circle at 15% 20%, rgba(245,200,75,0.24), transparent 18%),
                radial-gradient(circle at 85% 14%, rgba(116,202,164,0.2), transparent 16%);
            opacity: 0.9;
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }

        .ambient-magic {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
            opacity: 0.7;
            background:
                radial-gradient(circle at 18% 22%, rgba(245, 200, 75, 0.13), transparent 12%),
                radial-gradient(circle at 82% 18%, rgba(79, 164, 244, 0.1), transparent 14%),
                linear-gradient(90deg, transparent 0 14%, rgba(255, 246, 207, 0.06) 14.2% 14.7%, transparent 15% 34%, rgba(255, 246, 207, 0.05) 34.3% 34.8%, transparent 35%);
        }

        .ambient-magic::before,
        .ambient-magic::after {
            content: "";
            position: absolute;
            inset: -20%;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255, 246, 207, 0.62) 0 1.5px, transparent 2.5px),
                radial-gradient(circle, rgba(245, 200, 75, 0.45) 0 1px, transparent 2px);
            background-size: 118px 118px, 164px 164px;
            animation: driftMotes 18s linear infinite;
            mix-blend-mode: screen;
        }

        .ambient-magic::after {
            opacity: 0.55;
            transform: rotate(18deg);
            animation-duration: 27s;
            animation-direction: reverse;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--panel-border);
            box-shadow: 0 10px 28px var(--panel-shadow);
        }

        .hud-shell {
            position: relative;
            overflow: hidden;
        }

        .hud-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 45%);
        }

        .font-display {
            font-family: 'Cinzel', 'Rajdhani', system-ui, serif;
            letter-spacing: 0.06em;
        }

        .hud-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--soft-text);
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .tool-strip {
            display: flex;
            gap: 0.5rem;
            padding: 0.55rem;
            border-radius: 1.4rem;
            background: rgba(255,255,255,0.82);
            border: 2px solid rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 24px rgba(34, 88, 63, 0.16);
        }

        .tool-btn {
            position: relative;
            width: 4rem;
            height: 4rem;
            padding: 0.25rem;
            border: 0;
            border-radius: 1rem;
            background: linear-gradient(180deg, #fff8df, #ead9a5);
            border-bottom: 4px solid rgba(76, 52, 22, 0.28);
            color: var(--hud-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.08rem;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 0 6px 12px rgba(43, 82, 56, 0.12);
        }

        .tool-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
            box-shadow: 0 2px 6px rgba(43, 82, 56, 0.1);
        }

        .tool-btn.active {
            background: linear-gradient(180deg, #f5d56a, #b88622);
            color: #24190f;
            border-bottom-color: #7a5516;
            box-shadow: 0 7px 0 #7a5516, 0 0 18px rgba(245, 200, 75, 0.38);
            transform: translateY(-2px);
        }

        .tool-btn span:last-child {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .score-card {
            min-width: 132px;
            padding: 0.9rem 1rem 0.8rem;
            border-radius: 1.15rem;
        }

        .score-value {
            font-family: 'Cinzel', 'Rajdhani', system-ui, serif;
            font-size: 1.7rem;
            line-height: 1.1;
            color: var(--gold-deep);
            text-shadow: 0 2px 0 rgba(255,255,255,0.9);
        }

        .market-btn,
        .primary-btn,
        .shop-action,
        .close-btn {
            border: 0;
            cursor: pointer;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .market-btn,
        .primary-btn {
            width: 100%;
            border-radius: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        }

        .market-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.72rem 1rem;
            background: linear-gradient(180deg, #f7d975, #c2912a);
            color: #3a2508;
            box-shadow: 0 6px 0 #8c6419;
            font-size: 0.98rem;
        }

        .primary-btn {
            padding: 1rem 1.2rem;
            background: linear-gradient(180deg, #476f3f, #213c28);
            color: var(--white);
            box-shadow: 0 6px 0 #142319, 0 0 22px rgba(245, 200, 75, 0.24);
            font-size: 1.05rem;
        }

        .market-btn:active,
        .primary-btn:active,
        .shop-action:active,
        .close-btn:active {
            transform: translateY(3px);
            filter: brightness(0.98);
        }

        .seed-badge {
            position: absolute;
            top: -0.38rem;
            right: -0.38rem;
            min-width: 2rem;
            padding: 0.12rem 0.4rem;
            border-radius: 999px;
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.16);
            background: var(--mint-deep);
        }

        .shop-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 1rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .shop-card:active {
            transform: scale(0.98);
        }

        .shop-card.active {
            border: 2px solid rgba(80, 175, 99, 0.95);
            box-shadow: 0 0 0 3px rgba(132, 230, 145, 0.25);
        }

        .crop-badge {
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            background: linear-gradient(180deg, #f8fff6, #dff4df);
            box-shadow: inset 0 -4px 0 rgba(60, 126, 73, 0.12);
        }

        .shop-copy-title {
            font-size: 1rem;
            font-weight: 700;
            color: #284b3d;
            line-height: 1.1;
        }

        .shop-copy-meta {
            font-size: 0.78rem;
            color: #607a6e;
        }

        .shop-action {
            padding: 0.45rem 0.72rem;
            border-radius: 0.8rem;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            white-space: nowrap;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
        }

        .shop-action.equip {
            background: linear-gradient(180deg, #6adf7c, #31af54);
            color: #fff;
        }

        .shop-action.buy {
            background: linear-gradient(180deg, #ffe783, #ffc93e);
            color: #7a4b06;
        }

        .shop-pill {
            font-size: 0.78rem;
            font-weight: 700;
            color: #5f776b;
            white-space: nowrap;
        }

        .shop-pill.active {
            color: #2b8a43;
        }

        .shop-pill.locked {
            color: #9ba7a0;
        }

        .modal-shell {
            width: min(100%, 26rem);
            max-height: 82vh;
            border-radius: 1.6rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .close-btn {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            background: rgba(224, 235, 228, 0.95);
            color: #496558;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .shop-grid {
            display: grid;
            gap: 0.65rem;
            overflow-y: auto;
            padding-right: 0.15rem;
        }

        .start-card {
            width: min(100%, 25rem);
            margin: 1rem;
            padding: 1.45rem 1.35rem 1.3rem;
            border-radius: 1.8rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .start-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.7), transparent 42%),
                linear-gradient(145deg, rgba(134, 246, 154, 0.2), rgba(255, 229, 121, 0.3));
            pointer-events: none;
        }

        .start-inner {
            position: relative;
            z-index: 1;
        }

        .start-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.32rem;
            margin-bottom: 0.45rem;
            padding: 0.28rem 0.65rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            color: #4d6a5c;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-bottom: 0.35rem;
        }

        .hero-mascot {
            position: relative;
            width: 4.75rem;
            height: 4.75rem;
            border-radius: 1.3rem;
            background:
                radial-gradient(circle at 48% 22%, rgba(255, 246, 207, 0.92), transparent 22%),
                linear-gradient(180deg, #fffef5, #dbffd5);
            border: 3px solid rgba(255,255,255,0.92);
            box-shadow: 0 10px 24px rgba(38, 111, 68, 0.18), 0 0 18px rgba(245, 200, 75, 0.22);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            animation: mascotBob 2.1s ease-in-out infinite;
        }

        .hero-mascot::before {
            content: "";
            position: absolute;
            width: 3rem;
            height: 1.15rem;
            bottom: 0.5rem;
            border-radius: 0.25rem 0.25rem 0.65rem 0.65rem;
            background: linear-gradient(180deg, #ad6b2f, #70431e);
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.22);
        }

        .hero-mascot::after {
            content: "✦";
            position: absolute;
            top: 0.34rem;
            right: 0.48rem;
            color: var(--gold);
            font-size: 1rem;
            filter: drop-shadow(0 0 7px rgba(245, 200, 75, 0.72));
        }

        .hero-mascot-face {
            font-size: 2.45rem;
            filter: drop-shadow(0 2px 0 rgba(255,255,255,0.75));
        }

        .hero-title {
            margin: 0;
            color: #2d8d45;
            text-shadow: 0 3px 0 rgba(255,255,255,0.82);
            font-family: 'Cinzel', 'Rajdhani', system-ui, serif;
            font-size: clamp(2.1rem, 8.5vw, 3.15rem);
            line-height: 0.9;
            letter-spacing: 0.08em;
        }

        .hero-subtitle {
            margin: 0.15rem 0 0.3rem;
            color: #3e584d;
            font-size: 1.02rem;
            font-weight: 700;
        }

        .hero-copy {
            margin: 0 0 1rem;
            color: #667d72;
            font-size: 0.9rem;
            line-height: 1.28;
        }

        .hero-tray {
            display: flex;
            justify-content: center;
            gap: 0.55rem;
            margin: 0 0 1rem;
            flex-wrap: wrap;
        }

        .hero-chip {
            min-width: 4.7rem;
            padding: 0.45rem 0.6rem;
            border-radius: 0.95rem;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.88);
            box-shadow: inset 0 -3px 0 rgba(61, 142, 69, 0.08);
        }

        .hero-chip span {
            display: block;
            line-height: 1;
        }

        .hero-chip .emoji {
            font-size: 1.15rem;
            margin-bottom: 0.22rem;
        }

        .hero-chip .label {
            color: #597164;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 44, 30, 0.28);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .hidden { display: none !important; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .z-10 { z-index: 10; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .grid { display: grid; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .flex-col { flex-direction: column; }
        .gap-2 { gap: 0.5rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .select-none { user-select: none; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(92, 128, 110, 0.55);
            border-radius: 999px;
        }

        @keyframes mascotBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes driftMotes {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); }
            100% { transform: translate3d(36px, -92px, 0) rotate(8deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .ambient-magic::before,
            .ambient-magic::after,
            .hero-mascot {
                animation: none;
            }
        }

        @media (max-width: 640px) {
            #hud {
                top: 0.75rem;
                left: 0.75rem;
                right: 0.75rem;
                gap: 0.55rem;
            }

            .score-card {
                min-width: 108px;
                padding: 0.72rem 0.78rem;
            }

            .score-value {
                font-size: 1.7rem;
            }

            .market-btn {
                padding: 0.62rem 0.8rem;
                font-size: 0.9rem;
            }

            .tool-strip {
                gap: 0.25rem;
                padding: 0.34rem;
            }

            .tool-btn {
                width: 3.05rem;
                height: 3.05rem;
                border-radius: 0.82rem;
            }

            .tool-btn span:first-child {
                font-size: 1.35rem;
            }

            .tool-btn span:last-child {
                font-size: 9px;
            }

            .modal-shell {
                padding: 0.9rem;
                max-height: 84vh;
            }

            .hero-row {
                flex-direction: column;
                gap: 0.4rem;
            }

            .hero-mascot {
                width: 4.2rem;
                height: 4.2rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: start/ui/plant/water/harvest/error/menu -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Garden Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_start" data-editable="audio" data-label="SFX Start Game" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_plant" data-editable="audio" data-label="SFX Plant" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_water" data-editable="audio" data-label="SFX Water" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
<audio id="sfx_harvest" data-editable="audio" data-label="SFX Harvest" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
<audio id="sfx_error" data-editable="audio" data-label="SFX Error" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "growthSpeed": { "type": "number", "label": "Global Growth Multiplier", "value": 1, "min": 0.1, "max": 5 },
    "gridSize": { "type": "number", "label": "Grid Size", "value": 6, "min": 4, "max": 10 }
}
</script>

<!-- UI -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    <div class="ambient-magic" aria-hidden="true"></div>

    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start hidden pointer-events-none z-10">
        <div class="flex flex-col gap-2 pointer-events-auto">
            <div class="glass hud-shell score-card">
                <span class="hud-label">Herbology Funds</span>
                <span class="score-value">₲<span id="scoreVal">0</span></span>
            </div>
            <button onclick="toggleShop()" class="market-btn">
                 <span>📜</span>
                 <span>SEED CABINET</span>
            </button>
        </div>

        <div class="tool-strip pointer-events-auto">
            <button id="tool-plow" class="tool-btn active" onclick="selectTool('plow')">
                 <span>🪄</span>
                 <span>PREP</span>
            </button>
            <button id="tool-seed" class="tool-btn" onclick="selectTool('seed')">
                <span id="active-seed-icon">🌱</span>
                <span>PLANT</span>
                <span id="seed-cost-badge" class="seed-badge">Free</span>
            </button>
            <button id="tool-water" class="tool-btn" onclick="selectTool('water')">
                 <span>💧</span>
                 <span>WATER</span>
            </button>
            <button id="tool-harvest" class="tool-btn" onclick="selectTool('harvest')">
                 <span>🧺</span>
                 <span>GATHER</span>
            </button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="absolute inset-0 z-40 screen-overlay hidden flex items-center justify-center">
        <div class="glass modal-shell">
            <div class="modal-header">
                <h2 class="font-display" style="margin:0; font-size:1.55rem; color:#315d31;">SEED CABINET</h2>
                <button onclick="toggleShop()" class="close-btn">✕</button>
            </div>
            <div id="shop-grid" class="shop-grid">
                <!-- Shop items injected by JS -->
            </div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: harvest/invalid feedback -> catalogs/gifs.json -->
    <div id="gif-feedback" class="absolute right-4 z-40 hidden pointer-events-none" style="bottom: 1rem; width: min(30vw, 8rem);">
        <img id="gif-feedback-img" alt="" style="width:100%; border-radius: 1rem; border: 3px solid rgba(255,255,255,0.92); box-shadow: 0 10px 24px rgba(26, 68, 49, 0.25); object-fit: cover;">
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center screen-overlay">
        <div class="glass start-card">
            <div class="start-inner">
                <div class="start-kicker"><span>🕯️</span><span>Greenhouse One</span></div>
                <div class="hero-row">
                    <div class="hero-mascot" aria-hidden="true">
                        <div class="hero-mascot-face">🪴</div>
                    </div>
                    <h1 class="hero-title">HOGWARTS<br>HERBOLOGY</h1>
                </div>
                <p class="hero-subtitle">Tend magical greenhouse beds for Professor Sprout's market lesson.</p>
                <p class="hero-copy">Prep beds, plant spell seeds, water with care, then gather potion ingredients for Galleons.</p>
                <div class="hero-tray" aria-hidden="true">
                    <div class="hero-chip"><span class="emoji">🌱</span><span class="label">Mandrake</span></div>
                    <div class="hero-chip"><span class="emoji">🌿</span><span class="label">Gillyweed</span></div>
                    <div class="hero-chip"><span class="emoji">🎃</span><span class="label">Feast</span></div>
                </div>
                <button id="start-btn" class="primary-btn">ENTER GREENHOUSE</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * DATA DEFS
 */
const CROPS = {
    wheat: {
        id: 'wheat',
        name: 'Mandrake Sprout',
        icon: '🌱',
        color: '#9dcc5a',
        cost: 0,
        unlockPrice: 0,
        sellPrice: 15,
        growthTime: 3,
        desc: "Free starter root for Greenhouse One."
    },
    corn: {
        id: 'corn',
        name: 'Gillyweed Tassel',
        icon: '🌿',
        color: '#46b38a',
        cost: 5,
        unlockPrice: 150,
        sellPrice: 40,
        growthTime: 5,
        desc: "Slower potion herb, stronger profit."
    },
    pumpkin: {
        id: 'pumpkin',
        name: 'Enchanted Pumpkin',
        icon: '🎃',
        color: '#e67e22',
        cost: 20,
        unlockPrice: 500,
        sellPrice: 120,
        growthTime: 10,
        desc: "Premium feast ingredient for big payouts."
    }
};

/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.sfxVolume = {
            sfx_start: 0.5,
            sfx_ui: 0.35,
            sfx_plant: 0.32,
            sfx_water: 0.28,
            sfx_harvest: 0.42,
            sfx_error: 0.28
        };
        this.fallbackMap = {
            sfx_start: 'buy',
            sfx_ui: 'buy',
            sfx_plant: 'plow',
            sfx_water: 'water',
            sfx_harvest: 'coin',
            sfx_error: 'error'
        };
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    async loadSound(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const response = await fetch(el.src, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            this.buffers[id] = { error: true };
        }
    }

    playBgm() {
        if (!this.unlocked) return;
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.2;
        if (el.paused) el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, minGap = 90) {
        if (!this.unlocked) return;
        const nowStamp = performance.now();
        if (this.lastPlayedAt[id] && nowStamp - this.lastPlayedAt[id] < minGap) return;
        this.lastPlayedAt[id] = nowStamp;

        const bufferInfo = this.buffers[id];
        if (bufferInfo && !bufferInfo.error) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = bufferInfo;
            gain.gain.value = this.sfxVolume[id] ?? 0.3;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            const el = document.getElementById(id);
            if (el) {
                const clone = el.cloneNode(true);
                clone.volume = this.sfxVolume[id] ?? 0.3;
                clone.play().catch(() => {
                    this.synthesize(this.fallbackMap[id] || 'buy');
                });
            } else {
                this.synthesize(this.fallbackMap[id] || 'buy');
            }
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'plow') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start();
            osc.stop(now + 0.1);
        } else if (type === 'water') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        } else if (type === 'buy' || type === 'coin') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.linearRampToValueAtTime(680, now + 0.12);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.24);
            osc.start();
            osc.stop(now + 0.24);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(170, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        }
    }
}

/**
 * GAME ENGINE
 */
const audioManager = new AudioManager();

// Config
let gameConfig = { growthSpeed: 1, gridSize: 6 };

// State
let money = 0;
let grid = [];
let particles = [];
let floatingTexts = [];
let currentTool = 'plow';
let unlockedCrops = ['wheat'];
let activeCropId = 'wheat';
let lastTime = 0;
let camera = { x: 0, y: 0 };

// Constants
const TILE_SIZE = 64;
const BLOCK_HEIGHT = 16;
const COLORS = {
    grass: '#5f9d4b',
    grassDark: '#315d31',
    soil: '#8b5a2b',
    soilDark: '#603d1b',
    water: '#4fa4f4',
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const startScreen = document.getElementById('start-screen');
const hud = document.getElementById('hud');
const gifFeedback = document.getElementById('gif-feedback');
const gifFeedbackImg = document.getElementById('gif-feedback-img');
const GIFS = {
    harvest: 'https://i.giphy.com/l4FGpPki5v2Bcd6Ss.webp',
    fail: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
};
let gifTimer = null;

// Initialize
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.updateGameConfig = (key, val) => {
    if (gameConfig.hasOwnProperty(key)) {
        gameConfig[key] = val;
        if (key === 'gridSize') initGrid();
    }
};

function init() {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;

    ['sfx_start', 'sfx_ui', 'sfx_plant', 'sfx_water', 'sfx_harvest', 'sfx_error'].forEach(id => {
        audioManager.loadSound(id);
    });

    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleMove, { passive: false });
    canvas.addEventListener('pointerup', () => {}, { passive: false });
    canvas.addEventListener('pointercancel', () => {}, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        audioManager.unlock();
        audioManager.playSfx('sfx_start', 0);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        initGrid();
        updateShopUI();
        requestAnimationFrame(gameLoop);
    });
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    camera.x = window.innerWidth / 2;
    camera.y = window.innerHeight / 2 - (gameConfig.gridSize * TILE_SIZE / 4);
}

function initGrid() {
    grid = [];
    const size = gameConfig.gridSize;
    for (let x = 0; x < size; x++) {
        grid[x] = [];
        for (let y = 0; y < size; y++) {
            grid[x][y] = {
                state: 'grass',
                cropType: null,
                timer: 0,
                scale: 0,
                heightOffset: 0,
                watered: false
            };
        }
    }
}

// Isometric Maths
function isoToScreen(gx, gy) {
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    return {
        x: (gx - gy) * tileW + camera.x,
        y: (gx + gy) * tileH + camera.y
    };
}

function screenToIso(sx, sy) {
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    const gy = ((adjY / tileH) - (adjX / tileW)) / 2;
    const gx = ((adjY / tileH) + (adjX / tileW)) / 2;
    return { x: Math.floor(gx), y: Math.floor(gy) };
}

// Game Loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            const cell = grid[x][y];
            if (cell.heightOffset > 0) cell.heightOffset = Math.max(0, cell.heightOffset - dt * 50);

            if (cell.state === 'seeded' && cell.watered) {
                cell.timer += dt;
                const cropData = CROPS[cell.cropType];
                const requiredTime = cropData.growthTime * gameConfig.growthSpeed;
                cell.scale = Math.min(1, cell.timer / requiredTime);

                if (cell.timer >= requiredTime) {
                    cell.state = 'ripe';
                    cell.scale = 1;
                    cell.heightOffset = 10;
                }
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        p.vz -= dt * 2;
        if (p.z < 0) { p.z = 0; p.vz *= -0.5; }
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        t.y -= dt * 30;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    drawWorldBackdrop();

    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            drawTile(x, y, grid[x][y]);
        }
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        const size = p.size * (p.life / 0.5);
        ctx.fillRect(p.x, p.y - p.z, size, size);
    });

    ctx.textAlign = 'center';
    ctx.font = '700 24px "Rajdhani"';
    floatingTexts.forEach(t => {
        ctx.fillStyle = `rgba(255, 255, 255, ${t.life})`;
        ctx.strokeStyle = `rgba(40, 73, 49, ${t.life * 0.5})`;
        ctx.lineWidth = 4;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
    });
}

function drawWorldBackdrop() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const t = performance.now() * 0.001;
    const grd = ctx.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#101f31');
    grd.addColorStop(0.46, '#254d3d');
    grd.addColorStop(1, '#e4d19a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, w, h);

    const candleGlow = ctx.createRadialGradient(w * 0.5, h * 0.08, 10, w * 0.5, h * 0.08, Math.max(180, w * 0.35));
    candleGlow.addColorStop(0, 'rgba(245, 200, 75, 0.38)');
    candleGlow.addColorStop(1, 'rgba(245, 200, 75, 0)');
    ctx.fillStyle = candleGlow;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(255, 246, 207, 0.15)';
    ctx.lineWidth = 2;
    for (let i = -2; i <= 8; i++) {
        const x = i * w / 6;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + w * 0.16, h * 0.62);
        ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255, 246, 207, 0.08)';
    ctx.lineWidth = 1;
    for (let y = h * 0.12; y < h * 0.62; y += 54) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y + Math.sin(t + y * 0.01) * 4);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(11, 23, 23, 0.46)';
    ctx.beginPath();
    ctx.moveTo(0, h * 0.43);
    for (let i = 0; i <= 8; i++) {
        const x = i * w / 8;
        ctx.lineTo(x, h * 0.39 - (i % 2) * 24);
        ctx.lineTo(x + w / 18, h * 0.43);
    }
    ctx.lineTo(w, h * 0.58);
    ctx.lineTo(0, h * 0.58);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(21, 32, 24, 0.48)';
    for (let i = 0; i < 7; i++) {
        const x = i * w / 6 - 20;
        ctx.fillRect(x, h * 0.18, 18, h * 0.5);
        ctx.fillRect(x - 18, h * 0.36, 54, 12);
    }

    const houseColors = ['#7d2948', '#315d31', '#b88622', '#1e4f76'];
    for (let i = 0; i < 4; i++) {
        const x = w * (0.18 + i * 0.21);
        const y = h * 0.18 + Math.sin(t * 0.7 + i) * 3;
        ctx.fillStyle = houseColors[i];
        ctx.beginPath();
        ctx.moveTo(x - 12, y);
        ctx.lineTo(x + 12, y);
        ctx.lineTo(x + 12, y + 54);
        ctx.lineTo(x, y + 43);
        ctx.lineTo(x - 12, y + 54);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 246, 207, 0.55)';
        ctx.fillRect(x - 1, y + 8, 2, 28);
    }

    ctx.fillStyle = 'rgba(245, 200, 75, 0.76)';
    for (let i = 0; i < 6; i++) {
        const x = (i + 0.5) * w / 6;
        const y = 34 + Math.sin(t + i) * 5;
        ctx.beginPath();
        ctx.ellipse(x, y, 5, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 246, 207, 0.34)';
        ctx.beginPath();
        ctx.arc(x, y, 18 + Math.sin(t * 2 + i) * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(245, 200, 75, 0.76)';
        ctx.fillRect(x - 1, y + 10, 2, 34);
    }

    for (let i = 0; i < 26; i++) {
        const x = (i * 97 + (t * 12)) % (w + 80) - 40;
        const y = h * 0.18 + ((i * 53 - t * 18) % (h * 0.48));
        const r = 1.2 + (i % 3) * 0.55;
        ctx.fillStyle = i % 4 === 0 ? 'rgba(79, 164, 244, 0.28)' : 'rgba(255, 246, 207, 0.32)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = 'rgba(90, 46, 24, 0.46)';
    ctx.fillRect(0, h * 0.72, w, h * 0.28);

    ctx.fillStyle = 'rgba(255, 246, 207, 0.12)';
    for (let i = 0; i < 7; i++) {
        const x = (i + 0.2) * w / 7;
        ctx.fillRect(x, h * 0.76, 46, 5);
        ctx.fillRect(x + 8, h * 0.79, 30, 5);
    }
}

function drawTile(gx, gy, cell) {
    const pos = isoToScreen(gx, gy);
    const x = pos.x;
    const y = pos.y + cell.heightOffset;
    const w = TILE_SIZE * 2;
    const h = TILE_SIZE;

    let topColor = COLORS.grass;
    let sideColor = COLORS.grassDark;

    if (cell.state !== 'grass') {
        topColor = cell.watered ? '#5c3d21' : COLORS.soil;
        sideColor = COLORS.soilDark;
    }

    ctx.fillStyle = sideColor;
    ctx.beginPath();
    ctx.moveTo(x, y + h/2);
    ctx.lineTo(x + w/2, y + h);
    ctx.lineTo(x + w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x, y + h/2 + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    const shine = ctx.createLinearGradient(x, y, x, y + h);
    shine.addColorStop(0, 'rgba(255,255,255,0.25)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (cell.state !== 'grass' && cell.state !== 'plowed' && cell.cropType) {
        const growth = cell.scale || 0.2;
        if (cell.cropType === 'wheat') {
            drawWheat(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'corn') {
            drawCorn(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'pumpkin') {
            drawPumpkin(ctx, x, y + h/2, growth, cell.state === 'ripe');
        }
    }
}

// Procedural Crop Drawers
function drawWheat(ctx, x, y, scale, isRipe) {
    const h = 38 * scale;
    if (isRipe) {
        const aura = ctx.createRadialGradient(x, y - h * 0.62, 2, x, y - h * 0.62, 30 * scale);
        aura.addColorStop(0, 'rgba(245, 200, 75, 0.42)');
        aura.addColorStop(1, 'rgba(245, 200, 75, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(x, y - h * 0.62, 30 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.strokeStyle = '#6b4b2c';
    ctx.lineWidth = Math.max(2, 3 * scale);
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(x, y - h * 0.28);
        ctx.quadraticCurveTo(x + i * 7, y - h * 0.08, x + i * 12, y + 8 * scale);
        ctx.stroke();
    }

    ctx.fillStyle = isRipe ? '#f0d07a' : '#d6c08d';
    ctx.beginPath();
    ctx.ellipse(x, y - h * 0.26, 9 * scale, 15 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = isRipe ? '#8bd76c' : '#67b557';
    for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.ellipse(x + i * 6 * scale, y - h * 0.72, 5 * scale, 15 * scale, i * 0.32, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = 'rgba(36, 25, 15, 0.75)';
    ctx.beginPath();
    ctx.arc(x - 3 * scale, y - h * 0.28, 1.5 * scale, 0, Math.PI * 2);
    ctx.arc(x + 3 * scale, y - h * 0.28, 1.5 * scale, 0, Math.PI * 2);
    ctx.fill();
}

function drawCorn(ctx, x, y, scale, isRipe) {
    const h = 50 * scale;
    ctx.strokeStyle = '#1f7f5c';
    ctx.lineWidth = Math.max(2, 4 * scale);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x - 3 * scale, y - h * 0.45, x, y - h);
    ctx.stroke();

    ctx.fillStyle = isRipe ? '#5ee0b0' : '#46b38a';
    for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.ellipse(x + i * 8 * scale, y - h * (0.38 + Math.abs(i) * 0.08), 6 * scale, 21 * scale, i * 0.44, 0, Math.PI * 2);
        ctx.fill();
    }

    if (scale > 0.58) {
        ctx.fillStyle = isRipe ? '#8ff7cf' : '#a9e8c9';
        ctx.beginPath();
        ctx.ellipse(x, y - h * 0.78, 8 * scale, 15 * scale, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 246, 207, 0.45)';
        ctx.lineWidth = Math.max(1, 2 * scale);
        ctx.beginPath();
        ctx.moveTo(x - 5 * scale, y - h * 0.82);
        ctx.lineTo(x + 5 * scale, y - h * 0.74);
        ctx.stroke();
    }
}

function drawPumpkin(ctx, x, y, scale, isRipe) {
    const r = 20 * scale;
    ctx.strokeStyle = '#2f9455';
    ctx.lineWidth = Math.max(2, 3 * scale);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 12 * scale, y - 8 * scale, x + 22 * scale, y - 2 * scale);
    ctx.stroke();

    if (isRipe) {
        ctx.strokeStyle = 'rgba(245, 200, 75, 0.52)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y - r + 5, r + 9 * scale, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.fillStyle = isRipe ? '#ef8f2f' : '#4fb968';
    ctx.beginPath();
    ctx.ellipse(x, y - r + 5, r * 1.08, r * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(104,55,16,0.2)';
    ctx.lineWidth = Math.max(1, 2 * scale);
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(x + i * r * 0.35, y - r + 5, r * 0.42, r * 0.86, 0, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.25, y - r - 1, r * 0.4, r * 0.62, -0.3, 0, Math.PI * 2);
    ctx.fill();

    if (scale > 0.6) {
        ctx.fillStyle = 'rgba(255, 246, 207, 0.82)';
        ctx.font = `${Math.max(8, 13 * scale)}px "Cinzel"`;
        ctx.textAlign = 'center';
        ctx.fillText('✦', x, y - r + 10);
    }
}

// Interaction
function handleInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const iso = screenToIso(sx, sy);

    if (iso.x >= 0 && iso.x < gameConfig.gridSize && iso.y >= 0 && iso.y < gameConfig.gridSize) {
        interact(iso.x, iso.y);
    }
}

function handleMove(e) { e.preventDefault(); }

function showGif(kind) {
    if (!gifFeedback || !gifFeedbackImg) return;
    gifFeedbackImg.src = GIFS[kind];
    gifFeedbackImg.alt = kind === 'harvest' ? 'celebration reaction' : 'failed action reaction';
    gifFeedback.classList.remove('hidden');
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => {
        gifFeedback.classList.add('hidden');
    }, kind === 'harvest' ? 1600 : 1200);
}

function interact(x, y) {
    const cell = grid[x][y];
    let success = false;
    const pos = isoToScreen(x, y);
    const activeCrop = CROPS[activeCropId];

    if (currentTool === 'plow') {
        if (cell.state === 'grass') {
            cell.state = 'plowed';
            spawnParticles(pos.x, pos.y, COLORS.soil, 5);
            audioManager.playSfx('sfx_plant');
            success = true;
        }
    } else if (currentTool === 'seed') {
        if (cell.state === 'plowed') {
            if (money >= activeCrop.cost) {
                money -= activeCrop.cost;
                updateMoney();
                cell.state = 'seeded';
                cell.cropType = activeCropId;
                cell.timer = 0;
                cell.watered = false;
                spawnParticles(pos.x, pos.y, activeCrop.color, 5);
                audioManager.playSfx('sfx_plant');
                if (activeCrop.cost > 0) addFloatingText(pos.x, pos.y - 40, `-₲${activeCrop.cost}`);
                success = true;
            } else {
                audioManager.playSfx('sfx_error', 120);
                showGif('fail');
                addFloatingText(pos.x, pos.y - 40, "Need Galleons!");
            }
        }
    } else if (currentTool === 'water') {
        if ((cell.state === 'seeded' || cell.state === 'ripe') && !cell.watered) {
            cell.watered = true;
            spawnParticles(pos.x, pos.y, COLORS.water, 8);
            audioManager.playSfx('sfx_water');
            success = true;
        }
    } else if (currentTool === 'harvest') {
        if (cell.state === 'ripe') {
            const crop = CROPS[cell.cropType];
            cell.state = 'plowed';
            cell.watered = false;
            cell.timer = 0;

            money += crop.sellPrice;
            updateMoney();

            spawnParticles(pos.x, pos.y, crop.color, 12);
            spawnParticles(pos.x, pos.y, '#ffcc00', 5);
            addFloatingText(pos.x, pos.y - 50, `+₲${crop.sellPrice}`);
            audioManager.playSfx('sfx_harvest');
            showGif('harvest');
            success = true;
        }
    }

    if (!success && currentTool !== 'seed') {
        audioManager.playSfx('sfx_error', 160);
        showGif('fail');
    }

    if (success) cell.heightOffset = 5;
}

// UI Logic
function updateMoney() {
    scoreEl.textContent = money;
    updateShopUI();
}

window.selectTool = (tool) => {
    currentTool = tool;
    audioManager.playSfx('sfx_ui', 80);
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.id === `tool-${tool}`) btn.classList.add('active');
    });
};

window.toggleShop = () => {
    const modal = document.getElementById('shop-modal');
    const opening = modal.classList.contains('hidden');
    modal.classList.toggle('hidden');
    audioManager.playSfx(opening ? 'sfx_ui' : 'sfx_error', 120);
    if (!modal.classList.contains('hidden')) updateShopUI();
};

function updateShopUI() {
    const gridEl = document.getElementById('shop-grid');
    gridEl.innerHTML = '';

    Object.values(CROPS).forEach(crop => {
        const isUnlocked = unlockedCrops.includes(crop.id);
        const isAffordable = money >= crop.unlockPrice;
        const isActive = activeCropId === crop.id;

        const card = document.createElement('div');
        card.className = `shop-card glass ${isActive ? 'active' : ''}`;

        let actionHtml = '';
        if (isUnlocked) {
            actionHtml = isActive
                ? `<span class="shop-pill active">ACTIVE</span>`
                : `<button onclick="selectCrop('${crop.id}')" class="shop-action equip">EQUIP</button>`;
        } else if (isAffordable) {
            actionHtml = `<button onclick="unlockCrop('${crop.id}')" class="shop-action buy">BUY ₲${crop.unlockPrice}</button>`;
        } else {
            actionHtml = `<span class="shop-pill locked">NEED ₲${crop.unlockPrice}</span>`;
        }

        card.innerHTML = `
            <div style="display:flex; align-items:center; gap:0.7rem; min-width:0;">
                <div class="crop-badge">${crop.icon}</div>
                <div style="min-width:0;">
                    <div class="shop-copy-title">${crop.name}</div>
                    <div class="shop-copy-meta">Sale: ₲${crop.sellPrice} · Seed: ₲${crop.cost}</div>
                </div>
            </div>
            <div>${actionHtml}</div>
        `;
        gridEl.appendChild(card);
    });
}

window.unlockCrop = (id) => {
    const crop = CROPS[id];
    if (money >= crop.unlockPrice) {
        money -= crop.unlockPrice;
        unlockedCrops.push(id);
        audioManager.playSfx('sfx_harvest');
        showGif('harvest');
        selectCrop(id);
        updateMoney();
    }
};

window.selectCrop = (id) => {
    activeCropId = id;
    const crop = CROPS[id];
    document.getElementById('active-seed-icon').textContent = crop.icon;
    const badge = document.getElementById('seed-cost-badge');
    badge.textContent = crop.cost === 0 ? 'Free' : `₲${crop.cost}`;
    badge.style.background = crop.cost === 0 ? 'var(--mint-deep)' : 'var(--berry)';

    selectTool('seed');
    updateShopUI();
};

// Juice
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y + TILE_SIZE / 2, z: 10,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            vz: Math.random() * 3 + 2,
            life: 1.0, color: color, size: Math.random() * 4 + 2
        });
    }
}

function addFloatingText(x, y, text) {
    floatingTexts.push({ x, y, text, life: 1.5 });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
