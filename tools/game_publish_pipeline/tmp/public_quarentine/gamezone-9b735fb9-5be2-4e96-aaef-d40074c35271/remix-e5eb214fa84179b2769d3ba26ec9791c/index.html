<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Sprout Sky Garden</title>
    <!-- [agent-note][stage4] remapped-font: display/ui -> catalogs/fonts.json using Bangers + Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #6fd6ff;
            --sky-mid: #baf2ff;
            --sky-bottom: #f0fff7;
            --panel-bg: rgba(255, 255, 255, 0.88);
            --panel-border: rgba(255, 255, 255, 0.95);
            --panel-shadow: rgba(19, 71, 52, 0.18);
            --mint: #8ff28b;
            --mint-deep: #2f8f46;
            --pipe: #35b85b;
            --pipe-deep: #1f7f3c;
            --soil: #8b5a2b;
            --soil-deep: #603d1b;
            --gold: #ffd94a;
            --gold-deep: #d79a1e;
            --berry: #ff6f76;
            --berry-deep: #d94f59;
            --storm-blue: #1d3f7a;
            --ink: #214337;
            --hud-text: #244837;
            --soft-text: #537364;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.85), transparent 40%),
                linear-gradient(180deg, var(--sky-top), var(--sky-mid) 58%, var(--sky-bottom));
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--ink);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35), transparent 18%),
                radial-gradient(circle at 85% 14%, rgba(255,240,186,0.28), transparent 16%),
                repeating-linear-gradient(90deg, transparent 0 38px, rgba(255,255,255,0.08) 39px 41px);
            opacity: 0.9;
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--panel-border);
            box-shadow: 0 10px 28px var(--panel-shadow);
        }

        .hud-shell {
            position: relative;
            overflow: hidden;
        }

        .hud-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 45%);
        }

        .font-display {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .hud-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--soft-text);
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .tool-strip {
            display: flex;
            gap: 0.5rem;
            padding: 0.55rem;
            border-radius: 1.4rem;
            background: rgba(255,255,255,0.82);
            border: 2px solid rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 24px rgba(34, 88, 63, 0.16);
        }

        .tool-btn {
            position: relative;
            width: 4rem;
            height: 4rem;
            padding: 0.25rem;
            border: 0;
            border-radius: 1rem;
            background: linear-gradient(180deg, #ffffff, #eefdf2);
            border-bottom: 4px solid rgba(62, 121, 76, 0.24);
            color: var(--hud-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.08rem;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 0 6px 12px rgba(43, 82, 56, 0.12);
        }

        .tool-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
            box-shadow: 0 2px 6px rgba(43, 82, 56, 0.1);
        }

        .tool-btn.active {
            background: linear-gradient(180deg, #9af58f, #62c95d);
            color: #17321e;
            border-bottom-color: #2b8340;
            box-shadow: 0 7px 0 #2b8340, 0 0 18px rgba(98, 201, 93, 0.38);
            transform: translateY(-2px);
        }

        .tool-btn span:last-child {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .score-card {
            min-width: 132px;
            padding: 0.9rem 1rem 0.8rem;
            border-radius: 1.15rem;
        }

        .score-value {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: 1.7rem;
            line-height: 1.1;
            color: var(--mint-deep);
            text-shadow: 0 2px 0 rgba(255,255,255,0.9);
        }

        .route-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.28rem;
            margin-top: 0.28rem;
            padding: 0.18rem 0.48rem;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(222, 250, 232, 0.78));
            border: 1px solid rgba(68, 173, 89, 0.18);
            color: #35634d;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: inset 0 -2px 0 rgba(47, 143, 70, 0.08);
        }

        .market-btn,
        .primary-btn,
        .shop-action,
        .close-btn {
            border: 0;
            cursor: pointer;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .market-btn,
        .primary-btn {
            width: 100%;
            border-radius: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        }

        .market-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.72rem 1rem;
            background: linear-gradient(180deg, #ffe97f, #ffcb3a);
            color: #7b4c08;
            box-shadow: 0 6px 0 #d79a1e;
            font-size: 0.98rem;
        }

        .primary-btn {
            padding: 1rem 1.2rem;
            background: linear-gradient(180deg, #74df77, #32a654);
            color: var(--white);
            box-shadow: 0 6px 0 #1d7d3c, 0 0 22px rgba(80, 199, 112, 0.28);
            font-size: 1.05rem;
        }

        .market-btn:active,
        .primary-btn:active,
        .shop-action:active,
        .close-btn:active {
            transform: translateY(3px);
            filter: brightness(0.98);
        }

        .seed-badge {
            position: absolute;
            top: -0.38rem;
            right: -0.38rem;
            min-width: 2rem;
            padding: 0.12rem 0.4rem;
            border-radius: 999px;
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.16);
            background: var(--mint-deep);
        }

        .shop-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 1rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .shop-card:active {
            transform: scale(0.98);
        }

        .shop-card.active {
            border: 2px solid rgba(80, 175, 99, 0.95);
            box-shadow: 0 0 0 3px rgba(132, 230, 145, 0.25);
        }

        .crop-badge {
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            background: linear-gradient(180deg, #f8fff6, #dff4df);
            box-shadow: inset 0 -4px 0 rgba(60, 126, 73, 0.12);
        }

        .shop-copy-title {
            font-size: 1rem;
            font-weight: 700;
            color: #284b3d;
            line-height: 1.1;
        }

        .shop-copy-meta {
            font-size: 0.78rem;
            color: #607a6e;
        }

        .shop-action {
            padding: 0.45rem 0.72rem;
            border-radius: 0.8rem;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            white-space: nowrap;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
        }

        .shop-action.equip {
            background: linear-gradient(180deg, #6adf7c, #31af54);
            color: #fff;
        }

        .shop-action.buy {
            background: linear-gradient(180deg, #ffe783, #ffc93e);
            color: #7a4b06;
        }

        .shop-pill {
            font-size: 0.78rem;
            font-weight: 700;
            color: #5f776b;
            white-space: nowrap;
        }

        .shop-pill.active {
            color: #2b8a43;
        }

        .shop-pill.locked {
            color: #9ba7a0;
        }

        .modal-shell {
            width: min(100%, 26rem);
            max-height: 82vh;
            border-radius: 1.6rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .close-btn {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            background: rgba(224, 235, 228, 0.95);
            color: #496558;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .shop-grid {
            display: grid;
            gap: 0.65rem;
            overflow-y: auto;
            padding-right: 0.15rem;
        }

        .start-card {
            width: min(100%, 25rem);
            margin: 1rem;
            padding: 1.45rem 1.35rem 1.3rem;
            border-radius: 1.8rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .start-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.7), transparent 42%),
                linear-gradient(145deg, rgba(134, 246, 154, 0.2), rgba(255, 229, 121, 0.3));
            pointer-events: none;
        }

        .start-inner {
            position: relative;
            z-index: 1;
        }

        .start-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.32rem;
            margin-bottom: 0.45rem;
            padding: 0.28rem 0.65rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            color: #4d6a5c;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-bottom: 0.35rem;
        }

        .hero-mascot {
            position: relative;
            width: 4.95rem;
            height: 4.95rem;
            border-radius: 1.45rem;
            background:
                radial-gradient(circle at 50% 88%, rgba(53,184,91,0.18), transparent 30%),
                linear-gradient(180deg, #fffef5, #dbffd5);
            border: 3px solid rgba(255,255,255,0.92);
            box-shadow: 0 10px 24px rgba(38, 111, 68, 0.18), inset 0 -5px 0 rgba(53,184,91,0.12);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            animation: mascotBob 2.1s ease-in-out infinite;
        }

        .sprout-bird {
            position: relative;
            width: 3.45rem;
            height: 3.35rem;
        }

        .sprout-bird::before,
        .sprout-bird::after {
            content: "";
            position: absolute;
            top: 1.18rem;
            width: 1.45rem;
            height: 1.1rem;
            border-radius: 100% 15% 100% 20%;
            background: linear-gradient(135deg, #8ff28b, #35b85b);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.55);
            transform-origin: center right;
            animation: wingFlutter 1.35s ease-in-out infinite;
        }

        .sprout-bird::before {
            left: -0.32rem;
            transform: rotate(-18deg);
        }

        .sprout-bird::after {
            right: -0.32rem;
            transform: scaleX(-1) rotate(-18deg);
            animation-delay: 0.08s;
        }

        .sprout-body {
            position: absolute;
            left: 50%;
            top: 0.48rem;
            width: 2.35rem;
            height: 2.45rem;
            border-radius: 52% 52% 45% 45%;
            transform: translateX(-50%);
            background:
                radial-gradient(circle at 35% 27%, rgba(255,255,255,0.9), transparent 14%),
                linear-gradient(180deg, #fff8bc 0%, #ffd94a 52%, #f2a927 100%);
            border: 2px solid rgba(120, 80, 14, 0.18);
            box-shadow: 0 5px 0 rgba(124, 82, 15, 0.16), inset 0 -5px 0 rgba(215,154,30,0.22);
            z-index: 2;
        }

        .sprout-body::before {
            content: "";
            position: absolute;
            left: 1.46rem;
            top: 0.82rem;
            width: 0.46rem;
            height: 0.34rem;
            border-radius: 100% 55% 55% 100%;
            background: #ff8b35;
            box-shadow: 0 1px 0 rgba(109, 61, 5, 0.18);
        }

        .sprout-body::after {
            content: "";
            position: absolute;
            left: 0.68rem;
            top: 0.68rem;
            width: 0.22rem;
            height: 0.22rem;
            border-radius: 50%;
            background: #214337;
            box-shadow: 0.66rem 0 #214337;
        }

        .sprout-leaf {
            position: absolute;
            left: 50%;
            top: -0.06rem;
            width: 1.02rem;
            height: 0.82rem;
            border-radius: 100% 0 100% 0;
            background: linear-gradient(135deg, #a8ff9a, #35b85b);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.52);
            transform: translateX(-50%) rotate(-28deg);
            z-index: 3;
        }

        .sprout-shadow {
            position: absolute;
            left: 50%;
            bottom: 0.04rem;
            width: 2.6rem;
            height: 0.45rem;
            border-radius: 50%;
            transform: translateX(-50%);
            background: rgba(31, 127, 60, 0.16);
        }

        .hero-title {
            margin: 0;
            color: #2d8d45;
            text-shadow: 0 3px 0 rgba(255,255,255,0.82);
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2.1rem, 8.5vw, 3.15rem);
            line-height: 0.9;
            letter-spacing: 0.08em;
        }

        .hero-subtitle {
            margin: 0.15rem 0 0.3rem;
            color: #3e584d;
            font-size: 1.02rem;
            font-weight: 700;
        }

        .hero-copy {
            margin: 0 0 1rem;
            color: #667d72;
            font-size: 0.9rem;
            line-height: 1.28;
        }

        .hero-tray {
            display: flex;
            justify-content: center;
            gap: 0.55rem;
            margin: 0 0 1rem;
            flex-wrap: wrap;
        }

        .hero-chip {
            min-width: 4.7rem;
            padding: 0.45rem 0.6rem;
            border-radius: 0.95rem;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.88);
            box-shadow: inset 0 -3px 0 rgba(61, 142, 69, 0.08);
        }

        .hero-chip span {
            display: block;
            line-height: 1;
        }

        .hero-chip .emoji {
            font-size: 1.15rem;
            margin-bottom: 0.22rem;
        }

        .hero-chip .label {
            color: #597164;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 44, 30, 0.28);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .hidden { display: none !important; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .z-10 { z-index: 10; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .grid { display: grid; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .flex-col { flex-direction: column; }
        .gap-2 { gap: 0.5rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .select-none { user-select: none; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(92, 128, 110, 0.55);
            border-radius: 999px;
        }

        @keyframes mascotBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes wingFlutter {
            0%, 100% { rotate: 0deg; }
            50% { rotate: 10deg; }
        }

        @media (max-width: 640px) {
            #hud {
                top: 0.75rem;
                left: 0.75rem;
                right: 0.75rem;
                gap: 0.55rem;
            }

            .score-card {
                min-width: 114px;
                padding: 0.75rem 0.85rem;
            }

            .score-value {
                font-size: 1.7rem;
            }

            .market-btn {
                padding: 0.62rem 0.8rem;
                font-size: 0.9rem;
            }

            .tool-strip {
                gap: 0.35rem;
                padding: 0.42rem;
            }

            .tool-btn {
                width: 3rem;
                height: 3.35rem;
                border-radius: 0.9rem;
            }

            .seed-badge {
                top: -0.28rem;
                right: -0.22rem;
                min-width: 1.65rem;
                padding: 0.1rem 0.28rem;
                font-size: 9px;
            }

            .tool-btn span:first-child {
                font-size: 1.35rem;
            }

            .tool-btn span:last-child {
                font-size: 9px;
            }

            .modal-shell {
                padding: 0.9rem;
                max-height: 84vh;
            }

            .hero-row {
                flex-direction: column;
                gap: 0.4rem;
            }

            .hero-mascot {
                width: 4.2rem;
                height: 4.2rem;
            }

            .sprout-bird {
                transform: scale(0.88);
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: start/ui/plant/water/harvest/error/menu -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Garden Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_start" data-editable="audio" data-label="SFX Start Game" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_plant" data-editable="audio" data-label="SFX Plant" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_water" data-editable="audio" data-label="SFX Water" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
<audio id="sfx_harvest" data-editable="audio" data-label="SFX Harvest" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
<audio id="sfx_error" data-editable="audio" data-label="SFX Error" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "growthSpeed": { "type": "number", "label": "Global Growth Multiplier", "value": 1, "min": 0.1, "max": 5 },
    "gridSize": { "type": "number", "label": "Grid Size", "value": 6, "min": 4, "max": 10 }
}
</script>

<!-- UI -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start hidden pointer-events-none z-10">
        <div class="flex flex-col gap-2 pointer-events-auto">
                <div class="glass hud-shell score-card">
                    <span class="hud-label">Sky Funds</span>
                    <span class="score-value">$<span id="scoreVal">0</span></span>
                    <span id="routePhase" class="route-badge">☁ Calm Route</span>
                </div>
            <button onclick="toggleShop()" class="market-btn">
                <span>🪴</span>
                 <span>NEST MARKET</span>
            </button>
        </div>

        <div class="tool-strip pointer-events-auto">
            <button id="tool-plow" class="tool-btn active" onclick="selectTool('plow')">
                <span>⛏️</span>
                <span>PLOW</span>
            </button>
            <button id="tool-seed" class="tool-btn" onclick="selectTool('seed')">
                <span id="active-seed-icon">🌾</span>
                <span>PLANT</span>
                <span id="seed-cost-badge" class="seed-badge">Free</span>
            </button>
            <button id="tool-water" class="tool-btn" onclick="selectTool('water')">
                <span>💧</span>
                <span>WATER</span>
            </button>
            <button id="tool-harvest" class="tool-btn" onclick="selectTool('harvest')">
                <span>🧺</span>
                <span>PICK</span>
            </button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="absolute inset-0 z-40 screen-overlay hidden flex items-center justify-center">
        <div class="glass modal-shell">
            <div class="modal-header">
                 <h2 class="font-display" style="margin:0; font-size:2rem; color:#2d8d45;">NEST MARKET</h2>
                <button onclick="toggleShop()" class="close-btn">✕</button>
            </div>

<script>
/**
 * DATA DEFS
 */
const CROPS = {
    wheat: {
        id: 'wheat',
        name: 'Cloudgrain',
        icon: '🌾',
        color: '#f4d03f',
        cost: 0,
        unlockPrice: 0,
        sellPrice: 15,
        growthTime: 3,
        desc: "Free starter seed for the cloud nursery."
    },
    corn: {
        id: 'corn',
        name: 'Golden Sky Corn',
        icon: '🌽',
        color: '#f39c12',
        cost: 5,
        unlockPrice: 150,
        sellPrice: 40,
        growthTime: 5,
        desc: "Pipe-trellis produce with stronger profit."
    },
    pumpkin: {
        id: 'pumpkin',
        name: 'Sun-Gourd',
        icon: '🎃',
        color: '#e67e22',
        cost: 20,
        unlockPrice: 500,
        sellPrice: 120,
        growthTime: 10,
        desc: "Premium sky-bazaar produce for big payouts."
    }
};

/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.sfxVolume = {
            sfx_start: 0.5,
            sfx_ui: 0.35,
            sfx_plant: 0.32,
            sfx_water: 0.28,
            sfx_harvest: 0.42,
            sfx_error: 0.28
        };
        this.fallbackMap = {
            sfx_start: 'buy',
            sfx_ui: 'buy',
            sfx_plant: 'plow',
            sfx_water: 'water',
            sfx_harvest: 'coin',
            sfx_error: 'error'
        };
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    async loadSound(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const sourceUrl = new URL(el.currentSrc || el.src, window.location.href);
            if (sourceUrl.origin !== window.location.origin) {
                // [agent-note][stage4] repaired: cors-console-noise | remote catalog audio remains optional and falls back safely.
                this.buffers[id] = { error: true };
                return;
            }
            const response = await fetch(sourceUrl.href);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            this.buffers[id] = { error: true };
        }
    }

    playBgm() {
        if (!this.unlocked) return;
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.2;
        if (el.paused) el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, minGap = 90) {
        if (!this.unlocked) return;
        const nowStamp = performance.now();
        if (this.lastPlayedAt[id] && nowStamp - this.lastPlayedAt[id] < minGap) return;
        this.lastPlayedAt[id] = nowStamp;

        const bufferInfo = this.buffers[id];
        if (bufferInfo && !bufferInfo.error) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = bufferInfo;
            gain.gain.value = this.sfxVolume[id] ?? 0.3;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            const el = document.getElementById(id);
            if (el) {
                const clone = el.cloneNode(true);
                clone.volume = this.sfxVolume[id] ?? 0.3;
                clone.play().catch(() => {
                    this.synthesize(this.fallbackMap[id] || 'buy');
                });
            } else {
                this.synthesize(this.fallbackMap[id] || 'buy');
            }
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'plow') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start();
            osc.stop(now + 0.1);
        } else if (type === 'water') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        } else if (type === 'buy' || type === 'coin') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.linearRampToValueAtTime(680, now + 0.12);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.24);
            osc.start();
            osc.stop(now + 0.24);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(170, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        }
    }
}

/**
 * GAME ENGINE
 */
const audioManager = new AudioManager();

// Config
let gameConfig = { growthSpeed: 1, gridSize: 6 };

// State
let money = 0;
let grid = [];
let particles = [];
let floatingTexts = [];
let currentTool = 'plow';
let unlockedCrops = ['wheat'];
let activeCropId = 'wheat';
let lastTime = 0;
let camera = { x: 0, y: 0 };

// Constants
const TILE_SIZE = 64;
const BLOCK_HEIGHT = 16;
const COLORS = {
    grass: '#7ec850',
    grassDark: '#5da638',
    soil: '#8b5a2b',
    soilDark: '#603d1b',
    water: '#4fa4f4',
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const routePhaseEl = document.getElementById('routePhase');
const startScreen = document.getElementById('start-screen');
const hud = document.getElementById('hud');
const gifFeedback = document.getElementById('gif-feedback');
const gifFeedbackImg = document.getElementById('gif-feedback-img');
const GIFS = {
    harvest: 'https://i.giphy.com/l4FGpPki5v2Bcd6Ss.webp',
    fail: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
};
let gifTimer = null;

// Initialize
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.updateGameConfig = (key, val) => {
    if (gameConfig.hasOwnProperty(key)) {
        gameConfig[key] = val;
        if (key === 'gridSize') initGrid();
    }
};

function init() {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;

    ['sfx_start', 'sfx_ui', 'sfx_plant', 'sfx_water', 'sfx_harvest', 'sfx_error'].forEach(id => {
        audioManager.loadSound(id);
    });

    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleMove, { passive: false });
    canvas.addEventListener('pointerup', () => {}, { passive: false });
    canvas.addEventListener('pointercancel', () => {}, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        audioManager.unlock();
        audioManager.playSfx('sfx_start', 0);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        initGrid();
        updateShopUI();
        requestAnimationFrame(gameLoop);
    });
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    camera.x = window.innerWidth / 2;
    camera.y = window.innerHeight / 2 - (gameConfig.gridSize * TILE_SIZE / 4);
}

function initGrid() {
    grid = [];
    const size = gameConfig.gridSize;
    for (let x = 0; x < size; x++) {
        grid[x] = [];
        for (let y = 0; y < size; y++) {
            grid[x][y] = {
                state: 'grass',
                cropType: null,
                timer: 0,
                scale: 0,
                heightOffset: 0,
                watered: false
            };
        }
    }
}

// Isometric Maths
function isoToScreen(gx, gy) {
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    return {
        x: (gx - gy) * tileW + camera.x,
        y: (gx + gy) * tileH + camera.y
    };
}

function screenToIso(sx, sy) {
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    const gy = ((adjY / tileH) - (adjX / tileW)) / 2;
    const gx = ((adjY / tileH) + (adjX / tileW)) / 2;
    return { x: Math.floor(gx), y: Math.floor(gy) };
}

// Game Loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            const cell = grid[x][y];
            if (cell.heightOffset > 0) cell.heightOffset = Math.max(0, cell.heightOffset - dt * 50);

            if (cell.state === 'seeded' && cell.watered) {
                cell.timer += dt;
                const cropData = CROPS[cell.cropType];
                const requiredTime = cropData.growthTime * gameConfig.growthSpeed;
                cell.scale = Math.min(1, cell.timer / requiredTime);

                if (cell.timer >= requiredTime) {
                    cell.state = 'ripe';
                    cell.scale = 1;
                    cell.heightOffset = 10;
                }
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        p.vz -= dt * 2;
        if (p.z < 0) { p.z = 0; p.vz *= -0.5; }
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        t.y -= dt * 30;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    drawSkyGardenBackground(w, h, money, performance.now() * 0.001);

    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            drawTile(x, y, grid[x][y]);
        }
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        const size = p.size * (p.life / 0.5);
        ctx.fillRect(p.x, p.y - p.z, size, size);
    });

    ctx.textAlign = 'center';
    ctx.font = '700 24px "Rajdhani"';
    floatingTexts.forEach(t => {
        ctx.fillStyle = `rgba(255, 255, 255, ${t.life})`;
        ctx.strokeStyle = `rgba(40, 73, 49, ${t.life * 0.5})`;
        ctx.lineWidth = 4;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
    });
}

function getVisualPhase(funds) {
    if (unlockedCrops.includes('pumpkin') || funds >= 500) return {
        level: 5,
        label: '⛈ Bazaar',
        top: '#76b8ff',
        mid: '#9be7ff',
        bottom: '#f7f0ff',
        pipeAlpha: 0.32,
        windAlpha: 0.28,
        sunset: 'rgba(255, 202, 96, 0.16)',
        storm: 'rgba(29, 63, 122, 0.18)'
    };
    if (unlockedCrops.includes('corn') || funds >= 300) return {
        level: 4,
        label: '☀ Aviary',
        top: '#75cfff',
        mid: '#baf2ff',
        bottom: '#fff0cf',
        pipeAlpha: 0.25,
        windAlpha: 0.22,
        sunset: 'rgba(255, 173, 84, 0.24)',
        storm: 'rgba(29, 63, 122, 0)'
    };
    if (funds >= 150) return {
        level: 3,
        label: '〰 Gust Route',
        top: '#6fd6ff',
        mid: '#b2f4ff',
        bottom: '#ecfff7',
        pipeAlpha: 0.22,
        windAlpha: 0.25,
        sunset: 'rgba(255, 213, 74, 0.08)',
        storm: 'rgba(29, 63, 122, 0)'
    };
    if (funds >= 60) return {
        level: 2,
        label: '▥ Pipe Orchard',
        top: '#72d7ff',
        mid: '#baf2ff',
        bottom: '#f0fff7',
        pipeAlpha: 0.18,
        windAlpha: 0.14,
        sunset: 'rgba(255, 213, 74, 0.04)',
        storm: 'rgba(29, 63, 122, 0)'
    };
    return {
        level: 1,
        label: '☁ Calm Route',
        top: '#7dd8ff',
        mid: '#bdf1ff',
        bottom: '#ebfff7',
        pipeAlpha: 0.11,
        windAlpha: 0.1,
        sunset: 'rgba(255, 213, 74, 0.02)',
        storm: 'rgba(29, 63, 122, 0)'
    };
}

function drawSkyGardenBackground(w, h, funds, t) {
    const phase = getVisualPhase(funds);
    const grd = ctx.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, phase.top);
    grd.addColorStop(0.56, phase.mid);
    grd.addColorStop(1, phase.bottom);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, w, h);

    const sunGlow = ctx.createRadialGradient(w * 0.16, h * 0.12, 10, w * 0.16, h * 0.12, Math.max(150, w * 0.38));
    sunGlow.addColorStop(0, 'rgba(255, 245, 175, 0.68)');
    sunGlow.addColorStop(1, 'rgba(255, 245, 175, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, w, h);

    if (phase.sunset !== 'rgba(255, 213, 74, 0.02)') {
        const sunsetGlow = ctx.createRadialGradient(w * 0.8, h * 0.16, 10, w * 0.8, h * 0.16, Math.max(130, w * 0.35));
        sunsetGlow.addColorStop(0, phase.sunset);
        sunsetGlow.addColorStop(1, 'rgba(255, 173, 84, 0)');
        ctx.fillStyle = sunsetGlow;
        ctx.fillRect(0, 0, w, h);
    }

    ctx.fillStyle = phase.storm;
    ctx.fillRect(0, 0, w, h * 0.35);

    drawCloudBand(w, h * 0.2, 0.18, t, 0.55);
    drawCloudBand(w, h * 0.74, 0.28, -t * 0.62, 0.78);
    drawPipeTrellises(w, h, phase.pipeAlpha, t);
    drawWindRibbons(w, h, phase.windAlpha, t);
    drawDistantNestMarket(w, h, t, phase.level);
    drawDistantBirds(w, h, t);
}

function drawCloudBand(w, y, alpha, t, scale) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    const spacing = 170 * scale;
    const drift = ((t * 14 * scale) % spacing);
    for (let i = -1; i < Math.ceil(w / spacing) + 2; i++) {
        const x = i * spacing - drift;
        drawCloudPuff(x, y + Math.sin(i * 1.9 + t) * 9, 52 * scale);
    }
    ctx.restore();
}

function drawCloudPuff(x, y, r) {
    ctx.beginPath();
    ctx.arc(x - r * 0.55, y + r * 0.12, r * 0.42, 0, Math.PI * 2);
    ctx.arc(x - r * 0.12, y - r * 0.08, r * 0.58, 0, Math.PI * 2);
    ctx.arc(x + r * 0.46, y + r * 0.08, r * 0.46, 0, Math.PI * 2);
    ctx.rect(x - r * 0.86, y + r * 0.08, r * 1.72, r * 0.48);
    ctx.fill();
}

function drawPipeTrellises(w, h, alpha, t) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 5;
    const baseY = h * 0.64;
    const spacing = Math.max(130, w / 4);
    const drift = (Math.sin(t * 0.35) * 8);
    for (let i = 0; i < 5; i++) {
        const x = i * spacing + (w % spacing) * 0.4 + drift - spacing * 0.3;
        const pipeH = 88 + (i % 2) * 24;
        ctx.strokeStyle = '#1f7f3c';
        ctx.fillStyle = '#35b85b';
        roundRect(x, baseY - pipeH, 25, pipeH, 12);
        ctx.fill();
        ctx.stroke();
        roundRect(x - 8, baseY - pipeH - 13, 41, 18, 9);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 7, baseY - pipeH + 6);
        ctx.lineTo(x + 7, baseY - 9);
        ctx.stroke();
    }
    ctx.restore();
}

function drawWindRibbons(w, h, alpha, t) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
        const y = h * (0.28 + i * 0.12);
        const xOff = ((t * (28 + i * 9)) % (w + 220)) - 160;
        const grad = ctx.createLinearGradient(xOff, y, xOff + 170, y);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.45, 'rgba(255,255,255,0.88)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = grad;
        ctx.beginPath();
        ctx.moveTo(xOff, y);
        ctx.bezierCurveTo(xOff + 45, y - 24, xOff + 82, y + 24, xOff + 130, y);
        ctx.bezierCurveTo(xOff + 152, y - 12, xOff + 172, y - 10, xOff + 196, y + 2);
        ctx.stroke();
    }
    ctx.restore();
}

function drawDistantNestMarket(w, h, t, level) {
    ctx.save();
    ctx.globalAlpha = 0.15 + level * 0.018;
    const x = w * 0.77 + Math.sin(t * 0.4) * 4;
    const y = h * 0.68;
    ctx.fillStyle = '#8b5a2b';
    ctx.strokeStyle = '#603d1b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y, 44, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = '#6f4621';
    for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.arc(x + i * 8, y - 2, 18, Math.PI * 1.05, Math.PI * 1.95);
        ctx.stroke();
    }

    ctx.fillStyle = '#ffd94a';
    for (let i = 0; i < Math.min(5, level + 1); i++) {
        ctx.beginPath();
        ctx.arc(x - 26 + i * 13, y - 14 - (i % 2) * 4, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawDistantBirds(w, h, t) {
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = '#214337';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        const x = ((t * (18 + i * 3) + i * w * 0.24) % (w + 80)) - 40;
        const y = h * (0.18 + (i % 3) * 0.09) + Math.sin(t + i) * 6;
        ctx.beginPath();
        ctx.moveTo(x - 8, y);
        ctx.quadraticCurveTo(x, y - 7, x + 8, y);
        ctx.quadraticCurveTo(x + 14, y - 6, x + 20, y - 1);
        ctx.stroke();
    }
    ctx.restore();
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
}

function drawTile(gx, gy, cell) {
    const pos = isoToScreen(gx, gy);
    const x = pos.x;
    const y = pos.y + cell.heightOffset;
    const w = TILE_SIZE * 2;
    const h = TILE_SIZE;

    let topColor = COLORS.grass;
    let sideColor = COLORS.grassDark;

    if (cell.state !== 'grass') {
        topColor = cell.watered ? '#5c3d21' : COLORS.soil;
        sideColor = COLORS.soilDark;
    }

    ctx.fillStyle = sideColor;
    ctx.beginPath();
    ctx.moveTo(x, y + h/2);
    ctx.lineTo(x + w/2, y + h);
    ctx.lineTo(x + w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x, y + h/2 + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    const shine = ctx.createLinearGradient(x, y, x, y + h);
    shine.addColorStop(0, 'rgba(255,255,255,0.25)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.26)';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (cell.state === 'plowed') {
        ctx.strokeStyle = 'rgba(255, 233, 127, 0.16)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x - w * 0.26, y + h * 0.5);
        ctx.lineTo(x, y + h * 0.36);
        ctx.lineTo(x + w * 0.26, y + h * 0.5);
        ctx.stroke();
    }

    if (cell.watered) {
        ctx.fillStyle = 'rgba(111, 214, 255, 0.26)';
        ctx.beginPath();
        ctx.ellipse(x, y + h * 0.5, w * 0.23, h * 0.13, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    if (cell.state !== 'grass' && cell.state !== 'plowed' && cell.cropType) {
        const growth = cell.scale || 0.2;
        if (cell.cropType === 'wheat') {
            drawWheat(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'corn') {
            drawCorn(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'pumpkin') {
            drawPumpkin(ctx, x, y + h/2, growth, cell.state === 'ripe');
        }
    }
}

// Procedural Crop Drawers
function drawWheat(ctx, x, y, scale, isRipe) {
    const h = 40 * scale;
    const headColor = isRipe ? '#f4d03f' : '#c4e77d';
    ctx.strokeStyle = '#5d9a42';
    ctx.lineWidth = Math.max(2, 3 * scale);
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 7, y);
        ctx.lineTo(x + i * 7, y - h);
        ctx.stroke();
        ctx.fillStyle = headColor;
        if (isRipe) {
            ctx.beginPath();
            ctx.ellipse(x + i * 7, y - h, 4, 9, i * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x - 10 * scale, y - h * 0.7, 20 * scale, 4 * scale);
}

function drawCorn(ctx, x, y, scale, isRipe) {
    const h = 50 * scale;
    ctx.fillStyle = '#36bb63';
    ctx.fillRect(x - 3, y - h, 6, h);

    ctx.beginPath();
    ctx.ellipse(x - 10 * scale, y - h/2, 12 * scale, 4 * scale, Math.PI/4, 0, Math.PI*2);
    ctx.ellipse(x + 10 * scale, y - h/3, 12 * scale, 4 * scale, -Math.PI/4, 0, Math.PI*2);
    ctx.fill();

    if (scale > 0.6) {
        ctx.fillStyle = isRipe ? '#ffd94a' : '#f0f3bd';
        ctx.beginPath();
        ctx.ellipse(x, y - h * 0.8, 7 * scale, 13 * scale, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(x - 2 * scale, y - h * 0.98, 4 * scale, 18 * scale);
    }
}

function drawPumpkin(ctx, x, y, scale, isRipe) {
    const r = 20 * scale;
    ctx.strokeStyle = '#2f9455';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 12, y - 6, x + 22, y);
    ctx.stroke();

    ctx.fillStyle = isRipe ? '#ef8f2f' : '#4fb968';
    ctx.beginPath();
    ctx.arc(x, y - r + 5, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.25, y - r - 1, r * 0.4, r * 0.62, -0.3, 0, Math.PI * 2);
    ctx.fill();

    if (scale > 0.5) {
        ctx.strokeStyle = 'rgba(104,55,16,0.15)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x - r/2, y - r + 5, r/1.5, 0, Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + r/2, y - r + 5, r/1.5, 0, Math.PI*2);
        ctx.stroke();
    }
}

// Interaction
function handleInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const iso = screenToIso(sx, sy);

    if (iso.x >= 0 && iso.x < gameConfig.gridSize && iso.y >= 0 && iso.y < gameConfig.gridSize) {
        interact(iso.x, iso.y);
    }
}

function handleMove(e) { e.preventDefault(); }

function showGif(kind) {
    if (!gifFeedback || !gifFeedbackImg) return;
    gifFeedbackImg.src = GIFS[kind];
    gifFeedbackImg.alt = kind === 'harvest' ? 'celebration reaction' : 'failed action reaction';
    gifFeedback.classList.remove('hidden');
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => {
        gifFeedback.classList.add('hidden');
    }, kind === 'harvest' ? 1600 : 1200);
}

function interact(x, y) {
    const cell = grid[x][y];
    let success = false;
    const pos = isoToScreen(x, y);
    const activeCrop = CROPS[activeCropId];

    if (currentTool === 'plow') {
        if (cell.state === 'grass') {
            cell.state = 'plowed';
            spawnParticles(pos.x, pos.y, COLORS.soil, 5);
            audioManager.playSfx('sfx_plant');
            success = true;
        }
    } else if (currentTool === 'seed') {
        if (cell.state === 'plowed') {
            if (money >= activeCrop.cost) {
                money -= activeCrop.cost;
                updateMoney();
                cell.state = 'seeded';
                cell.cropType = activeCropId;
                cell.timer = 0;
                cell.watered = false;
                spawnParticles(pos.x, pos.y, activeCrop.color, 5);
                audioManager.playSfx('sfx_plant');
                if (activeCrop.cost > 0) addFloatingText(pos.x, pos.y - 40, `-$${activeCrop.cost}`);
                success = true;
            } else {
                audioManager.playSfx('sfx_error', 120);
                showGif('fail');
                addFloatingText(pos.x, pos.y - 40, "Need Sky Funds!");
            }
        }
    } else if (currentTool === 'water') {
        if ((cell.state === 'seeded' || cell.state === 'ripe') && !cell.watered) {
            cell.watered = true;
            spawnParticles(pos.x, pos.y, COLORS.water, 8);
            audioManager.playSfx('sfx_water');
            success = true;
        }
    } else if (currentTool === 'harvest') {
        if (cell.state === 'ripe') {
            const crop = CROPS[cell.cropType];
            cell.state = 'plowed';
            cell.watered = false;
            cell.timer = 0;

            money += crop.sellPrice;
            updateMoney();

            spawnParticles(pos.x, pos.y, crop.color, 12);
            spawnParticles(pos.x, pos.y, '#ffcc00', 5);
            addFloatingText(pos.x, pos.y - 50, `+$${crop.sellPrice}`);
            audioManager.playSfx('sfx_harvest');
            showGif('harvest');
            success = true;
        }
    }

    if (!success && currentTool !== 'seed') {
        audioManager.playSfx('sfx_error', 160);
        showGif('fail');
    }

    if (success) cell.heightOffset = 5;
}

// UI Logic
function updateMoney() {
    scoreEl.textContent = money;
    updateRoutePhase();
    updateShopUI();
}

function updateRoutePhase() {
    if (!routePhaseEl) return;
    routePhaseEl.textContent = getVisualPhase(money).label;
}

window.selectTool = (tool) => {
    currentTool = tool;
    audioManager.playSfx('sfx_ui', 80);
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.id === `tool-${tool}`) btn.classList.add('active');
    });
};

window.toggleShop = () => {
    const modal = document.getElementById('shop-modal');
    const opening = modal.classList.contains('hidden');
    modal.classList.toggle('hidden');
    audioManager.playSfx(opening ? 'sfx_ui' : 'sfx_error', 120);
    if (!modal.classList.contains('hidden')) updateShopUI();
};

function updateShopUI() {
    const gridEl = document.getElementById('shop-grid');
    gridEl.innerHTML = '';

    Object.values(CROPS).forEach(crop => {
        const isUnlocked = unlockedCrops.includes(crop.id);
        const isAffordable = money >= crop.unlockPrice;
        const isActive = activeCropId === crop.id;

        const card = document.createElement('div');
        card.className = `shop-card glass ${isActive ? 'active' : ''}`;

        let actionHtml = '';
        if (isUnlocked) {
            actionHtml = isActive
                ? `<span class="shop-pill active">ACTIVE</span>`
                : `<button onclick="selectCrop('${crop.id}')" class="shop-action equip">EQUIP</button>`;
        } else if (isAffordable) {
            actionHtml = `<button onclick="unlockCrop('${crop.id}')" class="shop-action buy">BUY $${crop.unlockPrice}</button>`;
        } else {
            actionHtml = `<span class="shop-pill locked">NEED $${crop.unlockPrice}</span>`;
        }

        card.innerHTML = `
            <div style="display:flex; align-items:center; gap:0.7rem; min-width:0;">
                <div class="crop-badge">${crop.icon}</div>
                <div style="min-width:0;">
                    <div class="shop-copy-title">${crop.name}</div>
                    <div class="shop-copy-meta">Sale: $${crop.sellPrice} · Seed: $${crop.cost}</div>
                </div>
            </div>
            <div>${actionHtml}</div>
        `;
        gridEl.appendChild(card);
    });
}

window.unlockCrop = (id) => {
    const crop = CROPS[id];
    if (money >= crop.unlockPrice) {
        money -= crop.unlockPrice;
        unlockedCrops.push(id);
        audioManager.playSfx('sfx_harvest');
        showGif('harvest');
        selectCrop(id);
        updateMoney();
        updateRoutePhase();
    }
};

window.selectCrop = (id) => {
    activeCropId = id;
    const crop = CROPS[id];
    document.getElementById('active-seed-icon').textContent = crop.icon;
    const badge = document.getElementById('seed-cost-badge');
    badge.textContent = crop.cost === 0 ? 'Free' : `$${crop.cost}`;
    badge.style.background = crop.cost === 0 ? 'var(--mint-deep)' : 'var(--berry)';

    selectTool('seed');
    updateShopUI();
};

// Juice
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y + TILE_SIZE / 2, z: 10,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            vz: Math.random() * 3 + 2,
            life: 1.0, color: color, size: Math.random() * 4 + 2
        });
    }
}

function addFloatingText(x, y, text) {
    floatingTexts.push({ x, y, text, life: 1.5 });
}

document.addEventListener('DOMContentLoaded', init);
</script>
