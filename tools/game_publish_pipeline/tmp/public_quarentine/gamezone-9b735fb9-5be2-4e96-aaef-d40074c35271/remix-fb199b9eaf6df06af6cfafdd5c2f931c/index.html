<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pocket Portal Farm: Multiverse Market</title>
    <!-- [agent-note][stage4] remapped-font: display/ui -> catalogs/fonts.json using Bangers + Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #15102f;
            --sky-bottom: #39ff88;
            --panel-bg: rgba(13, 21, 34, 0.84);
            --panel-border: rgba(103, 255, 159, 0.72);
            --panel-shadow: rgba(0, 255, 128, 0.22);
            --mint: #39ff88;
            --mint-deep: #00c46f;
            --soil: #5b3f2a;
            --soil-deep: #291913;
            --gold: #f8ea5a;
            --gold-deep: #b8a819;
            --berry: #ff4fd8;
            --berry-deep: #b01791;
            --ink: #eafff1;
            --hud-text: #eafff1;
            --soft-text: #9ee8c2;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 72% 16%, rgba(57,255,136,0.28), transparent 18%),
                radial-gradient(circle at 18% 8%, rgba(44,218,255,0.18), transparent 22%),
                linear-gradient(180deg, var(--sky-top), #07151d 62%, #102713);
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--ink);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(57,255,136,0.22), transparent 18%),
                radial-gradient(circle at 85% 14%, rgba(44,218,255,0.2), transparent 16%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 44px);
            opacity: 0.9;
            animation: labScanDrift 18s linear infinite;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 78% 20%, rgba(57,255,136,0.1), transparent 23%),
                repeating-linear-gradient(0deg, transparent 0 18px, rgba(103,255,159,0.028) 19px 20px);
            mix-blend-mode: screen;
            opacity: 0.72;
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--panel-border);
            box-shadow: 0 10px 28px var(--panel-shadow);
        }

        .hud-shell {
            position: relative;
            overflow: hidden;
        }

        .hud-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 45%);
        }

        .font-display {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .hud-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--soft-text);
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .tool-strip {
            display: flex;
            gap: 0.5rem;
            padding: 0.55rem;
            border-radius: 1.4rem;
            background: rgba(7, 18, 24, 0.78);
            border: 2px solid rgba(103,255,159,0.58);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 24px rgba(34, 88, 63, 0.16);
        }

        .tool-btn {
            position: relative;
            width: 4rem;
            height: 4rem;
            padding: 0.25rem;
            border: 0;
            border-radius: 1rem;
            background: linear-gradient(180deg, #203042, #101c28);
            border-bottom: 4px solid rgba(57, 255, 136, 0.26);
            color: var(--hud-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.08rem;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 0 6px 12px rgba(43, 82, 56, 0.12);
        }

        .tool-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
            box-shadow: 0 2px 6px rgba(43, 82, 56, 0.1);
        }

        .tool-btn.active {
            background: linear-gradient(180deg, #67ff9f, #00c46f);
            color: #062015;
            border-bottom-color: #088a54;
            box-shadow: 0 7px 0 #088a54, 0 0 18px rgba(57, 255, 136, 0.38);
            transform: translateY(-2px);
        }

        .tool-btn span:last-child {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .score-card {
            min-width: 132px;
            padding: 0.9rem 1rem 0.8rem;
            border-radius: 1.15rem;
        }

        .phase-badge {
            margin-top: 0.45rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            max-width: 11rem;
            padding: 0.28rem 0.55rem;
            border-radius: 999px;
            background: rgba(57, 255, 136, 0.1);
            border: 1px solid rgba(103, 255, 159, 0.34);
            color: #b9ffd5;
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .phase-badge::before {
            content: "◌";
            color: var(--mint);
            text-shadow: 0 0 8px rgba(57, 255, 136, 0.9);
        }

        .score-value {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: 1.7rem;
            line-height: 1.1;
            color: var(--mint);
            text-shadow: 0 0 12px rgba(57,255,136,0.7);
        }

        .market-btn,
        .primary-btn,
        .shop-action,
        .close-btn {
            border: 0;
            cursor: pointer;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .market-btn,
        .primary-btn {
            width: 100%;
            border-radius: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        }

        .market-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.72rem 1rem;
            background: linear-gradient(180deg, #f8ea5a, #b8a819);
            color: #15102f;
            box-shadow: 0 6px 0 #6f6410, 0 0 18px rgba(248,234,90,0.18);
            font-size: 0.98rem;
        }

        .primary-btn {
            padding: 1rem 1.2rem;
            background: linear-gradient(180deg, #67ff9f, #00b7ff);
            color: #06131a;
            box-shadow: 0 6px 0 #007b8f, 0 0 22px rgba(57, 255, 136, 0.34);
            font-size: 1.05rem;
        }

        .market-btn:active,
        .primary-btn:active,
        .shop-action:active,
        .close-btn:active {
            transform: translateY(3px);
            filter: brightness(0.98);
        }

        .seed-badge {
            position: absolute;
            top: -0.38rem;
            right: -0.38rem;
            min-width: 2rem;
            padding: 0.12rem 0.4rem;
            border-radius: 999px;
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.16);
            background: var(--mint-deep);
        }

        .shop-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 1rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .shop-card:active {
            transform: scale(0.98);
        }

        .shop-card.active {
            border: 2px solid rgba(80, 175, 99, 0.95);
            box-shadow: 0 0 0 3px rgba(132, 230, 145, 0.25);
        }

        .crop-badge {
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            background: linear-gradient(180deg, #f8fff6, #dff4df);
            box-shadow: inset 0 -4px 0 rgba(60, 126, 73, 0.12);
        }

        .shop-copy-title {
            font-size: 1rem;
            font-weight: 700;
            color: #eafff1;
            line-height: 1.1;
        }

        .shop-copy-meta {
            font-size: 0.78rem;
            color: #9ee8c2;
        }

        .shop-action {
            padding: 0.45rem 0.72rem;
            border-radius: 0.8rem;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            white-space: nowrap;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
        }

        .shop-action.equip {
            background: linear-gradient(180deg, #6adf7c, #31af54);
            color: #fff;
        }

        .shop-action.buy {
            background: linear-gradient(180deg, #ffe783, #ffc93e);
            color: #7a4b06;
        }

        .shop-pill {
            font-size: 0.78rem;
            font-weight: 700;
            color: #5f776b;
            white-space: nowrap;
        }

        .shop-pill.active {
            color: #2b8a43;
        }

        .shop-pill.locked {
            color: #9ba7a0;
        }

        .modal-shell {
            width: min(100%, 26rem);
            max-height: 82vh;
            border-radius: 1.6rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .close-btn {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            background: rgba(16, 35, 45, 0.95);
            color: #67ff9f;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .shop-grid {
            display: grid;
            gap: 0.65rem;
            overflow-y: auto;
            padding-right: 0.15rem;
        }

        .start-card {
            width: min(100%, 25rem);
            margin: 1rem;
            padding: 1.45rem 1.35rem 1.3rem;
            border-radius: 1.8rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .start-card::before {
            content: "";
            position: absolute;
            inset: 0;
                background:
                radial-gradient(circle at 50% 0%, rgba(57,255,136,0.34), transparent 42%),
                radial-gradient(circle at 8% 78%, rgba(255,79,216,0.16), transparent 34%),
                linear-gradient(145deg, rgba(11, 24, 37, 0.85), rgba(15, 56, 38, 0.72));
            pointer-events: none;
        }

        .start-inner {
            position: relative;
            z-index: 1;
        }

        .start-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.32rem;
            margin-bottom: 0.45rem;
            padding: 0.28rem 0.65rem;
            border-radius: 999px;
            background: rgba(57,255,136,0.14);
            color: #b9ffd5;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-bottom: 0.35rem;
        }

        .hero-mascot {
            width: 4.75rem;
            height: 4.75rem;
            border-radius: 1.3rem;
            background:
                radial-gradient(ellipse at 50% 52%, rgba(57,255,136,0.92) 0 18%, transparent 19%),
                radial-gradient(circle at 50% 52%, rgba(0,183,255,0.32), transparent 33%),
                linear-gradient(180deg, #142b38, #0a1420);
            border: 3px solid rgba(103,255,159,0.78);
            box-shadow: 0 10px 24px rgba(57, 255, 136, 0.2), inset 0 0 22px rgba(0,183,255,0.16);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            position: relative;
            animation: mascotBob 2.1s ease-in-out infinite;
        }

        .hero-mascot::before {
            content: "";
            position: absolute;
            width: 3.25rem;
            height: 1.55rem;
            border-radius: 999px;
            border: 3px solid rgba(103,255,159,0.95);
            box-shadow: 0 0 15px rgba(57,255,136,0.72), inset 0 0 12px rgba(0,183,255,0.32);
            transform: rotate(-13deg);
        }

        .hero-mascot::after {
            content: "";
            position: absolute;
            width: 2.35rem;
            height: 2.35rem;
            top: 0.2rem;
            left: 0.22rem;
            background:
                linear-gradient(135deg, transparent 0 44%, #b8f2ff 45% 58%, transparent 59%),
                linear-gradient(25deg, transparent 0 36%, #b8f2ff 37% 49%, transparent 50%),
                linear-gradient(155deg, transparent 0 42%, #b8f2ff 43% 54%, transparent 55%);
            clip-path: polygon(50% 0%, 61% 35%, 100% 28%, 68% 52%, 93% 83%, 55% 66%, 37% 100%, 36% 62%, 0 72%, 29% 48%, 5% 18%, 39% 34%);
            filter: drop-shadow(0 0 7px rgba(184,242,255,0.7));
            opacity: 0.94;
        }

        .hero-mascot-face {
            position: relative;
            width: 2.1rem;
            height: 2.15rem;
            margin-top: 1.25rem;
            border-radius: 48% 48% 54% 54%;
            background: #ffd4a8;
            border: 2px solid #15102f;
            box-shadow: inset 0 -0.28rem 0 rgba(255, 170, 120, 0.22);
        }

        .hero-mascot-face::before,
        .hero-mascot-face::after {
            content: "";
            position: absolute;
            top: 0.72rem;
            width: 0.28rem;
            height: 0.28rem;
            border-radius: 999px;
            background: #15102f;
            box-shadow: 0 0.42rem 0 -0.08rem rgba(21,16,47,0.8);
        }

        .hero-mascot-face::before { left: 0.55rem; }
        .hero-mascot-face::after { right: 0.55rem; }

        .hero-title {
            margin: 0;
            color: #67ff9f;
            text-shadow: 0 0 12px rgba(57,255,136,0.72), 0 3px 0 rgba(0,0,0,0.45);
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2.1rem, 8.5vw, 3.15rem);
            line-height: 0.9;
            letter-spacing: 0.08em;
        }

        .hero-subtitle {
            margin: 0.15rem 0 0.3rem;
            color: #d7fff0;
            font-size: 1.02rem;
            font-weight: 700;
        }

        .hero-copy {
            margin: 0 0 1rem;
            color: #a9e8c7;
            font-size: 0.9rem;
            line-height: 1.28;
        }

        .hero-tray {
            display: flex;
            justify-content: center;
            gap: 0.55rem;
            margin: 0 0 1rem;
            flex-wrap: wrap;
        }

        .hero-chip {
            min-width: 4.7rem;
            padding: 0.45rem 0.6rem;
            border-radius: 0.95rem;
            background: rgba(16, 35, 45, 0.76);
            border: 1px solid rgba(103,255,159,0.52);
            box-shadow: inset 0 -3px 0 rgba(57, 255, 136, 0.08);
        }

        .hero-chip span {
            display: block;
            line-height: 1;
        }

        .hero-chip .emoji {
            font-size: 1.15rem;
            margin-bottom: 0.22rem;
        }

        .hero-chip .label {
            color: #b9ffd5;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 12, 20, 0.46);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .hidden { display: none !important; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .z-10 { z-index: 10; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .grid { display: grid; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .flex-col { flex-direction: column; }
        .gap-2 { gap: 0.5rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .select-none { user-select: none; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(92, 128, 110, 0.55);
            border-radius: 999px;
        }

        @keyframes mascotBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes labScanDrift {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-44px, 0, 0); }
        }

        @media (max-width: 640px) {
            #hud {
                top: 0.75rem;
                left: 0.75rem;
                right: 0.75rem;
                gap: 0.55rem;
            }

            .score-card {
                min-width: 114px;
                padding: 0.75rem 0.85rem;
            }

            .score-value {
                font-size: 1.7rem;
            }

            .market-btn {
                padding: 0.62rem 0.8rem;
                font-size: 0.9rem;
            }

            .tool-strip {
                gap: 0.35rem;
                padding: 0.42rem;
            }

            .tool-btn {
                width: 3.45rem;
                height: 3.45rem;
                border-radius: 0.9rem;
            }

            .tool-btn span:first-child {
                font-size: 1.35rem;
            }

            .tool-btn span:last-child {
                font-size: 9px;
            }

            .modal-shell {
                padding: 0.9rem;
                max-height: 84vh;
            }

            .hero-row {
                flex-direction: column;
                gap: 0.4rem;
            }

                .hero-mascot {
                    width: 4.2rem;
                    height: 4.2rem;
                }

                .phase-badge {
                    max-width: 9.5rem;
                    font-size: 0.64rem;
                }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: start/ui/plant/water/harvest/error/menu -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Garden Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="none" loop></audio>
<audio id="sfx_start" data-editable="audio" data-label="SFX Start Game" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="none"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="none"></audio>
<audio id="sfx_plant" data-editable="audio" data-label="SFX Plant" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="none"></audio>
<audio id="sfx_water" data-editable="audio" data-label="SFX Water" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="none"></audio>
<audio id="sfx_harvest" data-editable="audio" data-label="SFX Harvest" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="none"></audio>
<audio id="sfx_error" data-editable="audio" data-label="SFX Error" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="none"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "growthSpeed": { "type": "number", "label": "Global Growth Multiplier", "value": 1, "min": 0.1, "max": 5 },
    "gridSize": { "type": "number", "label": "Grid Size", "value": 6, "min": 4, "max": 10 }
}
</script>

<!-- UI -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start hidden pointer-events-none z-10">
        <div class="flex flex-col gap-2 pointer-events-auto">
            <div class="glass hud-shell score-card">
                <span class="hud-label">Portal Credits</span>
                <span class="score-value">¤<span id="scoreVal">0</span></span>
                <span id="phaseBadge" class="phase-badge">Garage Plot</span>
            </div>
            <button onclick="toggleShop()" class="market-btn">
                <span>🛸</span>
                <span>SPECIMEN EXCHANGE</span>
            </button>
        </div>

        <div class="tool-strip pointer-events-auto">
            <button id="tool-plow" class="tool-btn active" onclick="selectTool('plow')">
                <span>🔧</span>
                <span>CALIB</span>
            </button>
            <button id="tool-seed" class="tool-btn" onclick="selectTool('seed')">
                <span id="active-seed-icon">🌱</span>
                <span>SAMPLE</span>
                <span id="seed-cost-badge" class="seed-badge">Free</span>
            </button>
            <button id="tool-water" class="tool-btn" onclick="selectTool('water')">
                <span>🧪</span>
                <span>SERUM</span>
            </button>
            <button id="tool-harvest" class="tool-btn" onclick="selectTool('harvest')">
                <span>⚗️</span>
                <span>EXTRACT</span>
            </button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="absolute inset-0 z-40 screen-overlay hidden flex items-center justify-center">
        <div class="glass modal-shell">
            <div class="modal-header">
                <h2 class="font-display" style="margin:0; font-size:2rem; color:#67ff9f;">SPECIMEN RACK</h2>
                <button onclick="toggleShop()" class="close-btn">✕</button>
            </div>
            <div id="shop-grid" class="shop-grid">
                <!-- Shop items injected by JS -->
            </div>
        </div>
    </div>

<script>
/**

/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.sfxVolume = {
            sfx_start: 0.5,
            sfx_ui: 0.35,
            sfx_plant: 0.32,
            sfx_water: 0.28,
            sfx_harvest: 0.42,
            sfx_error: 0.28
        };
        this.fallbackMap = {
            sfx_start: 'buy',
            sfx_ui: 'buy',
            sfx_plant: 'plow',
            sfx_water: 'water',
            sfx_harvest: 'coin',
            sfx_error: 'error'
        };
        // [agent-note][stage4] repair: avoid eager remote audio fetch/CORS console noise; synthesized SFX remains active and gameplay-neutral.
        this.remoteAudioEnabled = false;
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    async loadSound(id) {
        const el = document.getElementById(id);
        if (!el) return;
        if (!this.remoteAudioEnabled) {
            this.buffers[id] = { error: true };
            return;
        }
        try {
            const response = await fetch(el.src, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            this.buffers[id] = { error: true };
        }
    }

    playBgm() {
        if (!this.unlocked || !this.remoteAudioEnabled) return;
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.2;
        if (el.paused) el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, minGap = 90) {
        if (!this.unlocked) return;
        const nowStamp = performance.now();
        if (this.lastPlayedAt[id] && nowStamp - this.lastPlayedAt[id] < minGap) return;
        this.lastPlayedAt[id] = nowStamp;

        const bufferInfo = this.buffers[id];
        if (bufferInfo && !bufferInfo.error) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = bufferInfo;
            gain.gain.value = this.sfxVolume[id] ?? 0.3;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else if (this.remoteAudioEnabled) {
            const el = document.getElementById(id);
            if (el) {
                const clone = el.cloneNode(true);
                clone.volume = this.sfxVolume[id] ?? 0.3;
                clone.play().catch(() => {
                    this.synthesize(this.fallbackMap[id] || 'buy');
                });
            } else {
                this.synthesize(this.fallbackMap[id] || 'buy');
            }
        } else {
            this.synthesize(this.fallbackMap[id] || 'buy');
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'plow') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start();
            osc.stop(now + 0.1);
        } else if (type === 'water') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        } else if (type === 'buy' || type === 'coin') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.linearRampToValueAtTime(680, now + 0.12);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.24);
            osc.start();
            osc.stop(now + 0.24);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(170, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        }
    }
}

/**
 * GAME ENGINE
 */
const audioManager = new AudioManager();

// Config
let gameConfig = { growthSpeed: 1, gridSize: 6 };

// State
let money = 0;
let grid = [];
let particles = [];
let floatingTexts = [];
let currentTool = 'plow';
let unlockedCrops = ['wheat'];
let activeCropId = 'wheat';
let lastTime = 0;
let camera = { x: 0, y: 0 };

// Constants
const TILE_SIZE = 64;
const BLOCK_HEIGHT = 16;
const COLORS = {
    grass: '#2abf6c',
    grassDark: '#126b48',
    soil: '#5b3f2a',
    soilDark: '#291913',
    water: '#39ff88',
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const phaseEl = document.getElementById('phaseBadge');
const startScreen = document.getElementById('start-screen');
const hud = document.getElementById('hud');
const gifFeedback = document.getElementById('gif-feedback');
const gifFeedbackImg = document.getElementById('gif-feedback-img');
const GIFS = {
    harvest: 'https://i.giphy.com/l4FGpPki5v2Bcd6Ss.webp',
    fail: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
};
let gifTimer = null;

// Initialize
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.updateGameConfig = (key, val) => {
    if (gameConfig.hasOwnProperty(key)) {
        gameConfig[key] = val;
        if (key === 'gridSize') initGrid();
    }
};

function init() {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;

    ['sfx_start', 'sfx_ui', 'sfx_plant', 'sfx_water', 'sfx_harvest', 'sfx_error'].forEach(id => {
        audioManager.loadSound(id);
    });

    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleMove, { passive: false });
    canvas.addEventListener('pointerup', () => {}, { passive: false });
    canvas.addEventListener('pointercancel', () => {}, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        audioManager.unlock();
        audioManager.playSfx('sfx_start', 0);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        initGrid();
        updateShopUI();
        requestAnimationFrame(gameLoop);
    });
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    camera.x = window.innerWidth / 2;
    camera.y = window.innerHeight / 2 - (gameConfig.gridSize * TILE_SIZE / 4);
}

function initGrid() {
    grid = [];
    const size = gameConfig.gridSize;
    for (let x = 0; x < size; x++) {
        grid[x] = [];
        for (let y = 0; y < size; y++) {
            grid[x][y] = {
                state: 'grass',
                cropType: null,
                timer: 0,
                scale: 0,
                heightOffset: 0,
                watered: false
            };
        }
    }
}

// Isometric Maths
function isoToScreen(gx, gy) {
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    return {
        x: (gx - gy) * tileW + camera.x,
        y: (gx + gy) * tileH + camera.y
    };
}

function screenToIso(sx, sy) {
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    const gy = ((adjY / tileH) - (adjX / tileW)) / 2;
    const gx = ((adjY / tileH) + (adjX / tileW)) / 2;
    return { x: Math.floor(gx), y: Math.floor(gy) };
}

// Game Loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            const cell = grid[x][y];
            if (cell.heightOffset > 0) cell.heightOffset = Math.max(0, cell.heightOffset - dt * 50);

            if (cell.state === 'seeded' && cell.watered) {
                cell.timer += dt;
                const cropData = CROPS[cell.cropType];
                const requiredTime = cropData.growthTime * gameConfig.growthSpeed;
                cell.scale = Math.min(1, cell.timer / requiredTime);

                if (cell.timer >= requiredTime) {
                    cell.state = 'ripe';
                    cell.scale = 1;
                    cell.heightOffset = 10;
                }
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        p.vz -= dt * 2;
        if (p.z < 0) { p.z = 0; p.vz *= -0.5; }
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        t.y -= dt * 30;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    const now = performance.now();
    const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grd.addColorStop(0, '#15102f');
    grd.addColorStop(0.46, '#07151d');
    grd.addColorStop(1, '#102713');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // [agent-note][world-design-v4] authored-background: procedural portal garage; decorative only, never affects tile targeting.
    const portalX = canvas.width * 0.78;
    const portalY = canvas.height * 0.2;
    const portalR = Math.min(canvas.width, canvas.height) * 0.23;
    const portalGlow = ctx.createRadialGradient(portalX, portalY, 10, portalX, portalY, portalR);
    portalGlow.addColorStop(0, 'rgba(103, 255, 159, 0.58)');
    portalGlow.addColorStop(0.32, 'rgba(0, 183, 255, 0.24)');
    portalGlow.addColorStop(0.7, 'rgba(255, 79, 216, 0.08)');
    portalGlow.addColorStop(1, 'rgba(57, 255, 136, 0)');
    ctx.fillStyle = portalGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(portalX, portalY);
    ctx.rotate(now * 0.00025);
    for (let ring = 0; ring < 4; ring++) {
        ctx.strokeStyle = ring % 2 === 0 ? 'rgba(103, 255, 159, 0.64)' : 'rgba(44, 218, 255, 0.34)';
        ctx.lineWidth = ring === 0 ? 6 : 2.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 78 - ring * 11, 36 - ring * 5, -0.25 + ring * 0.32, 0, Math.PI * 2);
        ctx.stroke();
    }
    for (let tick = 0; tick < 12; tick++) {
        const a = tick / 12 * Math.PI * 2;
        ctx.strokeStyle = tick % 3 === 0 ? 'rgba(248,234,90,0.48)' : 'rgba(103,255,159,0.44)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 88, Math.sin(a) * 41);
        ctx.lineTo(Math.cos(a) * 102, Math.sin(a) * 48);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = 'rgba(5, 10, 18, 0.72)';
    for (let i = 0; i < 7; i++) {
        const towerX = canvas.width * (0.05 + i * 0.13);
        const towerH = 30 + (i % 3) * 18;
        ctx.fillRect(towerX, canvas.height * 0.55 - towerH, 18 + (i % 2) * 8, towerH);
        ctx.fillRect(towerX - 7, canvas.height * 0.55 - towerH - 8, 32, 8);
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(103, 255, 159, 0.07)';
    ctx.lineWidth = 1;
    for (let gx = -60; gx < canvas.width + 80; gx += 44) {
        ctx.beginPath();
        ctx.moveTo(gx + ((now * 0.012) % 44), 0);
        ctx.lineTo(gx - canvas.height * 0.45 + ((now * 0.012) % 44), canvas.height);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(103, 255, 159, 0.1)';
    for (let i = 0; i < 16; i++) {
        const px = (i * 137 + now * 0.012) % canvas.width;
        const py = 50 + ((i * 47 + Math.sin(now * 0.001 + i) * 14) % Math.max(140, canvas.height * 0.52));
        ctx.fillRect(px, py, i % 4 === 0 ? 5 : 3, i % 4 === 0 ? 5 : 3);
    }

    const floorY = canvas.height * 0.72;
    ctx.fillStyle = 'rgba(8, 20, 28, 0.78)';
    ctx.fillRect(0, floorY, canvas.width, canvas.height * 0.28);
    ctx.fillStyle = 'rgba(103, 255, 159, 0.14)';
    ctx.fillRect(0, floorY, canvas.width, 3);
    ctx.strokeStyle = 'rgba(44, 218, 255, 0.08)';
    for (let i = 0; i < 12; i++) {
        const y = floorY + i * 20;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y + i * 3);
        ctx.stroke();
    }

    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            drawTile(x, y, grid[x][y]);
        }
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        const size = p.size * (p.life / 0.5);
        ctx.fillRect(p.x, p.y - p.z, size, size);
    });

    ctx.textAlign = 'center';
    ctx.font = '700 24px "Rajdhani"';
    floatingTexts.forEach(t => {
        ctx.fillStyle = `rgba(234, 255, 241, ${t.life})`;
        ctx.strokeStyle = `rgba(0, 196, 111, ${t.life * 0.55})`;
        ctx.lineWidth = 4;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
    });
}

function drawTile(gx, gy, cell) {
    const pos = isoToScreen(gx, gy);
    const x = pos.x;
    const y = pos.y + cell.heightOffset;
    const w = TILE_SIZE * 2;
    const h = TILE_SIZE;

    let topColor = COLORS.grass;
    let sideColor = COLORS.grassDark;

    if (cell.state !== 'grass') {
        topColor = cell.watered ? '#5c3d21' : COLORS.soil;
        sideColor = COLORS.soilDark;
    }

    ctx.fillStyle = sideColor;
    ctx.beginPath();
    ctx.moveTo(x, y + h/2);
    ctx.lineTo(x + w/2, y + h);
    ctx.lineTo(x + w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x, y + h/2 + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    const shine = ctx.createLinearGradient(x, y, x, y + h);
    shine.addColorStop(0, 'rgba(255,255,255,0.25)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (cell.state !== 'grass' && cell.state !== 'plowed' && cell.cropType) {
        const growth = cell.scale || 0.2;
        if (cell.cropType === 'wheat') {
            drawWheat(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'corn') {
            drawCorn(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'pumpkin') {
            drawPumpkin(ctx, x, y + h/2, growth, cell.state === 'ripe');
        }
    }
}

// Procedural Crop Drawers
function drawWheat(ctx, x, y, scale, isRipe) {
    const h = 40 * scale;
    const headColor = isRipe ? '#67ff9f' : '#9ee8c2';
    ctx.strokeStyle = '#0fbf73';
    ctx.lineWidth = Math.max(2, 3 * scale);
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 7, y);
        ctx.lineTo(x + i * 7, y - h);
        ctx.stroke();
        ctx.fillStyle = headColor;
        ctx.beginPath();
        ctx.ellipse(x + i * 7, y - h, (isRipe ? 5 : 3) * scale, (isRipe ? 10 : 6) * scale, i * 0.12, 0, Math.PI * 2);
        ctx.fill();
        if (isRipe) {
            ctx.strokeStyle = 'rgba(248,234,90,0.76)';
            ctx.lineWidth = Math.max(1, 1.5 * scale);
            ctx.stroke();
            ctx.strokeStyle = '#0fbf73';
            ctx.lineWidth = Math.max(2, 3 * scale);
        }
    }
    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.strokeStyle = 'rgba(57,255,136,0.58)';
    ctx.lineWidth = Math.max(1, 2 * scale);
    ctx.beginPath();
    ctx.ellipse(x, y - h * 0.74, 18 * scale, 7 * scale, -0.1, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
}

function drawCorn(ctx, x, y, scale, isRipe) {
    const h = 50 * scale;
    ctx.fillStyle = '#0fbf73';
    ctx.fillRect(x - 3, y - h, 6, h);

    ctx.beginPath();
    ctx.ellipse(x - 10 * scale, y - h/2, 12 * scale, 4 * scale, Math.PI/4, 0, Math.PI*2);
    ctx.ellipse(x + 10 * scale, y - h/3, 12 * scale, 4 * scale, -Math.PI/4, 0, Math.PI*2);
    ctx.fill();

    if (scale > 0.38) {
        ctx.fillStyle = isRipe ? '#f8ea5a' : '#b9ffd5';
        ctx.beginPath();
        ctx.ellipse(x, y - h * 0.8, 8 * scale, 14 * scale, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(57,255,136,0.72)';
        ctx.lineWidth = Math.max(1.5, 2 * scale);
        ctx.beginPath();
        ctx.ellipse(x, y - h * 0.8, 13 * scale, 18 * scale, 0.2, 0, Math.PI*2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.24)';
        ctx.fillRect(x - 2 * scale, y - h * 0.98, 4 * scale, 18 * scale);
        ctx.fillStyle = 'rgba(21,16,47,0.22)';
        for (let k = -1; k <= 1; k++) {
            ctx.fillRect(x + k * 4 * scale, y - h * 0.92, 1.5 * scale, 19 * scale);
        }
    }
}

function drawPumpkin(ctx, x, y, scale, isRipe) {
    const r = 20 * scale;
    ctx.strokeStyle = '#67ff9f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 12, y - 7, x + 22, y);
    ctx.stroke();

    ctx.fillStyle = isRipe ? '#ff4fd8' : '#4fb968';
    ctx.beginPath();
    ctx.arc(x, y - r + 5, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = isRipe ? 'rgba(103,255,159,0.86)' : 'rgba(57,255,136,0.42)';
    ctx.lineWidth = Math.max(2, 3 * scale);
    ctx.beginPath();
    ctx.arc(x, y - r + 5, r * 1.08, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.25, y - r - 1, r * 0.4, r * 0.62, -0.3, 0, Math.PI * 2);
    ctx.fill();

    if (scale > 0.5) {
        ctx.strokeStyle = 'rgba(21,16,47,0.28)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x - r/2, y - r + 5, r/1.5, 0, Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + r/2, y - r + 5, r/1.5, 0, Math.PI*2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(57,255,136,0.88)';
        ctx.beginPath();
        ctx.arc(x - r * 0.32, y - r + 1, 2.5 * scale, 0, Math.PI * 2);
        ctx.arc(x + r * 0.32, y - r + 1, 2.5 * scale, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Interaction
function handleInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const iso = screenToIso(sx, sy);

    if (iso.x >= 0 && iso.x < gameConfig.gridSize && iso.y >= 0 && iso.y < gameConfig.gridSize) {
        interact(iso.x, iso.y);
    }
}

function handleMove(e) { e.preventDefault(); }

function showGif(kind) {
    if (!gifFeedback || !gifFeedbackImg) return;
    gifFeedbackImg.src = GIFS[kind];
    gifFeedbackImg.alt = kind === 'harvest' ? 'celebration reaction' : 'failed action reaction';
    gifFeedback.classList.remove('hidden');
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => {
        gifFeedback.classList.add('hidden');
    }, kind === 'harvest' ? 1600 : 1200);
}

function interact(x, y) {
    const cell = grid[x][y];
    let success = false;
    const pos = isoToScreen(x, y);
    const activeCrop = CROPS[activeCropId];

    if (currentTool === 'plow') {
        if (cell.state === 'grass') {
            cell.state = 'plowed';
            spawnParticles(pos.x, pos.y, COLORS.soil, 5);
            audioManager.playSfx('sfx_plant');
            success = true;
        }
    } else if (currentTool === 'seed') {
        if (cell.state === 'plowed') {
            if (money >= activeCrop.cost) {
                money -= activeCrop.cost;
                updateMoney();
                cell.state = 'seeded';
                cell.cropType = activeCropId;
                cell.timer = 0;
                cell.watered = false;
                spawnParticles(pos.x, pos.y, activeCrop.color, 5);
                audioManager.playSfx('sfx_plant');
                if (activeCrop.cost > 0) addFloatingText(pos.x, pos.y - 40, `-¤${activeCrop.cost}`);
                success = true;
            } else {
                audioManager.playSfx('sfx_error', 120);
                showGif('fail');
                addFloatingText(pos.x, pos.y - 40, "Need Credits!");
            }
        }
    } else if (currentTool === 'water') {
        if ((cell.state === 'seeded' || cell.state === 'ripe') && !cell.watered) {
            cell.watered = true;
            spawnParticles(pos.x, pos.y, COLORS.water, 8);
            audioManager.playSfx('sfx_water');
            success = true;
        }
    } else if (currentTool === 'harvest') {
        if (cell.state === 'ripe') {
            const crop = CROPS[cell.cropType];
            cell.state = 'plowed';
            cell.watered = false;
            cell.timer = 0;

            money += crop.sellPrice;
            updateMoney();

            spawnParticles(pos.x, pos.y, crop.color, 12);
            spawnParticles(pos.x, pos.y, '#ffcc00', 5);
            addFloatingText(pos.x, pos.y - 50, `+¤${crop.sellPrice}`);
            audioManager.playSfx('sfx_harvest');
            showGif('harvest');
            success = true;
        }
    }

    if (!success && currentTool !== 'seed') {
        audioManager.playSfx('sfx_error', 160);
        showGif('fail');
    }

    if (success) cell.heightOffset = 5;
}

// UI Logic
function updateMoney() {
    scoreEl.textContent = money;
    if (phaseEl) {
        if (unlockedCrops.includes('pumpkin')) {
            phaseEl.textContent = money >= 900 ? 'End-Time Market' : 'Cronenberg Chamber';
        } else if (unlockedCrops.includes('corn')) {
            phaseEl.textContent = money >= 300 ? 'Citadel Exchange' : 'C-137 Bio-Dome';
        } else {
            phaseEl.textContent = money >= 75 ? 'Bio-Dome Signal' : 'Garage Plot';
        }
    }
    updateShopUI();
}

window.selectTool = (tool) => {
    currentTool = tool;
    audioManager.playSfx('sfx_ui', 80);
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.id === `tool-${tool}`) btn.classList.add('active');
    });
};

window.toggleShop = () => {
    const modal = document.getElementById('shop-modal');
    const opening = modal.classList.contains('hidden');
    modal.classList.toggle('hidden');
    audioManager.playSfx(opening ? 'sfx_ui' : 'sfx_error', 120);
    if (!modal.classList.contains('hidden')) updateShopUI();
};

function updateShopUI() {
    const gridEl = document.getElementById('shop-grid');
    gridEl.innerHTML = '';

    Object.values(CROPS).forEach(crop => {
        const isUnlocked = unlockedCrops.includes(crop.id);
        const isAffordable = money >= crop.unlockPrice;
        const isActive = activeCropId === crop.id;

        const card = document.createElement('div');
        card.className = `shop-card glass ${isActive ? 'active' : ''}`;

        let actionHtml = '';
        if (isUnlocked) {
            actionHtml = isActive
                ? `<span class="shop-pill active">ACTIVE</span>`
                : `<button onclick="selectCrop('${crop.id}')" class="shop-action equip">EQUIP</button>`;
        } else if (isAffordable) {
            actionHtml = `<button onclick="unlockCrop('${crop.id}')" class="shop-action buy">BUY ¤${crop.unlockPrice}</button>`;
        } else {
            actionHtml = `<span class="shop-pill locked">NEED ¤${crop.unlockPrice}</span>`;
        }

        card.innerHTML = `
            <div style="display:flex; align-items:center; gap:0.7rem; min-width:0;">
                <div class="crop-badge">${crop.icon}</div>
                <div style="min-width:0;">
                    <div class="shop-copy-title">${crop.name}</div>
                    <div class="shop-copy-meta">Extract: ¤${crop.sellPrice} · Sample: ¤${crop.cost}</div>
                </div>
            </div>
            <div>${actionHtml}</div>
        `;
        gridEl.appendChild(card);
    });
}

window.unlockCrop = (id) => {
    const crop = CROPS[id];
    if (money >= crop.unlockPrice) {
        money -= crop.unlockPrice;
        unlockedCrops.push(id);
        audioManager.playSfx('sfx_harvest');
        showGif('harvest');
        selectCrop(id);
        updateMoney();
    }
};

window.selectCrop = (id) => {
    activeCropId = id;
    const crop = CROPS[id];
    document.getElementById('active-seed-icon').textContent = crop.icon;
    const badge = document.getElementById('seed-cost-badge');
    badge.textContent = crop.cost === 0 ? 'Free' : `¤${crop.cost}`;
    badge.style.background = crop.cost === 0 ? 'var(--mint-deep)' : 'var(--berry)';

    selectTool('seed');
    updateShopUI();
};

// Juice
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y + TILE_SIZE / 2, z: 10,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            vz: Math.random() * 3 + 2,
            life: 1.0, color: color, size: Math.random() * 4 + 2
        });
    }
}

function addFloatingText(x, y, text) {
    floatingTexts.push({ x, y, text, life: 1.5 });
}

document.addEventListener('DOMContentLoaded', init);
</script>
