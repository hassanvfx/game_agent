<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brainrot Mom's Day: 3D Bouquet Garden</title>
    <!-- [agent-note][stage4] remapped-font: display/ui -> catalogs/fonts.json using Bangers + Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #ffc6e5;
            --sky-bottom: #fff4cf;
            --panel-bg: rgba(255, 250, 255, 0.9);
            --panel-border: rgba(255, 255, 255, 0.96);
            --panel-shadow: rgba(93, 42, 84, 0.18);
            --mint: #8df0a6;
            --mint-deep: #2f9f5a;
            --soil: #8b5a3c;
            --soil-deep: #5f3426;
            --gold: #ffd75c;
            --gold-deep: #d79a1e;
            --berry: #ff77a8;
            --berry-deep: #d94f86;
            --coupon: #fff06d;
            --tea: #5cc9ff;
            --pumpkin: #ff8b3d;
            --ink: #3f2742;
            --hud-text: #4b2e47;
            --soft-text: #76536d;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.85), transparent 40%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--ink);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,0.38), transparent 18%),
                radial-gradient(circle at 85% 14%, rgba(255,240,186,0.3), transparent 16%),
                radial-gradient(circle at 18% 72%, rgba(255,119,168,0.16), transparent 12%),
                radial-gradient(circle at 78% 70%, rgba(141,240,166,0.15), transparent 14%);
            opacity: 0.9;
            animation: ambientDrift 14s ease-in-out infinite alternate;
        }

        body::after {
            background:
                repeating-linear-gradient(135deg, rgba(255,255,255,0.12) 0 2px, transparent 2px 18px),
                radial-gradient(circle at 50% 110%, rgba(255,119,168,0.18), transparent 34%);
            mix-blend-mode: soft-light;
            opacity: 0.55;
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }

        .glass {
            background:
                linear-gradient(145deg, rgba(255,255,255,0.96), rgba(255,244,250,0.86)),
                var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--panel-border);
            box-shadow: 0 10px 28px var(--panel-shadow), inset 0 -5px 0 rgba(255,119,168,0.06);
        }

        .hud-shell {
            position: relative;
            overflow: hidden;
        }

        .hud-shell::before,
        .hud-shell::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .hud-shell::before {
            width: 2.25rem;
            height: 2.25rem;
            right: -0.8rem;
            bottom: -0.8rem;
            border-radius: 50% 50% 46% 48%;
            background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.9), transparent 24%), var(--berry);
            opacity: 0.18;
            transform: rotate(-18deg);
        }

        .hud-shell::after {
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.36), transparent 45%),
                repeating-linear-gradient(90deg, transparent 0 13px, rgba(255,119,168,0.035) 13px 16px);
        }

        .font-display {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .hud-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--soft-text);
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .tool-strip {
            display: flex;
            gap: 0.5rem;
            padding: 0.55rem;
            border-radius: 1.4rem;
            background: rgba(255,255,255,0.82);
            border: 2px solid rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 24px rgba(34, 88, 63, 0.16);
        }

        .tool-btn {
            position: relative;
            width: 4rem;
            height: 4rem;
            padding: 0.25rem;
            border: 0;
            border-radius: 1rem;
            background: linear-gradient(180deg, #ffffff, #fff1f8);
            border-bottom: 4px solid rgba(62, 121, 76, 0.24);
            color: var(--hud-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.08rem;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 0 6px 12px rgba(43, 82, 56, 0.12);
        }

        .tool-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
            box-shadow: 0 2px 6px rgba(43, 82, 56, 0.1);
        }

        .tool-btn.active {
            background:
                radial-gradient(circle at 72% 18%, rgba(255,255,255,0.65), transparent 22%),
                linear-gradient(180deg, #ffe0f0, #ff77a8);
            color: #4b1738;
            border-bottom-color: #c44d7f;
            box-shadow: 0 7px 0 #c44d7f, 0 0 18px rgba(255, 119, 168, 0.36);
            transform: translateY(-2px);
        }

        .tool-btn::after {
            content: "♥";
            position: absolute;
            right: 0.35rem;
            top: 0.26rem;
            color: rgba(255,119,168,0.5);
            font-size: 0.64rem;
            pointer-events: none;
        }

        .tool-btn span:last-child {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .score-card {
            min-width: 132px;
            padding: 0.9rem 1rem 0.8rem;
            border-radius: 1.15rem;
        }

        .score-value {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: 1.7rem;
            line-height: 1.1;
            color: var(--mint-deep);
            text-shadow: 0 2px 0 rgba(255,255,255,0.9);
        }

        .market-btn,
        .primary-btn,
        .shop-action,
        .close-btn {
            border: 0;
            cursor: pointer;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .market-btn,
        .primary-btn {
            width: 100%;
            border-radius: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        }

        .market-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.72rem 1rem;
            background: linear-gradient(180deg, #ffe97f, #ffcb3a);
            color: #7b4c08;
            box-shadow: 0 6px 0 #d79a1e;
            font-size: 0.98rem;
        }

        .primary-btn {
            padding: 1rem 1.2rem;
            background: linear-gradient(180deg, #ff93bd, #d94f86);
            color: var(--white);
            box-shadow: 0 6px 0 #1d7d3c, 0 0 22px rgba(80, 199, 112, 0.28);
            font-size: 1.05rem;
        }

        .market-btn:active,
        .primary-btn:active,
        .shop-action:active,
        .close-btn:active {
            transform: translateY(3px);
            filter: brightness(0.98);
        }

        .seed-badge {
            position: absolute;
            top: -0.38rem;
            right: -0.38rem;
            min-width: 2rem;
            padding: 0.12rem 0.4rem;
            border-radius: 999px;
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.16);
            background: var(--mint-deep);
        }

        .shop-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 1rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .shop-card:active {
            transform: scale(0.98);
        }

        .shop-card.active {
            border: 2px solid rgba(80, 175, 99, 0.95);
            box-shadow: 0 0 0 3px rgba(132, 230, 145, 0.25);
        }

        .crop-badge {
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            background: linear-gradient(180deg, #f8fff6, #dff4df);
            box-shadow: inset 0 -4px 0 rgba(60, 126, 73, 0.12);
        }

        .shop-copy-title {
            font-size: 1rem;
            font-weight: 700;
            color: #284b3d;
            line-height: 1.1;
        }

        .shop-copy-meta {
            font-size: 0.78rem;
            color: #607a6e;
        }

        .shop-action {
            padding: 0.45rem 0.72rem;
            border-radius: 0.8rem;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            white-space: nowrap;
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
        }

        .shop-action.equip {
            background: linear-gradient(180deg, #6adf7c, #31af54);
            color: #fff;
        }

        .shop-action.buy {
            background: linear-gradient(180deg, #ffe783, #ffc93e);
            color: #7a4b06;
        }

        .shop-pill {
            font-size: 0.78rem;
            font-weight: 700;
            color: #5f776b;
            white-space: nowrap;
        }

        .shop-pill.active {
            color: #2b8a43;
        }

        .shop-pill.locked {
            color: #9ba7a0;
        }

        .modal-shell {
            width: min(100%, 26rem);
            max-height: 82vh;
            border-radius: 1.6rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .close-btn {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            background: rgba(224, 235, 228, 0.95);
            color: #496558;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .shop-grid {
            display: grid;
            gap: 0.65rem;
            overflow-y: auto;
            padding-right: 0.15rem;
        }

        .start-card {
            width: min(100%, 25rem);
            margin: 1rem;
            padding: 1.45rem 1.35rem 1.3rem;
            border-radius: 1.8rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .start-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.7), transparent 42%),
                radial-gradient(circle at 18% 22%, rgba(255,119,168,0.2), transparent 18%),
                linear-gradient(145deg, rgba(141, 240, 166, 0.22), rgba(255, 215, 92, 0.32));
            pointer-events: none;
        }

        .start-inner {
            position: relative;
            z-index: 1;
        }

        .start-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.32rem;
            margin-bottom: 0.45rem;
            padding: 0.28rem 0.65rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            color: #4d6a5c;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-bottom: 0.35rem;
        }

        .hero-mascot {
            width: 4.75rem;
            height: 4.75rem;
            border-radius: 1.3rem;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,0.95), transparent 18%),
                linear-gradient(180deg, #fffef5, #ffe1f0);
            border: 3px solid rgba(255,255,255,0.94);
            box-shadow: 0 10px 24px rgba(38, 111, 68, 0.18), 0 0 0 6px rgba(255,119,168,0.13);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            position: relative;
            animation: mascotBob 2.1s ease-in-out infinite;
        }

        .hero-mascot::before,
        .hero-mascot::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .hero-mascot::before {
            width: 3.1rem;
            height: 1rem;
            top: -0.42rem;
            border-radius: 999px 999px 0.4rem 0.4rem;
            background: linear-gradient(90deg, var(--mint), var(--coupon), var(--berry));
            box-shadow: inset 0 -3px 0 rgba(63,39,66,0.12);
            transform: rotate(-5deg);
        }

        .hero-mascot::after {
            width: 1.35rem;
            height: 1.35rem;
            right: -0.18rem;
            top: 0.35rem;
            background: var(--berry);
            border-radius: 50% 50% 46% 48%;
            transform: rotate(45deg);
            box-shadow: -2.85rem 2.85rem 0 -0.18rem var(--gold);
            opacity: 0.9;
        }

        .hero-mascot-face {
            font-size: 2.45rem;
            filter: drop-shadow(0 2px 0 rgba(255,255,255,0.75));
        }

        .hero-title {
            margin: 0;
            color: #d94f86;
            text-shadow: 0 3px 0 rgba(255,255,255,0.82), 0 6px 0 rgba(141,240,166,0.32);
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2.1rem, 8.5vw, 3.15rem);
            line-height: 0.9;
            letter-spacing: 0.08em;
        }

        .hero-subtitle {
            margin: 0.15rem 0 0.3rem;
            color: #3e584d;
            font-size: 1.02rem;
            font-weight: 700;
        }

        .hero-copy {
            margin: 0 0 1rem;
            color: #667d72;
            font-size: 0.9rem;
            line-height: 1.28;
        }

        .hero-tray {
            display: flex;
            justify-content: center;
            gap: 0.55rem;
            margin: 0 0 1rem;
            flex-wrap: wrap;
        }

        .hero-chip {
            min-width: 4.7rem;
            padding: 0.45rem 0.6rem;
            border-radius: 0.95rem;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.88);
            box-shadow: inset 0 -3px 0 rgba(61, 142, 69, 0.08);
        }

        .hero-chip span {
            display: block;
            line-height: 1;
        }

        .hero-chip .emoji {
            font-size: 1.15rem;
            margin-bottom: 0.22rem;
        }

        .hero-chip .label {
            color: #597164;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 44, 30, 0.28);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .hidden { display: none !important; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .z-10 { z-index: 10; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .grid { display: grid; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .flex-col { flex-direction: column; }
        .gap-2 { gap: 0.5rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .select-none { user-select: none; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(92, 128, 110, 0.55);
            border-radius: 999px;
        }

        @keyframes mascotBob {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }

        @keyframes ambientDrift {
            0% { transform: translate3d(-8px, -4px, 0) scale(1); }
            100% { transform: translate3d(8px, 6px, 0) scale(1.02); }
        }

        @media (max-width: 640px) {
            #hud {
                top: 0.75rem;
                left: 0.75rem;
                right: 0.75rem;
                gap: 0.55rem;
            }

            .score-card {
                min-width: 114px;
                padding: 0.75rem 0.85rem;
            }

            .score-value {
                font-size: 1.7rem;
            }

            .market-btn {
                padding: 0.62rem 0.8rem;
                font-size: 0.9rem;
            }

            .tool-strip {
                gap: 0.22rem;
                padding: 0.32rem;
                flex-shrink: 0;
            }

            .tool-btn {
                width: 3.05rem;
                height: 3.25rem;
                border-radius: 0.85rem;
            }

            .tool-btn span:first-child {
                font-size: 1.35rem;
            }

            .tool-btn span:last-child {
                font-size: 9px;
            }

            .modal-shell {
                padding: 0.9rem;
                max-height: 84vh;
            }

            .hero-row {
                flex-direction: column;
                gap: 0.4rem;
            }

            .hero-mascot {
                width: 4.2rem;
                height: 4.2rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: start/ui/plant/water/harvest/error/menu -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Garden Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_start" data-editable="audio" data-label="SFX Start Game" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_plant" data-editable="audio" data-label="SFX Plant" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_water" data-editable="audio" data-label="SFX Water" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
<audio id="sfx_harvest" data-editable="audio" data-label="SFX Harvest" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
<audio id="sfx_error" data-editable="audio" data-label="SFX Error" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "growthSpeed": { "type": "number", "label": "Global Growth Multiplier", "value": 1, "min": 0.1, "max": 5 },
    "gridSize": { "type": "number", "label": "Grid Size", "value": 6, "min": 4, "max": 10 }
}
</script>

<!-- UI -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start hidden pointer-events-none z-10">
        <div class="flex flex-col gap-2 pointer-events-auto">
            <div class="glass hud-shell score-card">
                <span class="hud-label">Bouquet Budget</span>
                <span class="score-value">$<span id="scoreVal">0</span></span>
            </div>
            <button onclick="toggleShop()" class="market-btn">
                <span>💐</span>
                <span>GIFT STALL</span>
            </button>
        </div>

        <div class="tool-strip pointer-events-auto">
            <button id="tool-plow" class="tool-btn active" onclick="selectTool('plow')">
                <span>💌</span>
                <span>PREP</span>
            </button>
            <button id="tool-seed" class="tool-btn" onclick="selectTool('seed')">
                <span id="active-seed-icon">🌾</span>
                <span>PLANT</span>
                <span id="seed-cost-badge" class="seed-badge">Free</span>
            </button>
            <button id="tool-water" class="tool-btn" onclick="selectTool('water')">
                <span>🫖</span>
                <span>TEA</span>
            </button>
            <button id="tool-harvest" class="tool-btn" onclick="selectTool('harvest')">
                <span>🎁</span>
                <span>GIFT</span>
            </button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="absolute inset-0 z-40 screen-overlay hidden flex items-center justify-center">
        <div class="glass modal-shell">
            <div class="modal-header">
                <h2 class="font-display" style="margin:0; font-size:2rem; color:#d94f86;">GIFT STALL</h2>
                <button onclick="toggleShop()" class="close-btn">✕</button>
            </div>
            <div id="shop-grid" class="shop-grid">
                <!-- Shop items injected by JS -->
            </div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: harvest/invalid feedback -> catalogs/gifs.json -->
    <div id="gif-feedback" class="absolute right-4 z-40 hidden pointer-events-none" style="bottom: 1rem; width: min(30vw, 8rem);">
        <img id="gif-feedback-img" alt="" style="width:100%; border-radius: 1rem; border: 3px solid rgba(255,255,255,0.92); box-shadow: 0 10px 24px rgba(26, 68, 49, 0.25); object-fit: cover;">
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center screen-overlay">
        <div class="glass start-card">
            <div class="start-inner">
                <div class="start-kicker"><span>💖</span><span>Mom's Day Brainrot Crew</span></div>
                <div class="hero-row">
                    <div class="hero-mascot" aria-hidden="true">

<script>

/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.sfxVolume = {
            sfx_start: 0.5,
            sfx_ui: 0.35,
            sfx_plant: 0.32,
            sfx_water: 0.28,
            sfx_harvest: 0.42,
            sfx_error: 0.28
        };
        this.fallbackMap = {
            sfx_start: 'buy',
            sfx_ui: 'buy',
            sfx_plant: 'plow',
            sfx_water: 'water',
            sfx_harvest: 'coin',
            sfx_error: 'error'
        };
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    async loadSound(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const response = await fetch(el.src, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            this.buffers[id] = { error: true };
        }
    }

    playBgm() {
        if (!this.unlocked) return;
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.2;
        if (el.paused) el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, minGap = 90) {
        if (!this.unlocked) return;
        const nowStamp = performance.now();
        if (this.lastPlayedAt[id] && nowStamp - this.lastPlayedAt[id] < minGap) return;
        this.lastPlayedAt[id] = nowStamp;

        const bufferInfo = this.buffers[id];
        if (bufferInfo && !bufferInfo.error) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = bufferInfo;
            gain.gain.value = this.sfxVolume[id] ?? 0.3;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            const el = document.getElementById(id);
            if (el) {
                const clone = el.cloneNode(true);
                clone.volume = this.sfxVolume[id] ?? 0.3;
                clone.play().catch(() => {
                    this.synthesize(this.fallbackMap[id] || 'buy');
                });
            } else {
                this.synthesize(this.fallbackMap[id] || 'buy');
            }
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'plow') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start();
            osc.stop(now + 0.1);
        } else if (type === 'water') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        } else if (type === 'buy' || type === 'coin') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.linearRampToValueAtTime(680, now + 0.12);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.24);
            osc.start();
            osc.stop(now + 0.24);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(170, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        }
    }
}

/**
 * GAME ENGINE
 */
const audioManager = new AudioManager();

// Config
let gameConfig = { growthSpeed: 1, gridSize: 6 };

// State
let money = 0;
let grid = [];
let particles = [];
let floatingTexts = [];
let currentTool = 'plow';
let unlockedCrops = ['wheat'];
let activeCropId = 'wheat';
let lastTime = 0;
let camera = { x: 0, y: 0 };

// Constants
const TILE_SIZE = 64;
const BLOCK_HEIGHT = 16;
const COLORS = {
    grass: '#7ec850',
    grassDark: '#5da638',
    soil: '#8b5a2b',
    soilDark: '#603d1b',
    water: '#4fa4f4',
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');

    harvest: 'https://i.giphy.com/l4FGpPki5v2Bcd6Ss.webp',
    fail: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
};
let gifTimer = null;

// Initialize
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.updateGameConfig = (key, val) => {

};

function init() {

    for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;

    ['sfx_start', 'sfx_ui', 'sfx_plant', 'sfx_water', 'sfx_harvest', 'sfx_error'].forEach(id => {

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    camera.x = window.innerWidth / 2;
    camera.y = window.innerHeight / 2 - (gameConfig.gridSize * TILE_SIZE / 4);
}

function initGrid() {
    grid = [];
    const size = gameConfig.gridSize;
    for (let x = 0; x < size; x++) {
        grid[x] = [];
        for (let y = 0; y < size; y++) {
            grid[x][y] = {
                state: 'grass',
                cropType: null,
                timer: 0,
                scale: 0,
                heightOffset: 0,
                watered: false
            };
        }
    }
}

// Isometric Maths
function isoToScreen(gx, gy) {
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    return {
        x: (gx - gy) * tileW + camera.x,
        y: (gx + gy) * tileH + camera.y
    };
}

function screenToIso(sx, sy) {
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    const gy = ((adjY / tileH) - (adjX / tileW)) / 2;
    const gx = ((adjY / tileH) + (adjX / tileW)) / 2;
    return { x: Math.floor(gx), y: Math.floor(gy) };
}

// Game Loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            const cell = grid[x][y];
            if (cell.heightOffset > 0) cell.heightOffset = Math.max(0, cell.heightOffset - dt * 50);

            if (cell.state === 'seeded' && cell.watered) {
                cell.timer += dt;
                const cropData = CROPS[cell.cropType];
                const requiredTime = cropData.growthTime * gameConfig.growthSpeed;
                cell.scale = Math.min(1, cell.timer / requiredTime);

                if (cell.timer >= requiredTime) {
                    cell.state = 'ripe';
                    cell.scale = 1;
                    cell.heightOffset = 10;
                }
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        p.vz -= dt * 2;
        if (p.z < 0) { p.z = 0; p.vz *= -0.5; }
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        t.y -= dt * 30;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#ffc6e5');
    grd.addColorStop(0.46, '#b9f5ff');
    grd.addColorStop(1, '#fff4cf');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    const sunGlow = ctx.createRadialGradient(W * 0.16, H * 0.11, 10, W * 0.16, H * 0.11, 180);
    sunGlow.addColorStop(0, 'rgba(255, 245, 175, 0.68)');
    sunGlow.addColorStop(1, 'rgba(255, 245, 175, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, W, H);

    // [agent-note][world-design-v4] authored-background: procedural Mom's Day motifs only; keep decorative layers behind the grid and away from controls.
    drawBackgroundMotifs(W, H);

    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            drawTile(x, y, grid[x][y]);
        }
    }

    particles.forEach(drawParticle);

    ctx.textAlign = 'center';
    ctx.font = '700 24px "Rajdhani"';
    floatingTexts.forEach(t => {
        ctx.fillStyle = `rgba(255, 255, 255, ${t.life})`;
        ctx.strokeStyle = `rgba(40, 73, 49, ${t.life * 0.5})`;
        ctx.lineWidth = 4;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
    });
}

function drawBackgroundMotifs(W, H) {
    const t = performance.now() * 0.001;
    const tier = money >= 500 || unlockedCrops.includes('pumpkin') ? 4 : money >= 150 || unlockedCrops.includes('corn') ? 3 : money >= 60 ? 2 : 1;
    ctx.save();

    // Soft isometric momcore diorama floor, behind all tiles.
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = tier >= 4 ? 'rgba(255,139,61,0.18)' : tier >= 3 ? 'rgba(141,240,166,0.16)' : 'rgba(255,119,168,0.15)';
    ctx.beginPath();
    ctx.ellipse(W * 0.5, H * 0.74, Math.min(W * 0.55, 360), Math.min(H * 0.18, 120), 0, 0, Math.PI * 2);
    ctx.fill();

    // Coupon bunting / parade ribbon.
    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = 'rgba(63,39,66,0.18)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W * 0.12, H * 0.29);
    ctx.quadraticCurveTo(W * 0.5, H * (0.23 + Math.sin(t * 0.6) * 0.01), W * 0.88, H * 0.29);
    ctx.stroke();
    for (let i = 0; i < 8; i++) {
        const x = W * 0.16 + i * (W * 0.68 / 7);
        const y = H * 0.29 + Math.sin(t * 0.8 + i) * 4;
        drawCouponTag(x, y, i % 2 ? '#ffd75c' : '#ff77a8', 0.72 + (i % 3) * 0.08);
    }

    // Heart balloons and gift arch props stay away from tile centers/HUD.
    ctx.globalAlpha = 0.44;
    [
        { x: 0.12, y: 0.42, s: 0.92, c: '#ff77a8' },
        { x: 0.82, y: 0.2, s: 0.78, c: '#ffd75c' },
        { x: 0.9, y: 0.6, s: 0.88, c: '#8df0a6' }
    ].forEach((b, i) => {
        const bx = W * b.x + Math.sin(t + i) * 6;
        const by = H * b.y + Math.cos(t * 0.8 + i) * 5;
        drawHeart(ctx, bx, by, 18 * b.s, b.c, true);
        ctx.strokeStyle = 'rgba(95, 52, 78, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx, by + 18 * b.s);
        ctx.quadraticCurveTo(bx - 8 * b.s, by + 40 * b.s, bx + 4 * b.s, by + 62 * b.s);
        ctx.stroke();
    });

    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 5; i++) {
        drawGiftBag(W * (0.12 + i * 0.19), H * 0.86 + Math.sin(t * 0.7 + i) * 4, 0.75, i % 2 ? '#8df0a6' : '#ff8b3d');
    }

    ctx.globalAlpha = 0.24;
    for (let i = 0; i < 10; i++) {
        const sx = W * (0.08 + (i * 0.094) % 0.84);
        const sy = H * (0.5 + ((i * 37) % 22) / 100) + Math.sin(t + i) * 8;
        drawSteamCurl(sx, sy, 18 + (i % 3) * 5);
    }

    ctx.globalAlpha = 0.5;
    drawSceneBadge(W, H, tier);
    ctx.restore();
}

function drawSceneBadge(W, H, tier) {
    const labels = ['STARTER BED', 'COUPON STAND', 'MOMCORE ARCADE', 'BRUNCH RUSH'];
    const x = W * 0.5;
    const y = Math.min(H - 54, H * 0.92);
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255,255,255,0.46)';
    ctx.strokeStyle = 'rgba(255,119,168,0.35)';
    ctx.lineWidth = 2;
    roundRectPath(-84, -18, 168, 36, 14);
    ctx.fill();
    ctx.stroke();
    ctx.font = '700 12px "Rajdhani"';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(63,39,66,0.62)';
    ctx.fillText(`LV ${tier} · ${labels[tier - 1]}`, 0, 4);
    ctx.restore();
}

function drawCouponTag(x, y, color, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(x * 0.02 + y * 0.01) * 0.08);
    ctx.fillStyle = color;
    roundRectPath(-17 * s, 0, 34 * s, 24 * s, 5 * s);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.fillRect(-3 * s, 1 * s, 6 * s, 22 * s);
    ctx.fillStyle = 'rgba(63,39,66,0.25)';
    ctx.beginPath();
    ctx.arc(0, 6 * s, 2.2 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawGiftBag(x, y, s, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(63,39,66,0.08)';
    ctx.beginPath();
    ctx.ellipse(0, 21 * s, 25 * s, 7 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;
    roundRectPath(-18 * s, -22 * s, 36 * s, 42 * s, 8 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.arc(0, -21 * s, 10 * s, Math.PI, 0);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(-3 * s, -18 * s, 6 * s, 36 * s);
    drawHeart(ctx, 0, -1 * s, 5 * s, '#ffffff', false);
    ctx.restore();
}

function drawSteamCurl(x, y, h) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.78)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.5);
    ctx.bezierCurveTo(x - 12, y + h * 0.1, x + 12, y - h * 0.15, x, y - h * 0.5);
    ctx.stroke();
    ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
    if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        return;
    }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
}

function drawHeart(ctx, x, y, size, color, glossy = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 24, size / 24);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.bezierCurveTo(-22, -7, -10, -20, 0, -8);
    ctx.bezierCurveTo(10, -20, 22, -7, 0, 10);
    ctx.fill();
    if (glossy) {
        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        ctx.beginPath();
        ctx.ellipse(-5, -7, 4, 2.2, -0.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawTile(gx, gy, cell) {
    const pos = isoToScreen(gx, gy);
    const x = pos.x;
    const y = pos.y + cell.heightOffset;
    const w = TILE_SIZE * 2;
    const h = TILE_SIZE;

    let topColor = COLORS.grass;
    let sideColor = COLORS.grassDark;

    if (cell.state !== 'grass') {
        topColor = cell.watered ? '#5c3d21' : COLORS.soil;
        sideColor = COLORS.soilDark;
    }

    ctx.fillStyle = sideColor;
    ctx.beginPath();
    ctx.moveTo(x, y + h/2);
    ctx.lineTo(x + w/2, y + h);
    ctx.lineTo(x + w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x, y + h/2 + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h + BLOCK_HEIGHT);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    const shine = ctx.createLinearGradient(x, y, x, y + h);
    shine.addColorStop(0, 'rgba(255,255,255,0.25)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (cell.state === 'grass') {
        ctx.globalAlpha = 0.22;
        drawHeart(ctx, x + 18, y + h * 0.46, 9, '#ffffff', false);
        ctx.globalAlpha = 1;
    } else {
        ctx.save();
        ctx.globalAlpha = cell.watered ? 0.38 : 0.2;
        ctx.strokeStyle = cell.watered ? '#5cc9ff' : '#ffd75c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 20, y + h * 0.5);
        ctx.lineTo(x, y + h * 0.36);
        ctx.lineTo(x + 20, y + h * 0.5);
        ctx.stroke();
        ctx.restore();
    }

    if (cell.state !== 'grass' && cell.state !== 'plowed' && cell.cropType) {
        const growth = cell.scale || 0.2;
        if (cell.cropType === 'wheat') {
            drawWheat(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'corn') {
            drawCorn(ctx, x, y + h/2, growth, cell.state === 'ripe');
        } else if (cell.cropType === 'pumpkin') {
            drawPumpkin(ctx, x, y + h/2, growth, cell.state === 'ripe');
        }
    }
}

// Procedural Crop Drawers
function drawWheat(ctx, x, y, scale, isRipe) {
    const h = 42 * scale;
    const petalColor = isRipe ? '#ffd75c' : '#c4e77d';
    ctx.save();
    ctx.shadowColor = isRipe ? 'rgba(255,119,168,0.35)' : 'rgba(141,240,166,0.24)';
    ctx.shadowBlur = isRipe ? 10 : 5;
    ctx.strokeStyle = '#4ca85f';
    ctx.lineWidth = Math.max(2, 3 * scale);
    for (let i = -1; i <= 1; i++) {
        const sx = x + i * 8;
        ctx.beginPath();
        ctx.moveTo(sx, y);
        ctx.lineTo(sx, y - h);
        ctx.stroke();
        ctx.fillStyle = petalColor;
        ctx.beginPath();
        ctx.ellipse(sx - 4 * scale, y - h, 5 * scale, 8 * scale, -0.6, 0, Math.PI * 2);
        ctx.ellipse(sx + 4 * scale, y - h, 5 * scale, 8 * scale, 0.6, 0, Math.PI * 2);
        ctx.ellipse(sx, y - h - 5 * scale, 5 * scale, 8 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        if (isRipe) {
            ctx.fillStyle = '#ff77a8';
            ctx.beginPath();
            ctx.arc(sx, y - h, 3.5 * scale, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(x - 11 * scale, y - h * 0.68, 22 * scale, 4 * scale);
    if (isRipe) {
        drawHeart(ctx, x + 15 * scale, y - h - 8 * scale, 7 * scale, '#ff77a8', true);
    }
    ctx.restore();
}

function drawCorn(ctx, x, y, scale, isRipe) {
    const h = 50 * scale;
    ctx.save();
    ctx.shadowColor = isRipe ? 'rgba(255,215,92,0.45)' : 'rgba(54,187,99,0.24)';
    ctx.shadowBlur = isRipe ? 9 : 4;
    ctx.fillStyle = '#36bb63';
    ctx.fillRect(x - 3, y - h, 6, h);

    ctx.beginPath();
    ctx.ellipse(x - 10 * scale, y - h/2, 12 * scale, 4 * scale, Math.PI/4, 0, Math.PI*2);
    ctx.ellipse(x + 10 * scale, y - h/3, 12 * scale, 4 * scale, -Math.PI/4, 0, Math.PI*2);
    ctx.fill();

    if (scale > 0.6) {
        ctx.fillStyle = isRipe ? '#ffd75c' : '#f0f3bd';
        ctx.beginPath();
        ctx.roundRect(x - 12 * scale, y - h * 1.05, 24 * scale, 22 * scale, 4 * scale);
        ctx.fill();
        ctx.fillStyle = '#ff77a8';
        ctx.fillRect(x - 2 * scale, y - h * 1.05, 4 * scale, 22 * scale);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(x - 8 * scale, y - h, 8 * scale, 3 * scale);
        ctx.fillStyle = '#7b4c08';
        ctx.fillRect(x - 5 * scale, y - h * 0.82, 3 * scale, 3 * scale);
        ctx.fillRect(x + 3 * scale, y - h * 0.82, 3 * scale, 3 * scale);
    }
    ctx.restore();
}

function drawPumpkin(ctx, x, y, scale, isRipe) {
    const r = 20 * scale;
    ctx.save();
    ctx.shadowColor = isRipe ? 'rgba(255,139,61,0.45)' : 'rgba(79,185,104,0.24)';
    ctx.shadowBlur = isRipe ? 10 : 4;
    ctx.strokeStyle = '#2f9455';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 12, y - 6, x + 22, y);
    ctx.stroke();

    ctx.fillStyle = isRipe ? '#ff8b3d' : '#4fb968';
    ctx.beginPath();
    ctx.roundRect(x - r, y - r * 1.8, r * 2, r * 1.8, 8 * scale);
    ctx.fill();

    if (isRipe) {
        ctx.fillStyle = '#ffd75c';
        ctx.fillRect(x - 3 * scale, y - r * 1.8, 6 * scale, r * 1.8);
        ctx.fillStyle = '#ff77a8';
        ctx.beginPath();
        ctx.ellipse(x, y - r * 1.86, 13 * scale, 5 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.25, y - r - 3, r * 0.4, r * 0.55, -0.3, 0, Math.PI * 2);
    ctx.fill();
    if (isRipe) {
        ctx.fillStyle = '#5b2c2b';
        ctx.fillRect(x - 6 * scale, y - r * 1.12, 4 * scale, 4 * scale);
        ctx.fillRect(x + 3 * scale, y - r * 1.12, 4 * scale, 4 * scale);
        drawHeart(ctx, x + r * 0.62, y - r * 1.52, 7 * scale, '#ffffff', false);
    }
    ctx.restore();
}

function drawParticle(p) {
    const alpha = Math.max(0, Math.min(1, p.life));
    const size = p.size * (0.55 + alpha);
    const py = p.y - p.z;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (p.shape === 'heart') {
        drawHeart(ctx, p.x, py, size * 3.2, p.color, true);
    } else if (p.shape === 'spark') {
        ctx.translate(p.x, py);
        ctx.rotate((1 - alpha) * Math.PI);
        ctx.fillStyle = p.color;
        ctx.fillRect(-size * 0.45, -size * 2, size * 0.9, size * 4);
        ctx.fillRect(-size * 2, -size * 0.45, size * 4, size * 0.9);
    } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - size / 2, py - size / 2, size, size);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(p.x - size / 2, py - size / 2, size * 0.45, size * 0.45);
    }
    ctx.restore();
}

// Interaction
function handleInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const iso = screenToIso(sx, sy);

    if (iso.x >= 0 && iso.x < gameConfig.gridSize && iso.y >= 0 && iso.y < gameConfig.gridSize) {
        interact(iso.x, iso.y);
    }
}

function handleMove(e) { e.preventDefault(); }

function showGif(kind) {
    if (!gifFeedback || !gifFeedbackImg) return;
    gifFeedbackImg.src = GIFS[kind];
    gifFeedbackImg.alt = kind === 'harvest' ? 'celebration reaction' : 'failed action reaction';
    gifFeedback.classList.remove('hidden');
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => {
        gifFeedback.classList.add('hidden');
    }, kind === 'harvest' ? 1600 : 1200);
}

function interact(x, y) {
    const cell = grid[x][y];
    let success = false;
    const pos = isoToScreen(x, y);
    const activeCrop = CROPS[activeCropId];

    if (currentTool === 'plow') {
        if (cell.state === 'grass') {
            cell.state = 'plowed';
            spawnParticles(pos.x, pos.y, COLORS.soil, 5);
            audioManager.playSfx('sfx_plant');
            success = true;
        }
    } else if (currentTool === 'seed') {
        if (cell.state === 'plowed') {
            if (money >= activeCrop.cost) {
                money -= activeCrop.cost;
                updateMoney();
                cell.state = 'seeded';
                cell.cropType = activeCropId;
                cell.timer = 0;
                cell.watered = false;
                spawnParticles(pos.x, pos.y, activeCrop.color, 5);
                audioManager.playSfx('sfx_plant');
                if (activeCrop.cost > 0) addFloatingText(pos.x, pos.y - 40, `-$${activeCrop.cost}`);
                success = true;
            } else {
                audioManager.playSfx('sfx_error', 120);
                showGif('fail');
                addFloatingText(pos.x, pos.y - 40, "Need Budget!");
            }
        }
    } else if (currentTool === 'water') {
        if ((cell.state === 'seeded' || cell.state === 'ripe') && !cell.watered) {
            cell.watered = true;
            spawnParticles(pos.x, pos.y, COLORS.water, 8);
            audioManager.playSfx('sfx_water');
            success = true;
        }
    } else if (currentTool === 'harvest') {
        if (cell.state === 'ripe') {
            const crop = CROPS[cell.cropType];
            cell.state = 'plowed';
            cell.watered = false;
            cell.timer = 0;

            money += crop.sellPrice;
            updateMoney();

            spawnParticles(pos.x, pos.y, crop.color, 12);
            spawnParticles(pos.x, pos.y, '#ffcc00', 5);
            addFloatingText(pos.x, pos.y - 50, `+$${crop.sellPrice}`);
            audioManager.playSfx('sfx_harvest');
            showGif('harvest');
            success = true;
        }
    }

    if (!success && currentTool !== 'seed') {
        audioManager.playSfx('sfx_error', 160);
        showGif('fail');
    }

    if (success) cell.heightOffset = 5;
}

// UI Logic
function updateMoney() {
    scoreEl.textContent = money;
    updateShopUI();
}

window.selectTool = (tool) => {
    currentTool = tool;
    audioManager.playSfx('sfx_ui', 80);
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.id === `tool-${tool}`) btn.classList.add('active');
    });
};

window.toggleShop = () => {
    const modal = document.getElementById('shop-modal');
    const opening = modal.classList.contains('hidden');
    modal.classList.toggle('hidden');
    audioManager.playSfx(opening ? 'sfx_ui' : 'sfx_error', 120);
    if (!modal.classList.contains('hidden')) updateShopUI();
};

function updateShopUI() {
    const gridEl = document.getElementById('shop-grid');
    gridEl.innerHTML = '';

    Object.values(CROPS).forEach(crop => {
        const isUnlocked = unlockedCrops.includes(crop.id);
        const isAffordable = money >= crop.unlockPrice;
        const isActive = activeCropId === crop.id;

        const card = document.createElement('div');
        card.className = `shop-card glass ${isActive ? 'active' : ''}`;

        let actionHtml = '';
        if (isUnlocked) {
            actionHtml = isActive
                ? `<span class="shop-pill active">ACTIVE</span>`
                : `<button onclick="selectCrop('${crop.id}')" class="shop-action equip">EQUIP</button>`;
        } else if (isAffordable) {
            actionHtml = `<button onclick="unlockCrop('${crop.id}')" class="shop-action buy">BUY $${crop.unlockPrice}</button>`;
        } else {
            actionHtml = `<span class="shop-pill locked">NEED $${crop.unlockPrice}</span>`;
        }

        card.innerHTML = `
            <div style="display:flex; align-items:center; gap:0.7rem; min-width:0;">
                <div class="crop-badge">${crop.icon}</div>
                <div style="min-width:0;">
                    <div class="shop-copy-title">${crop.name}</div>
                    <div class="shop-copy-meta">Gift: $${crop.sellPrice} · Plant: $${crop.cost}</div>
                </div>
            </div>
            <div>${actionHtml}</div>
        `;
        gridEl.appendChild(card);
    });
}

window.unlockCrop = (id) => {
    const crop = CROPS[id];
    if (money >= crop.unlockPrice) {
        money -= crop.unlockPrice;
        unlockedCrops.push(id);
        audioManager.playSfx('sfx_harvest');
        showGif('harvest');
        selectCrop(id);
        updateMoney();
    }
};

window.selectCrop = (id) => {
    activeCropId = id;
    const crop = CROPS[id];
    document.getElementById('active-seed-icon').textContent = crop.icon;
    const badge = document.getElementById('seed-cost-badge');
    badge.textContent = crop.cost === 0 ? 'Free' : `$${crop.cost}`;
    badge.style.background = crop.cost === 0 ? 'var(--mint-deep)' : 'var(--berry)';

    selectTool('seed');
    updateShopUI();
};

// Juice
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y + TILE_SIZE / 2, z: 10,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            vz: Math.random() * 3 + 2,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 2,
            shape: Math.random() > 0.68 ? 'heart' : (Math.random() > 0.46 ? 'spark' : 'confetti')
        });
    }
}

function addFloatingText(x, y, text) {
    floatingTexts.push({ x, y, text, life: 1.5 });
}

document.addEventListener('DOMContentLoaded', init);
</script>
