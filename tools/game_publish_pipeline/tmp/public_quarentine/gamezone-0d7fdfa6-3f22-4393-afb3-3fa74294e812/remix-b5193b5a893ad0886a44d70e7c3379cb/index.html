<body>

<div id="game-container">

<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_click" data-editable="audio" data-label="Queue Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_blocked" data-editable="audio" data-label="Blocked Action SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>
<audio id="sfx_install" data-editable="audio" data-label="Install Success SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_win" data-editable="audio" data-label="Queue Complete SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>

<script>
const configData = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(configData).map(([k, v]) => [k, v.value]));

let state = {
    gameState: 'PLAYING',
    installedCount: 0,
    apps: [],
    storage: 0,
    initialized: false
};

const APP_NAMES = ["Chatly", "PhotoX", "RunTrack", "ZenMind", "Foodie", "Cloudy", "Musicly", "GameHub", "PaySwift", "MapGo", "SafeKey", "Notes+"];
const APP_COLORS = ["#FF5E5E", "#5E7BFF", "#5EFF8B", "#FFD15E", "#FF5EF4", "#5EFFF4", "#A25EFF", "#FFA25E", "#5E7BFF", "#8BFF5E", "#FF5E5E", "#5EFFF4"];
const APP_EMOJIS = ["💬", "📸", "🏃", "🧘", "🍔", "☁️", "🎵", "🎮", "💳", "🗺️", "🔐", "📝"];

const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const sfxBuffers = {};
const sfxCooldowns = new Map();
let isAudioUnlocked = false;
let hasWinStateTriggered = false;
let feedbackTimer = null;

async function initAudio() {
    if (!audioCtx) return;
    const sfxElements = document.querySelectorAll('audio[id^="sfx_"]');
    for (const el of sfxElements) {
        try {
            el.load();
        } catch (e) {
            console.warn("Audio element preload failed");
        }
    }
}

function playSfx(id, options = {}) {
    const { cooldown = 0, volume = 0.16 } = options;
    const now = performance.now();
    const lastPlayed = sfxCooldowns.get(id) || 0;
    if (cooldown && now - lastPlayed < cooldown) return;
    sfxCooldowns.set(id, now);

    const el = document.getElementById(id);
    if (el) {
        try {
            el.pause();
            el.currentTime = 0;
            el.volume = Math.max(0, Math.min(1, volume));
            const playPromise = el.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
            return;
        } catch (e) {
            console.warn("Audio element playback failed");
        }
    }

    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const toneMap = {
        sfx_click: 820,
        sfx_blocked: 260,
        sfx_install: 620,
        sfx_win: 980
    };
    osc.frequency.setValueAtTime(toneMap[id] || 420, audioCtx.currentTime);
    gain.gain.setValueAtTime(Math.min(volume, 0.12), audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.14);
}

function syncBgmVolume() {
    const bgm = document.getElementById('bgm_main');
    if (bgm) bgm.volume = state.gameState === 'GAMEOVER' ? 0.18 : 0.2;
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    isAudioUnlocked = true;
    const bgm = document.getElementById('bgm_main');
    if (bgm && bgm.paused) {
        syncBgmVolume();
        bgm.play().catch(() => {});
    }
}

function showReaction(id, duration = 1200) {
    const el = document.getElementById(id);
    if (!el) return;
    if (feedbackTimer) clearTimeout(feedbackTimer);
    el.classList.add('is-visible');
    feedbackTimer = setTimeout(() => {
        el.classList.remove('is-visible');
    }, duration);
}

function updateHudCopy(allInstalled) {
    const hudSubtitle = document.getElementById('hud-subtitle');
    const hudLoad = document.getElementById('hud-load');
    hudLoad.textContent = `${Math.floor(state.storage)}%`;
    hudSubtitle.textContent = allInstalled
        ? 'Launch corridor stabilized. All apps are ready.'
        : state.installedCount > 0
            ? 'Install drones are filling the neon queue.'
            : 'Charging launch pads for every tapped app.';
}

function setState(next) {
    state.gameState = next;
    document.getElementById('game-over-screen').classList.toggle('hidden', next !== 'GAMEOVER');
    syncBgmVolume();
}

function createApps() {
    const grid = document.getElementById('app-grid');
    grid.innerHTML = '';
    state.apps = [];

    for (let i = 0; i < window.gameConfig.appCount; i++) {
        const app = {
            id: i,
            name: APP_NAMES[i % APP_NAMES.length],
            color: APP_COLORS[i % APP_COLORS.length],
            emoji: APP_EMOJIS[i % APP_EMOJIS.length],
            progress: 0,
            status: 'IDLE',
            el: null
        };

        const card = document.createElement('div');
        card.className = 'app-card flex flex-col items-center space-y-2';
        card.innerHTML = `
            <div class="icon-shell" style="background: linear-gradient(155deg, ${app.color}, ${shadeColor(app.color, -28)});">
                <span class="app-glyph" aria-hidden="true">${app.emoji}</span>
            </div>
            <div class="text-center app-meta">
                <div class="text-[11px] font-bold text-gray-800 truncate w-20">${app.name}</div>
                <button class="mt-1 px-3 py-1 bg-gray-200 rounded-full text-[10px] font-black uppercase tracking-tighter btn-install">Queue</button>
                <div class="mt-2 progress-bar w-16 hidden"><div class="progress-fill"></div></div>
            </div>
        `;

        card.querySelector('.btn-install').onclick = (e) => startDownload(i, e.target);
        app.el = card;
        state.apps.push(app);
        grid.appendChild(card);
    }
}

function shadeColor(color, percent) {
    const num = parseInt(color.slice(1), 16);
    const amt = Math.round(2.55 * percent);
    const r = Math.min(255, Math.max(0, (num >> 16) + amt));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
    return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
}

function startDownload(index, btn) {
    unlockAudio();
    const app = state.apps[index];
    if (app.status !== 'IDLE') {
        playSfx('sfx_blocked', { cooldown: 160, volume: 0.11 });
        return;
    }

    playSfx('sfx_click', { cooldown: 80, volume: 0.12 });
    app.status = 'DOWNLOADING';
    app.el.classList.add('downloading');
    btn.classList.add('hidden');
    app.el.querySelector('.progress-bar').classList.remove('hidden');
}

function update(dt) {
    if (state.gameState !== 'PLAYING') return;

    let allInstalled = true;
    state.apps.forEach(app => {
        if (app.status === 'DOWNLOADING') {
            app.progress += window.gameConfig.installSpeed * dt * 20;
            const fill = app.el.querySelector('.progress-fill');
            fill.style.width = `${app.progress}%`;

            if (app.progress >= 100) {
                app.status = 'INSTALLED';
                app.progress = 100;
                state.installedCount++;
                state.storage = Math.min(100, (state.installedCount / state.apps.length) * 100);

                const btn = app.el.querySelector('.btn-install');
                btn.innerText = 'Ready';
                btn.classList.remove('hidden');
                btn.classList.replace('bg-gray-200', 'bg-blue-100');
                btn.classList.add('ready');
                app.el.classList.remove('downloading');
                app.el.classList.add('installed');
                app.el.querySelector('.progress-bar').classList.add('hidden');

                playSfx('sfx_install', { cooldown: 100, volume: 0.16 });
                showReaction('install-reaction', 1100);
                if (window.webkit?.messageHandlers?.gamezoneBridge) {
                    window.webkit.messageHandlers.gamezoneBridge.postMessage({action: 'vibrate', params: {style: 'light'}});
                }
            }
        }
        if (app.status !== 'INSTALLED') allInstalled = false;
    });

    document.getElementById('score-display').innerText = `Installs: ${state.installedCount}`;
    document.getElementById('storage-val').innerText = Math.floor(state.storage);
    document.getElementById('status-text').innerText = allInstalled ? "Arcade queue complete" : "Installing the current queue...";
    updateHudCopy(allInstalled);

    if (allInstalled && state.gameState === 'PLAYING' && !hasWinStateTriggered) {
        hasWinStateTriggered = true;
        playSfx('sfx_win', { volume: 0.22 });
        showReaction('win-reaction', 1800);
        setTimeout(() => setState('GAMEOVER'), 1000);
    }
}

const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let cw, ch, dpr;

function resize() {
    dpr = window.devicePixelRatio || 1;
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw() {
    ctx.clearRect(0, 0, cw, ch);
    const time = Date.now() * 0.001;

    const gradient = ctx.createLinearGradient(0, 0, 0, ch);
    gradient.addColorStop(0, 'rgba(45, 108, 255, 0.14)');
    gradient.addColorStop(1, 'rgba(168, 92, 255, 0.05)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = 'rgba(105, 230, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
        const y = (i + 1) * (ch / 7);
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(time + i) * 8);
        ctx.quadraticCurveTo(cw * 0.5, y - 14 + Math.cos(time + i * 0.7) * 10, cw, y + Math.sin(time * 0.7 + i) * 8);
        ctx.stroke();
    }

    for (let i = 0; i < 5; i++) {
        const x = (Math.sin(time * 0.5 + i * 1.7) * 0.5 + 0.5) * cw;
        const y = (Math.cos(time * 0.35 + i) * 0.5 + 0.5) * ch;
        const radius = 34 + i * 12;

        const orb = ctx.createRadialGradient(x, y, 0, x, y, radius);
        orb.addColorStop(0, 'rgba(105, 230, 255, 0.16)');
        orb.addColorStop(1, 'rgba(105, 230, 255, 0)');
        ctx.fillStyle = orb;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let i = 0; i < 12; i++) {
        const x = ((i * 97) % (cw + 80)) - 40;
        const drift = (time * 18 + i * 24) % (ch + 80);
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.13)' : 'rgba(168,140,255,0.14)';
        ctx.fillRect(x, drift - 40, 2, 2);
    }
}

let lastTime = 0;
function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Loop error", e);
    }
    requestAnimationFrame(loop);
}

function initGame() {
    createApps();
    state.installedCount = 0;
    state.storage = 0;
    state.initialized = true;
    hasWinStateTriggered = false;
    document.getElementById('install-reaction')?.classList.remove('is-visible');
    document.getElementById('win-reaction')?.classList.remove('is-visible');
    updateHudCopy(false);
    const bgm = document.getElementById('bgm_main');
    if (bgm && isAudioUnlocked) {
        syncBgmVolume();
        bgm.play().catch(() => {});
    }
}

function restartGame() {
    setState('PLAYING');
    initGame();
}

const ro = new ResizeObserver(entries => {
    for (let entry of entries) {
        const { width } = entry.contentRect;
        resize();
        if (!state.initialized && width > 0) {
            initAudio().then(() => {
                initGame();
                requestAnimationFrame(loop);
            });
        }
    }
});

ro.observe(canvas);

window.addEventListener('pointerdown', (e) => {
    unlockAudio();
    if (state.gameState === 'GAMEOVER' && e.target.id === 'restart-btn') {
        playSfx('sfx_click', { cooldown: 80, volume: 0.12 });
        restartGame();
    }
}, { passive: false });

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('status-text').style.color = getComputedStyle(document.documentElement).getPropertyValue('--accent');
});
</script>
