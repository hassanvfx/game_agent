<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Courier: Drone Gauntlet</title>
    <!-- [agent-note][stage3] resolved-font: display=Audiowide | ui=Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: linear-gradient(180deg, rgba(8, 18, 54, 0.92), rgba(11, 11, 30, 0.88));
            --panel-border: rgba(136, 228, 255, 0.5);
            --panel-shadow: rgba(34, 211, 238, 0.3);
            --text-light: #f8fbff;
            --text-muted: #bfd3f7;
            --text-accent: #ffe066;
            --text-danger: #ff5b7f;
            --button-primary: linear-gradient(180deg, #ff6a4d, #ff3b5c);
            --button-primary-hover: linear-gradient(180deg, #ff8867, #ff5773);
            --button-secondary: linear-gradient(180deg, #27c2ff, #2364ff);
            --button-secondary-hover: linear-gradient(180deg, #56d6ff, #4d82ff);
            --hud-shadow: 0 2px 0 rgba(0, 0, 0, 0.75);
            --sky-top: #09183f;
            --sky-mid: #2447a8;
            --sky-bottom: #7dd9ff;
            --ground-a: #18b57f;
            --ground-b: #0b855f;
            --ground-glow: #8fffd0;
            --hero-core: #7be8ff;
            --hero-trail: #00d9ff;
            --hero-shadow: rgba(0, 196, 255, 0.45);
            --boss-glow: rgba(255, 90, 125, 0.38);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body { color: var(--text-light); }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow: 0 0 20px var(--panel-shadow), inset 0 0 18px rgba(125, 217, 255, 0.08);
        }

        .text-shadow { text-shadow: var(--hud-shadow); }
        .pulse { animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .screen-panel {
            width: min(92vw, 520px);
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .screen-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(123, 232, 255, 0.22), transparent 34%),
                radial-gradient(circle at 80% 0%, rgba(255, 224, 102, 0.2), transparent 28%);
            pointer-events: none;
        }

        .screen-panel h1,
        .screen-panel h2,
        .screen-panel button,
        .hud-label,
        #boss-name {
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        #start-screen {
            transform: scale(1);
            transition: transform 0.2s ease;
        }

        #start-screen:hover { transform: scale(1.05); }

        .title-main {
            margin: 0 0 0.35rem;
            font-size: clamp(2.5rem, 8vw, 4.4rem);
            line-height: 0.95;
            color: var(--text-accent);
            text-shadow: 0 0 20px rgba(255, 224, 102, 0.35), var(--hud-shadow);
        }

        .title-sub {
            margin: 0 0 1rem;
            font-size: clamp(1.35rem, 5vw, 2.2rem);
            color: #8fe8ff;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin: 0 0 1rem;
            padding: 0.5rem 0.85rem;
            border-radius: 999px;
            border: 1px solid rgba(143, 232, 255, 0.45);
            background: rgba(8, 17, 44, 0.65);
            color: #e9fbff;
            font-size: clamp(0.8rem, 2.8vw, 0.98rem);
            box-shadow: inset 0 0 12px rgba(123, 232, 255, 0.1);
        }

        .hero-emoji {
            display: inline-grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #dffcff, #58d9ff 55%, #0d74be 100%);
            box-shadow: 0 0 16px rgba(91, 226, 255, 0.5);
            font-size: 1.15rem;
        }

        .intro-copy {
            margin: 0 0 1.4rem;
            font-size: clamp(0.95rem, 3.2vw, 1.1rem);
            color: var(--text-muted);
        }

        .flavor-copy {
            margin: 0 0 1.8rem;
            font-size: clamp(0.8rem, 2.8vw, 0.95rem);
            color: #dff7ff;
            opacity: 0.85;
        }

        .action-button {
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            padding: 0.85rem 2.2rem;
            color: #fff;
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: 700;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3), inset 0 0 14px rgba(255,255,255,0.12);
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.2s ease, background 0.2s ease;
        }

        .action-button:active { transform: scale(0.95); }

        #start-btn { background: var(--button-primary); }
        #start-btn:hover { background: var(--button-primary-hover); filter: brightness(1.06); }

        #restart-btn { background: var(--button-secondary); }
        #restart-btn:hover { background: var(--button-secondary-hover); filter: brightness(1.06); }

        #game-over-screen.hidden,
        #start-screen.hidden,
        #hud.hidden {
            display: none !important;
        }

        .game-over-title {
            margin: 0 0 1rem;
            font-size: clamp(2.4rem, 8vw, 3.8rem);
            color: var(--text-danger);
        }

        .game-over-copy {
            margin: 0 0 1.5rem;
            font-size: clamp(1.2rem, 4.2vw, 2rem);
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-chip,
        .boss-panel {
            background: linear-gradient(180deg, rgba(4, 16, 44, 0.86), rgba(9, 22, 52, 0.7));
            border: 1px solid rgba(143, 232, 255, 0.35);
            border-radius: 1rem;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22), inset 0 0 12px rgba(143, 232, 255, 0.08);
        }

        .hud-stack {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .hud-chip {
            padding: 0.55rem 0.8rem;
        }

        .hud-primary {
            color: var(--text-accent);
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            text-shadow: var(--hud-shadow);
        }

        .hud-secondary {
            color: #fff;
            font-size: clamp(1rem, 3vw, 1.25rem);
            font-weight: 700;
            text-shadow: var(--hud-shadow);
        }

        .boss-panel {
            width: min(34vw, 320px);
            min-width: 180px;
            padding: 0.55rem 0.7rem 0.7rem;
        }

        #boss-name {
            margin-bottom: 0.35rem;
            color: #ef4444;
            text-align: right;
            font-size: clamp(1rem, 3vw, 1.2rem);
            text-shadow: var(--hud-shadow);
        }

        .boss-bar-shell {
            width: 100%;
            height: 1rem;
            background: #1f2937;
            border: 2px solid rgba(255,255,255,0.85);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.35);
        }

        #boss-hp-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff6a4d, #ff3b5c);
            transition: width 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 91, 127, 0.45);
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: min(28vw, 144px);
            border-radius: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28), 0 0 18px rgba(143, 232, 255, 0.2);
            background: rgba(4, 13, 33, 0.72);
            object-fit: cover;
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1);
        }

        #impact-gif {
            top: 6.2rem;
        }

        #danger-gif {
            bottom: 1rem;
            width: min(24vw, 120px);
        }

        @media (max-width: 640px) {
            .screen-panel {
                width: min(94vw, 420px);
                padding: 1.5rem 1.25rem;
            }

            #hud {
                padding: 0.85rem;
                gap: 0.75rem;
            }

            .hud-chip {
                padding: 0.45rem 0.65rem;
            }

            .boss-panel {
                width: 42vw;
                min-width: 140px;
                padding: 0.45rem 0.55rem 0.55rem;
            }

            .feedback-gif {
                right: 0.6rem;
                width: min(30vw, 110px);
            }

            #impact-gif {
                top: 5.6rem;
            }

            #danger-gif {
                bottom: 0.8rem;
                width: min(28vw, 92px);
            }
        }
    </style>
</head>

<script>
/**
 * §4 Iron Laws & Core Logic
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    window.gameConfig = {
        heroColor: "#0055FF",
        bossHp: 5,
        gravity: 0.6,
        gameSpeed: 1.0
    };

    // Parse Config
    try {
        const configElement = document.getElementById('game-config');
        if (configElement) {
            const parsed = JSON.parse(configElement.textContent);
            for (const key in parsed) {
                window.gameConfig[key] = parsed[key].value;
            }
            window.gameConfigDefs = parsed;
        }
    } catch (e) { console.error("Config parse error", e); }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'heroColor') {
                // Force redraw if needed
            }
        }
    };

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const feedbackEls = {
        impact: document.getElementById('impact-gif'),
        danger: document.getElementById('danger-gif')
    };
    const sounds = {
        bgm: document.getElementById('bgm_battle'),
        jump: document.getElementById('sfx_jump'),
        hit: document.getElementById('sfx_hit'),
        die: document.getElementById('sfx_die'),
        land: document.getElementById('sfx_land'),
        damage: document.getElementById('sfx_damage'),
        round: document.getElementById('sfx_round'),
        start: document.getElementById('sfx_start'),
        button: document.getElementById('sfx_button')
    };

    Object.entries(sounds).forEach(([name, el]) => {
        if (!el) return;
        el.volume = name === 'bgm' ? 0.2 : name === 'button' ? 0.42 : 0.5;
    });

    let audioReady = false;
    let lastSfxTimes = {};
    let feedbackTimers = {};

    const showFeedback = (name, duration = 650) => {
        const el = feedbackEls[name];
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(feedbackTimers[name]);
        feedbackTimers[name] = setTimeout(() => el.classList.remove('visible'), duration);
    };

    const safePlayMedia = (el, restart = true) => {
        if (!el) return Promise.resolve();
        if (restart) el.currentTime = 0;
        return el.play().catch(() => {});
    };

    const startBgm = () => {
        safePlayMedia(sounds.bgm, false);
    };

    const stopBgm = () => {
        if (sounds.bgm) sounds.bgm.pause();
    };

    // Unlock Audio
    const unlockAudio = () => {
        audioReady = true;
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        if (gameState === 'PLAYING') startBgm();
        document.removeEventListener('pointerdown', unlockAudio);
        document.removeEventListener('keydown', unlockAudio);
    };
    document.addEventListener('pointerdown', unlockAudio);
    document.addEventListener('keydown', unlockAudio);

    const playSfx = (name, cooldown = 80) => {
        const now = performance.now();
        if ((lastSfxTimes[name] || 0) + cooldown > now) return;
        lastSfxTimes[name] = now;

        if (sounds[name]) {
            safePlayMedia(sounds[name]).catch(() => playSynth(name));
        } else {
            playSynth(name);
        }
    };

    const playSynth = (type) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'jump') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'hit' || type === 'damage') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(type === 'hit' ? 150 : 110, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
            osc.start(); osc.stop(audioCtx.currentTime + 0.22);
        } else if (type === 'land' || type === 'button' || type === 'start' || type === 'round' || type === 'die') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(type === 'die' ? 220 : 520, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'die' ? 90 : 260, audioCtx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.start(); osc.stop(audioCtx.currentTime + 0.18);
        }
    };

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let width, height;
    const resize = () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let frames = 0;
    let score = 0; // Data packets
    let round = 1;
    let shake = 0;
    let flash = 0;
    let bossDefeatPending = false;

    // Entities
    let hero = { x: 100, y: 0, vy: 0, r: 20, grounded: false, state: 'RUN', spin: 0 };
    let boss = { x: 0, y: 0, vy: 0, r: 40, hp: 5, maxHp: 5, phase: 'HOVER', timer: 0, name: 'BLOCKER-01', color: '#E60012' };
    let projectiles = [];
    let particles = [];
    let floorY = 0;

    // Boss Data
    const BOSS_TYPES = [
        { name: 'BLOCKER-01', color: '#E60012', attack: 'BOMB' },
        { name: 'JAMMER-FOX', color: '#FFA500', attack: 'MISSILE' },
        { name: 'BREACH-KNUX', color: '#FF0000', attack: 'PUNCH' },
        { name: 'MIRROR-SONIC', color: '#0033CC', attack: 'LASER' },
        { name: 'NULL-SHADOW', color: '#333333', attack: 'CHAOS' }
    ];

    const resetGame = () => {
        score = 0; // Start with 0 data
        round = 1;
        bossDefeatPending = false;
        initRound();
        gameState = 'PLAYING';

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('score-display').innerText = score;

        playSfx('start', 10);
        if (sounds.bgm) sounds.bgm.currentTime = 0;
        if (audioReady) startBgm();
    };

    const initRound = () => {
        floorY = height * 0.75;
        hero.y = floorY - hero.r;
        hero.vy = 0;
        hero.x = width * 0.2;
        hero.state = 'RUN';

        const bossData = BOSS_TYPES[(round - 1) % BOSS_TYPES.length];
        boss.name = bossData.name;
        boss.color = bossData.color;
        boss.x = width * 0.8;
        boss.y = height * 0.4;
        boss.vy = 0;
        boss.maxHp = window.gameConfig.bossHp + Math.floor((round-1)*2);
        boss.hp = boss.maxHp;
        boss.phase = 'HOVER';
        boss.timer = 0;

        projectiles = [];
        particles = [];
        bossDefeatPending = false;

        document.getElementById('boss-name').innerText = boss.name;
        document.getElementById('round-display').innerText = round;
        updateBossBar();
    };

    const updateBossBar = () => {
        const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
        document.getElementById('boss-hp-bar').style.width = `${pct}%`;
    };

    const spawnParticle = (x, y, color, count = 5, speed = 5) => {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const v = Math.random() * speed;
            particles.push({
                x, y,
                vx: Math.cos(angle) * v,
                vy: Math.sin(angle) * v,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    };

    // Input Handling
    let pointerDown = false;
    const handleInput = (e) => {
        if (gameState !== 'PLAYING') return;

        // Jump Logic
        if (hero.grounded) {
            hero.vy = -12 - (window.gameConfig.gameSpeed * 2);
            hero.grounded = false;
            hero.state = 'JUMP';
            playSfx('jump');
            spawnParticle(hero.x, hero.y + hero.r, '#FFF', 5);
        } else if (hero.state === 'JUMP') {
            // Homing Attack
            const dx = boss.x - hero.x;
            const dy = boss.y - hero.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            // If boss is on screen and alive
            if (dist < width * 0.8 && boss.hp > 0) {
                hero.state = 'HOMING';
                hero.vx = dx * 0.15; // Dash speed
                hero.vy = dy * 0.15;
                playSfx('jump'); // Dash sound

                // Trail effect
                spawnParticle(hero.x, hero.y, window.gameConfig.heroColor, 8);
            }
        }
    };

    const canvasEl = document.getElementById('gameCanvas');
    // [agent-note][stage4] repaired: mobile-action-path | element: #start-btn/#restart-btn | action: keep gesture suppression scoped to canvas so menu taps still produce native activation
    canvasEl.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        pointerDown = true;
        handleInput(e);
    }, { passive: false });

    canvasEl.addEventListener('pointerup', (e) => {
        e.preventDefault();
        pointerDown = false;
    }, { passive: false });

    // UI Buttons
    document.getElementById('start-btn').addEventListener('click', () => {
        playSfx('button', 10);
        resetGame();
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
        playSfx('button', 10);
        resetGame();
    });

    // --- Update Loop ---
    const update = (dt) => {
        if (gameState !== 'PLAYING') return;

        floorY = height * 0.75;
        const g = window.gameConfig.gravity;
        const speedMult = window.gameConfig.gameSpeed;

        // Hero Physics
        if (hero.state !== 'HOMING') {
            hero.vy += g;
            hero.y += hero.vy;

            // Floor collision
            if (hero.y + hero.r >= floorY) {
                const landedFromAir = !hero.grounded;
                hero.y = floorY - hero.r;
                hero.vy = 0;
                hero.grounded = true;
                hero.state = 'RUN';
                hero.vx = 0;
                if (landedFromAir) playSfx('land', 100);
                // Return to X position
                hero.x += (width * 0.2 - hero.x) * 0.1;
            } else {
                hero.grounded = false;
                hero.spin += 0.5; // Spin animation
            }
        } else {
            // Homing Logic
            hero.x += hero.vx * speedMult;
            hero.y += hero.vy * speedMult;
            hero.spin += 1.0;

            // Homing Collision
            const dx = hero.x - boss.x;
            const dy = hero.y - boss.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < hero.r + boss.r + 10) {
                // HIT BOSS
                boss.hp--;
                updateBossBar();
                playSfx('hit', 70);
                showFeedback('impact', 520);
                shake = 10;
                flash = 5;
                spawnParticle(boss.x, boss.y, '#FFF', 20, 10);

                // Bounce back
                hero.state = 'JUMP';
                hero.vx = 0;
                hero.vy = -10;
                hero.x = boss.x - 50; // Push back slightly

                if (boss.hp <= 0 && !bossDefeatPending) {
                    // Boss Defeated
                    bossDefeatPending = true;
                    spawnParticle(boss.x, boss.y, boss.color, 50, 15);
                    score += 100; // Bonus data
                    playSfx('round', 10);
                    showFeedback('impact', 1200);
                    round++;
                    setTimeout(initRound, 2000); // Next round delay
                }
            }

            // Missed / Hit floor
            if (hero.y > floorY) {
                hero.state = 'JUMP';
                hero.grounded = false;
            }
        }

        // Boss Logic
        if (boss.hp > 0) {
            boss.timer += dt;
            // Hover movement
            boss.y = (height * 0.4) + Math.sin(frames * 0.05) * 50;

            // Attack Logic
            if (boss.timer > 2000 / speedMult) {
                boss.timer = 0;
                // Shoot projectile
                projectiles.push({
                    x: boss.x - 40,
                    y: boss.y,
                    vx: -8 * speedMult - (Math.random() * 4),
                    vy: (hero.y - boss.y) * 0.02, // Aim slightly
                    r: 10,
                    type: (round % 2 === 0) ? 'LASER' : 'BOMB'
                });
                playSfx('button', 140);
            }
        } else {
            // Boss falling/exploding
            boss.y += 5;
            spawnParticle(boss.x, boss.y, '#555', 2);
        }

        // Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.r += 0.1; // Grow slightly

            // Collision with Hero
            const dx = hero.x - p.x;
            const dy = hero.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < hero.r + p.r && hero.state !== 'HOMING') {
                // DAMAGE
                    if (score > 0) {
                        // Drop data
                        playSfx('damage', 120);
                        showFeedback('danger', 820);
                        spawnParticle(hero.x, hero.y, '#FFD700', Math.min(score, 10), 8);
                        score = 0;
                        shake = 20;
                        projectiles.splice(i, 1);
                        // Knockback
                        hero.vy = -10;
                        hero.grounded = false;
                    } else {
                        // DIE
                        gameState = 'GAMEOVER';
                        playSfx('die', 10);
                        showFeedback('danger', 1500);
                        document.getElementById('final-score').innerText = round - 1;
                        document.getElementById('game-over-screen').classList.remove('hidden');
                        document.getElementById('hud').classList.add('hidden');
                        stopBgm();
                    }
            }

            if (p.x < -50) projectiles.splice(i, 1);
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            p.vy += 0.2; // Gravity
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Score display update
        document.getElementById('score-display').innerText = score;
    };

    // --- Render Loop ---
    const draw = () => {
        // Clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, getComputedStyle(document.documentElement).getPropertyValue('--sky-top').trim());
        grad.addColorStop(0.55, getComputedStyle(document.documentElement).getPropertyValue('--sky-mid').trim());
        grad.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--sky-bottom').trim());
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Glow horizon
        const horizonGlow = ctx.createRadialGradient(width * 0.52, height * 0.56, 10, width * 0.52, height * 0.56, width * 0.65);
        horizonGlow.addColorStop(0, 'rgba(144, 244, 255, 0.22)');
        horizonGlow.addColorStop(1, 'rgba(144, 244, 255, 0)');
        ctx.fillStyle = horizonGlow;
        ctx.fillRect(0, 0, width, height);

        // Parallax storm lanes / clouds
        for (let i = 0; i < 5; i++) {
            const cx = ((frames * (1 + i) * 0.5) % width);
            const cloudY = height * 0.2 + (i * 34);
            ctx.fillStyle = `rgba(232, 247, 255, ${0.09 + i * 0.04})`;
            ctx.beginPath();
            ctx.ellipse(width - cx, cloudY, 78 + i * 12, 22 + i * 4, -0.08, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(width - cx - 54, cloudY + 12, 52 + i * 8, 18 + i * 3, 0.12, 0, Math.PI * 2);
            ctx.fill();
        }

        // Neon skyline silhouettes
        for (let i = 0; i < 7; i++) {
            const towerX = (i * width) / 6 - 30;
            const towerH = 90 + ((i * 37) % 110);
            ctx.fillStyle = i % 2 === 0 ? 'rgba(7, 23, 68, 0.72)' : 'rgba(18, 40, 92, 0.65)';
            ctx.fillRect(towerX, floorY - towerH - 55, 46 + (i % 3) * 18, towerH);
            ctx.fillStyle = 'rgba(143, 232, 255, 0.35)';
            ctx.fillRect(towerX + 8, floorY - towerH - 35, 6, 12);
            ctx.fillRect(towerX + 22, floorY - towerH - 62, 6, 18);
        }

        // Checkerboard Floor
        const tileSize = 40;
        const offset = (frames * 10 * window.gameConfig.gameSpeed) % (tileSize * 2);

        ctx.save();
        ctx.beginPath();
        // Perspective effect simplified
        ctx.rect(0, floorY, width, height - floorY);
        ctx.clip();

        for (let y = floorY; y < height; y += tileSize) {
            for (let x = -offset; x < width; x += tileSize) {
                const isDark = (Math.floor(x/tileSize) + Math.floor(y/tileSize)) % 2 === 0;
                ctx.fillStyle = isDark ? getComputedStyle(document.documentElement).getPropertyValue('--ground-a').trim() : getComputedStyle(document.documentElement).getPropertyValue('--ground-b').trim();
                ctx.fillRect(x, y, tileSize+1, tileSize+1);
            }
        }
        // Neon lane top
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ground-glow').trim();
        ctx.fillRect(0, floorY, width, 10);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(0, floorY + 10, width, 2);
        ctx.restore();

        // Shake effect
        ctx.save();
        if (shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            shake *= 0.9;
            if(shake < 0.5) shake = 0;
        }

        // Draw Hero
        ctx.save();
        ctx.translate(hero.x, hero.y);
        if (hero.state !== 'RUN') ctx.rotate(hero.spin);

        const heroBase = window.gameConfig.heroColor;
        const heroGlow = getComputedStyle(document.documentElement).getPropertyValue('--hero-shadow').trim();
        ctx.shadowBlur = 18;
        ctx.shadowColor = heroGlow;

        // Drone body
        const heroGrad = ctx.createRadialGradient(-5, -8, 5, 0, 0, hero.r + 8);
        heroGrad.addColorStop(0, '#ecfeff');
        heroGrad.addColorStop(0.35, getComputedStyle(document.documentElement).getPropertyValue('--hero-core').trim());
        heroGrad.addColorStop(1, heroBase);
        ctx.fillStyle = heroGrad;
        ctx.beginPath();
        ctx.arc(0, 0, hero.r, 0, Math.PI * 2);
        ctx.fill();

        // Booster fins
        ctx.shadowBlur = 0;
        ctx.fillStyle = heroBase;
        ctx.beginPath();
        ctx.moveTo(-12, -10); ctx.lineTo(-30, -4); ctx.lineTo(-16, 2);
        ctx.moveTo(-10, 6); ctx.lineTo(-28, 12); ctx.lineTo(-10, 16);
        ctx.fill();

        // Cockpit / face
        if (hero.state === 'RUN') {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(7, -4, 9, 11, 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#082033';
            ctx.beginPath();
            ctx.arc(10, -4, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-3, 15);
            ctx.lineTo(15, 15);
            ctx.stroke();
        } else {
            ctx.strokeStyle = 'rgba(123, 232, 255, 0.75)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, hero.r - 1, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.beginPath();
            ctx.arc(0, 0, hero.r + 8, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Thruster flame
        ctx.fillStyle = hero.state === 'RUN' ? '#ffe066' : getComputedStyle(document.documentElement).getPropertyValue('--hero-trail').trim();
        ctx.beginPath();
        ctx.moveTo(-18, 4);
        ctx.lineTo(-34 - Math.random() * 5, 10);
        ctx.lineTo(-18, 14);
        ctx.fill();
        ctx.restore();

        // Draw Boss
        if (boss.hp > 0 || particles.length > 0) {
            ctx.save();
            ctx.translate(boss.x, boss.y);

            ctx.shadowBlur = 22;
            ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--boss-glow').trim();

            const bossGrad = ctx.createRadialGradient(-8, -10, 10, 0, 0, boss.r + 10);
            bossGrad.addColorStop(0, '#ffe7ee');
            bossGrad.addColorStop(0.4, boss.color);
            bossGrad.addColorStop(1, '#5b1027');
            ctx.fillStyle = bossGrad;
            ctx.beginPath();
            ctx.arc(0, 0, boss.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#9be2ff';
            ctx.beginPath();
            ctx.ellipse(0, -10, boss.r * 0.58, boss.r * 0.38, 0, Math.PI, 0);
            ctx.fill();

            ctx.fillStyle = '#1b2438';
            ctx.fillRect(-boss.r, 2, boss.r * 2, 6);
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.fillRect(-boss.r + 8, 10, boss.r * 2 - 16, 3);

            // Attack appendages for silhouette contrast
            ctx.fillStyle = '#551122';
            ctx.beginPath();
            ctx.moveTo(-22, 16); ctx.lineTo(-42, 28); ctx.lineTo(-18, 24);
            ctx.moveTo(22, 16); ctx.lineTo(42, 28); ctx.lineTo(18, 24);
            ctx.fill();

            if (boss.name === 'BLOCKER-01') {
                ctx.fillStyle = '#7a3a28';
                ctx.beginPath();
                ctx.moveTo(0, 5); ctx.lineTo(30, 15); ctx.lineTo(10, 22);
                ctx.moveTo(0, 5); ctx.lineTo(-30, 15); ctx.lineTo(-10, 22);
                ctx.fill();
            }

            // Damage flash
            if (flash > 0) {
                ctx.globalCompositeOperation = 'source-atop';
                ctx.fillStyle = `rgba(255,255,255,${flash / 5})`;
                ctx.fillRect(-50, -50, 100, 100);
                ctx.globalCompositeOperation = 'source-over';
                flash--;
            }
            ctx.restore();
        }

        // Draw Projectiles
        projectiles.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = p.type === 'LASER' ? '#0FF' : '#F00';
            ctx.beginPath();
            if (p.type === 'LASER') {
                ctx.fillRect(-10, -2, 20, 4);
            } else {
                ctx.arc(0, 0, p.r, 0, Math.PI*2);
            }
            ctx.fill();
            // Glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.restore(); // Restore shake
    };

    // Main Loop
    let lastTime = 0;
    const loop = (timestamp) => {
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        frames++;
        update(dt);
        draw();

        requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
});
</script>
