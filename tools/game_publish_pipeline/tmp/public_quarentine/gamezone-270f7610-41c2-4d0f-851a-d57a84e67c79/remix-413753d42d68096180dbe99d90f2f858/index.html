<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal Closet: Multiverse Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
    <!-- [agent-note][stage4] resolved-font-remap: title/ui -> catalogs/fonts.json using Orbitron + Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050812;
            --bg-mid: #0d1830;
            --bg-soft: #102615;
            --panel: rgba(5, 17, 23, 0.88);
            --panel-strong: rgba(7, 27, 30, 0.95);
            --panel-glass: rgba(72, 255, 106, 0.10);
            --line: rgba(56, 245, 255, 0.32);
            --line-strong: rgba(72, 255, 106, 0.66);
            --text: #f2ffe9;
            --text-soft: rgba(242, 255, 233, 0.76);
            --accent: #48ff6a;
            --accent-2: #38f5ff;
            --accent-3: #ff4eb8;
            --accent-4: #ffe45c;
            --shadow: 0 20px 60px rgba(0, 5, 18, 0.52);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 12%, rgba(72, 255, 106, 0.18), transparent 20%),
                radial-gradient(circle at 85% 16%, rgba(255, 78, 184, 0.15), transparent 24%),
                radial-gradient(circle at 12% 32%, rgba(56, 245, 255, 0.12), transparent 26%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 68%, #06100b);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 18%, rgba(72,255,106,0.16), transparent 28%),
                linear-gradient(120deg, rgba(242,255,233,0.04), transparent 24%, transparent 76%, rgba(56,245,255,0.035)),
                repeating-linear-gradient(90deg, rgba(56,245,255,0.03) 0 1px, transparent 1px 44px),
                repeating-linear-gradient(0deg, rgba(72,255,106,0.022) 0 1px, transparent 1px 44px);
            opacity: 0.86;
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .hidden { display: none !important; }

        .app-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .topbar {
            height: 64px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(10px + var(--safe-top)) 14px 0;
            z-index: 20;
            pointer-events: auto;
            gap: 12px;
        }

        .brand-chip,
        .icon-button,
        .editor-panel,
        .item-btn,
        .tab-btn {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .brand-chip {
            position: relative;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background:
                radial-gradient(circle at 19% 50%, rgba(72,255,106,0.18), transparent 18px),
                linear-gradient(180deg, rgba(242,255,233,0.12), rgba(242,255,233,0.035)),
                linear-gradient(135deg, rgba(56,245,255,0.16), rgba(111,69,255,0.12), rgba(72,255,106,0.08));
            box-shadow: var(--shadow), inset 0 0 22px rgba(72,255,106,0.05);
        }

        .brand-chip::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(242,255,233,0.95) 0 17%, transparent 18%),
                conic-gradient(from 20deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent), var(--accent-2));
            color: #06100b;
            font-size: 17px;
            box-shadow: 0 0 20px rgba(72, 255, 106, 0.55), inset 0 0 0 2px rgba(5,8,18,0.35);
            animation: portalBadgeSpin 7s linear infinite;
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        @keyframes portalBadgeSpin {
            to { filter: hue-rotate(22deg); transform: rotate(1turn); }
        }

        .brand-title {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 15px;
            letter-spacing: 0.1em;
            color: var(--text);
            text-shadow: 0 2px 18px rgba(103, 216, 255, 0.25);
            white-space: nowrap;
        }

        .brand-subtitle {
            margin-top: 4px;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .icon-button {
            width: 48px;
            height: 48px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background:
                radial-gradient(circle at 50% 50%, rgba(72,255,106,0.14), transparent 40%),
                linear-gradient(180deg, rgba(242,255,233,0.14), rgba(242,255,233,0.04)),
                rgba(8, 22, 29, 0.82);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease, border-color 160ms ease;
        }

        .icon-button:active {
            transform: scale(0.94);
            filter: brightness(1.08);
        }

        .icon-button:hover {
            border-color: var(--line-strong);
        }

        .touch-zone {
            flex: 1;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: bottom editor panel already mobile-safe */
        .editor-panel {
            height: min(45%, 390px);
            width: 100%;
            background:
                radial-gradient(circle at 12% 0%, rgba(72,255,106,0.15), transparent 28%),
                radial-gradient(circle at 86% 14%, rgba(255,78,184,0.11), transparent 26%),
                repeating-linear-gradient(90deg, rgba(56,245,255,0.03) 0 1px, transparent 1px 36px),
                linear-gradient(180deg, rgba(7, 31, 35, 0.96), rgba(5, 9, 22, 0.98)),
                var(--panel);
            border-top: 1px solid rgba(72,255,106,0.28);
            box-shadow: 0 -18px 45px rgba(0,0,0,0.38), 0 -4px 22px rgba(72,255,106,0.08);
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            padding-bottom: var(--safe-bottom);
            transform: translateY(0);
            transition: transform 300ms ease;
            position: relative;
            overflow: hidden;
        }

        .editor-panel::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 80px;
            background:
                linear-gradient(180deg, rgba(72,255,106,0.12), transparent),
                repeating-linear-gradient(90deg, transparent 0 19px, rgba(56,245,255,0.12) 20px 21px);
            pointer-events: none;
        }

        .editor-panel::after {
            content: "";
            position: absolute;
            top: 10px;
            left: 50%;
            width: 72px;
            height: 5px;
            border-radius: 999px;
            background: rgba(255,255,255,0.25);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .tabs-bar {
            min-height: 62px;
            display: flex;
            align-items: stretch;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 12px 14px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.09);
            scrollbar-width: none;
            position: relative;
            z-index: 1;
        }

        .tabs-bar::-webkit-scrollbar,
        .items-scroll::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            min-width: 68px;
            min-height: 40px;
            border-radius: 18px;
            border: 1px solid transparent;
            background:
                linear-gradient(180deg, rgba(242,255,233,0.07), rgba(242,255,233,0.025)),
                rgba(4, 13, 20, 0.45);
            color: var(--text-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            cursor: pointer;
            transition: transform 180ms ease, opacity 180ms ease, border-color 180ms ease, background 180ms ease, color 180ms ease, box-shadow 180ms ease;
        }

        .tab-btn .tab-icon {
            font-size: 20px;
            line-height: 1;
        }

        .tab-btn .tab-label {
            margin-top: 4px;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .tab-btn.active {
            opacity: 1;
            color: var(--text);
            border-color: rgba(72, 255, 106, 0.62);
            background:
                radial-gradient(circle at 50% 12%, rgba(72,255,106,0.22), transparent 44%),
                linear-gradient(180deg, rgba(56,245,255,0.18), rgba(111,69,255,0.12)),
                rgba(242,255,233,0.07);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(7, 11, 30, 0.25), 0 0 18px rgba(72,255,106,0.16), inset 0 0 0 1px rgba(242,255,233,0.07);
        }

        .items-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 14px 14px calc(16px + var(--safe-bottom));
            position: relative;
            z-index: 1;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            padding-bottom: 8px;
        }

        .item-btn {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 22px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 180ms ease, border-color 180ms ease, filter 180ms ease;
            cursor: pointer;
            color: var(--text);
            background: linear-gradient(180deg, rgba(255,255,255,0.13), rgba(255,255,255,0.05)), rgba(255,255,255,0.04);
        }

        .item-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.14), transparent 55%);
            pointer-events: none;
        }

        .item-btn:active {
            transform: scale(0.92);
        }

        .item-btn.selected {
            border-color: rgba(72, 255, 106, 0.94);
            box-shadow: 0 0 0 2px rgba(72,255,106,0.34), 0 0 24px rgba(56,245,255,0.14), 0 16px 28px rgba(0,0,0,0.28);
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        .item-btn.item-style {
            background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.08)), rgba(13, 15, 37, 0.72);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 24px;
        }

        .item-btn.item-style .slot-badge {
            position: absolute;
            left: 8px;
            bottom: 7px;
            font-size: 10px;
            line-height: 1;
            letter-spacing: 0.12em;
            color: rgba(245, 247, 255, 0.82);
            text-transform: uppercase;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 700;
        }

        .feedback-hud {
            position: absolute;
            top: calc(78px + var(--safe-top));
            right: 12px;
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }

        .feedback-card {
            max-width: min(44vw, 168px);
            min-width: 112px;
            padding: 10px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.14);
            background:
                linear-gradient(180deg, rgba(7, 27, 30, 0.9), rgba(5, 10, 22, 0.68)),
                repeating-linear-gradient(90deg, rgba(72,255,106,0.055) 0 1px, transparent 1px 22px);
            box-shadow: var(--shadow);
            text-align: right;
        }

        .feedback-label {
            display: block;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .feedback-value {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text);
        }

        .feedback-gif {
            width: min(30vw, 132px);
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.16);
            object-fit: cover;
            background: rgba(13, 15, 37, 0.42);
            box-shadow: 0 16px 28px rgba(0,0,0,0.24);
            opacity: 0;
            transform: translateY(-8px) scale(0.92);
            transition: opacity 180ms ease, transform 220ms ease;
        }

        .feedback-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .item-btn.item-style .slot-glyph {
            filter: drop-shadow(0 3px 12px rgba(255,255,255,0.2));
        }

        .item-btn.item-color::after,
        .item-btn.item-swatch::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.28);
            pointer-events: none;
        }

        .spark {
            position: absolute;
            inset: auto auto 12px 12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.75);
            box-shadow: 18px -10px 0 rgba(255,255,255,0.25), 36px 6px 0 rgba(255,255,255,0.12);
            pointer-events: none;
            animation: sparkleDrift 1.8s ease-in-out infinite;
        }

        @keyframes sparkleDrift {
            0%, 100% { transform: translateY(0); opacity: 0.45; }
            50% { transform: translateY(-5px); opacity: 0.85; }
        }

        @media (max-width: 480px) {
            .topbar {
                padding-inline: 10px;
                gap: 10px;
            }

            .brand-chip {
                min-width: 0;
                flex: 1;
                padding: 10px 12px;
            }

            .brand-title {
                font-size: 13px;
            }

            .brand-subtitle {
                font-size: 9px;
            }

            .icon-button {
                width: 44px;
                height: 44px;
                border-radius: 14px;
                font-size: 20px;
            }

            .feedback-hud {
                top: calc(74px + var(--safe-top));
                right: 10px;
                gap: 8px;
            }

            .feedback-card {
                max-width: min(48vw, 152px);
                padding: 9px 10px;
            }

            .feedback-label {
                font-size: 10px;
            }

            .feedback-value {
                font-size: 11px;
            }

            .feedback-gif {
                width: min(26vw, 104px);
                border-radius: 16px;
            }

            .editor-panel {
                height: min(47%, 370px);
            }

            .tabs-bar {
                gap: 8px;
                padding: 12px 10px 10px;
            }

            .tab-btn {
                min-width: 62px;
            }

            .items-scroll {
                padding: 12px 10px calc(16px + var(--safe-bottom));
            }

            .items-grid {
                gap: 10px;
            }

            .item-btn {
                border-radius: 16px;
            }
        }

        @media (max-width: 360px) {
            .items-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .brand-title {
                font-size: 12px;
            }

            .brand-subtitle {
                letter-spacing: 0.14em;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-gif: runway reactions -> catalogs/gifs.json -->
<!-- [agent-note][stage3] resolved-audio: ui/select/random/bgm -> catalogs/audios.json -->
<img id="asset_bg_pattern" data-editable="image" data-label="Background Pattern" src="https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.gif" hidden>
<img id="gif_success" data-editable="image" data-label="Success Reaction" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.gif" hidden>
<img id="gif_fail" data-editable="image" data-label="Fail Reaction" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.gif" hidden>
<audio id="bgm_main" data-editable="audio" data-label="Portal Booth Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_tap" data-editable="audio" data-label="UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_select" data-editable="audio" data-label="Item Select" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
<audio id="sfx_random" data-editable="audio" data-label="Style Shuffle" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Repeat Tap" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "bgSpeed": { "type": "number", "label": "BG Animation Speed", "value": 0.5, "min": 0, "max": 2 },
    "themeColor": { "type": "color", "label": "UI Accent", "value": "#67d8ff" }
}
</script>

<!-- Main Container -->
<div id="game-container" class="app-shell">
    <!-- Layer 0: Canvas (Avatar Render) -->
    <canvas id="gameCanvas"></canvas>

    <!-- Layer 1: UI -->
    <div id="ui-layer" class="ui-layer">
        
        <!-- Header -->
        <div class="topbar">
            <div class="brand-chip">
                <div class="brand-mark">🌀</div>
                <div class="brand-copy">
                    <span class="brand-title">PORTAL CLOSET</span>
                    <span class="brand-subtitle">MULTIVERSE STUDIO</span>
                </div>
            </div>
            <button id="btn-random" class="icon-button" aria-label="Portal shuffle avatar">🎲</button>
        </div>

        <div class="feedback-hud" aria-live="polite">
            <div class="feedback-card">
                <span class="feedback-label">Portal Signal</span>
                <span id="feedback-text" class="feedback-value">Tap a rack to tune the traveler.</span>
            </div>
            <img id="feedback-gif" class="feedback-gif" alt="Portal reaction overlay">
        </div>

        <!-- Spacer for Avatar View -->
        <div class="touch-zone" id="touch-zone"></div>

        <!-- Editor Panel -->
        <div class="editor-panel" id="editor-panel">
            
            <!-- Category Tabs -->
            <div class="tabs-bar">
                <!-- Injected by JS -->
            </div>

            <!-- Items Grid -->
            <div class="items-scroll">
                <div id="items-grid" class="items-grid">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * §0 System Invariants & Config
 */
const CATEGORIES = {
    SKIN: { id: 'skin', icon: '🧪', label: 'Tone' },
    FACE: { id: 'face', icon: '😬', label: 'Mood' },
    HAIR: { id: 'hair', icon: '⚡', label: 'Hair' },
    TOP:  { id: 'top',  icon: '🥼', label: 'Upper' },
    BOT:  { id: 'bot',  icon: '👖', label: 'Lower' },
    BG:   { id: 'bg',   icon: '🌀', label: 'Stage' }
};

// Data Definitions (Procedural Assets)
const ASSETS = {
    skin: ['#f8d9c6', '#f0c0a0', '#e0ac86', '#c68662', '#8d5538', '#5c3a26', '#b6ff3b', '#9be7ff'],
    hairColors: ['#2d2145', '#59403f', '#d4af37', '#af3c8b', '#b8f7ff', '#48ff6a'],
    clothesColors: ['#f2ffe9', '#38f5ff', '#55d88d', '#ffe45c', '#6f45ff', '#132615', '#48ff6a']
};

const STYLE_PREVIEW = {
    hair: ['◖', '◠', '⬒', '⚡', '⬘', '◉'],
    top: ['🥼', '◫', '⬚', '◇'],
    bot: ['▥', '▮', '◭', '▯']
};

const STAGE_SWATCHES = ['#121a2f', '#173726', '#3a1f3d', '#192852', '#33206d', '#145460', '#1b2048', '#090b1a'];
const DIMENSION_NAMES = ['Garage', 'Cronenberg', 'Citadel', 'Crowd', 'Corridor', 'UFO', 'Shard', 'Void'];

let gameState = 'PLAYING'; // PLAYING
let currentTab = 'hair';
let avatarState = {
    skin: 0,
    face: 0,
    hair: 3,
    hairColor: 4,
    top: 0,
    topColor: 0,
    bot: 0,
    botColor: 1,
    bg: 0
};

// Canvas & Audio
let canvas, ctx, cw, ch, dpr;
let audioCtx, audioBuffers = {};
let initialized = false;
let particles = [];
let bgmStarted = false;
let lastTapAt = 0;
let feedbackTimer = null;
const SFX_ELEMENT_IDS = {
    tap: 'sfx_tap',
    select: 'sfx_select',
    random: 'sfx_random',
    fail: 'sfx_fail'
};

/**
 * §1 Lifecycle & Init
 */
document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    setupCanvas();
    setupAudio(); // L1
    
    // Global Input Router
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('btn-random').onclick = randomizeAvatar;
});

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            window.gameConfig = {};
            for (const k in defs) window.gameConfig[k] = defs[k].value;
        } catch(e) { window.gameConfig = { bgSpeed: 0.5, themeColor: '#67d8ff' }; }
    }
}

function setupCanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    const ro = new ResizeObserver(entries => {
        const rect = entries[0].contentRect;
        resize(rect.width, rect.height);
        if (!initialized) {
            initialized = true;
            initGame();
        }
    });
    ro.observe(canvas);
}

function resize(w, h) {
    dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    cw = w;
    ch = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(); // Immediate redraw
}

async function setupAudio() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = new AudioContext();
    
    const load = async (id, elId) => {
        try {
            const el = document.getElementById(elId);
            if (!el?.src) return;
            const srcUrl = new URL(el.src, window.location.href);
            if (srcUrl.origin !== window.location.origin) return;
            const res = await fetch(srcUrl.href);
            if (!res.ok) throw new Error(`Audio load failed with ${res.status}`);
            const buf = await audioCtx.decodeAudioData(await res.arrayBuffer());
            audioBuffers[id] = buf;
        } catch(e) {
            // [agent-note][stage4] repair: keep remote catalog audio optional; oscillator fallback prevents CORS/media noise from blocking play.
        }
    };
    
    await Promise.all(Object.entries(SFX_ELEMENT_IDS).map(([id, elId]) => load(id, elId)));
}

function initGame() {
    buildUI();
    const bgm = document.getElementById('bgm_main');
    bgm.volume = 0.2;
    updateFeedback('Tap a rack to tune the traveler.', null);
    document.addEventListener('visibilitychange', syncAudioState);
    requestAnimationFrame(gameLoop);
}

/**
 * §2 UI Construction
 */
function buildUI() {
    const tabsContainer = document.querySelector('#editor-panel > div:first-child');
    tabsContainer.innerHTML = '';
    
    Object.values(CATEGORIES).forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${currentTab === cat.id ? 'active' : ''}`;
        btn.innerHTML = `<span class="tab-icon">${cat.icon}</span><span class="tab-label">${cat.label}</span>`;
        btn.onclick = (e) => {
            e.stopPropagation();
            switchTab(cat.id);
        };
        tabsContainer.appendChild(btn);
    });
    
    renderItems();
}

function switchTab(tabId) {
    if (currentTab === tabId) {
        playSfx('fail');
        updateFeedback('Already on this rack — pick a new portal lane.', 'fail');
        return;
    }
    playSfx('tap');
    vibrate('light');
    currentTab = tabId;
    updateFeedback(`Browsing ${CATEGORIES[tabId.toUpperCase()]?.label || tabId} modules.`, null);
    
    // Update Tab UI
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        const catId = Object.values(CATEGORIES)[idx].id;
        if (catId === tabId) btn.classList.add('active');
        else btn.classList.remove('active');
    });
    
    renderItems();
}

function renderItems() {
    const grid = document.getElementById('items-grid');
    grid.innerHTML = '';
    
    let items = [];
    
    // Determine items based on category
    if (currentTab === 'skin') {
        items = ASSETS.skin;
    } else if (currentTab === 'face') {
        items = Array(6).fill(0); // 6 Face types
    } else if (currentTab === 'hair') {
        items = [...Array(6).fill('style'), ...ASSETS.hairColors.map(c => 'color:'+c)];
    } else if (currentTab === 'top') {
        items = [...Array(4).fill('style'), ...ASSETS.clothesColors.map(c => 'color:'+c)];
    } else if (currentTab === 'bot') {
        items = [...Array(4).fill('style'), ...ASSETS.clothesColors.map(c => 'color:'+c)];
    } else if (currentTab === 'bg') {
        items = STAGE_SWATCHES;
    }

    items.forEach((item, idx) => {
        const btn = document.createElement('button');
        let isSelected = false;
        if (currentTab === 'skin') isSelected = (idx === avatarState.skin);
        if (currentTab === 'face') isSelected = (idx === avatarState.face);
        if (currentTab === 'bg') isSelected = (idx === avatarState.bg);
        if (currentTab === 'hair') {
            if (typeof item === 'string' && item.startsWith('color:')) isSelected = (ASSETS.hairColors.indexOf(item.split(':')[1]) === avatarState.hairColor);
            else isSelected = (idx === avatarState.hair);
        }
        if (currentTab === 'top') {
             if (typeof item === 'string' && item.startsWith('color:')) isSelected = (ASSETS.clothesColors.indexOf(item.split(':')[1]) === avatarState.topColor);
             else isSelected = (idx === avatarState.top);
        }
        if (currentTab === 'bot') {
             if (typeof item === 'string' && item.startsWith('color:')) isSelected = (ASSETS.clothesColors.indexOf(item.split(':')[1]) === avatarState.botColor);
             else isSelected = (idx === avatarState.bot);
        }

        btn.className = `item-btn ${isSelected ? 'selected' : ''}`;
        
        if (currentTab === 'skin' || currentTab === 'bg') {
            btn.classList.add('item-swatch');
            btn.style.backgroundColor = item;
        } else if (typeof item === 'string' && item.startsWith('color:')) {
            btn.classList.add('item-color');
            btn.style.backgroundColor = item.split(':')[1];
        } else {
            btn.classList.add('item-style');
            const glyphs = STYLE_PREVIEW[currentTab] || ['✦', '✧', '⬢', '◈', '◉', '◎'];
            const glyph = currentTab === 'face' ? ['😊', '😌', '😉', '😄', '😮', '😐'][idx] : glyphs[idx] || (idx + 1);
            btn.innerHTML = `<span class="slot-glyph">${glyph}</span><span class="slot-badge">${currentTab}</span><span class="spark" aria-hidden="true"></span>`;
        }

        btn.onclick = (e) => {
            e.stopPropagation();
            selectItem(idx, item, e.clientX, e.clientY);
            renderItems();
        };
        grid.appendChild(btn);
    });
}

function selectItem(idx, val, x, y) {
    playSfx('select');
    vibrate('light');
    createParticles(x, y, 5);
    
    if (currentTab === 'skin') avatarState.skin = idx;
    if (currentTab === 'face') avatarState.face = idx;
    if (currentTab === 'bg') avatarState.bg = idx;
    
    if (currentTab === 'hair') {
        if (typeof val === 'string' && val.startsWith('color:')) {
            avatarState.hairColor = ASSETS.hairColors.indexOf(val.split(':')[1]);
        } else {
            avatarState.hair = idx;
        }
    }
    if (currentTab === 'top') {
        if (typeof val === 'string' && val.startsWith('color:')) {
            avatarState.topColor = ASSETS.clothesColors.indexOf(val.split(':')[1]);
        } else {
            avatarState.top = idx;
        }
    }
    if (currentTab === 'bot') {
        if (typeof val === 'string' && val.startsWith('color:')) {
            avatarState.botColor = ASSETS.clothesColors.indexOf(val.split(':')[1]);
        } else {
            avatarState.bot = idx;
        }
    }

    const messages = {
        skin: 'Traveler tone synced for the portal.',
        face: 'Mood tuned — panic level readable.',
        hair: typeof val === 'string' && val.startsWith('color:') ? 'Hair tint locked for the jump.' : 'New portal hair silhouette selected.',
        top: typeof val === 'string' && val.startsWith('color:') ? 'Upper palette tuned for the dimension.' : 'Upper disguise module swapped in.',
        bot: typeof val === 'string' && val.startsWith('color:') ? 'Lower palette tuned for the dimension.' : 'Lower disguise module swapped in.',
        bg: 'Dimension backdrop locked.'
    };
    updateFeedback(messages[currentTab] || 'Selection updated.', 'success');
}

function randomizeAvatar() {
    playSfx('random');
    vibrate('medium');
    avatarState.skin = Math.floor(Math.random() * ASSETS.skin.length);
    avatarState.face = Math.floor(Math.random() * 6);
    avatarState.hair = Math.floor(Math.random() * 6);
    avatarState.hairColor = Math.floor(Math.random() * ASSETS.hairColors.length);
    avatarState.top = Math.floor(Math.random() * 4);
    avatarState.topColor = Math.floor(Math.random() * ASSETS.clothesColors.length);
    avatarState.bot = Math.floor(Math.random() * 4);
    avatarState.botColor = Math.floor(Math.random() * ASSETS.clothesColors.length);
    avatarState.bg = Math.floor(Math.random() * STAGE_SWATCHES.length);
    updateFeedback('Portal shuffle complete — disguise signal stable.', 'success');
    renderItems();
}

/**
 * §3 Logic & Rendering
 */
function gameLoop(time) {
    updateParticles();
    draw();
    requestAnimationFrame(gameLoop);
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].life -= 0.05;
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function createParticles(x, y, count) {
    const rect = canvas.getBoundingClientRect();
    const cx = x - rect.left;
    const cy = y - rect.top;
    for(let i=0; i<count; i++) {
        particles.push({
            x: cx, y: cy,
            vx: (Math.random()-0.5)*10,
            vy: (Math.random()-0.5)*10,
            life: 1.0,
            color: ['#48ff6a', '#38f5ff', '#ff4eb8', '#ffe45c'][Math.floor(Math.random() * 4)] || window.gameConfig.themeColor || '#48ff6a'
        });
    }
}

function draw() {
    if (!cw || !ch) return;
    
    const bgColors = STAGE_SWATCHES;
    const selectedBg = bgColors[avatarState.bg] || '#eceeff';
    const gradient = ctx.createLinearGradient(0, 0, 0, ch);
    gradient.addColorStop(0, selectedBg);
    gradient.addColorStop(1, shadeColor(selectedBg, -30));
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cw, ch);

    drawBackdrop(selectedBg);
    
    const pattern = document.getElementById('asset_bg_pattern');
    if (pattern && pattern.complete) {
        ctx.globalAlpha = 0.025;
        const speed = window.gameConfig.bgSpeed || 0.5;
        const offset = (Date.now() / 50 * speed) % 200;
        for(let x=-200; x<cw; x+=200) {
            for(let y=-200; y<ch; y+=200) {
                ctx.drawImage(pattern, x + offset, y + offset, 200, 200);
            }
        }
        ctx.globalAlpha = 1.0;
    }

    const centerX = cw / 2;
    const centerY = ch * 0.45;
    const scale = Math.min(cw, ch) / 400;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.scale(scale, scale);

    drawAvatarShadow(ctx);
    drawSpotlight(ctx);
    drawBody(ctx);
    drawBottoms(ctx);
    drawTops(ctx);
    drawHead(ctx);
    drawHair(ctx);
    drawStarAura(ctx);

    ctx.restore();
    
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5 * p.life, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

function drawBackdrop(selectedBg) {
    const horizon = ch * 0.62;
    const stripeColor = shadeColor(selectedBg, -46);
    const t = Date.now() / 1000;
    const stage = avatarState.bg % 5;
    const portalPulse = 0.5 + 0.5 * Math.sin(t * 1.2 + stage);

    ctx.save();

    const skyGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.18, 12, cw * 0.5, ch * 0.2, cw * 0.62);
    skyGlow.addColorStop(0, `rgba(72, 255, 106, ${0.26 + portalPulse * 0.08})`);
    skyGlow.addColorStop(0.42, 'rgba(56, 245, 255, 0.13)');
    skyGlow.addColorStop(0.76, 'rgba(255, 78, 184, 0.08)');
    skyGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = skyGlow;
    ctx.fillRect(0, 0, cw, ch);

    drawPortalRings(cw * 0.5, ch * 0.24, Math.min(cw, ch) * (0.18 + portalPulse * 0.014), stage);
    drawGarageSilhouette(horizon, stage);

    ctx.globalAlpha = 0.42;
    ctx.strokeStyle = 'rgba(56,245,255,0.18)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
        const y = 34 + ((i * 41 + t * 18) % Math.max(90, horizon - 56));
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y + Math.sin(t + i) * 5);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const floorGradient = ctx.createLinearGradient(0, horizon, 0, ch);
    floorGradient.addColorStop(0, 'rgba(72,255,106,0.06)');
    floorGradient.addColorStop(0.36, 'rgba(5,10,18,0.2)');
    floorGradient.addColorStop(1, stripeColor);
    ctx.fillStyle = floorGradient;
    ctx.fillRect(0, horizon, cw, ch - horizon);

    ctx.strokeStyle = 'rgba(72,255,106,0.11)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
        const y = horizon + i * 18;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(56,245,255,0.10)';
    for (let x = -cw * 0.2; x < cw * 1.2; x += 34) {
        ctx.beginPath();
        ctx.moveTo(cw * 0.5, horizon);
        ctx.lineTo(x, ch);
        ctx.stroke();
    }

    for (let i = 0; i < 30; i++) {
        const starX = ((i * 97 + stage * 23) % cw) + 10;
        const starY = 26 + ((i * 53) % Math.max(70, horizon - 54));
        const pulse = 0.22 + 0.26 * Math.sin((Date.now() / 360) + i);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = i % 4 === 0 ? '#48ff6a' : (i % 4 === 1 ? '#38f5ff' : (i % 4 === 2 ? '#f2ffe9' : '#ff4eb8'));
        ctx.beginPath();
        ctx.arc(starX, starY, i % 6 === 0 ? 2.5 : 1.25, 0, Math.PI * 2);
        ctx.fill();
    }

    drawStageBadge(stage);
    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawPortalRings(x, y, r, stage) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Date.now() / 5200);
    for (let i = 0; i < 4; i++) {
        const radius = r + i * 13;
        ctx.globalAlpha = 0.42 - i * 0.06;
        ctx.strokeStyle = i % 2 ? '#38f5ff' : '#48ff6a';
        ctx.lineWidth = 4 - i * 0.55;
        ctx.setLineDash([18 + i * 4, 9 + i * 3]);
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 1.22, radius * 0.72, 0.04 * stage, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = '#48ff6a';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.08, r * 0.58, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawGarageSilhouette(horizon, stage) {
    ctx.save();
    ctx.fillStyle = 'rgba(2, 7, 12, 0.42)';
    ctx.fillRect(0, horizon - 34, cw, 34);

    ctx.fillStyle = 'rgba(72,255,106,0.12)';
    for (let i = 0; i < 5; i++) {
        const x = (i * cw / 4.3 + stage * 18) % (cw + 60) - 30;
        ctx.fillRect(x, horizon - 74 - (i % 2) * 18, 8, 42 + (i % 3) * 14);
        ctx.beginPath();
        ctx.arc(x + 4, horizon - 78 - (i % 2) * 18, 11, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.strokeStyle = 'rgba(56,245,255,0.16)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cw * 0.06, horizon - 18);
    ctx.bezierCurveTo(cw * 0.22, horizon - 62, cw * 0.34, horizon - 16, cw * 0.5, horizon - 48);
    ctx.bezierCurveTo(cw * 0.64, horizon - 76, cw * 0.77, horizon - 24, cw * 0.95, horizon - 58);
    ctx.stroke();

    ctx.globalAlpha = 0.8;
    for (let i = 0; i < 4; i++) {
        const bx = 16 + i * 34;
        ctx.fillStyle = i % 2 ? 'rgba(56,245,255,0.13)' : 'rgba(72,255,106,0.13)';
        ctx.fillRect(bx, horizon - 46, 14, 30);
        ctx.beginPath();
        ctx.arc(bx + 7, horizon - 49, 7, Math.PI, 0);
        ctx.fill();
    }
    ctx.restore();
}

function drawStageBadge(stage) {
    const label = DIMENSION_NAMES[avatarState.bg] || `D-${avatarState.bg + 1}`;
    ctx.save();
    ctx.globalAlpha = 0.52;
    ctx.font = '700 11px Rajdhani, sans-serif';
    ctx.letterSpacing = '0.12em';
    ctx.fillStyle = 'rgba(242,255,233,0.78)';
    ctx.textAlign = 'left';
    ctx.fillText(`DIMENSION: ${label.toUpperCase()}`, 14, Math.min(ch - 18, ch * 0.57));
    ctx.restore();
}

function drawAvatarShadow(ctx) {
    const shadow = ctx.createRadialGradient(0, 180, 30, 0, 180, 110);
    shadow.addColorStop(0, 'rgba(16, 19, 41, 0.38)');
    shadow.addColorStop(1, 'rgba(16, 19, 41, 0)');
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(0, 180, 95, 28, 0, 0, Math.PI * 2);
    ctx.fill();
}

function drawSpotlight(ctx) {
    const beam = ctx.createLinearGradient(0, -250, 0, 105);
    beam.addColorStop(0, 'rgba(72,255,106,0.18)');
    beam.addColorStop(0.34, 'rgba(56,245,255,0.11)');
    beam.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-86, -250);
    ctx.lineTo(86, -250);
    ctx.lineTo(118, 96);
    ctx.lineTo(-118, 96);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(72,255,106,0.18)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.ellipse(0, -108, 80, 104, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawStarAura(ctx) {
    ctx.save();
    ctx.globalAlpha = 0.86;
    for (let i = 0; i < 7; i++) {
        const angle = (Date.now() / 980) + i * (Math.PI * 2 / 7);
        const x = Math.cos(angle) * 94;
        const y = -100 + Math.sin(angle) * 25;
        if (i % 3 === 0) drawMiniPortal(ctx, x, y, i % 2 === 0 ? '#48ff6a' : '#38f5ff');
        else drawMiniStar(ctx, x, y, i % 2 === 0 ? '#38f5ff' : '#ff4eb8');
    }
    ctx.restore();
}

function drawMiniPortal(ctx, x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Date.now() / 700);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6, 0.4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 5, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawMiniStar(ctx, x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const outer = i * (Math.PI * 2) / 5 - Math.PI / 2;
        const inner = outer + Math.PI / 5;
        const outerRadius = 8;
        const innerRadius = 3.5;
        if (i === 0) ctx.moveTo(Math.cos(outer) * outerRadius, Math.sin(outer) * outerRadius);
        else ctx.lineTo(Math.cos(outer) * outerRadius, Math.sin(outer) * outerRadius);
        ctx.lineTo(Math.cos(inner) * innerRadius, Math.sin(inner) * innerRadius);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

// --- Procedural Drawing Helpers ---

function drawBody(ctx) {
    const skinTone = ASSETS.skin[avatarState.skin];
    ctx.fillStyle = skinTone;
    
    ctx.fillRect(-15, -60, 30, 40);
    
    ctx.beginPath();
    ctx.roundRect(-70, -40, 30, 120, 15);
    ctx.roundRect(40, -40, 30, 120, 15);
    ctx.fill();
    
    ctx.beginPath();
    ctx.roundRect(-35, 80, 30, 140, 15);
    ctx.roundRect(5, 80, 30, 140, 15);
    ctx.fill();
}

function drawHead(ctx) {
    const skinTone = ASSETS.skin[avatarState.skin];
    const faceY = -90;
    const blushColor = shadeColor(skinTone, 18);

    ctx.save();

    const faceGlow = ctx.createRadialGradient(0, -95, 20, 0, -95, 95);
    faceGlow.addColorStop(0, 'rgba(255,255,255,0.15)');
    faceGlow.addColorStop(0.62, 'rgba(72,255,106,0.06)');
    faceGlow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = faceGlow;
    ctx.beginPath();
    ctx.ellipse(0, -90, 72, 82, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = skinTone;
    ctx.beginPath();
    ctx.ellipse(0, -90, 50, 60, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(38, 28, 60, 0.18)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = blushColor;
    ctx.globalAlpha = 0.32;
    ctx.beginPath();
    ctx.ellipse(-28, faceY + 16, 10, 6, -0.2, 0, Math.PI*2);
    ctx.ellipse(28, faceY + 16, 10, 6, 0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = '#2d2145';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(-31, faceY - 13);
    ctx.lineTo(-11, faceY - 8);
    ctx.moveTo(11, faceY - 8);
    ctx.lineTo(31, faceY - 13);
    ctx.stroke();

    const eyeType = avatarState.face % 3;
    if (eyeType === 0) {
        ctx.fillStyle = '#f2ffe9';
        ctx.beginPath(); ctx.ellipse(-20, faceY, 8, 10, -0.08, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(20, faceY, 8, 10, 0.08, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2d2145';
        ctx.beginPath(); ctx.arc(-19, faceY + 1, 3.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(21, faceY + 1, 3.8, 0, Math.PI*2); ctx.fill();
    } else if (eyeType === 1) {
        ctx.beginPath(); ctx.arc(-20, faceY + 2, 8, Math.PI, 0); ctx.stroke();
        ctx.beginPath(); ctx.arc(20, faceY + 2, 8, Math.PI, 0); ctx.stroke();
    } else {
        ctx.fillStyle = '#f2ffe9';
        ctx.beginPath(); ctx.ellipse(-20, faceY, 8, 10, -0.08, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2d2145';
        ctx.beginPath(); ctx.arc(-19, faceY + 1, 3.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(12, faceY); ctx.lineTo(30, faceY - 1); ctx.stroke();
    }
    
    const mouthType = Math.floor(avatarState.face / 2);
    ctx.strokeStyle = '#2d2145';
    ctx.beginPath();
    if (mouthType === 0) ctx.arc(0, faceY + 20, 10, 0.1, Math.PI - 0.1);
    else if (mouthType === 1) ctx.ellipse(0, faceY + 25, 5, 8, 0, 0, Math.PI*2);
    else { ctx.moveTo(-10, faceY + 20); ctx.lineTo(10, faceY + 20); }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(72,255,106,0.72)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, faceY + 26);
    ctx.bezierCurveTo(18, faceY + 34, 7, faceY + 38, 16, faceY + 45);
    ctx.stroke();

    ctx.restore();
}

function drawHair(ctx) {
    const baseColor = ASSETS.hairColors[avatarState.hairColor];
    const shineColor = shadeColor(baseColor, 24);
    const style = avatarState.hair;
    
    ctx.save();
    ctx.fillStyle = baseColor;
    ctx.beginPath();
    if (style === 0) {
        ctx.arc(0, -90, 52, Math.PI, 0);
    } else if (style === 1) {
        ctx.arc(0, -95, 55, Math.PI*0.8, 0.2*Math.PI);
        ctx.lineTo(50, -90); ctx.lineTo(-50, -90);
    } else if (style === 2) {
        ctx.moveTo(-55, -90);
        ctx.quadraticCurveTo(0, -170, 55, -90);
        ctx.lineTo(60, -40); ctx.quadraticCurveTo(0, -50, -60, -40);
    } else if (style === 3) {
        ctx.moveTo(-50, -100);
        for(let i=0; i<5; i++) {
            ctx.lineTo(-30 + i*15, -160 - (i%2)*20);
            ctx.lineTo(-10 + i*15, -100);
        }
    } else if (style === 4) {
        ctx.moveTo(-55, -90);
        ctx.quadraticCurveTo(0, -160, 55, -90);
        ctx.lineTo(65, 20); ctx.lineTo(-65, 20);
    } else {
        ctx.arc(0, -140, 25, 0, Math.PI*2);
        ctx.fill(); ctx.beginPath();
        ctx.arc(0, -95, 52, Math.PI, 0);
    }
    ctx.fill();

    ctx.globalAlpha = 0.28;
    ctx.fillStyle = shineColor;
    ctx.beginPath();
    ctx.ellipse(-16, -120, 18, 28, -0.6, 0, Math.PI * 2);
    ctx.fill();

    if (style === 3) {
        ctx.globalAlpha = 0.88;
        ctx.strokeStyle = 'rgba(242,255,233,0.82)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-35, -126);
        ctx.lineTo(-16, -156);
        ctx.lineTo(4, -128);
        ctx.lineTo(22, -168);
        ctx.lineTo(37, -126);
        ctx.stroke();
    }
    ctx.restore();
}

function drawTops(ctx) {
    const baseColor = ASSETS.clothesColors[avatarState.topColor];
    const style = avatarState.top;
    
    ctx.fillStyle = baseColor;
    ctx.beginPath();
    
    if (style === 0) {
        ctx.roundRect(-45, -40, 90, 118, 10);
        ctx.fill();
        ctx.fillRect(-75, -40, 30, 44);
        ctx.fillRect(45, -40, 30, 44);

        ctx.fillStyle = 'rgba(9,18,24,0.8)';
        ctx.beginPath();
        ctx.moveTo(-22, -38);
        ctx.lineTo(0, 20);
        ctx.lineTo(22, -38);
        ctx.lineTo(38, 70);
        ctx.lineTo(-38, 70);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(56,245,255,0.62)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-34, -36);
        ctx.lineTo(-2, 28);
        ctx.lineTo(34, -36);
        ctx.stroke();
    } else if (style === 1) {
        ctx.roundRect(-50, -45, 100, 120, 15);
        ctx.fill();
        ctx.fillRect(-75, -40, 30, 90);
        ctx.fillRect(45, -40, 30, 90);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath(); ctx.arc(0, 40, 25, 0, Math.PI, false); ctx.fill();
    } else if (style === 2) {
        ctx.roundRect(-40, -40, 80, 110, 10);
        ctx.fill();
        ctx.fillStyle = 'rgba(56,245,255,0.28)';
        ctx.fillRect(-35, -18, 70, 9);
        ctx.fillRect(-35, 10, 70, 9);
    } else {
        ctx.moveTo(-40, -40); ctx.lineTo(40, -40);
        ctx.lineTo(60, 100); ctx.lineTo(-60, 100);
        ctx.fill();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, -40);
    ctx.lineTo(0, 18);
    ctx.lineTo(10, -40);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(72,255,106,0.88)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 10, 15, 9, -0.3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(72,255,106,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 10, 12, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();
}

function drawBottoms(ctx) {
    ctx.fillStyle = ASSETS.clothesColors[avatarState.botColor];
    const style = avatarState.bot;
    
    if (style === 0) {
        ctx.fillRect(-40, 60, 35, 60);
        ctx.fillRect(5, 60, 35, 60);
    } else if (style === 1) {
        ctx.fillRect(-42, 60, 38, 140);
        ctx.fillRect(4, 60, 38, 140);
    } else if (style === 2) {
        ctx.beginPath();
        ctx.moveTo(-45, 60); ctx.lineTo(45, 60);
        ctx.lineTo(60, 130); ctx.lineTo(-60, 130);
        ctx.fill();
    } else {
        ctx.fillRect(-38, 60, 34, 135);
        ctx.fillRect(4, 60, 34, 135);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 62);
    ctx.lineTo(0, 190);
    ctx.stroke();

    ctx.fillStyle = 'rgba(5,8,18,0.78)';
    ctx.beginPath();
    ctx.roundRect(-48, 196, 44, 12, 6);
    ctx.roundRect(4, 196, 44, 12, 6);
    ctx.fill();
}

function handleGlobalInput(e) {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    startBgmIfNeeded();
    
    if (e.target.id === 'gameCanvas' || e.target.id === 'touch-zone') {
        createParticles(e.clientX, e.clientY, 3);
        const now = performance.now();
        if (now - lastTapAt < 220) {
            playSfx('fail');
            updateFeedback('Easy — the portal booth needs one tap at a time.', 'fail');
        } else {
            playSfx('tap');
            updateFeedback('Portal pulse synced to your tap.', null);
        }
        lastTapAt = now;
    }
}

function playSfx(id) {
    if (!audioCtx) return;
    const buf = audioBuffers[id];
    if (buf) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        const volumes = { tap: 0.22, select: 0.28, random: 0.24, fail: 0.18 };
        gain.gain.value = volumes[id] ?? 0.2;
        src.buffer = buf;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
        return;
    }
    playToneFallback(id);
}

function playToneFallback(id) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.frequency.value = id === 'select' ? 600 : id === 'fail' ? 240 : 440;
    g.gain.value = 0.08;
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
}

function startBgmIfNeeded() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm || bgmStarted) return;
    bgm.play().then(() => {
        bgmStarted = true;
        updateFeedback('Portal booth is live.', null);
    }).catch(() => {});
}

function syncAudioState() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    if (document.hidden) {
        bgm.pause();
    } else if (bgmStarted) {
        bgm.play().catch(() => {});
    }
}

function updateFeedback(message, mood) {
    const text = document.getElementById('feedback-text');
    const gif = document.getElementById('feedback-gif');
    if (text) text.textContent = message;

    if (!gif) return;

    if (feedbackTimer) {
        clearTimeout(feedbackTimer);
        feedbackTimer = null;
    }

    const sourceId = mood === 'success' ? 'gif_success' : mood === 'fail' ? 'gif_fail' : null;
    if (!sourceId) {
        gif.classList.remove('active');
        gif.removeAttribute('src');
        return;
    }

    const source = document.getElementById(sourceId);
    if (!source) return;
    gif.src = source.src;
    gif.classList.add('active');
    feedbackTimer = window.setTimeout(() => {
        gif.classList.remove('active');
    }, 1800);
}

function vibrate(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'style-'+Date.now(), version: '1.0', params: { style }
    });
}

function shadeColor(hex, percent) {
    const normalized = hex.replace('#', '');
    const full = normalized.length === 3
        ? normalized.split('').map(ch => ch + ch).join('')
        : normalized;
    const num = parseInt(full, 16);
    const amt = Math.round(2.55 * percent);
    const r = Math.min(255, Math.max(0, (num >> 16) + amt));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
    return `rgb(${r}, ${g}, ${b})`;
}
