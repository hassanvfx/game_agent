<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Signal Run</title>
    <style>
        :root {
            --bg-core: #05060d;
            --bg-top: #090b16;
            --panel-bg: rgba(10, 16, 32, 0.82);
            --panel-border: rgba(111, 244, 255, 0.28);
            --panel-shadow: rgba(0, 0, 0, 0.66);
            --text-main: #effbff;
            --text-soft: #b2d9e8;
            --text-dim: #6f95ad;
            --accent: #71f4ff;
            --accent-strong: #17b9ff;
            --danger: #ff537f;
            --danger-deep: #580f24;
            --warning: #ffd26a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(23, 185, 255, 0.16), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-core) 58%, #020307);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.05), transparent 18%, transparent 82%, rgba(0,0,0,0.24)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.04) 0px,
                    rgba(255,255,255,0.04) 1px,
                    transparent 1px,
                    transparent 4px
                );
            opacity: 0.26;
            mix-blend-mode: screen;
        }

        body::after {
            background: radial-gradient(circle, transparent 48%, rgba(0, 0, 0, 0.85) 100%);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .vignette-overlay,
        .signal-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .signal-grid {
            background-image:
                linear-gradient(rgba(113, 244, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(113, 244, 255, 0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(180deg, transparent, rgba(255,255,255,0.7) 16%, rgba(255,255,255,0.25) 70%, transparent);
            opacity: 0.24;
        }

        .vignette-overlay {
            background: radial-gradient(circle, transparent 52%, rgba(0, 0, 0, 0.86) 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        }

        .glass-panel {
            width: min(92vw, 420px);
            pointer-events: auto;
            padding: 20px 18px;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            background:
                linear-gradient(180deg, rgba(21, 31, 57, 0.94), rgba(10, 17, 35, 0.88)),
                var(--panel-bg);
            box-shadow:
                0 24px 50px var(--panel-shadow),
                inset 0 0 0 1px rgba(255,255,255,0.05),
                0 0 18px rgba(23, 185, 255, 0.14);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .title-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            margin-bottom: 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(113, 244, 255, 0.1);
            color: var(--accent);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .display-text {
            margin: 0 0 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 0.95;
            text-shadow: 0 0 18px rgba(113, 244, 255, 0.3);
        }

        .title-main {
            font-size: clamp(2rem, 10vw, 4rem);
            color: var(--text-main);
        }

        .title-accent {
            display: block;
            margin-top: 6px;
            color: var(--danger);
        }

        .body-copy {
            margin: 0;
            color: var(--text-soft);
            font-size: clamp(0.98rem, 3vw, 1.18rem);
            line-height: 1.2;
        }

        .helper-copy {
            margin: 10px 0 18px;
            color: var(--text-dim);
            font-size: 0.92rem;
            letter-spacing: 0.03em;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            color: var(--warning);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--warning);
            box-shadow: 0 0 12px rgba(255, 210, 106, 0.9);
            animation: signalBlink 1.4s ease-in-out infinite;
        }

        .button-shell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 52px;
            border: 1px solid rgba(113, 244, 255, 0.34);
            border-radius: 14px;
            background:
                linear-gradient(180deg, rgba(32, 127, 183, 0.95), rgba(9, 79, 128, 0.98));
            color: #f7fcff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: clamp(0.96rem, 3.8vw, 1.05rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.45),
                0 0 16px rgba(23, 185, 255, 0.28),
                inset 0 1px 0 rgba(255,255,255,0.18);
            transition: transform 150ms ease, filter 150ms ease, box-shadow 150ms ease;
            cursor: pointer;
        }

        .button-shell:hover,
        .button-shell:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.06);
            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.48),
                0 0 18px rgba(113, 244, 255, 0.34),
                inset 0 1px 0 rgba(255,255,255,0.22);
            outline: none;
        }

        .button-shell:active {
            transform: translateY(1px) scale(0.985);
        }

        .button-shell--danger {
            background:
                linear-gradient(180deg, rgba(165, 44, 74, 0.98), rgba(97, 16, 35, 0.98));
            border-color: rgba(255, 83, 127, 0.4);
            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.45),
                0 0 16px rgba(255, 83, 127, 0.26),
                inset 0 1px 0 rgba(255,255,255,0.16);
        }

        .button-icon {
            font-size: 1.1em;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.28));
        }

        .screen-hidden {
            display: none;
        }

        #gif-feedback {
            position: absolute;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(14px, env(safe-area-inset-bottom));
            width: min(36vw, 148px);
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
            z-index: 2;
        }

        .feedback-gif {
            width: 100%;
            max-height: 124px;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid rgba(113, 244, 255, 0.26);
            background: rgba(6, 10, 20, 0.42);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.is-visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif--impact {
            border-color: rgba(255, 83, 127, 0.34);
        }

        .feedback-gif--boost {
            border-color: rgba(113, 244, 255, 0.34);
        }

        #start-screen {
            text-align: center;
            transform-origin: center;
            animation: panelFloat 2.8s ease-in-out infinite;
        }

        #game-over-screen {
            text-align: center;
        }

        .score-summary {
            margin: 0 0 18px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: clamp(1rem, 4vw, 1.4rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .score-value {
            color: var(--text-main);
            text-shadow: 0 0 12px rgba(113, 244, 255, 0.24);
        }

        #hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 42px;
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(113, 244, 255, 0.22);
            background: rgba(7, 14, 29, 0.68);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.34);
            color: var(--text-main);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: clamp(0.88rem, 3vw, 1rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .hud-hidden {
            display: none !important;
        }

        .hud-label {
            color: var(--accent);
        }

        .hud-score {
            min-width: 2ch;
        }

        .pulse-anim {
            animation: pulseSignal 2s ease-in-out infinite;
        }

        @keyframes pulseSignal {
            0%, 100% {
                text-shadow: 0 0 10px rgba(113, 244, 255, 0.3), 0 0 18px rgba(23, 185, 255, 0.14);
            }
            50% {
                text-shadow: 0 0 16px rgba(113, 244, 255, 0.5), 0 0 32px rgba(23, 185, 255, 0.24);
            }
        }

        @keyframes signalBlink {
            0%, 100% { opacity: 0.38; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        @keyframes panelFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @media (max-width: 520px) {
            .glass-panel {
                width: min(94vw, 360px);
                padding: 18px 14px;
                border-radius: 16px;
            }

            .title-badge {
                margin-bottom: 10px;
                font-size: 10px;
                letter-spacing: 0.16em;
            }

            .helper-copy {
                margin-bottom: 14px;
                font-size: 0.84rem;
            }

            #gif-feedback {
                width: min(34vw, 112px);
                bottom: max(84px, env(safe-area-inset-bottom));
            }

            .feedback-gif {
                max-height: 92px;
                border-radius: 12px;
            }

            #hud {
                gap: 8px;
                padding: 7px 10px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="signal-grid" aria-hidden="true"></div>
        <div class="vignette-overlay" aria-hidden="true"></div>
        <div id="gif-feedback" aria-live="polite" aria-atomic="true">
            <img id="event-gif" class="feedback-gif feedback-gif--impact" alt="Transmission surge feedback">
        </div>

        <div id="ui-layer">
            <div id="start-screen" class="glass-panel">
                <div class="title-badge">Beacon Protocol</div>
                <h1 class="display-text title-main pulse-anim">Signal<span class="title-accent">Run</span></h1>
                <p class="body-copy">Pilot a living beacon through the blackout corridor.</p>
                <p class="helper-copy">Tap, click, or press to pulse upward between fracture spikes.</p>
                <div class="status-row" aria-hidden="true">
                    <span class="status-dot"></span>
                    <span>Transmission warming up</span>
                </div>
                <button id="start-btn" class="button-shell" type="button">
                    <span class="button-icon">⚡</span>
                    <span>Start Transmission</span>
                </button>
            </div>

            <div id="game-over-screen" class="glass-panel screen-hidden">
                <div class="title-badge">Signal Report</div>
                <h2 class="display-text title-main">Signal<span class="title-accent">Lost</span></h2>
                <p class="score-summary">Gates Cleared: <span id="finalScore" class="score-value">0</span></p>
                <button id="restart-btn" class="button-shell button-shell--danger" type="button">
                    <span class="button-icon">↻</span>
                    <span>Reconnect</span>
                </button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud-hidden">
                <span class="hud-label">Gates:</span>
                <span id="score" class="hud-score">0</span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                danger: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3"
            },
            gifs: {
                score: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const ENABLE_ANIMATIONS = true;

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = this.createAudio(ASSETS.bgm, { loop: true, volume: 0.2 });
                this.sfx = {};
                this.cooldowns = new Map();
                this.instances = new Set();

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = this.createAudio(src, { preload: 'auto', volume: key === 'jump' ? 0.38 : 0.6 });
                }
            }

            createAudio(src, options = {}) {
                const audio = new Audio(src);
                audio.preload = options.preload || 'metadata';
                audio.loop = Boolean(options.loop);
                audio.volume = options.volume ?? 0.5;
                audio.playsInline = true;
                return audio;
            }

            async unlock() {
                if (this.unlocked) return;
                this.unlocked = true;

                const warmTargets = [this.bgm, ...Object.values(this.sfx)];
                await Promise.allSettled(warmTargets.map(async (audioEl) => {
                    try {
                        audioEl.muted = true;
                        await audioEl.play();
                        audioEl.pause();
                        audioEl.currentTime = 0;
                    } catch (_) {
                        // fail silently to preserve input flow
                    } finally {
                        audioEl.muted = false;
                    }
                }));
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            pauseBGM() {
                this.bgm.pause();
            }

            playSFX(key, options = {}) {
                const source = this.sfx[key];
                if (!source || !this.unlocked) return;

                const now = performance.now();
                const cooldownMs = options.cooldownMs ?? 0;
                const previous = this.cooldowns.get(key) ?? 0;
                if (cooldownMs > 0 && now - previous < cooldownMs) return;
                this.cooldowns.set(key, now);

                const instance = source.cloneNode();
                instance.volume = options.volume ?? source.volume;
                instance.playsInline = true;
                this.instances.add(instance);

                const cleanup = () => {
                    instance.pause();
                    instance.src = '';
                    this.instances.delete(instance);
                };

                instance.addEventListener('ended', cleanup, { once: true });
                instance.addEventListener('error', cleanup, { once: true });
                instance.play().catch(cleanup);
            }

            resetOneShots() {
                this.instances.forEach((instance) => {
                    instance.pause();
                    instance.src = '';
                });
                this.instances.clear();
            }
        }

        const audio = new AudioController();
        const feedbackGif = document.getElementById('event-gif');
        let gifTimer = null;

        function showFeedbackGif(kind) {
            const src = ASSETS.gifs[kind];
            if (!src || !feedbackGif) return;

            feedbackGif.src = src;
            feedbackGif.className = `feedback-gif ${kind === 'fail' ? 'feedback-gif--impact' : 'feedback-gif--boost'} is-visible`;
            clearTimeout(gifTimer);
            gifTimer = window.setTimeout(() => {
                feedbackGif.classList.remove('is-visible');
            }, kind === 'fail' ? 1850 : 1250);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frames = 0;
        let speed = 4;

        // Player
        let player = {
            x: 50,
            y: 0,
            radius: 12,
            velocity: 0,
            gravity: 0.25,
            jump: -5.5
        };

        // Entities
        let obstacles = [];
        let particles = [];
        let backgroundStars = [];
        let fogLayers = [];
        let energyBands = [];

        const colors = {
            beaconCore: '#effbff',
            beaconAura: '#71f4ff',
            beaconFlash: '#ffffff',
            trail: '#17b9ff',
            hazardFill: '#32111e',
            hazardGlow: '#ff537f',
            hazardEdge: '#ff93b0',
            fog: 'rgba(40, 120, 156, 0.18)',
            spark: '#ffd26a'
        };

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.x = width * 0.2;
            initBackground();
        }
        window.addEventListener('resize', resize);

        /** 4. PARALLAX & VISUALS */
        function initBackground() {
            backgroundStars = [];
            for (let i = 0; i < 60; i++) {
                backgroundStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: 0.8 + Math.random() * 2.3,
                    alpha: 0.16 + Math.random() * 0.45,
                    twinkle: Math.random() * Math.PI * 2
                });
            }

            fogLayers = [];
            for (let i = 0; i < 8; i++) {
                fogLayers.push({
                    x: Math.random() * width,
                    y: height * (0.12 + Math.random() * 0.76),
                    w: 150 + Math.random() * 260,
                    h: 60 + Math.random() * 80,
                    speed: 0.35 + Math.random() * 0.8
                });
            }

            energyBands = [];
            for (let i = 0; i < 5; i++) {
                energyBands.push({
                    y: height * (0.14 + i * 0.18),
                    alpha: 0.05 + Math.random() * 0.05,
                    drift: 0.4 + Math.random() * 0.6
                });
            }
        }

        function drawBackground() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#0b1020');
            skyGradient.addColorStop(0.55, '#060b16');
            skyGradient.addColorStop(1, '#020307');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            energyBands.forEach((band, index) => {
                const yShift = Math.sin((frames * 0.01) + index) * 12;
                ctx.fillStyle = `rgba(23, 185, 255, ${band.alpha})`;
                ctx.fillRect(0, band.y + yShift, width, 2);
            });

            backgroundStars.forEach(star => {
                const pulse = 0.75 + Math.sin(frames * 0.03 + star.twinkle) * 0.25;
                ctx.globalAlpha = star.alpha * pulse;
                ctx.fillStyle = '#d7f9ff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            fogLayers.forEach((fog, index) => {
                fog.x -= fog.speed;
                if (fog.x + fog.w < 0) fog.x = width + 30;

                const grad = ctx.createRadialGradient(
                    fog.x + fog.w / 2,
                    fog.y,
                    0,
                    fog.x + fog.w / 2,
                    fog.y,
                    fog.w / 2
                );
                grad.addColorStop(0, index % 2 === 0 ? colors.fog : 'rgba(255, 83, 127, 0.08)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.fillRect(fog.x, fog.y - fog.h / 2, fog.w, fog.h);
            });
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            frames = 0;
            speed = 4;
            player.y = height / 2;
            player.velocity = 0;
            obstacles = [];
            particles = [];
            document.getElementById('score').innerText = score;
            resize();
        }

        function spawnObstacle() {
            const gapHeight = 180;
            const minPipeHeight = 50;
            const maxPipeHeight = height - gapHeight - minPipeHeight;
            const pipeHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1) + minPipeHeight);

            obstacles.push({
                x: width,
                y: 0,
                width: 60,
                height: pipeHeight,
                passed: false,
                type: 'top'
            });

            obstacles.push({
                x: width,
                y: pipeHeight + gapHeight,
                width: 60,
                height: height - (pipeHeight + gapHeight),
                passed: false,
                type: 'bottom'
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1.0,
                    size: 1.5 + Math.random() * 2.4,
                    color: color
                });
            }
        }

        function drawBeacon(x, y, radius) {
            ctx.save();

            const aura = ctx.createRadialGradient(x, y, radius * 0.2, x, y, radius * 2.8);
            aura.addColorStop(0, 'rgba(255,255,255,0.95)');
            aura.addColorStop(0.24, 'rgba(113,244,255,0.95)');
            aura.addColorStop(0.6, 'rgba(23,185,255,0.35)');
            aura.addColorStop(1, 'rgba(23,185,255,0)');

            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(x, y, radius * 2.8, 0, Math.PI * 2);
            ctx.fill();

            const rotation = Math.atan2(player.velocity, 6);
            ctx.translate(x, y);
            ctx.rotate(rotation);

            ctx.shadowBlur = 18;
            ctx.shadowColor = colors.beaconAura;
            ctx.fillStyle = colors.beaconAura;
            ctx.beginPath();
            ctx.moveTo(radius * 1.6, 0);
            ctx.lineTo(-radius * 0.2, -radius * 0.78);
            ctx.lineTo(-radius * 0.2, radius * 0.78);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = colors.beaconCore;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.86, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = colors.beaconFlash;
            ctx.beginPath();
            ctx.arc(radius * 0.2, -radius * 0.22, radius * 0.22, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawHazard(obs) {
            const tipY = obs.type === 'top' ? obs.height : obs.y;
            const baseY = obs.type === 'top' ? 0 : obs.y + obs.height;
            const grad = ctx.createLinearGradient(obs.x, baseY, obs.x, tipY);
            grad.addColorStop(0, '#190712');
            grad.addColorStop(1, colors.hazardFill);

            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(255, 83, 127, 0.22)';
            ctx.fillStyle = grad;
            ctx.strokeStyle = colors.hazardEdge;
            ctx.lineWidth = 2;

            ctx.beginPath();
            if (obs.type === 'top') {
                ctx.moveTo(obs.x, 0);
                ctx.lineTo(obs.x + obs.width, 0);
                ctx.lineTo(obs.x + obs.width / 2, obs.height);
            } else {
                ctx.moveTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            const pulse = 0.14 + ((Math.sin(frames * 0.05 + obs.x * 0.04) + 1) * 0.06);
            ctx.fillStyle = `rgba(255, 147, 176, ${pulse})`;
            ctx.beginPath();
            if (obs.type === 'top') {
                ctx.moveTo(obs.x + 7, 0);
                ctx.lineTo(obs.x + obs.width - 7, 0);
                ctx.lineTo(obs.x + obs.width / 2, obs.height * 0.7);
            } else {
                ctx.moveTo(obs.x + 7, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width - 7, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y + obs.height * 0.3);
            }
            ctx.closePath();
            ctx.fill();
        }

        function drawEntities() {
            obstacles.forEach(drawHazard);

            if (frames % 5 === 0) {
                particles.push({
                    x: player.x - player.radius * 0.5,
                    y: player.y,
                    vx: -1.8 - Math.random() * 0.6,
                    vy: (Math.random() - 0.5) * 1.2,
                    life: 0.8,
                    size: 1.8 + Math.random() * 1.4,
                    color: Math.random() > 0.5 ? colors.trail : colors.spark
                });
            }

            drawBeacon(player.x, player.y, player.radius);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        function checkCollision(obs) {
            if (player.x + player.radius > obs.x &&
                player.x - player.radius < obs.x + obs.width &&
                player.y + player.radius > obs.y &&
                player.y - player.radius < obs.y + obs.height) {

                const padding = 5;
                if (player.x + player.radius - padding > obs.x &&
                    player.x - player.radius + padding < obs.x + obs.width &&
                    player.y + player.radius - padding > obs.y &&
                    player.y - player.radius + padding < obs.y + obs.height) {
                    return true;
                }
            }
            return false;
        }

        function gameLoop() {
            if (!gameActive) return;

            player.velocity += player.gravity;
            player.y += player.velocity;

            if (player.y + player.radius >= height || player.y - player.radius <= 0) {
                gameOver();
                return;
            }

            if (frames % 120 === 0) {
                spawnObstacle();
            }

            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                obs.x -= speed;

                if (checkCollision(obs)) {
                    gameOver();
                    return;
                }

                if (obs.type === 'top' && !obs.passed && obs.x + obs.width < player.x) {
                    score++;
                    obs.passed = true;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', { cooldownMs: 120, volume: 0.56 });
                    createParticles(player.x + 4, player.y, colors.spark);
                    showFeedbackGif('score');
                    if (score % 4 === 3) {
                        audio.playSFX('danger', { cooldownMs: 800, volume: 0.28 });
                    }
                    if (score % 5 === 0) speed += 0.5;
                }
            }

            if (obstacles.length > 0 && obstacles[0].x < -100) {
                obstacles.shift();
            }

            drawBackground();
            drawEntities();

            frames++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { cooldownMs: 500, volume: 0.68 });
            showFeedbackGif('fail');

            createParticles(player.x, player.y, colors.hazardGlow);
            drawBackground();
            drawEntities();

            document.getElementById('hud').classList.add('hud-hidden');
            document.getElementById('game-over-screen').classList.remove('screen-hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (!gameActive) return;
            player.velocity = player.jump;
            createParticles(player.x, player.y + 10, colors.beaconCore);
            audio.playSFX('jump', { cooldownMs: 90, volume: 0.34 });
        }

        /** 6. CONTROLS */
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        async function beginRun() {
            await audio.unlock();
            audio.resetOneShots();
            audio.playSFX('start', { cooldownMs: 150, volume: 0.52 });
            audio.playBGM();
            feedbackGif.classList.remove('is-visible');
            document.getElementById('start-screen').classList.add('screen-hidden');
            document.getElementById('game-over-screen').classList.add('screen-hidden');
            document.getElementById('hud').classList.remove('hud-hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        startBtn.addEventListener('click', beginRun);

        restartBtn.addEventListener('click', beginRun);

        window.addEventListener('mousedown', () => {
            if (gameActive) jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameActive) {
                e.preventDefault();
                jump();
            }
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameActive) {
                    e.preventDefault();
                    jump();
                }
            }
        });

        resize();
        if (ENABLE_ANIMATIONS === false) {
            document.getElementById('start-screen').style.animation = 'none';
        }
    });
    </script>
</body>
</html>
