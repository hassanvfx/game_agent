<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spell Sweep: Wizarding Word Quest</title>
    <!-- [agent-note][world-design-superprompt] resolved-font: title/ui -> Cinzel + Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #120a1c;
            --bg-mid: #241539;
            --bg-soft: #3a214f;
            --panel: rgba(42, 25, 20, 0.82);
            --panel-border: rgba(224, 190, 106, 0.34);
            --panel-glow: rgba(245, 198, 89, 0.16);
            --text-main: #fff1cf;
            --text-soft: #d9c89f;
            --accent: #f5c659;
            --accent-strong: #9dffcc;
            --warning: #c95555;
            --grid-line: rgba(224, 190, 106, 0.2);
            --tile-fill: rgba(61, 37, 28, 0.82);
            --tile-stroke: rgba(244, 213, 128, 0.24);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-deep); font-family: 'Exo 2', system-ui, sans-serif; }
        body { color: var(--text-main); background:
            radial-gradient(circle at 50% 18%, rgba(245, 198, 89, 0.18), transparent 28%),
            radial-gradient(circle at 16% 12%, rgba(157, 255, 204, 0.1), transparent 18%),
            linear-gradient(180deg, #160d22 0%, #2a1936 55%, #100817 100%); }
        #game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; }
        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.28;
            background:
                radial-gradient(circle at 12% 20%, rgba(245,198,89,0.36) 0 1px, transparent 2px),
                radial-gradient(circle at 82% 16%, rgba(157,255,204,0.26) 0 1px, transparent 2px),
                radial-gradient(circle at 28% 74%, rgba(245,198,89,0.22) 0 1px, transparent 2px),
                repeating-linear-gradient(115deg, transparent 0 24px, rgba(245,198,89,0.035) 25px 26px, transparent 27px 56px);
            animation: starDrift 18s linear infinite;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 0; }
        #ui-layer { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; padding: 1rem; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-wrap { flex-wrap: wrap; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .max-w-sm { max-width: 24rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mt-8 { margin-top: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .gap-2 { gap: 0.5rem; }
        .text-center { text-align: center; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-sm { font-size: 0.875rem; }
        .font-black { font-weight: 700; }
        .font-bold { font-weight: 700; }
        .rounded-full { border-radius: 9999px; }
        .shadow-md { box-shadow: 0 4px 10px rgba(0,0,0,0.18); }
        .transform { transform: scale(1); }
        .transition-transform { transition: transform 0.2s ease; }
        .scale-95 { transform: scale(0.95); }
        .select-none { user-select: none; }
        .text-white { color: #fff; }
        
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }

        /* [agent-note][world-design-superprompt] visual-intent: wizarding-school parchment panels | scope: menus,hud | preserve: layout,input */
        .paper-panel {
            background:
                radial-gradient(circle at 16% 10%, rgba(245, 198, 89, 0.17), transparent 32%),
                linear-gradient(180deg, rgba(70, 43, 28, 0.94), rgba(33, 20, 26, 0.9)),
                repeating-linear-gradient(92deg, rgba(255,241,207,0.035) 0 1px, transparent 1px 9px);
            border-radius: 18px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.02) inset,
                0 12px 32px rgba(0,0,0,0.28),
                0 0 18px var(--panel-glow);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .paper-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 8% 12%, rgba(245,198,89,0.24) 0 2px, transparent 3px),
                radial-gradient(circle at 92% 12%, rgba(245,198,89,0.24) 0 2px, transparent 3px),
                linear-gradient(90deg, transparent 0 48%, rgba(245, 198, 89, 0.07) 50%, transparent 52% 100%),
                linear-gradient(180deg, rgba(255,246,213,0.1), transparent 40%);
            pointer-events: none;
        }
        .paper-panel::after {
            content: "✦";
            position: absolute;
            right: 0.65rem;
            bottom: 0.45rem;
            color: rgba(245,198,89,0.28);
            font-size: 1rem;
            pointer-events: none;
        }
        .word-badge {
            transition: transform 0.2s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
            background:
                radial-gradient(circle at 18% 48%, rgba(245,198,89,0.35) 0 3px, transparent 4px),
                linear-gradient(180deg, rgba(87, 51, 31, 0.86), rgba(49, 30, 28, 0.86));
            border: 1px solid rgba(224, 190, 106, 0.32);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 0 10px rgba(245,198,89,0.08);
        }
        .word-badge.found {
            background: linear-gradient(135deg, rgba(245, 198, 89, 0.9), rgba(157, 255, 204, 0.86));
            color: #2a170b;
            text-decoration: line-through;
            opacity: 0.82;
            border-color: rgba(255,255,255,0.18);
            box-shadow: 0 0 14px rgba(98, 218, 255, 0.24);
        }
        .hud-title {
            color: var(--text-main);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-family: 'Cinzel', Georgia, serif;
            text-shadow: 0 0 16px rgba(245, 198, 89, 0.3);
        }
        .hud-meta {
            color: var(--accent-strong);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .instruction-copy {
            margin-top: 0.35rem;
            color: var(--text-soft);
            font-size: 0.84rem;
            line-height: 1.35;
            letter-spacing: 0.05em;
        }
        .overlay-screen {
            background: rgba(4, 9, 18, 0.68);
            backdrop-filter: blur(10px);
            padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
        }
        .panel-copy { color: var(--text-soft); line-height: 1.5; font-size: 1rem; }
        .primary-button {
            background:
                radial-gradient(circle at 22% 18%, rgba(255,255,255,0.42), transparent 22%),
                linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #041520;
            border: 0;
            cursor: pointer;
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 10px 24px rgba(245, 198, 89, 0.28), inset 0 0 0 1px rgba(255,255,255,0.32);
            touch-action: manipulation;
        }
        .primary-button:active { transform: scale(0.95); }
        .signal-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
            padding: 0.28rem 0.65rem;
            border-radius: 999px;
                border: 1px solid rgba(245, 198, 89, 0.22);
                background: rgba(245, 198, 89, 0.09);
            color: var(--accent-strong);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .signal-tag::before {
            content: "◉";
             color: var(--accent);
             text-shadow: 0 0 12px rgba(245, 198, 89, 0.55);
        }
        .hud-scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, rgba(245, 198, 89, 0.08), transparent);
            animation: sweepScan 3.2s linear infinite;
            pointer-events: none;
            opacity: 0.65;
        }
        @keyframes sweepScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes starDrift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-28px, -20px, 0); }
        }
        @media (max-width: 600px) {
            #ui-layer { padding: 0.75rem; }
            #hud { margin-top: 0.5rem; padding: 0.85rem; }
            .text-xl { font-size: 1.08rem; }
            .text-3xl { font-size: 1.65rem; }
            .instruction-copy { font-size: 0.76rem; }
            .word-badge { font-size: 0.8rem; padding: 0.26rem 0.55rem; }
            .panel-copy { font-size: 0.92rem; }
        }
        .feedback-stack {
            position: absolute;
            right: 1rem;
            bottom: max(1rem, env(safe-area-inset-bottom));
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.55rem;
            pointer-events: none;
        }
        .feedback-burst {
            width: min(26vw, 108px);
            max-width: 108px;
            border-radius: 16px;
            border: 1px solid rgba(155, 255, 222, 0.2);
            background: rgba(42, 25, 20, 0.76);
            box-shadow: 0 10px 22px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            object-fit: cover;
        }
        .feedback-burst.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }
        .feedback-caption {
            min-width: 7.5rem;
            max-width: min(48vw, 13rem);
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            background: rgba(42, 25, 20, 0.88);
            border: 1px solid rgba(224, 190, 106, 0.24);
            color: var(--accent-strong);
            font-family: 'Cinzel', Georgia, serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0,0,0,0.24);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 600px) {
            .feedback-stack {
                right: 0.75rem;
                bottom: max(0.75rem, env(safe-area-inset-bottom));
            }
            .feedback-burst {
                width: min(30vw, 92px);
                max-width: 92px;
            }
            .feedback-caption {
                max-width: 10rem;
                font-size: 0.66rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "gridSize": { "type": "number", "label": "Grid Size", "value": 7, "min": 5, "max": 10 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#8BA888" },
        "accentColor": { "type": "color", "label": "Accent Color", "value": "#E0C9A3" }
    }
    </script>
</head>
<body>
    <div id="game-container" class="select-none">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
            
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <!-- HUD -->
            <div id="hud" class="w-full max-w-md mx-auto mt-8 paper-panel p-4 pointer-events-auto">
                <div class="hud-scanline" aria-hidden="true"></div>
                <div class="signal-tag">Charm Board Awake</div>
                <div class="flex justify-between items-center mb-2">
                    <h1 class="text-xl font-black hud-title">Spell Sweep</h1>
                    <span id="level-display" class="text-sm font-bold hud-meta">Lesson 1</span>
                </div>
                <p class="instruction-copy">Drag in a straight line to trace every hidden spell word.</p>
                <div id="word-list" class="flex flex-wrap gap-2">
                    <!-- Words injected here -->
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: fail/win feedback -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
            <div class="feedback-stack" aria-live="polite">
                <img id="fail-gif" class="feedback-burst" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Miscast spark reaction" />
                <img id="win-gif" class="feedback-burst" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Charm complete celebration" />
                <div id="feedback-caption" class="feedback-caption">Charm board awake</div>
            </div>

            <!-- Game Over / Level Complete -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center overlay-screen pointer-events-auto">
                <div id="game-over-panel" class="paper-panel p-8 text-center max-w-sm w-full mx-4 transform transition-transform scale-95">
                    <div class="signal-tag">Charm Sealed</div>
                    <h2 id="result-title" class="text-3xl font-black hud-title mb-2">Lesson Complete</h2>
                    <p id="result-copy" class="panel-copy mb-6">Every spell word is traced. Advance to the next lesson.</p>
                    <button id="restart-btn" class="primary-button w-full py-3 px-6 font-bold rounded-full shadow-md transition-transform">
                        Begin Next Lesson
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Assets -->
    <!-- [agent-note][stage3] resolved-audio: loop/ui/fail/collect/win -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_scan" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
    <audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>

    <script>
        // --- System & Config ---
        let gameConfig = {};
        try {
            const configScript = document.getElementById('game-config').textContent;
            const defs = JSON.parse(configScript);
            for (let key in defs) gameConfig[key] = defs[key].value;
        } catch (e) {
            gameConfig = { gridSize: 7, themeColor: '#8BA888', accentColor: '#E0C9A3' };
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let gameState = 'STARTING'; // STARTING, PLAYING, GAMEOVER
        let lastTime = 0;

        // --- Audio System ---
        let audioCtx = null;
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const audioElements = {
            scan: document.getElementById('sfx_scan'),
            success: document.getElementById('sfx_collect'),
            fail: document.getElementById('sfx_fail'),
            win: document.getElementById('sfx_win')
        };
        const audioState = {
            lastScanAt: 0,
            feedbackTimer: null
        };

        function primeAudioElement(audio, volume) {
            if (!audio) return;
            audio.volume = volume;
            audio.preload = 'auto';
            audio.load();
        }

        function initAudio() {
            if (audioUnlocked) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                audioCtx.resume().catch(() => {});
                bgm.volume = 0.2;
                bgm.play().catch(() => {});
                primeAudioElement(audioElements.scan, 0.4);
                primeAudioElement(audioElements.success, 0.55);
                primeAudioElement(audioElements.fail, 0.45);
                primeAudioElement(audioElements.win, 0.55);
                audioUnlocked = true;
            } catch (e) { console.warn("Audio init failed", e); }
        }

        function playSfx(type) {
            if (!audioUnlocked) return;
            const audio = audioElements[type];
            if (!audio) return;
            try {
                if (type === 'scan') {
                    const now = performance.now();
                    if (now - audioState.lastScanAt < 80) return;
                    audioState.lastScanAt = now;
                }
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch (e) {}
        }

        function vibrate(style = 'light') {
            try {
                window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                    params: { style: style }
                });
            } catch (e) {}
        }

        // --- Game Logic & State ---
        const WORD_BANK = [
            "LUMOS", "NOX", "ACCIO", "WAND", "OWL", "SNITCH", "POTION", "CHARMS",
            "SPELL", "BROOM", "CLOAK", "RAVEN", "HEDWIG", "DUNGEON", "CASTLE", "MUGGLE",
            "GOBLET", "PHOENIX", "RUNE", "QUAFFLE", "WARD", "SCAR", "WIZARD", "MARAUD"
        ];
        
        let level = 1;
        let grid = [];
        let targetWords = [];
        let foundWords = [];
        
        // Grid rendering metrics
        let cellSize = 0;
        let gridOffsetX = 0;
        let gridOffsetY = 0;

        // Interaction state
        let isDragging = false;
        let dragStartCell = null;
        let dragCurrentCell = null;
        let selectedCells = [];
        
        // Visual effects
        let particles = [];
        let shakeTime = 0;
        let bgLeaves = [];
        const failGif = document.getElementById('fail-gif');
        const winGif = document.getElementById('win-gif');
        const feedbackCaption = document.getElementById('feedback-caption');

        function showFeedback(type, text) {
            const activeGif = type === 'win' ? winGif : failGif;
            const idleGif = type === 'win' ? failGif : winGif;
            clearTimeout(audioState.feedbackTimer);
            idleGif.classList.remove('visible');
            activeGif.classList.add('visible');
            feedbackCaption.textContent = text;
            feedbackCaption.classList.add('visible');
            audioState.feedbackTimer = setTimeout(() => {
                activeGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }, type === 'win' ? 2200 : 1400);
        }

        function setState(newState) {
            gameState = newState;
            const goScreen = document.getElementById('game-over-screen');
            const goPanel = document.getElementById('game-over-panel');
            
            if (gameState === 'GAMEOVER') {
                goScreen.classList.remove('hidden');
                setTimeout(() => goPanel.classList.remove('scale-95'), 50);
            } else {
                goScreen.classList.add('hidden');
                goPanel.classList.add('scale-95');
                winGif.classList.remove('visible');
                failGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }
        }

        function generateGrid() {
            const size = gameConfig.gridSize;
            grid = Array(size).fill(null).map(() => Array(size).fill(''));
            targetWords = [];
            foundWords = [];
            
            // Pick words based on level
            const numWords = Math.min(3 + Math.floor(level / 2), 6);
            let availableWords = [...WORD_BANK].sort(() => 0.5 - Math.random());
            
            for (let i = 0; i < numWords && availableWords.length > 0; i++) {
                let word = availableWords.pop();
                if (placeWord(word, size)) {
                    targetWords.push({ word: word, found: false });
                }
            }

            // Fill remaining with random letters
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = letters.charAt(Math.floor(Math.random() * letters.length));
                    }
                }
            }

            updateHUD();
        }

        function placeWord(word, size) {
            const dirs = [[1, 0], [0, 1], [1, 1]]; // Easy mode: Right, Down, Diagonal-Down-Right
            let placed = false;
            let attempts = 0;
            
            while (!placed && attempts < 50) {
                attempts++;
                let dir = dirs[Math.floor(Math.random() * dirs.length)];
                let r = Math.floor(Math.random() * size);
                let c = Math.floor(Math.random() * size);
                
                let endR = r + dir[1] * (word.length - 1);
                let endC = c + dir[0] * (word.length - 1);
                
                if (endR >= 0 && endR < size && endC >= 0 && endC < size) {
                    let canPlace = true;
                    for (let i = 0; i < word.length; i++) {
                        let cr = r + dir[1] * i;
                        let cc = c + dir[0] * i;
                        if (grid[cr][cc] !== '' && grid[cr][cc] !== word[i]) {
                            canPlace = false;
                            break;
                        }
                    }
                    
                    if (canPlace) {
                        for (let i = 0; i < word.length; i++) {
                            grid[r + dir[1] * i][c + dir[0] * i] = word[i];
                        }
                        placed = true;
                    }
                }
            }
            return placed;
        }

        const LESSON_COPY = [
            { title: "First-Year Charms", instruction: "Trace every charm word.", scene: "Candlelit classroom" },
            { title: "Moving Staircases", instruction: "Lock each staircase clue.", scene: "Moonlit castle route" },
            { title: "Forbidden Forest Runes", instruction: "Reveal every forest sign.", scene: "Firefly forest" },
            { title: "Quidditch Storm Practice", instruction: "Stabilize every flight signal.", scene: "Storm practice pitch" },
            { title: "Final Protective Charm", instruction: "Seal every ward word.", scene: "Castle ward ritual" }
        ];

        function getLessonTheme() {
            return LESSON_COPY[(level - 1) % LESSON_COPY.length];
        }

        function updateHUD() {
            const lesson = getLessonTheme();
            document.getElementById('level-display').innerText = `Lesson ${level}`;
            document.querySelector('#hud .signal-tag').innerText = lesson.scene;
            document.querySelector('.instruction-copy').innerText = lesson.instruction;
            const list = document.getElementById('word-list');
            list.innerHTML = '';
            targetWords.forEach(tw => {
                const span = document.createElement('span');
                span.className = `word-badge ${tw.found ? 'found' : ''}`;
                span.innerText = tw.word;
                list.appendChild(span);
            });
        }

        function spawnParticles(cells) {
            cells.forEach(cell => {
                const cx = gridOffsetX + cell.c * cellSize + cellSize/2;
                const cy = gridOffsetY + cell.r * cellSize + cellSize/2;
                for(let i=0; i<3; i++) {
                    particles.push({
                        x: cx, y: cy,
                        vx: (Math.random() - 0.5) * 100,
                        vy: (Math.random() - 0.5) * 100 - 50,
                        life: 1.0,
                        size: Math.random() * 6 + 4,
                        rot: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 5
                    });
                }
            });
        }

        function initBackgroundLeaves() {
            bgLeaves = [];
            const lessonIndex = (level - 1) % 5;
            const motifSets = [
                ["mote", "candle", "star"],
                ["mote", "stair", "portrait"],
                ["mote", "tree", "owl"],
                ["mote", "hoop", "snitch"],
                ["mote", "ward", "star"]
            ];
            for(let i=0; i<24; i++) {
                const kind = motifSets[lessonIndex][i % motifSets[lessonIndex].length];
                bgLeaves.push({
                    kind,
                    x: Math.random() * cw,
                    y: Math.random() * ch,
                    vx: (Math.random() - 0.5) * (kind === "mote" ? 12 : 5),
                    vy: kind === "mote" ? (-8 - Math.random() * 16) : (-2 - Math.random() * 5),
                    size: kind === "mote" ? (2 + Math.random() * 5) : (16 + Math.random() * 26),
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * (kind === "ward" ? 0.55 : 0.22),
                    alpha: kind === "mote" ? (0.18 + Math.random() * 0.22) : (0.08 + Math.random() * 0.13)
                });
            }
        }

        function updateMetrics() {
            const size = gameConfig.gridSize;
            // Leave space for HUD at top (approx 150px) and margin at bottom
            const availWidth = cw * 0.9;
            const availHeight = ch - 200; 
            cellSize = Math.min(availWidth / size, availHeight / size, 60);
            gridOffsetX = (cw - (cellSize * size)) / 2;
            gridOffsetY = 160 + (availHeight - (cellSize * size)) / 2;
        }

        function initGame() {
            generateGrid();
            updateMetrics();
            initBackgroundLeaves();
            setState('PLAYING');
            if(bgm.paused) bgm.play().catch(()=>{});
        }

        function restartGame() {
            level++;
            initGame();
        }

        // --- Input Handling ---
        function getCellFromPos(x, y) {
            if (x < gridOffsetX || y < gridOffsetY) return null;
            const c = Math.floor((x - gridOffsetX) / cellSize);
            const r = Math.floor((y - gridOffsetY) / cellSize);
            if (c >= 0 && c < gameConfig.gridSize && r >= 0 && r < gameConfig.gridSize) {
                return {r, c};
            }
            return null;
        }

        function calculateLine(start, end) {
            let cells = [];
            let dr = end.r - start.r;
            let dc = end.c - start.c;
            
            // Check if valid line (horizontal, vertical, diagonal)
            if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
                let steps = Math.max(Math.abs(dr), Math.abs(dc));
                let stepR = dr === 0 ? 0 : dr / steps;
                let stepC = dc === 0 ? 0 : dc / steps;
                
                for (let i = 0; i <= steps; i++) {
                    cells.push({r: start.r + stepR * i, c: start.c + stepC * i});
                }
            } else {
                // Not a straight line, just select current
                cells.push(end);
            }
            return cells;
        }

        function handlePointerDown(x, y) {
            const cell = getCellFromPos(x, y);
            if (cell) {
                isDragging = true;
                dragStartCell = cell;
                dragCurrentCell = cell;
                selectedCells = [cell];
                playSfx('scan');
                vibrate('light');
            }
        }

        function handlePointerMove(x, y) {
            if (!isDragging) return;
            const cell = getCellFromPos(x, y);
            if (cell && (cell.r !== dragCurrentCell.r || cell.c !== dragCurrentCell.c)) {
                dragCurrentCell = cell;
                selectedCells = calculateLine(dragStartCell, dragCurrentCell);
                playSfx('scan'); // Soft scan tick on move
            }
        }

        function handlePointerUp() {
            if (!isDragging) return;
            isDragging = false;
            
            if (selectedCells.length > 1) {
                // Build string
                let wordStr = selectedCells.map(c => grid[c.r][c.c]).join('');
                let revWordStr = wordStr.split('').reverse().join('');
                
                let found = false;
                for (let tw of targetWords) {
                    if (!tw.found && (tw.word === wordStr || tw.word === revWordStr)) {
                        tw.found = true;
                        foundWords.push(selectedCells);
                        updateHUD();
                        playSfx('success');
                        showFeedback('win', `Spell ${tw.word} sealed`);
                        vibrate('medium');
                        spawnParticles(selectedCells);
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    playSfx('fail');
                    showFeedback('fail', 'Miscast trace');
                    vibrate('light');
                    shakeTime = 0.3; // Shake effect
                }
            }
            selectedCells = [];

            // Check win
            if (targetWords.every(tw => tw.found)) {
                setTimeout(() => {
                    const lesson = getLessonTheme();
                    document.getElementById('result-title').innerText = `${lesson.title} Complete`;
                    document.getElementById('result-copy').innerText = `Every spell word is sealed. Advance to the next lesson.`;
                    playSfx('win');
                    showFeedback('win', 'Lesson complete');
                    vibrate('heavy');
                    setState('GAMEOVER');
                }, 500);
            }
        }

        function handleGlobalInput(e) {
            initAudio();
            if (e.type === 'click' && e.target.id === 'restart-btn') {
                restartGame();
                return;
            }
            
            if (gameState !== 'PLAYING') return;
            
            // Prevent default scrolling on canvas
            if(e.target === canvas) e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (!isFinite(x) || !isFinite(y)) return;

            if (e.type === 'pointerdown') handlePointerDown(x, y);
            else if (e.type === 'pointermove') handlePointerMove(x, y);
            else if (e.type === 'pointerup' || e.type === 'pointercancel') handlePointerUp();
        }

        window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
        window.addEventListener('pointermove', handleGlobalInput, { passive: false });
        window.addEventListener('pointerup', handleGlobalInput, { passive: false });
        window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
        window.addEventListener('blur', () => { try { bgm.pause(); } catch (e) {} });
        document.addEventListener('visibilitychange', () => {
            try {
                if (document.hidden) bgm.pause();
                else if (audioUnlocked && gameState === 'PLAYING') bgm.play().catch(() => {});
            } catch (e) {}
        });
        document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);

        // --- Rendering ---
        // [agent-note][world-design-superprompt] background-plan: replace radar ownership with procedural wizarding-school layers; keep decorative only.
        function drawLeaf(x, y, size, rot, alpha, color) {
            drawWandSpark(x, y, size, rot, alpha, color);
        }

        function drawWandSpark(x, y, size, rot, alpha, color = 'rgba(245, 198, 89, 0.9)') {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(1, size * 0.08);
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(size * 0.24, -size * 0.24);
            ctx.lineTo(size, 0);
            ctx.lineTo(size * 0.24, size * 0.24);
            ctx.lineTo(0, size);
            ctx.lineTo(-size * 0.24, size * 0.24);
            ctx.lineTo(-size, 0);
            ctx.lineTo(-size * 0.24, -size * 0.24);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = alpha * 0.55;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.38, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawCandle(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot * 0.08);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(255, 241, 207, 0.78)';
            ctx.fillRect(-size * 0.12, -size * 0.05, size * 0.24, size * 0.65);
            ctx.fillStyle = 'rgba(245, 198, 89, 0.9)';
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.55);
            ctx.quadraticCurveTo(size * 0.22, -size * 0.25, 0, -size * 0.08);
            ctx.quadraticCurveTo(-size * 0.18, -size * 0.24, 0, -size * 0.55);
            ctx.fill();
            ctx.restore();
        }

        function drawOwl(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.sin(rot) * 0.08);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(255, 241, 207, 0.66)';
            ctx.beginPath();
            ctx.ellipse(0, 0, size * 0.36, size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(18, 8, 28, 0.82)';
            ctx.beginPath();
            ctx.arc(-size * 0.12, -size * 0.1, size * 0.05, 0, Math.PI * 2);
            ctx.arc(size * 0.12, -size * 0.1, size * 0.05, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawStair(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.sin(rot) * 0.12);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = 'rgba(217, 200, 159, 0.72)';
            ctx.lineWidth = Math.max(1, size * 0.06);
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const yy = i * size * 0.16;
                ctx.moveTo(-size * 0.48 + i * size * 0.18, yy);
                ctx.lineTo(size * 0.36 + i * size * 0.18, yy);
                ctx.lineTo(size * 0.36 + i * size * 0.18, yy + size * 0.13);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawTree(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.sin(rot) * 0.05);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = 'rgba(29, 52, 38, 0.9)';
            ctx.lineWidth = Math.max(2, size * 0.1);
            ctx.beginPath();
            ctx.moveTo(0, size * 0.6);
            ctx.lineTo(0, -size * 0.55);
            ctx.moveTo(0, -size * 0.15);
            ctx.lineTo(-size * 0.32, -size * 0.44);
            ctx.moveTo(0, -size * 0.05);
            ctx.lineTo(size * 0.34, -size * 0.34);
            ctx.stroke();
            ctx.restore();
        }

        function drawHoop(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.sin(rot) * 0.08);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = 'rgba(245, 198, 89, 0.78)';
            ctx.lineWidth = Math.max(1, size * 0.07);
            ctx.beginPath();
            ctx.arc(0, -size * 0.18, size * 0.34, 0, Math.PI * 2);
            ctx.moveTo(0, size * 0.16);
            ctx.lineTo(0, size * 0.72);
            ctx.stroke();
            ctx.restore();
        }

        function drawWardRing(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = 'rgba(157, 255, 204, 0.74)';
            ctx.lineWidth = Math.max(1, size * 0.035);
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.48, 0, Math.PI * 2);
            ctx.arc(0, 0, size * 0.28, 0, Math.PI * 2);
            for (let i = 0; i < 6; i++) {
                const a = i * Math.PI / 3;
                ctx.moveTo(Math.cos(a) * size * 0.34, Math.sin(a) * size * 0.34);
                ctx.lineTo(Math.cos(a) * size * 0.5, Math.sin(a) * size * 0.5);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawBackgroundMotif(motif) {
            if (motif.kind === "candle") drawCandle(motif.x, motif.y, motif.size, motif.rot, motif.alpha);
            else if (motif.kind === "owl") drawOwl(motif.x, motif.y, motif.size, motif.rot, motif.alpha);
            else if (motif.kind === "stair" || motif.kind === "portrait") drawStair(motif.x, motif.y, motif.size, motif.rot, motif.alpha);
            else if (motif.kind === "tree") drawTree(motif.x, motif.y, motif.size, motif.rot, motif.alpha);
            else if (motif.kind === "hoop" || motif.kind === "snitch") drawHoop(motif.x, motif.y, motif.size, motif.rot, motif.alpha);
            else if (motif.kind === "ward") drawWardRing(motif.x, motif.y, motif.size, motif.rot, motif.alpha);
            else drawWandSpark(motif.x, motif.y, motif.size, motif.rot, motif.alpha, motif.kind === "star" ? 'rgba(255, 241, 207, 0.82)' : 'rgba(245, 198, 89, 0.78)');
        }

        function drawCastleScene(timestamp) {
            const lessonIndex = (level - 1) % 5;
            const t = timestamp * 0.00008;
            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = lessonIndex === 2 ? 'rgba(15, 39, 28, 0.9)' : 'rgba(16, 10, 26, 0.92)';
            const baseY = ch * 0.76;
            if (lessonIndex === 2) {
                for (let i = 0; i < 9; i++) {
                    const x = (i / 8) * cw + Math.sin(t * 8 + i) * 8;
                    ctx.fillRect(x - 8, baseY - 90 - (i % 3) * 18, 16, 130);
                    ctx.beginPath();
                    ctx.arc(x, baseY - 100 - (i % 3) * 18, 26, Math.PI, 0);
                    ctx.fill();
                }
            } else {
                for (let i = 0; i < 8; i++) {
                    const x = (i / 7) * cw;
                    const w = cw / 12;
                    const h = 80 + (i % 3) * 28;
                    ctx.fillRect(x - w * 0.5, baseY - h, w, h);
                    ctx.beginPath();
                    ctx.arc(x, baseY - h, w * 0.5, Math.PI, 0);
                    ctx.fill();
                    ctx.globalAlpha = 0.12;
                    ctx.fillStyle = 'rgba(245, 198, 89, 0.85)';
                    ctx.fillRect(x - 4, baseY - h + 22, 8, 18);
                    ctx.globalAlpha = 0.2;
                    ctx.fillStyle = lessonIndex === 2 ? 'rgba(15, 39, 28, 0.9)' : 'rgba(16, 10, 26, 0.92)';
                }
            }
            if (lessonIndex === 4) {
                ctx.globalAlpha = 0.13;
                ctx.strokeStyle = 'rgba(157, 255, 204, 0.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cw / 2, baseY, Math.min(cw, ch) * 0.46, Math.PI, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPill(cells, color, alpha) {
            if(cells.length === 0) return;
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            
            if(cells.length === 1) {
                const cx = gridOffsetX + cells[0].c * cellSize + cellSize/2;
                const cy = gridOffsetY + cells[0].r * cellSize + cellSize/2;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize * 0.4, 0, Math.PI*2);
                ctx.fill();
                return;
            }

            const start = cells[0];
            const end = cells[cells.length-1];
            const sx = gridOffsetX + start.c * cellSize + cellSize/2;
            const sy = gridOffsetY + start.r * cellSize + cellSize/2;
            const ex = gridOffsetX + end.c * cellSize + cellSize/2;
            const ey = gridOffsetY + end.r * cellSize + cellSize/2;
            
            const dx = ex - sx;
            const dy = ey - sy;
            const angle = Math.atan2(dy, dx);
            const dist = Math.sqrt(dx*dx + dy*dy);
            const r = Math.max(0, cellSize * 0.4);

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, r, Math.PI/2, Math.PI*1.5);
            ctx.lineTo(dist, -r);
            ctx.arc(dist, 0, r, -Math.PI/2, Math.PI/2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if (!initialized) return;

            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;

            try {
                // Background: procedural wizarding-school layers, decorative only.
                const lessonIndex = (level - 1) % 5;
                ctx.fillStyle = '#120a1c';
                ctx.fillRect(0, 0, cw, ch);
                
                const grad = ctx.createRadialGradient(cw/2, ch*0.28, 0, cw/2, ch/2, cw);
                const palettes = [
                    ['rgba(91, 48, 68, 0.98)', 'rgba(43, 25, 43, 0.98)', 'rgba(18, 8, 28, 1)'],
                    ['rgba(37, 54, 83, 0.98)', 'rgba(28, 30, 55, 0.98)', 'rgba(12, 8, 24, 1)'],
                    ['rgba(28, 61, 46, 0.98)', 'rgba(24, 38, 38, 0.98)', 'rgba(10, 12, 20, 1)'],
                    ['rgba(64, 48, 92, 0.98)', 'rgba(30, 32, 62, 0.98)', 'rgba(12, 9, 25, 1)'],
                    ['rgba(25, 43, 70, 0.98)', 'rgba(24, 18, 48, 0.98)', 'rgba(7, 6, 18, 1)']
                ];
                grad.addColorStop(0, palettes[lessonIndex][0]);
                grad.addColorStop(0.58, palettes[lessonIndex][1]);
                grad.addColorStop(1, palettes[lessonIndex][2]);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                const beam = ctx.createLinearGradient(0, 0, 0, ch);
                beam.addColorStop(0, 'rgba(245, 198, 89, 0.03)');
                beam.addColorStop(0.5, lessonIndex === 2 ? 'rgba(157, 255, 204, 0.1)' : 'rgba(157, 255, 204, 0.07)');
                beam.addColorStop(1, 'rgba(245, 198, 89, 0.025)');
                ctx.fillStyle = beam;
                ctx.fillRect(0, 0, cw, ch);

                drawCastleScene(timestamp);

                // Update & Draw procedural wizarding motifs
                bgLeaves.forEach(l => {
                    l.x += l.vx * dt;
                    l.y += l.vy * dt;
                    l.rot += l.rotSpeed * dt;
                    if(l.y < -l.size || l.x < -l.size || l.x > cw + l.size) {
                        l.y = ch + l.size;
                        l.x = Math.random() * cw;
                    }
                    drawBackgroundMotif(l);
                });

                ctx.globalAlpha = 1.0;

                // Shake effect
                let curOffsetX = gridOffsetX;
                if (shakeTime > 0) {
                    shakeTime -= dt;
                    curOffsetX += Math.sin(shakeTime * 50) * 5;
                }

                // Draw Grid Background (Paper Craft feel)
                const size = gameConfig.gridSize;
                const gridW = size * cellSize;
                const gridH = size * cellSize;
                
                const panelGrad = ctx.createLinearGradient(0, gridOffsetY - 10, 0, gridOffsetY + gridH + 10);
                panelGrad.addColorStop(0, 'rgba(82, 52, 32, 0.92)');
                panelGrad.addColorStop(1, 'rgba(38, 24, 28, 0.92)');
                ctx.fillStyle = panelGrad;
                ctx.shadowColor = 'rgba(245, 198, 89, 0.14)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 8;
                ctx.beginPath();
                ctx.roundRect(curOffsetX - 10, gridOffsetY - 10, gridW + 20, gridH + 20, 18);
                ctx.fill();
                ctx.shadowColor = 'transparent';

                ctx.strokeStyle = 'rgba(224, 190, 106, 0.3)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(curOffsetX - 10, gridOffsetY - 10, gridW + 20, gridH + 20, 18);
                ctx.stroke();

                // Draw Found Words
                foundWords.forEach(wordCells => {
                    drawPill(wordCells, '#f5c659', 0.36);
                });

                // Draw Current Drag
                if (isDragging && selectedCells.length > 0) {
                    drawPill(selectedCells, '#9dffcc', 0.52);
                }

                // Draw Letters
                ctx.globalAlpha = 1.0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `700 ${cellSize * 0.5}px "Exo 2"`;

                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        const cx = curOffsetX + c * cellSize + cellSize/2;
                        const cy = gridOffsetY + r * cellSize + cellSize/2;
                        
                        // Subtle tile background
                        const tileGrad = ctx.createLinearGradient(0, cy - cellSize*0.4, 0, cy + cellSize*0.4);
                        tileGrad.addColorStop(0, 'rgba(92, 61, 38, 0.96)');
                        tileGrad.addColorStop(1, 'rgba(50, 31, 31, 0.96)');
                        ctx.fillStyle = tileGrad;
                        ctx.beginPath();
                        ctx.roundRect(cx - cellSize*0.4, cy - cellSize*0.4, cellSize*0.8, cellSize*0.8, 10);
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(224, 190, 106, 0.2)';
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        ctx.fillStyle = '#fff1cf';
                        ctx.shadowColor = 'rgba(245, 198, 89, 0.24)';
                        ctx.shadowBlur = 10;
                        ctx.fillText(grid[r][c], cx, cy + 2); // slight optical adjustment
                        ctx.shadowBlur = 0;
                    }
                }

                // Update & Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.rot += p.rotSpeed * dt;
                    p.life -= dt * 1.5;
                    
                    if (p.life <= 0 || !isFinite(p.x) || !isFinite(p.y)) {
                        particles.splice(i, 1);
                    } else {
                        drawLeaf(p.x, p.y, p.size, p.rot, p.life, 'rgba(245, 198, 89, 0.9)');
                    }
                }
                ctx.globalAlpha = 1.0;

            } catch (e) {
                console.error("Loop error isolated:", e);
            }
        }

        // --- Initialization ---
        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                const cr = entry.contentRect;
                cw = cr.width;
                ch = cr.height;
                
                canvas.width = cw * dpr;
                canvas.height = ch * dpr;
                canvas.style.width = cw + 'px';
                canvas.style.height = ch + 'px';
                
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                if (!initialized && cw > 0 && ch > 0) {
                    initialized = true;
                    initGame();
                } else if (initialized) {
                    updateMetrics();
                    initBackgroundLeaves();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            ro.observe(canvas);
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
