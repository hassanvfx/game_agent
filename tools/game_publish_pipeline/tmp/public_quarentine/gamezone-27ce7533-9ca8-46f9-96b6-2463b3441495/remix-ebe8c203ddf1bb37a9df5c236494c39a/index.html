<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Signal Wings</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> Orbitron + Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b1f46;
            --bg-mid: #168ad1;
            --bg-soft: #73d7ff;
            --panel: rgba(8, 18, 34, 0.76);
            --panel-border: rgba(255, 226, 122, 0.34);
            --panel-glow: rgba(100, 231, 255, 0.16);
            --text-main: #f4fbff;
            --text-soft: #b8d7e8;
            --accent: #64e7ff;
            --accent-strong: #ffe27a;
            --warning: #ff9f2f;
            --bird-yellow: #ffd84d;
            --pipe-green: #58d86b;
            --pipe-shadow: #146b3a;
            --grid-line: rgba(100, 231, 255, 0.16);
            --tile-fill: rgba(7, 22, 44, 0.9);
            --tile-stroke: rgba(255, 226, 122, 0.16);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-deep); font-family: 'Exo 2', system-ui, sans-serif; }
        body { color: var(--text-main); background:
            radial-gradient(circle at 50% 14%, rgba(255, 242, 199, 0.28), transparent 25%),
            radial-gradient(circle at 14% 22%, rgba(255, 216, 77, 0.13), transparent 18%),
            linear-gradient(180deg, #73d7ff 0%, #1a8bd2 45%, #0b1f46 100%); }
        #game-container { position: relative; width: 100%; height: 100%; user-select: none; }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        #ui-layer { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; padding: 1rem; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-wrap { flex-wrap: wrap; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .max-w-sm { max-width: 24rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mt-8 { margin-top: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .gap-2 { gap: 0.5rem; }
        .text-center { text-align: center; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-sm { font-size: 0.875rem; }
        .font-black { font-weight: 700; }
        .font-bold { font-weight: 700; }
        .rounded-full { border-radius: 9999px; }
        .shadow-md { box-shadow: 0 4px 10px rgba(0,0,0,0.18); }
        .transform { transform: scale(1); }
        .transition-transform { transition: transform 0.2s ease; }
        .scale-95 { transform: scale(0.95); }
        .select-none { user-select: none; }
        .text-white { color: #fff; }
        
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }

        /* [agent-note][stage3] visual-intent: flappy courier radio panels | scope: menus,hud | preserve: mechanics */
        .paper-panel {
            background:
                radial-gradient(circle at 16% 0%, rgba(255, 216, 77, 0.18), transparent 32%),
                linear-gradient(180deg, rgba(8, 31, 70, 0.88), rgba(6, 16, 34, 0.9));
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 12px 32px rgba(0,0,0,0.28),
                0 0 18px var(--panel-glow);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .paper-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 94% 18%, rgba(88, 216, 107, 0.16), transparent 18%),
                repeating-linear-gradient(90deg, transparent 0 26px, rgba(100, 231, 255, 0.045) 27px 28px),
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 40%);
            pointer-events: none;
        }
        .word-badge {
            transition: transform 0.2s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
            background:
                radial-gradient(circle at 18% 25%, rgba(255, 216, 77, 0.16), transparent 30%),
                rgba(7, 22, 44, 0.76);
            border: 1px solid rgba(100, 231, 255, 0.26);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }
        .word-badge.found {
            background: linear-gradient(135deg, rgba(255, 226, 122, 0.94), rgba(100, 231, 255, 0.9));
            color: #062033;
            text-decoration: line-through;
            opacity: 0.9;
            border-color: rgba(255,255,255,0.22);
            box-shadow: 0 0 14px rgba(255, 216, 77, 0.26), 0 0 20px rgba(100, 231, 255, 0.16);
        }
        .hud-title {
            color: var(--text-main);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-family: 'Orbitron', system-ui, sans-serif;
            text-shadow: 0 0 16px rgba(98, 218, 255, 0.28);
        }
        .hud-meta {
            color: var(--accent-strong);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .instruction-copy {
            margin-top: 0.35rem;
            color: var(--text-soft);
            font-size: 0.84rem;
            line-height: 1.35;
            letter-spacing: 0.05em;
        }
        .overlay-screen {
            background: rgba(4, 9, 18, 0.68);
            backdrop-filter: blur(10px);
            padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
        }
        .panel-copy { color: var(--text-soft); line-height: 1.5; font-size: 1rem; }
        .primary-button {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #041520;
            border: 0;
            cursor: pointer;
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 10px 24px rgba(98, 218, 255, 0.28);
            touch-action: manipulation;
        }
        .primary-button:active { transform: scale(0.95); }
        .signal-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.48rem;
            margin-bottom: 0.5rem;
            padding: 0.28rem 0.65rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 226, 122, 0.24);
            background: rgba(255, 226, 122, 0.09);
            color: var(--accent-strong);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .signal-tag::before {
            content: "";
            width: 1.1rem;
            height: 0.84rem;
            display: inline-block;
            border-radius: 58% 48% 52% 58%;
            background:
                radial-gradient(circle at 70% 34%, #061426 0 9%, transparent 10%),
                radial-gradient(circle at 27% 25%, rgba(255,255,255,0.8), transparent 19%),
                linear-gradient(135deg, var(--bird-yellow), #ffb63f);
            box-shadow:
                0.56rem 0.08rem 0 -0.33rem var(--warning),
                -0.18rem 0.08rem 0 -0.18rem rgba(255,255,255,0.54),
                0 0 12px rgba(255, 216, 77, 0.42);
            transform-origin: center;
            animation: wingTag 1.8s ease-in-out infinite;
        }
        .hud-scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, rgba(98, 218, 255, 0.06), transparent);
            animation: sweepScan 3.2s linear infinite;
            pointer-events: none;
            opacity: 0.65;
        }
        @keyframes sweepScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes wingTag {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-1px) rotate(4deg); }
        }
        @media (max-width: 600px) {
            #ui-layer { padding: 0.75rem; }
            #hud { margin-top: 0.5rem; padding: 0.85rem; }
            .text-xl { font-size: 1.08rem; }
            .text-3xl { font-size: 1.65rem; }
            .instruction-copy { font-size: 0.76rem; }
            .word-badge { font-size: 0.8rem; padding: 0.26rem 0.55rem; }
            .panel-copy { font-size: 0.92rem; }
        }
        .feedback-stack {
            position: absolute;
            right: 1rem;
            bottom: max(1rem, env(safe-area-inset-bottom));
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.55rem;
            pointer-events: none;
        }
        .feedback-burst {
            width: min(26vw, 108px);
            max-width: 108px;
            border-radius: 16px;
            border: 1px solid rgba(155, 255, 222, 0.2);
            background: rgba(6, 14, 28, 0.72);
            box-shadow: 0 10px 22px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            object-fit: cover;
        }
        .feedback-burst.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }
        .feedback-caption {
            min-width: 7.5rem;
            max-width: min(48vw, 13rem);
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            background: rgba(7, 18, 34, 0.84);
            border: 1px solid rgba(125, 232, 255, 0.18);
            color: var(--accent-strong);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0,0,0,0.24);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 600px) {
            .feedback-stack {
                right: 0.75rem;
                bottom: max(0.75rem, env(safe-area-inset-bottom));
            }
            .feedback-burst {
                width: min(30vw, 92px);
                max-width: 92px;
            }
            .feedback-caption {
                max-width: 10rem;
                font-size: 0.66rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "gridSize": { "type": "number", "label": "Grid Size", "value": 7, "min": 5, "max": 10 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#8BA888" },
        "accentColor": { "type": "color", "label": "Accent Color", "value": "#E0C9A3" }
    }
    </script>
</head>
<body>
    <div id="game-container" class="select-none">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
            
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <!-- HUD -->
            <div id="hud" class="w-full max-w-md mx-auto mt-8 paper-panel p-4 pointer-events-auto">
                <div class="hud-scanline" aria-hidden="true"></div>
                <div class="signal-tag">Flight Calls Online</div>
                <div class="flex justify-between items-center mb-2">
                    <h1 class="text-xl font-black hud-title">Flappy Signal Wings</h1>
                    <span id="level-display" class="text-sm font-bold hud-meta">Sector 1</span>
                </div>
                <p class="instruction-copy">Drag across letters to chart every hidden flight call.</p>
                <div id="word-list" class="flex flex-wrap gap-2">
                    <!-- Words injected here -->
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: fail/win feedback -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
            <div class="feedback-stack" aria-live="polite">
                <img id="fail-gif" class="feedback-burst" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Pipe turbulence reaction" />
                <img id="win-gif" class="feedback-burst" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Flight gate clear celebration" />
                <div id="feedback-caption" class="feedback-caption">Flight calls online</div>
            </div>

            <!-- Game Over / Level Complete -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center overlay-screen pointer-events-auto">
                <div id="game-over-panel" class="paper-panel p-8 text-center max-w-sm w-full mx-4 transform transition-transform scale-95">
                    <div class="signal-tag">Sky Gate Open</div>
                    <h2 id="result-title" class="text-3xl font-black hud-title mb-2">Gate Clear</h2>
                    <p id="result-copy" class="panel-copy mb-6">Every flight call is locked. Fly to the next gate.</p>
                    <button id="restart-btn" class="primary-button w-full py-3 px-6 font-bold rounded-full shadow-md transition-transform">
                        Fly Next Gate
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Assets -->
    <!-- [agent-note][stage3] resolved-audio: loop/ui/fail/collect/win -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/bgm/joyful_bgm_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_scan" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3" preload="auto"></audio>
    <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_01.mp3" preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_enemy_01.mp3" preload="auto"></audio>
    <audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/sfx/triumphant_item_01.mp3" preload="auto"></audio>

    <script>
        // --- System & Config ---
        let gameConfig = {};
        try {
            const configScript = document.getElementById('game-config').textContent;
            const defs = JSON.parse(configScript);
            for (let key in defs) gameConfig[key] = defs[key].value;
        } catch (e) {
            gameConfig = { gridSize: 7, themeColor: '#8BA888', accentColor: '#E0C9A3' };
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let gameState = 'STARTING'; // STARTING, PLAYING, GAMEOVER
        let lastTime = 0;

        // --- Audio System ---
        let audioCtx = null;
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const audioElements = {
            scan: document.getElementById('sfx_scan'),
            success: document.getElementById('sfx_collect'),
            fail: document.getElementById('sfx_fail'),
            win: document.getElementById('sfx_win')
        };
        const audioState = {
            lastScanAt: 0,
            feedbackTimer: null
        };

        function primeAudioElement(audio, volume) {
            if (!audio) return;
            audio.volume = volume;
            audio.preload = 'auto';
            audio.load();
        }

        function initAudio() {
            if (audioUnlocked) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                audioCtx.resume().catch(() => {});
                bgm.volume = 0.2;
                bgm.play().catch(() => {});
                primeAudioElement(audioElements.scan, 0.4);
                primeAudioElement(audioElements.success, 0.55);
                primeAudioElement(audioElements.fail, 0.45);
                primeAudioElement(audioElements.win, 0.55);
                audioUnlocked = true;
            } catch (e) { console.warn("Audio init failed", e); }
        }

        function playSfx(type) {
            if (!audioUnlocked) return;
            const audio = audioElements[type];
            if (!audio) return;
            try {
                if (type === 'scan') {
                    const now = performance.now();
                    if (now - audioState.lastScanAt < 80) return;
                    audioState.lastScanAt = now;
                }
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch (e) {}
        }

        function vibrate(style = 'light') {
            try {
                window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                    params: { style: style }
                });
            } catch (e) {}
        }

        // --- Game Logic & State ---
        const WORD_BANK = [
            "BIRD", "WING", "SKY", "CLOUD", "PIPE", "GATE", "NEST", "FLAP",
            "ROUTE", "CALL", "FEATHER", "BEACON", "STORM", "RADIO", "THERMAL", "GLIDE",
            "DRIFT", "WIND", "SUN", "RAIN", "DUSK", "DAWN", "AIR", "SOAR"
        ];
        
        let level = 1;
        let grid = [];
        let targetWords = [];
        let foundWords = [];
        
        // Grid rendering metrics
        let cellSize = 0;
        let gridOffsetX = 0;
        let gridOffsetY = 0;

        // Interaction state
        let isDragging = false;
        let dragStartCell = null;
        let dragCurrentCell = null;
        let selectedCells = [];
        
        // Visual effects
        let particles = [];
        let shakeTime = 0;
        let bgLeaves = [];
        const failGif = document.getElementById('fail-gif');
        const winGif = document.getElementById('win-gif');
        const feedbackCaption = document.getElementById('feedback-caption');

        function showFeedback(type, text) {
            const activeGif = type === 'win' ? winGif : failGif;
            const idleGif = type === 'win' ? failGif : winGif;
            clearTimeout(audioState.feedbackTimer);
            idleGif.classList.remove('visible');
            activeGif.classList.add('visible');
            feedbackCaption.textContent = text;
            feedbackCaption.classList.add('visible');
            audioState.feedbackTimer = setTimeout(() => {
                activeGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }, type === 'win' ? 2200 : 1400);
        }

        function setState(newState) {
            gameState = newState;
            const goScreen = document.getElementById('game-over-screen');
            const goPanel = document.getElementById('game-over-panel');
            
            if (gameState === 'GAMEOVER') {
                goScreen.classList.remove('hidden');
                setTimeout(() => goPanel.classList.remove('scale-95'), 50);
            } else {
                goScreen.classList.add('hidden');
                goPanel.classList.add('scale-95');
                winGif.classList.remove('visible');
                failGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }
        }

        function generateGrid() {
            const size = gameConfig.gridSize;
            grid = Array(size).fill(null).map(() => Array(size).fill(''));
            targetWords = [];
            foundWords = [];
            
            // Pick words based on level
            const numWords = Math.min(3 + Math.floor(level / 2), 6);
            let availableWords = [...WORD_BANK].sort(() => 0.5 - Math.random());
            
            for (let i = 0; i < numWords && availableWords.length > 0; i++) {
                let word = availableWords.pop();
                if (placeWord(word, size)) {
                    targetWords.push({ word: word, found: false });
                }
            }

            // Fill remaining with random letters
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = letters.charAt(Math.floor(Math.random() * letters.length));
                    }
                }
            }

            updateHUD();
        }

        function placeWord(word, size) {
            const dirs = [[1, 0], [0, 1], [1, 1]]; // Easy mode: Right, Down, Diagonal-Down-Right
            let placed = false;
            let attempts = 0;
            
            while (!placed && attempts < 50) {
                attempts++;
                let dir = dirs[Math.floor(Math.random() * dirs.length)];
                let r = Math.floor(Math.random() * size);
                let c = Math.floor(Math.random() * size);
                
                let endR = r + dir[1] * (word.length - 1);
                let endC = c + dir[0] * (word.length - 1);
                
                if (endR >= 0 && endR < size && endC >= 0 && endC < size) {
                    let canPlace = true;
                    for (let i = 0; i < word.length; i++) {
                        let cr = r + dir[1] * i;
                        let cc = c + dir[0] * i;
                        if (grid[cr][cc] !== '' && grid[cr][cc] !== word[i]) {
                            canPlace = false;
                            break;
                        }
                    }
                    
                    if (canPlace) {
                        for (let i = 0; i < word.length; i++) {
                            grid[r + dir[1] * i][c + dir[0] * i] = word[i];
                        }
                        placed = true;
                    }
                }
            }
            return placed;
        }

        function updateHUD() {
            document.getElementById('level-display').innerText = `Sector ${level}`;
            const list = document.getElementById('word-list');
            list.innerHTML = '';
            targetWords.forEach(tw => {
                const span = document.createElement('span');
                span.className = `word-badge ${tw.found ? 'found' : ''}`;
                span.innerText = tw.word;
                list.appendChild(span);
            });
        }

        function spawnParticles(cells) {
            cells.forEach(cell => {
                const cx = gridOffsetX + cell.c * cellSize + cellSize/2;
                const cy = gridOffsetY + cell.r * cellSize + cellSize/2;
                for(let i=0; i<3; i++) {
                    particles.push({
                        x: cx, y: cy,
                        vx: (Math.random() - 0.5) * 100,
                        vy: (Math.random() - 0.5) * 100 - 50,
                        life: 1.0,
                        size: Math.random() * 6 + 4,
                        rot: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 5
                    });
                }
            });
        }

        function initBackgroundLeaves() {
            bgLeaves = [];
            const count = Math.min(18 + level * 2, 28);
            for(let i=0; i<count; i++) {
                bgLeaves.push({
                    x: Math.random() * cw,
                    y: Math.random() * ch,
                    vx: -8 - Math.random() * 18,
                    vy: -6 - Math.random() * 16,
                    size: 7 + Math.random() * 14,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 1.4,
                    alpha: 0.08 + Math.random() * 0.18
                });
            }
        }

        function updateMetrics() {
            const size = gameConfig.gridSize;
            // Leave space for HUD at top (approx 150px) and margin at bottom
            const availWidth = cw * 0.9;
            const availHeight = ch - 200; 
            cellSize = Math.min(availWidth / size, availHeight / size, 60);
            gridOffsetX = (cw - (cellSize * size)) / 2;
            gridOffsetY = 160 + (availHeight - (cellSize * size)) / 2;
        }

        function initGame() {
            generateGrid();
            updateMetrics();
            initBackgroundLeaves();
            setState('PLAYING');
            if(bgm.paused) bgm.play().catch(()=>{});
        }

        function restartGame() {
            level++;
            initGame();
        }

        // --- Input Handling ---
        function getCellFromPos(x, y) {
            if (x < gridOffsetX || y < gridOffsetY) return null;
            const c = Math.floor((x - gridOffsetX) / cellSize);
            const r = Math.floor((y - gridOffsetY) / cellSize);
            if (c >= 0 && c < gameConfig.gridSize && r >= 0 && r < gameConfig.gridSize) {
                return {r, c};
            }
            return null;
        }

        function calculateLine(start, end) {
            let cells = [];
            let dr = end.r - start.r;
            let dc = end.c - start.c;
            
            // Check if valid line (horizontal, vertical, diagonal)
            if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
                let steps = Math.max(Math.abs(dr), Math.abs(dc));
                let stepR = dr === 0 ? 0 : dr / steps;
                let stepC = dc === 0 ? 0 : dc / steps;
                
                for (let i = 0; i <= steps; i++) {
                    cells.push({r: start.r + stepR * i, c: start.c + stepC * i});
                }
            } else {
                // Not a straight line, just select current
                cells.push(end);
            }
            return cells;
        }

        function handlePointerDown(x, y) {
            const cell = getCellFromPos(x, y);
            if (cell) {
                isDragging = true;
                dragStartCell = cell;
                dragCurrentCell = cell;
                selectedCells = [cell];
                playSfx('scan');
                vibrate('light');
            }
        }

        function handlePointerMove(x, y) {
            if (!isDragging) return;
            const cell = getCellFromPos(x, y);
            if (cell && (cell.r !== dragCurrentCell.r || cell.c !== dragCurrentCell.c)) {
                dragCurrentCell = cell;
                selectedCells = calculateLine(dragStartCell, dragCurrentCell);
                playSfx('scan'); // Soft scan tick on move
            }
        }

        function handlePointerUp() {
            if (!isDragging) return;
            isDragging = false;
            
            if (selectedCells.length > 1) {
                // Build string
                let wordStr = selectedCells.map(c => grid[c.r][c.c]).join('');
                let revWordStr = wordStr.split('').reverse().join('');
                
                let found = false;
                for (let tw of targetWords) {
                    if (!tw.found && (tw.word === wordStr || tw.word === revWordStr)) {
                        tw.found = true;
                        foundWords.push(selectedCells);
                        updateHUD();
                        playSfx('success');
                        showFeedback('win', `Flight call ${tw.word} locked`);
                        vibrate('medium');
                        spawnParticles(selectedCells);
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    playSfx('fail');
                    showFeedback('fail', 'Pipe turbulence');
                    vibrate('light');
                    shakeTime = 0.3; // Shake effect
                }
            }
            selectedCells = [];

            // Check win
            if (targetWords.every(tw => tw.found)) {
                setTimeout(() => {
                    playSfx('win');
                    showFeedback('win', 'Gate clear');
                    vibrate('heavy');
                    setState('GAMEOVER');
                }, 500);
            }
        }

        function handleGlobalInput(e) {
            initAudio();
            if (e.type === 'click' && e.target.id === 'restart-btn') {
                restartGame();
                return;
            }
            
            if (gameState !== 'PLAYING') return;
            
            // Prevent default scrolling on canvas
            if(e.target === canvas) e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (!isFinite(x) || !isFinite(y)) return;

            if (e.type === 'pointerdown') handlePointerDown(x, y);
            else if (e.type === 'pointermove') handlePointerMove(x, y);
            else if (e.type === 'pointerup' || e.type === 'pointercancel') handlePointerUp();
        }

        window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
        window.addEventListener('pointermove', handleGlobalInput, { passive: false });
        window.addEventListener('pointerup', handleGlobalInput, { passive: false });
        window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
        window.addEventListener('blur', () => { try { bgm.pause(); } catch (e) {} });
        document.addEventListener('visibilitychange', () => {
            try {
                if (document.hidden) bgm.pause();
                else if (audioUnlocked && gameState === 'PLAYING') bgm.play().catch(() => {});
            } catch (e) {}
        });
        document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);

        // --- Rendering ---
        function drawLeaf(x, y, size, rot, alpha, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            // Feather/wing-teardrop motif; cosmetic only.
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(size * 0.78, -size * 0.32, size * 0.12, size);
            ctx.quadraticCurveTo(-size * 0.72, -size * 0.08, 0, -size);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.lineWidth = Math.max(1, size * 0.08);
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.62);
            ctx.lineTo(size * 0.06, size * 0.62);
            ctx.stroke();
            ctx.restore();
        }

        function drawCloud(x, y, scale, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(255, 242, 199, 0.82)';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.22)';
            ctx.shadowBlur = 16 * scale;
            ctx.beginPath();
            ctx.arc(x, y, 18 * scale, Math.PI, 0);
            ctx.arc(x + 19 * scale, y - 10 * scale, 21 * scale, Math.PI, 0);
            ctx.arc(x + 44 * scale, y, 17 * scale, Math.PI, 0);
            ctx.lineTo(x + 61 * scale, y + 15 * scale);
            ctx.lineTo(x - 20 * scale, y + 15 * scale);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawPipeGate(x, y, width, height, flip, t, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            const bob = Math.sin(t * 0.0015 + x * 0.01) * 5;
            const top = flip ? y - height + bob : y + bob;
            const pipeGrad = ctx.createLinearGradient(x, 0, x + width, 0);
            pipeGrad.addColorStop(0, '#146b3a');
            pipeGrad.addColorStop(0.38, '#58d86b');
            pipeGrad.addColorStop(1, '#1d8a49');
            ctx.fillStyle = pipeGrad;
            ctx.strokeStyle = 'rgba(5, 49, 27, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, top, width, height, 12);
            ctx.fill();
            ctx.stroke();
            const rimY = flip ? top + height - 20 : top;
            ctx.fillStyle = '#70ef82';
            ctx.beginPath();
            ctx.roundRect(x - 8, rimY, width + 16, 24, 10);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.16)';
            ctx.fillRect(x + width * 0.18, top + 12, Math.max(3, width * 0.08), Math.max(20, height - 34));
            ctx.restore();
        }

        function drawCheckpointRing(x, y, radius, alpha, t) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(t * 0.00035);
            ctx.strokeStyle = 'rgba(255, 226, 122, 0.72)';
            ctx.lineWidth = 3;
            ctx.shadowColor = 'rgba(255, 216, 77, 0.28)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.25, radius * 0.58, -0.24, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(100, 231, 255, 0.42)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.72, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawCourierBird(x, y, scale, t) {
            ctx.save();
            ctx.translate(x, y + Math.sin(t * 0.003) * 4);
            ctx.scale(scale, scale);
            ctx.rotate(Math.sin(t * 0.002) * 0.06);
            ctx.shadowColor = 'rgba(255, 216, 77, 0.34)';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ffd84d';
            ctx.beginPath();
            ctx.ellipse(0, 0, 24, 19, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff2c7';
            ctx.beginPath();
            ctx.ellipse(-5, 5, 13, 9, -0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff9f2f';
            ctx.beginPath();
            ctx.moveTo(22, -2);
            ctx.lineTo(39, 4);
            ctx.lineTo(22, 10);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#061426';
            ctx.beginPath();
            ctx.arc(10, -7, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(11, -8, 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.save();
            ctx.translate(-15, 2);
            ctx.rotate(-0.9 + Math.sin(t * 0.008) * 0.22);
            ctx.fillStyle = '#ffbe45';
            ctx.beginPath();
            ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            ctx.restore();
        }

        function drawSkyBackground(timestamp) {
            const phase = Math.min(level, 5);
            const palettes = [
                ['#73d7ff', '#1c95d8', '#0b1f46'],
                ['#7edfff', '#239bd7', '#0e3e74'],
                ['#ffc76a', '#ff8d48', '#122a5a'],
                ['#172b68', '#141a4a', '#070d23'],
                ['#141a4a', '#0b1f46', '#06101f']
            ];
            const pal = palettes[phase - 1] || palettes[4];
            const sky = ctx.createLinearGradient(0, 0, 0, ch);
            sky.addColorStop(0, pal[0]);
            sky.addColorStop(0.52, pal[1]);
            sky.addColorStop(1, pal[2]);
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, cw, ch);

            const sunX = cw * (phase < 4 ? 0.18 : 0.78);
            const sunY = ch * (phase < 4 ? 0.24 : 0.18);
            const sun = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.min(cw, ch) * 0.34);
            sun.addColorStop(0, phase < 4 ? 'rgba(255, 242, 199, 0.56)' : 'rgba(100, 231, 255, 0.22)');
            sun.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = sun;
            ctx.fillRect(0, 0, cw, ch);

            const drift = (timestamp * 0.012) % (cw + 180);
            drawCloud(-60 + drift * 0.35, ch * 0.24, 1.12, 0.38);
            drawCloud(cw - ((drift * 0.22) % (cw + 160)), ch * 0.40, 0.82, 0.32);
            drawCloud((drift * 0.48) % (cw + 180) - 90, ch * 0.68, 1.05, 0.20);

            const pipeAlpha = phase >= 2 ? 0.52 : 0.28;
            drawPipeGate(18, ch * 0.50, Math.max(38, cw * 0.09), ch * 0.34, false, timestamp, pipeAlpha);
            drawPipeGate(cw - Math.max(56, cw * 0.11), ch * 0.50, Math.max(38, cw * 0.09), ch * 0.32, true, timestamp, pipeAlpha);
            if (phase >= 4) {
                drawPipeGate(cw * 0.08, ch * 0.98, Math.max(32, cw * 0.07), ch * 0.24, true, timestamp + 700, 0.34);
                drawPipeGate(cw * 0.84, ch * 0.70, Math.max(32, cw * 0.07), ch * 0.26, false, timestamp + 1200, 0.34);
            }

            if (phase >= 3) {
                drawCheckpointRing(cw * 0.22, gridOffsetY + 32, 28, 0.35, timestamp);
                drawCheckpointRing(cw * 0.78, gridOffsetY + Math.max(80, cellSize * 4.8), 24, 0.28, timestamp + 600);
            }

            drawCourierBird(Math.min(cw - 72, gridOffsetX + cellSize * 0.75), Math.max(104, gridOffsetY - 38), Math.min(0.68, Math.max(0.48, cw / 700)), timestamp);
        }

        function drawPill(cells, color, alpha) {
            if(cells.length === 0) return;
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            
            if(cells.length === 1) {
                const cx = gridOffsetX + cells[0].c * cellSize + cellSize/2;
                const cy = gridOffsetY + cells[0].r * cellSize + cellSize/2;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize * 0.4, 0, Math.PI*2);
                ctx.fill();
                return;
            }

            const start = cells[0];
            const end = cells[cells.length-1];
            const sx = gridOffsetX + start.c * cellSize + cellSize/2;
            const sy = gridOffsetY + start.r * cellSize + cellSize/2;
            const ex = gridOffsetX + end.c * cellSize + cellSize/2;
            const ey = gridOffsetY + end.r * cellSize + cellSize/2;
            
            const dx = ex - sx;
            const dy = ey - sy;
            const angle = Math.atan2(dy, dx);
            const dist = Math.sqrt(dx*dx + dy*dy);
            const r = Math.max(0, cellSize * 0.4);

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, r, Math.PI/2, Math.PI*1.5);
            ctx.lineTo(dist, -r);
            ctx.arc(dist, 0, r, -Math.PI/2, Math.PI/2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if (!initialized) return;

            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;

            try {
                // Procedural Flappy Bird-inspired sky route background.
                drawSkyBackground(timestamp);

                // Update & Draw ambient feather particles
                bgLeaves.forEach(l => {
                    l.x += l.vx * dt;
                    l.y += l.vy * dt;
                    l.rot += l.rotSpeed * dt;
                    if(l.y < -l.size || l.x < -l.size) {
                        l.y = ch + l.size;
                        l.x = cw + Math.random() * 80;
                    }
                    drawLeaf(l.x, l.y, l.size, l.rot, l.alpha, level >= 5 ? 'rgba(100, 231, 255, 0.82)' : 'rgba(255, 226, 122, 0.86)');
                });

                ctx.globalAlpha = 1.0;

                // Shake effect
                let curOffsetX = gridOffsetX;
                if (shakeTime > 0) {
                    shakeTime -= dt;
                    curOffsetX += Math.sin(shakeTime * 50) * 5;
                }

                // Draw Grid Background (Paper Craft feel)
                const size = gameConfig.gridSize;
                const gridW = size * cellSize;
                const gridH = size * cellSize;
                
                const panelGrad = ctx.createLinearGradient(0, gridOffsetY - 10, 0, gridOffsetY + gridH + 10);
                panelGrad.addColorStop(0, 'rgba(8, 31, 70, 0.92)');
                panelGrad.addColorStop(1, 'rgba(5, 14, 28, 0.94)');
                ctx.fillStyle = panelGrad;
                ctx.shadowColor = 'rgba(255, 216, 77, 0.12)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 8;
                ctx.beginPath();
                ctx.roundRect(curOffsetX - 10, gridOffsetY - 10, gridW + 20, gridH + 20, 18);
                ctx.fill();
                ctx.shadowColor = 'transparent';

                ctx.strokeStyle = 'rgba(255, 226, 122, 0.28)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(curOffsetX - 10, gridOffsetY - 10, gridW + 20, gridH + 20, 18);
                ctx.stroke();

                // Draw Found Words
                foundWords.forEach(wordCells => {
                    drawPill(wordCells, '#ffe27a', 0.38);
                    drawPill(wordCells, '#64e7ff', 0.18);
                });

                // Draw Current Drag
                if (isDragging && selectedCells.length > 0) {
                    drawPill(selectedCells, '#64e7ff', 0.54);
                }

                // Draw Letters
                ctx.globalAlpha = 1.0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `700 ${cellSize * 0.5}px "Exo 2"`;

                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        const cx = curOffsetX + c * cellSize + cellSize/2;
                        const cy = gridOffsetY + r * cellSize + cellSize/2;
                        
                        // Subtle tile background
                        const tileGrad = ctx.createLinearGradient(0, cy - cellSize*0.4, 0, cy + cellSize*0.4);
                        tileGrad.addColorStop(0, 'rgba(13, 43, 84, 0.97)');
                        tileGrad.addColorStop(1, 'rgba(7, 22, 44, 0.97)');
                        ctx.fillStyle = tileGrad;
                        ctx.beginPath();
                        ctx.roundRect(cx - cellSize*0.4, cy - cellSize*0.4, cellSize*0.8, cellSize*0.8, 10);
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(255, 226, 122, 0.16)';
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        ctx.fillStyle = '#f4fbff';
                        ctx.shadowColor = 'rgba(100, 231, 255, 0.22)';
                        ctx.shadowBlur = 10;
                        ctx.fillText(grid[r][c], cx, cy + 2); // slight optical adjustment
                        ctx.shadowBlur = 0;
                    }
                }

                // Update & Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.rot += p.rotSpeed * dt;
                    p.life -= dt * 1.5;
                    
                    if (p.life <= 0 || !isFinite(p.x) || !isFinite(p.y)) {
                        particles.splice(i, 1);
                    } else {
                        drawLeaf(p.x, p.y, p.size, p.rot, p.life, 'rgba(255, 226, 122, 0.95)');
                    }
                }
                ctx.globalAlpha = 1.0;

            } catch (e) {
                console.error("Loop error isolated:", e);
            }
        }

        // --- Initialization ---
        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                const cr = entry.contentRect;
                cw = cr.width;
                ch = cr.height;
                
                canvas.width = cw * dpr;
                canvas.height = ch * dpr;
                canvas.style.width = cw + 'px';
                canvas.style.height = ch + 'px';
                
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                if (!initialized && cw > 0 && ch > 0) {
                    initialized = true;
                    initGame();
                } else if (initialized) {
                    updateMetrics();
                    initBackgroundLeaves();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            ro.observe(canvas);
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
