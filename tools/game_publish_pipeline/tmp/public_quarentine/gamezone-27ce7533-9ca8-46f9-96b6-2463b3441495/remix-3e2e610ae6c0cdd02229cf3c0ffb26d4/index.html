<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mom Brainrot 3D: Bouquet Sweep</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> Orbitron + Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #2a1038;
            --bg-mid: #6f2d7a;
            --bg-soft: #ff9fca;
            --panel: rgba(58, 18, 61, 0.78);
            --panel-border: rgba(255, 214, 102, 0.34);
            --panel-glow: rgba(255, 114, 182, 0.18);
            --text-main: #fff6fb;
            --text-soft: #ffd6e8;
            --accent: #ff72b6;
            --accent-strong: #ffd966;
            --warning: #ff8c7a;
            --grid-line: rgba(255, 214, 102, 0.16);
            --tile-fill: rgba(74, 22, 78, 0.88);
            --tile-stroke: rgba(255, 214, 102, 0.18);
        }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-deep); font-family: 'Exo 2', system-ui, sans-serif; }
        body {
            color: var(--text-main);
            background:
                radial-gradient(circle at 50% 16%, rgba(255, 217, 102, 0.22), transparent 28%),
                radial-gradient(circle at 14% 10%, rgba(255, 114, 182, 0.22), transparent 20%),
                radial-gradient(circle at 88% 72%, rgba(135, 240, 195, 0.12), transparent 24%),
                linear-gradient(180deg, #2a1038 0%, #6f2d7a 54%, #321340 100%);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            background:
                repeating-linear-gradient(108deg, transparent 0 28px, rgba(255,255,255,0.025) 29px 31px, transparent 32px 58px),
                radial-gradient(circle at 22% 78%, rgba(255, 159, 202, 0.14), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(255, 217, 102, 0.12), transparent 20%);
            animation: paperDrift 13s ease-in-out infinite alternate;
        }
        @keyframes paperDrift {
            from { transform: translate3d(-1%, -0.5%, 0) scale(1.01); }
            to { transform: translate3d(1%, 0.5%, 0) scale(1.03); }
        }
        #game-container { position: relative; width: 100%; height: 100%; user-select: none; }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 1; }
        #ui-layer { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; padding: 1rem; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-wrap { flex-wrap: wrap; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .max-w-sm { max-width: 24rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mt-8 { margin-top: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .gap-2 { gap: 0.5rem; }
        .text-center { text-align: center; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-sm { font-size: 0.875rem; }
        .font-black { font-weight: 700; }
        .font-bold { font-weight: 700; }
        .rounded-full { border-radius: 9999px; }
        .shadow-md { box-shadow: 0 4px 10px rgba(0,0,0,0.18); }
        .transform { transform: scale(1); }
        .transition-transform { transition: transform 0.2s ease; }
        .scale-95 { transform: scale(0.95); }
        .select-none { user-select: none; }
        .text-white { color: #fff; }
        
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }

        /* [agent-note][world-design-superprompt] visual-intent: glossy Mother's Day meme-sticker card panels | scope: menus,hud */
        .paper-panel {
            background:
                radial-gradient(circle at 14% 4%, rgba(255, 246, 251, 0.14), transparent 30%),
                linear-gradient(145deg, rgba(93, 27, 83, 0.94), rgba(42, 16, 56, 0.88)),
                radial-gradient(circle at top, rgba(255, 214, 102, 0.13), transparent 44%);
            border-radius: 22px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 12px 32px rgba(0,0,0,0.28),
                0 0 18px var(--panel-glow),
                0 0 0 4px rgba(255, 114, 182, 0.055);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .paper-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                 linear-gradient(90deg, transparent 0 48%, rgba(255, 214, 102, 0.08) 50%, transparent 52% 100%),
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 40%);
            pointer-events: none;
        }
        .word-badge {
            transition: transform 0.2s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            padding: 0.3rem 0.72rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
            background:
                linear-gradient(90deg, rgba(255, 217, 102, 0.1), transparent 20% 80%, rgba(255, 114, 182, 0.1)),
                rgba(74, 22, 78, 0.76);
            border: 1px solid rgba(255, 214, 102, 0.3);
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.04),
                0 5px 12px rgba(0,0,0,0.12);
        }
        .word-badge::before {
            content: "✿";
            margin-right: 0.28rem;
            color: var(--accent-strong);
            text-shadow: 0 0 10px rgba(255, 217, 102, 0.4);
        }
        .word-badge.found {
            background: linear-gradient(135deg, rgba(255, 114, 182, 0.94), rgba(255, 217, 102, 0.95));
            color: #3a123d;
            text-decoration: line-through;
            opacity: 0.9;
            border-color: rgba(255,255,255,0.22);
            box-shadow:
                0 0 14px rgba(255, 114, 182, 0.3),
                0 0 0 2px rgba(135, 240, 195, 0.16);
        }
        .word-badge.found::before { content: "♥"; color: #3a123d; }
        .hud-title {
            color: var(--text-main);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: 'Orbitron', system-ui, sans-serif;
            text-shadow:
                0 1px 0 rgba(255, 217, 102, 0.28),
                0 0 16px rgba(255, 114, 182, 0.34);
        }
        .hud-meta {
            color: var(--accent-strong);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .instruction-copy {
            margin-top: 0.35rem;
            color: var(--text-soft);
            font-size: 0.84rem;
            line-height: 1.35;
            letter-spacing: 0.05em;
        }
        .overlay-screen {
            background: rgba(4, 9, 18, 0.68);
            backdrop-filter: blur(10px);
            padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
        }
        .panel-copy { color: var(--text-soft); line-height: 1.5; font-size: 1rem; }
        .primary-button {
            background:
                radial-gradient(circle at 28% 15%, rgba(255,255,255,0.7), transparent 22%),
                linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #3a123d;
            border: 1px solid rgba(255,255,255,0.34);
            cursor: pointer;
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 10px 24px rgba(255, 114, 182, 0.3),
                inset 0 -2px 0 rgba(58, 18, 61, 0.18);
            touch-action: manipulation;
        }
        .primary-button:active { transform: scale(0.95); }
        .signal-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
            padding: 0.28rem 0.65rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 214, 102, 0.24);
            background: rgba(255, 214, 102, 0.1);
            color: var(--accent-strong);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .signal-tag::before {
            content: "♥";
            color: var(--accent);
            text-shadow: 0 0 12px rgba(255, 114, 182, 0.55);
        }
        .signal-tag::after {
            content: "✦";
            color: var(--accent-strong);
            text-shadow: 0 0 10px rgba(255, 217, 102, 0.45);
        }
        .hud-scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, rgba(255, 214, 102, 0.08), transparent);
            animation: sweepScan 3.2s linear infinite;
            pointer-events: none;
            opacity: 0.65;
        }
        @keyframes sweepScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @media (max-width: 600px) {
            #ui-layer { padding: 0.75rem; }
            #hud { margin-top: 0.5rem; padding: 0.85rem; }
            .text-xl { font-size: 1.08rem; }
            .text-3xl { font-size: 1.65rem; }
            .instruction-copy { font-size: 0.76rem; }
            .word-badge { font-size: 0.8rem; padding: 0.26rem 0.55rem; }
            .panel-copy { font-size: 0.92rem; }
        }
        .feedback-stack {
            position: absolute;
            right: 1rem;
            bottom: max(1rem, env(safe-area-inset-bottom));
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.55rem;
            pointer-events: none;
        }
        .feedback-burst {
            width: min(26vw, 108px);
            max-width: 108px;
            border-radius: 16px;
            border: 1px solid rgba(255, 214, 102, 0.24);
            background: rgba(58, 18, 61, 0.72);
            box-shadow: 0 10px 22px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            object-fit: cover;
        }
        .feedback-burst.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }
        .feedback-caption {
            min-width: 7.5rem;
            max-width: min(48vw, 13rem);
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            background: rgba(58, 18, 61, 0.84);
            border: 1px solid rgba(255, 214, 102, 0.22);
            color: var(--accent-strong);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0,0,0,0.24);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 600px) {
            .feedback-stack {
                right: 0.75rem;
                bottom: max(0.75rem, env(safe-area-inset-bottom));
            }
            .feedback-burst {
                width: min(30vw, 92px);
                max-width: 92px;
            }
            .feedback-caption {
                max-width: 10rem;
                font-size: 0.66rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "gridSize": { "type": "number", "label": "Grid Size", "value": 7, "min": 5, "max": 10 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#8BA888" },
        "accentColor": { "type": "color", "label": "Accent Color", "value": "#E0C9A3" }
    }
    </script>
</head>
<body>
    <div id="game-container" class="select-none">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
            
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <!-- HUD -->
            <div id="hud" class="w-full max-w-md mx-auto mt-8 paper-panel p-4 pointer-events-auto">
                <div class="hud-scanline" aria-hidden="true"></div>
                <div class="signal-tag">Mom Meme Bouquet</div>
                <div class="flex justify-between items-center mb-2">
                    <h1 class="text-xl font-black hud-title">Mom Brainrot 3D</h1>
                    <span id="level-display" class="text-sm font-bold hud-meta">Bouquet Phase 1</span>
                </div>
                <p class="instruction-copy">Drag across the grid to collect every Mom token.</p>
                <div id="word-list" class="flex flex-wrap gap-2">
                    <!-- Words injected here -->
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: fail/win feedback -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
            <div class="feedback-stack" aria-live="polite">
                <img id="fail-gif" class="feedback-burst" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Sticker smudge reaction" />
                <img id="win-gif" class="feedback-burst" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Bouquet charm celebration" />
                <div id="feedback-caption" class="feedback-caption">Bouquet ready</div>
            </div>

            <!-- Game Over / Level Complete -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center overlay-screen pointer-events-auto">
                <div id="game-over-panel" class="paper-panel p-8 text-center max-w-sm w-full mx-4 transform transition-transform scale-95">
                <div class="signal-tag">Mom Mode Glowing</div>
                <h2 id="result-title" class="text-3xl font-black hud-title mb-2">Bouquet Complete</h2>
                <p id="result-copy" class="panel-copy mb-6">Every Mom token is collected. Advance to the next chaotic love phase.</p>
                <button id="restart-btn" class="primary-button w-full py-3 px-6 font-bold rounded-full shadow-md transition-transform">
                    Build Next Bouquet
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Assets -->
    <!-- [agent-note][stage3] resolved-audio: loop/ui/fail/collect/win -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_scan" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
    <audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>

    <script>
        // --- System & Config ---
        let gameConfig = {};
        try {
            const configScript = document.getElementById('game-config').textContent;
            const defs = JSON.parse(configScript);
            for (let key in defs) gameConfig[key] = defs[key].value;
        } catch (e) {
            gameConfig = { gridSize: 7, themeColor: '#8BA888', accentColor: '#E0C9A3' };
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let gameState = 'STARTING'; // STARTING, PLAYING, GAMEOVER
        let lastTime = 0;

        // --- Audio System ---
        let audioCtx = null;
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const audioElements = {
            scan: document.getElementById('sfx_scan'),
            success: document.getElementById('sfx_collect'),
            fail: document.getElementById('sfx_fail'),
            win: document.getElementById('sfx_win')
        };
        const audioState = {
            lastScanAt: 0,
            feedbackTimer: null
        };

        function primeAudioElement(audio, volume) {
            if (!audio) return;
            audio.volume = volume;
            audio.preload = 'auto';
            audio.load();
        }

        function initAudio() {
            if (audioUnlocked) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                audioCtx.resume().catch(() => {});
                bgm.volume = 0.2;
                bgm.play().catch(() => {});
                primeAudioElement(audioElements.scan, 0.4);
                primeAudioElement(audioElements.success, 0.55);
                primeAudioElement(audioElements.fail, 0.45);
                primeAudioElement(audioElements.win, 0.55);
                audioUnlocked = true;
            } catch (e) { console.warn("Audio init failed", e); }
        }

        function playSfx(type) {
            if (!audioUnlocked) return;
            const audio = audioElements[type];
            if (!audio) return;
            try {
                if (type === 'scan') {
                    const now = performance.now();
                    if (now - audioState.lastScanAt < 80) return;
                    audioState.lastScanAt = now;
                }
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch (e) {}
        }

        function vibrate(style = 'light') {
            try {
                window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                    params: { style: style }
                });
            } catch (e) {}
        }

        // --- Game Logic & State ---
        const WORD_BANK = [
            "MOM", "LOVE", "ROSE", "CARD", "HUG", "GIFT", "QUEEN", "BRUNCH",
            "HEART", "SUPER", "FLOWER", "SPARKLE", "CROWN", "MAMA", "SMILE", "KISS",
            "PARTY", "BLOOM", "RIBBON", "MEME", "VIBE", "SWEET", "COZY", "HERO"
        ];
        const PHASE_THEMES = [
            { name: 'Kitchen Card Warmup', message: "Build Mom's card.", top: '#ffc7a8', mid: '#ff72b6', base: '#2a1038', motif: 'card' },
            { name: 'Flower Shop Scroll', message: 'Pick the bouquet tokens.', top: '#ffd6e8', mid: '#73e9c0', base: '#321340', motif: 'flower' },
            { name: 'Brunch Group Chat', message: 'Pin the brunch chat words.', top: '#ffe5a3', mid: '#ff9fca', base: '#341a46', motif: 'chat' },
            { name: 'Queen Mom Parade', message: 'Crown every compliment.', top: '#ffd966', mid: '#d84ba7', base: '#2a1038', motif: 'crown' },
            { name: 'Cosmic Supermom Finale', message: 'Finish the supermom bouquet.', top: '#b7f3ff', mid: '#b985ff', base: '#25123f', motif: 'cosmic' }
        ];
        function getPhaseTheme() {
            return PHASE_THEMES[(Math.max(1, level) - 1) % PHASE_THEMES.length];
        }
        
        let level = 1;
        let grid = [];
        let targetWords = [];
        let foundWords = [];
        
        // Grid rendering metrics
        let cellSize = 0;
        let gridOffsetX = 0;
        let gridOffsetY = 0;

        // Interaction state
        let isDragging = false;
        let dragStartCell = null;
        let dragCurrentCell = null;
        let selectedCells = [];
        
        // Visual effects
        let particles = [];
        let shakeTime = 0;
        let bgLeaves = [];
        const failGif = document.getElementById('fail-gif');
        const winGif = document.getElementById('win-gif');
        const feedbackCaption = document.getElementById('feedback-caption');

        function showFeedback(type, text) {
            const activeGif = type === 'win' ? winGif : failGif;
            const idleGif = type === 'win' ? failGif : winGif;
            clearTimeout(audioState.feedbackTimer);
            idleGif.classList.remove('visible');
            activeGif.classList.add('visible');
            feedbackCaption.textContent = text;
            feedbackCaption.classList.add('visible');
            audioState.feedbackTimer = setTimeout(() => {
                activeGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }, type === 'win' ? 2200 : 1400);
        }

        function setState(newState) {
            gameState = newState;
            const goScreen = document.getElementById('game-over-screen');
            const goPanel = document.getElementById('game-over-panel');
            
            if (gameState === 'GAMEOVER') {
                goScreen.classList.remove('hidden');
                setTimeout(() => goPanel.classList.remove('scale-95'), 50);
            } else {
                goScreen.classList.add('hidden');
                goPanel.classList.add('scale-95');
                winGif.classList.remove('visible');
                failGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }
        }

        function generateGrid() {
            const size = gameConfig.gridSize;
            grid = Array(size).fill(null).map(() => Array(size).fill(''));
            targetWords = [];
            foundWords = [];
            
            // Pick words based on level
            const numWords = Math.min(3 + Math.floor(level / 2), 6);
            let availableWords = [...WORD_BANK].sort(() => 0.5 - Math.random());
            
            for (let i = 0; i < numWords && availableWords.length > 0; i++) {
                let word = availableWords.pop();
                if (placeWord(word, size)) {
                    targetWords.push({ word: word, found: false });
                }
            }

            // Fill remaining with random letters
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = letters.charAt(Math.floor(Math.random() * letters.length));
                    }
                }
            }

            updateHUD();
        }

        function placeWord(word, size) {
            const dirs = [[1, 0], [0, 1], [1, 1]]; // Easy mode: Right, Down, Diagonal-Down-Right
            let placed = false;
            let attempts = 0;
            
            while (!placed && attempts < 50) {
                attempts++;
                let dir = dirs[Math.floor(Math.random() * dirs.length)];
                let r = Math.floor(Math.random() * size);
                let c = Math.floor(Math.random() * size);
                
                let endR = r + dir[1] * (word.length - 1);
                let endC = c + dir[0] * (word.length - 1);
                
                if (endR >= 0 && endR < size && endC >= 0 && endC < size) {
                    let canPlace = true;
                    for (let i = 0; i < word.length; i++) {
                        let cr = r + dir[1] * i;
                        let cc = c + dir[0] * i;
                        if (grid[cr][cc] !== '' && grid[cr][cc] !== word[i]) {
                            canPlace = false;
                            break;
                        }
                    }
                    
                    if (canPlace) {
                        for (let i = 0; i < word.length; i++) {
                            grid[r + dir[1] * i][c + dir[0] * i] = word[i];
                        }
                        placed = true;
                    }
                }
            }
            return placed;
        }

        function updateHUD() {
            const phase = getPhaseTheme();
            document.body.dataset.phase = String(((Math.max(1, level) - 1) % PHASE_THEMES.length) + 1);
            document.getElementById('level-display').innerText = `Bouquet Phase ${level}`;
            const instruction = document.querySelector('.instruction-copy');
            if (instruction) instruction.innerText = phase.message;
            const list = document.getElementById('word-list');
            list.innerHTML = '';
            targetWords.forEach(tw => {
                const span = document.createElement('span');
                span.className = `word-badge ${tw.found ? 'found' : ''}`;
                span.innerText = tw.word;
                list.appendChild(span);
            });
        }

        function spawnParticles(cells) {
            cells.forEach(cell => {
                const cx = gridOffsetX + cell.c * cellSize + cellSize/2;
                const cy = gridOffsetY + cell.r * cellSize + cellSize/2;
                for(let i=0; i<3; i++) {
                    particles.push({
                        x: cx, y: cy,
                        vx: (Math.random() - 0.5) * 100,
                        vy: (Math.random() - 0.5) * 100 - 50,
                        life: 1.0,
                        size: Math.random() * 6 + 4,
                        rot: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 5
                    });
                }
            });
        }

        function initBackgroundLeaves() {
            bgLeaves = [];
            const motifTypes = ['heart', 'petal', 'gift', 'chat', 'crown', 'spark'];
            for(let i=0; i<22; i++) {
                bgLeaves.push({
                    x: Math.random() * cw,
                    y: Math.random() * ch,
                    vx: (Math.random() - 0.5) * 12,
                    vy: -8 - Math.random() * 18,
                    size: 9 + Math.random() * 24,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.8,
                    alpha: 0.09 + Math.random() * 0.18,
                    type: motifTypes[i % motifTypes.length],
                    bob: Math.random() * Math.PI * 2
                });
            }
        }

        function updateMetrics() {
            const size = gameConfig.gridSize;
            // Leave space for HUD at top (approx 150px) and margin at bottom
            const availWidth = cw * 0.9;
            const availHeight = ch - 200; 
            cellSize = Math.min(availWidth / size, availHeight / size, 60);
            gridOffsetX = (cw - (cellSize * size)) / 2;
            gridOffsetY = 160 + (availHeight - (cellSize * size)) / 2;
        }

        function initGame() {
            generateGrid();
            updateMetrics();
            initBackgroundLeaves();
            setState('PLAYING');
            if(bgm.paused) bgm.play().catch(()=>{});
        }

        function restartGame() {
            level++;
            initGame();
        }

        // --- Input Handling ---
        function getCellFromPos(x, y) {
            if (x < gridOffsetX || y < gridOffsetY) return null;
            const c = Math.floor((x - gridOffsetX) / cellSize);
            const r = Math.floor((y - gridOffsetY) / cellSize);
            if (c >= 0 && c < gameConfig.gridSize && r >= 0 && r < gameConfig.gridSize) {
                return {r, c};
            }
            return null;
        }

        function calculateLine(start, end) {
            let cells = [];
            let dr = end.r - start.r;
            let dc = end.c - start.c;
            
            // Check if valid line (horizontal, vertical, diagonal)
            if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
                let steps = Math.max(Math.abs(dr), Math.abs(dc));
                let stepR = dr === 0 ? 0 : dr / steps;
                let stepC = dc === 0 ? 0 : dc / steps;
                
                for (let i = 0; i <= steps; i++) {
                    cells.push({r: start.r + stepR * i, c: start.c + stepC * i});
                }
            } else {
                // Not a straight line, just select current
                cells.push(end);
            }
            return cells;
        }

        function handlePointerDown(x, y) {
            const cell = getCellFromPos(x, y);
            if (cell) {
                isDragging = true;
                dragStartCell = cell;
                dragCurrentCell = cell;
                selectedCells = [cell];
                playSfx('scan');
                vibrate('light');
            }
        }

        function handlePointerMove(x, y) {
            if (!isDragging) return;
            const cell = getCellFromPos(x, y);
            if (cell && (cell.r !== dragCurrentCell.r || cell.c !== dragCurrentCell.c)) {
                dragCurrentCell = cell;
                selectedCells = calculateLine(dragStartCell, dragCurrentCell);
                playSfx('scan'); // Soft scan tick on move
            }
        }

        function handlePointerUp() {
            if (!isDragging) return;
            isDragging = false;
            
            if (selectedCells.length > 1) {
                // Build string
                let wordStr = selectedCells.map(c => grid[c.r][c.c]).join('');
                let revWordStr = wordStr.split('').reverse().join('');
                
                let found = false;
                for (let tw of targetWords) {
                    if (!tw.found && (tw.word === wordStr || tw.word === revWordStr)) {
                        tw.found = true;
                        foundWords.push(selectedCells);
                        updateHUD();
                        playSfx('success');
                        showFeedback('win', `${tw.word} charm collected`);
                        vibrate('medium');
                        spawnParticles(selectedCells);
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    playSfx('fail');
                    showFeedback('fail', 'Sticker smudge');
                    vibrate('light');
                    shakeTime = 0.3; // Shake effect
                }
            }
            selectedCells = [];

            // Check win
            if (targetWords.every(tw => tw.found)) {
                setTimeout(() => {
                    playSfx('win');
                    showFeedback('win', 'Bouquet complete');
                    vibrate('heavy');
                    setState('GAMEOVER');
                }, 500);
            }
        }

        function handleGlobalInput(e) {
            initAudio();
            if (e.type === 'click' && e.target.id === 'restart-btn') {
                restartGame();
                return;
            }
            
            if (gameState !== 'PLAYING') return;
            
            // Prevent default scrolling on canvas
            if(e.target === canvas) e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (!isFinite(x) || !isFinite(y)) return;

            if (e.type === 'pointerdown') handlePointerDown(x, y);
            else if (e.type === 'pointermove') handlePointerMove(x, y);
            else if (e.type === 'pointerup' || e.type === 'pointercancel') handlePointerUp();
        }

        window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
        window.addEventListener('pointermove', handleGlobalInput, { passive: false });
        window.addEventListener('pointerup', handleGlobalInput, { passive: false });
        window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
        window.addEventListener('blur', () => { try { bgm.pause(); } catch (e) {} });
        document.addEventListener('visibilitychange', () => {
            try {
                if (document.hidden) bgm.pause();
                else if (audioUnlocked && gameState === 'PLAYING') bgm.play().catch(() => {});
            } catch (e) {}
        });
        document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);

        // --- Rendering ---
        function drawLeaf(x, y, size, rot, alpha, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            // Simple petal / sticker teardrop shape
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(size, -size/2, 0, size);
            ctx.quadraticCurveTo(-size, -size/2, 0, -size);
            ctx.fill();
            ctx.restore();
        }

        function drawHeart(x, y, size, rot, alpha, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.scale(size / 26, size / 26);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, 9);
            ctx.bezierCurveTo(-20, -6, -8, -22, 0, -10);
            ctx.bezierCurveTo(8, -22, 20, -6, 0, 9);
            ctx.fill();
            ctx.restore();
        }

        function drawGift(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(255, 217, 102, 0.78)';
            ctx.strokeStyle = 'rgba(255, 246, 251, 0.55)';
            ctx.lineWidth = Math.max(1, size * 0.06);
            ctx.beginPath();
            ctx.roundRect(-size * 0.42, -size * 0.24, size * 0.84, size * 0.66, size * 0.12);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 114, 182, 0.72)';
            ctx.fillRect(-size * 0.07, -size * 0.24, size * 0.14, size * 0.66);
            ctx.fillRect(-size * 0.42, -size * 0.02, size * 0.84, size * 0.12);
            ctx.restore();
        }

        function drawCrown(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(255, 217, 102, 0.82)';
            ctx.strokeStyle = 'rgba(255, 246, 251, 0.48)';
            ctx.lineWidth = Math.max(1, size * 0.05);
            ctx.beginPath();
            ctx.moveTo(-size * 0.48, size * 0.22);
            ctx.lineTo(-size * 0.38, -size * 0.28);
            ctx.lineTo(-size * 0.12, size * 0.02);
            ctx.lineTo(0, -size * 0.42);
            ctx.lineTo(size * 0.12, size * 0.02);
            ctx.lineTo(size * 0.38, -size * 0.28);
            ctx.lineTo(size * 0.48, size * 0.22);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawChatBubble(x, y, size, rot, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(255, 246, 251, 0.28)';
            ctx.strokeStyle = 'rgba(255, 217, 102, 0.38)';
            ctx.lineWidth = Math.max(1, size * 0.05);
            ctx.beginPath();
            ctx.roundRect(-size * 0.56, -size * 0.34, size * 1.12, size * 0.68, size * 0.24);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-size * 0.18, size * 0.28);
            ctx.lineTo(-size * 0.34, size * 0.55);
            ctx.lineTo(size * 0.02, size * 0.32);
            ctx.fill();
            ctx.restore();
        }

        function drawSpark(x, y, size, rot, alpha, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(1, size * 0.08);
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.48);
            ctx.lineTo(0, size * 0.48);
            ctx.moveTo(-size * 0.48, 0);
            ctx.lineTo(size * 0.48, 0);
            ctx.moveTo(-size * 0.28, -size * 0.28);
            ctx.lineTo(size * 0.28, size * 0.28);
            ctx.moveTo(size * 0.28, -size * 0.28);
            ctx.lineTo(-size * 0.28, size * 0.28);
            ctx.stroke();
            ctx.restore();
        }

        function drawBackgroundMotif(motif, phase) {
            const x = motif.x + Math.sin(motif.bob) * 8;
            const y = motif.y;
            const size = motif.size;
            if (motif.type === 'heart') drawHeart(x, y, size, motif.rot, motif.alpha, 'rgba(255, 114, 182, 0.86)');
            else if (motif.type === 'gift') drawGift(x, y, size, motif.rot, motif.alpha);
            else if (motif.type === 'chat') drawChatBubble(x, y, size, motif.rot * 0.35, motif.alpha);
            else if (motif.type === 'crown') drawCrown(x, y, size, motif.rot * 0.35, motif.alpha);
            else if (motif.type === 'spark') drawSpark(x, y, size, motif.rot, motif.alpha, 'rgba(255, 217, 102, 0.78)');
            else drawLeaf(x, y, size, motif.rot, motif.alpha, phase.motif === 'flower' ? 'rgba(135, 240, 195, 0.76)' : 'rgba(255, 214, 102, 0.82)');
        }

        function drawRibbonArc(time, phase) {
            ctx.save();
            ctx.globalAlpha = 0.18;
            ctx.lineWidth = Math.max(3, Math.min(cw, ch) * 0.012);
            ctx.lineCap = 'round';
            ctx.strokeStyle = phase.motif === 'cosmic' ? 'rgba(183, 243, 255, 0.72)' : 'rgba(255, 217, 102, 0.64)';
            for (let i = 0; i < 3; i++) {
                const y = ch * (0.36 + i * 0.18) + Math.sin(time * 0.0005 + i) * 10;
                ctx.beginPath();
                ctx.moveTo(-cw * 0.1, y);
                ctx.bezierCurveTo(cw * 0.22, y - 62, cw * 0.68, y + 62, cw * 1.1, y - 18);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPhaseProps(time, phase) {
            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = 'rgba(255, 246, 251, 0.34)';
            ctx.strokeStyle = 'rgba(255, 217, 102, 0.28)';
            ctx.lineWidth = 2;
            if (phase.motif === 'card') {
                ctx.translate(cw * 0.12, ch * 0.72);
                ctx.rotate(-0.08);
                ctx.beginPath();
                ctx.roundRect(0, 0, Math.min(118, cw * 0.3), 78, 12);
                ctx.fill();
                ctx.stroke();
                drawHeart(Math.min(59, cw * 0.15), 38, 24, 0, 0.58, 'rgba(255, 114, 182, 0.9)');
            } else if (phase.motif === 'chat') {
                drawChatBubble(cw * 0.82, ch * 0.32 + Math.sin(time * 0.001) * 8, 62, -0.08, 0.65);
                drawChatBubble(cw * 0.18, ch * 0.64, 46, 0.08, 0.45);
            } else if (phase.motif === 'crown') {
                drawCrown(cw * 0.5, ch * 0.26 + Math.sin(time * 0.001) * 5, 90, 0, 0.55);
            } else if (phase.motif === 'cosmic') {
                ctx.strokeStyle = 'rgba(183, 243, 255, 0.32)';
                ctx.beginPath();
                ctx.ellipse(cw * 0.5, ch * 0.54, cw * 0.42, ch * 0.16, Math.sin(time * 0.0004) * 0.25, 0, Math.PI * 2);
                ctx.stroke();
                drawGift(cw * 0.78, ch * 0.58, 38, time * 0.0008, 0.48);
            }
            ctx.restore();
        }

        function drawPill(cells, color, alpha) {
            if(cells.length === 0) return;
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            
            if(cells.length === 1) {
                const cx = gridOffsetX + cells[0].c * cellSize + cellSize/2;
                const cy = gridOffsetY + cells[0].r * cellSize + cellSize/2;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize * 0.4, 0, Math.PI*2);
                ctx.fill();
                return;
            }

            const start = cells[0];
            const end = cells[cells.length-1];
            const sx = gridOffsetX + start.c * cellSize + cellSize/2;
            const sy = gridOffsetY + start.r * cellSize + cellSize/2;
            const ex = gridOffsetX + end.c * cellSize + cellSize/2;
            const ey = gridOffsetY + end.r * cellSize + cellSize/2;
            
            const dx = ex - sx;
            const dy = ey - sy;
            const angle = Math.atan2(dy, dx);
            const dist = Math.sqrt(dx*dx + dy*dy);
            const r = Math.max(0, cellSize * 0.4);

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, r, Math.PI/2, Math.PI*1.5);
            ctx.lineTo(dist, -r);
            ctx.arc(dist, 0, r, -Math.PI/2, Math.PI/2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if (!initialized) return;

            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;

            try {
                // Background: level-reactive procedural Mother's Day sticker diorama.
                const phase = getPhaseTheme();
                ctx.fillStyle = phase.base;
                ctx.fillRect(0, 0, cw, ch);
                
                const grad = ctx.createRadialGradient(cw/2, ch*0.24, 0, cw/2, ch/2, cw);
                grad.addColorStop(0, phase.top);
                grad.addColorStop(0.48, phase.mid);
                grad.addColorStop(1, phase.base);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                const beam = ctx.createLinearGradient(0, 0, 0, ch);
                beam.addColorStop(0, 'rgba(255, 246, 251, 0.04)');
                beam.addColorStop(0.5, 'rgba(255, 114, 182, 0.1)');
                beam.addColorStop(1, 'rgba(255, 214, 102, 0.05)');
                ctx.fillStyle = beam;
                ctx.fillRect(0, 0, cw, ch);

                drawRibbonArc(timestamp, phase);
                drawPhaseProps(timestamp, phase);

                // Update & Draw low-alpha petals/hearts/gifts/chats/crowns behind play.
                bgLeaves.forEach(l => {
                    l.x += l.vx * dt;
                    l.y += l.vy * dt;
                    l.rot += l.rotSpeed * dt;
                    l.bob += dt * 0.9;
                    if(l.y < -l.size) {
                        l.y = ch + l.size;
                        l.x = Math.random() * cw;
                    }
                    if(l.x < -l.size) l.x = cw + l.size;
                    if(l.x > cw + l.size) l.x = -l.size;
                    drawBackgroundMotif(l, phase);
                });

                ctx.globalAlpha = 1.0;

                // Shake effect
                let curOffsetX = gridOffsetX;
                if (shakeTime > 0) {
                    shakeTime -= dt;
                    curOffsetX += Math.sin(shakeTime * 50) * 5;
                }

                // Draw Grid Background (glossy card-table feel)
                const size = gameConfig.gridSize;
                const gridW = size * cellSize;
                const gridH = size * cellSize;
                
                const panelGrad = ctx.createLinearGradient(0, gridOffsetY - 10, 0, gridOffsetY + gridH + 10);
                panelGrad.addColorStop(0, 'rgba(86, 27, 88, 0.94)');
                panelGrad.addColorStop(0.55, 'rgba(58, 18, 61, 0.94)');
                panelGrad.addColorStop(1, 'rgba(42, 16, 56, 0.94)');
                ctx.fillStyle = panelGrad;
                ctx.shadowColor = 'rgba(255, 114, 182, 0.16)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 8;
                ctx.beginPath();
                ctx.roundRect(curOffsetX - 10, gridOffsetY - 10, gridW + 20, gridH + 20, 18);
                ctx.fill();
                ctx.shadowColor = 'transparent';

                ctx.strokeStyle = 'rgba(255, 214, 102, 0.32)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(curOffsetX - 10, gridOffsetY - 10, gridW + 20, gridH + 20, 18);
                ctx.stroke();

                ctx.save();
                ctx.globalAlpha = 0.2;
                ctx.strokeStyle = 'rgba(255, 246, 251, 0.32)';
                ctx.lineWidth = 1;
                ctx.setLineDash([6, 10]);
                ctx.beginPath();
                ctx.roundRect(curOffsetX - 3, gridOffsetY - 3, gridW + 6, gridH + 6, 14);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();

                // Draw Found Words
                foundWords.forEach(wordCells => {
                    drawPill(wordCells, '#ff72b6', 0.36);
                });

                // Draw Current Drag
                if (isDragging && selectedCells.length > 0) {
                    drawPill(selectedCells, '#ffd966', 0.52);
                }

                // Draw Letters
                ctx.globalAlpha = 1.0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `700 ${cellSize * 0.5}px "Exo 2"`;

                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        const cx = curOffsetX + c * cellSize + cellSize/2;
                        const cy = gridOffsetY + r * cellSize + cellSize/2;
                        
                         // Subtle 3D sticker tile background
                         const tileGrad = ctx.createLinearGradient(0, cy - cellSize*0.4, 0, cy + cellSize*0.4);
                         tileGrad.addColorStop(0, 'rgba(112, 39, 108, 0.97)');
                         tileGrad.addColorStop(0.35, 'rgba(78, 24, 82, 0.97)');
                         tileGrad.addColorStop(1, 'rgba(46, 15, 58, 0.98)');
                         ctx.fillStyle = tileGrad;
                        ctx.beginPath();
                        ctx.roundRect(cx - cellSize*0.4, cy - cellSize*0.4, cellSize*0.8, cellSize*0.8, 10);
                        ctx.fill();

                         ctx.strokeStyle = 'rgba(255, 214, 102, 0.18)';
                         ctx.lineWidth = 1;
                         ctx.stroke();
                         ctx.fillStyle = 'rgba(255,255,255,0.08)';
                         ctx.beginPath();
                         ctx.roundRect(cx - cellSize*0.31, cy - cellSize*0.32, cellSize*0.42, cellSize*0.13, 6);
                         ctx.fill();

                         ctx.fillStyle = '#fff6fb';
                        ctx.shadowColor = 'rgba(255, 114, 182, 0.24)';
                        ctx.shadowBlur = 10;
                        ctx.fillText(grid[r][c], cx, cy + 2); // slight optical adjustment
                        ctx.shadowBlur = 0;
                    }
                }

                // Update & Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.rot += p.rotSpeed * dt;
                    p.life -= dt * 1.5;
                    
                    if (p.life <= 0 || !isFinite(p.x) || !isFinite(p.y)) {
                        particles.splice(i, 1);
                    } else {
                        drawLeaf(p.x, p.y, p.size, p.rot, p.life, 'rgba(255, 217, 102, 0.92)');
                    }
                }
                ctx.globalAlpha = 1.0;

            } catch (e) {
                console.error("Loop error isolated:", e);
            }
        }

        // --- Initialization ---
        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                const cr = entry.contentRect;
                cw = cr.width;
                ch = cr.height;
                
                canvas.width = cw * dpr;
                canvas.height = ch * dpr;
                canvas.style.width = cw + 'px';
                canvas.style.height = ch + 'px';
                
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                if (!initialized && cw > 0 && ch > 0) {
                    initialized = true;
                    initGame();
                } else if (initialized) {
                    updateMetrics();
                    initBackgroundLeaves();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            ro.observe(canvas);
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
