<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Sudoku Circuit</title>
    <!-- [agent-note][stage3] resolved-font: title/display -> Orbitron | ui/body -> Rajdhani from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #080c1f;
            --bg-deep: #030611;
            --panel: rgba(14, 20, 44, 0.82);
            --panel-strong: rgba(20, 28, 62, 0.94);
            --glass: linear-gradient(180deg, rgba(18, 29, 70, 0.9), rgba(10, 15, 38, 0.86));
            --glass-border: rgba(121, 223, 255, 0.28);
            --text: #e9f6ff;
            --muted: #9eb4d9;
            --blue: #66d9ff;
            --blue-strong: #2fa7ff;
            --blue-soft: #7cf3ff;
            --violet: #8b5dff;
            --gold: #ffe66d;
            --red: #ff5f7e;
            --green: #7aff9c;
            --grid-dark: #0e1734;
            --grid-mid: #16234f;
            --grid-line: rgba(165, 230, 255, 0.14);
            --grid-line-strong: rgba(134, 219, 255, 0.6);
            --shadow-soft: 0 10px 28px rgba(0, 0, 0, 0.34);
            --shadow-card: 0 20px 44px rgba(1, 8, 28, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(71, 134, 255, 0.18), transparent 34%),
                radial-gradient(circle at 80% 18%, rgba(124, 243, 255, 0.16), transparent 24%),
                linear-gradient(180deg, #0a1028 0%, var(--bg) 38%, var(--bg-deep) 100%);
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
        }

        .font-ui {
            font-family: 'Rajdhani', sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .hidden { display: none !important; }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), var(--shadow-soft);
        }

        .btn-press { transition: transform 0.05s; }
        .btn-press:active { transform: scale(0.95); }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #hud {
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
        }

        .hud-card,
        .controls-panel,
        .game-over-card {
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
        }

        .hud-card {
            padding: 10px 16px;
            min-width: 136px;
            position: relative;
            overflow: hidden;
        }

        .hud-card::after,
        .controls-panel::after,
        .game-over-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 42%, rgba(124,243,255,0.08));
            mix-blend-mode: screen;
        }

        .hud-label,
        .helper-copy {
            font-size: 11px;
            color: var(--blue-soft);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        .hud-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-top: 4px;
            text-shadow: 0 0 14px rgba(47, 167, 255, 0.18);
        }

        .hud-value select {
            font: inherit;
            color: inherit;
            background: transparent;
            border: 0;
            outline: none;
            width: 100%;
        }

        #controls {
            width: 100%;
            padding: 16px 16px 32px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #context-banner {
            align-self: center;
            max-width: min(92vw, 520px);
            padding: 12px 16px;
            text-align: center;
        }

        .helper-copy {
            display: block;
            margin-bottom: 6px;
        }

        .banner-text {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text);
            font-weight: 600;
        }

        .skills-row {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .round-btn {
            width: 56px;
            height: 56px;
            border-radius: 999px;
            border: 1px solid rgba(124, 243, 255, 0.32);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 24px rgba(8, 18, 48, 0.4);
            cursor: pointer;
            color: var(--text);
            background: radial-gradient(circle at 30% 30%, rgba(124,243,255,0.28), rgba(23,31,68,0.96) 68%);
        }

        .round-btn img {
            width: 24px;
            height: 24px;
            pointer-events: none;
        }

        .badge-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: linear-gradient(180deg, var(--gold), #ffad33);
            color: #1e1638;
            font-size: 11px;
            font-weight: 700;
            border-radius: 999px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(255, 196, 73, 0.36);
        }

        .restart-btn {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            font-family: 'Orbitron', sans-serif;
        }

        .controls-panel {
            align-self: center;
            width: min(92vw, 640px);
            padding: 8px;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            height: 52px;
        }

        .numpad-btn {
            border: 1px solid rgba(113, 199, 255, 0.2);
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(24, 34, 74, 0.96), rgba(13, 19, 46, 0.98));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 10px rgba(0, 0, 0, 0.18);
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            z-index: 60;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .feedback-gif {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(0.86);
            width: min(36vw, 160px);
            border-radius: 18px;
            border: 1px solid rgba(124, 243, 255, 0.24);
            box-shadow: 0 12px 28px rgba(2, 10, 32, 0.42);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 35;
            object-fit: cover;
            background: rgba(8, 12, 28, 0.72);
        }

        .feedback-gif.is-visible {
            opacity: 0.96;
            transform: translateX(-50%) scale(1);
        }

        #reaction-gif {
            top: clamp(138px, 18vh, 184px);
        }

        #status-gif {
            bottom: clamp(128px, 17vh, 188px);
        }

        .game-over-card {
            padding: 32px;
            text-align: center;
            width: min(88vw, 360px);
            box-shadow: var(--shadow-card);
        }

        .go-title {
            font-size: 30px;
            font-weight: 700;
            margin: 0 0 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .go-msg {
            color: var(--muted);
            margin: 0 0 20px;
            line-height: 1.5;
            font-size: 15px;
        }

        .primary-btn {
            border: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, #43d8ff, #2a7bff);
            color: #061123;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.32);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .primary-btn:active { transform: scale(0.97); }

        .title-win { color: var(--gold); text-shadow: 0 0 16px rgba(255, 230, 109, 0.34); }
        .title-lose { color: var(--red); text-shadow: 0 0 16px rgba(255, 95, 126, 0.22); }

        #grid-avatar {
            position: absolute;
            top: clamp(72px, 10vh, 108px);
            left: 50%;
            transform: translateX(-50%);
            width: min(30vw, 150px);
            min-width: 92px;
            aspect-ratio: 1;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.4));
        }

        .avatar-core {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 28px;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.96), rgba(124,243,255,0.34) 22%, rgba(54,102,255,0.12) 43%, transparent 44%),
                linear-gradient(160deg, rgba(80, 243, 255, 0.95), rgba(54, 117, 255, 0.88) 55%, rgba(126, 73, 255, 0.85));
            border: 1px solid rgba(255,255,255,0.36);
            box-shadow:
                inset 0 0 24px rgba(255,255,255,0.16),
                0 0 26px rgba(80, 243, 255, 0.22);
            overflow: hidden;
            animation: avatarFloat 3.2s ease-in-out infinite;
        }

        .avatar-core::before,
        .avatar-core::after {
            content: "";
            position: absolute;
            inset: 12%;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .avatar-core::after {
            inset: auto 20% 16% 20%;
            height: 16%;
            border-radius: 999px;
            border: 0;
            background: rgba(7, 14, 38, 0.28);
            filter: blur(6px);
        }

        .avatar-face {
            position: absolute;
            inset: 18%;
        }

        .avatar-eye {
            position: absolute;
            top: 30%;
            width: 19%;
            height: 19%;
            border-radius: 999px;
            background: #071026;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.12);
            animation: avatarBlink 4.8s infinite;
        }

        .avatar-eye.left { left: 20%; }
        .avatar-eye.right { right: 20%; }

        .avatar-mouth {
            position: absolute;
            left: 50%;
            bottom: 20%;
            width: 32%;
            height: 16%;
            transform: translateX(-50%);
            border-radius: 0 0 999px 999px;
            border: 4px solid #071026;
            border-top: 0;
        }

        .avatar-crown {
            position: absolute;
            top: -8%;
            left: 18%;
            right: 18%;
            height: 18%;
            background: linear-gradient(180deg, #fff3a6, #ffbf43);
            clip-path: polygon(0 100%, 12% 42%, 28% 72%, 50% 12%, 72% 72%, 88% 42%, 100% 100%);
            filter: drop-shadow(0 4px 10px rgba(255, 196, 73, 0.38));
        }

        .avatar-sparks {
            position: absolute;
            inset: -10%;
            pointer-events: none;
        }

        .avatar-sparks span {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(124, 243, 255, 0.85);
            box-shadow: 0 0 10px rgba(124, 243, 255, 0.8);
            animation: sparkPulse 2.2s infinite ease-in-out;
        }

        .avatar-sparks span:nth-child(1) { top: 18%; left: 10%; }
        .avatar-sparks span:nth-child(2) { top: 10%; right: 14%; animation-delay: 0.4s; }
        .avatar-sparks span:nth-child(3) { right: 8%; bottom: 28%; animation-delay: 0.8s; }
        .avatar-sparks span:nth-child(4) { bottom: 16%; left: 14%; animation-delay: 1.2s; }

        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes avatarBlink {
            0%, 45%, 48%, 100% { transform: scaleY(1); }
            46%, 47% { transform: scaleY(0.16); }
        }

        @keyframes sparkPulse {
            0%, 100% { transform: scale(0.7); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        @media (max-width: 640px) {
            #hud {
                padding: 12px;
                gap: 10px;
            }

            .hud-card {
                min-width: 0;
                flex: 1;
                padding: 10px 12px;
            }

            .hud-label, .helper-copy {
                font-size: 10px;
            }

            .hud-value {
                font-size: 15px;
            }

            #controls {
                padding: 12px 12px 24px;
                gap: 12px;
            }

            .round-btn {
                width: 52px;
                height: 52px;
            }

            .controls-panel {
                width: 100%;
            }

            .numpad-grid {
                gap: 4px;
                height: 48px;
            }

            .numpad-btn {
                font-size: 18px;
            }

            .banner-text {
                font-size: 12px;
            }

            #grid-avatar {
                top: 78px;
                width: min(28vw, 104px);
                min-width: 84px;
            }

            .game-over-card {
                padding: 24px;
            }

            .go-title {
                font-size: 26px;
            }

            .feedback-gif {
                width: min(34vw, 120px);
            }

            #reaction-gif {
                top: 132px;
            }

            #status-gif {
                bottom: 118px;
            }
        }
    </style>
</head>

<!-- Config -->

<!-- UI -->

    <canvas id="gameCanvas"></canvas>
    <div id="grid-avatar" aria-hidden="true">
        <div class="avatar-core">
            <div class="avatar-crown"></div>
            <div class="avatar-face">
                <div class="avatar-eye left"></div>
                <div class="avatar-eye right"></div>
                <div class="avatar-mouth"></div>
            </div>
        </div>
        <div class="avatar-sparks">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: fail-reaction + win-status overlays from catalogs/gifs.json -->
    <img id="reaction-gif" class="feedback-gif" alt="" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" aria-hidden="true">
    <img id="status-gif" class="feedback-gif" alt="" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" aria-hidden="true">

    <div id="ui-layer">
        <!-- Top HUD -->
        <div id="hud">
            <div class="glass hud-card">
                <div class="hud-label">Mode</div>
                <div class="hud-value">
                    <select id="diff-select" aria-label="Select challenge tier">
                        <option value="0">Warm-Up</option>
                        <option value="1">Arcade</option>
                        <option value="2" selected>Challenge</option>
                        <option value="3">Elite</option>
                        <option value="4">Chaos</option>
                    </select>
                </div>
            </div>
            <div class="glass hud-card" style="text-align:right;">
                <div class="hud-label">Strikes</div>
                <div id="mistakes-display" class="hud-value">0/3</div>

        <!-- Bottom Controls -->
        <div id="controls">
            <div id="context-banner" class="glass controls-panel">
                <span class="helper-copy">Pilot Brief</span>
                <div class="banner-text">Guide the Neon Grid Captain through each sector: tap a tile, then lock in the right digit. Three bad calls end the run.</div>

            </div>

            <!-- Skills -->
            <div class="skills-row">
                <button id="btn-skill-reveal" class="btn-press glass round-btn" aria-label="Reveal a correct digit">
                    <img src="" alt="" id="img-skill-reveal">
                    <span class="badge-count" id="count-reveal">3</span>

                <button id="btn-skill-check" class="btn-press glass round-btn" aria-label="Scan for wrong digits">
                    <img src="" alt="" id="img-skill-check">
                    <span class="badge-count" id="count-check">3</span>
                </button>
                <button id="btn-btn-restart" class="btn-press glass round-btn restart-btn" aria-label="Start a fresh board">

                Run It Back
            </button>

<script>
// --- §0 Constants & Config ---
const CONFIG_DEFS = {
    primaryColor: { type: "color", value: "#4299E1" },
    errorColor: { type: "color", value: "#F56565" },
    gridSpeed: { type: "number", value: 8 }
};
window.gameConfig = Object.fromEntries(Object.entries(CONFIG_DEFS).map(([k,v]) => [k, v.value]));
const DIFFICULTY_LABELS = ["Warm-Up", "Arcade", "Challenge", "Elite", "Chaos"];
const VISUAL_THEME = {
    bg: '#060b1f',
    panelGlow: 'rgba(124, 243, 255, 0.14)',
    boardFill: '#0b1430',
    boardOuter: '#1a2d63',
    cellRelated: 'rgba(91, 181, 255, 0.13)',
    cellSame: 'rgba(144, 105, 255, 0.18)',
    cellSelected: 'rgba(255, 230, 109, 0.7)',
    fixedText: '#e8f6ff',
    playerText: '#6ce6ff',
    line: 'rgba(154, 217, 255, 0.18)',
    lineStrong: 'rgba(152, 230, 255, 0.72)',
    success: '#7aff9c',
    danger: '#ff5f7e',
    particleGold: '#ffe66d'
};

// --- §1 Audio System (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioBuffers = {};
const audioCooldowns = new Map();
const bgm = document.getElementById('bgm_main');
const reactionGif = document.getElementById('reaction-gif');
const statusGif = document.getElementById('status-gif');
let audioPrimed = false;
let gifTimers = { reaction: 0, status: 0 };

async function initAudio() {
    const loadBuffer = async (id, elementId) => {
        const element = document.getElementById(elementId);
        if (!element) return;
        try {
            const response = await fetch(element.src);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { console.warn('Audio load fail', id); }
    };
    await Promise.all([
        loadBuffer('select', 'sfx_select'),
        loadBuffer('place', 'sfx_place'),
        loadBuffer('fail', 'sfx_fail'),
        loadBuffer('reveal', 'sfx_reveal'),
        loadBuffer('check', 'sfx_check'),
        loadBuffer('win', 'sfx_win'),
        loadBuffer('gameover', 'sfx_gameover')
    ]);
}

function ensureAudioReady() {
    if (audioPrimed) return;
    audioPrimed = true;
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
    initAudio();
}

function playSfx(id, options = {}) {
    ensureAudioReady();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const now = performance.now();
    const cooldown = options.cooldown ?? 0;
    const lastPlayed = audioCooldowns.get(id) ?? 0;
    if (cooldown > 0 && now - lastPlayed < cooldown) return;
    audioCooldowns.set(id, now);

    const buffer = audioBuffers[id];
    if (buffer) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = buffer;
        gain.gain.value = options.volume ?? 0.24;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = { select: 420, place: 660, fail: 180, reveal: 760, check: 240, win: 880, gameover: 140 }[id] ?? 500;
        osc.type = options.wave ?? 'sine';
        gain.gain.setValueAtTime(options.volume ?? 0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (options.length ?? 0.16));
        osc.start();
        osc.stop(audioCtx.currentTime + (options.length ?? 0.16));
    }
}

function showGif(target, mode, duration = 1400) {
    const element = mode === 'reaction' ? reactionGif : statusGif;
    const key = mode === 'reaction' ? 'reaction' : 'status';
    clearTimeout(gifTimers[key]);
    element.classList.add('is-visible');
    gifTimers[key] = setTimeout(() => element.classList.remove('is-visible'), duration);
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 40 : 10);
    }
}

// --- §2 Game Logic (Sudoku) ---
let grid = []; // 9x9 array of { val: 0-9, solution: 1-9, fixed: bool, error: bool, notes: [] }
let selectedCell = { r: -1, c: -1 };
let difficulty = 2; // 0-4
let mistakes = 0;
const MAX_MISTAKES = 3;
let skills = { reveal: 3, check: 3 };

function generateSudoku(diff) {
    // 1. Init empty
    const mat = Array(9).fill().map(() => Array(9).fill(0));

    // 2. Fill diagonal boxes (independent)
    for (let i = 0; i < 9; i+=3) fillBox(mat, i, i);

    // 3. Solve rest
    solveSudoku(mat);

    // 4. Create Game Object
    const fullGrid = mat.map(row => row.slice());

    // 5. Remove digits based on difficulty
    // Warm-Up: 30 removed, Arcade: 40, Challenge: 45, Elite: 52, Chaos: 58
    const attempts = [30, 40, 45, 52, 58][diff];
    let count = attempts;
    while (count > 0) {
        let r = Math.floor(Math.random()*9);
        let c = Math.floor(Math.random()*9);
        if (mat[r][c] !== 0) {
            mat[r][c] = 0;
            count--;
        }
    }

    return mat.map((row, r) => row.map((val, c) => ({
        val: val,
        solution: fullGrid[r][c],
        fixed: val !== 0,
        error: false,
        animScale: 1,
        highlight: 0 // 0: none, 1: related, 2: selected, 3: same-number
    })));
}

function fillBox(mat, row, col) {
    let num;
    for (let i=0; i<3; i++) {
        for (let j=0; j<3; j++) {
            do {
                num = Math.floor(Math.random()*9)+1;
            } while (!isSafeBox(mat, row, col, num));
            mat[row+i][col+j] = num;
        }
    }
}

function isSafeBox(mat, rowStart, colStart, num) {
    for (let i=0; i<3; i++)
        for (let j=0; j<3; j++)
            if (mat[rowStart+i][colStart+j] === num) return false;
    return true;
}

function isSafe(mat, row, col, num) {
    for (let d=0; d<9; d++) if (mat[row][d] === num) return false;
    for (let d=0; d<9; d++) if (mat[d][col] === num) return false;
    let boxR = row - row%3, boxC = col - col%3;
    for (let i=0; i<3; i++)
        for (let j=0; j<3; j++)
            if (mat[boxR+i][boxC+j] === num) return false;
    return true;
}

function solveSudoku(mat) {
    for (let r=0; r<9; r++) {
        for (let c=0; c<9; c++) {
            if (mat[r][c] === 0) {
                for (let num=1; num<=9; num++) {
                    if (isSafe(mat, r, c, num)) {
                        mat[r][c] = num;
                        if (solveSudoku(mat)) return true;
                        mat[r][c] = 0;
                    }
                }
                return false;
            }
        }
    }
    return true;
}

// --- §3 Engine & Rendering ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER
let initialized = false;
let particles = [];
let shake = 0;
let boardY = 0;
let cellSize = 0;
let boardSize = 0;
let boardX = 0;

// Background elements
const bgShapes = Array(18).fill().map(() => ({
    x: Math.random(), y: Math.random(),
    r: Math.random()*26 + 10,
    vx: (Math.random()-0.5)*0.0012, vy: (Math.random()-0.5)*0.0012,
    color: Math.random() > 0.5
        ? `rgba(102, 217, 255, ${Math.random()*0.12 + 0.03})`
        : `rgba(139, 93, 255, ${Math.random()*0.1 + 0.02})`
}));

function resize(w, h) {
    cw = w; ch = h;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Layout
    const maxBoardW = Math.min(cw, ch * 0.6) - 32;
    cellSize = Math.floor(maxBoardW / 9);
    boardSize = cellSize * 9;
    boardX = (cw - boardSize) / 2;
    boardY = (ch - boardSize) / 2;
}

function initGame() {
    if (initialized) return;

    // Assets
    document.getElementById('img-skill-reveal').src = document.getElementById('asset_icon_hint').src;
    document.getElementById('img-skill-check').src = document.getElementById('asset_icon_check').src;

    // Init Logic
    startNewGame();

    initialized = true;
    requestAnimationFrame(loop);
}

function startNewGame() {
    difficulty = parseInt(document.getElementById('diff-select').value);
    grid = generateSudoku(difficulty);
    mistakes = 0;
    skills = { reveal: 3, check: 3 };
    selectedCell = { r: -1, c: -1 };
    gameState = 'PLAYING';
    updateUI();
    document.getElementById('game-over-screen').classList.add('hidden');
}

function updateUI() {
    document.getElementById('mistakes-display').innerText = `${mistakes}/${MAX_MISTAKES}`;
    document.getElementById('count-reveal').innerText = skills.reveal;
    document.getElementById('count-check').innerText = skills.check;
}

function checkWin() {
    for(let r=0; r<9; r++)
        for(let c=0; c<9; c++)
            if(grid[r][c].val !== grid[r][c].solution) return false;
    return true;
}

function spawnParticles(x, y, color) {
    for(let i=0; i<15; i++) {
        particles.push({
            x, y,
            vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
            life: 1.0, color: color
        });
    }
}

function loop() {
    // Logic
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    // Bg Animation
    bgShapes.forEach(s => {
        s.x += s.vx; s.y += s.vy;
        if(s.x<0) s.x=1; if(s.x>1) s.x=0;
        if(s.y<0) s.y=1; if(s.y>1) s.y=0;
    });

    // Render
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#08102a');
    bgGradient.addColorStop(0.45, '#091230');
    bgGradient.addColorStop(1, '#030611');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    const glowGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.18, 30, cw * 0.5, ch * 0.18, Math.max(cw, ch) * 0.45);
    glowGradient.addColorStop(0, 'rgba(67, 216, 255, 0.16)');
    glowGradient.addColorStop(1, 'rgba(67, 216, 255, 0)');
    ctx.fillStyle = glowGradient;
    ctx.fillRect(0, 0, cw, ch);

    // Parallax Bg
    bgShapes.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x*cw, s.y*ch, s.r, 0, Math.PI*2);
        ctx.fill();
    });

    // Shake
    ctx.save();
    if (shake) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

    // Board Background
    const boardGradient = ctx.createLinearGradient(boardX, boardY, boardX, boardY + boardSize);
    boardGradient.addColorStop(0, '#172a61');
    boardGradient.addColorStop(1, '#0b1430');
    ctx.fillStyle = boardGradient;
    ctx.shadowColor = 'rgba(0,0,0,0.36)';
    ctx.shadowBlur = 22;
    ctx.fillRect(boardX, boardY, boardSize, boardSize);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(124, 243, 255, 0.28)';
    ctx.lineWidth = 3;
    ctx.strokeRect(boardX, boardY, boardSize, boardSize);

    // Cells
    if (grid.length) {
        // Selection Highlights
        if (selectedCell.r !== -1) {
            // Highlight related
            ctx.fillStyle = VISUAL_THEME.cellRelated;
            const { r: sr, c: sc } = selectedCell;
            const selVal = grid[sr][sc].val;

            // Row & Col
            ctx.fillRect(boardX, boardY + sr*cellSize, boardSize, cellSize);
            ctx.fillRect(boardX + sc*cellSize, boardY, cellSize, boardSize);

            // Box
            const br = Math.floor(sr/3)*3, bc = Math.floor(sc/3)*3;
            ctx.fillRect(boardX + bc*cellSize, boardY + br*cellSize, cellSize*3, cellSize*3);

            // Highlight Same Numbers
            if (selVal !== 0) {
                ctx.fillStyle = VISUAL_THEME.cellSame;
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        if (grid[r][c].val === selVal) {
                            ctx.fillRect(boardX + c*cellSize, boardY + r*cellSize, cellSize, cellSize);
                        }
                    }
                }
            }

            // Selected Cell
            ctx.fillStyle = VISUAL_THEME.cellSelected;
            ctx.fillRect(boardX + sc*cellSize, boardY + sr*cellSize, cellSize, cellSize);
        }

        // Draw Grid Lines
        ctx.strokeStyle = VISUAL_THEME.line;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<=9; i++) {
            const p = i*cellSize;
            ctx.moveTo(boardX + p, boardY);
            ctx.lineTo(boardX + p, boardY + boardSize);
            ctx.moveTo(boardX, boardY + p);
            ctx.lineTo(boardX + boardSize, boardY + p);
        }
        ctx.stroke();

        // Thick Lines
        ctx.strokeStyle = VISUAL_THEME.lineStrong;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i=0; i<=9; i+=3) {
            const p = i*cellSize;
            ctx.moveTo(boardX + p, boardY);
            ctx.lineTo(boardX + p, boardY + boardSize);
            ctx.moveTo(boardX, boardY + p);
            ctx.lineTo(boardX + boardSize, boardY + p);
        }
        ctx.stroke();

        // Draw Numbers
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const fontSize = Math.floor(cellSize * 0.6);
        ctx.font = `700 ${fontSize}px Rajdhani`;

        for(let r=0; r<9; r++) {
            for(let c=0; c<9; c++) {
                const cell = grid[r][c];
                if (cell.val !== 0) {
                    const cx = boardX + c*cellSize + cellSize/2;
                    const cy = boardY + r*cellSize + cellSize/2;

                    // Anim Scale
                    if (cell.animScale > 1) {
                        cell.animScale -= 0.1;
                        if (cell.animScale < 1) cell.animScale = 1;
                    }

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(cell.animScale, cell.animScale);

                    if (cell.error) ctx.fillStyle = window.gameConfig.errorColor;
                    else if (cell.fixed) ctx.fillStyle = VISUAL_THEME.fixedText;
                    else ctx.fillStyle = window.gameConfig.primaryColor;

                    ctx.fillText(cell.val, 0, 2);
                    ctx.restore();
                }
            }
        }
    }

    ctx.restore();

    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.02;
        if(p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
}

// --- §4 Input & Interactions ---
const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    resize(rect.width, rect.height);
    if (!initialized) initGame();
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);

    document.querySelectorAll('.numpad-btn').forEach(btn => {
        btn.addEventListener('pointerdown', (e) => handleInput(e, parseInt(btn.dataset.num)));
    });

    document.getElementById('btn-skill-reveal').addEventListener('click', useSkillReveal);
    document.getElementById('btn-skill-check').addEventListener('click', useSkillCheck);
    document.getElementById('btn-btn-restart').addEventListener('click', startNewGame);

    document.getElementById('go-restart-btn').addEventListener('click', () => {
        startNewGame();
    });

    document.getElementById('diff-select').addEventListener('change', startNewGame);
});

function handleGlobalInput(e) {
    ensureAudioReady();
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
        bgm.play().catch(()=>{});
    }

    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (x >= boardX && x <= boardX + boardSize && y >= boardY && y <= boardY + boardSize) {
        const c = Math.floor((x - boardX) / cellSize);
        const r = Math.floor((y - boardY) / cellSize);
        if (r >= 0 && r < 9 && c >= 0 && c < 9) {
            selectedCell = { r, c };
            playSfx('select', { volume: 0.18, cooldown: 60, length: 0.12 });
            vibrate('light');
        }
    } else {
        selectedCell = { r: -1, c: -1 };
    }
}
window.addEventListener('pointerdown', handleGlobalInput, { passive: false });

function handleInput(e, num) {
    e.preventDefault();
    if (gameState !== 'PLAYING' || selectedCell.r === -1) return;

    const { r, c } = selectedCell;
    const cell = grid[r][c];

    if (cell.fixed) return;

    if (cell.val === num) {
        cell.val = 0;
        cell.error = false;
    } else {
        cell.val = num;
        cell.animScale = 1.5;

        if (cell.val !== cell.solution) {
            cell.error = true;
            mistakes++;
            shake = 10;
            playSfx('fail', { volume: 0.22, cooldown: 110, wave: 'triangle', length: 0.2 });
            showGif('reaction-gif', 'reaction', 1100);
            vibrate('heavy');
            updateUI();
            if (mistakes >= MAX_MISTAKES) {
                gameOver(false);
            }
        } else {
            cell.error = false;
            playSfx('place');
            spawnParticles(boardX + c*cellSize + cellSize/2, boardY + r*cellSize + cellSize/2, VISUAL_THEME.panelGlow);
            vibrate('light');
            if (checkWin()) gameOver(true);
        }
    }
}

function useSkillReveal() {
    if (gameState !== 'PLAYING' || selectedCell.r === -1 || skills.reveal <= 0) return;
    const { r, c } = selectedCell;
    if (grid[r][c].fixed || grid[r][c].val === grid[r][c].solution) return;

    skills.reveal--;
    grid[r][c].val = grid[r][c].solution;
    grid[r][c].error = false;
    grid[r][c].fixed = true;
    grid[r][c].animScale = 1.8;
    playSfx('reveal', { volume: 0.25, cooldown: 140 });
    showGif('status-gif', 'status', 1300);
    spawnParticles(boardX + c*cellSize + cellSize/2, boardY + r*cellSize + cellSize/2, VISUAL_THEME.particleGold);
    updateUI();
    if (checkWin()) gameOver(true);
}

function useSkillCheck() {
    if (gameState !== 'PLAYING' || skills.check <= 0) return;
    skills.check--;
    playSfx('check', { volume: 0.22, cooldown: 180, wave: 'square' });

    let found = false;
    for(let r=0; r<9; r++) {
        for(let c=0; c<9; c++) {
            if (grid[r][c].val !== 0 && grid[r][c].val !== grid[r][c].solution) {
                grid[r][c].error = true;
                grid[r][c].animScale = 1.2;
                found = true;
            }
        }
    }
    if (found) {
        shake = 5;
        showGif('reaction-gif', 'reaction', 900);
        vibrate('heavy');
    } else {
        showGif('status-gif', 'status', 900);
    }
    updateUI();
}

function gameOver(win) {
    gameState = 'GAMEOVER';
    const screen = document.getElementById('game-over-screen');
    const title = document.getElementById('go-title');
    const msg = document.getElementById('go-msg');

    screen.classList.remove('hidden');
    bgm.pause();
    bgm.currentTime = 0;
    if (win) {
        title.innerText = "Grid Cleared!";
        title.className = "go-title title-win font-display";
        msg.innerText = "Tier cleared: " + DIFFICULTY_LABELS[difficulty];
        playSfx('win', { volume: 0.28, cooldown: 200 });
        showGif('status-gif', 'status', 2200);
        spawnParticles(cw/2, ch/2, VISUAL_THEME.success);
    } else {
        title.innerText = "Run Over";
        title.className = "go-title title-lose font-display";
        msg.innerText = "Three strikes. Start a fresh board and try again.";
        playSfx('gameover', { volume: 0.26, cooldown: 200, wave: 'sawtooth', length: 0.22 });
        showGif('reaction-gif', 'reaction', 1800);
    }
}
