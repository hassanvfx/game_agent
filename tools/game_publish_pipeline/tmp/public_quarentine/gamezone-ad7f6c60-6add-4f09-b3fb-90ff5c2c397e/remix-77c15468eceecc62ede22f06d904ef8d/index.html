<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbit Courier: Signal Run</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Core Reset & Mobile Optimization */
        :root {
            --bg-deep: #050816;
            --bg-mid: #0c1433;
            --panel: rgba(10, 20, 44, 0.76);
            --panel-border: rgba(120, 219, 255, 0.34);
            --text-main: #f8fbff;
            --text-soft: #b6caea;
            --signal-cyan: #62e7ff;
            --signal-blue: #4c8dff;
            --signal-violet: #9b7cff;
            --signal-gold: #ffd95a;
            --signal-danger: #ff6b7d;
            --font-display: 'Orbitron', sans-serif;
            --font-ui: 'Rajdhani', system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(76, 141, 255, 0.16), transparent 34%),
                radial-gradient(circle at bottom, rgba(155, 124, 255, 0.16), transparent 30%),
                linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
            font-family: var(--font-ui);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

        .screen-reader-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Layout */
        .hidden { display: none !important; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .right-0 { right: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-xs { max-width: 20rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .text-left { text-align: left; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.75rem; }
        .border { border-width: 1px; border-style: solid; }
        .z-10 { z-index: 10; }

        /* Typography */
        .title-font,
        .hud-font,
        .button-font {
            font-family: var(--font-display);
        }

        .ui-font {
            font-family: var(--font-ui);
        }

        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .text-6xl { font-size: 3.75rem; line-height: 1; }
        .text-7xl { font-size: 4.5rem; line-height: 1; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .uppercase { text-transform: uppercase; }
        .leading-tight { line-height: 1.1; }
        .tracking-wide { letter-spacing: 0.08em; }
        .tracking-wider { letter-spacing: 0.14em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .tracking-tighter { letter-spacing: -0.05em; }

        .text-white { color: #ffffff; }
        .text-slate-200 { color: #e2e8f0; }
        .text-slate-300 { color: #cbd5e1; }
        .text-slate-400 { color: #94a3b8; }
        .text-sky-400 { color: #38bdf8; }
        .text-cyan-400 { color: #22d3ee; }

        /* Effects */
        .text-glow {
            text-shadow: 0 0 12px rgba(98, 231, 255, 0.68), 0 0 24px rgba(76, 141, 255, 0.2);
        }

        .shadow-xl {
            box-shadow: 0 20px 30px rgba(14, 165, 233, 0.18);
        }

        .shadow-lg {
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35);
        }

        .filter-glow {
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }

        /* Theme */
        .bg-slate-900 { background: #0f172a; }
        .bg-slate-900-80 { background: rgba(15, 23, 42, 0.8); }
        .bg-slate-800-50 { background: rgba(30, 41, 59, 0.5); }
        .border-slate-700 { border-color: rgba(51, 65, 85, 0.95); }
        .border-cyan-500 { border-color: rgba(6, 182, 212, 0.95); }

        .neon-panel {
            background:
                linear-gradient(180deg, rgba(19, 30, 63, 0.92), rgba(6, 13, 30, 0.88)),
                var(--panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 42px rgba(3, 8, 24, 0.5),
                0 0 24px rgba(98, 231, 255, 0.12),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        .neon-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 24%, transparent 70%, rgba(98, 231, 255, 0.08)),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 11px);
            opacity: 0.75;
            mix-blend-mode: screen;
        }

        .btn-neon {
            background: linear-gradient(135deg, var(--signal-cyan) 0%, var(--signal-blue) 60%, var(--signal-violet) 100%);
            color: #06101f;
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 0 18px rgba(98, 231, 255, 0.42);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
            position: relative;
            overflow: hidden;
            text-shadow: none;
        }

        .btn-neon:active {
            transform: scale(0.96);
            box-shadow: 0 0 8px rgba(98, 231, 255, 0.45);
            filter: brightness(1.04);
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 2.5s infinite;
        }

        .btn-icon {
            background: rgba(8, 16, 34, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--signal-cyan);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 0 0 1px rgba(98, 231, 255, 0.08), 0 8px 18px rgba(0, 0, 0, 0.28);
        }

        .btn-icon:active {
            transform: scale(0.9);
            background: rgba(98, 231, 255, 0.16);
        }

        .icon-button {
            width: 3rem;
            height: 3rem;
            font-size: 1.25rem;
        }

        .animate-float { animation: float 3s ease-in-out infinite; }

        .powerup-badge {
            animation: pulse-badge 1s infinite alternate;
        }

        .orb-swatch,
        .shield-swatch {
            width: 1rem;
            height: 1rem;
            border-radius: 9999px;
            flex: 0 0 auto;
        }

        .orb-swatch {
            background: #facc15;
            box-shadow: 0 0 10px orange;
        }

        .shield-swatch {
            background: #22d3ee;
            box-shadow: 0 0 10px cyan;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse-badge {
            from { box-shadow: 0 0 5px currentColor; }
            to { box-shadow: 0 0 15px currentColor; }
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: clamp(72px, 20vw, 116px);
            height: clamp(72px, 20vw, 116px);
            border-radius: 18px;
            border: 1px solid rgba(98, 231, 255, 0.28);
            background: rgba(5, 8, 22, 0.68);
            box-shadow: 0 10px 24px rgba(2, 6, 18, 0.45);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #gif-boost {
            top: 6.25rem;
        }

        #gif-alert {
            bottom: 1.25rem;
        }

        @media (max-width: 480px) {
            .feedback-gif {
                right: 0.55rem;
                width: 72px;
                height: 72px;
            }

            #gif-boost {
                top: 5.75rem;
            }

            #gif-alert {
                bottom: 0.75rem;
            }

            .p-8 { padding: 1.5rem; }
            .text-4xl { font-size: 1.9rem; }
            .text-6xl { font-size: 3rem; }
            .text-7xl { font-size: 3.75rem; }
        }
    </style>
</head>
<body>

    <!-- Assets -->
    <img id="asset_player" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" alt="" style="display:none;">

    <!-- [agent-note][stage3] resolved-audio: bgm + jump + score + shield + ui + gameover -> catalogs/audios.json -->
    <!-- Audio -->
    <audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
    <audio id="sfx_gate" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_shield" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
    <audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full bg-slate-900">
        <div aria-hidden="true" class="absolute inset-0 pointer-events-none">
            <div style="position:absolute;inset:0;background:
                radial-gradient(circle at 20% 18%, rgba(98,231,255,0.12), transparent 22%),
                radial-gradient(circle at 82% 16%, rgba(155,124,255,0.18), transparent 24%),
                linear-gradient(180deg, transparent 0%, rgba(2, 6, 18, 0.2) 100%);"></div>
            <div style="position:absolute;inset:0;opacity:0.38;background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 100% 28px, 28px 100%;"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: boost/fail overlays -> catalogs/gifs.json -->
        <img id="gif-boost" class="feedback-gif pointer-events-none" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp" alt="Boost reaction" aria-hidden="true">
        <img id="gif-alert" class="feedback-gif pointer-events-none" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Alert reaction" aria-hidden="true">

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-center items-center z-10">

            <!-- HUD -->
            <div id="hud" class="absolute top-0 left-0 right-0 p-6 flex justify-between items-start w-full pointer-events-auto">
                <div class="flex flex-col">
                    <span id="score-current" class="title-font text-6xl font-black text-white text-glow tracking-tighter">0</span>
                    <div id="shield-indicator" class="hidden mt-2 flex items-center gap-2 text-cyan-400 font-bold uppercase text-xs tracking-widest powerup-badge px-3 py-1 rounded-full border border-cyan-500 bg-slate-900-80">
                        <span>🛡️ Signal Buffer Ready</span>
                    </div>
                </div>
                <button id="btn-sound" class="btn-icon icon-button shadow-lg" aria-label="Toggle sound">
                    🔊
                </button>
            </div>

            <!-- Start Screen -->
            <div id="screen-start" class="neon-panel p-8 flex flex-col items-center text-center pointer-events-auto max-w-xs animate-float mx-4">
                <div class="mb-4 text-5xl filter-glow">🤖</div>
                <h1 class="title-font text-4xl font-black text-white mb-1 leading-tight text-glow uppercase tracking-wide">Orbit<br><span class="text-sky-400">Courier</span></h1>
                <p class="ui-font text-slate-300 mb-2 text-sm tracking-widest font-bold uppercase">Pilot the emoji drone through neon relay gates.</p>
                <p class="ui-font text-slate-400 mb-6 text-xs tracking-wider font-bold uppercase">Collect bright data cores. Protect the signal shell.</p>

                <div class="flex gap-4 mb-8 text-xs text-left bg-slate-800-50 p-3 rounded-lg border border-slate-700">
                     <div class="flex items-center gap-2 ui-font">
                         <div class="orb-swatch"></div>
                         <span class="text-slate-200">🌟 Data Core +5</span>
                     </div>
                     <div class="flex items-center gap-2 ui-font">
                         <div class="shield-swatch"></div>
                         <span class="text-slate-200">🛡 Emoji Shell</span>
                     </div>
                </div>

                <button id="btn-start" class="btn-neon button-font px-12 py-4 rounded-full text-xl font-bold w-full shadow-xl uppercase tracking-wider">
                    Launch Run
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="screen-gameover" class="hidden neon-panel p-8 flex flex-col items-center text-center pointer-events-auto max-w-xs mx-4">
                <h2 class="title-font text-3xl font-black text-white mb-2 text-glow">Link Lost</h2>
                <div class="ui-font text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Signal Delivered</div>
                <div id="score-final" class="title-font text-7xl font-black text-sky-400 mb-8 text-glow">0</div>
                <button id="btn-restart" class="btn-neon button-font px-10 py-4 rounded-full text-xl font-bold w-full uppercase tracking-wider">
                    Relay Again
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- Configuration ---
        const CONFIG = {
            gravity: 0.22,
            jumpForce: 5.2,
            speed: 3.0,
            gapSize: 200,
            spawnRate: 130, // Frames between gates
            pillarWidth: 65,
            heroRadius: 18,
            hitboxRatio: 0.75,
            itemChance: 0.6, // 60% chance to spawn item in gap
            invincibilityFrames: 90 // 1.5 seconds at 60fps
        };

        // --- Audio System ---
        const AudioSys = {
            ctx: null,
            muted: false,
            lastPlayAt: {},
            volumes: {
                bgm: 0.2,
                jump: 0.34,
                gate: 0.26,
                collect: 0.34,
                shield: 0.38,
                hit: 0.48,
                ui: 0.24
            },
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            },
            toggle() {
                this.muted = !this.muted;
                const btn = document.getElementById('btn-sound');
                btn.textContent = this.muted ? '🔇' : '🔊';

                const bgm = document.getElementById('bgm_main');
                if (bgm) {
                    if (this.muted) {
                        bgm.pause();
                    } else if (state.mode === 'playing') {
                        this.playBGM();
                    }
                }
            },
            canReplay(key, delay = 90) {
                const now = performance.now();
                if (this.lastPlayAt[key] && now - this.lastPlayAt[key] < delay) return false;
                this.lastPlayAt[key] = now;
                return true;
            },
            play(id, key, fallbackType = null, delay = 90) {
                if (this.muted || !this.ctx || !this.canReplay(key, delay)) return;

                const el = document.getElementById(id);
                if (el) {
                    el.pause();
                    el.currentTime = 0;
                    el.volume = this.volumes[key] ?? 0.32;
                    el.play().catch(() => {
                        if (fallbackType) this.synth(fallbackType);
                    });
                } else if (fallbackType) {
                    this.synth(fallbackType);
                }
            },
            playBGM() {
                if (this.muted) return;
                const el = document.getElementById('bgm_main');
                if (el) {
                    el.volume = this.volumes.bgm;
                    el.loop = true;
                    el.play().catch(() => {});
                }
            },
            stopBGM(reset = true) {
                const el = document.getElementById('bgm_main');
                if (el) {
                    el.pause();
                    if (reset) el.currentTime = 0;
                }
            },
            synth(type) {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'pickup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'shieldBreak' || type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.28);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.28);
                }
            }
        };

        const GifFx = {
            timers: {},
            show(id, duration = 1200) {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.add('is-visible');
                clearTimeout(this.timers[id]);
                this.timers[id] = setTimeout(() => {
                    el.classList.remove('is-visible');
                }, duration);
            },
            hideAll() {
                ['gif-boost', 'gif-alert'].forEach((id) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.classList.remove('is-visible');
                    clearTimeout(this.timers[id]);
                });
            }
        };

        // --- Game State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let state = {
            mode: 'start',
            score: 0,
            frames: 0,
            width: 0,
            height: 0
        };

        let hero = {
            x: 0, y: 0, vy: 0, rot: 0,
            shield: false,
            invincibleTimer: 0
        };

        let obstacles = [];
        let items = [];
        let particles = [];
        let stars = [];

        // --- Resize & Init ---
        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;

            if (state.mode === 'start') {
                hero.x = state.width * 0.3;
                hero.y = state.height * 0.45;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function createStar() {
            return {
                x: Math.random() * state.width,
                y: Math.random() * state.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1,
                alpha: Math.random()
            };
        }

        function initGame() {
            AudioSys.init();

            state.mode = 'playing';
            state.score = 0;
            state.frames = 0;

            hero.x = state.width * 0.3;
            hero.y = state.height * 0.45;
            hero.vy = -CONFIG.jumpForce * 0.5;
            hero.rot = 0;
            hero.shield = false;
            hero.invincibleTimer = 0;

            obstacles = [];
            items = [];
            particles = [];

            // Init Stars
            stars = [];
            for (let i = 0; i < 80; i++) stars.push(createStar());

            // UI
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-gameover').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('shield-indicator').classList.add('hidden');
            document.getElementById('score-current').textContent = '0';
            document.getElementById('score-current').classList.remove('hidden');

            AudioSys.playBGM();
        }

        function spawnObstacle() {
            const minH = 100;
            const maxH = state.height - CONFIG.gapSize - minH;
            const safeMax = Math.max(minH + 10, maxH);
            const topH = Math.random() * (safeMax - minH) + minH;

            obstacles.push({
                x: state.width,
                topH: topH,
                passed: false,
                colorType: Math.floor(Math.random() * 4)
            });

            if (Math.random() < CONFIG.itemChance) {
                const typeRoll = Math.random();
                const type = typeRoll < 0.7 ? 'score' : 'shield';

                items.push({
                    x: state.width + CONFIG.pillarWidth / 2,
                    y: topH + CONFIG.gapSize / 2,
                    type: type,
                    collected: false,
                    oscOffset: Math.random() * Math.PI * 2
                });
            }
        }

        function jump() {
            if (state.mode !== 'playing') return;

            hero.vy = -CONFIG.jumpForce;

            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: hero.x - 5,
                    y: hero.y + CONFIG.heroRadius,
                    vx: (Math.random() - 0.5) * 2,
                    vy: Math.random() * 3 + 1,
                    life: 1.0,
                    color: '#38bdf8',
                    size: Math.random() * 2 + 1
                });
            }

            AudioSys.play('sfx_jump', 'jump', 'jump', 110);
        }

        function triggerShieldBreak() {
            hero.shield = false;
            hero.invincibleTimer = CONFIG.invincibilityFrames;
            document.getElementById('shield-indicator').classList.add('hidden');
            AudioSys.play('sfx_hit', 'hit', 'shieldBreak', 180);
            GifFx.show('gif-alert', 1100);

            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: hero.x,
                    y: hero.y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.2,
                    color: '#22d3ee',
                    size: Math.random() * 4 + 2
                });
            }

            let shake = 10;
            const shakeInterval = setInterval(() => {
                canvas.style.transform = `translate(${Math.random() * shake - shake / 2}px, ${Math.random() * shake - shake / 2}px)`;
                shake *= 0.8;
                if (shake < 0.5) {
                    clearInterval(shakeInterval);
                    canvas.style.transform = 'none';
                }
            }, 16);
        }

        function gameOver() {
            if (hero.invincibleTimer > 0) return;

            if (hero.shield) {
                triggerShieldBreak();
                return;
            }

            state.mode = 'gameover';
            AudioSys.stopBGM();
            AudioSys.play('sfx_hit', 'hit', 'hit', 180);
            GifFx.show('gif-alert', 1800);

            document.getElementById('score-current').classList.add('hidden');
            document.getElementById('shield-indicator').classList.add('hidden');
            document.getElementById('screen-gameover').classList.remove('hidden');
            document.getElementById('score-final').textContent = state.score;

            let shake = 20;
            const shakeInterval = setInterval(() => {
                canvas.style.transform = `translate(${Math.random() * shake - shake / 2}px, ${Math.random() * shake - shake / 2}px)`;
                shake *= 0.85;
                if (shake < 0.5) {
                    clearInterval(shakeInterval);
                    canvas.style.transform = 'none';
                }
            }, 16);
        }

        // --- Core Loop ---
        function update() {
            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = state.width;
            });

            if (state.mode === 'start') {
                hero.y = state.height * 0.45 + Math.sin(Date.now() / 400) * 10;
                hero.rot = Math.sin(Date.now() / 300) * 0.1;
            }
            else if (state.mode === 'playing') {
                if (hero.invincibleTimer > 0) hero.invincibleTimer--;

                hero.vy += CONFIG.gravity;
                hero.y += hero.vy;

                let targetRot = Math.min(Math.PI / 3.5, Math.max(-Math.PI / 3.5, (hero.vy * 0.08)));
                hero.rot += (targetRot - hero.rot) * 0.15;

                if (hero.y + CONFIG.heroRadius > state.height || hero.y - CONFIG.heroRadius < -50) {
                    gameOver();
                }

                if (state.frames % CONFIG.spawnRate === 0) spawnObstacle();

                obstacles.forEach(ob => {
                    ob.x -= CONFIG.speed;

                    const hitX = hero.x + CONFIG.heroRadius * 0.2;
                    const hitR = CONFIG.heroRadius * CONFIG.hitboxRatio;

                    if (hitX + hitR > ob.x && hitX - hitR < ob.x + CONFIG.pillarWidth) {
                        if (hero.y - hitR < ob.topH || hero.y + hitR > ob.topH + CONFIG.gapSize) {
                            gameOver();
                        }
                    }

                    if (!ob.passed && ob.x + CONFIG.pillarWidth < hero.x) {
                        ob.passed = true;
                        state.score++;
                        document.getElementById('score-current').textContent = state.score;
                        AudioSys.play('sfx_gate', 'gate', 'pickup', 80);
                    }
                });

                items.forEach(it => {
                    it.x -= CONFIG.speed;

                    const dx = hero.x - it.x;
                    const dy = hero.y - it.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (!it.collected && dist < CONFIG.heroRadius + 15) {
                        it.collected = true;

                        if (it.type === 'score') {
                            state.score += 5;
                            document.getElementById('score-current').textContent = state.score;
                            GifFx.show('gif-boost', 900);
                            AudioSys.play('sfx_collect', 'collect', 'pickup', 120);
                            for (let i = 0; i < 8; i++) {
                                particles.push({
                                    x: it.x, y: it.y,
                                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                                    life: 1, color: '#facc15', size: 3
                                });
                            }
                        } else if (it.type === 'shield') {
                            hero.shield = true;
                            document.getElementById('shield-indicator').classList.remove('hidden');
                            GifFx.show('gif-boost', 1300);
                            AudioSys.play('sfx_shield', 'shield', 'pickup', 140);
                            for (let i = 0; i < 8; i++) {
                                particles.push({
                                    x: it.x, y: it.y,
                                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                                    life: 1, color: '#22d3ee', size: 3
                                });
                            }
                        }
                        
                    }
                });

                obstacles = obstacles.filter(ob => ob.x > -100);
                items = items.filter(it => it.x > -100 && !it.collected);
            }

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
            });
            particles = particles.filter(p => p.life > 0);

            if (state.mode === 'playing') state.frames++;
        }

        function getNeonColor(type) {
            switch(type) {
                case 0: return '#0ea5e9';
                case 1: return '#d946ef';
                case 2: return '#8b5cf6';
                case 3: return '#10b981';
                default: return '#fff';
            }
        }

        function draw() {
            const pulse = Math.sin(state.frames / 10) * 0.05;
            const grad = ctx.createLinearGradient(0, 0, 0, state.height);
            grad.addColorStop(0, '#020617');
            grad.addColorStop(1, `rgba(30, 27, 75, ${0.8 + pulse})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, state.width, state.height);

            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha * (0.5 + Math.sin(Date.now() / 500 + s.x) * 0.3);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            obstacles.forEach(ob => {
                const color = getNeonColor(ob.colorType);

                ctx.shadowBlur = 15;
                ctx.shadowColor = color;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.roundRect(ob.x, -50, CONFIG.pillarWidth, ob.topH + 50, 8);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.roundRect(ob.x, ob.topH + CONFIG.gapSize, CONFIG.pillarWidth, state.height, 8);
                ctx.fill();
                ctx.stroke();

                ctx.shadowBlur = 0;
            });

            items.forEach(it => {
                const floatY = Math.sin(state.frames * 0.1 + it.oscOffset) * 5;
                const y = it.y + floatY;

                ctx.save();
                ctx.translate(it.x, y);

                if (it.type === 'score') {
                    ctx.shadowColor = '#facc15';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                } else if (it.type === 'shield') {
                    ctx.shadowColor = '#22d3ee';
                    ctx.shadowBlur = 20;
                    ctx.strokeStyle = '#22d3ee';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 14, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(34, 211, 238, 0.3)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
                    ctx.moveTo(0, -6); ctx.lineTo(0, 6);
                    ctx.stroke();
                }

                ctx.restore();
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.save();
            ctx.translate(hero.x, hero.y);

            if (hero.invincibleTimer > 0) {
                if (Math.floor(state.frames / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.3;
                }
            }

            ctx.rotate(hero.rot);

            const img = document.getElementById('asset_player');
            const size = CONFIG.heroRadius * 2.8;

            if (hero.shield) {
                ctx.shadowColor = '#22d3ee';
                ctx.shadowBlur = 15;
                ctx.strokeStyle = '#22d3ee';
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(34, 211, 238, 0.15)';
                ctx.beginPath();
                ctx.arc(0, 0, CONFIG.heroRadius + 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 20;

            if (img && img.complete && img.naturalWidth > 0) {
                ctx.beginPath();
                ctx.arc(0, 0, CONFIG.heroRadius, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(img, -size / 2, -size / 2, size, size);

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(0, 0, CONFIG.heroRadius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- Input ---
        document.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return;
            if (state.mode === 'playing') {
                e.preventDefault();
                jump();
            }
        }, { passive: false });

        document.getElementById('btn-start').addEventListener('click', (e) => {
            e.stopPropagation();
            AudioSys.play('sfx_ui', 'ui', null, 120);
            initGame();
        });

        document.getElementById('btn-restart').addEventListener('click', (e) => {
            e.stopPropagation();
            AudioSys.play('sfx_ui', 'ui', null, 120);
            initGame();
        });

        document.getElementById('btn-sound').addEventListener('click', (e) => {
            e.stopPropagation();
            AudioSys.toggle();
        });

        document.getElementById('screen-start').classList.add('ui-font');
        document.getElementById('screen-gameover').classList.add('ui-font');
        requestAnimationFrame(loop);
    </script>
</body>
</html>
