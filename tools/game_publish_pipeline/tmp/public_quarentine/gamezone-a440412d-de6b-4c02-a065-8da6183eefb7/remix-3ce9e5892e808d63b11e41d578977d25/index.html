<script>
const ENABLE_ANIMATIONS = true;

// --- §1 Core Engine & State ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let lastTime = 0;
let gameState = 'MENU'; // MENU, PLAY, GAMEOVER
let score = 0;
let frames = 0;

// Config
window.gameConfig = {
    heroSpeed: 6,
    jumpForce: 14,
    gravity: 0.6,
    skyColor: "#40A0E0"
};

// Input State
const input = { left: false, right: false, jump: false, jumpPressed: false };

// --- §2 Audio System ---
class AudioController {
    constructor() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = AudioCtx ? new AudioCtx() : null;
        this.bgm = document.getElementById('bgm_main');
        this.sounds = {
            jump: document.getElementById('sfx_jump'),
            land: document.getElementById('sfx_land'),
            die: document.getElementById('sfx_die'),
            win: document.getElementById('sfx_win'),
            ui: document.getElementById('sfx_ui')
        };
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.fallbackEnabled = Boolean(this.ctx);
        if (this.bgm) this.bgm.volume = 0.2;
        Object.values(this.sounds).forEach((el) => {
            if (el) el.volume = 0.52;
        });
    }

    unlock() {
        if (!this.ctx) {
            this.unlocked = true;
            this.safePlayLoop();
            return;
        }
        if (this.unlocked) {
            this.safePlayLoop();
            return;
        }
        this.ctx.resume()
            .then(() => {
                this.unlocked = true;
                this.safePlayLoop();
            })
            .catch(() => {});
    }

    safePlayLoop() {
        if (!this.bgm) return;
        this.bgm.play().catch(() => {});
    }

    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    }

    playSfx(id, minGap = 90) {
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < minGap) return;
        this.lastPlayedAt[id] = now;
        const el = this.sounds[id];
        if (el && this.unlocked) {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => this.synthesize(id));
            return;
        }
        if (this.unlocked) {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        if (!this.ctx || !this.fallbackEnabled) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'jump') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(340, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(660, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } else if (type === 'land') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        } else if (type === 'ui' || type === 'win') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(760, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.16);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(48, this.ctx.currentTime + 0.32);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.32);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.32);
        }
    }
}
const audio = new AudioController();

// --- §3 Game Entities ---

function drawNeonBlock(ctx, x, y, w, h, faceColors, depth, glowColor) {
    const front = faceColors.front;
    const top = faceColors.top;
    const side = faceColors.side;

    if (glowColor) {
        ctx.save();
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 14;
        ctx.fillStyle = front;
        ctx.fillRect(x, y, w, h);
        ctx.restore();
    } else {
        ctx.fillStyle = front;
        ctx.fillRect(x, y, w, h);
    }

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + depth, y - depth);
    ctx.lineTo(x + w + depth, y - depth);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fillStyle = top;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w + depth, y - depth);
    ctx.lineTo(x + w + depth, y + h - depth);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fillStyle = side;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

function adjustColor(hex, amount) {
    let usePound = false;
    if (hex[0] === "#") { hex = hex.slice(1); usePound = true; }
    let num = parseInt(hex, 16);
    let r = (num >> 16) + amount;
    if (r > 255) r = 255; else if (r < 0) r = 0;
    let b = ((num >> 8) & 0x00FF) + amount;
    if (b > 255) b = 255; else if (b < 0) b = 0;
    let g = (num & 0x0000FF) + amount;
    if (g > 255) g = 255; else if (g < 0) g = 0;
    return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
}

class Player {
    constructor() {
        this.w = 30;
        this.h = 60;
        this.x = 100;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.dead = false;
        this.animTimer = 0;
        this.spawnX = 100;
        this.spawnY = 300;
        this.reset();
    }

    reset() {
        this.x = this.spawnX;
        this.y = this.spawnY;
        this.vx = 0;
        this.vy = 0;
        this.dead = false;
        this.onGround = false;
    }

    update() {
        if (this.dead) return;

        if (input.left) this.vx = -window.gameConfig.heroSpeed;
        else if (input.right) this.vx = window.gameConfig.heroSpeed;
        else this.vx *= 0.8;

        this.x += this.vx;

        if (input.jumpPressed && this.onGround) {
            this.vy = -window.gameConfig.jumpForce;
            this.onGround = false;
            audio.playSfx('jump', 110);
            createParticles(this.x + this.w / 2, this.y + this.h, 5, '#fff');
            input.jumpPressed = false;
        }

        this.vy += window.gameConfig.gravity;
        this.y += this.vy;

        if (Math.abs(this.vx) > 0.5) this.animTimer += 0.2;
        else this.animTimer = 0;

        if (this.y > 2000) {
            this.die();
        }
    }

    draw(ctx, camX) {
        if (this.dead) return;

        const drawX = this.x - camX;
        const drawY = this.y;
        const bob = ENABLE_ANIMATIONS ? Math.sin(this.animTimer) * 3 : 0;
        const legOffset = ENABLE_ANIMATIONS ? Math.sin(this.animTimer) * 5 : 0;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(drawX + 3, drawY + 58, 26, 6);

        ctx.fillStyle = '#8e7bff';
        ctx.fillRect(drawX + 5, drawY + 40, 10, 20 + legOffset);
        ctx.fillRect(drawX + 15, drawY + 40, 10, 20 - legOffset);

        ctx.fillStyle = '#5c2eff';
        ctx.fillRect(drawX + 5, drawY + 54 + legOffset, 10, 6);
        ctx.fillRect(drawX + 15, drawY + 54 - legOffset, 10, 6);

        ctx.fillStyle = '#27a5ff';
        ctx.fillRect(drawX, drawY + 20 + bob, 30, 20);

        ctx.fillStyle = '#ff5ab6';
        ctx.fillRect(drawX + 10, drawY + 25 + bob, 10, 6);

        ctx.fillStyle = '#ffe17d';
        ctx.fillRect(drawX + 5, drawY + bob, 20, 20);

        ctx.fillStyle = '#ffd1ee';
        ctx.fillRect(drawX + 9, drawY + 8 + bob, 12, 5);

        ctx.fillStyle = '#ffe17d';
        ctx.fillRect(drawX - 5, drawY + 22 + bob + legOffset, 8, 18);
        ctx.fillRect(drawX + 27, drawY + 22 + bob - legOffset, 8, 18);

        ctx.fillStyle = '#ff5ab6';
        ctx.fillRect(drawX + 8, drawY + 9 + bob, 14, 4);

        ctx.fillStyle = '#131527';
        if (this.vx > 0) {
            ctx.fillRect(drawX + 18, drawY + 6 + bob, 2, 4);
            ctx.fillRect(drawX + 22, drawY + 6 + bob, 2, 4);
            ctx.fillRect(drawX + 19, drawY + 13 + bob, 4, 2);
        } else if (this.vx < 0) {
            ctx.fillRect(drawX + 6, drawY + 6 + bob, 2, 4);
            ctx.fillRect(drawX + 10, drawY + 6 + bob, 2, 4);
            ctx.fillRect(drawX + 7, drawY + 13 + bob, 4, 2);
        } else {
            ctx.fillRect(drawX + 10, drawY + 6 + bob, 2, 4);
            ctx.fillRect(drawX + 18, drawY + 6 + bob, 2, 4);
            ctx.fillRect(drawX + 12, drawY + 13 + bob, 6, 2);
        }
    }

    die() {
        if (this.dead) return;
        this.dead = true;
        audio.playSfx('die');
        createExplosion(this.x, this.y);
        setTimeout(() => {
            endGame();
        }, 1000);
    }
}

class Platform {
    constructor(x, y, w, h, type) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.type = type;
        this.color = type === 'lava' ? '#FF3333' : (type === 'goal' ? '#FFD700' : '#A3A3A3');
    }

    draw(ctx, camX) {
        if (this.x - camX > canvas.width || this.x + this.w - camX < 0) return;
        const drawX = this.x - camX;
        if (this.type === 'lava') {
            drawNeonBlock(ctx, drawX, this.y, this.w, this.h, {
                top: '#ffb468',
                front: '#ff6a47',
                side: '#85203f'
            }, 15, 'rgba(255, 106, 71, 0.42)');
        } else if (this.type === 'goal') {
            drawNeonBlock(ctx, drawX, this.y, this.w, this.h, {
                top: '#fff5bb',
                front: '#ffd45f',
                side: '#d88d1f'
            }, 15, 'rgba(255, 212, 95, 0.4)');
            drawGoalBeacon(drawX + this.w / 2, this.y - 48);
        } else {
            drawNeonBlock(ctx, drawX, this.y, this.w, this.h, {
                top: '#d6f6ff',
                front: '#79bce6',
                side: '#2b5b91'
            }, 15, 'rgba(122, 244, 255, 0.2)');
        }
    }
}

function drawGoalBeacon(x, y) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 215, 95, 0.22)';
    ctx.fillRect(x - 8, y - 40, 16, 40);
    ctx.fillStyle = '#fff5bb';
    ctx.fillRect(x - 4, y - 32, 8, 32);
    ctx.fillStyle = '#ff5ab6';
    ctx.fillRect(x + 4, y - 32, 14, 10);
    ctx.restore();
}

// --- §4 World Generation ---
const platforms = [];
const particles = [];
const player = new Player();
let cameraX = 0;
let lastLandingState = false;
let feedbackTimer = null;

function generateLevel() {
    platforms.length = 0;
    let cx = 50;
    let cy = 400;

    platforms.push(new Platform(cx, cy, 200, 40, 'normal'));
    player.spawnX = 100;
    player.spawnY = 300;
    player.reset();

    cx += 250;

    for (let i = 0; i < 50; i++) {
        const type = Math.random() > 0.8 ? 'lava' : 'normal';
        const w = 80 + Math.random() * 100;
        const gap = 80 + Math.random() * 120;
        const hChange = (Math.random() - 0.5) * 100;

        cy += hChange;
        if (cy < 200) cy = 200;
        if (cy > 600) cy = 600;

        if (type === 'lava') {
            platforms.push(new Platform(cx, cy, w, 40, 'lava'));
        } else {
            platforms.push(new Platform(cx, cy, w, 40, 'normal'));
        }
        cx += w + gap;
    }

    platforms.push(new Platform(cx, cy - 50, 100, 40, 'goal'));
}

// --- §5 Physics & Juice ---

function checkCollisions() {
    player.onGround = false;

    for (const p of platforms) {
        if (player.x < p.x + p.w &&
            player.x + player.w > p.x &&
            player.y < p.y + p.h &&
            player.y + player.h > p.y) {

            const overlapX = (player.w + p.w) / 2 - Math.abs((player.x + player.w / 2) - (p.x + p.w / 2));
            const overlapY = (player.h + p.h) / 2 - Math.abs((player.y + player.h / 2) - (p.y + p.h / 2));

            if (overlapY < overlapX) {
                if (player.vy > 0 && player.y + player.h / 2 < p.y + p.h / 2) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    if (p.type === 'lava') player.die();
                    if (p.type === 'goal') {
                        audio.playSfx('win', 250);
                        createParticles(player.x, player.y, 50, '#FFD700');
                        showFeedbackGif('win');
                        setTimeout(generateLevel, 1000);
                    }
                } else if (player.vy < 0) {
                    player.y = p.y + p.h;
                    player.vy = 0;
                }
            } else {
                if (player.vx > 0) player.x = p.x - player.w;
                else if (player.vx < 0) player.x = p.x + p.w;
                player.vx = 0;
            }
        }
    }
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color
        });
    }
}

function createExplosion(x, y) {
    const parts = [
        { c: '#ffe17d', w: 20, h: 20 },
        { c: '#27a5ff', w: 30, h: 20 },
        { c: '#ffe17d', w: 8, h: 18 },
        { c: '#ffe17d', w: 8, h: 18 },
        { c: '#8e7bff', w: 10, h: 20 },
        { c: '#8e7bff', w: 10, h: 20 }
    ];

    parts.forEach(p => {
        particles.push({
            x: x + Math.random() * 20,
            y: y + Math.random() * 40,
            w: p.w, h: p.h,
            vx: (Math.random() - 0.5) * 15,
            vy: -5 - Math.random() * 10,
            life: 2.0,
            color: p.c,
            isBlock: true,
            rot: 0,
            vRot: (Math.random() - 0.5) * 0.5
        });
    });
}

function showFeedbackGif(type) {
    const target = document.getElementById(type === 'win' ? 'win-gif' : 'fail-gif');
    const other = document.getElementById(type === 'win' ? 'fail-gif' : 'win-gif');
    if (!target || !other) return;
    other.classList.add('hidden');
    target.classList.remove('hidden');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
        target.classList.add('hidden');
    }, type === 'win' ? 1800 : 1500);
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= 0.02;
        if (p.isBlock) p.rot += p.vRot;

        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles(ctx, camX) {
    for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        if (p.isBlock) {
            ctx.save();
            ctx.translate(p.x - camX, p.y);
            ctx.rotate(p.rot);
            drawNeonBlock(ctx, -p.w / 2, -p.h / 2, p.w, p.h, {
                top: adjustColor(p.color, 40),
                front: p.color,
                side: adjustColor(p.color, -45)
            }, 8, p.color);
            ctx.restore();
        } else {
            ctx.beginPath();
            ctx.arc(p.x - camX, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
    }
}

// --- §6 Main Loop ---

function init() {
    resize();
    window.addEventListener('resize', resize);

    const bindBtn = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            input[key] = true;
            if (key === 'jump') input.jumpPressed = true;
            audio.unlock();
            el.classList.add('is-pressed');
        });
        const end = (e) => {
            e.preventDefault();
            input[key] = false;
            el.classList.remove('is-pressed');
        };
        el.addEventListener('pointerup', end);
        el.addEventListener('pointercancel', end);
        el.addEventListener('pointerleave', end);
    };

    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');
    bindBtn('btn-jump', 'jump');

    window.addEventListener('keydown', (e) => {
        audio.unlock();
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            input.jump = true;
            input.jumpPressed = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
        if (e.code === 'Space' || e.code === 'ArrowUp') input.jump = false;
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    generateLevel();
    requestAnimationFrame(loop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

    function startGame() {
        audio.unlock();
        audio.playSfx('ui', 120);
        gameState = 'PLAY';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('controls').classList.remove('hidden');
        document.getElementById('fail-gif').classList.add('hidden');
        document.getElementById('win-gif').classList.add('hidden');
        score = 0;
        lastLandingState = false;
        generateLevel();
    }

function endGame() {
    gameState = 'GAMEOVER';
    audio.stopLoop();
    showFeedbackGif('fail');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('finalScore').innerText = Math.floor(score);
}

function drawBackground(timestamp) {
    const gradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    gradient.addColorStop(0, adjustColor(window.gameConfig.skyColor, 30));
    gradient.addColorStop(0.55, window.gameConfig.skyColor);
    gradient.addColorStop(1, '#120b2d');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    for (let i = 0; i < 5; i++) {
        const cx = ((timestamp * 0.02 * (i + 1)) + i * 220) % (window.innerWidth + 220) - 110;
        ctx.beginPath();
        ctx.arc(cx, 100 + i * 44, 38 + i * 10, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.strokeStyle = 'rgba(122, 244, 255, 0.09)';
    ctx.lineWidth = 1;
    for (let y = 0; y < window.innerHeight; y += 48) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(window.innerWidth, y);
        ctx.stroke();
    }
}

function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    frames += dt;

    try {
        drawBackground(timestamp);

        if (gameState === 'PLAY') {
            player.update();
            checkCollisions();

            if (player.onGround && !lastLandingState && Math.abs(player.vy) < 0.001) {
                audio.playSfx('land', 120);
            }
            lastLandingState = player.onGround;

            const targetCamX = player.x - window.innerWidth / 3;
            cameraX += (targetCamX - cameraX) * 0.1;

            score = Math.max(score, player.x / 100);
            document.getElementById('scoreVal').innerText = Math.floor(score);
        } else {
            lastLandingState = false;
        }

        updateParticles();

        platforms.forEach(p => p.draw(ctx, cameraX));
        player.draw(ctx, cameraX);
        drawParticles(ctx, cameraX);

    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(loop);
}

window.addEventListener('DOMContentLoaded', init);

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};
