<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Neon Drift: Compact Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-primary: #42f57b;
            --c-primary-deep: #1db954;
            --c-secondary: #ff4fd8;
            --c-secondary-soft: #9d5cff;
            --c-warning: #ff6b6b;
            --c-bg: #050505;
            --c-bg-deep: #03030a;
            --c-panel: rgba(9, 14, 24, 0.82);
            --c-panel-strong: rgba(8, 12, 18, 0.92);
            --c-text: #f7fbff;
            --c-muted: #96a5c4;
            --c-track: #12131a;
            --c-glass-border: rgba(130, 255, 210, 0.22);
            --font-main: 'Rajdhani', system-ui, sans-serif;
            --font-display: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 50% 10%, rgba(157, 92, 255, 0.18), transparent 34%),
                radial-gradient(circle at 50% 100%, rgba(66, 245, 123, 0.12), transparent 28%),
                linear-gradient(180deg, #020203 0%, #04050b 55%, #050505 100%);
            color: var(--c-text);
            font-family: var(--font-main);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .app-shell {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .game-container {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 16%, rgba(157, 92, 255, 0.16), transparent 32%),
                linear-gradient(180deg, #050510 0%, #080811 100%);
        }

        .overlay-full {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* FX */
        .scanlines {
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1),
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 10;
        }

        .crt-glow {
            box-shadow: inset 0 0 50px rgba(0,0,0,0.7);
            z-index: 11;
        }

        .neon-vignette {
            background:
                radial-gradient(circle at 50% 5%, rgba(255,255,255,0.08), transparent 18%),
                radial-gradient(circle at 50% 120%, rgba(0,0,0,0.8), transparent 46%);
            mix-blend-mode: screen;
            opacity: 0.55;
            z-index: 12;
        }

        .glitch-text {
            text-shadow: 2px 0 var(--c-secondary), -2px 0 var(--c-primary);
            animation: glitch 3s infinite alternate;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 0 var(--c-secondary), -2px 0 var(--c-primary); }
            95% { text-shadow: 2px 0 var(--c-secondary), -2px 0 var(--c-primary); }
            96% { text-shadow: -2px 0 var(--c-primary), 2px 0 var(--c-secondary); transform: skewX(5deg); }
            97% { text-shadow: 2px 0 var(--c-secondary), -2px 0 var(--c-primary); transform: skewX(0deg); }
            98% { text-shadow: -1px 0 var(--c-primary), 1px 0 var(--c-secondary); transform: translate(2px, 0); }
            100% { text-shadow: 2px 0 var(--c-secondary), -2px 0 var(--c-primary); transform: translate(0, 0); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.22; transform: scale(0.98); }
            50% { opacity: 0.38; transform: scale(1.02); }
        }

        @keyframes floatGlyph {
            0%, 100% { transform: translateY(0); opacity: 0.35; }
            50% { transform: translateY(-8px); opacity: 0.75; }
        }

        .safe-top {
            padding-top: max(16px, env(safe-area-inset-top));
        }

        .safe-bottom {
            padding-bottom: max(14px, env(safe-area-inset-bottom));
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .hud-panel {
            min-width: 116px;
            padding: 10px 12px;
            background:
                linear-gradient(180deg, rgba(15, 22, 34, 0.96), rgba(5, 8, 16, 0.92));
            backdrop-filter: blur(6px);
            border: 1px solid var(--c-glass-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.02) inset,
                0 0 18px rgba(66, 245, 123, 0.08),
                0 10px 22px rgba(0,0,0,0.35);
            transform: skewX(-10deg);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }

        .hud-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent 36%);
            pointer-events: none;
        }

        .hud-panel > * {
            transform: skewX(10deg);
        }

        .hud-left {
            border-left: 4px solid var(--c-primary);
        }

        .hud-right {
            border-right: 4px solid var(--c-secondary);
            text-align: right;
        }

        .hud-label {
            font-size: 10px;
            color: #8190ad;
            text-transform: uppercase;
            letter-spacing: 0.32em;
            margin-bottom: 4px;
        }

        .hud-value {
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.12em;
            line-height: 1;
        }

        .hud-value.score {
            font-size: 28px;
        }

        .hud-value.speed {
            font-size: 34px;
            color: var(--c-primary);
        }

        .hud-unit {
            font-size: 11px;
            color: #fff;
            vertical-align: top;
            margin-left: 2px;
        }

        /* Feedback */
        .feedback {
            position: absolute;
            top: 33%;
            left: 0;
            z-index: 30;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        .feedback-text {
            display: inline-block;
            padding: 10px 18px;
            color: var(--c-primary);
            font-family: var(--font-display);
            font-size: clamp(34px, 9vw, 54px);
            font-weight: 700;
            font-style: italic;
            opacity: 0;
            transform: scale(1.5);
            transition: all 0.2s ease;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(8, 12, 18, 0.14), rgba(8, 12, 18, 0.28));
            border: 1px solid rgba(66, 245, 123, 0.16);
            box-shadow: 0 0 24px rgba(66, 245, 123, 0.12);
        }


        .reaction-gif {
            position: absolute;
            right: 12px;
            width: clamp(68px, 18vw, 112px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 14px 26px rgba(0,0,0,0.28);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 32;
        }

        .reaction-gif.visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .reaction-gif.bonus-gif {
            top: 88px;
        }

        .reaction-gif.crash-gif {
            top: 188px;
        }

        @media (max-width: 640px) {
            .reaction-gif {
                right: 8px;
                width: 72px;
            }

            .reaction-gif.bonus-gif {
                top: 72px;
            }

            .reaction-gif.crash-gif {
                top: 152px;
            }
        }

        /* Screens */
        .screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
            text-align: center;
        }

        .screen.hidden {
            display: none;
        }

        .start-screen {
            background:
                radial-gradient(circle at 50% 18%, rgba(66, 245, 123, 0.12), transparent 24%),
                linear-gradient(180deg, rgba(0,0,0,0.88), rgba(0,0,0,0.94));
            backdrop-filter: blur(12px);
        }

        .game-over-screen {
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 79, 216, 0.14), transparent 25%),
                linear-gradient(180deg, rgba(0,0,0,0.93), rgba(0,0,0,0.97));
            backdrop-filter: blur(18px);
        }

        .hero-stack {
            position: relative;
            margin-bottom: 28px;
        }

        .hero-aura {
            position: absolute;
            inset: -20px -26px;
            background:
                radial-gradient(circle, rgba(66, 245, 123, 0.28) 0%, rgba(157, 92, 255, 0.12) 48%, transparent 72%);
            filter: blur(20px);
            opacity: 0.28;
            animation: pulseGlow 2.8s ease-in-out infinite;
        }

        .mascot-chip {
            position: relative;
            margin: 0 auto 14px;
            width: 104px;
            height: 104px;
            border-radius: 28px;
            border: 1px solid rgba(66, 245, 123, 0.28);
            background:
                linear-gradient(160deg, rgba(14, 22, 36, 0.96), rgba(5, 10, 18, 0.96));
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 30px rgba(66, 245, 123, 0.12),
                0 20px 35px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mascot-face {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(17, 28, 42, 1), rgba(8, 14, 24, 1));
            border: 1px solid rgba(157, 92, 255, 0.28);
            box-shadow: 0 0 18px rgba(157, 92, 255, 0.16);
        }

        .mascot-face::before,
        .mascot-face::after {
            content: "";
            position: absolute;
            top: 22px;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: var(--c-primary);
            box-shadow: 0 0 14px rgba(66, 245, 123, 0.85);
        }

        .mascot-face::before {
            left: 13px;
        }

        .mascot-face::after {
            right: 13px;
        }

        .mascot-smile {
            position: absolute;
            left: 50%;
            bottom: 13px;
            width: 28px;
            height: 14px;
            border-bottom: 3px solid var(--c-secondary);
            border-radius: 0 0 999px 999px;
            transform: translateX(-50%);
            box-shadow: 0 4px 12px rgba(255, 79, 216, 0.25);
        }

        .title {
            position: relative;
            margin: 0;
            color: #fff;
            font-family: var(--font-display);
            font-size: clamp(42px, 14vw, 72px);
            line-height: 0.88;
            letter-spacing: 0.04em;
        }

        .subtitle {
            margin-top: 10px;
            color: var(--c-secondary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6em;
            text-transform: uppercase;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(112px, 1fr));
            gap: 12px;
            width: min(100%, 320px);
            margin: 0 0 24px;
        }

        .info-card {
            position: relative;
            padding: 14px 12px 12px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(13, 18, 30, 0.94), rgba(7, 11, 18, 0.94));
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 12px 24px rgba(0,0,0,0.24);
            overflow: hidden;
        }

        .info-card::after {
            content: "";
            position: absolute;
            top: 10px;
            right: 12px;
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
            animation: floatGlyph 2.4s ease-in-out infinite;
        }

        .info-card.primary {
            color: var(--c-primary);
        }

        .info-card.secondary {
            color: var(--c-secondary);
        }

        .info-kicker {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.16em;
            margin-bottom: 6px;
        }

        .info-copy {
            font-size: 10px;
            color: #90a0c0;
            text-transform: uppercase;
            letter-spacing: 0.22em;
        }

        .btn-retro {
            appearance: none;
            border: 0;
            position: relative;
            padding: 18px 40px;
            color: #07100a;
            font-family: var(--font-main);
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            cursor: pointer;
            touch-action: manipulation;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
            box-shadow:
                0 0 16px rgba(66, 245, 123, 0.48),
                0 12px 26px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #9dffbd 0%, var(--c-primary) 48%, var(--c-primary-deep) 100%);
        }

        .btn-retro::before {
            content: "";
            position: absolute;
            inset: 2px;
            clip-path: inherit;
            border: 1px solid rgba(255,255,255,0.24);
            pointer-events: none;
        }

        .btn-retro:active {
            transform: scale(0.95);
            filter: brightness(1.08);
            box-shadow: 0 0 20px rgba(255,255,255,0.35);
        }

        .status-copy {
            margin: 0 0 24px;
            color: #68748f;
            font-size: 12px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .score-panel {
            margin-bottom: 24px;
            min-width: 240px;
            padding: 22px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background:
                linear-gradient(180deg, rgba(18, 22, 30, 0.94), rgba(8, 10, 18, 0.94));
            box-shadow:
                0 18px 30px rgba(0,0,0,0.3),
                inset 0 0 0 1px rgba(255,255,255,0.03);
        }

        .score-panel .label {
            margin-bottom: 8px;
            color: var(--c-primary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.32em;
        }

        .score-panel .value {
            color: #fff;
            font-size: clamp(42px, 12vw, 62px);
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* Controls */
        .controls-area {
            position: relative;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 0 0 auto;
            height: 260px;
            padding: 0 18px;
            background:
                linear-gradient(180deg, rgba(5, 6, 10, 0.92) 0%, rgba(0, 0, 0, 0.98) 100%);
            border-top: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 -16px 30px rgba(0,0,0,0.38);
        }

        .controls-area::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(66,245,123,0.5), rgba(255,79,216,0.5), transparent);
        }

        .control-column {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .touch-zone {
            padding: 20px;
            touch-action: none;
        }

        .control-label {
            margin-top: -8px;
            color: #65718a;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .steering-wheel {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 30%, #243149 0%, #161d2b 38%, #0c1016 100%);
            border: 6px solid #2b3444;
            position: relative;
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.03) inset,
                0 0 20px rgba(0,0,0,0.8),
                0 0 18px rgba(157, 92, 255, 0.12),
                inset 0 0 14px #000;
        }

        .steering-wheel::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 16px;
            background: var(--c-primary);
            box-shadow: 0 0 8px var(--c-primary);
        }

        .steering-spoke {
            position: absolute;
            background: #1b2230;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.04);
        }

        .spoke-1 {
            top: 50%;
            left: 0;
            width: 100%;
            height: 8px;
            transform: translateY(-50%);
        }

        .spoke-2 {
            top: 0;
            left: 50%;
            width: 8px;
            height: 100%;
            transform: translateX(-50%);
        }

        .wheel-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .wheel-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 10;
            width: 32px;
            height: 32px;
            border: 1px solid #60687a;
            border-radius: 50%;
            background: linear-gradient(135deg, #788295, #0c1016);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            transform: translate(-50%, -50%);
        }

        .pedal {
            width: 80px;
            height: 140px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                repeating-linear-gradient(45deg, #222b38, #222b38 10px, #141922 10px, #141922 20px);
            border: 2px solid #465063;
            border-radius: 12px;
            transform-origin: bottom;
            transition: transform 0.1s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 16px 24px rgba(0,0,0,0.26);
        }

        .pedal.active {
            transform: scaleY(0.9) translateY(10px);
            border-color: var(--c-primary);
            box-shadow:
                0 0 18px rgba(66, 245, 123, 0.35),
                0 12px 24px rgba(0,0,0,0.28);
            background:
                repeating-linear-gradient(45deg, #173423, #173423 10px, #0c1b13 10px, #0c1b13 20px);
        }

        .pedal-line {
            width: 100%;
            height: 2px;
            margin-bottom: 32px;
            background: rgba(0,0,0,0.32);
        }

        .pedal-copy {
            position: absolute;
            bottom: 16px;
            color: #7d8ca9;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.2em;
            transform: rotate(-90deg);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 1px, 0); }
            20%, 80% { transform: translate3d(4px, -1px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 2px, 0); }
            40%, 60% { transform: translate3d(6px, -2px, 0); }
        }

        @media (max-width: 640px) {
            .hud {
                padding: 12px;
            }

            .hud-panel {
                min-width: 104px;
                padding: 8px 10px;
            }

            .hud-label {
                font-size: 9px;
                letter-spacing: 0.24em;
            }

            .hud-value.score {
                font-size: 24px;
            }

            .hud-value.speed {
                font-size: 29px;
            }

            .subtitle {
                letter-spacing: 0.42em;
            }

            .btn-retro {
                width: min(100%, 280px);
                padding: 17px 26px;
                font-size: 16px;
            }

            .controls-area {
                height: 230px;
                padding-left: 10px;
                padding-right: 10px;
            }

            .touch-zone {
                padding: 12px;
            }

            .steering-wheel {
                width: 116px;
                height: 116px;
            }

            .pedal {
                width: 72px;
                height: 126px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Game Viewport -->
        <div id="game-container" class="game-container">
            <canvas id="gameCanvas"></canvas>

            <!-- Post Processing -->
            <div class="overlay-full scanlines"></div>
            <div class="overlay-full crt-glow"></div>
            <div class="overlay-full neon-vignette"></div>

            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud safe-top">
                <div class="hud-panel hud-left">
                    <div class="hud-label">Distance</div>
                    <div class="hud-value score" id="score">0000</div>
                </div>

                <div class="hud-panel hud-right">
                    <div class="hud-label">Velocity</div>
                    <div class="hud-value speed">
                        <span id="speed">0</span>
                        <span class="hud-unit">KM/H</span>
                    </div>
                </div>
            </div>

            <!-- Feedback Overlay -->
            <div id="feedback" class="feedback">
                <div id="feedback-text" class="feedback-text glitch-text">CLOSE CALL</div>
            </div>


            <img id="bonus-gif" class="reaction-gif bonus-gif" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp" alt="" aria-hidden="true">
            <img id="crash-gif" class="reaction-gif crash-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="" aria-hidden="true">

            <!-- Start Screen -->
            <div id="start-screen" class="screen start-screen">
                <div class="hero-stack">
                    <div class="hero-aura"></div>
                    <div class="mascot-chip" aria-hidden="true">
                        <div class="mascot-face">
                            <div class="mascot-smile"></div>
                        </div>
                    </div>
                    <h1 class="title glitch-text">NEON<br>DRIFT</h1>
                    <div class="subtitle">Nano Edition</div>
                </div>

                <div class="info-grid">
                    <div class="info-card primary">
                        <div class="info-kicker">Touch</div>
                        <div class="info-copy">Steering arc</div>
                    </div>
                    <div class="info-card secondary">
                        <div class="info-kicker">Small</div>
                        <div class="info-copy">Chassis frame</div>
                    </div>
                </div>

                <button id="btn-start" class="btn-retro">Ignite</button>
            </div>

            <!-- Game Over -->
            <div id="game-over" class="screen game-over-screen hidden">
                <h2 class="title glitch-text" style="font-size: clamp(40px, 13vw, 66px); color: #ff6b6b; margin-bottom: 10px;">TOTALED</h2>
                <div class="status-copy">Critical system failure</div>

                <div class="score-panel">
                    <div class="label">Final Distance</div>
                    <div id="final-score" class="value">0</div>
                </div>

                <button id="btn-restart" class="btn-retro">Reboot System</button>
            </div>
        </div>

        <!-- Controls -->
        <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
        <div class="controls-area safe-bottom">
            <div class="control-column">
                <div id="wheel-zone" class="touch-zone">
                    <div id="wheel" class="steering-wheel">
                        <div class="steering-spoke spoke-1"></div>
                        <div class="steering-spoke spoke-2"></div>
                        <div class="wheel-ring"></div>
                        <div class="wheel-hub"></div>
                    </div>
                </div>
                <span class="control-label">Steer</span>
            </div>

            <div class="control-column">
                <div id="pedal-zone" class="touch-zone">
                    <div id="pedal" class="pedal">
                        <div class="pedal-line"></div>
                        <div class="pedal-copy">Nitro</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * NEON DRIFT: NANO EDITION
         * Remade with smaller car visuals and tighter hitboxes.
         */


        const MEDIA = {
            fonts: {
                primary: 'Audiowide',
                secondary: 'Rajdhani'
            },
            gifs: {
                bonus: 'https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp',
                crash: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
            },
            audio: {
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                nitro: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
                bonus: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3',
                crash: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3'
            }
        };

        // [agent-note][stage4] repaired: mobile-cta-taps | element: body/.btn-retro | action: removed global touch suppression and allowed native button tap behavior
        // [agent-note][stage3] resolved-font: title -> Audiowide, ui -> Rajdhani via catalogs/fonts.json
        // [agent-note][stage3] resolved-audio: start/nitro/bonus/crash + bgm loop via catalogs/audios.json
        // [agent-note][stage3] resolved-gif: bonus/crash feedback via catalogs/gifs.json
        const AudioEngine = {
            enabled: false,
            unlocked: false,
            masterVolume: 0.55,
            bgm: null,
            pools: {},
            lastPlayAt: new Map(),

            init() {
                if (this.unlocked) return;
                this.unlocked = true;

                try {
                    this.bgm = this.createAudio(MEDIA.audio.bgm, 0.28, true);
                    this.pools.start = [this.createAudio(MEDIA.audio.start, 0.55)];
                    this.pools.nitro = [this.createAudio(MEDIA.audio.nitro, 0.18)];
                    this.pools.bonus = [this.createAudio(MEDIA.audio.bonus, 0.6)];
                    this.pools.crash = [this.createAudio(MEDIA.audio.crash, 0.65)];
                    this.enabled = true;
                } catch (err) {
                    this.enabled = false;
                }
            },

            createAudio(src, volume, loop = false) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = Math.min(1, Math.max(0, volume * this.masterVolume));
                audio.crossOrigin = 'anonymous';
                return audio;
            },

            play(name, debounceMs = 0) {
                if (!this.enabled) return;
                const now = performance.now();
                const last = this.lastPlayAt.get(name) || 0;
                if (debounceMs && now - last < debounceMs) return;
                this.lastPlayAt.set(name, now);

                const pool = this.pools[name];
                if (!pool || pool.length === 0) return;
                const audio = pool[0].cloneNode();
                audio.volume = pool[0].volume;
                audio.play().catch(() => {});
            },

            startBgm() {
                if (!this.enabled || !this.bgm) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            },

            stopBgm() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
        };

        const bonusGif = document.getElementById('bonus-gif');
        const crashGif = document.getElementById('crash-gif');
        let feedbackTimer = null;

        function showReactionGif(el, duration = 900) {
            if (!el) return;
            el.classList.add('visible');
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                el.classList.remove('visible');
            }, duration);
        }


        // --- CONFIG ---
        const CFG = {
            fps: 60,
            fov: 100,
            cameraHeight: 1500, // Raised camera for better view of smaller cars
            cameraDepth: 0.8,
            drawDistance: 300,
            segmentLength: 200,
            roadWidth: 2200,
            lanes: 3,
            maxSpeed: 29000, // Slightly faster to compensate for smaller scale perception
            accel: 7000,
            breaking: 14000,
            decel: 3500,
            offRoadDecel: 12000,
            offRoadLimit: 6000,
            centrifugal: 0.3,
            steerSensitivity: 2.2,
            colors: {
                skyTop: '#050510',
                skyBot: '#1a0525',
                road: '#111',
                roadLight: '#161616',
                grass: '#050505',
                rumble1: '#39ff14', // Neon Green
                rumble2: '#000',
                lane: '#ffffff'
            }
        };

        // --- STATE ---
        const State = {
            active: false,
            lastTime: 0,

            // Physics
            position: 0,
            speed: 0,
            playerX: 0,
            playerZ: 0,

            // Input
            steerAngle: 0,
            inputX: 0,
            gas: false,

            // World
            segments: [],
            trackLength: 0,

            // Gameplay
            score: 0,
            distance: 0
        };

        // --- TRACK GENERATION ---
        function createRoad() {
            State.segments = [];

            const addSegment = (curve, y) => {
                const n = State.segments.length;
                State.segments.push({
                    index: n,
                    p1: { world: { z: n * CFG.segmentLength, y: getLastY() }, camera: {}, screen: {} },
                    p2: { world: { z: (n + 1) * CFG.segmentLength, y: y }, camera: {}, screen: {} },
                    curve: curve,
                    sprites: [],
                    cars: [],
                    color: Math.floor(n / 3) % 2 ? 'dark' : 'light'
                });
            };

            const getLastY = () => (State.segments.length > 0 ? State.segments[State.segments.length - 1].p2.world.y : 0);

            const easeIn = (a, b, p) => a + (b - a) * (p * p);
            const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);

            const addRoad = (enter, hold, leave, curve, y) => {
                const startY = getLastY();
                const endY = startY + (y * CFG.segmentLength);
                const total = enter + hold + leave;

                for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
                for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
                for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
            };

            // Track Layout
            addRoad(50, 50, 50, 0, 0);
            addRoad(50, 50, 50, 0, 40);
            addRoad(50, 50, 50, -3, 0);
            addRoad(50, 50, 50, 3, -40);
            addRoad(50, 100, 50, 0, 0);
            addRoad(50, 50, 50, 5, 20);
            addRoad(50, 50, 50, -5, -20);
            addRoad(100, 50, 100, 0, 0);

            State.trackLength = State.segments.length * CFG.segmentLength;

            // Populate
            for (let n = 50; n < State.segments.length - 50; n++) {
                // Traffic
                if (Math.random() < 0.04) {
                    const offset = (Math.random() * 2 - 1) * 0.7;
                    State.segments[n].cars.push({
                        offset: offset,
                        z: 0,
                        speed: 8000 + Math.random() * 8000,
                        type: Math.floor(Math.random() * 3)
                    });
                }

                // Scenery (Neon Pillars)
                if (n % 15 === 0) {
                    State.segments[n].sprites.push({ type: 'pillar', offset: -1.8 });
                    State.segments[n].sprites.push({ type: 'pillar', offset: 1.8 });
                }
            }
        }

        // --- MATH ---
        function project(p, cameraX, cameraY, cameraZ, width, height, roadWidth) {
            p.camera.x = (p.world.x || 0) - cameraX;
            p.camera.y = (p.world.y || 0) - cameraY;
            p.camera.z = (p.world.z || 0) - cameraZ;

            if (p.camera.z < 0) p.camera.z += State.trackLength;

            p.screen.scale = CFG.cameraDepth / p.camera.z;
            p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
            p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
            p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
        }

        // --- RENDERER ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);

        function drawPoly(x1, y1, w1, x2, y2, w2, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1 - w1, y1);
            ctx.lineTo(x2 - w2, y2);
            ctx.lineTo(x2 + w2, y2);
            ctx.lineTo(x1 + w1, y1);
            ctx.fill();
        }

        function drawCar(x, y, scale, type, offset, isPlayer) {
            // REDUCED CAR SIZE:
            // Previous: 400 width, 200 height
            // New: 260 width, 130 height (approx 35% smaller visually)
            const w = 260 * scale * width / 2;
            const h = 130 * scale * height / 2;

            let lean = 0;
            if (isPlayer) lean = State.inputX * w * 0.15;

            ctx.save();
            ctx.translate(x + lean, y);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(0, 0, w * 0.55, h * 0.15, 0, 0, Math.PI * 2);
            ctx.fill();

            // Colors
            let cBody, cGlow, cAccent, cWindow;
            if (isPlayer) {
                cBody = '#1c2435';
                cGlow = '#42f57b';
                cAccent = '#ff4fd8';
                cWindow = '#8df7ff';
            } else if (type === 0) {
                cBody = '#3e0d18';
                cGlow = '#ff4f7b';
                cAccent = '#ff9560';
                cWindow = '#ffd8b0';
            } else if (type === 1) {
                cBody = '#433016';
                cGlow = '#ffaa00';
                cAccent = '#ffe36c';
                cWindow = '#d0f5ff';
            } else {
                cBody = '#1d2740';
                cGlow = '#00ccff';
                cAccent = '#7e8cff';
                cWindow = '#d7f9ff';
            }

            const bY = -h * 0.2;
            const bH = h * 0.3;

            // Main chassis
            ctx.fillStyle = cBody;
            ctx.beginPath();
            ctx.moveTo(-w * 0.5, bY - bH * 0.1);
            ctx.lineTo(-w * 0.36, bY - bH);
            ctx.lineTo(w * 0.36, bY - bH);
            ctx.lineTo(w * 0.5, bY - bH * 0.1);
            ctx.lineTo(w * 0.38, bY + bH * 0.05);
            ctx.lineTo(-w * 0.38, bY + bH * 0.05);
            ctx.closePath();
            ctx.fill();

            // Accent hood stripe
            ctx.fillStyle = cAccent;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(-w * 0.08, bY - bH * 0.95, w * 0.16, bH * 0.95);
            ctx.globalAlpha = 1;

            // Neon underglow
            ctx.shadowBlur = 15;
            ctx.shadowColor = cGlow;
            ctx.fillStyle = cGlow;
            ctx.fillRect(-w / 2 + 3, bY - 2, w - 6, 2);
            ctx.shadowBlur = 0;

            // Cabin
            const cW = w * 0.6;
            const cH = h * 0.25;
            const cY = bY - bH;

            ctx.fillStyle = '#04070e';
            ctx.beginPath();
            ctx.moveTo(-cW / 2, cY);
            ctx.lineTo(cW / 2, cY);
            ctx.lineTo(cW / 2 - cW * 0.2, cY - cH);
            ctx.lineTo(-cW / 2 + cW * 0.2, cY - cH);
            ctx.closePath();
            ctx.fill();

            // Windshield glow
            ctx.fillStyle = cWindow;
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.moveTo(-cW * 0.26, cY - cH * 0.15);
            ctx.lineTo(cW * 0.26, cY - cH * 0.15);
            ctx.lineTo(cW * 0.16, cY - cH * 0.72);
            ctx.lineTo(-cW * 0.16, cY - cH * 0.72);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;

            // Rear engine fins for player personality
            if (isPlayer) {
                ctx.fillStyle = cAccent;
                ctx.fillRect(-w * 0.36, bY - bH * 0.45, w * 0.08, h * 0.08);
                ctx.fillRect(w * 0.28, bY - bH * 0.45, w * 0.08, h * 0.08);
            }

            // Tail lights
            const lightY = bY - bH * 0.6;
            const lightW = w * 0.15;
            const lightH = h * 0.1;

            ctx.fillStyle = isPlayer && !State.gas ? '#ffd3da' : '#ff3355';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff3355';

            ctx.fillRect(-w / 2 + w * 0.05, lightY, lightW, lightH);
            ctx.fillRect(w / 2 - w * 0.05 - lightW, lightY, lightW, lightH);

            ctx.shadowBlur = 0;

            // Exhaust
            if (isPlayer && State.gas) {
                ctx.fillStyle = `rgba(66, 245, 123, ${Math.random()})`;
                const fH = h * 0.3;

                ctx.beginPath();
                ctx.moveTo(-w * 0.2, bY);
                ctx.lineTo(-w * 0.2 - 3, bY + fH);
                ctx.lineTo(-w * 0.2 + 3, bY + fH);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(w * 0.2, bY);
                ctx.lineTo(w * 0.2 - 3, bY + fH);
                ctx.lineTo(w * 0.2 + 3, bY + fH);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawPillar(x, y, scale) {
            const w = 30 * scale * width;
            const h = 800 * scale * height;

            ctx.save();
            ctx.translate(x, y);

            // Pillar
            ctx.fillStyle = '#111827';
            ctx.fillRect(-w / 2, -h, w, h);

            // Neon Strip
            const beamGradient = ctx.createLinearGradient(0, -h, 0, 0);
            beamGradient.addColorStop(0, '#42f57b');
            beamGradient.addColorStop(0.55, '#9d00ff');
            beamGradient.addColorStop(1, '#ff4fd8');
            ctx.fillStyle = beamGradient;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#9d00ff';
            ctx.fillRect(-w / 4, -h, w / 2, h);
            ctx.shadowBlur = 0;

            // Halo cap
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.fillRect(-w * 0.18, -h, w * 0.36, h * 0.04);

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            // Sky
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, CFG.colors.skyTop);
            skyGrad.addColorStop(1, CFG.colors.skyBot);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // Sun/Moon
            const orbGrad = ctx.createRadialGradient(width * 0.5, height * 0.35, 0, width * 0.5, height * 0.35, height * 0.18);
            orbGrad.addColorStop(0, 'rgba(255,110,220,0.95)');
            orbGrad.addColorStop(0.45, 'rgba(157,0,255,0.85)');
            orbGrad.addColorStop(1, 'rgba(157,0,255,0.02)');
            ctx.fillStyle = orbGrad;
            ctx.beginPath();
            ctx.arc(width * 0.5, height * 0.35, height * 0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(width * 0.3, height * 0.2, width * 0.4, 2);
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            for (let i = 1; i < 10; i++) {
                ctx.fillRect(width * 0.3, height * 0.2 + i * 10, width * 0.4, 2);
            }

            // Road
            const baseSegment = State.segments[Math.floor(State.position / CFG.segmentLength) % State.segments.length];
            const basePercent = (State.position % CFG.segmentLength) / CFG.segmentLength;

            const playerX = State.playerX * CFG.roadWidth;
            const cameraX = playerX;
            const cameraY = CFG.cameraHeight + baseSegment.p1.world.y;
            const cameraZ = State.position;

            let dx = -(baseSegment.curve * basePercent);
            let x = 0;
            let maxY = height;

            for (let n = 0; n < CFG.drawDistance; n++) {
                const segment = State.segments[(baseSegment.index + n) % State.segments.length];
                const looped = segment.index < baseSegment.index;

                segment.p1.world.x = x;
                segment.p2.world.x = x + dx;
                segment.clip = maxY;

                project(segment.p1, cameraX - x, cameraY, cameraZ - (looped ? State.trackLength : 0), width, height, CFG.roadWidth);
                project(segment.p2, cameraX - x - dx, cameraY, cameraZ - (looped ? State.trackLength : 0), width, height, CFG.roadWidth);

                x += dx;
                dx += segment.curve;

                if (segment.p1.camera.z <= CFG.cameraDepth || segment.p2.screen.y >= segment.p1.screen.y || segment.p2.screen.y >= maxY) {
                    continue;
                }

                drawPoly(0, segment.p2.screen.y, width, 0, segment.p1.screen.y, width, CFG.colors.grass);

                const r1 = segment.p1.screen.w;
                const r2 = segment.p2.screen.w;
                const rumbleColor = segment.color === 'dark' ? CFG.colors.rumble1 : CFG.colors.rumble2;
                drawPoly(segment.p1.screen.x, segment.p1.screen.y, r1 * 1.1, segment.p2.screen.x, segment.p2.screen.y, r2 * 1.1, rumbleColor);

                const roadColor = segment.color === 'dark' ? CFG.colors.road : CFG.colors.roadLight;
                drawPoly(segment.p1.screen.x, segment.p1.screen.y, r1, segment.p2.screen.x, segment.p2.screen.y, r2, roadColor);

                if (segment.color === 'dark') {
                    drawPoly(segment.p1.screen.x, segment.p1.screen.y, r1 * 0.02, segment.p2.screen.x, segment.p2.screen.y, r2 * 0.02, CFG.colors.lane);
                }

                maxY = segment.p2.screen.y;
            }

            // Sprites
            for (let n = CFG.drawDistance - 1; n > 0; n--) {
                const segment = State.segments[(baseSegment.index + n) % State.segments.length];

                for (let i = 0; i < segment.sprites.length; i++) {
                    const s = segment.sprites[i];
                    const scale = segment.p1.screen.scale;
                    const sx = segment.p1.screen.x + (scale * s.offset * CFG.roadWidth * width / 2);
                    const sy = segment.p1.screen.y;
                    if (sy > segment.clip) continue;
                    if (s.type === 'pillar') drawPillar(sx, sy, scale);
                }

                for (let i = 0; i < segment.cars.length; i++) {
                    const car = segment.cars[i];
                    const scale = segment.p1.screen.scale;
                    const sx = segment.p1.screen.x + (scale * car.offset * CFG.roadWidth * width / 2);
                    const sy = segment.p1.screen.y;
                    if (sy > segment.clip) continue;
                    drawCar(sx, sy, scale, car.type, car.offset, false);
                }
            }

            // Player
            const pY = height - 100;
            drawCar(width / 2, pY, 0.0035, 0, 0, true);
        }

        // --- UPDATE ---
        function update(dt) {
            const maxSpeed = CFG.maxSpeed;
            if (State.gas) {
                State.speed += CFG.accel * dt;
            } else {
                State.speed -= CFG.decel * dt;
            }

            if ((State.playerX < -1 || State.playerX > 1) && State.speed > CFG.offRoadLimit) {
                State.speed -= CFG.offRoadDecel * dt;
            }

            State.speed = Math.max(0, Math.min(State.speed, maxSpeed));

            State.position += State.speed * dt;
            while (State.position >= State.trackLength) State.position -= State.trackLength;
            while (State.position < 0) State.position += State.trackLength;

            const speedRatio = Math.max(0.2, State.speed / maxSpeed);
            const dx = dt * CFG.steerSensitivity * speedRatio;

            const currentSeg = State.segments[Math.floor(State.position / CFG.segmentLength) % State.segments.length];

            State.playerX = State.playerX - (dx * currentSeg.curve * CFG.centrifugal);
            State.playerX += State.inputX * dx;

            if (State.playerX < -2.2) State.playerX = -2.2;
            if (State.playerX > 2.2) State.playerX = 2.2;

            const playerSegment = State.segments[Math.floor(State.position / CFG.segmentLength) % State.segments.length];

            for (let i = 0; i < playerSegment.cars.length; i++) {
                const car = playerSegment.cars[i];
                if (State.speed > car.speed) {
                    if (Math.abs(State.playerX - car.offset) < 0.5) {
                        crash();
                    } else if (Math.abs(State.playerX - car.offset) < 0.8) {
                        bonus();
                    }
                }
            }

            State.distance += State.speed * dt;
            State.score = Math.floor(State.distance / 100);

            document.getElementById('score').innerText = State.score.toString().padStart(4, '0');
            document.getElementById('speed').innerText = Math.floor(State.speed / 100);
        }

        function bonus() {
            const el = document.getElementById('feedback-text');
            el.style.opacity = 1;
            el.style.transform = 'scale(1.3)';
            AudioEngine.play('bonus', 200);
            showReactionGif(bonusGif, 850);
            setTimeout(() => {
                el.style.opacity = 0;
                el.style.transform = 'scale(1)';
            }, 600);
        }

        function crash() {
            State.active = false;
            AudioEngine.play('crash', 0);
            AudioEngine.stopBgm();
            showReactionGif(crashGif, 1400);
            document.getElementById('game-container').classList.add('shake');
            document.getElementById('hud').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('game-container').classList.remove('shake');
                document.getElementById('game-over').classList.remove('hidden');
                document.getElementById('final-score').innerText = State.score;
            }, 500);
        }

        // --- INPUT ---
        const Input = {
            wheel: document.getElementById('wheel'),
            wheelZone: document.getElementById('wheel-zone'),
            pedal: document.getElementById('pedal'),
            pedalZone: document.getElementById('pedal-zone'),

            startX: 0,
            currentRot: 0,
            dragging: false,

            init() {
                const startDrag = (x) => {
                    this.dragging = true;
                    this.startX = x;
                };

                const moveDrag = (x) => {
                    if (!this.dragging) return;
                    const delta = x - this.startX;
                    this.currentRot += delta * 0.8;
                    this.currentRot = Math.max(-110, Math.min(110, this.currentRot));
                    this.startX = x;
                    this.updateWheel();
                };

                const endDrag = () => {
                    this.dragging = false;
                };

                this.wheelZone.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startDrag(e.touches[0].clientX);
                }, { passive: false });

                this.wheelZone.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    moveDrag(e.touches[0].clientX);
                }, { passive: false });

                this.wheelZone.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    endDrag();
                });

                this.wheelZone.addEventListener('mousedown', (e) => {
                    startDrag(e.clientX);
                });

                window.addEventListener('mousemove', (e) => {
                    moveDrag(e.clientX);
                });

                window.addEventListener('mouseup', endDrag);

                const setGas = (on) => {
                    State.gas = on;
                    if (on) {
                        this.pedal.classList.add('active');
                        AudioEngine.play('nitro', 140);
                    } else {
                        this.pedal.classList.remove('active');
                    }
                };

                this.pedalZone.addEventListener('touchstart', (e) => { e.preventDefault(); setGas(true); }, { passive: false });
                this.pedalZone.addEventListener('touchend', (e) => { e.preventDefault(); setGas(false); });

                this.pedalZone.addEventListener('mousedown', () => setGas(true));
                window.addEventListener('mouseup', () => setGas(false));
            },

            updateWheel() {
                this.wheel.style.transform = `rotate(${this.currentRot}deg)`;
                State.inputX = this.currentRot / 110;
                State.steerAngle = this.currentRot;
            },

            decay() {
                if (!this.dragging && Math.abs(this.currentRot) > 1) {
                    this.currentRot *= 0.8;
                    this.updateWheel();
                } else if (!this.dragging) {
                    this.currentRot = 0;
                    this.updateWheel();
                }
            }
        };

        // --- LOOP ---
        function loop(timestamp) {
            if (!State.active) return;

            const dt = Math.min((timestamp - State.lastTime) / 1000, 0.1);
            State.lastTime = timestamp;

            Input.decay();
            update(dt);
            render();

            requestAnimationFrame(loop);
        }

        function startGame() {
            AudioEngine.init();
            AudioEngine.play('start', 0);
            AudioEngine.startBgm();
            createRoad();
            resize();

            State.active = true;
            State.score = 0;
            State.distance = 0;
            State.speed = 0;
            State.position = 0;
            State.playerX = 0;
            State.lastTime = performance.now();
            State.gas = false;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('hud').style.opacity = 1;
            bonusGif.classList.remove('visible');
            crashGif.classList.remove('visible');

            loop(performance.now());
        }

        Input.init();
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', startGame);

        resize();
        createRoad();
        render();
    </script>
</body>
</html>
