<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Portal Courier: Frequency Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --sky-top: #05070c;
        --sky-mid: #071120;
        --sky-bottom: #102040;
        --hud-panel: rgba(4, 14, 24, 0.82);
        --hud-border: rgba(124, 255, 0, 0.48);
        --hud-glow: rgba(82, 247, 255, 0.34);
        --hud-text: #efffff;
        --accent-gold: #d7ff49;
        --accent-cyan: #52f7ff;
        --accent-emerald: #7cff00;
        --accent-danger: #ff4e7a;
        --hero-core: #fff4c2;
        --hero-wing: #52f7ff;
        --hero-trail: #7cff00;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: linear-gradient(180deg, var(--sky-top), #05070c 90%); font-family: 'Exo 2', system-ui, sans-serif; }
    body { color: var(--hud-text); touch-action: manipulation; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    button { font: inherit; }
    .glass {
        background:
            linear-gradient(180deg, rgba(8, 28, 34, 0.92), rgba(4, 10, 20, 0.8)),
            radial-gradient(circle at top, rgba(124, 255, 0, 0.18), transparent 55%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--hud-border);
        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.28),
            inset 0 0 0 1px rgba(255, 255, 255, 0.06),
            0 0 20px var(--hud-glow);
    }
    .text-shadow { text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8), 0 0 16px rgba(121, 231, 255, 0.24); }
    .hidden { display: none !important; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .z-50 { z-index: 50; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-start { align-items: flex-start; }
    .items-center { align-items: center; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .max-w-sm { max-width: 24rem; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .p-4 { padding: 1rem; }
    .p-8 { padding: 2rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .gap-2 { gap: 0.5rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-full { border-radius: 9999px; }
    .overflow-hidden { overflow: hidden; }
    .text-center { text-align: center; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
    .text-5xl { font-size: 3rem; line-height: 1; }
    .text-6xl { font-size: 3.75rem; line-height: 1; }
    .font-bold { font-weight: 700; }
    .tracking-widest { letter-spacing: 0.15em; }
    .tracking-wide { letter-spacing: 0.04em; }
    .uppercase { text-transform: uppercase; }
    .text-white { color: #fff; }
    .text-yellow-300 { color: #fde047; }
    .text-yellow-400 { color: #facc15; }
    .text-gray-300 { color: #d1d5db; }
    .opacity-0 { opacity: 0; }
    .opacity-80 { opacity: 0.8; }
    .transition-opacity { transition-property: opacity; }
    .transition-all { transition-property: all; }
    .duration-300 { transition-duration: 300ms; }
    .transform { transform: translateZ(0); }
    .scale-100 { transform: scale(1); }
    .border-2 { border-width: 2px; border-style: solid; }
    .border-yellow-400 { border-color: #facc15; }
    .border-white\/20 { border-color: rgba(255, 255, 255, 0.2); }
    .bg-black\/80 { background: rgba(0, 0, 0, 0.8); }
    .bg-gray-700 { background: #374151; }
    .bg-yellow-400 { background: #facc15; }
    .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.25); }
    .animate-pulse { animation: panel-pulse 1.8s ease-in-out infinite; }
    .hud-number { font-family: 'Orbitron', sans-serif; }
    .display-font { font-family: 'Orbitron', sans-serif; }
    .hud-card {
        position: relative;
        overflow: hidden;
    }
    .hud-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 20%, rgba(124, 255, 0, 0.2), transparent 80%);
        opacity: 0.5;
        pointer-events: none;
    }
    .hud-label {
        color: rgba(239, 248, 255, 0.72);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
    }
    .phase-label {
        margin-top: 0.15rem;
        color: rgba(82, 247, 255, 0.82);
        font-size: 0.67rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
    }
    .portal-glyph {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 9999px;
        background:
            radial-gradient(circle at center, rgba(124, 255, 0, 0.8) 0 22%, transparent 24%),
            conic-gradient(from 30deg, rgba(124,255,0,.95), rgba(82,247,255,.85), rgba(122,49,255,.72), rgba(124,255,0,.95));
        box-shadow: 0 0 14px rgba(124, 255, 0, 0.48), inset 0 0 0 2px rgba(5, 7, 12, 0.8);
    }
    .portal-glyph::after {
        content: "";
        width: 0.55rem;
        height: 0.22rem;
        border-radius: 9999px;
        border: 1px solid rgba(239, 255, 255, 0.9);
        transform: rotate(-18deg);
    }
    .hud-meter {
        position: relative;
        background: rgba(8, 16, 31, 0.78);
        border: 1px solid rgba(255, 209, 102, 0.35);
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.35);
    }
    .hud-meter-fill {
        background: linear-gradient(90deg, var(--accent-gold), var(--accent-cyan));
        box-shadow: 0 0 12px rgba(121, 231, 255, 0.45);
    }
    .cta-button {
        background: linear-gradient(90deg, #7cff00, #52f7ff 55%, #7a31ff);
        color: #fff;
        font-weight: 700;
        border: 1px solid rgba(255, 255, 255, 0.18);
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
        box-shadow: 0 10px 24px rgba(18, 62, 112, 0.4);
    }
    .cta-button:hover { transform: scale(1.05); box-shadow: 0 14px 30px rgba(31, 183, 255, 0.45); filter: brightness(1.06); }
    .cta-button:active { transform: scale(0.95); }
    .feedback-overlay {
        position: absolute;
        right: 0.75rem;
        bottom: 1rem;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.75rem;
        max-width: min(38vw, 10rem);
        pointer-events: none;
    }
    .feedback-gif {
        width: min(34vw, 8.5rem);
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        background: rgba(6, 10, 18, 0.72);
    }
    .feedback-gif.visible {
        opacity: 0.95;
        transform: translateY(0) scale(1);
    }
    .feedback-banner {
        min-width: 7rem;
        padding: 0.5rem 0.8rem;
        border-radius: 9999px;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 180ms ease, transform 180ms ease;
    }
    .feedback-banner.visible {
        opacity: 1;
        transform: translateY(0);
    }
    .feedback-banner.success {
        background: linear-gradient(90deg, rgba(26, 155, 116, 0.94), rgba(80, 227, 194, 0.92));
        box-shadow: 0 0 18px rgba(100, 243, 198, 0.32);
    }
    .feedback-banner.fail {
        background: linear-gradient(90deg, rgba(164, 35, 70, 0.94), rgba(255, 111, 125, 0.92));
        box-shadow: 0 0 18px rgba(255, 111, 125, 0.28);
    }
    @media (max-width: 640px) {
        #ui-layer {
            padding: 0.65rem;
        }
        .hud-card {
            border-radius: 0.85rem;
        }
        .phase-label {
            font-size: 0.58rem;
            max-width: 8.6rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #target-region {
            font-size: 1.2rem;
            line-height: 1.35rem;
        }
        #score-val {
            font-size: 1.65rem;
            line-height: 1.9rem;
        }
        .feedback-overlay {
            right: 0.5rem;
            bottom: 0.75rem;
            max-width: 42vw;
        }
        .feedback-gif {
            width: min(42vw, 7rem);
        }
    }
    @keyframes panel-pulse {
        0%, 100% { box-shadow: 0 0 14px rgba(255, 209, 102, 0.34), 0 0 26px rgba(121, 231, 255, 0.16); }
        50% { box-shadow: 0 0 26px rgba(255, 209, 102, 0.55), 0 0 38px rgba(121, 231, 255, 0.28); }
    }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    @keyframes pulse-glow { 0% { box-shadow: 0 0 10px #FFD700; } 50% { box-shadow: 0 0 25px #FFD700; } 100% { box-shadow: 0 0 10px #FFD700; } }
    #ui-layer { pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }
</style>
</head>
<body>

<!-- ASSETS -->
<!-- [agent-note][world-design-superprompt] static city backdrop intentionally removed; canvas now owns authored portal-world background. -->
<audio id="bgm_main" data-editable="audio" data-label="Portal Drift BGM" src="https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="Sample Logged SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3" preload="auto"></audio>
<audio id="sfx_bonus" data-editable="audio" data-label="Frequency Retune SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Off-Frequency SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3" preload="auto"></audio>
<audio id="sfx_click" data-editable="audio" data-label="Restart Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3" preload="auto"></audio>
<img id="gif_success" alt="Route confirmed celebration" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" hidden>
<img id="gif_fail" alt="Route mismatch reaction" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" hidden>

<!-- CONFIG -->
<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Cruiser Speed", "value": 8, "min": 4, "max": 15 },
    "scrollSpeed": { "type": "number", "label": "Portal Scroll Speed", "value": 3, "min": 1, "max": 10 },
    "dayNightDuration": { "type": "number", "label": "Retune Cycle (sec)", "value": 30, "min": 10, "max": 60 }
}
</script>

<!-- GAME CONTAINER -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI LAYER -->
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full transition-opacity duration-300">
            <div class="flex flex-col gap-2">
                <div class="glass hud-card px-4 py-2 rounded-xl text-white">
                    <div class="text-xs uppercase tracking-widest hud-label">Samples Logged</div>
                    <div id="score-val" class="text-3xl font-bold hud-number tracking-wide">0</div>
                </div>
                <div class="glass hud-card px-4 py-2 rounded-xl text-white flex items-center gap-2">
                        <div id="day-icon" class="portal-glyph" aria-hidden="true"></div>
                    <div class="w-16 h-2 hud-meter rounded-full overflow-hidden">
                        <div id="time-bar" class="h-full hud-meter-fill w-0"></div>
                    </div>
                </div>
            </div>
            
                <div class="glass hud-card px-6 py-3 rounded-xl text-white text-center animate-pulse border-2 border-yellow-400">
                    <div class="text-xs uppercase tracking-widest hud-label">Portal Frequency</div>
                    <div id="target-region" class="text-2xl font-bold text-yellow-300 display-font">ASIA</div>
                    <div id="phase-label" class="phase-label">Garage Calibration</div>
                </div>
        </div>

        <!-- GAME OVER -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm z-50">
            <div class="glass p-8 rounded-3xl text-center max-w-sm w-full border-2 border-white/20 transform transition-all scale-100">
                <h2 class="text-5xl display-font text-white mb-2 text-shadow">RUN ARCHIVED</h2>
                <div class="text-gray-300 mb-6">Your sample log is sealed in the garage scanner.</div>
                <div class="text-6xl font-bold text-yellow-400 mb-8 hud-number" id="final-score">0</div>
                <button id="restart-btn" class="w-full cta-button text-white font-bold py-4 rounded-xl text-xl shadow-lg">
                    RETUNE AGAIN
                </button>
            </div>
        </div>

        <div class="feedback-overlay" aria-live="polite">
            <!-- [agent-note][stage3] resolved-gif: success/fail feedback overlays -> catalogs/gifs.json -->
            <div id="feedback-banner" class="feedback-banner glass">Synced</div>
            <img id="feedback-gif" class="feedback-gif" alt="Gameplay reaction overlay">
        </div>
    </div>
</div>

<script>
// --- DATA & CONSTANTS ---
const CONTINENTS = {
    "AMERICA": ["Canada", "Mexico", "Cuba", "Brazil", "Peru", "Chile", "USA", "Argentina", "Colombia", "Venezuela"],
    "EUROPE": ["UK", "France", "Spain", "Italy", "Germany", "Norway", "Sweden", "Poland", "Ukraine", "Greece"],
    "AFRICA": ["Egypt", "Morocco", "Nigeria", "Kenya", "South Africa", "Ghana", "Ethiopia", "Mali", "Senegal"],
    "ASIA": ["China", "Japan", "India", "Russia", "Korea", "Thailand", "Vietnam", "Indonesia", "Iran", "Turkey"],
    "OCEANIA": ["Australia", "New Zealand", "Fiji", "Samoa", "Tonga", "Papua New Guinea"],
    "ANTARCTICA": ["Antarctica", "South Pole", "Research St."]
};

// --- SYSTEM INVARIANTS ---
let canvas, ctx, cw, ch;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let gameConfig = {};
let score = 0;
let dayTime = 0; // 0.0 to 1.0 (0=Noon, 0.5=Sunset, 0.75=Midnight)
let isNight = false;

// --- ENTITIES ---
const hero = { x: 0, y: 0, w: 60, h: 60, vx: 0, targetX: 0 };
const items = [];
const particles = [];
const terrain = []; // Pseudo-3D mountains
let mapOffsetY = 0;
let currentRegion = 'ASIA';
let regionTimer = 0;
let spawnTimer = 0;
const PHASE_NAMES = [
    'Garage Calibration',
    'Portal Tunnel Drift',
    'Alien City Customs',
    'Citadel Traffic Stack',
    'Time Fracture Finale'
];

// --- AUDIO SYSTEM ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    collect: document.getElementById('sfx_collect'),
    region: document.getElementById('sfx_bonus'),
    fail: document.getElementById('sfx_fail'),
    click: document.getElementById('sfx_click')
};
const feedbackEls = {
    banner: document.getElementById('feedback-banner'),
    gif: document.getElementById('feedback-gif'),
    successSrc: document.getElementById('gif_success').src,
    failSrc: document.getElementById('gif_fail').src
};
let audioUnlocked = false;
let feedbackTimer = 0;
const soundCooldowns = new Map();

function unlockAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (!audioUnlocked) {
        sounds.bgm.volume = 0.2;
        sounds.bgm.play().catch(() => {});
        audioUnlocked = true;
    }
}

function playSound(name, cooldown = 0) {
    const sound = sounds[name];
    if (!sound) return;
    const now = performance.now();
    if (cooldown > 0) {
        const lastPlayed = soundCooldowns.get(name) || 0;
        if (now - lastPlayed < cooldown) return;
        soundCooldowns.set(name, now);
    }
    try {
        sound.currentTime = 0;
        sound.play().catch(() => {});
    } catch (_) {}
}

function showFeedback(type, label) {
    clearTimeout(feedbackTimer);
    feedbackEls.banner.textContent = label;
    feedbackEls.banner.classList.remove('success', 'fail', 'visible');
    feedbackEls.gif.classList.remove('visible');
    feedbackEls.banner.classList.add(type === 'success' ? 'success' : 'fail');
    feedbackEls.gif.src = type === 'success' ? feedbackEls.successSrc : feedbackEls.failSrc;
    feedbackEls.banner.classList.add('visible');
    feedbackEls.gif.classList.add('visible');

    feedbackTimer = window.setTimeout(() => {
        feedbackEls.banner.classList.remove('visible');
        feedbackEls.gif.classList.remove('visible');
    }, 1000);
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

// --- LIFECYCLE ---
document.addEventListener('DOMContentLoaded', () => {
    // Parse Config
    const configEl = document.getElementById('game-config');
    const configDef = JSON.parse(configEl.textContent);
    for (let key in configDef) gameConfig[key] = configDef[key].value;
    window.gameConfigDefs = configDef; // Expose for editor

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });

    window.addEventListener('resize', resize);
    resize();
    
    initGame();
    setState('PLAYING');
    
    // L1 Audio Unlock
    sounds.bgm.volume = 0.2;
    sounds.bgm.play().catch(() => {});

    requestAnimationFrame(loop);
});

function resize() {
    cw = document.documentElement.clientWidth;
    ch = document.documentElement.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Safety reset if hero out of bounds
    if (gameState === 'PLAYING') {
        hero.x = Math.min(Math.max(hero.x, hero.w), cw - hero.w);
        hero.y = ch - 150;
    }
}

function setState(s) {
    gameState = s;
    const hud = document.getElementById('hud');
    const go = document.getElementById('game-over-screen');
    
    if (s === 'PLAYING') {
        hud.classList.remove('opacity-0');
        go.classList.add('hidden');
    } else if (s === 'GAMEOVER') {
        hud.classList.add('opacity-0');
        go.classList.remove('hidden');
        document.getElementById('final-score').textContent = score;
    }
}

function initGame() {
    score = 0;
    dayTime = 0;
    mapOffsetY = 0;
    items.length = 0;
    particles.length = 0;
    terrain.length = 0;
    
    // Init Hero
    hero.x = cw / 2;
    hero.y = ch - 150;
    hero.targetX = cw / 2;
    
    // Init Terrain (Clouds/Mountains)
    for(let i=0; i<5; i++) {
        terrain.push({
            y: Math.random() * ch,
            x: Math.random() * cw,
            type: Math.random() > 0.5 ? 'cloud' : 'mountain',
            speed: 0.5 + Math.random()
        });
    }

    pickNewRegion(true);
    updateUI();
}

function restartGame() {
    playSound('click', 90);
    initGame();
    setState('PLAYING');
}

function pickNewRegion(isInit = false) {
    const keys = Object.keys(CONTINENTS);
    currentRegion = keys[Math.floor(Math.random() * keys.length)];
    regionTimer = 20; // Seconds to hold this region
    
    const el = document.getElementById('target-region');
    el.textContent = currentRegion;
    el.parentElement.classList.remove('animate-pulse');
    void el.parentElement.offsetWidth; // trigger reflow
    el.parentElement.classList.add('animate-pulse');

    if (!isInit) {
        playSound('region', 250);
        showFeedback('success', `Retuned: ${currentRegion}`);
    }
}

// --- INPUT ---
function handleInput(e) {
    unlockAudio();
    if (gameState === 'GAMEOVER') return;
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    
    // Smooth follow
    hero.targetX = Math.max(hero.w/2, Math.min(cw - hero.w/2, x));
}

window.addEventListener('pointerdown', handleInput, { passive: false });
window.addEventListener('pointermove', handleInput, { passive: false });
document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    unlockAudio();
    restartGame();
});

// --- GAME LOOP ---
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;

    if (gameState === 'PLAYING') {
        update(dt);
    }
    draw();
    requestAnimationFrame(loop);
}

function update(dt) {
    // 1. Day/Night Cycle
    dayTime += dt / gameConfig.dayNightDuration;
    if (dayTime >= 1) dayTime = 0;
    
    // isNight logic: 0.4 to 0.9 is night
    isNight = (dayTime > 0.4 && dayTime < 0.9);
    
    // Update UI Time Bar
    const bar = document.getElementById('time-bar');
    if(bar) bar.style.width = (dayTime * 100) + '%';
    document.getElementById('day-icon').title = isNight ? 'Retune drift active' : 'Sample vial sync';

    // 2. Map Scroll
    mapOffsetY += gameConfig.scrollSpeed * 60 * dt;

    // 3. Hero Movement
    hero.x += (hero.targetX - hero.x) * 10 * dt;
    
    // 4. Region Timer
    regionTimer -= dt;
    if (regionTimer <= 0) pickNewRegion();

    // 5. Spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnItem();
        spawnTimer = 1.5 - (score * 0.01); // Get harder
        if (spawnTimer < 0.5) spawnTimer = 0.5;
    }

    // 6. Items Logic
    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += item.speed * 60 * dt;
        
        // Collision
        const dx = item.x - hero.x;
        const dy = item.y - hero.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < hero.w + item.r) {
            // Hit
            const isTarget = CONTINENTS[currentRegion].includes(item.text);
            if (isTarget) {
                score += 10;
                playSound('collect', 80);
                showFeedback('success', `${item.text} synced`);
                spawnParticles(item.x, item.y, '#7cff00', 10);
                vibrate('light');
            } else {
                score = Math.max(0, score - 5);
                playSound('fail', 120);
                showFeedback('fail', `${item.text} off-frequency`);
                spawnParticles(item.x, item.y, '#ff4e7a', 20);
                vibrate('heavy');
                // Shake effect
                ctx.save();
                ctx.translate(Math.random()*10-5, Math.random()*10-5);
                ctx.restore();
            }
            updateUI();
            items.splice(i, 1);
            continue;
        }

        if (item.y > ch + 50) items.splice(i, 1);
    }

    // 7. Terrain Logic
    terrain.forEach(t => {
        t.y += t.speed * 60 * dt;
        if (t.y > ch + 100) {
            t.y = -100;
            t.x = Math.random() * cw;
        }
    });

    // 8. Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function spawnItem() {
    // 50% chance to spawn from current region
    const isTarget = Math.random() > 0.4;
    let text = "";
    
    if (isTarget) {
        const pool = CONTINENTS[currentRegion];
        text = pool[Math.floor(Math.random() * pool.length)];
    } else {
        // Pick random wrong region
        const keys = Object.keys(CONTINENTS).filter(k => k !== currentRegion);
        const wrongKey = keys[Math.floor(Math.random() * keys.length)];
        const pool = CONTINENTS[wrongKey];
        text = pool[Math.floor(Math.random() * pool.length)];
    }

    items.push({
        x: Math.random() * (cw - 100) + 50,
        y: -50,
        text: text,
        r: 30,
        speed: 2 + Math.random() * 2,
        color: isTarget ? '#4ADE80' : '#F87171' // Green hint vs Red hint? No, keep them neutral or let player decide. Let's make them neutral white bubbles.
    });
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color
        });
    }
}

function updateUI() {
    document.getElementById('score-val').innerText = score;
    const phaseEl = document.getElementById('phase-label');
    if (phaseEl) phaseEl.textContent = PHASE_NAMES[Math.min(4, Math.floor(score / 80))];
}

function drawPortalBackground() {
    const time = Date.now() * 0.001;
    const phase = Math.min(4, Math.floor(score / 80));
    const palettes = [
        ['#05070c', '#071120', '#7cff00', '#52f7ff'],
        ['#080612', '#261044', '#7cff00', '#7a31ff'],
        ['#06101b', '#102a36', '#52f7ff', '#ffb84d'],
        ['#04151a', '#172a3a', '#d7ff49', '#52f7ff'],
        ['#090513', '#1d082b', '#ff4e7a', '#7cff00']
    ];
    const palette = palettes[phase];

    const bg = ctx.createLinearGradient(0, 0, 0, ch);
    bg.addColorStop(0, palette[0]);
    bg.addColorStop(0.52, palette[1]);
    bg.addColorStop(1, '#020409');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cw, ch);

    // Garage grid / timeline scanner floor, kept low contrast behind active labels.
    ctx.save();
    ctx.globalAlpha = phase >= 4 ? 0.2 : 0.14;
    ctx.strokeStyle = phase >= 4 ? 'rgba(255, 78, 122, 0.34)' : 'rgba(82, 247, 255, 0.2)';
    ctx.lineWidth = 1;
    const gridStep = 44;
    const offset = (mapOffsetY * 0.28) % gridStep;
    for (let y = -gridStep; y < ch + gridStep; y += gridStep) {
        ctx.beginPath();
        ctx.moveTo(0, y + offset);
        ctx.lineTo(cw, y + offset);
        ctx.stroke();
    }
    for (let x = -80; x < cw + 100; x += gridStep) {
        ctx.beginPath();
        ctx.moveTo(x + Math.sin(time + x) * 6, -20);
        ctx.lineTo(x - 92, ch + 40);
        ctx.stroke();
    }
    ctx.restore();

    // Animated portal rings: the authored scene foundation.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const ringCount = 8;
    for (let i = 0; i < ringCount; i++) {
        const y = ((mapOffsetY * (0.34 + i * 0.035)) + i * ch / ringCount) % (ch + 190) - 95;
        const x = cw * (0.5 + Math.sin(time * 0.45 + i) * (0.075 + phase * 0.006));
        const radius = Math.min(cw, ch) * (0.18 + i * 0.026);
        ctx.globalAlpha = 0.24 - i * 0.014;
        ctx.strokeStyle = i % 2 ? palette[3] : palette[2];
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.18, radius * 0.48, Math.sin(time + i) * 0.14, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(239,255,255,0.34)';
        ctx.stroke();

        // Rick-style portal flecks on the rim.
        for (let dot = 0; dot < 6; dot++) {
            const a = time * 0.7 + dot + i;
            ctx.globalAlpha = 0.16;
            ctx.fillStyle = dot % 2 ? '#b7ff3c' : '#52f7ff';
            ctx.beginPath();
            ctx.arc(x + Math.cos(a) * radius, y + Math.sin(a) * radius * 0.42, 2.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.restore();

    // Phase-specific lower world silhouettes.
    ctx.save();
    const baseY = ch * 0.82;
    ctx.globalAlpha = 0.48;
    ctx.fillStyle = phase >= 4 ? 'rgba(255, 78, 122, 0.17)' : phase >= 2 ? 'rgba(82, 247, 255, 0.2)' : 'rgba(124, 255, 0, 0.16)';
    if (phase === 0) {
        // Garage bench, bottles, cables.
        ctx.fillRect(0, baseY + 34, cw, 28);
        for (let i = 0; i < 8; i++) {
            const x = (i * 76 + mapOffsetY * 0.08) % (cw + 110) - 55;
            ctx.fillRect(x, baseY + 4 - (i % 3) * 7, 18, 30 + (i % 2) * 16);
            ctx.beginPath();
            ctx.arc(x + 9, baseY + 2 - (i % 3) * 7, 9, Math.PI, 0);
            ctx.fill();
        }
    } else {
        for (let i = 0; i < 10; i++) {
            const w = 22 + (i % 3) * 18;
            const h = 58 + ((i * 37) % 100);
            const x = (i * 71 + (mapOffsetY * 0.08)) % (cw + 120) - 60;
            ctx.fillRect(x, baseY - h, w, h);
            ctx.fillRect(x + w * 0.28, baseY - h - 18, w * 0.44, 18);
            if (phase >= 3) {
                ctx.fillRect(x - 7, baseY - h * 0.55, w + 14, 4);
                ctx.fillRect(x - 4, baseY - h * 0.28, w + 8, 3);
            }
        }
    }
    ctx.restore();

    // Saucer traffic and customs scanner ticks.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5 + phase; i++) {
        const x = (i * 113 + time * (14 + phase * 2)) % (cw + 120) - 60;
        const y = ch * (0.25 + ((i * 19) % 38) / 100);
        ctx.globalAlpha = 0.16 + phase * 0.018;
        ctx.strokeStyle = i % 2 ? palette[3] : palette[2];
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(x, y, 22, 7, Math.sin(time + i) * 0.08, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y - 4, 7, Math.PI, 0);
        ctx.stroke();
    }
    ctx.restore();

    // Timeline cracks only in finale phase.
    if (phase >= 4) {
        ctx.save();
        ctx.globalAlpha = 0.34 + Math.sin(time * 3) * 0.06;
        ctx.strokeStyle = 'rgba(255, 78, 122, 0.55)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 7; i++) {
            const x = (i * 67 + 24) % cw;
            ctx.beginPath();
            ctx.moveTo(x, ch * 0.12);
            ctx.lineTo(x + 14 * Math.sin(i), ch * 0.25);
            ctx.lineTo(x - 22 * Math.cos(i), ch * 0.42);
            ctx.lineTo(x + 18, ch * 0.58);
            ctx.stroke();
        }
        ctx.restore();
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 46; i++) {
        const seed = i * 97.31;
        const x = (Math.sin(seed) * 0.5 + 0.5) * cw;
        const y = (seed + mapOffsetY * (0.2 + (i % 5) * 0.023)) % ch;
        ctx.globalAlpha = 0.14 + (i % 4) * 0.03;
        ctx.fillStyle = i % 3 === 0 ? '#7cff00' : i % 3 === 1 ? '#52f7ff' : '#d7ff49';
        ctx.beginPath();
        ctx.arc(x, y, 1.2 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    const vignette = ctx.createRadialGradient(cw / 2, ch * 0.44, Math.min(cw, ch) * 0.14, cw / 2, ch / 2, Math.max(cw, ch) * 0.74);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(0.68, 'rgba(0,0,0,0.1)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.58)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, cw, ch);
}

// --- DRAWING ---
function draw() {
    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);

    // 1. Authored Procedural Portal Background (Infinite Scroll)
    drawPortalBackground();

    // 2. Portal Lights (Instability Mode Only)
    if (isNight) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = '#7cff00';
        // Procedural lights based on map scroll to simulate cities
        // We use a pseudo-random seed based on Y position to make lights stick to "ground"
        const seedStep = 50;
        const startY = Math.floor((mapOffsetY - ch) / seedStep) * seedStep;
        
        for (let y = startY; y < mapOffsetY + ch; y += seedStep) {
            // Simple hash to determine if a city is here
            const hash = Math.sin(y * 12.9898) * 43758.5453;
            if ((hash - Math.floor(hash)) > 0.8) {
                const lx = (Math.abs(Math.cos(y)) * cw) % cw;
                const ly = (y - mapOffsetY) + ch; // Project to screen space? No, mapOffsetY moves world up/down
                // Actually: map moves down (offset increases). 
                // World Y = y. Screen Y = y + mapOffsetY? 
                // Let's simplify: Items move down. Background moves down.
                // Lights are fixed on background.
                const screenY = (y % (cw * 1.5)) + (mapOffsetY % (cw * 1.5)); 
                // This is getting complex to sync perfect with image. 
                // Let's just draw drifting lights that look like cities.
                
                const driftY = (y + mapOffsetY) % ch;
                const driftX = (Math.abs(Math.sin(y)) * cw);
                
                ctx.globalAlpha = 0.6 + Math.sin(Date.now()*0.01 + y)*0.2;
                ctx.beginPath();
                ctx.arc(driftX, driftY, 2, 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.restore();
    }

    // 3. Dimension Props (Slime Clouds / Citadel Peaks)
    terrain.forEach(t => {
        ctx.save();
        ctx.globalAlpha = isNight ? 0.3 : 0.7;
        ctx.fillStyle = t.type === 'cloud' ? 'rgba(124, 255, 0, 0.24)' : 'rgba(82, 247, 255, 0.22)';
        
        if (t.type === 'cloud') {
            ctx.beginPath();
            ctx.arc(t.x, t.y, 28, 0, Math.PI*2);
            ctx.arc(t.x+28, t.y+8, 38, 0, Math.PI*2);
            ctx.arc(t.x-24, t.y+10, 22, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'rgba(183, 255, 60, 0.18)';
            ctx.fillRect(t.x - 16, t.y + 24, 8, 18);
            ctx.fillRect(t.x + 10, t.y + 27, 7, 14);
        } else {
            // Citadel traffic tower / dimensional antenna silhouette.
            ctx.fillRect(t.x + 34, t.y - 86, 32, 86);
            ctx.fillRect(t.x + 25, t.y - 46, 50, 8);
            ctx.fillRect(t.x + 40, t.y - 112, 20, 26);
            ctx.strokeStyle = 'rgba(215, 255, 73, 0.28)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(t.x + 50, t.y - 118, 30, 9, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    });

    // 4. Hero (Portal Cruiser)
    ctx.save();
    ctx.translate(hero.x, hero.y);
    // Tilt based on movement
    const tilt = (hero.targetX - hero.x) * 0.05;
    ctx.rotate(Math.max(-0.5, Math.min(0.5, tilt)));
    
     // Draw Portal Cruiser with scientist/coworker cockpit silhouette.
     const jetPulse = 0.78 + Math.sin(Date.now() * 0.018) * 0.12;
     ctx.fillStyle = '#fff';
      ctx.shadowColor = isNight ? '#7cff00' : 'rgba(82, 247, 255, 0.48)';
     ctx.shadowBlur = 18;
     
     // Contrail aura
     const trailGradient = ctx.createRadialGradient(0, 27, 0, 0, 31, 42);
      trailGradient.addColorStop(0, `rgba(124, 255, 0, ${0.72 * jetPulse})`);
      trailGradient.addColorStop(0.45, 'rgba(82, 247, 255, 0.22)');
      trailGradient.addColorStop(1, 'rgba(124, 255, 0, 0)');
     ctx.fillStyle = trailGradient;
     ctx.beginPath();
     ctx.ellipse(0, 30, 15, 40, 0, 0, Math.PI * 2);
     ctx.fill();

     // Portal exhaust ring
     ctx.strokeStyle = `rgba(124, 255, 0, ${0.66 * jetPulse})`;
     ctx.lineWidth = 3;
     ctx.beginPath();
     ctx.ellipse(0, 29, 19, 8, 0, 0, Math.PI * 2);
     ctx.stroke();
     
     // Wings / portal fins behind hull
     const wingGradient = ctx.createLinearGradient(-60, 0, 60, 0);
      wingGradient.addColorStop(0, '#52f7ff');
      wingGradient.addColorStop(0.5, '#efffff');
      wingGradient.addColorStop(1, '#7a31ff');
     ctx.fillStyle = wingGradient;
     ctx.beginPath();
     ctx.moveTo(0, -12);
     ctx.lineTo(62, 11);
     ctx.lineTo(0, 8);
     ctx.lineTo(-62, 11);
     ctx.closePath();
     ctx.fill();
     ctx.strokeStyle = 'rgba(8, 17, 29, 0.65)';
     ctx.lineWidth = 2;
     ctx.stroke();

     // Fuselage
     const fuselageGradient = ctx.createLinearGradient(0, -32, 0, 34);
     fuselageGradient.addColorStop(0, '#ffffff');
     fuselageGradient.addColorStop(0.55, '#fff4c2');
     fuselageGradient.addColorStop(1, '#ffbf66');
     ctx.fillStyle = fuselageGradient;
     ctx.beginPath();
     ctx.moveTo(0, -34);
     ctx.quadraticCurveTo(19, -9, 21, 30);
     ctx.lineTo(0, 18);
     ctx.lineTo(-21, 30);
     ctx.quadraticCurveTo(-19, -9, 0, -34);
     ctx.closePath();
     ctx.fill();
     ctx.strokeStyle = 'rgba(8, 17, 29, 0.6)';
     ctx.lineWidth = 2;
     ctx.stroke();
     
     // Canopy dome
     ctx.fillStyle = '#0d2e52';
     ctx.beginPath();
     ctx.ellipse(0, -11, 12, 14, 0, 0, Math.PI * 2);
     ctx.fill();

     // Tiny spiky scientist hair silhouette and nervous co-pilot dot.
     ctx.fillStyle = '#b7ff3c';
     ctx.beginPath();
     ctx.moveTo(-8, -18);
     ctx.lineTo(-13, -24);
     ctx.lineTo(-6, -21);
     ctx.lineTo(-4, -27);
     ctx.lineTo(0, -20);
     ctx.lineTo(4, -27);
     ctx.lineTo(6, -21);
     ctx.lineTo(13, -24);
     ctx.lineTo(8, -18);
     ctx.closePath();
     ctx.fill();
     ctx.fillStyle = '#08111d';
     ctx.beginPath();
     ctx.arc(-4, -10, 2.2, 0, Math.PI * 2);
     ctx.arc(5, -9, 1.9, 0, Math.PI * 2);
     ctx.fill();

     ctx.fillStyle = 'rgba(172, 235, 255, 0.78)';
     ctx.beginPath();
     ctx.ellipse(-4, -15, 4, 6, -0.3, 0, Math.PI * 2);
     ctx.fill();
     
     // Tail fins and nose accent
     ctx.fillStyle = '#ff7b6b';
     ctx.beginPath();
     ctx.moveTo(-9, 13);
     ctx.lineTo(0, -2);
     ctx.lineTo(9, 13);
     ctx.closePath();
     ctx.fill();
     
     ctx.fillStyle = '#ffd166';
     ctx.beginPath();
     ctx.arc(0, -29, 5, 0, Math.PI * 2);
     ctx.fill();
     
     // Engine core
      ctx.fillStyle = '#7cff00';
     ctx.beginPath();
     ctx.arc(0, 25, 6 + Math.random()*3, 0, Math.PI*2);
     ctx.fill();
    
    ctx.restore();

    // 5. Items (Dimension Samples)
    items.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        
        // Dimension sample card / customs permit. Color hints remain cosmetic only; category truth is unchanged.
        const isTarget = CONTINENTS[currentRegion].includes(item.text);
        const bubbleGradient = ctx.createLinearGradient(0, -24, 0, 24);
        bubbleGradient.addColorStop(0, isTarget ? 'rgba(245, 255, 234, 0.99)' : 'rgba(255, 241, 244, 0.99)');
        bubbleGradient.addColorStop(1, isTarget ? 'rgba(184, 255, 223, 0.97)' : 'rgba(255, 214, 220, 0.97)');
        ctx.shadowColor = isTarget ? 'rgba(124,255,0,0.34)' : 'rgba(255,78,122,0.32)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = bubbleGradient;
        ctx.beginPath();
        ctx.roundRect(-53, -23, 106, 46, 18);
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.strokeStyle = isTarget ? '#7cff00' : '#ff4e7a';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Portal rim / visa stamp mark.
        ctx.strokeStyle = isTarget ? 'rgba(82, 247, 255, 0.72)' : 'rgba(122, 49, 255, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(-36, 0, 10, 15, -0.28, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(33, -14);
        ctx.lineTo(44, -14);
        ctx.moveTo(31, 14);
        ctx.lineTo(44, 14);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.ellipse(-12, -8, 20, 6, -0.35, 0, Math.PI * 2);
        ctx.fill();

        // Text
        ctx.fillStyle = '#08111d';
        ctx.font = '700 15px "Exo 2"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.text, 2, 1, 84);
        
        ctx.restore();
    });

    // 6. Particles
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    });
    
    // 7. Instability Overlay (Vignette)
    if (isNight) {
        const grad = ctx.createRadialGradient(cw/2, ch/2, ch/4, cw/2, ch/2, ch);
        grad.addColorStop(0, 'rgba(0,0,50,0.1)');
        grad.addColorStop(1, 'rgba(0,0,20,0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,cw,ch);
    }
}

// Hot Reload Support
window.updateGameConfig = (key, val) => {
    if (gameConfig[key] !== undefined) gameConfig[key] = val;
};
</script>
