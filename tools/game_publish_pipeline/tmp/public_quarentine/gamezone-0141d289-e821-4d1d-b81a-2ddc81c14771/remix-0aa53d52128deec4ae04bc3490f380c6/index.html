<script>
/**
 * PORTAL TRIAGE: C-137 PURGE
 * Single-file implementation
 */

const CONFIG = {
    spawnRateFrames: 80,
    walkSpeedBase: 0.004,
    alienChance: 0.4,
    colors: {
        bgWall: '#061627',
        bgFloor: '#071a2e',
        bgTile1: '#0c2b2b',
        bgTile2: '#07101b',
        uiGreen: '#39ff8f',
        uiRed: '#ff3b8d',
        bone: '#65b7ff',
        alien: '#ff3b8d',
        portalRing: '#a6ff00',
        citadelCyan: '#58e7ff',
        amber: '#ffd166'
    },
    media: {
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',
        hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3',
        fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3',
        warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3'
    }
};

const STATE = {
    menu: 0,
    playing: 1,
    gameover: 2
};

let currentState = STATE.menu;
let score = 0;
let lives = 3;
let frame = 0;
let canvas, ctx;
let width, height;
let entities = [];
let particles = [];
let scanner = { x: -1000, y: -1000, active: false, charge: 0, r: 100 };
let shake = 0;
let feedbackTimers = {};

const AudioSys = {
    enabled: false,
    sounds: {},
    bgm: null,
    lastPlayTimes: {},
    init() {
        this.enabled = true;
        if (!this.bgm) {
            this.bgm = document.getElementById('bgm_hospital');
            this.bgm.src = CONFIG.media.bgm;
            this.bgm.volume = 0.2;
        }
        if (!Object.keys(this.sounds).length) {
            this.sounds = {
                start: document.getElementById('sfx-start'),
                shoot: document.getElementById('sfx-shoot'),
                hit: document.getElementById('sfx-hit'),
                fail: document.getElementById('sfx-fail'),
                warning: document.getElementById('sfx-warning')
            };
            Object.values(this.sounds).forEach((audio) => {
                if (audio) {
                    audio.volume = audio.id === 'sfx-warning' ? 0.3 : 0.45;
                }
            });
        }
        this.safePlayLoop();
    },
    safePlay(audio, cooldown = 0) {
        if (!this.enabled || !audio) return;
        const now = performance.now();
        const key = audio.id || audio.currentSrc;
        if (cooldown && this.lastPlayTimes[key] && now - this.lastPlayTimes[key] < cooldown) return;
        this.lastPlayTimes[key] = now;
        try {
            audio.pause();
            audio.currentTime = 0;
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (_) {}
    },
    safePlayLoop() {
        if (!this.enabled || !this.bgm) return;
        try {
            this.bgm.currentTime = 0;
            const playPromise = this.bgm.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (_) {}
    },
    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
    },
    playStart() {
        this.safePlay(this.sounds.start, 180);
    },
    playShoot() {
        this.safePlay(this.sounds.shoot, 70);
    },
    playHitAlien() {
        this.safePlay(this.sounds.hit, 120);
    },
    playFail() {
        this.safePlay(this.sounds.fail, 200);
    },
    playWarning() {
        this.safePlay(this.sounds.warning, 350);
    }
};

class Entity {
    constructor() {
        this.h = height * 0.35;
        this.w = this.h * 0.4;

        const horizon = height * 0.55;
        const groundSpace = height - horizon;
        const depth = Math.random();

        this.y = horizon + (groundSpace * 0.2) + (depth * groundSpace * 0.6);
        this.scale = 0.8 + (depth * 0.4);
        this.w *= this.scale;
        this.h *= this.scale;

        this.dir = Math.random() > 0.5 ? 1 : -1;
        this.x = this.dir === 1 ? -this.w : width + this.w;
        this.speed = width * CONFIG.walkSpeedBase * (0.8 + Math.random() * 0.4);

        this.isAlien = Math.random() < CONFIG.alienChance;
        this.dead = false;
        this.animOffset = Math.random() * 100;

        this.organs = [];
        if (this.isAlien) {
            const count = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                this.organs.push({
                    x: (Math.random() - 0.5) * this.w * 0.5,
                    y: (Math.random() - 0.5) * this.h * 0.4 - (this.h * 0.1),
                    r: this.w * (0.1 + Math.random() * 0.1),
                    pulseSpeed: 0.1 + Math.random() * 0.2
                });
            }
        }
    }

    update() {
        this.x += this.speed * this.dir;
    }

    draw(ctx, isXray) {
        const bounce = Math.abs(Math.sin((frame + this.animOffset) * 0.1)) * (this.h * 0.05);
        const drawY = this.y - this.h + bounce;
        const cx = this.x;
        const cy = drawY + this.h / 2;

        ctx.save();
        ctx.translate(cx, cy);

        if (isXray) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = CONFIG.colors.uiGreen;

            ctx.strokeStyle = "rgba(0, 255, 157, 0.3)";
            ctx.lineWidth = 2;
            ctx.fillStyle = "rgba(0, 20, 10, 0.8)";

            this.drawBodyPath(ctx);
            ctx.fill();
            ctx.stroke();

            if (this.isAlien) {
                ctx.fillStyle = CONFIG.colors.alien;
                ctx.shadowColor = CONFIG.colors.alien;
                this.organs.forEach(o => {
                    const pulse = 1 + Math.sin(frame * o.pulseSpeed) * 0.2;
                    ctx.beginPath();
                    ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
                    ctx.fill();
                });
            } else {
                ctx.strokeStyle = CONFIG.colors.bone;
                ctx.shadowColor = CONFIG.colors.bone;
                ctx.lineWidth = this.w * 0.08;
                ctx.lineCap = "round";

                ctx.beginPath();
                ctx.moveTo(0, -this.h * 0.3);
                ctx.lineTo(0, this.h * 0.2);
                for (let i = 0; i < 3; i++) {
                    let ry = -this.h * 0.2 + (i * this.h * 0.1);
                    ctx.moveTo(-this.w * 0.2, ry);
                    ctx.lineTo(this.w * 0.2, ry);
                }
                ctx.moveTo(-this.w * 0.15, this.h * 0.2);
                ctx.lineTo(this.w * 0.15, this.h * 0.2);
                ctx.stroke();
            }

            ctx.strokeStyle = this.isAlien ? CONFIG.colors.alien : CONFIG.colors.bone;
            ctx.beginPath();
            ctx.arc(0, -this.h * 0.4, this.w * 0.2, 0, Math.PI * 2);
            ctx.stroke();

        } else {
            ctx.shadowColor = "rgba(0,0,0,0.55)";
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 10;

            const bodyGrad = ctx.createLinearGradient(0, -this.h * 0.45, 0, this.h * 0.42);
            bodyGrad.addColorStop(0, this.isAlien ? '#26342b' : '#13283d');
            bodyGrad.addColorStop(1, this.isAlien ? '#090f0c' : '#080d18');
            ctx.fillStyle = bodyGrad;
            this.drawBodyPath(ctx);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = this.isAlien ? "rgba(255,59,141,0.72)" : "rgba(101,183,255,0.72)";
            ctx.lineWidth = Math.max(2, this.w * 0.035);
            this.drawBodyPath(ctx);
            ctx.stroke();

            ctx.fillStyle = this.isAlien ? "rgba(57,255,143,0.22)" : "rgba(255,209,102,0.18)";
            ctx.beginPath();
            ctx.ellipse(0, -this.h * 0.02, this.w * 0.24, this.h * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = this.isAlien ? "#ff3b8d" : "#65b7ff";
            ctx.shadowBlur = 18;
            ctx.shadowColor = this.isAlien ? "rgba(255,59,141,0.86)" : "rgba(101,183,255,0.86)";
            ctx.beginPath();
            ctx.arc(-this.w * 0.08, -this.h * 0.44, this.w * 0.055, 0, Math.PI * 2);
            ctx.arc(this.w * 0.08, -this.h * 0.44, this.w * 0.055, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = this.isAlien ? "rgba(255,59,141,0.42)" : "rgba(101,183,255,0.32)";
            ctx.lineWidth = Math.max(1, this.w * 0.025);
            ctx.beginPath();
            ctx.moveTo(-this.w * 0.18, -this.h * 0.14);
            ctx.quadraticCurveTo(0, -this.h * 0.2, this.w * 0.18, -this.h * 0.14);
            ctx.moveTo(-this.w * 0.2, this.h * 0.04);
            ctx.lineTo(this.w * 0.2, this.h * 0.04);
            ctx.stroke();

            if (this.isAlien) {
                ctx.strokeStyle = "rgba(166,255,0,0.5)";
                ctx.beginPath();
                ctx.moveTo(-this.w * 0.08, -this.h * 0.62);
                ctx.lineTo(-this.w * 0.26, -this.h * 0.72);
                ctx.moveTo(this.w * 0.08, -this.h * 0.62);
                ctx.lineTo(this.w * 0.26, -this.h * 0.72);
                ctx.stroke();
            } else {
                ctx.fillStyle = "rgba(255,209,102,0.72)";
                ctx.beginPath();
                ctx.arc(0, -this.h * 0.64, this.w * 0.045, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        ctx.restore();
    }

    drawBodyPath(ctx) {
        const w = this.w;
        const h = this.h;
        ctx.beginPath();
        ctx.arc(0, -h * 0.4, w * 0.25, 0, Math.PI * 2);
        ctx.moveTo(-w * 0.35, -h * 0.25);
        ctx.lineTo(-w * 0.4, h * 0.4);
        ctx.lineTo(w * 0.4, h * 0.4);
        ctx.lineTo(w * 0.35, -h * 0.25);
        ctx.closePath();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 5 + 2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.05;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function drawHospitalBackground() {
    const horizon = height * 0.55;
    const cx = width / 2;
    const pulse = 0.5 + Math.sin(frame * 0.025) * 0.5;

    const ceilGrad = ctx.createLinearGradient(0, 0, 0, horizon);
    ceilGrad.addColorStop(0, '#061627');
    ceilGrad.addColorStop(0.52, '#071a2e');
    ceilGrad.addColorStop(1, '#102232');
    ctx.fillStyle = ceilGrad;
    ctx.fillRect(0, 0, width, horizon);

    const portalY = horizon * 0.48;
    const portalRx = Math.min(width * 0.34, height * 0.28);
    const portalRy = portalRx * 0.52;

    ctx.save();
    ctx.translate(cx, portalY);
    ctx.rotate(Math.sin(frame * 0.01) * 0.035);
    for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = `rgba(${i % 2 ? '57,255,143' : '166,255,0'},${0.18 + i * 0.06 + pulse * 0.04})`;
        ctx.lineWidth = Math.max(2, portalRx * (0.025 - i * 0.002));
        ctx.beginPath();
        ctx.ellipse(0, 0, portalRx - i * 20, portalRy - i * 10, frame * 0.002 + i * 0.35, 0, Math.PI * 2);
        ctx.stroke();
    }

    const portalGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, portalRx);
    portalGlow.addColorStop(0, `rgba(57,255,143,${0.18 + pulse * 0.08})`);
    portalGlow.addColorStop(0.46, 'rgba(88,231,255,0.08)');
    portalGlow.addColorStop(1, 'rgba(3,7,17,0)');
    ctx.fillStyle = portalGlow;
    ctx.beginPath();
    ctx.ellipse(0, 0, portalRx * 0.92, portalRy * 0.92, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const floorGrad = ctx.createLinearGradient(0, horizon, 0, height);
    floorGrad.addColorStop(0, '#0b2732');
    floorGrad.addColorStop(1, '#050913');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, horizon, width, height - horizon);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, horizon, width, height - horizon);
    ctx.clip();

    ctx.strokeStyle = "rgba(57,255,143,0.13)";
    ctx.lineWidth = 2;

    const numVLines = 12;
    for (let i = -numVLines; i <= numVLines; i++) {
        const x = cx + (i * width * 0.2);
        ctx.beginPath();
        ctx.moveTo(cx, horizon);
        ctx.lineTo(x, height * 1.5);
        ctx.stroke();
    }

    for (let i = 0; i < 10; i++) {
        const y = horizon + Math.pow(i / 10, 2) * (height - horizon);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
    }
    ctx.restore();

    for (let i = 0; i < 7; i++) {
        const towerW = width * (0.025 + (i % 3) * 0.008);
        const towerH = horizon * (0.28 + (i % 4) * 0.12);
        const x = width * (0.06 + i * 0.15);
        ctx.fillStyle = i % 2 === 0 ? "rgba(57,255,143,0.09)" : "rgba(88,231,255,0.075)";
        ctx.fillRect(x, horizon - towerH, towerW, towerH);
        ctx.fillStyle = "rgba(166,255,0,0.18)";
        ctx.fillRect(x + towerW * 0.28, horizon - towerH + 12, towerW * 0.45, 3);
        ctx.fillRect(x + towerW * 0.28, horizon - towerH + 28, towerW * 0.45, 3);
    }

    for (let i = 0; i < 18; i++) {
        const px = (i * 73 + frame * (0.18 + (i % 3) * 0.05)) % (width + 80) - 40;
        const py = (horizon * 0.18) + ((i * 47) % Math.max(1, horizon * 0.62));
        const r = 1.4 + (i % 4) * 0.8;
        ctx.fillStyle = i % 5 === 0 ? "rgba(255,59,141,0.16)" : "rgba(57,255,143,0.18)";
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.strokeStyle = "rgba(255,59,141,0.08)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
        const crackX = width * (0.12 + i * 0.2);
        ctx.beginPath();
        ctx.moveTo(crackX, horizon * 0.12);
        ctx.lineTo(crackX + Math.sin(frame * 0.01 + i) * 8, horizon * 0.2);
        ctx.lineTo(crackX - 14, horizon * 0.31);
        ctx.stroke();
    }

    const dangerGrad = ctx.createLinearGradient(0, horizon * 0.65, 0, height);
    dangerGrad.addColorStop(0, 'rgba(255, 59, 141, 0)');
    dangerGrad.addColorStop(1, 'rgba(255, 59, 141, 0.08)');
    ctx.fillStyle = dangerGrad;
    ctx.fillRect(0, horizon, width, height - horizon);

    const vig = ctx.createRadialGradient(cx, horizon, height * 0.2, cx, horizon, height);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.7, 'rgba(0,10,20,0.52)');
    vig.addColorStop(1, 'rgba(0,0,0,0.92)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, width, height);
}

function showFeedback(id, duration = 900) {
    const node = document.getElementById(id);
    if (!node) return;
    node.classList.add('show');
    clearTimeout(feedbackTimers[id]);
    feedbackTimers[id] = setTimeout(() => {
        node.classList.remove('show');
    }, duration);
}

function drawScanner() {
    if (!scanner.active) return;

    const r = scanner.r;

    ctx.save();
    ctx.beginPath();
    ctx.arc(scanner.x, scanner.y, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = "#001100";
    ctx.fillRect(scanner.x - r, scanner.y - r, r * 2, r * 2);

    entities.forEach(e => {
        if (Math.abs(e.x - scanner.x) < r + e.w && Math.abs(e.y - scanner.y) < r + e.h) {
            e.draw(ctx, true);
        }
    });

    ctx.fillStyle = "rgba(0, 255, 157, 0.1)";
    for (let i = 0; i < r * 2; i += 4) {
        ctx.fillRect(scanner.x - r, scanner.y - r + i + (frame % 4), r * 2, 1);
    }

    ctx.restore();

    ctx.strokeStyle = CONFIG.colors.uiGreen;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 12;
    ctx.shadowColor = CONFIG.colors.uiGreen;

    ctx.beginPath();
    ctx.arc(scanner.x, scanner.y, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = CONFIG.colors.portalRing;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(scanner.x, scanner.y, r * 0.78, r * 0.36, frame * 0.02, 0, Math.PI * 2);
    ctx.ellipse(scanner.x, scanner.y, r * 0.36, r * 0.78, -frame * 0.018, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = CONFIG.colors.uiGreen;
    ctx.beginPath();
    ctx.moveTo(scanner.x - 20, scanner.y);
    ctx.lineTo(scanner.x + 20, scanner.y);
    ctx.moveTo(scanner.x, scanner.y - 20);
    ctx.lineTo(scanner.x, scanner.y + 20);
    ctx.stroke();

    ctx.font = "700 16px 'Orbitron'";
    ctx.fillStyle = CONFIG.colors.uiGreen;
    ctx.textAlign = "center";
     ctx.fillText("PORTAL SCOPE", scanner.x, scanner.y - r - 10);
    ctx.textAlign = "start";
}

function spawnEntity() {
    entities.push(new Entity());
    entities.sort((a, b) => a.y - b.y);
}

function checkShot() {
    AudioSys.playShoot();
    shake = 10;

    for (let i = 0; i < 10; i++) {
        particles.push(new Particle(scanner.x, scanner.y, '#ffffff'));
    }

    let hit = null;
    for (let i = entities.length - 1; i >= 0; i--) {
        const e = entities[i];
        const dx = scanner.x - e.x;
        const dy = scanner.y - (e.y - e.h / 2);
        if (Math.abs(dx) < e.w && Math.abs(dy) < e.h / 2) {
            hit = e;
            break;
        }
    }

    if (hit) {
        hit.dead = true;
        if (hit.isAlien) {
            score += 100;
            AudioSys.playHitAlien();
            showFeedback('gif-alien-hit', 950);
            for (let i = 0; i < 20; i++) particles.push(new Particle(hit.x, hit.y - hit.h / 2, CONFIG.colors.alien));
        } else {
            AudioSys.playFail();
            showFeedback('gif-critical-fail', 1300);
            for (let i = 0; i < 30; i++) particles.push(new Particle(hit.x, hit.y - hit.h / 2, '#aa0000'));
            endGame("SAFE TRAVELER ZAPPED");
            return;
        }
    }

    document.getElementById('scoreVal').innerText = score;
    entities = entities.filter(e => !e.dead);
}

function endGame(reason) {
    currentState = STATE.gameover;
    AudioSys.stopLoop();
    AudioSys.playFail();
    showFeedback('gif-critical-fail', 1300);
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = score;
    document.getElementById('fail-reason').innerText = reason;
}

function resetGame() {
    score = 0;
    lives = 3;
    entities = [];
    particles = [];
    frame = 0;
    scanner.active = false;
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('livesVal').innerText = lives;
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    currentState = STATE.playing;
    AudioSys.init();
    AudioSys.playStart();
}

function loop() {
    requestAnimationFrame(loop);

    if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        width = canvas.width;
        height = canvas.height;
        scanner.r = Math.min(width, height) * 0.15;
    }

    let sx = 0, sy = 0;
    if (shake > 0) {
        sx = (Math.random() - 0.5) * shake;
        sy = (Math.random() - 0.5) * shake;
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.clearRect(0, 0, width, height);

    drawHospitalBackground();

    if (currentState === STATE.playing) {
        frame++;
        if (frame % CONFIG.spawnRateFrames === 0) spawnEntity();

        for (let i = entities.length - 1; i >= 0; i--) {
            const e = entities[i];
            e.update();

            if ((e.dir === 1 && e.x > width + e.w) || (e.dir === -1 && e.x < -e.w)) {
                if (e.isAlien) {
                    lives--;
                    document.getElementById('livesVal').innerText = lives;
                    shake = 15;
                    AudioSys.playWarning();
                     if (lives <= 0) endGame("PARASITE HOST BREACHED PORTAL");
                }
                entities.splice(i, 1);
            }
        }

     }

     entities.forEach(e => e.draw(ctx, false));

    drawScanner();

    particles.forEach((p, i) => {
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
    });

    ctx.restore();
}

function initInput() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    scanner.r = Math.min(width, height) * 0.15;

    const getPos = (e) => {
        return { x: e.clientX, y: e.clientY };
    };

    const startScan = (e) => {
        if (currentState !== STATE.playing) return;
        if (e.cancelable) e.preventDefault();
        const pos = getPos(e.touches ? e.touches[0] : e);
        scanner.x = pos.x;
        scanner.y = pos.y;
        scanner.active = true;
        AudioSys.init();
    };

    const moveScan = (e) => {
        if (!scanner.active) return;
        if (e.cancelable) e.preventDefault();
        const pos = getPos(e.touches ? e.touches[0] : e);
        scanner.x = pos.x;
        scanner.y = pos.y;
    };

    const endScan = (e) => {
        if (currentState !== STATE.playing) return;
        if (e?.cancelable) e.preventDefault();
        if (scanner.active) {
            checkShot();
            scanner.active = false;
        }
    };

    canvas.addEventListener('touchstart', startScan, { passive: false });
    canvas.addEventListener('touchmove', moveScan, { passive: false });
    canvas.addEventListener('touchend', endScan, { passive: false });

    canvas.addEventListener('mousedown', startScan);
    canvas.addEventListener('mousemove', moveScan);
    canvas.addEventListener('mouseup', endScan);

    document.getElementById('start-btn').addEventListener('click', resetGame);
    document.getElementById('restart-btn').addEventListener('click', resetGame);
}

document.addEventListener('DOMContentLoaded', () => {
    initInput();
    loop();
});
</script>
