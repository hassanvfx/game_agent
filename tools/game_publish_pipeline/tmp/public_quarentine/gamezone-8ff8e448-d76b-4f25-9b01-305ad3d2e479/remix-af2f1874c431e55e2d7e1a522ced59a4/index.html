<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Escape Run</title>
    <!-- [agent-note][stage1] role: future-audio | trigger: near-miss-streak | intent: reward clean evasive play -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <!-- [agent-note][stage3] resolved-font: title/hud -> Orbitron | ui/body -> Exo 2 | source: catalogs/fonts.json -->
    <!-- [agent-note][stage3] resolved-audio: start, streak, warning, fail, loop -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-gif: start-callout and crash-feedback overlays -> catalogs/gifs.json -->
    <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
    <!-- [agent-note][stage4] repaired: mobile-input-risk | element: body/canvas | action: keep gesture suppression scoped to gameplay surface -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #07111f;
            --bg-bottom: #020611;
            --panel: rgba(8, 16, 36, 0.82);
            --panel-border: rgba(118, 238, 255, 0.34);
            --panel-shadow: rgba(0, 0, 0, 0.45);
            --text-main: #f4fbff;
            --text-soft: rgba(226, 244, 255, 0.78);
            --aqua: #76eeff;
            --aqua-strong: #1fd6ff;
            --gold: #ffd95e;
            --gold-deep: #f59e0b;
            --danger: #ff597f;
            --road: #162033;
            --road-edge: #90f6ff;
            --lane-glow: rgba(118, 238, 255, 0.22);
            --grass-dark: #0d2330;
            --grass-light: #123345;
            --hud-font: 'Orbitron', 'Trebuchet MS', sans-serif;
            --ui-font: 'Exo 2', 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            touch-action: manipulation;
            font-family: var(--ui-font);
            background:
                radial-gradient(circle at top, rgba(31, 214, 255, 0.16), transparent 35%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 217, 94, 0.13), transparent 18%),
                radial-gradient(circle at 85% 20%, rgba(31, 214, 255, 0.14), transparent 24%),
                radial-gradient(circle at 50% 80%, rgba(118, 238, 255, 0.08), transparent 26%);
            filter: blur(8px);
        }

        body::after {
            opacity: 0.18;
            background-image:
                linear-gradient(rgba(118, 238, 255, 0.10) 1px, transparent 1px),
                linear-gradient(90deg, rgba(118, 238, 255, 0.08) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 95%);
            -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 95%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            touch-action: none;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(13, 24, 48, 0.94), rgba(6, 12, 28, 0.92));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 42px var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 24px rgba(31, 214, 255, 0.15);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(118, 238, 255, 0.16), transparent 42%),
                linear-gradient(315deg, rgba(255, 217, 94, 0.12), transparent 36%);
            pointer-events: none;
        }

        .hud-card {
            min-width: 0;
            padding: 0.55rem 0.8rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(5, 16, 35, 0.88), rgba(9, 24, 46, 0.82));
            border: 1px solid rgba(118, 238, 255, 0.28);
            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.28),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .hud-label {
            display: block;
            font-family: var(--hud-font);
            font-size: 0.66rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-soft);
            margin-bottom: 0.18rem;
        }

        .hud-value {
            display: block;
            font-family: var(--hud-font);
            font-size: 1rem;
            letter-spacing: 0.06em;
            color: var(--text-main);
            text-shadow: 0 0 12px rgba(118, 238, 255, 0.28);
        }

        .hud-value .accent {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 217, 94, 0.32);
        }

        .hero-title,
        .screen-title {
            margin: 0;
            font-family: var(--hud-font);
            line-height: 0.94;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: clamp(1.95rem, 8vw, 3.2rem);
            color: #f9feff;
            text-shadow:
                0 0 16px rgba(118, 238, 255, 0.55),
                0 0 30px rgba(31, 214, 255, 0.28);
        }

        .screen-title {
            font-size: clamp(1.7rem, 8vw, 2.8rem);
            color: #ffd5df;
            text-shadow:
                0 0 14px rgba(255, 89, 127, 0.45),
                0 0 24px rgba(255, 89, 127, 0.2);
        }

        .pilot-line,
        .screen-subtitle {
            margin: 0;
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-soft);
        }

        .pilot-tag {
            color: var(--gold);
        }

        .briefing {
            margin: 0;
            font-size: 1rem;
            line-height: 1.32;
            color: rgba(235, 247, 255, 0.92);
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin: 1rem 0 1.15rem;
        }

        .pilot-chip {
            padding: 0.45rem 0.75rem;
            border-radius: 999px;
            background: rgba(118, 238, 255, 0.1);
            border: 1px solid rgba(118, 238, 255, 0.22);
            color: var(--text-soft);
            font-size: 0.9rem;
            letter-spacing: 0.04em;
        }

        .hero-avatar {
            width: min(170px, 38vw);
            aspect-ratio: 1;
            margin: 0 auto 1rem;
            border-radius: 28%;
            display: grid;
            place-items: center;
            position: relative;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.7), transparent 18%),
                linear-gradient(145deg, rgba(31, 214, 255, 0.28), rgba(10, 18, 41, 0.15)),
                rgba(6, 13, 28, 0.95);
            border: 1px solid rgba(118, 238, 255, 0.3);
            box-shadow:
                0 0 24px rgba(31, 214, 255, 0.26),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .hero-avatar::before,
        .hero-avatar::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(118, 238, 255, 0.22);
            inset: 12%;
        }

        .hero-avatar::after {
            inset: -7%;
            border-style: dashed;
            opacity: 0.65;
            animation: spinHalo 12s linear infinite;
        }

        .hero-emoji {
            font-size: clamp(3.7rem, 14vw, 5.6rem);
            filter: drop-shadow(0 0 10px rgba(255, 217, 94, 0.35));
            transform: translateY(-2px);
            animation: pilotFloat 2.4s ease-in-out infinite;
        }

        .cta-button {
            appearance: none;
            border: none;
            border-radius: 999px;
            padding: 0.95rem 1.7rem;
            width: 100%;
            max-width: 260px;
            font-family: var(--hud-font);
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #07111f;
            background: linear-gradient(180deg, #ffe27b, #ffb72d);
            box-shadow:
                0 12px 22px rgba(245, 158, 11, 0.28),
                0 0 18px rgba(255, 217, 94, 0.32);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            cursor: pointer;
        }

        .cta-button:hover,
        .cta-button:focus-visible {
            transform: translateY(-1px);
            box-shadow:
                0 15px 26px rgba(245, 158, 11, 0.32),
                0 0 22px rgba(255, 217, 94, 0.38);
            filter: brightness(1.06);
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        .secondary-button {
            background: linear-gradient(180deg, #eef8ff, #c6dbeb);
            box-shadow:
                0 12px 22px rgba(122, 177, 207, 0.2),
                0 0 18px rgba(198, 219, 235, 0.22);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.9rem;
            padding: 0.42rem 0.8rem;
            border-radius: 999px;
            background: rgba(255, 89, 127, 0.12);
            border: 1px solid rgba(255, 89, 127, 0.24);
            color: #ffd6e1;
            font-family: var(--hud-font);
            font-size: 0.74rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--danger);
            box-shadow: 0 0 12px rgba(255, 89, 127, 0.75);
        }

        .pulse-copy {
            animation: uiPulse 1.5s ease-in-out infinite;
        }

        .feedback-gif {
            width: min(100%, 220px);
            border-radius: 1rem;
            object-fit: cover;
            display: block;
            margin: 0.8rem auto 0;
            border: 1px solid rgba(118, 238, 255, 0.24);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
            opacity: 0.9;
        }

        #feedback-strip {
            position: absolute;
            right: max(0.8rem, env(safe-area-inset-right));
            bottom: max(0.8rem, env(safe-area-inset-bottom));
            z-index: 3;
            pointer-events: none;
            display: flex;
            justify-content: flex-end;
            width: 100%;
            padding-left: 4rem;
        }

        .feedback-card {
            max-width: min(42vw, 170px);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(118, 238, 255, 0.24);
            background: rgba(5, 16, 35, 0.8);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
            opacity: 0;
            transform: translateY(16px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feedback-card .feedback-copy {
            padding: 0.45rem 0.55rem 0.55rem;
            font-family: var(--hud-font);
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
            text-align: center;
        }

        @keyframes pilotFloat {
            0%, 100% { transform: translateY(-2px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }

        @keyframes spinHalo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes uiPulse {
            0%, 100% { opacity: 0.82; }
            50% { opacity: 1; }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            isolation: isolate;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(0.75rem, env(safe-area-inset-top)) 0.75rem max(0.75rem, env(safe-area-inset-bottom)) 0.75rem;
        }

        .overlay-screen {
            width: min(100%, 24rem);
            padding: 1.15rem;
            border-radius: 1.55rem;
            text-align: center;
            pointer-events: auto;
            margin: 0 0.25rem;
        }

        #game-over-screen.hidden,
        #start-screen.hidden,
        #hud.hidden {
            display: none;
        }

        #hud {
            position: absolute;
            top: max(0.9rem, env(safe-area-inset-top));
            left: max(0.9rem, env(safe-area-inset-left));
            right: max(0.9rem, env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.65rem;
        }

        @media (max-width: 480px) {
            .overlay-screen {
                width: min(100%, 22rem);
                padding: 1rem 0.95rem;
                border-radius: 1.3rem;
            }

            #hud {
                gap: 0.5rem;
            }

            .hud-card {
                padding: 0.5rem 0.65rem;
                border-radius: 0.9rem;
            }

            .hud-label {
                font-size: 0.56rem;
            }

            .hud-value {
                font-size: 0.85rem;
            }

            .pilot-line,
            .screen-subtitle,
            .briefing {
                font-size: 0.95rem;
            }

            .cta-button {
                font-size: 0.92rem;
                padding: 0.9rem 1.2rem;
            }

            .feedback-card {
                max-width: 132px;
            }

            .feedback-card .feedback-copy {
                font-size: 0.56rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="start-screen" class="glass-panel overlay-screen">
                <div class="hero-avatar" aria-hidden="true">
                    <div class="hero-emoji">🏎️</div>
                </div>
                <h1 class="hero-title">Neon Escape Run</h1>
                <p class="pilot-line">Pilot: <span class="pilot-tag">Arc Runner</span></p>
                <div class="chip-row" aria-hidden="true">
                    <span class="pilot-chip">⚡ lane ghost</span>
                    <span class="pilot-chip">🛡️ clean dodge</span>
                    <span class="pilot-chip">🌃 night sprint</span>
                </div>
                <p class="briefing pulse-copy">Thread through the midnight convoy and keep every pass perfectly clean.</p>
                <img
                    class="feedback-gif"
                    src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp"
                    alt="Animated racing power-up reaction"
                    loading="lazy"
                    decoding="async">
                <div style="height: 1rem;"></div>
                <button id="start-btn" class="cta-button">Enter Traffic</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel overlay-screen">
                <div class="status-badge"><span class="status-dot"></span> Intercepted</div>
                <h2 class="screen-title">Run Broken</h2>
                <p class="screen-subtitle">Clean passes: <span id="finalScore" style="color: var(--gold);">0</span></p>
                <div class="chip-row" aria-hidden="true">
                    <span class="pilot-chip">💥 road contact</span>
                    <span class="pilot-chip">🔁 instant relaunch</span>
                </div>
                <img
                    class="feedback-gif"
                    src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
                    alt="Animated game-over reaction"
                    loading="lazy"
                    decoding="async">
                <button id="restart-btn" class="cta-button secondary-button">Run Again</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-card">
                    <span class="hud-label">Passes</span>
                    <span class="hud-value"><span id="score" class="accent">0</span></span>
                </div>
                <div class="hud-card" style="text-align: right;">
                    <span class="hud-label">Pulse</span>
                    <span class="hud-value"><span id="speed-indicator">100</span> km/h</span>
                </div>
            </div>
        </div>

        <div id="feedback-strip" aria-live="polite" aria-atomic="true">
            <div id="feedback-card" class="feedback-card">
                <img id="feedback-image" src="" alt="">
                <div id="feedback-copy" class="feedback-copy"></div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const MEDIA = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            gifs: {
                streak: {
                    src: "https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp",
                    alt: "Celebration feedback animation"
                },
                crash: {
                    src: "https://i.giphy.com/roB5nN2qNNfhUKcprN.webp",
                    alt: "Collision feedback animation"
                }
            }
        };

        class AudioController {
            constructor() {
                this.enabled = false;
                this.unlocked = false;
                this.lastPlayed = new Map();
                this.bgm = this.createAudio(MEDIA.bgm, 0.28, true);
                this.sfx = Object.fromEntries(
                    Object.entries(MEDIA.sfx).map(([key, url]) => [key, this.createAudio(url, this.getVolume(key), false)])
                );
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                return audio;
            }

            getVolume(key) {
                return {
                    start: 0.55,
                    score: 0.5,
                    warning: 0.42,
                    fail: 0.62
                }[key] ?? 0.5;
            }

            async unlock() {
                if (this.unlocked) {
                    this.enabled = true;
                    return;
                }

                const targets = [this.bgm, ...Object.values(this.sfx)];
                try {
                    await Promise.all(targets.map(async (audio) => {
                        try {
                            audio.muted = true;
                            await audio.play();
                            audio.pause();
                            audio.currentTime = 0;
                        } catch (_) {
                            return;
                        } finally {
                            audio.muted = false;
                        }
                    }));
                    this.unlocked = true;
                    this.enabled = true;
                } catch (_) {
                    this.enabled = false;
                }
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 0) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) ?? 0;
                if (cooldown && now - last < cooldown) return;
                this.lastPlayed.set(key, now);

                const template = this.sfx[key];
                const clone = template.cloneNode();
                clone.volume = template.volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreValue = document.getElementById('score');
        const speedValue = document.getElementById('speed-indicator');
        const finalScore = document.getElementById('finalScore');
        const feedbackCard = document.getElementById('feedback-card');
        const feedbackImage = document.getElementById('feedback-image');
        const feedbackCopy = document.getElementById('feedback-copy');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;
        let laneOffset = 0;
        let roadGlowOffset = 0;
        let skylinePulse = 0;
        let feedbackTimeout = null;

        const player = {
            x: 0,
            y: 0,
            width: 50,
            height: 90,
            color: '#ffd95e',
            targetX: 0
        };

        let traffic = [];
        let roadWidth = 300;
        let roadX = 0;

        function showFeedback(type, label) {
            const media = MEDIA.gifs[type];
            if (!media) return;
            feedbackImage.src = media.src;
            feedbackImage.alt = media.alt;
            feedbackCopy.textContent = label;
            feedbackCard.classList.add('visible');
            window.clearTimeout(feedbackTimeout);
            feedbackTimeout = window.setTimeout(() => {
                feedbackCard.classList.remove('visible');
            }, 1500);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            roadWidth = Math.min(400, width * 0.9);
            roadX = (width - roadWidth) / 2;

            player.width = roadWidth * 0.12;
            player.height = player.width * 1.8;
            player.y = height - player.height - 50;

            if (!gameActive) {
                player.x = width / 2 - player.width / 2;
                player.targetX = width / 2 - player.width / 2;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        function handleInput(clientX) {
            if (!gameActive) return;
            const halfPlayer = player.width / 2;
            const minX = roadX + 10;
            const maxX = roadX + roadWidth - 10;
            let target = clientX - halfPlayer;

            if (target < minX) target = minX;
            if (target + player.width > maxX) target = maxX - player.width;

            player.targetX = target;
        }

        canvas.addEventListener('mousemove', (e) => handleInput(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchstart', (e) => {
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        function drawBackdrop() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#07111f');
            skyGradient.addColorStop(0.45, '#0b1930');
            skyGradient.addColorStop(1, '#020611');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.8;
            for (let i = 0; i < 4; i++) {
                const glowX = ((i + 1) * width) / 5;
                const glowY = height * 0.2 + Math.sin((frameCount * 0.01) + i) * 8;
                const glow = ctx.createRadialGradient(glowX, glowY, 10, glowX, glowY, 140);
                glow.addColorStop(0, 'rgba(31,214,255,0.18)');
                glow.addColorStop(1, 'rgba(31,214,255,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(glowX, glowY, 140, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            drawSkyline();
            drawShoulders();
        }

        function drawSkyline() {
            skylinePulse += 0.05;
            const horizon = height * 0.26;
            const buildingWidth = Math.max(18, width / 16);

            for (let i = 0; i < Math.ceil(width / buildingWidth) + 2; i++) {
                const x = i * buildingWidth - 10;
                const towerHeight = 40 + ((i * 29) % 110);
                const y = horizon - towerHeight;
                const shade = i % 2 === 0 ? '#0d2238' : '#112a43';

                ctx.fillStyle = shade;
                ctx.fillRect(x, y, buildingWidth - 4, towerHeight);

                for (let wy = y + 10; wy < horizon - 8; wy += 12) {
                    const flicker = 0.12 + ((Math.sin(skylinePulse + i + wy) + 1) * 0.08);
                    ctx.fillStyle = `rgba(118, 238, 255, ${flicker.toFixed(3)})`;
                    ctx.fillRect(x + 5, wy, 3, 5);
                    ctx.fillRect(x + buildingWidth - 12, wy + 2, 3, 4);
                }
            }
        }

        function drawShoulders() {
            laneOffset = (laneOffset + gameSpeed) % 96;
            roadGlowOffset = (roadGlowOffset + gameSpeed * 0.5) % 52;

            ctx.fillStyle = '#0d2330';
            ctx.fillRect(0, 0, roadX, height);
            ctx.fillRect(roadX + roadWidth, 0, width - (roadX + roadWidth), height);

            for (let i = -100; i < height + 100; i += 96) {
                ctx.fillStyle = '#123345';
                ctx.fillRect(0, i + laneOffset, roadX, 44);
                ctx.fillRect(roadX + roadWidth, i + laneOffset, width - (roadX + roadWidth), 44);

                ctx.fillStyle = 'rgba(118, 238, 255, 0.08)';
                ctx.fillRect(Math.max(0, roadX - 16), i + roadGlowOffset, 12, 26);
                ctx.fillRect(roadX + roadWidth + 4, i + roadGlowOffset, 12, 26);
            }
        }

        function drawRoad() {
            ctx.fillStyle = '#162033';
            ctx.fillRect(roadX, 0, roadWidth, height);

            const roadGlow = ctx.createLinearGradient(roadX, 0, roadX + roadWidth, 0);
            roadGlow.addColorStop(0, 'rgba(118, 238, 255, 0.18)');
            roadGlow.addColorStop(0.08, 'rgba(118, 238, 255, 0)');
            roadGlow.addColorStop(0.92, 'rgba(118, 238, 255, 0)');
            roadGlow.addColorStop(1, 'rgba(118, 238, 255, 0.18)');
            ctx.fillStyle = roadGlow;
            ctx.fillRect(roadX, 0, roadWidth, height);

            ctx.fillStyle = '#90f6ff';
            ctx.fillRect(roadX, 0, 8, height);
            ctx.fillRect(roadX + roadWidth - 8, 0, 8, height);

            ctx.save();
            ctx.strokeStyle = 'rgba(118, 238, 255, 0.12)';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 14]);
            for (let i = -height; i < height * 2; i += 80) {
                ctx.beginPath();
                ctx.moveTo(roadX + 12, i + (laneOffset * 0.8));
                ctx.lineTo(roadX + roadWidth - 12, i + 40 + (laneOffset * 0.8));
                ctx.stroke();
            }
            ctx.restore();

            const laneCount = 3;
            const laneWidth = roadWidth / laneCount;
            for (let i = 1; i < laneCount; i++) {
                const x = roadX + i * laneWidth;
                for (let j = -100; j < height; j += 82) {
                    ctx.fillStyle = 'rgba(220, 248, 255, 0.82)';
                    ctx.fillRect(x - 1.5, j + laneOffset, 3, 30);

                    ctx.fillStyle = 'rgba(118, 238, 255, 0.22)';
                    ctx.fillRect(x - 4, j + laneOffset - 2, 8, 34);
                }
            }
        }

        function drawTrail(x, y, w, h, tint) {
            ctx.save();
            const gradient = ctx.createLinearGradient(x + w / 2, y + h, x + w / 2, y + h + 38);
            gradient.addColorStop(0, tint);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.2, y + h);
            ctx.lineTo(x + w * 0.8, y + h);
            ctx.lineTo(x + w * 0.62, y + h + 34);
            ctx.lineTo(x + w * 0.38, y + h + 34);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawCar(drawCtx, x, y, w, h, color, isPlayer = false) {
            drawCtx.save();

            if (isPlayer) {
                drawTrail(x, y, w, h, 'rgba(255, 217, 94, 0.24)');
            }

            drawCtx.fillStyle = 'rgba(0, 0, 0, 0.28)';
            drawCtx.beginPath();
            drawCtx.ellipse(x + w / 2, y + h + 7, w * 0.42, h * 0.13, 0, 0, Math.PI * 2);
            drawCtx.fill();

            const bodyGradient = drawCtx.createLinearGradient(x, y, x, y + h);
            bodyGradient.addColorStop(0, isPlayer ? '#fff4b6' : 'rgba(255,255,255,0.38)');
            bodyGradient.addColorStop(0.2, color);
            bodyGradient.addColorStop(1, isPlayer ? '#f59e0b' : '#10192b');

            drawCtx.fillStyle = bodyGradient;
            drawCtx.beginPath();
            drawCtx.moveTo(x + w * 0.22, y);
            drawCtx.quadraticCurveTo(x + w * 0.5, y - h * 0.06, x + w * 0.78, y);
            drawCtx.lineTo(x + w * 0.94, y + h * 0.2);
            drawCtx.lineTo(x + w * 0.88, y + h * 0.88);
            drawCtx.quadraticCurveTo(x + w * 0.5, y + h * 1.02, x + w * 0.12, y + h * 0.88);
            drawCtx.lineTo(x + w * 0.06, y + h * 0.2);
            drawCtx.closePath();
            drawCtx.fill();

            const cockpitGradient = drawCtx.createLinearGradient(x, y + h * 0.2, x, y + h * 0.6);
            cockpitGradient.addColorStop(0, 'rgba(186, 245, 255, 0.95)');
            cockpitGradient.addColorStop(1, 'rgba(15, 32, 54, 0.88)');
            drawCtx.fillStyle = cockpitGradient;
            drawCtx.beginPath();
            drawCtx.moveTo(x + w * 0.3, y + h * 0.2);
            drawCtx.quadraticCurveTo(x + w * 0.5, y + h * 0.09, x + w * 0.7, y + h * 0.2);
            drawCtx.lineTo(x + w * 0.78, y + h * 0.48);
            drawCtx.lineTo(x + w * 0.22, y + h * 0.48);
            drawCtx.closePath();
            drawCtx.fill();

            drawCtx.strokeStyle = isPlayer ? 'rgba(255, 249, 220, 0.8)' : 'rgba(255,255,255,0.26)';
            drawCtx.lineWidth = Math.max(1.5, w * 0.05);
            drawCtx.beginPath();
            drawCtx.moveTo(x + w * 0.5, y + h * 0.08);
            drawCtx.lineTo(x + w * 0.5, y + h * 0.86);
            drawCtx.stroke();

            const wheelColor = '#09111c';
            drawCtx.fillStyle = wheelColor;
            drawCtx.fillRect(x - 2, y + h * 0.2, 5, h * 0.18);
            drawCtx.fillRect(x + w - 3, y + h * 0.2, 5, h * 0.18);
            drawCtx.fillRect(x - 2, y + h * 0.62, 5, h * 0.18);
            drawCtx.fillRect(x + w - 3, y + h * 0.62, 5, h * 0.18);

            if (isPlayer) {
                drawCtx.fillStyle = '#fff6ce';
                drawCtx.fillRect(x + w * 0.15, y + 2, w * 0.18, 5);
                drawCtx.fillRect(x + w * 0.67, y + 2, w * 0.18, 5);

                drawCtx.shadowBlur = 14;
                drawCtx.shadowColor = 'rgba(255, 217, 94, 0.55)';
                drawCtx.fillStyle = 'rgba(255, 217, 94, 0.48)';
                drawCtx.fillRect(x + w * 0.1, y - 1, w * 0.24, 8);
                drawCtx.fillRect(x + w * 0.66, y - 1, w * 0.24, 8);
                drawCtx.shadowBlur = 0;

                drawCtx.fillStyle = '#f59e0b';
                drawCtx.fillRect(x + w * 0.16, y + h * 0.88, w * 0.68, 6);

                drawCtx.fillStyle = 'rgba(255,255,255,0.26)';
                drawCtx.fillRect(x + w * 0.18, y + h * 0.62, w * 0.64, 3);
            } else {
                drawCtx.fillStyle = '#ff6b88';
                drawCtx.fillRect(x + w * 0.16, y + h - 6, w * 0.16, 4);
                drawCtx.fillRect(x + w * 0.68, y + h - 6, w * 0.16, 4);

                drawCtx.fillStyle = 'rgba(255,255,255,0.16)';
                drawCtx.fillRect(x + w * 0.45, y + h * 0.18, 3, h * 0.6);
            }

            drawCtx.restore();
        }

        function spawnTraffic() {
            const laneCount = 3;
            const laneWidth = roadWidth / laneCount;
            const lane = Math.floor(Math.random() * laneCount);
            const enemyW = player.width;
            const enemyH = player.height;
            const enemyX = roadX + (lane * laneWidth) + (laneWidth - enemyW) / 2;

            let safe = true;
            for (const t of traffic) {
                if (t.y < -enemyH * 2) safe = false;
            }

            if (safe) {
                const colors = ['#34d399', '#ff597f', '#38bdf8', '#a78bfa', '#fb7185'];
                traffic.push({
                    x: enemyX,
                    y: -150,
                    w: enemyW,
                    h: enemyH,
                    speed: gameSpeed * (0.5 + Math.random() * 0.3),
                    color: colors[Math.floor(Math.random() * colors.length)],
                    passed: false
                });
            }
        }

        function initGame() {
            score = 0;
            gameSpeed = 8;
            traffic = [];
            frameCount = 0;
            laneOffset = 0;
            roadGlowOffset = 0;
            player.x = width / 2 - player.width / 2;
            player.targetX = player.x;
            scoreValue.innerText = '0';
            speedValue.innerText = '120';
            feedbackCard.classList.remove('visible');
        }

        function gameLoop() {
            if (!gameActive) return;

            frameCount++;

            if (frameCount % 600 === 0) {
                gameSpeed += 1;
                speedValue.innerText = 120 + (gameSpeed - 8) * 10;
                audio.playSFX('warning', 500);
            }

            player.x += (player.targetX - player.x) * 0.2;

            if (frameCount % Math.max(30, 100 - Math.floor(gameSpeed * 2)) === 0) {
                spawnTraffic();
            }

            drawBackdrop();
            drawRoad();

            for (let i = traffic.length - 1; i >= 0; i--) {
                const t = traffic[i];
                t.y += gameSpeed - t.speed;

                drawCar(ctx, t.x, t.y, t.w, t.h, t.color, false);

                const buffer = 10;
                if (
                    player.x + buffer < t.x + t.w - buffer &&
                    player.x + player.width - buffer > t.x + buffer &&
                    player.y + buffer < t.y + t.h - buffer &&
                    player.y + player.height - buffer > t.y + buffer
                ) {
                    gameOver();
                    return;
                }

                if (!t.passed && t.y > player.y + player.height) {
                    score++;
                    t.passed = true;
                    scoreValue.innerText = score;

                    if (score % 5 === 0) {
                        audio.playSFX('score', 180);
                        showFeedback('streak', 'Clean Streak x' + score);
                    }
                }

                if (t.y > height) {
                    traffic.splice(i, 1);
                }
            }

            drawCar(ctx, player.x, player.y, player.width, player.height, player.color, true);

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0);
            showFeedback('crash', 'Road Contact');
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScore.innerText = score;
        }

        async function beginRun(mode) {
            await audio.unlock();
            if (mode === 'start') {
                audio.playSFX('start', 0);
                startScreen.classList.add('hidden');
            } else {
                audio.playSFX('start', 0);
                gameOverScreen.classList.add('hidden');
            }

            hud.classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            resize();
            initGame();
            gameLoop();
        }

        startBtn.addEventListener('click', () => beginRun('start'));
        restartBtn.addEventListener('click', () => beginRun('restart'));
    });
    </script>
</body>
