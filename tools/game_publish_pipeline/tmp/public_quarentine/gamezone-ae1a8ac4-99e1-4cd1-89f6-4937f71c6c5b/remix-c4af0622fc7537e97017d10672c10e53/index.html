<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Velocity: Night Shift Run</title>
    <!-- [agent-note][stage4] preserve: approved catalog-backed title/ui fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070814;
            --bg-deep: #04040b;
            --panel: rgba(10, 16, 34, 0.76);
            --panel-strong: rgba(17, 26, 49, 0.92);
            --panel-border: rgba(122, 234, 255, 0.3);
            --text-main: #f7fbff;
            --text-soft: #a8c5e6;
            --text-accent: #79f3ff;
            --glow-cyan: #2ff5ff;
            --glow-blue: #4e7cff;
            --glow-magenta: #ff4fd8;
            --danger: #ff5a6f;
            --warning: #ffb347;
            --road-dark: #12182d;
            --road-line: rgba(255, 255, 255, 0.8);
            --hud-shadow: 0 0 18px rgba(47, 245, 255, 0.2);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(78, 124, 255, 0.16), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 79, 216, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            color: var(--text-main);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0 49.4%, rgba(255,255,255,0.035) 49.5%, transparent 49.6% 100%),
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 24%, transparent 76%, rgba(255,255,255,0.02));
            mix-blend-mode: screen;
            opacity: 0.45;
        }

        body::after {
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.02) 0 2px,
                    transparent 2px 6px
                );
            opacity: 0.15;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
        }

        .hidden { display: none !important; }

        .panel {
            position: relative;
            width: min(92vw, 560px);
            padding: 1.5rem;
            border-radius: 28px;
            text-align: center;
            pointer-events: auto;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(22, 35, 68, 0.95), rgba(8, 12, 26, 0.92));
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255,255,255,0.05),
                0 0 30px rgba(47, 245, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .panel::before {
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(47, 245, 255, 0.2), transparent 34%),
                radial-gradient(circle at bottom right, rgba(255, 79, 216, 0.18), transparent 32%);
            opacity: 0.8;
        }

        .panel::after {
            inset: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
        }

        .panel-start { border-top: 4px solid var(--glow-cyan); }
        .panel-over { border-top: 4px solid var(--danger); }

        .panel-content {
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 0.8rem;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(121, 243, 255, 0.28);
            background: rgba(7, 14, 32, 0.58);
            color: var(--text-accent);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: inset 0 0 12px rgba(47, 245, 255, 0.08);
        }

        .hero-car {
            display: inline-block;
            transform: translateY(-1px);
            filter: drop-shadow(0 0 10px rgba(47, 245, 255, 0.7));
        }

        .title {
            margin: 0 0 0.5rem;
            font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            line-height: 0.96;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .subtitle {
            margin: 0 0 0.75rem;
            font-size: clamp(0.9rem, 3vw, 1.05rem);
            color: var(--text-accent);
            letter-spacing: 0.36em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .instructions {
            margin: 0 0 1.3rem;
            font-size: clamp(1rem, 3.6vw, 1.12rem);
            color: var(--text-soft);
            line-height: 1.45;
            font-weight: 400;
        }

        .flavor-row {
            display: flex;
            justify-content: center;
            gap: 0.65rem;
            flex-wrap: wrap;
            margin: 0 0 1.35rem;
        }

        .flavor-chip {
            min-width: 84px;
            padding: 0.45rem 0.75rem;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.035);
            color: #dff7ff;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .result-line {
            margin: 0 0 1.4rem;
            font-size: clamp(1.15rem, 4vw, 1.5rem);
            color: var(--text-soft);
        }

        .result-line strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .neon-text {
            text-shadow:
                0 0 12px rgba(47, 245, 255, 0.88),
                0 0 28px rgba(78, 124, 255, 0.45);
        }

        .neon-text-red {
            text-shadow:
                0 0 12px rgba(255, 90, 111, 0.8),
                0 0 24px rgba(255, 79, 216, 0.35);
        }

        .action-btn {
            position: relative;
            min-height: 52px;
            border: 0;
            border-radius: 999px;
            padding: 0.95rem 1.6rem;
            color: #fff;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            overflow: hidden;
        }

        .action-btn::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
            pointer-events: none;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn:hover {
            filter: brightness(1.06);
        }

        .action-btn-start {
            background: linear-gradient(90deg, var(--glow-blue), var(--glow-cyan));
            box-shadow: 0 10px 24px rgba(47, 245, 255, 0.28);
        }

        .action-btn-restart {
            background: linear-gradient(90deg, var(--danger), #ff9b55);
            box-shadow: 0 10px 24px rgba(255, 90, 111, 0.28);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: max(0.9rem, env(safe-area-inset-top, 0px));
            left: max(0.9rem, env(safe-area-inset-left, 0px));
            display: grid;
            gap: 0.35rem;
            padding: 0.8rem 0.95rem;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(9, 14, 28, 0.82), rgba(11, 18, 36, 0.56));
            border: 1px solid rgba(121, 243, 255, 0.22);
            box-shadow: var(--hud-shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-label {
            display: block;
            margin-bottom: 0.12rem;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-accent);
            opacity: 0.88;
        }

        .score-readout {
            font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.55rem, 6vw, 2.45rem);
            line-height: 1;
        }

        .speed-readout {
            font-size: clamp(0.88rem, 2.8vw, 1rem);
            color: #d4f6ff;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .speed-readout span,
        .score-readout span {
            color: #fff;
        }

        .road-sign {
            position: absolute;
            right: max(0.9rem, env(safe-area-inset-right, 0px));
            bottom: max(0.9rem, env(safe-area-inset-bottom, 0px));
            pointer-events: none;
            padding: 0.72rem 0.9rem;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(5, 10, 18, 0.46);
            color: rgba(239, 248, 255, 0.82);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            text-align: right;
            box-shadow: 0 0 18px rgba(0,0,0,0.18);
        }

        .feedback-gif {
            position: absolute;
            z-index: 4;
            width: min(28vw, 120px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.82) translateY(10px);
            transition: opacity 180ms ease, transform 180ms ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(3, 8, 18, 0.4);
        }

        .feedback-gif.active {
            opacity: 0.94;
            transform: scale(1) translateY(0);
        }

        .feedback-gif-win {
            top: max(0.9rem, env(safe-area-inset-top, 0px));
            right: max(0.9rem, env(safe-area-inset-right, 0px));
        }

        .feedback-gif-fail {
            left: max(0.9rem, env(safe-area-inset-left, 0px));
            bottom: calc(max(0.9rem, env(safe-area-inset-bottom, 0px)) + 3.8rem);
        }

        @media (max-width: 520px) {
            .panel {
                padding: 1.15rem;
                border-radius: 22px;
            }

            .title {
                font-size: clamp(2rem, 12vw, 2.8rem);
            }

            .subtitle {
                letter-spacing: 0.24em;
            }

            .action-btn {
                width: 100%;
            }

            .flavor-row {
                gap: 0.45rem;
            }

            .flavor-chip {
                min-width: 72px;
                font-size: 0.78rem;
            }

            .hud {
                padding: 0.7rem 0.8rem;
            }

            .road-sign {
                font-size: 0.7rem;
                padding: 0.62rem 0.72rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" style="position: relative; width: 100vw; height: 100vh; touch-action: none;">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer" class="screen">
            <!-- Start Screen -->
            <div id="start-screen" class="panel panel-start">
                <div class="panel-content">
                    <div class="hero-badge"><span class="hero-car">🚗</span> Night Courier Shift</div>
                    <h1 class="title neon-text">Neon Velocity</h1>
                    <p class="subtitle">Night Shift Run</p>
                    <p class="instructions">Drag to steer your courier car.<br>Avoid traffic and keep the delivery streak alive.</p>
                    <div class="flavor-row" aria-hidden="true">
                        <span class="flavor-chip">Turbo Glow</span>
                        <span class="flavor-chip">City Rush</span>
                        <span class="flavor-chip">Lane Lock</span>
                    </div>
                    <button id="start-btn" class="action-btn action-btn-start">Start Run</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden panel panel-over">
                <div class="panel-content">
                    <div class="hero-badge"><span class="hero-car">💥</span> Delivery Interrupted</div>
                    <h2 class="title neon-text-red" style="font-size: clamp(2.1rem, 7vw, 3.2rem);">Route Lost</h2>
                    <div class="result-line">Delivery distance: <strong><span id="finalScore">0</span>m</strong></div>
                    <button id="restart-btn" class="action-btn action-btn-restart">Run Again</button>
                </div>
            </div>

            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <div class="score-readout neon-text">
                    <span class="hud-label">Distance</span>
                    <span id="score">0</span>m
                </div>
                <div class="speed-readout"><span class="hud-label">Flow</span><span id="speed-display">100</span> km/h</div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: score-streak + crash-feedback -> catalogs/gifs.json -->
            <img id="win-gif" class="feedback-gif feedback-gif-win" alt="Courier streak reaction" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp" loading="lazy" decoding="async">
            <img id="fail-gif" class="feedback-gif feedback-gif-fail" alt="Crash reaction" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" loading="lazy" decoding="async">
            <div class="road-sign" aria-hidden="true">Neon District<br>Courier Route 03</div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "assets/audio/0000/6a85da48-ebe2-4973-b53a-e15cce5e2322.mp3",
            sfx: {
                start: "assets/audio/0000/69440feb-5dca-4b38-9704-155dcaee5d87.mp3",
                score: "assets/audio/0000/d70feecf-daf5-4f87-a7e1-a47cc63d25f9.mp3",
                bonus: "assets/audio/0000/69440feb-5dca-4b38-9704-155dcaee5d87.mp3",
                fail: "assets/audio/0000/d70feecf-daf5-4f87-a7e1-a47cc63d25f9.mp3"
            },
            gifs: {
                streak: "https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp",
                crash: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.cooldowns = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.preload = 'auto';
                this.bgm.volume = 0.2;
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sound = new Audio(v);
                    sound.preload = 'auto';
                    this.sfx[k] = sound;
                }
            }

            unlock() {
                this.unlocked = true;
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.55, cooldownMs = 0) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const lastPlayed = this.cooldowns.get(key) || 0;
                if (cooldownMs && now - lastPlayed < cooldownMs) return;
                this.cooldowns.set(key, now);

                try {
                    const clone = this.sfx[key].cloneNode();
                    clone.volume = volume;
                    clone.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const winGif = document.getElementById('win-gif');
        const failGif = document.getElementById('fail-gif');
        let gifTimers = {};

        function showGif(el, duration = 1200) {
            if (!el) return;
            clearTimeout(gifTimers[el.id]);
            el.classList.add('active');
            gifTimers[el.id] = setTimeout(() => {
                el.classList.remove('active');
            }, duration);
        }

        function hideGif(el) {
            if (!el) return;
            clearTimeout(gifTimers[el.id]);
            el.classList.remove('active');
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let gameSpeed = 5;
        let frameCount = 0;

        // Road dimensions
        let roadX, roadWidth;
        let laneWidth;

        // Player
        let player = { x: 0, y: 0, width: 0, height: 0, color: '#3ef8ff' };

        // Enemies
        let enemies = [];

        // Parallax / Environment
        let roadOffset = 0;
        let bgStars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            roadWidth = Math.min(width * 0.9, 500);
            roadX = (width - roadWidth) / 2;
            laneWidth = roadWidth / 3;

            player.width = roadWidth * 0.12;
            player.height = player.width * 1.8;
            player.y = height - player.height - 50;

            if (!gameActive) player.x = width / 2;

            if (bgStars.length === 0) initStars();
        }

        window.addEventListener('resize', resize);

        function handleInput(clientX) {
            if (!gameActive) return;

            const halfPlayer = player.width / 2;
            const minX = roadX + halfPlayer + 5;
            const maxX = roadX + roadWidth - halfPlayer - 5;

            player.x = Math.max(minX, Math.min(maxX, clientX));
        }

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 4. GAME LOGIC */
        function initStars() {
            bgStars = [];
            for (let i = 0; i < 50; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.7 + 0.2
                });
            }
        }

        function initGame() {
            score = 0;
            gameSpeed = 6;
            enemies = [];
            frameCount = 0;
            player.x = width / 2;
            hideGif(winGif);
            hideGif(failGif);
            document.getElementById('score').innerText = '0';
            document.getElementById('speed-display').innerText = '100';
            resize();
        }

        function spawnEnemy() {
            const lane = Math.floor(Math.random() * 3);
            const laneCenter = roadX + (lane * laneWidth) + (laneWidth / 2);

            const enemyW = player.width;
            const enemyH = player.height;

            const colors = ['#ff5b87', '#ff9e43', '#b56bff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            enemies.push({
                x: laneCenter,
                y: -enemyH - 50,
                width: enemyW,
                height: enemyH,
                color: color,
                speedOffset: (Math.random() * 2) - 1
            });
        }

        function drawRoadGlow() {
            const sideGlow = ctx.createLinearGradient(0, 0, width, 0);
            sideGlow.addColorStop(0, 'rgba(0,0,0,0)');
            sideGlow.addColorStop(Math.max(0, roadX / width), 'rgba(47, 245, 255, 0.05)');
            sideGlow.addColorStop(Math.min(1, (roadX + roadWidth) / width), 'rgba(255, 79, 216, 0.05)');
            sideGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = sideGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(121, 243, 255, 0.16)';
            ctx.lineWidth = 10;
            ctx.strokeRect(roadX, 0, roadWidth, height);
        }

        function drawCar(ctx, x, y, w, h, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = 'rgba(0,0,0,0.42)';
            ctx.beginPath();
            ctx.roundRect(-w / 2 + 4, 6, w, h, 12);
            ctx.fill();

            const bodyGradient = ctx.createLinearGradient(0, 0, 0, h);
            if (isPlayer) {
                bodyGradient.addColorStop(0, '#a9ffff');
                bodyGradient.addColorStop(0.28, color);
                bodyGradient.addColorStop(1, '#0ea5c8');
            } else {
                bodyGradient.addColorStop(0, '#ffd6f3');
                bodyGradient.addColorStop(0.28, color);
                bodyGradient.addColorStop(1, 'rgba(26, 13, 47, 0.95)');
            }

            ctx.shadowBlur = isPlayer ? 18 : 10;
            ctx.shadowColor = isPlayer ? 'rgba(47, 245, 255, 0.65)' : 'rgba(255, 79, 216, 0.35)';
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.roundRect(-w / 2, 0, w, h, 12);
            ctx.fill();

            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(7, 15, 28, 0.92)';
            ctx.beginPath();
            ctx.roundRect(-w / 2 + 5, h * 0.15, w - 10, h * 0.24, 7);
            ctx.fill();

            ctx.fillStyle = 'rgba(20, 32, 56, 0.95)';
            ctx.beginPath();
            ctx.roundRect(-w / 2 + 7, h * 0.46, w - 14, h * 0.2, 6);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.82)';
            ctx.fillRect(-w / 2 + 9, h * 0.08, w - 18, 3);

            ctx.fillStyle = 'rgba(10,10,14,0.95)';
            ctx.beginPath();
            ctx.roundRect(-w / 2 - 2, h * 0.2, 5, h * 0.22, 2);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(w / 2 - 3, h * 0.2, 5, h * 0.22, 2);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(-w / 2 - 2, h * 0.62, 5, h * 0.2, 2);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(w / 2 - 3, h * 0.62, 5, h * 0.2, 2);
            ctx.fill();

            if (isPlayer) {
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#f6fdff';
                ctx.fillStyle = '#f6fdff';
                ctx.fillRect(-w / 2 + 4, 4, 8, 5);
                ctx.fillRect(w / 2 - 12, 4, 8, 5);

                ctx.shadowColor = '#2ff5ff';
                ctx.fillStyle = '#2ff5ff';
                ctx.fillRect(-w / 2 + 2, h - 6, 10, 4);
                ctx.fillRect(w / 2 - 12, h - 6, 10, 4);

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.moveTo(-w * 0.18, h * 0.18);
                ctx.lineTo(0, h * 0.08);
                ctx.lineTo(w * 0.2, h * 0.18);
                ctx.lineTo(0, h * 0.3);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff5a6f';
                ctx.fillStyle = '#ff5a6f';
                ctx.fillRect(-w / 2 + 4, h - 6, 8, 4);
                ctx.fillRect(w / 2 - 12, h - 6, 8, 4);
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#060811');
            sky.addColorStop(0.6, '#090d1e');
            sky.addColorStop(1, '#020307');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            bgStars.forEach((star, index) => {
                star.y += star.speed + (gameSpeed * 0.1);
                if (star.y > height) {
                    star.y = -5;
                    star.x = Math.random() * width;
                }
                ctx.beginPath();
                ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                if (index % 10 === 0) {
                    ctx.fillStyle = 'rgba(47, 245, 255, 0.15)';
                    ctx.fillRect(star.x - 0.5, star.y - 8, 1, 12);
                }
            });

            const roadGradient = ctx.createLinearGradient(0, 0, 0, height);
            roadGradient.addColorStop(0, '#17203d');
            roadGradient.addColorStop(1, varRoadDark());
            ctx.fillStyle = roadGradient;
            ctx.fillRect(roadX, 0, roadWidth, height);

            drawRoadGlow();

            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.fillRect(roadX - 4, 0, 4, height);
            ctx.fillRect(roadX + roadWidth, 0, 4, height);

            ctx.fillStyle = 'rgba(255, 79, 216, 0.12)';
            ctx.fillRect(roadX + 8, 0, 8, height);
            ctx.fillStyle = 'rgba(47, 245, 255, 0.12)';
            ctx.fillRect(roadX + roadWidth - 16, 0, 8, height);

            roadOffset += gameSpeed;
            if (roadOffset > 100) roadOffset = 0;

            for (let i = -100; i < height; i += 100) {
                const y = i + roadOffset;

                ctx.fillStyle = 'rgba(255,255,255,0.72)';
                ctx.fillRect(roadX + laneWidth - 2, y, 4, 40);
                ctx.fillRect(roadX + (laneWidth * 2) - 2, y, 4, 40);

                ctx.fillStyle = 'rgba(47, 245, 255, 0.16)';
                ctx.fillRect(roadX + laneWidth - 5, y, 10, 40);
                ctx.fillRect(roadX + (laneWidth * 2) - 5, y, 10, 40);
            }

            ctx.fillStyle = 'rgba(255, 179, 71, 0.16)';
            for (let i = 0; i < height; i += 80) {
                ctx.fillRect(roadX + 6, (i + roadOffset * 0.6) % (height + 80) - 20, 3, 18);
                ctx.fillRect(roadX + roadWidth - 9, (i + roadOffset * 0.6 + 30) % (height + 80) - 20, 3, 18);
            }

            drawCar(ctx, player.x, player.y, player.width, player.height, player.color, true);

            if (frameCount % Math.max(30, 100 - Math.floor(score / 50)) === 0) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += gameSpeed + e.speedOffset;

                drawCar(ctx, e.x, e.y, e.width, e.height, e.color, false);

                const px = player.x - player.width / 2;
                const py = player.y;
                const ex = e.x - e.width / 2;
                const ey = e.y;

                if (px < ex + e.width &&
                    px + player.width > ex &&
                    py < ey + e.height &&
                    py + player.height > ey) {
                    gameOver();
                    return;
                }

                if (e.y > height) {
                    enemies.splice(i, 1);
                    score += 10;
                    audio.playSFX('score', 0.44, 120);

                    if (score % 100 === 0) {
                        gameSpeed += 1;
                        audio.playSFX('bonus', 0.6, 250);
                        showGif(winGif, 1300);
                    }

                    document.getElementById('score').innerText = score;
                    document.getElementById('speed-display').innerText = 100 + Math.floor(gameSpeed * 10);
                }
            }

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function varRoadDark() {
            return '#11172b';
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0.66, 300);
            showGif(failGif, 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 5. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.56, 150);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            resize();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.52, 150);
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        resize();
        initStars();
    });
    </script>
</body>
</html>
