<script>
// §3.2 Config System
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);
window.updateGameConfig = (k, v) => {
    if(window.gameConfig.hasOwnProperty(k)) window.gameConfig[k] = v;
};

// §A.2 Audio Manager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.soundDefs = {
            sfx_like: { fallback: 'pickup', volume: 0.35, debounce: 90 },
            sfx_fail: { fallback: 'fail', volume: 0.42, debounce: 140 },
            sfx_start: { fallback: 'ui', volume: 0.32, debounce: 160 },
            sfx_warning: { fallback: 'warning', volume: 0.28, debounce: 800 }
        };
        this.htmlPlayers = {};
    }
    
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            Object.keys(this.soundDefs).forEach((id) => {
                const el = document.getElementById(id);
                if (el) this.loadSound(id, el.src, this.soundDefs[id].fallback);
            });
            const bgm = document.getElementById('bgm_main');
            if (bgm) {
                bgm.volume = 0.2;
                bgm.preload = 'auto';
            }
        }
    }

    unlock() {
        if (!this.ctx) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    loadSound(id, src, fallback) {
        const el = document.getElementById(id);
        if (el) {
            this.htmlPlayers[id] = el;
        }

        const sourceUrl = new URL(src, window.location.href);
        if (sourceUrl.origin !== window.location.origin) {
            this.buffers[id] = { type: 'element', elementId: id, mode: fallback };
            return;
        }

        fetch(src)
            .then(r => r.arrayBuffer())
            .then(b => this.ctx.decodeAudioData(b))
            .then(data => this.buffers[id] = { buffer: data, type: 'buffer' })
            .catch(() => this.buffers[id] = { type: 'fallback', mode: fallback });
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        try {
            el.currentTime = 0;
        } catch (_) {}
    }

    playSfx(id) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        const now = performance.now();
        const config = this.soundDefs[id] || { volume: 0.35, debounce: 120 };
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < config.debounce) return;
        this.lastPlayedAt[id] = now;

        const sound = this.buffers[id];
        if (sound && sound.type === 'buffer') {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = sound.buffer;
            gain.gain.value = config.volume;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else if (sound && sound.type === 'element') {
            const el = this.htmlPlayers[id] || document.getElementById(sound.elementId);
            if (el) {
                try {
                    const clone = el.cloneNode();
                    clone.volume = Math.min(config.volume, 1);
                    clone.play().catch(() => this.synthesize(sound.mode, config.volume));
                } catch (_) {
                    this.synthesize(sound.mode, config.volume);
                }
            } else {
                this.synthesize(sound.mode, config.volume);
            }
        } else if (sound && sound.type === 'fallback') {
            this.synthesize(sound.mode, config.volume);
        }
    }

    synthesize(type, volume = 0.35) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'pickup') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(640, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1180, this.ctx.currentTime + 0.14);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.14);
        } else if (type === 'warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(620, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(420, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(volume * 0.7, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.18);
        } else if (type === 'ui') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(760, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(volume * 0.9, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(72, this.ctx.currentTime + 0.24);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.24);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.24);
        }
    }
}

const audio = new AudioManager();

// Game Logic
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let animationId;
let lastTime = 0;

// State
let gameState = 'START';
let score = 0;
let vibe = 100;
let posts = [];
let particles = [];
let spawnTimer = 0;
let gameSpeed = 1;
let shakeIntensity = 0;
let lowVibeWarningArmed = true;

// Assets
const bgImg = document.getElementById('asset_bg');
const feedbackGif = document.getElementById('feedback-gif');
const feedbackCaption = document.getElementById('feedback-caption');
const feedbackStates = {
    celebrate: {
        src: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',
        label: 'clean post adored'
    },
    fail: {
        src: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',
        label: 'trash post tapped'
    }
};
let feedbackTimer = 0;

// Constants
const POST_WIDTH_PCT = 0.85;
const POST_HEIGHT_RATIO = 0.6;
const EMOJIS_GOOD = ['💖', '🐱', '🌸', '✨', '🍰', '🦦', '🌱', '🎨'];
const EMOJIS_BAD = ['🤬', '💩', '💀', '👎', '🧟', '🦠', '🥀', '🕷️'];
const NAMES = ['CozyCat', 'SoftBot', 'PinkSky', 'TeaTime', 'FeltFan', 'PixelPals'];
const TEXTS_GOOD = ['Just made this!', 'Feeling cute.', 'Look at this!', 'Morning vibes.', 'So soft.', 'Happy day!'];
const TEXTS_BAD = ['I hate this.', 'Unfollow me.', 'This sucks.', 'Why bother?', 'Ugly.', 'Delete this.'];

function roundRect(ctx2d, x, y, width, height, radius) {
    ctx2d.beginPath();
    ctx2d.moveTo(x + radius, y);
    ctx2d.lineTo(x + width - radius, y);
    ctx2d.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx2d.lineTo(x + width, y + height - radius);
    ctx2d.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx2d.lineTo(x + radius, y + height);
    ctx2d.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx2d.lineTo(x, y + radius);
    ctx2d.quadraticCurveTo(x, y, x + radius, y);
    ctx2d.closePath();
}

function drawSparkle(ctx2d, x, y, size, color) {
    ctx2d.save();
    ctx2d.translate(x, y);
    ctx2d.strokeStyle = color;
    ctx2d.lineWidth = Math.max(1.4, size * 0.12);
    ctx2d.lineCap = 'round';
    ctx2d.beginPath();
    ctx2d.moveTo(0, -size);
    ctx2d.lineTo(0, size);
    ctx2d.moveTo(-size, 0);
    ctx2d.lineTo(size, 0);
    ctx2d.stroke();
    ctx2d.restore();
}

class Post {
    constructor(w, h, yStart) {
        this.width = w * POST_WIDTH_PCT;
        this.height = this.width * 0.45;
        this.x = (w - this.width) / 2;
        this.y = yStart;
        this.type = Math.random() > 0.3 ? 'GOOD' : 'BAD';
        
        this.emoji = this.type === 'GOOD' 
            ? EMOJIS_GOOD[Math.floor(Math.random() * EMOJIS_GOOD.length)]
            : EMOJIS_BAD[Math.floor(Math.random() * EMOJIS_BAD.length)];
        this.name = NAMES[Math.floor(Math.random() * NAMES.length)];
        this.text = this.type === 'GOOD' 
            ? TEXTS_GOOD[Math.floor(Math.random() * TEXTS_GOOD.length)]
            : TEXTS_BAD[Math.floor(Math.random() * TEXTS_BAD.length)];
        
        this.color = '#ffffff';
        this.liked = false;
        this.ignored = false;
        this.scale = 1;
        this.alpha = 1;
    }

    update(dt, speed) {
        this.y -= speed * dt;
        if (this.liked) {
            this.scale += (1.1 - this.scale) * 10 * dt;
            this.alpha -= 2 * dt;
        }
    }

    draw(ctx2d) {
        ctx2d.save();
        ctx2d.translate(this.x + this.width/2, this.y + this.height/2);
        ctx2d.scale(this.scale, this.scale);
        ctx2d.globalAlpha = Math.max(0, this.alpha);
        
        const w = this.width;
        const h = this.height;
        const x = -w / 2;
        const y = -h / 2;
        const r = 16;
        const accent = this.type === 'GOOD' ? '#79f7c1' : '#ff7c94';
        const accentSoft = this.type === 'GOOD' ? 'rgba(121, 247, 193, 0.16)' : 'rgba(255, 124, 148, 0.18)';
        const avatarFill = this.type === 'GOOD' ? '#183e42' : '#432135';
        const cardTop = this.type === 'GOOD' ? '#1a1f39' : '#29192f';
        const cardBottom = this.type === 'GOOD' ? '#100f1f' : '#160d19';

        ctx2d.shadowColor = "rgba(0,0,0,0.24)";
        ctx2d.shadowBlur = 22;
        ctx2d.shadowOffsetY = 8;

        roundRect(ctx2d, x, y, w, h, r);
        const bodyGrad = ctx2d.createLinearGradient(0, y, 0, y + h);
        bodyGrad.addColorStop(0, cardTop);
        bodyGrad.addColorStop(1, cardBottom);
        ctx2d.fillStyle = bodyGrad;
        ctx2d.fill();

        ctx2d.shadowColor = "transparent";
        ctx2d.lineWidth = 2;
        ctx2d.strokeStyle = accent;
        ctx2d.stroke();

        const shine = ctx2d.createLinearGradient(x, y, x + w, y + h);
        shine.addColorStop(0, 'rgba(255,255,255,0.16)');
        shine.addColorStop(0.45, 'rgba(255,255,255,0.02)');
        shine.addColorStop(1, accentSoft);
        roundRect(ctx2d, x + 2, y + 2, w - 4, h - 4, r - 2);
        ctx2d.fillStyle = shine;
        ctx2d.fill();

        ctx2d.fillStyle = accentSoft;
        roundRect(ctx2d, x + 12, y + 12, w - 24, 28, 12);
        ctx2d.fill();

        ctx2d.fillStyle = avatarFill;
        ctx2d.beginPath();
        ctx2d.arc(x + 30, y + 30, 18, 0, Math.PI * 2);
        ctx2d.fill();
        ctx2d.strokeStyle = accent;
        ctx2d.lineWidth = 2;
        ctx2d.stroke();

        ctx2d.font = '18px "Audiowide", sans-serif';
        ctx2d.textAlign = 'center';
        ctx2d.textBaseline = 'middle';
        ctx2d.fillText(this.type === 'GOOD' ? '✦' : '⚠', x + 30, y + 31);

        ctx2d.fillStyle = '#f6f1ff';
        ctx2d.font = '600 14px "Rajdhani", sans-serif';
        ctx2d.textAlign = 'left';
        ctx2d.fillText(this.name, x + 60, y + 26);

        ctx2d.fillStyle = '#bcaed8';
        ctx2d.font = '12px "Rajdhani", sans-serif';
        ctx2d.fillText(this.type === 'GOOD' ? 'soft post • 2m ago' : 'trash alert • 2m ago', x + 60, y + 40);

        ctx2d.shadowColor = 'rgba(0,0,0,0.22)';
        ctx2d.shadowBlur = 12;
        ctx2d.fillStyle = '#ffffff';
        ctx2d.font = '40px serif';
        ctx2d.textAlign = 'center';
        ctx2d.textBaseline = 'middle';
        ctx2d.fillText(this.emoji, 0, 8);

        ctx2d.shadowColor = 'transparent';
        if (this.type === 'GOOD') drawSparkle(ctx2d, x + w - 28, y + 22, 5, '#7bf3ff');
        else drawSparkle(ctx2d, x + w - 28, y + 22, 5, '#ff8fa7');

        ctx2d.fillStyle = '#efe7ff';
        ctx2d.font = '600 14px "Rajdhani", sans-serif';
        ctx2d.textAlign = 'center';
        ctx2d.fillText(this.text, 0, y + h - 20);

        ctx2d.restore();
    }

    contains(tx, ty) {
        return tx >= this.x && tx <= this.x + this.width &&
               ty >= this.y && ty <= this.y + this.height;
    }
}

class Particle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.vx = (Math.random() - 0.5) * 200;
        this.vy = -Math.random() * 300 - 100;
        this.life = 1.0;
        this.txt = type === 'HEART' ? '❤️' : '💔';
        this.size = 20 + Math.random() * 20;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 500 * dt;
        this.life -= dt * 1.5;
    }
    draw(ctx2d) {
        ctx2d.save();
        ctx2d.globalAlpha = Math.max(0, this.life);
        ctx2d.translate(this.x, this.y);
        ctx2d.font = `${this.size}px serif`;
        ctx2d.textAlign = 'center';
        ctx2d.fillText(this.txt, 0, 0);
        ctx2d.restore();
    }
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function showFeedback(type) {
    const state = feedbackStates[type];
    if (!state || !feedbackGif || !feedbackCaption) return;
    feedbackGif.src = state.src;
    feedbackGif.alt = state.label;
    feedbackCaption.textContent = state.label;
    feedbackGif.classList.add('show');
    feedbackCaption.classList.add('show');
    feedbackTimer = 1.15;
}

function initGame() {
    score = 0;
    vibe = 100;
    posts = [];
    particles = [];
    gameSpeed = 1;
    shakeIntensity = 0;
    spawnTimer = 0;
    feedbackTimer = 0;
    lowVibeWarningArmed = true;
    if (feedbackGif) feedbackGif.classList.remove('show');
    if (feedbackCaption) feedbackCaption.classList.remove('show');
    posts.push(new Post(window.innerWidth, window.innerHeight, window.innerHeight + 100));
}

function spawnParticles(x, y, type) {
    for(let i=0; i<5; i++) {
        particles.push(new Particle(x, y, type));
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('finalScore').innerText = score;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    audio.playSfx('sfx_fail');
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        const dpr = window.devicePixelRatio || 1;
        const viewW = canvas.width / dpr;
        const viewH = canvas.height / dpr;

        const bgGrad = ctx.createLinearGradient(0, 0, 0, viewH);
        bgGrad.addColorStop(0, '#1b1230');
        bgGrad.addColorStop(1, '#090611');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, viewW, viewH);

        const glowA = ctx.createRadialGradient(viewW * 0.2, viewH * 0.12, 0, viewW * 0.2, viewH * 0.12, viewW * 0.45);
        glowA.addColorStop(0, 'rgba(123,243,255,0.18)');
        glowA.addColorStop(1, 'rgba(123,243,255,0)');
        ctx.fillStyle = glowA;
        ctx.fillRect(0, 0, viewW, viewH);

        const glowB = ctx.createRadialGradient(viewW * 0.78, viewH * 0.2, 0, viewW * 0.78, viewH * 0.2, viewW * 0.38);
        glowB.addColorStop(0, 'rgba(255,155,213,0.16)');
        glowB.addColorStop(1, 'rgba(255,155,213,0)');
        ctx.fillStyle = glowB;
        ctx.fillRect(0, 0, viewW, viewH);

        if (bgImg.complete && bgImg.naturalWidth > 0) {
            ctx.save();
            const imgRatio = bgImg.naturalWidth / bgImg.naturalHeight;
            const canvasRatio = viewW / viewH;
            let dw, dh, dx, dy;
            
            if (canvasRatio > imgRatio) {
                dw = viewW;
                dh = viewW / imgRatio;
                dx = 0;
                dy = (viewH - dh) / 2;
            } else {
                dh = viewH;
                dw = viewH * imgRatio;
                dy = 0;
                dx = (viewW - dw) / 2;
            }
            
            ctx.globalAlpha = 0.16;
            ctx.drawImage(bgImg, dx, dy, dw, dh);
            ctx.restore();
        }

        if (shakeIntensity > 0) {
            const dx = (Math.random() - 0.5) * shakeIntensity;
            const dy = (Math.random() - 0.5) * shakeIntensity;
            ctx.translate(dx, dy);
            shakeIntensity = Math.max(0, shakeIntensity - 300 * dt);
        }

        if (gameState === 'PLAYING') {
            spawnTimer -= dt * 1000;
            if (spawnTimer <= 0) {
                posts.push(new Post(window.innerWidth, window.innerHeight, window.innerHeight + 50));
                const rate = Math.max(window.gameConfig.spawnRate - score * 5, 600);
                spawnTimer = rate;
            }

            const scrollSpeed = window.gameConfig.scrollSpeed + (score * 5);
            
            for (let i = posts.length - 1; i >= 0; i--) {
                let p = posts[i];
                p.update(dt, scrollSpeed);

                if (p.y + p.height < 0) {
                    if (p.type === 'GOOD' && !p.liked) {
                        vibe -= 15;
                        shakeIntensity = 5;
                    }
                    posts.splice(i, 1);
                } else if (p.alpha <= 0) {
                    posts.splice(i, 1);
                }
            }

            vibe = Math.max(0, Math.min(100, vibe));
            if (vibe < 32 && lowVibeWarningArmed) {
                audio.playSfx('sfx_warning');
                lowVibeWarningArmed = false;
            } else if (vibe > 45) {
                lowVibeWarningArmed = true;
            }

            if (vibe <= 0) gameOver();

            document.getElementById('score').innerText = score;
            document.getElementById('vibe-bar').style.width = vibe + '%';
            if(vibe < 30) document.getElementById('vibe-bar').classList.replace('bg-pink-400', 'bg-red-500');
            else document.getElementById('vibe-bar').classList.replace('bg-red-500', 'bg-pink-400');
        }

        if (feedbackTimer > 0) {
            feedbackTimer -= dt;
            if (feedbackTimer <= 0) {
                if (feedbackGif) feedbackGif.classList.remove('show');
                if (feedbackCaption) feedbackCaption.classList.remove('show');
            }
        }

        posts.forEach(p => p.draw(ctx));

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            particles[i].draw(ctx);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    } catch (e) {
        console.error(e);
    }

    animationId = requestAnimationFrame(gameLoop);
}

// Input Handling
function handleInput(e) {
    if (gameState !== 'PLAYING') return;
    
    audio.unlock();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    let hit = false;
    for (let i = 0; i < posts.length; i++) {
        let p = posts[i];
        if (!p.liked && p.contains(x, y)) {
            hit = true;
            if (p.type === 'GOOD') {
                p.liked = true;
                score++;
                vibe = Math.min(100, vibe + 5);
                spawnParticles(x, y, 'HEART');
                showFeedback('celebrate');
                audio.playSfx('sfx_like');
            } else {
                p.color = '#ffdddd';
                vibe -= 25;
                shakeIntensity = 20;
                spawnParticles(x, y, 'BROKEN');
                showFeedback('fail');
                audio.playSfx('sfx_fail');
            }
            break;
        }
    }
}

// Event Listeners
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();
    
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.init();
        audio.unlock();
        audio.playSfx('sfx_start');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        initGame();
        gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.init();
        audio.unlock();
        audio.playSfx('sfx_start');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        initGame();
        gameState = 'PLAYING';
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) audio.stopBgm();
        else if (gameState === 'PLAYING') audio.playBgm();
    });

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    requestAnimationFrame(gameLoop);
});

</script>
