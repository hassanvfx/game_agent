<style>
    :root {
        --bg-night: #08111f;
        --bg-dusk: #132743;
        --sky-glow: #ff9966;
        --panel: rgba(11, 23, 43, 0.86);
        --panel-border: rgba(121, 228, 255, 0.72);
        --panel-shadow: rgba(0, 0, 0, 0.38);
        --accent: #7df7ff;
        --accent-strong: #3dd8ff;
        --coin: #ffe36d;
        --fare: #86f892;
        --danger: #ff7c9c;
        --road: #1b2436;
        --road-edge: #ffb14f;
        --lane: rgba(255, 244, 209, 0.88);
        --text-main: #f4fbff;
        --text-soft: #a9c3dc;
        --glass-top: rgba(255, 255, 255, 0.14);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 171, 92, 0.28), transparent 32%),
            linear-gradient(180deg, var(--bg-dusk), var(--bg-night));
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    body { color: var(--text-main); }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .glass {
        background:
            linear-gradient(180deg, var(--glass-top), rgba(255, 255, 255, 0.04)),
            var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        box-shadow:
            0 12px 32px var(--panel-shadow),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
        border-radius: 16px;
    }
    .btn-retro {
        background: linear-gradient(180deg, #ffe978, #ffb84c);
        border: 1px solid rgba(255, 247, 201, 0.75);
        box-shadow:
            0 10px 22px rgba(13, 18, 32, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.5);
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        color: #172131;
        font-weight: 700;
        text-transform: uppercase;
        font-family: 'Russo One', system-ui, sans-serif;
        letter-spacing: 0.08em;
        cursor: pointer;
        border-radius: 14px;
    }
    .btn-retro:active { transform: translateY(2px) scale(0.98); box-shadow: 0 5px 12px rgba(13, 18, 32, 0.35); }
    .btn-disabled { filter: grayscale(100%); opacity: 0.55; pointer-events: none; }
    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    .float-up { animation: floatUp 1s ease-out forwards; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
    .game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; }
    .game-container::before,
    .game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    .game-container::before {
        background:
            radial-gradient(circle at 16% 18%, rgba(255, 224, 123, 0.32), transparent 0 8px, transparent 9px),
            radial-gradient(circle at 34% 10%, rgba(125, 247, 255, 0.24), transparent 0 6px, transparent 7px),
            radial-gradient(circle at 61% 20%, rgba(255, 255, 255, 0.24), transparent 0 5px, transparent 6px),
            radial-gradient(circle at 84% 13%, rgba(125, 247, 255, 0.28), transparent 0 7px, transparent 8px);
        opacity: 0.95;
    }
    .game-container::after {
        background:
            linear-gradient(180deg, transparent 0%, rgba(8, 17, 31, 0.08) 55%, rgba(8, 17, 31, 0.18) 100%);
        mix-blend-mode: screen;
    }
    .ui-layer { position: absolute; inset: 0; z-index: 50; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 1rem; box-sizing: border-box; }
    .hud-row { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; gap: 1rem; }
    .hud-card { padding: 0.7rem 0.95rem; display: flex; flex-direction: column; min-width: 0; }
    .hud-label { font-size: 0.68rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.2em; }
    .hud-value {
        font-size: 1.9rem;
        line-height: 1;
        font-weight: 700;
        color: var(--coin);
        text-shadow: 0 0 14px rgba(255, 227, 109, 0.24);
        font-family: 'Russo One', system-ui, sans-serif;
    }
    .fleet-card {
        padding: 0.5rem 0.8rem;
        font-size: 0.98rem;
        font-weight: 600;
        color: var(--text-main);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24);
    }
    .upgrade-panel { pointer-events: auto; display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; width: 100%; max-width: 32rem; margin: 0 auto; }
    .upgrade-panel::-webkit-scrollbar { display: none; }
    .upgrade-btn {
        flex: 1;
        min-width: 86px;
        padding: 0.75rem 0.55rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 0.73rem;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    .upgrade-btn::after {
        content: "";
        position: absolute;
        inset: auto -20% 0;
        height: 45%;

        pointer-events: none;

    .upgrade-cost {
        font-size: 0.66rem;

        font-family: 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 0.02em;
    }
    .overlay {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at top, rgba(255, 183, 95, 0.26), transparent 28%),

        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        z-index: 50;
    }
    .start-card {
        padding: 1.8rem;
        text-align: center;
        max-width: 22rem;
        margin: 0 1rem;
        border-radius: 24px;
        position: relative;
        overflow: hidden;
    }
    .start-card::before {
        content: "🚕";
        position: absolute;
        right: 1rem;
        top: 0.8rem;
        font-size: 2rem;

    .game-title {
        margin: 0 0 0.6rem;
        font: 400 2.6rem/0.98 'Russo One', system-ui, sans-serif;
        color: var(--coin);
        letter-spacing: 0.04em;
        text-shadow: 0 0 20px rgba(255, 205, 98, 0.3);
    }
    .subtitle {
        margin: 0 0 1.25rem;
        color: var(--text-soft);
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.4;
    }
    .start-btn { width: 100%; padding: 0.9rem 1.2rem; font-size: 1.05rem; animation: pulseGlow 1.4s ease-in-out infinite; }
    @keyframes pulseGlow {
        0%, 100% { filter: brightness(1); box-shadow: 0 10px 22px rgba(13, 18, 32, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
        50% { filter: brightness(1.06); box-shadow: 0 12px 28px rgba(13, 18, 32, 0.42), 0 0 0 4px rgba(255, 233, 120, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.55); }
    }
    @media (max-width: 640px) {
        .game-title { font-size: 2.15rem; }
        .subtitle { font-size: 0.95rem; }
        .hud-value { font-size: 1.45rem; }
        .ui-layer { padding: 0.75rem; }
        .hud-row { gap: 0.65rem; }
        .hud-card { padding: 0.65rem 0.8rem; }
        .fleet-card { font-size: 0.9rem; }
        .upgrade-btn { min-width: 82px; padding: 0.72rem 0.45rem; }
        .start-card { padding: 1.45rem; }
    }
    .feedback-stack {
        position: absolute;
        right: 1rem;
        bottom: 6.2rem;
        z-index: 45;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.55rem;
        pointer-events: none;
    }
    .feedback-badge {
        padding: 0.55rem 0.8rem;
        max-width: min(44vw, 13rem);
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-main);
        opacity: 0;
        transform: translateY(8px) scale(0.96);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .feedback-badge.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    .feedback-badge strong {
        display: block;
        font-family: 'Russo One', system-ui, sans-serif;
        font-size: 0.92rem;
        letter-spacing: 0.04em;
        color: var(--coin);
    }
    .feedback-gif {
        position: absolute;
        left: 50%;
        bottom: 7.2rem;
        width: min(34vw, 150px);
        aspect-ratio: 1;
        transform: translateX(-50%) scale(0.9);
        border-radius: 18px;
        border: 1px solid rgba(125, 247, 255, 0.55);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
        object-fit: cover;
        opacity: 0;
        pointer-events: none;
        z-index: 42;
        transition: opacity 0.22s ease, transform 0.22s ease;
        background: rgba(7, 13, 24, 0.65);
    }
    .feedback-gif.is-visible {
        opacity: 0.94;
        transform: translateX(-50%) scale(1);
    }
    @media (max-width: 640px) {
        .feedback-stack {
            right: 0.75rem;
            bottom: 7rem;
            gap: 0.45rem;
        }
        .feedback-badge {
            max-width: 48vw;
            font-size: 0.75rem;
            padding: 0.48rem 0.7rem;
        }
        .feedback-gif {
            width: min(40vw, 124px);
            bottom: 8.35rem;
        }
    }

<script>
/**
 * §4 Iron Laws Compliance & Logic
 */

// --- Configuration & State ---
window.gameConfigDefs = {
    "baseSpeed": { "type": "number", "label": "Base Speed", "value": 2, "min": 1, "max": 10 },
    "tapBoost": { "type": "number", "label": "Tap Boost", "value": 15, "min": 5, "max": 50 },
    "taxiColor": { "type": "color", "label": "Taxi Color", "value": "#FFD700" }
};
window.gameConfig = {
    baseSpeed: 2,
    tapBoost: 15,
    taxiColor: "#FFD700"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmNode = document.getElementById('bgm_main');
        this.sfxBuffers = {};
        this.unlocked = false;
        this.muted = false;
        this.cooldowns = new Map();
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    async loadSound(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            this.sfxBuffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed', e);
        }
    }

    playBgm() {
        if (this.bgmNode && this.unlocked && !this.muted) {
            this.bgmNode.volume = 0.2;
            this.bgmNode.play().catch(() => {});
        }
    }

    stopBgm() {
        if (this.bgmNode) {
            this.bgmNode.pause();
            this.bgmNode.currentTime = 0;
        }
    }

    playSfx(id, fallbackType = 'beep', cooldownMs = 0, volume = 0.32) {
        if (!this.unlocked || this.muted) return;
        const now = performance.now();
        const nextAllowed = this.cooldowns.get(id) || 0;
        if (cooldownMs > 0 && now < nextAllowed) return;
        if (cooldownMs > 0) this.cooldowns.set(id, now + cooldownMs);
        if (this.sfxBuffers[id]) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = this.sfxBuffers[id];
            gain.gain.value = volume;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(fallbackType);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'engine') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'horn') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
}

// --- Game Logic ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();
    
    // Load SFX
    ['sfx_collect', 'sfx_boost', 'sfx_buy', 'sfx_blocked'].forEach(id => audio.loadSound(id));

    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const scoreDisplay = document.getElementById('score-display');
    const fleetDisplay = document.getElementById('fleet-display');
    const btnBuyTaxi = document.getElementById('btn-buy-taxi');
    const btnUpgSpeed = document.getElementById('btn-upgrade-speed');
    const btnUpgFare = document.getElementById('btn-upgrade-fare');
    const costTaxiEl = document.getElementById('cost-taxi');
    const costSpeedEl = document.getElementById('cost-speed');
    const costFareEl = document.getElementById('cost-fare');
    const feedbackBadge = document.getElementById('feedback-badge');
    const boostGif = document.getElementById('boost-gif');
    const upgradeGif = document.getElementById('upgrade-gif');

    // Game State
    let isPlaying = false;
    let lastTime = 0;
    let money = 0;
    let feedbackTimer = null;
    let gifTimer = null;
    
    // Upgrades
    let taxiCost = 100;
    let speedCost = 50;
    let fareCost = 75;
    let speedMultiplier = 1.0;
    let fareMultiplier = 1.0;

    // Entities
    const taxis = [];
    const particles = [];
    const floatTexts = [];
    const buildings = [];
    
    // World
    let worldScroll = 0;
    let laneHeight = 60;
    let roadY = 0;

    // Setup
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        roadY = window.innerHeight * 0.7;
        generateBuildings();
    }
    
    function generateBuildings() {
        buildings.length = 0;
        let x = 0;
        while(x < window.innerWidth * 2) {
            const w = 40 + Math.random() * 80;
            const h = 100 + Math.random() * 200;
            buildings.push({
                x: x,
                w: w,
                h: h,
                color: Math.random() > 0.5 ? '#2d3748' : '#4a5568',
                windows: Math.random() > 0.3
            });
            x += w + 5;
        }
    }

    class Taxi {
        constructor(laneIndex) {
            this.lane = laneIndex;
            this.x = -100 - (Math.random() * 200);
            this.y = roadY + 10 + (this.lane * 40);
            this.speed = 0;
            this.state = 'DRIVING'; // DRIVING, STOPPED
            this.targetX = window.innerWidth + 100;
            this.color = window.gameConfig.taxiColor;
            this.passenger = false;
            this.wobble = Math.random() * Math.PI;
        }

        update(dt, scrollSpeed) {
            this.wobble += dt * 10;
            
            // Movement logic
            let currentSpeed = (window.gameConfig.baseSpeed * speedMultiplier) + scrollSpeed;
            
            this.x += currentSpeed * 60 * dt;

            // Loop logic
            if (this.x > window.innerWidth + 100) {
                this.x = -150;
                this.completeTrip();
            }
        }

        completeTrip() {
            // Earn money
            const baseFare = 10;
            const earnings = Math.floor(baseFare * fareMultiplier);
            addMoney(earnings);
            
            // Feedback
            audio.playSfx('sfx_collect', 'beep', 120, 0.28);
            showFeedback('Fare collected', `+$${earnings} midnight tip`, 'fare');
            spawnFloatText(`+$${earnings}`, window.innerWidth - 50, this.y);
        }

        draw(ctx) {
            const bounce = Math.sin(this.wobble) * 2;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(this.x + 5, this.y + 25, 50, 6);

            // Body
            ctx.fillStyle = window.gameConfig.taxiColor;
            ctx.beginPath();
            ctx.roundRect(this.x, this.y + bounce, 60, 24, 4);
            ctx.fill();
            ctx.stroke(); // Outline

            // Roof
            ctx.fillStyle = window.gameConfig.taxiColor;
            ctx.beginPath();
            ctx.roundRect(this.x + 10, this.y - 12 + bounce, 40, 15, 4);
            ctx.fill();
            ctx.stroke();

            // Checker pattern
            ctx.fillStyle = '#000';
            for(let i=0; i<3; i++) {
                if(i%2===0) ctx.fillRect(this.x - 2 + (i*22), this.y + 10 + bounce, 6, 6);
            }
            
            // Taxi Sign
            ctx.fillStyle = '#FFF';
            ctx.fillRect(this.x + 25, this.y - 16 + bounce, 10, 4);

            // Wheels
            ctx.fillStyle = '#1a202c';
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y + 24 + bounce, 6, 0, Math.PI * 2);
            ctx.arc(this.x + 48, this.y + 24 + bounce, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Hubcaps
            ctx.fillStyle = '#718096';
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y + 24 + bounce, 2, 0, Math.PI * 2);
            ctx.arc(this.x + 48, this.y + 24 + bounce, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function showFeedback(title, detail, tone = 'fare') {
        if (!feedbackBadge) return;
        feedbackBadge.innerHTML = `<strong>${title}</strong><span>${detail}</span>`;
        feedbackBadge.dataset.tone = tone;
        feedbackBadge.classList.add('is-visible');
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => feedbackBadge.classList.remove('is-visible'), 1100);
    }

    function showGif(type) {
        const target = type === 'boost' ? boostGif : upgradeGif;
        const other = type === 'boost' ? upgradeGif : boostGif;
        if (!target || !other) return;
        other.classList.remove('is-visible');
        target.classList.add('is-visible');
        clearTimeout(gifTimer);
        gifTimer = setTimeout(() => target.classList.remove('is-visible'), 900);
    }

    function trySpend(cost, successCallback, blockedLabel) {
        if (money < cost) {
            audio.playSfx('sfx_blocked', 'horn', 120, 0.24);
            showFeedback('Need more cash', blockedLabel, 'blocked');
            return false;
        }
        money -= cost;
        successCallback();
        return true;
    }

    function addMoney(amount) {
        money += amount;
        updateUI();
    }

    function updateUI() {
        scoreDisplay.textContent = money;
        fleetDisplay.textContent = taxis.length;
        
        costTaxiEl.textContent = taxiCost;
        costSpeedEl.textContent = speedCost;
        costFareEl.textContent = fareCost;

        // Button States
        btnBuyTaxi.classList.toggle('btn-disabled', money < taxiCost);
        btnUpgSpeed.classList.toggle('btn-disabled', money < speedCost);
        btnUpgFare.classList.toggle('btn-disabled', money < fareCost);
    }

    function spawnFloatText(text, x, y) {
        floatTexts.push({ text, x, y, life: 1.0 });
    }

    function spawnParticles(x, y) {
        for(let i=0; i<5; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 100,
                vy: -50 - Math.random() * 100,
                life: 0.5 + Math.random() * 0.5,
                color: '#CBD5E0'
            });
        }
    }

    // --- Input Handling ---
    let boostVelocity = 0;

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!isPlaying) return;
        
        // Boost Logic
        boostVelocity = window.gameConfig.tapBoost;
        
        // Visual/Audio Feedback
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        spawnParticles(x, y);
        audio.playSfx('sfx_boost', 'engine', 120, 0.24);
        showFeedback('Turbo tap', 'Lead cab gets a speed burst', 'boost');
        showGif('boost');
        
        // Shake effect on cars
        taxis.forEach(t => t.wobble += 2);
    }, { passive: false });

    // --- Main Loop ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        if (isPlaying) {
            update(dt);
            draw(ctx);
        }

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        // Friction on boost
        boostVelocity = Math.max(0, boostVelocity - (boostVelocity * 5 * dt));
        
        // Scroll world
        worldScroll += (10 + boostVelocity) * dt;
        
        // Update Taxis
        taxis.forEach(taxi => taxi.update(dt, boostVelocity));

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Update Float Text
        for (let i = floatTexts.length - 1; i >= 0; i--) {
            let f = floatTexts[i];
            f.y -= 50 * dt;
            f.life -= dt;
            if (f.life <= 0) floatTexts.splice(i, 1);
        }
    }

    function draw(ctx) {
        // Clear Sky
        const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grd.addColorStop(0, '#63B3ED'); // Day blue
        grd.addColorStop(1, '#BEE3F8');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Parallax City
        ctx.save();
        // Layer 1 (Back)
        ctx.fillStyle = '#A0AEC0';
        buildings.forEach(b => {
            let px = (b.x - worldScroll * 10) % (window.innerWidth * 2);
            if (px < -b.w) px += window.innerWidth * 2;
            ctx.fillRect(px, roadY - b.h * 0.6, b.w, b.h * 0.6);
        });
        
        // Layer 2 (Front)
        ctx.fillStyle = '#4A5568';
        buildings.forEach((b, i) => {
            let px = (b.x - worldScroll * 20 + 100) % (window.innerWidth * 2);
            if (px < -b.w) px += window.innerWidth * 2;
            ctx.fillRect(px, roadY - b.h, b.w, b.h);
            
            // Windows
            if (b.windows) {
                ctx.fillStyle = '#F6E05E'; // Light on
                for(let wy = 0; wy < b.h - 20; wy += 30) {
                    if ((i + wy) % 5 !== 0) ctx.fillRect(px + 10, roadY - b.h + 10 + wy, b.w - 20, 15);
                }
                ctx.fillStyle = '#4A5568'; // Reset
            }
        });
        ctx.restore();

        // Road
        ctx.fillStyle = '#2D3748';
        ctx.fillRect(0, roadY, canvas.width, canvas.height - roadY);
        // Lane markers
        ctx.strokeStyle = '#FFF';
        ctx.setLineDash([20, 20]);
        ctx.lineWidth = 2;
        ctx.lineDashOffset = -worldScroll * 50;
        ctx.beginPath();
        ctx.moveTo(0, roadY + 40);
        ctx.lineTo(canvas.width, roadY + 40);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Taxis
        taxis.forEach(taxi => taxi.draw(ctx));

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5 * p.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Draw Float Text
        ctx.font = "700 22px 'Audiowide'";
        ctx.fillStyle = '#86F892';
        ctx.strokeStyle = '#0B172B';
        ctx.lineWidth = 3;
        floatTexts.forEach(f => {
            ctx.globalAlpha = f.life;
            ctx.strokeText(f.text, f.x, f.y);
            ctx.fillText(f.text, f.x, f.y);
            ctx.globalAlpha = 1;
        });
    }

    // --- Init ---
    resize();
    window.addEventListener('resize', resize);
    
    // Start Game
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.unlock();
        startScreen.style.display = 'none';
        isPlaying = true;
        showFeedback('Shift started', 'Tap anywhere to boost the convoy', 'start');
        
        // Initial Taxi
        taxis.push(new Taxi(0));
        updateUI();
        requestAnimationFrame(gameLoop);
    });

    // --- Upgrade Logic ---
    btnBuyTaxi.addEventListener('click', () => {
        trySpend(taxiCost, () => {
            taxiCost = Math.floor(taxiCost * 1.5);
            taxis.push(new Taxi(taxis.length % 3)); // Distribute across lanes
            audio.playSfx('sfx_buy', 'horn', 90, 0.28);
            showFeedback('New van deployed', `Fleet expanded to ${taxis.length}`, 'buy');
            showGif('upgrade');
            updateUI();
        }, `Save $${taxiCost} for a fresh van`);
    });

    btnUpgSpeed.addEventListener('click', () => {
        trySpend(speedCost, () => {
            speedCost = Math.floor(speedCost * 1.4);
            speedMultiplier += 0.2;
            audio.playSfx('sfx_buy', 'horn', 90, 0.26);
            showFeedback('Rush upgraded', `Cruise speed x${speedMultiplier.toFixed(1)}`, 'speed');
            showGif('upgrade');
            updateUI();
        }, `Need $${speedCost} for rush tuning`);
    });

    btnUpgFare.addEventListener('click', () => {
        trySpend(fareCost, () => {
            fareCost = Math.floor(fareCost * 1.6);
            fareMultiplier += 0.5;
            audio.playSfx('sfx_buy', 'horn', 90, 0.26);
            showFeedback('Tips upgraded', `Fare bonus x${fareMultiplier.toFixed(1)}`, 'fare');
            showGif('upgrade');
            updateUI();
        }, `Need $${fareCost} for premium tips`);
    });

});
</script>
</body>
</html>
