<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
        <title>Neural Rush</title>
        <!-- [agent-note][stage4] repaired: catalog-font-remap | display: Audiowide | ui: Exo 2 | terminal-accent: VT323 -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=VT323&display=swap" rel="stylesheet">
        <style>

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        :root {
            --bg-top: #08111f;
            --bg-bottom: #02050d;
            --panel-bg: rgba(8, 18, 38, 0.82);
            --panel-border: rgba(94, 234, 212, 0.4);
            --panel-shadow: rgba(34, 211, 238, 0.18);
            --hero-cyan: #67f5ff;
            --hero-blue: #4cc3ff;
            --hero-core: #fef3c7;
            --danger: #ff577c;
            --danger-deep: #ff204e;
            --bonus: #7dff72;
            --bonus-gold: #dcff8f;
            --ui-text: #eef6ff;
            --muted-text: rgba(190, 211, 255, 0.78);
        }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(103, 245, 255, 0.12), transparent 35%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--ui-text);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 20%, rgba(125, 255, 114, 0.08), transparent 20%),
                radial-gradient(circle at 80% 10%, rgba(76, 195, 255, 0.12), transparent 24%),
                linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.025) 48%, transparent 52%);
            mix-blend-mode: screen;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button { font: inherit; cursor: pointer; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .hidden { display: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-mono { font-family: 'VT323', monospace; letter-spacing: 0.06em; }
        .font-display { font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-widest { letter-spacing: 0.22em; }
        .uppercase { text-transform: uppercase; }
        .transition { transition: all 0.2s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .rounded-sm { border-radius: 0.25rem; }
        .p-10 { padding: 2.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .text-sm { font-size: 0.95rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 2rem; }
        .text-5xl { font-size: clamp(2.4rem, 6vw, 3.4rem); }
        .text-6xl { font-size: clamp(2.8rem, 7vw, 4.4rem); }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-gray-400 { color: rgba(156, 163, 175, 0.95); }
        .text-green-400 { color: #4ade80; }
        .text-cyan-400 { color: #22d3ee; }
        .text-red-500 { color: #ef4444; }
        .text-red-300 { color: #fca5a5; }
        .text-green-300-80 { color: rgba(134, 239, 172, 0.8); }
        .bg-green-600 { background: #16a34a; }
        .bg-white { background: #fff; }
        .border-l-4 { border-left-width: 4px; border-left-style: solid; }
        .border-green-500 { border-left-color: #22c55e; }
        .border-red-500 { border-left-color: #ef4444; }
        .glass-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(12, 28, 54, 0.92), var(--panel-bg)),
                rgba(8, 18, 38, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 28px var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            max-width: min(92vw, 34rem);
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 35%, transparent 65%, rgba(103,245,255,0.08));
        }
        .hover-scale:hover { transform: translateY(-2px) scale(1.02); }
        .btn-primary,
        .btn-secondary {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 24px rgba(0,0,0,0.24);
        }
        .btn-primary {
            background: linear-gradient(180deg, var(--bonus-gold), var(--bonus));
            color: #041109;
            box-shadow: 0 0 18px rgba(125,255,114,0.32);
        }
        .btn-primary:hover { filter: brightness(1.04); }
        .btn-secondary {
            background: linear-gradient(180deg, #f8fbff, #d8e7ff);
            color: #07111d;
        }
        .btn-secondary:hover { filter: brightness(1.03); }
        .neon-text {
            color: #d9fffb;
            text-shadow: 0 0 10px rgba(103,245,255,0.72), 0 0 26px rgba(76,195,255,0.48);
        }
        .neon-red {
            color: #ffdbe5;
            text-shadow: 0 0 10px rgba(255,87,124,0.72), 0 0 24px rgba(255,32,78,0.55);
        }
        .subtitle-text { color: var(--muted-text); }
        .hud-chip {
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            background: rgba(6, 14, 28, 0.72);
            border: 1px solid rgba(103, 245, 255, 0.25);
            box-shadow: 0 0 14px rgba(76, 195, 255, 0.14);
            text-shadow: 0 0 8px rgba(103, 245, 255, 0.35);
        }
        .pulse-soft { animation: pulse-soft 1.4s ease-in-out infinite; }
        .data-trace {
            position: absolute;
            inset: auto 0 0 0;
            height: 5px;
            background: linear-gradient(90deg, transparent, rgba(103,245,255,0.8), rgba(125,255,114,0.85), transparent);
            filter: blur(0.5px);
            opacity: 0.8;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .feedback-gif {
            position: absolute;
            width: clamp(88px, 18vw, 140px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(103, 245, 255, 0.28);
            box-shadow: 0 0 24px rgba(34, 211, 238, 0.22);
            background: rgba(2, 6, 23, 0.5);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1);
        }
        #pickup-gif {
            top: 5.5rem;
            right: 1rem;
        }
        #danger-gif {
            bottom: 1rem;
            left: 1rem;
        }
        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .text-xl { font-size: 1rem; }
            .text-2xl { font-size: 1.15rem; }
            .text-3xl { font-size: 1.5rem; }
            .top-4, .left-4, .right-4 { top: 0.75rem; left: 0.75rem; right: 0.75rem; }
            #pickup-gif { top: 4.75rem; right: 0.75rem; width: 84px; }
            #danger-gif { bottom: 0.75rem; left: 0.75rem; width: 84px; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-sm text-center pointer-events-auto hover-scale transition duration-300 border-l-4 border-green-500">
                <div class="data-trace" aria-hidden="true"></div>
                <h1 class="text-6xl font-bold text-white mb-2 neon-text tracking-tighter font-display">NEURAL RUSH</h1>
                <p class="subtitle-text text-xl mb-2 pulse-soft">Pilot the prism core through a live firewall storm.</p>
                <p class="text-green-300-80 text-xl mb-8 font-mono">>> STABILIZE THE TRAINING RUN <<</p>
                <div class="text-sm text-gray-400 mb-6 font-mono">
                    [OBJECTIVE]<br>
                    Sweep up clean data shards.<br>
                    Dodge corrupted bug blocks.
                </div>
                <button id="start-btn" class="btn-primary font-bold py-4 px-10 rounded-sm transition uppercase tracking-widest">Begin Run</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-sm text-center pointer-events-auto border-l-4 border-red-500">
                <div class="data-trace" aria-hidden="true"></div>
                <h2 class="text-5xl font-bold text-red-500 mb-2 neon-red font-display">RUN CORRUPTED</h2>
                <p class="text-red-300 mb-6">Too many bug blocks broke the simulation.</p>
                <div class="text-3xl text-white mb-8 font-mono">Data Secured: <span id="finalScore" class="text-green-400">0</span> TB</div>
                <button id="restart-btn" class="btn-secondary bg-white text-black font-bold py-3 px-8 rounded-sm transition uppercase">Retry Run</button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="absolute top-4 left-4 text-2xl font-bold text-green-400 hidden font-mono hud-chip">
                DATA: <span id="score">0</span> TB
            </div>
            <div id="hud-level" class="absolute top-4 right-4 text-xl font-bold text-cyan-400 hidden font-mono hud-chip">
                FLOW: <span id="speed-display">1.0</span>x
            </div>
            <!-- [agent-note][stage3] resolved-gif: pickup/fail feedback overlays -> catalogs/gifs.json -->
            <img id="pickup-gif" class="feedback-gif pointer-events-none" alt="Data surge reaction" src="https://i.giphy.com/34HAaqlL2oCUo.webp">
            <img id="danger-gif" class="feedback-gif pointer-events-none" alt="Corruption warning reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                danger: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayed = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audioNode = new Audio(v);
                    audioNode.preload = 'auto';
                    this.sfx[k] = audioNode;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() { 
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
            }

            playSFX(key, volume = 0.7, debounceMs = 120) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < debounceMs) return;
                this.lastPlayed[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let gameSpeed = 5;
        let frameCount = 0;
        let warningCooldown = 0;
        
        // Player
        let player = { x: 0, y: 0, radius: 20, targetX: 0 };
        
        // Entities
        let enemies = []; // Bugs
        let bonuses = []; // Data
        let particles = []; // Explosion/Collect effects
        
        // Background State
        let gridOffset = 0;
        let binaryRain = [];
        const pickupGif = document.getElementById('pickup-gif');
        const dangerGif = document.getElementById('danger-gif');
        let pickupGifTimer = 0;
        let dangerGifTimer = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            if (!gameActive) player.x = width / 2;
            
            // Re-init binary rain columns
            binaryRain = [];
            const columns = Math.floor(width / 20);
            for(let i=0; i<columns; i++) {
                binaryRain.push({
                    x: i * 20,
                    y: Math.random() * height,
                    speed: Math.random() * 5 + 2,
                    chars: []
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        window.addEventListener('pointermove', (e) => {
            if(gameActive) player.targetX = e.clientX;
        });
        window.addEventListener('touchmove', (e) => {
            if(gameActive) {
                e.preventDefault();
                player.targetX = e.touches[0].clientX;
            }
        }, {passive: false});

        /** 4. GAME LOGIC */
        function showGif(node, duration = 850) {
            if (!node) return;
            node.classList.add('visible');
            node.dataset.hideAt = String(performance.now() + duration);
        }

        function syncGifVisibility() {
            const now = performance.now();
            [pickupGif, dangerGif].forEach((node) => {
                if (!node) return;
                const hideAt = Number(node.dataset.hideAt || 0);
                if (hideAt && now >= hideAt) {
                    node.classList.remove('visible');
                    node.dataset.hideAt = '0';
                }
            });
        }

        function initGame() {
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            warningCooldown = 0;
            enemies = [];
            bonuses = [];
            particles = [];
            player.x = width / 2;
            player.targetX = width / 2;
            document.getElementById('score').innerText = "0";
            document.getElementById('speed-display').innerText = "1.0";
            pickupGif.classList.remove('visible');
            pickupGif.dataset.hideAt = '0';
            dangerGif.classList.remove('visible');
            dangerGif.dataset.hideAt = '0';
        }

        function spawnEntity() {
            // Difficulty scaling
            const spawnRate = Math.max(20, 60 - Math.floor(score / 50)); 
            
            if (frameCount % spawnRate === 0) {
                const type = Math.random();
                const x = Math.random() * (width - 40) + 20;
                
                if (type > 0.4) {
                    // Enemy (Bug)
                    enemies.push({
                        x: x,
                        y: -50,
                        size: 25 + Math.random() * 10,
                        speed: gameSpeed * (0.8 + Math.random() * 0.4),
                        rotation: 0,
                        rotationSpeed: (Math.random() - 0.5) * 0.2
                    });
                } else {
                    // Bonus (Data)
                    bonuses.push({
                        x: x,
                        y: -50,
                        size: 15,
                        speed: gameSpeed * 0.9,
                        val: 10 + Math.floor(Math.random() * 20),
                        wobble: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function update() {
            frameCount++;
            if (warningCooldown > 0) warningCooldown--;
            
            // Smooth player movement
            player.x += (player.targetX - player.x) * 0.15;
            
            // Clamp player
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > width - player.radius) player.x = width - player.radius;

            // Increase speed slowly
            if (frameCount % 300 === 0) {
                gameSpeed += 0.5;
                document.getElementById('speed-display').innerText = (gameSpeed / 6).toFixed(1);
            }

            spawnEntity();

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;
                e.rotation += e.rotationSpeed;
                
                // Collision
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < player.radius + e.size * 0.8) {
                    gameOver();
                    return;
                }

                if (e.y > height + 50) {
                    enemies.splice(i, 1);
                } else if (warningCooldown === 0 && e.y > height * 0.68 && Math.abs(player.x - e.x) < 90) {
                    warningCooldown = 28;
                    showGif(dangerGif, 700);
                    audio.playSFX('danger', 0.4, 240);
                }
            }

            // Update Bonuses
            for (let i = bonuses.length - 1; i >= 0; i--) {
                let b = bonuses[i];
                b.y += b.speed;
                b.wobble += 0.1;
                b.x += Math.sin(b.wobble) * 2; // Floating effect

                const dx = player.x - b.x;
                const dy = player.y - b.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < player.radius + b.size + 10) {
                    score += b.val;
                    document.getElementById('score').innerText = score;
                    createParticles(b.x, b.y, '#00ffcc', 8);
                    showGif(pickupGif, 820);
                    audio.playSFX('score', 0.56, 90);
                    bonuses.splice(i, 1);
                } else if (b.y > height + 50) {
                    bonuses.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Background Parallax Updates
            gridOffset = (gridOffset + gameSpeed * 0.5) % 50;
            
            binaryRain.forEach(col => {
                col.y += col.speed;
                if(col.y > height) col.y = -50;
            });
            syncGifVisibility();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 1. Background: neural grid and pulse horizon
            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#091426');
            sky.addColorStop(0.55, '#050b18');
            sky.addColorStop(1, '#02040b');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            const horizon = ctx.createRadialGradient(width / 2, height * 0.22, 10, width / 2, height * 0.22, width * 0.55);
            horizon.addColorStop(0, 'rgba(103, 245, 255, 0.18)');
            horizon.addColorStop(0.45, 'rgba(76, 195, 255, 0.08)');
            horizon.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = horizon;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(90, 220, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x < width; x += 50) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = gridOffset; y < height; y += 50) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            ctx.fillStyle = 'rgba(125, 255, 114, 0.18)';
            ctx.font = '18px "VT323", monospace';
            binaryRain.forEach(col => {
                ctx.fillText(Math.random() > 0.5 ? '1' : '0', col.x, col.y);
            });

            // 2. Player (The Prism Core Runner)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(Math.sin(frameCount * 0.08) * 0.08);

            ctx.shadowBlur = 28;
            ctx.shadowColor = '#67f5ff';
            const playerAura = ctx.createRadialGradient(0, 0, player.radius * 0.2, 0, 0, player.radius * 1.5);
            playerAura.addColorStop(0, 'rgba(254, 243, 199, 0.95)');
            playerAura.addColorStop(0.45, 'rgba(103, 245, 255, 0.92)');
            playerAura.addColorStop(1, 'rgba(76, 195, 255, 0)');
            ctx.fillStyle = playerAura;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius * 1.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#d9fffb';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -player.radius - 12);
            ctx.lineTo(player.radius + 14, 0);
            ctx.lineTo(0, player.radius + 12);
            ctx.lineTo(-player.radius - 14, 0);
            ctx.closePath();
            ctx.stroke();

            ctx.fillStyle = '#4cc3ff';
            ctx.beginPath();
            ctx.moveTo(0, -player.radius - 4);
            ctx.lineTo(player.radius + 6, 0);
            ctx.lineTo(0, player.radius + 4);
            ctx.lineTo(-player.radius - 6, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius * 0.42, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(125,255,114,0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius * 0.9, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            ctx.shadowBlur = 0;

            // 3. Bonuses (Data Shards)
            bonuses.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.wobble * 0.6);
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#7dff72';

                const bonusGlow = ctx.createRadialGradient(0, 0, 2, 0, 0, b.size * 1.4);
                bonusGlow.addColorStop(0, 'rgba(220,255,143,0.95)');
                bonusGlow.addColorStop(0.5, 'rgba(125,255,114,0.9)');
                bonusGlow.addColorStop(1, 'rgba(125,255,114,0)');
                ctx.fillStyle = bonusGlow;
                ctx.beginPath();
                ctx.arc(0, 0, b.size * 1.1, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#dcff8f';
                ctx.beginPath();
                ctx.moveTo(0, -b.size);
                ctx.lineTo(b.size * 0.78, 0);
                ctx.lineTo(0, b.size);
                ctx.lineTo(-b.size * 0.78, 0);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#f6ffe7';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            });

            // 4. Enemies (Corruption blocks)
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.rotate(e.rotation);

                const enemyGrad = ctx.createLinearGradient(-e.size / 2, -e.size / 2, e.size / 2, e.size / 2);
                enemyGrad.addColorStop(0, '#ff7b93');
                enemyGrad.addColorStop(0.55, '#ff335f');
                enemyGrad.addColorStop(1, '#6d001a');
                ctx.fillStyle = enemyGrad;
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#ff335f';
                ctx.fillRect(-e.size/2, -e.size/2, e.size, e.size);

                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-e.size/2, -e.size/2 + 5);
                ctx.lineTo(e.size/2, e.size/2 - 5);
                ctx.moveTo(-e.size/2, 0);
                ctx.lineTo(e.size/2, (Math.random()-0.5)*10);
                ctx.moveTo(-e.size/2 + 5, e.size/2 - 5);
                ctx.lineTo(e.size/2 - 5, -e.size/2 + 5);
                ctx.stroke();

                ctx.restore();
            });

            // 5. Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            showGif(dangerGif, 1300);
            audio.playSFX('fail', 0.62, 0);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('hud-level').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 5. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.62, 0);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud-level').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', 0.52, 0);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud-level').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
