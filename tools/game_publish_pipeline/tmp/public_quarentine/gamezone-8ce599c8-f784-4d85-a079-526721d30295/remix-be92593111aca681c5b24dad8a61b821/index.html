<style>
    :root {
        --bg-top: #06101f;
        --bg-mid: #10233f;
        --bg-bottom: #241346;
        --panel: rgba(12, 30, 48, 0.78);
        --panel-border: rgba(99, 255, 95, 0.72);
        --ink: #f3fff3;
        --ink-soft: #b7e8df;
        --accent: #63ff5f;
        --accent-dark: #1bbb56;
        --accent-bright: #baff39;
        --cool: #47f2ff;
        --plumbus: #ff5fbf;
        --warning: #ffb238;
        --white: #f3fff3;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 18%, rgba(99, 255, 95, 0.22), transparent 34%),
            radial-gradient(circle at 15% 80%, rgba(255, 95, 191, 0.16), transparent 32%),
            linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    body {
        position: relative;
        color: var(--white);
    }

    .font-display {
        font-family: 'Bangers', cursive;
    }

    .font-ui {
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    canvas {
        display: block;
        touch-action: none;
        width: 100%;
        height: 100%;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: auto;
        pointer-events: none;
        z-index: 0;
        border-radius: 999px;
        filter: blur(12px);
        opacity: 0.7;
    }

    #game-container::before {
        width: 32vw;
        height: 32vw;
        min-width: 180px;
        min-height: 180px;
        left: -8vw;
        top: 10%;
        background: rgba(99, 255, 95, 0.18);
        animation: drift 12s ease-in-out infinite;
    }

    #game-container::after {
        width: 36vw;
        height: 36vw;
        min-width: 210px;
        min-height: 210px;
        right: -10vw;
        bottom: 18%;
        background: rgba(71, 242, 255, 0.16);
        animation: drift 14s ease-in-out infinite reverse;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
    }

    .hidden {
        display: none !important;
    }

    .interactive {
        pointer-events: auto;
    }

    .glass-panel {
        background:
            linear-gradient(180deg, rgba(14, 42, 62, 0.88), rgba(4, 16, 30, 0.82)),
            repeating-linear-gradient(90deg, rgba(71,242,255,0.09) 0 1px, transparent 1px 18px);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 2px solid var(--panel-border);
        box-shadow:
            0 18px 38px rgba(0, 255, 136, 0.13),
            inset 0 1px 0 rgba(186, 255, 57, 0.22);
        border-radius: 24px;
    }

    .btn-toggle {
        position: relative;
        background:
            radial-gradient(circle at 26% 16%, rgba(255,255,255,0.42), transparent 20%),
            linear-gradient(180deg, #173f54, #071724);
        border: 3px solid var(--accent);
        color: var(--white);
        border-radius: 16px;
        font-weight: 700;
        font-family: 'Rajdhani', system-ui, sans-serif;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.18s ease, color 0.18s ease;
        box-shadow: 0 5px 0 var(--accent-dark), 0 0 16px rgba(99,255,95,0.16);
        cursor: pointer;
        overflow: hidden;
        text-shadow: 0 1px 0 rgba(0,0,0,0.38);
    }

    .btn-toggle::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 10%, rgba(255,255,255,0.55) 45%, transparent 75%);
        transform: translateX(-130%);
        transition: transform 0.35s ease;
    }

    .btn-toggle:hover::after,
    .btn-toggle:focus-visible::after {
        transform: translateX(130%);
    }

    .btn-toggle:active {
        transform: translateY(5px);
        box-shadow: 0 0 0 var(--accent-dark);
    }

    .btn-toggle.active {
        background:

    #start-screen {

    #start-screen::before {

    #ui-title {
        margin: 0;
        font-family: 'Bangers', cursive;

    #ui-subtitle {
        max-width: 28rem;

    #ui-cta {

        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        box-shadow: 0 10px 22px rgba(31, 7, 49, 0.2);

        transform: translateY(-8px) scale(0.96);
        transition: opacity 0.22s ease, transform 0.22s ease;
        backdrop-filter: blur(8px);

    .feedback-badge.show {
        opacity: 1;

    }

    .feedback-gif {
        width: 100%;
        max-width: 116px;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.6);
        background: rgba(6,16,31,0.42);
        box-shadow: 0 12px 24px rgba(0, 255, 136, 0.14);
        object-fit: cover;
        aspect-ratio: 1 / 1;
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .feedback-gif.show {
        opacity: 0.96;
        transform: scale(1);
    }

    #controls-panel {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 24px;
        max-width: 500px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }

    .panel-label {
        color: var(--white);
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        text-shadow: 0 0 10px rgba(99, 255, 95, 0.38);
    }

    .random-button {
        min-height: 44px;
        box-sizing: border-box;
        padding: 7px 16px;
        font-size: 0.95rem;
        background: linear-gradient(180deg, #47f2ff, #21a6dd);
        border-color: #baff39;
        color: #06101f;
        box-shadow: 0 5px 0 #127ba8;
        white-space: nowrap;
    }

    .random-button:active {
            box-shadow: 0 0 0 #127ba8;
    }

    .button-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
    }

    .button-grid + .button-grid {
        margin-top: 8px;
    }

    .button-large {
        padding: 12px;
        font-size: 1.1rem;
    }

    .button-small {
        padding: 10px;
        font-size: 0.95rem;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes glowPulse {
        0%, 100% { opacity: 0.78; box-shadow: 0 10px 24px rgba(0, 255, 136, 0.16), inset 0 0 18px rgba(71,242,255,0.12); }
        50% { opacity: 1; box-shadow: 0 10px 26px rgba(0, 255, 136, 0.28), inset 0 0 22px rgba(71,242,255,0.18); }
    }

    @keyframes drift {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, -18px, 0); }
    }

    @media (max-width: 520px) {
        .panel-header {
            flex-direction: column;
            align-items: stretch;
        }

        .random-button {
            width: 100%;
        }

        #controls-panel {
            bottom: 18px;
            left: 12px;
            right: 12px;
            padding: 14px;
            gap: 10px;
        }

            gap: 12px;
        }

        .button-large,
        .button-small {

            #ui-title {

</style>

<script>
/**
 * Portal Panic Lab
 * A single-file HTML5 portal-garage styling toy.
 */

// --- 1. System & Config ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = window.devicePixelRatio || 1;

// Config state
const gameConfig = {
    themeColor: "#63FF5F",
    skinTone: "#FFE0D0",
    hairColor: "#8B4513"
};

// Runtime state
let gameState = 'START'; // START, PLAY
let time = 0;
let lastTime = 0;

// Character State
const charState = {
    hasShirt: true,
    hasShorts: true,
    hasShoes: true,
    hasAcc: true,
    shirtColor: '#f6d24a',
    shortsColor: '#4c8cff',
    shoeColor: '#101926',
    accColor: '#47f2ff',
    eyeState: 'open', // open, blink
    blinkTimer: 0,
    bouncePhase: 0
};

// Particles
const particles = [];

// Feedback media
const FEEDBACK_GIFS = {
    reward: 'https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp',
    blocked: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
};
const feedbackEl = document.getElementById('feedback-text');
const feedbackGifEl = document.getElementById('feedback-gif');
let feedbackTimer = 0;
let feedbackGifTimer = 0;

// --- 2. Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.buffers = {};
        this.lastPlay = {};
        this.sfxConfig = {
            start: { url: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3', volume: 0.6, debounce: 180 },
            toggleOn: { url: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3', volume: 0.42, debounce: 90 },
            toggleOff: { url: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3', volume: 0.34, debounce: 90 },
            randomize: { url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3', volume: 0.46, debounce: 180 },
            click: { url: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3', volume: 0.32, debounce: 90 }
        };
        this.bgmEl = document.getElementById('bgm_main');
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        Object.entries(this.sfxConfig).forEach(([id, config]) => this.loadBuffer(id, config.url));

        const unlock = () => {
            if (!this.ctx || this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
            }).catch(() => {});
        };

        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock, { passive: true }));
    }

    async loadBuffer(id, url) {
        this.buffers[id] = null;
    }

    playHtmlSfx(id, volume) {
        const config = this.sfxConfig[id];
        if (!config?.url) return;

        const sfx = new Audio(config.url);
        sfx.preload = 'auto';
        sfx.volume = Math.min(volume, 1);
        sfx.play().catch(() => {});
    }

    playBgm() {
        if (!this.unlocked || !this.bgmEl) return;
        this.bgmEl.volume = 0.2;
        this.bgmEl.play().catch(() => {});
    }

    pauseBgm() {
        if (this.bgmEl) this.bgmEl.pause();
    }

    playSfx(id) {
        if (!this.unlocked || !this.ctx) return;
        const config = this.sfxConfig[id];
        const now = performance.now();

        if (config?.debounce && this.lastPlay[id] && now - this.lastPlay[id] < config.debounce) {
            return;
        }
        this.lastPlay[id] = now;

        if (this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = this.buffers[id];
            gain.gain.value = config?.volume ?? 0.35;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else if (config?.url) {
            this.playHtmlSfx(id, config?.volume ?? 0.25);
        } else {
            this.synthPop(config?.volume ?? 0.25);
        }
    }

    synthPop(volume = 0.25) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    }
}
const audio = new AudioManager();

// --- 3. Input & Logic ---

function initGame() {
    resize();
    window.addEventListener('resize', resize);

    document.getElementById('btn-top').addEventListener('pointerdown', (e) => toggleItem('shirt', e));
    document.getElementById('btn-bottom').addEventListener('pointerdown', (e) => toggleItem('shorts', e));
    document.getElementById('btn-shoes').addEventListener('pointerdown', (e) => toggleItem('shoes', e));
    document.getElementById('btn-acc').addEventListener('pointerdown', (e) => toggleItem('acc', e));
    document.getElementById('btn-gacha').addEventListener('pointerdown', (e) => gachaRandom(e));

    const startHandler = (e) => {
        if (gameState === 'START') {
            audio.init();
            startGame();
        }
    };

    window.addEventListener('pointerdown', (e) => {
        if (gameState === 'START') startHandler(e);
    });

    window.addEventListener('keydown', (e) => {
        if (gameState === 'START') startHandler(e);
    });

    requestAnimationFrame(loop);
}

function showFeedback(message, gifKey, duration = 1400) {
    if (!feedbackEl || !feedbackGifEl) return;
    feedbackEl.textContent = message;
    feedbackEl.classList.add('show');
    window.clearTimeout(feedbackTimer);
    feedbackTimer = window.setTimeout(() => feedbackEl.classList.remove('show'), duration);

    const gifSrc = FEEDBACK_GIFS[gifKey];
    if (gifSrc) {
        feedbackGifEl.src = gifSrc;
        feedbackGifEl.classList.add('show');
        window.clearTimeout(feedbackGifTimer);
        feedbackGifTimer = window.setTimeout(() => feedbackGifEl.classList.remove('show'), Math.min(duration + 500, 2200));
    }
}

function startGame() {
    gameState = 'PLAY';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    audio.playSfx('start');
    showFeedback('PORTAL READY!', 'reward', 1800);
    spawnParticles(canvas.width / 2, canvas.height / 2, 20, '#FFF');
}

function toggleItem(item, e) {
    e.stopPropagation();

    const map = {
        'shirt': { prop: 'hasShirt', btn: 'btn-top', label: 'SUIT' },
        'shorts': { prop: 'hasShorts', btn: 'btn-bottom', label: 'PANTS' },
        'shoes': { prop: 'hasShoes', btn: 'btn-shoes', label: 'BOOTS' },
        'acc': { prop: 'hasAcc', btn: 'btn-acc', label: 'GOGGLES' }
    };

    const target = map[item];
    charState[target.prop] = !charState[target.prop];

    const btn = document.getElementById(target.btn);
    if (charState[target.prop]) {
        audio.playSfx('toggleOn');
        btn.classList.add('active');
        btn.innerText = `${target.label}: ON`;
        showFeedback(`${target.label} SYNC`, 'reward');
        spawnParticles(canvas.width / 2, canvas.height / 2, 10, '#FFD700');
    } else {
        audio.playSfx('toggleOff');
        btn.classList.remove('active');
        btn.innerText = `${target.label}: OFF`;
        showFeedback(`${target.label} OFF`, 'blocked', 1200);
        spawnParticles(canvas.width / 2, canvas.height / 2, 5, '#CCC');
    }
}

function gachaRandom(e) {
    e.stopPropagation();
    audio.playSfx('randomize');

    const portalPalette = ['#f6d24a', '#63ff5f', '#47f2ff', '#ff5fbf', '#baff39', '#7c4dff'];
    const randColor = () => portalPalette[Math.floor(Math.random() * portalPalette.length)];
    charState.shirtColor = randColor();
    charState.shortsColor = randColor();
    charState.accColor = randColor();
    charState.shoeColor = `hsl(${Math.random() * 60 + 190}, 34%, 18%)`;

    if (Math.random() > 0.8) toggleItem('shirt', { stopPropagation: () => {} });
    charState.hasShirt = true;
    charState.hasShorts = true;
    charState.hasShoes = true;
    charState.hasAcc = true;

    ['btn-top', 'btn-bottom', 'btn-shoes', 'btn-acc'].forEach(id => {
        document.getElementById(id).classList.add('active');
        const label = id === 'btn-top' ? 'SUIT' : id === 'btn-bottom' ? 'PANTS' : id === 'btn-shoes' ? 'BOOTS' : 'GOGGLES';
        document.getElementById(id).innerText = `${label}: ON`;
    });

    showFeedback('RICK MIX!', 'reward', 1800);
    spawnParticles(canvas.width / 2, canvas.height / 2, 30, '#FFF');
}

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// --- 4. Rendering ---

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 8 + 4;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2;
        this.life -= dt * 1.5;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function drawBackground() {
    const width = canvas.width / dpr;
    const height = canvas.height / dpr;
    const speed = 24;
    const offset = (time * speed) % 160;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    skyGrad.addColorStop(0, '#06101f');
    skyGrad.addColorStop(0.48, '#10233f');
    skyGrad.addColorStop(1, '#241346');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    // Animated portal-garage foundation: procedural, non-interactive, and subordinate to the avatar.
    const portalX = width * 0.52 + Math.sin(time * 0.35) * 10;
    const portalY = height * 0.28;
    const portalR = Math.min(width, height) * 0.24;
    const portalGlow = ctx.createRadialGradient(portalX, portalY, 18, portalX, portalY, portalR * 1.75);
    portalGlow.addColorStop(0, 'rgba(186,255,57,0.52)');
    portalGlow.addColorStop(0.24, 'rgba(99,255,95,0.28)');
    portalGlow.addColorStop(0.58, 'rgba(71,242,255,0.12)');
    portalGlow.addColorStop(1, 'rgba(71,242,255,0)');
    ctx.fillStyle = portalGlow;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.translate(portalX, portalY);
    ctx.rotate(time * 0.25);
    for (let r = 0; r < 4; r++) {
        ctx.strokeStyle = r % 2 === 0 ? 'rgba(99,255,95,0.42)' : 'rgba(71,242,255,0.34)';
        ctx.lineWidth = 3 - r * 0.35;
        ctx.beginPath();
        ctx.ellipse(0, 0, portalR * (0.75 + r * 0.14), portalR * (0.34 + r * 0.07), r * 0.55, 0, Math.PI * 2);
        ctx.stroke();
    }
    for (let i = 0; i < 10; i++) {
        const a = i * Math.PI * 0.2 + time * 0.8;
        ctx.fillStyle = i % 2 ? 'rgba(186,255,57,0.62)' : 'rgba(71,242,255,0.58)';
        ctx.beginPath();
        ctx.arc(Math.cos(a) * portalR * 0.86, Math.sin(a) * portalR * 0.38, 2.2 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(71,242,255,0.08)';
    ctx.lineWidth = 1;
    for (let x = -offset; x < width + 160; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + height * 0.32, height);
        ctx.stroke();
    }
    for (let y = (offset * 0.35) % 44; y < height; y += 44) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.75;
    for (let i = 0; i < 22; i++) {
        const x = (i * 97 + time * (10 + i % 4)) % (width + 80) - 40;
        const y = 42 + ((i * 61 + time * 18) % Math.max(1, height * 0.55));
        const radius = 1.5 + (i % 4) * 0.7;
        ctx.fillStyle = i % 3 === 0 ? 'rgba(99,255,95,0.58)' : i % 3 === 1 ? 'rgba(71,242,255,0.48)' : 'rgba(255,95,191,0.34)';
        ctx.beginPath();
        ctx.arc(x, y + Math.sin(time + i) * 5, radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    const benchY = height * 0.78;
    ctx.fillStyle = 'rgba(3, 10, 22, 0.62)';
    ctx.fillRect(0, benchY, width, height - benchY);

    ctx.fillStyle = 'rgba(8, 25, 39, 0.88)';
    ctx.fillRect(0, benchY + 12, width, 22);

    ctx.strokeStyle = 'rgba(186,255,57,0.24)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, benchY + 15);
    ctx.lineTo(width, benchY + 15);
    ctx.stroke();

    for (let i = 0; i < 5; i++) {
        const towerX = (i * 118 + 24) % (width + 80) - 30;
        const towerH = 48 + (i % 3) * 22;
        ctx.fillStyle = 'rgba(7, 19, 34, 0.9)';
        ctx.fillRect(towerX, benchY - towerH, 34, towerH);
        ctx.fillStyle = i % 2 ? 'rgba(71,242,255,0.45)' : 'rgba(99,255,95,0.42)';
        ctx.fillRect(towerX + 7, benchY - towerH + 10, 20, 8);
        ctx.fillRect(towerX + 7, benchY - towerH + 26, 20, 5);
    }

    ctx.strokeStyle = 'rgba(255,178,56,0.26)';
    ctx.lineWidth = 5;
    for (let i = 0; i < 4; i++) {
        const x = (i * 140 + time * 8) % (width + 160) - 80;
        ctx.beginPath();
        ctx.moveTo(x, height);
        ctx.quadraticCurveTo(x + 35, benchY + 36, x + 88, benchY + 18);
        ctx.stroke();
    }
    ctx.restore();
}

function drawCharacter(dt) {
    const width = canvas.width / dpr;
    const height = canvas.height / dpr;
    const cx = width / 2;
    const cy = height * 0.54;

    const breathe = Math.sin(time * 2.2) * 5;
    const sway = Math.sin(time * 1.4) * 2.5;
    const scale = Math.min(width, height) / 400;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    const skinShade = gameConfig.skinTone;
    const warmShadow = 'rgba(82, 25, 78, 0.16)';
    const hairShade = gameConfig.hairColor;

    ctx.fillStyle = 'rgba(43, 14, 66, 0.16)';
    ctx.beginPath();
    ctx.ellipse(0, 165, 74, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(sway, breathe);

    ctx.strokeStyle = 'rgba(99,255,95,0.46)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(0, 28, 112, 58, Math.sin(time * 0.7) * 0.12, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(71, 242, 255, 0.08)';
    ctx.beginPath();
    ctx.arc(0, 30, 112, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = skinShade;
    ctx.fillRect(-20, 90, 15, 54);
    ctx.fillRect(5, 90, 15, 54);

    ctx.save();
    ctx.translate(-39, 36);
    ctx.rotate(Math.sin(time * 3) * 0.12 - 0.08);
    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.roundRect(-11, 0, 22, 62, 10);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(39, 36);
    ctx.rotate(-Math.sin(time * 3) * 0.12 + 0.08);
    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.roundRect(-11, 0, 22, 62, 10);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.roundRect(-31, 20, 62, 78, 16);
    ctx.fill();

    if (!charState.hasShorts) {
        ctx.fillStyle = '#fff8ff';
        ctx.beginPath();
        ctx.moveTo(-31, 78);
        ctx.lineTo(-31, 88);
        ctx.lineTo(0, 98);
        ctx.lineTo(31, 88);
        ctx.lineTo(31, 78);
        ctx.closePath();
        ctx.fill();
    }

    if (!charState.hasShirt) {
        ctx.fillStyle = '#fff8ff';
        ctx.beginPath();
        ctx.roundRect(-31, 34, 62, 22, 8);
        ctx.fill();
    }

    if (charState.hasShorts) {
        ctx.fillStyle = charState.shortsColor;
        ctx.beginPath();
        ctx.roundRect(-35, 73, 70, 38, 12);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-28, 79, 56, 6);
        ctx.fillStyle = warmShadow;
        ctx.fillRect(-35, 102, 70, 6);
    }

    if (charState.hasShirt) {
        ctx.fillStyle = charState.shirtColor;
        ctx.beginPath();
        ctx.roundRect(-36, 18, 72, 60, 15);
        ctx.fill();

        ctx.fillStyle = charState.shirtColor;
        ctx.beginPath();
        ctx.ellipse(-43, 31, 13, 13, 0, 0, Math.PI * 2);
        ctx.ellipse(43, 31, 13, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.roundRect(-20, 24, 40, 8, 4);
        ctx.fill();

        ctx.fillStyle = '#f3fff3';
        ctx.beginPath();
        ctx.arc(0, 20, 14, 0, Math.PI, false);
        ctx.fill();

        ctx.strokeStyle = 'rgba(99,255,95,0.76)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 47, 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(71,242,255,0.55)';
        ctx.fillRect(-4, 43, 8, 8);

        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 35);
        ctx.lineTo(0, 76);
        ctx.stroke();
    }

    if (charState.hasShoes) {
        ctx.fillStyle = charState.shoeColor;
        ctx.beginPath();
        ctx.ellipse(-12, 146, 15, 9, -0.1, 0, Math.PI * 2);
        ctx.ellipse(12, 146, 15, 9, 0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.ellipse(-12, 143, 9, 3, -0.1, 0, Math.PI * 2);
        ctx.ellipse(12, 143, 9, 3, 0.1, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.fillStyle = skinShade;
        ctx.beginPath();
        ctx.ellipse(-12, 144, 11, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(12, 144, 11, 6, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = hairShade;
    ctx.beginPath();
    ctx.roundRect(-56, -70, 112, 128, 24);
    ctx.fill();

    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.arc(0, -12, 47, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillRect(-11, 28, 22, 12);

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(-14, -28, 10, 0, Math.PI * 2);
    ctx.fill();

    charState.blinkTimer -= dt;
    if (charState.blinkTimer < 0) {
        charState.eyeState = 'blink';
        if (charState.blinkTimer < -0.15) {
            charState.eyeState = 'open';
            charState.blinkTimer = Math.random() * 3 + 2;
        }
    }

    ctx.fillStyle = '#362241';
    if (charState.eyeState === 'open') {
        ctx.beginPath();
        ctx.ellipse(-18, -12, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(18, -12, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-20, -16, 3, 0, Math.PI * 2);
        ctx.arc(16, -16, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7fd6ff';
        ctx.beginPath();
        ctx.arc(-18, -10, 3.2, 0, Math.PI * 2);
        ctx.arc(18, -10, 3.2, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.strokeStyle = '#362241';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-26, -12); ctx.lineTo(-10, -12);
        ctx.moveTo(10, -12); ctx.lineTo(26, -12);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255, 130, 167, 0.35)';
    ctx.beginPath();
    ctx.ellipse(-25, 6, 7, 4.2, 0, 0, Math.PI * 2);
    ctx.ellipse(25, 6, 7, 4.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#5d2d61';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 9, 6, 0, Math.PI, false);
    ctx.stroke();

    ctx.strokeStyle = '#4d2556';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-28, -34);
    ctx.quadraticCurveTo(-18, -38, -8, -34);
    ctx.moveTo(8, -34);
    ctx.quadraticCurveTo(18, -38, 28, -34);
    ctx.stroke();

    ctx.fillStyle = hairShade;
    ctx.beginPath();
    ctx.moveTo(-48, -24);
    ctx.quadraticCurveTo(-28, -62, 0, -30);
    ctx.quadraticCurveTo(28, -62, 48, -24);
    ctx.quadraticCurveTo(52, 4, 44, -18);
    ctx.lineTo(44, -54);
    ctx.quadraticCurveTo(0, -82, -44, -54);
    ctx.lineTo(-44, -18);
    ctx.quadraticCurveTo(-52, 4, -48, -24);
    ctx.fill();

    ctx.fillStyle = '#baff39';
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-56 + i * 56, -78 + Math.sin(time * 2 + i) * 2, 3.5, 0, Math.PI * 2);
        ctx.fill();
    }

    if (charState.hasAcc) {
        ctx.strokeStyle = '#06101f';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.roundRect(-39, -29, 28, 24, 10);
        ctx.roundRect(11, -29, 28, 24, 10);
        ctx.moveTo(-11, -17);
        ctx.lineTo(11, -17);
        ctx.stroke();

        ctx.strokeStyle = charState.accColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(-39, -29, 28, 24, 10);
        ctx.roundRect(11, -29, 28, 24, 10);
        ctx.moveTo(-11, -17);
        ctx.lineTo(11, -17);
        ctx.stroke();

        ctx.fillStyle = 'rgba(71,242,255,0.22)';
        ctx.beginPath();
        ctx.roundRect(-35, -25, 20, 16, 7);
        ctx.roundRect(15, -25, 20, 16, 7);
        ctx.fill();

        ctx.strokeStyle = 'rgba(99,255,95,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-48, -18);
        ctx.quadraticCurveTo(-66, -28, -72, -46);
        ctx.moveTo(48, -18);
        ctx.quadraticCurveTo(66, -28, 72, -46);
        ctx.stroke();
    }

    ctx.restore();
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    time += dt;

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawCharacter(dt);

    particles.forEach(p => p.draw(ctx));

    requestAnimationFrame(loop);
}

// --- 5. Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.pauseBgm();
        } else if (gameState === 'PLAY') {
            audio.playBgm();
        }
    });
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const defs = JSON.parse(cfgEl.textContent);
            window.gameConfigDefs = defs;
            for (const k in defs) {
                gameConfig[k] = defs[k].value;
            }
        }
    } catch (e) {
        console.error('Config parse error', e);
    }

    window.updateGameConfig = (key, val) => {
        if (gameConfig.hasOwnProperty(key)) {
            gameConfig[key] = val;
            if (key === 'themeColor') {
                document.querySelectorAll('.btn-toggle').forEach(b => {
                    b.style.borderColor = val;
                    if (b.classList.contains('active')) b.style.backgroundColor = val;
                });
            }
        }
    };

    initGame();
});
