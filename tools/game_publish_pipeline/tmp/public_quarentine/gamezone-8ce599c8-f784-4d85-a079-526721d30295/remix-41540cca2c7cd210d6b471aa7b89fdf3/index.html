<html lang="en">

<meta charset="UTF-8">

<title>Wizard Wardrobe: House Robe Shuffle</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
    :root {
        --bg-top: #081326;
        --bg-mid: #182b59;
        --bg-bottom: #6f4f1f;
        --panel: rgba(251, 238, 198, 0.86);
        --panel-border: rgba(239, 196, 84, 0.82);
        --ink: #2b1a0b;
        --ink-soft: #5b4322;
        --accent: #d9a441;
        --accent-dark: #7b4f16;
        --accent-bright: #f7dc82;
        --cool: #7dc8ff;
        --white: #fff8df;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 255, 255, 0.2), transparent 32%),
            linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    body {
        position: relative;
        color: var(--white);
    }

    .font-display {
        font-family: 'Cinzel', 'Bangers', cursive;
    }

    .font-ui {
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    canvas {
        display: block;
        touch-action: none;
        width: 100%;
        height: 100%;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: auto;
        pointer-events: none;
        z-index: 0;
        border-radius: 999px;
        filter: blur(12px);
        opacity: 0.7;
    }

    #game-container::before {
        width: 32vw;
        height: 32vw;
        min-width: 180px;
        min-height: 180px;
        left: -8vw;
        top: 10%;
        background: rgba(255, 209, 102, 0.22);
        animation: drift 12s ease-in-out infinite;
    }

    #game-container::after {
        width: 36vw;
        height: 36vw;
        min-width: 210px;
        min-height: 210px;
        right: -10vw;
        bottom: 18%;
        background: rgba(116, 201, 255, 0.22);
        animation: drift 14s ease-in-out infinite reverse;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
    }

    .hidden {
        display: none !important;
    }

    .interactive {
        pointer-events: auto;
    }

    .glass-panel {
        background:
            linear-gradient(90deg, rgba(123, 79, 22, 0.16), transparent 8%, transparent 92%, rgba(123, 79, 22, 0.16)),
            repeating-linear-gradient(135deg, rgba(43, 26, 11, 0.035) 0 2px, transparent 2px 9px),
            linear-gradient(180deg, rgba(255, 247, 218, 0.94), rgba(225, 197, 123, 0.86));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 2px solid var(--panel-border);
        box-shadow:
            0 18px 38px rgba(6, 12, 35, 0.34),
            inset 0 1px 0 rgba(255, 255, 255, 0.65),
            inset 0 0 0 1px rgba(43, 26, 11, 0.08);
        border-radius: 24px;
    }

    .btn-toggle {
        position: relative;
        background: linear-gradient(180deg, #fff8df, #e9d39a);
        border: 3px solid var(--accent);
        color: var(--accent-dark);
        border-radius: 16px;
        font-weight: 700;
        font-family: 'Rajdhani', system-ui, sans-serif;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.18s ease, color 0.18s ease;
        box-shadow: 0 5px 0 var(--accent-dark);
        cursor: pointer;
        overflow: hidden;
    }

    .btn-toggle::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 10%, rgba(255,255,255,0.55) 45%, transparent 75%);
        transform: translateX(-130%);
        transition: transform 0.35s ease;
        pointer-events: none;
    }

    .btn-toggle:hover::after,
    .btn-toggle:focus-visible::after {
        transform: translateX(130%);
    }

    .btn-toggle:active {
        transform: translateY(5px);
        box-shadow: 0 0 0 var(--accent-dark);
    }

    .btn-toggle.active {
        background:
            radial-gradient(circle at 22% 18%, rgba(255, 248, 223, 0.44), transparent 28%),
            linear-gradient(180deg, var(--accent), #8f6420);
        color: white;
        border-color: var(--accent-dark);
        box-shadow:
            0 5px 0 var(--accent-dark),
            0 0 16px rgba(247, 220, 130, 0.28);
    }

    .btn-toggle.active:active {
        box-shadow: 0 0 0 var(--accent-dark);
    }

    #start-screen {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 50% 35%, rgba(247, 220, 130, 0.48), rgba(125, 200, 255, 0.12) 28%, transparent 58%),
            linear-gradient(180deg, rgba(5, 12, 31, 0.52), rgba(67, 38, 13, 0.22));
        backdrop-filter: blur(6px);
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
    }

    #start-screen > * {
        position: relative;
        z-index: 1;
    }

    #start-screen::before {
        content: "✦ 🪄 ✦";
        font-size: clamp(24px, 7vw, 48px);
        margin-bottom: 10px;
        filter: drop-shadow(0 6px 12px rgba(70, 18, 98, 0.25));
        animation: pulse 1.9s ease-in-out infinite;
        position: relative;
        z-index: 1;
    }

    #start-screen::after {
        content: "";
        position: absolute;
        width: min(76vw, 420px);
        height: min(76vw, 420px);
        border-radius: 50%;
        border: 1px solid rgba(247, 220, 130, 0.34);
        background:
            radial-gradient(circle, transparent 58%, rgba(247, 220, 130, 0.14) 59%, transparent 61%),
            conic-gradient(from 0deg, transparent, rgba(247, 220, 130, 0.18), transparent 18%, transparent 34%, rgba(125, 200, 255, 0.16), transparent 48%, transparent);
        box-shadow:
            inset 0 0 32px rgba(247, 220, 130, 0.12),
            0 0 42px rgba(125, 200, 255, 0.12);
        pointer-events: none;
        z-index: 0;
        animation: sigilSpin 26s linear infinite;
    }

    #ui-title {
        margin: 0;
        font-family: 'Cinzel', 'Bangers', cursive;
        font-size: clamp(34px, 7vw, 72px);
        line-height: 0.95;
        letter-spacing: 0.04em;
        color: #fff8df;
        -webkit-text-stroke: 2px #2b1a0b;
        text-shadow:
            0 3px 0 var(--accent-dark),
            0 0 24px rgba(247, 220, 130, 0.48);
        animation: float 3s ease-in-out infinite;
    }

    #ui-subtitle {
        max-width: 28rem;
        margin: 14px 0 0;
        font-size: clamp(18px, 3.8vw, 28px);
        font-weight: 700;
        color: #fff8df;
        text-shadow: 0 3px 10px rgba(55, 16, 87, 0.3);
    }

    #ui-cta {
        font-size: clamp(19px, 4vw, 28px);
        font-weight: 600;
        color: var(--accent-bright);
        margin: 16px 0 0;
        padding: 10px 18px;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.55);
        background: rgba(10, 20, 48, 0.42);
        box-shadow: 0 10px 24px rgba(38, 8, 59, 0.18);
        animation: pulse 1.5s ease-in-out infinite;
    }

    #game-ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    #feedback-hud {
        position: absolute;
        top: 14px;
        right: 14px;
        width: min(30vw, 120px);
        display: flex;
        flex-direction: column;
        align-items: end;
        gap: 8px;
        pointer-events: none;
        z-index: 60;
    }

    .feedback-badge {
        min-width: 96px;
        max-width: 120px;
        padding: 8px 10px;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.55);
        background: rgba(13, 23, 55, 0.78);
        color: #fff8df;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        box-shadow: 0 10px 22px rgba(31, 7, 49, 0.2);
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
        transition: opacity 0.22s ease, transform 0.22s ease;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .feedback-badge.show {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .feedback-gif {
        width: 100%;
        max-width: 116px;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.6);
        background: rgba(255,255,255,0.18);
        box-shadow: 0 12px 24px rgba(31, 7, 49, 0.18);
        object-fit: cover;
        aspect-ratio: 1 / 1;
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .feedback-gif.show {
        opacity: 0.96;
        transform: scale(1);
    }

    #controls-panel {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 24px;
        max-width: 500px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }

    .panel-label {
        color: var(--ink);
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .random-button {
        padding: 6px 16px;
        font-size: 0.95rem;
        background: linear-gradient(180deg, #7dc8ff, #3264b8);
        border-color: #183b7a;
        color: white;
        box-shadow: 0 5px 0 #142c5b;
        white-space: nowrap;
    }

    .random-button:active {
        box-shadow: 0 0 0 #142c5b;
    }

    .button-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
    }

    .button-grid + .button-grid {
        margin-top: 8px;
    }

    .button-large {
        padding: 12px;
        font-size: 1.1rem;
    }

    .button-small {
        padding: 10px;
        font-size: 0.95rem;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes drift {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, -18px, 0); }
    }

    @keyframes sigilSpin {
        to { transform: rotate(1turn); }
    }

    @media (max-width: 520px) {
        .panel-header {
            flex-direction: column;
            align-items: stretch;
        }

        .random-button {
            width: 100%;
        }

        #controls-panel {
            bottom: 18px;
            left: 12px;
            right: 12px;
            padding: 14px;
            gap: 10px;
        }

        .button-grid {
            gap: 12px;
        }

        .button-large,
        .button-small {
            font-size: 0.92rem;
        }

        .panel-label {
            font-size: 1.1rem;
        }

        #ui-title {
            -webkit-text-stroke: 1px #2b1a0b;
        }

        #ui-subtitle {
            font-size: 1rem;
            max-width: 20rem;
        }

        #ui-cta {
            font-size: 1.05rem;
        }
    }
</style>

<body>

<div id="game-container">

    <div id="ui-layer">

            <h1 id="ui-title" class="font-display"><span>WIZARD WARDROBE</span></h1>
            <p id="ui-subtitle" class="font-ui"><span>Tap each wardrobe charm to ready your robe, trousers, boots, and wand.</span></p>
            <p id="ui-cta" class="font-display"><span>Tap to Open the Spell Board</span></p>
            <!-- [agent-note][world-design-superprompt] role: visuals | intent: castle-school fitting room, floating candles, banners, readable spell-board controls -->
        </div>

        <div id="game-ui" class="hidden">
            <!-- [agent-note][stage3] resolved-gif: quick-mix reward + blocked styling feedback -> catalogs/gifs.json -->
            <div id="feedback-hud" aria-live="polite">
                <div id="feedback-text" class="feedback-badge font-display">SPELL!</div>
                <img id="feedback-gif" class="feedback-gif" alt="Spell-board reaction" />
            </div>
            <div id="controls-panel" class="glass-panel interactive">
                <div class="panel-header">
                    <span class="panel-label font-display">SPELL BOARD</span>
                    <button id="btn-gacha" class="btn-toggle random-button font-display">
                        🪄 CAST MIX
                    </button>
                </div>

                <div class="button-grid">
                    <button id="btn-top" class="btn-toggle button-large active font-ui">ROBE: ON</button>
                    <button id="btn-bottom" class="btn-toggle button-large active font-ui">TROUSERS: ON</button>
                </div>

                <div class="button-grid">
                    <button id="btn-shoes" class="btn-toggle button-small active font-ui">BOOTS: ON</button>
                    <button id="btn-acc" class="btn-toggle button-small active font-ui">WAND: ON</button>
                </div>
            </div>
        </div>

<script>
/**
 * Wizard Wardrobe: House Robe Shuffle
 * A single-file HTML5 wizard-school dress-up toy.
 */

// --- 1. System & Config ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = window.devicePixelRatio || 1;

// Config state
const gameConfig = {
    themeColor: "#D9A441",
    skinTone: "#FFE0D0",
    hairColor: "#8B4513"
};

// Runtime state
let gameState = 'START'; // START, PLAY
let time = 0;
let lastTime = 0;

// Character State
const charState = {
    hasShirt: true,
    hasShorts: true,
    hasShoes: true,
    hasAcc: true,
    shirtColor: '#263f87',
    shortsColor: '#5a2d22',
    shoeColor: '#24160c',
    accColor: '#f2c94c',
    eyeState: 'open', // open, blink
    blinkTimer: 0,
    bouncePhase: 0
};

// Particles
const particles = [];

// Feedback media
const FEEDBACK_GIFS = {
    reward: 'https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp',
    blocked: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
};
const feedbackEl = document.getElementById('feedback-text');
const feedbackGifEl = document.getElementById('feedback-gif');
let feedbackTimer = 0;
let feedbackGifTimer = 0;

// --- 2. Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.buffers = {};
        this.lastPlay = {};
        this.sfxConfig = {
            start: { url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_npc_01.mp3', volume: 0.48, debounce: 180 },
            toggleOn: { url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3', volume: 0.42, debounce: 90 },
            toggleOff: { url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_wind_01.mp3', volume: 0.28, debounce: 90 },
            randomize: { url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_02.mp3', volume: 0.46, debounce: 180 },
            click: { url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_character_01.mp3', volume: 0.3, debounce: 90 }
        };
        this.bgmEl = document.getElementById('bgm_main');
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        Object.entries(this.sfxConfig).forEach(([id, config]) => this.loadBuffer(id, config.url));

        const unlock = () => {
            if (!this.ctx || this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
            }).catch(() => {});
        };

        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock, { passive: true }));
    }

    async loadBuffer(id, url) {
        this.buffers[id] = null;
    }

    playHtmlSfx(id, volume) {
        const config = this.sfxConfig[id];
        if (!config?.url) return;

        const sfx = new Audio(config.url);
        sfx.preload = 'auto';
        sfx.volume = Math.min(volume, 1);
        sfx.play().catch(() => {});
    }

    playBgm() {
        if (!this.unlocked || !this.bgmEl) return;
        this.bgmEl.volume = 0.2;
        this.bgmEl.play().catch(() => {});
    }

    pauseBgm() {
        if (this.bgmEl) this.bgmEl.pause();
    }

    playSfx(id) {
        if (!this.unlocked || !this.ctx) return;
        const config = this.sfxConfig[id];
        const now = performance.now();

        if (config?.debounce && this.lastPlay[id] && now - this.lastPlay[id] < config.debounce) {
            return;
        }
        this.lastPlay[id] = now;

        if (this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = this.buffers[id];
            gain.gain.value = config?.volume ?? 0.35;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else if (config?.url) {
            this.playHtmlSfx(id, config?.volume ?? 0.25);
        } else {
            this.synthPop(config?.volume ?? 0.25);
        }
    }

    synthPop(volume = 0.25) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    }
}
const audio = new AudioManager();

// --- 3. Input & Logic ---

function initGame() {
    resize();
    window.addEventListener('resize', resize);

    document.getElementById('btn-top').addEventListener('pointerdown', (e) => toggleItem('shirt', e));
    document.getElementById('btn-bottom').addEventListener('pointerdown', (e) => toggleItem('shorts', e));
    document.getElementById('btn-shoes').addEventListener('pointerdown', (e) => toggleItem('shoes', e));
    document.getElementById('btn-acc').addEventListener('pointerdown', (e) => toggleItem('acc', e));
    document.getElementById('btn-gacha').addEventListener('pointerdown', (e) => gachaRandom(e));

    const startHandler = (e) => {
        if (gameState === 'START') {
            audio.init();
            startGame();
        }
    };

    window.addEventListener('pointerdown', (e) => {
        if (gameState === 'START') startHandler(e);
    });

    window.addEventListener('keydown', (e) => {
        if (gameState === 'START') startHandler(e);
    });

    requestAnimationFrame(loop);
}

function showFeedback(message, gifKey, duration = 1400) {
    if (!feedbackEl || !feedbackGifEl) return;
    feedbackEl.textContent = message;
    feedbackEl.classList.add('show');
    window.clearTimeout(feedbackTimer);
    feedbackTimer = window.setTimeout(() => feedbackEl.classList.remove('show'), duration);

    const gifSrc = FEEDBACK_GIFS[gifKey];
    if (gifSrc) {
        feedbackGifEl.src = gifSrc;
        feedbackGifEl.classList.add('show');
        window.clearTimeout(feedbackGifTimer);
        feedbackGifTimer = window.setTimeout(() => feedbackGifEl.classList.remove('show'), Math.min(duration + 500, 2200));
    }
}

function startGame() {
    gameState = 'PLAY';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    audio.playSfx('start');
    showFeedback('CHARM READY!', 'reward', 1800);
    spawnParticles(canvas.width / 2, canvas.height / 2, 20, '#F7DC82');
}

function toggleItem(item, e) {
    e.stopPropagation();

    const map = {
        'shirt': { prop: 'hasShirt', btn: 'btn-top', label: 'ROBE' },
        'shorts': { prop: 'hasShorts', btn: 'btn-bottom', label: 'TROUSERS' },
        'shoes': { prop: 'hasShoes', btn: 'btn-shoes', label: 'BOOTS' },
        'acc': { prop: 'hasAcc', btn: 'btn-acc', label: 'WAND' }
    };

    const target = map[item];
    charState[target.prop] = !charState[target.prop];

    const btn = document.getElementById(target.btn);
    if (charState[target.prop]) {
        audio.playSfx('toggleOn');
        btn.classList.add('active');
        btn.innerText = `${target.label}: ON`;
        showFeedback(`${target.label} READY`, 'reward');
        spawnParticles(canvas.width / 2, canvas.height / 2, 10, '#F7DC82');
    } else {
        audio.playSfx('toggleOff');
        btn.classList.remove('active');
        btn.innerText = `${target.label}: OFF`;
        showFeedback(`${target.label} OFF`, 'blocked', 1200);
        spawnParticles(canvas.width / 2, canvas.height / 2, 5, '#8C8F99');
    }
}

function gachaRandom(e) {
    e.stopPropagation();
    audio.playSfx('randomize');

    const randColor = () => `hsl(${Math.random() * 360}, 70%, 70%)`;
    charState.shirtColor = randColor();
    charState.shortsColor = randColor();
    charState.accColor = randColor();
    charState.shoeColor = `hsl(${Math.random() * 360}, 20%, 30%)`;

    if (Math.random() > 0.8) toggleItem('shirt', { stopPropagation: () => {} });
    charState.hasShirt = true;
    charState.hasShorts = true;
    charState.hasShoes = true;
    charState.hasAcc = true;

    ['btn-top', 'btn-bottom', 'btn-shoes', 'btn-acc'].forEach(id => {
        document.getElementById(id).classList.add('active');
        const label = id === 'btn-top' ? 'ROBE' : id === 'btn-bottom' ? 'TROUSERS' : id === 'btn-shoes' ? 'BOOTS' : 'WAND';
        document.getElementById(id).innerText = `${label}: ON`;
    });

    showFeedback('SHUFFLE CHARM!', 'reward', 1800);
    spawnParticles(canvas.width / 2, canvas.height / 2, 30, '#F7DC82');
}

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// --- 4. Rendering ---

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 8 + 4;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2;
        this.life -= dt * 1.5;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const r = this.size * this.life;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(time * 3 + this.x * 0.01);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        drawStarPath(ctx, 0, 0, Math.max(3, r), Math.max(1.5, r * 0.42), 5);
        ctx.fill();
        ctx.restore();
    }
}

function drawStarPath(ctx, x, y, outer, inner, points = 5) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / points;
        const radius = i % 2 === 0 ? outer : inner;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
}

function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function drawBackground() {
    const width = canvas.width / dpr;
    const height = canvas.height / dpr;
    const speed = 24;
    const offset = (time * speed) % 160;
    const playStateGlow = gameState === 'PLAY' ? 1 : 0.72;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    skyGrad.addColorStop(0, '#081326');
    skyGrad.addColorStop(0.5, '#182b59');
    skyGrad.addColorStop(1, '#6f4f1f');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    const glow = ctx.createRadialGradient(width * 0.5, height * 0.26, 24, width * 0.5, height * 0.26, width * 0.42);
    glow.addColorStop(0, 'rgba(255, 245, 196, 0.92)');
    glow.addColorStop(0.2, 'rgba(255, 220, 160, 0.46)');
    glow.addColorStop(1, 'rgba(255, 220, 160, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = 'rgba(125, 200, 255, 0.18)';
    ctx.lineWidth = 10;
    for (let i = 0; i < 3; i++) {
        const y = height * (0.22 + i * 0.09) + Math.sin(time * 0.7 + i) * 9;
        ctx.beginPath();
        ctx.moveTo(-40, y);
        ctx.bezierCurveTo(width * 0.24, y - 46, width * 0.42, y + 58, width + 40, y - 20);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(247, 220, 130, 0.11)';
    for (let i = -120; i < width + 180; i += 160) {
        ctx.beginPath();
        ctx.moveTo(i + offset, 0);
        ctx.lineTo(i + 90 + offset, 0);
        ctx.lineTo(i - 10 + offset + height * 0.55, height * 0.55);
        ctx.lineTo(i - 100 + offset + height * 0.55, height * 0.55);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(6, 12, 31, 0.58)';
    ctx.fillRect(0, height * 0.58, width, height * 0.24);
    for (let i = -30; i < width + 70; i += 92) {
        const towerH = 72 + (i % 3) * 10;
        ctx.beginPath();
        ctx.roundRect(i, height * 0.43 - towerH * 0.15, 54, towerH, 12);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(i - 6, height * 0.43 - towerH * 0.15);
        ctx.lineTo(i + 27, height * 0.33 - towerH * 0.15);
        ctx.lineTo(i + 60, height * 0.43 - towerH * 0.15);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(247, 220, 130, 0.42)';
        ctx.beginPath();
        ctx.roundRect(i + 19, height * 0.49, 16, 32, 8);
        ctx.fill();
        ctx.fillStyle = 'rgba(6, 12, 31, 0.58)';
    }

    ctx.fillStyle = 'rgba(217, 164, 65, 0.45)';
    for (let i = 36; i < width; i += 118) {
        const bannerY = height * 0.57 + Math.sin(time * 1.6 + i) * 3;
        ctx.beginPath();
        ctx.moveTo(i, bannerY);
        ctx.lineTo(i + 24, bannerY + 6);
        ctx.lineTo(i + 24, bannerY + 52);
        ctx.lineTo(i + 12, bannerY + 43);
        ctx.lineTo(i, bannerY + 52);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.48;
    for (let i = 0; i < 4; i++) {
        const x = ((i * 137 - time * 14) % (width + 180)) - 90;
        const y = height * 0.34 + Math.sin(time * 0.8 + i) * 16;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(time + i) * 0.08);
        ctx.fillStyle = i % 2 ? 'rgba(251, 238, 198, 0.52)' : 'rgba(217, 164, 65, 0.4)';
        ctx.beginPath();
        ctx.roundRect(-18, -11, 36, 22, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(43, 26, 11, 0.28)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(0, 10);
        ctx.stroke();
        ctx.restore();
    }

    for (let i = 0; i < 3; i++) {
        const x = (i * width / 3 + 70 + time * 9) % (width + 120) - 60;
        const y = height * 0.25 + Math.sin(time * 0.65 + i) * 18;
        ctx.fillStyle = 'rgba(6, 12, 31, 0.46)';
        ctx.beginPath();
        ctx.ellipse(x, y, 18, 7, 0, 0, Math.PI * 2);
        ctx.ellipse(x - 11, y, 13, 6, 0.35, 0, Math.PI * 2);
        ctx.ellipse(x + 11, y, 13, 6, -0.35, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.72 * playStateGlow;
    for (let i = 0; i < 10; i++) {
        const x = (i * 97 + time * 18) % (width + 120) - 60;
        const y = 46 + Math.sin(time * 0.9 + i) * 12 + (i % 5) * 31;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(247, 220, 130, 0.9)' : 'rgba(125, 200, 255, 0.82)';
        ctx.beginPath();
        ctx.moveTo(x, y - 7);
        ctx.lineTo(x + 3, y - 1);
        ctx.lineTo(x + 9, y);
        ctx.lineTo(x + 3, y + 3);
        ctx.lineTo(x, y + 9);
        ctx.lineTo(x - 3, y + 3);
        ctx.lineTo(x - 9, y);
        ctx.lineTo(x - 3, y - 1);
        ctx.closePath();
        ctx.fill();
    }

    for (let i = 0; i < 6; i++) {
        const x = 40 + i * (width / 6);
        const y = 92 + Math.sin(time * 1.4 + i) * 7;
        ctx.strokeStyle = 'rgba(247, 220, 130, 0.72)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y - 20);
        ctx.lineTo(x, y + 18);
        ctx.stroke();

        ctx.fillStyle = 'rgba(247, 220, 130, 0.9)';
        ctx.beginPath();
        ctx.ellipse(x, y - 24, 5, 9, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.beginPath();
    ctx.moveTo(0, height * 0.78);
    ctx.quadraticCurveTo(width * 0.18, height * 0.72, width * 0.33, height * 0.79);
    ctx.quadraticCurveTo(width * 0.52, height * 0.85, width * 0.7, height * 0.77);
    ctx.quadraticCurveTo(width * 0.87, height * 0.7, width, height * 0.79);
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.beginPath();
    ctx.moveTo(0, height * 0.86);
    ctx.quadraticCurveTo(width * 0.22, height * 0.81, width * 0.44, height * 0.88);
    ctx.quadraticCurveTo(width * 0.68, height * 0.95, width, height * 0.84);
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawCharacter(dt) {
    const width = canvas.width / dpr;
    const height = canvas.height / dpr;
    const cx = width / 2;
    const cy = height * 0.54;

    const breathe = Math.sin(time * 2.2) * 5;
    const sway = Math.sin(time * 1.4) * 2.5;
    const scale = Math.min(width, height) / 400;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    const skinShade = gameConfig.skinTone;
    const warmShadow = 'rgba(82, 25, 78, 0.16)';
    const hairShade = gameConfig.hairColor;

    ctx.fillStyle = 'rgba(43, 14, 66, 0.16)';
    ctx.beginPath();
    ctx.ellipse(0, 165, 74, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(sway, breathe);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.beginPath();
    ctx.arc(0, 30, 112, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = skinShade;
    ctx.fillRect(-20, 90, 15, 54);
    ctx.fillRect(5, 90, 15, 54);

    ctx.save();
    ctx.translate(-39, 36);
    ctx.rotate(Math.sin(time * 3) * 0.12 - 0.08);
    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.roundRect(-11, 0, 22, 62, 10);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(39, 36);
    ctx.rotate(-Math.sin(time * 3) * 0.12 + 0.08);
    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.roundRect(-11, 0, 22, 62, 10);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.roundRect(-31, 20, 62, 78, 16);
    ctx.fill();

    if (!charState.hasShorts) {
        ctx.fillStyle = '#fff8ff';
        ctx.beginPath();
        ctx.moveTo(-31, 78);
        ctx.lineTo(-31, 88);
        ctx.lineTo(0, 98);
        ctx.lineTo(31, 88);
        ctx.lineTo(31, 78);
        ctx.closePath();
        ctx.fill();
    }

    if (!charState.hasShirt) {
        ctx.fillStyle = '#fff8ff';
        ctx.beginPath();
        ctx.roundRect(-31, 34, 62, 22, 8);
        ctx.fill();
    }

    if (charState.hasShorts) {
        ctx.fillStyle = charState.shortsColor;
        ctx.beginPath();
        ctx.roundRect(-35, 73, 70, 38, 12);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-28, 79, 56, 6);
        ctx.fillStyle = warmShadow;
        ctx.fillRect(-35, 102, 70, 6);
    }

    if (charState.hasShirt) {
        ctx.fillStyle = charState.shirtColor;
        ctx.beginPath();
        ctx.roundRect(-40, 16, 80, 72, 12);
        ctx.fill();

        ctx.fillStyle = charState.shirtColor;
        ctx.beginPath();
        ctx.ellipse(-45, 31, 13, 13, 0, 0, Math.PI * 2);
        ctx.ellipse(45, 31, 13, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(12, 18, 48, 0.24)';
        ctx.beginPath();
        ctx.moveTo(-35, 85);
        ctx.lineTo(0, 110);
        ctx.lineTo(35, 85);
        ctx.lineTo(28, 58);
        ctx.lineTo(-28, 58);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.roundRect(-20, 24, 40, 8, 4);
        ctx.fill();

        ctx.fillStyle = '#fffdfd';
        ctx.beginPath();
        ctx.arc(0, 20, 14, 0, Math.PI, false);
        ctx.fill();

        ctx.strokeStyle = 'rgba(247,220,130,0.75)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 35);
        ctx.lineTo(0, 94);
        ctx.moveTo(-27, 56);
        ctx.lineTo(27, 56);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(251, 238, 198, 0.62)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-31, 28);
        ctx.quadraticCurveTo(-22, 50, -24, 86);
        ctx.moveTo(31, 28);
        ctx.quadraticCurveTo(22, 50, 24, 86);
        ctx.stroke();
    }

    if (charState.hasShoes) {
        ctx.fillStyle = charState.shoeColor;
        ctx.beginPath();
        ctx.ellipse(-12, 146, 15, 9, -0.1, 0, Math.PI * 2);
        ctx.ellipse(12, 146, 15, 9, 0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.ellipse(-12, 143, 9, 3, -0.1, 0, Math.PI * 2);
        ctx.ellipse(12, 143, 9, 3, 0.1, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.fillStyle = skinShade;
        ctx.beginPath();
        ctx.ellipse(-12, 144, 11, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(12, 144, 11, 6, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = hairShade;
    ctx.beginPath();
    ctx.roundRect(-56, -70, 112, 128, 24);
    ctx.fill();

    ctx.fillStyle = skinShade;
    ctx.beginPath();
    ctx.arc(0, -12, 47, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillRect(-11, 28, 22, 12);

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(-14, -28, 10, 0, Math.PI * 2);
    ctx.fill();

    charState.blinkTimer -= dt;
    if (charState.blinkTimer < 0) {
        charState.eyeState = 'blink';
        if (charState.blinkTimer < -0.15) {
            charState.eyeState = 'open';
            charState.blinkTimer = Math.random() * 3 + 2;
        }
    }

    ctx.fillStyle = '#362241';
    if (charState.eyeState === 'open') {
        ctx.beginPath();
        ctx.ellipse(-18, -12, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(18, -12, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-20, -16, 3, 0, Math.PI * 2);
        ctx.arc(16, -16, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7fd6ff';
        ctx.beginPath();
        ctx.arc(-18, -10, 3.2, 0, Math.PI * 2);
        ctx.arc(18, -10, 3.2, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.strokeStyle = '#362241';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-26, -12); ctx.lineTo(-10, -12);
        ctx.moveTo(10, -12); ctx.lineTo(26, -12);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255, 130, 167, 0.35)';
    ctx.beginPath();
    ctx.ellipse(-25, 6, 7, 4.2, 0, 0, Math.PI * 2);
    ctx.ellipse(25, 6, 7, 4.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#5d2d61';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 9, 6, 0, Math.PI, false);
    ctx.stroke();

    ctx.strokeStyle = '#4d2556';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-28, -34);
    ctx.quadraticCurveTo(-18, -38, -8, -34);
    ctx.moveTo(8, -34);
    ctx.quadraticCurveTo(18, -38, 28, -34);
    ctx.stroke();

    ctx.fillStyle = hairShade;
    ctx.beginPath();
    ctx.moveTo(-48, -24);
    ctx.quadraticCurveTo(-28, -62, 0, -30);
    ctx.quadraticCurveTo(28, -62, 48, -24);
    ctx.quadraticCurveTo(52, 4, 44, -18);
    ctx.lineTo(44, -54);
    ctx.quadraticCurveTo(0, -82, -44, -54);
    ctx.lineTo(-44, -18);
    ctx.quadraticCurveTo(-52, 4, -48, -24);
    ctx.fill();

    ctx.fillStyle = charState.hasShirt ? charState.shirtColor : 'rgba(217, 164, 65, 0.72)';
    ctx.beginPath();
    ctx.moveTo(-25, 32);
    ctx.lineTo(0, 48);
    ctx.lineTo(25, 32);
    ctx.lineTo(19, 47);
    ctx.lineTo(0, 59);
    ctx.lineTo(-19, 47);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(247,220,130,0.82)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-22, 35);
    ctx.lineTo(0, 50);
    ctx.lineTo(22, 35);
    ctx.stroke();

    ctx.fillStyle = '#ffd166';
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-56 + i * 56, -78 + Math.sin(time * 2 + i) * 2, 3.5, 0, Math.PI * 2);
        ctx.fill();
    }

    if (charState.hasAcc) {
        ctx.fillStyle = charState.accColor;
        ctx.beginPath();
        ctx.moveTo(-34, -58);
        ctx.quadraticCurveTo(0, -76, 34, -58);
        ctx.lineTo(22, -48);
        ctx.quadraticCurveTo(0, -56, -22, -48);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-17, -63);
        ctx.lineTo(0, -116);
        ctx.lineTo(19, -63);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(43, 26, 11, 0.65)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-14, -76);
        ctx.quadraticCurveTo(2, -69, 15, -79);
        ctx.stroke();

        ctx.strokeStyle = '#8b5a22';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(45, -10);
        ctx.lineTo(82, -44);
        ctx.stroke();

        ctx.fillStyle = '#f7dc82';
        ctx.beginPath();
        ctx.arc(84, -46, 5 + Math.sin(time * 6) * 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(247, 220, 130, 0.8)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            const a = time * 2 + i * Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(84 + Math.cos(a) * 9, -46 + Math.sin(a) * 9);
            ctx.lineTo(84 + Math.cos(a) * 16, -46 + Math.sin(a) * 16);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    time += dt;

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawCharacter(dt);

    particles.forEach(p => p.draw(ctx));

    requestAnimationFrame(loop);
}

// --- 5. Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.pauseBgm();
        } else if (gameState === 'PLAY') {
            audio.playBgm();
        }
    });
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const defs = JSON.parse(cfgEl.textContent);
            window.gameConfigDefs = defs;
            for (const k in defs) {
                gameConfig[k] = defs[k].value;
            }
        }
    } catch (e) {
        console.error('Config parse error', e);
    }

    window.updateGameConfig = (key, val) => {
        if (gameConfig.hasOwnProperty(key)) {
            gameConfig[key] = val;
            if (key === 'themeColor') {
                document.querySelectorAll('.btn-toggle').forEach(b => {
                    b.style.borderColor = val;
                    if (b.classList.contains('active')) b.style.backgroundColor = val;
                });
            }
        }
    };

    initGame();
});
