<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flappy Bird Remix</title>
    <script src="./assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --sky-top: #70c5ce;
        --sky-mid: #8be3ef;
        --sky-bottom: #dff9fb;
        --bird-yellow: #ffd93d;
        --wing-orange: #ff9f1c;
        --beak-orange: #ff7f11;
        --pipe-green: #43aa3f;
        --pipe-dark: #2f8f2f;
        --ui-shadow: #2d6a75;
        --sun: #ffe66d;
        --panel: rgba(255, 255, 255, 0.2);
      }

      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        font-family: 'Fredoka', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        background:
          radial-gradient(circle at 18% 16%, rgba(255, 244, 153, .5), transparent 18rem),
          linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -10%;
        pointer-events: none;
        z-index: 0;
      }

      body::before {
        opacity: .26;
        background:
          repeating-linear-gradient(90deg, transparent 0 54px, rgba(255,255,255,.32) 55px 57px, transparent 58px 112px),
          radial-gradient(circle at 78% 20%, rgba(255,255,255,.7) 0 7px, transparent 8px),
          radial-gradient(circle at 12% 70%, rgba(255,255,255,.55) 0 5px, transparent 6px);
        animation: skyDrift 18s linear infinite;
      }

      body::after {
        opacity: .35;
        background:
          radial-gradient(ellipse at 20% 88%, rgba(67, 170, 63, .3), transparent 34%),
          radial-gradient(ellipse at 80% 90%, rgba(47, 143, 47, .24), transparent 32%);
      }

      @keyframes skyDrift {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(-56px, 20px, 0); }
      }

      .game-shell {
        position: relative;
        z-index: 1;
        width: min(100vw, 430px);
        height: min(100svh, 680px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }

      canvas {
        width: min(400px, calc(100vw - 20px));
        height: min(600px, calc(100svh - 24px));
        max-height: 600px;
        border: 4px solid rgba(255,255,255,.95);
        border-radius: 22px;
        box-shadow:
          0 22px 52px rgba(29, 106, 121, 0.32),
          inset 0 0 0 2px rgba(255,255,255,.2);
        background: transparent;
        display: block;
      }

      #ui {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: clamp(28px, 8vw, 42px);
        line-height: 1;
        font-weight: 600;
        text-shadow:
          0 3px 0 var(--ui-shadow),
          0 7px 14px rgba(0,0,0,.18);
        pointer-events: none;
        z-index: 4;
      }

      #ui::before {
        content: "SCORE";
        display: block;
        margin-bottom: 2px;
        font: 600 10px/1.1 system-ui, -apple-system, sans-serif;
        letter-spacing: .18em;
        text-shadow: 0 1px 0 var(--ui-shadow);
        opacity: .92;
      }

      #levelBadge {
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        right: clamp(18px, 7vw, 30px);
        padding: 6px 10px 7px;
        border: 1px solid rgba(255,255,255,.7);
        border-radius: 999px;
        color: #fff;
        background:
          radial-gradient(circle at 30% 0%, rgba(255,255,255,.42), transparent 58%),
          rgba(45, 106, 117, .28);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 18px rgba(35, 97, 109, .16);
        text-shadow: 0 2px 0 var(--ui-shadow);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .08em;
        pointer-events: none;
        z-index: 4;
      }

      #startScreen, #gameOverScreen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background:
          radial-gradient(circle at 50% 30%, rgba(255,255,255,.3), transparent 26rem),
          rgba(112,197,206,0.22);
        backdrop-filter: blur(3px);
        color: white;
        z-index: 10;
        padding: 24px;
        box-sizing: border-box;
      }

      .cloud-panel {
        position: relative;
        width: min(328px, calc(100vw - 56px));
        padding: 24px 22px 26px;
        border-radius: 34px;
        border: 2px solid rgba(255,255,255,.85);
        background:
          radial-gradient(circle at 18% 20%, rgba(255,255,255,.9), rgba(255,255,255,.28) 31%, transparent 32%),
          radial-gradient(circle at 84% 12%, rgba(255,255,255,.74), transparent 26%),
          linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.12));
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.62),
          0 18px 38px rgba(31, 119, 136, .28);
      }

      .cloud-panel::before,
      .cloud-panel::after {
        content: "";
        position: absolute;
        pointer-events: none;
        background: rgba(255,255,255,.52);
        filter: blur(.2px);
      }

      .cloud-panel::before {
        width: 54px;
        height: 28px;
        border-radius: 999px 999px 0 0;
        left: 26px;
        top: -18px;
      }

      .cloud-panel::after {
        width: 72px;
        height: 34px;
        border-radius: 999px 999px 0 0;
        right: 30px;
        top: -22px;
      }

      .bird-emblem {
        width: 86px;
        height: 58px;
        margin: 0 auto 12px;
        position: relative;
        filter: drop-shadow(0 6px 0 rgba(45,106,117,.28));
      }

      .bird-emblem::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 8px;
        width: 52px;
        height: 42px;
        border-radius: 54% 48% 52% 50%;
        background:
          radial-gradient(circle at 64% 28%, #fff 0 8px, #222 9px 12px, transparent 13px),
          radial-gradient(circle at 28% 28%, rgba(255,255,255,.58), transparent 14px),
          var(--bird-yellow);
        box-shadow: inset -5px -6px 0 rgba(244, 178, 34, .35), 0 0 0 3px rgba(126, 83, 0, .2);
      }

      .bird-emblem::after {
        content: "";
        position: absolute;
        right: 3px;
        top: 26px;
        width: 34px;
        height: 18px;
        clip-path: polygon(0 50%, 100% 6%, 84% 50%, 100% 94%);
        background: linear-gradient(90deg, var(--beak-orange), #ffb32f);
      }

      .wing-mark {
        position: absolute;
        left: 15px;
        top: 29px;
        width: 27px;
        height: 20px;
        border-radius: 55% 45% 60% 45%;
        background: var(--wing-orange);
        transform: rotate(-18deg);
        box-shadow: inset -3px -3px 0 rgba(171, 86, 0, .22);
      }

      h1 {
        font-size: clamp(34px, 11vw, 48px);
        line-height: .95;
        margin: 0 0 10px;
        text-shadow: 0 4px 0 var(--ui-shadow), 0 10px 18px rgba(0,0,0,.18);
      }

      p {
        font-size: clamp(15px, 4.5vw, 18px);
        line-height: 1.35;
        margin: 8px 6px;
        text-shadow: 0 2px 0 var(--ui-shadow);
      }

      .hint {
        opacity: .96;
      }

      button {
        min-width: 136px;
        min-height: 48px;
        margin-top: 18px;
        padding: 12px 28px;
        border: 2px solid rgba(255,255,255,.65);
        border-radius: 999px;
        background:
          radial-gradient(circle at 30% 15%, rgba(255,255,255,.66), transparent 26%),
          linear-gradient(180deg, #ffe86a, #f8c93c);
        color: #7a4b00;
        font-size: 20px;
        font-weight: 600;
        box-shadow:
          0 6px 0 #d49b15,
          0 12px 24px rgba(0,0,0,.18),
          inset 0 1px 0 rgba(255,255,255,.45);
        cursor: pointer;
      }

      button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #d49b15, 0 7px 16px rgba(0,0,0,.16);
      }

      .hidden { display: none !important; }

      @media (max-height: 620px) {
        .cloud-panel { padding: 18px 18px 20px; }
        .bird-emblem { transform: scale(.86); margin-bottom: 4px; }
        h1 { margin-bottom: 6px; }
        p { margin: 6px 4px; }
      }
    </style>
  </head>
  <body>
    <main class="game-shell" aria-label="Flappy Bird playable area">
      <canvas id="gameCanvas" width="400" height="600"></canvas>
      <div id="ui">0</div>
      <div id="levelBadge">LV 1</div>
      <div id="startScreen">
        <section class="cloud-panel" aria-labelledby="gameTitle">
          <div class="bird-emblem" aria-hidden="true"><span class="wing-mark"></span></div>
          <h1 id="gameTitle">Flappy Bird</h1>
          <p class="hint">Tap or press Space to flap through pipes.</p>
          <button id="startBtn">Start</button>
        </section>
      </div>
      <div id="gameOverScreen" class="hidden">
        <section class="cloud-panel" aria-labelledby="gameOverTitle">
          <div class="bird-emblem" aria-hidden="true"><span class="wing-mark"></span></div>
          <h1 id="gameOverTitle">Game Over</h1>
          <p id="finalScore">Score: 0</p>
          <button id="restartBtn">Try Again</button>
        </section>
      </div>
    </main>
    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const ui = document.getElementById('ui');
      const levelBadge = document.getElementById('levelBadge');
      const startScreen = document.getElementById('startScreen');
      const gameOverScreen = document.getElementById('gameOverScreen');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const finalScore = document.getElementById('finalScore');

      const bird = { x: 70, y: 220, radius: 16, velocity: 0 };
      const gravity = 0.42;
      const lift = -7.2;
      const pipes = [];
      const pipeWidth = 64;
      const pipeGap = 148;
      let frame = 0;
      let score = 0;
      let running = false;
      let gameOver = false;

      function visualLevel() {
        return Math.min(5, Math.floor(score / 5) + 1);
      }

      function updateVisualBadge() {
        levelBadge.textContent = `LV ${visualLevel()}`;
      }

      function resetGame() {
        bird.y = 220;
        bird.velocity = 0;
        pipes.length = 0;
        frame = 0;
        score = 0;
        gameOver = false;
        ui.textContent = '0';
        updateVisualBadge();
      }

      function startGame() {
        resetGame();
        running = true;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        requestAnimationFrame(loop);
      }

      function flap() {
        if (!running) return;
        bird.velocity = lift;
      }

      document.addEventListener('keydown', (e) => { if (e.code === 'Space') flap(); });
      canvas.addEventListener('pointerdown', flap);
      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', startGame);

      function roundedRect(x, y, w, h, r) {
        const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();
      }

      function drawCloud(x, y, scale, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, 18 * scale, 0, Math.PI * 2);
        ctx.arc(x + 22 * scale, y - 6 * scale, 25 * scale, 0, Math.PI * 2);
        ctx.arc(x + 52 * scale, y, 18 * scale, 0, Math.PI * 2);
        ctx.arc(x + 30 * scale, y + 8 * scale, 22 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBackground() {
        const level = visualLevel();
        const palettes = [
          ['#70c5ce', '#8be3ef', '#dff9fb'],
          ['#67c8d4', '#9ee9ef', '#fff0b8'],
          ['#71bdd6', '#ffd47b', '#ffeec0'],
          ['#ff9f8c', '#ffcc88', '#fff0d7'],
          ['#314f91', '#756fc6', '#ffd6a8']
        ];
        const p = palettes[level - 1];
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, p[0]);
        g.addColorStop(0.54, p[1]);
        g.addColorStop(1, p[2]);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const sunX = 316 - level * 16;
        const sunY = 72 + level * 8;
        ctx.save();
        ctx.globalAlpha = level === 5 ? 0.52 : 0.92;
        ctx.translate(sunX, sunY);
        ctx.strokeStyle = level >= 4 ? 'rgba(255,241,173,.33)' : 'rgba(255,255,255,.34)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 16; i++) {
          const a = i * Math.PI / 8 + frame * 0.004;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 30, Math.sin(a) * 30);
          ctx.lineTo(Math.cos(a) * 52, Math.sin(a) * 52);
          ctx.stroke();
        }
        ctx.fillStyle = level === 5 ? 'rgba(255,236,174,.72)' : '#ffe66d';
        ctx.beginPath();
        ctx.arc(0, 0, level >= 4 ? 23 : 29, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (level >= 3) {
          ctx.fillStyle = level === 5 ? 'rgba(125, 170, 210, .34)' : 'rgba(85, 177, 144, .22)';
          ctx.beginPath();
          ctx.moveTo(0, 382);
          for (let x = 0; x <= canvas.width + 40; x += 40) {
            ctx.quadraticCurveTo(x + 20, 344 + Math.sin((x + frame * .25) * .025) * 8, x + 40, 382);
          }
          ctx.lineTo(canvas.width, canvas.height);
          ctx.lineTo(0, canvas.height);
          ctx.fill();
        }

        ctx.fillStyle = level === 5 ? 'rgba(255,255,255,0.82)' : 'rgba(255,255,255,0.86)';
        for (let i = 0; i < 6; i++) {
          const x = (i * 98 - (frame * (0.28 + i * 0.02)) % 118) - 48;
          const y = 72 + (i % 3) * 52;
          drawCloud(x, y, i % 2 ? .82 : 1, .78);
        }

        if (level >= 2) {
          for (let i = 0; i < 18 + level * 4; i++) {
            const x = (i * 43 + frame * (0.18 + level * .05)) % canvas.width;
            const y = (i * 61 + Math.sin(frame * .018 + i) * 9) % (canvas.height - 95);
            ctx.fillStyle = level === 5 ? 'rgba(255,244,174,.58)' : 'rgba(255,255,255,.42)';
            ctx.beginPath();
            ctx.arc(x, y, (i % 3) + 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (level === 5) {
          ctx.fillStyle = 'rgba(255,255,255,.8)';
          for (let i = 0; i < 24; i++) {
            const x = (i * 37 + 17) % canvas.width;
            const y = (i * 53 + 29) % 260;
            ctx.fillRect(x, y, 2, 2);
          }
        }
      }

      function drawBird() {
        const level = visualLevel();
        ctx.save();

        if (level >= 4) {
          for (let i = 0; i < 5; i++) {
            const tx = bird.x - 17 - i * 9;
            const ty = bird.y + Math.sin((frame - i * 5) * .25) * 5;
            ctx.fillStyle = `rgba(255, 232, 106, ${0.24 - i * 0.03})`;
            ctx.beginPath();
            ctx.arc(tx, ty, 5 - i * .45, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.translate(bird.x, bird.y);
        ctx.rotate(Math.max(-0.45, Math.min(0.55, bird.velocity * 0.06)));

        ctx.strokeStyle = 'rgba(126,83,0,.42)';
        ctx.lineWidth = 3;
        ctx.fillStyle = '#ffd93d';
        ctx.beginPath();
        ctx.ellipse(0, 0, bird.radius + 4, bird.radius + 1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ff9f1c';
        ctx.beginPath();
        ctx.ellipse(-8, 4, 9, 12, -0.6 + Math.sin(frame * .18) * .08, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(171,86,0,.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-8, 5, 5, -1.2, 1.8);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(7, -7, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.arc(9, -7, 2.7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.82)';
        ctx.beginPath(); ctx.arc(10, -8, 1, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ff7f11';
        ctx.beginPath(); ctx.moveTo(15, 1); ctx.lineTo(31, -5); ctx.lineTo(29, 1); ctx.lineTo(31, 7); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(126,83,0,.28)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffef7b';
        ctx.beginPath();
        ctx.arc(-7, -13, 6, Math.PI, Math.PI * 2);
        ctx.arc(1, -14, 5, Math.PI, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawPipe(pipe) {
        const level = visualLevel();
        const pipeGradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
        pipeGradient.addColorStop(0, level === 5 ? '#49d66b' : '#43aa3f');
        pipeGradient.addColorStop(0.62, level === 5 ? '#32b85b' : '#36a33b');
        pipeGradient.addColorStop(1, '#247a2b');

        ctx.fillStyle = pipeGradient;
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, pipe.top + pipeGap, pipeWidth, canvas.height);

        ctx.save();
        ctx.shadowColor = level === 5 ? 'rgba(160,255,184,.52)' : 'transparent';
        ctx.shadowBlur = level === 5 ? 10 : 0;
        ctx.fillStyle = level === 5 ? '#63f17b' : '#2f8f2f';
        roundedRect(pipe.x - 7, pipe.top - 19, pipeWidth + 14, 20, 6);
        ctx.fill();
        roundedRect(pipe.x - 7, pipe.top + pipeGap, pipeWidth + 14, 20, 6);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = 'rgba(255,255,255,.48)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(pipe.x + 12, 0); ctx.lineTo(pipe.x + 12, pipe.top - 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pipe.x + 12, pipe.top + pipeGap + 3); ctx.lineTo(pipe.x + 12, canvas.height); ctx.stroke();

        ctx.fillStyle = 'rgba(35, 112, 39, .22)';
        for (let y = 18; y < pipe.top - 24; y += 42) {
          roundedRect(pipe.x + pipeWidth - 17, y, 7, 18, 4);
          ctx.fill();
        }
        for (let y = pipe.top + pipeGap + 38; y < canvas.height - 56; y += 42) {
          roundedRect(pipe.x + pipeWidth - 17, y, 7, 18, 4);
          ctx.fill();
        }
      }

      function drawGround() {
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, canvas.height - 48, canvas.width, 48);

        ctx.fillStyle = '#b7d86a';
        ctx.fillRect(0, canvas.height - 52, canvas.width, 8);

        ctx.fillStyle = '#c9b65c';
        for (let x = -((frame * 2) % 40); x < canvas.width; x += 40) {
          ctx.fillRect(x, canvas.height - 48, 20, 8);
        }

        ctx.fillStyle = 'rgba(126, 96, 39, .14)';
        for (let x = -((frame * 1.2) % 32); x < canvas.width; x += 32) {
          ctx.beginPath();
          ctx.arc(x + 6, canvas.height - 24, 2, 0, Math.PI * 2);
          ctx.arc(x + 18, canvas.height - 15, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function update() {
        bird.velocity += gravity;
        bird.y += bird.velocity;

        if (frame % 95 === 0) {
          const top = 70 + Math.random() * 250;
          pipes.push({ x: canvas.width, top, passed: false });
        }
        pipes.forEach(p => p.x -= 2.2);
        while (pipes.length && pipes[0].x + pipeWidth < 0) pipes.shift();

        pipes.forEach(p => {
          if (!p.passed && p.x + pipeWidth < bird.x) {
            p.passed = true; score++; ui.textContent = score; updateVisualBadge();
          }
        });

        if (bird.y + bird.radius > canvas.height - 48 || bird.y - bird.radius < 0) endGame();
        pipes.forEach(p => {
          if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth) {
            if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.top + pipeGap) endGame();
          }
        });
      }

      function endGame() {
        running = false;
        gameOver = true;
        finalScore.textContent = `Score: ${score}`;
        gameOverScreen.classList.remove('hidden');
      }

      function loop() {
        if (!running) return;
        update();
        drawBackground();
        pipes.forEach(drawPipe);
        drawGround();
        drawBird();
        requestAnimationFrame(loop);
      }

      updateVisualBadge();
      drawBackground();
      drawGround();
      drawBird();
    </script>
  </body>
</html>
