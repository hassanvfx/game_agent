<style>
    :root {
        --bg: #070812;
        --bg-deep: #101322;
        --panel: rgba(32, 24, 18, 0.82);
        --panel-strong: rgba(47, 34, 22, 0.94);
        --line: rgba(201, 161, 74, 0.36);
        --line-strong: rgba(231, 190, 95, 0.76);
        --text: #f6e6b5;
        --muted: #c8b98b;
        --glow: #d7b75b;
        --glow-soft: rgba(215, 183, 91, 0.2);
        --warn: #9ee8ff;
        --gryffindor: #b3262e;
        --slytherin: #1f7a4d;
        --ravenclaw: #2764b8;
        --hufflepuff: #e1b43b;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 18% 12%, rgba(215, 183, 91, 0.22), transparent 30%),
            radial-gradient(circle at 82% 18%, rgba(158, 232, 255, 0.12), transparent 28%),
            radial-gradient(circle at 50% 110%, rgba(76, 29, 95, 0.18), transparent 36%),
            linear-gradient(180deg, #171018 0%, var(--bg) 56%, #04050a 100%);
        color: var(--text);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    body { position: relative; }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.3;
        background:
            radial-gradient(circle at 12% 18%, rgba(246,230,181,0.08) 0 1px, transparent 1.4px),
            radial-gradient(circle at 78% 12%, rgba(215,183,91,0.1) 0 1px, transparent 1.4px),
            repeating-linear-gradient(90deg, rgba(246,230,181,0.018) 0 1px, transparent 1px 7px);
        background-size: 180px 180px, 220px 220px, 100% 100%;
        mix-blend-mode: screen;
        animation: mapDrift 22s linear infinite;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass {
        background:
            radial-gradient(circle at 18% 10%, rgba(246, 230, 181, 0.08), transparent 30%),
            linear-gradient(180deg, rgba(47, 34, 22, 0.92), rgba(20, 16, 15, 0.78)),
            rgba(32, 24, 18, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.1),
            0 0 0 1px rgba(231, 190, 95, 0.08),
            0 12px 32px rgba(0,0,0,0.35);
    }
    #game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; }
    #game-container::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 18%, rgba(246,230,181,0.16) 0 1px, transparent 1.4px),
            radial-gradient(circle at 72% 12%, rgba(158,232,255,0.2) 0 1.2px, transparent 1.5px),
            radial-gradient(circle at 84% 32%, rgba(225,180,59,0.15) 0 1px, transparent 1.4px),
            radial-gradient(circle at 15% 78%, rgba(179,38,46,0.16) 0 1.2px, transparent 1.6px),
            linear-gradient(115deg, transparent 0 42%, rgba(215,183,91,0.035) 43% 45%, transparent 46% 100%);
        opacity: 0.9;
        animation: candleMotes 12s ease-in-out infinite alternate;
    }
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.42;
        background:
            radial-gradient(ellipse at 15% 95%, rgba(31,122,77,0.18), transparent 22%),
            radial-gradient(ellipse at 50% 105%, rgba(179,38,46,0.14), transparent 24%),
            radial-gradient(ellipse at 84% 96%, rgba(39,100,184,0.16), transparent 22%),
            conic-gradient(from 0deg at 50% 52%, transparent 0 12%, rgba(215,183,91,0.045) 14%, transparent 17% 100%);
        mix-blend-mode: screen;
        animation: spellWheel 30s linear infinite;
    }
    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
            calc(env(safe-area-inset-top, 0px) + 1rem)
            calc(env(safe-area-inset-right, 0px) + 1rem)
            calc(env(safe-area-inset-bottom, 0px) + 1rem)
            calc(env(safe-area-inset-left, 0px) + 1rem);
        pointer-events: none;
    }
    #hud { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 0.5rem; }
    #settings-panel {

            calc(env(safe-area-inset-bottom, 0px) + 1rem)

    }
    #settings-panel.hidden { display: none !important; }
    #settings-panel .panel-card {

    #hint {

    .feedback-label {

    .feedback-label.visible {

    @media (max-width: 640px) {
        #hud { gap: 0.75rem; }
        .hud-actions { width: 10.5rem; }
        .action-btn { font-size: 0.82rem; padding: 0.65rem 0.72rem; }

</style>

<script>
/**
 * §2 System Invariants & Architecture
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const dpr = window.devicePixelRatio || 1;

// Global State
let cw = 0, ch = 0;
let initialized = false;
let gameState = 'PLAYING';
let timeScale = 1; // 0, 1, 2, 3
let lastTime = 0;
let particles = [];
let totalMass = 0;
let nextSpawnColor = '#B3262E';

// New Settings State
let soundEnabled = true;
let graphicsLevel = 'ultra'; // 'medium', 'high', 'ultra'

// Input State
const inputState = {
    active: false,
    x: 0,
    y: 0,
    spawnTimer: 0
};

// Hogwarts house and spell-mote color palette; visual only, color cycling semantics unchanged.
const colorPalette = [
    '#B3262E', // Gryffindor crimson
    '#1F7A4D', // Slytherin emerald
    '#2764B8', // Ravenclaw blue
    '#E1B43B', // Hufflepuff gold
    '#9EE8FF', // Patronus cyan
    '#D7B75B', // candle-gold charm
    '#B302FC', // purple spellwork
    '#FFFFFF'  // Lumos white
];
let paletteIndex = 0;

// Config Proxy
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = new Proxy({}, {
    get: (target, prop) => gameConfigDefs[prop]?.value
});
window.gameConfigDefs = gameConfigDefs;
window.gameConfig = gameConfig;
window.updateGameConfig = (key, val) => {
    if (gameConfigDefs[key]) {
        gameConfigDefs[key].value = val;
        if (key === 'particleCount') initGame();
        if (key === 'themeColor') {
            nextSpawnColor = val;
            updateColorPreview();
        }
    }
};

function updateColorPreview() {
    const preview = document.getElementById('color-preview');
    if (preview) {
        preview.style.backgroundColor = nextSpawnColor;
        preview.style.boxShadow = `0 0 15px ${nextSpawnColor}80, 0 0 30px ${nextSpawnColor}40`;
    }
}

// Audio System (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const audioBuffers = {};
let bgmStarted = false;

const feedbackManager = {
    timers: {},
    show(id, label, duration = 900) {
        const el = document.getElementById(id);
        const labelEl = document.getElementById('feedback-label');
        if (!el || !labelEl) return;
        el.classList.add('visible');
        labelEl.textContent = label;
        labelEl.classList.add('visible');
        clearTimeout(this.timers[id]);
        clearTimeout(this.timers.label);
        this.timers[id] = setTimeout(() => el.classList.remove('visible'), duration);
        this.timers.label = setTimeout(() => labelEl.classList.remove('visible'), duration + 140);
    }
};

const audioManager = {
    init: async () => {
        if (!audioCtx) audioCtx = new AudioContext();
        
        const loadBuffer = async (id, src) => {
            if (!src) return;
            try {
                const url = new URL(src, window.location.href);
                if (url.origin !== window.location.origin) return;
                const res = await fetch(url.href);
                if (!res.ok) return;
                const arrayBuffer = await res.arrayBuffer();
                audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                // Optional catalog media must never block play; synth fallback covers local validation.
            }
        };

        await Promise.all([
            loadBuffer('collide', document.getElementById('sfx_collide').src),
            loadBuffer('spawn', document.getElementById('sfx_spawn').src),
            loadBuffer('ui', document.getElementById('sfx_ui').src),
            loadBuffer('pause', document.getElementById('sfx_pause').src)
        ]);
    },
    
    resume: () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        if (!soundEnabled) return;
        const bgm = document.getElementById('bgm_main');
        if (!bgmStarted) {
            if (bgm.currentSrc || bgm.getAttribute('src')) bgm.play().then(() => { bgmStarted = true; }).catch(() => {});
        } else if (bgm.paused) {
            if (bgm.currentSrc || bgm.getAttribute('src')) bgm.play().catch(() => {});
        }
    },

    playSfx: function(id, pitch = 1.0, vol = 0.5) {
        if (!soundEnabled || !audioCtx) return;
        if (!audioBuffers[id]) {
            audioManager.synthesize(id);
            return;
        }
        
        const now = audioCtx.currentTime;
        if (id === 'collide') {
            if (this.lastCollide && now - this.lastCollide < 0.05) return;
            this.lastCollide = now;
        }

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[id];
        source.playbackRate.value = pitch;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = vol;
        
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
    },

    synthesize: (type) => {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const profiles = {
            spawn: { wave: 'triangle', start: 400, end: 800, vol: 0.08, len: 0.05 },
            ui: { wave: 'sine', start: 660, end: 990, vol: 0.06, len: 0.07 },
            pause: { wave: 'sine', start: 330, end: 220, vol: 0.06, len: 0.08 },
            collide: { wave: 'square', start: 160, end: 90, vol: 0.04, len: 0.045 }
        };
        const profile = profiles[type] || profiles.ui;
        osc.type = profile.wave;
        osc.frequency.setValueAtTime(profile.start, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(profile.end, audioCtx.currentTime + profile.len);
        gain.gain.setValueAtTime(profile.vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + profile.len);
        osc.start();
        osc.stop(audioCtx.currentTime + profile.len);
    }
};

// Vibration Bridge
const vibrate = (style) => {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 20 : 5);
};

/**
 * §3 Game Logic
 */

class Particle {
    constructor(x, y, mass, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        // Mass set to 1 to ensure Mass == Count
        this.mass = 1;
        this.radius = 4;
        this.color = color;
        this.glowPhase = Math.random() * Math.PI * 2;
    }

    update(dt) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.glowPhase += dt * 3;

        const damping = 0.8;
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -damping; }
        if (this.x > cw - this.radius) { this.x = cw - this.radius; this.vx *= -damping; }
        if (this.y < this.radius) { this.y = this.radius; this.vy *= -damping; }
        if (this.y > ch - this.radius) { this.y = ch - this.radius; this.vy *= -damping; }
    }

    draw(ctx) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;
        
        // Stage 2 visual pass: polish swarm particles into vivid micro-comets without changing collision or size behavior.
        if (graphicsLevel === 'ultra') {
            const glowIntensity = 0.24 + Math.sin(this.glowPhase) * 0.12;
            const tailX = this.x - this.vx * 1.5;
            const tailY = this.y - this.vy * 1.5;
            const trail = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
            trail.addColorStop(0, this.color + '55');
            trail.addColorStop(1, this.color + '00');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 3.5, 0, Math.PI * 2);
            ctx.fillStyle = this.color + Math.floor(glowIntensity * 255).toString(16).padStart(2, '0');
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(tailX, tailY);
            ctx.strokeStyle = trail;
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        const coreGradient = ctx.createRadialGradient(
            this.x - this.radius * 0.35, this.y - this.radius * 0.35, 0,
            this.x, this.y, this.radius
        );
        coreGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        coreGradient.addColorStop(0.22, this.color);
        coreGradient.addColorStop(1, this.color + 'bb');
        ctx.fillStyle = coreGradient;
        ctx.fill();
        
        if (graphicsLevel === 'ultra' || graphicsLevel === 'high') {
            ctx.beginPath();
            ctx.arc(this.x - this.radius*0.34, this.y - this.radius*0.34, Math.max(0, this.radius * 0.45), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 1.4, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }
}

function initGame() {
    particles = [];
    totalMass = 0;
    nextSpawnColor = gameConfig.themeColor;
    updateColorPreview();
    const count = gameConfig.particleCount;
    
    for (let i = 0; i < count; i++) {
        spawnParticle(
            Math.random() * (cw - 40) + 20,
            Math.random() * (ch - 40) + 20,
            1
        );
    }
    updateHUD();
}

function spawnParticle(x, y, mass) {
    const p = new Particle(x, y, mass, nextSpawnColor);
    particles.push(p);
    totalMass += p.mass;
}

function updateHUD() {
    document.getElementById('score-val').textContent = Math.floor(totalMass);
    document.getElementById('count-val').textContent = particles.length;
}

function moveChunk() {
    const len = particles.length;
    if (!len) {
        audioManager.playSfx('pause', 0.95, 0.2);
        feedbackManager.show('status-gif', 'NO MOTES TO FLOURISH', 900);
        return;
    }
    for (let i = 0; i < len; i++) {
        const p = particles[i];
        const angle = Math.random() * Math.PI * 2;
        const impulse = 2 + Math.random() * 4;
        p.vx += Math.cos(angle) * impulse;
        p.vy += Math.sin(angle) * impulse;
    }
    audioManager.synthesize('spawn');
    audioManager.playSfx('ui', 1.08, 0.2);
    feedbackManager.show('status-gif', 'WAND FLOURISH', 800);
    vibrate('medium');
}

function physicsStep(dt, isSubStep = false) {
    const G = gameConfig.gravity;
    const friction = gameConfig.friction;

    // 0. Handle Spawning (NO LIMIT)
    if (!isSubStep && inputState.active) {
        inputState.spawnTimer -= dt;
        let spawnedThisFrame = 0;
        while (inputState.spawnTimer <= 0) {
            const ox = (Math.random() - 0.5) * 20; 
            const oy = (Math.random() - 0.5) * 20;
            spawnParticle(inputState.x + ox, inputState.y + oy, 1);
            inputState.spawnTimer += 0.002; // 500 particles per second
            spawnedThisFrame++;
        }
        
        if (spawnedThisFrame > 0) {
            const pitch = 0.8 + Math.random() * 0.4;
            audioManager.playSfx('spawn', pitch, 0.1);
            vibrate('light');
        }
        
        if (inputState.spawnTimer < 0) inputState.spawnTimer = 0;
    }

    if (timeScale > 0) {
        // 1. Apply Gravity (N-body)
        const len = particles.length;
        for (let i = 0; i < len; i++) {
            const p1 = particles[i];
            
            for (let j = i + 1; j < len; j++) {
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < 1) continue; 

                const dist = Math.sqrt(distSq);
                const force = (G * p1.mass * p2.mass) / Math.max(distSq, 100);
                const ax = (dx / dist) * force;
                const ay = (dy / dist) * force;

                p1.vx += ax / p1.mass;
                p1.vy += ay / p1.mass;
                p2.vx -= ax / p2.mass;
                p2.vy -= ay / p2.mass;
            }

            p1.vx *= friction;
            p1.vy *= friction;
        }

        // 2. Move
        for (let i = 0; i < len; i++) {
            particles[i].update(dt);
        }

        // 3. Collision Resolution
        for (let i = 0; i < len; i++) {
            for (let j = i + 1; j < len; j++) {
                const p1 = particles[i];
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                const minDist = p1.radius + p2.radius;

                if (distSq < minDist * minDist) {
                    const dist = Math.sqrt(distSq);
                    if (dist === 0) continue;
                    
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const overlap = (minDist - dist) * 0.5;
                    p1.x -= nx * overlap;
                    p1.y -= ny * overlap;
                    p2.x += nx * overlap;
                    p2.y += ny * overlap;

                    const dvx = p2.vx - p1.vx;
                    const dvy = p2.vy - p1.vy;
                    const velAlongNormal = dvx * nx + dvy * ny;

                    if (velAlongNormal > 0) continue;

                    const restitution = 0.8;
                    const impulse = -(1 + restitution) * velAlongNormal / (1/p1.mass + 1/p2.mass);
                    
                    const ix = impulse * nx;
                    const iy = impulse * ny;

                    p1.vx -= ix / p1.mass;
                    p1.vy -= iy / p1.mass;
                    p2.vx += ix / p2.mass;
                    p2.vy += iy / p2.mass;

                    const impact = Math.abs(velAlongNormal);
                    if (impact > 1.0) {
                        const vol = Math.min(1.0, impact * 0.1);
                        const pitch = Math.max(0.5, 2.0 - (p1.mass + p2.mass) * 0.1);
                        audioManager.playSfx('collide', pitch, vol);
                        if (impact > 2.6) feedbackManager.show('impact-gif', 'SPELL CLASH', 520);
                        if (impact > 3.0) vibrate('medium');
                    }
                }
            }
        }
    }

    if (!isSubStep && (inputState.active || (particles.length > 0 && Math.random() < 0.1))) updateHUD();
}

function drawHogwartsBackdrop(t) {
    const progressLevel = Math.min(5, Math.max(1, Math.floor(particles.length / 140) + 1));
    const playfieldGradient = ctx.createLinearGradient(0, 0, 0, ch);
    playfieldGradient.addColorStop(0, progressLevel >= 4 ? '#07100f' : '#19111d');
    playfieldGradient.addColorStop(0.48, progressLevel >= 5 ? '#08091b' : '#0b0c16');
    playfieldGradient.addColorStop(1, '#03050b');
    ctx.fillStyle = playfieldGradient;
    ctx.fillRect(0, 0, cw, ch);

    const warmGlow = ctx.createRadialGradient(cw * 0.18, ch * 0.16, 0, cw * 0.18, ch * 0.16, cw * 0.5);
    warmGlow.addColorStop(0, 'rgba(215, 183, 91, 0.2)');
    warmGlow.addColorStop(1, 'rgba(215, 183, 91, 0)');
    ctx.fillStyle = warmGlow;
    ctx.fillRect(0, 0, cw, ch);

    const patronusGlow = ctx.createRadialGradient(cw * 0.82, ch * 0.76, 0, cw * 0.82, ch * 0.76, cw * 0.45);
    patronusGlow.addColorStop(0, progressLevel >= 4 ? 'rgba(158, 232, 255, 0.18)' : 'rgba(158, 232, 255, 0.1)');
    patronusGlow.addColorStop(1, 'rgba(158, 232, 255, 0)');
    ctx.fillStyle = patronusGlow;
    ctx.fillRect(0, 0, cw, ch);

    // Low-contrast Hogwarts architecture: decorative only, no collision or input surface changes.
    ctx.save();
    const baseY = ch * 0.78;
    ctx.fillStyle = progressLevel >= 4 ? 'rgba(4, 12, 10, 0.62)' : 'rgba(9, 8, 14, 0.64)';
    ctx.beginPath();
    ctx.moveTo(0, ch);
    ctx.lineTo(0, baseY);
    ctx.lineTo(cw * 0.08, baseY - 20);
    ctx.lineTo(cw * 0.13, baseY - 70);
    ctx.lineTo(cw * 0.18, baseY - 20);
    ctx.lineTo(cw * 0.29, baseY - 32);
    ctx.lineTo(cw * 0.34, baseY - 112);
    ctx.lineTo(cw * 0.39, baseY - 32);
    ctx.lineTo(cw * 0.53, baseY - 44);
    ctx.lineTo(cw * 0.58, baseY - 90);
    ctx.lineTo(cw * 0.64, baseY - 44);
    ctx.lineTo(cw * 0.78, baseY - 28);
    ctx.lineTo(cw * 0.84, baseY - 84);
    ctx.lineTo(cw * 0.9, baseY - 28);
    ctx.lineTo(cw, baseY - 18);
    ctx.lineTo(cw, ch);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(231, 190, 95, 0.16)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
        const x = cw * (0.16 + i * 0.17);
        ctx.beginPath();
        ctx.moveTo(x, baseY - 18);
        ctx.lineTo(x + Math.sin(t * 0.25 + i) * 24, baseY - 82);
        ctx.stroke();
    }
    ctx.restore();

    if (graphicsLevel !== 'medium') {
        ctx.save();
        ctx.strokeStyle = 'rgba(215, 183, 91, 0.13)';
        ctx.lineWidth = 1.4;
        for (let i = 0; i < 3; i++) {
            const r = 54 + i * 34;
            const cx = cw * (0.24 + i * 0.24);
            const cy = ch * (0.3 + Math.sin(t * 0.18 + i) * 0.045);
            ctx.beginPath();
            ctx.arc(cx, cy, r, t * 0.08 + i, t * 0.08 + i + Math.PI * 1.35);
            ctx.stroke();
        }

        for (let i = 0; i < 10; i++) {
            const x = (i * 97 + (t * 10)) % Math.max(cw, 1);
            const y = (i * 61) % Math.max(ch * 0.62, 1) + ch * 0.08;
            const bob = Math.sin(t * 1.1 + i) * 5;
            ctx.fillStyle = 'rgba(246, 230, 181, 0.22)';
            ctx.fillRect(x, y + bob, 2, 12);
            ctx.beginPath();
            ctx.arc(x + 1, y + bob - 2, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(215, 183, 91, 0.22)';
            ctx.fill();
        }

        const banners = ['#b3262e', '#1f7a4d', '#2764b8', '#e1b43b'];
        for (let i = 0; i < banners.length; i++) {
            const x = cw * (0.12 + i * 0.23);
            ctx.fillStyle = banners[i] + '38';
            ctx.beginPath();
            ctx.moveTo(x, ch * 0.08);
            ctx.lineTo(x + 24, ch * 0.08);
            ctx.lineTo(x + 24, ch * 0.22 + Math.sin(t + i) * 3);
            ctx.lineTo(x + 12, ch * 0.19);
            ctx.lineTo(x, ch * 0.22 + Math.sin(t + i) * 3);
            ctx.closePath();
            ctx.fill();
        }
    }
}

function draw() {
    drawHogwartsBackdrop(performance.now() * 0.001);

    if (timeScale === 0) {
        ctx.fillStyle = 'rgba(158, 232, 255, 0.05)';
        ctx.fillRect(0, 0, cw, ch);
        
        ctx.strokeStyle = 'rgba(158, 232, 255, 0.34)';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, cw - 4, ch - 4);
    }

    if (inputState.active) {
        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 39, 0, Math.PI * 2);
        ctx.strokeStyle = nextSpawnColor + '55';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 29, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.setLineDash([4, 6]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = nextSpawnColor + '30';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 8, 0, Math.PI * 2);
        const spawnGradient = ctx.createRadialGradient(inputState.x - 2, inputState.y - 2, 0, inputState.x, inputState.y, 10);
        spawnGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        spawnGradient.addColorStop(0.25, nextSpawnColor);
        spawnGradient.addColorStop(1, nextSpawnColor + 'aa');
        ctx.fillStyle = spawnGradient;
        ctx.fill();
    }

    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (timeScale === 0) {
            physicsStep(dt, false);
        } else {
            for (let i = 0; i < timeScale; i++) {
                physicsStep(dt, i > 0);
            }
        }
        draw();
    } catch (e) {
        console.error("Loop Error", e);
    }

    requestAnimationFrame(loop);
}

/**
 * §4 Input & Lifecycle
 */

function handleInput(e) {
    e.preventDefault();
    audioManager.resume();
    
    const hint = document.getElementById('hint');
    if (hint && !hint.classList.contains('hidden')) hint.classList.add('hidden');

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        inputState.active = true;
        inputState.spawnTimer = 0;
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointermove') {
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        inputState.active = false;
    }
}

function setTimeScale(scale) {
    timeScale = scale;
    [0, 1, 2, 3].forEach(s => {
        const btn = document.getElementById(`btn-${s}x`);
        if (s === scale) {
            btn.style.color = '#22d3ee';
            btn.style.borderColor = '#22d3ee';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    audioManager.playSfx(scale === 0 ? 'pause' : 'ui', scale === 0 ? 0.94 : 1.04, 0.18);
     feedbackManager.show('status-gif', scale === 0 ? 'TIME-TURNER HOLD' : `TIME FLOW ${scale}X`, 720);
    vibrate('light');
}

function setGraphicsLevel(level) {
    graphicsLevel = level;
    ['medium', 'high', 'ultra'].forEach(l => {
        const btn = document.getElementById(`gfx-${l}`);
        if (l === level) {
            btn.style.color = '#22d3ee';
            btn.style.borderColor = '#22d3ee';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    audioManager.playSfx('ui', level === 'ultra' ? 1.1 : 1.0, 0.16);
    feedbackManager.show('status-gif', `VISION ${level.toUpperCase()}`, 720);
    vibrate('light');
}

function setSoundEnabled(enabled) {
    soundEnabled = enabled;
    const bgm = document.getElementById('bgm_main');
    
    if (enabled) {
        document.getElementById('snd-on').style.color = '#22d3ee';
        document.getElementById('snd-on').style.borderColor = '#22d3ee';
        document.getElementById('snd-off').style.color = 'white';
        document.getElementById('snd-off').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        if (bgm.currentSrc || bgm.getAttribute('src')) bgm.play().then(() => { bgmStarted = true; }).catch(()=>{});
        feedbackManager.show('status-gif', 'CHARMS AUDIBLE', 760);
    } else {
        document.getElementById('snd-off').style.color = '#22d3ee';
        document.getElementById('snd-off').style.borderColor = '#22d3ee';
        document.getElementById('snd-on').style.color = 'white';
        document.getElementById('snd-on').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        bgm.pause();
        feedbackManager.show('status-gif', 'CHARMS QUIET', 760);
    }
    if (enabled) audioManager.playSfx('ui', 1, 0.18);
    vibrate('light');
}

document.addEventListener('DOMContentLoaded', () => {
    audioManager.init();

    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        const { width, height } = entry.contentRect;
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        
        cw = width;
        ch = height;
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
            
            const bgm = document.getElementById('bgm_main');
            bgm.volume = 0.2;
        } else {
            particles.forEach(p => {
                p.x = Math.min(p.x, cw - p.radius);
                p.y = Math.min(p.y, ch - p.radius);
            });
        }
    });
    
    ro.observe(canvas);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', handleInput, { passive: false });
    canvas.addEventListener('pointercancel', handleInput, { passive: false });

    document.getElementById('color-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        
        paletteIndex = (paletteIndex + 1) % colorPalette.length;
        const newColor = colorPalette[paletteIndex];
        
        window.updateGameConfig('themeColor', newColor);
        audioManager.playSfx('ui', 1.12, 0.16);
        feedbackManager.show('status-gif', 'HOUSE SIGNAL SHIFT', 720);
        vibrate('light');
    });

    document.getElementById('btn-0x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(0); });
    document.getElementById('btn-1x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(1); });
    document.getElementById('btn-2x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(2); });
    document.getElementById('btn-3x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(3); });

    document.getElementById('move-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        moveChunk();
    });

    document.getElementById('reset-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        setTimeScale(1);
        initGame();
        audioManager.playSfx('pause', 0.82, 0.22);
        feedbackManager.show('status-gif', 'FINITE FIELD', 900);
        vibrate('heavy');
    });

    // Settings UI Listeners
    const settingsPanel = document.getElementById('settings-panel');
    
    document.getElementById('settings-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        settingsPanel.classList.remove('hidden');
        audioManager.playSfx('ui', 1, 0.18);
        feedbackManager.show('status-gif', 'SPELLBOOK OPEN', 760);
        vibrate('light');
    });

    document.getElementById('close-settings').addEventListener('click', (e) => {
        e.stopPropagation();
        settingsPanel.classList.add('hidden');
        audioManager.playSfx('pause', 1.06, 0.16);
        feedbackManager.show('status-gif', 'SPELLBOOK CLOSED', 760);
        vibrate('light');
    });

    // Prevent clicks inside the panel from closing it if we add a backdrop click later
    settingsPanel.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
    });

    document.getElementById('gfx-medium').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('medium'); });
    document.getElementById('gfx-high').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('high'); });
    document.getElementById('gfx-ultra').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('ultra'); });

    document.getElementById('snd-on').addEventListener('click', (e) => { e.stopPropagation(); setSoundEnabled(true); });
    document.getElementById('snd-off').addEventListener('click', (e) => { e.stopPropagation(); setSoundEnabled(false); });
});
