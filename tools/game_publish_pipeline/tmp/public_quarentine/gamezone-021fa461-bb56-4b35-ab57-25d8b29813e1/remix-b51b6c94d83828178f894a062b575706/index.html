<style>
    :root {
        --bg: #fff1dc;
        --bg-deep: #3a1535;
        --panel: rgba(255, 236, 220, 0.78);
        --panel-strong: rgba(255, 247, 231, 0.94);
        --line: rgba(255, 87, 145, 0.28);
        --line-strong: rgba(255, 87, 145, 0.68);
        --text: #4a183c;
        --muted: #8e4c6f;
        --glow: #ff5d9a;
        --glow-soft: rgba(255, 93, 154, 0.2);
        --warn: #ff3d72;
        --gold: #ffbe4d;
        --violet: #ba5cff;
        --paper: #fff7e7;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 15% 12%, rgba(255, 190, 77, 0.28), transparent 32%),
            radial-gradient(circle at 80% 8%, rgba(255, 93, 154, 0.24), transparent 30%),
            radial-gradient(circle at 50% 120%, rgba(186, 92, 255, 0.16), transparent 34%),
            linear-gradient(180deg, #fff5df 0%, var(--bg) 52%, #ffd1df 100%);
        color: var(--text);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    body { position: relative; }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.34;
        background:
            linear-gradient(rgba(255,93,154,0.075) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,190,77,0.075) 1px, transparent 1px);
        background-size: 100% 18px, 18px 100%;
        mix-blend-mode: screen;
        animation: paperDrift 18s linear infinite;
    }
    body::after {
        content: "MOM ♥ LOVE ♥ MOM ♥ LOVE";
        position: fixed;
        left: -8vw;
        bottom: 10vh;
        width: 116vw;
        pointer-events: none;
        color: rgba(255, 93, 154, 0.1);
        font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
        font-size: clamp(2.4rem, 9vw, 7rem);
        letter-spacing: 0.18em;
        white-space: nowrap;
        transform: rotate(-8deg);
        text-shadow: 0 0 22px rgba(255, 190, 77, 0.12);
        animation: marqueeFloat 24s ease-in-out infinite alternate;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass {
        background:
            linear-gradient(180deg, rgba(255, 248, 231, 0.9), rgba(255, 215, 226, 0.82)),
            rgba(255, 236, 220, 0.86);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
             0 0 0 1px rgba(255, 93, 154, 0.12),

    }
    #game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; }
    #game-container::before {
        content: "";

        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 18%, rgba(255,93,154,0.22) 0 2px, transparent 2.4px),
            radial-gradient(circle at 72% 12%, rgba(255,190,77,0.28) 0 2.2px, transparent 2.6px),
            radial-gradient(circle at 84% 32%, rgba(255,255,255,0.34) 0 1.5px, transparent 1.8px),
            radial-gradient(circle at 15% 78%, rgba(186,92,255,0.18) 0 2px, transparent 2.4px);
        opacity: 0.9;
        animation: confettiTwinkle 7s ease-in-out infinite alternate;
    }
    #game-container::after {
        content: "";
        position: absolute;
        inset: auto -8vw 14vh -8vw;
        height: 5rem;
        pointer-events: none;
        opacity: 0.32;
        background:
            radial-gradient(ellipse at 12% 50%, rgba(255,93,154,0.42) 0 9%, transparent 10%),
            radial-gradient(ellipse at 32% 50%, rgba(255,190,77,0.38) 0 8%, transparent 9%),
            radial-gradient(ellipse at 54% 50%, rgba(186,92,255,0.26) 0 9%, transparent 10%),

    @media (max-width: 640px) {

</style>

<script>
/**
 * §2 System Invariants & Architecture
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const dpr = window.devicePixelRatio || 1;

// Global State
let cw = 0, ch = 0;
let initialized = false;
let gameState = 'PLAYING';
let timeScale = 1; // 0, 1, 2, 3
let lastTime = 0;
let particles = [];
let totalMass = 0;
let nextSpawnColor = '#B302FC';

// New Settings State
let soundEnabled = true;
let graphicsLevel = 'ultra'; // 'medium', 'high', 'ultra'

// Input State
const inputState = {
    active: false,
    x: 0,
    y: 0,
    spawnTimer: 0
};

// 10 More Colors Palette
const colorPalette = [
    '#B302FC', // Original Purple
    '#FF3366', // Neon Pink
    '#00FFCC', // Cyan
    '#FFCC00', // Yellow
    '#FF6600', // Orange
    '#00FF00', // Lime Green
    '#3366FF', // Royal Blue
    '#FF00FF', // Magenta
    '#FFFFFF', // White
    '#FF3333', // Red
    '#99FF33'  // Yellow-Green
];
let paletteIndex = 0;
let visualClock = 0;

// Config Proxy
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = new Proxy({}, {
    get: (target, prop) => gameConfigDefs[prop]?.value
});
window.gameConfigDefs = gameConfigDefs;
window.gameConfig = gameConfig;
window.updateGameConfig = (key, val) => {
    if (gameConfigDefs[key]) {
        gameConfigDefs[key].value = val;
        if (key === 'particleCount') initGame();
        if (key === 'themeColor') {
            nextSpawnColor = val;
            updateColorPreview();
        }
    }
};

function updateColorPreview() {
    const preview = document.getElementById('color-preview');
    if (preview) {
        preview.style.backgroundColor = nextSpawnColor;
        preview.style.boxShadow = `0 0 15px ${nextSpawnColor}80, 0 0 30px ${nextSpawnColor}40`;
    }
}

// Audio System (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const audioBuffers = {};
let bgmStarted = false;

const feedbackManager = {
    timers: {},
    show(id, label, duration = 900) {
        const el = document.getElementById(id);
        const labelEl = document.getElementById('feedback-label');
        if (!el || !labelEl) return;
        el.classList.add('visible');
        labelEl.textContent = label;
        labelEl.classList.add('visible');
        clearTimeout(this.timers[id]);
        clearTimeout(this.timers.label);
        this.timers[id] = setTimeout(() => el.classList.remove('visible'), duration);
        this.timers.label = setTimeout(() => labelEl.classList.remove('visible'), duration + 140);
    }
};

const audioManager = {
    init: async () => {
        if (!audioCtx) audioCtx = new AudioContext();
        
        const loadBuffer = async (id, src) => {
            try {
                const res = await fetch(src);
                const arrayBuffer = await res.arrayBuffer();
                audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.warn(`Failed to load audio ${id}`, e);
            }
        };

        await Promise.all([
            loadBuffer('collide', document.getElementById('sfx_collide').src),
            loadBuffer('spawn', document.getElementById('sfx_spawn').src),
            loadBuffer('ui', document.getElementById('sfx_ui').src),
            loadBuffer('pause', document.getElementById('sfx_pause').src)
        ]);
    },
    
    resume: () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        if (!soundEnabled) return;
        const bgm = document.getElementById('bgm_main');
        if (!bgmStarted) {
            bgm.play().then(() => { bgmStarted = true; }).catch(() => {});
        } else if (bgm.paused) {
            bgm.play().catch(() => {});
        }
    },

    playSfx: function(id, pitch = 1.0, vol = 0.5) {
        if (!soundEnabled || !audioCtx || !audioBuffers[id]) return;
        
        const now = audioCtx.currentTime;
        if (id === 'collide') {
            if (this.lastCollide && now - this.lastCollide < 0.05) return;
            this.lastCollide = now;
        }

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[id];
        source.playbackRate.value = pitch;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = vol;
        
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
    },

    synthesize: (type) => {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'spawn') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }
    }
};

// Vibration Bridge
const vibrate = (style) => {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 20 : 5);
};

/**
 * §3 Game Logic
 */

function drawMomHeart(ctx, x, y, size, fill, alpha = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);
    ctx.globalAlpha *= alpha;
    ctx.beginPath();
    ctx.moveTo(0, 0.35);
    ctx.bezierCurveTo(-0.95, -0.2, -0.55, -1.05, 0, -0.62);
    ctx.bezierCurveTo(0.55, -1.05, 0.95, -0.2, 0, 0.35);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
}

function drawStickerStar(ctx, x, y, size, fill, alpha = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha *= alpha;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        const r = i % 2 === 0 ? size : size * 0.38;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
}

function drawGiftBit(ctx, x, y, size, fill, alpha = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = fill;
    ctx.fillRect(-size * 0.6, -size * 0.45, size * 1.2, size * 0.9);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = Math.max(0.8, size * 0.18);
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.45);
    ctx.lineTo(0, size * 0.45);
    ctx.moveTo(-size * 0.6, -size * 0.05);
    ctx.lineTo(size * 0.6, -size * 0.05);
    ctx.stroke();
    ctx.restore();
}

function drawPetalBit(ctx, x, y, size, fill, angle = 0, alpha = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha *= alpha;
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.42, size, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
}

function drawRibbonArc(ctx, cx, cy, radius, color, phase, width = 7) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, Math.sin(phase) * 0.25 + 0.12, Math.PI * 1.22 + Math.cos(phase) * 0.18);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.28;
    ctx.stroke();
    ctx.restore();
}

class Particle {
    constructor(x, y, mass, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        // Mass set to 1 to ensure Mass == Count
        this.mass = 1;
        this.radius = 4;
        this.color = color;
        this.glowPhase = Math.random() * Math.PI * 2;
        this.visualMotif = Math.floor(Math.random() * 5);
    }

    update(dt) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.glowPhase += dt * 3;

        const damping = 0.8;
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -damping; }
        if (this.x > cw - this.radius) { this.x = cw - this.radius; this.vx *= -damping; }
        if (this.y < this.radius) { this.y = this.radius; this.vy *= -damping; }
        if (this.y > ch - this.radius) { this.y = ch - this.radius; this.vy *= -damping; }
    }

    draw(ctx) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;
        
        // Stage 2 world-design pass: particles read as glossy momcore love bits without changing radius, collision, or mass behavior.
        if (graphicsLevel === 'ultra') {
            const glowIntensity = 0.24 + Math.sin(this.glowPhase) * 0.12;
            const tailX = this.x - this.vx * 1.5;
            const tailY = this.y - this.vy * 1.5;
            const trail = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
            trail.addColorStop(0, this.color + '55');
            trail.addColorStop(1, this.color + '00');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 3.5, 0, Math.PI * 2);
            ctx.fillStyle = this.color + Math.floor(glowIntensity * 255).toString(16).padStart(2, '0');
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(tailX, tailY);
            ctx.strokeStyle = trail;
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        const coreGradient = ctx.createRadialGradient(
            this.x - this.radius * 0.35, this.y - this.radius * 0.35, 0,
            this.x, this.y, this.radius
        );
        coreGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        coreGradient.addColorStop(0.22, this.color);
        coreGradient.addColorStop(1, this.color + 'bb');
        ctx.fillStyle = coreGradient;
        ctx.fill();
        
        if (graphicsLevel === 'ultra' || graphicsLevel === 'high') {
            ctx.beginPath();
            ctx.arc(this.x - this.radius*0.34, this.y - this.radius*0.34, Math.max(0, this.radius * 0.45), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 1.4, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1;
            ctx.stroke();

            const motifSize = this.radius * 0.78;
            const motifAlpha = graphicsLevel === 'ultra' ? 0.9 : 0.58;
            if (this.visualMotif === 0) {
                drawMomHeart(ctx, this.x, this.y + 0.2, motifSize * 0.42, 'rgba(255,255,255,0.72)', motifAlpha);
            } else if (this.visualMotif === 1) {
                drawPetalBit(ctx, this.x, this.y, motifSize * 0.55, 'rgba(255,255,255,0.52)', this.glowPhase, motifAlpha);
            } else if (this.visualMotif === 2) {
                drawGiftBit(ctx, this.x, this.y, motifSize * 0.55, 'rgba(255,247,231,0.58)', motifAlpha);
            } else if (this.visualMotif === 3) {
                drawStickerStar(ctx, this.x, this.y, motifSize * 0.48, 'rgba(255,190,77,0.72)', motifAlpha);
            } else {
                ctx.save();
                ctx.globalAlpha *= motifAlpha;
                ctx.fillStyle = 'rgba(74,24,60,0.38)';
                ctx.font = `${Math.max(4, this.radius * 1.05)}px Bangers, Rajdhani, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('M', this.x, this.y + 0.2);
                ctx.restore();
            }
        }
    }
}

function initGame() {
    particles = [];
    totalMass = 0;
    nextSpawnColor = gameConfig.themeColor;
    updateColorPreview();
    const count = gameConfig.particleCount;
    
    for (let i = 0; i < count; i++) {
        spawnParticle(
            Math.random() * (cw - 40) + 20,
            Math.random() * (ch - 40) + 20,
            1
        );
    }
    updateHUD();
}

function spawnParticle(x, y, mass) {
    const p = new Particle(x, y, mass, nextSpawnColor);
    particles.push(p);
    totalMass += p.mass;
}

function updateHUD() {
    document.getElementById('score-val').textContent = Math.floor(totalMass);
    document.getElementById('count-val').textContent = particles.length;
}

function moveChunk() {
    const len = particles.length;
    if (!len) {
        audioManager.playSfx('pause', 0.95, 0.2);
        feedbackManager.show('status-gif', 'NO MOM BITS TO BURST', 900);
        return;
    }
    for (let i = 0; i < len; i++) {
        const p = particles[i];
        const angle = Math.random() * Math.PI * 2;
        const impulse = 2 + Math.random() * 4;
        p.vx += Math.cos(angle) * impulse;
        p.vy += Math.sin(angle) * impulse;
    }
    audioManager.synthesize('spawn');
    audioManager.playSfx('ui', 1.08, 0.2);
    feedbackManager.show('status-gif', 'LOVE BURST CASCADE', 800);
    vibrate('medium');
}

function physicsStep(dt, isSubStep = false) {
    const G = gameConfig.gravity;
    const friction = gameConfig.friction;

    // 0. Handle Spawning (NO LIMIT)
    if (!isSubStep && inputState.active) {
        inputState.spawnTimer -= dt;
        let spawnedThisFrame = 0;
        while (inputState.spawnTimer <= 0) {
            const ox = (Math.random() - 0.5) * 20; 
            const oy = (Math.random() - 0.5) * 20;
            spawnParticle(inputState.x + ox, inputState.y + oy, 1);
            inputState.spawnTimer += 0.002; // 500 particles per second
            spawnedThisFrame++;
        }
        
        if (spawnedThisFrame > 0) {
            const pitch = 0.8 + Math.random() * 0.4;
            audioManager.playSfx('spawn', pitch, 0.1);
            vibrate('light');
        }
        
        if (inputState.spawnTimer < 0) inputState.spawnTimer = 0;
    }

    if (timeScale > 0) {
        // 1. Apply Gravity (N-body)
        const len = particles.length;
        for (let i = 0; i < len; i++) {
            const p1 = particles[i];
            
            for (let j = i + 1; j < len; j++) {
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < 1) continue; 

                const dist = Math.sqrt(distSq);
                const force = (G * p1.mass * p2.mass) / Math.max(distSq, 100);
                const ax = (dx / dist) * force;
                const ay = (dy / dist) * force;

                p1.vx += ax / p1.mass;
                p1.vy += ay / p1.mass;
                p2.vx -= ax / p2.mass;
                p2.vy -= ay / p2.mass;
            }

            p1.vx *= friction;
            p1.vy *= friction;
        }

        // 2. Move
        for (let i = 0; i < len; i++) {
            particles[i].update(dt);
        }

        // 3. Collision Resolution
        for (let i = 0; i < len; i++) {
            for (let j = i + 1; j < len; j++) {
                const p1 = particles[i];
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                const minDist = p1.radius + p2.radius;

                if (distSq < minDist * minDist) {
                    const dist = Math.sqrt(distSq);
                    if (dist === 0) continue;
                    
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const overlap = (minDist - dist) * 0.5;
                    p1.x -= nx * overlap;
                    p1.y -= ny * overlap;
                    p2.x += nx * overlap;
                    p2.y += ny * overlap;

                    const dvx = p2.vx - p1.vx;
                    const dvy = p2.vy - p1.vy;
                    const velAlongNormal = dvx * nx + dvy * ny;

                    if (velAlongNormal > 0) continue;

                    const restitution = 0.8;
                    const impulse = -(1 + restitution) * velAlongNormal / (1/p1.mass + 1/p2.mass);
                    
                    const ix = impulse * nx;
                    const iy = impulse * ny;

                    p1.vx -= ix / p1.mass;
                    p1.vy -= iy / p1.mass;
                    p2.vx += ix / p2.mass;
                    p2.vy += iy / p2.mass;

                    const impact = Math.abs(velAlongNormal);
                    if (impact > 1.0) {
                        const vol = Math.min(1.0, impact * 0.1);
                        const pitch = Math.max(0.5, 2.0 - (p1.mass + p2.mass) * 0.1);
                        audioManager.playSfx('collide', pitch, vol);
                        if (impact > 2.6) feedbackManager.show('impact-gif', 'LOVE BIT TAP', 520);
                        if (impact > 3.0) vibrate('medium');
                    }
                }
            }
        }
    }

    if (!isSubStep && (inputState.active || (particles.length > 0 && Math.random() < 0.1))) updateHUD();
}

function draw() {
    // Authored background replacement: warm animated card-table world supersedes the old sci-fi nebula while preserving the canvas architecture.
    const t = visualClock;
    const playfieldGradient = ctx.createLinearGradient(0, 0, 0, ch);
    playfieldGradient.addColorStop(0, '#fff5df');
    playfieldGradient.addColorStop(0.45, '#ffdce9');
    playfieldGradient.addColorStop(1, '#f6b4d1');
    ctx.fillStyle = playfieldGradient;
    ctx.fillRect(0, 0, cw, ch);

    const cardGlow = ctx.createRadialGradient(cw * 0.18, ch * 0.14, 0, cw * 0.18, ch * 0.14, cw * 0.5);
    cardGlow.addColorStop(0, 'rgba(255, 190, 77, 0.25)');
    cardGlow.addColorStop(0.42, 'rgba(255, 247, 231, 0.16)');
    cardGlow.addColorStop(1, 'rgba(255, 190, 77, 0)');
    ctx.fillStyle = cardGlow;
    ctx.fillRect(0, 0, cw, ch);

    const bloomGlow = ctx.createRadialGradient(cw * 0.8, ch * 0.82, 0, cw * 0.8, ch * 0.82, cw * 0.46);
    bloomGlow.addColorStop(0, 'rgba(255, 93, 154, 0.24)');
    bloomGlow.addColorStop(0.55, 'rgba(186, 92, 255, 0.11)');
    bloomGlow.addColorStop(1, 'rgba(255, 93, 154, 0)');
    ctx.fillStyle = bloomGlow;
    ctx.fillRect(0, 0, cw, ch);

    if (graphicsLevel !== 'medium') {
        ctx.save();
        const grid = Math.max(18, Math.min(28, cw * 0.045));
        ctx.strokeStyle = 'rgba(255, 93, 154, 0.055)';
        ctx.lineWidth = 1;
        for (let x = ((t * 4) % grid) - grid; x < cw + grid; x += grid) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, ch);
            ctx.stroke();
        }
        for (let y = ((t * 2.5) % grid) - grid; y < ch + grid; y += grid) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(cw, y);
            ctx.stroke();
        }

        drawRibbonArc(ctx, cw * 0.12, ch * 0.78, Math.max(cw, ch) * 0.34, 'rgba(255, 93, 154, 0.72)', t * 0.45, 8);
        drawRibbonArc(ctx, cw * 0.92, ch * 0.22, Math.max(cw, ch) * 0.28, 'rgba(255, 190, 77, 0.68)', t * 0.5 + 1.2, 6);
        drawRibbonArc(ctx, cw * 0.52, ch * 1.03, Math.max(cw, ch) * 0.42, 'rgba(186, 92, 255, 0.42)', t * 0.36 + 2.1, 9);

        ctx.font = `${Math.max(34, Math.min(84, cw * 0.14))}px Bangers, Rajdhani, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.17)';
        ctx.strokeStyle = 'rgba(255, 93, 154, 0.16)';
        ctx.lineWidth = 1.5;
        ctx.save();
        ctx.translate(cw * 0.5, ch * 0.54 + Math.sin(t * 0.65) * 6);
        ctx.rotate(-0.07);
        ctx.strokeText('MOM', 0, 0);
        ctx.fillText('MOM', 0, 0);
        ctx.restore();

        for (let i = 0; i < 38; i++) {
            const sx = (i * 173 + Math.sin(t * 0.34 + i) * 16 + t * 9) % Math.max(cw + 40, 1) - 20;
            const sy = (i * 97 + Math.cos(t * 0.27 + i * 0.7) * 11 + t * (i % 3 + 1) * 2) % Math.max(ch + 40, 1) - 20;
            const size = 2.5 + (i % 4);
            if (i % 5 === 0) {
                drawMomHeart(ctx, sx, sy, size * 0.8, i % 2 ? 'rgba(255,93,154,0.2)' : 'rgba(255,190,77,0.2)', 1);
            } else if (i % 5 === 1) {
                drawPetalBit(ctx, sx, sy, size, 'rgba(186,92,255,0.14)', t + i, 1);
            } else if (i % 5 === 2) {
                drawStickerStar(ctx, sx, sy, size, 'rgba(255,255,255,0.22)', 1);
            } else {
                ctx.fillStyle = i % 2 ? 'rgba(255,93,154,0.18)' : 'rgba(255,190,77,0.22)';
                ctx.fillRect(sx, sy, size + 3, Math.max(2, size * 0.45));
            }
        }
        ctx.restore();
    }

    if (timeScale === 0) {
        ctx.fillStyle = 'rgba(255, 93, 154, 0.08)';
        ctx.fillRect(0, 0, cw, ch);
        
        ctx.strokeStyle = 'rgba(255, 190, 77, 0.42)';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, cw - 4, ch - 4);
    }

    if (inputState.active) {
        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 39, 0, Math.PI * 2);
        ctx.strokeStyle = nextSpawnColor + '55';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 29, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.setLineDash([4, 6]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = nextSpawnColor + '30';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 8, 0, Math.PI * 2);
        const spawnGradient = ctx.createRadialGradient(inputState.x - 2, inputState.y - 2, 0, inputState.x, inputState.y, 10);
        spawnGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        spawnGradient.addColorStop(0.25, nextSpawnColor);
        spawnGradient.addColorStop(1, nextSpawnColor + 'aa');
        ctx.fillStyle = spawnGradient;
        ctx.fill();
    }

    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    visualClock = timestamp * 0.001;
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (timeScale === 0) {
            physicsStep(dt, false);
        } else {
            for (let i = 0; i < timeScale; i++) {
                physicsStep(dt, i > 0);
            }
        }
        draw();
    } catch (e) {
        console.error("Loop Error", e);
    }

    requestAnimationFrame(loop);
}

/**
 * §4 Input & Lifecycle
 */

function handleInput(e) {
    e.preventDefault();
    audioManager.resume();
    
    const hint = document.getElementById('hint');
    if (hint && !hint.classList.contains('hidden')) hint.classList.add('hidden');

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        inputState.active = true;
        inputState.spawnTimer = 0;
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointermove') {
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        inputState.active = false;
    }
}

function setTimeScale(scale) {
    timeScale = scale;
    [0, 1, 2, 3].forEach(s => {
        const btn = document.getElementById(`btn-${s}x`);
        if (s === scale) {
            btn.style.color = '#ffbe4d';
            btn.style.borderColor = '#ffbe4d';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    audioManager.playSfx(scale === 0 ? 'pause' : 'ui', scale === 0 ? 0.94 : 1.04, 0.18);
    feedbackManager.show('status-gif', scale === 0 ? 'CARD HOLD' : `LOVE FLOW ${scale}X`, 720);
    vibrate('light');
}

function setGraphicsLevel(level) {
    graphicsLevel = level;
    ['medium', 'high', 'ultra'].forEach(l => {
        const btn = document.getElementById(`gfx-${l}`);
        if (l === level) {
            btn.style.color = '#ffbe4d';
            btn.style.borderColor = '#ffbe4d';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    audioManager.playSfx('ui', level === 'ultra' ? 1.1 : 1.0, 0.16);
    feedbackManager.show('status-gif', `STICKER ${level.toUpperCase()}`, 720);
    vibrate('light');
}

function setSoundEnabled(enabled) {
    soundEnabled = enabled;
    const bgm = document.getElementById('bgm_main');
    
    if (enabled) {
        document.getElementById('snd-on').style.color = '#ffbe4d';
        document.getElementById('snd-on').style.borderColor = '#ffbe4d';
        document.getElementById('snd-off').style.color = 'white';
        document.getElementById('snd-off').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        bgm.play().then(() => { bgmStarted = true; }).catch(()=>{});
        feedbackManager.show('status-gif', 'LOVE TUNES ON', 760);
    } else {
        document.getElementById('snd-off').style.color = '#ffbe4d';
        document.getElementById('snd-off').style.borderColor = '#ffbe4d';
        document.getElementById('snd-on').style.color = 'white';
        document.getElementById('snd-on').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        bgm.pause();
        feedbackManager.show('status-gif', 'LOVE TUNES OFF', 760);
    }
    if (enabled) audioManager.playSfx('ui', 1, 0.18);
    vibrate('light');
}

document.addEventListener('DOMContentLoaded', () => {
    audioManager.init();

    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        const { width, height } = entry.contentRect;
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        
        cw = width;
        ch = height;
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
            
            const bgm = document.getElementById('bgm_main');
            bgm.volume = 0.2;
        } else {
            particles.forEach(p => {
                p.x = Math.min(p.x, cw - p.radius);
                p.y = Math.min(p.y, ch - p.radius);
            });
        }
    });
    
    ro.observe(canvas);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', handleInput, { passive: false });
    canvas.addEventListener('pointercancel', handleInput, { passive: false });

    document.getElementById('color-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        
        paletteIndex = (paletteIndex + 1) % colorPalette.length;
        const newColor = colorPalette[paletteIndex];
        
        window.updateGameConfig('themeColor', newColor);
        audioManager.playSfx('ui', 1.12, 0.16);
        feedbackManager.show('status-gif', 'GIFT SIGNAL SHIFT', 720);
        vibrate('light');
    });

    document.getElementById('btn-0x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(0); });
    document.getElementById('btn-1x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(1); });
    document.getElementById('btn-2x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(2); });
    document.getElementById('btn-3x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(3); });

    document.getElementById('move-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        moveChunk();
    });

    document.getElementById('reset-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        setTimeScale(1);
        initGame();
        audioManager.playSfx('pause', 0.82, 0.22);
        feedbackManager.show('status-gif', 'CARD RESET', 900);
        vibrate('heavy');
    });

    // Settings UI Listeners
    const settingsPanel = document.getElementById('settings-panel');
    
    document.getElementById('settings-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        settingsPanel.classList.remove('hidden');
        audioManager.playSfx('ui', 1, 0.18);
        feedbackManager.show('status-gif', 'MOM SETTINGS OPEN', 760);
        vibrate('light');
    });

    document.getElementById('close-settings').addEventListener('click', (e) => {
        e.stopPropagation();
        settingsPanel.classList.add('hidden');
        audioManager.playSfx('pause', 1.06, 0.16);
        feedbackManager.show('status-gif', 'MOM SETTINGS CLOSED', 760);
        vibrate('light');
    });

    // Prevent clicks inside the panel from closing it if we add a backdrop click later
    settingsPanel.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
    });

    document.getElementById('gfx-medium').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('medium'); });
    document.getElementById('gfx-high').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('high'); });
    document.getElementById('gfx-ultra').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('ultra'); });

    document.getElementById('snd-on').addEventListener('click', (e) => { e.stopPropagation(); setSoundEnabled(true); });
    document.getElementById('snd-off').addEventListener('click', (e) => { e.stopPropagation(); setSoundEnabled(false); });
});
</script>

</body></html>
