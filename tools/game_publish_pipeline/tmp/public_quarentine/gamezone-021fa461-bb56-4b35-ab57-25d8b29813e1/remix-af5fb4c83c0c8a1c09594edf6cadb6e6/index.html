<style>
    :root {
        --bg: #050611;
        --bg-deep: #081409;
        --panel: rgba(8, 18, 27, 0.78);
        --panel-strong: rgba(7, 22, 18, 0.93);
        --line: rgba(57, 255, 136, 0.26);
        --line-strong: rgba(57, 255, 136, 0.68);
        --text: #eafff4;
        --muted: #9fc7bd;
        --glow: #39ff88;
        --glow-soft: rgba(57, 255, 136, 0.18);
        --warn: #ff4fba;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 46% 42%, rgba(57, 255, 136, 0.16), transparent 34%),
            radial-gradient(circle at top, rgba(155, 244, 255, 0.12), transparent 32%),
            radial-gradient(circle at 50% 120%, rgba(255, 228, 94, 0.1), transparent 30%),
            linear-gradient(180deg, #07130c 0%, var(--bg) 58%, #030407 100%);
        color: var(--text);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    body { position: relative; }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.3;
        background:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 100% 3px, 3px 100%;
        mix-blend-mode: screen;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass {
        background:
            linear-gradient(180deg, rgba(23, 31, 60, 0.88), rgba(10, 14, 28, 0.78)),
            rgba(20, 22, 28, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
            0 0 0 1px rgba(102, 230, 255, 0.08),
            0 12px 32px rgba(0,0,0,0.35);
    }
    #game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; }
    #game-container::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 18%, rgba(255,255,255,0.18) 0 1px, transparent 1.2px),
            radial-gradient(circle at 72% 12%, rgba(102,230,255,0.28) 0 1.2px, transparent 1.4px),
            radial-gradient(circle at 84% 32%, rgba(255,255,255,0.14) 0 1px, transparent 1.2px),
            radial-gradient(circle at 15% 78%, rgba(255,79,139,0.18) 0 1.2px, transparent 1.5px);
        opacity: 0.9;
    }
    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
            calc(env(safe-area-inset-top, 0px) + 1rem)
            calc(env(safe-area-inset-right, 0px) + 1rem)
            calc(env(safe-area-inset-bottom, 0px) + 1rem)
            calc(env(safe-area-inset-left, 0px) + 1rem);
        pointer-events: none;
    }
    #hud { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 0.5rem; }
    #settings-panel {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
            calc(env(safe-area-inset-top, 0px) + 1rem)
            calc(env(safe-area-inset-right, 0px) + 1rem)
            calc(env(safe-area-inset-bottom, 0px) + 1rem)
            calc(env(safe-area-inset-left, 0px) + 1rem);
        background: rgba(2, 4, 10, 0.82);
        backdrop-filter: blur(8px);
    }
    #settings-panel.hidden { display: none !important; }
    #settings-panel .panel-card {
        padding: 1.25rem;
        border-radius: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: min(20rem, 100%);
        max-height: 90vh;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(180deg, rgba(15, 23, 48, 0.98), rgba(8, 12, 23, 0.94));
    }
    #hint {
        text-align: center;
        color: var(--muted);
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: 1rem;
        letter-spacing: 0.16em;
        margin-bottom: 2rem;
        text-shadow: 0 0 16px rgba(102, 230, 255, 0.32);
        pointer-events: none;
        animation: pulse 2s infinite;
    }
    .interactive { pointer-events: auto; }
    .hidden { display: none !important; }
    .hud-card {
        padding: 0.55rem 0.8rem;
        border-radius: 0.8rem;
        font-size: 1rem;
        letter-spacing: 0.12em;
        color: var(--text);
        font-family: 'Orbitron', system-ui, sans-serif;
        text-transform: uppercase;
        border-color: var(--line-strong);
        background:
            linear-gradient(180deg, rgba(22, 34, 70, 0.92), rgba(10, 15, 30, 0.88));
        box-shadow:

            0 10px 28px rgba(0, 0, 0, 0.3),

    }
    .hud-card .value-strong { color: #fff; text-shadow: 0 0 10px rgba(102,230,255,0.45); }

        display: inline-block;
        margin-top: 0.25rem;
        font-size: 0.68rem;
        opacity: 0.8;
        color: var(--muted);
    }
    .hud-actions { display: flex; flex-direction: column; gap: 0.5rem; width: 12rem; }
    .row { display: flex; align-items: center; gap: 0.5rem; }
    .button-row { display: flex; gap: 0.25rem; width: 100%; justify-content: space-between; }
    .preview-dot {
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 2px solid rgba(255,255,255,0.45);
        box-shadow: 0 0 18px rgba(255,255,255,0.2);
        transition: all 200ms;
        flex-shrink: 0;
        position: relative;
    }
    .preview-dot::after {
        content: "";
        position: absolute;
        inset: -0.3rem;
        border-radius: inherit;
        border: 1px solid rgba(255,255,255,0.22);
        opacity: 0.9;
    }
    button { font: inherit; cursor: pointer; }
    .action-btn, .small-btn {
        color: #fff;
        background:
            linear-gradient(180deg, rgba(16, 24, 52, 0.95), rgba(7, 10, 20, 0.92));
        border: 1px solid rgba(126, 213, 255, 0.18);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.06),
            0 0 0 1px rgba(102, 230, 255, 0.05);
        transition: transform 150ms, background-color 150ms, border-color 150ms, box-shadow 150ms, filter 150ms;
        font-weight: 600;
        text-align: center;
        text-shadow: 0 0 8px rgba(102, 230, 255, 0.24);
    }
    .action-btn {
        padding: 0.72rem 0.95rem;
        border-radius: 0.75rem;
        font-size: 0.92rem;
        letter-spacing: 0.08em;
        width: 100%;
        font-family: 'Orbitron', system-ui, sans-serif;
    }
    .small-btn {
        padding: 0.5rem 0.25rem;
        border-radius: 0.65rem;
        font-size: 0.72rem;
        flex: 1;
    }
    .modal-title {
        font-size: 1.55rem;
        color: #fff;
        text-align: center;
        font-weight: 400;
        letter-spacing: 0.14em;
        font-family: 'Orbitron', system-ui, sans-serif;
        font-family: 'Bangers', 'Orbitron', system-ui, sans-serif;
        text-shadow: 0 0 14px rgba(57, 255, 136, 0.3), 0 2px 0 rgba(0,0,0,0.35);
        margin: 0;
    }
    .modal-label {
        color: var(--muted);
        font-size: 0.95rem;
        letter-spacing: 0.12em;
        font-family: 'Orbitron', system-ui, sans-serif;
    }
    .modal-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .modal-actions { display: flex; gap: 0.5rem; }
    button:hover { background-color: rgba(255,255,255,0.08); border-color: rgba(102, 230, 255, 0.45); }
    button:active { transform: scale(0.95); filter: brightness(1.08); }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
    @media (min-width: 640px) {
        #ui-layer {
            padding:
                calc(env(safe-area-inset-top, 0px) + 1.5rem)
                calc(env(safe-area-inset-right, 0px) + 1.5rem)
                calc(env(safe-area-inset-bottom, 0px) + 1.5rem)
                calc(env(safe-area-inset-left, 0px) + 1.5rem);
        }
        .hud-card { font-size: 1.15rem; padding-top: 0.75rem; padding-bottom: 0.75rem; }
    }
    #feedback-layer {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.55rem;
        width: min(10rem, 36vw);
        pointer-events: none;
    }
    .feedback-gif {
        width: 100%;
        max-width: 8.25rem;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(120, 210, 255, 0.32);
        box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 18px rgba(102, 230, 255, 0.18);
        opacity: 0;
        transform: translateY(0.5rem) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        background: rgba(5, 10, 20, 0.65);
    }
    .feedback-gif.visible {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }
    .feedback-label {
        padding: 0.38rem 0.65rem;
        border-radius: 999px;
        background: rgba(5, 10, 20, 0.82);
        border: 1px solid rgba(120, 210, 255, 0.24);
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: 0.66rem;
        letter-spacing: 0.16em;
        color: var(--text);
        text-transform: uppercase;
        box-shadow: 0 6px 18px rgba(0,0,0,0.24);
        opacity: 0;
        transform: translateY(0.35rem);
        transition: opacity 180ms ease, transform 180ms ease;
    }
    .feedback-label.visible {
        opacity: 1;
        transform: translateY(0);
    }
    @media (max-width: 640px) {
        #hud { gap: 0.75rem; }
        .hud-actions { width: 10.5rem; }
        .action-btn { font-size: 0.82rem; padding: 0.65rem 0.72rem; }
        .small-btn { font-size: 0.7rem; }
        .hud-card { max-width: calc(100% - 11.5rem); }
        #hint { font-size: 0.8rem; margin-bottom: 1.5rem; }
        #feedback-layer {
            right: 0.75rem;
            bottom: 0.75rem;
            width: min(7rem, 28vw);
        }
        .feedback-label {
            font-size: 0.56rem;
            letter-spacing: 0.12em;
        }
    }
</style>

<style>
/* [visuals-unified-rick-morty]
   Visual-only Rick & Morty procedural pass.
   Preserve: gameplay logic, controls, hitboxes, scoring, timing.
*/
:root {
  --rm-space: #07120f;
  --rm-deep: #10142f;
  --rm-toxic: #b9ff2f;
  --rm-portal: #39ff88;
  --rm-cyan: #39e8ff;
  --rm-morty: #ffd54a;
  --rm-rick: #bff6ff;
  --rm-purple: #7c4dff;
  --rm-panel: rgba(6, 22, 25, .76);
  --rm-panel-2: rgba(13, 28, 51, .72);
  --rm-line: rgba(83, 255, 158, .55);
  --rm-font-display: "Trebuchet MS", "Arial Black", Impact, system-ui, sans-serif;
  --rm-font-body: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

html, body {
  min-height: 100%;
  background:
    radial-gradient(circle at 18% 16%, rgba(57,255,136,.20), transparent 24%),
    radial-gradient(circle at 80% 12%, rgba(57,232,255,.16), transparent 25%),
    linear-gradient(145deg, var(--rm-space), var(--rm-deep) 58%, #16081f);
  color: #ecfff3;
  font-family: var(--rm-font-body);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: -16vmax;
  pointer-events: none;
  z-index: -3;
  background:
    radial-gradient(circle at 30% 35%, transparent 0 8%, rgba(185,255,47,.45) 8.5% 10%, transparent 10.5% 15%, rgba(57,255,136,.28) 15.5% 17.5%, transparent 18%),
    radial-gradient(circle at 70% 66%, transparent 0 5%, rgba(57,232,255,.35) 5.5% 7%, transparent 7.5% 11%, rgba(124,77,255,.22) 11.5% 13%, transparent 13.5%),
    conic-gradient(from 90deg at 50% 50%, rgba(57,255,136,.08), rgba(57,232,255,.02), rgba(185,255,47,.09), rgba(124,77,255,.05), rgba(57,255,136,.08));
  filter: blur(.2px) saturate(1.25);
  animation: rmPortalDrift 22s linear infinite;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -2;
  opacity: .5;
  background-image:
    linear-gradient(rgba(57,255,136,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(57,232,255,.06) 1px, transparent 1px),
    radial-gradient(circle, rgba(255,213,74,.4) 0 1px, transparent 1.5px);
  background-size: 42px 42px, 42px 42px, 91px 73px;
  mask-image: radial-gradient(ellipse at center, black 0 68%, transparent 92%);
  animation: rmGridFloat 18s ease-in-out infinite alternate;
}

@keyframes rmPortalDrift {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.06); }
  100% { transform: rotate(360deg) scale(1); }
}
@keyframes rmGridFloat {
  from { background-position: 0 0, 0 0, 0 0; }
  to { background-position: 36px 54px, -28px 18px, 68px -44px; }
}
@keyframes rmPortalPulse {
  0%, 100% { transform: translate3d(0,0,0) scale(1); opacity: .82; }
  50% { transform: translate3d(0,-7px,0) scale(1.035); opacity: 1; }
}
@keyframes rmScanner {
  from { transform: translateX(-120%) skewX(-18deg); }
  to { transform: translateX(220%) skewX(-18deg); }
}
@keyframes rmOrbit {
  to { transform: rotate(360deg); }
}
@keyframes rmBob {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-5px) rotate(1deg); }
}

#rm-procedural-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
  contain: layout paint;
}

#rm-procedural-bg .rm-portal {
  position: absolute;
  width: clamp(150px, 34vw, 340px);
  aspect-ratio: 1;
  border-radius: 50%;
  left: var(--x);
  top: var(--y);
  opacity: var(--o, .58);
  background:
    radial-gradient(circle, rgba(11,28,17,.08) 0 18%, rgba(185,255,47,.78) 20% 23%, transparent 24% 31%, rgba(57,255,136,.72) 32% 36%, transparent 37% 47%, rgba(57,232,255,.35) 48% 51%, transparent 52%),
    conic-gradient(from 0deg, rgba(57,255,136,.0), rgba(185,255,47,.8), rgba(57,232,255,.38), rgba(185,255,47,.62), rgba(57,255,136,.0));
  box-shadow: 0 0 28px rgba(57,255,136,.32), inset 0 0 24px rgba(185,255,47,.38);
  filter: blur(.25px);
  animation: rmPortalPulse calc(6s + var(--i)*1s) ease-in-out infinite;
}

#rm-procedural-bg .rm-portal::before,
#rm-procedural-bg .rm-portal::after {
  content: "";
  position: absolute;
  inset: 11%;
  border-radius: inherit;
  border: 2px dashed rgba(222,255,134,.62);
  animation: rmOrbit calc(11s + var(--i)*2s) linear infinite;
}
#rm-procedural-bg .rm-portal::after {
  inset: 25%;
  border-color: rgba(57,232,255,.45);
  animation-duration: calc(8s + var(--i)*1.4s);
  animation-direction: reverse;
}

#rm-procedural-bg .rm-silhouette {
  position: absolute;
  right: clamp(10px, 5vw, 46px);
  bottom: clamp(14px, 5vh, 48px);
  width: clamp(86px, 18vw, 155px);
  aspect-ratio: .72;
  opacity: .36;
  animation: rmBob 5.5s ease-in-out infinite;
}
#rm-procedural-bg .rm-silhouette::before {
  content: "";
  position: absolute;
  left: 19%;
  top: 8%;
  width: 62%;
  height: 34%;
  border-radius: 49% 52% 43% 46%;
  background:
    radial-gradient(circle at 37% 45%, #fff 0 5%, #10142f 5.5% 8%, transparent 8.5%),
    radial-gradient(circle at 66% 44%, #fff 0 5%, #10142f 5.5% 8%, transparent 8.5%),
    linear-gradient(180deg, var(--rm-rick), #87d8e5);
  box-shadow:
    -18px -10px 0 -8px var(--rm-rick),
    18px -11px 0 -8px var(--rm-rick),
    -25px 1px 0 -12px var(--rm-rick),
    25px 2px 0 -12px var(--rm-rick),
    0 0 22px rgba(57,232,255,.5);
}
#rm-procedural-bg .rm-silhouette::after {
  content: "";
  position: absolute;
  left: 25%;
  bottom: 4%;
  width: 50%;
  height: 58%;
  border-radius: 24% 24% 12% 12%;
  background:
    linear-gradient(90deg, transparent 0 18%, rgba(185,255,47,.85) 18% 26%, transparent 26% 74%, rgba(185,255,47,.85) 74% 82%, transparent 82%),
    linear-gradient(180deg, #f4fbff 0 40%, #83d8e8 40% 43%, #f4fbff 43% 100%);
  box-shadow: 0 0 0 2px rgba(6,22,25,.55), 0 0 20px rgba(185,255,47,.22);
}

#rm-procedural-bg .rm-blip {
  position: absolute;
  width: 5px;
  height: 5px;
  left: var(--x);
  top: var(--y);
  border-radius: 50%;
  background: var(--c, var(--rm-toxic));
  box-shadow: 0 0 12px currentColor;
  opacity: .55;
  animation: rmBob calc(3s + var(--i)*.3s) ease-in-out infinite;
}

  box-shadow: 0 0 9px rgba(185,255,47,.82);
}

@media (max-width: 520px) {

@media (prefers-reduced-motion: reduce) {

  }
}
</style>

<script>
/**
 * §2 System Invariants & Architecture
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const dpr = window.devicePixelRatio || 1;

// Global State
let cw = 0, ch = 0;
let initialized = false;
let gameState = 'PLAYING';
let timeScale = 1; // 0, 1, 2, 3
let lastTime = 0;
let particles = [];
let totalMass = 0;
let nextSpawnColor = '#B302FC';

// New Settings State
let soundEnabled = true;
let graphicsLevel = 'ultra'; // 'medium', 'high', 'ultra'

// Input State
const inputState = {
    active: false,
    x: 0,
    y: 0,
    spawnTimer: 0
};

// 10 More Colors Palette
const colorPalette = [
    '#B302FC', // Original Purple
    '#FF3366', // Neon Pink
    '#00FFCC', // Cyan
    '#FFCC00', // Yellow
    '#FF6600', // Orange
    '#00FF00', // Lime Green
    '#3366FF', // Royal Blue
    '#FF00FF', // Magenta
    '#FFFFFF', // White
    '#FF3333', // Red
    '#99FF33'  // Yellow-Green
];
let paletteIndex = 0;

// Config Proxy
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = new Proxy({}, {
    get: (target, prop) => gameConfigDefs[prop]?.value
});
window.gameConfigDefs = gameConfigDefs;
window.gameConfig = gameConfig;
window.updateGameConfig = (key, val) => {
    if (gameConfigDefs[key]) {
        gameConfigDefs[key].value = val;
        if (key === 'particleCount') initGame();
        if (key === 'themeColor') {
            nextSpawnColor = val;
            updateColorPreview();
        }
    }
};

function updateColorPreview() {
    const preview = document.getElementById('color-preview');
    if (preview) {
        preview.style.backgroundColor = nextSpawnColor;
        preview.style.boxShadow = `0 0 15px ${nextSpawnColor}80, 0 0 30px ${nextSpawnColor}40`;
    }
}

// Audio System (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const audioBuffers = {};
let bgmStarted = false;

const feedbackManager = {
    timers: {},
    show(id, label, duration = 900) {
        const el = document.getElementById(id);
        const labelEl = document.getElementById('feedback-label');
        if (!el || !labelEl) return;
        el.classList.add('visible');
        labelEl.textContent = label;
        labelEl.classList.add('visible');
        clearTimeout(this.timers[id]);
        clearTimeout(this.timers.label);
        this.timers[id] = setTimeout(() => el.classList.remove('visible'), duration);
        this.timers.label = setTimeout(() => labelEl.classList.remove('visible'), duration + 140);
    }
};

const audioManager = {
    init: async () => {
        if (!audioCtx) audioCtx = new AudioContext();
        
        const loadBuffer = async (id, src) => {
            try {
                const url = new URL(src, window.location.href);
                // [agent-note][stage4] Remote catalog SFX are optional; avoid CORS-blocked WebAudio fetches that create console errors on mobile validation.
                if (url.origin !== window.location.origin) return;
                const res = await fetch(url.href);
                if (!res.ok) return;
                const arrayBuffer = await res.arrayBuffer();
                audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                // Optional SFX fall back silently to procedural synth/no-op paths; gameplay and controls do not depend on decoded buffers.
            }
        };

        await Promise.all([
            loadBuffer('collide', document.getElementById('sfx_collide').src),
            loadBuffer('spawn', document.getElementById('sfx_spawn').src),
            loadBuffer('ui', document.getElementById('sfx_ui').src),
            loadBuffer('pause', document.getElementById('sfx_pause').src)
        ]);
    },
    
    resume: () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        if (!soundEnabled) return;
        const bgm = document.getElementById('bgm_main');
        if (!bgmStarted) {
            bgm.play().then(() => { bgmStarted = true; }).catch(() => {});
        } else if (bgm.paused) {
            bgm.play().catch(() => {});
        }
    },

    playSfx: function(id, pitch = 1.0, vol = 0.5) {
        if (!soundEnabled || !audioCtx || !audioBuffers[id]) return;
        
        const now = audioCtx.currentTime;
        if (id === 'collide') {
            if (this.lastCollide && now - this.lastCollide < 0.05) return;
            this.lastCollide = now;
        }

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[id];
        source.playbackRate.value = pitch;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = vol;
        
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
    },

    synthesize: (type) => {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'spawn') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }
    }
};

// Vibration Bridge
const vibrate = (style) => {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 20 : 5);
};

/**
 * §3 Game Logic
 */

class Particle {
    constructor(x, y, mass, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        // Mass set to 1 to ensure Mass == Count
        this.mass = 1;
        this.radius = 4;
        this.color = color;
        this.glowPhase = Math.random() * Math.PI * 2;
    }

    update(dt) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.glowPhase += dt * 3;

        const damping = 0.8;
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -damping; }
        if (this.x > cw - this.radius) { this.x = cw - this.radius; this.vx *= -damping; }
        if (this.y < this.radius) { this.y = this.radius; this.vy *= -damping; }
        if (this.y > ch - this.radius) { this.y = ch - this.radius; this.vy *= -damping; }
    }

    draw(ctx) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;
        
        // Stage 2 visual pass: polish swarm particles into vivid micro-comets without changing collision or size behavior.
        if (graphicsLevel === 'ultra') {
            const glowIntensity = 0.24 + Math.sin(this.glowPhase) * 0.12;
            const tailX = this.x - this.vx * 1.5;
            const tailY = this.y - this.vy * 1.5;
            const trail = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
            trail.addColorStop(0, this.color + '55');
            trail.addColorStop(1, this.color + '00');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 3.5, 0, Math.PI * 2);
            ctx.fillStyle = this.color + Math.floor(glowIntensity * 255).toString(16).padStart(2, '0');
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(tailX, tailY);
            ctx.strokeStyle = trail;
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        const coreGradient = ctx.createRadialGradient(
            this.x - this.radius * 0.35, this.y - this.radius * 0.35, 0,
            this.x, this.y, this.radius
        );
        coreGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        coreGradient.addColorStop(0.22, this.color);
        coreGradient.addColorStop(1, this.color + 'bb');
        ctx.fillStyle = coreGradient;
        ctx.fill();
        
        if (graphicsLevel === 'ultra' || graphicsLevel === 'high') {
            ctx.beginPath();
            ctx.arc(this.x - this.radius*0.34, this.y - this.radius*0.34, Math.max(0, this.radius * 0.45), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 1.4, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }
}

function initGame() {
    particles = [];
    totalMass = 0;
    nextSpawnColor = gameConfig.themeColor;
    updateColorPreview();
    const count = gameConfig.particleCount;
    
    for (let i = 0; i < count; i++) {
        spawnParticle(
            Math.random() * (cw - 40) + 20,
            Math.random() * (ch - 40) + 20,
            1
        );
    }
    updateHUD();
}

function spawnParticle(x, y, mass) {
    const p = new Particle(x, y, mass, nextSpawnColor);
    particles.push(p);
    totalMass += p.mass;
}

function updateHUD() {
    document.getElementById('score-val').textContent = Math.floor(totalMass);
    document.getElementById('count-val').textContent = particles.length;
}

function moveChunk() {
    const len = particles.length;
    if (!len) {
        audioManager.playSfx('pause', 0.95, 0.2);
        feedbackManager.show('status-gif', 'NO ANOMALIES TO PULSE', 900);
        return;
    }
    for (let i = 0; i < len; i++) {
        const p = particles[i];
        const angle = Math.random() * Math.PI * 2;
        const impulse = 2 + Math.random() * 4;
        p.vx += Math.cos(angle) * impulse;
        p.vy += Math.sin(angle) * impulse;
    }
    audioManager.synthesize('spawn');
    audioManager.playSfx('ui', 1.08, 0.2);
    feedbackManager.show('status-gif', 'PORTAL PULSE CASCADE', 800);
    vibrate('medium');
}

function physicsStep(dt, isSubStep = false) {
    const G = gameConfig.gravity;
    const friction = gameConfig.friction;

    // 0. Handle Spawning (NO LIMIT)
    if (!isSubStep && inputState.active) {
        inputState.spawnTimer -= dt;
        let spawnedThisFrame = 0;
        while (inputState.spawnTimer <= 0) {
            const ox = (Math.random() - 0.5) * 20; 
            const oy = (Math.random() - 0.5) * 20;
            spawnParticle(inputState.x + ox, inputState.y + oy, 1);
            inputState.spawnTimer += 0.002; // 500 particles per second
            spawnedThisFrame++;
        }
        
        if (spawnedThisFrame > 0) {
            const pitch = 0.8 + Math.random() * 0.4;
            audioManager.playSfx('spawn', pitch, 0.1);
            vibrate('light');
        }
        
        if (inputState.spawnTimer < 0) inputState.spawnTimer = 0;
    }

    if (timeScale > 0) {
        // 1. Apply Gravity (N-body)
        const len = particles.length;
        for (let i = 0; i < len; i++) {
            const p1 = particles[i];
            
            for (let j = i + 1; j < len; j++) {
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < 1) continue; 

                const dist = Math.sqrt(distSq);
                const force = (G * p1.mass * p2.mass) / Math.max(distSq, 100);
                const ax = (dx / dist) * force;
                const ay = (dy / dist) * force;

                p1.vx += ax / p1.mass;
                p1.vy += ay / p1.mass;
                p2.vx -= ax / p2.mass;
                p2.vy -= ay / p2.mass;
            }

            p1.vx *= friction;
            p1.vy *= friction;
        }

        // 2. Move
        for (let i = 0; i < len; i++) {
            particles[i].update(dt);
        }

        // 3. Collision Resolution
        for (let i = 0; i < len; i++) {
            for (let j = i + 1; j < len; j++) {
                const p1 = particles[i];
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                const minDist = p1.radius + p2.radius;

                if (distSq < minDist * minDist) {
                    const dist = Math.sqrt(distSq);
                    if (dist === 0) continue;
                    
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const overlap = (minDist - dist) * 0.5;
                    p1.x -= nx * overlap;
                    p1.y -= ny * overlap;
                    p2.x += nx * overlap;
                    p2.y += ny * overlap;

                    const dvx = p2.vx - p1.vx;
                    const dvy = p2.vy - p1.vy;
                    const velAlongNormal = dvx * nx + dvy * ny;

                    if (velAlongNormal > 0) continue;

                    const restitution = 0.8;
                    const impulse = -(1 + restitution) * velAlongNormal / (1/p1.mass + 1/p2.mass);
                    
                    const ix = impulse * nx;
                    const iy = impulse * ny;

                    p1.vx -= ix / p1.mass;
                    p1.vy -= iy / p1.mass;
                    p2.vx += ix / p2.mass;
                    p2.vy += iy / p2.mass;

                    const impact = Math.abs(velAlongNormal);
                    if (impact > 1.0) {
                        const vol = Math.min(1.0, impact * 0.1);
                        const pitch = Math.max(0.5, 2.0 - (p1.mass + p2.mass) * 0.1);
                        audioManager.playSfx('collide', pitch, vol);
                        if (impact > 2.6) feedbackManager.show('impact-gif', 'PORTAL FRACTURE', 520);
                        if (impact > 3.0) vibrate('medium');
                    }
                }
            }
        }
    }

    if (!isSubStep && (inputState.active || (particles.length > 0 && Math.random() < 0.1))) updateHUD();
}

function draw() {
    const t = performance.now() * 0.001;
    const playfieldGradient = ctx.createLinearGradient(0, 0, 0, ch);
    playfieldGradient.addColorStop(0, '#07120d');
    playfieldGradient.addColorStop(0.48, '#060817');
    playfieldGradient.addColorStop(1, '#020307');
    ctx.fillStyle = playfieldGradient;
    ctx.fillRect(0, 0, cw, ch);

    // [agent-note][world-design-superprompt] background: authored procedural portal-garage scene; decorative only, mechanics protected.
    const portalX = cw * 0.5;
    const portalY = ch * 0.5;
    const portalR = Math.min(cw, ch) * 0.34;
    const portalGlow = ctx.createRadialGradient(portalX, portalY, 0, portalX, portalY, portalR);
    portalGlow.addColorStop(0, 'rgba(57, 255, 136, 0.16)');
    portalGlow.addColorStop(0.36, 'rgba(102, 230, 255, 0.08)');
    portalGlow.addColorStop(0.72, 'rgba(182, 255, 46, 0.035)');
    portalGlow.addColorStop(1, 'rgba(57, 255, 136, 0)');
    ctx.fillStyle = portalGlow;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.translate(portalX, portalY);
    for (let r = 0; r < 5; r++) {
        const radius = portalR * (0.42 + r * 0.12) + Math.sin(t * 0.8 + r) * 3;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.strokeStyle = r % 2 ? 'rgba(102, 230, 255, 0.16)' : 'rgba(57, 255, 136, 0.2)';
        ctx.lineWidth = r === 0 ? 3 : 1.4;
        ctx.setLineDash(r % 2 ? [10, 14] : [24, 18]);
        ctx.lineDashOffset = -t * (10 + r * 2);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();

    const labGlow = ctx.createRadialGradient(cw * 0.14, ch * 0.9, 0, cw * 0.14, ch * 0.9, cw * 0.42);
    labGlow.addColorStop(0, 'rgba(255, 228, 94, 0.12)');
    labGlow.addColorStop(1, 'rgba(255, 228, 94, 0)');
    ctx.fillStyle = labGlow;
    ctx.fillRect(0, 0, cw, ch);

    if (graphicsLevel !== 'medium') {
        ctx.save();
        ctx.strokeStyle = 'rgba(57, 255, 136, 0.12)';
        ctx.lineWidth = 1;
        for (let x = 0; x < cw; x += 56) {
            const y = (x * 0.31 + t * 18) % Math.max(ch, 1);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 18, y);
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(155, 244, 255, 0.12)';
        for (let i = 0; i < 26; i++) {
            const sx = (i * 173 + Math.sin(t + i) * 8) % Math.max(cw, 1);
            const sy = (i * 97 + t * (4 + (i % 3))) % Math.max(ch, 1);
            ctx.beginPath();
            ctx.arc(sx, sy, 1.2 + (i % 3) * 0.35, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(4, 8, 12, 0.44)';
        ctx.fillRect(0, ch - 42, cw, 42);
        ctx.strokeStyle = 'rgba(57, 255, 136, 0.16)';
        ctx.beginPath();
        ctx.moveTo(0, ch - 42);
        ctx.lineTo(cw, ch - 42);
        ctx.stroke();
        ctx.restore();
    }

    if (timeScale === 0) {
        ctx.fillStyle = 'rgba(102, 230, 255, 0.05)';
        ctx.fillRect(0, 0, cw, ch);
        
        ctx.strokeStyle = 'rgba(102, 230, 255, 0.32)';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, cw - 4, ch - 4);
    }

    if (inputState.active) {
        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 39, 0, Math.PI * 2);
        ctx.strokeStyle = nextSpawnColor + '55';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 29, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.setLineDash([4, 6]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = nextSpawnColor + '30';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 8, 0, Math.PI * 2);
        const spawnGradient = ctx.createRadialGradient(inputState.x - 2, inputState.y - 2, 0, inputState.x, inputState.y, 10);
        spawnGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        spawnGradient.addColorStop(0.25, nextSpawnColor);
        spawnGradient.addColorStop(1, nextSpawnColor + 'aa');
        ctx.fillStyle = spawnGradient;
        ctx.fill();
    }

    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (timeScale === 0) {
            physicsStep(dt, false);
        } else {
            for (let i = 0; i < timeScale; i++) {
                physicsStep(dt, i > 0);
            }
        }
        draw();
    } catch (e) {
        console.error("Loop Error", e);
    }

    requestAnimationFrame(loop);
}

/**
 * §4 Input & Lifecycle
 */

function handleInput(e) {
    e.preventDefault();
    audioManager.resume();
    
    const hint = document.getElementById('hint');
    if (hint && !hint.classList.contains('hidden')) hint.classList.add('hidden');

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        inputState.active = true;
        inputState.spawnTimer = 0;
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointermove') {
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        inputState.active = false;
    }
}

function setTimeScale(scale) {
    timeScale = scale;
    [0, 1, 2, 3].forEach(s => {
        const btn = document.getElementById(`btn-${s}x`);
        if (s === scale) {
            btn.style.color = '#22d3ee';
            btn.style.borderColor = '#22d3ee';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    audioManager.playSfx(scale === 0 ? 'pause' : 'ui', scale === 0 ? 0.94 : 1.04, 0.18);
    feedbackManager.show('status-gif', scale === 0 ? 'PORTAL HOLD' : `DIMENSION FLOW ${scale}X`, 720);
    vibrate('light');
}

function setGraphicsLevel(level) {
    graphicsLevel = level;
    ['medium', 'high', 'ultra'].forEach(l => {
        const btn = document.getElementById(`gfx-${l}`);
        if (l === level) {
            btn.style.color = '#22d3ee';
            btn.style.borderColor = '#22d3ee';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    audioManager.playSfx('ui', level === 'ultra' ? 1.1 : 1.0, 0.16);
    feedbackManager.show('status-gif', `VISUAL ${level.toUpperCase()}`, 720);
    vibrate('light');
}

function setSoundEnabled(enabled) {
    soundEnabled = enabled;
    const bgm = document.getElementById('bgm_main');
    
    if (enabled) {
        document.getElementById('snd-on').style.color = '#22d3ee';
        document.getElementById('snd-on').style.borderColor = '#22d3ee';
        document.getElementById('snd-off').style.color = 'white';
        document.getElementById('snd-off').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        bgm.play().then(() => { bgmStarted = true; }).catch(()=>{});
        feedbackManager.show('status-gif', 'GARAGE AUDIO ONLINE', 760);
    } else {
        document.getElementById('snd-off').style.color = '#22d3ee';
        document.getElementById('snd-off').style.borderColor = '#22d3ee';
        document.getElementById('snd-on').style.color = 'white';
        document.getElementById('snd-on').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        bgm.pause();
        feedbackManager.show('status-gif', 'GARAGE AUDIO MUTED', 760);
    }
    if (enabled) audioManager.playSfx('ui', 1, 0.18);
    vibrate('light');
}

document.addEventListener('DOMContentLoaded', () => {
    audioManager.init();

    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        const { width, height } = entry.contentRect;
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        
        cw = width;
        ch = height;
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
            
            const bgm = document.getElementById('bgm_main');
            bgm.volume = 0.2;
        } else {
            particles.forEach(p => {
                p.x = Math.min(p.x, cw - p.radius);
                p.y = Math.min(p.y, ch - p.radius);
            });
        }
    });
    
    ro.observe(canvas);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', handleInput, { passive: false });
    canvas.addEventListener('pointercancel', handleInput, { passive: false });

    document.getElementById('color-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        
        paletteIndex = (paletteIndex + 1) % colorPalette.length;
        const newColor = colorPalette[paletteIndex];
        
        window.updateGameConfig('themeColor', newColor);
        audioManager.playSfx('ui', 1.12, 0.16);
        feedbackManager.show('status-gif', 'SIGNAL SHIFT', 720);
        vibrate('light');
    });

    document.getElementById('btn-0x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(0); });
    document.getElementById('btn-1x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(1); });
    document.getElementById('btn-2x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(2); });
    document.getElementById('btn-3x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setTimeScale(3); });

    document.getElementById('move-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        moveChunk();
    });

    document.getElementById('reset-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        setTimeScale(1);
        initGame();
        audioManager.playSfx('pause', 0.82, 0.22);
        feedbackManager.show('status-gif', 'DIMENSION RESET', 900);
        vibrate('heavy');
    });

    // Settings UI Listeners
    const settingsPanel = document.getElementById('settings-panel');
    
    document.getElementById('settings-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        settingsPanel.classList.remove('hidden');
        audioManager.playSfx('ui', 1, 0.18);
        feedbackManager.show('status-gif', 'GARAGE DECK OPEN', 760);
        vibrate('light');
    });

    document.getElementById('close-settings').addEventListener('click', (e) => {
        e.stopPropagation();
        settingsPanel.classList.add('hidden');
        audioManager.playSfx('pause', 1.06, 0.16);
        feedbackManager.show('status-gif', 'GARAGE DECK CLOSED', 760);
        vibrate('light');
    });

    // Prevent clicks inside the panel from closing it if we add a backdrop click later
    settingsPanel.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
    });

    document.getElementById('gfx-medium').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('medium'); });
    document.getElementById('gfx-high').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('high'); });
    document.getElementById('gfx-ultra').addEventListener('click', (e) => { e.stopPropagation(); setGraphicsLevel('ultra'); });

    document.getElementById('snd-on').addEventListener('click', (e) => { e.stopPropagation(); setSoundEnabled(true); });
    document.getElementById('snd-off').addEventListener('click', (e) => { e.stopPropagation(); setSoundEnabled(false); });
});
</script>


<script>
// [visuals-unified-rick-morty]
// Non-gameplay procedural scene + compact HUD motif injection. Pointer-events remain none.
(function () {
  if (document.getElementById('rm-procedural-bg')) return;

  var bg = document.createElement('div');
  bg.id = 'rm-procedural-bg';
  bg.setAttribute('aria-hidden', 'true');

  [
    { x: '-7%', y: '8%', o: '.48' },
    { x: '67%', y: '5%', o: '.35' },
    { x: '6%', y: '62%', o: '.26' }
  ].forEach(function (p, i) {
    var portal = document.createElement('i');
    portal.className = 'rm-portal';
    portal.style.setProperty('--x', p.x);
    portal.style.setProperty('--y', p.y);
    portal.style.setProperty('--o', p.o);
    portal.style.setProperty('--i', i + 1);
    bg.appendChild(portal);
  });

  var silhouette = document.createElement('i');
  silhouette.className = 'rm-silhouette';
  bg.appendChild(silhouette);

  var colors = ['#b9ff2f', '#39ff88', '#39e8ff', '#ffd54a', '#7c4dff'];
  for (var i = 0; i < 28; i++) {
    var blip = document.createElement('i');
    blip.className = 'rm-blip';
    blip.style.setProperty('--x', (Math.random() * 96 + 2).toFixed(2) + '%');
    blip.style.setProperty('--y', (Math.random() * 92 + 4).toFixed(2) + '%');
    blip.style.setProperty('--i', i);
    blip.style.setProperty('--c', colors[i % colors.length]);
    bg.appendChild(blip);
  }

  document.body.prepend(bg);

  function addLevelChip() {
    if (document.querySelector('.rm-level-chip')) return;
    var target = document.querySelector('.hud, .stats, .status, header, .topbar, #score, .score');
    if (!target || !target.parentElement) return;
    var chip = document.createElement('span');
    chip.className = 'rm-level-chip';
    chip.textContent = 'Portal Run';
    target.appendChild(chip);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addLevelChip, { once: true });
  } else {
    addLevelChip();
  }
})();
</script>
