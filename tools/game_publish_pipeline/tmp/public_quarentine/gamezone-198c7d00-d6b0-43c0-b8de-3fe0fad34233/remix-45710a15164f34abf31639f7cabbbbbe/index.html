<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Approval Rush</title>
    <!-- [agent-note][stage3] resolved-font: display=Bangers | hud/ui=Orbitron | counters=Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #09111f;
            --bg-bottom: #182a4e;
            --panel-bg: rgba(9, 19, 40, 0.72);
            --panel-border: rgba(130, 224, 255, 0.42);
            --panel-highlight: rgba(255, 255, 255, 0.12);
            --shadow: 0 18px 45px rgba(1, 9, 22, 0.4);
            --green: #5eff95;
            --green-light: #8effba;
            --gold: #ffd95a;
            --gold-light: #fff19b;
            --red: #ff5a72;
            --red-dark: #d91d53;
            --text: #eff7ff;
            --muted: #bfd6ff;
            --blue: #56dcff;
            --blue-deep: #2e7bff;
            --sky: #183155;
            --line: rgba(142, 210, 255, 0.18);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(69, 173, 255, 0.18), transparent 30%),
                linear-gradient(180deg, var(--bg-top) 0%, #11213d 38%, var(--bg-bottom) 100%);
            font-family: 'Orbitron', system-ui, sans-serif;
            color: var(--text);
        }

        body {
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 15%, rgba(94, 255, 149, 0.1), transparent 18rem),
                radial-gradient(circle at 80% 10%, rgba(86, 220, 255, 0.18), transparent 22rem),
                radial-gradient(circle at 50% 100%, rgba(46, 123, 255, 0.16), transparent 24rem);
        }

        body::after {
            opacity: 0.18;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.65), transparent 82%);
        }

        canvas {
            display: block;
            touch-action: none;
            position: relative;
            z-index: 1;
        }

        .glass {
            position: relative;
            background:
                linear-gradient(180deg, rgba(15, 30, 58, 0.88), rgba(8, 18, 38, 0.74));
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--panel-highlight), transparent 42%);
            pointer-events: none;
        }

        .text-shadow {
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3), 0 0 16px rgba(86, 220, 255, 0.2);
        }

        .hidden {
            display: none !important;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 20%, rgba(255, 217, 90, 0.08), transparent 10rem),
                radial-gradient(circle at 70% 35%, rgba(94, 255, 149, 0.08), transparent 12rem);
            pointer-events: none;
            z-index: 1;
        }

        #ui-layer {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 0 rgba(94, 255, 149, 0), 0 12px 26px rgba(0, 0, 0, 0.28);
            }
            50% {
                box-shadow: 0 0 18px rgba(94, 255, 149, 0.45), 0 12px 26px rgba(0, 0, 0, 0.3);
            }
        }

        .hud {
            position: absolute;
            top: 1rem;
            left: 0;
            width: 100%;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            box-sizing: border-box;
            gap: 0.75rem;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
            padding: 0.65rem 0.8rem 0.7rem;
            border-radius: 1rem;
            border: 1px solid rgba(142, 210, 255, 0.28);
            background: linear-gradient(180deg, rgba(9, 26, 49, 0.78), rgba(7, 17, 34, 0.66));
            box-shadow: 0 10px 20px rgba(1, 9, 22, 0.24);
        }

        .hud-group.end {
            align-items: flex-end;
        }

        .hud-label {
            color: var(--muted);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.72rem, 2vw, 0.95rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .score-value {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.15rem, 3.5vw, 2rem);
            color: var(--green);
            line-height: 1.15;
        }

        .lives-value {
            font-size: clamp(1.35rem, 4vw, 2rem);
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255, 90, 114, 0.25));
        }

        .panel {
            padding: 1.5rem;
            border-radius: 1.5rem;
            text-align: center;
            max-width: min(90vw, 31rem);
            box-sizing: border-box;
        }

        .panel.interactive {
            transition: transform 250ms ease, box-shadow 250ms ease;
        }

        .panel.interactive:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.85rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: rgba(86, 220, 255, 0.12);
            border: 1px solid rgba(86, 220, 255, 0.26);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-chip::before {
            content: "●";
            color: var(--green);
            text-shadow: 0 0 10px rgba(94, 255, 149, 0.6);
        }

        .title {
            margin: 0 0 0.55rem;
            color: var(--gold);
            font-family: 'Bangers', 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2.35rem, 10vw, 4.8rem);
            line-height: 0.95;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-shadow:
                0 2px 0 rgba(0, 0, 0, 0.4),
                0 0 18px rgba(255, 217, 90, 0.2);
        }

        .subtitle,
        .body-copy {
            color: var(--text);
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            line-height: 1.35;
        }

        .subtitle {
            margin: 0 0 0.85rem;
            color: var(--muted);
            font-weight: 600;
        }

        .body-copy {
            margin: 0 0 0.35rem;
            font-weight: 600;
        }

        .body-copy strong {
            color: var(--gold-light);
        }

        .spacer-lg {
            margin-bottom: 1.4rem;
        }

        .btn {
            border: 0;
            color: #041324;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1rem, 3.8vw, 1.15rem);
            padding: 0.95rem 1.6rem;
            width: min(100%, 17rem);
            border-radius: 999px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
            cursor: pointer;
            transition: transform 120ms ease, filter 120ms ease, box-shadow 160ms ease;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            animation: pulseGlow 2.2s ease-in-out infinite;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:hover {
            filter: brightness(1.06);
        }

        .btn-start {
            background: linear-gradient(180deg, var(--green-light), var(--green));
        }

        .btn-restart {
            background: linear-gradient(180deg, var(--gold-light), var(--gold));
        }

        .game-over-title {
            margin: 0 0 0.75rem;
            color: var(--red);
            font-family: 'Bangers', 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2rem, 8vw, 3.6rem);
            line-height: 1;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .final-score {
            display: block;
            margin: 0 0 1.4rem;
            color: var(--green);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.8rem, 8vw, 3.8rem);
            line-height: 1.2;
        }

        .flavor-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin: 0 0 1rem;
            flex-wrap: wrap;
        }

        .flavor-pill {
            padding: 0.35rem 0.65rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 600;
        }

        .feedback-gif {
            position: absolute;
            right: 0.85rem;
            bottom: 1rem;
            width: min(26vw, 7.5rem);
            border-radius: 1rem;
            border: 1px solid rgba(142, 210, 255, 0.28);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(0.75rem) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 35;
            pointer-events: none;
            object-fit: cover;
            background: rgba(8, 18, 38, 0.35);
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 0.85rem;
            right: auto;
            width: min(30vw, 8.5rem);
        }

        @media (max-width: 640px) {
            .panel {
                padding: 1.25rem;
                max-width: min(92vw, 28rem);
            }

            .hud {
                padding: 0 0.75rem;
                top: 0.7rem;
            }

            .hud-group {
                padding: 0.55rem 0.7rem 0.6rem;
            }

            .title {
                font-size: clamp(2rem, 11vw, 3rem);
            }

            .subtitle,
            .body-copy {
                font-size: clamp(0.92rem, 3.8vw, 1.05rem);
            }

            .btn {
                font-size: 0.95rem;
                padding: 0.9rem 1.2rem;
            }
        }
    </style>
</head>

<script>
/**
 * CORE ENGINE & UTILS
 */
const CONFIG = {
    dpr: window.devicePixelRatio || 1,
    width: 0,
    height: 0,
    cx: 0,
    cy: 0
};

// Config Handling
window.gameConfigDefs = {
    "playerSpeed": { "type": "number", "label": "Thumb Speed", "value": 15, "min": 5, "max": 30 },
    "spawnRate": { "type": "number", "label": "Spawn Rate", "value": 1.2, "min": 0.5, "max": 3.0 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#FFD700" }
};
window.gameConfig = {
    playerSpeed: 15,
    spawnRate: 1.2,
    themeColor: "#FFD700"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor' && window.game) {
            window.game.player.color = val;
        }
    }
};

// Audio Manager
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgm = document.getElementById('bgm_main');
        this.sounds = {
            collect: document.getElementById('sfx_collect'),
            hit: document.getElementById('sfx_hit'),
            ui: document.getElementById('sfx_ui'),
            start: document.getElementById('sfx_start'),
            gameover: document.getElementById('sfx_gameover')
        };
        this.unlocked = false;
        this.lastPlayedAt = {};

        this.bgm.volume = 0.2;
        this.bgm.play().catch(() => {});
    }

    unlock() {
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        if (this.unlocked) return;
        this.unlocked = true;
        this.bgm.play().catch(() => {});
    }

    setLoopActive(active) {
        if (!this.bgm) return;
        if (!this.unlocked) return;
        if (active) {
            this.bgm.play().catch(() => {});
        } else {
            this.bgm.pause();
            this.bgm.currentTime = 0;
        }
    }

    playSfx(id, cooldown = 0) {
        const now = performance.now();
        if (cooldown && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        const el = this.sounds[id];
        if (el) {
            const clone = el.cloneNode();
            clone.volume = id === 'hit' ? 0.5 : 0.42;
            clone.play().catch(() => this.synthesize(id));
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'collect') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'hit' || type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'gameover' ? 40 : 50, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(type === 'gameover' ? 0.38 : 0.5, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (type === 'ui' || type === 'start') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(type === 'start' ? 540 : 420, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'start' ? 880 : 620, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        }
    }
}

/**
 * GAME ENTITIES
 */
class Particle {
    constructor(x, y, color, type) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type; // 'confetti' or 'text'
        this.life = 1.0;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10 - 5;
        this.size = Math.random() * 8 + 4;
        this.text = type === 'text' ? ['APPROVED!', 'LOCKED!', 'CLEAN!', '+1'][Math.floor(Math.random() * 4)] : '';
    }

    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.5;
        this.life -= dt * 1.5;
        if (this.type === 'text') this.y -= 2;
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.type === 'text') {
            ctx.fillStyle = this.color;
            ctx.font = '16px "Press Start 2P"';
            ctx.fillText(this.text, this.x, this.y);
        } else {
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
    }
}

class Item {
    constructor(type) {
        this.type = type; // 'good' or 'bad'
        this.r = 25;
        this.x = Math.random() * (CONFIG.width - 100) + 50;
        this.y = -50;
        this.speed = Math.random() * 200 + 200;
        this.angle = 0;
        this.rotSpeed = (Math.random() - 0.5) * 2;
        this.active = true;
        this.bob = Math.random() * Math.PI * 2;
    }

    update(dt, speedMult) {
        this.y += this.speed * speedMult * dt;
        this.angle += this.rotSpeed * dt;
        this.bob += dt * 6;
        if (this.y > CONFIG.height + 50) this.active = false;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y + Math.sin(this.bob) * 2);
        ctx.rotate(this.angle);

        if (this.type === 'good') {
            ctx.shadowColor = 'rgba(94, 255, 149, 0.55)';
            ctx.shadowBlur = 22;
            ctx.fillStyle = '#5eff95';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const outer = i % 2 === 0 ? this.r : this.r * 0.58;
                const a = (-Math.PI / 2) + (Math.PI / 4) * i;
                const px = Math.cos(a) * outer;
                const py = Math.sin(a) * outer;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#103251';
            ctx.beginPath();
            ctx.arc(0, 0, this.r * 0.47, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-7, 1);
            ctx.lineTo(-1, 8);
            ctx.lineTo(10, -7);
            ctx.stroke();
        } else {
            ctx.shadowColor = 'rgba(255, 90, 114, 0.45)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff5a72';
            ctx.strokeStyle = '#5e1027';
            ctx.lineWidth = 2;

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i;
                const px = Math.cos(a) * this.r;
                const py = Math.sin(a) * this.r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fff4f6';
            ctx.beginPath();
            ctx.arc(-7, -5, 3.3, 0, Math.PI * 2);
            ctx.arc(7, -5, 3.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fff4f6';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-9, 10);
            ctx.quadraticCurveTo(0, 2, 9, 10);
            ctx.stroke();
        }

        ctx.restore();
    }
}

class Player {
    constructor() {
        this.x = CONFIG.cx;
        this.y = CONFIG.height - 100;
        this.targetX = CONFIG.cx;
        this.r = 40;
        this.color = window.gameConfig.themeColor;
        this.scale = 1;
        this.blinkTimer = 0;
    }

    update(dt) {
        const diff = this.targetX - this.x;
        const speed = window.gameConfig.playerSpeed;
        this.x += diff * Math.min(1, speed * dt);
        this.scale += (1 - this.scale) * 10 * dt;
        this.blinkTimer += dt;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        ctx.shadowColor = 'rgba(86, 220, 255, 0.35)';
        ctx.shadowBlur = 24;

        ctx.fillStyle = '#14345e';
        ctx.beginPath();
        ctx.ellipse(0, 56, 44, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#06213d';
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const blink = Math.sin(this.blinkTimer * 2.5) > 0.96 ? 0.8 : 1;

        ctx.fillStyle = '#f8fdff';
        ctx.beginPath();
        ctx.moveTo(-10, -10);
        ctx.quadraticCurveTo(-15, -30, 0, -35);
        ctx.quadraticCurveTo(15, -30, 10, -10);
        ctx.lineTo(25, -5);
        ctx.quadraticCurveTo(35, 10, 20, 20);
        ctx.lineTo(-20, 20);
        ctx.quadraticCurveTo(-35, 10, -25, -5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#06213d';
        ctx.beginPath();
        ctx.ellipse(-10, -4, 3, 3 * blink, 0, 0, Math.PI * 2);
        ctx.ellipse(8, -6, 3, 3 * blink, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#06213d';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-4, 9);
        ctx.quadraticCurveTo(3, 15, 11, 8);
        ctx.stroke();

        ctx.fillStyle = '#56dcff';
        ctx.beginPath();
        ctx.arc(17, -19, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2e7bff';
        ctx.beginPath();
        ctx.rect(-20, 30, 40, 20);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath();
        ctx.ellipse(-10, -16, 12, 7, -0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    pulse() {
        this.scale = 1.3;
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioManager();

        this.state = 'START';
        this.score = 0;
        this.lives = 3;
        this.time = 0;
        this.difficulty = 1;

        this.player = new Player();
        this.items = [];
        this.particles = [];
        this.spawnTimer = 0;

        this.shake = 0;

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupInput();

        this.collectGif = document.getElementById('collect-gif');
        this.failGif = document.getElementById('fail-gif');
        this.feedbackTimers = { collect: 0, fail: 0 };

        this.lastTime = performance.now();
        requestAnimationFrame(t => this.loop(t));
    }

    resize() {
        const dpr = window.devicePixelRatio || 1;
        CONFIG.dpr = dpr;
        CONFIG.width = window.innerWidth;
        CONFIG.height = window.innerHeight;
        CONFIG.cx = CONFIG.width / 2;
        CONFIG.cy = CONFIG.height / 2;

        this.canvas.width = CONFIG.width * dpr;
        this.canvas.height = CONFIG.height * dpr;
        this.canvas.style.width = CONFIG.width + 'px';
        this.canvas.style.height = CONFIG.height + 'px';

        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (this.state === 'START') {
            this.player.x = CONFIG.cx;
            this.player.y = CONFIG.height - 100;
            this.player.targetX = CONFIG.cx;
        }
    }

    setupInput() {
        const onMove = (e) => {
            if (this.state !== 'PLAYING') return;
            e.preventDefault();
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            this.player.targetX = Math.max(this.player.r, Math.min(CONFIG.width - this.player.r, x));
        };

        const onStart = (e) => {
            e.preventDefault();
            this.audio.unlock();
            if (this.state === 'PLAYING') onMove(e);
        };

        this.canvas.addEventListener('pointerdown', onStart, { passive: false });
        this.canvas.addEventListener('pointermove', onMove, { passive: false });
        this.canvas.addEventListener('pointerup', (e) => e.preventDefault());
        this.canvas.addEventListener('pointercancel', (e) => e.preventDefault());

        document.getElementById('start-btn').addEventListener('click', () => this.startGame());
        document.getElementById('restart-btn').addEventListener('click', () => this.resetGame());

        ['start-btn', 'restart-btn'].forEach((id) => {
            const button = document.getElementById(id);
            button.addEventListener('pointerdown', () => this.audio.playSfx('ui', 90));
        });
    }

    startGame() {
        this.audio.unlock();
        this.audio.playSfx('start', 120);
        this.audio.setLoopActive(true);
        this.state = 'PLAYING';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.resetGameLogic();
    }

    resetGame() {
        this.startGame();
    }

    resetGameLogic() {
        this.score = 0;
        this.lives = 3;
        this.difficulty = 1;
        this.items = [];
        this.particles = [];
        this.player.x = CONFIG.cx;
        this.player.targetX = CONFIG.cx;
        this.updateUI();
    }

    spawnItem() {
        const type = Math.random() > 0.3 ? 'good' : 'bad';
        this.items.push(new Item(type));
    }

    updateUI() {
        document.getElementById('score').innerText = this.score;
        document.getElementById('lives').innerText = '❤️'.repeat(this.lives);
    }

    gameOver() {
        this.state = 'GAMEOVER';
        this.audio.setLoopActive(false);
        this.audio.playSfx('gameover', 120);
        this.showGif('fail', 1600);
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('finalScore').innerText = this.score;
    }

    loop(now) {
        const dt = Math.min((now - this.lastTime) / 1000, 0.1);
        this.lastTime = now;

        try {
            this.update(dt);
            this.draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(t => this.loop(t));
    }

    showGif(type, duration = 900) {
        const element = type === 'collect' ? this.collectGif : this.failGif;
        if (!element) return;
        this.feedbackTimers[type] = duration;
        element.classList.add('show');
    }

    updateGifState(dt) {
        Object.entries(this.feedbackTimers).forEach(([type, remaining]) => {
            if (remaining <= 0) return;
            const next = Math.max(0, remaining - (dt * 1000));
            this.feedbackTimers[type] = next;
            if (next === 0) {
                const element = type === 'collect' ? this.collectGif : this.failGif;
                if (element) element.classList.remove('show');
            }
        });
    }

    update(dt) {
        this.time += dt;
        this.updateGifState(dt);

        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 20);

        if (this.state === 'PLAYING') {
            this.difficulty = 1 + (this.score / 50);
            this.player.update(dt);

            this.spawnTimer -= dt;
            if (this.spawnTimer <= 0) {
                this.spawnItem();
                this.spawnTimer = (2 / (window.gameConfig.spawnRate * this.difficulty));
            }

            for (let i = this.items.length - 1; i >= 0; i--) {
                let item = this.items[i];
                item.update(dt, this.difficulty);

                const dx = item.x - this.player.x;
                const dy = item.y - this.player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < this.player.r + item.r) {
                    if (item.type === 'good') {
                        this.score++;
                        this.player.pulse();
                        this.audio.playSfx('collect', 70);
                        this.showGif('collect', 850);
                        for (let k = 0; k < 8; k++) this.particles.push(new Particle(item.x, item.y, '#5eff95', 'confetti'));
                        this.particles.push(new Particle(item.x, item.y - 20, '#fff19b', 'text'));
                    } else {
                        this.lives--;
                        this.shake = 10;
                        this.audio.playSfx('hit', 140);
                        this.showGif('fail', 1000);
                        for (let k = 0; k < 8; k++) this.particles.push(new Particle(item.x, item.y, '#ff5a72', 'confetti'));
                        if (this.lives <= 0) this.gameOver();
                    }
                    item.active = false;
                    this.updateUI();
                }

                if (!item.active) this.items.splice(i, 1);
            }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }
    }

    drawSkyline() {
        const ctx = this.ctx;
        const baseY = CONFIG.height * 0.72;

        ctx.save();
        ctx.globalAlpha = 0.9;

        for (let i = 0; i < 9; i++) {
            const width = 58 + (i % 3) * 18;
            const height = 70 + (i % 4) * 24;
            const x = i * (CONFIG.width / 8) - 20;
            const y = baseY - height + (i % 2) * 10;

            ctx.fillStyle = i % 2 === 0 ? '#102546' : '#15315a';
            ctx.fillRect(x, y, width, height);

            ctx.fillStyle = 'rgba(255, 241, 155, 0.45)';
            for (let row = 0; row < Math.floor(height / 16); row++) {
                for (let col = 0; col < Math.floor(width / 14); col++) {
                    if ((row + col + i) % 2 === 0) {
                        ctx.fillRect(x + 6 + col * 14, y + 7 + row * 14, 4, 6);
                    }
                }
            }
        }

        ctx.restore();
    }

    drawBackgroundGlow() {
        const ctx = this.ctx;

        const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.height);
        grad.addColorStop(0, '#0c1830');
        grad.addColorStop(0.5, '#142952');
        grad.addColorStop(1, '#18365f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

        ctx.fillStyle = 'rgba(86, 220, 255, 0.08)';
        for (let i = 0; i < 6; i++) {
            const x = ((this.time * 25 + i * 180) % (CONFIG.width + 240)) - 120;
            const y = 95 + i * 48;
            ctx.beginPath();
            ctx.arc(x, y, 38, 0, Math.PI * 2);
            ctx.arc(x + 30, y - 10, 48, 0, Math.PI * 2);
            ctx.arc(x + 60, y, 38, 0, Math.PI * 2);
            ctx.fill();
        }

        for (let i = 0; i < 36; i++) {
            const x = (i * 97.3) % CONFIG.width;
            const y = (i * 53.9 + this.time * 12) % CONFIG.height;
            const alpha = 0.2 + 0.2 * Math.sin(this.time * 2 + i);
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.fillRect(x, y, 2, 2);
        }

        const floor = ctx.createLinearGradient(0, CONFIG.height * 0.68, 0, CONFIG.height);
        floor.addColorStop(0, 'rgba(46, 123, 255, 0)');
        floor.addColorStop(1, 'rgba(8, 18, 38, 0.85)');
        ctx.fillStyle = floor;
        ctx.fillRect(0, CONFIG.height * 0.68, CONFIG.width, CONFIG.height * 0.32);

        ctx.strokeStyle = 'rgba(86, 220, 255, 0.12)';
        ctx.lineWidth = 1;
        for (let y = CONFIG.height * 0.72; y < CONFIG.height; y += 26) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(CONFIG.width, y);
            ctx.stroke();
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

        const sx = (Math.random() - 0.5) * this.shake;
        const sy = (Math.random() - 0.5) * this.shake;
        this.ctx.save();
        this.ctx.translate(sx, sy);

        this.drawBackgroundGlow();
        this.drawSkyline();

        if (this.state === 'PLAYING' || this.state === 'GAMEOVER') {
            this.player.draw(this.ctx);
            this.items.forEach(item => item.draw(this.ctx));
        }

        this.particles.forEach(p => p.draw(this.ctx));

        this.ctx.restore();
    }
}

window.addEventListener('DOMContentLoaded', () => {
    try {
        const configElement = document.getElementById('game-config');
        if (configElement) {
            const parsed = JSON.parse(configElement.textContent);
            for (const key in parsed) {
                if (window.gameConfig.hasOwnProperty(key)) {
                    window.gameConfig[key] = parsed[key].value;
                }
            }
        }
    } catch (e) {
        console.error("Config parse error", e);
    }

    window.game = new Game();
});
</script>
