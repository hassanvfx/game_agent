<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Momrot 3D: Bouquet Bus Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #27112d;
        --bg-mid: #5b1f54;
        --panel: rgba(49, 18, 48, 0.82);
        --panel-strong: rgba(72, 26, 67, 0.94);
        --line: rgba(255, 183, 213, 0.38);
        --cyan: #7df4ff;
        --cyan-strong: #23d8e8;
        --gold: #ffe06b;
        --gold-strong: #ffad33;
        --danger: #ff4f74;
        --success: #7cf6a3;
        --text: #fff9fb;
        --text-dim: #ffd0df;
        --shadow: 0 22px 48px rgba(0, 0, 0, 0.38);
        --radius-xl: 24px;
        --radius-lg: 18px;
        --radius-md: 14px;
        --title-font: 'Bangers', cursive;
        --body-font: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 18% 12%, rgba(255, 224, 107, 0.2), transparent 26%),
            radial-gradient(circle at 82% 8%, rgba(255, 122, 157, 0.16), transparent 26%),
            linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        font-family: var(--body-font);
        color: var(--text);
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            radial-gradient(circle at 12px 12px, rgba(255, 224, 107, 0.18) 0 3px, transparent 4px),
            radial-gradient(circle at 42px 32px, rgba(255, 122, 157, 0.12) 0 2px, transparent 3px),
            linear-gradient(90deg, rgba(255,255,255,0.026) 1px, transparent 1px),
            linear-gradient(180deg, rgba(255,255,255,0.022) 1px, transparent 1px);
        background-size: 72px 72px, 72px 72px, 36px 36px, 36px 36px;
        opacity: 0.38;
        animation: momrotBodyDrift 18s linear infinite;
    }

    body::after {
        background:
            radial-gradient(circle at 20% 18%, rgba(255, 224, 107, 0.16), transparent 18%),
            radial-gradient(circle at 85% 10%, rgba(255, 122, 157, 0.15), transparent 24%);
        opacity: 0.9;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        position: relative;
        z-index: 1;
    }

    .hidden { display: none !important; }
    .font-display { font-family: var(--title-font); }

    .screen-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        pointer-events: auto;
        padding:
            calc(max(24px, env(safe-area-inset-top)) + 8px)
            18px
            calc(max(24px, env(safe-area-inset-bottom)) + 8px);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        background:
            radial-gradient(circle at 50% 8%, rgba(255, 224, 107, 0.18), transparent 22%),
            radial-gradient(circle at 10% 88%, rgba(255, 122, 157, 0.18), transparent 24%),
            rgba(39, 17, 45, 0.86);
        overflow-y: auto;
    }

    .screen-overlay.end-overlay {
        background:
            radial-gradient(circle at top, rgba(255, 95, 135, 0.1), transparent 28%),
            rgba(3, 8, 20, 0.9);
    }

    .panel-card {
        width: min(100%, 420px);
        padding: 22px 18px 20px;
        border-radius: 28px;
        background:
            radial-gradient(circle at 16% 0%, rgba(255, 224, 107, 0.16), transparent 28%),
            radial-gradient(circle at 84% 6%, rgba(255, 122, 157, 0.2), transparent 26%),
            linear-gradient(180deg, rgba(91, 31, 84, 0.96), rgba(39, 17, 45, 0.95));
        border: 1px solid rgba(255, 183, 213, 0.34);
        box-shadow: var(--shadow), 0 0 0 4px rgba(255, 224, 107, 0.08), inset 0 1px 0 rgba(255,255,255,0.12);
        position: relative;
        overflow: hidden;
    }

    .panel-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 18px 18px, rgba(255, 224, 107, 0.16) 0 3px, transparent 4px),
            linear-gradient(135deg, rgba(255, 183, 213, 0.14), transparent 28%),
            linear-gradient(315deg, rgba(125, 244, 255, 0.1), transparent 24%);
        background-size: 52px 52px, auto, auto;
        pointer-events: none;
    }

    .panel-card > * {
        position: relative;
        z-index: 1;
    }

    .start-shell {
        text-align: center;
    }

    .hero-badge {
        width: 132px;
        height: 132px;
        margin: 0 auto 18px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 28% 18%, rgba(255,255,255,0.42), transparent 18%),
            linear-gradient(145deg, rgba(255, 224, 107, 0.98), rgba(255, 122, 157, 0.92));
        box-shadow:
            0 0 0 6px rgba(255, 224, 107, 0.1),
            0 0 42px rgba(255, 122, 157, 0.42),
            inset 0 -12px 18px rgba(145, 72, 0, 0.22);
        transform: rotate(4deg);
        position: relative;
    }

    .hero-badge::before,
    .hero-badge::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        background: rgba(255,255,255,0.22);
    }

    .hero-badge::before {
        width: 62px;
        height: 10px;
        top: 24px;
        left: 22px;
    }

    .hero-badge::after {
        width: 12px;
        height: 12px;
        top: 22px;
        right: 24px;
        box-shadow: -18px 0 0 rgba(255,255,255,0.18);
    }

    .hero-bus {
        font-size: 68px;
        filter: drop-shadow(0 8px 12px rgba(114, 54, 0, 0.28));
        transform: translateY(-1px);
    }

    .title-marquee {
        margin-bottom: 14px;
    }

    .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        margin-bottom: 12px;
        background: rgba(118, 235, 255, 0.09);
        border: 1px solid rgba(118, 235, 255, 0.22);
        color: var(--cyan);
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-weight: 700;
    }

    .eyebrow::before,
    .eyebrow::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
        box-shadow: 0 0 10px currentColor;
    }

    .main-title {
        margin: 0;
        font-family: var(--title-font);
        font-size: clamp(30px, 9vw, 52px);
        line-height: 0.95;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 4px 0 rgba(0,0,0,0.7), 0 0 18px rgba(118, 235, 255, 0.2);
    }

    .title-accent {
        display: inline-block;
        margin-top: 6px;
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255, 215, 94, 0.28);
    }

    .subtitle {
        margin: 10px 0 0;
        color: var(--text-dim);
        font-size: 17px;
        letter-spacing: 0.04em;
        line-height: 1.15;
    }

    .mission-card {
        margin: 18px 0 18px;
        padding: 14px 14px 10px;
        border-radius: var(--radius-lg);
        background: rgba(7, 14, 31, 0.72);
        border: 1px solid rgba(118, 235, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        text-align: left;
    }

    .mission-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 2px;
    }

    .mission-icon {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .mission-icon.gold { background: rgba(255, 215, 94, 0.14); color: var(--gold); }
    .mission-icon.green { background: rgba(87, 243, 168, 0.14); color: var(--success); }
    .mission-icon.red { background: rgba(255, 95, 135, 0.14); color: var(--danger); }

    .mission-text {
        margin: 0;
        color: #eef4ff;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.01em;
    }

    .arcade-button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 16px 18px;
        font-family: var(--title-font);
        font-size: clamp(18px, 5vw, 24px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        color: #07111f;
        background:
            linear-gradient(180deg, #ffe27c, #ffb533);
        box-shadow:
            0 12px 22px rgba(245, 158, 11, 0.34),
            inset 0 2px 0 rgba(255,255,255,0.42),
            inset 0 -4px 0 rgba(147, 81, 4, 0.4);
        transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }

    .arcade-button:active {
        transform: translateY(2px) scale(0.985);
        box-shadow:
            0 8px 18px rgba(245, 158, 11, 0.28),
            inset 0 2px 0 rgba(255,255,255,0.32),
            inset 0 -2px 0 rgba(147, 81, 4, 0.34);
    }

    .arcade-button,
    .panel-card,
    .screen-overlay {
        touch-action: auto;
    }

    .arcade-button.restart {
        background: linear-gradient(180deg, #f3f8ff, #b8c8de);
        color: #07111f;
        box-shadow:
            0 12px 22px rgba(11, 18, 32, 0.36),
            inset 0 2px 0 rgba(255,255,255,0.55),
            inset 0 -4px 0 rgba(60, 73, 96, 0.35);
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)) 14px;
        z-index: 3;
    }

    #hud {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 2px;
        transition: opacity 0.45s ease;
    }

    .hud-row {
        width: min(100%, 680px);
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
    }

    .hud-card,
    .status-card,
    .summary-card {
        background:
            radial-gradient(circle at 12% 0%, rgba(255, 224, 107, 0.14), transparent 28%),
            linear-gradient(180deg, rgba(72, 26, 67, 0.9), rgba(39, 17, 45, 0.86));
        border: 1px solid rgba(255, 183, 213, 0.24);
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .hud-card {
        min-width: 90px;
        border-radius: 18px;
        padding: 10px 12px 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .hud-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: linear-gradient(180deg, var(--cyan), rgba(118, 235, 255, 0));
        opacity: 0.7;
    }

    .hud-card.goal-card::before {
        background: linear-gradient(180deg, var(--gold), rgba(255, 215, 94, 0));
    }

    .hud-label {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text-dim);
    }

    .hud-level {
        font-family: var(--title-font);
        font-size: clamp(24px, 7vw, 32px);
        line-height: 1;
        color: #f7fcff;
        text-shadow: 0 0 12px rgba(118, 235, 255, 0.18);
    }

    .hud-scoreline {
        display: flex;
        align-items: baseline;
        gap: 4px;
        line-height: 1;
    }

    .hud-score-main,
    .hud-score-sep,
    .hud-score-goal {
        font-family: var(--title-font);
    }

    .hud-score-main {
        font-size: clamp(26px, 8vw, 36px);
        color: var(--gold);
        text-shadow: 0 0 14px rgba(255, 215, 94, 0.24);
    }

    .hud-score-sep {
        font-size: 19px;
        color: rgba(255,255,255,0.35);
    }

    .hud-score-goal {
        font-size: 22px;
        color: rgba(255,255,255,0.68);
    }

    .status-card {
        align-self: center;
        margin-top: 8px;
        border-radius: 999px;
        padding: 10px 16px;
        opacity: 0;
        transform: scale(0.92);
        transition: transform 220ms ease, opacity 220ms ease;
    }

    .status-text {
        display: block;
        font-family: var(--title-font);
        font-size: clamp(13px, 4vw, 18px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--success);
        text-shadow: 0 0 14px rgba(87, 243, 168, 0.18);
    }

    .feedback-gif {
        position: absolute;
        right: 12px;
        bottom: calc(max(90px, env(safe-area-inset-bottom)) + 4px);
        width: clamp(86px, 22vw, 132px);
        border-radius: 18px;
        border: 1px solid rgba(118, 235, 255, 0.28);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.35);
        background: rgba(7, 14, 31, 0.65);
        object-fit: cover;
        opacity: 0;
        transform: translateY(14px) scale(0.92);
        transition: opacity 220ms ease, transform 220ms ease;
        pointer-events: none;
        z-index: 4;
    }

    .feedback-gif.show {
        opacity: 0.96;
        transform: translateY(0) scale(1);
    }

    .feedback-gif.crash {
        left: 50%;
        right: auto;
        top: 50%;
        bottom: auto;
        width: min(42vw, 220px);
        transform: translate(-50%, -50%) scale(0.82);
        border-color: rgba(255, 95, 135, 0.45);
        z-index: 55;
    }

    .feedback-gif.crash.show {
        transform: translate(-50%, -50%) scale(1);
    }

    .end-title {
        margin: 0 0 4px;
        font-family: var(--title-font);
        font-size: clamp(30px, 8vw, 48px);
        line-height: 0.95;
        text-transform: uppercase;
        color: #fff5f8;
        text-shadow: 0 0 16px rgba(255,255,255,0.12);
    }

    .end-reason {
        margin: 0 0 18px;
        color: var(--text-dim);
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-weight: 700;
    }

    .summary-card {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
        padding: 16px 14px;
        border-radius: 20px;
    }

    .summary-metric {
        text-align: center;
    }

    .summary-label {
        display: block;
        margin-bottom: 5px;
        color: var(--text-dim);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
    }

    .summary-value {
        font-family: var(--title-font);
        font-size: clamp(28px, 8vw, 42px);
        line-height: 1;
    }

    .summary-value.level { color: #f7fcff; }
    .summary-value.score { color: var(--gold); }

    @keyframes momrotBodyDrift {
        from { background-position: 0 0, 0 0, 0 0, 0 0; }
        to { background-position: 72px 72px, -72px 48px, 36px 0, 0 36px; }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }

    .animate-float { animation: float 3s ease-in-out infinite; }
    .panel-card.animate-float { animation: none; }
    .panel-card.animate-float .hero-badge { animation: float 3s ease-in-out infinite; }

    @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        80% { transform: scale(1.08); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    .pop-in { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.175) forwards; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #41506d; border-radius: 999px; }

    @media (max-width: 560px) {
        .panel-card {
            padding: 18px 14px 16px;
            border-radius: 24px;
        }

        .hero-badge {
            width: 114px;
            height: 114px;
            margin-bottom: 14px;
        }

        .hero-bus { font-size: 58px; }

        .mission-card {
            margin: 16px 0;
            padding: 12px 12px 8px;
        }

        .mission-row {
            gap: 10px;
            padding: 8px 0;
        }

        .mission-icon {
            width: 30px;
            height: 30px;
            flex-basis: 30px;
            border-radius: 10px;
            font-size: 14px;
        }

        .mission-text { font-size: 16px; }

        .subtitle { font-size: 15px; }

        .arcade-button {
            padding: 15px 14px;
            border-radius: 16px;
            letter-spacing: 0.06em;
        }

        .hud-row { gap: 8px; }
        .hud-card { min-width: 82px; padding: 9px 10px 8px; }
        .status-card { padding: 9px 14px; }
        .summary-card { gap: 10px; padding: 14px 12px; }

        .feedback-gif {
            right: 10px;
            width: 88px;
            bottom: calc(max(80px, env(safe-area-inset-bottom)) + 6px);
        }

        .feedback-gif.crash {
            width: min(46vw, 180px);
        }
    }
</style>

<!-- CONFIG PROTOCOL -->
<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Max Speed", "value": 2800, "min": 1500, "max": 4000 },
    "steerSens": { "type": "number", "label": "Steering Sensitivity", "value": 6, "min": 1, "max": 10 },
    "themeColor": { "type": "color", "label": "Bus Color", "value": "#ffe06b" },
    "gameTitle": { "type": "text", "label": "Game Title", "value": "Momrot 3D Bouquet Bus Rush" }
}
</script>
</head>
<body>

<!-- GAME CONTAINER -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI LAYER -->
    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud" class="hidden">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div class="hud-row">
                <div class="hud-card level-card">
                    <span class="hud-label">Route</span>
                    <span id="levelDisplay" class="hud-level">1</span>
                </div>

                <div class="hud-card goal-card">
                    <span class="hud-label">Gifts</span>
                    <div class="hud-scoreline">
                        <span id="scoreDisplay" class="hud-score-main">0</span>
                        <span class="hud-score-sep">/</span>
                        <span id="goalDisplay" class="hud-score-goal">3</span>
                    </div>
                </div>
            </div>

            <div id="status-msg" class="status-card">
                <span class="status-text">Loading Gifts...</span>
            </div>
        </div>

        <!-- [agent-note][world-design] media: approved GIFs retained | pickup -> affection/reward, crash -> impact | keep off controls -->
        <!-- [agent-note][stage3] resolved-gif: pickup-feedback + crash-feedback -> catalogs/gifs.json -->
        <img
            id="pickup-gif"
            class="feedback-gif"
            src="https://i.giphy.com/10gLW3UdTnQzdu.gif"
            alt="Mom's Day gift pickup celebration feedback"
            loading="lazy"
            decoding="async"
        >
        <img
            id="crash-gif"
            class="feedback-gif crash"
            src="https://i.giphy.com/roB5nN2qNNfhUKcprN.gif"
            alt="Chaotic traffic crash impact feedback"
            loading="lazy"
            decoding="async"
        >
    </div>

    <!-- SCREENS -->

    <!-- START SCREEN -->
    <div id="start-screen" class="screen-overlay">
        <div class="panel-card start-shell animate-float">
            <div class="hero-badge" aria-hidden="true">
                <span class="hero-bus">🚌</span>
            </div>

            <div class="title-marquee">
                <div class="eyebrow">Mom's Day Meme Parade</div>
                <h1 id="main-title" class="main-title">MOMROT 3D<br><span class="title-accent">BOUQUET BUS RUSH</span></h1>
                <p class="subtitle">Steer the gift bus, collect love at glowing bays, and dodge chaotic brunch traffic.</p>
            </div>

            <div class="mission-card">
                <div class="mission-row">
                    <div class="mission-icon gold">👑</div>
                    <p class="mission-text">Clear 10 Momrot routes</p>
                </div>
                <div class="mission-row">
                    <div class="mission-icon green">💐</div>
                    <p class="mission-text">Park in gift bays</p>
                </div>
                <div class="mission-row">
                    <div class="mission-icon red">⚠</div>
                    <p class="mission-text">Avoid brunch traffic</p>
                </div>
            </div>

            <button id="start-btn" class="arcade-button">Start Gift Run</button>
        </div>
    </div>

    <!-- GAME OVER / WIN SCREEN -->
    <div id="game-over-screen" class="screen-overlay end-overlay hidden">
        <div class="panel-card pop-in">
            <h2 id="end-title" class="end-title">Route Lost!</h2>
            <p id="end-reason" class="end-reason">Traffic Jam</p>

            <div class="summary-card">
                <div class="summary-metric">
                    <span class="summary-label">Route</span>
                    <span id="finalLevel" class="summary-value level">1</span>
                </div>
                <div class="summary-metric">
                    <span class="summary-label">Gifts</span>
                    <span id="finalScore" class="summary-value score">0</span>
                </div>
            </div>

            <button id="restart-btn" class="arcade-button restart">Retry Route</button>
        </div>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * CONFIG & INIT
 * ------------------------------------------------------------------
 */
const CFG = {
    // Engine
    roadWidth: 2000,
    cameraHeight: 800,
    busRelZ: 1400,
    drawDistance: 8000,
    fov: 600,
    segmentLength: 400,

    // Gameplay (Default, overwritten by game-config)
    heroSpeed: 2800,
    steerSens: 6,
    themeColor: '#ffe06b',

    // Visuals
    colors: {
        grassLight: '#ffb7d5',
        grassDark: '#7c2d63',
        road: '#3d3447',
        roadLine: '#fff8d6',
        rumbleLight: '#ffe06b',
        rumbleDark: '#ff7a9d'
    },

    levels: [
        { goal: 3,  traffic: 0.25, speedMod: 1.00, sky: ['#ffd6a5', '#fff0c9'] },
        { goal: 5,  traffic: 0.30, speedMod: 1.05, sky: ['#ff9fcf', '#fff0c9'] },
        { goal: 7,  traffic: 0.35, speedMod: 1.10, sky: ['#ff6fb1', '#ffe06b'] },
        { goal: 10, traffic: 0.40, speedMod: 1.15, sky: ['#b15cff', '#ffd0df'] },
        { goal: 12, traffic: 0.45, speedMod: 1.20, sky: ['#5b1f54', '#ffb7d5'] },
        { goal: 15, traffic: 0.50, speedMod: 1.25, sky: ['#4c1d95', '#ffb7d5'] },
        { goal: 18, traffic: 0.55, speedMod: 1.30, sky: ['#ff7a3d', '#ffe06b'] },
        { goal: 20, traffic: 0.60, speedMod: 1.35, sky: ['#2b175c', '#ff7a9d'] },
        { goal: 25, traffic: 0.65, speedMod: 1.40, sky: ['#27112d', '#ff7a9d'] },
        { goal: 30, traffic: 0.70, speedMod: 1.50, sky: ['#090016', '#ffe06b'] }
    ]
};

// Config Protocol Implementation
window.gameConfigDefs = {};
window.gameConfig = {};

document.addEventListener('DOMContentLoaded', () => {
    try {
        const script = document.getElementById('game-config');
        if (script) {
            const defs = JSON.parse(script.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                window.gameConfig[key] = defs[key].value;
                if (key === 'heroSpeed') CFG.heroSpeed = defs[key].value;
                if (key === 'steerSens') CFG.steerSens = defs[key].value;
                if (key === 'themeColor') CFG.themeColor = defs[key].value;
                if (key === 'gameTitle') {
                    document.getElementById('main-title').innerHTML = defs[key].value.replace(' ', '<br>');
                }
            }
        }
    } catch (e) { console.error("Config Parse Error", e); }
});

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        if (window.gameConfigDefs[key].type === 'number') {
            val = Math.max(window.gameConfigDefs[key].min, Math.min(window.gameConfigDefs[key].max, Number(val)));
        } else if (window.gameConfigDefs[key].type === 'color') {
            if (!/^#[0-9a-fA-F]{6}$/.test(val)) return;
        }

        window.gameConfig[key] = val;

        if (key === 'heroSpeed') CFG.heroSpeed = val;
        if (key === 'steerSens') CFG.steerSens = val;
        if (key === 'themeColor') CFG.themeColor = val;
        if (key === 'gameTitle') {
            document.getElementById('main-title').innerText = val;
            document.title = val;
        }
    }
};

/**
 * ------------------------------------------------------------------
 * AUDIO SYSTEM
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    buffers: {},
    masterGain: null,
    musicEl: document.getElementById('bgm_main'),
    activeSources: new Set(),
    lastPlayAt: {},
    soundConfig: {
        pickup: { volume: 0.42, debounce: 90 },
        crash: { volume: 0.52, debounce: 250 },
        levelup: { volume: 0.48, debounce: 350 },
        ui: { volume: 0.34, debounce: 120 }
    },

    init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        try {
            this.ctx = new AC();
            this.masterGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.masterGain.gain.value = 0.42;

            this.load('pickup', document.getElementById('sfx_pickup').src);
            this.load('crash', document.getElementById('sfx_crash').src);
            this.load('ui', document.getElementById('sfx_ui').src);
            this.load('levelup', document.getElementById('sfx_levelup').src);

            if (this.musicEl) {
                this.musicEl.volume = 0.18;
                this.musicEl.loop = true;
            }
        } catch (e) {
            this.ctx = null;
            this.masterGain = null;
        }
    },

    async load(key, url) {
        if (!this.ctx || !url) return;
        try {
            const resolved = new URL(url, window.location.href);
            // [agent-note][stage4] repair: avoid cross-origin WebAudio fetch CORS errors; synth fallback preserves non-blocking sound feedback.
            if (resolved.origin !== window.location.origin) return;

            const resp = await fetch(resolved.href);
            if (!resp.ok) return;

            const arrayBuffer = await resp.arrayBuffer();
            const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
            this.buffers[key] = audioBuffer;
        } catch (e) {
            // Optional media decode failures fall back to synth without blocking play.
        }
    },

    async unlock() {
        this.init();
        try {
            if (this.ctx && this.ctx.state === 'suspended') {
                await this.ctx.resume();
            }
            if (this.musicEl && this.musicEl.paused && (state.screen === 'PLAY' || state.screen === 'START')) {
                this.musicEl.currentTime = this.musicEl.currentTime || 0;
            }
        } catch (e) {}
    },

    startLoop() {
        if (!this.musicEl) return;
        this.unlock().then(() => {
            if (state.screen !== 'PLAY') return;
            const playPromise = this.musicEl.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        });
    },

    stopLoop(reset = false) {
        if (!this.musicEl) return;
        try {
            this.musicEl.pause();
            if (reset) this.musicEl.currentTime = 0;
        } catch (e) {}
    },

    play(key, pitch = 1) {
        if (!this.ctx || !this.masterGain) return;
        const cfg = this.soundConfig[key] || { volume: 0.35, debounce: 100 };
        const now = performance.now();

        if (this.lastPlayAt[key] && now - this.lastPlayAt[key] < cfg.debounce) return;
        this.lastPlayAt[key] = now;

        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        if (this.buffers[key]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = this.buffers[key];
            src.playbackRate.value = pitch;
            gain.gain.value = cfg.volume;
            src.connect(gain);
            gain.connect(this.masterGain);
            src.start(0);

            this.activeSources.add(src);
            src.onended = () => this.activeSources.delete(src);
        } else {
            this.synth(key, pitch, cfg.volume);
        }
    },

    synth(key, pitch, volume = 0.3) {
        if (!this.ctx || !this.masterGain) return;
        const t = this.ctx.currentTime;

        if (key === 'levelup') {
            [440, 554, 659, 880].forEach((freq, i) => {
                const o = this.ctx.createOscillator();
                const gn = this.ctx.createGain();
                o.connect(gn);
                gn.connect(this.masterGain);
                o.type = 'triangle';
                o.frequency.value = freq;
                gn.gain.setValueAtTime(volume * 0.4, t + i * 0.08);
                gn.gain.linearRampToValueAtTime(0.001, t + i * 0.08 + 0.24);
                o.start(t + i * 0.08);
                o.stop(t + i * 0.08 + 0.24);
            });
            return;
        }

        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.connect(g);
        g.connect(this.masterGain);

        if (key === 'pickup') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(540 * pitch, t);
            osc.frequency.exponentialRampToValueAtTime(980 * pitch, t + 0.12);
            g.gain.setValueAtTime(volume, t);
            g.gain.linearRampToValueAtTime(0.001, t + 0.22);
            osc.start(t);
            osc.stop(t + 0.22);
        } else if (key === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(30, t + 0.28);
            g.gain.setValueAtTime(volume, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
            osc.start(t);
            osc.stop(t + 0.28);
        } else {
            osc.type = 'square';
            osc.frequency.setValueAtTime(320 * pitch, t);
            osc.frequency.exponentialRampToValueAtTime(220 * pitch, t + 0.1);
            g.gain.setValueAtTime(volume * 0.75, t);
            g.gain.linearRampToValueAtTime(0.001, t + 0.14);
            osc.start(t);
            osc.stop(t + 0.14);
        }
    }
};

/**
 * ------------------------------------------------------------------
 * GAME ENGINE
 * ------------------------------------------------------------------
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const pickupGif = document.getElementById('pickup-gif');
const crashGif = document.getElementById('crash-gif');

let pickupGifTimer = null;
let crashGifTimer = null;

const ui = {
    startScreen: document.getElementById('start-screen'),
    hud: document.getElementById('hud'),
    statusMsg: document.getElementById('status-msg'),
    gameOverScreen: document.getElementById('game-over-screen'),
    endTitle: document.getElementById('end-title'),
    endReason: document.getElementById('end-reason'),
    restartBtn: document.getElementById('restart-btn')
};

let state = {
    screen: 'START',
    time: 0,
    level: 1,
    levelScore: 0,
    totalScore: 0,
    speed: 0,
    distance: 0,
    playerX: 0,
    playerZ: 0,
    inputX: 0,
    boarding: { active: false, timer: 0, phase: 'IDLE', current: null },
    objects: [],
    particles: [],
    shake: 0
};

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

const project = (x, y, z) => {
    if (z < 10) return { visible: false, scale: 0, x: 0, y: 0 };
    const scale = CFG.fov / z;
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const px = (w / 2) + (x * scale);
    const py = (h / 2) - ((y - CFG.cameraHeight) * scale);
    return { x: px, y: py, scale: scale, visible: true };
};

class Particle {
    constructor(x, y, z, color, type) {
        this.x = x; this.y = y; this.z = z;
        this.color = color;
        this.type = type;
        this.vx = (Math.random() - 0.5) * 500;
        this.vy = (Math.random() - 0.5) * 500;
        this.vz = (Math.random() * 500);
        this.life = 1.0;
        this.size = Math.random() * 20 + 10;
        this.gravity = type === 'smoke' ? -500 : 800;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.z += this.vz * dt;
        this.vy -= this.gravity * dt;
        this.life -= dt * (this.type === 'smoke' ? 1.5 : 1.0);
        if (this.type === 'smoke') this.size += 30 * dt;
    }
}

function spawnParticles(x, y, z, count, type, color) {
    for (let i = 0; i < count; i++) {
        state.particles.push(new Particle(x, y, z, color || '#fff', type));
    }
}

function showFeedbackGif(el, duration = 1100) {
    if (!el) return;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');

    const timerName = el === pickupGif ? 'pickupGifTimer' : 'crashGifTimer';
    clearTimeout(window[timerName]);
    window[timerName] = setTimeout(() => el.classList.remove('show'), duration);
}

function setStatus(text, tone = 'success') {
    const statusText = ui.statusMsg.querySelector('.status-text');
    statusText.innerText = text;
    statusText.style.color = tone === 'danger' ? 'var(--danger)' : tone === 'gold' ? 'var(--gold)' : 'var(--success)';
    ui.statusMsg.style.opacity = '1';
    ui.statusMsg.style.transform = 'scale(1)';
}

function hideStatus() {
    ui.statusMsg.style.opacity = '0';
    ui.statusMsg.style.transform = 'scale(0.92)';
}

function resetGame() {
    state.screen = 'PLAY';
    state.level = 1;
    state.levelScore = 0;
    state.totalScore = 0;
    state.distance = 0;
    state.speed = 0;
    state.playerX = 0;
    state.objects = [];
    state.particles = [];
    state.boarding = { active: false, timer: 0, phase: 'IDLE', current: null };
    state.shake = 0;

    for (let z = 1000; z < CFG.drawDistance; z += 800) spawnObject(z);

    updateHUD();
    ui.startScreen.classList.add('hidden');
    ui.gameOverScreen.classList.add('hidden');
    ui.hud.classList.remove('hidden');
    hideStatus();
    pickupGif.classList.remove('show');
    crashGif.classList.remove('show');
    AudioSys.play('ui');
    AudioSys.startLoop();
}

function spawnObject(z) {
    const lvlCfg = CFG.levels[state.level - 1] || CFG.levels[CFG.levels.length - 1];

    if (Math.random() > 0.3) {
        state.objects.push({
            type: 'SCENERY',
            x: (Math.random() > 0.5 ? -1 : 1) * (CFG.roadWidth * 0.8 + Math.random() * 500),
            y: 0, z: z,
            width: 200, height: 400 + Math.random() * 200,
            color: Math.random() > 0.5 ? '#0f766e' : '#115e59'
        });
    }

    const isStop = Math.random() > lvlCfg.traffic;
    const last = state.objects[state.objects.length - 1];

    if (last && last.type === 'STOP' && (z - last.z) < 2500) {
        spawnCar(z);
    } else if (isStop) {
        spawnStop(z);
    } else {
        spawnCar(z);
    }
}

function spawnCar(z) {
    const lane = [-0.6, 0, 0.6][Math.floor(Math.random() * 3)];
    const lvlCfg = CFG.levels[state.level - 1] || CFG.levels[CFG.levels.length - 1];
    state.objects.push({
        type: 'CAR',
        x: lane * CFG.roadWidth * 0.45,
        y: 0, z: z,
        width: 220, height: 160,
        color: Math.random() > 0.5 ? '#ef4444' : '#3b82f6',
        speedOffset: (Math.random() * 300 + 200) * lvlCfg.speedMod
    });
}

function spawnStop(z) {
    const isLeft = Math.random() > 0.5;
    state.objects.push({
        type: 'STOP',
        x: isLeft ? -CFG.roadWidth * 0.65 : CFG.roadWidth * 0.65,
        y: 0, z: z,
        width: 400, depth: 600,
        passengers: 1 + Math.floor(Math.random() * 2),
        visited: false
    });
}

function updateHUD() {
    const lvlCfg = CFG.levels[state.level - 1] || CFG.levels[CFG.levels.length - 1];
    document.getElementById('levelDisplay').innerText = state.level;
    document.getElementById('scoreDisplay').innerText = state.levelScore;
    document.getElementById('goalDisplay').innerText = lvlCfg.goal;
}

function showFloatText(text, x, y) {
    const el = document.createElement('div');
    el.innerHTML = text;
    el.className = 'font-display';
    el.style.position = 'absolute';
    el.style.left = '50%';
    el.style.top = '40%';
    el.style.transform = 'translate(-50%, -50%)';
    el.style.pointerEvents = 'none';
    el.style.zIndex = '40';
    el.style.fontSize = 'clamp(30px, 8vw, 48px)';
    el.style.fontWeight = '700';
    el.style.color = '#ffd75e';
    el.style.textShadow = '0 0 16px rgba(255, 215, 94, 0.35)';

    el.animate([
        { transform: 'translate(-50%, 0) scale(0.5)', opacity: 0 },
        { transform: 'translate(-50%, -100px) scale(1.45)', opacity: 1, offset: 0.2 },
        { transform: 'translate(-50%, -200px) scale(1)', opacity: 0 }
    ], { duration: 1000, easing: 'ease-out' });

    document.getElementById('ui-layer').appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function nextLevel() {
    state.level++;
    if (state.level > CFG.levels.length) {
        gameOver(true);
        return;
    }
    state.levelScore = 0;
    updateHUD();
    AudioSys.play('levelup');
    setStatus(`Momrot route ${state.level} unlocked`, 'gold');
    showFeedbackGif(pickupGif, 1400);
    showFloatText(`<span style="font-size:clamp(40px,10vw,64px);color:#ffffff;">ROUTE ${state.level}</span><br>MOM METER UP!`, 0, 0);
    setTimeout(hideStatus, 1200);
}

function gameOver(win) {
    state.screen = win ? 'WIN' : 'OVER';
    AudioSys.stopLoop(win);
    AudioSys.play(win ? 'levelup' : 'crash');
    ui.hud.classList.add('hidden');
    ui.gameOverScreen.classList.remove('hidden');

    if (win) {
        ui.endTitle.innerText = "MOM'S DAY DELIVERED!";
        ui.endTitle.style.color = '#ffe06b';
        ui.endReason.innerText = "ALL LOVE ROUTES CLEARED";
        ui.restartBtn.innerText = "GIFT RUN AGAIN";
        showFeedbackGif(pickupGif, 1800);
    } else {
        ui.endTitle.innerText = "GIFT RUN LOST!";
        ui.endTitle.style.color = '#ff7a9d';
        ui.endReason.innerText = "BRUNCH TRAFFIC JAM";
        ui.restartBtn.innerText = "RETRY GIFT RUN";
        showFeedbackGif(crashGif, 1700);
    }

    document.getElementById('finalLevel').innerText = state.level;
    document.getElementById('finalScore').innerText = state.totalScore;
}

function update(dt) {
    if (state.screen !== 'PLAY') return;

    const lvlCfg = CFG.levels[state.level - 1] || CFG.levels[CFG.levels.length - 1];

    state.playerX += (state.inputX - state.playerX) * CFG.steerSens * dt;
    state.playerX = Math.max(-1.5, Math.min(1.5, state.playerX));

    if (state.boarding.active) {
        if (state.boarding.phase === 'BRAKING') {
            state.speed *= 0.92;
            if (state.speed < 50) {
                state.speed = 0;
                state.boarding.phase = 'STOPPED';
                setStatus('Loading Mom gifts', 'success');
            }
        } else if (state.boarding.phase === 'STOPPED') {
            state.boarding.timer += dt;
            if (state.boarding.timer > 0.25 && state.boarding.current.passengers > 0) {
                state.boarding.current.passengers--;
                state.levelScore++;
                state.totalScore++;
                state.boarding.timer = 0;
                AudioSys.play('pickup', 1.0 + (state.levelScore % 5) * 0.1);
                showFeedbackGif(pickupGif, 900);
                spawnParticles(
                    state.boarding.current.x,
                    200,
                    state.boarding.current.z,
                    20, 'confetti', '#fbbf24'
                );
                updateHUD();
                showFloatText("+1 GIFT", 0, 0);
            }
            if (state.boarding.current.passengers <= 0 && state.boarding.timer > 0.3) {
                state.boarding.phase = 'DEPARTING';
                setStatus('Gift bay clear', 'gold');
                setTimeout(() => {
                    if (state.boarding.phase === 'DEPARTING' || !state.boarding.active) hideStatus();
                }, 700);
            }
        } else if (state.boarding.phase === 'DEPARTING') {
            state.speed += 2000 * dt;
            if (state.speed > CFG.heroSpeed * lvlCfg.speedMod * 0.5) {
                state.boarding.active = false;
                state.boarding.phase = 'IDLE';
                if (state.levelScore >= lvlCfg.goal) nextLevel();
            }
        }
    } else {
        const target = CFG.heroSpeed * lvlCfg.speedMod;
        state.speed += (target - state.speed) * 0.5 * dt;

        if (state.speed > 1000 && Math.random() < 0.2) {
            const px = (state.playerX * CFG.roadWidth * 0.4) + (Math.random() * 40 - 20);
            spawnParticles(px - 80, 50, state.distance + CFG.busRelZ - 100, 1, 'smoke', '#555');
        }
    }

    state.distance += state.speed * dt;

    if (state.shake > 0) state.shake *= 0.9;
    if (state.shake < 1) state.shake = 0;

    const lastObj = state.objects[state.objects.length - 1];
    if (lastObj && (lastObj.z - state.distance) < CFG.drawDistance) {
        spawnObject(lastObj.z + 800 + Math.random() * 600);
    }

    for (let i = state.objects.length - 1; i >= 0; i--) {
        let obj = state.objects[i];

        if (obj.type === 'CAR') obj.z += obj.speedOffset * dt;

        const pZ = state.distance + CFG.busRelZ;
        if (obj.z > pZ - 150 && obj.z < pZ + 150) {
            const pX = state.playerX * (CFG.roadWidth * 0.4);
            const dist = Math.abs(pX - obj.x);

            if (dist < (obj.width / 2 + 110)) {
                if (obj.type === 'CAR') {
                    state.shake = 20;
                    spawnParticles(pX, 100, pZ, 30, 'debris', '#ef4444');
                    showFeedbackGif(crashGif, 1300);
                    gameOver(false);
                } else if (obj.type === 'STOP' && !obj.visited && !state.boarding.active) {
                    state.boarding.active = true;
                    state.boarding.phase = 'BRAKING';
                    state.boarding.current = obj;
                    obj.visited = true;
                    AudioSys.play('ui', 1.03);
                }
            }
        }

        if ((obj.z - state.distance) < -800) state.objects.splice(i, 1);
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
        let p = state.particles[i];
        p.update(dt);
        if (p.life <= 0) state.particles.splice(i, 1);
    }
}

const MOMROT_CHAPTERS = [
    {
        name: 'Breakfast Card Boulevard',
        sky: ['#ffd6a5', '#fff0c9'],
        far: 'rgba(255, 183, 213, 0.38)',
        near: 'rgba(91, 31, 84, 0.58)',
        ground: '#7c2d63',
        motif: 'card'
    },
    {
        name: 'Bouquet Brainrot Lane',
        sky: ['#ff9fcf', '#ffe06b'],
        far: 'rgba(255, 122, 157, 0.36)',
        near: 'rgba(91, 31, 84, 0.62)',
        ground: '#8e2f6f',
        motif: 'bouquet'
    },
    {
        name: 'Gift Wrap Overpass',
        sky: ['#b15cff', '#ffd0df'],
        far: 'rgba(125, 244, 255, 0.26)',
        near: 'rgba(59, 24, 86, 0.68)',
        ground: '#5b1f54',
        motif: 'gift'
    },
    {
        name: 'Heart Balloon Highway',
        sky: ['#ff7a3d', '#ffb7d5'],
        far: 'rgba(255, 224, 107, 0.26)',
        near: 'rgba(74, 22, 80, 0.68)',
        ground: '#662357',
        motif: 'heart'
    },
    {
        name: "Mom's Day Meme Finale",
        sky: ['#090016', '#ffe06b'],
        far: 'rgba(125, 244, 255, 0.3)',
        near: 'rgba(39, 17, 45, 0.78)',
        ground: '#27112d',
        motif: 'crown'
    }
];

function visualChapter() {
    return MOMROT_CHAPTERS[Math.min(MOMROT_CHAPTERS.length - 1, Math.floor((state.level - 1) / 2))];
}

function drawHeartShape(x, y, size, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.32);
    ctx.bezierCurveTo(x - size, y - size * 0.28, x - size * 0.44, y - size * 1.08, x, y - size * 0.5);
    ctx.bezierCurveTo(x + size * 0.44, y - size * 1.08, x + size, y - size * 0.28, x, y + size * 0.32);
    ctx.fill();
    ctx.restore();
}

function drawCrownShape(x, y, size, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x - size, y + size * 0.42);
    ctx.lineTo(x - size * 0.62, y - size * 0.38);
    ctx.lineTo(x - size * 0.2, y + size * 0.12);
    ctx.lineTo(x, y - size * 0.56);
    ctx.lineTo(x + size * 0.2, y + size * 0.12);
    ctx.lineTo(x + size * 0.62, y - size * 0.38);
    ctx.lineTo(x + size, y + size * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(x - size * 0.78, y + size * 0.36, size * 1.56, size * 0.24);
    ctx.restore();
}

function drawBouquetIcon(x, y, scale = 1, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = '#7cf6a3';
    ctx.beginPath();
    ctx.moveTo(x, y + 24 * scale);
    ctx.lineTo(x - 18 * scale, y - 12 * scale);
    ctx.lineTo(x + 18 * scale, y - 12 * scale);
    ctx.closePath();
    ctx.fill();
    ['#ff7a9d', '#ffb7d5', '#ffe06b'].forEach((color, i) => {
        const ox = (i - 1) * 13 * scale;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x + ox, y - 18 * scale - Math.abs(i - 1) * 5 * scale, 11 * scale, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.strokeStyle = 'rgba(39,17,45,0.38)';
    ctx.lineWidth = Math.max(1, 2 * scale);
    ctx.stroke();
    ctx.restore();
}

function drawGiftBoxIcon(x, y, scale = 1, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = '#ffe06b';
    ctx.fillRect(x - 18 * scale, y - 16 * scale, 36 * scale, 32 * scale);
    ctx.fillStyle = '#ff4f74';
    ctx.fillRect(x - 4 * scale, y - 16 * scale, 8 * scale, 32 * scale);
    ctx.fillRect(x - 18 * scale, y - 2 * scale, 36 * scale, 7 * scale);
    ctx.strokeStyle = 'rgba(39,17,45,0.48)';
    ctx.lineWidth = Math.max(1, 2 * scale);
    ctx.strokeRect(x - 18 * scale, y - 16 * scale, 36 * scale, 32 * scale);
    ctx.restore();
}

function drawMomrotBackground(w, h, lvlCfg, bgOffset) {
    const chapter = visualChapter();
    const t = performance.now() * 0.001;
    const skyTop = chapter.sky[0] || lvlCfg.sky[0];
    const skyBottom = chapter.sky[1] || lvlCfg.sky[1];

    const grad = ctx.createLinearGradient(0, 0, 0, h / 2);
    grad.addColorStop(0, skyTop);
    grad.addColorStop(0.55, skyBottom);
    grad.addColorStop(1, '#27112d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const glow = ctx.createRadialGradient(w * 0.5, h * 0.18, 20, w * 0.5, h * 0.18, w * 0.72);
    glow.addColorStop(0, 'rgba(255, 224, 107, 0.2)');
    glow.addColorStop(0.48, 'rgba(255, 122, 157, 0.1)');
    glow.addColorStop(1, 'rgba(255, 183, 213, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h * 0.54);

    ctx.save();
    ctx.globalAlpha = 0.82;
    ctx.strokeStyle = 'rgba(255, 224, 107, 0.24)';
    ctx.lineWidth = 10;
    ctx.beginPath();
    for (let x = -80; x <= w + 80; x += 40) {
        const y = h * 0.2 + Math.sin((x + state.distance * 0.03) * 0.018) * 18;
        if (x === -80) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    drawCrownShape(w * 0.82 + Math.sin(t * 0.7) * 12, h * 0.14, 30, '#ffe06b', state.level > 8 ? 0.75 : 0.38);

    ctx.fillStyle = chapter.far;
    ctx.beginPath();
    for (let i = -120; i <= w + 180; i += 82) {
        const x = i - (bgOffset * 0.18 + state.distance * 0.015) % 82;
        const towerH = 54 + ((i * 17) % 70) + Math.sin(i * 0.04) * 16;
        ctx.roundRect(x, h * 0.5 - towerH, 58, towerH, 8);
        if (i % 164 === 0) ctx.roundRect(x + 8, h * 0.5 - towerH - 26, 42, 28, 10);
    }
    ctx.fill();

    for (let i = -80; i <= w + 100; i += 128) {
        const x = i - (bgOffset * 0.34 + state.distance * 0.025) % 128;
        const y = h * 0.35 + Math.sin(t + i) * 8;
        if (chapter.motif === 'bouquet') drawBouquetIcon(x, y, 0.54, 0.42);
        else if (chapter.motif === 'gift') drawGiftBoxIcon(x, y, 0.72, 0.44);
        else if (chapter.motif === 'crown') drawCrownShape(x, y, 24, '#ffe06b', 0.42);
        else drawHeartShape(x, y, 22, '#ff7a9d', 0.38);
    }

    ctx.fillStyle = chapter.near;
    ctx.beginPath();
    for (let i = -200; i <= w + 200; i += 70) {
        const x = i - (bgOffset + state.distance * 0.04) % 70;
        const height = 58 + Math.abs(Math.sin(i * 0.27)) * 122;
        ctx.roundRect(x, h * 0.5 - height, 54, height, 7);
        if (i % 140 === 0) {
            ctx.moveTo(x + 27, h * 0.5 - height - 26);
            ctx.lineTo(x + 48, h * 0.5 - height);
            ctx.lineTo(x + 6, h * 0.5 - height);
        }
    }
    ctx.fill();

    ctx.save();
    ctx.globalAlpha = 0.42;
    for (let i = 0; i < 26; i++) {
        const x = ((i * 73 + state.distance * 0.025) % (w + 80)) - 40;
        const y = 38 + ((i * 47 + Math.sin(t + i) * 18) % (h * 0.38));
        if (i % 3 === 0) drawHeartShape(x, y, 7, '#ffb7d5', 0.7);
        else {
            ctx.fillStyle = i % 2 ? '#ffe06b' : '#7df4ff';
            ctx.fillRect(x, y, 8, 3);
        }
    }
    ctx.restore();

    ctx.fillStyle = chapter.ground;
    ctx.fillRect(0, h / 2, w, h / 2);

    ctx.fillStyle = 'rgba(255, 224, 107, 0.06)';
    for (let i = -24; i < w + 24; i += 24) {
        ctx.fillRect(i + (bgOffset * 0.05 % 24), h / 2 + 18, 12, h / 2 - 18);
    }
}

function draw() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const lvlCfg = CFG.levels[state.level - 1] || CFG.levels[CFG.levels.length - 1];

    const shakeX = (Math.random() - 0.5) * state.shake;
    const shakeY = (Math.random() - 0.5) * state.shake;

    ctx.save();
    ctx.translate(shakeX, shakeY);

    const bgOffset = state.playerX * 100;

    // [agent-note][visuals-unified] visual-only: authored animated Momrot parade foundation; preserves road/projection/gameplay architecture.
    drawMomrotBackground(w, h, lvlCfg, bgOffset);

    const pNearL = project(-CFG.roadWidth / 2, 0, 10);
    const pNearR = project(CFG.roadWidth / 2, 0, 10);
    const pFarL = project(-CFG.roadWidth / 2, 0, CFG.drawDistance);
    const pFarR = project(CFG.roadWidth / 2, 0, CFG.drawDistance);

    ctx.fillStyle = CFG.colors.road;
    ctx.beginPath();
    ctx.moveTo(pNearL.x, pNearL.y);
    ctx.lineTo(pFarL.x, pFarL.y);
    ctx.lineTo(pFarR.x, pFarR.y);
    ctx.lineTo(pNearR.x, pNearR.y);
    ctx.fill();

    const roadGlow = ctx.createLinearGradient(0, pFarL.y, 0, pNearL.y);
    roadGlow.addColorStop(0, 'rgba(118, 235, 255, 0.04)');
    roadGlow.addColorStop(1, 'rgba(118, 235, 255, 0.16)');
    ctx.fillStyle = roadGlow;
    ctx.beginPath();
    ctx.moveTo(pNearL.x, pNearL.y);
    ctx.lineTo(pFarL.x, pFarL.y);
    ctx.lineTo(pFarR.x, pFarR.y);
    ctx.lineTo(pNearR.x, pNearR.y);
    ctx.fill();

    const segLen = CFG.segmentLength;
    const offset = state.distance % (segLen * 2);

    for (let z = -offset; z < CFG.drawDistance; z += segLen) {
        if (z < 10) continue;
        const zNext = z + segLen;
        const p1 = project(-CFG.roadWidth / 2, 0, z);
        const p2 = project(-CFG.roadWidth / 2, 0, zNext);
        const p3 = project(CFG.roadWidth / 2, 0, zNext);
        const p4 = project(CFG.roadWidth / 2, 0, z);

        if (!p1.visible || !p2.visible) continue;

        const isAlt = (Math.floor((z + state.distance) / segLen) % 2) !== 0;
        ctx.fillStyle = isAlt ? CFG.colors.rumbleLight : CFG.colors.rumbleDark;

        const w1 = 40 * p1.scale;
        const w2 = 40 * p2.scale;

        ctx.beginPath();
        ctx.moveTo(p1.x - w1, p1.y);
        ctx.lineTo(p2.x - w2, p2.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(p4.x, p4.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p3.x + w2, p3.y);
        ctx.lineTo(p4.x + w1, p4.y);
        ctx.fill();

        if (isAlt) {
            const cp1 = project(0, 0, z);
            const cp2 = project(0, 0, zNext);
            const cw1 = 15 * cp1.scale;
            const cw2 = 15 * cp2.scale;
            ctx.fillStyle = CFG.colors.roadLine;
            ctx.beginPath();
            ctx.moveTo(cp1.x - cw1, cp1.y);
            ctx.lineTo(cp2.x - cw2, cp2.y);
            ctx.lineTo(cp2.x + cw2, cp2.y);
            ctx.lineTo(cp1.x + cw1, cp1.y);
            ctx.fill();
        }
    }

    let renderList = [
        ...state.objects.map(o => ({ ...o, relZ: o.z - state.distance, isPart: false })),
        ...state.particles.map(p => ({ ...p, relZ: p.z - state.distance, isPart: true }))
    ];

    renderList.push({
        type: 'PLAYER',
        relZ: CFG.busRelZ,
        x: state.playerX * (CFG.roadWidth * 0.4),
        y: 0,
        isPart: false
    });

    renderList = renderList.filter(o => o.relZ > 10 && o.relZ < CFG.drawDistance);
    renderList.sort((a, b) => b.relZ - a.relZ);

    renderList.forEach(obj => {
        const p = project(obj.x, obj.y, obj.relZ);
        if (!p.visible) return;
        const s = p.scale;

        if (obj.isPart) {
            ctx.globalAlpha = obj.life;
            ctx.fillStyle = obj.color;
            const size = obj.size * s;
            if (obj.type === 'confetti') {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(obj.life * 10);
                ctx.fillRect(-size / 2, -size / 2, size, size);
                ctx.restore();
            } else {
                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            return;
        }

        if (obj.type === 'SCENERY') {
            const sw = obj.width * s;
            const sh = obj.height * s;
            const chapter = visualChapter();
            ctx.save();
            ctx.fillStyle = chapter.motif === 'gift' ? '#7c3aed' : chapter.motif === 'bouquet' ? '#0f766e' : '#5b1f54';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - sh);
            ctx.lineTo(p.x + sw / 2, p.y);
            ctx.lineTo(p.x - sw / 2, p.y);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 224, 107, 0.2)';
            ctx.fillRect(p.x - sw * 0.1, p.y - sh * 0.62, sw * 0.2, sh * 0.22);
            ctx.strokeStyle = 'rgba(255, 240, 201, 0.3)';
            ctx.lineWidth = Math.max(1, 3 * s);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - sh * 0.94);
            ctx.lineTo(p.x, p.y - sh * 0.14);
            ctx.stroke();

            if (chapter.motif === 'bouquet') {
                drawBouquetIcon(p.x, p.y - sh * 0.86, Math.max(0.18, 1.8 * s), 0.88);
            } else if (chapter.motif === 'gift') {
                drawGiftBoxIcon(p.x, p.y - sh * 0.82, Math.max(0.2, 1.8 * s), 0.86);
            } else if (chapter.motif === 'crown') {
                drawCrownShape(p.x, p.y - sh * 0.84, 34 * s, '#ffe06b', 0.88);
            } else {
                drawHeartShape(p.x, p.y - sh * 0.82, 26 * s, '#ff7a9d', 0.88);
            }
            ctx.restore();
        }
        else if (obj.type === 'STOP') {
            const zNear = obj.relZ - obj.depth / 2;
            const zFar = obj.relZ + obj.depth / 2;
            const c1 = project(obj.x - obj.width / 2, 0, zNear);
            const c2 = project(obj.x + obj.width / 2, 0, zNear);
            const c3 = project(obj.x + obj.width / 2, 0, zFar);
            const c4 = project(obj.x - obj.width / 2, 0, zFar);

            ctx.fillStyle = obj.visited ? 'rgba(124, 246, 163, 0.3)' : 'rgba(255, 224, 107, 0.18)';
            ctx.beginPath();
            ctx.moveTo(c1.x, c1.y);
            ctx.lineTo(c2.x, c2.y);
            ctx.lineTo(c3.x, c3.y);
            ctx.lineTo(c4.x, c4.y);
            ctx.fill();

            ctx.strokeStyle = obj.visited ? '#7cf6a3' : '#ffe06b';
            ctx.lineWidth = 5 * s;
            ctx.lineCap = 'round';
            ctx.shadowColor = ctx.strokeStyle;
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.save();
            ctx.globalAlpha = obj.visited ? 0.42 : 0.9;
            const dockCenter = project(obj.x, 18, obj.relZ);
            drawCrownShape(dockCenter.x, dockCenter.y - 24 * s, 42 * s, obj.visited ? '#7cf6a3' : '#ffe06b', 0.7);
            ctx.restore();

            if (obj.passengers > 0) {
                for (let i = 0; i < obj.passengers; i++) {
                    const px = obj.x + (i * 80 - (obj.passengers * 40));
                    const pp = project(px, 0, zFar - 100);
                    const ph = 120 * pp.scale;
                    const iconScale = Math.max(0.18, 1.45 * pp.scale);

                    if (i % 2 === 0) {
                        drawBouquetIcon(pp.x, pp.y - ph * 0.72, iconScale, 0.96);
                    } else {
                        drawGiftBoxIcon(pp.x, pp.y - ph * 0.72, iconScale, 0.96);
                    }

                    drawHeartShape(pp.x, pp.y - ph * 1.04, 12 * pp.scale, '#ff7a9d', 0.88);
                }
            }
        }
        else if (obj.type === 'CAR') {
            const cw = obj.width * s;
            const ch = obj.height * s;
            const ty = p.y - ch;
            const hazardBody = obj.color === '#3b82f6' ? '#7c2d63' : '#ff4f74';

            ctx.fillStyle = 'rgba(0,0,0,0.44)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, cw / 1.75, cw / 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = hazardBody;
            ctx.beginPath();
            ctx.roundRect(p.x - cw / 2, ty, cw, ch, 12 * s);
            ctx.fill();

            ctx.fillStyle = 'rgba(39, 17, 45, 0.32)';
            for (let stripe = -2; stripe < 5; stripe++) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(p.x - cw / 2, ty, cw, ch);
                ctx.clip();
                ctx.translate(p.x - cw / 2 + stripe * 42 * s, ty);
                ctx.rotate(-0.52);
                ctx.fillRect(0, -ch, 16 * s, ch * 3);
                ctx.restore();
            }

            ctx.fillStyle = 'rgba(255,240,201,0.22)';
            ctx.fillRect(p.x - cw / 2 + 12 * s, ty + 8 * s, cw - 24 * s, ch * 0.36);

            ctx.fillStyle = '#fff0c9';
            ctx.font = `${Math.max(7, 30 * s)}px ${getComputedStyle(document.documentElement).getPropertyValue('--title-font')}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('BRUNCH', p.x, ty + ch * 0.55);

            ctx.fillStyle = '#ffe06b';
            ctx.shadowColor = '#ffe06b';
            ctx.shadowBlur = 10;
            ctx.fillRect(p.x - cw / 2 + 10 * s, ty + ch * 0.72, 32 * s, 15 * s);
            ctx.fillRect(p.x + cw / 2 - 42 * s, ty + ch * 0.72, 32 * s, 15 * s);
            ctx.shadowBlur = 0;
        }
        else if (obj.type === 'PLAYER') {
            const busScale = p.scale;
            const busW = 260 * busScale;
            const busH = 240 * busScale;

            const tilt = (state.playerX - state.inputX) * 0.3;
            const bob = Math.sin(Date.now() / 100) * 5 * busScale * (state.speed / 2000);

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(tilt);

            ctx.fillStyle = 'rgba(0,0,0,0.48)';
            ctx.beginPath();
            ctx.ellipse(0, 0, busW / 1.8, busW / 5, 0, 0, Math.PI * 2);
            ctx.fill();

            const busGradient = ctx.createLinearGradient(0, -busH + bob, 0, -20 * busScale + bob);
            busGradient.addColorStop(0, '#fff0c9');
            busGradient.addColorStop(0.18, CFG.themeColor);
            busGradient.addColorStop(1, '#ffad33');
            ctx.fillStyle = busGradient;
            ctx.beginPath();
            ctx.roundRect(-busW / 2, -busH + bob, busW, busH - 20 * busScale, 24 * busScale);
            ctx.fill();

            ctx.strokeStyle = 'rgba(39, 17, 45, 0.32)';
            ctx.lineWidth = 5 * busScale;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.24)';
            ctx.beginPath();
            ctx.roundRect(-busW / 2 + 16 * busScale, -busH + bob + 18 * busScale, busW - 32 * busScale, 26 * busScale, 12 * busScale);
            ctx.fill();

            ctx.fillStyle = 'rgba(39,17,45,0.12)';
            ctx.fillRect(-busW / 2, -busH + bob + busH * 0.6, busW, 12 * busScale);

            ctx.fillStyle = '#ffb7d5';
            ctx.beginPath();
            ctx.roundRect(-busW / 2 + 20 * busScale, -busH + bob + 30 * busScale, busW - 40 * busScale, 70 * busScale, 13 * busScale);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(-busW / 2 + 32 * busScale + i * 42 * busScale, -busH + bob + 112 * busScale, 18 * busScale, 38 * busScale);
            }

            ctx.fillStyle = '#5b1f54';
            ctx.font = `${Math.max(8, 34 * busScale)}px ${getComputedStyle(document.documentElement).getPropertyValue('--title-font')}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('MOM', 0, -busH + bob + 88 * busScale);
            drawHeartShape(busW * 0.32, -busH + bob + 82 * busScale, 18 * busScale, '#ff4f74', 0.9);

            const braking = state.boarding.phase === 'BRAKING' || state.boarding.phase === 'STOPPED';
            ctx.fillStyle = braking ? '#ff2a45' : '#991b1b';
            ctx.shadowColor = '#ff304d';
            ctx.shadowBlur = braking ? 30 : 0;

            ctx.beginPath();
            ctx.arc(-busW / 2 + 40 * busScale, -40 * busScale + bob, 20 * busScale, 0, Math.PI * 2);
            ctx.arc(busW / 2 - 40 * busScale, -40 * busScale + bob, 20 * busScale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 224, 107, 0.42)';
            ctx.fillRect(-busW / 2 + 24 * busScale, -18 * busScale + bob, busW - 48 * busScale, 10 * busScale);

            ctx.fillStyle = '#ffe06b';
            ctx.beginPath();
            ctx.moveTo(-34 * busScale, -busH + bob + 6 * busScale);
            ctx.lineTo(-18 * busScale, -busH + bob - 18 * busScale);
            ctx.lineTo(0, -busH + bob + 6 * busScale);
            ctx.lineTo(18 * busScale, -busH + bob - 18 * busScale);
            ctx.lineTo(34 * busScale, -busH + bob + 6 * busScale);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }
    });

    ctx.restore();
}

/**
 * ------------------------------------------------------------------
 * LOOP & INPUT
 * ------------------------------------------------------------------
 */
let lastTime = 0;
function loop(time) {
    if (!lastTime) lastTime = time;
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

let isDragging = false;
const handleInput = (clientX) => {
    const w = window.innerWidth;
    const center = w / 2;
    state.inputX = (clientX - center) / (w * 0.25);
};

window.addEventListener('pointerdown', e => {
    isDragging = true;
    handleInput(e.clientX);
    AudioSys.unlock();
    if (state.screen === 'PLAY') AudioSys.startLoop();
});

window.addEventListener('pointermove', e => {
    if (isDragging) handleInput(e.clientX);
});

window.addEventListener('pointerup', () => isDragging = false);
window.addEventListener('pointercancel', () => isDragging = false);

document.getElementById('start-btn').addEventListener('click', () => {
    AudioSys.unlock();
    AudioSys.play('ui');
    resetGame();
});

document.getElementById('restart-btn').addEventListener('click', () => {
    AudioSys.unlock();
    AudioSys.play('ui');
    resetGame();
});

requestAnimationFrame(loop);
</script>
