<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Orbital Archive: Expanded</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: true },
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'system-ui', 'sans-serif'],
                        mono: ['VT323', 'monospace'],
                        display: ['Orbitron', 'Rajdhani', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- [agent-note][stage4] repaired: approved-font-remap | roles: body->Rajdhani, terminal->VT323, title->Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-bg: #060816;
            --brand-bg-alt: #11162d;
            --panel-bg: rgba(7, 12, 30, 0.82);
            --panel-border: rgba(110, 231, 255, 0.42);
            --panel-glow: rgba(0, 212, 255, 0.22);
            --hero-core: #62f3ff;
            --hero-core-strong: #99fbff;
            --hero-accent: #a855f7;
            --danger: #ff587b;
            --gold: #ffd54a;
            --mint: #34f5c5;
            --text-main: #eef8ff;
            --text-dim: #98afcc;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at 50% 35%, rgba(98, 243, 255, 0.12), transparent 28%),
                radial-gradient(circle at 50% 80%, rgba(168, 85, 247, 0.12), transparent 30%),
                linear-gradient(180deg, var(--brand-bg), var(--brand-bg-alt));
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.02em;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            touch-action: none;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 27, 58, 0.92) 0%, rgba(8, 14, 33, 0.9) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 0 1px rgba(8, 20, 44, 0.55),
                0 16px 30px rgba(0, 0, 0, 0.34),
                0 0 22px var(--panel-glow);
        }

        .tech-btn {
            position: relative;
            background: linear-gradient(180deg, rgba(98, 243, 255, 0.18) 0%, rgba(98, 243, 255, 0.06) 100%);
            border: 1px solid rgba(126, 245, 255, 0.52);
            color: var(--hero-core-strong);
            transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease, border-color 0.14s ease;
            cursor: pointer;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 12px rgba(0, 212, 255, 0.14);
        }

        .tech-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.22) 45%, transparent 70%);
            transform: translateX(-120%);
            transition: transform 0.28s ease;
        }

        .tech-btn:hover::before,
        .tech-btn:focus-visible::before {
            transform: translateX(120%);
        }

        .tech-btn:active:not(:disabled) { 
            transform: scale(0.95); 
            filter: brightness(1.08);
            box-shadow: 0 0 18px rgba(98, 243, 255, 0.24);
        }

        .tech-btn:disabled { 
            border-color: #334155; 
            color: #51627b; 
            background: rgba(15, 23, 42, 0.8); 
            opacity: 0.7;
            filter: grayscale(0.6);
            box-shadow: none;
        }

        .hud-card {
            position: relative;
            overflow: hidden;
        }

        .hud-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 45%);
            pointer-events: none;
        }

        .intro-badge {
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            text-shadow: 0 0 18px rgba(98, 243, 255, 0.42);
        }

        .terminal-copy {
            font-family: 'VT323', monospace;
            font-size: 1.05rem;
            letter-spacing: 0.12em;
            line-height: 1.35;
        }

        .start-card,
        .game-over-card {
            position: relative;
            overflow: hidden;
        }

        .start-card::before,
        .game-over-card::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        .start-card::after,
        .game-over-card::after {
            content: "";
            position: absolute;
            inset: auto -20% -35% auto;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(98, 243, 255, 0.24), transparent 70%);
            pointer-events: none;
            filter: blur(10px);
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(98, 243, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(98, 243, 255, 0.045) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1), transparent 88%);
            z-index: 0;
        }

        .grid-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 48%, rgba(98, 243, 255, 0.16), transparent 12%),
                radial-gradient(circle at 50% 48%, rgba(168, 85, 247, 0.1), transparent 34%);
        }

        .archive-aura {
            position: absolute;
            width: min(64vw, 400px);
            aspect-ratio: 1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 999px;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle, rgba(98, 243, 255, 0.22) 0%, rgba(98, 243, 255, 0.08) 24%, rgba(168, 85, 247, 0.06) 48%, transparent 72%);
            filter: blur(10px);
            opacity: 0.9;
        }

        .archive-aura::before,
        .archive-aura::after {
            content: "";
            position: absolute;
            inset: 14%;
            border-radius: inherit;
            border: 1px solid rgba(98, 243, 255, 0.16);
            animation: aura-spin 12s linear infinite;
        }

        .archive-aura::after {
            inset: 4%;
            border-style: dashed;
            border-color: rgba(168, 85, 247, 0.22);
            animation-direction: reverse;
            animation-duration: 18s;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(98, 243, 255, 0.26), 0 0 22px rgba(98, 243, 255, 0.12); }
            50% { box-shadow: 0 0 18px rgba(98, 243, 255, 0.42), 0 0 34px rgba(168, 85, 247, 0.2); }
        }

        @keyframes aura-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));
            width: min(30vw, 120px);
            border-radius: 1rem;
            border: 1px solid rgba(110, 231, 255, 0.42);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 12;
            object-fit: cover;
            background: rgba(7, 12, 30, 0.7);
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.is-fail {
            left: 0.75rem;
            right: auto;
            border-color: rgba(255, 88, 123, 0.5);
        }

        .animate-glow { animation: pulse-glow 2s infinite; }
        .hidden { display: none !important; }

        @media (max-width: 640px) {
            .archive-aura {
                width: min(78vw, 320px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full overflow-hidden">
        <div class="grid-overlay"></div>
        <div class="archive-aura" aria-hidden="true"></div>
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: combat-hit and defeat-warning -> catalogs/gifs.json -->
        <img id="hit-gif" class="feedback-gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Combat hit reaction" aria-hidden="true">
        <img id="fail-gif" class="feedback-gif is-fail" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Failure warning reaction" aria-hidden="true">
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col pointer-events-none safe-area-inset z-10">
            
            <!-- HUD -->
            <div id="hud" class="hidden w-full p-2 flex justify-between items-start pointer-events-auto">
                <div class="glass-panel hud-card p-2 rounded flex flex-col items-center border-l-2 border-cyan-400 min-w-[80px]">
                    <div class="text-[9px] text-blue-400 font-bold">VAULT</div>
                    <div class="text-xl font-bold text-white" id="healthDisplay">100%</div>
                </div>
                
                <div class="glass-panel hud-card p-2 rounded flex flex-col items-center border-t-2 border-rose-500 min-w-[100px]">
                     <div class="text-[9px] text-red-400 font-bold">BREACH</div>
                     <div class="text-lg font-bold text-red-100" id="waveDisplay">BOSS 0</div>
                </div>

                <div class="glass-panel hud-card p-2 rounded flex flex-col items-center border-r-2 border-amber-400 min-w-[80px]">
                    <div class="text-[9px] text-yellow-400 font-bold">FILES</div>
                    <div class="text-xl font-bold text-white" id="scoreDisplay">0</div>
                </div>
            </div>

            <!-- Upgrade Dock -->
            <div id="upgrade-panel" class="hidden absolute bottom-0 w-full glass-panel pointer-events-auto flex flex-col pb-safe">
                <div class="flex gap-2 p-2 overflow-x-auto items-center no-scrollbar" id="shop-container">
                    <!-- Buttons generated by JS -->
                </div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-auto bg-slate-950/95 z-50 p-6">
                <div class="glass-panel start-card p-8 rounded-xl border border-cyan-400 text-center max-w-md w-full flex flex-col gap-6 shadow-2xl">
                    <div>
                        <h1 class="intro-badge text-3xl font-bold text-cyan-300 tracking-tight mb-1">ORBITAL ARCHIVE</h1>
                        <div class="text-[10px] text-cyan-100/60 tracking-[0.4em]">EXPANDED EDITION</div>
                    </div>
                    
                    <div class="text-left terminal-copy text-cyan-100/90 space-y-1 bg-slate-950/60 p-4 rounded border border-cyan-500/20 shadow-[0_0_18px_rgba(0,212,255,0.08)]">
                        <p>> ARCHIVIST CORE: LUMI ACTIVE ✦</p>
                        <p>> ALERT: 14 BREACH PATTERNS</p>
                        <p>> LOADOUT: 12 GUARDIAN DRONES</p>
                        <p>> OBJECTIVE: PROTECT THE MEMORY VAULT</p>
                    </div>

                    <button id="start-btn" class="tech-btn py-4 text-lg font-bold w-full rounded animate-glow text-white bg-cyan-900/50 border-cyan-400">
                        OPEN VAULT
                    </button>
                    
                    <button id="toggle-sound" class="tech-btn py-2 text-xs w-full rounded text-slate-400 border-slate-700">
                        AUDIO: ON
                    </button>
                </div>
            </div>

            <!-- Game Over -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex justify-center items-center pointer-events-auto bg-red-950/90 backdrop-blur-md z-50 p-6">
                <div class="glass-panel game-over-card p-8 rounded-xl border-2 border-red-500 text-center max-w-md w-full">
                    <h2 class="text-4xl font-bold text-red-500 mb-2">ARCHIVE LOST</h2>
                    <div class="bg-black/40 p-4 rounded mb-6 border border-red-900">
                        <div class="text-xs text-red-400 mb-1">FILES SAVED</div>
                        <div class="text-3xl font-mono text-white" id="finalScore">0</div>
                    </div>
                    <button id="restart-btn" class="tech-btn py-4 px-8 text-lg font-bold w-full rounded border-red-500 text-red-100 hover:bg-red-900/50">
                        REOPEN VAULT
                    </button>
                </div>
            </div>
            
            <!-- Toast -->
            <div id="toast" class="hidden absolute top-[20%] left-1/2 transform -translate-x-1/2 glass-panel px-6 py-2 rounded-full border-yellow-500 text-yellow-400 font-bold text-center z-40 text-xs tracking-widest">
                NOTIFICATION
            </div>
        </div>
    </div>

    <script>
     /**
      * ORBITAL ARCHIVE: EXPANDED
      * 14 breach patterns, 12 drone upgrades, scaled view
      */

    // --- CONFIGURATION ---
    const SCALE = 0.8; // "Screen Bigger" effect (zooms out)
    const CORE_RADIUS = 50 * SCALE;
    
    const ENEMY_TYPES = {
        virus:    { hp: 30,  speed: 1.0, size: 12, color: '#f43f5e', reward: 10, shape: 'star' },
        tank:     { hp: 120, speed: 0.4, size: 22, color: '#a855f7', reward: 30, shape: 'square' },
        glitch:   { hp: 20,  speed: 1.8, size: 10, color: '#22c55e', reward: 15, shape: 'glitch' },
        worm:     { hp: 40,  speed: 0.8, size: 14, color: '#84cc16', reward: 20, shape: 'circle', move: 'sine' },
        swarm:    { hp: 10,  speed: 2.2, size: 8,  color: '#eab308', reward: 5,  shape: 'tri' },
        stealth:  { hp: 45,  speed: 0.9, size: 14, color: '#3b82f6', reward: 25, shape: 'tri', alpha: 0.2 },
        carrier:  { hp: 200, speed: 0.3, size: 28, color: '#d946ef', reward: 60, shape: 'hex', spawnOnDeath: 'swarm' },
        sniper:   { hp: 35,  speed: 0.7, size: 16, color: '#06b6d4', reward: 30, shape: 'diamond', rangeStop: 150 },
        dasher:   { hp: 50,  speed: 0.5, size: 14, color: '#f97316', reward: 25, shape: 'arrow', dash: true },
        shielder: { hp: 150, speed: 0.4, size: 20, color: '#64748b', reward: 40, shape: 'shield' },
        regen:    { hp: 60,  speed: 0.6, size: 16, color: '#10b981', reward: 35, shape: 'cross', regen: true },
        kamikaze: { hp: 25,  speed: 0.5, size: 12, color: '#ef4444', reward: 20, shape: 'bomb', accel: true },
        orbiter:  { hp: 70,  speed: 0.8, size: 15, color: '#8b5cf6', reward: 30, shape: 'moon', orbit: true },
        rootkit:  { hp: 300, speed: 0.2, size: 30, color: '#475569', reward: 100, shape: 'block' } // Mini-boss
    };

    const BOT_TYPES = [
        { id: 'repair', name: 'REPAIR', icon: '❤️', cost: 100, type: 'instant', effect: 'heal' },
        { id: 'click',  name: 'CLICK',  icon: '👆', cost: 50,  type: 'upgrade', effect: 'clickDmg' },
        { id: 'zap',    name: 'ZAP',    icon: '⚡', cost: 100, type: 'bot', color: '#0ea5e9', range: 120, rate: 40, dmg: 15, proj: 'instant' },
        { id: 'pyro',   name: 'PYRO',   icon: '🔥', cost: 250, type: 'bot', color: '#f97316', range: 100, rate: 70, dmg: 20, proj: 'fire' },
        { id: 'ice',    name: 'FROST',  icon: '❄️', cost: 400, type: 'bot', color: '#67e8f9', range: 140, rate: 60, dmg: 10, proj: 'ice' }, // Slows
        { id: 'sniper', name: 'RAIL',   icon: '🎯', cost: 600, type: 'bot', color: '#84cc16', range: 300, rate: 120, dmg: 100, proj: 'rail' }, // High dmg, slow
        { id: 'missile',name: 'ROCKET', icon: '🚀', cost: 850, type: 'bot', color: '#ef4444', range: 180, rate: 90, dmg: 40, proj: 'missile' }, // Homing
        { id: 'orbit',  name: 'ORBIT',  icon: '💫', cost: 1200, type: 'bot', color: '#a855f7', range: 0,   rate: 0,  dmg: 5,  proj: 'orbit' }, // Melee aura
        { id: 'push',   name: 'PULSE',  icon: '🔊', cost: 1500, type: 'bot', color: '#ffffff', range: 80,  rate: 100, dmg: 0,  proj: 'push' }, // Knockback
        { id: 'laser',  name: 'BEAM',   icon: '🔦', cost: 2000, type: 'bot', color: '#facc15', range: 150, rate: 5,   dmg: 2,  proj: 'beam' }, // Fast tick
        { id: 'chain',  name: 'ARC',    icon: '🔗', cost: 2800, type: 'bot', color: '#6366f1', range: 130, rate: 50,  dmg: 25, proj: 'chain' }, // Bounces
        { id: 'nuke',   name: 'NUKE',   icon: '☢️', cost: 5000, type: 'bot', color: '#10b981', range: 999, rate: 600, dmg: 500, proj: 'nuke' } // Screen clear
    ];

    // --- AUDIO SYSTEM ---
    // [agent-note][stage3] resolved-audio: ui/combat/loop -> catalogs/audios.json
    const AudioCatalog = {
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        click: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        projectile: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3',
        enemyHit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3',
        coreDamage: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_01.mp3',
        success: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
        victory: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
        loop: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3'
    };

    const AudioSys = {
        enabled: true,
        unlocked: false,
        pools: {},
        loop: null,
        loopStarted: false,
        init() {
            if (this.unlocked) return;
            this.unlocked = true;
            this.loop = new Audio(AudioCatalog.loop);
            this.loop.loop = true;
            this.loop.volume = 0.2;
            this.loop.preload = 'auto';
            this.loop.playsInline = true;
        },
        ensurePool(type, src, volume = 0.45, size = 3) {
            if (this.pools[type]) return this.pools[type];
            this.pools[type] = Array.from({ length: size }, () => {
                const audio = new Audio(src);
                audio.volume = volume;
                audio.preload = 'auto';
                audio.playsInline = true;
                return audio;
            });
            return this.pools[type];
        },
        playFromPool(type, src, volume, size) {
            if (!this.enabled || !this.unlocked) return;
            const pool = this.ensurePool(type, src, volume, size);
            const audio = pool.find((item) => item.paused || item.ended) || pool[0];
            try {
                audio.currentTime = 0;
                const playPromise = audio.play();
                if (playPromise?.catch) playPromise.catch(() => {});
            } catch (_) {}
        },
        startLoop() {
            if (!this.enabled || !this.unlocked || !this.loop) return;
            if (!this.loopStarted) this.loop.currentTime = 0;
            this.loopStarted = true;
            try {
                const playPromise = this.loop.play();
                if (playPromise?.catch) playPromise.catch(() => {});
            } catch (_) {}
        },
        stopLoop(reset = false) {
            if (!this.loop) return;
            this.loop.pause();
            if (reset) {
                this.loop.currentTime = 0;
                this.loopStarted = false;
            }
        },
        syncLoop() {
            if (this.enabled && STATE.gameActive) this.startLoop();
            else this.stopLoop(false);
        },
        setEnabled(nextEnabled) {
            this.enabled = nextEnabled;
            if (!this.enabled) this.stopLoop(false);
            else this.syncLoop();
        },
        play(type) {
            switch (type) {
                case 'start':
                    this.playFromPool('start', AudioCatalog.start, 0.5, 2);
                    break;
                case 'ui':
                    this.playFromPool('ui', AudioCatalog.click, 0.35, 3);
                    break;
                case 'blocked':
                    this.playFromPool('blocked', AudioCatalog.blocked, 0.4, 2);
                    break;
                case 'fire':
                    this.playFromPool('fire', AudioCatalog.projectile, 0.28, 4);
                    break;
                case 'hit':
                    this.playFromPool('hit', AudioCatalog.enemyHit, 0.33, 4);
                    break;
                case 'damage':
                    this.playFromPool('damage', AudioCatalog.coreDamage, 0.45, 2);
                    break;
                case 'success':
                    this.playFromPool('success', AudioCatalog.success, 0.42, 2);
                    break;
                case 'win':
                    this.playFromPool('win', AudioCatalog.victory, 0.5, 2);
                    break;
                case 'lose':
                    this.playFromPool('lose', AudioCatalog.gameOver, 0.5, 2);
                    break;
                case 'nuke':
                    this.playFromPool('nuke', AudioCatalog.victory, 0.38, 1);
                    break;
            }
        }
    };

    // --- GAME STATE ---
    const STATE = {
        data: 0,
        health: 100,
        maxHealth: 100,
        clickDmg: 20,
        bossLevel: 0,
        waveProgress: 0,
        gameActive: false,
        bots: [], // Stores counts: { zap: 2, pyro: 1 }
        costs: {} // Stores current costs
    };

    let width, height;
    let canvas, ctx;
    let enemies = [];
    let projectiles = [];
    let particles = [];
    let activeBots = []; // The actual bot instances
    let frame = 0;
    let shake = 0;
    let hitGifEl;
    let failGifEl;
    let gifTimeouts = [];

    // --- ENTITIES ---
    class BotEntity {
        constructor(def) {
            this.def = def;
            this.timer = Math.random() * 100;
            this.angle = Math.random() * Math.PI * 2;
            this.orbitDist = 70 * SCALE + (Math.random() * 30);
            this.speed = 0.01 + Math.random() * 0.01;
            
            // For orbital bots
            if (def.proj === 'orbit') {
                this.orbitAngle = 0;
                this.orbitRadius = 100 * SCALE;
            }
        }

        update() {
            this.angle += this.speed;
            this.timer++;

            const cx = width/2 + Math.cos(this.angle) * this.orbitDist;
            const cy = height/2 + Math.sin(this.angle) * this.orbitDist;

            // Attack Logic
            if (this.def.rate > 0 && this.timer >= this.def.rate) {
                this.timer = 0;
                this.attack(cx, cy);
            }
            
            // Orbit Melee Logic
            if (this.def.proj === 'orbit') {
                this.orbitAngle += 0.05;
                const ox = width/2 + Math.cos(this.orbitAngle) * this.orbitRadius;
                const oy = height/2 + Math.sin(this.orbitAngle) * this.orbitRadius;
                // Check collisions
                enemies.forEach(e => {
                    if(e.dead) return;
                    const d = Math.hypot(e.x - ox, e.y - oy);
                    if(d < 20 * SCALE + e.size) {
                        e.takeDamage(this.def.dmg);
                        createParticles(e.x, e.y, this.def.color, 2);
                    }
                });
            }
        }

        attack(x, y) {
            if (this.def.proj === 'nuke') {
                enemies.forEach(e => e.takeDamage(this.def.dmg));
                shake = 30;
                AudioSys.play('nuke');
                createParticles(width/2, height/2, '#ffffff', 50);
                return;
            }
            
            if (this.def.proj === 'push') {
                enemies.forEach(e => {
                    const d = Math.hypot(e.x - width/2, e.y - height/2);
                    if (d < this.def.range * SCALE) {
                        const angle = Math.atan2(e.y - height/2, e.x - width/2);
                        e.x += Math.cos(angle) * 40 * SCALE;
                        e.y += Math.sin(angle) * 40 * SCALE;
                    }
                });
                createParticles(width/2, height/2, '#ffffff', 10);
                return;
            }

            // Target selection
            let target = null;
            let minDist = Infinity;
            
            for (let e of enemies) {
                if (e.dead) continue;
                const d = Math.hypot(e.x - width/2, e.y - height/2);
                if (d < this.def.range * SCALE * 2 && d < minDist) { // *2 for screen scale feeling
                    minDist = d;
                    target = e;
                }
            }

            if (target) {
                if (this.def.proj === 'instant' || this.def.proj === 'beam') {
                    target.takeDamage(this.def.dmg);
                    createParticles(target.x, target.y, this.def.color, 3);
                    // Draw beam
                    ctx.strokeStyle = this.def.color;
                    ctx.lineWidth = this.def.proj === 'beam' ? 1 : 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();
                    AudioSys.play('zap');
                } else {
                    // Projectile
                    const angle = Math.atan2(target.y - y, target.x - x);
                    projectiles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * 5 * SCALE,
                        vy: Math.sin(angle) * 5 * SCALE,
                        life: 60,
                        type: this.def.proj,
                        dmg: this.def.dmg,
                        color: this.def.color,
                        target: this.def.proj === 'missile' ? target : null
                    });
                    AudioSys.play('fire');
                }
            }
        }

        draw() {
            const cx = width/2 + Math.cos(this.angle) * this.orbitDist;
            const cy = height/2 + Math.sin(this.angle) * this.orbitDist;
            
            ctx.fillStyle = this.def.color;
            ctx.beginPath();
            ctx.arc(cx, cy, 4 * SCALE, 0, Math.PI*2);
            ctx.fill();

            if (this.def.proj === 'orbit') {
                const ox = width/2 + Math.cos(this.orbitAngle) * this.orbitRadius;
                const oy = height/2 + Math.sin(this.orbitAngle) * this.orbitRadius;
                ctx.beginPath();
                ctx.arc(ox, oy, 6 * SCALE, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = this.def.color;
                ctx.globalAlpha = 0.3;
                ctx.beginPath(); ctx.arc(width/2, height/2, this.orbitRadius, 0, Math.PI*2); ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }
    }

    class Enemy {
        constructor(isBoss) {
            // Spawn edge
            const edge = Math.floor(Math.random() * 4);
            const offset = 50 * SCALE;
            if (edge === 0) { this.x = Math.random() * width; this.y = -offset; }
            else if (edge === 1) { this.x = width + offset; this.y = Math.random() * height; }
            else if (edge === 2) { this.x = Math.random() * width; this.y = height + offset; }
            else { this.x = -offset; this.y = Math.random() * height; }

            this.isBoss = isBoss;
            this.dead = false;
            this.frozen = 0;
            this.burn = 0;
            this.maxHp = 0;
            
            // Select Type
            if (isBoss) {
                this.def = { ...ENEMY_TYPES.carrier, hp: 1000, size: 40, color: '#ef4444', speed: 0.2 };
                this.hp = this.def.hp * (1 + STATE.bossLevel);
            } else {
                // Progressive Spawn Pool
                const keys = Object.keys(ENEMY_TYPES);
                // Unlock more types as bossLevel increases
                const available = Math.min(keys.length, 3 + STATE.bossLevel * 2);
                const typeKey = keys[Math.floor(Math.random() * available)];
                this.def = ENEMY_TYPES[typeKey];
                this.hp = this.def.hp * (1 + STATE.bossLevel * 0.2);
            }
            
            this.maxHp = this.hp;
            this.size = this.def.size * SCALE;
            this.baseSpeed = this.def.speed * SCALE;
            
            // State vars
            this.t = Math.random() * 100;
            this.velX = 0;
            this.velY = 0;
        }

        takeDamage(amt) {
            if (this.dead) return;
            this.hp -= amt;
            createParticles(this.x, this.y, '#fff', 1);
            if (this.hp <= 0) this.die();
        }

        die() {
            this.dead = true;
            STATE.data += Math.floor(this.def.reward);
            AudioSys.play('hit');
            createParticles(this.x, this.y, this.def.color, 8);
            
            if (this.def.spawnOnDeath) {
                // Spawn sub-enemies
                for(let i=0; i<3; i++) {
                    const e = new Enemy(false);
                    e.def = ENEMY_TYPES[this.def.spawnOnDeath];
                    e.x = this.x + (Math.random()-0.5)*20;
                    e.y = this.y + (Math.random()-0.5)*20;
                    e.hp = e.def.hp; e.maxHp = e.hp;
                    e.size = e.def.size * SCALE;
                    enemies.push(e);
                }
            }

            if (this.isBoss) {
                STATE.bossLevel++;
                STATE.isBossActive = false;
                STATE.waveProgress = 0;
                shake = 20;
                showToast(`BREACH WAVE ${STATE.bossLevel} CONTAINED`);
                pulseGif(hitGifEl, 1600);
                AudioSys.play('win');
            } else if (!STATE.isBossActive) {
                STATE.waveProgress++;
            }
            updateUI();
        }

        update() {
            if (this.dead) return;
            this.t++;

            // Status Effects
            let speed = this.baseSpeed;
            if (this.frozen > 0) { speed *= 0.5; this.frozen--; }
            if (this.def.accel) speed *= (1 + this.t * 0.005);

            // Movement Logic
            const dx = (width / 2) - this.x;
            const dy = (height / 2) - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);

            // Behaviors
            if (this.def.rangeStop && dist < this.def.rangeStop * SCALE) {
                // Sniper stops and shoots
                if (this.t % 100 === 0) {
                    STATE.health -= 2;
                    createParticles(width/2, height/2, '#f00', 3);
                    shake = 2;
                    // Beam effect
                    ctx.strokeStyle = this.def.color;
                    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(width/2, height/2); ctx.stroke();
                }
            } else if (this.def.orbit && dist < 100 * SCALE) {
                // Orbit
                this.x += Math.cos(angle + 1.5) * speed;
                this.y += Math.sin(angle + 1.5) * speed;
                // Slowly spiral in
                this.x += Math.cos(angle) * speed * 0.3;
                this.y += Math.sin(angle) * speed * 0.3;
            } else if (this.def.move === 'sine') {
                // Sine wave approach
                this.x += Math.cos(angle) * speed + Math.cos(this.t * 0.1) * speed;
                this.y += Math.sin(angle) * speed + Math.sin(this.t * 0.1) * speed;
            } else {
                // Standard
                this.x += Math.cos(angle) * speed;
                this.y += Math.sin(angle) * speed;
            }

            // Regen
            if (this.def.regen && this.t % 60 === 0 && this.hp < this.maxHp) {
                this.hp += 5;
            }

            // Hit Core
            if (dist < CORE_RADIUS) {
                STATE.health -= this.isBoss ? 30 : (this.def.hp > 100 ? 15 : 5);
                this.dead = true;
                shake = 10;
                pulseGif(failGifEl, 1200);
                AudioSys.play('damage');
                createParticles(width/2, height/2, '#f00', 10);
                if (STATE.health <= 0) gameOver();
                updateUI();
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.def.alpha) ctx.globalAlpha = this.def.alpha + (this.hp < this.maxHp ? 0.5 : 0); // Reveal on hit

            ctx.fillStyle = this.def.color;
            
            // Shapes
            ctx.beginPath();
            if (this.def.shape === 'square') ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            else if (this.def.shape === 'tri') {
                ctx.moveTo(this.size, 0); ctx.lineTo(-this.size/2, this.size/2); ctx.lineTo(-this.size/2, -this.size/2); ctx.fill();
            }
            else if (this.def.shape === 'star') {
                for(let i=0; i<5; i++) {
                    const a = (i/5)*Math.PI*2 - Math.PI/2;
                    ctx.lineTo(Math.cos(a)*this.size, Math.sin(a)*this.size);
                }
                ctx.fill();
            }
            else ctx.arc(0, 0, this.size/2, 0, Math.PI*2);
            ctx.fill();

            // HP Bar
            const hpPct = this.hp / this.maxHp;
            ctx.fillStyle = '#334155';
            ctx.fillRect(-10, -this.size, 20, 3);
            ctx.fillStyle = hpPct > 0.5 ? '#22c55e' : '#ef4444';
            ctx.fillRect(-10, -this.size, 20 * hpPct, 3);

            ctx.restore();
        }
    }

    // --- SYSTEMS ---
    function clearGifTimers() {
        gifTimeouts.forEach((timeout) => clearTimeout(timeout));
        gifTimeouts = [];
    }

    function pulseGif(el, duration = 900) {
        if (!el) return;
        el.classList.add('visible');
        const timeout = setTimeout(() => {
            el.classList.remove('visible');
        }, duration);
        gifTimeouts.push(timeout);
    }

    function initShop() {
        const container = document.getElementById('shop-container');
        container.innerHTML = '';
        
        BOT_TYPES.forEach(bot => {
            STATE.costs[bot.id] = bot.cost;
            STATE.bots[bot.id] = 0; // count

            const btn = document.createElement('button');
            btn.className = `tech-btn p-2 rounded-lg w-16 h-16 flex flex-col justify-between items-center flex-shrink-0`;
            btn.id = `btn-${bot.id}`;
            btn.innerHTML = `
                <span class="text-[9px] font-bold tracking-tighter">${bot.name}</span>
                <div class="text-lg">${bot.icon}</div>
                <span class="text-[10px] font-mono text-yellow-400" id="cost-${bot.id}">${bot.cost}</span>
            `;
            
            btn.onclick = () => buyUpgrade(bot);
            container.appendChild(btn);
        });
    }

    function buyUpgrade(bot) {
        const cost = STATE.costs[bot.id];
        if (STATE.data >= cost) {
            
            if (bot.id === 'repair') {
                if (STATE.health >= 100) {
                    AudioSys.play('blocked');
                    return;
                }
                STATE.health = Math.min(100, STATE.health + 30);
                AudioSys.play('success');
            } else if (bot.id === 'click') {
                STATE.clickDmg += 10;
                AudioSys.play('success');
            } else {
                STATE.bots[bot.id]++;
                activeBots.push(new BotEntity(bot));
                AudioSys.play('ui');
            }

            STATE.data -= cost;
            STATE.costs[bot.id] = Math.floor(cost * 1.4);
            updateUI();
        } else {
            AudioSys.play('blocked');
        }
    }

    function updateUI() {
        document.getElementById('scoreDisplay').innerText = STATE.data;
        document.getElementById('healthDisplay').innerText = Math.floor(STATE.health) + "%";
        document.getElementById('waveDisplay').innerText = "LVL " + STATE.bossLevel;

        BOT_TYPES.forEach(bot => {
            const btn = document.getElementById(`btn-${bot.id}`);
            const costLabel = document.getElementById(`cost-${bot.id}`);
            const currentCost = STATE.costs[bot.id];
            
            if (btn && costLabel) {
                costLabel.innerText = currentCost;
                btn.disabled = STATE.data < currentCost;
                if (bot.id === 'repair' && STATE.health >= 100) btn.disabled = true;
            }
        });
    }

    function createParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            particles.push({
                x, y, color,
                vx: (Math.random()-0.5)*10,
                vy: (Math.random()-0.5)*10,
                life: 1.0
            });
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 2000);
    }

    function resize() {
        // High DPI Canvas
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Logical width/height for calculations
        // We leave width/height as CSS pixels for logic
    }

    // --- LOOP ---
    function gameLoop() {
        if (!STATE.gameActive) return;
        frame++;

        // Clear
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, width, height);

        // Shake
        ctx.save();
        if (shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        // Draw Core
        const cx = width/2, cy = height/2;
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath(); ctx.arc(cx, cy, CORE_RADIUS, 0, Math.PI*2); ctx.fill();
        // Core Pulse
        ctx.strokeStyle = `rgba(59, 130, 246, ${0.5 + Math.sin(frame*0.1)*0.2})`;
        ctx.beginPath(); ctx.arc(cx, cy, CORE_RADIUS + 5, 0, Math.PI*2); ctx.stroke();

        // Spawn
        if (!STATE.isBossActive) {
            const needed = 15 + STATE.bossLevel * 5;
            if (STATE.waveProgress >= needed) {
                STATE.isBossActive = true;
                enemies.push(new Enemy(true));
                showToast("WARNING: CARRIER BREACH DETECTED");
            } else if (frame % Math.max(20, 60 - STATE.bossLevel) === 0) {
                enemies.push(new Enemy(false));
            }
        }

        // Bots
        activeBots.forEach(b => { b.update(); b.draw(); });

        // Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx; p.y += p.vy;
            p.life--;
            
            // Homing
            if (p.type === 'missile' && p.target && !p.target.dead) {
                const angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
                p.vx = p.vx * 0.9 + Math.cos(angle) * 1.0;
                p.vy = p.vy * 0.9 + Math.sin(angle) * 1.0;
            }

            // Collision
            let hit = false;
            for (let e of enemies) {
                if (e.dead) continue;
                if (Math.hypot(e.x - p.x, e.y - p.y) < e.size + 10) {
                    e.takeDamage(p.dmg);
                    if (p.type === 'ice') e.frozen = 60;
                    hit = true;
                    if (p.type !== 'chain') break; // Chain hits multiple? Simplified to pierce for now
                }
            }

            if (hit || p.life <= 0) {
                if (hit) createParticles(p.x, p.y, p.color, 3);
                projectiles.splice(i, 1);
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3 * SCALE, 0, Math.PI*2); ctx.fill();
            }
        }

        // Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.update();
            if (e.dead) enemies.splice(i, 1);
            else e.draw();
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
            else {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            }
        }
        ctx.globalAlpha = 1;

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        STATE.gameActive = false;
        AudioSys.stopLoop(true);
        clearGifTimers();
        pulseGif(failGifEl, 1800);
        AudioSys.play('lose');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('upgrade-panel').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = STATE.data;
    }

    // --- INPUT ---
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    hitGifEl = document.getElementById('hit-gif');
    failGifEl = document.getElementById('fail-gif');
    window.addEventListener('resize', resize);
    resize();

    canvas.addEventListener('pointerdown', (e) => {
        if (!STATE.gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        let hit = false;
        enemies.forEach(en => {
            if (Math.hypot(en.x - x, en.y - y) < en.size + 40) {
                en.takeDamage(STATE.clickDmg);
                hit = true;
            }
        });

        if (hit) {
            pulseGif(hitGifEl, 700);
            AudioSys.play('hit');
        } else {
            createParticles(x, y, 'rgba(255,255,255,0.2)', 2);
            AudioSys.play('fire');
        }
    });

    document.getElementById('start-btn').onclick = () => {
        AudioSys.init();
        AudioSys.play('start');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('upgrade-panel').classList.remove('hidden');
        
        clearGifTimers();
        initShop();
        STATE.gameActive = true;
        STATE.health = 100;
        STATE.data = 0;
        STATE.bossLevel = 0;
        STATE.waveProgress = 0;
        STATE.isBossActive = false;
        enemies = [];
        activeBots = [];
        projectiles = [];
        particles = [];
        AudioSys.syncLoop();
        updateUI();
        gameLoop();
    };

    document.getElementById('restart-btn').onclick = document.getElementById('start-btn').onclick;

    document.getElementById('toggle-sound').onclick = (e) => {
        AudioSys.init();
        AudioSys.setEnabled(!AudioSys.enabled);
        AudioSys.play('ui');
        e.target.innerText = `AUDIO: ${AudioSys.enabled ? 'ON' : 'OFF'}`;
    };

    </script>
</body>
