<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#39ff14">
    <title>Portal Shield: Dimension Cleanup</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --twitch-purple: #7c3aed;
            --neon-cyan: #48f7ff;
            --neon-pink: #ff3fa4;
            --neon-lime: #39ff14;
            --danger-red: #ff445e;
            --dark-bg: #07110d;
            --panel-bg: rgba(6, 20, 17, 0.88);
            --panel-edge: rgba(57, 255, 20, 0.58);
            --white: #ffffff;
            --soft-white: #f3f7ff;
            --shadow-deep: rgba(0, 0, 0, 0.45);
            --font-display: 'Orbitron', system-ui, sans-serif;
            --font-ui: 'Rajdhani', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(57, 255, 20, 0.18), transparent 35%),
                radial-gradient(circle at bottom, rgba(255, 63, 164, 0.14), transparent 32%),
                linear-gradient(180deg, #10231d 0%, var(--dark-bg) 62%, #020504 100%);
            color: var(--white);
            font-family: var(--font-ui);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .pixel-font {
            font-family: var(--font-display);
            letter-spacing: 0.06em;
        }

        .ui-font {
            font-family: var(--font-ui);
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(57, 255, 20, 0.11) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(72, 247, 255, 0.08) 1px, transparent 1px);
        }

        .glass-panel {
            background:
                radial-gradient(circle at 18% 0%, rgba(57, 255, 20, 0.14), transparent 32%),
                radial-gradient(circle at 86% 92%, rgba(72, 247, 255, 0.1), transparent 28%),
                linear-gradient(180deg, rgba(7, 24, 20, 0.96), rgba(7, 10, 22, 0.93)),
                var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--panel-edge);
            box-shadow:
                0 18px 35px var(--shadow-deep),
                inset 0 0 0 1px rgba(72, 247, 255, 0.18),
                0 0 22px rgba(57, 255, 20, 0.2);
            color: white;
        }

        .screen-overlay {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--dark-bg);
            touch-action: none;
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 18%, rgba(57, 255, 20, 0.24), transparent 25%),
                radial-gradient(circle at 18% 72%, rgba(72, 247, 255, 0.11), transparent 30%),
                radial-gradient(circle at 82% 78%, rgba(255, 63, 164, 0.1), transparent 30%),
                linear-gradient(to bottom, rgba(8, 32, 25, 0.96), rgba(3, 7, 12, 1));
            opacity: 0.96;
        }

        .bg-gradient::before,
        .bg-gradient::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 19%;
            width: min(58vw, 420px);
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.42;
        }

        .bg-gradient::before {
            border: 10px solid rgba(57, 255, 20, 0.44);
            box-shadow:
                0 0 26px rgba(57, 255, 20, 0.38),
                inset 0 0 34px rgba(72, 247, 255, 0.18);
            background:
                conic-gradient(from 0deg, transparent 0 18%, rgba(57, 255, 20, 0.38) 22%, transparent 32% 58%, rgba(72, 247, 255, 0.22) 64%, transparent 76%);
            animation: portal-spin 18s linear infinite;
        }

        .bg-gradient::after {
            width: min(35vw, 250px);
            border: 4px dashed rgba(72, 247, 255, 0.35);
            filter: blur(0.2px);
            animation: portal-spin 11s linear infinite reverse;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.62;
            animation: lab-grid-drift 16s linear infinite;
        }

        .bg-lab-props {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .bg-lab-props::before {
            content: "";
            position: absolute;
            left: 7vw;
            bottom: 7vh;
            width: min(34vw, 190px);
            height: min(25vh, 170px);
            border-radius: 28px 28px 8px 8px;
            background:
                radial-gradient(circle at 22% 34%, rgba(57, 255, 20, 0.18) 0 8%, transparent 9%),
                radial-gradient(circle at 52% 44%, rgba(72, 247, 255, 0.18) 0 7%, transparent 8%),
                linear-gradient(90deg, transparent 0 15%, rgba(72, 247, 255, 0.18) 16% 18%, transparent 19% 42%, rgba(255, 63, 164, 0.13) 43% 45%, transparent 46%),
                linear-gradient(180deg, rgba(57, 255, 20, 0.08), rgba(5, 13, 13, 0.28));
            border: 1px solid rgba(57, 255, 20, 0.22);
            box-shadow: inset 0 0 24px rgba(72, 247, 255, 0.08), 0 0 30px rgba(57, 255, 20, 0.08);
            opacity: 0.52;
        }

        .bg-lab-props::after {
            content: "";
            position: absolute;
            right: 8vw;
            top: 14vh;
            width: min(28vw, 150px);
            height: min(20vh, 150px);
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, transparent 0 42%, rgba(57, 255, 20, 0.18) 43% 48%, transparent 49%),
                conic-gradient(from 40deg, transparent 0 16%, rgba(72, 247, 255, 0.18) 18% 23%, transparent 25% 52%, rgba(255, 63, 164, 0.12) 56% 62%, transparent 65%);
            border: 2px dashed rgba(72, 247, 255, 0.2);
            animation: citadel-orbit 22s linear infinite reverse;
            opacity: 0.48;
        }

        .dimension-readout {
            margin-top: 0.45rem;
            align-self: flex-start;
            color: rgba(219, 234, 254, 0.88);
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(72, 247, 255, 0.35);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: max(1rem, env(safe-area-inset-top)) 1rem 1rem;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            width: 100%;
        }

        .meter-wrap {
            display: flex;
            flex-direction: column;
            width: min(50%, 320px);
        }

        .meter-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.35rem;
        }

        .meter-pill {
            color: var(--neon-lime);
            font-size: 0.72rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.24rem 0.55rem;
            border: 1px solid var(--neon-lime);
            border-radius: 999px;
            letter-spacing: 0.08em;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.32);
        }

        .hype-frame {
            height: 24px;
            background: linear-gradient(180deg, rgba(4, 8, 18, 0.95), rgba(0, 0, 0, 0.88));
            padding: 2px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 999px;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 10px rgba(0, 240, 255, 0.3);
        }

        .hype-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--danger-red), var(--neon-cyan), var(--neon-lime));
            width: 100%;
            transition: width 0.1s linear;
            border-radius: 999px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .status-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0.4rem 0.65rem 0.5rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(10, 8, 18, 0.85), rgba(24, 14, 48, 0.8));
            border: 1px solid rgba(0, 240, 255, 0.22);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.3rem;
            animation: pulse-fast 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background: #dc2626;
            border-radius: 999px;
        }

        .live-label {
            color: #ef4444;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.25em;
        }

        .score-value {
            font-size: clamp(2.2rem, 7vw, 3rem);
            color: white;
            text-shadow: 0 0 5px rgba(145, 70, 255, 1);
            line-height: 1;
        }

        .score-label {
            color: #d8b4fe;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            margin-top: 0.2rem;
        }

        .panel {
            width: min(100% - 3rem, 340px);
            margin: 0 1.5rem;
            padding: 2rem 1.5rem;
            border-radius: 0.75rem;
            text-align: center;
            pointer-events: auto;
        }

        .hero-emoji {
            position: relative;
            font-size: 4.5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.35));
        }

        .hero-emoji::before {
            content: "⚗";
            position: absolute;
            top: -0.7rem;
            left: -0.95rem;
            font-size: 1.35rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(72, 247, 255, 0.75);
            animation: pulse-fast 1.1s ease-in-out infinite;
        }

        .hero-emoji::after {
            content: "✦";
            position: absolute;
            right: -1rem;
            bottom: 0.1rem;
            font-size: 1.2rem;
            color: var(--neon-lime);
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.8);
        }

        .title {
            margin: 0;
            color: white;
            text-transform: uppercase;
            line-height: 1.12;
            letter-spacing: -0.04em;
            text-shadow: 0 0 18px rgba(145, 70, 255, 0.28);
        }

        .title-accent {
            display: inline-block;
            color: var(--neon-cyan);
            font-size: 1.1rem;
            margin-top: 0.6rem;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.45);
        }

        .tagline {
            display: inline-block;
            margin-top: 1rem;
            background: linear-gradient(90deg, rgba(17, 94, 41, 0.95), rgba(72, 247, 255, 0.22));
            color: white;
            border: 1px solid var(--neon-cyan);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.45rem 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 999px;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.18);
        }

        .intro-copy,
        .subcopy,
        .stat-label {
            font-family: var(--font-ui);
        }

        .intro-copy {
            color: #dbeafe;
            font-size: 0.94rem;
            margin: 1.4rem 0 1.8rem;
            line-height: 1.45;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .accent-pink {
            color: var(--neon-pink);
        }

        .action-btn {
            width: 100%;
            border: 0;
            border-bottom: 4px solid rgba(0, 0, 0, 0.35);
            padding: 1rem;
            border-radius: 0.9rem;
            transition: transform 0.1s ease, border-bottom-width 0.1s ease, background 0.15s ease, box-shadow 0.15s ease;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.22);
        }

        .action-btn:active {
            transform: translateY(1px);
            border-bottom-width: 0;
        }

        .btn-primary {
            background: linear-gradient(180deg, #39ff14, #13a32b);
            border-bottom-color: #064e1a;
        }

        .btn-primary:hover {
            background: linear-gradient(180deg, #9cff6e, #16a34a);
            box-shadow: 0 0 16px rgba(57, 255, 20, 0.38);
        }

        .btn-secondary {
            background: linear-gradient(180deg, #67e8f9, #06b6d4);
            border-bottom-color: #0e7490;
        }

        .btn-secondary:hover {
            background: linear-gradient(180deg, #a5f3fc, #22d3ee);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.28);
        }

        .btn-label-primary {
            color: #041008;
            font-size: 1rem;
            letter-spacing: 0.08em;
        }

        .btn-label-secondary {
            color: black;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
        }

        .game-over-title {
            color: #ef4444;
            font-size: 1.65rem;
            margin: 0 0 0.5rem;
            text-transform: uppercase;
        }

        .subcopy {
            color: #9ca3af;
            font-size: 0.95rem;
            margin: 0 0 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.9rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(180deg, rgba(3, 6, 14, 0.95), rgba(24, 13, 46, 0.9));
            border: 1px solid #a855f7;
            padding: 0.7rem 0.5rem;
            border-radius: 0.8rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .stat-label {
            color: #9ca3af;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.35rem;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.6rem;
            color: white;
        }

        #audio-btn {
            pointer-events: auto;
            position: absolute;
            right: 1.5rem;
            bottom: max(1.5rem, calc(env(safe-area-inset-bottom) + 1rem));
            width: 3rem;
            height: 3rem;
            border: 2px solid var(--neon-cyan);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(5, 12, 25, 0.95), rgba(18, 13, 38, 0.92));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 12px rgba(0, 240, 255, 0.35),
                0 10px 20px rgba(0, 0, 0, 0.28);
            transition: transform 0.1s ease;
            cursor: pointer;
        }

        #audio-btn:active {
            transform: scale(0.9);
        }

        #audio-icon {
            font-size: 1.25rem;
        }

        .feedback-gif {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: min(34vw, 150px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(0, 240, 255, 0.45);
            background: rgba(5, 8, 20, 0.35);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 60;
        }

        #combo-gif {
            top: max(5.5rem, calc(env(safe-area-inset-top) + 4.8rem));
        }

        #danger-gif {
            bottom: max(5.5rem, calc(env(safe-area-inset-bottom) + 4.5rem));
        }

        .feedback-gif.active {
            opacity: 0.92;
            transform: translateX(-50%) translateY(-4px);
        }

        @keyframes portal-spin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.04); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        @keyframes lab-grid-drift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(40px, 40px, 0); }
        }

        @keyframes citadel-orbit {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.05); }
        }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 640px) {
            .dimension-readout {
                font-size: 0.58rem;
                max-width: 58%;
            }

            .panel {
                width: min(100% - 1.5rem, 340px);
                margin: 0 0.75rem;
                padding: 1.6rem 1rem;
            }

            .hero-emoji {
                font-size: 3.8rem;
            }

            .intro-copy,
            .subcopy,
            .stat-label {
                font-size: 0.78rem;
            }

            .btn-label-primary {
                font-size: 0.88rem;
            }

            .hud-row {
                gap: 0.6rem;
            }

            .meter-wrap {
                width: 58%;
            }

            .score-label {
                text-align: right;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-overlay">
        <div class="bg-gradient"></div>
        <div class="bg-grid grid-bg"></div>
        <div class="bg-lab-props" aria-hidden="true"></div>

        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="hud" class="hidden">
                <div class="hud-row">
                    <div class="meter-wrap">
                        <div class="meter-label">
                            <span class="meter-pill">PORTAL STABILITY</span>
                        </div>
                        <div class="hype-frame">
                            <div id="hp-bar" class="hype-fill"></div>
                        </div>
                        <div class="dimension-readout">GARAGE PORTAL BOOT</div>
                    </div>

                    <div class="status-panel">
                        <div class="live-status">
                            <div class="live-dot"></div>
                            <span class="live-label">RIFT OPEN</span>
                        </div>
                        <div class="score-value pixel-font">
                            <span id="score">0</span>
                        </div>
                        <div class="score-label">ANOMALIES SEALED</div>
                    </div>
                </div>
            </div>

            <div id="start-screen" class="glass-panel panel">
                <div class="hero-emoji" aria-hidden="true">🌀</div>
                <h1 class="title pixel-font">
                    PORTAL<br>
                    <span class="title-accent">SHIELD</span>
                </h1>
                <div class="tagline">Rick-Tech Garage Defense</div>
                <p class="intro-copy">
                    Drag Morty's shield.<br>
                    Auto-pulse <span class="accent-pink">portal bursts</span> upward.<br>
                    Seal anomalies.
                </p>
                <button id="start-btn" class="action-btn btn-primary">
                    <span class="btn-label-primary pixel-font">OPEN PORTAL</span>
                </button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel panel">
                <h2 class="game-over-title pixel-font">RIFT COLLAPSED</h2>
                <p class="subcopy">Portal stability failed under the anomaly wave.</p>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Anomalies Sealed</div>
                        <div class="stat-value pixel-font" id="final-score">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Rift Time</div>
                        <div class="stat-value pixel-font" id="final-time">0s</div>
                    </div>
                </div>

                <button id="restart-btn" class="action-btn btn-secondary">
                    <span class="btn-label-secondary pixel-font">RETRY RIFT</span>
                </button>
            </div>

                <img id="combo-gif" class="feedback-gif" alt="Portal seal feedback animation">
                <img id="danger-gif" class="feedback-gif" alt="Rift danger feedback animation">
                <button id="audio-btn" aria-label="Toggle audio">
                    <span id="audio-icon">🔇</span>
                </button>
        </div>
    </div>

    <script type="module">
        const CONFIG = {
            playerSpeed: 0.2,
            playerMaxHp: 100,
            fireRate: 10,
            projectileSpeed: 16,
            enemies: ["🦠", "🧫", "👁️", "🤖", "🛸", "👾", "🔷", "🧿", "🧬"],
            chatSlang: ["SEALED", "STABILIZED", "PURGED", "ZAPPED", "CONTAINED", "DE-GLITCHED", "PORTALED", "SCRUBBED", "LOCKED", "CLEARED"],
            dimensions: [
                { score: 0, label: "GARAGE PORTAL BOOT" },
                { score: 8, label: "MEESEEKS MALFUNCTION" },
                { score: 18, label: "CITADEL FIREWALL" },
                { score: 32, label: "CRONENBERG BACKFLOW" },
                { score: 50, label: "OMEGA RIFT LOCKDOWN" }
            ],
            colors: {
                hit: '#39ff14',
                blood: '#ff3fa4',
                text: ['#39ff14', '#48f7ff', '#ff3fa4', '#ffffff']
            }
        };

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3",
            sfx: {
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3",
                block: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3",
                damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_defeat_01.mp3",
                toggleOn: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_02.mp3",
                toggleOff: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_wind_01.mp3"
            },
            gifs: {
                combo: "https://i.giphy.com/1qXINH0qhhsNDiu0T5.webp",
                danger: "https://i.giphy.com/roB5nN2qNNfhUKcprN.webp"
            }
        };

        class AudioSystem {
            constructor() {
                this.enabled = false;
                this.started = false;
                this.pools = {};
                this.lastPlayed = {};

                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.preload = 'auto';
                this.bgm.volume = 0.2;

                this.createPool('shoot', ASSETS.sfx.shoot, 3, 0.18);
                this.createPool('block', ASSETS.sfx.block, 3, 0.4);
                this.createPool('damage', ASSETS.sfx.damage, 2, 0.38);
                this.createPool('start', ASSETS.sfx.start, 1, 0.5);
                this.createPool('gameOver', ASSETS.sfx.gameOver, 1, 0.55);
                this.createPool('toggleOn', ASSETS.sfx.toggleOn, 1, 0.4);
                this.createPool('toggleOff', ASSETS.sfx.toggleOff, 1, 0.32);

                const btn = document.getElementById('audio-btn');
                const icon = document.getElementById('audio-icon');
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.toggle();
                    icon.innerText = this.enabled ? "🔊" : "🔇";
                });
            }

            createPool(name, src, size, volume) {
                this.pools[name] = Array.from({ length: size }, () => {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = volume;
                    return audio;
                });
            }

            async unlock() {
                if (this.started) return;
                this.started = true;
                try {
                    const attempt = this.bgm.play();
                    if (attempt) {
                        await attempt;
                        this.bgm.pause();
                        this.bgm.currentTime = 0;
                    }
                } catch (_) {}
            }

            toggle() {
                this.enabled = !this.enabled;
                this.play(this.enabled ? 'toggleOn' : 'toggleOff');

                if (this.enabled) {
                    if (window.game && window.game.state === 'playing') {
                        this.bgm.play().catch(() => {});
                    }
                } else {
                    this.bgm.pause();
                }
            }

            play(name, options = {}) {
                if (!this.enabled || !this.pools[name]) return;
                const now = performance.now();
                const cooldown = options.cooldown ?? 0;
                if (cooldown && this.lastPlayed[name] && now - this.lastPlayed[name] < cooldown) return;
                this.lastPlayed[name] = now;

                const pool = this.pools[name];
                const audio = pool.find((item) => item.paused || item.ended) || pool[0];
                try {
                    audio.pause();
                    audio.currentTime = 0;
                    audio.playbackRate = options.rate ?? 1;
                    audio.volume = options.volume ?? audio.volume;
                    audio.play().catch(() => {});
                } catch (_) {}
            }

            startBgm() {
                if (this.enabled) {
                    this.bgm.currentTime = 0;
                    this.bgm.play().catch(() => {});
                }
            }

            stopBgm() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playShoot() {
                this.play('shoot', { cooldown: 80, rate: 0.96 + Math.random() * 0.12 });
            }

            playBlock() {
                this.play('block', { cooldown: 70, rate: 0.95 + Math.random() * 0.18 });
            }

            playDamage() {
                this.play('damage', { cooldown: 220 });
            }

            playStart() {
                this.play('start');
            }

            playGameOver() {
                this.play('gameOver');
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d', { alpha: true });
                this.audio = new AudioSystem();

                this.width = window.innerWidth;
                this.height = window.innerHeight;

                this.state = 'start';
                this.score = 0;
                this.frames = 0;
                this.startTime = 0;

                this.player = {
                    x: 0, y: 0, tx: 0,
                    size: 60,
                    hp: CONFIG.playerMaxHp,
                    invuln: 0
                };

                this.projectiles = [];
                this.enemies = [];
                this.particles = [];
                this.floatTexts = [];

                this.shake = 0;

                this.resize = this.resize.bind(this);
                this.loop = this.loop.bind(this);
                this.handleInput = this.handleInput.bind(this);

                window.addEventListener('resize', this.resize);

                const inputZone = document.getElementById('game-container');
                inputZone.addEventListener('touchmove', this.handleInput, { passive: false });
                inputZone.addEventListener('touchstart', this.handleInput, { passive: false });
                inputZone.addEventListener('mousemove', this.handleInput);

                this.comboGif = document.getElementById('combo-gif');
                this.dangerGif = document.getElementById('danger-gif');
                this.comboGif.src = ASSETS.gifs.combo;
                this.dangerGif.src = ASSETS.gifs.danger;
                this.feedbackTimers = {};

                document.getElementById('start-btn').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await this.audio.unlock();
                    this.start();
                });
                document.getElementById('restart-btn').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await this.audio.unlock();
                    this.start();
                });

                this.resize();
                requestAnimationFrame(this.loop);
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                if (this.state !== 'playing') {
                    this.player.x = this.width / 2;
                    this.player.tx = this.width / 2;
                }
                this.player.y = this.height - 120;
            }

            handleInput(e) {
                if (this.state !== 'playing') return;
                e.preventDefault();
                let cx = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                cx = Math.max(30, Math.min(this.width - 30, cx));
                this.player.tx = cx;
            }

            start() {
                this.state = 'playing';
                this.score = 0;
                this.frames = 0;
                this.startTime = Date.now();

                this.player.hp = CONFIG.playerMaxHp;
                this.player.invuln = 0;
                this.player.x = this.width / 2;
                this.player.tx = this.width / 2;

                this.enemies = [];
                this.projectiles = [];
                this.particles = [];
                this.floatTexts = [];
                this.setGifState('combo', false);
                this.setGifState('danger', false);

                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                this.updateUI();

                this.audio.playStart();
                this.audio.startBgm();
            }

            gameOver() {
                this.state = 'gameover';
                this.audio.stopBgm();
                this.audio.playGameOver();
                this.showGif('danger', 1800);
                this.shake = 25;

                const timeSurvived = ((Date.now() - this.startTime) / 1000).toFixed(1);

                document.getElementById('hud').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = this.score;
                document.getElementById('final-time').innerText = timeSurvived + 's';
            }

            spawnEnemy() {
                const difficulty = 1 + (this.frames / 2000);
                const spawnRate = Math.max(12, Math.floor(50 / difficulty));

                if (this.frames % spawnRate === 0) {
                    const size = 45 + Math.random() * 20;
                    const emoji = CONFIG.enemies[Math.floor(Math.random() * CONFIG.enemies.length)];
                    const hp = Math.floor(1 + (this.frames / 900));

                    this.enemies.push({
                        x: Math.random() * (this.width - size) + size / 2,
                        y: -size,
                        size: size,
                        emoji: emoji,
                        hp: hp,
                        maxHp: hp,
                        speed: (2.5 + Math.random() * 2) * difficulty,
                        hitFlash: 0,
                        rot: (Math.random() - 0.5) * 0.5,
                        rotSpeed: (Math.random() - 0.5) * 0.1
                    });
                }
            }

            spawnProjectile() {
                this.projectiles.push({
                    x: this.player.x,
                    y: this.player.y - 40,
                    size: 35,
                    speed: CONFIG.projectileSpeed,
                    angle: Math.random() * 0.4 - 0.2
                });
                this.audio.playShoot();
            }

            spawnParticle(x, y, color, count = 5) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 8;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        color: color,
                        size: 3 + Math.random() * 5
                    });
                }
            }

            spawnFloatText(x, y, text, color) {
                this.floatTexts.push({
                    x, y, text,
                    color: color || CONFIG.colors.text[Math.floor(Math.random() * CONFIG.colors.text.length)],
                    life: 1.0,
                    vy: -2 - Math.random() * 2,
                    vx: (Math.random() - 0.5) * 2
                });
            }

            setGifState(type, active) {
                const element = type === 'combo' ? this.comboGif : this.dangerGif;
                if (!element) return;
                element.classList.toggle('active', active);
            }

            showGif(type, duration = 900) {
                this.setGifState(type, true);
                clearTimeout(this.feedbackTimers[type]);
                this.feedbackTimers[type] = setTimeout(() => this.setGifState(type, false), duration);
            }

            update() {
                if (this.state !== 'playing') return;
                this.frames++;

                this.player.x += (this.player.tx - this.player.x) * CONFIG.playerSpeed;
                if (this.player.invuln > 0) this.player.invuln--;

                if (this.frames % CONFIG.fireRate === 0) {
                    this.spawnProjectile();
                }

                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];
                    p.y -= p.speed;
                    p.angle -= 0.3;
                    if (p.y < -50) this.projectiles.splice(i, 1);
                }

                this.spawnEnemy();

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    e.y += e.speed;
                    e.rot += e.rotSpeed;
                    if (e.hitFlash > 0) e.hitFlash--;

                    for (let j = this.projectiles.length - 1; j >= 0; j--) {
                        const p = this.projectiles[j];
                        if (Math.hypot(e.x - p.x, e.y - p.y) < (e.size / 2 + p.size / 2)) {
                            e.hp--;
                            e.hitFlash = 4;
                            e.y -= 15;
                            this.projectiles.splice(j, 1);

                            this.spawnParticle(e.x, e.y, '#00f0ff', 3);

                            if (e.hp <= 0) {
                                this.score++;
                                this.spawnParticle(e.x, e.y, CONFIG.colors.hit, 12);

                                const slang = CONFIG.chatSlang[Math.floor(Math.random() * CONFIG.chatSlang.length)];
                                this.spawnFloatText(e.x, e.y, slang);

                                this.audio.playBlock();
                                this.showGif('combo', 650);
                                this.enemies.splice(i, 1);
                                this.updateUI();
                                this.shake = 5;
                            }
                            break;
                        }
                    }
                    if (e.hp <= 0) continue;

                    const pDist = Math.hypot(e.x - this.player.x, e.y - this.player.y);
                    if (pDist < (e.size / 2 + this.player.size / 2 - 10)) {
                        if (this.player.invuln <= 0) {
                            this.player.hp -= 20;
                            this.player.invuln = 50;
                            this.shake = 30;
                            this.spawnParticle(this.player.x, this.player.y, CONFIG.colors.blood, 15);
                            this.spawnFloatText(this.player.x, this.player.y, "RIFT HIT!", "#ff3fa4");
                            this.audio.playDamage();
                            this.showGif('danger', 900);
                            this.updateUI();
                            if (this.player.hp <= 0) {
                                this.gameOver();
                                return;
                            }
                        }
                    }

                    if (e.y > this.height + 50) this.enemies.splice(i, 1);
                }

                this.particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.04;
                    if (p.life <= 0) this.particles.splice(i, 1);
                });

                this.floatTexts.forEach((t, i) => {
                    t.y += t.vy;
                    t.x += t.vx;
                    t.life -= 0.02;
                    if (t.life <= 0) this.floatTexts.splice(i, 1);
                });

                if (this.shake > 0) this.shake *= 0.9;
            }

            activeDimension() {
                return CONFIG.dimensions.reduce((active, dimension) => {
                    return this.score >= dimension.score ? dimension : active;
                }, CONFIG.dimensions[0]);
            }

            drawPortalPulse(p) {
                const ctx = this.ctx;
                const radius = p.size * 0.42;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#39ff14';
                ctx.strokeStyle = '#39ff14';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#48f7ff';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.66, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = 'rgba(57, 255, 20, 0.8)';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.22, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-radius * 0.8, 0);
                ctx.quadraticCurveTo(-radius * 0.1, -radius * 0.75, radius * 0.72, -radius * 0.1);
                ctx.stroke();
                ctx.restore();
            }

            drawAnomaly(e) {
                const ctx = this.ctx;
                const s = e.size;
                const type = CONFIG.enemies.indexOf(e.emoji) % 5;
                ctx.save();
                ctx.rotate(e.rot);
                ctx.lineWidth = Math.max(2, s * 0.055);
                ctx.shadowBlur = e.hitFlash > 0 ? 24 : 12;

                if (type === 0) {
                    ctx.shadowColor = '#39ff14';
                    ctx.fillStyle = 'rgba(65, 255, 97, 0.82)';
                    ctx.strokeStyle = '#07110d';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.36, s * 0.28, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    for (let i = 0; i < 6; i++) {
                        const a = (Math.PI * 2 / 6) * i;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(a) * s * 0.28, Math.sin(a) * s * 0.2);
                        ctx.lineTo(Math.cos(a) * s * 0.48, Math.sin(a) * s * 0.38);
                        ctx.stroke();
                    }
                } else if (type === 1) {
                    ctx.shadowColor = '#48f7ff';
                    ctx.fillStyle = 'rgba(72, 247, 255, 0.82)';
                    ctx.strokeStyle = '#dbeafe';
                    ctx.beginPath();
                    ctx.roundRect(-s * 0.32, -s * 0.32, s * 0.64, s * 0.64, s * 0.12);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#07110d';
                    ctx.fillRect(-s * 0.16, -s * 0.05, s * 0.32, s * 0.08);
                } else if (type === 2) {
                    ctx.shadowColor = '#7c3aed';
                    ctx.fillStyle = 'rgba(124, 58, 237, 0.72)';
                    ctx.strokeStyle = '#48f7ff';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.42, s * 0.28, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#07110d';
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.07, 0, Math.PI * 2);
                    ctx.fill();
                } else if (type === 3) {
                    ctx.shadowColor = '#ff3fa4';
                    ctx.fillStyle = 'rgba(255, 63, 164, 0.76)';
                    ctx.strokeStyle = '#39ff14';
                    ctx.beginPath();
                    ctx.moveTo(0, -s * 0.42);
                    ctx.bezierCurveTo(s * 0.38, -s * 0.2, s * 0.42, s * 0.22, 0, s * 0.38);
                    ctx.bezierCurveTo(-s * 0.4, s * 0.18, -s * 0.32, -s * 0.22, 0, -s * 0.42);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(7, 17, 13, 0.55)';
                    ctx.beginPath();
                    ctx.arc(s * 0.1, -s * 0.02, s * 0.09, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.shadowColor = '#48f7ff';
                    ctx.fillStyle = 'rgba(72, 247, 255, 0.78)';
                    ctx.strokeStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(0, -s * 0.44);
                    ctx.lineTo(s * 0.34, 0);
                    ctx.lineTo(0, s * 0.44);
                    ctx.lineTo(-s * 0.34, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = '#7c3aed';
                    ctx.beginPath();
                    ctx.moveTo(0, -s * 0.28);
                    ctx.lineTo(0, s * 0.28);
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(-s * 0.11, -s * 0.1, s * 0.045, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawMortyPilot() {
                const ctx = this.ctx;
                const pSize = this.player.size;
                ctx.save();
                ctx.shadowBlur = 22;
                ctx.shadowColor = '#39ff14';

                ctx.strokeStyle = 'rgba(57, 255, 20, 0.95)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(pSize * 0.36, -pSize * 0.08, pSize * 0.26, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(72, 247, 255, 0.72)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 4]);
                ctx.beginPath();
                ctx.arc(pSize * 0.36, -pSize * 0.08, pSize * 0.38, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#f7c86a';
                ctx.strokeStyle = '#07110d';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(-pSize * 0.24, -pSize * 0.1, pSize * 0.48, pSize * 0.42, pSize * 0.1);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#f6d2aa';
                ctx.beginPath();
                ctx.arc(0, -pSize * 0.34, pSize * 0.22, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#5b3417';
                ctx.beginPath();
                ctx.arc(-pSize * 0.03, -pSize * 0.47, pSize * 0.23, Math.PI, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#07110d';
                ctx.beginPath();
                ctx.arc(-pSize * 0.07, -pSize * 0.34, pSize * 0.025, 0, Math.PI * 2);
                ctx.arc(pSize * 0.08, -pSize * 0.34, pSize * 0.025, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#07110d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -pSize * 0.25, pSize * 0.07, 0, Math.PI);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(72, 247, 255, 0.85)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(pSize * 0.16, pSize * 0.02);
                ctx.lineTo(pSize * 0.28, -pSize * 0.02);
                ctx.stroke();
                ctx.restore();
            }

            updateUI() {
                document.getElementById('score').innerText = this.score;
                const hpPct = Math.max(0, (this.player.hp / CONFIG.playerMaxHp) * 100);
                document.getElementById('hp-bar').style.width = `${hpPct}%`;
                document.querySelector('.dimension-readout').innerText = this.activeDimension().label;
            }

            draw() {
                const ctx = this.ctx;

                ctx.clearRect(0, 0, this.width, this.height);

                ctx.save();
                if (this.shake > 0.5) {
                    ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
                }

                this.projectiles.forEach(p => {
                    this.drawPortalPulse(p);
                });

                this.enemies.forEach(e => {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.rotate(e.rot);

                    if (e.hitFlash > 0) {
                        ctx.filter = 'brightness(200%) sepia(100%) hue-rotate(180deg)';
                    }

                    this.drawAnomaly(e);

                    if (e.maxHp > 1 && e.hp < e.maxHp) {
                        ctx.fillStyle = 'black';
                        ctx.fillRect(-15, -e.size / 2 - 8, 30, 6);
                        ctx.fillStyle = '#ff0055';
                        ctx.fillRect(-15, -e.size / 2 - 8, 30 * (e.hp / e.maxHp), 6);
                    }

                    ctx.filter = 'none';
                    ctx.restore();
                });

                ctx.save();
                ctx.translate(this.player.x, this.player.y);

                if (this.player.invuln > 0 && Math.floor(this.frames / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                this.drawMortyPilot();

                ctx.restore();

                this.particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;

                ctx.font = "bold 20px Rajdhani, sans-serif";
                ctx.textAlign = "center";
                this.floatTexts.forEach(t => {
                    ctx.save();
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 4;
                    ctx.fillStyle = t.color;
                    ctx.fillText(t.text, t.x, t.y);
                    ctx.restore();
                });

                if (this.player.hp < 30) {
                    const opacity = 0.3 + Math.sin(this.frames * 0.2) * 0.1;
                    const grad = ctx.createRadialGradient(this.width / 2, this.height / 2, this.width / 4, this.width / 2, this.height / 2, this.width);
                    grad.addColorStop(0, 'transparent');
                    grad.addColorStop(1, `rgba(255, 0, 85, ${opacity})`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, this.width, this.height);
                }

                ctx.restore();
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(this.loop);
            }
        }

        window.onload = () => {
            window.game = new Game();
        };
    </script>
