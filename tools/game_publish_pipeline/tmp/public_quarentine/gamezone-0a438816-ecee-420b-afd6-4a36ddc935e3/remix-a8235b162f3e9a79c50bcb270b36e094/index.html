<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Mom’s Day Brainrot Bug Bouquet Blitz</title>
    <!-- [agent-note][stage4] repaired: approved-font-links | source: catalogs/fonts.json | roles: display=Bangers ui=Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #150818;
            --bg-mid: #35133f;
            --panel: rgba(44, 13, 54, 0.82);
            --panel-strong: rgba(63, 22, 72, 0.94);
            --cyan: #67e8f9;
            --cyan-strong: #22d3ee;
            --violet: #a855f7;
            --violet-deep: #5b1b72;
            --magenta: #ff6fb7;
            --gold: #fde047;
            --mint: #8cffc1;
            --danger: #fb7185;
            --text-main: #f8fbff;
            --text-soft: #dbeafe;
            --shadow: rgba(2, 8, 23, 0.6);
            --font-primary: 'Bangers', 'Trebuchet MS', sans-serif;
            --font-secondary: 'Rajdhani', 'Arial Narrow', Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: manipulation; 
            background:
                radial-gradient(circle at 50% 12%, rgba(253, 224, 71, 0.14), transparent 26%),
                radial-gradient(circle at 18% 18%, rgba(255, 111, 183, 0.16), transparent 28%),
                radial-gradient(circle at 84% 72%, rgba(140, 255, 193, 0.1), transparent 30%),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, #07152b 100%);
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-secondary);
            color: var(--text-main);
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(253, 224, 71, 0.18), transparent 30%),
                radial-gradient(circle at 18% 28%, rgba(255, 111, 183, 0.18), transparent 26%),
                radial-gradient(circle at 82% 70%, rgba(140, 255, 193, 0.14), transparent 30%),
                radial-gradient(circle at center, #7e22ce 0%, #2d123a 48%, #150818 100%);
        }

        .mom-motif-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
            opacity: 0.82;
        }

        .aura-crown {
            position: absolute;
            top: clamp(72px, 12vh, 118px);
            left: 50%;
            width: min(54vw, 260px);
            height: min(18vw, 86px);
            transform: translateX(-50%);
            background:
                radial-gradient(circle at 18% 88%, rgba(253, 224, 71, 0.38) 0 13%, transparent 14%),
                radial-gradient(circle at 50% 48%, rgba(253, 224, 71, 0.45) 0 18%, transparent 19%),
                radial-gradient(circle at 82% 88%, rgba(253, 224, 71, 0.38) 0 13%, transparent 14%),
                linear-gradient(90deg, transparent 8%, rgba(253, 224, 71, 0.2) 12% 88%, transparent 92%);
            clip-path: polygon(4% 100%, 12% 58%, 28% 88%, 50% 26%, 72% 88%, 88% 58%, 96% 100%);
            filter: blur(0.2px) drop-shadow(0 0 22px rgba(253, 224, 71, 0.26));
            animation: crownFloat 5.8s ease-in-out infinite;
        }

        .edge-bouquet {
            position: absolute;
            left: -20px;
            bottom: -10px;
            width: min(35vw, 156px);
            height: min(44vh, 300px);
            background:
                radial-gradient(circle at 30% 18%, rgba(255, 111, 183, 0.38) 0 6%, transparent 7%),
                radial-gradient(circle at 52% 12%, rgba(253, 224, 71, 0.34) 0 5%, transparent 6%),
                radial-gradient(circle at 66% 26%, rgba(140, 255, 193, 0.3) 0 5%, transparent 6%),
                repeating-linear-gradient(102deg, transparent 0 18px, rgba(140, 255, 193, 0.18) 19px 22px, transparent 23px 36px);
            border-radius: 42% 58% 0 0;
            filter: drop-shadow(0 0 18px rgba(140, 255, 193, 0.18));
            animation: bouquetSway 6.4s ease-in-out infinite;
        }

        .gift-stack {
            position: absolute;
            right: -24px;
            bottom: max(16px, env(safe-area-inset-bottom));
            width: min(32vw, 150px);
            height: min(24vw, 112px);
            background:
                linear-gradient(90deg, transparent 45%, rgba(253, 224, 71, 0.24) 46% 54%, transparent 55%),
                linear-gradient(0deg, transparent 42%, rgba(253, 224, 71, 0.28) 43% 54%, transparent 55%),
                linear-gradient(135deg, rgba(255, 111, 183, 0.28), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(253, 224, 71, 0.24);
            border-radius: 18px 18px 12px 12px;
            transform: rotate(-5deg);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 18px 40px rgba(2, 8, 23, 0.2);
        }

        .card-drift {
            position: absolute;
            left: 58%;
            top: 18%;
            width: 78px;
            height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(248, 251, 255, 0.2);
            background:
                radial-gradient(circle at 50% 48%, rgba(255, 111, 183, 0.32) 0 16%, transparent 17%),
                linear-gradient(135deg, rgba(255, 247, 220, 0.12), rgba(103, 232, 249, 0.05));
            transform: rotate(9deg);
            animation: cardBob 7.6s ease-in-out infinite;
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.42; }
            50% { transform: translateX(-50%) translateY(-10px) scale(1.04); opacity: 0.7; }
        }

        @keyframes bouquetSway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(4deg); }
        }

        @keyframes cardBob {
            0%, 100% { transform: translateY(0) rotate(9deg); opacity: 0.32; }
            50% { transform: translateY(12px) rotate(2deg); opacity: 0.54; }
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            touch-action: none;
        }

        /* UI Layer */
        .ui-panel {
            pointer-events: none;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hud-top {
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .vibe-container {
            background:
                radial-gradient(circle at 12% 16%, rgba(253, 224, 71, 0.12), transparent 32%),
                linear-gradient(180deg, rgba(62, 16, 72, 0.92), rgba(19, 8, 38, 0.88));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(103, 232, 249, 0.7);
            padding: 10px 16px 12px;
            border-radius: 20px;
            width: 85%;
            max-width: 430px;
            box-shadow:
                0 0 0 1px rgba(253, 224, 71, 0.08) inset,
                0 14px 30px rgba(2, 8, 23, 0.42),
                0 0 18px rgba(34, 211, 238, 0.2),
                0 0 28px rgba(255, 111, 183, 0.12);
            transform: skewX(-4deg);
        }

        .vibe-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            color: var(--cyan);
            font-size: 0.76rem;
            text-transform: uppercase;
            font-weight: 700;
            font-family: var(--font-primary);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(103, 232, 249, 0.45);
        }

        .stage-pill {
            color: var(--bg-deep);
            background: linear-gradient(90deg, var(--gold), var(--mint));
            border-radius: 999px;
            padding: 3px 8px;
            white-space: nowrap;
            letter-spacing: 0.08em;
            box-shadow: 0 0 10px rgba(253, 224, 71, 0.22);
        }

        .bar-bg {
            width: 100%;
            height: 16px;
            background: rgba(14, 24, 52, 0.95);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 2px 8px rgba(2, 8, 23, 0.65);
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--magenta), var(--gold), var(--cyan));
            box-shadow: 0 0 18px rgba(103, 232, 249, 0.38);
            transition: width 0.1s linear;
        }

        /* Screens */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 15%, rgba(103, 232, 249, 0.09), transparent 26%),
                rgba(3, 8, 22, 0.9);
            backdrop-filter: blur(12px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-card {
            background:
                radial-gradient(circle at 16% 12%, rgba(253, 224, 71, 0.12), transparent 24%),
                radial-gradient(circle at 88% 22%, rgba(255, 111, 183, 0.1), transparent 28%),
                linear-gradient(180deg, rgba(62, 16, 72, 0.96), rgba(12, 10, 32, 0.96));
            border: 1px solid rgba(103, 232, 249, 0.72);
            padding: 30px 24px;
            border-radius: 28px;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 18px 40px rgba(2, 8, 23, 0.58),
                0 0 28px rgba(34, 211, 238, 0.14);
            max-width: 90%;
            width: 340px;
            transform: rotate(-1deg);
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--text-main);
            font-family: var(--font-primary);
            font-size: clamp(2rem, 8vw, 3rem);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 10px rgba(103, 232, 249, 0.35),
                0 0 28px rgba(139, 92, 246, 0.22);
        }

        p {
            color: var(--text-soft);
            font-size: 0.98rem;
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 700;
        }

        .btn-funk {
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6 54%, #f472b6);
            border: 1px solid rgba(255, 255, 255, 0.32);
            color: white;
            font-family: var(--font-primary);
            font-size: 1rem;
            padding: 15px 18px;
            border-radius: 999px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            touch-action: manipulation;
            box-shadow:
                0 8px 0 #312e81,
                0 18px 24px rgba(0,0,0,0.34),
                0 0 18px rgba(103, 232, 249, 0.22);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
        }
        .btn-funk:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #312e81;
            filter: brightness(1.08);
        }

        /* Authored Mom's Day brainrot aura: decorative only, never mechanic-bearing. */
        .disco-lights {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(253, 224, 71, 0.16), transparent 54%),
                radial-gradient(circle at 18% 20%, rgba(244, 114, 182, 0.14), transparent 42%),
                radial-gradient(circle at 50% 100%, rgba(140, 255, 193, 0.09), transparent 58%);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 5;
            animation: pulse-light 2.4s infinite alternate;
        }

        @keyframes pulse-light {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #flash-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent, rgba(248, 113, 113, 0.52));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 20;
            mix-blend-mode: color-dodge;
        }

        .menu-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(103, 232, 249, 0.12), transparent 35%),
                linear-gradient(315deg, rgba(244, 114, 182, 0.1), transparent 38%),
                repeating-linear-gradient(90deg, transparent 0 26px, rgba(253, 224, 71, 0.04) 27px 29px, transparent 30px 52px);
            pointer-events: none;
        }

        .menu-card::after {
            content: "♡ MOM MODE ♡";
            position: absolute;
            right: -24px;
            top: 22px;
            padding: 4px 28px;
            transform: rotate(19deg);
            color: rgba(21, 8, 24, 0.82);
            background: linear-gradient(90deg, var(--gold), var(--mint));
            font-family: var(--font-primary);
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            pointer-events: none;
            box-shadow: 0 8px 18px rgba(2, 8, 23, 0.22);
        }

        .hero-emblem {
            position: relative;
            width: 112px;
            height: 88px;
            margin: 0 auto 12px;
            filter: drop-shadow(0 0 16px rgba(103, 232, 249, 0.4));
            animation: hero-bob 1.9s ease-in-out infinite;
        }

        .hero-bouquet,
        .hero-beetle,
        .hero-crown,
        .hero-tweezers {
            position: absolute;
            pointer-events: none;
        }

        .hero-bouquet {
            left: 12px;
            bottom: 7px;
            width: 50px;
            height: 54px;
            border-radius: 50% 50% 44% 44%;
            background:
                radial-gradient(circle at 28% 24%, var(--magenta) 0 16%, transparent 17%),
                radial-gradient(circle at 58% 18%, var(--gold) 0 14%, transparent 15%),
                radial-gradient(circle at 74% 42%, var(--mint) 0 13%, transparent 14%),
                linear-gradient(115deg, transparent 0 42%, rgba(140, 255, 193, 0.8) 43% 48%, transparent 49%),
                linear-gradient(70deg, transparent 0 50%, rgba(140, 255, 193, 0.7) 51% 56%, transparent 57%);
        }

        .hero-beetle {
            right: 19px;
            bottom: 15px;
            width: 36px;
            height: 46px;
            border-radius: 52% 52% 48% 48%;
            background:
                radial-gradient(circle at 35% 20%, #fff 0 9%, transparent 10%),
                linear-gradient(135deg, var(--gold), var(--magenta) 42%, var(--violet) 72%, #050816);
            border: 2px solid #050816;
            box-shadow: 0 0 14px rgba(255, 111, 183, 0.45);
        }

        .hero-beetle::before,
        .hero-beetle::after {
            content: "";
            position: absolute;
            top: 8px;
            width: 24px;
            height: 2px;
            background: #050816;
            box-shadow: 0 11px 0 #050816, 0 22px 0 #050816;
        }

        .hero-beetle::before { left: -18px; transform: rotate(19deg); }
        .hero-beetle::after { right: -18px; transform: rotate(-19deg); }

        .hero-crown {
            left: 48px;
            top: 0;
            width: 44px;
            height: 28px;
            background: linear-gradient(180deg, #fff7ad, var(--gold));
            clip-path: polygon(0 100%, 9% 38%, 30% 72%, 50% 8%, 70% 72%, 91% 38%, 100% 100%);
            filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.5));
        }

        .hero-tweezers {
            left: 49px;
            bottom: 0;
            width: 9px;
            height: 72px;
            border-radius: 999px;
            background: linear-gradient(180deg, #fff7ad, #eab308 55%, #854d0e);
            transform: rotate(-21deg);
            box-shadow: 13px 3px 0 -1px #eab308;
        }

        .sub-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            margin-bottom: 16px;
            border-radius: 999px;
            border: 1px solid rgba(103, 232, 249, 0.45);
            background: rgba(7, 14, 30, 0.7);
            color: var(--cyan);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: var(--font-primary);
        }

        @keyframes hero-bob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .reaction-stack {
            position: absolute;
            right: 12px;
            bottom: calc(env(safe-area-inset-bottom) + 12px);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
        }

        .reaction-card {
            width: min(34vw, 132px);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(103, 232, 249, 0.42);
            background: rgba(8, 15, 31, 0.66);
            box-shadow: 0 12px 24px rgba(2, 8, 23, 0.32);
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            backdrop-filter: blur(10px);
        }

        .reaction-card.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .reaction-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .reaction-tag {
            padding: 6px 10px 7px;
            color: var(--text-main);
            font-family: var(--font-secondary);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(90deg, rgba(14, 27, 61, 0.94), rgba(29, 78, 216, 0.72));
        }

        @media (max-width: 480px) {
            .hud-top {
                padding-top: 14px;
            }

            .vibe-container {
                width: calc(100% - 24px);
                padding: 10px 14px;
            }

            .menu-card {
                width: min(100%, 320px);
                padding: 26px 18px;
            }

            .btn-funk {
                font-size: 0.92rem;
                padding: 14px 16px;
            }

            .reaction-stack {
                right: 8px;
                bottom: calc(env(safe-area-inset-bottom) + 8px);
            }

            .reaction-card {
                width: min(30vw, 108px);
            }

            .reaction-tag {
                font-size: 0.64rem;
                padding: 5px 8px 6px;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="gameCanvas"></canvas>
        <div class="mom-motif-layer" aria-hidden="true">
            <span class="aura-crown"></span>
            <span class="edge-bouquet"></span>
            <span class="gift-stack"></span>
            <span class="card-drift"></span>
        </div>
        <div class="disco-lights"></div>
        <div id="flash-overlay"></div>

        <div class="ui-panel">
            <div class="hud-top">
                <div class="vibe-container" id="hud">
                    <div class="vibe-label">
                        <span>Mom Vibe</span>
                        <span id="stage-display" class="stage-pill">SPA SET</span>
                        <span id="score-display">0 CLEARS</span>
                    </div>
                    <div class="bar-bg">
                        <div id="health-bar" class="bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: clear/fail reactions -> catalogs/gifs.json -->
        <div class="reaction-stack" aria-hidden="true">
            <div id="clear-reaction" class="reaction-card">
                <img src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" alt="">
                <div class="reaction-tag">Bouquet bug yeeted!</div>
            </div>
            <div id="danger-reaction" class="reaction-card">
                <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="">
                <div class="reaction-tag">Mom vibe crashing</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="menu-card">
                <div class="hero-emblem" aria-hidden="true">
                    <span class="hero-crown"></span>
                    <span class="hero-bouquet"></span>
                    <span class="hero-beetle"></span>
                    <span class="hero-tweezers"></span>
                </div>
                <div class="sub-tag">Mom’s Day Scrub Squad</div>
                <h1>MOM’S DAY<br>BRAINROT BLITZ</h1>
                <div style="height: 6px; width: 88px; background: linear-gradient(90deg, var(--cyan), var(--magenta)); margin: 10px auto 20px auto; transform: skewX(-20deg); box-shadow: 0 0 12px rgba(103, 232, 249, 0.4);"></div>
                <p>
                    Drag each meme bug off Mom’s pamper stage.<br>
                    Yeet them fast to keep Mom Vibe glowing.
                </p>
                <button id="btn-start" class="btn-funk">START MOM SET</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <div class="menu-card" style="border-color: #ef4444;">
                <h1 style="color: #ef4444; text-shadow: 2px 2px 0 #500;">VIBE CRASH</h1>
                <p>Mom’s bouquet aura flatlined.<br>Too many brainrot bugs got through.</p>
                <p id="final-score" style="color: #f8cb2e; font-size: 1.5rem;">Chaos Cleared: 0</p>
                <button id="btn-restart" class="btn-funk" style="background: linear-gradient(to right, #ef4444, #b91c1c);">RUN IT BACK</button>
            </div>
        </div>
    </div>

    <script type="module">
        /*
         * Mom's Day Brainrot Bug Bouquet Blitz - catalog-guided media pass.
         * [agent-note][stage3] resolved-font: title/body -> catalogs/fonts.json (Bangers, Rajdhani)
         * [agent-note][stage3] resolved-audio: ui/collect/damage/fail/bgm -> catalogs/audios.json
         */

        const MEDIA = {
            audio: {
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
                grab: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
                clear: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
                warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3',
                fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3'
            }
        };

        const FunkAudio = {
            ctx: null,
            masterGain: null,
            initialized: false,
            loopGain: null,
            sfxGain: null,
            bgmSource: null,
            buffers: new Map(),
            lastPlayTimes: new Map(),
            htmlAudioPool: [],
            warnedLowHealth: false,

            async init() {
                if (this.initialized) {
                    if (this.ctx?.state === 'suspended') {
                        await this.ctx.resume().catch(() => {});
                    }
                    return;
                }

                const CtxClass = window.AudioContext || window.webkitAudioContext;
                if (!CtxClass) return;

                this.ctx = new CtxClass();
                this.masterGain = this.ctx.createGain();
                this.loopGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();

                this.masterGain.gain.value = 0.82;
                this.loopGain.gain.value = 0.2;
                this.sfxGain.gain.value = 0.7;

                this.loopGain.connect(this.masterGain);
                this.sfxGain.connect(this.masterGain);
                this.masterGain.connect(this.ctx.destination);

                this.initialized = true;
                if (this.ctx.state === 'suspended') {
                    await this.ctx.resume().catch(() => {});
                }
            },

            async getBuffer(url) {
                if (!this.ctx) return null;
                if (this.buffers.has(url)) return this.buffers.get(url);

                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`Audio request failed: ${response.status}`);
                    }
                    const arrayBuffer = await response.arrayBuffer();
                    const buffer = await this.ctx.decodeAudioData(arrayBuffer);
                    this.buffers.set(url, buffer);
                    return buffer;
                } catch {
                    return null;
                }
            },

            playHtmlAudio(url, options = {}) {
                const { loop = false, volume = 1 } = options;
                const audio = new Audio(url);
                // [agent-note][stage4] repaired: do not force anonymous CORS on approved remote audio fallback.
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = Math.min(1, Math.max(0, volume * (loop ? 0.2 : 1)));
                audio.playsInline = true;

                const forgetAudio = () => {
                    this.htmlAudioPool = this.htmlAudioPool.filter((entry) => entry !== audio);
                };

                if (!loop) {
                    audio.addEventListener('ended', forgetAudio, { once: true });
                }

                audio.play().catch(() => {
                    forgetAudio();
                });
                this.htmlAudioPool.push(audio);
                return { source: audio, fallback: true };
            },

            async playBuffer(url, targetNode, options = {}) {
                await this.init();

                const { loop = false, volume = 1, cooldown = 0 } = options;
                const nowMs = performance.now();
                const previousMs = this.lastPlayTimes.get(url) || 0;
                if (cooldown && nowMs - previousMs < cooldown) return null;
                this.lastPlayTimes.set(url, nowMs);

                if (!this.ctx || !targetNode) {
                    return this.playHtmlAudio(url, { loop, volume });
                }

                const isCrossOrigin = (() => {
                    try {
                        return new URL(url, window.location.href).origin !== window.location.origin;
                    } catch {
                        return false;
                    }
                })();
                if (isCrossOrigin) {
                    return this.playHtmlAudio(url, { loop, volume });
                }

                const buffer = await this.getBuffer(url);
                if (!buffer) {
                    return this.playHtmlAudio(url, { loop, volume });
                }

                try {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    gain.gain.value = volume;
                    source.buffer = buffer;
                    source.loop = loop;
                    source.connect(gain);
                    gain.connect(targetNode);
                    source.start();
                    return { source, gain };
                } catch {
                    return this.playHtmlAudio(url, { loop, volume });
                }
            },

            async startLoop() {
                if (this.bgmSource) return;
                const result = await this.playBuffer(MEDIA.audio.bgm, this.loopGain, {
                    loop: true,
                    volume: 1
                });
                this.bgmSource = result?.source || null;
            },

            stopLoop() {
                if (!this.bgmSource) return;
                try {
                    if (typeof this.bgmSource.pause === 'function') {
                        this.bgmSource.pause();
                        this.bgmSource.currentTime = 0;
                    } else {
                        this.bgmSource.stop();
                    }
                } catch {}
                this.bgmSource.disconnect?.();
                this.bgmSource = null;
            },

            async playSFX(type) {
                const audioMap = {
                    start: MEDIA.audio.start,
                    ui: MEDIA.audio.ui,
                    grab: MEDIA.audio.grab,
                    clear: MEDIA.audio.clear,
                    warning: MEDIA.audio.warning,
                    fail: MEDIA.audio.fail
                };
                const cooldownMap = {
                    start: 200,
                    ui: 140,
                    grab: 90,
                    clear: 120,
                    warning: 1400,
                    fail: 250
                };
                const volumeMap = {
                    start: 0.7,
                    ui: 0.42,
                    grab: 0.48,
                    clear: 0.62,
                    warning: 0.55,
                    fail: 0.72
                };

                const url = audioMap[type];
                if (!url) return;
                await this.playBuffer(url, this.sfxGain, {
                    cooldown: cooldownMap[type] || 0,
                    volume: volumeMap[type] || 0.6
                });
            },

            async shutdown() {
                this.stopLoop();
                this.htmlAudioPool.forEach((audio) => {
                    try {
                        audio.pause();
                        audio.currentTime = 0;
                    } catch {}
                });
                this.htmlAudioPool = [];
                this.warnedLowHealth = false;
            }
        };

        const ReactionFX = {
            timers: new Map(),

            show(id, duration = 900) {
                const el = document.getElementById(id);
                if (!el) return;
                window.clearTimeout(this.timers.get(id));
                el.classList.add('show');
                const timer = window.setTimeout(() => el.classList.remove('show'), duration);
                this.timers.set(id, timer);
            }
        };

        // --- Graphics Utilities ---
        const GFX = {
            skinPattern: null,
            createSkinTexture(ctx) {
                const size = 256;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const c = canvas.getContext('2d');
                c.fillStyle = '#eac096';
                c.fillRect(0,0,size,size);
                
                const id = c.getImageData(0,0,size,size);
                const d = id.data;
                for(let i=0; i<d.length; i+=4) {
                    const grain = (Math.random() - 0.5) * 15;
                    d[i] = Math.max(0, Math.min(255, d[i] + grain));
                    d[i+1] = Math.max(0, Math.min(255, d[i+1] + grain));
                    d[i+2] = Math.max(0, Math.min(255, d[i+2] + grain));
                }
                c.putImageData(id, 0, 0);
                this.skinPattern = ctx.createPattern(canvas, 'repeat');
            },
            drawShadow(ctx, x, y, r, blur, opacity) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(1, 0.4); 
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = '#2e0249'; // Funky dark purple shadow
                ctx.shadowColor = '#2e0249';
                ctx.shadowBlur = blur;
                ctx.globalAlpha = opacity;
                ctx.fill();
                ctx.restore();
            }
        };

        // --- Game State ---
        const State = {
            active: false,
            width: 0,
            height: 0,
            health: 100,
            score: 0,
            lastTime: 0,
            spawnTimer: 0,
            difficulty: 1,
            entities: [],
            particles: [],
            drag: {
                active: false,
                target: null,
                startPos: {x:0, y:0},
                currentPos: {x:0, y:0},
                z: 0
            }
        };

        const VISUAL_STAGES = [
            { min: 0, label: 'SPA SET', color: '#fde047' },
            { min: 500, label: 'BOUQUET', color: '#8cffc1' },
            { min: 1200, label: 'CARD CHAOS', color: '#fff7ad' },
            { min: 2200, label: 'GIFTSTORM', color: '#67e8f9' },
            { min: 3600, label: 'QUEEN MOM', color: '#fde047' }
        ];

        function getVisualStage() {
            let stage = VISUAL_STAGES[0];
            for (const entry of VISUAL_STAGES) {
                if (State.score >= entry.min) stage = entry;
            }
            return stage;
        }

        const Canvas = document.getElementById('gameCanvas');
        const Ctx = Canvas.getContext('2d', { alpha: false });

        // --- Entities ---
        class Bug {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.z = 0;
                this.originX = x;
                this.originY = y;
                this.radius = 18;
                this.angle = Math.random() * Math.PI * 2;
                this.age = 0;
                this.isDragged = false;
                this.remove = false;
                this.colorBase = Math.random() > 0.5 ? '#a855f7' : '#ff6fb7';
                this.shellGlow = Math.random() > 0.5 ? '#fde047' : '#67e8f9';
            }

            update(dt) {
                this.age += dt;
                if (this.isDragged) {
                    const dx = this.x - this.originX;
                    const dy = this.y - this.originY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    this.z = Math.min(60, dist * 0.4);
                    this.angle = Math.atan2(dy, dx) + Math.PI/2;
                } else {
                    this.z = 0;
                    // Bounce to the beat roughly (2Hz approx 120bpm)
                    this.angle += Math.sin(this.age * 0.01) * 0.05;
                    const beatPulse = Math.sin(this.age * 0.02) * 2;
                    
                    if (this.age > 2000) {
                        State.health -= 0.05 * State.difficulty;
                        triggerDamageFX(true);
                    } else {
                        triggerDamageFX(false);
                    }
                }
            }

            draw(ctx) {
                const scale = 1 + (this.z * 0.015);
                const shadowOff = this.z * 0.5;
                GFX.drawShadow(ctx, this.x, this.y + shadowOff + 12, this.radius * scale, 10 + this.z, 0.5 - (this.z*0.005));

                ctx.save();
                ctx.translate(this.x, this.y - this.z);
                ctx.scale(scale, scale);
                ctx.rotate(this.angle);

                // Legs
                ctx.strokeStyle = '#2e0249';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                const legWiggle = this.isDragged ? 5 : Math.sin(this.age * 0.02) * 3;
                
                for(let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-4, i * 6);
                    ctx.quadraticCurveTo(-18, (i*9), -26, (i*12) + (i===0?0:legWiggle));
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(4, i * 6);
                    ctx.quadraticCurveTo(18, (i*9), 26, (i*12) - (i===0?0:legWiggle));
                    ctx.stroke();
                }

                // Body (Mom's Day meme-glitch beetle shell)
                const grad = ctx.createRadialGradient(-4, -6, 2, 0, 0, 20);
                grad.addColorStop(0, '#f8fbff');
                grad.addColorStop(0.16, this.shellGlow);
                grad.addColorStop(0.55, this.colorBase);
                grad.addColorStop(1, '#050816');
                
                ctx.shadowColor = this.shellGlow;
                ctx.shadowBlur = this.isDragged ? 22 : 12;
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(0, -13);
                ctx.lineTo(0, 13);
                ctx.stroke();

                // Sticker-heart shell mark for Mom's Day motif; cosmetic only.
                drawHeart(ctx, 5, 2, 4.2, '#fde047', 0.9);
                ctx.strokeStyle = 'rgba(5, 8, 22, 0.55)';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.arc(4, -7, 1.2, 0, Math.PI * 2);
                ctx.arc(8, -7, 1.2, 0, Math.PI * 2);
                ctx.stroke();

                // Specular
                ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
                ctx.beginPath();
                ctx.ellipse(-4, -5, 4, 6, 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Head
                ctx.fillStyle = '#050816';
                ctx.beginPath();
                ctx.arc(0, -14, 6, 0, Math.PI * 2);
                ctx.fill();

                // Horns
                ctx.strokeStyle = this.shellGlow;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(-2, -18);
                ctx.quadraticCurveTo(-6, -24, -9, -24);
                ctx.moveTo(2, -18);
                ctx.quadraticCurveTo(6, -24, 9, -24);
                ctx.stroke();

                // Eyes (crown-thief glow)
                ctx.fillStyle = '#fde047';
                ctx.shadowColor = '#67e8f9';
                ctx.shadowBlur = 7;
                ctx.beginPath();
                ctx.arc(-2, -15, 1.5, 0, Math.PI * 2);
                ctx.arc(2, -15, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.life = 1.0;
                this.color = color;
                this.size = Math.random() * 6 + 3;
                this.gravity = 0.4;
                this.shape = Math.random() > 0.55 ? 'heart' : (Math.random() > 0.55 ? 'sparkle' : 'dot');
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                if (this.shape === 'heart') {
                    drawHeart(ctx, this.x, this.y, this.size * 0.34, this.color, this.life);
                } else if (this.shape === 'sparkle') {
                    drawSparkle(ctx, this.x, this.y, this.size, this.color, this.life);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        }

        // --- Core Logic ---

        function resize() {
            State.width = window.innerWidth;
            State.height = window.innerHeight;
            Canvas.width = State.width;
            Canvas.height = State.height;
            GFX.createSkinTexture(Ctx);
        }
        window.addEventListener('resize', resize);

        function spawnEntity() {
            const cx = State.width / 2;
            const cy = State.height / 2 + 50;
            const w = State.width * 0.35;
            const h = State.height * 0.3;
            let x, y, valid = false, attempts = 0;
            
            while(!valid && attempts < 10) {
                x = cx + (Math.random() - 0.5) * 2 * w;
                y = cy + (Math.random() - 0.5) * 2 * h;
                const dx = (x - cx) / w;
                const dy = (y - cy) / h;
                if (dx*dx + dy*dy <= 1) valid = true;
                attempts++;
            }
            if(valid) State.entities.push(new Bug(x, y));
        }

        function triggerDamageFX(active) {
            const overlay = document.getElementById('flash-overlay');
            if (active && State.health < 30) {
                overlay.style.opacity = (Math.sin(Date.now() / 100) * 0.5 + 0.5).toFixed(2);
                ReactionFX.show('danger-reaction', 1200);
                if (!FunkAudio.warnedLowHealth) {
                    FunkAudio.warnedLowHealth = true;
                    FunkAudio.playSFX('warning');
                }
            } else {
                overlay.style.opacity = '0';
                if (State.health >= 30) {
                    FunkAudio.warnedLowHealth = false;
                }
            }
        }

        function updateUI() {
            const bar = document.getElementById('health-bar');
            const score = document.getElementById('score-display');
            const stageDisplay = document.getElementById('stage-display');
            const displayHealth = Math.max(0, Math.min(100, State.health));
            const visualStage = getVisualStage();
            bar.style.width = `${displayHealth}%`;
            score.innerText = `${Math.floor(State.score)} CLEARS`;
            if (stageDisplay) {
                stageDisplay.innerText = visualStage.label;
                stageDisplay.style.background = `linear-gradient(90deg, ${visualStage.color}, var(--mint))`;
            }
        }

        function drawHeart(ctx, x, y, size, color, alpha = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size, size);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, 0.35);
            ctx.bezierCurveTo(-0.95, -0.25, -0.55, -1.05, 0, -0.65);
            ctx.bezierCurveTo(0.55, -1.05, 0.95, -0.25, 0, 0.35);
            ctx.fill();
            ctx.restore();
        }

        function drawSparkle(ctx, x, y, size, color, alpha = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const r = i % 2 === 0 ? size : size * 0.34;
                const a = (Math.PI * 2 * i) / 8;
                ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawCrown(ctx, x, y, w, h, color, alpha = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(-w * 0.5, h * 0.42);
            ctx.lineTo(-w * 0.42, -h * 0.08);
            ctx.lineTo(-w * 0.22, h * 0.2);
            ctx.lineTo(0, -h * 0.48);
            ctx.lineTo(w * 0.22, h * 0.2);
            ctx.lineTo(w * 0.42, -h * 0.08);
            ctx.lineTo(w * 0.5, h * 0.42);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawWorldBackground(ctx) {
            const t = Date.now() * 0.001;
            const cx = State.width / 2;
            const cy = State.height / 2 + 50;
            const visualStage = getVisualStage();

            const bg = ctx.createLinearGradient(0, 0, State.width, State.height);
            bg.addColorStop(0, '#220923');
            bg.addColorStop(0.35, State.score >= 2200 ? '#52185d' : '#421556');
            bg.addColorStop(0.72, State.score >= 3600 ? '#17215c' : '#15214b');
            bg.addColorStop(1, '#07152b');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, State.width, State.height);

            ctx.save();
            ctx.globalAlpha = 0.16;
            ctx.strokeStyle = visualStage.color;
            ctx.lineWidth = 1;
            for (let r = 90; r < Math.max(State.width, State.height); r += 84) {
                ctx.beginPath();
                ctx.arc(cx, cy, r + Math.sin(t * 0.7 + r) * 4, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            for (let i = 0; i < 13; i++) {
                const x = ((i * 173 + t * (18 + State.difficulty * 2)) % (State.width + 180)) - 90;
                const y = 72 + (i % 6) * (State.height / 7) + Math.sin(t + i) * 12;
                const color = i % 3 === 0 ? '#ff6fb7' : (i % 3 === 1 ? '#fde047' : '#8cffc1');
                drawHeart(ctx, x, y, 8 + (i % 3) * 4, color, 0.22);
            }
            ctx.restore();

            // Edge-only bouquet/card/gift silhouettes keep active bugs readable in the central playfield.
            for (let i = 0; i < 7; i++) {
                const stemX = 18 + i * 24;
                ctx.beginPath();
                ctx.moveTo(stemX, State.height);
                ctx.quadraticCurveTo(stemX + Math.sin(t + i) * 18, State.height * 0.66, stemX + 10, State.height * 0.38);
                ctx.strokeStyle = 'rgba(140, 255, 193, 0.3)';
                ctx.lineWidth = 3;
                ctx.stroke();
                drawHeart(ctx, stemX + 10, State.height * 0.36, 8, i % 2 ? '#ff6fb7' : '#fde047', 0.34);
            }

            ctx.save();
            ctx.translate(State.width - 86, State.height - 88);
            ctx.rotate(-0.08 + Math.sin(t) * 0.015);
            ctx.fillStyle = 'rgba(253, 224, 71, 0.16)';
            ctx.fillRect(-38, -28, 76, 56);
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.42)';
            ctx.lineWidth = 3;
            ctx.strokeRect(-38, -28, 76, 56);
            ctx.beginPath();
            ctx.moveTo(0, -28);
            ctx.lineTo(0, 28);
            ctx.moveTo(-38, 0);
            ctx.lineTo(38, 0);
            ctx.stroke();
            drawHeart(ctx, 0, -40, 7, '#ff6fb7', 0.48);
            ctx.restore();

            if (State.score >= 1200) {
                ctx.save();
                ctx.translate(State.width * 0.18, State.height * 0.24);
                ctx.rotate(-0.18);
                ctx.fillStyle = 'rgba(255, 247, 220, 0.11)';
                ctx.strokeStyle = 'rgba(255, 111, 183, 0.25)';
                ctx.lineWidth = 2;
                ctx.roundRect?.(-44, -28, 88, 56, 12);
                if (ctx.roundRect) {
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.fillRect(-44, -28, 88, 56);
                    ctx.strokeRect(-44, -28, 88, 56);
                }
                drawHeart(ctx, 0, 0, 10, '#ff6fb7', 0.28);
                ctx.restore();
            }

            if (State.score >= 3600) {
                drawCrown(ctx, cx, Math.max(96, State.height * 0.17), Math.min(180, State.width * 0.42), 56, '#fde047', 0.16);
            }

            const aura = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.max(State.width, State.height) * 0.44);
            aura.addColorStop(0, 'rgba(255, 236, 180, 0.2)');
            aura.addColorStop(0.45, State.health < 30 ? 'rgba(251, 113, 133, 0.14)' : 'rgba(255, 111, 183, 0.09)');
            aura.addColorStop(1, 'rgba(103, 232, 249, 0)');
            ctx.fillStyle = aura;
            ctx.fillRect(0, 0, State.width, State.height);
        }

        function drawFoot(ctx) {
            const cx = State.width / 2;
            const cy = State.height / 2 + 50;
            const w = State.width * 0.8; 
            const h = State.height * 0.7;

            ctx.save();
            ctx.translate(cx, cy);

            // Spa-pedestal shadow
            ctx.shadowColor = 'rgba(87, 10, 87, 0.6)';
            ctx.shadowBlur = 60;
            ctx.shadowOffsetY = 30;
            
            ctx.beginPath();
            ctx.arc(0, h * 0.4, w * 0.25, 0, Math.PI, false);
            ctx.bezierCurveTo(-w*0.4, h*0.2, -w*0.5, -h*0.2, -w*0.35, -h*0.4);
            ctx.bezierCurveTo(-w*0.1, -h*0.55, w*0.1, -h*0.55, w*0.35, -h*0.4);
            ctx.bezierCurveTo(w*0.2, -h*0.1, w*0.05, h*0.1, w*0.25, h*0.4);
            ctx.closePath();

            // Skin with slight purple tint for atmosphere
            const skinGrad = ctx.createRadialGradient(-50, -100, 20, 0, 0, h*0.6);
            skinGrad.addColorStop(0, '#ffe0bd');
            skinGrad.addColorStop(0.5, '#eac096');
            skinGrad.addColorStop(1, '#a97c9b'); // Purple-ish shadow
            
            ctx.fillStyle = skinGrad;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            if (GFX.skinPattern) {
                ctx.globalAlpha = 0.15;
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = GFX.skinPattern;
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
            }

            // Arch shadow
            ctx.beginPath();
            ctx.ellipse(w*0.15, 0, w*0.1, h*0.15, 0.2, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(87, 10, 87, 0.15)';
            ctx.filter = 'blur(20px)';
            ctx.fill();
            ctx.filter = 'none';

            // Toes
            const toeY = -h * 0.42;
            const toeXBase = -w * 0.25;
            const toeSizes = [28, 22, 18, 16, 14];
            
            for(let i=0; i<5; i++) {
                const tx = toeXBase + (i * w * 0.14);
                const ty = toeY + Math.abs(i-2)*10;
                const tr = toeSizes[i];

                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.arc(tx, ty + 5, tr, 0, Math.PI*2);
                ctx.fill();

                const tGrad = ctx.createRadialGradient(tx - 5, ty - 5, 2, tx, ty, tr);
                tGrad.addColorStop(0, '#fff0e5');
                tGrad.addColorStop(1, '#c49a75');
                ctx.fillStyle = tGrad;
                ctx.beginPath();
                ctx.arc(tx, ty, tr, 0, Math.PI*2);
                ctx.fill();

                    // Mom's Day gold polish shine
                ctx.fillStyle = 'rgba(253, 224, 71, 0.28)';
                ctx.beginPath();
                ctx.ellipse(tx, ty - 5, tr * 0.5, tr * 0.4, 0, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.restore();

            // Soft gift-ribbon rails on the pamper pedestal edges; kept behind targets.
            ctx.save();
            ctx.translate(cx, cy);
            ctx.globalAlpha = 0.38;
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 4;
            ctx.setLineDash([18, 18]);
            ctx.beginPath();
            ctx.ellipse(0, h * 0.12, w * 0.36, h * 0.29, -0.03, Math.PI * 0.08, Math.PI * 0.92);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 0.5;
            drawHeart(ctx, -w * 0.18, -h * 0.1, 10, '#ff6fb7', 0.42);
            drawHeart(ctx, w * 0.2, h * 0.04, 8, '#8cffc1', 0.36);
            ctx.restore();
            
            // Bug signal rings
            State.entities.forEach(e => {
                if(!e.isDragged) {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    const pulse = Math.sin(Date.now() * 0.015) * 0.2 + 1;
                    ctx.fillStyle = 'rgba(103, 232, 249, 0.16)';
                    ctx.strokeStyle = 'rgba(244, 114, 182, 0.45)';
                    ctx.lineWidth = 2;
                    ctx.filter = 'blur(8px)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 24 * pulse, 0, Math.PI*2);
                    ctx.fill();
                    ctx.filter = 'none';
                    ctx.beginPath();
                    ctx.arc(0, 0, 18 * pulse, 0, Math.PI*2);
                    ctx.stroke();
                    ctx.restore();
                }
            });
        }

        function drawTweezers(ctx) {
            if (!State.drag.active) return;
            const x = State.drag.currentPos.x;
            const y = State.drag.currentPos.y;
            const grabbing = State.drag.target !== null;
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-Math.PI / 8);
            
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 10;
            
            // Gold Tweezers!
            const metal = ctx.createLinearGradient(0, -100, 0, 0);
            metal.addColorStop(0, '#fef08a');
            metal.addColorStop(0.5, '#eab308');
            metal.addColorStop(1, '#a16207');

            ctx.fillStyle = metal;
            ctx.strokeStyle = '#854d0e';
            ctx.lineWidth = 1;

            const gap = grabbing ? 0 : 8;
            ctx.beginPath();
            ctx.moveTo(-gap, 0);
            ctx.lineTo(-10, -80);
            ctx.lineTo(-20, -80);
            ctx.lineTo(-gap-2, 0);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(gap, 0);
            ctx.lineTo(10, -80);
            ctx.lineTo(20, -80);
            ctx.lineTo(gap+2, 0);
            ctx.fill();
            ctx.stroke();
            // Tiny heart charm on the tweezer handle; visual only.
            ctx.shadowColor = '#fde047';
            ctx.shadowBlur = 10;
            drawHeart(ctx, 0, -88, 7, '#ff6fb7', 0.95);
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function loop(timestamp) {
            if (!State.active) return;
            const dt = timestamp - State.lastTime;
            State.lastTime = timestamp;

            Ctx.clearRect(0, 0, State.width, State.height);
            drawWorldBackground(Ctx);

            // Spawn logic
            State.spawnTimer += dt;
            const spawnRate = Math.max(800, 2000 - (State.difficulty * 100));
            if (State.spawnTimer > spawnRate) {
                spawnEntity();
                State.spawnTimer = 0;
            }
            State.difficulty += 0.0002;

            drawFoot(Ctx);

            State.entities.sort((a, b) => a.y - b.y);
            for (let i = State.entities.length - 1; i >= 0; i--) {
                let e = State.entities[i];
                e.update(dt);
                e.draw(Ctx);
                if (e.remove) State.entities.splice(i, 1);
            }

            for (let i = State.particles.length - 1; i >= 0; i--) {
                let p = State.particles[i];
                p.update();
                p.draw(Ctx);
                if (p.life <= 0) State.particles.splice(i, 1);
            }

            drawTweezers(Ctx);

            if (State.health <= 0) {
                State.health = 0;
                endGame();
            }

            updateUI();
            requestAnimationFrame(loop);
        }

        // --- Input ---
        function getPos(e) {
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX, y: t.clientY };
        }

        function handleStart(e) {
            if (!State.active) return;
            e.preventDefault();
            const pos = getPos(e);
            
            State.drag.active = true;
            State.drag.currentPos = pos;
            
            for (let i = State.entities.length - 1; i >= 0; i--) {
                let ent = State.entities[i];
                const dx = pos.x - ent.x;
                const dy = pos.y - ent.y;
                if (dx*dx + dy*dy < 1600) {
                    State.drag.target = ent;
                    ent.isDragged = true;
                    State.drag.startPos = { x: ent.x, y: ent.y };
                    FunkAudio.playSFX('grab');
                    if(navigator.vibrate) navigator.vibrate(10);
                    break;
                }
            }
        }

        function handleMove(e) {
            if (!State.active || !State.drag.active) return;
            e.preventDefault();
            const pos = getPos(e);
            State.drag.currentPos = pos;
            if (State.drag.target) {
                State.drag.target.x = pos.x;
                State.drag.target.y = pos.y;
            }
        }

        function handleEnd(e) {
            if (!State.active) return;
            e.preventDefault();
            if (State.drag.target) {
                const ent = State.drag.target;
                const dx = ent.x - ent.originX;
                const dy = ent.y - ent.originY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 100) {
                    ent.remove = true;
                    State.health = Math.min(100, State.health + 15); 
                    State.score += 100;
                    FunkAudio.playSFX('clear');
                    ReactionFX.show('clear-reaction', 850);
                    if(navigator.vibrate) navigator.vibrate([30, 30, 30]);

                    // Bouquet sparkle confetti
                    for(let i=0; i<20; i++) {
                        State.particles.push(new Particle(ent.x, ent.y, '#f8cb2e')); // Gold
                        State.particles.push(new Particle(ent.x, ent.y, '#d946ef')); // Pink
                        State.particles.push(new Particle(ent.x, ent.y, '#22c55e')); // Green
                    }
                } else {
                    ent.x = ent.originX;
                    ent.y = ent.originY;
                    ent.isDragged = false;
                }
            }
            State.drag.active = false;
            State.drag.target = null;
        }

        async function startGame() {
            await FunkAudio.init();
            FunkAudio.playSFX('start');
            FunkAudio.startLoop();

            State.active = true;
            State.health = 100;
            State.score = 0;
            State.entities = [];
            State.particles = [];
            State.difficulty = 1;
            State.lastTime = performance.now();

            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-over-screen').classList.remove('active');

            resize();
            requestAnimationFrame(loop);
        }

        function endGame() {
            State.active = false;
            FunkAudio.shutdown();
            FunkAudio.playSFX('fail');
            ReactionFX.show('danger-reaction', 1600);
            document.getElementById('final-score').innerText = `Chaos Cleared: ${Math.floor(State.score)}`;
            document.getElementById('game-over-screen').classList.add('active');
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            FunkAudio.playSFX('ui');
            startGame();
        });
        document.getElementById('btn-restart').addEventListener('click', () => {
            FunkAudio.playSFX('ui');
            startGame();
        });
        
        Canvas.addEventListener('touchstart', handleStart, {passive: false});
        Canvas.addEventListener('touchmove', handleMove, {passive: false});
        Canvas.addEventListener('touchend', handleEnd, {passive: false});
        Canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

    </script>
</body>
</html>
