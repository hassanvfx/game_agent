<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Starline Nova Patrol</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#0f172a',
                        gold: '#fbbf24',
                        demon: '#ef4444',
                        holy: '#fef08a',
                        tech: '#06b6d4',
                        purge: '#f472b6'
                    },
                    fontFamily: {
                        arcade: ['"Orbitron"', '"Exo 2"', 'sans-serif'],
                        ui: ['"Exo 2"', '"Orbitron"', 'sans-serif']
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-top: #050816;
            --bg-bottom: #0f172a;
            --panel-fill: rgba(10, 18, 38, 0.88);
            --panel-edge: rgba(111, 226, 255, 0.3);
            --hud-glow: rgba(111, 226, 255, 0.22);
            --gold-glow: rgba(251, 191, 36, 0.38);
            --danger-glow: rgba(239, 68, 68, 0.35);
            --text-main: #f8fbff;
            --text-soft: #9eb4d8;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(6, 182, 212, 0.16), transparent 28%),
                radial-gradient(circle at bottom, rgba(244, 114, 182, 0.12), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            touch-action: manipulation;
            font-family: 'Exo 2', 'Orbitron', sans-serif;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%, transparent 82%, rgba(255,255,255,0.02)),
                repeating-linear-gradient(180deg, rgba(148, 163, 184, 0.04) 0, rgba(148, 163, 184, 0.04) 1px, transparent 1px, transparent 4px);
            mix-blend-mode: screen;
            opacity: 0.35;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(10, 18, 38, 0.94), rgba(20, 31, 59, 0.84));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 30px rgba(0,0,0,0.55),
                0 0 18px var(--hud-glow);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f8d34f, #f59e0b 60%, #f97316);
            color: #111827;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border: 2px solid #fef08a;
            box-shadow:
                0 0 18px var(--gold-glow),
                inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.1s;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }
        .btn-primary:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* Weapon Card Styles */
        .weapon-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        h1, h2, #hud, #ult-btn, #start-btn, #restart-btn {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        #hud, #game-over-screen, #lobby-screen {
            text-shadow: 0 0 12px rgba(15, 23, 42, 0.75);
        }

        #weapon-icon {
            position: relative;
            transform: rotate(45deg);
            border: 2px solid rgba(255,255,255,0.35);
        }

        #weapon-icon::before,
        #weapon-icon::after {
            content: "";
            position: absolute;
            inset: 22%;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
        }

        #weapon-icon::after {
            inset: auto 28% 14% 28%;
            height: 24%;
            border-radius: 999px;
            background: rgba(255,255,255,0.28);
            box-shadow: 0 0 10px rgba(255,255,255,0.25);
        }
        
        .stat-bar-bg {
            background: rgba(0,0,0,0.5);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease-out;
        }

        /* Ultimate Button */
        #ult-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #ult-btn.charged {
            background: linear-gradient(135deg, #fef08a, #fbbf24);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.8), inset 0 0 10px white;
            border-color: #fff;
            animation: pulse-glow 1.5s infinite;
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        #ult-btn.drained {
            background: #334155;
            box-shadow: none;
            border-color: #475569;
            color: #64748b;
            opacity: 0.6;
            pointer-events: none;
            transform: scale(0.95);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
            50% { box-shadow: 0 0 40px rgba(251, 191, 36, 1); }
            100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full bg-slate-900">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 safe-area-inset">
            <!-- [agent-note][stage3] resolved-gif: powerup/fail overlays -> catalogs/gifs.json | keep-gif-off-playfield -->
            <img id="powerup-gif" class="feedback-gif" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp" alt="Power surge reaction overlay">
            <img id="danger-gif" class="feedback-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Danger reaction overlay">
            
            <!-- HUD Top -->
            <div id="hud" class="flex justify-between items-start opacity-0 transition-opacity duration-500">
                <div class="flex flex-col">
                    <div class="text-gold text-3xl drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">SCORE: <span id="scoreVal">0</span></div>
                    <div class="text-blue-300 text-sm tracking-widest flex items-center gap-2 mt-1">
                        <span class="text-xs">PWR</span>
                        <div class="flex gap-1 flex-wrap max-w-[120px]" id="power-pips">
                            <!-- Pips generated by JS -->
                        </div>
                    </div>
                </div>
                <!-- Charge Bar -->
                <div class="flex flex-col items-end">
                    <div class="text-xs text-yellow-500 mb-1 tracking-widest">NOVA CHARGE</div>
                    <div class="w-32 h-3 bg-gray-800 rounded-full border border-gray-600 overflow-hidden">
                        <div id="charge-bar" class="h-full bg-yellow-400 w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <!-- HUD Bottom (Ultimate Btn) -->
            <div id="controls-layer" class="flex justify-center items-end pb-8 opacity-0 transition-opacity duration-500 pointer-events-auto">
                <button id="ult-btn" class="drained w-24 h-24 rounded-full flex flex-col items-center justify-center font-bold text-xl tracking-tighter border-4">
                    <span>STAR</span>
                    <span>BURST</span>
                </button>
            </div>

            <!-- Lobby / Start Screen -->
            <div id="lobby-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-md pointer-events-auto z-50">
                
                <!-- Lobby Header -->
                <div class="text-center mb-6">
                    <h1 class="text-5xl text-transparent bg-clip-text bg-gradient-to-b from-cyan-200 via-yellow-200 to-yellow-500 drop-shadow-sm leading-tight">STARLINE<br>NOVA PATROL</h1>
                    <div class="text-slate-300 text-sm tracking-[0.3em] mt-2">ACE PILOT LOADOUT CONTROL</div>
                </div>

                <!-- Weapon Selector -->
                <div class="glass-panel w-full max-w-sm mx-4 p-6 rounded-2xl mb-8 relative">
                    <div class="flex justify-between items-center mb-4">
                        <button id="prev-weapon" class="p-4 text-yellow-400 hover:text-white active:scale-90 transition">◀</button>
                        <div class="text-center">
                            <h2 id="weapon-name" class="text-2xl text-white tracking-wider">PULSE CANNON</h2>
                            <div id="weapon-type" class="text-xs text-yellow-500 uppercase tracking-widest">Patrol Ready</div>
                        </div>
                        <button id="next-weapon" class="p-4 text-yellow-400 hover:text-white active:scale-90 transition">▶</button>
                    </div>
                    
                    <!-- Weapon Visual Placeholder -->
                    <div class="h-24 bg-slate-800/50 rounded-lg mb-4 flex items-center justify-center border border-slate-700 relative overflow-hidden">
                        <div class="absolute inset-x-6 top-1/2 h-px bg-cyan-300/25"></div>
                        <div class="absolute inset-x-10 bottom-4 h-8 rounded-full bg-cyan-400/10 blur-md"></div>
                        <div id="weapon-icon" class="w-12 h-12 rounded-full bg-yellow-400 shadow-[0_0_15px_rgba(251,191,36,0.6)]" style="animation: drift 2s ease-in-out infinite;"></div>
                    </div>

                    <!-- Stats -->
                    <div class="space-y-3 mb-4">
                        <div class="flex items-center text-xs text-slate-300">
                            <span class="w-16">POWER</span>
                            <div class="flex-1 stat-bar-bg"><div id="stat-power" class="stat-bar-fill bg-red-500" style="width: 50%"></div></div>
                        </div>
                        <div class="flex items-center text-xs text-slate-300">
                            <span class="w-16">SPEED</span>
                            <div class="flex-1 stat-bar-bg"><div id="stat-speed" class="stat-bar-fill bg-blue-400" style="width: 70%"></div></div>
                        </div>
                        <div class="flex items-center text-xs text-slate-300">
                            <span class="w-16">SPREAD</span>
                            <div class="flex-1 stat-bar-bg"><div id="stat-spread" class="stat-bar-fill bg-green-400" style="width: 40%"></div></div>
                        </div>
                    </div>
                    
                    <p id="weapon-desc" class="text-center text-xs text-slate-400 italic h-8">Balanced pressure for clearing incoming drones.</p>
                </div>

                <button id="start-btn" class="btn-primary py-4 px-16 rounded-full text-xl font-bold shadow-2xl animate-pulse-fast">DEPLOY</button>
                
                <div class="mt-6 text-slate-500 text-xs text-center">
                    <p>BEST SCORE: <span id="best-score" class="text-slate-300">0</span></p>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-red-950/90 backdrop-blur-md pointer-events-auto z-50">
                <h2 class="text-6xl text-white mb-2 drop-shadow-[0_4px_0_#000]">KIA</h2>
                <p class="text-red-300 text-sm tracking-widest mb-8">MISSION FAILED</p>
                
                <div class="glass-panel p-6 rounded-xl text-center w-64 mb-8">
                    <div class="text-xs text-slate-400 uppercase">Final Score</div>
                    <div class="text-4xl text-yellow-400 my-2" id="finalScore">0</div>
                </div>

                <div class="flex flex-col gap-4 w-64">
                    <button id="restart-btn" class="btn-primary py-3 rounded-full text-lg shadow-xl">RETRY</button>
                    <button id="lobby-btn" class="bg-slate-700 text-slate-200 py-3 rounded-full text-sm font-bold border border-slate-600 active:scale-95 transition">RETURN TO LOADOUT</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        /**
         * GAME DATA & CONFIG
         */
        // [agent-note][stage4] repaired-font/mobile: title/ui -> Orbitron + Exo 2 from catalogs/fonts.json | removed mirrored Russo One asset and kept touch suppression on canvas only
        // [agent-note][stage3] resolved-audio: loop/ui/shoot/power/fail -> catalogs/audios.json
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3",
                power: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3"
            },
            gifs: {
                powerup: "https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const WEAPONS = [
            {
                id: 'bolt',
                name: 'HOLY BOLT',
                type: 'BALANCED',
                desc: 'Standard plasma bolts. Upgrades increase spread massively.',
                color: '#fbbf24', // Gold
                stats: { pwr: 50, spd: 70, spr: 60 },
                fireRate: 15, // Frames between shots
                speed: 15,
                dmg: 1
            },
            {
                id: 'lancer',
                name: 'VOID LANCER',
                type: 'FOCUSED',
                desc: 'High-velocity stream. Deadly single-target DPS.',
                color: '#06b6d4', // Cyan
                stats: { pwr: 30, spd: 95, spr: 10 },
                fireRate: 6, // Very fast
                speed: 25,
                dmg: 0.6
            },
            {
                id: 'seeker',
                name: 'PURGE SEEKER',
                type: 'HOMING',
                desc: 'Intelligent missiles that hunt down demons.',
                color: '#f472b6', // Pink/Red
                stats: { pwr: 80, spd: 40, spr: 80 },
                fireRate: 35, // Slow
                speed: 8, // Start slow
                dmg: 2.5
            }
        ];

        /**
         * AUDIO SYSTEM
         */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.22;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                this.minInterval = { shoot: 70, hit: 90, power: 150, fail: 300, ui: 90, start: 200 };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(v);
                    sample.preload = 'auto';
                    this.sfx[k] = sample;
                }
                this.muted = false;
                this.ready = false;
            }

            unlock() {
                this.ready = true;
            }

            playBGM() {
                if (this.muted || !this.ready) return;
                if (this.bgm.paused) {
                    this.bgm.currentTime = this.bgm.currentTime || 0;
                    this.bgm.play().catch(() => {});
                }
            }

            pauseBGM() {
                this.bgm.pause();
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, vol = 0.5, rate = 1.0) {
                if (this.muted || !this.ready || !this.sfx[key]) return;
                const now = performance.now();
                const minInterval = this.minInterval[key] ?? 0;
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minInterval) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = Math.min(1, Math.max(0, vol));
                clone.playbackRate = rate;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /**
         * MAIN GAME LOGIC
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // UI References
        const ui = {
            lobby: document.getElementById('lobby-screen'),
            gameOver: document.getElementById('game-over-screen'),
            hud: document.getElementById('hud'),
            controls: document.getElementById('controls-layer'),
            score: document.getElementById('scoreVal'),
            powerPips: document.getElementById('power-pips'),
            finalScore: document.getElementById('finalScore'),
            ultBtn: document.getElementById('ult-btn'),
            chargeBar: document.getElementById('charge-bar'),
            container: document.getElementById('game-container'),
            bestScore: document.getElementById('best-score'),
            
            // Weapon Selector
            wName: document.getElementById('weapon-name'),
            wType: document.getElementById('weapon-type'),
            wDesc: document.getElementById('weapon-desc'),
            wIcon: document.getElementById('weapon-icon'),
            sPwr: document.getElementById('stat-power'),
            sSpd: document.getElementById('stat-speed'),
            sSpr: document.getElementById('stat-spread'),
            btnPrev: document.getElementById('prev-weapon'),
            btnNext: document.getElementById('next-weapon'),
            powerupGif: document.getElementById('powerup-gif'),
            dangerGif: document.getElementById('danger-gif')
        };

        // State
        let state = {
            active: false,
            width: 0,
            height: 0,
            frameCount: 0,
            score: 0,
            powerLevel: 1,
            maxPower: 8, // INCREASED POWER CAP
            charge: 0,
            maxCharge: 100,
            weaponIndex: 0,
            highScore: localStorage.getItem('starline_patrol_highscore') || 0
        };

        // Entities
        let player = { x: 0, y: 0, size: 40 };
        let inputX = 0;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let novas = [];
        let stars = [];

        // --- Initialization ---
        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;
            player.y = state.height - 120;
            if (!state.active) {
                player.x = state.width / 2;
                inputX = state.width / 2;
            }
            if(stars.length === 0) initStars();
        }
        window.addEventListener('resize', resize);

        function initStars() {
            stars = [];
            for(let i=0; i<80; i++) {
                stars.push({
                    x: Math.random() * state.width,
                    y: Math.random() * state.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }

        let feedbackTimers = {};

        function showFeedbackGif(key, duration = 900) {
            const el = key === 'powerup' ? ui.powerupGif : ui.dangerGif;
            if (!el) return;
            clearTimeout(feedbackTimers[key]);
            el.classList.add('active');
            feedbackTimers[key] = setTimeout(() => el.classList.remove('active'), duration);
        }

        function primeMedia() {
            audio.unlock();
            ui.powerupGif?.decode?.().catch(() => {});
            ui.dangerGif?.decode?.().catch(() => {});
        }

        function resetGame() {
            state.score = 0;
            state.powerLevel = 1;
            state.frameCount = 0;
            state.charge = 0;
            
            projectiles = [];
            enemies = [];
            particles = [];
            powerups = [];
            novas = [];
            
            player.x = state.width / 2;
            inputX = state.width / 2;
            
            updateUI();
            resize();
        }

        function updateUI() {
            ui.score.innerText = state.score;
            
            // Power Pips - Renders up to 8
            let pipsHTML = '';
            for(let i=0; i<state.maxPower; i++) {
                let color = i < state.powerLevel ? 'bg-blue-400' : 'bg-gray-700';
                // Slightly smaller pips to fit 8
                pipsHTML += `<div class="w-1.5 h-1.5 rounded-full ${color}"></div>`;
            }
            ui.powerPips.innerHTML = pipsHTML;
            
            // Charge
            const pct = Math.min(100, (state.charge / state.maxCharge) * 100);
            ui.chargeBar.style.width = `${pct}%`;
            
            if (state.charge >= state.maxCharge) {
                ui.ultBtn.className = "charged w-24 h-24 rounded-full flex flex-col items-center justify-center font-bold text-xl tracking-tighter border-4 cursor-pointer";
            } else {
                ui.ultBtn.className = "drained w-24 h-24 rounded-full flex flex-col items-center justify-center font-bold text-xl tracking-tighter border-4";
            }
        }

        // --- Lobby Logic ---
        function updateLobbyUI() {
            const w = WEAPONS[state.weaponIndex];
            ui.wName.innerText = w.name;
            ui.wType.innerText = w.type;
            ui.wDesc.innerText = w.desc;
            ui.wIcon.style.backgroundColor = w.color;
            ui.wIcon.style.boxShadow = `0 0 20px ${w.color}`;
            
            ui.sPwr.style.width = `${w.stats.pwr}%`;
            ui.sSpd.style.width = `${w.stats.spd}%`;
            ui.sSpr.style.width = `${w.stats.spr}%`;
            
            ui.bestScore.innerText = state.highScore;
        }

        ui.btnPrev.addEventListener('click', () => {
            primeMedia();
            state.weaponIndex = (state.weaponIndex - 1 + WEAPONS.length) % WEAPONS.length;
            updateLobbyUI();
            audio.playSFX('ui', 0.28, 1.08);
        });

        ui.btnNext.addEventListener('click', () => {
            primeMedia();
            state.weaponIndex = (state.weaponIndex + 1) % WEAPONS.length;
            updateLobbyUI();
            audio.playSFX('ui', 0.28, 1.08);
        });

        // --- Input Handling ---
        function handleMove(e) {
            if (!state.active) return;
            let cx = 0;
            if (e.touches && e.touches.length > 0) {
                cx = e.touches[0].clientX;
            } else {
                cx = e.clientX;
            }
            inputX = cx;
        }
        
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchstart', handleMove, { passive: false });
        canvas.addEventListener('mousemove', handleMove);

        ui.ultBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: false });
        ui.ultBtn.addEventListener('click', (e) => {
            primeMedia();
            e.stopPropagation();
            if (state.charge >= state.maxCharge) {
                triggerNova();
            }
        });

        // --- Game Mechanics ---

        function triggerNova() {
            state.charge = 0;
            updateUI();
            novas.push({
                x: player.x,
                y: player.y,
                r: 10,
                maxR: Math.max(state.width, state.height) * 1.5,
                speed: 40,
                alpha: 1.0
            });
            audio.playSFX('power', 0.7, 1.05);
            showFeedbackGif('powerup', 850);
            ui.container.classList.add('shake');
            setTimeout(() => ui.container.classList.remove('shake'), 500);
        }

        function spawnEnemy() {
            const r = Math.random();
            const difficulty = Math.min(1.0, state.score / 5000); 
            
            // Spawn Logic
            // 15% Elite, 10% Tank, 25% Swarm, 50% Grunt
            // Adjusted by difficulty
            
            let type = 'grunt';
            if (r > 0.92) type = 'tank';
            else if (r > 0.80) type = 'elite';
            else if (r > 0.60) type = 'swarmer';

            // Tank only after some score
            if (type === 'tank' && state.score < 200) type = 'elite';

            if (type === 'swarmer') {
                // Spawn batch of 3
                const startX = Math.random() * (state.width - 100) + 50;
                for(let i=0; i<3; i++) {
                    enemies.push({
                        x: startX + (i-1)*30,
                        y: -30 - (i*30),
                        w: 20, h: 20,
                        hp: 1, maxHp: 1,
                        speed: 4 + difficulty * 2,
                        type: 'swarmer',
                        phase: Math.random() * Math.PI * 2
                    });
                }
            } else if (type === 'tank') {
                const size = 60;
                enemies.push({
                    x: Math.random() * (state.width - size),
                    y: -size,
                    w: size, h: size,
                    hp: 30, maxHp: 30,
                    speed: 1 + difficulty,
                    type: 'tank'
                });
            } else if (type === 'elite') {
                const size = 45;
                enemies.push({
                    x: Math.random() * (state.width - size),
                    y: -size,
                    w: size, h: size,
                    hp: 8 + difficulty * 4, maxHp: 8,
                    speed: 2 + difficulty,
                    type: 'elite'
                });
            } else {
                // Grunt
                const size = 30;
                enemies.push({
                    x: Math.random() * (state.width - size),
                    y: -size,
                    w: size, h: size,
                    hp: 2 + difficulty * 2, maxHp: 2,
                    speed: 3 + difficulty,
                    type: 'grunt'
                });
            }
        }

        function createParticles(x, y, color, count = 8) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function dieEnemy(index, byNova = false) {
            const e = enemies[index];
            let scoreAdd = 10;
            if (e.type === 'elite') scoreAdd = 50;
            if (e.type === 'swarmer') scoreAdd = 20;
            if (e.type === 'tank') scoreAdd = 150;
            
            state.score += scoreAdd;
            
            if (state.charge < state.maxCharge) {
                let chargeAdd = 5;
                if (e.type === 'elite') chargeAdd = 15;
                if (e.type === 'tank') chargeAdd = 40;
                state.charge += chargeAdd;
                if (state.charge > state.maxCharge) state.charge = state.maxCharge;
            }
            
            createParticles(e.x + e.w/2, e.y + e.h/2, e.type === 'tank' ? '#22c55e' : '#ef4444', 12);
            
            // Drop chance
            let dropChance = 0.05;
            if (e.type === 'elite') dropChance = 0.3;
            if (e.type === 'tank') dropChance = 0.8;
            
            if (Math.random() < dropChance) {
                powerups.push({
                    x: e.x + e.w/2,
                    y: e.y + e.h/2,
                    size: 12,
                    speed: 2
                });
            }
            
            enemies.splice(index, 1);
            if(!byNova) audio.playSFX('hit', 0.32, e.type === 'tank' ? 0.9 : 1.05);
        }

        // --- Rendering ---
        function drawPlayer(ctx) {
            const x = player.x;
            const y = player.y;
            const s = player.size;
            const wColor = WEAPONS[state.weaponIndex].color;
            
            ctx.save();
            ctx.translate(x, y);
            
            // Aura
            ctx.shadowBlur = 15;
            ctx.shadowColor = wColor;
            
            // Body
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(0, -s/2);
            ctx.lineTo(s/2, s/2);
            ctx.lineTo(0, s/3);
            ctx.lineTo(-s/2, s/2);
            ctx.fill();
            
            // Core
            ctx.fillStyle = wColor;
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawEnemy(ctx, e) {
            ctx.save();
            ctx.translate(e.x + e.w/2, e.y + e.h/2);
            
            if (e.type === 'tank') {
                // Tank: Green/Tech, Hexagon
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#22c55e';
                ctx.fillStyle = '#14532d';
                ctx.strokeStyle = '#4ade80';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = i * Math.PI / 3;
                    const r = e.w/2;
                    ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // Inner detail
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(-8, -8, 16, 16);

            } else if (e.type === 'swarmer') {
                // Swarmer: Purple, Triangle
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#d946ef';
                ctx.fillStyle = '#701a75';
                
                ctx.rotate(Math.PI); // Point down
                ctx.beginPath();
                ctx.moveTo(0, -e.h/2);
                ctx.lineTo(e.w/2, e.h/2);
                ctx.lineTo(-e.w/2, e.h/2);
                ctx.fill();
                
                // Eye
                ctx.fillStyle = '#f0abfc';
                ctx.beginPath();
                ctx.arc(0, 0, 3, 0, Math.PI*2);
                ctx.fill();

            } else if (e.type === 'elite') {
                // Elite: Dark Red, Square with details
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ef4444';
                ctx.fillStyle = '#7f1d1d';
                ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
                
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(-10, -5, 6, 6);
                ctx.fillRect(4, -5, 6, 6);
            } else {
                // Grunt: Red, Arrow
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ef4444';
                ctx.fillStyle = '#b91c1c';
                ctx.beginPath();
                ctx.moveTo(0, -e.h/2);
                ctx.lineTo(e.w/2, 0);
                ctx.lineTo(0, e.h/2);
                ctx.lineTo(-e.w/2, 0);
                ctx.fill();
            }
            ctx.restore();
        }

        // --- Main Loop ---
        function loop() {
            if (!state.active) return;
            requestAnimationFrame(loop);
            
            // 1. Clear & Background
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, state.width, state.height);
            
            // Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                s.y += s.speed;
                if(s.y > state.height) { s.y = 0; s.x = Math.random() * state.width; }
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1.0;

            // 2. Player Movement
            player.x += (inputX - player.x) * 0.15;
            if (player.x < 20) player.x = 20;
            if (player.x > state.width - 20) player.x = state.width - 20;

            // 3. Shooting Logic
            const weapon = WEAPONS[state.weaponIndex];
            // Faster fire rate at high levels
            const fireRate = Math.max(2, weapon.fireRate - Math.floor(state.powerLevel * 0.8));
            
            if (state.frameCount % fireRate === 0) {
                // Audio Variation
                let pitch = 1.0;
                if(weapon.id === 'lancer') pitch = 1.5;
                if(weapon.id === 'seeker') pitch = 0.8;
                if(weapon.id !== 'lancer' || state.frameCount % (fireRate*2) === 0) {
                    audio.playSFX('shoot', 0.12, pitch);
                }

                // --- NEW POWER LOGIC UP TO LEVEL 8 ---
                if (weapon.id === 'bolt') {
                    // Center
                    projectiles.push({ x: player.x, y: player.y - 20, vx: 0, vy: -weapon.speed, size: 4, color: weapon.color, type: 'bolt' });
                    
                    if (state.powerLevel >= 2) {
                        projectiles.push({ x: player.x - 10, y: player.y - 10, vx: -2, vy: -weapon.speed * 0.9, size: 3, color: weapon.color, type: 'bolt' });
                        projectiles.push({ x: player.x + 10, y: player.y - 10, vx: 2, vy: -weapon.speed * 0.9, size: 3, color: weapon.color, type: 'bolt' });
                    }
                    if (state.powerLevel >= 4) {
                        projectiles.push({ x: player.x - 20, y: player.y, vx: -4, vy: -weapon.speed * 0.8, size: 3, color: weapon.color, type: 'bolt' });
                        projectiles.push({ x: player.x + 20, y: player.y, vx: 4, vy: -weapon.speed * 0.8, size: 3, color: weapon.color, type: 'bolt' });
                    }
                    if (state.powerLevel >= 6) {
                        // Wide spread
                        projectiles.push({ x: player.x - 30, y: player.y + 5, vx: -6, vy: -weapon.speed * 0.7, size: 3, color: weapon.color, type: 'bolt' });
                        projectiles.push({ x: player.x + 30, y: player.y + 5, vx: 6, vy: -weapon.speed * 0.7, size: 3, color: weapon.color, type: 'bolt' });
                    }
                    if (state.powerLevel >= 8) {
                        // Backwards/Side coverage
                        projectiles.push({ x: player.x - 35, y: player.y + 10, vx: -8, vy: -weapon.speed * 0.6, size: 3, color: weapon.color, type: 'bolt' });
                        projectiles.push({ x: player.x + 35, y: player.y + 10, vx: 8, vy: -weapon.speed * 0.6, size: 3, color: weapon.color, type: 'bolt' });
                    }

                } else if (weapon.id === 'lancer') {
                    // Center
                    projectiles.push({ x: player.x, y: player.y - 20, vx: 0, vy: -weapon.speed, size: 3, color: weapon.color, type: 'lancer' });
                    
                    if (state.powerLevel >= 3) {
                        projectiles.push({ x: player.x - 8, y: player.y - 15, vx: 0, vy: -weapon.speed, size: 2, color: weapon.color, type: 'lancer' });
                        projectiles.push({ x: player.x + 8, y: player.y - 15, vx: 0, vy: -weapon.speed, size: 2, color: weapon.color, type: 'lancer' });
                    }
                    if (state.powerLevel >= 5) {
                        projectiles.push({ x: player.x - 16, y: player.y - 10, vx: 0, vy: -weapon.speed, size: 2, color: weapon.color, type: 'lancer' });
                        projectiles.push({ x: player.x + 16, y: player.y - 10, vx: 0, vy: -weapon.speed, size: 2, color: weapon.color, type: 'lancer' });
                    }
                    if (state.powerLevel >= 7) {
                        // Rapid stream
                        projectiles.push({ x: player.x - 24, y: player.y - 5, vx: 0, vy: -weapon.speed, size: 2, color: weapon.color, type: 'lancer' });
                        projectiles.push({ x: player.x + 24, y: player.y - 5, vx: 0, vy: -weapon.speed, size: 2, color: weapon.color, type: 'lancer' });
                    }

                } else if (weapon.id === 'seeker') {
                    // Homing Missiles
                    let count = 1 + Math.floor(state.powerLevel / 1.5); // More missiles
                    for(let i=0; i<count; i++) {
                        let offset = (i - (count-1)/2) * 12;
                        projectiles.push({ 
                            x: player.x + offset, 
                            y: player.y - 10, 
                            vx: offset * 0.3, 
                            vy: -weapon.speed * 0.5, 
                            size: 5, 
                            color: weapon.color, 
                            type: 'seeker',
                            target: null
                        });
                    }
                }
            }

            // 4. Projectiles Update
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                
                // Homing Logic
                if (p.type === 'seeker') {
                    if (!p.target || !enemies.includes(p.target)) {
                        // Find closest
                        let minDist = 9999;
                        enemies.forEach(e => {
                            let d = Math.hypot(e.x - p.x, e.y - p.y);
                            if (d < minDist && e.y < p.y) { // Only target enemies above
                                minDist = d;
                                p.target = e;
                            }
                        });
                    }
                    if (p.target) {
                        let angle = Math.atan2((p.target.y + p.target.h/2) - p.y, (p.target.x + p.target.w/2) - p.x);
                        p.vx += Math.cos(angle) * 0.9;
                        p.vy += Math.sin(angle) * 0.9;
                        // Cap speed
                        let speed = Math.hypot(p.vx, p.vy);
                        if (speed > 14) {
                            p.vx = (p.vx / speed) * 14;
                            p.vy = (p.vy / speed) * 14;
                        }
                    }
                }

                p.x += p.vx;
                p.y += p.vy;
                
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                if (p.y < -50 || p.x < -50 || p.x > state.width + 50) projectiles.splice(i, 1);
            }

            // 5. Novas
            for (let i = novas.length - 1; i >= 0; i--) {
                let n = novas[i];
                n.r += n.speed;
                n.alpha -= 0.02;
                
                ctx.save();
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
                ctx.lineWidth = 20;
                ctx.strokeStyle = `rgba(251, 191, 36, ${n.alpha})`;
                ctx.stroke();
                ctx.fillStyle = `rgba(254, 240, 138, ${n.alpha * 0.3})`;
                ctx.fill();
                ctx.restore();

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let d = Math.hypot(e.x + e.w/2 - n.x, e.y + e.h/2 - n.y);
                    if (d < n.r + 20 && d > n.r - 40) {
                         dieEnemy(j, true);
                    }
                }
                if (n.alpha <= 0) novas.splice(i, 1);
            }

            // 6. Enemies
            // Spawn rate increases with score
            if (state.frameCount % Math.max(15, 60 - Math.floor(state.score/200)) === 0) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                
                // Movement
                e.y += e.speed;
                if (e.type === 'swarmer') {
                    // Sine wave movement
                    e.x += Math.sin((state.frameCount * 0.1) + e.phase) * 3;
                    // Clamp to screen
                    if(e.x < 0) e.x = 0;
                    if(e.x > state.width - e.w) e.x = state.width - e.w;
                }

                drawEnemy(ctx, e);

                let pd = Math.hypot(player.x - (e.x + e.w/2), player.y - (e.y + e.h/2));
                if (pd < player.size/2 + e.w/2 - 5) {
                    gameOver();
                    return;
                }

                for (let j = projectiles.length - 1; j >= 0; j--) {
                    let p = projectiles[j];
                    if (p.x > e.x && p.x < e.x + e.w && p.y > e.y && p.y < e.y + e.h) {
                        e.hp -= weapon.dmg;
                        createParticles(p.x, p.y, weapon.color, 3);
                        projectiles.splice(j, 1);
                        if (e.hp <= 0) {
                            dieEnemy(i);
                        }
                        break;
                    }
                }
                if (e.y > state.height) enemies.splice(i, 1);
            }

            // 7. Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.y += p.speed;
                
                ctx.fillStyle = '#3b82f6';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#60a5fa';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                let d = Math.hypot(player.x - p.x, player.y - p.y);
                if (d < 30) {
                    audio.playSFX('power', 0.55, 1.12);
                    showFeedbackGif('powerup', 950);
                    state.powerLevel = Math.min(state.powerLevel + 1, state.maxPower);
                    state.score += 50;
                    powerups.splice(i, 1);
                    updateUI();
                } else if (p.y > state.height) {
                    powerups.splice(i, 1);
                }
            }

            // 8. Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }

            drawPlayer(ctx);
            state.frameCount++;
            updateUI();
        }

        function gameOver() {
            state.active = false;
            audio.pauseBGM();
            audio.playSFX('fail', 0.65, 0.96);
            showFeedbackGif('fail', 1600);
            
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('starline_patrol_highscore', state.highScore);
            }

            ui.hud.style.opacity = '0';
            ui.controls.style.opacity = '0';
            ui.gameOver.classList.remove('hidden');
            ui.finalScore.innerText = state.score;
        }

        // --- Flows ---
        const startGame = () => {
            ui.lobby.classList.add('hidden');
            ui.hud.classList.remove('hidden');
            ui.hud.style.opacity = '1';
            ui.controls.classList.remove('hidden');
            ui.controls.style.opacity = '1';
            
            primeMedia();
            audio.playSFX('start', 0.5, 1.0);
            primeMedia();
            audio.playSFX('start', 0.42, 1.05);
            audio.playBGM();
            resetGame();
            state.active = true;
            resize();
            loop();
        };

        ui.lobby.querySelector('#start-btn').addEventListener('click', startGame);
        ui.lobby.querySelector('#start-btn').addEventListener('touchend', (e) => {
            e.preventDefault();
            startGame();
        }, { passive: false });

        function returnToLobby() {
            ui.gameOver.classList.add('hidden');
            ui.hud.classList.add('hidden');
            ui.controls.classList.add('hidden');
            ui.lobby.classList.remove('hidden');
            updateLobbyUI();
            audio.stopBGM();
            resetGame(); // Reset state but don't start loop
            state.active = false;
        }

        const restartGame = () => {
            ui.gameOver.classList.add('hidden');
            ui.hud.style.opacity = '1';
            ui.controls.style.opacity = '1';
            primeMedia();
            audio.playSFX('start', 0.5, 1.0);
            audio.playBGM();
            resetGame();
            state.active = true;
            loop();
        };

        ui.gameOver.querySelector('#restart-btn').addEventListener('click', restartGame);
        ui.gameOver.querySelector('#restart-btn').addEventListener('touchend', (e) => {
            e.preventDefault();
            restartGame();
        }, { passive: false });
        ui.gameOver.querySelector('#lobby-btn').addEventListener('click', returnToLobby);

        // Initial setup
        initStars();
        resize();
        updateLobbyUI();

    </script>
</body>
</html>
