<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zigzag Vote Rush</title>
    <!-- [agent-note][stage4] preserve: catalog-fonts | title=Orbitron ui=Rajdhani accent=Press Start 2P -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg-top: #11152b;
            --bg-bottom: #05060f;
            --lane-glow: rgba(112, 232, 255, 0.16);
            --panel: rgba(13, 18, 39, 0.82);
            --panel-edge: rgba(112, 232, 255, 0.45);
            --accent: #70e8ff;
            --accent-strong: #00b7ff;
            --hero-main: #ff4f9f;
            --hero-deep: #7f2cff;
            --token: #ffe27a;
            --hazard: #ff6b7b;
            --ink: #09111d;
            --text: #f5fbff;
            --muted: #d7e6ff;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(112, 232, 255, 0.18), transparent 28%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(16, 24, 51, 0.94), rgba(8, 12, 28, 0.92));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 12px 34px rgba(0, 0, 0, 0.42),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 18px rgba(112, 232, 255, 0.12);
        }

        .font-teko {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .font-fredoka {
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .hidden { display: none !important; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .p-8 { padding: 2rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .text-center { text-align: center; }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-red-600 { color: #dc2626; }
        .text-yellow-400 { color: #facc15; }
        .text-lg { font-size: 1.125rem; line-height: 1.6; }
        .text-2xl { font-size: 1.5rem; line-height: 1.35; }
        .text-3xl { font-size: 1.875rem; line-height: 1.2; }
        .text-4xl { font-size: 2.25rem; line-height: 1.15; }
        .text-6xl { font-size: 3.25rem; line-height: 1; }
        .text-7xl { font-size: 3.6rem; line-height: 0.95; }
        .font-bold { font-weight: 700; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .bg-white { background: #fff; }
        .bg-yellow-400 { background: #facc15; }
        .border-4 { border-width: 4px; border-style: solid; }
        .border-black { border-color: #000; }
        .shadow-lg { box-shadow: 0 10px 15px rgba(0, 0, 0, 0.35); }
        .drop-shadow-md { filter: drop-shadow(0 4px 3px rgba(0,0,0,0.35)); }
        .transform { transform: translateZ(0); }
        .transition-all { transition-property: all; }
        .transition-transform { transition-property: transform; }
        .duration-300 { transition-duration: 300ms; }
        .opacity-90 { opacity: 0.9; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        button { cursor: pointer; }

        #start-screen,
        #game-over-screen {
            width: min(84vw, 22rem);
            max-width: 22rem;
            padding: 1.35rem 1.15rem 1.25rem;
            border-radius: 1.15rem;
            overflow: hidden;
        }

        #start-screen::before,
        #game-over-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(112, 232, 255, 0.18), transparent 45%),
                linear-gradient(315deg, rgba(255, 79, 159, 0.16), transparent 42%);
            pointer-events: none;
            border-radius: inherit;
        }

        .hero-badge {
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 0.85rem;
            display: grid;
            place-items: center;
            font-size: 2rem;
            border-radius: 1.2rem;
            background:
                radial-gradient(circle at 35% 30%, #ffd6ec 0 12%, transparent 13%),
                linear-gradient(180deg, #ff72b7, #7e33ff);
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.2),
                0 0 18px rgba(255, 79, 159, 0.45);
            animation: mascotPulse 2.2s ease-in-out infinite;
        }

        .title-stack {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-bottom: 0.85rem;
        }

        .subtitle-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            align-self: center;
            margin-bottom: 0.9rem;
            padding: 0.26rem 0.65rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            background: rgba(112, 232, 255, 0.12);
            border: 1px solid rgba(112, 232, 255, 0.28);
        }

        .start-copy,
        .over-copy {
            max-width: 18rem;
            margin-inline: auto;
            color: var(--muted);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
        }

        .arcade-btn {
            position: relative;
            min-height: 2.85rem;
            border: 2px solid rgba(255, 255, 255, 0.16);
            background:
                linear-gradient(180deg, #ffe27a, #ffb347);
            color: var(--ink);
            box-shadow:
                0 0.35rem 0 #8e4d00,
                0 0.85rem 1.4rem rgba(0, 0, 0, 0.35);
            transition:
                transform 160ms ease,
                box-shadow 160ms ease,
                filter 160ms ease;
        }

        .arcade-btn:active,
        .arcade-btn.is-pressed {
            transform: translateY(0.18rem) scale(0.98);
            box-shadow:
                0 0.12rem 0 #8e4d00,
                0 0.55rem 0.9rem rgba(0, 0, 0, 0.28);
            filter: brightness(1.04);
        }

        #hud {
            gap: 0.45rem;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.75rem;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid rgba(112, 232, 255, 0.32);
            box-shadow:
                0 0 12px rgba(112, 232, 255, 0.12),
                inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        .hud-emoji {
            font-size: 1rem;
            filter: drop-shadow(0 0 6px rgba(255, 226, 122, 0.5));
        }

        .hud-value {
            color: var(--token);
            text-shadow: 0 0 10px rgba(255, 226, 122, 0.35);
        }

        .score-burst {
            position: absolute;
            left: 50%;
            top: 5.1rem;
            transform: translateX(-50%);
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            color: #fff8cb;
            background: rgba(255, 181, 71, 0.18);
            border: 1px solid rgba(255, 226, 122, 0.35);
            box-shadow: 0 0 12px rgba(255, 181, 71, 0.2);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif {
            position: absolute;
            right: 0.9rem;
            bottom: 1rem;
            width: min(27vw, 6.25rem);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(112, 232, 255, 0.28);
            background: rgba(4, 8, 20, 0.58);
            box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(0.35rem) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-gif.show {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            right: auto;
            left: 0.9rem;
            bottom: 1rem;
            border-color: rgba(255, 107, 123, 0.38);
        }

        .score-burst.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-0.1rem);
        }

        @keyframes pop {
            0% { transform: scale(0.7); opacity: 0.2; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes mascotPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.04); }
        }

        @media (max-width: 480px) {
            .p-8 { padding: 1.2rem; }
            .text-7xl { font-size: 2.7rem; }
            .text-6xl { font-size: 2.5rem; }
            .text-4xl { font-size: 1.35rem; }
            .text-3xl { font-size: 1.15rem; }
            .text-2xl { font-size: 1.1rem; }
            .text-lg { font-size: 0.98rem; }
            #start-screen,
            #game-over-screen {
                width: min(88vw, 20rem);
            }
            #hud {
                top: 0.75rem;
                left: 0.75rem;
            }
            .feedback-gif {
                width: min(25vw, 4.5rem);
                right: 0.65rem;
                bottom: 0.65rem;
            }
            .feedback-gif.fail {
                left: 0.65rem;
                bottom: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <!-- ASSET DECLARATION -->
    <img id="asset_player" data-editable="image" data-label="Runner Sprite" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" hidden>
    <audio id="bgm_main" data-editable="audio" data-label="BGM Upbeat" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="SFX Collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="SFX Fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_turn" data-editable="audio" data-label="SFX Turn" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
    <!-- [agent-note][stage3] resolved-gif: collect=heart reward fail=gamer rage via catalogs/gifs.json -->
    <img id="gif_collect" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Reward reaction" hidden>
    <img id="gif_fail" class="feedback-gif fail" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction" hidden>

    <!-- CONFIG -->
    <script id="game-config" type="application/x-game-config">
    {
        "heroSpeed": { "type": "number", "label": "Run Speed", "value": 6, "min": 3, "max": 15 },
        "obstacleFreq": { "type": "number", "label": "Drama Intensity", "value": 40, "min": 20, "max": 100 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#FF4F9F" }
    }
    </script>

    <!-- UI LAYER -->
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center">

            <!-- START SCREEN -->
            <div id="start-screen" class="glass p-8 rounded-2xl text-center pointer-events-auto transform transition-all duration-300 relative">
                <div class="hero-badge" aria-hidden="true">🗳️</div>
                <div class="subtitle-chip">Neon ballot sprint</div>
                <div class="title-stack">
                    <h1 class="font-teko text-7xl text-white mb-2" style="color: var(--hero-main); text-shadow: 0 0 14px rgba(255, 79, 159, 0.55), 0 0 26px rgba(112, 232, 255, 0.18);">VOTE</h1>
                    <h1 class="font-teko text-7xl text-white mb-2" style="color: var(--accent); text-shadow: 0 0 14px rgba(112, 232, 255, 0.5), 0 0 26px rgba(0, 183, 255, 0.2);">RUSH</h1>
                </div>
                <p class="font-fredoka start-copy text-lg mb-6 opacity-90">Zigzag through the hype lane, scoop bright vote tokens, and dodge every nasty bad drop.</p>
                <button id="start-btn" class="arcade-btn text-black font-teko text-3xl px-8 py-2 rounded-full transition-transform shadow-lg">Start Run</button>
            </div>

            <!-- GAME OVER SCREEN -->
            <div id="game-over-screen" class="hidden glass p-8 rounded-2xl text-center pointer-events-auto animate-pop relative">
                <div class="hero-badge" aria-hidden="true">⚠️</div>
                <h2 class="font-teko text-6xl text-red-600 drop-shadow-md mb-2" style="color: var(--hazard); text-shadow: 0 0 14px rgba(255, 107, 123, 0.4);">Run Over</h2>
                <p class="font-fredoka over-copy text-lg mb-4">The spotlight crashed, but the crowd still counted your clean pickups.</p>
                <div class="font-fredoka text-white text-2xl mb-4">Vote Tokens: <span id="finalScore" class="font-bold text-yellow-400">0</span></div>

            </div>

            <!-- HUD -->
            <div id="hud" class="absolute top-4 left-4 hidden flex flex-col items-start">
                <div class="hud-chip font-teko text-4xl text-white">
                    <span class="hud-emoji" aria-hidden="true">✨</span>
                    <span>TOKENS: <span id="score" class="hud-value">0</span></span>
                </div>
                <div id="score-burst" class="score-burst" aria-hidden="true">+1 TOKEN</div>
            </div>
        </div>
    </div>

    <!-- LOGIC -->
    <script>
        // --- GLOBAL STATE & CONFIG ---
        window.gameConfigDefs = {
            "heroSpeed": { "type": "number", "label": "Run Speed", "value": 6, "min": 3, "max": 15 },
            "obstacleFreq": { "type": "number", "label": "Drama Intensity", "value": 40, "min": 20, "max": 100 },
            "themeColor": { "type": "color", "label": "Theme Color", "value": "#FF4F9F" }
        };

        window.gameConfig = {
            heroSpeed: 6,
            obstacleFreq: 40,
            themeColor: "#FF4F9F"
        };

        window.updateGameConfig = (key, val) => {
            if (window.gameConfig.hasOwnProperty(key)) {
                window.gameConfig[key] = val;
                if (key === 'themeColor') {
                    const titles = document.querySelectorAll('h1');
                    if (titles[0]) titles[0].style.color = val;
                }
            }
        };

        // --- AUDIO MANAGER ---
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.buffers = {};
                this.isUnlocked = false;
                this.muted = false;
                this.lastPlayedAt = {};
            }

            ensureContext() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                return this.ctx;
            }

            unlock() {
                const ctx = this.ensureContext();
                if (!ctx) return;
                if (this.isUnlocked && ctx.state === 'running') return;

                ctx.resume()
                    .then(() => {
                        this.isUnlocked = true;
                        this.playBgm();
                    })
                    .catch(() => {});
            }

            async loadSound(id, src) {
                const ctx = this.ensureContext();
                if (!ctx || !src) return;

                try {
                    const response = await fetch(src);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                    this.buffers[id] = audioBuffer;
                } catch (e) {
                    console.warn('Audio load failed, fallback enabled', e);
                }
            }

            playBgm() {
                const el = document.getElementById('bgm_main');
                if (!el || !this.isUnlocked || this.muted) return;
                el.volume = 0.2;
                el.play().catch(() => {});
            }

            stopBgm() {
                const el = document.getElementById('bgm_main');
                if (!el) return;
                el.pause();
                el.currentTime = 0;
            }

            pauseBgm() {
                const el = document.getElementById('bgm_main');
                if (!el) return;
                el.pause();
            }

            playSfx(id, fallbackType = 'beep', cooldownMs = 70) {
                const ctx = this.ensureContext();
                if (!ctx || !this.isUnlocked || this.muted) return;

                const now = performance.now();
                if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldownMs) return;
                this.lastPlayedAt[id] = now;

                if (this.buffers[id]) {
                    const source = ctx.createBufferSource();
                    const gain = ctx.createGain();
                    gain.gain.value = id === 'fail' ? 0.42 : 0.3;
                    source.buffer = this.buffers[id];
                    source.connect(gain);
                    gain.connect(ctx.destination);
                    source.start(0);
                } else {
                    this.synthesize(fallbackType);
                }
            }

            synthesize(type) {
                const ctx = this.ensureContext();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'explosion') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.32, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(560, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.06);
                    gain.gain.setValueAtTime(0.14, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.06);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.22, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }
            }
        }

        // --- GAME ENGINE ---
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const audio = new AudioManager();
            const startButton = document.getElementById('start-btn');
            const restartButton = document.getElementById('restart-btn');
            const scoreBurst = document.getElementById('score-burst');
            const collectGif = document.getElementById('gif_collect');
            const failGif = document.getElementById('gif_fail');

            // Load SFX
            const sfxCollectSrc = document.getElementById('sfx_collect')?.src;
            const sfxFailSrc = document.getElementById('sfx_fail')?.src;
            const sfxTurnSrc = document.getElementById('sfx_turn')?.src;
            const sfxStartSrc = document.getElementById('sfx_start')?.src;
            if (sfxCollectSrc) audio.loadSound('collect', sfxCollectSrc);
            if (sfxFailSrc) audio.loadSound('fail', sfxFailSrc);
            if (sfxTurnSrc) audio.loadSound('turn', sfxTurnSrc);
            if (sfxStartSrc) audio.loadSound('start', sfxStartSrc);

            // State
            let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
            let lastTime = 0;
            let score = 0;
            let frameCount = 0;
            let speedMultiplier = 1;
            let scoreBurstTimeout = null;

            // Entities
            let player = { x: 0, y: 0, w: 50, h: 80, dir: 1, targetX: 0 };
            let obstacles = []; // {x, y, type, w, h, active}
            // [agent-note][stage1] role: future-audio | trigger: collect-token and collision | intent: reinforce clean arcade feedback
            let particles = [];
            let cameraY = 0;

            // Assets
            const playerImg = document.getElementById('asset_player');

            function wirePressState(button) {
                if (!button) return;
                const on = () => button.classList.add('is-pressed');
                const off = () => button.classList.remove('is-pressed');
                button.addEventListener('pointerdown', on);
                button.addEventListener('pointerup', off);
                button.addEventListener('pointerleave', off);
                button.addEventListener('pointercancel', off);
            }

            wirePressState(startButton);
            wirePressState(restartButton);

            function flashScoreBurst() {
                if (!scoreBurst) return;
                scoreBurst.classList.add('show');
                clearTimeout(scoreBurstTimeout);
                scoreBurstTimeout = setTimeout(() => scoreBurst.classList.remove('show'), 260);
            }

            function flashGif(el, duration = 900) {
                if (!el) return;
                el.hidden = false;
                el.classList.add('show');
                clearTimeout(el._hideTimer);
                el._hideTimer = setTimeout(() => {
                    el.classList.remove('show');
                    setTimeout(() => { el.hidden = true; }, 180);
                }, duration);
            }

            // Resize Logic
            function resize() {
                const dpr = window.devicePixelRatio || 1;
                const rect = document.body.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                if (gameState === 'MENU') {
                    player.x = rect.width / 2;
                    player.targetX = rect.width / 2;
                    player.y = rect.height - 150;
                }
            }
            window.addEventListener('resize', resize);
            resize();

            // Input Logic
            function handleInput(e) {
                if (e.type !== 'pointerdown') return;
                e.preventDefault();

                if (gameState === 'MENU') {
                    startGame();
                } else if (gameState === 'PLAYING') {
                    player.dir *= -1;
                    audio.playSfx('turn', 'click', 90);
                    createParticles(player.x, player.y + player.h / 2, 6, '#70E8FF');
                } else if (gameState === 'GAMEOVER') {
                    resetGame();
                }

                audio.unlock();
            }

            canvas.addEventListener('pointerdown', handleInput, { passive: false });
            startButton.addEventListener('click', (e) => { e.stopPropagation(); startGame(); audio.unlock(); });
            restartButton.addEventListener('click', (e) => { e.stopPropagation(); resetGame(); audio.unlock(); });

            function startGame() {
                gameState = 'PLAYING';
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                score = 0;
                speedMultiplier = 1;
                frameCount = 0;
                obstacles = [];
                particles = [];
                player.x = canvas.width / (window.devicePixelRatio || 1) / 2;
                player.dir = 1;
                document.getElementById('score').innerText = '0';
                scoreBurst?.classList.remove('show');
                collectGif.hidden = true;
                failGif.hidden = true;
                audio.playSfx('start', 'click', 120);
                audio.playBgm();
            }

            function resetGame() {
                gameState = 'MENU';
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
                document.getElementById('hud').classList.add('hidden');
                collectGif.hidden = true;
                failGif.hidden = true;
                audio.pauseBgm();
                cameraY = 0;
            }

            function gameOver() {
                gameState = 'GAMEOVER';
                audio.playSfx('fail', 'explosion', 180);
                audio.pauseBgm();
                flashGif(failGif, 1400);

                const container = document.getElementById('game-container');
                container.style.transform = "translate(5px, 5px)";
                setTimeout(() => container.style.transform = "translate(-5px, -5px)", 50);
                setTimeout(() => container.style.transform = "translate(5px, -5px)", 100);
                setTimeout(() => container.style.transform = "none", 150);

                document.getElementById('hud').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = score;
            }

            function createParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1.0,
                        color: color,
                        size: Math.random() * 5 + 2
                    });
                }
            }

            function spawnObstacle(cw) {
                const type = Math.random() > 0.3 ? 'blocker' : (Math.random() > 0.5 ? 'crate' : 'vote');
                const laneCount = 5;
                const laneWidth = cw / laneCount;
                const lane = Math.floor(Math.random() * laneCount);
                const x = lane * laneWidth + laneWidth / 2;

                let w = 40, h = 40;
                if (type === 'crate') { w = 30; h = 45; }

                obstacles.push({
                    x: x,
                    y: -50,
                    w: w,
                    h: h,
                    type: type,
                    active: true,
                    rot: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                });
            }

            function update(dt) {
                if (gameState !== 'PLAYING') return;

                const cw = canvas.width / (window.devicePixelRatio || 1);
                const ch = canvas.height / (window.devicePixelRatio || 1);

                const speed = window.gameConfig.heroSpeed * 40 * dt * speedMultiplier;
                player.x += player.dir * speed;

                if (player.x < player.w / 2) {
                    player.x = player.w / 2;
                    player.dir *= -1;
                } else if (player.x > cw - player.w / 2) {
                    player.x = cw - player.w / 2;
                    player.dir *= -1;
                }

                speedMultiplier += dt * 0.01;

                frameCount++;
                const spawnRate = Math.max(10, 60 - Math.floor(score / 5));
                if (Math.random() < (1 / spawnRate)) {
                    spawnObstacle(cw, ch);
                }

                const fallSpeed = 200 * dt * speedMultiplier;
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.y += fallSpeed;
                    obs.rot += obs.rotSpeed;

                    const dx = player.x - obs.x;
                    const dy = player.y - obs.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                        if (obs.active && dist < (player.w / 2 + obs.w / 2)) {
                            if (obs.type === 'vote') {
                                obs.active = false;
                                score++;
                                document.getElementById('score').innerText = score;
                                audio.playSfx('collect', 'beep', 60);
                                createParticles(obs.x, obs.y, 12, '#FFE27A');
                                flashScoreBurst();
                                flashGif(collectGif, 720);
                            } else {
                                gameOver();
                            }
                        }

                    if (obs.y > ch + 100) obstacles.splice(i, 1);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= dt * 2;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function drawBackground(cw, ch) {
                const grad = ctx.createLinearGradient(0, 0, 0, ch);
                grad.addColorStop(0, '#1B2043');
                grad.addColorStop(0.55, '#0D132B');
                grad.addColorStop(1, '#04050C');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                ctx.fillStyle = 'rgba(112, 232, 255, 0.08)';
                for (let i = 0; i < 5; i++) {
                    const x = (cw / 5) * i + cw / 10;
                    ctx.fillRect(x - 2, 0, 4, ch);
                }

                const spotlight = ctx.createRadialGradient(cw * 0.5, ch * 0.15, 10, cw * 0.5, ch * 0.15, ch * 0.75);
                spotlight.addColorStop(0, 'rgba(112,232,255,0.22)');
                spotlight.addColorStop(1, 'rgba(112,232,255,0)');
                ctx.fillStyle = spotlight;
                ctx.beginPath();
                ctx.ellipse(cw * 0.5, ch * 0.18, cw * 0.4, ch * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.beginPath();
                ctx.arc(cw * 0.82, ch * 0.16, 72, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawVoteToken(obs) {
                ctx.fillStyle = '#FFE27A';
                ctx.shadowColor = '#FFB547';
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(0, 0, obs.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#0A1220';
                ctx.beginPath();
                ctx.arc(-7, -3, 2.3, 0, Math.PI * 2);
                ctx.arc(7, -3, 2.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#0A1220';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(0, 4, 8, 0.15, Math.PI - 0.15);
                ctx.stroke();
            }

            function drawBlocker(obs) {
                const bodyGrad = ctx.createLinearGradient(-obs.w / 2, -obs.h / 2, obs.w / 2, obs.h / 2);
                bodyGrad.addColorStop(0, '#2E365F');
                bodyGrad.addColorStop(1, '#12162F');
                ctx.fillStyle = bodyGrad;
                ctx.strokeStyle = '#FF6B7B';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.roundRect(-obs.w / 2, -obs.h / 2, obs.w, obs.h, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#FF6B7B';
                ctx.beginPath();
                ctx.arc(-7, -3, 2.5, 0, Math.PI * 2);
                ctx.arc(7, -3, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#FF9CAA';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-8, 9);
                ctx.lineTo(8, 5);
                ctx.stroke();
            }

            function drawCrate(obs) {
                const crateGrad = ctx.createLinearGradient(-obs.w / 2, -obs.h / 2, obs.w / 2, obs.h / 2);
                crateGrad.addColorStop(0, '#00C5FF');
                crateGrad.addColorStop(1, '#2352FF');
                ctx.fillStyle = crateGrad;
                ctx.strokeStyle = '#C7F6FF';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-obs.w / 2, -obs.h / 2, obs.w, obs.h, 8);
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.moveTo(-obs.w / 2 + 5, -obs.h / 2 + 7);
                ctx.lineTo(obs.w / 2 - 5, obs.h / 2 - 7);
                ctx.moveTo(obs.w / 2 - 5, -obs.h / 2 + 7);
                ctx.lineTo(-obs.w / 2 + 5, obs.h / 2 - 7);
                ctx.stroke();
            }

            function drawPlayer(cw) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.dir * 0.12);

                ctx.fillStyle = 'rgba(0,0,0,0.34)';
                ctx.beginPath();
                ctx.ellipse(0, player.h / 2 + 4, player.w / 2 + 5, 11, 0, 0, Math.PI * 2);
                ctx.fill();

                const pulse = Math.sin(performance.now() / 180) * 2;
                const heroWidth = player.w;
                const heroHeight = player.h;

                ctx.fillStyle = '#8D36FF';
                ctx.beginPath();
                ctx.roundRect(-heroWidth / 2, -heroHeight / 2, heroWidth, heroHeight, 14);
                ctx.fill();

                if (playerImg && playerImg.complete && playerImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(-heroWidth / 2 + 3, -heroHeight / 2 + 4, heroWidth - 6, heroHeight - 8, 12);
                    ctx.clip();
                    ctx.drawImage(playerImg, -heroWidth / 2 + 3, -heroHeight / 2 + 4, heroWidth - 6, heroHeight - 8);
                    ctx.restore();
                }

                const suitGrad = ctx.createLinearGradient(-heroWidth / 2, -heroHeight / 2, heroWidth / 2, heroHeight / 2);
                suitGrad.addColorStop(0, window.gameConfig.themeColor);
                suitGrad.addColorStop(1, '#7F2CFF');
                ctx.fillStyle = suitGrad;
                ctx.globalAlpha = playerImg && playerImg.complete && playerImg.naturalWidth > 0 ? 0.52 : 1;
                ctx.beginPath();
                ctx.roundRect(-heroWidth / 2 + 4, -heroHeight / 2 + 6, heroWidth - 8, heroHeight - 10, 12);
                ctx.fill();
                ctx.globalAlpha = 1;

                ctx.fillStyle = '#FFE7C8';
                ctx.beginPath();
                ctx.ellipse(0, -heroHeight / 2 + 22 + pulse * 0.12, 14, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#09111D';
                ctx.beginPath();
                ctx.arc(-5, -heroHeight / 2 + 21, 1.9, 0, Math.PI * 2);
                ctx.arc(5, -heroHeight / 2 + 21, 1.9, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#09111D';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -heroHeight / 2 + 26, 5, 0.2, Math.PI - 0.2);
                ctx.stroke();

                ctx.fillStyle = '#70E8FF';
                ctx.beginPath();
                ctx.moveTo(0, -heroHeight / 2 + 6);
                ctx.lineTo(10, -heroHeight / 2 + 18);
                ctx.lineTo(-10, -heroHeight / 2 + 18);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2.6;
                ctx.beginPath();
                ctx.roundRect(-heroWidth / 2, -heroHeight / 2, heroWidth, heroHeight, 14);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(112, 232, 255, 0.5)';
                ctx.beginPath();
                ctx.moveTo(-heroWidth / 2 + 6, heroHeight / 2 - 12);
                ctx.lineTo(heroWidth / 2 - 6, heroHeight / 2 - 18);
                ctx.stroke();

                ctx.restore();
            }

            function draw() {
                const cw = canvas.width / (window.devicePixelRatio || 1);
                const ch = canvas.height / (window.devicePixelRatio || 1);

                drawBackground(cw, ch);

                obstacles.forEach(obs => {
                    if (!obs.active) return;
                    ctx.save();
                    ctx.translate(obs.x, obs.y);
                    ctx.rotate(obs.rot);

                    if (obs.type === 'blocker') {
                        drawBlocker(obs);
                    } else if (obs.type === 'crate') {
                        drawCrate(obs);
                    } else if (obs.type === 'vote') {
                        drawVoteToken(obs);
                    }
                    ctx.restore();
                });

                drawPlayer(cw);

                particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;
            }

            function loop(timestamp) {
                const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
                lastTime = timestamp;

                try {
                    update(dt);
                    draw();
                } catch (e) {
                    console.error("Game Loop Error:", e);
                }

                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);
        });
    </script>
</body>
