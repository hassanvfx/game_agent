<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Creeper Cleanup</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07140d;
            --bg-mid: #10261a;
            --panel: rgba(8, 19, 13, 0.88);
            --panel-border: #8cff65;
            --panel-shadow: rgba(0, 0, 0, 0.55);
            --text-main: #f3ffe8;
            --text-soft: #cdeab4;
            --accent: #a9ff5c;
            --accent-2: #55ff55;
            --gold: #ffe066;
            --danger: #ff5c73;
            --danger-deep: #722436;
            --slime: #1f5d2c;
            --slime-2: #43a047;
            --spark: rgba(196, 255, 109, 0.35);
        }

        * { box-sizing: border-box; }

        html, body { width: 100%; height: 100%; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, #163c24 0%, #0c1c13 42%, #050807 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            touch-action: none;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(33, 77, 42, 0.94) 0%, rgba(10, 23, 15, 0.94) 100%);
            border: 4px solid var(--panel-border);
            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.42),
                0 16px 30px var(--panel-shadow),
                inset 0 0 0 2px rgba(212, 255, 176, 0.16);
            image-rendering: pixelated;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), transparent 28%),
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.035) 0 2px,
                    transparent 2px 12px
                );
            pointer-events: none;
        }

        .mc-btn {
            background:
                linear-gradient(180deg, #8cff65 0%, #4cc945 54%, #2c8f2f 100%);
            border: 4px solid #183b1a;
            border-top-color: #d7ffbd;
            border-left-color: #d7ffbd;
            color: #06200d;
            text-shadow: none;
            box-shadow:
                0 6px 0 #183b1a,
                0 10px 20px rgba(0,0,0,0.35);
            cursor: pointer;
            transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
            position: relative;
            z-index: 1;
        }

        .mc-btn:hover,
        .mc-btn:focus-visible {
            filter: brightness(1.05);
            transform: translateY(-1px);
            outline: none;
        }

        .mc-btn:active {
            border: 4px solid #183b1a;
            border-bottom-color: #d7ffbd;
            border-right-color: #d7ffbd;
            transform: translate(2px, 4px);
            box-shadow:
                0 2px 0 #183b1a,
                0 5px 10px rgba(0,0,0,0.28);
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .bottom-10 { bottom: 2.5rem; }
        .group { }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-md { max-width: 28rem; }
        .bg-green-800 {
            background:
                radial-gradient(circle at 50% 18%, rgba(140, 255, 101, 0.18), transparent 32%),
                linear-gradient(180deg, #173820 0%, #0d1f12 60%, #08110b 100%);
        }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .p-8 { padding: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .text-left { text-align: left; }
        .text-center { text-align: center; }
        .text-white { color: var(--text-main); }
        .text-red-500 { color: #ff7389; }
        .text-yellow-400 { color: var(--gold); }
        .text-gray-300 { color: #daefc2; }
        .text-gray-200 { color: #edf8e0; }
        .text-xl { font-size: 1.25rem; line-height: 1.6; }
        .text-2xl { font-size: 1.5rem; line-height: 1.5; }
        .text-3xl { font-size: 1.875rem; line-height: 1.4; }
        .text-4xl { font-size: 2.25rem; line-height: 1.3; }
        .text-6xl { font-size: 3.75rem; line-height: 1.05; }
        .drop-shadow-md { filter: drop-shadow(0 3px 2px rgba(0,0,0,0.55)); }
        .tracking-widest { letter-spacing: 0.15em; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .animate-pulse { animation: pulse 1.4s ease-in-out infinite; }

        .title-creep {
            font-family: 'Creepster', cursive;
            letter-spacing: 0.08em;
            color: #b6ff7d;
            text-shadow:
                0 2px 0 #09130b,
                0 5px 0 #09130b,
                0 0 18px rgba(120, 255, 87, 0.42);
        }

        .subtitle-tag {
            display: inline-block;
            padding: 0.55rem 0.8rem;
            border: 2px solid rgba(209, 255, 170, 0.35);
            background: rgba(12, 29, 18, 0.72);
            color: var(--text-soft);
            box-shadow: inset 0 0 12px rgba(130, 255, 112, 0.08);
        }

        .control-card {
            position: relative;
            border: 2px solid rgba(202, 255, 166, 0.22);
            background: rgba(4, 12, 7, 0.42);
            padding: 0.85rem 1rem;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }

        .control-emoji {
            display: inline-block;
            margin-right: 0.55rem;
            filter: drop-shadow(0 0 8px rgba(196,255,109,0.35));
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(194, 255, 95, 0.12), transparent 20%),
                radial-gradient(circle at 80% 24%, rgba(194, 255, 95, 0.08), transparent 16%),
                radial-gradient(circle at 50% 82%, rgba(108, 255, 124, 0.05), transparent 26%);
            animation: mistShift 10s ease-in-out infinite alternate;
        }

        #game-container::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 18%, transparent 82%, rgba(0,0,0,0.18)),
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.016) 0 2px,
                    transparent 2px 7px
                );
            opacity: 0.65;
        }

        #ui-layer > * { position: relative; z-index: 1; }

        #start-screen,
        #game-over-screen {
            margin: 1rem;
        }

        #hud .score-shell {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.9rem;
            background: rgba(5, 15, 8, 0.7);
            border: 3px solid rgba(155, 255, 109, 0.72);
            box-shadow:
                0 10px 24px rgba(0,0,0,0.36),
                inset 0 0 0 2px rgba(255,255,255,0.06);
            backdrop-filter: blur(2px);
        }

        .hud-icon {
            font-size: 1rem;
            filter: drop-shadow(0 0 10px rgba(185,255,90,0.4));
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            top: 1rem;
            width: min(28vw, 7rem);
            aspect-ratio: 1;
            object-fit: cover;
            border: 3px solid rgba(173, 255, 120, 0.72);
            background: rgba(0, 0, 0, 0.42);
            box-shadow: 0 10px 22px rgba(0,0,0,0.35);
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 160ms ease, transform 160ms ease;
            pointer-events: none;
            z-index: 2;
            image-rendering: auto;
            border-radius: 0.75rem;
        }

        .feedback-gif.visible {
            opacity: 0.96;
            transform: scale(1);
        }

        .feedback-gif.fail-gif {
            top: auto;
            bottom: 1rem;
            width: min(34vw, 8rem);
        }

        .audio-badge {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            padding: 0.5rem 0.75rem;
            border: 2px solid rgba(173, 255, 120, 0.55);
            background: rgba(5, 15, 8, 0.78);
            color: var(--text-soft);
            font-size: 0.72rem;
            line-height: 1.4;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0,0,0,0.28);
            pointer-events: none;
            z-index: 2;
        }

        #mobile-hint {
            padding: 0.7rem 1rem;
            background: rgba(7, 15, 9, 0.78);
            border: 2px solid rgba(164, 255, 120, 0.65);
            box-shadow: 0 8px 18px rgba(0,0,0,0.28);
            text-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }

        @keyframes mistShift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(0, -8px, 0) scale(1.02); }
        }

        @media (max-width: 767px) {
            .text-xl { font-size: 1rem; }
            .text-2xl { font-size: 1.125rem; }
            .text-3xl { font-size: 1.35rem; }
            .text-4xl { font-size: 1.6rem; }
            .text-6xl { font-size: 2.2rem; }
            .p-8 { padding: 1.25rem; }
            .px-12 { padding-left: 1.5rem; padding-right: 1.5rem; }

            #start-screen,
            #game-over-screen {
                max-width: min(92vw, 28rem);
            }

            .control-card {
                padding: 0.75rem 0.85rem;
            }

            #hud .score-shell {
                gap: 0.55rem;
                padding: 0.55rem 0.7rem;
            }

            .feedback-gif {
                right: 0.6rem;
                width: min(24vw, 5.25rem);
            }

            .feedback-gif.fail-gif {
                bottom: 4.8rem;
                width: min(28vw, 6rem);
            }

            .audio-badge {
                right: 0.6rem;
                bottom: 0.75rem;
                max-width: 40vw;
                font-size: 0.58rem;
            }

            #mobile-hint {
                bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
                max-width: calc(100vw - 2rem);
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full bg-green-800">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-8 max-w-md w-full text-center pointer-events-auto">
                <h1 class="text-6xl mb-2 drop-shadow-md tracking-widest title-creep">CREEPER CLEANUP</h1>
                <p class="text-gray-300 text-2xl mb-8 subtitle-tag">🧪 Hold the field. Clear every rush.</p>
                <div class="space-y-4 text-xl text-gray-200 mb-8 text-left px-4">
                    <p class="control-card"><span class="control-emoji">🕹️</span><strong>Move:</strong> Mouse / Touch Drag</p>
                    <p class="control-card"><span class="control-emoji">⚔️</span><strong>Swing:</strong> Click / Tap</p>
                </div>
                <button id="start-btn" class="mc-btn text-3xl py-4 px-12 w-full">START RUN</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-8 max-w-md w-full text-center pointer-events-auto">
                <h2 class="text-6xl text-red-500 mb-4 title-creep" style="color: #ff7f93;">FIELD LOST!</h2>
                <div class="text-3xl text-white mb-8">Creepers cleared: <span id="finalScore" class="text-yellow-400">0</span></div>
                <button id="restart-btn" class="mc-btn text-3xl py-4 px-12 w-full">TRY AGAIN</button>
            </div>
            
            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="absolute top-4 left-4 hidden pointer-events-none">
                <div class="text-4xl text-white drop-shadow-md score-shell">
                    <span class="hud-icon">💚</span>
                    <span>Cleared: <span id="score" class="text-yellow-400">0</span></span>
                </div>
            </div>

            <!-- Mobile Attack Hint -->
            <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
            <div id="mobile-hint" class="absolute bottom-10 text-white text-xl animate-pulse hidden">
                ⚡ Tap anywhere to swing!
            </div>

            <img
                id="hit-gif"
                class="feedback-gif"
                src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp"
                alt="Combat impact reaction"
                decoding="async"
                loading="lazy"
            >
            <img
                id="fail-gif"
                class="feedback-gif fail-gif"
                src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
                alt="Defeat reaction"
                decoding="async"
                loading="lazy"
            >
            <div id="audio-status" class="audio-badge hidden">Audio armed</div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            gifs: {
                hit: "https://i.giphy.com/1AjEBGWggGXh9onllB.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            },
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                swing: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                kill: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            }
        };

        const ENABLE_ANIMATIONS = true;
        const hitGif = document.getElementById('hit-gif');
        const failGif = document.getElementById('fail-gif');
        const audioStatus = document.getElementById('audio-status');

        if (hitGif) hitGif.src = ASSETS.gifs.hit;
        if (failGif) failGif.src = ASSETS.gifs.fail;
        // [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json (Creepster + Press Start 2P)
        // [agent-note][stage3] resolved-audio: loop/start/swing/kill/score/fail -> catalogs/audios.json
        // [agent-note][stage3] resolved-gif: hit/fail feedback -> catalogs/gifs.json

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.isArmed = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayed = {};
                this.volumes = {
                    start: 0.52,
                    swing: 0.42,
                    kill: 0.5,
                    score: 0.38,
                    blocked: 0.33,
                    fail: 0.58
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            arm() {
                this.isArmed = true;
                if (audioStatus) {
                    audioStatus.textContent = 'Audio armed';
                    audioStatus.classList.remove('hidden');
                }
            }

            setStatus(message) {
                if (!audioStatus) return;
                audioStatus.textContent = message;
                audioStatus.classList.remove('hidden');
            }

            playBGM() {
                if (!this.isArmed) return;
                this.bgm.currentTime = 0;
                this.bgm.play()
                    .then(() => this.setStatus('BGM live'))
                    .catch(() => this.setStatus('Audio muted'));
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
                this.setStatus('Audio standby');
            }

            playSFX(key, { debounceMs = 0 } = {}) {
                if (!this.isArmed || !this.sfx[key]) return;

                const now = performance.now();
                if (debounceMs > 0 && this.lastPlayed[key] && now - this.lastPlayed[key] < debounceMs) {
                    return;
                }
                this.lastPlayed[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.volumes[key] ?? 0.45;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        function pulseGif(element, duration = 520) {
            if (!element) return;
            element.classList.add('visible');
            window.clearTimeout(element._hideTimer);
            element._hideTimer = window.setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        
        // Input State
        let mouse = { x: 0, y: 0 };

        // Game Objects
        let player = {
            x: 0, y: 0, 
            size: 30, 
            speed: 4, 
            angle: 0,
            swinging: false,
            swingTimer: 0,
            swingDuration: 15,
            color: '#2980b9',
            idleBob: 0
        };
        
        let enemies = [];
        let particles = [];
        let grassTiles = [];

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Regenerate background
            grassTiles = [];
            const cols = Math.ceil(width / 50);
            const rows = Math.ceil(height / 50);
            for(let i=0; i<cols; i++) {
                for(let j=0; j<rows; j++) {
                    grassTiles.push({
                        x: i * 50,
                        y: j * 50,
                        hueShift: Math.random(),
                        blades: Array.from({ length: 3 }, () => ({
                            ox: 10 + Math.random() * 30,
                            oy: 10 + Math.random() * 30,
                            h: 6 + Math.random() * 10
                        }))
                    });
                }
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Listeners
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        canvas.addEventListener('touchmove', e => {
            if (!gameActive || e.touches.length === 0) return;
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });
        
        window.addEventListener('mousedown', () => {
            if(gameActive) attemptAttack();
        });
        // [agent-note][stage4] repaired: mobile-cta-risk | action: scoped touch suppression to canvas so menu buttons keep native tap/click behavior
        canvas.addEventListener('touchstart', e => {
            if (!gameActive || e.touches.length === 0) return;
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            attemptAttack();
        }, { passive: false });

        function attemptAttack() {
            if (!player.swinging) {
                player.swinging = true;
                player.swingTimer = player.swingDuration;
                audio.playSFX('swing', { debounceMs: 70 });
                return;
            }

            audio.playSFX('blocked', { debounceMs: 140 });
        }

        /** 4. GAME LOGIC */
        function initGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('finalScore').innerText = score;
            
            player.x = width / 2;
            player.y = height / 2;
            player.swinging = false;
            player.idleBob = 0;
            
            enemies = [];
            particles = [];
            frameCount = 0;
            
            // Reset Mouse to center to prevent instant run
            mouse.x = width / 2;
            mouse.y = height / 2;
        }

        function spawnEnemy() {
            // Spawn at edge
            let ex, ey;
            if (Math.random() < 0.5) {
                ex = Math.random() < 0.5 ? -40 : width + 40;
                ey = Math.random() * height;
            } else {
                ex = Math.random() * width;
                ey = Math.random() < 0.5 ? -40 : height + 40;
            }
            
            enemies.push({
                x: ex,
                y: ey,
                size: 30,
                speed: 1.5 + (score * 0.05), // Get faster
                flash: 0, // For hit effect
                stompOffset: Math.random() * Math.PI * 2
            });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 20,
                    color: color,
                    size: Math.random() * 6 + 2
                });
            }
        }

        function drawGrassTile(tile) {
            const base = tile.hueShift > 0.5 ? '#325f2f' : '#2a5427';
            const shade = tile.hueShift > 0.5 ? '#3e7b34' : '#457f39';
            ctx.fillStyle = base;
            ctx.fillRect(tile.x, tile.y, 51, 51);
            ctx.fillStyle = shade;
            ctx.fillRect(tile.x, tile.y, 51, 10);
            tile.blades.forEach(blade => {
                ctx.fillStyle = blade.h > 10 ? '#7af05f' : '#63cf4f';
                ctx.fillRect(tile.x + blade.ox, tile.y + blade.oy, 3, blade.h);
            });
            ctx.fillStyle = 'rgba(0,0,0,0.08)';
            ctx.fillRect(tile.x, tile.y + 41, 51, 10);
        }

        function drawSteve(ctx, x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const bob = ENABLE_ANIMATIONS ? Math.sin(player.idleBob) * 1.5 : 0;

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(-14, 14, 28, 6);

            ctx.translate(0, bob);

            // Backpack glow / heroic outline
            ctx.fillStyle = '#10251b';
            ctx.fillRect(-13, -11, 26, 30);

            // Draw Body (Hunter Vest)
            ctx.fillStyle = '#78ff68';
            ctx.fillRect(-10, -10, 20, 12);
            ctx.fillStyle = '#13341d';
            ctx.fillRect(-4, -10, 8, 12);
            
            // Draw Pants
            ctx.fillStyle = '#3c6f7f';
            ctx.fillRect(-10, 2, 20, 12);
            ctx.fillStyle = '#1c3642';
            ctx.fillRect(-10, 10, 20, 4);

            // Boots
            ctx.fillStyle = '#1a1710';
            ctx.fillRect(-10, 14, 8, 4);
            ctx.fillRect(2, 14, 8, 4);

            // Draw Head
            ctx.fillStyle = '#f0bf8b';
            ctx.fillRect(-8, -20, 16, 16);

            // Hood/Hair
            ctx.fillStyle = '#152c18';
            ctx.fillRect(-8, -20, 16, 5);

            // Eyes
            ctx.fillStyle = '#08220d';
            ctx.fillRect(-5, -13, 3, 3);
            ctx.fillRect(2, -13, 3, 3);

            // Determined mouth
            ctx.fillStyle = '#6e4a36';
            ctx.fillRect(-2, -8, 4, 2);

            // Shoulder charm
            ctx.fillStyle = '#ffe066';
            ctx.fillRect(6, -6, 3, 3);

            // Sword Swing Animation
            if (player.swinging) {
                let swingProgress = 1 - (player.swingTimer / player.swingDuration);
                let swingAngle = (swingProgress * Math.PI) - (Math.PI / 2);
                
                ctx.save();
                ctx.translate(10, -5);
                ctx.rotate(swingAngle);
                
                // Handle
                ctx.fillStyle = '#4a3020';
                ctx.fillRect(0, -2, 10, 4);
                // Guard
                ctx.fillStyle = '#b8ff7f';
                ctx.fillRect(8, -6, 4, 12);
                // Blade
                ctx.fillStyle = '#d7fff0';
                ctx.fillRect(12, -4, 24, 8);
                ctx.fillStyle = '#7affc8';
                ctx.fillRect(14, -2, 18, 4);
                // Blade outline
                ctx.strokeStyle = '#18544b';
                ctx.lineWidth = 1;
                ctx.strokeRect(12, -4, 24, 8);
                
                ctx.restore();
            } else {
                ctx.save();
                ctx.translate(10, -5);
                ctx.rotate(0);
                ctx.fillStyle = '#4a3020';
                ctx.fillRect(0, -2, 10, 4);
                ctx.fillStyle = '#d7fff0';
                ctx.fillRect(10, -3, 15, 6);
                ctx.fillStyle = '#7affc8';
                ctx.fillRect(12, -1, 10, 2);
                ctx.restore();
            }

            ctx.restore();
        }

        function drawCreeper(ctx, x, y, angle, flash, stompOffset) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const stomp = ENABLE_ANIMATIONS ? Math.sin(frameCount * 0.16 + stompOffset) * 1.5 : 0;
            ctx.translate(0, stomp);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.24)';
            ctx.fillRect(-12, 16, 24, 6);
            
            if (flash > 0) {
                ctx.fillStyle = '#FFFFFF';
                ctx.globalAlpha = 0.82;
            } else {
                ctx.fillStyle = '#59ff5f';
            }

            // Body
            ctx.fillRect(-8, -8, 16, 24);
            ctx.fillStyle = flash > 0 ? '#fff' : '#2da93c';
            ctx.fillRect(-6, -6, 12, 4);
            ctx.fillRect(-6, 2, 12, 4);
            
            // Legs
            ctx.fillStyle = flash > 0 ? '#FFF' : '#14722b';
            ctx.fillRect(-8, 10, 6, 8);
            ctx.fillRect(2, 10, 6, 8);
            ctx.fillStyle = flash > 0 ? '#FFF' : '#0f5a22';
            ctx.fillRect(-10, 8, 4, 8);
            ctx.fillRect(6, 8, 4, 8);

            // Head
            ctx.fillStyle = flash > 0 ? '#FFF' : '#6cff67';
            ctx.fillRect(-10, -20, 20, 20);
            ctx.fillStyle = flash > 0 ? '#FFF' : '#45d148';
            ctx.fillRect(-8, -18, 16, 4);

            // Face
            if (flash <= 0) {
                ctx.fillStyle = '#051405';
                ctx.fillRect(-6, -15, 4, 4);
                ctx.fillRect(2, -15, 4, 4);
                ctx.fillRect(-2, -9, 4, 6);
                ctx.fillRect(-4, -5, 2, 6);
                ctx.fillRect(2, -5, 2, 6);

                // Angry aura pixels
                ctx.fillStyle = 'rgba(185,255,128,0.45)';
                ctx.fillRect(-12, -22, 2, 2);
                ctx.fillRect(10, -22, 2, 2);
            }

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            // Update
            frameCount++;
            player.idleBob += 0.18;
            
            // Player Movement (Follow Mouse with drag)
            const dx = mouse.x - player.x;
            const dy = mouse.y - player.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 5) {
                player.angle = Math.atan2(dy, dx);
                player.x += (dx / dist) * player.speed;
                player.y += (dy / dist) * player.speed;
            }

            // Attack Logic
            if (player.swinging) {
                player.swingTimer--;
                if (player.swingTimer <= 0) {
                    player.swinging = false;
                }
            }

            // Spawn Enemies
            if (frameCount % Math.max(20, 100 - score) === 0) {
                spawnEnemy();
            }

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                // Move towards player
                const edx = player.x - e.x;
                const edy = player.y - e.y;
                const edist = Math.sqrt(edx*edx + edy*edy);
                
                e.x += (edx / edist) * e.speed;
                e.y += (edy / edist) * e.speed;
                e.angle = Math.atan2(edy, edx);

                if (e.flash > 0) e.flash--;

                // Collision with Player Body
                if (edist < 25) {
                    gameOver();
                    return;
                }

                // Collision with Sword
                if (player.swinging && edist < 60) {
                    let angleDiff = Math.abs(player.angle - Math.atan2(e.y - player.y, e.x - player.x));
                    if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                    
                    if (angleDiff < 1.0) {
                        createParticles(e.x, e.y, '#8dff64');
                        createParticles(e.x, e.y, '#0b170b');
                        enemies.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        pulseGif(hitGif, 420);
                        audio.playSFX('kill', { debounceMs: 45 });
                        if (score % 5 === 0) {
                            audio.playSFX('score', { debounceMs: 120 });
                        }
                        continue;
                    }
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Draw
            ctx.clearRect(0, 0, width, height);

            // Draw Background
            grassTiles.forEach(drawGrassTile);

            // Draw ambient rune flecks
            for (let i = 0; i < 12; i++) {
                const px = ((frameCount * (0.1 + i * 0.01)) + i * 81) % (width + 40) - 20;
                const py = (i * 57 + Math.sin(frameCount * 0.01 + i) * 30 + 80) % height;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(192,255,110,0.08)' : 'rgba(255,255,255,0.04)';
                ctx.fillRect(px, py, 3, 3);
            }

            // Draw Particles (Under entities)
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            // Draw Enemies
            enemies.forEach(e => {
                drawCreeper(ctx, e.x, e.y, e.angle + Math.PI/2, e.flash, e.stompOffset);
            });

            // Draw Player
            drawSteve(ctx, player.x, player.y, player.angle + Math.PI/2);

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            pulseGif(failGif, 1400);
            audio.playSFX('fail', { debounceMs: 200 });
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.arm();
            audio.playSFX('start', { debounceMs: 120 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            if(window.innerWidth < 768) document.getElementById('mobile-hint').classList.remove('hidden');

            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.arm();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playSFX('start', { debounceMs: 120 });
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
        
    });
    </script>
</body>
</html>
