<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Portal Stabilizer C-137</title>
<link rel="stylesheet" href="assets/fonts.googleapis.com/css2-family_Orbitron_wght_400_700_900_display_swap.css">
<style>
    :root {
        --bg-core: #031307;
        --bg-top: #0a2a1a;
        --panel-fill: rgba(4, 23, 13, 0.76);
        --panel-edge: rgba(56, 255, 66, 0.36);
        --panel-glow: rgba(151, 255, 42, 0.24);
        --signal-cyan: #4df6ff;
        --signal-cyan-soft: rgba(77, 246, 255, 0.18);
        --signal-magenta: #38ff42;
        --signal-violet: #b7ff2a;
        --warning: #ff6b39;
        --amber: #ffd24f;
        --portal-green: #38ff42;
        --portal-slime: #b7ff2a;
        --garage-blue: #4df6ff;
        --text-main: #f4fff0;
        --text-dim: #a6d7b4;
    }

    /* Reset & Base */
    * { box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        overflow: hidden; background:
            radial-gradient(circle at top, rgba(56, 255, 66, 0.22), transparent 38%),
            radial-gradient(circle at 50% 55%, rgba(183, 255, 42, 0.08), transparent 42%),
            linear-gradient(180deg, var(--bg-top) 0%, var(--bg-core) 55%, #010402 100%);
        font-family: 'Orbitron', system-ui, sans-serif;
        user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    body { color: var(--text-main); }
    canvas {
        display: block; width: 100%; height: 100%;
        touch-action: none;
    }

    /* Minimal utility layer replacing removed Tailwind CDN usage */
    .relative { position: relative; }
    .absolute { position: absolute; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .items-end { align-items: flex-end; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .group { position: relative; }
    .pointer-events-none { pointer-events: none; }
    .overflow-hidden { overflow: hidden; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .max-w-xs { max-width: 20rem; }
    .w-32 { width: 8rem; }
    .w-16 { width: 4rem; }
    .w-1 { width: 0.25rem; }
    .h-16 { height: 4rem; }
    .h-4 { height: 1rem; }
    .h-3 { height: 0.75rem; }
    .h-1 { height: 0.25rem; }
    .h-\[1px\] { height: 1px; }
    .w-\[1px\] { width: 1px; }
    .inset-0 { inset: 0; }
    .top-1\/2 { top: 50%; }
    .left-1\/2 { left: 50%; }
    .bottom-8 { bottom: 2rem; }
    .z-10 { z-index: 10; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .z-50 { z-index: 50; }
    .p-4 { padding: 1rem; }
    .px-8 { padding-left: 2rem; padding-right: 2rem; }
    .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
    .px-12 { padding-left: 3rem; padding-right: 3rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-8 { margin-top: 2rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-10 { margin-bottom: 2.5rem; }
    .mb-12 { margin-bottom: 3rem; }
    .space-y-2 > * + * { margin-top: 0.5rem; }
    .text-center { text-align: center; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
    .text-5xl { font-size: 3rem; line-height: 1; }
    .text-6xl { font-size: 3.75rem; line-height: 1; }
    .text-7xl { font-size: 4.5rem; line-height: 1; }
    .font-bold { font-weight: 700; }
    .font-black { font-weight: 900; }
    .italic { font-style: italic; }
    .uppercase { text-transform: uppercase; }
    .tracking-widest { letter-spacing: 0.25em; }
    .tracking-tighter { letter-spacing: -0.05em; }
    .tracking-\[0\.3em\] { letter-spacing: 0.3em; }
    .tracking-\[0\.5em\] { letter-spacing: 0.5em; }
    .text-transparent { color: transparent; }
    .text-white { color: #fff; }
    .text-gray-500 { color: rgb(107 114 128); }
    .text-red-300 { color: rgb(252 165 165); }
    .text-red-500 { color: rgb(239 68 68); }
    .text-fuchsia-400 { color: rgb(232 121 249); }
    .text-fuchsia-500 { color: rgb(217 70 239); }
    .text-cyan-400 { color: rgb(34 211 238); }
    .text-cyan-500 { color: rgb(6 182 212); }
    .text-yellow-400 { color: rgb(250 204 21); }
    .text-yellow-500 { color: rgb(234 179 8); }
    .bg-black { background-color: #000; }
    .bg-transparent { background-color: transparent; }
    .bg-black\/90 { background-color: rgba(0, 0, 0, 0.9); }
    .bg-red-950\/90 { background-color: rgba(69, 10, 10, 0.9); }
    .bg-red-600 { background-color: rgb(220 38 38); }
    .bg-red-500 { background-color: rgb(239 68 68); }
    .bg-gray-900 { background-color: rgb(17 24 39); }
    .bg-cyan-400 { background-color: rgb(34 211 238); }
    .bg-cyan-500\/20 { background-color: rgba(6, 182, 212, 0.2); }
    .bg-red-500\/40 { background-color: rgba(239, 68, 68, 0.4); }
    .bg-gradient-to-b { background-image: linear-gradient(to bottom, var(--grad-from), var(--grad-to)); }
    .bg-gradient-to-r { background-image: linear-gradient(to right, var(--grad-from), var(--grad-to)); }
    .from-fuchsia-400 { --grad-from: rgb(183 255 42); }
    .to-purple-800 { --grad-to: rgb(18 146 47); }
    .from-cyan-600 { --grad-from: rgb(56 255 66); }
    .to-blue-600 { --grad-to: rgb(77 246 255); }
    .border { border-width: 1px; border-style: solid; }
    .border-cyan-500\/30 { border-color: rgba(6, 182, 212, 0.3); }
    .border-red-500\/50 { border-color: rgba(239, 68, 68, 0.5); }
    .border-cyan-900 { border-color: rgb(22 78 99); }
    .border-yellow-900\/50 { border-color: rgba(113, 63, 18, 0.5); }
    .border-fuchsia-500 { border-color: rgb(217 70 239); }
    .rounded-full { border-radius: 9999px; }
    .transition-all { transition: all 0.2s ease; }
    .duration-75 { transition-duration: 75ms; }
    .duration-200 { transition-duration: 200ms; }
    .-translate-x-1\/2 { transform: translateX(-50%); }
    .-translate-y-1\/2 { transform: translateY(-50%); }
    .skew-x-\[-10deg\] { transform: skewX(-10deg); }
    .backdrop-blur-md { backdrop-filter: blur(12px); }
    .backdrop-blur-lg { backdrop-filter: blur(16px); }
    .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
    .safe-area-inset { padding-top: max(1rem, env(safe-area-inset-top)); padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right)); padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .shadow-\[0_0_10px_\#0ff\] { box-shadow: 0 0 10px #0ff; }
    .shadow-\[0_0_10px_\#f00\] { box-shadow: 0 0 10px #f00; }
    .shadow-\[0_0_20px_rgba\(220\,38\,38\,0\.6\)\] { box-shadow: 0 0 20px rgba(220,38,38,0.6); }
    .active\:scale-95:active { transform: scale(0.95); }
    .hover\:bg-red-500:hover { background-color: rgb(239 68 68); }
    .group-hover\:bg-fuchsia-500\/20 { background-color: rgba(217, 70, 239, 0.2); }
    .bg-fuchsia-500\/10 { background-color: rgba(217, 70, 239, 0.1); }

    @media (min-width: 768px) {
        .md\:text-8xl { font-size: 6rem; line-height: 1; }
    }

    /* UI Effects */
    .hud-text { text-shadow: 0 0 8px currentColor; }
    .scanline {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
        background-size: 100% 4px;
        pointer-events: none;
        opacity: 0.45;
        mix-blend-mode: screen;
    }
    .vignette {
        background:
            radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.78) 100%),
            radial-gradient(circle at 50% 10%, rgba(56, 255, 66, 0.1), transparent 40%);
        pointer-events: none;
    }
    .hud-panel {
        background: linear-gradient(180deg, rgba(15, 16, 39, 0.86), rgba(6, 8, 24, 0.72));
        border: 1px solid var(--panel-edge);
        box-shadow:
            inset 0 0 0 1px rgba(255,255,255,0.06),
            0 0 18px var(--panel-glow);
        backdrop-filter: blur(10px);
    }
    .hud-chip {
        padding: 0.45rem 0.7rem;
        border-radius: 0.9rem;
    }
    .top-stat {
        min-width: 7.5rem;
        border-radius: 1rem;
    }
    .corridor-badge {
        letter-spacing: 0.22em;
        color: var(--text-dim);
        text-shadow: 0 0 8px rgba(77, 246, 255, 0.25);
    }
    .hero-frame {
        position: relative;
        isolation: isolate;
    }
    .hero-frame::before {
        content: "";
        position: absolute;
        inset: -0.8rem;
        border-radius: 1.6rem;
        background: radial-gradient(circle, rgba(56, 255, 66, 0.24), transparent 62%);
        filter: blur(10px);
        z-index: -1;
        pointer-events: none;
    }
    .pilot-sigil {
        position: relative;
        width: 6.5rem;
        height: 6.5rem;
        margin: 0 auto 1rem;
        border-radius: 999px;
        border: 2px solid rgba(183, 255, 42, 0.65);
        background:
            radial-gradient(circle at 50% 50%, rgba(183, 255, 42, 0.95) 0 10%, rgba(183, 255, 42, 0) 12%),
            radial-gradient(circle at 50% 50%, rgba(56, 255, 66, 0.32) 0 34%, rgba(56, 255, 66, 0) 36%),
            conic-gradient(from 20deg, rgba(56, 255, 66, 0.15), rgba(183, 255, 42, 0.85), rgba(77, 246, 255, 0.35), rgba(56, 255, 66, 0.15)),
            linear-gradient(180deg, rgba(8, 39, 22, 0.94), rgba(3, 12, 6, 0.94));
        box-shadow:
            inset 0 0 30px rgba(56, 255, 66, 0.22),
            0 0 34px rgba(56, 255, 66, 0.34);
        overflow: hidden;
        animation: portal-sigil-spin 9s linear infinite;
    }
    .pilot-sigil::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 9%;
        width: 3.4rem;
        height: 2.2rem;
        transform: translateX(-50%);
        background:
            radial-gradient(circle at 18% 46%, #e9fbff 0 7%, transparent 8%),
            radial-gradient(circle at 55% 48%, #e9fbff 0 7%, transparent 8%),
            linear-gradient(135deg, transparent 0 12%, #bff7ff 13% 22%, transparent 23% 32%, #bff7ff 33% 44%, transparent 45% 54%, #bff7ff 55% 66%, transparent 67%);
        filter: drop-shadow(0 0 7px rgba(77, 246, 255, 0.9));
        clip-path: polygon(0 55%, 12% 10%, 22% 50%, 36% 0, 48% 48%, 64% 8%, 74% 54%, 90% 18%, 100% 60%, 72% 88%, 22% 88%);
        pointer-events: none;
    }
    .pilot-sigil::after {
        content: "";
        position: absolute;
        inset: 1rem;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 1.1rem;
        box-shadow: inset 0 0 14px rgba(77, 246, 255, 0.18);
        pointer-events: none;
    }
    .pilot-sigil > span {
        position: absolute;
        inset: 0;
        display: block;
        transform: rotate(0deg);
    }
    .pilot-sigil > span::before {
        content: "";
        position: absolute;
        left: 23%;
        bottom: 15%;
        width: 1.2rem;
        height: 1.2rem;
        border: 2px solid rgba(255, 210, 79, 0.9);
        border-radius: 50%;
        background: radial-gradient(circle at 50% 42%, #111 0 12%, transparent 13%), rgba(255, 210, 79, 0.12);
        box-shadow: 1.7rem 0 0 rgba(255, 210, 79, 0.14), 1.7rem 0 0 0.12rem rgba(255, 210, 79, 0.7);
        pointer-events: none;
    }
    .pilot-sigil > span::after {
        content: "";
        position: absolute;
        left: 36%;
        bottom: 12%;
        width: 2.1rem;
        height: 0.45rem;
        border-bottom: 2px solid rgba(255, 210, 79, 0.85);
        border-radius: 0 0 999px 999px;
        transform: rotate(3deg);
        pointer-events: none;
    }
    .mission-copy {
        max-width: 20rem;
        color: var(--text-dim);
        margin: 0 auto;
        line-height: 1.4;
    }
    .start-cta {
        box-shadow:
            0 0 28px rgba(56, 255, 66, 0.24),
            inset 0 0 16px rgba(183, 255, 42, 0.1);
    }
    .status-beacon {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: var(--signal-cyan);
        box-shadow: 0 0 12px var(--signal-cyan);
        animation: pulse-glow 1.8s infinite;
    }
    #reticle-h {
        height: 1px;
        background-color: rgba(6, 182, 212, 0.2);
    }
    #reticle-v {
        width: 1px;
        background-color: rgba(6, 182, 212, 0.2);
    }

    /* Typography */
    h1, h2, button, .display-font { font-family: 'Orbitron', system-ui, sans-serif; }
    .ui-font, .hud-panel, .corridor-badge, #ammoText, #scoreVal, #finalScore, .mission-copy {
        font-family: 'Orbitron', system-ui, sans-serif;
        font-weight: 400;
    }
    .feedback-overlay {
        position: absolute;
        right: max(0.75rem, env(safe-area-inset-right));
        bottom: calc(max(0.75rem, env(safe-area-inset-bottom)) + 5.5rem);
        width: min(28vw, 7rem);
        border-radius: 1rem;
        border: 1px solid rgba(77, 246, 255, 0.35);
        box-shadow: 0 0 18px rgba(248, 87, 255, 0.2);
        background: rgba(6, 8, 24, 0.78);
        backdrop-filter: blur(10px);
        opacity: 0;
        transform: translateY(0.5rem) scale(0.95);
        transition: opacity 160ms ease, transform 160ms ease;
        pointer-events: none;
    }
    .feedback-overlay.active {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }
    .feedback-overlay img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: inherit;
    }
    .feedback-caption {
        position: absolute;
        left: 0.45rem;
        right: 0.45rem;
        bottom: 0.35rem;
        padding: 0.18rem 0.35rem;
        border-radius: 999px;
        background: rgba(5, 2, 8, 0.82);
        color: #f7fbff;
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
    }

    @media (max-width: 640px) {
        .top-stat { min-width: 6.2rem; }
        .pilot-sigil {
            width: 5.2rem;
            height: 5.2rem;
            margin-bottom: 0.85rem;
        }
        .mission-copy { max-width: 17rem; font-size: 0.8rem; }
        .feedback-overlay {
            width: min(24vw, 5.25rem);
            bottom: calc(max(0.75rem, env(safe-area-inset-bottom)) + 5rem);
        }
    }

    @media (max-height: 540px) {
        .feedback-overlay { display: none; }
    }

    /* Animations */
    @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 10px #38ff42); opacity: 1; }
        50% { filter: drop-shadow(0 0 20px #b7ff2a); opacity: 0.8; }
    }
    @keyframes portal-sigil-spin {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.035); }
        100% { transform: rotate(360deg) scale(1); }
    }
    .animate-glow { animation: pulse-glow 2s infinite; }
    .animate-pulse { animation: pulse-glow 1.1s infinite; }

    .clip-path-polygon {
        clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
    }

    /* Reload Animation */
    @keyframes reload-pulse {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
    }
    .reloading-anim { animation: reload-pulse 0.5s infinite; }
</style>
</head>
<body>

<!-- GAME CONTAINER -->
<div id="game-container" class="relative w-full h-full overflow-hidden bg-black">
    <canvas id="gameCanvas"></canvas>
    
    <!-- OVERLAYS -->
    <div class="scanline absolute inset-0 z-10"></div>
    <div class="vignette absolute inset-0 z-20"></div>

    <!-- [agent-note][stage3] resolved-gif: combo+breach feedback -> catalogs/gifs.json -->
    <div id="feedback-celebrate" class="feedback-overlay z-30" aria-hidden="true">
        <img src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="">
        <span class="feedback-caption">Burst</span>
    </div>
    <div id="feedback-danger" class="feedback-overlay z-30" aria-hidden="true">
        <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="">
        <span class="feedback-caption">Breach</span>
    </div>

    <!-- HUD -->
    <div id="hud" class="absolute inset-0 z-30 pointer-events-none hidden flex flex-col justify-between p-4 safe-area-inset">
        <!-- Top Bar -->
        <div class="flex justify-between items-start w-full">
            <div class="flex flex-col hud-panel hud-chip top-stat">
                <span class="text-xs text-fuchsia-500 tracking-widest corridor-badge">DIM DATA</span>
                <span id="scoreVal" class="text-4xl font-bold text-fuchsia-400 hud-text">0</span>
            </div>
            <div class="flex flex-col items-end hud-panel hud-chip top-stat">
                <span class="text-xs text-cyan-500 tracking-widest corridor-badge">PORTAL SHIELD</span>
                <div class="w-32 h-4 bg-gray-900 border border-cyan-900 skew-x-[-10deg] mt-1 relative overflow-hidden">
                    <div id="healthBar" class="h-full bg-gradient-to-r from-cyan-600 to-blue-600 transition-all duration-200" style="width: 100%"></div>
                </div>
            </div>
        </div>
        
        <!-- Ammo / Center -->
         <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center w-full max-w-xs hud-panel hud-chip">
              <div id="reloadWarning" class="hidden text-red-500 font-bold tracking-[0.3em] text-xl mb-2 reloading-anim">RECALIBRATING</div>
              
              <div class="flex items-center justify-between w-full px-8 mb-1">
                  <span class="text-xs text-yellow-500 tracking-widest corridor-badge">PLASMA CELLS</span>
                  <span id="ammoText" class="text-xl font-bold text-yellow-400 hud-text">25/25</span>
              </div>
              <div class="w-full h-3 bg-gray-900 border border-yellow-900/50 skew-x-[-10deg] relative overflow-hidden">
                  <div id="ammoBar" class="h-full bg-yellow-500 transition-all duration-75" style="width: 100%"></div>
              </div>
         </div>

        <!-- Reticle (CSS Overlay) -->
        <div id="reticle" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 border border-cyan-500/30 rounded-full flex items-center justify-center transition-colors duration-200">
            <div id="reticle-dot" class="w-1 h-1 bg-cyan-400 rounded-full shadow-[0_0_10px_#0ff]"></div>
            <div id="reticle-h" class="absolute w-full h-[1px] bg-cyan-500/20"></div>
            <div id="reticle-v" class="absolute h-full w-[1px] bg-cyan-500/20"></div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md">
        <div class="text-center space-y-2 mb-12 hero-frame">
            <div class="pilot-sigil" aria-hidden="true"><span></span></div>
            <p class="text-cyan-500 tracking-[0.5em] text-sm uppercase">Garage portal under siege</p>
            <h1 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-fuchsia-400 to-purple-800 hud-text italic tracking-tighter">PORTAL<br>C-137</h1>
            <p class="mission-copy text-xs uppercase">Sweep Rick's stabilizer cannon, vaporize rift anomalies, and keep Morty's panic shield online.</p>
        </div>
        <div class="animate-glow">
            <button id="start-btn" class="relative group px-12 py-6 bg-transparent overflow-hidden border border-fuchsia-500 text-fuchsia-400 font-bold text-2xl tracking-widest uppercase transition-all active:scale-95 clip-path-polygon start-cta">
                <span class="absolute inset-0 w-full h-full bg-fuchsia-500/10 group-hover:bg-fuchsia-500/20 transition-all"></span>
                 <span class="relative">STABILIZE</span>
            </button>
        </div>
        <p class="mt-8 text-gray-500 text-xs tracking-widest inline-flex items-center" style="gap:0.55rem;"><span class="status-beacon" aria-hidden="true"></span>DRAG TO SWEEP THE RIFT • HOLD TO FIRE PLASMA</p>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-red-950/90 backdrop-blur-lg">
        <h2 class="text-7xl font-black text-red-500 hud-text mb-2 tracking-tighter">PORTAL<br>BREACHED</h2>
        <div class="flex flex-col items-center mb-10">
            <span class="text-red-300 text-sm tracking-widest">DIMENSION DATA</span>
            <span id="finalScore" class="text-5xl text-white font-bold">0</span>
        </div>
        <button id="restart-btn" class="px-10 py-4 bg-red-600 text-white font-bold text-xl tracking-widest uppercase shadow-[0_0_20px_rgba(220,38,38,0.6)] hover:bg-red-500 transition-all active:scale-95 clip-path-polygon">
            RETRY RUN
        </button>
    </div>
</div>

<script>
/**
 * PORTAL STABILIZER C-137
 * Drag to steer Rick's portal cannon lane, hold to auto-fire plasma,
 * and survive as long as the shield keeps the garage breach contained.
 */

// --- Audio System (Catalog-backed) ---
const AudioSys = {
    ctx: null,
    initialized: false,
    master: null,
    musicGain: null,
    sfxGain: null,
    loopOscs: [],
    buffers: {},
    lastPlayed: {},
    manifest: {
        shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',
        enemyHit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3',
        explode: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3',
        reload: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
        empty: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        damage: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3',
        lowHealth: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3',
        uiStart: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        uiRestart: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
        gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3',
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'
    },

    async init() {
        try {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.master = this.ctx.createGain();
                this.musicGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();
                this.master.gain.value = 0.82;
                this.musicGain.gain.value = 0.18;
                this.sfxGain.gain.value = 0.72;
                this.musicGain.connect(this.master);
                this.sfxGain.connect(this.master);
                this.master.connect(this.ctx.destination);
            }
            if (this.ctx.state === 'suspended') {
                await this.ctx.resume();
            }
            if (!this.initialized) {
                this.initialized = true;
                this.primeBuffers();
            }
        } catch (err) {
            console.warn('Audio init skipped', err);
        }
    },

    primeBuffers() {
        Object.entries(this.manifest).forEach(([key, url]) => {
            if (key !== 'bgm') this.loadBuffer(key, url);
        });
    },

    async loadBuffer(key, url) {
        if (!this.ctx || this.buffers[key]) return this.buffers[key];
        try {
            const mediaUrl = new URL(url, window.location.href);
            if (mediaUrl.origin !== window.location.origin) {
                // [agent-note][stage4] repair: avoid validation-origin CORS console errors for optional remote SFX; procedural audio fallback remains active.
                return null;
            }
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            const buffer = await this.ctx.decodeAudioData(arrayBuffer.slice(0));
            this.buffers[key] = buffer;
            return buffer;
        } catch (err) {
            console.warn(`Audio buffer failed: ${key}`, err);
            return null;
        }
    },

    async playBuffer(key, options = {}) {
        if (!this.ctx || !this.sfxGain) return;
        const now = performance.now();
        const cooldown = options.cooldown ?? 0;
        if (cooldown && this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
        this.lastPlayed[key] = now;
        const buffer = await this.loadBuffer(key, this.manifest[key]);
        if (!buffer) return;
        try {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = buffer;
            gain.gain.value = options.volume ?? 1;
            source.connect(gain);
            gain.connect(this.sfxGain);
            source.start();
        } catch (err) {
            console.warn(`Audio play failed: ${key}`, err);
        }
    },

    ensureFallbackLoop() {
        if (!this.ctx || this.loopOscs.length) return;
        [92, 138, 184].forEach((freq, index) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = index === 0 ? 'sine' : 'triangle';
            osc.frequency.value = freq;
            gain.gain.value = index === 0 ? 0.018 : 0.01;
            osc.connect(gain);
            gain.connect(this.musicGain);
            osc.start();
            this.loopOscs.push({ osc, gain });
        });
    },

    async startMusic() {
        await this.init();
        if (!this.ctx || !this.musicGain) return;
        this.ensureFallbackLoop();
        this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.musicGain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.25);
    },

    pauseMusic() {
        if (!this.ctx || !this.musicGain) return;
        this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.musicGain.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + 0.12);
    },

    playShoot() {
        this.playBuffer('shoot', { volume: 0.35, cooldown: 70 });
    },

    playHit() {
        this.playBuffer('damage', { volume: 0.52, cooldown: 180 });
    },

    playExplode() {
        this.playBuffer('explode', { volume: 0.55, cooldown: 90 });
    },

    playReload() {
        this.playBuffer('reload', { volume: 0.3, cooldown: 300 });
    },

    playEmpty() {
        this.playBuffer('empty', { volume: 0.3, cooldown: 220 });
    },

    playEnemyHit() {
        this.playBuffer('enemyHit', { volume: 0.4, cooldown: 80 });
    },

    playLowHealth() {
        this.playBuffer('lowHealth', { volume: 0.26, cooldown: 1500 });
    },

    playUIStart() {
        this.playBuffer('uiStart', { volume: 0.36, cooldown: 250 });
    },

    playUIRestart() {
        this.playBuffer('uiRestart', { volume: 0.34, cooldown: 250 });
    },

    playGameOver() {
        this.playBuffer('gameOver', { volume: 0.42, cooldown: 500 });
    }
};

// --- Game Engine ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Constants
const FOV = 320;
const BULLET_SPEED = 500;
const ENEMY_SPEED_BASE = 30;
const SPAWN_DEPTH = 3000;
const HIT_RADIUS_SQ = 12000; 
const FLOOR_Y = 500; 
const MAX_AMMO = 25;
const RELOAD_TIME = 1.5; 

// State
let width, height, cx, cy;
let animationId;
let lastTime = 0;
let shake = 0;
let timeAccumulator = 0;
let feedbackTimer = 0;
let dangerTimer = 0;

const state = {
    screen: 'start',
    score: 0,
    health: 100,
    frame: 0,
    difficulty: 1,
    gunRecoil: 0,
    gunCharge: 0,
    ammo: MAX_AMMO,
    isReloading: false,
    reloadTimer: 0,
    noFireTimer: 0,
    streak: 0
};

const input = {
    x: 0, y: 0,
    isDown: false,
    lastTouchX: 0,
    lastTouchY: 0
};

const entities = {
    enemies: [],
    bullets: [],
    particles: []
};

// Player (Camera + Gun State)
const player = {
    x: 0, y: 0, 
    tiltX: 0,
    tiltY: 0,
    swayX: 0, 
    swayY: 0
};

// --- Core Functions ---

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cx = width / 2;
    cy = height / 2;
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Touch Handlers
    const handleStart = (e) => {
        e.preventDefault();
        input.isDown = true;
        const t = e.touches ? e.touches[0] : e;
        input.lastTouchX = t.clientX;
        input.lastTouchY = t.clientY;
        if (state.screen === 'playing') AudioSys.init();
    };
    
    const handleMove = (e) => {
        e.preventDefault();
        if (!input.isDown) return;
        const t = e.touches ? e.touches[0] : e;
        
        const dx = t.clientX - input.lastTouchX;
        const dy = t.clientY - input.lastTouchY;
        
        // Move player
        const sensitivity = 3.0;
        player.x += dx * sensitivity;
        player.y += dy * sensitivity;
        
        // Clamp player bounds
        const limitX = width * 2.5;
        const limitY = height * 1.5;
        player.x = Math.max(-limitX, Math.min(limitX, player.x));
        player.y = Math.max(-limitY, Math.min(limitY, player.y));
        
        // Visual Tilt
        player.tiltX = dx;
        player.tiltY = dy;
        
        input.lastTouchX = t.clientX;
        input.lastTouchY = t.clientY;
    };
    
    const handleEnd = (e) => {
        e.preventDefault();
        input.isDown = false;
        player.tiltX = 0;
        player.tiltY = 0;
    };

    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleEnd, {passive: false});
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    requestAnimationFrame(loop);
}

function setFeedbackVisible(id, active) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active', active);
}

function triggerCelebrationFeedback() {
    feedbackTimer = 1.15;
    setFeedbackVisible('feedback-celebrate', true);
}

function triggerDangerFeedback() {
    dangerTimer = 1.4;
    setFeedbackVisible('feedback-danger', true);
}

function resetGame() {
    state.score = 0;
    state.health = 100;
    state.difficulty = 1;
    state.frame = 0;
    state.gunRecoil = 0;
    state.gunCharge = 0;
    state.ammo = MAX_AMMO;
    state.isReloading = false;
    state.reloadTimer = 0;
    state.noFireTimer = 0;
    state.streak = 0;
    feedbackTimer = 0;
    dangerTimer = 0;
    setFeedbackVisible('feedback-celebrate', false);
    setFeedbackVisible('feedback-danger', false);

    player.x = 0;
    player.y = 0;
    player.swayX = 0;
    player.swayY = 0;
    timeAccumulator = 0;
    
    entities.enemies = [];
    entities.bullets = [];
    entities.particles = [];
    
    updateHUD();
    document.getElementById('hud').classList.remove('hidden');
}

function updateHUD() {
    // Score & Health
    document.getElementById('scoreVal').innerText = Math.floor(state.score);
    document.getElementById('healthBar').style.width = Math.max(0, state.health) + '%';
    
    const bar = document.getElementById('healthBar');
    if (state.health < 30) {
        bar.className = "h-full bg-red-600 animate-pulse";
    } else {
        bar.className = "h-full bg-gradient-to-r from-cyan-600 to-blue-600 transition-all duration-200";
    }

    // Ammo
    document.getElementById('ammoText').innerText = `${Math.floor(state.ammo)}/${MAX_AMMO}`;
    const ammoPct = (state.ammo / MAX_AMMO) * 100;
    document.getElementById('ammoBar').style.width = ammoPct + '%';
    
    const warning = document.getElementById('reloadWarning');
    const reticle = document.getElementById('reticle');
    const retDot = document.getElementById('reticle-dot');
    const retH = document.getElementById('reticle-h');
    const retV = document.getElementById('reticle-v');

    if (state.isReloading) {
        warning.classList.remove('hidden');
        reticle.classList.add('border-red-500/50');
        reticle.classList.remove('border-cyan-500/30');
        retDot.className = "w-1 h-1 bg-red-500 rounded-full shadow-[0_0_10px_#f00]";
        retH.className = "absolute w-full h-[1px] bg-red-500/40";
        retV.className = "absolute h-full w-[1px] bg-red-500/40";
    } else {
        warning.classList.add('hidden');
        reticle.classList.remove('border-red-500/50');
        reticle.classList.add('border-cyan-500/30');
        retDot.className = "w-1 h-1 bg-cyan-400 rounded-full shadow-[0_0_10px_#0ff]";
        retH.className = "absolute w-full h-[1px] bg-cyan-500/20";
        retV.className = "absolute h-full w-[1px] bg-cyan-500/20";
    }
}

// 3D Projection
function project(x, y, z) {
    const effX = x - player.x;
    const effY = y - player.y;
    
    const safeZ = Math.max(10, z);
    const scale = FOV / safeZ;
    
    return {
        x: cx + effX * scale,
        y: cy + effY * scale,
        scale: scale,
        visible: z > 10
    };
}

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 300 + Math.random() * 800; 
    
    // Determine anomaly type based on random chance and difficulty.
    // 'hunter' mutants seek the player. 'drone' portal mites drift straight in.
    const hunterChance = Math.min(0.6, 0.1 + state.difficulty * 0.05);
    const isHunter = Math.random() < hunterChance;
    
    entities.enemies.push({
        type: isHunter ? 'hunter' : 'drone',
        x: player.x + Math.cos(angle) * radius,
        y: player.y + Math.sin(angle) * radius,
        z: SPAWN_DEPTH,
        hp: (1 + Math.floor(state.difficulty / 5)) * (isHunter ? 0.7 : 1), // Hunters have slightly less HP
        color: isHunter ? '#ff7b2f' : '#38ff42', // Orange tracking mutant vs green portal mite
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * (isHunter ? 4 : 2)
    });
}

function createExplosion(x, y, z, color, count=10) {
    for(let i=0; i<count; i++) {
        entities.particles.push({
            x: x, y: y, z: z,
            vx: (Math.random() - 0.5) * 150,
            vy: (Math.random() - 0.5) * 150,
            vz: (Math.random() - 0.5) * 150,
            life: 1.0,
            color: color
        });
    }
}

function update(dt) {
    if (state.screen !== 'playing') return;
    
    state.frame++;
    state.difficulty += dt * 0.1;
    shake *= 0.9;
    timeAccumulator += dt;
    feedbackTimer = Math.max(0, feedbackTimer - dt);
    dangerTimer = Math.max(0, dangerTimer - dt);
    if (!feedbackTimer) setFeedbackVisible('feedback-celebrate', false);
    if (!dangerTimer) setFeedbackVisible('feedback-danger', false);

    // Gun Physics
    player.swayX += (player.tiltX - player.swayX) * 5 * dt;
    player.swayY += (player.tiltY - player.swayY) * 5 * dt;
    state.gunRecoil = Math.max(0, state.gunRecoil - dt * 150); 
    state.gunCharge = Math.min(1, state.gunCharge + dt * 2);

    // --- Reload Logic ---
    if (state.isReloading) {
        state.reloadTimer -= dt;
        if (state.reloadTimer <= 0) {
            state.isReloading = false;
            state.ammo = MAX_AMMO;
            AudioSys.playReload();
            updateHUD();
        }
    } else {
        // Passive Reload if not firing
        if (!input.isDown && state.ammo < MAX_AMMO) {
            state.noFireTimer += dt;
            if (state.noFireTimer > 1.0) { 
                state.ammo = Math.min(MAX_AMMO, state.ammo + dt * 15);
                updateHUD();
            }
        } else {
            state.noFireTimer = 0;
        }
    }

    // --- Shooting ---
    const FIRE_RATE = 8; 
    if (input.isDown && state.frame % FIRE_RATE === 0) {
        if (state.isReloading) {
            AudioSys.playEmpty();
        } else if (state.ammo > 0) {
            entities.bullets.push({
                x: player.x,
                y: player.y + 20, 
                z: 80,
                vz: BULLET_SPEED
            });
            AudioSys.playShoot();
            shake += 0.8;
            state.gunRecoil = 30; 
            state.gunCharge = 0.5; 
            state.ammo--;
            
            if (state.ammo <= 0) {
                state.isReloading = true;
                state.reloadTimer = RELOAD_TIME;
                AudioSys.playReload();
            }
            updateHUD();
        } else {
            state.isReloading = true;
            state.reloadTimer = RELOAD_TIME;
        }
    }

    // --- Spawning ---
    if (Math.random() < 0.04 + (state.difficulty * 0.003)) {
        spawnEnemy();
    }

    // --- Enemies ---
    const enemySpeed = ENEMY_SPEED_BASE + (state.difficulty * 3);
    for (let i = entities.enemies.length - 1; i >= 0; i--) {
        let e = entities.enemies[i];
        
        // Move Forward
        e.z -= enemySpeed;
        e.rot += e.rotSpeed * dt;

        // Hunter Logic: Seek Player
        if (e.type === 'hunter') {
            // Lerp towards player position to create "coming towards you" effect
            // We use a factor that makes them track but allows dodging at the last second
            const trackSpeed = 2.0 * dt;
            e.x += (player.x - e.x) * trackSpeed;
            e.y += (player.y - e.y) * trackSpeed;
        }

        // Collision with Player
        if (e.z < 50) {
            const p = project(e.x, e.y, e.z);
            const dx = p.x - cx;
            const dy = p.y - cy;
            
            // Check if visually overlapping center
            if (Math.abs(dx) < cx && Math.abs(dy) < cy) {
                state.health -= 20;
                shake += 25;
                state.streak = 0;
                AudioSys.playHit();
                triggerDangerFeedback();
                if (state.health > 0 && state.health <= 35) {
                    AudioSys.playLowHealth();
                }
                updateHUD();
                if (state.health <= 0) gameOver();
            }
            entities.enemies.splice(i, 1);
            continue;
        }
    }

    // --- Bullets ---
    for (let i = entities.bullets.length - 1; i >= 0; i--) {
        let b = entities.bullets[i];
        b.z += b.vz * (dt * 60);
        
        let hit = false;
        for (let j = entities.enemies.length - 1; j >= 0; j--) {
            let e = entities.enemies[j];
            if (Math.abs(b.z - e.z) < 250) {
                const dx = b.x - e.x;
                const dy = b.y - e.y;
                if (dx*dx + dy*dy < HIT_RADIUS_SQ) {
                    hit = true;
                    e.hp--;
                    createExplosion(e.x, e.y, e.z, '#fff', 5);
                    AudioSys.playEnemyHit();
                    if (e.hp <= 0) {
                        createExplosion(e.x, e.y, e.z, e.color, 15);
                        entities.enemies.splice(j, 1);
                        state.score += 100 * state.difficulty;
                        state.streak++;
                        if (state.streak % 3 === 0) {
                            triggerCelebrationFeedback();
                        }
                        updateHUD();
                        AudioSys.playExplode();
                    }
                    break;
                }
            }
        }
        if (hit || b.z > SPAWN_DEPTH) entities.bullets.splice(i, 1);
    }

    // --- Particles ---
    for (let i = entities.particles.length - 1; i >= 0; i--) {
        let p = entities.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;
        p.life -= 0.04;
        if (p.life <= 0) entities.particles.splice(i, 1);
    }
}

function visualTier() {
    return Math.max(1, Math.min(5, Math.floor(state.difficulty / 3) + 1));
}

function drawPortalBackdrop() {
    const tier = visualTier();
    const phase = timeAccumulator * (0.48 + tier * 0.035);
    const ringX = cx - player.x * 0.018;
    const ringY = cy * 0.82 - player.y * 0.01;
    const baseRadius = Math.min(width, height) * (0.24 + tier * 0.01);

    ctx.save();

    // Far garage-void wash with subtle level-reactive color temperature.
    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    skyGrad.addColorStop(0, tier >= 4 ? '#071a24' : '#071c10');
    skyGrad.addColorStop(0.48, tier >= 3 ? '#120b22' : '#031307');
    skyGrad.addColorStop(1, '#010402');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    const voidGrad = ctx.createRadialGradient(ringX, ringY, baseRadius * 0.1, ringX, ringY, baseRadius * 2.05);
    voidGrad.addColorStop(0, tier >= 5 ? 'rgba(239, 68, 68, 0.18)' : 'rgba(56, 255, 66, 0.24)');
    voidGrad.addColorStop(0.3, 'rgba(183, 255, 42, 0.18)');
    voidGrad.addColorStop(0.62, tier >= 3 ? 'rgba(77, 246, 255, 0.1)' : 'rgba(19, 84, 32, 0.18)');
    voidGrad.addColorStop(1, 'rgba(3, 19, 7, 0)');
    ctx.fillStyle = voidGrad;
    ctx.fillRect(0, 0, width, height);

    // Authored portal stack: liquid ellipses, scanner arcs, and time-fracture ticks.
    for (let i = 0; i < 5; i++) {
        const r = baseRadius + i * 21 + Math.sin(phase * 2.2 + i) * (6 + tier);
        ctx.beginPath();
        ctx.ellipse(ringX, ringY, r * (1.18 + i * 0.055), r * (0.5 + i * 0.018), phase + i * 0.34, 0, Math.PI * 2);
        ctx.strokeStyle = i % 2 ? 'rgba(183, 255, 42, 0.22)' : 'rgba(56, 255, 66, 0.32)';
        ctx.lineWidth = Math.max(1, 4.5 - i * 0.65);
        ctx.shadowBlur = 18;
        ctx.shadowColor = tier >= 5 && i === 0 ? '#ef4444' : '#38ff42';
        ctx.stroke();

        if (tier >= 3) {
            ctx.beginPath();
            ctx.arc(ringX, ringY, r * 0.78, phase + i, phase + i + 0.45);
            ctx.strokeStyle = 'rgba(77, 246, 255, 0.18)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    ctx.shadowBlur = 0;

    // Dimension silhouettes: garage bench, C-137 alley signs, arcade tokens, citadel angles, time cracks.
    const benchY = height * 0.24;
    ctx.fillStyle = 'rgba(7, 28, 18, 0.58)';
    ctx.fillRect(width * 0.06, benchY, width * 0.2, 7);
    ctx.fillRect(width * 0.1, benchY - 42, 7, 42);
    ctx.fillRect(width * 0.2, benchY - 26, 7, 26);
    ctx.fillStyle = 'rgba(77, 246, 255, 0.18)';
    ctx.fillRect(width * 0.75, height * 0.15, width * 0.14, 5);
    ctx.fillRect(width * 0.8, height * 0.15, 4, 45);

    ctx.strokeStyle = 'rgba(77, 246, 255, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 7; i++) {
        const x = ((i * 149 + timeAccumulator * 12) % (width + 80)) - 40;
        ctx.beginPath();
        ctx.moveTo(x, height * 0.08);
        ctx.lineTo(x + 16, height * 0.08 + 8);
        ctx.lineTo(x + 8, height * 0.08 + 22);
        ctx.stroke();
    }

    if (tier >= 2) {
        ctx.fillStyle = 'rgba(183, 255, 42, 0.12)';
        for (let i = 0; i < 5; i++) {
            const x = (width * (0.18 + i * 0.14) + Math.sin(phase + i) * 8) % width;
            ctx.beginPath();
            ctx.ellipse(x, height * (0.18 + (i % 2) * 0.08), 9, 16, Math.sin(phase + i), 0, Math.PI * 2);
            ctx.fill();
        }
    }

    if (tier >= 4) {
        ctx.fillStyle = 'rgba(77, 246, 255, 0.11)';
        for (let i = 0; i < 6; i++) {
            const x = width * (0.02 + i * 0.18);
            const y = height * 0.34;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 32, y - 70 - (i % 2) * 28);
            ctx.lineTo(x + 64, y);
            ctx.closePath();
            ctx.fill();
        }
    }

    if (tier >= 5) {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.2)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            const x = width * (0.16 + i * 0.17);
            ctx.beginPath();
            ctx.moveTo(x, height * 0.09);
            ctx.lineTo(x + Math.sin(phase + i) * 26, height * 0.16);
            ctx.lineTo(x - 18, height * 0.24);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function drawFloor() {
    const gridSize = 300;
    const gridRange = 6000;
    const scrollSpeed = 800;
    const offsetZ = (timeAccumulator * scrollSpeed) % gridSize;

    // Floor Gradient
    const horizonP = project(0, FLOOR_Y, SPAWN_DEPTH);
    if (horizonP.y < height) {
        const grad = ctx.createLinearGradient(0, horizonP.y, 0, height);
        grad.addColorStop(0, 'rgba(8, 40, 18, 0)');
        grad.addColorStop(0.3, 'rgba(12, 72, 24, 0.46)');
        grad.addColorStop(1, 'rgba(4, 35, 12, 0.82)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, horizonP.y, width, height - horizonP.y);
    }

    ctx.save();
    ctx.strokeStyle = 'rgba(56, 255, 66, 0.3)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 4;
    ctx.shadowColor = '#38ff42';

    // Vertical Lines
    const startX = Math.floor((player.x - gridRange/2) / gridSize) * gridSize;
    const endX = startX + gridRange;

    ctx.beginPath();
    for (let x = startX; x <= endX; x += gridSize) {
        const p1 = project(x, FLOOR_Y, 50);
        const p2 = project(x, FLOOR_Y, SPAWN_DEPTH);
        if (p1.visible && p2.visible) {
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
        }
    }
    ctx.stroke();

    // Horizontal Lines
    ctx.beginPath();
    for (let z = 100; z < SPAWN_DEPTH; z += gridSize) {
        const currentZ = z - offsetZ;
        if (currentZ < 50) continue;
        const p1 = project(player.x - gridRange/2, FLOOR_Y, currentZ);
        const p2 = project(player.x + gridRange/2, FLOOR_Y, currentZ);
        if (p1.visible && p2.visible) {
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
        }
    }
    ctx.stroke();

    // Horizon Line
    const h1 = project(player.x - gridRange, FLOOR_Y, SPAWN_DEPTH);
    const h2 = project(player.x + gridRange, FLOOR_Y, SPAWN_DEPTH);
    if (h1.visible) {
        ctx.strokeStyle = '#b7ff2a';
        ctx.lineWidth = 1;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(0, h1.y);
        ctx.lineTo(width, h2.y);
        ctx.stroke();
    }
    ctx.restore();
}

function drawGun() {
    const gunBaseW = Math.min(width * 0.4, 240);
    const gunH = height * 0.35;
    
    const swayOffsetX = player.swayX * -2.5; 
    const swayOffsetY = player.swayY * -1.5;
    const recoilY = state.gunRecoil;
    
    const x = cx + swayOffsetX;
    const y = height + recoilY + swayOffsetY;

    ctx.save();
    ctx.translate(x, y);

    // Portal stabilizer cannon body: taped Rick-garage trapezoid, unchanged gameplay footprint.
    ctx.fillStyle = '#08140d';
    ctx.strokeStyle = state.isReloading ? '#ef4444' : '#38ff42';
    ctx.lineWidth = 4;
    
    ctx.beginPath();
    ctx.moveTo(-gunBaseW/2, 0); 
    ctx.lineTo(gunBaseW/2, 0);  
    ctx.lineTo(gunBaseW/3, -gunH); 
    ctx.lineTo(-gunBaseW/3, -gunH); 
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Tape-wrapped garage tech panels
    ctx.fillStyle = '#12351f';
    ctx.beginPath();
    ctx.moveTo(-gunBaseW/4, -gunH * 0.2);
    ctx.lineTo(gunBaseW/4, -gunH * 0.2);
    ctx.lineTo(gunBaseW/5, -gunH * 0.8);
    ctx.lineTo(-gunBaseW/5, -gunH * 0.8);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 210, 79, 0.65)';
    ctx.lineWidth = 3;
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(-gunBaseW * 0.22, -gunH * (0.3 + i * 0.16));
        ctx.lineTo(gunBaseW * 0.22, -gunH * (0.36 + i * 0.16));
        ctx.stroke();
    }

    // Rick hair crest and Morty panic gauge decals, purely decorative.
    ctx.fillStyle = 'rgba(191, 247, 255, 0.9)';
    ctx.beginPath();
    ctx.moveTo(-gunBaseW * 0.36, -gunH * 0.76);
    ctx.lineTo(-gunBaseW * 0.3, -gunH * 0.95);
    ctx.lineTo(-gunBaseW * 0.23, -gunH * 0.78);
    ctx.lineTo(-gunBaseW * 0.16, -gunH * 0.96);
    ctx.lineTo(-gunBaseW * 0.1, -gunH * 0.76);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 210, 79, 0.78)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(gunBaseW * 0.28, -gunH * 0.52, 13, Math.PI * 0.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gunBaseW * 0.22, -gunH * 0.49);
    ctx.lineTo(gunBaseW * 0.34, -gunH * 0.49);
    ctx.stroke();

    // Energy Core
    let chargeColor;
    if (state.isReloading) {
        chargeColor = `rgba(239, 68, 68, ${0.5 + Math.sin(timeAccumulator * 20) * 0.4})`;
        ctx.shadowColor = '#ef4444';
    } else {
        chargeColor = `rgba(183, 255, 42, ${0.5 + Math.sin(timeAccumulator * 10) * 0.2})`;
        ctx.shadowColor = '#b7ff2a';
    }
    
    ctx.shadowBlur = 20;
    ctx.fillStyle = chargeColor;
    
    ctx.beginPath();
    ctx.rect(-gunBaseW/8, -gunH * 0.7, gunBaseW/4, gunH * 0.5);
    ctx.fill();

    ctx.shadowBlur = 8;
    ctx.strokeStyle = state.isReloading ? '#ef4444' : '#4df6ff';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
        const yy = -gunH * (0.28 + i * 0.11);
        ctx.beginPath();
        ctx.moveTo(-gunBaseW * 0.09, yy);
        ctx.lineTo(gunBaseW * 0.09, yy);
        ctx.stroke();
    }

    // Barrel Tip
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = state.isReloading ? '#ef4444' : '#b7ff2a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -gunH, gunBaseW/3, 10, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // Coil rings around the barrel read as portal stabilizer hardware.
    ctx.strokeStyle = 'rgba(77, 246, 255, 0.48)';
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * gunBaseW * 0.13, -gunH + 2, gunBaseW * 0.06, 7, 0, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();
}

function draw() {
    // Clear
    ctx.fillStyle = '#050208'; 
    ctx.fillRect(0, 0, width, height);

    // Camera Shake
    ctx.save();
    if (shake > 0.5) {
        const sx = (Math.random() - 0.5) * shake;
        const sy = (Math.random() - 0.5) * shake;
        ctx.translate(sx, sy);
    }

    // 1. Authored portal-garage backdrop and corridor floor
    drawPortalBackdrop();
    drawFloor();

    // 2. Entities (Sorted by Z)
    const renderList = [
        ...entities.enemies.map(e => ({type: 'enemy', o: e, z: e.z})),
        ...entities.bullets.map(b => ({type: 'bullet', o: b, z: b.z})),
        ...entities.particles.map(p => ({type: 'particle', o: p, z: p.z}))
    ].sort((a, b) => b.z - a.z);

    renderList.forEach(item => {
        const o = item.o;
        const p = project(o.x, o.y, o.z);
        if (!p.visible) return;

        if (item.type === 'enemy') {
            const size = 100 * p.scale; 
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(o.rot);
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = o.color;
            ctx.strokeStyle = o.color;
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            
            // Draw Shape Based on Type
            if (o.type === 'hunter') {
                // Tracking mutant: orange citadel dart with a single surveillance eye.
                ctx.beginPath();
                ctx.moveTo(0, size/2);
                ctx.lineTo(size/2, -size/2);
                ctx.lineTo(0, -size/3.2);
                ctx.lineTo(-size/2, -size/2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 210, 79, 0.72)';
                ctx.lineWidth = Math.max(1, size * 0.035);
                ctx.beginPath();
                ctx.moveTo(-size * 0.24, -size * 0.18);
                ctx.lineTo(0, size * 0.18);
                ctx.lineTo(size * 0.24, -size * 0.18);
                ctx.stroke();

                ctx.fillStyle = '#fffbeb';
                ctx.beginPath();
                ctx.ellipse(0, -size * 0.1, size * 0.16, size * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.arc(0, -size * 0.1, size * 0.045, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Portal mite: green Meeseeks-like square with anxious face and slime tabs.
                ctx.beginPath();
                ctx.rect(-size/2, -size/2, size, size);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(183, 255, 42, 0.72)';
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.ellipse(i * size * 0.22, size * 0.54, size * 0.08, size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#eaffff';
                ctx.beginPath();
                ctx.arc(-size * 0.18, -size * 0.08, size * 0.1, 0, Math.PI * 2);
                ctx.arc(size * 0.18, -size * 0.08, size * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#031307';
                ctx.beginPath();
                ctx.arc(-size * 0.18, -size * 0.08, size * 0.035, 0, Math.PI * 2);
                ctx.arc(size * 0.18, -size * 0.08, size * 0.035, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b7ff2a';
                ctx.lineWidth = Math.max(1, size * 0.03);
                ctx.beginPath();
                ctx.moveTo(-size * 0.2, size * 0.18);
                ctx.lineTo(0, size * 0.26);
                ctx.lineTo(size * 0.2, size * 0.18);
                ctx.stroke();
            }
            
            // Glowing core keeps target category readable at distance.
            ctx.fillStyle = o.color;
            ctx.beginPath();
            ctx.arc(0, 0, size/7, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        } 
        else if (item.type === 'bullet') {
            const size = 20 * p.scale; 
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ffd24f';
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(183, 255, 42, 0.8)';
            ctx.lineWidth = Math.max(1, size * 0.2);
            ctx.beginPath();
            ctx.arc(p.x, p.y, size * 1.45, 0, Math.PI*2);
            ctx.stroke();
            ctx.restore();
        }
        else if (item.type === 'particle') {
            const size = 10 * p.scale;
            ctx.fillStyle = o.color;
            ctx.globalAlpha = o.life;
            ctx.fillRect(p.x - size/2, p.y - size/2, size, size);
            ctx.globalAlpha = 1;
        }
    });

    ctx.restore(); // End Shake

    // 3. The Gun
    ctx.save();
    if (shake > 1) {
        ctx.translate((Math.random()-0.5)*shake*0.5, (Math.random()-0.5)*shake*0.5);
    }
    drawGun();
    ctx.restore();
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    animationId = requestAnimationFrame(loop);
}

function gameOver() {
    state.screen = 'gameover';
    triggerDangerFeedback();
    AudioSys.pauseMusic();
    AudioSys.playGameOver();
    document.getElementById('finalScore').innerText = Math.floor(state.score);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

// --- DOM Events ---
document.addEventListener('DOMContentLoaded', () => {
    init();

    // Start Button
    document.getElementById('start-btn').addEventListener('click', async () => {
        document.getElementById('start-screen').classList.add('hidden');
        resetGame();
        state.screen = 'playing';
        await AudioSys.init();
        AudioSys.playUIStart();
        AudioSys.startMusic();
    });

    // Restart Button
    document.getElementById('restart-btn').addEventListener('click', async () => {
        document.getElementById('game-over-screen').classList.add('hidden');
        resetGame();
        state.screen = 'playing';
        await AudioSys.init();
        AudioSys.playUIRestart();
        AudioSys.startMusic();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            AudioSys.pauseMusic();
        } else if (state.screen === 'playing') {
            AudioSys.startMusic();
        }
    });
});
</script>
