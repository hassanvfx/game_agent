<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Midnight Courier Run</title>
    <style>
        @import url('./assets/fonts.googleapis.com/css2-family_Fredoka_wght_400_600_display_swap.css');

        :root {
            --bg: #070b17;
            --panel: rgba(13, 18, 36, 0.84);
            --panel-border: rgba(103, 232, 249, 0.26);
            --text: #ffffff;
            --muted: #9fb4d9;
            --accent: #67e8f9;
            --accent-strong: #22d3ee;
            --accent-soft: #c4b5fd;
            --danger: #fb7185;
            --success: #facc15;
            --hud-shadow: 0 12px 36px rgba(0, 0, 0, 0.52);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(34, 211, 238, 0.18), transparent 35%),
                radial-gradient(circle at bottom, rgba(244, 114, 182, 0.12), transparent 40%),
                var(--bg);
            color: var(--text);
            font-family: 'Fredoka', system-ui, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(7, 11, 23, 0.3), rgba(7, 11, 23, 0.85)),
                radial-gradient(circle at 50% 20%, rgba(34, 211, 238, 0.08), transparent 30%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(103, 232, 249, 0.06) 48%, transparent 52%, transparent 100%),
                repeating-linear-gradient(
                    180deg,
                    rgba(148, 163, 184, 0.04) 0 2px,
                    transparent 2px 8px
                );
            mix-blend-mode: screen;
            opacity: 0.55;
        }

        #game-container::after {
            inset: 1.2rem;
            border: 1px solid rgba(103, 232, 249, 0.15);
            border-radius: 1.6rem;
            box-shadow: inset 0 0 32px rgba(34, 211, 238, 0.08);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .overlay-card {
            width: min(100%, 28rem);
            margin: 1rem;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(16, 24, 48, 0.96), rgba(9, 13, 28, 0.92));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--hud-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .hidden {
            display: none !important;
        }

        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
            margin-bottom: 1rem;
            border-radius: 999px;
            background:
                radial-gradient(circle at 35% 35%, #fef08a 0 10%, transparent 11%),
                linear-gradient(145deg, #fb7185, #7c3aed);
            box-shadow: 0 0 26px rgba(192, 132, 252, 0.45), inset 0 0 18px rgba(255, 255, 255, 0.18);
        }

        .icon-badge svg {
            width: 3rem;
            height: 3rem;
            color: #fff;
        }

        .title,
        .result-title {
            margin: 0 0 0.5rem;
            font-family: 'Fredoka', system-ui, sans-serif;
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .title {
            font-size: clamp(2.4rem, 8vw, 3.5rem);
            text-shadow: 0 0 10px rgba(103, 232, 249, 0.5), 0 0 24px rgba(192, 132, 252, 0.4);
        }

        .result-title {
            font-size: clamp(2.2rem, 8vw, 3.25rem);
            color: var(--danger);
            text-shadow: 0 0 22px rgba(251, 113, 133, 0.4), 0 6px 24px rgba(0, 0, 0, 0.45);
        }

        .subtitle {
            margin: 0 0 2rem;
            color: var(--accent-soft);
            text-shadow: 0 0 12px rgba(196, 181, 253, 0.24);
            font-size: 1.05rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .control-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-key {
            padding: 0.35rem 0.65rem;
            border-radius: 0.5rem;
            background: rgba(15, 23, 42, 0.95);
            color: #e0f2fe;
            border: 1px solid rgba(103, 232, 249, 0.25);
            box-shadow: inset 0 0 12px rgba(34, 211, 238, 0.15);
            font-weight: 700;
            min-width: 3rem;
        }

        .primary-button,
        .secondary-button {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: transform 0.18s ease, filter 0.18s ease, background 0.18s ease;
        }

        .primary-button {
            color: #fff;
            background: linear-gradient(90deg, #22d3ee, #8b5cf6);
            box-shadow: 0 16px 30px rgba(34, 211, 238, 0.22);
        }

        .secondary-button {
            color: #e0f2fe;
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(103, 232, 249, 0.22);
            box-shadow: 0 16px 30px rgba(8, 15, 35, 0.35);
        }

        .primary-button:hover,
        .secondary-button:hover {
            filter: brightness(1.05);
            transform: scale(1.02);
        }

        .primary-button:active,
        .secondary-button:active {
            transform: scale(0.98);
        }

        .result-label {
            margin-bottom: 0.4rem;
            font-size: 1.15rem;
        }

        .result-score,
        .hud-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-variant-numeric: tabular-nums;
        }

        .result-score {
            margin-bottom: 2rem;
            font-size: clamp(2rem, 8vw, 3rem);
            color: var(--success);
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            pointer-events: none;
        }

        .hud-panel {
            min-width: 8.5rem;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(12, 18, 34, 0.92), rgba(8, 12, 25, 0.92));
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--hud-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .hud-label {
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .hud-value {
            margin-top: 0.35rem;
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 16px rgba(250, 204, 21, 0.35);
        }

        #wanted-stars {
            display: flex;
            gap: 0.15rem;
            margin-top: 0.35rem;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(24vw, 7rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            border: 1px solid rgba(103, 232, 249, 0.32);
            background: rgba(7, 11, 23, 0.7);
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.crash {
            left: 50%;
            right: auto;
            top: 50%;
            bottom: auto;
            width: min(42vw, 10rem);
            transform: translate(-50%, -50%) scale(0.94);
            opacity: 0;
        }

        .feedback-gif.crash.visible {
            transform: translate(-50%, -50%) scale(1);
            opacity: 0.95;
        }

        @media (max-width: 640px) {
            .overlay-card {
                padding: 1.5rem;
                border-radius: 1.25rem;
            }

            #hud {
                padding: 0.75rem;
                gap: 0.75rem;
            }

            .hud-panel {
                min-width: 0;
                flex: 1;
                padding: 0.75rem 0.85rem;
            }

            .hud-value {
                font-size: 1.2rem;
            }

            .controls-row {
                gap: 0.75rem;
                font-size: 0.82rem;
            }

            .feedback-gif {
                width: min(28vw, 5.25rem);
                right: 0.75rem;
                bottom: 0.75rem;
            }

            .feedback-gif.crash {
                width: min(50vw, 8rem);
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="start-screen" class="overlay-card">
                <div class="icon-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h1 class="title">Neon Courier</h1>
                <p class="subtitle">Drift through the midnight lanes and keep the synth cargo glowing.</p>

                <div class="controls-row">
                    <div class="control-chip"><span class="control-key">← →</span> Steer</div>
                    <div class="control-chip"><span class="control-key">Tap</span> Screen sides</div>
                </div>

                <button id="start-btn" class="primary-button">Start Route</button>
            </div>

            <div id="game-over-screen" class="overlay-card hidden">
                <h2 class="result-title">Signal Lost</h2>
                <div class="result-label">Neon drops logged</div>
                <div class="result-score"><span id="finalScore">0</span> pts</div>
                <!-- [agent-note][stage1] role: future-audio | trigger: game-over-state | intent: emphasize failed escape -->
                <button id="restart-btn" class="secondary-button">Run Again</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-panel">
                    <div class="hud-label">Deliveries</div>
                    <div class="hud-value"><span id="score">0</span> pts</div>
                </div>
                <div class="hud-panel">
                    <div class="hud-label">Pulse Alert</div>
                    <div id="wanted-stars">
                        <!-- Stars injected by JS -->
                    </div>
                </div>
            </div>

            <img
                id="pickup-gif"
                class="feedback-gif"
                src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp"
                alt="Reward pulse feedback"
                aria-hidden="true"
            >
            <!-- [agent-note][stage3] resolved-gif: pickup-feedback -> catalogs/gifs.json kart racing power up item reaction game gif -->
            <img
                id="crash-gif"
                class="feedback-gif crash"
                src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                alt="Crash impact feedback"
                aria-hidden="true"
            >
            <!-- [agent-note][stage3] resolved-gif: crash-feedback -> catalogs/gifs.json retro arcade explosion effect game animation gif -->
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3"
            }
        };
        // [agent-note][stage3] resolved-audio: loop/ui/pickup/fail -> catalogs/audios.json

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                this.gestureUnlocked = false;

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(url);
                    sample.preload = 'auto';
                    sample.volume = key === 'fail' ? 0.72 : key === 'warning' ? 0.5 : 0.62;
                    this.sfx[key] = sample;
                }
            }

            unlock() {
                if (this.gestureUnlocked) return;
                this.gestureUnlocked = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((sample) => sample.load());
            }

            playBGM() {
                this.bgm.play().catch(() => {});
            }

            stopBGM(reset = true) {
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 120) {
                const sample = this.sfx[key];
                if (!sample) return;

                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) {
                    return;
                }
                this.lastPlayedAt[key] = now;

                const clone = sample.cloneNode();
                clone.volume = sample.volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pickupGif = document.getElementById('pickup-gif');
        const crashGif = document.getElementById('crash-gif');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let speed = 5;
        let roadOffset = 0;
        let warningPlayed = false;
        let pickupGifTimer = null;
        let crashGifTimer = null;

        // Entities
        let player = { x: 0, y: 0, w: 50, h: 90, color: '#fb7185', speedX: 0 };
        let enemies = [];
        let loot = [];
        let particles = [];

        // Input
        let keys = { ArrowLeft: false, ArrowRight: false };
        let touchX = null;

        /** RESIZE HANDLER */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            if (!gameActive) {
                player.x = width / 2 - player.w / 2;
                player.y = height - 150;
            } else {
                player.y = height - 150;
                if (player.x > width) player.x = width - player.w;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        /** INPUT HANDLERS */
        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        canvas.addEventListener('touchstart', (e) => {
            touchX = e.touches[0].clientX;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        });
        canvas.addEventListener('touchend', () => {
            touchX = null;
        });

        /** 4. HELPERS */
        function drawRect(x, y, w, h, color, shadow = false) {
            ctx.fillStyle = color;
            if (shadow) {
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;
            }
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
        }

        function drawCar(car, isPlayer) {
            drawRect(car.x, car.y, car.w, car.h, car.color, true);

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(car.x + 5, car.y + 15, car.w - 10, 15);
            ctx.fillRect(car.x + 5, car.y + car.h - 20, car.w - 10, 10);

            ctx.fillStyle = isPlayer ? '#7c3aed' : '#0f3ea8';
            ctx.fillRect(car.x + 5, car.y + 30, car.w - 10, car.h - 50);

            if (isPlayer) {
                ctx.fillStyle = '#67e8f9';
                ctx.shadowColor = '#67e8f9';
                ctx.shadowBlur = 10;
                ctx.fillRect(car.x + 2, car.y, 10, 5);
                ctx.fillRect(car.x + car.w - 12, car.y, 10, 5);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#fb7185';
                ctx.fillRect(car.x + 2, car.y + car.h - 2, 10, 2);
                ctx.fillRect(car.x + car.w - 12, car.y + car.h - 2, 10, 2);
            } else {
                const blink = Math.floor(Date.now() / 100) % 2 === 0;

                ctx.fillStyle = '#111';
                ctx.fillRect(car.x + 10, car.y + 35, car.w - 20, 4);

                ctx.fillStyle = blink ? '#fb7185' : '#67e8f9';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(car.x + 15, car.y + 37, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = blink ? '#67e8f9' : '#fb7185';
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(car.x + car.w - 15, car.y + 37, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function createParticle(x, y, color) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        function setGifState(element, duration = 900) {
            if (!element) return;
            element.classList.add('visible');
            clearTimeout(element === pickupGif ? pickupGifTimer : crashGifTimer);
            const timer = setTimeout(() => element.classList.remove('visible'), duration);
            if (element === pickupGif) pickupGifTimer = timer;
            if (element === crashGif) crashGifTimer = timer;
        }

        function updateWantedLevel() {
            const starsContainer = document.getElementById('wanted-stars');
            let stars = 1;
            if (score > 500) stars = 2;
            if (score > 1500) stars = 3;
            if (score > 3000) stars = 4;
            if (score > 5000) stars = 5;

            speed = 8 + (score / 500);
            if (speed > 25) speed = 25;

            const shouldWarn = stars >= 4;
            if (shouldWarn && !warningPlayed && gameActive) {
                audio.playSFX('warning', 1200);
            }
            warningPlayed = shouldWarn;

            let html = '';
            for (let i = 0; i < 5; i++) {
                html += `<svg class="w-4 h-4 ${i < stars ? 'text-yellow-400' : 'text-gray-600'}" fill="currentColor" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
            }
            starsContainer.innerHTML = html;
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            speed = 8;
            enemies = [];
            loot = [];
            particles = [];
            warningPlayed = false;
            player.x = width / 2 - player.w / 2;
            player.y = height - 150;
            document.getElementById('score').innerText = '0';
            pickupGif.classList.remove('visible');
            crashGif.classList.remove('visible');
            updateWantedLevel();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            const skyGlow = ctx.createLinearGradient(0, 0, 0, height);
            skyGlow.addColorStop(0, '#081225');
            skyGlow.addColorStop(0.45, '#11183a');
            skyGlow.addColorStop(1, '#050811');
            ctx.fillStyle = skyGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(103, 232, 249, 0.08)';
            for (let y = -60; y < height; y += 90) {
                ctx.fillRect(0, y + (roadOffset * 0.25), width, 1);
            }

            const roadWidth = Math.min(600, width * 0.9);
            const roadX = (width - roadWidth) / 2;
            const roadGlow = ctx.createLinearGradient(roadX, 0, roadX + roadWidth, 0);
            roadGlow.addColorStop(0, '#111827');
            roadGlow.addColorStop(0.5, '#1e293b');
            roadGlow.addColorStop(1, '#111827');
            ctx.fillStyle = roadGlow;
            ctx.fillRect(roadX, 0, roadWidth, height);

            ctx.fillStyle = '#facc15';
            ctx.fillRect(roadX, 0, 5, height);
            ctx.fillRect(roadX + roadWidth - 5, 0, 5, height);

            roadOffset += speed;
            if (roadOffset > 100) roadOffset = 0;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            const lanes = 3;
            const laneWidth = roadWidth / lanes;

            for (let i = 1; i < lanes; i++) {
                let x = roadX + (laneWidth * i);
                for (let y = -100; y < height; y += 100) {
                    ctx.fillRect(x - 2, y + roadOffset, 4, 40);
                }
            }

            if (keys.ArrowLeft) player.x -= 7;
            if (keys.ArrowRight) player.x += 7;

            if (touchX !== null) {
                if (touchX < width / 2) player.x -= 7;
                else player.x += 7;
            }

            if (player.x < roadX) player.x = roadX;
            if (player.x + player.w > roadX + roadWidth) player.x = roadX + roadWidth - player.w;

            drawCar(player, true);

            if (Math.random() < 0.02 + (score * 0.00001)) {
                const lane = Math.floor(Math.random() * lanes);
                const ex = roadX + (lane * laneWidth) + (laneWidth / 2 - 25);
                enemies.push({
                    x: ex,
                    y: -150,
                    w: 50,
                    h: 90,
                    color: '#38bdf8',
                    speedOffset: (Math.random() * 2)
                });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += (speed * 0.8) + e.speedOffset;
                e.x += Math.sin(e.y * 0.01) * 0.5;

                drawCar(e, false);

                if (
                    player.x < e.x + e.w &&
                    player.x + player.w > e.x &&
                    player.y < e.y + e.h &&
                    player.y + player.h > e.y
                ) {
                    gameOver();
                }

                if (e.y > height) enemies.splice(i, 1);
            }

            if (Math.random() < 0.01) {
                const lane = Math.floor(Math.random() * lanes);
                const lx = roadX + (lane * laneWidth) + (laneWidth / 2);
                loot.push({ x: lx, y: -50, r: 15, active: true });
            }

            for (let i = loot.length - 1; i >= 0; i--) {
                let l = loot[i];
                l.y += speed;

                if (l.active) {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'white';
                    ctx.font = '700 14px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('+', l.x, l.y);

                    const closestX = Math.max(player.x, Math.min(l.x, player.x + player.w));
                    const closestY = Math.max(player.y, Math.min(l.y, player.y + player.h));
                    const dx = l.x - closestX;
                    const dy = l.y - closestY;

                    if ((dx * dx + dy * dy) < (l.r * l.r)) {
                        score += 100;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('pickup', 90);
                        audio.playSFX('bonus', 180);
                        setGifState(pickupGif, 850);
                        createParticle(l.x, l.y, '#facc15');
                        createParticle(l.x, l.y, '#fff');
                        l.active = false;
                        updateWantedLevel();
                    }
                }

                if (l.y > height) loot.splice(i, 1);
            }

            updateParticles();

            if (frameCount % 60 === 0) {
                score += 10;
                document.getElementById('score').innerText = score;
                updateWantedLevel();
            }
            frameCount++;

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 500);
            setGifState(crashGif, 1200);

            for (let i = 0; i < 20; i++) {
                createParticle(player.x + player.w / 2, player.y + player.h / 2, '#fb7185');
                createParticle(player.x + player.w / 2, player.y + player.h / 2, '#f59e0b');
            }
            updateParticles();

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', 0);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

    });
    </script>
</body>
</html>
