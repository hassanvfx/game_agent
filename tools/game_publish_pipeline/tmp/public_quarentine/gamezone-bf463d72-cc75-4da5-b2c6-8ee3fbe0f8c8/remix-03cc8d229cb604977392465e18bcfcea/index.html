<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Signal Sweep</title>
    <!-- [agent-note][stage4] preserve-font-map: catalog-approved display=Audiowide ui=Orbitron counters=Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #070814;
            --bg-mid: #111a36;
            --bg-bottom: #05060f;
            --panel-bg: linear-gradient(180deg, rgba(13, 20, 40, 0.88), rgba(9, 13, 28, 0.94));
            --panel-border: rgba(131, 242, 255, 0.3);
            --text-main: rgba(241, 250, 255, 0.97);
            --text-soft: rgba(189, 216, 244, 0.84);
            --pink: #ff79c6;
            --pink-strong: #ff4fd8;
            --purple: #8b5cf6;
            --red: #ff667a;
            --cyan: #6ef2ff;
            --cyan-strong: #1dd6ff;
            --gold: #ffd166;
            --shadow-deep: rgba(2, 8, 18, 0.72);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            background:
                radial-gradient(circle at top, rgba(44, 208, 255, 0.2), transparent 36%),
                radial-gradient(circle at bottom, rgba(255, 79, 216, 0.18), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 52%, var(--bg-bottom));
            color: var(--text-main);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(110, 242, 255, 0.06) 1px, transparent 1px),
                linear-gradient(180deg, rgba(110, 242, 255, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.8) 20%, rgba(0, 0, 0, 0.95));
            opacity: 0.45;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .font-bold { font-weight: 700; }
        .font-mono { font-family: 'Press Start 2P', monospace; }
        .rounded-full { border-radius: 999px; }

        .glass-panel {
            position: relative;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.38),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(110, 242, 255, 0.14), transparent 45%, rgba(255, 79, 216, 0.12));
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(110, 242, 255, 0.32), 0 0 22px rgba(255, 79, 216, 0.28);
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #start-screen,
        #game-over-screen {
            width: min(90vw, 540px);
            padding: 2.5rem 2rem;
            border-radius: 1.75rem;
            text-align: center;
            pointer-events: auto;
            z-index: 10;
        }

        #start-screen {
            transition: transform 0.3s ease;
        }

        #start-screen:hover {
            transform: scale(1.03);
        }

        .title-display {
            margin: 0 0 1rem;
            font-family: 'Audiowide', 'Orbitron', sans-serif;
            font-size: clamp(2.4rem, 8vw, 4.6rem);
            line-height: 0.95;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(90deg, var(--cyan), #d6d6ff 44%, var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
        }

        .subtitle {
            margin: 0 0 2rem;
            font-size: clamp(1rem, 3.6vw, 1.3rem);
            color: var(--text-soft);
            animation: pulse 1.6s infinite;
        }

        .mission-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 1rem;
            padding: 0.45rem 0.9rem;
            border: 1px solid rgba(110, 242, 255, 0.34);
            border-radius: 999px;
            background: rgba(7, 14, 26, 0.62);
            color: var(--cyan);
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(29, 214, 255, 0.12);
        }

        .mission-badge::before {
            content: "◉";
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.42);
        }

        .panel-frame {
            position: relative;
            z-index: 1;
        }

        .preview-wrap {
            margin: 0 0 1.5rem;
        }

        .preview-gif {
            width: 6.4rem;
            height: 6.4rem;
            margin: 0 auto;
            border-radius: 999px;
            border: 4px solid var(--pink-strong);
            box-shadow:
                0 0 0 6px rgba(110, 242, 255, 0.12),
                0 0 28px rgba(217, 70, 239, 0.38);
            object-fit: cover;
            background: radial-gradient(circle, rgba(110, 242, 255, 0.25), rgba(255, 79, 216, 0.18));
        }

        #feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(28vw, 120px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(110, 242, 255, 0.38);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 6;
            background: rgba(6, 12, 24, 0.68);
        }

        #feedback-gif.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .primary-btn,
        .secondary-btn {
            border: 0;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            border-radius: 999px;
            transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(90deg, var(--cyan-strong), #7c4dff 55%, var(--pink-strong));
            color: #061120;
            padding: 1rem 2.6rem;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 12px 30px rgba(29, 214, 255, 0.28);
        }

        .secondary-btn {
            background: linear-gradient(90deg, #e9f7ff, #ffd7f3);
            color: #2d1454;
            padding: 0.9rem 2.25rem;
            font-size: 0.98rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 10px 24px rgba(125, 221, 255, 0.16);
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-1px);
        }

        .primary-btn:active,
        .secondary-btn:active {
            transform: scale(0.97);
        }

        .results-title {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 7vw, 3.2rem);
            color: var(--red);
        }

        .results-copy {
            margin: 0 0 1.5rem;
            font-size: 1.1rem;
            color: var(--text-soft);
        }

        .results-score {
            margin: 0 0 2rem;
            font-size: clamp(1.2rem, 4vw, 1.9rem);
            color: white;
        }

        #hud {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 5;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.85rem;
            border: 1px solid rgba(110, 242, 255, 0.2);
            border-radius: 999px;
            background: rgba(6, 12, 24, 0.54);
            font-size: clamp(0.92rem, 3.2vw, 1.35rem);
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-ping {
            width: 0.75rem;
            height: 0.75rem;
            background: #ef4444;
            border-radius: 999px;
            animation: ping 1.4s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }

        @keyframes ping {
            0% {
                transform: scale(0.9);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            80%, 100% {
                transform: scale(1.35);
                opacity: 0.35;
                box-shadow: 0 0 0 14px rgba(239, 68, 68, 0);
            }
        }

        @media (max-width: 640px) {
            #start-screen,
            #game-over-screen {
                padding: 2rem 1.25rem;
            }

            #hud {
                top: 1rem;
                left: 1rem;
            }

            .primary-btn,
            .secondary-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: preview=phone notification alert mobile game ui gif, feedback=retro arcade explosion + gamer rage via catalogs/gifs.json -->
        <img id="feedback-gif" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.gif" alt="Signal feedback animation" aria-hidden="true">
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel text-center pointer-events-auto">
                <div class="panel-frame">
                    <div class="mission-badge">Neon sweep online</div>
                    <h1 class="title-display text-glow">Signal Sweep</h1>
                    <p class="subtitle">Tap every falling alert orb before it slips off the radar.</p>
                    <div class="preview-wrap">
                         <img src="https://i.giphy.com/TytHun5lKuMdzUYVxl.gif" alt="Animated radar alert preview" class="preview-gif">
                    </div>
                    <button id="start-btn" class="primary-btn">Begin Scan</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel text-center pointer-events-auto">
                <div class="panel-frame">
                    <h2 class="results-title text-glow">Signal Lost!</h2>
                    <p class="results-copy">One alert got through the sweep.</p>
                    <div class="results-score">Alerts Cleared: <span id="finalScore" class="font-mono" style="color: var(--pink);">0</span></div>
                    <button id="restart-btn" class="secondary-btn">Rescan</button>
                </div>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="hidden flex items-center">
                <div class="hud-ping"></div>
                <span>Cleared: <span id="score" class="font-mono" style="color: #f9a8d4;">0</span></span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            img: "https://i.giphy.com/TytHun5lKuMdzUYVxl.gif",
            gifs: {
                hit: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.gif",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.gif"
            }
        };

        // Preload Image
        const memeImg = new Image();
        memeImg.src = ASSETS.img;

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.sfx = {};
                this.lastPlayedAt = {};
                this.soundProfiles = {
                    hit: { volume: 0.5, cooldown: 70 },
                    collect: { volume: 0.45, cooldown: 90 },
                    streak: { volume: 0.55, cooldown: 180 },
                    start: { volume: 0.4, cooldown: 120 },
                    click: { volume: 0.35, cooldown: 90 },
                    fail: { volume: 0.52, cooldown: 200 }
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.enabled = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((sound) => sound.load());
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() { 
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
            }

            playSFX(key) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const profile = this.soundProfiles[key] || { volume: 0.5, cooldown: 80 };
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < profile.cooldown) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = profile.volume;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();
        const feedbackGif = document.getElementById('feedback-gif');
        let feedbackTimer = null;

        function showFeedbackGif(type) {
            if (!feedbackGif) return;
            feedbackGif.src = ASSETS.gifs[type] || ASSETS.gifs.hit;
            feedbackGif.classList.add('show');
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                feedbackGif.classList.remove('show');
            }, type === 'fail' ? 1600 : 700);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let spawnRate = 60; // Frames between spawns
        let gameSpeed = 3;
        
        // Entities
        let notes = [];
        let particles = [];
        let waveOffset = 0;

        // Resize Handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. CLASSES */
        class Note {
            constructor() {
                this.radius = 40;
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = -this.radius;
                this.speed = gameSpeed + Math.random() * 2;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
                this.markedForDeletion = false;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotSpeed;
                if (this.y - this.radius > height) {
                    return 'miss';
                }
                return 'active';
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff4fd8';

                // Core signal orb
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = '#0f1630';
                ctx.fill();
                ctx.clip();

                // Draw Image or Fallback
                if (memeImg.complete && memeImg.naturalWidth > 0) {
                    ctx.drawImage(memeImg, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
                } else {
                    const orbGradient = ctx.createRadialGradient(-10, -12, 6, 0, 0, this.radius);
                    orbGradient.addColorStop(0, '#f4fbff');
                    orbGradient.addColorStop(0.36, '#6ef2ff');
                    orbGradient.addColorStop(0.76, '#8b5cf6');
                    orbGradient.addColorStop(1, '#26133d');
                    ctx.fillStyle = orbGradient;
                    ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                }

                ctx.restore();
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Border ring + scan details
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(110, 242, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius - 8, Math.PI * 0.25, Math.PI * 1.6);
                ctx.stroke();

                ctx.fillStyle = '#ffd166';
                ctx.beginPath();
                ctx.arc(this.radius * 0.32, -this.radius * 0.26, this.radius * 0.12, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.color = color;
                this.size = Math.random() * 5 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
                this.size *= 0.95;
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        /** 5. INPUT HANDLING */
        function handleInput(e) {
            if (!gameActive) return;
            
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            let hit = false;

            // Iterate backwards to hit top-most alerts first
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                const dx = clickX - note.x;
                const dy = clickY - note.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // Hit detection with a bit of leniency (radius + 20)
                if (dist < note.radius + 20) {
                    // Success
                    score += 10;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('hit');
                    audio.playSFX('collect');
                    if (score % 50 === 0) {
                        audio.playSFX('streak');
                    }
                    showFeedbackGif('hit');
                    
                    // Spawn particles
                    for(let j=0; j<8; j++) {
                        particles.push(new Particle(note.x, note.y, '#f0abfc'));
                    }
                    
                    notes.splice(i, 1);
                    hit = true;
                    
                    // Increase difficulty
                    if (score % 50 === 0) {
                        gameSpeed += 0.5;
                        spawnRate = Math.max(20, spawnRate - 5);
                    }
                    break;
                }
            }
        }

        canvas.addEventListener('pointerdown', handleInput);

        /** 6. VISUAL EFFECTS */
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#070814');
            grad.addColorStop(0.45, '#111a36');
            grad.addColorStop(1, '#05060f');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const halo = ctx.createRadialGradient(width * 0.5, height * 0.22, 30, width * 0.5, height * 0.22, width * 0.55);
            halo.addColorStop(0, 'rgba(110, 242, 255, 0.18)');
            halo.addColorStop(0.4, 'rgba(110, 242, 255, 0.07)');
            halo.addColorStop(1, 'rgba(110, 242, 255, 0)');
            ctx.fillStyle = halo;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.strokeStyle = 'rgba(110, 242, 255, 0.1)';
            ctx.lineWidth = 1.5;
            
            for (let j = 0; j < 3; j++) {
                ctx.beginPath();
                for (let i = 0; i <= width; i += 20) {
                    const y = height / 2 + Math.sin(i * 0.01 + waveOffset + j) * 100 + (j * 50);
                    if (i === 0) ctx.moveTo(i, y);
                    else ctx.lineTo(i, y);
                }
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 79, 216, 0.08)';
            for (let x = 0; x <= width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            waveOffset += 0.02;
            ctx.restore();
        }

        /** 7. GAME LOOP */
        function initGame() {
            score = 0;
            notes = [];
            particles = [];
            gameSpeed = 3;
            spawnRate = 60;
            frameCount = 0;
            document.getElementById('score').innerText = score;
        }

        function gameLoop() {
            if (!gameActive) return;
            
            ctx.clearRect(0, 0, width, height);
            drawBackground();

            frameCount++;
            if (frameCount % spawnRate === 0) {
                notes.push(new Note());
            }

            for (let i = notes.length - 1; i >= 0; i--) {
                const status = notes[i].update();
                if (status === 'miss') {
                    gameOver();
                    return;
                }
                notes[i].draw(ctx);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedbackGif('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 8. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click');
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
