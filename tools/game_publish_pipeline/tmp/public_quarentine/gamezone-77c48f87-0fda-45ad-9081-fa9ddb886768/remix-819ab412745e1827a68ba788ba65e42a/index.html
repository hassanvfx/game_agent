<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hamster Hero: The Great Escape</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>

            --bg-night: #16091f;
            --bg-deep: #26103f;
            --panel: rgba(30, 14, 54, 0.72);
            --panel-border: rgba(255, 214, 92, 0.6);
            --text-main: #fff8ec;
            --text-soft: #ffd4f2;
            --glow-gold: #ffd65c;
            --glow-pink: #ff63b8;

            --boss-red: #ff5252;
        }

        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .z-50 { z-index: 50; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }

        .h-full { height: 100%; }

            top: auto;
            bottom: 1rem;

        .text-2xl { font-size: 2rem; line-height: 1.2; }

        .h-4 { height: 1rem; }
        .bg-gray-700 { background: rgba(45, 17, 63, 0.8); }
        .bg-red-500 { background: linear-gradient(90deg, #ff7b56, #ff4e88); }
        .rounded-full { border-radius: 9999px; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-white { border-color: rgba(255, 255, 255, 0.85); }
        .drop-shadow-md { filter: drop-shadow(0 4px 4px rgba(0,0,0,0.45)); }
        .animate-pulse { animation: pulse 1.8s ease-in-out infinite; }
        .animate-fade-in { animation: fadeIn 0.35s ease-out; }
        #game-container {
            touch-action: none;
        }
        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 214, 92, 0.16), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(116, 247, 255, 0.16), transparent 22%),

        #ui-layer { pointer-events: none; }
        .interactive { pointer-events: auto; max-width: min(90vw, 34rem); }
        #start-screen::before,
        #game-over-screen::before {
            content: "★";

            font-size: 1.25rem;

        #hud .hud-text {
            padding: 0.45rem 0.8rem;
            border-radius: 999px;

            box-shadow: 0 0 18px rgba(116, 247, 255, 0.14);
        }
        #boss-hp-bar {
            box-shadow: 0 0 18px rgba(255, 82, 82, 0.22);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }

        @media (max-width: 640px) {
            .p-8 { padding: 1.5rem; }
            .btn { font-size: 16px; padding: 12px 24px; }

<script>
/**
 * §2 Technical Contract Implementation
 */

const AUDIO_CATALOG = {
    bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
    jump: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3',
    land: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',
    warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3',
    hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3',
    projectile: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3',
    win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3',
    gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3'
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = document.getElementById('bgm_main');
        this.sfxMap = {
            win: document.getElementById('sfx_win'),
            hit: document.getElementById('sfx_hit')
        };
        this.lastPlayedAt = new Map();
        this.initialized = false;
        this.muted = false;
    }

    init() {
        if (this.initialized) {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            return;
        }
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.initialized = true;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
        } catch (e) {
            console.warn('AudioContext not supported');
        }
    }

    registerNode(key, node) {
        if (node) {
            this.sfxMap[key] = node;
        }
    }

    createOneShot(key, src, volume = 0.75) {
        const node = new Audio(src);
        node.preload = 'auto';
        node.dataset.sfxKey = key;
        node.volume = volume;
        this.registerNode(key, node);
        return node;
    }

    playBgm() {
        if (!this.bgmNode || this.muted) return;
        this.bgmNode.volume = 0.2;
        this.bgmNode.play().catch(() => {});
    }

    stopBgm() {
        if (this.bgmNode) {
            this.bgmNode.pause();
            this.bgmNode.currentTime = 0;
        }
    }

    playSfx(key) {
        if (this.muted) return;
        const now = performance.now();
        const lastTime = this.lastPlayedAt.get(key) || 0;
        if (now - lastTime < 90) return;
        this.lastPlayedAt.set(key, now);

        const source = this.sfxMap[key];
        if (source) {
            const sound = source.cloneNode();
            sound.volume = source.volume ?? 0.75;
            sound.play().catch(() => this.synthesize(key));
        } else {
            this.synthesize(key);
        }
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'land') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
        } else if (type === 'projectile' || type === 'warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(type === 'warning' ? 540 : 260, now);
            osc.frequency.exponentialRampToValueAtTime(type === 'warning' ? 320 : 190, now + 0.12);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        }
    }
}

// --- Game Engine ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audioSys = new AudioManager();
const celebrationGif = document.getElementById('celebration-gif');
const failGif = document.getElementById('fail-gif');
let lastLandingFrame = -100;
let activeGifTimer = null;

audioSys.createOneShot('start', AUDIO_CATALOG.start, 0.7);
audioSys.createOneShot('jump', AUDIO_CATALOG.jump, 0.6);
audioSys.createOneShot('land', AUDIO_CATALOG.land, 0.42);
audioSys.createOneShot('warning', AUDIO_CATALOG.warning, 0.58);
audioSys.createOneShot('projectile', AUDIO_CATALOG.projectile, 0.5);
audioSys.createOneShot('gameOver', AUDIO_CATALOG.gameOver, 0.72);

// Config
let gameConfig = {
    heroSpeed: 6,
    jumpForce: 16,
    gravity: 0.8,
    themeColor: "#87CEEB"
};

// Editor Protocol
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => {
    window.gameConfig[k] = window.gameConfigDefs[k].value;
});
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'themeColor') {
            // Background color updates next frame
        }
    }
};

// State
let gameState = 'START'; // START, PLAY, BOSS, GAMEOVER, WIN
let frames = 0;
let score = 0;
let cameraX = 0;
let shake = 0;

// Entities
const player = {
    x: 100,
    y: 200,
    w: 50,
    h: 50,
    vx: 0,
    vy: 0,
    grounded: false,
    jumps: 0,
    angle: 0,
    scaleY: 1
};

let platforms = [];
let particles = [];
let enemies = [];
let boss = null;
let projectiles = [];

    // Assets
    const playerImg = document.getElementById('asset_player');

    function drawRoundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius, color, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        const step = Math.PI / spikes;
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
    }

// --- Core Systems ---

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initGame() {
    score = 0;
    cameraX = 0;
    player.x = 100;
    player.y = 200;
    player.vy = 0;
    player.vx = window.gameConfig.heroSpeed;
    
    platforms = [];
    enemies = [];
    particles = [];
    projectiles = [];
    boss = null;
    
    // Initial floor
    platforms.push({ x: 0, y: window.innerHeight - 100, w: window.innerWidth * 2, h: 100 });
    
    generateWorld(0, 2000);
    
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('score').innerText = '0';
    document.getElementById('boss-hp-bar').classList.add('hidden');
}

function generateWorld(startX, endX) {
    let x = startX + 600;
    while (x < endX) {
        const gap = 150 + Math.random() * 100;
        const w = 200 + Math.random() * 300;
        const h = 50;
        const y = window.innerHeight - 150 - Math.random() * 200;
        
        platforms.push({ x, y, w, h });
        
        // Add enemy
        if (Math.random() > 0.5) {
            enemies.push({
                x: x + w/2,
                y: y - 40,
                w: 40,
                h: 40,
                type: Math.random() > 0.5 ? 'spike' : 'walker',
                patrolStart: x,
                patrolEnd: x + w,
                dir: 1
            });
        }
        
        x += w + gap;
    }
}

function showFeedbackGif(kind, duration = 1500) {
    const target = kind === 'fail' ? failGif : celebrationGif;
    const other = kind === 'fail' ? celebrationGif : failGif;
    if (!target) return;
    other?.classList.remove('is-visible');
    target.classList.add('is-visible');
    clearTimeout(activeGifTimer);
    activeGifTimer = setTimeout(() => {
        target.classList.remove('is-visible');
    }, duration);
}

function spawnParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color
        });
    }
}

function checkCollision(r1, r2) {
    return r1.x < r2.x + r2.w &&
           r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h &&
           r1.y + r1.h > r2.y;
}

// --- Logic Loop ---

function update(dt) {
    if (gameState !== 'PLAY' && gameState !== 'BOSS') return;

    frames++;
    
    // Screen Shake Decay
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    // Player Physics
    player.vy += window.gameConfig.gravity;
    player.y += player.vy;
    player.x += player.vx;
    
    // Squash & Stretch Recovery
    player.scaleY += (1 - player.scaleY) * 0.1;

    // Ground Collision
    player.grounded = false;
    // Check platforms
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            // Landing
            if (player.y + player.h >= p.y && player.y + player.h <= p.y + player.vy + 10 && player.vy >= 0) {
                player.grounded = true;
                player.y = p.y - player.h;
                player.vy = 0;
                player.jumps = 0;
                player.scaleY = 0.8; // Squash on land
                if (frames - lastLandingFrame > 18) {
                    audioSys.playSfx('land');
                    lastLandingFrame = frames;
                }
                spawnParticles(player.x + player.w/2, player.y + player.h, '#fff', 2);
            }
        }
    }

    // Death Check
    if (player.y > window.innerHeight + 100) {
        die();
    }

    // Camera
    cameraX = player.x - 100;

    // World Gen
    const forwardGen = cameraX + window.innerWidth * 1.5;
    const lastP = platforms[platforms.length - 1];
    
    if (gameState === 'PLAY') {
        if (lastP.x < forwardGen) {
            generateWorld(lastP.x, forwardGen + 1000);
        }
        
        // Boss Trigger
        if (score > 2000 && !boss) {
            gameState = 'BOSS';
            initBoss();
        }
    } else if (gameState === 'BOSS') {
        // Ensure floor exists for boss fight
        if (lastP.x < cameraX + window.innerWidth * 2) {
             platforms.push({ 
                 x: lastP.x + lastP.w + 100, 
                 y: window.innerHeight - 150, 
                 w: 1000, 
                 h: 50 
             });
        }
        updateBoss();
    }

    // Enemies
    enemies.forEach(e => {
        if (e.type === 'walker') {
            e.x += e.dir * 2;
            if (e.x > e.patrolEnd || e.x < e.patrolStart) e.dir *= -1;
        }
        
        // Collision
        if (checkCollision(player, e)) {
            die();
        }
    });

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (checkCollision(player, p)) die();
        if (p.x < cameraX - 100) projectiles.splice(i, 1);
    }

    // Score
    score = Math.floor(player.x / 10);
    document.getElementById('score').innerText = score;
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function initBoss() {
    boss = {
        x: cameraX + window.innerWidth + 200,
        y: window.innerHeight / 2 - 100,
        w: 150,
        h: 150,
        hp: 100,
        maxHp: 100,
        state: 'idle',
        timer: 0
    };
    document.getElementById('boss-hp-bar').classList.remove('hidden');
    audioSys.playSfx('warning');
    showFeedbackGif('celebrate', 1100);
}

function updateBoss() {
    if (!boss) return;
    
    // Boss floats to right side of screen
    const targetX = cameraX + window.innerWidth - 250;
    boss.x += (targetX - boss.x) * 0.05;
    boss.y = window.innerHeight/2 - 100 + Math.sin(frames * 0.05) * 50;
    
    boss.timer++;
    
    if (boss.timer % 120 === 0) {
        // Shoot
        projectiles.push({
            x: boss.x,
            y: boss.y + boss.h/2,
            w: 30,
            h: 30,
            vx: -8,
            vy: 0,
            color: 'red'
        });
        audioSys.playSfx('projectile');
    }
    
    // Boss takes damage automatically over time (survival mode) 
    // OR player has to collect items? Let's make it survival for simplicity + visual feedback
    if (frames % 10 === 0) {
        boss.hp -= 1; // Survive for ~16 seconds
        document.getElementById('boss-hp-fill').style.width = (boss.hp / boss.maxHp * 100) + '%';
        
        if (boss.hp <= 0) {
            winGame();
        }
    }
}

function die() {
    gameState = 'GAMEOVER';
    shake = 20;
    audioSys.playSfx('gameOver');
    audioSys.stopBgm();
    showFeedbackGif('fail', 2200);
    document.getElementById('finalScore').innerText = score;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('go-title').innerText = "CAUGHT!";
}

function winGame() {
    gameState = 'WIN';
    shake = 0;
    audioSys.playSfx('win');
    audioSys.stopBgm();
    showFeedbackGif('celebrate', 2600);
    document.getElementById('finalScore').innerText = score + " (VACUUM OUTRUN!)";
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('go-title').innerText = "YOU ESCAPED!";
    document.getElementById('hud').classList.add('hidden');
    
    // Confetti
    for(let i=0; i<100; i++) {
        spawnParticles(cameraX + window.innerWidth/2, window.innerHeight/2, `hsl(${Math.random()*360}, 100%, 50%)`, 1);
    }
}

// --- Rendering ---

function draw() {
    // Clear
    const skyGrad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    skyGrad.addColorStop(0, '#2c1254');
    skyGrad.addColorStop(0.55, window.gameConfig.themeColor);
    skyGrad.addColorStop(1, '#100617');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // Camera Shake
    const dx = (Math.random() - 0.5) * shake;
    const dy = (Math.random() - 0.5) * shake;
    ctx.translate(-cameraX + dx, dy);

    // Parallax Background
    const moonX = cameraX + window.innerWidth * 0.78;
    const moonY = 110;
    const moonGlow = ctx.createRadialGradient(moonX, moonY, 10, moonX, moonY, 90);
    moonGlow.addColorStop(0, 'rgba(255, 245, 202, 0.95)');
    moonGlow.addColorStop(0.45, 'rgba(255, 206, 119, 0.45)');
    moonGlow.addColorStop(1, 'rgba(255, 206, 119, 0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 90, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 28; i++) {
        const starX = cameraX - 120 + ((i * 173) % (window.innerWidth + 260));
        const starY = 28 + ((i * 47) % 180);
        drawStar(starX, starY, 4, 5 + (i % 3), 2.2, i % 4 === 0 ? '#ffd65c' : '#ffffff', 0.7);
    }

    ctx.fillStyle = 'rgba(255, 214, 92, 0.22)';
    for (let i = 0; i < 8; i++) {
        let cx = (i * 420 + cameraX * 0.35) % (window.innerWidth * 2) + cameraX - window.innerWidth;
        let cy = 100 + Math.sin(i * 0.9) * 40;
        ctx.beginPath();
        ctx.arc(cx, cy, 46, 0, Math.PI * 2);
        ctx.arc(cx + 38, cy + 6, 54, 0, Math.PI * 2);
        ctx.arc(cx - 38, cy + 6, 54, 0, Math.PI * 2);
        ctx.fill();
    }

    const cityGrad = ctx.createLinearGradient(0, window.innerHeight * 0.35, 0, window.innerHeight);
    cityGrad.addColorStop(0, 'rgba(38, 16, 63, 0.15)');
    cityGrad.addColorStop(1, 'rgba(15, 5, 25, 0.95)');
    ctx.fillStyle = cityGrad;
    ctx.beginPath();
    ctx.moveTo(cameraX - 100, window.innerHeight);
    for (let i = 0; i <= window.innerWidth + 280; i += 90) {
        const hx = cameraX + i;
        const blockHeight = 120 + Math.sin(hx * 0.0022) * 38 + ((i / 90) % 3) * 28;
        ctx.lineTo(hx, window.innerHeight - blockHeight);
        ctx.lineTo(hx + 45, window.innerHeight - blockHeight + 8);
        ctx.lineTo(hx + 45, window.innerHeight);
    }
    ctx.lineTo(cameraX + window.innerWidth + 200, window.innerHeight);
    ctx.fill();

    ctx.fillStyle = '#31134d';
    ctx.beginPath();
    ctx.moveTo(cameraX - 100, window.innerHeight);
    for (let i = 0; i <= window.innerWidth + 200; i += 100) {
        let hx = cameraX + i;
        let hy = window.innerHeight - 120 + Math.sin((hx) * 0.002) * 78;
        ctx.lineTo(hx, hy);
    }
    ctx.lineTo(cameraX + window.innerWidth + 200, window.innerHeight);
    ctx.fill();

    // Platforms
    ctx.lineWidth = 4;
    platforms.forEach(p => {
        if (p.x + p.w < cameraX || p.x > cameraX + window.innerWidth) return;

        const platGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        platGrad.addColorStop(0, '#ffd874');
        platGrad.addColorStop(0.4, '#ff8d70');
        platGrad.addColorStop(1, '#8b2d72');
        ctx.fillStyle = platGrad;
        ctx.strokeStyle = '#fff1b6';

        drawRoundedRect(p.x, p.y, p.w, p.h, 20);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        drawRoundedRect(p.x + 12, p.y + 10, Math.max(24, p.w * 0.22), Math.max(8, p.h * 0.18), 999);
        ctx.fill();
    });

    // Enemies
    enemies.forEach(e => {
        if (e.x + e.w < cameraX || e.x > cameraX + window.innerWidth) return;
        
        ctx.save();
        ctx.translate(e.x + e.w/2, e.y + e.h/2);
        if (e.type === 'spike') {
            const spikeGrad = ctx.createLinearGradient(0, -20, 0, 20);
            spikeGrad.addColorStop(0, '#5bf2ff');
            spikeGrad.addColorStop(1, '#2054d8');
            ctx.fillStyle = spikeGrad;
            ctx.beginPath();
            ctx.moveTo(0, -22);
            ctx.lineTo(20, 20);
            ctx.lineTo(-20, 20);
            ctx.fill();
            ctx.strokeStyle = '#dffcff';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // Walker (Vacuum drone)
            const droneGrad = ctx.createRadialGradient(-4, -6, 2, 0, 0, 24);
            droneGrad.addColorStop(0, '#fff1b8');
            droneGrad.addColorStop(0.4, '#ff8bd4');
            droneGrad.addColorStop(1, '#7e2a9e');
            ctx.fillStyle = droneGrad;
            ctx.beginPath();
            ctx.roundRect(-22, -18, 44, 36, 14);
            ctx.fill();
            ctx.fillStyle = '#2d0b3d';
            ctx.fillRect(-14, -6, 28, 16);
            ctx.fillStyle = '#73f7ff';
            ctx.fillRect(-10, -2, 7, 7);
            ctx.fillRect(3, -2, 7, 7);
        }
        ctx.restore();
    });

    // Boss
    if (boss) {
        ctx.save();
        ctx.translate(boss.x + boss.w/2, boss.y + boss.h/2);
        // Draw Vacuum Boss
        const bossGrad = ctx.createLinearGradient(0, -60, 0, 60);
        bossGrad.addColorStop(0, '#8da2ff');
        bossGrad.addColorStop(0.5, '#5460c9');
        bossGrad.addColorStop(1, '#2a1c66');
        ctx.fillStyle = bossGrad;
        ctx.beginPath();
        ctx.roundRect(-78, -54, 156, 108, 28);
        ctx.fill();
        ctx.fillStyle = '#1f133c';
        ctx.beginPath();
        ctx.arc(0, -52, 44, Math.PI, 0);
        ctx.fill();
        ctx.strokeStyle = '#cfe0ff';
        ctx.lineWidth = 4;
        ctx.strokeRect(-44, 12, 88, 14);
        ctx.fillStyle = '#ff6262';
        ctx.beginPath();
        ctx.arc(0, -4, 22, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(-7, -10, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    // Projectiles
    projectiles.forEach(p => {
        ctx.fillStyle = p.color || 'red';
        ctx.beginPath();
        ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI*2);
        ctx.fill();
    });

    // Player
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h);
    ctx.scale(1, player.scaleY);
    ctx.translate(0, -player.h);

    // Draw Image or Fallback
    if (playerImg.complete && playerImg.naturalWidth > 0) {
        ctx.drawImage(playerImg, -player.w/2, 0, player.w, player.h);
    } else {
        const heroGrad = ctx.createRadialGradient(-8, 14, 6, 0, 20, 34);
        heroGrad.addColorStop(0, '#fff5d6');
        heroGrad.addColorStop(0.32, '#ffd46d');
        heroGrad.addColorStop(0.68, '#ff9b68');
        heroGrad.addColorStop(1, '#cc4f7d');
        ctx.fillStyle = heroGrad;
        ctx.beginPath();
        ctx.ellipse(0, player.h/2 + 2, 24, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd46d';
        ctx.beginPath();
        ctx.arc(-12, 10, 9, 0, Math.PI * 2);
        ctx.arc(12, 10, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffeeb6';
        ctx.beginPath();
        ctx.ellipse(0, 30, 14, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#20102b';
        ctx.beginPath();
        ctx.arc(-7, 22, 3.5, 0, Math.PI * 2);
        ctx.arc(7, 22, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#20102b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-4, 34);
        ctx.quadraticCurveTo(0, 38, 4, 34);
        ctx.stroke();

        ctx.strokeStyle = '#fff6cf';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-10, 6);
        ctx.lineTo(-4, 0);
        ctx.moveTo(10, 6);
        ctx.lineTo(4, 0);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.arc(-5, 16, 5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// --- Inputs ---

function handleInput(e) {
    if (e.type !== 'keydown') e.preventDefault();
    
    if (gameState === 'START') {
        audioSys.init();
        audioSys.playSfx('start');
        audioSys.playBgm();
        gameState = 'PLAY';
        document.getElementById('start-screen').classList.add('hidden');
        initGame();
        return;
    }
    
    if (gameState === 'GAMEOVER' || gameState === 'WIN') {
        // Debounce slightly
        if (shake === 0) {
            gameState = 'START';
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
        return;
    }

    if (gameState === 'PLAY' || gameState === 'BOSS') {
        if (player.grounded) {
            player.vy = -window.gameConfig.jumpForce;
            player.grounded = false;
            player.jumps = 1;
            player.scaleY = 1.2; // Stretch
            audioSys.playSfx('jump');
            spawnParticles(player.x + player.w/2, player.y + player.h, '#fff');
        } else if (player.jumps < 2) {
            player.vy = -window.gameConfig.jumpForce * 0.8;
            player.jumps = 2;
            player.scaleY = 1.2;
            audioSys.playSfx('jump');
            spawnParticles(player.x + player.w/2, player.y + player.h, '#FFD700'); // Gold sparks
        }
    }
}

// Event Listeners
window.addEventListener('resize', resize);
document.addEventListener('DOMContentLoaded', () => {
    resize();
    loop();
    
    const container = document.getElementById('game-container');
    // [agent-note][stage4] repaired: mobile-tap-risk | scope: gameplay-surface | action: keep gesture suppression on game area, not global page UI
    container.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handleInput(e);
    });
    
    // UI Buttons
    document.getElementById('start-btn').addEventListener('pointerdown', (e) => {
        e.stopPropagation(); // prevent double fire
        handleInput(e);
    });
    document.getElementById('restart-btn').addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        handleInput(e);
    });
});

</script>
