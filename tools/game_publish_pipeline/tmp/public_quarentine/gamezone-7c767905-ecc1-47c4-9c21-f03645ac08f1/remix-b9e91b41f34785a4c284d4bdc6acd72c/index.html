<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Corner Shop Rush</title>
    <!-- [agent-note][stage3] resolved-font: title -> Bangers, ui/body -> Rajdhani via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-deep: #1b1533;
            --bg-mid: #2a1f4a;
            --bg-glow: #3a2f63;
            --panel: rgba(34, 26, 62, 0.9);
            --panel-border: rgba(151, 244, 255, 0.5);
            --panel-shadow: rgba(9, 7, 21, 0.48);
            --accent-cash: #7cff84;
            --accent-buzz: #ffe266;
            --accent-action: #ff7b54;
            --accent-shop: #7ce7ff;
            --danger: #ff6584;
            --text-main: #f6f6ff;
            --text-dim: #c9c2ef;
            --track: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(124, 231, 255, 0.2), transparent 30%),
                linear-gradient(180deg, var(--bg-glow), var(--bg-deep) 45%, #120d22 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
            touch-action: auto;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 22px 22px;
            opacity: 0.32;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(12px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom)) 12px;
            pointer-events: none;
        }

        #hud { pointer-events: auto; }

        .arcade-panel {
            background: linear-gradient(180deg, rgba(44, 34, 79, 0.97), rgba(27, 21, 51, 0.94));
            border: 2px solid var(--panel-border);
            border-radius: 20px;
            box-shadow:
                0 12px 28px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 0 18px rgba(124, 231, 255, 0.14);
            backdrop-filter: blur(10px);
        }

        .arcade-btn {
            border: 0;
            border-radius: 16px;
            color: white;
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
            box-shadow:
                inset 0 -4px 0 rgba(0,0,0,0.22),
                0 8px 18px rgba(0,0,0,0.24),
                0 0 16px rgba(255,123,84,0.22);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        .arcade-btn:active {
            transform: translateY(2px) scale(0.985);
            box-shadow:
                inset 0 -2px 0 rgba(0,0,0,0.18),
                0 4px 10px rgba(0,0,0,0.24),
                0 0 12px rgba(255,123,84,0.2);
        }

        .arcade-btn.disabled {
            filter: grayscale(0.35) brightness(0.75);
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12), 0 6px 12px rgba(0,0,0,0.15);
            pointer-events: none;
        }

        .shop-btn {
            padding: 14px 26px;
            font-size: clamp(1rem, 3.6vw, 1.3rem);
            background: linear-gradient(180deg, #ff9d5c, var(--accent-action));
        }

        .hud-bar {
            align-self: center;
            width: min(100%, 430px);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .hud-metric {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .hud-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
            flex: 0 0 auto;
        }

        .hud-label {
            font-size: 0.68rem;
            line-height: 1;
            color: var(--text-dim);
            margin-bottom: 4px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: clamp(1rem, 4vw, 1.4rem);
            line-height: 1;
            font-weight: 700;
            white-space: nowrap;
        }

        .cash-value { color: var(--accent-cash); }
        .buzz-value { color: var(--accent-buzz); }

        #shop-btn-container {
            position: absolute;
            left: 0;
            right: 0;
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            pointer-events: auto;
            padding: 0 12px;
        }

        .hidden { display: none !important; }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            background: rgba(10, 8, 18, 0.72);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        .menu-card {
            width: min(100%, 420px);
            max-height: min(88vh, 680px);
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .menu-title,
        .game-over-title {
            margin: 0;
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.06em;
            font-size: clamp(1.4rem, 5vw, 2rem);
            color: #fff4b5;
            text-shadow: 0 0 14px rgba(255, 226, 102, 0.2);
        }

        .close-btn {
            border: 0;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
            font-size: 1.8rem;
            line-height: 1;
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .upgrade-btn {
            min-height: 108px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            background: linear-gradient(180deg, #61f0c7, #1fb67d);
        }

        .upgrade-btn--wide {
            grid-column: 1 / -1;
            min-height: 92px;
            background: linear-gradient(180deg, #79c9ff, #4a72ff);
        }

        .upgrade-title {
            font-size: clamp(0.95rem, 3.5vw, 1.15rem);
            line-height: 1.05;
        }

        .upgrade-subtitle {
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255,255,255,0.82);
            letter-spacing: 0.05em;
        }

        .cost-pill {
            margin-top: auto;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(0,0,0,0.18);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .menu-note,
        .game-over-copy {
            font-size: 0.85rem;
            line-height: 1.35;
            color: var(--text-dim);
            text-align: center;
        }

        .game-over-wrap {
            position: absolute;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            background: rgba(7, 5, 14, 0.64);
            pointer-events: auto;
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            width: min(28vw, 120px);
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.16);
            box-shadow: 0 10px 20px rgba(0,0,0,0.28);
            background: rgba(20, 14, 36, 0.72);
            object-fit: cover;
            opacity: 0;
            transform: scale(0.82) translateY(10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.96;
            transform: scale(1) translateY(0);
        }

        #celebration-gif {
            top: 88px;
        }

        #danger-gif {
            bottom: 96px;
        }

        .game-over-card {
            width: min(100%, 360px);
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }

        .restart-btn {
            padding: 14px 24px;
            font-size: clamp(1rem, 4vw, 1.2rem);
            background: linear-gradient(180deg, #ff9d5c, var(--accent-action));
        }

        .floating-text {
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }

        @media (max-width: 480px) {
            .hud-bar {
                padding: 10px 12px;
                border-radius: 18px;
            }

            .hud-icon {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }

            .hud-label {
                font-size: 0.62rem;
            }

            .hud-value {
                font-size: 1rem;
            }

            .menu-card {
                padding: 14px;
                gap: 12px;
            }

            .upgrade-grid {
                gap: 10px;
            }

            .upgrade-btn {
                min-height: 98px;
                padding: 10px 8px;
            }

            .upgrade-title {
                font-size: 0.88rem;
            }

            .upgrade-subtitle,
            .cost-pill,
            .menu-note,
            .game-over-copy {
                font-size: 0.72rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
      "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 5, "min": 1, "max": 12 },
      "themeColor": { "type": "color", "label": "Theme Color", "value": "#4ade80" }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="arcade-panel hud-bar">
                <div class="hud-metric">
                    <div class="hud-icon" aria-hidden="true">💵</div>
                    <div>
                        <div class="hud-label">Cash Drawer</div>
                        <div class="hud-value cash-value">$<span id="money-display">10</span></div>
                    </div>
                </div>
                <div class="hud-metric" style="justify-content:flex-end;">
                    <div>
                        <div class="hud-label">Buzz Meter</div>
                        <div class="hud-value buzz-value"><span id="rep-display">0</span>⭐</div>
                    </div>
                    <div class="hud-icon" aria-hidden="true">✨</div>
                </div>
            </div>

            <img id="celebration-gif" class="feedback-gif" alt="Happy shopper celebration reaction" />
            <img id="danger-gif" class="feedback-gif" alt="Checkout panic fail reaction" />

            <div id="shop-btn-container">
                <button id="btn-open-shop" class="arcade-btn shop-btn">
                    🛒 Boosts
                </button>
            </div>

            <div id="upgrade-overlay" class="overlay hidden">
                <div id="upgrade-menu" class="arcade-panel menu-card">
                    <div class="menu-header">
                        <h2 class="menu-title">🛒 Boost Counter</h2>
                        <button id="btn-close-shop" class="close-btn" aria-label="Close boosts menu">&times;</button>
                    </div>
                    <div class="upgrade-grid">
                        <button id="btn-up-shelf" class="arcade-btn upgrade-btn">
                            <span class="upgrade-title">⬆️ Stock Cap</span>
                            <span class="upgrade-subtitle">+10 supply room</span>
                            <span id="cost-shelf" class="cost-pill">$20</span>
                        </button>
                        <button id="btn-up-cashier" class="arcade-btn upgrade-btn">
                            <span class="upgrade-title">⚡ Checkout</span>
                            <span class="upgrade-subtitle">scan faster</span>
                            <span id="cost-cashier" class="cost-pill">$30</span>
                        </button>
                        <button id="btn-hire-janitor" class="arcade-btn upgrade-btn upgrade-btn--wide">
                            <span class="upgrade-title">🧹 Cleanup Crew</span>
                            <span id="cost-janitor" class="cost-pill">$50</span>
                        </button>
                    </div>
                    <div class="menu-note">Tap empty stock bays to restock for $40. Tap spills before customers start slipping.</div>
                </div>
            </div>

            <div id="game-over-screen" class="game-over-wrap hidden">
                <div id="game-over-panel" class="arcade-panel game-over-card">
                    <h1 class="game-over-title">Shift Over</h1>
                    <p class="game-over-copy">The rush wiped the shelves and the register ran dry.</p>
                    <button id="restart-btn" class="arcade-btn restart-btn">Run Again</button>
                </div>
            </div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/block/gameover wired from catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-gif: celebration/fail reactions wired from catalogs/gifs.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" preload="auto" loop></audio>
    <audio id="sfx_collect" preload="auto"></audio>
    <audio id="sfx_upgrade" preload="auto"></audio>
    <audio id="sfx_blocked" preload="auto"></audio>
    <audio id="sfx_menu_open" preload="auto"></audio>
    <audio id="sfx_menu_close" preload="auto"></audio>
    <audio id="sfx_game_over" preload="auto"></audio>

<script>
/**
 * L0: System Invariants
 * - Single Source of Truth: window.state
 * - Viewport Fill: CSS height chain is strict.
 * - Observer-Driven: ResizeObserver handles canvas.
 * - SFX Zero DOM Overhead: AudioContext synthesizers.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
let initialized = false;
let lastTime = 0;
let uiState = 'PLAYING'; // PLAYING, GAMEOVER

const CHARACTER_THEME = {
    floorBase: '#1b1533',
    floorGlow: '#251c48',
    floorGrid: 'rgba(146, 120, 255, 0.18)',
    aisleGlow: 'rgba(124, 231, 255, 0.08)',
    shelfBase: '#7d5cff',
    shelfEdge: '#cbb8ff',
    shelfStock: '#74ffb3',
    shelfEmpty: '#ff6f91',
    cashierDesk: '#4cc9f0',
    cashierGlow: '#98f5ff',
    customerOutline: '#ffffff',
    accentCoin: '#ffe266',
    puddle: 'rgba(89, 126, 255, 0.46)',
    puddleEdge: 'rgba(165, 185, 255, 0.62)',
    sparkle: '#fff2a4'
};

// Audio System
const AudioSys = {
    ctx: null,
    unlocked: false,
    bgm: document.getElementById('bgm_main'),
    sfxMap: {
        collect: document.getElementById('sfx_collect'),
        upgrade: document.getElementById('sfx_upgrade'),
        blocked: document.getElementById('sfx_blocked'),
        menuOpen: document.getElementById('sfx_menu_open'),
        menuClose: document.getElementById('sfx_menu_close'),
        gameOver: document.getElementById('sfx_game_over')
    },
    lastPlayed: {},
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        this.bgm.src = 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3';
        this.bgm.volume = 0.2;
        this.bgm.loop = true;

        this.sfxMap.collect.src = 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3';
        this.sfxMap.collect.volume = 0.45;
        this.sfxMap.upgrade.src = 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3';
        this.sfxMap.upgrade.volume = 0.42;
        this.sfxMap.blocked.src = 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3';
        this.sfxMap.blocked.volume = 0.42;
        this.sfxMap.menuOpen.src = 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3';
        this.sfxMap.menuOpen.volume = 0.34;
        this.sfxMap.menuClose.src = 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3';
        this.sfxMap.menuClose.volume = 0.34;
        this.sfxMap.gameOver.src = 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3';
        this.sfxMap.gameOver.volume = 0.45;
    },
    unlock() {
        this.init();
        if (this.ctx?.state === 'suspended') this.ctx.resume();
        if (!this.unlocked) {
            this.unlocked = true;
            this.startBgm();
        }
    },
    startBgm() {
        if (!this.bgm.src) this.init();
        this.bgm.play().catch(()=>{});
    },
    stopBgm() {
        this.bgm.pause();
        this.bgm.currentTime = 0;
    },
    pauseBgm() {
        this.bgm.pause();
    },
    playSample(name, debounceMs = 100) {
        if (!this.unlocked) return;
        const audio = this.sfxMap[name];
        if (!audio?.src) return;
        const now = performance.now();
        if (this.lastPlayed[name] && now - this.lastPlayed[name] < debounceMs) return;
        this.lastPlayed[name] = now;
        try {
            audio.currentTime = 0;
            audio.play().catch(()=>{});
        } catch (_) {}
    },
    playSynth(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.setValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'upgrade') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(400, now + 0.1);
            osc.frequency.setValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    }
};

// Vibration
function vibrate(style = 'light') {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
}

// Game State (Single Source of Truth)
const state = {
    money: 10,
    reputation: 0,
    costs: { shelf: 20, cashier: 30, janitor: 50 },
    stats: { shelfCap: 20, cashierSpd: 1.0, janitors: 0 },
    shelves: [],
    cashier: null,
    entrance: null,
    customers: [],
    puddles: [],
    particles: [],
    floatingTexts: [],
    spawnTimer: 0,
    puddleTimer: 0,
    feedbackTimer: 0,
    activeFeedback: null,
    didGameOverSfx: false
};

// Config
let gameConfig = { heroSpeed: 5, themeColor: '#4ade80' };

function parseConfig() {
    try {
        const script = document.getElementById('game-config');
        if (script) {
            const defs = JSON.parse(script.textContent);
            window.gameConfigDefs = defs;
            for (let k in defs) gameConfig[k] = defs[k].value;
        }
    } catch(e) { console.error("Config parse error", e); }
}

function setUIState(newState) {
    uiState = newState;
    const goScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const shopBtn = document.getElementById('shop-btn-container');
    const overlay = document.getElementById('upgrade-overlay');

    if (newState === 'PLAYING') {
        state.didGameOverSfx = false;
        goScreen.classList.add('hidden');
        hud.style.display = 'flex';
        shopBtn.classList.remove('hidden');
        overlay.classList.add('hidden');
        AudioSys.startBgm();
    } else {
        goScreen.classList.remove('hidden');
        hud.style.display = 'none';
        shopBtn.classList.add('hidden');
        overlay.classList.add('hidden');
        AudioSys.pauseBgm();
        if (!state.didGameOverSfx) {
            AudioSys.playSample('gameOver', 600);
            showFeedback('danger', 2200);
            state.didGameOverSfx = true;
        }
    }
}

 function toggleShop(open) {
    const overlay = document.getElementById('upgrade-overlay');
    const shopBtn = document.getElementById('shop-btn-container');
    if (open) {
        overlay.classList.remove('hidden');
        shopBtn.classList.add('hidden');
        AudioSys.playSample('menuOpen', 120);
    } else {
        overlay.classList.add('hidden');
        shopBtn.classList.remove('hidden');
        AudioSys.playSample('menuClose', 120);
    }
}

function initGame() {
    state.money = 10;
    state.reputation = 0;
    state.stats = { shelfCap: 20, cashierSpd: 1.0, janitors: 0 };
    state.costs = { shelf: 20, cashier: 30, janitor: 50 };
    state.customers = [];
    state.puddles = [];
    state.particles = [];
    state.floatingTexts = [];
    state.spawnTimer = 0;
    state.feedbackTimer = 0;
    state.activeFeedback = null;
    state.didGameOverSfx = false;
    hideFeedback();

    const shelfW = Math.min(cw * 0.25, 80);
    const shelfH = shelfW * 1.5;

    state.shelves = [
        { id: 0, x: cw * 0.3, y: ch * 0.3, w: shelfW, h: shelfH, stock: state.stats.shelfCap, max: state.stats.shelfCap, scale: 1 },
        { id: 1, x: cw * 0.7, y: ch * 0.3, w: shelfW, h: shelfH, stock: state.stats.shelfCap, max: state.stats.shelfCap, scale: 1 }
    ];

    state.cashier = {
        x: cw * 0.5, y: ch * 0.65, w: shelfW * 1.5, h: shelfW * 0.8,
        queue: [], processTimer: 0, scale: 1
    };

    state.entrance = { x: cw * 0.5, y: ch + 20 };

    updateUI();
    setUIState('PLAYING');
    AudioSys.bgm.play().catch(()=>{});
}

function restartGame() {
    initGame();
}

// Core Loop
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.05) dt = 0.05;

    try {
        if (uiState === 'PLAYING') {
            update(dt);
        }
        draw();
    } catch (e) {
        console.error("Loop error isolated:", e);
    }

    requestAnimationFrame(gameLoop);
}

// Update Logic
function update(dt) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
        spawnCustomer();
        state.spawnTimer = 2.0 + Math.random() * 2.0;
    }

    state.puddleTimer -= dt;
    if (state.puddleTimer <= 0) {
        spawnPuddle();
        state.puddleTimer = 5.0 + Math.random() * 5.0;
    }

    for (let i = state.customers.length - 1; i >= 0; i--) {
        let c = state.customers[i];

        let speedMult = 1.0;
        for (let p of state.puddles) {
            let dx = c.x - p.x; let dy = c.y - p.y;
            if (dx*dx + dy*dy < 1600) { speedMult = 0.3; break; }
        }

        let speed = 60 * speedMult * dt;

        if (c.state === 'ENTERING') {
            let target = state.shelves[c.targetShelf];
            if (moveTo(c, target.x, target.y + target.h/2 + 20, speed)) {
                c.state = 'BROWSING';
                c.timer = 1.0;
            }
        } else if (c.state === 'BROWSING') {
            c.timer -= dt;
            if (c.timer <= 0) {
                let target = state.shelves[c.targetShelf];
                if (target.stock > 0) {
                    target.stock--;
                    c.hasItem = true;
                    c.state = 'TO_CASHIER';
                    state.cashier.queue.push(c);
                    c.queuePos = state.cashier.queue.length - 1;
                } else {
                    c.state = 'LEAVING';
                    spawnFloatingText(c.x, c.y - 20, "😠", "#ef4444");
                }
            }
        } else if (c.state === 'TO_CASHIER' || c.state === 'QUEUEING') {
            let qIdx = state.cashier.queue.indexOf(c);
            if (qIdx === 0 && c.state !== 'PAYING') {
                let tx = state.cashier.x - state.cashier.w/2 - 20;
                let ty = state.cashier.y;
                if (moveTo(c, tx, ty, speed)) {
                    c.state = 'PAYING';
                }
            } else if (qIdx > 0) {
                let tx = state.cashier.x - state.cashier.w/2 - 20;
                let ty = state.cashier.y + qIdx * 30;
                moveTo(c, tx, ty, speed);
            }
        } else if (c.state === 'LEAVING') {
            if (moveTo(c, state.entrance.x, state.entrance.y, speed)) {
                state.customers.splice(i, 1);
            }
        }

        if (c.state !== 'BROWSING' && c.state !== 'PAYING' && c.state !== 'QUEUEING') {
            c.wobble += dt * 15;
        } else {
            c.wobble = 0;
        }
    }

    if (state.cashier.queue.length > 0) {
        let first = state.cashier.queue[0];
        if (first.state === 'PAYING') {
            state.cashier.processTimer += dt * state.stats.cashierSpd;
            if (state.cashier.processTimer >= 1.0) {
                state.cashier.processTimer = 0;
                state.cashier.queue.shift();
                first.state = 'LEAVING';
                addMoney(5);
                state.reputation++;
                spawnFloatingText(state.cashier.x, state.cashier.y - 30, "+$5", "#7cff84");
                AudioSys.playSynth('coin');
                AudioSys.playSample('collect', 90);
                showFeedback('celebration', 1200);
                vibrate('light');
                state.cashier.scale = 1.1;
                updateUI();
            }
        }
    }

    if (state.stats.janitors > 0 && state.puddles.length > 0) {
        let p = state.puddles[0];
        p.life -= dt * state.stats.janitors;
        if (p.life <= 0) {
            state.puddles.shift();
            spawnParticles(p.x, p.y, "#4cc9f0");
        }
    }

    state.shelves.forEach(s => s.scale += (1 - s.scale) * dt * 10);
    state.cashier.scale += (1 - state.cashier.scale) * dt * 10;

    for (let i = state.particles.length - 1; i >= 0; i--) {
        let p = state.particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
    }

    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
        let ft = state.floatingTexts[i];
        ft.y -= 30 * dt;
        ft.life -= dt;
        if (ft.life <= 0) state.floatingTexts.splice(i, 1);
    }

    if (state.feedbackTimer > 0) {
        state.feedbackTimer -= dt;
        if (state.feedbackTimer <= 0) hideFeedback();
    }

    let totalStock = state.shelves.reduce((sum, s) => sum + s.stock, 0);
    let potentialMoney = state.customers.filter(c => c.hasItem).length * 5;
    if (totalStock === 0 && (state.money + potentialMoney) < 40) {
        setUIState('GAMEOVER');
    }
}

function moveTo(obj, tx, ty, speed) {
    let dx = tx - obj.x; let dy = ty - obj.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if (dist <= speed) {
        obj.x = tx; obj.y = ty; return true;
    }
    obj.x += (dx/dist) * speed;
    obj.y += (dy/dist) * speed;
    return false;
}

function spawnCustomer() {
    let targetShelf = Math.floor(Math.random() * state.shelves.length);
    const customerPalette = [
        { body: '#ff7b54', shirt: '#ffe266' },
        { body: '#7ce7ff', shirt: '#4cc9f0' },
        { body: '#7cff84', shirt: '#34d399' },
        { body: '#f694ff', shirt: '#c084fc' },
        { body: '#ffd66b', shirt: '#ff9f43' }
    ];
    const look = customerPalette[Math.floor(Math.random() * customerPalette.length)];

    state.customers.push({
        x: state.entrance.x + (Math.random()*40 - 20),
        y: state.entrance.y,
        state: 'ENTERING',
        targetShelf: targetShelf,
        hasItem: false,
        timer: 0,
        wobble: 0,
        color: look.body,
        accent: look.shirt
    });
}

function spawnPuddle() {
    state.puddles.push({
        x: cw*0.2 + Math.random() * (cw*0.6),
        y: ch*0.3 + Math.random() * (ch*0.4),
        life: 2.0,
        scale: 0
    });
}

function addMoney(amt) {
    state.money += amt;
}

function spawnParticles(x, y, color) {
    for(let i=0; i<8; i++) {
        state.particles.push({
            x, y,
            vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100,
            life: 0.5 + Math.random()*0.5,
            color
        });
    }
}

function spawnFloatingText(x, y, text, color) {
    state.floatingTexts.push({ x, y, text, color, life: 1.0 });
}

function drawRoundedRect(x, y, w, h, r, fill, shadowY = 5) {
    if (w < 0) w = 0;
    if (h < 0) h = 0;
    ctx.beginPath();
    ctx.roundRect(x - w/2, y - h/2, w, h, r);
    ctx.fillStyle = fill;

    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = shadowY;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
}

function drawNeonRoundedRect(x, y, w, h, r, fill, stroke, glow = 16) {
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x - w / 2, y - h / 2, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = stroke;
    ctx.shadowColor = stroke;
    ctx.shadowBlur = glow;
    ctx.stroke();
    ctx.restore();
}

function drawShopper(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.sin(c.wobble) * 0.2);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 19, 14, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = CHARACTER_THEME.customerOutline;
    ctx.lineWidth = 2;

    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.roundRect(-14, -6, 28, 34, 14);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = c.accent || '#ffffff';
    ctx.beginPath();
    ctx.roundRect(-12, 5, 24, 13, 6);
    ctx.fill();

    ctx.fillStyle = '#1f1b2d';
    ctx.beginPath();
    ctx.arc(0, -14, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffe5cf';
    ctx.beginPath();
    ctx.arc(0, -10, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1b1533';
    ctx.beginPath();
    ctx.arc(-4, -11, 1.6, 0, Math.PI * 2);
    ctx.arc(4, -11, 1.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1b1533';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -7, 4.5, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.moveTo(-6, -3);
    ctx.lineTo(6, -3);
    ctx.stroke();

    if (c.hasItem) {
        drawNeonRoundedRect(18, 2, 14, 14, 4, CHARACTER_THEME.accentCoin, '#fff2a4', 8);
    }

            if (c.state === 'BROWSING' && state.shelves[c.targetShelf].stock === 0) {
                ctx.fillStyle = CHARACTER_THEME.shelfEmpty;
                ctx.font = '700 16px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('?', 14, -24);
            }

    ctx.restore();
}

function draw() {
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#2f2458');
    bgGradient.addColorStop(0.45, CHARACTER_THEME.floorGlow);
    bgGradient.addColorStop(1, CHARACTER_THEME.floorBase);
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    const glowGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.25, 30, cw * 0.5, ch * 0.25, Math.max(cw, ch) * 0.65);
    glowGradient.addColorStop(0, 'rgba(124, 231, 255, 0.18)');
    glowGradient.addColorStop(1, 'rgba(124, 231, 255, 0)');
    ctx.fillStyle = glowGradient;
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = CHARACTER_THEME.floorGrid;
    ctx.lineWidth = 1.2;
    const tileSize = Math.max(34, Math.min(48, cw * 0.09));
    for(let x = 0; x < cw; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
        ctx.stroke();
    }
    for(let y = 0; y < ch; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }

    ctx.fillStyle = CHARACTER_THEME.aisleGlow;
    ctx.fillRect(cw * 0.1, ch * 0.15, cw * 0.8, ch * 0.65);

    state.puddles.forEach(p => {
        p.scale += (1 - p.scale) * 0.1;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 22 * p.scale, 12 * p.scale, 0, 0, Math.PI * 2);
        ctx.fillStyle = CHARACTER_THEME.puddle;
        ctx.fill();
        ctx.strokeStyle = CHARACTER_THEME.puddleEdge;
        ctx.lineWidth = 2;
        ctx.stroke();
    });

    state.shelves.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.scale(s.scale, s.scale);

        drawNeonRoundedRect(0, 0, s.w, s.h, 14, '#34275e', CHARACTER_THEME.shelfEdge, 10);

        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.beginPath();
        ctx.roundRect(-s.w/2 + 6, -s.h/2 + 6, s.w - 12, s.h - 12, 8);
        ctx.fill();

        const bayX = -s.w * 0.22;
        for (let row = -1; row <= 1; row++) {
            drawRoundedRect(bayX, row * 20, 12, 16, 4, 'rgba(255,255,255,0.11)', 0);
            drawRoundedRect(-bayX, row * 20, 12, 16, 4, 'rgba(255,255,255,0.09)', 0);
        }

        if (s.stock > 0) {
            const fillRatio = s.stock / s.max;
            const fillH = (s.h - 16) * fillRatio;
            const fillY = (s.h / 2 - 8) - fillH / 2;
            drawNeonRoundedRect(0, fillY, s.w - 14, fillH, 8, CHARACTER_THEME.shelfStock, '#d9ffe7', 10);

            ctx.fillStyle = '#1a1733';
            ctx.font = '700 14px Rajdhani';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${s.stock}`, 0, fillY);
        } else {
            ctx.fillStyle = CHARACTER_THEME.shelfEmpty;
            ctx.font = '700 14px Rajdhani';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('TAP! $40', 0, 0);
        }

        ctx.restore();
    });

    ctx.save();
    ctx.translate(state.cashier.x, state.cashier.y);
    ctx.scale(state.cashier.scale, state.cashier.scale);
    drawNeonRoundedRect(0, 0, state.cashier.w, state.cashier.h, 16, CHARACTER_THEME.cashierDesk, CHARACTER_THEME.cashierGlow, 14);
    drawNeonRoundedRect(0, -8, 38, 24, 6, '#d8eaff', '#ffffff', 8);
    drawRoundedRect(-state.cashier.w * 0.22, 0, 16, 10, 4, '#1b1533', 0);
    drawRoundedRect(state.cashier.w * 0.22, 0, 16, 10, 4, '#1b1533', 0);

    ctx.fillStyle = '#1b1533';
    ctx.font = '700 13px Rajdhani';
    ctx.textAlign = 'center';
    ctx.fillText('SCAN', 0, 18);
    ctx.restore();

    state.customers.forEach(drawShopper);

    state.particles.forEach(p => {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    state.floatingTexts.forEach(ft => {
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.font = '700 20px Rajdhani';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 6;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
    });
}

function showFeedback(type, duration = 1200) {
    const celebration = document.getElementById('celebration-gif');
    const danger = document.getElementById('danger-gif');
    if (!celebration || !danger) return;

    celebration.classList.remove('visible');
    danger.classList.remove('visible');

    if (type === 'celebration') {
        celebration.src = 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp';
        celebration.classList.add('visible');
        state.activeFeedback = 'celebration';
    } else if (type === 'danger') {
        danger.src = 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';
        danger.classList.add('visible');
        state.activeFeedback = 'danger';
    } else {
        state.activeFeedback = null;
    }

    state.feedbackTimer = duration / 1000;
}

function hideFeedback() {
    document.getElementById('celebration-gif')?.classList.remove('visible');
    document.getElementById('danger-gif')?.classList.remove('visible');
    state.activeFeedback = null;
    state.feedbackTimer = 0;
}

// Input Handling
function handleGlobalInput(e) {
    AudioSys.unlock();
    if (uiState === 'GAMEOVER') {
        if (e.target.id === 'restart-btn') restartGame();
        return;
    }

    const overlay = document.getElementById('upgrade-overlay');
    if (!overlay.classList.contains('hidden')) return;

    if (e.target.id !== 'gameCanvas') return;
    e.preventDefault();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    for (let i = 0; i < state.puddles.length; i++) {
        let p = state.puddles[i];
        if (Math.hypot(x - p.x, y - p.y) < 30) {
            state.puddles.splice(i, 1);
            spawnParticles(p.x, p.y, "#4cc9f0");
            AudioSys.playSynth('pop');
            vibrate('light');
            return;
        }
    }

    for (let s of state.shelves) {
        if (x > s.x - s.w/2 - 20 && x < s.x + s.w/2 + 20 &&
            y > s.y - s.h/2 - 20 && y < s.y + s.h/2 + 20) {

            if (s.stock < s.max) {
                if (state.money >= 40) {
                    state.money -= 40;
                    s.stock = s.max;
                    s.scale = 0.8;
                    spawnParticles(s.x, s.y, "#7cff84");
                    spawnFloatingText(s.x, s.y - 40, "-$40", "#ff6584");
                    AudioSys.playSynth('pop');
                    AudioSys.playSample('upgrade', 100);
                    showFeedback('celebration', 900);
                    vibrate('light');
                    updateUI();
                } else {
                    spawnFloatingText(s.x, s.y - 40, "Need $40!", "#ff6584");
                    AudioSys.playSynth('error');
                    AudioSys.playSample('blocked', 120);
                    showFeedback('danger', 1000);
                    vibrate('light');
                }
            } else {
                AudioSys.playSynth('error');
                AudioSys.playSample('blocked', 120);
            }
            return;
        }
    }
}

// UI Upgrades Logic
function buyUpgrade(type) {
    AudioSys.unlock();
    let cost = state.costs[type];
    if (state.money >= cost) {
        state.money -= cost;
        if (type === 'shelf') {
            state.stats.shelfCap += 10;
            state.shelves.forEach(s => s.max = state.stats.shelfCap);
            state.costs.shelf = Math.floor(state.costs.shelf * 1.5);
        } else if (type === 'cashier') {
            state.stats.cashierSpd += 0.5;
            state.costs.cashier = Math.floor(state.costs.cashier * 1.5);
        } else if (type === 'janitor') {
            state.stats.janitors++;
            state.costs.janitor = Math.floor(state.costs.janitor * 2.0);
            document.getElementById('btn-hire-janitor').innerHTML = `
                <span class="upgrade-title">🧹 Crew: ${state.stats.janitors}</span>
                <span id="cost-janitor" class="cost-pill">$${state.costs.janitor}</span>
            `;
        }
        AudioSys.playSynth('upgrade');
        AudioSys.playSample('upgrade', 100);
        showFeedback('celebration', 1200);
        vibrate('heavy');
        spawnParticles(cw/2, ch - 100, "#c084fc");
        updateUI();
    } else {
        AudioSys.playSynth('error');
        AudioSys.playSample('blocked', 120);
        showFeedback('danger', 1000);
        vibrate('light');
    }
}

function updateUI() {
    document.getElementById('money-display').innerText = state.money;
    document.getElementById('rep-display').innerText = state.reputation;

    document.getElementById('cost-shelf').innerText = `$${state.costs.shelf}`;
    document.getElementById('cost-cashier').innerText = `$${state.costs.cashier}`;
    const costJanitorEl = document.getElementById('cost-janitor');
    if(costJanitorEl) costJanitorEl.innerText = `$${state.costs.janitor}`;

    document.getElementById('btn-up-shelf').classList.toggle('disabled', state.money < state.costs.shelf);
    document.getElementById('btn-up-cashier').classList.toggle('disabled', state.money < state.costs.cashier);
    document.getElementById('btn-hire-janitor').classList.toggle('disabled', state.money < state.costs.janitor);
}

// Wiring Events
// [agent-note][stage4] repaired: mobile tap actionability | scope: gameplay-only preventDefault remains on canvas taps, UI buttons keep native tap/click behavior
window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
document.getElementById('restart-btn').addEventListener('click', () => { AudioSys.unlock(); restartGame(); });

document.getElementById('btn-open-shop').addEventListener('click', () => { AudioSys.unlock(); toggleShop(true); AudioSys.playSynth('pop'); });
document.getElementById('btn-close-shop').addEventListener('click', () => { AudioSys.unlock(); toggleShop(false); AudioSys.playSynth('pop'); });

document.getElementById('btn-up-shelf').addEventListener('click', () => buyUpgrade('shelf'));
document.getElementById('btn-up-cashier').addEventListener('click', () => buyUpgrade('cashier'));
document.getElementById('btn-hire-janitor').addEventListener('click', () => buyUpgrade('janitor'));

// Resize & Init
const ro = new ResizeObserver(entries => {
    for (let entry of entries) {
        const cr = entry.contentRect;
        cw = cr.width;
        ch = cr.height;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!initialized) {
            parseConfig();
            initGame();
            initialized = true;
            requestAnimationFrame(gameLoop);
        } else {
            state.entrance = { x: cw * 0.5, y: ch + 20 };
            state.cashier.x = cw * 0.5;
            state.cashier.y = ch * 0.65;
            if(state.shelves[0]) { state.shelves[0].x = cw * 0.3; state.shelves[0].y = ch * 0.3; }
            if(state.shelves[1]) { state.shelves[1].x = cw * 0.7; state.shelves[1].y = ch * 0.3; }
        }
    }
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.getElementById('game-container'));
});
</script>
