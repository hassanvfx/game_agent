<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Starlight Tycoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg: #07111f;
            --bg-deep: #020816;
            --panel: rgba(7, 17, 31, 0.76);
            --panel-solid: rgba(8, 21, 39, 0.92);
            --border: rgba(136, 240, 255, 0.22);
            --text: #f3fbff;
            --muted: #9fb5cc;
            --muted-soft: rgba(243, 251, 255, 0.54);
            --cyan: #4de8ff;
            --cyan-soft: #9bf7ff;
            --blue: #4f7cff;
            --pink: #ff6bb5;
            --pink-deep: rgba(255, 86, 163, 0.8);
            --violet: #ae7bff;
            --gold: #ffd76a;
            --shadow-cyan: 0 0 22px rgba(77, 232, 255, 0.42);
            --score-glow: 0 0 12px rgba(77, 232, 255, 0.9);
            --starfield: radial-gradient(circle at 20% 20%, rgba(155, 247, 255, 0.15) 0, transparent 28%), radial-gradient(circle at 80% 0%, rgba(174, 123, 255, 0.22) 0, transparent 30%), radial-gradient(circle at 50% 100%, rgba(79, 124, 255, 0.24) 0, transparent 34%);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                var(--starfield),
                radial-gradient(circle at top, rgba(77, 232, 255, 0.08), transparent 38%),
                linear-gradient(180deg, #0d1d35 0%, var(--bg) 38%, var(--bg-deep) 100%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body {
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 32%, rgba(255, 215, 106, 0.14), transparent 0 15%),
                radial-gradient(circle, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.5px);
            background-size: auto, 160px 160px;
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(14, 32, 55, 0.84), rgba(7, 17, 31, 0.92));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 18px 40px rgba(2, 8, 22, 0.42);
        }

        .font-display {
            font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
        }

        .font-ui {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud {
            width: 100%;
            padding: 1.1rem 1rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        .opacity-visible {
            opacity: 1;
        }

        .hud-label {
            color: var(--gold);
            font-size: clamp(0.9rem, 2.8vw, 1.15rem);
            letter-spacing: 0.34rem;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 12px rgba(255, 215, 106, 0.42);
        }

        .hud-score-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .score-display {
            color: var(--text);
            font-size: clamp(2.8rem, 9vw, 4.4rem);
            text-shadow: var(--score-glow);
            line-height: 0.94;
            filter: drop-shadow(0 0 18px rgba(77, 232, 255, 0.3));
        }

        .hud-unit {
            color: var(--muted);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.12rem;
        }

        .gps-display {
            color: var(--pink);
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            margin-top: 0.18rem;
            padding: 0.22rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 107, 181, 0.28);
            background: rgba(255, 107, 181, 0.08);
            box-shadow: inset 0 0 16px rgba(255, 107, 181, 0.08);
        }

        .upgrade-panel {
            width: 100%;
            max-height: 40%;
            border-radius: 1.4rem 1.4rem 0 0;
            padding: 0.85rem 0.85rem 0.75rem;
            pointer-events: auto;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            transition: transform 0.5s ease;
            transform: translateY(100%);
            border-top: 1px solid rgba(155, 247, 255, 0.3);
            box-shadow: 0 -12px 32px rgba(2, 8, 22, 0.48);
        }

        .panel-open {
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, rgba(12, 31, 53, 0.98), rgba(8, 21, 39, 0.94));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.45rem 0.55rem;
            border-radius: 0.8rem;
            z-index: 10;
            border: 1px solid var(--border);
        }

        .panel-title {
            color: var(--text);
            font-size: 1.1rem;
            margin: 0;
        }

        .panel-caption {
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.05rem;
        }

        .upgrade-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-bottom: 2rem;
        }

        .start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            overflow: hidden;
        }

        .start-screen::before,
        .start-screen::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(10px);
        }

        .start-screen::before {
            width: 52vw;
            height: 52vw;
            max-width: 18rem;
            max-height: 18rem;
            top: 14%;
            background: radial-gradient(circle, rgba(77, 232, 255, 0.24), transparent 68%);
        }

        .start-screen::after {
            width: 62vw;
            height: 62vw;
            max-width: 22rem;
            max-height: 22rem;
            bottom: -8%;
            background: radial-gradient(circle, rgba(174, 123, 255, 0.24), transparent 70%);
        }

        .hidden {
            display: none;
        }

        .feedback-gif {
            position: absolute;
            z-index: 55;
            width: clamp(84px, 18vw, 132px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(6, 17, 31, 0.38);
            box-shadow: 0 12px 28px rgba(2, 8, 22, 0.34);
            opacity: 0;
            transform: scale(0.92) translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        .feedback-gif--success {
            top: 6rem;
            right: 0.85rem;
        }

        .feedback-gif--fail {
            left: 0.85rem;
            bottom: calc(40% + 1rem);
        }

        .title {
            position: relative;
            z-index: 1;
            font-size: clamp(3.2rem, 12vw, 5.8rem);
            line-height: 0.9;
            margin: 0 0 0.8rem;
            background: linear-gradient(180deg, #f9feff 0%, var(--cyan-soft) 34%, var(--blue) 72%, var(--violet) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 8px 26px rgba(0, 0, 0, 0.45));
        }

        .start-subtitle {
            position: relative;
            z-index: 1;
            max-width: 18rem;
            color: #d8e7f8;
            margin: 0 0 1.5rem;
            font-size: clamp(1rem, 4vw, 1.2rem);
            letter-spacing: 0.08rem;
            animation: pulse 1.8s ease-in-out infinite;
        }

        .start-button {
            position: relative;
            z-index: 1;
            min-width: min(78vw, 18rem);
            padding: 0.95rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            background: linear-gradient(180deg, var(--cyan-soft), var(--cyan));
            color: #04111f;
            font-size: clamp(1.4rem, 6vw, 1.9rem);
            cursor: pointer;
            box-shadow: var(--shadow-cyan);
            transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .start-button:hover {
            background: #22d3ee;
        }

        .start-button:active {
            transform: scale(0.95);
        }

        .upgrade-item {
            background:
                linear-gradient(180deg, rgba(18, 42, 70, 0.92), rgba(8, 22, 39, 0.96));
            border: 1px solid rgba(155, 247, 255, 0.12);
            border-radius: 0.95rem;
            padding: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.9rem;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .upgrade-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border);
        }

        .upgrade-item:active {
            transform: scale(0.95);
        }

        .upgrade-copy {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .upgrade-name {
            color: var(--cyan-soft);
            font-size: 1.05rem;
            line-height: 1;
            letter-spacing: 0.03rem;
        }

        .upgrade-desc {
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 0.22rem;
        }

        .upgrade-owned {
            color: var(--muted-soft);
            font-size: 0.8rem;
            margin-top: 0.35rem;
        }

        .upgrade-owned strong {
            color: var(--text);
            font-weight: 600;
        }

        .upgrade-action {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .upgrade-price {
            min-width: 82px;
            padding: 0.38rem 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.55rem;
            background: linear-gradient(180deg, rgba(255, 107, 181, 0.92), rgba(190, 45, 117, 0.92));
            color: var(--text);
            font-size: 1rem;
            text-align: center;
            box-shadow: 0 0 16px rgba(255, 107, 181, 0.16);
        }

        .upgrade-price.unaffordable {
            opacity: 0.5;
            filter: grayscale(1);
        }

        /* Custom Scrollbar for upgrade list */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.5); border-radius: 2px; }

        @keyframes pulse {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }

        @media (max-width: 640px) {
            .hud {
                padding: 0.9rem 0.8rem 0;
            }

            .hud-label {
                letter-spacing: 0.22rem;
            }

            .gps-display {
                font-size: 0.95rem;
                padding-inline: 0.7rem;
            }

            .panel-title {
                font-size: 1rem;
            }

            .panel-caption {
                font-size: 0.68rem;
            }

            .upgrade-panel {
                padding-inline: 0.7rem;
            }

            .upgrade-item {
                padding: 0.72rem;
            }

            .upgrade-name {
                font-size: 0.98rem;
            }

            .start-button {
                min-width: min(82vw, 17rem);
                padding: 0.9rem 2rem;
            }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "baseClickPower": { "type": "number", "label": "Base Click Power", "value": 1, "min": 1, "max": 100 },
    "coreColor": { "type": "color", "label": "Core Color", "value": "#06b6d4" },
    "droneColor": { "type": "color", "label": "Drone Color", "value": "#ec4899" },
    "bgmVolume": { "type": "number", "label": "Music Volume", "value": 0.2, "min": 0, "max": 1 }
}
</script>

<audio id="bgm_main" data-editable="audio" data-label="BGM Starlight Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_tap" data-editable="audio" data-label="SFX Tap Charge" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_buy" data-editable="audio" data-label="SFX Upgrade Confirm" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="SFX Low Energy" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
<audio id="sfx_auto" data-editable="audio" data-label="SFX Drone Tick" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3" preload="auto"></audio>

<div id="game-container" class="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="ui-layer">

        <div id="hud" class="hud">
            <div class="hud-label font-display">Energy Core</div>
            <div class="hud-score-row">
                <span id="score-display" class="score-display font-display">0</span>
                <span class="hud-unit font-ui">Watts</span>
            </div>
            <div class="gps-display font-display">
                <span id="gps-display">0</span> / sec
            </div>
        </div>

        <!-- [agent-note][stage4] preserved-font-map: display=Press Start 2P ui=Orbitron from catalogs/fonts.json -->
        <!-- [agent-note][stage3] resolved-gif: success/fail feedback overlays from catalogs/gifs.json -->
        <img id="success-gif" class="feedback-gif feedback-gif--success" src="https://i.giphy.com/WOORRezUTVbs9iST3f.gif" alt="Upgrade success reaction" aria-hidden="true">
        <img id="fail-gif" class="feedback-gif feedback-gif--fail" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.gif" alt="Low energy reaction" aria-hidden="true">

        <div id="upgrade-panel" class="upgrade-panel glass">
            <div class="panel-header">
                <h3 class="panel-title font-ui">Systems</h3>
                <div class="panel-caption font-ui">TAP TO UPGRADE</div>
            </div>

            <div id="upgrade-list" class="upgrade-list">
            </div>
        </div>

        <div id="start-screen" class="start-screen glass">
            <h1 class="title font-display">STARLIGHT<br>TYCOON</h1>
            <p class="start-subtitle font-ui">Tap to initialize core</p>
            <button id="start-btn" class="start-button font-display">
                IGNITE
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    Object.keys(window.gameConfigDefs).forEach(k => {
        window.gameConfig[k] = window.gameConfigDefs[k].value;
    });

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'bgmVolume' && audioCtx) {
                // Real-time volume update would go here if gain nodes were exposed globally
            }
        }
    };

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    const sounds = {
        bgm: document.getElementById('bgm_main'),
        tap: document.getElementById('sfx_tap'),
        buy: document.getElementById('sfx_buy'),
        fail: document.getElementById('sfx_fail'),
        auto: document.getElementById('sfx_auto')
    };

    const successGif = document.getElementById('success-gif');
    const failGif = document.getElementById('fail-gif');
    const sfxCooldowns = new Map();
    let bgmGainNode;
    let bgmSourceNode;
    let gifTimers = {};

    function revealGif(el, key, duration = 1200) {
        if (!el) return;
        el.classList.add('is-visible');
        clearTimeout(gifTimers[key]);
        gifTimers[key] = setTimeout(() => el.classList.remove('is-visible'), duration);
    }

    function initAudio() {
        if (audioCtx) {
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            if (sounds.bgm && sounds.bgm.paused) {
                sounds.bgm.volume = 1;
                sounds.bgm.play().catch(() => {});
            }
            return;
        }
        try {
            audioCtx = new AudioContext();

            Object.values(sounds).forEach((el) => {
                if (el) {
                    el.crossOrigin = 'anonymous';
                    el.load();
                }
            });

            if (sounds.bgm && !bgmSourceNode) {
                bgmSourceNode = audioCtx.createMediaElementSource(sounds.bgm);
                bgmGainNode = audioCtx.createGain();
                bgmGainNode.gain.value = Math.max(0, Math.min(1, window.gameConfig.bgmVolume));
                bgmSourceNode.connect(bgmGainNode).connect(audioCtx.destination);
                sounds.bgm.volume = 1;
                sounds.bgm.play().catch(() => {});
            }
        } catch (e) {
            console.warn('Audio init failed', e);
        }
    }

    function playSfx(id, options = {}) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

        const now = performance.now();
        const cooldown = options.cooldown ?? 90;
        if (sfxCooldowns.has(id) && now - sfxCooldowns.get(id) < cooldown) return;
        sfxCooldowns.set(id, now);

        const el = sounds[id];
        if (el) {
            const volume = options.volume ?? 0.55;
            el.pause();
            el.currentTime = 0;
            el.volume = volume;
            el.play().catch(() => {});
            return;
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(720, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    document.addEventListener('visibilitychange', () => {
        if (!sounds.bgm) return;
        if (document.hidden) {
            sounds.bgm.pause();
        } else if (audioCtx && !startScreen.classList.contains('hidden')) {
            // keep intro silent until user starts the run
        } else if (audioCtx) {
            sounds.bgm.play().catch(() => {});
        }
    });

    let canvas = document.getElementById('gameCanvas');
    let ctx = canvas.getContext('2d', { alpha: false });

    let state = {
        score: 0,
        clickCount: 0,
        lastTime: 0,
        particles: [],
        floaters: [],
        coreScale: 1.0,
        coreAngle: 0,
        autoMiners: [],
        gps: 0,
        upgrades: [
            { id: 'cursor', name: 'Plasma Clicker', cost: 15, baseCost: 15, count: 0, power: 1, type: 'click', desc: '+1 Click Power' },
            { id: 'drone', name: 'Auto-Drone', cost: 50, baseCost: 50, count: 0, power: 2, type: 'auto', desc: '+2 Watts/sec' },
            { id: 'array', name: 'Solar Array', cost: 250, baseCost: 250, count: 0, power: 10, type: 'auto', desc: '+10 Watts/sec' },
            { id: 'reactor', name: 'Fusion Reactor', cost: 1000, baseCost: 1000, count: 0, power: 50, type: 'auto', desc: '+50 Watts/sec' },
            { id: 'quantum', name: 'Quantum Drill', cost: 5000, baseCost: 5000, count: 0, power: 200, type: 'auto', desc: '+200 Watts/sec' }
        ]
    };

    let width, height, dpr;
    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    function gameLoop(timestamp) {
        try {
            const dt = Math.min((timestamp - state.lastTime) / 1000, 0.1);
            state.lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        } catch (e) {
            console.error("Game Loop Error:", e);
        }
    }

    function update(dt) {
        state.coreAngle += dt * 0.5;
        state.coreScale += (1.0 - state.coreScale) * 10 * dt;

        state.autoMiners.forEach(miner => {
            miner.angle += miner.speed * dt;
            miner.timer -= dt;
            if (miner.timer <= 0) {
                miner.timer = 1.0;
                state.particles.push(createLaser(miner));
                addScore(miner.power, false);
                playSfx('auto', { volume: 0.14, cooldown: 160 });
            }
        });

        for (let i = state.particles.length - 1; i >= 0; i--) {
            let p = state.particles[i];
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.life <= 0) state.particles.splice(i, 1);
        }

        for (let i = state.floaters.length - 1; i >= 0; i--) {
            let f = state.floaters[i];
            f.life -= dt;
            f.y -= 50 * dt;
            f.alpha = Math.max(0, f.life / 1.0);
            if (f.life <= 0) state.floaters.splice(i, 1);
        }

        updateUI();
    }

    function createLaser(miner) {
        return {
            type: 'laser',
            life: 0.1,
            x: width / 2 + Math.cos(miner.angle) * miner.distance,
            y: height / 3 + Math.sin(miner.angle) * miner.distance,
            vx: 0,
            vy: 0
        };
    }

    function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 50; i++) {
            let x = (Math.sin(i * 132.1 + state.lastTime * 0.00005) * 0.5 + 0.5) * width;
            let y = (Math.cos(i * 45.3 + state.lastTime * 0.00005) * 0.5 + 0.5) * height;
            let s = (Math.sin(i) + 2) * 0.5;
            ctx.globalAlpha = Math.abs(Math.sin(state.lastTime * 0.001 + i));
            ctx.beginPath();
            ctx.arc(x, y, s, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        const cx = width / 2;
        const cy = height / 3;

        state.autoMiners.forEach(miner => {
            let mx = cx + Math.cos(miner.angle) * miner.distance;
            let my = cy + Math.sin(miner.angle) * miner.distance;

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(miner.angle + Math.PI / 2);
            ctx.fillStyle = window.gameConfig.droneColor;

            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(4, 4);
            ctx.lineTo(-4, 4);
            ctx.fill();
            ctx.restore();
        });

        state.particles.forEach(p => {
            if (p.type === 'laser') {
                ctx.strokeStyle = window.gameConfig.droneColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(cx, cy);
                ctx.stroke();
            } else {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        });

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(state.coreScale, state.coreScale);
        ctx.rotate(state.coreAngle);

        let glowSize = 60 + Math.sin(state.lastTime * 0.002) * 5;
        let gradient = ctx.createRadialGradient(0, 0, 20, 0, 0, glowSize);
        gradient.addColorStop(0, window.gameConfig.coreColor);
        gradient.addColorStop(1, 'rgba(6, 182, 212, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            let angle = i * Math.PI / 3;
            let r = 30;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
        }
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = window.gameConfig.coreColor;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            let angle = i * Math.PI / 3;
            let r = 20;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
        }
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        ctx.font = "700 24px 'Orbitron'";
        ctx.textAlign = 'center';
        state.floaters.forEach(f => {
            ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
            ctx.fillText(f.text, f.x, f.y);
        });
    }

    function spawnParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 100 + 50;
            state.particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                size: Math.random() * 3 + 1,
                color: color || '#ffffff'
            });
        }
    }

    function addScore(amount, isTap) {
        state.score += amount;
        if (isTap) {
            state.clickCount++;
            let cx = width / 2;
            let cy = height / 3;

            state.coreScale = 0.9;
            spawnParticles(cx, cy, 8, window.gameConfig.coreColor);

            state.floaters.push({
                text: '+' + Math.floor(amount),
                x: cx + (Math.random() - 0.5) * 40,
                y: cy - 40,
                life: 1.0,
                alpha: 1.0
            });

            playSfx('tap', { volume: 0.32, cooldown: 45 });
        }
    }

    function handleInput(e) {
        e.preventDefault();

        let rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        let cx = width / 2;
        let cy = height / 3;
        let dist = Math.hypot(x - cx, y - cy);

        if (dist < 100) {
            let power = window.gameConfig.baseClickPower;
            let clickUpgrade = state.upgrades.find(u => u.type === 'click');
            if (clickUpgrade) power += clickUpgrade.count * clickUpgrade.power;

            addScore(power, true);
        }
    }

    const scoreEl = document.getElementById('score-display');
    const gpsEl = document.getElementById('gps-display');
    const upgradeList = document.getElementById('upgrade-list');

    function initUI() {
        state.upgrades.forEach((u, index) => {
            let btn = document.createElement('div');
            btn.className = 'upgrade-item';
            btn.id = `upg-${index}`;
            btn.innerHTML = `
                <div class="upgrade-copy">
                    <span class="upgrade-name font-display">${u.name}</span>
                    <span class="upgrade-desc font-ui">${u.desc}</span>
                    <span class="upgrade-owned font-display">Owned: <strong id="count-${index}">0</strong></span>
                </div>
                <div class="upgrade-action">
                    <button class="upgrade-price font-display" id="btn-${index}">
                        ${u.cost}
                    </button>
                </div>
            `;

            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                buyUpgrade(index);
            });

            upgradeList.appendChild(btn);
        });
    }

    function buyUpgrade(index) {
        let u = state.upgrades[index];
        if (state.score >= u.cost) {
            state.score -= u.cost;
            u.count++;
            u.cost = Math.floor(u.baseCost * Math.pow(1.15, u.count));

            playSfx('buy', { volume: 0.45, cooldown: 120 });
            revealGif(successGif, 'success', 1400);

            document.getElementById(`count-${index}`).innerText = u.count;
            document.getElementById(`btn-${index}`).innerText = u.cost;

            if (u.type === 'auto') {
                state.gps += u.power;
                state.autoMiners.push({
                    angle: Math.random() * Math.PI * 2,
                    speed: (Math.random() * 0.5 + 0.5) * (Math.random() > 0.5 ? 1 : -1),
                    distance: 60 + (state.autoMiners.length * 5) % 100,
                    power: u.power,
                    timer: Math.random()
                });
            }
        } else {
            playSfx('fail', { volume: 0.4, cooldown: 180 });
            revealGif(failGif, 'fail', 1100);
        }
    }

    function updateUI() {
        scoreEl.innerText = Math.floor(state.score).toLocaleString();
        gpsEl.innerText = state.gps;

        state.upgrades.forEach((u, index) => {
            let btn = document.getElementById(`btn-${index}`);
            if (state.score >= u.cost) {
                btn.classList.remove('unaffordable');
            } else {
                btn.classList.add('unaffordable');
            }
        });
    }

    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const hud = document.getElementById('hud');
    const upgradePanel = document.getElementById('upgrade-panel');

    startBtn.addEventListener('click', () => {
        initAudio();
        playSfx('buy', { volume: 0.28, cooldown: 0 });
        startScreen.classList.add('hidden');
        hud.classList.add('opacity-visible');
        upgradePanel.classList.add('panel-open');

        state.lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    });

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    // [agent-note][stage4] repaired: mobile-actionability | scoped touch suppression to gameplay surface so start and upgrade taps keep native behavior
    canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    initUI();
});
</script>
</body>
</html>
