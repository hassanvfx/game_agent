<script>
/**
 * §4 Iron Laws & Architecture
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    const configScript = document.getElementById('game-config');
    window.gameConfigDefs = JSON.parse(configScript.textContent);
    window.gameConfig = {};
    
    // Initialize pure config values
    Object.keys(window.gameConfigDefs).forEach(key => {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    });

    window.updateGameConfig = (key, val) => {
        if (window.gameConfigDefs[key]) {
            const def = window.gameConfigDefs[key];
            // Type validation
            if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, Number(val)));
            if (def.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
            
            window.gameConfig[key] = val;
            
            // Hot reload logic
            if (key === 'gameTitle') {
                const el = document.getElementById('ui-title');
                if (el) el.textContent = val;
                document.title = val;
            }
            if (key === 'themeColor') {
                const el = document.getElementById('scoreVal');
                if (el) el.style.color = val;
            }
        }
    };

    // --- Audio System ---
        class AudioManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.buffers = {};
                this.cooldowns = new Map();
                this.unlocked = false;
            }

            unlock() {
                if (this.unlocked) return;
                this.ctx.resume().then(() => {
                    this.unlocked = true;
                    this.playBgm();
                }).catch(() => {});
            }

            async loadSound(id, src) {
                try {
                    const res = await fetch(src);
                    const arrayBuffer = await res.arrayBuffer();
                    this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn('Audio load failed, using fallback', id);
                    this.buffers[id] = 'fallback';
                }
            }

            playBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    el.volume = 0.2;
                    el.currentTime = 0;
                    el.play().catch(() => {});
                }
            }

            stopBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    el.pause();
                    el.currentTime = 0;
                }
            }

            playSfx(id, type = 'beep', cooldown = 0) {
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                const now = performance.now();
                const lastPlay = this.cooldowns.get(id) || 0;
                if (cooldown && now - lastPlay < cooldown) return;
                this.cooldowns.set(id, now);

                const buffer = this.buffers[id];
                if (buffer && buffer !== 'fallback') {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = buffer;
                    gain.gain.value = id === 'sfx_crash' ? 0.35 : id === 'sfx_ui' ? 0.3 : 0.4;
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(0);
                } else {
                    this.synthesize(type);
                }
            }

            synthesize(type) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'explosion') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                }
            }
        }

    const audio = new AudioManager();
    const feedback = {
        crashGif: document.getElementById('crash-gif'),
        winGif: document.getElementById('win-gif'),
        timers: new Map()
    };

    function flashGif(key, duration = 900) {
        const el = feedback[key];
        if (!el) return;
        clearTimeout(feedback.timers.get(key));
        el.classList.remove('hidden', 'opacity-0');
        const timeout = setTimeout(() => {
            el.classList.add('opacity-0');
            setTimeout(() => el.classList.add('hidden'), 250);
        }, duration);
        feedback.timers.set(key, timeout);
    }

    // Preload SFX
    ['sfx_hit', 'sfx_crash', 'sfx_win', 'sfx_fail', 'sfx_ui'].forEach(id => {
        const el = document.getElementById(id);
        if (el) audio.loadSound(id, el.src);
    });

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // State
    let gameState = 'START'; // START, PLAY, GAME_OVER
    let lastTime = 0;
    let scoreDistance = 0; // Miles
    let gameSpeed = 1;
    let roadOffset = 0;
    
    // Entities
    const player = { x: 0, y: 0, w: 50, h: 80, hp: 100, maxHp: 100 };
    const enemy = { x: 0, y: 0, w: 60, h: 100, hp: 500, maxHp: 500, dir: 1, moveTimer: 0 };
    let bullets = [];
    let particles = [];
    let obstacles = []; // Debris from van
    let roadLines = [];

    // Input
    let input = { active: false, x: 0 };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Reset positions if resizing during play
        if (gameState === 'START') {
            player.x = window.innerWidth / 2;
            player.y = window.innerHeight - 150;
            enemy.x = window.innerWidth / 2;
            enemy.y = 150;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handlers
    const handleStart = (e) => {
        if (gameState !== 'PLAY') return;
        input.active = true;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
        audio.unlock();
    };
    
    const handleMove = (e) => {
        if (!input.active) return;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
    };

    const handleEnd = () => {
        input.active = false;
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleStart(e);
    }, { passive: false });
    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        handleMove(e);
    }, { passive: false });
    canvas.addEventListener('pointerup', handleEnd);
    canvas.addEventListener('pointercancel', handleEnd);

    // Game Loop
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        if (gameState !== 'PLAY') return;

        // Config sync
        gameSpeed = window.gameConfig.gameSpeed;
        const steerSpeed = window.gameConfig.heroSpeed * 60;

        // Player Movement (Lerp towards input)
        if (input.active) {
            const dx = input.x - player.x;
            player.x += dx * steerSpeed * dt * 0.1;
        }
        // Clamp player
        player.x = Math.max(player.w/2, Math.min(window.innerWidth - player.w/2, player.x));

        // Enemy AI (Sway and evade)
        enemy.moveTimer += dt;
        if (enemy.moveTimer > 2) {
            enemy.dir = Math.random() > 0.5 ? 1 : -1;
            enemy.moveTimer = 0;
        }
        enemy.x += enemy.dir * 50 * dt;
        // Keep enemy in bounds
        if (enemy.x < 50 || enemy.x > window.innerWidth - 50) enemy.dir *= -1;
        enemy.x = Math.max(enemy.w/2, Math.min(window.innerWidth - enemy.w/2, enemy.x));

        // Road Scrolling
        roadOffset += 800 * gameSpeed * dt;
        if (roadOffset > 100) roadOffset = 0;
        scoreDistance += (10 * gameSpeed * dt) / 100; // Miles

        // Win Condition
        if (scoreDistance >= 100 || enemy.hp <= 0) {
            endGame(true);
        }

        // Shooting (Auto-fire)
        player.fireTimer = (player.fireTimer || 0) + dt;
        if (player.fireTimer > 0.15) {
            bullets.push({ x: player.x - 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            bullets.push({ x: player.x + 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            player.fireTimer = 0;
        }

        // Enemy Shooting / Debris
        enemy.fireTimer = (enemy.fireTimer || 0) + dt;
        if (enemy.fireTimer > 1.0) {
            // Drop debris
            obstacles.push({ x: enemy.x, y: enemy.y + 50, w: 40, h: 40, active: true });
            enemy.fireTimer = 0;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;

            // Collision with Enemy
            if (b.type === 'player' && 
                Math.abs(b.x - enemy.x) < enemy.w/2 + 5 && 
                Math.abs(b.y - enemy.y) < enemy.h/2 + 5) {
                
                enemy.hp -= 5;
                spawnParticles(b.x, b.y, '#ffffff', 5);
                audio.playSfx('sfx_hit', 'hit', 70);
                bullets.splice(i, 1);
                continue;
            }

            if (b.y < -50 || b.y > window.innerHeight + 50) bullets.splice(i, 1);
        }

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const o = obstacles[i];
            o.y += 600 * dt; // Move down relative to road speed

            // Collision with Player
            if (o.active && 
                Math.abs(o.x - player.x) < (o.w + player.w)/2 * 0.8 &&
                Math.abs(o.y - player.y) < (o.h + player.h)/2 * 0.8) {
                
                player.hp -= 20;
                o.active = false;
                spawnParticles(player.x, player.y, '#ef4444', 15);
                audio.playSfx('sfx_crash', 'explosion', 220);
                flashGif('crashGif', 850);

                // Screen shake
                shake = 0.5;
            }

            if (o.y > window.innerHeight + 100) obstacles.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Game Over Check
        if (player.hp <= 0) endGame(false);

        // Update UI
        document.getElementById('scoreVal').textContent = scoreDistance.toFixed(1);
        document.getElementById('healthBar').style.width = Math.max(0, player.hp) + '%';
        
        // Shake decay
        if (shake > 0) shake = Math.max(0, shake - dt * 2);
    }

    let shake = 0;

    function spawnParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 200 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    function roundedRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
    }

    function drawHeart(x, y, s, fill, stroke = '#1b1230') {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.beginPath();
        ctx.moveTo(0, 0.35);
        ctx.bezierCurveTo(-1.1, -0.35, -0.85, -1.25, -0.18, -1.0);
        ctx.bezierCurveTo(0, -0.92, 0.14, -0.66, 0, -0.42);
        ctx.bezierCurveTo(-0.14, -0.66, 0, -0.92, 0.18, -1.0);
        ctx.bezierCurveTo(0.85, -1.25, 1.1, -0.35, 0, 0.35);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 0.14;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawBackground(roadX, roadW) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#23113f');
        sky.addColorStop(0.55, '#160a2a');
        sky.addColorStop(1, '#12081f');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(w / 2, h * 0.08, 20, w / 2, h * 0.08, Math.max(w, h) * 0.72);
        glow.addColorStop(0, 'rgba(255, 209, 102, 0.26)');
        glow.addColorStop(0.34, 'rgba(255, 143, 183, 0.12)');
        glow.addColorStop(1, 'rgba(18, 8, 31, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.globalAlpha = 0.42;
        for (let i = -2; i < 12; i++) {
            const y = ((i * 92) + (roadOffset * 0.35)) % (h + 140) - 70;
            const leftX = roadX * 0.42 + ((i % 2) * 24);
            const rightX = roadX + roadW + (w - roadX - roadW) * 0.52 - ((i % 2) * 20);
            drawHeart(leftX, y, 8, '#ff8fb7', 'rgba(27,18,48,0.6)');
            drawHeart(rightX, y + 36, 7, '#ffd166', 'rgba(27,18,48,0.6)');
            ctx.fillStyle = i % 3 === 0 ? 'rgba(68,231,255,0.18)' : 'rgba(255,240,199,0.16)';
            roundedRect(leftX + 22, y + 18, 58, 22, 11);
            ctx.fill();
            ctx.fillStyle = 'rgba(27,18,48,0.35)';
            ctx.font = '700 10px Rajdhani, sans-serif';
            ctx.fillText(i % 3 === 0 ? 'LOL MOM' : 'LOVE U', leftX + 31, y + 33);
            ctx.fillStyle = 'rgba(182,255,59,0.14)';
            ctx.fillRect(rightX - 72, y - 12, 12, 12);
            ctx.fillRect(rightX - 42, y + 12, 8, 8);
        }
        ctx.restore();

        ctx.fillStyle = 'rgba(18, 8, 31, 0.34)';
        ctx.fillRect(roadX, 0, roadW, h);
    }

    function drawMomRoad(roadX, roadW) {
        const roadGrad = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
        roadGrad.addColorStop(0, '#3a1b53');
        roadGrad.addColorStop(0.18, '#251138');
        roadGrad.addColorStop(0.5, '#1e0f2e');
        roadGrad.addColorStop(0.82, '#251138');
        roadGrad.addColorStop(1, '#3a1b53');
        ctx.fillStyle = roadGrad;
        ctx.fillRect(roadX, 0, roadW, window.innerHeight);

        ctx.fillStyle = 'rgba(255, 143, 183, 0.34)';
        ctx.fillRect(roadX, 0, 6, window.innerHeight);
        ctx.fillRect(roadX + roadW - 6, 0, 6, window.innerHeight);

        ctx.fillStyle = 'rgba(255, 240, 199, 0.5)';
        for (let i = -1; i < 10; i++) {
            let y = (i * 100) + roadOffset;
            roundedRect(window.innerWidth / 2 - 5, y, 10, 48, 5);
            ctx.fill();
            drawHeart(window.innerWidth / 2, y + 68, 4.5, 'rgba(255, 209, 102, 0.75)', 'rgba(27,18,48,0.35)');
        }

        ctx.save();
        ctx.globalAlpha = 0.55;
        for (let i = -1; i < 8; i++) {
            const y = (i * 145 + roadOffset * 0.65) % (window.innerHeight + 160) - 80;
            ctx.fillStyle = i % 2 ? 'rgba(255, 209, 102, 0.42)' : 'rgba(255, 143, 183, 0.4)';
            roundedRect(roadX + 16, y, 28, 52, 10);
            ctx.fill();
            roundedRect(roadX + roadW - 44, y + 48, 28, 52, 10);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawMomMobile() {
        const x = player.x - player.w / 2;
        const y = player.y - player.h / 2;
        ctx.save();
        ctx.shadowColor = 'rgba(68, 231, 255, 0.35)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#1b1230';
        roundedRect(x - 4, y + 3, player.w + 8, player.h, 18);
        ctx.fill();
        ctx.shadowBlur = 0;

        const body = ctx.createLinearGradient(x, y, x + player.w, y + player.h);
        body.addColorStop(0, '#fff0c7');
        body.addColorStop(0.42, '#ff8fb7');
        body.addColorStop(1, '#ff5f6d');
        ctx.fillStyle = body;
        roundedRect(x, y, player.w, player.h, 16);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1b1230';
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.66)';
        roundedRect(x + 9, y + 9, player.w - 18, 20, 8);
        ctx.fill();
        ctx.fillStyle = '#44e7ff';
        roundedRect(x + 13, y + 14, player.w - 26, 10, 5);
        ctx.fill();

        ctx.fillStyle = '#ffd166';
        roundedRect(x + 10, y + 42, player.w - 20, 24, 7);
        ctx.fill();
        ctx.strokeStyle = '#1b1230';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#1b1230';
        ctx.font = '700 10px Rajdhani, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('MOM', player.x, y + 57);

        drawHeart(player.x, y + 36, 6, '#ff3864');
        ctx.fillStyle = '#1b1230';
        roundedRect(x - 6, y + 16, 7, 20, 4);
        ctx.fill();
        roundedRect(x + player.w - 1, y + 16, 7, 20, 4);
        ctx.fill();
        roundedRect(x - 6, y + 53, 7, 20, 4);
        ctx.fill();
        roundedRect(x + player.w - 1, y + 53, 7, 20, 4);
        ctx.fill();

        const time = Date.now() / 100;
        ctx.globalAlpha = 0.62;
        ctx.fillStyle = Math.floor(time) % 2 === 0 ? 'rgba(255, 56, 100, 0.55)' : 'rgba(68, 231, 255, 0.55)';
        ctx.beginPath();
        ctx.arc(player.x + (Math.floor(time) % 2 === 0 ? -15 : 15), player.y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawRunawayVan() {
        const x = enemy.x - enemy.w / 2;
        const y = enemy.y - enemy.h / 2;
        ctx.save();
        ctx.shadowColor = 'rgba(182,255,59,0.3)';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#1b1230';
        roundedRect(x - 4, y + 4, enemy.w + 8, enemy.h, 14);
        ctx.fill();
        ctx.shadowBlur = 0;

        const body = ctx.createLinearGradient(x, y, x + enemy.w, y + enemy.h);
        body.addColorStop(0, '#8d4dff');
        body.addColorStop(0.52, '#ff3864');
        body.addColorStop(1, '#23113f');
        ctx.fillStyle = body;
        roundedRect(x, y, enemy.w, enemy.h, 12);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1b1230';
        ctx.stroke();

        ctx.fillStyle = '#fff0c7';
        roundedRect(x + 8, y + 10, enemy.w - 16, 24, 8);
        ctx.fill();
        ctx.fillStyle = '#1b1230';
        ctx.font = '700 11px Rajdhani, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('BRUNCH', enemy.x, y + 26);

        ctx.fillStyle = '#ffd166';
        roundedRect(x + 10, y + 54, enemy.w - 20, 20, 8);
        ctx.fill();
        ctx.fillStyle = '#1b1230';
        ctx.fillText('RUN', enemy.x, y + 68);

        ctx.fillStyle = '#b6ff3b';
        ctx.beginPath();
        ctx.arc(x + 14, y + 42, 4, 0, Math.PI * 2);
        ctx.arc(x + enemy.w - 14, y + 42, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawObstacle(o, idx) {
        if (!o.active) return;
        const x = o.x - o.w / 2;
        const y = o.y - o.h / 2;
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(((roadOffset / 120) + idx) * 0.08);
        ctx.translate(-o.x, -o.y);
        ctx.fillStyle = '#1b1230';
        roundedRect(x - 3, y + 3, o.w + 6, o.h, 10);
        ctx.fill();
        const fill = idx % 3 === 0 ? '#ff3864' : idx % 3 === 1 ? '#8d4dff' : '#b6ff3b';
        ctx.fillStyle = fill;
        roundedRect(x, y, o.w, o.h, 10);
        ctx.fill();
        ctx.strokeStyle = '#1b1230';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#fff0c7';
        ctx.font = '700 18px Rajdhani, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(idx % 3 === 0 ? '!?': idx % 3 === 1 ? 'LOL' : 'NO', o.x, o.y + 6);
        ctx.restore();
    }

    function draw() {
        const roadW = Math.min(600, window.innerWidth);
        const roadX = (window.innerWidth - roadW) / 2;
        drawBackground(roadX, roadW);

        // Shake effect
        let sx = 0, sy = 0;
        if (shake > 0) {
            sx = (Math.random() - 0.5) * shake * 50;
            sy = (Math.random() - 0.5) * shake * 50;
        }
        ctx.save();
        ctx.translate(sx, sy);

        drawMomRoad(roadX, roadW);

        // Draw Particles as heart/glitch bursts
        particles.forEach(p => {
            ctx.globalAlpha = p.life / 0.5;
            if (p.color === '#ffffff') {
                drawHeart(p.x, p.y, Math.max(2.5, p.size * 1.5), '#ffd166', 'rgba(27,18,48,0.55)');
            } else {
                ctx.fillStyle = '#ff3864';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size + 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#44e7ff';
                ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 1.5, p.size * 1.5);
            }
            ctx.globalAlpha = 1;
        });

        // Draw Obstacles (same objects/hitboxes, Mother’s Day brainrot hazard skins)
        obstacles.forEach((o, idx) => drawObstacle(o, idx));

        // Draw Player as Mom-mobile gift cruiser
        drawMomMobile();

        // Draw Enemy as runaway brunch van
        drawRunawayVan();
        
        // Enemy Health Bar / runaway vibe meter
        const hpPct = Math.max(0, enemy.hp / enemy.maxHp);
        ctx.fillStyle = '#1b1230';
        roundedRect(enemy.x - 34, enemy.y - 64, 68, 9, 5);
        ctx.fill();
        ctx.fillStyle = '#ff3864';
        roundedRect(enemy.x - 30, enemy.y - 61, 60, 4, 3);
        ctx.fill();
        ctx.fillStyle = '#ffd166';
        roundedRect(enemy.x - 30, enemy.y - 61, 60 * hpPct, 4, 3);
        ctx.fill();

        // Draw Bullets as heart-card appreciation beams
        bullets.forEach(b => {
            ctx.fillStyle = '#fff0c7';
            roundedRect(b.x - 4, b.y - 13, 8, 22, 4);
            ctx.fill();
            ctx.strokeStyle = '#ff8fb7';
            ctx.lineWidth = 2;
            ctx.stroke();
            drawHeart(b.x, b.y - 2, 2.6, '#ff3864', '#1b1230');
        });

        ctx.restore();
    }

    function initGame() {
        player.x = window.innerWidth / 2;
        player.y = window.innerHeight - 150;
        player.hp = player.maxHp;
        
        enemy.x = window.innerWidth / 2;
        enemy.y = 150;
        enemy.hp = enemy.maxHp;
        
        bullets = [];
        particles = [];
        obstacles = [];
        scoreDistance = 0;
        shake = 0;
        
        gameState = 'PLAY';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('siren-fx').classList.remove('opacity-0');
        
        audio.unlock();
        audio.playSfx('sfx_ui', 'win', 180);
    }

    function endGame(win) {
        gameState = 'GAME_OVER';
        audio.stopBgm();
        audio.playSfx(win ? 'sfx_win' : 'sfx_fail', win ? 'win' : 'explosion', 300);
        if (win) {
            flashGif('winGif', 2200);
        } else {
            flashGif('crashGif', 1200);
        }
        
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('siren-fx').classList.add('opacity-0');
        
        const title = document.getElementById('go-title');
        title.textContent = win ? "MOM SHRINE COMPLETE" : "VIBE OVERLOADED";
        title.className = win ? "text-5xl font-bold text-green-400 mb-4 neon-text" : "text-5xl font-bold text-red-500 mb-4 neon-text";
        
        document.getElementById('finalScore').textContent = scoreDistance.toFixed(1);
    }

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', initGame);
    document.getElementById('restart-btn').addEventListener('click', initGame);

    // Initial Draw
    requestAnimationFrame(gameLoop);
});
</script>
