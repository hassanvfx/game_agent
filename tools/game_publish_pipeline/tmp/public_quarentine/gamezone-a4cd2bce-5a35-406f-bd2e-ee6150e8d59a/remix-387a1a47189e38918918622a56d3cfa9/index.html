            radial-gradient(circle at top, rgba(36, 200, 255, 0.12), transparent 30%),
            linear-gradient(180deg, var(--bg-roadside), var(--bg-night) 68%);

        canvas { display: block; touch-action: none; }

        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .z-50 { z-index: 50; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .w-32 { width: 8rem; }
        .h-4 { height: 1rem; }
        .overflow-hidden { overflow: hidden; }
        .select-none { user-select: none; -webkit-user-select: none; }

        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.75rem; }
        .rounded-xl { border-radius: 1rem; }
        .border { border-width: 1px; border-style: solid; }
        .border-gray-600 { border-color: rgba(75, 85, 99, 0.95); }
        .border-b-4 { border-bottom-width: 4px; border-bottom-style: solid; }

        .border-red-800 { border-bottom-color: #991b1b; }
        .bg-gray-800 { background: rgba(31, 41, 55, 0.95); }
        .bg-blue-500 { background: #3b82f6; }
        .bg-blue-600 { background: #2563eb; }
        .bg-red-600 { background: #dc2626; }
        .text-white { color: #fff; }
        .text-yellow-400 { color: #facc15; }
        .text-blue-300 { color: #93c5fd; }
        .text-gray-300 { color: #d1d5db; }

<script>
/**
 * §4 Iron Laws & Architecture
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    const configScript = document.getElementById('game-config');
    window.gameConfigDefs = JSON.parse(configScript.textContent);
    window.gameConfig = {};
    
    // Initialize pure config values
    Object.keys(window.gameConfigDefs).forEach(key => {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    });

    window.updateGameConfig = (key, val) => {
        if (window.gameConfigDefs[key]) {
            const def = window.gameConfigDefs[key];
            // Type validation
            if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, Number(val)));
            if (def.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
            
            window.gameConfig[key] = val;
            
            // Hot reload logic
            if (key === 'gameTitle') {
                const el = document.getElementById('ui-title');
                if (el) el.textContent = val;
                document.title = val;
            }
            if (key === 'themeColor') {
                const el = document.getElementById('scoreVal');
                if (el) el.style.color = val;
            }
        }
    };

    // --- Audio System ---
        class AudioManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.buffers = {};
                this.cooldowns = new Map();
                this.unlocked = false;
            }

            unlock() {
                if (this.unlocked) return;
                this.ctx.resume().then(() => {
                    this.unlocked = true;
                    this.playBgm();
                }).catch(() => {});
            }

            async loadSound(id, src) {
                try {
                    const res = await fetch(src);
                    const arrayBuffer = await res.arrayBuffer();
                    this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn('Audio load failed, using fallback', id);
                    this.buffers[id] = 'fallback';
                }
            }

            playBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    el.volume = 0.2;
                    el.currentTime = 0;
                    el.play().catch(() => {});
                }
            }

            stopBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    el.pause();
                    el.currentTime = 0;
                }
            }

            playSfx(id, type = 'beep', cooldown = 0) {
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                const now = performance.now();
                const lastPlay = this.cooldowns.get(id) || 0;
                if (cooldown && now - lastPlay < cooldown) return;
                this.cooldowns.set(id, now);

                const buffer = this.buffers[id];
                if (buffer && buffer !== 'fallback') {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = buffer;
                    gain.gain.value = id === 'sfx_crash' ? 0.35 : id === 'sfx_ui' ? 0.3 : 0.4;
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(0);
                } else {
                    this.synthesize(type);
                }
            }

            synthesize(type) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'explosion') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                }
            }
        }

    const audio = new AudioManager();
    const feedback = {
        crashGif: document.getElementById('crash-gif'),
        winGif: document.getElementById('win-gif'),
        timers: new Map()
    };

    function flashGif(key, duration = 900) {
        const el = feedback[key];
        if (!el) return;
        clearTimeout(feedback.timers.get(key));
        el.classList.remove('hidden', 'opacity-0');
        const timeout = setTimeout(() => {
            el.classList.add('opacity-0');
            setTimeout(() => el.classList.add('hidden'), 250);
        }, duration);
        feedback.timers.set(key, timeout);
    }

    // Preload SFX
    ['sfx_hit', 'sfx_crash', 'sfx_win', 'sfx_fail', 'sfx_ui'].forEach(id => {
        const el = document.getElementById(id);
        if (el) audio.loadSound(id, el.src);
    });

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // State
    let gameState = 'START'; // START, PLAY, GAME_OVER
    let lastTime = 0;
    let scoreDistance = 0; // Miles
    let gameSpeed = 1;
    let roadOffset = 0;
    
    // Entities
    const player = { x: 0, y: 0, w: 50, h: 80, hp: 100, maxHp: 100 };
    const enemy = { x: 0, y: 0, w: 60, h: 100, hp: 500, maxHp: 500, dir: 1, moveTimer: 0 };
    let bullets = [];
    let particles = [];
    let obstacles = []; // Debris from van
    let roadLines = [];

    // Input
    let input = { active: false, x: 0 };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Reset positions if resizing during play
        if (gameState === 'START') {
            player.x = window.innerWidth / 2;
            player.y = window.innerHeight - 150;
            enemy.x = window.innerWidth / 2;
            enemy.y = 150;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handlers
    const handleStart = (e) => {
        if (gameState !== 'PLAY') return;
        input.active = true;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
        audio.unlock();
    };
    
    const handleMove = (e) => {
        if (!input.active) return;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
    };

    const handleEnd = () => {
        input.active = false;
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleStart(e);
    }, { passive: false });
    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        handleMove(e);
    }, { passive: false });
    canvas.addEventListener('pointerup', handleEnd);
    canvas.addEventListener('pointercancel', handleEnd);

    // Game Loop
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        if (gameState !== 'PLAY') return;

        // Config sync
        gameSpeed = window.gameConfig.gameSpeed;
        const steerSpeed = window.gameConfig.heroSpeed * 60;

        // Player Movement (Lerp towards input)
        if (input.active) {
            const dx = input.x - player.x;
            player.x += dx * steerSpeed * dt * 0.1;
        }
        // Clamp player
        player.x = Math.max(player.w/2, Math.min(window.innerWidth - player.w/2, player.x));

        // Enemy AI (Sway and evade)
        enemy.moveTimer += dt;
        if (enemy.moveTimer > 2) {
            enemy.dir = Math.random() > 0.5 ? 1 : -1;
            enemy.moveTimer = 0;
        }
        enemy.x += enemy.dir * 50 * dt;
        // Keep enemy in bounds
        if (enemy.x < 50 || enemy.x > window.innerWidth - 50) enemy.dir *= -1;
        enemy.x = Math.max(enemy.w/2, Math.min(window.innerWidth - enemy.w/2, enemy.x));

        // Road Scrolling
        roadOffset += 800 * gameSpeed * dt;
        if (roadOffset > 100) roadOffset = 0;
        scoreDistance += (10 * gameSpeed * dt) / 100; // Miles

        // Win Condition
        if (scoreDistance >= 100 || enemy.hp <= 0) {
            endGame(true);
        }

        // Shooting (Auto-fire)
        player.fireTimer = (player.fireTimer || 0) + dt;
        if (player.fireTimer > 0.15) {
            bullets.push({ x: player.x - 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            bullets.push({ x: player.x + 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            player.fireTimer = 0;
        }

        // Enemy Shooting / Debris
        enemy.fireTimer = (enemy.fireTimer || 0) + dt;
        if (enemy.fireTimer > 1.0) {
            // Drop debris
            obstacles.push({ x: enemy.x, y: enemy.y + 50, w: 40, h: 40, active: true });
            enemy.fireTimer = 0;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;

            // Collision with Enemy
            if (b.type === 'player' && 
                Math.abs(b.x - enemy.x) < enemy.w/2 + 5 && 
                Math.abs(b.y - enemy.y) < enemy.h/2 + 5) {
                
                enemy.hp -= 5;
                spawnParticles(b.x, b.y, '#ffd66e', 5);
                audio.playSfx('sfx_hit', 'hit', 70);
                bullets.splice(i, 1);
                continue;
            }

            if (b.y < -50 || b.y > window.innerHeight + 50) bullets.splice(i, 1);
        }

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const o = obstacles[i];
            o.y += 600 * dt; // Move down relative to road speed

            // Collision with Player
            if (o.active && 
                Math.abs(o.x - player.x) < (o.w + player.w)/2 * 0.8 &&
                Math.abs(o.y - player.y) < (o.h + player.h)/2 * 0.8) {
                
                player.hp -= 20;
                o.active = false;
                spawnParticles(player.x, player.y, '#6fe3ff', 15);
                audio.playSfx('sfx_crash', 'explosion', 220);
                flashGif('crashGif', 850);

                // Screen shake
                shake = 0.5;
            }

            if (o.y > window.innerHeight + 100) obstacles.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Game Over Check
        if (player.hp <= 0) endGame(false);

        // Update UI
        document.getElementById('scoreVal').textContent = scoreDistance.toFixed(1);
        document.getElementById('healthBar').style.width = Math.max(0, player.hp) + '%';
        
        // Shake decay
        if (shake > 0) shake = Math.max(0, shake - dt * 2);
    }

    let shake = 0;

    function spawnParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 200 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    function getVisualPhase() {
        if (scoreDistance >= 80) return 5;
        if (scoreDistance >= 60) return 4;
        if (scoreDistance >= 40) return 3;
        if (scoreDistance >= 20) return 2;
        return 1;
    }

    function drawStar(cx, cy, r, color = 'rgba(255, 214, 110, 0.55)') {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.lineTo(r, 0);
        ctx.moveTo(0, -r);
        ctx.lineTo(0, r);
        ctx.stroke();
        ctx.restore();
    }

    function drawHogwartsSilhouette(w, h, phase) {
        const base = h - 84;
        ctx.save();
        ctx.fillStyle = 'rgba(2, 6, 17, 0.82)';
        const towers = [
            [w * 0.07, 54, 92], [w * 0.16, 34, 132], [w * 0.28, 46, 108],
            [w * 0.72, 42, 118], [w * 0.84, 34, 146], [w * 0.93, 52, 98]
        ];
        towers.forEach(([x, tw, th]) => {
            ctx.fillRect(x - tw / 2, base - th, tw, th);
            ctx.beginPath();
            ctx.moveTo(x - tw * 0.62, base - th);
            ctx.lineTo(x, base - th - 34);
            ctx.lineTo(x + tw * 0.62, base - th);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = phase >= 4 ? 'rgba(255, 214, 110, 0.42)' : 'rgba(247, 223, 156, 0.25)';
            ctx.fillRect(x - 4, base - th + 30, 8, 16);
            ctx.fillStyle = 'rgba(2, 6, 17, 0.82)';
        });
        ctx.fillRect(0, base - 22, w, 44);
        ctx.restore();
    }

    function drawDecorativeBackground(phase) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const t = performance.now() * 0.001;
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, phase >= 5 ? '#04111e' : '#071025');
        sky.addColorStop(0.42, phase >= 2 ? '#10283d' : '#10253a');
        sky.addColorStop(1, '#030712');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(255, 214, 110, 0.72)';
        ctx.beginPath();
        ctx.arc(w * 0.18, 78, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(7, 16, 37, 0.28)';
        ctx.beginPath();
        ctx.arc(w * 0.195, 68, 29, 0, Math.PI * 2);
        ctx.fill();

        if (phase >= 5) {
            const aurora = ctx.createRadialGradient(w * 0.72, 92, 4, w * 0.72, 92, Math.max(w, h) * 0.46);
            aurora.addColorStop(0, 'rgba(103, 232, 121, 0.28)');
            aurora.addColorStop(0.28, 'rgba(103, 232, 121, 0.12)');
            aurora.addColorStop(1, 'rgba(103, 232, 121, 0)');
            ctx.fillStyle = aurora;
            ctx.fillRect(0, 0, w, h * 0.55);
            ctx.strokeStyle = 'rgba(103, 232, 121, 0.34)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(w * 0.74, 82, 24 + Math.sin(t * 2) * 3, Math.PI * 0.14, Math.PI * 1.3);
            ctx.stroke();
        }

        for (let i = 0; i < 34; i++) {
            const x = (i * 73 + Math.sin(i) * 31) % w;
            const y = (i * 47 + roadOffset * 0.12) % Math.max(1, h * 0.72);
            drawStar(x, y, (i % 3) + 2, i % 5 === 0 ? 'rgba(111, 227, 255, 0.32)' : 'rgba(255, 214, 110, 0.34)');
        }

        ctx.strokeStyle = phase >= 3 ? 'rgba(255, 214, 110, 0.26)' : 'rgba(111, 227, 255, 0.18)';
        ctx.lineWidth = 3;
        for (let x = phase >= 4 ? 18 : -80; x < w + 90; x += phase >= 4 ? 92 : 160) {
            const y = ((roadOffset * (phase >= 4 ? 0.42 : 0.22)) + x * 0.37) % h;
            ctx.beginPath();
            ctx.moveTo(x, y - 80);
            ctx.lineTo(x + (phase >= 4 ? 46 : 58), y);
            ctx.lineTo(x - (phase >= 4 ? 18 : 26), y + 78);
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(3, 8, 18, 0.72)';
        for (let x = -36; x < w + 80; x += 74) {
            const sway = Math.sin(t + x) * 8;
            const base = h - 68 + ((x * 17) % 24);
            ctx.beginPath();
            ctx.moveTo(x, base);
            ctx.lineTo(x + 24 + sway, base - (phase >= 2 ? 138 : 90));
            ctx.lineTo(x + 54, base);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(x + 29, base - 52, 14, 52);
        }

        if (phase >= 3) {
            ctx.strokeStyle = 'rgba(247, 223, 156, 0.24)';
            ctx.lineWidth = 4;
            [w * 0.08, w * 0.92].forEach(x => {
                for (let j = 0; j < 3; j++) {
                    const y = 132 + j * 118 + (roadOffset * 0.18 % 90);
                    ctx.beginPath();
                    ctx.arc(x, y, 23, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        }

        drawHogwartsSilhouette(w, h, phase);

        ctx.fillStyle = 'rgba(111, 227, 255, 0.06)';
        for (let i = 0; i < 5; i++) {
            const y = ((roadOffset * 0.32) + i * 148) % (h + 160) - 80;
            ctx.beginPath();
            ctx.ellipse(w * (0.5 + Math.sin(t + i) * 0.06), y, w * 0.44, 18 + i * 2, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(4, 8, 16, 0.55)';
        const owlX = (w + 80 - ((t * 32) % (w + 160)));
        const owlY = 118 + Math.sin(t * 1.6) * 20;
        ctx.beginPath();
        ctx.ellipse(owlX - 8, owlY, 13, 5, -0.28, 0, Math.PI * 2);
        ctx.ellipse(owlX + 8, owlY, 13, 5, 0.28, 0, Math.PI * 2);
        ctx.arc(owlX, owlY, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    function draw() {
        const phase = getVisualPhase();
        drawDecorativeBackground(phase);

        // Shake effect
        let sx = 0, sy = 0;
        if (shake > 0) {
            sx = (Math.random() - 0.5) * shake * 50;
            sy = (Math.random() - 0.5) * shake * 50;
        }
        ctx.save();
        ctx.translate(sx, sy);

        // Draw magical flight lane
        const roadW = Math.min(600, window.innerWidth);
        const roadX = (window.innerWidth - roadW) / 2;
        const laneGrad = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
        laneGrad.addColorStop(0, 'rgba(4, 8, 18, 0.34)');
        laneGrad.addColorStop(0.16, 'rgba(9, 14, 32, 0.76)');
        laneGrad.addColorStop(0.5, 'rgba(19, 32, 58, 0.92)');
        laneGrad.addColorStop(0.84, 'rgba(9, 14, 32, 0.76)');
        laneGrad.addColorStop(1, 'rgba(4, 8, 18, 0.34)');
        ctx.fillStyle = laneGrad;
        ctx.fillRect(roadX, 0, roadW, window.innerHeight);

        ctx.strokeStyle = 'rgba(255, 214, 110, 0.22)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(roadX + roadW * 0.22, 0);
        ctx.lineTo(roadX + roadW * 0.1, window.innerHeight);
        ctx.moveTo(roadX + roadW * 0.78, 0);
        ctx.lineTo(roadX + roadW * 0.9, window.innerHeight);
        ctx.stroke();

        // Rune lane markers
        ctx.fillStyle = phase >= 5 ? 'rgba(103, 232, 121, 0.32)' : 'rgba(255, 214, 110, 0.36)';
        ctx.strokeStyle = 'rgba(255, 214, 110, 0.22)';
        ctx.textAlign = 'center';
        ctx.font = '20px Cinzel, Georgia, serif';
        for (let i = -1; i < 10; i++) {
            let y = (i * 100) + roadOffset;
            ctx.fillText(phase >= 4 ? 'ϟ' : '✦', window.innerWidth/2, y + 28);
            ctx.beginPath();
            ctx.moveTo(window.innerWidth/2 - 18, y + 48);
            ctx.lineTo(window.innerWidth/2, y + 74);
            ctx.lineTo(window.innerWidth/2 + 18, y + 48);
            ctx.stroke();
            ctx.fillRect(window.innerWidth/2 - 1.5, y + 42, 3, 38);
        }
        ctx.textAlign = 'start';

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 0.5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Draw Obstacles (cursed hazards; same 40x40 gameplay footprint)
        obstacles.forEach(o => {
            if (!o.active) return;
            const pulse = 0.85 + Math.sin((performance.now() * 0.007) + o.y * 0.03) * 0.15;
            const isBludger = phase === 3;
            const isComet = phase >= 5;
            ctx.save();
            ctx.translate(o.x, o.y);
            ctx.fillStyle = isBludger ? '#201326' : isComet ? '#10301f' : '#24113d';
            ctx.strokeStyle = isComet ? '#67e879' : '#ff4d6d';
            ctx.lineWidth = 3;
            if (isComet) {
                ctx.fillStyle = 'rgba(103, 232, 121, 0.16)';
                ctx.beginPath();
                ctx.moveTo(-24, -8);
                ctx.lineTo(-8, 0);
                ctx.lineTo(-24, 8);
                ctx.closePath();
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(0, 0, (o.w / 2 - 2) * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = isBludger ? '#ffd66e' : (isComet ? '#67e879' : '#8b5cf6');
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 11, Math.PI * 0.12, Math.PI * 1.52);
            ctx.stroke();
            ctx.strokeStyle = '#ff4d6d';
            ctx.beginPath();
            ctx.moveTo(-10, -2);
            ctx.lineTo(2, -2);
            ctx.lineTo(-3, 10);
            ctx.lineTo(10, -7);
            ctx.stroke();
            ctx.restore();
        });

        // Draw Player (broom-riding wizard; same gameplay footprint)
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.fillStyle = 'rgba(111, 227, 255, 0.15)';
        ctx.strokeStyle = 'rgba(111, 227, 255, 0.38)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, player.w * 0.58, player.h * 0.58, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#8a5a28';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, -player.h * 0.48);
        ctx.lineTo(0, player.h * 0.43);
        ctx.stroke();
        ctx.strokeStyle = '#c17a2e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-8, player.h * 0.28);
        ctx.lineTo(0, player.h * 0.48);
        ctx.lineTo(8, player.h * 0.28);
        ctx.stroke();
        ctx.fillStyle = '#4c0519';
        ctx.beginPath();
        ctx.moveTo(-player.w * 0.2, player.h * 0.28);
        ctx.quadraticCurveTo(-player.w * 0.42, player.h * 0.04, -player.w * 0.18, -player.h * 0.18);
        ctx.lineTo(0, -player.h * 0.3);
        ctx.lineTo(player.w * 0.2, -player.h * 0.18);
        ctx.quadraticCurveTo(player.w * 0.42, player.h * 0.04, player.w * 0.2, player.h * 0.28);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#f8c24e';
        ctx.fillRect(-player.w * 0.2, -player.h * 0.02, player.w * 0.4, 4);
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath();
        ctx.arc(0, -player.h * 0.28, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#201326';
        ctx.beginPath();
        ctx.moveTo(-10, -player.h * 0.34);

        ctx.strokeStyle = '#ffd66e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(player.w * 0.1, -player.h * 0.22);
        ctx.lineTo(player.w * 0.42, -player.h * 0.46);

        ctx.beginPath();
        ctx.moveTo(-player.w * 0.16, player.h * 0.12);
        ctx.lineTo(-player.w * 0.36, player.h * 0.26);
        ctx.lineTo(-player.w * 0.12, player.h * 0.22);

        ctx.strokeStyle = 'rgba(103, 232, 121, 0.28)';

        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(Math.sin(smokeT + i) * 14, -enemy.h * 0.45 - i * 10, 8 + i * 4, Math.PI * 0.15, Math.PI * 1.35);
            ctx.stroke();
        }
        ctx.fillStyle = '#070612';
        ctx.strokeStyle = phase >= 5 ? '#67e879' : '#8b5cf6';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -enemy.h * 0.5);
        ctx.lineTo(-enemy.w * 0.4, enemy.h * 0.42);
        ctx.quadraticCurveTo(0, enemy.h * 0.56, enemy.w * 0.4, enemy.h * 0.42);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(139, 92, 246, 0.38)';
        ctx.beginPath();
        ctx.ellipse(0, enemy.h * 0.1, enemy.w * 0.24, enemy.h * 0.26, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#67e879';
        ctx.beginPath();
        ctx.arc(-enemy.w * 0.12, -enemy.h * 0.1, 3.5, 0, Math.PI * 2);
        ctx.arc(enemy.w * 0.12, -enemy.h * 0.1, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(103, 232, 121, 0.72)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -enemy.h * 0.08, enemy.w * 0.32, 0.18 * Math.PI, 0.82 * Math.PI);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 77, 109, 0.44)';
        ctx.beginPath();
        ctx.moveTo(-enemy.w * 0.18, enemy.h * 0.2);
        ctx.lineTo(enemy.w * 0.18, enemy.h * 0.2);
        ctx.stroke();
        ctx.restore();
        
        // Enemy Health Bar
        const hpPct = Math.max(0, enemy.hp / enemy.maxHp);
        ctx.fillStyle = '#4c0519';
        ctx.fillRect(enemy.x - 30, enemy.y - 60, 60, 5);
        ctx.fillStyle = '#67e879';
        ctx.fillRect(enemy.x - 30, enemy.y - 60, 60 * hpPct, 5);

        // Draw Bullets
        bullets.forEach(b => {
            const bolt = ctx.createLinearGradient(b.x, b.y + 12, b.x, b.y - 18);
            bolt.addColorStop(0, 'rgba(255, 214, 110, 0)');
            bolt.addColorStop(0.35, '#ffd66e');
            bolt.addColorStop(1, '#fff7c7');
            ctx.fillStyle = bolt;
            ctx.beginPath();
            ctx.moveTo(b.x, b.y - 18);
            ctx.lineTo(b.x + 4, b.y + 8);
            ctx.lineTo(b.x, b.y + 14);
            ctx.lineTo(b.x - 4, b.y + 8);
            ctx.closePath();
            ctx.fill();
            drawStar(b.x, b.y - 20, 3, 'rgba(255, 247, 199, 0.82)');
        });

        ctx.restore();
    }

    function initGame() {
        player.x = window.innerWidth / 2;
        player.y = window.innerHeight - 150;
        player.hp = player.maxHp;
        
        enemy.x = window.innerWidth / 2;
        enemy.y = 150;
        enemy.hp = enemy.maxHp;
        
        bullets = [];
        particles = [];
        obstacles = [];
        scoreDistance = 0;
        shake = 0;
        
        gameState = 'PLAY';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('siren-fx').classList.remove('opacity-0');
        
        audio.unlock();
        audio.playSfx('sfx_ui', 'win', 180);
    }

    function endGame(win) {
        gameState = 'GAME_OVER';
        audio.stopBgm();
        audio.playSfx(win ? 'sfx_win' : 'sfx_fail', win ? 'win' : 'explosion', 300);
        if (win) {
            flashGif('winGif', 2200);
        } else {
            flashGif('crashGif', 1200);
        }
        
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('siren-fx').classList.add('opacity-0');
        
        const title = document.getElementById('go-title');
        title.textContent = win ? "DARK TARGET STOPPED" : "PROTEGO BROKEN";
        title.className = win ? "text-5xl font-bold text-green-400 mb-4 neon-text" : "text-5xl font-bold text-red-500 mb-4 neon-text";
        
        document.getElementById('finalScore').textContent = scoreDistance.toFixed(1);
    }

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', initGame);
    document.getElementById('restart-btn').addEventListener('click', initGame);

    // Initial Draw
    requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
