<script>
/**
 * §4 Iron Laws & Architecture
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    const configScript = document.getElementById('game-config');
    window.gameConfigDefs = JSON.parse(configScript.textContent);
    window.gameConfig = {};
    
    // Initialize pure config values
    Object.keys(window.gameConfigDefs).forEach(key => {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    });

    window.updateGameConfig = (key, val) => {
        if (window.gameConfigDefs[key]) {
            const def = window.gameConfigDefs[key];
            // Type validation
            if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, Number(val)));
            if (def.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
            
            window.gameConfig[key] = val;
            
            // Hot reload logic
            if (key === 'gameTitle') {
                const el = document.getElementById('ui-title');
                if (el) el.textContent = val;
                document.title = val;
            }
            if (key === 'themeColor') {
                const el = document.getElementById('scoreVal');
                if (el) el.style.color = val;
            }
        }
    };

    // --- Audio System ---
        class AudioManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.buffers = {};
                this.cooldowns = new Map();
                this.unlocked = false;
            }

            unlock() {
                if (this.unlocked) return;
                this.ctx.resume().then(() => {
                    this.unlocked = true;
                    this.playBgm();
                }).catch(() => {});
            }

            async loadSound(id, src) {
                // [agent-note][stage4] validation-safe-audio: approved catalog remotes may reject localhost CORS; synth fallback preserves cues without console-blocking fetch noise.
                if (/^https?:\/\//i.test(src) && location.hostname === '127.0.0.1') {
                    this.buffers[id] = 'fallback';
                    return;
                }
                try {
                    const res = await fetch(src);
                    if (!res.ok) throw new Error(`audio status ${res.status}`);
                    const arrayBuffer = await res.arrayBuffer();
                    this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn('Audio load failed, using fallback', id);
                    this.buffers[id] = 'fallback';
                }
            }

            playBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    if (/^https?:\/\//i.test(el.src) && location.hostname === '127.0.0.1') return;
                    el.volume = 0.2;
                    el.currentTime = 0;
                    el.play().catch(() => {});
                }
            }

            stopBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    el.pause();
                    el.currentTime = 0;
                }
            }

            playSfx(id, type = 'beep', cooldown = 0) {
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                const now = performance.now();
                const lastPlay = this.cooldowns.get(id) || 0;
                if (cooldown && now - lastPlay < cooldown) return;
                this.cooldowns.set(id, now);

                const buffer = this.buffers[id];
                if (buffer && buffer !== 'fallback') {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = buffer;
                    gain.gain.value = id === 'sfx_crash' ? 0.35 : id === 'sfx_ui' ? 0.3 : 0.4;
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(0);
                } else {
                    this.synthesize(type);
                }
            }

            synthesize(type) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'explosion') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                }
            }
        }

    const audio = new AudioManager();
    const feedback = {
        crashGif: document.getElementById('crash-gif'),
        winGif: document.getElementById('win-gif'),
        timers: new Map()
    };

    function flashGif(key, duration = 900) {
        const el = feedback[key];
        if (!el) return;
        clearTimeout(feedback.timers.get(key));
        el.classList.remove('hidden', 'opacity-0');
        const timeout = setTimeout(() => {
            el.classList.add('opacity-0');
            setTimeout(() => el.classList.add('hidden'), 250);
        }, duration);
        feedback.timers.set(key, timeout);
    }

    // Preload SFX
    ['sfx_hit', 'sfx_crash', 'sfx_win', 'sfx_fail', 'sfx_ui'].forEach(id => {
        const el = document.getElementById(id);
        if (el) audio.loadSound(id, el.src);
    });

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // State
    let gameState = 'START'; // START, PLAY, GAME_OVER
    let lastTime = 0;
    let scoreDistance = 0; // Miles
    let gameSpeed = 1;
    let roadOffset = 0;
    
    // Entities
    const player = { x: 0, y: 0, w: 50, h: 80, hp: 100, maxHp: 100 };
    const enemy = { x: 0, y: 0, w: 60, h: 100, hp: 500, maxHp: 500, dir: 1, moveTimer: 0 };
    let bullets = [];
    let particles = [];
    let obstacles = []; // Debris from van
    let roadLines = [];

    // Input
    let input = { active: false, x: 0 };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Reset positions if resizing during play
        if (gameState === 'START') {
            player.x = window.innerWidth / 2;
            player.y = window.innerHeight - 150;
            enemy.x = window.innerWidth / 2;
            enemy.y = 150;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handlers
    const handleStart = (e) => {
        if (gameState !== 'PLAY') return;
        input.active = true;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
        audio.unlock();
    };
    
    const handleMove = (e) => {
        if (!input.active) return;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
    };

    const handleEnd = () => {
        input.active = false;
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleStart(e);
    }, { passive: false });
    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        handleMove(e);
    }, { passive: false });
    canvas.addEventListener('pointerup', handleEnd);
    canvas.addEventListener('pointercancel', handleEnd);

    // Game Loop
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        if (gameState !== 'PLAY') return;

        // Config sync
        gameSpeed = window.gameConfig.gameSpeed;
        const steerSpeed = window.gameConfig.heroSpeed * 60;

        // Player Movement (Lerp towards input)
        if (input.active) {
            const dx = input.x - player.x;
            player.x += dx * steerSpeed * dt * 0.1;
        }
        // Clamp player
        player.x = Math.max(player.w/2, Math.min(window.innerWidth - player.w/2, player.x));

        // Enemy AI (Sway and evade)
        enemy.moveTimer += dt;
        if (enemy.moveTimer > 2) {
            enemy.dir = Math.random() > 0.5 ? 1 : -1;
            enemy.moveTimer = 0;
        }
        enemy.x += enemy.dir * 50 * dt;
        // Keep enemy in bounds
        if (enemy.x < 50 || enemy.x > window.innerWidth - 50) enemy.dir *= -1;
        enemy.x = Math.max(enemy.w/2, Math.min(window.innerWidth - enemy.w/2, enemy.x));

        // Road Scrolling
        roadOffset += 800 * gameSpeed * dt;
        if (roadOffset > 100) roadOffset = 0;
        scoreDistance += (10 * gameSpeed * dt) / 100; // Miles

        // Win Condition
        if (scoreDistance >= 100 || enemy.hp <= 0) {
            endGame(true);
        }

        // Shooting (Auto-fire)
        player.fireTimer = (player.fireTimer || 0) + dt;
        if (player.fireTimer > 0.15) {
            bullets.push({ x: player.x - 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            bullets.push({ x: player.x + 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            player.fireTimer = 0;
        }

        // Enemy Shooting / Debris
        enemy.fireTimer = (enemy.fireTimer || 0) + dt;
        if (enemy.fireTimer > 1.0) {
            // Drop debris
            obstacles.push({ x: enemy.x, y: enemy.y + 50, w: 40, h: 40, active: true });
            enemy.fireTimer = 0;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;

            // Collision with Enemy
            if (b.type === 'player' && 
                Math.abs(b.x - enemy.x) < enemy.w/2 + 5 && 
                Math.abs(b.y - enemy.y) < enemy.h/2 + 5) {
                
                enemy.hp -= 5;
                spawnParticles(b.x, b.y, '#ffffff', 5);
                audio.playSfx('sfx_hit', 'hit', 70);
                bullets.splice(i, 1);
                continue;
            }

            if (b.y < -50 || b.y > window.innerHeight + 50) bullets.splice(i, 1);
        }

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const o = obstacles[i];
            o.y += 600 * dt; // Move down relative to road speed

            // Collision with Player
            if (o.active && 
                Math.abs(o.x - player.x) < (o.w + player.w)/2 * 0.8 &&
                Math.abs(o.y - player.y) < (o.h + player.h)/2 * 0.8) {
                
                player.hp -= 20;
                o.active = false;
                spawnParticles(player.x, player.y, '#ef4444', 15);
                audio.playSfx('sfx_crash', 'explosion', 220);
                flashGif('crashGif', 850);

                // Screen shake
                shake = 0.5;
            }

            if (o.y > window.innerHeight + 100) obstacles.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Game Over Check
        if (player.hp <= 0) endGame(false);

        // Update UI
        document.getElementById('scoreVal').textContent = scoreDistance.toFixed(1);
        document.getElementById('healthBar').style.width = Math.max(0, player.hp) + '%';
        
        // Shake decay
        if (shake > 0) shake = Math.max(0, shake - dt * 2);
    }

    let shake = 0;

    function spawnParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 200 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    function draw() {
        // Clear background
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Shake effect
        let sx = 0, sy = 0;
        if (shake > 0) {
            sx = (Math.random() - 0.5) * shake * 50;
            sy = (Math.random() - 0.5) * shake * 50;
        }
        ctx.save();
        ctx.translate(sx, sy);

        // Draw Portal Freeway Background
        const portalPulse = Date.now() / 1000;
        const visualPhase = Math.min(4, Math.floor(scoreDistance / 20));
        const phaseAccent = ['#39ff88', '#55f7ff', '#ff4fad', '#8de7ff', '#f7c948'][visualPhase];
        const phaseBack = ['#071426', '#071426', '#180b1c', '#080b1f', '#14110a'][visualPhase];
        const bgGrad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        bgGrad.addColorStop(0, phaseBack);
        bgGrad.addColorStop(0.55, '#050b16');
        bgGrad.addColorStop(1, '#04070d');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        // Edge-only animated portal rings, Citadel towers, and garage props stay behind gameplay.
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#48546a';
        for (let i = 0; i < 8; i++) {
            const towerW = 18 + (i % 3) * 8;
            const towerH = 70 + (i % 4) * 34;
            const side = i % 2 === 0 ? 0.055 : 0.89;
            const x = window.innerWidth * side + (i % 2 === 0 ? i * 2 : -i * 2);
            const y = ((i * 130 + roadOffset * 0.18) % (window.innerHeight + 190)) - 120;
            ctx.fillRect(x, y, towerW, towerH);
            ctx.fillStyle = i % 2 === 0 ? 'rgba(57,255,136,0.45)' : 'rgba(85,247,255,0.42)';
            ctx.fillRect(x + 4, y + 12, Math.max(4, towerW - 8), 3);
            ctx.fillRect(x + 4, y + 32, Math.max(4, towerW - 8), 3);
            ctx.fillStyle = '#48546a';
        }
        ctx.restore();

        ctx.save();
        for (let i = 0; i < 7; i++) {
            const ringY = ((i * 165 + roadOffset * 0.33) % (window.innerHeight + 220)) - 110;
            const ringX = i % 2 === 0 ? window.innerWidth * 0.13 : window.innerWidth * 0.87;
            const rx = 46 + Math.sin(portalPulse + i) * 5;
            const ry = 17 + Math.cos(portalPulse * 0.8 + i) * 2;
            ctx.globalAlpha = i % 3 === 0 ? 0.32 : 0.2;
            ctx.strokeStyle = i % 2 === 0 ? phaseAccent : '#55f7ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(ringX, ringY, rx, ry, portalPulse * 0.42 + i, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 0.09;
            ctx.lineWidth = 12;
            ctx.stroke();
        }
        ctx.restore();

        // Draw Road / central dimensional freeway
        const roadW = Math.min(600, window.innerWidth);
        const roadX = (window.innerWidth - roadW) / 2;
        const roadGrad = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
        roadGrad.addColorStop(0, 'rgba(8, 36, 30, 0.98)');
        roadGrad.addColorStop(0.18, '#10251f');
        roadGrad.addColorStop(0.5, '#111a22');
        roadGrad.addColorStop(0.82, '#10251f');
        roadGrad.addColorStop(1, 'rgba(8, 36, 30, 0.98)');
        ctx.fillStyle = roadGrad;
        ctx.fillRect(roadX, 0, roadW, window.innerHeight);

        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.strokeStyle = phaseAccent;
        ctx.lineWidth = 1;
        for (let x = roadX + roadW * 0.2; x < roadX + roadW; x += roadW * 0.2) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + Math.sin(portalPulse + x) * 18, window.innerHeight);
            ctx.stroke();
        }
        ctx.restore();

        ctx.strokeStyle = 'rgba(57,255,136,0.44)';
        ctx.lineWidth = 3;
        ctx.strokeRect(roadX + 2, 0, roadW - 4, window.innerHeight);
        ctx.strokeStyle = 'rgba(85,247,255,0.22)';
        ctx.lineWidth = 1;
        ctx.strokeRect(roadX + 11, 0, roadW - 22, window.innerHeight);
        
        // Road Lines and scanner ticks
        ctx.fillStyle = 'rgba(167,255,60,0.36)';
        ctx.beginPath();
        for (let i = -1; i < 10; i++) {
            let y = (i * 100) + roadOffset;
            ctx.roundRect(window.innerWidth/2 - 5, y, 10, 50, 4);
            ctx.rect(roadX + 18, y + 20, 26, 3);
            ctx.rect(roadX + roadW - 44, y + 20, 26, 3);
        }
        ctx.fill();

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 0.5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Draw Obstacles (Portal Junk Debris)
        obstacles.forEach(o => {
            if (!o.active) return;
            const junkVariant = Math.abs(Math.floor(o.x + o.y)) % 3;
            ctx.save();
            ctx.translate(o.x, o.y);
            ctx.rotate(0.35 + Math.sin(portalPulse + o.y * 0.01) * 0.16);
            ctx.shadowColor = junkVariant === 1 ? '#ff4fad' : '#39ff88';
            ctx.shadowBlur = 10;
            ctx.fillStyle = junkVariant === 1 ? '#4b233a' : '#48546a';
            ctx.beginPath();
            if (junkVariant === 2) {
                ctx.moveTo(-o.w/2, -o.h/3);
                ctx.lineTo(-o.w/8, -o.h/2);
                ctx.lineTo(o.w/2, -o.h/4);
                ctx.lineTo(o.w/3, o.h/2);
                ctx.lineTo(-o.w/2, o.h/3);
            } else {
                ctx.roundRect(-o.w/2, -o.h/2, o.w, o.h, junkVariant === 0 ? 7 : 2);
            }
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = junkVariant === 1 ? '#ff4fad' : '#39ff88';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#101318';
            ctx.fillRect(-o.w/2 + 9, -o.h/2 + 9, o.w - 18, o.h - 18);
            ctx.fillStyle = junkVariant === 1 ? '#ffd84f' : '#a7ff3c';
            ctx.beginPath();
            ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.fillRect(-3, -o.h/2 + 5, 6, 3);
            ctx.restore();
        });

        // Draw Player (Rick-and-Morty saucer silhouette; original footprint preserved)
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowColor = '#55f7ff';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#1a2d32';
        ctx.strokeStyle = '#55f7ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 8, player.w * 0.62, player.h * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#071426';
        ctx.fillRect(-21, 7, 42, 5);
        ctx.fillStyle = '#39ff88';
        ctx.fillRect(-18, 17, 36, 5);
        ctx.fillStyle = '#55f7ff';
        ctx.fillRect(-24, 3, 9, 4);
        ctx.fillRect(15, 3, 9, 4);

        ctx.fillStyle = '#9ee7ff';
        ctx.strokeStyle = 'rgba(245,255,247,0.8)';
        ctx.beginPath();
        ctx.ellipse(0, -5, player.w * 0.36, player.h * 0.21, 0, Math.PI, 0);
        ctx.fill();
        ctx.stroke();

        // Rick bubble: blue hair spikes plus small face marker.
        ctx.strokeStyle = '#39ff88';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(-9, -11, 7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#8de7ff';
        ctx.beginPath();
        ctx.moveTo(-17, -17);
        ctx.lineTo(-13, -28);
        ctx.lineTo(-10, -18);
        ctx.lineTo(-6, -29);
        ctx.lineTo(-3, -17);
        ctx.lineTo(0, -25);
        ctx.lineTo(0, -15);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#04070d';
        ctx.fillRect(-11, -12, 2, 2);

        // Morty bubble: yellow head and anxious dot eye.
        ctx.fillStyle = '#ffd84f';
        ctx.beginPath();
        ctx.arc(11, -11, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#04070d';
        ctx.fillRect(12, -12, 2, 2);
        ctx.restore();
        
        // Portal glow (Procedural Juice) drawn behind silhouette but after body for readable aura.
        const time = Date.now() / 100;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = Math.floor(time) % 2 === 0 ? 'rgba(57, 255, 136, 0.2)' : 'rgba(85, 247, 255, 0.18)';
        ctx.beginPath();
        ctx.arc(player.x, player.y + 8, 26, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        // Draw Enemy (Council portal rig; original footprint preserved)
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.shadowColor = '#f7c948';
        ctx.shadowBlur = 9;
        ctx.fillStyle = '#050506';
        ctx.strokeStyle = '#f7c948';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-enemy.w/2, -enemy.h/2, enemy.w, enemy.h, 5);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#111827';
        ctx.fillRect(-enemy.w/2 + 9, -enemy.h/2 + 12, enemy.w - 18, 20);
        ctx.fillStyle = 'rgba(247,201,72,0.28)';
        ctx.fillRect(-enemy.w/2 + 8, -enemy.h/2 + 38, enemy.w - 16, 4);
        ctx.fillRect(-enemy.w/2 + 8, -enemy.h/2 + 50, enemy.w - 16, 4);
        ctx.strokeStyle = '#39ff88';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 13, 20, 8, portalPulse * 0.3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 13, 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ff4d6d';
        ctx.fillRect(-enemy.w/2 + 6, enemy.h/2 - 18, 10, 5);
        ctx.fillRect(enemy.w/2 - 16, enemy.h/2 - 18, 10, 5);
        ctx.fillStyle = '#f7c948';
        ctx.fillRect(-enemy.w/2 + 7, -enemy.h/2 + 5, 8, 5);
        ctx.fillRect(enemy.w/2 - 15, -enemy.h/2 + 5, 8, 5);
        ctx.restore();
        
        // Enemy Health Bar
        const hpPct = Math.max(0, enemy.hp / enemy.maxHp);
        ctx.fillStyle = 'rgba(4,7,13,0.82)';
        ctx.fillRect(enemy.x - 32, enemy.y - 62, 64, 7);
        ctx.fillStyle = '#ff4d6d';
        ctx.fillRect(enemy.x - 30, enemy.y - 60, 60, 5);
        ctx.fillStyle = '#39ff88';
        ctx.fillRect(enemy.x - 30, enemy.y - 60, 60 * hpPct, 5);

        // Draw Bullets
        ctx.fillStyle = '#a7ff3c';
        ctx.shadowColor = '#39ff88';
        ctx.shadowBlur = 10;
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.roundRect(b.x - 2.5, b.y - 11, 5, 22, 3);
            ctx.fill();
            ctx.fillStyle = '#fffbd1';
            ctx.fillRect(b.x - 1, b.y - 9, 2, 7);
            ctx.fillStyle = '#a7ff3c';
        });
        ctx.shadowBlur = 0;

        ctx.restore();
    }

    function initGame() {
        player.x = window.innerWidth / 2;
        player.y = window.innerHeight - 150;
        player.hp = player.maxHp;
        
        enemy.x = window.innerWidth / 2;
        enemy.y = 150;
        enemy.hp = enemy.maxHp;
        
        bullets = [];
        particles = [];
        obstacles = [];
        scoreDistance = 0;
        shake = 0;
        
        gameState = 'PLAY';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('siren-fx').classList.remove('opacity-0');
        
        audio.unlock();
        audio.playSfx('sfx_ui', 'win', 180);
    }

    function endGame(win) {
        gameState = 'GAME_OVER';
        audio.stopBgm();
        audio.playSfx(win ? 'sfx_win' : 'sfx_fail', win ? 'win' : 'explosion', 300);
        if (win) {
            flashGif('winGif', 2200);
        } else {
            flashGif('crashGif', 1200);
        }
        
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('siren-fx').classList.add('opacity-0');
        
        const title = document.getElementById('go-title');
        title.textContent = win ? "RIG DISABLED" : "HULL BREACH";
        title.className = win ? "text-5xl font-bold text-green-400 mb-4 neon-text" : "text-5xl font-bold text-red-500 mb-4 neon-text";
        
        document.getElementById('finalScore').textContent = scoreDistance.toFixed(1);
    }

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', initGame);
    document.getElementById('restart-btn').addEventListener('click', initGame);

    // Initial Draw
    requestAnimationFrame(gameLoop);
});
</script>
