<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rick's Garage Calmcade</title>
    <!-- [agent-note][stage3] resolved-font: titles=Audiowide, ui=Exo 2, icons=Material Symbols Rounded via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=Material+Symbols+Rounded&display=swap">
    <style>
        :root {
            --bg: #06120d;
            --panel: rgba(5, 18, 15, 0.86);
            --panel-solid: rgba(10, 31, 25, 0.78);
            --text: #e8fff2;
            --muted: #99d7c1;
            --ring: rgba(67, 255, 126, 0.32);
            --shadow: 0 18px 38px rgba(0, 20, 10, 0.48);
            --radius: 22px;
            --accent: #43ff7e;
            --accent-strong: #34d2ff;
            --accent-warm: #f6d743;
            --danger: #ff5ca8;
            --surface-glow: radial-gradient(circle at top, rgba(67, 255, 126, 0.24), transparent 42%);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(67, 255, 126, 0.22), transparent 32%),
                radial-gradient(circle at bottom, rgba(52, 210, 255, 0.18), transparent 30%),
                var(--bg);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            color: var(--text);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(17, 33, 57, 0.94), rgba(10, 19, 34, 0.88)),
                var(--surface-glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ring);
            box-shadow: var(--shadow);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.15rem;
            line-height: 1;
        }

        .btn-hover:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { display: none; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 30%, rgba(67, 255, 126, 0.12), transparent 26%),
                linear-gradient(135deg, rgba(52, 210, 255, 0.08), transparent 45%),
                #06120d;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        #game-container::before {
            background:
                repeating-linear-gradient(90deg, rgba(52, 210, 255, 0.055) 0 1px, transparent 1px 52px),
                repeating-linear-gradient(0deg, rgba(67, 255, 126, 0.04) 0 1px, transparent 1px 46px);
            animation: garageScan 9s linear infinite;
            opacity: 0.45;
        }

        #game-container::after {
            background:
                radial-gradient(circle at 16% 80%, rgba(185, 137, 255, 0.12), transparent 18%),
                radial-gradient(circle at 84% 20%, rgba(246, 215, 67, 0.08), transparent 15%);
            mix-blend-mode: screen;
            opacity: 0.7;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        #main-menu {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 18%, rgba(67, 255, 126, 0.26), transparent 21%),
                radial-gradient(circle at 18% 78%, rgba(185, 137, 255, 0.15), transparent 24%),
                linear-gradient(180deg, rgba(5, 18, 15, 0.94), rgba(3, 9, 8, 0.92));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.5s;
            text-align: center;
            overflow: hidden;
        }

        #main-menu::before {
            content: "";
            position: absolute;
            width: min(72vw, 430px);
            aspect-ratio: 1 / 1;
            top: max(20px, 4vh);
            border-radius: 50%;
            border: 2px solid rgba(67, 255, 126, 0.28);
            background:
                radial-gradient(circle, rgba(67, 255, 126, 0.12), transparent 36%),
                conic-gradient(from 0deg, transparent, rgba(52, 210, 255, 0.2), transparent 33%, rgba(67, 255, 126, 0.26), transparent 68%);
            filter: blur(0.2px);
            animation: portalSpin 18s linear infinite;
            pointer-events: none;
        }

        #main-menu > * {
            position: relative;
            z-index: 1;
        }

        #main-menu h1 {
            margin: 0 0 8px;
            font-size: clamp(2.3rem, 6vw, 3.5rem);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #eef8ff;
            text-shadow: 0 0 18px rgba(109, 224, 255, 0.38);
        }

        #main-menu p {
            margin: 0 0 32px;
            font-size: 0.95rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #main-menu .grid {
            width: min(100%, 420px);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        #main-menu .grid button {
            position: relative;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(67, 255, 126, 0.28);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background:
                radial-gradient(circle at 50% 16%, rgba(67, 255, 126, 0.18), transparent 36%),
                linear-gradient(180deg, rgba(10, 31, 25, 0.98), rgba(4, 15, 13, 0.98));
            box-shadow:
                inset 0 1px 0 rgba(232, 255, 242, 0.08),
                0 12px 28px rgba(0, 20, 10, 0.46),
                0 0 0 1px rgba(52, 210, 255, 0.06);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            padding: 12px;
            overflow: hidden;
        }

        #main-menu .grid button::after {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: calc(var(--radius) - 7px);
            border: 1px solid rgba(52, 210, 255, 0.1);
            box-shadow: inset 0 0 18px rgba(67, 255, 126, 0.08);
            pointer-events: none;
        }

        #main-menu .grid button span:first-child {
            font-size: 1.95rem;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(109, 224, 255, 0.22));
        }

        #main-menu .grid button span:last-child {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #start-prompt {
            margin-top: 36px;
            font-size: 0.9rem;
            color: var(--muted);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }

        @keyframes garageScan {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-52px, -46px, 0); }
        }

        @keyframes portalSpin {
            to { transform: rotate(1turn); }
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                16px
                max(16px, env(safe-area-inset-left));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 40;
            pointer-events: auto;
            box-sizing: border-box;
        }

        #back-btn, #mute-btn {
            border: 0;
            font: inherit;
            cursor: pointer;
            color: #eef8ff;
        }

        #back-btn {
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #volume-controls {
            padding: 8px;
            border-radius: 999px;
            display: flex;
            gap: 8px;
        }

        #mute-btn {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: rgba(109, 224, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        #mode-title {
            position: absolute;
            bottom: calc(32px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            pointer-events: none;
            transition: opacity 1s;
            opacity: 0;
        }

        #mode-title h2 {
            display: inline-block;
            margin: 0;
            padding: 10px 18px;
            border: 1px solid rgba(67, 255, 126, 0.2);
            border-radius: 999px;
            background: rgba(5, 18, 15, 0.42);
            font-size: clamp(1rem, 3.6vw, 1.55rem);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(232, 255, 242, 0.86);
            text-shadow: 0 0 18px rgba(67, 255, 126, 0.34);
        }

        #feedback-overlays {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 35;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 20vw, 148px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(8, 17, 31, 0.36);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: scale(0.82) translateY(18px);
            transition: opacity 220ms ease, transform 220ms ease;
            will-change: transform, opacity;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        #gif-celebrate {
            right: 12px;
            bottom: 104px;
            border-color: rgba(67, 255, 126, 0.42);
        }

        #gif-fail {
            left: 12px;
            bottom: 104px;
            border-color: rgba(255, 159, 67, 0.42);
        }

        @media (max-width: 640px) {
            #main-menu {
                padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            }

            #main-menu .grid {
                gap: 10px;
            }

            #main-menu .grid button {
                padding: 10px;
                border-radius: 18px;
            }

            #mode-title {
                bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "breathingSpeed": { "type": "number", "label": "Pace", "value": 0.002, "min": 0.001, "max": 0.01 },
    "bubbleCount": { "type": "number", "label": "Targets", "value": 15, "min": 5, "max": 30 },
    "themeColor": { "type": "color", "label": "Glow Color", "value": "#818cf8" }
}
</script>

<!-- Assets -->
<div id="assets" hidden>
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/fail via catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Relaxing BGM" src="https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI Click" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3" preload="auto"></audio>
    <audio id="sfx_success" data-editable="audio" data-label="Success Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Fail Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3" preload="auto"></audio>
</div>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="main-menu">
            <h1>Rick's Garage Calmcade</h1>
            <p>Morty-safe portal stations for a mellow multiverse shift</p>

            <div class="grid">
                <!-- Generated by JS -->
            </div>

            <div id="start-prompt">Tap anywhere to boot the portal console</div>
        </div>

        <!-- In-Game UI -->
        <div id="game-ui" class="hidden">
            <button id="back-btn" class="glass btn-hover">
                <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
                <span>Garage Menu</span>
            </button>
            <div id="volume-controls" class="glass">
                <button id="mute-btn" aria-label="Toggle audio">
                    <span class="material-symbols-rounded" aria-hidden="true">music_note</span>
                </button>
            </div>
        </div>

        <!-- Overlay Title for Mini-games -->
        <div id="mode-title">
            <h2></h2>
        </div>

        <!-- [agent-note][stage3] resolved-gif: success/fail reactions via catalogs/gifs.json -->
        <div id="feedback-overlays" aria-hidden="true">
            <img id="gif-celebrate" class="feedback-gif" alt="" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
            <img id="gif-fail" class="feedback-gif" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        </div>
    </div>
</div>

<script>
/**
 * § Core Engine
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = {
    menu: document.getElementById('main-menu'),
    game: document.getElementById('game-ui'),
    grid: document.querySelector('#main-menu .grid'),
    backBtn: document.getElementById('back-btn'),
    modeTitle: document.querySelector('#mode-title h2'),
    modeContainer: document.getElementById('mode-title'),
    prompt: document.getElementById('start-prompt'),
    celebrateGif: document.getElementById('gif-celebrate'),
    failGif: document.getElementById('gif-fail')
};

// Config
window.gameConfig = {
    breathingSpeed: 0.002,
    bubbleCount: 15,
    themeColor: "#43ff7e"
};

// State
let state = {
    mode: 'MENU', // MENU, BREATH, BUBBLE, SAND, SOUND, COLOR, BALL, STRESS, COUNT, NIGHT
    time: 0,
    dt: 0,
    width: 0,
    height: 0,
    active: false,
    pointer: { x: 0, y: 0, isDown: false, startX: 0, startY: 0 }
};

const VISUAL = {
    garage: '#06120d',
    panel: '#0a1f19',
    portal: '#43ff7e',
    cyan: '#34d2ff',
    violet: '#b989ff',
    yellow: '#f6d743',
    orange: '#ff9f43',
    pink: '#ff5ca8',
    text: '#e8fff2'
};

function hexToRgb(hex) {
    const value = hex.replace('#', '');
    const n = parseInt(value.length === 3 ? value.split('').map(c => c + c).join('') : value, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function colorAlpha(hex, alpha) {
    const { r, g, b } = hexToRgb(hex);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
}

function drawPortalRing(cx, cy, r, accent = VISUAL.portal, alpha = 0.5, spin = 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(spin);
    ctx.lineCap = 'round';
    ctx.strokeStyle = colorAlpha(accent, alpha);
    ctx.lineWidth = Math.max(2, r * 0.035);
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, r - i * 10, i * 0.7, i * 0.7 + Math.PI * 1.15);
        ctx.stroke();
    }
    const core = ctx.createRadialGradient(0, 0, r * 0.12, 0, 0, r);
    core.addColorStop(0, colorAlpha(accent, alpha * 0.42));
    core.addColorStop(0.55, colorAlpha(VISUAL.cyan, alpha * 0.16));
    core.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawGarageBackdrop(mode = 'GARAGE', accent = VISUAL.portal, intensity = 1) {
    const w = state.width;
    const h = state.height;
    const t = state.time * 0.001;
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#04110f');
    bg.addColorStop(0.55, mode === 'BALL' ? '#100b24' : '#061a14');
    bg.addColorStop(1, '#020806');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.globalAlpha = 0.18 * intensity;
    ctx.strokeStyle = colorAlpha(VISUAL.cyan, 0.35);
    ctx.lineWidth = 1;
    const grid = 42;
    const ox = (t * 11) % grid;
    const oy = (t * 7) % grid;
    for (let x = -grid; x < w + grid; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x + ox, 0);
        ctx.lineTo(x + ox, h);
        ctx.stroke();
    }
    for (let y = -grid; y < h + grid; y += grid) {
        ctx.beginPath();
        ctx.moveTo(0, y + oy);
        ctx.lineTo(w, y + oy);
        ctx.stroke();
    }
    ctx.restore();

    drawPortalRing(w * 0.78, h * 0.24, Math.min(w, h) * 0.19, accent, 0.34 * intensity, t * 0.28);
    drawPortalRing(w * 0.2, h * 0.78, Math.min(w, h) * 0.14, VISUAL.violet, 0.2 * intensity, -t * 0.22);

    ctx.save();
    ctx.globalAlpha = 0.22 * intensity;
    ctx.strokeStyle = colorAlpha(VISUAL.yellow, 0.42);
    ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
        const y = h * (0.18 + i * 0.18) + Math.sin(t + i) * 6;
        ctx.beginPath();
        ctx.moveTo(-20, y);
        ctx.bezierCurveTo(w * 0.22, y + 30, w * 0.4, y - 25, w + 20, y + 18);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#0b2a22';
    roundRectPath(18, h - 92, Math.min(180, w * 0.42), 56, 16);
    ctx.fill();
    ctx.fillStyle = colorAlpha(accent, 0.7);
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(44 + i * 24, h - 64 + Math.sin(t * 2 + i) * 2, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawLabFrame(accent = VISUAL.portal) {
    const w = state.width;
    const h = state.height;
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = colorAlpha(accent, 0.55);
    ctx.lineWidth = 1.5;
    roundRectPath(12, 12, w - 24, h - 24, 26);
    ctx.stroke();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = colorAlpha(VISUAL.cyan, 0.8);
    ctx.fillRect(22, 22, Math.min(86, w * 0.22), 3);
    ctx.fillRect(w - Math.min(108, w * 0.26) - 22, h - 25, Math.min(108, w * 0.26), 3);
    ctx.restore();
}

function drawCrystal(cx, cy, size, color = VISUAL.yellow) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = colorAlpha(color, 0.9);
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.58, -size * 0.12);
    ctx.lineTo(size * 0.35, size);
    ctx.lineTo(-size * 0.35, size);
    ctx.lineTo(-size * 0.58, -size * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function drawPlumbusFoam(x, y, r, wobble = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(wobble) * 0.08);
    const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    grad.addColorStop(0, 'rgba(255,255,255,0.86)');
    grad.addColorStop(0.45, 'rgba(110,231,183,0.58)');
    grad.addColorStop(1, 'rgba(67,255,126,0.12)');
    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(232,255,242,0.78)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.9, r * 1.06, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,159,67,0.58)';
    ctx.beginPath();
    ctx.arc(r * 0.28, r * 0.26, r * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawMortyBadge(x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(246,215,67,0.95)';
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3b2412';
    ctx.beginPath();
    ctx.arc(-7, -2, 2.2, 0, Math.PI * 2);
    ctx.arc(7, -2, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3b2412';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 7, 5, Math.PI * 0.08, Math.PI * 0.92);
    ctx.stroke();
    ctx.restore();
}

function drawScientistSilhouette(x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = 0.24;
    ctx.fillStyle = VISUAL.cyan;
    ctx.beginPath();
    for (let i = 0; i < 9; i++) {
        const a = -Math.PI + i * Math.PI / 4;
        const r = i % 2 ? 26 : 38;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r - 12;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(-15, 20, 30, 44);
    ctx.restore();
}

/**
 * § Audio System
 */
const audio = {
    ctx: null,
    bgm: document.getElementById('bgm_main'),
    sfxCollect: document.getElementById('sfx_collect'),
    sfxUi: document.getElementById('sfx_ui'),
    sfxSuccess: document.getElementById('sfx_success'),
    sfxFail: document.getElementById('sfx_fail'),
    nodes: [],
    masterGain: null,
    bgmGain: null,
    sfxGain: null,
    mediaGraphAvailable: false,
    initialized: false,
    muted: false,
    lastPlayedAt: {},

    init() {
        if (this.initialized) {
            if (this.ctx?.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.startBgm();
            return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 1;
        this.masterGain.connect(this.ctx.destination);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.2;

        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.6;

        const mediaEls = [this.bgm, this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail];
        const allSameOrigin = mediaEls.every((el) => {
            try {
                return el && new URL(el.currentSrc || el.src, location.href).origin === location.origin;
            } catch (e) {
                return false;
            }
        });

        if (allSameOrigin) {
            try {
                [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                    const source = this.ctx.createMediaElementSource(el);
                    source.connect(this.sfxGain);
                });

                const bgmSource = this.ctx.createMediaElementSource(this.bgm);
                bgmSource.connect(this.bgmGain);

                this.bgmGain.connect(this.masterGain);
                this.sfxGain.connect(this.masterGain);
                this.mediaGraphAvailable = true;
            } catch (e) {
                this.mediaGraphAvailable = false;
            }
        }

        if (!this.mediaGraphAvailable) {
            this.bgm.volume = 0.2;
            [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                if (el) el.volume = 0.6;
            });
        }

        this.initialized = true;
        this.startBgm();
    },

    startBgm() {
        if (!this.ctx || this.muted) return;
        this.ctx.resume?.().catch(() => {});
        this.bgm.volume = this.mediaGraphAvailable ? 1 : 0.2;
        this.bgm.play().catch(() => {});
    },

    setMuted(muted) {
        this.muted = muted;
        if (this.masterGain && this.mediaGraphAvailable) {
            this.masterGain.gain.value = muted ? 0 : 1;
        }
        if (!this.mediaGraphAvailable) {
            this.bgm.volume = muted ? 0 : 0.2;
            [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                if (el) el.volume = muted ? 0 : 0.6;
            });
        }
        if (muted) {
            this.bgm.pause();
        } else {
            this.startBgm();
        }
    },

    playElement(el, key, { playbackRate = 1, fallbackFreq = 360, fallbackType = 'sine', fallbackDuration = 0.12, minGap = 120 } = {}) {
        if (!this.ctx || this.muted) return;
        const now = performance.now();
        if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
        this.lastPlayedAt[key] = now;

        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.playbackRate = playbackRate;
                el.play().catch(() => this.synthTone(fallbackFreq, fallbackType, fallbackDuration));
                return;
            } catch (e) {}
        }

        this.synthTone(fallbackFreq, fallbackType, fallbackDuration);
    },

    playCollect() {
        this.playElement(this.sfxCollect, 'collect', {
            playbackRate: 1 + Math.random() * 0.08,
            fallbackFreq: 560,
            fallbackType: 'triangle',
            fallbackDuration: 0.14,
            minGap: 90
        });
    },

    playUi() {
        this.playElement(this.sfxUi, 'ui', {
            playbackRate: 1,
            fallbackFreq: 420,
            fallbackType: 'square',
            fallbackDuration: 0.08,
            minGap: 110
        });
    },

    playSuccess() {
        this.playElement(this.sfxSuccess, 'success', {
            playbackRate: 1,
            fallbackFreq: 680,
            fallbackType: 'sine',
            fallbackDuration: 0.18,
            minGap: 180
        });
    },

    playFail() {
        this.playElement(this.sfxFail, 'fail', {
            playbackRate: 1,
            fallbackFreq: 220,
            fallbackType: 'sawtooth',
            fallbackDuration: 0.16,
            minGap: 180
        });
    },

    synthTone(freq, type, duration) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.11, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    startNoise(type) {
        if (!this.ctx) return;
        this.stopNoise();

        const bufferSize = 2 * this.ctx.sampleRate;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 3.5;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        if (type === 'rain') {
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            gain.gain.value = 0.15;
        } else if (type === 'ocean') {
            filter.type = 'lowpass';
            filter.frequency.value = 400;
            gain.gain.value = 0.2;
            const lfo = this.ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.1;
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 300;
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();
            this.nodes.push(lfo, lfoGain);
        } else {
            filter.type = 'bandpass';
            filter.frequency.value = 500;
            gain.gain.value = 0.1;
        }

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();

        this.nodes.push(noise, gain, filter);
    },

    stopNoise() {
        this.nodes.forEach(n => {
            try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
    }
};

            ctx.closePath();
            ctx.fillStyle = '#fdba74';
            ctx.shadowBlur = 18;
            ctx.shadowColor = 'rgba(255,159,67,0.52)';
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#5b1f39';
            ctx.beginPath();
            ctx.arc(cx - 26, cy - 18, 7, 0, Math.PI * 2);
            ctx.arc(cx + 26, cy - 18, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#5b1f39';
            ctx.font = '700 18px "Audiowide"';
            ctx.textAlign = 'center';
            ctx.fillText("Hold to calm parasite", cx, cy + 6);
            drawLabFrame(VISUAL.orange);
        },
        cleanup() {}
    },

    COUNT: {
        num: 0,
        timer: 0,
        init() { this.num = 0; this.timer = 0; },
        update(dt) {
            this.timer += dt;
            if (this.timer > 2000) {
                this.num++;
                this.timer = 0;
                audio.playSuccess();
                if (navigator.vibrate) navigator.vibrate(50);
            }
        },
        draw() {
            drawGarageBackdrop('COUNT', VISUAL.yellow, 1);
            drawCrystal(state.width / 2, state.height / 2, Math.min(state.width, state.height) * 0.22, VISUAL.yellow);

            ctx.fillStyle = '#06120d';
            ctx.font = '700 100px "Audiowide"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const scale = 1 + Math.max(0, (500 - this.timer) / 500) * 0.2;
            ctx.save();
            ctx.translate(state.width / 2, state.height / 2);
            ctx.scale(scale, scale);
            ctx.fillText(this.num, 0, 0);
            ctx.restore();

            ctx.font = '600 20px "Exo 2"';
            ctx.fillStyle = '#a9ffd3';
            ctx.fillText("Keep the crystal beat", state.width / 2, state.height / 2 + 80);
            drawLabFrame(VISUAL.yellow);
        },
        cleanup() {}
    },

    NIGHT: {
        stars: [],
        ripples: [],
        init() {
            this.stars = [];
            for (let i = 0; i < 100; i++) {
                this.stars.push({
                    x: Math.random() * state.width,
                    y: Math.random() * state.height,
                    r: Math.random() * 2,
                    a: Math.random()
                });
            }
            this.ripples = [];
        },
        update(dt) {
            this.stars.forEach(s => s.a += 0.01);

            if (state.pointer.isDown && !state.pointer.handled) {
                this.ripples.push({ x: state.pointer.x, y: state.pointer.y, r: 0, a: 1 });
                state.pointer.handled = true;
                audio.playCollect();
                setFeedback('celebrate');
            }

            this.ripples.forEach(r => {
                r.r += 2;
                r.a -= 0.02;
            });
            this.ripples = this.ripples.filter(r => r.a > 0);
        },
        draw() {
            drawGarageBackdrop('NIGHT', '#cbd5e1', 0.9);

            this.stars.forEach(s => {
                ctx.globalAlpha = 0.5 + Math.sin(s.a) * 0.4;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '600 16px "Exo 2"';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText("Tap stars to scan dimensions", state.width / 2, state.height - 50);

            this.ripples.forEach(r => {
                ctx.strokeStyle = `rgba(67,255,126,${r.a})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();
                drawPortalRing(r.x, r.y, Math.max(12, r.r * 0.35), VISUAL.cyan, r.a * 0.18, state.time * 0.001);
            });
            drawLabFrame('#cbd5e1');
        },
        cleanup() {}
    }
};

/**
 * § Main Loop
 */
let particles = [];
let feedbackTimer = null;

function setFeedback(type) {
    clearTimeout(feedbackTimer);
    const showCelebrate = type === 'celebrate';
    const showFail = type === 'fail';

    ui.celebrateGif.classList.toggle('visible', showCelebrate);
    ui.failGif.classList.toggle('visible', showFail);

    if (showCelebrate || showFail) {
        feedbackTimer = setTimeout(() => {
            ui.celebrateGif.classList.remove('visible');
            ui.failGif.classList.remove('visible');
        }, 1400);
    }
}

function createParticles(x, y, color) {
    for (let i = 0; i < 5; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1.0,
            color
        });
    }
}

function gameLoop(time) {
    const dt = time - state.time;
    state.time = time;

    try {
        if (modes[state.mode]) {
            modes[state.mode].update(dt);
            modes[state.mode].draw();
        }

        if (particles.length > 0) {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            particles = particles.filter(p => p.life > 0);
        }
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(gameLoop);
}

/**
 * § Input & Control
 */
function resize() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    canvas.style.width = state.width + 'px';
    canvas.style.height = state.height + 'px';
    canvas.width = state.width * window.devicePixelRatio;
    canvas.height = state.height * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

    if (modes.SAND.canvas) {
        modes.SAND.canvas = null;
        if (state.mode === 'SAND') modes.SAND.init();
    }
}

function switchMode(newMode) {
    if (state.mode === newMode) return;

    if (modes[state.mode] && modes[state.mode].cleanup) {
        modes[state.mode].cleanup();
    }

    state.mode = newMode;

    if (newMode === 'MENU') {
        ui.game.classList.add('hidden');
        ui.modeContainer.style.opacity = '0';
        setFeedback('');
        audio.stopNoise();
        audio.playUi();
    } else {
        ui.game.classList.remove('hidden');
        const gameInfo = GAMES.find(g => g.id === newMode);
        ui.modeTitle.textContent = gameInfo ? gameInfo.name : "";
        ui.modeContainer.style.opacity = '1';
        setTimeout(() => ui.modeContainer.style.opacity = '0', 3000);
        audio.playUi();
        setFeedback('celebrate');
    }

    if (modes[newMode] && modes[newMode].init) {
        modes[newMode].init();
    }

    state.pointer.isDown = false;
}

// Event Listeners
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();

    const handlePointer = (e, isDown) => {
        const rect = canvas.getBoundingClientRect();
        state.pointer.x = e.clientX - rect.left;
        state.pointer.y = e.clientY - rect.top;
        state.pointer.isDown = isDown;
        if (isDown) {
            state.pointer.handled = false;
            if (!state.active) {
                state.active = true;
                audio.init();
                audio.playSuccess();
                ui.prompt.style.display = 'none';
            }
        }
    };

    // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: pointer input remains scoped to canvas and avoids global tap suppression
    canvas.addEventListener('pointerdown', e => handlePointer(e, true), { passive: false });
    canvas.addEventListener('pointermove', e => handlePointer(e, state.pointer.isDown), { passive: false });
    canvas.addEventListener('pointerup', e => handlePointer(e, false), { passive: false });
    canvas.addEventListener('pointercancel', e => handlePointer(e, false), { passive: false });

    ui.backBtn.onclick = () => {
        audio.playUi();
        switchMode('MENU');
    };
    document.getElementById('mute-btn').onclick = () => {
        if (!audio.ctx) return;
        const icon = document.querySelector('#mute-btn .material-symbols-rounded');
        const nextMuted = !audio.muted;
        audio.setMuted(nextMuted);
        if (icon) icon.textContent = nextMuted ? 'volume_off' : 'music_note';
    };

    modes.MENU.init();
    requestAnimationFrame(gameLoop);
});

// Config Bridge
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};
</script>
