<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MOM.EXE Mother's Day Brainrot Arcade</title>
    <!-- [agent-note][stage3] resolved-font: titles=Audiowide, ui=Exo 2, icons=Material Symbols Rounded via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=Material+Symbols+Rounded&display=swap">
    <style>
        :root {
            --bg: #25133f;
            --panel: rgba(86, 31, 83, 0.84);
            --panel-solid: rgba(112, 41, 91, 0.76);
            --text: #fff8fb;
            --muted: #ffd6e8;
            --ring: rgba(255, 111, 174, 0.32);
            --shadow: 0 18px 38px rgba(58, 18, 52, 0.42);
            --radius: 22px;
            --accent: #ff6fae;
            --accent-strong: #8c63ff;
            --accent-warm: #ffd166;
            --danger: #ff8ec7;
            --surface-glow: radial-gradient(circle at top, rgba(255, 214, 232, 0.26), transparent 42%);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 111, 174, 0.24), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 209, 102, 0.18), transparent 30%),
                var(--bg);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            color: var(--text);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(112, 41, 91, 0.94), rgba(58, 18, 52, 0.88)),
                var(--surface-glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ring);
            box-shadow: var(--shadow);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.15rem;
            line-height: 1;
        }

        .btn-hover:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { display: none; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        #main-menu {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 111, 174, 0.24), transparent 22%),
                radial-gradient(circle at 22% 76%, rgba(255, 209, 102, 0.16), transparent 20%),
                radial-gradient(circle at 82% 70%, rgba(117, 232, 255, 0.14), transparent 20%),
                linear-gradient(180deg, rgba(86, 31, 83, 0.92), rgba(37, 19, 63, 0.9));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.5s;
            text-align: center;
        }

        #main-menu h1 {
            margin: 0 0 8px;
            font-size: clamp(2.3rem, 6vw, 3.5rem);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
             color: #fff8fb;
             text-shadow: 0 0 18px rgba(255, 111, 174, 0.46), 0 4px 0 rgba(58, 18, 52, 0.38);
        }

        #main-menu p {
            margin: 0 0 22px;
            max-width: 430px;
            font-size: 0.88rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            line-height: 1.45;
            text-transform: uppercase;
        }

        .mom-mascot {
            position: relative;
            width: clamp(94px, 22vw, 138px);
            aspect-ratio: 1 / 1;
            margin: 0 0 16px;
            pointer-events: none;
            filter: drop-shadow(0 18px 20px rgba(58, 18, 52, 0.42));
            animation: momFloat 4.8s ease-in-out infinite;
        }

        .mom-mascot::before,
        .mom-mascot::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .mom-mascot::before {
            inset: 10%;
            background:
                radial-gradient(circle at 34% 38%, #fff8fb 0 4%, transparent 5%),
                radial-gradient(circle at 64% 38%, #fff8fb 0 4%, transparent 5%),
                radial-gradient(circle at 35% 56%, rgba(255, 111, 174, 0.54) 0 8%, transparent 9%),
                radial-gradient(circle at 65% 56%, rgba(255, 111, 174, 0.54) 0 8%, transparent 9%),
                radial-gradient(circle at 50% 18%, #7a3d58 0 26%, transparent 27%),
                radial-gradient(circle at 50% 57%, #ffd6e8 0 52%, #ff8ec7 53% 72%, #7d2d68 73%);
            border: 4px solid rgba(255, 248, 251, 0.88);
            box-shadow:
                inset 0 10px 18px rgba(255, 255, 255, 0.34),
                inset 0 -16px 24px rgba(58, 18, 52, 0.22),
                0 0 0 8px rgba(255, 111, 174, 0.18);
        }

        .mom-mascot::after {
            left: 50%;
            top: -3%;
            width: 44%;
            height: 26%;
            transform: translateX(-50%);
            background:
                linear-gradient(135deg, transparent 0 18%, #ffd166 19% 36%, transparent 37% 43%, #ffd166 44% 62%, transparent 63% 69%, #ffd166 70%),
                radial-gradient(circle, #fff8fb 0 12%, transparent 13%);
            clip-path: polygon(0 100%, 13% 20%, 33% 72%, 50% 0, 67% 72%, 87% 20%, 100% 100%);
            border-radius: 8px;
            filter: drop-shadow(0 6px 0 rgba(58, 18, 52, 0.2));
        }

        .mom-mascot .apron {
            position: absolute;
            left: 50%;
            bottom: 6%;
            width: 42%;
            height: 28%;
            transform: translateX(-50%);
            border-radius: 16px 16px 22px 22px;
            background:
                radial-gradient(circle at 50% 32%, #ff6fae 0 11%, transparent 12%),
                linear-gradient(180deg, #fff8fb, #ffd6e8);
            border: 3px solid rgba(58, 18, 52, 0.22);
        }

        .mom-mascot .orbit {
            position: absolute;
            inset: -10%;
            border: 2px dashed rgba(117, 232, 255, 0.4);
            border-radius: 999px;
            animation: orbitSpin 14s linear infinite;
        }

        @keyframes momFloat {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-7px) rotate(1deg); }
        }

        @keyframes orbitSpin {
            to { transform: rotate(1turn); }
        }

        #main-menu .grid {
            width: min(100%, 420px);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        #main-menu .grid button {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(255, 248, 251, 0.26);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background:
                radial-gradient(circle at 24% 16%, rgba(255, 255, 255, 0.46), transparent 19%),
                linear-gradient(180deg, rgba(255, 214, 232, 0.24), rgba(112, 41, 91, 0.98)),
                linear-gradient(180deg, rgba(255, 111, 174, 0.98), rgba(86, 31, 83, 0.98));
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.24),
                inset 0 -8px 0 rgba(58, 18, 52, 0.18),
                var(--shadow);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            padding: 12px;
        }

        #main-menu .grid button::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 16px;
            border: 1px dashed rgba(255, 209, 102, 0.28);
            pointer-events: none;
        }

        #main-menu .grid button::after {
            content: "♥";
            position: absolute;
            right: 9px;
            top: 7px;
            color: rgba(255, 209, 102, 0.72);
            font-size: 0.9rem;
            line-height: 1;
            pointer-events: none;
        }

        #main-menu .grid button span:first-child {
            font-size: 1.95rem;
            line-height: 1;
             filter: drop-shadow(0 0 10px rgba(255, 209, 102, 0.32));
        }

        #main-menu .grid button span:last-child {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #start-prompt {
            margin-top: 36px;
            font-size: 0.9rem;
            color: var(--muted);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                16px
                max(16px, env(safe-area-inset-left));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 40;
            pointer-events: auto;
            box-sizing: border-box;
        }

        #back-btn, #mute-btn {
            border: 0;
            font: inherit;
            cursor: pointer;
            color: #eef8ff;
        }

        #back-btn {
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #volume-controls {
            padding: 8px;
            border-radius: 999px;
            display: flex;
            gap: 8px;
        }

        #mute-btn {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: rgba(109, 224, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        #mode-title {
            position: absolute;
            bottom: calc(32px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            pointer-events: none;
            transition: opacity 1s;
            opacity: 0;
        }

        #mode-title h2 {
            margin: 0;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(215, 236, 255, 0.72);
            text-shadow: 0 0 18px rgba(109, 224, 255, 0.3);
        }

        #feedback-overlays {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 35;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 20vw, 148px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(8, 17, 31, 0.36);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: scale(0.82) translateY(18px);
            transition: opacity 220ms ease, transform 220ms ease;
            will-change: transform, opacity;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        #gif-celebrate {
            right: 12px;
            bottom: 104px;
        }

        #gif-fail {
            left: 12px;
            bottom: 104px;
        }

        @media (max-width: 640px) {
            #main-menu {
                padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            }

            #main-menu .grid {
                gap: 10px;
            }

            #main-menu .grid button {
                padding: 10px;
                border-radius: 18px;
            }

            #mode-title {
                bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "breathingSpeed": { "type": "number", "label": "Pace", "value": 0.002, "min": 0.001, "max": 0.01 },
    "bubbleCount": { "type": "number", "label": "Targets", "value": 15, "min": 5, "max": 30 },
    "themeColor": { "type": "color", "label": "Glow Color", "value": "#818cf8" }
}
</script>

<!-- Assets -->
<div id="assets" hidden>
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/fail via catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Relaxing BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_success" data-editable="audio" data-label="Success Cue" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Fail Cue" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
</div>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="main-menu">
            <!-- [agent-note][world-design-superprompt] authored-world: MOM.EXE Mother's Day Brainrot Arcade | mechanics: unchanged calm mini-game hub -->
            <div class="mom-mascot" aria-hidden="true"><span class="orbit"></span><span class="apron"></span></div>
            <h1>MOM.EXE</h1>
            <p>Mother's Day brainrot rituals: tap hearts, stack gifts, sync hugs, send wishes.</p>

            <div class="grid">
                <!-- Generated by JS -->
            </div>

            <div id="start-prompt">Tap to wake mom-core</div>
        </div>

        <!-- In-Game UI -->
        <div id="game-ui" class="hidden">
            <button id="back-btn" class="glass btn-hover">
                <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
                <span>Menu</span>
            </button>
            <div id="volume-controls" class="glass">
                <button id="mute-btn" aria-label="Toggle audio">
                    <span class="material-symbols-rounded" aria-hidden="true">music_note</span>
                </button>
            </div>
        </div>

        <!-- Overlay Title for Mini-games -->
        <div id="mode-title">
            <h2></h2>
        </div>

        <!-- [agent-note][stage3] resolved-gif: success/fail reactions via catalogs/gifs.json -->
        <div id="feedback-overlays" aria-hidden="true">
            <img id="gif-celebrate" class="feedback-gif" alt="" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
            <img id="gif-fail" class="feedback-gif" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        </div>
    </div>
</div>

<script>
/**
 * § Core Engine
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = {
    menu: document.getElementById('main-menu'),
    game: document.getElementById('game-ui'),
    grid: document.querySelector('#main-menu .grid'),
    backBtn: document.getElementById('back-btn'),
    modeTitle: document.querySelector('#mode-title h2'),
    modeContainer: document.getElementById('mode-title'),
    prompt: document.getElementById('start-prompt'),
    celebrateGif: document.getElementById('gif-celebrate'),
    failGif: document.getElementById('gif-fail')
};

// Config
window.gameConfig = {
    breathingSpeed: 0.002,
    bubbleCount: 15,
    themeColor: "#818cf8"
};

// State
let state = {
    mode: 'MENU', // MENU, BREATH, BUBBLE, SAND, SOUND, COLOR, BALL, STRESS, COUNT, NIGHT
    time: 0,
    dt: 0,
    width: 0,
    height: 0,
    active: false,
    pointer: { x: 0, y: 0, isDown: false, startX: 0, startY: 0 }
};

// Mini-Game Definitions
const GAMES = [
    // [agent-note][world-design-superprompt] mode labels map existing mechanics to Mother's Day rituals; do not change ids or input behavior.
    { id: 'BREATH', name: 'Hug Sync', color: '#ff6fae', icon: '💗' },
    { id: 'BUBBLE', name: 'Heart Pop', color: '#73e7a8', icon: '💬' },
    { id: 'SAND', name: 'Card Doodle', color: '#ffd166', icon: '💌' },
    { id: 'SOUND', name: 'Home Mix', color: '#75e8ff', icon: '☕' },
    { id: 'COLOR', name: 'Gift Stack', color: '#ffb27e', icon: '🎁' },
    { id: 'BALL', name: 'Bouquet Orb', color: '#c78bff', icon: '🌸' },
    { id: 'STRESS', name: 'Squish Heart', color: '#ff8ec7', icon: '🫶' },
    { id: 'COUNT', name: 'Gratitude Beat', color: '#73e7a8', icon: 'MOM' },
    { id: 'NIGHT', name: 'Wish Stars', color: '#ffd166', icon: '✨' }
];

/**
 * § Audio System
 */
const audio = {
    ctx: null,
    bgm: document.getElementById('bgm_main'),
    sfxCollect: document.getElementById('sfx_collect'),
    sfxUi: document.getElementById('sfx_ui'),
    sfxSuccess: document.getElementById('sfx_success'),
    sfxFail: document.getElementById('sfx_fail'),
    nodes: [],
    masterGain: null,
    bgmGain: null,
    sfxGain: null,
    mediaGraphAvailable: false,
    initialized: false,
    muted: false,
    lastPlayedAt: {},

    init() {
        if (this.initialized) {
            if (this.ctx?.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.startBgm();
            return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 1;
        this.masterGain.connect(this.ctx.destination);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.2;

        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.6;

        try {
            [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                const source = this.ctx.createMediaElementSource(el);
                source.connect(this.sfxGain);
            });

            const bgmSource = this.ctx.createMediaElementSource(this.bgm);
            bgmSource.connect(this.bgmGain);

            this.bgmGain.connect(this.masterGain);
            this.sfxGain.connect(this.masterGain);
            this.mediaGraphAvailable = true;
        } catch (e) {
            this.mediaGraphAvailable = false;
            this.bgm.volume = 0.2;
            [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                if (el) el.volume = 0.6;
            });
        }

        this.initialized = true;
        this.startBgm();
    },

    startBgm() {
        if (!this.ctx || this.muted) return;
        this.ctx.resume?.().catch(() => {});
        this.bgm.volume = this.mediaGraphAvailable ? 1 : 0.2;
        this.bgm.play().catch(() => {});
    },

    setMuted(muted) {
        this.muted = muted;
        if (this.masterGain && this.mediaGraphAvailable) {
            this.masterGain.gain.value = muted ? 0 : 1;
        }
        if (!this.mediaGraphAvailable) {
            this.bgm.volume = muted ? 0 : 0.2;
        }
        if (muted) {
            this.bgm.pause();
        } else {
            this.startBgm();
        }
    },

    playElement(el, key, { playbackRate = 1, fallbackFreq = 360, fallbackType = 'sine', fallbackDuration = 0.12, minGap = 120 } = {}) {
        if (!this.ctx) return;
        const now = performance.now();
        if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
        this.lastPlayedAt[key] = now;

        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.playbackRate = playbackRate;
                el.play().catch(() => this.synthTone(fallbackFreq, fallbackType, fallbackDuration));
                return;
            } catch (e) {}
        }

        this.synthTone(fallbackFreq, fallbackType, fallbackDuration);
    },

    playCollect() {
        this.playElement(this.sfxCollect, 'collect', {
            playbackRate: 1 + Math.random() * 0.08,
            fallbackFreq: 560,
            fallbackType: 'triangle',
            fallbackDuration: 0.14,
            minGap: 90
        });
    },

    playUi() {
        this.playElement(this.sfxUi, 'ui', {
            playbackRate: 1,
            fallbackFreq: 420,
            fallbackType: 'square',
            fallbackDuration: 0.08,
            minGap: 110
        });
    },

    playSuccess() {
        this.playElement(this.sfxSuccess, 'success', {
            playbackRate: 1,
            fallbackFreq: 680,
            fallbackType: 'sine',
            fallbackDuration: 0.18,
            minGap: 180
        });
    },

    playFail() {
        this.playElement(this.sfxFail, 'fail', {
            playbackRate: 1,
            fallbackFreq: 220,
            fallbackType: 'sawtooth',
            fallbackDuration: 0.16,
            minGap: 180
        });
    },

    synthTone(freq, type, duration) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.11, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    startNoise(type) {
        if (!this.ctx) return;
        this.stopNoise();

        const bufferSize = 2 * this.ctx.sampleRate;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 3.5;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        if (type === 'rain') {
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            gain.gain.value = 0.15;
        } else if (type === 'ocean') {
            filter.type = 'lowpass';
            filter.frequency.value = 400;
            gain.gain.value = 0.2;
            const lfo = this.ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.1;
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 300;
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();
            this.nodes.push(lfo, lfoGain);
        } else {
            filter.type = 'bandpass';
            filter.frequency.value = 500;
            gain.gain.value = 0.1;
        }

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();

        this.nodes.push(noise, gain, filter);
    },

    stopNoise() {
        this.nodes.forEach(n => {
            try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
    }
};
let lastOut = 0;

function drawHeart(ctx, x, y, size, fill, stroke = null) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 32, size / 32);
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.bezierCurveTo(-18, -6, -14, -22, 0, -12);
    ctx.bezierCurveTo(14, -22, 18, -6, 0, 10);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = stroke;
        ctx.stroke();
    }
    ctx.restore();
}

function drawSparkle(ctx, x, y, r, color = '#fff8fb') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((state.time * 0.001 + x) % Math.PI);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.globalAlpha *= 0.82;
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(r, 0);
    ctx.moveTo(0, -r);
    ctx.lineTo(0, r);
    ctx.stroke();
    ctx.restore();
}

function drawGift(ctx, x, y, size, color = '#ffb27e') {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(58,18,52,0.34)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-size / 2, -size / 2, size, size, size * 0.18);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,248,251,0.62)';
    ctx.fillRect(-size * 0.08, -size / 2, size * 0.16, size);
    ctx.fillRect(-size / 2, -size * 0.08, size, size * 0.16);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(-size * 0.13, -size * 0.55, size * 0.13, 0, Math.PI * 2);
    ctx.arc(size * 0.13, -size * 0.55, size * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawMug(ctx, x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#fff8fb';
    ctx.strokeStyle = 'rgba(58,18,52,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-size * 0.35, -size * 0.22, size * 0.62, size * 0.52, size * 0.12);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(size * 0.32, size * 0.02, size * 0.18, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    drawHeart(ctx, -size * 0.05, size * 0.03, size * 0.22, '#ff6fae');
    ctx.strokeStyle = 'rgba(255,111,174,0.36)';
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-size * 0.18 + i * size * 0.16, -size * 0.34);
        ctx.bezierCurveTo(-size * 0.26 + i * size * 0.16, -size * 0.5, -size * 0.08 + i * size * 0.16, -size * 0.55, -size * 0.16 + i * size * 0.16, -size * 0.7);
        ctx.stroke();
    }
    ctx.restore();
}

function drawCard(ctx, x, y, w, h, rot = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#fff3d7';
    ctx.strokeStyle = 'rgba(58,18,52,0.24)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, 10);
    ctx.fill();
    ctx.stroke();
    drawHeart(ctx, 0, -h * 0.08, Math.min(w, h) * 0.28, '#ff6fae');
    ctx.strokeStyle = 'rgba(196,90,147,0.45)';
    ctx.beginPath();
    ctx.moveTo(-w * 0.28, h * 0.25);
    ctx.lineTo(w * 0.28, h * 0.25);
    ctx.stroke();
    ctx.restore();
}

function drawMomMascot(ctx, x, y, size, glow = '#ff6fae') {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowBlur = size * 0.22;
    ctx.shadowColor = glow;
    ctx.fillStyle = '#7a3d58';
    ctx.beginPath();
    ctx.arc(0, -size * 0.32, size * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    const face = ctx.createRadialGradient(-size * 0.18, -size * 0.16, size * 0.05, 0, 0, size * 0.54);
    face.addColorStop(0, '#fff8fb');
    face.addColorStop(0.48, '#ffd6e8');
    face.addColorStop(1, '#ff8ec7');
    ctx.fillStyle = face;
    ctx.strokeStyle = 'rgba(255,248,251,0.88)';
    ctx.lineWidth = Math.max(3, size * 0.045);
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.48, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#3a1234';
    ctx.beginPath();
    ctx.arc(-size * 0.16, -size * 0.04, size * 0.035, 0, Math.PI * 2);
    ctx.arc(size * 0.16, -size * 0.04, size * 0.035, 0, Math.PI * 2);
    ctx.fill();
    drawHeart(ctx, -size * 0.23, size * 0.1, size * 0.13, 'rgba(255,111,174,0.68)');
    drawHeart(ctx, size * 0.23, size * 0.1, size * 0.13, 'rgba(255,111,174,0.68)');
    ctx.fillStyle = '#fff8fb';
    ctx.strokeStyle = 'rgba(58,18,52,0.24)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-size * 0.22, size * 0.22, size * 0.44, size * 0.3, size * 0.1);
    ctx.fill();
    ctx.stroke();
    drawHeart(ctx, 0, size * 0.37, size * 0.12, '#ff6fae');
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.moveTo(-size * 0.26, -size * 0.43);
    ctx.lineTo(-size * 0.12, -size * 0.68);
    ctx.lineTo(0, -size * 0.43);
    ctx.lineTo(size * 0.12, -size * 0.68);
    ctx.lineTo(size * 0.26, -size * 0.43);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawChatBubble(ctx, x, y, w, h, color, label = 'MOM') {
    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(255,248,251,0.42)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.18, y + h * 0.38);
    ctx.lineTo(x + w * 0.34, y + h * 0.62);
    ctx.lineTo(x + w * 0.08, y + h * 0.44);
    ctx.fill();
    ctx.fillStyle = 'rgba(58,18,52,0.56)';
    ctx.font = '700 11px "Exo 2"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y + 1);
    ctx.restore();
}

function drawMomCoreBackdrop(top, bottom, motif = 'hearts') {
    const grad = ctx.createLinearGradient(0, 0, 0, state.height);
    grad.addColorStop(0, top);
    grad.addColorStop(0.58, bottom);
    grad.addColorStop(1, motif === 'night' ? '#25133f' : '#fff8fb');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.width, state.height);

    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = motif === 'night' ? '#8c63ff' : '#ffd6e8';
    ctx.beginPath();
    ctx.ellipse(state.width * 0.5, state.height + 42, state.width * 0.58, 96, 0, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 12; i++) {
        const drift = motif === 'chat' ? state.time * 0.026 : state.time * 0.016;
        const x = ((i * 137 + drift) % (state.width + 150)) - 75;
        const y = 72 + ((i * 83 + Math.sin(state.time * 0.001 + i) * 18) % Math.max(170, state.height - 140));
        if (motif === 'chat') {
            drawChatBubble(ctx, x, y, 74 + (i % 3) * 10, 34, i % 2 ? '#75e8ff' : '#ff6fae', i % 3 ? 'ILY' : 'MOM');
        } else if (motif === 'night') {
            drawSparkle(ctx, x, y, 10 + (i % 3) * 4, i % 2 ? '#ffd166' : '#fff8fb');
            if (i % 4 === 0) drawHeart(ctx, x + 26, y + 6, 22, '#ff6fae');
        } else {
            drawHeart(ctx, x, y, 28 + (i % 3) * 8, i % 2 ? '#ff6fae' : '#ffd166');
        }
    }

    drawCard(ctx, state.width * 0.15, state.height * 0.78, 58, 76, -0.16);
    drawMug(ctx, state.width * 0.84, state.height * 0.8, 70);
    drawMomMascot(ctx, state.width * 0.5, Math.min(state.height * 0.24, 160), Math.min(96, state.width * 0.22), 'rgba(255,111,174,0.32)');
    ctx.restore();
}

const modes = {
    MENU: {
        init() {
            ui.menu.classList.remove('hidden');
            ui.menu.style.opacity = '1';
            ui.game.classList.add('hidden');
            canvas.style.filter = 'blur(5px)';
            if (ui.grid.children.length === 0) {
                GAMES.forEach(g => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-hover';
                    btn.style.backgroundColor = 'white';
                    btn.innerHTML = `<span>${g.icon}</span><span>${g.name}</span>`;
                    btn.onclick = () => switchMode(g.id);
                    ui.grid.appendChild(btn);
                });
            }
        },
        update() {},
        draw() {
            drawMomCoreBackdrop('#fff0f6', '#f6e2ff', 'chat');
        },
        cleanup() {
            ui.menu.style.opacity = '0';
            setTimeout(() => ui.menu.classList.add('hidden'), 500);
            canvas.style.filter = 'none';
        }
    },

    BREATH: {
        phase: 0,
        text: "",
        init() { this.phase = 0; },
        update(dt) {
            this.phase += dt * window.gameConfig.breathingSpeed * 60;
            const cycle = (Math.sin(this.phase) + 1) / 2;
            this.text = cycle < 0.5 ? "Charge" : "Release";
        },
        draw() {
            const cx = state.width / 2;
            const cy = state.height / 2;
            const baseR = Math.min(state.width, state.height) * 0.2;
            const r = baseR + (Math.sin(this.phase) * baseR * 0.5);

            drawMomCoreBackdrop('#fff0f6', '#f7d8ff', 'hearts');

            const grad = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r);
            grad.addColorStop(0, window.gameConfig.themeColor);
            grad.addColorStop(1, 'rgba(255,255,255,0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#eef8ff';
            ctx.font = '700 30px "Audiowide"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.text, cx, cy);
            drawHeart(ctx, cx, cy + 44, 34, '#ff6fae', 'rgba(255,255,255,0.75)');

            ctx.strokeStyle = window.gameConfig.themeColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, baseR * 1.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, baseR * 1.5, -Math.PI / 2, -Math.PI / 2 + ((this.phase % (Math.PI * 2)) / (Math.PI * 2)) * Math.PI * 2);
            ctx.lineWidth = 4;
            ctx.stroke();
        },
        cleanup() {}
    },

    BUBBLE: {
        bubbles: [],
        spawnTimer: 0,
        init() { this.bubbles = []; },
        update(dt) {
            this.spawnTimer += dt;
            if (this.bubbles.length < window.gameConfig.bubbleCount && this.spawnTimer > 500) {
                this.bubbles.push({
                    x: Math.random() * state.width,
                    y: state.height + 50,
                    r: 20 + Math.random() * 30,
                    speed: 0.5 + Math.random(),
                    wobble: Math.random() * Math.PI * 2
                });
                this.spawnTimer = 0;
            }

            this.bubbles.forEach(b => {
                b.y -= b.speed * (dt / 16);
                b.wobble += 0.02;
                b.x += Math.sin(b.wobble) * 0.5;
            });

            if (state.pointer.isDown) {
                for (let i = this.bubbles.length - 1; i >= 0; i--) {
                    const b = this.bubbles[i];
                    const dx = state.pointer.x - b.x;
                    const dy = state.pointer.y - b.y;
                    if (dx * dx + dy * dy < (b.r + 20) ** 2) {
                        this.bubbles.splice(i, 1);
                        audio.playCollect();
                        createParticles(b.x, b.y, window.gameConfig.themeColor);
                        setFeedback('celebrate');
                        state.pointer.isDown = false;
                    }
                }
            }

            this.bubbles = this.bubbles.filter(b => b.y > -100);
        },
        draw() {
            drawMomCoreBackdrop('#fff0f6', '#d8fff0', 'chat');

            this.bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.54)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 111, 174, 0.72)';
                ctx.stroke();

                drawHeart(ctx, b.x, b.y + b.r * 0.08, b.r * 1.05, '#ff6fae');
                ctx.beginPath();
                ctx.arc(b.x - b.r * 0.28, b.y - b.r * 0.34, b.r * 0.18, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.82)';
                ctx.fill();
            });
        },
        cleanup() {}
    },

    SAND: {
        canvas: null,
        sCtx: null,
        lastPt: null,
        init() {
            if (!this.canvas) {
                this.canvas = document.createElement('canvas');
                this.sCtx = this.canvas.getContext('2d');
            }
            this.canvas.width = state.width;
            this.canvas.height = state.height;
            this.sCtx.fillStyle = '#fff3d7';
            this.sCtx.fillRect(0, 0, state.width, state.height);

            for (let i = 0; i < 5000; i++) {
                this.sCtx.fillStyle = 'rgba(0,0,0,0.05)';
                this.sCtx.fillRect(Math.random() * state.width, Math.random() * state.height, 2, 2);
            }
        },
        update(dt) {
            if (state.pointer.isDown) {
                if (!this.lastPt) this.lastPt = { x: state.pointer.x, y: state.pointer.y };

                this.sCtx.beginPath();
                this.sCtx.moveTo(this.lastPt.x, this.lastPt.y);
                this.sCtx.lineTo(state.pointer.x, state.pointer.y);
                this.sCtx.strokeStyle = '#c45a93';
                this.sCtx.lineWidth = 15;
                this.sCtx.lineCap = 'round';
                this.sCtx.lineJoin = 'round';
                this.sCtx.shadowBlur = 2;
                this.sCtx.shadowColor = 'rgba(0,0,0,0.1)';
                this.sCtx.stroke();

                this.lastPt = { x: state.pointer.x, y: state.pointer.y };
            } else {
                this.lastPt = null;
            }

            if (Math.random() > 0.9) {
                this.sCtx.fillStyle = 'rgba(255, 243, 215, 0.01)';
                this.sCtx.fillRect(0, 0, state.width, state.height);
            }
        },
        draw() {
            ctx.drawImage(this.canvas, 0, 0);
        },
        cleanup() { this.lastPt = null; }
    },

    SOUND: {
        buttons: [],
        active: null,
        init() {
            const types = ['rain', 'ocean', 'wind'];
            const labels = ['Coffee', 'Window', 'Cozy Fan'];
            const cx = state.width / 2;
            const cy = state.height / 2;

            this.buttons = types.map((t, i) => ({
                type: t,
                label: labels[i],
                x: cx,
                y: cy - 100 + (i * 100),
                r: 40
            }));
        },
        update(dt) {
            if (state.pointer.isDown && !state.pointer.handled) {
                this.buttons.forEach(b => {
                    const dx = state.pointer.x - b.x;
                    const dy = state.pointer.y - b.y;
                    if (dx * dx + dy * dy < b.r * b.r) {
                        state.pointer.handled = true;
                        if (this.active === b.type) {
                            this.active = null;
                            audio.stopNoise();
                            audio.playFail();
                            setFeedback('fail');
                        } else {
                            this.active = b.type;
                            audio.startNoise(b.type);
                            audio.playSuccess();
                            setFeedback('celebrate');
                        }
                    }
                });
            }
        },
        draw() {
            drawMomCoreBackdrop('#fff0f6', '#e5f9ff', 'chat');

            this.buttons.forEach(b => {
                const isActive = this.active === b.type;
                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, isActive ? b.r + 5 : b.r, 0, Math.PI * 2);
                ctx.fillStyle = isActive ? '#75e8ff' : '#fff8fb';
                ctx.shadowBlur = isActive ? 18 : 10;
                ctx.shadowColor = isActive ? 'rgba(117,232,255,0.42)' : 'rgba(58,18,52,0.15)';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.lineWidth = 3;
                ctx.strokeStyle = isActive ? '#ffd166' : 'rgba(255,111,174,0.38)';
                ctx.stroke();
                drawMug(ctx, b.x, b.y - 4, 34);
                ctx.fillStyle = '#3a1234';
                ctx.font = '700 13px "Exo 2"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.label, b.x, b.y + 24);
                ctx.restore();
            });

            ctx.fillStyle = '#3a1234';
            ctx.font = '700 14px "Exo 2"';
            ctx.textAlign = 'center';
            ctx.fillText("Tap a cozy home sound", state.width / 2, state.height - 50);
        },
        cleanup() { audio.stopNoise(); }
    },

    COLOR: {
        shapes: [],
        dragIdx: -1,
        init() {
            const colors = ['#fca5a5', '#fdba74', '#fcd34d', '#86efac', '#93c5fd', '#c4b5fd'];
            this.shapes = colors.map((c, i) => ({
                x: state.width / 2 + (Math.random() - 0.5) * 100,
                y: state.height / 2 + (Math.random() - 0.5) * 100,
                w: 60, h: 60, c: c,
                type: i % 2
            }));
        },
        update(dt) {
            if (state.pointer.isDown) {
                if (this.dragIdx === -1) {
                    for (let i = this.shapes.length - 1; i >= 0; i--) {
                        const s = this.shapes[i];
                        if (state.pointer.x > s.x - s.w / 2 && state.pointer.x < s.x + s.w / 2 &&
                            state.pointer.y > s.y - s.h / 2 && state.pointer.y < s.y + s.h / 2) {
                            this.dragIdx = i;
                            this.shapes.push(this.shapes.splice(i, 1)[0]);
                            this.dragIdx = this.shapes.length - 1;
                            break;
                        }
                    }
                } else {
                    const s = this.shapes[this.dragIdx];
                    s.x += (state.pointer.x - s.x) * 0.2;
                    s.y += (state.pointer.y - s.y) * 0.2;
                }
            } else {
                this.dragIdx = -1;
            }
        },
        draw() {
            drawMomCoreBackdrop('#fff7e3', '#ffe1ef', 'hearts');

            this.shapes.forEach((s, i) => {
                ctx.fillStyle = s.c;
                ctx.shadowBlur = i === this.dragIdx ? 15 : 5;
                ctx.shadowColor = 'rgba(0,0,0,0.1)';

                if (s.type === 0) {
                    drawGift(ctx, s.x, s.y, s.w, s.c);
                } else {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(58,18,52,0.22)';
                    ctx.stroke();
                    drawHeart(ctx, s.x, s.y + 2, 24, 'rgba(255,255,255,0.72)');
                    drawSparkle(ctx, s.x + s.w * 0.22, s.y - s.h * 0.18, 8, 'rgba(255,248,251,0.86)');
                }
            });
            ctx.shadowBlur = 0;
        },
        cleanup() {}
    },

    BALL: {
        ball: { x: 0, y: 0 },
        trail: [],
        init() {
            this.ball = { x: state.width / 2, y: state.height / 2 };
            this.trail = [];
        },
        update(dt) {
            const tx = state.pointer.isDown ? state.pointer.x : state.width / 2;
            const ty = state.pointer.isDown ? state.pointer.y : state.height / 2;

            this.ball.x += (tx - this.ball.x) * 0.03;
            this.ball.y += (ty - this.ball.y) * 0.03;

            if (state.time % 5 === 0) {
                this.trail.push({ x: this.ball.x, y: this.ball.y, age: 0 });
            }

            this.trail.forEach(t => t.age += dt);
            this.trail = this.trail.filter(t => t.age < 1000);
        },
        draw() {
            drawMomCoreBackdrop('#f5edff', '#fff0f6', 'hearts');

            ctx.beginPath();
            if (this.trail.length > 1) {
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 20;
            ctx.strokeStyle = '#ddd6fe';
            ctx.stroke();

            ctx.save();
            ctx.translate(this.ball.x, this.ball.y);
            ctx.fillStyle = window.gameConfig.themeColor;
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 / 8) * i + state.time * 0.001;
                ctx.beginPath();
                ctx.ellipse(Math.cos(a) * 16, Math.sin(a) * 16, 11, 19, a, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(0, 0, 23, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd6e8';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255,248,251,0.84)';
            ctx.stroke();
            drawHeart(ctx, 0, 2, 24, '#ff6fae');
            ctx.restore();
        },
        cleanup() {}
    },

    STRESS: {
        points: [],
        baseR: 80,
        init() {
            this.points = [];
            for (let i = 0; i < 360; i += 10) {
                this.points.push({
                    a: i * Math.PI / 180,
                    r: this.baseR,
                    tr: this.baseR
                });
            }
        },
        update(dt) {
            const cx = state.width / 2;
            const cy = state.height / 2;

            let press = 0;
            if (state.pointer.isDown) {
                const dx = state.pointer.x - cx;
                const dy = state.pointer.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) press = 30;
            }

            this.points.forEach(p => {
                p.tr = this.baseR - press * Math.random();
                p.r += (p.tr - p.r) * 0.1;
            });
        },
        draw() {
            drawMomCoreBackdrop('#fff1f7', '#ffe8cd', 'hearts');

            const cx = state.width / 2;
            const cy = state.height / 2;

            ctx.beginPath();
            this.points.forEach((p, i) => {
                const x = cx + Math.cos(p.a) * p.r;
                const y = cy + Math.sin(p.a) * p.r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fillStyle = '#ff8ec7';
            ctx.fill();
            drawHeart(ctx, cx, cy + 8, 76, '#ff6fae', 'rgba(255,255,255,0.65)');

            ctx.fillStyle = '#5b1f39';
            ctx.font = '700 20px "Audiowide"';
            ctx.textAlign = 'center';
            ctx.fillText("Hold to squish", cx, cy);
        },
        cleanup() {}
    },

    COUNT: {
        num: 0,
        timer: 0,
        init() { this.num = 0; this.timer = 0; },
        update(dt) {
            this.timer += dt;
            if (this.timer > 2000) {
                this.num++;
                this.timer = 0;
                audio.playSuccess();
                if (navigator.vibrate) navigator.vibrate(50);
            }
        },
        draw() {
            drawMomCoreBackdrop('#eefdf4', '#fff0f6', 'chat');

            ctx.fillStyle = '#3a1234';
            ctx.font = '700 100px "Audiowide"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const scale = 1 + Math.max(0, (500 - this.timer) / 500) * 0.2;
            ctx.save();
            ctx.translate(state.width / 2, state.height / 2);
            ctx.scale(scale, scale);
            ctx.fillText(this.num, 0, 0);
            ctx.restore();

            ctx.font = '600 20px "Exo 2"';
            ctx.fillStyle = '#a9ffd3';
            ctx.fillText("Keep the gratitude beat...", state.width / 2, state.height / 2 + 80);
        },
        cleanup() {}
    },

    NIGHT: {
        stars: [],
        ripples: [],
        init() {
            this.stars = [];
            for (let i = 0; i < 100; i++) {
                this.stars.push({
                    x: Math.random() * state.width,
                    y: Math.random() * state.height,
                    r: Math.random() * 2,
                    a: Math.random()
                });
            }
            this.ripples = [];
        },
        update(dt) {
            this.stars.forEach(s => s.a += 0.01);

            if (state.pointer.isDown && !state.pointer.handled) {
                this.ripples.push({ x: state.pointer.x, y: state.pointer.y, r: 0, a: 1 });
                state.pointer.handled = true;
                audio.playCollect();
                setFeedback('celebrate');
            }

            this.ripples.forEach(r => {
                r.r += 2;
                r.a -= 0.02;
            });
            this.ripples = this.ripples.filter(r => r.a > 0);
        },
        draw() {
            drawMomCoreBackdrop('#25133f', '#5b2a86', 'night');

            this.stars.forEach((s, i) => {
                ctx.globalAlpha = 0.42 + Math.sin(s.a) * 0.34;
                if (i % 13 === 0) {
                    drawHeart(ctx, s.x, s.y, 10 + s.r * 4, '#ff6fae');
                } else {
                    drawSparkle(ctx, s.x, s.y, 4 + s.r * 3, i % 3 ? '#fff8fb' : '#ffd166');
                }
            });
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '700 16px "Exo 2"';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,248,251,0.82)';
            ctx.fillText("Tap sky: send Mom a wish", state.width / 2, state.height - 50);

            this.ripples.forEach(r => {
                ctx.strokeStyle = `rgba(255,209,102,${r.a})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();
                drawHeart(ctx, r.x, r.y, Math.max(8, r.r * 0.12), `rgba(255,111,174,${Math.max(0, r.a)})`);
            });
        },
        cleanup() {}
    }
};

/**
 * § Main Loop
 */
let particles = [];
let feedbackTimer = null;

function setFeedback(type) {
    clearTimeout(feedbackTimer);
    const showCelebrate = type === 'celebrate';
    const showFail = type === 'fail';

    ui.celebrateGif.classList.toggle('visible', showCelebrate);
    ui.failGif.classList.toggle('visible', showFail);

    if (showCelebrate || showFail) {
        feedbackTimer = setTimeout(() => {
            ui.celebrateGif.classList.remove('visible');
            ui.failGif.classList.remove('visible');
        }, 1400);
    }
}

function createParticles(x, y, color) {
    for (let i = 0; i < 5; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1.0,
            color
        });
    }
}

function gameLoop(time) {
    const dt = time - state.time;
    state.time = time;

    try {
        if (modes[state.mode]) {
            modes[state.mode].update(dt);
            modes[state.mode].draw();
        }

        if (particles.length > 0) {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = Math.max(0, p.life);
                drawHeart(ctx, p.x, p.y, 9, p.color);
            });
            ctx.globalAlpha = 1;
            particles = particles.filter(p => p.life > 0);
        }
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(gameLoop);
}

/**
 * § Input & Control
 */
function resize() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    canvas.style.width = state.width + 'px';
    canvas.style.height = state.height + 'px';
    canvas.width = state.width * window.devicePixelRatio;
    canvas.height = state.height * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

    if (modes.SAND.canvas) {
        modes.SAND.canvas = null;
        if (state.mode === 'SAND') modes.SAND.init();
    }
}

function switchMode(newMode) {
    if (state.mode === newMode) return;

    if (modes[state.mode] && modes[state.mode].cleanup) {
        modes[state.mode].cleanup();
    }

    state.mode = newMode;

    if (newMode === 'MENU') {
        ui.game.classList.add('hidden');
        ui.modeContainer.style.opacity = '0';
        setFeedback('');
        audio.stopNoise();
        audio.playUi();
    } else {
        ui.game.classList.remove('hidden');
        const gameInfo = GAMES.find(g => g.id === newMode);
        ui.modeTitle.textContent = gameInfo ? gameInfo.name : "";
        ui.modeContainer.style.opacity = '1';
        setTimeout(() => ui.modeContainer.style.opacity = '0', 3000);
        audio.playUi();
        setFeedback('celebrate');
    }

    if (modes[newMode] && modes[newMode].init) {
        modes[newMode].init();
    }

    state.pointer.isDown = false;
}

// Event Listeners
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();

    const handlePointer = (e, isDown) => {
        const rect = canvas.getBoundingClientRect();
        state.pointer.x = e.clientX - rect.left;
        state.pointer.y = e.clientY - rect.top;
        state.pointer.isDown = isDown;
        if (isDown) {
            state.pointer.handled = false;
            if (!state.active) {
                state.active = true;
                audio.init();
                audio.playSuccess();
                ui.prompt.style.display = 'none';
            }
        }
    };

    // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: pointer input remains scoped to canvas and avoids global tap suppression
    canvas.addEventListener('pointerdown', e => handlePointer(e, true), { passive: false });
    canvas.addEventListener('pointermove', e => handlePointer(e, state.pointer.isDown), { passive: false });
    canvas.addEventListener('pointerup', e => handlePointer(e, false), { passive: false });
    canvas.addEventListener('pointercancel', e => handlePointer(e, false), { passive: false });

    ui.backBtn.onclick = () => {
        audio.playUi();
        switchMode('MENU');
    };
    document.getElementById('mute-btn').onclick = () => {
        if (!audio.ctx) return;
        const icon = document.querySelector('#mute-btn .material-symbols-rounded');
        const nextMuted = !audio.muted;
        audio.setMuted(nextMuted);
        if (icon) icon.textContent = nextMuted ? 'volume_off' : 'music_note';
    };

    modes.MENU.init();
    requestAnimationFrame(gameLoop);
});

// Config Bridge
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};
</script>
