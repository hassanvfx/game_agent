<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hogwarts Spellroom Arcade</title>
    <!-- [agent-note][stage3] resolved-font: titles=Cinzel, ui=Exo 2, icons=Material Symbols Rounded via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Exo+2:wght@400;600&family=Material+Symbols+Rounded&display=swap">
    <style>
        :root {
            --bg: #101324;
            --panel: rgba(16, 19, 36, 0.84);
            --panel-solid: rgba(23, 28, 48, 0.82);
            --text: #fff8df;
            --muted: #d7bd83;
            --ring: rgba(214, 168, 79, 0.42);
            --shadow: 0 18px 38px rgba(4, 6, 14, 0.45);
            --radius: 22px;
            --accent: #7dd3fc;
            --accent-strong: #8b5cf6;
            --accent-warm: #ffd166;
            --danger: #b45309;
            --parchment: #f4e7c5;
            --ink: #4b2f1a;
            --surface-glow: radial-gradient(circle at top, rgba(255, 209, 102, 0.2), transparent 44%);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 209, 102, 0.18), transparent 28%),
                radial-gradient(circle at 15% 80%, rgba(49, 92, 154, 0.28), transparent 32%),
                radial-gradient(circle at 85% 72%, rgba(139, 92, 246, 0.18), transparent 34%),
                linear-gradient(180deg, #101324, #07101d 72%, #10241b);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            color: var(--text);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(24, 23, 37, 0.92), rgba(11, 17, 31, 0.88)),
                var(--surface-glow);
            color: var(--text);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ring);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 248, 223, 0.12);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.15rem;
            line-height: 1;
        }

        .btn-hover:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { display: none; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        #main-menu {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 16%, rgba(255, 209, 102, 0.18), transparent 20%),
                radial-gradient(circle at 20% 78%, rgba(125, 211, 252, 0.16), transparent 26%),
                linear-gradient(180deg, rgba(16, 19, 36, 0.92), rgba(7, 16, 29, 0.9));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.5s;
            text-align: center;
        }

        #main-menu h1 {
            margin: 0 0 8px;
            font-size: clamp(2.3rem, 6vw, 3.5rem);
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--parchment);
            text-shadow: 0 0 18px rgba(255, 209, 102, 0.38), 0 2px 0 rgba(75, 47, 26, 0.55);
        }

        #main-menu p {
            margin: 0 0 32px;
            font-size: 0.95rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #main-menu .grid {
            width: min(100%, 420px);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        #main-menu .grid button {
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(214, 168, 79, 0.36);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background:
                radial-gradient(circle at 50% 16%, rgba(255, 209, 102, 0.2), transparent 22%),
                linear-gradient(180deg, rgba(244, 231, 197, 0.13), rgba(16, 19, 36, 0.96));
            box-shadow: var(--shadow);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            padding: 12px;
        }

        #main-menu .grid button span:first-child {
            font-size: 1.95rem;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255, 209, 102, 0.34));
        }

        #main-menu .grid button span:last-child {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #start-prompt {
            margin-top: 36px;
            font-size: 0.9rem;
            color: var(--muted);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                16px
                max(16px, env(safe-area-inset-left));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 40;
            pointer-events: auto;
            box-sizing: border-box;
        }

        #back-btn, #mute-btn {
            border: 0;
            font: inherit;
            cursor: pointer;
            color: #eef8ff;
        }

        #back-btn {
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #volume-controls {
            padding: 8px;
            border-radius: 999px;
            display: flex;
            gap: 8px;
        }

        #mute-btn {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: rgba(109, 224, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        #mode-title {
            position: absolute;
            bottom: calc(32px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            pointer-events: none;
            transition: opacity 1s;
            opacity: 0;
        }

        #mode-title h2 {
            margin: 0;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-family: 'Cinzel', Georgia, serif;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 248, 223, 0.84);
            text-shadow: 0 0 18px rgba(255, 209, 102, 0.34);
        }

        #feedback-overlays {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 35;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 20vw, 148px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(8, 17, 31, 0.36);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: scale(0.82) translateY(18px);
            transition: opacity 220ms ease, transform 220ms ease;
            will-change: transform, opacity;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        #gif-celebrate {
            right: 12px;
            bottom: 104px;
        }

        #gif-fail {
            left: 12px;
            bottom: 104px;
        }

        @media (max-width: 640px) {
            #main-menu {
                padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            }

            #main-menu .grid {
                gap: 10px;
            }

            #main-menu .grid button {
                padding: 10px;
                border-radius: 18px;
            }

            #mode-title {
                bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "breathingSpeed": { "type": "number", "label": "Pace", "value": 0.002, "min": 0.001, "max": 0.01 },
    "bubbleCount": { "type": "number", "label": "Targets", "value": 15, "min": 5, "max": 30 },
    "themeColor": { "type": "color", "label": "Glow Color", "value": "#818cf8" }
}
</script>

<!-- Assets -->
<div id="assets" hidden>
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/fail via catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Relaxing BGM" src="https://gamezone-virid.vercel.app/assets/audios/bgm/mystical_bgm_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI Click" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_character_01.mp3" preload="auto"></audio>
    <audio id="sfx_success" data-editable="audio" data-label="Success Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Fail Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_defeat_01.mp3" preload="auto"></audio>
</div>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="main-menu">
            <h1>Hogwarts Spellroom</h1>
            <p>Calm spell lessons for wand, potion, map, and stars</p>

            <div class="grid">
                <!-- Generated by JS -->
            </div>

            <div id="start-prompt">Tap anywhere to open the spellroom</div>
        </div>

        <!-- In-Game UI -->
        <div id="game-ui" class="hidden">
            <button id="back-btn" class="glass btn-hover">
                <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
                <span>Castle Map</span>
            </button>
            <div id="volume-controls" class="glass">
                <button id="mute-btn" aria-label="Toggle audio">
                    <span class="material-symbols-rounded" aria-hidden="true">music_note</span>
                </button>
            </div>
        </div>

        <!-- Overlay Title for Mini-games -->
        <div id="mode-title">
            <h2></h2>
        </div>

        <!-- [agent-note][stage3] resolved-gif: success/fail reactions via catalogs/gifs.json -->
        <div id="feedback-overlays" aria-hidden="true">
            <img id="gif-celebrate" class="feedback-gif" alt="" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
            <img id="gif-fail" class="feedback-gif" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        </div>
    </div>
</div>

<script>
/**
 * § Core Engine
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = {
    menu: document.getElementById('main-menu'),
    game: document.getElementById('game-ui'),
    grid: document.querySelector('#main-menu .grid'),
    backBtn: document.getElementById('back-btn'),
    modeTitle: document.querySelector('#mode-title h2'),
    modeContainer: document.getElementById('mode-title'),
    prompt: document.getElementById('start-prompt'),
    celebrateGif: document.getElementById('gif-celebrate'),
    failGif: document.getElementById('gif-fail')
};

// Config
window.gameConfig = {
    breathingSpeed: 0.002,
    bubbleCount: 15,
    themeColor: "#818cf8"
};

// State
let state = {
    mode: 'MENU', // MENU, BREATH, BUBBLE, SAND, SOUND, COLOR, BALL, STRESS, COUNT, NIGHT
    time: 0,
    dt: 0,
    width: 0,
    height: 0,
    active: false,
    pointer: { x: 0, y: 0, isDown: false, startX: 0, startY: 0 }
};

// Mini-Game Definitions
const GAMES = [
    { id: 'BREATH', name: 'Wand Focus', color: '#ffd166', icon: '✦' },
    { id: 'BUBBLE', name: 'Potion Orbs', color: '#6ee7b7', icon: '○' },
    { id: 'SAND', name: 'Marauder Runes', color: '#d6a84f', icon: '〰' },
    { id: 'SOUND', name: 'Weather Charms', color: '#7dd3fc', icon: '♬' },
    { id: 'COLOR', name: 'Sorting Stack', color: '#fbbf24', icon: '◆' },
    { id: 'BALL', name: 'Patronus Wisp', color: '#dbeafe', icon: '●' },
    { id: 'STRESS', name: 'Containment Charm', color: '#fdba74', icon: '◈' },
    { id: 'COUNT', name: 'Spell Metronome', color: '#86efac', icon: '123' },
    { id: 'NIGHT', name: 'Astronomy Ripples', color: '#cbd5e1', icon: '★' }
];

// [agent-note][visuals_unified] visual-intent: procedural Hogwarts scenes; preserve all hitboxes, timers, and pointer semantics.
function drawHogwartsBackdrop(scene, t = state.time * 0.001) {
    const w = state.width;
    const h = state.height;
    const palettes = {
        hall: ['#111827', '#23180f', '#3b2615'],
        classroom: ['#142034', '#173c35', '#2b1f14'],
        parchment: ['#f4e7c5', '#d7bd83', '#8a6431'],
        forest: ['#07101d', '#10241b', '#0f3140'],
        tower: ['#070b1f', '#172554', '#312e81']
    };
    const p = palettes[scene] || palettes.hall;
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, p[0]);
    grad.addColorStop(0.62, p[1]);
    grad.addColorStop(1, p[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    if (scene === 'parchment') {
        ctx.fillStyle = 'rgba(75,47,26,0.08)';
        for (let i = 0; i < 18; i++) {
            const x = ((i * 83 + Math.sin(t + i) * 10) % (w + 60)) - 30;
            ctx.fillRect(x, 0, 1, h);
        }
        ctx.strokeStyle = 'rgba(75,47,26,0.18)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            const y = h * (0.2 + i * 0.18);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.quadraticCurveTo(w * 0.45, y + Math.sin(t + i) * 20, w, y + Math.cos(t + i) * 12);
            ctx.stroke();
        }
        drawFootprints(t);
        return;
    }

    drawArches(scene, t);
    if (scene === 'hall' || scene === 'classroom') drawCandles(t);
    if (scene === 'classroom') drawShelvesAndFeathers(t);
    if (scene === 'forest') drawForest(t);
    if (scene === 'tower') drawTowerAndStars(t);
    drawVignette();
}

function drawArches(scene, t) {
    const w = state.width;
    const h = state.height;
    ctx.save();
    ctx.globalAlpha = scene === 'tower' ? 0.22 : 0.3;
    ctx.strokeStyle = scene === 'hall' ? 'rgba(255,209,102,0.24)' : 'rgba(219,234,254,0.2)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
        const x = (w * (0.14 + i * 0.24) + Math.sin(t * 0.4 + i) * 4);
        const y = h * 0.18;
        const aw = Math.max(52, w * 0.12);
        const ah = h * 0.28;
        ctx.beginPath();
        ctx.moveTo(x - aw / 2, y + ah);
        ctx.lineTo(x - aw / 2, y + aw / 2);
        ctx.quadraticCurveTo(x, y - aw * 0.35, x + aw / 2, y + aw / 2);
        ctx.lineTo(x + aw / 2, y + ah);
        ctx.stroke();
    }
    ctx.restore();
}

function drawCandles(t) {
    const w = state.width;
    const h = state.height;
    for (let i = 0; i < 12; i++) {
        const x = (i * 73 + 31) % w;
        const y = h * (0.14 + (i % 4) * 0.1) + Math.sin(t * 1.2 + i) * 7;
        ctx.fillStyle = 'rgba(244,231,197,0.68)';
        ctx.fillRect(x - 3, y, 6, 22);
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,209,102,${0.45 + Math.sin(t * 3 + i) * 0.16})`;
        ctx.ellipse(x, y - 7, 6, 11, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawShelvesAndFeathers(t) {
    const w = state.width;
    const h = state.height;
    ctx.strokeStyle = 'rgba(214,168,79,0.28)';
    ctx.lineWidth = 3;
    for (let y = h * 0.22; y < h * 0.7; y += h * 0.16) {
        ctx.beginPath();
        ctx.moveTo(w * 0.06, y);
        ctx.lineTo(w * 0.3, y);
        ctx.moveTo(w * 0.7, y);
        ctx.lineTo(w * 0.94, y);
        ctx.stroke();
    }
    ctx.fillStyle = 'rgba(219,234,254,0.55)';
    for (let i = 0; i < 5; i++) {
        const x = w * (0.18 + i * 0.16);
        const y = h * (0.24 + (i % 2) * 0.32) + Math.sin(t + i) * 9;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(t + i) * 0.45);
        ctx.beginPath();
        ctx.ellipse(0, 0, 4, 22, 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawForest(t) {
    const w = state.width;
    const h = state.height;
    for (let i = 0; i < 14; i++) {
        const x = i * w / 12 + Math.sin(t * 0.25 + i) * 5 - w * 0.08;
        const top = h * (0.18 + (i % 3) * 0.08);
        ctx.fillStyle = i % 2 ? 'rgba(4,16,18,0.62)' : 'rgba(8,30,24,0.7)';
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x - 26, h);
        ctx.lineTo(x + 28, h);
        ctx.closePath();
        ctx.fill();
    }
    for (let i = 0; i < 18; i++) {
        const x = (i * 47 + Math.sin(t + i) * 18) % w;
        const y = (h * 0.25 + i * 37 + Math.cos(t * 0.9 + i) * 12) % h;
        ctx.fillStyle = 'rgba(125,211,252,0.55)';
        ctx.beginPath();
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawTowerAndStars(t) {
    const w = state.width;
    const h = state.height;
    ctx.strokeStyle = 'rgba(219,234,254,0.34)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
        const x1 = (i * 57 + 20) % w;
        const y1 = h * (0.18 + (i % 5) * 0.11);
        const x2 = (x1 + 70) % w;
        const y2 = y1 + Math.sin(t + i) * 18 + 35;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }
    ctx.fillStyle = 'rgba(7,11,31,0.82)';
    ctx.fillRect(0, h * 0.78, w, h * 0.22);
    for (let x = 0; x < w; x += 34) {
        ctx.fillRect(x, h * 0.7, 10, h * 0.3);
    }
}

function drawFootprints(t) {
    const w = state.width;
    const h = state.height;
    ctx.save();
    ctx.fillStyle = 'rgba(75,47,26,0.18)';
    for (let i = 0; i < 12; i++) {
        const x = (w * 0.1 + i * w * 0.075 + Math.sin(t + i) * 8) % w;
        const y = h * 0.22 + ((i * 47 + t * 18) % (h * 0.56));
        ctx.beginPath();
        ctx.ellipse(x, y, 4, 8, i % 2 ? 0.35 : -0.35, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawVignette() {
    const w = state.width;
    const h = state.height;
    const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.18, w / 2, h / 2, Math.max(w, h) * 0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.32)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
}

function drawSpellRing(cx, cy, r, color, t) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * (1 + i * 0.18), t * (i + 1), Math.PI * 1.55 + t * (i + 1));
        ctx.stroke();
    }
    for (let i = 0; i < 8; i++) {
        const a = t + i * Math.PI / 4;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * r * 1.35, cy + Math.sin(a) * r * 1.35, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
    }
    ctx.restore();
}

/**
 * § Audio System
 */
const audio = {
    ctx: null,
    bgm: document.getElementById('bgm_main'),
    sfxCollect: document.getElementById('sfx_collect'),
    sfxUi: document.getElementById('sfx_ui'),
    sfxSuccess: document.getElementById('sfx_success'),
    sfxFail: document.getElementById('sfx_fail'),
    nodes: [],
    masterGain: null,
    bgmGain: null,
    sfxGain: null,
    mediaGraphAvailable: false,
    initialized: false,
    muted: false,
    lastPlayedAt: {},

    init() {
        if (this.initialized) {
            if (this.ctx?.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.startBgm();
            return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 1;
        this.masterGain.connect(this.ctx.destination);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.2;

        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.6;

        // [agent-note][stage4] repaired: remote audio stays on HTMLMediaElement playback to avoid cross-origin MediaElementSource silence.
        this.mediaGraphAvailable = false;
        this.bgm.volume = 0.2;
        [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
            if (el) el.volume = 0.6;
        });

        this.initialized = true;
        this.startBgm();
    },

    startBgm() {
        if (!this.ctx || this.muted) return;
        this.ctx.resume?.().catch(() => {});
        this.bgm.volume = this.mediaGraphAvailable ? 1 : 0.2;
        this.bgm.play().catch(() => {});
    },

    setMuted(muted) {
        this.muted = muted;
        if (this.masterGain && this.mediaGraphAvailable) {
            this.masterGain.gain.value = muted ? 0 : 1;
        }
        if (!this.mediaGraphAvailable) {
            this.bgm.volume = muted ? 0 : 0.2;
        }
        if (muted) {
            this.bgm.pause();
        } else {
            this.startBgm();
        }
    },

    playElement(el, key, { playbackRate = 1, fallbackFreq = 360, fallbackType = 'sine', fallbackDuration = 0.12, minGap = 120 } = {}) {
        if (!this.ctx) return;
        const now = performance.now();
        if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
        this.lastPlayedAt[key] = now;

        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.playbackRate = playbackRate;
                el.play().catch(() => this.synthTone(fallbackFreq, fallbackType, fallbackDuration));
                return;
            } catch (e) {}
        }

        this.synthTone(fallbackFreq, fallbackType, fallbackDuration);
    },

    playCollect() {
        this.playElement(this.sfxCollect, 'collect', {
            playbackRate: 1 + Math.random() * 0.08,
            fallbackFreq: 560,
            fallbackType: 'triangle',
            fallbackDuration: 0.14,
            minGap: 90
        });
    },

    playUi() {
        this.playElement(this.sfxUi, 'ui', {
            playbackRate: 1,
            fallbackFreq: 420,
            fallbackType: 'square',
            fallbackDuration: 0.08,
            minGap: 110
        });
    },

    playSuccess() {
        this.playElement(this.sfxSuccess, 'success', {
            playbackRate: 1,
            fallbackFreq: 680,
            fallbackType: 'sine',
            fallbackDuration: 0.18,
            minGap: 180
        });
    },

    playFail() {
        this.playElement(this.sfxFail, 'fail', {
            playbackRate: 1,
            fallbackFreq: 220,
            fallbackType: 'sawtooth',
            fallbackDuration: 0.16,
            minGap: 180
        });
    },

    synthTone(freq, type, duration) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.11, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    startNoise(type) {
        if (!this.ctx) return;
        this.stopNoise();

        const bufferSize = 2 * this.ctx.sampleRate;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 3.5;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        if (type === 'rain') {
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            gain.gain.value = 0.15;
        } else if (type === 'ocean') {
            filter.type = 'lowpass';
            filter.frequency.value = 400;
            gain.gain.value = 0.2;
            const lfo = this.ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.1;
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 300;
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();
            this.nodes.push(lfo, lfoGain);
        } else {
            filter.type = 'bandpass';
            filter.frequency.value = 500;
            gain.gain.value = 0.1;
        }

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();

        this.nodes.push(noise, gain, filter);
    },

    stopNoise() {
        this.nodes.forEach(n => {
            try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
    }
};

                ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '600 16px "Exo 2"';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText("Tap constellations to send ripples", state.width / 2, state.height - 50);

            this.ripples.forEach(r => {
                ctx.strokeStyle = `rgba(255,255,255,${r.a})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();
            });
        },
        cleanup() {}
    }
};

/**
 * § Main Loop
 */
let particles = [];
let feedbackTimer = null;

function setFeedback(type) {
    clearTimeout(feedbackTimer);
    const showCelebrate = type === 'celebrate';
    const showFail = type === 'fail';

    ui.celebrateGif.classList.toggle('visible', showCelebrate);
    ui.failGif.classList.toggle('visible', showFail);

    if (showCelebrate || showFail) {
        feedbackTimer = setTimeout(() => {
            ui.celebrateGif.classList.remove('visible');
            ui.failGif.classList.remove('visible');
        }, 1400);
    }
}

function createParticles(x, y, color) {
    for (let i = 0; i < 5; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1.0,
            color
        });
    }
}

function gameLoop(time) {
    const dt = time - state.time;
    state.time = time;

    try {
        if (modes[state.mode]) {
            modes[state.mode].update(dt);
            modes[state.mode].draw();
        }

        if (particles.length > 0) {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            particles = particles.filter(p => p.life > 0);
        }
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(gameLoop);
}

/**
 * § Input & Control
 */
function resize() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    canvas.style.width = state.width + 'px';
    canvas.style.height = state.height + 'px';
    canvas.width = state.width * window.devicePixelRatio;
    canvas.height = state.height * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

    if (modes.SAND.canvas) {
        modes.SAND.canvas = null;
        if (state.mode === 'SAND') modes.SAND.init();
    }
}

function switchMode(newMode) {
    if (state.mode === newMode) return;

    if (modes[state.mode] && modes[state.mode].cleanup) {
        modes[state.mode].cleanup();
    }

    state.mode = newMode;

    if (newMode === 'MENU') {
        ui.game.classList.add('hidden');
        ui.modeContainer.style.opacity = '0';
        setFeedback('');
        audio.stopNoise();
        audio.playUi();
    } else {
        ui.game.classList.remove('hidden');
        const gameInfo = GAMES.find(g => g.id === newMode);
        ui.modeTitle.textContent = gameInfo ? gameInfo.name : "";
        ui.modeContainer.style.opacity = '1';
        setTimeout(() => ui.modeContainer.style.opacity = '0', 3000);
        audio.playUi();
        setFeedback('celebrate');
    }

    if (modes[newMode] && modes[newMode].init) {
        modes[newMode].init();
    }

    state.pointer.isDown = false;
}

// Event Listeners
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();

    const handlePointer = (e, isDown) => {
        const rect = canvas.getBoundingClientRect();
        state.pointer.x = e.clientX - rect.left;
        state.pointer.y = e.clientY - rect.top;
        state.pointer.isDown = isDown;
        if (isDown) {
            state.pointer.handled = false;
            if (!state.active) {
                state.active = true;
                audio.init();
                audio.playSuccess();
                ui.prompt.style.display = 'none';
            }
        }
    };

    // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: pointer input remains scoped to canvas and avoids global tap suppression
    canvas.addEventListener('pointerdown', e => handlePointer(e, true), { passive: false });
    canvas.addEventListener('pointermove', e => handlePointer(e, state.pointer.isDown), { passive: false });
    canvas.addEventListener('pointerup', e => handlePointer(e, false), { passive: false });
    canvas.addEventListener('pointercancel', e => handlePointer(e, false), { passive: false });

    ui.backBtn.onclick = () => {
        audio.playUi();
        switchMode('MENU');
    };
    document.getElementById('mute-btn').onclick = () => {
        if (!audio.ctx) return;
        const icon = document.querySelector('#mute-btn .material-symbols-rounded');
        const nextMuted = !audio.muted;
        audio.setMuted(nextMuted);
        if (icon) icon.textContent = nextMuted ? 'volume_off' : 'music_note';
    };

    modes.MENU.init();
    requestAnimationFrame(gameLoop);
});

// Config Bridge
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};
</script>
