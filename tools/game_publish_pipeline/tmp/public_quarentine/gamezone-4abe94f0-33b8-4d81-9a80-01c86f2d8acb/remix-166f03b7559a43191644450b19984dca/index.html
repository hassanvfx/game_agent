<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Feather Flight Calm Arcade</title>
    <link rel="icon" href="data:,">
    <!-- [agent-note][stage4] repaired: console-noise | element: favicon | action: inline empty favicon prevents implicit local /favicon.ico 404 -->
    <!-- [agent-note][stage3] resolved-font: titles=Audiowide, ui=Exo 2, icons=Material Symbols Rounded via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=Material+Symbols+Rounded&display=swap">
    <style>
        :root {
            --bg: #08111f;
            --panel: rgba(8, 17, 31, 0.82);
            --panel-solid: rgba(14, 27, 49, 0.76);
            --text: #d7ecff;
            --muted: #87a9cb;
            --ring: rgba(124, 220, 255, 0.28);
            --shadow: 0 18px 38px rgba(0, 8, 20, 0.42);
            --radius: 22px;
            --accent: #6de0ff;
            --accent-strong: #8c7bff;
            --accent-warm: #ffd166;
            --danger: #ff7aa8;
            --surface-glow: radial-gradient(circle at top, rgba(109, 224, 255, 0.24), transparent 42%);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 225, 128, 0.16), transparent 26%),
                radial-gradient(circle at 80% 12%, rgba(94, 224, 111, 0.12), transparent 22%),
                radial-gradient(circle at bottom, rgba(109, 224, 255, 0.2), transparent 34%),
                var(--bg);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            color: var(--text);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(17, 33, 57, 0.94), rgba(10, 19, 34, 0.88)),
                var(--surface-glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ring);
            box-shadow: var(--shadow);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.15rem;
            line-height: 1;
        }

        .btn-hover:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { display: none; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        #main-menu {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 230, 109, 0.16), transparent 20%),
                radial-gradient(circle at 18% 72%, rgba(94, 224, 111, 0.12), transparent 24%),
                linear-gradient(180deg, rgba(8, 17, 31, 0.9), rgba(4, 10, 20, 0.88));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.5s;
            text-align: center;
        }

        #main-menu h1 {
            position: relative;
            margin: 0 0 8px;
            padding-top: 72px;
            font-size: clamp(2.1rem, 6vw, 3.4rem);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #eef8ff;
            text-shadow: 0 0 18px rgba(109, 224, 255, 0.38);
        }

        #main-menu h1::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 84px;
            height: 58px;
            transform: translateX(-50%);
            border-radius: 54% 46% 48% 52%;
            background:
                radial-gradient(circle at 62% 35%, #08111f 0 4px, transparent 5px),
                radial-gradient(ellipse at 36% 66%, rgba(255,255,255,0.65) 0 11px, transparent 12px),
                linear-gradient(135deg, #fff185 0%, #ffe66d 46%, #ffc857 100%);
            box-shadow:
                inset 0 -6px 0 rgba(255, 159, 28, 0.28),
                0 0 0 3px rgba(255,255,255,0.28),
                0 18px 34px rgba(109, 224, 255, 0.22);
            animation: birdBadgeFloat 2.8s ease-in-out infinite;
        }

        #main-menu h1::after {
            content: "";
            position: absolute;
            top: 18px;
            left: calc(50% + 37px);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 22px solid #ff9f1c;
            filter: drop-shadow(0 1px 0 rgba(0,0,0,0.18));
            animation: birdBadgeFloat 2.8s ease-in-out infinite;
        }

        @keyframes birdBadgeFloat {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -7px; }
        }

        #main-menu p {
            margin: 0 0 32px;
            font-size: 0.95rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #main-menu .grid {
            width: min(100%, 420px);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        #main-menu .grid button {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(124, 220, 255, 0.3);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background:
                radial-gradient(circle at 28% 20%, rgba(255, 230, 109, 0.24), transparent 26%),
                linear-gradient(180deg, rgba(19, 39, 68, 0.98), rgba(8, 17, 31, 0.98));
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.12);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            padding: 12px;
        }

        #main-menu .grid button::before {
            content: "";
            position: absolute;
            inset: auto -12% -24% -12%;
            height: 44%;
            z-index: -1;
            opacity: 0.55;
            background:
                radial-gradient(ellipse at 25% 40%, rgba(255,255,255,0.5) 0 24%, transparent 25%),
                radial-gradient(ellipse at 48% 34%, rgba(255,255,255,0.42) 0 24%, transparent 25%),
                radial-gradient(ellipse at 68% 45%, rgba(255,255,255,0.48) 0 24%, transparent 25%),
                linear-gradient(90deg, transparent, rgba(94,224,111,0.24), transparent);
            animation: cardCloudDrift 6s linear infinite;
        }

        #main-menu .grid button::after {
            content: "";
            position: absolute;
            top: 8px;
            right: 9px;
            width: 12px;
            height: 30px;
            border-radius: 999px 999px 7px 7px;
            background: linear-gradient(180deg, rgba(94,224,111,0.65), rgba(21,128,61,0.24));
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes cardCloudDrift {
            from { transform: translateX(-10px); }
            to { transform: translateX(10px); }
        }

        #main-menu .grid button span:first-child {
            font-size: 1.95rem;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(109, 224, 255, 0.22));
        }

        #main-menu .grid button span:last-child {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #start-prompt {
            margin-top: 36px;
            font-size: 0.9rem;
            color: var(--muted);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                16px
                max(16px, env(safe-area-inset-left));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 40;
            pointer-events: auto;
            box-sizing: border-box;
        }

        #back-btn, #mute-btn {
            border: 0;
            font: inherit;
            cursor: pointer;
            color: #eef8ff;
        }

        #back-btn {
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: var(--shadow), inset 0 -2px 0 rgba(94, 224, 111, 0.14);
        }

        #volume-controls {
            padding: 8px;
            border-radius: 999px;
            display: flex;
            gap: 8px;
        }

        #mute-btn {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: rgba(109, 224, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        #mode-title {
            position: absolute;
            bottom: calc(32px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            pointer-events: none;
            transition: opacity 1s;
            opacity: 0;
        }

        #mode-title h2 {
            margin: 0;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(215, 236, 255, 0.72);
            text-shadow: 0 0 18px rgba(109, 224, 255, 0.3);
        }

        #feedback-overlays {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 35;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 20vw, 148px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(8, 17, 31, 0.36);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: scale(0.82) translateY(18px);
            transition: opacity 220ms ease, transform 220ms ease;
            will-change: transform, opacity;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        #gif-celebrate {
            right: 12px;
            bottom: 104px;
        }

        #gif-fail {
            left: 12px;
            bottom: 104px;
        }

        @media (max-width: 640px) {
            #main-menu {
                padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            }

            #main-menu .grid {
                gap: 10px;
            }

            #main-menu .grid button {
                padding: 10px;
                border-radius: 18px;
            }

            #mode-title {
                bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

<!-- Configuration -->
<script id="game-config" type="application/x-game-config">
{
    "breathingSpeed": { "type": "number", "label": "Pace", "value": 0.002, "min": 0.001, "max": 0.01 },

}
</script>

<!-- Assets -->
<div id="assets" hidden>
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/fail via catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Relaxing BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect Cue" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>

    <audio id="sfx_success" data-editable="audio" data-label="Success Cue" preload="none"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Fail Cue" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="main-menu">
            <h1>Feather Flight</h1>
            <p>Choose a sky ritual and practice gentle wings</p>

            <div class="grid">
                <!-- Generated by JS -->
            </div>

            <div id="start-prompt">Tap the sky to wake the tiny bird</div>
        </div>

        <!-- In-Game UI -->
        <div id="game-ui" class="hidden">
            <button id="back-btn" class="glass btn-hover">
                <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
                <span>Nest Map</span>
            </button>

                <button id="mute-btn" aria-label="Toggle audio">
                    <span class="material-symbols-rounded" aria-hidden="true">music_note</span>
                </button>

        <!-- Overlay Title for Mini-games -->
        <div id="mode-title">
            <h2></h2>
        </div>

        <!-- [agent-note][stage3] resolved-gif: success/fail reactions via catalogs/gifs.json -->
        <div id="feedback-overlays" aria-hidden="true">
            <img id="gif-celebrate" class="feedback-gif" alt="" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
            <img id="gif-fail" class="feedback-gif" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        </div>

<script>
/**
 * § Core Engine
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = {
    menu: document.getElementById('main-menu'),
    game: document.getElementById('game-ui'),
    grid: document.querySelector('#main-menu .grid'),
    backBtn: document.getElementById('back-btn'),
    modeTitle: document.querySelector('#mode-title h2'),
    modeContainer: document.getElementById('mode-title'),
    prompt: document.getElementById('start-prompt'),
    celebrateGif: document.getElementById('gif-celebrate'),
    failGif: document.getElementById('gif-fail')
};

// Config
window.gameConfig = {
    breathingSpeed: 0.002,
    bubbleCount: 15,
    themeColor: "#818cf8"
};

// State
let state = {
    mode: 'MENU', // MENU, BREATH, BUBBLE, SAND, SOUND, COLOR, BALL, STRESS, COUNT, NIGHT
    time: 0,
    dt: 0,
    width: 0,
    height: 0,
    active: false,
    pointer: { x: 0, y: 0, isDown: false, startX: 0, startY: 0 }
};

// Mini-Game Definitions
const GAMES = [
    { id: 'BREATH', name: 'Thermal Sync', color: '#a5b4fc', icon: '◎' },
    { id: 'BUBBLE', name: 'Cloud Pop', color: '#6ee7b7', icon: '○' },
    { id: 'SAND', name: 'Wind Trail', color: '#fcd34d', icon: '〰' },
    { id: 'SOUND', name: 'Breeze Mix', color: '#93c5fd', icon: '♫' },
    { id: 'COLOR', name: 'Plume Stack', color: '#fca5a5', icon: '❖' },
    { id: 'BALL', name: 'Egg Glide', color: '#c4b5fd', icon: '●' },
    { id: 'STRESS', name: 'Nest Pulse', color: '#fdba74', icon: '◈' },
    { id: 'COUNT', name: 'Wingbeats', color: '#86efac', icon: '123' },
    { id: 'NIGHT', name: 'Star Flock', color: '#cbd5e1', icon: '★' }
];

/**
 * § Audio System
 */
const audio = {
    ctx: null,
    bgm: document.getElementById('bgm_main'),
    sfxCollect: document.getElementById('sfx_collect'),
    sfxUi: document.getElementById('sfx_ui'),
    sfxSuccess: document.getElementById('sfx_success'),
    sfxFail: document.getElementById('sfx_fail'),
    nodes: [],
    masterGain: null,
    bgmGain: null,
    sfxGain: null,
    mediaGraphAvailable: false,
    initialized: false,
    muted: false,
    lastPlayedAt: {},

    init() {
        if (this.initialized) {
            if (this.ctx?.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.startBgm();
            return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 1;
        this.masterGain.connect(this.ctx.destination);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.2;

        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.6;

        const mediaEls = [this.bgm, this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].filter(Boolean);
        const canRouteMediaGraph = mediaEls.every((el) => {
            try {
                return new URL(el.currentSrc || el.src, window.location.href).origin === window.location.origin;
            } catch (e) {
                return false;
            }
        });

        if (canRouteMediaGraph) {
            try {
                [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                    const source = this.ctx.createMediaElementSource(el);
                    source.connect(this.sfxGain);
                });

                const bgmSource = this.ctx.createMediaElementSource(this.bgm);
                bgmSource.connect(this.bgmGain);

                this.bgmGain.connect(this.masterGain);
                this.sfxGain.connect(this.masterGain);
                this.mediaGraphAvailable = true;
            } catch (e) {
                this.mediaGraphAvailable = false;
            }
        } else {
            // [agent-note][stage4] repaired: audio-cors | element: remote catalog audio | action: direct element playback avoids silent CORS MediaElementAudioSource routing
            this.mediaGraphAvailable = false;
        }

        if (!this.mediaGraphAvailable) {
            this.bgm.volume = 0.2;
            [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                if (el) el.volume = 0.6;
            });
        }

        this.initialized = true;
        this.startBgm();
    },

    startBgm() {
        if (!this.ctx || this.muted) return;
        this.ctx.resume?.().catch(() => {});
        this.bgm.volume = this.mediaGraphAvailable ? 1 : 0.2;
        this.bgm.play().catch(() => {});
    },

    setMuted(muted) {
        this.muted = muted;
        if (this.masterGain && this.mediaGraphAvailable) {
            this.masterGain.gain.value = muted ? 0 : 1;
        }
        if (!this.mediaGraphAvailable) {
            this.bgm.volume = muted ? 0 : 0.2;
            [this.sfxCollect, this.sfxUi, this.sfxSuccess, this.sfxFail].forEach((el) => {
                if (el) el.volume = muted ? 0 : 0.6;
            });
        }
        if (muted) {
            this.bgm.pause();
        } else {
            this.startBgm();
        }
    },

    playElement(el, key, { playbackRate = 1, fallbackFreq = 360, fallbackType = 'sine', fallbackDuration = 0.12, minGap = 120 } = {}) {
        if (!this.ctx || this.muted) return;
        const now = performance.now();
        if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
        this.lastPlayedAt[key] = now;

        if (el && (el.currentSrc || el.src)) {
            try {
                el.pause();
                el.currentTime = 0;
                el.playbackRate = playbackRate;
                el.play().catch(() => this.synthTone(fallbackFreq, fallbackType, fallbackDuration));
                return;
            } catch (e) {}
        }

        this.synthTone(fallbackFreq, fallbackType, fallbackDuration);
    },

    playCollect() {
        this.playElement(this.sfxCollect, 'collect', {
            playbackRate: 1 + Math.random() * 0.08,
            fallbackFreq: 560,
            fallbackType: 'triangle',
            fallbackDuration: 0.14,
            minGap: 90
        });
    },

    playUi() {
        this.playElement(this.sfxUi, 'ui', {
            playbackRate: 1,
            fallbackFreq: 420,
            fallbackType: 'square',
            fallbackDuration: 0.08,
            minGap: 110
        });
    },

    playSuccess() {
        this.playElement(this.sfxSuccess, 'success', {
            playbackRate: 1,
            fallbackFreq: 680,
            fallbackType: 'sine',
            fallbackDuration: 0.18,
            minGap: 180
        });
    },

    playFail() {
        this.playElement(this.sfxFail, 'fail', {
            playbackRate: 1,
            fallbackFreq: 220,
            fallbackType: 'sawtooth',
            fallbackDuration: 0.16,
            minGap: 180
        });
    },

    synthTone(freq, type, duration) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.11, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    startNoise(type) {
        if (!this.ctx) return;
        this.stopNoise();

        const bufferSize = 2 * this.ctx.sampleRate;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 3.5;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        if (type === 'rain') {
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            gain.gain.value = 0.15;
        } else if (type === 'ocean') {
            filter.type = 'lowpass';
            filter.frequency.value = 400;
            gain.gain.value = 0.2;
            const lfo = this.ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.1;
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 300;
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();
            this.nodes.push(lfo, lfoGain);
        } else {
            filter.type = 'bandpass';
            filter.frequency.value = 500;
            gain.gain.value = 0.1;
        }

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();

        this.nodes.push(noise, gain, filter);
    },

    stopNoise() {
        this.nodes.forEach(n => {
            try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
    }
};
let lastOut = 0;

/**
 * § Procedural Feather Flight Art
 * Visual-only helpers: they never alter hitboxes, timing, pointer handling, scoring, or mode state.
 */
const SKY_PALETTES = {
    menu: ['#bff3ff', '#e7fbff', '#fff7dc'],
    breath: ['#9ee7ff', '#dffbff', '#fff3bf'],
    bubble: ['#75d9ff', '#d8fbff', '#f7fff2'],
    sand: ['#ffe7a8', '#fff7dc', '#c7f9cc'],
    sound: ['#a7e8ff', '#e6fbff', '#d9f99d'],
    color: ['#bff3ff', '#fdf2f8', '#fff7dc'],
    ball: ['#c7d2fe', '#f5f3ff', '#fff7dc'],
    stress: ['#172554', '#30446f', '#ffd166'],
    count: ['#a7f3d0', '#effff7', '#bff3ff'],
    night: ['#070b1d', '#172554', '#8c7bff']
};

function roundedRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
}

function drawCloudPuff(x, y, s = 1, alpha = 0.55) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(x - 30 * s, y + 6 * s, 30 * s, 15 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x, y, 38 * s, 22 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 34 * s, y + 7 * s, 30 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawPipeArch(x, y, w, h, alpha = 0.22) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(x, y, x + w, y);
    g.addColorStop(0, '#15803d');
    g.addColorStop(0.45, '#5ee06f');
    g.addColorStop(1, '#14532d');
    ctx.fillStyle = g;
    roundedRect(ctx, x, y, w, h, Math.min(18, w / 3));
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    roundedRect(ctx, x - w * 0.16, y - 12, w * 1.32, 22, 12);
    ctx.fill();
    ctx.restore();
}

function drawFeather(x, y, s = 1, color = '#6de0ff', rotation = -0.5, alpha = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(8,17,31,0.18)';
    ctx.lineWidth = Math.max(1, 1.5 * s);
    ctx.beginPath();
    ctx.ellipse(0, 0, 7 * s, 20 * s, -0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.72)';
    ctx.beginPath();
    ctx.moveTo(0, -17 * s);
    ctx.lineTo(0, 20 * s);
    ctx.stroke();
    ctx.restore();
}

function drawTinyBird(x, y, s = 1, flap = 0, body = '#ffe66d') {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = 'rgba(8,17,31,0.24)';
    ctx.shadowBlur = 10 * s;
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(0, 0, 28 * s, 21 * s, 0.05, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath();
    ctx.moveTo(24 * s, -4 * s);
    ctx.lineTo(44 * s, 4 * s);
    ctx.lineTo(24 * s, 12 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff7dc';
    ctx.beginPath();
    ctx.ellipse(-9 * s, 7 * s + Math.sin(flap) * 2 * s, 14 * s, 9 * s, -0.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#08111f';
    ctx.beginPath();
    ctx.arc(12 * s, -7 * s, 3.2 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(8,17,31,0.24)';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.arc(-18 * s, 0, 12 * s, Math.PI * 0.7, Math.PI * 1.45);
    ctx.stroke();
    ctx.restore();
}

function drawEggOrb(x, y, s = 1, color = '#ffd166') {
    ctx.save();
    ctx.translate(x, y);
    const g = ctx.createRadialGradient(-8 * s, -10 * s, 2 * s, 0, 0, 28 * s);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, color);
    g.addColorStop(1, '#8c7bff');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(140,123,255,0.35)';
    ctx.shadowBlur = 18 * s;
    ctx.beginPath();
    ctx.ellipse(0, 2 * s, 22 * s, 28 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(8,17,31,0.2)';
    ctx.lineWidth = 2 * s;
    ctx.stroke();
    ctx.restore();
}

function drawSkyWorld(variant = 'menu') {
    const [top, mid, bottom] = SKY_PALETTES[variant] || SKY_PALETTES.menu;
    const t = state.time * 0.00005;
    const g = ctx.createLinearGradient(0, 0, 0, state.height);
    g.addColorStop(0, top);
    g.addColorStop(0.54, mid);
    g.addColorStop(1, bottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, state.width, state.height);

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 6; i++) {
        const x = ((i * 190 + t * (360 + i * 25)) % (state.width + 260)) - 130;
        const y = 86 + (i % 3) * 84 + Math.sin(t * 7 + i) * 12;
        drawCloudPuff(x, y, 0.55 + (i % 3) * 0.12, variant === 'night' ? 0.12 : 0.32);
    }

    if (variant === 'night') {
        ctx.fillStyle = 'rgba(255,247,220,0.82)';
        ctx.beginPath();
        ctx.arc(state.width - 62, 82, 34, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = top;
        ctx.beginPath();
        ctx.arc(state.width - 48, 72, 34, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.fillStyle = 'rgba(255,230,109,0.42)';
        ctx.beginPath();
        ctx.arc(state.width - 68, 78, 38, 0, Math.PI * 2);
        ctx.fill();
    }

    const archY = state.height * 0.55 + Math.sin(t * 16) * 12;
    drawPipeArch(26 + Math.sin(t * 4) * 14, archY, 44, state.height * 0.26, variant === 'stress' ? 0.12 : 0.2);
    drawPipeArch(state.width - 74 + Math.cos(t * 4) * 12, archY - 56, 44, state.height * 0.32, variant === 'stress' ? 0.12 : 0.18);

    ctx.strokeStyle = variant === 'night' ? 'rgba(141, 190, 255, 0.16)' : 'rgba(109,224,255,0.22)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const y = state.height - 115 - i * 34;
        ctx.moveTo(-40, y);
        ctx.quadraticCurveTo(state.width * 0.3, y - 32 + Math.sin(t * 22 + i) * 10, state.width + 40, y);
        ctx.stroke();
    }

    for (let i = 0; i < 8; i++) {
        drawFeather((i * 97 + t * 260) % (state.width + 80) - 40, 120 + ((i * 71) % Math.max(180, state.height - 220)), 0.42, i % 2 ? '#ffe66d' : '#6de0ff', Math.sin(t * 12 + i), variant === 'night' ? 0.22 : 0.28);
    }
    ctx.restore();
}

function drawCloudRing(x, y, r, alpha = 0.82) {
    drawCloudPuff(x, y, r / 54, alpha * 0.78);
    ctx.save();
    ctx.strokeStyle = `rgba(109,224,255,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
}

    BREATH: {
        phase: 0,
        text: "",
        init() { this.phase = 0; },
        update(dt) {

            drawSkyWorld('breath');
            const cx = state.width / 2;
            const cy = state.height / 2;

            ctx.beginPath();

            ctx.fillStyle = '#eef8ff';

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.strokeStyle = window.gameConfig.themeColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, baseR * 1.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, baseR * 1.5, -Math.PI / 2, -Math.PI / 2 + ((this.phase % (Math.PI * 2)) / (Math.PI * 2)) * Math.PI * 2);
            ctx.lineWidth = 4;
            ctx.stroke();

    BUBBLE: {
        bubbles: [],
        spawnTimer: 0,
        init() { this.bubbles = []; },
        update(dt) {
            this.spawnTimer += dt;
            if (this.bubbles.length < window.gameConfig.bubbleCount && this.spawnTimer > 500) {
                this.bubbles.push({
                    x: Math.random() * state.width,
                    y: state.height + 50,
                    r: 20 + Math.random() * 30,
                    speed: 0.5 + Math.random(),
                    wobble: Math.random() * Math.PI * 2
                });
                this.spawnTimer = 0;
            }

            this.bubbles.forEach(b => {
                b.y -= b.speed * (dt / 16);
                b.wobble += 0.02;
                b.x += Math.sin(b.wobble) * 0.5;
            });

            if (state.pointer.isDown) {
                for (let i = this.bubbles.length - 1; i >= 0; i--) {
                    const b = this.bubbles[i];
                    const dx = state.pointer.x - b.x;
                    const dy = state.pointer.y - b.y;
                    if (dx * dx + dy * dy < (b.r + 20) ** 2) {
                        this.bubbles.splice(i, 1);
                        audio.playCollect();
                        createParticles(b.x, b.y, window.gameConfig.themeColor);
                        setFeedback('celebrate');
                        state.pointer.isDown = false;
                    }
                }
            }

            this.bubbles = this.bubbles.filter(b => b.y > -100);
        },
        draw() {
            drawSkyWorld('bubble');

            this.bubbles.forEach(b => {
                drawCloudRing(b.x, b.y, b.r, 0.86);
                ctx.fillStyle = 'rgba(255,255,255,0.86)';
                ctx.beginPath();
                ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.28, b.r * 0.16, 0, Math.PI * 2);
                ctx.fill();
            });
        },
        cleanup() {}
    },

    SAND: {
        canvas: null,
        sCtx: null,
        lastPt: null,
        init() {
            if (!this.canvas) {
                this.canvas = document.createElement('canvas');
                this.sCtx = this.canvas.getContext('2d');
            }
            this.canvas.width = state.width;
            this.canvas.height = state.height;
            this.sCtx.fillStyle = '#fef3c7';
            this.sCtx.fillRect(0, 0, state.width, state.height);

            for (let i = 0; i < 5000; i++) {
                this.sCtx.fillStyle = 'rgba(0,0,0,0.05)';
                this.sCtx.fillRect(Math.random() * state.width, Math.random() * state.height, 2, 2);
            }
        },
        update(dt) {
            if (state.pointer.isDown) {
                if (!this.lastPt) this.lastPt = { x: state.pointer.x, y: state.pointer.y };

                this.sCtx.beginPath();
                this.sCtx.moveTo(this.lastPt.x, this.lastPt.y);
                this.sCtx.lineTo(state.pointer.x, state.pointer.y);
                this.sCtx.strokeStyle = '#d97706';
                this.sCtx.lineWidth = 15;
                this.sCtx.lineCap = 'round';
                this.sCtx.lineJoin = 'round';
                this.sCtx.shadowBlur = 2;
                this.sCtx.shadowColor = 'rgba(0,0,0,0.1)';
                this.sCtx.stroke();

                this.lastPt = { x: state.pointer.x, y: state.pointer.y };
            } else {
                this.lastPt = null;
            }

            if (Math.random() > 0.9) {
                this.sCtx.fillStyle = 'rgba(254, 243, 199, 0.01)';
                this.sCtx.fillRect(0, 0, state.width, state.height);
            }
        },
        draw() {
            drawSkyWorld('sand');
            ctx.save();
            ctx.globalAlpha = 0.78;
            ctx.drawImage(this.canvas, 0, 0);
            ctx.restore();
            drawTinyBird(state.width - 72, 92, 0.55, state.time * 0.008);

    SOUND: {

        active: null,

            const labels = ['Rain', 'Cloud', 'Wind'];
            const cx = state.width / 2;
            const cy = state.height / 2;

            this.buttons = types.map((t, i) => ({
                type: t,
                label: labels[i],
                x: cx,
                y: cy - 100 + (i * 100),
                r: 40
            }));
        },
        update(dt) {
            if (state.pointer.isDown && !state.pointer.handled) {
                this.buttons.forEach(b => {
                    const dx = state.pointer.x - b.x;
                    const dy = state.pointer.y - b.y;
                    if (dx * dx + dy * dy < b.r * b.r) {
                        state.pointer.handled = true;
                        if (this.active === b.type) {
                            this.active = null;
                            audio.stopNoise();
                            audio.playFail();
                            setFeedback('fail');
                        } else {
                            this.active = b.type;

                            audio.playSuccess();

                ctx.fillStyle = isActive ? window.gameConfig.themeColor : 'rgba(255,255,255,0.88)';

    COLOR: {
        shapes: [],
        dragIdx: -1,
        init() {
            const colors = ['#fca5a5', '#fdba74', '#fcd34d', '#86efac', '#93c5fd', '#c4b5fd'];
            this.shapes = colors.map((c, i) => ({
                x: state.width / 2 + (Math.random() - 0.5) * 100,
                y: state.height / 2 + (Math.random() - 0.5) * 100,
                w: 60, h: 60, c: c,
                type: i % 2
            }));
        },
        update(dt) {
            if (state.pointer.isDown) {
                if (this.dragIdx === -1) {
                    for (let i = this.shapes.length - 1; i >= 0; i--) {
                        const s = this.shapes[i];
                        if (state.pointer.x > s.x - s.w / 2 && state.pointer.x < s.x + s.w / 2 &&
                            state.pointer.y > s.y - s.h / 2 && state.pointer.y < s.y + s.h / 2) {
                            this.dragIdx = i;
                            this.shapes.push(this.shapes.splice(i, 1)[0]);
                            this.dragIdx = this.shapes.length - 1;
                            break;

                } else {
                    const s = this.shapes[this.dragIdx];
                    s.x += (state.pointer.x - s.x) * 0.2;

                this.dragIdx = -1;

            drawSkyWorld('count');
            drawFeather(state.width / 2 - 86, state.height / 2 - 70, 1.1, '#5ee06f', -0.8, 0.82);
            drawFeather(state.width / 2 + 86, state.height / 2 - 70, 1.1, '#6de0ff', 0.8, 0.82);

            ctx.fillStyle = '#0d728f';
            ctx.font = '700 100px "Audiowide"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const scale = 1 + Math.max(0, (500 - this.timer) / 500) * 0.2;
            ctx.save();
            ctx.translate(state.width / 2, state.height / 2);
            ctx.scale(scale, scale);
            ctx.fillText(this.num, 0, 0);
            ctx.restore();

            ctx.font = '600 20px "Exo 2"';
            ctx.fillStyle = '#a9ffd3';
            ctx.fillText("Count wingbeats...", state.width / 2, state.height / 2 + 80);
        },
        cleanup() {}
    },

    NIGHT: {
        stars: [],
        ripples: [],
        init() {
            this.stars = [];
            for (let i = 0; i < 100; i++) {
                this.stars.push({
                    x: Math.random() * state.width,
                    y: Math.random() * state.height,
                    r: Math.random() * 2,
                    a: Math.random()
                });
            }
            this.ripples = [];
        },
        update(dt) {
            this.stars.forEach(s => s.a += 0.01);

            if (state.pointer.isDown && !state.pointer.handled) {
                this.ripples.push({ x: state.pointer.x, y: state.pointer.y, r: 0, a: 1 });
                state.pointer.handled = true;
                audio.playCollect();
                setFeedback('celebrate');
            }

            this.ripples.forEach(r => {
                r.r += 2;
                r.a -= 0.02;
            });
            this.ripples = this.ripples.filter(r => r.a > 0);
        },
        draw() {
            drawSkyWorld('night');

            this.stars.forEach(s => {
                ctx.globalAlpha = 0.5 + Math.sin(s.a) * 0.4;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '600 16px "Exo 2"';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText("Tap the sky to signal the flock", state.width / 2, state.height - 50);

            this.ripples.forEach(r => {
                ctx.strokeStyle = `rgba(255,255,255,${r.a})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();
            });
        },
        cleanup() {}
    }
};

/**
 * § Main Loop
 */
let particles = [];
let feedbackTimer = null;

function setFeedback(type) {
    clearTimeout(feedbackTimer);
    const showCelebrate = type === 'celebrate';
    const showFail = type === 'fail';

    ui.celebrateGif.classList.toggle('visible', showCelebrate);
    ui.failGif.classList.toggle('visible', showFail);

    if (showCelebrate || showFail) {
        feedbackTimer = setTimeout(() => {
            ui.celebrateGif.classList.remove('visible');
            ui.failGif.classList.remove('visible');
        }, 1400);
    }
}

function createParticles(x, y, color) {
    for (let i = 0; i < 7; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1.0,
            color,
            spin: Math.random() * Math.PI * 2,
            scale: 0.38 + Math.random() * 0.34
        });
    }
}

function gameLoop(time) {
    const dt = time - state.time;
    state.time = time;

    try {
        if (modes[state.mode]) {
            modes[state.mode].update(dt);
            modes[state.mode].draw();
        }

        if (particles.length > 0) {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = Math.max(0, p.life);
                drawFeather(p.x, p.y, p.scale || 0.4, p.color, (p.spin || 0) + p.life * 2, Math.max(0, p.life));
            });
            ctx.globalAlpha = 1;
            particles = particles.filter(p => p.life > 0);
        }
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(gameLoop);
}

/**
 * § Input & Control
 */
function resize() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    canvas.style.width = state.width + 'px';
    canvas.style.height = state.height + 'px';
    canvas.width = state.width * window.devicePixelRatio;
    canvas.height = state.height * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

    if (modes.SAND.canvas) {
        modes.SAND.canvas = null;
        if (state.mode === 'SAND') modes.SAND.init();
    }
}

function switchMode(newMode) {
    if (state.mode === newMode) return;

    if (modes[state.mode] && modes[state.mode].cleanup) {
        modes[state.mode].cleanup();
    }

    state.mode = newMode;

    if (newMode === 'MENU') {
        ui.game.classList.add('hidden');
        ui.modeContainer.style.opacity = '0';
        setFeedback('');
        audio.stopNoise();
        audio.playUi();
    } else {
        ui.game.classList.remove('hidden');
        const gameInfo = GAMES.find(g => g.id === newMode);
        ui.modeTitle.textContent = gameInfo ? gameInfo.name : "";
        ui.modeContainer.style.opacity = '1';
        setTimeout(() => ui.modeContainer.style.opacity = '0', 3000);
        audio.playUi();
        setFeedback('celebrate');
    }

    if (modes[newMode] && modes[newMode].init) {
        modes[newMode].init();
    }

    state.pointer.isDown = false;
}

// Event Listeners
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();

    const handlePointer = (e, isDown) => {
        const rect = canvas.getBoundingClientRect();
        state.pointer.x = e.clientX - rect.left;
        state.pointer.y = e.clientY - rect.top;
        state.pointer.isDown = isDown;
        if (isDown) {
            state.pointer.handled = false;
            if (!state.active) {
                state.active = true;
                audio.init();
                audio.playSuccess();
                ui.prompt.style.display = 'none';
            }
        }
    };

    // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: pointer input remains scoped to canvas and avoids global tap suppression
    canvas.addEventListener('pointerdown', e => handlePointer(e, true), { passive: false });
    canvas.addEventListener('pointermove', e => handlePointer(e, state.pointer.isDown), { passive: false });
    canvas.addEventListener('pointerup', e => handlePointer(e, false), { passive: false });
    canvas.addEventListener('pointercancel', e => handlePointer(e, false), { passive: false });

    ui.backBtn.onclick = () => {
        audio.playUi();
        switchMode('MENU');
    };
    document.getElementById('mute-btn').onclick = () => {
        if (!audio.ctx) return;
        const icon = document.querySelector('#mute-btn .material-symbols-rounded');
        const nextMuted = !audio.muted;
        audio.setMuted(nextMuted);
        if (icon) icon.textContent = nextMuted ? 'volume_off' : 'music_note';
    };

    modes.MENU.init();
    requestAnimationFrame(gameLoop);
});

// Config Bridge
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};
</script>
