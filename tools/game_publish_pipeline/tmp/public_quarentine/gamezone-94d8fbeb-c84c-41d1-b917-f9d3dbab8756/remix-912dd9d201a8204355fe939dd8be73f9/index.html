<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Hammer Box: Arena Lab</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: display=Audiowide ui=Orbitron from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --c-bg: #060816;
            --c-bg-deep: #03050d;
            --c-ui: rgba(12, 19, 40, 0.84);
            --c-ui-strong: rgba(15, 27, 58, 0.96);
            --c-accent: #38bdf8;
            --c-accent-2: #a855f7;
            --c-highlight: #67e8f9;
            --c-danger: #ff5f7a;
            --c-gold: #ffd166;
            --c-text: #eff6ff;
            --c-text-dim: #8fa6d8;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Orbitron', sans-serif;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 35%),
                radial-gradient(circle at bottom, rgba(168, 85, 247, 0.18), transparent 30%),
                linear-gradient(180deg, var(--c-bg), var(--c-bg-deep));
            color: var(--c-text);
            user-select: none;
            -webkit-user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 22%, transparent 78%, rgba(255,255,255,0.02)),
                repeating-linear-gradient(90deg, rgba(103,232,249,0.04) 0 1px, transparent 1px 80px);
            opacity: 0.55;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* UI Components */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 28, 60, 0.94), rgba(8, 13, 31, 0.9));
            backdrop-filter: blur(14px);
            border: 1px solid rgba(103, 232, 249, 0.22);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 0 1px rgba(168,85,247,0.08),
                0 10px 30px rgba(0, 0, 0, 0.45);
        }

        .joystick-zone {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.1);
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .joystick-knob {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(56, 189, 248, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* Editor UI */
        .tab-btn {
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--c-text-dim);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-transform: uppercase;
            white-space: nowrap;
            font-family: var(--font-ui);
            letter-spacing: 0.12em;
        }
        .tab-btn.active {
            color: var(--c-highlight);
            border-bottom-color: var(--c-highlight);
            text-shadow: 0 0 12px rgba(103, 232, 249, 0.35);
        }

        .item-btn {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(22,34,73,0.95), rgba(8,13,31,0.96));
            border: 2px solid rgba(77, 95, 145, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .item-btn.selected {
            border-color: var(--c-highlight);
            background: linear-gradient(180deg, rgba(20,33,70,0.98), rgba(6,11,27,0.98));
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.22);
        }
        .item-btn:active {
            transform: scale(0.95);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Admin Panel */
        .admin-toggle {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .admin-toggle input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #38bdf8; }
        input:checked + .slider:before { transform: translateX(20px); }

        .action-button {
            background: radial-gradient(circle at 30% 30%, #ffe9a8, var(--c-gold));
            box-shadow:
                0 0 0 4px rgba(255, 209, 102, 0.24),
                0 12px 26px rgba(0, 0, 0, 0.45);
        }

        .arcade-title {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow:
                0 0 12px rgba(103, 232, 249, 0.4),
                0 0 28px rgba(168, 85, 247, 0.25);
        }

        .hud-label,
        .mode-label {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        /* Animations */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.05), transparent);
            pointer-events: none;
            animation: scanline 4s linear infinite;
        }

        .feedback-gif {
            position: absolute;
            width: min(32vw, 140px);
            height: auto;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.2s ease, transform 0.2s ease;
            filter: drop-shadow(0 0 16px rgba(103, 232, 249, 0.35));
            mix-blend-mode: screen;
        }

        .feedback-gif.show {
            opacity: 0.88;
            transform: scale(1);
        }

        .feedback-gif-impact {
            right: 16px;
            top: calc(var(--safe-top) + 58px);
        }

        .feedback-gif-defeat {
            left: 50%;
            top: 18%;
            width: min(52vw, 220px);
            transform: translateX(-50%) scale(0.85);
        }

        .feedback-gif-defeat.show {
            transform: translateX(-50%) scale(1);
        }

        @media (max-width: 640px) {
            .feedback-gif-impact {
                right: 10px;
                top: calc(var(--safe-top) + 54px);
                width: min(34vw, 110px);
            }

            .feedback-gif-defeat {
                top: 16%;
                width: min(58vw, 180px);
            }
        }
    </style>
</head>
<body>

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full overflow-hidden">
        <canvas id="gameCanvas"></canvas>
        <div class="scanline"></div>

        <!-- [agent-note][stage3] resolved-gif: impact + defeat overlays -> catalogs/gifs.json -->
        <div id="feedback-layer" class="absolute inset-0 z-30 pointer-events-none">
            <img id="impact-gif" class="feedback-gif feedback-gif-impact hidden" alt="impact feedback" src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp">
            <img id="defeat-gif" class="feedback-gif feedback-gif-defeat hidden" alt="defeat feedback" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
        </div>

        <!-- MAIN MENU -->
        <div id="main-menu" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 transition-opacity duration-500">
            <div class="mb-8 text-center relative">
                <div class="absolute -inset-10 bg-blue-500/10 blur-3xl rounded-full"></div>
                <h1 class="arcade-title relative text-5xl font-bold text-white tracking-tighter mb-2">
                    HAMMER<span class="text-sky-300">BOX</span>
                </h1>
                <div class="mode-label text-cyan-200 text-sm tracking-[0.3em]">STARFORGE SANDBOX</div>
            </div>

            <div class="grid gap-3 w-72 z-10 max-h-[60vh] overflow-y-auto hide-scrollbar p-2">
                <div class="hud-label text-xs text-slate-400 uppercase text-center mb-1">Combat Runs</div>
                
                <button onclick="startGame('arena')" class="glass-panel p-4 rounded-xl text-left hover:bg-slate-800 active:scale-95 transition-all group">
                    <div class="text-sky-400 font-bold text-lg group-hover:translate-x-1 transition-transform">NEON ARENA</div>
                    <div class="text-slate-400 text-xs">Hammer drills with roaming targets</div>
                </button>

                <button onclick="startGame('fortress')" class="glass-panel p-4 rounded-xl text-left hover:bg-slate-800 active:scale-95 transition-all group">
                    <div class="text-red-400 font-bold text-lg group-hover:translate-x-1 transition-transform">CYBER FORTRESS</div>
                    <div class="text-slate-400 text-xs">Breach walls and hostile turrets</div>
                </button>

                <div class="hud-label text-xs text-slate-400 uppercase text-center mt-2 mb-1">Simulations</div>

                <button onclick="startGame('survival')" class="glass-panel p-4 rounded-xl text-left hover:bg-slate-800 active:scale-95 transition-all group border-purple-500/30">
                    <div class="text-purple-400 font-bold text-lg group-hover:translate-x-1 transition-transform">SURVIVAL</div>
                    <div class="text-slate-400 text-xs">Hold the arena against endless waves</div>
                </button>

                <button onclick="startGame('playground')" class="glass-panel p-4 rounded-xl text-left hover:bg-slate-800 active:scale-95 transition-all group border-yellow-500/30">
                    <div class="text-yellow-400 font-bold text-lg group-hover:translate-x-1 transition-transform">PLAYGROUND</div>
                    <div class="text-slate-400 text-xs">Open build zone with every gadget</div>
                </button>
            </div>
        </div>

        <!-- HUD (Top) -->
        <div id="hud" class="absolute top-0 left-0 w-full p-2 pt-[var(--safe-top)] flex justify-between items-start pointer-events-none z-20 hidden">
            <!-- Health -->
            <div class="glass-panel px-3 py-2 rounded-full flex gap-2 pointer-events-auto items-center">
                <span id="hp-icon" class="text-lg">❤️</span>
                <div class="w-20 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                    <div id="hp-bar" class="h-full bg-red-500 w-full transition-all duration-200"></div>
                </div>
            </div>

            <div class="flex gap-2">
                <!-- Admin Button -->
                <button onclick="toggleAdminPanel()" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center pointer-events-auto active:scale-90 text-slate-300 hud-label">
                    ⚙️
                </button>
                
                <!-- Mode Toggle -->
                <button id="btn-mode" class="glass-panel px-4 py-2 rounded-full font-bold text-white pointer-events-auto active:scale-95 transition-transform text-xs tracking-wider border-2 border-sky-500/50 mode-label">
                    PLAY
                </button>
            </div>
        </div>

        <!-- ADMIN PANEL -->
        <div id="admin-panel" class="absolute inset-0 z-40 bg-slate-900/95 backdrop-blur-md hidden flex flex-col p-6 pt-20">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">ADMIN <span class="text-sky-400">PANEL</span></h2>
                <button onclick="toggleAdminPanel()" class="text-slate-400 text-2xl">✕</button>
            </div>
            
            <div class="grid gap-4 overflow-y-auto">
                <div class="glass-panel p-4 rounded-xl flex justify-between items-center">
                    <span class="text-white font-bold">GOD MODE</span>
                    <label class="admin-toggle">
                        <input type="checkbox" id="chk-god" onchange="toggleCheat('god')">
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="glass-panel p-4 rounded-xl flex justify-between items-center">
                    <span class="text-white font-bold">SUPER SPEED</span>
                    <label class="admin-toggle">
                        <input type="checkbox" id="chk-speed" onchange="toggleCheat('speed')">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-4">
                    <button onclick="adminAction('killall')" class="bg-red-900/50 text-red-200 p-3 rounded-lg font-bold text-sm border border-red-500/30 active:scale-95">
                        💀 KILL MOBS
                    </button>
                    <button onclick="adminAction('heal')" class="bg-green-900/50 text-green-200 p-3 rounded-lg font-bold text-sm border border-green-500/30 active:scale-95">
                        ❤️ HEAL
                    </button>
                    <button onclick="adminAction('tank')" class="bg-blue-900/50 text-blue-200 p-3 rounded-lg font-bold text-sm border border-blue-500/30 active:scale-95">
                        🚜 SPAWN TANK
                    </button>
                    <button onclick="adminAction('ufo')" class="bg-purple-900/50 text-purple-200 p-3 rounded-lg font-bold text-sm border border-purple-500/30 active:scale-95">
                        🛸 SPAWN UFO
                    </button>
                </div>
            </div>
        </div>

        <!-- PLAY CONTROLS (Bottom) -->
        <div id="play-controls" class="absolute inset-0 pointer-events-none hidden z-10">
            <div class="joystick-zone left-8 bottom-12 opacity-30">
                <div id="joy-left" class="joystick-knob"></div>
            </div>
            <div class="joystick-zone right-8 bottom-12 opacity-30">
                <div id="joy-right" class="joystick-knob bg-red-500/50 shadow-red-500/30"></div>
            </div>
            
            <!-- Action Button (Mount/Dismount) -->
            <button id="btn-action" class="action-button absolute bottom-32 right-8 w-16 h-16 rounded-full shadow-lg pointer-events-auto active:scale-90 transition-all hidden flex items-center justify-center border-4 border-yellow-200 animate-bounce">
                <span class="text-2xl">🚗</span>
            </button>
        </div>

        <!-- EDIT CONTROLS (Bottom) -->
        <div id="edit-controls" class="absolute bottom-0 left-0 w-full glass-panel rounded-t-3xl transform translate-y-full transition-transform duration-300 z-30 pb-[var(--safe-bottom)]">
            <!-- Tabs -->
            <div class="flex overflow-x-auto hide-scrollbar gap-1 border-b border-white/10 px-4 pt-2 mb-2">
                <button class="tab-btn active" onclick="switchTab('structure')">Blocks</button>
                <button class="tab-btn" onclick="switchTab('gizmos')">Gizmos</button>
                <button class="tab-btn" onclick="switchTab('vehicles')">Vehicles</button>
                <button class="tab-btn" onclick="switchTab('mobs')">Mobs</button>
            </div>
            
            <!-- Items -->
            <div class="pb-4">
                <div id="item-scroll" class="flex gap-3 overflow-x-auto hide-scrollbar px-4 pb-2">
                    <!-- Injected by JS -->
                </div>
                <div class="text-center text-[10px] text-slate-500 mt-1 font-mono uppercase">
                    Tap to place • drag to pan the arena
                </div>
            </div>
        </div>

        <!-- GAME OVER -->
        <div id="game-over" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-red-950/90 hidden backdrop-blur-sm">
            <h2 class="text-6xl font-bold text-white mb-2 italic">OPERATOR<br>DOWN</h2>
            <button onclick="location.reload()" class="bg-white text-red-900 font-bold py-3 px-10 rounded-full shadow-lg active:scale-95 text-lg hover:bg-gray-200 mt-8">
                RETURN TO LAB
            </button>
        </div>
    </div>

    <script>
        /* =========================================
           1. CONFIG & DATA
           ========================================= */
        const CONFIG = {
            tileSize: 40,
            colors: {
                bg: '#060816',
                grid: '#14203f',
                player: '#38bdf8',
                playerCore: '#67e8f9',
                hammerHead: '#ffd166',
                hammerHandle: '#5b6b9a',
                hammerGlow: '#a855f7'
            }
        };

        const ITEMS = [
            // Structure
            { id: 'wall', category: 'structure', name: 'Wall', color: '#475569', hp: 10, icon: '🧱' },
            { id: 'crate', category: 'structure', name: 'Crate', color: '#d97706', hp: 3, icon: '📦' },
            { id: 'metal', category: 'structure', name: 'Metal', color: '#94a3b8', hp: 20, icon: '🛡️' },
            { id: 'glass', category: 'structure', name: 'Glass', color: '#a5f3fc', hp: 1, icon: '🪟' },
            { id: 'barricade', category: 'structure', name: 'Barrier', color: '#f59e0b', hp: 50, icon: '🚧' },
            { id: 'barrel', category: 'structure', name: 'Explosive', color: '#ef4444', hp: 1, icon: '🛢️', type: 'physics' },
            { id: 'ball', category: 'structure', name: 'Ball', color: '#e2e8f0', hp: 999, icon: '⚽', type: 'physics' },
            
            // Gizmos
            { id: 'booster', category: 'gizmos', name: 'Booster', color: '#22d3ee', hp: 999, icon: '⏩', type: 'floor' },
            { id: 'bumper', category: 'gizmos', name: 'Bumper', color: '#f472b6', hp: 999, icon: '🛑', type: 'floor' },
            { id: 'spikes', category: 'gizmos', name: 'Spikes', color: '#71717a', hp: 999, icon: '📌', type: 'floor' },
            { id: 'spawner', category: 'gizmos', name: 'Spawner', color: '#10b981', hp: 50, icon: '🧟‍♂️', type: 'active' },
            { id: 'turret', category: 'gizmos', name: 'Turret', color: '#6366f1', hp: 10, icon: '🤖', type: 'active' },
            
            // Vehicles
            { id: 'mech', category: 'vehicles', name: 'Mech', color: '#3b82f6', hp: 200, speed: 100, icon: '🦾', weapon: 'melee' },
            { id: 'bike', category: 'vehicles', name: 'Bike', color: '#d946ef', hp: 80, speed: 350, icon: '🏍️', weapon: 'melee' },
            { id: 'tank', category: 'vehicles', name: 'Tank', color: '#166534', hp: 400, speed: 60, icon: '🚜', weapon: 'cannon' },
            { id: 'ufo', category: 'vehicles', name: 'UFO', color: '#8b5cf6', hp: 100, speed: 150, icon: '🛸', weapon: 'laser', fly: true },
            
            // Mobs
            { id: 'zombie', category: 'mobs', name: 'Walker', color: '#22c55e', hp: 30, speed: 60, icon: '🧟' },
            { id: 'fast', category: 'mobs', name: 'Runner', color: '#facc15', hp: 15, speed: 130, icon: '⚡' },
            { id: 'brute', category: 'mobs', name: 'Brute', color: '#991b1b', hp: 150, speed: 40, icon: '🦍' },
        ];

        /* =========================================
           2. INPUT & ADMIN
           ========================================= */
        class Joystick {
            constructor() {
                this.active = false;
                this.id = null;
                this.origin = { x: 0, y: 0 };
                this.curr = { x: 0, y: 0 };
                this.vec = { x: 0, y: 0 };
                this.angle = 0;
            }
            start(id, x, y) {
                this.active = true;
                this.id = id;
                this.origin = { x, y };
                this.curr = { x, y };
                this.update();
            }
            move(x, y) {
                if (!this.active) return;
                this.curr = { x, y };
                this.update();
            }
            end() {
                this.active = false;
                this.id = null;
                this.vec = { x: 0, y: 0 };
            }
            update() {
                const max = 40;
                let dx = this.curr.x - this.origin.x;
                let dy = this.curr.y - this.origin.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                this.angle = Math.atan2(dy, dx);
                const clamp = Math.min(dist, max);
                this.vec.x = (Math.cos(this.angle) * clamp) / max;
                this.vec.y = (Math.sin(this.angle) * clamp) / max;
            }
        }

        const ADMIN = {
            god: false,
            speed: false
        };

        /* =========================================
           3. GAME ENGINE STATE
           ========================================= */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let lastTime = 0;
        let mode = 'PLAY'; 
        let currentCategory = 'structure';
        let selectedItem = ITEMS[0];
        let gameMode = 'arena'; // arena, fortress, survival, playground
        let waveTimer = 0;
        let waveCount = 0;

        const joyL = new Joystick();
        const joyR = new Joystick();
        
        const camera = { x: 0, y: 0, shake: 0 };
        let map = {}; 
        let entities = [];
        let particles = [];
        let projectiles = [];
        
        const player = {
            x: 0, y: 0,
            radius: 14,
            baseSpeed: 180,
            hp: 100,
            maxHp: 100,
            dead: false,
            vehicle: null,
            hammerAngle: 0,
            hammerDist: 0,
            hammerTargetDist: 0,
            lastHitEntities: [],
            lastHitBlocks: [],
            fireTimer: 0
        };

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let camStart = { x: 0, y: 0 };

        /* =========================================
           3.5 MEDIA MAPPER INTEGRATION
           ========================================= */
        const MEDIA = {
            gifs: {
                impact: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp',
                defeat: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
            },
            audio: {
                uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
                menuOpen: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3',
                menuClose: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3',
                startGame: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',
                explosion: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3',
                hurt: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3',
                heal: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
                mount: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
                blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
                defeat: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'
            }
        };

        const audioState = {
            enabled: false,
            unlocked: false,
            startedBgm: false,
            master: 0.55,
            elements: {},
            pools: {},
            lastPlayed: {},
            pendingUnlockAttached: false
        };

        function ensureAudio() {
            if (audioState.enabled) return;
            audioState.enabled = true;
            audioState.elements.bgm = createAudio(MEDIA.audio.bgm, { loop: true, volume: 0.22 });
            audioState.elements.bgm.preload = 'auto';
            audioState.pools = {
                uiClick: createPool(MEDIA.audio.uiClick, 2, 0.45),
                menuOpen: createPool(MEDIA.audio.menuOpen, 1, 0.42),
                menuClose: createPool(MEDIA.audio.menuClose, 1, 0.42),
                startGame: createPool(MEDIA.audio.startGame, 1, 0.52),
                hit: createPool(MEDIA.audio.hit, 3, 0.38),
                explosion: createPool(MEDIA.audio.explosion, 2, 0.42),
                hurt: createPool(MEDIA.audio.hurt, 2, 0.4),
                heal: createPool(MEDIA.audio.heal, 1, 0.42),
                mount: createPool(MEDIA.audio.mount, 1, 0.46),
                blocked: createPool(MEDIA.audio.blocked, 1, 0.34),
                defeat: createPool(MEDIA.audio.defeat, 1, 0.5)
            };
        }

        function createAudio(src, { loop = false, volume = 0.5 } = {}) {
            const audio = new Audio(src);
            audio.preload = 'none';
            audio.loop = loop;
            audio.volume = Math.max(0, Math.min(1, volume * audioState.master));
            audio.playsInline = true;
            return audio;
        }

        function createPool(src, size, volume) {
            return Array.from({ length: size }, () => createAudio(src, { volume }));
        }

        function unlockAudio() {
            ensureAudio();
            audioState.unlocked = true;
            if (!audioState.startedBgm && !document.hidden) {
                audioState.startedBgm = true;
                safePlay(audioState.elements.bgm, true);
            }
        }

        function queueAudioUnlock() {
            if (audioState.pendingUnlockAttached) return;
            audioState.pendingUnlockAttached = true;
            const unlock = () => {
                unlockAudio();
                window.removeEventListener('pointerdown', unlock);
                window.removeEventListener('keydown', unlock);
                audioState.pendingUnlockAttached = false;
            };
            window.addEventListener('pointerdown', unlock, { once: true });
            window.addEventListener('keydown', unlock, { once: true });
        }

        function safePlay(audio, reset = false) {
            if (!audioState.unlocked || !audio) return;
            try {
                if (reset) audio.currentTime = 0;
                const playPromise = audio.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            } catch (_) {}
        }

        function playSfx(name, cooldown = 0) {
            ensureAudio();
            if (cooldown > 0) {
                const now = performance.now();
                if (audioState.lastPlayed[name] && now - audioState.lastPlayed[name] < cooldown) return;
                audioState.lastPlayed[name] = now;
            }
            const pool = audioState.pools[name];
            if (!pool || !audioState.unlocked) return;
            const channel = pool.find(audio => audio.paused || audio.ended) || pool[0];
            safePlay(channel, true);
        }

        function syncBgm() {
            if (!audioState.enabled || !audioState.elements.bgm || !audioState.unlocked) return;
            if (document.hidden || player.dead) {
                audioState.elements.bgm.pause();
                return;
            }
            if (document.getElementById('main-menu').classList.contains('hidden')) {
                safePlay(audioState.elements.bgm);
            } else {
                audioState.elements.bgm.pause();
            }
        }

        function bindUiAudio() {
            document.querySelectorAll('button').forEach((btn) => {
                btn.addEventListener('pointerdown', () => {
                    unlockAudio();
                    playSfx('uiClick', 80);
                }, { passive: true });
            });
            document.addEventListener('visibilitychange', syncBgm);
        }

        function flashGif(id, duration = 700) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('hidden');
            el.classList.add('show');
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => el.classList.add('hidden'), 180);
            }, duration);
        }

        /* =========================================
           4. INITIALIZATION
           ========================================= */
        function init() {
            resize();
            window.addEventListener('resize', resize);
            
            renderEditorItems('structure');
            
            document.getElementById('btn-mode').onclick = toggleMode;
            document.getElementById('btn-action').onclick = toggleVehicleMount;
            bindUiAudio();
            queueAudioUnlock();

            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
            
            requestAnimationFrame(loop);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function renderEditorItems(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.toLowerCase().includes(cat) || (cat==='structure' && b.innerText==='Blocks'));
            });
            const list = document.getElementById('item-scroll');
            list.innerHTML = '';
            
            ITEMS.filter(i => i.category === cat).forEach(item => {
                const btn = document.createElement('div');
                btn.className = `item-btn ${selectedItem.id === item.id ? 'selected' : ''}`;
                btn.innerHTML = `<span class="text-2xl">${item.icon}</span><span class="text-[9px] text-slate-400 mt-1 truncate w-full text-center px-1">${item.name}</span>`;
                btn.onclick = () => {
                    selectedItem = item;
                    renderEditorItems(currentCategory);
                };
                list.appendChild(btn);
            });
        }
        window.switchTab = renderEditorItems;
        window.startGame = loadMap;
        window.toggleAdminPanel = () => {
            const el = document.getElementById('admin-panel');
            const opening = el.classList.contains('hidden');
            el.classList.toggle('hidden');
            playSfx(opening ? 'menuOpen' : 'menuClose', 120);
        };
        window.toggleCheat = (key) => {
            ADMIN[key] = !ADMIN[key];
        };
        window.adminAction = (act) => {
            if(act === 'killall') {
                entities = entities.filter(e => e.category === 'vehicles' || e === player.vehicle);
                spawnText(player.x, player.y, "WIPED", "#f00");
            } else if(act === 'heal') {
                healPlayer(9999);
            } else if(act === 'tank') {
                spawnEntity('tank', player.x + 100, player.y);
            } else if(act === 'ufo') {
                spawnEntity('ufo', player.x + 100, player.y);
            }
            window.toggleAdminPanel();
        };

        function loadMap(type) {
            gameMode = type;
            player.hp = player.maxHp;
            player.dead = false;
            player.x = 0; player.y = 0;
            player.vehicle = null;
            entities = [];
            map = {};
            particles = [];
            projectiles = [];
            waveCount = 0;
            waveTimer = 0;
            
            if (type === 'arena') generateArena();
            else if (type === 'fortress') generateFortress();
            else if (type === 'playground') generatePlayground();
            else if (type === 'survival') generateArena(); // Base arena for survival

            unlockAudio();
            playSfx('startGame', 120);
            document.getElementById('main-menu').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                setMode('PLAY');
                updateHpBar();
                syncBgm();
            }, 500);
        }

        function toggleMode() {
            setMode(mode === 'PLAY' ? 'EDIT' : 'PLAY');
        }

        function setMode(m) {
            mode = m;
            const btn = document.getElementById('btn-mode');
            const editUI = document.getElementById('edit-controls');
            const playUI = document.getElementById('play-controls');

            if (mode === 'PLAY') {
                btn.innerText = "PLAY";
                btn.classList.add('border-sky-500/50', 'text-white');
                btn.classList.remove('border-yellow-500/50', 'text-yellow-400');
                editUI.classList.add('translate-y-full');
                playUI.classList.remove('hidden');
            } else {
                btn.innerText = "EDIT";
                btn.classList.remove('border-sky-500/50', 'text-white');
                btn.classList.add('border-yellow-500/50', 'text-yellow-400');
                editUI.classList.remove('translate-y-full');
                playUI.classList.add('hidden');
                joyL.end(); joyR.end();
            }
        }

        /* =========================================
           5. GENERATION
           ========================================= */
        function setBlock(gx, gy, id) {
            const def = ITEMS.find(i => i.id === id);
            if (!def) return;
            map[`${gx},${gy}`] = { 
                id: def.id, hp: def.hp, maxHp: def.hp, color: def.color, type: def.type 
            };
        }

        function spawnEntity(id, x, y) {
            const def = ITEMS.find(i => i.id === id);
            const ent = {
                id: def.id,
                type: def.category === 'vehicles' ? 'vehicle' : def.type === 'physics' ? 'physics' : 'mob',
                category: def.category,
                x, y, vx: 0, vy: 0,
                hp: def.hp, maxHp: def.hp,
                speed: def.speed || 0,
                radius: def.category === 'vehicles' ? 24 : 15,
                color: def.color,
                flash: 0,
                def: def
            };
            if(def.type === 'active') ent.timer = 0;
            entities.push(ent);
        }

        function generateArena() {
            // Walls
            for (let x = -12; x <= 12; x++) { setBlock(x, -16, 'wall'); setBlock(x, 16, 'wall'); }
            for (let y = -16; y <= 16; y++) { setBlock(-12, y, 'wall'); setBlock(12, y, 'wall'); }
            
            // Random obstacles
            for(let i=0; i<30; i++) {
                let rx = Math.floor((Math.random()-0.5)*20);
                let ry = Math.floor((Math.random()-0.5)*28);
                if(Math.abs(rx)<3 && Math.abs(ry)<3) continue;
                setBlock(rx, ry, Math.random()>0.7 ? 'metal' : 'crate');
            }
            spawnEntity('mech', 100, -100);
            if(gameMode !== 'survival') {
                spawnEntity('zombie', 200, 200);
                spawnEntity('brute', -200, -200);
            }
        }

        function generateFortress() {
            for (let x = -15; x <= 15; x++) { setBlock(x, -20, 'barricade'); setBlock(x, 20, 'barricade'); }
            for (let y = -20; y <= 20; y++) { setBlock(-15, y, 'barricade'); setBlock(15, y, 'barricade'); }
            spawnEntity('tank', 0, 300);
            spawnEntity('turret', -200, -200);
            spawnEntity('turret', 200, 200);
        }

        function generatePlayground() {
            // Flat land with gizmos
            for (let x = -20; x <= 20; x+=2) { setBlock(x, -20, 'wall'); setBlock(x, 20, 'wall'); }
            
            // Gizmo testing area
            setBlock(5, 5, 'booster');
            setBlock(5, 6, 'booster');
            setBlock(5, 7, 'booster');
            
            setBlock(-5, 5, 'bumper');
            
            spawnEntity('ball', -100, 0);
            spawnEntity('barrel', -150, 0);
            
            spawnEntity('tank', 100, 100);
            spawnEntity('ufo', -100, 100);
            spawnEntity('bike', 0, -100);
        }

        /* =========================================
           6. GAME LOOP
           ========================================= */
        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        function update(dt) {
            if (player.dead) return;

            if (mode === 'PLAY') {
                updatePlay(dt);
                if(gameMode === 'survival') updateSurvival(dt);
            }

            // Camera
            let targetX = player.x;
            let targetY = player.y;
            if (camera.shake > 0) {
                targetX += (Math.random()-0.5) * camera.shake;
                targetY += (Math.random()-0.5) * camera.shake;
                camera.shake = Math.max(0, camera.shake - dt * 30);
            }
            camera.x += (targetX - camera.x) * 5 * dt;
            camera.y += (targetY - camera.y) * 5 * dt;

            updateParticles(dt);
            updateProjectiles(dt);
        }

        function updateSurvival(dt) {
            waveTimer += dt;
            if(waveTimer > 5) {
                waveTimer = 0;
                waveCount++;
                spawnText(player.x, player.y - 50, `WAVE ${waveCount}`, "#f0f");
                const count = Math.min(waveCount + 2, 10);
                for(let i=0; i<count; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const dist = 400 + Math.random()*200;
                    spawnEntity(waveCount % 3 === 0 ? 'brute' : 'zombie', player.x + Math.cos(ang)*dist, player.y + Math.sin(ang)*dist);
                }
            }
        }

        function updatePlay(dt) {
            let speed = player.vehicle ? player.vehicle.speed : player.baseSpeed;
            if(ADMIN.speed) speed *= 2;
            
            // 1. Movement
            if (joyL.active) {
                player.x += joyL.vec.x * speed * dt;
                player.y += joyL.vec.y * speed * dt;
                
                const colRadius = player.vehicle ? player.vehicle.radius : player.radius;
                const fly = player.vehicle && player.vehicle.def.fly;
                resolveMapCollisions(player, colRadius, fly);
                
                if (player.vehicle) {
                    player.vehicle.x = player.x;
                    player.vehicle.y = player.y;
                    player.vehicle.angle = Math.atan2(joyL.vec.y, joyL.vec.x);
                }
            }

            // 2. Action / Attack
            const weapon = player.vehicle ? player.vehicle.def.weapon : 'melee';
            
            if (weapon === 'melee') {
                // Hammer Logic
                if (joyR.active) {
                    let diff = joyR.angle - player.hammerAngle;
                    while (diff < -Math.PI) diff += Math.PI*2;
                    while (diff > Math.PI) diff -= Math.PI*2;
                    player.hammerAngle += diff * 15 * dt;
                    player.hammerTargetDist = player.vehicle ? 60 : 45;
                } else {
                    player.hammerTargetDist = 0;
                }
                player.hammerDist += (player.hammerTargetDist - player.hammerDist) * 15 * dt;
                updateHammerCombat();
            } else {
                // Ranged Logic (Tank/UFO)
                player.hammerDist = 0;
                if (joyR.active) {
                    // Rotate turret/ufo towards aim
                    if(player.vehicle) {
                        // For tank, maybe turret rotation? Simplification: Just shoot in joy direction
                    }
                    if(player.fireTimer <= 0) {
                        fireProjectile(weapon, joyR.vec.x, joyR.vec.y);
                        player.fireTimer = weapon === 'cannon' ? 1.0 : 0.15;
                    }
                }
            }
            if(player.fireTimer > 0) player.fireTimer -= dt;

            updateEntities(dt);
            checkFloorGizmos();
            checkVehicleProximity();
        }

        function fireProjectile(type, dx, dy) {
            const mag = Math.sqrt(dx*dx + dy*dy);
            if(mag < 0.1) return;
            
            const speed = type === 'cannon' ? 400 : 600;
            const dmg = type === 'cannon' ? 50 : 10;
            const color = type === 'cannon' ? '#fbbf24' : '#a78bfa';
            
            playSfx('hit', 90);
            projectiles.push({
                x: player.x, y: player.y,
                vx: (dx/mag) * speed, vy: (dy/mag) * speed,
                type, dmg, color,
                life: 2.0
            });
            
            // Recoil
            if(type === 'cannon') {
                flashGif('impact-gif', 620);
                camera.shake = 5;
                player.x -= (dx/mag) * 10;
                player.y -= (dy/mag) * 10;
            }
        }

        function updateProjectiles(dt) {
            for(let i=projectiles.length-1; i>=0; i--) {
                const p = projectiles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                
                let hit = false;
                
                // Block collision
                const gx = Math.round(p.x / CONFIG.tileSize);
                const gy = Math.round(p.y / CONFIG.tileSize);
                const k = `${gx},${gy}`;
                if(map[k] && map[k].type !== 'floor') {
                    damageBlock(k, p.x, p.y, p.dmg);
                    hit = true;
                }
                
                // Entity collision
                if(!hit) {
                    for(let e of entities) {
                        if(e === player.vehicle || e.type === 'pickup') continue;
                        if(Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 5) {
                            damageEntity(e, p.x, p.y, p.dmg);
                            hit = true;
                            break;
                        }
                    }
                }
                
                if(hit || p.life <= 0) {
                    spawnParticles(p.x, p.y, p.color, 5);
                    if(p.type === 'cannon') explodeArea(p.x, p.y, 60, 40);
                    projectiles.splice(i, 1);
                }
            }
        }

        function updateHammerCombat() {
            if (player.hammerDist < 20) {
                player.lastHitBlocks = [];
                player.lastHitEntities = [];
                return;
            }

            const hx = player.x + Math.cos(player.hammerAngle) * player.hammerDist;
            const hy = player.y + Math.sin(player.hammerAngle) * player.hammerDist;
            const hRadius = player.vehicle ? 20 : 14; 
            const damage = player.vehicle ? (player.vehicle.id==='mech'?3:1) : 1;

            // Blocks
            const gx = Math.round(hx / CONFIG.tileSize);
            const gy = Math.round(hy / CONFIG.tileSize);
            const currentTouchingBlocks = [];

            for(let dx=-1; dx<=1; dx++){
                for(let dy=-1; dy<=1; dy++){
                    const k = `${gx+dx},${gy+dy}`;
                    if(map[k] && map[k].type !== 'floor') {
                        const bx = (gx+dx) * CONFIG.tileSize;
                        const by = (gy+dy) * CONFIG.tileSize;
                        const half = CONFIG.tileSize/2 + hRadius;
                        if (Math.abs(hx - bx) < half && Math.abs(hy - by) < half) {
                            currentTouchingBlocks.push(k);
                        }
                    }
                }
            }

            currentTouchingBlocks.forEach(key => {
                if (!player.lastHitBlocks.includes(key)) {
                    damageBlock(key, hx, hy, damage);
                    flashGif('impact-gif', 520);
                }
            });
            player.lastHitBlocks = currentTouchingBlocks;

            // Entities
            const currentTouchingEnts = [];
            entities.forEach(e => {
                if (e === player.vehicle || e.type === 'pickup') return;
                const dist = Math.hypot(e.x - hx, e.y - hy);
                if (dist < e.radius + hRadius) {
                    currentTouchingEnts.push(e);
                }
            });

            currentTouchingEnts.forEach(e => {
                if (!player.lastHitEntities.includes(e)) {
                    damageEntity(e, hx, hy, player.vehicle ? 50 : 25);
                    flashGif('impact-gif', 520);
                }
            });
            player.lastHitEntities = currentTouchingEnts;
        }

        function damageBlock(key, hx, hy, dmg=1) {
            const b = map[key];
            if (!b) return;
            
            spawnParticles(hx, hy, b.color, 3);
            playSfx('hit', 90);
            b.hp -= dmg;
            b.flash = 5;

            if (b.id === 'barrel') {
                explodeArea(hx, hy, 120, 100);
                delete map[key];
            } else if (b.hp <= 0) {
                delete map[key];
                spawnParticles(hx, hy, b.color, 10);
            }
        }

        function damageEntity(e, hx, hy, dmg) {
            spawnParticles(e.x, e.y, '#ff0000', 5);
            playSfx('hit', 90);
            const ang = Math.atan2(e.y - hy, e.x - hx);
            e.vx += Math.cos(ang) * 200;
            e.vy += Math.sin(ang) * 200;
            
            e.hp -= dmg;
            e.flash = 5;
            if (e.hp <= 0) killEntity(e);
        }

        function explodeArea(x, y, radius, dmg) {
            camera.shake = 10;
            playSfx('explosion', 140);
            flashGif('impact-gif', 760);
            spawnParticles(x, y, '#ef4444', 20);
            
            // Hurt Player
            if(Math.hypot(player.x - x, player.y - y) < radius) hurtPlayer(dmg/2);

            // Hurt Entities
            entities.forEach(e => {
                if(Math.hypot(e.x - x, e.y - y) < radius) {
                    e.hp -= dmg;
                    if(e.hp<=0) killEntity(e);
                }
            });

            // Destroy Blocks
            const gr = Math.ceil(radius / CONFIG.tileSize);
            const gx = Math.round(x/CONFIG.tileSize);
            const gy = Math.round(y/CONFIG.tileSize);
            for(let dx=-gr; dx<=gr; dx++){
                for(let dy=-gr; dy<=gr; dy++){
                    const k = `${gx+dx},${gy+dy}`;
                    if(map[k] && map[k].type !== 'floor') {
                        damageBlock(k, (gx+dx)*CONFIG.tileSize, (gy+dy)*CONFIG.tileSize, 10);
                    }
                }
            }
        }

        function updateEntities(dt) {
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                if (e === player.vehicle) continue;

                if(e.flash > 0) e.flash--;
                e.vx *= 0.92; e.vy *= 0.92;
                e.x += e.vx * dt; e.y += e.vy * dt;

                // Physics items (Ball)
                if(e.type === 'physics') {
                    resolveMapCollisions(e, e.radius, false);
                    continue;
                }

                if (e.category === 'mobs') {
                    const dx = player.x - e.x;
                    const dy = player.y - e.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist > 0 && dist < 500) {
                        e.x += (dx/dist) * e.speed * dt;
                        e.y += (dy/dist) * e.speed * dt;
                    }
                    
                    if (dist < (player.vehicle ? player.vehicle.radius : player.radius) + e.radius) {
                        hurtPlayer(e.id==='brute'?20:10);
                        e.vx -= (dx/dist) * 200;
                        e.vy -= (dy/dist) * 200;
                    }
                    resolveMapCollisions(e, e.radius, false);
                }
                
                // Turret Gizmo / Enemy
                if (e.id === 'turret') {
                    e.timer = (e.timer || 0) + dt;
                    if (e.timer > 2.0 && Math.hypot(player.x - e.x, player.y - e.y) < 300) {
                        e.timer = 0;
                        const ang = Math.atan2(player.y - e.y, player.x - e.x);
                        projectiles.push({
                            x: e.x, y: e.y,
                            vx: Math.cos(ang)*300, vy: Math.sin(ang)*300,
                            type: 'bullet', dmg: 10, color: '#f00', life: 2
                        });
                        playSfx('hit', 120);
                    }
                }
                
                // Spawner Gizmo
                if (e.id === 'spawner') {
                    e.timer = (e.timer || 0) + dt;
                    if (e.timer > 5.0) {
                        e.timer = 0;
                        spawnEntity('zombie', e.x + (Math.random()-0.5)*40, e.y + (Math.random()-0.5)*40);
                        spawnParticles(e.x, e.y, '#10b981', 10);
                    }
                }
            }
        }

        function checkVehicleProximity() {
            const btn = document.getElementById('btn-action');
            if (player.vehicle) {
                btn.classList.remove('hidden');
                btn.innerHTML = '❌'; 
                return;
            }

            let near = false;
            entities.forEach(e => {
                if (e.category === 'vehicles' && Math.hypot(player.x - e.x, player.y - e.y) < 60) {
                    near = true;
                }
            });

            if (near) {
                btn.classList.remove('hidden');
                btn.innerHTML = '🚗';
            } else {
                btn.classList.add('hidden');
            }
        }

        function toggleVehicleMount() {
            if (player.vehicle) {
                player.vehicle.vx = 0; 
                player.vehicle.vy = 0;
                player.x += 40;
                player.vehicle = null;
                updateHpBar();
                spawnText(player.x, player.y, "EJECT", "#fff");
                playSfx('menuClose', 100);
            } else {
                let closest = null;
                let minDist = 70;
                entities.forEach(e => {
                    if (e.category === 'vehicles') {
                        const d = Math.hypot(player.x - e.x, player.y - e.y);
                        if (d < minDist) { minDist = d; closest = e; }
                    }
                });
                if (closest) {
                    player.vehicle = closest;
                    player.x = closest.x;
                    player.y = closest.y;
                    updateHpBar();
                    spawnText(player.x, player.y, "MOUNTED", "#0ff");
                    playSfx('mount', 100);
                } else {
                    playSfx('blocked', 120);
                }
            }
        }

        function checkFloorGizmos() {
            const target = player.vehicle || player;
            if (player.vehicle && player.vehicle.def.fly) return; // UFO ignores floor

            const gx = Math.round(target.x / CONFIG.tileSize);
            const gy = Math.round(target.y / CONFIG.tileSize);
            const k = `${gx},${gy}`;
            const b = map[k];
            
            if (b) {
                if (b.id === 'spikes') hurtPlayer(0.5);
                if (b.id === 'booster') {
                    // Boost in facing direction
                    const ang = joyL.active ? joyL.angle : 0;
                    target.x += Math.cos(ang) * 10;
                    target.y += Math.sin(ang) * 10;
                    spawnParticles(target.x, target.y, '#0ff', 1);
                }
                if (b.id === 'bumper') {
                    // Bounce back
                    target.x -= Math.cos(joyL.angle) * 30;
                    target.y -= Math.sin(joyL.angle) * 30;
                    spawnText(target.x, target.y, "BOING!", "#f472b6");
                }
            }
        }

        function resolveMapCollisions(ent, radius, fly) {
            const gx = Math.round(ent.x / CONFIG.tileSize);
            const gy = Math.round(ent.y / CONFIG.tileSize);
            
            for (let y = gy - 1; y <= gy + 1; y++) {
                for (let x = gx - 1; x <= gx + 1; x++) {
                    const k = `${x},${y}`;
                    const b = map[k];
                    // Fly units ignore floor hazards/gizmos but hit walls
                    if (b && (b.type !== 'floor' || !fly && b.type === 'floor' && b.id !== 'booster' && b.id !== 'bumper')) {
                        // Actually, floor items shouldn't block movement usually, except spikes maybe?
                        // Let's say only 'structure' and 'active' block movement.
                        if(b.category === 'gizmos' && b.type === 'floor') continue;

                        const tx = x * CONFIG.tileSize;
                        const ty = y * CONFIG.tileSize;
                        const half = CONFIG.tileSize/2 + radius;
                        const dx = ent.x - tx;
                        const dy = ent.y - ty;
                        
                        if (Math.abs(dx) < half && Math.abs(dy) < half) {
                            const ox = half - Math.abs(dx);
                            const oy = half - Math.abs(dy);
                            if (ox < oy) {
                                ent.x += dx > 0 ? ox : -ox;
                                ent.vx *= -0.5;
                            } else {
                                ent.y += dy > 0 ? oy : -oy;
                                ent.vy *= -0.5;
                            }
                        }
                    }
                }
            }
        }

        function hurtPlayer(amt) {
            if(ADMIN.god) return;
            const target = player.vehicle || player;
            target.hp -= amt;
            target.flash = 5;
            
            playSfx('hurt', 120);
            updateHpBar();
            document.body.style.backgroundColor = '#450a0a';
            setTimeout(() => document.body.style.backgroundColor = CONFIG.colors.bg, 50);
            
            if (target.hp <= 0) {
                if (player.vehicle) {
                    spawnParticles(player.x, player.y, player.vehicle.color, 20);
                    killEntity(player.vehicle);
                    player.vehicle = null;
                    hurtPlayer(20); 
                    spawnText(player.x, player.y, "VEHICLE DESTROYED", "#f00");
                } else if (!player.dead) {
                    player.dead = true;
                    playSfx('defeat', 200);
                    flashGif('defeat-gif', 2200);
                    document.getElementById('game-over').classList.remove('hidden');
                    document.getElementById('play-controls').classList.add('hidden');
                    document.getElementById('hud').classList.add('hidden');
                    syncBgm();
                }
            }
        }

        function healPlayer(amt) {
            const target = player.vehicle || player;
            target.hp = Math.min(target.hp + amt, target.maxHp);
            playSfx('heal', 120);
            updateHpBar();
            spawnText(player.x, player.y - 20, "+HP", "#22c55e");
        }
        
        function killEntity(e) {
            const idx = entities.indexOf(e);
            if(idx > -1) entities.splice(idx, 1);
            playSfx('explosion', 160);
            flashGif('impact-gif', 680);
            spawnParticles(e.x, e.y, e.color, 15);
        }

        function updateHpBar() {
            const target = player.vehicle || player;
            const pct = Math.max(0, (target.hp / target.maxHp) * 100);
            const bar = document.getElementById('hp-bar');
            bar.style.width = pct + '%';
            bar.className = `h-full w-full transition-all duration-200 ${player.vehicle ? 'bg-yellow-400' : 'bg-red-500'}`;
            document.getElementById('hp-icon').innerText = player.vehicle ? '🛡️' : '❤️';
        }

        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random()-0.5)*300,
                    vy: (Math.random()-0.5)*300,
                    life: 1.0,
                    color,
                    size: Math.random()*3+2
                });
            }
        }
        
        function spawnText(x, y, txt, color='#fff') {
            particles.push({ x, y, vx:0, vy:-50, life:1.0, color, size:0, text:txt });
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        /* =========================================
           7. RENDERING
           ========================================= */
        function draw() {
            ctx.fillStyle = CONFIG.colors.bg;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width/2 - camera.x, height/2 - camera.y);

            drawGrid();

            // Map
            for (const [key, b] of Object.entries(map)) {
                const [gx, gy] = key.split(',').map(Number);
                const x = gx * CONFIG.tileSize;
                const y = gy * CONFIG.tileSize;
                const s = CONFIG.tileSize;

                ctx.fillStyle = b.flash > 0 ? '#ffffff' : b.color;
                if(b.flash > 0) b.flash--;

                if (b.type === 'floor') {
                    ctx.save(); ctx.translate(x, y);
                    if(b.id === 'spikes') {
                        ctx.fillStyle = '#333'; ctx.fillRect(-s/2, -s/2, s, s);
                        ctx.fillStyle = '#999'; ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(0, 10); ctx.lineTo(10, -10); ctx.fill();
                    } else if (b.id === 'booster') {
                        ctx.fillStyle = '#1e293b'; ctx.fillRect(-s/2, -s/2, s, s);
                        ctx.fillStyle = '#22d3ee'; ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(0, -10); ctx.lineTo(10, 10); ctx.fill();
                    } else if (b.id === 'bumper') {
                        ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
                        ctx.strokeStyle='#fff'; ctx.stroke();
                    }
                    ctx.restore();
                } else if (b.id === 'barrel') {
                    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fca5a5'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='12px sans-serif'; ctx.fillText('TNT', x, y);
                } else {
                    ctx.fillRect(x - s/2 + 1, y - s/2 + 1, s - 2, s - 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(x - s/2 + 1, y - s/2 + 1, s - 2, 6);
                }
            }

            // Entities
            entities.forEach(e => {
                if (e === player.vehicle) return; 
                drawEntity(e);
            });

            // Projectiles
            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
            });

            // Player
            if (!player.dead) {
                ctx.save();
                ctx.translate(player.x, player.y);
                
                if (player.vehicle) {
                    const v = player.vehicle;
                    ctx.save();
                    if (v.angle) ctx.rotate(v.angle);
                    ctx.fillStyle = v.flash > 0 ? '#fff' : v.color;
                    
                    if (v.id === 'bike') {
                        ctx.fillRect(-20, -10, 40, 20);
                        ctx.fillStyle = '#0ef'; ctx.fillRect(15, -10, 5, 20);
                    } else if (v.id === 'ufo') {
                        ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = 'rgba(0,255,255,0.3)'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
                    } else if (v.id === 'tank') {
                        ctx.fillRect(-22, -18, 44, 36);
                        ctx.fillStyle = '#064e3b'; ctx.fillRect(0, -10, 25, 20); // turret
                    } else {
                        ctx.fillRect(-20, -20, 40, 40); // mech
                    }
                    ctx.restore();
                } else {
                    ctx.shadowColor = 'rgba(103,232,249,0.85)';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = '#0c1838';
                    ctx.beginPath(); ctx.arc(0, 0, player.radius + 6, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = CONFIG.colors.player;
                    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = CONFIG.colors.playerCore;
                    ctx.beginPath(); ctx.arc(-2, -3, player.radius * 0.45, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#07111f';
                    ctx.beginPath(); ctx.arc(4, -4, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(4, 4, 3, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(-2, 0, player.radius * 0.55, 0.35, 1.15);
                    ctx.stroke();
                }

                // Hammer (Only if melee)
                if (!player.vehicle || player.vehicle.def.weapon === 'melee') {
                    ctx.save();
                    ctx.rotate(player.hammerAngle);
                    ctx.fillStyle = CONFIG.colors.hammerHandle;
                    ctx.fillRect(0, -4, player.hammerDist, 8);
                    ctx.translate(player.hammerDist, 0);
                    ctx.fillStyle = player.vehicle ? '#facc15' : CONFIG.colors.hammerHead;
                    ctx.shadowColor = player.vehicle ? '#facc15' : CONFIG.colors.hammerGlow;
                    ctx.shadowBlur = 14;
                    const hSize = player.vehicle ? 1.5 : 1;
                    ctx.scale(hSize, hSize);
                    ctx.fillRect(-5, -12, 16, 24);
                    ctx.restore();
                }

                ctx.restore();
            }

            // Particles
            particles.forEach(p => {
                if (p.text) {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.font = '700 16px "Orbitron", sans-serif';
                    ctx.fillText(p.text, p.x, p.y);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
            });
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        function drawEntity(e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.fillStyle = e.flash > 0 ? '#fff' : e.color;
            
            if (e.category === 'mobs') {
                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(0, 0, e.radius + 3, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = e.flash > 0 ? '#fff' : e.color;
                ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(8, 16, 33, 0.9)';
                ctx.beginPath(); ctx.arc(-3, -3, Math.max(5, e.radius * 0.45), 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath(); ctx.arc(4, -4, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, 4, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'red'; ctx.fillRect(-10, -20, 20, 4);
                ctx.fillStyle = '#0f0'; ctx.fillRect(-10, -20, 20 * (e.hp/e.maxHp), 4);
            } else if (e.category === 'vehicles') {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI*2); ctx.stroke();
                ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
                ctx.fillText(e.icon, 0, 0);
            } else if (e.id === 'turret') {
                ctx.fillRect(-12, -12, 24, 24);
                ctx.fillStyle = '#333'; ctx.fillRect(5, -4, 15, 8);
            } else if (e.id === 'spawner') {
                ctx.fillRect(-15, -15, 30, 30);
                ctx.fillStyle = '#065f46'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
                if(e.type === 'physics') {
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
                }
            }
            ctx.restore();
        }

        function drawGrid() {
            const step = CONFIG.tileSize;
            const startX = Math.floor((camera.x - width/2) / step) * step;
            const startY = Math.floor((camera.y - height/2) / step) * step;
            const endX = startX + width + step;
            const endY = startY + height + step;

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            for (let x = startX; x < endX; x += step) {
                ctx.moveTo(x, startY); ctx.lineTo(x, endY);
            }
            for (let y = startY; y < endY; y += step) {
                ctx.moveTo(startX, y); ctx.lineTo(endX, y);
            }
            ctx.stroke();
        }

        /* =========================================
           8. TOUCH EVENTS
           ========================================= */
        function onTouchStart(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const tx = t.clientX;
                const ty = t.clientY;

                if (mode === 'PLAY') {
                    if (tx < width / 2) {
                        if (!joyL.active) {
                            joyL.start(t.identifier, tx, ty);
                            updateJoyVisual('joy-left', {x:tx, y:ty}, true);
                        }
                    } else {
                        if (!joyR.active) {
                            joyR.start(t.identifier, tx, ty);
                            updateJoyVisual('joy-right', {x:tx, y:ty}, true);
                        }
                    }
                } else {
                    if (ty > height - 160) continue;
                    isDragging = true;
                    dragStart = { x: tx, y: ty };
                    camStart = { x: camera.x, y: camera.y };
                }
            }
        }

        function onTouchMove(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (mode === 'PLAY') {
                    if (joyL.active && joyL.id === t.identifier) {
                        joyL.move(t.clientX, t.clientY);
                        updateJoyVisual('joy-left', null, false, joyL);
                    }
                    if (joyR.active && joyR.id === t.identifier) {
                        joyR.move(t.clientX, t.clientY);
                        updateJoyVisual('joy-right', null, false, joyR);
                    }
                } else if (isDragging) {
                    const dx = t.clientX - dragStart.x;
                    const dy = t.clientY - dragStart.y;
                    camera.x = camStart.x - dx;
                    camera.y = camStart.y - dy;
                }
            }
        }

        function onTouchEnd(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (mode === 'PLAY') {
                    if (joyL.active && joyL.id === t.identifier) {
                        joyL.end(); updateJoyVisual('joy-left', null);
                    }
                    if (joyR.active && joyR.id === t.identifier) {
                        joyR.end(); updateJoyVisual('joy-right', null);
                    }
                } else if (isDragging) {
                    const dx = t.clientX - dragStart.x;
                    const dy = t.clientY - dragStart.y;
                    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) placeItem(t.clientX, t.clientY);
                    isDragging = false;
                }
            }
        }

        function updateJoyVisual(id, pos, isStart, joy) {
            const el = document.getElementById(id);
            const zone = el.parentElement;
            if (isStart) {
                zone.style.left = (pos.x - 60) + 'px';
                zone.style.top = (pos.y - 60) + 'px';
                zone.style.opacity = '1';
                el.style.transform = 'translate(-50%, -50%)';
            } else if (joy) {
                const max = 40;
                el.style.transform = `translate(calc(-50% + ${joy.vec.x * max}px), calc(-50% + ${joy.vec.y * max}px))`;
            } else {
                zone.style.opacity = '0.3';
                el.style.transform = 'translate(-50%, -50%)';
                if (id === 'joy-left') { zone.style.left = '2rem'; zone.style.bottom = '3rem'; zone.style.top = 'auto'; }
                else { zone.style.right = '2rem'; zone.style.bottom = '3rem'; zone.style.left = 'auto'; zone.style.top = 'auto'; }
            }
        }

        function placeItem(sx, sy) {
            const wx = sx - width/2 + camera.x;
            const wy = sy - height/2 + camera.y;
            
            if (selectedItem.category === 'structure' || selectedItem.type === 'floor') {
                const gx = Math.round(wx / CONFIG.tileSize);
                const gy = Math.round(wy / CONFIG.tileSize);
                setBlock(gx, gy, selectedItem.id);
                spawnParticles(wx, wy, '#fff', 5);
            } else {
                spawnEntity(selectedItem.id, wx, wy);
                spawnParticles(wx, wy, selectedItem.color, 8);
            }
        }

        init();
        syncBgm();
    </script>
