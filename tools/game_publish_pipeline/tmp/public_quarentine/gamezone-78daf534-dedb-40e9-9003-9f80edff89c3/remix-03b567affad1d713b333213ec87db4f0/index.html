<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Idea Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #0f1738;
        --bg-bottom: #040713;
        --hud-line: rgba(153, 226, 255, 0.32);
        --glow: rgba(94, 208, 255, 0.48);
        --word-core: #f5fbff;
        --word-accent: #8ee5ff;
        --word-shadow: #14315e;
        --button-top: #ffd86a;
        --button-bottom: #ff8f3d;
        --button-edge: #fff1b5;
        --button-text: #1d2140;
        --panel-bg: rgba(9, 19, 46, 0.74);
        --panel-edge: rgba(153, 226, 255, 0.32);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(107, 202, 255, 0.14), transparent 30%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        font-family: 'Rajdhani', sans-serif;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,0.18) 0 1px, transparent 1px 100%),
            radial-gradient(circle at 80% 35%, rgba(142,229,255,0.16) 0 1.5px, transparent 1.5px 100%),
            radial-gradient(circle at 35% 70%, rgba(255,216,106,0.12) 0 1px, transparent 1px 100%);
        background-size: 180px 180px, 240px 240px, 210px 210px;
        opacity: 0.7;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
    }

    canvas {
        display: block;
        touch-action: none;
        width: 100%;
        height: 100%;
        filter: saturate(1.08);
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.05), transparent 18%, transparent 82%, rgba(255,255,255,0.03)),
            linear-gradient(90deg, transparent 0, rgba(153, 226, 255, 0.08) 50%, transparent 100%);
        mix-blend-mode: screen;
    }

    #hud {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 16px);
        left: 16px;
        right: 16px;
        z-index: 70;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        pointer-events: none;
    }

    .hud-card {
        max-width: min(58vw, 320px);
        padding: 12px 14px;
        border-radius: 18px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-edge);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
    }

    .hud-kicker {
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        line-height: 1.2;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8ee5ff;
        margin-bottom: 6px;
    }

    .hud-value {
        font-size: clamp(16px, 2.9vw, 22px);
        font-weight: 600;
        line-height: 1.15;
        color: #f5fbff;
        word-break: break-word;
    }

    .hud-subtle {
        margin-top: 6px;
        font-size: 13px;
        color: rgba(245, 251, 255, 0.72);
    }

    #reaction-strip {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        z-index: 72;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-end;
        pointer-events: none;
    }

    .reaction-gif {
        width: clamp(74px, 18vw, 108px);
        height: clamp(74px, 18vw, 108px);
        border-radius: 20px;
        object-fit: cover;
        opacity: 0;
        transform: translateY(14px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        box-shadow: 0 12px 28px rgba(0,0,0,0.26);
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(9, 19, 46, 0.42);
    }

    .reaction-gif.active {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }

    #left-reaction {
        align-self: flex-start;
        margin-top: 24px;
    }

    @media (max-width: 540px) {
        #hud {
            flex-direction: column;
            align-items: stretch;
        }

        .hud-card {
            max-width: none;
        }

        #reaction-strip {
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        }

        .reaction-gif {
            width: 78px;
            height: 78px;
            border-radius: 18px;
        }
    }
</style>
<script id="game-config" type="application/x-game-config">
{
    "bgColor": { "type": "color", "label": "Background", "value": "#E8E8E8" },
    "textColor": { "type": "color", "label": "Text Color", "value": "#222222" },

<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer"></div>

    <div id="hud" aria-hidden="true">
        <div class="hud-card">
            <div class="hud-kicker">Idea Drift</div>
            <div class="hud-value" id="idea-label">Scanning idea lane…</div>
            <div class="hud-subtle">Tap the button to remix the current prompt.</div>
        </div>
        <div class="hud-card">
            <div class="hud-kicker">Combo</div>
            <div class="hud-value" id="combo-label">0 remixes</div>
            <div class="hud-subtle" id="status-label">Audio online after first tap.</div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: success/fail feedback overlays -> catalogs/gifs.json -->
    <div id="reaction-strip" aria-hidden="true">
        <img id="left-reaction" class="reaction-gif" alt="Success reaction overlay">
        <img id="right-reaction" class="reaction-gif" alt="Energy reaction overlay">
    </div>
</div>

<!-- [agent-note][stage3] resolved-audio: bgm/ui/bonus/blocked -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" preload="auto" loop></audio>

<script>
const wordsList = [
    "Moon","Cat","Sun","Cloud","Tree","Stone","River","Wave","Sand","Leaf",
    "Flower","Grass","Mushroom","Bird","Fish","Star","Planet","Space","Lightning","Mist",
    "Ice","Snow","Glacier","Mountain","Cave","Portal","Magic","Dragon","Fairy","Wolf",
    "Fox","Bear","Snake","Eagle","Owl","Lion","Tiger","Panda","Rabbit","Hedgehog",
    "Lunara","Galaxy","Volcano","Lake","Beach","Desert","Ship","Airplane","Train","Car",
    "Bicycle","Motorcycle","Robot","Human","Chair","Table","Book","Pen","Paper","Phone",
    "Computer","Screen","Keyboard","Mouse","Lamp","Window","Door","Painting","Music","Sound",
    "Melody","Song","Dance","Piano","Guitar","Drum","Violin","Flute","Trumpet","Wonder",
    "Power","Light","Darkness","Day","Night","Dawn","Sunset","Wind","Storm","Rain",
    "Comet","Meteor","Satellite","Astronaut","Rocket","Planetarium","Telescope","Astronomer","Universe","Black Hole",
    "Supernova","Milky Way","Orbit","Atmosphere","Gravity","Magnet","Pulsar","Asteroid","Avalanche","Earthquake",
    "Lava","Clay","Sandstone","Rock","Canyon","Swamp","Stream","Waterfall","Foliage","Bush",
    "Pine","Birch","Oak","Linden","Maple","Ash","Nut","Fruit","Apple","Pear",
    "Cherry","Plum","Grapes","Raspberry","Strawberry","Blackberry","Carrot","Potato","Pumpkin","Cucumber",
    "Zucchini","Pepper","Onion","Garlic","Tomato","Eggplant","Cabbage","Cauliflower","Broccoli","Root",
    "Shrub","Vine","Branch","Soil","Earth","Pebble","Ground","Dust","Dew","Sky",
    "Boat","Yacht","Steamer","Rope","Net","Bridge","Armchair","Light Fixture","Mirror","Carpet",
    "Notebook","Exercise Book","Marker","Pencil","Eraser","Scissors","Glue","Tape","Box","Crate",
    "Shelf","Wardrobe","Dresser","Sofa","Voice","Whisper","Shout","Noise","Thunderstorm","Magma",
    "Forest","Park","Garden","Vegetable Patch"
];

// Configuration
window.gameConfigDefs = {};
window.gameConfig = {};
try {
    const confStr = document.getElementById('game-config').textContent;
    window.gameConfigDefs = JSON.parse(confStr);
    for (let key in window.gameConfigDefs) {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    }
} catch(e) { console.error("Config parse error", e); }

window.updateGameConfig = (k, v) => { window.gameConfig[k] = v; };

const mediaCatalog = {
    bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
    sfx: {
        click: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        collect: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
        success: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
        blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3'
    },
    gifs: {
        success: 'https://i.giphy.com/l4FGpPki5v2Bcd6Ss.webp',
        energy: 'https://i.giphy.com/1zmG8avB83Uvm.webp'
    }
};

// Audio System
const audioManager = {
    ctx: null,
    bgm: document.getElementById('bgm_main'),
    unlocked: false,
    sfxPool: {},
    lastPlayAt: {},
    init() {
        try {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        } catch(e) {}

        if (this.bgm) {
            this.bgm.src = mediaCatalog.bgm;
            this.bgm.volume = 0.22;
        }

        Object.entries(mediaCatalog.sfx).forEach(([key, url]) => {
            const sound = new Audio(url);
            sound.preload = 'auto';
            sound.volume = key === 'success' ? 0.42 : key === 'collect' ? 0.34 : 0.28;
            this.sfxPool[key] = sound;
        });
    },
    unlock() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(()=>{});
        }
        if (this.bgm && this.bgm.src) {
            this.bgm.play().catch(()=>{});
        }
        this.unlocked = true;
    },
    play(name, minGap = 90) {
        const sound = this.sfxPool[name];
        if (!sound || !this.unlocked) return;
        const now = performance.now();
        if (this.lastPlayAt[name] && now - this.lastPlayAt[name] < minGap) return;
        this.lastPlayAt[name] = now;
        try {
            sound.currentTime = 0;
            sound.play().catch(()=>{});
        } catch(e) {}
    },
    pauseLoop() {
        if (this.bgm) this.bgm.pause();
    },
    resumeLoop() {
        if (!this.unlocked || !this.bgm || !this.bgm.src) return;
        this.bgm.play().catch(()=>{});
    }
};

// Vibration
function vibrate(style = 'light') {
    try {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style: style }
        });
    } catch(e) {}
}

// Core Variables
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ideaLabel = document.getElementById('idea-label');
const comboLabel = document.getElementById('combo-label');
const statusLabel = document.getElementById('status-label');
const leftReaction = document.getElementById('left-reaction');
const rightReaction = document.getElementById('right-reaction');

let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let initialized = false;
let lastTime = 0;
let gameState = 'PLAYING';

// Game State
let currentWord = "";
let floatingWords = [];
let ambientOrbs = [];
let remixCount = 0;
let button = { x: 0, y: 0, w: 200, h: 60, r: 30, text: "Next idea", pressed: false, pressTime: 0 };

function resize(entries) {
    if (!entries || !entries[0]) return;
    const cr = entries[0].contentRect;
    cw = cr.width;
    ch = cr.height;

    if (cw === 0 || ch === 0) return;

    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    button.w = Math.min(220, cw * 0.52);
    button.h = Math.max(58, Math.min(70, ch * 0.1));
    button.r = button.h / 2;
    button.x = cw / 2;
    button.y = ch * 0.8;

    if (!initialized) {
        initGame();
    }
}

const ro = new ResizeObserver(resize);

function initAmbientOrbs() {
    ambientOrbs = Array.from({ length: 10 }, (_, index) => ({
        x: Math.random() * cw,
        y: Math.random() * ch,
        radius: 16 + Math.random() * 34,
        drift: 6 + Math.random() * 14,
        speed: 0.35 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.08 + Math.random() * 0.12,
        hueShift: index % 2 === 0 ? 1 : -1
    }));
}

function setReactionTargets() {
    leftReaction.src = mediaCatalog.gifs.success;
    rightReaction.src = mediaCatalog.gifs.energy;
}

function flashReaction(imgEl, duration = 1150) {
    if (!imgEl) return;
    imgEl.classList.add('active');
    clearTimeout(imgEl._hideTimer);
    imgEl._hideTimer = setTimeout(() => {
        imgEl.classList.remove('active');
    }, duration);
}

function updateHud() {
    if (ideaLabel) ideaLabel.textContent = `Current spark: ${currentWord || '…'}`;
    if (comboLabel) comboLabel.textContent = `${remixCount} remix${remixCount === 1 ? '' : 'es'}`;
}

function initGame() {
    audioManager.init();
    setReactionTargets();
    currentWord = wordsList[Math.floor(Math.random() * wordsList.length)];
    initAmbientOrbs();
    updateHud();
    if (statusLabel) statusLabel.textContent = 'Tap once to unlock the arcade loop.';
    initialized = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function spawnFloatingWord(text) {
    floatingWords.push({
        text: text,
        x: cw / 2 + (Math.random() * 40 - 20),
        y: ch * 0.4,
        vy: -(Math.random() * 20 + 30),
        alpha: 1,
        scale: 1
    });
}

function nextWord() {
    if (currentWord) {
        spawnFloatingWord(currentWord);
    }
    let nw = currentWord;
    while (nw === currentWord) {
        nw = wordsList[Math.floor(Math.random() * wordsList.length)];
    }
    currentWord = nw;
    remixCount += 1;
    updateHud();
    audioManager.play('collect', 120);
    audioManager.play('success', 220);
    flashReaction(leftReaction, 1300);
    flashReaction(rightReaction, 900);
    if (statusLabel) {
        statusLabel.textContent = remixCount < 5
            ? 'Arcade drift stabilized. Keep remixing.'
            : 'Combo humming. The idea lane is hot.';
    }
}

function handleCanvasInput(e) {
    e.preventDefault();
    audioManager.unlock();
    audioManager.resumeLoop();

    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        const bw = button.w / 2;
        const bh = button.h / 2;
        if (x >= button.x - bw && x <= button.x + bw && y >= button.y - bh && y <= button.y + bh) {
            button.pressed = true;
            button.pressTime = performance.now();
            nextWord();
            audioManager.play('click', 80);
            vibrate('light');
        } else {
            audioManager.play('blocked', 180);
            flashReaction(rightReaction, 720);
            if (statusLabel) statusLabel.textContent = 'Tap the glowing remix button to drift again.';
        }
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        button.pressed = false;
    }
}

function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function update(dt) {
    const cappedDt = Math.min(dt, 0.1);

    for (let orb of ambientOrbs) {
        orb.phase += cappedDt * orb.speed;
        orb.y -= cappedDt * orb.drift;
        if (orb.y + orb.radius < -10) {
            orb.y = ch + orb.radius + Math.random() * 40;
            orb.x = Math.random() * cw;
        }
    }

    for (let i = floatingWords.length - 1; i >= 0; i--) {
        let fw = floatingWords[i];
        fw.y += fw.vy * cappedDt;
        fw.alpha -= 0.5 * cappedDt;
        fw.scale += 0.2 * cappedDt;
        if (fw.alpha <= 0) {
            floatingWords.splice(i, 1);
        }
    }

    if (button.pressed && performance.now() - button.pressTime > 150) {
        button.pressed = false;
    }
}

function drawCharacterHalo(x, y, pulse) {
    const halo = ctx.createRadialGradient(x, y, 8, x, y, 110 + pulse * 16);
    halo.addColorStop(0, 'rgba(142, 229, 255, 0.35)');
    halo.addColorStop(0.45, 'rgba(94, 208, 255, 0.18)');
    halo.addColorStop(1, 'rgba(94, 208, 255, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, 110 + pulse * 16, 0, Math.PI * 2);
    ctx.fill();
}

function drawCharacterCore(x, y, fontSize, pulse) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.shadowColor = `rgba(94, 208, 255, ${0.45 + pulse * 0.15})`;
    ctx.shadowBlur = 26 + pulse * 10;
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(20, 49, 94, 0.96)';
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--word-core') || '#f5fbff';
    ctx.font = `400 ${fontSize}px 'Orbitron', sans-serif`;
    ctx.strokeText(currentWord, x, y);
    ctx.fillText(currentWord, x, y);

    ctx.shadowBlur = 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(142, 229, 255, ${0.65 + pulse * 0.1})`;
    ctx.strokeText(currentWord, x, y);

    const badgeWidth = Math.min(Math.max(fontSize * 2.2, 170), cw * 0.78);
    const badgeHeight = Math.max(54, fontSize * 0.82);
    const badgeY = y - fontSize * 0.95;
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(9, 19, 46, 0.78)';
    drawRoundedRect(ctx, x - badgeWidth / 2, badgeY - badgeHeight / 2, badgeWidth, badgeHeight, 18);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(153, 226, 255, 0.4)';
    drawRoundedRect(ctx, x - badgeWidth / 2, badgeY - badgeHeight / 2, badgeWidth, badgeHeight, 18);
    ctx.stroke();
    ctx.fillStyle = '#8ee5ff';
    ctx.font = `600 ${Math.max(12, Math.min(16, cw * 0.032))}px 'Rajdhani', sans-serif`;
    ctx.fillText('IDEA STAR', x, badgeY);

    ctx.restore();
}

function draw() {
    const bgTop = window.gameConfig.bgColor || '#0f1738';
    const bgBottom = '#040713';
    const sky = ctx.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, bgTop);
    sky.addColorStop(1, bgBottom);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cw, ch);

    const horizon = ctx.createRadialGradient(cw / 2, ch * 0.78, 10, cw / 2, ch * 0.78, Math.max(cw, ch) * 0.8);
    horizon.addColorStop(0, 'rgba(255, 216, 106, 0.14)');
    horizon.addColorStop(0.35, 'rgba(94, 208, 255, 0.08)');
    horizon.addColorStop(1, 'rgba(4, 7, 19, 0)');
    ctx.fillStyle = horizon;
    ctx.fillRect(0, 0, cw, ch);

    for (let orb of ambientOrbs) {
        const orbX = orb.x + Math.sin(orb.phase) * 18;
        const orbY = orb.y + Math.cos(orb.phase * 1.2) * 10;
        const gradient = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, orb.radius);
        gradient.addColorStop(0, `rgba(${orb.hueShift > 0 ? '142,229,255' : '255,216,106'}, ${orb.alpha})`);
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(orbX, orbY, orb.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.save();
    ctx.strokeStyle = 'rgba(153, 226, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let y = ch * 0.14; y < ch; y += Math.max(34, ch * 0.095)) {
        ctx.beginPath();
        ctx.moveTo(cw * 0.08, y);
        ctx.lineTo(cw * 0.92, y);
        ctx.stroke();
    }
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let fw of floatingWords) {
        ctx.save();
        ctx.translate(fw.x, fw.y);
        ctx.scale(fw.scale, fw.scale);
        ctx.shadowColor = `rgba(94, 208, 255, ${Math.max(0, fw.alpha) * 0.45})`;
        ctx.shadowBlur = 14;
        ctx.strokeStyle = `rgba(20, 49, 94, ${Math.max(0, fw.alpha)})`;
        ctx.lineWidth = 5;
        ctx.font = `600 28px 'Rajdhani', sans-serif`;
        ctx.strokeText(fw.text, 0, 0);
        ctx.fillStyle = `rgba(142, 229, 255, ${Math.max(0, fw.alpha)})`;
        ctx.fillText(fw.text, 0, 0);
        ctx.restore();
    }

    const pulse = (Math.sin(performance.now() * 0.004) + 1) * 0.5;
    const wordY = ch * 0.4;
    const fontSize = Math.min(cw * 0.15, 64);
    drawCharacterHalo(cw / 2, wordY, pulse);
    drawCharacterCore(cw / 2, wordY, fontSize, pulse);

    ctx.save();
    ctx.translate(button.x, button.y);
    if (button.pressed) {
        ctx.scale(0.95, 0.95);
    }

    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 8;

    const buttonGradient = ctx.createLinearGradient(0, -button.h / 2, 0, button.h / 2);

function gameLoop(time) {
    try {
        const dt = (time - lastTime) / 1000;
        lastTime = time;

            update(dt);
            draw();
        }
    } catch(e) {
        console.error(e);
    }
    requestAnimationFrame(gameLoop);
}
