<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Property Wild!</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <script>
        tailwind.config = { corePlugins: { preflight: true } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | title/hud -> Orbitron, ui/body -> Exo 2 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #070b1f;
            --bg-mid: #111938;
            --panel-fill: rgba(8, 14, 34, 0.82);
            --panel-stroke: rgba(118, 243, 255, 0.28);
            --glow-cyan: rgba(66, 227, 255, 0.35);
            --glow-pink: rgba(255, 79, 178, 0.24);
            --text-main: #ecf7ff;
            --text-dim: rgba(218, 235, 255, 0.68);
            --route-red: #ff647f;
            --route-blue: #66b8ff;
            --route-green: #46e6ab;
            --route-yellow: #ffe16c;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 18%, rgba(88, 164, 255, 0.2), transparent 28%),
                radial-gradient(circle at 82% 24%, rgba(255, 95, 168, 0.18), transparent 24%),
                linear-gradient(180deg, #0f1736 0%, #090f24 48%, #050813 100%);
            color: var(--text-main);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(90,160,255,0.04) 1px, transparent 1px);
            background-size: 100% 28px, 28px 100%;
            opacity: 0.28;
            mix-blend-mode: screen;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(19, 31, 67, 0.94), rgba(7, 13, 29, 0.88)),
                var(--panel-fill);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 12px 38px rgba(0, 0, 0, 0.42),
                0 0 18px var(--glow-cyan);
        }
        .glass-panel--hero {
            position: relative;
            overflow: hidden;
        }
        .glass-panel--hero::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.14), transparent 36%, transparent 64%, rgba(66,227,255,0.1));
            opacity: 0.9;
        }
        .title-font { font-family: 'Orbitron', 'Exo 2', ui-sans-serif, system-ui, sans-serif; }
        .ui-font { font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif; }
        .retro-font { font-family: 'Orbitron', 'Exo 2', ui-sans-serif, system-ui, sans-serif; }
        .hud-chip {
            min-width: 104px;
            padding: 0.75rem 0.9rem;
            border-radius: 1rem;
        }
        .hud-label {
            color: var(--text-dim);
            font-size: 0.64rem;
            letter-spacing: 0.22em;
        }
        .hud-money {
            text-shadow: 0 0 10px currentColor;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .deal-btn {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(150, 246, 255, 0.45);
            box-shadow: 0 10px 30px rgba(3, 10, 32, 0.45), 0 0 16px rgba(66, 227, 255, 0.22);
        }
        .deal-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.22) 45%, transparent 70%);
            transform: translateX(-140%);
            transition: transform 220ms ease;
        }
        .deal-btn:hover::after { transform: translateX(140%); }
        .card-anim {
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }
        .card-anim:active { transform: translateY(2px) scale(0.96); }
        .route-badge {
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.34), rgba(255,255,255,0.08));
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 0 20px rgba(255,255,255,0.12);
        }
        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(26vw, 120px);
            aspect-ratio: 1 / 1;
            border-radius: 1rem;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 18px rgba(66, 227, 255, 0.2);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 35;
            background: rgba(8, 14, 34, 0.8);
        }
        .feedback-gif.is-active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .feedback-gif--loss {
            left: 1rem;
            right: auto;
            bottom: 1rem;
            width: min(28vw, 128px);
        }
        @media (max-width: 640px) {
            .feedback-gif {
                width: min(28vw, 96px);
                right: 0.65rem;
                bottom: 0.65rem;
            }
            .feedback-gif--loss {
                left: 0.65rem;
                right: auto;
                bottom: 0.65rem;
            }
            #ui-layer { padding: 0.8rem; }
            #hud { gap: 0.55rem; }
            .hud-chip {
                min-width: 0;
                padding: 0.6rem 0.65rem;
                border-radius: 0.9rem;
            }
            .hud-label { font-size: 0.56rem; letter-spacing: 0.14em; }
            .hud-money { font-size: 1rem; }
            #hand-cards { gap: 0.38rem; }
            #draw-btn {
                padding: 0.95rem 1rem;
                font-size: 0.86rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full select-none">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Overlay -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between pointer-events-none p-4">
            
            <!-- HUD Top -->
            <div id="hud" class="flex justify-between w-full hidden">
                <div class="glass-panel hud-chip flex flex-col items-center">
                    <span class="text-sm route-badge mb-2" aria-hidden="true">🦹</span>
                    <span class="hud-label uppercase">Rival Broker</span>
                    <span class="text-2xl font-bold text-red-300 hud-money">$<span id="ai-money">1500</span></span>
                    <span class="text-xs text-white/60 status-pill mt-1" id="ai-status">Waiting...</span>
                </div>
                
                <div class="glass-panel hud-chip flex flex-col items-center">
                    <span class="text-sm route-badge mb-2" aria-hidden="true">🗺️</span>
                    <span class="hud-label uppercase">Route Pile</span>
                    <div id="discard-display" class="w-12 h-16 bg-white/95 rounded-xl mt-1 flex items-center justify-center font-bold text-xl border-2 border-cyan-200 shadow-inner ui-font">
                        <!-- JS updates this -->
                        <span id="discard-val">#</span>

                <div class="glass-panel hud-chip flex flex-col items-center">

                    <span class="hud-label uppercase">Street Fox</span>
                    <span class="text-2xl font-bold text-emerald-300 hud-money">$<span id="player-money">1500</span></span>
                    <span class="text-xs text-white/60 status-pill mt-1" id="player-status">Your Turn</span>
                </div>
            </div>

            <!-- Hand Area (Bottom) -->
            <div id="player-hand-container" class="w-full flex justify-center items-end pb-4 hidden pointer-events-auto">
                <div id="hand-cards" class="flex space-x-2 overflow-x-auto p-2">
                    <!-- Cards injected here -->
                </div>
                <button id="draw-btn" class="ml-4 glass-panel deal-btn text-white font-bold py-4 px-6 rounded-xl hover:bg-white/10 active:scale-95 transition shadow-lg border-l-4 border-yellow-400 ui-font">
                    DRAW ROUTE
                </button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center z-50 bg-black/60 backdrop-blur-sm">
            <div class="glass-panel glass-panel--hero p-8 sm:p-10 rounded-3xl text-center max-w-md border-t-4 border-cyan-400">
                <div class="flex justify-center mb-4" aria-hidden="true">
                    <span class="route-badge" style="width:4rem;height:4rem;font-size:2rem;">🦊</span>
                </div>
                <p class="text-cyan-200/80 uppercase tracking-[0.35em] text-[11px] mb-2 ui-font">Neon Broker Run</p>
                <h1 class="text-5xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-300 to-fuchsia-400 mb-3 drop-shadow-lg title-font" style="letter-spacing: 0.04em;">PROPERTY RUSH!</h1>
                <p class="text-white/80 text-base sm:text-lg mb-8 ui-font">Card-match your route around the block.<br>Claim open lots and outlast the rival broker.</p>
                <button id="start-btn" class="deal-btn bg-gradient-to-r from-cyan-500 via-blue-500 to-fuchsia-500 text-white font-bold py-4 px-10 rounded-full hover:shadow-cyan-400/40 hover:scale-105 transition transform duration-200 text-lg sm:text-xl ui-font">START DEAL</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col justify-center items-center z-50 bg-black/80 backdrop-blur-md">
            <div class="glass-panel glass-panel--hero p-8 sm:p-10 rounded-3xl text-center max-w-md">
                <h2 id="go-title" class="text-5xl font-bold text-white mb-4">MARKET CLOSED</h2>
                <p id="go-msg" class="text-xl text-gray-300 mb-8">Result message here.</p>
                <button id="restart-btn" class="bg-white text-gray-900 font-bold py-3 px-10 rounded-full shadow-lg hover:bg-gray-200 transition">Play Again</button>
            </div>
        </div>
        
        <!-- Notification Toast -->
        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-opacity duration-500 z-40">
            <div class="glass-panel px-8 py-4 rounded-full text-xl sm:text-2xl font-bold text-white shadow-2xl border border-white/20 ui-font" id="toast-msg">
                Market update!
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: reward/fail reactions -> catalogs/gifs.json -->
        <img id="celebration-gif" class="feedback-gif" alt="Broker celebration reaction" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
        <img id="fail-gif" class="feedback-gif feedback-gif--loss" alt="Broker setback reaction" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3",
            sfx: {
                play: "https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3",
                claim: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                passGo: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                rent: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
                lose: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                draw: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.22;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(v);
                    sample.preload = 'auto';
                    this.sfx[k] = sample;
                }
            }
            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                const prime = [this.bgm, ...Object.values(this.sfx)];
                prime.forEach(media => {
                    media.muted = true;
                    media.play().then(() => {
                        media.pause();
                        media.currentTime = 0;
                        media.muted = false;
                    }).catch(() => {
                        media.muted = false;
                    });
                });
            }
            playBGM() {
                this.unlock();
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, volume = 0.7, debounceMs = 120) {
                const sample = this.sfx[key];
                if (!sample) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
                this.lastPlayedAt[key] = now;
                const clone = sample.cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        const COLORS = {
            RED: '#ef4444',
            BLUE: '#3b82f6',
            GREEN: '#22c55e',
            YELLOW: '#eab308',
            NEUTRAL: '#9ca3af',
            BLACK: '#1f2937'
        };

        const CARD_COLORS = ['RED', 'BLUE', 'GREEN', 'YELLOW'];
        
        // Game State Variables
        let gameActive = false;
        let turn = 0; // 0: Player, 1: AI
        let board = [];
        let players = [];
        let deck = [];
        let discardPile = [];
        let particles = [];
        let bgParticles = [];

        // UI Elements
        const playerMoneyEl = document.getElementById('player-money');
        const aiMoneyEl = document.getElementById('ai-money');
        const discardDisplay = document.getElementById('discard-display');
        const discardVal = document.getElementById('discard-val');
        const handContainer = document.getElementById('hand-cards');
        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const celebrationGif = document.getElementById('celebration-gif');
        const failGif = document.getElementById('fail-gif');

        /** 4. CLASSES & LOGIC */

        class Card {
            constructor(color, value) {
                this.color = color; // String key
                this.value = value; // 1-5
                this.id = Math.random().toString(36).substr(2, 9);
            }
        }

        class Player {
            constructor(isAi, name, color) {
                this.isAi = isAi;
                this.name = name;
                this.color = color;
                this.money = 1500;
                this.pos = 0; // Board index 0-19
                this.hand = [];
                this.properties = [];
                this.isBankrupt = false;
            }
        }

        class Space {
            constructor(index, type, colorKey, name, price) {
                this.index = index;
                this.type = type; // 'prop', 'start', 'jail', 'parking', 'gotojail'
                this.colorKey = colorKey;
                this.name = name;
                this.price = price;
                this.rent = Math.floor(price * 0.4);
                this.owner = null;
                
                // Drawing coordinates calculated on resize
                this.x = 0;
                this.y = 0;
                this.w = 0;
                this.h = 0;
            }
        }

        /** 5. INITIALIZATION */
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            calculateBoardLayout();
            initBgParticles();
        }
        window.addEventListener('resize', resize);

        function initBgParticles() {
            bgParticles = [];
            for(let i=0; i<20; i++) {
                bgParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 50 + 20,
                    speedY: Math.random() * 0.5 + 0.1,
                    type: Math.random() > 0.5 ? '$' : 'DEED',
                    opacity: Math.random() * 0.1
                });
            }
        }

        function createBoard() {
            board = [];
            // 20 Spaces. 0=Start, 5=Jail, 10=Free, 15=GoToJail
            const layout = [
                {t:'start', c:'NEUTRAL', n:'GO', p:0},
                {t:'prop', c:'RED', n:'Red St.', p:60},
                {t:'prop', c:'RED', n:'Red Ave.', p:80},
                {t:'prop', c:'RED', n:'Red Pl.', p:100},
                {t:'prop', c:'BLUE', n:'Blue Ln.', p:120},
                {t:'jail', c:'NEUTRAL', n:'JAIL', p:0},
                {t:'prop', c:'BLUE', n:'Blue Dr.', p:140},
                {t:'prop', c:'BLUE', n:'Blue Blvd.', p:160},
                {t:'prop', c:'GREEN', n:'Green Wy.', p:180},
                {t:'prop', c:'GREEN', n:'Green Ct.', p:200},
                {t:'parking', c:'NEUTRAL', n:'FREE', p:0},
                {t:'prop', c:'GREEN', n:'Green Rd.', p:220},
                {t:'prop', c:'YELLOW', n:'Yel Ln.', p:240},
                {t:'prop', c:'YELLOW', n:'Yel Ave.', p:260},
                {t:'prop', c:'YELLOW', n:'Yel Blvd.', p:280},
                {t:'gotojail', c:'NEUTRAL', n:'GO TO JAIL', p:0},
                {t:'prop', c:'RED', n:'Red Hts.', p:300},
                {t:'prop', c:'BLUE', n:'Blue Pk.', p:320},
                {t:'prop', c:'GREEN', n:'Grn Hts.', p:350},
                {t:'prop', c:'YELLOW', n:'Yel Pk.', p:400}
            ];

            layout.forEach((s, i) => {
                board.push(new Space(i, s.t, s.c, s.n, s.p));
            });
        }

        function createDeck() {
            deck = [];
            CARD_COLORS.forEach(c => {
                for (let v = 1; v <= 5; v++) {
                    // Add 2 of each number per color
                    deck.push(new Card(c, v));
                    deck.push(new Card(c, v));
                }
            });
            shuffle(deck);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame() {
            createBoard();
            calculateBoardLayout();
            createDeck();
            
            // Setup Players
            players = [
                new Player(false, "You", "#ffffff"), // White token
                new Player(true, "Bot", "#000000")  // Black token
            ];

            // Deal Hands (5 cards each)
            for(let i=0; i<5; i++) {
                drawCard(players[0]);
                drawCard(players[1]);
            }

            // Start Discard Pile
            discardPile = [deck.pop()];
            updateDiscardUI();

            gameActive = true;
            turn = 0; // Player starts
            updateUI();
            
            // Initial render of hand
            renderHand();
        }

        // Layout Logic: Draw a rounded rect path for the board
        function calculateBoardLayout() {
            if(board.length === 0) return;
            
            const margin = Math.min(width, height) * 0.15;
            const boardW = width - margin * 2;
            const boardH = height - margin * 2 - 100; // Leave space for hand
            
            // Simple loop layout: Top(0-5), Right(5-10), Bottom(10-15), Left(15-20)
            // Actually, let's just do a rect perimeter. 20 spaces.
            // 6 Top, 4 Right, 6 Bottom, 4 Left = 20 spaces total.
            
            const topCount = 6;
            const rightCount = 4;
            const bottomCount = 6;
            const leftCount = 4;
            
            const cellW = boardW / topCount;
            const cellH = boardH / (rightCount + 2); // approximate
            
            // Coordinate generation is tricky for a loop. Let's simplify.
            // We will define points along the rectangle perimeter.
            // Top Left is 0.
            
            const startX = (width - boardW)/2;
            const startY = (height - boardH)/2;
            
            // Top Row (0 to 5) -> Left to Right
            // Right Row (5 to 10) -> Top to Bottom
            // Bottom Row (10 to 15) -> Right to Left
            // Left Row (15 to 19) -> Bottom to Top
            
            // Let's refine counts to match 20 exactly.
            // 0,1,2,3,4,5 (Top edge, 6 spaces)
            // 5 is Corner TR? No, let's make corners distinct indices.
            // 0=TL, 5=TR, 10=BR, 15=BL.
            
            // 0(TL) -> 1,2,3,4 -> 5(TR)
            // 5(TR) -> 6,7,8,9 -> 10(BR)
            // 10(BR) -> 11,12,13,14 -> 15(BL)
            // 15(BL) -> 16,17,18,19 -> 0(TL)
            
            const stepX = boardW / 5;
            const stepY = boardH / 5;
            
            board.forEach(s => {
                let i = s.index;
                if (i >= 0 && i < 5) { // Top
                    s.x = startX + (i * stepX);
                    s.y = startY;
                    s.w = stepX; s.h = stepY;
                } else if (i >= 5 && i < 10) { // Right
                    s.x = startX + boardW - stepX;
                    s.y = startY + ((i-5) * stepY);
                    s.w = stepX; s.h = stepY;
                } else if (i >= 10 && i < 15) { // Bottom
                    s.x = startX + boardW - ((i-10) * stepX) - stepX;
                    s.y = startY + boardH - stepY;
                    s.w = stepX; s.h = stepY;
                } else { // Left
                    s.x = startX;
                    s.y = startY + boardH - ((i-15) * stepY) - stepY;
                    s.w = stepX; s.h = stepY;
                }
            });
        }

        /** 6. GAMEPLAY ACTIONS */

        function drawCard(player) {
            if (deck.length === 0) {
                // Reshuffle discard into deck (except top)
                if(discardPile.length > 1) {
                    const top = discardPile.pop();
                    deck = discardPile;
                    discardPile = [top];
                    shuffle(deck);
                } else {
                    return; // No cards left
                }
            }
            player.hand.push(deck.pop());
        }

        function isValidPlay(card) {
            const top = discardPile[discardPile.length - 1];
            return card.color === top.color || card.value === top.value;
        }

        function playCard(player, cardIndex) {
            const card = player.hand[cardIndex];
            
            // Validate
                if (!isValidPlay(card)) {
                    showToast("Route mismatch!", "red");
                audio.playSFX('blocked', 0.6, 180);
                pulseFeedbackGif('fail');
                return;
            }

            // Execute Play
            player.hand.splice(cardIndex, 1);
            discardPile.push(card);
            updateDiscardUI();
            audio.playSFX('play', 0.55, 120);
            
            if (player === players[0]) renderHand();

            // Move Player
            movePlayer(player, card.value);
        }

        function movePlayer(player, steps) {
            let stepsLeft = steps;
            
            const stepInterval = setInterval(() => {
                player.pos = (player.pos + 1) % 20;
                stepsLeft--;
                
                // Passing GO logic
                if (player.pos === 0) {
                    player.money += 200;
                    showToast("Passed HQ! +$200");
                    audio.playSFX('passGo', 0.72, 250);
                    pulseFeedbackGif('celebration');
                }

                if (stepsLeft <= 0) {
                    clearInterval(stepInterval);
                    handleLand(player);
                }
            }, 200);
        }

        function handleLand(player) {
            const space = board[player.pos];
            
            // Special Spaces
            if (space.type === 'gotojail') {
                showToast("Inspection detour!", "red");
                player.pos = 5; // Jail index
                endTurn();
                return;
            }
            if (space.type === 'jail' || space.type === 'parking' || space.type === 'start') {
                endTurn();
                return;
            }

            // Property Logic
            if (space.type === 'prop') {
                if (space.owner === null) {
                    // Buy?
                    if (player.money >= space.price) {
                        if (player.isAi) {
                            // AI Logic: Buy if has > 300 money left
                            if (player.money >= space.price + 300) {
                                buyProperty(player, space);
                            }
                        } else {
                            // Human: Auto-buy for MVP simplicity or Prompt?
                            // Let's do Auto-buy if affordable to keep flow fast
                            buyProperty(player, space);
                        }
                    }
                } else if (space.owner !== player) {
                    // Pay Rent
                    payRent(player, space);
                }
            }
            endTurn();
        }

        function buyProperty(player, space) {
            player.money -= space.price;
            space.owner = player;
            player.properties.push(space);
            audio.playSFX('claim', 0.72, 180);
                showToast(`${player.name} claimed ${space.name}`, player.isAi ? "red" : "green");
            pulseFeedbackGif(player.isAi ? 'fail' : 'celebration');
            createParticleExplosion(space.x + space.w/2, space.y + space.h/2, COLORS[space.colorKey]);
        }

        function payRent(player, space) {
            const rent = space.rent;
            player.money -= rent;
            space.owner.money += rent;
            audio.playSFX('rent', 0.7, 220);
                showToast(`${player.name} paid $${rent} in fees!`, "red");
            pulseFeedbackGif(player.isAi ? 'celebration' : 'fail');
            
            if (player.money < 0) {
                gameOver(space.owner);
            }
        }

        function endTurn() {
            updateUI();
            if (!gameActive) return;

            // Switch Turn
            turn = (turn + 1) % 2;
            
            if (turn === 1) {
                // AI Turn
                document.getElementById('player-status').innerText = "Waiting...";
                document.getElementById('ai-status').innerText = "Thinking...";
                setTimeout(aiTurn, 1500);
            } else {
                document.getElementById('player-status').innerText = "Your Turn";
                document.getElementById('ai-status').innerText = "Waiting...";
            }
        }

        function aiTurn() {
            const ai = players[1];
            // Find valid cards
            const validIndices = ai.hand.map((c, i) => isValidPlay(c) ? i : -1).filter(i => i !== -1);
            
            if (validIndices.length > 0) {
                // Pick random valid card
                const choice = validIndices[Math.floor(Math.random() * validIndices.length)];
                playCard(ai, choice);
            } else {
                // Draw
                drawCard(ai);
                showToast("Rival drew a card");
                endTurn();
            }
        }

        function gameOver(winner) {
            gameActive = false;
            audio.stopBGM();
            if (winner === players[0]) {
                audio.playSFX('win', 0.82, 300); // Victory sound
                pulseFeedbackGif('celebration', 2600);
                document.getElementById('go-title').innerText = "YOU OWN THE BLOCK!";
                document.getElementById('go-title').className = "text-5xl font-bold text-green-400 mb-4";
                document.getElementById('go-msg').innerText = "Your rival ran out of cash.";
            } else {
                audio.playSFX('lose', 0.82, 300);
                pulseFeedbackGif('fail', 2600);
                document.getElementById('go-title').innerText = "DEAL COLLAPSED!";
                document.getElementById('go-title').className = "text-5xl font-bold text-red-500 mb-4";
                document.getElementById('go-msg').innerText = "Your cash flow ran dry.";
            }
            
            document.getElementById('ui-layer').classList.add('pointer-events-none');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        /** 7. RENDERING */
        
        function updateDiscardUI() {
            const top = discardPile[discardPile.length - 1];
            discardDisplay.style.borderColor = COLORS[top.color];
            discardDisplay.style.color = COLORS[top.color];
            discardVal.innerText = top.value;
            // Also tint background slightly
            discardDisplay.style.backgroundColor = COLORS[top.color] + '22'; // 22 is hex alpha
        }

        function renderHand() {
            handContainer.innerHTML = '';
            players[0].hand.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = `w-16 h-24 rounded-lg flex flex-col items-center justify-center cursor-pointer card-anim shadow-md border-2`;
                div.style.borderColor = COLORS[card.color];
                div.style.backgroundColor = '#2d2d2d';
                
                // Visual check for validity
                if (!isValidPlay(card) && turn === 0) {
                    div.style.opacity = '0.4';
                }

                div.innerHTML = `
                    <div class="w-full h-full rounded flex items-center justify-center font-bold text-2xl" style="color:${COLORS[card.color]}">
                        ${card.value}
                    </div>
                `;
                
                div.onclick = () => {
                    if (turn === 0) playCard(players[0], index);
                };
                handContainer.appendChild(div);
            });
        }

        function updateUI() {
            playerMoneyEl.innerText = players[0].money;
            aiMoneyEl.innerText = players[1].money;
        }

        function pulseFeedbackGif(type, duration = 1400) {
            const target = type === 'celebration' ? celebrationGif : failGif;
            if (!target) return;
            target.classList.add('is-active');
            clearTimeout(target._hideTimer);
            target._hideTimer = setTimeout(() => {
                target.classList.remove('is-active');
            }, duration);
        }

        function showToast(msg, color="white") {
            toastMsg.innerText = msg;
            toastMsg.style.color = color === "red" ? "#f87171" : (color === "green" ? "#4ade80" : "white");
            toastEl.style.opacity = '1';
            toastEl.style.top = '40%'; // Move up slightly
            setTimeout(() => {
                toastEl.style.opacity = '0';
                setTimeout(() => toastEl.style.top = '50%', 500); // Reset pos
            }, 2000);
        }

        function createParticleExplosion(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 1. Background Parallax
            ctx.save();
            bgParticles.forEach(p => {
                p.y -= p.speedY;
                if(p.y < -50) p.y = height + 50;
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = 'rgba(157, 234, 255, 0.86)';
                ctx.font = `${p.size}px "Exo 2"`;
                ctx.fillText(p.type, p.x, p.y);
            });
            ctx.restore();

            // 2. Board
            if (board.length > 0) {
                board.forEach(s => {
                    // Draw Space Base
                    const panelFill = ctx.createLinearGradient(s.x, s.y, s.x + s.w, s.y + s.h);
                    panelFill.addColorStop(0, '#122040');
                    panelFill.addColorStop(1, '#090f22');
                    ctx.fillStyle = panelFill;
                    ctx.fillRect(s.x, s.y, s.w, s.h);

                    // Stroke
                    ctx.strokeStyle = 'rgba(125, 236, 255, 0.28)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(s.x, s.y, s.w, s.h);

                    // Color Strip (Top of space)
                    if (s.type === 'prop') {
                        ctx.fillStyle = COLORS[s.colorKey];
                        // Depending on orientation, strip is different.
                        // Simplified: Just a thick border on the inside
                        ctx.fillRect(s.x + 2, s.y + 2, s.w - 4, 10);
                        
                        // Owner Marker
                        if (s.owner) {
                            ctx.beginPath();
                            ctx.arc(s.x + s.w/2, s.y + s.h/2 + 10, 8, 0, Math.PI*2);
                            ctx.fillStyle = s.owner.color;
                            ctx.fill();
                            ctx.strokeStyle = 'white';
                            ctx.stroke();
                        }
                    }

                    // Text
                    ctx.fillStyle = 'rgba(218, 234, 255, 0.8)';
                    ctx.font = '600 11px "Exo 2"';
                    ctx.textAlign = 'center';
                    ctx.fillText(s.name, s.x + s.w/2, s.y + s.h - 10);
                    
                    if (s.type === 'prop' && !s.owner) {
                        ctx.fillStyle = '#4ade80';
                        ctx.fillText(`$${s.price}`, s.x + s.w/2, s.y + s.h/2 + 5);
                    }
                });
            }

            // 3. Players
            if (players.length > 0) {
                players.forEach((p, idx) => {
                    const s = board[p.pos];
                    if (!s) return;
                    
                    // Offset players slightly so they don't overlap perfectly
                    const offsetX = idx === 0 ? -10 : 10;
                    const offsetY = idx === 0 ? -5 : 5;
                    
                    const px = s.x + s.w/2 + offsetX;
                    const py = s.y + s.h/2 + offsetY;

                    // Shadow
                    ctx.beginPath();
                    ctx.arc(px, py + 6, 13, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.fill();

                    // Token glow
                    ctx.beginPath();
                    ctx.arc(px, py, 17, 0, Math.PI*2);
                    ctx.fillStyle = idx === 0 ? 'rgba(70, 230, 171, 0.22)' : 'rgba(255, 100, 127, 0.2)';
                    ctx.fill();

                    // Token
                    ctx.beginPath();
                    ctx.arc(px, py, 12, 0, Math.PI*2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = idx === 0 ? '#46e6ab' : '#ff647f';
                    ctx.stroke();

                    ctx.fillStyle = idx === 0 ? '#07281d' : '#2c0913';
                    ctx.font = '700 13px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.fillText(idx === 0 ? '★' : '◆', px, py + 4);
                });
            }

            // 4. Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                ctx.fill();
                
                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(draw);
        }

        /** 8. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.7, 300);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('player-hand-container').classList.remove('hidden');
            resize();
            initGame();
            draw();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('pointer-events-none');
            audio.unlock();
            audio.playSFX('start', 0.65, 300);
            audio.playBGM();
            initGame();
        });

        document.getElementById('draw-btn').addEventListener('click', () => {
            if (turn === 0 && gameActive) {
                drawCard(players[0]);
                renderHand();
                audio.playSFX('draw', 0.58, 160);
                showToast("Drew a route card");
                // Rule: Drawing ends turn? Or can play?
                // Uno rule: Draw, if playable play. MVP: Draw ends turn to keep it simple/strategic risk.
                endTurn(); 
            }
        });

    });
    </script>
</body>
