<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>100 Flaps Bird</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --sky-50: #f2fcff;
            --sky-100: #dff7ff;
            --sky-300: #8edcff;
            --sky-500: #4ab6f0;
            --sky-700: #1479b7;
            --bird-yellow: #ffd43b;
            --bird-shadow: #f6a400;
            --beak-orange: #ff7a1a;
            --pipe-green: #1fae55;
            --pipe-dark: #0e7d3c;
            --storm-blue: #374c9a;
            --storm-violet: #6d4acf;
            --cream-100: #fff9f3;
            --ink-900: #24324a;
            --white-glass: rgba(255, 255, 255, 0.52);
            --white-glass-strong: rgba(255, 255, 255, 0.82);
            --white-border: rgba(255, 255, 255, 0.78);
            --shadow-sky: rgba(20, 121, 183, 0.24);
            --shadow-deep: rgba(36, 50, 74, 0.25);
            --gold-300: #ffd66e;
            --gold-500: #ffb703;
            --gold-700: #c97900;
            --green-300: #8af1ba;
            --green-400: #47dc88;
            --green-600: #149f5a;
            --sparkle: rgba(255, 255, 255, 0.68);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at 18% 10%, rgba(255, 246, 179, 0.75), transparent 28%),
                linear-gradient(180deg, var(--sky-300) 0%, #61c5ff 48%, var(--sky-500) 100%);
            color: var(--ink-900);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 246, 179, 0.45), transparent 20%),
                radial-gradient(circle at 78% 14%, rgba(255, 255, 255, 0.38), transparent 16%),
                linear-gradient(180deg, #9ce7ff 0%, #5dc5ff 52%, #38aee9 100%);
            user-select: none;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: '';
            position: absolute;
            inset: auto;
            width: 11rem;
            height: 11rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            filter: blur(6px);
        }

        .game-container::before {
            top: -2rem;
            left: -2rem;
        }

        .game-container::after {
            right: -3rem;
            bottom: 12%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            background:
                radial-gradient(circle at 16% 10%, rgba(255, 244, 179, 0.34), transparent 28%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(223, 247, 255, 0.74));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--white-border);
            box-shadow:
                0 16px 36px 0 var(--shadow-sky),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            border-radius: 24px;
        }

        .card {
            pointer-events: auto;
            transition: 0.3s ease;
            max-width: 22rem;
            width: calc(100% - 2rem);
            margin: 1rem;
            padding: 1.75rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0.6rem;
            border-radius: 18px;
            border: 1px dashed rgba(31, 174, 85, 0.34);
            pointer-events: none;
        }

        .title-icon {
            font-size: 3.75rem;
            margin-bottom: 1rem;
            width: 4.75rem;
            height: 4.75rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 25%, #fff7ba 0 18%, transparent 19%),
                radial-gradient(circle at 52% 52%, var(--bird-yellow), var(--bird-shadow) 78%);
            box-shadow:
                0 10px 22px rgba(255, 183, 3, 0.24),
                inset 0 2px 0 rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .title-icon::before,
        .title-icon::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .title-icon::before {
            right: -0.44rem;
            top: 2.05rem;
            width: 1.15rem;
            height: 0.82rem;
            background: var(--beak-orange);
            clip-path: polygon(0 0, 100% 50%, 0 100%);
            filter: drop-shadow(0 1px 0 rgba(132, 74, 12, 0.35));
        }

        .title-icon::after {
            left: -0.52rem;
            top: 2.15rem;
            width: 1.45rem;
            height: 1.05rem;
            border-radius: 55% 45% 55% 45%;
            background: linear-gradient(135deg, var(--green-300), var(--pipe-green));
            transform: rotate(-18deg);
            box-shadow: inset 0 -2px 0 rgba(14, 125, 60, 0.35);
        }

        .title {
            margin: 0 0 0.5rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: clamp(2.6rem, 8vw, 3.4rem);
            line-height: 0.9;
            color: var(--bird-yellow);
            letter-spacing: 0.06em;
            text-shadow:
                -2px -2px 0 white,
                2px -2px 0 white,
                -2px 2px 0 white,
                2px 2px 0 white,
                0 6px 12px rgba(36, 50, 74, 0.18);
        }

        .subtitle {
            margin: 0 0 1.5rem;
            color: var(--sky-700);
            font-size: 1.1rem;
            font-weight: 600;
            max-width: 16rem;
        }

        .instruction-box {
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(223, 247, 255, 0.88));
            color: var(--ink-900);
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(31, 174, 85, 0.24);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .instruction-box p {
            margin: 0;
        }

        .instruction-box p + p {
            margin-top: 0.35rem;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .btn {
            border: 0;
            color: white;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 120ms ease, filter 120ms ease, border-bottom-width 120ms ease;
            box-shadow: 0 10px 20px rgba(36, 50, 74, 0.2);
            text-shadow: 0 2px 0 rgba(36, 50, 74, 0.24);
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
            border-bottom-width: 0;
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--gold-300), var(--bird-yellow) 42%, var(--bird-shadow));
            border-bottom: 4px solid var(--gold-700);
            padding: 1rem 3rem;
            border-radius: 999px;
            font-size: 1.8rem;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .btn-success {
            background: linear-gradient(180deg, #6df0a1, var(--green-400));
            border-bottom: 4px solid var(--green-600);
            padding: 1rem 2.5rem;
            border-radius: 999px;
            font-size: 1.5rem;
        }

        .btn-success:hover {
            filter: brightness(1.05);
        }

        .hidden {
            display: none !important;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */

        .hud-block {
            display: flex;
            flex-direction: column;
        }

        .hud-block.end {
            align-items: flex-end;
        }

        .hud-label {
            width: fit-content;
            margin-bottom: 0.25rem;
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 4px 12px rgba(93, 47, 123, 0.08);
        }

        .hud-label.progress {
            color: var(--pipe-green);
        }

        .hud-label.time {
            color: var(--storm-blue);
        }

        .hud-value {
            margin: 0;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            line-height: 1;
            text-shadow:
                -1px -1px 0 white,
                1px -1px 0 white,
                -1px 1px 0 white,
                1px 1px 0 white;
        }

        .hud-value.progress {
            font-size: clamp(2.3rem, 7vw, 3.2rem);
            color: var(--bird-shadow);
        }

        .hud-value.time {
            font-size: clamp(2rem, 6vw, 2.7rem);
            color: var(--storm-blue);
        }

        .victory-time {
            margin: 0 0 0.5rem;
            color: var(--sky-700);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .victory-time span {
            color: var(--gold-700);
            font-size: 2.3rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
        }

        .victory-copy {
            margin: 0 0 2rem;
            color: var(--pipe-green);
            font-size: 0.95rem;
            font-weight: 600;
        }

        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce-icon {
            0%, 100% { transform: translateY(-10%); }
            50% { transform: translateY(0); }
        }

        .animate-pulse-scale {
            animation: pulse-scale 1.5s infinite ease-in-out;
        }

        .animate-bounce {
            animation: bounce-icon 1s infinite;
        }

        .reaction-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .reaction-badge,
        .reaction-gif {
            position: absolute;
            z-index: 3;
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            will-change: transform, opacity;
        }

        .reaction-badge {
            left: 50%;
            top: 6.5rem;
            transform: translate(-50%, -0.35rem) scale(0.92);
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 8px 18px rgba(93, 47, 123, 0.16);
            color: var(--pipe-dark);
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .reaction-badge.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        .reaction-gif {
            width: clamp(5.5rem, 18vw, 7.25rem);
            height: clamp(5.5rem, 18vw, 7.25rem);
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 12px 24px rgba(93, 47, 123, 0.18);
            background: rgba(255, 255, 255, 0.32);
            transform: scale(0.82);
        }

        .reaction-gif.show {
            opacity: 0.94;
            transform: scale(1);
        }

        .reaction-gif.hit {
            right: 1rem;
            bottom: 5.75rem;
        }

        .reaction-gif.win {
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%) scale(0.82);
        }

        .reaction-gif.win.show {
            transform: translateX(-50%) scale(1);
        }

        /* [agent-note][stage4] repaired: font-remap | source: removed non-catalog title display refs | replacement: Bangers + Rajdhani from catalogs/fonts.json */
        /* [agent-note][stage3] resolved-gif: hit + win overlays -> catalogs/gifs.json */
        /* [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls */

        @media (max-width: 480px) {
            .card {
                padding: 1.35rem;
            }

            .title-icon {
                width: 4rem;
                height: 4rem;
                font-size: 3rem;
            }

            .title {
                font-size: clamp(2.2rem, 11vw, 3rem);
            }

            .subtitle {
                font-size: 1rem;
            }

            .btn-primary,
            .btn-success {
                width: 100%;
                max-width: 16rem;
                padding-inline: 1.25rem;
            }

            .reaction-badge {
                top: 5.6rem;
                max-width: calc(100vw - 2rem);
                text-overflow: ellipsis;
                overflow: hidden;
            }

            .reaction-gif.hit {
                right: 0.75rem;
                bottom: 5rem;
            }

            .reaction-gif.win {
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel card">
                <div class="title-icon animate-pulse-scale">🐤</div>
                <h1 class="title">100 FLAPS<br>BIRD</h1>
                <p class="subtitle">Train the sky bird with 100 quick wing taps!</p>
                <div class="instruction-box">
                    <p>Tap the bird. Reach 100 wings.</p>
                    <p>New cloud perch after every hit.</p>
                </div>
                <button id="start-btn" class="btn btn-primary">Start</button>
            </div>

            <div id="victory-screen" class="panel card hidden">
                <div class="title-icon animate-bounce">🏅</div>
                <h2 class="title" style="color: var(--gold-500);">Nest Clear!</h2>
                <p class="victory-time">Flight Time: <span id="finalTime">0.0s</span></p>
                <p class="victory-copy">100 wings landed in the golden nest.</p>
                <button id="restart-btn" class="btn btn-success">Try Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-block">
                    <span class="hud-label progress">Wings</span>
                    <p class="hud-value progress"><span id="score">0</span>/100</p>
                </div>
                <div class="hud-block end">
                    <span class="hud-label time">Flight Time</span>
                    <p id="timer" class="hud-value time">0.0s</p>
                </div>
            </div>

            <div class="reaction-layer" aria-hidden="true">
                <div id="reaction-badge" class="reaction-badge">Wing combo!</div>
                <img id="hit-gif" class="reaction-gif hit" alt="Hit reaction effect">
                <img id="win-gif" class="reaction-gif win" alt="Victory reaction effect">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & CONFIG */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/joyful_bgm_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/bgm/triumphant_bgm_01.mp3",
            sfx: {
                tap: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_character_01.mp3",
                victory: "https://gamezone-virid.vercel.app/assets/audios/sfx/triumphant_item_01.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_character_02.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp",
                win: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
            }
        };

        const COLORS = {
            bgTop: '#8EDCFF',
            bgBot: '#4AB6F0',
            star: 'rgba(255, 255, 255, 0.68)',
            cloud: 'rgba(255, 255, 255, 0.82)',
            catBody: '#FFD43B',
            catBodyShade: '#F6A400',
            catEars: '#FF8F1F',
            catInnerEar: '#FFE66D',
            catWhite: '#FFFDFB',
            catEyes: '#24324A',
            catCape: '#4CE36E',
            catCapeDark: '#159947',
            catCheek: '#FFB56B',
            catNose: '#FF7A1A'
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.sfxLimitAt = 0;
                this.bgm = this.createLoop(ASSETS.bgm, 0.2);
                this.victoryLoop = this.createLoop(ASSETS.victoryLoop, 0.24);
                this.sfx = {
                    tap: this.createOneShot(ASSETS.sfx.tap, 0.42),
                    start: this.createOneShot(ASSETS.sfx.start, 0.5),
                    victory: this.createOneShot(ASSETS.sfx.victory, 0.55),
                    restart: this.createOneShot(ASSETS.sfx.restart, 0.45)
                };
            }

            createLoop(src, volume) {
                const audio = new Audio(src);
                audio.loop = true;
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            createOneShot(src, volume) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            unlock() {
                this.enabled = true;
            }

            playLoop(target) {
                if (!this.enabled || !target) return;
                target.play().catch(() => {});
            }

            stopLoop(target, reset = true) {
                if (!target) return;
                target.pause();
                if (reset) target.currentTime = 0;
            }

            playBGM() {
                this.stopLoop(this.victoryLoop);
                this.playLoop(this.bgm);
            }

            playVictoryLoop() {
                this.stopLoop(this.bgm);
                this.playLoop(this.victoryLoop);
            }

            stopAllLoops() {
                this.stopLoop(this.bgm);
                this.stopLoop(this.victoryLoop);
            }

            playTap() {
                const now = performance.now();
                if (!this.enabled || now - this.sfxLimitAt < 55) return;
                this.sfxLimitAt = now;
                const clone = this.sfx.tap.cloneNode();
                clone.volume = this.sfx.tap.volume;
                clone.playbackRate = 0.94 + Math.random() * 0.18;
                clone.play().catch(() => {});
            }

            playCue(name) {
                if (!this.enabled || !this.sfx[name]) return;
                const cue = this.sfx[name];
                cue.currentTime = 0;
                cue.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionBadge = document.getElementById('reaction-badge');
        const hitGif = document.getElementById('hit-gif');
        const winGif = document.getElementById('win-gif');
        hitGif.src = ASSETS.gifs.hit;
        winGif.src = ASSETS.gifs.win;

        let width, height;
        let gameActive = false;
        let score = 0;
        const TARGET_SCORE = 100;
        let startTime = 0;
        let particles = [];
        let badgeTimeout = 0;
        let hitGifTimeout = 0;
        let winGifTimeout = 0;

        let cat = {
            x: 0,
            y: 0,
            radius: 50,
            scale: 1,
            targetScale: 1,
            rotation: 0,
            faceColor: COLORS.catBody
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (cat.x > width || cat.y > height) moveCat();
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. VISUALS */
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.bgTop);
            grad.addColorStop(0.62, '#73D4FF');
            grad.addColorStop(1, COLORS.bgBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.22, height * 0.16, 16, width * 0.22, height * 0.16, width * 0.45);
            glow.addColorStop(0, 'rgba(255, 244, 179, 0.62)');
            glow.addColorStop(1, 'rgba(255, 244, 179, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            const timeOffset = Date.now() * 0.00045;
            const pipeDrift = (Date.now() * 0.018) % 260;
            ctx.save();
            ctx.globalAlpha = 0.52;
            for (let i = -1; i < Math.ceil(width / 260) + 2; i++) {
                const pipeX = i * 260 - pipeDrift;
                const pipeW = 48;
                const topH = height * (0.16 + ((i + 3) % 3) * 0.055);
                const bottomY = height * (0.72 - ((i + 5) % 2) * 0.035);
                ctx.fillStyle = '#1FAE55';
                ctx.fillRect(pipeX, 0, pipeW, topH);
                ctx.fillRect(pipeX - 8, topH - 16, pipeW + 16, 18);
                ctx.fillRect(pipeX, bottomY, pipeW, height - bottomY);
                ctx.fillRect(pipeX - 8, bottomY, pipeW + 16, 18);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
                ctx.fillRect(pipeX + 7, 0, 8, topH);
                ctx.fillRect(pipeX + 7, bottomY, 8, height - bottomY);
            }
            ctx.restore();

            for (let i = 0; i < 10; i++) {
                const puffX = ((i / 9) * width + Math.sin(timeOffset + i) * 22 + (Date.now() * 0.012 * (i % 2 ? 1 : -1))) % (width + 120) - 60;
                const puffY = height * (0.12 + (i % 4) * 0.09);
                ctx.fillStyle = COLORS.cloud;
                ctx.beginPath();
                ctx.arc(puffX, puffY, 28, 0, Math.PI * 2);
                ctx.arc(puffX + 28, puffY + 5, 23, 0, Math.PI * 2);
                ctx.arc(puffX - 26, puffY + 9, 18, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 20; i++) {
                const twinkle = (Date.now() * 0.002 + i) % (Math.PI * 2);
                const x = (i * 97 + Math.sin(timeOffset + i) * 8) % width;
                const y = 44 + ((i * 61) % Math.max(height - 100, 90));
                const radius = 1.2 + (Math.sin(twinkle) + 1) * 1.2;
                ctx.fillStyle = COLORS.star;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCat(c) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(c.scale, c.scale);
            ctx.rotate(c.rotation);

            const bob = Math.sin(Date.now() * 0.012) * 2.5;
            const wingBeat = Math.sin(Date.now() * 0.018) * 0.22;
            ctx.translate(0, bob);

            ctx.fillStyle = 'rgba(36, 50, 74, 0.18)';
            ctx.beginPath();
            ctx.ellipse(0, 72, 44, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catCapeDark;
            ctx.beginPath();
            ctx.ellipse(-35, 5, 21, 34, -0.85 - wingBeat, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catCape;
            ctx.beginPath();
            ctx.ellipse(34, 6, 20, 32, 0.82 + wingBeat, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#0E7D3C';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-50, 0);
            ctx.quadraticCurveTo(-38, 18, -24, 28);
            ctx.moveTo(49, 0);
            ctx.quadraticCurveTo(37, 18, 23, 28);
            ctx.stroke();

            const bodyGradient = ctx.createRadialGradient(-12, -18, 14, 0, 0, 58);
            bodyGradient.addColorStop(0, '#FFF1A8');
            bodyGradient.addColorStop(0.62, c.faceColor);
            bodyGradient.addColorStop(1, COLORS.catBodyShade);
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 50, 48, 0.08, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#8A5A18';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#FFEFA2';
            ctx.beginPath();
            ctx.arc(-18, -13, 13, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.ellipse(20, -12, 14, 16, 0.08, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catEyes;
            ctx.beginPath();
            ctx.ellipse(22, -12, 6, 8.5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(24, -16, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catNose;
            ctx.beginPath();
            ctx.moveTo(44, -2);
            ctx.lineTo(70, 7);
            ctx.lineTo(44, 18);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#A84E12';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = COLORS.catCheek;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.ellipse(19, 13, 9, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = '#FFEBA7';
            ctx.beginPath();
            ctx.ellipse(-7, 20, 22, 15, -0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#8A5A18';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-7, 18, 14, 0.15, Math.PI - 0.15);
            ctx.stroke();

            ctx.strokeStyle = COLORS.catNose;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-12, 44);
            ctx.lineTo(-18, 58);
            ctx.moveTo(12, 44);
            ctx.lineTo(18, 58);
            ctx.stroke();

            ctx.fillStyle = COLORS.catNose;
            ctx.beginPath();
            ctx.ellipse(-20, 60, 9, 4, -0.2, 0, Math.PI * 2);
            ctx.ellipse(20, 60, 9, 4, 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
            ctx.beginPath();
            ctx.ellipse(-15, -25, 11, 6, -0.55, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function flashBadge(message, tone = 'default') {
            reactionBadge.textContent = message;
            reactionBadge.style.color = tone === 'victory' ? 'var(--gold-700)' : 'var(--pipe-dark)';
            reactionBadge.classList.add('show');
            clearTimeout(badgeTimeout);
            badgeTimeout = setTimeout(() => reactionBadge.classList.remove('show'), 900);
        }

        function flashGif(element, timeoutRefName, duration = 1100) {
            element.classList.add('show');
            clearTimeout(timeoutRefName === 'hit' ? hitGifTimeout : winGifTimeout);
            const timer = setTimeout(() => element.classList.remove('show'), duration);
            if (timeoutRefName === 'hit') {
                hitGifTimeout = timer;
            } else {
                winGifTimeout = timer;
            }
        }

        function createParticles(x, y) {
            const colors = ['#FFF7BA', '#FFD43B', '#FF7A1A', '#8AF1BA'];
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 4,
                    life: 1.0,
                    rotation: Math.random() * Math.PI,
                    spin: (Math.random() - 0.5) * 0.28,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                p.size *= 0.95;
                p.rotation += p.spin;

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size * 0.42, p.size, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(36, 50, 74, 0.18)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, -p.size * 0.72);
                ctx.lineTo(0, p.size * 0.72);
                ctx.stroke();
                ctx.restore();

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        /** 5. GAME LOGIC */
        function moveCat() {
            const padding = 80;
            cat.x = padding + Math.random() * (width - padding * 2);
            cat.y = padding + Math.random() * (height - padding * 2);

            cat.scale = 0.5;
            cat.targetScale = 1.0;
            cat.rotation = (Math.random() - 0.5) * 0.5;
        }

        function initGame() {
            score = 0;
            updateHUD();
            particles = [];
            moveCat();
            cat.x = width / 2;
            cat.y = height / 2;
            reactionBadge.classList.remove('show');
            hitGif.classList.remove('show');
            winGif.classList.remove('show');

            startTime = Date.now();
            gameActive = true;
            audio.playBGM();

            requestAnimationFrame(gameLoop);
        }

        function checkClick(inputX, inputY) {
            if (!gameActive) return;

            const dx = inputX - cat.x;
            const dy = inputY - cat.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < cat.radius * 1.5) {
                score++;
                audio.playTap();
                createParticles(cat.x, cat.y);

                if (score === 1) {
                    flashBadge('First flap!');
                } else if (score % 25 === 0) {
                    flashBadge(`Wing combo ${score}!`);
                    flashGif(hitGif, 'hit', 950);
                }

                if (score >= TARGET_SCORE) {
                    winGame();
                } else {
                    moveCat();
                }
                updateHUD();
            }
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
        }

        function updateTimer() {
            if (!gameActive) return;
            const now = Date.now();
            const diff = (now - startTime) / 1000;
            document.getElementById('timer').innerText = diff.toFixed(1) + "s";
        }

        function winGame() {
            gameActive = false;
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('finalTime').innerText = finalTime + "s";

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('victory-screen').classList.remove('hidden');
            flashBadge('Golden nest clear!', 'victory');
            flashGif(winGif, 'win', 2200);
            audio.playCue('victory');
            audio.playVictoryLoop();

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createParticles(width / 2 + (Math.random() - 0.5) * 200, height / 2 + (Math.random() - 0.5) * 200);
                }, i * 100);
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            if (gameActive) {
                cat.scale += (cat.targetScale - cat.scale) * 0.2;
                drawCat(cat);
                updateTimer();
            }

            drawParticles();

            if (gameActive || particles.length > 0) {
                requestAnimationFrame(gameLoop);
            }
        }

        /** 6. INPUTS */
        function handleInput(e) {
            if (e.cancelable) {
                e.preventDefault();
            }
            let x, y;
            if (e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            checkClick(x, y);
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('start');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        const restartBtn = document.getElementById('restart-btn');
        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('restart');
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.playBGM();
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });
    });
    </script>
</body>
</html>
