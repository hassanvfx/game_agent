<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Rick & Morty: Portal Cat Panic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --portal-deep: #071525;
            --portal-mid: #10243f;
            --portal-green: #39ff88;
            --portal-lime: #b7ff36;
            --rick-blue: #8be9ff;
            --morty-yellow: #ffd84a;
            --toxic-violet: #9b5de5;
            --warning-red: #ff4d6d;
            --panel-glass: rgba(7, 21, 37, 0.72);
            --panel-glass-strong: rgba(9, 35, 55, 0.84);
            --panel-border: rgba(57, 255, 136, 0.62);
            --ink-900: #f2fff8;
            --muted-text: #bdeed8;
            --shadow-portal: rgba(57, 255, 136, 0.24);
            --shadow-deep: rgba(2, 9, 18, 0.5);
            --sparkle: rgba(183, 255, 54, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(57, 255, 136, 0.24), transparent 36%),
                linear-gradient(180deg, var(--portal-deep) 0%, var(--portal-mid) 100%);
            color: var(--ink-900);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(circle at 20% 20%, rgba(57, 255, 136, 0.22), transparent 18%),
                radial-gradient(circle at 80% 15%, rgba(139, 233, 255, 0.18), transparent 16%),
                linear-gradient(180deg, var(--portal-deep) 0%, var(--portal-mid) 100%);
            user-select: none;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: '';
            position: absolute;
            inset: auto;
            pointer-events: none;
            z-index: 0;
        }

        .game-container::before {
            top: -5rem;
            left: -4rem;
            width: 18rem;
            height: 18rem;
            border-radius: 50%;
            background:
                repeating-conic-gradient(from 0deg, rgba(57, 255, 136, 0.18) 0 12deg, rgba(183, 255, 54, 0.06) 12deg 24deg),
                radial-gradient(circle, rgba(57, 255, 136, 0.34) 0%, rgba(57, 255, 136, 0) 68%);
            filter: blur(2px);
            animation: portal-drift 11s linear infinite;
        }

        .game-container::after {
            inset: 0;
            background:
                repeating-linear-gradient(0deg, rgba(139, 233, 255, 0.035) 0 1px, transparent 1px 5px),
                linear-gradient(90deg, transparent 0%, rgba(57, 255, 136, 0.04) 48%, rgba(183, 255, 54, 0.07) 50%, rgba(57, 255, 136, 0.04) 52%, transparent 100%);
            opacity: 0.72;
            animation: scanline-drift 8s linear infinite;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            background:
                linear-gradient(180deg, var(--panel-glass-strong), var(--panel-glass));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 16px 36px 0 var(--shadow-portal),
                inset 0 1px 0 rgba(183, 255, 54, 0.24);
            border-radius: 24px;
        }

        .card {
            pointer-events: auto;
            transition: 0.3s ease;
            max-width: 22rem;
            width: calc(100% - 2rem);
            margin: 1rem;
            padding: 1.75rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0.6rem;
            border-radius: 18px;
            border: 1px dashed rgba(57, 255, 136, 0.34);
            pointer-events: none;
        }

        .title-icon {
            position: relative;
            color: transparent;
            font-size: 3.75rem;
            margin-bottom: 1rem;
            width: 4.75rem;
            height: 4.75rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, rgba(242, 255, 248, 0.95) 0 12%, transparent 13%),
                repeating-conic-gradient(from 18deg, rgba(57, 255, 136, 0.95) 0 14deg, rgba(183, 255, 54, 0.75) 14deg 27deg, rgba(6, 16, 25, 0.88) 27deg 35deg),
                radial-gradient(circle at 30% 30%, #d7fff1, var(--portal-green) 58%, #0c6b47 100%);
            box-shadow:
                0 10px 22px rgba(57, 255, 136, 0.34),
                0 0 34px rgba(57, 255, 136, 0.18),
                inset 0 2px 0 rgba(255, 255, 255, 0.45);
        }

        .title-icon::before {
            content: '';
            position: absolute;
            width: 62%;
            height: 62%;
            border: 4px solid rgba(6, 16, 25, 0.88);
            border-top-color: var(--rick-blue);
            border-right-color: var(--morty-yellow);
            border-radius: 50%;
            transform: rotate(-18deg);
        }

        .title-icon::after {
            content: '';
            position: absolute;
            width: 54%;
            height: 20%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(6, 16, 25, 0.92), transparent);
            transform: rotate(-22deg);
            opacity: 0.72;
        }

        .title {
            margin: 0 0 0.5rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: clamp(2.6rem, 8vw, 3.4rem);
            line-height: 0.9;
            color: var(--portal-green);
            letter-spacing: 0.06em;
            text-shadow:
                -2px -2px 0 #041019,
                2px -2px 0 #041019,
                -2px 2px 0 #041019,
                2px 2px 0 #041019,
                0 0 18px rgba(57, 255, 136, 0.42);
        }

        .subtitle {
            margin: 0 0 1.5rem;
            color: var(--muted-text);
            font-size: 1.1rem;
            font-weight: 600;
            max-width: 16rem;
        }

        .instruction-box {
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(14, 44, 66, 0.92), rgba(6, 25, 43, 0.88));
            color: var(--ink-900);
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(57, 255, 136, 0.32);
            box-shadow: inset 0 1px 0 rgba(183, 255, 54, 0.2);
        }

        .instruction-box p {
            margin: 0;
        }

        .instruction-box p + p {
            margin-top: 0.35rem;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .btn {
            border: 0;
            color: white;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 120ms ease, filter 120ms ease, border-bottom-width 120ms ease;
            box-shadow: 0 10px 20px rgba(93, 47, 123, 0.2);
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
            border-bottom-width: 0;
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--portal-lime), var(--portal-green));
            border-bottom: 4px solid #0a8a4e;
            padding: 1rem 3rem;
            border-radius: 999px;
            font-size: 1.8rem;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .btn-success {
            background: linear-gradient(180deg, var(--rick-blue), var(--portal-green));
            border-bottom: 4px solid #0a8a4e;
            padding: 1rem 2.5rem;
            border-radius: 999px;
            font-size: 1.5rem;
        }

        .btn-success:hover {
            filter: brightness(1.05);
        }

        .hidden {
            display: none !important;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */

        .hud-block {
            display: flex;
            flex-direction: column;
        }

        .hud-block.end {
            align-items: flex-end;
        }

        .hud-label {
            width: fit-content;
            margin-bottom: 0.25rem;
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            background: rgba(7, 21, 37, 0.74);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid rgba(57, 255, 136, 0.42);
            box-shadow: 0 4px 12px rgba(2, 9, 18, 0.22);
        }

        .hud-label.progress {
            color: var(--portal-green);
        }

        .hud-label.time {
            color: var(--rick-blue);
        }

        .hud-value {
            margin: 0;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            line-height: 1;
            text-shadow:
                -1px -1px 0 #041019,
                1px -1px 0 #041019,
                -1px 1px 0 #041019,
                1px 1px 0 #041019;
        }

        .hud-value.progress {
            font-size: clamp(2.3rem, 7vw, 3.2rem);
            color: var(--portal-green);
        }

        .hud-value.time {
            font-size: clamp(2rem, 6vw, 2.7rem);
            color: var(--rick-blue);
        }

        .victory-time {
            margin: 0 0 0.5rem;
            color: var(--muted-text);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .victory-time span {
            color: var(--portal-lime);
            font-size: 2.3rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
        }

        .victory-copy {
            margin: 0 0 2rem;
            color: var(--muted-text);
            font-size: 0.95rem;
            font-weight: 600;
        }

        @keyframes portal-drift {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.06); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes scanline-drift {
            0% { background-position: 0 0, -45vw 0; }
            100% { background-position: 0 40px, 45vw 0; }
        }

        @keyframes button-aura {
            0% { transform: translateX(-120%) skewX(-16deg); opacity: 0; }
            35% { opacity: 0.48; }
            70% { opacity: 0; }
            100% { transform: translateX(140%) skewX(-16deg); opacity: 0; }
        }

        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce-icon {
            0%, 100% { transform: translateY(-10%); }
            50% { transform: translateY(0); }
        }

        .animate-pulse-scale {
            animation: pulse-scale 1.5s infinite ease-in-out;
        }

        .animate-bounce {
            animation: bounce-icon 1s infinite;
        }

        .reaction-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .reaction-badge,
        .reaction-gif {
            position: absolute;
            z-index: 3;
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            will-change: transform, opacity;
        }

        .reaction-badge {
            left: 50%;
            top: 6.5rem;
            transform: translate(-50%, -0.35rem) scale(0.92);
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(7, 21, 37, 0.9);
            border: 1px solid rgba(57, 255, 136, 0.72);
            box-shadow: 0 8px 18px rgba(57, 255, 136, 0.18);
            color: var(--portal-lime);
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .reaction-badge.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        .reaction-gif {
            width: clamp(5.5rem, 18vw, 7.25rem);
            height: clamp(5.5rem, 18vw, 7.25rem);
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 12px 24px rgba(93, 47, 123, 0.18);
            background: rgba(255, 255, 255, 0.32);
            transform: scale(0.82);
        }

        .reaction-gif.show {
            opacity: 0.94;
            transform: scale(1);
        }

        .reaction-gif.hit {
            right: 1rem;
            bottom: 5.75rem;
        }

        .reaction-gif.win {
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%) scale(0.82);
        }

        .reaction-gif.win.show {
            transform: translateX(-50%) scale(1);
        }

        .btn-primary,
        .btn-success {
            position: relative;
            overflow: hidden;
            text-shadow: 0 2px 0 rgba(6, 16, 25, 0.28);
        }

        .btn-primary::after,
        .btn-success::after {
            content: '';
            position: absolute;
            inset: -30% auto -30% 0;
            width: 42%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
            animation: button-aura 3.6s ease-in-out infinite;
            pointer-events: none;
        }

        .hud {
            z-index: 2;
        }

        .ui-layer {
            z-index: 1;
        }

        /* [agent-note][stage4] repaired: font-remap | source: removed non-catalog title display refs | replacement: Bangers + Rajdhani from catalogs/fonts.json */
        /* [agent-note][stage3] resolved-gif: hit + win overlays -> catalogs/gifs.json */
        /* [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls */

        @media (max-width: 480px) {
            .card {
                padding: 1.35rem;
            }

            .title-icon {
                width: 4rem;
                height: 4rem;
                font-size: 3rem;
            }

            .title {
                font-size: clamp(2.2rem, 11vw, 3rem);
            }

            .subtitle {
                font-size: 1rem;
            }

            .btn-primary,
            .btn-success {
                width: 100%;
                max-width: 16rem;
                padding-inline: 1.25rem;
            }

            .reaction-badge {
                top: 5.6rem;
                max-width: calc(100vw - 2rem);
                text-overflow: ellipsis;
                overflow: hidden;
            }

            .reaction-gif.hit {
                right: 0.75rem;
                bottom: 5rem;
            }

            .reaction-gif.win {
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel card">
                <div class="title-icon animate-pulse-scale">🌀</div>
                <h1 class="title">PORTAL CAT<br>PANIC</h1>
                <p class="subtitle">Rick needs 100 portal charges, fast.</p>
                <div class="instruction-box">
                    <p>Tap the portal-cat as fast as you can.</p>
                    <p>It jumps dimensions every time you touch it!</p>
                </div>
                <button id="start-btn" class="btn btn-primary">Start Portal</button>
            </div>

            <div id="victory-screen" class="panel card hidden">
                <div class="title-icon animate-bounce">✅</div>
                <h2 class="title" style="color: var(--rick-blue);">Portal Stable!</h2>
                <p class="victory-time">Timeline Time: <span id="finalTime">0.0s</span></p>
                <p class="victory-copy">You charged the portal-cat beacon 100 times!</p>
                <button id="restart-btn" class="btn btn-success">Recalibrate</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-block">
                    <span class="hud-label progress">Portal Charge</span>
                    <p class="hud-value progress"><span id="score">0</span>/100</p>
                </div>
                <div class="hud-block end">
                    <span class="hud-label time">Timeline Time</span>
                    <p id="timer" class="hud-value time">0.0s</p>
                </div>
            </div>

            <div class="reaction-layer" aria-hidden="true">
                <div id="reaction-badge" class="reaction-badge">Portal combo!</div>
                <img id="hit-gif" class="reaction-gif hit" alt="Hit reaction effect">
                <img id="win-gif" class="reaction-gif win" alt="Victory reaction effect">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & CONFIG */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_02.mp3",
            sfx: {
                tap: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3",
                victory: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_02.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_02.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp",
                win: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
            }
        };

        const COLORS = {
            bgTop: '#071525',
            bgBot: '#10243F',
            portalGreen: '#39FF88',
            portalLime: '#B7FF36',
            rickBlue: '#8BE9FF',
            mortyYellow: '#FFD84A',
            toxicViolet: '#9B5DE5',
            warningRed: '#FF4D6D',
            star: 'rgba(183, 255, 54, 0.58)',
            cloud: 'rgba(57, 255, 136, 0.13)',
            catBody: '#FFD84A',
            catBodyShade: '#F0A92F',
            catEars: '#2C9F7A',
            catInnerEar: '#8BE9FF',
            catWhite: '#F2FFF8',
            catEyes: '#061019',
            catCape: '#39FF88',
            catCapeDark: '#0B8F55',
            catCheek: '#8BE9FF',
            catNose: '#FF4D6D'
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.sfxLimitAt = 0;
                this.bgm = this.createLoop(ASSETS.bgm, 0.2);
                this.victoryLoop = this.createLoop(ASSETS.victoryLoop, 0.24);
                this.sfx = {
                    tap: this.createOneShot(ASSETS.sfx.tap, 0.42),
                    start: this.createOneShot(ASSETS.sfx.start, 0.5),
                    victory: this.createOneShot(ASSETS.sfx.victory, 0.55),
                    restart: this.createOneShot(ASSETS.sfx.restart, 0.45)
                };
            }

            createLoop(src, volume) {
                const audio = new Audio(src);
                audio.loop = true;
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            createOneShot(src, volume) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            unlock() {
                this.enabled = true;
            }

            playLoop(target) {
                if (!this.enabled || !target) return;
                target.play().catch(() => {});
            }

            stopLoop(target, reset = true) {
                if (!target) return;
                target.pause();
                if (reset) target.currentTime = 0;
            }

            playBGM() {
                this.stopLoop(this.victoryLoop);
                this.playLoop(this.bgm);
            }

            playVictoryLoop() {
                this.stopLoop(this.bgm);
                this.playLoop(this.victoryLoop);
            }

            stopAllLoops() {
                this.stopLoop(this.bgm);
                this.stopLoop(this.victoryLoop);
            }

            playTap() {
                const now = performance.now();
                if (!this.enabled || now - this.sfxLimitAt < 55) return;
                this.sfxLimitAt = now;
                const clone = this.sfx.tap.cloneNode();
                clone.volume = this.sfx.tap.volume;
                clone.playbackRate = 0.94 + Math.random() * 0.18;
                clone.play().catch(() => {});
            }

            playCue(name) {
                if (!this.enabled || !this.sfx[name]) return;
                const cue = this.sfx[name];
                cue.currentTime = 0;
                cue.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionBadge = document.getElementById('reaction-badge');
        const hitGif = document.getElementById('hit-gif');
        const winGif = document.getElementById('win-gif');
        hitGif.src = ASSETS.gifs.hit;
        winGif.src = ASSETS.gifs.win;

        let width, height;
        let gameActive = false;
        let score = 0;
        const TARGET_SCORE = 100;
        let startTime = 0;
        let particles = [];
        let badgeTimeout = 0;
        let hitGifTimeout = 0;
        let winGifTimeout = 0;

        let cat = {
            x: 0,
            y: 0,
            radius: 50,
            scale: 1,
            targetScale: 1,
            rotation: 0,
            faceColor: COLORS.catBody
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (cat.x > width || cat.y > height) moveCat();
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. VISUALS */
        function getVisualPhase() {
            if (score >= 100) return 4;
            if (score >= 75) return 3;
            if (score >= 50) return 2;
            if (score >= 25) return 1;
            return 0;
        }

        function drawBackground() {
            const phase = getVisualPhase();
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, phase >= 3 ? '#090b22' : COLORS.bgTop);
            grad.addColorStop(0.58, phase >= 2 ? '#10243F' : '#0B1D35');
            grad.addColorStop(1, phase >= 3 ? '#221534' : COLORS.bgBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const now = Date.now();
            const timeOffset = now * 0.0009;
            const portalX = width * (phase >= 4 ? 0.5 : 0.5 + Math.sin(timeOffset * 0.7) * 0.035);
            const portalY = height * (phase >= 2 ? 0.25 : 0.22);
            const portalRadius = Math.min(width, height) * (0.28 + phase * 0.025);

            const glow = ctx.createRadialGradient(portalX, portalY, 20, portalX, portalY, portalRadius * (1.85 + phase * 0.18));
            glow.addColorStop(0, phase >= 3 ? 'rgba(155, 93, 229, 0.36)' : 'rgba(57, 255, 136, 0.44)');
            glow.addColorStop(0.24, 'rgba(183, 255, 54, 0.2)');
            glow.addColorStop(0.48, phase >= 1 ? 'rgba(139, 233, 255, 0.13)' : 'rgba(57, 255, 136, 0.08)');
            glow.addColorStop(1, 'rgba(57, 255, 136, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(portalX, portalY);
            ctx.rotate(timeOffset * (0.8 + phase * 0.16));
            for (let ring = 0; ring < 6; ring++) {
                ctx.strokeStyle = ring % 2 === 0 ? 'rgba(57, 255, 136, 0.36)' : (phase >= 3 ? 'rgba(155, 93, 229, 0.28)' : 'rgba(139, 233, 255, 0.25)');
                ctx.lineWidth = ring === 0 ? 4 : 2.2;
                ctx.setLineDash(ring % 2 ? [10, 12] : []);
                ctx.beginPath();
                ctx.ellipse(0, 0, portalRadius * (0.32 + ring * 0.12), portalRadius * (0.16 + ring * 0.07), ring * 0.22, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.setLineDash([]);
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = 0.38;
            ctx.strokeStyle = 'rgba(139, 233, 255, 0.22)';
            ctx.lineWidth = 1;
            for (let x = -40; x < width + 80; x += 46) {
                const drift = Math.sin(timeOffset + x * 0.01) * 8;
                ctx.beginPath();
                ctx.moveTo(x + drift, height * 0.54);
                ctx.lineTo(x + 22 + drift, height);
                ctx.stroke();
            }
            ctx.restore();

            if (phase >= 1) {
                ctx.fillStyle = 'rgba(139, 233, 255, 0.12)';
                for (let i = 0; i < 9; i++) {
                    const panelX = (i * 137 + Math.sin(timeOffset + i) * 12 + now * 0.018) % (width + 110) - 55;
                    const panelY = height * 0.32 + (i % 3) * 58;
                    ctx.fillRect(panelX, panelY, 58, 34);
                    ctx.strokeStyle = i % 2 ? 'rgba(255, 216, 74, 0.18)' : 'rgba(57, 255, 136, 0.2)';
                    ctx.strokeRect(panelX, panelY, 58, 34);
                    ctx.fillStyle = 'rgba(6, 16, 25, 0.18)';
                    ctx.fillRect(panelX + 5, panelY + 6, 48, 3);
                    ctx.fillStyle = 'rgba(139, 233, 255, 0.12)';
                }
            }

            if (phase >= 2) {
                ctx.save();
                ctx.fillStyle = 'rgba(6, 16, 25, 0.42)';
                const baseY = height * 0.74;
                for (let i = 0; i < 8; i++) {
                    const bx = (i * 79 + Math.sin(timeOffset * 0.6) * 10) % (width + 100) - 40;
                    const bh = 48 + (i % 4) * 24;
                    ctx.fillRect(bx, baseY - bh, 28 + (i % 3) * 10, bh);
                    ctx.beginPath();
                    ctx.arc(bx + 14, baseY - bh - 8, 15, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.strokeStyle = 'rgba(57, 255, 136, 0.16)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const tx = (i * 112 + now * 0.02) % (width + 80) - 40;
                    ctx.beginPath();
                    ctx.arc(tx, baseY - 70 - (i % 2) * 34, 14, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            if (phase >= 3) {
                ctx.save();
                ctx.globalAlpha = 0.22;
                for (let i = 0; i < 12; i++) {
                    const fogY = height * 0.58 + Math.sin(timeOffset * 2 + i) * 30 + i * 11;
                    const fog = ctx.createRadialGradient(width * ((i * 0.23) % 1), fogY, 6, width * ((i * 0.23) % 1), fogY, 95);
                    fog.addColorStop(0, 'rgba(155, 93, 229, 0.52)');
                    fog.addColorStop(1, 'rgba(155, 93, 229, 0)');
                    ctx.fillStyle = fog;
                    ctx.fillRect(0, 0, width, height);
                }
                ctx.globalAlpha = 1;
                ctx.fillStyle = 'rgba(255, 77, 109, 0.12)';
                for (let y = height * 0.18; y < height; y += 120) {
                    ctx.fillRect(0, y, width, 5);
                }
                ctx.restore();
            }

            ctx.font = '600 16px Rajdhani, sans-serif';
            ctx.fillStyle = 'rgba(183, 255, 54, 0.22)';
            const equations = phase >= 3 ? ['CRONEN', 'SERUM+', 'Ω-137', 'NO FAIL', 'BURP'] : ['C-137', 'WUBBA', 'DIM+', '∑ PORTAL', 'MEGA'];
            equations.forEach((label, i) => {
                const x = (i * 173 + now * 0.018) % (width + 120) - 60;
                const y = 96 + ((i * 71) % Math.max(height - 180, 120));
                ctx.fillText(label, x, y);
            });

            for (let i = 0; i < 32; i++) {
                const twinkle = (now * 0.002 + i) % (Math.PI * 2);
                const x = (i * 83 + (phase >= 4 ? Math.sin(twinkle) * 10 : 0)) % width;
                const y = 40 + ((i * 57) % Math.max(height - 80, 80));
                const radius = 1.5 + (Math.sin(twinkle) + 1) * (1.4 + phase * 0.16);
                ctx.fillStyle = i % 4 === 0 ? COLORS.rickBlue : (i % 5 === 0 ? COLORS.mortyYellow : COLORS.star);
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCat(c) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(c.scale, c.scale);
            ctx.rotate(c.rotation);

            const bob = Math.sin(Date.now() * 0.012) * 2.5;
            ctx.translate(0, bob);

            ctx.fillStyle = 'rgba(57, 255, 136, 0.24)';
            ctx.beginPath();
            ctx.ellipse(0, 74, 42, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = COLORS.portalGreen;
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.arc(0, 10, 62, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(183, 255, 54, 0.55)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 10, 74, 34, -0.35, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = COLORS.catCape;
            ctx.beginPath();
            ctx.moveTo(-38, 0);
            ctx.quadraticCurveTo(0, 64, 38, 0);
            ctx.quadraticCurveTo(10, 16, -38, 0);
            ctx.fill();

            ctx.fillStyle = COLORS.catCapeDark;
            ctx.beginPath();
            ctx.moveTo(-18, 10);
            ctx.quadraticCurveTo(0, 48, 18, 10);
            ctx.quadraticCurveTo(0, 24, -18, 10);
            ctx.fill();

            ctx.fillStyle = COLORS.catEars;
            ctx.beginPath();
            ctx.moveTo(-35, -26);
            ctx.lineTo(-50, -58);
            ctx.lineTo(-15, -44);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(35, -26);
            ctx.lineTo(50, -58);
            ctx.lineTo(15, -44);
            ctx.fill();

            ctx.fillStyle = COLORS.catInnerEar;
            ctx.beginPath();
            ctx.moveTo(-32, -31);
            ctx.lineTo(-40, -48);
            ctx.lineTo(-21, -40);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(32, -31);
            ctx.lineTo(40, -48);
            ctx.lineTo(21, -40);
            ctx.fill();

            const furGradient = ctx.createRadialGradient(-8, -16, 16, 0, 0, 56);
            furGradient.addColorStop(0, '#FFF1A3');
            furGradient.addColorStop(0.6, c.faceColor);
            furGradient.addColorStop(1, COLORS.catBodyShade);
            ctx.fillStyle = furGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#061019';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = COLORS.rickBlue;
            ctx.beginPath();
            ctx.moveTo(-30, -42);
            ctx.lineTo(-18, -68);
            ctx.lineTo(-8, -44);
            ctx.lineTo(4, -72);
            ctx.lineTo(14, -44);
            ctx.lineTo(30, -64);
            ctx.lineTo(24, -36);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#061019';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = COLORS.catWhite;
            ctx.beginPath();
            ctx.ellipse(-20, -8, 10, 12, -0.12, 0, Math.PI * 2);
            ctx.ellipse(20, -8, 10, 12, 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catEyes;
            ctx.beginPath();
            ctx.ellipse(-20, -8, 4.4, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(20, -8, 4.4, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-18, -11, 1.4, 0, Math.PI * 2);
            ctx.arc(22, -11, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catCheek;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.ellipse(-25, 12, 9, 5, 0, 0, Math.PI * 2);
            ctx.ellipse(25, 12, 9, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = COLORS.catWhite;
            ctx.beginPath();
            ctx.ellipse(0, 18, 18, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catNose;
            ctx.beginPath();
            ctx.moveTo(-5, 8);
            ctx.lineTo(5, 8);
            ctx.lineTo(0, 15);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, 15);
            ctx.lineTo(-6, 21);
            ctx.moveTo(0, 15);
            ctx.lineTo(6, 21);
            ctx.strokeStyle = '#061019';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = '#061019';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-30, 7); ctx.lineTo(-60, 2);
            ctx.moveTo(-30, 12); ctx.lineTo(-60, 12);
            ctx.moveTo(-30, 17); ctx.lineTo(-60, 22);
            ctx.moveTo(30, 7); ctx.lineTo(60, 2);
            ctx.moveTo(30, 12); ctx.lineTo(60, 12);
            ctx.moveTo(30, 17); ctx.lineTo(60, 22);
            ctx.stroke();

            ctx.fillStyle = COLORS.mortyYellow;
            ctx.strokeStyle = '#061019';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(-13, 30, 26, 18, 5);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#061019';
            ctx.font = '700 10px Rajdhani, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('C-137', 0, 43);

            ctx.strokeStyle = 'rgba(57, 255, 136, 0.84)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(34, 28, 8, 0, Math.PI * 2);
            ctx.moveTo(42, 28);
            ctx.lineTo(52, 24);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.ellipse(-12, -24, 10, 6, -0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function flashBadge(message, tone = 'default') {
            reactionBadge.textContent = message;
            reactionBadge.style.color = tone === 'victory' ? 'var(--portal-lime)' : 'var(--portal-green)';
            reactionBadge.classList.add('show');
            clearTimeout(badgeTimeout);
            badgeTimeout = setTimeout(() => reactionBadge.classList.remove('show'), 900);
        }

        function flashGif(element, timeoutRefName, duration = 1100) {
            element.classList.add('show');
            clearTimeout(timeoutRefName === 'hit' ? hitGifTimeout : winGifTimeout);
            const timer = setTimeout(() => element.classList.remove('show'), duration);
            if (timeoutRefName === 'hit') {
                hitGifTimeout = timer;
            } else {
                winGifTimeout = timer;
            }
        }

        function createParticles(x, y) {
            const colors = ['#F2FFF8', '#B7FF36', '#39FF88', '#8BE9FF', '#9B5DE5'];
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 4,
                    life: 1.0,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                p.size *= 0.95;

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        /** 5. GAME LOGIC */
        function moveCat() {
            const padding = 80;
            cat.x = padding + Math.random() * (width - padding * 2);
            cat.y = padding + Math.random() * (height - padding * 2);

            cat.scale = 0.5;
            cat.targetScale = 1.0;
            cat.rotation = (Math.random() - 0.5) * 0.5;
        }

        function initGame() {
            score = 0;
            updateHUD();
            particles = [];
            moveCat();
            cat.x = width / 2;
            cat.y = height / 2;
            reactionBadge.classList.remove('show');
            hitGif.classList.remove('show');
            winGif.classList.remove('show');

            startTime = Date.now();
            gameActive = true;
            audio.playBGM();

            requestAnimationFrame(gameLoop);
        }

        function checkClick(inputX, inputY) {
            if (!gameActive) return;

            const dx = inputX - cat.x;
            const dy = inputY - cat.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < cat.radius * 1.5) {
                score++;
                audio.playTap();
                createParticles(cat.x, cat.y);

                if (score === 1) {
                    flashBadge('Portal-cat locked!');
                } else if (score % 25 === 0) {
                    flashBadge(`Portal charge ${score}!`);
                    flashGif(hitGif, 'hit', 950);
                }

                if (score >= TARGET_SCORE) {
                    winGame();
                } else {
                    moveCat();
                }
                updateHUD();
            }
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;

            const progressLabel = document.querySelector('.hud-label.progress');
            const timeLabel = document.querySelector('.hud-label.time');
            if (!progressLabel || !timeLabel) return;

            if (score >= 100) {
                progressLabel.textContent = 'Final Portal Lock';
                timeLabel.textContent = 'Escape Time';
            } else if (score >= 75) {
                progressLabel.textContent = 'Containment Charge';
                timeLabel.textContent = 'Mutation Time';
            } else if (score >= 50) {
                progressLabel.textContent = 'Citadel Clearance';
                timeLabel.textContent = 'Timeline Time';
            } else if (score >= 25) {
                progressLabel.textContent = 'Signal Lock';
                timeLabel.textContent = 'Timeline Time';
            } else {
                progressLabel.textContent = 'Portal Charge';
                timeLabel.textContent = 'Timeline Time';
            }
        }

        function updateTimer() {
            if (!gameActive) return;
            const now = Date.now();
            const diff = (now - startTime) / 1000;
            document.getElementById('timer').innerText = diff.toFixed(1) + "s";
        }

        function winGame() {
            gameActive = false;
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('finalTime').innerText = finalTime + "s";

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('victory-screen').classList.remove('hidden');
            flashBadge('Dimension stabilized!', 'victory');
            flashGif(winGif, 'win', 2200);
            audio.playCue('victory');
            audio.playVictoryLoop();

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createParticles(width / 2 + (Math.random() - 0.5) * 200, height / 2 + (Math.random() - 0.5) * 200);
                }, i * 100);
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            if (gameActive) {
                cat.scale += (cat.targetScale - cat.scale) * 0.2;
                drawCat(cat);
                updateTimer();
            }

            drawParticles();

            if (gameActive || particles.length > 0) {
                requestAnimationFrame(gameLoop);
            }
        }

        /** 6. INPUTS */
        function handleInput(e) {
            e.preventDefault();
            let x, y;
            if (e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            checkClick(x, y);
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('start');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        const restartBtn = document.getElementById('restart-btn');
        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('restart');
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.playBGM();
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });
    });
    </script>
</body>
