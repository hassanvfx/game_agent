<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>100 Clicks Cat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --pink-50: #fff8e6;
            --pink-100: #f8e7bd;
            --pink-200: #ebcf8a;
            --pink-400: #d6a43a;
            --pink-500: #b8871f;
            --pink-600: #7b4f16;
            --pink-700: #4b2d11;
            --purple-500: #5e4bb6;
            --purple-600: #2f225f;
            --cream-100: #fff6dc;
            --ink-900: #20122f;
            --white-glass: rgba(255, 246, 220, 0.52);
            --white-glass-strong: rgba(255, 246, 220, 0.78);
            --white-border: rgba(255, 216, 111, 0.72);
            --shadow-pink: rgba(181, 126, 33, 0.26);
            --shadow-deep: rgba(24, 14, 54, 0.34);
            --gold-300: #ffd66e;
            --gold-500: #ffb703;
            --green-300: #8af1ba;
            --green-400: #2fd37c;
            --green-600: #12834d;
            --sparkle: rgba(255, 245, 188, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 230, 141, 0.38), transparent 35%),
                linear-gradient(180deg, #17102f 0%, #2f225f 48%, #55331a 100%);
            color: var(--ink-900);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 214, 110, 0.24), transparent 18%),
                radial-gradient(circle at 80% 15%, rgba(120, 93, 214, 0.24), transparent 16%),
                repeating-linear-gradient(90deg, rgba(255, 214, 110, 0.035) 0 1px, transparent 1px 58px),
                linear-gradient(180deg, #17102f 0%, #2f225f 54%, #5a351f 100%);
            user-select: none;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: '';
            position: absolute;
            inset: auto;
            width: 11rem;
            height: 11rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            filter: blur(6px);
        }

        .game-container::before {
            top: -2rem;
            left: -2rem;
        }

        .game-container::after {
            right: -3rem;
            bottom: 12%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 214, 110, 0.22), transparent 34%),
                linear-gradient(180deg, rgba(255, 246, 220, 0.9), rgba(248, 231, 189, 0.78));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--white-border);
            box-shadow:
                0 16px 36px 0 var(--shadow-deep),
                0 0 28px rgba(255, 214, 110, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            border-radius: 24px;
        }

        .card {
            pointer-events: auto;
            transition: 0.3s ease;
            max-width: 22rem;
            width: calc(100% - 2rem);
            margin: 1rem;
            padding: 1.75rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0.6rem;
            border-radius: 18px;
            border: 1px dashed rgba(255, 214, 110, 0.42);
            pointer-events: none;
        }

        .title-icon {
            font-size: 3.75rem;
            margin-bottom: 1rem;
            width: 4.75rem;
            height: 4.75rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff8df, #ffd66e 68%, #5e4bb6 100%);
            box-shadow:
                0 10px 22px rgba(255, 91, 154, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.8);
        }

        .title {
            margin: 0 0 0.5rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: clamp(2.6rem, 8vw, 3.4rem);
            line-height: 0.9;
            color: var(--pink-500);
            letter-spacing: 0.06em;
            text-shadow:
                -2px -2px 0 white,
                2px -2px 0 white,
                -2px 2px 0 white,
                2px 2px 0 white,
                0 6px 12px rgba(255, 255, 255, 0.25);
        }

        .subtitle {
            margin: 0 0 1.5rem;
            color: var(--pink-600);
            font-size: 1.1rem;
            font-weight: 600;
            max-width: 16rem;
        }

        .instruction-box {
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 16px;
            background:
                radial-gradient(circle at 12% 20%, rgba(94, 75, 182, 0.12), transparent 28%),
                linear-gradient(180deg, rgba(255, 250, 235, 0.96), rgba(248, 231, 189, 0.9));
            color: var(--pink-700);
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(184, 135, 31, 0.32);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .instruction-box p {
            margin: 0;
        }

        .instruction-box p + p {
            margin-top: 0.35rem;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .btn {
            border: 0;
            color: white;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 120ms ease, filter 120ms ease, border-bottom-width 120ms ease;
            box-shadow: 0 10px 20px rgba(93, 47, 123, 0.2);
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
            border-bottom-width: 0;
        }

        .btn-primary {
            background: linear-gradient(180deg, #ffd66e, var(--pink-500));
            border-bottom: 4px solid var(--pink-700);
            padding: 1rem 3rem;
            border-radius: 999px;
            font-size: 1.8rem;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .btn-success {
            background: linear-gradient(180deg, #6df0a1, var(--green-400));
            border-bottom: 4px solid var(--green-600);
            padding: 1rem 2.5rem;
            border-radius: 999px;
            font-size: 1.5rem;
        }

        .btn-success:hover {
            filter: brightness(1.05);
        }

        .hidden {
            display: none !important;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */

        .hud-block {
            display: flex;
            flex-direction: column;
        }

        .hud-block.end {
            align-items: flex-end;
        }

        .hud-label {
            width: fit-content;
            margin-bottom: 0.25rem;
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 4px 12px rgba(93, 47, 123, 0.08);
        }

        .hud-label.progress {
            color: var(--pink-500);
        }

        .hud-label.time {
            color: var(--purple-500);
        }

        .hud-value {
            margin: 0;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            line-height: 1;
            text-shadow:
                -1px -1px 0 white,
                1px -1px 0 white,
                -1px 1px 0 white,
                1px 1px 0 white;
        }

        .hud-value.progress {
            font-size: clamp(2.3rem, 7vw, 3.2rem);
            color: var(--pink-500);
        }

        .hud-value.time {
            font-size: clamp(2rem, 6vw, 2.7rem);
            color: var(--purple-500);
        }

        .victory-time {
            margin: 0 0 0.5rem;
            color: var(--pink-600);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .victory-time span {
            color: var(--purple-600);
            font-size: 2.3rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
        }

        .victory-copy {
            margin: 0 0 2rem;
            color: var(--pink-500);
            font-size: 0.95rem;
            font-weight: 600;
        }

        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce-icon {
            0%, 100% { transform: translateY(-10%); }
            50% { transform: translateY(0); }
        }

        .animate-pulse-scale {
            animation: pulse-scale 1.5s infinite ease-in-out;
        }

        .animate-bounce {
            animation: bounce-icon 1s infinite;
        }

        .reaction-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .reaction-badge,
        .reaction-gif {
            position: absolute;
            z-index: 3;
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            will-change: transform, opacity;
        }

        .reaction-badge {
            left: 50%;
            top: 6.5rem;
            transform: translate(-50%, -0.35rem) scale(0.92);
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 8px 18px rgba(93, 47, 123, 0.16);
            color: var(--pink-700);
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .reaction-badge.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        .reaction-gif {
            width: clamp(5.5rem, 18vw, 7.25rem);
            height: clamp(5.5rem, 18vw, 7.25rem);
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 12px 24px rgba(93, 47, 123, 0.18);
            background: rgba(255, 255, 255, 0.32);
            transform: scale(0.82);
        }

        .reaction-gif.show {
            opacity: 0.94;
            transform: scale(1);
        }

        .reaction-gif.hit {
            right: 1rem;
            bottom: 5.75rem;
        }

        .reaction-gif.win {
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%) scale(0.82);
        }

        .reaction-gif.win.show {
            transform: translateX(-50%) scale(1);
        }

        /* [agent-note][stage4] repaired: font-remap | source: removed non-catalog title display refs | replacement: Bangers + Rajdhani from catalogs/fonts.json */
        /* [agent-note][stage3] resolved-gif: hit + win overlays -> catalogs/gifs.json */
        /* [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls */

        @media (max-width: 480px) {
            .card {
                padding: 1.35rem;
            }

            .title-icon {
                width: 4rem;
                height: 4rem;
                font-size: 3rem;
            }

            .title {
                font-size: clamp(2.2rem, 11vw, 3rem);
            }

            .subtitle {
                font-size: 1rem;
            }

            .btn-primary,
            .btn-success {
                width: 100%;
                max-width: 16rem;
                padding-inline: 1.25rem;
            }

            .reaction-badge {
                top: 5.6rem;
                max-width: calc(100vw - 2rem);
                text-overflow: ellipsis;
                overflow: hidden;
            }

            .reaction-gif.hit {
                right: 0.75rem;
                bottom: 5rem;
            }

            .reaction-gif.win {
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel card">
                <div class="title-icon animate-pulse-scale">🪄</div>
                <h1 class="title">100 CHARMS<br>AT HOGWARTS</h1>
                <p class="subtitle">Cast on the enchanted cat familiar 100 times!</p>
                <div class="instruction-box">
                    <p>Tap the familiar to cast each charm.</p>
                    <p>It apparates every time your spell lands!</p>
                </div>
                <button id="start-btn" class="btn btn-primary">Start Practice</button>
            </div>

            <div id="victory-screen" class="panel card hidden">
                <div class="title-icon animate-bounce">🏰</div>
                <h2 class="title" style="color: var(--purple-500);">Spellwork Complete!</h2>
                <p class="victory-time">Time: <span id="finalTime">0.0s</span></p>
                <p class="victory-copy">You landed all 100 charms on the familiar!</p>
                <button id="restart-btn" class="btn btn-success">Practice Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-block">
                    <span class="hud-label progress">Charms</span>
                    <p class="hud-value progress"><span id="score">0</span>/100</p>
                </div>
                <div class="hud-block end">
                    <span class="hud-label time">Time</span>
                    <p id="timer" class="hud-value time">0.0s</p>
                </div>
            </div>

            <div class="reaction-layer" aria-hidden="true">
                <div id="reaction-badge" class="reaction-badge">Charm streak!</div>
                <img id="hit-gif" class="reaction-gif hit" alt="Hit reaction effect">
                <img id="win-gif" class="reaction-gif win" alt="Victory reaction effect">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & CONFIG */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/mystical_bgm_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/bgm/mystical_bgm_02.mp3",
            sfx: {
                tap: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_npc_01.mp3",
                victory: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_02.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_npc_02.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp",
                win: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
            }
        };

        const COLORS = {
            bgTop: '#17102F',
            bgBot: '#5A351F',
            star: 'rgba(255, 230, 141, 0.68)',
            cloud: 'rgba(255, 214, 110, 0.22)',
            catBody: '#FFC857',
            catBodyShade: '#D68A22',
            catEars: '#B86B2D',
            catInnerEar: '#F8D9A6',
            catWhite: '#FFF8DF',
            catEyes: '#18102A',
            catCape: '#5E4BB6',
            catCapeDark: '#2F225F',
            catCheek: '#E8A248',
            catNose: '#7B4F16'
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.sfxLimitAt = 0;
                this.bgm = this.createLoop(ASSETS.bgm, 0.2);
                this.victoryLoop = this.createLoop(ASSETS.victoryLoop, 0.24);
                this.sfx = {
                    tap: this.createOneShot(ASSETS.sfx.tap, 0.42),
                    start: this.createOneShot(ASSETS.sfx.start, 0.5),
                    victory: this.createOneShot(ASSETS.sfx.victory, 0.55),
                    restart: this.createOneShot(ASSETS.sfx.restart, 0.45)
                };
            }

            createLoop(src, volume) {
                const audio = new Audio(src);
                audio.loop = true;
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            createOneShot(src, volume) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            unlock() {
                this.enabled = true;
            }

            playLoop(target) {
                if (!this.enabled || !target) return;
                target.play().catch(() => {});
            }

            stopLoop(target, reset = true) {
                if (!target) return;
                target.pause();
                if (reset) target.currentTime = 0;
            }

            playBGM() {
                this.stopLoop(this.victoryLoop);
                this.playLoop(this.bgm);
            }

            playVictoryLoop() {
                this.stopLoop(this.bgm);
                this.playLoop(this.victoryLoop);
            }

            stopAllLoops() {
                this.stopLoop(this.bgm);
                this.stopLoop(this.victoryLoop);
            }

            playTap() {
                const now = performance.now();
                if (!this.enabled || now - this.sfxLimitAt < 55) return;
                this.sfxLimitAt = now;
                const clone = this.sfx.tap.cloneNode();
                clone.volume = this.sfx.tap.volume;
                clone.playbackRate = 0.94 + Math.random() * 0.18;
                clone.play().catch(() => {});
            }

            playCue(name) {
                if (!this.enabled || !this.sfx[name]) return;
                const cue = this.sfx[name];
                cue.currentTime = 0;
                cue.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionBadge = document.getElementById('reaction-badge');
        const hitGif = document.getElementById('hit-gif');
        const winGif = document.getElementById('win-gif');
        hitGif.src = ASSETS.gifs.hit;
        winGif.src = ASSETS.gifs.win;

        let width, height;
        let gameActive = false;
        let score = 0;
        const TARGET_SCORE = 100;
        let startTime = 0;
        let particles = [];
        let badgeTimeout = 0;
        let hitGifTimeout = 0;
        let winGifTimeout = 0;

        let cat = {
            x: 0,
            y: 0,
            radius: 50,
            scale: 1,
            targetScale: 1,
            rotation: 0,
            faceColor: COLORS.catBody
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (cat.x > width || cat.y > height) moveCat();
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. VISUALS */
        function drawBackground() {
            const phase = score >= 100 ? 4 : Math.min(3, Math.floor(score / 25));
            const now = Date.now();
            const phasePalettes = [
                ['#17102F', '#2F225F', '#6A411F'],
                ['#15122E', '#282453', '#5A321C'],
                ['#111B38', '#284579', '#6D4917'],
                ['#091C1F', '#173D33', '#31224E'],
                ['#16102C', '#332263', '#7B4F16']
            ];
            const palette = phasePalettes[phase];

            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, palette[0]);
            grad.addColorStop(0.58, palette[1]);
            grad.addColorStop(1, palette[2]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const moonX = width * (0.72 + Math.sin(now * 0.00018) * 0.04);
            const moonY = height * 0.14;
            const moonGlow = ctx.createRadialGradient(moonX, moonY, 10, moonX, moonY, Math.max(width, height) * 0.42);
            moonGlow.addColorStop(0, 'rgba(255, 246, 220, 0.42)');
            moonGlow.addColorStop(0.18, 'rgba(255, 214, 110, 0.18)');
            moonGlow.addColorStop(1, 'rgba(255, 214, 110, 0)');
            ctx.fillStyle = moonGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(255, 214, 110, 0.055)';
            ctx.lineWidth = 1;
            const gridShift = (now * 0.006) % 64;
            for (let x = -64 + gridShift; x < width + 64; x += 64) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x - width * 0.18, height);
                ctx.stroke();
            }

            const horizon = height * 0.64;
            ctx.fillStyle = 'rgba(10, 8, 24, 0.42)';
            ctx.beginPath();
            ctx.rect(0, horizon, width, height - horizon);
            ctx.fill();

            ctx.fillStyle = 'rgba(9, 7, 20, 0.54)';
            const towerCount = Math.max(5, Math.ceil(width / 95));
            for (let i = 0; i < towerCount; i++) {
                const baseX = i * 95 + ((now * 0.006) % 95) - 95;
                const towerW = 36 + (i % 3) * 10;
                const towerH = 95 + (i % 4) * 24;
                const x = baseX;
                const y = horizon - towerH;
                ctx.fillRect(x, y, towerW, towerH);
                ctx.beginPath();
                ctx.moveTo(x - 5, y);
                ctx.lineTo(x + towerW / 2, y - 36);
                ctx.lineTo(x + towerW + 5, y);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(255, 214, 110, 0.22)';
                for (let wy = y + 24; wy < horizon - 12; wy += 28) {
                    ctx.fillRect(x + towerW * 0.36, wy, 7, 13);
                }
                ctx.fillStyle = 'rgba(9, 7, 20, 0.54)';
            }

            ctx.strokeStyle = 'rgba(255, 214, 110, 0.18)';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            const stairBase = height * 0.76;
            for (let i = 0; i < 5; i++) {
                const y = stairBase - i * 34 + Math.sin(now * 0.0009 + i) * 5;
                ctx.beginPath();
                ctx.moveTo(-30 + i * 18, y);
                ctx.lineTo(width * 0.44 + i * 24, y - 46);
                ctx.stroke();
            }
            ctx.lineCap = 'butt';

            if (phase >= 2) {
                ctx.strokeStyle = 'rgba(255, 214, 110, 0.26)';
                ctx.lineWidth = 5;
                for (let i = 0; i < 3; i++) {
                    const hoopX = width * (0.18 + i * 0.28) + Math.sin(now * 0.0007 + i) * 9;
                    const hoopY = height * (0.31 + (i % 2) * 0.1);
                    ctx.beginPath();
                    ctx.arc(hoopX, hoopY, 28, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(hoopX, hoopY + 28);
                    ctx.lineTo(hoopX, hoopY + 82);
                    ctx.stroke();
                }
            }

            if (phase >= 3) {
                ctx.fillStyle = 'rgba(4, 15, 14, 0.46)';
                for (let i = 0; i < 10; i++) {
                    const x = (i / 9) * width + Math.sin(now * 0.00035 + i) * 12;
                    const trunkH = height * (0.34 + (i % 3) * 0.07);
                    ctx.fillRect(x - 8, height - trunkH, 16, trunkH);
                    ctx.beginPath();
                    ctx.ellipse(x, height - trunkH + 28, 36, 62, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = 'rgba(138, 241, 186, 0.24)';
                for (let i = 0; i < 9; i++) {
                    const mx = (i * 71) % width;
                    const my = height * 0.72 + ((i * 19) % 80);
                    ctx.beginPath();
                    ctx.arc(mx, my, 4 + (i % 3), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 7; i++) {
                const candleX = ((i * 137 + now * 0.012) % (width + 80)) - 40;
                const candleY = height * (0.14 + (i % 4) * 0.095) + Math.sin(now * 0.0012 + i) * 7;
                ctx.fillStyle = 'rgba(255, 246, 220, 0.76)';
                ctx.fillRect(candleX - 3, candleY, 6, 18);
                ctx.fillStyle = 'rgba(255, 183, 3, 0.72)';
                ctx.beginPath();
                ctx.ellipse(candleX, candleY - 5, 4, 8, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 36; i++) {
                const twinkle = (now * 0.002 + i) % (Math.PI * 2);
                const x = (i * 83 + Math.sin(now * 0.00042 + i) * 14) % width;
                const y = 34 + ((i * 57) % Math.max(height - 120, 100));
                const radius = 1.2 + (Math.sin(twinkle) + 1) * (phase >= 2 ? 1.6 : 1.15);
                ctx.fillStyle = i % 5 === 0 ? 'rgba(120, 237, 255, 0.56)' : COLORS.star;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            if (phase >= 1) {
                ctx.fillStyle = 'rgba(94, 75, 182, 0.3)';
                for (let i = 0; i < 4; i++) {
                    const bannerX = width * (0.12 + i * 0.22);
                    ctx.beginPath();
                    ctx.moveTo(bannerX, horizon - 92);
                    ctx.lineTo(bannerX + 28, horizon - 84);
                    ctx.lineTo(bannerX + 20, horizon - 18);
                    ctx.lineTo(bannerX + 6, horizon - 34);
                    ctx.lineTo(bannerX - 8, horizon - 18);
                    ctx.lineTo(bannerX - 14, horizon - 84);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        function drawCat(c) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(c.scale, c.scale);
            ctx.rotate(c.rotation);

            const bob = Math.sin(Date.now() * 0.012) * 2.5;
            ctx.translate(0, bob);

            ctx.fillStyle = 'rgba(155, 93, 229, 0.22)';
            ctx.beginPath();
            ctx.ellipse(0, 74, 42, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catCape;
            ctx.beginPath();
            ctx.moveTo(-38, 0);
            ctx.quadraticCurveTo(0, 64, 38, 0);
            ctx.quadraticCurveTo(10, 16, -38, 0);
            ctx.fill();

            ctx.fillStyle = COLORS.catCapeDark;
            ctx.beginPath();
            ctx.moveTo(-18, 10);
            ctx.quadraticCurveTo(0, 48, 18, 10);
            ctx.quadraticCurveTo(0, 24, -18, 10);
            ctx.fill();

            ctx.fillStyle = COLORS.catEars;
            ctx.beginPath();
            ctx.moveTo(-35, -26);
            ctx.lineTo(-50, -58);
            ctx.lineTo(-15, -44);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(35, -26);
            ctx.lineTo(50, -58);
            ctx.lineTo(15, -44);
            ctx.fill();

            ctx.fillStyle = COLORS.catInnerEar;
            ctx.beginPath();
            ctx.moveTo(-32, -31);
            ctx.lineTo(-40, -48);
            ctx.lineTo(-21, -40);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(32, -31);
            ctx.lineTo(40, -48);
            ctx.lineTo(21, -40);
            ctx.fill();

            const furGradient = ctx.createRadialGradient(-8, -16, 16, 0, 0, 56);
            furGradient.addColorStop(0, '#FFE6A8');
            furGradient.addColorStop(0.6, c.faceColor);
            furGradient.addColorStop(1, COLORS.catBodyShade);
            ctx.fillStyle = furGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#6A432B';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = COLORS.catWhite;
            ctx.beginPath();
            ctx.ellipse(-20, -8, 10, 12, -0.12, 0, Math.PI * 2);
            ctx.ellipse(20, -8, 10, 12, 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#20122F';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(-20, -8, 14, 0, Math.PI * 2);
            ctx.arc(20, -8, 14, 0, Math.PI * 2);
            ctx.moveTo(-6, -8);
            ctx.lineTo(6, -8);
            ctx.stroke();

            ctx.fillStyle = COLORS.catEyes;
            ctx.beginPath();
            ctx.ellipse(-20, -8, 4.4, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(20, -8, 4.4, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-18, -11, 1.4, 0, Math.PI * 2);
            ctx.arc(22, -11, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catCheek;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.ellipse(-25, 12, 9, 5, 0, 0, Math.PI * 2);
            ctx.ellipse(25, 12, 9, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = COLORS.catWhite;
            ctx.beginPath();
            ctx.ellipse(0, 18, 18, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catNose;
            ctx.beginPath();
            ctx.moveTo(-5, 8);
            ctx.lineTo(5, 8);
            ctx.lineTo(0, 15);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, 15);
            ctx.lineTo(-6, 21);
            ctx.moveTo(0, 15);
            ctx.lineTo(6, 21);
            ctx.strokeStyle = '#6A432B';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = '#6A432B';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-30, 7); ctx.lineTo(-60, 2);
            ctx.moveTo(-30, 12); ctx.lineTo(-60, 12);
            ctx.moveTo(-30, 17); ctx.lineTo(-60, 22);
            ctx.moveTo(30, 7); ctx.lineTo(60, 2);
            ctx.moveTo(30, 12); ctx.lineTo(60, 12);
            ctx.moveTo(30, 17); ctx.lineTo(60, 22);
            ctx.stroke();

            ctx.strokeStyle = '#FFD66E';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-28, 39);
            ctx.quadraticCurveTo(0, 53, 28, 39);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.ellipse(-12, -24, 10, 6, -0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function flashBadge(message, tone = 'default') {
            reactionBadge.textContent = message;
            reactionBadge.style.color = tone === 'victory' ? 'var(--green-600)' : 'var(--pink-700)';
            reactionBadge.classList.add('show');
            clearTimeout(badgeTimeout);
            badgeTimeout = setTimeout(() => reactionBadge.classList.remove('show'), 900);
        }

        function flashGif(element, timeoutRefName, duration = 1100) {
            element.classList.add('show');
            clearTimeout(timeoutRefName === 'hit' ? hitGifTimeout : winGifTimeout);
            const timer = setTimeout(() => element.classList.remove('show'), duration);
            if (timeoutRefName === 'hit') {
                hitGifTimeout = timer;
            } else {
                winGifTimeout = timer;
            }
        }

        function createParticles(x, y) {
            const colors = ['#FFF8DF', '#FFD66E', '#8AF1BA', '#78EDFF', '#BBA7FF'];
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 12;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 7 + 3,
                    life: 1.0,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                p.size *= 0.95;

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        /** 5. GAME LOGIC */
        function moveCat() {
            const padding = 80;
            cat.x = padding + Math.random() * (width - padding * 2);
            cat.y = padding + Math.random() * (height - padding * 2);

            cat.scale = 0.5;
            cat.targetScale = 1.0;
            cat.rotation = (Math.random() - 0.5) * 0.5;
        }

        function initGame() {
            score = 0;
            updateHUD();
            particles = [];
            moveCat();
            cat.x = width / 2;
            cat.y = height / 2;
            reactionBadge.classList.remove('show');
            hitGif.classList.remove('show');
            winGif.classList.remove('show');

            startTime = Date.now();
            gameActive = true;
            audio.playBGM();

            requestAnimationFrame(gameLoop);
        }

        function checkClick(inputX, inputY) {
            if (!gameActive) return;

            const dx = inputX - cat.x;
            const dy = inputY - cat.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < cat.radius * 1.5) {
                score++;
                audio.playTap();
                createParticles(cat.x, cat.y);

                if (score === 1) {
                    flashBadge('Familiar found!');
                } else if (score % 25 === 0) {
                    flashBadge(`Charm streak ${score}!`);
                    flashGif(hitGif, 'hit', 950);
                }

                if (score >= TARGET_SCORE) {
                    winGame();
                } else {
                    moveCat();
                }
                updateHUD();
            }
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
        }

        function updateTimer() {
            if (!gameActive) return;
            const now = Date.now();
            const diff = (now - startTime) / 1000;
            document.getElementById('timer').innerText = diff.toFixed(1) + "s";
        }

        function winGame() {
            gameActive = false;
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('finalTime').innerText = finalTime + "s";

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('victory-screen').classList.remove('hidden');
            flashBadge('House points secured!', 'victory');
            flashGif(winGif, 'win', 2200);
            audio.playCue('victory');
            audio.playVictoryLoop();

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createParticles(width / 2 + (Math.random() - 0.5) * 200, height / 2 + (Math.random() - 0.5) * 200);
                }, i * 100);
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            if (gameActive) {
                cat.scale += (cat.targetScale - cat.scale) * 0.2;
                drawCat(cat);
                updateTimer();
            }

            drawParticles();

            if (gameActive || particles.length > 0) {
                requestAnimationFrame(gameLoop);
            }
        }

        /** 6. INPUTS */
        function handleInput(e) {
            e.preventDefault();
            let x, y;
            if (e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            checkClick(x, y);
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('start');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        const restartBtn = document.getElementById('restart-btn');
        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('restart');
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.playBGM();
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });
    });
    </script>
</body>
