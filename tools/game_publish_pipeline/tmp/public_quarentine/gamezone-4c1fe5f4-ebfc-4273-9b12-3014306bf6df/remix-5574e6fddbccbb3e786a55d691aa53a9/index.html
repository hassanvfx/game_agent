<script>
// §3.2 Configuration Interface
window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Cat Speed", "value": 12, "min": 5, "max": 25 },
    "spawnRate": { "type": "number", "label": "Spawn Rate", "value": 1.5, "min": 0.5, "max": 5 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#FF6B6B" },
    "gameTitle": { "type": "text", "label": "Game Title", "value": "Snack Swipe Showdown" }
};
window.gameConfig = {};
// Initialize Config
try {
    const parsed = JSON.parse(document.getElementById('game-config').textContent);
    for (const key in parsed) {
        window.gameConfig[key] = parsed[key].value;
        if(window.gameConfigDefs[key]) window.gameConfigDefs[key] = parsed[key];
    }
} catch (e) {
    console.error("Config parse error", e);
    // Fallback defaults
    for (const key in window.gameConfigDefs) {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    }
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            document.getElementById('ui-title').style.color = val;
            document.getElementById('start-btn').style.backgroundColor = val;
            document.getElementById('restart-btn').style.backgroundColor = val;
            document.querySelector('#hud div').style.color = val;
        }
        if (key === 'gameTitle') {
            document.getElementById('ui-title').innerText = val;
            document.title = val;
        }
    }
};

// §A.2 Audio Manager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = document.getElementById('bgm_main');
        this.soundNodes = {
            sfx_collect: document.getElementById('sfx_collect'),
            sfx_fail: document.getElementById('sfx_fail'),
            sfx_blast: document.getElementById('sfx_blast'),
            sfx_ui: document.getElementById('sfx_ui')
        };
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.unlocked = false;
        this.lastPlayedAt = new Map();
        
        const unlockHandler = () => {
            if (this.unlocked) return;
            this.init();
            this.unlocked = true;
            document.removeEventListener('pointerdown', unlockHandler);
            document.removeEventListener('keydown', unlockHandler);
        };
        document.addEventListener('pointerdown', unlockHandler);
        document.addEventListener('keydown', unlockHandler);
    }

    init() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.85;
            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.value = 0.9;
            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.value = 0.32;
            this.sfxGain.connect(this.masterGain);
            this.bgmGain.connect(this.masterGain);
            this.masterGain.connect(this.ctx.destination);

            Object.entries(this.soundNodes).forEach(([id, node]) => {
                if (!node) return;
                node.preload = 'auto';
                node.crossOrigin = 'anonymous';
                node.volume = id === 'sfx_ui' ? 0.55 : id === 'sfx_fail' ? 0.6 : 0.7;
                if (this.ctx && id !== 'bgm_main') {
                    const mediaNode = this.ctx.createMediaElementSource(node);
                    mediaNode.connect(this.sfxGain);
                }
            });

            if (this.bgmNode) {
                this.bgmNode.preload = 'auto';
                this.bgmNode.crossOrigin = 'anonymous';
                this.bgmNode.volume = 0.22;
                const bgmMediaNode = this.ctx.createMediaElementSource(this.bgmNode);
                bgmMediaNode.connect(this.bgmGain);
            }
        } catch (e) {
            console.error("Audio init failed", e);
        }
    }

    resume() {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    }

    startBgm() {
        this.resume();
        if (!this.bgmNode) return;
        this.bgmNode.currentTime = 0;
        this.bgmNode.play().catch(() => {});
    }

    stopBgm() {
        if (!this.bgmNode) return;
        this.bgmNode.pause();
        this.bgmNode.currentTime = 0;
    }

    playSfx(id, cooldown = 70) {
        this.resume();
        const node = this.soundNodes[id];
        if (!node) return;
        const now = performance.now();
        const last = this.lastPlayedAt.get(id) || 0;
        if (now - last < cooldown) return;
        this.lastPlayedAt.set(id, now);
        try {
            node.pause();
            node.currentTime = 0;
            node.play().catch(() => {});
        } catch (_) {}
    }
}

// Game Logic
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
    const audio = new AudioManager();
    
    // Elements
    const uiStart = document.getElementById('start-screen');
    const uiGameOver = document.getElementById('game-over-screen');
    const uiHud = document.getElementById('hud');
    const elScore = document.getElementById('score');
    const elFinalScore = document.getElementById('finalScore');
    const elMeowFill = document.getElementById('meow-fill');
    const feedbackStrip = document.getElementById('feedback-strip');
    const feedbackCard = document.getElementById('feedback-card');
    const feedbackGif = document.getElementById('feedback-gif');
    
    // State
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let lastTime = 0;
    let score = 0;
    let meowCharge = 100;
    let spawnTimer = 0;
    let shake = 0;
    let feedbackTimeout = null;
    
    // Entities
    let player = { x: 0, y: 0, r: 30, targetX: 0 };
    let items = []; // {x, y, type: 'good'|'bad', r, vy, rot, vRot}
    let particles = []; // {x, y, vx, vy, life, color, type}
    let shockwaves = []; // {x, y, r, alpha}

    // Resize
    let w, h, dpr;
    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Reset player pos if needed
        if (gameState === 'MENU') {
            player.x = w / 2;
            player.y = h - 100;
            player.targetX = w / 2;
        } else {
            player.y = h - 100;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input
    function handleInput(e) {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        
        // Handle touch points if available for better multi-touch support (though restricted by contract to basic events)
        // Just use clientX from pointer event
        player.targetX = clientX - rect.left;
    }

    function showReactionGif(kind) {
        const gifMap = {
            collect: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
            fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
        };
        const src = gifMap[kind];
        if (!src || !feedbackStrip || !feedbackCard || !feedbackGif) return;
        feedbackGif.src = src;
        feedbackStrip.classList.remove('hidden');
        feedbackCard.classList.remove('hidden');
        clearTimeout(feedbackTimeout);
        feedbackTimeout = setTimeout(() => {
            feedbackCard.classList.add('hidden');
            feedbackStrip.classList.add('hidden');
        }, kind === 'fail' ? 1800 : 950);
    }

    function handleTap(e) {
        if (gameState !== 'PLAYING') return;
        // Meow ability
        if (meowCharge >= 100) {
            meowCharge = 0;
            shockwaves.push({x: player.x, y: player.y, r: 10, alpha: 1.0});
            audio.playSfx('sfx_blast', 120);
            // Push bad items away
            items.forEach(item => {
                if (item.type === 'bad') {
                    const dx = item.x - player.x;
                    const dy = item.y - player.y;
                    const dist = Math.max(1, Math.sqrt(dx*dx + dy*dy));
                    if (dist < 300) {
                        item.vy = -15; // Blast up
                        item.vx = (dx / dist) * 10;
                    }
                }
            });
        }
    }

    canvas.addEventListener('pointerdown', (e) => {
        handleInput(e);
        handleTap(e);
    }, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('pointercancel', (e) => e.preventDefault(), { passive: false });

    // Game Loop
    function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        try {
            update(dt);
            render();
        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function startGame() {
        score = 0;
        meowCharge = 100;
        items = [];
        particles = [];
        shockwaves = [];
        gameState = 'PLAYING';
        player.x = w / 2;
        player.targetX = w / 2;
        
        uiStart.classList.add('hidden');
        uiGameOver.classList.add('hidden');
        uiHud.classList.remove('hidden');
        
        elScore.innerText = "0";
        feedbackCard.classList.add('hidden');
        feedbackStrip.classList.add('hidden');
        audio.startBgm();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        shake = 20;
        audio.playSfx('sfx_fail', 180);
        audio.stopBgm();
        showReactionGif('fail');
        uiHud.classList.add('hidden');
        uiGameOver.classList.remove('hidden');
        elFinalScore.innerText = score;
    }

    // Logic
    function update(dt) {
        if (gameState !== 'PLAYING') return;

        // Screen shake decay
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;

        // Player movement
        const speed = window.gameConfig.heroSpeed * 60 * dt; // Normalize
        const diff = player.targetX - player.x;
        player.x += diff * Math.min(1, dt * 10); // Smooth follow
        
        // Clamp player
        player.x = Math.max(player.r, Math.min(w - player.r, player.x));

        // Meow recharge
        if (meowCharge < 100) meowCharge += dt * 30;
        elMeowFill.style.width = Math.min(100, meowCharge) + '%';
        elMeowFill.style.backgroundColor = meowCharge >= 100 ? '#FF9F43' : '#ccc';

        // Spawning
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            const isBad = Math.random() < 0.3; // 30% cucumber
            const r = isBad ? 25 : 20;
            items.push({
                x: Math.random() * (w - 2 * r) + r,
                y: -50,
                type: isBad ? 'bad' : 'good',
                r: r,
                vy: Math.random() * 100 + 150, // Fall speed
                vx: (Math.random() - 0.5) * 20,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 5
            });
            spawnTimer = 1.5 / window.gameConfig.spawnRate;
        }

        // Items update
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += item.vy * dt;
            item.x += item.vx * dt;
            item.rot += item.vRot * dt;
            item.vy += 200 * dt; // Gravity

            // Collision with Player
            const dx = item.x - player.x;
            const dy = item.y - player.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < player.r + item.r) {
                if (item.type === 'good') {
                    // Collect
                    score += 10;
                    elScore.innerText = score;
                    audio.playSfx('sfx_collect', 80);
                    showReactionGif('collect');
                    createParticles(item.x, item.y, window.gameConfig.themeColor);
                    items.splice(i, 1);
                } else {
                    // Hit Bad
                    gameOver();
                }
                continue;
            }

            // Remove off screen
            if (item.y > h + 50) {
                items.splice(i, 1);
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            let s = shockwaves[i];
            s.r += 500 * dt;
            s.alpha -= 2 * dt;
            if (s.alpha <= 0) shockwaves.splice(i, 1);
        }
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 200 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5 + Math.random() * 0.3,
                color: color,
                type: 'star'
            });
        }
    }

    // Render
    function render() {
        // Clear
        const backdrop = ctx.createLinearGradient(0, 0, 0, h);
        backdrop.addColorStop(0, '#130b2d');
        backdrop.addColorStop(0.55, '#241352');
        backdrop.addColorStop(1, '#160b30');
        ctx.fillStyle = backdrop;
        ctx.fillRect(0, 0, w, h);

        // Shake offset
        let sx = 0, sy = 0;
        if (shake > 0) {
            sx = (Math.random() - 0.5) * shake;
            sy = (Math.random() - 0.5) * shake;
        }
        ctx.save();
        ctx.translate(sx, sy);

        // Background Pattern (arcade skyline + drifting sparkles)
        const skyline = ctx.createLinearGradient(0, h * 0.2, 0, h);
        skyline.addColorStop(0, 'rgba(143, 252, 255, 0)');
        skyline.addColorStop(1, 'rgba(255, 107, 107, 0.08)');
        ctx.fillStyle = skyline;
        ctx.fillRect(0, h * 0.2, w, h * 0.8);

        for (let i = 0; i < 7; i++) {
            const towerX = ((i + 0.5) * w) / 7;
            const towerH = 70 + (i % 3) * 36;
            ctx.fillStyle = 'rgba(16, 10, 40, 0.36)';
            ctx.fillRect(towerX - 22, h - towerH - 10, 44, towerH);
            ctx.fillStyle = 'rgba(143, 252, 255, 0.12)';
            for (let wy = h - towerH; wy < h - 20; wy += 18) {
                ctx.fillRect(towerX - 12, wy, 6, 8);
                ctx.fillRect(towerX + 4, wy + 4, 6, 8);
            }
        }

        ctx.fillStyle = 'rgba(143, 252, 255, 0.16)';
        for (let px = 20; px < w; px += 46) {
            const drift = (Date.now() / 55 + px) % 70;
            ctx.beginPath();
            ctx.arc(px, drift - 30, 2 + (px % 3), 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw Shockwaves
        shockwaves.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 159, 67, ${s.alpha})`;
            ctx.lineWidth = 5;
            ctx.stroke();
        });

        // Draw Items
        items.forEach(item => {
            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.rotate(item.rot);
            if (item.type === 'good') {
                // Draw Fish Bite
                const fishGrad = ctx.createLinearGradient(-item.r, -item.r, item.r, item.r);
                fishGrad.addColorStop(0, '#ffe17c');
                fishGrad.addColorStop(1, window.gameConfig.themeColor);
                ctx.fillStyle = fishGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, item.r, item.r * 0.62, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-item.r + 2, 0);
                ctx.lineTo(-item.r - 12, -11);
                ctx.lineTo(-item.r - 12, 11);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.beginPath();
                ctx.ellipse(5, -4, item.r * 0.35, item.r * 0.16, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2d165b';
                ctx.beginPath();
                ctx.arc(item.r * 0.35, -2, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Draw Rotten Cuke Bot
                const cukeGrad = ctx.createLinearGradient(0, -item.r, 0, item.r);
                cukeGrad.addColorStop(0, '#8eff8b');
                cukeGrad.addColorStop(1, '#328a45');
                ctx.fillStyle = cukeGrad;
                ctx.beginPath();
                ctx.roundRect(-item.r/2, -item.r, item.r, item.r*2, 12);
                ctx.fill();
                ctx.strokeStyle = 'rgba(15, 51, 27, 0.55)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#17381f';
                ctx.beginPath();
                ctx.arc(-5, -8, 3, 0, Math.PI * 2);
                ctx.arc(5, -8, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#17381f';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-7, 8);
                ctx.quadraticCurveTo(0, 14, 7, 8);
                ctx.stroke();
                ctx.fillStyle = 'rgba(196,255,196,0.4)';
                ctx.fillRect(-item.r/2 + 3, -item.r + 6, item.r - 6, 4);
                ctx.fillRect(-item.r/2 + 3, 1, item.r - 6, 4);
            }
            ctx.restore();
        });

        // Draw Player (Cat)
        if (gameState !== 'GAMEOVER' || Math.floor(Date.now() / 200) % 2 === 0) {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Squash and stretch based on movement
            const scaleX = 1 + Math.abs(player.targetX - player.x) * 0.001;
            const scaleY = 1 - Math.abs(player.targetX - player.x) * 0.001;
            ctx.scale(scaleX, scaleY);

            // Ears
            const earGrad = ctx.createLinearGradient(0, -45, 0, 10);
            earGrad.addColorStop(0, '#ffd166');
            earGrad.addColorStop(1, '#ff8b5e');
            ctx.fillStyle = earGrad;
            ctx.beginPath();
            ctx.moveTo(-25, -20);
            ctx.lineTo(-38, -48);
            ctx.lineTo(-10, -29);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(25, -20);
            ctx.lineTo(38, -48);
            ctx.lineTo(10, -29);
            ctx.fill();

            ctx.fillStyle = '#ffefc9';
            ctx.beginPath();
            ctx.moveTo(-23, -24);
            ctx.lineTo(-30, -39);
            ctx.lineTo(-14, -30);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(23, -24);
            ctx.lineTo(30, -39);
            ctx.lineTo(14, -30);
            ctx.fill();

            // Head
            const headGrad = ctx.createRadialGradient(-8, -12, 6, 0, 0, player.r + 10);
            headGrad.addColorStop(0, '#ffd87d');
            headGrad.addColorStop(0.65, '#ffb347');
            headGrad.addColorStop(1, '#ff7a59');
            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(0, 0, player.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, player.r - 1, 0.35, Math.PI * 1.2);
            ctx.stroke();

            // Face
            ctx.fillStyle = '#fff7ef';
            ctx.beginPath();
            ctx.ellipse(0, 7, 16, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(-10, -12, 8, 5, -0.5, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#251532';
            if (gameState === 'GAMEOVER') {
                // X eyes
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#333';
                ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-4, 3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-4, -5); ctx.lineTo(-12, 3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(12, 3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(12, -5); ctx.lineTo(4, 3); ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(-8, -2, 4, 0, Math.PI * 2);
                ctx.arc(8, -2, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#8ffcff';
                ctx.beginPath();
                ctx.arc(-7, -3, 1.2, 0, Math.PI * 2);
                ctx.arc(9, -3, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Nose/Mouth
            ctx.fillStyle = '#ff7aa8';
            ctx.beginPath();
            ctx.arc(0, 3, 2.6, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#8a3652';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(0, 5);
            ctx.quadraticCurveTo(-4, 9, -8, 8);
            ctx.moveTo(0, 5);
            ctx.quadraticCurveTo(4, 9, 8, 8);
            ctx.stroke();
            
            // Whiskers
            ctx.strokeStyle = '#4b2f3d';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-15, 5); ctx.lineTo(-35, 1);
            ctx.moveTo(-15, 10); ctx.lineTo(-35, 12);
            ctx.moveTo(15, 5); ctx.lineTo(35, 1);
            ctx.moveTo(15, 10); ctx.lineTo(35, 12);
            ctx.stroke();

            ctx.restore();
        }

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        ctx.restore();
    }

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.playSfx('sfx_ui', 120);
        startGame();
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.playSfx('sfx_ui', 120);
        startGame();
    });
});
</script>
