<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&display=swap');
        /* [agent-note][stage4] repaired-font-remap: display -> Bangers, ui/hud -> Exo 2 via catalogs/fonts.json */
        :root {
            --bg-top: #1a1138;
            --bg-bottom: #050816;
            --hud-glow: rgba(89, 220, 255, 0.45);
            --panel: rgba(12, 18, 38, 0.74);
            --panel-border: rgba(130, 236, 255, 0.38);
            --hot: #ff4fd8;
            --hot-strong: #ff88f4;
            --cool: #59dcff;
            --cool-soft: #9ff4ff;
            --gold: #ffd95c;
            --ink: #09101f;
            --text-main: #f8fbff;
            --text-dim: rgba(233, 244, 255, 0.78);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 79, 216, 0.18), transparent 36%),

            user-select: none;

        body::before {
            content: '';
            position: fixed;

        }
        .panel-shell {
            position: relative;
            overflow: hidden;
        }
        .panel-shell::before,
        .panel-shell::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .panel-shell::before {
            background: linear-gradient(120deg, rgba(255,255,255,0.16), transparent 24%, transparent 72%, rgba(89,220,255,0.1));
            opacity: 0.9;
        }
        .panel-shell::after {
            inset: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: inherit;
        }
        .text-stroke {
            color: white;
            text-shadow:
                0 2px 0 rgba(9, 16, 31, 0.85),
                0 4px 0 rgba(9, 16, 31, 0.65),
                0 0 18px rgba(255, 79, 216, 0.45);
        }
        .wiggle { animation: wiggle 2.1s ease-in-out infinite; }
        .hud-chip {
            min-width: 138px;
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            border: 2px solid rgba(159, 244, 255, 0.38);
            background: linear-gradient(180deg, rgba(8, 15, 30, 0.95), rgba(17, 30, 56, 0.88));
            box-shadow: 0 0 16px rgba(89, 220, 255, 0.18);
        }
        .cta-btn {
            position: relative;
            overflow: hidden;
            transform-origin: center;
        }
        .cta-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: translateX(-120%);
            transition: transform 220ms ease;
        }
        .cta-btn:hover::before,
        .cta-btn:focus-visible::before {
            transform: translateX(120%);
        }
        .helper-copy {
            color: var(--text-dim);
            text-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }
        .emoji-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 30%, #fff7a5, #ffd95c 60%, #ffb73d 100%);
            box-shadow: 0 0 14px rgba(255, 217, 92, 0.45);
            font-size: 1.3rem;
        }
        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: clamp(72px, 16vw, 132px);
            height: clamp(72px, 16vw, 132px);
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(159, 244, 255, 0.5);
            background: rgba(5, 8, 22, 0.5);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35), 0 0 20px rgba(89, 220, 255, 0.18);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }
        .feedback-gif.is-visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }
        #score-gif {
            top: 5.2rem;
        }
        #danger-gif {
            bottom: 1rem;
        }
        @keyframes wiggle { 0%, 100% { transform: rotateZ(0) translateY(0); } 25% { transform: rotateZ(-3deg) translateY(-2px); } 50% { transform: rotateZ(2deg) translateY(0); } 75% { transform: rotateZ(-1deg) translateY(-1px); } }
        @media (max-width: 640px) {
            #hud { top: 0.9rem; left: 0.9rem; }
            .hud-chip { min-width: 112px; padding: 0.42rem 0.72rem; }
            #start-screen, #game-over-screen { width: min(92vw, 26rem); padding: 1.25rem; border-radius: 1.4rem; }
            .feedback-gif {
                width: 72px;
                height: 72px;
                right: 0.6rem;
            }
            #score-gif { top: 4.8rem; }
            #danger-gif { bottom: 0.7rem; }
        }
    </style>

<script>
/**
 * NEON RELAY - CORE ENGINE
 */

// --- CONFIGURATION SYSTEM ---
window.gameConfig = {
    gameSpeed: 300,
    gravity: 1800,
    jumpForce: 700,
    accentColor: "#00FFFF"
};

window.gameConfigDefs = {
    "gameSpeed": { "type": "number", "label": "Game Speed", "value": 300, "min": 100, "max": 600 },
    "gravity": { "type": "number", "label": "Gravity", "value": 1800, "min": 500, "max": 3000 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 700, "min": 400, "max": 1200 },
    "accentColor": { "type": "color", "label": "Accent Color", "value": "#00FFFF" }
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'accentColor') {
            // Visual update handled in render loop
        }
    }
};

// --- AUDIO MANAGER ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.isUnlocked = false;
        this.masterGain = null;
        this.sfxGain = null;
        this.activeInstances = {};
        this.lastPlayedAt = {};
        this.bgmEl = null;
    }

    init() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.82;
        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.8;
        this.sfxGain.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);
        this.bgmEl = document.getElementById('bgm_main');
        
        const unlock = () => {
            if (!this.ctx || this.isUnlocked) return;
            this.ctx.resume().then(() => {
                this.isUnlocked = true;
                this.playBgm();
            }).catch(() => {});
            window.removeEventListener('pointerdown', unlock);
            window.removeEventListener('keydown', unlock);
        };
        
        window.addEventListener('pointerdown', unlock, { passive: true });
        window.addEventListener('keydown', unlock);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.pauseBgm();
            } else if (state.playing && !state.gameOver) {
                this.playBgm();
            }
        });
    }

    async loadSound(id, src) {
        if (!this.ctx || !src) return;
        try {
            const response = await fetch(src);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
            this.buffers[id] = audioBuffer;
        } catch (e) {
            console.warn(`Audio load failed: ${id}`, e);
            this.buffers[id] = 'error';
        }
    }

    playBgm() {
        if (!this.isUnlocked || !this.bgmEl) return;
        this.bgmEl.volume = 0.2;
        this.bgmEl.play().catch(() => {});
    }

    pauseBgm() {
        if (this.bgmEl && !this.bgmEl.paused) {
            this.bgmEl.pause();
        }
    }

    playSfx(id, fallbackType = 'beep', options = {}) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        const now = performance.now();
        const cooldown = options.cooldown ?? 80;
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;
        
        if (this.buffers[id] && this.buffers[id] !== 'error') {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = options.volume ?? 0.7;
            source.buffer = this.buffers[id];
            source.connect(gain);
            gain.connect(this.sfxGain || this.ctx.destination);
            if (this.activeInstances[id]) {
                try { this.activeInstances[id].stop(); } catch (e) {}
            }
            this.activeInstances[id] = source;
            source.onended = () => {
                if (this.activeInstances[id] === source) delete this.activeInstances[id];
            };
            source.start(0);
        } else {
            this.synthesize(fallbackType);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (type === 'ui') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(720, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        }
    }
}

// --- GAME LOGIC ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audio = new AudioManager();

 let state = {
     playing: false,
     gameOver: false,
     score: 0,
     time: 0,
     shake: 0,
     width: 0,
     height: 0,
     overlayTimers: {},
    
    // Player
    player: {
        x: 0, y: 0, vy: 0, r: 25, 
        squash: 1, rotation: 0
    },
    
    // Entities
    obstacles: [],
    coins: [],
    particles: [],
    
    // Environment
    bgOffset: 0,
    nextSpawn: 0
};

// Input Handling
let jumpRequest = false;

function handleInput(e) {
    if (e.type === 'pointerdown' || (e.type === 'keydown' && e.code === 'Space')) {
        if (state.playing && !state.gameOver) {
            jumpRequest = true;
        }
    }
}

window.addEventListener('pointerdown', handleInput, { passive: false });
window.addEventListener('keydown', handleInput);

// Resize Handling
function resize() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    canvas.width = state.width * window.devicePixelRatio;
    canvas.height = state.height * window.devicePixelRatio;
    canvas.style.width = state.width + 'px';
    canvas.style.height = state.height + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    if (!state.playing) {
        state.player.x = state.width * 0.2;
        state.player.y = state.height * 0.5;
    }
}
window.addEventListener('resize', resize);

// Game Loop
let lastTime = 0;
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;

    try {
        update(dt);
        render();
    } catch (e) {
        console.error(e);
    }
    
    requestAnimationFrame(loop);
}

 function initGame() {
     state.score = 0;
     state.playing = true;
     state.gameOver = false;
     state.overlayTimers = {};
     state.player.y = state.height * 0.5;
    state.player.vy = 0;
    state.player.rotation = 0;
    state.obstacles = [];
    state.coins = [];
    state.particles = [];
    state.nextSpawn = 0;
    state.bgOffset = 0;
    
     document.getElementById('hud').classList.remove('hidden');
     document.getElementById('start-screen').classList.add('hidden');
     document.getElementById('game-over-screen').classList.add('hidden');
     document.getElementById('scoreVal').innerText = "0";
     hideGif('score-gif');
     hideGif('danger-gif');
     audio.playBgm();
 }

 function showGif(id, duration = 1200) {
     const el = document.getElementById(id);
     if (!el) return;
     el.classList.add('is-visible');
     clearTimeout(state.overlayTimers[id]);
     state.overlayTimers[id] = setTimeout(() => hideGif(id), duration);
 }

 function hideGif(id) {
     const el = document.getElementById(id);
     if (!el) return;
     el.classList.remove('is-visible');
 }

 function gameOver() {
     state.gameOver = true;
     state.shake = 20;
     audio.pauseBgm();
     audio.playSfx('sfx_die', 'crash', { volume: 0.8, cooldown: 300 });
     showGif('danger-gif', 1800);
    
    setTimeout(() => {
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('finalScore').innerText = state.score;
    }, 500);
}

function spawnObstacle() {
    const gap = 200;
    const minH = 100;
    const maxH = state.height - gap - minH;
    const topH = Math.random() * (maxH - minH) + minH;
    
    const obsX = state.width + 50;
    const w = 60;
    
    // Top Pipe
    state.obstacles.push({ x: obsX, y: 0, w: w, h: topH, type: 'wall' });
    // Bottom Pipe
    state.obstacles.push({ x: obsX, y: topH + gap, w: w, h: state.height - (topH + gap), type: 'wall' });
    
    // Coin in gap
    if (Math.random() > 0.3) {
        state.coins.push({
            x: obsX + w/2,
            y: topH + gap/2,
            r: 20,
            collected: false
        });
    }
}

function createParticles(x, y, color, type = 'dot') {
    for (let i = 0; i < 8; i++) {
        state.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.5) * 300,
            life: 1.0,
            color: color,
            type: type,
            text: type === 'text' ? ['SYNC', 'CACHE', 'BOOST', '+10'][Math.floor(Math.random()*4)] : ''
        });
    }
}

function update(dt) {
    if (!state.playing) return;
    
    state.time += dt;
    
    // Screen Shake Decay
    if (state.shake > 0) state.shake *= 0.9;
    if (state.shake < 0.5) state.shake = 0;

    if (state.gameOver) {
        // Simple physics for falling off screen
        state.player.vy += window.gameConfig.gravity * dt;
        state.player.y += state.player.vy * dt;
        state.player.rotation += 5 * dt;
        return;
    }

    // Player Physics
    if (jumpRequest) {
         state.player.vy = -window.gameConfig.jumpForce;
         state.player.squash = 0.6;
         audio.playSfx('sfx_jump', 'jump', { volume: 0.45, cooldown: 120 });
         createParticles(state.player.x, state.player.y + 20, '#fff');
         jumpRequest = false;
    }

    state.player.vy += window.gameConfig.gravity * dt;
    state.player.y += state.player.vy * dt;
    
    // Squash & Stretch restoration
    state.player.squash += (1 - state.player.squash) * 10 * dt;
    
    // Rotation based on velocity
    state.player.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (state.player.vy * 0.002)));

    // Boundaries
    if (state.player.y > state.height || state.player.y < -50) {
        gameOver();
    }

    // World Movement
    const speed = window.gameConfig.gameSpeed;
    state.bgOffset += speed * dt * 0.5;
    state.nextSpawn -= dt * speed;
    
    if (state.nextSpawn <= 0) {
        spawnObstacle();
        state.nextSpawn = 400 + Math.random() * 200; // Distance between pipes
    }

    // Obstacles
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
        let obs = state.obstacles[i];
        obs.x -= speed * dt;
        
        // Collision
        if (
            state.player.x + 15 > obs.x && 
            state.player.x - 15 < obs.x + obs.w &&
            state.player.y + 15 > obs.y && 
            state.player.y - 15 < obs.y + obs.h
        ) {
            gameOver();
        }

        if (obs.x + obs.w < -100) state.obstacles.splice(i, 1);
    }

    // Coins
    for (let i = state.coins.length - 1; i >= 0; i--) {
        let coin = state.coins[i];
        coin.x -= speed * dt;
        
        // Collision
        let dx = state.player.x - coin.x;
        let dy = state.player.y - coin.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < state.player.r + coin.r && !coin.collected) {
            coin.collected = true;
             state.score += 10;
             document.getElementById('scoreVal').innerText = state.score;
             audio.playSfx('sfx_score', 'ui', { volume: 0.65, cooldown: 100 });
             showGif('score-gif', 900);
             createParticles(coin.x, coin.y, '#FFD700', 'text');
            state.coins.splice(i, 1);
        } else if (coin.x < -50) {
            state.coins.splice(i, 1);
        }
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        let p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if (p.life <= 0) state.particles.splice(i, 1);
    }
}

function render() {
    // Clear & Shake
    ctx.save();
    ctx.fillStyle = '#1a0b2e'; // Dark purple bg
    ctx.fillRect(0, 0, state.width, state.height);
    
    if (state.shake > 0) {
        const dx = (Math.random() - 0.5) * state.shake;
        const dy = (Math.random() - 0.5) * state.shake;
        ctx.translate(dx, dy);
    }

    // Background Gradient (Vaporwave style)
    const grd = ctx.createLinearGradient(0, 0, 0, state.height);
    grd.addColorStop(0, '#2e003e');
    grd.addColorStop(1, '#ff0055');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, state.width, state.height);

    // Grid Lines (Retro)
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const gridSize = 50;
    const offset = state.bgOffset % gridSize;
    for (let x = -offset; x < state.width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, state.height); // Vertical lines moving left
    }
    // Horizontal perspective lines
    for (let y = state.height/2; y < state.height; y += gridSize * (y/200)) {
         ctx.moveTo(0, y);
         ctx.lineTo(state.width, y);
    }
    ctx.stroke();

    // Draw Obstacles (Glitchy Pillars)
    state.obstacles.forEach(obs => {
        ctx.fillStyle = '#000';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        
        // Neon border
        ctx.strokeStyle = window.gameConfig.accentColor; // Editable color
        ctx.lineWidth = 4;
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
        
        // Glitch details
        ctx.fillStyle = '#fff';
        if (Math.random() > 0.9) {
            ctx.fillRect(obs.x + Math.random()*obs.w, obs.y + Math.random()*obs.h, 20, 5);
        }
    });

    // Draw Coins (Data cores)
    state.coins.forEach(coin => {
        ctx.save();
        ctx.translate(coin.x, coin.y);
        const scale = 1 + Math.sin(state.time * 10) * 0.1;
        ctx.scale(scale, scale);
        
        ctx.beginPath();
        ctx.arc(0, 0, coin.r, 0, Math.PI * 2);
        ctx.fillStyle = '#FFD700';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#FFA500';
        ctx.stroke();
        
        // Core glyph
        ctx.fillStyle = '#09101f';
        ctx.font = '700 12px "Exo 2", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✦', 0, 1);
        
        ctx.restore();
    });

    // Draw Player (signal courier emoji)
    ctx.save();
    ctx.translate(state.player.x, state.player.y);
    ctx.rotate(state.player.rotation);
    ctx.scale(1, state.player.squash); // Squash effect
    
    // Aura + face
    const pulse = 1 + Math.sin(state.time * 8) * 0.05;
    ctx.scale(pulse, pulse);
    ctx.shadowColor = 'rgba(255, 217, 92, 0.65)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#FFD95C';
    ctx.beginPath();
    ctx.roundRect(-20, -20, 40, 40, 12);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#09101f';
    ctx.stroke();

    // Blush plates
    ctx.fillStyle = 'rgba(255, 121, 190, 0.55)';
    ctx.beginPath();
    ctx.ellipse(-13, 5, 4.5, 3, 0, 0, Math.PI * 2);
    ctx.ellipse(13, 5, 4.5, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-8, -5, 8, 0, Math.PI * 2);
    ctx.arc(8, -5, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Pupils
    ctx.fillStyle = '#09101f';
    ctx.beginPath();
    ctx.arc(-8 + Math.sin(state.time * 20) * 3, -5, 3, 0, Math.PI * 2);
    ctx.arc(8 - Math.sin(state.time * 20) * 3, -5, 3, 0, Math.PI * 2);
    ctx.fill();

    // Eyebrows
    ctx.strokeStyle = '#09101f';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-15, -15);
    ctx.lineTo(-4, -12);
    ctx.moveTo(15, -15);
    ctx.lineTo(4, -12);
    ctx.stroke();

    // Mouth
    ctx.fillStyle = '#09101f';
    ctx.beginPath();
    ctx.arc(0, 10, 8, 0, Math.PI, false);
    ctx.fill();

    // Spark helmet icon
    ctx.fillStyle = '#59dcff';
    ctx.beginPath();
    ctx.moveTo(0, -26);
    ctx.lineTo(5, -18);
    ctx.lineTo(1, -18);
    ctx.lineTo(6, -10);
    ctx.lineTo(-2, -16);
    ctx.lineTo(2, -16);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // Draw Particles
    state.particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        
        if (p.type === 'text') {
            ctx.font = '700 18px "Exo 2", sans-serif';
            ctx.fillStyle = p.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeText(p.text, 0, 0);
            ctx.fillText(p.text, 0, 0);
        } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(-3, -3, 6, 6);
        }
        ctx.restore();
    });

    ctx.restore();
}

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', () => {
    audio.init();
    
    // Asset Preload check
    const bgm = document.getElementById('bgm_main');
    if (bgm) {
        audio.loadSound('bgm', bgm.src);
    }
    const sfxJump = document.getElementById('sfx_jump');
    if (sfxJump) {
        audio.loadSound('sfx_jump', sfxJump.src);
    }
    const sfxScore = document.getElementById('sfx_score');
    if (sfxScore) {
        audio.loadSound('sfx_score', sfxScore.src);
    }
    const sfxDie = document.getElementById('sfx_die');
    if (sfxDie) {
        audio.loadSound('sfx_die', sfxDie.src);
    }
    const sfxUi = document.getElementById('sfx_ui');
    if (sfxUi) {
        audio.loadSound('sfx_ui', sfxUi.src);
    }

    resize();
    
    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.playSfx('sfx_ui', 'ui', { volume: 0.55, cooldown: 250 });
        initGame();
    });
    
    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.playSfx('sfx_ui', 'ui', { volume: 0.55, cooldown: 250 });
        initGame();
    });

    // Start Loop
    requestAnimationFrame(loop);
});

</script>
