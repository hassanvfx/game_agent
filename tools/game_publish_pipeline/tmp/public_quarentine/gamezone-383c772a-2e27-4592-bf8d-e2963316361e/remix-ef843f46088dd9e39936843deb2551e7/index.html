    <script>
        /**
         * Portal Panic: Multiverse Getaway - Single File MVP
         * Mobile-First, Touch-Optimized
         */

        // --- 1. Audio System ---
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3",
                crash: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_defeat_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3"
            }
        };

        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.enabled = true;
                this.started = false;
                this.sfx = {};
                this.sfxCooldowns = new Map();

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                this.started = true;
            }

            playBGM() {
                if (!this.enabled || !this.started) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM(reset = true) {
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }

            playSFX(key, { volume, debounce = 90 } = {}) {
                if (!this.enabled || !this.started) return;
                const sound = this.sfx[key];
                if (!sound) return;

                const now = performance.now();
                const last = this.sfxCooldowns.get(key) || 0;
                if (now - last < debounce) return;
                this.sfxCooldowns.set(key, now);

                const clone = sound.cloneNode();
                clone.volume = volume ?? (key === 'crash' ? 0.5 : key === 'warning' ? 0.38 : 0.62);
                clone.play().catch(() => {});
            }
        }

        // --- 2. Game State & Config ---
        const GAME = {
            width: 0,
            height: 0,
            active: false,
            score: 0,
            wantedLevel: 0,
            frameCount: 0,
            shake: 0,
            camX: 0,
            camY: 0
        };

        const KEYS = {
            left: false,
            right: false,
            gas: false,
            brake: false
        };

        // Entities
        let player = {};
        let enemies = [];
        let cash = [];
        let particles = [];
        let tireTracks = [];
            let decor = []; // Decorative dimension props; spawning/count mechanics preserved.

        const audio = new AudioController();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        const crashGif = document.getElementById('crash-gif');
        const failGif = document.getElementById('fail-gif');
        let crashGifTimer = null;
        let failGifTimer = null;

        function flashGif(el, duration = 900) {
            if (!el) return;
            el.classList.add('show');
            const timerName = el === crashGif ? 'crashGifTimer' : 'failGifTimer';
            clearTimeout(window[timerName]);
            window[timerName] = setTimeout(() => el.classList.remove('show'), duration);
        }

        // --- 3. Initialization ---
        function resize() {
            GAME.width = window.innerWidth;
            GAME.height = window.innerHeight;
            canvas.width = GAME.width;
            canvas.height = GAME.height;
        }
        window.addEventListener('resize', resize);
        resize();

        function resetGame() {
            GAME.score = 0;
            GAME.wantedLevel = 0;
            GAME.frameCount = 0;
            GAME.shake = 0;
            
            player = {
                x: 0, y: 0,
                angle: -Math.PI/2,
                speed: 0,
                maxSpeed: 16,
                health: 100,
                color: '#39ff88'
            };

            enemies = [];
            cash = [];
            particles = [];
            tireTracks = [];
            decor = [];

            // Initial Decor
            for(let i=0; i<20; i++) spawnDecor(true);
            // Initial Cash
            for(let i=0; i<5; i++) spawnCash();

            hideFeedback();
            updateHUD();
        }

        // --- 4. Input Handling ---
        // Touch
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            const setKeyState = (pressed, shouldPreventDefault = false) => (e) => {
                if (shouldPreventDefault) e.preventDefault();
                KEYS[key] = pressed;
            };
            // [agent-note][stage4] repaired: mobile-action-path | scope touch suppression to gameplay controls only so menu CTA taps keep native click behavior
            el.addEventListener('touchstart', setKeyState(true, true), { passive: false });
            el.addEventListener('touchend', setKeyState(false, true), { passive: false });
            el.addEventListener('touchcancel', setKeyState(false, true), { passive: false });
            el.addEventListener('mousedown', setKeyState(true));
            el.addEventListener('mouseup', setKeyState(false));
            el.addEventListener('mouseleave', setKeyState(false));
        };

        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-gas', 'gas');
        bindTouch('btn-brake', 'brake');

        // Keyboard Fallback (for testing)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') KEYS.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') KEYS.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') KEYS.gas = true;
            if (e.key === 'ArrowDown' || e.key === 's') KEYS.brake = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') KEYS.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') KEYS.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') KEYS.gas = false;
            if (e.key === 'ArrowDown' || e.key === 's') KEYS.brake = false;
        });

        // --- 5. Game Logic ---
        function spawnDecor(randomPos = false) {
            const angle = Math.random() * Math.PI * 2;
            const dist = randomPos ? Math.random() * 1000 : 1200;
            decor.push({
                x: player.x + Math.cos(angle) * dist,
                y: player.y + Math.sin(angle) * dist,
                scale: 0.8 + Math.random() * 0.4,
                rotation: Math.random() * Math.PI * 2
            });
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 1000; // Spawn offscreen
            enemies.push({
                x: player.x + Math.cos(angle) * dist,
                y: player.y + Math.sin(angle) * dist,
                angle: angle + Math.PI, // Face player roughly
                speed: 10,
                maxSpeed: 12 + (GAME.wantedLevel * 1.5),
                health: 50,
                sirenOffset: Math.random() * 100
            });
        }

        function spawnCash() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 400 + Math.random() * 600;
            cash.push({
                x: player.x + Math.cos(angle) * dist,
                y: player.y + Math.sin(angle) * dist,
                val: 100 + (GAME.wantedLevel * 50)
            });
        }

        function createParticles(x, y, count, color) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.0,
                    color: color
                });
            }
        }

        function hideFeedback() {
            crashGif.classList.remove('show');
            failGif.classList.remove('show');
            clearTimeout(crashGifTimer);
            clearTimeout(failGifTimer);
        }

        function update() {
            GAME.frameCount++;

            // Player Physics
            if (KEYS.gas) player.speed += 0.5;
            if (KEYS.brake) player.speed -= 0.6;
            
            // Drag
            player.speed *= 0.97;
            
            // Steering
            if (Math.abs(player.speed) > 0.5) {
                // Drifting factor: turning is sharper at speed but slides
                let turnFactor = 0.08;
                if (KEYS.brake && Math.abs(player.speed) > 8) turnFactor = 0.12; // Handbrake turn
                
                if (KEYS.left) player.angle -= turnFactor * Math.sign(player.speed);
                if (KEYS.right) player.angle += turnFactor * Math.sign(player.speed);
            }

            player.x += Math.cos(player.angle) * player.speed;
            player.y += Math.sin(player.angle) * player.speed;

            // Tire Tracks
            if ((Math.abs(player.speed) > 10 && (KEYS.left || KEYS.right)) || KEYS.brake && Math.abs(player.speed) > 5) {
                if (GAME.frameCount % 3 === 0) {
                    tireTracks.push({
                        x: player.x, y: player.y,
                        angle: player.angle,
                        life: 1.0,
                        width: 16
                    });
                }
            }

            // Camera
            let targetX = player.x - GAME.width / 2;
            let targetY = player.y - GAME.height / 2;
            GAME.camX += (targetX - GAME.camX) * 0.1;
            GAME.camY += (targetY - GAME.camY) * 0.1;

            // Wanted Level Logic
            let prevWanted = GAME.wantedLevel;
            GAME.wantedLevel = Math.min(5, Math.floor(GAME.score / 1000));
            if (GAME.wantedLevel > prevWanted) {
                audio.playSFX('warning', { volume: 0.42, debounce: 500 });
            }

            // Enemies
            let maxEnemies = 2 + GAME.wantedLevel;
            if (enemies.length < maxEnemies && Math.random() < 0.02) spawnEnemy();

            enemies.forEach((en, i) => {
                // AI Follow
                let dx = player.x - en.x;
                let dy = player.y - en.y;
                let targetAngle = Math.atan2(dy, dx);
                
                // Smooth turn
                let diff = targetAngle - en.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                en.angle += diff * 0.08;

                // Speed up
                if (en.speed < en.maxSpeed) en.speed += 0.3;
                
                en.x += Math.cos(en.angle) * en.speed;
                en.y += Math.sin(en.angle) * en.speed;

                // Collision
                let d = Math.hypot(player.x - en.x, player.y - en.y);
                if (d < 50) {
                    audio.playSFX('crash', { volume: 0.5, debounce: 180 });
                    flashGif(crashGif, 700);
                    GAME.shake = 10;
                    createParticles((player.x + en.x)/2, (player.y + en.y)/2, 8, '#ffffff');
                    
                    // Bounce
                    let pushAngle = Math.atan2(player.y - en.y, player.x - en.x);
                    player.speed = 8;
                    player.angle = pushAngle;
                    player.x += Math.cos(pushAngle) * 15;
                    player.y += Math.sin(pushAngle) * 15;
                    
                    en.speed = -5;
                    player.health -= 10;
                    updateHUD();

                    if (player.health <= 0) gameOver();
                }
            });

            // Cash
            if (cash.length < 3) {
                if (Math.random() < 0.03) spawnCash();
            }
            for (let i = cash.length - 1; i >= 0; i--) {
                let c = cash[i];
                if (Math.hypot(player.x - c.x, player.y - c.y) < 60) {
                    GAME.score += c.val;
                    audio.playSFX('collect', { volume: 0.6, debounce: 120 });
                    cash.splice(i, 1);
                    player.health = Math.min(100, player.health + 5);
                    updateHUD();
                }
            }

            // Cleanup
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            });

            tireTracks.forEach((t, i) => {
                t.life -= 0.005;
                if (t.life <= 0) tireTracks.splice(i, 1);
            });

            // Remove far entities
            enemies = enemies.filter(e => Math.hypot(player.x - e.x, player.y - e.y) < 2000);
            decor = decor.filter(d => Math.hypot(player.x - d.x, player.y - d.y) < 2000);
            
            if (decor.length < 20) spawnDecor();

            // Shake decay
            GAME.shake *= 0.9;
            if (GAME.shake < 0.5) GAME.shake = 0;
        }

        function updateHUD() {
            document.getElementById('score').innerText = GAME.score;
            const hpBar = document.getElementById('health-bar');
            hpBar.style.width = Math.max(0, player.health) + '%';
            
            // Color shift based on HP
            if (player.health < 30) {
                hpBar.className = "h-full bg-red-600 w-full transition-all duration-200 animate-pulse";
            } else {
                hpBar.className = "h-full bg-gradient-to-r from-green-500 to-green-400 w-full transition-all duration-200";
            }

            // Stars
            const stars = document.getElementById('wanted-stars').children;
            for(let i=0; i<5; i++) {
                if (i < GAME.wantedLevel) {
                    stars[i].className = "text-yellow-400 text-xl drop-shadow-[0_0_5px_rgba(250,204,21,0.8)]";
                } else {
                    stars[i].className = "text-gray-700 text-xl";
                }
            }
        }

        // --- 6. Rendering ---
        function drawCar(x, y, angle, color, isPolice) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const accent = isPolice ? '#35f3ff' : '#d8ff5b';
            const underGlow = isPolice ? 'rgba(53, 243, 255, 0.22)' : 'rgba(57, 255, 136, 0.34)';

            // Shadow + non-colliding glow; visual dimensions remain close to the original vehicle.
            ctx.fillStyle = 'rgba(0,0,0,0.58)';
            ctx.beginPath();
            ctx.ellipse(0, 5, 34, 19, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = underGlow;
            ctx.beginPath();
            ctx.ellipse(-4, 14, 28, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            const bodyGradient = ctx.createLinearGradient(-29, 0, 29, 0);
            bodyGradient.addColorStop(0, isPolice ? '#09121f' : '#0b2e23');
            bodyGradient.addColorStop(0.48, isPolice ? '#1b2f4a' : color);
            bodyGradient.addColorStop(1, isPolice ? '#244f68' : '#9b5cff');

            // Bold cartoon pod/cruiser silhouette.
            ctx.fillStyle = bodyGradient;
            ctx.strokeStyle = 'rgba(1, 7, 10, 0.94)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-28, -2);
            ctx.quadraticCurveTo(-22, -17, 8, -16);
            ctx.quadraticCurveTo(29, -13, 32, 0);
            ctx.quadraticCurveTo(29, 13, 8, 16);
            ctx.quadraticCurveTo(-22, 17, -28, 2);
            ctx.lineTo(-34, 0);
            ctx.closePath();
            ctx.stroke();
            ctx.fill();

            ctx.strokeStyle = isPolice ? 'rgba(53, 243, 255, 0.78)' : 'rgba(216, 255, 91, 0.76)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Cockpit dome / Council badge.
            const cockpitGradient = ctx.createRadialGradient(5, -5, 2, 3, 0, 18);
            cockpitGradient.addColorStop(0, 'rgba(236, 250, 255, 0.9)');
            cockpitGradient.addColorStop(0.35, isPolice ? '#35f3ff' : '#35f3ff');
            cockpitGradient.addColorStop(1, '#06131b');
            ctx.fillStyle = cockpitGradient;
            ctx.beginPath();
            ctx.ellipse(5, 0, isPolice ? 13 : 15, isPolice ? 9 : 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(236, 250, 255, 0.42)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Portal engine ring and trim.
            ctx.strokeStyle = accent;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-25, 0, 9, Math.PI * 0.35, Math.PI * 1.65);
            ctx.stroke();

            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-14, -9);
            ctx.lineTo(18, -8);
            ctx.moveTo(-14, 9);
            ctx.lineTo(18, 8);
            ctx.stroke();

            if (isPolice) {
                const blink = Math.floor(GAME.frameCount / 10) % 2 === 0;
                ctx.fillStyle = blink ? '#ff5e72' : '#35f3ff';
                ctx.shadowBlur = 18;
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.roundRect(-9, -18, 18, 5, 3);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(236, 250, 255, 0.72)';
                ctx.font = 'bold 9px "Exo 2", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('C-137', 0, 4);

                ctx.fillStyle = '#020617';
                ctx.fillRect(-20, -14, 7, 4);
                ctx.fillRect(12, -14, 7, 4);
                ctx.fillRect(-20, 10, 7, 4);
                ctx.fillRect(12, 10, 7, 4);
            } else {
                ctx.fillStyle = 'rgba(216, 255, 91, 0.36)';
                ctx.beginPath();
                ctx.ellipse(-6, 0, 26, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#35f3ff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#35f3ff';
                ctx.beginPath();
                ctx.arc(-15, -3, 2.5, 0, Math.PI * 2);
                ctx.arc(14, -3, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(57, 255, 136, 0.82)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-31, -8);
                ctx.lineTo(-38, -15);
                ctx.moveTo(-30, 8);
                ctx.lineTo(-38, 15);
                ctx.stroke();
            }

            // Forward lamps stay bright and small for readability.
            ctx.fillStyle = '#ecfaff';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#d8ff5b';
            ctx.fillRect(28, -7, 4, 5);
            ctx.fillRect(28, 2, 4, 5);
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function draw() {
            // Level-reactive procedural void foundation; no image backdrop owns the scene.
            const alert = GAME.wantedLevel;
            const skyGradient = ctx.createLinearGradient(0, 0, 0, GAME.height);
            skyGradient.addColorStop(0, alert >= 5 ? '#02050b' : alert >= 3 ? '#120609' : '#061421');
            skyGradient.addColorStop(0.5, alert >= 2 ? '#11132c' : '#071b24');
            skyGradient.addColorStop(1, '#04120c');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, GAME.width, GAME.height);

            // Screen-space portal haze stays behind all gameplay.
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.globalAlpha = 0.55;
            const haze = ctx.createRadialGradient(GAME.width * 0.54, GAME.height * 0.5, 20, GAME.width * 0.54, GAME.height * 0.5, Math.max(GAME.width, GAME.height) * 0.62);
            haze.addColorStop(0, 'rgba(57, 255, 136, 0.12)');
            haze.addColorStop(0.42, 'rgba(53, 243, 255, 0.035)');
            haze.addColorStop(1, 'rgba(155, 92, 255, 0)');
            ctx.fillStyle = haze;
            ctx.fillRect(0, 0, GAME.width, GAME.height);
            ctx.restore();

            ctx.save();
            // Camera Shake
            let sx = (Math.random() - 0.5) * GAME.shake;
            let sy = (Math.random() - 0.5) * GAME.shake;
            ctx.translate(-GAME.camX + sx, -GAME.camY + sy);

            // Portal test grid / Citadel lane foundation
            const gridSize = 200;
            const startX = Math.floor(GAME.camX / gridSize) * gridSize;
            const startY = Math.floor(GAME.camY / gridSize) * gridSize;

            ctx.save();
            ctx.globalAlpha = 0.88;
            ctx.strokeStyle = alert >= 3 ? 'rgba(255, 94, 114, 0.14)' : 'rgba(57, 255, 136, 0.16)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = startX; x < startX + GAME.width + gridSize; x += gridSize) {
                ctx.moveTo(x, startY - gridSize);
                ctx.lineTo(x, startY + GAME.height + 2 * gridSize);
            }
            for (let y = startY; y < startY + GAME.height + gridSize; y += gridSize) {
                ctx.moveTo(startX - gridSize, y);
                ctx.lineTo(startX + GAME.width + 2 * gridSize, y);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(53, 243, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = startX + gridSize / 2; x < startX + GAME.width + gridSize; x += gridSize) {
                ctx.moveTo(x, startY - gridSize);
                ctx.lineTo(x, startY + GAME.height + 2 * gridSize);
            }
            for (let y = startY + gridSize / 2; y < startY + GAME.height + gridSize; y += gridSize) {
                ctx.moveTo(startX - gridSize, y);
                ctx.lineTo(startX + GAME.width + 2 * gridSize, y);
            }
            ctx.stroke();
            ctx.restore();

            // Parallax Citadel panel silhouettes: atmospheric only.
            ctx.save();
            ctx.globalAlpha = 0.22 + alert * 0.025;
            for (let i = -1; i < 7; i++) {
                const towerX = startX + i * 260 + ((GAME.frameCount * 0.18 + i * 77) % 90);
                const towerY = startY + 90 + (i % 2) * 90;
                const h = 190 + (i % 3) * 48;
                ctx.fillStyle = i % 2 ? 'rgba(53, 243, 255, 0.13)' : 'rgba(57, 255, 136, 0.1)';
                ctx.beginPath();
                ctx.moveTo(towerX, towerY + h);
                ctx.lineTo(towerX + 34, towerY);
                ctx.lineTo(towerX + 86, towerY + 22);
                ctx.lineTo(towerX + 120, towerY + h);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(236, 250, 255, 0.09)';
                ctx.stroke();
            }
            ctx.restore();

            // Non-mechanical portal rings: decorative only, tied to existing score-derived alert state.
            const ringCount = 4 + alert;
            for (let i = 0; i < ringCount; i++) {
                const px = startX + ((i * 379 + Math.floor(GAME.frameCount * (0.35 + alert * 0.02))) % (GAME.width + gridSize * 2)) - gridSize;
                const py = startY + ((i * 257 + Math.floor(GAME.frameCount * 0.22)) % (GAME.height + gridSize * 2)) - gridSize;
                const radius = 58 + (i % 3) * 24 + Math.sin(GAME.frameCount * 0.025 + i) * (5 + alert);
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(GAME.frameCount * (0.006 + alert * 0.001) + i);
                ctx.globalCompositeOperation = 'screen';
                ctx.strokeStyle = i % 2 === 0 ? 'rgba(57, 255, 136, 0.2)' : 'rgba(155, 92, 255, 0.16)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(0, 0, radius, radius * 0.54, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(216, 255, 91, 0.13)';
                ctx.lineWidth = 2;
                ctx.setLineDash([18, 12]);
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 1.7);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            // Scanner lanes, mutation scars, warning chevrons, and omega lightning are visual-only alert beats.
            if (alert >= 1) {
                ctx.save();
                ctx.globalAlpha = Math.min(0.16, 0.07 + alert * 0.025);
                ctx.strokeStyle = '#35f3ff';
                ctx.lineWidth = 8;
                const sweepY = startY + ((GAME.frameCount * 2.2) % (GAME.height + gridSize)) - gridSize / 2;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(startX - gridSize, sweepY + i * 160);
                    ctx.lineTo(startX + GAME.width + gridSize * 2, sweepY + i * 160 - 80);
                    ctx.stroke();
                }
                ctx.restore();
            }

            if (alert >= 2) {
                ctx.save();
                ctx.strokeStyle = 'rgba(155, 92, 255, 0.2)';
                ctx.lineWidth = 5;
                for (let i = 0; i < 5; i++) {
                    const rx = startX + i * 240 + 60;
                    const ry = startY + ((i * 191 + GAME.frameCount) % (GAME.height + gridSize)) - gridSize;
                    ctx.beginPath();
                    ctx.moveTo(rx, ry);
                    ctx.bezierCurveTo(rx + 40, ry - 38, rx + 78, ry + 48, rx + 124, ry);
                    ctx.stroke();
                }
                ctx.restore();
            }

            if (alert >= 3) {
                ctx.save();
                ctx.globalAlpha = 0.16;
                ctx.fillStyle = '#ff5e72';
                for (let i = 0; i < 7; i++) {
                    const cx = startX + i * 170;
                    const cy = startY + 60 + ((i * 137 + GAME.frameCount * 1.1) % (GAME.height + 300)) - 150;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + 34, cy + 18);
                    ctx.lineTo(cx, cy + 36);
                    ctx.lineTo(cx + 9, cy + 18);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }

            if (alert >= 5) {
                ctx.save();
                ctx.strokeStyle = 'rgba(236, 250, 255, 0.28)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 4; i++) {
                    const lx = startX + 80 + i * 230;
                    const ly = startY + ((i * 233 + GAME.frameCount * 3) % (GAME.height + 240)) - 120;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly);
                    ctx.lineTo(lx + 22, ly + 36);
                    ctx.lineTo(lx - 6, ly + 58);
                    ctx.lineTo(lx + 42, ly + 108);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Tire Tracks
            tireTracks.forEach(t => {
                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.angle);
                ctx.fillStyle = `rgba(0,0,0,${t.life * 0.5})`;
                ctx.fillRect(-20, -8, 10, 4);
                ctx.fillRect(-20, 4, 10, 4);
                ctx.restore();
            });

            // Cash
            cash.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                const scale = 1 + Math.sin(GAME.frameCount * 0.1) * 0.1;
                ctx.scale(scale, scale);
                
                // Glow
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#4ade80';
                
                // Portal crystal / dimension sample
                ctx.fillStyle = '#123b2a';
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(17, 0);
                ctx.lineTo(0, 18);
                ctx.lineTo(-17, 0);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#7dffcf';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(216, 255, 91, 0.42)';
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(8, 0);
                ctx.lineTo(0, 10);
                ctx.lineTo(-8, 0);
                ctx.closePath();
                ctx.fill();
                
                // Icon
                ctx.fillStyle = '#d8ff5b';
                ctx.font = 'bold 16px "Audiowide", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✦', 0, 6);
                
                ctx.restore();
            });

            // Enemies
            enemies.forEach(en => {
                drawCar(en.x, en.y, en.angle, '#000', true);
                
                // Siren Cones
                ctx.save();
                ctx.translate(en.x, en.y);
                ctx.rotate(en.angle);
                ctx.globalCompositeOperation = 'screen';
                
                const blink = Math.floor(GAME.frameCount / 10) % 2;
                if(blink) {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.2)'; // Red
                    ctx.beginPath();
                    ctx.moveTo(0, -10);
                    ctx.arc(0, -10, 200, -Math.PI/2 - 0.4, -Math.PI/2 + 0.4);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(59, 130, 246, 0.2)'; // Blue
                    ctx.beginPath();
                    ctx.moveTo(0, 10);
                    ctx.arc(0, 10, 200, Math.PI/2 - 0.4, Math.PI/2 + 0.4);
                    ctx.fill();
                }
                ctx.restore();
            });

            // Player
            drawCar(player.x, player.y, player.angle, player.color, false);

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Decor (dimension props drawn after gameplay objects; decorative only)
            decor.forEach(d => {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rotation);
                ctx.scale(d.scale, d.scale);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.beginPath();
                ctx.arc(10, 10, 34, 0, Math.PI*2);
                ctx.fill();

                // Alien scanner mast / garage science prop
                ctx.strokeStyle = 'rgba(57, 255, 136, 0.55)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 28);
                ctx.lineTo(0, -26);
                ctx.stroke();

                ctx.fillStyle = '#0a6b5b';
                ctx.beginPath();
                ctx.arc(0, -28, 14, 0, Math.PI*2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(216, 255, 91, 0.55)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(0, -28, 34, 13, 0, 0, Math.PI*2);
                ctx.stroke();

                ctx.fillStyle = '#9b5cff';
                ctx.beginPath();
                ctx.arc(0, 28, 9, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            });

            ctx.restore();
        }

        function gameLoop() {
            if (!GAME.active) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            GAME.active = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.7, debounce: 400 });
            flashGif(failGif, 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = GAME.score;
        }

        // --- 7. UI Events ---
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.65, debounce: 300 });
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            // Fullscreen attempt
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            audio.playBGM();
            resetGame();
            GAME.active = true;
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('ui', { volume: 0.58, debounce: 300 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            resetGame();
            GAME.active = true;
            gameLoop();
        });

    </script>
</body>
</html>
