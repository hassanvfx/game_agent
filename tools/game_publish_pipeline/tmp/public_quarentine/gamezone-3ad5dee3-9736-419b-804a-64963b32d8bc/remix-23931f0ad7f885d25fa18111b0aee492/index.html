<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Streamer Tycoon: Viral Rush</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage3] resolved-font: title->Audiowide, ui->Exo 2 via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080d1f;
            --bg-secondary: #101935;
            --panel: rgba(10, 18, 40, 0.78);
            --panel-strong: rgba(18, 29, 62, 0.92);
            --line: rgba(125, 211, 252, 0.22);
            --line-strong: rgba(244, 114, 182, 0.46);
            --text: #f8fbff;
            --muted: rgba(226, 232, 240, 0.68);
            --hero: #f472b6;
            --hero-2: #a78bfa;
            --accent: #22d3ee;
            --coin: #fbbf24;
            --danger: #fb7185;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(244, 114, 182, 0.18), transparent 30%),
                radial-gradient(circle at bottom, rgba(34, 211, 238, 0.14), transparent 28%),
                linear-gradient(180deg, #0b1024 0%, var(--bg) 50%, #050814 100%);
            color: var(--text);
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(transparent 0%, rgba(34, 211, 238, 0.03) 48%, rgba(244, 114, 182, 0.045) 52%, transparent 100%),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px);
            mix-blend-mode: screen;
            opacity: 0.35;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            background: linear-gradient(180deg, rgba(13, 23, 49, 0.88) 0%, rgba(8, 15, 34, 0.74) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .glass-btn {
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.22) 0%, rgba(16, 24, 52, 0.8) 100%);
            border: 1px solid rgba(125, 211, 252, 0.22);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }
        .glass-btn:active { transform: scale(0.95); background: rgba(59,130,246,0.28); }
        .hidden { display: none !important; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .currency-icon { filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        .brand-title, .title-font { font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif; letter-spacing: 0.08em; }
        .hud-chip {
            min-width: 0;
            border: 1px solid rgba(244, 114, 182, 0.16);
            background: linear-gradient(180deg, rgba(12, 18, 37, 0.92), rgba(8, 14, 30, 0.76));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }
        .hero-card {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line-strong);
            background:
                radial-gradient(circle at top, rgba(244, 114, 182, 0.22), transparent 44%),
                linear-gradient(180deg, rgba(26, 35, 73, 0.96), rgba(10, 16, 36, 0.94));
            box-shadow: 0 18px 42px rgba(2, 6, 23, 0.56), 0 0 28px rgba(167, 139, 250, 0.14);
        }
        .hero-card::after {
            content: '';
            position: absolute;
            inset: auto -10% -35% -10%;
            height: 50%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.24), transparent 60%);
            pointer-events: none;
        }
        .avatar-ring {
            position: relative;
            width: 108px;
            height: 108px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--hero), var(--accent));
            box-shadow: 0 0 22px rgba(244, 114, 182, 0.42);
        }
        .avatar-ring img {
            width: 88px;
            height: 88px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255,255,255,0.6);
            padding: 4px;
        }
        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.9);
            animation: pulseDot 1.5s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.35); opacity: 0.45; }
        }
        .shop-scroll::-webkit-scrollbar { width: 4px; }
        .shop-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .shop-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .reaction-gif {
            position: absolute;
            right: 12px;
            bottom: 108px;
            width: min(26vw, 118px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.22);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(16px) scale(0.88);
            transition: opacity 0.24s ease, transform 0.24s ease;
            object-fit: cover;
            background: rgba(15, 23, 42, 0.78);
        }
        .reaction-gif-right {
            left: 12px;
            right: auto;
            bottom: 132px;
        }
        .reaction-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .hero-shell {
            width: min(calc(100% - 3rem), 24rem);
        }
        @media (max-width: 480px) {
            .hero-shell {
                width: min(calc(100% - 2rem), 24rem);
            }
            #start-screen { padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
            #game-over-screen { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
            #shop-modal { padding-bottom: env(safe-area-inset-bottom); }
            #shop-content { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
            #start-btn, #restart-btn, #close-shop, #btn-upgrade-multi { min-height: 44px; }
            #start-btn { width: 100%; }
            .glass.hud-chip { max-width: 100%; }
            #hud .glass.hud-chip { gap: 0.75rem; padding-left: 0.75rem; padding-right: 0.75rem; }
            #shop-content { padding-left: 1rem; padding-right: 1rem; }
            #shop-modal > div:first-child { padding-left: 1rem; padding-right: 1rem; }
        }
        @media (max-height: 760px) {
            #start-screen { justify-content: flex-start; gap: 1rem; }
            .hero-shell { margin-top: 0.25rem; margin-bottom: 0.25rem; }
        }
        @media (max-width: 480px) {
            #hud { padding: 12px; }
            .avatar-ring { width: 92px; height: 92px; }
            .avatar-ring img { width: 74px; height: 74px; }
            .reaction-gif {
                width: min(28vw, 92px);
                right: 8px;
                bottom: 96px;
            }
            .reaction-gif-right {
                left: 8px;
                bottom: 116px;
            }
        }
    </style>
</head>
<body>

<!-- §6 Config Protocol -->
<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Streamer Speed", "value": 18, "min": 5, "max": 30 },
    "spawnRate": { "type": "number", "label": "Hype Rate", "value": 1.5, "min": 0.5, "max": 3.0 },

}

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full select-none bg-slate-900 overflow-hidden text-white font-sans">
    <canvas id="gameCanvas"></canvas>
    
    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start hidden z-10 pointer-events-none">
        <div class="glass hud-chip px-4 py-2 rounded-full flex items-center gap-4">
            <div class="flex flex-col items-center">
                <span id="score" class="text-white text-2xl font-bold leading-none title-font">0</span>
                <span class="text-xs text-white/60">Followers</span>
            </div>
            <div class="h-8 w-px bg-white/20"></div>
            <div class="flex gap-3">
                <div class="flex items-center gap-1">
                    <span class="text-yellow-400 text-lg">💰</span>
                    <span id="hud-coins" class="text-sm font-semibold">0</span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="text-cyan-400 text-lg">💎</span>
                    <span id="hud-diamonds" class="text-sm font-semibold">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Menu / Lobby -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-between py-8 bg-slate-900/90 backdrop-blur-md transition-all duration-300 overflow-y-auto">
        
        <!-- Top Bar: Currency -->
        <div class="w-full px-6 flex justify-between items-center">
            <div class="glass hud-chip px-4 py-2 rounded-full flex gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-xl">💰</span>
                    <span id="menu-coins" class="font-bold text-yellow-400 title-font">0</span>
                </div>
                <div class="w-px h-6 bg-white/20"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xl">💎</span>
                    <span id="menu-diamonds" class="font-bold text-cyan-400 title-font">0</span>
                </div>
            </div>
            <div class="glass hud-chip px-3 py-2 rounded-full text-xs text-white/60 title-font tracking-[0.2em]">
                VER 2.1
            </div>
        </div>

        <!-- Center: Title & Play -->
        <!-- [agent-note][stage4] repaired: mobile-width-actionability | element: start hero card | action: replaced invalid arbitrary width with safe calc wrapper -->
        <div class="hero-card hero-shell flex flex-col items-center gap-5 rounded-[32px] px-6 py-6 mx-6">
            <div class="flex flex-col items-center gap-3 text-center">
                <div class="avatar-ring">
                    <img src="data:image/svg+xml,%3Csvg xmlns='assets/www.w3.org/2000/svg.html' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f472b6'/%3E%3Cstop offset='100%25' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Ccircle cx='36' cy='38' r='6' fill='white'/%3E%3Ccircle cx='64' cy='38' r='6' fill='white'/%3E%3Cpath d='M28 62 Q50 76 72 62' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M14 28 L24 18 M86 28 L76 18' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Crect x='28' y='16' width='44' height='10' rx='5' fill='%230f172a' opacity='0.35'/%3E%3C/svg%3E" alt="" aria-hidden="true">
                </div>
                <div class="flex items-center gap-2 rounded-full border border-emerald-400/25 bg-emerald-400/10 px-3 py-1 text-[11px] uppercase tracking-[0.24em] text-emerald-200">
                    <span class="pulse-dot"></span>
                    Stream Persona Online
                </div>
                <div>
                    <h1 class="brand-title text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-fuchsia-300 to-cyan-300 tracking-tight mb-2">
                        STREAMER<br>TYCOON
                    </h1>
                    <p class="text-white/70 text-sm uppercase tracking-[0.35em]">Viral Rush</p>
                </div>
            </div>
            
            <button id="start-btn" class="group relative px-12 py-5 bg-gradient-to-r from-pink-500 via-fuchsia-500 to-cyan-500 rounded-2xl font-bold text-2xl shadow-xl shadow-pink-600/30 transition-all hover:scale-105 active:scale-95 overflow-hidden title-font tracking-[0.16em]">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500"></div>
                GO LIVE
            </button>
        </div>

        <!-- Bottom: Shop & Stats -->
        <div class="w-full px-6 max-w-md">
            <div class="glass rounded-2xl p-4 w-full border border-cyan-400/20">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-bold text-white/80 uppercase title-font tracking-[0.18em]">Studio Upgrades</h3>
                    <span class="text-xs text-white/40">SPEND WISELY</span>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-shop-skins" class="glass-btn p-3 rounded-xl flex flex-col items-center gap-1">
                        <span class="text-2xl">👕</span>
                        <span class="text-xs font-bold">WARDROBE</span>
                        <span class="text-[10px] text-yellow-400">Spend Coins</span>
                    </button>
                    <button id="btn-shop-multi" class="glass-btn p-3 rounded-xl flex flex-col items-center gap-1">
                        <span class="text-2xl">🚀</span>
                        <span class="text-xs font-bold">MULTIPLIER</span>
                        <span class="text-[10px] text-cyan-400">Spend Diamonds</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="hidden absolute inset-0 z-50 bg-slate-900/95 backdrop-blur-xl flex flex-col">
        <div class="p-6 flex justify-between items-center border-b border-cyan-300/10">
            <h2 class="text-2xl font-bold title-font tracking-[0.16em]">STUDIO STORE</h2>
            <button id="close-shop" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-xl">✕</button>
        </div>
        
        <div id="shop-content" class="flex-1 overflow-y-auto p-6 shop-scroll space-y-6">
            <!-- Multiplier Section -->
            <div class="glass p-4 rounded-xl border border-cyan-500/30">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-cyan-400">Viral Multiplier</h3>
                    <span id="multi-level" class="text-xs bg-cyan-900 text-cyan-300 px-2 py-1 rounded">LVL 1</span>
                </div>
                <p class="text-xs text-white/60 mb-4">Multiplies FOLLOWERS, Coins, and Diamonds gained per like.</p>
                <button id="btn-upgrade-multi" class="w-full py-3 bg-cyan-600 rounded-lg font-bold flex justify-center items-center gap-2 active:scale-95 transition-transform">
                    <span>UPGRADE</span>
                    <span class="text-xs bg-black/20 px-2 py-0.5 rounded text-white/90" id="multi-cost">💎 100</span>
                </button>
            </div>

            <!-- Skins Grid -->
            <div>
                <h3 class="font-bold text-white/80 mb-3">Skins Collection</h3>
                <div id="skins-grid" class="grid grid-cols-2 gap-3">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 backdrop-blur-md p-4">
        <div class="glass p-6 rounded-3xl text-center max-w-sm w-full border-t border-pink-300/25 max-h-[90vh] overflow-y-auto">
            <h2 class="text-3xl font-bold mb-1 text-white title-font tracking-[0.14em]">STREAM ENDED</h2>
            
            <div class="grid grid-cols-3 gap-2 my-6">
                <div class="bg-slate-800/50 p-2 rounded-lg">
                    <div class="text-[10px] text-white/40 uppercase">Followers</div>
                    <div class="text-xl font-bold text-pink-400" id="end-score">0</div>
                </div>
                <div class="bg-slate-800/50 p-2 rounded-lg">
                    <div class="text-[10px] text-white/40 uppercase">Coins</div>
                    <div class="text-xl font-bold text-yellow-400" id="end-coins">+0</div>
                </div>
                <div class="bg-slate-800/50 p-2 rounded-lg">
                    <div class="text-[10px] text-white/40 uppercase">Diamonds</div>
                    <div class="text-xl font-bold text-cyan-400" id="end-diamonds">+0</div>
                </div>
            </div>

            <button id="restart-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg transform transition active:scale-95">
                RETURN TO LOBBY
            </button>
        </div>
    </div>
</div>

    <!-- [agent-note][stage3] resolved-gif: collect/fail reactions -> catalogs/gifs.json | caution: keep off playfield -->
    <div id="reaction-layer" class="pointer-events-none absolute inset-0 z-40 overflow-hidden">
        <img id="collect-reaction" class="reaction-gif hidden" alt="Viral reward reaction" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp">
        <img id="fail-reaction" class="reaction-gif reaction-gif-right hidden" alt="Stream fail reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
    </div>

<script>
// §6 Config & Data Persistence
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) window.gameConfig[key] = val;
};

// Game Data / Tycoon Logic
const GameData = {
    coins: 0,
    diamonds: 0,
    multiplier: 1,
    unlockedSkins: ['skin_default'],
    currentSkin: 'skin_default',
    
    // Configs
    skins: [
        { id: 'skin_default', name: 'Rookie', cost: 0, color: '#ec4899' },
        { id: 'skin_gold', name: 'Gold Tier', cost: 2500, color: '#fcd34d' },
        { id: 'skin_cyber', name: 'Cyber Pro', cost: 5000, color: '#06b6d4' },
        { id: 'skin_dark', name: 'Dark Mode', cost: 10000, color: '#ef4444' }
    ],

    load() {
        const saved = localStorage.getItem('streamer_tycoon_v1');
        if (saved) {
            const data = JSON.parse(saved);
            this.coins = data.coins || 0;
            this.diamonds = data.diamonds || 0;
            this.multiplier = data.multiplier || 1;
            this.unlockedSkins = data.unlockedSkins || ['skin_default'];
            this.currentSkin = data.currentSkin || 'skin_default';
        }
        this.updateUI();
    },

    save() {
        localStorage.setItem('streamer_tycoon_v1', JSON.stringify({
            coins: this.coins,
            diamonds: this.diamonds,
            multiplier: this.multiplier,
            unlockedSkins: this.unlockedSkins,
            currentSkin: this.currentSkin
        }));
        this.updateUI();
    },

    getMultiCost() {
        return Math.floor(100 * Math.pow(1.5, this.multiplier - 1));
    },

    upgradeMulti() {
        const cost = this.getMultiCost();
        if (this.diamonds >= cost) {
            this.diamonds -= cost;
            this.multiplier++;
            this.save();
            return true;
        }
        return false;
    },

    buySkin(skinId) {
        const skin = this.skins.find(s => s.id === skinId);
        if (!skin) return false;
        if (this.coins >= skin.cost && !this.unlockedSkins.includes(skinId)) {
            this.coins -= skin.cost;
            this.unlockedSkins.push(skinId);
            this.currentSkin = skinId;
            this.save();
            return true;
        }
        return false;
    },

    equipSkin(skinId) {
        if (this.unlockedSkins.includes(skinId)) {
            this.currentSkin = skinId;
            this.save();
        }
    },

    updateUI() {
        // Update all currency counters
        ['menu-coins', 'hud-coins'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.innerText = this.coins.toLocaleString();
        });
        ['menu-diamonds', 'hud-diamonds'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.innerText = this.diamonds.toLocaleString();
        });
        
        // Shop UI Updates
        const multiBtn = document.getElementById('btn-upgrade-multi');
        const cost = this.getMultiCost();
        document.getElementById('multi-level').innerText = `LVL ${this.multiplier}`;
        document.getElementById('multi-cost').innerText = `💎 ${cost.toLocaleString()}`;
        if (this.diamonds < cost) multiBtn.classList.add('opacity-50');
        else multiBtn.classList.remove('opacity-50');

        this.renderSkins();
    },

    renderSkins() {
        const grid = document.getElementById('skins-grid');
        grid.innerHTML = '';
        this.skins.forEach(skin => {
            const unlocked = this.unlockedSkins.includes(skin.id);
            const equipped = this.currentSkin === skin.id;
            const canAfford = this.coins >= skin.cost;
            
            const div = document.createElement('div');
            div.className = `glass p-3 rounded-xl flex flex-col items-center gap-2 border ${equipped ? 'border-pink-500 bg-pink-500/10' : 'border-white/5'}`;
            
            // Preview
            const img = document.getElementById(skin.id).cloneNode();
            img.style.display = 'block';
            img.style.width = '48px';
            img.style.height = '48px';
            div.appendChild(img);

            // Info
            const name = document.createElement('div');
            name.className = 'text-xs font-bold';
            name.innerText = skin.name;
            div.appendChild(name);

            // Button
            const btn = document.createElement('button');
            btn.className = `w-full py-2 rounded-lg text-[10px] font-bold transition-all ${
                equipped ? 'bg-green-600 text-white' :
                unlocked ? 'bg-slate-700 text-white hover:bg-slate-600' :
                canAfford ? 'bg-yellow-600 text-white hover:bg-yellow-500' : 'bg-slate-800 text-white/30 cursor-not-allowed'
            }`;
            
            if (equipped) btn.innerText = 'EQUIPPED';
            else if (unlocked) btn.innerText = 'EQUIP';
            else btn.innerText = `💰 ${skin.cost.toLocaleString()}`;

            btn.onclick = () => {
                if (equipped) return;
                if (unlocked) {
                    this.equipSkin(skin.id);
                } else if (canAfford) {
                    if (this.buySkin(skin.id)) {
                        window.dispatchEvent(new CustomEvent('game-sfx', { detail: 'win' }));
                    }
                }
            };
            div.appendChild(btn);
            grid.appendChild(div);
        });
    }
};

// §5 Audio System
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.sounds = {};
        this.lastPlayed = {};
        this.bgmNode = document.getElementById('bgm_main');
        this.soundDefs = {
            collect: { nodeId: 'sfx_collect', fallback: 'beep', volume: 0.24, debounce: 70 },
            fail: { nodeId: 'sfx_fail', fallback: 'noise', volume: 0.34, debounce: 180 },
            win: { nodeId: 'sfx_win', fallback: 'chime', volume: 0.28, debounce: 120 },
            ui: { nodeId: 'sfx_ui', fallback: 'tick', volume: 0.16, debounce: 90 },
            open: { nodeId: 'sfx_open', fallback: 'rise', volume: 0.2, debounce: 140 },
            close: { nodeId: 'sfx_close', fallback: 'tick', volume: 0.18, debounce: 120 }
        };
    }
    init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const unlock = () => {
            if (!this.ctx || this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
            }).catch(() => {});
            ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock));
        Object.entries(this.soundDefs).forEach(([id, def]) => {
            const node = document.getElementById(def.nodeId);
            if (node?.src) this.load(id, node.src, def.fallback);
        });
    }
    async load(id, src, fallback) {
        if (!this.ctx) return;
        try {
            const res = await fetch(src);
            const buf = await res.arrayBuffer();
            this.sounds[id] = await this.ctx.decodeAudioData(buf);
        } catch (e) {
            this.sounds[id] = fallback;
        }
    }
    playBgm() {
        if (!this.unlocked || !this.bgmNode) return;
        this.bgmNode.volume = 0.22;
        if (this.bgmNode.paused) this.bgmNode.play().catch(() => {});
    }
    stopBgm() {
        if (!this.bgmNode) return;
        this.bgmNode.pause();
        this.bgmNode.currentTime = 0;
    }
    play(id) {
        if (!this.ctx || !this.unlocked) return;
        const def = this.soundDefs[id] || {};
        const now = performance.now();
        const debounce = def.debounce ?? 0;
        if (now - (this.lastPlayed[id] || 0) < debounce) return;
        this.lastPlayed[id] = now;
        const sound = this.sounds[id];
        if (typeof sound === 'string') {
            this.synth(sound, def.volume ?? 0.18);
            return;
        }
        if (!sound) return;
        const src = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        gain.gain.value = def.volume ?? 0.2;
        src.buffer = sound;
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(0);
    }
    synth(type, volume = 0.18) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        const t = this.ctx.currentTime;
        const stopAt = t + 0.18;
        osc.type = 'triangle';
        if (type === 'beep') {
            osc.frequency.setValueAtTime(740, t);
            osc.frequency.exponentialRampToValueAtTime(1180, stopAt);
        } else if (type === 'noise') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.exponentialRampToValueAtTime(48, t + 0.28);
        } else if (type === 'chime') {
            osc.frequency.setValueAtTime(880, t);
            osc.frequency.exponentialRampToValueAtTime(1320, stopAt);
        } else if (type === 'rise') {
            osc.frequency.setValueAtTime(420, t);
            osc.frequency.exponentialRampToValueAtTime(720, stopAt);
        } else {
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.exponentialRampToValueAtTime(620, stopAt);
        }
        gain.gain.setValueAtTime(volume, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + (type === 'noise' ? 0.28 : 0.18));
        osc.start(t);
        osc.stop(t + (type === 'noise' ? 0.28 : 0.18));
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();
    const collectReaction = document.getElementById('collect-reaction');
    const failReaction = document.getElementById('fail-reaction');
    let reactionTimer = null;

    const flashReaction = (type) => {
        const target = type === 'fail' ? failReaction : collectReaction;
        const other = type === 'fail' ? collectReaction : failReaction;
        if (!target) return;
        other?.classList.remove('show');
        other?.classList.add('hidden');
        target.classList.remove('hidden');
        requestAnimationFrame(() => target.classList.add('show'));
        clearTimeout(reactionTimer);
        reactionTimer = setTimeout(() => {
            target.classList.remove('show');
            setTimeout(() => target.classList.add('hidden'), 220);
        }, type === 'fail' ? 1100 : 800);
    };
    
    // Initialize Data
    GameData.load();
    
    // Game State
    let state = 'MENU';
    let score = 0;
    let sessionCoins = 0;
    let sessionDiamonds = 0;
    let time = 0;
    let lastTime = 0;
    let spawnTimer = 0;
    let shake = 0;
    
    const player = { x: 0.5, tx: 0.5 };
    let items = [];
    let particles = [];
    let floatTexts = [];
    
    // Background
    const bgStars = Array.from({length: 30}, () => ({
        x: Math.random(), y: Math.random(), 
        s: Math.random() * 0.05 + 0.01, 
        sp: Math.random() * 0.05 + 0.02
    }));

    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // Input
    let isDown = false;
    const input = (e) => {
        if (state !== 'PLAY') return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        player.tx = Math.max(0.1, Math.min(0.9, x));
        isDown = true;
    };
    canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); input(e); audio.init(); }, { passive: false });
    canvas.addEventListener('pointermove', (e) => { e.preventDefault(); if(isDown) input(e); }, { passive: false });
    ['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, (e) => { e.preventDefault(); isDown = false; }));

    const reset = () => {
        state = 'PLAY';
        score = 0;
        sessionCoins = 0;
        sessionDiamonds = 0;
        items = [];
        particles = [];
        floatTexts = [];
        player.x = 0.5;
        player.tx = 0.5;
        shake = 0;
        
        document.getElementById('score').innerText = '0';
        document.getElementById('hud-coins').innerText = GameData.coins.toLocaleString();
        document.getElementById('hud-diamonds').innerText = GameData.diamonds.toLocaleString();
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        flashReaction('collect');
        audio.play('win');
        audio.playBgm();
    };

    const spawn = () => {
        const isLike = Math.random() > 0.3;
        items.push({
            x: Math.random() * 0.8 + 0.1,
            y: -0.1,
            type: isLike ? 'like' : 'hater',
            speed: (Math.random() * 0.2 + 0.3) * (1 + score/150),
            rot: Math.random() * 6,
            rotS: (Math.random() - 0.5) * 4
        });
    };

    const addParticle = (x, y, color) => {
        for(let i=0; i<8; i++) {
            particles.push({
                x, y, 
                vx: (Math.random()-0.5)*0.5, 
                vy: (Math.random()-0.5)*0.5,
                life: 1, color, size: Math.random()*0.02+0.01
            });
        }
    };

    const addFloatText = (x, y, txt, color='#fff') => {
        floatTexts.push({ x, y, txt, life: 1.0, vy: -0.3, color });
    };

    const gameOver = () => {
        state = 'OVER';
        shake = 15;
        flashReaction('fail');
        audio.play('fail');
        audio.stopBgm();
        
        // Save earnings
        GameData.coins += sessionCoins;
        GameData.diamonds += sessionDiamonds;
        GameData.save();

        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('end-score').innerText = score;
        document.getElementById('end-coins').innerText = `+${sessionCoins}`;
        document.getElementById('end-diamonds').innerText = `+${sessionDiamonds}`;
    };

    const loop = (now) => {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        time += dt;

        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;

        if (state === 'PLAY') {
            const moveSpeed = window.gameConfig.heroSpeed * dt;
            const diff = player.tx - player.x;
            player.x += Math.sign(diff) * Math.min(Math.abs(diff), moveSpeed);

            spawnTimer += dt;
            if (spawnTimer > (1 / window.gameConfig.spawnRate)) {
                spawn();
                spawnTimer = 0;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed * dt;
                it.rot += it.rotS * dt;

                const dx = (player.x - it.x) * w;
                const dy = (0.85 - it.y) * h;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < w * 0.08) {
                    if (it.type === 'like') {
                        // Logic Update: Multiplier affects Score (Followers) too
                        const gainFollowers = 1 * GameData.multiplier;
                        score += gainFollowers;
                        
                        audio.play('collect');
                        flashReaction('collect');
                        
                        // Economy Logic
                        const gainCoins = 10 * GameData.multiplier;
                        const gainDiamonds = 10 * GameData.multiplier;
                        sessionCoins += gainCoins;
                        sessionDiamonds += gainDiamonds;
                        
                        // Update HUD
                        document.getElementById('score').innerText = score;
                        document.getElementById('hud-coins').innerText = (GameData.coins + sessionCoins).toLocaleString();
                        document.getElementById('hud-diamonds').innerText = (GameData.diamonds + sessionDiamonds).toLocaleString();

                        addParticle(it.x, it.y, '#f472b6');
                        // Show rewards - now including Followers
                        addFloatText(it.x - 0.05, it.y - 0.05, `+${gainFollowers}👤`, '#ffffff');
                        addFloatText(it.x, it.y - 0.08, `+${gainCoins}💰`, '#fbbf24');
                        addFloatText(it.x + 0.05, it.y - 0.05, `+${gainDiamonds}💎`, '#22d3ee');

                    } else {
                        gameOver();
                    }
                    items.splice(i, 1);
                    continue;
                }
                if (it.y > 1.2) items.splice(i, 1);
            }
        }

        // Particles & Text
        particles.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*2; });
        particles = particles.filter(p => p.life > 0);
        floatTexts.forEach(t => { t.y += t.vy*dt; t.life -= dt; });
        floatTexts = floatTexts.filter(t => t.life > 0);
        if (shake > 0) shake = Math.max(0, shake - dt * 60);

        // Render
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, h);

        // Parallax Layer 1
        ctx.save();
        ctx.translate(0, (time * 20) % h);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        bgStars.forEach(s => {
            const y = (s.y * h + time * s.sp * 100) % h;
            ctx.beginPath();
            ctx.arc(s.x * w, y - (time*20)%h, s.s * w, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.restore();

        // Parallax Layer 2 (Grid)
        ctx.save();
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.05)';
        ctx.lineWidth = 1;
        const gridOff = (time * 150) % 100;
        ctx.beginPath();
        // Dynamic Grid
        for(let i=0; i<w; i+=80) { ctx.moveTo(i, 0); ctx.lineTo(i, h); }
        for(let i=0; i<h; i+=80) { 
            let y = (i + gridOff) % h;
            ctx.moveTo(0, y); ctx.lineTo(w, y); 
        }
        ctx.stroke();
        ctx.restore();

        // Game World
        ctx.save();
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

        // Player (Skin)
        const pSize = w * 0.14;
        const pImg = document.getElementById(GameData.currentSkin);
        if(pImg) ctx.drawImage(pImg, player.x * w - pSize/2, 0.85 * h - pSize/2, pSize, pSize);

        // Items
        items.forEach(it => {
            ctx.save();
            ctx.translate(it.x * w, it.y * h);
            ctx.rotate(it.rot);
            const sz = w * 0.1;
            const img = document.getElementById(it.type === 'like' ? 'asset_like' : 'asset_hater');
            ctx.drawImage(img, -sz/2, -sz/2, sz, sz);
            ctx.restore();
        });

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x*w, p.y*h, p.size*w, 0, Math.PI*2);
            ctx.fill();
        });

        // Floating Text
        ctx.textAlign = 'center';
        ctx.font = `700 ${w*0.04}px "Exo 2"`;
        floatTexts.forEach(t => {
            ctx.globalAlpha = t.life;
            ctx.fillStyle = t.color;
            ctx.fillText(t.txt, t.x * w, t.y * h);
        });

        ctx.restore();
        requestAnimationFrame(loop);
    };

    requestAnimationFrame(loop);

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => { audio.init(); audio.play('ui'); reset(); });
    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.play('close');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        GameData.updateUI(); // Refresh stats
    });

    // Shop Logic
    const shopModal = document.getElementById('shop-modal');
    const openShop = () => {
        shopModal.classList.remove('hidden');
        GameData.updateUI();
        audio.init();
        audio.play('open');
    };
    const closeShop = () => {
        audio.play('close');
        shopModal.classList.add('hidden');
    };
    
    document.getElementById('btn-shop-skins').addEventListener('click', openShop);
    document.getElementById('btn-shop-multi').addEventListener('click', openShop);
    document.getElementById('close-shop').addEventListener('click', closeShop);
    window.addEventListener('game-sfx', (event) => {
        if (event.detail) audio.play(event.detail);
    });
    
    document.getElementById('btn-upgrade-multi').addEventListener('click', () => {
        if(GameData.upgradeMulti()) {
            audio.play('collect');
            GameData.updateUI();
        } else {
            audio.play('fail');
        }
    });

    GameData.updateUI();
});
</script>
