                fontFamily: {

<style>
    :root {
        --bg-top: #76c9ff;
        --bg-bottom: #5d83d8;
        --grid-a: #bfefff;
        --grid-b: #7fb8f4;
        --panel: rgba(36, 92, 148, 0.84);
        --panel-strong: rgba(28, 72, 132, 0.94);
        --panel-border: rgba(255, 235, 164, 0.72);
        --accent: #ffcf4d;
        --accent-strong: #fff2a6;

        --text-main: #fffdf2;
        --text-soft: #e3f7ff;
        --shadow: rgba(0, 0, 0, 0.28);
        --route-ink: #153a7a;
        --cloud-rim: rgba(255, 253, 242, 0.86);
        --seed-glow: rgba(255, 207, 77, 0.42);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 22% 14%, rgba(255, 244, 171, 0.34), transparent 28%),
            radial-gradient(circle at 80% 22%, rgba(255,255,255,0.24), transparent 22%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(ellipse at 12% 20%, rgba(255,255,255,0.22) 0 8%, transparent 9%),
            radial-gradient(ellipse at 34% 34%, rgba(255,255,255,0.18) 0 7%, transparent 8%),
            radial-gradient(ellipse at 76% 24%, rgba(255,255,255,0.2) 0 9%, transparent 10%),
            linear-gradient(90deg, transparent 0 49.2%, rgba(255,255,255,0.05) 49.2% 50.8%, transparent 50.8% 100%);
        background-size: 260px 180px, 320px 220px, 300px 200px, 72px 72px;
        opacity: 0.36;
        mix-blend-mode: screen;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass {
        background:
            radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.16), transparent 18%),
            linear-gradient(180deg, rgba(42, 122, 188, 0.96), rgba(20, 65, 132, 0.98));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 2px solid rgba(255, 232, 150, 0.72);
        box-shadow: 0 -12px 30px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-push { transition: transform 0.08s ease, filter 0.18s ease, box-shadow 0.18s ease; }
    .btn-push:active { transform: scale(0.96); filter: brightness(1.08); }
    .hidden { display: none !important; }
    .shop-scroll::-webkit-scrollbar { width: 0px; background: transparent; }
    .text-outline { text-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
    .brand-font { font-family: 'Bangers', 'Rajdhani', sans-serif; letter-spacing: 0.04em; }
    .ui-font { font-family: 'Rajdhani', system-ui, sans-serif; }
    .feedback-overlay {
        position: absolute;
        right: 0.75rem;
        top: 5.5rem;
        width: min(30vw, 128px);
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        pointer-events: none;
        z-index: 12;
        align-items: flex-end;
    }
    .feedback-gif {
        width: min(28vw, 120px);
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 1rem;
        border: 2px solid rgba(255, 222, 162, 0.7);
        box-shadow: 0 12px 26px rgba(0,0,0,0.24);
        background: rgba(24, 10, 20, 0.55);
        opacity: 0;
        transform: translateY(-8px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
    }
    .feedback-gif.is-visible {
        opacity: 0.94;
        transform: translateY(0) scale(1);
    }
    .feedback-caption {
        min-width: 92px;
        padding: 0.28rem 0.6rem;
        border-radius: 999px;
        background: rgba(32, 10, 20, 0.78);
        border: 1px solid rgba(255, 211, 141, 0.5);
        font-family: 'Bangers', 'Rajdhani', sans-serif;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        color: #fff1d2;
        text-align: center;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 180ms ease, transform 180ms ease;
    }
    .feedback-caption.is-visible {
        opacity: 1;
        transform: translateY(0);
    }
    @media (max-width: 640px) {
        .feedback-overlay {
            top: 5rem;
            right: 0.5rem;
            width: 88px;
        }
        .feedback-gif {
            width: 84px;
        }
        .feedback-caption {
            min-width: 84px;
            font-size: 0.72rem;
            padding: 0.2rem 0.45rem;
        }
    }
    .hud-pill {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 18% 20%, rgba(255,255,255,0.28), transparent 24%),
            linear-gradient(180deg, rgba(42, 135, 204, 0.95), rgba(32, 78, 150, 0.95));
        border: 2px solid var(--panel-border);
        color: var(--text-main);
        box-shadow: 0 10px 24px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .hud-pill::after {
        content: '';
        position: absolute;
        inset: auto -18% 6px 24%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(115,246,209,0.85), transparent);
        transform: rotate(-3deg);
        pointer-events: none;
    }
    .hud-pill--cool {
        background: linear-gradient(180deg, rgba(18, 128, 172, 0.9), rgba(10, 76, 130, 0.95));
        border-color: rgba(115, 246, 209, 0.7);
    }
    .tab-btn {
        border-bottom-width: 4px;
        color: rgba(255, 219, 191, 0.62);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    .tab-btn.is-active {
        color: var(--accent-strong);
        border-color: var(--accent);
        text-shadow: 0 0 12px rgba(255, 193, 92, 0.32);
    }
    .shop-card {
        background:
            radial-gradient(circle at 10% 20%, rgba(255,255,255,0.84), transparent 18%),
            linear-gradient(180deg, rgba(255, 252, 236, 0.98), rgba(226, 246, 255, 0.95));
        border: 2px solid rgba(217, 164, 65, 0.28);
        box-shadow: 0 10px 18px rgba(20, 65, 132, 0.18), inset 0 0 0 1px rgba(255,255,255,0.5);
    }
    .shop-card-icon {
        background:
            radial-gradient(circle at 32% 22%, rgba(255,255,255,0.86), transparent 34%),
            linear-gradient(180deg, #fff7c7, #9ae8ff) !important;
        border: 1px solid rgba(32, 78, 150, 0.16);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.52), 0 6px 12px rgba(32,78,150,0.12);
    }
    .buy-btn-food {
        background: linear-gradient(180deg, #ffd75f, #d9a441);
        box-shadow: 0 6px 14px rgba(217, 164, 65, 0.28);

    .buy-btn-staff {
        background: linear-gradient(180deg, #73f6d1, #1689a7);
        box-shadow: 0 6px 14px rgba(20, 91, 104, 0.28);
    }
    .buy-btn-food:disabled, .buy-btn-staff:disabled {
        box-shadow: none;
    }
</style>

<script>
// --- §2 System Invariants & Constants ---
const FOODS = [
    { id: 'fries', name: 'Sunseed Crumbs', price: 0, sell: 2, icon: '🌻' },
    { id: 'mozz', name: 'Cloud Puff Bites', price: 45, sell: 7, icon: '☁️' },
    { id: 'soda', name: 'Breeze Nectar', price: 200, sell: 25, icon: '💧' },
    { id: 'burger', name: 'Nestberry Stack', price: 1300, sell: 150, icon: '🫐' },
    { id: 'shawarma', name: 'Tailwind Wrap', price: 20000, sell: 2200, icon: '🌀' },
    { id: 'loaded', name: 'Meadow Seed Bowl', price: 170000, sell: 18000, icon: '🥣' },
    { id: 'zinger', name: 'Thunder Wing Treat', price: 530000, sell: 55000, icon: '⚡' },
    { id: 'fish', name: 'Silver Minnow', price: 1000000, sell: 110000, icon: '🐟' },
    { id: 'sushi', name: 'Canal Rice Roll', price: 4200000, sell: 450000, icon: '🍙' },
    { id: 'crab', name: 'Red Kite Claw', price: 9200000, sell: 1000000, icon: '🦀' },
    { id: 'lobster', name: 'Stormshell Feast', price: 20000000, sell: 2200000, icon: '🦞' },
    { id: 'pizza', name: 'Market Moon Pie', price: 55000000, sell: 6000000, icon: '🥧' },
    { id: 'dblzinger', name: 'Double Gust Drumstick', price: 102000000, sell: 11000000, icon: '🍗' },
    { id: 'black', name: 'Night Cloud Cake', price: 230000000, sell: 25000000, icon: '🌑' },
    { id: 'gold', name: 'Golden Gate Ring', price: 400000000, sell: 45000000, icon: '🥯' },
    { id: 'xxl', name: 'Giant Sky Parcel', price: 1000000000, sell: 120000000, icon: '🥡' },
    { id: 'dark', name: 'Twilight Ruin Tart', price: 99000000000, sell: 11000000000, icon: '🌌' },
    { id: 'rainbow', name: 'Rainbow Current Juice', price: 2000000000000, sell: 250000000000, icon: '🌈' },
];

const STAFF = [
    { id: 'cleaner', name: 'Cloud Sweeper', price: 89000, desc: 'Auto-clears storm smudges', icon: '🧹' },
    { id: 'chef', name: 'Nest Chef', price: 120000, desc: 'Auto-guides waiting birds', icon: '👨‍🍳' },
    { id: 'delivery', name: 'Wind Courier', price: 400000, desc: 'Carries x3 sky seeds', icon: '🪽' }
];

// Formatting
const GIFS = {
    celebrate: { imgId: 'gif-celebrate', labelId: 'gif-celebrate-label', timer: null },
    chaos: { imgId: 'gif-chaos', labelId: 'gif-chaos-label', timer: null }
};

const formatMoney = (n) => {
    if (n < 1000) return Math.floor(n);
    const suffixes = ["", "K", "M", "B", "T", "Qa"];
    const suffixNum = Math.floor(("" + Math.floor(n)).length / 3);
    let shortValue = parseFloat((suffixNum != 0 ? (n / Math.pow(1000, suffixNum)) : n).toPrecision(3));
    if (shortValue % 1 != 0) shortValue = shortValue.toFixed(1);
    return shortValue + suffixes[suffixNum];
};

// Global State
let canvas, ctx, cw, ch;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING
let gameConfig = {};
let audioCtx = null;
let audioReady = false;

// Game Data
let money = 0;
let unlockedFoods = [0]; // indicies of FOODS
let staff = { cleaner: false, chef: false, delivery: false };
let tables = [];
let customers = [];
let dirts = [];
let particles = [];
let floatingTexts = [];
let deliveryTimer = 0;
let chefTimer = 0;

// --- §3 Lifecycle & Core ---

window.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Setup
    setupShop();
    document.getElementById('tab-food').onclick = () => switchTab('food');
    document.getElementById('tab-staff').onclick = () => switchTab('staff');
    
    window.addEventListener('resize', resize);
    resize();
    initGame();
    
    // Start loop
    gameState = 'PLAYING';
    requestAnimationFrame(loop);
    
    // Input
    window.addEventListener('pointerdown', handleInput, { passive: false });
    
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.2;
    ['sfx_collect', 'sfx_unlock', 'sfx_clean', 'sfx_ui'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.volume = id === 'sfx_collect' ? 0.45 : 0.38;
    });
});

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            for (let k in defs) gameConfig[k] = defs[k].value;
        } catch(e) { console.error(e); }
    }
    // Fallbacks
    if (!gameConfig.customerSpeed) gameConfig.customerSpeed = 3;
    if (!gameConfig.vipChance) gameConfig.vipChance = 0.5;
    if (!gameConfig.themeColor) gameConfig.themeColor = '#FF6B6B';
}

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Re-layout tables
    setupTables();
}

function setupTables() {
    tables = [];
    const cols = 2;
    const rows = 3;
    const marginX = cw * 0.15;
    const marginY = ch * 0.15;
    const startY = ch * 0.15;
    
    const cellW = (cw - marginX * 2) / (cols - 1 || 1);
    const cellH = (ch * 0.5 - marginY) / (rows - 1 || 1);
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            tables.push({
                x: marginX + c * cellW,
                y: startY + r * cellH,
                occupied: false,
                id: r * cols + c
            });
        }
    }
}

function initGame() {
    money = 0;
    unlockedFoods = [0];
    staff = { cleaner: false, chef: false, delivery: false };
    customers = [];
    dirts = [];
    particles = [];
    floatingTexts = [];
    updateUI();
}

// --- §4 Game Logic ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            update(dt);
            draw();
        }
    } catch (e) {
        console.error("Loop Error:", e);
    }
    requestAnimationFrame(loop);
}

function update(dt) {
    const cappedDt = Math.min(dt, 0.1);
    
    // Spawn Customers
    if (customers.length < tables.length && Math.random() < 0.02) {
        spawnCustomer();
    }
    
    // Update Customers
    customers.forEach(c => {
        if (c.state === 'ENTERING') {
            const dx = c.targetTable.x - c.x;
            const dy = c.targetTable.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 5) {
                c.x = c.targetTable.x;
                c.y = c.targetTable.y;
                c.state = 'WAITING';
                c.targetTable.occupied = true;
                // Decide order
                const possibleFoods = unlockedFoods.map(i => FOODS[i]);
                c.order = possibleFoods[Math.floor(Math.random() * possibleFoods.length)];
                c.quantity = Math.floor(Math.random() * 3) + 1; // 1-3 items
            } else {
                c.x += (dx / dist) * gameConfig.customerSpeed * 60 * cappedDt;
                c.y += (dy / dist) * gameConfig.customerSpeed * 60 * cappedDt;
            }
        } else if (c.state === 'LEAVING') {
            c.y += gameConfig.customerSpeed * 60 * cappedDt;
            if (c.y > ch + 50) c.dead = true;
        }
    });
    
    // Clean up dead customers
    customers = customers.filter(c => {
        if (c.dead) {
            if (c.targetTable) c.targetTable.occupied = false;
            // Spawn dirt
            if (Math.random() < 0.6) spawnDirt(c.x, c.y);
            return false;
        }
        return true;
    });

    // Auto Chef
    if (staff.chef) {
        chefTimer += cappedDt;
        if (chefTimer > 1.0) { // Chef serves one customer per second
            chefTimer = 0;
            const waiting = customers.find(c => c.state === 'WAITING');
            if (waiting) serveCustomer(waiting);
        }
    }

    // Auto Cleaner
    if (staff.cleaner) {
        if (dirts.length > 0 && Math.random() < 0.05) {
            cleanDirt(dirts[0]);
        }
    }

    // Delivery Man Passive Income
    if (staff.delivery) {
        deliveryTimer += cappedDt;
        if (deliveryTimer > 3.0) {
            deliveryTimer = 0;
            // Best food x3
            const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
            const income = bestFood.sell * 3;
            addMoney(income);
            spawnFloatingText(cw/2, 50, `+${formatMoney(income)} (Wind Courier!)`, '#4ECDC4');
            playSound('collect');
            showGifFeedback('celebrate', 900);
        }
    }

    // Particles
    particles.forEach(p => {
        p.x += p.vx * cappedDt * 60;
        p.y += p.vy * cappedDt * 60;
        p.life -= cappedDt;
        p.vy += 0.5; // gravity
    });
    particles = particles.filter(p => p.life > 0);

    // Floating Text
    floatingTexts.forEach(t => {
        t.y -= 30 * cappedDt;
        t.life -= cappedDt;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);
}

function spawnCustomer() {
    // Find empty table
    const emptyTables = tables.filter(t => !t.occupied && !customers.some(c => c.targetTable === t));
    if (emptyTables.length === 0) return;
    
    const table = emptyTables[Math.floor(Math.random() * emptyTables.length)];
    const isVip = Math.random() < gameConfig.vipChance;
    
    customers.push({
        x: cw / 2,
        y: ch + 50,
        targetTable: table,
        state: 'ENTERING',
        isVip: isVip,
        color: `hsl(${Math.random()*360}, 70%, 60%)`,
        dead: false
    });
}

function spawnDirt(x, y) {
    dirts.push({ x: x + (Math.random()-0.5)*20, y: y + (Math.random()-0.5)*20, r: 15 });
}

function serveCustomer(c) {
    if (c.state !== 'WAITING') return;
    
    const baseValue = c.order.sell * c.quantity;
    const multiplier = c.isVip ? 3 : 1;
    const total = baseValue * multiplier;
    
    addMoney(total);
    spawnFloatingText(c.x, c.y - 30, `+${formatMoney(total)}`, c.isVip ? '#FFD700' : '#FFF');
    playSound('collect');
    if (c.isVip || total >= 1000) showGifFeedback('celebrate', 1100);
    
    // Juice
    for(let i=0; i<8; i++) spawnParticle(c.x, c.y, c.isVip ? '#FFD700' : '#88CC88');
    vibrate(c.isVip ? 'medium' : 'light');
    
    c.state = 'LEAVING';
    c.targetTable.occupied = false;
    c.targetTable = null; // Detach from table immediately so new customer can come
}

function cleanDirt(d) {
    const idx = dirts.indexOf(d);
    if (idx > -1) {
        dirts.splice(idx, 1);
        spawnFloatingText(d.x, d.y, "Clear!", "#4ECDC4");
        playSound('clean');
        for(let i=0; i<5; i++) spawnParticle(d.x, d.y, '#AAEEFF');
    }
}

function addMoney(amt) {
    money += amt;
    updateUI();
}

function spawnParticle(x, y, color) {
    particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10 - 5,
        color,
        life: 1.0,
        size: Math.random() * 4 + 2
    });
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1.0 });
}

// --- §5 Input & UI ---

function handleInput(e) {
    // L2 Audio Unlock
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    initAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Check Dirt
    let clickedDirt = false;
    for (let d of dirts) {
        const dx = x - d.x;
        const dy = y - d.y;
        if (dx*dx + dy*dy < d.r*d.r * 2) { // Generous hit area
            cleanDirt(d);
            clickedDirt = true;
            break;
        }
    }
    if (clickedDirt) return;

    // Check Customers
    for (let c of customers) {
        if (c.state === 'WAITING') {
            const dx = x - c.x;
            const dy = y - c.y;
            if (dx*dx + dy*dy < 1600) { // 40px radius
                serveCustomer(c);
                return;
            }
        }
    }
}

    FOODS.forEach((f, i) => {

        div.className = 'shop-card flex justify-between items-center p-3 rounded-xl btn-push';

                <div>
                    <div class="font-bold text-stone-800 text-sm leading-tight">${f.name}</div>
                    <div class="text-xs text-sky-700/80">Guide: $${formatMoney(f.sell)}</div>
                </div>
            </div>
            <button class="buy-btn-food text-white px-3 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:bg-gray-400" onclick="buyFood(${i})">

window.buyFood = (idx) => {
    const f = FOODS[idx];
    if (money >= f.price && !unlockedFoods.includes(idx)) {
        money -= f.price;
        unlockedFoods.push(idx);
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${f.name} Unlocked!`, '#FF6B6B');
        // Confetti
        for(let k=0; k<20; k++) spawnParticle(cw/2, ch/2, `hsl(${Math.random()*360}, 100%, 50%)`);
        updateUI();
    }
};

window.buyStaff = (id) => {
    const s = STAFF.find(x => x.id === id);
    if (money >= s.price && !staff[id]) {
        money -= s.price;
        staff[id] = true;
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${s.name} Hired!`, '#4ECDC4');
        updateUI();
    }
}

function switchTab(tab) {
    playSound('ui');
    const foodTab = document.getElementById('tab-food');
    const staffTab = document.getElementById('tab-staff');
    const foodList = document.getElementById('list-food');
    const staffList = document.getElementById('list-staff');

    if (tab === 'food') {
        foodTab.classList.add('is-active');
        staffTab.classList.remove('is-active');
        foodList.classList.remove('hidden');
        staffList.classList.add('hidden');
    } else {
        staffTab.classList.add('is-active');
        foodTab.classList.remove('is-active');
        staffList.classList.remove('hidden');
        foodList.classList.add('hidden');
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = formatMoney(money);
    
    // Update Shop Buttons
    FOODS.forEach((f, i) => {
        const btn = document.querySelector(`#food-btn-${i} button`);
        if (unlockedFoods.includes(i)) {
            btn.innerText = "Mapped";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < f.price;
            if (unlockedFoods.includes(i-1)) { // Only show next available
                 document.getElementById(`food-btn-${i}`)?.classList.remove('hidden');
            }
        }
    });

    STAFF.forEach(s => {
        const btn = document.querySelector(`#staff-btn-${s.id} button`);
        if (staff[s.id]) {
            btn.innerText = "Hired";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < s.price;
        }
    });

    const routeDisplay = document.getElementById('route-display');
    if (routeDisplay) routeDisplay.innerText = getSkywayRegion();

    if (staff.delivery) {
        document.getElementById('dps-display').classList.remove('hidden');
        const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
        document.getElementById('dps-display').innerText = `🪽 Wind Courier: $${formatMoney(bestFood.sell * 3)}/3s`;
    }
}

// --- §6 Drawing ---

function getSkywayLevel() {
    const unlocked = unlockedFoods.length;
    if (money >= 230000000 || unlocked >= 15) return 5;
    if (money >= 530000 || unlocked >= 7) return 4;
    if (money >= 1300 || unlocked >= 4) return 3;
    if (money >= 45 || unlocked >= 2) return 2;
    return 1;
}

function getSkywayRegion() {
    return ['Sunrise Meadow', 'Cloud Canal', 'Kite Market', 'Thunder Pass', 'Neon Cloud Ruins'][getSkywayLevel() - 1];
}

function drawCloud(cx, cy, scale, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255, 253, 242, 0.9)';
    ctx.beginPath();
    ctx.ellipse(cx - 26 * scale, cy + 5 * scale, 26 * scale, 15 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(cx, cy, 34 * scale, 20 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 30 * scale, cy + 6 * scale, 25 * scale, 14 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 2 * scale, cy + 13 * scale, 56 * scale, 13 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawKite(cx, cy, size, color, time) {
    ctx.save();
    ctx.translate(cx, cy + Math.sin(time * 1.6 + cx) * 4);
    ctx.rotate(Math.sin(time + cy) * 0.08);
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.72, 0);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.72, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(21,58,122,0.28)';
    ctx.beginPath();
    ctx.moveTo(0, size);
    ctx.quadraticCurveTo(-8, size + 18, 5, size + 34);
    ctx.quadraticCurveTo(15, size + 48, -2, size + 62);
    ctx.stroke();
    ctx.restore();
}

function drawSkywayBackground(time, level) {
    const palettes = {
        1: ['#8bd8ff', '#67aef2', '#f7c96a'],
        2: ['#83d7ff', '#4f93e3', '#73f6d1'],
        3: ['#78d8ed', '#5b95e8', '#ffcf4d'],
        4: ['#6a85b8', '#3b579e', '#fff06f'],
        5: ['#5b4bc4', '#162a78', '#56f1ff']
    };
    const p = palettes[level] || palettes[1];
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, p[0]);
    bgGradient.addColorStop(0.58, p[1]);
    bgGradient.addColorStop(1, level >= 5 ? '#10184d' : '#4266bd');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    const sunX = cw * (level >= 4 ? 0.82 : 0.18);
    const sunY = ch * (level >= 4 ? 0.16 : 0.12);
    const sun = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, Math.max(cw, ch) * 0.34);
    sun.addColorStop(0, level >= 5 ? 'rgba(86,241,255,0.58)' : 'rgba(255,240,166,0.72)');
    sun.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.globalAlpha = level >= 4 ? 0.24 : 0.36;
    for (let i = 0; i < 7; i++) {
        const x = ((i * 170 - time * (8 + i * 1.2)) % (cw + 220)) - 110;
        const y = 70 + (i % 4) * 58 + Math.sin(time * 0.7 + i) * 7;
        drawCloud(x, y, 0.75 + (i % 3) * 0.28, 0.9);
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = level >= 5 ? 'rgba(86,241,255,0.24)' : 'rgba(255,255,255,0.24)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
        const y = 54 + i * 48 + Math.sin(time * 1.2 + i) * 5;
        const offset = (time * (18 + level * 4) + i * 73) % (cw + 140);
        ctx.beginPath();
        ctx.moveTo(offset - 130, y);
        ctx.bezierCurveTo(offset - 70, y - 12, offset - 20, y + 12, offset + 42, y);
        ctx.stroke();
    }
    ctx.restore();

    if (level >= 3) {
        drawKite(cw * 0.17, ch * 0.32, 13, '#ff6b6b', time);
        drawKite(cw * 0.82, ch * 0.26, 11, '#ffcf4d', time + 2);
    }

    if (level >= 4) {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = level >= 5 ? '#56f1ff' : '#fff06f';
        ctx.lineWidth = 3;
        for (let i = 0; i < 4; i++) {
            const x = (i * 141 + time * 15) % cw;
            ctx.beginPath();
            ctx.moveTo(x, 34 + i * 30);
            ctx.lineTo(x - 16, 74 + i * 42);
            ctx.lineTo(x + 4, 74 + i * 42);
            ctx.lineTo(x - 12, 120 + i * 30);
            ctx.stroke();
        }
        ctx.restore();
    }

    if (level >= 5) {
        ctx.save();
        ctx.strokeStyle = 'rgba(86,241,255,0.22)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            const x = 38 + i * (cw / 4.5);
            const y = ch * 0.18 + (i % 2) * 50;
            ctx.beginPath();
            ctx.arc(x, y, 18 + (i % 3) * 6 + Math.sin(time + i) * 2, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }
}

function draw() {
    // [agent-note][world-design-v4] authored-world: Skyway Café; preserve clicker mechanics while replacing grid dominance with animated procedural clouds, currents, and route motifs.
    const time = performance.now() / 1000;
    const skywayLevel = getSkywayLevel();
    drawSkywayBackground(time, skywayLevel);

    // Cloud perch / sky gate targets
    tables.forEach(t => {
        ctx.save();
        ctx.shadowColor = 'rgba(255, 238, 150, 0.34)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = 'rgba(255, 253, 242, 0.86)';
        ctx.beginPath();
        ctx.ellipse(t.x - 16, t.y + 9, 22, 11, 0, 0, Math.PI * 2);
        ctx.ellipse(t.x + 14, t.y + 8, 24, 12, 0, 0, Math.PI * 2);
        ctx.ellipse(t.x, t.y + 2, 28, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        const perchGradient = ctx.createRadialGradient(t.x - 8, t.y - 10, 4, t.x, t.y, 30);
        perchGradient.addColorStop(0, '#fff6b4');
        perchGradient.addColorStop(0.62, '#ffcf4d');
        perchGradient.addColorStop(1, '#d9a441');
        ctx.fillStyle = perchGradient;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 24, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 255, 236, 0.82)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = skywayLevel >= 5 ? 'rgba(86,241,255,0.72)' : 'rgba(115,246,209,0.54)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 32 + Math.sin(time * 1.6 + t.id) * 1.5, -0.2, Math.PI * 1.15);
        ctx.stroke();

        ctx.fillStyle = '#8b6c26';
        ctx.beginPath(); ctx.arc(t.x - 18, t.y, 5.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(t.x + 18, t.y, 5.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(t.x, t.y - 18, 5.5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    });

    // Storm smudges / headwind marks
    dirts.forEach(d => {
        ctx.save();
        ctx.shadowColor = 'rgba(65, 87, 127, 0.42)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(80, 97, 125, 0.88)';
        ctx.beginPath();
        ctx.ellipse(d.x - 6, d.y + 2, d.r * 0.88, d.r * 0.62, -0.25, 0, Math.PI * 2);
        ctx.ellipse(d.x + 6, d.y - 3, d.r * 0.82, d.r * 0.58, 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(183, 223, 255, 0.52)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(d.x - d.r, d.y - 4);
        ctx.quadraticCurveTo(d.x, d.y - 14, d.x + d.r, d.y - 4);
        ctx.stroke();
        ctx.fillStyle = '#324059';
        ctx.beginPath();
        ctx.arc(d.x + 5, d.y - 4, d.r/3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // Customers
    customers.forEach(c => {
        // Migrating skybird body
        const bob = Math.sin(time * 5 + c.x * 0.02) * 1.8;
        const bodyGradient = ctx.createRadialGradient(c.x - 7, c.y - 9 + bob, 4, c.x, c.y + bob, 25);
        bodyGradient.addColorStop(0, '#fff5cf');
        bodyGradient.addColorStop(0.22, c.isVip ? '#ffe39b' : '#ffd9b3');
        bodyGradient.addColorStop(0.23, c.color);
        bodyGradient.addColorStop(1, '#2f5da8');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y + bob, 21, 18, -0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = c.isVip ? '#ffd166' : 'rgba(255, 253, 242, 0.72)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Wing and tail feathers give the customer a readable bird silhouette without changing hit radius.
        ctx.fillStyle = 'rgba(255, 253, 242, 0.72)';
        ctx.beginPath();
        ctx.ellipse(c.x - 13, c.y + 3 + bob, 8, 12, -0.8 + Math.sin(time * 8) * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.moveTo(c.x - 20, c.y + 4 + bob);
        ctx.lineTo(c.x - 31, c.y - 3 + bob);
        ctx.lineTo(c.x - 28, c.y + 9 + bob);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff5ea';
        ctx.beginPath();
        ctx.arc(c.x + 3, c.y - 5 + bob, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffcf4d';
        ctx.beginPath();
        ctx.moveTo(c.x + 16, c.y - 5 + bob);
        ctx.lineTo(c.x + 28, c.y - 1 + bob);
        ctx.lineTo(c.x + 16, c.y + 3 + bob);
        ctx.closePath();
        ctx.fill();

        // VIP Crown
        if (c.isVip) {
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
                ctx.moveTo(c.x - 10, c.y - 15 + bob);
                ctx.lineTo(c.x - 5, c.y - 25 + bob);
                ctx.lineTo(c.x, c.y - 15 + bob);
                ctx.lineTo(c.x + 5, c.y - 25 + bob);
                ctx.lineTo(c.x + 10, c.y - 15 + bob);
            ctx.fill();
        }

        // Eyes
        ctx.fillStyle = '#2e1121';
        ctx.beginPath();
        ctx.arc(c.x + 1, c.y - 6 + bob, 2.1, 0, Math.PI*2);
        ctx.arc(c.x + 9, c.y - 5 + bob, 1.7, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#2f5da8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(c.x + 5, c.y + 1 + bob, 4, 0.15, Math.PI - 0.15);
        ctx.stroke();

        // Order Bubble
        if (c.state === 'WAITING') {
            ctx.fillStyle = 'rgba(255, 248, 233, 0.96)';
            ctx.beginPath();
            ctx.roundRect(c.x + 10, c.y - 42 + bob, 40, 30, 8);
            ctx.fill();
            ctx.strokeStyle = 'rgba(217, 164, 65, 0.72)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = '600 18px "Rajdhani"';
            ctx.fillStyle = '#2c1220';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(c.order.icon, c.x + 30, c.y - 27 + bob);
            
            // Quantity
            if (c.quantity > 1) {
                ctx.font = 'bold 12px "Bangers"';
                ctx.fillStyle = '#cf4b2f';
                ctx.fillText(`x${c.quantity}`, c.x + 45, c.y - 37 + bob);
            }
        }
    });

    // Particles
    particles.forEach(p => {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x - p.size * 1.7, p.y);
        ctx.lineTo(p.x + p.size * 1.7, p.y);
        ctx.moveTo(p.x, p.y - p.size * 1.7);
        ctx.lineTo(p.x, p.y + p.size * 1.7);
        ctx.stroke();
        ctx.restore();
    });

    // Floating Text
    ctx.font = 'bold 24px "Bangers"';
    ctx.textAlign = 'center';
    floatingTexts.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; // Shadow
        ctx.fillText(t.text, t.x + 2, t.y + 2);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    });
}

// --- §7 Utils ---

function initAudio() {
    if (audioReady) return;
    audioReady = true;
    const bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
}

function showGifFeedback(type, duration = 1000) {
    const config = GIFS[type];
    if (!config) return;
    const img = document.getElementById(config.imgId);
    const label = document.getElementById(config.labelId);
    if (!img || !label) return;
    img.classList.add('is-visible');
    label.classList.add('is-visible');
    clearTimeout(config.timer);
    config.timer = setTimeout(() => {
        img.classList.remove('is-visible');
        label.classList.remove('is-visible');
    }, duration);
}

function playSound(type) {
    if (!audioCtx) return;
    const idMap = {
        collect: 'sfx_collect',
        unlock: 'sfx_unlock',
        clean: 'sfx_clean',
        ui: 'sfx_ui'
    };
    const el = document.getElementById(idMap[type] || 'sfx_ui');
    if (el) {
        el.currentTime = 0;
        el.play().catch(() => playSynth(type));
    } else {
        playSynth(type);
    }
}

function playSynth(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(780, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'clean') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.16);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
    } else if (type === 'ui') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(760, audioCtx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.24);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    }
}

function vibrate(style) {
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 50 : 10);
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
        params: { style }
    });
}
</script>
