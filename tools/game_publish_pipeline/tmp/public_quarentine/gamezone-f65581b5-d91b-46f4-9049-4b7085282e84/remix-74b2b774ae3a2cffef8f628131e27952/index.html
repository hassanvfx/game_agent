const formatMoney = (n) => {
    if (n < 1000) return Math.floor(n);
    const suffixes = ["", "K", "M", "B", "T", "Qa"];
    const suffixNum = Math.floor(("" + Math.floor(n)).length / 3);
    let shortValue = parseFloat((suffixNum != 0 ? (n / Math.pow(1000, suffixNum)) : n).toPrecision(3));
    if (shortValue % 1 != 0) shortValue = shortValue.toFixed(1);
    return shortValue + suffixes[suffixNum];
};

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            for (let k in defs) gameConfig[k] = defs[k].value;
        } catch(e) { console.error(e); }
    }
    // Fallbacks
    if (!gameConfig.customerSpeed) gameConfig.customerSpeed = 3;
    if (!gameConfig.vipChance) gameConfig.vipChance = 0.5;
    if (!gameConfig.themeColor) gameConfig.themeColor = '#FF6B6B';
}

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Re-layout tables
    setupTables();
}

function setupTables() {
    tables = [];
    const cols = 2;
    const rows = 3;
    const marginX = cw * 0.15;
    const marginY = ch * 0.15;
    const startY = ch * 0.15;
    
    const cellW = (cw - marginX * 2) / (cols - 1 || 1);
    const cellH = (ch * 0.5 - marginY) / (rows - 1 || 1);
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            tables.push({
                x: marginX + c * cellW,
                y: startY + r * cellH,
                occupied: false,
                id: r * cols + c
            });
        }
    }
}

function initGame() {
    money = 0;
    unlockedFoods = [0];
    staff = { cleaner: false, chef: false, delivery: false };
    customers = [];
    dirts = [];
    particles = [];
    floatingTexts = [];
    updateUI();
}

// --- §4 Game Logic ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            update(dt);
            draw();
        }
    } catch (e) {
        console.error("Loop Error:", e);
    }
    requestAnimationFrame(loop);
}

function update(dt) {
    const cappedDt = Math.min(dt, 0.1);
    
    // Spawn Customers
    if (customers.length < tables.length && Math.random() < 0.02) {
        spawnCustomer();
    }
    
    // Update Customers
    customers.forEach(c => {
        if (c.state === 'ENTERING') {
            const dx = c.targetTable.x - c.x;
            const dy = c.targetTable.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 5) {
                c.x = c.targetTable.x;
                c.y = c.targetTable.y;
                c.state = 'WAITING';
                c.targetTable.occupied = true;
                // Decide order
                const possibleFoods = unlockedFoods.map(i => FOODS[i]);
                c.order = possibleFoods[Math.floor(Math.random() * possibleFoods.length)];
                c.quantity = Math.floor(Math.random() * 3) + 1; // 1-3 items
            } else {
                c.x += (dx / dist) * gameConfig.customerSpeed * 60 * cappedDt;
                c.y += (dy / dist) * gameConfig.customerSpeed * 60 * cappedDt;
            }
        } else if (c.state === 'LEAVING') {
            c.y += gameConfig.customerSpeed * 60 * cappedDt;
            if (c.y > ch + 50) c.dead = true;
        }
    });
    
    // Clean up dead customers
    customers = customers.filter(c => {
        if (c.dead) {
            if (c.targetTable) c.targetTable.occupied = false;
            // Spawn dirt
            if (Math.random() < 0.6) spawnDirt(c.x, c.y);
            return false;
        }
        return true;
    });

    // Auto Chef
    if (staff.chef) {
        chefTimer += cappedDt;
        if (chefTimer > 1.0) { // Chef serves one customer per second
            chefTimer = 0;
            const waiting = customers.find(c => c.state === 'WAITING');
            if (waiting) serveCustomer(waiting);
        }
    }

    // Auto Cleaner
    if (staff.cleaner) {
        if (dirts.length > 0 && Math.random() < 0.05) {
            cleanDirt(dirts[0]);
        }
    }

    // Delivery Man Passive Income
    if (staff.delivery) {
        deliveryTimer += cappedDt;
        if (deliveryTimer > 3.0) {
            deliveryTimer = 0;
            // Best food x3
            const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
            const income = bestFood.sell * 3;
            addMoney(income);
            spawnFloatingText(cw/2, 50, `+${formatMoney(income)} (Portal Run!)`, '#65f7ff');
            playSound('collect');
            showGifFeedback('celebrate', 900);
        }
    }

    // Particles
    particles.forEach(p => {
        p.x += p.vx * cappedDt * 60;
        p.y += p.vy * cappedDt * 60;
        p.life -= cappedDt;
        p.vy += 0.5; // gravity
    });
    particles = particles.filter(p => p.life > 0);

    // Floating Text
    floatingTexts.forEach(t => {
        t.y -= 30 * cappedDt;
        t.life -= cappedDt;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);
}

function spawnCustomer() {
    // Find empty table
    const emptyTables = tables.filter(t => !t.occupied && !customers.some(c => c.targetTable === t));
    if (emptyTables.length === 0) return;
    
    const table = emptyTables[Math.floor(Math.random() * emptyTables.length)];
    const isVip = Math.random() < gameConfig.vipChance;
    
    customers.push({
        x: cw / 2,
        y: ch + 50,
        targetTable: table,
        state: 'ENTERING',
        isVip: isVip,
        color: `hsl(${Math.random()*360}, 70%, 60%)`,
        dead: false
    });
}

function spawnDirt(x, y) {
    dirts.push({ x: x + (Math.random()-0.5)*20, y: y + (Math.random()-0.5)*20, r: 15 });
}

function serveCustomer(c) {
    if (c.state !== 'WAITING') return;
    
    const baseValue = c.order.sell * c.quantity;
    const multiplier = c.isVip ? 3 : 1;
    const total = baseValue * multiplier;
    
    addMoney(total);
    spawnFloatingText(c.x, c.y - 30, `+${formatMoney(total)}`, c.isVip ? '#FFD700' : '#FFF');
    playSound('collect');
    if (c.isVip || total >= 1000) showGifFeedback('celebrate', 1100);
    
    // Juice
    for(let i=0; i<8; i++) spawnParticle(c.x, c.y, c.isVip ? '#FFD700' : '#88CC88');
    vibrate(c.isVip ? 'medium' : 'light');
    
    c.state = 'LEAVING';
    c.targetTable.occupied = false;
    c.targetTable = null; // Detach from table immediately so new customer can come
}

function cleanDirt(d) {
    const idx = dirts.indexOf(d);
    if (idx > -1) {
        dirts.splice(idx, 1);
        spawnFloatingText(d.x, d.y, "Slime Cleared!", "#65f7ff");
        playSound('clean');
        for(let i=0; i<5; i++) spawnParticle(d.x, d.y, '#AAEEFF');
    }
}

function addMoney(amt) {
    money += amt;
    updateUI();
}

function spawnParticle(x, y, color) {
    particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10 - 5,
        color,
        life: 1.0,
        size: Math.random() * 4 + 2
    });
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1.0 });
}

// --- §5 Input & UI ---

function handleInput(e) {
    // L2 Audio Unlock
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    initAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Check Dirt
    let clickedDirt = false;
    for (let d of dirts) {
        const dx = x - d.x;
        const dy = y - d.y;
        if (dx*dx + dy*dy < d.r*d.r * 2) { // Generous hit area
            cleanDirt(d);
            clickedDirt = true;
            break;
        }
    }
    if (clickedDirt) return;

    // Check Customers
    for (let c of customers) {
        if (c.state === 'WAITING') {
            const dx = x - c.x;
            const dy = y - c.y;
            if (dx*dx + dy*dy < 1600) { // 40px radius
                serveCustomer(c);
                return;
            }
        }
    }
}

                </div>
            </div>
            <button class="buy-btn-food text-white px-3 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:bg-gray-400" onclick="buyFood(${i})">

window.buyFood = (idx) => {
    const f = FOODS[idx];
    if (money >= f.price && !unlockedFoods.includes(idx)) {
        money -= f.price;
        unlockedFoods.push(idx);
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${f.name} Unlocked!`, '#FF6B6B');
        // Confetti
        for(let k=0; k<20; k++) spawnParticle(cw/2, ch/2, `hsl(${Math.random()*360}, 100%, 50%)`);
        updateUI();
    }
};

window.buyStaff = (id) => {
    const s = STAFF.find(x => x.id === id);
    if (money >= s.price && !staff[id]) {
        money -= s.price;
        staff[id] = true;
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${s.name} Recruited!`, '#65f7ff');
        updateUI();
    }
}

function switchTab(tab) {
    playSound('ui');
    const foodTab = document.getElementById('tab-food');
    const staffTab = document.getElementById('tab-staff');
    const foodList = document.getElementById('list-food');
    const staffList = document.getElementById('list-staff');

    if (tab === 'food') {
        foodTab.classList.add('is-active');
        staffTab.classList.remove('is-active');
        foodList.classList.remove('hidden');
        staffList.classList.add('hidden');
    } else {
        staffTab.classList.add('is-active');
        foodTab.classList.remove('is-active');
        staffList.classList.remove('hidden');
        foodList.classList.add('hidden');
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = formatMoney(money);
    
    // Update Shop Buttons
    FOODS.forEach((f, i) => {
        const btn = document.querySelector(`#food-btn-${i} button`);
        if (unlockedFoods.includes(i)) {
            btn.innerText = "Owned";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < f.price;
            if (unlockedFoods.includes(i-1)) { // Only show next available
                 document.getElementById(`food-btn-${i}`)?.classList.remove('hidden');
            }
        }
    });

    STAFF.forEach(s => {
        const btn = document.querySelector(`#staff-btn-${s.id} button`);
        if (staff[s.id]) {
            btn.innerText = "Hired";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < s.price;
        }
    });

    if (staff.delivery) {
        document.getElementById('dps-display').classList.remove('hidden');
        const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
        document.getElementById('dps-display').innerText = `🛸 Portal Courier: $${formatMoney(bestFood.sell * 3)}/3s`;
    }
}

// --- §6 Drawing ---

function getVisualPhase() {
    // Presentation-only progression derived from existing unlock/staff state; no mechanics are changed.
    let phase = 1;
    if (unlockedFoods.length >= 3) phase = 2;
    if (staff.cleaner || staff.chef || unlockedFoods.length >= 6) phase = 3;
    if (staff.delivery || unlockedFoods.length >= 10) phase = 4;
    if (unlockedFoods.length >= 14) phase = 5;
    return phase;
}

function drawPortalRift(x, y, scale, phase, alpha = 1) {
    const pulse = 0.5 + Math.sin(lastTime * 0.004 + scale) * 0.5;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(lastTime * 0.00055 * (phase % 2 ? 1 : -1));
    ctx.globalAlpha = alpha;
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.strokeStyle = i % 2
            ? `rgba(101,247,255,${0.2 - i * 0.026})`
            : `rgba(55,255,107,${0.34 - i * 0.038})`;
        ctx.lineWidth = Math.max(1.5, (8 - i) * scale);
        ctx.ellipse(0, 0, (72 + i * 16 + portalPulseOffset(i, pulse)) * scale, (21 + i * 5 + pulse * 3) * scale, i * 0.52, 0, Math.PI * 2);
        ctx.stroke();
    }
    for (let s = 0; s < 9 + phase; s++) {
        const a = lastTime * 0.0012 + s * 0.7;
        const rr = (50 + (s % 4) * 16) * scale;
        ctx.fillStyle = s % 3 === 0 ? 'rgba(215,255,79,0.46)' : 'rgba(101,247,255,0.32)';
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rr, Math.sin(a * 1.4) * rr * 0.36, Math.max(1.2, 2.2 * scale), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function portalPulseOffset(i, pulse) {
    return pulse * (4 + i * 1.2);
}

function drawLabBackdrop(phase) {
    // Procedural animated background replaces stock/static scene ownership and stays behind gameplay objects.
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, phase >= 5 ? '#070820' : '#082b31');
    bgGradient.addColorStop(0.48, phase >= 4 ? '#15102a' : '#071f28');
    bgGradient.addColorStop(1, '#080816');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    const tileSize = 40;
    const drift = (lastTime * 0.012) % tileSize;
    for (let x = -tileSize; x < cw + tileSize; x += tileSize) {
        for (let y = -tileSize; y < ch; y += tileSize) {
            const xx = x + drift * 0.18;
            const yy = y + drift * 0.32;
            ctx.fillStyle = ((Math.floor(x/tileSize) + Math.floor(y/tileSize)) % 2 === 0) ? 'rgba(55,255,107,0.055)' : 'rgba(101,247,255,0.022)';
            ctx.fillRect(xx, yy, tileSize, tileSize);
        }
    }

    ctx.strokeStyle = 'rgba(118, 255, 99, 0.08)';
    ctx.lineWidth = 1;
    for (let x = -tileSize; x < cw + tileSize; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x + drift * 0.18, 0);
        ctx.lineTo(x + drift * 0.18, ch);
        ctx.stroke();
    }
    for (let y = -tileSize; y < ch; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y + drift * 0.32);
        ctx.lineTo(cw, y + drift * 0.32);
        ctx.stroke();
    }

    drawPortalRift(cw * 0.5, ch * 0.11, 1, phase, 0.95);
    if (phase >= 2) {
        drawCitadelSilhouettes(phase);
        drawPortalRift(cw * 0.17, ch * 0.24, 0.34, phase, 0.42);
        drawPortalRift(cw * 0.83, ch * 0.23, 0.3, phase, 0.36);
    }
    if (phase >= 3) drawSpecimenTubes(phase);
    if (phase >= 4) drawMutationVeins();
    drawAmbientStars(phase);
}

function drawCitadelSilhouettes(phase) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    for (let i = 0; i < 5; i++) {
        const x = cw * (0.14 + i * 0.18);
        const h = (42 + (i % 2) * 26 + phase * 6);
        const y = ch * 0.36 - h;
        ctx.fillStyle = i % 2 ? 'rgba(30,83,86,0.48)' : 'rgba(20,61,70,0.52)';
        ctx.beginPath();
        ctx.roundRect(x - 13, y, 26, h, 8);
        ctx.fill();
        ctx.fillStyle = 'rgba(101,247,255,0.28)';
        for (let w = 0; w < 3; w++) {
            ctx.fillRect(x - 7, y + 10 + w * 15, 14, 2);
        }
    }
    ctx.restore();
}

function drawSpecimenTubes(phase) {
    ctx.save();
    ctx.globalAlpha = 0.44;
    const baseY = ch * 0.31;
    for (let i = 0; i < 4; i++) {
        const x = cw * (0.22 + i * 0.18);
        const bob = Math.sin(lastTime * 0.002 + i) * 3;
        ctx.strokeStyle = 'rgba(101,247,255,0.34)';
        ctx.lineWidth = 2;
        ctx.fillStyle = i % 2 ? 'rgba(255,79,216,0.11)' : 'rgba(55,255,107,0.12)';
        ctx.beginPath();
        ctx.roundRect(x - 10, baseY - 42 + bob, 20, 64, 10);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(215,255,79,0.35)';
        ctx.beginPath();
        ctx.arc(x + Math.sin(lastTime * 0.003 + i) * 5, baseY - 12 + bob, 4 + (phase % 2), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawMutationVeins() {
    ctx.save();
    ctx.globalAlpha = 0.2 + Math.sin(lastTime * 0.004) * 0.04;
    ctx.strokeStyle = 'rgba(255,79,216,0.36)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const y = ch * (0.2 + i * 0.08);
        ctx.moveTo(0, y);
        for (let x = 0; x < cw; x += 42) {
            ctx.lineTo(x, y + Math.sin(lastTime * 0.002 + x * 0.02 + i) * 10);
        }
        ctx.stroke();
    }
    ctx.restore();
}

function drawAmbientStars(phase) {
    ctx.save();
    const count = 14 + phase * 5;
    for (let i = 0; i < count; i++) {
        const x = (i * 73 + lastTime * (0.008 + phase * 0.001)) % (cw + 24) - 12;
        const y = (i * 47) % Math.max(1, ch * 0.48);
        const twinkle = 0.22 + Math.sin(lastTime * 0.003 + i) * 0.12;
        ctx.fillStyle = i % 5 === 0 ? `rgba(215,255,79,${twinkle})` : `rgba(101,247,255,${twinkle})`;
        ctx.beginPath();
        ctx.arc(x, y, i % 4 === 0 ? 1.8 : 1.1, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawTable(t) {
    ctx.save();
    ctx.shadowColor = 'rgba(55, 255, 107, 0.28)';
    ctx.shadowBlur = 18;
    const tableGradient = ctx.createRadialGradient(t.x - 9, t.y - 10, 2, t.x, t.y, 31);
    tableGradient.addColorStop(0, '#2adf9a');
    tableGradient.addColorStop(0.58, '#10766d');
    tableGradient.addColorStop(1, '#06353d');
    ctx.fillStyle = tableGradient;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(215, 255, 79, 0.72)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(101,247,255,0.46)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 15, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#06353d';
    [[-20,0], [20,0], [0,-20]].forEach(([dx, dy]) => {
        ctx.beginPath();
        ctx.arc(t.x + dx, t.y + dy, 8, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.restore();
}

function drawResidue(d) {
    ctx.save();
    const wobble = 1 + Math.sin(lastTime * 0.006 + d.x) * 0.06;
    const goo = ctx.createRadialGradient(d.x - 5, d.y - 6, 2, d.x, d.y, d.r * 1.45);
    goo.addColorStop(0, '#d7ff4f');
    goo.addColorStop(0.45, '#37ff6b');
    goo.addColorStop(1, '#068c52');
    ctx.fillStyle = goo;
    ctx.shadowColor = 'rgba(55,255,107,0.5)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r * 1.05 * wobble, d.r * 0.86, Math.sin(lastTime * 0.002 + d.y) * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(183,255,67,0.88)';
    ctx.beginPath();
    ctx.arc(d.x + 5, d.y - 5, d.r/2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(101,247,255,0.72)';
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(d.x - 7 + i * 7, d.y + 5 + Math.sin(lastTime * 0.006 + i) * 2, 2.1, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawCustomer(c) {
    ctx.save();
    const isScientist = Math.floor((c.color.length + c.x + c.y) % 2) === 0;
    const bodyGradient = ctx.createRadialGradient(c.x - 6, c.y - 8, 4, c.x, c.y, 24);
    bodyGradient.addColorStop(0, '#fff5cf');
    bodyGradient.addColorStop(0.22, c.isVip ? '#ffe39b' : '#ffd9b3');
    bodyGradient.addColorStop(0.23, c.color);
    bodyGradient.addColorStop(1, isScientist ? '#143d56' : '#4b1730');
    ctx.fillStyle = bodyGradient;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 19, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = c.isVip ? '#ffd166' : 'rgba(255, 236, 200, 0.58)';
    ctx.lineWidth = 2.3;
    ctx.stroke();

    if (isScientist) {
        ctx.fillStyle = 'rgba(175,238,255,0.9)';
        for (let i = 0; i < 5; i++) {
            const a = -Math.PI * 0.95 + i * 0.47;
            ctx.beginPath();
            ctx.moveTo(c.x + Math.cos(a) * 8, c.y - 11 + Math.sin(a) * 4);
            ctx.lineTo(c.x + Math.cos(a) * 20, c.y - 23 + Math.sin(a) * 9);
            ctx.lineTo(c.x + Math.cos(a + 0.18) * 9, c.y - 11 + Math.sin(a + 0.18) * 4);
            ctx.fill();
        }
    } else {
        ctx.fillStyle = 'rgba(255,230,74,0.86)';
        ctx.beginPath();
        ctx.roundRect(c.x - 14, c.y + 6, 28, 15, 7);
        ctx.fill();
    }

    ctx.fillStyle = '#fff5ea';
    ctx.beginPath();
    ctx.arc(c.x, c.y - 4, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(c.x - 11, c.y - 4, 5, 0, Math.PI * 2);
    ctx.arc(c.x + 11, c.y - 4, 5, 0, Math.PI * 2);
    ctx.fill();

    if (c.isVip) {
        ctx.shadowColor = 'rgba(255,209,102,0.6)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.moveTo(c.x - 12, c.y - 15);
        ctx.lineTo(c.x - 6, c.y - 26);
        ctx.lineTo(c.x, c.y - 16);
        ctx.lineTo(c.x + 6, c.y - 26);
        ctx.lineTo(c.x + 12, c.y - 15);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.fillStyle = '#2e1121';
    ctx.beginPath();
    ctx.arc(c.x - 5, c.y - 3, 1.9, 0, Math.PI*2);
    ctx.arc(c.x + 5, c.y - 3, 1.9, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = isScientist ? '#0e92a3' : '#c45749';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(c.x, c.y + 3, 4, 0.15, Math.PI - 0.15);
    ctx.stroke();

    if (c.state === 'WAITING') drawOrderBubble(c);
    ctx.restore();
}

function drawOrderBubble(c) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 248, 233, 0.97)';
    ctx.shadowColor = 'rgba(0,0,0,0.18)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.roundRect(c.x + 10, c.y - 40, 42, 30, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(55, 255, 107, 0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(101,247,255,0.48)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x + 31, c.y - 25, 17, 0.2, Math.PI * 1.8);
    ctx.stroke();

    ctx.font = '600 18px "Rajdhani"';
    ctx.fillStyle = '#2c1220';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.order.icon, c.x + 31, c.y - 25);

    if (c.quantity > 1) {
        ctx.font = 'bold 12px "Bangers"';
        ctx.fillStyle = '#cf4b2f';
        ctx.fillText(`x${c.quantity}`, c.x + 47, c.y - 36);
    }
    ctx.restore();
}

function draw() {
    const visualPhase = getVisualPhase();
    drawLabBackdrop(visualPhase);

    tables.forEach(drawTable);
    dirts.forEach(drawResidue);
    customers.forEach(drawCustomer);

    // Particles
    particles.forEach(p => {
        ctx.save();
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // Floating Text
    ctx.font = 'bold 24px "Bangers"';
    ctx.textAlign = 'center';
    floatingTexts.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; // Shadow
        ctx.fillText(t.text, t.x + 2, t.y + 2);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    });
}

// --- §7 Utils ---

function initAudio() {
    if (audioReady) return;
    audioReady = true;
    const bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
}

function showGifFeedback(type, duration = 1000) {
    const config = GIFS[type];
    if (!config) return;
    const img = document.getElementById(config.imgId);
    const label = document.getElementById(config.labelId);
    if (!img || !label) return;
    img.classList.add('is-visible');
    label.classList.add('is-visible');
    clearTimeout(config.timer);
    config.timer = setTimeout(() => {
        img.classList.remove('is-visible');
        label.classList.remove('is-visible');
    }, duration);
}

function playSound(type) {
    if (!audioCtx) return;
    const idMap = {
        collect: 'sfx_collect',
        unlock: 'sfx_unlock',
        clean: 'sfx_clean',
        ui: 'sfx_ui'
    };
    const el = document.getElementById(idMap[type] || 'sfx_ui');
    if (el) {
        el.currentTime = 0;
        el.play().catch(() => playSynth(type));
    } else {
        playSynth(type);
    }
}

function playSynth(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(780, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'clean') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.16);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
    } else if (type === 'ui') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(760, audioCtx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.24);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    }
}

function vibrate(style) {
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 50 : 10);
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
        params: { style }
    });
}
