<script>
// --- §2 System Invariants & Constants ---
const FOODS = [
    { id: 'fries', name: 'Pumpkin Pasty', price: 0, sell: 2, icon: '🥟' },
    { id: 'mozz', name: 'Chocolate Frog', price: 45, sell: 7, icon: '🐸' },

    { id: 'pizza', name: 'Great Hall Pie', price: 55000000, sell: 6000000, icon: '🥧' },
    { id: 'dblzinger', name: 'Double Cauldron Roast', price: 102000000, sell: 11000000, icon: '🍖' },
    { id: 'black', name: 'Black Lake Bento', price: 230000000, sell: 25000000, icon: '🍘' },
    { id: 'gold', name: 'Golden Snitch Sweet', price: 400000000, sell: 45000000, icon: '🥯' },
    { id: 'xxl', name: 'XXL Feast Hamper', price: 1000000000, sell: 120000000, icon: '🧺' },
    { id: 'dark', name: 'Dark Moon Pudding', price: 99000000000, sell: 11000000000, icon: '🌑' },
    { id: 'rainbow', name: 'Rainbow Elixir', price: 2000000000000, sell: 250000000000, icon: '🌈' },
];

const STAFF = [
    { id: 'cleaner', name: 'Scourgify Charm', price: 89000, desc: 'Auto-cleans potion spills', icon: '🪄' },
    { id: 'chef', name: 'Enchanted Ladle', price: 120000, desc: 'Auto-serves students', icon: '🥄' },
    { id: 'delivery', name: 'Owl Post Courier', price: 400000, desc: 'Delivers for x3 income', icon: '🦉' }
];

// Formatting
const GIFS = {
    celebrate: { imgId: 'gif-celebrate', labelId: 'gif-celebrate-label', timer: null },
    chaos: { imgId: 'gif-chaos', labelId: 'gif-chaos-label', timer: null }
};

const formatMoney = (n) => {
    if (n < 1000) return Math.floor(n);
    const suffixes = ["", "K", "M", "B", "T", "Qa"];
    const suffixNum = Math.floor(("" + Math.floor(n)).length / 3);
    let shortValue = parseFloat((suffixNum != 0 ? (n / Math.pow(1000, suffixNum)) : n).toPrecision(3));
    if (shortValue % 1 != 0) shortValue = shortValue.toFixed(1);
    return shortValue + suffixes[suffixNum];
};

// Global State
let canvas, ctx, cw, ch;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING
let gameConfig = {};
let audioCtx = null;
let audioReady = false;

// Game Data
let money = 0;
let unlockedFoods = [0]; // indicies of FOODS
let staff = { cleaner: false, chef: false, delivery: false };
let tables = [];
let customers = [];
let dirts = [];
let particles = [];
let floatingTexts = [];
let deliveryTimer = 0;
let chefTimer = 0;

// --- §3 Lifecycle & Core ---

window.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Setup
    setupShop();
    document.getElementById('tab-food').onclick = () => switchTab('food');
    document.getElementById('tab-staff').onclick = () => switchTab('staff');
    
    window.addEventListener('resize', resize);
    resize();
    initGame();
    
    // Start loop
    gameState = 'PLAYING';
    requestAnimationFrame(loop);
    
    // Input
    window.addEventListener('pointerdown', handleInput, { passive: false });
    
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.2;
    ['sfx_collect', 'sfx_unlock', 'sfx_clean', 'sfx_ui'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.volume = id === 'sfx_collect' ? 0.45 : 0.38;
    });
});

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            for (let k in defs) gameConfig[k] = defs[k].value;
        } catch(e) { console.error(e); }
    }
    // Fallbacks
    if (!gameConfig.customerSpeed) gameConfig.customerSpeed = 3;
    if (!gameConfig.vipChance) gameConfig.vipChance = 0.5;
    if (!gameConfig.themeColor) gameConfig.themeColor = '#FF6B6B';
}

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Re-layout tables
    setupTables();
}

function setupTables() {
    tables = [];
    const cols = 2;
    const rows = 3;
    const marginX = cw * 0.15;
    const marginY = ch * 0.15;
    const startY = ch * 0.15;
    
    const cellW = (cw - marginX * 2) / (cols - 1 || 1);
    const cellH = (ch * 0.5 - marginY) / (rows - 1 || 1);
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            tables.push({
                x: marginX + c * cellW,
                y: startY + r * cellH,
                occupied: false,
                id: r * cols + c
            });
        }
    }
}

function initGame() {
    money = 0;
    unlockedFoods = [0];
    staff = { cleaner: false, chef: false, delivery: false };
    customers = [];
    dirts = [];
    particles = [];
    floatingTexts = [];
    updateUI();
}

// --- §4 Game Logic ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            update(dt);
            draw();
        }
    } catch (e) {
        console.error("Loop Error:", e);
    }
    requestAnimationFrame(loop);
}

function update(dt) {
    const cappedDt = Math.min(dt, 0.1);
    
    // Spawn Customers
    if (customers.length < tables.length && Math.random() < 0.02) {
        spawnCustomer();
    }
    
    // Update Customers
    customers.forEach(c => {
        if (c.state === 'ENTERING') {
            const dx = c.targetTable.x - c.x;
            const dy = c.targetTable.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 5) {
                c.x = c.targetTable.x;
                c.y = c.targetTable.y;
                c.state = 'WAITING';
                c.targetTable.occupied = true;
                // Decide order
                const possibleFoods = unlockedFoods.map(i => FOODS[i]);
                c.order = possibleFoods[Math.floor(Math.random() * possibleFoods.length)];
                c.quantity = Math.floor(Math.random() * 3) + 1; // 1-3 items
            } else {
                c.x += (dx / dist) * gameConfig.customerSpeed * 60 * cappedDt;
                c.y += (dy / dist) * gameConfig.customerSpeed * 60 * cappedDt;
            }
        } else if (c.state === 'LEAVING') {
            c.y += gameConfig.customerSpeed * 60 * cappedDt;
            if (c.y > ch + 50) c.dead = true;
        }
    });
    
    // Clean up dead customers
    customers = customers.filter(c => {
        if (c.dead) {
            if (c.targetTable) c.targetTable.occupied = false;
            // Spawn dirt
            if (Math.random() < 0.6) spawnDirt(c.x, c.y);
            return false;
        }
        return true;
    });

    // Auto Chef
    if (staff.chef) {
        chefTimer += cappedDt;
        if (chefTimer > 1.0) { // Chef serves one customer per second
            chefTimer = 0;
            const waiting = customers.find(c => c.state === 'WAITING');
            if (waiting) serveCustomer(waiting);
        }
    }

    // Auto Cleaner
    if (staff.cleaner) {
        if (dirts.length > 0 && Math.random() < 0.05) {
            cleanDirt(dirts[0]);
        }
    }

    // Delivery Man Passive Income
    if (staff.delivery) {
        deliveryTimer += cappedDt;
        if (deliveryTimer > 3.0) {
            deliveryTimer = 0;
            // Best food x3
            const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
            const income = bestFood.sell * 3;
            addMoney(income);
            spawnFloatingText(cw/2, 50, `+${formatMoney(income)} (Owl Post!)`, '#88e6ff');
            playSound('collect');
            showGifFeedback('celebrate', 900);
        }
    }

    // Particles
    particles.forEach(p => {
        p.x += p.vx * cappedDt * 60;
        p.y += p.vy * cappedDt * 60;
        p.life -= cappedDt;
        p.vy += 0.5; // gravity
    });
    particles = particles.filter(p => p.life > 0);

    // Floating Text
    floatingTexts.forEach(t => {
        t.y -= 30 * cappedDt;
        t.life -= cappedDt;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);
}

function spawnCustomer() {
    // Find empty table
    const emptyTables = tables.filter(t => !t.occupied && !customers.some(c => c.targetTable === t));
    if (emptyTables.length === 0) return;
    
    const table = emptyTables[Math.floor(Math.random() * emptyTables.length)];
    const isVip = Math.random() < gameConfig.vipChance;
    
    customers.push({
        x: cw / 2,
        y: ch + 50,
        targetTable: table,
        state: 'ENTERING',
        isVip: isVip,
        color: `hsl(${Math.random()*360}, 70%, 60%)`,
        dead: false
    });
}

function spawnDirt(x, y) {
    dirts.push({ x: x + (Math.random()-0.5)*20, y: y + (Math.random()-0.5)*20, r: 15 });
}

function serveCustomer(c) {
    if (c.state !== 'WAITING') return;
    
    const baseValue = c.order.sell * c.quantity;
    const multiplier = c.isVip ? 3 : 1;
    const total = baseValue * multiplier;
    
    addMoney(total);
    spawnFloatingText(c.x, c.y - 30, `+${formatMoney(total)}`, c.isVip ? '#FFD700' : '#FFF');
    playSound('collect');
    if (c.isVip || total >= 1000) showGifFeedback('celebrate', 1100);
    
    // Juice
    for(let i=0; i<8; i++) spawnParticle(c.x, c.y, c.isVip ? '#FFD700' : '#88CC88');
    vibrate(c.isVip ? 'medium' : 'light');
    
    c.state = 'LEAVING';
    c.targetTable.occupied = false;
    c.targetTable = null; // Detach from table immediately so new customer can come
}

function cleanDirt(d) {
    const idx = dirts.indexOf(d);
    if (idx > -1) {
        dirts.splice(idx, 1);
        spawnFloatingText(d.x, d.y, "Scourgify!", "#88e6ff");
        playSound('clean');
        for(let i=0; i<5; i++) spawnParticle(d.x, d.y, '#AAEEFF');
    }
}

function addMoney(amt) {
    money += amt;
    updateUI();
}

function spawnParticle(x, y, color) {
    particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10 - 5,
        color,
        life: 1.0,
        size: Math.random() * 4 + 2
    });
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1.0 });
}

// --- §5 Input & UI ---

function handleInput(e) {
    // L2 Audio Unlock
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    initAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Check Dirt
    let clickedDirt = false;
    for (let d of dirts) {
        const dx = x - d.x;
        const dy = y - d.y;
        if (dx*dx + dy*dy < d.r*d.r * 2) { // Generous hit area
            cleanDirt(d);
            clickedDirt = true;
            break;
        }
    }
    if (clickedDirt) return;

    // Check Customers
    for (let c of customers) {
        if (c.state === 'WAITING') {
            const dx = x - c.x;
            const dy = y - c.y;
            if (dx*dx + dy*dy < 1600) { // 40px radius
                serveCustomer(c);
                return;
            }
        }
    }
}

function setupShop() {
    const foodList = document.getElementById('list-food');
    foodList.innerHTML = '';
    FOODS.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'shop-card flex justify-between items-center p-3 rounded-xl btn-push';
        div.id = `food-btn-${i}`;
        div.innerHTML = `
            <div class="flex items-center gap-3 ui-font">
                <div class="shop-card-icon text-2xl bg-orange-100 w-10 h-10 flex items-center justify-center rounded-full">${f.icon}</div>
                <div>
                    <div class="font-bold text-stone-800 text-sm leading-tight">${f.name}</div>
                    <div class="text-xs text-orange-700/80">Serve: 🪙${formatMoney(f.sell)}</div>
                </div>
            </div>
            <button class="buy-btn-food text-white px-3 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:bg-gray-400" onclick="buyFood(${i})">
                🪙${formatMoney(f.price)}
            </button>
        `;
        foodList.appendChild(div);
    });

    const staffList = document.getElementById('list-staff');
    staffList.innerHTML = '';
    STAFF.forEach((s) => {
        const div = document.createElement('div');
        div.className = 'shop-card flex justify-between items-center p-3 rounded-xl btn-push';
        div.id = `staff-btn-${s.id}`;
        div.innerHTML = `
            <div class="flex items-center gap-3 ui-font">
                <div class="shop-card-icon text-2xl bg-cyan-100 w-10 h-10 flex items-center justify-center rounded-full">${s.icon}</div>
                <div>
                    <div class="font-bold text-stone-800 text-sm leading-tight">${s.name}</div>
                    <div class="text-xs text-cyan-900/70">${s.desc}</div>
                </div>
            </div>
            <button class="buy-btn-staff text-white px-3 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:bg-gray-400" onclick="buyStaff('${s.id}')">
                🪙${formatMoney(s.price)}
            </button>
        `;
        staffList.appendChild(div);
    });
}

window.buyFood = (idx) => {
    const f = FOODS[idx];
    if (money >= f.price && !unlockedFoods.includes(idx)) {
        money -= f.price;
        unlockedFoods.push(idx);
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${f.name} Discovered!`, '#f5d87a');
        // Confetti
        for(let k=0; k<20; k++) spawnParticle(cw/2, ch/2, `hsl(${Math.random()*360}, 100%, 50%)`);
        updateUI();
    }
};

window.buyStaff = (id) => {
    const s = STAFF.find(x => x.id === id);
    if (money >= s.price && !staff[id]) {
        money -= s.price;
        staff[id] = true;
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${s.name} Summoned!`, '#88e6ff');
        updateUI();
    }
}

function switchTab(tab) {
    playSound('ui');
    const foodTab = document.getElementById('tab-food');
    const staffTab = document.getElementById('tab-staff');
    const foodList = document.getElementById('list-food');
    const staffList = document.getElementById('list-staff');

    if (tab === 'food') {
        foodTab.classList.add('is-active');
        staffTab.classList.remove('is-active');
        foodList.classList.remove('hidden');
        staffList.classList.add('hidden');
    } else {
        staffTab.classList.add('is-active');
        foodTab.classList.remove('is-active');
        staffList.classList.remove('hidden');
        foodList.classList.add('hidden');
    }
}

function getVisualPhase() {
    const unlockCount = unlockedFoods.length;
    if (unlockCount >= 14 || money >= 400000000) return { level: 5, label: 'Dark Feast', sky: ['#070814', '#10183b', '#05050d'], accent: '#88e6ff' };
    if (unlockCount >= 10 || staff.delivery) return { level: 4, label: 'House Cup', sky: ['#111a44', '#24153c', '#070611'], accent: '#f5d87a' };
    if (unlockCount >= 7 || staff.chef) return { level: 3, label: 'Hogsmeade', sky: ['#102142', '#172b4f', '#070611'], accent: '#bfe8ff' };
    if (unlockCount >= 4 || staff.cleaner) return { level: 2, label: 'Potions', sky: ['#0b2430', '#1b1134', '#070611'], accent: '#4bd280' };
    return { level: 1, label: 'Great Hall', sky: ['#101a47', '#181033', '#080611'], accent: '#f5d87a' };
}

function updateUI() {
    document.getElementById('score-display').innerText = formatMoney(money);
    const phase = getVisualPhase();
    const phaseDisplay = document.getElementById('phase-display');
    if (phaseDisplay) phaseDisplay.innerText = `✦ ${phase.label}`;
    
    // Update Shop Buttons
    FOODS.forEach((f, i) => {
        const btn = document.querySelector(`#food-btn-${i} button`);
        if (unlockedFoods.includes(i)) {
            btn.innerText = "Known";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < f.price;
            if (unlockedFoods.includes(i-1)) { // Only show next available
                 document.getElementById(`food-btn-${i}`)?.classList.remove('hidden');
            }
        }
    });

    STAFF.forEach(s => {
        const btn = document.querySelector(`#staff-btn-${s.id} button`);
        if (staff[s.id]) {
            btn.innerText = "Active";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < s.price;
        }
    });

    if (staff.delivery) {
        document.getElementById('dps-display').classList.remove('hidden');
        const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
        document.getElementById('dps-display').innerText = `🦉 Owl Post: 🪙${formatMoney(bestFood.sell * 3)}/3s`;
    }
}

// --- §6 Drawing ---

function draw() {
    // Authored Hogwarts Great Hall background; visual-only, no gameplay geometry changes.
    const time = performance.now() / 1000;
    const tileSize = 40;
    const phase = getVisualPhase();
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, phase.sky[0]);
    bgGradient.addColorStop(0.42, phase.sky[1]);
    bgGradient.addColorStop(1, phase.sky[2]);
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    // Distant castle windows and enchanted ceiling glow provide procedural world identity.
    ctx.fillStyle = 'rgba(5, 5, 14, 0.58)';
    ctx.beginPath();
    ctx.moveTo(0, ch * 0.27);
    for (let x = 0; x <= cw + 40; x += 42) {
        ctx.lineTo(x + 8, ch * 0.22 - ((x / 42) % 3) * 9);
        ctx.lineTo(x + 22, ch * 0.27);
    }
    ctx.lineTo(cw, ch * 0.32);
    ctx.lineTo(0, ch * 0.32);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(245, 216, 122, 0.22)';
    for (let x = 18; x < cw; x += 48) {
        ctx.fillRect(x, ch * 0.255 + Math.sin(time + x) * 1.5, 5, 10);
    }
    ctx.strokeStyle = `rgba(136, 230, 255, ${phase.level === 5 ? 0.25 : 0.08})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < phase.level; i++) {
        ctx.beginPath();
        ctx.arc(cw * (0.18 + i * 0.16), ch * 0.12, 30 + i * 4, time * 0.25 + i, time * 0.25 + i + Math.PI * 0.86);
        ctx.stroke();
    }

    // Enchanted ceiling stars and floating candles stay behind all tappable entities.
    ctx.fillStyle = 'rgba(255, 244, 188, 0.78)';
    for (let i = 0; i < 58; i++) {
        const sx = (i * 83 + Math.sin(time * 0.15 + i) * 12) % Math.max(cw, 1);
        const sy = 12 + ((i * 37) % Math.max(ch * 0.24, 1));
        const r = 0.8 + (i % 3) * 0.35;
        ctx.globalAlpha = 0.25 + 0.45 * Math.sin(time * 0.9 + i);
        ctx.beginPath();
        if (i % 9 === 0) {
            ctx.moveTo(sx, sy - r * 2.6);
            ctx.lineTo(sx + r * 0.9, sy - r * 0.6);
            ctx.lineTo(sx + r * 2.6, sy);
            ctx.lineTo(sx + r * 0.9, sy + r * 0.6);
            ctx.lineTo(sx, sy + r * 2.6);
            ctx.lineTo(sx - r * 0.9, sy + r * 0.6);
            ctx.lineTo(sx - r * 2.6, sy);
            ctx.lineTo(sx - r * 0.9, sy - r * 0.6);
            ctx.closePath();
        } else {
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
        }
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < 10; i++) {
        const cx = (i + 0.5) * cw / 10;
        const cy = 38 + (i % 2) * 28 + Math.sin(time + i) * 2;
        ctx.strokeStyle = 'rgba(244, 220, 159, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 16);
        ctx.lineTo(cx, cy + 8);
        ctx.stroke();
        ctx.fillStyle = '#f3e4b0';
        ctx.fillRect(cx - 3, cy - 1, 6, 14);
        ctx.fillStyle = `rgba(255, 192, 64, ${0.55 + Math.sin(time * 3 + i) * 0.18})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 5, 5, 9, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Great Hall stone floor/parchment grid.
    for (let x = 0; x < cw; x += tileSize) {
        for (let y = ch * 0.24; y < ch; y += tileSize) {
            ctx.fillStyle = ((x/tileSize + y/tileSize) % 2 === 0) ? 'rgba(224,183,94,0.075)' : 'rgba(255,255,255,0.025)';
            ctx.fillRect(x, y, tileSize, tileSize);
        }
    }
    ctx.strokeStyle = 'rgba(224, 183, 94, 0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x < cw; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, ch * 0.24);
        ctx.lineTo(x, ch);
        ctx.stroke();
    }
    for (let y = ch * 0.24; y < ch; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }

    // Distant house banners frame the playfield without becoming interactives.
    const bannerColors = ['#7f0909', '#0e5a2a', '#1f4c8f', '#d2a21f'];
    bannerColors.forEach((color, i) => {
        const bx = 18 + i * 26;
        const rx = cw - 31 - i * 26;
        const sway = Math.sin(time * 1.1 + i) * 4;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.76;
        ctx.fillRect(bx + sway * 0.18, 90, 13, 62 + sway);
        ctx.beginPath();
        ctx.moveTo(bx + sway * 0.18, 152);
        ctx.lineTo(bx + 6.5 + sway * 0.18, 162);
        ctx.lineTo(bx + 13 + sway * 0.18, 152);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.52;
        ctx.fillRect(rx - sway * 0.18, 88, 13, 54 - sway);
        ctx.beginPath();
        ctx.moveTo(rx - sway * 0.18, 142);
        ctx.lineTo(rx + 6.5 - sway * 0.18, 152);
        ctx.lineTo(rx + 13 - sway * 0.18, 142);
        ctx.closePath();
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // House tables
    ctx.fillStyle = '#6b451f';
    tables.forEach(t => {
        const house = bannerColors[t.id % bannerColors.length];
        ctx.shadowColor = 'rgba(245, 216, 122, 0.28)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 221, 160, 0.55)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = house;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 16, time * 0.25 + t.id, time * 0.25 + t.id + Math.PI * 1.35);
        ctx.stroke();
        ctx.fillStyle = '#3a2414';
        ctx.beginPath(); ctx.arc(t.x - 20, t.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(t.x + 20, t.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(t.x, t.y - 20, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 247, 224, 0.72)';
        ctx.font = 'bold 10px "Cinzel"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(['G','S','R','H'][t.id % 4], t.x, t.y);
        ctx.fillStyle = '#6b451f';
    });

    // Potion spills / scorch marks
    dirts.forEach(d => {
        ctx.fillStyle = phase.level >= 5 ? 'rgba(25, 24, 35, 0.95)' : 'rgba(73, 26, 99, 0.92)';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = phase.level >= 5 ? 'rgba(136, 230, 255, 0.72)' : 'rgba(75, 210, 128, 0.82)';
        ctx.beginPath();
        ctx.arc(d.x + 5, d.y - 5, d.r/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = phase.level >= 5 ? 'rgba(136, 230, 255, 0.72)' : 'rgba(152, 255, 194, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r + 3 + Math.sin(time * 4 + d.x) * 1.5, 0.2, Math.PI * 1.55);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.38)';
        for (let b = 0; b < 3; b++) {
            ctx.beginPath();
            ctx.arc(d.x - 8 + b * 7, d.y - d.r - 5 - Math.sin(time * 2 + b) * 3, 1.8, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Customers
    customers.forEach(c => {
        // Body
        const bodyGradient = ctx.createRadialGradient(c.x - 6, c.y - 8, 4, c.x, c.y, 24);
        bodyGradient.addColorStop(0, '#fff5cf');
        bodyGradient.addColorStop(0.22, c.isVip ? '#ffe39b' : '#ffd9b3');
        bodyGradient.addColorStop(0.23, c.color);
        bodyGradient.addColorStop(1, '#4b1730');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 19, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = c.isVip ? '#ffd166' : 'rgba(255, 236, 200, 0.45)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff5ea';
        ctx.beginPath();
        ctx.arc(c.x, c.y - 4, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.x - 11, c.y - 4, 5, 0, Math.PI * 2);
        ctx.arc(c.x + 11, c.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();

        // Wizard hat / professor VIP glow
        ctx.strokeStyle = c.isVip ? 'rgba(245, 216, 122, 0.75)' : 'rgba(136, 230, 255, 0.18)';
        ctx.lineWidth = c.isVip ? 3 : 1;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.isVip ? 26 : 23, -0.15 + Math.sin(time) * 0.08, Math.PI * 1.2);
        ctx.stroke();
        ctx.fillStyle = c.isVip ? '#f5d87a' : '#24152f';
        ctx.beginPath();
        ctx.moveTo(c.x - 12, c.y - 12);
        ctx.lineTo(c.x, c.y - 30);
        ctx.lineTo(c.x + 12, c.y - 12);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = c.isVip ? '#fff2aa' : 'rgba(245, 216, 122, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (c.isVip) {
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(c.x, c.y - 23, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Eyes and tiny round glasses reinforce the wizard-student focal identity.
        ctx.strokeStyle = '#2e1121';
        ctx.lineWidth = 1.35;
        ctx.beginPath();
        ctx.arc(c.x - 5, c.y - 3, 3.2, 0, Math.PI*2);
        ctx.arc(c.x + 5, c.y - 3, 3.2, 0, Math.PI*2);
        ctx.moveTo(c.x - 1.8, c.y - 3);
        ctx.lineTo(c.x + 1.8, c.y - 3);
        ctx.stroke();
        ctx.fillStyle = '#2e1121';
        ctx.beginPath();
        ctx.arc(c.x - 5, c.y - 3, 1.3, 0, Math.PI*2);
        ctx.arc(c.x + 5, c.y - 3, 1.3, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#c45749';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(c.x, c.y + 3, 4, 0.15, Math.PI - 0.15);
        ctx.stroke();
        if (c.isVip) {
            ctx.strokeStyle = '#9b6a16';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(c.x + 1, c.y - 12);
            ctx.lineTo(c.x - 2, c.y - 8);
            ctx.lineTo(c.x + 2, c.y - 8);
            ctx.lineTo(c.x - 1, c.y - 4);
            ctx.stroke();
        }

        // Order Bubble
        if (c.state === 'WAITING') {
            ctx.fillStyle = 'rgba(255, 248, 233, 0.96)';
            ctx.beginPath();
            ctx.roundRect(c.x + 10, c.y - 40, 40, 30, 7);
            ctx.fill();
            ctx.strokeStyle = 'rgba(155, 106, 22, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = '600 18px "Rajdhani"';
            ctx.fillStyle = '#2c1220';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(c.order.icon, c.x + 30, c.y - 25);
            
            // Quantity
            if (c.quantity > 1) {
                ctx.font = 'bold 12px "Cinzel"';
                ctx.fillStyle = '#cf4b2f';
                ctx.fillText(`x${c.quantity}`, c.x + 45, c.y - 35);
            }
        }
    });

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (p.size > 4.5) {
            ctx.moveTo(p.x, p.y - p.size);
            ctx.lineTo(p.x + p.size * 0.38, p.y - p.size * 0.2);
            ctx.lineTo(p.x + p.size, p.y);
            ctx.lineTo(p.x + p.size * 0.38, p.y + p.size * 0.2);
            ctx.lineTo(p.x, p.y + p.size);
            ctx.lineTo(p.x - p.size * 0.38, p.y + p.size * 0.2);
            ctx.lineTo(p.x - p.size, p.y);
            ctx.lineTo(p.x - p.size * 0.38, p.y - p.size * 0.2);
            ctx.closePath();
        } else {
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        }
        ctx.fill();
    });

    // Floating Text
    ctx.font = 'bold 24px "Cinzel"';
    ctx.textAlign = 'center';
    floatingTexts.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; // Shadow
        ctx.fillText(t.text, t.x + 2, t.y + 2);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    });
}

// --- §7 Utils ---

function initAudio() {
    if (audioReady) return;
    audioReady = true;
    const bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
}

function showGifFeedback(type, duration = 1000) {
    const config = GIFS[type];
    if (!config) return;
    const img = document.getElementById(config.imgId);
    const label = document.getElementById(config.labelId);
    if (!img || !label) return;
    img.classList.add('is-visible');
    label.classList.add('is-visible');
    clearTimeout(config.timer);
    config.timer = setTimeout(() => {
        img.classList.remove('is-visible');
        label.classList.remove('is-visible');
    }, duration);
}

function playSound(type) {
    if (!audioCtx) return;
    const idMap = {
        collect: 'sfx_collect',
        unlock: 'sfx_unlock',
        clean: 'sfx_clean',
        ui: 'sfx_ui'
    };
    const el = document.getElementById(idMap[type] || 'sfx_ui');
    if (el) {
        el.currentTime = 0;
        el.play().catch(() => playSynth(type));
    } else {
        playSynth(type);
    }
}

function playSynth(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(780, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'clean') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.16);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
    } else if (type === 'ui') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(760, audioCtx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.24);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    }
}

function vibrate(style) {
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 50 : 10);
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
        params: { style }
    });
}
