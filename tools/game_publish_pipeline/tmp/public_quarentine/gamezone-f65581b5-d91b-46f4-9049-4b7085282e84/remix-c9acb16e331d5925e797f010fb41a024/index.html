<script>
window.tailwind = {
    config: {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Rajdhani"', 'system-ui', 'sans-serif'],
                    display: ['"Bangers"', '"Rajdhani"', 'sans-serif']
                }
            }

<script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Bangers&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #3b0f1f;
        --bg-bottom: #120816;
        --grid-a: #4c1427;
        --grid-b: #2f0c19;
        --panel: rgba(63, 18, 35, 0.84);
        --panel-strong: rgba(99, 27, 53, 0.94);
        --panel-border: rgba(255, 204, 120, 0.65);
        --accent: #ff8a5b;
        --accent-strong: #ffd166;
        --accent-cool: #73f6d1;
        --text-main: #fff8ed;
        --text-soft: #ffd7b8;
        --shadow: rgba(0, 0, 0, 0.28);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 164, 77, 0.2), transparent 35%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(90deg, transparent 0 49.2%, rgba(255,255,255,0.04) 49.2% 50.8%, transparent 50.8% 100%),
            linear-gradient(transparent 0 49.2%, rgba(255,255,255,0.04) 49.2% 50.8%, transparent 50.8% 100%);
        background-size: 56px 56px;
        opacity: 0.22;
        mix-blend-mode: screen;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass {
        background: linear-gradient(180deg, rgba(91, 24, 49, 0.96), rgba(42, 12, 27, 0.96));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 227, 171, 0.45);
        box-shadow: 0 -12px 30px rgba(0,0,0,0.28);
    }
    .btn-push { transition: transform 0.08s ease, filter 0.18s ease, box-shadow 0.18s ease; }
    .btn-push:active { transform: scale(0.96); filter: brightness(1.08); }
    .hidden { display: none !important; }
    .shop-scroll::-webkit-scrollbar { width: 0px; background: transparent; }
    .text-outline { text-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
    .brand-font { font-family: 'Bangers', 'Rajdhani', sans-serif; letter-spacing: 0.04em; }
    .ui-font { font-family: 'Rajdhani', system-ui, sans-serif; }
    .feedback-overlay {
        position: absolute;
        right: 0.75rem;
        top: 5.5rem;
        width: min(30vw, 128px);
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        pointer-events: none;
        z-index: 12;
        align-items: flex-end;
    }
    .feedback-gif {
        width: min(28vw, 120px);
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 1rem;
        border: 2px solid rgba(255, 222, 162, 0.7);
        box-shadow: 0 12px 26px rgba(0,0,0,0.24);
        background: rgba(24, 10, 20, 0.55);
        opacity: 0;
        transform: translateY(-8px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
    }
    .feedback-gif.is-visible {
        opacity: 0.94;
        transform: translateY(0) scale(1);
    }
    .feedback-caption {
        min-width: 92px;
        padding: 0.28rem 0.6rem;
        border-radius: 999px;
        background: rgba(32, 10, 20, 0.78);
        border: 1px solid rgba(255, 211, 141, 0.5);
        font-family: 'Bangers', 'Rajdhani', sans-serif;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        color: #fff1d2;
        text-align: center;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 180ms ease, transform 180ms ease;
    }
    .feedback-caption.is-visible {
        opacity: 1;
        transform: translateY(0);
    }
    @media (max-width: 640px) {
        .feedback-overlay {
            top: 5rem;
            right: 0.5rem;
            width: 88px;
        }
        .feedback-gif {
            width: 84px;
        }
        .feedback-caption {
            min-width: 84px;
            font-size: 0.72rem;
            padding: 0.2rem 0.45rem;
        }
    }
    .hud-pill {
        background: linear-gradient(180deg, rgba(104, 28, 54, 0.95), rgba(57, 14, 31, 0.95));
        border: 2px solid var(--panel-border);
        color: var(--text-main);
        box-shadow: 0 10px 24px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .hud-pill--cool {
        background: linear-gradient(180deg, rgba(18, 111, 112, 0.9), rgba(10, 66, 80, 0.95));
        border-color: rgba(115, 246, 209, 0.7);
    }
    .tab-btn {
        border-bottom-width: 4px;
        color: rgba(255, 219, 191, 0.62);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    .tab-btn.is-active {
        color: var(--accent-strong);
        border-color: var(--accent);
        text-shadow: 0 0 12px rgba(255, 193, 92, 0.32);
    }
    .shop-card {
        background: linear-gradient(180deg, rgba(255, 247, 235, 0.98), rgba(255, 229, 202, 0.95));
        border: 2px solid rgba(150, 56, 44, 0.14);
        box-shadow: 0 10px 18px rgba(0,0,0,0.12);
    }
    .shop-card-icon {
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45), 0 6px 12px rgba(0,0,0,0.08);
    }
    .buy-btn-food {
        background: linear-gradient(180deg, #ff9f68, #e66a3a);
        box-shadow: 0 6px 14px rgba(198, 84, 33, 0.28);
    }
    .buy-btn-staff {
        background: linear-gradient(180deg, #2bb5b1, #157b8d);
        box-shadow: 0 6px 14px rgba(20, 91, 104, 0.28);
    }
    .buy-btn-food:disabled, .buy-btn-staff:disabled {
        box-shadow: none;
    }
</style>

<body>

<!-- UI Layer -->
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: celebration/fail-feedback -> catalogs/gifs.json -->
        <div class="feedback-overlay" aria-hidden="true">
            <img

                id="gif-chaos"

            >

    <!-- HUD -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between">
        <div class="p-4 pt-12 flex justify-between items-start">
            <div class="hud-pill rounded-full px-5 py-2 shadow-lg flex items-center gap-3">
                <span class="text-2xl">💰</span>

                    <div class="text-[10px] uppercase tracking-[0.24em] text-orange-100/70">Rush Cash</div>
                    <span id="score-display" class="text-2xl font-bold text-amber-50">0</span>
                </div>
            </div>
            <div id="dps-display" class="hud-pill hud-pill--cool rounded-full px-4 py-1.5 shadow-lg text-sm font-bold hidden">
                🛵 Courier: $0/3s
            </div>
        </div>

        <!-- Shop / Menu -->
        <div class="pointer-events-auto h-2/5 w-full glass flex flex-col rounded-t-3xl transition-transform duration-300 transform translate-y-0" id="shop-panel">
            <div class="w-full flex justify-center py-2" id="shop-handle">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>

            <div class="flex border-b border-gray-200 px-4 pb-2 gap-4">
                <button id="tab-food" class="tab-btn is-active flex-1 py-2 font-bold transition-colors brand-font">Menu</button>

                <!-- Food items generated here -->

<script>
// --- §2 System Invariants & Constants ---
const FOODS = [
    { id: 'fries', name: 'French Fries', price: 0, sell: 2, icon: '🍟' },
    { id: 'mozz', name: 'Mozzarella Sticks', price: 45, sell: 7, icon: '🧀' },
    { id: 'soda', name: 'Soda', price: 200, sell: 25, icon: '🥤' },
    { id: 'burger', name: 'Patty Burger', price: 1300, sell: 150, icon: '🍔' },
    { id: 'shawarma', name: 'Shawarma', price: 20000, sell: 2200, icon: '🌯' },
    { id: 'loaded', name: 'Loaded Fries', price: 170000, sell: 18000, icon: '🥘' },
    { id: 'zinger', name: 'Zinger Burger', price: 530000, sell: 55000, icon: '🍗' },
    { id: 'fish', name: 'Fried Fish', price: 1000000, sell: 110000, icon: '🐟' },
    { id: 'sushi', name: 'Sushi', price: 4200000, sell: 450000, icon: '🍣' },
    { id: 'crab', name: 'Crab', price: 9200000, sell: 1000000, icon: '🦀' },
    { id: 'lobster', name: 'Lobster', price: 20000000, sell: 2200000, icon: '🦞' },
    { id: 'pizza', name: 'Pizza', price: 55000000, sell: 6000000, icon: '🍕' },
    { id: 'dblzinger', name: 'Dbl Zinger', price: 102000000, sell: 11000000, icon: '🍖' },
    { id: 'black', name: 'Black Burger', price: 230000000, sell: 25000000, icon: '🍘' },
    { id: 'gold', name: 'Gold Burger', price: 400000000, sell: 45000000, icon: '🥯' },
    { id: 'xxl', name: 'XXL Pizza', price: 1000000000, sell: 120000000, icon: '🥡' },
    { id: 'dark', name: 'Dark Pizza', price: 99000000000, sell: 11000000000, icon: '🌑' },
    { id: 'rainbow', name: 'Rainbow Juice', price: 2000000000000, sell: 250000000000, icon: '🌈' },
];

const STAFF = [
    { id: 'cleaner', name: 'Cleanup Pro', price: 89000, desc: 'Auto-cleans spills', icon: '🧹' },
    { id: 'chef', name: 'Prep Cook', price: 120000, desc: 'Auto-serves customers', icon: '👨‍🍳' },
    { id: 'delivery', name: 'Courier Rider', price: 400000, desc: 'Delivers for x3 income', icon: '🛵' }
];

// Formatting
const GIFS = {
    celebrate: { imgId: 'gif-celebrate', labelId: 'gif-celebrate-label', timer: null },
    chaos: { imgId: 'gif-chaos', labelId: 'gif-chaos-label', timer: null }
};

const formatMoney = (n) => {
    if (n < 1000) return Math.floor(n);
    const suffixes = ["", "K", "M", "B", "T", "Qa"];
    const suffixNum = Math.floor(("" + Math.floor(n)).length / 3);
    let shortValue = parseFloat((suffixNum != 0 ? (n / Math.pow(1000, suffixNum)) : n).toPrecision(3));
    if (shortValue % 1 != 0) shortValue = shortValue.toFixed(1);
    return shortValue + suffixes[suffixNum];
};

// Global State
let canvas, ctx, cw, ch;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING
let gameConfig = {};
let audioCtx = null;
let audioReady = false;

// Game Data
let money = 0;
let unlockedFoods = [0]; // indicies of FOODS
let staff = { cleaner: false, chef: false, delivery: false };
let tables = [];
let customers = [];
let dirts = [];
let particles = [];
let floatingTexts = [];
let deliveryTimer = 0;
let chefTimer = 0;

// --- §3 Lifecycle & Core ---

window.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Setup
    setupShop();
    document.getElementById('tab-food').onclick = () => switchTab('food');
    document.getElementById('tab-staff').onclick = () => switchTab('staff');
    
    window.addEventListener('resize', resize);
    resize();
    initGame();
    
    // Start loop
    gameState = 'PLAYING';
    requestAnimationFrame(loop);
    
    // Input
    window.addEventListener('pointerdown', handleInput, { passive: false });
    
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.2;
    ['sfx_collect', 'sfx_unlock', 'sfx_clean', 'sfx_ui'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.volume = id === 'sfx_collect' ? 0.45 : 0.38;
    });
});

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            for (let k in defs) gameConfig[k] = defs[k].value;
        } catch(e) { console.error(e); }
    }
    // Fallbacks
    if (!gameConfig.customerSpeed) gameConfig.customerSpeed = 3;
    if (!gameConfig.vipChance) gameConfig.vipChance = 0.5;
    if (!gameConfig.themeColor) gameConfig.themeColor = '#FF6B6B';
}

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Re-layout tables
    setupTables();
}

function setupTables() {
    tables = [];
    const cols = 2;
    const rows = 3;
    const marginX = cw * 0.15;
    const marginY = ch * 0.15;
    const startY = ch * 0.15;
    
    const cellW = (cw - marginX * 2) / (cols - 1 || 1);
    const cellH = (ch * 0.5 - marginY) / (rows - 1 || 1);
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            tables.push({
                x: marginX + c * cellW,
                y: startY + r * cellH,
                occupied: false,
                id: r * cols + c
            });
        }
    }
}

function initGame() {
    money = 0;
    unlockedFoods = [0];
    staff = { cleaner: false, chef: false, delivery: false };
    customers = [];
    dirts = [];
    particles = [];
    floatingTexts = [];
    updateUI();
}

// --- §4 Game Logic ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            update(dt);
            draw();
        }
    } catch (e) {
        console.error("Loop Error:", e);
    }
    requestAnimationFrame(loop);
}

function update(dt) {
    const cappedDt = Math.min(dt, 0.1);
    
    // Spawn Customers
    if (customers.length < tables.length && Math.random() < 0.02) {
        spawnCustomer();
    }
    
    // Update Customers
    customers.forEach(c => {
        if (c.state === 'ENTERING') {
            const dx = c.targetTable.x - c.x;
            const dy = c.targetTable.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 5) {
                c.x = c.targetTable.x;
                c.y = c.targetTable.y;
                c.state = 'WAITING';
                c.targetTable.occupied = true;
                // Decide order
                const possibleFoods = unlockedFoods.map(i => FOODS[i]);
                c.order = possibleFoods[Math.floor(Math.random() * possibleFoods.length)];
                c.quantity = Math.floor(Math.random() * 3) + 1; // 1-3 items
            } else {
                c.x += (dx / dist) * gameConfig.customerSpeed * 60 * cappedDt;
                c.y += (dy / dist) * gameConfig.customerSpeed * 60 * cappedDt;
            }
        } else if (c.state === 'LEAVING') {
            c.y += gameConfig.customerSpeed * 60 * cappedDt;
            if (c.y > ch + 50) c.dead = true;
        }
    });
    
    // Clean up dead customers
    customers = customers.filter(c => {
        if (c.dead) {
            if (c.targetTable) c.targetTable.occupied = false;
            // Spawn dirt
            if (Math.random() < 0.6) spawnDirt(c.x, c.y);
            return false;
        }
        return true;
    });

    // Auto Chef
    if (staff.chef) {
        chefTimer += cappedDt;
        if (chefTimer > 1.0) { // Chef serves one customer per second
            chefTimer = 0;
            const waiting = customers.find(c => c.state === 'WAITING');
            if (waiting) serveCustomer(waiting);
        }
    }

    // Auto Cleaner
    if (staff.cleaner) {
        if (dirts.length > 0 && Math.random() < 0.05) {
            cleanDirt(dirts[0]);
        }
    }

    // Delivery Man Passive Income
    if (staff.delivery) {
        deliveryTimer += cappedDt;
        if (deliveryTimer > 3.0) {
            deliveryTimer = 0;
            // Best food x3
            const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
            const income = bestFood.sell * 3;
            addMoney(income);
            spawnFloatingText(cw/2, 50, `+${formatMoney(income)} (Delivery!)`, '#4ECDC4');
            playSound('collect');
            showGifFeedback('celebrate', 900);
        }
    }

    // Particles
    particles.forEach(p => {
        p.x += p.vx * cappedDt * 60;
        p.y += p.vy * cappedDt * 60;
        p.life -= cappedDt;
        p.vy += 0.5; // gravity
    });
    particles = particles.filter(p => p.life > 0);

    // Floating Text
    floatingTexts.forEach(t => {
        t.y -= 30 * cappedDt;
        t.life -= cappedDt;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);
}

function spawnCustomer() {
    // Find empty table
    const emptyTables = tables.filter(t => !t.occupied && !customers.some(c => c.targetTable === t));
    if (emptyTables.length === 0) return;
    
    const table = emptyTables[Math.floor(Math.random() * emptyTables.length)];
    const isVip = Math.random() < gameConfig.vipChance;
    
    customers.push({
        x: cw / 2,
        y: ch + 50,
        targetTable: table,
        state: 'ENTERING',
        isVip: isVip,
        color: `hsl(${Math.random()*360}, 70%, 60%)`,
        dead: false
    });
}

function spawnDirt(x, y) {
    dirts.push({ x: x + (Math.random()-0.5)*20, y: y + (Math.random()-0.5)*20, r: 15 });
}

function serveCustomer(c) {
    if (c.state !== 'WAITING') return;
    
    const baseValue = c.order.sell * c.quantity;
    const multiplier = c.isVip ? 3 : 1;
    const total = baseValue * multiplier;
    
    addMoney(total);
    spawnFloatingText(c.x, c.y - 30, `+${formatMoney(total)}`, c.isVip ? '#FFD700' : '#FFF');
    playSound('collect');
    if (c.isVip || total >= 1000) showGifFeedback('celebrate', 1100);
    
    // Juice
    for(let i=0; i<8; i++) spawnParticle(c.x, c.y, c.isVip ? '#FFD700' : '#88CC88');
    vibrate(c.isVip ? 'medium' : 'light');
    
    c.state = 'LEAVING';
    c.targetTable.occupied = false;
    c.targetTable = null; // Detach from table immediately so new customer can come
}

function cleanDirt(d) {
    const idx = dirts.indexOf(d);
    if (idx > -1) {
        dirts.splice(idx, 1);
        spawnFloatingText(d.x, d.y, "Clean!", "#4ECDC4");
        playSound('clean');
        for(let i=0; i<5; i++) spawnParticle(d.x, d.y, '#AAEEFF');
    }
}

function addMoney(amt) {
    money += amt;
    updateUI();
}

function spawnParticle(x, y, color) {
    particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10 - 5,
        color,
        life: 1.0,
        size: Math.random() * 4 + 2
    });
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1.0 });
}

// --- §5 Input & UI ---

function handleInput(e) {
    // L2 Audio Unlock
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    initAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Check Dirt
    let clickedDirt = false;
    for (let d of dirts) {
        const dx = x - d.x;
        const dy = y - d.y;
        if (dx*dx + dy*dy < d.r*d.r * 2) { // Generous hit area
            cleanDirt(d);
            clickedDirt = true;
            break;
        }
    }
    if (clickedDirt) return;

    // Check Customers
    for (let c of customers) {
        if (c.state === 'WAITING') {
            const dx = x - c.x;
            const dy = y - c.y;
            if (dx*dx + dy*dy < 1600) { // 40px radius
                serveCustomer(c);
                return;
            }
        }
    }
}

function setupShop() {
    const foodList = document.getElementById('list-food');
    foodList.innerHTML = '';
    FOODS.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'shop-card flex justify-between items-center p-3 rounded-xl btn-push';
        div.id = `food-btn-${i}`;
        div.innerHTML = `
            <div class="flex items-center gap-3 ui-font">
                <div class="shop-card-icon text-2xl bg-orange-100 w-10 h-10 flex items-center justify-center rounded-full">${f.icon}</div>
                <div>
                    <div class="font-bold text-stone-800 text-sm leading-tight">${f.name}</div>
                    <div class="text-xs text-orange-700/80">Serve: $${formatMoney(f.sell)}</div>
                </div>
            </div>
            <button class="buy-btn-food text-white px-3 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:bg-gray-400" onclick="buyFood(${i})">
                $${formatMoney(f.price)}
            </button>
        `;
        foodList.appendChild(div);
    });

    const staffList = document.getElementById('list-staff');
    staffList.innerHTML = '';
    STAFF.forEach((s) => {
        const div = document.createElement('div');
        div.className = 'shop-card flex justify-between items-center p-3 rounded-xl btn-push';
        div.id = `staff-btn-${s.id}`;
        div.innerHTML = `
            <div class="flex items-center gap-3 ui-font">
                <div class="shop-card-icon text-2xl bg-cyan-100 w-10 h-10 flex items-center justify-center rounded-full">${s.icon}</div>
                <div>
                    <div class="font-bold text-stone-800 text-sm leading-tight">${s.name}</div>
                    <div class="text-xs text-cyan-900/70">${s.desc}</div>
                </div>
            </div>
            <button class="buy-btn-staff text-white px-3 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:bg-gray-400" onclick="buyStaff('${s.id}')">
                $${formatMoney(s.price)}
            </button>
        `;
        staffList.appendChild(div);
    });
}

window.buyFood = (idx) => {
    const f = FOODS[idx];
    if (money >= f.price && !unlockedFoods.includes(idx)) {
        money -= f.price;
        unlockedFoods.push(idx);
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${f.name} Unlocked!`, '#FF6B6B');
        // Confetti
        for(let k=0; k<20; k++) spawnParticle(cw/2, ch/2, `hsl(${Math.random()*360}, 100%, 50%)`);
        updateUI();
    }
};

window.buyStaff = (id) => {
    const s = STAFF.find(x => x.id === id);
    if (money >= s.price && !staff[id]) {
        money -= s.price;
        staff[id] = true;
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${s.name} Hired!`, '#4ECDC4');
        updateUI();
    }
}

function switchTab(tab) {
    playSound('ui');
    const foodTab = document.getElementById('tab-food');
    const staffTab = document.getElementById('tab-staff');
    const foodList = document.getElementById('list-food');
    const staffList = document.getElementById('list-staff');

    if (tab === 'food') {
        foodTab.classList.add('is-active');
        staffTab.classList.remove('is-active');
        foodList.classList.remove('hidden');
        staffList.classList.add('hidden');
    } else {
        staffTab.classList.add('is-active');
        foodTab.classList.remove('is-active');
        staffList.classList.remove('hidden');
        foodList.classList.add('hidden');
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = formatMoney(money);
    
    // Update Shop Buttons
    FOODS.forEach((f, i) => {
        const btn = document.querySelector(`#food-btn-${i} button`);
        if (unlockedFoods.includes(i)) {
            btn.innerText = "Owned";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < f.price;
            if (unlockedFoods.includes(i-1)) { // Only show next available
                 document.getElementById(`food-btn-${i}`)?.classList.remove('hidden');
            }
        }
    });

    STAFF.forEach(s => {
        const btn = document.querySelector(`#staff-btn-${s.id} button`);
        if (staff[s.id]) {
            btn.innerText = "Hired";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < s.price;
        }
    });

    if (staff.delivery) {
        document.getElementById('dps-display').classList.remove('hidden');
        const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
        document.getElementById('dps-display').innerText = `🛵 Courier: $${formatMoney(bestFood.sell * 3)}/3s`;
    }
}

// --- §6 Drawing ---

function draw() {
    // Neon food-truck floor
    const tileSize = 40;
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#3b0f1f');
    bgGradient.addColorStop(0.55, '#250b18');
    bgGradient.addColorStop(1, '#120816');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);
    for (let x = 0; x < cw; x += tileSize) {
        for (let y = 0; y < ch; y += tileSize) {
            ctx.fillStyle = ((x/tileSize + y/tileSize) % 2 === 0) ? 'rgba(255,149,95,0.07)' : 'rgba(255,255,255,0.025)';
            ctx.fillRect(x, y, tileSize, tileSize);
        }
    }
    ctx.strokeStyle = 'rgba(255, 207, 122, 0.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x < cw; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
        ctx.stroke();
    }
    for (let y = 0; y < ch; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }

    // Tables
    ctx.fillStyle = '#a44c38';
    tables.forEach(t => {
        ctx.shadowColor = 'rgba(255, 174, 92, 0.28)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 221, 160, 0.55)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#6d2e22';
        ctx.beginPath(); ctx.arc(t.x - 20, t.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(t.x + 20, t.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(t.x, t.y - 20, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#a44c38';
    });

    // Dirt
    dirts.forEach(d => {
        ctx.fillStyle = '#4d241d';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2f120f';
        ctx.beginPath();
        ctx.arc(d.x + 5, d.y - 5, d.r/2, 0, Math.PI * 2);
        ctx.fill();
    });

    // Customers
    customers.forEach(c => {
        // Body
        const bodyGradient = ctx.createRadialGradient(c.x - 6, c.y - 8, 4, c.x, c.y, 24);
        bodyGradient.addColorStop(0, '#fff5cf');
        bodyGradient.addColorStop(0.22, c.isVip ? '#ffe39b' : '#ffd9b3');
        bodyGradient.addColorStop(0.23, c.color);
        bodyGradient.addColorStop(1, '#4b1730');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 19, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = c.isVip ? '#ffd166' : 'rgba(255, 236, 200, 0.45)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff5ea';
        ctx.beginPath();
        ctx.arc(c.x, c.y - 4, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.x - 11, c.y - 4, 5, 0, Math.PI * 2);
        ctx.arc(c.x + 11, c.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();

        // VIP Crown
        if (c.isVip) {
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.moveTo(c.x - 10, c.y - 15);
            ctx.lineTo(c.x - 5, c.y - 25);
            ctx.lineTo(c.x, c.y - 15);
            ctx.lineTo(c.x + 5, c.y - 25);
            ctx.lineTo(c.x + 10, c.y - 15);
            ctx.fill();
        }

        // Eyes
        ctx.fillStyle = '#2e1121';
        ctx.beginPath();
        ctx.arc(c.x - 5, c.y - 3, 1.8, 0, Math.PI*2);
        ctx.arc(c.x + 5, c.y - 3, 1.8, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#c45749';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(c.x, c.y + 3, 4, 0.15, Math.PI - 0.15);
        ctx.stroke();

        // Order Bubble
        if (c.state === 'WAITING') {
            ctx.fillStyle = 'rgba(255, 248, 233, 0.96)';
            ctx.beginPath();
            ctx.roundRect(c.x + 10, c.y - 40, 40, 30, 5);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 157, 104, 0.72)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.font = '600 18px "Rajdhani"';
            ctx.fillStyle = '#2c1220';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(c.order.icon, c.x + 30, c.y - 25);
            
            // Quantity
            if (c.quantity > 1) {
                ctx.font = 'bold 12px "Bangers"';
                ctx.fillStyle = '#cf4b2f';
                ctx.fillText(`x${c.quantity}`, c.x + 45, c.y - 35);
            }
        }
    });

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // Floating Text
    ctx.font = 'bold 24px "Bangers"';
    ctx.textAlign = 'center';
    floatingTexts.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; // Shadow
        ctx.fillText(t.text, t.x + 2, t.y + 2);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    });
}

// --- §7 Utils ---

function initAudio() {
    if (audioReady) return;
    audioReady = true;
    const bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
}

function showGifFeedback(type, duration = 1000) {
    const config = GIFS[type];
    if (!config) return;
    const img = document.getElementById(config.imgId);
    const label = document.getElementById(config.labelId);
    if (!img || !label) return;
    img.classList.add('is-visible');
    label.classList.add('is-visible');
    clearTimeout(config.timer);
    config.timer = setTimeout(() => {
        img.classList.remove('is-visible');
        label.classList.remove('is-visible');
    }, duration);
}

function playSound(type) {
    if (!audioCtx) return;
    const idMap = {
        collect: 'sfx_collect',
        unlock: 'sfx_unlock',
        clean: 'sfx_clean',
        ui: 'sfx_ui'
    };
    const el = document.getElementById(idMap[type] || 'sfx_ui');
    if (el) {
        el.currentTime = 0;
        el.play().catch(() => playSynth(type));
    } else {
        playSynth(type);
    }
}

function playSynth(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(780, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'clean') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.16);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
    } else if (type === 'ui') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(760, audioCtx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.24);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    }
}

function vibrate(style) {
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 50 : 10);
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
        params: { style }
    });
}
