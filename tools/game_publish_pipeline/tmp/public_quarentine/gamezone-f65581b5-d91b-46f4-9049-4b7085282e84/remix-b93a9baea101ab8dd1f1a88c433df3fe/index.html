<script>
// --- §2 System Invariants & Constants ---
const FOODS = [
    { id: 'fries', name: 'Heart Fries', price: 0, sell: 2, icon: '🍟' },
    { id: 'mozz', name: 'Bouquet Sticks', price: 45, sell: 7, icon: '💐' },
    { id: 'soda', name: 'Sparkle Soda', price: 200, sell: 25, icon: '🥤' },
    { id: 'burger', name: 'Mom Burger', price: 1300, sell: 150, icon: '🍔' },
    { id: 'shawarma', name: 'Gift-Wrap Shawarma', price: 20000, sell: 2200, icon: '🎁' },
    { id: 'loaded', name: 'Loaded Love Fries', price: 170000, sell: 18000, icon: '🥘' },
    { id: 'zinger', name: 'Zinger Bouquet', price: 530000, sell: 55000, icon: '🍗' },
    { id: 'fish', name: 'Flower Fish', price: 1000000, sell: 110000, icon: '🐟' },
    { id: 'sushi', name: 'Sushi Love Card', price: 4200000, sell: 450000, icon: '💌' },
    { id: 'crab', name: 'Crab Crown', price: 9200000, sell: 1000000, icon: '🦀' },
    { id: 'lobster', name: 'Lobster Bouquet', price: 20000000, sell: 2200000, icon: '🦞' },
    { id: 'pizza', name: 'Heart Pizza', price: 55000000, sell: 6000000, icon: '🍕' },
    { id: 'dblzinger', name: 'Double Zinger Hug', price: 102000000, sell: 11000000, icon: '🍖' },
    { id: 'black', name: 'Midnight Meme Burger', price: 230000000, sell: 25000000, icon: '🍘' },
    { id: 'gold', name: 'Golden Mom Burger', price: 400000000, sell: 45000000, icon: '🥯' },
    { id: 'xxl', name: 'XXL Family Pizza', price: 1000000000, sell: 120000000, icon: '🥡' },
    { id: 'dark', name: 'Dark Meme Pizza', price: 99000000000, sell: 11000000000, icon: '🌑' },
    { id: 'rainbow', name: 'Rainbow Love Juice', price: 2000000000000, sell: 250000000000, icon: '🌈' },
];

const STAFF = [
    { id: 'cleaner', name: 'Glitter Cleanup Auntie', price: 89000, desc: 'Auto-cleans glitter chaos', icon: '🧹' },
    { id: 'chef', name: 'Prep Mom', price: 120000, desc: 'Auto-serves brunch guests', icon: '👩‍🍳' },
    { id: 'delivery', name: 'Gift Courier', price: 400000, desc: 'Gift-dashes for x3 income', icon: '🎁' }
];

// Formatting
const GIFS = {
    celebrate: { imgId: 'gif-celebrate', labelId: 'gif-celebrate-label', timer: null },
    chaos: { imgId: 'gif-chaos', labelId: 'gif-chaos-label', timer: null }
};

const formatMoney = (n) => {
    if (n < 1000) return Math.floor(n);
    const suffixes = ["", "K", "M", "B", "T", "Qa"];
    const suffixNum = Math.floor(("" + Math.floor(n)).length / 3);
    let shortValue = parseFloat((suffixNum != 0 ? (n / Math.pow(1000, suffixNum)) : n).toPrecision(3));
    if (shortValue % 1 != 0) shortValue = shortValue.toFixed(1);
    return shortValue + suffixes[suffixNum];
};

// Global State
let canvas, ctx, cw, ch;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING
let gameConfig = {};
let audioCtx = null;
let audioReady = false;

// Game Data
let money = 0;
let unlockedFoods = [0]; // indicies of FOODS
let staff = { cleaner: false, chef: false, delivery: false };
let tables = [];
let customers = [];
let dirts = [];
let particles = [];
let floatingTexts = [];
let deliveryTimer = 0;
let chefTimer = 0;

// --- §3 Lifecycle & Core ---

window.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Setup
    setupShop();
    document.getElementById('tab-food').onclick = () => switchTab('food');
    document.getElementById('tab-staff').onclick = () => switchTab('staff');
    
    window.addEventListener('resize', resize);
    resize();
    initGame();
    
    // Start loop
    gameState = 'PLAYING';
    requestAnimationFrame(loop);
    
    // Input
    window.addEventListener('pointerdown', handleInput, { passive: false });
    
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.2;
    ['sfx_collect', 'sfx_unlock', 'sfx_clean', 'sfx_ui'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.volume = id === 'sfx_collect' ? 0.45 : 0.38;
    });
});

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            for (let k in defs) gameConfig[k] = defs[k].value;
        } catch(e) { console.error(e); }
    }
    // Fallbacks
    if (!gameConfig.customerSpeed) gameConfig.customerSpeed = 3;
    if (!gameConfig.vipChance) gameConfig.vipChance = 0.5;
    if (!gameConfig.themeColor) gameConfig.themeColor = '#FF6B6B';
}

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Re-layout tables
    setupTables();
}

function setupTables() {
    tables = [];
    const cols = 2;
    const rows = 3;
    const marginX = cw * 0.15;
    const marginY = ch * 0.15;
    const startY = ch * 0.15;
    
    const cellW = (cw - marginX * 2) / (cols - 1 || 1);
    const cellH = (ch * 0.5 - marginY) / (rows - 1 || 1);
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            tables.push({
                x: marginX + c * cellW,
                y: startY + r * cellH,
                occupied: false,
                id: r * cols + c
            });
        }
    }
}

function initGame() {
    money = 0;
    unlockedFoods = [0];
    staff = { cleaner: false, chef: false, delivery: false };
    customers = [];
    dirts = [];
    particles = [];
    floatingTexts = [];
    updateUI();
}

// --- §4 Game Logic ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            update(dt);
            draw();
        }
    } catch (e) {
        console.error("Loop Error:", e);
    }
    requestAnimationFrame(loop);
}

function update(dt) {
    const cappedDt = Math.min(dt, 0.1);
    
    // Spawn Customers
    if (customers.length < tables.length && Math.random() < 0.02) {
        spawnCustomer();
    }
    
    // Update Customers
    customers.forEach(c => {
        if (c.state === 'ENTERING') {
            const dx = c.targetTable.x - c.x;
            const dy = c.targetTable.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 5) {
                c.x = c.targetTable.x;
                c.y = c.targetTable.y;
                c.state = 'WAITING';
                c.targetTable.occupied = true;
                // Decide order
                const possibleFoods = unlockedFoods.map(i => FOODS[i]);
                c.order = possibleFoods[Math.floor(Math.random() * possibleFoods.length)];
                c.quantity = Math.floor(Math.random() * 3) + 1; // 1-3 items
            } else {
                c.x += (dx / dist) * gameConfig.customerSpeed * 60 * cappedDt;
                c.y += (dy / dist) * gameConfig.customerSpeed * 60 * cappedDt;
            }
        } else if (c.state === 'LEAVING') {
            c.y += gameConfig.customerSpeed * 60 * cappedDt;
            if (c.y > ch + 50) c.dead = true;
        }
    });
    
    // Clean up dead customers
    customers = customers.filter(c => {
        if (c.dead) {
            if (c.targetTable) c.targetTable.occupied = false;
            // Spawn dirt
            if (Math.random() < 0.6) spawnDirt(c.x, c.y);
            return false;
        }
        return true;
    });

    // Auto Chef
    if (staff.chef) {
        chefTimer += cappedDt;
        if (chefTimer > 1.0) { // Chef serves one customer per second
            chefTimer = 0;
            const waiting = customers.find(c => c.state === 'WAITING');
            if (waiting) serveCustomer(waiting);
        }
    }

    // Auto Cleaner
    if (staff.cleaner) {
        if (dirts.length > 0 && Math.random() < 0.05) {
            cleanDirt(dirts[0]);
        }
    }

    // Delivery Man Passive Income
    if (staff.delivery) {
        deliveryTimer += cappedDt;
        if (deliveryTimer > 3.0) {
            deliveryTimer = 0;
            // Best food x3
            const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
            const income = bestFood.sell * 3;
            addMoney(income);
            spawnFloatingText(cw/2, 50, `+${formatMoney(income)} (Gift Dash!)`, '#4ECDC4');
            playSound('collect');
            showGifFeedback('celebrate', 900);
        }
    }

    // Particles
    particles.forEach(p => {
        p.x += p.vx * cappedDt * 60;
        p.y += p.vy * cappedDt * 60;
        p.life -= cappedDt;
        p.vy += 0.5; // gravity
    });
    particles = particles.filter(p => p.life > 0);

    // Floating Text
    floatingTexts.forEach(t => {
        t.y -= 30 * cappedDt;
        t.life -= cappedDt;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);
}

function spawnCustomer() {
    // Find empty table
    const emptyTables = tables.filter(t => !t.occupied && !customers.some(c => c.targetTable === t));
    if (emptyTables.length === 0) return;
    
    const table = emptyTables[Math.floor(Math.random() * emptyTables.length)];
    const isVip = Math.random() < gameConfig.vipChance;
    
    customers.push({
        x: cw / 2,
        y: ch + 50,
        targetTable: table,
        state: 'ENTERING',
        isVip: isVip,
        color: `hsl(${Math.random()*360}, 70%, 60%)`,
        dead: false
    });
}

function spawnDirt(x, y) {
    dirts.push({ x: x + (Math.random()-0.5)*20, y: y + (Math.random()-0.5)*20, r: 15 });
}

function serveCustomer(c) {
    if (c.state !== 'WAITING') return;
    
    const baseValue = c.order.sell * c.quantity;
    const multiplier = c.isVip ? 3 : 1;
    const total = baseValue * multiplier;
    
    addMoney(total);
    spawnFloatingText(c.x, c.y - 30, `+${formatMoney(total)}`, c.isVip ? '#FFD700' : '#FFF');
    playSound('collect');
    if (c.isVip || total >= 1000) showGifFeedback('celebrate', 1100);
    
    // Juice
    for(let i=0; i<8; i++) spawnParticle(c.x, c.y, c.isVip ? '#FFD700' : '#88CC88');
    vibrate(c.isVip ? 'medium' : 'light');
    
    c.state = 'LEAVING';
    c.targetTable.occupied = false;
    c.targetTable = null; // Detach from table immediately so new customer can come
}

function cleanDirt(d) {
    const idx = dirts.indexOf(d);
    if (idx > -1) {
        dirts.splice(idx, 1);
        spawnFloatingText(d.x, d.y, "Sparkle Clean!", "#4ECDC4");
        playSound('clean');
        for(let i=0; i<5; i++) spawnParticle(d.x, d.y, '#AAEEFF');
    }
}

function addMoney(amt) {
    money += amt;
    updateUI();
}

function spawnParticle(x, y, color) {
    particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10 - 5,
        color,
        life: 1.0,
        size: Math.random() * 4 + 2
    });
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1.0 });
}

// --- §5 Input & UI ---

function handleInput(e) {
    // L2 Audio Unlock
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    initAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Check Dirt
    let clickedDirt = false;
    for (let d of dirts) {
        const dx = x - d.x;
        const dy = y - d.y;
        if (dx*dx + dy*dy < d.r*d.r * 2) { // Generous hit area
            cleanDirt(d);
            clickedDirt = true;
            break;
        }
    }
    if (clickedDirt) return;

    // Check Customers
    for (let c of customers) {
        if (c.state === 'WAITING') {
            const dx = x - c.x;
            const dy = y - c.y;
            if (dx*dx + dy*dy < 1600) { // 40px radius
                serveCustomer(c);
                return;
            }
        }
    }
}

                    <div class="font-bold text-stone-800 text-sm leading-tight">${f.name}</div>
                    <div class="text-xs text-orange-700/80">Serve: $${formatMoney(f.sell)}</div>
                </div>
            </div>
            <button class="buy-btn-food text-white px-3 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:bg-gray-400" onclick="buyFood(${i})">
                $${formatMoney(f.price)}

        div.innerHTML = `
            <div class="flex items-center gap-3 ui-font">
                <div class="shop-card-icon text-2xl bg-cyan-100 w-10 h-10 flex items-center justify-center rounded-full">${s.icon}</div>

            </button>
        `;

window.buyFood = (idx) => {
    const f = FOODS[idx];
    if (money >= f.price && !unlockedFoods.includes(idx)) {
        money -= f.price;
        unlockedFoods.push(idx);
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${f.name} Unlocked!`, '#FF6B6B');
        // Confetti
        for(let k=0; k<20; k++) spawnParticle(cw/2, ch/2, `hsl(${Math.random()*360}, 100%, 50%)`);
        updateUI();
    }
};

window.buyStaff = (id) => {
    const s = STAFF.find(x => x.id === id);
    if (money >= s.price && !staff[id]) {
        money -= s.price;
        staff[id] = true;
        playSound('unlock');
        showGifFeedback('celebrate', 1300);
        vibrate('heavy');
        spawnFloatingText(cw/2, ch/2, `${s.name} Hired!`, '#4ECDC4');
        updateUI();
    }
}

function switchTab(tab) {
    playSound('ui');
    const foodTab = document.getElementById('tab-food');
    const staffTab = document.getElementById('tab-staff');
    const foodList = document.getElementById('list-food');
    const staffList = document.getElementById('list-staff');

    if (tab === 'food') {
        foodTab.classList.add('is-active');
        staffTab.classList.remove('is-active');
        foodList.classList.remove('hidden');
        staffList.classList.add('hidden');
    } else {
        staffTab.classList.add('is-active');
        foodTab.classList.remove('is-active');
        staffList.classList.remove('hidden');
        foodList.classList.add('hidden');
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = formatMoney(money);
    
    // Update Shop Buttons
    FOODS.forEach((f, i) => {
        const btn = document.querySelector(`#food-btn-${i} button`);
        if (unlockedFoods.includes(i)) {
            btn.innerText = "Owned";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < f.price;
            if (unlockedFoods.includes(i-1)) { // Only show next available
                 document.getElementById(`food-btn-${i}`)?.classList.remove('hidden');
            }
        }
    });

    STAFF.forEach(s => {
        const btn = document.querySelector(`#staff-btn-${s.id} button`);
        if (staff[s.id]) {
            btn.innerText = "Hired";
            btn.disabled = true;
            btn.classList.add('bg-gray-400');
        } else {
            btn.disabled = money < s.price;
        }
    });

    if (staff.delivery) {
        document.getElementById('dps-display').classList.remove('hidden');
        const bestFood = FOODS[unlockedFoods[unlockedFoods.length-1]];
        document.getElementById('dps-display').innerText = `🎁 Gift Dash: $${formatMoney(bestFood.sell * 3)}/3s`;
    }
}

// --- §6 Drawing ---

function getVisualPhase() {
    const staffCount = Object.values(staff).filter(Boolean).length;
    return Math.min(5, Math.max(1, 1 + Math.floor((unlockedFoods.length - 1) / 4) + (staffCount > 0 ? 1 : 0)));
}

function drawHeart(x, y, size, color, alpha = 1, rotation = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(size / 18, size / 18);
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 7);
    ctx.bezierCurveTo(-13, -3, -8, -14, 0, -7);
    ctx.bezierCurveTo(8, -14, 13, -3, 0, 7);
    ctx.fill();
    ctx.restore();
}

function drawPetal(x, y, size, color, alpha = 1, rotation = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.35, size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawGiftCube(x, y, s, hueShift = 0, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    const pink = hueShift ? '#73f6d1' : '#ff6fb1';
    const gold = '#ffd166';
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.72, s * 0.68, s * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = pink;
    ctx.fillRect(-s * 0.5, -s * 0.35, s, s * 0.8);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(-s * 0.5, -s * 0.35, s, s * 0.18);
    ctx.fillStyle = gold;
    ctx.fillRect(-s * 0.08, -s * 0.35, s * 0.16, s * 0.8);
    ctx.fillRect(-s * 0.5, -s * 0.02, s, s * 0.14);
    ctx.strokeStyle = 'rgba(255,244,223,0.45)';
    ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.strokeRect(-s * 0.5, -s * 0.35, s, s * 0.8);
    ctx.restore();
}

function drawCrown(x, y, w, h, color = '#ffd166') {
    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = 'rgba(109,24,53,0.42)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y + h / 2);
    ctx.lineTo(x - w * 0.34, y - h * 0.08);
    ctx.lineTo(x - w * 0.14, y + h * 0.18);
    ctx.lineTo(x, y - h / 2);
    ctx.lineTo(x + w * 0.14, y + h * 0.18);
    ctx.lineTo(x + w * 0.34, y - h * 0.08);
    ctx.lineTo(x + w / 2, y + h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function drawBackground(time, phase) {
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, phase >= 5 ? '#37135a' : '#3b0f1f');
    bgGradient.addColorStop(0.45, phase >= 3 ? '#7b2258' : '#4b1230');
    bgGradient.addColorStop(1, '#120816');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    const spotlight = ctx.createRadialGradient(cw * 0.5, ch * 0.16, 10, cw * 0.5, ch * 0.16, Math.max(cw, ch) * 0.55);
    spotlight.addColorStop(0, 'rgba(255, 209, 102, 0.22)');
    spotlight.addColorStop(0.42, 'rgba(255, 111, 177, 0.08)');
    spotlight.addColorStop(1, 'rgba(18, 8, 22, 0)');
    ctx.fillStyle = spotlight;
    ctx.fillRect(0, 0, cw, ch);

    // Flower-wall / royal brunch backdrop motifs.
    for (let i = 0; i < 12; i++) {
        const x = ((i * 97 + time * 8) % (cw + 90)) - 45;
        const y = 34 + (i % 4) * 34 + Math.sin(time * 0.7 + i) * 4;
        drawHeart(x, y, 12 + (i % 3) * 3, i % 2 ? '#ff6fb1' : '#ffd166', 0.14, Math.sin(time + i) * 0.25);
    }
    if (phase >= 2) {
        for (let i = 0; i < 9; i++) {
            const x = (i * 83 + Math.sin(time * 0.35 + i) * 18) % (cw + 40) - 20;
            const y = 92 + (i % 3) * 42;
            drawPetal(x, y, 10, i % 2 ? '#ff9bc9' : '#fff4df', 0.12, time * 0.4 + i);
        }
    }
    if (phase >= 3) {
        for (let i = 0; i < 5; i++) {
            const x = 30 + i * (cw / 4) + Math.sin(time * 0.5 + i) * 8;
            const y = ch * 0.32 + Math.cos(time * 0.55 + i) * 8;
            drawGiftCube(x, y, 20 + (i % 2) * 8, i % 2, 0.22);
        }
    }
    if (phase >= 4) {
        for (let i = 0; i < 4; i++) {
            const x = cw * (0.18 + i * 0.22);
            const y = 22 + Math.sin(time + i) * 2;
            ctx.strokeStyle = 'rgba(255, 209, 102, 0.12)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, y + 20);
            ctx.stroke();
            drawCrown(x, y + 32, 28, 18, 'rgba(255, 209, 102, 0.22)');
        }
    }

    // Pseudo-3D isometric floor: visual only; table/entity coordinates stay unchanged.
    const horizon = ch * 0.18;
    const floorTop = ch * 0.28;
    const tileH = 34;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, floorTop, cw, ch - floorTop);
    ctx.clip();

    const floorGradient = ctx.createLinearGradient(0, floorTop, 0, ch);
    floorGradient.addColorStop(0, 'rgba(255,111,177,0.08)');
    floorGradient.addColorStop(1, 'rgba(255,209,102,0.13)');
    ctx.fillStyle = floorGradient;
    ctx.fillRect(0, floorTop, cw, ch - floorTop);

    ctx.strokeStyle = 'rgba(255, 209, 102, 0.11)';
    ctx.lineWidth = 1;
    for (let y = floorTop; y < ch; y += tileH) {
        const depth = (y - floorTop) / (ch - floorTop);
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(time * 0.5 + depth * 4) * 1.5);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }
    for (let x = -cw; x < cw * 2; x += 52) {
        ctx.beginPath();
        ctx.moveTo(x + Math.sin(time * 0.4) * 6, floorTop);
        ctx.lineTo(x + cw * 0.45, ch);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cw - x + Math.cos(time * 0.4) * 6, floorTop);
        ctx.lineTo(cw - x - cw * 0.45, ch);
        ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(115, 246, 209, 0.15)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, horizon + Math.sin(time) * 4);
    ctx.bezierCurveTo(cw * 0.28, horizon - 18, cw * 0.74, horizon + 22, cw, horizon + 2);
    ctx.stroke();
}

function draw() {
    const time = performance.now() * 0.001;
    const phase = getVisualPhase();
    drawBackground(time, phase);

    // Tables: apron-card brunch targets, same positions and sizes as the original targets.
    tables.forEach((t, i) => {
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        ctx.beginPath();
        ctx.ellipse(0, 24, 36, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        const tableGradient = ctx.createRadialGradient(-10, -12, 4, 0, 0, 31);
        tableGradient.addColorStop(0, '#fff4df');
        tableGradient.addColorStop(0.28, '#ffcf9e');
        tableGradient.addColorStop(1, '#a44c38');
        ctx.fillStyle = tableGradient;
        ctx.shadowColor = 'rgba(255, 174, 92, 0.28)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 221, 160, 0.78)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = 'rgba(109, 24, 53, 0.74)';
        ctx.beginPath();
        ctx.arc(-20, 0, 8, 0, Math.PI*2);
        ctx.arc(20, 0, 8, 0, Math.PI*2);
        ctx.arc(0, -20, 8, 0, Math.PI*2);
        ctx.fill();

        drawHeart(0, 2, 12, '#ff6fb1', 0.85, 0);
        if (phase >= 2 && i % 2 === 0) drawPetal(15, 10, 8, '#fff4df', 0.72, 0.7);
        ctx.restore();
    });

    // Dirt: glitter/crumb/sauce puddles, same radius object and generous cleanup hit area.
    dirts.forEach((d, i) => {
        ctx.save();
        const puddleGradient = ctx.createRadialGradient(d.x - 3, d.y - 4, 2, d.x, d.y, d.r + 8);
        puddleGradient.addColorStop(0, '#aaeaff');
        puddleGradient.addColorStop(0.34, '#7b2258');
        puddleGradient.addColorStop(1, '#2f120f');
        ctx.fillStyle = puddleGradient;
        ctx.beginPath();
        ctx.ellipse(d.x, d.y, d.r * 1.08, d.r * 0.76, Math.sin(i) * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(115,246,209,0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        for (let s = 0; s < 4; s++) {
            ctx.fillStyle = s % 2 ? '#ffd166' : '#aaeaff';
            ctx.globalAlpha = 0.78;
            ctx.fillRect(d.x - 8 + s * 5, d.y - 7 + Math.sin(time + s + i) * 3, 3, 3);
        }
        ctx.restore();
    });

    // Customers: round meme-family guests and Queen Mom VIPs; centers/hit behavior unchanged.
    customers.forEach(c => {
        ctx.save();
        const bob = c.state === 'WAITING' ? Math.sin(time * 3 + c.x) * 1.2 : 0;

        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y + 21, 21, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        const bodyGradient = ctx.createRadialGradient(c.x - 7, c.y - 10 + bob, 4, c.x, c.y + bob, 25);
        bodyGradient.addColorStop(0, '#fff5cf');
        bodyGradient.addColorStop(0.2, c.isVip ? '#ffe39b' : '#ffd9b3');
        bodyGradient.addColorStop(0.36, c.color);
        bodyGradient.addColorStop(1, c.isVip ? '#7b2258' : '#4b1730');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(c.x, c.y + bob, 19, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = c.isVip ? '#ffd166' : 'rgba(255, 236, 200, 0.58)';
        ctx.lineWidth = c.isVip ? 3 : 2;
        ctx.stroke();

        if (c.isVip) {
            ctx.strokeStyle = 'rgba(255, 209, 102, 0.24)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(c.x, c.y + bob, 25 + Math.sin(time * 2) * 1.5, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.fillStyle = '#fff5ea';
        ctx.beginPath();
        ctx.arc(c.x, c.y - 4 + bob, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = c.color;
        ctx.globalAlpha = 0.82;
        ctx.beginPath();
        ctx.arc(c.x - 11, c.y - 4 + bob, 5, 0, Math.PI * 2);
        ctx.arc(c.x + 11, c.y - 4 + bob, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (c.isVip) {
            drawCrown(c.x, c.y - 22 + bob, 24, 16, '#ffd166');
            drawPetal(c.x - 12, c.y - 17 + bob, 7, '#ff9bc9', 0.9, -0.7);
            drawPetal(c.x + 12, c.y - 17 + bob, 7, '#ff9bc9', 0.9, 0.7);
        }

        // Meme-dot eyes and warm smile.
        ctx.fillStyle = '#2e1121';
        ctx.beginPath();
        ctx.arc(c.x - 5, c.y - 3 + bob, 1.9, 0, Math.PI*2);
        ctx.arc(c.x + 5, c.y - 3 + bob, 1.9, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#c45749';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(c.x, c.y + 3 + bob, 4, 0.15, Math.PI - 0.15);
        ctx.stroke();
        drawHeart(c.x - 10, c.y + 6 + bob, 4, '#ff6fb1', 0.72, -0.2);
        drawHeart(c.x + 10, c.y + 6 + bob, 4, '#ff6fb1', 0.72, 0.2);

        // Greeting-card order bubble.
        if (c.state === 'WAITING') {
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.beginPath();
            ctx.roundRect(c.x + 12, c.y - 38, 42, 31, 8);
            ctx.fill();

            const cardGradient = ctx.createLinearGradient(c.x + 10, c.y - 40, c.x + 50, c.y - 10);
            cardGradient.addColorStop(0, '#fff8ed');
            cardGradient.addColorStop(1, '#ffe5ca');
            ctx.fillStyle = cardGradient;
            ctx.beginPath();
            ctx.roundRect(c.x + 10, c.y - 40, 40, 30, 7);
            ctx.fill();
            ctx.strokeStyle = c.isVip ? '#ffd166' : 'rgba(255, 111, 177, 0.72)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = '600 18px "Rajdhani"';
            ctx.fillStyle = '#2c1220';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(c.order.icon, c.x + 30, c.y - 25);

            if (c.quantity > 1) {
                ctx.font = 'bold 12px "Bangers"';
                ctx.fillStyle = '#cf4b2f';
                ctx.fillText(`x${c.quantity}`, c.x + 45, c.y - 35);
            }
        }
        ctx.restore();
    });

    // Particles: preserve existing particle state, render as hearts/sparkles for prompt identity.
    particles.forEach((p, i) => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        if (i % 3 === 0) {
            drawHeart(p.x, p.y, p.size * 3, p.color, 0.9, time + i);
        } else {
            ctx.fillStyle = p.color;
            ctx.translate(p.x, p.y);
            ctx.rotate(time * 2 + i);
            ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.beginPath();
            ctx.moveTo(-p.size * 1.4, 0);
            ctx.lineTo(p.size * 1.4, 0);
            ctx.moveTo(0, -p.size * 1.4);
            ctx.lineTo(0, p.size * 1.4);
            ctx.stroke();
        }
        ctx.restore();
    });

    // Floating Text
    ctx.font = 'bold 24px "Bangers"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    floatingTexts.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillText(t.text, t.x + 2, t.y + 2);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    });
}

// --- §7 Utils ---

function initAudio() {
    if (audioReady) return;
    audioReady = true;
    const bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
}

function showGifFeedback(type, duration = 1000) {
    const config = GIFS[type];
    if (!config) return;
    const img = document.getElementById(config.imgId);
    const label = document.getElementById(config.labelId);
    if (!img || !label) return;
    img.classList.add('is-visible');
    label.classList.add('is-visible');
    clearTimeout(config.timer);
    config.timer = setTimeout(() => {
        img.classList.remove('is-visible');
        label.classList.remove('is-visible');
    }, duration);
}

function playSound(type) {
    if (!audioCtx) return;
    const idMap = {
        collect: 'sfx_collect',
        unlock: 'sfx_unlock',
        clean: 'sfx_clean',
        ui: 'sfx_ui'
    };
    const el = document.getElementById(idMap[type] || 'sfx_ui');
    if (el) {
        el.currentTime = 0;
        el.play().catch(() => playSynth(type));
    } else {
        playSynth(type);
    }
}

function playSynth(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(780, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'clean') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.16);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
    } else if (type === 'ui') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(760, audioCtx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.24);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    }
}

function vibrate(style) {
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 50 : 10);
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
        params: { style }
    });
}
