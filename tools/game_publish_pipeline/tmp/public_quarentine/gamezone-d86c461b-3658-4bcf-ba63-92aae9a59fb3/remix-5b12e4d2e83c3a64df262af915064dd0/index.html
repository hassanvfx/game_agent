    <style>

        .status-pill {

        @media (max-width: 640px) {
            .panel {
                padding: 1.2rem;
                gap: 0.8rem;

<!-- [agent-note][stage3] resolved-audio: bgm/action + collect + crash + ui via catalogs/audios.json -->

<script>
window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Steering Responsiveness", "value": 12, "min": 1, "max": 30 },
    "baseSpeed": { "type": "number", "label": "Game Speed", "value": 400, "min": 200, "max": 800 },
    "themeColor": { "type": "color", "label": "Hero Color", "value": "#00f3ff" },
    "enemyColor": { "type": "color", "label": "Enemy Color", "value": "#ff0055" }
};
window.gameConfig = {};

let canvas, ctx;
let lastTime = 0;
let gameState = 'MENU';
let score = 0;
let speedMultiplier = 1;
let shakeTime = 0;
let glitchTime = 0;

let hero = { x: 0, y: 0, radius: 15, targetX: 0, trail: [] };
let obstacles = [];
let particles = [];
let gridOffset = 0;

let audioCtx;

function parseConfig() {
    const script = document.getElementById('game-config');
    if (script) {
        try {
            const defs = JSON.parse(script.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                window.gameConfig[key] = defs[key].value;
            }
        } catch (e) {
            console.error("Config parse error", e);
        }
    }
}

window.updateGameConfig = function(key, val) {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
};

const AudioMgr = {
    sfxCooldowns: {},
    init: function() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    },
    playBgm: function() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.volume = 0.2;
            if (el.paused) {
                el.play().catch(() => {});
            }
        }
    },
    stopBgm: function() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    },
    playSfx: function(id, cooldown = 0) {
        this.init();
        const now = performance.now();
        if (cooldown > 0 && this.sfxCooldowns[id] && now - this.sfxCooldowns[id] < cooldown) {
            return;
        }
        this.sfxCooldowns[id] = now;

        const el = document.getElementById(id);
        if (el) {
            const clone = el.cloneNode();
            clone.volume = id === 'sfx_ui' ? 0.45 : 0.72;
            clone.play().catch(() => this.synthesizeFallback(id));
        } else {
            this.synthesizeFallback(id);
        }
    },
    synthesizeFallback: function(id) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (id === 'sfx_collect' || id === 'sfx_ui') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(id === 'sfx_ui' ? 620 : 800, now);
            osc.frequency.exponentialRampToValueAtTime(id === 'sfx_ui' ? 860 : 1200, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.28);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
            osc.start(now);
            osc.stop(now + 0.28);
        }
    }
};

const FeedbackMgr = {
    timers: {},
    showGif(id, duration = 900) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('is-visible');
        clearTimeout(this.timers[id]);
        this.timers[id] = setTimeout(() => {
            el.classList.remove('is-visible');
        }, duration);
    },
    showStatus(message, tone = 'normal', duration = 900) {
        const pill = document.getElementById('status-pill');
        if (!pill) return;
        pill.textContent = message;
        pill.classList.toggle('danger', tone === 'danger');
        pill.classList.add('is-visible');
        clearTimeout(this.timers.status);
        this.timers.status = setTimeout(() => {
            pill.classList.remove('is-visible');
        }, duration);
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

    if (gameState === 'MENU') {
        hero.x = window.innerWidth / 2;
        hero.y = window.innerHeight - 150;
        hero.targetX = window.innerWidth / 2;
    }
}

function initGame() {
    score = 0;
    speedMultiplier = 1;
    obstacles = [];
    particles = [];
    hero.x = window.innerWidth / 2;
    hero.y = window.innerHeight - 150;
    hero.targetX = window.innerWidth / 2;
    hero.trail = [];

    document.getElementById('score').innerText = '0';
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');

    gameState = 'PLAYING';
    lastTime = performance.now();
    AudioMgr.playBgm();
    FeedbackMgr.showStatus('Run Live', 'normal', 1000);
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameState = 'GAMEOVER';
    shakeTime = 0.5;
    glitchTime = 0.5;
    AudioMgr.stopBgm();
    AudioMgr.playSfx('sfx_crash', 250);
    FeedbackMgr.showGif('danger-gif', 1400);
    FeedbackMgr.showStatus('Core Breach', 'danger', 1400);

    document.getElementById('hud').classList.add('hidden');
    document.getElementById('finalScore').innerText = Math.floor(score);
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function spawnObstacle() {
    const type = Math.random() > 0.2 ? 'wall' : 'coin';
    const width = window.innerWidth;
    const laneCount = 4;
    const laneWidth = width / laneCount;
    const lane = Math.floor(Math.random() * laneCount);

    if (type === 'wall') {
        obstacles.push({
            type: 'wall',
            x: lane * laneWidth + laneWidth * 0.1,
            y: -100,
            w: laneWidth * 0.8,
            h: 40,
            active: true
        });
    } else {
        obstacles.push({
            type: 'coin',
            x: lane * laneWidth + laneWidth / 2,
            y: -100,
            r: 15,
            active: true
        });
    }
}

function createParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = Math.random() * speed;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * vel,
            vy: Math.sin(angle) * vel,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    speedMultiplier += dt * 0.05;
    const currentSpeed = window.gameConfig.baseSpeed * (1 + speedMultiplier * 0.1);

    const safeDt = Math.min(dt, 0.1);
    const t = 1 - Math.pow(0.05, safeDt * window.gameConfig.heroSpeed);
    hero.x += (hero.targetX - hero.x) * t;

    hero.trail.push({ x: hero.x, y: hero.y, age: 0 });
    if (hero.trail.length > 20) hero.trail.shift();
    hero.trail.forEach(pt => pt.age += dt);

    if (Math.random() < 0.02 * (1 + speedMultiplier * 0.2)) {
        spawnObstacle();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += currentSpeed * dt;

        if (obs.active) {
            if (obs.type === 'wall') {
                if (hero.x > obs.x && hero.x < obs.x + obs.w &&
                    hero.y > obs.y && hero.y < obs.y + obs.h) {
                    createParticles(hero.x, hero.y, window.gameConfig.themeColor, 30, 200);
                    gameOver();
                }
            } else if (obs.type === 'coin') {
                const dx = hero.x - obs.x;
                const dy = hero.y - obs.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < hero.radius + obs.r) {
                    obs.active = false;
                    score += 100;
                    AudioMgr.playSfx('sfx_collect', 90);
                    FeedbackMgr.showGif('collect-gif', 720);
                    FeedbackMgr.showStatus('Orb Collected', 'normal', 720);
                    createParticles(obs.x, obs.y, '#ffe600', 15, 150);
                }
            }
        }

        if (obs.y > window.innerHeight + 100) {
            if (obs.type === 'wall' && obs.active) score += 10;
            obstacles.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
    }

    score += dt * 10;
    document.getElementById('score').innerText = Math.floor(score);

    gridOffset = (gridOffset + currentSpeed * dt) % 100;
}

function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);

    let shakeX = 0, shakeY = 0;
    if (shakeTime > 0) {
        shakeX = (Math.random() - 0.5) * 20 * shakeTime;
        shakeY = (Math.random() - 0.5) * 20 * shakeTime;
        shakeTime -= 0.016;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
    ctx.lineWidth = 2;
    const w = window.innerWidth;
    const h = window.innerHeight;

    const cx = w / 2;
    for (let i = -5; i <= 5; i++) {
        ctx.beginPath();
        const x = cx + i * (w / 5);
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
    }

    for (let y = gridOffset; y < h; y += 100) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    }

    if (hero.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(hero.trail[0].x, hero.trail[0].y);
        for (let i = 1; i < hero.trail.length; i++) {
            ctx.lineTo(hero.trail[i].x, hero.trail[i].y);
        }
        ctx.lineWidth = hero.radius;
        ctx.lineCap = 'round';
        ctx.strokeStyle = `${window.gameConfig.themeColor}44`;
        ctx.stroke();
    }

    obstacles.forEach(obs => {
        if (!obs.active) return;
        if (obs.type === 'wall') {
            ctx.fillStyle = window.gameConfig.enemyColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = window.gameConfig.enemyColor;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fff';
            if (Math.random() > 0.9) ctx.fillRect(obs.x + Math.random() * obs.w, obs.y, 5, obs.h);
        } else {
            ctx.beginPath();
            ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffe600';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffe600';
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    });

    if (gameState !== 'GAMEOVER') {
        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.radius + 5, 0, Math.PI * 2);
        ctx.strokeStyle = window.gameConfig.themeColor;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    ctx.restore();

    if (glitchTime > 0) {
        glitchTime -= 0.016;
        ctx.fillStyle = `rgba(255, 0, 85, ${Math.random() * 0.2})`;
        ctx.fillRect(0, Math.random() * h, w, Math.random() * 50);
        ctx.fillStyle = `rgba(0, 243, 255, ${Math.random() * 0.2})`;
        ctx.fillRect(Math.random() * w, 0, Math.random() * 50, h);
    }
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }

    if (gameState === 'PLAYING') {
        requestAnimationFrame(gameLoop);
    } else if (gameState === 'GAMEOVER') {
        if (particles.length > 0 || glitchTime > 0) {
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }
    }
}

function handleInput(e) {
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    hero.targetX = Math.max(hero.radius, Math.min(window.innerWidth - hero.radius, x));
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        AudioMgr.stopBgm();
    } else if (gameState === 'PLAYING') {
        AudioMgr.playBgm();
    }
});

document.addEventListener('DOMContentLoaded', () => {
    parseConfig();

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });

    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', (e) => {
        AudioMgr.init();
        handleInput(e);
        canvas.setPointerCapture(e.pointerId);
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        AudioMgr.init();
        AudioMgr.playSfx('sfx_ui', 120);
        initGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        AudioMgr.init();
        AudioMgr.playSfx('sfx_ui', 120);
        initGame();
    });

    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
});
