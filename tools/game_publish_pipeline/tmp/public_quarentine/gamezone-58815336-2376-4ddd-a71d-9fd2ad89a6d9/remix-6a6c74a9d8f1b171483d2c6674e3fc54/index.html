    <style>

<!-- [agent-note][stage4] repaired: mobile-tap-path | element: #start-btn / #restart-btn | action: moved touch suppression off global page and onto game surface -->
<div id="game-container" class="full-size">

<script>
/* =========================================
   AUDIO SYSTEM (Catalog-backed + safe loops)
   ========================================= */
class AudioSys {
    constructor() {
        this.ctx = null;
        this.active = false;
        this.master = 0.55;
        this.sfxMap = {
            start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
            click: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
            roll: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3',
            step: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',
            spike: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_01.mp3',
            heal: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
            gold: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3',
            lowhp: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3',
            win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
            lose: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
            blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3'
        };
        this.loopMap = {
            gameplay: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
            victory: 'https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3',
            defeat: 'https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3'
        };
        this.sfxPlayers = new Map();
        this.loops = new Map();
        this.lastPlayed = new Map();
        this.stepCooldown = 0;
        this.lowHpWarned = false;
    }
    init() {
        if (!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) this.ctx = new Ctx();
        }
        if (!this.ctx) return Promise.resolve(false);
        return this.ctx.resume()
            .then(() => {
                this.active = true;
                return true;
            })
            .catch(() => false);
    }
    getPlayer(url, { loop = false, volume = 0.5 } = {}) {
        const key = `${url}|${loop ? 'loop' : 'shot'}`;
        let player = this.sfxPlayers.get(key);
        if (!player) {
            player = new Audio(url);
            player.preload = 'auto';
            player.loop = loop;
            this.sfxPlayers.set(key, player);
        }
        player.volume = Math.min(1, volume * this.master);
        player.loop = loop;
        return player;
    }
    play(name, { volume = 0.55, cooldown = 0, reset = true } = {}) {
        if (!this.active || !this.sfxMap[name]) return;
        const now = performance.now();
        const last = this.lastPlayed.get(name) || 0;
        if (cooldown && now - last < cooldown) return;
        this.lastPlayed.set(name, now);
        try {
            const player = this.getPlayer(this.sfxMap[name], { volume });
            if (reset) player.currentTime = 0;
            const p = player.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
        } catch {}
    }
    playStep() {
        if (!this.active) return;
        const now = performance.now();
        if (now - this.stepCooldown < 110) return;
        this.stepCooldown = now;
        this.play('step', { volume: 0.28, cooldown: 110 });
    }
    startLoop(name, volume = 0.28) {
        if (!this.active || !this.loopMap[name]) return;
        this.stopAllLoops();
        try {
            const loop = this.getPlayer(this.loopMap[name], { loop: true, volume });
            loop.currentTime = 0;
            this.loops.set(name, loop);
            const p = loop.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
        } catch {}
    }
    stopAllLoops() {
        for (const loop of this.loops.values()) {
            try {
                loop.pause();
                loop.currentTime = 0;
            } catch {}
        }
        this.loops.clear();
    }
    syncForState(mode) {
        if (!this.active) return;
        if (mode === 'GAMEOVER') return;
        if (mode === 'MENU') {
            this.stopAllLoops();
            return;
        }
        if (mode === 'IDLE' || mode === 'ROLLING' || mode === 'MOVING') {
            if (!this.loops.has('gameplay')) this.startLoop('gameplay', 0.24);
        }
    }
}
const audio = new AudioSys();

/* =========================================
   GAME LOGIC
   ========================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const CFG = {
    tileCount: 40,
    cols: 5,
    colors: {
        bg: '#050914',
        path: '#29477d',
        tileSafe: '#203866',
        tileSpike: '#1c142e',
        spikeActive: '#ff5d7a',
        tileHeal: '#103c31',
        tileGold: '#624d14',
        player: '#61d6ff',
        playerCore: '#dffcff',
        playerTrim: '#8570ff',
        highlight: '#ffffff'
    }
};

let state = {
    mode: 'MENU',
    board: [],
    player: { idx: 0, vIdx: 0, hp: 100, score: 0 },
    dice: { val: 0, vVal: 1, timer: 0 },
    lastTime: 0,
    animTime: 0
};

function initGame() {
    state.player = { idx: 0, vIdx: 0, hp: 100, score: 0 };
    setMode('IDLE');
    generateBoard();
    updateUI();

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('danger-gif').classList.add('hidden');
    document.getElementById('victory-gif').classList.add('hidden');
    document.getElementById('hud').classList.remove('opacity-0');
    document.getElementById('controls').classList.remove('opacity-0');
    document.getElementById('roll-btn').disabled = false;
    document.getElementById('roll-btn').innerText = 'Sprint';
}

function generateBoard() {
    state.board = [];

    for (let i = 0; i < CFG.tileCount; i++) {
        let type = 'EMPTY';

        if (i === 0) type = 'START';
        else if (i === CFG.tileCount - 1) type = 'GOAL';
        else {
            const r = Math.random();
            if (r < 0.45) type = 'SPIKE';
            else if (r < 0.55) type = 'HEAL';
            else if (r < 0.65) type = 'GOLD';
            else type = 'EMPTY';
        }

        state.board.push({ type: type, id: i });
    }
}

function getTilePos(idx, w, h) {
    const rows = Math.ceil(CFG.tileCount / CFG.cols);
    const tileSize = Math.min(w / CFG.cols, h / (rows + 2));

    const row = Math.floor(idx / CFG.cols);
    const col = idx % CFG.cols;
    const drawCol = (row % 2 === 0) ? col : (CFG.cols - 1 - col);

    const x = drawCol * tileSize + tileSize / 2;
    const y = h - (row * tileSize + tileSize * 1.5);

    return { x, y, size: tileSize * 0.8 };
}

/* =========================================
   UPDATE LOOP
   ========================================= */
function update(dt) {
    state.animTime += dt;

    if (state.mode === 'ROLLING') {
        state.dice.timer -= dt;
        if (state.dice.timer <= 0) {
            finishRoll();
        } else if (Math.random() > 0.5) {
            state.dice.vVal = Math.floor(Math.random() * 6) + 1;
        }
    }

    if (state.mode === 'MOVING') {
        const speed = 4 * dt;
        const diff = state.player.idx - state.player.vIdx;

        if (Math.abs(diff) < speed) {
            state.player.vIdx = state.player.idx;
            landOnTile();
        } else {
            state.player.vIdx += Math.sign(diff) * speed;
            if (Math.floor(state.player.vIdx) !== Math.floor(state.player.vIdx - Math.sign(diff) * speed)) {
                audio.playStep();
            }
        }
    }
}

function startRoll() {
    if (state.mode !== 'IDLE') {
        audio.play('blocked', { volume: 0.3, cooldown: 220 });
        return;
    }
    audio.init();
    setMode('ROLLING');
    state.dice.timer = 0.5;
    audio.play('roll', { volume: 0.4, cooldown: 120 });
    document.getElementById('roll-btn').disabled = true;
    document.getElementById('roll-btn').innerText = '...';
}

function finishRoll() {
    state.dice.val = Math.floor(Math.random() * 6) + 1;
    state.dice.vVal = state.dice.val;

    const nextIdx = Math.min(state.player.idx + state.dice.val, CFG.tileCount - 1);
    state.player.idx = nextIdx;
    setMode('MOVING');
}

function landOnTile() {
    const tile = state.board[state.player.idx];
    let dmg = 0;
    let heal = 0;
    let gold = 0;
    let txt = '';
    let color = '#fff';

    if (tile.type === 'GOAL') {
        setMode('GAMEOVER');
        state.player.score += 500;
        audio.play('win', { volume: 0.5 });
        showFeedbackGif('victory');
        endGame(true);
        return;
    } else if (tile.type === 'SPIKE') {
        dmg = 20 + Math.floor(Math.random() * 10);
        txt = `-${dmg} STM`;
        color = '#ff0000';
        audio.play('spike', { volume: 0.5, cooldown: 180 });
        showFeedbackGif('danger');
        triggerShake();
    } else if (tile.type === 'HEAL') {
        heal = 15;
        txt = `+${heal} STM`;
        color = '#00ff00';
        audio.play('heal', { volume: 0.45, cooldown: 140 });
    } else if (tile.type === 'GOLD') {
        gold = 50;
        txt = `+${gold} DST`;
        color = '#ffff00';
        audio.play('gold', { volume: 0.46, cooldown: 140 });
    }

    state.player.hp -= dmg;
    state.player.hp = Math.min(100, state.player.hp + heal);
    state.player.score += gold;

    if (txt) spawnFloatText(txt, color);
    updateUI();

    if (state.player.hp <= 0) {
        setTimeout(() => endGame(false), 500);
    } else {
        setMode('IDLE');
        document.getElementById('roll-btn').disabled = false;
        document.getElementById('roll-btn').innerText = 'Sprint';
    }
}

/* =========================================
   RENDER LOOP
   ========================================= */
function draw() {
    const w = canvas.width;
    const h = canvas.height;

    ctx.fillStyle = CFG.colors.bg;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = CFG.colors.path;
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let i = 0; i < CFG.tileCount; i++) {
        const p = getTilePos(i, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    for (let i = 0; i < CFG.tileCount; i++) {
        const t = state.board[i];
        const p = getTilePos(i, w, h);

        ctx.fillStyle = (t.type === 'SPIKE') ? CFG.colors.tileSpike : CFG.colors.tileSafe;
        if (t.type === 'START') ctx.fillStyle = '#44aa44';
        if (t.type === 'GOAL') ctx.fillStyle = '#ddaa00';

        const s = p.size;
        ctx.beginPath();
        ctx.roundRect(p.x - s / 2, p.y - s / 2, s, s, 4);
        ctx.fill();

        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (t.type === 'SPIKE') {
            ctx.fillStyle = CFG.colors.spikeActive;
            const spikeH = s * 0.4;
            for (let j = -1; j <= 1; j++) {
                ctx.beginPath();
                ctx.moveTo(p.x + j * (s / 3) - s / 6, p.y + s / 4);
                ctx.lineTo(p.x + j * (s / 3), p.y - spikeH);
                ctx.lineTo(p.x + j * (s / 3) + s / 6, p.y + s / 4);
                ctx.fill();
            }
        } else if (t.type === 'HEAL') {
            ctx.fillStyle = '#00ff00';
            ctx.font = `bold ${s * 0.44}px "Press Start 2P", "Orbitron", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('+', p.x, p.y);
        } else if (t.type === 'GOLD') {
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(p.x, p.y, s * 0.2, 0, Math.PI * 2);
            ctx.fill();
        } else if (t.type === 'GOAL') {
            ctx.fillStyle = '#fff';
            ctx.font = `${s * 0.34}px "Press Start 2P", "Orbitron", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GO', p.x, p.y);
        }
    }

    if (state.board.length > 0) {
        const idx = Math.floor(state.player.vIdx);
        const next = Math.min(idx + 1, CFG.tileCount - 1);
        const frac = state.player.vIdx - idx;

        const p1 = getTilePos(idx, w, h);
        const p2 = getTilePos(next, w, h);

        const px = p1.x + (p2.x - p1.x) * frac;
        let py = p1.y + (p2.y - p1.y) * frac;
        py -= Math.sin(frac * Math.PI) * (p1.size * 0.5);

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(px, p1.y + (p2.y - p1.y) * frac + p1.size / 3, p1.size / 4 * (1 - Math.sin(frac * Math.PI) * 0.5), p1.size / 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = CFG.colors.player;
        ctx.beginPath();
        ctx.arc(px, py, p1.size / 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(px - p1.size / 10, py - p1.size / 10, p1.size / 8, 0, Math.PI * 2);
        ctx.fill();
    }

    if (state.mode === 'ROLLING' || state.mode === 'MOVING') {
        const ds = Math.min(w, h) * 0.2;
        ctx.save();
        ctx.translate(w / 2, h / 2);

        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.beginPath();
        ctx.roundRect(-ds * 0.6, -ds * 0.6, ds * 1.2, ds * 1.2, 10);
        ctx.fill();

        ctx.fillStyle = '#eee';
        if (state.mode === 'ROLLING') {
            ctx.rotate(Math.sin(state.animTime * 20) * 0.2);
        }
        ctx.beginPath();
        ctx.roundRect(-ds / 2, -ds / 2, ds, ds, 8);
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#cc0000';
        const val = state.dice.vVal;
        const pip = ds * 0.18;
        const drawPip = (x, y) => {
            ctx.beginPath();
            ctx.arc(x * ds * 0.25, y * ds * 0.25, pip / 2, 0, Math.PI * 2);
            ctx.fill();
        };

        if (val % 2 === 1) drawPip(0, 0);
        if (val > 1) { drawPip(-1, -1); drawPip(1, 1); }
        if (val > 3) { drawPip(1, -1); drawPip(-1, 1); }
        if (val === 6) { drawPip(1, 0); drawPip(-1, 0); }

        ctx.restore();
    }
}

function loop(t) {
    const dt = Math.min((t - state.lastTime) / 1000, 0.1);
    state.lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

/* =========================================
   UI & EVENTS
   ========================================= */
function updateUI() {
    document.getElementById('hp-display').innerText = Math.max(0, state.player.hp);
    document.getElementById('score-display').innerText = state.player.score;

    if (state.player.hp > 0 && state.player.hp <= 35 && !audio.lowHpWarned) {
        audio.play('lowhp', { volume: 0.36, cooldown: 700 });
        audio.lowHpWarned = true;
    } else if (state.player.hp > 35) {
        audio.lowHpWarned = false;
    }
}

function triggerShake() {
    const c = document.getElementById('game-container');
    const f = document.getElementById('flash-overlay');
    c.classList.remove('shake');
    f.classList.remove('blood-flash');
    void c.offsetWidth;
    c.classList.add('shake');
    f.classList.add('blood-flash');
}

const feedbackTimers = new Map();

function setMode(nextMode) {
    state.mode = nextMode;
    audio.syncForState(nextMode);
}

function showFeedbackGif(kind) {
    const id = kind === 'victory' ? 'victory-gif' : 'danger-gif';
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('hidden');
    el.classList.add('show');
    clearTimeout(feedbackTimers.get(id));
    feedbackTimers.set(id, setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.classList.add('hidden'), 220);
    }, kind === 'victory' ? 2600 : 900));
}

function spawnFloatText(text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.style.color = color;
    el.innerText = text;

    const w = canvas.width;
    const h = canvas.height;
    const p = getTilePos(Math.floor(state.player.vIdx), w, h);
    el.style.left = (p.x / (window.devicePixelRatio || 1)) + 'px';
    el.style.top = (p.y / (window.devicePixelRatio || 1)) + 'px';

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function endGame(win) {
    setMode('GAMEOVER');
    const screen = document.getElementById('game-over-screen');
    const title = document.getElementById('end-title');

    screen.classList.remove('hidden');
    document.getElementById('hud').classList.add('opacity-0');
    document.getElementById('controls').classList.add('opacity-0');
    document.getElementById('final-score').innerText = state.player.score;

    if (win) {
        title.innerText = 'Route Cleared';
        audio.startLoop('victory', 0.24);
        title.className = 'title';
        title.style.color = '#ffd447';
        title.style.textShadow = 'none';
    } else {
        title.innerText = 'Run Crashed';
        showFeedbackGif('danger');
        audio.play('lose', { volume: 0.5 });
        audio.startLoop('defeat', 0.22);
        title.className = 'title title-danger';
        title.style.color = '';
        title.style.textShadow = '';
    }
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = document.body.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resize);
document.getElementById('roll-btn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startRoll();
});
document.getElementById('start-btn').addEventListener('click', () => {
    audio.init().then(() => {
        audio.play('start', { volume: 0.45 });
        initGame();
    });
});
document.getElementById('restart-btn').addEventListener('click', () => {
    audio.init().then(() => {
        audio.play('click', { volume: 0.4 });
        initGame();
    });
});

resize();
requestAnimationFrame(loop);
</script>
