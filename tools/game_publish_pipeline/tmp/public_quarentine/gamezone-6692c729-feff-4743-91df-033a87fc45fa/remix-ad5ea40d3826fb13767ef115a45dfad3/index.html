<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mom's Day Brainrot 3D: Meme Cab Bouquet Dash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23140d35'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-size='34'%3E%F0%9F%92%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- [agent-note][stage4] resolved-font: title -> Audiowide, ui/body -> Orbitron via catalogs/fonts.json -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-sky-top: #140d35;
        --bg-sky-bottom: #3a1f7d;
        --panel: rgba(15, 10, 41, 0.78);
        --panel-border: rgba(133, 237, 255, 0.92);
        --panel-shadow: rgba(6, 3, 22, 0.45);
        --text-main: #f7fbff;
        --text-soft: #b8c9ff;
        --accent-cyan: #67e8f9;
        --accent-gold: #ffd54f;
        --accent-pink: #ff77c8;
        --danger: #ff6b6b;
        --go: #64f4a3;
    }

    /* --- CORE & RESET --- */
    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(103, 232, 249, 0.18), transparent 30%),
            linear-gradient(180deg, var(--bg-sky-top), var(--bg-sky-bottom));
        touch-action: manipulation; user-select: none; -webkit-user-select: none;
        font-family: 'Orbitron', system-ui, sans-serif;
        color: var(--text-main);
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            radial-gradient(circle at 18% 14%, rgba(255, 119, 200, 0.32), transparent 0.52rem),
            radial-gradient(circle at 23% 16%, rgba(255, 119, 200, 0.26), transparent 0.42rem),
            radial-gradient(circle at 80% 20%, rgba(103, 232, 249, 0.2), transparent 0.55rem),
            radial-gradient(circle at 64% 11%, rgba(255, 216, 111, 0.18), transparent 0.45rem),
            radial-gradient(circle at 34% 29%, rgba(255, 255, 255, 0.14), transparent 0.35rem),
            repeating-linear-gradient(115deg, transparent 0 38px, rgba(255, 119, 200, 0.045) 38px 40px);
        opacity: 0.95;
        animation: momSkyTwinkle 9s ease-in-out infinite alternate;
    }

    body::after {
        background:
            radial-gradient(ellipse at 50% 105%, rgba(255, 77, 166, 0.22), transparent 42%),
            radial-gradient(ellipse at 12% 74%, rgba(89, 240, 167, 0.11), transparent 28%),
            radial-gradient(ellipse at 88% 70%, rgba(255, 200, 87, 0.12), transparent 30%);
        mix-blend-mode: screen;
        opacity: 0.8;
        animation: momParadeGlow 12s ease-in-out infinite alternate;
    }

    @keyframes momSkyTwinkle {
        from { transform: translate3d(0, 0, 0) scale(1); filter: saturate(1); }
        to { transform: translate3d(-10px, 8px, 0) scale(1.02); filter: saturate(1.18); }
    }

    @keyframes momParadeGlow {
        from { opacity: 0.55; transform: translateY(0); }
        to { opacity: 0.88; transform: translateY(-10px); }
    }

    #game-canvas { position: absolute; inset: 0; z-index: 1; display: block; pointer-events: none; }

    /* --- UI LAYER --- */
    #ui-layer {
        position: absolute; inset: 0; z-index: 10; pointer-events: none;
        display: flex; flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* --- HUD --- */
    .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        gap: 10px;
        padding: 16px; width: 100%; box-sizing: border-box;
        pointer-events: auto;
    }

    .panel-box {
        position: relative;
        min-width: 84px;
        background:
            radial-gradient(circle at 18% 16%, rgba(255, 119, 200, 0.22), transparent 34%),
            linear-gradient(180deg, rgba(16, 11, 47, 0.94), rgba(27, 18, 66, 0.82));
        backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 8px 14px;
        border: 2px solid var(--panel-border);
        box-shadow: 0 10px 20px -10px var(--panel-shadow), inset 0 0 18px rgba(103, 232, 249, 0.16), 0 0 18px rgba(255, 119, 200, 0.16);
        display: flex; flex-direction: column; align-items: center;
        overflow: hidden;
    }
    .panel-box::after {
        content: "♡";
        position: absolute;
        right: 6px;
        top: -2px;
        color: rgba(255, 255, 255, 0.18);
        font-size: 22px;
        line-height: 1;
        pointer-events: none;
    }
    .panel-label {
        font-size: 11px;
        color: var(--text-soft);
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.12em;
    }
    .panel-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
        text-shadow: 0 0 14px rgba(103, 232, 249, 0.2);
    }

    .nav-arrow {
        position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
        width: 82px; height: 82px;
        background:
            radial-gradient(circle at 45% 35%, rgba(255, 255, 255, 0.36), transparent 26%),
            radial-gradient(circle, rgba(103, 232, 249, 0.28), rgba(18, 14, 47, 0.9));
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; border: 2px solid rgba(255,255,255,0.85);
        box-shadow: 0 0 20px rgba(103, 232, 249, 0.28), 0 0 36px rgba(255, 119, 200, 0.18);
        opacity: 0; transition: opacity 0.3s;
    }
    .nav-arrow.visible { opacity: 1; }

    /* --- CONTROLS --- */
    .controls-area {
        margin-top: auto; padding: 20px;
        display: flex; justify-content: space-between; align-items: flex-end;
        width: 100%; box-sizing: border-box;
        pointer-events: none;
    }
    .btn-group { display: flex; gap: 12px; pointer-events: auto; }

    .c-btn {
        background:
            radial-gradient(circle at 32% 22%, rgba(255, 255, 255, 0.28), transparent 28%),
            linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
        backdrop-filter: blur(8px);
        border: 2px solid rgba(255,255,255,0.5);
        border-radius: 20px;
        color: white;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 700;
        font-family: 'Orbitron', system-ui, sans-serif;
        box-shadow: 0 6px 0 rgba(8, 5, 28, 0.45), 0 0 18px rgba(103, 232, 249, 0.14);
        transition: transform 0.1s, background 0.1s, top 0.1s, box-shadow 0.1s;
        touch-action: none; position: relative;
        overflow: hidden;
    }
    .c-btn::after {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.16);
        pointer-events: none;
    }
    .c-btn:active, .c-btn.active {
        transform: translateY(4px);
        box-shadow: 0 0 0 rgba(0,0,0,0);
        background: rgba(255,255,255,0.38);
        border-color: white;
    }

    .btn-steer { width: 80px; height: 80px; border-radius: 50%; }
    .btn-pedal { width: 75px; height: 100px; flex-direction: column; gap: 4px; }

    .bg-green { background: linear-gradient(180deg, rgba(100, 244, 163, 0.38), rgba(32, 109, 72, 0.3)); border-color: #64f4a3; }
    .bg-red { background: linear-gradient(180deg, rgba(255, 107, 107, 0.42), rgba(142, 34, 34, 0.28)); border-color: #ff8484; }

    /* --- SCREENS --- */
    .screen {
        position: absolute; inset: 0; z-index: 50;
        background:
            radial-gradient(circle at 50% 14%, rgba(255, 119, 200, 0.2), transparent 28%),
            radial-gradient(circle at top, rgba(103, 232, 249, 0.15), transparent 30%),
            repeating-linear-gradient(135deg, rgba(255, 200, 87, 0.045) 0 2px, transparent 2px 42px),
            rgba(15, 10, 41, 0.9);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.3s;
        text-align: center; padding: 18px;
    }
    .screen.active { opacity: 1; pointer-events: auto; touch-action: manipulation; }

    h1 {
        font-family: 'Audiowide', 'Exo 2', sans-serif;
        font-size: clamp(34px, 8vw, 52px);
        letter-spacing: 0.06em;
        color: var(--text-main);
        text-shadow: 0 5px 0 rgba(10, 7, 31, 0.6), 0 0 24px rgba(103, 232, 249, 0.16), 0 0 30px rgba(255, 119, 200, 0.22);
        margin: 0 0 16px 0; line-height: 0.95;
    }
    .card {
        position: relative;
        background:
            radial-gradient(circle at 20% 0%, rgba(255, 119, 200, 0.18), transparent 30%),
            linear-gradient(180deg, rgba(14, 10, 37, 0.94), rgba(32, 21, 73, 0.9));
        color: var(--text-main);
        padding: 22px 20px; border-radius: 24px;
        width: 100%; max-width: 340px;
        border: 2px solid rgba(255,255,255,0.16);
        box-shadow: 0 18px 30px rgba(0,0,0,0.28), inset 0 0 30px rgba(103, 232, 249, 0.08), 0 0 28px rgba(255, 77, 166, 0.13);
        overflow: hidden;
    }
    .card::before {
        content: "♡ MOM ♡";
        position: absolute;
        top: 8px;
        right: -38px;
        width: 130px;
        padding: 3px 0;
        transform: rotate(28deg);
        background: linear-gradient(90deg, rgba(255, 200, 87, 0.92), rgba(255, 119, 200, 0.92));
        color: #2a1247;
        font: 700 10px/1 'Orbitron', system-ui, sans-serif;
        letter-spacing: 0.14em;
        pointer-events: none;
    }
    .big-btn {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 26% 20%, rgba(255,255,255,0.46), transparent 22%),
            linear-gradient(180deg, var(--accent-gold), #ff9f43);
        color: #3b2102;
        font-family: 'Audiowide', 'Exo 2', sans-serif;
        letter-spacing: 0.08em;
        font-size: 26px; font-weight: 400;
        border: none; padding: 14px 32px;
        border-radius: 999px;
        cursor: pointer; margin-top: 18px;
        box-shadow: 0 6px 0 #d26a11, 0 0 16px rgba(255, 213, 79, 0.28);
        transition: transform 0.1s;
        width: 100%;
    }
    .big-btn {
        min-height: 56px;
        touch-action: manipulation;
    }
    .big-btn::after {
        content: "";
        position: absolute;
        inset: -45%;
        background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.22), transparent 32%);
        animation: momButtonSheen 4.8s linear infinite;
        pointer-events: none;
    }
    .big-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #d26a11; }
    @keyframes momButtonSheen { to { transform: rotate(1turn); } }

    /* --- NOTIFICATIONS --- */
    #center-msg {
        position: absolute; top: 35%; left: 0; right: 0;
        text-align: center; pointer-events: none;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        opacity: 0; transform: scale(0.5);
    }
    #center-msg.visible { opacity: 1; transform: scale(1); }
    .msg-bubble {
        display: inline-block;
        background:
            radial-gradient(circle at 14% 28%, rgba(255, 119, 200, 0.24), transparent 24%),
            linear-gradient(180deg, rgba(255,255,255,0.96), rgba(221, 246, 255, 0.95));
        color: #22174d;
        padding: 10px 24px; border-radius: 999px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 28px rgba(255, 119, 200, 0.22);
        border: 3px solid var(--accent-gold);
    }
    .msg-title { font-family: 'Audiowide', 'Exo 2', sans-serif; font-size: 28px; font-weight: 400; letter-spacing: 0.08em; }
    .msg-sub { font-size: 15px; color: #4d5e7b; font-weight: 700; }

    .mission-copy {
        font-size: 15px;
        line-height: 1.6;
        color: #dce7ff;
        margin: 0;
    }

    .title-sub {
        display: inline-block;
        margin-top: 8px;
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: 15px;
        color: var(--accent-cyan);
        letter-spacing: 0.14em;
    }

    .mom-badge-row {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 0 0 14px;
        pointer-events: none;
    }

    .mom-badge {
        min-width: 34px;
        height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: inset 0 0 12px rgba(103, 232, 249, 0.12), 0 0 14px rgba(255, 119, 200, 0.14);
        font-size: 17px;
    }

    .feedback-gif {
        position: absolute;
        right: 14px;
        width: 92px;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.28);
        box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        object-fit: cover;
        opacity: 0;
        transform: translateY(10px) scale(0.92);
        transition: opacity 0.22s ease, transform 0.22s ease;
        pointer-events: none;
        z-index: 14;
        background: rgba(16, 11, 47, 0.72);
    }
    .feedback-gif.visible {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }
    #mission-gif {
        top: 108px;
        height: 92px;
    }
    #event-gif {
        top: 212px;
        height: 84px;
    }

    @media (max-width: 640px) {
        .hud-top { padding: 12px; gap: 8px; }
        .panel-box { min-width: 74px; padding: 8px 10px; }
        .panel-val { font-size: 18px; }
        .controls-area { padding: 16px; }
        .btn-group { gap: 10px; }
        .btn-steer { width: 72px; height: 72px; }
        .btn-pedal { width: 68px; height: 94px; }
        .c-btn { font-size: 24px; }
        #btn-pause { width: 48px !important; height: 48px !important; }
        .card { max-width: 320px; padding: 20px 18px; }
        .mission-copy { font-size: 13px; line-height: 1.5; }
        .msg-title { font-size: 24px; }
        .msg-sub { font-size: 13px; }
    }
</style>
</head>
<body>

<div id="game-canvas"></div>

<div id="ui-layer">
    <!-- Top HUD -->
    <div class="hud-top">
        <div class="panel-box">
            <div class="panel-label">Love Credits</div>
            <div class="panel-val">❤<span id="ui-cash">0</span></div>
        </div>
        
        <div class="panel-box" id="timer-box">
            <div class="panel-label">Mom Timer</div>
            <div class="panel-val" id="ui-time">60</div>
        </div>

        <button id="btn-pause" class="c-btn" style="width:50px; height:50px; font-size:20px; border-radius:12px;">II</button>
    </div>

    <!-- Direction Hint -->
    <div id="nav-hint" class="nav-arrow">⬆</div>

    <!-- Center Message -->
    <div id="center-msg">
        <div class="msg-bubble">
            <div class="msg-title" id="msg-t">BOUQUET PICKUP</div>
            <div class="msg-sub" id="msg-s">Follow Blue Heart Beams</div>
        </div>
    </div>
    <!-- [agent-note][stage3] resolved-gif: mission and event feedback overlays use catalogs/gifs.json and stay off the playfield -->
    <img id="mission-gif" class="feedback-gif" alt="dispatch reaction overlay">
    <img id="event-gif" class="feedback-gif" alt="event reaction overlay">

    <!-- Controls -->
    <div class="controls-area">
        <div class="btn-group">
            <div id="btn-left" class="c-btn btn-steer">◀</div>
            <div id="btn-right" class="c-btn btn-steer">▶</div>
        </div>
        <div class="btn-group">
            <div id="btn-brake" class="c-btn btn-pedal bg-red">
                <span style="font-size:16px">STOP</span>
            </div>
            <div id="btn-gas" class="c-btn btn-pedal bg-green">
                <span>▲</span>
                <span style="font-size:16px">GO</span>
            </div>
        </div>
    </div>
</div>

<!-- Start Screen -->
<div id="start-screen" class="screen active">
    <h1>MOMCORE CAB<br><span class="title-sub">BOUQUET MEME DASH</span></h1>
    <div class="card">
        <div class="mom-badge-row" aria-hidden="true">
            <span class="mom-badge">💐</span>
            <span class="mom-badge">♡</span>
            <span class="mom-badge">☕</span>
            <span class="mom-badge">💌</span>
        </div>
        <p class="mission-copy">
            🚕 <b>Drive the Momcore cab</b><br>
            🔵 Blue beams pick up bouquets<br>
            🟠 Gold beams deliver smiles<br>
            ⏱ Keep Mom Timer alive
        </p>
        <button id="btn-start" class="big-btn">START MOM RUN</button>
    </div>
</div>

<!-- Pause Screen -->
<div id="pause-screen" class="screen">
    <h1>MOM RUN PAUSED</h1>
    <div class="card">
        <button id="btn-resume" class="big-btn" style="background:#2ecc71; color:white; box-shadow:0 6px 0 #27ae60;">RESUME MOM RUN</button>
        <button id="btn-restart" class="big-btn" style="background:#e74c3c; color:white; box-shadow:0 6px 0 #c0392b; margin-top:15px;">RESTART MOM RUN</button>
    </div>
</div>

<!-- Game Over -->
<div id="gameover-screen" class="screen">
    <h1 style="color:#e74c3c;">MOM RUN OVER!</h1>
    <div class="card">
        <div style="font-size:20px; color:#b8c9ff; margin-bottom:10px;">Total Love Credits</div>
        <div style="font-size:60px; font-weight:bold; color:#f1c40f; margin-bottom:20px;">❤<span id="final-score">0</span></div>
        <button id="btn-retry" class="big-btn">DASH AGAIN</button>
    </div>
</div>

<script type="module">
import * as THREE from './assets/unpkg.com/three_0.160.0/build/three.module.js';

/** 
 * --- CONFIGURATION & CONSTANTS ---
 */
const CFG = {
    gridSize: 16,
    blockSize: 40,
    roadWidth: 22,
    colors: {
        sky: 0x140d35,
        ground: 0x120d2a,
        road: 0x261c56,
        sidewalk: 0x4de2ff,
        building: [0xff4da6, 0x7c5cff, 0x42d7ff, 0xffc857, 0x59f0a7],
        gpsPickup: 0x42d7ff,
        gpsDropoff: 0xffc857
    }
};

const STATE = {
    screen: 'start',
    cash: 0,
    time: 60,
    mission: null, // { type: 'pickup'|'dropoff', gridPos: {x,z} }
    car: { x: 0, z: 0, rot: 0, speed: 0 },
    input: { gas: false, brake: false, left: false, right: false }
};

/**
 * --- WORLD DESIGN MAPPING ---
 * Mom's Day brainrot layer is intentionally cosmetic: cab = love-delivery shuttle,
 * pickup = bouquet/gift site, dropoff = mom celebration zone, score = love credits.
 * Preserve driving physics, pathfinding, collisions, timer, score values, and inputs.
 *
 * --- MEDIA MAPPER RESOLUTIONS ---
 */
const MEDIA = {
    audio: {
        uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        pause: 'https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3',
        resume: 'https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3',
        pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
        dropoff: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        crash: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
        warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3',
        gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
    },
    gifs: {
        mission: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
        success: 'https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp',
        fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
    }
};

/**
 * --- AUDIO SYSTEM ---
 */
const AUDIO = {
    unlocked: false,
    master: 0.5,
    lastPlayAt: {},
    pools: new Map(),
    loops: {},

    ensureLoop(name, src, volume = 0.24) {
        if (this.loops[name]) return this.loops[name];
        const audio = new Audio(src);
        audio.loop = true;
        audio.preload = 'auto';
        audio.crossOrigin = 'anonymous';
        audio.volume = volume * this.master;
        this.loops[name] = audio;
        return audio;
    },

    getPool(src) {
        if (!this.pools.has(src)) this.pools.set(src, []);
        return this.pools.get(src);
    },

    unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        this.ensureLoop('bgm', MEDIA.audio.bgm);
    },

    async play(src, { volume = 0.5, cooldown = 0, key = src } = {}) {
        if (!this.unlocked) return;
        const now = performance.now();
        if (cooldown && this.lastPlayAt[key] && now - this.lastPlayAt[key] < cooldown) return;
        this.lastPlayAt[key] = now;

        const pool = this.getPool(src);
        let audio = pool.find((item) => item.paused || item.ended);
        if (!audio) {
            audio = new Audio(src);
            audio.preload = 'auto';
            audio.crossOrigin = 'anonymous';
            pool.push(audio);
        }

        try {
            audio.pause();
            audio.currentTime = 0;
            audio.volume = Math.max(0, Math.min(1, volume * this.master));
            await audio.play();
        } catch (err) {}
    },

    playUiClick() {
        return this.play(MEDIA.audio.uiClick, { volume: 0.32, cooldown: 70, key: 'uiClick' });
    },

    playPickup() {

    },

    playDropoff() {
        return this.play(MEDIA.audio.dropoff, { volume: 0.52, cooldown: 260, key: 'dropoff' });
    },

    playCrash() {
        return this.play(MEDIA.audio.crash, { volume: 0.42, cooldown: 180, key: 'crash' });
    },

    playWarning() {
        return this.play(MEDIA.audio.warning, { volume: 0.35, cooldown: 850, key: 'warning' });
    },

    playPause() {
        return this.play(MEDIA.audio.pause, { volume: 0.4, cooldown: 180, key: 'pause' });
    },

    playResume() {
        return this.play(MEDIA.audio.resume, { volume: 0.4, cooldown: 180, key: 'resume' });
    },

    playStart() {
        return this.play(MEDIA.audio.start, { volume: 0.48, cooldown: 250, key: 'start' });
    },

    playGameOver() {
        return this.play(MEDIA.audio.gameOver, { volume: 0.5, cooldown: 500, key: 'gameOver' });
    },

    async startLoop(name = 'bgm') {
        if (!this.unlocked) return;
        const audio = this.ensureLoop(name, MEDIA.audio.bgm);
        audio.volume = 0.22 * this.master;
        try {
            await audio.play();
        } catch (err) {}
    },

    pauseLoop(name = 'bgm') {
        const audio = this.loops[name];
        if (!audio) return;
        audio.pause();
    },

    resumeLoop(name = 'bgm') {
        if (!this.unlocked) return;
        const audio = this.loops[name];
        if (!audio) return;
        audio.play().catch(() => {});
    }
};

function makeHeartShape(scale = 1) {
    const shape = new THREE.Shape();
    shape.moveTo(0, -0.42 * scale);
    shape.bezierCurveTo(-0.9 * scale, -1.05 * scale, -1.22 * scale, 0.12 * scale, -0.52 * scale, 0.44 * scale);
    shape.bezierCurveTo(-0.18 * scale, 0.6 * scale, 0, 0.33 * scale, 0, 0.18 * scale);
    shape.bezierCurveTo(0, 0.33 * scale, 0.18 * scale, 0.6 * scale, 0.52 * scale, 0.44 * scale);
    shape.bezierCurveTo(1.22 * scale, 0.12 * scale, 0.9 * scale, -1.05 * scale, 0, -0.42 * scale);
    return shape;
}

const world = {
    grid: [], // 0 = Road, 1 = Building
    width: CFG.gridSize,
    height: CFG.gridSize,
    
    init() {
        // Generate Grid (Manhattan style)
        for(let x=0; x<this.width; x++) {
            this.grid[x] = [];
            for(let z=0; z<this.height; z++) {
                // Perimeter is road
                if(x===0 || x===this.width-1 || z===0 || z===this.height-1) {
                    this.grid[x][z] = 0;
                } 
                // Every 3rd block is road
                else if(x%3 === 0 || z%3 === 0) {
                    this.grid[x][z] = 0;
                } else {
                    this.grid[x][z] = 1;
                }
            }
        }
        this.buildMesh();
    },

    buildMesh() {
        const geoBuildings = [];
        const geoRoads = [];
        const geoSidewalks = [];

        const boxGeo = new THREE.BoxGeometry(1,1,1);
        const planeGeo = new THREE.PlaneGeometry(1,1);
        planeGeo.rotateX(-Math.PI/2);

        // Helper to add instance
        const addMesh = (arr, x, y, z, sx, sy, sz, col) => {
            const mesh = new THREE.Mesh(boxGeo);
            mesh.position.set(x, y, z);
            mesh.scale.set(sx, sy, sz);
            mesh.updateMatrix();
            arr.push(mesh); // We'll just use InstancedMesh for performance
        };

        // We will use InstancedMesh for buildings
        let bCount = 0;
        for(let x=0; x<this.width; x++) for(let z=0; z<this.height; z++) if(this.grid[x][z]===1) bCount++;
        
        const matBuilding = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const iMeshBuilding = new THREE.InstancedMesh(boxGeo, matBuilding, bCount);
        iMeshBuilding.castShadow = true;
        iMeshBuilding.receiveShadow = true;
        
        const dummy = new THREE.Object3D();
        let idx = 0;

        // Ground Plane
        const groundSize = this.width * CFG.blockSize;
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(groundSize, groundSize),
            new THREE.MeshStandardMaterial({ color: CFG.colors.ground })
        );
        ground.rotation.x = -Math.PI/2;
        ground.position.set(groundSize/2 - CFG.blockSize/2, -0.1, groundSize/2 - CFG.blockSize/2);
        ground.receiveShadow = true;
        scene.add(ground);

        // Roads & Sidewalks (Texture based would be better, but we use simple geometry strips)
        // We'll just draw the road network as a single mesh
        const roadMat = new THREE.MeshStandardMaterial({ color: CFG.colors.road, roughness: 0.8 });
        
        for(let x=0; x<this.width; x++) {
            for(let z=0; z<this.height; z++) {
                const wx = x * CFG.blockSize;
                const wz = z * CFG.blockSize;

                if(this.grid[x][z] === 1) {
                    // Building
                    const h = 10 + Math.random() * 30;
                    dummy.position.set(wx, h/2, wz);
                    dummy.scale.set(CFG.blockSize - 4, h, CFG.blockSize - 4);
                    dummy.updateMatrix();
                    iMeshBuilding.setMatrixAt(idx, dummy.matrix);
                    
                    // Color variation
                    const col = new THREE.Color(CFG.colors.building[Math.floor(Math.random()*CFG.colors.building.length)]);
                    iMeshBuilding.setColorAt(idx, col);
                    idx++;
                } else {
                    // Road
                    const road = new THREE.Mesh(new THREE.PlaneGeometry(CFG.blockSize, CFG.blockSize), roadMat);
                    road.rotation.x = -Math.PI/2;
                    road.position.set(wx, 0.05, wz);
                    road.receiveShadow = true;
                    scene.add(road);
                    
                    // Markings (Simple dashed line)
                    const dash = new THREE.Mesh(new THREE.PlaneGeometry(2, CFG.blockSize/2), new THREE.MeshBasicMaterial({color:0xffffff}));
                    dash.rotation.x = -Math.PI/2;
                    dash.position.set(wx, 0.06, wz);
                    scene.add(dash);
                    
                    // Cross dash
                    const dash2 = new THREE.Mesh(new THREE.PlaneGeometry(CFG.blockSize/2, 2), new THREE.MeshBasicMaterial({color:0xffffff}));
                    dash2.rotation.x = -Math.PI/2;
                    dash2.position.set(wx, 0.06, wz);
                    scene.add(dash2);
                }
            }
        }
        scene.add(iMeshBuilding);
        addAmbientMomsDayProps();
    },

    isRoad(x, z) {
        if(x<0 || x>=this.width || z<0 || z>=this.height) return false;
        return this.grid[x][z] === 0;
    },
    
    worldToGrid(x, z) {
        return { x: Math.round(x/CFG.blockSize), z: Math.round(z/CFG.blockSize) };
    },

    gridToWorld(gx, gz) {
        return { x: gx*CFG.blockSize, z: gz*CFG.blockSize };
    }
};

/**
 * --- GPS SYSTEM ---
 */
class GPS {
    constructor() {
        this.path = [];
        this.mesh = null;
        
        // Create Animated Heart-Beam Texture
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        // Draw heart chevrons so the route reads as Mom's Day guidance without changing pathfinding.
        for(let i=0; i<4; i++) {
            const y = i * 64;
            ctx.save();
            ctx.translate(32, y + 31);
            ctx.fillStyle = 'rgba(255,255,255,0.94)';
            ctx.beginPath();
            ctx.moveTo(0, 18);
            ctx.bezierCurveTo(-28, 0, -19, -24, -4, -12);
            ctx.bezierCurveTo(-2, -10, 0, -7, 0, -4);
            ctx.bezierCurveTo(0, -7, 2, -10, 4, -12);
            ctx.bezierCurveTo(19, -24, 28, 0, 0, 18);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.beginPath();
            ctx.moveTo(-15, 25);
            ctx.lineTo(0, 36);
            ctx.lineTo(15, 25);
            ctx.lineTo(0, 30);
            ctx.fill();
            ctx.restore();
        }
        
        this.tex = new THREE.CanvasTexture(canvas);
        this.tex.wrapS = THREE.RepeatWrapping;
        this.tex.wrapT = THREE.RepeatWrapping;
        this.tex.repeat.set(1, 10); // Stretch along path
        
        this.mat = new THREE.MeshBasicMaterial({ 
            map: this.tex, 
            transparent: true, 
            opacity: 0.9,
            side: THREE.DoubleSide,
            color: 0xffffff,
            depthWrite: false
        });
    }

    findPath(startG, endG) {
        // A* Algorithm
        const open = [startG];
        const cameFrom = {};
        const gScore = {};
        const fScore = {};
        
        const id = (n) => `${n.x},${n.z}`;
        
        gScore[id(startG)] = 0;
        fScore[id(startG)] = Math.abs(startG.x - endG.x) + Math.abs(startG.z - endG.z);
        
        while(open.length > 0) {
            let cur = open.reduce((a,b) => (fScore[id(a)]||999) < (fScore[id(b)]||999) ? a : b);
            
            if(cur.x === endG.x && cur.z === endG.z) {
                // Reconstruct
                const path = [cur];
                while(cameFrom[id(cur)]) {
                    cur = cameFrom[id(cur)];
                    path.unshift(cur);
                }
                return path;
            }
            
            open.splice(open.indexOf(cur), 1);
            
            const neighbors = [
                {x:cur.x+1, z:cur.z}, {x:cur.x-1, z:cur.z},
                {x:cur.x, z:cur.z+1}, {x:cur.x, z:cur.z-1}
            ];
            
            for(let n of neighbors) {
                if(!world.isRoad(n.x, n.z)) continue;
                
                const tentativeG = (gScore[id(cur)]||999) + 1;
                if(tentativeG < (gScore[id(n)]||999)) {
                    cameFrom[id(n)] = cur;
                    gScore[id(n)] = tentativeG;
                    fScore[id(n)] = tentativeG + (Math.abs(n.x - endG.x) + Math.abs(n.z - endG.z));
                    if(!open.some(x => x.x === n.x && x.z === n.z)) open.push(n);
                }
            }
        }
        return [];
    }

    update(carPos, targetG, colorHex) {
        const startG = world.worldToGrid(carPos.x, carPos.z);
        
        // Only replan if path is empty or start moved significantly off path
        // For simplicity, we replan if start grid changes
        if(this.lastStart && this.lastStart.x === startG.x && this.lastStart.z === startG.z && this.mesh) {
            // Just animate texture
            this.tex.offset.y -= 0.02;
            return;
        }
        
        this.lastStart = startG;
        const path = this.findPath(startG, targetG);
        this.path = path;
        
        if(this.mesh) { scene.remove(this.mesh); this.mesh.geometry.dispose(); }
        
        if(path.length < 2) return;
        
        // Build Tube Geometry
        const points = path.map(p => {
            const w = world.gridToWorld(p.x, p.z);
            return new THREE.Vector3(w.x, 1.0, w.z); // Lift slightly above road
        });
        
        // Smooth curve
        const curve = new THREE.CatmullRomCurve3(points);
        curve.tension = 0.2;
        
        const tubeGeo = new THREE.TubeGeometry(curve, path.length * 6, 4, 4, false); // Thick tube
        // Flatten tube to look like a ribbon
        tubeGeo.scale(1, 0.1, 1);
        
        this.mat.color.setHex(colorHex);
        this.tex.repeat.set(1, path.length * 2);
        
        this.mesh = new THREE.Mesh(tubeGeo, this.mat);
        scene.add(this.mesh);
    }
}

function updatePhysics() {
    const dt = 1/60;
    
    // Inputs
    if(STATE.input.gas) STATE.car.speed += 0.03;
    else if(STATE.input.brake) STATE.car.speed -= 0.05;
    else STATE.car.speed *= 0.96; // Friction
    
    // Cap speed
    const maxSpeed = 1.2;
    STATE.car.speed = Math.max(-maxSpeed/2, Math.min(maxSpeed, STATE.car.speed));
    if(Math.abs(STATE.car.speed) < 0.01) STATE.car.speed = 0;
    
    // Turn
    if(Math.abs(STATE.car.speed) > 0.1) {
        const dir = STATE.car.speed > 0 ? 1 : -1;
        if(STATE.input.left) STATE.car.rot += 0.06 * dir;
        if(STATE.input.right) STATE.car.rot -= 0.06 * dir;
    }
    
    // Move
    const vx = Math.sin(STATE.car.rot) * STATE.car.speed;
    const vz = Math.cos(STATE.car.rot) * STATE.car.speed;
    
    const nextX = STATE.car.x + vx;
    const nextZ = STATE.car.z + vz;
    
    // Collision (Circle vs Grid)
    const radius = 1.5;
    
    // Check corners of bounding box approx
    let collided = false;
    
    // Simple check: center point grid cell
    const gx = Math.round(nextX / CFG.blockSize);
    const gz = Math.round(nextZ / CFG.blockSize);
    
    if(!world.isRoad(gx, gz)) {
        // Wall collision
        // Push back
        STATE.car.speed *= -0.2;
        collided = true;
        FEEDBACK.fail();
        AUDIO.playCrash();
    }
    
    if(!collided) {
        STATE.car.x = nextX;
        STATE.car.z = nextZ;
    }
    
    // Visual update
    carMesh.position.set(STATE.car.x, 0, STATE.car.z);
    carMesh.rotation.y = STATE.car.rot;
    
    // Tilt
    carMesh.rotation.z = (STATE.input.left?0.05:0) + (STATE.input.right?-0.05:0);
    carMesh.rotation.x = (STATE.input.gas?-0.02:0) + (STATE.input.brake?0.02:0);
}

/**
 * --- GAME LOGIC ---
 */
function setMission() {
    // Pick random spot
    let gx, gz;
    do {
        gx = Math.floor(Math.random() * CFG.gridSize);
        gz = Math.floor(Math.random() * CFG.gridSize);
    } while(!world.isRoad(gx, gz) || (Math.abs(gx*CFG.blockSize - STATE.car.x) < 100));
    
    const type = (!STATE.mission || STATE.mission.type === 'dropoff') ? 'pickup' : 'dropoff';
    
    STATE.mission = {
        type: type,
        gridPos: {x: gx, z: gz}
    };
    
    // UI
    const isPick = type === 'pickup';
    const color = isPick ? CFG.colors.gpsPickup : CFG.colors.gpsDropoff;
    const title = isPick ? "BOUQUET PICKUP" : "MOM DROP ZONE";
    const sub = isPick ? "Follow Blue Heart Beams" : "Follow Orange Heart Beams";
    
    document.getElementById('msg-t').innerText = title;
    document.getElementById('msg-s').innerText = sub;
    document.getElementById('msg-t').style.color = isPick ? '#00aaff' : '#ffaa00';
    FEEDBACK.mission();
    if (isPick) AUDIO.playPickup();
    else AUDIO.playDropoff();
    
    const msg = document.getElementById('center-msg');
    msg.classList.add('visible');
    setTimeout(() => msg.classList.remove('visible'), 3000);
    
    // Beacon
    const w = world.gridToWorld(gx, gz);
    beacon.position.set(w.x, 0.5, w.z);
    beacon.material.color.setHex(color);
    beaconIcon.children.forEach((child, index) => {
        if (child.material && index !== 2) child.material.color.setHex(color);
    });
    
    // Add time
    STATE.time = Math.min(60, STATE.time + 15);
}

function checkObjective() {
    if(!STATE.mission) return;
    
    const w = world.gridToWorld(STATE.mission.gridPos.x, STATE.mission.gridPos.z);
    const dx = STATE.car.x - w.x;
    const dz = STATE.car.z - w.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    if(dist < 8 && Math.abs(STATE.car.speed) < 0.2) {
        // Success
        FEEDBACK.success();
        if(STATE.mission.type === 'dropoff') {
            const earn = 50 + Math.floor(Math.random()*20);
            STATE.cash += earn;
            document.getElementById('ui-cash').innerText = STATE.cash;
            AUDIO.playDropoff();
        } else {
            AUDIO.playPickup();
        }
        setMission();
    }
}

function updateCamera() {
    // Ideal position
    const dist = 25;
    const height = 15;
    
    const angle = STATE.car.rot;
    const cx = STATE.car.x - Math.sin(angle) * dist;
    const cz = STATE.car.z - Math.cos(angle) * dist;
    
    const idealPos = new THREE.Vector3(cx, height, cz);
    const targetPos = new THREE.Vector3(STATE.car.x, 2, STATE.car.z);
    
    // Wall avoidance (Raycast)
    const dir = new THREE.Vector3().subVectors(idealPos, targetPos);
    const len = dir.length();
    dir.normalize();
    
    // Simple check: if idealPos is inside building block?
    // We just check if line of sight is blocked by checking grid cells along the line
    // Simplified: Check idealPos grid cell. If building, move closer.
    const g = world.worldToGrid(idealPos.x, idealPos.z);
    if(!world.isRoad(g.x, g.z)) {
        // Camera is inside a wall. Move overhead.
        idealPos.x = STATE.car.x;
        idealPos.z = STATE.car.z;
        idealPos.y = 35; // Top down
        camera.position.lerp(idealPos, 0.1);
        camera.lookAt(STATE.car.x, 0, STATE.car.z);
    } else {
        // Smooth follow
        camera.position.lerp(idealPos, 0.1);
        camera.lookAt(STATE.car.x, 2, STATE.car.z);
    }
}

function updateNavHint() {
    if(!STATE.mission || !gps.path || gps.path.length < 2) {
        document.getElementById('nav-hint').classList.remove('visible');
        return;
    }
    
    // Find next turn
    // Get vector to next path node
    const nextNode = gps.path[0]; // Path[0] is closest node
    const w = world.gridToWorld(nextNode.x, nextNode.z);
    
    // Vector car to node relative to car rotation
    const dx = w.x - STATE.car.x;
    const dz = w.z - STATE.car.z;
    
    // Rotate by -carRot
    const localX = dx * Math.cos(-STATE.car.rot) - dz * Math.sin(-STATE.car.rot);
    // const localZ = dx * Math.sin(-STATE.car.rot) + dz * Math.cos(-STATE.car.rot);
    
    const el = document.getElementById('nav-hint');
    
    if(Math.abs(localX) > 5) {
        el.innerText = localX > 0 ? '➡' : '⬅';
        el.classList.add('visible');
    } else {
        el.innerText = '⬆';
        // Only show up if we are far?
        // el.classList.remove('visible');
    }
}

/**
 * --- MAIN LOOP ---
 */
let lastTime = 0;
function loop(time) {
    requestAnimationFrame(loop);
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    
    if(STATE.screen === 'play') {
        updatePhysics();
        updateCamera();
        
        // GPS
        const color = (STATE.mission && STATE.mission.type === 'pickup') ? CFG.colors.gpsPickup : CFG.colors.gpsDropoff;
        gps.update({x: STATE.car.x, z: STATE.car.z}, STATE.mission ? STATE.mission.gridPos : {x:0,z:0}, color);
        
        // Beacon Animation
        beacon.rotation.y += dt;
        beaconIcon.rotation.y -= dt * 1.6;
        beaconIcon.position.y = 4 + Math.sin(time/200);
        
        checkObjective();
        // updateNavHint(); // Optional feature
        
        // Timer
        STATE.time -= dt;
        const tInt = Math.ceil(STATE.time);
        const tEl = document.getElementById('ui-time');
        tEl.innerText = tInt;
        if(STATE.time < 10) {
            tEl.style.color = '#e74c3c';
            AUDIO.playWarning();
            if(Math.floor(time/500)%2===0) tEl.style.transform = 'scale(1.2)';
            else tEl.style.transform = 'scale(1)';
        } else {
            tEl.style.color = 'white';
            tEl.style.transform = 'scale(1)';
        }
        
        if(STATE.time <= 0) {
            STATE.screen = 'over';
            document.getElementById('gameover-screen').classList.add('active');
            document.getElementById('final-score').innerText = STATE.cash;
            FEEDBACK.fail();
            AUDIO.pauseLoop();
            AUDIO.playGameOver();
        }
    }
    
    renderer.render(scene, camera);
}

/**
 * --- INPUTS & UI ---
 */
function bindBtn(id, key) {
    const el = document.getElementById(id);
    const on = (e) => {
        e.preventDefault();
        AUDIO.unlock();
        STATE.input[key] = true;
        el.classList.add('active');
        AUDIO.playUiClick();
    };
    const off = (e) => { e.preventDefault(); STATE.input[key] = false; el.classList.remove('active'); };
    
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off);
}

bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-gas', 'gas');
bindBtn('btn-brake', 'brake');

document.getElementById('btn-start').onclick = () => {
    AUDIO.unlock();
    AUDIO.playStart();
    AUDIO.startLoop();

    // Reset Game
    STATE.cash = 0;
    STATE.time = 60;
    document.getElementById('ui-cash').innerText = '0';
    
    // Find spawn
    let sx, sz;
    do { sx = Math.floor(Math.random()*CFG.gridSize); sz = Math.floor(Math.random()*CFG.gridSize); }
    while(!world.isRoad(sx, sz));
    const w = world.gridToWorld(sx, sz);
    STATE.car.x = w.x; STATE.car.z = w.z; STATE.car.rot = 0; STATE.car.speed = 0;
    
    setMission();
    
    STATE.screen = 'play';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
};

document.getElementById('btn-pause').onclick = () => {
    AUDIO.unlock();
    AUDIO.playPause();
    AUDIO.pauseLoop();
    STATE.screen = 'pause';
    document.getElementById('pause-screen').classList.add('active');
};

document.getElementById('btn-resume').onclick = () => {
    AUDIO.unlock();
    AUDIO.playResume();
    AUDIO.resumeLoop();
    STATE.screen = 'play';
    document.getElementById('pause-screen').classList.remove('active');
};

document.getElementById('btn-restart').onclick = document.getElementById('btn-start').onclick;
document.getElementById('btn-retry').onclick = document.getElementById('btn-start').onclick;

window.addEventListener('keydown', () => AUDIO.unlock(), { once: true });
window.addEventListener('pointerdown', () => AUDIO.unlock(), { once: true });

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start loop
loop(0);

</script>
