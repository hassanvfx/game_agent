<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hogwarts Dispatch: Curfew Courier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- [agent-note][world-design] resolved-font: title -> Cinzel, ui/body -> Rajdhani via catalogs/fonts.json -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-sky-top: #100720;
        --bg-sky-bottom: #2f1b58;
        --ground-deep: #171124;
        --road-plum: #2b2340;
        --parchment: rgba(245, 222, 170, 0.94);
        --parchment-soft: rgba(255, 242, 197, 0.78);
        --ink: #2b1b10;
        --panel: rgba(42, 24, 64, 0.82);
        --panel-border: rgba(255, 209, 102, 0.92);
        --panel-shadow: rgba(6, 3, 22, 0.5);
        --text-main: #fff8dc;
        --text-soft: #e7d3a1;
        --accent-cyan: #67e8f9;
        --accent-gold: #ffd166;
        --accent-pink: #c084fc;
        --gryffindor: #8b1e3f;
        --slytherin: #2d6a4f;
        --ravenclaw: #274c77;
        --hufflepuff: #f7b801;
        --danger: #ff6b6b;
        --go: #64f4a3;
    }

    /* --- CORE & RESET --- */
    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 8%, rgba(255, 248, 220, 0.16), transparent 9rem),
            radial-gradient(circle at 18% 22%, rgba(103, 232, 249, 0.16), transparent 10rem),
            radial-gradient(circle at 76% 18%, rgba(255, 209, 102, 0.12), transparent 8rem),
            linear-gradient(180deg, var(--bg-sky-top), var(--bg-sky-bottom) 62%, #120b22);
        touch-action: manipulation; user-select: none; -webkit-user-select: none;
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            radial-gradient(circle at 20% 15%, rgba(255,255,255,0.3), transparent 0.62rem),
            radial-gradient(circle at 78% 22%, rgba(255,255,255,0.18), transparent 0.5rem),
            radial-gradient(circle at 60% 10%, rgba(255,255,255,0.18), transparent 0.42rem),
            radial-gradient(circle at 32% 28%, rgba(255,255,255,0.14), transparent 0.34rem),
            radial-gradient(circle at 88% 38%, rgba(103,232,249,0.24), transparent 0.36rem),
            repeating-radial-gradient(circle at 52% 6%, rgba(255,255,255,0.12) 0 1px, transparent 1px 54px);
        opacity: 0.9;
        animation: starDrift 18s ease-in-out infinite alternate;
    }

    body::after {
        top: auto;
        height: 34vh;
        background:
            linear-gradient(transparent 0 50%, rgba(6, 3, 18, 0.34)),
            linear-gradient(90deg,
                transparent 0 3%,
                rgba(12, 8, 30, 0.72) 3% 7%,
                transparent 7% 10%,
                rgba(12, 8, 30, 0.72) 10% 13%,
                transparent 13% 18%,
                rgba(12, 8, 30, 0.7) 18% 26%,
                transparent 26% 31%,
                rgba(12, 8, 30, 0.72) 31% 36%,
                transparent 36% 41%,
                rgba(12, 8, 30, 0.7) 41% 48%,
                transparent 48% 55%,
                rgba(12, 8, 30, 0.72) 55% 61%,
                transparent 61% 68%,
                rgba(12, 8, 30, 0.7) 68% 77%,
                transparent 77% 83%,
                rgba(12, 8, 30, 0.72) 83% 88%,
                transparent 88%);
        clip-path: polygon(0 100%,0 76%,5% 76%,5% 50%,7% 50%,7% 76%,18% 76%,18% 42%,22% 42%,22% 76%,34% 76%,34% 56%,37% 56%,37% 76%,49% 76%,49% 36%,53% 36%,53% 76%,66% 76%,66% 58%,69% 58%,69% 76%,81% 76%,81% 44%,85% 44%,85% 76%,100% 76%,100% 100%);
        opacity: 0.55;
    }

    @keyframes starDrift {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(-1.2vw, 0.8vh, 0); }
    }

    #game-canvas { position: absolute; inset: 0; z-index: 1; display: block; pointer-events: none; }

    .magic-atmosphere {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
    }
    .magic-atmosphere span {
        position: absolute;
        display: block;
        opacity: 0.78;
        filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.55));
    }
    .candle {
        width: 5px; height: 20px;
        border-radius: 3px;
        background: linear-gradient(#fff8dc, #f3d28b);
        box-shadow: inset 0 -6px 0 rgba(80, 44, 18, 0.12);
        animation: candleFloat 8s ease-in-out infinite;
    }
    .candle::before {
        content: "";
        position: absolute;
        left: 50%; top: -8px;
        width: 8px; height: 10px;
        transform: translateX(-50%);
        border-radius: 50% 50% 48% 48%;
        background: radial-gradient(circle, #fff8dc 0 28%, #ffd166 42%, rgba(255, 149, 56, 0.16) 72%, transparent 73%);
    }
    .owl {
        color: rgba(255, 248, 220, 0.72);
        font-size: 18px;
        animation: owlGlide 17s linear infinite;
        filter: drop-shadow(0 0 4px rgba(103,232,249,0.35));
    }
    .spark {
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--accent-cyan);
        box-shadow: 0 0 12px var(--accent-cyan);
        animation: sparkRise 6s ease-in-out infinite;
    }
    .banner {
        width: 10px; height: 46px;
        border-radius: 2px 2px 8px 8px;
        background: linear-gradient(180deg, var(--gryffindor), var(--hufflepuff));
        box-shadow: 0 0 10px rgba(0,0,0,0.25);
        animation: bannerSway 7s ease-in-out infinite;
        transform-origin: top center;
    }
    .banner.alt { background: linear-gradient(180deg, var(--ravenclaw), var(--slytherin)); }
    .candle.c1 { left: 14%; top: 22%; animation-delay: -1s; }
    .candle.c2 { left: 74%; top: 16%; animation-delay: -4s; }
    .candle.c3 { left: 86%; top: 34%; animation-delay: -2s; }
    .candle.c4 { left: 38%; top: 12%; animation-delay: -5s; }
    .owl.o1 { left: -10%; top: 20%; }
    .spark.s1 { left: 24%; top: 70%; animation-delay: -0.5s; }
    .spark.s2 { left: 67%; top: 64%; animation-delay: -2.5s; }
    .spark.s3 { left: 83%; top: 72%; animation-delay: -4s; }
    .banner.b1 { left: 6%; top: 44%; }
    .banner.b2 { right: 6%; top: 48%; animation-delay: -3s; }

    @keyframes candleFloat {
        0%, 100% { transform: translateY(0); opacity: 0.55; }
        50% { transform: translateY(-16px); opacity: 0.88; }
    }
    @keyframes owlGlide {
        0% { transform: translateX(0) translateY(0) scaleX(1); opacity: 0; }
        10%, 84% { opacity: 0.74; }
        100% { transform: translateX(122vw) translateY(14px) scaleX(1); opacity: 0; }
    }
    @keyframes sparkRise {
        0% { transform: translateY(20px) scale(0.75); opacity: 0; }
        35%, 70% { opacity: 0.8; }
        100% { transform: translateY(-54px) scale(1.15); opacity: 0; }
    }
    @keyframes bannerSway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(3deg); }
    }

    /* --- UI LAYER --- */
    #ui-layer {
        position: absolute; inset: 0; z-index: 10; pointer-events: none;
        display: flex; flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* --- HUD --- */
    .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        gap: 10px;
        padding: 14px 16px; width: 100%; box-sizing: border-box;
        pointer-events: auto;
    }

    .panel-box {
        min-width: 84px;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 20% 10%, rgba(255,248,220,0.55), transparent 24%),
            linear-gradient(180deg, rgba(245, 222, 170, 0.92), rgba(210, 168, 94, 0.84));
        backdrop-filter: blur(8px);
        border-radius: 16px;
        padding: 8px 14px;
        border: 2px solid rgba(255, 209, 102, 0.95);
        box-shadow: 0 10px 22px -12px var(--panel-shadow), inset 0 0 0 1px rgba(43, 27, 16, 0.22), 0 0 16px rgba(103, 232, 249, 0.12);
        display: flex; flex-direction: column; align-items: center;
    }
    .panel-box::after {
        content: "✦";
        position: absolute;
        right: 6px; top: 3px;
        color: rgba(43, 27, 16, 0.22);
        font-size: 13px;
    }
    .panel-label {
        font-size: 11px;
        color: rgba(43, 27, 16, 0.78);
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.11em;
    }
    .panel-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1;
        text-shadow: 0 1px 0 rgba(255,255,255,0.45);
    }

    .nav-arrow {
        position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
        width: 82px; height: 82px;
        background: radial-gradient(circle, rgba(103, 232, 249, 0.34), rgba(18, 14, 47, 0.88));
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; border: 2px solid rgba(255,248,220,0.9);
        box-shadow: 0 0 22px rgba(103, 232, 249, 0.36), inset 0 0 18px rgba(255,255,255,0.08);
        opacity: 0; transition: opacity 0.3s;
    }
    .nav-arrow.visible { opacity: 1; }

    /* --- CONTROLS --- */
    .controls-area {
        margin-top: auto; padding: 20px;
        display: flex; justify-content: space-between; align-items: flex-end;
        width: 100%; box-sizing: border-box;
        pointer-events: none;
    }
    .btn-group { display: flex; gap: 12px; pointer-events: auto; }

    .c-btn {
        background:
            radial-gradient(circle at 35% 25%, rgba(255,248,220,0.28), transparent 24%),
            linear-gradient(180deg, rgba(43, 30, 77, 0.86), rgba(14, 10, 37, 0.74));
        backdrop-filter: blur(8px);
        border: 2px solid rgba(255, 209, 102, 0.72);
        border-radius: 20px;
        color: var(--text-main);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 700;
        font-family: 'Rajdhani', system-ui, sans-serif;
        box-shadow: 0 6px 0 rgba(8, 5, 28, 0.5), 0 0 18px rgba(103, 232, 249, 0.16), inset 0 0 16px rgba(103, 232, 249, 0.1);
        transition: transform 0.1s, background 0.1s, top 0.1s, box-shadow 0.1s;
        touch-action: none; position: relative;
    }
    .c-btn::after {
        content: "";
        position: absolute;
        inset: 9px;
        border-radius: inherit;
        border: 1px solid rgba(255, 248, 220, 0.14);
        pointer-events: none;
    }
    .c-btn:active, .c-btn.active {
        transform: translateY(4px);
        box-shadow: 0 0 0 rgba(0,0,0,0), 0 0 20px rgba(103,232,249,0.36);
        background: rgba(255,255,255,0.28);
        border-color: var(--text-main);
    }

    .btn-steer { width: 80px; height: 80px; border-radius: 50%; }
    .btn-pedal { width: 75px; height: 100px; flex-direction: column; gap: 4px; }

    .bg-green { background: linear-gradient(180deg, rgba(100, 244, 163, 0.42), rgba(32, 109, 72, 0.34)); border-color: #64f4a3; }
    .bg-red { background: linear-gradient(180deg, rgba(255, 107, 107, 0.42), rgba(142, 34, 34, 0.3)); border-color: #ff9b9b; }

    /* --- SCREENS --- */
    .screen {
        position: absolute; inset: 0; z-index: 50;
        background:
            radial-gradient(circle at 50% 18%, rgba(103, 232, 249, 0.18), transparent 28%),
            linear-gradient(180deg, rgba(15, 10, 41, 0.9), rgba(7, 4, 20, 0.94));
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.3s;
        text-align: center; padding: 20px;
        box-sizing: border-box;
    }
    .screen::before {
        content: "✦  ✧  ✦";
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        color: rgba(255, 209, 102, 0.52);
        letter-spacing: 1.3rem;
        font-size: 18px;
        pointer-events: none;
    }
    .screen.active { opacity: 1; pointer-events: auto; touch-action: manipulation; }

    h1 {
        font-family: 'Cinzel', Georgia, serif;
        font-size: clamp(34px, 10vw, 54px);
        letter-spacing: 0.06em;
        color: var(--text-main);
        text-shadow: 0 5px 0 rgba(10, 7, 31, 0.6), 0 0 24px rgba(103, 232, 249, 0.2);
        margin: 0 0 18px 0; line-height: 0.95;
    }
    .card {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 25% 12%, rgba(255,248,220,0.34), transparent 26%),
            linear-gradient(180deg, rgba(245, 222, 170, 0.96), rgba(216, 174, 101, 0.92));
        color: var(--ink);
        padding: 22px 20px; border-radius: 22px;
        width: 100%; max-width: 340px;
        border: 2px solid rgba(255, 209, 102, 0.98);
        box-shadow: 0 18px 34px rgba(0,0,0,0.34), inset 0 0 0 1px rgba(43, 27, 16, 0.18), 0 0 22px rgba(103, 232, 249, 0.14);
    }
    .card::before {
        content: "";
        position: absolute;
        inset: 9px;
        border: 1px solid rgba(43, 27, 16, 0.18);
        border-radius: 16px;
        pointer-events: none;
    }
    .big-btn {
        position: relative;
        background:
            radial-gradient(circle at 30% 20%, rgba(255,255,255,0.42), transparent 26%),
            linear-gradient(180deg, var(--accent-gold), #ff9f43);
        color: #3b2102;
        font-family: 'Cinzel', Georgia, serif;
        letter-spacing: 0.08em;
        font-size: 22px; font-weight: 700;
        border: none; padding: 13px 28px;
        border-radius: 999px;
        cursor: pointer; margin-top: 18px;
        box-shadow: 0 6px 0 #b85e12, 0 0 18px rgba(255, 213, 79, 0.32);
        transition: transform 0.1s;
        width: 100%;
        min-height: 56px;
        touch-action: manipulation;
    }
    .big-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #b85e12; }

    /* --- NOTIFICATIONS --- */
    #center-msg {
        position: absolute; top: 35%; left: 0; right: 0;
        text-align: center; pointer-events: none;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        opacity: 0; transform: scale(0.5);
    }
    #center-msg.visible { opacity: 1; transform: scale(1); }
    .msg-bubble {
        display: inline-block;
        background:
            radial-gradient(circle at 25% 18%, rgba(255,255,255,0.6), transparent 28%),
            linear-gradient(180deg, rgba(245,222,170,0.97), rgba(219,177,99,0.96));
        color: var(--ink);
        padding: 10px 24px; border-radius: 999px;
        box-shadow: 0 10px 22px rgba(0,0,0,0.3), 0 0 18px rgba(103,232,249,0.16);
        border: 3px solid var(--accent-gold);
    }
    .msg-title { font-family: 'Cinzel', Georgia, serif; font-size: 26px; font-weight: 700; letter-spacing: 0.08em; }
    .msg-sub { font-size: 15px; color: rgba(43, 27, 16, 0.78); font-weight: 700; }

    .mission-copy {
        position: relative;
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink);
        margin: 0;
        font-weight: 600;
    }

    .title-sub {
        display: inline-block;
        margin-top: 8px;
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-size: 16px;
        color: var(--accent-cyan);
        letter-spacing: 0.14em;
    }

    .feedback-gif {
        position: absolute;
        right: 14px;
        width: 82px;
        border-radius: 16px;
        border: 2px solid rgba(255, 209, 102, 0.58);
        box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 14px rgba(103,232,249,0.12);
        object-fit: cover;
        opacity: 0;
        transform: translateY(10px) scale(0.92);
        transition: opacity 0.22s ease, transform 0.22s ease;
        pointer-events: none;
        z-index: 14;
        background: rgba(16, 11, 47, 0.72);
    }
    .feedback-gif.visible {
        opacity: 0.78;
        transform: translateY(0) scale(1);
    }
    #mission-gif {
        top: 104px;
        height: 82px;
    }
    #event-gif {
        top: 194px;
        height: 76px;
    }

    @media (max-width: 640px) {
        .hud-top { padding: 12px; gap: 8px; }
        .panel-box { min-width: 74px; padding: 8px 10px; }
        .panel-val { font-size: 18px; }
        .controls-area { padding: 16px; }
        .btn-group { gap: 10px; }
        .btn-steer { width: 72px; height: 72px; }
        .btn-pedal { width: 68px; height: 94px; }
        .c-btn { font-size: 24px; }
        #btn-pause { width: 48px !important; height: 48px !important; }
        .card { max-width: 320px; padding: 20px 18px; }
        .mission-copy { font-size: 14px; }
        .msg-title { font-size: 23px; }
        .msg-sub { font-size: 13px; }
        .magic-atmosphere .banner { opacity: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
        body::before,
        .magic-atmosphere span {
            animation-duration: 1ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>
</head>
<body>

<div id="game-canvas"></div>
<div class="magic-atmosphere" aria-hidden="true">
    <span class="candle c1"></span>
    <span class="candle c2"></span>
    <span class="candle c3"></span>
    <span class="candle c4"></span>
    <span class="owl o1">⌁</span>
    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3"></span>
    <span class="banner b1"></span>
    <span class="banner b2 alt"></span>
</div>

<div id="ui-layer">
    <!-- Top HUD -->
    <div class="hud-top">
        <div class="panel-box">
            <div class="panel-label">House Points</div>
            <div class="panel-val"><span id="ui-cash">0</span></div>
        </div>
        
        <div class="panel-box" id="timer-box">
            <div class="panel-label">Curfew Clock</div>
            <div class="panel-val" id="ui-time">60</div>
        </div>

        <button id="btn-pause" class="c-btn" style="width:50px; height:50px; font-size:20px; border-radius:12px;">II</button>
    </div>

    <!-- Direction Hint -->
    <div id="nav-hint" class="nav-arrow">⬆</div>

    <!-- Center Message -->
    <div id="center-msg">
        <div class="msg-bubble">
            <div class="msg-title" id="msg-t">SUMMONS</div>
            <div class="msg-sub" id="msg-s">Follow Blue Spell Trail</div>
        </div>
    </div>
    <!-- [agent-note][stage3] resolved-gif: mission and event feedback overlays use catalogs/gifs.json and stay off the playfield -->
    <img id="mission-gif" class="feedback-gif" alt="dispatch reaction overlay">
    <img id="event-gif" class="feedback-gif" alt="event reaction overlay">

    <!-- Controls -->
    <div class="controls-area">
        <div class="btn-group">
            <div id="btn-left" class="c-btn btn-steer">◀</div>
            <div id="btn-right" class="c-btn btn-steer">▶</div>
        </div>
        <div class="btn-group">
            <div id="btn-brake" class="c-btn btn-pedal bg-red">
                <span style="font-size:16px">STOP</span>
            </div>
            <div id="btn-gas" class="c-btn btn-pedal bg-green">
                <span>▲</span>
                <span style="font-size:16px">GO</span>
            </div>
        </div>
    </div>
</div>

<!-- Start Screen -->
<div id="start-screen" class="screen active">
    <h1>HOGWARTS<br><span class="title-sub">DISPATCH</span></h1>
    <div class="card">
        <p class="mission-copy">
            🪄 Pilot the enchanted cab<br>
            🔵 Blue trail: answer summons<br>
            🟠 Gold trail: deliver seal<br>
            ⏱ Earn House Points before curfew
        </p>
        <button id="btn-start" class="big-btn">START</button>
    </div>
</div>

<!-- Pause Screen -->
<div id="pause-screen" class="screen">
    <h1>PAUSED</h1>
    <div class="card">
        <button id="btn-resume" class="big-btn" style="background:#2d6a4f; color:#fff8dc; box-shadow:0 6px 0 #1b4332;">RESUME</button>
        <button id="btn-restart" class="big-btn" style="background:#8b1e3f; color:#fff8dc; box-shadow:0 6px 0 #5f1028; margin-top:15px;">RESTART</button>
    </div>
</div>

<!-- Game Over -->
<div id="gameover-screen" class="screen">
    <h1 style="color:#ff6b6b;">CURFEW</h1>
    <div class="card">
        <div style="font-size:18px; color:#2b1b10; margin-bottom:8px; font-weight:700;">House Points</div>
        <div style="font-size:58px; font-weight:bold; color:#8b1e3f; margin-bottom:18px;"><span id="final-score">0</span></div>
        <button id="btn-retry" class="big-btn">TRY AGAIN</button>
    </div>
</div>

<script type="module">
import * as THREE from './assets/unpkg.com/three_0.160.0/build/three.module.js';

/** 
 * --- CONFIGURATION & CONSTANTS ---
 */
const CFG = {
    gridSize: 16,
    blockSize: 40,
    roadWidth: 22,
    colors: {
        sky: 0x100720,
        ground: 0x171124,
        road: 0x2b2340,
        sidewalk: 0xffd166,
        building: [0x5b4636, 0x6b4f2a, 0x2d6a4f, 0x274c77, 0x8b1e3f],
        gpsPickup: 0x42d7ff,
        gpsDropoff: 0xffc857,
        parchmentLine: 0xf5deaa,
        candleGold: 0xffd166,
        castleStone: 0x6f6478
    }
};

const STATE = {
    screen: 'start',

/**
 * --- AUDIO SYSTEM ---
 */
const AUDIO = {
    unlocked: false,
    master: 0.5,
    lastPlayAt: {},
    pools: new Map(),
    loops: {},

    ensureLoop(name, src, volume = 0.24) {
        if (this.loops[name]) return this.loops[name];
        const audio = new Audio(src);
        audio.loop = true;
        audio.preload = 'auto';
        audio.volume = volume * this.master;
        this.loops[name] = audio;
        return audio;
    },

    getPool(src) {
        if (!this.pools.has(src)) this.pools.set(src, []);
        return this.pools.get(src);
    },

    unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        this.ensureLoop('bgm', MEDIA.audio.bgm);
    },

    async play(src, { volume = 0.5, cooldown = 0, key = src } = {}) {
        if (!this.unlocked) return;
        const now = performance.now();
        if (cooldown && this.lastPlayAt[key] && now - this.lastPlayAt[key] < cooldown) return;
        this.lastPlayAt[key] = now;

        const pool = this.getPool(src);
        let audio = pool.find((item) => item.paused || item.ended);
        if (!audio) {
            audio = new Audio(src);
            audio.preload = 'auto';
            pool.push(audio);
        }

        try {
            audio.pause();
            audio.currentTime = 0;
            audio.volume = Math.max(0, Math.min(1, volume * this.master));
            await audio.play();
        } catch (err) {}
    },

    playUiClick() {
        return this.play(MEDIA.audio.uiClick, { volume: 0.32, cooldown: 70, key: 'uiClick' });
    },

    playPickup() {
        return this.play(MEDIA.audio.pickup, { volume: 0.5, cooldown: 220, key: 'pickup' });
    },

    playDropoff() {
        return this.play(MEDIA.audio.dropoff, { volume: 0.52, cooldown: 260, key: 'dropoff' });
    },

    playCrash() {
        return this.play(MEDIA.audio.crash, { volume: 0.42, cooldown: 180, key: 'crash' });
    },

    playWarning() {
        return this.play(MEDIA.audio.warning, { volume: 0.35, cooldown: 850, key: 'warning' });
    },

    playPause() {
        return this.play(MEDIA.audio.pause, { volume: 0.4, cooldown: 180, key: 'pause' });
    },

    playResume() {
        return this.play(MEDIA.audio.resume, { volume: 0.4, cooldown: 180, key: 'resume' });
    },

    playStart() {
        return this.play(MEDIA.audio.start, { volume: 0.48, cooldown: 250, key: 'start' });
    },

    playGameOver() {
        return this.play(MEDIA.audio.gameOver, { volume: 0.5, cooldown: 500, key: 'gameOver' });
    },

    async startLoop(name = 'bgm') {
        if (!this.unlocked) return;
        const audio = this.ensureLoop(name, MEDIA.audio.bgm);
        audio.volume = 0.22 * this.master;
        try {
            await audio.play();
        } catch (err) {}
    },

    pauseLoop(name = 'bgm') {
        const audio = this.loops[name];
        if (!audio) return;
        audio.pause();
    },

    resumeLoop(name = 'bgm') {
        if (!this.unlocked) return;
        const audio = this.loops[name];
        if (!audio) return;
        audio.play().catch(() => {});
    }
};

const world = {

        // Generate Grid (Manhattan style)
        for(let x=0; x<this.width; x++) {
            this.grid[x] = [];
            for(let z=0; z<this.height; z++) {
                // Perimeter is road
                if(x===0 || x===this.width-1 || z===0 || z===this.height-1) {
                    this.grid[x][z] = 0;
                } 
                // Every 3rd block is road
                else if(x%3 === 0 || z%3 === 0) {
                    this.grid[x][z] = 0;
                } else {
                    this.grid[x][z] = 1;
                }
            }
        }
        this.buildMesh();
    },

    buildMesh() {
        const geoBuildings = [];
        const geoRoads = [];
        const geoSidewalks = [];

        const boxGeo = new THREE.BoxGeometry(1,1,1);
        const planeGeo = new THREE.PlaneGeometry(1,1);
        planeGeo.rotateX(-Math.PI/2);

        // Helper to add instance
        const addMesh = (arr, x, y, z, sx, sy, sz, col) => {
            const mesh = new THREE.Mesh(boxGeo);
            mesh.position.set(x, y, z);
            mesh.scale.set(sx, sy, sz);
            mesh.updateMatrix();
            arr.push(mesh); // We'll just use InstancedMesh for performance
        };

        // We will use InstancedMesh for buildings
        let bCount = 0;
        for(let x=0; x<this.width; x++) for(let z=0; z<this.height; z++) if(this.grid[x][z]===1) bCount++;
        
        const matBuilding = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.05 });
        const iMeshBuilding = new THREE.InstancedMesh(boxGeo, matBuilding, bCount);
        iMeshBuilding.castShadow = true;
        iMeshBuilding.receiveShadow = true;
        
        const dummy = new THREE.Object3D();
        let idx = 0;

        // Ground Plane
        const groundSize = this.width * CFG.blockSize;
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(groundSize, groundSize),
            new THREE.MeshStandardMaterial({ color: CFG.colors.ground })
        );
        ground.rotation.x = -Math.PI/2;
        ground.position.set(groundSize/2 - CFG.blockSize/2, -0.1, groundSize/2 - CFG.blockSize/2);
        ground.receiveShadow = true;

        // Roads & Sidewalks (Texture based would be better, but we use simple geometry strips)

        const charmLineMat = new THREE.MeshBasicMaterial({ color: CFG.colors.parchmentLine, transparent: true, opacity: 0.34 });
        
        for(let x=0; x<this.width; x++) {
            for(let z=0; z<this.height; z++) {
                const wx = x * CFG.blockSize;
                const wz = z * CFG.blockSize;

                if(this.grid[x][z] === 1) {
                    // Building
                    const h = 10 + Math.random() * 30;
                    dummy.position.set(wx, h/2, wz);
                    dummy.scale.set(CFG.blockSize - 4, h, CFG.blockSize - 4);
                    dummy.updateMatrix();
                    iMeshBuilding.setMatrixAt(idx, dummy.matrix);
                    
                    // Color variation
                    const col = new THREE.Color(CFG.colors.building[Math.floor(Math.random()*CFG.colors.building.length)]);
                    iMeshBuilding.setColorAt(idx, col);
                    idx++;
                } else {
                    // Road
                    const road = new THREE.Mesh(new THREE.PlaneGeometry(CFG.blockSize, CFG.blockSize), roadMat);
                    road.rotation.x = -Math.PI/2;
                    road.position.set(wx, 0.05, wz);
                    road.receiveShadow = true;
                    scene.add(road);
                    
                    // Markings (Simple dashed line)
                    const dash = new THREE.Mesh(new THREE.PlaneGeometry(2, CFG.blockSize/2), charmLineMat);
                    dash.rotation.x = -Math.PI/2;
                    dash.position.set(wx, 0.06, wz);

                    // Cross dash

                    dash2.rotation.x = -Math.PI/2;
                    dash2.position.set(wx, 0.06, wz);
                    scene.add(dash2);
                }
            }
        }
        scene.add(iMeshBuilding);
    },

    isRoad(x, z) {
        if(x<0 || x>=this.width || z<0 || z>=this.height) return false;
        return this.grid[x][z] === 0;
    },
    
    worldToGrid(x, z) {
        return { x: Math.round(x/CFG.blockSize), z: Math.round(z/CFG.blockSize) };
    },

    gridToWorld(gx, gz) {
        return { x: gx*CFG.blockSize, z: gz*CFG.blockSize };
    }
};

/**
 * --- GPS SYSTEM ---
 */
class GPS {
    constructor() {
        this.path = [];
        this.mesh = null;
        
        // Create Animated Arrow Texture
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        
        // Draw arrows
        for(let i=0; i<4; i++) {
            const y = i * 64;
            ctx.beginPath();
            ctx.moveTo(10, y + 50);
            ctx.lineTo(32, y + 10);
            ctx.lineTo(54, y + 50);
            ctx.lineTo(32, y + 35);
            ctx.fill();
        }
        
        this.tex = new THREE.CanvasTexture(canvas);
        this.tex.wrapS = THREE.RepeatWrapping;
        this.tex.wrapT = THREE.RepeatWrapping;
        this.tex.repeat.set(1, 10); // Stretch along path
        
        this.mat = new THREE.MeshBasicMaterial({ 
            map: this.tex, 
            transparent: true, 
            opacity: 0.9,
            side: THREE.DoubleSide,
            color: 0xffffff,
            depthWrite: false
        });
    }

    findPath(startG, endG) {
        // A* Algorithm
        const open = [startG];
        const cameFrom = {};
        const gScore = {};
        const fScore = {};
        
        const id = (n) => `${n.x},${n.z}`;
        
        gScore[id(startG)] = 0;
        fScore[id(startG)] = Math.abs(startG.x - endG.x) + Math.abs(startG.z - endG.z);
        
        while(open.length > 0) {
            let cur = open.reduce((a,b) => (fScore[id(a)]||999) < (fScore[id(b)]||999) ? a : b);
            
            if(cur.x === endG.x && cur.z === endG.z) {
                // Reconstruct
                const path = [cur];
                while(cameFrom[id(cur)]) {
                    cur = cameFrom[id(cur)];
                    path.unshift(cur);
                }
                return path;
            }
            
            open.splice(open.indexOf(cur), 1);
            
            const neighbors = [
                {x:cur.x+1, z:cur.z}, {x:cur.x-1, z:cur.z},
                {x:cur.x, z:cur.z+1}, {x:cur.x, z:cur.z-1}
            ];
            
            for(let n of neighbors) {
                if(!world.isRoad(n.x, n.z)) continue;
                
                const tentativeG = (gScore[id(cur)]||999) + 1;
                if(tentativeG < (gScore[id(n)]||999)) {
                    cameFrom[id(n)] = cur;
                    gScore[id(n)] = tentativeG;
                    fScore[id(n)] = tentativeG + (Math.abs(n.x - endG.x) + Math.abs(n.z - endG.z));
                    if(!open.some(x => x.x === n.x && x.z === n.z)) open.push(n);
                }
            }
        }
        return [];
    }

    update(carPos, targetG, colorHex) {
        const startG = world.worldToGrid(carPos.x, carPos.z);
        
        // Only replan if path is empty or start moved significantly off path
        // For simplicity, we replan if start grid changes
        if(this.lastStart && this.lastStart.x === startG.x && this.lastStart.z === startG.z && this.mesh) {
            // Just animate texture
            this.tex.offset.y -= 0.02;
            return;
        }
        
        this.lastStart = startG;
        const path = this.findPath(startG, targetG);
        this.path = path;
        
        if(this.mesh) { scene.remove(this.mesh); this.mesh.geometry.dispose(); }
        
        if(path.length < 2) return;
        
        // Build Tube Geometry
        const points = path.map(p => {
            const w = world.gridToWorld(p.x, p.z);
            return new THREE.Vector3(w.x, 1.0, w.z); // Lift slightly above road
        });
        
        // Smooth curve
        const curve = new THREE.CatmullRomCurve3(points);
        curve.tension = 0.2;
        
        const tubeGeo = new THREE.TubeGeometry(curve, path.length * 6, 4, 4, false); // Thick tube
        // Flatten tube to look like a ribbon
        tubeGeo.scale(1, 0.1, 1);
        
        this.mat.color.setHex(colorHex);
        this.tex.repeat.set(1, path.length * 2);
        
        this.mesh = new THREE.Mesh(tubeGeo, this.mat);
        scene.add(this.mesh);
    }
}

function updatePhysics() {
    const dt = 1/60;
    
    // Inputs
    if(STATE.input.gas) STATE.car.speed += 0.03;
    else if(STATE.input.brake) STATE.car.speed -= 0.05;
    else STATE.car.speed *= 0.96; // Friction
    
    // Cap speed
    const maxSpeed = 1.2;
    STATE.car.speed = Math.max(-maxSpeed/2, Math.min(maxSpeed, STATE.car.speed));
    if(Math.abs(STATE.car.speed) < 0.01) STATE.car.speed = 0;
    
    // Turn
    if(Math.abs(STATE.car.speed) > 0.1) {
        const dir = STATE.car.speed > 0 ? 1 : -1;
        if(STATE.input.left) STATE.car.rot += 0.06 * dir;
        if(STATE.input.right) STATE.car.rot -= 0.06 * dir;
    }
    
    // Move
    const vx = Math.sin(STATE.car.rot) * STATE.car.speed;
    const vz = Math.cos(STATE.car.rot) * STATE.car.speed;
    
    const nextX = STATE.car.x + vx;
    const nextZ = STATE.car.z + vz;
    
    // Collision (Circle vs Grid)
    const radius = 1.5;
    
    // Check corners of bounding box approx
    let collided = false;
    
    // Simple check: center point grid cell
    const gx = Math.round(nextX / CFG.blockSize);
    const gz = Math.round(nextZ / CFG.blockSize);
    
    if(!world.isRoad(gx, gz)) {
        // Wall collision
        // Push back
        STATE.car.speed *= -0.2;
        collided = true;
        FEEDBACK.fail();
        AUDIO.playCrash();
    }
    
    if(!collided) {
        STATE.car.x = nextX;
        STATE.car.z = nextZ;
    }
    
    // Visual update
    carMesh.position.set(STATE.car.x, 0, STATE.car.z);
    carMesh.rotation.y = STATE.car.rot;
    
    // Tilt
    carMesh.rotation.z = (STATE.input.left?0.05:0) + (STATE.input.right?-0.05:0);
    carMesh.rotation.x = (STATE.input.gas?-0.02:0) + (STATE.input.brake?0.02:0);
}

/**
 * --- GAME LOGIC ---
 */
function setMission() {
    // Pick random spot
    let gx, gz;
    do {
        gx = Math.floor(Math.random() * CFG.gridSize);
        gz = Math.floor(Math.random() * CFG.gridSize);
    } while(!world.isRoad(gx, gz) || (Math.abs(gx*CFG.blockSize - STATE.car.x) < 100));
    
    const type = (!STATE.mission || STATE.mission.type === 'dropoff') ? 'pickup' : 'dropoff';
    
    STATE.mission = {
        type: type,
        gridPos: {x: gx, z: gz}
    };
    
    // UI
    const isPick = type === 'pickup';
    const color = isPick ? CFG.colors.gpsPickup : CFG.colors.gpsDropoff;
    const title = isPick ? "SUMMONS" : "DELIVERY SEAL";
    const sub = isPick ? "Follow Blue Spell Trail" : "Follow Gold Spell Trail";
    
    document.getElementById('msg-t').innerText = title;
    document.getElementById('msg-s').innerText = sub;
    document.getElementById('msg-t').style.color = isPick ? '#00aaff' : '#ffaa00';
    FEEDBACK.mission();
    if (isPick) AUDIO.playPickup();
    else AUDIO.playDropoff();
    
    const msg = document.getElementById('center-msg');
    msg.classList.add('visible');
    setTimeout(() => msg.classList.remove('visible'), 3000);
    
    // Beacon
    const w = world.gridToWorld(gx, gz);
    beacon.position.set(w.x, 0.5, w.z);
    beacon.material.color.setHex(color);
    beaconIcon.material.color.setHex(color);
    beaconRing.material.color.setHex(color);
    beaconRuneRing.material.color.setHex(color);
    
    // Add time
    STATE.time = Math.min(60, STATE.time + 15);
}

function checkObjective() {
    if(!STATE.mission) return;
    
    const w = world.gridToWorld(STATE.mission.gridPos.x, STATE.mission.gridPos.z);
    const dx = STATE.car.x - w.x;
    const dz = STATE.car.z - w.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    if(dist < 8 && Math.abs(STATE.car.speed) < 0.2) {
        // Success
        FEEDBACK.success();
        if(STATE.mission.type === 'dropoff') {
            const earn = 50 + Math.floor(Math.random()*20);
            STATE.cash += earn;
            document.getElementById('ui-cash').innerText = STATE.cash;
            AUDIO.playDropoff();
        } else {
            AUDIO.playPickup();
        }
        setMission();
    }
}

function updateCamera() {
    // Ideal position
    const dist = 25;
    const height = 15;
    
    const angle = STATE.car.rot;
    const cx = STATE.car.x - Math.sin(angle) * dist;
    const cz = STATE.car.z - Math.cos(angle) * dist;
    
    const idealPos = new THREE.Vector3(cx, height, cz);
    const targetPos = new THREE.Vector3(STATE.car.x, 2, STATE.car.z);
    
    // Wall avoidance (Raycast)
    const dir = new THREE.Vector3().subVectors(idealPos, targetPos);
    const len = dir.length();
    dir.normalize();
    
    // Simple check: if idealPos is inside building block?
    // We just check if line of sight is blocked by checking grid cells along the line
    // Simplified: Check idealPos grid cell. If building, move closer.
    const g = world.worldToGrid(idealPos.x, idealPos.z);
    if(!world.isRoad(g.x, g.z)) {
        // Camera is inside a wall. Move overhead.
        idealPos.x = STATE.car.x;
        idealPos.z = STATE.car.z;
        idealPos.y = 35; // Top down
        camera.position.lerp(idealPos, 0.1);
        camera.lookAt(STATE.car.x, 0, STATE.car.z);
    } else {
        // Smooth follow
        camera.position.lerp(idealPos, 0.1);
        camera.lookAt(STATE.car.x, 2, STATE.car.z);
    }
}

function updateNavHint() {
    if(!STATE.mission || !gps.path || gps.path.length < 2) {
        document.getElementById('nav-hint').classList.remove('visible');
        return;
    }
    
    // Find next turn
    // Get vector to next path node
    const nextNode = gps.path[0]; // Path[0] is closest node
    const w = world.gridToWorld(nextNode.x, nextNode.z);
    
    // Vector car to node relative to car rotation
    const dx = w.x - STATE.car.x;
    const dz = w.z - STATE.car.z;
    
    // Rotate by -carRot
    const localX = dx * Math.cos(-STATE.car.rot) - dz * Math.sin(-STATE.car.rot);
    // const localZ = dx * Math.sin(-STATE.car.rot) + dz * Math.cos(-STATE.car.rot);
    
    const el = document.getElementById('nav-hint');
    
    if(Math.abs(localX) > 5) {
        el.innerText = localX > 0 ? '➡' : '⬅';
        el.classList.add('visible');
    } else {
        el.innerText = '⬆';
        // Only show up if we are far?
        // el.classList.remove('visible');
    }
}

/**
 * --- MAIN LOOP ---
 */
let lastTime = 0;
function loop(time) {
    requestAnimationFrame(loop);
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    
    if(STATE.screen === 'play') {
        updatePhysics();
        updateCamera();
        
        // GPS
        const color = (STATE.mission && STATE.mission.type === 'pickup') ? CFG.colors.gpsPickup : CFG.colors.gpsDropoff;
        gps.update({x: STATE.car.x, z: STATE.car.z}, STATE.mission ? STATE.mission.gridPos : {x:0,z:0}, color);
        
        // Beacon Animation
        beacon.rotation.y += dt;
        beaconIcon.position.y = 4 + Math.sin(time/200);
        beaconRing.rotation.z += dt * 1.4;
        beaconRuneRing.rotation.z -= dt * 1.9;
        signSpark.position.y = 2.28 + Math.sin(time / 220) * 0.08;
        starField.rotation.y += dt * 0.004;
        
        checkObjective();
        // updateNavHint(); // Optional feature
        
        // Timer
        STATE.time -= dt;
        const tInt = Math.ceil(STATE.time);
        const tEl = document.getElementById('ui-time');
        tEl.innerText = tInt;
        if(STATE.time < 10) {
            tEl.style.color = '#e74c3c';
            AUDIO.playWarning();
            if(Math.floor(time/500)%2===0) tEl.style.transform = 'scale(1.2)';
            else tEl.style.transform = 'scale(1)';
        } else {
            tEl.style.color = '#2b1b10';
            tEl.style.transform = 'scale(1)';
        }
        
        if(STATE.time <= 0) {
            STATE.screen = 'over';
            document.getElementById('gameover-screen').classList.add('active');
            document.getElementById('final-score').innerText = STATE.cash;
            FEEDBACK.fail();
            AUDIO.pauseLoop();
            AUDIO.playGameOver();
        }
    }
    
    renderer.render(scene, camera);
}

/**
 * --- INPUTS & UI ---
 */
function bindBtn(id, key) {
    const el = document.getElementById(id);
    const on = (e) => {
        e.preventDefault();
        AUDIO.unlock();
        STATE.input[key] = true;
        el.classList.add('active');
        AUDIO.playUiClick();
    };
    const off = (e) => { e.preventDefault(); STATE.input[key] = false; el.classList.remove('active'); };
    
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off);
}

bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-gas', 'gas');
bindBtn('btn-brake', 'brake');

document.getElementById('btn-start').onclick = () => {
    AUDIO.unlock();
    AUDIO.playStart();
    AUDIO.startLoop();

    // Reset Game
    STATE.cash = 0;
    STATE.time = 60;
    document.getElementById('ui-cash').innerText = '0';
    
    // Find spawn
    let sx, sz;
    do { sx = Math.floor(Math.random()*CFG.gridSize); sz = Math.floor(Math.random()*CFG.gridSize); }
    while(!world.isRoad(sx, sz));
    const w = world.gridToWorld(sx, sz);
    STATE.car.x = w.x; STATE.car.z = w.z; STATE.car.rot = 0; STATE.car.speed = 0;
    
    setMission();
    
    STATE.screen = 'play';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
};

document.getElementById('btn-pause').onclick = () => {
    AUDIO.unlock();
    AUDIO.playPause();
    AUDIO.pauseLoop();
    STATE.screen = 'pause';
    document.getElementById('pause-screen').classList.add('active');
};

document.getElementById('btn-resume').onclick = () => {
    AUDIO.unlock();
    AUDIO.playResume();
    AUDIO.resumeLoop();
    STATE.screen = 'play';
    document.getElementById('pause-screen').classList.remove('active');
};

document.getElementById('btn-restart').onclick = document.getElementById('btn-start').onclick;
document.getElementById('btn-retry').onclick = document.getElementById('btn-start').onclick;

window.addEventListener('keydown', () => AUDIO.unlock(), { once: true });
window.addEventListener('pointerdown', () => AUDIO.unlock(), { once: true });

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start loop
loop(0);

</script>
