<script>
/**
 * CORE LOGIC & STATE
 */
const CONFIG = {
    def: null,
    val: { themeColor: "#00f0ff", bgSpeed: 1 }
};

const STATE = {
    score: 0,
    cps: 0,
    clickPower: 1,
    lastTick: 0,
    timeScale: 1, // Game speed multiplier
    coreLevel: 0, // Determines polygon sides (3 + level)
    coreScale: 1,
    coreRotation: 0,
    particles: [],
    floaters: [], // Floating score texts
    upgrades: [
        { id: 'u1', name: 'Relay Tap', cost: 15, cps: 1, count: 0, icon: 'Ⅰ' },
        { id: 'u2', name: 'Phase Router', cost: 100, cps: 5, count: 0, icon: 'Ⅱ' },
        { id: 'u3', name: 'Pulse Grid', cost: 1100, cps: 18, count: 0, icon: 'Ⅲ' },
        { id: 'u4', name: 'Prism Core', cost: 12000, cps: 50, count: 0, icon: 'IV' },
        { id: 'u5', name: 'Omega Layer', cost: 130000, cps: 150, count: 0, icon: 'Ω' }
    ]
};

// DOM Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const scoreEl = document.getElementById('score-display');
const cpsEl = document.getElementById('cps-display');
const upgradeList = document.getElementById('upgrade-list');
const uiLayer = document.getElementById('ui-layer');
const feedbackOverlay = document.getElementById('feedback-overlay');
const gifCoreCharge = document.getElementById('gif-core-charge');
const gifUpgradeBurst = document.getElementById('gif-upgrade-burst');

/**
 * AUDIO SYSTEM
 */
const AudioSys = {
    ctx: null,
    bgm: null,
    sfx: {},
    masterGain: null,
    bgmStarted: false,
    lastPlayed: {},
    
    init() {
        if (this.ctx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.7;
            this.masterGain.connect(this.ctx.destination);
            this.bgm = document.getElementById('bgm_main');
            if (this.bgm) {
                this.bgm.volume = 0.2;
            }
            
            ['sfx_tap', 'sfx_up', 'sfx_boost', 'sfx_fail'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    fetch(el.src)
                        .then(r => r.arrayBuffer())
                        .then(b => this.ctx.decodeAudioData(b))
                        .then(data => { this.sfx[id] = data; })
                        .catch(() => {});
                }
            });
        } catch (e) { console.error("Audio init failed", e); }
    },

    unlock() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        this.startBgm();
    },

    startBgm() {
        if (!this.bgm || this.bgmStarted) return;
        this.bgmStarted = true;
        this.bgm.currentTime = 0;
        this.bgm.play().catch(() => {
            this.bgmStarted = false;
        });
    },

    playSfx(id) {
        if (!this.ctx) return;
        const nowMs = performance.now();
        const cooldowns = { sfx_tap: 45, sfx_up: 120, sfx_boost: 140, sfx_fail: 160 };
        const last = this.lastPlayed[id] || 0;
        if (nowMs - last < (cooldowns[id] || 80)) return;
        this.lastPlayed[id] = nowMs;

        if (this.sfx[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = { sfx_tap: 0.45, sfx_up: 0.55, sfx_boost: 0.42, sfx_fail: 0.32 }[id] || 0.4;
            src.buffer = this.sfx[id];
            src.connect(gain);
            gain.connect(this.masterGain || this.ctx.destination);
            src.start(0);
        } else {
            this.synth(id);
        }
    },

    synth(id) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain || this.ctx.destination);
        
        const now = this.ctx.currentTime;
        if (id === 'sfx_tap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(760, now);
            osc.frequency.exponentialRampToValueAtTime(1180, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (id === 'sfx_fail') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.linearRampToValueAtTime(170, now + 0.18);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
        } else {
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(640, now + 0.24);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.24);
            osc.start(now);
            osc.stop(now + 0.24);
        }
    }
};

/**
 * GAME ENGINE
 */
function initGame() {
    // Config
    try {
        const rawCfg = document.getElementById('game-config').textContent;
        CONFIG.def = JSON.parse(rawCfg);
        window.gameConfigDefs = CONFIG.def;
        window.gameConfig = CONFIG.val;
        window.updateGameConfig = (k, v) => {
            if (CONFIG.val[k] !== undefined) CONFIG.val[k] = v;
        };
    } catch(e) { console.error("Config Error", e); }

    // Resize
    window.addEventListener('resize', resize);
    resize();

    // Input
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    
    // UI Init
    renderUpgrades();
    
    // Speed Button
    document.getElementById('btn-speed').addEventListener('pointerdown', toggleSpeed);

    // Start Loop
    requestAnimationFrame(loop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function handleInput(e) {
    e.preventDefault();
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const x = e.clientX;
    const y = e.clientY;
    
    const dist = Math.hypot(x - cx, y - cy);
    const coreRadius = 120;
    
    if (dist < coreRadius + 50) {
        clickCore(x, y);
    }
}

function toggleSpeed(e) {
    if(e) e.stopPropagation();
    
    // Toggle between 1x and 5x
    STATE.timeScale = STATE.timeScale === 1 ? 5 : 1;
    
    const btn = document.getElementById('btn-speed');
    const isFast = STATE.timeScale > 1;
    
    // Visual update
    if (isFast) {
        btn.classList.add('speed-active');
        btn.innerHTML = `<span>⚡ BOOST x5</span><span class="text-xs text-white bg-white/20 px-1 rounded ml-1 font-ui">LIVE</span>`;
        AudioSys.playSfx('sfx_boost');
        showFeedbackGif(gifCoreCharge, 380);
    } else {
        btn.classList.remove('speed-active');
        btn.innerHTML = `<span>⚡ BOOST x1</span><span class="text-xs text-white bg-white/20 px-1 rounded ml-1 font-ui">FREE</span>`;
        AudioSys.playSfx('sfx_boost');
    }
}

function clickCore(x, y) {
    STATE.score += STATE.clickPower;
    STATE.coreScale = 0.9;
    AudioSys.playSfx('sfx_tap');
    spawnParticles(x, y, 10, CONFIG.val.themeColor);
    spawnFloater(x, y, `+${formatNumber(STATE.clickPower)}`);
    if (Math.random() > 0.55) {
        showFeedbackGif(gifCoreCharge, 220);
    }
    updateUI();
}

function buyUpgrade(idx) {
    const upg = STATE.upgrades[idx];
    if (STATE.score >= upg.cost) {
        STATE.score -= upg.cost;
        upg.count++;
        upg.cost = Math.floor(upg.cost * 1.5);
        
        STATE.cps = STATE.upgrades.reduce((acc, u) => acc + (u.cps * u.count), 0);
        STATE.coreLevel = Math.min(10, STATE.coreLevel + 0.2);
        AudioSys.playSfx('sfx_up');
        showFeedbackGif(gifUpgradeBurst, 720);
        
        updateUI();
        renderUpgrades();
    } else {
        AudioSys.playSfx('sfx_fail');
    }
}

function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        STATE.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function spawnFloater(x, y, text) {
    STATE.floaters.push({
        x: x,
        y: y,
        text: text,
        life: 1.0,
        vy: -2
    });
}

function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return Math.floor(num);
}

function updateUI() {
    scoreEl.innerText = formatNumber(STATE.score);
    cpsEl.innerText = formatNumber(STATE.cps);
    
    STATE.upgrades.forEach((u, i) => {
        const btn = document.getElementById(`btn-upg-${i}`);
        if (btn) {
            if (STATE.score >= u.cost) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('hover:bg-white/10');
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-white/10');
            }
            const costEl = document.getElementById(`cost-upg-${i}`);
            if (costEl) costEl.innerText = formatNumber(u.cost);
        }
    });
}

function showFeedbackGif(el, duration = 420) {
    if (!el) return;
    if (feedbackOverlay) {
        feedbackOverlay.classList.remove('hidden');
    }
    if (el._hideTimer) {
        clearTimeout(el._hideTimer);
    }
    el.classList.add('is-visible');
    el._hideTimer = setTimeout(() => {
        el.classList.remove('is-visible');
        if (feedbackOverlay && !document.querySelector('.feedback-gif.is-visible')) {
            feedbackOverlay.classList.add('hidden');
        }
    }, duration);
}

function renderUpgrades() {
    upgradeList.innerHTML = '';
    STATE.upgrades.forEach((u, i) => {
        const div = document.createElement('div');
        div.className = "flex items-center justify-between p-3 bg-white/5 rounded border border-white/10 transition-all";
        div.id = `btn-upg-${i}`;
        div.onclick = () => buyUpgrade(i);
        
        div.innerHTML = `
            <div class="flex items-center">
                <div class="w-8 h-8 flex items-center justify-center bg-[#00f0ff]/20 text-[#00f0ff] font-bold rounded mr-3 font-display text-lg border border-[#00f0ff]/50">${u.icon}</div>
                <div>
                    <div class="text-white text-sm font-bold leading-none font-ui">${u.name}</div>
                    <div class="text-gray-400 text-xs font-ui">+${formatNumber(u.cps)} FLOW</div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[#ff0055] font-display text-lg leading-none" id="cost-upg-${i}">${formatNumber(u.cost)}</div>
                <div class="text-gray-500 text-xs font-ui">Tier ${u.count}</div>
            </div>
        `;
        upgradeList.appendChild(div);
    });
    updateUI();
}

/**
 * RENDER LOOP
 */
function loop(timestamp) {
    const rawDt = (timestamp - STATE.lastTick) / 1000;
    STATE.lastTick = timestamp;
    
    // Apply time scale (Speed Button)
    const dt = rawDt * STATE.timeScale;

    // Logic: Auto Generate
    if (STATE.cps > 0) {
        STATE.score += STATE.cps * dt;
        updateUI();
        
        if (Math.random() < 0.1 * STATE.cps * dt) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            spawnParticles(cx, cy, 1, '#ff0055');
        }
    }

    // Logic: Physics
    STATE.coreScale += (1 - STATE.coreScale) * 5 * dt;
    STATE.coreRotation += (0.5 + (STATE.cps * 0.01)) * dt;

    // Draw
    draw(dt, timestamp);

    requestAnimationFrame(loop);
}

function draw(dt, time) {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const cx = w / 2;
    const cy = h / 2;

    // Clear
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, w, h);

    // Background Grid (Parallax with timeScale awareness via dt accumulation or direct time use)
    // Note: 'time' passed is real time. For bg speed to match speed button, we should integrate time manually
    // But for simplicity, we'll just let the bg run at real time, while game logic runs fast.
    // Actually, let's make the grid speed up too.
    
    // Use a separate accumulated time for visuals if we want them to speed up perfectly,
    // but the request is "Speed Button". Usually implies simulation speed.
    // We will stick to simple visual feedback: rotation speeds up because it uses dt.
    
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    // We use real time for grid offset to keep it smooth, but multiply by timeScale if we wanted.
    // Let's keep grid chill.
    const offset = (time * 0.02 * CONFIG.val.bgSpeed) % gridSize;
    
    ctx.beginPath();
    for (let x = -offset; x < w; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, h);
    }
    for (let y = -offset; y < h; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(w, y);
    }
    ctx.stroke();
    
    // Rotating Rings
    const layers = Math.floor(STATE.coreLevel) + 1;
    for (let i = 0; i < layers; i++) {
        const r = 140 + (i * 30);
        ctx.beginPath();
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(0, 240, 255, 0.15)' : 'rgba(255, 0, 85, 0.15)';
        ctx.lineWidth = 2;
        
        // Rotation uses real time, but we add a component based on game speed visually
        const rot = (time * 0.0005 * (i % 2 === 0 ? 1 : -1)) + (i * 0.5) + (STATE.coreRotation * 0.1);
        const dashLen = Math.PI / (4 + i);
        
        for (let j = 0; j < Math.PI * 2; j += dashLen * 2) {
            ctx.arc(cx, cy, r, j + rot, j + rot + dashLen);
        }
        ctx.stroke();
    }
    ctx.restore();

    // The Plotagon (Core)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(STATE.coreRotation);
    ctx.scale(STATE.coreScale, STATE.coreScale);
    
    const sides = 3 + Math.floor(STATE.coreLevel);
    const radius = 80;
    
    ctx.beginPath();
    ctx.strokeStyle = CONFIG.val.themeColor;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 20;
    ctx.shadowColor = CONFIG.val.themeColor;
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    
    for (let i = 0; i <= sides; i++) {
        const theta = (i / sides) * Math.PI * 2;
        const px = Math.cos(theta) * radius;
        const py = Math.sin(theta) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Inner pulse
    const pulse = Math.sin(time * 0.005 * STATE.timeScale) * 10; // Pulse speeds up with timeScale
    ctx.beginPath();
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 2;
    ctx.arc(0, 0, (radius / 2) + pulse, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.restore();

    // Particles
    STATE.particles.forEach((p, i) => {
        p.x += p.vx * STATE.timeScale; // Particles move faster
        p.y += p.vy * STATE.timeScale;
        p.life -= dt * 1.5;
        
        if (p.life > 0) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        } else {
            STATE.particles.splice(i, 1);
        }
    });
    ctx.globalAlpha = 1;

    // Floating Text
    ctx.font = "700 24px 'Orbitron', 'Rajdhani', sans-serif";
    ctx.textAlign = "center";
    STATE.floaters.forEach((f, i) => {
        f.y += f.vy * STATE.timeScale;
        f.life -= dt;
        
        if (f.life > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${f.life})`;
            ctx.fillText(f.text, f.x, f.y);
        } else {
            STATE.floaters.splice(i, 1);
        }
    });
}

// Start Sequence
document.addEventListener('DOMContentLoaded', () => {
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const hud = document.getElementById('hud');
    const upg = document.getElementById('upgrade-container');
    
    const startGame = () => {
        if (startScreen.style.display === 'none') return;
        AudioSys.init();
        AudioSys.unlock();
        AudioSys.playSfx('sfx_up');
        
        startScreen.style.opacity = '0';
        setTimeout(() => {
            startScreen.style.display = 'none';
            hud.style.opacity = '1';
            upg.style.opacity = '1';
            hud.classList.remove('hidden');
            upg.classList.remove('hidden');
        }, 500);

        initGame();
    };

    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('pointerdown', startGame);
});
</script>
