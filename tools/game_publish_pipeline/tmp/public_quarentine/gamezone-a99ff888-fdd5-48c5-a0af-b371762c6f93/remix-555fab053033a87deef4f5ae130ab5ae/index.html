<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Momverse Brainrot 3D</title>
    <!-- [agent-note][stage4] font-remap: using catalog-approved display/UI fonts only -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #211347;
            --sky-bottom: #6c3dc0;
            --cloud-glow: rgba(255, 248, 232, 0.28);
            --panel-fill: rgba(31, 20, 71, 0.58);
            --panel-border: rgba(154, 246, 255, 0.65);
            --panel-shadow: rgba(11, 8, 26, 0.3);
            --text-main: #fff8e8;
            --text-warm: #ffd7fb;
            --accent-cyan: #88f7ff;
            --accent-pink: #ff7fd8;
            --accent-gold: #ffd86b;
            --accent-mint: #9effd1;
            --shadow-plum: rgba(24, 12, 48, 0.44);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 8%, rgba(255, 216, 107, 0.22), transparent 30%),
                radial-gradient(circle at 15% 18%, rgba(255, 127, 216, 0.18), transparent 24%),
                radial-gradient(circle at 86% 28%, rgba(136, 247, 255, 0.13), transparent 26%),
                linear-gradient(180deg, var(--sky-top) 0%, #331d67 45%, var(--sky-bottom) 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
            position: relative;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(circle at 18% 18%, rgba(255,248,232,0.22) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 28%, rgba(255,248,232,0.16) 0 1.5px, transparent 2px),
                radial-gradient(circle at 30% 74%, rgba(136,247,255,0.20) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 64%, rgba(255,127,216,0.20) 0 2px, transparent 3px),
                repeating-linear-gradient(135deg, transparent 0 28px, rgba(255,255,255,0.025) 28px 30px);
            opacity: 0.95;
            animation: momverseDrift 14s ease-in-out infinite alternate;
        }
        body::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(255,255,255,0.04)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 6px);
            mix-blend-mode: screen;
            opacity: 0.35;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 0%, rgba(255, 216, 107, 0.20), transparent 36%),
                linear-gradient(180deg, rgba(59, 36, 112, 0.80), rgba(24, 16, 48, 0.78));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            border-radius: 22px;
            box-shadow:
                0 10px 28px var(--panel-shadow),
                0 0 18px rgba(136, 247, 255, 0.14),
                inset 0 0 0 1px rgba(255,255,255,0.10);
        }
        .glass::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: inherit;
            border: 1px solid rgba(255, 248, 232, 0.10);
            pointer-events: none;
        }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 34%, rgba(255, 216, 107, 0.22), transparent 26%),
                radial-gradient(circle at 20% 72%, rgba(255, 127, 216, 0.20), transparent 30%),
                radial-gradient(circle at 82% 25%, rgba(136, 247, 255, 0.15), transparent 26%),
                linear-gradient(180deg, rgba(22, 13, 46, 0.34), rgba(22, 13, 46, 0.84));
            backdrop-filter: blur(10px);
            z-index: 50;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .screen-overlay::before {
            content: "💐  3D LOVE PARADE  👑";
            position: absolute;
            top: max(18px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 248, 232, 0.28);
            background: rgba(33, 19, 71, 0.44);
            color: rgba(255, 248, 232, 0.84);
            font-size: clamp(0.68rem, 2.8vw, 0.82rem);
            letter-spacing: 0.13em;
            font-weight: 700;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(24, 12, 48, 0.22);
        }
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .hud-score {
            padding: 9px 20px;
            margin-bottom: 7px;
            font-size: clamp(1.05rem, 3.35vw, 1.58rem);
            color: var(--accent-gold);
            text-shadow: 0 0 12px rgba(255, 216, 107, 0.45);
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            letter-spacing: 0.06em;
        }
        .hud-goal {
            padding: 7px 14px;
            font-size: clamp(0.78rem, 2.5vw, 0.96rem);
            color: var(--text-warm);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .title {
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: clamp(2.65rem, 9.2vw, 4.7rem);
            line-height: 0.9;
            color: #fff1a8;
            margin: 0 0 14px;
            letter-spacing: 0.04em;
            text-shadow:
                0 3px 0 rgba(65, 28, 110, 0.95),
                0 10px 20px rgba(0,0,0,0.35),
                0 0 18px rgba(255, 127, 216, 0.28),
                0 0 32px rgba(136, 247, 255, 0.14);
        }
        .subtitle {
            max-width: 22rem;
            font-size: clamp(0.98rem, 3.7vw, 1.18rem);
            color: var(--text-warm);
            margin: 0 0 28px;
            animation: pulse 1.4s ease-in-out infinite;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .start-btn {
            background: linear-gradient(180deg, #ff8ae1, #ff5abb);
            color: #fffdf6;
            font-size: clamp(1.05rem, 3.9vw, 1.45rem);
            padding: 15px 28px;
            border-radius: 999px;
            border: 3px solid rgba(255,255,255,0.92);
            box-shadow: 0 10px 24px rgba(30, 17, 58, 0.3), 0 0 18px rgba(255, 127, 216, 0.34);
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        }
        .start-btn:hover {
            background: linear-gradient(180deg, #ffa5e8, #ff6bc3);
            box-shadow: 0 12px 28px rgba(30, 17, 58, 0.34), 0 0 24px rgba(136, 247, 255, 0.3);
        }
        .start-btn:active { transform: scale(0.95); filter: brightness(1.08); }
        .unlock-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .unlock-text {
            margin: 0;
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: clamp(2rem, 7vw, 3.6rem);
            color: #fff1a8;
            text-shadow: 0 3px 0 rgba(65, 28, 110, 0.95), 0 0 16px rgba(255, 127, 216, 0.5);
            white-space: nowrap;
            letter-spacing: 0.06em;
            animation: bounce 1s infinite;
        }
        .feedback-gif {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: min(30vw, 128px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.65);
            background: rgba(10, 8, 26, 0.45);
            box-shadow: 0 10px 24px rgba(9, 7, 23, 0.35);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.9) translateY(8px);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .feedback-gif.is-visible {
            opacity: 0.95;
            transform: scale(1) translateY(0);
        }
        .feedback-gif--reward {
            right: auto;
            left: 16px;
            bottom: 20px;
            width: min(27vw, 112px);
            border-color: rgba(255, 216, 107, 0.72);
        }
        @media (max-width: 640px) {
            .hud { padding: 16px; }
            .feedback-gif {
                width: min(28vw, 96px);
                right: 10px;
                bottom: 10px;
            }
            .feedback-gif--reward {
                left: 10px;
                bottom: 14px;
            }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, calc(-50% + 20px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes momverseDrift {
            from { transform: translate3d(-1.5%, -0.5%, 0) scale(1.02); }
            to { transform: translate3d(1.5%, 0.8%, 0) scale(1.04); }
        }
    </style>
</head>
<body>

<!-- Config Definition -->
<script id="game-config" type="application/x-game-config">
{
    "basePoints": { "type": "number", "label": "Points Per Click", "value": 1, "min": 1, "max": 100 },
    "unlockMultiplier": { "type": "number", "label": "Unlock Difficulty", "value": 50, "min": 10, "max": 200 },
    "bgColor": { "type": "color", "label": "Background Color", "value": "#FFE4E1" }
}
</script>

<!-- Asset Declarations -->
<div id="assets" style="display:none;">
    <!-- [agent-note][stage3] resolved-audio: bgm/start/tap/unlock -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Parade" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" loop preload="auto"></audio>
    <audio id="sfx_tap" data-editable="audio" data-label="SFX Parade Tap" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_unlock" data-editable="audio" data-label="SFX Unlock" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
</div>

<!-- UI Layer -->
<div id="game-container" style="position: relative; width: 100%; height: 100%; user-select: none;">
    <canvas id="gameCanvas"></canvas>
    
    <!-- HUD -->
    <div id="hud" class="hud hidden">
        <div class="glass hud-score">💖 MOM LOVE <span id="score">0</span></div>
        <div class="glass hud-goal">
            🎁 Next Momverse Gift: <span id="next-goal">50</span>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-overlay">
        <h1 class="title">Momverse<br>Brainrot 3D</h1>
        <p class="subtitle">Tap the squishy mascot. Gift Mom the whole internet.</p>
        <button id="start-btn" class="start-btn">
            SEND MOM LOVE
        </button>
    </div>

    <!-- Unlock Notification -->
    <div id="unlock-msg" class="unlock-msg hidden">
        <h2 class="unlock-text">NEW MOMVERSE GIFT!</h2>
    </div>
    <!-- [agent-note][stage3] resolved-gif: mascot/reward feedback -> catalogs/gifs.json -->
    <img
        id="mascot-gif"
        class="feedback-gif"
        src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.gif"
        alt="Mascot celebration reaction"
        decoding="async"
        loading="lazy"
    >
    <img
        id="reward-gif"
        class="feedback-gif feedback-gif--reward"
        src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.gif"
        alt="Heart reward reaction"
        decoding="async"
        loading="lazy"
    >
</div>

<script>
/** 
 * CORE ENGINE 
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config & State ---
    window.gameConfig = {
        basePoints: 1,
        unlockMultiplier: 50,
        bgColor: "#FFE4E1"
    };

    // Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const defs = JSON.parse(cfgEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                if (window.gameConfig.hasOwnProperty(key)) {
                    window.gameConfig[key] = defs[key].value;
                }
            }
        }
    } catch(e) { console.error("Config parse error", e); }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if(key === 'bgColor') document.body.style.backgroundColor = val;
        }
    };

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        tap: document.getElementById('sfx_tap'),
        unlock: document.getElementById('sfx_unlock'),
        start: document.getElementById('sfx_start')
    };

    let audioUnlocked = false;
    const sfxCooldowns = new Map();
    const setAudioDefaults = () => {
        if (sounds.bgm) sounds.bgm.volume = 0.25;
        if (sounds.tap) sounds.tap.volume = 0.4;
        if (sounds.unlock) sounds.unlock.volume = 0.52;
        if (sounds.start) sounds.start.volume = 0.46;
    };
    setAudioDefaults();

    const unlockAudio = async () => {
        if (audioUnlocked) return;
        try {
            if (audioCtx.state !== 'running') {
                await audioCtx.resume();
            }
        } catch (_) {}
        if (sounds.bgm) {
            sounds.bgm.currentTime = 0;
            sounds.bgm.play().catch(() => {});
        }
        audioUnlocked = true;
    };

    const playSfx = (name, cooldown = 0) => {
        if (!audioUnlocked) return;
        const now = performance.now();
        const lastPlayed = sfxCooldowns.get(name) || 0;
        if (cooldown && now - lastPlayed < cooldown) return;
        sfxCooldowns.set(name, now);

        const el = sounds[name];
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.play().catch(() => {});
            } catch (_) {}
            return;
        }

        // Fallback Synth
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(name === 'unlock' ? 620 : 800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(name === 'unlock' ? 1120 : 1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    };

    // --- Game Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const nextGoalEl = document.getElementById('next-goal');
    const startScreen = document.getElementById('start-screen');
    const unlockMsg = document.getElementById('unlock-msg');
    const mascotGif = document.getElementById('mascot-gif');
    const rewardGif = document.getElementById('reward-gif');

    let gameState = 'START'; // START, PLAY
    let score = 0;
    let nextUnlock = window.gameConfig.unlockMultiplier;
    let currentSkin = 0;
    let particles = [];
    let lastTime = 0;
    
    // Cat Physics
    let catScale = 1;
    let catVel = 0;
    const catBaseRadius = 120;
    let catX = 0, catY = 0;

    // Mascot variants for the Momverse Mother's Day theme; names/colors/accessories are cosmetic only.
    const skins = [
        { name: "Porch Bouquet", stage: "Mom's Day Porch Drop", color: "#fff7ff", eyes: "#342153", nose: "#ff8fc4", glow: "#88f7ff", belly: "#ffeaf7", ear: "#ffcee8", accent: "#ff7fd8", accessory: "flower" },
        { name: "Skibidi Brunch", stage: "Skibidi Kitchen Brunch", color: "#ffd57c", eyes: "#5d2d53", nose: "#ff9f8c", stripes: true, glow: "#ff7fd8", belly: "#fff0bf", ear: "#ffe0ba", accent: "#ffd86b", accessory: "apron" },
        { name: "Rizz Bouquet", stage: "Rizz Bouquet Mall", color: "#7a8cff", eyes: "#fff07a", nose: "#b9d6ff", glow: "#88f7ff", belly: "#dbe4ff", ear: "#bec8ff", accent: "#ff7fd8", accessory: "bouquet" },
        { name: "Sigma Spa", stage: "Sigma Spa Shrine", color: "#28234d", eyes: "#9effd1", nose: "#8892ff", glow: "#9b8cff", belly: "#4a4574", ear: "#615d92", accent: "#9effd1", accessory: "spa" },
        { name: "Momverse Queen", stage: "Momverse Brainrot Finale", color: "#ff9fd2", eyes: "#7d1852", nose: "#fff0fa", glow: "#ffd86b", belly: "#ffd8ec", ear: "#ffc4e2", accent: "#ffd86b", accessory: "crown" }
    ];

    // --- Resize Logic ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        catX = window.innerWidth / 2;
        catY = window.innerHeight / 2 + 50;
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    let mascotGifTimer = null;
    let rewardGifTimer = null;
    const showGif = (el, duration = 1200) => {
        if (!el) return;
        el.classList.add('is-visible');
        const timerKey = el === mascotGif ? 'mascot' : 'reward';
        if (timerKey === 'mascot' && mascotGifTimer) clearTimeout(mascotGifTimer);
        if (timerKey === 'reward' && rewardGifTimer) clearTimeout(rewardGifTimer);
        const timer = setTimeout(() => el.classList.remove('is-visible'), duration);
        if (timerKey === 'mascot') mascotGifTimer = timer;
        if (timerKey === 'reward') rewardGifTimer = timer;
    };

    const handleInput = (e) => {
        if (gameState !== 'PLAY') return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check distance to cat center
        const dx = x - catX;
        const dy = y - (catY - 40); // Offset for head center
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < catBaseRadius * 1.2) {
            // Clicked Cat
            score += window.gameConfig.basePoints;
            scoreEl.innerText = score;
            
            // Physics Impulse
            catVel = 0.4; // Squish down
            
            // Audio + feedback
            playSfx('tap', 70);
            showGif(mascotGif, 950);

            // Particles
            for(let i=0; i<5; i++) {
                particles.push(createParticle(x, y, 'heart'));
            }

            // Unlock Check
            if (score >= nextUnlock) {
                triggerUnlock();
            }
        }
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    // --- Game Logic ---
    const triggerUnlock = () => {
        playSfx('unlock', 220);
        currentSkin = (currentSkin + 1) % skins.length;
        showGif(rewardGif, 1800);
        nextUnlock = Math.floor(nextUnlock * 1.8); // Increase difficulty
        nextGoalEl.innerText = nextUnlock;
        
        // Visual Feedback
        unlockMsg.classList.remove('hidden');
        unlockMsg.classList.add('fade-in');
        
        // Explosion of confetti
        for(let i=0; i<50; i++) {
            particles.push(createParticle(catX, catY - 50, 'confetti'));
        }

        setTimeout(() => {
            unlockMsg.classList.add('hidden');
            unlockMsg.classList.remove('fade-in');
        }, 2000);
    };

    const createParticle = (x, y, type) => {
        const momPalette = ['#ff7fd8', '#ffc7a8', '#ffd86b', '#88f7ff', '#9effd1', '#fff8e8'];
        return {
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 1) * 10 - 5,
            life: 1.0,
            type: type, // 'heart' or 'confetti'
            motif: type === 'heart' ? 'heart' : ['petal', 'coupon', 'crown', 'gift'][Math.floor(Math.random() * 4)],
            color: type === 'heart' ? momPalette[Math.floor(Math.random() * 3)] : momPalette[Math.floor(Math.random() * momPalette.length)],
            size: Math.random() * 10 + 5
        };
    };

    const updatePhysics = (dt) => {
        // Spring Physics for Cat Scale
        // Hooke's Law: F = -k*x - c*v
        const k = 150; // Stiffness
        const damping = 8;
        const target = 1;
        
        const displacement = catScale - target;
        const force = -k * displacement - damping * catVel;
        
        // Euler integration
        catVel += force * (dt / 1000); // Scale velocity
        catScale += catVel * (dt / 1000); // Scale position

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravity
            p.life -= dt / 1000;
            if (p.life <= 0) particles.splice(i, 1);
        }
    };

    // --- Rendering ---
    const drawHeart = (ctx, x, y, size, color) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, size * 0.42);
        ctx.bezierCurveTo(-size, -size * 0.22, -size * 0.48, -size, 0, -size * 0.42);
        ctx.bezierCurveTo(size * 0.48, -size, size, -size * 0.22, 0, size * 0.42);
        ctx.fill();
        ctx.restore();
    };

    const drawGiftCube = (ctx, x, y, s, color, t = 0) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(t) * 0.08);
        ctx.fillStyle = "rgba(24, 12, 48, 0.26)";
        ctx.fillRect(-s * 0.44, s * 0.44, s, s * 0.2);
        ctx.fillStyle = color;
        ctx.fillRect(-s * 0.5, -s * 0.36, s, s * 0.72);
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.fillRect(-s * 0.5, -s * 0.36, s, s * 0.18);
        ctx.fillStyle = "#ffd86b";
        ctx.fillRect(-s * 0.08, -s * 0.36, s * 0.16, s * 0.72);
        ctx.fillRect(-s * 0.5, -s * 0.06, s, s * 0.13);
        ctx.strokeStyle = "rgba(255,248,232,0.72)";
        ctx.lineWidth = 2;
        ctx.strokeRect(-s * 0.5, -s * 0.36, s, s * 0.72);
        ctx.restore();
    };

    const drawCrown = (ctx, x, y, s, color = "#ffd86b") => {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-s, s * 0.45);
        ctx.lineTo(-s * 0.78, -s * 0.34);
        ctx.lineTo(-s * 0.28, s * 0.08);
        ctx.lineTo(0, -s * 0.66);
        ctx.lineTo(s * 0.28, s * 0.08);
        ctx.lineTo(s * 0.78, -s * 0.34);
        ctx.lineTo(s, s * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(255,248,232,0.76)";
        ctx.lineWidth = Math.max(1.5, s * 0.08);
        ctx.stroke();
        ctx.restore();
    };

    const drawDaisy = (ctx, x, y, s, petal = "#ffc7a8", center = "#ffd86b") => {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = petal;
        for (let i = 0; i < 6; i++) {
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.ellipse(0, -s * 0.62, s * 0.22, s * 0.48, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = center;
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };

    const drawAccessory = (ctx, skin, r) => {
        if (skin.accessory === "flower") {
            drawDaisy(ctx, -r * 0.28, -r * 1.04, 18, "#ff7fd8");
            drawDaisy(ctx, 0, -r * 1.1, 20, "#ffc7a8");
            drawDaisy(ctx, r * 0.28, -r * 1.02, 17, "#9effd1");
        } else if (skin.accessory === "apron") {
            ctx.fillStyle = "rgba(255,248,232,0.82)";
            ctx.beginPath();
            ctx.roundRect(-r * 0.35, r * 0.12, r * 0.7, r * 0.54, 14);
            ctx.fill();
            ctx.strokeStyle = "#ff7fd8";
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.fillStyle = "#6c3dc0";
            ctx.font = "700 18px Rajdhani, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("MOM", 0, r * 0.43);
        } else if (skin.accessory === "bouquet") {
            ctx.strokeStyle = "#9effd1";
            ctx.lineWidth = 4;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(r * 0.42, r * 0.18);
                ctx.lineTo(r * (0.52 + i * 0.08), -r * 0.22);
                ctx.stroke();
                drawDaisy(ctx, r * (0.54 + i * 0.1), -r * (0.24 + Math.abs(i) * 0.04), 13, i === 0 ? "#ffd86b" : "#ff7fd8");
            }
        } else if (skin.accessory === "spa") {
            ctx.strokeStyle = "rgba(158,255,209,0.70)";
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(0, -r * 0.9, r * 0.46, Math.PI * 1.06, Math.PI * 1.94);
            ctx.stroke();
            ctx.fillStyle = "rgba(255,248,232,0.78)";
            ctx.beginPath();
            ctx.roundRect(-r * 0.46, -r * 1.08, r * 0.92, r * 0.26, 16);
            ctx.fill();
            ctx.fillStyle = "#9effd1";
            ctx.beginPath();
            ctx.ellipse(-r * 0.3, -r * 0.26, 16, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(r * 0.3, -r * 0.26, 16, 7, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (skin.accessory === "crown") {
            drawCrown(ctx, 0, -r * 1.08, 38, "#ffd86b");
            drawHeart(ctx, 0, -r * 1.18, 9, "#ff7fd8");
        }
    };

    const drawCat = (ctx, x, y, scale, skinIdx) => {
        const skin = skins[skinIdx];
        const r = catBaseRadius;
        
        ctx.save();
        ctx.translate(x, y);
        
        const yScale = catScale;
        const xScale = 2 - catScale; // Volume preservation approx
        ctx.scale(xScale, yScale);

        // Chunky 3D sticker shadow and aura
        ctx.save();
        ctx.shadowColor = skin.glow;
        ctx.shadowBlur = 36;
        ctx.fillStyle = "rgba(255,255,255,0.09)";
        ctx.beginPath();
        ctx.ellipse(0, -10, r * 1.04, r * 1.18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = "rgba(24, 12, 48, 0.28)";
        ctx.beginPath();
        ctx.ellipse(12, 18, r * 0.98, r * 1.06, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ears behind body
        ctx.fillStyle = skin.color;
        ctx.beginPath();
        ctx.moveTo(-r*0.7, -r*0.5);
        ctx.lineTo(-r*0.9, -r*1.3);
        ctx.lineTo(-r*0.3, -r*0.8);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(r*0.7, -r*0.5);
        ctx.lineTo(r*0.9, -r*1.3);
        ctx.lineTo(r*0.3, -r*0.8);
        ctx.fill();

        ctx.fillStyle = skin.ear;
        ctx.beginPath();
        ctx.moveTo(-r*0.66, -r*0.58);
        ctx.lineTo(-r*0.78, -r*1.08);
        ctx.lineTo(-r*0.44, -r*0.8);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r*0.66, -r*0.58);
        ctx.lineTo(r*0.78, -r*1.08);
        ctx.lineTo(r*0.44, -r*0.8);
        ctx.fill();

        // Body (squishy blob)
        const bodyGradient = ctx.createRadialGradient(-r * 0.32, -r * 0.42, 10, 0, 0, r * 1.18);
        bodyGradient.addColorStop(0, "#ffffff");
        bodyGradient.addColorStop(0.28, skin.color);
        bodyGradient.addColorStop(1, skin.belly);
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI, 0);
        ctx.lineTo(r, r*0.8);
        ctx.bezierCurveTo(r, r*1.2, -r, r*1.2, -r, r*0.8);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(255,248,232,0.82)";
        ctx.lineWidth = 7;
        ctx.stroke();

        // 3D rim and belly patch
        ctx.strokeStyle = skin.glow;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.62;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.92, Math.PI * 1.08, Math.PI * 1.82);
        ctx.stroke();
        ctx.globalAlpha = 1;

        ctx.fillStyle = skin.belly;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.25, r * 0.55, r * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.18)";
        ctx.beginPath();
        ctx.ellipse(-r * 0.22, r * 0.08, r * 0.18, r * 0.08, -0.45, 0, Math.PI * 2);
        ctx.fill();

        // Stripes / meme sticker marks
        if (skin.stripes) {
            ctx.fillStyle = "rgba(109,45,83,0.14)";
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.roundRect(-28 + i * 28, -r * 0.82 + i * 9, 18, 9, 5);
                ctx.fill();
            }
        }

        drawAccessory(ctx, skin, r);

        // Face
        ctx.fillStyle = skin.eyes;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.2, 15, 17, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.2, 15, 17, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = skin.glow;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.11, 4.5, 7, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.11, 4.5, 7, 0, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(-r*0.3 + 5, -r*0.2 - 6, 4.5, 0, Math.PI*2);
        ctx.arc(r*0.3 + 5, -r*0.2 - 6, 4.5, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,127,216,0.34)";
        ctx.beginPath();
        ctx.ellipse(-r * 0.44, r * 0.02, 18, 10, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.44, r * 0.02, 18, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = skin.nose;
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 6.5, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "#5D4037";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(10, 12, 20, 7);
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-10, 12, -20, 7);
        ctx.stroke();

        ctx.strokeStyle = "rgba(33,19,71,0.32)";
        ctx.beginPath();
        ctx.moveTo(-r*0.5, 0); ctx.lineTo(-r*0.9, -10);
        ctx.moveTo(-r*0.5, 5); ctx.lineTo(-r*0.9, 10);
        ctx.moveTo(r*0.5, 0); ctx.lineTo(r*0.9, -10);
        ctx.moveTo(r*0.5, 5); ctx.lineTo(r*0.9, 10);
        ctx.stroke();

        // Tiny belly badge reinforces Mom's Day identity without changing hit target.
        ctx.fillStyle = "rgba(255,216,107,0.88)";
        ctx.beginPath();
        ctx.roundRect(-26, r * 0.45, 52, 22, 11);
        ctx.fill();
        ctx.fillStyle = "#6c3dc0";
        ctx.font = "700 15px Rajdhani, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("MOM", 0, r * 0.615);

        ctx.restore();
    };

    const drawParticles = (ctx) => {
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            
            if (p.type === 'heart') {
                drawHeart(ctx, p.x, p.y, p.size, p.color);
            } else {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.life * 10);
                if (p.motif === 'petal') {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size * 0.35, p.size, 0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.motif === 'coupon') {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9);
                    ctx.fillStyle = "rgba(33,19,71,0.42)";
                    ctx.fillRect(-p.size * 0.18, -p.size * 0.45, p.size * 0.14, p.size * 0.9);
                } else if (p.motif === 'crown') {
                    drawCrown(ctx, 0, 0, p.size * 0.7, p.color);
                } else {
                    drawGiftCube(ctx, 0, 0, p.size * 1.35, p.color, p.life);
                }
                ctx.restore();
            }
        }
        ctx.globalAlpha = 1;
    };

    // [agent-note][world-design-v4] authored-background: procedural Momverse layers only; no stock scene ownership, no input/score/loop changes.
    const drawBackground = (ctx) => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const t = performance.now() / 1000;
        const skin = skins[currentSkin] || skins[0];

        const sky = ctx.createLinearGradient(0, 0, 0, h);
        const stageTop = ["#271451", "#3e2466", "#211347", "#18334b", "#120b35"][currentSkin] || "#211347";
        const stageMid = ["#6c3dc0", "#7a3f9e", "#5130a8", "#3a6b72", "#35116a"][currentSkin] || "#6c3dc0";
        const stageLow = ["#ffc7a8", "#ffd86b", "#ff7fd8", "#9effd1", "#88f7ff"][currentSkin] || "#ff7fd8";
        sky.addColorStop(0, stageTop);
        sky.addColorStop(0.58, stageMid);
        sky.addColorStop(1, stageLow);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const aura = ctx.createRadialGradient(w / 2, h * 0.38, 20, w / 2, h * 0.38, h * 0.68);
        aura.addColorStop(0, `${skin.glow}44`);
        aura.addColorStop(0.42, "rgba(255, 216, 107, 0.13)");
        aura.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = aura;
        ctx.fillRect(0, 0, w, h);

        // Far parallax landmark silhouettes: porch rails, kitchen counter, mall arches, spa columns, cosmic portals.
        ctx.save();
        ctx.globalAlpha = 0.36;
        ctx.fillStyle = "rgba(24, 12, 48, 0.58)";
        if (currentSkin === 0) {
            for (let x = -40; x < w + 60; x += 72) {
                ctx.fillRect(x, h * 0.62, 42, h * 0.28);
                ctx.fillRect(x - 12, h * 0.60, 66, 10);
            }
        } else if (currentSkin === 1) {
            ctx.fillRect(0, h * 0.65, w, h * 0.2);
            for (let x = 20; x < w; x += 110) {
                ctx.beginPath();
                ctx.ellipse(x + Math.sin(t + x) * 4, h * 0.60, 30, 11, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (currentSkin === 2) {
            for (let x = -30; x < w + 80; x += 120) {
                ctx.beginPath();
                ctx.arc(x, h * 0.62, 55, Math.PI, 0);
                ctx.lineWidth = 10;
                ctx.strokeStyle = "rgba(255,127,216,0.72)";
                ctx.stroke();
            }
        } else if (currentSkin === 3) {
            for (let x = 35; x < w; x += 95) {
                ctx.fillRect(x, h * 0.48, 24, h * 0.32);
                ctx.beginPath();
                ctx.arc(x + 12, h * 0.48, 18, Math.PI, 0);
                ctx.fill();
            }
        } else {
            for (let i = 0; i < 4; i++) {
                const px = w * (0.18 + i * 0.22);
                ctx.strokeStyle = "rgba(136,247,255,0.58)";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(px, h * 0.48 + Math.sin(t + i) * 10, 38 + i * 7, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        ctx.restore();

        // Motion-graphic floor / stage ribbons.
        for (let i = 0; i < 8; i++) {
            const y = h - 128 + i * 21;
            ctx.strokeStyle = `rgba(136, 247, 255, ${0.24 - i * 0.018})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.quadraticCurveTo(w * 0.25, y - 10 + Math.sin(t + i) * 3, w * 0.5, y);
            ctx.quadraticCurveTo(w * 0.75, y + 10 - Math.cos(t + i) * 3, w, y);
            ctx.stroke();
        }

        // Floating themed props remain behind the mascot and HUD.
        for (let i = 0; i < 6; i++) {
            const lane = i / 6;
            const x = ((lane * w) + Math.sin(t * 0.35 + i * 1.7) * 34 + w) % w;
            const y = h * (0.18 + (i % 3) * 0.13) + Math.cos(t * 0.5 + i) * 8;
            const s = 18 + (i % 3) * 5;
            ctx.globalAlpha = 0.42;
            if (i % 3 === 0) drawHeart(ctx, x, y, s, "rgba(255,127,216,0.62)");
            if (i % 3 === 1) drawGiftCube(ctx, x, y, s * 1.35, "rgba(255,199,168,0.64)", t + i);
            if (i % 3 === 2) drawCrown(ctx, x, y, s * 0.9, "rgba(255,216,107,0.70)");
            ctx.globalAlpha = 1;
        }

        // Stage title plaque: compact, visual-only progression feedback.
        ctx.save();
        ctx.font = "700 12px Rajdhani, sans-serif";
        ctx.textAlign = "center";
        ctx.letterSpacing = "1px";
        const label = skin.stage.toUpperCase();
        const labelW = Math.min(w - 32, ctx.measureText(label).width + 28);
        const lx = w / 2 - labelW / 2;
        const ly = h - 62;
        ctx.fillStyle = "rgba(33,19,71,0.52)";
        ctx.strokeStyle = "rgba(255,248,232,0.18)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(lx, ly, labelW, 24, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255,248,232,0.78)";
        ctx.fillText(label, w / 2, ly + 16);
        ctx.restore();

        // Soft clouds / steam / cosmic puffs.
        ctx.fillStyle = "rgba(255,248,232,0.12)";
        for (let i = 0; i < 4; i++) {
            const cloudX = w * (0.12 + i * 0.27) + Math.sin(t * 0.28 + i) * 22;
            const cloudY = h * (0.16 + (i % 2) * 0.08);
            ctx.beginPath();
            ctx.ellipse(cloudX, cloudY, 42, 16, 0, 0, Math.PI * 2);
            ctx.ellipse(cloudX + 28, cloudY - 8, 30, 14, 0, 0, Math.PI * 2);
            ctx.ellipse(cloudX - 28, cloudY - 6, 26, 12, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    const loop = (timestamp) => {
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (gameState === 'PLAY') {
            updatePhysics(dt);
        }

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw
        drawBackground(ctx);
        
        if (gameState === 'PLAY') {
            // Toy-like ground shadow
            ctx.fillStyle = "rgba(24,12,48,0.22)";
            ctx.beginPath();
            ctx.ellipse(catX, catY + 82, 108 * (2-catScale), 24, 0, 0, Math.PI*2);
            ctx.fill();

            drawCat(ctx, catX, catY - 40, catScale, currentSkin);
            drawParticles(ctx);
        }

        requestAnimationFrame(loop);
    };

    // --- Init ---
    const startBtn = document.getElementById('start-btn');
    let startTriggered = false;
    const startGame = async () => {
        if (startTriggered || gameState !== 'START') return;
        startTriggered = true;
        await unlockAudio();
        playSfx('start', 250);
        showGif(mascotGif, 1500);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        gameState = 'PLAY';
        
        // Initial config sync
        document.body.style.backgroundColor = window.gameConfig.bgColor;
        nextUnlock = window.gameConfig.unlockMultiplier;
        nextGoalEl.innerText = nextUnlock;
    };
    // [agent-note][stage4] repaired: mobile-action-path | element: #start-btn | action: native click + pointerup support without global touch suppression
    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('pointerup', startGame);

    document.addEventListener('visibilitychange', () => {
        if (!sounds.bgm) return;
        if (document.hidden) {
            sounds.bgm.pause();
            return;
        }
        if (audioUnlocked && gameState === 'PLAY') {
            sounds.bgm.play().catch(() => {});
        }
    });

    requestAnimationFrame(loop);
});
</script>
</body>
