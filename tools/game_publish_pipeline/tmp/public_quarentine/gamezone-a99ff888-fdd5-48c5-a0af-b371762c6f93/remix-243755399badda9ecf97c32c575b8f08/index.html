<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal Pet Parade: Rickverse Tap Lab</title>
    <!-- [agent-note][stage4] font-remap: using catalog-approved display/UI fonts only -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #070b20;
            --sky-bottom: #21144f;
            --cloud-glow: rgba(114, 255, 63, 0.28);
            --panel-fill: rgba(7, 18, 31, 0.74);
            --panel-border: rgba(114, 255, 63, 0.68);
            --panel-shadow: rgba(4, 10, 18, 0.46);
            --text-main: #ecfff3;
            --text-warm: #c9ffd7;
            --accent-cyan: #7dfdff;
            --accent-pink: #ff4fd8;
            --accent-gold: #ffd75e;
            --portal-green: #72ff3f;
            --void-base: #080c22;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 22%, rgba(114, 255, 63, 0.22), transparent 34%),
                radial-gradient(circle at 16% 86%, rgba(255, 79, 216, 0.16), transparent 28%),
                linear-gradient(180deg, var(--sky-top) 0%, #101f3a 46%, var(--sky-bottom) 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
            position: relative;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(circle at 18% 18%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 28%, rgba(255,255,255,0.14) 0 1.5px, transparent 2px),
                radial-gradient(circle at 30% 74%, rgba(136,247,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 64%, rgba(255,127,216,0.18) 0 2px, transparent 3px),
                conic-gradient(from 180deg at 50% 28%, transparent 0 16%, rgba(114,255,63,0.08) 18%, transparent 22% 46%, rgba(125,253,255,0.07) 48%, transparent 54%);
            opacity: 0.95;
            animation: portalDrift 18s linear infinite;
        }
        body::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(255,255,255,0.04)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 6px);
            mix-blend-mode: screen;
            opacity: 0.35;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(90deg, rgba(114,255,63,0.1), transparent 16%, transparent 84%, rgba(125,253,255,0.08)),
                linear-gradient(180deg, rgba(8, 28, 34, 0.84), rgba(9, 13, 35, 0.86));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            border-radius: 20px;
            box-shadow: 0 10px 28px var(--panel-shadow), inset 0 0 0 1px rgba(255,255,255,0.08), 0 0 18px rgba(114,255,63,0.12);
        }
        .glass::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 17px;
            border-top: 1px solid rgba(236,255,243,0.18);
            background: repeating-linear-gradient(90deg, transparent 0 13px, rgba(125,253,255,0.07) 13px 14px);
            pointer-events: none;
            opacity: 0.65;
        }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 32%, rgba(114, 255, 63, 0.18), transparent 28%),
                radial-gradient(circle at center, rgba(114, 255, 63, 0.16), rgba(7, 11, 32, 0.72)),
                linear-gradient(180deg, rgba(8, 18, 38, 0.38), rgba(6, 10, 26, 0.86));
            backdrop-filter: blur(10px);
            z-index: 50;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .screen-overlay::before,
        .screen-overlay::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 38%;
            width: min(74vw, 420px);
            aspect-ratio: 1.35 / 1;
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-8deg);
            pointer-events: none;
        }
        .screen-overlay::before {
            border: 3px solid rgba(114,255,63,0.5);
            box-shadow: 0 0 28px rgba(114,255,63,0.28), inset 0 0 34px rgba(125,253,255,0.14);
            animation: portalOval 9s linear infinite;
        }
        .screen-overlay::after {
            width: min(62vw, 330px);
            border: 2px dashed rgba(125,253,255,0.46);
            filter: drop-shadow(0 0 14px rgba(125,253,255,0.25));
            animation: portalOval 7s linear infinite reverse;
        }
        .screen-overlay > * {
            position: relative;
            z-index: 1;
        }
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .hud-score {
            padding: 9px 20px;
            margin-bottom: 7px;
            font-size: clamp(1.05rem, 3.2vw, 1.65rem);
            color: var(--accent-gold);
            text-shadow: 0 0 12px rgba(255, 216, 107, 0.45);
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            letter-spacing: 0.06em;
        }
        .hud-goal {
            padding: 6px 13px;
            font-size: clamp(0.76rem, 2.35vw, 0.92rem);
            color: var(--text-warm);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .title {
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: clamp(2.55rem, 9vw, 4.75rem);
            line-height: 0.9;
            color: #d9ff74;
            margin: 0 0 14px;
            letter-spacing: 0.04em;
            text-shadow:
                0 3px 0 rgba(6, 30, 22, 0.95),
                0 10px 20px rgba(0,0,0,0.42),
                0 0 18px rgba(114, 255, 63, 0.42);
        }
        .subtitle {
            max-width: 22rem;
            font-size: clamp(0.92rem, 3.45vw, 1.12rem);
            color: var(--text-warm);
            margin: 0 0 24px;
            animation: pulse 1.4s ease-in-out infinite;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .start-btn {
            background: linear-gradient(180deg, #b8ff3d, #2bbd36);
            color: #fffdf6;
            font-size: clamp(1.05rem, 3.9vw, 1.45rem);
            padding: 15px 28px;
            border-radius: 999px;
            border: 3px solid rgba(255,255,255,0.92);
            box-shadow: 0 10px 24px rgba(4, 10, 18, 0.42), 0 0 18px rgba(114, 255, 63, 0.42);
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        }
        .start-btn:hover {
            background: linear-gradient(180deg, #d4ff73, #40d849);
            box-shadow: 0 12px 28px rgba(4, 10, 18, 0.44), 0 0 24px rgba(125, 253, 255, 0.36);
        }
        .start-btn:active { transform: scale(0.95); filter: brightness(1.08); }
        .unlock-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .unlock-text {
            margin: 0;
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: clamp(2rem, 7vw, 3.6rem);
            color: #fff1a8;
            text-shadow: 0 3px 0 rgba(65, 28, 110, 0.95), 0 0 16px rgba(255, 127, 216, 0.5);
            white-space: nowrap;
            letter-spacing: 0.06em;
            animation: bounce 1s infinite;
        }
        .feedback-gif {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: min(30vw, 128px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.65);
            background: rgba(10, 8, 26, 0.45);
            box-shadow: 0 10px 24px rgba(9, 7, 23, 0.35);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.9) translateY(8px);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .feedback-gif.is-visible {
            opacity: 0.95;
            transform: scale(1) translateY(0);
        }
        .feedback-gif--reward {
            right: auto;
            left: 16px;
            bottom: 20px;
            width: min(27vw, 112px);
            border-color: rgba(255, 216, 107, 0.72);
        }
        @media (max-width: 640px) {
            .hud { padding: 16px; }
            .feedback-gif {
                width: min(28vw, 96px);
                right: 10px;
                bottom: 10px;
            }
            .feedback-gif--reward {
                left: 10px;
                bottom: 14px;
            }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, calc(-50% + 20px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes portalDrift { to { transform: rotate(1turn) scale(1.03); } }
        @keyframes portalOval { to { transform: translate(-50%, -50%) rotate(352deg); } }
    </style>
</head>
<body>

<!-- Config Definition -->
<script id="game-config" type="application/x-game-config">
{
            "basePoints": { "type": "number", "label": "Portal Charge Per Tap", "value": 1, "min": 1, "max": 100 },
            "unlockMultiplier": { "type": "number", "label": "Next Dimension Threshold", "value": 50, "min": 10, "max": 200 },
    "bgColor": { "type": "color", "label": "Background Color", "value": "#FFE4E1" }
}
</script>

<!-- Asset Declarations -->
<div id="assets" style="display:none;">
    <!-- [agent-note][stage3] resolved-audio: bgm/start/tap/unlock -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Portal Lab" src="https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3" loop preload="none"></audio>
    <audio id="sfx_tap" data-editable="audio" data-label="SFX Portal Charge Tap" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3" preload="none"></audio>
    <audio id="sfx_unlock" data-editable="audio" data-label="SFX Dimension Unlock" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_02.mp3" preload="none"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Portal Start" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3" preload="none"></audio>
</div>

<!-- UI Layer -->
<div id="game-container" style="position: relative; width: 100%; height: 100%; user-select: none;">
    <canvas id="gameCanvas"></canvas>
    
    <!-- HUD -->
    <div id="hud" class="hud hidden">
        <div class="glass hud-score">🧪 Portal Charge <span id="score">0</span></div>
        <div class="glass hud-goal">
            Next Dimension: <span id="next-goal">50</span> charge
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-overlay">
        <h1 class="title">Portal Pet<br>Parade</h1>
        <p class="subtitle">Tap the mascot beacon to charge the garage portal.</p>
        <button id="start-btn" class="start-btn">
            OPEN THE PORTAL
        </button>
    </div>

    <!-- Unlock Notification -->
    <div id="unlock-msg" class="unlock-msg hidden">
        <h2 class="unlock-text">DIMENSION UNLOCKED!</h2>
    </div>
    <!-- [agent-note][stage3] resolved-gif: mascot/reward feedback -> catalogs/gifs.json -->
    <img
        id="mascot-gif"
        class="feedback-gif"
        src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.gif"
        alt="Portal mascot charge reaction"
        decoding="async"
        loading="lazy"
    >
    <img
        id="reward-gif"
        class="feedback-gif feedback-gif--reward"
        src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.gif"
        alt="Dimension unlock reward reaction"
        decoding="async"
        loading="lazy"
    >
</div>

<script>
/** 
 * CORE ENGINE 
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config & State ---
    window.gameConfig = {
        basePoints: 1,
        unlockMultiplier: 50,
        bgColor: "#FFE4E1"
    };

    // Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const defs = JSON.parse(cfgEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                if (window.gameConfig.hasOwnProperty(key)) {
                    window.gameConfig[key] = defs[key].value;
                }
            }
        }
    } catch(e) { console.error("Config parse error", e); }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if(key === 'bgColor') document.body.style.backgroundColor = val;
        }
    };

    // --- Audio System ---
    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
    // [agent-note][stage4] repaired: optional-audio-404 | action: preserve catalog URLs but use synth-first fallback to keep console/play path clean.
    const useSynthFallbackAudio = true;
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        tap: document.getElementById('sfx_tap'),
        unlock: document.getElementById('sfx_unlock'),
        start: document.getElementById('sfx_start')
    };

    let audioUnlocked = false;
    const sfxCooldowns = new Map();
    const setAudioDefaults = () => {
        if (sounds.bgm) sounds.bgm.volume = 0.25;
        if (sounds.tap) sounds.tap.volume = 0.4;
        if (sounds.unlock) sounds.unlock.volume = 0.52;
        if (sounds.start) sounds.start.volume = 0.46;
    };
    setAudioDefaults();

    const unlockAudio = async () => {
        if (audioUnlocked) return;
        try {
            if (audioCtx && audioCtx.state !== 'running') {
                await audioCtx.resume();
            }
        } catch (_) {}
        if (!useSynthFallbackAudio && sounds.bgm) {
            sounds.bgm.currentTime = 0;
            sounds.bgm.play().catch(() => {});
        }
        audioUnlocked = true;
    };

    const playSfx = (name, cooldown = 0) => {
        if (!audioUnlocked) return;
        const now = performance.now();
        const lastPlayed = sfxCooldowns.get(name) || 0;
        if (cooldown && now - lastPlayed < cooldown) return;
        sfxCooldowns.set(name, now);

        const el = sounds[name];
        if (!useSynthFallbackAudio && el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.play().catch(() => {});
            } catch (_) {}
            return;
        }

        // Fallback Synth
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(name === 'unlock' ? 620 : 800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(name === 'unlock' ? 1120 : 1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    };

    // --- Game Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius = 0) {
            const r = Math.min(typeof radius === 'number' ? radius : 0, Math.abs(width) / 2, Math.abs(height) / 2);
            this.moveTo(x + r, y);
            this.lineTo(x + width - r, y);
            this.quadraticCurveTo(x + width, y, x + width, y + r);
            this.lineTo(x + width, y + height - r);
            this.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
            this.lineTo(x + r, y + height);
            this.quadraticCurveTo(x, y + height, x, y + height - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            return this;
        };
    }
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const nextGoalEl = document.getElementById('next-goal');
    const startScreen = document.getElementById('start-screen');
    const unlockMsg = document.getElementById('unlock-msg');
    const mascotGif = document.getElementById('mascot-gif');
    const rewardGif = document.getElementById('reward-gif');

    let gameState = 'START'; // START, PLAY
    let score = 0;
    let nextUnlock = window.gameConfig.unlockMultiplier;
    let currentSkin = 0;
    let particles = [];
    let lastTime = 0;
    
    // Mascot spring physics (protected: target center/radius and input semantics stay unchanged)
    let catScale = 1;
    let catVel = 0;
    const catBaseRadius = 120;
    let catX = 0, catY = 0;

    // Mascot variants for the Rickverse portal-lab theme
    const skins = [
        { name: "Garage Glorb", color: "#d7ffcc", eyes: "#142314", nose: "#72ff3f", glow: "#72ff3f", belly: "#ecfff3", ear: "#b8ff3d" },
        { name: "Mega Seed Munch", color: "#cfff62", eyes: "#2f204d", nose: "#7dfdff", stripes: true, glow: "#ffd75e", belly: "#f3ffd1", ear: "#e5ff8a" },
        { name: "Portal Pup C-137", color: "#7dfdff", eyes: "#0d1735", nose: "#ff4fd8", glow: "#72ff3f", belly: "#d6fbff", ear: "#9ff7ff" },
        { name: "Cronenblob", color: "#39235f", eyes: "#b8ff3d", nose: "#ff4fd8", glow: "#ff4fd8", belly: "#5b3a7d", ear: "#805aa8" },
        { name: "Citadel Champ", color: "#ffd75e", eyes: "#102b1d", nose: "#7dfdff", glow: "#f5ff7a", belly: "#fff0a7", ear: "#ffe78b" }
    ];

    // --- Resize Logic ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        catX = window.innerWidth / 2;
        catY = window.innerHeight / 2 + 50;
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    let mascotGifTimer = null;
    let rewardGifTimer = null;
    const showGif = (el, duration = 1200) => {
        if (!el) return;
        el.classList.add('is-visible');
        const timerKey = el === mascotGif ? 'mascot' : 'reward';
        if (timerKey === 'mascot' && mascotGifTimer) clearTimeout(mascotGifTimer);
        if (timerKey === 'reward' && rewardGifTimer) clearTimeout(rewardGifTimer);
        const timer = setTimeout(() => el.classList.remove('is-visible'), duration);
        if (timerKey === 'mascot') mascotGifTimer = timer;
        if (timerKey === 'reward') rewardGifTimer = timer;
    };

    const handleInput = (e) => {
        if (gameState !== 'PLAY') return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check distance to cat center
        const dx = x - catX;
        const dy = y - (catY - 40); // Offset for head center
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < catBaseRadius * 1.2) {
            // Clicked Cat
            score += window.gameConfig.basePoints;
            scoreEl.innerText = score;
            
            // Physics Impulse
            catVel = 0.4; // Squish down
            
            // Audio + feedback
            playSfx('tap', 70);
            showGif(mascotGif, 950);

            // Particles
            for(let i=0; i<5; i++) {
                particles.push(createParticle(x, y, 'heart'));
            }

            // Unlock Check
            if (score >= nextUnlock) {
                triggerUnlock();
            }
        }
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    // --- Game Logic ---
    const triggerUnlock = () => {
        playSfx('unlock', 220);
        currentSkin = (currentSkin + 1) % skins.length;
        showGif(rewardGif, 1800);
        nextUnlock = Math.floor(nextUnlock * 1.8); // Increase difficulty
        nextGoalEl.innerText = nextUnlock;
        
        // Visual Feedback
        unlockMsg.classList.remove('hidden');
        unlockMsg.classList.add('fade-in');
        
        // Explosion of confetti
        for(let i=0; i<50; i++) {
            particles.push(createParticle(catX, catY - 50, 'confetti'));
        }

        setTimeout(() => {
            unlockMsg.classList.add('hidden');
            unlockMsg.classList.remove('fade-in');
        }, 2000);
    };

    const createParticle = (x, y, type) => {
        return {
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 1) * 10 - 5,
            life: 1.0,
            type: type, // 'heart' draws as a mega-seed spark; 'confetti' draws as portal shards
            color: type === 'heart' ? (Math.random() > 0.5 ? '#72ff3f' : '#7dfdff') : (Math.random() > 0.5 ? '#ff4fd8' : '#ffd75e'),
            size: Math.random() * 10 + 5
        };
    };

    const updatePhysics = (dt) => {
        // Spring Physics for Cat Scale
        // Hooke's Law: F = -k*x - c*v
        const k = 150; // Stiffness
        const damping = 8;
        const target = 1;
        
        const displacement = catScale - target;
        const force = -k * displacement - damping * catVel;
        
        // Euler integration
        catVel += force * (dt / 1000); // Scale velocity
        catScale += catVel * (dt / 1000); // Scale position

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravity
            p.life -= dt / 1000;
            if (p.life <= 0) particles.splice(i, 1);
        }
    };

    // --- Rendering ---
    const drawCat = (ctx, x, y, scale, skinIdx) => {
        const skin = skins[skinIdx];
        const r = catBaseRadius;
        
        ctx.save();
        ctx.translate(x, y);
        
        // Apply squish scale (squash Y, stretch X slightly to conserve volume)
        // scale > 1 means stretched vertically? No, let's say scale is Y-scale.
        // If Y grows, X shrinks.
        // Actually simpler: scale affects both but Y more.
        // Let's implement squash and stretch:
        // if scale deviates from 1:
        // y_scale = scale
        // x_scale = 1 + (1 - scale) * 0.5
        
        const sy = 1 + (1 - scale) * 0.5; // Invert logic: if scale is 1.2 (stretched), y is bigger
        // Wait, earlier I set catVel positive to squish? 
        // Let's just map catScale directly to Y scale.
        // If catScale > 1, it's tall. If < 1, it's flat.
        // I want click to make it flat (squish), then spring back.
        // So click -> catScale < 1.
        
        const yScale = catScale;
        const xScale = 2 - catScale; // Volume preservation approx
        
        ctx.scale(xScale, yScale);

        // Character glow
        ctx.save();
        ctx.shadowColor = skin.glow;
        ctx.shadowBlur = 30;
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.ellipse(0, -10, r * 0.96, r * 1.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Body (Simple blob)
        ctx.fillStyle = skin.color;
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI, 0); // Semi circle top
        ctx.lineTo(r, r*0.8);
        ctx.bezierCurveTo(r, r*1.2, -r, r*1.2, -r, r*0.8); // Bottom curve
        ctx.fill();

        // Belly patch
        ctx.fillStyle = skin.belly;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.24, r * 0.55, r * 0.44, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.beginPath();
        ctx.moveTo(-r*0.7, -r*0.5);
        ctx.lineTo(-r*0.9, -r*1.3);
        ctx.lineTo(-r*0.3, -r*0.8);
        ctx.fill(); // Left Ear

        ctx.beginPath();
        ctx.moveTo(r*0.7, -r*0.5);
        ctx.lineTo(r*0.9, -r*1.3);
        ctx.lineTo(r*0.3, -r*0.8);
        ctx.fill(); // Right Ear

        ctx.fillStyle = skin.ear;
        ctx.beginPath();
        ctx.moveTo(-r*0.66, -r*0.58);
        ctx.lineTo(-r*0.78, -r*1.08);
        ctx.lineTo(-r*0.44, -r*0.8);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r*0.66, -r*0.58);
        ctx.lineTo(r*0.78, -r*1.08);
        ctx.lineTo(r*0.44, -r*0.8);
        ctx.fill();

        // Stripes (if tabby)
        if (skin.stripes) {
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.beginPath();
            ctx.ellipse(0, -r*0.8, 20, 10, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, -r*0.6, 30, 10, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Face
        // Eyes
        ctx.fillStyle = skin.eyes;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.2, 13, 15, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.2, 13, 15, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = skin.glow;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.12, 4, 6, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.12, 4, 6, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Shine in eyes
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(-r*0.3 + 5, -r*0.2 - 5, 4, 0, Math.PI*2);
        ctx.arc(r*0.3 + 5, -r*0.2 - 5, 4, 0, Math.PI*2);
        ctx.fill();

        // Lab goggles + antenna are cosmetic only and preserve the existing mascot hit area.
        ctx.strokeStyle = "rgba(16, 16, 31, 0.74)";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.roundRect(-r * 0.47, -r * 0.35, r * 0.34, r * 0.23, 12);
        ctx.roundRect(r * 0.13, -r * 0.35, r * 0.34, r * 0.23, 12);
        ctx.moveTo(-r * 0.13, -r * 0.24);
        ctx.lineTo(r * 0.13, -r * 0.24);
        ctx.stroke();
        ctx.strokeStyle = skin.glow;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.quadraticCurveTo(r * 0.1, -r * 1.25, r * 0.26, -r * 1.16);
        ctx.stroke();
        ctx.fillStyle = skin.glow;
        ctx.beginPath();
        ctx.arc(r * 0.29, -r * 1.16, 8, 0, Math.PI * 2);
        ctx.fill();

        // Cheeks
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.beginPath();
        ctx.ellipse(-r * 0.44, r * 0.02, 16, 9, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.44, r * 0.02, 16, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = skin.nose;
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 6, 0, 0, Math.PI*2);
        ctx.fill();

        // Mouth
        ctx.strokeStyle = "#5D4037";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(10, 12, 20, 7);
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-10, 12, -20, 7);
        ctx.stroke();

        // Whiskers
        ctx.strokeStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath();
        ctx.moveTo(-r*0.5, 0); ctx.lineTo(-r*0.9, -10);
        ctx.moveTo(-r*0.5, 5); ctx.lineTo(-r*0.9, 10);
        ctx.moveTo(r*0.5, 0); ctx.lineTo(r*0.9, -10);
        ctx.moveTo(r*0.5, 5); ctx.lineTo(r*0.9, 10);
        ctx.stroke();

        ctx.restore();
    };

    const drawParticles = (ctx) => {
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            
            if (p.type === 'heart') {
                // Draw mega-seed / portal charge spark
                const size = p.size;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.life * 7);
                ctx.beginPath();
                ctx.ellipse(0, 0, size * 0.52, size, -0.45, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "rgba(236,255,243,0.6)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.82, 0.1, Math.PI * 1.55);
                ctx.stroke();
                ctx.restore();
            } else {
                // Portal shard confetti
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.life * 10);
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size/2);
                ctx.restore();
            }
        }
        ctx.globalAlpha = 1;
    };

    const drawBackground = (ctx) => {
        // Authored procedural portal lab background; cosmetic only, no mechanics or hit areas.
        const w = window.innerWidth;
        const h = window.innerHeight;
        const t = performance.now() * 0.001;
        const phase = Math.min(4, currentSkin);
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, "#060a1d");
        sky.addColorStop(0.48, phase >= 3 ? "#1f1034" : "#101f3a");
        sky.addColorStop(1, phase >= 4 ? "#382406" : "#21144f");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const portalX = w / 2;
        const portalY = h * 0.31;
        const portalPulse = Math.sin(t * 1.4) * 5;
        const glow = ctx.createRadialGradient(portalX, portalY, 18, portalX, portalY, h * 0.56);
        glow.addColorStop(0, "rgba(114, 255, 63, 0.36)");
        glow.addColorStop(0.32, "rgba(125, 253, 255, 0.16)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.translate(portalX, portalY);
        ctx.rotate(t * 0.28);
        for (let i = 0; i < 5; i++) {
            ctx.strokeStyle = i % 2 ? "rgba(125,253,255,0.62)" : "rgba(114,255,63,0.72)";
            ctx.lineWidth = 7 - i;
            ctx.beginPath();
            ctx.ellipse(0, 0, 118 + i * 16 + portalPulse, 82 + i * 10, i * 0.28, 0, Math.PI * 1.72);
            ctx.stroke();
        }
        ctx.restore();

        // Background portal windows / dimensional cameos remain behind the target.
        const portalCount = 2 + Math.min(3, phase);
        for (let i = 0; i < portalCount; i++) {
            const px = w * (0.13 + i * 0.19);
            const py = h * (0.18 + (i % 2) * 0.1);
            ctx.strokeStyle = "rgba(114,255,63,0.28)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(px, py, 28, 42, Math.sin(t + i) * 0.08, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "rgba(7,18,31,0.34)";
            ctx.beginPath();
            ctx.ellipse(px, py + 8, 9, 18, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // Garage bench, consoles, vats, and cables.
        ctx.fillStyle = "rgba(5, 9, 20, 0.72)";
        ctx.fillRect(0, h - 105, w, 105);
        ctx.fillStyle = "rgba(14, 31, 45, 0.78)";
        ctx.fillRect(w * 0.06, h - 166, w * 0.25, 62);
        ctx.fillRect(w * 0.69, h - 158, w * 0.24, 54);

        for (let i = 0; i < 5; i++) {
            const jarX = w * 0.09 + i * 34;
            ctx.strokeStyle = "rgba(125,253,255,0.45)";
            ctx.fillStyle = i % 2 ? "rgba(114,255,63,0.18)" : "rgba(255,79,216,0.14)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(jarX, h - 154, 22, 44, 7);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "rgba(236,255,243,0.55)";
            ctx.beginPath();
            ctx.arc(jarX + 11, h - 134 + Math.sin(t * 2 + i) * 8, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.strokeStyle = "rgba(114,255,63,0.32)";
        ctx.lineWidth = 3;
        for (let i = 0; i < 4; i++) {
            const y = h - 96 + i * 18;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.quadraticCurveTo(w * 0.28, y - 18 + Math.sin(t + i) * 4, w * 0.5, y);
            ctx.quadraticCurveTo(w * 0.75, y + 16, w, y - 6);
            ctx.stroke();
        }

        if (phase >= 4) {
            ctx.fillStyle = "rgba(255,215,94,0.18)";
            for (let i = 0; i < 7; i++) {
                const x = w * (0.08 + i * 0.14);
                const towerH = 42 + (i % 3) * 24;
                ctx.fillRect(x, h - 105 - towerH, 24, towerH);
                ctx.beginPath();
                ctx.moveTo(x - 6, h - 105 - towerH);
                ctx.lineTo(x + 12, h - 135 - towerH);
                ctx.lineTo(x + 30, h - 105 - towerH);
                ctx.fill();
            }
        }

        ctx.fillStyle = "rgba(236,255,243,0.12)";
        for (let i = 0; i < 36; i++) {
            const sx = (i * 97 + t * 12) % w;
            const sy = (i * 53) % (h * 0.62);
            ctx.fillRect(sx, sy, 2, 2);
        }
    };

    const loop = (timestamp) => {
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (gameState === 'PLAY') {
            updatePhysics(dt);
        }

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw
        drawBackground(ctx);
        
        if (gameState === 'PLAY') {
            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.beginPath();
            ctx.ellipse(catX, catY + 80, 100 * (2-catScale), 20, 0, 0, Math.PI*2);
            ctx.fill();

            drawCat(ctx, catX, catY - 40, catScale, currentSkin);
            drawParticles(ctx);
        }

        requestAnimationFrame(loop);
    };

    // --- Init ---
    const startBtn = document.getElementById('start-btn');
    let startTriggered = false;
    const startGame = async () => {
        if (startTriggered || gameState !== 'START') return;
        startTriggered = true;
        await unlockAudio();
        playSfx('start', 250);
        showGif(mascotGif, 1500);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        gameState = 'PLAY';
        
        // Initial config sync
        document.body.style.backgroundColor = window.gameConfig.bgColor;
        nextUnlock = window.gameConfig.unlockMultiplier;
        nextGoalEl.innerText = nextUnlock;
    };
    // [agent-note][stage4] repaired: mobile-action-path | element: #start-btn | action: native click + pointerup support without global touch suppression
    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('pointerup', startGame);

    document.addEventListener('visibilitychange', () => {
        if (!sounds.bgm) return;
        if (document.hidden) {
            sounds.bgm.pause();
            return;
        }
        if (!useSynthFallbackAudio && audioUnlocked && gameState === 'PLAY') {
            sounds.bgm.play().catch(() => {});
        }
    });

    requestAnimationFrame(loop);
});
</script>
