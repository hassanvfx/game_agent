<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hogwarts Familiar Charms</title>
    <!-- [agent-note][world-design-superprompt] font-remap: Cinzel fantasy title + Rajdhani readable HUD from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #120b2f;
            --sky-bottom: #2b185c;
            --cloud-glow: rgba(255, 246, 190, 0.3);
            --panel-fill: rgba(40, 27, 14, 0.66);
            --panel-border: rgba(218, 165, 32, 0.72);
            --panel-shadow: rgba(6, 4, 16, 0.38);
            --text-main: #fff8df;
            --text-warm: #f4d58b;
            --accent-cyan: #9ee7ff;
            --accent-pink: #bf7cff;
            --accent-gold: #f6c453;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 238, 167, 0.22), transparent 32%),
                linear-gradient(180deg, var(--sky-top) 0%, #21124f 46%, var(--sky-bottom) 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
            position: relative;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(circle at 18% 18%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 28%, rgba(255,255,255,0.14) 0 1.5px, transparent 2px),
                radial-gradient(circle at 30% 74%, rgba(136,247,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 64%, rgba(255,127,216,0.18) 0 2px, transparent 3px);
            opacity: 0.95;
            animation: starDrift 18s linear infinite;
        }
        body::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(255,255,255,0.04)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 6px);
            mix-blend-mode: screen;
            opacity: 0.35;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 0%, rgba(255, 241, 168, 0.16), transparent 34%),
                linear-gradient(180deg, rgba(70, 46, 20, 0.82), rgba(21, 16, 44, 0.82));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            border-radius: 20px;
            box-shadow: 0 10px 28px var(--panel-shadow), inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .glass::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 16px;
            border: 1px solid rgba(255, 248, 223, 0.12);
            background:
                linear-gradient(90deg, transparent 0 12%, rgba(246, 196, 83, 0.12) 12% 13%, transparent 13% 87%, rgba(246, 196, 83, 0.12) 87% 88%, transparent 88%),
                radial-gradient(circle at 50% 50%, rgba(191, 124, 255, 0.12), transparent 56%);
            pointer-events: none;
        }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, rgba(255,255,255,0.12), rgba(16, 11, 35, 0.72)),
                linear-gradient(180deg, rgba(22, 13, 46, 0.3), rgba(22, 13, 46, 0.82));
            backdrop-filter: blur(10px);
            z-index: 50;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .screen-overlay::before {
            content: "✦";
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(76vw, 430px);
            height: min(76vw, 430px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(246, 196, 83, 0.28);
            box-shadow:
                inset 0 0 0 9px rgba(255, 248, 223, 0.035),
                0 0 42px rgba(191, 124, 255, 0.24);
            color: rgba(246, 196, 83, 0.26);
            font-size: min(14vw, 5rem);
            line-height: min(76vw, 430px);
            animation: sigilTurn 24s linear infinite;
            pointer-events: none;
        }
        .screen-overlay::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 28%;
            background:
                linear-gradient(180deg, transparent, rgba(7, 5, 22, 0.55)),
                repeating-linear-gradient(90deg, transparent 0 36px, rgba(246, 196, 83, 0.08) 36px 39px, transparent 39px 76px);
            pointer-events: none;
        }
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .hud-score {
            padding: 10px 22px;
            margin-bottom: 8px;
            font-size: clamp(1.2rem, 3.6vw, 1.85rem);
            color: var(--accent-gold);
            text-shadow: 0 0 12px rgba(255, 216, 107, 0.45);
            font-family: 'Cinzel', 'Rajdhani', serif;
            letter-spacing: 0.06em;
        }
        .hud-goal {
            padding: 7px 14px;
            font-size: clamp(0.78rem, 2.5vw, 0.96rem);
            color: var(--text-warm);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .title {
            position: relative;
            z-index: 1;
            font-family: 'Cinzel', 'Rajdhani', serif;
            font-size: clamp(2.65rem, 9vw, 5rem);
            line-height: 0.92;
            color: #fff1a8;
            margin: 0 0 16px;
            letter-spacing: 0.04em;
            text-shadow:
                0 3px 0 rgba(65, 28, 110, 0.95),
                0 10px 20px rgba(0,0,0,0.35),
                0 0 18px rgba(255, 127, 216, 0.28);
        }
        .subtitle {
            position: relative;
            z-index: 1;
            max-width: 22rem;
            font-size: clamp(0.98rem, 3.7vw, 1.18rem);
            color: var(--text-warm);
            margin: 0 0 28px;
            animation: pulse 1.4s ease-in-out infinite;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .start-btn {
            position: relative;
            z-index: 1;
            overflow: hidden;
            background:
                radial-gradient(circle at 30% 18%, rgba(255,255,255,0.62), transparent 22%),
                linear-gradient(180deg, #f6c453, #9b6a22);
            color: #fff8df;
            font-size: clamp(1.02rem, 3.8vw, 1.38rem);
            padding: 15px 28px;
            border-radius: 999px;
            border: 3px solid rgba(255,255,255,0.92);
            box-shadow: 0 10px 24px rgba(30, 17, 58, 0.3), 0 0 18px rgba(246, 196, 83, 0.34);
            font-family: 'Cinzel', 'Rajdhani', serif;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        }
        .start-btn::after {
            content: "";
            position: absolute;
            top: -60%;
            bottom: -60%;
            width: 34%;
            left: -42%;
            transform: rotate(18deg);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            animation: buttonShimmer 3.4s ease-in-out infinite;
            pointer-events: none;
        }
        .start-btn:hover {
            background: linear-gradient(180deg, #ffe08a, #b88428);
            box-shadow: 0 12px 28px rgba(30, 17, 58, 0.34), 0 0 24px rgba(158, 231, 255, 0.3);
        }
        .start-btn:active { transform: scale(0.95); filter: brightness(1.08); }
        .unlock-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .unlock-text {
            margin: 0;
            font-family: 'Cinzel', 'Rajdhani', serif;
            font-size: clamp(2rem, 7vw, 3.6rem);
            color: #fff1a8;
            text-shadow: 0 3px 0 rgba(65, 28, 110, 0.95), 0 0 16px rgba(255, 127, 216, 0.5);
            white-space: nowrap;
            letter-spacing: 0.06em;
            animation: bounce 1s infinite;
        }
        .feedback-gif {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: min(30vw, 128px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.65);
            background: rgba(10, 8, 26, 0.45);
            box-shadow: 0 10px 24px rgba(9, 7, 23, 0.35);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.9) translateY(8px);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .feedback-gif.is-visible {
            opacity: 0.95;
            transform: scale(1) translateY(0);
        }
        .feedback-gif--reward {
            right: auto;
            left: 16px;
            bottom: 20px;
            width: min(27vw, 112px);
            border-color: rgba(255, 216, 107, 0.72);
        }
        @media (max-width: 640px) {
            .hud { padding: 16px; }
            .feedback-gif {
                width: min(28vw, 96px);
                right: 10px;
                bottom: 10px;
            }
            .feedback-gif--reward {
                left: 10px;
                bottom: 14px;
            }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, calc(-50% + 20px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes starDrift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-26px, 18px, 0); } }
        @keyframes sigilTurn { to { transform: translate(-50%, -50%) rotate(1turn); } }
        @keyframes buttonShimmer { 0%, 52% { left: -42%; opacity: 0; } 62% { opacity: 0.85; } 82%, 100% { left: 108%; opacity: 0; } }
    </style>
</head>
<body>

<!-- Config Definition -->
<script id="game-config" type="application/x-game-config">
{
    "basePoints": { "type": "number", "label": "House Points Per Tap", "value": 1, "min": 1, "max": 100 },
    "unlockMultiplier": { "type": "number", "label": "First Charm Threshold", "value": 50, "min": 10, "max": 200 },
    "bgColor": { "type": "color", "label": "Castle Backdrop Fallback", "value": "#120b2f" }
}
</script>

<!-- Asset Declarations -->
<div id="assets" style="display:none;">
    <!-- [agent-note][stage3] resolved-audio: bgm/start/tap/unlock -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Hogwarts Mystery" src="https://gamezone-virid.vercel.app/assets/audios/bgm/mystical_bgm_01.mp3" loop preload="auto"></audio>
    <audio id="sfx_tap" data-editable="audio" data-label="SFX Wand Spark Tap" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3" preload="auto"></audio>
    <audio id="sfx_unlock" data-editable="audio" data-label="SFX Charm Unlock" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_02.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Lesson Start" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_character_01.mp3" preload="auto"></audio>
</div>

<!-- UI Layer -->
<div id="game-container" style="position: relative; width: 100%; height: 100%; user-select: none;">
    <canvas id="gameCanvas"></canvas>
    
    <!-- HUD -->
    <div id="hud" class="hud hidden">
        <div class="glass hud-score">⚡ House Points <span id="score">0</span></div>
        <div class="glass hud-goal">
            Next Charm: <span id="next-goal">50</span> ✦
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-overlay">
        <h1 class="title">Hogwarts<br>Familiar Charms</h1>
        <p class="subtitle">Tap the enchanted familiar to earn house points.</p>
        <button id="start-btn" class="start-btn">
            START LESSON
        </button>
    </div>

    <!-- Unlock Notification -->
    <div id="unlock-msg" class="unlock-msg hidden">
        <h2 class="unlock-text">NEW CHARM UNLOCKED!</h2>
    </div>
    <!-- [agent-note][stage3] resolved-gif: mascot/reward feedback -> catalogs/gifs.json -->
    <img
        id="mascot-gif"
        class="feedback-gif"
        src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.gif"
        alt="Familiar celebration reaction"
        decoding="async"
        loading="lazy"
    >
    <img
        id="reward-gif"
        class="feedback-gif feedback-gif--reward"
        src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.gif"
        alt="Charm reward reaction"
        decoding="async"
        loading="lazy"
    >
</div>

<script>
/** 
 * CORE ENGINE 
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config & State ---
    window.gameConfig = {
        basePoints: 1,
        unlockMultiplier: 50,
        bgColor: "#120b2f"
    };

    // Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const defs = JSON.parse(cfgEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                if (window.gameConfig.hasOwnProperty(key)) {
                    window.gameConfig[key] = defs[key].value;
                }
            }
        }
    } catch(e) { console.error("Config parse error", e); }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if(key === 'bgColor') document.body.style.backgroundColor = val;
        }
    };

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        tap: document.getElementById('sfx_tap'),
        unlock: document.getElementById('sfx_unlock'),
        start: document.getElementById('sfx_start')
    };

    let audioUnlocked = false;
    const sfxCooldowns = new Map();
    const setAudioDefaults = () => {
        if (sounds.bgm) sounds.bgm.volume = 0.25;
        if (sounds.tap) sounds.tap.volume = 0.4;
        if (sounds.unlock) sounds.unlock.volume = 0.52;
        if (sounds.start) sounds.start.volume = 0.46;
    };
    setAudioDefaults();

    const unlockAudio = async () => {
        if (audioUnlocked) return;
        try {
            if (audioCtx.state !== 'running') {
                await audioCtx.resume();
            }
        } catch (_) {}
        if (sounds.bgm) {
            sounds.bgm.currentTime = 0;
            sounds.bgm.play().catch(() => {});
        }
        audioUnlocked = true;
    };

    const playSfx = (name, cooldown = 0) => {
        if (!audioUnlocked) return;
        const now = performance.now();
        const lastPlayed = sfxCooldowns.get(name) || 0;
        if (cooldown && now - lastPlayed < cooldown) return;
        sfxCooldowns.set(name, now);

        const el = sounds[name];
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.play().catch(() => {});
            } catch (_) {}
            return;
        }

        // Fallback Synth
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(name === 'unlock' ? 620 : 800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(name === 'unlock' ? 1120 : 1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    };

    // --- Game Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const nextGoalEl = document.getElementById('next-goal');
    const startScreen = document.getElementById('start-screen');
    const unlockMsg = document.getElementById('unlock-msg');
    const mascotGif = document.getElementById('mascot-gif');
    const rewardGif = document.getElementById('reward-gif');

    let gameState = 'START'; // START, PLAY
    let score = 0;
    let nextUnlock = window.gameConfig.unlockMultiplier;
    let currentSkin = 0;
    let particles = [];
    let lastTime = 0;
    
    // Familiar Physics
    let catScale = 1;
    let catVel = 0;
    const catBaseRadius = 120;
    let catX = 0, catY = 0;

    // Familiar variants for the Hogwarts-inspired charm theme
    const skins = [
        { name: "First-Year Cat", color: "#f6ead2", eyes: "#2b185c", nose: "#b66a53", glow: "#f6c453", belly: "#fff8df", ear: "#e6c78c", scarf: "#7a1f2b", mark: "#7a1f2b" },
        { name: "Gryffindor Spark", color: "#8f1d2c", eyes: "#ffd86b", nose: "#f2a06b", stripes: true, glow: "#f6c453", belly: "#d9a441", ear: "#c84d44", scarf: "#f6c453", mark: "#f6c453" },
        { name: "Ravenclaw Owl", color: "#244f86", eyes: "#f6e7b4", nose: "#d2a34e", glow: "#9ee7ff", belly: "#b9c7da", ear: "#396ba4", scarf: "#9ee7ff", mark: "#f6e7b4" },
        { name: "Slytherin Toad", color: "#173f32", eyes: "#b8ffd1", nose: "#8ebfa7", glow: "#82f0a8", belly: "#295b49", ear: "#2d6b55", scarf: "#82f0a8", mark: "#b8ffd1" },
        { name: "Astral Patronus", color: "#d9ecff", eyes: "#2b185c", nose: "#9ee7ff", glow: "#c9f6ff", belly: "#f3fbff", ear: "#bde4ff", scarf: "#bf7cff", mark: "#bf7cff" }
    ];

    // --- Resize Logic ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        catX = window.innerWidth / 2;
        catY = window.innerHeight / 2 + 50;
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    let mascotGifTimer = null;
    let rewardGifTimer = null;
    const showGif = (el, duration = 1200) => {
        if (!el) return;
        el.classList.add('is-visible');
        const timerKey = el === mascotGif ? 'mascot' : 'reward';
        if (timerKey === 'mascot' && mascotGifTimer) clearTimeout(mascotGifTimer);
        if (timerKey === 'reward' && rewardGifTimer) clearTimeout(rewardGifTimer);
        const timer = setTimeout(() => el.classList.remove('is-visible'), duration);
        if (timerKey === 'mascot') mascotGifTimer = timer;
        if (timerKey === 'reward') rewardGifTimer = timer;
    };

    const handleInput = (e) => {
        if (gameState !== 'PLAY') return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check distance to cat center
        const dx = x - catX;
        const dy = y - (catY - 40); // Offset for head center
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < catBaseRadius * 1.2) {
            // Clicked Cat
            score += window.gameConfig.basePoints;
            scoreEl.innerText = score;
            
            // Physics Impulse
            catVel = 0.4; // Squish down
            
            // Audio + feedback
            playSfx('tap', 70);
            showGif(mascotGif, 950);

            // Particles
            for(let i=0; i<5; i++) {
                particles.push(createParticle(x, y, 'spark'));
            }

            // Unlock Check
            if (score >= nextUnlock) {
                triggerUnlock();
            }
        }
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    // --- Game Logic ---
    const triggerUnlock = () => {
        playSfx('unlock', 220);
        currentSkin = (currentSkin + 1) % skins.length;
        showGif(rewardGif, 1800);
        nextUnlock = Math.floor(nextUnlock * 1.8); // Increase difficulty
        nextGoalEl.innerText = nextUnlock;
        
        // Visual Feedback
        unlockMsg.classList.remove('hidden');
        unlockMsg.classList.add('fade-in');
        
        // Explosion of confetti
        for(let i=0; i<50; i++) {
            particles.push(createParticle(catX, catY - 50, 'confetti'));
        }

        setTimeout(() => {
            unlockMsg.classList.add('hidden');
            unlockMsg.classList.remove('fade-in');
        }, 2000);
    };

    const createParticle = (x, y, type) => {
        return {
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 1) * 10 - 5,
            life: 1.0,
            type: type, // 'spark' or 'confetti'
            color: type === 'spark' ? '#F6C453' : `hsl(${42 + Math.random()*250}, 88%, 68%)`,
            size: Math.random() * 10 + 5
        };
    };

    const updatePhysics = (dt) => {
        // Spring Physics for Cat Scale
        // Hooke's Law: F = -k*x - c*v
        const k = 150; // Stiffness
        const damping = 8;
        const target = 1;
        
        const displacement = catScale - target;
        const force = -k * displacement - damping * catVel;
        
        // Euler integration
        catVel += force * (dt / 1000); // Scale velocity
        catScale += catVel * (dt / 1000); // Scale position

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravity
            p.life -= dt / 1000;
            if (p.life <= 0) particles.splice(i, 1);
        }
    };

    // --- Rendering ---
    const drawCat = (ctx, x, y, scale, skinIdx) => {
        const skin = skins[skinIdx];
        const r = catBaseRadius;
        
        ctx.save();
        ctx.translate(x, y);
        
        // Apply squish scale (squash Y, stretch X slightly to conserve volume)
        // scale > 1 means stretched vertically? No, let's say scale is Y-scale.
        // If Y grows, X shrinks.
        // Actually simpler: scale affects both but Y more.
        // Let's implement squash and stretch:
        // if scale deviates from 1:
        // y_scale = scale
        // x_scale = 1 + (1 - scale) * 0.5
        
        const sy = 1 + (1 - scale) * 0.5; // Invert logic: if scale is 1.2 (stretched), y is bigger
        // Wait, earlier I set catVel positive to squish? 
        // Let's just map catScale directly to Y scale.
        // If catScale > 1, it's tall. If < 1, it's flat.
        // I want click to make it flat (squish), then spring back.
        // So click -> catScale < 1.
        
        const yScale = catScale;
        const xScale = 2 - catScale; // Volume preservation approx
        
        ctx.scale(xScale, yScale);

        // Character glow
        ctx.save();
        ctx.shadowColor = skin.glow;
        ctx.shadowBlur = 30;
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.ellipse(0, -10, r * 0.96, r * 1.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Body (Simple blob)
        ctx.fillStyle = skin.color;
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI, 0); // Semi circle top
        ctx.lineTo(r, r*0.8);
        ctx.bezierCurveTo(r, r*1.2, -r, r*1.2, -r, r*0.8); // Bottom curve
        ctx.fill();

        // Belly patch
        ctx.fillStyle = skin.belly;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.24, r * 0.55, r * 0.44, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.beginPath();
        ctx.moveTo(-r*0.7, -r*0.5);
        ctx.lineTo(-r*0.9, -r*1.3);
        ctx.lineTo(-r*0.3, -r*0.8);
        ctx.fill(); // Left Ear

        ctx.beginPath();
        ctx.moveTo(r*0.7, -r*0.5);
        ctx.lineTo(r*0.9, -r*1.3);
        ctx.lineTo(r*0.3, -r*0.8);
        ctx.fill(); // Right Ear

        ctx.fillStyle = skin.ear;
        ctx.beginPath();
        ctx.moveTo(-r*0.66, -r*0.58);
        ctx.lineTo(-r*0.78, -r*1.08);
        ctx.lineTo(-r*0.44, -r*0.8);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r*0.66, -r*0.58);
        ctx.lineTo(r*0.78, -r*1.08);
        ctx.lineTo(r*0.44, -r*0.8);
        ctx.fill();

        // Stripes (if tabby)
        if (skin.stripes) {
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.beginPath();
            ctx.ellipse(0, -r*0.8, 20, 10, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, -r*0.6, 30, 10, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Face
        // Round student spectacles frame the eyes without changing the tappable footprint.
        ctx.strokeStyle = "rgba(28, 18, 46, 0.7)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(-r * 0.3, -r * 0.2, 23, 0, Math.PI * 2);
        ctx.arc(r * 0.3, -r * 0.2, 23, 0, Math.PI * 2);
        ctx.moveTo(-r * 0.1, -r * 0.2);
        ctx.lineTo(r * 0.1, -r * 0.2);
        ctx.stroke();

        // Eyes
        ctx.fillStyle = skin.eyes;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.2, 13, 15, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.2, 13, 15, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = skin.glow;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.12, 4, 6, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.12, 4, 6, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Shine in eyes
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(-r*0.3 + 5, -r*0.2 - 5, 4, 0, Math.PI*2);
        ctx.arc(r*0.3 + 5, -r*0.2 - 5, 4, 0, Math.PI*2);
        ctx.fill();

        // Lightning charm mark
        ctx.strokeStyle = skin.mark || skin.glow;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(-8, -r * 0.62);
        ctx.lineTo(9, -r * 0.78);
        ctx.lineTo(0, -r * 0.54);
        ctx.lineTo(15, -r * 0.64);
        ctx.stroke();

        // Cheeks
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.beginPath();
        ctx.ellipse(-r * 0.44, r * 0.02, 16, 9, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.44, r * 0.02, 16, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = skin.nose;
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 6, 0, 0, Math.PI*2);
        ctx.fill();

        // Mouth
        ctx.strokeStyle = "#5D4037";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(10, 12, 20, 7);
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-10, 12, -20, 7);
        ctx.stroke();

        // Whiskers
        ctx.strokeStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath();
        ctx.moveTo(-r*0.5, 0); ctx.lineTo(-r*0.9, -10);
        ctx.moveTo(-r*0.5, 5); ctx.lineTo(-r*0.9, 10);
        ctx.moveTo(r*0.5, 0); ctx.lineTo(r*0.9, -10);
        ctx.moveTo(r*0.5, 5); ctx.lineTo(r*0.9, 10);
        ctx.stroke();

        // House scarf / charm band anchors the familiar as a wizard-school companion.
        ctx.fillStyle = skin.scarf || skin.glow;
        ctx.beginPath();
        ctx.roundRect(-r * 0.58, r * 0.42, r * 1.16, 22, 11);
        ctx.fill();
        ctx.fillStyle = "rgba(255,248,223,0.5)";
        for (let i = -2; i <= 2; i++) {
            ctx.fillRect(i * r * 0.2 - 5, r * 0.42, 10, 22);
        }

        ctx.restore();
    };

    const drawParticles = (ctx) => {
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            
            if (p.type === 'spark') {
                // Draw wand spark
                const size = p.size;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.life * 6);
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.lineTo(size * 0.28, -size * 0.28);
                ctx.lineTo(size, 0);
                ctx.lineTo(size * 0.28, size * 0.28);
                ctx.lineTo(0, size);
                ctx.lineTo(-size * 0.28, size * 0.28);
                ctx.lineTo(-size, 0);
                ctx.lineTo(-size * 0.28, -size * 0.28);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            } else {
                // Confetti rect
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.life * 10);
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size/2);
                ctx.restore();
            }
        }
        ctx.globalAlpha = 1;
    };

    const drawBackground = (ctx) => {
        // [agent-note][world-design-superprompt] authored-background: procedural Hogwarts-inspired scene; keep decorative only, never mechanic-bearing.
        const phase = currentSkin % 5;
        const palettes = [
            ["#120b2f", "#2b185c", "#7a4b17"],
            ["#1b1238", "#34205f", "#6f4a22"],
            ["#071a22", "#10392f", "#18301e"],
            ["#102a45", "#1b5f62", "#816017"],
            ["#070b24", "#17245c", "#30204f"]
        ];
        const [top, mid, bottom] = palettes[phase];
        const w = window.innerWidth;
        const h = window.innerHeight;
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, top);
        sky.addColorStop(0.58, mid);
        sky.addColorStop(1, bottom);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(w / 2, h * 0.24, 20, w / 2, h * 0.24, h * 0.75);
        glow.addColorStop(0, phase === 2 ? "rgba(185, 255, 209, 0.18)" : "rgba(255, 241, 168, 0.25)");
        glow.addColorStop(0.48, "rgba(158, 231, 255, 0.1)");
        glow.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        // Decorative spell rings: animated background identity only.
        const t = performance.now() * 0.00025;
        ctx.save();
        ctx.translate(w / 2, h * 0.32);
        ctx.rotate(t * 1.4);
        ctx.strokeStyle = phase === 4 ? "rgba(201, 246, 255, 0.24)" : "rgba(246, 196, 83, 0.18)";
        ctx.lineWidth = 1.5;
        for (let ring = 0; ring < 3; ring++) {
            ctx.beginPath();
            ctx.arc(0, 0, 76 + ring * 28, 0, Math.PI * 2);
            ctx.stroke();
        }
        for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 * i) / 8;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * 78, Math.sin(a) * 78);
            ctx.lineTo(Math.cos(a) * 152, Math.sin(a) * 152);
            ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.58;
        if (phase === 2) {
            // Forbidden Forest silhouettes
            ctx.fillStyle = "rgba(0, 12, 14, 0.52)";
            for (let i = 0; i < 9; i++) {
                const x = (i / 8) * w;
                const treeH = h * (0.32 + (i % 3) * 0.07);
                ctx.fillRect(x - 8, h - treeH, 16, treeH);
                ctx.beginPath();
                ctx.ellipse(x, h - treeH + 34, 54, 78, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = "rgba(185, 255, 209, 0.14)";
            for (let i = 0; i < 7; i++) {
                const x = (i * 83 + t * 420) % w;
                const y = h * (0.46 + 0.1 * Math.sin(i + t * 4));
                ctx.beginPath();
                ctx.arc(x, y, 5 + (i % 3), 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (phase === 3) {
            // Quidditch pitch hoops as background-only icons
            ctx.strokeStyle = "rgba(246, 196, 83, 0.42)";
            ctx.lineWidth = 5;
            for (let i = 0; i < 3; i++) {
                const x = w * (0.22 + i * 0.28);
                const y = h * 0.56;
                ctx.beginPath();
                ctx.moveTo(x, h);
                ctx.lineTo(x, y + 28);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x, y, 28, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.fillStyle = "rgba(246, 196, 83, 0.34)";
            ctx.beginPath();
            ctx.ellipse(w * 0.78, h * 0.3 + Math.sin(t * 8) * 10, 16, 8, -0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.32)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(w * 0.78 - 14, h * 0.3);
            ctx.quadraticCurveTo(w * 0.72, h * 0.25, w * 0.68, h * 0.31);
            ctx.moveTo(w * 0.78 + 14, h * 0.3);
            ctx.quadraticCurveTo(w * 0.84, h * 0.25, w * 0.88, h * 0.31);
            ctx.stroke();
        } else if (phase === 4) {
            // Astronomy tower and constellation field
            ctx.fillStyle = "rgba(6, 8, 28, 0.62)";
            ctx.fillRect(w * 0.08, h * 0.46, w * 0.16, h * 0.54);
            ctx.beginPath();
            ctx.moveTo(w * 0.08, h * 0.46);
            ctx.lineTo(w * 0.16, h * 0.34);
            ctx.lineTo(w * 0.24, h * 0.46);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgba(201, 246, 255, 0.5)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(w * 0.58, h * 0.18);
            ctx.lineTo(w * 0.65, h * 0.24);
            ctx.lineTo(w * 0.74, h * 0.2);
            ctx.lineTo(w * 0.82, h * 0.28);
            ctx.stroke();
        } else {
            // Great Hall / moving staircase castle geometry
            ctx.fillStyle = "rgba(20, 14, 39, 0.46)";
            ctx.fillRect(0, h * 0.7, w, h * 0.3);
            ctx.fillStyle = "rgba(7, 5, 22, 0.32)";
            for (let i = 0; i < 4; i++) {
                const x = w * (0.08 + i * 0.26);
                const towerW = Math.max(28, w * 0.055);
                ctx.fillRect(x, h * 0.54, towerW, h * 0.18);
                ctx.beginPath();
                ctx.moveTo(x - 6, h * 0.54);
                ctx.lineTo(x + towerW * 0.5, h * 0.47);
                ctx.lineTo(x + towerW + 6, h * 0.54);
                ctx.closePath();
                ctx.fill();
            }
            for (let i = 0; i < 5; i++) {
                const x = w * (0.12 + i * 0.19);
                const bob = Math.sin(t * 5 + i) * 7;
                ctx.fillStyle = "rgba(246, 196, 83, 0.42)";
                ctx.fillRect(x - 9, h * 0.34 + bob, 18, 78);
                ctx.beginPath();
                ctx.ellipse(x, h * 0.32 + bob, 8, 16, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = "rgba(143, 29, 44, 0.32)";
            ctx.fillRect(w * 0.14, h * 0.28, 28, 86);
            ctx.fillStyle = "rgba(36, 79, 134, 0.32)";
            ctx.fillRect(w * 0.78, h * 0.3, 28, 78);
            if (phase === 1) {
                ctx.strokeStyle = "rgba(218, 165, 32, 0.34)";
                ctx.lineWidth = 8;
                for (let i = 0; i < 4; i++) {
                    const y = h * (0.36 + i * 0.1);
                    ctx.beginPath();
                    ctx.moveTo(w * 0.06, y + i * 18);
                    ctx.lineTo(w * 0.94, y - 40 + i * 12);
                    ctx.stroke();
                }
                ctx.strokeStyle = "rgba(255, 248, 223, 0.22)";
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    ctx.strokeRect(w * (0.22 + i * 0.22), h * (0.3 + i * 0.04), 44, 58);
                }
            }
        }
        ctx.restore();

        // Slow decorative magic motes, tied only to time/skin for visual evolution.
        for (let i = 0; i < 30; i++) {
            const x = ((i * 97 + t * 1200) % (w + 80)) - 40;
            const y = (Math.sin(t * 3 + i) * 18) + ((i * 53) % Math.max(1, h - 120)) + 50;
            const r = 1.5 + (i % 3);
            ctx.fillStyle = i % 5 === 0 ? "rgba(246, 196, 83, 0.58)" : "rgba(201, 246, 255, 0.36)";
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    const loop = (timestamp) => {
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (gameState === 'PLAY') {
            updatePhysics(dt);
        }

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw
        drawBackground(ctx);
        
        if (gameState === 'PLAY') {
            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.beginPath();
            ctx.ellipse(catX, catY + 80, 100 * (2-catScale), 20, 0, 0, Math.PI*2);
            ctx.fill();

            drawCat(ctx, catX, catY - 40, catScale, currentSkin);
            drawParticles(ctx);
        }

        requestAnimationFrame(loop);
    };

    // --- Init ---
    const startBtn = document.getElementById('start-btn');
    let startTriggered = false;
    const startGame = async () => {
        if (startTriggered || gameState !== 'START') return;
        startTriggered = true;
        await unlockAudio();
        playSfx('start', 250);
        showGif(mascotGif, 1500);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        gameState = 'PLAY';
        
        // Initial config sync
        document.body.style.backgroundColor = window.gameConfig.bgColor;
        nextUnlock = window.gameConfig.unlockMultiplier;
        nextGoalEl.innerText = nextUnlock;
    };
    // [agent-note][stage4] repaired: mobile-action-path | element: #start-btn | action: native click + pointerup support without global touch suppression
    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('pointerup', startGame);

    document.addEventListener('visibilitychange', () => {
        if (!sounds.bgm) return;
        if (document.hidden) {
            sounds.bgm.pause();
            return;
        }
        if (audioUnlocked && gameState === 'PLAY') {
            sounds.bgm.play().catch(() => {});
        }
    });

    requestAnimationFrame(loop);
});
</script>
</body>
