<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Street Hoops</title>
    <!-- [agent-note][stage4] remapped-font: title/highlights->Russo One, ui/body->Rajdhani from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #12091f;
            --bg-bottom: #261146;
            --panel: rgba(18, 10, 35, 0.84);
            --panel-strong: rgba(31, 15, 56, 0.94);
            --line: rgba(109, 250, 255, 0.32);
            --line-soft: rgba(255, 255, 255, 0.08);
            --glow: rgba(58, 241, 255, 0.35);
            --accent: #3af1ff;
            --accent-2: #7d5cff;
            --accent-warm: #ff9d48;
            --danger: #ff4d7a;
            --text: #f3f6ff;
            --text-dim: rgba(231, 236, 255, 0.75);
            --court-line: rgba(163, 248, 255, 0.09);
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(58, 241, 255, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 157, 72, 0.2), transparent 18%),
                radial-gradient(circle at 82% 10%, rgba(125, 92, 255, 0.18), transparent 24%),
                linear-gradient(180deg, transparent 60%, rgba(255, 110, 145, 0.06) 100%);
        }
        body::after {
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 100% 4px;
            mix-blend-mode: soft-light;
            opacity: 0.55;
        }
        canvas { display: block; touch-action: none; position: relative; z-index: 1; }
        .glass {
            background: linear-gradient(180deg, rgba(31, 15, 56, 0.92), rgba(16, 9, 31, 0.82));
            backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 18px 38px rgba(4, 4, 20, 0.42),
                0 0 26px rgba(58, 241, 255, 0.12);
        }
        .neon-text {
            color: var(--accent);
            text-shadow: 0 0 12px rgba(58, 241, 255, 0.55);
        }
        .display-font { font-family: 'Russo One', 'Rajdhani', system-ui, sans-serif; letter-spacing: 0.06em; }
        .ui-font { font-family: 'Rajdhani', system-ui, sans-serif; }
        .neon-btn {
            background: linear-gradient(135deg, var(--accent), #8be9ff 52%, #c9fbff);
            color: #061019;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(58, 241, 255, 0.18), 0 0 0 1px rgba(255,255,255,0.35) inset;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }
        .neon-btn:active {
            transform: scale(0.96);
            filter: brightness(1.04);
        }
        #ui-layer { pointer-events: none; position: relative; z-index: 2; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 108%, rgba(255, 157, 72, 0.28), transparent 24%),
                linear-gradient(180deg, transparent 0%, transparent 58%, rgba(255,255,255,0.02) 58%, rgba(255,255,255,0.02) 59%, transparent 59%);
            opacity: 0.9;
        }
        #hud { gap: 8px; max-width: min(48vw, 230px); }
        .hud-card {
            min-width: 148px;
            padding: 10px 12px;
            border-radius: 16px;
        }
        .hud-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-dim);
        }
        .hud-value {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(22px, 5vw, 30px);
            line-height: 0.95;
        }
        .hud-sub {
            font-size: clamp(12px, 2.8vw, 16px);
            color: rgba(255,255,255,0.82);
        }
        .hud-lives {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 2px;
        }
        .screen-card {
            width: min(92vw, 420px);
            border-radius: 24px;
            padding: 24px 22px;
            position: relative;
            overflow: hidden;
        }
        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(58, 241, 255, 0.08), transparent 40%, rgba(255, 157, 72, 0.08));
        }
        .title-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            margin-bottom: 12px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .hero-ball {
            width: 84px;
            height: 84px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.45), transparent 16%),
                radial-gradient(circle at 50% 45%, #ffb25f, #ff7f50 62%, #db4c1d 100%);
            box-shadow:
                0 0 0 4px rgba(255,255,255,0.06) inset,
                0 0 24px rgba(255, 157, 72, 0.42),
                0 12px 28px rgba(0,0,0,0.32);
            position: relative;
            animation: heroFloat 2.4s ease-in-out infinite;
        }
        .hero-ball::before,
        .hero-ball::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(84, 31, 14, 0.72);
        }
        .hero-ball::before {
            clip-path: inset(0 48% 0 48%);
        }
        .hero-ball::after {
            clip-path: inset(48% 0 48% 0);
        }
        .hero-ball .arc-left,
        .hero-ball .arc-right {
            position: absolute;
            inset: 16px;
            border: 3px solid rgba(84, 31, 14, 0.72);
            border-radius: 50%;
        }
        .hero-ball .arc-left { clip-path: inset(0 42% 0 0); }
        .hero-ball .arc-right { clip-path: inset(0 0 0 42%); }
        .screen-title {
            margin: 0;
            font-family: 'Russo One', sans-serif;
            font-size: clamp(30px, 8vw, 52px);
            line-height: 0.95;
            letter-spacing: 0.05em;
        }
        .screen-subtitle {
            margin: 10px 0 18px;
            font-size: clamp(15px, 3.8vw, 19px);
            color: rgba(243, 246, 255, 0.9);
            letter-spacing: 0.06em;
        }
        .screen-tip {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 0 0 20px;
            font-size: 13px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .tip-pill {
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-primary {
            width: 100%;
            min-height: 54px;
            font-family: 'Russo One', sans-serif;
            font-size: clamp(17px, 4vw, 22px);
            letter-spacing: 0.08em;
        }
        .result-stack {
            display: grid;
            gap: 12px;
            margin: 18px 0 20px;
        }
        .result-card {
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .result-card .label {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .result-card .value {
            margin-top: 4px;
            font-family: 'Russo One', sans-serif;
            font-size: clamp(24px, 6vw, 34px);
        }
        .reaction-gif {
            position: absolute;
            bottom: 12px;
            width: min(28vw, 120px);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(8, 8, 20, 0.5);
            box-shadow: 0 12px 24px rgba(0,0,0,0.22);
            opacity: 0;
            transform: translateY(8px) scale(0.95);
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 3;
        }
        .reaction-gif img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
        .reaction-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .reaction-gif--celebrate {
            left: 12px;
        }
        .reaction-gif--fail {
            right: 12px;
        }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @media (max-width: 640px) {
            #hud { top: 14px !important; left: 14px !important; }
            .screen-card {
                width: min(94vw, 390px);
                padding: 20px 16px;
                border-radius: 22px;
            }
            .screen-tip {
                gap: 8px;
                font-size: 11px;
            }
            .hud-card {
                min-width: 138px;
                padding: 8px 10px;
            }
            .reaction-gif {
                width: min(25vw, 88px);
                bottom: 10px;
            }
        }
    </style>
</head>

<script>
// §3.2 Config Interface
window.gameConfigDefs = {
    "gravity": { "type": "number", "label": "Gravity", "value": 25, "min": 10, "max": 50 },
    "dragPower": { "type": "number", "label": "Shot Power", "value": 2.5, "min": 1, "max": 5 },
    "hoopSpeedBase": { "type": "number", "label": "Hoop Speed", "value": 100, "min": 0, "max": 300 },
    "themeColor": { "type": "color", "label": "Accent Color", "value": "#00fff5" }
};
window.gameConfig = {
    gravity: 25,
    dragPower: 2.5,
    hoopSpeedBase: 100,
    themeColor: "#00fff5"
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'themeColor') {
            document.documentElement.style.setProperty('--theme-color', val);
            const els = document.querySelectorAll('.neon-text');
            els.forEach(e => e.style.color = val);
        }
    }
};

// Audio Manager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.sounds = {};
        this.soundVolumes = {
            bgm: 0.2,
            sfx_score: 0.42,
            sfx_fail: 0.34,
            sfx_shoot: 0.26,
            sfx_rim: 0.24,
            sfx_ui: 0.3
        };
        this.lastPlayedAt = {};
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.loadStaticAssets();
        }
    }

    loadStaticAssets() {
        const bgmEl = document.getElementById('bgm_main');
        if (bgmEl) {
            bgmEl.volume = this.soundVolumes.bgm;
            this.sounds.bgm = { el: bgmEl, type: 'tag' };
        }

        ['sfx_score', 'sfx_fail', 'sfx_shoot', 'sfx_rim', 'sfx_ui'].forEach(id => {
            const el = document.getElementById(id);
            if (el && el.src) {
                el.volume = this.soundVolumes[id] ?? 0.28;
                this.sounds[id] = { el, type: 'tag' };
            } else {
                this.sounds[id] = { type: 'fallback' };
            }
        });
    }

    unlock() {
        if (!this.ctx) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    playBgm() {
        if (this.sounds.bgm && this.sounds.bgm.el) {
            this.sounds.bgm.el.volume = this.soundVolumes.bgm;
            this.sounds.bgm.el.play().catch(() => {});
        }
    }

    stopBgm() {
        if (this.sounds.bgm && this.sounds.bgm.el) {
            this.sounds.bgm.el.pause();
            this.sounds.bgm.el.currentTime = 0;
        }
    }

    playSfx(key, minInterval = 80) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        const now = performance.now();
        if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minInterval) return;
        this.lastPlayedAt[key] = now;

        const sound = this.sounds[key];
        if (sound && sound.type === 'tag' && sound.el) {
            const voice = sound.el.cloneNode();
            voice.volume = this.soundVolumes[key] ?? 0.28;
            voice.play().catch(() => {});
        } else {
            this.synthesize(key);
        }
    }

    synthesize(key) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (key === 'sfx_score') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (key === 'sfx_fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (key === 'sfx_shoot') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(620, this.ctx.currentTime + 0.09);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.16);
        } else if (key === 'sfx_ui') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(540, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(720, this.ctx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } else if (key === 'sfx_rim') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(280, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(180, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
}

// Game Logic
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();

    // DOM Elements
    const uiStart = document.getElementById('start-screen');
    const uiGameOver = document.getElementById('game-over-screen');
    const uiHud = document.getElementById('hud');
    const elScore = document.getElementById('scoreVal');
    const elBest = document.getElementById('bestVal');
    const elFinalScore = document.getElementById('finalScore');
    const elFinalBest = document.getElementById('finalBest');
    const elLives = document.getElementById('livesContainer');
    const btnStart = document.getElementById('start-btn');
    const btnRestart = document.getElementById('restart-btn');
    const reactionCelebration = document.getElementById('reaction-celebration');
    const reactionFail = document.getElementById('reaction-fail');

    // Game State
    let width, height, dpr;
    let lastTime = 0;
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('neon_hoops_best') || 0;
    let lives = 3;
    
    // Entities
    let ball = {
        x: 0, y: 0, r: 20,
        vx: 0, vy: 0,
        rotation: 0,
        state: 'IDLE', // IDLE, AIMING, FLYING
        reset: function(w, h) {
            this.x = w * 0.2;
            this.y = h * 0.7;
            this.vx = 0;
            this.vy = 0;
            this.rotation = 0;
            this.state = 'IDLE';
        }
    };

    let hoop = {
        x: 0, y: 0, w: 100, h: 10,
        dir: 1, speed: 0,
        reset: function(w, h) {
            this.x = w * 0.7;
            this.y = h * 0.4;
            this.dir = 1;
            this.speed = window.gameConfig.hoopSpeedBase;
        }
    };

    let particles = [];
    let texts = [];
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };
    let isDragging = false;
    let shake = 0;
    let reactionTimer = null;

    // Initialization
    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Responsive scaling
        ball.r = Math.min(width, height) * 0.04;
        hoop.w = ball.r * 2.8;
        
        if (gameState === 'MENU') {
            ball.reset(width, height);
            hoop.reset(width, height);
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        audio.init();
        audio.unlock();
        
        if (gameState !== 'PLAYING') return;
        if (ball.state !== 'IDLE') return;

        isDragging = true;
        const pos = getPos(e);
        dragStart = pos;
        dragCurrent = pos;
        ball.state = 'AIMING';
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        if (!isDragging) return;
        dragCurrent = getPos(e);
    }, { passive: false });

    function handleInputEnd(e) {
        e.preventDefault();
        if (!isDragging) return;
        isDragging = false;
        
        if (gameState === 'PLAYING' && ball.state === 'AIMING') {
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 20) {
                // Shoot
                const power = window.gameConfig.dragPower;
                // Cap speed
                const maxSpeed = Math.min(width, height) * 2; 
                ball.vx = Math.min(dx * power * 2.5, maxSpeed);
                ball.vy = Math.min(dy * power * 2.5, maxSpeed);
                ball.state = 'FLYING';
                audio.playSfx('sfx_shoot', 60);
            } else {
                ball.state = 'IDLE';
            }
        }
    }

    canvas.addEventListener('pointerup', handleInputEnd);
    canvas.addEventListener('pointercancel', handleInputEnd);

    // Game Core
    function flashReaction(kind, duration = 1200) {
        const target = kind === 'celebrate' ? reactionCelebration : reactionFail;
        const other = kind === 'celebrate' ? reactionFail : reactionCelebration;
        if (!target || !other) return;
        other.classList.remove('is-visible');
        other.classList.add('hidden');
        target.classList.remove('hidden');
        requestAnimationFrame(() => target.classList.add('is-visible'));
        window.clearTimeout(reactionTimer);
        reactionTimer = window.setTimeout(() => {
            target.classList.remove('is-visible');
            target.classList.add('hidden');
        }, duration);
    }

    function startGame() {
        score = 0;
        lives = 3;
        gameState = 'PLAYING';
        
        uiStart.classList.add('hidden');
        uiGameOver.classList.add('hidden');
        uiHud.classList.remove('hidden');
        
        updateHud();
        ball.reset(width, height);
        hoop.reset(width, height);

        reactionCelebration.classList.add('hidden');
        reactionCelebration.classList.remove('is-visible');
        reactionFail.classList.add('hidden');
        reactionFail.classList.remove('is-visible');

        audio.init();
        audio.unlock();
        audio.playSfx('sfx_ui', 0);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('neon_hoops_best', highScore);
        }
        
        elFinalScore.innerText = score;
        elFinalBest.innerText = highScore;
        
        uiHud.classList.add('hidden');
        uiGameOver.classList.remove('hidden');
        flashReaction('fail', 2200);
        audio.playSfx('sfx_fail', 0);
        audio.stopBgm();
    }

    function updateHud() {
        elScore.innerText = score;
        elBest.innerText = highScore;
        elLives.innerHTML = '';
        for(let i=0; i<lives; i++) {
            const heart = document.createElement('div');
            heart.textContent = '🏀';
            heart.setAttribute('aria-hidden', 'true');
            heart.style.fontSize = '18px';
            heart.style.filter = 'drop-shadow(0 0 8px rgba(255, 157, 72, 0.45))';
            elLives.appendChild(heart);
        }
    }

    // Physics & Logic
    function update(dt) {
        // Shake decay
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;

        // Hoop Movement
        if (gameState === 'PLAYING' || gameState === 'MENU') {
            hoop.x += hoop.speed * hoop.dir * dt;
            const margin = hoop.w;
            if (hoop.x > width - margin) hoop.dir = -1;
            if (hoop.x < margin) hoop.dir = 1;
        }

        // Ball Physics
        if (ball.state === 'FLYING') {
            // Gravity
            ball.vy += window.gameConfig.gravity * 50 * dt;
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            
            // Rotation based on X velocity
            ball.rotation += ball.vx * 0.01 * dt;

            // Wall bounce
            if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.6; }
            if (ball.x > width - ball.r) { ball.x = width - ball.r; ball.vx *= -0.6; }
            
            // Floor / Miss
            if (ball.y > height + ball.r) {
                handleMiss();
            }

            // Hoop Collision
            checkHoopCollision();
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 500 * dt; // gravity
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Popups
        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i];
            t.life -= dt;
            t.y -= 50 * dt;
            if (t.life <= 0) texts.splice(i, 1);
        }
    }

    function checkHoopCollision() {
        // Rim collision (simple circle vs circle on edges)
        const rimY = hoop.y;
        const leftRim = { x: hoop.x - hoop.w/2, y: rimY };
        const rightRim = { x: hoop.x + hoop.w/2, y: rimY };
        const rimRadius = 5;

        // Check Left Rim
        checkRimHit(leftRim, rimRadius);
        // Check Right Rim
        checkRimHit(rightRim, rimRadius);

        // Check Score
        // Ball must be within hoop width, moving downwards, and cross the Y threshold
        if (ball.vy > 0 && 
            ball.x > leftRim.x + ball.r * 0.5 && 
            ball.x < rightRim.x - ball.r * 0.5 &&
            Math.abs(ball.y - rimY) < ball.vy * 0.05 + 10) {
                // Success
                handleScore();
        }
    }

    function checkRimHit(rim, r) {
        const dx = ball.x - rim.x;
        const dy = ball.y - rim.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < ball.r + r) {
            // Bounce
            const angle = Math.atan2(dy, dx);
            const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
            ball.vx = Math.cos(angle) * speed * 0.8;
            ball.vy = Math.sin(angle) * speed * 0.8;
            
            // Push out
            const overlap = (ball.r + r) - dist;
            ball.x += Math.cos(angle) * overlap;
            ball.y += Math.sin(angle) * overlap;
            
            audio.playSfx('sfx_rim', 90);
        }
    }

    function handleScore() {
        score++;
        // Increase difficulty
        hoop.speed = window.gameConfig.hoopSpeedBase + (score * 10);
        
        ball.state = 'IDLE';
        ball.reset(width, height);
        
        // Juice
        shake = 10;
        spawnParticles(hoop.x, hoop.y, window.gameConfig.themeColor);
        spawnText(hoop.x, hoop.y - 50, "+1", "#fff");
        audio.playSfx('sfx_score', 120);
        flashReaction('celebrate', 900);

        updateHud();
    }

    function handleMiss() {
        lives--;
        shake = 5;
        audio.playSfx('sfx_fail', 120);
        flashReaction('fail', 1000);

        if (lives <= 0) {
            gameOver();
        } else {
            ball.reset(width, height);
            spawnText(width/2, height/2, "RIM OUT", "#ff0055");
            updateHud();
        }
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 300,
                vy: (Math.random() - 0.5) * 300 - 100,
                life: 1.0,
                color: color,
                size: Math.random() * 5 + 2
            });
        }
    }

    function spawnText(x, y, str, color) {
        texts.push({ x, y, str, color, life: 1.0 });
    }

    // Rendering
    function draw() {
        // Clear
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, width, height);
        
        // Shake effect
        ctx.save();
        if (shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        }

        // Background grid (Parallax feel)
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 2;
        const gridSize = 50;
        const offset = (Date.now() / 50) % gridSize;
        ctx.beginPath();
        for(let x=0; x<width; x+=gridSize) {
            ctx.moveTo(x, 0); ctx.lineTo(x, height);
        }
        for(let y=offset; y<height; y+=gridSize) {
            ctx.moveTo(0, y); ctx.lineTo(width, y);
        }
        ctx.stroke();

        // Draw Hoop Backboard
        ctx.fillStyle = '#333';
        ctx.fillRect(hoop.x - 20, hoop.y - 60, 40, 60);
        
        // Draw Net (Simple Sine)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        const netTop = hoop.y;
        const netBot = hoop.y + 60;
        const left = hoop.x - hoop.w/2;
        const right = hoop.x + hoop.w/2;
        
        // Net sides
        ctx.moveTo(left, netTop); ctx.lineTo(left + 15, netBot);
        ctx.moveTo(right, netTop); ctx.lineTo(right - 15, netBot);
        
        // Crosses
        for(let i=1; i<4; i++) {
            let y = netTop + i * 15;
            let l = left + i * 3.5;
            let r = right - i * 3.5;
            ctx.moveTo(l, y); ctx.lineTo(r, y);
        }
        ctx.stroke();

        // Draw Rim
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(hoop.x - hoop.w/2, hoop.y);
        ctx.lineTo(hoop.x + hoop.w/2, hoop.y);
        ctx.stroke();

        // Trajectory Line
        if (gameState === 'PLAYING' && ball.state === 'AIMING' && isDragging) {
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            
            let simX = ball.x;
            let simY = ball.y;
            // Cap power for visual consistency
            let simVx = Math.min(dx * window.gameConfig.dragPower * 2.5, width*2);
            let simVy = Math.min(dy * window.gameConfig.dragPower * 2.5, width*2);
            
            ctx.moveTo(simX, simY);
            for(let i=0; i<15; i++) {
                simVy += window.gameConfig.gravity * 50 * 0.05;
                simX += simVx * 0.05;
                simY += simVy * 0.05;
                ctx.lineTo(simX, simY);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Draw Ball
        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.rotation);
        
        // Ball Body
        ctx.beginPath();
        ctx.arc(0, 0, ball.r, 0, Math.PI*2);
        ctx.fillStyle = '#ff7f50';
        ctx.fill();
        
        // Ball Stripes
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -ball.r); ctx.lineTo(0, ball.r);
        ctx.moveTo(-ball.r, 0); ctx.lineTo(ball.r, 0);
        ctx.arc(0, 0, ball.r * 0.6, 0, Math.PI*2);
        ctx.stroke();
        
        // Highlight
        ctx.beginPath();
        ctx.arc(-ball.r*0.3, -ball.r*0.3, ball.r*0.2, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
        
        ctx.restore();

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Floating Text
        texts.forEach(t => {
            ctx.globalAlpha = t.life;
            ctx.fillStyle = t.color;
            ctx.font = "bold 40px 'Russo One'";
            ctx.textAlign = "center";
            ctx.fillText(t.str, t.x, t.y);
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(loop);
    }

    // Listeners
    btnStart.addEventListener('click', startGame);
    btnRestart.addEventListener('click', startGame);
    [btnStart, btnRestart].forEach((btn) => {
        btn.addEventListener('pointerdown', () => {
            audio.init();
            audio.unlock();
            audio.playSfx('sfx_ui', 80);
        }, { passive: true });
    });

    // Initial Render
    resize();
    requestAnimationFrame(loop);
});
</script>
</body>
</html>
