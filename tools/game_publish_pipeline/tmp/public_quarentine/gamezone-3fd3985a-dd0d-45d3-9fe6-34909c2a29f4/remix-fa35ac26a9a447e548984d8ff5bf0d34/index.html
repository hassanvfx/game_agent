<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Shard Dash</title>
    <!-- Tailwind Script -->
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = { corePlugins: { preflight: true } };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root { --sky-top: #07142f; --sky-mid: #123d7a; --sky-bottom: #6fd7ff; --panel-bg: rgba(6, 17, 40, 0.56); --panel-border: rgba(143, 225, 255, 0.42); --panel-glow: rgba(74, 201, 255, 0.28); --text-main: #eefaff; --text-soft: #b9e7ff; --accent: #8df5ff; --accent-2: #ffe37a; --danger: #ff6d8c; }
        body { margin: 0; overflow: hidden; font-family: 'Exo 2', system-ui, sans-serif; background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 48%, var(--sky-bottom)); }
        canvas { display: block; width: 100%; height: 100%; }
        .glass-panel {
            background: linear-gradient(180deg, rgba(11, 28, 58, 0.78), rgba(8, 18, 40, 0.9));
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--panel-border);
            box-shadow: 0 18px 48px rgba(0, 10, 30, 0.42), inset 0 0 0 1px rgba(255,255,255,0.05), 0 0 28px var(--panel-glow);
        }
        .stud-pattern {
            background-image: radial-gradient(rgba(255,255,255,0.08) 14%, transparent 16%);
            background-size: 11px 11px;
        }
        .arcade-display { font-family: 'Orbitron', 'Exo 2', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
        .ui-readable { font-family: 'Exo 2', system-ui, sans-serif; letter-spacing: 0.04em; }
        .score-pop {
            position: absolute;
            left: 50%;
            bottom: 8.5rem;
            transform: translateX(-50%) translateY(18px) scale(0.92);
            width: min(82vw, 260px);
            padding: 0.65rem 0.9rem;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.22);
            background: rgba(8, 16, 36, 0.78);
            color: var(--accent-2);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .score-pop.active { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        .reaction-badge {
            position: absolute;
            right: 0.9rem;
            bottom: 7rem;
            width: min(28vw, 108px);
            aspect-ratio: 1;
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.22);
            background: rgba(8, 16, 36, 0.72);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            opacity: 0;
            transform: scale(0.78) translateY(12px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .reaction-badge.active { opacity: 1; transform: scale(1) translateY(0); }
        .reaction-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reaction-badge.fail {
            left: 50%;
            right: auto;
            bottom: 10.5rem;
            width: min(34vw, 132px);
            transform: translateX(-50%) scale(0.82) translateY(10px);
        }
        .reaction-badge.fail.active {
            transform: translateX(-50%) scale(1) translateY(0);
        }
        #game-container::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 20% 18%, rgba(255,255,255,0.18), transparent 24%), radial-gradient(circle at 80% 12%, rgba(141,245,255,0.22), transparent 22%), linear-gradient(180deg, rgba(255,255,255,0.04), transparent 28%, rgba(0,0,0,0.08) 100%);
            mix-blend-mode: screen;
        }
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(transparent 0, transparent calc(100% - 1px), rgba(255,255,255,0.03) calc(100% - 1px));
            background-size: 100% 4px;
            opacity: 0.25;
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto hover:scale-105 transition duration-300 transform">
                <h1 class="arcade-display text-6xl font-extrabold text-white mb-2 drop-shadow-[0_4px_0_rgba(0,0,0,0.2)] tracking-wider">SKY SHARD DASH</h1>
                <p class="ui-readable text-white font-bold text-xl mb-8 drop-shadow-md">Leap across hazard rails. Grab every sky shard you can.</p>
                <button id="start-btn" class="arcade-display bg-green-500 hover:bg-green-400 border-b-4 border-green-700 text-white font-black py-4 px-12 rounded-xl text-2xl shadow-xl active:border-b-0 active:translate-y-1 transition-all">START RUN</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-3xl text-center pointer-events-auto">
                <h2 class="arcade-display text-5xl font-black text-red-500 mb-2 drop-shadow-sm">RUN LOST</h2>
                <div class="ui-readable text-2xl text-white font-bold mb-6">Shards banked: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="arcade-display bg-blue-500 hover:bg-blue-400 border-b-4 border-blue-700 text-white font-black py-3 px-10 rounded-xl text-xl shadow-xl active:border-b-0 active:translate-y-1 transition-all">RUN AGAIN</button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="absolute top-6 left-6 flex gap-4 hidden">
                <div class="bg-black/40 p-3 rounded-lg border-2 border-white/20 backdrop-blur-sm">
                    <span class="ui-readable text-yellow-400 font-black text-2xl drop-shadow-md">SHARDS <span id="score" class="text-white">0</span></span>
                </div>
            </div>
            
            <!-- Jump Hint for Mobile -->
            <div id="tutorial" class="ui-readable absolute bottom-20 text-white/80 font-bold text-xl animate-pulse hidden pointer-events-none">
                TAP TO DOUBLE JUMP
            </div>
            <div id="score-pop" class="score-pop arcade-display pointer-events-none">Shard streak +10</div>
            <div id="pickup-gif" class="reaction-badge pointer-events-none" aria-hidden="true">
                <img src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp" alt="Shard pickup reaction">
            </div>
            <div id="fail-gif" class="reaction-badge fail pointer-events-none" aria-hidden="true">
                <img src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Run failed reaction">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                coin: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                pickup: "https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp",
                fail: "https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.bgmStarted = false;
                this.sfx = {};
                this.lastPlay = {};
                this.volumes = { start: 0.55, jump: 0.45, land: 0.33, coin: 0.6, fail: 0.7 };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            armAudio() {
                if (this.bgmStarted) return;
                this.bgmStarted = true;
                this.bgm.play().catch(() => {
                    this.bgmStarted = false;
                });
            }

            playBGM() {
                this.armAudio();
            }
            
            stopBGM() { 
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
                this.bgmStarted = false;
            }

            playSFX(key, cooldown = 90) {
                const now = performance.now();
                if (!this.sfx[key]) return;
                if (this.lastPlay[key] && now - this.lastPlay[key] < cooldown) return;
                this.lastPlay[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.volumes[key] ?? 0.55;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();
        const scorePop = document.getElementById('score-pop');
        const pickupGif = document.getElementById('pickup-gif');
        const failGif = document.getElementById('fail-gif');
        let overlayTimers = { score: null, pickup: null, fail: null };

        /** 3. GAME STATE & VARIABLES */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let gameSpeed = 6;
        let frameCount = 0;
        let wasGrounded = false;

        // Player
        let player = {
            x: 100,
            y: 0,
            w: 40,
            h: 80, // Composite height
            vy: 0,
            onGround: false,
            jumpCount: 0,
            maxJumps: 2
        };

        // Entities
        let platforms = [];
        let particles = [];
        let coins = [];
        let clouds = [];

        // Constants
        const GRAVITY = 0.6;
        const JUMP_FORCE = -14;
        const COLORS = {
            skyTop: '#60a5fa',
            skyBot: '#bae6fd',
            stud: '#9ca3af', // Grey platform
            studTop: '#d1d5db',
            lava: '#ef4444', // Red kill brick
            lavaTop: '#f87171',
            coin: '#facc15'
        };

        // Resize Handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            document.body.style.minHeight = `${height}px`;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. PARALLAX & VISUALS */
        function initClouds() {
            clouds = [];
            for(let i=0; i<8; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height/2),
                    w: 60 + Math.random() * 100,
                    h: 30 + Math.random() * 40,
                    speed: 0.2 + Math.random() * 0.3
                });
            }
        }

        function drawBackground() {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(1, COLORS.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            clouds.forEach(c => {
                c.x -= c.speed;
                if(c.x + c.w < 0) {
                    c.x = width;
                    c.y = Math.random() * (height/2);
                }
                
                // Draw rounded rect cloud
                ctx.beginPath();
                ctx.roundRect(c.x, c.y, c.w, c.h, 20);
                ctx.fill();
            });
        }

        function drawStuds(x, y, w, h, color) {
            // Main block
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            
            // 3D Bevel effect
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x, y + h - 5, w, 5); // Bottom shadow
            ctx.fillRect(x + w - 5, y, 5, h); // Right shadow
            
            // Studs on top
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            const studSize = 8;
            const gap = 15;
            for(let sx = x + 5; sx < x + w - 5; sx += gap) {
                ctx.fillRect(sx, y, studSize, 4);
            }
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            gameSpeed = 6;
            player.y = height / 2;
            player.vy = 0;
            player.jumpCount = 0;
            
            platforms = [];
            coins = [];
            particles = [];
            
            // Starting platform
            platforms.push({ x: 0, y: height - 150, w: width, h: 150, type: 'safe' });
            
            initClouds();
            wasGrounded = false;
            scorePop.classList.remove('active');
            pickupGif.classList.remove('active');
            failGif.classList.remove('active');
            document.getElementById('score').innerText = score;
        }

        function spawnPlatform() {
            const lastPlat = platforms[platforms.length - 1];
            // Gap calculation
            const minGap = 100;
            const maxGap = 220;
            const gap = minGap + Math.random() * (maxGap - minGap);
            
            // Height variation
            let y = lastPlat.y + (Math.random() * 100 - 50);
            if (y > height - 100) y = height - 100;
            if (y < height - 300) y = height - 300;
            
            const w = 150 + Math.random() * 300;
            
            // Chance for lava section (red block on top of grey platform)
            // Or just a lava platform? Let's do lava segments.
            // Simplified: Platform type.
            let type = 'safe';
            if (Math.random() > 0.7 && score > 5) type = 'lava'; // Lava platforms appear later

            // If lava, make it wider so it's a challenge, but not impossible (player needs to jump over it usually, but here we just make lava platforms kill you on touch)
            // Actually, typical Obby: Jump ON grey, avoid RED.
            // So lava platforms are "Kill Bricks". You must jump OVER them.
            // Strategy: Spawn a safe platform, then maybe a small lava gap, or a lava block ON the platform.
            // Let's stick to simple: Platforms are safe. Gaps are death.
            // OCCASIONALLY spawn a "Trap" platform that is red.
            
            if (type === 'lava') {
                // Lava platform: Must jump over it entirely or land on a small safe spot?
                // Let's make it simple: Red platforms kill you. You have to double jump over them.
                // To make it fair, lava platforms are shorter.
                // Actually, let's just do obstacles ON platforms.
            }

            // New logic: Just safe platforms with gaps for now to ensure MVP playability.
            // Let's add "Lava Blocks" sitting ON the platform.
            
            let platform = { x: lastPlat.x + lastPlat.w + gap, y: y, w: w, h: 150, type: 'safe', hasLava: false };
            
            if (Math.random() > 0.6 && w > 200) {
                platform.hasLava = true;
                platform.lavaX = 50 + Math.random() * (w - 100); // Relative to platform start
                platform.lavaW = 40 + Math.random() * 40;
            }

            platforms.push(platform);

            // Spawn Coin
            if (Math.random() > 0.3) {
                coins.push({
                    x: platform.x + platform.w / 2,
                    y: platform.y - 60 - (Math.random() * 100),
                    r: 15,
                    collected: false
                });
            }
        }

        function showOverlay(key, element, text) {
            if (!element) return;
            if (typeof text === 'string') element.textContent = text;
            element.classList.add('active');
            clearTimeout(overlayTimers[key]);
            overlayTimers[key] = setTimeout(() => element.classList.remove('active'), key === 'fail' ? 1800 : 650);
        }

        function updatePlayer() {
            // Gravity
            player.vy += GRAVITY;
            player.y += player.vy;

            const wasOnGroundBeforeStep = wasGrounded;

            // Ground Collision
            player.onGround = false;
            
            // Check collisions with platforms
            // Simple AABB
            // Player box: x, y, w, h
            // Platform box: x, y, w, h
            
            // Optimize: Only check nearby platforms
            for (let p of platforms) {
                // Check if player is above platform and falling
                if (player.vy >= 0 && 
                    player.x + player.w > p.x && 
                    player.x < p.x + p.w &&
                    player.y + player.h >= p.y &&
                    player.y + player.h <= p.y + 20 // Tolerance
                   ) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    player.jumpCount = 0;
                    
                    // Check Lava on Platform
                    if (p.hasLava) {
                        // Lava Box relative to screen
                        let lx = p.x + p.lavaX;
                        let lw = p.lavaW;
                        
                        // If player touches lava
                        if (player.x + player.w > lx && player.x < lx + lw) {
                            // Player is on the lava part
                            gameOver();
                        }
                    }
                }
            }

            // Death by void
            if (player.y > height) {
                gameOver();
            }
        }

        function updateEntities() {
            // Move Platforms
            if (platforms.length > 0) {
                if (platforms[platforms.length - 1].x < width + 200) {
                    spawnPlatform();
                }
            }

            for (let i = platforms.length - 1; i >= 0; i--) {
                platforms[i].x -= gameSpeed;
                if (platforms[i].x + platforms[i].w < -100) {
                    platforms.splice(i, 1);
                }
            }

            // Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.x -= gameSpeed;
                
                // Collision
                let dx = (player.x + player.w / 2) - c.x;
                let dy = (player.y + player.h / 2) - c.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < c.r + player.w / 2) {
                    // Collect
                    score += 10; // Sky shard value
                    document.getElementById('score').innerText = score;
                    audio.playSFX('coin', 80);
                    showOverlay('score', scorePop, 'Shard streak +10');
                    showOverlay('pickup', pickupGif);
                    createParticles(c.x, c.y, COLORS.coin);
                    coins.splice(i, 1);
                } else if (c.x < -50) {
                    coins.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
            
            // Speed up slightly
            gameSpeed += 0.001;
        }

        function createParticles(x, y, color) {
            for(let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, width, height);
            
            drawBackground();

            // Draw Platforms
            platforms.forEach(p => {
                drawStuds(p.x, p.y, p.w, p.h, COLORS.stud);
                
                // Draw Lava if exists
                if (p.hasLava) {
                    const lx = p.x + p.lavaX;
                    const ly = p.y - 10; // Slightly raised
                    const lw = p.lavaW;
                    const lh = 10;
                    
                    ctx.fillStyle = COLORS.lava;
                    ctx.fillRect(lx, ly, lw, lh + 10); // Extend down into platform
                    
                    // Neon glow for lava
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'red';
                    ctx.fillStyle = COLORS.lavaTop;
                    ctx.fillRect(lx + 2, ly + 2, lw - 4, lh - 4);
                    ctx.shadowBlur = 0;
                }
            });

            // Draw Coins
            coins.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                // Rotate coin effect
                const scale = Math.sin(Date.now() / 200);
                ctx.scale(scale, 1);
                
                ctx.beginPath();
                ctx.arc(0, 0, c.r, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.coin;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#b45309';
                ctx.stroke();
                
                // Inner $
                ctx.fillStyle = '#b45309';
                ctx.font = '700 15px "Exo 2"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 1);
                
                ctx.restore();
            });

            // Draw Player (Noob Style)
            const headSize = 20;
            const torsoH = 30;
            const legH = 30;
            
            // Bobbing animation
            let bob = 0;
            if (!player.onGround) bob = -5; // Stretch when jumping

            ctx.save();
            ctx.translate(player.x, player.y + bob);

            // Legs (Green)
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, headSize + torsoH, player.w, legH);
            ctx.fillStyle = '#166534';
            if (Math.floor(Date.now() / 100) % 2 === 0 && player.onGround) {
                ctx.fillRect(player.w / 2 - 1, headSize + torsoH, 2, legH);
            }

            // Torso (Blue)
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(0, headSize, player.w, torsoH);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(player.w / 2, headSize + torsoH / 2, 8, 0, Math.PI * 2);
            ctx.fill();

            // Head (Yellow)
            ctx.fillStyle = '#facc15';
            ctx.fillRect(5, 0, player.w - 10, headSize);
            
            // Face
            ctx.fillStyle = 'black';
            ctx.fillRect(12, 6, 4, 4);
            ctx.fillRect(24, 6, 4, 4);
            ctx.fillRect(16, 14, 8, 2);

            ctx.restore();

            // Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 6, 6);
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            
            updatePlayer();
            updateEntities();
            drawGame();
            
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 250);
            showOverlay('fail', failGif);
            gameContainer.style.touchAction = 'manipulation';
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('tutorial').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (!gameActive) return;
            
            if (player.jumpCount < player.maxJumps) {
                player.vy = JUMP_FORCE;
                player.jumpCount++;
                player.onGround = false;
                
                audio.playSFX('jump', 100);
                createParticles(player.x + player.w / 2, player.y + player.h, '#fff');
            }
        }

        /** 6. CONTROLS */
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameContainer = document.getElementById('game-container');
        
        startBtn.addEventListener('click', () => {
            audio.playSFX('start', 250);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            gameContainer.style.touchAction = 'none';
            gameActive = true;
            initGame();
            gameLoop();
        });

        restartBtn.addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            failGif.classList.remove('active');
            audio.playSFX('start', 250);
            audio.playBGM();
            gameContainer.style.touchAction = 'none';
            gameActive = true;
            initGame();
            gameLoop();
        });

        // Global Input
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        });

        gameContainer.style.touchAction = 'manipulation';
        gameContainer.addEventListener('touchstart', (e) => {
            if (gameActive && e.target === canvas) {
                e.preventDefault(); // Prevent scroll only on the gameplay surface
                jump();
            }
        }, { passive: false });
        
        window.addEventListener('mousedown', (e) => {
            if (gameActive && e.target.tagName !== 'BUTTON') {
                jump();
            }
        });
        
    });
    </script>
</body>
</html>
