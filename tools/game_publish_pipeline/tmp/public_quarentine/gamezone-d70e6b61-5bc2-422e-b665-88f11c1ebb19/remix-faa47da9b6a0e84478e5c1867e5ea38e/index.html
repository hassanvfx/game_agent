<body>

    <div id="game-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <img id="pickup-gif" class="feedback-gif" alt="Star streak reaction" src="https://i.giphy.com/443DE4MxVGnbM8vCi6.webp">
        <img id="trip-gif" class="feedback-gif" alt="Trip fail reaction" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">

        <!-- HUD -->
        <div id="hud" class="hud hidden">
            <div class="panel hud-card">
                <span class="hud-label">Trail</span>
                <span class="hud-value" id="score-display">0</span>
                <span class="hud-badge"><span class="hud-emoji">🏃</span> keep running</span>
            </div>
            <div class="panel hud-card right">
                <span class="hud-label">Stars</span>
                <span class="hud-value" id="coin-display">0</span>
                <span class="hud-badge"><span class="hud-emoji">⭐</span> trail stash</span>
            </div>
        </div>

        <!-- Controls -->
        <div id="game-controls" class="hidden">
            <div class="controls-row">
                <!-- Joystick -->
                <div id="joystick-container" class="control-zone">
                    <div id="joystick-base"></div>
                    <div id="joystick-knob"></div>
                </div>

                <!-- Jump Button -->
                <button id="jump-btn" class="control-zone" aria-label="Jump">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen overlay-start">
            <div class="panel menu-card">
                <div class="spark-strip" aria-hidden="true">
                    <span>🍁</span>
                    <span>✨</span>
                    <span>⭐</span>
                    <span>🍂</span>
                </div>
                <div class="chip">ENDLESS TRAIL</div>
                <div class="hero-avatar" aria-hidden="true"></div>
                <h1 class="title">AUTUMN<br><span class="title-accent">TRAIL RUN</span></h1>
                <p class="subtitle">Guide the leaf-dashing runner through the forest, dodge rough hazards, and scoop up every star on the path.</p>

                <div class="actions">
                    <button id="start-btn" class="btn-action">Start Run</button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen overlay-gameover hidden">
            <div class="panel menu-card">
                <div class="spark-strip" aria-hidden="true">
                    <span>💥</span>
                    <span>🍂</span>
                    <span>⚠️</span>
                    <span>🌟</span>
                </div>
                <h2 class="game-over-title">TRIP!</h2>
                <p class="game-over-text" id="death-msg">Your trail run is over.</p>

                <div class="stats-panel">
                    <div class="stat-row">
                        <span class="stat-label">Best Trail</span>
                        <span class="stat-value" id="final-score">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Stars</span>
                        <span class="stat-value" id="final-coins">0</span>
                    </div>
                </div>

                <div class="actions">
                    <button id="restart-btn" class="btn-action">Run Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
        // --- AUDIO SYSTEM ---
        class AudioController {
            constructor() {
                this.enabled = false;
                this.started = false;
                this.sfx = {
                    start: this.createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3', 0.5),
                    click: this.createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3', 0.45),
                    jump: this.createAudio('https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3', 0.5),
                    land: this.createAudio('https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3', 0.42),
                    pickup: this.createAudio('https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3', 0.38),
                    crash: this.createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3', 0.52)
                };
                this.loop = this.createAudio('https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3', 0.2, true);
            }

            createAudio(src, volume, loop=false) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = volume;
                audio.playsInline = true;
                return audio;
            }

            async unlock() {
                if (this.enabled) return;
                this.enabled = true;
                const all = [...Object.values(this.sfx), this.loop];
                await Promise.all(all.map(async (clip) => {
                    try {
                        clip.load();
                    } catch (err) {}
                }));
            }

            async startLoop() {
                if (!this.enabled) return;
                try {
                    this.loop.currentTime = 0;
                    await this.loop.play();
                    this.started = true;
                } catch (err) {}
            }

            stopLoop(reset=false) {
                try {
                    this.loop.pause();
                    if (reset) this.loop.currentTime = 0;
                } catch (err) {}
                this.started = false;
            }

            async play(name, { reset=true } = {}) {
                if (!this.enabled) return;
                const clip = this.sfx[name];
                if (!clip) return;
                try {
                    if (reset) clip.currentTime = 0;
                    await clip.play();
                } catch (err) {}
            }

            playStart() { return this.play('start'); }
            playClick() { return this.play('click'); }
            playJump() { return this.play('jump'); }
            playLand() { return this.play('land', { reset: true }); }
            playCoin() { return this.play('pickup'); }
            playCrash() { return this.play('crash'); }
        }
        const audio = new AudioController();

        // --- FEEDBACK OVERLAYS ---
        class FeedbackController {
            constructor() {
                this.pickupGif = document.getElementById('pickup-gif');
                this.tripGif = document.getElementById('trip-gif');
                this.timers = new Map();
            }

            show(key, duration=1200) {
                const element = key === 'pickup' ? this.pickupGif : this.tripGif;
                if (!element) return;
                element.classList.add('visible');
                if (this.timers.has(key)) clearTimeout(this.timers.get(key));
                this.timers.set(key, setTimeout(() => {
                    element.classList.remove('visible');
                    this.timers.delete(key);
                }, duration));
            }

            hideAll() {
                this.pickupGif?.classList.remove('visible');
                this.tripGif?.classList.remove('visible');
                for (const timer of this.timers.values()) clearTimeout(timer);
                this.timers.clear();
            }
        }
        const feedback = new FeedbackController();

        // --- INPUT SYSTEM ---
        const input = { x: 0, y: 0, active: false };

        class InputManager {
            constructor() {
                this.joystickContainer = document.getElementById('joystick-container');
                this.knob = document.getElementById('joystick-knob');
                this.jumpBtn = document.getElementById('jump-btn');

                this.center = { x: 0, y: 0 };
                this.activePtrId = null;
                this.maxRadius = 50;

                this.setupJoystick();
                this.setupJump();
            }

            setupJoystick() {
                const start = (e) => {
                    if (this.activePtrId !== null) return;
                    e.preventDefault();
                    const rect = this.joystickContainer.getBoundingClientRect();
                    this.center = {
                        x: rect.left + rect.width / 2,
                        y: rect.top + rect.height / 2
                    };
                    this.activePtrId = e.pointerId;
                    this.joystickContainer.setPointerCapture(e.pointerId);
                    this.updateKnob(e.clientX, e.clientY);
                    input.active = true;
                };

                const move = (e) => {
                    if (e.pointerId !== this.activePtrId) return;
                    e.preventDefault();
                    this.updateKnob(e.clientX, e.clientY);
                };

                const end = (e) => {
                    if (e.pointerId !== this.activePtrId) return;
                    e.preventDefault();
                    this.activePtrId = null;
                    this.resetKnob();
                    input.active = false;
                };

                this.joystickContainer.addEventListener('pointerdown', start);
                this.joystickContainer.addEventListener('pointermove', move);
                this.joystickContainer.addEventListener('pointerup', end);
                this.joystickContainer.addEventListener('pointercancel', end);
            }

            updateKnob(clientX, clientY) {
                const dx = clientX - this.center.x;
                const dy = clientY - this.center.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                let actualX = dx;
                let actualY = dy;

                if (dist > this.maxRadius) {
                    const ratio = this.maxRadius / dist;
                    actualX = dx * ratio;
                    actualY = dy * ratio;
                }

                this.knob.style.transform = `translate(${actualX}px, ${actualY}px)`;
                input.x = actualX / this.maxRadius;
                input.y = actualY / this.maxRadius;
            }

            resetKnob() {
                this.knob.style.transform = `translate(0px, 0px)`;
                input.x = 0;
                input.y = 0;
            }

            setupJump() {
                const triggerJump = (e) => {
                    e.preventDefault();
                    audio.unlock();
                    jump();
                };
                /* [agent-note][stage4] repaired: mobile-action-path | element: #jump-btn | action: scoped pointer activation to avoid duplicate touch/mouse firing */
                this.jumpBtn.addEventListener('pointerdown', triggerJump);
            }
        }

        // --- THREE.JS SETUP ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();

        // Autumn Sunset Colors
        const skyColor = 0xfdba74;
        scene.background = new THREE.Color(skyColor);
        scene.fog = new THREE.Fog(skyColor, 15, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambLight = new THREE.AmbientLight(0xffccaa, 0.6);
        scene.add(ambLight);

        const dirLight = new THREE.DirectionalLight(0xfff7ed, 0.9);
        dirLight.position.set(25, 40, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // --- MATERIALS ---
        function createNoiseTexture(colorBase, noiseColor, scale=1) {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = colorBase;
            ctx.fillRect(0,0,size,size);

            for(let i=0; i<600 * scale; i++) {
                ctx.fillStyle = noiseColor;
                ctx.globalAlpha = 0.1 + Math.random() * 0.2;
                const x = Math.random() * size;
                const y = Math.random() * size;
                const w = Math.random() * 4 * scale;
                const h = Math.random() * 4 * scale;
                ctx.fillRect(x,y,w,h);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.NearestFilter;
            tex.magFilter = THREE.NearestFilter;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // Autumn Palette
        const MAT = {
            grass: new THREE.MeshStandardMaterial({
                map: createNoiseTexture('#d97706', '#92400e', 1),
                roughness: 1.0
            }),
            dirt: new THREE.MeshStandardMaterial({
                map: createNoiseTexture('#78350f', '#451a03', 2),
                roughness: 1.0
            }),
            star: new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xffaa00, roughness: 0.2 }),
            wood: new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 1.0 }),
            leaves: new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.9 }),
            leaves2: new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.9 }),
            rock: new THREE.MeshStandardMaterial({ color: 0x57534e, roughness: 0.8 }),
            skin: new THREE.MeshStandardMaterial({ color: 0xfde047 }),
            shirt: new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.85 }),
            shirtTrim: new THREE.MeshStandardMaterial({ color: 0x93c5fd, emissive: 0x1d4ed8, emissiveIntensity: 0.2, roughness: 0.6 }),
            pants: new THREE.MeshStandardMaterial({ color: 0x1e293b }),
            scarf: new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x7f1d1d, emissiveIntensity: 0.18, roughness: 0.7 }),
            shoe: new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 }),
            face: new THREE.MeshStandardMaterial({ color: 0x2b130a, roughness: 0.9 }),
            blush: new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0xc2410c, emissiveIntensity: 0.15, roughness: 0.7 })
        };

        // --- PLAYER ---
        let player, playerBody = {};
        const playerGroup = new THREE.Group();

        function createPlayer() {
            const group = new THREE.Group();

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.38), MAT.skin);
            head.position.y = 0.9;
            head.castShadow = true;
            group.add(head);
            playerBody.head = head;

            const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.05, 12), MAT.leaves2);
            hatBrim.position.set(0, 1.06, 0);
            hatBrim.castShadow = true;
            group.add(hatBrim);

            const hatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.18, 12), MAT.leaves);
            hatTop.position.set(0, 1.16, 0);
            hatTop.castShadow = true;
            group.add(hatTop);

            const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.04), MAT.face);
            lEye.position.set(-0.08, 0.93, 0.2);
            group.add(lEye);

            const rEye = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.04), MAT.face);
            rEye.position.set(0.08, 0.93, 0.2);
            group.add(rEye);

            const smile = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.025, 0.025), MAT.face);
            smile.position.set(0, 0.82, 0.2);
            group.add(smile);

            const blushL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.03, 0.02), MAT.blush);
            blushL.position.set(-0.12, 0.84, 0.19);
            group.add(blushL);

            const blushR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.03, 0.02), MAT.blush);
            blushR.position.set(0.12, 0.84, 0.19);
            group.add(blushR);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.5, 0.28), MAT.shirt);
            torso.position.y = 0.46;
            torso.castShadow = true;
            group.add(torso);
            playerBody.torso = torso;

            const chestStripe = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.14, 0.04), MAT.shirtTrim);
            chestStripe.position.set(0, 0.5, 0.16);
            chestStripe.castShadow = true;
            group.add(chestStripe);

            const scarf = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.12, 0.3), MAT.scarf);
            scarf.position.set(0, 0.67, 0.01);
            scarf.castShadow = true;
            group.add(scarf);
            playerBody.scarf = scarf;

            const scarfTail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.28, 0.06), MAT.scarf);
            scarfTail.position.set(-0.22, 0.47, -0.09);
            scarfTail.castShadow = true;
            group.add(scarfTail);
            playerBody.scarfTail = scarfTail;

            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.5, 0.2), MAT.skin);
            lArm.position.set(-0.36, 0.45, 0);
            lArm.castShadow = true;
            group.add(lArm);
            playerBody.lArm = lArm;

            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.5, 0.2), MAT.skin);
            rArm.position.set(0.36, 0.45, 0);
            rArm.castShadow = true;
            group.add(rArm);
            playerBody.rArm = rArm;

            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), MAT.pants);
            lLeg.position.set(-0.12, -0.05, 0);
            lLeg.castShadow = true;
            group.add(lLeg);
            playerBody.lLeg = lLeg;

            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), MAT.pants);
            rLeg.position.set(0.12, -0.05, 0);
            rLeg.castShadow = true;
            group.add(rLeg);
            playerBody.rLeg = rLeg;

            const lShoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.28), MAT.shoe);
            lShoe.position.set(-0.12, -0.34, 0.05);
            lShoe.castShadow = true;
            group.add(lShoe);
            playerBody.lShoe = lShoe;

            const rShoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.28), MAT.shoe);
            rShoe.position.set(0.12, -0.34, 0.05);
            rShoe.castShadow = true;
            group.add(rShoe);
            playerBody.rShoe = rShoe;

            group.position.y = 0.5;
            return group;
        }

        player = createPlayer();
        playerGroup.add(player);
        scene.add(playerGroup);

        // --- GAME STATE ---
        let state = {
            active: false,
            score: 0,
            maxDist: 0,
            coins: 0,
            nextChunkZ: 0,
            walkTime: 0
        };

        let physics = {
            vx: 0,
            vz: 0,
            vy: 0,
            gravity: -40,
            jumpForce: 13,
            grounded: false,
            jumpCount: 0,
            moveSpeed: 10
        };

        let chunks = [];
        let obstacles = [];
        let scenery = [];
        let wasGrounded = false;

        // --- LEVEL GEN ---
        function createTree(x, z, parent) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.5, 6), MAT.wood);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            group.add(trunk);

            const mat = Math.random() > 0.5 ? MAT.leaves : MAT.leaves2;
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 7), mat);
            leaves.position.y = 2.0;
            leaves.castShadow = true;
            group.add(leaves);

            group.userData = { isObstacle: true, type: 'tree', radius: 0.5, height: 3 };

            if (parent) parent.add(group);
            obstacles.push(group);
            return group;
        }

        function createRock(x, z, parent) {
            const s = 0.5 + Math.random() * 0.4;
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), MAT.rock);
            rock.position.set(x, s*0.6, z);
            rock.castShadow = true;
            rock.rotation.set(Math.random(), Math.random(), Math.random());

            rock.userData = { isObstacle: true, type: 'rock', radius: s * 0.8, height: s * 1.5 };

            if (parent) parent.add(rock);
            obstacles.push(rock);
            return rock;
        }

        function createStar(x, z, parent) {
            const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.3, 0), MAT.star);
            star.position.set(x, 1.0, z);
            star.userData = { isCoin: true, active: true };
            star.castShadow = true;
            if (parent) parent.add(star);
            return star;
        }

        function createChunk(zStart) {
            const width = 24;
            const length = 24;
            const h = 2;

            const geo = new THREE.BoxGeometry(width, h, length);
            const mesh = new THREE.Mesh(geo, [MAT.dirt, MAT.dirt, MAT.grass, MAT.dirt, MAT.dirt, MAT.dirt]);

            const zCenter = zStart - length/2;
            mesh.position.set(0, -h/2, zCenter);
            mesh.receiveShadow = true;
            mesh.userData = { zEnd: zStart - length };

            scene.add(mesh);
            chunks.push(mesh);

            const obsCount = Math.floor(Math.random() * 6) + 2;
            for(let i=0; i<obsCount; i++) {
                const ox = (Math.random() - 0.5) * (width - 4);
                const oz = (Math.random() - 0.5) * (length - 4);

                if (zStart > -10 && Math.abs(ox) < 3) continue;

                if (Math.random() > 0.3) {
                    const t = createTree(ox, oz, mesh);
                    t.updateMatrixWorld();
                } else {
                    const r = createRock(ox, oz, mesh);
                    r.updateMatrixWorld();
                }
            }

            if (Math.random() > 0.4) {
                const cx = (Math.random() - 0.5) * (width - 6);
                const cz = (Math.random() - 0.5) * (length - 6);
                const star = createStar(cx, cz, mesh);
                mesh.userData.star = star;
            }

            return zStart - length;
        }

        function initLevel() {
            chunks.forEach(c => scene.remove(c));
            obstacles = [];
            chunks = [];
            scenery.forEach(s => scene.remove(s));
            scenery = [];

            state.nextChunkZ = 0;
            for(let i=0; i<5; i++) {
                state.nextChunkZ = createChunk(state.nextChunkZ);
            }
        }

        // --- PHYSICS & LOGIC ---
        const raycaster = new THREE.Raycaster();
        const down = new THREE.Vector3(0, -1, 0);

        function updatePhysics(dt) {
            const targetVx = input.x * physics.moveSpeed;
            const targetVz = input.y * physics.moveSpeed;

            physics.vx += (targetVx - physics.vx) * 10 * dt;
            physics.vz += (targetVz - physics.vz) * 10 * dt;

            playerGroup.position.x += physics.vx * dt;
            playerGroup.position.z += physics.vz * dt;

            const speed = Math.sqrt(physics.vx*physics.vx + physics.vz*physics.vz);
            if (speed > 0.5) {
                const angle = Math.atan2(physics.vx, physics.vz);
                const targetRot = angle;
                let rotDiff = targetRot - playerGroup.rotation.y;
                while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
                while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
                playerGroup.rotation.y += rotDiff * 10 * dt;
            }

            const currentDist = -playerGroup.position.z;
            if (currentDist > state.maxDist) {
                state.maxDist = currentDist;
                state.score = Math.floor(state.maxDist);
                updateHUD();
            }

            physics.vy += physics.gravity * dt;
            playerGroup.position.y += physics.vy * dt;

            raycaster.set(new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z), down);
            const hits = raycaster.intersectObjects(chunks);

            physics.grounded = false;
            if (hits.length > 0) {
                const hit = hits[0];
                if (hit.distance < 0.55 && physics.vy <= 0) {
                    playerGroup.position.y = hit.point.y;
                    physics.vy = 0;
                    physics.grounded = true;
                    physics.jumpCount = 0;
            wasGrounded = false;
                }
            }

            if (playerGroup.position.y < -5) {
                gameOver("You dropped off the trail.");
                return;
            }

            if (physics.grounded && !wasGrounded && state.active) {
                audio.playLand();
            }
            wasGrounded = physics.grounded;

            const pCenter = playerGroup.position.clone();
            pCenter.y += 0.5;

            for (let obs of obstacles) {
                const obsPos = new THREE.Vector3();
                obs.getWorldPosition(obsPos);

                if (Math.abs(obsPos.z - pCenter.z) > 5) continue;

                const dx = obsPos.x - pCenter.x;
                const dz = obsPos.z - pCenter.z;
                const distXZ = Math.sqrt(dx*dx + dz*dz);

                if (distXZ < (obs.userData.radius + 0.3)) {
                    const obsTop = obsPos.y + obs.userData.height;
                    const playerBottom = playerGroup.position.y;

                    if (playerBottom < obsTop * 0.8) {
                        gameOver("You crashed into a " + obs.userData.type + ".");
                        return;
                    }
                }
            }

            chunks.forEach(c => {
                if (c.userData.star && c.userData.star.userData.active) {
                    const s = c.userData.star;
                    const sPos = new THREE.Vector3();
                    s.getWorldPosition(sPos);
                    s.rotation.y += dt * 3;

                    if (pCenter.distanceTo(sPos) < 1.5) {
                        s.userData.active = false;
                        s.visible = false;
                        state.coins++;
                        audio.playCoin();
                        feedback.show('pickup', 1100);
                        updateHUD();
                    }
                }
            });

            if (playerGroup.position.z < state.nextChunkZ + 60) {
                state.nextChunkZ = createChunk(state.nextChunkZ);
            }

            for (let i = chunks.length - 1; i >= 0; i--) {
                if (chunks[i].userData.zEnd > playerGroup.position.z + 40) {
                    const old = chunks.splice(i, 1)[0];
                    scene.remove(old);
                    obstacles = obstacles.filter(o => {
                        const wPos = new THREE.Vector3();
                        o.getWorldPosition(wPos);
                        return wPos.z < playerGroup.position.z + 40;
                    });
                }
            }
        }

        function jump() {
            if (!state.active) return;
            if (physics.grounded) {
                physics.vy = physics.jumpForce;
                physics.grounded = false;
                physics.jumpCount = 1;
                audio.playJump();
            } else if (physics.jumpCount < 2) {
                physics.vy = physics.jumpForce * 0.9;
                physics.jumpCount = 2;
                audio.playJump();
            }
        }

        function gameOver(msg) {
            state.active = false;
            audio.stopLoop();
            audio.playCrash();
            feedback.show('trip', 1800);
            document.getElementById('death-msg').innerText = msg;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score;
            document.getElementById('final-coins').innerText = state.coins;
        }

        function resetGame() {
            audio.unlock();
            audio.playClick();
            audio.playStart();
            audio.startLoop();
            feedback.hideAll();
            state.active = true;
            state.score = 0;
            state.maxDist = 0;
            state.coins = 0;
            state.walkTime = 0;

            physics.vx = 0;
            physics.vz = 0;
            physics.vy = 0;
            physics.grounded = false;
            physics.jumpCount = 0;
            wasGrounded = false;

            playerGroup.visible = true;
            playerGroup.position.set(0, 2, 0);
            playerGroup.rotation.set(0, 0, 0);

            camera.position.set(0, 8, 12);
            camera.lookAt(0, 0, 0);

            initLevel();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-controls').classList.remove('hidden');
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = state.score;
            document.getElementById('coin-display').innerText = state.coins;
        }

        // --- ANIMATION ---
        function animatePlayer(dt) {
            const speed = Math.sqrt(physics.vx*physics.vx + physics.vz*physics.vz);

            playerBody.head.rotation.z = Math.sin(state.walkTime * 0.8) * 0.05;
            playerBody.scarf.rotation.z = Math.sin(state.walkTime * 2) * 0.08;
            playerBody.scarfTail.rotation.x = 0.2 + Math.cos(state.walkTime * 3) * 0.12;
            playerBody.scarfTail.rotation.z = -0.2 + Math.sin(state.walkTime * 2.4) * 0.1;

            if (physics.grounded) {
                if (speed > 0.5) {
                    state.walkTime += dt * 15;
                    const angle = Math.sin(state.walkTime) * 1.2;
                    playerBody.lLeg.rotation.x = angle;
                    playerBody.rLeg.rotation.x = -angle;
                    playerBody.lArm.rotation.x = -angle;
                    playerBody.rArm.rotation.x = angle;
                    playerBody.torso.position.y = 0.45 + Math.sin(state.walkTime*2)*0.05;
                    playerBody.lShoe.rotation.x = angle * 0.35;
                    playerBody.rShoe.rotation.x = -angle * 0.35;
                } else {
                    state.walkTime += dt * 2;
                    playerBody.lLeg.rotation.x = 0;
                    playerBody.rLeg.rotation.x = 0;
                    playerBody.lArm.rotation.x = Math.sin(state.walkTime)*0.1;
                    playerBody.rArm.rotation.x = Math.sin(state.walkTime)*0.1;
                    playerBody.torso.position.y = 0.45 + Math.sin(state.walkTime)*0.02;
                    playerBody.lShoe.rotation.x = 0;
                    playerBody.rShoe.rotation.x = 0;
                }
                player.rotation.x = 0;
            } else {
                playerBody.lLeg.rotation.x = 0.5;
                playerBody.rLeg.rotation.x = -0.2;
                playerBody.lArm.rotation.x = -2.5;
                playerBody.rArm.rotation.x = -2.5;
                playerBody.lShoe.rotation.x = 0.18;
                playerBody.rShoe.rotation.x = -0.12;
                if (physics.jumpCount === 2) {
                    player.rotation.x -= dt * 10;
                }
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            if (state.active) {
                updatePhysics(dt);
                animatePlayer(dt);

                const idealOffset = new THREE.Vector3(0, 8, 10);
                const targetCamPos = playerGroup.position.clone().add(idealOffset);
                camera.position.lerp(targetCamPos, dt * 3);
                camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 0, -2)));
            }

            renderer.render(scene, camera);
        }

        // --- INIT ---
        const inputManager = new InputManager();

        document.getElementById('start-btn').addEventListener('click', resetGame);
        document.getElementById('restart-btn').addEventListener('click', resetGame);

        ['pointerdown', 'keydown', 'touchstart'].forEach((eventName) => {
            window.addEventListener(eventName, () => {
                audio.unlock();
            }, { once: true, passive: true });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.jump = jump;

        initLevel();
