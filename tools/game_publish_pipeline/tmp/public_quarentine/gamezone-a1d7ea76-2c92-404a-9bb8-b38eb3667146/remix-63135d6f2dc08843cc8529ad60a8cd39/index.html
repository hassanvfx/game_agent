<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>TERMINAL: GLITCH FIX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        term: {
                            bg: '#0a0a0a',
                            panel: '#171717',
                            main: '#f59e0b', // Amber-500
                            dim: '#78350f',  // Amber-900
                            bright: '#fbbf24', // Amber-400
                            err: '#ef4444',
                            ok: '#10b981'
                        }
                    },
                    fontFamily: {
                        sans: ['"Orbitron"', 'system-ui', 'sans-serif'],
                        mono: ['"VT323"', '"Orbitron"', 'monospace']
                    },
                    animation: {
                        'blink': 'blink 1s step-end infinite',
                        'crt-flicker': 'flicker 0.15s infinite',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both'
                    },
                    keyframes: {
                        blink: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0' } },
                        flicker: {
                            '0%': { opacity: '0.97' },
                            '50%': { opacity: '1' },
                            '100%': { opacity: '0.98' }
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --cell-size: 40px;
            --glow-color: rgba(56, 189, 248, 0.55);
            --hero-cyan: #38bdf8;
            --hero-violet: #a855f7;
            --hero-gold: #facc15;
            --panel-ink: #090814;
            --panel-deep: #141228;
            --panel-line: rgba(56, 189, 248, 0.32);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.14), transparent 30%),
                radial-gradient(circle at bottom, rgba(168, 85, 247, 0.18), transparent 32%),
                linear-gradient(180deg, #04040b 0%, #090814 55%, #04040a 100%);
            color: #7dd3fc;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .pt-safe { padding-top: max(0.75rem, var(--safe-top)); }
        .pb-safe { padding-bottom: max(0.5rem, var(--safe-bottom)); }

        #board-area,
        #grid,
        .cell,
        #keyboard,
        .key-btn {
            touch-action: manipulation;
        }

        /* CRT Effects */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(125, 211, 252, 0) 50%,
                rgba(3, 7, 18, 0.22) 50%
            );
            background-size: 100% 4px;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }
        .crt-glow {
            box-shadow:
                inset 0 0 70px rgba(0,0,0,0.78),
                inset 0 0 24px rgba(56, 189, 248, 0.12);
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 51;
        }
        
        /* Text Glow */
        .text-glow {
            text-shadow: 0 0 6px var(--glow-color);
        }

        .starfield,
        .hero-avatar,
        .panel-shell {
            pointer-events: none;
            position: absolute;
            inset: 0;
        }

        .starfield {
            z-index: 0;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(250, 204, 21, 0.85) 0 1px, transparent 1.5px),
                radial-gradient(circle at 78% 24%, rgba(56, 189, 248, 0.8) 0 1px, transparent 1.7px),
                radial-gradient(circle at 68% 72%, rgba(196, 181, 253, 0.65) 0 1px, transparent 1.8px),
                radial-gradient(circle at 26% 78%, rgba(250, 204, 21, 0.6) 0 1px, transparent 1.6px);
            opacity: 0.75;
            animation: starDrift 12s linear infinite;
        }

        .hero-avatar {
            inset: auto 0 0 auto;
            width: 7rem;
            height: 7rem;
            margin: 0 auto;
            z-index: 1;
            display: grid;
            place-items: center;
            opacity: 0.9;
        }

        .hero-avatar::before,
        .hero-avatar::after {
            content: '';
            position: absolute;
            border-radius: 999px;
        }

        .hero-avatar::before {
            inset: 0.35rem 1rem 1.4rem;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.4), rgba(168, 85, 247, 0.14));
            filter: blur(10px);
        }

        .hero-avatar::after {
            inset: 1.2rem 1.8rem 1.7rem;
            border: 2px solid rgba(125, 211, 252, 0.7);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.24);
        }

        .hero-core {
            position: relative;
            width: 4.2rem;
            height: 4.2rem;
            border-radius: 1.2rem;
            border: 2px solid rgba(125, 211, 252, 0.9);
            background: linear-gradient(180deg, #0f1b37 0%, #111827 55%, #0b1120 100%);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.28);
            animation: avatarPulse 1.8s ease-in-out infinite;
        }

        .hero-core span {
            position: absolute;
            display: block;
            border-radius: 999px;
            background: var(--hero-cyan);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        .hero-core .eye-left,
        .hero-core .eye-right {
            width: 0.55rem;
            height: 0.55rem;
            top: 1.25rem;
        }

        .hero-core .eye-left { left: 0.95rem; }
        .hero-core .eye-right { right: 0.95rem; }
        .hero-core .mouth {
            width: 1.45rem;
            height: 0.3rem;
            left: 50%;
            bottom: 1.05rem;
            transform: translateX(-50%);
            background: var(--hero-gold);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.75);
        }

        .panel-shell {
            border: 1px solid rgba(125, 211, 252, 0.12);
            box-shadow:
                inset 0 0 0 1px rgba(168, 85, 247, 0.08),
                inset 0 0 30px rgba(56, 189, 248, 0.05);
            z-index: 0;
        }

        .hud-frame {
            background: linear-gradient(180deg, rgba(8, 15, 31, 0.96), rgba(13, 19, 37, 0.94));
            border-color: rgba(56, 189, 248, 0.24);
            box-shadow: inset 0 -1px 0 rgba(168, 85, 247, 0.14);
        }

        .signal-pill {
            border: 1px solid rgba(56, 189, 248, 0.25);
            background: linear-gradient(180deg, rgba(8, 15, 31, 0.96), rgba(17, 24, 39, 0.92));
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.1);
        }

        /* Grid */
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background:
                linear-gradient(180deg, rgba(13, 20, 39, 0.98), rgba(9, 12, 24, 0.98));
            border: 2px solid rgba(59, 130, 246, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: calc(var(--cell-size) * 0.44);
            position: relative;
            color: #f8fafc;
            transition: all 0.1s;
            border-radius: 0.55rem;
            box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.08);
        }
        .cell-num {
            position: absolute;
            top: 3px;
            left: 4px;
            font-size: calc(var(--cell-size) * 0.18);
            color: #facc15;
            opacity: 0.9;
        }
        
        .cell.active {
            border-color: #38bdf8;
            background: linear-gradient(180deg, rgba(14, 44, 78, 0.98), rgba(11, 26, 49, 0.98));
            box-shadow: 0 0 16px var(--glow-color);
            z-index: 10;
            transform: translateY(-1px);
        }
        .cell.related {
            background: linear-gradient(180deg, rgba(38, 21, 72, 0.94), rgba(19, 16, 41, 0.96));
            border-color: rgba(168, 85, 247, 0.55);
        }
        .cell.correct {
            background: linear-gradient(180deg, rgba(6, 78, 59, 0.95), rgba(3, 43, 31, 0.98));
            border-color: #34d399;
            color: #a7f3d0;
        }
        .cell.wrong {
            background: linear-gradient(180deg, rgba(127, 29, 29, 0.95), rgba(69, 10, 10, 0.98));
            border-color: #fb7185;
            color: #fecdd3;
        }
        .cell.hint-flash {
            animation: flash 0.5s ease-in-out 2;
        }
        @keyframes flash {
            0%, 100% { background: rgba(13, 20, 39, 0.98); }
            50% { background: #38bdf8; color: #020617; }
        }

        @keyframes starDrift {
            0%, 100% { transform: translateY(0); opacity: 0.72; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes avatarPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-2px) scale(1.02); }
        }

        /* Keyboard */
        .key-btn {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.98), rgba(9, 12, 24, 0.98));
            border: 1px solid rgba(56, 189, 248, 0.26);
            color: #f8fafc;
            font-weight: bold;
            touch-action: manipulation;
            position: relative;
            box-shadow: 0 3px 0 rgba(2, 6, 23, 0.95), 0 0 12px rgba(56, 189, 248, 0.08);
            font-family: 'VT323', 'Orbitron', monospace;
            font-size: 1.1rem;
            letter-spacing: 0.08em;
        }
        .key-btn:active {
            transform: translateY(2px);
            box-shadow: none;
            background: #38bdf8;
            color: #020617;
        }
        .key-btn.hint-glow {
            animation: keyPulse 1s ease-out infinite;
        }
        @keyframes keyPulse {
            0%, 100% { border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
            50% { border-color: #fff; }
        }

        .reaction-gif {
            width: min(24vw, 4.75rem);
            height: min(24vw, 4.75rem);
            object-fit: cover;
            box-shadow: 0 0 18px rgba(15, 23, 42, 0.55);
            transition: opacity 0.22s ease, transform 0.22s ease;
            transform: translateY(8px) scale(0.92);
        }

        .reaction-gif.is-visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        /* Scrollbar hiding for safety */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="crt-glow"></div>

    <!-- Main App -->

                    },
                    {
                        rows: 7, cols: 7,
                        grid: [
                            {r:3, c:0, l:'G', n:1}, {r:3, c:1, l:'A'}, {r:3, c:2, l:'L'}, {r:3, c:3, l:'A'}, {r:3, c:4, l:'X'}, {r:3, c:5, l:'Y'},
                            {r:1, c:3, l:'L'},
                            {r:2, c:3, l:'I'},
                            {r:4, c:3, l:'S'}
                        ],
                        clues: {
                            across: { 1: { t: "Milky Way, for one", cells: [[3,0],[3,1],[3,2],[3,3],[3,4],[3,5]] } },
                            down: { 1: { t: "Flower or name", cells: [[1,3],[2,3],[3,3],[4,3]] } }
                        }
                    },
                    {
                        rows: 8, cols: 8,
                        grid: [
                            {r:2, c:0, l:'Q', n:1}, {r:2, c:1, l:'U'}, {r:2, c:2, l:'A'}, {r:2, c:3, l:'N'}, {r:2, c:4, l:'T'}, {r:2, c:5, l:'U'}, {r:2, c:6, l:'M'},
                            {r:0, c:4, l:'D', n:2}, {r:1, c:4, l:'A'}, {r:3, c:4, l:'A'}
                        ],
                        clues: {
                            across: { 1: { t: "Physics of the small", cells: [[2,0],[2,1],[2,2],[2,3],[2,4],[2,5],[2,6]] } },
                            down: { 2: { t: "Information unit", cells: [[0,4],[1,4],[2,4],[3,4]] } }
                        }
                    }
                ]
            }
        ];

        /* --- AUDIO SYSTEM (Catalog-backed) --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;
        let audioUnlocked = false;

        const AUDIO_ASSETS = {
            uiTap: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
            key: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
            correct: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3',
            wrong: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3',
            hint: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3',
            win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
            start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
            bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
        };

        const audioPool = Object.fromEntries(
            Object.entries(AUDIO_ASSETS).map(([key, src]) => {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.crossOrigin = 'anonymous';
                audio.volume = key === 'bgm' ? 0.24 : 0.45;
                audio.loop = key === 'bgm';
                return [key, audio];
            })
        );

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            Object.values(audioPool).forEach(audio => {
                audio.load();
            });
        }

        function playCatalogSound(key, { reset = true } = {}) {
            const source = audioPool[key];
            if (!source || isMuted || !audioUnlocked) return;

            try {
                const clip = reset ? source.cloneNode(true) : source;
                clip.volume = source.volume;
                clip.crossOrigin = 'anonymous';
                clip.currentTime = 0;
                clip.play().catch(() => {});
            } catch (_) {}
        }

        function syncBgm() {
            const bgm = audioPool.bgm;
            if (!bgm) return;

            if (!audioUnlocked || isMuted || !state.isPlaying) {
                bgm.pause();
                return;
            }

            bgm.play().catch(() => {});
        }

        const SFX = {
            tap: () => playCatalogSound('uiTap'),
            key: () => playCatalogSound('key'),
            correct: () => playCatalogSound('correct'),
            wrong: () => playCatalogSound('wrong'),
            hint: () => playCatalogSound('hint'),
            win: () => playCatalogSound('win'),
            start: () => playCatalogSound('start')
        };

        const GIFS = {
            fail: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp',
            win: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
        };

        let reactionTimeout = null;

        function showReaction(type, duration = 1200) {
            const failGif = document.getElementById('fail-gif');
            const winGif = document.getElementById('win-gif');
            if (!failGif || !winGif) return;

            failGif.classList.remove('is-visible');
            winGif.classList.remove('is-visible');

            const target = type === 'win' ? winGif : failGif;
            target.src = GIFS[type];
            target.classList.add('is-visible');

            clearTimeout(reactionTimeout);
            reactionTimeout = setTimeout(() => {
                target.classList.remove('is-visible');
            }, duration);
        }

        /* --- STATE --- */
        const state = {
            semIdx: 0,
            classIdx: 0,
            score: 0,
            grid: [],
            active: { r: -1, c: -1 },
            direction: 'across',
            timer: 0,
            timerMax: 15,
            isPlaying: false
        };

        const ui = {
            grid: document.getElementById('grid'),
            hint: document.getElementById('hint-text'),
            timerBar: document.getElementById('timer-bar'),
            score: document.getElementById('score-display'),
            semTitle: document.getElementById('semester-title'),
            dots: document.getElementById('progress-dots'),
            keyboard: document.getElementById('keyboard'),
            toast: document.getElementById('toast'),
            startScreen: document.getElementById('start-screen'),
            victoryScreen: document.getElementById('victory-screen'),
            boardArea: document.getElementById('board-area'),
            keys: {}
        };

        document.getElementById('fail-gif').src = GIFS.fail;
        document.getElementById('win-gif').src = GIFS.win;

        /* --- LOGIC --- */
        function initGame(semIdx) {
            state.semIdx = semIdx;
            state.classIdx = 0;
            state.score = 0;
            ui.score.innerText = "0000";
            ui.semTitle.innerText = SEMESTERS[semIdx].name;
            loadLevel();
            syncBgm();
        }

        function loadLevel() {
            const sem = SEMESTERS[state.semIdx];
            const data = sem.levels[state.classIdx];
            
            state.active = { r: -1, c: -1 };
            state.direction = 'across';
            state.isPlaying = true;
            state.timer = state.timerMax;
            
            // Init Grid
            state.grid = Array(data.rows).fill(null).map(() => Array(data.cols).fill(null));
            data.grid.forEach(d => {
                state.grid[d.r][d.c] = {
                    val: '',
                    target: d.l,
                    num: d.n || null,
                    isCorrect: false,
                    clueRefs: { across: null, down: null },
                    el: null
                };
            });

            // Map Clues
            ['across', 'down'].forEach(dir => {
                if (data.clues[dir]) {
                    Object.values(data.clues[dir]).forEach(clue => {
                        clue.cells.forEach(([r, c]) => {
                            if (state.grid[r][c]) state.grid[r][c].clueRefs[dir] = clue;
                        });
                    });
                }
            });

            updateDots();
            renderGrid(data);
            fitGrid();
            
            // Auto Select First
            const first = data.grid[0];
            selectCell(first.r, first.c);
        }

        function updateDots() {
            ui.dots.innerHTML = '';
            for(let i=0; i<3; i++) {
                const dot = document.createElement('div');
                dot.className = `w-2 h-2 border border-term-main ${i <= state.classIdx ? 'bg-term-main' : 'bg-transparent'}`;
                ui.dots.appendChild(dot);
            }
        }

        function renderGrid(data) {
            ui.grid.innerHTML = '';
            ui.grid.style.gridTemplateColumns = `repeat(${data.cols}, 1fr)`;
            
            for(let r=0; r<data.rows; r++) {
                for(let c=0; c<data.cols; c++) {
                    const cellData = state.grid[r][c];
                    const div = document.createElement('div');
                    
                    if (cellData) {
                        div.className = "cell";
                        if (cellData.num) {
                            div.innerHTML = `<span class="cell-num">${cellData.num}</span>`;
                        }
                        div.onpointerdown = (e) => {
                            e.preventDefault();
                            selectCell(r, c);
                        };
                        cellData.el = div;
                    } else {
                        div.className = "pointer-events-none";
                    }
                    ui.grid.appendChild(div);
                }
            }
        }

        function fitGrid() {
            if (!state.isPlaying) return;
            const data = SEMESTERS[state.semIdx].levels[state.classIdx];
            const w = ui.boardArea.clientWidth - 20;
            const h = ui.boardArea.clientHeight - 20;
            const size = Math.min(Math.floor(w / data.cols), Math.floor(h / data.rows), 55);
            document.documentElement.style.setProperty('--cell-size', `${Math.max(size, 30)}px`);
        }
        window.addEventListener('resize', fitGrid);

        function selectCell(r, c) {
            const cell = state.grid[r][c];
            if (!cell) return;

            if (state.active.r === r && state.active.c === c) {
                if (cell.clueRefs.across && cell.clueRefs.down) {
                    state.direction = state.direction === 'across' ? 'down' : 'across';
                }
            } else {
                if (cell.clueRefs.across && !cell.clueRefs.down) state.direction = 'across';
                else if (!cell.clueRefs.across && cell.clueRefs.down) state.direction = 'down';
                else if (!cell.clueRefs[state.direction]) {
                    state.direction = state.direction === 'across' ? 'down' : 'across';
                }
            }

            state.active = { r, c };
            state.timer = state.timerMax;
            SFX.tap();
            updateUI();
        }

        function updateUI() {
            const { r, c } = state.active;
            
            // Reset styles
            state.grid.flat().forEach(cell => {
                if (cell) cell.el.classList.remove('active', 'related');
            });

            // Active & Related
            const activeCell = state.grid[r][c];
            activeCell.el.classList.add('active');
            
            const clue = activeCell.clueRefs[state.direction];
            if (clue) {
                ui.hint.innerText = clue.t.toUpperCase();
                ui.timerBar.parentElement.style.opacity = '1';
                clue.cells.forEach(([cr, cc]) => {
                    if (cr !== r || cc !== c) state.grid[cr][cc].el.classList.add('related');
                });
            } else {
                ui.hint.innerText = "NO_DATA";
                ui.timerBar.parentElement.style.opacity = '0';
            }
        }

        function handleInput(char) {
            const { r, c } = state.active;
            if (r === -1) return;
            const cell = state.grid[r][c];

            SFX.key();

            if (char === 'BACK') {
                if (!cell.isCorrect) {
                    cell.val = '';
                    cell.el.innerHTML = cell.num ? `<span class="cell-num">${cell.num}</span>` : '';
                }
                moveCursor(-1);
                return;
            }

            if (cell.isCorrect) {
                moveCursor(1, true);
                return;
            }

            if (char === cell.target) {
                // Correct
                cell.val = char;
                cell.isCorrect = true;
                cell.el.classList.add('correct');
                cell.el.classList.remove('wrong');
                cell.el.innerHTML = (cell.num ? `<span class="cell-num">${cell.num}</span>` : '') + char;
                
                state.score += 100;
                ui.score.innerText = state.score.toString().padStart(4, '0');
                SFX.correct();
                
                checkWin();
                moveCursor(1, true);
            } else {
                // Wrong
                cell.el.classList.add('wrong', 'animate-shake');
                cell.el.innerText = char;
                SFX.wrong();
                showReaction('fail', 900);
                
                state.score = Math.max(0, state.score - 20);
                ui.score.innerText = state.score.toString().padStart(4, '0');
                
                setTimeout(() => {
                    cell.el.classList.remove('animate-shake', 'wrong');
                    cell.el.innerHTML = cell.num ? `<span class="cell-num">${cell.num}</span>` : '';
                }, 400);
            }
        }

        function moveCursor(step, findEmpty = false) {
            const { r, c } = state.active;
            const clue = state.grid[r][c].clueRefs[state.direction];
            if (!clue) return;

            const idx = clue.cells.findIndex(([cr, cc]) => cr === r && cc === c);
            if (idx === -1) return;

            let nextIdx = idx + step;
            
            if (findEmpty && step > 0) {
                for (let i = idx + 1; i < clue.cells.length; i++) {
                    const [nr, nc] = clue.cells[i];
                    if (!state.grid[nr][nc].isCorrect) {
                        nextIdx = i;
                        break;
                    }
                }
                if (nextIdx >= clue.cells.length) return;
            }

            if (nextIdx >= 0 && nextIdx < clue.cells.length) {
                const [nr, nc] = clue.cells[nextIdx];
                selectCell(nr, nc);
            }
        }

        function checkWin() {
            const sem = SEMESTERS[state.semIdx];
            const data = sem.levels[state.classIdx];
            const allCorrect = data.grid.every(d => state.grid[d.r][d.c].isCorrect);
            
            if (allCorrect) {
                state.isPlaying = false;
                if (state.classIdx < 2) {
                    setTimeout(() => {
                        SFX.win();
                        showReaction('win', 1400);
                        ui.toast.classList.remove('opacity-0');
                        ui.toast.querySelector('div').classList.remove('scale-95');
                        setTimeout(() => {
                            ui.toast.classList.add('opacity-0');
                            ui.toast.querySelector('div').classList.add('scale-95');
                            state.classIdx++;
                            loadLevel();
                        }, 1500);
                    }, 300);
                } else {
                    setTimeout(() => {
                        SFX.win();
                        showReaction('win', 1800);
                        document.getElementById('final-score').innerText = state.score;
                        const nextSem = SEMESTERS[state.semIdx + 1];
                        document.getElementById('victory-sub').innerText = nextSem ? `ACCESS GRANTED: ${nextSem.name}` : "SYSTEM FULLY RESTORED";
                        ui.victoryScreen.classList.remove('hidden');
                    }, 500);
                }
            }
        }

        /* --- KEYBOARD --- */
        function initKeyboard() {
            const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
            ui.keyboard.innerHTML = '';
            
            rows.forEach((row, i) => {
                const rDiv = document.createElement('div');
                rDiv.className = "flex justify-center gap-1 w-full";
                
                row.split('').forEach(char => {
                    const btn = document.createElement('button');
                    btn.className = "key-btn flex-1 h-11 text-lg rounded-sm";
                    btn.innerText = char;
                    btn.onpointerdown = (e) => {
                        e.preventDefault();
                        handleInput(char);
                    };
                    ui.keys[char] = btn;
                    rDiv.appendChild(btn);
                });

                if (i === 2) {
                    const del = document.createElement('button');
                    del.className = "key-btn flex-1 h-11 text-term-err border-term-err/50 rounded-sm";
                    del.innerText = "←";
                    del.onpointerdown = (e) => {
                        e.preventDefault();
                        handleInput('BACK');
                    };
                    rDiv.appendChild(del);
                }
                ui.keyboard.appendChild(rDiv);
            });
        }

        /* --- LOOP --- */
        let lastTime = 0;
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (state.isPlaying && state.active.r !== -1) {
                const cell = state.grid[state.active.r][state.active.c];
                const clue = cell.clueRefs[state.direction];
                
                if (clue && !clue.cells.every(([r,c]) => state.grid[r][c].isCorrect)) {
                    state.timer -= dt;
                    if (state.timer <= 0) {
                        triggerHint(clue);
                        state.timer = state.timerMax;
                    }
                    const pct = (state.timer / state.timerMax) * 100;
                    ui.timerBar.style.width = `${pct}%`;
                } else {
                    ui.timerBar.style.width = '0%';
                }
            }
            requestAnimationFrame(loop);
        }

        function triggerHint(clue) {
            let target = null;
            for (let [r, c] of clue.cells) {
                if (!state.grid[r][c].isCorrect) {
                    target = state.grid[r][c];
                    break;
                }
            }
            if (target) {
                SFX.hint();
                const key = ui.keys[target.target];
                if (key) {
                    key.classList.remove('hint-glow');
                    void key.offsetWidth;
                    key.classList.add('hint-glow');
                }
                if (target.el) {
                    target.el.classList.add('hint-flash');
                    setTimeout(() => target.el.classList.remove('hint-flash'), 1000);
                }
            }
        }

        /* --- INIT --- */
        initKeyboard();
        
        document.getElementById('btn-start').addEventListener('click', () => {
            unlockAudio();
            SFX.start();
            ui.startScreen.classList.add('hidden');
            initGame(0);
            requestAnimationFrame(loop);
        });

        document.getElementById('btn-next-sem').addEventListener('click', () => {
            unlockAudio();
            SFX.tap();
            ui.victoryScreen.classList.add('hidden');
            let next = state.semIdx + 1;
            if (next >= SEMESTERS.length) next = 0;
            initGame(next);
        });

        document.getElementById('sound-toggle').addEventListener('click', (e) => {
            unlockAudio();
            isMuted = !isMuted;
            e.target.innerText = isMuted ? '🔇' : '🔊';
            e.target.style.opacity = isMuted ? '0.5' : '1';
            syncBgm();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audioPool.bgm.pause();
            } else {
                syncBgm();
            }
        });

        // Prevent zoom hacks
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
