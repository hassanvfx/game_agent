<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Flux: Gravity Rush</title>
    <!-- [agent-note][stage3] resolved-font: display -> Orbitron, body/hud -> Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #040611;
            --bg-deep: #090d1d;
            --panel: rgba(10, 15, 30, 0.84);
            --panel-border: rgba(114, 241, 255, 0.35);
            --panel-shadow: rgba(39, 203, 255, 0.22);
            --hero: #72f1ff;
            --hero-strong: #00d8ff;
            --ally: #fff48b;
            --danger: #ff4d87;
            --danger-dark: #98163f;
            --text: #f4fbff;
            --muted: #9bc8dc;
            --grid: #1b2946;
            --floor: rgba(46, 215, 255, 0.32);
            --button-text: #031018;
            --font-display: 'Orbitron', system-ui, sans-serif;
            --font-body: 'Rajdhani', system-ui, sans-serif;
        }

        /* §3.1 Viewport & Reset */
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(41, 90, 150, 0.28), transparent 38%),
                radial-gradient(circle at bottom, rgba(255, 77, 135, 0.14), transparent 35%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--text);
            font-family: var(--font-body);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 12%, rgba(114, 241, 255, 0.15), transparent 15%),
                radial-gradient(circle at 82% 20%, rgba(255, 77, 135, 0.12), transparent 18%),
                linear-gradient(120deg, transparent 0 48%, rgba(255, 255, 255, 0.025) 50%, transparent 52% 100%);
            opacity: 0.95;
        }

        /* CRITICAL FIX: Ensure canvas fills container */
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .hidden { display: none !important; }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* UI Styling */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            padding: 16px;
        }

        .panel {
            pointer-events: auto;
            position: relative;
            width: min(92vw, 560px);
            padding: 22px 18px 20px;
            border-radius: 24px;
            border: 1px solid var(--panel-border);
            background:
                linear-gradient(180deg, rgba(14, 22, 42, 0.96), rgba(8, 12, 25, 0.9)),
                var(--panel);
            backdrop-filter: blur(10px);
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 30px var(--panel-shadow);
            text-align: center;
            overflow: hidden;
        }

        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .panel::before {
            inset: 0;
            background:
                linear-gradient(135deg, rgba(114, 241, 255, 0.12), transparent 28%),
                linear-gradient(315deg, rgba(255, 77, 135, 0.09), transparent 24%);
        }

        .panel::after {
            right: 16px;
            top: 16px;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(114, 241, 255, 0.22), transparent 65%);
            filter: blur(10px);
            opacity: 0.8;
        }

        .start-screen { transform: translateY(-6px); }
        .game-over-screen {
            border-color: rgba(255, 77, 135, 0.35);
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 30px rgba(255, 77, 135, 0.18);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(114, 241, 255, 0.12);
            border: 1px solid rgba(114, 241, 255, 0.24);
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .brand-badge .emoji {
            font-size: 16px;
            filter: drop-shadow(0 0 10px rgba(114, 241, 255, 0.4));
        }

        .title {
            margin: 0 0 6px;
            font-family: var(--font-display);
            font-size: clamp(32px, 11vw, 64px);
            line-height: 0.96;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text);
            text-shadow: 0 0 20px rgba(114, 241, 255, 0.45);
        }

        .subtitle {
            margin: 0 0 16px;
            font-family: var(--font-display);
            font-size: clamp(14px, 4.1vw, 22px);
            font-weight: 700;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: #94f4ff;
        }

        .hero-avatar {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            border-radius: 28px;
            border: 1px solid rgba(114, 241, 255, 0.32);
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.9), rgba(114, 241, 255, 0.42) 25%, rgba(10, 30, 44, 0) 28%),
                radial-gradient(circle at 50% 50%, rgba(0, 216, 255, 0.24), rgba(0, 216, 255, 0.02) 62%, transparent 66%),
                linear-gradient(180deg, rgba(17, 40, 68, 0.95), rgba(8, 12, 25, 0.98));
            box-shadow:
                0 0 30px rgba(114, 241, 255, 0.24),
                inset 0 0 24px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .hero-avatar::before,
        .hero-avatar::after {
            content: "";
            position: absolute;
            border-radius: 999px;
        }

        .hero-avatar::before {
            left: 22px;
            top: 34px;
            width: 18px;
            height: 18px;
            background: #ffffff;
            box-shadow: 46px 0 0 #ffffff, 0 0 16px rgba(255, 255, 255, 0.8), 46px 0 16px rgba(255, 255, 255, 0.8);
        }

        .hero-avatar::after {
            left: 24px;
            bottom: 26px;
            width: 60px;
            height: 22px;
            border-bottom: 4px solid #fff48b;
            transform: rotate(-4deg);
            filter: drop-shadow(0 0 12px rgba(255, 244, 139, 0.5));
        }

        .hero-rings {
            position: absolute;
            inset: 10px;
            border-radius: 22px;
            border: 1px dashed rgba(114, 241, 255, 0.3);
            animation: ringSpin 7s linear infinite;
        }

        .hero-rings::before,
        .hero-rings::after {
            content: "";
            position: absolute;
            inset: 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 77, 135, 0.18);
        }

        .hero-rings::after {
            inset: 30px;
            border-color: rgba(255, 244, 139, 0.24);
        }

        .body-copy,
        .score-line {
            margin: 0 auto 16px;
            max-width: 38ch;
            color: #d1e4f2;
            font-size: clamp(14px, 3.8vw, 18px);
            line-height: 1.4;
        }

        .legend-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 18px;
        }

        .legend-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 30px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .legend-chip .icon { font-size: 15px; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 190px;
            min-height: 54px;
            padding: 14px 24px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(180deg, #9cf6ff, #31d6ff);
            color: var(--button-text);
            font-family: var(--font-display);
            font-size: clamp(16px, 4.6vw, 24px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 10px 24px rgba(10, 216, 255, 0.24),
                0 0 24px rgba(114, 241, 255, 0.28);
            cursor: pointer;
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        .action-btn:active {
            transform: scale(0.97);
            filter: brightness(1.04);
        }

        .action-btn.danger {
            background: linear-gradient(180deg, #ff7da7, #ff4d87);
            color: #fff9fc;
            box-shadow:
                0 10px 24px rgba(255, 77, 135, 0.28),
                0 0 24px rgba(255, 77, 135, 0.22);
        }

        .hud {
            position: absolute;
            top: max(12px, env(safe-area-inset-top, 0px) + 10px);
            right: max(12px, env(safe-area-inset-right, 0px) + 10px);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            padding: 0;
            text-align: right;
        }

        .hud-card {
            position: relative;
            min-width: 120px;
            padding: 10px 12px 9px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(11, 18, 36, 0.88), rgba(8, 12, 24, 0.84));
            border: 1px solid rgba(114, 241, 255, 0.24);
            box-shadow: 0 0 20px rgba(114, 241, 255, 0.14);
        }

        .hud-label {
            color: #8beeff;
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }

        .hud-score {
            margin-top: 4px;
            font-family: var(--font-display);
            font-size: clamp(24px, 8vw, 42px);
            line-height: 1;
            color: var(--text);
            text-shadow: 0 0 16px rgba(114, 241, 255, 0.38);
        }

        .animate-glow { animation: pulse 1.6s infinite ease-in-out; }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 0.84; transform: translateY(0); text-shadow: 0 0 12px rgba(114, 241, 255, 0.38); }
            50% { opacity: 1; transform: translateY(-1px); text-shadow: 0 0 18px rgba(114, 241, 255, 0.62); }
        }

        @keyframes ringSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .feedback-gif {
            position: absolute;
            left: 50%;
            bottom: max(88px, env(safe-area-inset-bottom, 0px) + 78px);
            width: min(40vw, 150px);
            aspect-ratio: 1;
            transform: translateX(-50%) scale(0.82);
            opacity: 0;
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 6;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateX(-50%) scale(1);
        }

        .feedback-gif.hit {
            bottom: max(86px, env(safe-area-inset-bottom, 0px) + 74px);
            width: min(44vw, 168px);
        }

        .feedback-gif.collect {
            bottom: max(118px, env(safe-area-inset-bottom, 0px) + 108px);
            width: min(32vw, 118px);
        }

        @media (max-width: 640px) {
            .ui-layer { padding: 12px; }

            .panel {
                width: min(94vw, 420px);
                padding: 18px 14px 16px;
                border-radius: 20px;
            }

            .hero-avatar {
                width: 92px;
                height: 92px;
                margin-bottom: 14px;
            }

            .hero-avatar::before {
                left: 18px;
                top: 28px;
                width: 15px;
                height: 15px;
                box-shadow: 38px 0 0 #ffffff, 0 0 16px rgba(255, 255, 255, 0.8), 38px 0 16px rgba(255, 255, 255, 0.8);
            }

            .hero-avatar::after {
                left: 20px;
                bottom: 22px;
                width: 50px;
                height: 18px;
            }

            .subtitle { letter-spacing: 0.22em; }
            .legend-row { gap: 8px; margin-bottom: 16px; }
            .legend-chip { font-size: 11px; padding: 5px 9px; }
            .action-btn { width: 100%; min-width: 0; }
            .hud-card { min-width: 108px; padding: 8px 10px 7px; }

            .feedback-gif.hit {
                width: min(46vw, 150px);
            }

            .feedback-gif.collect {
                width: min(34vw, 104px);
            }
        }
    </style>
</head>
<body>

<!-- §6 Editable Config Protocol -->
<script id="game-config" type="application/x-game-config">

</script>

<!-- §4 Media Declaration -->
<div id="assets" style="display:none;">
    <!-- [agent-note][stage3] resolved-audio: loop/ui/collect/land/fail wired from catalogs/audios.json -->

<script>
/**
 * NEON FLUX ENGINE
 * Legendary HTML5 Casual Game Logic
 */

// --- §6 Config System ---
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        const def = window.gameConfigDefs[key];
        if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, Number(val)));
        if (def.type === 'color' && /^#[0-9a-fA-F]{6}$/.test(val)) window.gameConfig[key] = val;
        else if (def.type !== 'color') window.gameConfig[key] = val;
    }
};

// --- §5 Audio System ---
const AudioSys = {
    ctx: null,
    bgm: null,
    sfx: {},
    unlocked: false,
    lastPlayedAt: {},

    init() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
        }

        this.sfx = {
            jump: document.getElementById('sfx_jump'),
            collect: document.getElementById('sfx_collect'),
            land: document.getElementById('sfx_land'),
            ui: document.getElementById('sfx_ui'),
            die: document.getElementById('sfx_die')
        };
        this.bgm = document.getElementById('bgm_main');

        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        this.unlocked = true;
    },

    playBgm() {
        if (!this.unlocked) this.init();
        if (!this.bgm) return;
        this.bgm.volume = 0.2;
        this.bgm.play().catch(() => {});
    },

    stopBgm(reset = true) {
        if (this.bgm) {
            this.bgm.pause();
            if (reset) this.bgm.currentTime = 0;
        }
    },

    play(key, options = {}) {
        if (!this.unlocked) this.init();
        const { cooldown = 0, volume = null } = options;
        const now = performance.now();

        if (cooldown > 0 && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) {
            return;
        }
        this.lastPlayedAt[key] = now;

        const el = this.sfx[key];
        if (el && el.readyState >= 2) {
            if (typeof volume === 'number') el.volume = volume;
            el.currentTime = 0;
            el.play().catch(() => this.synth(key));
        } else {
            this.synth(key);
        }
    },

    synth(key) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const t = this.ctx.currentTime;
        if (key === 'jump') {
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
            gain.gain.setValueAtTime(0.24, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        } else if (key === 'collect') {
            osc.frequency.setValueAtTime(720, t);
            osc.frequency.exponentialRampToValueAtTime(980, t + 0.12);
            gain.gain.setValueAtTime(0.22, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.12);
            osc.start(t);
            osc.stop(t + 0.12);
        } else if (key === 'land' || key === 'ui') {
            osc.frequency.setValueAtTime(240, t);
            osc.frequency.exponentialRampToValueAtTime(180, t + 0.09);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.09);
            osc.start(t);
            osc.stop(t + 0.09);
        } else if (key === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, t);
            osc.frequency.exponentialRampToValueAtTime(20, t + 0.4);
            gain.gain.setValueAtTime(0.42, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.4);
            osc.start(t);
            osc.stop(t + 0.4);
        }
    }
};

// --- Game Logic ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Refs
    const ui = {
        start: document.getElementById('start-screen'),
        over: document.getElementById('game-over-screen'),
        hud: document.getElementById('hud'),
        score: document.getElementById('score-display'),
        finalScore: document.getElementById('final-score'),
        startBtn: document.getElementById('start-btn'),
        restartBtn: document.getElementById('restart-btn'),
        hitGif: document.getElementById('gif-hit'),
        collectGif: document.getElementById('gif-collect')
    };

    let feedbackTimers = [];

    function clearFeedbackTimers() {
        feedbackTimers.forEach(timer => clearTimeout(timer));
        feedbackTimers = [];
    }

    function showFeedbackGif(kind, duration = 650) {
        const el = kind === 'collect' ? ui.collectGif : ui.hitGif;
        if (!el) return;

        el.classList.remove('is-visible');
        void el.offsetWidth;
        el.classList.add('is-visible');

        const timer = setTimeout(() => {
            el.classList.remove('is-visible');
        }, duration);

        feedbackTimers.push(timer);
    }

    // State
    let state = {
        mode: 'MENU',
        t: 0,
        score: 0,
        speed: 0,
        gravityDir: 1, // 1 = down, -1 = up
        shake: 0,
        chroma: 0 // Chromatic aberration intensity
    };

    // Entities
    let player = { x: 0, y: 0, vy: 0, r: 12, grounded: false, squish: 1 };
    let obstacles = [];
    let particles = [];
    let trail = [];

    // --- Resize & Init ---
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        // §3.2 Canvas sizing based on CSS size
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Reposition player if resize happens during play
        if (state.mode === 'MENU') {
            player.x = rect.width * 0.2;
            player.y = rect.height / 2;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function reset() {
        state.score = 0;
        state.speed = window.gameConfig.gameSpeed;
        state.gravityDir = 1;
        state.shake = 0;
        state.chroma = 0;

        const h = canvas.getBoundingClientRect().height;
        player.y = h / 2;
        player.vy = 0;
        player.grounded = false;
        player.squish = 1;

        obstacles = [];
        particles = [];
        trail = [];
        clearFeedbackTimers();
        ui.hitGif?.classList.remove('is-visible');
        ui.collectGif?.classList.remove('is-visible');
    }

    function spawnObstacle() {
        const rect = canvas.getBoundingClientRect();
        const isTop = Math.random() > 0.5;
        const type = Math.random() > 0.8 ? 'COIN' : 'SPIKE';

        obstacles.push({
            x: rect.width + 100,
            y: isTop ? 40 : rect.height - 40,
            side: isTop ? -1 : 1,
            type: type,
            active: true,
            rot: 0
        });
    }

    function createParticles(x, y, color, count, speed = 100) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const s = Math.random() * speed + 50;
            particles.push({
                x, y,
                vx: Math.cos(angle) * s,
                vy: Math.sin(angle) * s,
                life: 1.0,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    // --- Input ---
    function handleAction(e) {
        if (e.type === 'pointerdown') e.preventDefault();

        if (state.mode === 'MENU') return;
        if (state.mode === 'GAMEOVER') return;

        // Gravity Flip
        state.gravityDir *= -1;
        player.grounded = false;
        player.squish = 0.6; // Stretch effect

        // Juice
        AudioSys.play('jump');
        createParticles(player.x, player.y, window.gameConfig.heroColor, 5, 50);
    }

    // §3.3 Input System
    canvas.addEventListener('pointerdown', handleAction, { passive: false });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handleAction(e);
    });

    ui.startBtn.addEventListener('click', () => {
        AudioSys.init();
        AudioSys.play('ui', { cooldown: 80, volume: 0.36 });
        AudioSys.playBgm();
        reset();
        state.mode = 'PLAY';
        ui.start.classList.add('hidden');
        ui.hud.classList.remove('hidden');
        loop(0);
    });

    ui.restartBtn.addEventListener('click', () => {
        AudioSys.init();
        AudioSys.play('ui', { cooldown: 80, volume: 0.34 });
        AudioSys.playBgm();
        reset();
        state.mode = 'PLAY';
        ui.over.classList.add('hidden');
        ui.hud.classList.remove('hidden');
    });

    // --- Update ---
    function update(dt) {
        if (state.mode !== 'PLAY') return;

        state.t += dt;
        state.speed += dt * 15; // Accel
        state.score += state.speed * dt * 0.1;

        // Player Physics
        const g = window.gameConfig.gravity;
        const h = canvas.getBoundingClientRect().height;
        const pad = 30; // Floor thickness

        player.vy += g * state.gravityDir * dt;
        player.y += player.vy * dt;

        // Squash recovery
        player.squish += (1 - player.squish) * dt * 10;

        // Collision Floor/Ceiling
        if (player.y > h - pad - player.r) {
            player.y = h - pad - player.r;
            player.vy = 0;
            if (!player.grounded) {
                player.squish = 1.4; // Impact squash
                createParticles(player.x, h - pad, '#72f1ff', 5);
                AudioSys.play('land', { cooldown: 140, volume: 0.28 });
            }
            player.grounded = true;
        } else if (player.y < pad + player.r) {
            player.y = pad + player.r;
            player.vy = 0;
            if (!player.grounded) {
                player.squish = 1.4;
                createParticles(player.x, pad, '#72f1ff', 5);
                AudioSys.play('land', { cooldown: 140, volume: 0.24 });
            }
            player.grounded = true;
        } else {
            player.grounded = false;
        }

        // Trail Logic
        trail.push({ x: player.x, y: player.y, r: player.r * player.squish });
        if (trail.length > 10) trail.shift();
        for (let t of trail) t.x -= state.speed * dt;

        // Obstacles
        if (Math.random() < 0.03 && obstacles.length < 4) {
            const last = obstacles[obstacles.length - 1];
            if (!last || (canvas.getBoundingClientRect().width + 100 - last.x > 250)) {
                spawnObstacle();
            }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.x -= state.speed * dt;
            o.rot += dt * 5;

            // Hitbox
            const dx = player.x - o.x;
            const dy = player.y - o.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const hitDist = player.r + 15; // Approx radius of obstacle

            if (o.active && dist < hitDist) {
                if (o.type === 'COIN') {
                    o.active = false;
                    state.score += 500;
                    AudioSys.play('collect', { cooldown: 100, volume: 0.42 });
                    showFeedbackGif('collect', 700);
                    createParticles(o.x, o.y, '#fff48b', 10);
                } else {
                    die();
                }
            }

            if (o.x < -100) obstacles.splice(i, 1);
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 3;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Screen Shake
        if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 20);
        if (state.chroma > 0) state.chroma = Math.max(0, state.chroma - dt * 2);

        ui.score.innerText = Math.floor(state.score).toString().padStart(4, '0');
    }

    function die() {
        state.mode = 'GAMEOVER';
        AudioSys.stopBgm();
        AudioSys.play('die', { volume: 0.5 });
        showFeedbackGif('hit', 900);
        state.shake = 25;
        state.chroma = 10;
        createParticles(player.x, player.y, '#ff4d87', 30, 300);

        setTimeout(() => {
            ui.hud.classList.add('hidden');
            ui.over.classList.remove('hidden');
            ui.finalScore.innerText = Math.floor(state.score);
        }, 800);
    }

    function drawOrbPilot() {
        const blink = Math.sin(state.t * 2.4) > 0.94 ? 0.18 : 1;
        const grinLift = Math.sin(state.t * 3.2) * 1.2;
        const auraPulse = 18 + Math.sin(state.t * 4.5) * 6;

        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.scale(1 / player.squish, player.squish);

        ctx.shadowBlur = auraPulse;
        ctx.shadowColor = window.gameConfig.heroColor;
        const shell = ctx.createRadialGradient(-4, -6, 2, 0, 0, player.r + 10);
        shell.addColorStop(0, '#ffffff');
        shell.addColorStop(0.18, '#d7fbff');
        shell.addColorStop(0.42, window.gameConfig.heroColor);
        shell.addColorStop(1, 'rgba(0, 216, 255, 0.15)');
        ctx.fillStyle = shell;
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 6, -0.9, 0.9);
        ctx.stroke();

        ctx.fillStyle = '#06111d';
        ctx.beginPath();
        ctx.arc(-4, -2, 2.2, 0, Math.PI * 2);
        ctx.arc(4, -2, 2.2, 0, Math.PI * 2);
        ctx.globalAlpha = blink;
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.strokeStyle = '#fff48b';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 4 + grinLift, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(114, 241, 255, 0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 11, state.t * 2.1, state.t * 2.1 + Math.PI * 0.9);
        ctx.stroke();

        ctx.restore();
    }

    function drawSpikeDrone(o) {
        ctx.fillStyle = '#ff4d87';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff4d87';
        if (o.side === -1) ctx.scale(1, -1); // Flip if top

        ctx.beginPath();
        ctx.moveTo(-15, -16);
        ctx.lineTo(15, -16);
        ctx.lineTo(0, 20);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#2c0313';
        ctx.beginPath();
        ctx.arc(-4, -5, 1.6, 0, Math.PI * 2);
        ctx.arc(4, -5, 1.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd3e1';
        ctx.fillRect(-2, 2, 4, 8);
    }

    function drawDataCube(o) {
        ctx.rotate(o.rot);
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#fff48b';
        ctx.fillStyle = '#fff48b';
        ctx.fillRect(-10, -10, 20, 20);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(-7, -7, 14, 14);
        ctx.fillStyle = '#7c6c04';
        ctx.fillRect(-2, -2, 4, 4);
    }

    // --- Render ---
    function draw() {
        const rect = canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;

        // Base Clear
        const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
        bgGrad.addColorStop(0, '#050816');
        bgGrad.addColorStop(0.5, '#091225');
        bgGrad.addColorStop(1, '#050611');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        ctx.save();

        // Screen Shake & Chroma Offset
        let dx = 0, dy = 0;
        if (state.shake > 0) {
            dx = (Math.random() - 0.5) * state.shake;
            dy = (Math.random() - 0.5) * state.shake;
        }
        ctx.translate(dx, dy);

        // Atmosphere glow bands
        const band = ctx.createLinearGradient(0, 0, w, 0);
        band.addColorStop(0, 'rgba(114, 241, 255, 0)');
        band.addColorStop(0.25, 'rgba(114, 241, 255, 0.06)');
        band.addColorStop(0.5, 'rgba(255, 255, 255, 0.03)');
        band.addColorStop(0.75, 'rgba(255, 77, 135, 0.06)');
        band.addColorStop(1, 'rgba(255, 77, 135, 0)');
        ctx.fillStyle = band;
        ctx.fillRect(0, h * 0.2, w, h * 0.6);

        // §2 Parallax Background
        // Layer 1: Distant Stars/Grid
        ctx.strokeStyle = window.gameConfig.gridColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        const gridSize = 80;
        const offset = (state.score * 0.5) % gridSize; // Slower than foreground
        for (let x = -offset; x < w; x += gridSize) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
        }
        for (let y = 0; y < h; y += gridSize) {
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
        }
        ctx.stroke();

        for (let i = 0; i < 18; i++) {
            const starX = ((i * 97) + state.score * (0.08 + (i % 3) * 0.03)) % (w + 40) - 20;
            const starY = (i * 43) % h;
            const size = (i % 3) + 1;
            ctx.fillStyle = i % 4 === 0 ? 'rgba(255, 244, 139, 0.7)' : 'rgba(114, 241, 255, 0.55)';
            ctx.fillRect(starX, starY, size, size);
        }

        // Layer 2: Speed Lines (Floor/Ceiling)
        ctx.strokeStyle = 'rgba(114, 241, 255, 0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 30);
        ctx.lineTo(w, 30);
        ctx.moveTo(0, h - 30);
        ctx.lineTo(w, h - 30);

        const tickSpace = 100;
        const tickOffset = (state.score * 1.0) % tickSpace;
        for (let x = -tickOffset; x < w; x += tickSpace) {
            ctx.moveTo(x, 30);
            ctx.lineTo(x + 20, 30);
            ctx.lineTo(x + 10, 45);
            ctx.moveTo(x, h - 30);
            ctx.lineTo(x + 20, h - 30);
            ctx.lineTo(x + 10, h - 45);
        }
        ctx.stroke();

        if (state.mode !== 'GAMEOVER') {
            // Draw Trail
            ctx.fillStyle = 'rgba(114, 241, 255, 0.16)';
            ctx.beginPath();
            for (let t of trail) {
                ctx.moveTo(t.x + t.r, t.y);
                ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
            }
            ctx.fill();

            drawOrbPilot();
        }

        // Obstacles
        obstacles.forEach(o => {
            if (!o.active) return;
            ctx.save();
            ctx.translate(o.x, o.y);

            if (o.type === 'SPIKE') {
                drawSpikeDrone(o);
            } else {
                drawDataCube(o);
            }
            ctx.restore();
        });

        // Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Chromatic Aberration Effect (Simulated)
        if (state.chroma > 0) {
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = `rgba(255, 0, 0, ${state.chroma * 0.05})`;
            ctx.fillRect(5, 0, w, h);
            ctx.fillStyle = `rgba(0, 200, 255, ${state.chroma * 0.04})`;
            ctx.fillRect(-5, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';
        }

        ctx.restore();
    }

    // --- Loop ---
    let lastTime = 0;
    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error(e);
        }

        if (state.mode !== 'MENU') requestAnimationFrame(loop);
    }

    // Initial Draw
    draw();
});
</script>
