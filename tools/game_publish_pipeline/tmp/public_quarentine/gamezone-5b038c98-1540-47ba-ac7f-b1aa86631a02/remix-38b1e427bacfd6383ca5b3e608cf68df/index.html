<body class="bg-black text-white h-[100dvh] w-full overflow-hidden">

    <!-- Wallpaper Layer -->
    <div id="wallpaper" class="absolute inset-0 bg-starry transition-all duration-700 bg-cover bg-center z-0"></div>
    <div class="space-grid z-0"></div>

                <div class="w-[2px] bg-green-400 animate-[pulse_0.7s_ease-in-out_infinite] h-3"></div>

    <!-- SETUP SCREEN -->

                <button onclick="Setup.setRegion('UK')" class="p-3 rounded-lg text-left font-medium" style="background: rgba(255,255,255,0.82); color:#09111d;">🇬🇧 UK</button>
                <button onclick="Setup.setRegion('DE')" class="p-3 rounded-lg text-left font-medium" style="background: rgba(255,255,255,0.82); color:#09111d;">🇩🇪 Germany</button>
                <button onclick="Setup.setRegion('AU')" class="p-3 rounded-lg text-left font-medium" style="background: rgba(255,255,255,0.82); color:#09111d;">🇦🇺 Australia</button>
                <button onclick="Setup.setRegion('CA')" class="p-3 rounded-lg text-left font-medium" style="background: rgba(255,255,255,0.82); color:#09111d;">🇨🇦 Canada</button>
                <button onclick="Setup.setRegion('FR')" class="p-3 rounded-lg text-left font-medium" style="background: rgba(255,255,255,0.82); color:#09111d;">🇫🇷 France</button>
                <button onclick="Setup.setRegion('KR')" class="p-3 rounded-lg text-left font-medium" style="background: rgba(255,255,255,0.82); color:#09111d;">🇰🇷 Korea</button>
            </div>

            <div class="text-[5.5rem] leading-none font-bold tracking-tighter deck-title" id="lock-time">12:00</div>
            <div class="signal-chip mt-2 deck-mono">Bridge ready</div>
        </div>
        <div class="mt-auto mb-10 flex w-full justify-between px-12">
            <button class="w-12 h-12 rounded-full glass flex items-center justify-center text-xl active:bg-white/40 shadow-lg">🔦</button>
            <button class="w-12 h-12 rounded-full glass flex items-center justify-center text-xl active:bg-white/40 shadow-lg">📷</button>
        </div>
        <div class="absolute bottom-2 w-full flex justify-center pb-4"><div class="w-32 h-1 bg-white rounded-full opacity-50"></div></div>
    </div>

                </div>
                <div class="mt-8 border-t pt-4 flex-1 overflow-y-auto" style="border-color: rgba(136,236,255,0.12);">
                    <h2 class="font-bold mb-2 text-gray-400 uppercase text-xs deck-mono">My Logs</h2>
                    <div id="vp-grid" class="grid grid-cols-3 gap-2"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Music App -->
    <template id="tpl-music">
        <div class="h-full text-white p-4 pt-12 flex flex-col" style="background:
            radial-gradient(circle at top, rgba(136,236,255,0.12), transparent 32%),
            linear-gradient(180deg, #0a1120 0%, #050914 100%);">
            <h1 class="text-3xl font-bold mb-4 deck-title">Signal Library</h1>
            <div class="signal-chip deck-mono mb-4" style="width:fit-content;">Tap a channel to start the ambient loop</div>
            <div class="flex-1 overflow-y-auto space-y-2" id="music-list"></div>
            <div class="h-24 rounded-xl p-4 flex items-center justify-between mb-8 mt-4 border deck-panel">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded flex items-center justify-center text-2xl animate-pulse pulse-core" style="background: linear-gradient(135deg, rgba(136,236,255,0.3), rgba(255,111,216,0.2));">🎵</div>
                    <div><div class="font-bold" id="music-np">No Signal</div><div class="text-xs text-gray-400">Tap a channel</div></div>
                </div>
                <button class="text-3xl" onclick="Music.stop()">⏸</button>
            </div>
        </div>

    <!-- Beat Maker -->
    <template id="tpl-maker">
        <div class="h-full bg-gray-900 text-white flex flex-col p-4 pt-12">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold deck-title">Pulse Mixer</h1>
                <button class="bg-blue-600 px-4 py-1 rounded-full font-bold" onclick="Maker.publish()">Broadcast</button>
            </div>
            <div class="flex-1 grid grid-cols-2 gap-4 mb-4">
                <button class="bg-gray-800 rounded-xl active:bg-pink-500 shadow-lg border border-gray-700 flex flex-col items-center justify-center" onmousedown="Maker.hit(0)" ontouchstart="Maker.hit(0)"><span class="text-2xl">🥁</span><span class="text-xs mt-2 deck-mono">THRUST</span></button>
                <button class="bg-gray-800 rounded-xl active:bg-pink-500 shadow-lg border border-gray-700 flex flex-col items-center justify-center" onmousedown="Maker.hit(1)" ontouchstart="Maker.hit(1)"><span class="text-2xl">💥</span><span class="text-xs mt-2 deck-mono">BURST</span></button>
                <button class="bg-gray-800 rounded-xl active:bg-blue-500 shadow-lg border border-gray-700 flex flex-col items-center justify-center" onmousedown="Maker.hit(2)" ontouchstart="Maker.hit(2)"><span class="text-2xl">🔔</span><span class="text-xs mt-2 deck-mono">PING</span></button>
                <button class="bg-gray-800 rounded-xl active:bg-blue-500 shadow-lg border border-gray-700 flex flex-col items-center justify-center" onmousedown="Maker.hit(3)" ontouchstart="Maker.hit(3)"><span class="text-2xl">🎸</span><span class="text-xs mt-2 deck-mono">DRIVE</span></button>
                <button class="bg-gray-800 rounded-xl active:bg-purple-500 shadow-lg border border-gray-700 flex flex-col items-center justify-center" onmousedown="Maker.hit(4)" ontouchstart="Maker.hit(4)"><span class="text-2xl">🎹</span><span class="text-xs mt-2 deck-mono">GRID</span></button>
                <button class="bg-gray-800 rounded-xl active:bg-purple-500 shadow-lg border border-gray-700 flex flex-col items-center justify-center" onmousedown="Maker.hit(5)" ontouchstart="Maker.hit(5)"><span class="text-2xl">🎺</span><span class="text-xs mt-2 deck-mono">BEACON</span></button>
            </div>
            <div class="h-32 bg-black rounded-xl p-4 border border-gray-700 flex flex-col items-center justify-center gap-2">
                <div class="text-xs text-gray-500 uppercase tracking-widest deck-mono">Transmitter</div>
                <div class="flex gap-6 items-center">
                    <button id="rec-btn" class="w-16 h-16 rounded-full bg-red-600 border-4 border-gray-800 flex items-center justify-center shadow-lg active:scale-95 transition-transform" onclick="Maker.toggleRec()"></button>
                    <div class="text-3xl font-mono" id="rec-time">00:00</div>
                </div>
                <p class="text-[10px] text-gray-600">Record to send a signal to the library</p>
            </div>
        </div>
    </template>

    <script>
        // --- Media Catalog Mapping ---
        const MediaCatalog = {
            fonts: {
                primary: 'Orbitron',
                secondary: 'Exo 2',
                mono: 'Press Start 2P'
            },
            audio: {
                uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
                success: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
                fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3',
                menuOpen: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3',
                startGame: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3',
                pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
                bonus: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3',
                powerup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3',
                loopAmbient: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3',
                loopLibrary: 'https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3'
            },
            gifs: {
                alert: 'https://i.giphy.com/MFPZ483I4x41W.webp',
                celebrate: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp'
            }
        };

        // --- Audio System ---
        const AudioSys = {
            enabled: false,
            unlocked: false,
            players: new Map(),
            loop: null,
            loopName: '',
            lastPlayed: {},
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            prime() {
                if (this.unlocked) return;
                this.unlocked = true;
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                this.enabled = true;
                this.prefetch([
                    MediaCatalog.audio.uiClick,
                    MediaCatalog.audio.success,
                    MediaCatalog.audio.fail,
                    MediaCatalog.audio.menuOpen,
                    MediaCatalog.audio.startGame,
                    MediaCatalog.audio.blocked,
                    MediaCatalog.audio.pickup,
                    MediaCatalog.audio.bonus,
                    MediaCatalog.audio.powerup,
                    MediaCatalog.audio.loopAmbient,
                    MediaCatalog.audio.loopLibrary
                ]);
                Feedback.toast('Audio online');
            },
            prefetch(urls) {
                urls.forEach(url => this.getPlayer(url));
            },
            getPlayer(url, { loop = false, volume = 0.5 } = {}) {
                const key = `${url}|${loop ? 'loop' : 'once'}`;
                if (!this.players.has(key)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    audio.crossOrigin = 'anonymous';
                    audio.loop = loop;
                    audio.volume = volume;
                    this.players.set(key, audio);
                }
                const audio = this.players.get(key);
                audio.loop = loop;
                audio.volume = volume;
                return audio;
            },
            safePlay(url, opts = {}) {
                if (!this.enabled) return;
                const debounce = opts.debounce ?? 80;
                const now = performance.now();
                if (debounce > 0 && this.lastPlayed[url] && now - this.lastPlayed[url] < debounce) return;
                this.lastPlayed[url] = now;
                try {
                    const base = this.getPlayer(url, { loop: false, volume: opts.volume ?? 0.42 });
                    const instance = base.cloneNode();
                    instance.volume = opts.volume ?? 0.42;
                    instance.play().catch(() => {});
                } catch (e) {}
            },
            startLoop(url, label = 'Open channel') {
                if (!this.enabled) return;
                if (this.loopName === url && this.loop && !this.loop.paused) return;
                this.stopLoop();
                try {
                    const loop = this.getPlayer(url, { loop: true, volume: 0.24 });
                    loop.currentTime = 0;
                    loop.play().catch(() => {});
                    this.loop = loop;
                    this.loopName = url;
                    document.getElementById('island-sub').innerText = label;
                } catch (e) {}
            },
            stopLoop() {
                if (this.loop) {
                    this.loop.pause();
                    this.loop.currentTime = 0;
                }
                this.loop = null;
                this.loopName = '';
            },
            click() { this.safePlay(MediaCatalog.audio.uiClick, { volume: 0.35, debounce: 45 }); },
            success() { this.safePlay(MediaCatalog.audio.success, { volume: 0.42, debounce: 110 }); },
            fail() { this.safePlay(MediaCatalog.audio.fail, { volume: 0.42, debounce: 110 }); },
            blocked() { this.safePlay(MediaCatalog.audio.blocked, { volume: 0.36, debounce: 140 }); },
            collect() { this.safePlay(MediaCatalog.audio.pickup, { volume: 0.38, debounce: 100 }); },
            power() { this.safePlay(MediaCatalog.audio.powerup, { volume: 0.4, debounce: 100 }); },
            bonus() { this.safePlay(MediaCatalog.audio.bonus, { volume: 0.44, debounce: 110 }); }
        };

        const Feedback = {
            gifTimer: null,
            toastTimer: null,
            showGif(type = 'alert', duration = 1700) {
                const target = document.getElementById(type === 'celebrate' ? 'gif-hype' : 'gif-alert');
                if (!target) return;
                clearTimeout(this.gifTimer);
                document.querySelectorAll('.feedback-gif').forEach(el => el.classList.remove('feedback-gif-active'));
                target.classList.add('feedback-gif-active');
                this.gifTimer = setTimeout(() => target.classList.remove('feedback-gif-active'), duration);
            },
            toast(message) {
                const el = document.getElementById('station-toast');
                if (!el) return;
                clearTimeout(this.toastTimer);
                el.textContent = message;
                el.classList.add('show');
                this.toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
            }
        };

        document.addEventListener('pointerdown', () => AudioSys.prime(), { once: true });
        document.addEventListener('keydown', () => AudioSys.prime(), { once: true });

        // --- Data ---
        let Data = {
            sys: { setup: false, wifi: false, wallpaper: "bg-starry", region: "US" },
            user: {
                name: "User",
                posts: [],
                tracks: [
                     { t: 'Docking Hum', a: 'Bridge AI', c: 'bg-blue-500', loop: MediaCatalog.audio.loopAmbient },
                     { t: 'Nebula Pulse', a: 'Bridge AI', c: 'bg-pink-500', loop: MediaCatalog.audio.loopLibrary }
                ]
            }
        };

        function save() { localStorage.setItem('iOS26_Remake_v1', JSON.stringify(Data)); }
        function load() {
            try {
                const s = localStorage.getItem('iOS26_Remake_v1');
                if(s) Data = { ...Data, ...JSON.parse(s) };
                if (!Array.isArray(Data.user?.tracks) || !Data.user.tracks.length) {
                    Data.user.tracks = [
                        { t: 'Docking Hum', a: 'Bridge AI', c: 'bg-blue-500', loop: MediaCatalog.audio.loopAmbient },
                        { t: 'Nebula Pulse', a: 'Bridge AI', c: 'bg-pink-500', loop: MediaCatalog.audio.loopLibrary }
                    ];
                } else {
                    Data.user.tracks = Data.user.tracks.map((track, index) => ({
                        ...track,
                        loop: track.loop || (index % 2 === 0 ? MediaCatalog.audio.loopAmbient : MediaCatalog.audio.loopLibrary)
                    }));
                }
            } catch(e){}
        }
        load();

        // --- Keyboard ---
        const Keyboard = {
            target: null,
            open(el, ph) {
                AudioSys.click();
                this.target = el;
                document.getElementById('soft-keyboard').classList.remove('translate-y-full');
                document.getElementById('kb-preview').innerText = ph || 'Enter text...';
                Feedback.toast(ph || 'Console input');
                this.render('alpha');
            },
            close() {
                document.getElementById('soft-keyboard').classList.add('translate-y-full');
                this.target = null;
            },
            type(c) {
                if(!this.target) return;
                AudioSys.click();
                if(c === 'BKSP') this.target.innerText = this.target.innerText.slice(0, -1);
                else if(c === 'SPACE') this.target.innerText += ' ';
                else this.target.innerText += c;
            },
            render(m) {
                const c = document.getElementById('kb-keys'); c.innerHTML = '';
                const rows = m === 'alpha' ?
                    [['q','w','e','r','t','y','u','i','o','p'], ['a','s','d','f','g','h','j','k','l'], ['z','x','c','v','b','n','m']] :
                    [['1','2','3','4','5','6','7','8','9','0'], ['-','/',':',';','(',')','$','&','@','"'], ['.','?','!','#',',']];

                rows.forEach((row, i) => {
                    const d = document.createElement('div'); d.className = 'flex justify-center gap-1 w-full';
                    row.forEach(k => {
                        const b = document.createElement('button'); b.className = 'keyboard-key flex-1 max-w-[32px] uppercase';
                        b.innerText = k; b.onclick = () => this.type(k); d.appendChild(b);
                    });
                    if(i===2) {
                        const bk = document.createElement('button'); bk.className = 'keyboard-key bg-gray-300 w-10 ml-2';
                        bk.innerText = '⌫'; bk.onclick = () => this.type('BKSP'); d.appendChild(bk);
                    }
                    c.appendChild(d);
                });
                const b = document.createElement('div'); b.className = 'flex justify-center gap-2 mt-2 px-1';
                b.innerHTML = `<button class="keyboard-key bg-gray-300 w-12 text-xs" onclick="Keyboard.render('${m==='alpha'?'num':'alpha'}')">${m==='alpha'?'123':'ABC'}</button>
                               <button class="keyboard-key flex-1" onclick="Keyboard.type('SPACE')">space</button>
                               <button class="keyboard-key bg-blue-500 text-white w-16 text-xs" onclick="Keyboard.close()">return</button>`;
                c.appendChild(b);
            }
        };

        // --- System ---
        const System = {
            screen: 'lock',
            init() {
                this.clock(); setInterval(()=>this.clock(), 1000);
                this.setWall(Data.sys.wallpaper);
                this.gestures();
                if(!Data.sys.setup) {
                    this.go('setup');
                    document.getElementById('setup-1').classList.remove('hidden');
                } else {
                    this.go('lock');
                }
            },
            go(s) {
                this.screen = s;
                document.querySelectorAll('.screen').forEach(e => {
                    if(e.id !== `screen-${s}`) { e.classList.add('hidden-screen'); e.classList.remove('screen-center'); }
                });
                const t = document.getElementById(`screen-${s}`);
                if(t) {
                    t.classList.remove('hidden-screen','screen-up','screen-scale-down');
                    t.classList.add('screen-center');
                    if(s==='home') Home.render();
                    if (s !== 'app' && s !== 'home') Music.stop();
                }
            },
            clock() {
                const d = new Date(), t = d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
                document.getElementById('sb-time').innerText = t;
                document.getElementById('lock-time').innerText = t;
                document.getElementById('lock-date').innerText = d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
            },
            setWall(c) {
                Data.sys.wallpaper=c; save();
                document.getElementById('wallpaper').className=`absolute inset-0 transition-all duration-700 bg-cover bg-center z-0 ${c}`;
                Feedback.toast('Viewport recalibrated');
            },
            setRegion(r) {
                Data.sys.region = r; save();
                if(this.screen==='setup') Setup.step(4);
                else {
                    document.getElementById('st-region').innerText = r;
                    AudioSys.success();
                    Feedback.toast(`Sector ${r} linked`);
                }
            },
            reset() {
                 if(confirm("Reboot deck? All local logs will be lost.")) {
                    AudioSys.stopLoop();
                    localStorage.removeItem('iOS26_Remake_v1');
                    location.reload();
                }
            },
            gestures() {
                const b=document.getElementById('gesture-bottom'), t=document.getElementById('gesture-top');
                b.ontouchstart = e => {
                    if(this.screen==='setup') return;
                    const sy=e.touches[0].clientY;
                    const move = tm => {
                        if(sy - tm.touches[0].clientY > 50) {
                            document.removeEventListener('touchmove', move);
                            AudioSys.click();
                            if(this.screen==='lock') {
                                Feedback.toast('Deck unlocked');
                                this.go('home');
                            } else if(this.screen==='app') {
                                document.getElementById('app-container').classList.add('screen-up');
                                document.getElementById('screen-home').classList.remove('screen-scale-down');
                                setTimeout(()=>this.go('home'),300);
                            }
                        }
                    };
                    document.addEventListener('touchmove', move);
                    document.addEventListener('touchend', ()=>document.removeEventListener('touchmove', move), {once:true});
                };
            }
        };

        const Setup = {
            step(n) {
                for(let i=1;i<=4;i++) document.getElementById(`setup-${i}`).classList.add('hidden');
                document.getElementById(`setup-${n}`).classList.remove('hidden');
                AudioSys.click();
                if (n === 2) Feedback.toast('Comms handshake pending');
                if (n === 4) Feedback.showGif('celebrate', 1400);
            },
            wifi() {
                Data.sys.wifi = true;
                document.getElementById('setup-wifi-check').style.display='block';
                document.getElementById('btn-setup-2').style.opacity='1';
                document.getElementById('btn-setup-2').style.pointerEvents='auto';
                document.getElementById('sb-wifi').style.opacity='1';
                AudioSys.collect();
                Feedback.toast('Orbital relay online');
                Feedback.showGif('alert', 1500);
            },
            setRegion(r) { System.setRegion(r); },
            finish() {
                const n = document.getElementById('setup-input').innerText;
                if(n) Data.user.name = n;
                Data.sys.setup = true; save();
                AudioSys.safePlay(MediaCatalog.audio.startGame, { volume: 0.48, debounce: 150 });
                Feedback.showGif('celebrate', 1900);
                Feedback.toast('Console launched');
                System.go('lock');
            }
        };

        const Home = {
            render() {
                // Static dock logic for MVP
            }
        };

        const Apps = {
            open(id) {
                if(!Data.sys.wifi && id!=='settings') {
                    alert("Link comms first");
                    AudioSys.blocked();
                    Feedback.showGif('alert', 1500);
                    Feedback.toast('Comms link required');
                    return;
                }
                AudioSys.safePlay(MediaCatalog.audio.menuOpen, { volume: 0.38, debounce: 80 });
                const c=document.getElementById('current-app-content'), t=document.getElementById(`tpl-${id}`);
                c.innerHTML=''; if(t) c.appendChild(t.content.cloneNode(true));

                const ac=document.getElementById('app-container');
                ac.classList.remove('hidden-screen','screen-up'); ac.classList.add('screen-center');
                document.getElementById('screen-home').classList.add('screen-scale-down');
                System.screen='app';

                if(id==='settings') {
                    document.getElementById('st-name').innerText=Data.user.name;
                    document.getElementById('st-region').innerText=Data.sys.region;
                    Feedback.toast('Deck controls opened');
                }
                if(id==='vinyl') {
                    Vinyl.init();
                    Feedback.toast('Sketch bay opened');
                }
                if(id==='music') {
                    Music.render();
                    Feedback.toast('Signal library opened');
                }
            }
        };

        // --- Vinyl (Social + Drawing) ---
        const Vinyl = {
            scale: 1, rot: 0, mode: 'draw', color: '#000000', hist: [], hStep: -1,
            init() { this.feed(); },
            ui(s) {
                if(s==='create') {
                    document.getElementById('vinyl-create').classList.remove('hidden');
                    AudioSys.power();
                    Feedback.showGif('celebrate', 1300);
                    this.resetCanvas();
                } else if(s==='profile') {
                    document.getElementById('vinyl-profile').classList.remove('hidden');
                    document.getElementById('vp-name').innerText = Data.user.name;
                    const g = document.getElementById('vp-grid'); g.innerHTML='';
                    Data.user.posts.filter(p=>p.au===Data.user.name).forEach(p=>{
                        g.innerHTML+=`<img src="${p.img}" class="w-full h-24 object-cover rounded bg-gray-800">`;
                    });
                    AudioSys.click();
                }
            },
            close() { document.getElementById('vinyl-create').classList.add('hidden'); },
            feed() {
                const c=document.getElementById('vinyl-feed');
                if(!Data.user.posts.length) c.innerHTML='<div class="text-center text-gray-500 mt-20">No logs yet.<br>Sketch a route!</div>';
                else c.innerHTML = Data.user.posts.map(p=>`
                    <div class="rounded-xl overflow-hidden mb-4 border deck-panel">
                        <div class="p-3 flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full crew-avatar" style="background: radial-gradient(circle at 50% 35%, #9cf7ff, #4f86ff 60%, #142649 100%); font-size:1.3rem;"></div>
                            <span class="font-bold">${p.au}</span>
                        </div>
                        <img src="${p.img}" class="w-full bg-white">
                        <div class="p-3 text-sm"><span class="font-bold mr-2">${p.au}</span>${p.cap}</div>
                    </div>`).join('');
            },
            resetCanvas() {
                const cvs = document.getElementById('v-canvas');
                const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,300,400);
                this.scale=1; this.rot=0; this.updateT();
                this.hist=[cvs.toDataURL()]; this.hStep=0;
                this.setupDraw(cvs);
            },
            setupDraw(cvs) {
                const ctx = cvs.getContext('2d');
                let p = false;
                const getPos = (e) => {
                    const rect = cvs.getBoundingClientRect();
                    let cx = e.touches[0].clientX - rect.left;
                    let cy = e.touches[0].clientY - rect.top;
                    cx /= this.scale; cy /= this.scale;
                    const scaleX = cvs.width / rect.width;
                    const scaleY = cvs.height / rect.height;
                    return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
                };

                cvs.ontouchstart = e => { p=true; const xy=getPos(e); ctx.beginPath(); ctx.moveTo(xy.x, xy.y); AudioSys.click(); };
                cvs.ontouchend = () => { if(p) this.saveState(cvs); p=false; };
                cvs.ontouchmove = e => {
                    if(!p) return;
                    const xy=getPos(e);
                    ctx.lineWidth = this.mode==='erase'?20:4;
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = this.mode==='erase'?'#ffffff':this.color;
                    ctx.lineTo(xy.x, xy.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(xy.x, xy.y);
                };
            },
            saveState(cvs) {
                this.hStep++;
                this.hist = this.hist.slice(0, this.hStep);
                this.hist.push(cvs.toDataURL());
            },
            undo() {
                if(this.hStep>0) { this.hStep--; this.loadState(); AudioSys.click(); }
            },
            redo() {
                if(this.hStep<this.hist.length-1) { this.hStep++; this.loadState(); AudioSys.click(); }
            },
            loadState() {
                const i=new Image(); i.src=this.hist[this.hStep];
                i.onload = () => document.getElementById('v-canvas').getContext('2d').drawImage(i,0,0);
            },
            zoom(d) { this.scale = Math.max(0.5, Math.min(2, this.scale+d)); this.updateT(); AudioSys.click(); },
            rotate() { this.rot = (this.rot+90)%360; this.updateT(); AudioSys.click(); },
            updateT() { document.getElementById('vinyl-canvas-layer').style.transform = `scale(${this.scale}) rotate(${this.rot}deg)`; },
            setMode(m) { this.mode=m; if(m==='draw') this.color=document.getElementById('v-color').value; AudioSys.click(); },
            post() {
                const img = document.getElementById('v-canvas').toDataURL();
                const cap = document.getElementById('v-cap').innerText || "#starmap";
                Data.user.posts.unshift({au:Data.user.name, img, cap});
                save(); this.close(); this.feed(); AudioSys.bonus(); Feedback.showGif('celebrate', 1700); Feedback.toast('Sketch logged');
            }
        };

        // --- Music & Maker ---
        const Music = {
            render() {
                const l = document.getElementById('music-list'); l.innerHTML='';
                Data.user.tracks.forEach((t, index) => {
                    l.innerHTML += `<div class="p-3 bg-gray-800 rounded-xl flex items-center gap-3 active:bg-gray-700" onclick="Music.play(${index})">
                        <div class="w-10 h-10 ${t.c} rounded flex items-center justify-center">🎵</div>
                        <div><div class="font-bold">${t.t}</div><div class="text-xs text-gray-400">${t.a}</div></div>
                    </div>`;
                });
            },
            play(index) {
                const track = Data.user.tracks[index];
                if (!track) return;
                document.getElementById('music-np').innerText = track.t;
                document.getElementById('island-content').classList.remove('hidden');
                document.getElementById('island-text').innerText = track.t;
                document.getElementById('island-sub').innerText = 'Looping';
                document.getElementById('dynamic-island').style.width = '140px';
                AudioSys.startLoop(track.loop || MediaCatalog.audio.loopLibrary, 'Looping');
                AudioSys.success();
                Feedback.toast(`${track.t} in rotation`);
                Feedback.showGif('celebrate', 1500);
            },
            stop() {
                const nowPlaying = document.getElementById('music-np');
                const islandContent = document.getElementById('island-content');
                const island = document.getElementById('dynamic-island');
                if (nowPlaying) nowPlaying.innerText = "No Signal";
                if (islandContent) islandContent.classList.add('hidden');
                if (island) island.style.width = '120px';
                AudioSys.stopLoop();
                Feedback.toast('Signal muted');
            }
        };

        const Maker = {
            rec: false, start: 0,
            hit(i) {
                const soundByPad = [
                    MediaCatalog.audio.powerup,
                    MediaCatalog.audio.bonus,
                    MediaCatalog.audio.pickup,
                    MediaCatalog.audio.success,
                    MediaCatalog.audio.uiClick,
                    MediaCatalog.audio.fail
                ];
                AudioSys.safePlay(soundByPad[i] || MediaCatalog.audio.uiClick, { volume: 0.4, debounce: 50 });
                if(this.rec) document.getElementById('rec-time').style.color='#4ade80';
                setTimeout(()=>document.getElementById('rec-time').style.color='white',100);
            },
            toggleRec() {
                this.rec = !this.rec;
                const b = document.getElementById('rec-btn');
                if(this.rec) {
                    b.classList.add('animate-pulse');
                    this.start = Date.now();
                    AudioSys.power();
                    Feedback.showGif('alert', 1300);
                    Feedback.toast('Recording live');
                    this.loop();
                } else {
                    b.classList.remove('animate-pulse');
                    AudioSys.success();
                    Feedback.toast('Recording paused');
                }
            },
            loop() {
                if(!this.rec) return;
                const s = Math.floor((Date.now()-this.start)/1000);
                document.getElementById('rec-time').innerText = `00:${s.toString().padStart(2,'0')}`;
                requestAnimationFrame(this.loop.bind(this));
            },
            publish() {
                if(this.rec) this.toggleRec();
                const n = prompt("Signal Title:", "My Pulse");
                if(n) {
                    const loopUrl = Data.user.tracks.length % 2 === 0 ? MediaCatalog.audio.loopAmbient : MediaCatalog.audio.loopLibrary;
                    Data.user.tracks.unshift({t:n, a:Data.user.name, c:'bg-purple-600', loop: loopUrl});
                    save();
                    AudioSys.bonus();
                    Feedback.showGif('celebrate', 1800);
                    Feedback.toast('Broadcast saved');
                    alert("Broadcast saved to Signal Library!");
                } else {
                    AudioSys.fail();
                }
            }
        };

        window.onload = System.init.bind(System);
    </script>
</body>
</html>
