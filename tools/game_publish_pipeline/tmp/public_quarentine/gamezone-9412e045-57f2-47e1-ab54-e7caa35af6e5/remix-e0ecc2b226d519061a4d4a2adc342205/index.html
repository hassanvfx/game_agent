<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Sprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #66d7ff;
            --sky-bottom: #17245f;
            --haze: rgba(223, 245, 255, 0.4);
            --panel-bg: rgba(12, 22, 60, 0.56);
            --panel-border: rgba(168, 236, 255, 0.72);
            --panel-shadow: rgba(6, 12, 38, 0.42);
            --text-shadow: 0 3px 0 rgba(9, 17, 48, 0.85);
            --green-top: #78f39a;
            --green-bottom: #1db66a;
            --green-shadow: #0f7a47;
            --blue-top: #78bfff;
            --blue-bottom: #356bff;
            --blue-shadow: #1e3fa8;
            --yellow: #ffe45f;
            --red: #ff4d6d;
            --ui-cyan: #8af3ff;
            --ui-white: #f7fbff;
            --track-top: #6677af;
            --track-face: #47598d;
            --track-shadow: #243156;
            --trap-core: #ff5c7c;
            --trap-glow: rgba(255, 92, 124, 0.45);
            --runner-visor: #fff8c6;
            --runner-core: #ffd34d;
            --runner-suit: #6c8cff;
            --runner-boot: #ff8f3f;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(204, 247, 255, 0.72), transparent 28%),
                linear-gradient(180deg, var(--sky-top) 0%, #44aef2 26%, #3153bf 72%, var(--sky-bottom) 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.3), transparent 18%),
                radial-gradient(circle at 80% 20%, rgba(145, 241, 255, 0.18), transparent 20%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 30%);
            opacity: 0.9;
        }

        .game-container::after {
            background:
                linear-gradient(180deg, transparent 0%, rgba(11, 20, 51, 0.08) 60%, rgba(11, 20, 51, 0.32) 100%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(22, 41, 101, 0.88), rgba(11, 23, 71, 0.8));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 14px 36px var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            padding: 40px;
            max-width: min(90vw, 520px);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.22), transparent 38%),
                radial-gradient(circle at 50% 0%, rgba(138, 243, 255, 0.2), transparent 42%);
            pointer-events: none;
        }

        .screen-hidden {
            display: none;
        }

        .title,
        .game-over-title {
            font-family: 'Orbitron', system-ui, sans-serif;
            text-transform: uppercase;
        }

        .title {
            margin: 0 0 10px;
            font-size: clamp(2.8rem, 8vw, 4.5rem);
            line-height: 0.95;
            color: var(--yellow);
            letter-spacing: 0.08em;
        }

        .subtitle,
        .score-line,
        .hint {
            color: var(--ui-white);
            text-shadow: var(--text-shadow);
        }

        .subtitle {
            margin: 0 0 28px;
            font-size: clamp(1.05rem, 3vw, 1.35rem);
            line-height: 1.35;
            max-width: 22ch;
        }

        .score-line {
            font-size: clamp(1.35rem, 4vw, 2rem);
            margin: 0 0 28px;
            font-weight: 700;
        }

        .button {
            border: 2px solid rgba(255, 255, 255, 0.32);
            border-radius: 16px;
            color: #fff;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1rem, 3vw, 1.3rem);
            padding: 16px 34px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            position: relative;
        }

        .button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(4px);
        }

        .button-start {
            background: linear-gradient(to bottom, var(--green-top), var(--green-bottom));
            box-shadow: 0 6px 0 var(--green-shadow), 0 0 18px rgba(120, 243, 154, 0.24);
        }

        .button-start:active {
            box-shadow: 0 2px 0 var(--green-shadow);
        }

        .button-restart {
            background: linear-gradient(to bottom, var(--blue-top), var(--blue-bottom));
            box-shadow: 0 6px 0 var(--blue-shadow), 0 0 18px rgba(120, 191, 255, 0.24);
        }

        .button-restart:active {
            box-shadow: 0 2px 0 var(--blue-shadow);
        }

        .text-outline {
            text-shadow: var(--text-shadow);
        }

        .game-over-title {
            margin: 0 0 16px;
            color: var(--red);
            font-size: clamp(2.3rem, 7vw, 3.8rem);
        }

        .hud {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
        }

        .hud.hidden,
        .controls-hint.hidden {
            display: none;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud-pill {
            background:
                linear-gradient(180deg, rgba(17, 34, 82, 0.84), rgba(10, 21, 59, 0.84));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(138, 243, 255, 0.5);
            border-radius: 999px;
            padding: 10px 18px;
            box-shadow:
                0 8px 20px rgba(4, 10, 30, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.24);
        }

        .hud-text {
            color: #fff;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(0.95rem, 3vw, 1.3rem);
            letter-spacing: 0.04em;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .hud-value {
            color: var(--yellow);
        }

        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        .controls-hint {
            position: absolute;
            bottom: max(24px, calc(env(safe-area-inset-bottom) + 10px));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(247, 251, 255, 0.95);
            font-size: clamp(0.92rem, 3vw, 1.08rem);
            text-align: center;
            animation: pulse 1.7s infinite;
            padding: 0 16px;
            font-weight: 600;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.58; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-2px); }
        }

        .feedback-overlay {
            position: absolute;
            right: max(16px, env(safe-area-inset-right));
            top: max(96px, calc(env(safe-area-inset-top) + 78px));
            width: min(26vw, 132px);
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-8px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 3;
        }

        .feedback-overlay.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            width: 100%;
            height: auto;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 24px rgba(9, 17, 48, 0.32);
            background: rgba(8, 13, 38, 0.34);
        }

        .feedback-overlay.fail-overlay {
            top: max(110px, calc(env(safe-area-inset-top) + 92px));
            width: min(30vw, 148px);
        }

        @media (max-width: 640px) {
            .glass-panel {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .button {
                width: 100%;
            }

            .hud {
                top: max(14px, env(safe-area-inset-top));
                left: max(14px, env(safe-area-inset-left));
            }

            .hud-pill {
                padding: 9px 15px;
            }

            .feedback-overlay {
                top: max(78px, calc(env(safe-area-inset-top) + 62px));
                width: min(28vw, 108px);
            }

            .feedback-overlay.fail-overlay {
                top: max(88px, calc(env(safe-area-inset-top) + 72px));
                width: min(32vw, 120px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel">
                <h1 class="title text-outline">SKY SPRINT</h1>
                <p class="subtitle">Pilot the comet runner across drifting lanes and dodge the crimson shock bars.</p>
                <button id="start-btn" class="button button-start">Start Run</button>
            </div>

            <div id="game-over-screen" class="screen-hidden glass-panel">
                <h2 class="game-over-title text-outline">RUN OVER</h2>
                <div class="score-line">Distance: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="button button-restart">Run Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-pill">
                    <span class="hud-text">Distance: <span id="score" class="hud-value">0</span></span>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: score-and-fail-feedback -> catalogs/gifs.json -->
            <div id="score-feedback" class="feedback-overlay" aria-hidden="true">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Score boost reaction">
            </div>

            <div id="fail-feedback" class="feedback-overlay fail-overlay" aria-hidden="true">
                <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Run over reaction">
            </div>

            <div id="controls-hint" class="controls-hint hidden text-outline">
                Tap, click, or press Space to leap
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                score: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.poolLimit = 3;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayed = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                if (this.ready) return;
                this.ready = true;
                this.bgm.load();
                for (const audio of Object.values(this.sfx)) {
                    audio.load();
                }
            }

            playBGM() {
                if (!this.ready) this.unlock();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { volume = 0.62, cooldown = 0 } = {}) {
                const now = performance.now();
                if (cooldown > 0 && this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) {
                    return;
                }
                const base = this.sfx[key];
                if (!base) return;
                this.lastPlayed[key] = now;
                const clone = base.cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        const scoreFeedback = document.getElementById('score-feedback');
        const failFeedback = document.getElementById('fail-feedback');
        let feedbackTimer = null;

        function showFeedback(type, duration = 900) {
            const target = type === 'fail' ? failFeedback : scoreFeedback;
            const other = type === 'fail' ? scoreFeedback : failFeedback;
            if (!target) return;
            other.classList.remove('visible');
            target.classList.add('visible');
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                target.classList.remove('visible');
            }, duration);
        }

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let frameCount = 0;
        let score = 0;
        let gameSpeed = 5;

        // Physics
        let gravity = 0.6;
        let jumpForce = -12;

        // Player
        let player = {
            x: 100,
            y: 0,
            w: 40,
            h: 80,
            vy: 0,
            grounded: false,
            colorHead: '#FFD34D',
            colorTorso: '#6C8CFF',
            colorLegs: '#FF8F3F'
        };

        // World
        let platforms = [];
        let clouds = [];
        let wasGrounded = false;

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GENERATORS */
        function createCloud(far) {
            return {
                x: width + Math.random() * 200,
                y: Math.random() * (height / 2),
                w: 60 + Math.random() * 100,
                h: 30 + Math.random() * 40,
                speed: far ? 0.5 : 1.5,
                color: far ? 'rgba(255,255,255,0.34)' : 'rgba(255,255,255,0.7)'
            };
        }

        function initClouds() {
            clouds = [];
            for (let i = 0; i < 10; i++) {
                let c = createCloud(i % 2 === 0);
                c.x = Math.random() * width;
                clouds.push(c);
            }
        }

        function createPlatform(xStart) {
            let pWidth = 100 + Math.random() * 150;
            let pY = height - 150 - Math.random() * 150;

            if (platforms.length > 0) {
                let lastP = platforms[platforms.length - 1];
                pY = lastP.y + (Math.random() * 100 - 50);
                if (pY > height - 50) pY = height - 100;
                if (pY < height - 300) pY = height - 250;
            } else {
                pY = height - 150;
            }

            let hasTrap = Math.random() > 0.6 && score > 2;

            return {
                x: xStart,
                y: pY,
                w: pWidth,
                h: 40,
                trap: hasTrap ? {
                    x: xStart + pWidth * 0.3,
                    y: pY - 20,
                    w: pWidth * 0.4,
                    h: 20
                } : null,
                passed: false
            };
        }

        function initGame() {
            score = 0;
            gameSpeed = 5;
            frameCount = 0;
            player.y = height / 2;
            player.vy = 0;
            player.grounded = false;
            wasGrounded = false;

            platforms = [];
            platforms.push({ x: 50, y: height - 150, w: 400, h: 40, trap: null, passed: true });

            let currentX = 500;
            for (let i = 0; i < 5; i++) {
                let p = createPlatform(currentX);
                platforms.push(p);
                currentX += p.w + 100 + Math.random() * 80;
            }

            initClouds();
            document.getElementById('score').innerText = score;
        }

        function drawCloud(cloud) {
            const puffSize = cloud.h * 0.58;
            ctx.fillStyle = cloud.color;
            ctx.beginPath();
            ctx.ellipse(cloud.x + cloud.w * 0.2, cloud.y + cloud.h * 0.55, puffSize * 0.85, puffSize * 0.65, 0, 0, Math.PI * 2);
            ctx.ellipse(cloud.x + cloud.w * 0.48, cloud.y + cloud.h * 0.4, puffSize, puffSize * 0.82, 0, 0, Math.PI * 2);
            ctx.ellipse(cloud.x + cloud.w * 0.72, cloud.y + cloud.h * 0.56, puffSize * 0.92, puffSize * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlatform(p) {
            const topHeight = 14;
            const faceHeight = p.h - 2;

            ctx.save();
            ctx.shadowColor = 'rgba(9, 17, 48, 0.24)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 6;

            ctx.fillStyle = '#6f82be';
            ctx.beginPath();
            ctx.roundRect(p.x, p.y - 2, p.w, topHeight, 10);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.fillStyle = getTrackGradient(p.y, p.h);
            ctx.beginPath();
            ctx.roundRect(p.x, p.y + 8, p.w, faceHeight, 12);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            for (let s = 12; s < p.w - 22; s += 44) {
                ctx.beginPath();
                ctx.roundRect(p.x + s, p.y + 2, 24, 6, 3);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(22, 33, 76, 0.28)';
            ctx.beginPath();
            ctx.roundRect(p.x + 10, p.y + p.h - 10, p.w - 20, 8, 4);
            ctx.fill();

            if (p.trap) {
                ctx.shadowColor = 'rgba(255, 92, 124, 0.5)';
                ctx.shadowBlur = 16;
                ctx.fillStyle = '#ff7b91';
                ctx.beginPath();
                ctx.roundRect(p.trap.x, p.trap.y, p.trap.w, p.trap.h, 8);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff3f63';
                for (let s = 10; s < p.trap.w - 10; s += 18) {
                    ctx.beginPath();
                    ctx.moveTo(p.trap.x + s, p.trap.y + p.trap.h);
                    ctx.lineTo(p.trap.x + s + 8, p.trap.y);
                    ctx.lineTo(p.trap.x + s + 16, p.trap.y + p.trap.h);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.strokeStyle = 'rgba(255, 209, 217, 0.7)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.trap.x + 6, p.trap.y + 4);
                ctx.lineTo(p.trap.x + p.trap.w - 6, p.trap.y + 4);
                ctx.stroke();
            }

            ctx.restore();
        }

        function getTrackGradient(y, h) {
            const gradient = ctx.createLinearGradient(0, y, 0, y + h);
            gradient.addColorStop(0, '#6e7fc2');
            gradient.addColorStop(0.28, '#5b6fae');
            gradient.addColorStop(1, '#33477d');
            return gradient;
        }

        function drawPlayer() {
            const bob = Math.sin(frameCount / 10) * 1.5;
            const boost = Math.max(-10, Math.min(10, player.vy)) / 10;
            const baseX = player.x;
            const baseY = player.y + bob;

            ctx.save();
            ctx.shadowColor = 'rgba(21, 42, 120, 0.28)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 6;

            ctx.fillStyle = 'rgba(16, 27, 72, 0.22)';
            ctx.beginPath();
            ctx.ellipse(baseX + 20, baseY + 82, 22, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            ctx.fillStyle = '#ff9d4f';
            ctx.beginPath();
            ctx.roundRect(baseX + 5, baseY + 56, 12, 24, 5);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(baseX + 23, baseY + 56, 12, 24, 5);
            ctx.fill();

            ctx.fillStyle = '#ffb166';
            ctx.beginPath();
            ctx.roundRect(baseX + 3, baseY + 74, 14, 6, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(baseX + 23, baseY + 74, 14, 6, 3);
            ctx.fill();

            ctx.fillStyle = '#6c8cff';
            ctx.beginPath();
            ctx.roundRect(baseX + 2, baseY + 20, 36, 36, 12);
            ctx.fill();

            ctx.fillStyle = '#8fa5ff';
            ctx.beginPath();
            ctx.roundRect(baseX + 6, baseY + 24, 28, 11, 6);
            ctx.fill();

            ctx.fillStyle = '#4f68df';
            ctx.beginPath();
            ctx.roundRect(baseX - 2, baseY + 26, 8, 22, 4);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(baseX + 34, baseY + 28, 8, 20, 4);
            ctx.fill();

            ctx.fillStyle = '#ffd34d';
            ctx.beginPath();
            ctx.roundRect(baseX + 4, baseY - 4, 32, 30, 12);
            ctx.fill();

            ctx.fillStyle = '#fff4b5';
            ctx.beginPath();
            ctx.roundRect(baseX + 10, baseY + 2, 20, 8, 4);
            ctx.fill();

            ctx.fillStyle = '#1f2f77';
            ctx.beginPath();
            ctx.roundRect(baseX + 9, baseY + 9, 22, 10, 5);
            ctx.fill();

            ctx.fillStyle = '#a8f3ff';
            ctx.beginPath();
            ctx.roundRect(baseX + 11, baseY + 11, 18, 6, 3);
            ctx.fill();

            ctx.fillStyle = '#243156';
            ctx.beginPath();
            ctx.roundRect(baseX + 17, baseY + 20, 6, 4 + Math.max(0, boost * 2), 2);
            ctx.fill();

            if (!player.grounded) {
                ctx.strokeStyle = 'rgba(138, 243, 255, 0.55)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(baseX - 2, baseY + 60);
                ctx.lineTo(baseX - 10 - boost * 2, baseY + 68);
                ctx.moveTo(baseX + 42, baseY + 60);
                ctx.lineTo(baseX + 50 - boost * 2, baseY + 68);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawBackground() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#6ee2ff');
            skyGradient.addColorStop(0.3, '#4bb7ff');
            skyGradient.addColorStop(0.72, '#3758be');
            skyGradient.addColorStop(1, '#16255f');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            const sunGradient = ctx.createRadialGradient(width * 0.74, height * 0.18, 10, width * 0.74, height * 0.18, height * 0.18);
            sunGradient.addColorStop(0, 'rgba(255, 246, 183, 0.95)');
            sunGradient.addColorStop(0.28, 'rgba(255, 228, 111, 0.5)');
            sunGradient.addColorStop(1, 'rgba(255, 228, 111, 0)');
            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(width * 0.74, height * 0.18, height * 0.18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.fillRect(0, height * 0.7, width, height * 0.015);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fillRect(0, height * 0.74, width, height * 0.022);
        }

        /** 5. GAME LOOP */
        function update() {
            if (!gameActive) return;
            frameCount++;

            if (frameCount % 600 === 0) gameSpeed += 0.2;

            player.vy += gravity;
            player.y += player.vy;
            player.grounded = false;

            for (let p of platforms) {
                if (
                    player.x + player.w > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.h >= p.y &&
                    player.y + player.h <= p.y + p.h + 20 &&
                    player.vy >= 0
                ) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = p.y - player.h;
                }
            }

            if (player.grounded && !wasGrounded) {
                audio.playSFX('land', { volume: 0.42, cooldown: 120 });
            }
            wasGrounded = player.grounded;

            let lastP = platforms[platforms.length - 1];

            for (let i = platforms.length - 1; i >= 0; i--) {
                let p = platforms[i];
                p.x -= gameSpeed;

                if (p.trap) {
                    p.trap.x -= gameSpeed;

                    if (
                        player.x + player.w > p.trap.x &&
                        player.x < p.trap.x + p.trap.w &&
                        player.y + player.h > p.trap.y &&
                        player.y < p.trap.y + p.trap.h
                    ) {
                        gameOver();
                    }
                }

                if (!p.passed && player.x > p.x + p.w) {
                    p.passed = true;
                    score++;
                    audio.playSFX('score', { volume: 0.5, cooldown: 80 });
                    showFeedback('score', 720);
                    document.getElementById('score').innerText = score;
                }

                if (p.x + p.w < -100) {
                    platforms.splice(i, 1);
                }
            }

            if (lastP.x < width) {
                let gap = 120 + Math.random() * 60 + (gameSpeed * 2);
                let newX = lastP.x + lastP.w + gap;
                platforms.push(createPlatform(newX));
            }

            for (let c of clouds) {
                c.x -= c.speed;
                if (c.x + c.w < 0) {
                    c.x = width + Math.random() * 100;
                    c.y = Math.random() * (height / 2);
                }
            }

            if (player.y > height) {
                gameOver();
            }
        }

        function draw() {
            drawBackground();

            for (let c of clouds) {
                drawCloud(c);
            }

            for (let p of platforms) {
                drawPlatform(p);
            }

            if (gameActive) {
                drawPlayer();
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.7 });
            showFeedback('fail', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls-hint').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('screen-hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (gameActive && player.grounded) {
                player.vy = jumpForce;
                player.grounded = false;
                wasGrounded = false;
                audio.playSFX('jump', { volume: 0.52, cooldown: 100 });
            }
        }

        /** 6. CONTROLS */
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.55 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('screen-hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-hint').classList.remove('hidden');
            failFeedback.classList.remove('visible');
            gameActive = true;
            initGame();
            gameLoop();
        });

        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.5 });
            document.getElementById('game-over-screen').classList.add('screen-hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-hint').classList.remove('hidden');
            failFeedback.classList.remove('visible');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        });

        // [agent-note][stage5] repaired: mobile-gameplay-tap-targeting | scope: gameplay tap only | reason: overlay descendants could intercept canvas-targeted taps
        window.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            if (e.target.closest('button')) return;
            e.preventDefault();
            jump();
        }, { passive: false });

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                jump();
            }
        });

        drawBackground();
    });
    </script>
</body>
