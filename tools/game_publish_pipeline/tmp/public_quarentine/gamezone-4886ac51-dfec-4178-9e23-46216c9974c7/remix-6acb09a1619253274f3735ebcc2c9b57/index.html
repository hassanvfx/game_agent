<body>

<!-- Assets -->
<div id="assets" hidden>

<script>
/**
 * Meme arcade reskin: taps still open the same minigames, but each post format
 * is framed as a moderation check instead of a kitchen order.
 * [agent-note][stage2] visual-intent: neon mod-console styling | scope: bot,hud,overlays
 */

/**
 * §0 System Invariants & Polyfills
 */
const dpr = window.devicePixelRatio || 1;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let initialized = false;
let ro;

// State
let gameState = 'PLAYING'; // PLAYING, MINIGAME, GAMEOVER
let lastTime = 0;
let timeScale = 1.0;

// Config
let gameConfig = {};
try {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;
} catch(e) {
    gameConfig = { basePatience: 12, spawnRate: 2.2, themeColor: "#F97316" };
}

// Audio System
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const audioBuffers = {};
let bgmStarted = false;
let lastSfxAt = 0;
const reactionGif = document.getElementById('reaction-gif');
const GIFS = {
    unlock: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
    fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
};

async function initAudio() {
    if (!audioCtx) return;
    const loadBuffer = async (id) => {
        const el = document.getElementById(id);
        if (!el || !el.src) return;
        try {
            const res = await fetch(el.src);
            const arrayBuffer = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch(e) { console.warn('Audio load failed', id); }
    };
    await Promise.all(['sfx_coin', 'sfx_success', 'sfx_pancake', 'sfx_steak', 'sfx_fail'].map(loadBuffer));
}

function playSfx(id, options = {}) {
    if (!audioCtx) return;
    const nowMs = performance.now();
    const minGap = options.minGap ?? 70;
    if (nowMs - lastSfxAt < minGap) return;
    lastSfxAt = nowMs;

    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (audioBuffers[id]) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        gain.gain.value = options.volume ?? 0.4;
        source.buffer = audioBuffers[id];
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } else {
        synthesizeSfx(options.fallback ?? id);
    }
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'chop') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    } else if (type === 'fry') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(60, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.4);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    }
}

function setReactionGif(type) {
    if (!reactionGif) return;
    const src = GIFS[type];
    if (!src) {
        reactionGif.classList.remove('is-active');
        reactionGif.hidden = true;
        return;
    }
    reactionGif.src = src;
    reactionGif.hidden = false;
    reactionGif.classList.add('is-active');
    clearTimeout(setReactionGif.timeoutId);
    setReactionGif.timeoutId = setTimeout(() => {
        reactionGif.classList.remove('is-active');
        reactionGif.hidden = true;
    }, 1500);
}

function playBgm() {
    const el = document.getElementById('bgm_main');
    if (!el || bgmStarted) return;
    bgmStarted = true;
    el.volume = 0.2;
    el.play().catch(() => { bgmStarted = false; });
}

function stopBgm() {
    const el = document.getElementById('bgm_main');
    if (!el) return;
    el.pause();
    el.currentTime = 0;
    bgmStarted = false;
}

function vibrate(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style }
    });
    if (navigator.vibrate) {
        if (style === 'heavy') navigator.vibrate(200);
        else if (style === 'medium') navigator.vibrate(100);
        else navigator.vibrate(50);
    }
}

/**
 * §1 Game Logic & Entities
 */
const POSTS = {
    selfie: { id: 'selfie', name: 'Selfie', type: 'chop', cost: 0, reward: 15, color: '#4ADE80', icon: '🤳', desc: 'Tap on Green!' },
    rant: { id: 'rant', name: 'Rant', type: 'fry', cost: 60, reward: 35, color: '#FDBA74', icon: '😤', desc: 'Hold, then Drop!' },
    pancake: { id: 'pancake', name: 'Loop Clip', type: 'flip', cost: 150, reward: 50, color: '#FDE047', icon: '📹', desc: 'Tap to Catch!' },
    soup: { id: 'soup', name: 'Spam Wave', type: 'mix', cost: 250, reward: 65, color: '#F472B6', icon: '🌀', desc: 'Tap Rapidly!' },
    steak: { id: 'steak', name: 'Hot Take', type: 'sear', cost: 400, reward: 90, color: '#E11D48', icon: '🔥', desc: 'Heat, then Post!' }
};

let player = { coins: 0, unlocked: ['selfie'] };
let customers = [];
let particles = [];
let activeMiniGame = null;
let spawnTimer = 0;
let score = 0;

class Particle {
    constructor(x, y, color, type = 'circle') {
        this.x = x; this.y = y;
        this.color = color;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = Math.random() * 6 + 3;
        this.rot = Math.random() * Math.PI;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.25;
        this.life -= this.decay;
        this.rot += this.rotSpeed;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        if (this.type === 'square') {
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
        ctx.globalAlpha = 1.0;
    }
}

class Customer {
    constructor() {
        this.id = Date.now() + Math.random();
        this.x = cw / 2;
        this.y = -120;
        this.targetY = 180 + (customers.length * 120);

        const available = player.unlocked;
        this.dishId = available[Math.floor(Math.random() * available.length)];

        this.patience = gameConfig.basePatience;
        this.maxPatience = gameConfig.basePatience;
        this.state = 'waiting';
        this.scale = 0;
        this.wobble = Math.random() * Math.PI * 2;
    }
    update(dt) {
        this.wobble += dt * 4;

        if (this.y < this.targetY) {
            this.y += (this.targetY - this.y) * 6 * dt;
        }
        if (this.scale < 1) this.scale += (1 - this.scale) * 6 * dt;

        if (this.state === 'waiting' && gameState !== 'MINIGAME') {
            this.patience -= dt;
            if (this.patience <= 0) {
                this.state = 'angry';
                failGame();
            }
        }
    }
    draw(ctx) {
        const dish = POSTS[this.dishId];
        const bob = Math.sin(this.wobble) * 4;

        ctx.save();
        ctx.translate(this.x, this.y + bob);
        ctx.scale(this.scale, this.scale);

        ctx.fillStyle = this.state === 'angry' ? '#FECACA' : '#FFF';
        ctx.beginPath();
        ctx.roundRect(-45, -45, 90, 90, 24);
        ctx.fill();

        ctx.shadowColor = 'rgba(0,0,0,0.08)';
        ctx.shadowBlur = 15;
        ctx.shadowOffsetY = 8;

        ctx.font = '700 46px Rajdhani';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(dish.icon, 0, -5);

        ctx.font = '700 12px Rajdhani';
        ctx.fillStyle = '#9FB0D8';
        ctx.fillText(dish.name, 0, 30);

        if (this.state === 'waiting') {
            const pct = Math.max(0, this.patience / this.maxPatience);
            const radius = 55;
            ctx.beginPath();
            ctx.arc(0, 0, radius, -Math.PI/2, -Math.PI/2 + (Math.PI*2 * pct));
            ctx.strokeStyle = pct < 0.3 ? '#EF4444' : (pct < 0.6 ? '#F59E0B' : '#10B981');
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        ctx.restore();
    }
}

class MiniGame {
    constructor(customer) {
        this.customer = customer;
        this.dish = POSTS[customer.dishId];
        this.type = this.dish.type;
        this.timer = 0;

        if (this.type === 'chop' || this.type === 'flip') {
            this.cursor = 0;
            this.dir = 1;
            this.speed = this.type === 'flip' ? 3.0 : 2.5;
            this.targetStart = 0.4;
            this.targetEnd = 0.6;
        } else if (this.type === 'fry' || this.type === 'sear') {
            this.heat = 0;
            this.targetMin = 0.75;
            this.targetMax = 0.95;
            this.heatSpeed = this.type === 'sear' ? 0.4 : 0.5;
        } else if (this.type === 'mix') {
            this.mixLevel = 0;
            this.decay = 0.35;
        }
    }

    update(dt) {
        this.timer += dt;

        if (this.type === 'chop' || this.type === 'flip') {
            this.cursor += this.speed * this.dir * dt;
            if (this.cursor > 1 || this.cursor < 0) this.dir *= -1;
        } else if (this.type === 'mix') {
            this.mixLevel = Math.max(0, this.mixLevel - this.decay * dt);
        }
    }

    interact() {
        if (this.type === 'chop' || this.type === 'flip') {
            if (this.cursor >= this.targetStart && this.cursor <= this.targetEnd) {
                this.win();
            } else {
                vibrate('medium');
                playSfx('sfx_fail', { volume: 0.35, fallback: 'fail', minGap: 100 });
            }
        } else if (this.type === 'mix') {
            this.mixLevel += 0.15;
            playSfx('sfx_coin', { volume: 0.18, fallback: 'chop', minGap: 90 });
            if (this.mixLevel >= 1) this.win();
        }
    }

    hold(dt) {
        if (this.type === 'fry' || this.type === 'sear') {
            this.heat += dt * this.heatSpeed;
            if (this.heat > 1.1) {
                failGame();
            }
        }
    }

    release() {
        if (this.type === 'fry' || this.type === 'sear') {
            if (this.heat >= this.targetMin && this.heat <= this.targetMax) {
                this.win();
            } else {
                this.heat = 0;
                vibrate('medium');
                playSfx('sfx_fail', { volume: 0.35, fallback: 'fail', minGap: 100 });
            }
        }
    }

    win() {
        const sfx = this.type === 'flip' ? 'sfx_pancake' :
                   (this.type === 'sear' ? 'sfx_steak' : 'sfx_success');
        playSfx(sfx, { volume: 0.42, minGap: 80 });
        vibrate('light');
        completeOrder(this.customer);
    }
}

/**
 * §2 Lifecycle & Rendering
 */

function initGame() {
    player.coins = 0;
    player.unlocked = ['selfie'];
    customers = [];
    particles = [];
    activeMiniGame = null;
    score = 0;
    spawnTimer = 0;
    lastTime = 0;

    updateUI();
    initAudio();

    gameState = 'PLAYING';
    initialized = true;
    customers.push(new Customer());

    requestAnimationFrame(loop);
}

function resize() {
    const rect = canvas.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!initialized) initGame();
    else {
        customers.forEach(c => c.x = cw / 2);
    }
}

ro = new ResizeObserver(resize);
document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
    setupUI();
});

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    draw();

    if (gameState !== 'GAMEOVER') requestAnimationFrame(loop);
}

function update(dt) {
    if (gameState === 'GAMEOVER') return;

    particles.forEach(p => p.update());
    particles = particles.filter(p => p.life > 0);

    if (gameState === 'MINIGAME') {
        if (activeMiniGame) {
            activeMiniGame.update(dt);
            if (isPointerDown && (activeMiniGame.type === 'fry' || activeMiniGame.type === 'sear')) {
                activeMiniGame.hold(dt);
                if (Math.random() < 0.08) playSfx('sfx_steak', { volume: 0.08, fallback: 'fry', minGap: 220 });
                if (activeMiniGame.type === 'sear' && Math.random() < 0.2) {
                    particles.push(new Particle(cw/2 + (Math.random()-0.5)*40, ch/2, '#555', 'circle'));
                }
            }
        }
    } else {
        spawnTimer += dt;
        if (spawnTimer > gameConfig.spawnRate && customers.length < 6) {
            customers.push(new Customer());
            spawnTimer = 0;
        }

        customers.forEach(c => c.update(dt));
        customers.forEach((c, i) => {
            c.targetY = 180 + (i * 120);
        });
    }
}

function draw() {
        const gradient = ctx.createLinearGradient(0, 0, 0, ch);
        gradient.addColorStop(0, '#120a28');
        gradient.addColorStop(0.5, '#1f1148');
        gradient.addColorStop(1, '#070c1d');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, cw, ch);

        const glowY = ch * 0.18;
        const glow = ctx.createRadialGradient(cw / 2, glowY, 10, cw / 2, glowY, cw * 0.55);
        glow.addColorStop(0, 'rgba(116, 227, 255, 0.2)');
        glow.addColorStop(1, 'rgba(116, 227, 255, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, cw, ch);

        ctx.strokeStyle = 'rgba(116, 227, 255, 0.08)';
        ctx.lineWidth = 1.5;
        const tileSize = 58;
        for (let x = 0; x < cw; x += tileSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
        }
        for (let y = 0; y < ch; y += tileSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(255, 77, 157, 0.08)';
        for (let x = -ch; x < cw; x += 96) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + ch, ch);
            ctx.stroke();
        }

        if (gameState === 'PLAYING') {
            const cx = cw / 2;
            const cy = ch - 80;

            ctx.save();
            ctx.shadowColor = 'rgba(116, 227, 255, 0.45)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#74E3FF';
            ctx.beginPath();
            ctx.roundRect(cx - 32, cy - 54, 64, 88, 26);
            ctx.fill();

            ctx.fillStyle = '#0b1026';
            ctx.beginPath();
            ctx.roundRect(cx - 22, cy - 40, 44, 36, 16);
            ctx.fill();

            ctx.fillStyle = '#f4f7ff';
            ctx.beginPath(); ctx.arc(cx - 11, cy - 22, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 11, cy - 22, 5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#ff4d9d';
            ctx.beginPath(); ctx.arc(cx - 11, cy - 22, 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 11, cy - 22, 2.2, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#0b1026';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx - 10, cy - 2);
            ctx.quadraticCurveTo(cx, cy + 8, cx + 10, cy - 2);
            ctx.stroke();

            ctx.fillStyle = '#ff4d9d';
            ctx.beginPath();
            ctx.arc(cx - 24, cy - 6, 4, 0, Math.PI * 2);
            ctx.arc(cx + 24, cy - 6, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2b8cff';
            ctx.beginPath();
            ctx.roundRect(cx - 18, cy + 34, 36, 10, 4);
            ctx.fill();
            ctx.restore();

            ctx.font = '700 14px Rajdhani';
            ctx.fillStyle = '#9FB0D8';
            ctx.textAlign = 'center';
            ctx.fillText('MOD BOT', cx, cy + 66);
        }

    customers.forEach(c => c.draw(ctx));
    particles.forEach(p => p.draw(ctx));

    if (gameState === 'MINIGAME' && activeMiniGame) {
        drawMiniGame(ctx);
    }
}

function drawMiniGame(ctx) {
    ctx.fillStyle = 'rgba(23, 23, 23, 0.6)';
    ctx.fillRect(0, 0, cw, ch);

    const mg = activeMiniGame;
    const cx = cw / 2;
    const cy = ch / 2;
    const type = mg.type;

    ctx.fillStyle = '#0f1735';
    ctx.beginPath();
    ctx.roundRect(cx - 150, cy - 160, 300, 320, 24);
    ctx.fill();

    ctx.strokeStyle = 'rgba(116, 227, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = mg.dish.color;
    ctx.font = '700 22px Audiowide';
    ctx.textAlign = 'center';
    ctx.fillText(mg.dish.desc, cx, cy - 110);

    if (type === 'chop' || type === 'flip') {
        if (type === 'flip') {
            ctx.fillStyle = '#0a1027';
            ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#74E3FF';
            ctx.beginPath(); ctx.arc(cx, cy, 50, 0, Math.PI*2); ctx.fill();
            ctx.font = '700 30px Audiowide';
            ctx.fillStyle = '#0a1027';
            ctx.fillText('▶', cx, cy + 10);
        } else {
            ctx.fillStyle = '#1f254c';
            ctx.fillRect(cx-80, cy-40, 160, 80);
            ctx.font = '700 34px Audiowide';
            ctx.fillStyle = '#74E3FF';
            ctx.fillText('✓', cx, cy+10);
        }

        const barY = cy + 100;
        ctx.fillStyle = '#E5E7EB';
        ctx.beginPath();
        ctx.roundRect(cx - 120, barY, 240, 24, 12);
        ctx.fill();

        ctx.fillStyle = type === 'flip' ? '#FACC15' : '#4ADE80';
        const start = (mg.targetStart - 0.5) * 240;
        const width = (mg.targetEnd - mg.targetStart) * 240;
        ctx.fillRect(cx + start, barY, width, 24);

        ctx.fillStyle = '#EF4444';
        const curX = (mg.cursor - 0.5) * 240;
        ctx.fillRect(cx + curX - 4, barY - 6, 8, 36);

    } else if (type === 'fry' || type === 'sear') {
        if (type === 'sear') {
            ctx.fillStyle = '#1C1917';
            ctx.fillRect(cx-80, cy-60, 160, 120);
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath(); ctx.moveTo(cx-80, cy-60 + i*30); ctx.lineTo(cx+80, cy-60 + i*30); ctx.stroke();
            }
            ctx.fillStyle = `rgb(${200 + mg.heat*55}, ${50 - mg.heat*50}, ${50 - mg.heat*50})`;
            ctx.beginPath();
            ctx.moveTo(cx-40, cy-30);
            ctx.quadraticCurveTo(cx+50, cy-50, cx+40, cy+20);
            ctx.quadraticCurveTo(cx-30, cy+50, cx-40, cy-30);
            ctx.fill();
        } else {
            ctx.fillStyle = '#333';
            ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = `rgb(${180 - mg.heat*100}, ${100 - mg.heat*50}, 50)`;
            ctx.beginPath(); ctx.arc(cx, cy, 45, 0, Math.PI*2); ctx.fill();
        }

        const barY = cy + 100;
        ctx.fillStyle = '#E5E7EB';
        ctx.beginPath();
        ctx.roundRect(cx - 100, barY, 200, 20, 10);
        ctx.fill();

        ctx.fillStyle = '#F97316';
        const tStart = mg.targetMin * 200 - 100;
        const tWidth = (mg.targetMax - mg.targetMin) * 200;
        ctx.fillRect(cx + tStart, barY, tWidth, 20);

        ctx.fillStyle = mg.heat > 1 ? '#EF4444' : '#EAB308';
        const pWidth = Math.min(1, mg.heat) * 200;
        ctx.fillRect(cx - 100, barY, pWidth, 20);

    } else if (type === 'mix') {
        ctx.fillStyle = '#3B82F6';
        ctx.beginPath(); ctx.arc(cx, cy + 20, 70, 0, Math.PI, false); ctx.fill();

        ctx.fillStyle = mg.dish.color;
        const level = mg.mixLevel;
        ctx.beginPath();
        ctx.arc(cx, cy + 20, 65, Math.PI - (Math.PI * level), Math.PI * (1 + level), true);
        ctx.fill();

        if (Math.random() < level) {
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath(); ctx.arc(cx + (Math.random()-0.5)*40, cy + 20 + (Math.random()*20), 5, 0, Math.PI*2); ctx.fill();
        }
    }
}

/**
 * §3 Interaction & Systems
 */
let isPointerDown = false;

function handleGlobalInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
    playBgm();

    if (gameState === 'GAMEOVER') return;

    if (gameState === 'MINIGAME' && activeMiniGame) {
        if (e.type === 'pointerdown') {
            isPointerDown = true;
            activeMiniGame.interact();
        } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
            isPointerDown = false;
            activeMiniGame.release();
        }
        return;
    }

    if (gameState === 'PLAYING' && e.type === 'pointerdown') {
        for (let c of customers) {
            if (Math.abs(x - c.x) < 60 && Math.abs(y - c.y) < 60) {
                startMiniGame(c);
                break;
            }
        }
    }
}

function startMiniGame(customer) {
    activeMiniGame = new MiniGame(customer);
    gameState = 'MINIGAME';
}

function completeOrder(customer) {
    customers = customers.filter(c => c.id !== customer.id);
    const dish = POSTS[customer.dishId];
    player.coins += dish.reward;
    score++;

    for (let i = 0; i < 20; i++) {
        particles.push(new Particle(cw/2, ch/2, dish.color, Math.random() > 0.5 ? 'square' : 'circle'));
    }

    gameState = 'PLAYING';
    activeMiniGame = null;
    playSfx('sfx_coin', { volume: 0.28, minGap: 80 });
    updateUI();
}

function failGame() {
    gameState = 'GAMEOVER';
    playSfx('sfx_fail', { volume: 0.38, fallback: 'fail', minGap: 100 });
    setReactionGif('fail');
    stopBgm();
    vibrate('heavy');

    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = score;
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('upgrade-panel').classList.add('hidden');
}

function restartGame() {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('upgrade-panel').classList.remove('hidden');
    playSfx('sfx_success', { volume: 0.28, minGap: 100 });
    initGame();
}

/**
 * §4 UI & Upgrades
 */
function setupUI() {
    // [agent-note][stage4] repaired: mobile-action-risk | element: #gameCanvas | action: scoped pointer suppression to gameplay surface so overlay buttons keep native tap/click behavior
    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
    canvas.addEventListener('pointercancel', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', restartGame);
    document.getElementById('restart-btn').addEventListener('pointerdown', () => playSfx('sfx_success', { volume: 0.22, minGap: 120 }));
    updateUI();
}

function updateUI() {
    document.getElementById('score-display').innerText = player.coins;

    const panel = document.getElementById('upgrade-panel');
    panel.innerHTML = '';

    Object.values(POSTS).forEach(dish => {
        if (player.unlocked.includes(dish.id)) return;

        const btn = document.createElement('button');
        const affordable = player.coins >= dish.cost;
        btn.className = `upgrade-btn btn-push${affordable ? '' : ' is-locked'}`;
        btn.innerHTML = `
            <div class="upgrade-icon">${dish.icon}</div>
            <div class="upgrade-name">${dish.name}</div>
            <div class="upgrade-cost${affordable ? ' is-ready' : ''}">${dish.cost}🔥</div>
        `;

        if (affordable) {
            btn.onclick = (e) => {
                e.stopPropagation();
                unlockDish(dish.id, dish.cost);
            };
        }
        panel.appendChild(btn);
    });
}

function unlockDish(id, cost) {
    if (player.coins >= cost) {
        player.coins -= cost;
        player.unlocked.push(id);
        playSfx('sfx_coin', { volume: 0.3, minGap: 90 });
        playSfx('sfx_success', { volume: 0.24, minGap: 90 });
        setReactionGif('unlock');
        vibrate('medium');

        const notif = document.getElementById('upgrade-notif');
        notif.classList.remove('hidden');
        setTimeout(() => notif.classList.add('hidden'), 2000);

        updateUI();

        for (let i = 0; i < 30; i++) {
            particles.push(new Particle(cw/2, ch-100, `hsl(${Math.random()*360}, 80%, 60%)`, 'square'));
        }
    }
}
