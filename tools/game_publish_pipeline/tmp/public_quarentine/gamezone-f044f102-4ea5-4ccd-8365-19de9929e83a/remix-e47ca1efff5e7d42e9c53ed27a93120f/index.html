<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cash Guy Run</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage4] catalog-fonts: title=Audiowide ui=Rajdhani accent=Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07111f;
            --bg-mid: #102038;
            --road-base: #182433;
            --road-glow: #26ffe6;
            --cash-main: #79ff7a;
            --cash-glow: #b9ff66;
            --hazard-main: #ff4d6d;
            --hazard-dark: #7a1129;
            --gate-main: #46a8ff;
            --panel-bg: rgba(8, 16, 29, 0.72);
            --panel-border: rgba(112, 255, 227, 0.42);
            --panel-shadow: 0 16px 30px rgba(0, 0, 0, 0.34);
            --text-main: #effdff;
            --text-soft: #9fd7e8;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 10%, rgba(38, 255, 230, 0.18), transparent 28%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 18%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 48px);
            opacity: 0.65;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            background: linear-gradient(180deg, rgba(14, 32, 54, 0.82), rgba(8, 17, 31, 0.82));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow), inset 0 0 0 1px rgba(255,255,255,0.04);
        }
        .ui-shadow { text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 18px rgba(38, 255, 230, 0.18); }
        .btn-shadow { box-shadow: 0 5px 0 rgba(2, 7, 18, 0.9), 0 0 22px rgba(121, 255, 122, 0.18); }
        .btn-shadow:active { box-shadow: 0 0 0 rgba(0,0,0,0.3); transform: translateY(4px); }
        .hero-card {
            position: relative;
            padding: 1.35rem 1.2rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(112, 255, 227, 0.28);
            background: linear-gradient(180deg, rgba(6, 18, 35, 0.92), rgba(4, 10, 21, 0.96));
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
            overflow: hidden;
        }
        .hero-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(121, 255, 122, 0.2), transparent 42%);
            pointer-events: none;
        }
        .runner-badge {
            width: 7.5rem;
            height: 7.5rem;
            margin: 0 auto 1rem;
            border-radius: 1.7rem;
            border: 3px solid rgba(121, 255, 122, 0.5);
            background:
                radial-gradient(circle at 50% 22%, rgba(255,255,255,0.5), transparent 18%),
                linear-gradient(180deg, #1c3b63 0%, #081322 100%);
            box-shadow: 0 0 30px rgba(38, 255, 230, 0.2), inset 0 0 20px rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
        }
        .runner-badge::after {
            content: '💵';
            position: absolute;
            right: 0.55rem;
            bottom: 0.6rem;
            font-size: 1.4rem;
            transform: rotate(-14deg);
            filter: drop-shadow(0 0 8px rgba(185, 255, 102, 0.55));
        }
        .subtitle-accent {
            color: var(--text-soft);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-size: 0.72rem;
            font-family: 'Press Start 2P', monospace;
        }
        .arcade-title {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.08em;
            line-height: 0.9;
        }
        .start-btn-accent {
            background: linear-gradient(180deg, #79ff7a, #28c76f);
            color: #04141b;
            border-color: #dcff9f;
        }
        .restart-btn-accent {
            background: linear-gradient(180deg, #57b7ff, #3079ff);
            border-color: #b7e4ff;
        }
        .hud-chip {
            min-width: 0;
        }
        .hud-value,
        .button-font {
            font-family: 'Press Start 2P', monospace;
        }
        .mute-shell {
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
        }
        .feedback-gif {
            position: absolute;
            width: min(24vw, 124px);
            aspect-ratio: 1;
            border-radius: 1rem;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: scale(0.88) translateY(14px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 12;
            background: rgba(3, 11, 19, 0.8);
        }
        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }
        #celebration-gif {
            top: 5.3rem;
            right: 0.9rem;
        }
        #danger-gif {
            left: 0.9rem;
            bottom: 1rem;
        }
        /* Prevent selection */
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

        @media (max-width: 640px) {
            #hud { padding: 0.85rem; }
            .hero-card { width: min(92vw, 24rem); padding: 1.1rem 1rem; }
            .runner-badge { width: 6rem; height: 6rem; font-size: 3.15rem; }
            .feedback-gif {
                width: min(20vw, 84px);
                border-radius: 0.8rem;
            }
            #celebration-gif {
                top: 5.1rem;
                right: 0.5rem;
            }
            #danger-gif {
                left: 0.5rem;
                bottom: 0.7rem;
            }
        }
    </style>
</head>
<body>

<!-- [agent-note][stage3] resolved-audio: loop+sfx mapped to catalogs/audios.json with gesture-safe playback -->
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
<audio id="sfx_gate" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>

<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>

<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage3] resolved-gif: reward/fail overlays -> catalogs/gifs.json -->
    <img
        id="celebration-gif"
        class="feedback-gif"
        src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp"

    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none hidden z-10">

    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-sm z-20 px-4">

            <div class="runner-badge" aria-hidden="true">🏃</div>
            <div class="subtitle-accent mb-2">cash comet runner</div>
            <h1 class="arcade-title text-6xl sm:text-7xl text-transparent bg-clip-text bg-gradient-to-b from-[#b9ff66] via-[#79ff7a] to-[#1da96e] ui-shadow">STACK<br>RUN</h1>
            <p class="text-slate-100 text-lg sm:text-xl mt-3 opacity-90 font-semibold tracking-[0.08em]">SNAG THE GREEN STACK • SIDESTEP THE RED LOSS</p>
        </div>
        <button id="start-btn" class="button-font start-btn-accent text-lg sm:text-xl py-4 px-10 sm:px-14 rounded-2xl btn-shadow transition-all border-2">
            START RUN

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md hidden z-30 px-4">
        <div class="hero-card text-center w-full max-w-md">
            <div class="subtitle-accent mb-2">run terminated</div>
            <h2 class="arcade-title text-5xl sm:text-6xl text-[#ff627f] ui-shadow mb-2">BUSTED</h2>
            <div class="text-white text-xl sm:text-2xl mb-6 font-semibold">FINAL STASH: <span id="finalScore" class="hud-value text-[#79ff7a]">$0</span></div>
            <button id="restart-btn" class="button-font restart-btn-accent text-white text-lg sm:text-xl py-4 px-8 sm:px-12 rounded-2xl btn-shadow transition-all border-2">
                TRY AGAIN
            </button>
        </div>
    </div>
</div>

<script>
/*
 * GAME ENGINE & LOGIC
 */

// Configuration
const CONFIG = {
    baseSpeed: 10,
    maxSpeed: 25,
    sensitivity: 2.0,
    laneWidth: 0, // Calculated on resize
    playerYRatio: 0.75, // Player position on screen (0-1)
    roadColor: '#374151',
    roadLineColor: '#4b5563'
};

// State
const STATE = {
    MENU: 0,
    PLAYING: 1,
    GAMEOVER: 2
};

let canvas, ctx;
let currentState = STATE.MENU;
let score = 0;
let lastTime = 0;
let gameTime = 0;
let speed = CONFIG.baseSpeed;
let entities = [];
let particles = [];
let floatTexts = [];
let spawnTimer = 0;
let distance = 0;
let isMuted = false;
let activeGifTimer = null;

// Player Object
const player = {
    x: 0,
    y: 0,
    width: 50,
    height: 90,
    targetX: 0,
    lean: 0
};

const feedbackEls = {
    celebrate: null,
    danger: null
};

function showFeedback(type, duration = 900) {
    const el = type === 'celebrate' ? feedbackEls.celebrate : feedbackEls.danger;
    if (!el) return;
    if (activeGifTimer) {
        clearTimeout(activeGifTimer);
        activeGifTimer = null;
    }
    feedbackEls.celebrate?.classList.remove('is-visible');
    feedbackEls.danger?.classList.remove('is-visible');
    el.classList.add('is-visible');
    activeGifTimer = window.setTimeout(() => {
        el.classList.remove('is-visible');
        activeGifTimer = null;
    }, duration);
}

// Audio System
const audio = {
    ctx: null,
    ready: false,
    sfxCooldowns: {},
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        this.ready = true;
    },
    stopLoop(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            el.pause();
            el.currentTime = 0;
        } catch (_) {}
    },
    playLoop(id, volume = 0.2) {
        if (isMuted) return;
        this.init();
        const el = document.getElementById(id);
        if (!el) return;
        el.volume = volume;
        el.loop = true;
        el.play().catch(() => {});
    },
    play(id, type, cooldown = 0) {
        if (isMuted) return;
        this.init();
        const now = performance.now();
        if (cooldown > 0 && this.sfxCooldowns[id] && now - this.sfxCooldowns[id] < cooldown) return;
        this.sfxCooldowns[id] = now;
        const el = document.getElementById(id);
        if (el) {
            try {
                const clone = el.cloneNode();
                clone.volume = 0.58;
                clone.play().catch(() => this.synth(type));
            } catch (_) {
                this.synth(type);
            }
        } else {
            this.synth(type);
        }
    },
    synth(type) {
        if (!this.ctx || isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'collect') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(780, now);
            osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start();
            osc.stop(now + 0.12);
        } else if (type === 'gate') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(920, now + 0.18);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        } else if (type === 'ui') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(540, now);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start();
            osc.stop(now + 0.08);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(55, now + 0.22);
            gain.gain.setValueAtTime(0.16, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
            osc.start();
            osc.stop(now + 0.22);
        }
    }
};

// Initialization
window.onload = () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    feedbackEls.celebrate = document.getElementById('celebration-gif');
    feedbackEls.danger = document.getElementById('danger-gif');

    resize();
    window.addEventListener('resize', resize);

    const unlockAudio = () => audio.init();
    window.addEventListener('pointerdown', unlockAudio, { passive: true });
    window.addEventListener('keydown', unlockAudio, { passive: true });

    // Input
    const handleStart = (e) => {
        if (currentState !== STATE.PLAYING) return;
        e.preventDefault();
        player.isDragging = true;
        player.lastInputX = e.touches ? e.touches[0].clientX : e.clientX;
        audio.init();
    };

    const handleMove = (e) => {
        if (!player.isDragging || currentState !== STATE.PLAYING) return;
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const delta = clientX - player.lastInputX;
        player.lastInputX = clientX;

        player.targetX += delta * CONFIG.sensitivity;
        const limit = canvas.width / 2 - 20;
        player.targetX = Math.max(20, Math.min(window.innerWidth - 20, player.targetX));

        player.lean = Math.max(-0.5, Math.min(0.5, delta * 0.05));
    };

    const handleEnd = () => {
        player.isDragging = false;
        player.lean = 0;
    };

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);

    // Buttons
    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
    document.getElementById('mute-btn').onclick = () => {
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
        if (isMuted) audio.stopLoop('bgm_main');
        else if (currentState === STATE.PLAYING) audio.playLoop('bgm_main');
    };

    requestAnimationFrame(loop);
};

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    CONFIG.laneWidth = window.innerWidth / 5;

    if (currentState === STATE.MENU) {
        player.x = window.innerWidth / 2;
        player.targetX = window.innerWidth / 2;
        player.y = window.innerHeight * CONFIG.playerYRatio;
    }
}

function startGame() {
    audio.play('sfx_ui', 'ui', 100);
    currentState = STATE.PLAYING;
    score = 0;
    speed = CONFIG.baseSpeed;
    gameTime = 0;
    spawnTimer = 0;
    entities = [];
    particles = [];
    floatTexts = [];

    player.x = window.innerWidth / 2;
    player.targetX = window.innerWidth / 2;
    player.y = window.innerHeight * CONFIG.playerYRatio;

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    feedbackEls.celebrate?.classList.remove('is-visible');
    feedbackEls.danger?.classList.remove('is-visible');
    updateHUD();

    audio.playLoop('bgm_main');
}

function gameOver() {
    currentState = STATE.GAMEOVER;
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = '$' + Math.floor(score);
    audio.stopLoop('bgm_main');
    audio.play('sfx_gameover', 'hit', 150);
    showFeedback('danger', 1400);
}

function updateHUD() {
    document.getElementById('score').innerText = '$' + Math.floor(score);
}

// Entities
class Entity {
    constructor(x, y, type, val) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.value = val;
        this.marked = false;

        if (type === 'cash') { this.w = 40; this.h = 25; }
        else if (type === 'obstacle') { this.w = 60; this.h = 60; }
        else if (type === 'gate') { this.w = 100; this.h = 10; }
    }

    draw(ctx) {
        if (this.type === 'cash') {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(this.x - this.w/2 + 4, this.y - this.h/2 + 4, this.w, this.h);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
            ctx.fillStyle = '#86efac';
            ctx.fillRect(this.x - this.w/2 + 4, this.y - this.h/2 + 4, this.w - 8, this.h - 8);
            ctx.fillStyle = '#064e3b';
            ctx.font = '700 15px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', this.x, this.y);

        } else if (this.type === 'obstacle') {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.h/2);
            ctx.lineTo(this.x + this.w/2, this.y + this.h/2);
            ctx.lineTo(this.x - this.w/2, this.y + this.h/2);
            ctx.fill();
            ctx.fillStyle = '#7f1d1d';
            ctx.font = '700 24px Rajdhani';
            ctx.textAlign = 'center';
            ctx.fillText('!', this.x, this.y + 10);

        } else if (this.type === 'gate') {
            const isGood = this.value > 0 || (this.op === '*' && this.value > 1);
            const color = isGood ? '#3b82f6' : '#ef4444';

            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = color;
            ctx.fillRect(this.x - this.w/2, this.y - 80, this.w, 80);
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.strokeRect(this.x - this.w/2, this.y - 80, this.w, 80);

            ctx.fillStyle = '#fff';
            ctx.font = '700 28px Rajdhani';
            ctx.textAlign = 'center';
            let txt = this.op === '*' ? 'x'+this.value : (this.value > 0 ? '+'+this.value : this.value);
            if (this.op === '/') txt = '÷2';
            ctx.fillText(txt, this.x, this.y - 40);
            ctx.restore();
        }
    }
}

function spawn() {
    spawnTimer++;
    if (spawnTimer > (500 / speed)) {
        spawnTimer = 0;

        const lanes = 5;
        const laneW = window.innerWidth / lanes;
        const lane = Math.floor(Math.random() * lanes);
        const x = lane * laneW + laneW / 2;
        const y = -100;

        const r = Math.random();

        if (r < 0.5) {
            entities.push(new Entity(x, y, 'cash', 10));
        } else if (r < 0.75) {
            entities.push(new Entity(x, y, 'obstacle', -30));
        } else {
            const gate = new Entity(x, y, 'gate', 0);
            const type = Math.random();
            if (type < 0.3) { gate.op = '+'; gate.value = 50; }
            else if (type < 0.6) { gate.op = '*'; gate.value = 2; }
            else if (type < 0.8) { gate.op = '-'; gate.value = -50; }
            else { gate.op = '/'; gate.value = 0.5; }
            entities.push(gate);
        }
    }
}

function drawCharacter(ctx, x, y, dt) {
    const runCycle = Math.sin(gameTime * 15);
    const lean = player.lean || 0;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(lean * 0.2);

    const scale = 1.0;
    ctx.scale(scale, scale);

    ctx.fillStyle = '#1f2937';

    ctx.save();
    ctx.translate(-12, 0);
    ctx.rotate(runCycle * 0.6);
    ctx.fillRect(-6, 0, 12, 30);
    ctx.restore();

    ctx.save();
    ctx.translate(12, 0);
    ctx.rotate(-runCycle * 0.6);
    ctx.fillRect(-6, 0, 12, 30);
    ctx.restore();

    ctx.translate(0, -35);
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(-18, -30, 36, 40);

    ctx.fillStyle = '#fca5a5';
    ctx.fillRect(-12, -48, 24, 24);
    ctx.fillStyle = '#4b5563';
    ctx.fillRect(-14, -52, 28, 10);

    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(-22, -28, 8, 20);
    ctx.fillRect(14, -28, 8, 20);

    ctx.fillStyle = '#fca5a5';
    ctx.fillRect(-22, -15, 8, 20);
    ctx.fillRect(14, -15, 8, 20);

    const stackValue = Math.max(0, score);
    if (stackValue > 0) {
        const visualHeight = Math.min(stackValue * 0.5, 300);
        const bills = Math.floor(visualHeight / 5);

        ctx.translate(0, -5);

        for (let i = 0; i < bills; i++) {
            const sway = Math.sin(gameTime * 5 + i * 0.1) * 2;
            const yPos = -i * 4;

            ctx.fillStyle = (i === bills - 1) ? '#86efac' : '#22c55e';
            if (score < 0) ctx.fillStyle = '#f87171';

            ctx.fillRect(-20 + sway, yPos, 40, 4);

            ctx.fillStyle = '#14532d';
            ctx.fillRect(18 + sway, yPos, 2, 4);
        }
    }

    ctx.restore();
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (currentState === STATE.PLAYING) {
        gameTime += dt;
        speed = Math.min(CONFIG.maxSpeed, speed + dt * 0.1);

        player.x += (player.targetX - player.x) * 15 * dt;
        player.lean *= 0.9;

        spawn();

        const moveAmt = speed * 60 * dt;
        for (let i = entities.length - 1; i >= 0; i--) {
            let e = entities[i];
            e.y += moveAmt;

            const pBox = { l: player.x - 25, r: player.x + 25, t: player.y - 80, b: player.y };
            const eBox = { l: e.x - e.w/2, r: e.x + e.w/2, t: e.y - e.h/2, b: e.y + e.h/2 };

            if (e.y > pBox.t && e.y < pBox.b + 20) {
                if (pBox.r > eBox.l && pBox.l < eBox.r) {
                    if (e.type === 'cash') {
                        score += e.value;
                        audio.play('sfx_collect', 'collect', 90);
                        showFeedback('celebrate', 700);
                        floatTexts.push({x: player.x, y: player.y - 100, text: '+$'+e.value, color: '#4ade80', life: 1.0});
                        for (let k = 0; k < 5; k++) {
                            particles.push({x: e.x, y: e.y, color: '#4ade80', vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1.0});
                        }
                    } else if (e.type === 'obstacle') {
                        score += e.value;
                        audio.play('sfx_hit', 'hit', 120);
                        showFeedback('danger', 1000);
                        floatTexts.push({x: player.x, y: player.y - 100, text: '-$30', color: '#ef4444', life: 1.0});
                    } else if (e.type === 'gate') {
                        if (e.op === '+') score += e.value;
                        if (e.op === '-') score += e.value;
                        if (e.op === '*') score *= e.value;
                        if (e.op === '/') score *= e.value;

                        const positiveGate = e.value > 0 || (e.op === '*' && e.value >= 1);
                        audio.play(positiveGate ? 'sfx_gate' : 'sfx_hit', positiveGate ? 'gate' : 'hit', 120);
                        showFeedback(positiveGate ? 'celebrate' : 'danger', 850);
                        const valTxt = (e.op === '*' || e.op === '/') ? 'x'+e.value : (e.value > 0 ? '+' : '') + e.value;
                        const col = positiveGate ? '#60a5fa' : '#ef4444';
                        floatTexts.push({x: player.x, y: player.y - 120, text: valTxt, color: col, life: 1.0});
                    }

                    e.marked = true;
                    if (score < 0) gameOver();
                }
            }

            if (e.y > canvas.height + 100) e.marked = true;
            if (e.marked) entities.splice(i, 1);
        }

        updateHUD();
    }

    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    const roadW = Math.min(window.innerWidth, 600);
    const roadX = (window.innerWidth - roadW) / 2;

    ctx.fillStyle = CONFIG.roadColor;
    ctx.fillRect(roadX, 0, roadW, window.innerHeight);

    ctx.strokeStyle = CONFIG.roadLineColor;
    ctx.lineWidth = 4;
    ctx.setLineDash([40, 40]);
    ctx.lineDashOffset = -gameTime * speed * 60;

    ctx.beginPath();
    ctx.moveTo(window.innerWidth / 2, 0);
    ctx.lineTo(window.innerWidth / 2, window.innerHeight);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#10b981';
    ctx.fillRect(0, 0, roadX, window.innerHeight);
    ctx.fillRect(roadX + roadW, 0, window.innerWidth - (roadX + roadW), window.innerHeight);

    entities.forEach(e => e.draw(ctx));

    if (currentState !== STATE.GAMEOVER) {
        drawCharacter(ctx, player.x, player.y, dt);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
        else {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 5, 5);
            ctx.globalAlpha = 1.0;
        }
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
        let f = floatTexts[i];
        f.y -= 50 * dt;
        f.life -= dt;
        if (f.life <= 0) floatTexts.splice(i, 1);
        else {
            ctx.globalAlpha = f.life;
            ctx.fillStyle = f.color;
            ctx.font = '700 28px Rajdhani';
            ctx.textAlign = 'center';
            ctx.fillText(f.text, f.x, f.y);
            ctx.globalAlpha = 1.0;
        }
    }

    requestAnimationFrame(loop);
}
</script>
