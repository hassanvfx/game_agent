<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Catch</title>
    <!-- [agent-note][stage4] catalog-fonts: title -> Audiowide, ui/hud -> Exo 2 via catalogs/fonts.json approved URLs -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #14061f;
            --bg-bottom: #2d1454;
            --panel-bg: rgba(18, 10, 35, 0.7);
            --panel-border: rgba(123, 243, 255, 0.42);
            --panel-shadow: rgba(26, 11, 57, 0.72);
            --pink: #ff5ecb;
            --magenta: #d94dff;
            --cyan: #7bf3ff;
            --cyan-strong: #26d7ff;
            --gold: #ffe57a;
            --white: #ffffff;
            --red: #ff4d6d;
            --ink: #12091f;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            touch-action: auto;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(123, 243, 255, 0.12), transparent 28%),
                radial-gradient(circle at 20% 80%, rgba(255, 94, 203, 0.16), transparent 22%),
                var(--bg-top);
            color: var(--white);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 18%, transparent 82%, rgba(123, 243, 255, 0.08)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.035) 0 2px,
                    transparent 2px 6px
                );
            mix-blend-mode: screen;
            opacity: 0.35;
        }

        #game-container::after {
            background: radial-gradient(circle at center, transparent 52%, rgba(5, 0, 14, 0.55) 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .screen {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            width: min(92vw, 560px);
            padding: 2rem;
            border-radius: 1.75rem;
            text-align: center;
            background:
                linear-gradient(180deg, rgba(44, 18, 78, 0.88), rgba(14, 8, 30, 0.78));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 16px 48px var(--panel-shadow),
                0 0 26px rgba(123, 243, 255, 0.14);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(123, 243, 255, 0.14), transparent 36%),
                radial-gradient(circle at 85% 18%, rgba(255, 94, 203, 0.2), transparent 22%);
            pointer-events: none;
        }

        .glass-panel > * {
            position: relative;
            z-index: 1;
        }

        .title {
            margin: 0 0 0.75rem;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(2.6rem, 8vw, 4.75rem);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(180deg, #ffe57a, #ff84de 42%, #88efff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 10px rgba(255, 94, 203, 0.35));
        }

        .neon-text {
            text-shadow: 0 0 10px var(--magenta), 0 0 20px var(--magenta), 0 0 30px var(--magenta);
        }

        .subtitle {
            margin: 0 0 1rem;
            color: #d9faff;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .instruction {
            margin: 0 0 1.75rem;
            color: #f8eaff;
            font-size: clamp(1rem, 2.6vw, 1.05rem);
            line-height: 1.55;
            text-shadow: 0 0 12px rgba(18, 9, 31, 0.55);
        }

        .button {
            border: 2px solid var(--cyan);
            border-radius: 999px;
            padding: 0.95rem 2.4rem;
            background: linear-gradient(180deg, rgba(7, 6, 24, 0.95), rgba(19, 11, 39, 0.9));
            color: var(--cyan);
            font: 700 1rem 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, filter 0.2s ease;
            box-shadow: 0 0 15px rgba(123, 243, 255, 0.36);
            text-shadow: 0 0 5px rgba(123, 243, 255, 0.6);
        }

        .button:hover,
        .button:focus-visible {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 25px rgba(123, 243, 255, 0.55), 0 0 50px rgba(123, 243, 255, 0.26);
            filter: brightness(1.08);
            outline: none;
        }

        .button:active {
            transform: translateY(0) scale(0.98);
        }

        .button.secondary {
            background: linear-gradient(180deg, #fff5fb, #ffd4ef);
            color: #2d0b2e;
            border-color: #ffe5f6;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
            text-shadow: none;
        }

        .button.secondary:hover,
        .button.secondary:focus-visible {
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            background: #f2f2f2;
        }

        #game-over-screen h2 {
            margin: 0 0 1rem;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            letter-spacing: 0.1em;
            color: var(--red);
        }

        .score-line {
            margin: 0 0 1.75rem;
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: var(--white);
        }

        .score-line span {
            color: var(--pink);
            font-weight: 800;
        }

        #hud {
            position: absolute;
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            background: rgba(7, 4, 18, 0.56);
            border: 1px solid rgba(123, 243, 255, 0.28);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1rem, 4vw, 1.45rem);
            font-weight: 700;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-icon,
        .hud-value {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 229, 122, 0.55);
        }

        .hud-label {
            color: var(--white);
            font-size: 0.64em;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .screen-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0 0 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            background: rgba(123, 243, 255, 0.08);
            border: 1px solid rgba(123, 243, 255, 0.2);
            color: #dbfcff;
            font-size: 0.75rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .screen-badge .emoji {
            font-size: 1.1rem;
            filter: drop-shadow(0 0 6px rgba(255, 229, 122, 0.45));
        }

        .instruction strong {
            color: var(--gold);
        }

        .feedback-gif {
            position: absolute;
            right: max(0.8rem, env(safe-area-inset-right));
            bottom: max(0.8rem, calc(env(safe-area-inset-bottom) + 0.4rem));
            width: min(30vw, 124px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(123, 243, 255, 0.45);
            background: rgba(10, 5, 24, 0.55);
            box-shadow: 0 0 20px rgba(123, 243, 255, 0.2);
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 50%;
            right: auto;
            top: 50%;
            bottom: auto;
            width: min(46vw, 180px);
            transform: translate(-50%, -44%) scale(0.92);
            border-color: rgba(255, 94, 203, 0.65);
            box-shadow: 0 0 24px rgba(255, 94, 203, 0.24);
        }

        .feedback-gif.fail.visible {
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 640px) {
            .glass-panel {
                padding: 1.5rem 1.25rem;
                border-radius: 1.35rem;
            }

            .subtitle {
                letter-spacing: 0.14em;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="start-screen" class="glass-panel screen">
                <div class="screen-badge"><span class="emoji" aria-hidden="true">💖</span> Star Runner Brief</div>
                <h1 class="title neon-text">NEON<br>CATCH</h1>
                <p class="subtitle">Heart-Hunter Arcade Sprint</p>
                <p class="instruction">Slide left and right to guide your <strong>Nova Heart</strong> catcher. Scoop up glowing hearts and dodge the red jammers or the run ends instantly.</p>
                <button id="start-btn" class="button">Start Run</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel screen">
                <div class="screen-badge"><span class="emoji" aria-hidden="true">💥</span> Signal Lost</div>
                <h2 class="neon-text">RUN OVER</h2>
                <div class="score-line">Neon Score: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="button secondary">Run Again</button>
            </div>

            <div id="hud" class="hidden">
                <span class="hud-icon">♥</span>
                <span class="hud-label">Score</span>
                <span id="score" class="hud-value">0</span>
            </div>
            <!-- [agent-note][stage3] resolved-gif: collect/fail feedback overlays -> catalogs/gifs.json -->
            <img id="collect-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Heart combo reaction" aria-hidden="true">
            <img id="fail-gif" class="feedback-gif fail" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Game over reaction" aria-hidden="true">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            },
            gifs: {
                collect: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.unlocked = false;
                this.bgm = this.createAudio(ASSETS.bgm, { loop: true, volume: 0.3 });
                this.sfx = Object.fromEntries(
                    Object.entries(ASSETS.sfx).map(([key, src]) => [
                        key,
                        this.createAudio(src, { preload: 'auto' })
                    ])
                );
                this.lastPlayedAt = {};
            }

            createAudio(src, options = {}) {
                const audio = new Audio(src);
                if (options.loop) audio.loop = true;
                if (options.preload) audio.preload = options.preload;
                audio.volume = options.volume ?? 0.65;
                audio.playsInline = true;
                return audio;
            }

            async unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.enabled = true;
                const unlockClip = this.sfx.click;
                if (!unlockClip) return;
                unlockClip.volume = 0;
                try {
                    unlockClip.currentTime = 0;
                    await unlockClip.play();
                    unlockClip.pause();
                    unlockClip.currentTime = 0;
                } catch (_) {}
                unlockClip.volume = 0.45;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { volume, debounceMs = 0 } = {}) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayedAt[key] ?? 0;
                if (debounceMs && now - last < debounceMs) return;
                this.lastPlayedAt[key] = now;

                const clip = this.sfx[key].cloneNode();
                clip.volume = volume ?? this.sfx[key].volume ?? 0.65;
                clip.playsInline = true;
                clip.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const collectGif = document.getElementById('collect-gif');
        const failGif = document.getElementById('fail-gif');
        let gifTimers = {};

        function flashGif(element, duration = 900) {
            if (!element) return;
            element.classList.add('visible');
            clearTimeout(gifTimers[element.id]);
            gifTimers[element.id] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;
        let speedMultiplier = 1;
        let collectedThisRun = 0;

        // Entities
        let player = { x: 0, y: 0, radius: 25, color: '#ff00ff' };
        let items = []; // { x, y, type, speed, radius }
        let particles = []; // { x, y, vx, vy, life, color }
        let skylinePulse = 0;

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 100;
            if (!gameActive) player.x = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input
        let inputX = width / 2;
        canvas.addEventListener('mousemove', e => inputX = e.clientX);
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            inputX = e.touches[0].clientX;
        }, { passive: false });

        /** 4. PARALLAX BACKGROUND */
        const stars = Array.from({ length: 50 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.1,
            alpha: Math.random()
        }));

        const cityLights = Array.from({ length: 20 }, () => ({
            x: Math.random() * width,
            h: Math.random() * 150 + 50,
            w: Math.random() * 40 + 20,
            color: Math.random() > 0.5 ? '#2a1a4a' : '#1a0b2e'
        }));

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#14061f');
            grad.addColorStop(0.55, '#241043');
            grad.addColorStop(1, '#2d1454');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const sunY = Math.max(120, height * 0.24);
            const sunRadius = Math.min(width * 0.22, 120);
            const halo = ctx.createRadialGradient(width * 0.5, sunY, 10, width * 0.5, sunY, sunRadius * 1.7);
            halo.addColorStop(0, 'rgba(255, 229, 122, 0.7)');
            halo.addColorStop(0.35, 'rgba(255, 94, 203, 0.22)');
            halo.addColorStop(1, 'rgba(255, 94, 203, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(width * 0.5, sunY, sunRadius * 1.7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) star.y = 0;
                ctx.globalAlpha = star.alpha * 0.45 + 0.25 * Math.sin(frame * 0.05);
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            skylinePulse = (Math.sin(frame * 0.035) + 1) * 0.5;
            cityLights.forEach((building, index) => {
                const x = building.x;
                const y = height - building.h;
                const buildingGrad = ctx.createLinearGradient(x, y, x, height);
                buildingGrad.addColorStop(0, building.color);
                buildingGrad.addColorStop(1, '#090414');
                ctx.fillStyle = buildingGrad;
                ctx.fillRect(x, y, building.w, building.h);

                for (let row = y + 10; row < height - 12; row += 14) {
                    for (let col = x + 6; col < x + building.w - 4; col += 10) {
                        const active = (row + col + index * 7) % 3 === 0;
                        if (!active) continue;
                        ctx.fillStyle = `rgba(123, 243, 255, ${0.2 + skylinePulse * 0.45})`;
                        ctx.fillRect(col, row, 4, 6);
                    }
                }
            });

            ctx.strokeStyle = 'rgba(123, 243, 255, 0.22)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, height * 0.78);
            ctx.lineTo(width, height * 0.78);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(123, 243, 255, 0.12)';
            ctx.lineWidth = 1;
            for (let i = -height; i < width; i += 44) {
                ctx.beginPath();
                ctx.moveTo(i, height);
                ctx.lineTo(i + height * 0.34, height * 0.78);
                ctx.stroke();
            }

            ctx.fillStyle = '#120820';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let i = 0; i <= width; i += 50) {
                ctx.lineTo(i, height - 100 - Math.sin(i * 0.01) * 50);
            }
            ctx.lineTo(width, height);
            ctx.fill();
        }

        /** 5. GAME LOGIC */
        function spawnItem() {
            const isGood = Math.random() > 0.3; // 70% good items
            const type = isGood ? 'heart' : 'spike';
            const size = isGood ? 20 : 25;
            items.push({
                x: Math.random() * (width - 40) + 20,
                y: -50,
                type: type,
                speed: (Math.random() * 3 + 3) * speedMultiplier,
                radius: size,
                angle: 0
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function drawHeart(x, y, size, color, glow) {
            ctx.save();
            ctx.translate(x, y);
            if (glow) {
                ctx.shadowBlur = 24;
                ctx.shadowColor = color;
            }
            const gradient = ctx.createLinearGradient(0, -size, 0, size);
            gradient.addColorStop(0, '#fff7cc');
            gradient.addColorStop(0.35, color);
            gradient.addColorStop(1, '#a100ff');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            let d = size;
            ctx.moveTo(0, -d / 2);
            ctx.bezierCurveTo(d / 2, -d, d, -d / 2, 0, d);
            ctx.bezierCurveTo(-d, -d / 2, -d / 2, -d, 0, -d / 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.65)';
            ctx.lineWidth = Math.max(2, d * 0.08);
            ctx.stroke();
            ctx.restore();
        }

        function drawSpike(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(frame * 0.1);
            ctx.fillStyle = '#ff3333';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ff003c';
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                ctx.rotate(Math.PI / 2);
                ctx.moveTo(0, 0);
                ctx.lineTo(size, 0);
                ctx.lineTo(0, size / 2);
            }
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function initGame() {
            score = 0;
            speedMultiplier = 1;
            collectedThisRun = 0;
            items = [];
            particles = [];
            failGif.classList.remove('visible');
            collectGif.classList.remove('visible');
            document.getElementById('score').innerText = score;
            player.x = width / 2;
        }

        function gameLoop() {
            if (!gameActive) return;
            frame++;

            ctx.clearRect(0, 0, width, height);
            drawBackground();

            player.x += (inputX - player.x) * 0.15;

            const pulse = 1 + Math.sin(frame * 0.1) * 0.1;
            drawHeart(player.x, player.y, player.radius * pulse, '#ff5ecb', true);
            ctx.save();
            ctx.strokeStyle = 'rgba(123, 243, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius * 1.15, 0.15, Math.PI - 0.15);
            ctx.stroke();
            ctx.restore();

            if (frame % 40 === 0) spawnItem();
            if (frame % 500 === 0) speedMultiplier += 0.1;

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.angle += 0.05;

                if (item.type === 'heart') {
                    drawHeart(item.x, item.y, item.radius, '#ff69b4', true);
                } else {
                    drawSpike(item.x, item.y, item.radius);
                }

                const dx = player.x - item.x;
                const dy = player.y - item.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + item.radius) {
                    if (item.type === 'heart') {
                        score += 100;
                        collectedThisRun += 1;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('collect', { volume: 0.52, debounceMs: 80 });
                        if (collectedThisRun % 5 === 0) {
                            audio.playSFX('streak', { volume: 0.42, debounceMs: 160 });
                        }
                        flashGif(collectGif, 720);
                        createParticles(item.x, item.y, '#ff69b4');
                        items.splice(i, 1);
                    } else {
                        gameOver();
                    }
                } else if (item.y > height + 50) {
                    items.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.6, debounceMs: 200 });
            flashGif(failGif, 1400);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('start', { volume: 0.48, debounceMs: 180 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('click', { volume: 0.45, debounceMs: 180 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
