<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Portal Creature Forge</title>
    <!-- [agent-note][stage4] repaired: approved-font-remap | title-ui: Orbitron | body-ui: Rajdhani -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-night: #05080b;
            --bg-deep: #081424;
            --bg-panel: rgba(6, 18, 28, 0.88);
            --bg-panel-soft: rgba(9, 29, 42, 0.78);
            --line-soft: rgba(125, 255, 63, 0.22);
            --line-bright: rgba(88, 215, 255, 0.72);
            --text-main: #eef7dd;
            --text-muted: #b7d6c8;
            --portal-green: #7dff3f;
            --accent-cyan: #58d7ff;
            --accent-violet: #a855f7;
            --accent-pink: #ff63b6;
            --accent-lime: #7dff3f;
            --morty-yellow: #ffd84d;
            --danger: #fb923c;
            --shadow-glow: 0 0 26px rgba(125, 255, 63, 0.24), 0 0 18px rgba(88, 215, 255, 0.12);
            --panel-radius: 22px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 52% 16%, rgba(125, 255, 63, 0.16), transparent 30%),
                radial-gradient(circle at 14% 82%, rgba(88, 215, 255, 0.10), transparent 26%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-night));
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(90deg, rgba(125, 255, 63, 0.035) 0 1px, transparent 1px 58px),
                repeating-linear-gradient(0deg, rgba(88, 215, 255, 0.026) 0 1px, transparent 1px 54px),
                radial-gradient(circle at 20% 15%, rgba(88, 215, 255, 0.12), transparent 18%),
                radial-gradient(circle at 78% 22%, rgba(255, 99, 182, 0.12), transparent 20%);
            opacity: 0.9;
            animation: labGridDrift 18s linear infinite;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hidden { display: none !important; }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(3, 14, 20, 0.35), rgba(2, 8, 12, 0.15));
        }

        .screen-root::before {
            content: "";
            position: absolute;
            inset: -18%;
            pointer-events: none;
            background:
                conic-gradient(from 0deg at 50% 50%, transparent 0 18%, rgba(125, 255, 63, 0.09) 22%, transparent 28% 46%, rgba(88, 215, 255, 0.06) 52%, transparent 60% 100%);
            opacity: 0.55;
            transform-origin: center;
            animation: slowPortalSpin 24s linear infinite;
            mix-blend-mode: screen;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            pointer-events: auto;
            z-index: 50;
            background:
                radial-gradient(circle at center, rgba(14, 12, 32, 0.35), rgba(0, 0, 0, 0.82)),
                linear-gradient(180deg, rgba(5, 5, 10, 0.58), rgba(5, 5, 10, 0.92));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .glass-panel {
            background:
                radial-gradient(circle at 18% 12%, rgba(125, 255, 63, 0.10), transparent 28%),
                linear-gradient(180deg, rgba(8, 32, 42, 0.86), rgba(3, 12, 19, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line-soft);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.38), var(--shadow-glow);
        }

        .intro-card {
            width: min(100%, 420px);
            border-radius: 28px;
            padding: 26px 22px 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-top: 4px solid var(--portal-green);
        }

        .intro-card::before,
        .intro-card::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(8px);
            opacity: 0.45;
            pointer-events: none;
        }

        .intro-card::before {
            width: 140px;
            height: 140px;
            top: -30px;
            left: -30px;
            background: radial-gradient(circle, rgba(125, 255, 63, 0.66), transparent 68%);
        }

        .intro-card::after {
            width: 180px;
            height: 180px;
            right: -45px;
            bottom: -55px;
            background: radial-gradient(circle, rgba(88, 215, 255, 0.46), transparent 70%);
        }

        .lab-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            margin-bottom: 12px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            background: rgba(125, 255, 63, 0.08);
            border: 1px solid rgba(125, 255, 63, 0.28);
            box-shadow: inset 0 0 10px rgba(125, 255, 63, 0.10), 0 0 16px rgba(88, 215, 255, 0.08);
        }

        .title-display,
        .font-display {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }

        .title-display {
            margin: 0 0 8px;
            font-size: clamp(34px, 9vw, 56px);
            line-height: 0.96;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: transparent;
            background: linear-gradient(90deg, var(--portal-green), var(--accent-cyan) 48%, var(--morty-yellow));
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 16px rgba(126, 242, 255, 0.2));
        }

        .subtitle {
            margin: 0 0 16px;
            color: var(--text-muted);
            font-size: 20px;
            font-weight: 600;
        }

        .safety-note {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 106, 139, 0.26);
            background: linear-gradient(180deg, rgba(100, 20, 41, 0.28), rgba(45, 11, 24, 0.22));
            color: #ffd9e4;
            font-size: 13px;
            line-height: 1.35;
            box-shadow: inset 0 0 18px rgba(255, 106, 139, 0.08);
        }

        .start-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 18px;
            color: #091019;
            background: linear-gradient(90deg, var(--portal-green), var(--accent-cyan) 58%, var(--morty-yellow));
            box-shadow: 0 16px 30px rgba(125, 255, 63, 0.22), 0 0 24px rgba(88, 215, 255, 0.14);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 24px;
            letter-spacing: 0.06em;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .start-btn:hover,
        .start-btn:active {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.05);
            box-shadow: 0 18px 34px rgba(86, 122, 255, 0.34);
        }

        .start-btn:active,
        .btn-option:active,
        .mix-btn:active,
        .pill-btn:active,
        .reset-btn:active {
            transform: scale(0.97);
        }

        .floating { animation: float 3s ease-in-out infinite; }

        .spark-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 2px 0 16px;
            opacity: 0.85;
            font-size: 20px;
        }

        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            max-width: min(58vw, 220px);
            color: var(--text-main);
            pointer-events: none;
        }

        .hud-status {
            padding: 9px 12px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: linear-gradient(180deg, rgba(20, 18, 41, 0.9), rgba(8, 7, 18, 0.82));
            border: 1px solid rgba(126, 242, 255, 0.18);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hud-status strong {
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        /* [agent-note][stage2] preserve: control-zone | reason: bottom action strip already mobile-safe */
        .lab-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(180deg, rgba(5, 6, 11, 0), rgba(6, 7, 15, 0.82) 18%, rgba(6, 7, 15, 0.94));
        }

        .category-strip {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .category-pill {
            padding: 8px 12px;
            border-radius: 999px;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(180deg, rgba(31, 29, 64, 0.92), rgba(15, 13, 28, 0.82));
            border: 1px solid rgba(126, 242, 255, 0.14);
            box-shadow: inset 0 0 10px rgba(173, 118, 255, 0.08);
        }

        .ingredient-list {
            display: flex;
            gap: 10px;
            min-width: 0;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 2px 4px 4px;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
        }

        .ingredient-list::-webkit-scrollbar { height: 6px; }
        .ingredient-list::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, rgba(126, 242, 255, 0.65), rgba(173, 118, 255, 0.65));
            border-radius: 999px;
        }

        .btn-option {
            position: relative;
            min-width: 82px;
            height: 86px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            border-radius: 18px;
            color: var(--text-main);
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            border: 1px solid rgba(190, 203, 255, 0.16);
            background:
                linear-gradient(180deg, rgba(41, 37, 79, 0.88), rgba(18, 16, 34, 0.92));
        }

        .btn-option .icon {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.14));
        }

        .btn-option .label {
            font-size: 12px;
            line-height: 1;
            font-weight: 700;
        }

        .btn-option:hover {
            transform: translateY(-1px);
            border-color: rgba(126, 242, 255, 0.35);
        }

        .btn-selected {
            border: 2px solid var(--line-bright);
            background:
                linear-gradient(180deg, rgba(53, 45, 108, 0.96), rgba(23, 22, 49, 0.96));
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 18px rgba(126, 242, 255, 0.18);
        }

        .btn-selected::after {
            content: "✓";
            position: absolute;
            top: 6px;
            right: 8px;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: rgba(126, 242, 255, 0.15);
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: 700;
        }

        .divider {
            width: 2px;
            height: 58px;
            align-self: center;
            flex: 0 0 auto;
            border-radius: 999px;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.24), transparent);
            margin: 0 1px;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }

        .mix-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            min-width: min(88vw, 320px);
            border-radius: 999px;
            color: #08130b;
            background: linear-gradient(90deg, #7dffb0, #5bd7ff);
            box-shadow: 0 0 24px rgba(93, 226, 255, 0.32);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 22px;
            letter-spacing: 0.05em;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        }

        .mix-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .mix-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .play-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reset-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            color: var(--text-main);
            background: linear-gradient(180deg, rgba(35, 31, 74, 0.92), rgba(18, 16, 34, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
            font-size: 14px;
            font-weight: 700;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .reset-btn:hover {
            background: linear-gradient(180deg, rgba(52, 46, 110, 0.95), rgba(21, 18, 43, 0.96));
        }

        .interaction-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            padding: 0 12px calc(env(safe-area-inset-bottom, 0px));
            pointer-events: auto;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 92px;
            padding: 11px 16px;
            border-radius: 999px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .pill-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .pill-pet { background: linear-gradient(90deg, #3b82f6, #5ed7ff); }
        .pill-feed { background: linear-gradient(90deg, #fb923c, #ffd166); color: #2b1600; }
        .pill-scare { background: linear-gradient(90deg, #ef4444, #ff72a7); }

        .spark-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: rgba(126, 242, 255, 0.08);
            box-shadow: inset 0 0 8px rgba(126, 242, 255, 0.16);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes slowPortalSpin {
            to { transform: rotate(1turn); }
        }

        @keyframes labGridDrift {
            0% { background-position: 0 0, 0 0, 0 0, 0 0; }
            100% { background-position: 58px 0, 0 54px, 0 0, 0 0; }
        }

        @media (max-width: 640px) {
            .intro-card { padding: 22px 18px 18px; }
            .subtitle { font-size: 18px; }
            .lab-controls { gap: 8px; padding-top: 10px; }
            .category-pill { font-size: 11px; padding: 7px 11px; }
            .btn-option { min-width: 76px; height: 82px; border-radius: 16px; }
            .mix-btn { min-width: 100%; font-size: 20px; padding: 12px 16px; }
            .play-controls { top: 10px; right: 10px; }
            .interaction-bar { gap: 8px; bottom: 14px; }
            .pill-btn {
                flex: 1 1 calc(33.333% - 8px);
                min-width: 0;
                padding: 11px 10px;
                font-size: 14px;
            }
            .hud { top: 10px; left: 10px; max-width: calc(100vw - 132px); }
            .hud-status { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-root">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: affection/scare feedback -> catalogs/gifs.json lightweight HUD overlays -->
        <div id="gif-feedback" class="hidden" aria-live="polite" style="position:absolute;top:76px;right:12px;z-index:40;pointer-events:none;width:min(30vw,120px);">
            <img id="gif-feedback-img" alt="" style="display:block;width:100%;border-radius:18px;border:1px solid rgba(255,255,255,0.16);box-shadow:0 10px 22px rgba(0,0,0,0.24);background:rgba(8,8,20,0.55);">
        </div>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="overlay-screen">
                <div class="glass-panel intro-card">
                    <div class="lab-badge floating"><span>🧬</span><span>Garage Portal Forge</span></div>
                    <div class="spark-row" aria-hidden="true"><span>🌀</span><span>🧪</span><span>⚡</span></div>
                    <h1 class="title-display">PORTAL FORGE</h1>
                    <p class="subtitle">Pick portal DNA, serum color, and growth instability to hatch one suspicious pocket critter.</p>
                    <div class="safety-note">
                        ⚠ C-137 LAB WARNING:<br>Creatures may become emotionally attached. Handle irresponsibly.
                    </div>
                    <button id="start-btn" class="start-btn">
                        <span>ENTER GARAGE</span>
                        <span class="spark-chip" aria-hidden="true">⚗️</span>
                    </button>
                </div>
            </div>

            <div id="lab-controls" class="lab-controls hidden">
                <div class="category-strip">
                    <div class="glass-panel category-pill">1. DNA</div>
                    <div class="glass-panel category-pill">2. Serum</div>
                    <div class="glass-panel category-pill">3. Growth</div>
                </div>

                <div class="ingredient-list" id="ingredient-list">
                </div>

                <div class="action-bar">
                    <button id="mix-btn" class="mix-btn">HATCH CRITTER</button>
                </div>
            </div>

            <div id="play-controls" class="play-controls hidden">
                <button id="reset-btn" class="reset-btn glass-panel">🧪 New Experiment</button>
            </div>

            <div id="interaction-bar" class="interaction-bar hidden">
                <button id="pet-btn" class="pill-btn pill-pet">👋 Pet</button>
                <button id="feed-btn" class="pill-btn pill-feed">🧪 Feed</button>
                <button id="scare-btn" class="pill-btn pill-scare">📡 Boo!</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: top-left compact status is already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-status glass-panel" id="status-text"><strong>Garage Lab</strong> Active</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                create: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                pet: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                feed: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                scare: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                menu: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3"
            },
            gifs: {
                affection: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                scare: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    audio.volume = k === 'ui' ? 0.4 : 0.55;
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                this.ready = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((sound) => sound.load());
            }
            playBGM() {
                if (!this.ready) return;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, debounceMs = 120) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
                this.lastPlayedAt[key] = now;
                const sound = this.sfx[key].cloneNode();
                sound.volume = this.sfx[key].volume;
                sound.play().catch(() => {});
            }
        }
        const audio = new AudioController();
        const gifFeedback = document.getElementById('gif-feedback');
        const gifFeedbackImg = document.getElementById('gif-feedback-img');
        let gifFeedbackTimer = null;

        function showGif(type, altText) {
            const src = ASSETS.gifs[type];
            if (!src) return;
            gifFeedbackImg.src = src;
            gifFeedbackImg.alt = altText;
            gifFeedback.classList.remove('hidden');

        function renderIngredients() {

        function drawPortalRing(ctx, x, y, rx, ry, spin, alpha = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(spin);
            ctx.globalAlpha *= alpha;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.ellipse(0, 0, rx - i * 10, ry - i * 5, i * 0.55, 0, Math.PI * 2);
                ctx.strokeStyle = i === 0 ? 'rgba(125,255,63,0.95)' : i === 1 ? 'rgba(88,215,255,0.72)' : 'rgba(255,216,77,0.44)';
                ctx.lineWidth = i === 0 ? 6 : 2.5;
                ctx.shadowColor = i === 0 ? '#7dff3f' : '#58d7ff';
                ctx.shadowBlur = 14 - i * 3;
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawDnaLadder(ctx, x, y, h, phaseOffset, alpha = 0.22) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = '#58d7ff';
            ctx.lineWidth = 2;
            for (let j = 0; j < h; j += 16) {
                const sway = Math.sin(time / 28 + j / 18 + phaseOffset) * 10;
                ctx.beginPath();
                ctx.moveTo(x - 12 + sway, y + j);
                ctx.lineTo(x + 12 - sway, y + j + 8);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x - 16 + sway, y + j, 2.5, 0, Math.PI * 2);
                ctx.arc(x + 16 - sway, y + j + 8, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = j % 32 === 0 ? '#7dff3f' : '#ffd84d';
                ctx.fill();
            }
            ctx.restore();
        }

        function drawLabPanel(ctx, x, y, w, h, label, accent = '#7dff3f') {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 14);
            ctx.fillStyle = 'rgba(5, 18, 28, 0.52)';
            ctx.fill();
            ctx.strokeStyle = accent;
            ctx.globalAlpha = 0.36;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(238,247,221,0.68)';
            ctx.font = '700 10px Orbitron';
            ctx.fillText(label, x + 10, y + 18);
            ctx.fillStyle = accent;
            for (let i = 0; i < 4; i++) {
                ctx.globalAlpha = 0.18 + (i % 2) * 0.16;
                ctx.fillRect(x + 12 + i * 18, y + h - 20, 10, 5);
            }
            ctx.restore();
        }

        function drawFlask(ctx, x, y, color, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.strokeStyle = 'rgba(238,247,221,0.42)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-8, -28);
            ctx.lineTo(-8, -8);
            ctx.lineTo(-22, 18);
            ctx.quadraticCurveTo(0, 28, 22, 18);
            ctx.lineTo(8, -8);
            ctx.lineTo(8, -28);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(0, 13, 17, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.52 + Math.sin(time / 24 + x) * 0.08;
            ctx.fill();
            ctx.restore();
        }

        function drawLab(ctx) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#031018');
            grad.addColorStop(0.42, '#081424');
            grad.addColorStop(1, '#15102a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const orbGrad = ctx.createRadialGradient(width * 0.5, height * 0.3, 10, width * 0.5, height * 0.3, width * 0.52);
            orbGrad.addColorStop(0, 'rgba(125,255,63,0.18)');
            orbGrad.addColorStop(0.38, 'rgba(88,215,255,0.10)');
            orbGrad.addColorStop(0.7, 'rgba(168,85,247,0.07)');
            orbGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = orbGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.18;
            ctx.strokeStyle = '#7dff3f';
            ctx.lineWidth = 1;
            for (let x = -80; x < width + 80; x += 58) {
                ctx.beginPath();
                ctx.moveTo(x + Math.sin(time / 90) * 10, 0);
                ctx.lineTo(x + 68, height);
                ctx.stroke();
            }
            for (let y = 48; y < height; y += 62) {
                ctx.beginPath();
                ctx.moveTo(0, y + Math.sin(time / 70 + y) * 4);
                ctx.lineTo(width, y + Math.cos(time / 84 + y) * 4);
                ctx.stroke();
            }
            ctx.restore();

            drawPortalRing(ctx, width * 0.5, height * 0.24, Math.min(190, width * 0.34), Math.min(62, height * 0.09), time / 95, 0.42);
            drawDnaLadder(ctx, width * 0.16, height * 0.14, height * 0.38, 0, 0.18);
            drawDnaLadder(ctx, width * 0.84, height * 0.1, height * 0.42, 2.2, 0.14);

            const benchY = Math.min(height * 0.74, height - 150);
            ctx.fillStyle = 'rgba(3, 12, 18, 0.82)';
            ctx.fillRect(0, benchY, width, height - benchY);
            ctx.strokeStyle = 'rgba(125,255,63,0.22)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, benchY);
            ctx.lineTo(width, benchY);
            ctx.stroke();

            drawLabPanel(ctx, 18, Math.max(76, height * 0.13), Math.min(135, width * 0.34), 74, 'DNA SCAN', '#58d7ff');
            drawLabPanel(ctx, width - Math.min(150, width * 0.38) - 18, Math.max(92, height * 0.18), Math.min(150, width * 0.38), 82, 'C-137 VAT', '#7dff3f');
            drawFlask(ctx, width * 0.12, benchY - 18, '#ff63b6', 0.82);
            drawFlask(ctx, width * 0.88, benchY - 22, '#58d7ff', 0.76);

            ctx.fillStyle = 'rgba(238,247,221,0.07)';
            for (let i = 0; i < 14; i++) {
                const y = (time * (12 + i * 3) + i * 76) % height;
                const x = (width / 14) * i + Math.sin(time / 44 + i) * 22;
                ctx.font = `${18 + (i % 4) * 5}px Orbitron`;
                ctx.fillText(i % 4 === 0 ? 'C-137' : i % 3 === 0 ? '🧬' : i % 2 === 0 ? '⚗' : '↯', x, y);
            }

            const cx = width / 2;
            const cy = height / 2 + 50;
            const radius = Math.min(100, width * 0.24);

            drawPortalRing(ctx, cx, cy - 56, radius + 22, 44, -time / 42, 0.64);

            ctx.beginPath();
            ctx.ellipse(cx, cy - 60, radius + 16, 42, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(88, 215, 255, 0.09)';
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(cx, cy - 60, radius, 30, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#0d1f28';
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(cx, cy - 50, radius - 10, 25, 0, 0, Math.PI * 2);
            ctx.fillStyle = cauldronColor;
            ctx.shadowColor = cauldronColor;
            ctx.shadowBlur = 30;
            ctx.fill();
            ctx.shadowBlur = 0;

            if (Math.random() < 0.1) {
                particles.push({
                    x: cx + (Math.random() - 0.5) * 100,
                    y: cy - 50,
                    vx: 0,
                    vy: -2,
                    life: 0.5 + Math.random(),
                    color: Math.random() > 0.5 ? 'rgba(125,255,63,0.7)' : 'rgba(88,215,255,0.7)',
                    type: 'bubble'
                });
            }

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI, false);
            ctx.lineTo(cx - radius, cy - 60);
            ctx.bezierCurveTo(cx - radius, cy + 100, cx + radius, cy + 100, cx + radius, cy - 60);
            const potGrad = ctx.createLinearGradient(cx, cy - 80, cx, cy + 120);
            potGrad.addColorStop(0, '#153744');
            potGrad.addColorStop(0.45, '#09202b');
            potGrad.addColorStop(1, '#03090f');
            ctx.fillStyle = potGrad;
            ctx.fill();
            ctx.strokeStyle = '#7dff3f';
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.34;
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.beginPath();
            ctx.ellipse(cx, cy - 60, radius, 30, 0, Math.PI, false);
            ctx.strokeStyle = '#eef7dd';
            ctx.globalAlpha = 0.62;
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.fillStyle = 'rgba(125, 255, 63, 0.22)';
            ctx.fillRect(cx - radius - 16, cy + 24, radius * 2 + 32, 8);

            ctx.fillStyle = 'rgba(255,216,77,0.76)';
            ctx.font = '700 11px Orbitron';
            ctx.fillText('PORTAL DNA // SERUM // GROWTH', Math.max(18, width * 0.04), Math.min(height - 178, benchY - 14));
        }

        function drawRoom(ctx) {
            const wallGrad = ctx.createLinearGradient(0, 0, 0, height);
            wallGrad.addColorStop(0, '#031018');
            wallGrad.addColorStop(0.45, '#081a30');
            wallGrad.addColorStop(1, '#171031');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.16;
            ctx.strokeStyle = '#58d7ff';
            for (let y = 52; y < height * 0.62; y += 58) {
                ctx.beginPath();
                ctx.moveTo(0, y + Math.sin(time / 75 + y) * 4);
                ctx.lineTo(width, y + Math.cos(time / 88 + y) * 5);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = 0.25;
            for (let i = 0; i < 9; i++) {
                const px = (width * (0.08 + i * 0.12) + Math.sin(time / 70 + i) * 18) % (width + 90) - 45;
                const py = height * (0.13 + (i % 3) * 0.12);
                const r = 34 + (i % 3) * 13;
                drawPortalRing(ctx, px, py, r, r * 0.52, time / 94 + i, i % 2 ? 0.5 : 0.36);
            }
            ctx.restore();

            const floorY = height * 0.7;
            const floorGrad = ctx.createLinearGradient(0, floorY, 0, height);
            floorGrad.addColorStop(0, '#0c2a1a');
            floorGrad.addColorStop(1, '#03100d');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, floorY, width, height - floorY);

            ctx.strokeStyle = 'rgba(125, 255, 63, 0.14)';
            ctx.lineWidth = 1;
            for (let i = -width; i < width * 2; i += 48) {
                ctx.beginPath();
                ctx.moveTo(i + Math.sin(time / 80) * 6, floorY);
                ctx.lineTo(i + width * 0.35, height);
                ctx.stroke();
            }
            for (let i = floorY; i < height; i += 34) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
                ctx.stroke();
            }

            drawLabPanel(ctx, width - Math.min(170, width * 0.42) - 18, Math.max(74, height * 0.12), Math.min(170, width * 0.42), 78, 'SCAN ONLINE', '#ffd84d');

            ctx.save();
            ctx.translate(width / 2, floorY + 50);
            ctx.scale(1, 0.3);
            ctx.beginPath();
            ctx.arc(0, 0, 205, 0, Math.PI * 2);
            const rugGrad = ctx.createRadialGradient(0, 0, 30, 0, 0, 210);
            rugGrad.addColorStop(0, 'rgba(125,255,63,0.92)');
            rugGrad.addColorStop(0.38, 'rgba(88,215,255,0.64)');
            rugGrad.addColorStop(0.72, 'rgba(255,99,182,0.26)');
            rugGrad.addColorStop(1, 'rgba(168,85,247,0.18)');
            ctx.fillStyle = rugGrad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(238, 247, 221, 0.68)';
            ctx.lineWidth = 10;
            ctx.stroke();

            ctx.strokeStyle = 'rgba(5, 8, 11, 0.58)';
            ctx.lineWidth = 4;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.arc(0, 0, 48 + i * 20, 0.15 + i * 0.18, Math.PI * 1.42 + i * 0.18);
                ctx.stroke();
            }

            if (creature.state === 'eat') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(150, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            }
            ctx.restore();

            const winX = Math.max(34, width * 0.07);
            const winY = Math.max(68, height * 0.1);
            const winW = Math.min(250, width * 0.34);
            const winH = Math.min(190, height * 0.23);
            ctx.save();
            ctx.translate(winX + winW / 2, winY + winH / 2);
            ctx.beginPath();
            ctx.ellipse(0, 0, winW * 0.5, winH * 0.48, Math.sin(time / 95) * 0.08, 0, Math.PI * 2);
            const portalGrad = ctx.createRadialGradient(0, 0, 8, 0, 0, winW * 0.55);
            portalGrad.addColorStop(0, '#eaffd7');
            portalGrad.addColorStop(0.3, '#7dff3f');
            portalGrad.addColorStop(0.62, '#58d7ff');
            portalGrad.addColorStop(1, 'rgba(88,215,255,0.08)');
            ctx.fillStyle = portalGrad;
            ctx.fill();
            ctx.strokeStyle = '#7dff3f';
            ctx.lineWidth = 8;
            ctx.shadowColor = '#7dff3f';
            ctx.shadowBlur = 18;
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.globalAlpha = 0.52;
            ctx.strokeStyle = '#06130f';
            ctx.lineWidth = 4;
            for (let i = 0; i < 5; i++) {
                const x = -winW * 0.3 + i * winW * 0.15;
                ctx.beginPath();
                ctx.moveTo(x, winH * 0.24);
                ctx.lineTo(x + 16, -winH * 0.08);
                ctx.lineTo(x + 30, winH * 0.24);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            ctx.fillStyle = 'rgba(255,216,77,0.78)';
            ctx.font = '700 12px Orbitron';
            ctx.fillText('DIMENSION C-137 // OBSERVATION SAFE-ISH', Math.max(18, width * 0.04), floorY - 18);
        }

        function drawCreature(ctx) {
            const cx = creature.x;
            const cy = creature.y - creature.jumpY;
            const s = creature.scale * 100;
            const color = creature.color === '#f472b6' ? `hsl(${time * 50 % 360}, 78%, 63%)` : creature.color;
            const outline = 'rgba(14, 15, 35, 0.85)';
            const highlightColor = creature.color === '#1f2937' ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.22)';

            ctx.save();
            ctx.translate(cx, cy);

            if (creature.state === 'scared') {
                ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
            }

            ctx.scale(creature.faceDir, 1);

            ctx.save();
            ctx.globalAlpha = creature.state === 'happy' ? 0.34 : 0.22;
            ctx.strokeStyle = creature.state === 'scared' ? '#ff63b6' : '#7dff3f';
            ctx.lineWidth = 3;
            ctx.shadowColor = creature.state === 'scared' ? '#ff63b6' : '#7dff3f';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.ellipse(0, -s * 0.58, s * 0.92, s * 0.58, time / 52, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(0, -s * 0.58, s * 0.68, s * 0.43, -time / 66, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            const breath = Math.sin(time / 10) * 5;
            const bounceScale = creature.state === 'happy' ? 1.04 : 1;

            ctx.shadowColor = color;
            ctx.shadowBlur = 22;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, -s / 2, (s / 1.2) * bounceScale, (s / 1.5 + breath) * bounceScale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.lineWidth = 4;
            ctx.strokeStyle = outline;

            ctx.fillStyle = color;
            ctx.beginPath();
            if (creature.species === 'fox') {
                ctx.moveTo(-s / 2, -s); ctx.lineTo(-s / 4, -s * 1.5); ctx.lineTo(0, -s);
                ctx.moveTo(s / 2, -s); ctx.lineTo(s / 4, -s * 1.5); ctx.lineTo(0, -s);
                ctx.moveTo(-s / 2, -s / 2);
                ctx.quadraticCurveTo(-s * 1.5, -s / 2, -s * 1.2, 0);
                ctx.quadraticCurveTo(-s / 2, 0, -s / 2, -s / 2);
            } else if (creature.species === 'cat' || creature.species === 'caracal') {
                ctx.moveTo(-s / 2, -s); ctx.lineTo(-s / 2.5, -s * 1.4); ctx.lineTo(-s / 4, -s);
                ctx.moveTo(s / 2, -s); ctx.lineTo(s / 2.5, -s * 1.4); ctx.lineTo(s / 4, -s);
                ctx.moveTo(-s / 2, -s / 4);
                ctx.bezierCurveTo(-s * 1.2, -s, -s * 1.2, 0, -s / 2, 0);
            } else if (creature.species === 'dog') {
                ctx.ellipse(-s / 2, -s / 2, s / 4, s / 2, 0.5, 0, Math.PI * 2);
                ctx.ellipse(s / 2, -s / 2, s / 4, s / 2, -0.5, 0, Math.PI * 2);
                const wag = Math.sin(time / 2) * 20;
                ctx.moveTo(-s / 2, -s / 4);
                ctx.lineTo(-s + wag, -s / 2);
                ctx.lineTo(-s / 2, 0);
            } else if (creature.species === 'dino') {
                for (let i = 0; i < 3; i++) {
                    ctx.moveTo(-s / 4 + i * 20, -s * 1.1);
                    ctx.lineTo(0 + i * 20, -s * 1.3);
                    ctx.lineTo(s / 4 + i * 20, -s * 1.1);
                }
                ctx.moveTo(-s / 2, 0);
                ctx.lineTo(-s * 1.5, 0);
                ctx.lineTo(-s / 2, -s / 4);
            }
            ctx.fill();

            if (creature.species === 'caracal') {
                ctx.beginPath();
                ctx.moveTo(-s / 2.5, -s * 1.4); ctx.lineTo(-s / 2.8, -s * 1.7);
                ctx.moveTo(s / 2.5, -s * 1.4); ctx.lineTo(s / 2.8, -s * 1.7);
                ctx.strokeStyle = outline;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.ellipse(0, -s * 0.68, s * 0.34, s * 0.19, 0, Math.PI, Math.PI * 2);
            ctx.fillStyle = highlightColor;
            ctx.fill();

            ctx.fillStyle = 'white';
            const eyeOpen = creature.blinkTimer <= 0 ? 10 : 1;
            ctx.beginPath();
            ctx.ellipse(-s / 4, -s / 2, 10, eyeOpen, 0, 0, Math.PI * 2);
            ctx.ellipse(s / 4, -s / 2, 10, eyeOpen, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#141414';
            ctx.beginPath();
            ctx.arc(-s / 4, -s / 2, 4, 0, Math.PI * 2);
            ctx.arc(s / 4, -s / 2, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = creature.state === 'scared' ? '#ffd5e1' : '#fff0f5';
            ctx.ellipse(-s / 2.7, -s / 2.9, 9, 5, -0.2, 0, Math.PI * 2);
            ctx.ellipse(s / 2.7, -s / 2.9, 9, 5, 0.2, 0, Math.PI * 2);
            ctx.globalAlpha = 0.55;
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.strokeStyle = outline;
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (creature.state === 'scared') {
                ctx.arc(0, -s / 3, 7, 0, Math.PI * 2);
            } else {
                ctx.arc(0, -s / 3, 8, 0.1, Math.PI - 0.1);
            }
            ctx.stroke();

            if (creature.state === 'happy') {
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.beginPath();
                ctx.arc(0, -s * 0.45, s * 0.9, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.save();
            ctx.strokeStyle = '#7dff3f';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.78;
            ctx.beginPath();
            ctx.moveTo(-s * 0.18, -s * 1.16);
            ctx.quadraticCurveTo(-s * 0.38, -s * 1.46, -s * 0.2, -s * 1.68);
            ctx.moveTo(s * 0.18, -s * 1.16);
            ctx.quadraticCurveTo(s * 0.38, -s * 1.46, s * 0.2, -s * 1.68);
            ctx.stroke();
            ctx.fillStyle = '#58d7ff';
            ctx.beginPath();
            ctx.arc(-s * 0.2, -s * 1.68, 4, 0, Math.PI * 2);
            ctx.arc(s * 0.2, -s * 1.68, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(3,12,18,0.82)';
            ctx.strokeStyle = 'rgba(255,216,77,0.78)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(s * 0.23, -s * 0.25, s * 0.34, s * 0.18, 5);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffd84d';
            ctx.font = `${Math.max(8, s * 0.08)}px Orbitron`;
            ctx.fillText('ID', s * 0.29, -s * 0.13);

            ctx.fillStyle = 'rgba(255,99,182,0.55)';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(-s * 0.32 + i * s * 0.2, -s * (0.78 + (i % 2) * 0.12), 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            ctx.restore();
        }

        function updateCreature() {
            if (phase !== 'room') return;

            if (creature.blinkTimer > 0) creature.blinkTimer--;
            else if (Math.random() < 0.01) creature.blinkTimer = 10;

            if (creature.state === 'idle') {
                if (Math.random() < 0.02) {
                    creature.state = 'walk';
                    creature.stateTimer = 100 + Math.random() * 100;
                    creature.vx = (Math.random() - 0.5) * 2;
                    creature.faceDir = creature.vx > 0 ? 1 : -1;
                }
            } else if (creature.state === 'walk') {
                creature.x += creature.vx;
                creature.jumpY = Math.abs(Math.sin(time / 5)) * 10;

                if (creature.x < 50 || creature.x > width - 50) {
                    creature.vx *= -1;
                    creature.faceDir *= -1;
                }

                creature.stateTimer--;
                if (creature.stateTimer <= 0) {
                    creature.state = 'idle';
                    creature.jumpY = 0;
                    if (Math.abs(creature.x - width / 2) < 100 && Math.random() < 0.3) {
                        creature.state = 'eat';
                        creature.stateTimer = 60;
                        audio.playSFX('feed');
                    }
                }
            } else if (creature.state === 'eat') {
                creature.jumpY = 0;
                creature.stateTimer--;
                if (creature.stateTimer <= 0) creature.state = 'idle';
            } else if (creature.state === 'scared') {
                creature.stateTimer--;
                if (creature.stateTimer <= 0) creature.state = 'idle';
            } else if (creature.state === 'happy') {
                creature.jumpY = Math.abs(Math.sin(time / 2)) * 20;
                creature.stateTimer--;
                if (creature.stateTimer <= 0) {
                    creature.state = 'idle';
                    creature.jumpY = 0;
                }
            }
        }

        function drawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                ctx.globalAlpha = p.life;
                if (p.type === 'heart') {
                    ctx.fillStyle = p.color || 'red';
                    ctx.font = '20px Rajdhani';
                    ctx.fillText('❤️', p.x, p.y);
                } else if (p.type === 'bubble') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(time / 12);
                    ctx.beginPath();
                    ctx.moveTo(0, -5);
                    ctx.lineTo(4, 0);
                    ctx.lineTo(0, 5);
                    ctx.lineTo(-4, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
                ctx.globalAlpha = 1;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function gameLoop() {
            time++;
            ctx.clearRect(0, 0, width, height);

            if (phase === 'lab') {
                drawLab(ctx);
            } else {
                drawRoom(ctx);
                updateCreature();
                drawCreature(ctx);
            }

            drawParticles(ctx);
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('menu', 0);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('lab-controls').classList.remove('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            renderIngredients();
            gameLoop();
        });

        document.getElementById('mix-btn').addEventListener('click', () => {
            audio.playSFX('create', 0);
            phase = 'room';

            creature.species = selectedSpecies;
            creature.color = selectedColor;
            creature.scale = selectedSize;
            creature.x = width / 2;
            creature.y = height * 0.7;
            creature.state = 'idle';

            document.getElementById('lab-controls').classList.add('hidden');
            document.getElementById('play-controls').classList.remove('hidden');
            document.getElementById('interaction-bar').classList.remove('hidden');
            document.getElementById('status-text').innerHTML = "<strong>Mutation</strong> Stable-ish";
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            phase = 'lab';
            audio.playSFX('blocked');
            gifFeedback.classList.add('hidden');
            document.getElementById('lab-controls').classList.remove('hidden');
            document.getElementById('play-controls').classList.add('hidden');
            document.getElementById('interaction-bar').classList.add('hidden');
            document.getElementById('status-text').innerHTML = "<strong>Garage Lab</strong> Active";
        });

        document.getElementById('pet-btn').addEventListener('click', () => {
            creature.state = 'happy';
            creature.stateTimer = 60;
            audio.playSFX('pet');
            showGif('affection', 'Affection reaction');
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: creature.x, y: creature.y - 50,
                    vx: (Math.random() - 0.5) * 5, vy: -2 - Math.random() * 3,
                    life: 1, type: 'heart'
                });
            }
        });

        document.getElementById('feed-btn').addEventListener('click', () => {
            creature.scale = Math.min(creature.scale + 0.1, 3.0);
            audio.playSFX('feed');
            particles.push({
                x: creature.x, y: creature.y - 50,
                vx: 0, vy: -2,
                life: 1, type: 'heart', color: 'orange'
            });
        });

        document.getElementById('scare-btn').addEventListener('click', () => {
            creature.state = 'scared';
            creature.stateTimer = 40;
            audio.playSFX('scare');
            showGif('scare', 'Creature startled reaction');
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (phase !== 'room') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dx = x - creature.x;
            const dy = y - (creature.y - 50);
            if (Math.sqrt(dx * dx + dy * dy) < 100 * creature.scale) {
                document.getElementById('pet-btn').click();
            }
        });
    });
    </script>
</body>
