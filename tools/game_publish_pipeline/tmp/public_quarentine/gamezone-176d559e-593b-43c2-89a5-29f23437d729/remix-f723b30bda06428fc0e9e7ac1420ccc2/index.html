<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Flappy Hatchery</title>
    <!-- [agent-note][stage4] repaired: approved-font-remap | title-ui: Orbitron | body-ui: Rajdhani -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-night: #090614;
            --bg-deep: #130f2b;
            --bg-panel: rgba(20, 18, 44, 0.88);
            --bg-panel-soft: rgba(36, 31, 76, 0.78);
            --line-soft: rgba(193, 220, 255, 0.2);
            --line-bright: rgba(120, 209, 255, 0.66);
            --text-main: #eef7ff;
            --text-muted: #b7c3df;
            --accent-cyan: #7ef2ff;
            --accent-violet: #ad76ff;
            --accent-pink: #ff63b6;
            --accent-lime: #7dffb0;
            --danger: #ff6a8b;
            --shadow-glow: 0 0 24px rgba(126, 242, 255, 0.2);
            --panel-radius: 22px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(173, 118, 255, 0.16), transparent 32%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-night));
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(126, 242, 255, 0.12), transparent 18%),
                radial-gradient(circle at 78% 22%, rgba(255, 99, 182, 0.12), transparent 20%);
            opacity: 0.9;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hidden { display: none !important; }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(6, 6, 18, 0.35), rgba(7, 4, 18, 0.15));
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            pointer-events: auto;
            z-index: 50;
            background:
                radial-gradient(circle at center, rgba(14, 12, 32, 0.35), rgba(0, 0, 0, 0.82)),
                linear-gradient(180deg, rgba(5, 5, 10, 0.58), rgba(5, 5, 10, 0.92));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(44, 36, 93, 0.82), rgba(14, 13, 34, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line-soft);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.38), var(--shadow-glow);
        }

        .intro-card {
            width: min(100%, 420px);
            border-radius: 28px;
            padding: 26px 22px 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-top: 4px solid var(--accent-pink);
        }

        .intro-card::before,
        .intro-card::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(8px);
            opacity: 0.45;
            pointer-events: none;
        }

        .intro-card::before {
            width: 140px;
            height: 140px;
            top: -30px;
            left: -30px;
            background: radial-gradient(circle, rgba(126, 242, 255, 0.65), transparent 68%);
        }

        .intro-card::after {
            width: 180px;
            height: 180px;
            right: -45px;
            bottom: -55px;
            background: radial-gradient(circle, rgba(255, 99, 182, 0.5), transparent 70%);
        }

        .lab-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            margin-bottom: 12px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            background: rgba(126, 242, 255, 0.08);
            border: 1px solid rgba(126, 242, 255, 0.25);
            box-shadow: inset 0 0 10px rgba(126, 242, 255, 0.08);
        }

        .title-display,
        .font-display {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }

        .title-display {
            margin: 0 0 8px;
            font-size: clamp(34px, 9vw, 56px);
            line-height: 0.96;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: transparent;
            background: linear-gradient(90deg, var(--accent-cyan), #9ea5ff 46%, var(--accent-pink));
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 16px rgba(126, 242, 255, 0.2));
        }

        .subtitle {
            margin: 0 0 16px;
            color: var(--text-muted);
            font-size: 20px;
            font-weight: 600;
        }

        .safety-note {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 106, 139, 0.26);
            background: linear-gradient(180deg, rgba(100, 20, 41, 0.28), rgba(45, 11, 24, 0.22));
            color: #ffd9e4;
            font-size: 13px;
            line-height: 1.35;
            box-shadow: inset 0 0 18px rgba(255, 106, 139, 0.08);
        }

        .start-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 18px;
            color: #091019;
            background: linear-gradient(90deg, var(--accent-cyan), #7ab8ff 52%, var(--accent-pink));
            box-shadow: 0 16px 30px rgba(86, 122, 255, 0.24);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 24px;
            letter-spacing: 0.06em;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .start-btn:hover,
        .start-btn:active {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.05);
            box-shadow: 0 18px 34px rgba(86, 122, 255, 0.34);
        }

        .start-btn:active,
        .btn-option:active,
        .mix-btn:active,
        .pill-btn:active,
        .reset-btn:active {
            transform: scale(0.97);
        }

        .floating { animation: float 3s ease-in-out infinite; }

        .spark-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 2px 0 16px;
            opacity: 0.85;
            font-size: 20px;
        }

        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            max-width: min(58vw, 220px);
            color: var(--text-main);
            pointer-events: none;
        }

        .hud-status {
            padding: 9px 12px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: linear-gradient(180deg, rgba(20, 18, 41, 0.9), rgba(8, 7, 18, 0.82));
            border: 1px solid rgba(126, 242, 255, 0.18);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hud-status strong {
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        /* [agent-note][stage2] preserve: control-zone | reason: bottom action strip already mobile-safe */
        .lab-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(180deg, rgba(5, 6, 11, 0), rgba(6, 7, 15, 0.82) 18%, rgba(6, 7, 15, 0.94));
        }

        .category-strip {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .category-pill {
            padding: 8px 12px;
            border-radius: 999px;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(180deg, rgba(31, 29, 64, 0.92), rgba(15, 13, 28, 0.82));
            border: 1px solid rgba(126, 242, 255, 0.14);
            box-shadow: inset 0 0 10px rgba(173, 118, 255, 0.08);
        }

        .ingredient-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 2px 4px 4px;
            scroll-snap-type: x proximity;
        }

        .ingredient-list::-webkit-scrollbar { height: 6px; }
        .ingredient-list::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, rgba(126, 242, 255, 0.65), rgba(173, 118, 255, 0.65));
            border-radius: 999px;
        }

        .btn-option {
            position: relative;
            min-width: 82px;
            height: 86px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            border-radius: 18px;
            color: var(--text-main);
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            border: 1px solid rgba(190, 203, 255, 0.16);
            background:
                linear-gradient(180deg, rgba(41, 37, 79, 0.88), rgba(18, 16, 34, 0.92));
        }

        .btn-option .icon {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.14));
        }

        .btn-option .label {
            font-size: 12px;
            line-height: 1;
            font-weight: 700;
        }

        .btn-option:hover {
            transform: translateY(-1px);
            border-color: rgba(126, 242, 255, 0.35);
        }

        .btn-selected {
            border: 2px solid var(--line-bright);
            background:
                linear-gradient(180deg, rgba(53, 45, 108, 0.96), rgba(23, 22, 49, 0.96));
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 18px rgba(126, 242, 255, 0.18);
        }

        .btn-selected::after {
            content: "✓";
            position: absolute;
            top: 6px;
            right: 8px;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: rgba(126, 242, 255, 0.15);
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: 700;
        }

        .divider {
            width: 2px;
            height: 58px;
            align-self: center;
            flex: 0 0 auto;
            border-radius: 999px;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.24), transparent);
            margin: 0 1px;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }

        .mix-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            min-width: min(88vw, 320px);
            border-radius: 999px;
            color: #08130b;
            background: linear-gradient(90deg, #7dffb0, #5bd7ff);
            box-shadow: 0 0 24px rgba(93, 226, 255, 0.32);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 22px;
            letter-spacing: 0.05em;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        }

        .mix-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .mix-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .play-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reset-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            color: var(--text-main);
            background: linear-gradient(180deg, rgba(35, 31, 74, 0.92), rgba(18, 16, 34, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
            font-size: 14px;
            font-weight: 700;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .reset-btn:hover {
            background: linear-gradient(180deg, rgba(52, 46, 110, 0.95), rgba(21, 18, 43, 0.96));
        }

        .interaction-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            padding: 0 12px calc(env(safe-area-inset-bottom, 0px));
            pointer-events: auto;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 92px;
            padding: 11px 16px;
            border-radius: 999px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .pill-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .pill-pet { background: linear-gradient(90deg, #3b82f6, #5ed7ff); }
        .pill-feed { background: linear-gradient(90deg, #fb923c, #ffd166); color: #2b1600; }
        .pill-scare { background: linear-gradient(90deg, #ef4444, #ff72a7); }

        .spark-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: rgba(126, 242, 255, 0.08);
            box-shadow: inset 0 0 8px rgba(126, 242, 255, 0.16);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 640px) {
            .intro-card { padding: 22px 18px 18px; }
            .subtitle { font-size: 18px; }
            .lab-controls { gap: 8px; padding-top: 10px; }
            .category-pill { font-size: 11px; padding: 7px 11px; }
            .btn-option { min-width: 76px; height: 82px; border-radius: 16px; }
            .mix-btn { min-width: 100%; font-size: 20px; padding: 12px 16px; }
            .play-controls { top: 10px; right: 10px; }
            .interaction-bar { gap: 8px; bottom: 14px; }
            .pill-btn {
                flex: 1 1 calc(33.333% - 8px);
                min-width: 0;
                padding: 11px 10px;
                font-size: 14px;
            }
            .hud { top: 10px; left: 10px; max-width: calc(100vw - 132px); }
            .hud-status { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-root">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: affection/scare feedback -> catalogs/gifs.json lightweight HUD overlays -->
        <div id="gif-feedback" class="hidden" aria-live="polite" style="position:absolute;top:76px;right:12px;z-index:40;pointer-events:none;width:min(30vw,120px);">
            <img id="gif-feedback-img" alt="" style="display:block;width:100%;border-radius:18px;border:1px solid rgba(255,255,255,0.16);box-shadow:0 10px 22px rgba(0,0,0,0.24);background:rgba(8,8,20,0.55);">
        </div>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="overlay-screen">
                <div class="glass-panel intro-card">
                    <div class="lab-badge floating"><span>🥚</span><span>Sky Hatchery Route 1</span></div>
                    <div class="spark-row" aria-hidden="true"><span>☁️</span><span>🪶</span><span>🟩</span></div>
                    <h1 class="title-display">FLAPPY HATCHERY</h1>
                    <p class="subtitle">Choose a lineage, feather tint, and wing scale to hatch a cheerful sky flapper.</p>
                    <div class="safety-note">
                        ☁️ SKY NURSERY NOTE:<br>Pipes are scenery. Care, feed, and gentle gusts keep the flapper brave.
                    </div>
                    <button id="start-btn" class="start-btn">
                        <span>ENTER HATCHERY</span>
                        <span class="spark-chip" aria-hidden="true">🪶</span>
                    </button>
                </div>
            </div>

            <div id="lab-controls" class="lab-controls hidden">
                <div class="category-strip">
                    <div class="glass-panel category-pill">1. Lineage</div>
                    <div class="glass-panel category-pill">2. Feather</div>
                    <div class="glass-panel category-pill">3. Wing</div>
                </div>

                <div class="ingredient-list" id="ingredient-list">
                </div>

                <div class="action-bar">
                    <button id="mix-btn" class="mix-btn">HATCH FLAPPER</button>
                </div>
            </div>

            <div id="play-controls" class="play-controls hidden">
                <button id="reset-btn" class="reset-btn glass-panel">🥚 New Egg</button>
            </div>

            <div id="interaction-bar" class="interaction-bar hidden">
                <button id="pet-btn" class="pill-btn pill-pet">👋 Pet</button>
                <button id="feed-btn" class="pill-btn pill-feed">🌱 Feed</button>
                <button id="scare-btn" class="pill-btn pill-scare">💨 Gust!</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: top-left compact status is already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-status glass-panel" id="status-text"><strong>Hatchery</strong> Active</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/joyful_bgm_01.mp3",
            sfx: {
                ui: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_character_01.mp3",
                create: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_01.mp3",
                pet: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_npc_01.mp3",
                feed: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_02.mp3",
                scare: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_wind_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/calm_wind_01.mp3",
                menu: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_character_02.mp3"
            },
            gifs: {
                affection: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                scare: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    audio.volume = k === 'ui' ? 0.4 : 0.55;
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                this.ready = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((sound) => sound.load());
            }
            playBGM() {
                if (!this.ready) return;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, debounceMs = 120) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
                this.lastPlayedAt[key] = now;
                const sound = this.sfx[key].cloneNode();
                sound.volume = this.sfx[key].volume;
                sound.play().catch(() => {});
            }
        }
        const audio = new AudioController();
        const gifFeedback = document.getElementById('gif-feedback');
        const gifFeedbackImg = document.getElementById('gif-feedback-img');
        let gifFeedbackTimer = null;

        function showGif(type, altText) {
            const src = ASSETS.gifs[type];
            if (!src) return;
            gifFeedbackImg.src = src;
            gifFeedbackImg.alt = altText;
            gifFeedback.classList.remove('hidden');
            clearTimeout(gifFeedbackTimer);
            gifFeedbackTimer = setTimeout(() => gifFeedback.classList.add('hidden'), 1800);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        let phase = 'lab';
        let time = 0;

        let selectedSpecies = 'fox';
        let selectedColor = '#ff7e21';
        let selectedSize = 1.0;
        let cauldronColor = '#2d1b4e';
        let particles = [];

        let creature = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            species: 'fox',
            color: '#ff7e21',
            scale: 1.0,
            state: 'idle',
            stateTimer: 0,
            blinkTimer: 0,
            jumpY: 0,
            faceDir: 1
        };

        const SPECIES = [
            { id: 'fox', icon: '🦊', name: 'Swift Foxlet', aura: '#ff9d3c' },
            { id: 'cat', icon: '🐱', name: 'Cloudcat', aura: '#78f2ff' },
            { id: 'dog', icon: '🐶', name: 'Pup Flapper', aura: '#ffe17d' },
            { id: 'dino', icon: '🦖', name: 'Dino Chick', aura: '#7dffb0' },
            { id: 'caracal', icon: '🐯', name: 'Crest Lynx', aura: '#ff7ea5' }
        ];

        const COLORS = [
            { id: '#ef4444', icon: '🍓', name: 'Berry Red' },
            { id: '#f97316', icon: '🍊', name: 'Sun Orange' },
            { id: '#eab308', icon: '🌻', name: 'Nest Gold' },
            { id: '#22c55e', icon: '🌿', name: 'Pipe Green' },
            { id: '#3b82f6', icon: '💧', name: 'Sky Blue' },
            { id: '#a855f7', icon: '🍇', name: 'Egg Violet' },
            { id: '#ec4899', icon: '🍉', name: 'Care Pink' },
            { id: '#1f2937', icon: '🌋', name: 'Storm Black' },
            { id: '#ffffff', icon: '☁️', name: 'Cloud White' },
            { id: '#f472b6', icon: '🌈', name: 'Rainbow Plume' }
        ];

        const SIZES = [
            { val: 0.5, icon: '🐣', name: 'Tiny Wing' },
            { val: 0.8, icon: '🪶', name: 'Small Wing' },
            { val: 1.0, icon: '🐦', name: 'Steady Wing' },
            { val: 1.5, icon: '🪽', name: 'Broad Wing' },
            { val: 2.0, icon: '🦅', name: 'Giant Wing' }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (phase === 'room') {
                creature.y = height * 0.7;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        const listEl = document.getElementById('ingredient-list');

        function renderIngredients() {
            listEl.innerHTML = '';

            const createSection = (items, type) => {
                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-option glass-panel';
                    btn.innerHTML = `<span class="icon">${item.icon}</span><span class="label">${item.name}</span>`;

                    let isSelected = false;
                    if (type === 'species' && selectedSpecies === item.id) isSelected = true;
                    if (type === 'color' && selectedColor === item.id) isSelected = true;
                    if (type === 'size' && selectedSize === item.val) isSelected = true;

                    if (isSelected) btn.classList.add('btn-selected');

                    btn.onclick = () => {
                        audio.playSFX('ui');
                        if (type === 'species') selectedSpecies = item.id;
                        if (type === 'color') {
                            selectedColor = item.id;
                            cauldronColor = item.id === '#f472b6' ? '#ff00ff' : item.id;
                        }
                        if (type === 'size') selectedSize = item.val;

                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: width / 2,
                                y: height / 2 - 100,
                                vx: (Math.random() - 0.5) * 10,
                                vy: (Math.random() - 0.5) * 10,
                                life: 1.0,
                                color: type === 'color' ? item.id : '#fff'
                            });
                        }
                        renderIngredients();
                    };
                    listEl.appendChild(btn);
                });

                const div = document.createElement('div');
                div.className = 'divider';
                listEl.appendChild(div);
            };

            createSection(SPECIES, 'species');
            createSection(COLORS, 'color');
            createSection(SIZES, 'size');

            const lastDivider = listEl.lastElementChild;
            if (lastDivider && lastDivider.classList.contains('divider')) {
                lastDivider.remove();
            }
        }

        function roundedRectPath(ctx, x, y, w, h, r) {
            const rr = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + rr, y);
            ctx.arcTo(x + w, y, x + w, y + h, rr);
            ctx.arcTo(x + w, y + h, x, y + h, rr);
            ctx.arcTo(x, y + h, x, y, rr);
            ctx.arcTo(x, y, x + w, y, rr);
            ctx.closePath();
        }

        function drawCloud(ctx, x, y, scale = 1, alpha = 0.8) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#fff7df';
            ctx.beginPath();
            ctx.arc(-38, 8, 26, 0, Math.PI * 2);
            ctx.arc(-14, -8, 34, 0, Math.PI * 2);
            ctx.arc(22, -10, 30, 0, Math.PI * 2);
            ctx.arc(48, 10, 22, 0, Math.PI * 2);
            ctx.rect(-62, 8, 128, 30);
            ctx.fill();
            ctx.globalAlpha = alpha * 0.38;
            ctx.fillStyle = '#7ef2ff';
            ctx.beginPath();
            ctx.ellipse(6, 22, 58, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPipeProp(ctx, x, y, h, scale = 1, alpha = 0.42) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.globalAlpha = alpha;
            const pipeGrad = ctx.createLinearGradient(-22, 0, 28, 0);
            pipeGrad.addColorStop(0, '#117a36');
            pipeGrad.addColorStop(0.38, '#22c55e');
            pipeGrad.addColorStop(0.72, '#7dffb0');
            pipeGrad.addColorStop(1, '#0b5d2b');
            ctx.fillStyle = pipeGrad;
            roundedRectPath(ctx, -24, -h, 48, h, 10);
            ctx.fill();
            roundedRectPath(ctx, -34, -h - 18, 68, 28, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.26)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-12, -h + 6);
            ctx.lineTo(-12, -10);
            ctx.stroke();
            ctx.restore();
        }

        function drawFeather(ctx, x, y, size = 24, color = '#7ef2ff', angle = 0, alpha = 0.75) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.bezierCurveTo(size * 0.65, -size * 0.45, size * 0.35, size * 0.72, 0, size);
            ctx.bezierCurveTo(-size * 0.34, size * 0.42, -size * 0.45, -size * 0.54, 0, -size);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.72)';
            ctx.lineWidth = Math.max(1, size * 0.06);
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.78);
            ctx.lineTo(0, size * 0.76);
            ctx.stroke();
            ctx.restore();
        }

        function drawNest(ctx, x, y, radius, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.lineCap = 'round';
            for (let i = 0; i < 9; i++) {
                ctx.strokeStyle = i % 2 ? 'rgba(255,209,102,0.86)' : 'rgba(255,176,103,0.76)';
                ctx.lineWidth = 5 + (i % 3);
                ctx.beginPath();
                const yy = Math.sin(time / 18 + i) * 3 + i * 3;
                ctx.ellipse(0, yy, radius - i * 4, 20 + i * 1.4, Math.sin(i) * 0.08, Math.PI * 0.04, Math.PI * 0.96);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawEgg(ctx, x, y, size, glowColor) {
            ctx.save();
            ctx.translate(x, y);
            const pulse = 1 + Math.sin(time / 24) * 0.04;
            ctx.scale(pulse, pulse);
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 28;
            const eggGrad = ctx.createRadialGradient(-size * 0.25, -size * 0.35, 4, 0, 0, size);
            eggGrad.addColorStop(0, '#ffffff');
            eggGrad.addColorStop(0.42, '#fff7df');
            eggGrad.addColorStop(0.72, glowColor);
            eggGrad.addColorStop(1, '#6a45ad');
            ctx.fillStyle = eggGrad;
            ctx.beginPath();
            ctx.moveTo(0, -size * 1.12);
            ctx.bezierCurveTo(size * 0.88, -size * 0.62, size * 0.74, size * 0.84, 0, size);
            ctx.bezierCurveTo(-size * 0.74, size * 0.84, -size * 0.88, -size * 0.62, 0, -size * 1.12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.68)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        function drawWindSpiral(ctx, x, y, radius, color = '#d8f2ff', alpha = 0.42) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 2.5; a += 0.18) {
                const r = radius * a / (Math.PI * 2.5);
                const px = Math.cos(a + time / 70) * r;
                const py = Math.sin(a + time / 70) * r * 0.55;
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawTrainingHoop(ctx, x, y, r, alpha = 0.36) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.ellipse(0, 0, r, r * 1.25, 0.18, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(126,242,255,0.55)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 0, r + 9, r * 1.25 + 9, 0.18, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawLab(ctx) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#090f2f');
            grad.addColorStop(0.34, '#15366b');
            grad.addColorStop(0.72, '#1e2660');
            grad.addColorStop(1, '#130f2b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.5, height * 0.36, 12, width * 0.5, height * 0.36, width * 0.56);
            glow.addColorStop(0, 'rgba(126,242,255,0.2)');
            glow.addColorStop(0.42, 'rgba(173,118,255,0.13)');
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 7; i++) {
                const x = ((time * (0.22 + i * 0.03) + i * width * 0.22) % (width + 180)) - 90;
                drawCloud(ctx, x, height * (0.13 + (i % 3) * 0.12), 0.55 + (i % 3) * 0.13, 0.18 + (i % 2) * 0.08);
            }

            for (let i = 0; i < 6; i++) {
                const x = (width / 6) * i + Math.sin(time / 44 + i) * 20;
                const y = (time * (0.32 + i * 0.05) + i * 92) % (height * 0.64);
                drawFeather(ctx, x, y, 12 + i * 2, i % 2 ? '#d8f2ff' : '#7ef2ff', Math.sin(time / 36 + i), 0.3);
            }

            const cx = width / 2;
            const cy = height / 2 + 42;
            const radius = Math.min(108, width * 0.25);

            ctx.save();
            ctx.translate(cx, cy - 116);
            ctx.strokeStyle = 'rgba(126,242,255,0.2)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                const yy = -74 + i * 36;
                ctx.beginPath();
                for (let t = 0; t <= Math.PI * 2; t += 0.16) {
                    const px = Math.sin(t + time / 42) * 42;
                    const py = yy + t * 8;
                    if (t === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            ctx.restore();

            drawNest(ctx, cx, cy + 30, radius + 24, 0.95);
            ctx.beginPath();
            ctx.ellipse(cx, cy + 30, radius + 28, 26, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(126,242,255,0.1)';
            ctx.fill();

            drawEgg(ctx, cx, cy - 26, Math.max(54, radius * 0.62), cauldronColor === '#2d1b4e' ? '#ad76ff' : cauldronColor);

            drawWindSpiral(ctx, cx - radius - 50, cy - 24, 38, '#7ef2ff', 0.28);
            drawWindSpiral(ctx, cx + radius + 50, cy - 12, 34, '#ffd166', 0.25);

            if (Math.random() < 0.08) {
                particles.push({
                    x: cx + (Math.random() - 0.5) * 110,
                    y: cy - 70,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: -1.6,
                    life: 0.55 + Math.random() * 0.45,
                    color: 'rgba(255,247,223,0.68)',
                    type: 'bubble'
                });
            }

            ctx.fillStyle = 'rgba(126, 242, 255, 0.22)';
            roundedRectPath(ctx, cx - radius - 30, cy + 74, radius * 2 + 60, 9, 5);
            ctx.fill();
        }

        function drawRoom(ctx) {
            const wallGrad = ctx.createLinearGradient(0, 0, 0, height);
            wallGrad.addColorStop(0, '#78d8ff');
            wallGrad.addColorStop(0.54, '#d8f2ff');
            wallGrad.addColorStop(1, '#fff7df');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, width, height);

            const sunPulse = 0.08 + Math.sin(time / 70) * 0.025;
            const sunGlow = ctx.createRadialGradient(width * 0.78, height * 0.16, 5, width * 0.78, height * 0.16, width * 0.32);
            sunGlow.addColorStop(0, `rgba(255,209,102,${0.36 + sunPulse})`);
            sunGlow.addColorStop(0.55, 'rgba(255,176,103,0.12)');
            sunGlow.addColorStop(1, 'rgba(255,176,103,0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 8; i++) {
                const x = ((time * (0.34 + i * 0.045) + i * width * 0.19) % (width + 220)) - 110;
                const y = height * (0.16 + (i % 4) * 0.09) + Math.sin(time / 48 + i) * 9;
                drawCloud(ctx, x, y, 0.5 + (i % 3) * 0.18, 0.28 + (i % 2) * 0.14);
            }

            const floorY = height * 0.7;

            for (let i = 0; i < 5; i++) {
                const x = ((i * width * 0.28 - time * 0.12) % (width + 160)) - 80;
                drawPipeProp(ctx, x, floorY + 22, 92 + (i % 3) * 42, 0.72 + (i % 2) * 0.12, 0.24);
            }

            drawTrainingHoop(ctx, width * 0.78, height * 0.45 + Math.sin(time / 58) * 8, Math.min(54, width * 0.11), 0.32);
            drawWindSpiral(ctx, width * 0.25, height * 0.42, 46, '#ffffff', 0.24);

            const floorGrad = ctx.createLinearGradient(0, floorY, 0, height);
            floorGrad.addColorStop(0, 'rgba(255,247,223,0.5)');
            floorGrad.addColorStop(0.48, '#ffe7ab');
            floorGrad.addColorStop(1, '#ffb067');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, floorY, width, height - floorY);

            for (let i = 0; i < width; i += 44) {
                ctx.strokeStyle = 'rgba(124, 80, 24, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(i, floorY);
                ctx.lineTo(i - 18, height);
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(width / 2, floorY + 50);
            ctx.scale(1, 0.3);
            ctx.beginPath();
            ctx.arc(0, 0, 208, 0, Math.PI * 2);
            const rugGrad = ctx.createLinearGradient(-210, 0, 210, 0);
            rugGrad.addColorStop(0, '#22c55e');
            rugGrad.addColorStop(0.4, '#ffd166');
            rugGrad.addColorStop(0.72, '#7ef2ff');
            rugGrad.addColorStop(1, '#ff72a7');
            ctx.fillStyle = rugGrad;
            ctx.globalAlpha = 0.76;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#fff7df';
            ctx.lineWidth = 12;
            ctx.globalAlpha = 0.58;
            ctx.stroke();
            ctx.globalAlpha = 1;

            if (creature.state === 'eat') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(150, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            }
            ctx.restore();

            const winX = Math.max(36, width * 0.08);
            const winY = Math.max(70, height * 0.11);
            const winW = Math.min(230, width * 0.34);
            const winH = Math.min(210, height * 0.24);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            roundedRectPath(ctx, winX - 6, winY - 6, winW + 12, winH + 12, 18);
            ctx.fill();
            const skyGrad = ctx.createLinearGradient(winX, winY, winX, winY + winH);
            skyGrad.addColorStop(0, '#6ccfff');
            skyGrad.addColorStop(1, '#d8f2ff');
            ctx.fillStyle = skyGrad;
            roundedRectPath(ctx, winX, winY, winW, winH, 14);
            ctx.fill();
            ctx.strokeStyle = '#fff7df';
            ctx.lineWidth = 8;
            roundedRectPath(ctx, winX, winY, winW, winH, 14);
            ctx.stroke();

            drawCloud(ctx, winX + winW * 0.48, winY + winH * 0.42, 0.38, 0.56);
            drawPipeProp(ctx, winX + winW * 0.82, winY + winH + 14, winH * 0.48, 0.48, 0.42);
        }

        function drawCreature(ctx) {
            const cx = creature.x;
            const cy = creature.y - creature.jumpY;
            const s = creature.scale * 100;
            const color = creature.color === '#f472b6' ? `hsl(${time * 50 % 360}, 78%, 63%)` : creature.color;
            const outline = 'rgba(14, 15, 35, 0.85)';
            const highlightColor = creature.color === '#1f2937' ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.22)';

            ctx.save();
            ctx.translate(cx, cy);

            if (creature.state === 'scared') {
                ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
            }

            ctx.scale(creature.faceDir, 1);

            const breath = Math.sin(time / 10) * 5;
            const wingFlap = Math.sin(time / 4) * (creature.state === 'happy' ? 0.16 : 0.08);
            const bounceScale = creature.state === 'happy' ? 1.04 : 1;

            ctx.save();
            ctx.rotate(-0.18 - wingFlap);
            ctx.fillStyle = 'rgba(255,247,223,0.9)';
            ctx.strokeStyle = outline;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-s * 0.42, -s * 0.6);
            ctx.bezierCurveTo(-s * 1.35, -s * 0.95, -s * 1.42, -s * 0.05, -s * 0.48, -s * 0.08);
            ctx.bezierCurveTo(-s * 0.68, -s * 0.28, -s * 0.56, -s * 0.48, -s * 0.42, -s * 0.6);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.rotate(0.18 + wingFlap);
            ctx.fillStyle = 'rgba(216,242,255,0.9)';
            ctx.strokeStyle = outline;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(s * 0.42, -s * 0.6);
            ctx.bezierCurveTo(s * 1.35, -s * 0.95, s * 1.42, -s * 0.05, s * 0.48, -s * 0.08);
            ctx.bezierCurveTo(s * 0.68, -s * 0.28, s * 0.56, -s * 0.48, s * 0.42, -s * 0.6);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            ctx.shadowColor = color;
            ctx.shadowBlur = 22;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, -s / 2, (s / 1.2) * bounceScale, (s / 1.5 + breath) * bounceScale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.lineWidth = 4;
            ctx.strokeStyle = outline;

            ctx.fillStyle = color;
            ctx.beginPath();
            if (creature.species === 'fox') {
                ctx.moveTo(-s / 2, -s); ctx.lineTo(-s / 4, -s * 1.5); ctx.lineTo(0, -s);
                ctx.moveTo(s / 2, -s); ctx.lineTo(s / 4, -s * 1.5); ctx.lineTo(0, -s);
                ctx.moveTo(-s / 2, -s / 2);
                ctx.quadraticCurveTo(-s * 1.5, -s / 2, -s * 1.2, 0);
                ctx.quadraticCurveTo(-s / 2, 0, -s / 2, -s / 2);
            } else if (creature.species === 'cat' || creature.species === 'caracal') {
                ctx.moveTo(-s / 2, -s); ctx.lineTo(-s / 2.5, -s * 1.4); ctx.lineTo(-s / 4, -s);
                ctx.moveTo(s / 2, -s); ctx.lineTo(s / 2.5, -s * 1.4); ctx.lineTo(s / 4, -s);
                ctx.moveTo(-s / 2, -s / 4);
                ctx.bezierCurveTo(-s * 1.2, -s, -s * 1.2, 0, -s / 2, 0);
            } else if (creature.species === 'dog') {
                ctx.ellipse(-s / 2, -s / 2, s / 4, s / 2, 0.5, 0, Math.PI * 2);
                ctx.ellipse(s / 2, -s / 2, s / 4, s / 2, -0.5, 0, Math.PI * 2);
                const wag = Math.sin(time / 2) * 20;
                ctx.moveTo(-s / 2, -s / 4);
                ctx.lineTo(-s + wag, -s / 2);
                ctx.lineTo(-s / 2, 0);
            } else if (creature.species === 'dino') {
                for (let i = 0; i < 3; i++) {
                    ctx.moveTo(-s / 4 + i * 20, -s * 1.1);
                    ctx.lineTo(0 + i * 20, -s * 1.3);
                    ctx.lineTo(s / 4 + i * 20, -s * 1.1);
                }
                ctx.moveTo(-s / 2, 0);
                ctx.lineTo(-s * 1.5, 0);
                ctx.lineTo(-s / 2, -s / 4);
            }
            ctx.fill();

            if (creature.species === 'caracal') {
                ctx.beginPath();
                ctx.moveTo(-s / 2.5, -s * 1.4); ctx.lineTo(-s / 2.8, -s * 1.7);
                ctx.moveTo(s / 2.5, -s * 1.4); ctx.lineTo(s / 2.8, -s * 1.7);
                ctx.strokeStyle = outline;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.ellipse(0, -s * 0.68, s * 0.34, s * 0.19, 0, Math.PI, Math.PI * 2);
            ctx.fillStyle = highlightColor;
            ctx.fill();

            ctx.fillStyle = 'white';
            const eyeOpen = creature.blinkTimer <= 0 ? 10 : 1;
            ctx.beginPath();
            ctx.ellipse(-s / 4, -s / 2, 10, eyeOpen, 0, 0, Math.PI * 2);
            ctx.ellipse(s / 4, -s / 2, 10, eyeOpen, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#141414';
            ctx.beginPath();
            ctx.arc(-s / 4, -s / 2, 4, 0, Math.PI * 2);
            ctx.arc(s / 4, -s / 2, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd166';
            ctx.strokeStyle = outline;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -s * 0.45);
            ctx.lineTo(s * 0.22, -s * 0.36);
            ctx.lineTo(0, -s * 0.29);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.fillStyle = creature.state === 'scared' ? '#ffd5e1' : '#fff0f5';
            ctx.ellipse(-s / 2.7, -s / 2.9, 9, 5, -0.2, 0, Math.PI * 2);
            ctx.ellipse(s / 2.7, -s / 2.9, 9, 5, 0.2, 0, Math.PI * 2);
            ctx.globalAlpha = 0.55;
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.strokeStyle = outline;
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (creature.state === 'scared') {
                ctx.arc(0, -s / 3, 7, 0, Math.PI * 2);
            } else {
                ctx.arc(0, -s / 3, 8, 0.1, Math.PI - 0.1);
            }
            ctx.stroke();

            if (creature.state === 'happy') {
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.beginPath();
                ctx.arc(0, -s * 0.45, s * 0.9, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function updateCreature() {
            if (phase !== 'room') return;

            if (creature.blinkTimer > 0) creature.blinkTimer--;
            else if (Math.random() < 0.01) creature.blinkTimer = 10;

            if (creature.state === 'idle') {
                if (Math.random() < 0.02) {
                    creature.state = 'walk';
                    creature.stateTimer = 100 + Math.random() * 100;
                    creature.vx = (Math.random() - 0.5) * 2;
                    creature.faceDir = creature.vx > 0 ? 1 : -1;
                }
            } else if (creature.state === 'walk') {
                creature.x += creature.vx;
                creature.jumpY = Math.abs(Math.sin(time / 5)) * 10;

                if (creature.x < 50 || creature.x > width - 50) {
                    creature.vx *= -1;
                    creature.faceDir *= -1;
                }

                creature.stateTimer--;
                if (creature.stateTimer <= 0) {
                    creature.state = 'idle';
                    creature.jumpY = 0;
                    if (Math.abs(creature.x - width / 2) < 100 && Math.random() < 0.3) {
                        creature.state = 'eat';
                        creature.stateTimer = 60;
                        audio.playSFX('feed');
                    }
                }
            } else if (creature.state === 'eat') {
                creature.jumpY = 0;
                creature.stateTimer--;
                if (creature.stateTimer <= 0) creature.state = 'idle';
            } else if (creature.state === 'scared') {
                creature.stateTimer--;
                if (creature.stateTimer <= 0) creature.state = 'idle';
            } else if (creature.state === 'happy') {
                creature.jumpY = Math.abs(Math.sin(time / 2)) * 20;
                creature.stateTimer--;
                if (creature.stateTimer <= 0) {
                    creature.state = 'idle';
                    creature.jumpY = 0;
                }
            }
        }

        function drawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                ctx.globalAlpha = p.life;
                if (p.type === 'heart') {
                    ctx.fillStyle = p.color || 'red';
                    ctx.font = '20px Rajdhani';
                    ctx.fillText('❤️', p.x, p.y);
                } else if (p.type === 'bubble') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                } else if (p.type === 'feather') {
                    drawFeather(ctx, p.x, p.y, 12, p.color || '#d8f2ff', time / 18 + i, p.life);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, 5, 5);
                }
                ctx.globalAlpha = 1;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function gameLoop() {
            time++;
            ctx.clearRect(0, 0, width, height);

            if (phase === 'lab') {
                drawLab(ctx);
            } else {
                drawRoom(ctx);
                updateCreature();
                drawCreature(ctx);
            }

            drawParticles(ctx);
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('menu', 0);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('lab-controls').classList.remove('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            renderIngredients();
            gameLoop();
        });

        document.getElementById('mix-btn').addEventListener('click', () => {
            audio.playSFX('create', 0);
            phase = 'room';

            creature.species = selectedSpecies;
            creature.color = selectedColor;
            creature.scale = selectedSize;
            creature.x = width / 2;
            creature.y = height * 0.7;
            creature.state = 'idle';

            document.getElementById('lab-controls').classList.add('hidden');
            document.getElementById('play-controls').classList.remove('hidden');
            document.getElementById('interaction-bar').classList.remove('hidden');
            document.getElementById('status-text').innerHTML = "<strong>Nursery</strong> Watch";
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            phase = 'lab';
            audio.playSFX('blocked');
            gifFeedback.classList.add('hidden');
            document.getElementById('lab-controls').classList.remove('hidden');
            document.getElementById('play-controls').classList.add('hidden');
            document.getElementById('interaction-bar').classList.add('hidden');
            document.getElementById('status-text').innerHTML = "<strong>Hatchery</strong> Active";
        });

        document.getElementById('pet-btn').addEventListener('click', () => {
            creature.state = 'happy';
            creature.stateTimer = 60;
            audio.playSFX('pet');
            showGif('affection', 'Sky flapper affection reaction');
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: creature.x, y: creature.y - 50,
                    vx: (Math.random() - 0.5) * 5, vy: -2 - Math.random() * 3,
                    life: 1, type: 'heart'
                });
            }
        });

        document.getElementById('feed-btn').addEventListener('click', () => {
            creature.scale = Math.min(creature.scale + 0.1, 3.0);
            audio.playSFX('feed');
            particles.push({
                x: creature.x, y: creature.y - 50,
                vx: 0, vy: -2,
                life: 1, type: 'heart', color: 'orange'
            });
        });

        document.getElementById('scare-btn').addEventListener('click', () => {
            creature.state = 'scared';
            creature.stateTimer = 40;
            audio.playSFX('scare');
            showGif('scare', 'Sky flapper gust-startle reaction');
            for (let i = 0; i < 9; i++) {
                particles.push({
                    x: creature.x + (Math.random() - 0.5) * 70,
                    y: creature.y - 70 + (Math.random() - 0.5) * 24,
                    vx: 1.5 + Math.random() * 3,
                    vy: -1.5 + Math.random() * 3,
                    life: 0.9,
                    type: 'feather',
                    color: i % 2 ? '#d8f2ff' : '#7ef2ff'
                });
            }
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (phase !== 'room') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dx = x - creature.x;
            const dy = y - (creature.y - 50);
            if (Math.sqrt(dx * dx + dy * dy) < 100 * creature.scale) {
                document.getElementById('pet-btn').click();
            }
        });
    });
    </script>
</body>
</html>
