<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Brainrot MamaVerse 3D Card Lab</title>
    <!-- [agent-note][stage4] repaired: approved-font-remap | title-ui: Orbitron | body-ui: Rajdhani -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-night: #16071f;
            --bg-deep: #321246;
            --bg-panel: rgba(72, 30, 82, 0.84);
            --bg-panel-soft: rgba(255, 218, 235, 0.18);
            --line-soft: rgba(255, 241, 220, 0.26);
            --line-bright: rgba(255, 209, 102, 0.78);
            --text-main: #fff8fb;
            --text-muted: #ffd4e6;
            --accent-cyan: #7ef2ff;
            --accent-violet: #8d55ff;
            --accent-pink: #ff63b6;
            --accent-lime: #7dffb0;
            --accent-gold: #ffd166;
            --accent-rose: #ff8aa8;
            --danger: #ff6a8b;
            --shadow-glow: 0 0 26px rgba(255, 99, 182, 0.22), 0 0 18px rgba(255, 209, 102, 0.12);
            --panel-radius: 24px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 20% 8%, rgba(255, 209, 102, 0.18), transparent 28%),
                radial-gradient(circle at 78% 12%, rgba(255, 99, 182, 0.18), transparent 30%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-night));
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 209, 102, 0.14), transparent 18%),
                radial-gradient(circle at 78% 22%, rgba(255, 99, 182, 0.16), transparent 20%),
                repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 18px);
            opacity: 0.9;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hidden { display: none !important; }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(6, 6, 18, 0.35), rgba(7, 4, 18, 0.15));
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            pointer-events: auto;
            z-index: 50;
            background:
                radial-gradient(circle at 50% 34%, rgba(255, 209, 102, 0.18), rgba(255, 99, 182, 0.08) 32%, rgba(0, 0, 0, 0.76)),
                linear-gradient(180deg, rgba(42, 9, 47, 0.58), rgba(18, 3, 28, 0.92));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .glass-panel {
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 241, 220, 0.14), transparent 36%),
                linear-gradient(180deg, rgba(96, 34, 97, 0.88), rgba(45, 16, 62, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line-soft);
            box-shadow:
                inset 0 1px 0 rgba(255, 248, 251, 0.12),
                0 10px 32px rgba(49, 8, 48, 0.38),
                var(--shadow-glow);
        }

        .intro-card {
            width: min(100%, 420px);
            border-radius: 28px;
            padding: 26px 22px 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-top: 4px solid var(--accent-gold);
        }

        .intro-card::before,
        .intro-card::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(8px);
            opacity: 0.45;
            pointer-events: none;
        }

        .intro-card::before {
            width: 140px;
            height: 140px;
            top: -30px;
            left: -30px;
            background: radial-gradient(circle, rgba(126, 242, 255, 0.65), transparent 68%);
        }

        .intro-card::after {
            width: 180px;
            height: 180px;
            right: -45px;
            bottom: -55px;
            background: radial-gradient(circle, rgba(255, 99, 182, 0.5), transparent 70%);
        }

        .lab-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            margin-bottom: 12px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #fff7c7;
            background: linear-gradient(90deg, rgba(255, 99, 182, 0.18), rgba(255, 209, 102, 0.14));
            border: 1px solid rgba(255, 209, 102, 0.36);
            box-shadow: inset 0 0 10px rgba(255, 209, 102, 0.1);
        }

        .title-display,
        .font-display {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }

        .title-display {
            margin: 0 0 8px;
            font-size: clamp(34px, 9vw, 56px);
            line-height: 0.96;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: transparent;
            background: linear-gradient(90deg, var(--accent-gold), #fff1dc 34%, var(--accent-pink) 70%, var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 16px rgba(126, 242, 255, 0.2));
        }

        .subtitle {
            margin: 0 0 16px;
            color: var(--text-muted);
            font-size: 20px;
            font-weight: 600;
        }

        .safety-note {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 106, 139, 0.26);
            background: linear-gradient(180deg, rgba(100, 20, 41, 0.28), rgba(45, 11, 24, 0.22));
            color: #ffd9e4;
            font-size: 13px;
            line-height: 1.35;
            box-shadow: inset 0 0 18px rgba(255, 106, 139, 0.08);
        }

        .start-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 18px;
            color: #091019;
            background: linear-gradient(90deg, var(--accent-gold), #ff8aa8 48%, var(--accent-pink));
            box-shadow: 0 16px 30px rgba(255, 99, 182, 0.28), inset 0 1px 0 rgba(255,255,255,0.28);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 24px;
            letter-spacing: 0.06em;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .start-btn:hover,
        .start-btn:active {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.05);
            box-shadow: 0 18px 34px rgba(86, 122, 255, 0.34);
        }

        .start-btn:active,
        .btn-option:active,
        .mix-btn:active,
        .pill-btn:active,
        .reset-btn:active {
            transform: scale(0.97);
        }

        .floating { animation: float 3s ease-in-out infinite; }

        .spark-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 2px 0 16px;
            opacity: 0.85;
            font-size: 20px;
        }

        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            max-width: min(58vw, 220px);
            color: var(--text-main);
            pointer-events: none;
        }

        .hud-status {
            padding: 9px 12px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background:
                radial-gradient(circle at 0% 0%, rgba(255, 209, 102, 0.14), transparent 42%),
                linear-gradient(180deg, rgba(88, 30, 86, 0.9), rgba(42, 13, 58, 0.84));
            border: 1px solid rgba(255, 209, 102, 0.22);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hud-status strong {
            color: var(--accent-gold);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        /* [agent-note][stage2] preserve: control-zone | reason: bottom action strip already mobile-safe */
        .lab-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(180deg, rgba(22, 7, 31, 0), rgba(43, 13, 47, 0.82) 18%, rgba(23, 7, 32, 0.96));
        }

        .category-strip {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .category-pill {
            padding: 8px 12px;
            border-radius: 999px;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background:
                radial-gradient(circle at 25% 0%, rgba(255, 209, 102, 0.2), transparent 38%),
                linear-gradient(180deg, rgba(104, 38, 102, 0.92), rgba(44, 14, 60, 0.86));
            border: 1px solid rgba(255, 209, 102, 0.22);
            box-shadow: inset 0 0 10px rgba(255, 99, 182, 0.09);
        }

        .ingredient-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 2px 4px 4px;
            scroll-snap-type: x proximity;
        }

        .ingredient-list::-webkit-scrollbar { height: 6px; }
        .ingredient-list::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, rgba(126, 242, 255, 0.65), rgba(173, 118, 255, 0.65));
            border-radius: 999px;
        }

        .btn-option {
            position: relative;
            min-width: 82px;
            height: 86px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            border-radius: 18px;
            color: var(--text-main);
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            border: 1px solid rgba(255, 241, 220, 0.18);
            background:
                radial-gradient(circle at 28% 18%, rgba(255, 241, 220, 0.15), transparent 28%),
                linear-gradient(180deg, rgba(96, 34, 97, 0.9), rgba(42, 13, 58, 0.94));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 18px rgba(34, 7, 43, 0.22);
        }

        .btn-option .icon {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.14));
        }

        .btn-option .label {
            font-size: 12px;
            line-height: 1;
            font-weight: 700;
        }

        .btn-option:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 209, 102, 0.52);
        }

        .btn-selected {
            border: 2px solid var(--line-bright);
            background:
                radial-gradient(circle at 30% 20%, rgba(255, 241, 220, 0.22), transparent 28%),
                linear-gradient(180deg, rgba(132, 48, 112, 0.98), rgba(70, 21, 82, 0.98));
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.1),
                0 0 18px rgba(255, 209, 102, 0.22);
        }

        .btn-selected::after {
            content: "✓";
            position: absolute;
            top: 6px;
            right: 8px;
            width: 18px;
            height: 18px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: rgba(255, 209, 102, 0.18);
            color: var(--accent-gold);
            font-size: 12px;
            font-weight: 700;
        }

        .divider {
            width: 2px;
            height: 58px;
            align-self: center;
            flex: 0 0 auto;
            border-radius: 999px;
            background: linear-gradient(180deg, transparent, rgba(255,209,102,0.34), transparent);
            margin: 0 1px;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }

        .mix-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            min-width: min(88vw, 320px);
            border-radius: 999px;
            color: #08130b;
            background: linear-gradient(90deg, #7dffb0, #ffd166 45%, #ff63b6);
            box-shadow: 0 0 24px rgba(255, 209, 102, 0.3), inset 0 1px 0 rgba(255,255,255,0.22);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 22px;
            letter-spacing: 0.05em;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        }

        .mix-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .mix-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .play-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reset-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            color: var(--text-main);
            background:
                radial-gradient(circle at 30% 0%, rgba(255, 209, 102, 0.12), transparent 42%),
                linear-gradient(180deg, rgba(96, 34, 97, 0.92), rgba(45, 16, 62, 0.92));
            border: 1px solid rgba(255, 241, 220, 0.18);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
            font-size: 14px;
            font-weight: 700;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .reset-btn:hover {
            background: linear-gradient(180deg, rgba(125, 45, 111, 0.95), rgba(55, 18, 70, 0.96));
        }

        .interaction-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            padding: 0 12px calc(env(safe-area-inset-bottom, 0px));
            pointer-events: auto;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 92px;
            padding: 11px 16px;
            border-radius: 999px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .pill-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .pill-pet { background: linear-gradient(90deg, #8d55ff, #ff63b6); }
        .pill-feed { background: linear-gradient(90deg, #fb923c, #ffd166); color: #2b1600; }
        .pill-scare { background: linear-gradient(90deg, #ff6a8b, #ffb3c7); color: #32121f; }

        .spark-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: rgba(126, 242, 255, 0.08);
            box-shadow: inset 0 0 8px rgba(126, 242, 255, 0.16);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 640px) {
            .intro-card { padding: 22px 18px 18px; }
            .subtitle { font-size: 18px; }
            .lab-controls { gap: 8px; padding-top: 10px; }
            .category-pill { font-size: 11px; padding: 7px 11px; }
            .btn-option { min-width: 76px; height: 82px; border-radius: 16px; }
            .mix-btn { min-width: 100%; font-size: 20px; padding: 12px 16px; }
            .play-controls { top: 10px; right: 10px; }
            .interaction-bar { gap: 8px; bottom: 14px; }
            .pill-btn {
                flex: 1 1 calc(33.333% - 8px);
                min-width: 0;
                padding: 11px 10px;
                font-size: 14px;
            }
            .hud { top: 10px; left: 10px; max-width: calc(100vw - 132px); }
            .hud-status { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-root">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: affection/scare feedback -> catalogs/gifs.json lightweight HUD overlays -->
        <div id="gif-feedback" class="hidden" aria-live="polite" style="position:absolute;top:76px;right:12px;z-index:40;pointer-events:none;width:min(30vw,120px);">
            <img id="gif-feedback-img" alt="" style="display:block;width:100%;border-radius:18px;border:1px solid rgba(255,255,255,0.16);box-shadow:0 10px 22px rgba(0,0,0,0.24);background:rgba(8,8,20,0.55);">
        </div>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="overlay-screen">
                <div class="glass-panel intro-card">
                    <div class="lab-badge floating"><span>💐</span><span>MamaVerse Meme Forge</span></div>
                    <div class="spark-row" aria-hidden="true"><span>💖</span><span>🎀</span><span>✨</span></div>
                    <h1 class="title-display">MAMA LAB</h1>
                    <p class="subtitle">Mix meme-pet DNA, gift-wrap aura, and charm size to hatch a Mom-approved pocket gremlin.</p>
                    <div class="safety-note">
                        💌 MOM'S DAY NOTE:<br>Boo is only a silly sticker prank. No creatures get hurt.
                    </div>
                    <button id="start-btn" class="start-btn">
                        <span>START CARD</span>
                        <span class="spark-chip" aria-hidden="true">⚗️</span>
                    </button>
                </div>
            </div>

            <div id="lab-controls" class="lab-controls hidden">
                <div class="category-strip">
                    <div class="glass-panel category-pill">1. Meme Pet</div>
                    <div class="glass-panel category-pill">2. Aura</div>
                    <div class="glass-panel category-pill">3. Charm</div>
                </div>

                <div class="ingredient-list" id="ingredient-list">
                </div>

                <div class="action-bar">
                    <button id="mix-btn" class="mix-btn">MAKE MOM PET</button>
                </div>
            </div>

            <div id="play-controls" class="play-controls hidden">
                <button id="reset-btn" class="reset-btn glass-panel">💌 New Card</button>
            </div>

            <div id="interaction-bar" class="interaction-bar hidden">
                <button id="pet-btn" class="pill-btn pill-pet">🤗 Hug</button>
                <button id="feed-btn" class="pill-btn pill-feed">🍰 Love Snack</button>
                <button id="scare-btn" class="pill-btn pill-scare">🎉 Confetti Boo</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: top-left compact status is already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-status glass-panel" id="status-text"><strong>Mama Lab</strong> Pick 3</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                create: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                pet: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                feed: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                scare: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                menu: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3"
            },
            gifs: {
                affection: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                scare: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    audio.volume = k === 'ui' ? 0.4 : 0.55;
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                this.ready = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((sound) => sound.load());
            }
            playBGM() {
                if (!this.ready) return;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, debounceMs = 120) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
                this.lastPlayedAt[key] = now;
                const sound = this.sfx[key].cloneNode();
                sound.volume = this.sfx[key].volume;
                sound.play().catch(() => {});
            }
        }
        const audio = new AudioController();
        const gifFeedback = document.getElementById('gif-feedback');
        const gifFeedbackImg = document.getElementById('gif-feedback-img');
        let gifFeedbackTimer = null;

        function showGif(type, altText) {
            const src = ASSETS.gifs[type];
            if (!src) return;
            gifFeedbackImg.src = src;
            gifFeedbackImg.alt = altText;
            gifFeedback.classList.remove('hidden');
            clearTimeout(gifFeedbackTimer);
            gifFeedbackTimer = setTimeout(() => gifFeedback.classList.add('hidden'), 1800);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        let phase = 'lab';
        let time = 0;

        let selectedSpecies = 'fox';
        let selectedColor = '#ff7e21';
        let selectedSize = 1.0;
        let cauldronColor = '#2d1b4e';
        let particles = [];

        let creature = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            species: 'fox',
            color: '#ff7e21',
            scale: 1.0,
            state: 'idle',
            stateTimer: 0,
            blinkTimer: 0,
            jumpY: 0,
            faceDir: 1
        };

        const SPECIES = [
            { id: 'fox', icon: '🦊', name: 'Fox Meme', aura: '#ff9d3c' },
            { id: 'cat', icon: '🐱', name: 'Cat Baby', aura: '#78f2ff' },
            { id: 'dog', icon: '🐶', name: 'Doggo', aura: '#ffe17d' },
            { id: 'dino', icon: '🦖', name: 'Dino Tot', aura: '#7dffb0' },
            { id: 'caracal', icon: '🐯', name: 'Caracal', aura: '#ff7ea5' }
        ];

        const COLORS = [
            { id: '#ef4444', icon: '🍓', name: 'Berry' },
            { id: '#f97316', icon: '🍊', name: 'Citrus' },
            { id: '#eab308', icon: '🌻', name: 'Sunmom' },
            { id: '#22c55e', icon: '🌿', name: 'Mint' },
            { id: '#3b82f6', icon: '💧', name: 'Sky' },
            { id: '#a855f7', icon: '🍇', name: 'Grape' },
            { id: '#ec4899', icon: '🍉', name: 'Melon' },

        const SIZES = [
            { val: 0.5, icon: '👶', name: 'Pocket' },

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (phase === 'room') {
                creature.y = height * 0.7;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        const listEl = document.getElementById('ingredient-list');

        function renderIngredients() {
            listEl.innerHTML = '';

            const createSection = (items, type) => {
                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-option glass-panel';
                    btn.innerHTML = `<span class="icon">${item.icon}</span><span class="label">${item.name}</span>`;

                    let isSelected = false;
                    if (type === 'species' && selectedSpecies === item.id) isSelected = true;
                    if (type === 'color' && selectedColor === item.id) isSelected = true;
                    if (type === 'size' && selectedSize === item.val) isSelected = true;

                    if (isSelected) btn.classList.add('btn-selected');

                    btn.onclick = () => {
                        audio.playSFX('ui');
                        if (type === 'species') selectedSpecies = item.id;
                        if (type === 'color') {
                            selectedColor = item.id;
                            cauldronColor = item.id === '#f472b6' ? '#ff00ff' : item.id;
                        }
                        if (type === 'size') selectedSize = item.val;

                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: width / 2,
                                y: height / 2 - 100,
                                vx: (Math.random() - 0.5) * 10,
                                vy: (Math.random() - 0.5) * 10,
                                life: 1.0,
                                color: type === 'color' ? item.id : '#fff'
                            });
                        }
                        renderIngredients();
                    };
                    listEl.appendChild(btn);
                });

                const div = document.createElement('div');
                div.className = 'divider';
                listEl.appendChild(div);
            };

            createSection(SPECIES, 'species');
            createSection(COLORS, 'color');
            createSection(SIZES, 'size');

            const lastDivider = listEl.lastElementChild;
            if (lastDivider && lastDivider.classList.contains('divider')) {
                lastDivider.remove();
            }
        }

        function roundRectPath(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
        }

        function drawHeartIcon(ctx, x, y, size, color, alpha = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size / 32, size / 32);
            ctx.globalAlpha *= alpha;
            ctx.beginPath();
            ctx.moveTo(0, 10);
            ctx.bezierCurveTo(-22, -8, -2, -22, 0, -8);
            ctx.bezierCurveTo(2, -22, 22, -8, 0, 10);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function drawFlower(ctx, x, y, size, petalColor, centerColor = '#ffd166', alpha = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha *= alpha;
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI * 2 / 6) * i + time / 260;
                ctx.beginPath();
                ctx.ellipse(Math.cos(a) * size * 0.42, Math.sin(a) * size * 0.42, size * 0.24, size * 0.42, a, 0, Math.PI * 2);
                ctx.fillStyle = petalColor;
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = centerColor;
            ctx.fill();
            ctx.restore();
        }

        function drawRibbon(ctx, x, y, w, h, color, alpha = 1) {
            ctx.save();
            ctx.globalAlpha *= alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x + w * 0.25, y - h * 0.42, x + w * 0.75, y + h * 0.42, x + w, y);
            ctx.lineTo(x + w * 0.88, y + h);
            ctx.bezierCurveTo(x + w * 0.62, y + h * 0.55, x + w * 0.36, y + h * 0.55, x + w * 0.12, y + h);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawGiftBox(ctx, x, y, w, h, fill, ribbon = '#ffd166', alpha = 1) {
            ctx.save();
            ctx.globalAlpha *= alpha;
            roundRectPath(ctx, x, y, w, h, Math.min(10, w * 0.16));
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,248,251,0.72)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = ribbon;
            ctx.fillRect(x + w * 0.43, y, w * 0.14, h);
            ctx.fillRect(x, y + h * 0.28, w, h * 0.14);
            ctx.beginPath();
            ctx.ellipse(x + w * 0.43, y - h * 0.04, w * 0.18, h * 0.14, -0.35, 0, Math.PI * 2);
            ctx.ellipse(x + w * 0.57, y - h * 0.04, w * 0.18, h * 0.14, 0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawStickerDrift(ctx, mood = 'lab') {
            const motifs = mood === 'room' ? ['💖', 'MOM', '💐', '✨', '🎀', 'LOL'] : ['💌', '💖', '✦', 'MAMA', '🎀', '💐'];
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < 16; i++) {
                const lane = (i + 0.5) / 16;
                const x = lane * width + Math.sin(time / (42 + i) + i * 1.7) * 26;
                const y = ((time * (0.16 + i * 0.018) + i * 89) % (height + 90)) - 45;
                const pulse = 0.55 + Math.sin(time / 35 + i) * 0.18;
                ctx.globalAlpha = pulse * (mood === 'room' ? 0.42 : 0.5);
                ctx.font = `${16 + (i % 4) * 3}px Rajdhani`;
                ctx.fillStyle = i % 3 === 0 ? '#ffd166' : i % 3 === 1 ? '#ff8aa8' : '#7ef2ff';
                ctx.fillText(motifs[i % motifs.length], x, y);
            }
            ctx.restore();
        }

        // [agent-note][world-design-superprompt] visuals: evolved into Mama's Bouquet Bench; preserve canvas loop and selection semantics.
        function drawLab(ctx) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#3c1453');
            grad.addColorStop(0.46, '#ffd6e8');
            grad.addColorStop(1, '#ffefcf');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.5, height * 0.3, 20, width * 0.5, height * 0.3, width * 0.55);
            glow.addColorStop(0, 'rgba(255,209,102,0.28)');
            glow.addColorStop(0.45, 'rgba(255,99,182,0.14)');
            glow.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            drawStickerDrift(ctx, 'lab');

            const tableY = height * 0.58;
            const tableGrad = ctx.createLinearGradient(0, tableY, 0, height);
            tableGrad.addColorStop(0, '#fff1dc');
            tableGrad.addColorStop(0.42, '#ffcfdf');
            tableGrad.addColorStop(1, '#b45bd2');
            ctx.fillStyle = tableGrad;
            ctx.fillRect(0, tableY, width, height - tableY);

            ctx.strokeStyle = 'rgba(120,39,121,0.14)';
            ctx.lineWidth = 2;
            for (let i = -width; i < width * 2; i += 54) {
                ctx.beginPath();
                ctx.moveTo(i + (time % 54) * 0.08, tableY);
                ctx.lineTo(i + 130, height);
                ctx.stroke();
            }

            drawRibbon(ctx, -20, tableY + 10, width * 0.42, 28, 'rgba(255,99,182,0.28)', 0.9);
            drawRibbon(ctx, width * 0.62, tableY + 42, width * 0.42, 26, 'rgba(126,242,255,0.24)', 0.9);
            drawFlower(ctx, width * 0.18, tableY - 20 + Math.sin(time / 45) * 4, 34, '#ff8aa8', '#ffd166', 0.82);
            drawFlower(ctx, width * 0.84, tableY + 8 + Math.sin(time / 52) * 4, 28, '#7dffb0', '#ff63b6', 0.72);

            const cx = width / 2;
            const cy = height / 2 + 50;
            const radius = Math.min(104, width * 0.24);

            ctx.save();
            ctx.translate(cx, cy - 122);
            ctx.rotate(Math.sin(time / 90) * 0.03);
            roundRectPath(ctx, -118, -44, 236, 88, 18);
            ctx.fillStyle = 'rgba(255,248,251,0.74)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,99,182,0.54)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#8a255d';
            ctx.font = '700 18px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('MOM CARD DNA', 0, -8);
            ctx.font = '700 13px Rajdhani';
            ctx.fillText('pick pet • aura • charm', 0, 18);
            drawHeartIcon(ctx, -84, -6, 24, '#ff63b6', 0.95);
            drawHeartIcon(ctx, 84, -6, 24, '#ffd166', 0.95);
            ctx.restore();

            ctx.beginPath();
            ctx.ellipse(cx, cy - 62, radius + 30, 48, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,209,102,0.16)';
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(cx, cy - 60, radius + 8, 33, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#fff1dc';
            ctx.fill();
            ctx.strokeStyle = '#ff8aa8';
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(cx, cy - 50, radius - 9, 24, 0, 0, Math.PI * 2);
            ctx.fillStyle = cauldronColor;
            ctx.shadowColor = cauldronColor;
            ctx.shadowBlur = 28;
            ctx.fill();
            ctx.shadowBlur = 0;

            if (Math.random() < 0.1) {
                particles.push({
                    x: cx + (Math.random() - 0.5) * 100,
                    y: cy - 58,
                    vx: (Math.random() - 0.5) * 0.55,
                    vy: -1.45 - Math.random() * 0.8,
                    life: 0.55 + Math.random() * 0.55,
                    color: Math.random() < 0.5 ? '#ff63b6' : '#ffd166',
                    type: Math.random() < 0.55 ? 'heart' : 'bubble'
                });
            }

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI, false);
            ctx.lineTo(cx - radius, cy - 60);
            ctx.bezierCurveTo(cx - radius, cy + 100, cx + radius, cy + 100, cx + radius, cy - 60);
            const potGrad = ctx.createLinearGradient(cx, cy - 80, cx, cy + 120);
            potGrad.addColorStop(0, '#ff8aa8');
            potGrad.addColorStop(0.42, '#8d55ff');
            potGrad.addColorStop(1, '#321246');
            ctx.fillStyle = potGrad;
            ctx.fill();
            ctx.strokeStyle = '#fff1dc';
            ctx.lineWidth = 5;
            ctx.globalAlpha = 0.9;
            ctx.stroke();
            ctx.globalAlpha = 1;

            drawHeartIcon(ctx, cx - radius * 0.58, cy + 18, 28, '#fff1dc', 0.82);
            drawHeartIcon(ctx, cx + radius * 0.56, cy + 18, 24, '#ffd166', 0.82);

            ctx.beginPath();
            ctx.ellipse(cx, cy - 60, radius, 30, 0, 0, Math.PI, false);
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.75;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.fillStyle = 'rgba(255, 209, 102, 0.32)';
            ctx.fillRect(cx - radius - 18, cy + 24, radius * 2 + 36, 8);
        }

        // [agent-note][world-design-superprompt] visuals: evolved into Mom's Day Parade / Hypercard room; controls and tap target remain clear.
        function drawRoom(ctx) {
            const wallGrad = ctx.createLinearGradient(0, 0, 0, height);
            wallGrad.addColorStop(0, '#fff7fe');
            wallGrad.addColorStop(0.44, '#ffe0ee');
            wallGrad.addColorStop(1, '#f8d49b');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, width, height);

            const portal = ctx.createRadialGradient(width * 0.72, height * 0.28, 12, width * 0.72, height * 0.28, Math.min(width, height) * 0.42);
            portal.addColorStop(0, 'rgba(126,242,255,0.38)');
            portal.addColorStop(0.35, 'rgba(255,99,182,0.18)');
            portal.addColorStop(0.72, 'rgba(255,209,102,0.08)');
            portal.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = portal;
            ctx.fillRect(0, 0, width, height);

            drawStickerDrift(ctx, 'room');

            const bannerY = Math.max(64, height * 0.11);
            ctx.save();
            ctx.translate(width / 2, bannerY);
            ctx.rotate(Math.sin(time / 80) * 0.02);
            roundRectPath(ctx, -Math.min(160, width * 0.38), -22, Math.min(320, width * 0.76), 44, 18);
            ctx.fillStyle = 'rgba(255,248,251,0.78)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,99,182,0.42)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#7b2457';
            ctx.font = '700 16px Orbitron';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('MOM ENERGY PARADE', 0, 0);
            drawHeartIcon(ctx, -Math.min(128, width * 0.3), 0, 18, '#ff63b6', 0.9);
            drawHeartIcon(ctx, Math.min(128, width * 0.3), 0, 18, '#ffd166', 0.9);
            ctx.restore();

            const floorY = height * 0.7;
            const floorGrad = ctx.createLinearGradient(0, floorY, 0, height);
            floorGrad.addColorStop(0, '#fff1dc');
            floorGrad.addColorStop(0.35, '#ffb3c7');
            floorGrad.addColorStop(1, '#8d55ff');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, floorY, width, height - floorY);

            for (let i = 0; i < width; i += 46) {
                ctx.strokeStyle = 'rgba(98, 31, 98, 0.11)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(i, floorY);
                ctx.lineTo(i - 18, height);
                ctx.stroke();
            }

            drawGiftBox(ctx, width * 0.08, floorY - 48, 48, 42, '#ff63b6', '#ffd166', 0.85);
            drawGiftBox(ctx, width * 0.82, floorY - 42, 44, 38, '#7ef2ff', '#ff8aa8', 0.78);
            drawFlower(ctx, width * 0.14, floorY - 92, 30, '#ff8aa8', '#ffd166', 0.85);
            drawFlower(ctx, width * 0.89, floorY - 88, 26, '#7dffb0', '#ff63b6', 0.72);

            ctx.save();
            ctx.translate(width / 2, floorY + 50);
            ctx.scale(1, 0.3);
            ctx.beginPath();
            ctx.arc(0, 0, 205, 0, Math.PI * 2);
            const rugGrad = ctx.createLinearGradient(-205, 0, 205, 0);
            rugGrad.addColorStop(0, '#ffd166');
            rugGrad.addColorStop(0.45, '#ff63b6');
            rugGrad.addColorStop(1, '#7ef2ff');
            ctx.fillStyle = rugGrad;
            ctx.globalAlpha = 0.76;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 10;
            ctx.globalAlpha = 0.54;
            ctx.stroke();
            ctx.globalAlpha = 1;

            if (creature.state === 'eat') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(150, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            }
            ctx.restore();

            const winX = Math.max(32, width * 0.07);
            const winY = Math.max(110, height * 0.18);
            const winW = Math.min(204, width * 0.32);
            const winH = Math.min(166, height * 0.22);
            const skyGrad = ctx.createLinearGradient(winX, winY, winX, winY + winH);
            skyGrad.addColorStop(0, '#78d8ff');
            skyGrad.addColorStop(1, '#fff1dc');
            roundRectPath(ctx, winX, winY, winW, winH, 18);
            ctx.fillStyle = skyGrad;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.72)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(winX + winW / 2, winY + 6);
            ctx.lineTo(winX + winW / 2, winY + winH - 6);
            ctx.moveTo(winX + 6, winY + winH / 2);
            ctx.lineTo(winX + winW - 6, winY + winH / 2);
            ctx.stroke();

            drawFlower(ctx, winX + winW * 0.74, winY + winH * 0.3, 16, '#ffffff', '#ffd166', 0.82);
        }

        function drawCreature(ctx) {
            const cx = creature.x;
            const cy = creature.y - creature.jumpY;
            const s = creature.scale * 100;
            const color = creature.color === '#f472b6' ? `hsl(${time * 50 % 360}, 78%, 63%)` : creature.color;
            const outline = 'rgba(14, 15, 35, 0.85)';
            const highlightColor = creature.color === '#1f2937' ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.22)';

            ctx.save();
            ctx.translate(cx, cy);

            if (creature.state === 'scared') {
                ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
            }

            ctx.scale(creature.faceDir, 1);

            const breath = Math.sin(time / 10) * 5;
            const bounceScale = creature.state === 'happy' ? 1.04 : 1;

            ctx.fillStyle = 'rgba(49, 18, 48, 0.22)';
            ctx.beginPath();
            ctx.ellipse(0, s * 0.1, s * 0.9, s * 0.22, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = color;
            ctx.shadowBlur = 22;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, -s / 2, (s / 1.2) * bounceScale, (s / 1.5 + breath) * bounceScale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = outline;
            ctx.lineWidth = Math.max(4, s * 0.045);
            ctx.stroke();

            ctx.lineWidth = 4;
            ctx.strokeStyle = outline;

            ctx.fillStyle = color;
            ctx.beginPath();
            if (creature.species === 'fox') {
                ctx.moveTo(-s / 2, -s); ctx.lineTo(-s / 4, -s * 1.5); ctx.lineTo(0, -s);
                ctx.moveTo(s / 2, -s); ctx.lineTo(s / 4, -s * 1.5); ctx.lineTo(0, -s);
                ctx.moveTo(-s / 2, -s / 2);
                ctx.quadraticCurveTo(-s * 1.5, -s / 2, -s * 1.2, 0);
                ctx.quadraticCurveTo(-s / 2, 0, -s / 2, -s / 2);
            } else if (creature.species === 'cat' || creature.species === 'caracal') {
                ctx.moveTo(-s / 2, -s); ctx.lineTo(-s / 2.5, -s * 1.4); ctx.lineTo(-s / 4, -s);
                ctx.moveTo(s / 2, -s); ctx.lineTo(s / 2.5, -s * 1.4); ctx.lineTo(s / 4, -s);
                ctx.moveTo(-s / 2, -s / 4);
                ctx.bezierCurveTo(-s * 1.2, -s, -s * 1.2, 0, -s / 2, 0);
            } else if (creature.species === 'dog') {
                ctx.ellipse(-s / 2, -s / 2, s / 4, s / 2, 0.5, 0, Math.PI * 2);
                ctx.ellipse(s / 2, -s / 2, s / 4, s / 2, -0.5, 0, Math.PI * 2);
                const wag = Math.sin(time / 2) * 20;
                ctx.moveTo(-s / 2, -s / 4);
                ctx.lineTo(-s + wag, -s / 2);
                ctx.lineTo(-s / 2, 0);
            } else if (creature.species === 'dino') {
                for (let i = 0; i < 3; i++) {
                    ctx.moveTo(-s / 4 + i * 20, -s * 1.1);
                    ctx.lineTo(0 + i * 20, -s * 1.3);
                    ctx.lineTo(s / 4 + i * 20, -s * 1.1);
                }
                ctx.moveTo(-s / 2, 0);
                ctx.lineTo(-s * 1.5, 0);
                ctx.lineTo(-s / 2, -s / 4);
            }
            ctx.fill();

            if (creature.species === 'caracal') {
                ctx.beginPath();
                ctx.moveTo(-s / 2.5, -s * 1.4); ctx.lineTo(-s / 2.8, -s * 1.7);
                ctx.moveTo(s / 2.5, -s * 1.4); ctx.lineTo(s / 2.8, -s * 1.7);
                ctx.strokeStyle = outline;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.ellipse(0, -s * 0.68, s * 0.34, s * 0.19, 0, Math.PI, Math.PI * 2);
            ctx.fillStyle = highlightColor;
            ctx.fill();

            ctx.save();
            ctx.rotate(-0.08);
            roundRectPath(ctx, -s * 0.28, -s * 1.04, s * 0.56, s * 0.16, s * 0.08);
            ctx.fillStyle = 'rgba(255,241,220,0.9)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(50,18,31,0.5)';
            ctx.lineWidth = Math.max(1.5, s * 0.018);
            ctx.stroke();
            ctx.fillStyle = '#8a255d';
            ctx.font = `700 ${Math.max(9, s * 0.08)}px Rajdhani`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('MOM', 0, -s * 0.96);
            ctx.restore();

            drawHeartIcon(ctx, s * 0.38, -s * 0.72, Math.max(18, s * 0.2), '#ffd166', 0.94);
            drawFlower(ctx, -s * 0.42, -s * 0.74, Math.max(13, s * 0.16), '#ff8aa8', '#ffd166', 0.92);

            if (creature.scale >= 1.5) {
                ctx.save();
                ctx.translate(0, -s * 1.22);
                ctx.fillStyle = 'rgba(255,209,102,0.92)';
                ctx.beginPath();
                ctx.moveTo(-s * 0.28, s * 0.04);
                ctx.lineTo(-s * 0.18, -s * 0.18);
                ctx.lineTo(-s * 0.04, s * 0.02);
                ctx.lineTo(s * 0.1, -s * 0.2);
                ctx.lineTo(s * 0.24, s * 0.04);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(50,18,31,0.55)';
                ctx.lineWidth = Math.max(1.5, s * 0.018);
                ctx.stroke();
                ctx.restore();
            }

            ctx.fillStyle = 'white';
            const eyeOpen = creature.blinkTimer <= 0 ? 10 : 1;
            ctx.beginPath();
            ctx.ellipse(-s / 4, -s / 2, 10, eyeOpen, 0, 0, Math.PI * 2);
            ctx.ellipse(s / 4, -s / 2, 10, eyeOpen, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#141414';
            ctx.beginPath();
            ctx.arc(-s / 4, -s / 2, 4, 0, Math.PI * 2);
            ctx.arc(s / 4, -s / 2, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = creature.state === 'scared' ? '#ffd5e1' : '#fff0f5';
            ctx.ellipse(-s / 2.7, -s / 2.9, 9, 5, -0.2, 0, Math.PI * 2);
            ctx.ellipse(s / 2.7, -s / 2.9, 9, 5, 0.2, 0, Math.PI * 2);
            ctx.globalAlpha = 0.55;
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.strokeStyle = outline;
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (creature.state === 'scared') {
                ctx.arc(0, -s / 3, 7, 0, Math.PI * 2);
            } else {
                ctx.arc(0, -s / 3, 8, 0.1, Math.PI - 0.1);
            }
            ctx.stroke();

            if (creature.state === 'happy') {
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.beginPath();
                ctx.arc(0, -s * 0.45, s * 0.9, 0, Math.PI * 2);
                ctx.fill();
                for (let i = 0; i < 5; i++) {
                    const a = time / 16 + i * Math.PI * 0.4;
                    drawHeartIcon(ctx, Math.cos(a) * s * 0.86, -s * 0.55 + Math.sin(a) * s * 0.5, Math.max(12, s * 0.13), i % 2 ? '#ff63b6' : '#ffd166', 0.55);
                }
            }

            if (creature.state === 'scared') {
                ctx.fillStyle = '#ff6a8b';
                ctx.font = `700 ${Math.max(18, s * 0.18)}px Orbitron`;
                ctx.textAlign = 'center';
                ctx.fillText('BOO!', 0, -s * 1.42);
            }

            ctx.restore();
        }

        function updateCreature() {
            if (phase !== 'room') return;

            if (creature.blinkTimer > 0) creature.blinkTimer--;
            else if (Math.random() < 0.01) creature.blinkTimer = 10;

            if (creature.state === 'idle') {
                if (Math.random() < 0.02) {
                    creature.state = 'walk';
                    creature.stateTimer = 100 + Math.random() * 100;
                    creature.vx = (Math.random() - 0.5) * 2;
                    creature.faceDir = creature.vx > 0 ? 1 : -1;
                }
            } else if (creature.state === 'walk') {
                creature.x += creature.vx;
                creature.jumpY = Math.abs(Math.sin(time / 5)) * 10;

                if (creature.x < 50 || creature.x > width - 50) {
                    creature.vx *= -1;
                    creature.faceDir *= -1;
                }

                creature.stateTimer--;
                if (creature.stateTimer <= 0) {
                    creature.state = 'idle';
                    creature.jumpY = 0;
                    if (Math.abs(creature.x - width / 2) < 100 && Math.random() < 0.3) {
                        creature.state = 'eat';
                        creature.stateTimer = 60;
                        audio.playSFX('feed');
                    }
                }
            } else if (creature.state === 'eat') {
                creature.jumpY = 0;
                creature.stateTimer--;
                if (creature.stateTimer <= 0) creature.state = 'idle';
            } else if (creature.state === 'scared') {
                creature.stateTimer--;
                if (creature.stateTimer <= 0) creature.state = 'idle';
            } else if (creature.state === 'happy') {
                creature.jumpY = Math.abs(Math.sin(time / 2)) * 20;
                creature.stateTimer--;
                if (creature.stateTimer <= 0) {
                    creature.state = 'idle';
                    creature.jumpY = 0;
                }
            }
        }

        function drawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                ctx.globalAlpha = p.life;
                if (p.type === 'heart') {
                    ctx.fillStyle = p.color || 'red';
                    ctx.font = '20px Rajdhani';
                    ctx.fillText('❤️', p.x, p.y);
                } else if (p.type === 'bubble') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,248,251,0.55)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(time / 18);
                    ctx.fillRect(-3, -3, 6, 6);
                    ctx.restore();
                }
                ctx.globalAlpha = 1;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function gameLoop() {
            time++;
            ctx.clearRect(0, 0, width, height);

            if (phase === 'lab') {
                drawLab(ctx);
            } else {
                drawRoom(ctx);
                updateCreature();
                drawCreature(ctx);
            }

            drawParticles(ctx);
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('menu', 0);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('lab-controls').classList.remove('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            renderIngredients();
            gameLoop();
        });

        document.getElementById('mix-btn').addEventListener('click', () => {
            audio.playSFX('create', 0);
            phase = 'room';

            creature.species = selectedSpecies;
            creature.color = selectedColor;
            creature.scale = selectedSize;
            creature.x = width / 2;
            creature.y = height * 0.7;
            creature.state = 'idle';

            document.getElementById('lab-controls').classList.add('hidden');
            document.getElementById('play-controls').classList.remove('hidden');
            document.getElementById('interaction-bar').classList.remove('hidden');
            document.getElementById('status-text').innerHTML = "<strong>Mom Energy</strong> Hug Time";
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            phase = 'lab';
            audio.playSFX('blocked');
            gifFeedback.classList.add('hidden');
            document.getElementById('lab-controls').classList.remove('hidden');
            document.getElementById('play-controls').classList.add('hidden');
            document.getElementById('interaction-bar').classList.add('hidden');
            document.getElementById('status-text').innerHTML = "<strong>Mama Lab</strong> Pick 3";
        });

        document.getElementById('pet-btn').addEventListener('click', () => {
            creature.state = 'happy';
            creature.stateTimer = 60;
            audio.playSFX('pet');
            showGif('affection', 'Mom-approved affection reaction');
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: creature.x, y: creature.y - 50,
                    vx: (Math.random() - 0.5) * 5, vy: -2 - Math.random() * 3,
                    life: 1, type: 'heart'
                });
            }
        });

        document.getElementById('feed-btn').addEventListener('click', () => {
            creature.scale = Math.min(creature.scale + 0.1, 3.0);
            audio.playSFX('feed');
            particles.push({
                x: creature.x, y: creature.y - 50,
                vx: 0, vy: -2,
                life: 1, type: 'heart', color: 'orange'
            });
        });

        document.getElementById('scare-btn').addEventListener('click', () => {
            creature.state = 'scared';
            creature.stateTimer = 40;
            audio.playSFX('scare');
            showGif('scare', 'Harmless confetti boo reaction');
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (phase !== 'room') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dx = x - creature.x;
            const dy = y - (creature.y - 50);
            if (Math.sqrt(dx * dx + dy * dy) < 100 * creature.scale) {
                document.getElementById('pet-btn').click();
            }
        });
    });
    </script>
</body>
