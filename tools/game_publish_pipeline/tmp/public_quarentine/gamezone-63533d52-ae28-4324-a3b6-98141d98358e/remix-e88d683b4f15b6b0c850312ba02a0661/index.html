<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Portal Panic: Multiverse Blaster</title>
    <!-- [agent-note][stage4] resolved-font: title=Audiowide, ui=Exo 2 | source: catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #06120f;
            --bg-bottom: #17072e;
            --panel-fill: rgba(9, 25, 24, 0.86);
            --panel-stroke: rgba(125, 255, 142, 0.72);
            --panel-glow: rgba(52, 255, 112, 0.28);
            --ui-cyan: #9efeff;
            --ui-yellow: #f1ff5f;
            --ui-orange: #b4ff39;
            --ui-red: #ff5577;
            --ui-green: #7dff8e;
            --text-main: #fff8e8;
            --text-dim: rgba(255, 248, 232, 0.82);
            --shadow-hard: 0 6px 0 rgba(64, 19, 10, 0.9);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 20% 15%, rgba(125, 255, 142, 0.18), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(158, 254, 255, 0.16), transparent 20%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-fill {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .ui-root {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }

        .hidden {
            display: none !important;
        }

        .panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(63, 32, 102, 0.96), rgba(23, 13, 43, 0.94)),
                rgba(27, 16, 47, 0.84);
            border: 2px solid var(--panel-stroke);
            border-radius: 28px;
            box-shadow:
                0 0 0 2px rgba(255, 248, 232, 0.08) inset,
                0 18px 40px rgba(0, 0, 0, 0.42),
                0 0 28px var(--panel-glow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 20px;
            border: 1px solid rgba(158, 254, 255, 0.18);
            pointer-events: none;
        }

        .center-card {
            width: min(92vw, 420px);
            margin: 0 4px;
            padding: 24px 22px;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        .title-stack {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .portal-emblem {
            position: relative;
            width: 104px;
            height: 52px;
            margin: 4px auto 14px;
            border-radius: 50%;
            border: 3px solid rgba(125, 255, 142, 0.86);
            box-shadow:
                0 0 16px rgba(125, 255, 142, 0.48),
                0 0 32px rgba(158, 254, 255, 0.18),
                inset 0 0 18px rgba(125, 255, 142, 0.2);
            background:
                radial-gradient(ellipse at center, rgba(241, 255, 95, 0.38) 0 12%, transparent 14%),
                repeating-conic-gradient(from 18deg, rgba(125,255,142,0.38) 0 9deg, rgba(158,254,255,0.12) 9deg 18deg);
            transform: rotate(-7deg);
            pointer-events: none;
            animation: portalEmblemPulse 2.8s ease-in-out infinite;
        }

        .portal-emblem::before,
        .portal-emblem::after {
            content: "";
            position: absolute;
            inset: 8px 15px;
            border-radius: 50%;
            border: 2px dashed rgba(158, 254, 255, 0.72);
            animation: portalEmblemSpin 6s linear infinite;
        }

        .portal-emblem::after {
            inset: 16px 31px;
            border-style: solid;
            border-color: rgba(241, 255, 95, 0.82);
            animation-duration: 4s;
            animation-direction: reverse;
        }

        @keyframes portalEmblemPulse {
            0%, 100% { filter: brightness(1); transform: rotate(-7deg) scale(1); }
            50% { filter: brightness(1.18); transform: rotate(-4deg) scale(1.045); }
        }

        @keyframes portalEmblemSpin {
            to { transform: rotate(1turn); }
        }

        .arcade-title,
        .arcade-button {
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.06em;
        }

        .arcade-title {
            margin: 0;
            font-size: clamp(2.5rem, 9vw, 4.4rem);
            line-height: 0.9;
            color: var(--ui-yellow);
            text-shadow:
                0 3px 0 rgba(106, 49, 0, 0.95),
                0 0 18px rgba(255, 194, 72, 0.36);
        }

        .subtitle {
            margin: 0 0 16px;
            font-size: clamp(0.96rem, 3.8vw, 1.15rem);
            line-height: 1.35;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .chip-row {
            display: grid;
            gap: 8px;
            margin: 0 0 18px;
        }

        .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(158, 254, 255, 0.25);
            color: var(--text-dim);
            font-size: clamp(0.82rem, 3.3vw, 1rem);
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        }

        .chip .emoji {
            font-size: 1.1em;
        }

        .arcade-button {
            appearance: none;
            border: 0;
            width: 100%;
            max-width: 280px;
            min-height: 54px;
            padding: 14px 18px;
            border-radius: 999px;
            color: #fff9ef;
            font-size: clamp(1rem, 4.2vw, 1.35rem);
            line-height: 1;
            text-align: center;
            background: linear-gradient(180deg, #f1ff5f, #40d867);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                var(--shadow-hard),
                0 10px 24px rgba(64, 216, 103, 0.34);
            text-shadow: 0 2px 0 rgba(16, 84, 35, 0.8);
            transform: translateY(0);
            transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
            cursor: pointer;
        }

        .arcade-button:hover,
        .arcade-button:focus-visible {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
            outline: none;
        }

        .arcade-button:active {
            transform: translateY(3px) scale(0.985);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 3px 0 rgba(64, 19, 10, 0.9),
                0 6px 14px rgba(255, 122, 49, 0.25);
        }

        .arcade-button.green {
            background: linear-gradient(180deg, #8cff9b, #30cb68);
            text-shadow: 0 2px 0 rgba(8, 92, 29, 0.8);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 6px 0 rgba(10, 88, 33, 0.9),
                0 10px 24px rgba(48, 203, 104, 0.32);
        }

        .game-over-title {
            color: #ff7c95;
            text-shadow:
                0 3px 0 rgba(107, 15, 38, 0.95),
                0 0 18px rgba(255, 88, 120, 0.35);
            font-size: clamp(2rem, 8vw, 3.3rem);
            margin: 0 0 10px;
        }

        .score-line {
            margin: 0 0 12px;
            font-size: clamp(1rem, 4.5vw, 1.35rem);
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .score-line strong {
            color: var(--ui-yellow);
        }

        .body-copy {
            margin: 0 0 20px;
            color: var(--text-dim);
            font-size: clamp(0.86rem, 3.6vw, 1rem);
            line-height: 1.45;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            min-width: 118px;
            padding: 10px 12px 9px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(30, 18, 52, 0.96), rgba(15, 11, 27, 0.92));
            border: 2px solid rgba(158, 254, 255, 0.45);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 12px 24px rgba(0, 0, 0, 0.24),
                0 0 18px rgba(158, 254, 255, 0.16);
        }

        .hud-label {
            font-size: 0.68rem;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: rgba(255, 248, 232, 0.74);
        }

        .hud-value {
            margin-top: 5px;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.5rem, 5.5vw, 2.15rem);
            line-height: 1;
            letter-spacing: 0.05em;
            color: var(--ui-yellow);
            text-shadow:
                0 2px 0 rgba(106, 49, 0, 0.95),
                0 0 16px rgba(255, 213, 74, 0.25);
        }

        .phase-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 7px;
            padding: 4px 7px;
            max-width: 150px;
            border-radius: 999px;
            border: 1px solid rgba(125, 255, 142, 0.38);
            background: rgba(125, 255, 142, 0.1);
            color: rgba(255, 248, 232, 0.88);
            font-size: 0.64rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .phase-badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: var(--ui-green);
            box-shadow: 0 0 9px rgba(125, 255, 142, 0.76);
            flex: 0 0 auto;
        }

        .meme-gif {
            position: absolute;
            width: clamp(78px, 20vw, 132px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: scale(0.82) translateY(16px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 9;
        }

        .meme-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        .meme-gif.hit {
            right: 12px;
            bottom: max(88px, env(safe-area-inset-bottom) + 64px);
        }

        .meme-gif.fail {
            left: 12px;
            top: max(84px, env(safe-area-inset-top) + 64px);
        }

        .gif-label {
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(20, 11, 32, 0.88);
            border: 1px solid rgba(255, 213, 74, 0.45);
            color: var(--text-main);
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .health-strip {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-end;
            min-height: 56px;
        }

        .heart-icon {
            color: var(--ui-red);
            filter: drop-shadow(0 2px 0 rgba(75, 10, 28, 0.85)) drop-shadow(0 0 8px rgba(255, 85, 119, 0.3));
        }

        .damage-flash {
            animation: pulse-red 0.2s ease-in-out;
        }

        @keyframes pulse-red {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 0, 60, 0.22); }
        }

        @media (max-width: 520px) {
            .center-card {
                padding: 20px 16px;
                border-radius: 24px;
            }

            .panel::before {
                inset: 8px;
                border-radius: 17px;
            }

            .hud-card {
                min-width: 102px;
                padding: 8px 10px 8px;
                border-radius: 16px;
            }

            .hud-value {
                font-size: clamp(1.35rem, 6.2vw, 1.85rem);
            }

            .health-strip {
                min-height: 48px;
                gap: 4px;
            }

            .meme-gif.hit {
                right: 8px;
                bottom: max(82px, env(safe-area-inset-bottom) + 56px);
            }

            .meme-gif.fail {
                left: 8px;
                top: max(76px, env(safe-area-inset-top) + 56px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-fill">
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Overlay for Damage -->
        <div id="flash-overlay" class="overlay"></div>

        <!-- [agent-note][stage3] resolved-gif: hit/fail feedback overlays | source: catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <div class="overlay" aria-hidden="true">
            <div id="hit-gif-wrap" class="meme-gif hit">
                <img
                    id="hit-gif"
                    src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">PORTAL POPPED</span>
            </div>
            <div id="fail-gif-wrap" class="meme-gif fail">
                <img
                    id="fail-gif"
                    src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">BREACH HIT</span>
            </div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="ui-root">

            <!-- Start Screen -->
            <div id="start-screen" class="panel center-card">
                <div class="title-stack">
                    <h1 class="arcade-title">PORTAL<br>PANIC</h1>
                    <p class="subtitle">A garage-built portal sled is holding back a multiverse breach.</p>
                </div>
                <div class="portal-emblem" aria-hidden="true"></div>
                <div class="chip-row">
                    <p class="chip"><span class="emoji">👆</span><span>Drag the sled</span></p>
                    <p class="chip"><span class="emoji">🧪</span><span>Science auto-fires</span></p>
                    <p class="chip"><span class="emoji">🌀</span><span>Stop grubs, pods, drones</span></p>
                </div>
                <button id="start-btn" class="arcade-button">
                    SEAL THE BREACH
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden panel center-card">
                <h2 class="arcade-title game-over-title">CURVE COLLAPSED!</h2>
                <p class="score-line">Portal Score: <strong id="finalScore">0</strong></p>
                <p class="body-copy">The breach punched through the garage shield.</p>
                <button id="restart-btn" class="arcade-button green">
                    REOPEN PORTAL
                </button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-card">
                    <div class="hud-label">Portal Score</div>
                    <div class="hud-value" id="score">0</div>
                    <div class="phase-badge" id="phase-label">Garage Rift</div>
                </div>

                <div class="health-strip" id="health-container">
                    <!-- Hearts injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & AUDIO */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3",
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_wind_01.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3",
                kill: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_defeat_01.mp3",
                damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_wind_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_defeat_02.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.audioReady = false;
                this.muted = false;
                this.lastPlayedAt = {};
                this.bgm = this.createAudio(ASSETS.bgm, 0.2, true);
                this.sfx = Object.fromEntries(
                    Object.entries(ASSETS.sfx).map(([key, url]) => [key, this.createAudio(url, this.getVolume(key), false)])
                );
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                audio.playsInline = true;
                return audio;
            }

            getVolume(key) {
                return {
                    start: 0.55,
                    click: 0.42,
                    shoot: 0.18,
                    hit: 0.4,
                    kill: 0.48,
                    damage: 0.5,
                    warning: 0.38,
                    fail: 0.58
                }[key] ?? 0.45;
            }

            prime() {
                if (this.audioReady) return;
                this.audioReady = true;
                [...Object.values(this.sfx), this.bgm].forEach(sound => {
                    sound.load();
                });
            }

            playBGM() {
                if (this.muted) return;
                this.prime();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { cooldown = 0 } = {}) {
                if (this.muted || !this.sfx[key]) return;
                const now = performance.now();
                if (cooldown && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const source = this.sfx[key];
                try {
                    source.pause();
                    source.currentTime = 0;
                    source.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const hitGifWrap = document.getElementById('hit-gif-wrap');
        const failGifWrap = document.getElementById('fail-gif-wrap');
        let gifTimers = {};

        /** 2. CONFIG & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;

        let shake = 0;

        const PLAYER_CONFIG = {
            width: 50,
            height: 60,
            speed: 0.15,
            fireRate: 15,
            maxHealth: 3
        };

        let player = {
            x: 0,
            y: 0,
            targetX: 0,
            health: 3,
            cooldown: 0
        };

        let projectiles = [];
        let enemies = [];
        let particles = [];
        let lowHealthWarned = false;

        const ENEMIES = [
            { name: 'Broom', color: '#ff6c5c', width: 30, height: 50, hp: 1, score: 10, speedMod: 1.0 },
            { name: 'Vacuum', color: '#5ad6ff', width: 40, height: 40, hp: 2, score: 20, speedMod: 0.8 },
            { name: 'Spray', color: '#d874ff', width: 25, height: 45, hp: 1, score: 30, speedMod: 1.2, weave: true }
        ];

        /** 3. RESIZE & INPUT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            if (!gameActive) {
                player.x = width / 2;
                player.targetX = width / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        const handleInput = (clientX) => {
            if (!gameActive) return;
            player.targetX = Math.max(PLAYER_CONFIG.width / 2, Math.min(width - PLAYER_CONFIG.width / 2, clientX));
        };

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 4. GAME LOGIC */
        function showGif(target, duration = 950) {
            const element = target === 'hit' ? hitGifWrap : failGifWrap;
            if (!element) return;
            clearTimeout(gifTimers[target]);
            element.classList.add('visible');
            gifTimers[target] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        function initGame() {
            score = 0;
            frame = 0;
            shake = 0;
            player.health = PLAYER_CONFIG.maxHealth;
            player.x = width / 2;
            player.targetX = width / 2;
            player.cooldown = 0;
            lowHealthWarned = false;

            projectiles = [];
            enemies = [];
            particles = [];

            hitGifWrap.classList.remove('visible');
            failGifWrap.classList.remove('visible');
            updateHUD();
        }

        function getVisualPhase() {
            if (score >= 420) return { label: 'Curve Collapse', top: '#04070e', mid: '#1c1246', bottom: '#260427', accent: '#f1ff5f', secondary: '#9efeff' };
            if (score >= 300) return { label: 'Blips Overload', top: '#071027', mid: '#291259', bottom: '#301022', accent: '#ff8b3d', secondary: '#9efeff' };
            if (score >= 180) return { label: 'Citadel Sweep', top: '#041922', mid: '#0d2e3f', bottom: '#160f34', accent: '#9efeff', secondary: '#7dff8e' };
            if (score >= 80) return { label: 'Cronenberg Drift', top: '#10101e', mid: '#32194b', bottom: '#230735', accent: '#b95dff', secondary: '#7dff8e' };
            return { label: 'Garage Rift', top: '#051613', mid: '#14213f', bottom: '#220735', accent: '#7dff8e', secondary: '#9efeff' };
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            const phaseLabel = document.getElementById('phase-label');
            if (phaseLabel) phaseLabel.innerText = getVisualPhase().label;
            const hpContainer = document.getElementById('health-container');
            hpContainer.innerHTML = '';
            for (let i = 0; i < PLAYER_CONFIG.maxHealth; i++) {
                const heart = document.createElement('div');
                heart.className = `heart-icon transition-all duration-300 ${i < player.health ? 'opacity-100 scale-100' : 'opacity-25 scale-75'}`;
                heart.style.fontSize = '2rem';
                heart.style.transition = 'transform 180ms ease, opacity 180ms ease';
                heart.style.opacity = i < player.health ? '1' : '0.25';
                heart.style.transform = i < player.health ? 'scale(1)' : 'scale(0.75)';
                heart.innerHTML = '❤️';
                hpContainer.appendChild(heart);
            }
        }

        function spawnEnemy() {
            const baseRate = 60;
            const rate = Math.max(20, baseRate - Math.floor(score / 50));

            if (frame % rate === 0) {
                const type = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                enemies.push({
                    x: Math.random() * (width - type.width) + type.width / 2,
                    y: -50,
                    width: type.width,
                    height: type.height,
                    color: type.color,
                    hp: type.hp,
                    maxHp: type.hp,
                    score: type.score,
                    speed: (3 + Math.random() * 2 + (score * 0.01)) * type.speedMod,
                    weave: type.weave || false,
                    weaveOffset: Math.random() * Math.PI * 2,
                    type: type.name
                });
            }
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function update() {
            player.x += (player.targetX - player.x) * PLAYER_CONFIG.speed;

            if (player.cooldown > 0) player.cooldown--;
            else {
                projectiles.push({
                    x: player.x,
                    y: player.y - 20,
                    width: 8,
                    height: 16,
                    speed: 12,
                    color: '#7dff8e'
                });
                audio.playSFX('shoot', { cooldown: 90 });
                player.cooldown = PLAYER_CONFIG.fireRate;
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.y -= p.speed;
                if (p.y < -20) projectiles.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;

                if (e.weave) {
                    e.x += Math.sin(frame * 0.1 + e.weaveOffset) * 2;
                }

                if (e.y > height + 50) {
                    enemies.splice(i, 1);
                    continue;
                }

                if (
                    e.x < player.x + PLAYER_CONFIG.width / 2 &&
                    e.x + e.width > player.x - PLAYER_CONFIG.width / 2 &&
                    e.y < player.y + PLAYER_CONFIG.height / 2 &&
                    e.y + e.height > player.y - PLAYER_CONFIG.height / 2
                ) {
                    takeDamage();
                    createParticles(e.x, e.y, e.color, 15);
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    if (
                        p.x < e.x + e.width &&
                        p.x + p.width > e.x &&
                        p.y < e.y + e.height &&
                        p.y + p.height > e.y
                    ) {
                        e.hp--;
                        projectiles.splice(j, 1);
                        createParticles(p.x, p.y, '#fff', 3);
                        audio.playSFX('hit', { cooldown: 70 });

                        if (e.hp <= 0) {
                            score += e.score;
                            audio.playSFX('kill', { cooldown: 120 });
                            createParticles(e.x, e.y, e.color, 10);
                            showGif('hit', 880);
                            enemies.splice(i, 1);
                            updateHUD();
                        } else {
                            e.flash = 5;
                        }
                        break;
                    }
                }
                if (e.flash > 0) e.flash--;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        function takeDamage() {
            player.health--;
            shake = 20;
            audio.playSFX('damage', { cooldown: 150 });
            showGif('fail', 1100);

            const overlay = document.getElementById('flash-overlay');
            overlay.classList.remove('damage-flash');
            void overlay.offsetWidth;
            overlay.classList.add('damage-flash');

            if (player.health === 1 && !lowHealthWarned) {
                lowHealthWarned = true;
                audio.playSFX('warning', { cooldown: 300 });
            }

            updateHUD();

            if (player.health <= 0) {
                gameOver();
            }
        }

        /** 5. RENDERING */
        // [agent-note][world-design-v4] authored-background: procedural portal garage/multiverse lane; preserve decorative-only behavior.
        function drawBackground(scrollY) {
            const phase = getVisualPhase();
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, phase.top);
            bgGradient.addColorStop(0.45, phase.mid);
            bgGradient.addColorStop(1, phase.bottom);
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            const portalX = width * 0.5;
            const portalY = 96 + Math.sin(frame * 0.025) * 5;
            const portalGlow = ctx.createRadialGradient(portalX, portalY, 8, portalX, portalY, 156);
            portalGlow.addColorStop(0, 'rgba(241, 255, 95, 0.24)');
            portalGlow.addColorStop(0.35, 'rgba(125, 255, 142, 0.16)');
            portalGlow.addColorStop(1, 'rgba(125, 255, 142, 0)');
            ctx.fillStyle = portalGlow;
            ctx.fillRect(0, 0, width, Math.min(height, 260));

            for (let r = 104; r > 24; r -= 14) {
                ctx.strokeStyle = r % 28 === 0 ? 'rgba(125, 255, 142, 0.34)' : 'rgba(158, 254, 255, 0.2)';
                ctx.lineWidth = r > 80 ? 5 : 7;
                ctx.beginPath();
                ctx.ellipse(portalX, portalY, r, r * 0.36, frame * 0.006 + r * 0.01, 0, Math.PI * 2);
                ctx.stroke();
            }

            for (let i = 0; i < 34; i++) {
                const x = ((i * 211) % width) + (i % 3) * 11;
                const y = (i * 83 + scrollY * 0.35) % (height + 80) - 40;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(125, 255, 142, 0.18)' : 'rgba(158, 254, 255, 0.13)';
                ctx.beginPath();
                ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 8; i++) {
                const x = ((i * 137 + frame * 0.18) % (width + 80)) - 40;
                const y = (i * 121 + scrollY * 0.18) % (height + 120) - 60;
                ctx.strokeStyle = i % 2 ? 'rgba(241, 255, 95, 0.12)' : 'rgba(158, 254, 255, 0.12)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 13, y + 19);
                ctx.lineTo(x - 4, y + 31);
                ctx.stroke();
            }

            const laneGradient = ctx.createLinearGradient(0, 0, 0, height);
            laneGradient.addColorStop(0, 'rgba(11, 45, 38, 0.62)');
            laneGradient.addColorStop(1, 'rgba(32, 13, 54, 0.72)');
            ctx.fillStyle = laneGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(125, 255, 142, 0.18)';
            ctx.lineWidth = 5;
            ctx.setLineDash([18, 20]);
            ctx.beginPath();
            ctx.moveTo(width * 0.22, -height + scrollY);
            ctx.lineTo(width * 0.22, height * 2 + scrollY);
            ctx.moveTo(width * 0.78, -height + scrollY);
            ctx.lineTo(width * 0.78, height * 2 + scrollY);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let i = -1; i < 3; i++) {
                const y = scrollY + i * height;
                ctx.fillStyle = 'rgba(3, 8, 12, 0.22)';
                ctx.fillRect(width * 0.08, y, 14, height);
                ctx.fillRect(width * 0.92 - 14, y, 14, height);

                ctx.strokeStyle = 'rgba(158, 254, 255, 0.11)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(width * 0.12, y + 40);
                ctx.quadraticCurveTo(width * 0.22, y + 120, width * 0.14, y + 220);
                ctx.moveTo(width * 0.88, y + 80);
                ctx.quadraticCurveTo(width * 0.76, y + 165, width * 0.86, y + 280);
                ctx.stroke();

                ctx.fillStyle = 'rgba(241, 255, 95, 0.07)';
                ctx.fillRect(width * 0.16, y + 110, 42, 18);
                ctx.fillRect(width * 0.78, y + 270, 36, 16);

                ctx.strokeStyle = 'rgba(125, 255, 142, 0.13)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(width * 0.34, y + 185, 30, 0, Math.PI * 2);
                ctx.arc(width * 0.68, y + 340, 24, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = phase.accent === '#b95dff' ? 'rgba(185, 93, 255, 0.16)' : 'rgba(241, 255, 95, 0.11)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(width * 0.18, y + 420);
                ctx.lineTo(width * 0.25, y + 438);
                ctx.lineTo(width * 0.21, y + 456);
                ctx.moveTo(width * 0.75, y + 76);
                ctx.lineTo(width * 0.84, y + 95);
                ctx.lineTo(width * 0.79, y + 118);
                ctx.stroke();
            }
        }

        // [agent-note][world-design-v4] hazard-map: Broom=portal grub, Vacuum=armored mutation pod, Spray=weaving council drone; dimensions/hp unchanged.
        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
            ctx.strokeStyle = 'rgba(3, 12, 15, 0.86)';
            ctx.lineWidth = 3;

            if (e.type === 'Broom') {
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#77ff7c';
                ctx.beginPath();
                ctx.ellipse(0, 0, 15, 21, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(241, 255, 95, 0.78)';
                ctx.beginPath();
                ctx.ellipse(0, 7, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#101827';
                ctx.beginPath();
                ctx.arc(-5, -5, 3, 0, Math.PI * 2);
                ctx.arc(5, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(158, 254, 255, 0.7)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 5, 17, 0.25, Math.PI * 1.75);
                ctx.stroke();
            } else if (e.type === 'Vacuum') {
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#5ad6ff';
                ctx.beginPath();
                ctx.roundRect(-20, -20, 40, 34, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#b95dff';
                ctx.beginPath();
                ctx.arc(0, -2, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#101827';
                ctx.beginPath(); ctx.arc(-8, -3, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, -3, 3, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = 'rgba(125,255,142,0.72)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-15, 16);
                ctx.lineTo(-26, 28);
                ctx.moveTo(15, 16);
                ctx.lineTo(26, 28);
                ctx.stroke();
            } else {
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#d874ff';
                ctx.beginPath();
                ctx.moveTo(0, -e.height / 2);
                ctx.lineTo(e.width / 2, e.height / 2 - 7);
                ctx.lineTo(0, e.height / 2);
                ctx.lineTo(-e.width / 2, e.height / 2 - 7);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#f1ff5f';
                ctx.beginPath();
                ctx.arc(0, -7, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(158,254,255,0.72)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-7, 13);
                ctx.lineTo(7, 13);
                ctx.stroke();
            }

            if (e.maxHp > 1) {
                const hpPct = e.hp / e.maxHp;
                ctx.fillStyle = 'rgba(64, 0, 12, 0.8)';
                ctx.fillRect(-16, -e.height / 2 - 12, 32, 5);
                ctx.fillStyle = '#7dff8e';
                ctx.fillRect(-16, -e.height / 2 - 12, 32 * hpPct, 5);
            }

            ctx.restore();
        }

        // [agent-note][world-design-v4] player-map: compact portal sled with scientist/sidekick cockpit decals; footprint unchanged.
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            ctx.fillStyle = 'rgba(125, 255, 142, 0.18)';
            ctx.beginPath();
            ctx.ellipse(0, 16, 34 + Math.sin(frame * 0.12) * 2, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1f2f3e';
            ctx.strokeStyle = 'rgba(3, 12, 15, 0.88)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 8, 25, 24, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#4b5563';
            ctx.beginPath();
            ctx.roundRect(-22, 1, 44, 18, 9);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(125, 255, 142, 0.82)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 9, 20, 0.25, Math.PI * 1.85);
            ctx.stroke();

            ctx.fillStyle = '#d7f8ff';
            ctx.beginPath();
            ctx.arc(-8, -7, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffe2b8';
            ctx.beginPath();
            ctx.arc(8, -6, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#aaf0ff';
            ctx.beginPath();
            ctx.moveTo(-17, -14); ctx.lineTo(-11, -28); ctx.lineTo(-7, -14); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-10, -16); ctx.lineTo(-4, -30); ctx.lineTo(0, -13); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.arc(-10, -8, 1.5, 0, Math.PI * 2);
            ctx.arc(-5, -8, 1.5, 0, Math.PI * 2);
            ctx.arc(6, -6, 1.4, 0, Math.PI * 2);
            ctx.arc(10, -6, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#101827';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-11, -1); ctx.lineTo(-4, -1);
            ctx.moveTo(6, -1); ctx.quadraticCurveTo(9, 1, 12, -1);
            ctx.stroke();

            ctx.fillStyle = '#f1ff5f';
            ctx.beginPath();
            ctx.moveTo(-24, 15);
            ctx.lineTo(-13, 24);
            ctx.lineTo(-8, 14);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(24, 15);
            ctx.lineTo(13, 24);
            ctx.lineTo(8, 14);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;

            ctx.save();
            ctx.translate(dx, dy);
            ctx.clearRect(0, 0, width, height);

            const scrollSpeed = 2 + (score * 0.005);
            const scrollY = (frame * scrollSpeed) % height;

            drawBackground(scrollY);

            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.fillRect(p.x - 2, p.y + 6, 4, 10);

                ctx.strokeStyle = 'rgba(158, 254, 255, 0.72)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y + 8);
                ctx.lineTo(p.x, p.y + 16);
                ctx.stroke();
            });

            enemies.forEach(drawEnemy);
            drawPlayer();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            frame++;
            spawnEnemy();
            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. UI BINDINGS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('start', { cooldown: 120 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('click', { cooldown: 120 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
