<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Flappy Feed: Sky Cleanup Run</title>
    <!-- [agent-note][stage4] resolved-font: title=Audiowide, ui=Exo 2 | source: catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #63d8ff;
            --bg-bottom: #ffe698;
            --panel-fill: rgba(13, 80, 135, 0.86);
            --panel-stroke: rgba(255, 221, 78, 0.9);
            --panel-glow: rgba(108, 224, 255, 0.42);
            --ui-cyan: #9efeff;
            --ui-yellow: #ffd54a;
            --ui-orange: #ff9f2f;
            --ui-red: #ff5577;
            --ui-green: #77d85d;
            --pipe-green: #47b844;
            --pipe-dark: #16713b;
            --text-main: #fff8e8;
            --text-dim: rgba(255, 248, 232, 0.84);
            --shadow-hard: 0 6px 0 rgba(64, 44, 8, 0.9);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 195, 86, 0.16), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(158, 254, 255, 0.14), transparent 20%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-fill {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .ui-root {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }

        .hidden {
            display: none !important;
        }

        .panel {
            position: relative;
            background:
                radial-gradient(circle at 22% 0%, rgba(255, 245, 176, 0.24), transparent 34%),
                radial-gradient(circle at 92% 18%, rgba(116, 229, 255, 0.18), transparent 30%),
                linear-gradient(180deg, rgba(18, 102, 154, 0.94), rgba(13, 52, 107, 0.92)),
                rgba(15, 64, 112, 0.84);
            border: 2px solid var(--panel-stroke);
            border-radius: 28px;
            box-shadow:
                0 0 0 2px rgba(255, 248, 232, 0.1) inset,
                0 18px 40px rgba(0, 35, 82, 0.38),
                0 0 28px var(--panel-glow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 20px;
            border: 1px dashed rgba(158, 254, 255, 0.28);
            pointer-events: none;
        }

        .panel::after {
            content: "🪶";
            position: absolute;
            right: 18px;
            top: 14px;
            font-size: 1.2rem;
            filter: drop-shadow(0 2px 0 rgba(80, 45, 0, 0.45));
            pointer-events: none;
        }

        .center-card {
            width: min(92vw, 420px);
            margin: 0 4px;
            padding: 24px 22px;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        .title-stack {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .arcade-title,
        .arcade-button {
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.06em;
        }

        .arcade-title {
            margin: 0;
            font-size: clamp(2.5rem, 9vw, 4.4rem);
            line-height: 0.9;
            color: var(--ui-yellow);
            text-shadow:
                0 3px 0 rgba(106, 49, 0, 0.95),
                0 0 18px rgba(255, 194, 72, 0.36);
        }

        .subtitle {
            margin: 0 0 16px;
            font-size: clamp(0.96rem, 3.8vw, 1.15rem);
            line-height: 1.35;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .chip-row {
            display: grid;
            gap: 8px;
            margin: 0 0 18px;
        }

        .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 10px;
            border-radius: 999px;
            background:
                linear-gradient(90deg, rgba(71, 184, 68, 0.18), rgba(255, 213, 74, 0.12)),
                rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(158, 254, 255, 0.3);
            color: var(--text-dim);
            font-size: clamp(0.82rem, 3.3vw, 1rem);
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        }

        .chip .emoji {
            font-size: 1.1em;
        }

        .arcade-button {
            appearance: none;
            border: 0;
            width: 100%;
            max-width: 280px;
            min-height: 54px;
            padding: 14px 18px;
            border-radius: 999px;
            color: #fff9ef;
            font-size: clamp(1rem, 4.2vw, 1.35rem);
            line-height: 1;
            text-align: center;
            background: linear-gradient(180deg, #ffcf4d, var(--ui-orange));
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                var(--shadow-hard),
                0 10px 24px rgba(255, 122, 49, 0.34);
            text-shadow: 0 2px 0 rgba(109, 41, 0, 0.8);
            transform: translateY(0);
            transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
            cursor: pointer;
        }

        .arcade-button:hover,
        .arcade-button:focus-visible {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
            outline: none;
        }

        .arcade-button:active {
            transform: translateY(3px) scale(0.985);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 3px 0 rgba(64, 19, 10, 0.9),
                0 6px 14px rgba(255, 122, 49, 0.25);
        }

        .arcade-button.green {
            background: linear-gradient(180deg, #8cff9b, #30cb68);
            text-shadow: 0 2px 0 rgba(8, 92, 29, 0.8);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 6px 0 rgba(10, 88, 33, 0.9),
                0 10px 24px rgba(48, 203, 104, 0.32);
        }

        .game-over-title {
            color: #ff7c95;
            text-shadow:
                0 3px 0 rgba(107, 15, 38, 0.95),
                0 0 18px rgba(255, 88, 120, 0.35);
            font-size: clamp(2rem, 8vw, 3.3rem);
            margin: 0 0 10px;
        }

        .score-line {
            margin: 0 0 12px;
            font-size: clamp(1rem, 4.5vw, 1.35rem);
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .score-line strong {
            color: var(--ui-yellow);
        }

        .body-copy {
            margin: 0 0 20px;
            color: var(--text-dim);
            font-size: clamp(0.86rem, 3.6vw, 1rem);
            line-height: 1.45;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            min-width: 112px;
            padding: 9px 11px 8px;
            border-radius: 18px;
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 213, 74, 0.16), transparent 38%),
                linear-gradient(180deg, rgba(14, 91, 142, 0.94), rgba(10, 48, 104, 0.9));
            border: 2px solid rgba(158, 254, 255, 0.48);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.1) inset,
                0 10px 22px rgba(0, 45, 98, 0.24),
                0 0 18px rgba(158, 254, 255, 0.18);
        }

        .hud-label {
            font-size: 0.68rem;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: rgba(255, 248, 232, 0.74);
        }

        .hud-value {
            margin-top: 5px;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.5rem, 5.5vw, 2.15rem);
            line-height: 1;
            letter-spacing: 0.05em;
            color: var(--ui-yellow);
            text-shadow:
                0 2px 0 rgba(106, 49, 0, 0.95),
                0 0 16px rgba(255, 213, 74, 0.25);
        }

        .meme-gif {
            position: absolute;
            width: clamp(78px, 20vw, 132px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: scale(0.82) translateY(16px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 9;
        }

        .meme-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        .meme-gif.hit {
            right: 12px;
            bottom: max(88px, env(safe-area-inset-bottom) + 64px);
        }

        .meme-gif.fail {
            left: 12px;
            top: max(84px, env(safe-area-inset-top) + 64px);
        }

        .gif-label {
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(20, 11, 32, 0.88);
            border: 1px solid rgba(255, 213, 74, 0.45);
            color: var(--text-main);
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .health-strip {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-end;
            min-height: 56px;
        }

        .heart-icon {
            color: var(--ui-red);
            filter: drop-shadow(0 2px 0 rgba(75, 10, 28, 0.85)) drop-shadow(0 0 8px rgba(255, 85, 119, 0.3));
        }

        .damage-flash {
            animation: pulse-red 0.2s ease-in-out;
        }

        @keyframes pulse-red {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 0, 60, 0.22); }
        }

        @media (max-width: 520px) {
            .center-card {
                padding: 20px 16px;
                border-radius: 24px;
            }

            .panel::before {
                inset: 8px;
                border-radius: 17px;
            }

            .hud-card {
                min-width: 102px;
                padding: 8px 10px 8px;
                border-radius: 16px;
            }

            .hud-value {
                font-size: clamp(1.35rem, 6.2vw, 1.85rem);
            }

            .health-strip {
                min-height: 48px;
                gap: 4px;
            }

            .meme-gif.hit {
                right: 8px;
                bottom: max(82px, env(safe-area-inset-bottom) + 56px);
            }

            .meme-gif.fail {
                left: 8px;
                top: max(76px, env(safe-area-inset-top) + 56px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-fill">
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Overlay for Damage -->
        <div id="flash-overlay" class="overlay"></div>

        <!-- [agent-note][stage3] resolved-gif: hit/fail feedback overlays | source: catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <div class="overlay" aria-hidden="true">
            <div id="hit-gif-wrap" class="meme-gif hit">
                <img
                    id="hit-gif"
                    src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">PIPE POPPED</span>
            </div>
            <div id="fail-gif-wrap" class="meme-gif fail">
                <img
                    id="fail-gif"
                    src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">WINGS CLIPPED</span>
            </div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="ui-root">

            <!-- Start Screen -->
            <div id="start-screen" class="panel center-card">
                <div class="title-stack">
                    <h1 class="arcade-title">FLAPPY<br>FEED</h1>
                    <p class="subtitle">Defend the sky lane from pipe-city cleanup storms.</p>
                </div>
                <div class="chip-row">
                    <p class="chip"><span class="emoji">👆</span><span>Drag to glide</span></p>
                    <p class="chip"><span class="emoji">🪶</span><span>Auto-fire feather posts</span></p>
                    <p class="chip"><span class="emoji">🟩</span><span>Pop the pipe tools</span></p>
                </div>
                <button id="start-btn" class="arcade-button">
                    START
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden panel center-card">
                <h2 class="arcade-title game-over-title">WINGS CLIPPED</h2>
                <p class="score-line">Wing Score: <strong id="finalScore">0</strong></p>
                <p class="body-copy">The pipe storm scrubbed the feed.</p>
                <button id="restart-btn" class="arcade-button green">
                    TRY AGAIN
                </button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-card">
                    <div class="hud-label">Wing Score</div>
                    <div class="hud-value" id="score">0</div>
                </div>

                <div class="health-strip" id="health-container">
                    <!-- Hearts injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & AUDIO */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/joyful_bgm_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_wind_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_character_01.mp3",
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_wind_02.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_enemy_01.mp3",
                kill: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_01.mp3",
                damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/tense_enemy_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/heroic_enemy_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_defeat_01.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.audioReady = false;
                this.muted = false;
                this.lastPlayedAt = {};
                this.bgm = this.createAudio(ASSETS.bgm, 0.2, true);
                this.sfx = Object.fromEntries(
                    Object.entries(ASSETS.sfx).map(([key, url]) => [key, this.createAudio(url, this.getVolume(key), false)])
                );
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                audio.playsInline = true;
                return audio;
            }

            getVolume(key) {
                return {
                    start: 0.55,
                    click: 0.42,
                    shoot: 0.18,
                    hit: 0.4,
                    kill: 0.48,
                    damage: 0.5,
                    warning: 0.38,
                    fail: 0.58
                }[key] ?? 0.45;
            }

            prime() {
                if (this.audioReady) return;
                this.audioReady = true;
                [...Object.values(this.sfx), this.bgm].forEach(sound => {
                    sound.load();
                });
            }

            playBGM() {
                if (this.muted) return;
                this.prime();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { cooldown = 0 } = {}) {
                if (this.muted || !this.sfx[key]) return;
                const now = performance.now();
                if (cooldown && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const source = this.sfx[key];
                try {
                    source.pause();
                    source.currentTime = 0;
                    source.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const hitGifWrap = document.getElementById('hit-gif-wrap');
        const failGifWrap = document.getElementById('fail-gif-wrap');
        let gifTimers = {};

        /** 2. CONFIG & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;

        let shake = 0;

        const PLAYER_CONFIG = {
            width: 50,
            height: 60,
            speed: 0.15,
            fireRate: 15,
            maxHealth: 3
        };

        let player = {
            x: 0,
            y: 0,
            targetX: 0,
            health: 3,
            cooldown: 0
        };

        let projectiles = [];
        let enemies = [];
        let particles = [];
        let lowHealthWarned = false;

        const ENEMIES = [
            { name: 'Broom', color: '#ff6c5c', width: 30, height: 50, hp: 1, score: 10, speedMod: 1.0 },
            { name: 'Vacuum', color: '#5ad6ff', width: 40, height: 40, hp: 2, score: 20, speedMod: 0.8 },
            { name: 'Spray', color: '#d874ff', width: 25, height: 45, hp: 1, score: 30, speedMod: 1.2, weave: true }
        ];

        /** 3. RESIZE & INPUT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            if (!gameActive) {
                player.x = width / 2;
                player.targetX = width / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        const handleInput = (clientX) => {
            if (!gameActive) return;
            player.targetX = Math.max(PLAYER_CONFIG.width / 2, Math.min(width - PLAYER_CONFIG.width / 2, clientX));
        };

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 4. GAME LOGIC */
        function showGif(target, duration = 950) {
            const element = target === 'hit' ? hitGifWrap : failGifWrap;
            if (!element) return;
            clearTimeout(gifTimers[target]);
            element.classList.add('visible');
            gifTimers[target] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        function initGame() {
            score = 0;
            frame = 0;
            shake = 0;
            player.health = PLAYER_CONFIG.maxHealth;
            player.x = width / 2;
            player.targetX = width / 2;
            player.cooldown = 0;
            lowHealthWarned = false;

            projectiles = [];
            enemies = [];
            particles = [];

            hitGifWrap.classList.remove('visible');
            failGifWrap.classList.remove('visible');
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            const hpContainer = document.getElementById('health-container');
            hpContainer.innerHTML = '';
            for (let i = 0; i < PLAYER_CONFIG.maxHealth; i++) {
                const heart = document.createElement('div');
                heart.className = `heart-icon transition-all duration-300 ${i < player.health ? 'opacity-100 scale-100' : 'opacity-25 scale-75'}`;
                heart.style.fontSize = '2rem';
                heart.style.transition = 'transform 180ms ease, opacity 180ms ease';
                heart.style.opacity = i < player.health ? '1' : '0.25';
                heart.style.transform = i < player.health ? 'scale(1)' : 'scale(0.75)';
                heart.innerHTML = '🪽';
                hpContainer.appendChild(heart);
            }
        }

        function spawnEnemy() {
            const baseRate = 60;
            const rate = Math.max(20, baseRate - Math.floor(score / 50));

            if (frame % rate === 0) {
                const type = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                enemies.push({
                    x: Math.random() * (width - type.width) + type.width / 2,
                    y: -50,
                    width: type.width,
                    height: type.height,
                    color: type.color,
                    hp: type.hp,
                    maxHp: type.hp,
                    score: type.score,
                    speed: (3 + Math.random() * 2 + (score * 0.01)) * type.speedMod,
                    weave: type.weave || false,
                    weaveOffset: Math.random() * Math.PI * 2,
                    type: type.name
                });
            }
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function update() {
            player.x += (player.targetX - player.x) * PLAYER_CONFIG.speed;

            if (player.cooldown > 0) player.cooldown--;
            else {
                projectiles.push({
                    x: player.x,
                    y: player.y - 20,
                    width: 8,
                    height: 16,
                    speed: 12,
                    color: '#ffd54a'
                });
                audio.playSFX('shoot', { cooldown: 90 });
                player.cooldown = PLAYER_CONFIG.fireRate;
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.y -= p.speed;
                if (p.y < -20) projectiles.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;

                if (e.weave) {
                    e.x += Math.sin(frame * 0.1 + e.weaveOffset) * 2;
                }

                if (e.y > height + 50) {
                    enemies.splice(i, 1);
                    continue;
                }

                if (
                    e.x < player.x + PLAYER_CONFIG.width / 2 &&
                    e.x + e.width > player.x - PLAYER_CONFIG.width / 2 &&
                    e.y < player.y + PLAYER_CONFIG.height / 2 &&
                    e.y + e.height > player.y - PLAYER_CONFIG.height / 2
                ) {
                    takeDamage();
                    createParticles(e.x, e.y, e.color, 15);
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    if (
                        p.x < e.x + e.width &&
                        p.x + p.width > e.x &&
                        p.y < e.y + e.height &&
                        p.y + p.height > e.y
                    ) {
                        e.hp--;
                        projectiles.splice(j, 1);
                        createParticles(p.x, p.y, '#fff', 3);
                        audio.playSFX('hit', { cooldown: 70 });

                        if (e.hp <= 0) {
                            score += e.score;
                            audio.playSFX('kill', { cooldown: 120 });
                            createParticles(e.x, e.y, e.color, 10);
                            showGif('hit', 880);
                            enemies.splice(i, 1);
                            updateHUD();
                        } else {
                            e.flash = 5;
                        }
                        break;
                    }
                }
                if (e.flash > 0) e.flash--;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        function takeDamage() {
            player.health--;
            shake = 20;
            audio.playSFX('damage', { cooldown: 150 });
            showGif('fail', 1100);

            const overlay = document.getElementById('flash-overlay');
            overlay.classList.remove('damage-flash');
            void overlay.offsetWidth;
            overlay.classList.add('damage-flash');

            if (player.health === 1 && !lowHealthWarned) {
                lowHealthWarned = true;
                audio.playSFX('warning', { cooldown: 300 });
            }

            updateHUD();

            if (player.health <= 0) {
                gameOver();
            }
        }

        /** 5. RENDERING */
        function drawCloud(x, y, scale = 1, alpha = 0.62) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, 18 * scale, 0, Math.PI * 2);
            ctx.arc(x + 20 * scale, y + 2 * scale, 24 * scale, 0, Math.PI * 2);
            ctx.arc(x + 47 * scale, y + 6 * scale, 16 * scale, 0, Math.PI * 2);
            ctx.arc(x - 22 * scale, y + 8 * scale, 14 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawDecorativePipe(x, y, h, alpha = 0.28, flip = false) {
            ctx.save();
            ctx.globalAlpha = alpha;
            const w = 34;
            const capH = 18;
            const pipeGradient = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
            pipeGradient.addColorStop(0, '#1f8d45');
            pipeGradient.addColorStop(0.48, '#69d86e');
            pipeGradient.addColorStop(1, '#176e38');
            ctx.fillStyle = pipeGradient;
            ctx.strokeStyle = 'rgba(11, 83, 47, 0.42)';
            ctx.lineWidth = 2;
            ctx.fillRect(x - w / 2, y, w, h);
            ctx.strokeRect(x - w / 2, y, w, h);
            ctx.fillRect(x - w / 2 - 9, flip ? y + h - capH : y, w + 18, capH);
            ctx.strokeRect(x - w / 2 - 9, flip ? y + h - capH : y, w + 18, capH);
            ctx.restore();
        }

        function drawBackground(scrollY) {
            // [agent-note][visuals-unified] authored-bg: procedural animated flappy pipe-city; decorative only, no collision meaning
            const phase = Math.min(4, Math.floor(score / 150));
            const palettes = [
                ['#65d9ff', '#baf0ff', '#ffe99d'],
                ['#58cfff', '#aeefff', '#ffdf84'],
                ['#4cc8ff', '#9be8ff', '#ffd171'],
                ['#4f8be8', '#91d9ff', '#5f3d8a'],
                ['#1d2f76', '#5aaeed', '#402760']
            ];
            const [top, mid, bottom] = palettes[phase];
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, top);
            skyGradient.addColorStop(0.56, mid);
            skyGradient.addColorStop(1, bottom);
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            const sunX = width * 0.78;
            const sunY = (height * 0.18 + scrollY * 0.04) % (height + 160) - 80;
            const sunGlow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, width * 0.36);
            sunGlow.addColorStop(0, phase >= 3 ? 'rgba(255,213,74,0.3)' : 'rgba(255,241,156,0.42)');
            sunGlow.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, width, height);

            for (let i = -1; i < 4; i++) {
                const y = (scrollY * 0.2 + i * 190) % (height + 190) - 95;
                const x = (i % 2 === 0) ? width * 0.12 : width * 0.7;
                drawCloud(x, y, 0.9 + (i % 3) * 0.22, 0.36);
            }

            for (let i = -1; i < 4; i++) {
                const y = (scrollY * 0.46 + i * 230) % (height + 230) - 115;
                const leftX = Math.max(24, width * 0.08);
                const rightX = Math.min(width - 24, width * 0.92);
                drawDecorativePipe(leftX, y, 138 + (i % 2) * 52, 0.2 + phase * 0.025, false);
                drawDecorativePipe(rightX, y + 86, 128 + ((i + 1) % 2) * 58, 0.2 + phase * 0.025, true);
            }

            ctx.save();
            ctx.strokeStyle = phase >= 3 ? 'rgba(255, 213, 74, 0.22)' : 'rgba(15, 88, 130, 0.16)';
            ctx.lineWidth = 4;
            ctx.setLineDash([18, 24]);
            ctx.beginPath();
            ctx.moveTo(width * 0.23, -height + scrollY);
            ctx.lineTo(width * 0.23, height * 2 + scrollY);
            ctx.moveTo(width * 0.77, -height + scrollY);
            ctx.lineTo(width * 0.77, height * 2 + scrollY);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            ctx.save();
            for (let i = 0; i < 24; i++) {
                const x = ((i * 157 + phase * 31) % Math.max(width, 1));
                const y = (i * 79 + scrollY * (0.52 + phase * 0.04)) % (height + 110) - 55;
                ctx.translate(x, y);
                ctx.rotate(-0.45 + Math.sin((frame + i * 12) * 0.018) * 0.18);
                ctx.fillStyle = i % 3 === 0 ? 'rgba(255, 213, 74, 0.38)' : 'rgba(255, 255, 255, 0.52)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 2.5 + (i % 3), 9 + (i % 2) * 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }
            ctx.restore();

            if (phase >= 2) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 7; i++) {
                    const y = (scrollY * 0.72 + i * 118) % (height + 80) - 40;
                    const x = (i % 2 ? width * 0.64 : width * 0.28);
                    ctx.beginPath();
                    ctx.moveTo(x - 24, y);
                    ctx.quadraticCurveTo(x, y - 12, x + 32, y + 2);
                    ctx.quadraticCurveTo(x + 14, y + 8, x - 12, y + 16);
                    ctx.stroke();
                }
                ctx.restore();
            }

            if (phase >= 3) {
                ctx.save();
                ctx.strokeStyle = 'rgba(158, 254, 255, 0.24)';
                ctx.lineWidth = 1.4;
                for (let i = 0; i < 26; i++) {
                    const x = (i * 53 + frame * 0.8) % (width + 40) - 20;
                    const y = (i * 97 + scrollY * 1.1) % (height + 80) - 40;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 8, y + 28);
                    ctx.stroke();
                }
                ctx.restore();
            }

            if (phase >= 4) {
                const towerX = width * 0.5;
                const towerY = height - 160 + Math.sin(frame * 0.02) * 8;
                const towerGlow = ctx.createRadialGradient(towerX, towerY, 6, towerX, towerY, 120);
                towerGlow.addColorStop(0, 'rgba(255, 213, 74, 0.2)');
                towerGlow.addColorStop(1, 'rgba(255, 213, 74, 0)');
                ctx.fillStyle = towerGlow;
                ctx.fillRect(0, Math.max(0, towerY - 130), width, 260);
            }
        }

        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            const flash = e.flash > 0;
            ctx.strokeStyle = 'rgba(22, 50, 44, 0.82)';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            if (e.type === 'Broom') {
                const bodyGradient = ctx.createLinearGradient(-6, -28, 6, 24);
                bodyGradient.addColorStop(0, flash ? '#ffffff' : '#ff705f');
                bodyGradient.addColorStop(1, flash ? '#fff7ba' : '#1f9f4d');

                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.roundRect(-6, -25, 12, 36, 5);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = flash ? '#ffffff' : '#ffd54a';
                ctx.beginPath();
                ctx.moveTo(-18, 6);
                ctx.lineTo(18, 6);
                ctx.lineTo(23, 22);
                ctx.quadraticCurveTo(0, 30, -23, 22);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(119, 82, 16, 0.62)';
                ctx.lineWidth = 2;
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * 7, 9);
                    ctx.lineTo(i * 9, 23);
                    ctx.stroke();
                }

                ctx.fillStyle = '#f7fff5';
                ctx.beginPath();
                ctx.arc(-4, -12, 2.5, 0, Math.PI * 2);
                ctx.arc(4, -12, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (e.type === 'Vacuum') {
                const bodyGradient = ctx.createLinearGradient(-22, -23, 22, 22);
                bodyGradient.addColorStop(0, flash ? '#ffffff' : '#74e5ff');
                bodyGradient.addColorStop(1, flash ? '#e7fbff' : '#1b8ccf');

                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.roundRect(-21, -21, 42, 30, 11);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = flash ? '#ffffff' : '#47b844';
                ctx.beginPath();
                ctx.roundRect(-15, 0, 30, 18, 8);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#0e2f44';
                ctx.beginPath(); ctx.arc(-16, 12, 4.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(16, 12, 4.5, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = 'rgba(255, 248, 232, 0.75)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(11, -13);
                ctx.quadraticCurveTo(30, -26, 25, -41);
                ctx.stroke();

                ctx.fillStyle = '#fff8e8';
                ctx.beginPath();
                ctx.arc(-6, -9, 2.4, 0, Math.PI * 2);
                ctx.arc(6, -9, 2.4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                const gustGradient = ctx.createLinearGradient(0, -e.height / 2, 0, e.height / 2);
                gustGradient.addColorStop(0, flash ? '#ffffff' : '#e78cff');
                gustGradient.addColorStop(1, flash ? '#fff3ff' : '#7a3ef2');

                ctx.fillStyle = gustGradient;
                ctx.beginPath();
                ctx.moveTo(0, -e.height / 2);
                ctx.quadraticCurveTo(e.width / 2 + 6, -6, e.width / 2, e.height / 2 - 4);
                ctx.lineTo(0, e.height / 2);
                ctx.quadraticCurveTo(-e.width / 2 - 6, 6, -e.width / 2, -e.height / 2 + 8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2;
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-8, i * 7 - 2);
                    ctx.quadraticCurveTo(0, i * 7 - 8, 10, i * 7 - 2);
                    ctx.stroke();
                }

                ctx.fillStyle = '#fff8e8';
                ctx.beginPath();
                ctx.arc(0, -10, 4.2, 0, Math.PI * 2);
                ctx.fill();
            }

            if (e.maxHp > 1) {
                const hpPct = e.hp / e.maxHp;
                ctx.fillStyle = 'rgba(9, 51, 40, 0.78)';
                ctx.fillRect(-16, -e.height / 2 - 12, 32, 5);
                ctx.fillStyle = '#9cff8e';
                ctx.fillRect(-16, -e.height / 2 - 12, 32 * hpPct, 5);
            }

            ctx.restore();
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            const bob = Math.sin(frame * 0.18) * 1.5;
            ctx.translate(0, bob);

            ctx.save();
            ctx.globalAlpha = 0.24;
            ctx.fillStyle = '#ffd54a';
            ctx.beginPath();
            ctx.ellipse(0, 11, 31, 34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#6f7884';
            ctx.beginPath();
            ctx.ellipse(0, 5, 24, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#aab4be';
            ctx.beginPath();
            ctx.ellipse(0, 18, 14, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2b3349';
            ctx.beginPath();
            ctx.ellipse(0, -9, 20, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff8e8';
            ctx.beginPath();
            ctx.arc(-8, -11, 4.6, 0, Math.PI * 2);
            ctx.arc(8, -11, 4.6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.arc(-8, -11, 1.8, 0, Math.PI * 2);
            ctx.arc(8, -11, 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#6f7884';
            ctx.beginPath();
            ctx.moveTo(-20, -18); ctx.lineTo(-12, -36); ctx.lineTo(-3, -21); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, -18); ctx.lineTo(12, -36); ctx.lineTo(3, -21); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ffb86c';
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.lineTo(13, 2);
            ctx.quadraticCurveTo(2, 9, -9, 2);
            ctx.closePath();
            ctx.fill();

            const wingLift = Math.sin(frame * 0.32) * 5;
            ctx.fillStyle = '#e7edf2';
            ctx.strokeStyle = 'rgba(65, 82, 102, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-17, 0);
            ctx.quadraticCurveTo(-34, 8 + wingLift, -27, 25);
            ctx.quadraticCurveTo(-15, 19, -5, 11);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(17, 0);
            ctx.quadraticCurveTo(34, 8 - wingLift, 27, 25);
            ctx.quadraticCurveTo(15, 19, 5, 11);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#2b3241';
            ctx.beginPath();
            ctx.roundRect(-10, -42, 20, 20, 4);
            ctx.fill();
            ctx.fillStyle = '#8fdfff';
            ctx.fillRect(-6, -38, 12, 12);
            ctx.fillStyle = '#ffd54a';
            ctx.beginPath();
            ctx.arc(0, -23, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 6, 23, 0.35, 2.75);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;

            ctx.save();
            ctx.translate(dx, dy);
            ctx.clearRect(0, 0, width, height);

            const scrollSpeed = 2 + (score * 0.005);
            const scrollY = (frame * scrollSpeed) % height;

            drawBackground(scrollY);

            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 5, 9, -0.18, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y - 7);
                ctx.lineTo(p.x, p.y + 12);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 164, 41, 0.65)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y + 8);
                ctx.lineTo(p.x, p.y + 16);
                ctx.stroke();
            });

            enemies.forEach(drawEnemy);
            drawPlayer();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            frame++;
            spawnEnemy();
            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. UI BINDINGS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('start', { cooldown: 120 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('click', { cooldown: 120 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
