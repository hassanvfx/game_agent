<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Momcore Meme Bouquet Defense</title>
    <!-- [agent-note][world-design] authored-world: brainrot 3d art mom's day | mechanics preserved: canvas shooter loop/input/collision/scoring -->
    <!-- [agent-note][stage4] resolved-font: title=Audiowide, ui=Exo 2 | source: catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #271037;
            --bg-bottom: #2a1330;
            --panel-fill: rgba(54, 24, 67, 0.84);
            --panel-stroke: rgba(255, 213, 74, 0.74);
            --panel-glow: rgba(255, 95, 162, 0.3);
            --ui-cyan: #9efeff;
            --ui-yellow: #ffd54a;
            --ui-orange: #ff8a3d;
            --ui-red: #ff5577;
            --ui-green: #7dffb2;
            --mom-blush: #ff78a8;
            --petal-lavender: #c993ff;
            --card-cream: #fff4d6;
            --ink-outline: #291526;
            --text-main: #fff8e8;
            --text-dim: rgba(255, 248, 232, 0.84);
            --shadow-hard: 0 6px 0 rgba(64, 19, 10, 0.9);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 195, 86, 0.16), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(158, 254, 255, 0.14), transparent 20%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-fill {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .ui-root {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }

        .hidden {
            display: none !important;
        }

        .panel {
            position: relative;
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 244, 214, 0.2), transparent 23%),
                radial-gradient(circle at 85% 16%, rgba(158, 254, 255, 0.18), transparent 22%),
                linear-gradient(180deg, rgba(63, 32, 102, 0.96), rgba(23, 13, 43, 0.94)),
                rgba(27, 16, 47, 0.84);
            border: 2px solid var(--panel-stroke);
            border-radius: 28px;
            box-shadow:
                0 0 0 2px rgba(255, 248, 232, 0.08) inset,
                0 18px 40px rgba(0, 0, 0, 0.42),
                0 0 28px var(--panel-glow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 20px;
            border: 1px solid rgba(158, 254, 255, 0.18);
            pointer-events: none;
        }

        .panel::after {
            content: "♡  ✦  MOM  ✦  ♡";
            position: absolute;
            left: 50%;
            bottom: 9px;
            transform: translateX(-50%);
            color: rgba(255, 213, 74, 0.34);
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.22em;
            white-space: nowrap;
            pointer-events: none;
        }

        .center-card {
            width: min(92vw, 420px);
            margin: 0 4px;
            padding: 24px 22px 28px;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        .title-stack {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .arcade-title,
        .arcade-button {
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.06em;
        }

        .arcade-title {
            margin: 0;
            font-size: clamp(2.5rem, 9vw, 4.4rem);
            line-height: 0.9;
            color: var(--ui-yellow);
            text-shadow:
                0 3px 0 rgba(106, 49, 0, 0.95),
                0 0 18px rgba(255, 194, 72, 0.36);
        }

        .subtitle {
            margin: 0 0 16px;
            font-size: clamp(0.96rem, 3.8vw, 1.15rem);
            line-height: 1.35;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .chip-row {
            display: grid;
            gap: 8px;
            margin: 0 0 18px;
        }

        .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 10px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 18% 22%, rgba(255, 244, 214, 0.16), transparent 24%),
                rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(158, 254, 255, 0.25);
            color: var(--text-dim);
            font-size: clamp(0.82rem, 3.3vw, 1rem);
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
            box-shadow: 0 4px 0 rgba(41, 21, 38, 0.28);
        }

        .chip .emoji {
            font-size: 1.1em;
        }

        .arcade-button {
            appearance: none;
            border: 0;
            width: 100%;
            max-width: 280px;
            min-height: 54px;
            padding: 14px 18px;
            border-radius: 999px;
            color: #fff9ef;
            font-size: clamp(1rem, 4.2vw, 1.35rem);
            line-height: 1;
            text-align: center;
            background: linear-gradient(180deg, #ffcf4d, var(--ui-orange));
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                var(--shadow-hard),
                0 10px 24px rgba(255, 122, 49, 0.34);
            text-shadow: 0 2px 0 rgba(109, 41, 0, 0.8);
            transform: translateY(0);
            transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
            cursor: pointer;
        }

        .arcade-button:hover,
        .arcade-button:focus-visible {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
            outline: none;
        }

        .arcade-button:active {
            transform: translateY(3px) scale(0.985);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 3px 0 rgba(64, 19, 10, 0.9),
                0 6px 14px rgba(255, 122, 49, 0.25);
        }

        .arcade-button.green {
            background: linear-gradient(180deg, #8cff9b, #30cb68);
            text-shadow: 0 2px 0 rgba(8, 92, 29, 0.8);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 6px 0 rgba(10, 88, 33, 0.9),
                0 10px 24px rgba(48, 203, 104, 0.32);
        }

        .game-over-title {
            color: #ff7c95;
            text-shadow:
                0 3px 0 rgba(107, 15, 38, 0.95),
                0 0 18px rgba(255, 88, 120, 0.35);
            font-size: clamp(2rem, 8vw, 3.3rem);
            margin: 0 0 10px;
        }

        .score-line {
            margin: 0 0 12px;
            font-size: clamp(1rem, 4.5vw, 1.35rem);
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .score-line strong {
            color: var(--ui-yellow);
        }

        .body-copy {
            margin: 0 0 20px;
            color: var(--text-dim);
            font-size: clamp(0.86rem, 3.6vw, 1rem);
            line-height: 1.45;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            min-width: 118px;
            padding: 10px 12px 9px;
            border-radius: 18px;
            background:
                radial-gradient(circle at 18% 14%, rgba(255, 244, 214, 0.15), transparent 28%),
                linear-gradient(180deg, rgba(30, 18, 52, 0.96), rgba(15, 11, 27, 0.92));
            border: 2px solid rgba(158, 254, 255, 0.45);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 12px 24px rgba(0, 0, 0, 0.24),
                0 0 18px rgba(158, 254, 255, 0.16);
        }

        .hud-label {
            font-size: 0.68rem;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: rgba(255, 248, 232, 0.74);
        }

        .hud-value {
            margin-top: 5px;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.5rem, 5.5vw, 2.15rem);
            line-height: 1;
            letter-spacing: 0.05em;
            color: var(--ui-yellow);
            text-shadow:
                0 2px 0 rgba(106, 49, 0, 0.95),
                0 0 16px rgba(255, 213, 74, 0.25);
        }

        .meme-gif {
            position: absolute;
            width: clamp(78px, 20vw, 132px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: scale(0.82) translateY(16px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 9;
        }

        .meme-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        .meme-gif.hit {
            right: 12px;
            bottom: max(88px, env(safe-area-inset-bottom) + 64px);
        }

        .meme-gif.fail {
            left: 12px;
            top: max(84px, env(safe-area-inset-top) + 64px);
        }

        .gif-label {
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(20, 11, 32, 0.88);
            border: 1px solid rgba(255, 213, 74, 0.45);
            color: var(--text-main);
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .health-strip {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-end;
            min-height: 56px;
        }

        .heart-icon {
            color: var(--ui-red);
            filter: drop-shadow(0 2px 0 rgba(75, 10, 28, 0.85)) drop-shadow(0 0 8px rgba(255, 85, 119, 0.3));
        }

        .damage-flash {
            animation: pulse-red 0.2s ease-in-out;
        }

        @keyframes pulse-red {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 0, 60, 0.22); }
        }

        @media (max-width: 520px) {
            .center-card {
                padding: 20px 16px;
                border-radius: 24px;
            }

            .panel::before {
                inset: 8px;
                border-radius: 17px;
            }

            .hud-card {
                min-width: 102px;
                padding: 8px 10px 8px;
                border-radius: 16px;
            }

            .hud-value {
                font-size: clamp(1.35rem, 6.2vw, 1.85rem);
            }

            .health-strip {
                min-height: 48px;
                gap: 4px;
            }

            .meme-gif.hit {
                right: 8px;
                bottom: max(82px, env(safe-area-inset-bottom) + 56px);
            }

            .meme-gif.fail {
                left: 8px;
                top: max(76px, env(safe-area-inset-top) + 56px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-fill">
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Overlay for Damage -->
        <div id="flash-overlay" class="overlay"></div>

        <!-- [agent-note][stage3] resolved-gif: hit/fail feedback overlays | source: catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <div class="overlay" aria-hidden="true">
            <div id="hit-gif-wrap" class="meme-gif hit">
                <img
                    id="hit-gif"
                    src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">CHORES POPPED</span>
            </div>
            <div id="fail-gif-wrap" class="meme-gif fail">
                <img
                    id="fail-gif"
                    src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">MOM PANIC</span>
            </div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="ui-root">

            <!-- Start Screen -->
            <div id="start-screen" class="panel center-card">
                <div class="title-stack">
                    <h1 class="arcade-title">MOMCORE<br>BOUQUET</h1>
                    <p class="subtitle">A glossy trash panda protects Mom's Day from chore chaos.</p>
                </div>
                <div class="chip-row">
                    <p class="chip"><span class="emoji">👆</span><span>Drag to Move</span></p>
                    <p class="chip"><span class="emoji">💌</span><span>Auto-launch love cards</span></p>
                    <p class="chip"><span class="emoji">🧹</span><span>Pop the chore disasters</span></p>
                </div>
                <button id="start-btn" class="arcade-button">
                    SAVE MOM'S FEED
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden panel center-card">
                <h2 class="arcade-title game-over-title">BRUNCH BURIED!</h2>
                <p class="score-line">Mom Points: <strong id="finalScore">0</strong></p>
                <p class="body-copy">The chore storm buried Mom's celebration feed.</p>
                <button id="restart-btn" class="arcade-button green">
                    REWRAP
                </button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-card">
                    <div class="hud-label">Mom Points</div>
                    <div class="hud-value" id="score">0</div>
                </div>

                <div class="health-strip" id="health-container">
                    <!-- Hearts injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & AUDIO */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/village_bgm_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/village_npc_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/sfx/village_item_01.mp3",
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_character_01.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/village_enemy_01.mp3",
                kill: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3",
                damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/village_enemy_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_wind_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_defeat_01.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.audioReady = false;
                this.muted = false;
                this.lastPlayedAt = {};
                this.bgm = this.createAudio(ASSETS.bgm, 0.2, true);
                this.sfx = Object.fromEntries(
                    Object.entries(ASSETS.sfx).map(([key, url]) => [key, this.createAudio(url, this.getVolume(key), false)])
                );
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                audio.playsInline = true;
                return audio;
            }

            getVolume(key) {
                return {
                    start: 0.55,
                    click: 0.42,
                    shoot: 0.18,
                    hit: 0.4,
                    kill: 0.48,
                    damage: 0.5,
                    warning: 0.38,
                    fail: 0.58
                }[key] ?? 0.45;
            }

            prime() {
                if (this.audioReady) return;
                this.audioReady = true;
                [...Object.values(this.sfx), this.bgm].forEach(sound => {
                    sound.load();
                });
            }

            playBGM() {
                if (this.muted) return;
                this.prime();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { cooldown = 0 } = {}) {
                if (this.muted || !this.sfx[key]) return;
                const now = performance.now();
                if (cooldown && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const source = this.sfx[key];
                try {
                    source.pause();
                    source.currentTime = 0;
                    source.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const hitGifWrap = document.getElementById('hit-gif-wrap');
        const failGifWrap = document.getElementById('fail-gif-wrap');
        let gifTimers = {};

        /** 2. CONFIG & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;

        let shake = 0;

        const PLAYER_CONFIG = {
            width: 50,
            height: 60,
            speed: 0.15,
            fireRate: 15,
            maxHealth: 3
        };

        let player = {
            x: 0,
            y: 0,
            targetX: 0,
            health: 3,
            cooldown: 0
        };

        let projectiles = [];
        let enemies = [];
        let particles = [];
        let lowHealthWarned = false;

        const ENEMIES = [
            { name: 'Broom', color: '#ff6c8f', width: 30, height: 50, hp: 1, score: 10, speedMod: 1.0 },
            { name: 'Vacuum', color: '#9efeff', width: 40, height: 40, hp: 2, score: 20, speedMod: 0.8 },
            { name: 'Spray', color: '#c993ff', width: 25, height: 45, hp: 1, score: 30, speedMod: 1.2, weave: true }
        ];

        /** 3. RESIZE & INPUT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            if (!gameActive) {
                player.x = width / 2;
                player.targetX = width / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        const handleInput = (clientX) => {
            if (!gameActive) return;
            player.targetX = Math.max(PLAYER_CONFIG.width / 2, Math.min(width - PLAYER_CONFIG.width / 2, clientX));
        };

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 4. GAME LOGIC */
        function showGif(target, duration = 950) {
            const element = target === 'hit' ? hitGifWrap : failGifWrap;
            if (!element) return;
            clearTimeout(gifTimers[target]);
            element.classList.add('visible');
            gifTimers[target] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        function initGame() {
            score = 0;
            frame = 0;
            shake = 0;
            player.health = PLAYER_CONFIG.maxHealth;
            player.x = width / 2;
            player.targetX = width / 2;
            player.cooldown = 0;
            lowHealthWarned = false;

            projectiles = [];
            enemies = [];
            particles = [];

            hitGifWrap.classList.remove('visible');
            failGifWrap.classList.remove('visible');
            updateHUD();
        }

        function getVisualPhase() {
            if (score >= 550) return { level: 5, name: 'MOMCORE SHRINE', glow: '#ffd54a' };
            if (score >= 350) return { level: 4, name: 'GROUP CHAT STORM', glow: '#9efeff' };
            if (score >= 200) return { level: 3, name: 'GIFT WRAP RUSH', glow: '#ff8a3d' };
            if (score >= 100) return { level: 2, name: 'BOUQUET RUNWAY', glow: '#7dffb2' };
            return { level: 1, name: 'CARD WARMUP', glow: '#ff78a8' };
        }

        function updateHUD() {
            const scoreEl = document.getElementById('score');
            const phase = getVisualPhase();
            scoreEl.innerText = score;
            scoreEl.title = `Level ${phase.level}: ${phase.name}`;
            scoreEl.style.color = phase.glow;
            const hpContainer = document.getElementById('health-container');
            hpContainer.innerHTML = '';
            for (let i = 0; i < PLAYER_CONFIG.maxHealth; i++) {
                const heart = document.createElement('div');
                heart.className = `heart-icon transition-all duration-300 ${i < player.health ? 'opacity-100 scale-100' : 'opacity-25 scale-75'}`;
                heart.style.fontSize = '2rem';
                heart.style.transition = 'transform 180ms ease, opacity 180ms ease';
                heart.style.opacity = i < player.health ? '1' : '0.25';
                heart.style.transform = i < player.health ? 'scale(1)' : 'scale(0.75)';
                heart.innerHTML = '❤️';
                hpContainer.appendChild(heart);
            }
        }

        function spawnEnemy() {
            const baseRate = 60;
            const rate = Math.max(20, baseRate - Math.floor(score / 50));

            if (frame % rate === 0) {
                const type = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                enemies.push({
                    x: Math.random() * (width - type.width) + type.width / 2,
                    y: -50,
                    width: type.width,
                    height: type.height,
                    color: type.color,
                    hp: type.hp,
                    maxHp: type.hp,
                    score: type.score,
                    speed: (3 + Math.random() * 2 + (score * 0.01)) * type.speedMod,
                    weave: type.weave || false,
                    weaveOffset: Math.random() * Math.PI * 2,
                    type: type.name
                });
            }
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function update() {
            player.x += (player.targetX - player.x) * PLAYER_CONFIG.speed;

            if (player.cooldown > 0) player.cooldown--;
            else {
                projectiles.push({
                    x: player.x,
                    y: player.y - 20,
                    width: 8,
                    height: 16,
                    speed: 12,
                    color: '#ffd54a'
                });
                audio.playSFX('shoot', { cooldown: 90 });
                player.cooldown = PLAYER_CONFIG.fireRate;
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.y -= p.speed;
                if (p.y < -20) projectiles.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;

                if (e.weave) {
                    e.x += Math.sin(frame * 0.1 + e.weaveOffset) * 2;
                }

                if (e.y > height + 50) {
                    enemies.splice(i, 1);
                    continue;
                }

                if (
                    e.x < player.x + PLAYER_CONFIG.width / 2 &&
                    e.x + e.width > player.x - PLAYER_CONFIG.width / 2 &&
                    e.y < player.y + PLAYER_CONFIG.height / 2 &&
                    e.y + e.height > player.y - PLAYER_CONFIG.height / 2
                ) {
                    takeDamage();
                    createParticles(e.x, e.y, e.color, 15);
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    if (
                        p.x < e.x + e.width &&
                        p.x + p.width > e.x &&
                        p.y < e.y + e.height &&
                        p.y + p.height > e.y
                    ) {
                        e.hp--;
                        projectiles.splice(j, 1);
                        createParticles(p.x, p.y, '#fff', 3);
                        audio.playSFX('hit', { cooldown: 70 });

                        if (e.hp <= 0) {
                            score += e.score;
                            audio.playSFX('kill', { cooldown: 120 });
                            createParticles(e.x, e.y, e.color, 10);
                            showGif('hit', 880);
                            enemies.splice(i, 1);
                            updateHUD();
                        } else {
                            e.flash = 5;
                        }
                        break;
                    }
                }
                if (e.flash > 0) e.flash--;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        function takeDamage() {
            player.health--;
            shake = 20;
            audio.playSFX('damage', { cooldown: 150 });
            showGif('fail', 1100);

            const overlay = document.getElementById('flash-overlay');
            overlay.classList.remove('damage-flash');
            void overlay.offsetWidth;
            overlay.classList.add('damage-flash');

            if (player.health === 1 && !lowHealthWarned) {
                lowHealthWarned = true;
                audio.playSFX('warning', { cooldown: 300 });
            }

            updateHUD();

            if (player.health <= 0) {
                gameOver();
            }
        }

        /** 5. RENDERING */
        function drawHeartPath(x, y, size) {
            ctx.moveTo(x, y + size * 0.45);
            ctx.bezierCurveTo(x - size * 1.55, y - size * 0.45, x - size * 0.85, y - size * 1.6, x, y - size * 0.65);
            ctx.bezierCurveTo(x + size * 0.85, y - size * 1.6, x + size * 1.55, y - size * 0.45, x, y + size * 0.45);
        }

        function drawStickerStar(x, y, radius, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.sin(frame * 0.018 + x) * 0.12);
            ctx.fillStyle = color;
            ctx.strokeStyle = 'rgba(41, 21, 38, 0.24)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const r = i % 2 === 0 ? radius : radius * 0.42;
                const a = -Math.PI / 2 + i * Math.PI / 4;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawBackground(scrollY) {
            const phase = getVisualPhase();
            const phaseGlow = Math.min(score / 600, 1);
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#271037');
            bgGradient.addColorStop(0.38, `rgb(${90 + phaseGlow * 54}, ${36 + phaseGlow * 12}, ${93 + phaseGlow * 42})`);
            bgGradient.addColorStop(1, '#2a1330');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            const halo = ctx.createRadialGradient(width / 2, height * 0.18, 20, width / 2, height * 0.18, Math.max(width, height) * 0.72);
            halo.addColorStop(0, phase.level >= 5 ? 'rgba(255, 213, 74, 0.24)' : 'rgba(255, 120, 168, 0.16)');
            halo.addColorStop(0.52, phase.level >= 4 ? 'rgba(158, 254, 255, 0.11)' : 'rgba(201, 147, 255, 0.08)');
            halo.addColorStop(1, 'rgba(39, 16, 55, 0)');
            ctx.fillStyle = halo;
            ctx.fillRect(0, 0, width, height);

            const laneX = width * 0.15;
            const laneW = width * 0.7;
            ctx.fillStyle = 'rgba(255, 244, 214, 0.94)';
            ctx.beginPath();
            ctx.roundRect(laneX, -24, laneW, height + 48, Math.min(34, width * 0.045));
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 120, 168, 0.12)';
            ctx.beginPath();
            ctx.roundRect(width * 0.18, -18, width * 0.64, height + 36, Math.min(28, width * 0.04));
            ctx.fill();

            ctx.save();
            ctx.beginPath();
            ctx.rect(width * 0.18, 0, width * 0.64, height);
            ctx.clip();

            for (let y = -120 + (scrollY % 180); y < height + 180; y += 180) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
                ctx.beginPath();
                ctx.roundRect(width * 0.27, y, width * 0.46, 78, 18);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 95, 162, 0.2)';
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 12]);
                ctx.beginPath();
                ctx.moveTo(width * 0.31, y + 39);
                ctx.lineTo(width * 0.69, y + 39);
                ctx.stroke();
                ctx.setLineDash([]);

                if (phase.level >= 3) {
                    ctx.strokeStyle = 'rgba(255, 138, 61, 0.14)';
                    ctx.lineWidth = 12;
                    ctx.beginPath();
                    ctx.moveTo(width * 0.18, y + 120);
                    ctx.lineTo(width * 0.82, y + 18);
                    ctx.stroke();
                }
            }
            ctx.restore();

            ctx.strokeStyle = 'rgba(255, 213, 74, 0.34)';
            ctx.lineWidth = 5;
            ctx.setLineDash([24, 18]);
            ctx.beginPath();
            ctx.moveTo(width * 0.28, -height + scrollY);
            ctx.lineTo(width * 0.28, height * 2 + scrollY);
            ctx.moveTo(width * 0.72, -height + scrollY);
            ctx.lineTo(width * 0.72, height * 2 + scrollY);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let i = -1; i < 5; i++) {
                const y = (scrollY * 0.72 + i * height * 0.42) % (height + 150) - 90;
                const sway = Math.sin(frame * 0.015 + i) * 5;
                ctx.strokeStyle = 'rgba(125, 255, 178, 0.24)';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(width * 0.08 + sway, y);
                ctx.quadraticCurveTo(width * 0.1 - sway, y + 58, width * 0.08 + sway, y + 126);
                ctx.moveTo(width * 0.92 - sway, y + 42);
                ctx.quadraticCurveTo(width * 0.9 + sway, y + 96, width * 0.92 - sway, y + 168);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 95, 162, 0.27)';
                ctx.beginPath();
                ctx.ellipse(width * 0.08 + sway, y + 12, 21, 9, -0.72, 0, Math.PI * 2);
                ctx.ellipse(width * 0.08 + sway, y + 38, 21, 9, 0.72, 0, Math.PI * 2);
                ctx.ellipse(width * 0.92 - sway, y + 58, 21, 9, -0.72, 0, Math.PI * 2);
                ctx.ellipse(width * 0.92 - sway, y + 86, 21, 9, 0.72, 0, Math.PI * 2);
                ctx.fill();

                if (phase.level >= 4) {
                    ctx.fillStyle = 'rgba(158, 254, 255, 0.14)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.roundRect(width * 0.31, y + 78, 62, 28, 13);
                    ctx.roundRect(width * 0.56, y + 188, 76, 30, 14);
                    ctx.fill();
                    ctx.stroke();
                }
            }

            for (let i = 0; i < 30; i++) {
                const x = ((i * 157) % width) + Math.sin(frame * 0.012 + i) * 11;
                const y = (i * 67 + scrollY * (0.22 + (i % 4) * 0.075)) % (height + 80) - 40;
                const size = 4 + (i % 5);
                const color = i % 4 === 0 ? 'rgba(255, 120, 168, 0.24)' : (i % 4 === 1 ? 'rgba(255, 213, 74, 0.2)' : (i % 4 === 2 ? 'rgba(201, 147, 255, 0.17)' : 'rgba(125, 255, 178, 0.14)'));
                if (i % 5 === 0) {
                    drawStickerStar(x, y, size + 3, color);
                } else {
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    drawHeartPath(x, y, size);
                    ctx.fill();
                }
            }

            ctx.fillStyle = 'rgba(41, 21, 38, 0.12)';
            ctx.fillRect(width * 0.15, 0, 5, height);
            ctx.fillRect(width * 0.85 - 5, 0, 5, height);

            ctx.fillStyle = 'rgba(41, 21, 38, 0.34)';
            ctx.font = '700 10px Exo 2, system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`LV ${phase.level} · ${phase.name}`, width / 2, Math.max(76, height * 0.11));
        }

        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            ctx.shadowColor = e.flash > 0 ? 'rgba(255,255,255,0.8)' : 'rgba(255, 85, 119, 0.28)';
            ctx.shadowBlur = e.flash > 0 ? 16 : 8;
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
            ctx.strokeStyle = 'rgba(33, 12, 30, 0.86)';
            ctx.lineWidth = 3;

            if (e.type === 'Broom') {
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#ff78a8';
                ctx.beginPath();
                ctx.roundRect(-12, -16, 24, 20, 9);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#291526';
                ctx.beginPath();
                ctx.arc(-4, -8, 2, 0, Math.PI * 2);
                ctx.arc(5, -8, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#7a4a21';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(0, -26);
                ctx.lineTo(0, 10);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 244, 214, 0.62)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-6, -24);
                ctx.lineTo(4, 6);
                ctx.stroke();

                ctx.fillStyle = e.flash > 0 ? '#fff2a6' : '#ffc84d';
                ctx.beginPath();
                ctx.moveTo(-18, 7);
                ctx.lineTo(18, 7);
                ctx.lineTo(22, 24);
                ctx.lineTo(-22, 24);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(41, 21, 38, 0.38)';
                ctx.lineWidth = 1.5;
                for (let x = -12; x <= 12; x += 6) {
                    ctx.beginPath();
                    ctx.moveTo(x, 10);
                    ctx.lineTo(x * 1.25, 23);
                    ctx.stroke();
                }
            } else if (e.type === 'Vacuum') {
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#9efeff';
                ctx.beginPath();
                ctx.roundRect(-22, -21, 44, 30, 11);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 244, 214, 0.42)';
                ctx.beginPath();
                ctx.roundRect(-13, -15, 26, 9, 5);
                ctx.fill();

                ctx.fillStyle = '#ff5fa2';
                ctx.beginPath();
                ctx.moveTo(-21, -20);
                ctx.quadraticCurveTo(0, -34, 21, -20);
                ctx.lineTo(13, -17);
                ctx.quadraticCurveTo(0, -26, -13, -17);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#7dffb2';
                ctx.beginPath();
                ctx.arc(0, 8, 14, 0, Math.PI, false);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#15111b';
                ctx.beginPath(); ctx.arc(-18, 9, 5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(18, 9, 5, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(12, -12);
                ctx.quadraticCurveTo(31, -25, 24, -38);
                ctx.stroke();
            } else {
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#c993ff';
                ctx.beginPath();
                ctx.moveTo(0, -e.height / 2);
                ctx.lineTo(e.width / 2, e.height / 2 - 5);
                ctx.lineTo(0, e.height / 2);
                ctx.lineTo(-e.width / 2, e.height / 2 - 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = '#ffd54a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-7, -14);
                ctx.quadraticCurveTo(7, -5, -5, 7);
                ctx.quadraticCurveTo(9, 14, -1, 23);
                ctx.stroke();

                ctx.fillStyle = '#fef3c7';
                ctx.beginPath();
                ctx.arc(0, -7, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#291526';
                ctx.beginPath();
                ctx.arc(0, -7, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;

            if (e.maxHp > 1) {
                const hpPct = e.hp / e.maxHp;
                ctx.fillStyle = 'rgba(64, 0, 12, 0.8)';
                ctx.fillRect(-16, -e.height / 2 - 12, 32, 5);
                ctx.fillStyle = '#7dff8e';
                ctx.fillRect(-16, -e.height / 2 - 12, 32 * hpPct, 5);
                ctx.strokeStyle = 'rgba(255, 244, 214, 0.42)';
                ctx.lineWidth = 1;
                ctx.strokeRect(-16, -e.height / 2 - 12, 32, 5);
            }

            ctx.restore();
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            ctx.shadowColor = 'rgba(255, 213, 74, 0.28)';
            ctx.shadowBlur = 14;
            ctx.fillStyle = 'rgba(41, 21, 38, 0.35)';
            ctx.beginPath();
            ctx.ellipse(0, 30, 24, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#291526';
            ctx.beginPath();
            ctx.ellipse(0, 5, 28, 31, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#7d8792';
            ctx.beginPath();
            ctx.ellipse(0, 4, 25, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#98a3ad';
            ctx.beginPath();
            ctx.ellipse(0, 20, 15, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#293248';
            ctx.beginPath();
            ctx.ellipse(0, -8, 20, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f7f2e6';
            ctx.beginPath();
            ctx.arc(-8, -10, 4.4, 0, Math.PI * 2);
            ctx.arc(8, -10, 4.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.arc(-8, -10, 1.7, 0, Math.PI * 2);
            ctx.arc(8, -10, 1.7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#291526';
            ctx.beginPath();
            ctx.moveTo(-22, -17); ctx.lineTo(-10, -39); ctx.lineTo(-1, -20); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(22, -17); ctx.lineTo(10, -39); ctx.lineTo(1, -20); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#7d8792';
            ctx.beginPath();
            ctx.moveTo(-20, -18); ctx.lineTo(-10, -36); ctx.lineTo(-2, -20); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, -18); ctx.lineTo(10, -36); ctx.lineTo(2, -20); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ffb86c';
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff5fa2';
            ctx.strokeStyle = '#291526';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-17, -39);
            ctx.lineTo(-8, -53);
            ctx.lineTo(-2, -41);
            ctx.lineTo(0, -55);
            ctx.lineTo(3, -41);
            ctx.lineTo(9, -53);
            ctx.lineTo(17, -39);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#7dffb2';
            ctx.beginPath();
            ctx.ellipse(-12, -46, 5, 11, -0.65, 0, Math.PI * 2);
            ctx.ellipse(12, -46, 5, 11, 0.65, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2b3241';
            ctx.fillRect(-9, -41, 18, 19);
            ctx.fillStyle = '#ffd54a';
            ctx.fillRect(-6, -38, 12, 12);
            ctx.fillStyle = '#111827';
            ctx.fillRect(-12, -24, 24, 5);

            ctx.fillStyle = '#fff4d6';
            ctx.strokeStyle = '#291526';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(12, 3, 18, 14, 3);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff5577';
            ctx.beginPath();
            drawHeartPath(21, 10, 3.4);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 6, 23, 0.4, 2.7);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;

            ctx.save();
            ctx.translate(dx, dy);
            ctx.clearRect(0, 0, width, height);

            const scrollSpeed = 2 + (score * 0.005);
            const scrollY = (frame * scrollSpeed) % height;

            drawBackground(scrollY);

            projectiles.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.shadowColor = 'rgba(255, 213, 74, 0.42)';
                ctx.shadowBlur = 8;

                ctx.fillStyle = '#fff4d6';
                ctx.strokeStyle = 'rgba(41, 21, 38, 0.7)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-6, -9, 12, 16, 3);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = p.color;
                ctx.beginPath();
                drawHeartPath(0, -1, 3.4);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.fillRect(-2, 7, 4, 10);

                ctx.strokeStyle = 'rgba(255, 164, 41, 0.65)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 8);
                ctx.lineTo(0, 16);
                ctx.stroke();
                ctx.restore();
            });

            enemies.forEach(drawEnemy);
            drawPlayer();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color === '#fff' ? '#fff4d6' : p.color;
                ctx.beginPath();
                if (p.size > 4.5) {
                    drawHeartPath(p.x, p.y, p.size);
                } else {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            frame++;
            spawnEnemy();
            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. UI BINDINGS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('start', { cooldown: 120 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('click', { cooldown: 120 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
