<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Hogwarts Spellstorm Defense</title>
    <!-- [agent-note][world-design-v4] authored-world: Hogwarts Spellstorm Defense | preserve: controls, collision, scoring, health, spawn timing -->
    <!-- [agent-note][stage4] resolved-font: title=Audiowide, ui=Exo 2 | source: catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #12091e;
            --bg-bottom: #070812;
            --panel-fill: rgba(28, 16, 50, 0.86);
            --panel-stroke: rgba(255, 216, 107, 0.78);
            --panel-glow: rgba(142, 233, 255, 0.24);
            --ui-cyan: #8ee9ff;
            --ui-yellow: #ffd86b;
            --ui-orange: #c77a2b;
            --ui-red: #ff5b7a;
            --ui-green: #3fe08a;
            --ui-purple: #6f4cff;
            --ink-shadow: #160b22;
            --parchment: #fff2c8;
            --text-main: #fff2c8;
            --text-dim: rgba(255, 242, 200, 0.84);
            --shadow-hard: 0 6px 0 rgba(55, 23, 4, 0.9);
            --runic-line: rgba(255, 216, 107, 0.28);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 195, 86, 0.16), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(158, 254, 255, 0.14), transparent 20%),
                repeating-linear-gradient(115deg, rgba(255, 216, 107, 0.045) 0 1px, transparent 1px 46px),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            background-size: auto, auto, 220px 220px, auto;
            animation: castle-aurora 18s ease-in-out infinite alternate;
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-fill {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .ui-root {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }

        .hidden {
            display: none !important;
        }

        .panel {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 22% 16%, rgba(255, 216, 107, 0.18), transparent 24%),
                linear-gradient(180deg, rgba(63, 32, 102, 0.96), rgba(23, 13, 43, 0.94)),
                rgba(27, 16, 47, 0.84);
            border: 2px solid var(--panel-stroke);
            border-radius: 28px;
            box-shadow:
                0 0 0 2px rgba(255, 248, 232, 0.08) inset,
                0 18px 40px rgba(0, 0, 0, 0.42),
                0 0 28px var(--panel-glow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 20px;
            border: 1px solid rgba(158, 254, 255, 0.18);
            pointer-events: none;
        }

        .panel::after {
            content: "✦ ϟ ✦";
            position: absolute;
            left: 50%;
            top: 12px;
            transform: translateX(-50%);
            color: var(--runic-line);
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.55em;
            text-shadow: 0 0 12px rgba(255, 216, 107, 0.34);
            pointer-events: none;
        }

        .center-card {
            width: min(92vw, 420px);
            margin: 0 4px;
            padding: 24px 22px;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        .title-stack {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .arcade-title,
        .arcade-button {
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.06em;
        }

        .arcade-title {
            margin: 0;
            font-size: clamp(2.35rem, 8.2vw, 4.1rem);
            line-height: 0.9;
            color: var(--ui-yellow);
            text-shadow:
                0 3px 0 rgba(106, 49, 0, 0.95),
                0 0 18px rgba(255, 194, 72, 0.36),
                0 0 34px rgba(142, 233, 255, 0.14);
        }

        .subtitle {
            margin: 0 0 16px;
            font-size: clamp(0.96rem, 3.8vw, 1.15rem);
            line-height: 1.35;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .chip-row {
            display: grid;
            gap: 8px;
            margin: 0 0 18px;
        }

        .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 38px;
            padding: 8px 10px;
            border-radius: 999px;
            background:
                linear-gradient(90deg, rgba(255, 216, 107, 0.09), rgba(142, 233, 255, 0.08)),
                rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(158, 254, 255, 0.25);
            color: var(--text-dim);
            font-size: clamp(0.82rem, 3.3vw, 1rem);
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        }

        .chip .emoji {
            font-size: 1.1em;
        }

        .arcade-button {
            appearance: none;
            border: 0;
            width: 100%;
            max-width: 280px;
            min-height: 54px;
            padding: 14px 18px;
            border-radius: 999px;
            color: #fff9ef;
            font-size: clamp(1rem, 4.2vw, 1.35rem);
            line-height: 1;
            text-align: center;
            background:
                radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.55), transparent 22%),
                linear-gradient(180deg, #ffcf4d, var(--ui-orange));
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                var(--shadow-hard),
                0 10px 24px rgba(255, 122, 49, 0.34),
                0 0 24px rgba(255, 216, 107, 0.22);
            text-shadow: 0 2px 0 rgba(109, 41, 0, 0.8);
            transform: translateY(0);
            transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
            cursor: pointer;
        }

        .arcade-button:hover,
        .arcade-button:focus-visible {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
            outline: none;
        }

        .arcade-button:active {
            transform: translateY(3px) scale(0.985);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 3px 0 rgba(64, 19, 10, 0.9),
                0 6px 14px rgba(255, 122, 49, 0.25);
        }

        .arcade-button.green {
            background: linear-gradient(180deg, #8cff9b, #30cb68);
            text-shadow: 0 2px 0 rgba(8, 92, 29, 0.8);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 6px 0 rgba(10, 88, 33, 0.9),
                0 10px 24px rgba(48, 203, 104, 0.32);
        }

        .game-over-title {
            color: #ff7c95;
            text-shadow:
                0 3px 0 rgba(107, 15, 38, 0.95),
                0 0 18px rgba(255, 88, 120, 0.35);
            font-size: clamp(2rem, 8vw, 3.3rem);
            margin: 0 0 10px;
        }

        .score-line {
            margin: 0 0 12px;
            font-size: clamp(1rem, 4.5vw, 1.35rem);
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
        }

        .score-line strong {
            color: var(--ui-yellow);
        }

        .body-copy {
            margin: 0 0 20px;
            color: var(--text-dim);
            font-size: clamp(0.86rem, 3.6vw, 1rem);
            line-height: 1.45;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            min-width: 118px;
            padding: 10px 12px 9px;
            border-radius: 18px;
            background:
                linear-gradient(90deg, rgba(255, 216, 107, 0.08), transparent 40%),
                linear-gradient(180deg, rgba(30, 18, 52, 0.96), rgba(15, 11, 27, 0.92));
            border: 2px solid rgba(158, 254, 255, 0.45);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 12px 24px rgba(0, 0, 0, 0.24),
                0 0 18px rgba(158, 254, 255, 0.16);
        }

        .hud-label {
            font-size: 0.68rem;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: rgba(255, 248, 232, 0.74);
        }

        .hud-value {
            margin-top: 5px;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.5rem, 5.5vw, 2.15rem);
            line-height: 1;
            letter-spacing: 0.05em;
            color: var(--ui-yellow);
            text-shadow:
                0 2px 0 rgba(106, 49, 0, 0.95),
                0 0 16px rgba(255, 213, 74, 0.25);
        }

        .meme-gif {
            position: absolute;
            width: clamp(78px, 20vw, 132px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: scale(0.82) translateY(16px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 9;
        }

        .meme-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        .meme-gif.hit {
            right: 12px;
            bottom: max(88px, env(safe-area-inset-bottom) + 64px);
        }

        .meme-gif.fail {
            left: 12px;
            top: max(84px, env(safe-area-inset-top) + 64px);
        }

        .gif-label {
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(20, 11, 32, 0.88);
            border: 1px solid rgba(255, 213, 74, 0.45);
            color: var(--text-main);
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .health-strip {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-end;
            min-height: 56px;
        }

        .heart-icon {
            color: var(--ui-red);
            filter: drop-shadow(0 2px 0 rgba(75, 10, 28, 0.85)) drop-shadow(0 0 8px rgba(255, 85, 119, 0.3));
        }

        .damage-flash {
            animation: pulse-red 0.2s ease-in-out;
        }

        @keyframes castle-aurora {
            0% { background-position: 0 0, 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 72px -96px, 0 0; }
        }

        @keyframes pulse-red {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 0, 60, 0.22); }
        }

        @media (max-width: 520px) {
            .center-card {
                padding: 20px 16px;
                border-radius: 24px;
            }

            .panel::before {
                inset: 8px;
                border-radius: 17px;
            }

            .hud-card {
                min-width: 102px;
                padding: 8px 10px 8px;
                border-radius: 16px;
            }

            .hud-value {
                font-size: clamp(1.35rem, 6.2vw, 1.85rem);
            }

            .health-strip {
                min-height: 48px;
                gap: 4px;
            }

            .meme-gif.hit {
                right: 8px;
                bottom: max(82px, env(safe-area-inset-bottom) + 56px);
            }

            .meme-gif.fail {
                left: 8px;
                top: max(76px, env(safe-area-inset-top) + 56px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-fill">
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Overlay for Damage -->
        <div id="flash-overlay" class="overlay"></div>

        <!-- [agent-note][stage3] resolved-gif: hit/fail feedback overlays | source: catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <div class="overlay" aria-hidden="true">
            <div id="hit-gif-wrap" class="meme-gif hit">
                <img
                    id="hit-gif"
                    src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">SPELL LANDED</span>
            </div>
            <div id="fail-gif-wrap" class="meme-gif fail">
                <img
                    id="fail-gif"
                    src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
                    alt=""
                    width="132"
                    height="132">
                <span class="gif-label">WARD HIT</span>
            </div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="ui-root">

            <!-- Start Screen -->
            <div id="start-screen" class="panel center-card">
                <div class="title-stack">
                    <h1 class="arcade-title">HOGWARTS<br>SPELLSTORM</h1>
                    <p class="subtitle">Rogue charms are flooding the castle corridor.</p>
                </div>
                <div class="chip-row">
                    <p class="chip"><span class="emoji">👆</span><span>Drag to Move</span></p>
                    <p class="chip"><span class="emoji">✨</span><span>Auto-cast wand bolts</span></p>
                    <p class="chip"><span class="emoji">🛡️</span><span>Protect your Shield Charms</span></p>
                </div>
                <button id="start-btn" class="arcade-button">
                    DEFEND HOGWARTS
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden panel center-card">
                <h2 class="arcade-title game-over-title">WARDS BROKEN!</h2>
                <p class="score-line">House Points: <strong id="finalScore">0</strong></p>
                <p class="body-copy">The castle shields faltered under the spellstorm.</p>
                <button id="restart-btn" class="arcade-button green">
                    CAST AGAIN
                </button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-card">
                    <div class="hud-label">House Points</div>
                    <div class="hud-value" id="score">0</div>
                </div>

                <div class="health-strip" id="health-container">
                    <!-- Hearts injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & AUDIO */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/bgm/mystical_bgm_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_character_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3",
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_wind_01.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_enemy_01.mp3",
                kill: "https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_defeat_01.mp3",
                damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/dark_enemy_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/eerie_wind_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/dark_defeat_01.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.audioReady = false;
                this.muted = false;
                this.lastPlayedAt = {};
                this.bgm = this.createAudio(ASSETS.bgm, 0.2, true);
                this.sfx = Object.fromEntries(
                    Object.entries(ASSETS.sfx).map(([key, url]) => [key, this.createAudio(url, this.getVolume(key), false)])
                );
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                audio.playsInline = true;
                return audio;
            }

            getVolume(key) {
                return {
                    start: 0.55,
                    click: 0.42,
                    shoot: 0.18,
                    hit: 0.4,
                    kill: 0.48,
                    damage: 0.5,
                    warning: 0.38,
                    fail: 0.58
                }[key] ?? 0.45;
            }

            prime() {
                if (this.audioReady) return;
                this.audioReady = true;
                [...Object.values(this.sfx), this.bgm].forEach(sound => {
                    sound.load();
                });
            }

            playBGM() {
                if (this.muted) return;
                this.prime();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { cooldown = 0 } = {}) {
                if (this.muted || !this.sfx[key]) return;
                const now = performance.now();
                if (cooldown && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const source = this.sfx[key];
                try {
                    source.pause();
                    source.currentTime = 0;
                    source.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const hitGifWrap = document.getElementById('hit-gif-wrap');
        const failGifWrap = document.getElementById('fail-gif-wrap');
        let gifTimers = {};

        /** 2. CONFIG & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;

        let shake = 0;

        const PLAYER_CONFIG = {
            width: 50,
            height: 60,
            speed: 0.15,
            fireRate: 15,
            maxHealth: 3
        };

        let player = {
            x: 0,
            y: 0,
            targetX: 0,
            health: 3,
            cooldown: 0
        };

        let projectiles = [];
        let enemies = [];
        let particles = [];
        let lowHealthWarned = false;

        const ENEMIES = [
            { name: 'Broom', color: '#b86b32', width: 30, height: 50, hp: 1, score: 10, speedMod: 1.0 },
            { name: 'Vacuum', color: '#5c3f8f', width: 40, height: 40, hp: 2, score: 20, speedMod: 0.8 },
            { name: 'Spray', color: '#8ee9ff', width: 25, height: 45, hp: 1, score: 30, speedMod: 1.2, weave: true }
        ];

        /** 3. RESIZE & INPUT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            if (!gameActive) {
                player.x = width / 2;
                player.targetX = width / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        const handleInput = (clientX) => {
            if (!gameActive) return;
            player.targetX = Math.max(PLAYER_CONFIG.width / 2, Math.min(width - PLAYER_CONFIG.width / 2, clientX));
        };

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 4. GAME LOGIC */
        function showGif(target, duration = 950) {
            const element = target === 'hit' ? hitGifWrap : failGifWrap;
            if (!element) return;
            clearTimeout(gifTimers[target]);
            element.classList.add('visible');
            gifTimers[target] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        function initGame() {
            score = 0;
            frame = 0;
            shake = 0;
            player.health = PLAYER_CONFIG.maxHealth;
            player.x = width / 2;
            player.targetX = width / 2;
            player.cooldown = 0;
            lowHealthWarned = false;

            projectiles = [];
            enemies = [];
            particles = [];

            hitGifWrap.classList.remove('visible');
            failGifWrap.classList.remove('visible');
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            const hpContainer = document.getElementById('health-container');
            hpContainer.innerHTML = '';
            for (let i = 0; i < PLAYER_CONFIG.maxHealth; i++) {
                const heart = document.createElement('div');
                heart.className = `heart-icon transition-all duration-300 ${i < player.health ? 'opacity-100 scale-100' : 'opacity-25 scale-75'}`;
                heart.style.fontSize = '2rem';
                heart.style.transition = 'transform 180ms ease, opacity 180ms ease';
                heart.style.opacity = i < player.health ? '1' : '0.25';
                heart.style.transform = i < player.health ? 'scale(1)' : 'scale(0.75)';
                heart.innerHTML = '🛡️';
                hpContainer.appendChild(heart);
            }
        }

        function spawnEnemy() {
            const baseRate = 60;
            const rate = Math.max(20, baseRate - Math.floor(score / 50));

            if (frame % rate === 0) {
                const type = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
                enemies.push({
                    x: Math.random() * (width - type.width) + type.width / 2,
                    y: -50,
                    width: type.width,
                    height: type.height,
                    color: type.color,
                    hp: type.hp,
                    maxHp: type.hp,
                    score: type.score,
                    speed: (3 + Math.random() * 2 + (score * 0.01)) * type.speedMod,
                    weave: type.weave || false,
                    weaveOffset: Math.random() * Math.PI * 2,
                    type: type.name
                });
            }
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function update() {
            player.x += (player.targetX - player.x) * PLAYER_CONFIG.speed;

            if (player.cooldown > 0) player.cooldown--;
            else {
                projectiles.push({
                    x: player.x,
                    y: player.y - 20,
                    width: 8,
                    height: 16,
                    speed: 12,
                    color: '#ffd86b'
                });
                audio.playSFX('shoot', { cooldown: 90 });
                player.cooldown = PLAYER_CONFIG.fireRate;
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.y -= p.speed;
                if (p.y < -20) projectiles.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;

                if (e.weave) {
                    e.x += Math.sin(frame * 0.1 + e.weaveOffset) * 2;
                }

                if (e.y > height + 50) {
                    enemies.splice(i, 1);
                    continue;
                }

                if (
                    e.x < player.x + PLAYER_CONFIG.width / 2 &&
                    e.x + e.width > player.x - PLAYER_CONFIG.width / 2 &&
                    e.y < player.y + PLAYER_CONFIG.height / 2 &&
                    e.y + e.height > player.y - PLAYER_CONFIG.height / 2
                ) {
                    takeDamage();
                    createParticles(e.x, e.y, e.color, 15);
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    if (
                        p.x < e.x + e.width &&
                        p.x + p.width > e.x &&
                        p.y < e.y + e.height &&
                        p.y + p.height > e.y
                    ) {
                        e.hp--;
                        projectiles.splice(j, 1);
                        createParticles(p.x, p.y, '#fff', 3);
                        audio.playSFX('hit', { cooldown: 70 });

                        if (e.hp <= 0) {
                            score += e.score;
                            audio.playSFX('kill', { cooldown: 120 });
                            createParticles(e.x, e.y, e.color, 10);
                            showGif('hit', 880);
                            enemies.splice(i, 1);
                            updateHUD();
                        } else {
                            e.flash = 5;
                        }
                        break;
                    }
                }
                if (e.flash > 0) e.flash--;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        function takeDamage() {
            player.health--;
            shake = 20;
            audio.playSFX('damage', { cooldown: 150 });
            showGif('fail', 1100);

            const overlay = document.getElementById('flash-overlay');
            overlay.classList.remove('damage-flash');
            void overlay.offsetWidth;
            overlay.classList.add('damage-flash');

            if (player.health === 1 && !lowHealthWarned) {
                lowHealthWarned = true;
                audio.playSFX('warning', { cooldown: 300 });
            }

            updateHUD();

            if (player.health <= 0) {
                gameOver();
            }
        }

        /** 5. RENDERING */
        function drawBackground(scrollY) {
            // [agent-note][world-design-v4] background: procedural Hogwarts corridor; decorative only, preserves scroll/readability.
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#10071b');
            bgGradient.addColorStop(0.45, '#24133d');
            bgGradient.addColorStop(1, '#070812');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            const phase = Math.min(4, Math.floor(score / 120));
            const laneGlow = ['rgba(255, 216, 107, 0.08)', 'rgba(142, 233, 255, 0.09)', 'rgba(63, 224, 138, 0.08)', 'rgba(111, 76, 255, 0.09)', 'rgba(255, 91, 122, 0.08)'][phase];

            ctx.fillStyle = 'rgba(5, 3, 9, 0.52)';
            ctx.fillRect(0, 0, width * 0.13, height);
            ctx.fillRect(width * 0.87, 0, width * 0.13, height);

            const corridorGradient = ctx.createLinearGradient(0, 0, 0, height);
            corridorGradient.addColorStop(0, 'rgba(106, 50, 76, 0.48)');
            corridorGradient.addColorStop(0.55, 'rgba(54, 29, 55, 0.74)');
            corridorGradient.addColorStop(1, 'rgba(19, 10, 27, 0.92)');
            ctx.fillStyle = corridorGradient;
            ctx.beginPath();
            ctx.moveTo(width * 0.22, 0);
            ctx.lineTo(width * 0.78, 0);
            ctx.lineTo(width * 0.92, height);
            ctx.lineTo(width * 0.08, height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = laneGlow;
            ctx.beginPath();
            ctx.moveTo(width * 0.28, 0);
            ctx.lineTo(width * 0.72, 0);
            ctx.lineTo(width * 0.82, height);
            ctx.lineTo(width * 0.18, height);
            ctx.closePath();
            ctx.fill();

            // Arched windows, wall candles, and portrait frames stay at the edges so the play lane remains readable.
            for (let i = -1; i < 5; i++) {
                const y = (scrollY * 0.72 + i * 176) % (height + 220) - 110;
                const leftX = width * 0.045;
                const rightX = width - width * 0.045 - 42;

                ctx.fillStyle = 'rgba(255, 216, 107, 0.08)';
                ctx.strokeStyle = 'rgba(255, 216, 107, 0.16)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(leftX, y, 42, 82, 20);
                ctx.roundRect(rightX, y + 68, 42, 82, 20);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(142, 233, 255, 0.13)';
                ctx.fillRect(leftX + 10, y + 24, 22, 5);
                ctx.fillRect(rightX + 10, y + 92, 22, 5);

                ctx.fillStyle = 'rgba(255, 216, 107, 0.72)';
                ctx.beginPath();
                ctx.ellipse(leftX + 21, y + 62 + Math.sin(frame * 0.04 + i) * 2, 4, 11, 0, 0, Math.PI * 2);
                ctx.ellipse(rightX + 21, y + 130 + Math.cos(frame * 0.04 + i) * 2, 4, 11, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 190, 75, 0.16)';
                ctx.beginPath();
                ctx.arc(leftX + 21, y + 62, 18, 0, Math.PI * 2);
                ctx.arc(rightX + 21, y + 130, 18, 0, Math.PI * 2);
                ctx.fill();
            }

            // Marauder-map inspired rails and footsteps create motion without adding terrain or gameplay cues.
            ctx.strokeStyle = 'rgba(255, 216, 107, 0.16)';
            ctx.lineWidth = 5;
            ctx.setLineDash([24, 18]);
            ctx.beginPath();
            ctx.moveTo(width * 0.24, -height + scrollY);
            ctx.lineTo(width * 0.17, height * 2 + scrollY);
            ctx.moveTo(width * 0.76, -height + scrollY);
            ctx.lineTo(width * 0.83, height * 2 + scrollY);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let i = -1; i < 6; i++) {
                const y = (scrollY + i * 135) % (height + 180) - 90;
                ctx.strokeStyle = 'rgba(255, 242, 200, 0.08)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(width * 0.16, y);
                ctx.quadraticCurveTo(width * 0.5, y + 34, width * 0.84, y);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 216, 107, 0.2)';
                ctx.beginPath();
                ctx.ellipse(width * 0.32, y + 32, 3, 7, -0.4, 0, Math.PI * 2);
                ctx.ellipse(width * 0.36, y + 46, 3, 7, 0.4, 0, Math.PI * 2);
                ctx.ellipse(width * 0.68, y + 34, 3, 7, 0.4, 0, Math.PI * 2);
                ctx.ellipse(width * 0.64, y + 48, 3, 7, -0.4, 0, Math.PI * 2);
                ctx.fill();
            }

            // House banners and distant hoops/arches provide five-phase visual progression from existing score only.
            for (let i = 0; i < 4; i++) {
                const x = i % 2 === 0 ? width * 0.15 : width * 0.81;
                const y = (scrollY * 0.5 + i * 210) % (height + 260) - 120;
                ctx.fillStyle = ['rgba(143,29,44,0.32)', 'rgba(63,224,138,0.26)', 'rgba(111,76,255,0.28)', 'rgba(255,216,107,0.25)'][i];
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + (i % 2 === 0 ? 20 : -20), y + 10);
                ctx.lineTo(x + (i % 2 === 0 ? 16 : -16), y + 72);
                ctx.lineTo(x, y + 58);
                ctx.closePath();
                ctx.fill();
            }

            for (let i = 0; i < 32; i++) {
                const x = ((i * 211) % Math.max(width, 1)) + (i % 3) * 11;
                const y = (i * 83 + scrollY * 0.38) % (height + 80) - 40;
                const pulse = 0.5 + Math.sin(frame * 0.035 + i) * 0.25;
                ctx.fillStyle = i % 2 === 0 ? `rgba(142, 233, 255, ${0.11 + pulse * 0.08})` : `rgba(255, 216, 107, ${0.09 + pulse * 0.07})`;
                ctx.beginPath();
                ctx.arc(x, y, 1.5 + (i % 3), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
            ctx.strokeStyle = 'rgba(14, 7, 18, 0.9)';
            ctx.lineWidth = 3;

            if (e.type === 'Broom') {
                // Rogue broom: thin fast silhouette with straw bristles and cursed gold binding.
                ctx.strokeStyle = 'rgba(14, 7, 18, 0.95)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-7, -25);
                ctx.lineTo(8, 19);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 216, 107, 0.84)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, -16);
                ctx.lineTo(5, -8);
                ctx.stroke();

                ctx.fillStyle = e.flash > 0 ? '#fff2a6' : '#9a5a27';
                ctx.beginPath();
                ctx.moveTo(3, 8);
                ctx.lineTo(22, 25);
                ctx.lineTo(-14, 29);
                ctx.lineTo(-4, 8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 216, 107, 0.85)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-12, 17);
                ctx.lineTo(18, 16);
                ctx.moveTo(-9, 23);
                ctx.lineTo(20, 21);
                ctx.moveTo(-4, 28);
                ctx.lineTo(13, 18);
                ctx.stroke();
            } else if (e.type === 'Vacuum') {
                // Armored spellbook: durable threat remains visually chunkier than other hazards.
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#5c3f8f';
                ctx.beginPath();
                ctx.roundRect(-22, -23, 36, 44, 7);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = e.flash > 0 ? '#fff2a6' : '#fff2c8';
                ctx.beginPath();
                ctx.roundRect(-14, -18, 29, 38, 5);
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = 'rgba(92, 63, 143, 0.85)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-8, -9);
                ctx.lineTo(9, -9);
                ctx.moveTo(-8, 0);
                ctx.lineTo(8, 0);
                ctx.moveTo(-8, 9);
                ctx.lineTo(10, 9);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 216, 107, 0.9)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(1, 1, 10, 0, Math.PI * 2);
                ctx.moveTo(1, -9);
                ctx.lineTo(1, 11);
                ctx.moveTo(-9, 1);
                ctx.lineTo(11, 1);
                ctx.stroke();

                ctx.fillStyle = '#ffd86b';
                ctx.beginPath();
                ctx.arc(13, -15, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Fluttering curse note / shadow charm: weaving hazard has a paper-wing outline.
                ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#8ee9ff';
                ctx.beginPath();
                ctx.moveTo(0, -e.height / 2);
                ctx.quadraticCurveTo(e.width / 2 + 5, -8, e.width / 2, e.height / 2 - 3);
                ctx.lineTo(0, e.height / 2);
                ctx.quadraticCurveTo(-e.width / 2 - 5, 4, -e.width / 2, -e.height / 2 + 8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(22, 11, 34, 0.9)';
                ctx.beginPath();
                ctx.arc(-4, -7, 2.6, 0, Math.PI * 2);
                ctx.arc(5, -7, 2.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 216, 107, 0.86)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-8, 8);
                ctx.lineTo(-2, 4);
                ctx.lineTo(2, 11);
                ctx.lineTo(9, 6);
                ctx.stroke();
            }

            if (e.maxHp > 1) {
                const hpPct = e.hp / e.maxHp;
                ctx.fillStyle = 'rgba(64, 0, 12, 0.8)';
                ctx.fillRect(-16, -e.height / 2 - 12, 32, 5);
                ctx.fillStyle = '#3fe08a';
                ctx.fillRect(-16, -e.height / 2 - 12, 32 * hpPct, 5);
            }

            ctx.restore();
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            const bob = Math.sin(frame * 0.12) * 1.5;

            ctx.strokeStyle = 'rgba(142, 233, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 7 + bob, 28, 0.15, 2.98);
            ctx.stroke();

            ctx.fillStyle = '#160b22';
            ctx.strokeStyle = 'rgba(255, 216, 107, 0.52)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -31 + bob);
            ctx.lineTo(25, 31);
            ctx.lineTo(-25, 31);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#8f1d2c';
            ctx.fillRect(-18, 1 + bob, 36, 8);
            ctx.fillStyle = '#ffd86b';
            ctx.fillRect(-4, 1 + bob, 8, 8);
            ctx.fillStyle = 'rgba(255, 216, 107, 0.7)';
            ctx.fillRect(-18, 15, 36, 3);

            ctx.fillStyle = '#f2c7a1';
            ctx.beginPath();
            ctx.arc(0, -14 + bob, 13, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2b1a12';
            ctx.beginPath();
            ctx.arc(0, -19 + bob, 14, Math.PI, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#160b22';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-5.5, -13 + bob, 4.5, 0, Math.PI * 2);
            ctx.arc(5.5, -13 + bob, 4.5, 0, Math.PI * 2);
            ctx.moveTo(-1, -13 + bob);
            ctx.lineTo(1, -13 + bob);
            ctx.stroke();

            ctx.fillStyle = '#fff2c8';
            ctx.beginPath();
            ctx.arc(-5.5, -13 + bob, 2.4, 0, Math.PI * 2);
            ctx.arc(5.5, -13 + bob, 2.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ffd86b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(1, -24 + bob);
            ctx.lineTo(-3, -20 + bob);
            ctx.lineTo(3, -20 + bob);
            ctx.lineTo(-1, -16 + bob);
            ctx.stroke();

            ctx.fillStyle = '#1a1028';
            ctx.beginPath();
            ctx.moveTo(-18, -25 + bob);
            ctx.lineTo(0, -49 + bob);
            ctx.lineTo(18, -25 + bob);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 216, 107, 0.5)';
            ctx.stroke();

            ctx.strokeStyle = '#8ee9ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(20, 2);
            ctx.lineTo(34, -20 + bob);
            ctx.stroke();

            ctx.fillStyle = 'rgba(142, 233, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(35, -22 + bob, 4 + Math.sin(frame * 0.28) * 0.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 216, 107, 0.52)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(35, -22 + bob, 9, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;

            ctx.save();
            ctx.translate(dx, dy);
            ctx.clearRect(0, 0, width, height);

            const scrollSpeed = 2 + (score * 0.005);
            const scrollY = (frame * scrollSpeed) % height;

            drawBackground(scrollY);

            projectiles.forEach(p => {
                const spellCore = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, 11);
                spellCore.addColorStop(0, '#fff9ef');
                spellCore.addColorStop(0.42, p.color);
                spellCore.addColorStop(1, 'rgba(142, 233, 255, 0.05)');
                ctx.fillStyle = spellCore;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(142, 233, 255, 0.62)';
                ctx.fillRect(p.x - 2, p.y + 6, 4, 10);

                ctx.strokeStyle = 'rgba(255, 216, 107, 0.72)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y + 8);
                ctx.lineTo(p.x, p.y + 16);
                ctx.moveTo(p.x - 5, p.y + 12);
                ctx.lineTo(p.x + 5, p.y + 12);
                ctx.stroke();
            });

            enemies.forEach(drawEnemy);
            drawPlayer();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            frame++;
            spawnEnemy();
            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. UI BINDINGS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('start', { cooldown: 120 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('click', { cooldown: 120 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
