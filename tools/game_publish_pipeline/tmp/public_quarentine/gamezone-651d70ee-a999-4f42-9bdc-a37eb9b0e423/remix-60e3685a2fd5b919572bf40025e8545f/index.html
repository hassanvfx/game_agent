<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Courier Run</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap');

        /* [agent-note][stage3] resolved-font: title -> Audiowide | ui/body -> Rajdhani from catalogs/fonts.json */
        :root {
            --slate-950: #050816;
            --slate-900: #0f172a;
            --slate-400: #94a3b8;
            --cyan-200: #a5f3fc;
            --cyan-300: #67e8f9;
            --cyan-400: #22d3ee;
            --blue-400: #60a5fa;
            --blue-600: #2563eb;
            --violet-500: #8b5cf6;
            --yellow-300: #fde047;
            --yellow-400: #facc15;
            --red-300: #fca5a5;
            --red-500: #ef4444;
            --white: #ffffff;
            --black: #000000;
            --hud-border: rgba(103, 232, 249, 0.42);
            --panel-glow: rgba(96, 165, 250, 0.22);
            --feedback-ready: rgba(96, 165, 250, 0.92);
            --feedback-hit: rgba(250, 204, 21, 0.96);
            --feedback-crash: rgba(239, 68, 68, 0.96);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at 50% 18%, rgba(34, 211, 238, 0.12), transparent 30%),
                linear-gradient(180deg, #090d1f 0%, var(--slate-950) 45%, #04060f 100%);
            color: var(--white);
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .overflow-hidden { overflow: hidden; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .uppercase { text-transform: uppercase; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .italic { font-style: italic; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-br-2xl { border-bottom-right-radius: 1rem; }
        .rounded-bl-2xl { border-bottom-left-radius: 1rem; }
        .rounded-tl-lg { border-top-left-radius: 0.5rem; }
        .rounded-tr-lg { border-top-right-radius: 0.5rem; }
        .transition-opacity { transition: opacity 0.5s ease; }
        .transition-transform { transition: transform 0.15s ease; }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .items-end {
            align-items: flex-end;
        }

        .items-baseline {
            align-items: baseline;
        }

        .justify-center {
            justify-content: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .justify-end {
            justify-content: flex-end;
        }

        .gap-1 { gap: 0.25rem; }
        .gap-4 { gap: 1rem; }

        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .p-4 { padding: 1rem; }
        .pb-2 { padding-bottom: 0.5rem; }

        .mb-2 { margin-bottom: 0.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-4 { margin-top: 1rem; }

        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-5xl { font-size: clamp(2.5rem, 8vw, 3rem); line-height: 1; }
        .text-6xl { font-size: clamp(3rem, 10vw, 4rem); line-height: 0.95; }

        .text-white { color: var(--white); }
        .text-yellow-400 { color: var(--yellow-400); }
        .text-cyan-200 { color: var(--cyan-200); }
        .text-cyan-300 { color: var(--cyan-300); }
        .text-cyan-400 { color: var(--cyan-400); }
        .text-slate-400 { color: var(--slate-400); }
        .text-red-300 { color: var(--red-300); }
        .text-red-900 { color: #7f1d1d; }

        .bg-black-40 { background: rgba(0, 0, 0, 0.4); }
        .bg-white { background: var(--white); }
        .bg-slate-overlay { background: rgba(15, 23, 42, 0.8); }
        .bg-red-overlay { background: rgba(127, 29, 29, 0.9); }

        .border { border-width: 1px; border-style: solid; }
        .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
        .border-white-10 { border-color: rgba(255, 255, 255, 0.1); }
        .border-red-500-30 { border-color: rgba(239, 68, 68, 0.3); }

        .drop-shadow-title {
            filter: drop-shadow(0 0 10px rgba(6,182,212,0.5));
        }

        .arcade-title {
            font-family: 'Audiowide', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .city-glow::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(34, 211, 238, 0.06), transparent 25%),
                repeating-linear-gradient(
                    90deg,
                    transparent 0 10%,
                    rgba(96, 165, 250, 0.09) 10% 11.5%,
                    transparent 11.5% 20%
                );
            opacity: 0.75;
            pointer-events: none;
        }

        .city-glow::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 38%;
            background:
                linear-gradient(180deg, transparent 0%, rgba(5, 8, 22, 0.2) 30%, rgba(5, 8, 22, 0.85) 100%),
                repeating-linear-gradient(
                    90deg,
                    rgba(34, 211, 238, 0.16) 0 3%,
                    transparent 3% 6%,
                    rgba(139, 92, 246, 0.16) 6% 7.2%,
                    transparent 7.2% 11%
                );
            clip-path: polygon(0 100%, 0 40%, 8% 56%, 16% 28%, 24% 64%, 34% 18%, 43% 52%, 54% 22%, 63% 60%, 72% 30%, 80% 55%, 88% 24%, 100% 48%, 100% 100%);
            opacity: 0.9;
            pointer-events: none;
        }

        .shadow-restart {
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .active-scale:active {
            transform: scale(0.95);
        }

        .tracking-widest { letter-spacing: 0.18em; }
        .tracking-wide { letter-spacing: 0.08em; }
        .tracking-hero { letter-spacing: 0.3em; }
        .tracking-score { letter-spacing: 0.08em; }

        .z-50 { z-index: 50; }
        .bottom-20 { bottom: 5rem; }
        .px-10-overlay { padding-left: 2.5rem; padding-right: 2.5rem; }
        .w-64 { width: 16rem; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .w-10 { width: 2.5rem; }
        .h-10 { height: 2.5rem; }
        .rounded-full { border-radius: 9999px; }
        .opacity-50 { opacity: 0.5; }

        .bg-white-10 { background: rgba(255,255,255,0.1); }
        .border-white-20 { border: 2px solid rgba(255,255,255,0.2); }

        .animate-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        .animate-ping {
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .backdrop-blur-sm {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .backdrop-blur-md {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-text {
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.8);
        }

        .glass-hud {
            background: linear-gradient(180deg, rgba(10, 18, 39, 0.8), rgba(12, 19, 34, 0.62));
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid var(--hud-border);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 18px var(--panel-glow);
        }

        .neon-btn {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 48%, #8b5cf6 100%);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.45);
            border: 1px solid #a5f3fc;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            color: #fff;
            font-family: 'Audiowide', sans-serif;
        }

        .neon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        .safe-top {
            top: max(1rem, env(safe-area-inset-top) + 1rem);
        }

        .safe-left {
            left: max(1rem, env(safe-area-inset-left) + 1rem);
        }

        .safe-right {
            right: max(1rem, env(safe-area-inset-right) + 1rem);
        }

        .glitch {
            animation: glitch 1s linear infinite;
        }

        .title-gradient {
            background: linear-gradient(90deg, var(--cyan-200) 0%, var(--yellow-300) 38%, #ffffff 58%, var(--blue-400) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .start-card {
            position: relative;
            padding: 1.15rem 1rem 1rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(9, 15, 32, 0.84), rgba(7, 13, 28, 0.68));
            border: 1px solid rgba(165, 243, 252, 0.2);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04),
                0 0 30px rgba(37, 99, 235, 0.22);
            max-width: min(22rem, calc(100vw - 2rem));
        }

        .start-card::before {
            content: "🚚";
            position: absolute;
            top: -0.95rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.45rem;
            filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.7));
        }

        .signal-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--cyan-200);
            border: 1px solid rgba(103, 232, 249, 0.24);
            background: rgba(8, 14, 31, 0.6);
        }

        .warning-card {
            background: linear-gradient(180deg, rgba(88, 20, 20, 0.94), rgba(49, 10, 10, 0.92));
            border: 1px solid rgba(248, 113, 113, 0.34);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 0 24px rgba(239, 68, 68, 0.18);
        }

        .restart-btn {
            font-family: 'Audiowide', sans-serif;
            background: linear-gradient(135deg, #fde047 0%, #facc15 50%, #fb7185 100%);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.35);
        }

        .tap-hint-layout {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding-left: 2.5rem;
            padding-right: 2.5rem;
        }

        .feedback-overlay {
            position: absolute;
            left: 50%;
            top: max(5.25rem, env(safe-area-inset-top) + 4.5rem);
            transform: translateX(-50%);
            width: min(11rem, calc(100vw - 2rem));
            min-height: 6.25rem;
            padding: 0.5rem 0.65rem 0.65rem;
            border-radius: 1rem;
            border: 1px solid rgba(165, 243, 252, 0.28);
            background: rgba(7, 11, 25, 0.78);
            box-shadow: 0 0 24px rgba(14, 165, 233, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            z-index: 35;
        }

        .feedback-overlay.visible {
            opacity: 1;
        }

        .feedback-label {
            font-family: 'Audiowide', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-align: center;
            color: var(--cyan-200);
            margin-bottom: 0.35rem;
        }

        .feedback-gif {
            width: 100%;
            height: 4.6rem;
            object-fit: cover;
            border-radius: 0.75rem;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(15, 23, 42, 0.55);
        }

        .feedback-overlay[data-state="ready"] {
            border-color: rgba(96, 165, 250, 0.42);
        }

        .feedback-overlay[data-state="hit"] {
            border-color: rgba(250, 204, 21, 0.46);
        }

        .feedback-overlay[data-state="crash"] {
            border-color: rgba(239, 68, 68, 0.48);
        }

        .feedback-overlay[data-state="ready"] .feedback-label {
            color: var(--feedback-ready);
        }

        .feedback-overlay[data-state="hit"] .feedback-label {
            color: var(--feedback-hit);
        }

        .feedback-overlay[data-state="crash"] .feedback-label {
            color: var(--feedback-crash);
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes ping {
            0% {
                transform: scale(0.75);
                opacity: 1;
            }
            75%, 100% {
                transform: scale(1.15);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full overflow-hidden select-none city-glow">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="absolute inset-0 pointer-events-none">

            <div id="hud-earnings" class="absolute safe-top safe-left glass-hud px-4 py-2 rounded-br-2xl rounded-tl-lg hidden transition-opacity">
                <div class="text-xs text-cyan-300 uppercase tracking-widest">Deliveries</div>
                <div class="flex items-center gap-1">
                    <span class="text-yellow-400 text-xl font-bold">$</span>
                    <span id="score" class="text-2xl font-bold text-white hud-text tracking-score">0</span>
                </div>
            </div>

            <div id="hud-speed" class="absolute safe-top safe-right glass-hud px-4 py-2 rounded-bl-2xl rounded-tr-lg text-right hidden transition-opacity">
                <div class="text-xs text-cyan-300 uppercase tracking-widest">Route Speed</div>
                <div class="flex items-baseline justify-end gap-1">
                    <span id="speed-val" class="text-2xl font-bold text-white hud-text tracking-score">0</span>
                    <span class="text-xs text-cyan-400 font-bold">km/h</span>
                </div>
            </div>

            <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-overlay backdrop-blur-sm pointer-events-auto z-50">
                <div class="start-card text-center mb-8">
                    <div class="signal-chip mb-2">⚡ courier uplink</div>
                    <h1 class="text-6xl font-black title-gradient mb-2 drop-shadow-title arcade-title">NEON<br>COURIER</h1>
                    <p class="text-cyan-200 tracking-hero text-sm uppercase">Midnight Delivery Grid</p>
                </div>

                <div class="flex flex-col gap-4 items-center">
                    <button id="start-btn" class="neon-btn px-10 py-4 rounded-xl font-bold text-xl uppercase tracking-wide w-64">
                        Start Route
                    </button>
                    <p class="text-slate-400 text-xs mt-4 animate-pulse arcade-title" style="font-size:0.72rem;">Tap left / right to dodge and bank credits</p>
                </div>
            </div>

            <div id="game-over-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-red-overlay backdrop-blur-md pointer-events-auto hidden z-50">
                <h2 class="text-5xl font-black text-white mb-2 glitch arcade-title">ROUTE<br>BREACHED</h2>
                <div class="w-64 warning-card rounded-lg p-4 mb-8 border border-red-500-30">
                    <div class="flex justify-between items-end border-b border-white-10 pb-2 mb-2">
                        <span class="text-xs text-red-300 uppercase">Deliveries Banked</span>
                        <span id="final-score" class="text-2xl text-yellow-400 font-bold">$0</span>
                    </div>
                    <div class="flex justify-between items-end">
                        <span class="text-xs text-red-300 uppercase">Peak Speed</span>
                        <span id="final-speed" class="text-xl text-cyan-400 font-bold">0 km/h</span>
                    </div>
                </div>
                <button id="restart-btn" class="restart-btn text-red-900 px-10 py-4 rounded-xl font-black text-xl uppercase tracking-wide shadow-restart active-scale transition-transform">
                    Run Again
                </button>
            </div>

            <div id="tap-hint" class="absolute bottom-20 w-full pointer-events-none opacity-50 hidden">
                <div class="tap-hint-layout">
                    <div class="w-16 h-16 border-white-20 rounded-full flex items-center justify-center">
                        <div class="w-10 h-10 bg-white-10 rounded-full animate-ping"></div>
                    </div>
                    <div class="w-16 h-16 border-white-20 rounded-full flex items-center justify-center">
                        <div class="w-10 h-10 bg-white-10 rounded-full animate-ping"></div>
                    </div>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: ready-hit-crash overlays -> catalogs/gifs.json, kept above playfield for mobile safety -->
            <div id="feedback-overlay" class="feedback-overlay transition-opacity hidden" data-state="ready" aria-hidden="true">
                <div id="feedback-label" class="feedback-label">Route online</div>
                <img
                    id="feedback-gif"
                    class="feedback-gif"
                    src="https://i.giphy.com/MFPZ483I4x41W.webp"
                    alt="Gameplay feedback animation"
                    loading="lazy"
                    decoding="async"
                >
            </div>

        </div>
    </div>

    <script>
        /**
         * NEON COURIER RUN
         * Single-file implementation
         */

        // --- Audio System ---
        const AUDIO_ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            restart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            steer: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
            coin: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
            score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
            crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
        };

        const GIF_ASSETS = {
            ready: "https://i.giphy.com/MFPZ483I4x41W.webp",
            hit: "https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp",
            crash: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
        };

        const AudioSys = {
            enabled: false,
            bgm: null,
            sfxCache: {},
            lastPlayedAt: {},
            init: function() {
                if (this.enabled) return;
                this.enabled = true;
                this.bgm = new Audio(AUDIO_ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.preload = 'auto';
                this.bgm.volume = 0.2;
            },
            playBGM: function() {
                if (!this.enabled) this.init();
                if (!this.bgm) return;
                this.bgm.play().catch(() => {});
            },
            stopBGM: function(reset = true) {
                if (!this.bgm) return;
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            },
            playSFX: function(type) {
                if (!this.enabled || !AUDIO_ASSETS[type]) return;
                const now = performance.now();
                const cooldown = type === 'steer' ? 90 : type === 'coin' ? 110 : 0;
                if (cooldown && this.lastPlayedAt[type] && now - this.lastPlayedAt[type] < cooldown) return;
                this.lastPlayedAt[type] = now;

                let sfx = this.sfxCache[type];
                if (!sfx) {
                    sfx = new Audio(AUDIO_ASSETS[type]);
                    sfx.preload = 'auto';
                    this.sfxCache[type] = sfx;
                }

                sfx.pause();
                sfx.currentTime = 0;
                sfx.volume = ({
                    start: 0.42,
                    restart: 0.34,
                    steer: 0.18,
                    coin: 0.34,
                    score: 0.26,
                    crash: 0.55
                })[type] ?? 0.3;
                sfx.play().catch(() => {});
            }
        };

        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackLabel = document.getElementById('feedback-label');
        const feedbackGif = document.getElementById('feedback-gif');

        function showFeedback(state, label) {
            if (!feedbackOverlay || !feedbackLabel || !feedbackGif) return;
            feedbackOverlay.dataset.state = state;
            feedbackLabel.textContent = label;
            feedbackGif.src = GIF_ASSETS[state] || GIF_ASSETS.ready;
            feedbackOverlay.classList.remove('hidden');
            requestAnimationFrame(() => feedbackOverlay.classList.add('visible'));
        }

        function hideFeedback() {
            if (!feedbackOverlay) return;
            feedbackOverlay.classList.remove('visible');
            feedbackOverlay.classList.add('hidden');
        }

        // --- Game Constants ---
        const CONFIG = {
            lanes: 3,
            baseSpeed: 600,
            laneWidthRatio: 0.25,
            colors: {
                road: '#0f172a',
                roadLine: '#06b6d4',
                player: '#facc15',
                playerGlow: 'rgba(250, 204, 21, 0.4)',
                barrier: '#ef4444',
                coin: '#10b981'
            }
        };

        // --- State ---
        let state = {
            active: false,
            lastTime: 0,
            score: 0,
            speed: 0,
            gameSpeedMultiplier: 1,
            distance: 0,
            width: 0,
            height: 0,
            laneWidth: 0,
            lanesX: [],
            player: {
                lane: 1,
                x: 0,
                y: 0,
                w: 0,
                h: 0,
                tilt: 0
            },
            obstacles: [],
            particles: [],
            roadOffset: 0
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        function resize() {
            state.width = canvas.width = window.innerWidth;
            state.height = canvas.height = window.innerHeight;

            state.laneWidth = state.width / CONFIG.lanes;
            state.lanesX = [
                state.laneWidth * 0.5,
                state.laneWidth * 1.5,
                state.laneWidth * 2.5
            ];

            const carW = Math.min(state.laneWidth * 0.6, 120);
            state.player.w = carW;
            state.player.h = carW * 1.8;
            state.player.y = state.height - state.player.h - state.height * 0.15;

            if(!state.active) {
                state.player.x = state.lanesX[state.player.lane];
            }
        }

        function spawnObstacle() {
            const laneIdx = Math.floor(Math.random() * CONFIG.lanes);
            const isCoin = Math.random() > 0.4;

            const tooClose = state.obstacles.some(o => o.lane === laneIdx && o.y < state.height * 0.4);
            if(tooClose) return;

            state.obstacles.push({
                lane: laneIdx,
                y: -200,
                type: isCoin ? 'coin' : 'barrier',
                active: true,
                anim: 0
            });
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 + 50;
                state.particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color
                });
            }
        }

        function resetGame() {
            state.score = 0;
            state.speed = 100;
            state.gameSpeedMultiplier = 1.0;
            state.obstacles = [];
            state.particles = [];
            state.player.lane = 1;
            state.player.x = state.lanesX[1];
            state.player.tilt = 0;

            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score').innerText = state.score;
            document.getElementById('speed-val').innerText = Math.floor(state.speed);
        }

        function gameOver() {
            state.active = false;
            AudioSys.stopBGM();
            AudioSys.playSFX('crash');

            document.getElementById('final-score').innerText = '$' + state.score;
            document.getElementById('final-speed').innerText = Math.floor(state.speed) + ' km/h';

            showFeedback('crash', 'Route breached');
            document.getElementById('tap-hint').classList.add('hidden');
            document.getElementById('hud-earnings').classList.add('hidden');
            document.getElementById('hud-speed').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function update(dt) {
            state.gameSpeedMultiplier += 0.05 * dt;
            state.speed = 100 + (state.gameSpeedMultiplier - 1) * 100;

            const pxSpeed = CONFIG.baseSpeed * state.gameSpeedMultiplier;
            const moveStep = pxSpeed * dt;

            state.roadOffset = (state.roadOffset + moveStep) % 80;

            const targetX = state.lanesX[state.player.lane];
            state.player.x += (targetX - state.player.x) * 10 * dt;

            state.player.tilt += (0 - state.player.tilt) * 5 * dt;

            if (state.score > 0 && state.score % 100 === 0 && state.lastMilestone !== state.score) {
                state.lastMilestone = state.score;
                AudioSys.playSFX('score');
                showFeedback('hit', `Credit chain +${state.score}`);
            }

            if(Math.random() < 2.0 * dt) {
                spawnObstacle();
            }

            for(let i = state.obstacles.length - 1; i >= 0; i--) {
                let obs = state.obstacles[i];
                obs.y += moveStep;
                obs.anim += dt * 5;

                const pMargin = state.player.w * 0.2;
                const pL = state.player.x - state.player.w/2 + pMargin;
                const pR = state.player.x + state.player.w/2 - pMargin;
                const pT = state.player.y + pMargin;
                const pB = state.player.y + state.player.h - pMargin;

                const oSize = state.player.w * 0.7;
                const oX = state.lanesX[obs.lane];
                const oL = oX - oSize/2;
                const oR = oX + oSize/2;
                const oT = obs.y - oSize/2;
                const oB = obs.y + oSize/2;

                if(obs.active && pL < oR && pR < oL + oSize && pT < oB && pB > oT) {
                    if(obs.type === 'coin') {
                        state.score += 25;
                        obs.active = false;
                        AudioSys.playSFX('coin');
                        showFeedback('hit', 'Delivery secured');
                        createParticles(oX, obs.y, '#4ade80', 10);
                        updateHUD();
                    } else {
                        createParticles(state.player.x, state.player.y + state.player.h/2, '#ef4444', 30);
                        gameOver();
                        return;
                    }
                }

                if(obs.y > state.height + 200) {
                    state.obstacles.splice(i, 1);
                }
            }

            for(let i = state.particles.length - 1; i >= 0; i--) {
                let p = state.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 2.0 * dt;
                if(p.life <= 0) state.particles.splice(i, 1);
            }
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fill();
        }

        function draw() {
            ctx.fillStyle = CONFIG.colors.road;
            ctx.fillRect(0, 0, state.width, state.height);

            ctx.strokeStyle = 'rgba(6, 182, 212, 0.1)';
            ctx.lineWidth = 1;

            const laneW = state.laneWidth;
            for(let i=0; i<=CONFIG.lanes; i++) {
                const x = i * laneW;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, state.height);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(6, 182, 212, 0.3)';
            ctx.lineWidth = 2;
            const segmentH = 80;
            const offset = state.roadOffset;
            for(let y = -segmentH + offset; y < state.height; y += segmentH) {
                ctx.beginPath();
                for(let i=1; i<CONFIG.lanes; i++) {
                    ctx.moveTo(i * laneW, y);
                    ctx.lineTo(i * laneW, y + 40);
                }
                ctx.stroke();
            }

            ctx.save();
            const p = state.player;
            ctx.translate(p.x, p.y + p.h/2);
            ctx.rotate(p.tilt);
            ctx.translate(-p.x, -(p.y + p.h/2));

            ctx.shadowColor = CONFIG.colors.player;
            ctx.shadowBlur = 20;

            ctx.fillStyle = CONFIG.colors.player;
            drawRoundedRect(ctx, p.x - p.w/2, p.y, p.w, p.h, 10);

            ctx.shadowBlur = 0;

            ctx.fillStyle = '#0f172a';
            const hoodH = p.h * 0.25;
            const roofH = p.h * 0.4;
            drawRoundedRect(ctx, p.x - p.w*0.4, p.y + hoodH, p.w*0.8, roofH, 5);

            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 10;
            ctx.fillRect(p.x - p.w*0.15, p.y + hoodH + roofH/2 - 4, p.w*0.3, 8);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.fillRect(p.x - p.w*0.4, p.y + p.h - 6, p.w*0.25, 6);
            ctx.fillRect(p.x + p.w*0.15, p.y + p.h - 6, p.w*0.25, 6);
            ctx.shadowBlur = 0;

            ctx.restore();

            state.obstacles.forEach(obs => {
                if(!obs.active) return;
                const x = state.lanesX[obs.lane];
                const y = obs.y;
                const size = p.w * 0.7;

                if(obs.type === 'coin') {
                    const scale = 1 + Math.sin(obs.anim) * 0.1;

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    ctx.shadowColor = CONFIG.colors.coin;
                    ctx.shadowBlur = 15;

                    ctx.fillStyle = CONFIG.colors.coin;
                    ctx.beginPath();
                    ctx.arc(0, 0, size/2, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${size*0.54}px "Rajdhani", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('$', 0, 2);

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(x, y);

                    ctx.shadowColor = CONFIG.colors.barrier;
                    ctx.shadowBlur = 10;

                    ctx.fillStyle = CONFIG.colors.barrier;
                    const width = size * 1.2;
                    const height = size * 0.8;
                    ctx.fillRect(-width/2, -height/2, width, height);

                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    for(let k = -width/2; k < width/2; k+=15) {
                        ctx.moveTo(k, -height/2);
                        ctx.lineTo(k+5, height/2);
                        ctx.lineTo(k-5, height/2);
                        ctx.lineTo(k-10, -height/2);
                    }
                    ctx.fill();

                    ctx.restore();
                }
            });

            state.particles.forEach(pt => {
                ctx.globalAlpha = pt.life;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function loop(timestamp) {
            if(!state.lastTime) state.lastTime = timestamp;
            const dt = Math.min((timestamp - state.lastTime) / 1000, 0.1);
            state.lastTime = timestamp;

            if(state.active) {
                update(dt);
                draw();
                updateHUD();
                requestAnimationFrame(loop);
            }
        }

        function handleInput(x) {
            if(!state.active) return;
            const mid = state.width / 2;
            if(x < mid) {
                if(state.player.lane > 0) {
                    state.player.lane--;
                    state.player.tilt = -0.3;
                    AudioSys.playSFX('steer');
                }
            } else {
                if(state.player.lane < CONFIG.lanes - 1) {
                    state.player.lane++;
                    state.player.tilt = 0.3;
                    AudioSys.playSFX('steer');
                }
            }
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for(let i=0; i<e.touches.length; i++) {
                handleInput(e.touches[i].clientX);
            }
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX);
        });

        window.addEventListener('resize', resize);

        document.getElementById('start-btn').addEventListener('click', () => {
            AudioSys.init();
            AudioSys.playSFX('start');
            AudioSys.playBGM();
            hideFeedback();
            showFeedback('ready', 'Route online');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud-earnings').classList.remove('hidden');
            document.getElementById('hud-speed').classList.remove('hidden');
            document.getElementById('tap-hint').classList.remove('hidden');

            resize();
            resetGame();
            state.lastMilestone = 0;
            state.active = true;
            state.lastTime = 0;
            requestAnimationFrame(loop);
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            AudioSys.playSFX('restart');
            AudioSys.playBGM();
            hideFeedback();
            showFeedback('ready', 'Route reset');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud-earnings').classList.remove('hidden');
            document.getElementById('hud-speed').classList.remove('hidden');

            resetGame();
            state.active = true;
            state.lastTime = 0;
            requestAnimationFrame(loop);
        });

        resize();
    </script>
</body>
