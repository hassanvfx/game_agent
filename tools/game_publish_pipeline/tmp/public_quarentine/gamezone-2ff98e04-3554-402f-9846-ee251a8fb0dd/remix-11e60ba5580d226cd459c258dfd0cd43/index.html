<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
        <title>Street Hoops</title>
        <!-- [agent-note][stage4] resolved-font: title=Russo One, ui/body=Exo 2 via catalogs/fonts.json -->
        <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-top: #140a2a;
                --bg-mid: #3b176e;
                --bg-bottom: #101523;
                --panel: rgba(26, 14, 51, 0.82);
                --panel-border: rgba(255, 160, 80, 0.34);
                --text-main: #f9f2ff;
                --text-soft: rgba(243, 240, 255, 0.84);
                --accent-gold: #ffd347;
                --accent-orange: #ff8f39;
                --accent-coral: #ff5f57;
                --accent-cyan: #7df4ff;
                --court-glow: rgba(125, 244, 255, 0.22);
                --shadow-deep: rgba(5, 4, 16, 0.48);
            }

            * { box-sizing: border-box; }

            body {
                margin: 0;
                overflow: hidden;
                font-family: 'Exo 2', system-ui, sans-serif;
                background:
                    radial-gradient(circle at top, rgba(255, 160, 84, 0.18), transparent 28%),
                    linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
                color: var(--text-main);
            }

            canvas { display: block; width: 100%; height: 100%; touch-action: none; }

            .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

            .ui-layer {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                pointer-events: none;
                background:
                    radial-gradient(circle at 15% 10%, rgba(255, 211, 71, 0.12), transparent 18%),
                    radial-gradient(circle at 80% 18%, rgba(125, 244, 255, 0.14), transparent 22%),
                    linear-gradient(180deg, transparent 0%, rgba(10, 7, 20, 0.18) 100%);
            }

            .screen {
                text-align: center;
                pointer-events: auto;
                padding: 2rem;
                border-radius: 1.5rem;
                position: relative;
                overflow: hidden;
                z-index: 3;
            }

            .screen::before,
            .screen::after {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
            }

            .screen::before {
                background:
                    linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 42%),
                    radial-gradient(circle at top right, rgba(255, 211, 71, 0.2), transparent 28%);
                opacity: 0.85;
            }

            .screen::after {
                inset: 0.5rem;
                border: 1px solid rgba(125, 244, 255, 0.18);
                border-radius: 1.15rem;
            }

            .glass-panel {
                background: linear-gradient(180deg, rgba(35, 18, 66, 0.94), rgba(17, 12, 34, 0.9));
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                border: 1px solid var(--panel-border);
                box-shadow:
                    0 20px 42px var(--shadow-deep),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1),
                    0 0 28px rgba(255, 143, 57, 0.16);
            }

            .title {
                margin: 0 0 0.35rem;
                font-family: 'Russo One', system-ui, sans-serif;
                font-size: clamp(2.8rem, 8vw, 4.5rem);
                color: var(--accent-gold);
                text-shadow:
                    0 4px 0 rgba(56, 20, 0, 0.9),
                    0 0 18px rgba(255, 143, 57, 0.45);
                letter-spacing: 0.08em;
                transform: rotate(-2deg);
            }

            .subtitle {
                margin: 0 0 1.5rem;
                font-size: clamp(1rem, 3vw, 1.35rem);
                font-weight: 600;
                line-height: 1.35;
                color: var(--text-soft);
                animation: pulse 1.8s ease-in-out infinite;
            }

            .button {
                border: none;
                cursor: pointer;
                font-family: 'Exo 2', system-ui, sans-serif;
                font-size: 1rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                padding: 1rem 2.25rem;
                border-radius: 999px;
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
                transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            }

        .button:hover {
            transform: translateY(-2px);
        }

            .button-primary {
                background: linear-gradient(180deg, #ffb34a, var(--accent-orange));
                color: #1c1028;
            }

            .button-primary:hover {
                background: linear-gradient(180deg, #ffc868, #ff9b4d);
                box-shadow: 0 0 26px rgba(255, 143, 57, 0.5);
                filter: brightness(1.04);
            }

            .button-secondary {
                background: linear-gradient(180deg, #f7f8ff, #d8def9);
                color: #1a1d34;
            }

            .button-secondary:hover {
                background: linear-gradient(180deg, #ffffff, #e8ecff);
                filter: brightness(1.03);
            }

            .result-title {
                margin: 0 0 0.5rem;
                font-family: 'Russo One', system-ui, sans-serif;
                font-size: clamp(2.3rem, 7vw, 3.5rem);
                color: var(--accent-coral);
                text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
                letter-spacing: 0.06em;
            }

            .result-copy {
                margin: 0 0 1.5rem;
                font-size: clamp(1.1rem, 3vw, 1.6rem);
                font-weight: 600;
                color: var(--text-main);
            }

            .accent {
                color: var(--accent-gold);
            }

            .hud {
                position: absolute;
                top: 1rem;
                left: 1rem;
                right: 1rem;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 0.85rem;
            }

            .hud-label {
                font-size: clamp(1rem, 3vw, 1.55rem);
                font-weight: 700;
                font-family: 'Exo 2', system-ui, sans-serif;
                color: var(--text-main);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
                background: linear-gradient(180deg, rgba(29, 20, 58, 0.92), rgba(13, 10, 28, 0.84));
                border: 1px solid rgba(125, 244, 255, 0.2);
                border-radius: 999px;
                padding: 0.5rem 0.95rem;
                box-shadow:
                    0 10px 18px rgba(0, 0, 0, 0.25),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            }

            .feedback-layer {
                position: absolute;
                inset: 0;
                pointer-events: none;
                overflow: hidden;
                z-index: 2;
            }

            .feedback-badge {
                position: absolute;
                left: 50%;
                top: 16%;
                transform: translate(-50%, -18px) scale(0.92);
                padding: 0.7rem 1.15rem;
                border-radius: 999px;
                background: rgba(12, 10, 28, 0.8);
                border: 1px solid rgba(255, 211, 71, 0.45);
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
                font-family: 'Russo One', system-ui, sans-serif;
                font-size: clamp(0.95rem, 2.8vw, 1.2rem);
                letter-spacing: 0.08em;
                color: var(--accent-gold);
                opacity: 0;
                transition: opacity 0.22s ease, transform 0.22s ease;
                text-transform: uppercase;
                white-space: nowrap;
            }

            .feedback-badge.show {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }

            .reaction-gif {
                position: absolute;
                width: min(32vw, 180px);
                max-width: 40vw;
                border-radius: 1.1rem;
                border: 1px solid rgba(255, 255, 255, 0.16);
                background: rgba(12, 10, 28, 0.42);
                box-shadow: 0 16px 30px rgba(0, 0, 0, 0.25);
                opacity: 0;
                transform: scale(0.86);
                transition: opacity 0.24s ease, transform 0.24s ease;
            }

            .reaction-gif.show {
                opacity: 0.94;
                transform: scale(1);
            }

            .reaction-gif.score-gif {
                right: 0.8rem;
                bottom: 5.9rem;
            }

            .reaction-gif.fail-gif {
                left: 0.8rem;
                bottom: 5.9rem;
            }

            .hidden { display: none !important; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

            @media (max-width: 640px) {
                .screen { width: min(92vw, 28rem); padding: 1.5rem; }
                .button { width: 100%; }
                .hud { top: 0.75rem; left: 0.75rem; right: 0.75rem; }
                .hud-label {
                    font-size: 0.95rem;
                    padding: 0.42rem 0.8rem;
                }
            }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
            <div id="ui-layer" class="ui-layer">
                <!-- [agent-note][stage3] resolved-gif: score/fail reactions use catalogs/gifs.json and stay off the playfield center -->
                <div id="feedback-layer" class="feedback-layer" aria-hidden="true">
                    <div id="feedback-badge" class="feedback-badge">Bucket!</div>
                    <img
                        id="score-gif"
                        class="reaction-gif score-gif"
                        src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
                        alt="Celebration reaction"
                        decoding="async"
                        loading="eager"
                    >
                    <img
                        id="fail-gif"
                        class="reaction-gif fail-gif"
                        src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
                        alt="Missed shot reaction"
                        decoding="async"
                        loading="eager"
                    >
                </div>
                <div id="start-screen" class="screen glass-panel">
                <h1 class="title">STREET HOOPS</h1>
                <p class="subtitle">Own the neon blacktop and flick three high-arc trick shots before the buzzer energy runs dry.</p>
                <button id="start-btn" class="button button-primary">TIP OFF</button>
            </div>

            <div id="game-over-screen" class="hidden screen glass-panel">
                <h2 class="result-title">COURT CLOSED</h2>
                <div class="result-copy">Buckets made: <span id="finalScore" class="accent">0</span></div>
                <button id="restart-btn" class="button button-secondary">Run It Back</button>
            </div>
            
            <div id="hud" class="hud hidden">
                <div class="hud-label">Buckets: <span id="score" class="accent">0</span></div>
                <div class="hud-label">Plays Left: <span id="lives" style="color: #f87171;">3</span></div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                rim: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                uiStart: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                uiRestart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.cooldowns = new Map();
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    audio.volume = ({
                        score: 0.72,
                        rim: 0.45,
                        fail: 0.6,
                        shoot: 0.48,
                        uiStart: 0.55,
                        uiRestart: 0.45,
                        gameOver: 0.62
                    })[k] ?? 0.55;
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 0) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const lastPlayed = this.cooldowns.get(key) ?? 0;
                if (cooldown && now - lastPlayed < cooldown) return;
                this.cooldowns.set(key, now);

                const sound = this.sfx[key].cloneNode();
                sound.volume = this.sfx[key].volume;
                sound.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        
        // Physics constants
        const GRAVITY = 0.5;
        const BOUNCE = 0.7;
        const DRAG_POWER = 0.15;
        
        // Game Objects
        let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 20, state: 'idle' }; // idle, aiming, flying
        let hoop = { x: 0, y: 0, w: 100, rimR: 5 };
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        let clouds = [];
        let scoreResetTimer = null;
        let hasScoredThisShot = false;
        let activeFeedbackTimer = null;

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Reset ball position if idle
            if (ball.state === 'idle') {
                resetBall();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. PARALLAX & VISUALS */
        class Cloud {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height / 2);
                this.speed = 0.2 + Math.random() * 0.3;
                this.size = 30 + Math.random() * 40;
                this.opacity = 0.3 + Math.random() * 0.3;
            }
            update() {
                this.x += this.speed;
                if (this.x > width + 100) this.x = -100;
            }
            draw(ctx) {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.8, this.y - this.size * 0.2, this.size * 0.8, 0, Math.PI * 2);
                ctx.arc(this.x - this.size * 0.8, this.y - this.size * 0.2, this.size * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initClouds() {
            clouds = [];
            for(let i=0; i<5; i++) clouds.push(new Cloud());
        }

        /** 5. GAME LOGIC */
        const feedbackBadge = document.getElementById('feedback-badge');
        const scoreGif = document.getElementById('score-gif');
        const failGif = document.getElementById('fail-gif');

        function showFeedback(message, gifType) {
            feedbackBadge.textContent = message;
            feedbackBadge.classList.add('show');
            scoreGif.classList.toggle('show', gifType === 'score');
            failGif.classList.toggle('show', gifType === 'fail');

            clearTimeout(activeFeedbackTimer);
            activeFeedbackTimer = setTimeout(() => {
                feedbackBadge.classList.remove('show');
                scoreGif.classList.remove('show');
                failGif.classList.remove('show');
            }, 1400);
        }

        function resetBall() {
            ball.x = width * 0.2;
            ball.y = height * 0.7;
            ball.vx = 0;
            ball.vy = 0;
            ball.state = 'idle';
            hasScoredThisShot = false;
        }

        function moveHoop() {
            // Random position in the right half/upper area
            const minX = width * 0.4;
            const maxX = width - 100;
            const minY = height * 0.2;
            const maxY = height * 0.6;
            
            hoop.x = minX + Math.random() * (maxX - minX);
            hoop.y = minY + Math.random() * (maxY - minY);
            hoop.w = 90; // Rim width
        }

        function initGame() {
            score = 0;
            lives = 3;
            clearTimeout(scoreResetTimer);
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            initClouds();
            resetBall();
            moveHoop();
            showFeedback('Tip Off!', 'score');
        }

        function checkCollision() {
            // Left Rim Point
            let rimLx = hoop.x - hoop.w/2;
            let rimRx = hoop.x + hoop.w/2;
            let rimY = hoop.y;

            // Collision with Rim Left
            let dxL = ball.x - rimLx;
            let dyL = ball.y - rimY;
            let distL = Math.sqrt(dxL*dxL + dyL*dyL);
            
            if (distL < ball.r + hoop.rimR) {
                // Bounce
                audio.playSFX('rim');
                let angle = Math.atan2(dyL, dxL);
                let speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                ball.vx = Math.cos(angle) * speed * BOUNCE;
                ball.vy = Math.sin(angle) * speed * BOUNCE;
                // Push out
                let overlap = (ball.r + hoop.rimR) - distL;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
            }

            // Collision with Rim Right
            let dxR = ball.x - rimRx;
            let dyR = ball.y - rimY;
            let distR = Math.sqrt(dxR*dxR + dyR*dyR);

            if (distR < ball.r + hoop.rimR) {
                // Bounce
                audio.playSFX('rim');
                let angle = Math.atan2(dyR, dxR);
                let speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                ball.vx = Math.cos(angle) * speed * BOUNCE;
                ball.vy = Math.sin(angle) * speed * BOUNCE;
                // Push out
                let overlap = (ball.r + hoop.rimR) - distR;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
            }

            // Score Logic
            // Check if ball passes through the hoop plane (y) within x bounds
            // We use previous position to detect crossing
            let prevY = ball.y - ball.vy;
            if (!hasScoredThisShot && prevY < rimY && ball.y >= rimY) {
                if (ball.x > rimLx && ball.x < rimRx) {
                    hasScoredThisShot = true;
                    score++;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', 120);
                    showFeedback('Bucket Blitz!', 'score');
                    moveHoop();
                    clearTimeout(scoreResetTimer);
                    scoreResetTimer = setTimeout(resetBall, 400);
                }
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            
            // Clear
            // Background Gradient
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#140a2a');
            grad.addColorStop(0.55, '#43207d');
            grad.addColorStop(1, '#0f1521');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Arena glow
            let skyGlow = ctx.createRadialGradient(width * 0.78, height * 0.22, 10, width * 0.78, height * 0.22, 180);
            skyGlow.addColorStop(0, 'rgba(255, 217, 87, 0.5)');
            skyGlow.addColorStop(0.55, 'rgba(255, 143, 57, 0.2)');
            skyGlow.addColorStop(1, 'rgba(255, 143, 57, 0)');
            ctx.fillStyle = skyGlow;
            ctx.beginPath();
            ctx.arc(width * 0.78, height * 0.22, 180, 0, Math.PI*2);
            ctx.fill();

            // Parallax Clouds
            clouds.forEach(c => { c.update(); c.draw(ctx); });

            // Court floor
            const floorY = height - 50;
            ctx.fillStyle = '#120f1d';
            ctx.fillRect(0, floorY, width, 50);

            ctx.strokeStyle = 'rgba(125, 244, 255, 0.24)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(width, floorY);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 211, 71, 0.18)';
            ctx.beginPath();
            ctx.arc(width * 0.22, floorY, 95, Math.PI, Math.PI * 2);
            ctx.stroke();

            // Draw Hoop
            // Backboard
            ctx.fillStyle = 'rgba(245, 247, 255, 0.18)';
            ctx.fillRect(hoop.x - hoop.w/2 - 10, hoop.y - 80, hoop.w + 20, 80);
            ctx.strokeStyle = 'rgba(125, 244, 255, 0.85)';
            ctx.lineWidth = 3;
            ctx.strokeRect(hoop.x - hoop.w/2 - 10, hoop.y - 80, hoop.w + 20, 80);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.strokeRect(hoop.x - 20, hoop.y - 60, 40, 40);

            // Net (Visuals only)
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w/2, hoop.y);
            ctx.lineTo(hoop.x - hoop.w/3, hoop.y + 60);
            ctx.lineTo(hoop.x + hoop.w/3, hoop.y + 60);
            ctx.lineTo(hoop.x + hoop.w/2, hoop.y);
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Rim glow
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w/2, hoop.y);
            ctx.lineTo(hoop.x + hoop.w/2, hoop.y);
            ctx.strokeStyle = '#ff6a45';
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.w/2, hoop.y + 1);
            ctx.lineTo(hoop.x + hoop.w/2, hoop.y + 1);
            ctx.strokeStyle = 'rgba(255, 211, 71, 0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Physics Update
            if (ball.state === 'flying') {
                ball.vy += GRAVITY;
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Floor collision
                if (ball.y + ball.r > height - 50) {
                    ball.y = height - 50 - ball.r;
                    ball.vy *= -0.6; // Damping
                    ball.vx *= 0.95; // Friction
                    
                    // If stopped bouncing
                    if (Math.abs(ball.vy) < 1 && Math.abs(ball.vx) < 0.1) {
                        // Missed shot came to rest
                        loseLife();
                    }
                }

                // Wall collision (Bounce off sides)
                if (ball.x - ball.r < 0) {
                    ball.x = ball.r;
                    ball.vx *= -0.8;
                }
                if (ball.x + ball.r > width) {
                    ball.x = width - ball.r;
                    ball.vx *= -0.8;
                }

                checkCollision();
            }

            // Draw Aim Line
            if (ball.state === 'aiming') {
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                // Calculate predicted vector
                let aimDx = dragStart.x - dragCurrent.x;
                let aimDy = dragStart.y - dragCurrent.y;
                
                // Draw trajectory preview (dots)
                let simX = ball.x;
                let simY = ball.y;
                let simVx = aimDx * DRAG_POWER;
                let simVy = aimDy * DRAG_POWER;
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                for(let i=0; i<15; i++) {
                    simVy += GRAVITY;
                    simX += simVx;
                    simY += simVy;
                    ctx.beginPath();
                    ctx.arc(simX, simY, 3, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // Draw Ball
            ctx.save();
            ctx.translate(ball.x, ball.y);
            // Rotate ball based on velocity approx
            // (Not strictly physics accurate rotation but looks good)
            let rotation = (ball.x * 0.05); 
            ctx.rotate(rotation);
            
            // Ball Body
            const ballGlow = ctx.createRadialGradient(-6, -8, 4, 0, 0, ball.r + 8);
            ballGlow.addColorStop(0, '#ffd977');
            ballGlow.addColorStop(0.38, '#ffb13c');
            ballGlow.addColorStop(1, '#e95a11');
            ctx.beginPath();
            ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = ballGlow;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2a1202';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-5, -6, ball.r * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 243, 196, 0.55)';
            ctx.fill();
            
            // Ball Lines
            ctx.beginPath();
            ctx.moveTo(0, -ball.r);
            ctx.quadraticCurveTo(ball.r*0.6, 0, 0, ball.r);
            ctx.moveTo(-ball.r*0.7, -ball.r*0.7);
            ctx.quadraticCurveTo(0, 0, ball.r*0.7, ball.r*0.7);
            ctx.stroke();
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function loseLife() {
            lives--;
            document.getElementById('lives').innerText = lives;
            audio.playSFX('fail', 120);
            showFeedback(lives <= 0 ? 'Court Closed!' : 'Brick!', 'fail');
            
            if (lives <= 0) {
                gameOver();
            } else {
                resetBall();
            }
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('gameOver');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. INPUT CONTROLS */
        // Mouse
        canvas.addEventListener('mousedown', e => {
            if (!gameActive || ball.state === 'flying') return;
            ball.state = 'aiming';
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
            dragCurrent.x = e.clientX;
            dragCurrent.y = e.clientY;
        });

        window.addEventListener('mousemove', e => {
            if (ball.state === 'aiming') {
                dragCurrent.x = e.clientX;
                dragCurrent.y = e.clientY;
            }
        });

        window.addEventListener('mouseup', e => {
            if (ball.state === 'aiming') {
                shootBall();
            }
        });

        // Touch
        canvas.addEventListener('touchstart', e => {
            if (!gameActive || ball.state === 'flying') return;
            e.preventDefault(); // Prevent scroll
            ball.state = 'aiming';
            let t = e.touches[0];
            dragStart.x = t.clientX;
            dragStart.y = t.clientY;
            dragCurrent.x = t.clientX;
            dragCurrent.y = t.clientY;
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            if (ball.state === 'aiming') {
                e.preventDefault();
                let t = e.touches[0];
                dragCurrent.x = t.clientX;
                dragCurrent.y = t.clientY;
            }
        }, {passive: false});

        window.addEventListener('touchend', e => {
            if (ball.state === 'aiming') {
                shootBall();
            }
        });

        function shootBall() {
            ball.state = 'flying';
            let dx = dragStart.x - dragCurrent.x;
            let dy = dragStart.y - dragCurrent.y;
            
            // Cap max power
            const maxDrag = 300;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDrag) {
                let scale = maxDrag / dist;
                dx *= scale;
                dy *= scale;
            }

            audio.playSFX('shoot', 80);
            ball.vx = dx * DRAG_POWER;
            ball.vy = dy * DRAG_POWER;
        }

        /** UI BINDINGS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('uiStart');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('uiRestart');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
        
    });
    </script>
</body>
</html>
