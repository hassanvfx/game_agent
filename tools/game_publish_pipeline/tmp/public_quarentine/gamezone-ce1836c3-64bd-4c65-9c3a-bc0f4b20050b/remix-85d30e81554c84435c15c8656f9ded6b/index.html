<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rhythm Snapshot</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <!-- [agent-note][stage4] repaired: required-font-remap | title-display=Orbitron | ui-readability=Exo 2 via catalogs/fonts.json -->
    <style>
        :root {
            --bg-dark: #08111f;
            --bg-accent: #112847;
            --panel-bg: rgba(8, 20, 39, 0.7);
            --panel-border: rgba(122, 241, 255, 0.34);
            --text-main: #f7fbff;
            --text-soft: rgba(231, 243, 255, 0.82);
            --accent: #ff6b9f;
            --accent-strong: #ffd86b;
            --accent-cool: #7af1ff;
            --accent-deep: #13315b;
            --lane-glow: rgba(122, 241, 255, 0.24);
            --danger: #ff5a7f;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(122, 241, 255, 0.18), transparent 32%),
                radial-gradient(circle at 20% 80%, rgba(255, 107, 159, 0.2), transparent 24%),
                linear-gradient(180deg, #09101d 0%, #0b1630 42%, #050b16 100%);
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            position: relative;
            color: var(--text-main);
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0 47%, rgba(122, 241, 255, 0.06) 50%, transparent 53%),
                linear-gradient(transparent 0 47%, rgba(255, 255, 255, 0.04) 50%, transparent 53%);
            background-size: 150px 150px;
            mix-blend-mode: screen;
            opacity: 0.32;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 12%, transparent 88%, rgba(255, 255, 255, 0.04));
            opacity: 0.5;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(20, 42, 74, 0.9), rgba(7, 17, 34, 0.82)),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 18px rgba(122, 241, 255, 0.12);
        }

        .hidden {
            display: none !important;
        }

        .animate-pulse-fast {
            animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .pulse-soft {
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .55; }
        }

        #game-container,
        #ui-layer,
        .screen-overlay {
            position: absolute;
            inset: 0;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            pointer-events: none;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            box-sizing: border-box;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 12px;
        }

        .hud-card {
            color: var(--text-main);
            border-radius: 18px;
            padding: 10px 16px;
            min-width: 96px;
            position: relative;
            overflow: hidden;
        }

        .hud-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0 35%, rgba(255, 255, 255, 0.1) 50%, transparent 65%);
            opacity: 0.75;
            pointer-events: none;
        }

        .hud-label {
            font-size: 11px;
            opacity: 0.82;
            letter-spacing: 0.18em;
            color: var(--accent-cool);
        }

        .hud-value {
            font-size: 28px;
            line-height: 1;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(122, 241, 255, 0.28);
        }

        .hud-value-accent {
            color: var(--accent-strong);
        }

        .screen-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        #start-screen {
            background:
                radial-gradient(circle at top, rgba(122, 241, 255, 0.14), transparent 34%),
                linear-gradient(180deg, rgba(2, 7, 18, 0.72), rgba(0, 0, 0, 0.82));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.5s ease;
        }

        #game-over-screen {
            background:
                radial-gradient(circle at center, rgba(255, 107, 159, 0.16), transparent 30%),
                rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .game-title,
        .game-over-title {
            margin: 0 0 8px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .game-title {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2.8rem, 9vw, 5rem);
            line-height: 0.92;
            letter-spacing: 0.05em;
            text-shadow:
                0 0 18px rgba(255, 216, 107, 0.65),
                0 0 36px rgba(122, 241, 255, 0.18);
        }

        .title-accent {
            color: var(--accent);
        }

        .hero-card {
            position: relative;
            max-width: min(90vw, 560px);
            padding: 24px 22px 28px;
            border-radius: 28px;
            overflow: hidden;
        }

        .hero-card::before,
        .hero-card::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .hero-card::before {
            inset: 0;
            background:
                radial-gradient(circle at 16% 18%, rgba(255, 216, 107, 0.34), transparent 18%),
                radial-gradient(circle at 84% 22%, rgba(122, 241, 255, 0.24), transparent 20%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 58%);
            opacity: 0.95;
        }

        .hero-card::after {
            width: 110px;
            height: 110px;
            right: -16px;
            bottom: -24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 159, 0.34), transparent 72%);
        }

        .camera-mascot {
            width: clamp(96px, 22vw, 132px);
            aspect-ratio: 1;
            margin: 0 auto 18px;
            position: relative;
            border-radius: 28px;
            border: 2px solid rgba(247, 251, 255, 0.18);
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.32), transparent 22%),
                linear-gradient(145deg, #1f4d79, #102541);
            box-shadow:
                0 0 0 6px rgba(122, 241, 255, 0.08),
                0 16px 26px rgba(0, 0, 0, 0.38),
                0 0 22px rgba(122, 241, 255, 0.24);
        }

        .camera-mascot::before,
        .camera-mascot::after {
            content: "";
            position: absolute;
        }

        .camera-mascot::before {
            width: 54%;
            aspect-ratio: 1;
            inset: 23% auto auto 23%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%, #dffbff 0 10%, #7af1ff 22%, #264f7f 54%, #0b1630 74%);
            border: 4px solid rgba(255, 216, 107, 0.92);
            box-shadow: 0 0 20px rgba(122, 241, 255, 0.4);
        }

        .camera-mascot::after {
            width: 28%;
            height: 16%;
            top: 14%;
            right: 14%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff6b9f, #ffd86b);
            box-shadow: -48px 16px 0 -6px rgba(255, 255, 255, 0.92);
        }

        .mascot-caption {
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.15rem, 4vw, 1.7rem);
            letter-spacing: 0.08em;
            color: var(--accent-cool);
            text-shadow: 0 0 16px rgba(122, 241, 255, 0.28);
        }

        .subtitle {
            margin: 0 0 26px;
            color: var(--text-soft);
            font-size: clamp(1rem, 3vw, 1.45rem);
            max-width: 32rem;
        }

        .instruction-copy {
            margin: 0 0 18px;
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(0.98rem, 2.8vw, 1.2rem);
            letter-spacing: 0.04em;
        }

        .timing-copy {
            margin: 0 0 28px;
            color: var(--text-soft);
            font-size: clamp(0.85rem, 2.4vw, 1rem);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .game-over-title {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2.4rem, 7vw, 4rem);
        }

        .results-label {
            color: var(--text-main);
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            margin-bottom: 8px;
        }

        .final-score-value {
            color: var(--accent-strong);
            font-size: clamp(3rem, 10vw, 5.5rem);
            line-height: 1;
            font-weight: 700;
            margin-bottom: 28px;
            text-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .primary-btn,
        .secondary-btn {
            border: none;
            border-radius: 999px;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            pointer-events: auto;
            transform: scale(1);
            transition: transform 0.18s ease, background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: scale(1.05);
        }

        .primary-btn:active,
        .secondary-btn:active {
            transform: scale(0.96);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent), #ff8f69);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 16px 42px;
            font-size: clamp(1.1rem, 3.4vw, 1.7rem);
            box-shadow: 0 14px 30px rgba(255, 90, 127, 0.28);
        }

        .secondary-btn {
            background: linear-gradient(135deg, #eafcff, #b9f0ff);
            color: var(--bg-dark);
            padding: 14px 34px;
            font-size: clamp(1rem, 3vw, 1.35rem);
            box-shadow: 0 14px 30px rgba(122, 241, 255, 0.18);
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 12px;
            }

            .hud-card {
                min-width: 84px;
                padding: 8px 12px;
            }

            .hud-value {
                font-size: 24px;
            }

            .screen-overlay {
                padding: 18px;
            }

            .hero-card {
                padding: 20px 16px 24px;
            }

            .instruction-copy {
                margin-bottom: 14px;
            }

            .timing-copy {
                margin-bottom: 22px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<script>
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => {
    window.gameConfig[k] = window.gameConfigDefs[k].value;
});

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'musicVolume' && audioManager) {
            audioManager.setVolume(val);
        }
    }
};

class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmNode = null;
        this.buffers = {};
        this.unlocked = false;
        this.volume = window.gameConfig.musicVolume;
    }

    async init() {
        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
            });
            ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock, { once: true }));

        this.loadBuffer('sfx_hit');
        this.loadBuffer('sfx_good');
        this.loadBuffer('sfx_miss');
        this.loadBuffer('sfx_start');
        this.loadBuffer('sfx_gameover');
    }

    async loadBuffer(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, will use fallback', id);
        }
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = this.volume;
        el.play().catch(() => console.log('Autoplay prevented'));
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    setVolume(v) {
        this.volume = v;
        const el = document.getElementById('bgm_main');
        if (el) el.volume = v;
    }

    playSfx(id, fallbackType = 'beep') {
        if (!this.unlocked || this.ctx.state !== 'running') return;

        if (this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            source.buffer = this.buffers[id];
            const gain = this.ctx.createGain();
            gain.gain.value = this.volume;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(fallbackType);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'beep') {
            osc.frequency.setValueAtTime(880, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'miss') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        }
    }
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audioManager = new AudioManager();

let gameState = 'START';
let feedbackMode = 'idle';
let feedbackTimer = 0;
let score = 0;
let combo = 0;
let lastTime = 0;
let notes = [];
let particles = [];
let texts = [];
let spawnTimer = 0;
let beatPulse = 0;
let bgOffset = 0;

const featuredSnapshotImg = document.getElementById('asset_couple');

const TARGET_Y_PCT = 0.85;
const SPAWN_RATE = 600;
const HIT_WINDOW = 80;
const PERFECT_WINDOW = 30;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();
    audioManager.init();

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', resetGame);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });

    requestAnimationFrame(gameLoop);
});

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');

    score = 0;
    combo = 0;
    notes = [];
    particles = [];
    texts = [];
    spawnTimer = 0;
    gameState = 'PLAYING';

    updateHud();
    triggerFeedback('start', 1.2);
    audioManager.playSfx('sfx_start', 'beep');
    audioManager.playBgm();
}

function resetGame() {
    startGame();
}

function gameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = score;
    triggerFeedback('miss', 1.8);
    audioManager.playSfx('sfx_gameover', 'miss');
    audioManager.stopBgm();
}

function spawnNote() {
    const lanes = [0.25, 0.5, 0.75];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    const rect = canvas.getBoundingClientRect();

    notes.push({
        x: rect.width * lane,
        y: -50,
        active: true,
        color: Math.random() > 0.5 ? '#FFD166' : '#FF6B6B'
    });
}

function createParticle(x, y, color, type = 'sparkle') {
    const count = type === 'burst' ? 15 : 1;
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 5 + 2,
            type: type
        });
    }
}

function createFloatingText(text, x, y, color) {
    texts.push({
        text: text,
        x: x,
        y: y,
        life: 1.0,
        color: color,
        vy: -2
    });
}

function triggerFeedback(mode, duration = 1) {
    feedbackMode = mode;
    feedbackTimer = duration;
}

function handleInput(e) {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const targetY = rect.height * TARGET_Y_PCT;

    let nearestNote = null;
    let minDist = Infinity;

    for (const note of notes) {
        if (!note.active) continue;
        const dist = Math.abs(note.y - targetY);
        if (dist < HIT_WINDOW && dist < minDist) {
            minDist = dist;
            nearestNote = note;
        }
    }

    if (nearestNote) {
        nearestNote.active = false;
        beatPulse = 1.0;

        if (minDist < PERFECT_WINDOW) {
            score += 100 + (combo * 10);
            combo++;
            createFloatingText('PERFECT SHOT', rect.width / 2, rect.height / 2, '#FFD166');
            createParticle(nearestNote.x, nearestNote.y, '#FFD166', 'burst');
            triggerFeedback('perfect', 0.9);
            audioManager.playSfx('sfx_hit', 'beep');
        } else {
            score += 50 + (combo * 5);
            combo++;
            createFloatingText('ON BEAT', rect.width / 2, rect.height / 2, '#FFFFFF');
            createParticle(nearestNote.x, nearestNote.y, '#FFFFFF', 'burst');
            triggerFeedback('good', 0.7);
            audioManager.playSfx('sfx_good', 'beep');
        }
    } else {
        combo = 0;
        triggerFeedback('miss', 0.8);
        audioManager.playSfx('sfx_miss', 'miss');
    }

    updateHud();
}

function updateHud() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('combo-display').textContent = combo;
}

function gameLoop(timestamp) {
    try {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        const rect = canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        feedbackTimer = Math.max(0, feedbackTimer - dt);

        const backdrop = ctx.createLinearGradient(0, 0, 0, h);
        backdrop.addColorStop(0, '#09101d');
        backdrop.addColorStop(0.55, '#0e2143');
        backdrop.addColorStop(1, '#050b16');
        ctx.fillStyle = backdrop;
        ctx.fillRect(0, 0, w, h);

        bgOffset += dt * 20;

        const scanGradient = ctx.createRadialGradient(w * 0.5, h * 0.25, 20, w * 0.5, h * 0.25, w * 0.55);
        scanGradient.addColorStop(0, 'rgba(122, 241, 255, 0.16)');
        scanGradient.addColorStop(1, 'rgba(122, 241, 255, 0)');
        ctx.fillStyle = scanGradient;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(122, 241, 255, 0.08)';
        ctx.lineWidth = 1;
        for (let gx = 0; gx <= w; gx += Math.max(56, w / 8)) {
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.lineTo(gx, h);
            ctx.stroke();
        }
        for (let gy = 0; gy <= h; gy += Math.max(56, h / 7)) {
            ctx.beginPath();
            ctx.moveTo(0, gy);
            ctx.lineTo(w, gy);
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i = 0; i < 20; i++) {
            const bx = (i * 100 + bgOffset) % (w + 100) - 50;
            const by = (i * 70) % h;
            ctx.beginPath();
            ctx.arc(bx, by, (i % 3) + 2, 0, Math.PI * 2);
            ctx.fill();
        }

        if (featuredSnapshotImg.complete && featuredSnapshotImg.naturalWidth > 0) {
            beatPulse = Math.max(0, beatPulse - dt * 4);

            const scaleBounce = beatPulse * 0.15;
            const squash = 1 + scaleBounce;
            const stretch = 1 - scaleBounce * 0.5;

            const imgW = Math.min(w * 0.8, 400);
            const imgH = imgW * (featuredSnapshotImg.naturalHeight / featuredSnapshotImg.naturalWidth);
            const centerX = w / 2;
            const centerY = h * 0.4;

            ctx.save();
            ctx.translate(centerX, centerY);

            if (combo > 10) {
                ctx.rotate(Math.sin(timestamp * 0.01) * 0.05);
            }

            ctx.scale(squash, stretch);

            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.roundRect(-imgW / 2 - 10, -imgH / 2 - 10, imgW + 20, imgH + 20 + 40, 10);
            ctx.fill();

            ctx.drawImage(featuredSnapshotImg, -imgW / 2, -imgH / 2, imgW, imgH);

            if (beatPulse > 0.1) {
                ctx.strokeStyle = `hsl(${timestamp * 0.2}, 100%, 60%)`;
                ctx.lineWidth = 5;
                ctx.strokeRect(-imgW / 2 - 5, -imgH / 2 - 5, imgW + 10, imgH + 10);
            }

            ctx.restore();
        }

        const perfectGif = document.getElementById('gif_perfect');
        const missGif = document.getElementById('gif_miss');
        if (feedbackTimer > 0) {
            const activeGif = feedbackMode === 'miss' ? missGif : perfectGif;
            if (activeGif && activeGif.complete && activeGif.naturalWidth > 0) {
                const overlayW = Math.min(w * 0.28, 140);
                const overlayH = overlayW * (activeGif.naturalHeight / activeGif.naturalWidth);
                const overlayX = w - overlayW - 24;
                const overlayY = feedbackMode === 'miss' ? h * 0.22 : h * 0.58;
                ctx.save();
                ctx.globalAlpha = Math.min(0.95, feedbackTimer);
                ctx.fillStyle = 'rgba(6, 14, 28, 0.72)';
                ctx.beginPath();
                ctx.roundRect(overlayX - 8, overlayY - 8, overlayW + 16, overlayH + 16, 18);
                ctx.fill();
                ctx.drawImage(activeGif, overlayX, overlayY, overlayW, overlayH);
                ctx.restore();
            }
        }

        if (gameState === 'PLAYING') {
            spawnTimer -= dt * 1000;
            if (spawnTimer <= 0) {
                spawnNote();
                spawnTimer = SPAWN_RATE / (1 + combo * 0.01);
                if (spawnTimer < 300) spawnTimer = 300;
            }

            const targetY = h * TARGET_Y_PCT;
            const laneWidth = w / 3;
            for (let laneIndex = 0; laneIndex < 3; laneIndex++) {
                const laneX = laneIndex * laneWidth;
                const laneGradient = ctx.createLinearGradient(laneX, 0, laneX + laneWidth, 0);
                laneGradient.addColorStop(0, 'rgba(122, 241, 255, 0.03)');
                laneGradient.addColorStop(0.5, 'rgba(122, 241, 255, 0.09)');
                laneGradient.addColorStop(1, 'rgba(122, 241, 255, 0.03)');
                ctx.fillStyle = laneGradient;
                ctx.fillRect(laneX, 0, laneWidth, h);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, targetY);
            ctx.lineTo(w, targetY);
            ctx.stroke();

            ctx.fillStyle = 'rgba(122, 241, 255, 0.14)';
            ctx.fillRect(0, targetY - 10, w, 20);

            if (beatPulse > 0.2) {
                ctx.strokeStyle = window.gameConfig.themeColor;
                ctx.lineWidth = 8 * beatPulse;
                ctx.stroke();

                ctx.fillStyle = `rgba(255, 216, 107, ${0.16 * beatPulse})`;
                ctx.fillRect(0, targetY - 18, w, 36);
            }

            const speed = h * (window.gameConfig.noteSpeed / 10);

            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                if (!note.active) {
                    notes.splice(i, 1);
                    continue;
                }

                note.y += speed * dt;

                ctx.save();
                ctx.translate(note.x, note.y);
                ctx.fillStyle = note.color;
                ctx.shadowColor = note.color;
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.moveTo(0, -24);
                ctx.lineTo(18, -8);
                ctx.lineTo(16, 18);
                ctx.lineTo(0, 26);
                ctx.lineTo(-16, 18);
                ctx.lineTo(-18, -8);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#FFF6DA';
                ctx.beginPath();
                ctx.arc(0, -2, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.65)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-6, 8);
                ctx.lineTo(6, 8);
                ctx.stroke();
                ctx.restore();

                if (note.y > h + 50) {
                    notes.splice(i, 1);
                    combo = 0;
                    triggerFeedback('miss', 0.85);
                    createFloatingText('MISSED', note.x, h - 50, '#FF6B6B');
                    audioManager.playSfx('sfx_miss', 'miss');
                    updateHud();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= dt * 1.5;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                if (p.type === 'sparkle') {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                } else {
                    const r = p.size;
                    ctx.moveTo(p.x, p.y - r);
                    ctx.lineTo(p.x + r, p.y);
                    ctx.lineTo(p.x, p.y + r);
                    ctx.lineTo(p.x - r, p.y);
                }
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            ctx.textAlign = 'center';
            ctx.font = '600 34px "Exo 2"';
            for (let i = texts.length - 1; i >= 0; i--) {
                const t = texts[i];
                t.y += t.vy;
                t.life -= dt;

                if (t.life <= 0) {
                    texts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(t.x, t.y);
                const scale = 1 + (1 - t.life) * 0.5;
                ctx.scale(scale, scale);
                ctx.fillStyle = t.color;
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 4;
                ctx.strokeText(t.text, 0, 0);
                ctx.fillText(t.text, 0, 0);
                ctx.restore();
            }
        }
    } catch (e) {
        console.error('Game Loop Error:', e);
    }

    requestAnimationFrame(gameLoop);
}
</script>
