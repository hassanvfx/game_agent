<![CDATA[
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Courier Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide | ui=Rajdhani via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-ui: 'Rajdhani', system-ui, sans-serif;
            --font-display: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            --bg-top: #080a1b;
            --bg-mid: #10163a;
            --bg-bottom: #03040b;
            --panel: rgba(10, 14, 34, 0.84);
            --panel-border: rgba(92, 245, 255, 0.88);
            --panel-shadow: rgba(5, 9, 24, 0.7);
            --text-main: #eef7ff;
            --text-muted: #8ca8cf;
            --accent-cyan: #5cf5ff;
            --accent-pink: #ff5fd2;
            --accent-gold: #ffe66d;
            --danger: #ff627a;
            --success: #87ff9f;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(92, 245, 255, 0.18), transparent 34%),
                radial-gradient(circle at 50% 120%, rgba(255, 95, 210, 0.2), transparent 38%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
            touch-action: manipulation;
            font-family: var(--font-ui);
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        .pixel-card {
            position: relative;
            background:
                linear-gradient(180deg, rgba(18, 25, 58, 0.96), rgba(7, 10, 27, 0.92));
            border: 3px solid var(--panel-border);
            box-shadow:
                0 16px 38px var(--panel-shadow),
                0 0 0 2px rgba(255, 255, 255, 0.08) inset,
                0 0 22px rgba(92, 245, 255, 0.18);
            border-radius: 22px;
            padding: 1.35rem 1.1rem 1.1rem;
            text-align: center;
            backdrop-filter: blur(8px);
            max-width: min(90vw, 360px);
            width: 360px;
            transform: translateY(0);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
            overflow: hidden;
        }

        .pixel-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(92, 245, 255, 0.14), transparent 46%),
                radial-gradient(circle at 50% 0%, rgba(255, 95, 210, 0.18), transparent 52%);
            pointer-events: none;
        }

        .btn-3d {
            background: linear-gradient(180deg, #89ff9f, #28d897);
            border: 3px solid rgba(255, 255, 255, 0.92);
            border-bottom-width: 6px;
            color: #04111f;
            font-family: var(--font-display);
            font-size: clamp(1rem, 5vw, 1.45rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            margin-top: 0.9rem;
            width: 100%;
            text-shadow: none;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(20, 255, 170, 0.22);
        }

        .btn-3d:hover,
        .btn-3d:focus-visible {
            filter: brightness(1.06);
            box-shadow: 0 0 0 3px rgba(92, 245, 255, 0.18), 0 12px 24px rgba(20, 255, 170, 0.28);
            outline: none;
        }

        .btn-3d:active {
            transform: translateY(3px);
            border-bottom-width: 3px;
            box-shadow: 0 5px 12px rgba(20, 255, 170, 0.2);
        }

        .btn-red {
            background: linear-gradient(180deg, #ff8aa0, #ff5578);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 88, 128, 0.22);
        }

        .text-shadow {
            text-shadow: 0 2px 0 rgba(1, 8, 20, 0.95), 0 0 12px rgba(92, 245, 255, 0.28);
        }

        .hud-score {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            min-width: 72px;
            padding: 0.4rem 0.6rem;
            font-size: clamp(1rem, 4vw, 1.4rem);
            color: var(--accent-gold);
            font-family: var(--font-display);
            letter-spacing: 0.08em;
            text-align: center;
            background: rgba(7, 11, 29, 0.72);
            border: 2px solid rgba(92, 245, 255, 0.5);
            border-radius: 14px;
            text-shadow: 0 0 12px rgba(255, 230, 109, 0.48);
            box-shadow: 0 10px 24px rgba(2, 7, 20, 0.42);
            z-index: 10;
        }

        .feedback-banner {
            position: absolute;
            top: calc(max(14px, env(safe-area-inset-top)) + 68px);
            left: 50%;
            transform: translateX(-50%);
            min-width: min(70vw, 260px);
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(4, 13, 28, 0.82);
            border: 1px solid rgba(92, 245, 255, 0.46);
            box-shadow: 0 10px 24px rgba(1, 8, 20, 0.38);
            text-align: center;
            font-family: var(--font-ui);
            font-size: clamp(0.82rem, 2.8vw, 1rem);
            letter-spacing: 0.08em;
            color: var(--accent-cyan);
            opacity: 0;
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9;
        }

        .feedback-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);
        }

        .feedback-banner.fail {
            color: #ffd6dc;
            border-color: rgba(255, 98, 122, 0.55);
        }

        .reaction-gif {
            position: absolute;
            right: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            width: min(24vw, 110px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(92, 245, 255, 0.45);
            background: rgba(3, 8, 20, 0.55);
            box-shadow: 0 12px 28px rgba(2, 7, 20, 0.35);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
            z-index: 8;
        }

        .reaction-gif.show {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .reaction-gif.fail-gif {
            left: 12px;
            right: auto;
            bottom: max(12px, env(safe-area-inset-bottom));
            width: min(30vw, 128px);
        }

        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 5;
            touch-action: none;
        }

        .zone-left { left: 0; }
        .zone-right { right: 0; }

        .hidden { display: none !important; }

        .screen-title,
        .game-over-title {
            position: relative;
            margin: 0 0 0.55rem;
            font-family: var(--font-display);
            font-size: clamp(1.75rem, 8vw, 2.7rem);
            line-height: 1.04;
            letter-spacing: 0.08em;
        }

        .screen-title {
            color: var(--accent-cyan);
        }

        .screen-subtitle {
            margin: 0 0 1rem;
            font-size: clamp(1rem, 3.2vw, 1.12rem);
            line-height: 1.45;
            letter-spacing: 0.03em;
            color: var(--text-muted);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin: 0 0 1rem;
            font-size: clamp(0.84rem, 2.8vw, 0.98rem);
            color: #b4c5e6;
            flex-wrap: wrap;
        }

        .controls-chip {
            padding: 0.45rem 0.65rem;
            border-radius: 999px;
            border: 1px solid rgba(92, 245, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 12px rgba(92, 245, 255, 0.08) inset;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.65rem;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-family: var(--font-ui);
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-gold);
            border: 1px solid rgba(255, 230, 109, 0.35);
            background: rgba(255, 230, 109, 0.08);
        }

        .game-over-title {
            color: var(--danger);
        }

        .final-score-text {
            margin: 0 0 1rem;
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: var(--text-main);
        }

        .score-highlight {
            color: var(--accent-gold);
        }

        @media (max-width: 480px) {
            .pixel-card {
                padding: 1.1rem 0.9rem 0.95rem;
            }

            .reaction-gif {
                width: min(26vw, 96px);
            }

            .reaction-gif.fail-gif {
                width: min(32vw, 112px);
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="ui-layer">
        <div id="hud" class="hud-score hidden">0</div>
        <div id="feedback-banner" class="feedback-banner hidden" aria-live="polite"></div>

        <!-- [agent-note][stage3] resolved-gif: collect/hype feedback + crash feedback via catalogs/gifs.json -->
        <img
            id="collect-gif"
            class="reaction-gif hidden"
            src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp"
            alt="Reward reaction"
            decoding="async"
            loading="lazy"
        >
        <img
            id="fail-gif"
            class="reaction-gif fail-gif hidden"
            src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            alt="Crash reaction"
            decoding="async"
            loading="lazy"
        >

        <div id="start-screen" class="pixel-card interactive">
            <div class="hero-badge">🤖 Courier Unit // Online</div>
            <h1 class="screen-title text-shadow">NEON COURIER RUN</h1>
            <p class="screen-subtitle">Guide the courier through rogue bot traffic, bank glowing data cores, and keep the route alive.</p>
            <div class="controls-row">
                <div class="controls-chip">👈 TAP LEFT</div>
                <div class="controls-chip">TAP RIGHT 👉</div>
            </div>
            <button id="start-btn" class="btn-3d">DELIVER</button>
        </div>

        <div id="game-over-screen" class="pixel-card interactive hidden">
            <h2 class="game-over-title text-shadow">SIGNAL LOST</h2>
            <p class="final-score-text">DATA BANKED: <span id="final-score" class="score-highlight">0</span></p>
            <button id="restart-btn" class="btn-3d btn-red">RETRY ROUTE</button>
        </div>
    </div>

    <div id="controls" class="hidden">
        <div id="zone-left" class="touch-zone zone-left"></div>
        <div id="zone-right" class="touch-zone zone-right"></div>
    </div>

    <script>
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        const VISUAL_THEME = {
            skyTop: '#080d22',
            skyMid: '#162558',
            skyGlow: '#291c68',
            roadNear: '#0a0f24',
            roadFar: '#1c2350',
            grid: 'rgba(92, 245, 255, 0.24)',
            laneGlow: 'rgba(255, 95, 210, 0.22)',
            horizonGlow: 'rgba(92, 245, 255, 0.35)',
            playerCore: '#5cf5ff',
            playerTrim: '#ff77d9'
        };

        const AudioSys = {
            enabled: false,
            unlocked: false,
            bgm: null,
            sfx: {},
            pools: {},
            init() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.22;
                this.bgm.preload = 'auto';

                Object.entries(ASSETS.sfx).forEach(([key, src]) => {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = key === 'ui' ? 0.42 : key === 'start' ? 0.48 : key === 'fail' ? 0.54 : 0.5;
                    this.sfx[key] = audio;
                    this.pools[key] = [];
                });

                this.enabled = true;
            },
            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                if (this.bgm) {
                    this.bgm.load();
                }
                Object.values(this.sfx).forEach((audio) => audio.load());
            },
            playBGM() {
                if (!this.enabled || !this.unlocked || !this.bgm) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            },
            stopBGM() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            },
            play(key) {
                if (!this.enabled || !this.unlocked || !this.sfx[key]) return;
                const pool = this.pools[key];
                let voice = pool.find((audio) => audio.paused || audio.ended);
                if (!voice) {
                    voice = this.sfx[key].cloneNode();
                    voice.volume = this.sfx[key].volume;
                    pool.push(voice);
                }
                voice.currentTime = 0;
                voice.play().catch(() => {});
            }
        };

        const CONFIG = {
            fov: 350,
            cameraHeight: 180,
            horizonY: 0.4,
            laneWidth: 120,
            worldDepth: 3000,
            spawnDepth: 2500,
            playerSpeedX: 15,
            baseSpeedZ: 25,
            gravity: 0.8
        };

        let canvas, ctx;
        let width, height;
        let lastTime = 0;
        let gameActive = false;
        let score = 0;
        let speedZ = CONFIG.baseSpeedZ;
        let distanceTraveled = 0;
        let canvasFlash = 0;
        let currentRunCollected = 0;
        let feedbackTimer = null;
        let collectGifTimer = null;
        let failGifTimer = null;

        const input = { left: false, right: false };

        let player = { x: 0, y: 0, z: 0, w: 50, h: 50, d: 50, color: '#3b82f6' };
        let entities = [];
        let particles = [];
        let skylinePulse = 0;

        const ui = {
            hud: null,
            feedbackBanner: null,
            collectGif: null,
            failGif: null,
            startScreen: null,
            gameOverScreen: null,
            finalScore: null,
            controls: null,
            startButton: null,
            restartButton: null
        };

        function project(x, y, z) {
            const scale = CONFIG.fov / (CONFIG.fov + z);
            const screenX = (x * scale) + (width / 2);
            const screenY = ((y + CONFIG.cameraHeight) * scale) + (height * CONFIG.horizonY);
            return { x: screenX, y: screenY, scale };
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d', { alpha: false });

            ui.hud = document.getElementById('hud');
            ui.feedbackBanner = document.getElementById('feedback-banner');
            ui.collectGif = document.getElementById('collect-gif');
            ui.failGif = document.getElementById('fail-gif');
            ui.startScreen = document.getElementById('start-screen');
            ui.gameOverScreen = document.getElementById('game-over-screen');
            ui.finalScore = document.getElementById('final-score');
            ui.controls = document.getElementById('controls');
            ui.startButton = document.getElementById('start-btn');
            ui.restartButton = document.getElementById('restart-btn');

            AudioSys.init();
            resize();
            window.addEventListener('resize', resize);
            setupControls();
            requestAnimationFrame(loop);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function setupControls() {
            const leftZone = document.getElementById('zone-left');
            const rightZone = document.getElementById('zone-right');

            // [agent-note][stage4] repaired: mobile-tap-actionability | scope: gameplay touch suppression stays on play zones, UI buttons keep native tap/click behavior
            const handleStart = (dir) => (e) => { e.preventDefault(); input[dir] = true; };
            const handleEnd = (dir) => (e) => { e.preventDefault(); input[dir] = false; };

            leftZone.addEventListener('touchstart', handleStart('left'), { passive: false });
            leftZone.addEventListener('touchend', handleEnd('left'), { passive: false });
            leftZone.addEventListener('touchcancel', handleEnd('left'), { passive: false });
            leftZone.addEventListener('mousedown', handleStart('left'));
            leftZone.addEventListener('mouseup', handleEnd('left'));
            leftZone.addEventListener('mouseleave', handleEnd('left'));

            rightZone.addEventListener('touchstart', handleStart('right'), { passive: false });
            rightZone.addEventListener('touchend', handleEnd('right'), { passive: false });
            rightZone.addEventListener('touchcancel', handleEnd('right'), { passive: false });
            rightZone.addEventListener('mousedown', handleStart('right'));
            rightZone.addEventListener('mouseup', handleEnd('right'));
            rightZone.addEventListener('mouseleave', handleEnd('right'));

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
            });

            ui.startButton.addEventListener('click', startGame);
            ui.restartButton.addEventListener('click', startGame);

            [ui.startButton, ui.restartButton].forEach((button) => {
                button.addEventListener('pointerdown', () => {
                    AudioSys.unlock();
                    AudioSys.play('ui');
                });
            });
        }

        function resetVisualFeedback() {
            hideBanner();
            hideCollectGif();
            hideFailGif();
        }

        function showBanner(text, mode = 'info', duration = 1100) {
            clearTimeout(feedbackTimer);
            ui.feedbackBanner.textContent = text;
            ui.feedbackBanner.classList.remove('hidden', 'fail');
            if (mode === 'fail') {
                ui.feedbackBanner.classList.add('fail');
            }
            requestAnimationFrame(() => ui.feedbackBanner.classList.add('show'));
            feedbackTimer = setTimeout(hideBanner, duration);
        }

        function hideBanner() {
            ui.feedbackBanner.classList.remove('show', 'fail');
            ui.feedbackBanner.classList.add('hidden');
        }

        function showCollectGif() {
            clearTimeout(collectGifTimer);
            ui.collectGif.classList.remove('hidden');
            requestAnimationFrame(() => ui.collectGif.classList.add('show'));
            collectGifTimer = setTimeout(hideCollectGif, 950);
        }

        function hideCollectGif() {
            ui.collectGif.classList.remove('show');
            ui.collectGif.classList.add('hidden');
        }

        function showFailGif() {
            clearTimeout(failGifTimer);
            ui.failGif.classList.remove('hidden');
            requestAnimationFrame(() => ui.failGif.classList.add('show'));
            failGifTimer = setTimeout(hideFailGif, 1800);
        }

        function hideFailGif() {
            ui.failGif.classList.remove('show');
            ui.failGif.classList.add('hidden');
        }

        function resetGame() {
            gameActive = true;
            score = 0;
            speedZ = CONFIG.baseSpeedZ;
            distanceTraveled = 0;
            currentRunCollected = 0;
            canvasFlash = 0;

            player.x = 0;
            player.z = 200;

            entities = [];
            particles = [];

            ui.hud.innerText = '0';
            ui.startScreen.classList.add('hidden');
            ui.gameOverScreen.classList.add('hidden');
            ui.hud.classList.remove('hidden');
            ui.controls.classList.remove('hidden');
            resetVisualFeedback();

            AudioSys.playBGM();
            AudioSys.play('start');
            showBanner('ROUTE OPEN // BANK THE CORES', 'info', 1100);
        }

        function startGame() {
            AudioSys.unlock();
            resetGame();
        }

        function gameOver() {
            gameActive = false;
            AudioSys.stopBGM();
            AudioSys.play('fail');
            showBanner('SIGNAL LOST // ROUTE COLLAPSED', 'fail', 1800);
            showFailGif();

            ui.controls.classList.add('hidden');
            ui.hud.classList.add('hidden');
            ui.gameOverScreen.classList.remove('hidden');
            ui.finalScore.innerText = Math.floor(score);
        }

        function spawnEntity() {
            const lane = Math.floor(Math.random() * 3) - 1;
            const x = lane * (CONFIG.laneWidth * 1.5);

            const r = Math.random();
            let type = 'rock';
            if (r > 0.9) type = 'diamond';
            else if (r > 0.75) type = 'gold';
            else if (r > 0.6) type = 'tnt';
            else if (r > 0.4) type = 'creeper';

            entities.push({
                x,
                y: 0,
                z: CONFIG.spawnDepth,
                w: 80, h: 80, d: 80,
                type,
                active: true
            });
        }

        function update() {
            if (!gameActive) return;

            speedZ = CONFIG.baseSpeedZ + (score / 500);
            if (input.left) player.x -= CONFIG.playerSpeedX;
            if (input.right) player.x += CONFIG.playerSpeedX;

            const limit = CONFIG.laneWidth * 2.5;
            if (player.x < -limit) player.x = -limit;
            if (player.x > limit) player.x = limit;

            distanceTraveled += speedZ;
            if (distanceTraveled > 400) {
                distanceTraveled = 0;
                spawnEntity();
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                e.z -= speedZ;

                const zOverlap = (e.z < player.z + player.d && e.z + e.d > player.z);
                const xOverlap = (player.x < e.x + e.w && player.x + player.w > e.x);

                if (e.active && zOverlap && xOverlap) {
                    handleCollision(e);
                }

                if (e.z < -200) {
                    entities.splice(i, 1);
                    if (e.active && (e.type !== 'diamond' && e.type !== 'gold')) {
                        score += 10;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            canvasFlash = Math.max(0, canvasFlash - 0.02);
            ui.hud.innerText = Math.floor(score);
        }

        function handleCollision(e) {
            if (e.type === 'diamond' || e.type === 'gold') {
                const diamond = e.type === 'diamond';
                score += diamond ? 250 : 100;
                currentRunCollected += 1;
                AudioSys.play(diamond ? 'bonus' : 'collect');
                showCollectGif();
                showBanner(diamond ? 'JACKPOT CORE +' : 'CACHE SECURED +', 'info', diamond ? 1200 : 900);
                spawnParticles(e.x, e.y - 40, e.z, diamond ? '#5cf5ff' : '#ffe66d', diamond ? 14 : 10);
                e.active = false;
                e.w = 0;
            } else {
                spawnParticles(player.x, player.y - 20, player.z, '#ff0000', 30);
                AudioSys.play('hit');
                canvasFlash = 0.45;
                gameOver();
            }
        }

        function spawnParticles(x, y, z, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y, z,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20,
                    vz: (Math.random() - 0.5) * 20,
                    color,
                    size: Math.random() * 10 + 5,
                    life: 1.0
                });
            }
        }

        function drawCube(e) {
            if (e.w <= 0) return;

            const hw = e.w / 2;
            const h = e.h;
            const d = e.d;

            const v = [
                {x: e.x - hw, y: e.y - h, z: e.z},
                {x: e.x + hw, y: e.y - h, z: e.z},
                {x: e.x + hw, y: e.y, z: e.z},
                {x: e.x - hw, y: e.y, z: e.z},
                {x: e.x - hw, y: e.y - h, z: e.z + d},
                {x: e.x + hw, y: e.y - h, z: e.z + d},
                {x: e.x + hw, y: e.y, z: e.z + d},
                {x: e.x - hw, y: e.y, z: e.z + d}
            ];

            const p = v.map(pt => project(pt.x, pt.y, pt.z));

            let faceColor = '#888';
            let topColor = '#aaa';
            let sideColor = '#666';

            if (e.type === 'creeper') { faceColor = '#6f7cff'; topColor = '#a7b3ff'; sideColor = '#3746a8'; }
            else if (e.type === 'tnt') { faceColor = '#ff627a'; topColor = '#ffc1cb'; sideColor = '#9c2840'; }
            else if (e.type === 'diamond') { faceColor = '#5cf5ff'; topColor = '#d8fdff'; sideColor = '#1497a5'; }
            else if (e.type === 'gold') { faceColor = '#ffe66d'; topColor = '#fff4b0'; sideColor = '#d89a21'; }
            else if (e.color) { faceColor = VISUAL_THEME.playerCore; topColor = '#c8ffff'; sideColor = '#1d7aa9'; }

            ctx.fillStyle = sideColor;
            ctx.beginPath();
            if (e.x > 0) {
                ctx.moveTo(p[0].x, p[0].y);
                ctx.lineTo(p[3].x, p[3].y);
                ctx.lineTo(p[7].x, p[7].y);
                ctx.lineTo(p[4].x, p[4].y);
            } else {
                ctx.moveTo(p[1].x, p[1].y);
                ctx.lineTo(p[2].x, p[2].y);
                ctx.lineTo(p[6].x, p[6].y);
                ctx.lineTo(p[5].x, p[5].y);
            }
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(p[0].x, p[0].y);
            ctx.lineTo(p[1].x, p[1].y);
            ctx.lineTo(p[5].x, p[5].y);
            ctx.lineTo(p[4].x, p[4].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = faceColor;
            ctx.beginPath();
            ctx.moveTo(p[0].x, p[0].y);
            ctx.lineTo(p[1].x, p[1].y);
            ctx.lineTo(p[2].x, p[2].y);
            ctx.lineTo(p[3].x, p[3].y);
            ctx.closePath();
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(3, 8, 20, 0.55)';
            ctx.stroke();

            if (e.color) {
                const fw = p[1].x - p[0].x;
                const fh = p[3].y - p[0].y;
                ctx.fillStyle = VISUAL_THEME.playerTrim;
                ctx.fillRect(p[0].x + fw * 0.18, p[0].y + fh * 0.18, fw * 0.64, fh * 0.16);
                ctx.fillStyle = '#0b1730';
                ctx.fillRect(p[0].x + fw * 0.2, p[0].y + fh * 0.46, fw * 0.16, fh * 0.16);
                ctx.fillRect(p[0].x + fw * 0.64, p[0].y + fh * 0.46, fw * 0.16, fh * 0.16);
                ctx.fillStyle = '#f8feff';
                ctx.fillRect(p[0].x + fw * 0.28, p[0].y + fh * 0.66, fw * 0.44, fh * 0.08);
            }

            if (e.type === 'creeper') {
                ctx.fillStyle = '#000';
                const fw = p[1].x - p[0].x;
                const fh = p[3].y - p[0].y;
                ctx.fillRect(p[0].x + fw * 0.2, p[0].y + fh * 0.25, fw * 0.2, fh * 0.2);
                ctx.fillRect(p[0].x + fw * 0.6, p[0].y + fh * 0.25, fw * 0.2, fh * 0.2);
                ctx.fillRect(p[0].x + fw * 0.3, p[0].y + fh * 0.55, fw * 0.4, fh * 0.15);
                ctx.fillRect(p[0].x + fw * 0.2, p[0].y + fh * 0.65, fw * 0.2, fh * 0.2);
                ctx.fillRect(p[0].x + fw * 0.6, p[0].y + fh * 0.65, fw * 0.2, fh * 0.2);
            } else if (e.type === 'tnt') {
                ctx.fillStyle = '#fff';
                const fw = p[1].x - p[0].x;
                const fh = p[3].y - p[0].y;
                ctx.fillRect(p[0].x + fw * 0.1, p[0].y + fh * 0.4, fw * 0.8, fh * 0.2);
                ctx.fillStyle = '#000';
                ctx.font = 'bold ' + (fw * 0.4) + 'px var(--font-ui)';
                ctx.textAlign = 'center';
                ctx.fillText('TNT', p[0].x + fw / 2, p[0].y + fh * 0.55);
            }
        }

        function drawEnvironment() {
            const groundY = height * CONFIG.horizonY;
            skylinePulse += 0.02;

            const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, VISUAL_THEME.skyTop);
            skyGrad.addColorStop(0.55, VISUAL_THEME.skyMid);
            skyGrad.addColorStop(1, VISUAL_THEME.skyGlow);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, groundY);

            const horizonGlow = ctx.createRadialGradient(width * 0.5, groundY - 10, 10, width * 0.5, groundY - 10, width * 0.5);
            horizonGlow.addColorStop(0, 'rgba(92, 245, 255, 0.32)');
            horizonGlow.addColorStop(1, 'rgba(92, 245, 255, 0)');
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(0, 0, width, groundY + 60);

            for (let i = 0; i < 6; i++) {
                const x = (i + 0.5) * width / 6;
                const towerHeight = 50 + (i % 3) * 24 + Math.sin(skylinePulse + i) * 8;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(10, 18, 42, 0.85)' : 'rgba(15, 23, 56, 0.85)';
                ctx.fillRect(x - 24, groundY - towerHeight, 48, towerHeight);
                ctx.fillStyle = 'rgba(92, 245, 255, 0.22)';
                for (let y = 0; y < towerHeight - 10; y += 12) {
                    ctx.fillRect(x - 18, groundY - towerHeight + 8 + y, 10, 4);
                    ctx.fillRect(x + 8, groundY - towerHeight + 8 + y, 10, 4);
                }
            }

            const roadGrad = ctx.createLinearGradient(0, groundY, 0, height);
            roadGrad.addColorStop(0, VISUAL_THEME.roadFar);
            roadGrad.addColorStop(1, VISUAL_THEME.roadNear);
            ctx.fillStyle = roadGrad;
            ctx.fillRect(0, groundY, width, height - groundY);

            ctx.fillStyle = 'rgba(255, 95, 210, 0.1)';
            ctx.beginPath();
            ctx.moveTo(width * 0.18, height);
            ctx.lineTo(width * 0.4, groundY);
            ctx.lineTo(width * 0.6, groundY);
            ctx.lineTo(width * 0.82, height);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = VISUAL_THEME.grid;
            ctx.lineWidth = 2;
            ctx.beginPath();

            for (let x = -2000; x <= 2000; x += 200) {
                const p1 = project(x, 0, 100);
                const p2 = project(x, 0, CONFIG.worldDepth);
                if (p1.y > groundY && p1.x > -100 && p1.x < width + 100) {
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                }
            }

            const timeOffset = (Date.now() / 5) % 200;
            for (let z = 0; z < CONFIG.worldDepth; z += 200) {
                const actualZ = z - timeOffset;
                if (actualZ < 10) continue;

                const p1 = project(-2000, 0, actualZ);
                const p2 = project(2000, 0, actualZ);

                if (p1.y < height && p1.y > groundY) {
                    ctx.moveTo(0, p1.y);
                    ctx.lineTo(width, p2.y);
                }
            }
            ctx.stroke();

            ctx.strokeStyle = VISUAL_THEME.laneGlow;
            ctx.lineWidth = 3;
            for (let lane = -1; lane <= 1; lane++) {
                const near = project(lane * CONFIG.laneWidth * 1.5, 0, 100);
                const far = project(lane * CONFIG.laneWidth * 1.5, 0, CONFIG.worldDepth);
                ctx.beginPath();
                ctx.moveTo(near.x, near.y);
                ctx.lineTo(far.x, far.y);
                ctx.stroke();
            }

            if (canvasFlash > 0) {
                ctx.fillStyle = `rgba(255, 90, 120, ${canvasFlash})`;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function drawParticles() {
            for (const p of particles) {
                const pos = project(p.x, p.y, p.z);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                const s = p.size * pos.scale;
                ctx.fillRect(pos.x - s / 2, pos.y - s / 2, s, s);
                ctx.globalAlpha = 1.0;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            drawEnvironment();

            const renderList = [...entities, player].sort((a, b) => b.z - a.z);
            for (const e of renderList) {
                drawCube(e);
            }

            drawParticles();
        }

        function loop(timestamp) {
            lastTime = timestamp;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.onload = init;
    </script>
</body>
</html>
