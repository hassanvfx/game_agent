<body>

<script>
/**
 * Sky Glow Collector
 * Guide the glowing glider with touch or pointer movement and gather falling sky sparks.
 */

/**
 * §0 System Invariants & Config
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const uiLayer = document.getElementById('ui-layer');
const hud = document.getElementById('hud');
const gameOverScreen = document.getElementById('game-over-screen');
const scoreDisplay = document.getElementById('score-display');
const finalScoreDisplay = document.getElementById('final-score');
const videoOverlay = document.getElementById('video-overlay');
const pickupGif = document.getElementById('pickup-gif');
const failGif = document.getElementById('fail-gif');
let pickupGifTimer = 0;
let failGifTimer = 0;

// Config Parsing
let gameConfig = {};
try {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;
} catch (e) {
    gameConfig = { spawnRate: 45, heroColor: "#ffffff", skyColorTop: "#e0f7fa", skyColorBot: "#f3e5f5" };
}
window.gameConfig = gameConfig;
window.updateGameConfig = (k, v) => { if(gameConfig[k] !== undefined) gameConfig[k] = v; };

// State
let gameState = 'INIT'; // INIT, PLAYING, VIDEO, GAMEOVER
let cw = 0, ch = 0;
let dpr = 1;
let initialized = false;
let score = 0;
let lastTime = 0;
let spawnTimer = 0;
let audioUnlocked = false;

// Entities
const player = { x: 0, y: 0, r: 28 };
let orbs = [];
let particles = [];
let clouds = [];

/**
 * §1 Audio System (Web Audio API + Zero DOM Overhead)
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sfxBuffers = {};

async function loadSfx() {
    const sfxList = document.querySelectorAll('audio[data-editable]');
    for (const el of sfxList) {
        if (el.id === 'bgm_main') continue;
        try {
            const res = await fetch(el.src, { mode: 'cors' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const arrayBuffer = await res.arrayBuffer();
            sfxBuffers[el.id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('SFX Load Fail:', el.id, e?.message || e);
        }
    }
}

function playSfx(id, options = {}) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const buffer = sfxBuffers[id];
    if (buffer) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = buffer;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.value = options.volume ?? 0.32;
        src.start(0);
        return;
    }

    const mediaEl = document.getElementById(id);
    if (mediaEl instanceof HTMLAudioElement && mediaEl.src) {
        const mediaClone = mediaEl.cloneNode();
        mediaClone.volume = Math.min(options.volume ?? 0.32, 1);
        mediaClone.play().catch(() => {});
        mediaClone.addEventListener('ended', () => mediaClone.remove(), { once: true });
        return;
    }

    // Synthesis fallback preserves feedback if catalog audio is unavailable.
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(id.includes('btn') ? 600 : 800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(options.volume ?? 0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function unlockAudio() {
    if (!audioUnlocked) {
        audioUnlocked = true;
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    syncBgmForState();
}

function syncBgmForState() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm || !audioUnlocked) return;
    if (gameState === 'PLAYING') {
        bgm.volume = 0.2;
        bgm.play().catch(() => {});
    } else {
        bgm.pause();
    }
}

function showFeedbackGif(el, duration = 900) {
    if (!el) return;
    el.classList.add('show');
    const timerKey = el.id === 'pickup-gif' ? 'pickupGifTimer' : 'failGifTimer';
    clearTimeout(window[timerKey]);
    window[timerKey] = setTimeout(() => {
        el.classList.remove('show');
    }, duration);
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 40 : 10);
    }
}

/**
 * §2 Lifecycle & Canvas
 */
const ro = new ResizeObserver(entries => {
    const entry = entries[0];
    const rect = entry.contentRect;
    cw = rect.width;
    ch = rect.height;
    dpr = window.devicePixelRatio || 1;

    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!initialized) {
        loadSfx();
        initGame();
        initialized = true;
        requestAnimationFrame(gameLoop);
    } else {
        player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
        player.y = Math.max(player.r, Math.min(ch - player.r, player.y));
    }
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);

    // Input Router
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', handleGlobalInput, { passive: false });
    window.addEventListener('pointerup', handleGlobalInput, { passive: false });
    window.addEventListener('pointercancel', handleGlobalInput, { passive: false });

    // UI Bindings
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('sfx_btn');
        initGame();
    });

    document.getElementById('video-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('sfx_video_open', { volume: 0.28 });
        openVideo();
    });

    document.getElementById('close-video-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        playSfx('sfx_video_close', { volume: 0.26 });
        closeVideo();
    });
});

/**
 * §3 Game Logic
 */
function initGame() {
    score = 0;
    orbs = [];
    particles = [];
    clouds = [];
    // Init clouds
    for (let i = 0; i < 5; i++) {
        clouds.push({
            x: Math.random() * cw,
            y: Math.random() * ch,
            r: 60 + Math.random() * 80,
            speed: 5 + Math.random() * 10
        });
    }

    player.x = cw / 2;
    player.y = ch * 0.8;
    scoreDisplay.innerText = '0';
    setState('PLAYING');
}

function setState(state) {
    gameState = state;
    if (state === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
        videoOverlay.classList.add('hidden');
        failGif?.classList.remove('show');
    } else if (state === 'GAMEOVER') {
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalScoreDisplay.innerText = score;
        vibrate('heavy');
        playSfx('sfx_game_over', { volume: 0.34 });
        showFeedbackGif(failGif, 2200);
    } else if (state === 'VIDEO') {
        // Handled in openVideo
    }
    syncBgmForState();
}

function openVideo() {
    setState('VIDEO');
    videoOverlay.classList.remove('hidden');
}

function closeVideo() {
    videoOverlay.classList.add('hidden');
    setState('PLAYING');
}

function handleGlobalInput(e) {
    if (e.type === 'pointerdown') unlockAudio();
    if (gameState === 'PLAYING') {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left;
        const ty = e.clientY - rect.top;

        // Direct absolute positioning for instant responsiveness
        if (e.type === 'pointerdown' || e.type === 'pointermove') {
            player.x = Math.max(player.r, Math.min(cw - player.r, tx));
            player.y = Math.max(player.r, Math.min(ch - player.r, ty));
        }
    }
}

function spawnOrb() {
    const r = 18 + Math.random() * 12;
    orbs.push({
        x: Math.random() * (cw - 2 * r) + r,
        y: -r,
        r: r,
        speed: (100 + Math.random() * 100) * (ch / 1000),
        hue: Math.random() * 60 + 180
    });
}

function createParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 150,
            vy: (Math.random() - 0.5) * 150,
            life: 1.0,
            color: color
        });
    }
}

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    if (gameState === 'PLAYING') {
        update(dt);
    }

    draw();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    spawnTimer += dt;
    if (spawnTimer > (1 / (gameConfig.spawnRate / 60))) {
        spawnOrb();
        spawnTimer = 0;
    }

    // Clouds
    for (let c of clouds) {
        c.x += c.speed * dt;
        if (c.x > cw + c.r) c.x = -c.r;
    }

    // Orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
        let o = orbs[i];
        o.y += o.speed * dt;

        // Collision
        const dx = player.x - o.x;
        const dy = player.y - o.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < player.r + o.r) {
            score += 10;
            scoreDisplay.innerText = score;
            createParticles(o.x, o.y, `hsl(${o.hue}, 100%, 70%)`);
            vibrate('light');
            playSfx('sfx_collect', { volume: 0.22 });
            if (score % 30 === 0) {
                showFeedbackGif(pickupGif, 900);
            }
            orbs.splice(i, 1);
            continue;
        }

        if (o.y > ch + o.r) {
            orbs.splice(i, 1);
            // Endless collection loop: missing a spark does not end the run.
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= 2.5 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawStar(x, y, rOuter, rInner, color, rotation = -Math.PI / 2) {
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const angle = rotation + (Math.PI / 5) * i;
        const radius = i % 2 === 0 ? rOuter : rInner;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
}

function drawPlayerFace(x, y, drift) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = 'rgba(8, 15, 32, 0.62)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.arc(-8, -3, 2.4, 0, Math.PI * 2);
    ctx.arc(8, -3, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(8, 15, 32, 0.78)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 6 + drift * 1.4, 8, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.stroke();
    ctx.restore();
}

function draw() {
    const grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, '#07111f');
    grad.addColorStop(0.45, '#1a2d60');
    grad.addColorStop(1, '#3d1f63');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    const time = Date.now() * 0.00022;
    for (let i = 0; i < 7; i++) {
        const arcGrad = ctx.createRadialGradient(
            cw * (0.18 + i * 0.12),
            ch * (0.2 + Math.sin(time * 6 + i) * 0.05),
            10,
            cw * (0.18 + i * 0.12),
            ch * 0.28,
            cw * 0.35
        );
        arcGrad.addColorStop(0, i % 2 === 0 ? 'rgba(116, 247, 255, 0.09)' : 'rgba(255, 127, 216, 0.07)');
        arcGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = arcGrad;
        ctx.fillRect(0, 0, cw, ch);
    }

    ctx.save();
    for (let i = 0; i < 24; i++) {
        const sx = (i * 137.7) % Math.max(cw, 1);
        const sy = ((i * 73.3) + (Date.now() * 0.01)) % Math.max(ch, 1);
        ctx.globalAlpha = 0.35 + (i % 4) * 0.1;
        ctx.fillStyle = i % 3 === 0 ? 'rgba(255,229,122,0.95)' : 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(sx, sy, i % 5 === 0 ? 1.8 : 1.15, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    for (let c of clouds) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(c.x + c.r * 0.35, c.y - c.r * 0.15, c.r * 0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(c.x - c.r * 0.38, c.y - c.r * 0.1, c.r * 0.58, 0, Math.PI * 2);
        ctx.fill();
    }

    if (gameState === 'INIT') return;

    const drift = Math.sin(Date.now() * 0.006);

    // Character-first glider: star buddy with expressive face.
    ctx.save();
    ctx.translate(player.x, player.y + drift * 1.5);

    const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, player.r * 1.8);
    glow.addColorStop(0, 'rgba(255, 245, 177, 0.95)');
    glow.addColorStop(0.45, 'rgba(255, 197, 114, 0.52)');
    glow.addColorStop(1, 'rgba(255, 127, 216, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, player.r * 1.85, 0, Math.PI * 2);
    ctx.fill();

    drawStar(0, 0, player.r, player.r * 0.52, '#ffe57a');
    drawStar(0, 0, player.r * 0.78, player.r * 0.34, '#fff8dd', Math.PI / 10);
    drawPlayerFace(0, 0, drift);

    ctx.strokeStyle = 'rgba(255,255,255,0.82)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, player.r + 5 + Math.sin(Date.now() * 0.003) * 2.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    for (let o of orbs) {
        ctx.save();
        const orbGradient = ctx.createRadialGradient(o.x - o.r * 0.25, o.y - o.r * 0.3, 2, o.x, o.y, o.r * 1.15);
        orbGradient.addColorStop(0, 'rgba(255,255,255,0.98)');
        orbGradient.addColorStop(0.25, `hsla(${o.hue}, 100%, 80%, 0.98)`);
        orbGradient.addColorStop(1, `hsla(${o.hue}, 88%, 52%, 0.88)`);
        ctx.fillStyle = orbGradient;
        ctx.shadowBlur = 18;
        ctx.shadowColor = `hsla(${o.hue}, 100%, 70%, 0.85)`;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r * 0.72, 0, Math.PI * 2);
        ctx.stroke();

        drawStar(o.x, o.y, o.r * 0.45, o.r * 0.2, 'rgba(255,255,255,0.75)');
        ctx.restore();
    }

    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        drawStar(p.x, p.y, 5 * p.life, 2.2 * p.life, p.color, Date.now() * 0.01);
        ctx.restore();
    }
}
</script>
