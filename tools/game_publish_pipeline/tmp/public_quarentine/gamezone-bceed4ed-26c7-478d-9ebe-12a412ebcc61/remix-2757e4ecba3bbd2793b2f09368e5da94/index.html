<script>
/**
 * SIGNAL SALVAGER: DRIFT SECTOR
 * Reframes the arena sweep as a drone recovering unstable signal clusters.
 */

// --- Configuration System ---
window.gameConfigDefs = {
    heroSpeed: { type: "number", label: "Hero Speed", value: 8, min: 4, max: 15 },
    spawnRate: { type: "number", label: "Spawn Rate", value: 100, min: 30, "max": 200 },
    difficulty: { type: "number", label: "Difficulty", value: 1.0, min: 0.5, "max": 3.0 },
    themeColor: { type: "color", label: "Theme", value: "#FF4500" }
};
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if(key === 'themeColor') {
            document.documentElement.style.setProperty('--accent', val);
            document.getElementById('score').style.color = val;
            document.querySelector('.stick-knob').style.boxShadow = `0 0 18px ${val}`;
        }
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.buffers = {};
        this.isMuted = false;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            ['sfx_fire', 'sfx_hit', 'sfx_defeat', 'sfx_warning', 'sfx_start', 'sfx_gameover'].forEach(id => this.loadSound(id));
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }

    loadSound(id) {
        const el = document.getElementById(id);
        if (el && el.src) {
            fetch(el.src)
                .then(r => r.arrayBuffer())
                .then(b => this.ctx.decodeAudioData(b))
                .then(data => this.buffers[id] = data)
                .catch(() => this.buffers[id] = null);
        } else {
            this.buffers[id] = null;
        }
    }

    playBgm() {
        const bgm = document.getElementById('bgm_battle');
        if (bgm) {
            bgm.volume = 0.2;
            bgm.currentTime = bgm.currentTime || 0;
            bgm.play().catch(() => {});
        }
    }

    stopBgm() {
        const bgm = document.getElementById('bgm_battle');
        if (bgm) bgm.pause();
    }

    playSfx(id, volume = 0.45) {
        const el = document.getElementById(id);
        if (!this.ctx) {
            if (el && el.src) {
                const fallback = el.cloneNode();
                fallback.volume = Math.min(volume, 1);
                fallback.play().catch(() => {});
            }
            return;
        }
        const buf = this.buffers[id];
        if (!buf) {
            if (el && el.src) {
                const fallback = el.cloneNode();
                fallback.volume = Math.min(volume, 1);
                fallback.play().catch(() => {});
            }
            return;
        }
        const src = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        gain.gain.value = volume;
        src.buffer = buf;
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(0);
    }
}
const audio = new AudioManager();

// --- 3D Engine Core ---
const CAMERA = { x: 0, y: -500, z: -600, focal: 400 }; // Isometric-ish view
const ARENA_SIZE = 1200;

function project(x, y, z) {
    // Simple perspective projection
    // World coordinates: X (left/right), Y (up/down - height), Z (depth)
    // Camera looks towards positive Z
    
    // Relative to camera
    const rx = x - CAMERA.x;
    const ry = y - CAMERA.y; // Y is height (up is negative in 2D canvas usually, but here let's say Y is vertical world axis)
    const rz = z - CAMERA.z;

    if (rz <= 0) return null; // Behind camera

    const scale = CAMERA.focal / rz;
    const sx = window.innerWidth/2 + rx * scale;
    const sy = window.innerHeight/2 + ry * scale; // Invert Y for screen? No, let's keep standard 2D logic: -Y is up.
    
    return { x: sx, y: sy, scale: scale, zIndex: rz };
}

// --- Game Logic ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
let width, height;
let lastTime = 0;
let gameState = 'START'; // START, PLAY, GAMEOVER
let frames = 0;
let score = 0;
let shake = 0;
let timeScale = 1.0;
let lastDamageSfxAt = 0;
let warningCooldownUntil = 0;
let gifTimer = 0;

// Entities
let player = { x: 0, y: 0, z: 0, vx: 0, vz: 0, hp: 100, maxHp: 100, cd: 0, state: 'idle' };
let enemies = [];
let particles = [];
let projectiles = [];
let damageNumbers = [];

// Input
const input = { x: 0, y: 0, active: false };
const feedbackGif = document.getElementById('feedback-gif');
const feedbackGifImage = document.getElementById('feedback-gif-image');
const feedbackGifCaption = document.getElementById('feedback-gif-caption');
const GIFS = {
    hit: { src: 'https://i.giphy.com/1AjEBGWggGXh9onllB.webp', caption: 'impact spike', className: 'visible' },
    fail: { src: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', caption: 'link critical', className: 'visible fail' }
};

function showFeedbackGif(type) {
    const choice = GIFS[type];
    if (!choice) return;
    feedbackGifImage.src = choice.src;
    feedbackGifCaption.textContent = choice.caption;
    feedbackGif.className = `feedback-gif ${choice.className}`;
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => {
        feedbackGif.className = 'feedback-gif';
    }, type === 'fail' ? 1600 : 700);
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Input Handling
const stickZone = document.getElementById('stick-zone');
const stickKnob = document.getElementById('stick-knob');
const gameSurface = document.getElementById('game-container');
let touchStartPos = { x: 0, y: 0 };

function handleInputStart(x, y) {
    if (gameState !== 'PLAY') return;
    input.active = true;
    touchStartPos = { x, y };
    stickZone.style.display = 'block';
    stickZone.style.left = (x - 60) + 'px';
    stickZone.style.top = (y - 60) + 'px';
    stickKnob.style.transform = `translate(-50%, -50%)`;
    
    // Unlock Audio
    audio.playBgm();
}

function handleInputMove(x, y) {
    if (!input.active) return;
    const dx = x - touchStartPos.x;
    const dy = y - touchStartPos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 60;
    
    const clampDist = Math.min(dist, maxDist);
    const angle = Math.atan2(dy, dx);
    
    const kx = Math.cos(angle) * clampDist;
    const ky = Math.sin(angle) * clampDist;
    
    stickKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    
    // Map screen 2D to World 3D (X and Z)
    // Screen X -> World X, Screen Y -> World Z
    input.x = dx / maxDist;
    input.y = dy / maxDist;
}

function handleInputEnd() {
    input.active = false;
    input.x = 0;
    input.y = 0;
    stickZone.style.display = 'none';
}

gameSurface.addEventListener('pointerdown', e => {
    if (gameState !== 'PLAY' || e.target.closest('button')) return;
    e.preventDefault();
    handleInputStart(e.clientX, e.clientY);
}, { passive: false });

gameSurface.addEventListener('pointermove', e => {
    if (gameState !== 'PLAY' || !input.active) return;
    e.preventDefault();
    handleInputMove(e.clientX, e.clientY);
}, { passive: false });

window.addEventListener('pointerup', handleInputEnd);
window.addEventListener('pointercancel', handleInputEnd);

// --- Game Loop ---
function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const dist = ARENA_SIZE/2 + 200; // Spawn outside
    const type = Math.random() > 0.7 ? 'VOID' : (Math.random() > 0.5 ? 'BLOOD' : 'BASIC');
    
    let stats = { hp: 30, speed: 3, color: '#999', radius: 20 };
    if (type === 'VOID') stats = { hp: 80, speed: 2, color: '#9400D3', radius: 30 };
    if (type === 'BLOOD') stats = { hp: 50, speed: 5, color: '#DC143C', radius: 25 };
    
    enemies.push({
        x: Math.cos(angle) * dist,
        y: 0,
        z: Math.sin(angle) * dist,
        type: type,
        hp: stats.hp,
        maxHp: stats.hp,
        speed: stats.speed * window.gameConfig.difficulty,
        color: stats.color,
        radius: stats.radius,
        hitFlash: 0
    });
}

function createParticle(x, y, z, color, count = 5, speed = 5) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y, z,
            vx: (Math.random() - 0.5) * speed,
            vy: (Math.random() - 1) * speed, // Upwards
            vz: (Math.random() - 0.5) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 5 + 2
        });
    }
}

function update(dt) {
    if (gameState !== 'PLAY') return;
    
    // Time scaling (Hit stop)
    if (timeScale < 1.0) timeScale += dt * 5;
    if (timeScale > 1.0) timeScale = 1.0;
    const tDt = dt * timeScale;
    
    // Shake decay
    shake *= 0.9;
    if (shake < 0.5) shake = 0;

    // Player Move
    const speed = window.gameConfig.heroSpeed;
    player.vx = input.x * speed;
    player.vz = input.y * speed;
    
    player.x += player.vx * 60 * tDt;
    player.z += player.vz * 60 * tDt;
    
    // Bounds
    const limit = ARENA_SIZE/2;
    player.x = Math.max(-limit, Math.min(limit, player.x));
    player.z = Math.max(-limit, Math.min(limit, player.z));

    // Player Attack (Auto Fire)
    player.cd -= tDt;
    if (player.cd <= 0) {
        // Find nearest enemy
        let nearest = null;
        let minDist = 600;
        enemies.forEach(e => {
            const d = Math.sqrt((e.x-player.x)**2 + (e.z-player.z)**2);
            if (d < minDist) {
                minDist = d;
                nearest = e;
            }
        });

        if (nearest) {
            player.cd = 0.25; // Fire rate
            const dx = nearest.x - player.x;
            const dz = nearest.z - player.z;
            const ang = Math.atan2(dz, dx);
            projectiles.push({
                x: player.x, y: player.y - 20, z: player.z,
                vx: Math.cos(ang) * 20, vz: Math.sin(ang) * 20,
                life: 2,
                color: '#FF4500' // Fire color
            });
            audio.playSfx('sfx_fire', 0.22);
        }
    }

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx * 60 * tDt;
        p.z += p.vz * 60 * tDt;
        p.life -= tDt;
        
        let hit = false;
        for (let e of enemies) {
            const dist = Math.sqrt((p.x-e.x)**2 + (p.z-e.z)**2);
            if (dist < e.radius + 10) {
                e.hp -= 15;
                e.hitFlash = 5;
                hit = true;
                const now = performance.now();
                if (now - lastDamageSfxAt > 70) {
                    audio.playSfx('sfx_hit', 0.35);
                    lastDamageSfxAt = now;
                }
                createParticle(e.x, e.y - 20, e.z, e.color, 3, 10);
                damageNumbers.push({x: e.x, y: e.y - 50, z: e.z, val: 15, life: 1.0});
                showFeedbackGif('hit');
                if (e.hp <= 0) {
                    score += 100;
                    shake = 10;
                    timeScale = 0.1; // Hit stop
                    audio.playSfx('sfx_defeat', 0.42);
                    createParticle(e.x, e.y - 30, e.z, '#FFF', 10, 15);
                }
                break;
            }
        }
        
        if (hit || p.life <= 0) projectiles.splice(i, 1);
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        if (e.hp <= 0) {
            enemies.splice(i, 1);
            continue;
        }
        
        // Move towards player
        const dx = player.x - e.x;
        const dz = player.z - e.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        
        if (dist > 30) {
            e.x += (dx/dist) * e.speed * 60 * tDt;
            e.z += (dz/dist) * e.speed * 60 * tDt;
        } else {
            // Attack player
            player.hp -= 0.5;
            shake = 2;
            const hpPct = player.hp / player.maxHp;
            document.getElementById('hp-bar').style.width = (hpPct * 100) + '%';
            const now = performance.now();
            if (hpPct < 0.35 && now > warningCooldownUntil) {
                audio.playSfx('sfx_warning', 0.26);
                warningCooldownUntil = now + 1200;
                showFeedbackGif('fail');
            }
            if (player.hp <= 0) endGame();
        }
        
        if (e.hitFlash > 0) e.hitFlash--;
    }

    // Spawner
    frames++;
    if (frames % window.gameConfig.spawnRate === 0) spawnEnemy();

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;
        p.life -= tDt;
        p.vy += 0.5; // Gravity
        if (p.life <= 0 || p.y > 0) particles.splice(i, 1);
    }

    // Damage Numbers
    for (let i = damageNumbers.length - 1; i >= 0; i--) {
        damageNumbers[i].y -= 1;
        damageNumbers[i].life -= tDt;
        if (damageNumbers[i].life <= 0) damageNumbers.splice(i, 1);
    }

    document.getElementById('score').innerText = score;
}

function draw() {
    // Clear
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, width, height);

    // Camera Shake
    const shakeX = (Math.random() - 0.5) * shake;
    const shakeY = (Math.random() - 0.5) * shake;
    
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Draw Grid (Floor)
    const floorGradient = ctx.createLinearGradient(0, height * 0.28, 0, height);
    floorGradient.addColorStop(0, '#0a1630');
    floorGradient.addColorStop(1, '#02050b');
    ctx.fillStyle = floorGradient;
    ctx.fillRect(0, height * 0.28, width, height * 0.72);

    ctx.strokeStyle = 'rgba(88, 196, 255, 0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const gridSize = 200;
    for (let x = -ARENA_SIZE/2; x <= ARENA_SIZE/2; x += gridSize) {
        const p1 = project(x, 0, -ARENA_SIZE/2);
        const p2 = project(x, 0, ARENA_SIZE/2);
        if (p1 && p2) { ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); }
    }
    for (let z = -ARENA_SIZE/2; z <= ARENA_SIZE/2; z += gridSize) {
        const p1 = project(-ARENA_SIZE/2, 0, z);
        const p2 = project(ARENA_SIZE/2, 0, z);
        if (p1 && p2) { ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); }
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(98, 247, 255, 0.42)';
    ctx.lineWidth = 2;
    const edgeA = project(-ARENA_SIZE/2, 0, -ARENA_SIZE/2);
    const edgeB = project(ARENA_SIZE/2, 0, -ARENA_SIZE/2);
    const edgeC = project(ARENA_SIZE/2, 0, ARENA_SIZE/2);
    const edgeD = project(-ARENA_SIZE/2, 0, ARENA_SIZE/2);
    if (edgeA && edgeB && edgeC && edgeD) {
        ctx.beginPath();
        ctx.moveTo(edgeA.x, edgeA.y);
        ctx.lineTo(edgeB.x, edgeB.y);
        ctx.lineTo(edgeC.x, edgeC.y);
        ctx.lineTo(edgeD.x, edgeD.y);
        ctx.closePath();
        ctx.stroke();
    }

    // Render List
    const renderList = [];

    // Player
    renderList.push({ type: 'player', ...player });

    // Enemies
    enemies.forEach(e => renderList.push({ type: 'enemy', ...e }));

    // Projectiles
    projectiles.forEach(p => renderList.push({ type: 'proj', ...p }));

    // Particles
    particles.forEach(p => renderList.push({ type: 'part', ...p }));

    // Sort by Z (Painter's Algo)
    renderList.sort((a, b) => b.z - a.z);

    // Draw Loop
    renderList.forEach(obj => {
        const p = project(obj.x, obj.y, obj.z);
        if (!p) return;

        if (obj.type === 'player') {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.42)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, 22 * p.scale, 11 * p.scale, 0, 0, Math.PI*2);
            ctx.fill();

            const cx = p.x;
            const cy = p.y - 34 * p.scale;
            const pulse = 1 + Math.sin(Date.now() / 120) * 0.08;

            // Outer shield halo
            ctx.strokeStyle = 'rgba(98,247,255,0.72)';
            ctx.lineWidth = 3 * p.scale;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#62f7ff';
            ctx.beginPath();
            ctx.arc(cx, cy, 20 * p.scale * pulse, 0, Math.PI * 2);
            ctx.stroke();

            // Drone body
            ctx.shadowBlur = 26;
            ctx.fillStyle = '#0d2445';
            ctx.beginPath();
            ctx.moveTo(cx, cy - 18 * p.scale);
            ctx.lineTo(cx + 18 * p.scale, cy + 6 * p.scale);
            ctx.lineTo(cx, cy + 16 * p.scale);
            ctx.lineTo(cx - 18 * p.scale, cy + 6 * p.scale);
            ctx.closePath();
            ctx.fill();

            // Wings
            ctx.fillStyle = '#15b7ff';
            ctx.beginPath();
            ctx.moveTo(cx - 9 * p.scale, cy + 4 * p.scale);
            ctx.lineTo(cx - 25 * p.scale, cy + 16 * p.scale);
            ctx.lineTo(cx - 8 * p.scale, cy + 10 * p.scale);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(cx + 9 * p.scale, cy + 4 * p.scale);
            ctx.lineTo(cx + 25 * p.scale, cy + 16 * p.scale);
            ctx.lineTo(cx + 8 * p.scale, cy + 10 * p.scale);
            ctx.closePath();
            ctx.fill();

            // Core eye
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#f7feff';
            ctx.beginPath();
            ctx.arc(cx, cy - 1 * p.scale, 8 * p.scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#62f7ff';
            ctx.beginPath();
            ctx.arc(cx, cy - 1 * p.scale, 4 * p.scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } 
        else if (obj.type === 'enemy') {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, obj.radius * p.scale, (obj.radius/2) * p.scale, 0, 0, Math.PI*2);
            ctx.fill();

            const ex = p.x;
            const ey = p.y - 32 * p.scale;
            ctx.fillStyle = obj.hitFlash > 0 ? '#FFF' : obj.color;
            ctx.shadowBlur = obj.type === 'VOID' ? 20 : 8;
            ctx.shadowColor = obj.color;
            
            if (obj.type === 'VOID') {
                ctx.beginPath();
                ctx.arc(ex, ey - 8 * p.scale, 21 * p.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#050b18';
                ctx.beginPath();
                ctx.arc(ex, ey - 8 * p.scale, 9 * p.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.82)';
                ctx.lineWidth = 2 * p.scale;
                ctx.beginPath();
                ctx.arc(ex, ey - 8 * p.scale, 27 * p.scale, 0, Math.PI * 2);
                ctx.stroke();
            } else if (obj.type === 'BLOOD') {
                ctx.beginPath();
                const rad = 22 * p.scale;
                for(let i=0; i<6; i++) {
                    const ang = (i / 6) * Math.PI * 2 - Math.PI/2;
                    const outer = i % 2 === 0 ? 1.05 : 0.48;
                    const px = ex + Math.cos(ang) * rad * outer;
                    const py = ey + Math.sin(ang) * rad * outer;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.roundRect(ex - 17 * p.scale, ey - 15 * p.scale, 34 * p.scale, 28 * p.scale, 8 * p.scale);
                ctx.fill();
                ctx.fillStyle = '#f7feff';
                ctx.fillRect(ex - 6 * p.scale, ey - 2 * p.scale, 12 * p.scale, 4 * p.scale);
            }
            ctx.shadowBlur = 0;
        }
        else if (obj.type === 'proj') {
            ctx.strokeStyle = 'rgba(98,247,255,0.42)';
            ctx.lineWidth = 2 * p.scale;
            ctx.beginPath();
            ctx.moveTo(p.x - 14 * p.scale, p.y);
            ctx.lineTo(p.x + 14 * p.scale, p.y);
            ctx.stroke();

            ctx.fillStyle = '#f7feff';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#62f7ff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 7 * p.scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (obj.type === 'part') {
            ctx.fillStyle = obj.color;
            ctx.globalAlpha = obj.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, obj.size * p.scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    });

    // Damage Numbers (Overlay)
    ctx.font = '700 24px Orbitron';
    ctx.textAlign = 'center';
    damageNumbers.forEach(d => {
        const p = project(d.x, d.y, d.z);
        if (p) {
            ctx.fillStyle = `rgba(255, 255, 255, ${d.life})`;
            ctx.fillText(d.val, p.x, p.y);
        }
    });
    
    ctx.restore();
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    
    requestAnimationFrame(loop);
}

// --- State Management ---
function startGame() {
    audio.init();
    audio.playSfx('sfx_start', 0.4);
    gameState = 'PLAY';
    score = 0;
    player.hp = 100;
    player.x = 0;
    player.z = 0;
    enemies = [];
    projectiles = [];
    particles = [];
    damageNumbers = [];
    warningCooldownUntil = 0;
    document.getElementById('hp-bar').style.width = '100%';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    audio.playBgm();
}

function endGame() {
    gameState = 'GAMEOVER';
    audio.playSfx('sfx_gameover', 0.45);
    audio.stopBgm();
    showFeedbackGif('fail');
    document.getElementById('finalScore').innerText = score;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    input.active = false;
    stickZone.style.display = 'none';
}

function primeAudioAndStart(event) {
    event.preventDefault();
    startGame();
}

document.getElementById('start-btn').addEventListener('click', primeAudioAndStart);
document.getElementById('start-btn').addEventListener('pointerup', primeAudioAndStart);
document.getElementById('restart-btn').addEventListener('click', primeAudioAndStart);
document.getElementById('restart-btn').addEventListener('pointerup', primeAudioAndStart);

requestAnimationFrame(loop);

</script>
