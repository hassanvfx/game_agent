    <style>
        :root {
            --bg: #040714;
            --bg-top: #0d1430;
            --bg-bottom: #02040d;
            --panel: rgba(12, 18, 37, 0.78);
            --panel-strong: rgba(16, 24, 50, 0.92);
            --panel-border: rgba(129, 222, 255, 0.22);
            --cyan: #7be7ff;
            --cyan-strong: #48cfff;
            --pink: #ff4fa3;
            --pink-strong: #ff2a87;
            --gold: #ffe073;
            --danger: #ff4d6d;
            --text: #f4fbff;
            --muted: #8fa6c4;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(72, 207, 255, 0.14), transparent 28%),
                radial-gradient(circle at 80% 20%, rgba(255, 79, 163, 0.14), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            touch-action: none;
            outline: none;
        }

        *, *::before, *::after { box-sizing: border-box; }
        button { font: inherit; border: 0; cursor: pointer; }

        .font-teko { font-family: 'Audiowide', system-ui, sans-serif; }
        .font-fredoka { font-family: 'Orbitron', system-ui, sans-serif; }

        .glass {
            background:
                linear-gradient(180deg, rgba(24, 35, 67, 0.82), rgba(8, 12, 27, 0.78));
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
        }

        .neon-text { text-shadow: 0 0 12px rgba(123, 231, 255, 0.72); }
        .neon-pink { text-shadow: 0 0 12px rgba(255, 79, 163, 0.72); }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .bottom-2 { bottom: 0.5rem; }
        .left-1\/2 { left: 50%; }
        .transform { transform: translateZ(0); }
        .-translate-x-1\/2 { transform: translateX(-50%); }
        .-skew-x-6 { transform: skewX(-6deg); }
        .-top-4 { top: -1rem; }
        .flex { display: flex; }
        .hidden.flex { display: none !important; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1 1 0%; }

        .h-full { height: 100%; }
        .w-fit { width: fit-content; }

        .h-8 { height: 2rem; }
        .w-6 { width: 1.5rem; }
        .h-6 { height: 1.5rem; }
        .w-3 { width: 0.75rem; }
        .h-3 { height: 0.75rem; }
        .w-2 { width: 0.5rem; }
        .h-2 { height: 0.5rem; }
        .max-w-md { max-width: 28rem; }
        .max-w-sm { max-width: 24rem; }
        .max-w-xs { max-width: 20rem; }
        .h-48 { height: 12rem; }
        .overflow-hidden { overflow: hidden; }
        .overflow-hidden.flex { display: flex; }
        .overflow-hidden.flex-col { flex-direction: column; }
        .rounded-full { border-radius: 9999px; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded { border-radius: 0.25rem; }
        .bg-black { background: #000; }
        .bg-black\/95 { background: rgba(0, 0, 0, 0.95); }
        .bg-black\/90 { background: rgba(0, 0, 0, 0.9); }
        .bg-black\/40 { background: rgba(3, 7, 18, 0.48); }
        .bg-gray-800 { background: #162033; }
        .bg-gray-700 { background: #202d47; }
        .bg-red-600 { background: #e63768; }
        .bg-green-500 { background: #36e88b; }
        .bg-white { background: #fff; }
        .bg-pink-600 { background: linear-gradient(180deg, #ff4fa3, #d61d74); }
        .bg-pink-500\/10 { background: rgba(255, 79, 163, 0.12); }
        .bg-gradient-to-r { background-image: linear-gradient(to right, var(--tw-gradient-stops)); }
        .from-cyan-400 { --tw-gradient-from: #7be7ff; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(123,231,255,0)); }
        .via-white { --tw-gradient-stops: var(--tw-gradient-from), #ffffff, var(--tw-gradient-to, rgba(255,255,255,0)); }
        .to-pink-500 { --tw-gradient-to: #ff4fa3; }
        .text-black { color: #08101f; }
        .text-white { color: #fff; }
        .text-white\/90 { color: rgba(255,255,255,0.9); }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-gray-300 { color: #d1e3ff; }
        .text-gray-400 { color: #8fa6c4; }
        .text-gray-500 { color: #61708e; }
        .text-gray-600 { color: #53627f; }
        .text-gray-800 { color: #203456; }
        .text-cyan-400 { color: var(--cyan); }
        .text-pink-400 { color: #ff94cb; }
        .text-transparent { color: transparent; }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-\[10px\] { font-size: 10px; }
        .text-\[8px\] { font-size: 8px; }
        .text-lg { font-size: 1.125rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-6xl { font-size: 3.75rem; }
        .text-7xl { font-size: 4.5rem; }
        .text-8xl { font-size: 6rem; }
        .leading-none { line-height: 1; }
        .tracking-wide { letter-spacing: 0.025em; }
        .tracking-widest { letter-spacing: 0.15em; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }
        .select-none { user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-none.hidden { display: none !important; }
        .z-50 { z-index: 50; }
        .p-4 { padding: 1rem; }
        .p-3 { padding: 0.75rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-8 { padding-bottom: 2rem; }
        .mb-0 { margin-bottom: 0; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .my-2 { margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-8 { gap: 2rem; }
        .border { border-width: 1px; border-style: solid; border-color: rgba(255,255,255,0.1); }
        .border-l-2 { border-left-width: 2px; border-left-style: solid; }
        .border-white\/5 { border-color: rgba(255,255,255,0.05); }
        .border-white\/20 { border-color: rgba(255,255,255,0.2); }
        .border-red-500\/30 { border-color: rgba(255, 77, 109, 0.35); }
        .border-pink-500 { border-color: var(--pink); }
        .border-cyan-500 { border-color: var(--cyan-strong); }
        .border-t { border-top-width: 1px; border-top-style: solid; }
        .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.55); }
        .drop-shadow-md { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
        .backdrop-blur-md { backdrop-filter: blur(12px); }
        .transition-all, .transition-opacity { transition: all 150ms ease; }
        .opacity-0 { opacity: 0; }
        .opacity-50 { opacity: 0.5; }
        .group:hover .group-hover\:opacity-20 { opacity: 0.2; }
        .hover\:bg-pink-500:hover { background: linear-gradient(180deg, #ff6cb4, #e52b84); }
        .hover\:scale-\[1\.02\]:hover { transform: scale(1.02); }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .active\:scale-95:active { transform: scale(0.95); }
        .animate-pulse { animation: pulse-red 1.5s infinite; }
        .safe-area-inset-bottom { padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px)); }
        .mask-image-linear-gradient { -webkit-mask-image: linear-gradient(to top, black 75%, transparent 100%); mask-image: linear-gradient(to top, black 75%, transparent 100%); }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 15%, rgba(123, 231, 255, 0.12), transparent 22%),
                radial-gradient(circle at 85% 12%, rgba(255, 79, 163, 0.12), transparent 20%),
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 20%, transparent 80%, rgba(0,0,0,0.24));
            z-index: 0;
        }

        #gameCanvas,
        #hud,
        #start-screen,
        #game-over-screen {
            position: relative;
            z-index: 1;
        }

        .hud-card {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }

        .hud-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 40%, transparent 65%, rgba(123, 231, 255, 0.12));
        }

        /* Camera Frame Styles */
        .cam-frame {
            box-shadow:
                0 14px 32px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.08),
                0 0 24px rgba(123, 231, 255, 0.18);
            border: 1px solid rgba(123, 231, 255, 0.28);
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(20, 29, 58, 0.98), rgba(5, 7, 17, 0.98));
        }

        .cam-feed {
            object-fit: cover;
            transform: scaleX(-1);
        }

        .stream-stars,
        .start-sparks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .stream-stars span,
        .start-sparks span {
            position: absolute;
            display: block;
            border-radius: 999px;
            opacity: 0.8;
        }

        .stream-stars span {
            width: 4px;
            height: 4px;
            background: rgba(123, 231, 255, 0.7);
            box-shadow: 0 0 12px rgba(123, 231, 255, 0.8);
            animation: driftSpark 5s linear infinite;
        }

        .stream-stars span:nth-child(1) { left: 12%; top: 18%; animation-delay: 0s; }
        .stream-stars span:nth-child(2) { left: 32%; top: 10%; animation-delay: 1s; }
        .stream-stars span:nth-child(3) { left: 74%; top: 22%; animation-delay: 2.2s; }
        .stream-stars span:nth-child(4) { left: 86%; top: 12%; animation-delay: 3.3s; }
        .stream-stars span:nth-child(5) { left: 58%; top: 30%; animation-delay: 4.1s; }

        .start-sparks span {
            width: 7px;
            height: 7px;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
            animation: pulseSpark 2.4s ease-in-out infinite;
        }

        .start-sparks span:nth-child(1) { left: 12%; top: 24%; animation-delay: 0s; }
        .start-sparks span:nth-child(2) { left: 88%; top: 18%; animation-delay: 0.6s; }
        .start-sparks span:nth-child(3) { left: 20%; top: 76%; animation-delay: 1.1s; }
        .start-sparks span:nth-child(4) { left: 78%; top: 70%; animation-delay: 1.7s; }

        .signal-chip {
            border: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .status-orb {
            box-shadow: 0 0 18px rgba(54, 232, 139, 0.65);
        }

        .chat-msg {
            animation: slideIn 0.3s ease-out forwards;
            border-radius: 14px;
            backdrop-filter: blur(10px);
        }

        .chat-msg span:first-child {
            letter-spacing: 0.03em;
        }

        .live-dot { animation: pulse-red 1.5s infinite; }

        .stream-btn {
            background: linear-gradient(180deg, #fefefe, #d8f6ff);
            box-shadow:
                0 14px 30px rgba(72, 207, 255, 0.16),
                inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }

        .stream-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255,255,255,0.5);
            pointer-events: none;
        }

        .modal-panel {
            max-height: min(86vh, 42rem);
        }

        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            width: min(28vw, 6.5rem);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 16px 32px rgba(0,0,0,0.32);
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            object-fit: cover;
            background: rgba(8, 12, 27, 0.72);
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #gift-gif {
            bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px));
            height: min(20vw, 4.75rem);
        }

        #fail-gif {
            top: 5.75rem;
            height: min(24vw, 5.5rem);
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes pulse-red {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes driftSpark {
            0% { transform: translateY(0) scale(0.8); opacity: 0.2; }
            50% { transform: translateY(8px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0) scale(0.8); opacity: 0.2; }
        }

        @keyframes pulseSpark {
            0%, 100% { transform: scale(0.7); opacity: 0.25; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        @media (max-width: 640px) {
            .text-7xl { font-size: 3.4rem; }
            .text-8xl { font-size: 4.4rem; }
            .text-6xl { font-size: 3rem; }
            .w-24 { width: 5.3rem; }
            .h-32 { height: 7rem; }
            .p-8 { padding: 1.5rem; }
            .gap-8 { gap: 1.25rem; }
            .modal-panel { max-height: 88vh; }
            .feedback-gif {
                right: 0.5rem;
                width: min(32vw, 5.25rem);
            }
            #fail-gif { top: 5rem; }
            #gift-gif { bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); }
        }
    </style>
</head>

<audio id="bgm_main" loop preload="auto"></audio>
<audio id="sfx_collect" preload="auto"></audio>

<audio id="sfx_land" preload="auto"></audio>

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full select-none bg-black">
    <div class="stream-stars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: collect/fail overlays -> catalogs/gifs.json; keep compact off playfield -->
    <img id="gift-gif" class="feedback-gif hidden" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Gift combo reaction" decoding="async" loading="lazy">
    <img id="fail-gif" class="feedback-gif hidden" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction" decoding="async" loading="lazy">

    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
    <div id="hud" class="absolute inset-0 pointer-events-none hidden flex flex-col justify-between p-4 pb-8 safe-area-inset-bottom">
        <!-- Top Bar -->
        <div class="flex justify-between items-start w-full">
            <!-- Left: Stats -->
            <div class="flex flex-col gap-2">
                <!-- Viewers -->
                <div class="glass hud-card px-3 py-1 rounded-lg flex items-center gap-2 w-fit">
                    <div class="w-2 h-2 bg-red-600 rounded-full live-dot"></div>
                    <span class="text-xs text-gray-300 font-fredoka uppercase tracking-wide">Live Feed</span>
                    <span id="viewer-count" class="text-lg font-teko text-white neon-text">0</span>
                </div>
                <!-- Score -->
                <div class="glass hud-card px-3 py-1 rounded-lg w-fit">
                    <div class="text-[10px] text-gray-400 font-fredoka uppercase">Signal Score</div>
                    <div id="score-display" class="text-2xl font-teko text-cyan-400 leading-none neon-text">0</div>
                </div>
            </div>

            <!-- Right: Webcam (The "Real" Element) -->
            <div class="relative w-24 h-32 sm:w-32 sm:h-44 cam-frame rounded-xl bg-black">
                <video id="webcam-feed" class="absolute inset-0 w-full h-full cam-feed hidden" autoplay playsinline muted></video>
                <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(123,231,255,0.08), transparent 32%, rgba(255,79,163,0.08)); pointer-events:none;"></div>
                <!-- Fallback Avatar -->
                <div id="webcam-fallback" class="absolute inset-0 flex items-center justify-center bg-gray-800 text-gray-500 flex-col">
                    <div style="width: 3rem; height: 3rem; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #b8f6ff, #48cfff 50%, #18274e 85%); box-shadow: 0 0 24px rgba(123,231,255,0.4); margin-bottom: 0.35rem;"></div>
                    <span class="text-[8px] font-fredoka uppercase">Creator Cam</span>
                </div>
                <!-- Live Badge on Cam -->
                <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 bg-red-600 px-2 py-0.5 rounded text-[8px] font-bold tracking-wider text-white shadow-sm">
                    LIVE
                </div>
            </div>
        </div>

        <!-- Bottom: Chat Overlay -->
        <div class="w-full max-w-sm h-48 overflow-hidden flex flex-col justify-end mask-image-linear-gradient">
            <div id="chat-container" class="flex flex-col gap-2 text-sm font-fredoka text-white/90 drop-shadow-md">
                <!-- Chat messages injected here -->
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-black/95">
        <div class="start-sparks" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="w-full max-w-md p-8 flex flex-col items-center gap-8 text-center">
            <div>
                <div class="signal-chip" style="display:inline-flex; margin-bottom: 0.85rem;">going live</div>
                <h1 class="text-7xl font-teko text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 transform -skew-x-6 leading-none neon-text">STREAM<br>SURFER</h1>
                <p class="text-gray-400 font-fredoka tracking-widest text-sm mt-2">NEON CREATOR RUN</p>
            </div>

            <div class="w-full glass modal-panel p-6 rounded-2xl flex flex-col gap-4 border-t border-white/20 shadow-2xl">
                <div class="flex items-center gap-3 bg-black/40 p-3 rounded-lg border border-white/5">
                    <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center overflow-hidden" style="box-shadow: 0 0 18px rgba(123,231,255,0.25);">
                        <div style="width:1.5rem;height:1.5rem;border-radius:999px;background: radial-gradient(circle at 35% 30%, #ffffff, #7be7ff 45%, #ff4fa3 85%);"></div>
                    </div>
                    <div class="text-left flex-1">
                        <div class="text-xs text-gray-500 font-bold uppercase">Camera Source</div>
                        <div class="text-sm text-white font-fredoka">Front Camera Preview</div>
                    </div>
                    <div class="w-3 h-3 bg-green-500 rounded-full status-orb"></div>
                </div>

                <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
                    <span class="signal-chip">swipe dodge</span>
                    <span class="signal-chip">grab gifts</span>
                    <span class="signal-chip">keep stream alive</span>
                </div>

                <div class="h-px bg-white/10 w-full my-2"></div>

                <button id="start-btn" class="group stream-btn relative w-full text-black font-teko text-3xl py-4 rounded-xl transition-all overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-r from-cyan-400 via-white to-pink-500 opacity-0 group-hover:opacity-20 transition-opacity"></div>
                    <span class="relative flex items-center justify-center gap-2">
                        <span class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></span>
                        START RUN
                    </span>
                </button>
            </div>

            <p class="text-[10px] text-gray-600 font-fredoka max-w-xs uppercase">
                Swipe or use arrow keys to dodge blockers and scoop up hype gifts.
            </p>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="absolute inset-0 z-50 hidden flex items-center justify-center bg-black/90 backdrop-blur-md">
        <div class="text-center w-full max-w-md p-6">
            <h2 class="text-8xl font-teko text-gray-800 mb-0 leading-none select-none">OFFLINE</h2>
            <div class="text-3xl font-teko text-white mb-2 relative -top-4 neon-pink">RUN ENDED</div>

            <div class="glass modal-panel p-6 rounded-xl mb-8 border border-red-500/30 shadow-2xl">
                <div class="text-sm font-fredoka text-gray-400 uppercase tracking-widest mb-1">Signal Score</div>
                <div id="final-score" class="text-6xl font-teko text-cyan-400 neon-text">0</div>
            </div>

            <button id="restart-btn" class="w-full px-8 py-4 bg-pink-600 hover:bg-pink-500 text-white font-teko text-3xl rounded-xl shadow-2xl transition-all transform hover:scale-105 active:scale-95">
                RUN AGAIN
            </button>
        </div>
    </div>
</div>

<script>
/**
 * § Core Engine & Audio
 */
const CONFIG = {
    fov: 90,
    cameraHeight: 160,
    fogDepth: 2000,
    colors: {
        cyan: '#7BE7FF',
        pink: '#FF4FA3',
        dark: '#040714',
        grid: '#182341',
        laneGlow: 'rgba(123, 231, 255, 0.18)',
        star: 'rgba(255,255,255,0.75)',
        gold: '#FFE073'
    }
};


/**
 * § Camera System (The "Real" Requirement)
 */
const CamSys = {
    video: document.getElementById('webcam-feed'),
    fallback: document.getElementById('webcam-fallback'),
    active: false,

    async start() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 320 },
                    height: { ideal: 320 }
                },
                audio: false
            });
            this.video.srcObject = stream;
            this.video.classList.remove('hidden');
            this.fallback.classList.add('hidden');
            this.active = true;
        } catch (e) {
            console.warn("Camera access denied or unavailable:", e);
            this.video.classList.add('hidden');
            this.fallback.classList.remove('hidden');
        }
    },

    stop() {
        if(this.video.srcObject) {
            const tracks = this.video.srcObject.getTracks();
            tracks.forEach(t => t.stop());
            this.video.srcObject = null;
        }
        this.active = false;
    }
};

/**
 * § Game Logic
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = {
    start: document.getElementById('start-screen'),
    over: document.getElementById('game-over-screen'),
    hud: document.getElementById('hud'),
    score: document.getElementById('score-display'),
    finalScore: document.getElementById('final-score'),
    chat: document.getElementById('chat-container'),
    viewers: document.getElementById('viewer-count'),
    startBtn: document.getElementById('start-btn'),
    restartBtn: document.getElementById('restart-btn'),
    giftGif: document.getElementById('gift-gif'),
    failGif: document.getElementById('fail-gif')
};

let state = {
    active: false,
    t: 0,
    score: 0,
    speed: 0,
    lane: 0,
    playerY: 0,
    playerVy: 0,
    playerX: 0,
    groundZ: 0,
    objects: [],
    particles: [],
    shake: 0,
    nextSpawn: 0,
    chatTimer: 0,
    wasAirborne: false
};

const GAME_CFG = {
    laneWidth: 100,
    baseSpeed: 50,
    gravity: 70,
    jumpForce: 22
};

const media = {
    bgm: document.getElementById('bgm_main'),
    sfx: {
        collect: document.getElementById('sfx_collect'),
        hit: document.getElementById('sfx_hit'),
        jump: document.getElementById('sfx_jump'),
        land: document.getElementById('sfx_land'),
        ui: document.getElementById('sfx_ui'),
        start: document.getElementById('sfx_start')
    }
};

const AUDIO_URLS = {
    bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
    collect: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
    hit: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
    jump: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3',
    land: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',
    ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3'
};

const GifSys = {
    timers: new Map(),
    trigger(key) {
        const el = key === 'gift' ? ui.giftGif : ui.failGif;
        if (!el) return;
        el.classList.remove('hidden');
        requestAnimationFrame(() => el.classList.add('show'));
        if (this.timers.has(key)) clearTimeout(this.timers.get(key));
        const timer = setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.classList.add('hidden'), 180);
        }, key === 'gift' ? 1300 : 1600);
        this.timers.set(key, timer);
    },
    reset() {
        ['gift', 'fail'].forEach(key => {
            const el = key === 'gift' ? ui.giftGif : ui.failGif;
            if (!el) return;
            if (this.timers.has(key)) clearTimeout(this.timers.get(key));
            el.classList.remove('show');
            el.classList.add('hidden');
        });
    }
};

Object.entries(AUDIO_URLS).forEach(([key, url]) => {
    const el = key === 'bgm' ? media.bgm : media.sfx[key];
    if (el) el.src = url;
});

const AudioSys = {
    ctx: null,
    enabled: false,
    initialized: false,
    bgmStarted: false,
    lastPlayed: {},
    init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.ctx.resume().catch(() => {});
        this.enabled = true;
        this.initialized = true;
        Object.values(media.sfx).forEach(el => {
            el.volume = el === media.sfx.hit ? 0.5 : 0.35;
            el.load();
        });
        media.bgm.volume = 0.2;
        media.bgm.load();
    },
    primeFromGesture() {
        if (!this.initialized) this.init();
        this.startBgm();
    },
    startBgm() {
        if (!this.enabled || this.bgmStarted) return;
        media.bgm.play().then(() => {
            this.bgmStarted = true;
        }).catch(() => {});
    },
    stopBgm() {
        media.bgm.pause();
        media.bgm.currentTime = 0;
        this.bgmStarted = false;
    },
    playSfx(name, cooldown = 80) {
        if (!this.enabled) return;
        const now = performance.now();
        if (this.lastPlayed[name] && now - this.lastPlayed[name] < cooldown) return;
        this.lastPlayed[name] = now;
        const el = media.sfx[name];
        if (!el) return;
        try {
            el.currentTime = 0;
            el.play().catch(() => {});
        } catch (_) {}
    }
};

// Resize
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Input
let touchStart = { x: 0, y: 0 };
let isSwiping = false;

function handleInput(type, e) {
    if(!state.active) return;
    const x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
    const y = e.clientY || (e.touches ? e.touches[0].clientY : 0);

    if (type === 'down') {
        touchStart = { x, y };
        isSwiping = true;
        AudioSys.primeFromGesture();
    } else if (type === 'move' && isSwiping) {
        const dx = x - touchStart.x;
        const dy = y - touchStart.y;
        if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && state.lane < 1) state.lane++;
                if (dx < 0 && state.lane > -1) state.lane--;
            } else {
                if (dy < 0 && state.playerY === 0) {
                    state.playerVy = -GAME_CFG.jumpForce;
                    AudioSys.playSfx('jump', 120);
                }
            }
            isSwiping = false;
        }
    } else {
        isSwiping = false;
    }
}

canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput('down', e); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); handleInput('move', e); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); handleInput('up', e); }, {passive:false});
canvas.addEventListener('mousedown', e => handleInput('down', e));
window.addEventListener('mousemove', e => handleInput('move', e));
window.addEventListener('mouseup', e => handleInput('up', e));

// Keyboard
window.addEventListener('keydown', e => {
    if(!state.active) return;
    if(e.key === 'ArrowLeft' && state.lane > -1) state.lane--;
    if(e.key === 'ArrowRight' && state.lane < 1) state.lane++;
    if(e.key === 'ArrowUp' && state.playerY === 0) {
        state.playerVy = -GAME_CFG.jumpForce;
        AudioSys.playSfx('jump', 120);
    }
});

// Chat System
const chatUsers = ["FanNo1", "CryptoKing", "SarahLive", "NinjaMod", "BeastMode", "Glitch00", "VibeCheck"];
const chatMsgs = ["Clean lane!", "Sharp dodge!", "Bonus package ahead!", "Don't hit the blocker!", "Keep the feed alive!", "Gift crate spotted!", "Stay centered!", "Momentum rising!"];

function addChatMessage() {
    const user = chatUsers[Math.floor(Math.random() * chatUsers.length)];
    const msgTemplate = chatMsgs[Math.floor(Math.random() * chatMsgs.length)];
    const isGift = msgTemplate.includes("Gifted") || msgTemplate.includes("Sent");

    const div = document.createElement('div');
    div.className = "chat-msg glass px-2 py-1 rounded border-l-2 mb-1 " + (isGift ? "border-pink-500 bg-pink-500/10" : "border-cyan-500 bg-black/40");
    div.innerHTML = `<span class="font-bold ${isGift ? 'text-pink-400' : 'text-cyan-400'}">${user}</span> <span class="text-white/80">${msgTemplate}</span>`;

    ui.chat.appendChild(div);
    if(ui.chat.children.length > 6) ui.chat.removeChild(ui.chat.firstChild);

    if(isGift && state.active) spawnObject('gift');
}

// Game Logic
function spawnObject(forceType) {
    const lane = Math.floor(Math.random() * 3) - 1;
    const type = forceType || (Math.random() > 0.8 ? 'gift' : 'obstacle');
    state.objects.push({
        x: lane * GAME_CFG.laneWidth,
        y: 0,
        z: 2000,
        w: 60,
        h: 60,
        lane: lane,
        type: type,
        active: true
    });
}

function initGame() {
    state = {
        active: true,
        t: 0,
        score: 0,
        speed: GAME_CFG.baseSpeed,
        lane: 0,
        playerY: 0,
        playerVy: 0,
        playerX: 0,
        groundZ: 0,
        objects: [],
        particles: [],
        shake: 0,
        nextSpawn: 0,
        chatTimer: 0,
        wasAirborne: false
    };

    ui.start.classList.add('hidden');
    ui.over.classList.add('hidden');
    ui.hud.classList.remove('hidden');
    ui.chat.innerHTML = '';
    GifSys.reset();

    CamSys.start();
    AudioSys.primeFromGesture();

    requestAnimationFrame(loop);
}

function gameOver() {
    state.active = false;
    state.shake = 30;
    AudioSys.playSfx('hit', 300);
    GifSys.trigger('fail');

    setTimeout(() => {
        CamSys.stop();
        AudioSys.stopBgm();
        ui.finalScore.innerText = Math.floor(state.score);
        ui.hud.classList.add('hidden');
        ui.over.classList.remove('hidden');
    }, 1000);
}

function update(dt) {
    if(!state.active) return;

    state.speed += dt * 1.5;
    state.score += state.speed * dt * 0.1;
    state.groundZ = (state.groundZ + state.speed * dt * 10) % 200;

    const targetX = state.lane * GAME_CFG.laneWidth;
    state.playerX += (targetX - state.playerX) * 15 * dt;

    state.playerY += state.playerVy * dt * 60;
    if(state.playerY < 0) {
        state.wasAirborne = true;
        state.playerVy += GAME_CFG.gravity * dt;
    } else {
        if (state.wasAirborne) AudioSys.playSfx('land', 140);
        state.playerY = 0;
        state.playerVy = 0;
        state.wasAirborne = false;
    }

    state.nextSpawn -= dt;
    if(state.nextSpawn <= 0) {
        spawnObject();
        state.nextSpawn = Math.max(0.5, 150 / state.speed);
    }

    state.chatTimer -= dt;
    if(state.chatTimer <= 0) {
        addChatMessage();
        state.chatTimer = Math.random() * 2 + 0.5;
    }

    const playerZ = 100;
    for (let i = state.objects.length - 1; i >= 0; i--) {
        let obj = state.objects[i];
        obj.z -= state.speed * dt * 10;

        if (obj.active && Math.abs(obj.z - playerZ) < 40) {
            if (obj.lane === state.lane && state.playerY > -40) {
                if (obj.type === 'obstacle') {
                    gameOver();
                } else if (obj.type === 'gift') {
                    state.score += 500;
                    AudioSys.playSfx('collect', 90);
                    GifSys.trigger('gift');
                    obj.active = false;
                    for(let k=0; k<8; k++) {
                        state.particles.push({
                            x: state.playerX, y: -40, z: playerZ,
                            vx: (Math.random()-0.5)*300, vy: -Math.random()*300, vz: (Math.random()-0.5)*300,
                            life: 1, color: Math.random() > 0.4 ? CONFIG.colors.pink : CONFIG.colors.gold
                        });
                    }
                }
            }
        }

        if (obj.z < -200) state.objects.splice(i, 1);
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
        let p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt;
        p.vy += 500 * dt;
        p.life -= dt * 2;
        if(p.life <= 0) state.particles.splice(i, 1);
    }

    if(state.shake > 0) state.shake *= 0.9;
    ui.score.innerText = Math.floor(state.score);

    if(Math.random() < 0.1) {
        let v = 5000 + Math.floor(state.score * 0.5 + Math.sin(state.t)*500);
        ui.viewers.innerText = v.toLocaleString();
    }

    state.t += dt;
}

// 3D Projection
function project(x, y, z) {
    const camY = -CONFIG.cameraHeight;
    const rz = z;
    if (rz <= 0) return null;
    const scale = CONFIG.fov / rz;
    const sx = x * scale + canvas.width / (2 * window.devicePixelRatio);
    const sy = (y - camY) * scale + canvas.height / (2 * window.devicePixelRatio);
    return { x: sx, y: sy, scale: scale };
}

function drawBackdrop(width, height) {
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#0c1430');
    gradient.addColorStop(0.55, '#071121');
    gradient.addColorStop(1, '#040714');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 18; i++) {
        const x = ((i * 197 + state.t * 18) % (width + 120)) - 60;
        const y = 54 + (i % 6) * 24 + Math.sin(state.t * 1.4 + i) * 10;
        const w = 36 + (i % 4) * 10;
        ctx.fillStyle = i % 3 === 0 ? 'rgba(255,79,163,0.08)' : 'rgba(123,231,255,0.08)';
        ctx.fillRect(x, y, w, 3);
    }

    for (let i = 0; i < 28; i++) {
        const x = (i * 73) % width;
        const y = 34 + (i * 47) % Math.max(120, height * 0.45);
        const radius = (i % 3) + 1;
        ctx.fillStyle = i % 5 === 0 ? 'rgba(255, 224, 115, 0.7)' : CONFIG.colors.star;
        ctx.beginPath();
        ctx.arc(x, y + Math.sin(state.t + i) * 1.5, radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

function draw() {
    const width = canvas.width / (window.devicePixelRatio || 1);
    const height = canvas.height / (window.devicePixelRatio || 1);

    drawBackdrop(width, height);

    const shakeX = (Math.random() - 0.5) * state.shake;
    const shakeY = (Math.random() - 0.5) * state.shake;
    ctx.save();
    ctx.translate(shakeX, shakeY);

    ctx.strokeStyle = CONFIG.colors.laneGlow;
    ctx.lineWidth = 1.2;
    ctx.beginPath();

    [-1.5, -0.5, 0.5, 1.5].forEach(l => {
        const p1 = project(l * GAME_CFG.laneWidth, 0, 50);
        const p2 = project(l * GAME_CFG.laneWidth, 0, 2000);
        if(p1 && p2) { ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); }
    });

    for(let z = state.groundZ; z < 2000; z += 200) {
        if(z < 50) continue;
        const p1 = project(-1.5 * GAME_CFG.laneWidth, 0, z);
        const p2 = project(1.5 * GAME_CFG.laneWidth, 0, z);
        if(p1 && p2) { ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); }
    }
    ctx.stroke();

    const renderList = [...state.objects];
    renderList.sort((a, b) => b.z - a.z);

    let playerDrawn = false;
    const playerZ = 100;

    renderList.forEach(obj => {
        if(!playerDrawn && obj.z < playerZ) {
            drawPlayer();
            playerDrawn = true;
        }
        drawObject(obj);
    });
    if(!playerDrawn) drawPlayer();

    state.particles.forEach(p => {
        const pos = project(p.x, p.y, p.z);
        if(pos) {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 4 * pos.scale, 0, Math.PI*2);
            ctx.fill();
        }
    });

    ctx.restore();
}

function drawPlayer() {
    const p = project(state.playerX, state.playerY, 100);
    if(!p) return;
    const size = 60 * p.scale;
    const bob = Math.sin(state.t * 15) * 5 * p.scale;

    ctx.save();
    ctx.translate(p.x, p.y + bob);

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(0, 0, size / 2.1, size / 6.5, 0, 0, Math.PI * 2);
    ctx.fill();

    const glow = ctx.createRadialGradient(0, -size * 0.7, size * 0.15, 0, -size * 0.7, size * 0.9);
    glow.addColorStop(0, 'rgba(123, 231, 255, 0.35)');
    glow.addColorStop(1, 'rgba(123, 231, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, -size * 0.7, size * 0.9, 0, Math.PI * 2);
    ctx.fill();

    const bodyGradient = ctx.createLinearGradient(0, -size, 0, 0);
    bodyGradient.addColorStop(0, '#bff9ff');
    bodyGradient.addColorStop(0.45, CONFIG.colors.cyan);
    bodyGradient.addColorStop(1, '#224a91');
    ctx.fillStyle = bodyGradient;
    ctx.beginPath();
    ctx.arc(0, -size * 0.62, size * 0.42, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineWidth = Math.max(1.2, size * 0.06);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.stroke();

    ctx.fillStyle = '#08101f';
    ctx.beginPath();
    ctx.arc(-size * 0.13, -size * 0.68, size * 0.05, 0, Math.PI * 2);
    ctx.arc(size * 0.13, -size * 0.68, size * 0.05, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#08101f';
    ctx.lineWidth = Math.max(1.1, size * 0.045);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-size * 0.16, -size * 0.53);
    ctx.quadraticCurveTo(0, -size * 0.42, size * 0.16, -size * 0.53);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = Math.max(1.5, size * 0.06);
    ctx.beginPath();
    ctx.moveTo(-size * 0.17, -size * 1.03);
    ctx.lineTo(-size * 0.34, -size * 1.22);
    ctx.moveTo(size * 0.17, -size * 1.03);
    ctx.lineTo(size * 0.34, -size * 1.22);
    ctx.stroke();

    ctx.fillStyle = CONFIG.colors.pink;
    ctx.beginPath();
    ctx.arc(-size * 0.36, -size * 1.24, size * 0.07, 0, Math.PI * 2);
    ctx.arc(size * 0.36, -size * 1.24, size * 0.07, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-size * 0.1, -size * 0.78, size * 0.07, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawObject(obj) {
    if(!obj.active) return;
    const p = project(obj.x, obj.y, obj.z);
    if(!p) return;
    const size = obj.w * p.scale;

    ctx.save();
    ctx.translate(p.x, p.y);

    if(obj.type === 'obstacle') {
        const blockGradient = ctx.createLinearGradient(0, -size, 0, 0);
        blockGradient.addColorStop(0, '#ff8aa5');
        blockGradient.addColorStop(0.2, '#ff4d6d');
        blockGradient.addColorStop(1, '#6a1031');
        ctx.fillStyle = blockGradient;
        ctx.fillRect(-size/2, -size, size, size);

        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-size/2, -size, size, size*0.12);
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = Math.max(1, size * 0.05);
        ctx.strokeRect(-size/2, -size, size, size);
    } else if (obj.type === 'gift') {
        const bob = Math.sin(state.t * 10 + obj.z * 0.01) * 10 * p.scale;
        ctx.translate(0, bob);

        ctx.fillStyle = 'rgba(255, 224, 115, 0.26)';
        ctx.beginPath();
        ctx.arc(0, -size / 2, size * 0.72, 0, Math.PI * 2);
        ctx.fill();

        const giftGradient = ctx.createLinearGradient(0, -size, 0, 0);
        giftGradient.addColorStop(0, '#ff9fd0');
        giftGradient.addColorStop(1, CONFIG.colors.pink);
        ctx.fillStyle = giftGradient;
        ctx.fillRect(-size/2, -size, size, size);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-size*0.08, -size, size*0.16, size);
        ctx.fillRect(-size/2, -size*0.58, size, size*0.16);

        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = Math.max(1, size * 0.05);
        ctx.strokeRect(-size/2, -size, size, size);

        ctx.fillStyle = CONFIG.colors.gold;
        ctx.beginPath();
        ctx.arc(-size * 0.12, -size * 1.02, size * 0.14, 0, Math.PI * 2);
        ctx.arc(size * 0.12, -size * 1.02, size * 0.14, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

// Main Loop
let lastTime = 0;
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    update(dt);
    draw();
    if(state.active || state.shake > 0 || state.particles.length > 0) requestAnimationFrame(loop);
}

// Event Bindings
ui.startBtn.addEventListener('click', () => {
    AudioSys.primeFromGesture();
    AudioSys.playSfx('ui', 40);
    AudioSys.playSfx('start', 40);
    ui.startBtn.innerText = "LOADING RUN...";
    setTimeout(initGame, 800);
});

ui.restartBtn.addEventListener('click', () => {
    AudioSys.primeFromGesture();
    AudioSys.playSfx('ui', 40);
    ui.over.classList.add('hidden');
    initGame();
});
</script>
