<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skibidi Momday Gift Tap 3D</title>
    <!-- [agent-note][stage4] approved-fonts: catalogs/fonts.json | body=Exo 2 | display=Bangers | hud=Press Start 2P -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Press+Start+2P&family=Bangers&display=swap">
    <style>
        :root {
            --theme-color: #ff5fb8;
            --bg-main: #140915;
            --bg-deep: #07040a;
            --panel-bg: rgba(48, 20, 54, 0.78);
            --panel-strong: rgba(72, 29, 78, 0.92);
            --panel-border: rgba(255, 208, 120, 0.38);
            --cyan: #9df8ff;
            --pink: #ff77bd;
            --yellow: #ffd878;
            --violet: #a875ff;
            --mint: #9dffd1;
            --text-main: #f8fbff;
            --text-soft: #d4d8f8;
            --white-10: rgba(255, 255, 255, 0.1);
            --black-20: rgba(0, 0, 0, 0.2);
            --shadow-soft: 0 16px 30px rgba(0, 0, 0, 0.28);
            --shadow-glow: 0 0 18px rgba(112, 233, 255, 0.2);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(141, 104, 255, 0.16), transparent 36%),
                linear-gradient(180deg, var(--bg-main), var(--bg-deep));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body { position: relative; }

        canvas { display: block; touch-action: none; }

        button { font: inherit; }

        .glass {
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 216, 120, 0.12), transparent 28%),
                linear-gradient(180deg, rgba(64, 25, 60, 0.92), rgba(18, 10, 30, 0.86));
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-soft), var(--shadow-glow), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .neon-text {
            text-shadow:
                0 0 8px rgba(255, 121, 215, 0.7),
                0 0 18px rgba(138, 247, 255, 0.45);
        }

        .btn-gift {
            transition: transform 0.1s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
            cursor: pointer;
        }

        .btn-gift:active { transform: scale(0.95); }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes marqueeGlow {
            0%, 100% { filter: saturate(1) brightness(1); }
            50% { filter: saturate(1.15) brightness(1.08); }
        }

        @keyframes momdayDrift {
            0% { transform: translate3d(-2%, 0, 0) rotate(0deg); }
            50% { transform: translate3d(2%, -1.5%, 0) rotate(1deg); }
            100% { transform: translate3d(-2%, 0, 0) rotate(0deg); }
        }

        @keyframes stickerFloat {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            background:
                radial-gradient(circle at 50% 22%, rgba(255, 119, 189, 0.18), transparent 24%),
                radial-gradient(circle at 80% 15%, rgba(157, 248, 255, 0.14), transparent 18%),
                linear-gradient(180deg, #1a0a18 0%, #110819 48%, #07040a 100%);
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: -4%;
            pointer-events: none;
            background:
                radial-gradient(circle at 14% 18%, rgba(255, 216, 120, 0.13), transparent 10%),
                radial-gradient(circle at 84% 24%, rgba(157, 255, 209, 0.11), transparent 12%),
                radial-gradient(circle at 50% 40%, rgba(255, 119, 189, 0.12), transparent 24%),
                repeating-linear-gradient(115deg, transparent 0 38px, rgba(255, 255, 255, 0.025) 39px 41px);
            z-index: 1;
            animation: momdayDrift 8s ease-in-out infinite;
        }

        #game-container::after {
            content: "💌  💐  👑  🌹  💖  🥞";
            position: absolute;
            inset: auto 0 31vh 0;
            pointer-events: none;
            z-index: 3;
            text-align: center;
            font-size: clamp(18px, 4vw, 34px);
            letter-spacing: clamp(12px, 4vw, 34px);
            opacity: 0.18;
            filter: drop-shadow(0 0 12px rgba(255, 119, 189, 0.55));
            animation: stickerFloat 4.8s ease-in-out infinite;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .stat-card {
            border-radius: 20px;
            padding: 11px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 102px;
            position: relative;
            overflow: hidden;
            outline: 1px solid rgba(255, 119, 189, 0.12);
        }

        .stat-card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 88% 18%, rgba(255, 119, 189, 0.18), transparent 18%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 45%);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            color: var(--text-soft);
        }

        .stat-label.cyan { color: var(--cyan); }
        .stat-label.yellow { color: var(--yellow); }

        .stat-value-caption {
            margin-top: 4px;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.68);
        }

        .love-meter {
            width: 128px;
            height: 16px;
            background: rgba(5, 8, 20, 0.9);
            border-radius: 999px;
            margin-top: 6px;
            border: 1px solid rgba(138, 247, 255, 0.45);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.45);
        }

        .love-meter::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent 35%, rgba(255,255,255,0.05));
            pointer-events: none;
        }

        #love-bar {
            height: 100%;
            width: 0;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan));
            box-shadow: 0 0 16px rgba(255, 121, 215, 0.5);
        }

        #love-percent {
            font-size: 14px;
            font-weight: 700;
            margin-top: 4px;
            font-family: 'Press Start 2P', monospace;
        }

        #currency-display {
            font-size: 30px;
            line-height: 1;
            font-weight: 700;
            color: var(--yellow);
            font-family: 'Press Start 2P', monospace;
            text-shadow: 0 0 10px rgba(255, 215, 106, 0.45);
        }

        #dialogue-box {
            border-radius: 22px;
            padding: 14px 16px;
            margin: 0 16px 16px;
            transition: all 0.3s ease;
            transform-origin: bottom;
            opacity: 0;
            transform: scale(0.95) translateY(8px);
            position: relative;
            overflow: hidden;
        }

        #dialogue-box::before {
            content: "MOM CAM";
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 10px;
            letter-spacing: 0.2em;
            color: rgba(138, 247, 255, 0.7);
        }

        #dialogue-box.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        #dialogue-text {
            margin: 0;
            text-align: center;
            font-size: 17px;
            font-style: italic;
            color: #ffe3f4;
            line-height: 1.2;
            padding-right: 46px;
        }

        .shop-panel {
            border-radius: 26px 26px 0 0;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            max-height: 30vh;
            position: relative;
            overflow: hidden;
            border-top-color: rgba(255, 216, 120, 0.56);
        }

        .shop-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% 0%, rgba(255, 216, 120, 0.13), transparent 24%),
                radial-gradient(circle at 86% 0%, rgba(157, 248, 255, 0.1), transparent 24%),
                linear-gradient(180deg, rgba(255, 119, 189, 0.08), transparent 42%);
        }

        .shop-header {
            padding: 8px 12px;
            border-bottom: 1px solid var(--white-10);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(6, 8, 20, 0.42);
            border-radius: 24px 24px 0 0;
            gap: 10px;
        }

        .shop-title-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .shop-kicker {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(138, 247, 255, 0.78);
        }

        .shop-title {
            font-family: 'Bangers', system-ui, sans-serif;
            font-weight: 400;
            color: #ffd0ef;
            letter-spacing: 0.08em;
            text-shadow: 0 0 10px rgba(255, 119, 189, 0.32);
        }

        .shop-subtitle {
            font-size: 11px;
            color: #b6bfd8;
            text-align: right;
            max-width: 48%;
        }

        #shop-list {
            display: flex;
            overflow-x: auto;
            padding: 12px;
            gap: 12px;
        }

        .shop-item {
            flex-shrink: 0;
            border-radius: 18px;
            padding: 12px 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 102px;
            border: 1px solid rgba(255, 216, 120, 0.18);
            color: white;
            background:
                radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.12), transparent 25%),
                linear-gradient(180deg, rgba(255, 119, 189, 0.12), rgba(168, 117, 255, 0.08));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 18px rgba(0,0,0,0.16);
        }

        .shop-item:hover {
            border-color: rgba(255, 121, 215, 0.8);
            box-shadow: 0 0 14px rgba(255, 121, 215, 0.18);
        }

        .shop-item.active {
            transform: scale(0.95);
            background: linear-gradient(180deg, rgba(255, 121, 215, 0.3), rgba(141, 104, 255, 0.18));
        }

        .shop-icon {
            font-size: 32px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 8px rgba(255, 121, 215, 0.3)) drop-shadow(0 5px 0 rgba(0,0,0,0.18));
        }

        .shop-name {
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.03em;
        }

        .shop-cost {
            font-size: 12px;
            color: var(--yellow);
            font-family: 'Press Start 2P', monospace;
            margin-top: 4px;
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 24%, rgba(255, 216, 120, 0.16), transparent 20%),
                radial-gradient(circle at 18% 28%, rgba(255, 119, 189, 0.22), transparent 18%),
                radial-gradient(circle at 82% 26%, rgba(157, 248, 255, 0.16), transparent 18%),
                rgba(7, 4, 10, 0.9);
            backdrop-filter: blur(12px);
            transition: opacity 0.5s ease;
            padding: 24px;
            text-align: center;
        }

        .marquee-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            margin-bottom: 18px;
            border: 1px solid rgba(138, 247, 255, 0.38);
            background: rgba(12, 16, 36, 0.72);
            box-shadow: 0 0 16px rgba(138, 247, 255, 0.12);
            font-size: 11px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--cyan);
            animation: marqueeGlow 2.4s ease-in-out infinite;
        }

        .marquee-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--pink);
            box-shadow: 0 0 10px rgba(255, 121, 215, 0.9);
        }

        #start-title {
            font-family: 'Bangers', system-ui, sans-serif;
            font-size: clamp(44px, 11vw, 88px);
            line-height: 0.92;
            margin: 0 0 16px;
            color: transparent;
            background-image: linear-gradient(90deg, var(--yellow), #ffe8f6 38%, var(--pink), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 1px rgba(255, 216, 120, 0.22);
        }

        #start-copy {
            color: #f6d8ec;
            margin-bottom: 26px;
            animation: pulse 1.6s infinite;
            max-width: 520px;
            font-size: 17px;
            line-height: 1.3;
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        #start-btn {
            padding: 12px 32px;
            border: 1px solid rgba(255, 216, 120, 0.5);
            border-radius: 999px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.08em;
            color: white;
            background:
                radial-gradient(circle at 24% 12%, rgba(255,255,255,0.35), transparent 20%),
                linear-gradient(90deg, #ff77bd, #a875ff 54%, #9df8ff);
            box-shadow: 0 0 22px rgba(255, 119, 189, 0.38), 0 12px 26px rgba(0,0,0,0.24);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.16s ease, filter 0.16s ease;
            font-family: 'Bangers', system-ui, sans-serif;
        }

        .feedback-gif {
            position: absolute;
            right: 14px;
            bottom: 34vh;
            width: min(30vw, 124px);
            border-radius: 18px;
            border: 1px solid rgba(138, 247, 255, 0.32);
            background: rgba(8, 9, 20, 0.7);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3), 0 0 18px rgba(112, 233, 255, 0.2);
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 55;
            object-fit: cover;
            aspect-ratio: 1 / 1;
        }

        .feedback-gif.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        #fail-gif {
            left: 14px;
            right: auto;
            bottom: 38vh;
        }

        #start-btn:active {
            transform: scale(0.95);
            filter: brightness(1.05);
        }

        #start-btn:hover { box-shadow: 0 0 26px rgba(112, 233, 255, 0.28); }

        @media (max-width: 640px) {
            #ui-layer { padding: 12px; }
            .hud-row { gap: 8px; }
            .stat-card { min-width: 0; flex: 1 1 0; padding: 10px; }
            .stat-label { letter-spacing: 0.16em; }
            .love-meter { width: 100%; max-width: 108px; }
            #currency-display { font-size: 24px; }
            #dialogue-box { margin: 0 8px 12px; }
            #dialogue-text { font-size: 15px; padding-right: 34px; }
            .shop-panel { max-height: 34vh; }
            .shop-header { padding: 8px 10px; }
            .shop-subtitle { max-width: 45%; }
            #start-copy { font-size: 15px; }
            .feedback-gif { width: min(26vw, 88px); bottom: 36vh; }
            #fail-gif { bottom: 40vh; }
        }
    </style>
</head>

<script>
window.gameConfigDefs = {
    "clickValue": { "type": "number", "label": "Love Cheer per Tap", "value": 1, "min": 1, "max": 10 },
    "loveGoal": { "type": "number", "label": "Mom Meter Goal", "value": 500, "min": 100, "max": 5000 },
    "themeColor": { "type": "color", "label": "Momday Neon Accent", "value": "#ff00ff" }
};
window.gameConfig = {
    clickValue: 1,
    loveGoal: 500,
    themeColor: "#ff00ff"
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') document.documentElement.style.setProperty('--theme-color', val);
    }
};

class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.masterGain = null;
        this.buffers = new Map();
        this.lastPlayedAt = new Map();
        this.cooldowns = {
            sfx_tap: 55,
            sfx_buy: 140,
            sfx_fail: 220,
            sfx_win: 500
        };
    }

    ensureContext() {
        if (this.ctx) return this.ctx;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        this.ctx = new Ctx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.6;
        this.masterGain.connect(this.ctx.destination);
        return this.ctx;
    }

    async loadSound(id, src) {
        const ctx = this.ensureContext();
        if (!ctx || !src) return;
        try {
            const soundUrl = new URL(src, window.location.href);
            if (soundUrl.origin !== window.location.origin) {
                // [agent-note][stage4] repair: avoid cross-origin WebAudio fetch CORS console errors; synthesized fallback still plays.
                return;
            }
            const res = await fetch(soundUrl.href);
            if (!res.ok) return;
            const arrayBuffer = await res.arrayBuffer();
            const decoded = await ctx.decodeAudioData(arrayBuffer.slice(0));
            this.buffers.set(id, decoded);
        } catch (e) {
            console.warn(`Failed to load ${id}`, e);
        }
    }

    async unlock() {
        const ctx = this.ensureContext();
        if (!ctx) return;
        if (ctx.state !== 'running') {
            try {
                await ctx.resume();
            } catch (e) {
                console.warn('Audio unlock failed', e);
            }
        }
        this.unlocked = ctx.state === 'running';
        if (this.unlocked) this.playBgm();
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.26;
        el.loop = true;
        if (this.unlocked) {
            el.play().catch(() => {});
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, fallback = 'tap') {
        if (!this.unlocked) return;
        const now = performance.now();
        const cooldown = this.cooldowns[id] || 80;
        if (now - (this.lastPlayedAt.get(id) || 0) < cooldown) return;
        this.lastPlayedAt.set(id, now);

        const ctx = this.ensureContext();
        const buffer = ctx ? this.buffers.get(id) : null;
        if (ctx && buffer && this.masterGain) {
            const source = ctx.createBufferSource();
            const gainNode = ctx.createGain();
            gainNode.gain.value = id === 'sfx_win' ? 0.45 : id === 'sfx_fail' ? 0.4 : 0.32;
            source.buffer = buffer;
            source.connect(gainNode);
            gainNode.connect(this.masterGain);
            source.start(0);
            return;
        }

        this.synthesize(fallback);
    }

    synthesize(type) {
        const ctx = this.ensureContext();
        if (!ctx || !this.masterGain || !this.unlocked) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        if (type === 'buy') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1040, ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
            osc.start();
            osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(240, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(160, ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
        } else if (type === 'win') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(660, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.28);
            gain.gain.setValueAtTime(0.16, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } else {
            osc.type = 'square';
            osc.frequency.setValueAtTime(420, ctx.currentTime);
            gain.gain.setValueAtTime(0.06, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const parsed = JSON.parse(cfgEl.textContent);
            for (const k in parsed) window.gameConfig[k] = parsed[k].value;
        }
    } catch (e) {
        console.error("Config parse error", e);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audio = new AudioManager();

    const elStartScreen = document.getElementById('start-screen');
    const elStartBtn = document.getElementById('start-btn');
    const elCurrency = document.getElementById('currency-display');
    const elLoveBar = document.getElementById('love-bar');
    const elLovePercent = document.getElementById('love-percent');
    const elShopList = document.getElementById('shop-list');
    const elDialogueBox = document.getElementById('dialogue-box');
    const elDialogueText = document.getElementById('dialogue-text');
    const elRewardGif = document.getElementById('reward-gif');
    const elFailGif = document.getElementById('fail-gif');

    let gameState = {
        currency: 0,
        affection: 0,
        lastTime: 0,
        bonnieScale: 1,
        particles: [],
        dialogueTimer: 0,
        gifTimer: 0,
        won: false
    };

    const imgBonnie = document.getElementById('asset_bonnie');

    const shopItems = [
        { id: 'sticker', name: 'Heart Card', cost: 10, love: 15, icon: '💌', msg: "Handmade card secured. Momday aura rising." },
        { id: 'pick', name: 'Bouquet Pop', cost: 50, love: 40, icon: '💐', msg: "Petal combo unlocked for the legendary mom." },
        { id: 'poster', name: 'Breakfast Tray', cost: 150, love: 80, icon: '🥞', msg: "Breakfast-in-bed energy is now canon." },
        { id: 'lights', name: 'Coupon Crown', cost: 500, love: 200, icon: '👑', msg: "Mom gets the royal coupon chaos crown!" },
        { id: 'anthem', name: 'Galaxy Rose', cost: 1000, love: 500, icon: '🌹', msg: "Cosmic Momday finale gift is orbiting." }
    ];

    function initShop() {
        elShopList.innerHTML = '';
        shopItems.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'btn-gift glass shop-item';
            btn.innerHTML = `
                <div class="shop-icon">${item.icon}</div>
                <div class="shop-name">${item.name}</div>
                <div class="shop-cost">${item.cost}</div>
            `;
            btn.onclick = (e) => buyItem(item, e);
            elShopList.appendChild(btn);
        });
    }

    function showFeedbackGif(el, duration = 1500) {
        if (!el) return;
        clearTimeout(gameState.gifTimer);
        elRewardGif?.classList.remove('visible');
        elFailGif?.classList.remove('visible');
        el.classList.add('visible');
        gameState.gifTimer = setTimeout(() => el.classList.remove('visible'), duration);
    }

    function buyItem(item, e) {
        if (gameState.currency >= item.cost) {
            gameState.currency -= item.cost;
            gameState.affection += item.love;
            gameState.bonnieScale = 1.1;

            audio.playSfx('sfx_buy', 'buy');
            spawnParticles(canvas.width / 2, canvas.height / 2, 20, item.icon);
            showDialogue(item.msg);
            showFeedbackGif(elRewardGif, gameState.won ? 1800 : 1300);
            updateUI();

            const btn = e.currentTarget;
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 100);
        } else {
            audio.playSfx('sfx_fail', 'fail');
            elCurrency.parentElement.classList.add('shake');
            setTimeout(() => elCurrency.parentElement.classList.remove('shake'), 500);
            showDialogue("Not enough Love Cheers yet. Keep tapping Momday.");
            showFeedbackGif(elFailGif, 1100);
        }
    }

    function showDialogue(text) {
        elDialogueText.innerText = `"${text}"`;
        elDialogueBox.classList.add('visible');

        clearTimeout(gameState.dialogueTimer);
        gameState.dialogueTimer = setTimeout(() => {
            elDialogueBox.classList.remove('visible');
        }, 3000);
    }

    function updateUI() {
        elCurrency.innerText = Math.floor(gameState.currency);

        const lovePct = Math.min(100, (gameState.affection / window.gameConfig.loveGoal) * 100);
        elLoveBar.style.width = `${lovePct}%`;
        elLovePercent.innerText = `${Math.floor(lovePct)}%`;

        if (lovePct >= 100 && !gameState.won) {
            gameState.won = true;
            audio.playSfx('sfx_win', 'win');
            showDialogue("Mom Legend complete. The whole gift parade is chanting!");
            showFeedbackGif(elRewardGif, 2200);
            spawnParticles(canvas.width / 2, canvas.height / 2, 100, '💖');
        }
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = -(Math.random() * 3 + 2);
            this.life = 1.0;
            this.type = type;
            this.text = type;
            this.scale = Math.random() * 0.5 + 0.5;
        }
        update(dt) {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.05;
            this.life -= dt * 1.5;
            this.scale *= 0.99;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.font = `${20 * this.scale}px Arial`;
            ctx.textAlign = "center";
            ctx.fillStyle = "#fff";
            ctx.fillText(this.text, this.x, this.y);
            ctx.globalAlpha = 1.0;
        }
    }

    // [agent-note][world-design-v4] background-foundation: authored Momday kitchen -> garden -> mall -> parade -> cosmic procedural motifs; preserve canvas loop and tap readability.
    function drawHeart(x, y, size, color, alpha = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(size / 32, size / 32);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, 10);
        ctx.bezierCurveTo(-24, -8, -8, -26, 0, -10);
        ctx.bezierCurveTo(8, -26, 24, -8, 0, 10);
        ctx.fill();
        ctx.restore();
    }

    function drawGiftBox(x, y, size, hueShift = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin((x + y) * 0.01) * 0.05);
        const s = size;
        ctx.fillStyle = hueShift % 2 ? 'rgba(168, 117, 255, 0.42)' : 'rgba(255, 119, 189, 0.42)';
        ctx.strokeStyle = 'rgba(255, 216, 120, 0.55)';
        ctx.lineWidth = 2;
        ctx.fillRect(-s * 0.5, -s * 0.36, s, s * 0.72);
        ctx.strokeRect(-s * 0.5, -s * 0.36, s, s * 0.72);
        ctx.fillStyle = 'rgba(255, 216, 120, 0.62)';
        ctx.fillRect(-s * 0.08, -s * 0.36, s * 0.16, s * 0.72);
        ctx.fillRect(-s * 0.5, -s * 0.08, s, s * 0.16);
        ctx.beginPath();
        ctx.arc(-s * 0.13, -s * 0.42, s * 0.14, 0, Math.PI * 2);
        ctx.arc(s * 0.13, -s * 0.42, s * 0.14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawFlower(x, y, size, phase) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(phase) * 0.08);
        ctx.strokeStyle = 'rgba(157, 255, 209, 0.42)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, size * 0.7);
        ctx.quadraticCurveTo(Math.sin(phase) * 8, size * 0.15, 0, -size * 0.1);
        ctx.stroke();
        for (let i = 0; i < 6; i++) {
            const a = i * Math.PI / 3;
            ctx.fillStyle = i % 2 ? 'rgba(255, 119, 189, 0.42)' : 'rgba(255, 216, 120, 0.42)';
            ctx.beginPath();
            ctx.ellipse(Math.cos(a) * size * 0.22, -size * 0.18 + Math.sin(a) * size * 0.18, size * 0.16, size * 0.24, a, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = 'rgba(157, 248, 255, 0.62)';
        ctx.beginPath();
        ctx.arc(0, -size * 0.18, size * 0.11, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawCrown(cx, y, scale, timestamp) {
        ctx.save();
        ctx.translate(cx, y + Math.sin(timestamp * 0.003) * 3);
        ctx.scale(scale, scale);
        ctx.fillStyle = 'rgba(255, 216, 120, 0.92)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.48)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-42, 18);
        ctx.lineTo(-34, -16);
        ctx.lineTo(-13, 6);
        ctx.lineTo(0, -24);
        ctx.lineTo(13, 6);
        ctx.lineTo(34, -16);
        ctx.lineTo(42, 18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 119, 189, 0.8)';
        [-34, 0, 34].forEach((x, i) => {
            ctx.beginPath();
            ctx.arc(x, i === 1 ? -24 : -16, 4, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.restore();
    }

    function drawMomdayWorld(timestamp, cx, cy) {
        const h = window.innerHeight;
        const w = window.innerWidth;
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#211024');
        sky.addColorStop(0.42, '#160a1b');
        sky.addColorStop(1, '#07040a');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const portalPulse = 0.5 + Math.sin(timestamp * 0.0018) * 0.08;
        for (let r = 0; r < 4; r++) {
            ctx.strokeStyle = r % 2 ? 'rgba(157, 248, 255, 0.12)' : 'rgba(255, 119, 189, 0.13)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(cx, cy - 28, (180 + r * 34) * portalPulse, (112 + r * 18) * portalPulse, timestamp * 0.0002 + r * 0.35, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();

        for (let i = 0; i < 9; i++) {
            const x = ((i * 137 + timestamp * 0.012) % (w + 160)) - 80;
            const y = 82 + (i % 3) * 50 + Math.sin(timestamp * 0.001 + i) * 10;
            if (i % 3 === 0) drawGiftBox(x, y, 26, i);
            else if (i % 3 === 1) drawHeart(x, y, 25, 'rgba(255, 119, 189, 0.58)', 0.75);
            else drawFlower(x, y + 16, 34, timestamp * 0.001 + i);
        }

        const tableY = h * 0.62;
        const table = ctx.createLinearGradient(0, tableY, 0, h);
        table.addColorStop(0, 'rgba(255, 216, 120, 0.13)');
        table.addColorStop(0.22, 'rgba(255, 119, 189, 0.08)');
        table.addColorStop(1, 'rgba(68, 30, 42, 0.42)');
        ctx.fillStyle = table;
        ctx.fillRect(0, tableY, w, h - tableY);

        ctx.strokeStyle = 'rgba(255, 216, 120, 0.11)';
        ctx.lineWidth = 1;
        const gridSize = 54;
        const offset = (timestamp * 0.012) % gridSize;
        for (let x = -gridSize; x < w + gridSize; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x + offset * 0.25, tableY);
            ctx.lineTo(x - 60 + offset, h);
            ctx.stroke();
        }
        for (let y = tableY + offset; y < h; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
        }

        ctx.save();
        ctx.globalAlpha = 0.62;
        drawGiftBox(54, h - 92, 54, 1);
        drawGiftBox(w - 58, h - 104, 48, 0);
        drawFlower(92, h - 115, 58, timestamp * 0.001);
        drawFlower(w - 100, h - 120, 52, timestamp * 0.0015 + 2);
        ctx.restore();
    }

    function drawCharacterFrame(cx, cy, finalScale, timestamp) {
        const aura = ctx.createRadialGradient(cx, cy, 36, cx, cy, 270);
        aura.addColorStop(0, 'rgba(255, 119, 189, 0.2)');
        aura.addColorStop(0.45, 'rgba(157, 248, 255, 0.11)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(cx, cy, 270, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.globalAlpha = 0.85;
        drawCrown(cx, cy - 218 * finalScale, 0.95 * finalScale, timestamp);
        ctx.restore();

        ctx.fillStyle = 'rgba(255, 119, 189, 0.1)';
        ctx.strokeStyle = 'rgba(255, 216, 120, 0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 142, 138 * finalScale, 30 * finalScale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const pedestalY = cy + 182;
        for (let i = -4; i <= 4; i++) {
            const bob = Math.sin(timestamp * 0.003 + i) * 5;
            const x = cx + i * 28;
            if (Math.abs(i) % 2 === 0) {
                drawHeart(x, pedestalY - 6 + bob, 20, 'rgba(255, 119, 189, 0.78)', 0.8);
            } else {
                drawGiftBox(x, pedestalY + bob, 20, i);
            }
        }
    }

    function spawnParticles(x, y, count, char) {
        for (let i = 0; i < count; i++) {
            gameState.particles.push(new Particle(x, y, char));
        }
    }

    function loop(timestamp) {
        const dt = (timestamp - gameState.lastTime) / 1000 || 0;
        gameState.lastTime = timestamp;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawMomdayWorld(timestamp, window.innerWidth / 2, window.innerHeight / 2 + 40);

        const idleY = Math.sin(timestamp * 0.002) * 10;
        const breathe = Math.sin(timestamp * 0.003) * 0.02 + 1;

        gameState.bonnieScale += (1.0 - gameState.bonnieScale) * 5 * dt;

        const finalScale = breathe * gameState.bonnieScale;
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2 + 50 + idleY;

        drawCharacterFrame(cx, cy, finalScale, timestamp);

        if (imgBonnie.complete && imgBonnie.naturalWidth > 0) {
            const aspect = imgBonnie.naturalWidth / imgBonnie.naturalHeight;
            const h = Math.min(window.innerHeight * 0.6, 600);
            const w = h * aspect;

            ctx.save();
            ctx.shadowColor = 'rgba(255, 121, 215, 0.38)';
            ctx.shadowBlur = 28;
            ctx.translate(cx, cy);
            ctx.scale(finalScale, finalScale);
            ctx.drawImage(imgBonnie, -w / 2, -h / 2, w, h);
            ctx.restore();
        } else {
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.arc(cx, cy, 100 * finalScale, 0, Math.PI * 2);
            ctx.fill();
        }

        for (let i = gameState.particles.length - 1; i >= 0; i--) {
            const p = gameState.particles[i];
            p.update(dt);
            p.draw(ctx);
            if (p.life <= 0) gameState.particles.splice(i, 1);
        }

        requestAnimationFrame(loop);
    }

    function handleTap(e) {
        e.preventDefault();

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2 + 50;
        const dist = Math.hypot(x - cx, y - cy);

        if (dist < 200) {
            gameState.bonnieScale = 0.95;
            gameState.currency += window.gameConfig.clickValue;

            audio.playSfx('sfx_tap', 'tap');
            spawnParticles(x, y, 1, '💖');
            spawnParticles(x, y, 1, '🌸');

            updateUI();
        }
    }

    canvas.addEventListener('pointerdown', handleTap, { passive: false });

    elStartBtn.addEventListener('click', () => {
        audio.unlock();
        audio.loadSound('sfx_tap', document.getElementById('sfx_tap').src);
        audio.loadSound('sfx_buy', document.getElementById('sfx_buy').src);
        audio.loadSound('sfx_fail', document.getElementById('sfx_fail').src);
        audio.loadSound('sfx_win', document.getElementById('sfx_win').src);
        audio.playSfx('sfx_tap', 'tap');

        elStartScreen.style.opacity = '0';
        setTimeout(() => elStartScreen.style.display = 'none', 500);

        initShop();
        updateUI();
        requestAnimationFrame(loop);
    });

    resize();
});
</script>
