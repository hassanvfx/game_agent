<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skyblock Borough: Seed Budget 100</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage3] resolved-font: title/ui -> Orbitron + Bangers from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Orbitron', system-ui, sans-serif;
            --font-display: 'Bangers', cursive;
            --theme-color: #facc15;
            --theme-success: #4ade80;
            --theme-alert: #fb7185;
            --theme-info: #7dd3fc;
            --bg-top: #0b1026;
            --bg-bottom: #151f46;
            --panel-bg: rgba(17, 24, 39, 0.82);
            --panel-border: rgba(125, 211, 252, 0.45);
            --panel-highlight: rgba(250, 204, 21, 0.32);
            --text-main: #f8fbff;
            --text-soft: #bfd7ff;
            --danger-glow: rgba(248, 113, 113, 0.4);
            --accent-glow: rgba(56, 189, 248, 0.35);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 28%),
                radial-gradient(circle at 20% 80%, rgba(250, 204, 21, 0.16), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: var(--font-main);
            color: var(--text-main);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 18%, transparent 82%, rgba(255,255,255,0.04)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 6px);
            opacity: 0.35;
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pointer-events-auto { pointer-events: auto; }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.86)),
                radial-gradient(circle at top, rgba(250, 204, 21, 0.1), transparent 45%);
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 10px 30px rgba(2, 6, 23, 0.42),
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 0 1px rgba(15, 23, 42, 0.45);
            color: var(--text-main);
        }

        .toolbar-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.85rem 1rem;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            width: 100%;
            justify-content: flex-start;
            scrollbar-width: none; 
            -ms-overflow-style: none;
            background: linear-gradient(180deg, rgba(10, 14, 33, 0), rgba(10, 14, 33, 0.72));
        }
        .toolbar-scroll::-webkit-scrollbar { display: none; }

        .tool-btn {
            flex: 0 0 auto;
            transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease, filter 0.14s ease, opacity 0.14s ease;
            filter: grayscale(70%);
            opacity: 0.78;
            transform: scale(0.95);
            width: 5rem;
            height: 6rem;
            background:
                linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.95));
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid rgba(148, 163, 184, 0.28);
            color: var(--text-main);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 8px 18px rgba(2, 6, 23, 0.38);
        }
        .tool-btn::before {
            content: '';
            position: absolute;
            inset: 0.35rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(255,255,255,0.06);
            pointer-events: none;
        }
        .tool-btn.active {
            filter: grayscale(0%);
            opacity: 1;
            transform: translateY(-2px) scale(1.03);
            border-color: var(--theme-color);
            background:
                linear-gradient(180deg, rgba(34, 197, 94, 0.22), rgba(15, 23, 42, 0.96)),
                linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.95));
            box-shadow:
                0 0 0 1px var(--panel-highlight),
                0 0 22px rgba(250, 204, 21, 0.25),
                0 10px 22px rgba(2, 6, 23, 0.46);
            z-index: 2;
        }
        .tool-btn:active { transform: scale(0.92); }
        
        .tool-btn.delete-mode {
            background:
                linear-gradient(180deg, rgba(127, 29, 29, 0.88), rgba(15, 23, 42, 0.96));
            color: #ffe2e2;
        }
        .tool-btn.delete-mode.active {
            border-color: #f87171;
            box-shadow:
                0 0 0 1px rgba(248, 113, 113, 0.24),
                0 0 20px var(--danger-glow),
                0 10px 22px rgba(2, 6, 23, 0.46);
        }

        .cost-tag {
            font-size: 10px;
            font-weight: 700;
            color: #6ee7b7;
            line-height: 1.1;
            text-align: center;
            margin-top: 4px;
            letter-spacing: 0.04em;
        }
        .cost-mat { color: #cbd5e1; }
        .cost-del { color: #fecaca; }

        .btn-primary {
            background: linear-gradient(180deg, #fde047, #f59e0b);
            border: 2px solid rgba(255,255,255,0.28);
            border-bottom: 4px solid #b45309;
            color: #2f1700;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            box-shadow:
                0 10px 20px rgba(245, 158, 11, 0.28),
                inset 0 1px 0 rgba(255,255,255,0.4);
            font-family: var(--font-display);
            letter-spacing: 0.06em;
        }
        .btn-primary:active {
            transform: translateY(4px);
            border-bottom-width: 0px;
            margin-top: 4px;
        }

        .cam-btn {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            border-radius: 9999px;
            background:
                linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.94));
            border: 1px solid rgba(125, 211, 252, 0.35);
            box-shadow:
                0 0 16px rgba(14, 165, 233, 0.18),
                0 4px 12px rgba(2,6,23,0.35);
            color: var(--text-main);
            transition: transform 0.1s, box-shadow 0.1s;
            pointer-events: auto;
        }
        .cam-btn:active { transform: scale(0.9); box-shadow: 0 0 18px rgba(250, 204, 21, 0.25); }

        .title-arcade {
            font-family: var(--font-display);
            letter-spacing: 0.05em;
            text-shadow:
                0 2px 0 rgba(15, 23, 42, 0.65),
                0 0 18px rgba(56, 189, 248, 0.3);
        }

        .hud-pill {
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.14);
        }

        .instruction-card {
            background: rgba(15, 23, 42, 0.84);
            border: 1px solid rgba(148, 163, 184, 0.22);
            color: var(--text-soft);
        }

        .instruction-card b {
            color: #fde68a;
            font-weight: 700;
        }

        .hud-mono,
        .tool-btn,
        .cost-tag,
        .instruction-card,
        #hud-money,
        #hud-mats,
        .status-chip {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .feedback-gif {
            position: fixed;
            right: 0.85rem;
            bottom: calc(8.5rem + env(safe-area-inset-bottom));
            width: min(34vw, 8.25rem);
            max-width: 132px;
            border-radius: 1rem;
            border: 2px solid rgba(125, 211, 252, 0.45);
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.45);
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 25;
            background: rgba(15, 23, 42, 0.75);
        }

        .feedback-gif.visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .status-chip {
            position: fixed;
            left: 50%;
            top: calc(5.2rem + env(safe-area-inset-top));
            transform: translateX(-50%) translateY(-10px);
            padding: 0.5rem 0.9rem;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.28);
            box-shadow: 0 8px 20px rgba(2, 6, 23, 0.35);
            color: var(--text-main);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
            z-index: 24;
            white-space: nowrap;
        }

        .status-chip.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>

    <!-- Config Protocol -->
    <script id="game-config" type="application/x-game-config">
    {
        "startMoney": { "type": "number", "label": "Start Money", "value": 100, "min": 50, "max": 5000 },
        "themeColor": { "type": "color", "label": "UI Accent", "value": "#facc15" },
        "gameTitle": { "type": "text", "label": "City Name", "value": "IsoCity" }
    }
    </script>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: loop/build/collect/error -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM" loop preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3"></audio>
<audio id="sfx_build" data-editable="audio" data-label="Build SFX" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"></audio>
<audio id="sfx_harvest" data-editable="audio" data-label="Coin SFX" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3"></audio>
<audio id="sfx_error" data-editable="audio" data-label="Error SFX" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"></audio>
<audio id="sfx_delete" data-editable="audio" data-label="Delete SFX" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="UI SFX" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"></audio>

<canvas id="game-layer"></canvas>

<div id="ui-layer">
    <!-- HUD Top -->
    <div class="w-full p-4 pt-8 flex justify-between items-start safe-area-top pointer-events-none">
        <!-- Stats -->
        <div class="flex gap-2">
            <div class="glass-panel hud-pill rounded-full px-4 py-2 flex items-center gap-2 pointer-events-auto">
                <span class="text-xl">💰</span>
                <span id="hud-money" class="text-xl font-bold text-emerald-600">$100</span>
            </div>
            <div class="glass-panel hud-pill rounded-full px-4 py-2 flex items-center gap-2 pointer-events-auto">
                <span class="text-xl">⚙️</span>
                <span id="hud-mats" class="text-xl font-bold text-slate-600">0</span>
            </div>
        </div>

        <!-- Camera Controls -->
        <div class="flex flex-col gap-2">
            <button id="btn-zoom-in" class="cam-btn glass-panel">➕</button>
            <button id="btn-zoom-out" class="cam-btn glass-panel">➖</button>
            <button id="btn-recenter" class="cam-btn glass-panel text-blue-500">🎯</button>
        </div>
    </div>

    <!-- Dynamic Toolbar -->
    <div id="toolbar-container" class="toolbar-scroll pointer-events-auto">
        <!-- Buttons injected by JS -->
    </div>

    <!-- [agent-note][stage3] resolved-gif: build celebration + failed action -> catalogs/gifs.json -->
    <img id="feedback-build" class="feedback-gif" alt="Build celebration reaction" src="https://i.giphy.com/YUacjDxhp6cYteVMVf.webp">
    <img id="feedback-error" class="feedback-gif" alt="Budget warning reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
    <div id="status-chip" class="status-chip">District online</div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center z-50 pointer-events-auto transition-opacity duration-300">
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full text-center animate-float border-2 border-sky-300/50">
            <h1 id="title-display" class="title-arcade text-4xl text-sky-100 mb-2">Skyblock Borough</h1>
            <h2 class="text-sm font-bold text-amber-300 uppercase tracking-widest mb-6">Seed Budget: $100</h2>
            
            <div class="text-left rounded-xl p-4 mb-6 space-y-2 text-sm max-h-60 overflow-y-auto instruction-card">
                <p class="text-center text-xs text-sky-200 mb-2 uppercase tracking-[0.18em]">Launch a neon cloud district</p>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="instruction-card p-2 rounded shadow-sm">🖱️ <b>Wheel</b><br>Zoom In/Out</div>
                    <div class="instruction-card p-2 rounded shadow-sm">🤏 <b>Pinch</b><br>Touch Zoom</div>
                    <div class="instruction-card p-2 rounded shadow-sm">🏠 <b>Build</b><br>Expand Blocks</div>
                    <div class="instruction-card p-2 rounded shadow-sm">💰 <b>Collect</b><br>Bank Income</div>
                </div>
            </div>

            <button id="btn-start" class="btn-primary w-full py-4 rounded-xl text-xl uppercase tracking-wide">
                Launch District
            </button>
        </div>
    </div>
</div>

<script>
// --- CONFIGURATION & DATA ---
const BUILDINGS = {
    // Tools
    bulldoze:   { icon: '🗑️', name: 'Delete', cost: 0, mat: 0, type: 'tool', special: 'delete' },
    
    // Basics
    road:       { icon: '🛣️', name: 'Road', cost: 5, mat: 0, type: 'infra' },
    smithy:     { icon: '⚒️', name: 'Smithy', cost: 50, mat: 0, type: 'industry', income: 2, rate: 3, buildTime: 4 },
    garden:     { icon: '🌻', name: 'Garden', cost: 20, mat: 0, type: 'farm', harvest: 15, growTime: 3 },
    
    // Residential
    house:      { icon: '🏠', name: 'House', cost: 50, mat: 2, type: 'active', income: 5, rate: 5, buildTime: 3 },
    apartment:  { icon: '🏢', name: 'Apt.', cost: 120, mat: 8, type: 'active', income: 15, rate: 6, buildTime: 5 },
    
    // Commercial
    cafe:       { icon: '☕', name: 'Cafe', cost: 80, mat: 4, type: 'active', income: 10, rate: 4, buildTime: 4 },
    shop:       { icon: '🏪', name: 'Shop', cost: 150, mat: 5, type: 'active', income: 18, rate: 7, buildTime: 6 },
    
    // Industrial
    warehouse:  { icon: '📦', name: 'Depot', cost: 150, mat: 0, type: 'industry', income: 3, rate: 5, buildTime: 4 },
    factory:    { icon: '🏭', name: 'Factory', cost: 350, mat: 0, type: 'industry', income: 6, rate: 6, buildTime: 8 },
    
    // Special
    park:       { icon: '🌳', name: 'Park', cost: 30, mat: 0, type: 'passive', income: 2, rate: 8 },
    windmill:   { icon: '🌬️', name: 'Wind', cost: 180, mat: 10, type: 'active', income: 12, rate: 5, buildTime: 4 },
    solar:      { icon: '☀️', name: 'Solar', cost: 220, mat: 15, type: 'active', income: 16, rate: 6, buildTime: 4 },
    casino:     { icon: '🎰', name: 'Casino', cost: 1500, mat: 60, type: 'active', income: 200, rate: 25, buildTime: 15 }
};

const COLORS = {
    bg: '#1e293b',
    grassTop: '#4ade80', grassSide: '#22c55e',
    soilTop: '#a97142',
    road: '#64748b',
    selection: 'rgba(255, 255, 255, 0.3)'
};

// --- STATE ---
const State = {
    money: 100, // Updated to 100 as requested
    materials: 0,
    grid: [],
    gridSize: 16,
    tileSize: 45,
    particles: [],
    floaters: [],
    entities: [],
    camera: { x: 0, y: 0, zoom: 1 },
    zoomMin: 0.3,
    zoomMax: 2.5,
    selectedTool: 'road',
    lastTime: 0,
    isPlaying: false,
    input: { 
        dragging: false, 
        lastX: 0, lastY: 0,
        pinchDist: 0
    },
    bgStars: [],
    feedbackTimer: 0,
    feedbackType: 'build',
    statusTimer: 0,
    statusLabel: 'District online'
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    bgm: null,
    sfx: {},
    init() {
        this.bgm = document.getElementById('bgm_main');
        this.bgm.volume = 0.2;
        this.bgm.play().catch(() => {}); 
        
        ['sfx_build', 'sfx_harvest', 'sfx_error', 'sfx_delete', 'sfx_ui'].forEach(id => {
            this.sfx[id] = document.getElementById(id);
            if (this.sfx[id]) this.sfx[id].volume = id === 'sfx_ui' ? 0.38 : 0.5;
        });
    },
    unlock() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.bgm.play().catch(() => {});
    },
    play(id, pitch=1) {
        if (!this.sfx[id]) return;
        const sound = this.sfx[id];
        if (!sound.paused) sound.pause();
        sound.currentTime = 0;
        sound.playbackRate = pitch;
        sound.play().catch(() => {});
    }
};

// --- INIT & CONFIG ---
window.gameConfig = {};
function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            window.gameConfigDefs = defs;
            for (let k in defs) window.gameConfig[k] = defs[k].value;
        } catch(e) { console.error("Config parse error", e); }
    }
    
    if (window.gameConfig.themeColor) {
        document.documentElement.style.setProperty('--theme-color', window.gameConfig.themeColor);
    }
    if (window.gameConfig.gameTitle) {
        document.getElementById('title-display').innerText = window.gameConfig.gameTitle;
        document.title = window.gameConfig.gameTitle;
    }
    if (window.gameConfig.startMoney !== undefined) {
        State.money = window.gameConfig.startMoney;
    }
}

function centerCamera() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;
    
    const isoW = State.gridSize * State.tileSize * 2;
    State.camera.zoom = Math.min((w * 1.1) / isoW, 1.5);
    
    // Center logic
    const cy = (State.gridSize * State.tileSize * State.camera.zoom) / 2;
    State.camera.x = w/2;
    State.camera.y = h/2 - cy;
}

function zoomTo(newZoom, cx, cy) {
    newZoom = Math.max(State.zoomMin, Math.min(newZoom, State.zoomMax));
    
    const scale = newZoom / State.camera.zoom;
    State.camera.x = cx - (cx - State.camera.x) * scale;
    State.camera.y = cy - (cy - State.camera.y) * scale;
    State.camera.zoom = newZoom;
}

function initGame() {
    parseConfig();
    
    // Init Grid
    State.grid = [];
    for (let x = 0; x < State.gridSize; x++) {
        State.grid[x] = [];
        for (let y = 0; y < State.gridSize; y++) {
            State.grid[x][y] = { type: 'grass', state: 'idle', timer: 0, animH: 0 };
        }
    }

    // Init Parallax Stars (2 Layers)
    State.bgStars = [];
    // Layer 1: Background (Slow, Small)
    for(let i=0; i<60; i++) {
        State.bgStars.push({
            x: Math.random() * 2000,
            y: Math.random() * 2000,
            r: Math.random() * 1.5 + 0.5,
            parallax: 0.05, // Slow movement
            color: `rgba(255,255,255,${Math.random()*0.2 + 0.1})`
        });
    }
    // Layer 2: Foreground (Faster, Larger)
    for(let i=0; i<30; i++) {
        State.bgStars.push({
            x: Math.random() * 2000,
            y: Math.random() * 2000,
            r: Math.random() * 2 + 1.5,
            parallax: 0.15, // Faster movement
            color: `rgba(255,255,255,${Math.random()*0.4 + 0.2})`
        });
    }

    // Generate Toolbar
    const container = document.getElementById('toolbar-container');
    container.innerHTML = '';
    
    const keys = Object.keys(BUILDINGS);
    
    keys.forEach(key => {
        const b = BUILDINGS[key];
        const btn = document.createElement('button');
        btn.className = 'tool-btn glass-panel';
        if (key === 'bulldoze') btn.classList.add('delete-mode');
        btn.id = `tool-${key}`;
        btn.onclick = () => selectTool(key);
        
        let costHtml = `<div class="cost-tag">$${b.cost}`;
        if (b.mat > 0) costHtml += `<br><span class="cost-mat">+${b.mat}⚙️</span>`;
        if (key === 'bulldoze') costHtml = `<div class="cost-tag cost-del">FREE</div>`;
        costHtml += `</div>`;

        btn.innerHTML = `
            <div class="text-2xl mb-1">${b.icon}</div>
            <div class="text-[10px] font-bold text-slate-800">${b.name}</div>
            ${costHtml}
        `;
        container.appendChild(btn);
    });

    const spacer = document.createElement('div');
    spacer.style.width = '20px';
    spacer.style.flex = '0 0 auto';
    container.appendChild(spacer);

    selectTool('road');
    updateHUD();
    resize();
    centerCamera();
}

function selectTool(key) {
    State.selectedTool = key;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`tool-${key}`);
    if(btn) btn.classList.add('active');
}

// --- LOGIC ---
function updateHUD() {
    document.getElementById('hud-money').innerText = `$${Math.floor(State.money)}`;
    document.getElementById('hud-mats').innerText = `${Math.floor(State.materials)}`;
    
    Object.keys(BUILDINGS).forEach(key => {
        const b = BUILDINGS[key];
        const btn = document.getElementById(`tool-${key}`);
        if(btn) {
            if (key === 'bulldoze') return;
            const canAfford = State.money >= b.cost && State.materials >= b.mat;
            btn.style.opacity = canAfford ? '1' : '0.4';
        }
    });
}

function spawnFloater(text, x, y, color) {
    State.floaters.push({ text, x, y, color, life: 1.5, vy: -40 });
}

function spawnParticles(x, y, color, count=5, type='spark') {
    for(let i=0; i<count; i++) {
        State.particles.push({
            x, y, color,
            vx: (Math.random()-0.5)*150,
            vy: (Math.random()-1)*150,
            life: 0.5 + Math.random()*0.5,
            type
        });
    }
}

function showFeedback(type, label='') {
    State.feedbackType = type;
    State.feedbackTimer = 1.4;
    if (label) {
        State.statusLabel = label;
        State.statusTimer = 1.15;
    }
}

function spawnEntity(type, gx, gy) {
    if(State.entities.length > 30) return;
    State.entities.push({
        type, x: gx, y: gy, tx: gx, ty: gy, t: 0,
        color: type === 'car' ? ['#ef4444','#3b82f6','#eab308'][Math.floor(Math.random()*3)] : '#fff',
        speed: type === 'car' ? 2 : 0.5
    });
}

function interact(gx, gy) {
    const cell = State.grid[gx][gy];
    const pos = getScreenPos(gx, gy);
    const tool = State.selectedTool;
    const info = BUILDINGS[tool];

    // Harvest Garden
    if (cell.type === 'garden' && cell.state === 'ready' && tool !== 'bulldoze') {
        State.money += BUILDINGS.garden.harvest;
        cell.state = 'growing';
        cell.timer = BUILDINGS.garden.growTime;
        cell.animH = -10;
        spawnFloater(`+$${BUILDINGS.garden.harvest}`, pos.x, pos.y-40, '#facc15');
        spawnParticles(pos.x, pos.y, '#facc15');
        AudioSys.play('sfx_harvest', 1.05);
        showFeedback('build', 'Harvest ready');
        updateHUD();
        return;
    }

    // Bulldozer
    if (tool === 'bulldoze') {
        if (cell.type !== 'grass') {
            cell.type = 'grass';
            cell.state = 'idle';
            cell.animH = 10;
            spawnParticles(pos.x, pos.y, '#ef4444', 8, 'debris');
            spawnFloater('Deleted', pos.x, pos.y-30, '#ef4444');
            AudioSys.play('sfx_delete', 0.92);
            showFeedback('error', 'Block cleared');
        }
        return;
    }

    // Build
    if (cell.type === 'grass' || (cell.type === 'road' && tool !== 'road')) {
        if (tool === 'road' && cell.type === 'road') return;
        
        if (State.money >= info.cost && State.materials >= info.mat) {
            State.money -= info.cost;
            State.materials -= info.mat;
            
            cell.type = tool;
            cell.animH = -20;
            
            if (info.buildTime) {
                cell.state = 'constructing';
                cell.timer = info.buildTime;
                spawnParticles(pos.x, pos.y, '#94a3b8');
            } else if (info.growTime) {
                cell.state = 'growing';
                cell.timer = info.growTime;
            } else {
                cell.state = 'active';
            }
            
            AudioSys.play('sfx_build', 0.98 + Math.random() * 0.08);
            showFeedback('build', `${info.name} deployed`);
            spawnFloater(`-$${info.cost}`, pos.x, pos.y-30, '#ef4444');
            updateHUD();
        } else {
             AudioSys.play('sfx_error', 0.95);
             showFeedback('error', 'Budget low');
             spawnFloater('Budget Low', pos.x, pos.y-30, '#94a3b8');
        }
    }
}

function update(dt) {
    if (!State.isPlaying) return;

    // Grid Logic
    for(let x=0; x<State.gridSize; x++) {
        for(let y=0; y<State.gridSize; y++) {
            const cell = State.grid[x][y];
            const info = BUILDINGS[cell.type];
            
            cell.animH += (0 - cell.animH) * 10 * dt;

            if (!info) continue;

            if (cell.state === 'constructing') {
                cell.timer -= dt;
                if (cell.timer <= 0) {
                    cell.state = 'active';
                    cell.animH = -15;
                    cell.timer = 0; 
                    spawnParticles(getScreenPos(x,y).x, getScreenPos(x,y).y, '#3b82f6');
                }
            }
            else if (cell.type === 'garden' && cell.state === 'growing') {
                cell.timer -= dt;
                if (cell.timer <= 0) {
                    cell.state = 'ready';
                    cell.animH = -5;
                }
            }
            else if (cell.state === 'active' && (info.type === 'active' || info.type === 'industry' || info.type === 'passive')) {
                cell.timer += dt;
                
                if (Math.random() < 0.002) {
                    if (cell.type === 'road') spawnEntity('car', x, y);
                    else if (['house','apartment','shop'].includes(cell.type)) spawnEntity('ped', x, y);
                }

                if (cell.timer >= info.rate) {
                    cell.timer = 0;
                    const pos = getScreenPos(x,y);
                    if (info.type === 'industry') {
                        State.materials += info.income;
                        spawnFloater(`+${info.income}⚙️`, pos.x, pos.y-50, '#94a3b8');
                    } else {
                        State.money += info.income;
                        spawnFloater(`+$${info.income}`, pos.x, pos.y-50, '#4ade80');
                    }
                    updateHUD();
                }
            }
        }
    }

    // Entities
    for(let i=State.entities.length-1; i>=0; i--) {
        const e = State.entities[i];
        e.t += dt * e.speed;
        if (e.t >= 1) {
            e.x = e.tx; e.y = e.ty; e.t = 0;
            const n = [
                {x:e.x+1,y:e.y}, {x:e.x-1,y:e.y}, {x:e.x,y:e.y+1}, {x:e.x,y:e.y-1}
            ].filter(p => p.x>=0 && p.x<State.gridSize && p.y>=0 && p.y<State.gridSize);
            
            const valid = n.filter(p => {
                const type = State.grid[p.x][p.y].type;
                return e.type === 'car' ? type === 'road' : (type === 'road' || type === 'grass');
            });

            if (valid.length) {
                const next = valid[Math.floor(Math.random()*valid.length)];
                e.tx = next.x; e.ty = next.y;
            }
            if (Math.random() < 0.05) State.entities.splice(i, 1);
        }
    }

    State.feedbackTimer = Math.max(0, State.feedbackTimer - dt);
    State.statusTimer = Math.max(0, State.statusTimer - dt);

    // Particles
    for(let i=State.particles.length-1; i>=0; i--) {
        const p = State.particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) State.particles.splice(i, 1);
    }
    
    // Floaters
    for(let i=State.floaters.length-1; i>=0; i--) {
        const f = State.floaters[i];
        f.y += f.vy * dt; f.life -= dt;
        if (f.life <= 0) State.floaters.splice(i, 1);
    }
}

// --- RENDERER ---
const canvas = document.getElementById('game-layer');
const ctx = canvas.getContext('2d', { alpha: false });
// [agent-note][stage1] role: future-illustration | element: title-display | intent: establish floating-city identity

function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);
    R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
    const RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
    const GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
    const BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
    return "#"+RR+GG+BB;
}

function drawIsoBlock(x, y, cTop, cSide, h) {
    const z = State.camera.zoom;
    const w = State.tileSize * 2 * z;
    const hh = State.tileSize * z;
    const hOff = h * z;

    ctx.beginPath();
    ctx.moveTo(x, y - hOff);
    ctx.lineTo(x + w/2, y + hh/2 - hOff);
    ctx.lineTo(x, y + hh - hOff);
    ctx.lineTo(x - w/2, y + hh/2 - hOff);
    ctx.closePath();
    ctx.fillStyle = cTop;
    ctx.fill();

    if (h > 0) {
        ctx.beginPath();
        ctx.moveTo(x + w/2, y + hh/2 - hOff);
        ctx.lineTo(x, y + hh - hOff);
        ctx.lineTo(x, y + hh - hOff + hOff);
        ctx.lineTo(x + w/2, y + hh/2 - hOff + hOff);
        ctx.closePath();
        ctx.fillStyle = cSide;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x - w/2, y + hh/2 - hOff);
        ctx.lineTo(x, y + hh - hOff);
        ctx.lineTo(x, y + hh - hOff + hOff);
        ctx.lineTo(x - w/2, y + hh/2 - hOff + hOff);
        ctx.closePath();
        ctx.fillStyle = shadeColor(cSide, -20);
        ctx.fill();
    }
}

function drawBuilding(x, y, type, animH, state, timer) {
    const z = State.camera.zoom;
    
    if (state === 'constructing') {
        const info = BUILDINGS[type];
        const p = 1 - (timer / info.buildTime);
        const h = 10 + (30 * p);
        drawIsoBlock(x, y, '#e2e8f0', '#94a3b8', h + animH);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x - 10*z, y - (h+animH)*z - 10*z, 20*z*p, 4*z);
        return;
    }

    const block = (c, h, lift=0) => {
        drawIsoBlock(x, y - lift*z, c, shadeColor(c, -10), h);
    };

    switch(type) {
        case 'house':
            block('#f1f5f9', 20, 0);
            block('#f97316', 10, 20);
            break;
        case 'apartment':
            block('#cbd5e1', 60, 0);
            block('#64748b', 5, 60);
            break;
        case 'smithy': 
            block('#475569', 25, 0);
            block('#1e293b', 10, 25);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(x+5*z, y-30*z, 6*z, 6*z);
            if (Math.random() < 0.2) spawnParticles(x+8*z, y-40*z, '#94a3b8', 1, 'smoke');
            break;
        case 'cafe':
            block('#fce7f3', 25, 0);
            block('#db2777', 5, 25);
            break;
        case 'shop':
            block('#e0f2fe', 30, 0);
            block('#0ea5e9', 8, 30);
            break;
        case 'warehouse':
            block('#78350f', 25, 0);
            break;
        case 'factory':
            block('#334155', 40, 0);
            if(Math.random() < 0.1) spawnParticles(x, y-60*z, '#94a3b8', 1, 'smoke');
            break;
        case 'park':
            block('#22c55e', 5, 0);
            ctx.fillStyle = '#166534';
            ctx.beginPath(); ctx.arc(x, y-15*z, 10*z, 0, Math.PI*2); ctx.fill();
            break;
        case 'windmill':
            block('#fff7ed', 40, 0);
            const ang = Date.now() / 500;
            ctx.save();
            ctx.translate(x, y - 50*z);
            ctx.rotate(ang);
            ctx.fillStyle = '#9ca3af';
            ctx.fillRect(-20*z, -2*z, 40*z, 4*z);
            ctx.fillRect(-2*z, -20*z, 4*z, 40*z);
            ctx.restore();
            break;
        case 'solar':
            block('#1e3a8a', 5, 0);
            break;
        case 'casino':
            block('#4c1d95', 60, 0);
            block('#d8b4fe', 10, 60);
            if(Math.random()<0.05) spawnParticles(x, y-80*z, '#facc15', 2);
            break;
    }
}

function render() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Parallax Stars (2 Layers)
    ctx.save();
    State.bgStars.forEach(s => {
        // Apply parallax factor
        let dx = (s.x - State.camera.x * s.parallax) % 2000;
        let dy = (s.y - State.camera.y * s.parallax) % 2000;
        if (dx < 0) dx += 2000;
        if (dy < 0) dy += 2000;
        
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(dx, dy, s.r, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.restore();

    // Grid
    const z = State.camera.zoom;
    const margin = 300 * z;
    const vw = canvas.width / window.devicePixelRatio;
    const vh = canvas.height / window.devicePixelRatio;

    for (let d = 0; d < State.gridSize * 2; d++) {
        for (let x = 0; x < State.gridSize; x++) {
            let y = d - x;
            if (y >= 0 && y < State.gridSize) {
                const cell = State.grid[x][y];
                const pos = getScreenPos(x, y);
                
                if (pos.x < -margin || pos.x > vw + margin ||
                    pos.y < -margin || pos.y > vh + margin) continue;

                if (cell.type === 'road') {
                    drawIsoBlock(pos.x, pos.y, COLORS.road, shadeColor(COLORS.road, -20), 1);
                } else if (cell.type === 'grass') {
                    drawIsoBlock(pos.x, pos.y, COLORS.grassTop, COLORS.grassSide, 0);
                } else {
                    drawIsoBlock(pos.x, pos.y, COLORS.soilTop, '#78350f', 2);
                }

                if (cell.type !== 'grass' && cell.type !== 'road') {
                    if (cell.type === 'garden') {
                        const h = 4 + Math.abs(cell.animH);
                        drawIsoBlock(pos.x, pos.y, COLORS.soilTop, '#78350f', h);
                        if (cell.state === 'growing') {
                            ctx.fillStyle = '#4ade80';
                            ctx.beginPath(); ctx.arc(pos.x, pos.y - h*z, 5*z, 0, Math.PI*2); ctx.fill();
                        } else if (cell.state === 'ready') {
                            ctx.fillStyle = '#f97316';
                            const bounce = Math.sin(Date.now()/200)*3;
                            ctx.beginPath(); ctx.arc(pos.x, pos.y - h*z - bounce, 8*z, 0, Math.PI*2); ctx.fill();
                        }
                    } else {
                        drawBuilding(pos.x, pos.y, cell.type, Math.abs(cell.animH), cell.state, cell.timer);
                    }
                }

                State.entities.forEach(e => {
                    const lx = e.x + (e.tx - e.x) * e.t;
                    const ly = e.y + (e.ty - e.y) * e.t;
                    if (Math.round(lx) === x && Math.round(ly) === y) {
                        const ep = getScreenPos(lx, ly);
                        if (e.type === 'car') {
                            drawIsoBlock(ep.x, ep.y, e.color, '#1e293b', 6);
                        } else {
                            ctx.fillStyle = e.color;
                            ctx.beginPath(); ctx.arc(ep.x, ep.y - 10*z, 4*z, 0, Math.PI*2); ctx.fill();
                        }
                    }
                });
            }
        }
    }

    // FX
    State.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, (p.type==='smoke'?6:4)*z, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });

    ctx.font = `bold ${16*z}px Orbitron, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    State.floaters.forEach(f => {
        ctx.fillStyle = f.color;
        ctx.globalAlpha = f.life;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
    });
}

function getScreenPos(gx, gy) {
    const z = State.camera.zoom;
    const tileW = State.tileSize * 2 * z;
    const tileH = State.tileSize * z;
    return {
        x: (gx - gy) * (tileW / 2) + State.camera.x,
        y: (gx + gy) * (tileH / 2) + State.camera.y
    };
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// --- INPUT ---
const evCache = [];
let prevDiff = -1;

function handleStart(e) {
    if (e.target.closest('.pointer-events-auto')) return;
    evCache.push(e);
    
    if (evCache.length === 1) {
        State.input.dragging = false;
        State.input.lastX = e.clientX;
        State.input.lastY = e.clientY;
    }
    
    AudioSys.unlock();
}

function handleMove(e) {
    const index = evCache.findIndex(ev => ev.pointerId === e.pointerId);
    if (index >= 0) evCache[index] = e;

    if (evCache.length === 2) {
        // Pinch Zoom
        const curDiff = Math.hypot(evCache[0].clientX - evCache[1].clientX, evCache[0].clientY - evCache[1].clientY);
        
        if (prevDiff > 0) {
            const delta = curDiff - prevDiff;
            const cx = (evCache[0].clientX + evCache[1].clientX) / 2;
            const cy = (evCache[0].clientY + evCache[1].clientY) / 2;
            
            const zoomSpeed = 0.005 * State.camera.zoom; 
            zoomTo(State.camera.zoom + delta * zoomSpeed, cx, cy);
        }
        prevDiff = curDiff;
        State.input.dragging = true; 
    } else if (evCache.length === 1) {
        // Pan
        const dx = e.clientX - State.input.lastX;
        const dy = e.clientY - State.input.lastY;
        
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
            State.input.dragging = true;
            State.camera.x += dx;
            State.camera.y += dy;
            State.input.lastX = e.clientX;
            State.input.lastY = e.clientY;
        }
    }
}

function handleEnd(e) {
    const index = evCache.findIndex(ev => ev.pointerId === e.pointerId);
    if (index >= 0) evCache.splice(index, 1);
    
    if (evCache.length < 2) prevDiff = -1;
    
    if (!State.input.dragging && evCache.length === 0) {
        const z = State.camera.zoom;
        const tileW = State.tileSize * 2 * z;
        const tileH = State.tileSize * z;
        const adjX = e.clientX - State.camera.x;
        const adjY = e.clientY - State.camera.y;
        
        const gy = Math.floor((adjY / tileH - adjX / tileW));
        const gx = Math.floor((adjY / tileH + adjX / tileW));

        if (gx >= 0 && gx < State.gridSize && gy >= 0 && gy < State.gridSize) {
            interact(gx, gy);
        }
    }
    
    if (evCache.length === 0) {
        State.input.dragging = false;
    }
}

function handleWheel(e) {
    e.preventDefault();
    const zoomSpeed = -0.001 * e.deltaY * State.camera.zoom;
    zoomTo(State.camera.zoom + zoomSpeed, e.clientX, e.clientY);
}

// --- BOOT ---
window.addEventListener('DOMContentLoaded', () => {
    AudioSys.init();
    initGame();
    
    window.addEventListener('resize', () => {
        resize();
        if (!State.isPlaying) centerCamera();
    });
    
    // UI Buttons
    const statusChip = document.getElementById('status-chip');
    const feedbackBuild = document.getElementById('feedback-build');
    const feedbackError = document.getElementById('feedback-error');

    function syncFeedbackUi() {
        const isBuild = State.feedbackType === 'build';
        feedbackBuild.classList.toggle('visible', State.feedbackTimer > 0 && isBuild);
        feedbackError.classList.toggle('visible', State.feedbackTimer > 0 && !isBuild);
        statusChip.textContent = State.statusLabel;
        statusChip.classList.toggle('visible', State.statusTimer > 0);
    }

    document.getElementById('btn-recenter').addEventListener('click', () => {
        centerCamera();
        AudioSys.play('sfx_ui', 1);
        showFeedback('build', 'Camera centered');
        syncFeedbackUi();
    });
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
        zoomTo(State.camera.zoom * 1.2, window.innerWidth/2, window.innerHeight/2);
        AudioSys.play('sfx_ui', 1.06);
        showFeedback('build', 'Zoom in');
        syncFeedbackUi();
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
        zoomTo(State.camera.zoom / 1.2, window.innerWidth/2, window.innerHeight/2);
        AudioSys.play('sfx_ui', 0.94);
        showFeedback('build', 'Zoom out');
        syncFeedbackUi();
    });

    // Input Events
    canvas.addEventListener('pointerdown', handleStart);
    window.addEventListener('pointermove', handleMove);
    window.addEventListener('pointerup', handleEnd);
    window.addEventListener('pointercancel', handleEnd);
    canvas.addEventListener('wheel', handleWheel, { passive: false });
    
    document.getElementById('btn-start').addEventListener('click', () => {
        State.isPlaying = true;
        AudioSys.unlock();
        AudioSys.play('sfx_ui', 1);
        showFeedback('build', 'District launched');
        centerCamera();
        syncFeedbackUi();
        const sc = document.getElementById('start-screen');
        sc.style.opacity = 0;
        setTimeout(() => sc.style.display = 'none', 300);
    });

    function loop(t) {
        try {
            const dt = Math.min((t - State.lastTime)/1000, 0.1);
            State.lastTime = t;
            update(dt);
            render();
            syncFeedbackUi();
            requestAnimationFrame(loop);
        } catch(e) { console.error(e); }
    }
    requestAnimationFrame(loop);
});

window.updateGameConfig = (k, v) => {
    if (window.gameConfigDefs[k]) {
        if (window.gameConfigDefs[k].type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(v)) return;
        window.gameConfig[k] = v;
        if (k === 'themeColor') document.documentElement.style.setProperty('--theme-color', v);
        if (k === 'gameTitle') {
            document.getElementById('title-display').innerText = v;
            document.title = v;
        }
    }
};
