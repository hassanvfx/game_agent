<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Sprint: Stay Online</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap');

        :root {
            --bg-dark: #08111f;
            --bg-deep: #050914;
            --panel-bg: rgba(8, 17, 31, 0.78);
            --panel-border: rgba(114, 247, 255, 0.22);
            --text-white: #f7fbff;
            --text-gray-300: #d7def3;
            --text-gray-400: #8fa0c2;
            --text-yellow-400: #ffe66d;
            --red-500: #ff5f7d;
            --slate-900: #08111f;
            --cyan-300: #72f7ff;
            --cyan-500: #00d6ff;
            --cyan-700: #0084ff;
            --violet-500: #865dff;
            --magenta-500: #ff5fd2;
            --blue-500: rgba(0, 214, 255, 0.18);
            --hero-core: #7af7ff;
            --hero-shell: #19b4ff;
            --hero-accent: #ffef88;
            --enemy-glow: #ff5fd2;
            --platform-top: #72f7ff;
            --platform-fill: #132846;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 18%, rgba(0, 214, 255, 0.2), transparent 28%),
                radial-gradient(circle at 80% 14%, rgba(134, 93, 255, 0.18), transparent 24%),
                linear-gradient(180deg, #0b1730 0%, var(--bg-dark) 42%, var(--bg-deep) 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hidden { display: none !important; }
        .w-full { width: 100%; }
        .h-24 { height: 6rem; }
        .flex { display: flex; }
        .flex-1 { flex: 1 1 0%; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .mt-auto { margin-top: auto; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-12 { margin-bottom: 3rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pb-12 { padding-bottom: max(3rem, env(safe-area-inset-bottom)); }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .text-center { text-align: center; }
        .leading-relaxed { line-height: 1.625; }
        .max-w-xs { max-width: 20rem; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: 3rem; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .font-mono { font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }
        .tracking-wide { letter-spacing: 0.05em; }
        .tracking-wider { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .text-white { color: var(--text-white); }
        .text-gray-300 { color: var(--text-gray-300); }
        .text-gray-400 { color: var(--text-gray-400); }
        .text-yellow-400 { color: var(--text-yellow-400); }
        .bg-white { background: #ffffff; }
        .bg-slate-900\/90 { background: rgba(15, 23, 42, 0.9); }
        .bg-slate-900\/95 { background: rgba(15, 23, 42, 0.95); }
        .rounded-full { border-radius: 9999px; }
        .shadow-lg { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); }
        .transition { transition: all 0.15s ease; }
        .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .w-3 { width: 0.75rem; }
        .h-3 { height: 0.75rem; }
        .bg-red-500 { background: var(--red-500); }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(12, 27, 50, 0.94), rgba(7, 16, 30, 0.82));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 10px 30px rgba(0, 0, 0, 0.45),
                0 0 18px rgba(0, 214, 255, 0.12);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff7f5f 0%, #ff3ca6 48%, #865dff 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 9999px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.08) inset,
                0 0 24px rgba(255, 95, 210, 0.34);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            cursor: pointer;
        }

        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 0 12px rgba(255, 95, 210, 0.24);
            filter: brightness(1.1);
        }

        .control-pad {
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(19, 40, 70, 0.9), rgba(10, 19, 35, 0.92));
            border: 2px solid rgba(114, 247, 255, 0.22);
            border-radius: 24px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            transition: background 0.1s, transform 0.1s, border-color 0.1s, box-shadow 0.1s;
        }

        .control-pad:active,
        .control-pad.active {
            background: linear-gradient(180deg, rgba(31, 61, 104, 0.95), rgba(18, 30, 56, 0.96));
            transform: scale(0.96);
            border-color: rgba(255, 255, 255, 0.48);
            box-shadow: 0 0 18px rgba(114, 247, 255, 0.2);
        }

        .control-pad::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(114, 247, 255, 0.14), transparent 60%);
            pointer-events: none;
        }

        .accent-move {
            background: linear-gradient(180deg, rgba(19, 55, 93, 0.94), rgba(8, 27, 50, 0.96));
            border-color: rgba(0, 214, 255, 0.42);
        }

        .hero-glow {
            position: absolute;
            inset: -1.4rem -1.2rem;
            background:
                radial-gradient(circle at center, rgba(122, 247, 255, 0.3), transparent 42%),
                radial-gradient(circle at 50% 55%, rgba(255, 95, 210, 0.22), transparent 55%);
            filter: blur(28px);
            border-radius: 9999px;
            animation: pulse-glow 2.2s infinite;
        }

        .hero-title {
            position: relative;
            margin: 0;
            font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 400;
            line-height: 0.9;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-shadow: 0 0 24px rgba(114, 247, 255, 0.16);
            background: linear-gradient(90deg, var(--cyan-300), #ffffff 45%, var(--magenta-500));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-subtitle {
            margin: 0.8rem 0 0;
            color: var(--text-gray-300);
            text-align: center;
            font-size: 0.88rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .gif-badge {
            position: absolute;
            width: min(26vw, 8rem);
            aspect-ratio: 1;
            border-radius: 1.4rem;
            overflow: hidden;
            border: 1px solid rgba(114, 247, 255, 0.18);
            background: rgba(5, 16, 30, 0.78);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .gif-badge.active {
            opacity: 0.92;
            transform: scale(1);
        }

        .gif-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gif-badge-success {
            top: max(5rem, env(safe-area-inset-top) + 3.5rem);
            right: 1rem;
        }

        .gif-badge-fail {
            left: 1rem;
            bottom: calc(7.75rem + env(safe-area-inset-bottom));
        }

        .signal-shell {
            position: relative;
            width: 7rem;
            height: 7rem;
            margin: 0 auto 1.25rem;
            border-radius: 2rem;
            border: 1px solid rgba(114, 247, 255, 0.28);
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), transparent 18%),
                linear-gradient(180deg, rgba(20, 48, 83, 0.92), rgba(8, 17, 31, 0.96));
            box-shadow:
                0 0 30px rgba(0, 214, 255, 0.18),
                inset 0 0 26px rgba(255, 255, 255, 0.04);
        }

        .signal-face {
            position: absolute;
            inset: 1rem;
            border-radius: 1.5rem;
            background:
                radial-gradient(circle at 50% 30%, rgba(122, 247, 255, 0.24), transparent 36%),
                linear-gradient(180deg, rgba(13, 36, 66, 0.95), rgba(5, 16, 30, 1));
        }

        .signal-eye {
            position: absolute;
            top: 2rem;
            width: 0.9rem;
            height: 1.1rem;
            border-radius: 999px;
            background: var(--hero-accent);
            box-shadow: 0 0 12px rgba(255, 238, 136, 0.5);
            animation: blink-eye 3.4s infinite;
        }

        .signal-eye.left { left: 2rem; }
        .signal-eye.right { right: 2rem; }

        .signal-mouth {
            position: absolute;
            left: 50%;
            bottom: 1.45rem;
            width: 2.15rem;
            height: 0.8rem;
            border: 3px solid var(--hero-core);
            border-top: none;
            border-radius: 0 0 1rem 1rem;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(122, 247, 255, 0.24);
        }

        .signal-antenna {
            position: absolute;
            left: 50%;
            top: -1rem;
            width: 0.35rem;
            height: 1.4rem;
            transform: translateX(-50%);
            background: linear-gradient(180deg, rgba(255,255,255,0.88), var(--hero-shell));
            border-radius: 999px;
        }

        .signal-antenna::after {
            content: '';
            position: absolute;
            left: 50%;
            top: -0.45rem;
            width: 0.9rem;
            height: 0.9rem;
            transform: translateX(-50%);
            border-radius: 999px;
            background: var(--hero-accent);
            box-shadow: 0 0 18px rgba(255, 238, 136, 0.42);
        }

        .signal-rings {
            position: absolute;
            inset: -0.8rem;
            border-radius: 2.4rem;
            border: 1px solid rgba(114, 247, 255, 0.12);
        }

        .signal-rings::before,
        .signal-rings::after {
            content: '';
            position: absolute;
            inset: -0.55rem;
            border-radius: 2.7rem;
            border: 1px solid rgba(114, 247, 255, 0.12);
            animation: pulse-ring 2.2s infinite;
        }

        .signal-rings::after {
            inset: -1.1rem;
            animation-delay: 0.7s;
        }

        .live-badge {
            animation: pulse-red 2s infinite;
            box-shadow: 0 0 12px rgba(255, 95, 125, 0.45);
        }

        .status-pill {
            min-width: 4rem;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes pulse-glow {
            0% { opacity: 0.65; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.03); }
            100% { opacity: 0.65; transform: scale(0.98); }
        }

        @keyframes blink-eye {
            0%, 44%, 48%, 100% { transform: scaleY(1); }
            46% { transform: scaleY(0.18); }
        }

        @keyframes pulse-ring {
            0% { opacity: 0.2; transform: scale(0.98); }
            50% { opacity: 0.48; transform: scale(1.02); }
            100% { opacity: 0.2; transform: scale(0.98); }
        }

        @media (max-width: 640px) {
            .text-4xl { font-size: 1.875rem; }
            .text-xl { font-size: 1.1rem; }
            .hero-title { letter-spacing: 0.04em; }
            .signal-shell {
                width: 5.8rem;
                height: 5.8rem;
                margin-bottom: 1rem;
            }
            .hero-subtitle {
                font-size: 0.74rem;
                letter-spacing: 0.24em;
            }

            .gif-badge {
                width: min(24vw, 5.5rem);
                border-radius: 1rem;
            }

            .gif-badge-fail {
                bottom: calc(7rem + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="ui-layer">

        <div id="hud" class="hidden w-full p-4 pt-safe flex justify-between items-center">
            <div class="glass-panel status-pill px-4 py-2 rounded-full flex items-center gap-3">
                <div class="w-3 h-3 bg-red-500 rounded-full live-badge"></div>
                <span class="text-white font-bold tracking-wider text-sm">ONLINE</span>
            </div>
            <div class="glass-panel px-4 py-2 rounded-full flex items-center gap-2">
                <span class="text-gray-400 text-xs uppercase font-bold">Signal</span>
                <span id="score-display" class="text-white font-bold text-lg font-mono">0</span>
            </div>
        </div>

        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 z-50 interactive">
            <div class="mb-8 relative">
                <div class="hero-glow"></div>
                <div class="signal-shell" aria-hidden="true">
                    <div class="signal-rings"></div>
                    <div class="signal-antenna"></div>
                    <div class="signal-face">
                        <div class="signal-eye left"></div>
                        <div class="signal-eye right"></div>
                        <div class="signal-mouth"></div>
                    </div>
                </div>
                <h1 class="hero-title">
                    SIGNAL<br>SPRINT
                </h1>
                <p class="hero-subtitle">Courier Core Online</p>
            </div>
            <p class="text-gray-400 mb-12 text-center max-w-xs leading-relaxed">
                Hold <span class="text-white font-bold">BOOST</span> to move.<br>
                Tap <span class="text-white font-bold">JUMP</span> to clear the gaps.
            </p>
            <button id="btn-start" class="btn-primary py-6 px-12 text-2xl w-full" style="max-width: 16rem;">
                Stay Online
            </button>
            <!-- [agent-note][stage1] role: future-audio | trigger: score-rise | intent: reinforce signal gain -->
        </div>

        <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-slate-900/95 z-50 interactive backdrop-blur-sm">
            <h2 class="text-4xl font-bold text-white mb-2" style="font-family:'Orbitron', 'Exo 2', sans-serif;">SIGNAL LOST</h2>
            <div class="text-xl text-gray-300 mb-8">
                Best Signal: <span id="final-score" class="text-yellow-400 font-bold">0</span>
            </div>
            <button id="btn-restart" class="bg-white text-xl font-bold py-4 px-10 rounded-full shadow-lg transition uppercase tracking-wide" style="border:none; cursor:pointer; color:#0f172a; font-family:'Orbitron', 'Exo 2', sans-serif;">
                Reconnect
            </button>
        </div>

        <div id="feedback-success" class="gif-badge gif-badge-success" aria-hidden="true">
            <img src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction">
        </div>
        <div id="feedback-fail" class="gif-badge gif-badge-fail" aria-hidden="true">
            <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction">
        </div>

        <div id="controls" class="hidden mt-auto w-full p-6 pb-12 flex justify-between gap-4 interactive">
            <div id="ctrl-jump" class="control-pad flex-1 h-24 flex items-center justify-center">
                <span class="text-white font-bold text-lg tracking-widest">JUMP</span>
            </div>
            <div id="ctrl-move" class="control-pad accent-move flex-1 h-24 flex items-center justify-center">
                <span class="text-white font-bold text-lg tracking-widest">BOOST</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * GAME CONFIGURATION & STATE
         */
        const CONFIG = {
            gravity: 0.6,
            jumpForce: -13,
            speed: 7,
            acceleration: 0.8,
            friction: 0.85,
            colors: {
                bg: '#08111f',
                platform: '#132846',
                platformTop: '#72f7ff',
                player: '#7af7ff',
                playerShell: '#19b4ff',
                playerAccent: '#ffef88',
                playerShadow: 'rgba(0, 0, 0, 0.34)'
            }
        };

        const ASSETS = {
            // [agent-note][stage3] resolved-audio: loop/ui/jump/land/score/fail -> catalogs/audios.json
            // [agent-note][stage3] resolved-gif: success/fail badges -> catalogs/gifs.json
            // [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfxJump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
            sfxLand: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
            sfxScore: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
            sfxUi: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            sfxFail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
            platform: "https://gamezone-virid.vercel.app/assets/images/sprites/platformer/platform.png"
        };

        const state = {
            screen: 'start',
            width: window.innerWidth,
            height: window.innerHeight,
            score: 0,
            cameraX: 0,
            frameCount: 0,
            lastScoreSoundAt: 0,
            input: { move: false, jump: false },
            player: { x: 100, y: 300, w: 40, h: 40, vx: 0, vy: 0, grounded: false },
            platforms: [],
            particles: [],
            feedbackTimers: { success: null, fail: null }
        };

        const audio = {
            init: false,
            pool: {},
            bgm: null,

            ensure() {
                if (this.init) return;
                const make = (src, volume) => {
                    const el = new Audio(src);
                    el.preload = 'auto';
                    el.volume = volume;
                    return el;
                };

                this.bgm = make(ASSETS.bgm, 0.2);
                this.bgm.loop = true;

                this.pool = {
                    jump: make(ASSETS.sfxJump, 0.45),
                    land: make(ASSETS.sfxLand, 0.35),
                    score: make(ASSETS.sfxScore, 0.38),
                    ui: make(ASSETS.sfxUi, 0.45),
                    fail: make(ASSETS.sfxFail, 0.5)
                };

                this.init = true;
            },

            playBGM() {
                this.ensure();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            },

            stopBGM() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            },

            playSFX(type) {
                this.ensure();
                const src = this.pool[type];
                if (!src) return;
                try {
                    src.pause();
                    src.currentTime = 0;
                    src.play().catch(() => {});
                } catch (_) {}
            }
        };

        const imgPlatform = new Image();
        imgPlatform.src = ASSETS.platform;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const successBadge = document.getElementById('feedback-success');
        const failBadge = document.getElementById('feedback-fail');

        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;
        }
        window.addEventListener('resize', resize);
        resize();

        function setFeedback(type, active) {
            const target = type === 'success' ? successBadge : failBadge;
            if (!target) return;

            if (state.feedbackTimers[type]) {
                clearTimeout(state.feedbackTimers[type]);
                state.feedbackTimers[type] = null;
            }

            if (!active) {
                target.classList.remove('active');
                return;
            }

            target.classList.add('active');
            state.feedbackTimers[type] = setTimeout(() => {
                target.classList.remove('active');
                state.feedbackTimers[type] = null;
            }, type === 'success' ? 900 : 1300);
        }

        function resetGame() {
            state.score = 0;
            state.cameraX = 0;
            state.lastScoreSoundAt = 0;
            state.player.x = 100;
            state.player.y = state.height / 2;
            state.player.vx = 0;
            state.player.vy = 0;
            state.player.grounded = false;
            state.input.move = false;
            state.input.jump = false;
            state.particles = [];
            setFeedback('success', false);
            setFeedback('fail', false);

            state.platforms = [
                { x: 50, y: state.height / 2 + 100, w: 600, h: 50 }
            ];
            generatePlatforms(5);

            document.getElementById('score-display').innerText = '0';
        }

        function generatePlatforms(count) {
            let lastP = state.platforms[state.platforms.length - 1];
            for (let i = 0; i < count; i++) {
                const gap = 120 + Math.random() * 80;
                const w = 150 + Math.random() * 200;
                let y = lastP.y + (Math.random() * 160 - 80);
                y = Math.max(state.height * 0.3, Math.min(state.height * 0.8, y));

                const p = { x: lastP.x + lastP.w + gap, y: y, w: w, h: 50 };
                state.platforms.push(p);
                lastP = p;
            }
        }

        function createParticles(x, y, count, type) {
            for (let i = 0; i < count; i++) {
                state.particles.push({
                    x: x + (Math.random() * 40 - 20),
                    y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -(Math.random() * 2 + 1),
                    life: 1.0,
                    type: type,
                    emoji: type === 'emoji' ? (Math.random() > 0.5 ? '📶' : '✨') : null
                });
            }
        }

        function update() {
            if (state.screen !== 'playing') return;

            const p = state.player;

            if (state.input.move) {
                p.vx += CONFIG.acceleration;
                if (p.vx > CONFIG.speed) p.vx = CONFIG.speed;
            } else {
                p.vx *= CONFIG.friction;
            }

            if (state.input.jump && p.grounded) {
                p.vy = CONFIG.jumpForce;
                p.grounded = false;
                audio.playSFX('jump');
                createParticles(p.x + p.w / 2, p.y + p.h, 5, 'dust');
                state.input.jump = false;
            }

            p.vy += CONFIG.gravity;
            p.x += p.vx;
            p.y += p.vy;

            let targetCamX = p.x - state.width * 0.25;
            if (targetCamX < 0) targetCamX = 0;
            state.cameraX += (targetCamX - state.cameraX) * 0.1;

            p.grounded = false;
            if (p.y > state.height + 100) {
                gameOver();
                return;
            }

            state.platforms.forEach(plat => {
                if (
                    p.vy >= 0 &&
                    p.x + p.w > plat.x + 10 &&
                    p.x < plat.x + plat.w - 10 &&
                    p.y + p.h >= plat.y &&
                    p.y + p.h <= plat.y + plat.h
                ) {
                    if (p.y + p.h - p.vy <= plat.y + 10) {
                        const wasGrounded = p.grounded;
                        p.y = plat.y - p.h;
                        p.vy = 0;
                        p.grounded = true;
                        if (!wasGrounded) {
                            audio.playSFX('land');
                        }
                    }
                }
            });

            const lastP = state.platforms[state.platforms.length - 1];
            if (lastP.x < state.cameraX + state.width + 500) {
                generatePlatforms(3);
            }
            if (state.platforms.length > 20) {
                if (state.platforms[0].x + state.platforms[0].w < state.cameraX - 100) {
                    state.platforms.shift();
                }
            }

            const dist = Math.floor((p.x - 100) / 100);
            if (dist > state.score) {
                state.score = dist;
                document.getElementById('score-display').innerText = state.score;
                if (dist - state.lastScoreSoundAt >= 5) {
                    state.lastScoreSoundAt = dist;
                    audio.playSFX('score');
                    setFeedback('success', true);
                }
                if (Math.random() < 0.05) {
                    createParticles(state.cameraX + state.width - 50, state.height - 100, 1, 'emoji');
                }
            }

            for (let i = state.particles.length - 1; i >= 0; i--) {
                let part = state.particles[i];
                part.x += part.vx;
                part.y += part.vy;
                part.life -= 0.02;
                if (part.life <= 0) state.particles.splice(i, 1);
            }
        }

        function draw() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, state.height);
            skyGradient.addColorStop(0, '#12244a');
            skyGradient.addColorStop(0.45, '#08111f');
            skyGradient.addColorStop(1, '#040913');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, state.width, state.height);

            ctx.save();
            const horizonGlow = ctx.createRadialGradient(
                state.width * 0.58, state.height * 0.24, 40,
                state.width * 0.58, state.height * 0.24, state.width * 0.48
            );
            horizonGlow.addColorStop(0, 'rgba(114, 247, 255, 0.18)');
            horizonGlow.addColorStop(0.45, 'rgba(134, 93, 255, 0.1)');
            horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(0, 0, state.width, state.height);

            ctx.strokeStyle = 'rgba(114, 247, 255, 0.08)';
            ctx.lineWidth = 2;
            const gridSize = 100;
            const offsetX = -(state.cameraX * 0.5) % gridSize;
            for (let x = offsetX; x < state.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, state.height * 0.08);
                ctx.lineTo(x, state.height);
                ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(255, 95, 210, 0.08)';
            for (let y = state.height * 0.26; y < state.height; y += 90) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(state.width, y);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(-state.cameraX, 0);

            state.platforms.forEach(p => {
                if (imgPlatform.complete && imgPlatform.naturalWidth > 0) {
                    ctx.drawImage(imgPlatform, p.x, p.y, p.w, p.h);
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
                    ctx.fillRect(p.x, p.y, p.w, 4);
                } else {
                    ctx.fillStyle = CONFIG.colors.platform;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = CONFIG.colors.platformTop;
                    ctx.fillRect(p.x, p.y, p.w, 4);
                    ctx.shadowColor = CONFIG.colors.platformTop;
                    ctx.shadowBlur = 10;
                    ctx.fillRect(p.x, p.y, p.w, 2);
                    ctx.shadowBlur = 0;
                }
            });

            const p = state.player;
            ctx.fillStyle = CONFIG.colors.playerShadow;
            ctx.beginPath();
            ctx.ellipse(p.x + p.w / 2, p.y + p.h + 7, p.w / 2 + 3, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            const shellGradient = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
            shellGradient.addColorStop(0, '#a4fdff');
            shellGradient.addColorStop(1, CONFIG.colors.playerShell);
            ctx.fillStyle = shellGradient;
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 12);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath();
            ctx.roundRect(p.x + 5, p.y + 5, p.w - 10, 10, 8);
            ctx.fill();

            ctx.fillStyle = CONFIG.colors.playerAccent;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y - 2, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 230, 109, 0.9)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w / 2, p.y + 2);
            ctx.lineTo(p.x + p.w / 2, p.y - 8);
            ctx.stroke();

            ctx.fillStyle = '#06131f';
            const eyeY = p.vy > 1 ? p.y + 15 : p.y + 14;
            const eyeH = p.vy > 1 ? 8 : 6;
            ctx.beginPath();
            ctx.roundRect(p.x + 9, eyeY, 7, eyeH, 4);
            ctx.roundRect(p.x + 24, eyeY, 7, eyeH, 4);
            ctx.fill();

            ctx.strokeStyle = 'rgba(122, 247, 255, 0.95)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y + 28, 7, 0.12 * Math.PI, 0.88 * Math.PI);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x - 3, p.y + 15);
            ctx.lineTo(p.x - 7, p.y + 27);
            ctx.moveTo(p.x + p.w + 3, p.y + 15);
            ctx.lineTo(p.x + p.w + 7, p.y + 27);
            ctx.stroke();

            ctx.restore();

            ctx.save();
            state.particles.forEach(part => {
                if (part.type === 'emoji') {
                    ctx.font = "24px 'Orbitron', 'Exo 2', sans-serif";
                    ctx.globalAlpha = part.life;
                    ctx.fillText(part.emoji, part.x - state.cameraX, part.y);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.globalAlpha = part.life;
                    ctx.fillRect(part.x - state.cameraX, part.y, 4, 4);
                }
            });
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            audio.playSFX('ui');
            audio.playBGM();

            state.screen = 'playing';
            resetGame();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
        }

        function gameOver() {
            state.screen = 'gameover';
            audio.stopBGM();
            audio.playSFX('fail');
            setFeedback('fail', true);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score + " bars";
        }

        const btnJump = document.getElementById('ctrl-jump');
        const btnMove = document.getElementById('ctrl-move');

        function bindTouch(elem, onStart, onEnd) {
            elem.addEventListener('touchstart', (e) => {
                e.preventDefault();
                onStart();
                elem.classList.add('active');
            }, { passive: false });

            elem.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (onEnd) onEnd();
                elem.classList.remove('active');
            }, { passive: false });

            elem.addEventListener('mousedown', () => {
                onStart();
                elem.classList.add('active');
            });
            elem.addEventListener('mouseup', () => {
                if (onEnd) onEnd();
                elem.classList.remove('active');
            });
            elem.addEventListener('mouseleave', () => {
                if (onEnd) onEnd();
                elem.classList.remove('active');
            });
        }

        bindTouch(btnJump, () => {
            state.input.jump = true;
        }, () => {
            state.input.jump = false;
        });

        bindTouch(btnMove, () => {
            state.input.move = true;
        }, () => {
            state.input.move = false;
        });

        const startBtn = document.getElementById('btn-start');
        const restartBtn = document.getElementById('btn-restart');

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        requestAnimationFrame(loop);
    </script>
</body>
