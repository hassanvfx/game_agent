<script>
/**
 * §2 System Invariants & Architecture
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const dpr = window.devicePixelRatio || 1;

// Global State
let cw = 0, ch = 0;
let initialized = false;
let gameState = 'PLAYING';
/* [agent-note][stage1] role: future-audio | trigger: dense-collision-bursts | intent: escalate impact as the drone cloud grows */
let timeScale = 1; // 0, 1, 2, 3
let lastTime = 0;
let particles = [];
let totalMass = 0;
let nextSpawnColor = '#B302FC';

// New Settings State
let soundEnabled = true;
let graphicsLevel = 'ultra'; // 'medium', 'high', 'ultra'

// Input State
const inputState = {
    active: false,
    x: 0,
    y: 0,
    spawnTimer: 0
};

// 10 More Colors Palette
const colorPalette = [
    '#B302FC', // Original Purple
    '#FF3366', // Neon Pink
    '#00FFCC', // Cyan
    '#FFCC00', // Yellow
    '#FF6600', // Orange
    '#00FF00', // Lime Green
    '#3366FF', // Royal Blue
    '#FF00FF', // Magenta
    '#FFFFFF', // White
    '#FF3333', // Red
    '#99FF33'  // Yellow-Green
];
let paletteIndex = 0;

// Config Proxy
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = new Proxy({}, {
    get: (target, prop) => gameConfigDefs[prop]?.value
});
window.gameConfigDefs = gameConfigDefs;
window.gameConfig = gameConfig;
window.updateGameConfig = (key, val) => {
    if (gameConfigDefs[key]) {
        gameConfigDefs[key].value = val;
        if (key === 'particleCount') initGame();
        if (key === 'themeColor') {
            nextSpawnColor = val;
            updateColorPreview();
        }
    }
};

function updateColorPreview() {
    const preview = document.getElementById('color-preview');
    if (preview) {
        preview.style.backgroundColor = nextSpawnColor;
        preview.style.boxShadow = `0 0 15px ${nextSpawnColor}80, 0 0 30px ${nextSpawnColor}40`;
    }
}

// Audio System (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const audioBuffers = {};
let backgroundArmed = false;
let feedbackTimer = null;
let lastUiTick = 0;

function showFeedback(mode = 'impact') {
    const overlay = document.getElementById('feedback-overlay');
    const gif = document.getElementById('feedback-gif');
    if (!overlay || !gif) return;
    const presets = {
        impact: {
            label: 'NEON SHOCK',
            src: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp'
        },
        reset: {
            label: 'FIELD REBOOT',
            src: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
        }
    };
    const preset = presets[mode] || presets.impact;
    overlay.dataset.label = preset.label;
    if (gif.src !== preset.src) gif.src = preset.src;
    overlay.classList.remove('hidden');
    requestAnimationFrame(() => overlay.classList.add('active'));
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
        overlay.classList.remove('active');
        setTimeout(() => overlay.classList.add('hidden'), 220);
    }, mode === 'reset' ? 1300 : 820);
}

const audioManager = {
    init: async () => {
        if (!audioCtx) audioCtx = new AudioContext();
        
        const loadBuffer = async (id, src) => {
            try {
                const res = await fetch(src);
                const arrayBuffer = await res.arrayBuffer();
                audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.warn(`Failed to load audio ${id}`, e);
            }
        };

        await Promise.all([
            loadBuffer('collide', document.getElementById('sfx_collide').src),
            loadBuffer('spawn', document.getElementById('sfx_spawn').src),
            loadBuffer('reset', document.getElementById('sfx_reset').src),
            loadBuffer('ui', document.getElementById('sfx_ui').src),
            loadBuffer('panelOpen', document.getElementById('sfx_panel_open').src),
            loadBuffer('panelClose', document.getElementById('sfx_panel_close').src)
        ]);
    },
    
    resume: () => {
        if (!soundEnabled) return;
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        const bgm = document.getElementById('bgm_main');
        if (!backgroundArmed) {
            backgroundArmed = true;
            bgm.volume = 0.2;
        }
        if (bgm.paused) bgm.play().catch(() => {});
    },

    syncLoopState: () => {
        const bgm = document.getElementById('bgm_main');
        if (!soundEnabled || !backgroundArmed) {
            bgm.pause();
            return;
        }
        if (bgm.paused) bgm.play().catch(() => {});
    },

    playSfx: function(id, pitch = 1.0, vol = 0.5) {
        if (!soundEnabled || !audioCtx || !audioBuffers[id]) return;
        
        const now = audioCtx.currentTime;
        if (id === 'collide') {
            if (this.lastCollide && now - this.lastCollide < 0.05) return;
            this.lastCollide = now;
        }

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[id];
        source.playbackRate.value = pitch;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = vol;
        
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
    },

    playUi: function(id = 'ui', vol = 0.35) {
        const now = performance.now();
        if (now - lastUiTick < 70) return;
        lastUiTick = now;
        this.playSfx(id, 1, vol);
    },

    synthesize: (type) => {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'spawn') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }
    }
};

// Vibration Bridge
const vibrate = (style) => {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
    if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 20 : 5);
};

/**
 * §3 Game Logic
 */

class Particle {
    constructor(x, y, mass, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        // Mass set to 1 to ensure Mass == Count
        this.mass = 1;
        this.radius = 4;
        this.color = color;
        this.glowPhase = Math.random() * Math.PI * 2;
        this.orbitPhase = Math.random() * Math.PI * 2;
    }

    update(dt) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.glowPhase += dt * 3;

        const damping = 0.8;
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -damping; }
        if (this.x > cw - this.radius) { this.x = cw - this.radius; this.vx *= -damping; }
        if (this.y < this.radius) { this.y = this.radius; this.vy *= -damping; }
        if (this.y > ch - this.radius) { this.y = ch - this.radius; this.vy *= -damping; }
    }

    draw(ctx) {
        if (!isFinite(this.x) || !isFinite(this.y)) return;

        const pulse = 0.5 + Math.sin(this.glowPhase) * 0.18;
        const satelliteX = this.x + Math.cos(this.orbitPhase + this.glowPhase * 0.4) * (this.radius + 3);
        const satelliteY = this.y + Math.sin(this.orbitPhase + this.glowPhase * 0.4) * (this.radius + 3);

        if (graphicsLevel === 'ultra') {
            const halo = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 3.4);
            halo.addColorStop(0, this.color + 'cc');
            halo.addColorStop(0.45, this.color + '32');
            halo.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 3.2, 0, Math.PI * 2);
            ctx.fillStyle = halo;
            ctx.fill();
        }

        if (graphicsLevel !== 'medium') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 1.8 + pulse, 0, Math.PI * 2);
            ctx.strokeStyle = this.color + '55';
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        const core = ctx.createRadialGradient(
            this.x - this.radius * 0.45,
            this.y - this.radius * 0.45,
            0,
            this.x,
            this.y,
            this.radius * 1.2
        );
        core.addColorStop(0, 'rgba(255,255,255,0.95)');
        core.addColorStop(0.28, this.color);
        core.addColorStop(1, this.color + 'aa');
        ctx.fillStyle = core;
        ctx.fill();

        if (graphicsLevel === 'ultra' || graphicsLevel === 'high') {
            ctx.beginPath();
            ctx.moveTo(this.x - this.radius - 1.5, this.y);
            ctx.lineTo(this.x + this.radius + 1.5, this.y);
            ctx.moveTo(this.x, this.y - this.radius - 1.5);
            ctx.lineTo(this.x, this.y + this.radius + 1.5);
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(satelliteX, satelliteY, 1.3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fill();
        }
    }
}

function initGame() {
    particles = [];
    totalMass = 0;
    nextSpawnColor = gameConfig.themeColor;
    updateColorPreview();
    const count = gameConfig.particleCount;
    
    for (let i = 0; i < count; i++) {
        spawnParticle(
            Math.random() * (cw - 40) + 20,
            Math.random() * (ch - 40) + 20,
            1
        );
    }
    updateHUD();
}

function spawnParticle(x, y, mass) {
    const p = new Particle(x, y, mass, nextSpawnColor);
    particles.push(p);
    totalMass += p.mass;
}

function updateHUD() {
    document.getElementById('score-val').textContent = Math.floor(totalMass);
    document.getElementById('count-val').textContent = particles.length;
}

function moveChunk() {
    const len = particles.length;
    for (let i = 0; i < len; i++) {
        const p = particles[i];
        const angle = Math.random() * Math.PI * 2;
        const impulse = 2 + Math.random() * 4;
        p.vx += Math.cos(angle) * impulse;
        p.vy += Math.sin(angle) * impulse;
    }
    audioManager.playSfx('spawn', 0.92, 0.14);
    audioManager.playUi('ui', 0.22);
    showFeedback('impact');
    vibrate('medium');
}

function physicsStep(dt, isSubStep = false) {
    const G = gameConfig.gravity;
    const friction = gameConfig.friction;

    // 0. Handle Spawning (NO LIMIT)
    if (!isSubStep && inputState.active) {
        inputState.spawnTimer -= dt;
        let spawnedThisFrame = 0;
        while (inputState.spawnTimer <= 0) {
            const ox = (Math.random() - 0.5) * 20; 
            const oy = (Math.random() - 0.5) * 20;
            spawnParticle(inputState.x + ox, inputState.y + oy, 1);
            inputState.spawnTimer += 0.002; // 500 particles per second
            spawnedThisFrame++;
        }
        
        if (spawnedThisFrame > 0) {
            const pitch = 0.8 + Math.random() * 0.4;
            audioManager.playSfx('spawn', pitch, 0.1);
            vibrate('light');
        }
        
        if (inputState.spawnTimer < 0) inputState.spawnTimer = 0;
    }

    if (timeScale > 0) {
        // 1. Apply Gravity (N-body)
        const len = particles.length;
        for (let i = 0; i < len; i++) {
            const p1 = particles[i];
            
            for (let j = i + 1; j < len; j++) {
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < 1) continue; 

                const dist = Math.sqrt(distSq);
                const force = (G * p1.mass * p2.mass) / Math.max(distSq, 100);
                const ax = (dx / dist) * force;
                const ay = (dy / dist) * force;

                p1.vx += ax / p1.mass;
                p1.vy += ay / p1.mass;
                p2.vx -= ax / p2.mass;
                p2.vy -= ay / p2.mass;
            }

            p1.vx *= friction;
            p1.vy *= friction;
        }

        // 2. Move
        for (let i = 0; i < len; i++) {
            particles[i].update(dt);
        }

        // 3. Collision Resolution
        for (let i = 0; i < len; i++) {
            for (let j = i + 1; j < len; j++) {
                const p1 = particles[i];
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx*dx + dy*dy;
                const minDist = p1.radius + p2.radius;

                if (distSq < minDist * minDist) {
                    const dist = Math.sqrt(distSq);
                    if (dist === 0) continue;
                    
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const overlap = (minDist - dist) * 0.5;
                    p1.x -= nx * overlap;
                    p1.y -= ny * overlap;
                    p2.x += nx * overlap;
                    p2.y += ny * overlap;

                    const dvx = p2.vx - p1.vx;
                    const dvy = p2.vy - p1.vy;
                    const velAlongNormal = dvx * nx + dvy * ny;

                    if (velAlongNormal > 0) continue;

                    const restitution = 0.8;
                    const impulse = -(1 + restitution) * velAlongNormal / (1/p1.mass + 1/p2.mass);
                    
                    const ix = impulse * nx;
                    const iy = impulse * ny;

                    p1.vx -= ix / p1.mass;
                    p1.vy -= iy / p1.mass;
                    p2.vx += ix / p2.mass;
                    p2.vy += iy / p2.mass;

                    const impact = Math.abs(velAlongNormal);
                    if (impact > 1.0) {
                        const vol = Math.min(0.42, impact * 0.055);
                        const pitch = Math.max(0.72, 1.45 - (p1.mass + p2.mass) * 0.05);
                        audioManager.playSfx('collide', pitch, vol);
                        if (impact > 3.2) {
                            showFeedback('impact');
                            vibrate('medium');
                        }
                    }
                }
            }
        }
    }

    if (!isSubStep && (inputState.active || (particles.length > 0 && Math.random() < 0.1))) updateHUD();
}

function draw() {
    const backdrop = ctx.createLinearGradient(0, 0, 0, ch);
    backdrop.addColorStop(0, '#08101f');
    backdrop.addColorStop(0.58, '#070b16');
    backdrop.addColorStop(1, '#03060d');
    ctx.fillStyle = backdrop;
    ctx.fillRect(0, 0, cw, ch);

    const fieldGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.52, 20, cw * 0.5, ch * 0.52, Math.max(cw, ch) * 0.62);
    fieldGlow.addColorStop(0, 'rgba(124,242,255,0.05)');
    fieldGlow.addColorStop(0.48, 'rgba(138,108,255,0.06)');
    fieldGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fieldGlow;
    ctx.fillRect(0, 0, cw, ch);

    if (graphicsLevel !== 'medium') {
        ctx.strokeStyle = 'rgba(124,242,255,0.05)';
        ctx.lineWidth = 1;
        const step = Math.max(44, Math.min(70, Math.floor(cw / 8)));
        for (let x = step * 0.5; x < cw; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, ch);
            ctx.stroke();
        }
        for (let y = step * 0.5; y < ch; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(cw, y);
            ctx.stroke();
        }
    }

    if (timeScale === 0) {
        ctx.fillStyle = 'rgba(0, 200, 255, 0.05)';
        ctx.fillRect(0, 0, cw, ch);

        ctx.strokeStyle = 'rgba(124, 242, 255, 0.35)';
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, cw - 4, ch - 4);
    }

    if (particles.length > 1 && graphicsLevel === 'ultra') {
        ctx.lineWidth = 0.7;
        for (let i = 0; i < particles.length; i++) {
            const p1 = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distSq = dx * dx + dy * dy;
                if (distSq < 3600) {
                    const alpha = 0.12 * (1 - distSq / 3600);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(124,242,255,${alpha})`;
                    ctx.stroke();
                }
            }
        }
    }

    if (inputState.active) {
        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 35, 0, Math.PI * 2);
        ctx.strokeStyle = nextSpawnColor + '60';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 25, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = nextSpawnColor;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(inputState.x, inputState.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = nextSpawnColor + '40';
        ctx.fill();
    }

    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (timeScale === 0) {
            physicsStep(dt, false);
        } else {
            for (let i = 0; i < timeScale; i++) {
                physicsStep(dt, i > 0);
            }
        }
        draw();
    } catch (e) {
        console.error("Loop Error", e);
    }

    requestAnimationFrame(loop);
}

/**
 * §4 Input & Lifecycle
 */

function handleInput(e) {
    e.preventDefault();
    audioManager.resume();
    
    const hint = document.getElementById('hint');
    if (hint && !hint.classList.contains('hidden')) hint.classList.add('hidden');

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        inputState.active = true;
        inputState.spawnTimer = 0;
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointermove') {
        inputState.x = x;
        inputState.y = y;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        inputState.active = false;
    }
}

function setTimeScale(scale) {
    timeScale = scale;
    [0, 1, 2, 3].forEach(s => {
        const btn = document.getElementById(`btn-${s}x`);
        if (s === scale) {
            btn.style.color = '#22d3ee';
            btn.style.borderColor = '#22d3ee';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    vibrate('light');
}

function setGraphicsLevel(level) {
    graphicsLevel = level;
    ['medium', 'high', 'ultra'].forEach(l => {
        const btn = document.getElementById(`gfx-${l}`);
        if (l === level) {
            btn.style.color = '#22d3ee';
            btn.style.borderColor = '#22d3ee';
        } else {
            btn.style.color = 'white';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        }
    });
    vibrate('light');
}

function setSoundEnabled(enabled) {
    soundEnabled = enabled;
    const bgm = document.getElementById('bgm_main');
    
    if (enabled) {
        document.getElementById('snd-on').style.color = '#22d3ee';
        document.getElementById('snd-on').style.borderColor = '#22d3ee';
        document.getElementById('snd-off').style.color = 'white';
        document.getElementById('snd-off').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audioManager.syncLoopState();
    } else {
        document.getElementById('snd-off').style.color = '#22d3ee';
        document.getElementById('snd-off').style.borderColor = '#22d3ee';
        document.getElementById('snd-on').style.color = 'white';
        document.getElementById('snd-on').style.borderColor = 'rgba(255, 255, 255, 0.1)';
        bgm.pause();
    }
    audioManager.playUi(enabled ? 'ui' : 'panelClose', enabled ? 0.2 : 0.18);
    vibrate('light');
}

document.addEventListener('DOMContentLoaded', () => {
    audioManager.init();

    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        const { width, height } = entry.contentRect;
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        
        cw = width;
        ch = height;
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
            
            const bgm = document.getElementById('bgm_main');
            bgm.volume = 0.2;
            bgm.pause();
        } else {
            particles.forEach(p => {
                p.x = Math.min(p.x, cw - p.radius);
                p.y = Math.min(p.y, ch - p.radius);
            });
        }
    });
    
    ro.observe(canvas);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', handleInput, { passive: false });
    canvas.addEventListener('pointercancel', handleInput, { passive: false });

    document.getElementById('color-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        
        paletteIndex = (paletteIndex + 1) % colorPalette.length;
        const newColor = colorPalette[paletteIndex];
        
        window.updateGameConfig('themeColor', newColor);
        audioManager.playUi('ui', 0.24);
        vibrate('light');
    });

    document.getElementById('btn-0x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); audioManager.playSfx('panelClose', 1, 0.18); setTimeScale(0); });
    document.getElementById('btn-1x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); audioManager.playUi('ui', 0.22); setTimeScale(1); });
    document.getElementById('btn-2x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); audioManager.playUi('ui', 0.22); setTimeScale(2); });
    document.getElementById('btn-3x').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); audioManager.playUi('ui', 0.22); setTimeScale(3); });

    document.getElementById('move-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        moveChunk();
    });

    document.getElementById('reset-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        setTimeScale(1);
        initGame();
        audioManager.playSfx('reset', 1, 0.28);
        showFeedback('reset');
        vibrate('heavy');
    });

    // Settings UI Listeners
    const settingsPanel = document.getElementById('settings-panel');
    
    document.getElementById('settings-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audioManager.resume();
        settingsPanel.classList.remove('hidden');
        audioManager.playSfx('panelOpen', 1, 0.24);
        vibrate('light');
    });

    document.getElementById('close-settings').addEventListener('click', (e) => {
        e.stopPropagation();
        settingsPanel.classList.add('hidden');
        audioManager.playSfx('panelClose', 1, 0.22);
        vibrate('light');
    });

    // Prevent clicks inside the panel from closing it if we add a backdrop click later
    settingsPanel.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
    });

    document.getElementById('gfx-medium').addEventListener('click', (e) => { e.stopPropagation(); audioManager.playUi('ui', 0.2); setGraphicsLevel('medium'); });
    document.getElementById('gfx-high').addEventListener('click', (e) => { e.stopPropagation(); audioManager.playUi('ui', 0.2); setGraphicsLevel('high'); });
    document.getElementById('gfx-ultra').addEventListener('click', (e) => { e.stopPropagation(); audioManager.playUi('ui', 0.2); setGraphicsLevel('ultra'); });

    document.getElementById('snd-on').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setSoundEnabled(true); });
    document.getElementById('snd-off').addEventListener('click', (e) => { e.stopPropagation(); audioManager.resume(); setSoundEnabled(false); });
});
</script>
