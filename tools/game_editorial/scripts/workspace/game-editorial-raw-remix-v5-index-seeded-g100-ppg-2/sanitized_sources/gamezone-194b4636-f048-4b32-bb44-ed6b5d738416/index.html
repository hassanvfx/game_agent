        canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; z-index: 0; }

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;

            display: flex;
            flex-direction: column;

        .absolute { position: absolute; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .w-full { width: 100%; }
        .w-11\/12 { width: 91.666667%; }
        .max-w-sm { max-width: 24rem; }
        .max-w-md { max-width: 28rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }

        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-6xl { font-size: 3.75rem; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .uppercase { text-transform: uppercase; }
        .tracking-wide { letter-spacing: 0.08em; }
        .leading-tight { line-height: 1.2; }

        .text-slate-600 { color: var(--text-muted); }

            border-radius: 1rem;

            border: 1px solid rgba(125, 211, 252, 0.3);
            background: rgba(5, 10, 22, 0.7);
            box-shadow: 0 10px 24px rgba(0,0,0,0.22);

<script>
/**
 * AUDIO MANAGER
 * Handles Web Audio API contexts, unlocking, and fallback synthesis.
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmNode = document.getElementById('bgm_main');
        this.sounds = {
            start: { el: document.getElementById('sfx_start'), buffer: null, volume: 0.45 },
            correct: { el: document.getElementById('sfx_correct'), buffer: null, volume: 0.42 },
            wrong: { el: document.getElementById('sfx_wrong'), buffer: null, volume: 0.4 },
            win: { el: document.getElementById('sfx_win'), buffer: null, volume: 0.48 },
            lose: { el: document.getElementById('sfx_lose'), buffer: null, volume: 0.44 }
        };
        this.unlocked = false;
        this.lastPlayedAt = {};
        if (this.bgmNode) this.bgmNode.volume = 0.2;

        Object.keys(this.sounds).forEach(key => {
            const sound = this.sounds[key];
            const el = sound.el;
            if (el && el.src) {
                el.volume = Math.min(sound.volume || 0.4, 0.48);
                const srcUrl = new URL(el.src, window.location.href);
                const isSameOrigin = srcUrl.origin === window.location.origin;
                if (isSameOrigin) {
                    fetch(el.src)
                        .then(r => r.arrayBuffer())
                        .then(b => this.ctx.decodeAudioData(b))
                        .then(data => this.sounds[key].buffer = data)
                        .catch(() => console.log('Audio load fail, using media element playback'));
                }
            }
        });

        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                window.removeEventListener('pointerdown', unlock);
                window.removeEventListener('keydown', unlock);
            });
        };
        window.addEventListener('pointerdown', unlock);
        window.addEventListener('keydown', unlock);
    }

    playBgm() {
        if (this.bgmNode) {
            this.bgmNode.currentTime = 0;
            this.bgmNode.play().catch(() => console.log("BGM autoplay prevented"));
        }
    }

    pauseBgm() {
        if (this.bgmNode) this.bgmNode.pause();
    }

    playSfx(type) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const sound = this.sounds[type];
        if (!sound) return;
        const now = performance.now();
        if (this.lastPlayedAt[type] && now - this.lastPlayedAt[type] < 120) return;
        this.lastPlayedAt[type] = now;
        if (sound.buffer) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = sound.buffer;
            gain.gain.value = sound.volume || 0.4;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
            return;
        }
        if (sound.el && sound.el.src) {
            try {
                const mediaSound = sound.el.cloneNode();
                mediaSound.volume = Math.min(sound.volume || 0.4, 0.48);
                mediaSound.play().catch(() => this.synthesize(type));
                return;
            } catch (e) {
                console.log('Audio media element fallback failed, using synth');
            }
        }
        this.synthesize(type);
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.setValueAtTime(600, this.ctx.currentTime + 0.2);
            osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.26, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 1.1);
        } else if (type === 'start') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(320, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(580, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.24);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.24);
        } else if (type === 'lose') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(260, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.55);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.55);
        }
    }
}

/**
 * QUESTION GENERATOR
 * Generates procedural question prompts for the arcade run.
 */
const QuestionBank = {
    math: () => {
        const ops = ['+', '-', '*'];
        const op = ops[Math.floor(Math.random() * ops.length)];
        let a, b, ans;
        if (op === '+') { a = Math.floor(Math.random() * 50); b = Math.floor(Math.random() * 50); ans = a + b; }
        else if (op === '-') { a = Math.floor(Math.random() * 50) + 20; b = Math.floor(Math.random() * a); ans = a - b; }
        else { a = Math.floor(Math.random() * 12); b = Math.floor(Math.random() * 12); ans = a * b; }

        let wrongs = new Set();
        while (wrongs.size < 3) {
            let w = ans + Math.floor(Math.random() * 10) - 5;
            if (w !== ans && w >= 0) wrongs.add(w);
        }
        return {
            category: "Quick Math",
            text: `What is ${a} ${op} ${b}?`,
            correct: ans,
            options: shuffle([ans, ...wrongs])
        };
    },
    capitals: () => {
        const data = [
            { c: "France", a: "Paris" }, { c: "Germany", a: "Berlin" }, { c: "Italy", a: "Rome" },
            { c: "Spain", a: "Madrid" }, { c: "Japan", a: "Tokyo" }, { c: "UK", a: "London" },
            { c: "USA", a: "Washington D.C." }, { c: "China", a: "Beijing" }, { c: "India", a: "New Delhi" },
            { c: "Brazil", a: "Brasilia" }, { c: "Canada", a: "Ottawa" }, { c: "Australia", a: "Canberra" }
        ];
        const q = data[Math.floor(Math.random() * data.length)];
        let wrongs = new Set();
        while (wrongs.size < 3) {
            let w = data[Math.floor(Math.random() * data.length)].a;
            if (w !== q.a) wrongs.add(w);
        }
        return {
            category: "Map Check",
            text: `What is the capital of ${q.c}?`,
            correct: q.a,
            options: shuffle([q.a, ...wrongs])
        };
    },
    logic: () => {
        const seqs = [
            { s: "2, 4, 6, 8, ?", a: "10", w: ["12", "9", "11"] },
            { s: "1, 1, 2, 3, 5, ?", a: "8", w: ["7", "6", "9"] },
            { s: "A, C, E, G, ?", a: "I", w: ["H", "J", "K"] },
            { s: "10, 20, 30, ?", a: "40", w: ["50", "35", "45"] },
            { s: "Red, Blue, Yellow, ?", a: "Green", w: ["Square", "Loud", "Soft"] }
        ];
        const q = seqs[Math.floor(Math.random() * seqs.length)];
        return {
            category: "Pattern Read",
            text: `Complete the sequence: ${q.s}`,
            correct: q.a,
            options: shuffle([q.a, ...q.w])
        };
    }
};

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function generateQuestion() {
    const types = ['math', 'capitals', 'logic'];
    const type = types[Math.floor(Math.random() * types.length)];
    return QuestionBank[type]();
}

/**
 * GAME ENGINE
 */
let canvas, ctx;
let audioManager;
let particles = [];
let gameState = 'START';
let score = 0;
let currentQuestion = null;
let lastTime = 0;
let reactionTimeout = null;
let winConfettiInterval = null;

window.gameConfig = {
    targetScore: 10,
    themeColor: "#4f46e5",
    gameTitle: "Quiz Rush Arcade"
};

window.gameConfigDefs = {
    targetScore: { type: "number", label: "Winning Score", value: 10, min: 1, max: 50 },
    themeColor: { type: "color", label: "Theme Color", value: "#4f46e5" },
    gameTitle: { type: "text", label: "Game Title", value: "Quiz Rush Arcade" }
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') {
            document.getElementById('ui-title').innerText = val;
            document.title = val;
        }
        if (key === 'targetScore') {
            document.getElementById('target-score-display').innerText = val;
            document.getElementById('max-score-val').innerText = val;
        }
        if (key === 'themeColor') {
            document.getElementById('start-btn').style.background = `linear-gradient(180deg, ${val}, #2563eb)`;
        }
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}

class Particle {
    constructor(x, y, color, type) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type;
        if (type === 'confetti') {
            this.vx = (Math.random() - 0.5) * 15;
            this.vy = (Math.random() - 1) * 15;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.01;
            this.size = Math.random() * 8 + 4;
            this.rot = Math.random() * Math.PI;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
        } else {
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.life = 1.0;
            this.decay = 0;
            this.size = Math.random() * 50 + 20;
        }
    }

    update() {
        if (this.type === 'confetti') {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.5;
            this.life -= this.decay;
            this.rot += this.rotSpeed;
        } else {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < -100) this.x = window.innerWidth + 100;
            if (this.x > window.innerWidth + 100) this.x = -100;
            if (this.y < -100) this.y = window.innerHeight + 100;
            if (this.y > window.innerHeight + 100) this.y = -100;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.type === 'confetti') {
            ctx.rotate(this.rot);
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        } else {
            ctx.globalAlpha = 0.08;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

function spawnConfetti(x, y) {
    const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
    for (let i = 0; i < 30; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], 'confetti'));
    }
}

function initBackground() {
    particles = [];
    for (let i = 0; i < 20; i++) {
        particles.push(new Particle(
            Math.random() * window.innerWidth,
            Math.random() * window.innerHeight,
            window.gameConfig.themeColor,
            'bg'
        ));
    }
}

function triggerReaction(type) {
    const cards = {
        success: document.getElementById('gif-success'),
        fail: document.getElementById('gif-fail')
    };
    Object.values(cards).forEach(card => card && card.classList.remove('active'));
    if (reactionTimeout) clearTimeout(reactionTimeout);
    const target = cards[type];
    if (!target) return;
    target.classList.add('active');
    reactionTimeout = setTimeout(() => target.classList.remove('active'), 1500);
}

function showScreen(id) {
    ['start-screen', 'game-hud', 'question-card', 'win-screen', 'lose-screen'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
    });
    document.getElementById(id).classList.remove('hidden');
    if (id === 'question-card') document.getElementById('game-hud').classList.remove('hidden');
}

function startGame() {
    if (winConfettiInterval) {
        clearInterval(winConfettiInterval);
        winConfettiInterval = null;
    }
    score = 0;
    gameState = 'PLAY';
    audioManager.playSfx('start');
    audioManager.playBgm();
    document.getElementById('score-val').innerText = score;
    document.getElementById('max-score-val').innerText = window.gameConfig.targetScore;
    document.getElementById('timer-val').innerText = 'LIVE FEED';
    nextQuestion();
}

function nextQuestion() {
    if (score >= window.gameConfig.targetScore) {
        endGame(true);
        return;
    }

    currentQuestion = generateQuestion();
    document.getElementById('q-category').innerText = `✦ ${currentQuestion.category}`;
    document.getElementById('q-text').innerHTML = `<span class="prompt-face" aria-hidden="true">🤖</span>${currentQuestion.text}`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    currentQuestion.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full answer-btn text-indigo-900 font-semibold py-3 px-4 rounded-xl shadow-sm border border-indigo-100 text-lg btn";
        btn.style.fontFamily = "var(--font-secondary)";
        btn.innerText = opt;
        btn.addEventListener('click', () => handleAnswer(opt, btn));
        container.appendChild(btn);
    });

    showScreen('question-card');
}

function handleAnswer(selected, btnElement) {
    if (gameState !== 'PLAY') return;

    const rect = btnElement.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    if (selected == currentQuestion.correct) {
        score++;
        document.getElementById('score-val').innerText = score;
        btnElement.classList.remove('bg-white', 'text-indigo-900');
        btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
        audioManager.playSfx('correct');
        triggerReaction('success');
        spawnConfetti(centerX, centerY);

        setTimeout(() => {
            nextQuestion();
        }, 800);
    } else {
        btnElement.classList.remove('bg-white', 'text-indigo-900');
        btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
        audioManager.playSfx('wrong');
        triggerReaction('fail');

        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);

        const buttons = document.getElementById('options-container').children;
        for (let btn of buttons) {
            if (btn.innerText == currentQuestion.correct) {
                btn.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
            }
        }

        setTimeout(() => {
            endGame(false);
        }, 1500);
    }
}

function endGame(win) {
    gameState = win ? 'WIN' : 'LOSE';
    if (winConfettiInterval) {
        clearInterval(winConfettiInterval);
        winConfettiInterval = null;
    }
    showScreen(win ? 'win-screen' : 'lose-screen');
    if (win) {
        audioManager.playSfx('win');
        triggerReaction('success');
        winConfettiInterval = setInterval(() => {
            if (gameState === 'WIN') spawnConfetti(Math.random() * window.innerWidth, window.innerHeight);
        }, 200);
    } else {
        audioManager.playSfx('lose');
        audioManager.pauseBgm();
        triggerReaction('fail');
        document.getElementById('final-score').innerText = score;
    }
}

function loop(timestamp) {
    lastTime = timestamp;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].type === 'confetti' && particles[i].life <= 0) {
            particles.splice(i, 1);
        }
    }

    requestAnimationFrame(loop);
}

document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    const configScript = document.getElementById('game-config');
    if (configScript) {
        try {
            const defaults = JSON.parse(configScript.textContent);
            window.gameConfigDefs = defaults;
            Object.keys(defaults).forEach(k => {
                window.gameConfig[k] = defaults[k].value;
            });
            updateGameConfig('gameTitle', window.gameConfig.gameTitle);
            updateGameConfig('targetScore', window.gameConfig.targetScore);
            updateGameConfig('themeColor', window.gameConfig.themeColor);
        } catch (e) {
            console.error("Config Parse Error", e);
        }
    }

    audioManager = new AudioManager();

    window.addEventListener('resize', resize);
    resize();
    initBackground();

    // [agent-note][stage4] repaired: mobile-actionability | controls: start/restart/answers | action: use click activation to preserve native tap behavior
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn-win').addEventListener('click', startGame);
    document.getElementById('restart-btn-lose').addEventListener('click', startGame);

    requestAnimationFrame(loop);
});
</script>
