<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Orbital Lounge</title>
<style>
    :root {
        --bg-color: #050814;
        --bg-deep: #02040c;
        --panel-edge: rgba(153, 240, 255, 0.32);
        --glass-border: rgba(153, 240, 255, 0.18);
        --glass-bg: rgba(13, 22, 47, 0.68);
        --accent-cyan: #74f2ff;
        --accent-blue: #4a7dff;
        --accent-pink: #ff5fd2;
        --accent-gold: #ffd36e;
        --ui-text: #eff9ff;
        --shadow-soft: 0 14px 40px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(74, 125, 255, 0.18), transparent 34%),
            radial-gradient(circle at 20% 80%, rgba(255, 95, 210, 0.12), transparent 28%),
            linear-gradient(180deg, var(--bg-color), var(--bg-deep));
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: manipulation;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    body { color: var(--ui-text); }
    canvas { display: block; width: 100%; height: 100%; }

    /* Minimal utility layer replacing the removed Tailwind runtime */
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .z-50 { z-index: 50; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-start { align-items: flex-start; }
    .items-center { align-items: center; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .text-center { text-align: center; }
    .hidden { display: none !important; }
    .interactive { pointer-events: auto; cursor: pointer; }
    .p-4 { padding: 1rem; }
    .p-3 { padding: 0.75rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .px-12 { padding-left: 3rem; padding-right: 3rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
    .mb-8 { margin-bottom: 2rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mt-4 { margin-top: 1rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-full { border-radius: 9999px; }
    .min-w-\[80px\] { min-width: 80px; }
    .w-12 { width: 3rem; }
    .h-12 { height: 3rem; }
    .text-white { color: #fff; }
    .text-black { color: #000; }
    .text-gray-300 { color: #d1d5db; }
    .text-blue-300 { color: #93c5fd; }
    .text-blue-400 { color: #60a5fa; }
    .bg-black\/80 { background: rgba(0, 0, 0, 0.8); }
    .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .text-3xl { font-size: 1.875rem; line-height: 1; }
    .text-6xl { font-size: clamp(3rem, 8vw, 4.75rem); line-height: 0.95; }
    .text-\[10px\] { font-size: 10px; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .uppercase { text-transform: uppercase; }
    .tracking-widest { letter-spacing: 0.22em; }
    .tracking-tighter { letter-spacing: -0.06em; }
    .opacity-60 { opacity: 0.6; }
    .leading-relaxed { line-height: 1.6; }
    .max-w-xs { max-width: 20rem; }

    .glass {
        background:
            linear-gradient(180deg, rgba(20, 32, 66, 0.86), rgba(8, 14, 31, 0.8)),
            var(--glass-bg);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .btn-press:active { transform: scale(0.92); transition: transform 0.1s; }
    .bg-blue-500 {
        background:
            radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 36%),
            linear-gradient(135deg, #79f5ff, #4a7dff 55%, #c978ff);
        box-shadow: 0 0 18px rgba(116, 242, 255, 0.4);
    }
    .bg-gradient-to-r {
        background-image:
            radial-gradient(circle at top, rgba(255,255,255,0.24), transparent 32%),
            linear-gradient(135deg, #3772ff, #59d7ff 55%, #ff5fd2);
    }
    .shadow-\[0_0_20px_rgba\(59\,130\,246\,0\.5\)\] { box-shadow: 0 0 22px rgba(89,215,255,0.42); }
    button {
        border: 0;
        font: inherit;
    }
    #game-container::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at center, transparent 46%, rgba(3, 6, 15, 0.52) 100%),
            linear-gradient(180deg, rgba(116, 242, 255, 0.05), transparent 28%);
        z-index: 1;
    }
    #start-btn {
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.08em;
        position: relative;
        overflow: hidden;
    }
    #start-btn::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        border: 1px solid rgba(255,255,255,0.18);
        pointer-events: none;
    }
    #flux-btn,
    #hud-stats,
    h1 {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ui-layer { pointer-events: none; }
    #hud-stats {
        position: relative;
        gap: 0.15rem;
        min-width: 92px;
    }
    #hud-stats::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.06);
        pointer-events: none;
    }
    #flux-btn {
        border: 1px solid rgba(116, 242, 255, 0.22);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }
    #start-screen {
        background:
            linear-gradient(180deg, rgba(2, 5, 14, 0.72), rgba(2, 5, 14, 0.9)),
            radial-gradient(circle at top, rgba(74, 125, 255, 0.22), transparent 36%);
    }
    #start-screen .text-gray-300 {
        color: rgba(225, 238, 255, 0.84);
    }
    h1 {
        line-height: 0.9;
    }
    #reaction-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }
    .feedback-gif {
        position: absolute;
        width: min(24vw, 112px);
        max-width: 112px;
        opacity: 0;
        transform: translateY(16px) scale(0.92);
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.35));
        transition: opacity 0.18s ease, transform 0.18s ease;
        border-radius: 16px;
        mix-blend-mode: screen;
    }
    .feedback-left {
        left: 4vw;
        bottom: 24vh;
    }
    .feedback-right {
        right: 4vw;
        bottom: 24vh;
    }
    .feedback-gif.is-active {
        opacity: 0.88;
        transform: translateY(0) scale(1);
        animation: feedbackPulse 1.1s ease forwards;
    }
    @keyframes feedbackPulse {
        0% { opacity: 0; transform: translateY(18px) scale(0.9); }
        18% { opacity: 0.88; transform: translateY(0) scale(1); }
        75% { opacity: 0.82; transform: translateY(-2px) scale(1.02); }
        100% { opacity: 0; transform: translateY(-10px) scale(0.96); }
    }

    /* UI Layer positioning */
    #ui-layer { pointer-events: none; }

    @media (max-width: 640px) {
        .text-lg { font-size: 1rem; }
        .px-12 { padding-left: 2rem; padding-right: 2rem; }
        .py-4 { padding-top: 0.9rem; padding-bottom: 0.9rem; }
        .feedback-gif {
            width: min(28vw, 84px);
        }
        .feedback-left,
        .feedback-right {
            bottom: 28vh;
        }
    }
</style>
</head>
<body>

<!-- GAME CONTAINER -->
<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI OVERLAY -->
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between">
        
        <!-- Top HUD -->
        <div class="p-4 pt-safe w-full flex justify-between items-start">
            <!-- Score -->
            <div id="hud-stats" class="glass rounded-2xl p-3 text-white hidden flex flex-col items-center min-w-[80px]">
                <div class="text-[10px] uppercase tracking-widest opacity-60 text-blue-300">Sync</div>
                <div class="text-3xl font-semibold text-white" id="score-display">0</div>
            </div>
            
            <!-- Flux Mode Toggle -->
            <button id="flux-btn" class="interactive glass rounded-full w-12 h-12 flex items-center justify-center text-white hidden btn-press">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>
        </div>

        <!-- Start Screen Modal -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md z-50 interactive px-6">
            <div class="text-center mb-8">
                <h1 class="text-6xl font-bold text-white mb-2 tracking-tighter" style="text-shadow: 0 0 30px rgba(74,125,255,0.55), 0 0 50px rgba(255,95,210,0.18);">ORBITAL<br><span class="text-blue-400">LOUNGE</span></h1>
                <p class="text-gray-300 text-lg max-w-xs mx-auto leading-relaxed mt-4">
                    Neon mission control for a cozy orbital shift.<br>
                    Tune the lounge screens, answer comms pings,<br>
                    and feed the station sync with cosmic snacks.
                </p>
            </div>
            <button id="start-btn" class="bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-500 hover:to-teal-400 text-white font-bold py-4 px-12 rounded-full text-xl shadow-[0_0_20px_rgba(59,130,246,0.5)] transform transition hover:scale-105 active:scale-95">
                OPEN SHIFT
            </button>
        </div>
    </div>
</div>

<!-- [agent-note][stage4] repaired: mobile-action-path | action: restored native tap behavior for menu UI while keeping canvas gameplay input scoped -->

<div id="reaction-layer" class="absolute inset-0 z-50" aria-hidden="true">
    <img id="snack-gif" alt="" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" class="feedback-gif feedback-right" decoding="async">
    <img id="message-gif" alt="" src="https://i.giphy.com/MFPZ483I4x41W.webp" class="feedback-gif feedback-left" decoding="async">
</div>

<!-- AUDIO ASSETS -->
<audio id="bgm_chill" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_notify" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_toggle" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>
<audio id="sfx_channel" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<script>
/* 
 * ------------------------------------------------------------------
 * AUDIO ENGINE
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    unlocked: false,
    sounds: {},
    timers: {},
    
    init() {
        this.sounds.bgm = document.getElementById('bgm_chill');
        this.sounds.collect = document.getElementById('sfx_collect');
        this.sounds.notify = document.getElementById('sfx_notify');
        this.sounds.toggle = document.getElementById('sfx_toggle');
        this.sounds.channel = document.getElementById('sfx_channel');
        this.sounds.start = document.getElementById('sfx_start');
        
        const unlock = () => {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            
            this.sounds.bgm.volume = 0.22;
            this.sounds.bgm.play().catch(() => {});
            this.unlocked = true;
            
            window.removeEventListener('pointerdown', unlock);
            window.removeEventListener('touchstart', unlock);
            window.removeEventListener('keydown', unlock);
        };
        
        window.addEventListener('pointerdown', unlock, { once: true });
        window.addEventListener('touchstart', unlock, { once: true });
        window.addEventListener('keydown', unlock, { once: true });
        document.addEventListener('visibilitychange', () => {
            if (!this.sounds.bgm) return;
            if (document.hidden) {
                this.sounds.bgm.pause();
            } else if (this.unlocked && Game.isPlaying) {
                this.sounds.bgm.play().catch(() => {});
            }
        });
    },

    play(key, volume = 0.45) {
        if (!this.unlocked || !this.sounds[key]) return;
        if (key === 'bgm') {
            this.sounds.bgm.play().catch(() => {});
            return;
        }
        const now = performance.now();
        if (this.timers[key] && now - this.timers[key] < 90) return;
        this.timers[key] = now;
        const s = this.sounds[key].cloneNode();
        s.volume = volume;
        s.play().catch(() => {});
    }
};

/* 
 * ------------------------------------------------------------------
 * GAME STATE
 * ------------------------------------------------------------------
 */
const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    lastTime: 0,
    isPlaying: false,
    fluxMode: false,
    feedbackTimers: {
        snack: 0,
        message: 0
    },
    
    score: 0,
    
    // Orbital mechanics
    earthRotation: 0,
    moonAngle: 0,
    issAngle: 0,
    
    particles: [],
    messages: [],
    
    // UI Zones
    tvChannel: 0, // 0: Stars, 1: Aurora, 2: Static
    zones: {
        tv: { x:0, y:0, w:0, h:0, hit:false },
        snack: { x:0, y:0, w:0, h:0, hit:false },
        phone: { x:0, y:0, w:0, h:0, hit:false }
    },

    // Content
    senders: ["Mars", "Venus", "Jupiter", "Voyager 1", "Houston", "Sun"],
    texts: [
        "U up?", "So much water...", "Send pizza.", "I'm red w/ envy", 
        "Spin faster!", "Nice atmosphere", "Humans are loud", "Eclipse soon?",
        "Lookin' blue.", "Goldilocks zone ftw"
    ]
};

/* 
 * ------------------------------------------------------------------
 * INITIALIZATION
 * ------------------------------------------------------------------
 */
function init() {
    Game.canvas = document.getElementById('gameCanvas');
    Game.ctx = Game.canvas.getContext('2d', { alpha: false });
    
    resize();
    window.addEventListener('resize', resize);
    
    Game.canvas.addEventListener('pointerdown', handleInput, { passive: false });
    
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('flux-btn').addEventListener('click', toggleFlux);
    
    AudioSys.init();
    requestAnimationFrame(loop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    Game.width = window.innerWidth;
    Game.height = window.innerHeight;
    
    Game.canvas.width = Game.width * dpr;
    Game.canvas.height = Game.height * dpr;
    
    Game.ctx.scale(dpr, dpr);
    Game.canvas.style.width = `${Game.width}px`;
    Game.canvas.style.height = `${Game.height}px`;
}

function flashGif(id, side) {
    const gif = document.getElementById(id);
    if (!gif) return;
    gif.classList.remove('is-active', 'feedback-left', 'feedback-right');
    gif.classList.add(side);
    void gif.offsetWidth;
    gif.classList.add('is-active');
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud-stats').classList.remove('hidden');
    document.getElementById('hud-stats').classList.add('fade-in');
    document.getElementById('flux-btn').classList.remove('hidden');
    document.getElementById('flux-btn').classList.add('fade-in');
    
    Game.isPlaying = true;
    Game.score = 0;
    updateScore(0);
    AudioSys.play('start', 0.5);
    AudioSys.play('bgm');
}

function toggleFlux() {
    Game.fluxMode = !Game.fluxMode;
    const btn = document.getElementById('flux-btn');
    if (Game.fluxMode) {
        btn.classList.add('bg-blue-500', 'text-black');
        btn.classList.remove('glass', 'text-white');
    } else {
        btn.classList.remove('bg-blue-500', 'text-black');
        btn.classList.add('glass', 'text-white');
    }
    AudioSys.play('toggle', 0.4);
}

function updateScore(amount) {
    Game.score += amount;
    document.getElementById('score-display').innerText = Game.score;
}

/* 
 * ------------------------------------------------------------------
 * LOGIC
 * ------------------------------------------------------------------
 */
function spawnParticle(x, y, color) {
    const count = Game.fluxMode ? 4 : 8;
    for (let i = 0; i < count; i++) {
        Game.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function spawnMessage() {
    const sender = Game.senders[Math.floor(Math.random() * Game.senders.length)];
    const text = Game.texts[Math.floor(Math.random() * Game.texts.length)];
    
    if (Game.messages.length > 2) Game.messages.shift();

    Game.messages.push({
        text: `${sender}: ${text}`,
        life: 3.5,
        x: Game.zones.phone.x + Game.zones.phone.w/2,
        y: Game.zones.phone.y - 20,
        dy: 0
    });
    Game.feedbackTimers.message = 1.3;
    flashGif('message-gif', 'feedback-left');
    AudioSys.play('notify', 0.35);
}

function handleInput(e) {
    if (!Game.isPlaying) return;
    e.preventDefault();
    
    const rect = Game.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const z = Game.zones;
    
    // Check Zones
    // Snack (Center)
    if (hitTest(x, y, z.snack)) {
        z.snack.hit = true;
        updateScore(10);
        spawnParticle(x, y, '#aaddff'); // Cloud bits
        Game.feedbackTimers.snack = 1.2;
        flashGif('snack-gif', 'feedback-right');
        AudioSys.play('collect', 0.46);
        setTimeout(() => z.snack.hit = false, 150);
    }
    
    // Phone (Right)
    if (hitTest(x, y, z.phone)) {
        z.phone.hit = true;
        spawnMessage();
        setTimeout(() => z.phone.hit = false, 150);
    }
    
    // TV (Left)
    if (hitTest(x, y, z.tv)) {
        z.tv.hit = true;
        Game.tvChannel = (Game.tvChannel + 1) % 3;
        spawnParticle(x, y, '#00ffaa');
        AudioSys.play('channel', 0.3);
        setTimeout(() => z.tv.hit = false, 150);
    }
}

function hitTest(x, y, zone) {
    return (x >= zone.x && x <= zone.x + zone.w && y >= zone.y && y <= zone.y + zone.h);
}

function update(dt) {
    if (!Game.isPlaying) return;
    
    Game.feedbackTimers.snack = Math.max(0, Game.feedbackTimers.snack - dt);
    Game.feedbackTimers.message = Math.max(0, Game.feedbackTimers.message - dt);
    
    // Rotation speeds
    Game.earthRotation += dt * 0.1;
    Game.moonAngle += dt * 0.3; // Slow orbit
    Game.issAngle += dt * 0.9;  // Fast orbit
    Game.starDrift = (Game.starDrift || 0) + dt * 6;
    
    // Particles
    for (let i = Game.particles.length - 1; i >= 0; i--) {
        let p = Game.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 1.5;
        if (p.life <= 0) Game.particles.splice(i, 1);
    }
    
    // Messages
    for (let i = Game.messages.length - 1; i >= 0; i--) {
        let m = Game.messages[i];
        m.life -= dt;
        m.dy += dt * 30;
        if (m.life <= 0) Game.messages.splice(i, 1);
    }
}

/* 
 * ------------------------------------------------------------------
 * RENDERING
 * ------------------------------------------------------------------
 */
function draw(dt) {
    const ctx = Game.ctx;
    const w = Game.width;
    const h = Game.height;
    const cx = w / 2;
    const cy = h * 0.4;
    
    // 1. Background
    if (Game.fluxMode) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#003300';
        ctx.lineWidth = 1;
        const step = 40;
        const off = (Date.now() / 50) % step;
        for(let x=0; x<w; x+=step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
        for(let y=off; y<h; y+=step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    } else {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#030714');
        grad.addColorStop(0.45, '#08162f');
        grad.addColorStop(1, '#040913');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        const nebulaA = ctx.createRadialGradient(w * 0.25, h * 0.18, 20, w * 0.25, h * 0.18, w * 0.45);
        nebulaA.addColorStop(0, 'rgba(116, 242, 255, 0.16)');
        nebulaA.addColorStop(1, 'rgba(116, 242, 255, 0)');
        ctx.fillStyle = nebulaA;
        ctx.fillRect(0, 0, w, h);

        const nebulaB = ctx.createRadialGradient(w * 0.8, h * 0.16, 10, w * 0.8, h * 0.16, w * 0.32);
        nebulaB.addColorStop(0, 'rgba(255, 95, 210, 0.14)');
        nebulaB.addColorStop(1, 'rgba(255, 95, 210, 0)');
        ctx.fillStyle = nebulaB;
        ctx.fillRect(0, 0, w, h);

        // Stars
        for(let i=0; i<64; i++) {
            const sx = ((Math.sin(i * 99.1) * w + w) + Game.starDrift * (0.12 + (i % 5) * 0.02)) % w;
            const sy = (Math.cos(i * 33.3) * h + h) % h;
            const a = Math.abs(Math.sin(Game.earthRotation * 0.5 + i));
            ctx.globalAlpha = a * 0.68 + 0.22;
            ctx.fillStyle = i % 7 === 0 ? '#74f2ff' : (i % 11 === 0 ? '#ffd36e' : '#ffffff');
            ctx.beginPath(); ctx.arc(sx, sy, 0.6 + (i % 3) * 0.45, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
    
    // 2. Orbits & Earth
    
    // Orbit Paths
    const moonDist = Math.min(w, h) * 0.32;
    const issDist = Math.min(w, h) * 0.18;
    
    ctx.beginPath();
    ctx.arc(cx, cy, moonDist, 0, Math.PI*2);
    ctx.arc(cx, cy, issDist, 0, Math.PI*2);
    ctx.strokeStyle = Game.fluxMode ? '#00ff00' : 'rgba(255, 255, 255, 0.08)';
    ctx.setLineDash(Game.fluxMode ? [4, 4] : []);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Draw Earth
    const earthR = 60;
    ctx.save();
    ctx.translate(cx, cy);
    if (Game.fluxMode) {
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, earthR, 0, Math.PI*2); ctx.stroke();
        // Wireframe Lat/Lon
        ctx.beginPath(); ctx.ellipse(0, 0, earthR, earthR*0.4, 0, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -earthR); ctx.lineTo(0, earthR); ctx.stroke();
    } else {
        // Atmosphere Glow
        const glow = ctx.createRadialGradient(0, 0, earthR * 0.4, 0, 0, earthR * 1.45);
        glow.addColorStop(0, 'rgba(140, 226, 255, 0.25)');
        glow.addColorStop(0.6, 'rgba(64, 130, 255, 0.32)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(0, 0, earthR * 1.45, 0, Math.PI*2); ctx.fill();

        // Ocean core
        const ocean = ctx.createRadialGradient(-16, -18, 8, 0, 0, earthR);
        ocean.addColorStop(0, '#5ef0ff');
        ocean.addColorStop(0.45, '#1f79ff');
        ocean.addColorStop(1, '#132f77');
        ctx.fillStyle = ocean;
        ctx.beginPath(); ctx.arc(0, 0, earthR, 0, Math.PI*2); ctx.fill();

        // Night edge
        const nightShade = ctx.createLinearGradient(-earthR, -earthR, earthR, earthR);
        nightShade.addColorStop(0, 'rgba(3, 6, 16, 0.05)');
        nightShade.addColorStop(1, 'rgba(3, 6, 16, 0.46)');
        ctx.fillStyle = nightShade;
        ctx.beginPath(); ctx.arc(0, 0, earthR, 0, Math.PI*2); ctx.fill();

        // Continents and cloud bands
        ctx.save();
        ctx.beginPath(); ctx.arc(0, 0, earthR, 0, Math.PI*2); ctx.clip();

        ctx.fillStyle = '#7dffb5';
        for(let i=0; i<5; i++) {
            const ang = i * 1.2 + Game.earthRotation;
            const lx = Math.cos(ang) * 40;
            const ly = Math.sin(ang * 0.7) * 20;
            ctx.beginPath();
            ctx.arc(lx, ly, 25, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.lineWidth = 4;
        for(let i=0; i<3; i++) {
            ctx.beginPath();
            ctx.arc(Math.cos(Game.earthRotation + i) * 16, Math.sin(Game.earthRotation * 0.6 + i) * 18, 34 - i * 5, 0.3, 2.4);
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.58)';
        for(let i=0; i<6; i++) {
            const ang = i * 2.5 - Game.earthRotation * 1.5;
            const cloudX = Math.cos(ang) * 50;
            const cloudY = Math.sin(ang * 1.1) * 30;
            ctx.beginPath();
            ctx.ellipse(cloudX, cloudY, 15, 8, 0, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();

        // Highlight + shadow
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath(); ctx.arc(-18, -18, earthR * 0.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,15,0.42)';
        ctx.beginPath(); ctx.arc(7, 7, earthR, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    
    // 3. Draw ISS
    const issX = cx + Math.cos(Game.issAngle) * issDist;
    const issY = cy + Math.sin(Game.issAngle) * issDist;
    ctx.save();
    ctx.translate(issX, issY);
    ctx.rotate(Game.issAngle + Math.PI/2); // Face tangent
    if (Game.fluxMode) {
        ctx.strokeStyle = '#ffff00';
        ctx.strokeRect(-10, -4, 20, 8); // Panels
        ctx.strokeRect(-3, -3, 6, 6);   // Body
    } else {
        // Solar Panels
        ctx.fillStyle = '#b87333'; // Copper/Gold
        ctx.fillRect(-12, -4, 8, 8);
        ctx.fillRect(4, -4, 8, 8);
        // Module
        ctx.fillStyle = '#cccccc';
        ctx.fillRect(-4, -2, 8, 4);
        ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    }
    ctx.restore();
    
    // 4. Draw Moon
    const moonX = cx + Math.cos(Game.moonAngle) * moonDist;
    const moonY = cy + Math.sin(Game.moonAngle) * moonDist;
    const moonR = 14;
    ctx.save();
    ctx.translate(moonX, moonY);
    if (Game.fluxMode) {
        ctx.strokeStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI*2); ctx.stroke();
    } else {
        ctx.fillStyle = '#aaaaaa';
        ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI*2); ctx.fill();
        // Craters
        ctx.fillStyle = '#888888';
        ctx.beginPath(); ctx.arc(-4, -3, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(5, 2, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(1, 6, 2.5, 0, Math.PI*2); ctx.fill();
        
        // Shadow phase
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.arc(2, 2, moonR, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    
    // 5. UI Items
    drawInteractiveItems(ctx, w, h);
    
    // 6. Particles
    Game.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    // 7. Messages
    ctx.font = "600 16px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    ctx.textAlign = 'center';
    Game.messages.forEach(m => {
        ctx.globalAlpha = Math.min(1, m.life);
        const tw = ctx.measureText(m.text).width + 24;
        
        if (Game.fluxMode) {
            ctx.strokeStyle = '#00ff00';
            ctx.strokeRect(m.x - tw/2, m.y - m.dy - 25, tw, 30);
            ctx.fillStyle = '#00ff00';
        } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath(); 
            ctx.roundRect(m.x - tw/2, m.y - m.dy - 25, tw, 30, 15);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(m.x, m.y - m.dy + 5);
            ctx.lineTo(m.x - 5, m.y - m.dy - 5);
            ctx.lineTo(m.x + 5, m.y - m.dy - 5);
            ctx.fill();
            
            ctx.fillStyle = '#000';
        }
        ctx.fillText(m.text, m.x, m.y - m.dy - 5);
    });
    ctx.globalAlpha = 1;
}

function drawInteractiveItems(ctx, w, h) {
    const floorH = h * 0.25;
    const baseY = h - floorH * 0.6;
    
    // --- TV (Left) ---
    const tvW = w * 0.22; const tvH = tvW * 0.75;
    const tvX = w * 0.15;
    Game.zones.tv = { x: tvX, y: baseY - tvH/2, w: tvW, h: tvH };
    
    ctx.save();
    if (Game.fluxMode) {
        ctx.strokeStyle = '#ff00ff';
        ctx.strokeRect(tvX, baseY - tvH/2, tvW, tvH);
        ctx.fillStyle = '#ff00ff'; ctx.fillText("TV", tvX+tvW/2, baseY+5);
    } else {
        ctx.fillStyle = '#10192f';
        ctx.beginPath(); ctx.roundRect(tvX, baseY - tvH/2, tvW, tvH, 14); ctx.fill();
        ctx.strokeStyle = 'rgba(116,242,255,0.28)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Screen Content
        if (Game.tvChannel === 0) { // Stars
            const screenGrad = ctx.createLinearGradient(tvX, baseY - tvH/2, tvX + tvW, baseY + tvH/2);
            screenGrad.addColorStop(0, '#030714');
            screenGrad.addColorStop(1, '#10244f');
            ctx.fillStyle = screenGrad;
            ctx.fillRect(tvX + 6, baseY - tvH/2 + 6, tvW - 12, tvH - 12);
            ctx.fillStyle = '#74f2ff'; ctx.fillRect(tvX + 12, baseY - 8, 3, 3);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(tvX + 30, baseY + 4, 2, 2);
            ctx.fillStyle = '#ffd36e'; ctx.fillRect(tvX + tvW - 24, baseY - 14, 2, 2);
        } else if (Game.tvChannel === 1) { // Aurora
            const grad = ctx.createLinearGradient(tvX, baseY-tvH/2, tvX, baseY+tvH/2);
            grad.addColorStop(0, '#5af2ff'); grad.addColorStop(0.5, '#8c6bff'); grad.addColorStop(1, '#00b86b');
            ctx.fillStyle = grad;
            ctx.fillRect(tvX + 6, baseY - tvH/2 + 6, tvW - 12, tvH - 12);
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(tvX + 12, baseY - tvH/2 + 12, tvW - 28, 5);
        } else { // Static
            ctx.fillStyle = '#22304d';
            ctx.fillRect(tvX + 6, baseY - tvH/2 + 6, tvW - 12, tvH - 12);
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.13)' : 'rgba(116,242,255,0.12)';
                ctx.fillRect(tvX + 10, baseY - tvH/2 + 10 + i * 6, tvW - 20, 3);
            }
            ctx.fillStyle = '#eff9ff'; ctx.fillText("?", tvX+tvW/2, baseY+5);
        }

        // Antenna
        ctx.strokeStyle = '#79a8ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(tvX+tvW/2, baseY-tvH/2); ctx.lineTo(tvX+tvW/2-8, baseY-tvH/2-12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tvX+tvW/2, baseY-tvH/2); ctx.lineTo(tvX+tvW/2+8, baseY-tvH/2-12); ctx.stroke();
    }
    if (Game.zones.tv.hit) { ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(tvX, baseY-tvH/2, tvW, tvH); }
    ctx.restore();
    
    // --- Snacks (Center) ---
    const snkW = w * 0.18; const snkH = snkW;
    const snkX = w * 0.5 - snkW/2;
    Game.zones.snack = { x: snkX, y: baseY - snkH/2, w: snkW, h: snkH };
    
    ctx.save();
    if (Game.fluxMode) {
        ctx.strokeStyle = '#ffff00';
        ctx.strokeRect(snkX, baseY - snkH/2, snkW, snkH);
        ctx.fillStyle = '#ffff00'; ctx.fillText("YUM", snkX+snkW/2, baseY+5);
    } else {
        ctx.fillStyle = '#dbe8ff';
        ctx.beginPath(); ctx.arc(snkX + snkW/2, baseY + 10, snkW/2, 0, Math.PI, true); ctx.fill();

        ctx.strokeStyle = 'rgba(116,242,255,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(snkX + snkW/2, baseY + 10, snkW/2, Math.PI, Math.PI * 2); ctx.stroke();

        // Contents (bright sync bites)
        ctx.fillStyle = '#ff5fd2';
        ctx.beginPath(); ctx.arc(snkX + snkW/2 - 12, baseY + 5, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#74f2ff';
        ctx.beginPath(); ctx.arc(snkX + snkW/2 + 10, baseY + 4, 9, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffd36e';
        ctx.beginPath(); ctx.arc(snkX + snkW/2 + 1, baseY - 3, 7, 0, Math.PI*2); ctx.fill();
    }
    if (Game.zones.snack.hit) { ctx.globalAlpha=0.5; ctx.fillStyle='#fff'; ctx.fillRect(snkX, baseY-snkH/2, snkW, snkH); ctx.globalAlpha=1; }
    ctx.restore();
    
    // --- Phone (Right) ---
    const phW = w * 0.14; const phH = phW * 1.8;
    const phX = w * 0.85 - phW;
    Game.zones.phone = { x: phX, y: baseY - phH/2, w: phW, h: phH };
    
    ctx.save();
    if (Game.fluxMode) {
        ctx.strokeStyle = '#00ff00';
        ctx.strokeRect(phX, baseY - phH/2, phW, phH);
        ctx.fillStyle = '#00ff00'; ctx.fillText("TXT", phX+phW/2, baseY+5);
    } else {
        ctx.fillStyle = '#1a1f39';
        ctx.beginPath(); ctx.roundRect(phX, baseY - phH/2, phW, phH, 10); ctx.fill();
        ctx.strokeStyle = 'rgba(255,95,210,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = Game.zones.phone.hit ? '#eff9ff' : '#0d1530';
        ctx.fillRect(phX + 4, baseY - phH/2 + 5, phW - 8, phH - 15);
        ctx.fillStyle = 'rgba(116,242,255,0.15)';
        ctx.fillRect(phX + 8, baseY - phH/2 + 12, phW - 16, 8);
        ctx.fillRect(phX + 8, baseY - phH/2 + 26, phW - 20, 5);
        // Notif light
        if (!Game.zones.phone.hit && Math.random() > 0.95) {
            ctx.fillStyle = '#ff5f7a'; ctx.beginPath(); ctx.arc(phX+phW-9, baseY-phH/2+10, 2.5, 0, Math.PI*2); ctx.fill();
        }
    }
    ctx.restore();
}

function loop(timestamp) {
    const dt = (timestamp - Game.lastTime) / 1000 || 0;
    Game.lastTime = timestamp;
    
    update(dt);
    draw(dt);
    
    requestAnimationFrame(loop);
}

window.onload = init;

</script>
</body>
