<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skyline Snack Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- [agent-note][stage4] remapped-font: display -> Russo One, ui/body -> Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #1f2f67;
            --sky-mid: #4067c7;
            --sky-bottom: #87ddff;
            --panel-bg: rgba(13, 24, 61, 0.72);
            --panel-border: rgba(175, 232, 255, 0.8);
            --panel-shadow: rgba(4, 10, 29, 0.38);
            --hud-chip: rgba(7, 15, 44, 0.72);
            --text-main: #f7fbff;
            --text-soft: #d6f1ff;
            --accent: #ffd166;
            --accent-strong: #ff9f43;
            --danger: #ff6b6b;
            --grass-top: #4bc76d;
            --grass-bottom: #1f8d45;
            --road: #1e2550;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 238, 170, 0.32), transparent 26%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
            font-family: 'Exo 2', Arial, sans-serif;
            color: var(--text-main);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 20%, rgba(255,255,255,0.16), transparent 18%),
                radial-gradient(circle at 82% 14%, rgba(255,255,255,0.12), transparent 14%),
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 35%);
            opacity: 0.9;
        }

        canvas {
            display: block;
            touch-action: none;
            transition: transform 100ms ease;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(32, 57, 127, 0.88), rgba(10, 21, 59, 0.82));
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 12px 34px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .text-shadow {
            text-shadow:
                0 2px 0 rgba(8, 16, 49, 0.75),
                0 0 14px rgba(137, 233, 255, 0.22);
        }

        .hidden { display: none !important; }

        .display-font {
            font-family: 'Russo One', 'Trebuchet MS', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .menu-card {
            width: min(90vw, 28rem);
            max-height: min(88vh, 42rem);
            padding: 1.5rem;
            border-radius: 1.75rem;
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 209, 102, 0.18), transparent 40%),
                linear-gradient(315deg, rgba(111, 229, 255, 0.16), transparent 45%);
            pointer-events: none;
        }

        .hero-badge {
            width: 5rem;
            height: 5rem;
            margin: 0 auto 1rem;
            border-radius: 1.5rem;
            display: grid;
            place-items: center;
            font-size: 2.5rem;
            background:
                radial-gradient(circle at 35% 30%, #fff6be, #ffd166 55%, #ff9f43 100%);
            box-shadow:
                0 10px 25px rgba(255, 159, 67, 0.35),
                inset 0 3px 8px rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.55);
            animation: badgeBob 2.4s ease-in-out infinite;
        }

        .title-stack {
            line-height: 0.9;
            font-size: clamp(2.2rem, 9vw, 4.25rem);
        }

        .subtitle-copy {
            font-size: clamp(0.95rem, 3.7vw, 1.15rem);
            color: var(--text-soft);
            margin-bottom: 1.25rem;
            font-weight: 600;
        }

        .flavor-row {
            display: flex;
            justify-content: center;
            gap: 0.65rem;
            flex-wrap: wrap;
            margin-bottom: 1.4rem;
        }

        .flavor-chip {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            color: var(--text-soft);
            border-radius: 999px;
            padding: 0.45rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .arcade-btn {
            min-width: min(100%, 17rem);
            min-height: 3.5rem;
            border: 0;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
            box-shadow: 0 10px 0 rgba(122, 74, 18, 0.95), 0 16px 30px rgba(0, 0, 0, 0.28);
        }

        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 rgba(122, 74, 18, 0.95), 0 10px 18px rgba(0, 0, 0, 0.24);
        }

        .arcade-btn--green {
            box-shadow: 0 10px 0 rgba(19, 108, 75, 0.95), 0 16px 30px rgba(0, 0, 0, 0.28);
        }

        .arcade-btn--green:active {
            box-shadow: 0 6px 0 rgba(19, 108, 75, 0.95), 0 10px 18px rgba(0, 0, 0, 0.24);
        }

        #hud {
            gap: 0.55rem;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.45rem 0.8rem 0.45rem 0.45rem;
            border-radius: 999px;
            background: var(--hud-chip);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 22px rgba(8, 15, 35, 0.28);
        }

        .hud-icon {
            width: 2rem;
            height: 2rem;
            border-radius: 999px;
            display: grid;
            place-items: center;
            font-size: 1rem;
            background: linear-gradient(180deg, #fff7cc, #ffd166);
            border: 2px solid rgba(255,255,255,0.55);
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.5);
        }

        .hud-score {
            font-family: 'Russo One', 'Trebuchet MS', sans-serif;
            font-size: clamp(1.1rem, 4vw, 1.55rem);
            color: #fffdf4;
            line-height: 1;
        }

        .gif-burst {
            position: absolute;
            z-index: 35;
            width: clamp(4.5rem, 18vw, 7rem);
            height: clamp(4.5rem, 18vw, 7rem);
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.7);
            box-shadow: 0 10px 28px rgba(3, 9, 25, 0.4);
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.85);
            transition: opacity 180ms ease, transform 180ms ease;
            background: rgba(8, 18, 42, 0.28);
        }

        .gif-burst.visible {
            opacity: 0.95;
            transform: translate(-50%, -50%) scale(1);
        }

        .gif-burst--collect {
            top: clamp(4.25rem, 13vw, 6rem);
            right: clamp(0.75rem, 3vw, 1.5rem);
            left: auto;
            transform: translate(0, 0) scale(0.85);
        }

        .gif-burst--collect.visible {
            transform: translate(0, 0) scale(1);
        }

        .gif-burst--fail {
            top: 50%;
            left: 50%;
            width: min(34vw, 8rem);
            height: min(34vw, 8rem);
        }

        .score-flare {
            animation: scorePulse 220ms ease;
        }

        .game-over-copy {
            font-size: clamp(1rem, 4vw, 1.4rem);
            color: var(--text-soft);
            font-weight: 700;
        }

        @keyframes badgeBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes scorePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @media (max-width: 640px) {
            #hud {
                top: env(safe-area-inset-top, 0.75rem);
                left: 0.75rem;
            }

            .menu-card {
                width: min(92vw, 24rem);
                padding: 1.25rem 1rem;
                border-radius: 1.5rem;
            }

            .hero-badge {
                width: 4.25rem;
                height: 4.25rem;
                font-size: 2.2rem;
                margin-bottom: 0.85rem;
            }

            .flavor-chip {
                font-size: 0.72rem;
                padding: 0.38rem 0.7rem;
            }

            .arcade-btn {
                min-height: 3.25rem;
                padding-inline: 1rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

<script>
/**
 * THE CHAMELEON ENGINE - CORE LOGIC
 */

// --- Global State & Config ---
let gameConfig = {};
let canvas, ctx;
let lastTime = 0;
let animationId;
let isPlaying = false;
let isGameOver = false;
let score = 0;
let gameSpeedMultiplier = 1;
let frames = 0;
const ENABLE_ANIMATIONS = true;

// Entities
let player = { x: 0, y: 0, w: 60, h: 60, vy: 0, grounded: true, rotation: 0 };
let obstacles = [];
let collectibles = [];
let particles = [];
let clouds = [];

// Audio Context
let audioCtx;
let lastLandGrounded = true;
let gifTimers = {};

// --- §3.2 Configuration Interface ---
function initConfig() {
    const el = document.getElementById('game-config');
    if (!el) return;
    try {
        const defs = JSON.parse(el.textContent);
        window.gameConfigDefs = defs;
        window.gameConfig = {};
        for (const key in defs) {
            window.gameConfig[key] = defs[key].value;
        }
    } catch (e) {
        console.error("Config parse error", e);
        // Fallback defaults
        window.gameConfig = { gameSpeed: 350, jumpForce: 750, gravity: 2000, themeColor: "#FFB74D" };
    }
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig && window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            document.getElementById('start-btn').style.backgroundColor = val;
        }
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.enabled = false;
        this.bgmPlaying = false;
        this.lastPlayedAt = {};
        this.cooldowns = {
            sfx_jump: 110,
            sfx_land: 100,
            sfx_collect: 90,
            sfx_fail: 220,
            sfx_ui: 120
        };
    }

    init() {
        if (this.enabled) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            audioCtx = new AudioContext();
        }
        this.enabled = true;
    }

    unlock() {
        this.init();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
    }

    playBgm() {
        this.unlock();
        const bgm = document.getElementById('bgm_main');
        if (bgm && !this.bgmPlaying) {
            bgm.volume = 0.2;
            bgm.play().then(() => {
                this.bgmPlaying = true;
            }).catch(() => {});
        }
    }

    stopBgm(reset = true) {
        const bgm = document.getElementById('bgm_main');
        if (bgm) {
            bgm.pause();
            if (reset) bgm.currentTime = 0;
            this.bgmPlaying = false;
        }
    }

    playSfx(id, fallbackType, volume = 0.55) {
        this.unlock();
        const now = performance.now();
        const cooldown = this.cooldowns[id] || 0;
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        const el = document.getElementById(id);
        if (el && el.src) {
            const clone = el.cloneNode();
            clone.volume = volume;
            clone.play().catch(() => this.synthesize(fallbackType));
        } else {
            this.synthesize(fallbackType);
        }
    }

    synthesize(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'collect') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'land') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.09);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
        } else if (type === 'ui') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(920, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }
}

const audioManager = new AudioManager();

// --- Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    initConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    resize();
    window.addEventListener('resize', resize);
    
    // Input Binding
    const container = document.getElementById('game-container');
    container.addEventListener('pointerdown', handleInput, { passive: false });
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handleInput(e);
    });

    // UI Binding
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    // Initial Render
    requestAnimationFrame(loop);
});

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Reset ground level based on height
    if (!isPlaying) {
        player.y = window.innerHeight - 150;
    }
}

function showGifBurst(id, duration = 900) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('visible');
    clearTimeout(gifTimers[id]);
    gifTimers[id] = setTimeout(() => {
        el.classList.remove('visible');
    }, duration);
}

function handleInput(e) {
    const interactiveTarget = e.target.closest && e.target.closest('button, a, input, select, textarea, [role="button"]');
    if (interactiveTarget) return;
    if (e.type === 'pointerdown') e.preventDefault();
    
    // Audio Unlock
    audioManager.unlock();

    if (!isPlaying || isGameOver) return;

    if (player.grounded) {
        player.vy = -window.gameConfig.jumpForce;
        player.grounded = false;
        createParticles(player.x + player.w/2, player.y + player.h, 5, '#FFF');
        audioManager.playSfx('sfx_jump', 'jump', 0.45);
    }
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('collect-gif').classList.remove('visible');
    document.getElementById('fail-gif').classList.remove('visible');
    
    audioManager.playSfx('sfx_ui', 'ui', 0.4);
    audioManager.playBgm();
    
    // Reset State
    score = 0;
    gameSpeedMultiplier = 1;
    document.getElementById('score').innerText = '0';
    
    player = {
        x: window.innerWidth * 0.15,
        y: window.innerHeight - 150,
        w: 60,
        h: 60,
        vy: 0,
        grounded: true,
        rotation: 0
    };
    
    obstacles = [];
    collectibles = [];
    particles = [];
    clouds = [];
    
    // Init Clouds
    for(let i=0; i<5; i++) {
        clouds.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * (window.innerHeight/2),
            speed: 10 + Math.random() * 20,
            size: 0.5 + Math.random() * 0.5
        });
    }

    isPlaying = true;
    isGameOver = false;
    lastLandGrounded = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function gameOver() {
    isPlaying = false;
    isGameOver = true;
    audioManager.stopBgm();
    audioManager.playSfx('sfx_fail', 'fail', 0.6);
    showGifBurst('fail-gif', 1500);

    // Shake effect
    canvas.style.transform = 'translate(5px, 5px)';
    setTimeout(() => canvas.style.transform = 'translate(-5px, -5px)', 50);
    setTimeout(() => canvas.style.transform = 'none', 100);

    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = score;
}

// --- Game Loop ---
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (err) {
        console.error("Game Loop Error:", err);
    }

    if (isPlaying || !isGameOver) {
        animationId = requestAnimationFrame(loop);
    }
}

function update(dt) {
    if (!isPlaying) return;

    frames++;
    const groundY = window.innerHeight - 100;
    const currentSpeed = window.gameConfig.gameSpeed * gameSpeedMultiplier;

    // Player Physics
    player.vy += window.gameConfig.gravity * dt;
    player.y += player.vy * dt;
    
    // Ground Collision
    if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.grounded = true;
        player.rotation = 0;
    } else {
        player.grounded = false;
        // Rotate slightly when jumping
        player.rotation = Math.min(Math.PI / 6, player.vy * 0.002);
    }

    if (!lastLandGrounded && player.grounded) {
        audioManager.playSfx('sfx_land', 'land', 0.32);
    }
    lastLandGrounded = player.grounded;

    // Spawn Logic
    if (frames % Math.floor(100 / gameSpeedMultiplier) === 0) {
        if (Math.random() < 0.4) {
            // Spawn Obstacle
            obstacles.push({
                x: window.innerWidth + 50,
                y: groundY - 50,
                w: 40,
                h: 50,
                passed: false
            });
        } else {
            // Spawn Collectible
            collectibles.push({
                x: window.innerWidth + 50,
                y: groundY - 120 - (Math.random() * 100), // Variable height
                w: 40,
                h: 20,
                angle: 0
            });
        }
    }

    // Update Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= currentSpeed * dt;

        // Collision
        if (checkCollision(player, obs)) {
            gameOver();
            return;
        }

        // Remove off-screen
        if (obs.x + obs.w < 0) obstacles.splice(i, 1);
    }

    // Update Collectibles
    for (let i = collectibles.length - 1; i >= 0; i--) {
        let col = collectibles[i];
        col.x -= currentSpeed * dt;
        col.angle += 5 * dt;

        // Collision
        if (checkCollision(player, col)) {
            score++;
            const scoreEl = document.getElementById('score');
            scoreEl.innerText = score;
            if (ENABLE_ANIMATIONS) {
                scoreEl.classList.remove('score-flare');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('score-flare');
            }
            gameSpeedMultiplier += 0.01; // Increase difficulty
            
            // Juice
            createParticles(col.x, col.y, 10, '#FFD700');
            audioManager.playSfx('sfx_collect', 'collect', 0.5);
            showGifBurst('collect-gif', 820);
            
            collectibles.splice(i, 1);
        } else if (col.x + col.w < 0) {
            collectibles.splice(i, 1);
        }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update Clouds (Parallax)
    clouds.forEach(c => {
        c.x -= c.speed * dt;
        if (c.x < -100) c.x = window.innerWidth + 100;
    });
}

function checkCollision(a, b) {
    // Shrink hitboxes slightly for forgiveness
    const padding = 10;
    return (
        a.x + padding < b.x + b.w - padding &&
        a.x + a.w - padding > b.x + padding &&
        a.y + padding < b.y + b.h - padding &&
        a.y + a.h - padding > b.y + padding
    );
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            life: 0.5 + Math.random() * 0.3,
            color: color,
            size: Math.random() * 5 + 2
        });
    }
}

// --- Drawing ---
function draw() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const groundY = height - 100;

    const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
    skyGradient.addColorStop(0, '#1f2f67');
    skyGradient.addColorStop(0.5, '#4067c7');
    skyGradient.addColorStop(1, '#87ddff');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, width, height);

    const sunGlow = ctx.createRadialGradient(width * 0.78, height * 0.18, 10, width * 0.78, height * 0.18, 120);
    sunGlow.addColorStop(0, 'rgba(255, 242, 184, 0.95)');
    sunGlow.addColorStop(0.45, 'rgba(255, 209, 102, 0.4)');
    sunGlow.addColorStop(1, 'rgba(255, 209, 102, 0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(width * 0.78, height * 0.18, 120, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 30 * c.size, 0, Math.PI * 2);
        ctx.arc(c.x + 20 * c.size, c.y - 10 * c.size, 40 * c.size, 0, Math.PI * 2);
        ctx.arc(c.x + 50 * c.size, c.y, 30 * c.size, 0, Math.PI * 2);
        ctx.fill();
    });

    const skylineBase = groundY - 12;
    const buildings = [0.12, 0.2, 0.11, 0.18, 0.28, 0.14, 0.24, 0.16];
    let cursor = -20;
    buildings.forEach((ratio, index) => {
        const bWidth = width * (0.08 + (index % 3) * 0.02);
        const bHeight = height * ratio;
        ctx.fillStyle = index % 2 === 0 ? 'rgba(18, 32, 78, 0.76)' : 'rgba(26, 46, 102, 0.64)';
        ctx.fillRect(cursor, skylineBase - bHeight, bWidth, bHeight);
        ctx.fillStyle = 'rgba(255, 224, 130, 0.45)';
        for (let wy = skylineBase - bHeight + 10; wy < skylineBase - 10; wy += 16) {
            for (let wx = cursor + 8; wx < cursor + bWidth - 8; wx += 14) {
                if ((wx + wy + index) % 3 === 0) {
                    ctx.fillRect(wx, wy, 6, 8);
                }
            }
        }
        cursor += bWidth * 0.8;
    });

    ctx.fillStyle = '#1e2550';
    ctx.fillRect(0, groundY - 26, width, 34);

    ctx.fillStyle = '#fce38a';
    for (let i = 0; i < width + 60; i += 60) {
        ctx.fillRect((i - (frames * 6) % 60), groundY - 12, 24, 4);
    }

    const groundGradient = ctx.createLinearGradient(0, groundY, 0, height);
    groundGradient.addColorStop(0, '#4bc76d');
    groundGradient.addColorStop(1, '#1f8d45');
    ctx.fillStyle = groundGradient;
    ctx.fillRect(0, groundY, width, 100);

    ctx.fillStyle = '#8edb73';
    for (let i = 0; i < width; i += 44) {
        ctx.fillRect((i - (frames * 2) % 44), groundY + 2, 28, 8);
    }

    ctx.save();
    ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
    ctx.rotate(player.rotation);

    const pImg = document.getElementById('asset_player');
    if (pImg && pImg.complete && pImg.naturalWidth > 0 && pImg.src.length > 1000) {
        ctx.drawImage(pImg, -player.w / 2, -player.h / 2, player.w, player.h);
    } else {
        const legOffset = Math.sin(frames * 0.5) * 4;
        const tailWag = Math.sin(frames * 0.35) * 0.4;
        const scarfLift = player.grounded ? 0 : -4;

        ctx.strokeStyle = '#6b3f1f';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-22, 0);
        ctx.quadraticCurveTo(-34, -8, -30, -22 + tailWag * 10);
        ctx.stroke();

        const bodyGrad = ctx.createLinearGradient(-18, -10, 26, 18);
        bodyGrad.addColorStop(0, '#ffcf7b');
        bodyGrad.addColorStop(1, '#f28b39');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(-2, 6, 24, 17, -0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff4d6';
        ctx.beginPath();
        ctx.ellipse(6, 10, 11, 7, -0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f28b39';
        ctx.beginPath();
        ctx.arc(17, -7, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#8a4d26';
        ctx.beginPath();
        ctx.ellipse(8, -20, 6, 12, -0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(23, -22, 5, 11, 0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(21, -10, 4.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1c2348';
        ctx.beginPath();
        ctx.arc(22.4, -10.5, 2.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#e8505b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(2, -2 + scarfLift);
        ctx.lineTo(23, 0 + scarfLift);
        ctx.stroke();
        ctx.fillStyle = '#ff6b6b';
        ctx.fillRect(2, -6 + scarfLift, 13, 6);

        ctx.fillStyle = '#3b2a22';
        ctx.beginPath();
        ctx.arc(29, -4, 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#a75b2c';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-10, 18);
        ctx.lineTo(-12 + legOffset, 29);
        ctx.moveTo(4, 18);
        ctx.lineTo(2 - legOffset, 29);
        ctx.moveTo(10, 16);
        ctx.lineTo(12 + legOffset, 27);
        ctx.stroke();
    }
    ctx.restore();

    obstacles.forEach(obs => {
        const oImg = document.getElementById('asset_obstacle');
        if (oImg && oImg.complete && oImg.naturalWidth > 0 && oImg.src.length > 1000) {
             ctx.drawImage(oImg, obs.x, obs.y, obs.w, obs.h);
        } else {
            const obstacleGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.h);
            obstacleGrad.addColorStop(0, '#ff8f70');
            obstacleGrad.addColorStop(1, '#c44536');
            ctx.fillStyle = obstacleGrad;
            ctx.fillRect(obs.x + 10, obs.y + 6, 20, 34);
            ctx.fillRect(obs.x + 6, obs.y + 10, 6, 10);
            ctx.fillRect(obs.x + 28, obs.y + 10, 6, 10);
            ctx.fillStyle = '#ffb199';
            ctx.beginPath();
            ctx.arc(obs.x + 20, obs.y + 6, 10, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#ffd166';
            ctx.fillRect(obs.x + 15, obs.y + 18, 10, 5);
            ctx.fillRect(obs.x + 14, obs.y + 28, 12, 5);
        }
    });

    collectibles.forEach(col => {
        const cImg = document.getElementById('asset_collectible');
        const bounceY = Math.sin(frames * 0.1) * 5;

        ctx.save();
        ctx.translate(col.x + col.w / 2, col.y + col.h / 2 + bounceY);
        ctx.rotate(col.angle);

        if (cImg && cImg.complete && cImg.naturalWidth > 0 && cImg.src.length > 1000) {
            ctx.drawImage(cImg, -col.w / 2, -col.h / 2, col.w, col.h);
        } else {
            ctx.shadowColor = 'rgba(255, 240, 170, 0.85)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#fff6d6';
            ctx.beginPath();
            ctx.rect(-10, -5, 20, 10);
            ctx.arc(-10, -5, 6, 0, Math.PI * 2);
            ctx.arc(-10, 5, 6, 0, Math.PI * 2);
            ctx.arc(10, -5, 6, 0, Math.PI * 2);
            ctx.arc(10, 5, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        ctx.restore();
    });

    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
}

</script>
