  --vds-surface-text: #eaf6ff;
  --vds-overlay: rgba(2, 10, 20, 0.72);
  --vds-accent: #5df2ff;
  --vds-accent2: #8b6bff;
  --vds-accent3: #ffd166;
  --vds-danger: #ff6b7a;
  --vds-panel-border: rgba(147, 228, 255, 0.4);
  --vds-radius-lg: 16px;
  --vds-radius-xl: 20px;
  --vds-space-8: 8px;
  --vds-space-12: 12px;
  --vds-space-16: 16px;
  --vds-space-24: 24px;
  --vds-space-32: 32px;
  --vds-font-display: "Audiowide", "Trebuchet MS", sans-serif;
  --vds-font-body: "Exo 2", "Segoe UI", sans-serif;
  --vds-font-family: var(--vds-font-body);
}

html,
body {
  height: 100%;
  background: var(--vds-bg);
  color: var(--vds-text);
  margin: 0;
  padding: 0;
  touch-action: manipulation;
  font-family: var(--vds-font-body);
}

body {
  overflow: hidden;
}

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
}

button {
  font-family: var(--vds-font-body);
}

#root {
  width: 100%;
  height: 100%;
}

.vds-shell {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 15%, rgba(93, 242, 255, 0.16), transparent 24%),
    radial-gradient(circle at 78% 18%, rgba(139, 107, 255, 0.2), transparent 26%),
    linear-gradient(180deg, rgba(4, 18, 38, 0.2), rgba(3, 13, 24, 0.4));
}

.vds-shell::before,
.vds-shell::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.vds-shell::before {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08), transparent 28%),
    repeating-linear-gradient(
      90deg,
      transparent 0 36px,
      rgba(93, 242, 255, 0.05) 36px 37px

  opacity: 0.7;
}

.vds-shell::after {
  inset: auto 0 0 0;
  height: 24vh;
  background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.28) 100%);
}

.vds-canvas-frame {
  position: relative;
  width: 100%;
  height: 100%;
}

.vds-canvas-frame canvas {
  display: block;
}

.vds-top-brand {
  position: fixed;
  top: max(10px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 12px;
  border: 1px solid rgba(147, 228, 255, 0.24);
  border-radius: 999px;
  background: rgba(4, 17, 33, 0.32);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 18px rgba(93, 242, 255, 0.08);
}

.vds-top-brand__eyebrow {
  font-size: 11px;
  line-height: 1;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(196, 244, 255, 0.86);
}

.vds-top-brand__title {
  font-family: var(--vds-font-display);
  font-size: clamp(16px, 4vw, 22px);
  line-height: 1;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #ffffff;
  text-shadow: 0 0 12px rgba(93, 242, 255, 0.4);
}

.vds-results-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--vds-panel-border);
  background:
    linear-gradient(180deg, rgba(18, 44, 79, 0.96), rgba(6, 20, 37, 0.98)),
    var(--vds-surface);
  box-shadow:
    0 28px 80px rgba(0, 0, 0, 0.5),
    inset 0 0 0 1px rgba(255,255,255,0.04);
}

.vds-results-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at top, rgba(93, 242, 255, 0.16), transparent 35%),
    linear-gradient(135deg, transparent 0 45%, rgba(255,255,255,0.05) 45% 48%, transparent 48% 100%);
  pointer-events: none;
}

.vds-button {
  min-width: min(240px, 100%);
  max-width: 100%;
  white-space: normal;
  text-wrap: balance;
}

@media (max-width: 640px) {
  .vds-top-brand {

    width: min(92vw, 280px);
  }

  .vds-top-brand__title {

  }

  .vds-results-card {
    min-width: min(280px, calc(100vw - 32px)) !important;
    width: min(360px, calc(100vw - 32px));
    padding: 20px !important;
  }
}

.vds-feedback-gif {
  position: fixed;
  right: 12px;
  bottom: max(14px, env(safe-area-inset-bottom));
  width: min(26vw, 140px);
  border-radius: 14px;
  border: 1px solid rgba(147, 228, 255, 0.38);
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);

  background: rgba(2, 10, 20, 0.82);
  pointer-events: none;
  z-index: 3;

  transform: translateY(14px) scale(0.96);

}

.vds-feedback-gif--visible {
  opacity: 0.96;
  transform: translateY(0) scale(1);
}

.vds-feedback-gif--impact {
  width: min(22vw, 116px);
  right: 10px;
  bottom: max(88px, calc(env(safe-area-inset-bottom) + 80px));
}

.vds-feedback-gif--celebration {
  width: min(32vw, 180px);
  right: 16px;
  bottom: max(18px, env(safe-area-inset-bottom));
}

@media (max-width: 640px) {
  .vds-feedback-gif--impact {
    width: min(28vw, 104px);
    bottom: max(82px, calc(env(safe-area-inset-bottom) + 72px));
  }

  .vds-feedback-gif--celebration {
    width: min(40vw, 148px);
  }
}
