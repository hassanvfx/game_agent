<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cloud Courier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --sky-top: #5b7cff;
        --sky-mid: #7fd5ff;
        --sky-bottom: #dff7ff;
        --panel-bg: rgba(8, 17, 45, 0.66);
        --panel-border: rgba(165, 231, 255, 0.78);
        --panel-shadow: rgba(10, 18, 44, 0.36);
        --hud-glow: rgba(94, 234, 212, 0.25);
        --text-primary: #eef8ff;
        --text-secondary: #d7e8ff;
        --text-dark: #10203f;
        --accent-gold: #ffd54a;
        --accent-coral: #ff8474;
        --accent-mint: #76ffd0;
        --accent-blue: #7fd5ff;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 255, 255, 0.55), transparent 38%),
            linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 58%, var(--sky-bottom) 100%);
        font-family: 'Exo 2', system-ui, sans-serif;
    }

    body {
        color: var(--text-dark);
    }

    canvas {
        display: block;
        touch-action: none;
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(10, 24, 60, 0.84), rgba(18, 36, 78, 0.72));
        backdrop-filter: blur(12px);
        border: 2px solid var(--panel-border);
        box-shadow:
            0 16px 40px var(--panel-shadow),
            inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .hidden { display: none !important; }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        overflow: hidden;
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
    }

    #game-container::before {
        background:
            radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.45) 0 4px, transparent 5px),
            radial-gradient(circle at 82% 20%, rgba(255, 255, 255, 0.35) 0 3px, transparent 4px),
            radial-gradient(circle at 65% 10%, rgba(255, 255, 255, 0.32) 0 2px, transparent 3px),
            radial-gradient(circle at 28% 78%, rgba(255, 255, 255, 0.24) 0 3px, transparent 4px);
        opacity: 0.9;
        animation: driftStars 12s linear infinite;
    }

    #game-container::after {
        background:
            radial-gradient(circle at 18% 100%, rgba(255, 255, 255, 0.3), transparent 28%),
            radial-gradient(circle at 84% 0%, rgba(255, 255, 255, 0.22), transparent 26%);
        mix-blend-mode: screen;
        opacity: 0.7;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: max(0.8rem, env(safe-area-inset-top)) max(0.8rem, env(safe-area-inset-right)) max(0.8rem, env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
        box-sizing: border-box;
    }

    .panel {
        position: relative;
        padding: 2rem;
        border-radius: 1.5rem;
        text-align: center;
        pointer-events: auto;
        max-width: min(90vw, 31rem);
        color: var(--text-primary);
        overflow: hidden;
        isolation: isolate;
    }

    .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at top, rgba(127, 213, 255, 0.18), transparent 45%),
            linear-gradient(135deg, rgba(118, 255, 208, 0.12), transparent 40%);
        pointer-events: none;
        z-index: -1;
    }

    .panel.interactive {
        transition: transform 0.2s ease;
    }

    .panel.interactive:hover {
        transform: scale(1.05);
    }

    .title {
        margin: 0 0 0.5rem;
        font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
        font-size: clamp(2.3rem, 8vw, 4rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.16rem;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(127, 213, 255, 0.55), 0 6px 18px rgba(4, 12, 34, 0.55);
    }

    .subtitle {
        margin: 0 0 0.6rem;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--accent-mint);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .microcopy {
        margin: 0 0 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.45;
        color: var(--text-secondary);
    }

    .pulse {
        animation: pulse 1.4s ease-in-out infinite;
    }

    .btn {
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 2rem;
        font-family: 'Exo 2', system-ui, sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.28);
        transform: translateY(0);
        transition: transform 0.1s ease, filter 0.15s ease, box-shadow 0.15s ease;
        cursor: pointer;
    }

    .btn:hover {
        filter: brightness(1.05);
        box-shadow: 0 16px 30px rgba(15, 23, 42, 0.32);
    }
    .btn:active { transform: scale(0.97); }

    .btn-start {
        background: linear-gradient(180deg, #ffe269, #ffbb2f);
        color: #4b2b00;
        border-bottom: 4px solid #d98300;
    }

    .btn-restart {
        background: linear-gradient(180deg, #7cf4ce, #17c98d);
        color: #083723;
        border-bottom: 4px solid #0f8d63;
    }

    .game-over-title {
        margin: 0 0 1rem;
        font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
        font-size: clamp(2rem, 7vw, 3.1rem);
        color: #ffd5cb;
        text-shadow: 0 0 18px rgba(255, 132, 116, 0.45);
    }

    .stat-line {
        margin-bottom: 0.45rem;
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text-primary);
    }

    .stat-line.small {
        margin-bottom: 1.5rem;
        font-size: 1rem;
        color: var(--text-secondary);
    }

    .accent {
        color: var(--accent-gold);
    }

    /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
    #hud {
        position: absolute;
        top: 1rem;
        left: 1rem;
        pointer-events: none;
    }

    .hud-badge {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.55rem 0.95rem;
        border-radius: 999px;
        border: 1px solid rgba(118, 255, 208, 0.5);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 8px 24px var(--hud-glow);
    }

    .hud-icon {
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 999px;
        border: 2px solid rgba(255, 212, 74, 0.72);
        background: radial-gradient(circle at 30% 30%, #fff3a7, var(--accent-gold));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: 700;
        color: #714100;
        box-shadow: 0 0 14px rgba(255, 213, 74, 0.35);
    }

    #score {
        font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 0 12px rgba(127, 213, 255, 0.5);
    }

    .hud-label {
        margin-right: 0.1rem;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.18em;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
    }

    @keyframes driftStars {
        from { transform: translateX(0); }
        to { transform: translateX(-140px); }
    }

    #feedback-stack {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        pointer-events: none;
        align-items: flex-end;
    }

    .feedback-card {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.45rem 0.65rem;
        border-radius: 1rem;
        color: var(--text-primary);
        max-width: min(42vw, 12rem);
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .feedback-card.show {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .feedback-card img {
        width: 3rem;
        height: 3rem;
        border-radius: 0.8rem;
        object-fit: cover;
        flex: 0 0 auto;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
    }

    .feedback-card span {
        font-family: 'Exo 2', system-ui, sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    @media (max-width: 640px) {
        .panel {
            width: min(88vw, 24rem);
            padding: 1.35rem;
        }

        .title {
            font-size: clamp(2rem, 12vw, 2.8rem);
            letter-spacing: 0.12rem;
        }

        .subtitle {
            font-size: 1rem;
        }

        .microcopy {
            font-size: 0.95rem;
        }

        .btn {
            font-size: 1rem;
            width: 100%;
        }

        .stat-line {
            font-size: 1.15rem;
        }

        #hud {
            top: 0.75rem;
            left: 0.75rem;
        }

        #feedback-stack {
            right: 0.75rem;
            bottom: calc(0.75rem + env(safe-area-inset-bottom));
            gap: 0.5rem;
        }

        .feedback-card {
            max-width: min(52vw, 10.5rem);
            padding: 0.4rem 0.55rem;
        }

        .feedback-card img {
            width: 2.5rem;
            height: 2.5rem;
        }

        .feedback-card span {
            font-size: 0.82rem;
        }
    }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="start-screen" class="glass panel interactive">
            <h1 class="title">CLOUD COURIER</h1>
            <p class="subtitle">Hop across the skyline and grab every lost package tag.</p>
            <p class="microcopy pulse">Tap or press Space to boost. Jump again in midair to stay on route.</p>
            <button id="start-btn" class="btn btn-start">START RUN</button>
        </div>

        <div id="game-over-screen" class="hidden glass panel">
            <h2 class="game-over-title">ROUTE MISSED</h2>
            <div class="stat-line">Packages Saved: <span id="finalScore" class="accent">0</span></div>
            <div class="stat-line small">Best Route: <span id="bestScore">0</span></div>
            <button id="restart-btn" class="btn btn-restart">TRY AGAIN</button>
        </div>

        <div id="hud" class="hidden">
            <div class="glass hud-badge">
                <div class="hud-icon">✦</div>
                <span class="hud-label">Route</span>
                <span id="score">0</span>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: pickup + fail feedback overlays from catalogs/gifs.json -->
        <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
        <div id="feedback-stack" aria-live="polite">
            <div id="pickup-feedback" class="feedback-card hidden glass" aria-hidden="true">
                <img src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Celebration reaction for package pickup">
                <span>Delivery bonus!</span>
            </div>
            <div id="fail-feedback" class="feedback-card hidden glass" aria-hidden="true">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Comical fail reaction">
                <span>Route missed!</span>
            </div>
        </div>
    </div>
</div>

<script>
// §3.2 Configuration Interface
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') document.body.style.background = val;
    }
};

document.addEventListener('DOMContentLoaded', () => {
    // §2 Technical Contract: Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const ui = {
        start: document.getElementById('start-screen'),
        over: document.getElementById('game-over-screen'),
        hud: document.getElementById('hud'),
        score: document.getElementById('score'),
        finalScore: document.getElementById('finalScore'),
        bestScore: document.getElementById('bestScore'),
        startBtn: document.getElementById('start-btn'),
        restartBtn: document.getElementById('restart-btn')
    };

    let animationId;
    let lastTime = 0;

    // Game State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('skyhopper_best') || 0;

    // Physics & World
    let cameraX = 0;
    let shake = 0;

    // Entities
    let player = {
        x: 100, y: 300, w: 40, h: 40,
        vy: 0,
        grounded: false,
        jumps: 0,
        rotation: 0,
        scaleY: 1
    };

    let platforms = [];
    let coins = [];
    let particles = [];
    let clouds = [];

    const feedback = {
        pickup: document.getElementById('pickup-feedback'),
        fail: document.getElementById('fail-feedback')
    };

    // Audio System
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        jump: document.getElementById('sfx_jump'),
        land: document.getElementById('sfx_land'),
        coin: document.getElementById('sfx_coin'),
        start: document.getElementById('sfx_start'),
        restart: document.getElementById('sfx_restart'),
        dead: document.getElementById('sfx_dead')
    };
    const soundVolumes = {
        bgm: 0.2,
        jump: 0.4,
        land: 0.28,
        coin: 0.42,
        start: 0.36,
        restart: 0.3,
        dead: 0.42
    };
    let audioUnlocked = false;
    let lastLandAt = 0;
    let feedbackTimers = {};

    Object.entries(sounds).forEach(([key, el]) => {
        if (el) {
            el.volume = soundVolumes[key] ?? 0.35;
            if (key === 'bgm') el.loop = true;
        }
    });

    const ensureAudioReady = () => {
        audioUnlocked = true;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
    };

    const playSound = (id) => {
        const el = sounds[id];
        if (!el) return;

        if (id === 'bgm') {
            el.play().catch(() => {});
            return;
        }

        try {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => {
                if (id === 'coin' || id === 'start' || id === 'restart') synthesize('beep');
                if (id === 'jump') synthesize('jump');
                if (id === 'land') synthesize('land');
                if (id === 'dead') synthesize('explosion');
            });
        } catch (_) {
            if (id === 'dead') synthesize('explosion');
        }
    };

    const syncBgm = () => {
        if (!sounds.bgm) return;
        if (gameState === 'PLAYING' && audioUnlocked) {
            if (sounds.bgm.paused) {
                sounds.bgm.play().catch(() => {});
            }
        } else if (!sounds.bgm.paused) {
            sounds.bgm.pause();
        }
    };

    const showFeedback = (type, label) => {
        const card = feedback[type];
        if (!card) return;
        const text = card.querySelector('span');
        if (text && label) text.textContent = label;
        card.classList.remove('hidden');
        card.classList.add('show');
        card.setAttribute('aria-hidden', 'false');
        clearTimeout(feedbackTimers[type]);
        feedbackTimers[type] = setTimeout(() => {
            card.classList.remove('show');
            card.setAttribute('aria-hidden', 'true');
            setTimeout(() => card.classList.add('hidden'), 180);
        }, type === 'fail' ? 2200 : 1100);
    };

    const synthesize = (type) => {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'beep') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(760, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1220, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
        } else if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(320, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(720, audioCtx.currentTime + 0.11);
            gain.gain.setValueAtTime(0.045, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        } else if (type === 'land') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.045, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    };

    // Resize Handler
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    const handleInput = (e) => {
        if (e.type !== 'keydown') e.preventDefault();

        if (gameState === 'START' || gameState === 'GAMEOVER') return;

        ensureAudioReady();

        if (player.jumps < 2) {
            player.vy = -window.gameConfig.jumpForce;
            player.jumps++;
            player.grounded = false;
            player.scaleY = 0.6; // Squash
            player.rotation = 0; // Reset rotation for new spin

            // Jump particles
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: player.x + player.w / 2,
                    y: player.y + player.h,
                    vx: (Math.random() - 0.5) * 200,
                    vy: (Math.random()) * 100,
                    life: 0.5,
                    color: '#fff',
                    size: 5
                });
            }

            playSound('jump');
        }
    };

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handleInput(e);
    });

    // Game Logic
    const initGame = () => {
        player.y = canvas.height / 2 / (window.devicePixelRatio || 1);
        player.vy = 0;
        player.jumps = 0;
        score = 0;
        cameraX = 0;
        platforms = [];
        coins = [];
        particles = [];
        shake = 0;

        // Initial Platform
        platforms.push({ x: 50, y: player.y + 50, w: 400, h: 40 });

        // Generate ahead
        for (let i = 0; i < 5; i++) generatePlatform(platforms[platforms.length - 1].x + platforms[platforms.length - 1].w);

        gameState = 'PLAYING';
        showFeedback('fail', 'Back on route');
        ui.start.classList.add('hidden');
        ui.over.classList.add('hidden');
        ui.hud.classList.remove('hidden');
        ui.score.textContent = '0';

        syncBgm();
    };

    const generatePlatform = (startX) => {
        const gap = 100 + Math.random() * 150;
        const w = 150 + Math.random() * 200;
        const y = Math.min(Math.max(200, player.y + (Math.random() - 0.5) * 300), canvas.height / window.devicePixelRatio - 100);

        platforms.push({ x: startX + gap, y: y, w: w, h: 40 });

        // Add coins
        if (Math.random() > 0.3) {
            const cw = 30;
            const cx = startX + gap + w / 2 - cw / 2;
            const cy = y - 60 - Math.random() * 100;
            coins.push({ x: cx, y: cy, w: cw, h: cw, collected: false, offset: Math.random() * Math.PI });
        }
    };

    const gameOver = () => {
        gameState = 'GAMEOVER';
        shake = 20;
        playSound('dead');
        showFeedback('fail', 'Route missed!');
        syncBgm();

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('skyhopper_best', highScore);
        }

        ui.finalScore.textContent = Math.floor(score);
        ui.bestScore.textContent = Math.floor(highScore);
        ui.hud.classList.add('hidden');
        ui.over.classList.remove('hidden');

        // Death particles
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: player.x + player.w / 2,
                y: player.y + player.h / 2,
                vx: (Math.random() - 0.5) * 500,
                vy: (Math.random() - 0.5) * 500,
                life: 1.0,
                color: '#FFD700',
                size: 10
            });
        }
    };

    const update = (dt) => {
        if (gameState !== 'PLAYING') return;

        // Camera/World Scroll
        const scroll = window.gameConfig.scrollSpeed * dt;
        cameraX += scroll;
        score += scroll * 0.01;
        ui.score.textContent = Math.floor(score);

        // Screen Shake decay
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;

        // Player Physics
        player.vy += window.gameConfig.gravity * dt;
        player.y += player.vy * dt;

        // Rotation & Squash recovery
        if (!player.grounded) {
            player.rotation += dt * 5;
        } else {
            // Snap rotation back
            player.rotation = player.rotation * 0.8;
        }
        player.scaleY += (1 - player.scaleY) * 10 * dt;

        // Ground Check & Collision
        player.grounded = false;
        const px = player.x + cameraX; // Player's world X
        const pw = player.w;
        const ph = player.h;
        const py = player.y;

        // Check Platforms
        platforms.forEach(p => {
            // AABB Collision (World Coordinates)
            if (px < p.x + p.w && px + pw > p.x &&
                py + ph > p.y && py + ph < p.y + 30 &&
                player.vy > 0) {

                player.y = p.y - ph;
                player.vy = 0;
                player.grounded = true;
                player.jumps = 0;
                player.scaleY = 0.8;

                const now = performance.now();
                if (now - lastLandAt > 180) {
                    playSound('land');
                    lastLandAt = now;
                }
            }
        });

        // Check Death
        if (player.y > canvas.height / window.devicePixelRatio + 100) {
            gameOver();
        }

        // Cleanup & Gen Platforms
        if (platforms[0].x + platforms[0].w < cameraX - 100) {
            platforms.shift();
            generatePlatform(platforms[platforms.length - 1].x + platforms[platforms.length - 1].w);
        }

        // Coins
        coins.forEach(c => {
            if (c.collected) return;
            const dx = (px + pw / 2) - (c.x + c.w / 2);
            const dy = (player.y + ph / 2) - (c.y + c.h / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 40) {
                c.collected = true;
                score += 100;
                playSound('coin');
                showFeedback('pickup', 'Package saved!');
                // Sparkles
                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: c.x + c.w / 2,
                        y: c.y + c.h / 2,
                        vx: (Math.random() - 0.5) * 300,
                        vy: (Math.random() - 0.5) * 300,
                        life: 0.6,
                        color: '#FFFF00',
                        size: 4
                    });
                }
            }
        });
        coins = coins.filter(c => c.x > cameraX - 100 || !c.collected);

        // Particles
        particles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            p.vy += 500 * dt;
        });
        particles = particles.filter(p => p.life > 0);
    };

    const draw = () => {
        ctx.fillStyle = window.gameConfig.themeColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cssW = canvas.width / (window.devicePixelRatio || 1);

        const sx = (Math.random() - 0.5) * shake;
        const sy = (Math.random() - 0.5) * shake;
        ctx.save();
        ctx.translate(sx, sy);

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        for (let i = 0; i < 5; i++) {
            let cx = ((i * 300) - (cameraX * 0.2)) % (cssW + 400);
            if (cx < -200) cx += cssW + 400;
            ctx.beginPath();
            ctx.arc(cx, 100 + i * 50, 60, 0, Math.PI * 2);
            ctx.arc(cx + 50, 120 + i * 50, 70, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.save();
        ctx.translate(-cameraX, 0);

        const platImg = document.getElementById('asset_platform');
        platforms.forEach(p => {
            if (platImg && platImg.complete && platImg.naturalWidth > 0) {
                ctx.drawImage(platImg, p.x, p.y, p.w, p.h);
            } else {
                ctx.fillStyle = '#32CD32';
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 10);
                ctx.fill();
                ctx.fillStyle = '#90EE90';
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, 10, 5);
                ctx.fill();
            }
        });

        const coinImg = document.getElementById('asset_coin');
        coins.forEach(c => {
            if (c.collected) return;
            const floatY = Math.sin(Date.now() / 200 + c.offset) * 10;
            if (coinImg && coinImg.complete && coinImg.naturalWidth > 0) {
                ctx.drawImage(coinImg, c.x, c.y + floatY, c.w, c.h);
            } else {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(c.x + c.w / 2, c.y + c.h / 2 + floatY, c.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        });

        const pImg = document.getElementById('asset_player');
        const px = player.x + cameraX;
        ctx.save();
        ctx.translate(px + player.w / 2, player.y + player.h / 2);
        ctx.rotate(player.rotation);
        ctx.scale(1, player.scaleY);
        if (pImg && pImg.complete && pImg.naturalWidth > 0) {
            ctx.drawImage(pImg, -player.w / 2, -player.h / 2, player.w, player.h);
        } else {
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);
        }
        ctx.restore();

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.rect(p.x, p.y, p.size, p.size);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        ctx.restore();
        ctx.restore();
    };

    const loop = (timestamp) => {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error(e);
        }

        animationId = requestAnimationFrame(loop);
    };

    ui.startBtn.addEventListener('click', () => {
        ensureAudioReady();
        playSound('start');
        initGame();
    });
    ui.restartBtn.addEventListener('click', () => {
        ensureAudioReady();
        playSound('restart');
        initGame();
    });

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
