<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Clinic Dash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap');

        :root {
            --sky-top: #090f1f;
            --sky-bottom: #182a52;
            --aurora-cyan: #8af7ff;
            --aurora-blue: #56ccff;
            --panel-ice: rgba(8, 20, 44, 0.78);
            --panel-border: rgba(138, 247, 255, 0.4);
            --panel-shadow: rgba(8, 16, 32, 0.45);
            --track-light: #c6f7ff;
            --track-mid: #8ee7ff;
            --track-dark: #29538f;
            --ui-text: #f3fbff;
            --ui-muted: #b6d9ef;
            --danger: #ff718a;
            --mint: #6cf3c5;
            --gold: #ffd37a;
            --coral: #ff987a;
            --plum: #82327c;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(86, 204, 255, 0.22), transparent 30%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            color: var(--ui-text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .group { position: relative; }
        .w-full { width: 100%; }
        .h-full { width: 100vw; height: 100vh; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .bottom-4 { bottom: 1rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-sm { font-size: 0.95rem; }
        .text-lg { font-size: 1.08rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 2rem; }
        .text-3xl { font-size: 2.25rem; }
        .text-4xl { font-size: 2.8rem; }
        .text-5xl { font-size: clamp(2.8rem, 7vw, 4.2rem); }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .max-w-md { max-width: 28rem; }
        .rounded { border-radius: 0.5rem; }
        .rounded-full { border-radius: 999px; }
        .rounded-3xl { border-radius: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .shadow-md { box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12); }
        .shadow-lg { box-shadow: 0 14px 28px rgba(15, 23, 42, 0.18); }
        .hover\:shadow-xl:hover { box-shadow: 0 18px 36px rgba(15, 23, 42, 0.22); }
        .transition { transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, filter 0.2s ease, opacity 0.2s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .transform { transform-origin: center; }
        .hover\:scale-105:hover { transform: scale(1.03); }
        .active\:scale-95:active { transform: scale(0.95); }
        .drop-shadow-sm { text-shadow: 0 2px 10px rgba(86, 204, 255, 0.3); }
        .bg-white\/90 { background: rgba(11, 28, 58, 0.88); }
        .bg-pink-100 { background: rgba(255, 152, 122, 0.16); }
        .bg-yellow-100 { background: rgba(255, 211, 122, 0.17); }
        .bg-orange-100 { background: rgba(108, 243, 197, 0.16); }
        .bg-teal-500 {
            background: linear-gradient(180deg, #53e7ff, #2ab3ff);
            color: #041326;
        }
        .hover\:bg-teal-400:hover {
            background: linear-gradient(180deg, #8af7ff, #55c8ff);
        }
        .text-white { color: #041326; }
        .text-gray-500 { color: var(--ui-muted); }
        .text-gray-600 { color: var(--ui-muted); }
        .text-teal-600 { color: var(--aurora-cyan); }
        .text-teal-700 { color: #98f6ff; }
        .text-teal-800 { color: #dbfbff; }
        .text-red-500 { color: #ffd1d8; }
        .w-4 { width: 1rem; }
        .h-6 { height: 1.5rem; }
        .bg-orange-300 { background: linear-gradient(180deg, #ffd37a, #ff987a); }
        .border { border: 1px solid currentColor; }
        .border-orange-400 { border-color: rgba(255, 211, 122, 0.75); }

        .glass-panel {
            position: relative;
            background:
                radial-gradient(circle at top left, rgba(138, 247, 255, 0.28), transparent 28%),
                linear-gradient(180deg, rgba(14, 35, 73, 0.88), rgba(8, 22, 46, 0.86));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 36px var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(125deg, rgba(255,255,255,0.16), transparent 35%, transparent 65%, rgba(86, 204, 255, 0.08));
            pointer-events: none;
        }

        .title-font {
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hud-font {
            font-family: 'Press Start 2P', 'Orbitron', ui-monospace, monospace;
            letter-spacing: 0.08em;
        }

        .body-copy {
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }

        .badge-row span {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--ui-text);
            border: 1px solid rgba(255,255,255,0.08);
        }

        button {
            border: 0;
            cursor: pointer;
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }

        .arcade-button {
            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255,255,255,0.35);
            letter-spacing: 0.08em;
        }

        .arcade-button:hover {
            filter: brightness(1.06);
        }

        .hud-pill {
            border: 1px solid rgba(138, 247, 255, 0.4);
            box-shadow:
                0 10px 26px rgba(2, 8, 24, 0.32),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .bandage-icon {
            box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 6px 12px rgba(0,0,0,0.18);
        }

        .feedback-panel {
            min-width: min(36vw, 180px);
            max-width: min(42vw, 220px);
            padding: 0.55rem;
            border-radius: 1rem;
            border: 1px solid rgba(138, 247, 255, 0.25);
            background: rgba(5, 15, 34, 0.56);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(8px);
        }

        .feedback-panel img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 0.75rem;
        }

        .feedback-panel.hidden {
            opacity: 0;
        }

        .feedback-label {
            margin-top: 0.35rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--ui-muted);
            letter-spacing: 0.12em;
            text-align: center;
            font-family: 'Press Start 2P', 'Orbitron', ui-monospace, monospace;
        }

        @media (max-width: 640px) {
            .p-8 { padding: 1.5rem; }
            .text-4xl { font-size: 2.2rem; }
            .text-3xl { font-size: 1.8rem; }
            .text-2xl { font-size: 1.5rem; }
            .text-xl { font-size: 1.05rem; }
            .text-lg { font-size: 1rem; }
            .px-10 { padding-left: 1.75rem; padding-right: 1.75rem; }
            .max-w-md { max-width: min(28rem, calc(100vw - 2rem)); }
            .top-4 { top: max(1rem, env(safe-area-inset-top)); }
            .left-4 { left: max(1rem, env(safe-area-inset-left)); }
            .right-4 { right: max(0.75rem, env(safe-area-inset-right)); }
            .bottom-4 { bottom: max(0.75rem, env(safe-area-inset-bottom)); }

            .feedback-panel {
                min-width: 116px;
                max-width: 34vw;
                padding: 0.4rem;
            }

            .feedback-label {
                font-size: 0.52rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            <div id="start-screen" class="glass-panel p-8 rounded-3xl text-center pointer-events-auto hover:scale-105 transition duration-300 max-w-md mx-4">
                <h1 class="text-5xl font-bold text-teal-600 mb-2 drop-shadow-sm title-font">Clinic Dash</h1>
                <p class="text-gray-600 text-lg mb-6 font-semibold body-copy">Sprint the star corridor, dodge wild hazards, and scoop bandages for Poppy.</p>
                <div class="badge-row flex flex-wrap justify-center gap-2 mb-6 text-sm text-gray-500">
                    <span class="bg-pink-100 px-2 py-1 rounded">Patient: Poppy</span>
                    <span class="bg-yellow-100 px-2 py-1 rounded">Tap / Click / Space</span>
                    <span class="bg-orange-100 px-2 py-1 rounded">Collect bandages</span>
                </div>
                <button id="start-btn" class="arcade-button bg-teal-500 text-white font-bold py-4 px-10 rounded-full shadow-lg hover:bg-teal-400 hover:shadow-xl transition transform active:scale-95 text-xl title-font">
                    START SHIFT
                </button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel p-8 rounded-3xl text-center pointer-events-auto max-w-md mx-4">
                <h2 class="text-4xl font-bold text-red-500 mb-2 title-font">SHIFT OVER</h2>
                <p class="text-gray-600 mb-4 body-copy">A critter clipped the route before the next pickup.</p>
                <div class="text-3xl text-teal-800 mb-6 font-bold hud-font">Bandages: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="arcade-button bg-teal-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-teal-400 transition transform active:scale-95 title-font">
                    Restart Run
                </button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <!-- [agent-note][stage4] repaired: font-remap/mobile-taps | action: swapped UI fonts to catalog-backed Orbitron/Rajdhani/Press Start 2P and limited touch suppression to gameplay surface -->
            <div id="hud" class="absolute top-4 left-4 hidden pointer-events-none">
                <div class="hud-pill bg-white/90 rounded-full px-6 py-2 shadow-md flex items-center gap-2">
                    <div class="bandage-icon w-4 h-6 bg-orange-300 rounded border border-orange-400 relative">
                        <div class="absolute inset-0" style="margin:auto;width:100%;height:0.25rem;background:rgba(255,255,255,0.55);"></div>
                    </div>
                    <span class="text-2xl font-bold text-teal-700 hud-font" id="score">0</span>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: collect/fail feedback overlays -> catalogs/gifs.json -->
            <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
            <div id="collect-feedback" class="feedback-panel absolute right-4 bottom-4 hidden pointer-events-none">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Collect reaction feedback">
                <div class="feedback-label">Supply Boost</div>
            </div>

            <div id="danger-feedback" class="feedback-panel absolute right-4 top-4 hidden pointer-events-none">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction feedback">
                <div class="feedback-label">Route Jam</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
            sfx: {
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3',
                jump: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3',
                land: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',
                score: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
                milestone: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3',
                fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3'
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = this.createAudio(ASSETS.bgm, { loop: true, volume: 0.2 });
                this.sfx = {};
                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = this.createAudio(src, { preload: 'auto', volume: key === 'fail' ? 0.7 : 0.55 });
                }
            }

            createAudio(src, config = {}) {
                const audio = new Audio(src);
                audio.preload = config.preload || 'auto';
                audio.loop = Boolean(config.loop);
                audio.volume = config.volume ?? 0.55;
                return audio;
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                const allTracks = [this.bgm, ...Object.values(this.sfx)];
                allTracks.forEach((track) => {
                    try {
                        track.load();
                    } catch (_) {}
                });
            }

            playBGM() {
                if (!this.unlocked || !this.bgm) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                const base = this.sfx[key];
                if (!this.unlocked || !base) return;

                try {
                    const clone = base.cloneNode();
                    clone.volume = options.volume ?? base.volume ?? 0.55;
                    clone.currentTime = 0;
                    clone.play().catch(() => {});
                } catch (_) {}
            }
        }
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreNode = document.getElementById('score');
        const finalScoreNode = document.getElementById('finalScore');
        const collectFeedback = document.getElementById('collect-feedback');
        const dangerFeedback = document.getElementById('danger-feedback');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frames = 0;
        let gameSpeed = 5;
        let lastGroundedState = false;
        let collectFxUntil = 0;
        let failFxUntil = 0;

        let player = { x: 50, y: 0, width: 40, height: 40, dy: 0, jumpPower: -12, grounded: false };
        let obstacles = [];
        let particles = [];
        let chatBubbles = [];
        const gravity = 0.6;

        const quotes = [
            'Patch secured!',
            'Medic pickup!',
            'Keep moving!',
            'Got one!',
            'Quick save!',
            'Bandage grabbed!',
            'Nurse assist!'
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 150;
        }
        window.addEventListener('resize', resize);
        resize();

        function setFeedbackState() {
            const now = performance.now();
            collectFeedback.classList.toggle('hidden', now > collectFxUntil);
            dangerFeedback.classList.toggle('hidden', now > failFxUntil);
        }

        function flashCollectFeedback() {
            collectFxUntil = performance.now() + 1600;
            setFeedbackState();
        }

        function flashFailFeedback() {
            failFxUntil = performance.now() + 2200;
            setFeedbackState();
        }

        function drawAuroraPulse(x, y, radius, color, alpha = 0.5) {
            const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
            glow.addColorStop(0, color.replace('ALPHA', alpha));
            glow.addColorStop(1, color.replace('ALPHA', 0));
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawHospitalBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#091022');
            gradient.addColorStop(0.45, '#12335e');
            gradient.addColorStop(1, '#2150a0');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            drawAuroraPulse(width * 0.2, height * 0.12, width * 0.18, 'rgba(138, 247, 255, ALPHA)', 0.32);
            drawAuroraPulse(width * 0.82, height * 0.18, width * 0.16, 'rgba(255, 151, 122, ALPHA)', 0.18);

            const lineSpacing = 180;
            const lineOffset = (frames * gameSpeed * 0.35) % lineSpacing;
            ctx.strokeStyle = 'rgba(138, 247, 255, 0.12)';
            ctx.lineWidth = 3;
            for (let i = -1; i < width / lineSpacing + 2; i++) {
                const x = (i * lineSpacing) - lineOffset;
                ctx.beginPath();
                ctx.moveTo(x, height * 0.18);
                ctx.lineTo(x + 50, height * 0.62);
                ctx.stroke();
            }

            const baySpacing = 260;
            const bayOffset = (frames * (gameSpeed * 0.48)) % baySpacing;
            for (let i = -1; i < width / baySpacing + 2; i++) {
                const x = (i * baySpacing) - bayOffset;
                const bayWidth = 120;
                const bayHeight = height * 0.36;
                const bayTop = height * 0.25;

                const bayGradient = ctx.createLinearGradient(0, bayTop, 0, bayTop + bayHeight);
                bayGradient.addColorStop(0, 'rgba(25, 74, 146, 0.85)');
                bayGradient.addColorStop(1, 'rgba(11, 29, 68, 0.6)');
                ctx.fillStyle = bayGradient;
                ctx.fillRect(x, bayTop, bayWidth, bayHeight);

                ctx.strokeStyle = 'rgba(138, 247, 255, 0.28)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 8, bayTop + 8, bayWidth - 16, bayHeight - 16);

                ctx.fillStyle = 'rgba(138, 247, 255, 0.14)';
                ctx.fillRect(x + 18, bayTop + 22, bayWidth - 36, bayHeight * 0.2);

                ctx.fillStyle = 'rgba(255, 211, 122, 0.18)';
                ctx.fillRect(x + 28, bayTop + bayHeight * 0.62, bayWidth - 56, 10);
            }

            const trackGradient = ctx.createLinearGradient(0, height - 108, 0, height);
            trackGradient.addColorStop(0, '#9bedff');
            trackGradient.addColorStop(1, '#325da4');
            ctx.fillStyle = trackGradient;
            ctx.fillRect(0, height - 108, width, 108);

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(0, height - 108, width, 4);

            const tileSize = 54;
            const tileOffset = (frames * gameSpeed) % tileSize;
            for (let i = -1; i < width / tileSize + 2; i++) {
                const x = (i * tileSize) - tileOffset;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(219, 251, 255, 0.55)' : 'rgba(125, 223, 255, 0.28)';
                ctx.fillRect(x, height - 84, tileSize, 84);
            }

            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            for (let i = -1; i < width / tileSize + 2; i++) {
                const x = (i * tileSize) - tileOffset;
                ctx.beginPath();
                ctx.moveTo(x, height - 84);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let i = 0; i < 6; i++) {
                const sparkleX = ((frames * 0.35) + i * 170) % (width + 80) - 40;
                const sparkleY = 70 + (i % 3) * 45 + Math.sin((frames + i * 12) * 0.03) * 8;
                drawAuroraPulse(sparkleX, sparkleY, 12, 'rgba(255, 255, 255, ALPHA)', 0.22);
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

            const bob = Math.sin(frames * 0.18) * 2;
            const blink = Math.sin(frames * 0.08) > 0.96 ? 0.15 : 1;

            drawAuroraPulse(0, 6, 40, 'rgba(108, 243, 197, ALPHA)', 0.24);

            ctx.translate(0, bob);

            const bodyGradient = ctx.createLinearGradient(0, -26, 0, 28);
            bodyGradient.addColorStop(0, '#ff87bc');
            bodyGradient.addColorStop(1, '#ec4899');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#fff5fb';
            ctx.beginPath();
            ctx.arc(-8, -5, 8, 0, Math.PI * 2);
            ctx.arc(8, -5, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.ellipse(-8, -5, 3.2, 4 * blink, 0, 0, Math.PI * 2);
            ctx.ellipse(8, -5, 3.2, 4 * blink, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#6b0f45';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 6, 6, 0.1, Math.PI - 0.1);
            ctx.stroke();

            ctx.fillStyle = '#be185d';
            ctx.beginPath();
            ctx.moveTo(-15, -20);
            ctx.lineTo(-25, -30);
            ctx.lineTo(-5, -25);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffd37a';
            ctx.beginPath();
            ctx.arc(12, 13, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBandage(obs) {
            const patchGradient = ctx.createLinearGradient(0, 0, obs.w, obs.h);
            patchGradient.addColorStop(0, '#ffe2b3');
            patchGradient.addColorStop(1, '#ffb48c');
            ctx.fillStyle = patchGradient;
            ctx.beginPath();
            ctx.roundRect(0, 0, obs.w, obs.h, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,248,240,0.92)';
            ctx.beginPath();
            ctx.roundRect(obs.w / 2 - 5, 4, 10, obs.h - 8, 4);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(7 + i * 5, obs.h * 0.25, 1.2, 0, Math.PI * 2);
                ctx.arc(7 + i * 5, obs.h * 0.75, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            drawAuroraPulse(obs.w / 2, obs.h / 2, 24, 'rgba(255, 211, 122, ALPHA)', 0.18);
        }

        function drawAnt(obs) {
            ctx.fillStyle = '#150a20';
            ctx.beginPath();
            ctx.ellipse(obs.w / 2, obs.h / 2, obs.w / 2.2, obs.h / 3.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(8, obs.h / 2, 6, 0, Math.PI * 2);
            ctx.arc(obs.w - 7, obs.h / 2, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#c973ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, obs.h - 2); ctx.lineTo(2, obs.h + 8);
            ctx.moveTo(obs.w - 10, obs.h - 2); ctx.lineTo(obs.w + 2, obs.h + 8);
            ctx.moveTo(10, 2); ctx.lineTo(0, -7);
            ctx.moveTo(obs.w - 10, 2); ctx.lineTo(obs.w, -7);
            ctx.stroke();
        }

        function drawBear(obs) {
            const bearGradient = ctx.createLinearGradient(0, 0, 0, obs.h);
            bearGradient.addColorStop(0, '#7b4bff');
            bearGradient.addColorStop(1, '#43206b');
            ctx.fillStyle = bearGradient;
            ctx.beginPath();
            ctx.roundRect(0, 8, obs.w, obs.h - 8, 14);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(10, 8, 8, Math.PI, 0);
            ctx.arc(obs.w - 10, 8, 8, Math.PI, 0);
            ctx.fill();

            ctx.fillStyle = '#ffd37a';
            ctx.beginPath();
            ctx.ellipse(obs.w / 2, obs.h / 2 + 8, 15, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(obs.w / 2 - 8, obs.h / 2 - 6, 4, 0, Math.PI * 2);
            ctx.arc(obs.w / 2 + 8, obs.h / 2 - 6, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.arc(obs.w / 2 - 8, obs.h / 2 - 6, 2, 0, Math.PI * 2);
            ctx.arc(obs.w / 2 + 8, obs.h / 2 - 6, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawEagle(obs) {
            ctx.fillStyle = '#dfe7ff';
            ctx.beginPath();
            ctx.moveTo(0, obs.h / 2);
            ctx.quadraticCurveTo(obs.w / 2, -8, obs.w, obs.h / 2);
            ctx.quadraticCurveTo(obs.w / 2, obs.h - 2, 0, obs.h / 2);
            ctx.fill();

            ctx.fillStyle = '#374151';
            ctx.beginPath();
            ctx.moveTo(8, obs.h / 2);
            ctx.lineTo(obs.w * 0.42, 6);
            ctx.lineTo(obs.w * 0.3, obs.h / 2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.moveTo(obs.w, obs.h / 2);
            ctx.lineTo(obs.w + 11, obs.h / 2 + 5);
            ctx.lineTo(obs.w, obs.h / 2 + 10);
            ctx.closePath();
            ctx.fill();
        }

        function drawBat(obs) {
            ctx.save();
            ctx.translate(obs.w / 2, obs.h / 2);
            const flap = Math.sin(frames * 0.4) * 4;
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(-obs.w / 2, 0);
            ctx.quadraticCurveTo(-obs.w / 4, -12 - flap, 0, -2);
            ctx.quadraticCurveTo(obs.w / 4, -12 + flap, obs.w / 2, 0);
            ctx.quadraticCurveTo(obs.w / 4, 10 - flap, 0, 4);
            ctx.quadraticCurveTo(-obs.w / 4, 10 + flap, -obs.w / 2, 0);
            ctx.fill();

            ctx.fillStyle = '#ffd37a';
            ctx.fillRect(-4, -3, 8, 6);
            ctx.restore();
        }

        function drawLeopard(obs) {
            const catGradient = ctx.createLinearGradient(0, 0, obs.w, 0);
            catGradient.addColorStop(0, '#ffcb69');
            catGradient.addColorStop(1, '#ff7f50');
            ctx.fillStyle = catGradient;
            ctx.beginPath();
            ctx.roundRect(0, 4, obs.w, obs.h - 4, 12);
            ctx.fill();

            ctx.fillStyle = '#6b2d14';
            ctx.beginPath();
            ctx.arc(12, 12, 3, 0, Math.PI * 2);
            ctx.arc(30, 23, 4, 0, Math.PI * 2);
            ctx.arc(18, 28, 3, 0, Math.PI * 2);
            ctx.arc(45, 11, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#6b2d14';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(obs.w - 4, 8);
            ctx.quadraticCurveTo(obs.w + 8, 2, obs.w + 8, 18);
            ctx.stroke();
        }

        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);

            if (obs.type === 'bandaid') {
                drawBandage(obs);
            } else if (obs.type === 'ant') {
                drawAnt(obs);
            } else if (obs.type === 'bear') {
                drawBear(obs);
            } else if (obs.type === 'eagle') {
                drawEagle(obs);
            } else if (obs.type === 'bat') {
                drawBat(obs);
            } else if (obs.type === 'leopard') {
                drawLeopard(obs);
            }

            ctx.restore();
        }

        function drawChatBubbles() {
            ctx.font = "700 15px 'Rajdhani', sans-serif";
            ctx.textAlign = 'center';
            for (let i = chatBubbles.length - 1; i >= 0; i--) {
                const b = chatBubbles[i];
                b.y -= 1;
                b.life--;

                ctx.fillStyle = `rgba(7, 18, 40, ${Math.max(0, b.life / 60) * 0.86})`;
                const textWidth = ctx.measureText(b.text).width;
                ctx.beginPath();
                ctx.roundRect(b.x - textWidth / 2 - 12, b.y - 22, textWidth + 24, 32, 16);
                ctx.fill();

                ctx.strokeStyle = `rgba(138, 247, 255, ${Math.max(0, b.life / 60) * 0.45})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = `rgba(240, 252, 255, ${b.life / 60})`;
                ctx.fillText(b.text, b.x, b.y);
                drawAuroraPulse(b.x, b.y - 8, 18, 'rgba(108, 243, 197, ALPHA)', 0.08 * (b.life / 60));

                if (b.life <= 0) chatBubbles.splice(i, 1);
            }
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            gameSpeed = 6;
            frames = 0;
            player.y = height - 150;
            player.dy = 0;
            player.grounded = false;
            lastGroundedState = false;
            obstacles = [];
            particles = [];
            chatBubbles = [];
            collectFxUntil = 0;
            failFxUntil = 0;
            scoreNode.innerText = score;
            setFeedbackState();
        }

        function spawnObstacle() {
            const types = ['ant', 'bear', 'leopard', 'eagle', 'bat', 'bandaid', 'bandaid'];
            const type = types[Math.floor(Math.random() * types.length)];

            let obs = { x: width, w: 40, h: 40, type: type, passed: false };

            if (type === 'ant') {
                obs.y = height - 130;
                obs.w = 30; obs.h = 20;
            } else if (type === 'bear') {
                obs.y = height - 150;
                obs.w = 50; obs.h = 50;
            } else if (type === 'leopard') {
                obs.y = height - 140;
                obs.w = 60; obs.h = 30;
            } else if (type === 'eagle') {
                obs.y = height - 250;
                obs.w = 40; obs.h = 30;
            } else if (type === 'bat') {
                obs.y = height - 200;
                obs.w = 60; obs.h = 10;
            } else if (type === 'bandaid') {
                obs.y = height - 150 - Math.random() * 100;
                obs.w = 30; obs.h = 40;
            }

            obstacles.push(obs);
        }

        function update() {
            frames++;

            if (frames % 600 === 0) gameSpeed += 0.5;

            player.dy += gravity;
            player.y += player.dy;

            if (player.y + player.height > height - 100) {
                player.y = height - 100 - player.height;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            if (player.grounded && !lastGroundedState && frames > 8) {
                audio.playSFX('land', { volume: 0.35 });
            }
            lastGroundedState = player.grounded;

            if (frames % Math.floor(1000 / (gameSpeed * 2)) === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (
                    player.x < obs.x + obs.w &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.y + player.height > obs.y
                ) {
                    if (obs.type === 'bandaid') {
                        score++;
                        scoreNode.innerText = score;
                        audio.playSFX('score', { volume: 0.52 });
                        if (score % 5 === 0) {
                            audio.playSFX('milestone', { volume: 0.5 });
                        }
                        flashCollectFeedback();
                        obstacles.splice(i, 1);

                        chatBubbles.push({
                            x: player.x,
                            y: player.y - 20,
                            text: quotes[Math.floor(Math.random() * quotes.length)],
                            life: 60
                        });
                    } else {
                        gameOver();
                    }
                }

                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                }
            }

            setFeedbackState();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            update();
            drawHospitalBackground();
            obstacles.forEach(drawObstacle);
            drawPlayer();
            drawChatBubbles();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.72 });
            flashFailFeedback();
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreNode.innerText = score;
        }

        /** 6. CONTROLS */
        function jump() {
            if (!gameActive) return;
            if (player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
                lastGroundedState = false;
                audio.playSFX('jump', { volume: 0.42 });
            }
        }

        function startRun() {
            audio.unlock();
            audio.playSFX('start', { volume: 0.55 });
            audio.playBGM();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        function restartRun() {
            audio.unlock();
            audio.playSFX('start', { volume: 0.5 });
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        window.addEventListener('touchstart', (e) => {
            if (gameActive) {
                e.preventDefault();
                jump();
            }
        }, { passive: false });

        window.addEventListener('mousedown', () => {
            if (gameActive) jump();
        });

        document.getElementById('start-btn').addEventListener('click', startRun);
        document.getElementById('restart-btn').addEventListener('click', restartRun);

        setFeedbackState();
    });
    </script>
</body>
