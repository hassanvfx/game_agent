<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Shield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | title-display: Orbitron | ui-body: Exo 2 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #04101f;
            --bg-bottom: #02050d;
            --panel: rgba(7, 18, 38, 0.82);
            --panel-border: rgba(115, 225, 255, 0.3);
            --panel-glow: rgba(79, 218, 255, 0.2);
            --text-main: #effbff;
            --text-soft: rgba(222, 246, 255, 0.8);
            --accent-cyan: #63f3ff;
            --accent-blue: #5ea1ff;
            --accent-pink: #ff5fd2;
            --danger: #ff6e88;
            --success: #8bffb7;
            --weapon-red: #ff7a7a;
            --weapon-gold: #ffe47a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(76, 151, 255, 0.18), transparent 38%),
                radial-gradient(circle at 20% 80%, rgba(255, 95, 210, 0.1), transparent 30%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-main);
            cursor: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            cursor: pointer;
            border: none;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 1rem;
            line-height: 1.2;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 50% 18%, rgba(99, 243, 255, 0.12), transparent 32%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 24%);
            mix-blend-mode: screen;
        }

        #game-container::after {
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.25) 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(10, 24, 46, 0.92), rgba(5, 14, 32, 0.84));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 14px 40px rgba(0, 0, 0, 0.35),
                0 0 24px var(--panel-glow);
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(99, 243, 255, 0.85),
                0 0 24px rgba(99, 243, 255, 0.25);
        }

        .title-font {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .ui-font {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(84px, 22vw, 144px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(132, 240, 255, 0.34);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.26), 0 0 18px rgba(95, 238, 255, 0.2);
            opacity: 0;
            transform: scale(0.86);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 35;
            background: rgba(4, 16, 31, 0.72);
        }

        .feedback-gif.visible {
            opacity: 0.95;
            transform: scale(1);
        }

        #impact-gif {
            right: 12px;
            bottom: calc(88px + env(safe-area-inset-bottom));
        }

        #danger-gif {
            left: 12px;
            top: calc(96px + env(safe-area-inset-top));
        }

        .ui-shell {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
            padding: max(14px, env(safe-area-inset-top)) 14px 0;
        }

        .hud-cluster {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 78%;
        }

        .hud-card {
            min-width: 124px;
            padding: 10px 12px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .hud-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99, 243, 255, 0.08), transparent 60%);
            pointer-events: none;
        }

        .hud-label {
            display: block;
            margin-bottom: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(235, 250, 255, 0.62);
        }

        .hud-value {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(16px, 3.4vw, 22px);
            line-height: 1.05;
            color: var(--text-main);
        }

        .hud-value.score {
            color: var(--accent-cyan);
        }

        .hud-value.shields {
            color: #ff9ab2;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe top grouping with compact cards */
        #weapon-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 10px calc(10px + env(safe-area-inset-bottom));
            margin-bottom: 6px;
            pointer-events: auto;
        }

        .weapon-btn {
            min-width: 0;
            width: min(31vw, 164px);
            padding: 11px 10px 10px;
            border-radius: 16px;
            color: var(--text-main);
            text-align: center;
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
            position: relative;
            overflow: hidden;
        }

        .weapon-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 45%);
            pointer-events: none;
        }

        .weapon-btn:hover,
        .weapon-btn:active {
            transform: translateY(-1px);
        }

        .weapon-btn .weapon-title {
            display: block;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(12px, 3vw, 15px);
            letter-spacing: 0.08em;
        }

        .weapon-btn .weapon-subtitle {
            display: block;
            margin-top: 4px;
            font-size: 10px;
            line-height: 1.2;
            color: rgba(230, 244, 255, 0.68);
        }

        .weapon-btn.active {
            background: linear-gradient(180deg, rgba(99, 243, 255, 0.2), rgba(16, 44, 78, 0.78));
            border-color: rgba(131, 244, 255, 0.72);
            box-shadow: 0 0 18px rgba(99, 243, 255, 0.34);
        }

        #btn-pistol .weapon-title { color: var(--accent-cyan); }
        #btn-shotgun .weapon-title { color: var(--weapon-red); }
        #btn-sniper .weapon-title { color: var(--weapon-gold); }

        .center-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 18px;
            pointer-events: none;
        }

        .menu-panel {
            width: min(92vw, 420px);
            padding: 22px 18px 20px;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .menu-panel::before,
        .menu-panel::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(10px);
            opacity: 0.8;
            pointer-events: none;
        }

        .menu-panel::before {
            width: 120px;
            height: 120px;
            top: -40px;
            right: -24px;
            background: radial-gradient(circle, rgba(99, 243, 255, 0.25), transparent 65%);
        }

        .menu-panel::after {
            width: 90px;
            height: 90px;
            bottom: -24px;
            left: -18px;
            background: radial-gradient(circle, rgba(255, 95, 210, 0.16), transparent 65%);
        }

        .hero-badge {
            width: 106px;
            height: 106px;
            margin: 0 auto 14px;
            border-radius: 28px;
            position: relative;
            background:
                radial-gradient(circle at 50% 38%, rgba(255,255,255,0.95) 0 6px, transparent 7px),
                radial-gradient(circle at 33% 38%, rgba(255,255,255,0.92) 0 6px, transparent 7px),
                radial-gradient(circle at 66% 38%, rgba(255,255,255,0.92) 0 6px, transparent 7px),
                radial-gradient(circle at 50% 62%, rgba(255,95,210,0.95) 0 13px, transparent 14px),
                linear-gradient(180deg, rgba(113,242,255,0.9), rgba(63,115,255,0.8));
            box-shadow:
                0 0 0 2px rgba(201, 250, 255, 0.24) inset,
                0 0 22px rgba(99, 243, 255, 0.36);
        }

        .hero-badge::before,
        .hero-badge::after {
            content: "";
            position: absolute;
            top: 34px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #061427;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .hero-badge::before {
            left: 23px;
        }

        .hero-badge::after {
            right: 23px;
        }

        .hero-ring {
            position: absolute;
            inset: -8px;
            border-radius: 34px;
            border: 1px solid rgba(99, 243, 255, 0.4);
            animation: pulseRing 2.8s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 0.55; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        .screen-title {
            margin: 0 0 8px;
            font-size: clamp(28px, 9vw, 54px);
            line-height: 0.95;
            color: var(--accent-cyan);
        }

        .screen-subtitle {
            margin: 0 auto 18px;
            max-width: 26ch;
            font-size: clamp(14px, 3.8vw, 18px);
            line-height: 1.4;
            color: var(--text-soft);
        }

        .flavor-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 0 18px;
        }

        .flavor-pill {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(125, 230, 255, 0.22);
            background: rgba(255,255,255,0.04);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(227, 249, 255, 0.76);
        }

        .action-btn {
            min-width: 190px;
            padding: 14px 20px;
            border-radius: 999px;
            background: linear-gradient(135deg, #5feeff, #4c79ff);
            color: #03101f;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(14px, 3.8vw, 17px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 10px 24px rgba(76, 121, 255, 0.35),
                0 0 18px rgba(95, 238, 255, 0.28);
            transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
        }

        .action-btn:hover,
        .action-btn:active {
            transform: translateY(-1px) scale(0.99);
            filter: brightness(1.06);
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, #fff, #cdd9ff);
            color: #08111f;
            box-shadow: 0 10px 24px rgba(255, 255, 255, 0.16);
        }

        .game-over-title {
            color: var(--danger);
        }

        .result-copy {
            margin: 0 0 18px;
            font-size: clamp(16px, 4vw, 26px);
            color: var(--text-main);
        }

        .result-copy strong {
            color: var(--accent-cyan);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-weight: 400;
        }

        .status-line {
            margin-top: 12px;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(235, 250, 255, 0.56);
        }

        @media (max-width: 640px) {
            .hud {
                padding-left: 10px;
                padding-right: 10px;
            }

            .hud-cluster {
                max-width: 100%;
                gap: 8px;
            }

            .hud-card {
                min-width: 112px;
                padding: 9px 10px;
                border-radius: 14px;
            }

            #weapon-bar {
                gap: 6px;
                margin-bottom: 2px;
            }

            .weapon-btn {
                width: min(31.5vw, 132px);
                padding: 10px 8px 9px;
                border-radius: 14px;
            }

            .weapon-btn .weapon-subtitle {
                font-size: 9px;
            }

            .menu-panel {
                padding: 20px 16px 18px;
                border-radius: 22px;
            }

            .hero-badge {
                width: 88px;
                height: 88px;
                border-radius: 24px;
            }

            .hero-badge::before,
            .hero-badge::after {
                top: 29px;
                width: 14px;
                height: 14px;
            }

            .hero-badge::before {
                left: 19px;
            }

            .hero-badge::after {
                right: 19px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <!-- [agent-note][stage4] resolved-font: title -> Orbitron, ui/body -> Exo 2 from catalogs/fonts.json -->
            <!-- [agent-note][stage3] resolved-gif: hit + danger feedback overlays from catalogs/gifs.json -->
            <img id="impact-gif" class="feedback-gif" alt="Impact feedback animation" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" decoding="async" loading="lazy">
            <img id="danger-gif" class="feedback-gif" alt="Danger feedback animation" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" decoding="async" loading="lazy">
            <div id="hud" class="hud hidden">
                <div class="hud-cluster">
                    <div class="hud-card glass-panel">
                        <span class="hud-label">Threats Cleared</span>
                        <div class="hud-value score">Score <span id="score">0</span></div>
                    </div>
                    <div class="hud-card glass-panel">
                        <span class="hud-label">Shield Core</span>
                        <div class="hud-value shields">Shields <span id="lives">3</span></div>
                    </div>
                </div>
            </div>

            <div id="weapon-bar" class="hidden">
                <button onclick="switchWeapon(0)" id="btn-pistol" class="weapon-btn glass-panel active">
                    <span class="weapon-title">Pulse</span>
                    <span class="weapon-subtitle">Balanced beam</span>
                </button>
                <button onclick="switchWeapon(1)" id="btn-shotgun" class="weapon-btn glass-panel">
                    <span class="weapon-title">Burst</span>
                    <span class="weapon-subtitle">Wide scatter</span>
                </button>
                <button onclick="switchWeapon(2)" id="btn-sniper" class="weapon-btn glass-panel">
                    <span class="weapon-title">Lance</span>
                    <span class="weapon-subtitle">Heavy focus</span>
                </button>
            </div>

            <div class="center-stage">
                <div id="start-screen" class="menu-panel glass-panel">
                    <div class="hero-badge" aria-hidden="true">
                        <div class="hero-ring"></div>
                    </div>
                    <h1 class="screen-title title-font neon-text">Sky Shield</h1>
                    <p class="screen-subtitle">Pilot the Prism Sentinel and tap every breach drone before the skyline barrier fails.</p>
                    <div class="flavor-row" aria-hidden="true">
                        <span class="flavor-pill">Neon Sentinel</span>
                        <span class="flavor-pill">Arc Pulse</span>
                        <span class="flavor-pill">Mobile Safe</span>
                    </div>
                    <button id="start-btn" class="action-btn">Activate Grid</button>
                    <div class="status-line ui-font">Tap anywhere on the field to fire</div>
                </div>

                <div id="game-over-screen" class="menu-panel glass-panel hidden">
                    <div class="hero-badge" aria-hidden="true">
                        <div class="hero-ring"></div>
                    </div>
                    <h2 class="screen-title title-font neon-text game-over-title">Shield Collapsed</h2>
                    <p class="result-copy">Threats cleared <strong id="finalScore">0</strong></p>
                    <button id="restart-btn" class="action-btn secondary">Restart Grid</button>
                    <div class="status-line ui-font">Prism Sentinel ready for relaunch</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    /** GLOBAL STATE ACCESSORS FOR HTML BUTTONS */
    let switchWeapon;

    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            // [agent-note][stage3] resolved-audio: gameplay loop + ui/action SFX mapped from catalogs/audios.json
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3",
                kill: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                switch: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3"
            },
            gifs: {
                impact: "https://i.giphy.com/1AjEBGWggGXh9onllB.webp",
                danger: "https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(v);
                    sample.preload = 'auto';
                    this.sfx[k] = sample;
                }
                this.sfxVolumes = {
                    shoot: 0.34,
                    hit: 0.4,
                    kill: 0.48,
                    fail: 0.46,
                    start: 0.52,
                    switch: 0.34,
                    warning: 0.28
                };
                this.throttleMs = {
                    shoot: 55,
                    hit: 70,
                    kill: 100,
                    fail: 180,
                    start: 180,
                    switch: 120,
                    warning: 900
                };
            }

            unlock() {
                this.enabled = true;
                const warmup = this.bgm.play();
                if (warmup && typeof warmup.then === 'function') {
                    warmup
                        .then(() => {
                            this.bgm.pause();
                            this.bgm.currentTime = 0;
                        })
                        .catch(() => {});
                }
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const minGap = this.throttleMs[key] ?? 0;
                const lastTime = this.lastPlayed.get(key) ?? -Infinity;
                if (now - lastTime < minGap) return;
                this.lastPlayed.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolumes[key] ?? 0.45;
                if (key === 'shoot') {
                    clone.playbackRate = 0.92 + Math.random() * 0.12;
                } else if (key === 'kill') {
                    clone.playbackRate = 0.96 + Math.random() * 0.08;
                }
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const impactGif = document.getElementById('impact-gif');
        const dangerGif = document.getElementById('danger-gif');
        let gifTimers = { impact: 0, danger: 0 };

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let frameCount = 0;

        // Pointer state
        let mouseX = 0;
        let mouseY = 0;

        // Weapon Configs
        const WEAPONS = [
            { name: 'Pistol', damage: 25, cooldown: 15, color: '#63f3ff', spread: 0, count: 1, radius: 20 },
            { name: 'Shotgun', damage: 15, cooldown: 45, color: '#ff7a7a', spread: 0.3, count: 5, radius: 35 },
            { name: 'Sniper', damage: 100, cooldown: 60, color: '#ffe47a', spread: 0, count: 1, radius: 50 }
        ];
        let currentWeaponIdx = 0;
        let weaponCooldownTimer = 0;

        // Entities
        let targets = [];
        let particles = [];
        let backgroundStars = [];

        /** 4. RESIZE & INPUT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBackground();
        }
        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => {
            if (gameActive) attemptShoot();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
            if (gameActive) attemptShoot();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        }, { passive: false });

        /** 5. GAME LOGIC HELPERS */
        function showGif(type, duration = 720) {
            const target = type === 'danger' ? dangerGif : impactGif;
            if (!target) return;
            target.classList.add('visible');
            clearTimeout(gifTimers[type]);
            gifTimers[type] = window.setTimeout(() => {
                target.classList.remove('visible');
            }, duration);
        }

        switchWeapon = (index) => {
            currentWeaponIdx = index;
            document.querySelectorAll('.weapon-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (gameActive) {
                audio.playSFX('switch');
            }
        };

        function initBackground() {
            backgroundStars = [];
            for (let i = 0; i < 100; i++) {
                backgroundStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.5 + 0.1,
                    layer: Math.random() > 0.5 ? 1 : 2
                });
            }
        }

        function spawnTarget() {
            const size = 30 + Math.random() * 30;
            const x = Math.random() * (width - 100) + 50;
            const y = height + size;

            const speedBase = 2 + (score / 500);
            const speed = speedBase + Math.random();

            targets.push({
                x, y,
                targetY: Math.random() * (height * 0.6),
                size,
                hp: 50 + (score / 10),
                maxHp: 50 + (score / 10),
                color: `hsl(${Math.random() * 360}, 70%, 60%)`,
                speed: speed,
                state: 'rising',
                floatTimer: 0,
                floatDuration: 100 + Math.random() * 200
            });
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function attemptShoot() {
            if (weaponCooldownTimer > 0) return;

            const weapon = WEAPONS[currentWeaponIdx];
            weaponCooldownTimer = weapon.cooldown;

            audio.playSFX('shoot');

            for (let i = 0; i < weapon.count; i++) {
                const spreadX = (Math.random() - 0.5) * weapon.spread * 200;
                const spreadY = (Math.random() - 0.5) * weapon.spread * 200;

                const shotX = mouseX + spreadX;
                const shotY = mouseY + spreadY;

                particles.push({
                    type: 'tracer',
                    x: width / 2,
                    y: height,
                    tx: shotX, ty: shotY,
                    life: 0.2,
                    color: weapon.color
                });

                for (let tIndex = targets.length - 1; tIndex >= 0; tIndex--) {
                    const t = targets[tIndex];
                    const dx = shotX - t.x;
                    const dy = shotY - t.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < t.size) {
                        t.hp -= weapon.damage;
                        createExplosion(shotX, shotY, '#ffffff', 2);
                        audio.playSFX('hit');
                        showGif('impact', 520);

                        if (t.hp <= 0) {
                            score += 100;
                            createExplosion(t.x, t.y, t.color, 15);
                            targets.splice(tIndex, 1);
                            audio.playSFX('kill');
                            document.getElementById('score').innerText = score;
                        }

                        if (weapon.name !== 'Sniper') break;
                    }
                }
            }
        }

        /** 6. MAIN LOOP */
        function initGame() {
            score = 0;
            lives = 3;
            targets = [];
            particles = [];
            frameCount = 0;
            switchWeapon(0);
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            resize();
        }

        function update() {
            frameCount++;
            if (weaponCooldownTimer > 0) weaponCooldownTimer--;

            if (frameCount % 60 === 0) {
                if (Math.random() < 0.5 + (score / 2000)) {
                    spawnTarget();
                }
            }

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];

                if (t.state === 'rising') {
                    t.y -= t.speed;
                    if (t.y <= t.targetY) {
                        t.state = 'floating';
                    }
                } else if (t.state === 'floating') {
                    t.floatTimer++;
                    t.x += Math.sin(frameCount * 0.05) * 2;
                    if (t.floatTimer > t.floatDuration) {
                        t.state = 'fleeing';
                    }
                } else if (t.state === 'fleeing') {
                    t.y += t.speed * 1.5;
                    if (t.y > height + 50) {
                        lives--;
                        document.getElementById('lives').innerText = lives;
                        targets.splice(i, 1);
                        audio.playSFX('fail');
                        showGif('danger', 900);

                        if (lives === 1) {
                            audio.playSFX('warning');
                        }

                        const flash = document.createElement('div');
                        flash.className = 'damage-flash';
                        flash.style.position = 'absolute';
                        flash.style.inset = '0';
                        flash.style.background = 'linear-gradient(180deg, rgba(255,110,136,0.12), rgba(255,110,136,0.3))';
                        flash.style.pointerEvents = 'none';
                        flash.style.zIndex = '40';
                        document.body.appendChild(flash);
                        setTimeout(() => flash.remove(), 100);

                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= 0.05;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                if (p.type !== 'tracer') {
                    p.x += p.vx;
                    p.y += p.vy;
                }
            }

            backgroundStars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) star.y = 0;
            });
        }

        function drawSentinelDrone(t) {
            const pulse = 0.9 + Math.sin(frameCount * 0.12 + t.x * 0.01) * 0.06;

            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.scale(pulse, pulse);
            ctx.shadowBlur = 24;
            ctx.shadowColor = t.color;

            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath();
            ctx.arc(0, 0, t.size * 1.08, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = t.color;
            ctx.beginPath();
            ctx.moveTo(0, -t.size);
            ctx.lineTo(t.size * 0.88, -t.size * 0.1);
            ctx.lineTo(t.size * 0.6, t.size * 0.72);
            ctx.lineTo(0, t.size * 0.38);
            ctx.lineTo(-t.size * 0.6, t.size * 0.72);
            ctx.lineTo(-t.size * 0.88, -t.size * 0.1);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#06101f';
            ctx.beginPath();
            ctx.arc(0, 0, t.size * 0.48, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ecffff';
            ctx.beginPath();
            ctx.arc(-t.size * 0.16, -t.size * 0.08, t.size * 0.11, 0, Math.PI * 2);
            ctx.arc(t.size * 0.16, -t.size * 0.08, t.size * 0.11, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-t.size * 0.32, t.size * 0.16);
            ctx.lineTo(0, t.size * 0.3);
            ctx.lineTo(t.size * 0.32, t.size * 0.16);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#071428');
            skyGradient.addColorStop(0.45, '#07101c');
            skyGradient.addColorStop(1, '#02050d');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            const aurora = ctx.createRadialGradient(width * 0.5, height * 0.12, 10, width * 0.5, height * 0.12, width * 0.55);
            aurora.addColorStop(0, 'rgba(99,243,255,0.17)');
            aurora.addColorStop(0.4, 'rgba(76,121,255,0.08)');
            aurora.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = aurora;
            ctx.fillRect(0, 0, width, height);

            backgroundStars.forEach(star => {
                const size = star.layer === 1 ? star.size : star.size * 0.5;
                ctx.globalAlpha = star.layer === 1 ? 0.65 : 0.3;
                ctx.fillStyle = star.layer === 1 ? 'rgba(182, 244, 255, 0.85)' : 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(star.x, star.y, size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = 'rgba(95, 238, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= width; x += 100) {
                ctx.moveTo(x, height * 0.35);
                ctx.lineTo(width * 0.5 + (x - width * 0.5) * 1.55, height);
            }
            for (let y = 0; y <= height; y += 80) {
                const perspective = y / height;
                ctx.moveTo(width * 0.14 * (1 - perspective), y);
                ctx.lineTo(width - width * 0.14 * (1 - perspective), y);
            }
            ctx.stroke();

            ctx.fillStyle = 'rgba(10, 18, 28, 0.42)';
            ctx.fillRect(0, height * 0.72, width, height * 0.28);

            targets.forEach(t => {
                drawSentinelDrone(t);

                ctx.shadowBlur = 0;
                const hpPct = t.hp / t.maxHp;
                ctx.fillStyle = 'rgba(255, 110, 136, 0.45)';
                ctx.fillRect(t.x - 24, t.y - t.size - 18, 48, 6);
                ctx.fillStyle = 'rgba(139, 255, 183, 0.92)';
                ctx.fillRect(t.x - 24, t.y - t.size - 18, 48 * hpPct, 6);
                ctx.strokeStyle = 'rgba(255,255,255,0.18)';
                ctx.strokeRect(t.x - 24, t.y - t.size - 18, 48, 6);
            });

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                if (p.type === 'tracer') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p.tx - 12, p.ty);
                    ctx.lineTo(p.tx + 12, p.ty);
                    ctx.moveTo(p.tx, p.ty - 12);
                    ctx.lineTo(p.tx, p.ty + 12);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(p.tx, p.ty, 18 * p.life, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1.0;

            const weapon = WEAPONS[currentWeaponIdx];
            ctx.strokeStyle = weapon.color;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12;
            ctx.shadowColor = weapon.color;

            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 20, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(mouseX - 28, mouseY);
            ctx.lineTo(mouseX - 10, mouseY);
            ctx.moveTo(mouseX + 10, mouseY);
            ctx.lineTo(mouseX + 28, mouseY);
            ctx.moveTo(mouseX, mouseY - 28);
            ctx.lineTo(mouseX, mouseY - 10);
            ctx.moveTo(mouseX, mouseY + 10);
            ctx.lineTo(mouseX, mouseY + 28);
            ctx.stroke();

            ctx.fillStyle = weapon.color;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2);
            ctx.fill();

            if (weaponCooldownTimer > 0) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.beginPath();
                const angle = (weaponCooldownTimer / weapon.cooldown) * Math.PI * 2;
                ctx.arc(mouseX, mouseY, 27, -Math.PI / 2, -Math.PI / 2 + angle);
                ctx.stroke();
            }

            if (weapon.name === 'Shotgun') {
                ctx.setLineDash([2, 4]);
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('weapon-bar').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            document.body.style.cursor = 'default';
        }

        /** 7. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('weapon-bar').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('weapon-bar').classList.remove('hidden');
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        resize();
        initBackground();
    });
    </script>
</body>
