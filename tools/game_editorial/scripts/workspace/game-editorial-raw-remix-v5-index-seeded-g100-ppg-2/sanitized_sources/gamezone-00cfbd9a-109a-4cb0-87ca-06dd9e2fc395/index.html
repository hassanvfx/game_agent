<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sunday Sketch</title>
    <!-- [agent-note][stage3] resolved-font: primary-display=Audiowide secondary-ui=Exo 2 via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #08111f;
            --bg-mid: #12243d;
            --panel: rgba(8, 16, 30, 0.84);
            --panel-strong: rgba(15, 28, 48, 0.94);
            --text-main: #f4fbff;
            --text-soft: rgba(230, 244, 255, 0.78);
            --accent-cyan: #6ee7ff;
            --accent-gold: #ffd36f;
            --accent-rose: #ff7aa8;
            --accent-ink: #081420;
            --choice-edge: #ff9ec0;
            --glow-soft: 0 0 22px rgba(110, 231, 255, 0.22);
        }

        /* Core Reset & Mobile Fixes */
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background:
                radial-gradient(circle at top, rgba(110, 231, 255, 0.08), transparent 32%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Layers */
        #game-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        
        .pointer-auto { pointer-events: auto; }
        
        /* Glass UI */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 36, 61, 0.96), rgba(8, 17, 31, 0.92));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(110, 231, 255, 0.22);
            box-shadow: 0 16px 44px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        
        .btn-glass {
            background: linear-gradient(180deg, #fff4d0, #ffd36f);
            color: var(--accent-ink);
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 0 18px rgba(255, 211, 111, 0.28);
            transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-glass:hover { box-shadow: 0 14px 28px rgba(0,0,0,0.3), 0 0 22px rgba(255, 211, 111, 0.38); }
        .btn-glass:active { transform: scale(0.96); background: linear-gradient(180deg, #fff8df, #ffd36f); }

        .scene-brand {
            font-family: 'Audiowide', cursive;
            letter-spacing: 0.18em;
            text-shadow: 0 0 16px rgba(110, 231, 255, 0.35);
        }

        .hero-title {
            font-family: 'Audiowide', cursive;
            text-shadow: 0 12px 28px rgba(0,0,0,0.48), 0 0 28px rgba(110, 231, 255, 0.16);
        }

        .hero-accent {
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(255, 211, 111, 0.3);
        }

        .scene-subtitle {
            max-width: 20rem;
            color: var(--text-soft);
        }

        .top-chip {
            background: rgba(8, 17, 31, 0.44);
            border: 1px solid rgba(110, 231, 255, 0.16);
            box-shadow: var(--glow-soft);
        }

        .choice-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(242,247,255,0.98));
            border-left-color: var(--choice-edge);
            box-shadow: 0 18px 34px rgba(0,0,0,0.24);
        }

        .choice-card::before {
            content: '✦';
            color: var(--accent-rose);
            margin-right: 0.75rem;
            font-size: 1rem;
        }

        .dialogue-shell::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                radial-gradient(circle at top right, rgba(110, 231, 255, 0.18), transparent 34%),
                radial-gradient(circle at bottom left, rgba(255, 122, 168, 0.12), transparent 30%);
        }

        .avatar-frame {
            box-shadow: 0 18px 36px rgba(0,0,0,0.42), 0 0 0 3px rgba(255,255,255,0.06);
        }

        .avatar-frame img {
            filter: saturate(1.08) contrast(1.05);
        }

        /* Avatar Styles */
        .avatar-frame {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
        }
        .avatar-hidden {
            transform: translateY(20px) scale(0.8);
            opacity: 0;
        }
        .avatar-visible {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .typing::after { content: '▋'; animation: blink 1s infinite; margin-left: 2px; color: #f472b6; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Spinner */
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .absolute { position: absolute; }
        .relative { position: relative; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-lg { max-width: 32rem; }
        .max-w-md { max-width: 28rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .pb-8 { padding-bottom: 2rem; }
        .pt-8 { padding-top: 2rem; }
        .pb-10 { padding-bottom: 2.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-10 { margin-bottom: 2.5rem; }
        .mb-12 { margin-bottom: 3rem; }
        .ml-2 { margin-left: 0.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .rounded-full { border-radius: 9999px; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-t-xl { border-top-left-radius: 0.75rem; border-top-right-radius: 0.75rem; }
        .rounded-tl-none { border-top-left-radius: 0; }
        .overflow-hidden { overflow: hidden; }
        .object-cover { object-fit: cover; }
        .inset-0 { inset: 0; }
        .bottom-0 { bottom: 0; }
        .left-0 { left: 0; }
        .right-6 { right: 1.5rem; }
        .bottom-4 { bottom: 1rem; }
        .text-white { color: #fff; }
        .text-gray-100 { color: #f3f4f6; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-900 { color: #111827; }
        .text-white\/50 { color: rgba(255,255,255,0.5); }
        .text-white\/60 { color: rgba(255,255,255,0.6); }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-pink-400 { color: #f472b6; }
        .bg-black { background: #000; }
        .bg-white { background: #fff; }
        .bg-gray-900 { background: #111827; }
        .bg-gray-800 { background: #1f2937; }
        .bg-black\/40 { background: rgba(0,0,0,0.4); }
        .bg-black\/60 { background: rgba(0,0,0,0.6); }
        .bg-black\/70 { background: rgba(0,0,0,0.7); }
        .backdrop-blur { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .transition { transition: all 0.2s ease; }
        .transition-all { transition: all 0.7s ease; }
        .transition-colors { transition: color 0.2s ease; }
        .duration-500 { transition-duration: 0.5s; }
        .duration-700 { transition-duration: 0.7s; }
        .opacity-0 { opacity: 0; }
        .hover\:text-white:hover { color: #fff; }
        .hover\:bg-gray-800:hover { background: #1f2937; }
        .hover\:bg-white:hover { background: #fff; }
        .hover\:scale-\[1\.02\]:hover { transform: scale(1.02); }
        .active\:scale-90:active { transform: scale(0.9); }
        .animate-bounce { animation: bounce 1s infinite; }
        .z-20 { z-index: 20; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .font-bold { font-weight: 700; }
        .font-light { font-weight: 300; }
        .font-serif { font-family: 'Audiowide', cursive; }
        .feedback-gif {
            position: absolute;
            top: 5.25rem;
            right: 0.9rem;
            width: min(32vw, 124px);
            aspect-ratio: 1;
            border-radius: 1rem;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 12px 28px rgba(0,0,0,0.3);
            background: rgba(8, 17, 31, 0.4);
            opacity: 0;
            transform: translateY(-8px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }
        .feedback-gif.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }
        .feedback-caption {
            position: absolute;
            top: calc(5.25rem + min(32vw, 124px) + 0.45rem);
            right: 0.9rem;
            max-width: min(46vw, 150px);
            padding: 0.35rem 0.55rem;
            border-radius: 999px;
            background: rgba(8, 17, 31, 0.7);
            border: 1px solid rgba(110, 231, 255, 0.18);
            color: rgba(244, 251, 255, 0.88);
            font-size: 0.7rem;
            line-height: 1.2;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }
        .feedback-caption.show {
            opacity: 1;
            transform: translateY(0);
        }
        .italic { font-style: italic; }
        .uppercase { text-transform: uppercase; }
        .tracking-tight { letter-spacing: -0.03em; }
        .tracking-wide { letter-spacing: 0.04em; }
        .tracking-widest { letter-spacing: 0.16em; }
        .leading-tight { line-height: 1.05; }
        .leading-relaxed { line-height: 1.6; }
        .drop-shadow-2xl { text-shadow: 0 10px 28px rgba(0,0,0,0.55); }
        .drop-shadow-md { text-shadow: 0 4px 12px rgba(0,0,0,0.45); }
        .shadow-2xl { box-shadow: 0 25px 45px rgba(0,0,0,0.35); }
        .shadow-xl { box-shadow: 0 18px 35px rgba(0,0,0,0.3); }
        .shadow-lg { box-shadow: 0 12px 24px rgba(0,0,0,0.25); }
        .border { border-width: 1px; border-style: solid; }
        .border-4 { border-width: 4px; border-style: solid; }
        .border-white\/10 { border-color: rgba(255,255,255,0.1); }
        .border-white\/20 { border-color: rgba(255,255,255,0.2); }
        .border-l-8 { border-left-width: 8px; border-left-style: solid; }
        .border-pink-500 { border-color: #ec4899; }
        .min-h-\[180px\] { min-height: 180px; }
        .w-10 { width: 2.5rem; }
        .h-10 { height: 2.5rem; }
        .w-24 { width: 6rem; }
        .h-24 { height: 6rem; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-5xl { font-size: 3rem; }
        .text-6xl { font-size: 3.75rem; }
        .gap-4 { gap: 1rem; }

        @media (min-width: 768px) {
            .md\:text-7xl { font-size: 4.5rem; }
        }

        @media (max-width: 640px) {
            .feedback-gif {
                top: auto;
                bottom: 8.5rem;
                right: 0.75rem;
                width: min(28vw, 96px);
            }
            .feedback-caption {
                top: auto;
                bottom: calc(8.5rem + min(28vw, 96px) + 0.4rem);
                right: 0.75rem;
                max-width: 36vw;
                font-size: 0.62rem;
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

<!-- Assets -->
<img id="asset_bg_park" crossorigin="anonymous" hidden src="https://gamezone-virid.vercel.app/assets/images/backgrounds/platformer/forest.png">
<img id="asset_girl" crossorigin="anonymous" hidden src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/player_idle.png">

<!-- Audio -->
<!-- [agent-note][stage3] resolved-audio: start/click/success/fail/ending loop from catalogs/audios.json -->
<audio id="bgm_main" loop preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" type="audio/mpeg">
</audio>
<audio id="bgm_end_good" loop preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3" type="audio/mpeg">
</audio>
<audio id="bgm_end_bad" loop preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3" type="audio/mpeg">
</audio>
<audio id="sfx_ui_click" preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" type="audio/mpeg">
</audio>
<audio id="sfx_start" preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" type="audio/mpeg">
</audio>
<audio id="sfx_success" preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" type="audio/mpeg">
</audio>
<audio id="sfx_fail" preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" type="audio/mpeg">
</audio>
<audio id="sfx_level_complete" preload="auto">
    <source src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" type="audio/mpeg">
</audio>

<!-- Loading Screen -->
<div id="loading-screen" class="absolute inset-0 z-[100] bg-gray-900 flex flex-col items-center justify-center text-white transition-opacity duration-500">
    <div class="spinner mb-4"></div>
    <p class="text-sm tracking-widest uppercase opacity-70 scene-brand">Loading Scene...</p>
</div>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full bg-black">
    <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: affection + fail reactions from catalogs/gifs.json; positioned off playfield to preserve taps -->
            <img id="feedback-gif" class="feedback-gif" alt="Scene reaction sticker" hidden>
            <div id="feedback-caption" class="feedback-caption" hidden></div>
        <!-- Top Bar -->
        <div class="w-full p-4 flex justify-between items-start pointer-auto z-50">
            <div class="text-white/50 text-xs tracking-widest uppercase mt-2 ml-2 top-chip scene-brand">Sunday Sketch</div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center z-50 pointer-auto transition-all duration-700 bg-black/60 backdrop-blur-sm">

                Sunday<br><span class="hero-accent italic">Sketch</span>
            </h1>

            <button id="start-btn" class="btn-glass px-12 py-4 rounded-full text-xl font-bold tracking-widest uppercase mb-6">

        <!-- Dialogue UI Wrapper -->

                <div id="avatar-frame" class="absolute -top-14 left-0 w-24 h-24 rounded-full border-4 border-white/20 shadow-2xl bg-gray-800 overflow-hidden z-20 avatar-hidden">

            </button>
        </div>
    </div>

<script>
/**
 * DATA & CONFIGURATION
 */
const CONFIG = {
    typingSpeed: 25,
};

const ASSETS = {
    images: {
        bg: 'asset_bg_park',
        girl: 'asset_girl',
        man: 'asset_man'
    }
};

// Map speaker names to asset keys for the portrait system
const SPEAKER_MAP = {
    'Leo': 'man',
    'Лео': 'man',
    '???': 'man', // Mystery man is still the man
    'Mia': 'girl',
    'Мия': 'girl'
};

const UI_TEXT = {
    en: {
        title: "Sunday Sketch",
        titleHtml: 'Sunday<br><span class="text-pink-400 italic">Sketch</span>',
        subtitle: "A sketchbook romance framed like a moonlit story panel.",
        start: "START SCENE",
        restart: "PLAY AGAIN",
        endTitle: "Scene Complete"
    }
};

const STORY = {
    en: {
        start: { text: "Sunday light settles over the park. Tap through the scene and choose how open you want to be.", speaker: null },
        meet_leo: { text: "Excuse me... is this spot taken?", speaker: "???" },
        leo_intro: { text: "I'm Leo. I come here to sketch people between sunbeams and page turns.", speaker: "Leo" },
        choice_1: { 
            text: "May I share the bench while I work on this drawing?", speaker: "Leo",
            choices: [
                { text: "Sure, take a seat.", next: 'sit_down' },
                { text: "I'd rather stay on my own.", next: 'leave_alone' }
            ]
        },
        sit_down: { text: "Thanks. I'm Mia. I'm trying to catch the mood of the park before it changes.", speaker: "Mia" },
        conversation: { text: "Then we're chasing the same thing. Your notebook already looks like the start of a good sketch.", speaker: "Leo" },
        choice_2: {
            text: "How do you answer?", speaker: "Mia",
            choices: [
                { text: "Ask Leo to compare notes with you.", next: 'good_ending_path' },
                { text: "Thank him and return to your work.", next: 'neutral_path' }
            ]
        },
        good_ending_path: { text: "Perfect. Let's trade pages and see which details we both noticed first.", speaker: "Leo" },
        neutral_path: { text: "Fair enough. I'll keep my side of the bench quiet and let the afternoon do the talking.", speaker: "Leo" },
        leave_alone: { text: "Understood. I'll find another angle. Enjoy the rest of the afternoon.", speaker: "Leo" },
        
        end_good: { title: "Shared Sketchbook", desc: "The bench turns into a tiny studio session, and the Sunday scene lasts far longer than expected." },
        end_neutral: { title: "Quiet Study", desc: "You keep the encounter brief, leaving behind a calm memory and an unfinished page." },
        end_bad: { title: "Private Afternoon", desc: "You keep the bench to yourself and the park returns to a still, solitary hush." }
    }
};

const SCENE_GRAPH = {
    start: { bg: 'bg', chars: [], next: 'meet_leo' },
    meet_leo: { bg: 'bg', chars: [{id: 'man', x: 0.5, scale: 1.0}], next: 'leo_intro' },
    leo_intro: { bg: 'bg', chars: [{id: 'man', x: 0.5, scale: 1.0}], next: 'choice_1' },
    choice_1: { bg: 'bg', chars: [{id: 'man', x: 0.5, scale: 1.0}] },
    sit_down: { bg: 'bg', chars: [{id: 'man', x: 0.35, scale: 0.95}, {id: 'girl', x: 0.75, scale: 0.95}], next: 'conversation' },
    conversation: { bg: 'bg', chars: [{id: 'man', x: 0.35, scale: 0.95}, {id: 'girl', x: 0.75, scale: 0.95}], next: 'choice_2' },
    choice_2: { bg: 'bg', chars: [{id: 'man', x: 0.35, scale: 0.95}, {id: 'girl', x: 0.75, scale: 0.95}] },
    good_ending_path: { bg: 'bg', chars: [{id: 'man', x: 0.4, scale: 1.0}, {id: 'girl', x: 0.6, scale: 1.0}], next: 'end_good' },
    neutral_path: { bg: 'bg', chars: [{id: 'man', x: 0.3, scale: 0.9}, {id: 'girl', x: 0.8, scale: 0.9}], next: 'end_neutral' },
    leave_alone: { bg: 'bg', chars: [{id: 'man', x: 0.5, scale: 0.8, alpha: 0.0}], next: 'end_bad' },
    end_good: { end: true },
    end_neutral: { end: true },
    end_bad: { end: true }
};

/**
 * ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = {
    startScreen: document.getElementById('start-screen'),
    startBtn: document.getElementById('start-btn'),
    langBtn: document.getElementById('lang-btn'),
    dialogueBox: document.getElementById('dialogue-container'),
    speaker: document.getElementById('speaker-name'),
    avatarFrame: document.getElementById('avatar-frame'),
    avatarImg: document.getElementById('avatar-img'),
    text: document.getElementById('dialogue-text'),
    choices: document.getElementById('choices-overlay'),
    indicator: document.getElementById('continue-indicator'),
    endScreen: document.getElementById('end-screen'),
    endTitle: document.getElementById('end-title'),
    endDesc: document.getElementById('end-desc'),
    restartBtn: document.getElementById('restart-btn'),
    loading: document.getElementById('loading-screen'),
    muteBtn: document.getElementById('mute-btn'),
    feedbackGif: document.getElementById('feedback-gif'),
    feedbackCaption: document.getElementById('feedback-caption')
};

let state = {
    lang: 'en',
    node: null,
    typing: false,
    textIndex: 0,
    timer: null,
    chars: [], 
    muted: false,
    loaded: false,
    feedbackTimer: null,
    currentEndingMood: 'main'
};

// Audio
const audio = {
    loops: {
        main: document.getElementById('bgm_main'),
        endGood: document.getElementById('bgm_end_good'),
        endBad: document.getElementById('bgm_end_bad')
    },
    sfx: {
        click: document.getElementById('sfx_ui_click'),
        start: document.getElementById('sfx_start'),
        success: document.getElementById('sfx_success'),
        fail: document.getElementById('sfx_fail'),
        complete: document.getElementById('sfx_level_complete')
    },
    init: false,
    currentLoop: null,
    lastSfxAt: {}
};

function configureAudio() {
    Object.values(audio.loops).forEach(loop => {
        loop.volume = loop.id === 'bgm_main' ? 0.2 : 0.18;
    });
    Object.entries(audio.sfx).forEach(([key, clip]) => {
        clip.volume = key === 'complete' ? 0.4 : 0.46;
    });
}

function stopAllLoops() {
    Object.values(audio.loops).forEach(loop => {
        loop.pause();
        loop.currentTime = 0;
    });
    audio.currentLoop = null;
}

function setLoop(loopName) {
    if (!audio.init || state.muted) return;
    const nextLoop = audio.loops[loopName];
    if (!nextLoop || audio.currentLoop === nextLoop) return;

    if (audio.currentLoop) {
        audio.currentLoop.pause();
        audio.currentLoop.currentTime = 0;
    }

    audio.currentLoop = nextLoop;
    nextLoop.play().catch(() => {});
}

function initAudio() {
    if (audio.init) return;
    audio.init = true;
    configureAudio();
    setLoop('main');
}

function toggleMute() {
    state.muted = !state.muted;
    ui.muteBtn.textContent = state.muted ? '🔇' : '🔊';
    if (state.muted) {
        stopAllLoops();
    } else if (audio.init) {
        setLoop(state.currentEndingMood);
    }
}

function playSfx(name = 'click', debounceMs = 90) {
    if (state.muted || !audio.init) return;
    const clip = audio.sfx[name];
    if (!clip) return;

    const now = performance.now();
    if (audio.lastSfxAt[name] && now - audio.lastSfxAt[name] < debounceMs) return;
    audio.lastSfxAt[name] = now;

    clip.currentTime = 0;
    clip.play().catch(() => {});
}

function showFeedback(kind) {
    const FEEDBACK = {
        affection: {
            src: 'https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp',
            caption: 'sparked connection'
        },
        awkward: {
            src: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',
            caption: 'quiet distance'
        }
    };
    const card = FEEDBACK[kind];
    if (!card) return;

    if (state.feedbackTimer) {
        clearTimeout(state.feedbackTimer);
    }

    ui.feedbackGif.hidden = false;
    ui.feedbackCaption.hidden = false;
    ui.feedbackGif.src = card.src;
    ui.feedbackGif.classList.add('show');
    ui.feedbackCaption.textContent = card.caption;
    ui.feedbackCaption.classList.add('show');

    state.feedbackTimer = setTimeout(() => {
        ui.feedbackGif.classList.remove('show');
        ui.feedbackCaption.classList.remove('show');
        setTimeout(() => {
            ui.feedbackGif.hidden = true;
            ui.feedbackCaption.hidden = true;
        }, 250);
    }, 2200);
}

// Resizing
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Asset Loading
function preloadAssets() {
    const images = Object.values(ASSETS.images).map(id => document.getElementById(id));
    let loadedCount = 0;
    const total = images.length;

    const checkDone = () => {
        loadedCount++;
        if (loadedCount >= total) {
            state.loaded = true;
            ui.loading.classList.add('opacity-0');
            setTimeout(() => ui.loading.classList.add('hidden'), 500);
        }
    };

    images.forEach(img => {
        if (img.complete) checkDone();
        else {
            img.onload = checkDone;
            img.onerror = checkDone; 
        }
    });
}

// Rendering
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Background
    const bgImg = document.getElementById(ASSETS.images.bg);
    if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
        const ratio = Math.max(canvas.width / bgImg.naturalWidth, canvas.height / bgImg.naturalHeight);
        const w = bgImg.naturalWidth * ratio;
        const h = bgImg.naturalHeight * ratio;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        ctx.drawImage(bgImg, x, y, w, h);
    } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    
    // Darken BG
    const dawnGlow = ctx.createLinearGradient(0, 0, 0, canvas.height);
    dawnGlow.addColorStop(0, 'rgba(12, 32, 60, 0.18)');
    dawnGlow.addColorStop(1, 'rgba(5, 10, 20, 0.52)');
    ctx.fillStyle = dawnGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const halo = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.22, 10, canvas.width * 0.5, canvas.height * 0.22, canvas.width * 0.42);
    halo.addColorStop(0, 'rgba(255, 211, 111, 0.18)');
    halo.addColorStop(1, 'rgba(255, 211, 111, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Characters (Canvas Layer)
    state.chars.forEach(char => {
        const img = document.getElementById(ASSETS.images[char.id]);
        
        // Update lerp
        char.currentAlpha += (char.alpha - char.currentAlpha) * 0.1;
        char.currentX += (char.x - char.currentX) * 0.1;

        if (char.currentAlpha < 0.01) return;

        if (img && img.complete && img.naturalWidth > 0) {
            const h = canvas.height * 0.85 * char.scale; 
            const w = (img.naturalWidth / img.naturalHeight) * h;
            const x = (canvas.width * char.currentX) - (w / 2);
            const y = canvas.height - h + 20;

            ctx.save();
            ctx.globalAlpha = char.currentAlpha;
            ctx.shadowColor = char.id === 'man' ? 'rgba(110, 231, 255, 0.28)' : 'rgba(255, 122, 168, 0.24)';
            ctx.shadowBlur = 24;
            ctx.drawImage(img, x, y, w, h);

            const highlight = ctx.createLinearGradient(x, y, x, y + h);
            highlight.addColorStop(0, 'rgba(255,255,255,0.14)');
            highlight.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = highlight;
            ctx.fillRect(x, y, w, h);
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = Math.max(0, char.currentAlpha * 0.16);
            ctx.fillStyle = char.id === 'man' ? '#6ee7ff' : '#ff7aa8';
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h * 0.98, w * 0.28, 12 * char.scale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else {
            // Fallback if image fails (ensures user sees "something")
            ctx.save();
            ctx.globalAlpha = char.currentAlpha;
            ctx.fillStyle = char.id === 'man' ? '#4a6fa5' : '#d66ba0';
            const h = canvas.height * 0.6 * char.scale;
            const w = h * 0.4;
            const x = (canvas.width * char.currentX) - (w / 2);
            const y = canvas.height - h;
            ctx.fillRect(x, y, w, h);
            ctx.restore();
        }
    });
    
    requestAnimationFrame(draw);
}

// Logic
function setLanguage(l) {
    state.lang = l;
    const t = UI_TEXT[l];
    ui.startBtn.textContent = t.start;
    ui.restartBtn.textContent = t.restart;
    ui.endTitle.textContent = t.endTitle;
    document.querySelector('h1').innerHTML = t.titleHtml;
    document.querySelector('#start-screen p').textContent = t.subtitle;
}

function updateSpeakerUI(speakerName) {
    // 1. Handle Name Tag
    if (speakerName) {
        ui.speaker.textContent = speakerName;
        ui.speaker.parentElement.classList.remove('hidden');
        ui.speaker.classList.remove('hidden');
    } else {
        ui.speaker.parentElement.classList.add('hidden');
        ui.speaker.classList.add('hidden');
    }

    // 2. Handle Avatar (Portrait)
    // Check if we have a mapping for this speaker
    const assetKey = SPEAKER_MAP[speakerName];
    if (assetKey) {
        const imgEl = document.getElementById(ASSETS.images[assetKey]);
        if (imgEl) {
            ui.avatarImg.src = imgEl.src;
            ui.avatarFrame.classList.remove('avatar-hidden');
            ui.avatarFrame.classList.add('avatar-visible');
        } else {
            ui.avatarFrame.classList.add('avatar-hidden');
            ui.avatarFrame.classList.remove('avatar-visible');
        }
    } else {
        // No avatar for narrator or unknown
        ui.avatarFrame.classList.add('avatar-hidden');
        ui.avatarFrame.classList.remove('avatar-visible');
    }
}

function loadNode(id) {
    state.node = id;
    const data = STORY[state.lang][id];
    const scene = SCENE_GRAPH[id];

    if (scene.end) {
        showEnd(data);
        return;
    }

    // Canvas Characters Update
    if (scene.chars) {
        const newIds = scene.chars.map(c => c.id);
        state.chars.forEach(c => {
            if (!newIds.includes(c.id)) c.alpha = 0;
        });

        scene.chars.forEach(c => {
            let existing = state.chars.find(ex => ex.id === c.id);
            if (existing) {
                existing.x = c.x;
                existing.scale = c.scale;
                existing.alpha = (c.alpha !== undefined) ? c.alpha : 1;
            } else {
                state.chars.push({
                    id: c.id,
                    x: c.x,
                    scale: c.scale,
                    alpha: (c.alpha !== undefined) ? c.alpha : 1,
                    currentAlpha: 0,
                    currentX: c.x
                });
            }
        });
    }

    // UI Updates
    ui.dialogueBox.classList.remove('hidden');
    ui.choices.classList.add('hidden');
    ui.indicator.classList.add('hidden');

    // Update Speaker & Avatar
    updateSpeakerUI(data.speaker);

    // Typewriter
    ui.text.textContent = "";
    ui.text.classList.add('typing');
    state.typing = true;
    state.textIndex = 0;
    
    if (state.timer) clearInterval(state.timer);
    state.timer = setInterval(() => {
        ui.text.textContent += data.text.charAt(state.textIndex);
        state.textIndex++;
        if (state.textIndex >= data.text.length) {
            completeTyping();
        }
    }, CONFIG.typingSpeed);
}

function completeTyping() {
    clearInterval(state.timer);
    state.typing = false;
    const data = STORY[state.lang][state.node];
    ui.text.textContent = data.text;
    ui.text.classList.remove('typing');

    if (data.choices) {
        showChoices(data.choices);
    } else {
        ui.indicator.classList.remove('hidden');
    }
}

function showChoices(choices) {
    ui.choices.innerHTML = '';
    ui.choices.classList.remove('hidden');
    
    choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-card w-full max-w-md p-5 text-gray-900 rounded-xl font-bold text-lg shadow-xl hover:bg-white hover:scale-[1.02] transition transform border-l-8 text-left mb-2';
        btn.textContent = c.text;
        btn.onclick = (e) => {
            e.stopPropagation();
            const isPositive = c.next === 'sit_down' || c.next === 'good_ending_path';
            playSfx(isPositive ? 'success' : 'fail', 0);
            showFeedback(isPositive ? 'affection' : 'awkward');
            loadNode(c.next);
        };
        ui.choices.appendChild(btn);
    });
}

function showEnd(data) {
    ui.dialogueBox.classList.add('hidden');
    ui.endScreen.classList.remove('hidden');
    ui.endScreen.querySelector('h2').textContent = data.title;
    ui.endScreen.querySelector('p').textContent = data.desc;

    const isGoodEnding = state.node === 'end_good';
    const isNeutralEnding = state.node === 'end_neutral';
    state.currentEndingMood = isGoodEnding ? 'endGood' : (isNeutralEnding ? 'main' : 'endBad');
    if (audio.init && !state.muted) {
        setLoop(state.currentEndingMood);
    }
    playSfx(isGoodEnding ? 'complete' : (isNeutralEnding ? 'success' : 'fail'), 0);
    showFeedback(isGoodEnding ? 'affection' : 'awkward');
}

// Interaction
document.addEventListener('pointerup', (e) => {
    if (!state.loaded) return;
    initAudio();

    // [agent-note][stage4] repaired: mobile-action-path | element: global pointerup | action: allow nested button taps to keep native CTA behavior
    if (e.target.closest('button')) return;

    // Handle Dialogue Advance
    if (!ui.dialogueBox.classList.contains('hidden') && !ui.choices.classList.contains('hidden')) return; 
    if (!ui.dialogueBox.classList.contains('hidden')) {
        if (state.typing) {
            completeTyping();
        } else {
            const current = SCENE_GRAPH[state.node];
            if (current && current.next) {
                playSfx();
                loadNode(current.next);
            }
        }
    }
});

// Buttons
ui.startBtn.addEventListener('click', () => {
    playSfx('start', 0);
    state.currentEndingMood = 'main';
    setLoop('main');
    ui.startScreen.classList.add('opacity-0');
    setTimeout(() => ui.startScreen.classList.add('hidden'), 700);
    loadNode('start');
});


ui.restartBtn.addEventListener('click', () => {
    playSfx('click', 0);
    state.currentEndingMood = 'main';
    setLoop('main');
    ui.endScreen.classList.add('hidden');
    state.chars = [];
    loadNode('start');
});

ui.muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMute();
});

// Init
preloadAssets();
setLanguage('en');
requestAnimationFrame(draw);

</script>
</body>
