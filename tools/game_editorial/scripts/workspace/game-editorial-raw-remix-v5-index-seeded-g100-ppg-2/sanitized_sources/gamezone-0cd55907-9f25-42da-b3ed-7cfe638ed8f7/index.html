<style>

    /* STRICT HEIGHT CHAIN - DO NOT MODIFY */
    html, body {

                max(1rem, env(safe-area-inset-top))

</style>

<audio id="bgm_shop" data-editable="audio" data-label="Shop BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_ui_click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<audio id="sfx_enemy_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3" preload="auto"></audio>

<script>
/**
 * L0: System Invariants & Core Setup
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let initialized = false;

// Config
let gameConfig = {};
try {
    const configRaw = JSON.parse(document.getElementById('game-config').textContent);
    for (const key in configRaw) gameConfig[key] = configRaw[key].value;
} catch (e) {
    gameConfig = { basePlayerSpeed: 200, themeColor: '#00ffff' };
}

// State Machine
let gameState = 'INIT'; // INIT, PLAYING, SHOP, GAMEOVER
let lastTime = 0;
let frameId;

// Game Data
const state = {
    cash: 0,
    wave: 1,
    enemiesToSpawn: 0,
    enemiesActive: 0,
    spawnTimer: 0,
    cameraShake: 0
};

const player = {
    x: 0, y: 0, r: 12,
    vx: 0, vy: 0,
    hp: 100, maxHp: 100,
    weaponIdx: 0,
    shootCooldown: 0,
    ownedWeapons: [0]
};

let entities = {
    bullets: [],
    enemies: [],
    particles: [],
    texts: []
};

// Weapons Data
const WEAPONS = [
    { name: 'PATCHER', type: 'pistol', cost: 0, dmg: 25, fireRate: 0.4, speed: 600, spread: 0.05, pierce: 1, pellets: 1, color: '#fff', sound: 'pistol' },
    { name: 'SPARK SWARM', type: 'smg', cost: 300, dmg: 15, fireRate: 0.08, speed: 700, spread: 0.15, pierce: 1, pellets: 1, color: '#0ff', sound: 'smg' },
    { name: 'BREACH LOCK', type: 'ar', cost: 800, dmg: 40, fireRate: 0.15, speed: 800, spread: 0.08, pierce: 1, pellets: 1, color: '#fa0', sound: 'ar' },
    { name: 'PURGE BURST', type: 'shotgun', cost: 1200, dmg: 20, fireRate: 0.8, speed: 500, spread: 0.3, pierce: 1, pellets: 6, color: '#f0f', sound: 'shotgun' },
    { name: 'ROOT CUTTER', type: 'sniper', cost: 2500, dmg: 150, fireRate: 1.2, speed: 1200, spread: 0.01, pierce: 5, pellets: 1, color: '#f00', sound: 'sniper' }
];

/**
 * Audio System (L1 & L2)
 */
const audio = {
    ctx: null,
    unlocked: false,
    bgmGame: document.getElementById('bgm_game'),
    bgmShop: document.getElementById('bgm_shop'),
    loops: [],
    sfx: {},
    noiseBuffer: null,

    init() {
        if (this.unlocked) return;
        try {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.createNoiseBuffer();
            this.cacheMedia();
            this.unlocked = true;
            this.switchBGM(gameState === 'SHOP' ? 'shop' : 'game');
        } catch (e) { console.warn('Audio init failed', e); }
    },

    cacheMedia() {
        this.loops = [this.bgmGame, this.bgmShop];
        this.loops.forEach(track => {
            track.volume = 0.2;
            track.preload = 'auto';
        });
        this.sfx = {
            click: document.getElementById('sfx_ui_click'),
            success: document.getElementById('sfx_buy_success'),
            blocked: document.getElementById('sfx_blocked'),
            enemyHit: document.getElementById('sfx_enemy_hit'),
            enemyDefeat: document.getElementById('sfx_enemy_defeat'),
            damage: document.getElementById('sfx_damage'),
            waveClear: document.getElementById('sfx_wave_clear'),
            gameOver: document.getElementById('sfx_game_over')
        };
        Object.values(this.sfx).forEach(sample => {
            if (sample) sample.volume = 0.44;
        });
        if (this.sfx.enemyHit) this.sfx.enemyHit.volume = 0.2;
        if (this.sfx.enemyDefeat) this.sfx.enemyDefeat.volume = 0.34;
        if (this.sfx.damage) this.sfx.damage.volume = 0.36;
        if (this.sfx.waveClear) this.sfx.waveClear.volume = 0.46;
        if (this.sfx.gameOver) this.sfx.gameOver.volume = 0.42;
    },

    createNoiseBuffer() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }
    },

    safePlay(media) {
        if (!this.unlocked || !media) return;
        media.play().catch(() => {});
    },

    safePause(media) {
        if (!media) return;
        media.pause();
        media.currentTime = 0;
    },

    playSfx(name, restart = true) {
        const sample = this.sfx[name];
        if (!this.unlocked || !sample) return;
        try {
            if (restart) sample.currentTime = 0;
            sample.play().catch(() => {});
        } catch (_) {}
    },

    switchBGM(track) {
        if (!this.unlocked) return;
        if (track === 'game') {
            this.safePause(this.bgmShop);
            this.safePlay(this.bgmGame);
        } else if (track === 'shop') {
            this.safePause(this.bgmGame);
            this.safePlay(this.bgmShop);
        } else {
            this.safePause(this.bgmGame);
            this.safePause(this.bgmShop);
        }
    },

    playGunshot(profile) {
        if (!this.ctx || !this.noiseBuffer) return;
        const t = this.ctx.currentTime;
        const noiseSrc = this.ctx.createBufferSource();
        noiseSrc.buffer = this.noiseBuffer;
        const noiseFilter = this.ctx.createBiquadFilter();
        const noiseGain = this.ctx.createGain();

        noiseSrc.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);

        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);

        if (profile === 'pistol') {
            noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 1000;
            noiseGain.gain.setValueAtTime(0.4, t); noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
            osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
            oscGain.gain.setValueAtTime(0.18, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
            noiseSrc.start(t); noiseSrc.stop(t + 0.08); osc.start(t); osc.stop(t + 0.08);
        } else if (profile === 'smg') {
            noiseFilter.type = 'highpass'; noiseFilter.frequency.value = 2000;
            noiseGain.gain.setValueAtTime(0.28, t); noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.04);
            oscGain.gain.setValueAtTime(0.12, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);
            noiseSrc.start(t); noiseSrc.stop(t + 0.04); osc.start(t); osc.stop(t + 0.04);
        } else if (profile === 'ar') {
            noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 1500;
            noiseGain.gain.setValueAtTime(0.35, t); noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.1);
            oscGain.gain.setValueAtTime(0.14, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            noiseSrc.start(t); noiseSrc.stop(t + 0.1); osc.start(t); osc.stop(t + 0.1);
        } else if (profile === 'shotgun') {
            noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 3000;
            noiseGain.gain.setValueAtTime(0.55, t); noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
            osc.type = 'square'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(20, t + 0.18);
            oscGain.gain.setValueAtTime(0.2, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
            noiseSrc.start(t); noiseSrc.stop(t + 0.18); osc.start(t); osc.stop(t + 0.18);
        } else if (profile === 'sniper') {
            noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 2000;
            noiseGain.gain.setValueAtTime(0.58, t); noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, t); osc.frequency.exponentialRampToValueAtTime(10, t + 0.22);
            oscGain.gain.setValueAtTime(0.24, t); oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
            noiseSrc.start(t); noiseSrc.stop(t + 0.22); osc.start(t); osc.stop(t + 0.22);
        }
    },

    playHit() {
        this.playSfx('enemyHit');
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(200, t + 0.04);
        gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);
        osc.start(t); osc.stop(t + 0.04);
    }
};

const feedback = {
    successEl: document.getElementById('gif-success'),
    failEl: document.getElementById('gif-fail'),
    successTimer: null,
    failTimer: null,

    show(type, duration = 1200) {
        const key = type === 'fail' ? 'failEl' : 'successEl';
        const timerKey = type === 'fail' ? 'failTimer' : 'successTimer';
        const el = this[key];
        if (!el) return;
        el.classList.add('active');
        clearTimeout(this[timerKey]);
        this[timerKey] = setTimeout(() => el.classList.remove('active'), duration);
    }
};

function vibrate(style = 'light') {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
    });
}

/**
 * Input Handling
 */
const input = { active: false, x: 0, y: 0, startX: 0, startY: 0, pStartX: 0, pStartY: 0 };

function handleGlobalInput(e) {
    audio.init();
    if (gameState === 'GAMEOVER') return;
    
    if (e.type === 'pointerdown') {
        input.active = true;
        input.startX = e.clientX;
        input.startY = e.clientY;
        input.pStartX = player.x;
        input.pStartY = player.y;
    } else if (e.type === 'pointermove' && input.active) {
        // Relative drag movement
        const dx = e.clientX - input.startX;
        const dy = e.clientY - input.startY;
        // Map drag distance to target position
        input.x = input.pStartX + dx * 1.5;
        input.y = input.pStartY + dy * 1.5;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        input.active = false;
    }
}

window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', handleGlobalInput, { passive: false });
window.addEventListener('pointerup', handleGlobalInput, { passive: false });
window.addEventListener('pointercancel', handleGlobalInput, { passive: false });

document.getElementById('restart-btn').addEventListener('click', (e) => {
    audio.init();
    audio.playSfx('click');
    if (gameState === 'GAMEOVER') restartGame();
});

document.getElementById('next-wave-btn').addEventListener('click', (e) => {
    audio.init();
    audio.playSfx('click');
    if (gameState === 'SHOP') startWave();
});

/**
 * Viewport & Resize
 */
const ro = new ResizeObserver(entries => {
    for (let entry of entries) {
        const cr = entry.contentRect;
        cw = cr.width;
        ch = cr.height;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initGame();
        } else {
            // Clamp player
            if (isFinite(player.x)) player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
            if (isFinite(player.y)) player.y = Math.max(player.r, Math.min(ch - player.r, player.y));
        }
    }
});

/**
 * UI State
 */
function setUIState(newState) {
    gameState = newState;
    document.getElementById('hud').classList.toggle('hidden', newState !== 'PLAYING');
    document.getElementById('shop-screen').classList.toggle('hidden', newState !== 'SHOP');
    document.getElementById('game-over-screen').classList.toggle('hidden', newState !== 'GAMEOVER');
    
    if (newState === 'SHOP') {
        audio.switchBGM('shop');
        renderShop();
    } else if (newState === 'PLAYING') {
        audio.switchBGM('game');
    } else if (newState === 'GAMEOVER') {
        audio.switchBGM('none');
        audio.playSfx('gameOver');
        feedback.show('fail', 1800);
        document.getElementById('go-waves').textContent = state.wave - 1;
    }
}

function updateHUD() {
    document.getElementById('hud-cash').textContent = state.cash;
    document.getElementById('hud-wave').textContent = state.wave;
    document.getElementById('hud-weapon').textContent = WEAPONS[player.weaponIdx].name;
    const hpPct = Math.max(0, player.hp / player.maxHp) * 100;
    document.getElementById('hud-hp-bar').style.width = hpPct + '%';
}

/**
 * Shop Logic
 */
function renderShop() {
    document.getElementById('shop-cash').textContent = state.cash;
    const list = document.getElementById('weapon-list');
    list.innerHTML = '';
    
    WEAPONS.forEach((w, idx) => {
        const isOwned = player.ownedWeapons.includes(idx);
        const isEquipped = player.weaponIdx === idx;
        const canAfford = state.cash >= w.cost;
        
        const div = document.createElement('div');
        div.className = `cyber-panel weapon-card p-3 flex justify-between items-center ${isEquipped ? 'border-green-400' : ''}`;
        
        let btnHTML = '';
        if (isEquipped) {
            btnHTML = `<button class="cyber-btn equipped px-4 py-2 text-sm" disabled>ACTIVE</button>`;
        } else if (isOwned) {
            btnHTML = `<button class="cyber-btn px-4 py-2 text-sm" onclick="equipWeapon(${idx})">LOAD</button>`;
        } else {
            btnHTML = `<button class="cyber-btn px-4 py-2 text-sm ${!canAfford ? 'disabled' : ''}" onclick="buyWeapon(${idx})">$${w.cost}</button>`;
        }
        
        div.innerHTML = `
            <div>
                <div class="font-bold text-lg text-glow" style="color: ${w.color}">${w.name}</div>
                <div class="text-xs weapon-meta">PURGE:${w.dmg} | RATE:${1/w.fireRate|0}/s</div>
            </div>
            ${btnHTML}
        `;
        list.appendChild(div);
    });
}

window.buyWeapon = function(idx) {
    const w = WEAPONS[idx];
    if (state.cash >= w.cost && !player.ownedWeapons.includes(idx)) {
        state.cash -= w.cost;
        player.ownedWeapons.push(idx);
        audio.playSfx('success');
        feedback.show('success', 1100);
        equipWeapon(idx);
        vibrate('light');
    } else {
        audio.playSfx('blocked');
    }
};

window.equipWeapon = function(idx) {
    player.weaponIdx = idx;
    audio.playSfx('click');
    renderShop();
    updateHUD();
};

/**
 * Game Logic
 */
function initGame() {
    player.x = cw / 2;
    player.y = ch / 2;
    player.hp = player.maxHp;
    player.weaponIdx = 0;
    player.ownedWeapons = [0];
    
    state.cash = 0;
    state.wave = 1;
    
    entities.bullets = [];
    entities.enemies = [];
    entities.particles = [];
    entities.texts = [];
    
    initialized = true;
    startWave();
    
    lastTime = performance.now();
    if (!frameId) frameId = requestAnimationFrame(gameLoop);
}

function restartGame() {
    initGame();
}

function startWave() {
    setUIState('PLAYING');
    state.enemiesToSpawn = 5 + state.wave * 3;
    state.enemiesActive = 0;
    state.spawnTimer = 0;
    player.hp = player.maxHp; // Heal on new wave
    updateHUD();
}

function spawnEnemy() {
    const r = 15;
    let ex, ey;
    // Spawn outside screen
    if (Math.random() > 0.5) {
        ex = Math.random() > 0.5 ? -r : cw + r;
        ey = Math.random() * ch;
    } else {
        ex = Math.random() * cw;
        ey = Math.random() > 0.5 ? -r : ch + r;
    }
    
    const hp = 30 + state.wave * 15;
    const speed = 50 + Math.random() * 30 + (state.wave * 2);
    
    entities.enemies.push({ x: ex, y: ey, r, hp, maxHp: hp, speed, type: Math.random() > 0.8 ? 'fast' : 'normal' });
    state.enemiesActive++;
    state.enemiesToSpawn--;
}

function spawnParticles(x, y, color, count, speedBase) {
    for (let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * speedBase;
        entities.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color
        });
    }
}

function spawnText(x, y, text, color) {
    entities.texts.push({ x, y, text, color, life: 1, vy: -30 });
}

function shoot() {
    const w = WEAPONS[player.weaponIdx];
    if (player.shootCooldown > 0) return;
    
    // Find closest enemy
    let closest = null;
    let minDist = Infinity;
    for (let e of entities.enemies) {
        const dist = Math.hypot(e.x - player.x, e.y - player.y);
        if (dist < minDist) { minDist = dist; closest = e; }
    }
    
    if (!closest) return; // Don't shoot if no enemies
    
    const angleToTarget = Math.atan2(closest.y - player.y, closest.x - player.x);
    
    for (let i = 0; i < w.pellets; i++) {
        const spreadAngle = angleToTarget + (Math.random() - 0.5) * w.spread;
        entities.bullets.push({
            x: player.x, y: player.y,
            vx: Math.cos(spreadAngle) * w.speed,
            vy: Math.sin(spreadAngle) * w.speed,
            dmg: w.dmg,
            pierce: w.pierce,
            color: w.color,
            hitIds: new Set() // Prevent hitting same enemy multiple times per frame
        });
    }
    
    player.shootCooldown = w.fireRate;
    state.cameraShake = Math.min(state.cameraShake + 3, 10);
    
    // Recoil
    player.x -= Math.cos(angleToTarget) * 3;
    player.y -= Math.sin(angleToTarget) * 3;
    
    audio.playGunshot(w.sound);
    vibrate('light');
}

function update(dt) {
    if (gameState !== 'PLAYING') return;
    
    // Player movement (follow input target)
    if (input.active) {
        const tx = Math.max(player.r, Math.min(cw - player.r, input.x));
        const ty = Math.max(player.r, Math.min(ch - player.r, input.y));
        const dx = tx - player.x;
        const dy = ty - player.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist > 5) {
            const speed = gameConfig.basePlayerSpeed;
            player.x += (dx / dist) * speed * dt;
            player.y += (dy / dist) * speed * dt;
        }
    }
    
    // Safety check
    if (!isFinite(player.x)) player.x = cw/2;
    if (!isFinite(player.y)) player.y = ch/2;
    player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
    player.y = Math.max(player.r, Math.min(ch - player.r, player.y));

    // Shooting
    if (player.shootCooldown > 0) player.shootCooldown -= dt;
    shoot();

    // Wave Management
    if (state.enemiesToSpawn > 0) {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
            spawnEnemy();
            state.spawnTimer = Math.max(0.2, 1.5 - state.wave * 0.1);
        }
    } else if (state.enemiesActive === 0) {
        state.wave++;
        audio.playSfx('waveClear');
        feedback.show('success', 1300);
        setUIState('SHOP');
        return;
    }

    // Enemies
    for (let i = entities.enemies.length - 1; i >= 0; i--) {
        let e = entities.enemies[i];
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);
        
        let moveSpeed = e.speed;
        if (e.type === 'fast') moveSpeed *= 1.5;
        
        if (dist > 0) {
            e.x += (dx / dist) * moveSpeed * dt;
            e.y += (dy / dist) * moveSpeed * dt;
        }
        
        // Player Collision
        if (dist < player.r + e.r) {
            player.hp -= 10;
            audio.playSfx('damage');
            if (player.hp <= player.maxHp * 0.45) {
                feedback.show('fail', 900);
            }
            updateHUD();
            state.cameraShake = 15;
            vibrate('heavy');
            
            // Pushback
            e.x -= (dx / dist) * 20;
            e.y -= (dy / dist) * 20;
            
            if (player.hp <= 0) {
                spawnParticles(player.x, player.y, '#f00', 50, 200);
                setUIState('GAMEOVER');
                return;
            }
        }
    }

    // Bullets
    for (let i = entities.bullets.length - 1; i >= 0; i--) {
        let b = entities.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        
        // Screen bounds
        if (b.x < 0 || b.x > cw || b.y < 0 || b.y > ch) {
            entities.bullets.splice(i, 1);
            continue;
        }
        
        // Enemy collision
        let hit = false;
        for (let j = entities.enemies.length - 1; j >= 0; j--) {
            let e = entities.enemies[j];
            if (b.hitIds.has(e)) continue;
            
            if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 5) {
                e.hp -= b.dmg;
                b.pierce--;
                b.hitIds.add(e);
                hit = true;
                
                audio.playHit();
                spawnParticles(b.x, b.y, b.color, 3, 50);
                
                if (e.hp <= 0) {
                    const reward = e.type === 'fast' ? 15 : 10;
                    state.cash += reward;
                    audio.playSfx('enemyDefeat');
                    if (e.type === 'fast' || Math.random() > 0.5) {
                        feedback.show('success', 700);
                    }
                    updateHUD();
                    spawnParticles(e.x, e.y, '#0f0', 15, 100);
                    spawnText(e.x, e.y, `+$${reward}`, '#0f0');
                    entities.enemies.splice(j, 1);
                    state.enemiesActive--;
                }
                
                if (b.pierce <= 0) break;
            }
        }
        if (hit && b.pierce <= 0) entities.bullets.splice(i, 1);
    }

    // Particles
    for (let i = entities.particles.length - 1; i >= 0; i--) {
        let p = entities.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay;
        if (p.life <= 0) entities.particles.splice(i, 1);
    }
    
    // Texts
    for (let i = entities.texts.length - 1; i >= 0; i--) {
        let t = entities.texts[i];
        t.y += t.vy * dt;
        t.life -= dt;
        if (t.life <= 0) entities.texts.splice(i, 1);
    }

    if (state.cameraShake > 0) state.cameraShake -= dt * 30;
    if (state.cameraShake < 0) state.cameraShake = 0;
}

    function draw() {
        const pulse = performance.now() * 0.0015;

        // Clear with trail effect
        ctx.fillStyle = 'rgba(3, 6, 12, 0.3)';
        ctx.fillRect(0, 0, cw, ch);

        const bgGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.42, 10, cw * 0.5, ch * 0.5, Math.max(cw, ch) * 0.72);
        bgGradient.addColorStop(0, 'rgba(16, 42, 68, 0.35)');
        bgGradient.addColorStop(0.45, 'rgba(6, 17, 30, 0.22)');
        bgGradient.addColorStop(1, 'rgba(2, 4, 8, 0.08)');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, cw, ch);
    
    if (gameState !== 'PLAYING' && gameState !== 'GAMEOVER') return;

    ctx.save();
    if (state.cameraShake > 0) {
        const sx = (Math.random() - 0.5) * state.cameraShake;
        const sy = (Math.random() - 0.5) * state.cameraShake;
        ctx.translate(sx, sy);
    }

    // Grid Background (Depth Cue)
    const horizon = ctx.createLinearGradient(0, 0, 0, ch);
    horizon.addColorStop(0, 'rgba(101, 236, 255, 0.08)');
    horizon.addColorStop(1, 'rgba(101, 236, 255, 0)');
    ctx.fillStyle = horizon;
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = 'rgba(101, 236, 255, 0.08)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    const offsetX = (player.x * -0.1) % gridSize;
    const offsetY = (player.y * -0.1) % gridSize;
    ctx.beginPath();
    for(let x = offsetX; x < cw; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, ch); }
    for(let y = offsetY; y < ch; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(194, 116, 255, 0.08)';
    ctx.beginPath();
    for (let x = offsetX + gridSize * 0.5; x < cw; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
    }
    ctx.stroke();

    // Particles
    ctx.globalCompositeOperation = 'lighter';
    for (let p of entities.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(Math.max(0, p.x), Math.max(0, p.y), 2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bullets
    for (let b of entities.bullets) {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.beginPath();
        ctx.arc(Math.max(0, b.x), Math.max(0, b.y), 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Enemies
    ctx.globalCompositeOperation = 'source-over';
    for (let e of entities.enemies) {
        const enemyStroke = e.type === 'fast' ? '#c274ff' : '#ff5876';
        const enemyFill = e.type === 'fast' ? 'rgba(194, 116, 255, 0.18)' : 'rgba(255, 88, 118, 0.18)';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = enemyStroke;
        
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(performance.now() * 0.002 * (e.type==='fast'?2:1));

        ctx.fillStyle = enemyFill;
        ctx.strokeStyle = enemyStroke;
        ctx.beginPath();
        ctx.rect(-e.r, -e.r, e.r*2, e.r*2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-e.r * 0.7, 0);
        ctx.lineTo(0, -e.r * 0.7);
        ctx.lineTo(e.r * 0.7, 0);
        ctx.lineTo(0, e.r * 0.7);
        ctx.closePath();
        ctx.strokeStyle = e.type === 'fast' ? '#f6dcff' : '#ffd0d9';
        ctx.stroke();
        
        // HP Bar
        ctx.rotate(-performance.now() * 0.002 * (e.type==='fast'?2:1));
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#18202d';
        ctx.fillRect(-e.r, -e.r - 8, e.r*2, 3);
        ctx.fillStyle = enemyStroke;
        ctx.fillRect(-e.r, -e.r - 8, (e.hp/e.maxHp) * e.r*2, 3);
        ctx.restore();
    }

    // Player
    if (gameState === 'PLAYING') {
        const px = Math.max(0, player.x);
        const py = Math.max(0, player.y);
        const shellPulse = Math.sin(pulse * 2.4) * 0.8;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(pulse);

        ctx.shadowBlur = 20;
        ctx.shadowColor = '#45cfff';
        ctx.fillStyle = 'rgba(69, 207, 255, 0.18)';
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 6 + shellPulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0a1830';
        ctx.strokeStyle = '#65ecff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -player.r - 3);
        ctx.lineTo(player.r + 3, 0);
        ctx.lineTo(0, player.r + 3);
        ctx.lineTo(-player.r - 3, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.rotate(-pulse * 2);
        ctx.strokeStyle = '#b4fcff';
        ctx.beginPath();
        ctx.arc(0, 0, player.r * 0.72, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#9dfdff';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#bfffff';
        ctx.beginPath();
        ctx.arc(0, 0, player.r * 0.42, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        ctx.shadowBlur = 0;
    }

    // Texts
    ctx.font = '700 20px "OrbitronLocal"';
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(101, 236, 255, 0.25)';
    ctx.textAlign = 'center';
    for (let t of entities.texts) {
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.life;
        ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    ctx.restore();
    
    // Red flash on low HP or death
    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.fillRect(0, 0, cw, ch);
    } else if (player.hp < player.maxHp * 0.3) {
        ctx.fillStyle = `rgba(255, 0, 0, ${Math.sin(performance.now()*0.01)*0.1 + 0.1})`;
        ctx.fillRect(0, 0, cw, ch);
    }
}

function gameLoop(timestamp) {
    frameId = requestAnimationFrame(gameLoop);
    if (!initialized) return;
    
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1; // Cap dt
    
    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Loop Error:", e);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
});

</script>
