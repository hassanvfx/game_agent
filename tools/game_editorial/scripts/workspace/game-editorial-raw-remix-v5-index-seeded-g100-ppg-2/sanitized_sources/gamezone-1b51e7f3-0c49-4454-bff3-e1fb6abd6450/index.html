<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Purrfect Pal: Care Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- [agent-note][stage3] resolved-font: title-ui -> Bangers + Rajdhani from catalogs/fonts.json -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #1d1635;
        --bg-bottom: #39245e;
        --panel: rgba(37, 24, 63, 0.72);
        --panel-strong: rgba(54, 33, 88, 0.88);
        --panel-border: rgba(255, 228, 155, 0.34);
        --text-main: #fff7fb;
        --text-soft: #e6dff5;
        --accent-gold: #ffd76f;
        --accent-pink: #ff8fc4;
        --accent-blue: #86ddff;
        --accent-purple: #c7a3ff;
        --danger: #ff6f91;
        --mint: #95ffd7;
        --shadow: rgba(7, 5, 18, 0.34);
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 196, 235, 0.25), transparent 35%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text-main);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    body {
        user-select: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea,
    select {
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-size: 100%;
        font-weight: 400;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .hidden { display: none !important; }

    .game-shell {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        background:
            radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.08), transparent 28%),
            radial-gradient(circle at 18% 18%, rgba(255, 143, 196, 0.22), transparent 24%),
            radial-gradient(circle at 82% 22%, rgba(134, 221, 255, 0.18), transparent 20%);
    }

    .game-shell::before,
    .game-shell::after {
        content: "";
        position: absolute;
        inset: auto;
        pointer-events: none;
        z-index: 0;
        border-radius: 999px;
        filter: blur(0.5px);
    }

    .game-shell::before {
        width: 180px;
        height: 180px;
        left: -48px;
        top: 10%;
        opacity: 0.26;
        background:
            radial-gradient(circle at 50% 45%, rgba(255, 245, 201, 0.82), rgba(255, 205, 141, 0.15) 60%, transparent 72%);
    }

    .game-shell::after {
        width: 220px;
        height: 220px;
        right: -78px;
        bottom: 12%;
        opacity: 0.22;
        background:
            radial-gradient(circle at 50% 50%, rgba(165, 229, 255, 0.75), rgba(165, 229, 255, 0.12) 58%, transparent 74%);
    }

    .spark-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
    }

    .spark {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.48);
        animation: sparkleFloat 8s linear infinite;
        opacity: 0.2;
    }

    .spark:nth-child(1) { left: 10%; top: 70%; animation-delay: 0s; }
    .spark:nth-child(2) { left: 22%; top: 18%; animation-delay: -1.6s; width: 6px; height: 6px; }
    .spark:nth-child(3) { left: 48%; top: 12%; animation-delay: -3s; }
    .spark:nth-child(4) { left: 76%; top: 26%; animation-delay: -4.2s; width: 5px; height: 5px; }
    .spark:nth-child(5) { left: 90%; top: 68%; animation-delay: -5.5s; }
    .spark:nth-child(6) { left: 64%; top: 80%; animation-delay: -2.4s; width: 7px; height: 7px; }

    .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .hud-wrap {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        pointer-events: auto;
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .hud-top {
        padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 8px;
    }

    .hud-bottom {
        padding: 10px 14px calc(16px + env(safe-area-inset-bottom, 0px));
    }

    .hud-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(72, 46, 115, 0.86), rgba(34, 22, 57, 0.86));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        box-shadow:
            0 12px 32px var(--shadow),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .stats-card {
        flex: 1;
        padding: 12px;
        border-radius: 22px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 12px;
        position: relative;
        overflow: hidden;
    }

    .stats-card::after {
        content: "✨ Cozy Care Shift";
        position: absolute;
        right: 10px;
        top: 8px;
        font-size: 9px;
        letter-spacing: 0.08em;
        color: rgba(255, 247, 251, 0.42);
        font-family: 'Bangers', cursive;
    }

    .stat-block {
        min-width: 0;
    }

    .stat-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
        font-size: 10px;
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: 'Bangers', cursive;
    }

    .label-food { color: #ffcf79; }
    .label-fun { color: #8fe7ff; }
    .label-energy { color: #d8b3ff; }
    .label-trust { color: #ffadd7; }

    .bar-container {
        background: rgba(8, 4, 19, 0.34);
        border-radius: 999px;
        overflow: hidden;
        height: 8px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .bar-fill {
        height: 100%;
        transition: width 0.3s ease-out, background-color 0.3s;
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.18);
    }

    .money-card {
        min-width: 82px;
        padding: 10px 10px 8px;
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
    }

    .money-emoji {
        font-size: 1.75rem;
        line-height: 1;
        filter: drop-shadow(0 0 8px rgba(255, 215, 111, 0.35));
    }

    .money-label {
        font-family: 'Bangers', cursive;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 247, 251, 0.72);
    }

    .money-value {
        font-family: 'Bangers', cursive;
        font-size: 17px;
        color: var(--accent-gold);
        text-shadow: 0 2px 10px rgba(255, 215, 111, 0.2);
    }

    .toast-slot {
        margin-top: 8px;
        text-align: center;
        height: 28px;
    }

    .toast-pill {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1;
        font-family: 'Bangers', cursive;
        letter-spacing: 0.06em;
        color: var(--text-main);
        opacity: 0;
        transition: opacity 0.3s ease;
        box-shadow: 0 8px 18px rgba(7, 5, 18, 0.18);
    }

    .action-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
    }

    .btn-action {
        position: relative;
        overflow: hidden;
        min-height: 86px;
        border: 0;
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--text-main);
        cursor: pointer;
        transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .btn-action::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 50%);
        pointer-events: none;
    }

    .btn-action:active { transform: scale(0.92); }

    .btn-action-icon {
        font-size: 1.9rem;
        line-height: 1;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.18));
    }

    .btn-action-text {
        font-size: 11px;
        line-height: 1;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-family: 'Bangers', cursive;
        color: rgba(255, 247, 251, 0.92);
    }

    .btn-work-theme { box-shadow: inset 0 0 0 1px rgba(255, 213, 112, 0.1), 0 10px 22px rgba(255, 177, 88, 0.12); }
    .btn-feed-theme { box-shadow: inset 0 0 0 1px rgba(255, 156, 207, 0.1), 0 10px 22px rgba(255, 143, 196, 0.12); }
    .btn-play-theme { box-shadow: inset 0 0 0 1px rgba(142, 224, 255, 0.1), 0 10px 22px rgba(134, 221, 255, 0.12); }
    .btn-sleep-theme { box-shadow: inset 0 0 0 1px rgba(199, 163, 255, 0.1), 0 10px 22px rgba(199, 163, 255, 0.12); }

    .btn-disabled { filter: grayscale(0.6) brightness(0.85); opacity: 0.78; pointer-events: none; }

    .cooldown-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(7, 5, 18, 0.32);
        height: 0%;
        transition: height 0.1s linear;
        pointer-events: none;
    }

    .sleep-indicator {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--mint);
        box-shadow: 0 0 12px rgba(149, 255, 215, 0.8);
        animation: pulseGlow 1s ease-in-out infinite;
    }

    .modal-backdrop {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(7, 5, 18, 0.56);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: auto;
    }

    .modal-card {
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        max-height: 90vh;
        padding: 18px;
        border-radius: 28px;
        position: relative;
        overflow: hidden;
        animation: popIn 0.28s ease-out;
    }

    .modal-content {
        overflow-y: auto;
    }

    .modal-actions {
        position: sticky;
        bottom: 0;
    }

    .modal-close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        color: var(--text-main);
        font-size: 1.15rem;
        line-height: 1;
        cursor: pointer;
    }

    .modal-title,
    .screen-title {
        margin: 0 0 14px;
        text-align: center;
        color: var(--text-main);
        font-size: 26px;
        line-height: 1;
        letter-spacing: 0.04em;
        font-family: 'Bangers', cursive;
        font-weight: 400;
    }

    .supply-summary {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        margin-bottom: 14px;
        padding: 12px;
        border-radius: 18px;
        background: rgba(255,255,255,0.08);
        gap: 10px;
    }

    .summary-pane {
        flex: 1;
        text-align: center;
    }

    .summary-pane + .summary-pane {
        border-left: 1px solid rgba(255,255,255,0.12);
    }

    .summary-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgba(255, 247, 251, 0.62);
        font-family: 'Bangers', cursive;
    }

    .summary-value {
        margin-top: 4px;
        font-size: 24px;
        color: var(--text-main);
        font-family: 'Bangers', cursive;
    }

    .shop-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .shop-btn,
    .restart-btn {
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 14px 16px;
        font-weight: 600;
        color: var(--text-main);
        cursor: pointer;
        transition: transform 0.14s ease, filter 0.14s ease;
    }

    .shop-btn:active,
    .restart-btn:active { transform: scale(0.96); }

    .shop-btn {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
    }

    .shop-pill {
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
        font-size: 12px;
        font-family: 'Bangers', cursive;
        letter-spacing: 0.05em;
    }

    .shop-buy { box-shadow: inset 0 0 0 1px rgba(255, 215, 111, 0.18); }
    .shop-feed { box-shadow: inset 0 0 0 1px rgba(255, 143, 196, 0.18); }

    .media-feedback {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        overflow: hidden;
    }

    .gif-badge {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transition: opacity 0.25s ease, transform 0.25s ease;
        filter: drop-shadow(0 14px 30px rgba(7, 5, 18, 0.35));
    }

    .gif-badge.active {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .gif-badge img {
        width: 88px;
        height: 88px;
        object-fit: cover;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.1);
    }

    .gif-badge span {
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(37, 24, 63, 0.84);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--text-main);
        font-family: 'Bangers', cursive;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .gif-badge--love {
        top: 108px;
        right: 14px;
    }

    .gif-badge--fail {
        left: 14px;
        bottom: 128px;
    }

    .game-over-screen {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(7, 5, 18, 0.68);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: auto;
    }

    .game-over-card {
        width: 100%;
        max-width: 320px;
        text-align: center;
        padding: 22px 20px;
        border-radius: 28px;
    }

    .screen-copy {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.4;
        color: var(--text-soft);
    }

    .game-over-emoji {
        margin-bottom: 18px;
        font-size: 4rem;
        line-height: 1;
        animation: sadBounce 1.8s ease-in-out infinite;
    }

    .restart-btn {
        background: linear-gradient(135deg, var(--accent-pink), #b87cff);
        box-shadow: 0 12px 26px rgba(184, 124, 255, 0.28);
        font-family: 'Bangers', cursive;
        font-size: 18px;
        letter-spacing: 0.05em;
    }

    .coin-anim {
        position: absolute;
        font-weight: 600;
        color: var(--accent-gold);
        animation: float 1s ease-out forwards;
        pointer-events: none;
        z-index: 100;
        text-shadow: 0 2px 4px rgba(0,0,0,0.18);
    }

    @keyframes float {
        0% { transform: translateY(0); opacity: 0; }
        25% { opacity: 1; }
        100% { transform: translateY(-22px); opacity: 0; }
    }

    @keyframes coinPop {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes popIn {
        0% { transform: scale(0.92) translateY(12px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.16); opacity: 1; }
    }

    @keyframes sparkleFloat {
        0% { transform: translateY(10px) scale(0.7); opacity: 0; }
        20% { opacity: 0.4; }
        50% { transform: translateY(-16px) scale(1); opacity: 0.75; }
        100% { transform: translateY(-36px) scale(0.74); opacity: 0; }
    }

    @keyframes sadBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    @media (max-width: 420px) {
        .hud-top { padding-left: 10px; padding-right: 10px; }
        .hud-bottom { padding-left: 10px; padding-right: 10px; }
        .stats-card { padding: 11px 10px; gap: 9px 10px; }
        .money-card { min-width: 74px; }
        .btn-action { min-height: 80px; border-radius: 20px; }
        .btn-action-icon { font-size: 1.7rem; }
        .gif-badge img { width: 72px; height: 72px; }
        .gif-badge--love { top: 104px; right: 10px; }
        .gif-badge--fail { left: 10px; bottom: 120px; }
        .modal-card,
        .game-over-card { border-radius: 24px; }
    }
</style>
<!-- Game Config -->
<script id="game-config" type="application/x-game-config">
{
    "decayRate": { "type": "number", "label": "Decay Speed", "value": 1.0, "min": 0.1, "max": 3.0 },
    "workCooldown": { "type": "number", "label": "Work Cooldown (s)", "value": 3.0, "min": 1.0, "max": 10.0 }
}
</script>
</head>
<body>
<audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop crossorigin="anonymous"></audio>
<audio id="sfx_ui" preload="auto" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"></audio>
<audio id="sfx_collect" preload="auto" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3"></audio>
<audio id="sfx_reward" preload="auto" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3"></audio>
<audio id="sfx_blocked" preload="auto" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3"></audio>
<audio id="sfx_gameover" preload="auto" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"></audio>
<img id="asset_placeholder" data-editable="image" data-label="Placeholder" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxIiBoZWlnaHQ9IjEiPjwvc3ZnPg==" hidden>

<div id="game-container" class="game-shell">
    <canvas id="gameCanvas"></canvas>

    <div class="spark-layer" aria-hidden="true">
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
    </div>

    <!-- [agent-note][stage3] resolved-gif: affection/fail feedback -> catalogs/gifs.json -->
    <div id="media-feedback" class="media-feedback" aria-hidden="true">
        <div id="gif-love" class="gif-badge gif-badge--love">
            <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="">
            <span>Cozy Bond</span>
        </div>
        <div id="gif-fail" class="gif-badge gif-badge--fail">
            <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="">
            <span>Mood Crash</span>
        </div>
    </div>

    <div id="ui-layer" class="ui-layer">
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div id="hud-top" class="hud-wrap hud-top">
            <div class="hud-row">
                <div class="glass stats-card">
                    <div class="stat-block">
                        <div class="stat-label label-food"><span>Food</span></div>
                        <div class="bar-container"><div id="bar-hunger" class="bar-fill" style="width: 100%; background: linear-gradient(90deg, #ffaf62, #ffd36f);"></div></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-label label-fun"><span>Fun</span></div>
                        <div class="bar-container"><div id="bar-fun" class="bar-fill" style="width: 100%; background: linear-gradient(90deg, #66d6ff, #9cebff);"></div></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-label label-energy"><span>Energy</span></div>
                        <div class="bar-container"><div id="bar-energy" class="bar-fill" style="width: 100%; background: linear-gradient(90deg, #b78cff, #dcc2ff);"></div></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-label label-trust"><span>Trust</span></div>
                        <div class="bar-container"><div id="bar-happiness" class="bar-fill" style="width: 100%; background: linear-gradient(90deg, #ff72bb, #ffb3d6);"></div></div>
                    </div>
                </div>

                <div class="glass money-card">
                    <span class="money-emoji">💰</span>
                    <span class="money-label">Tips</span>
                    <span id="val-money" class="money-value">$50</span>
                </div>
            </div>

            <div id="message-area" class="toast-slot">

        <div id="hud-bottom" class="hud-wrap hud-bottom">

                <button id="btn-feed" class="btn-action glass btn-feed-theme">
                    <span class="btn-action-icon">🐟</span>
                    <span class="btn-action-text">Shop</span>

                <button id="btn-play" class="btn-action glass btn-play-theme">
                    <span class="btn-action-icon">🧶</span>
                    <span class="btn-action-text">Play</span>
                </button>

                <button id="btn-sleep" class="btn-action glass btn-sleep-theme">
                    <span id="icon-sleep" class="btn-action-icon">💤</span>
                    <span id="text-sleep" class="btn-action-text">Sleep</span>
                    <div id="sleep-indicator" class="sleep-indicator hidden"></div>

        <div id="shop-modal" class="modal-backdrop hidden">
            <div class="glass modal-card">
                <button id="shop-close" class="modal-close" aria-label="Close shop">×</button>
                <div class="modal-content">
                    <h2 class="modal-title">Supply Run</h2>
                    <div class="supply-summary">
                        <div class="summary-pane">
                            <div class="summary-label">Food Stock</div>
                            <div class="summary-value">🐟 <span id="shop-food-count">0</span></div>
                        </div>
                        <div class="summary-pane">
                            <div class="summary-label">Budget</div>
                            <div class="summary-value">💰 <span id="shop-money-count">0</span></div>
                        </div>
                    </div>
                    <div class="shop-actions modal-actions">
                        <button id="btn-shop-buy" class="shop-btn shop-buy">
                            <span>Buy Food</span><span class="shop-pill">-$15</span>
                        </button>
                        <button id="btn-shop-feed" class="shop-btn shop-feed">
                            <span>Serve Meal</span><span class="shop-pill">-1 🐟</span>
                        </button>

        <div id="game-over-screen" class="game-over-screen hidden">
            <div class="glass game-over-card">
                <h2 class="screen-title">Shift Failed</h2>
                <p class="screen-copy">Your pal lost trust and wandered off.</p>
                <div class="game-over-emoji">😿</div>
                <button id="restart-btn" class="restart-btn">Restart Shift</button>
            </div>
        </div>
    </div>
</div>

<script>
const CONFIG = {
    baseDecay: { hunger: 2.5, fun: 3.5, energy: 1.8, happiness: 4.5 },
    colors: [
        { fur: '#fff7f0', ear: '#ffb7c8', stripe: '#ffd86e', blush: '#ff9eb8' },
        { fur: '#3f3555', ear: '#a79bff', stripe: '#86ddff', blush: '#cfb8ff' },
        { fur: '#ffcb9b', ear: '#ff8fac', stripe: '#fff0a6', blush: '#ff92ba' },
        { fur: '#d7d3ff', ear: '#ffb7d9', stripe: '#9ceaff', blush: '#f6dbff' }
    ],
    prices: { food: 15 },
    rewards: { play: 10, workMin: 5, workMax: 15 }
};

const FONT_BODY = "'Rajdhani', system-ui, sans-serif";
const FONT_DISPLAY = "'Bangers', cursive";

let gameConfig = { decayRate: 1.0, workCooldown: 3.0 };
let gameConfigDefs = {};

const STATE = {
    phase: 'BOOT',
    cw: 0, ch: 0, dpr: 1,
    cat: null,
    moneyDrops: [],
    particles: [],
    lastTime: 0,
    audioUnlocked: false,
    messageTimer: 0,
    feedbackTimer: 0,
    money: 50,
    food: 3,
    lastWorkTime: 0
};

const AudioSys = {
    ctx: null,
    bgm: null,
    sfx: {},
    lastPlayed: {},
    init() {
        this.bgm = document.getElementById('bgm_main');
        this.sfx = {
            ui: document.getElementById('sfx_ui'),
            collect: document.getElementById('sfx_collect'),
            reward: document.getElementById('sfx_reward'),
            blocked: document.getElementById('sfx_blocked'),
            gameover: document.getElementById('sfx_gameover')
        };
        if (this.bgm) this.bgm.volume = 0.2;
        Object.values(this.sfx).forEach((audio) => {
            if (audio) audio.volume = 0.5;
        });
        if (this.sfx.blocked) this.sfx.blocked.volume = 0.4;
        if (this.sfx.gameover) this.sfx.gameover.volume = 0.42;

        try {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        } catch(e) { console.warn('Web Audio API not supported'); }
    },
    unlock() {
        if (STATE.audioUnlocked) return;
        STATE.audioUnlocked = true;
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        if (this.bgm) {
            this.bgm.currentTime = 0;
            this.bgm.play().catch(() => {});
        }
        this.playSfx('ui', 120);
    },
    playSfx(name, debounceMs = 90) {
        const audio = this.sfx[name];
        if (!audio || !STATE.audioUnlocked) return;
        const now = performance.now();
        if ((this.lastPlayed[name] || 0) + debounceMs > now) return;
        this.lastPlayed[name] = now;
        try {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (e) {}
    },
    syncLoop() {
        if (!this.bgm) return;
        if (STATE.phase === 'PLAYING' && STATE.audioUnlocked) {
            this.bgm.play().catch(() => {});
        } else {
            this.bgm.pause();
        }
    }
};

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 40);
    }
}

class MoneyDrop {
    constructor(x, y, val) {
        this.x = x;
        this.y = y;
        this.val = val;
        this.vx = (Math.random() - 0.5) * 400;
        this.vy = -500 - Math.random() * 300;
        this.radius = 25;
        this.life = 10.0;
        this.groundY = STATE.ch * 0.75 + (Math.random() * 50);
        this.bounces = 0;
    }
    update(dt) {
        this.life -= dt;
        this.vy += 1500 * dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        if (this.y > this.groundY) {
            this.y = this.groundY;
            this.vy *= -0.6;
            this.vx *= 0.8;
            this.bounces++;
            if (Math.abs(this.vy) < 50) this.vy = 0;
        }

        if (this.x < 20 || this.x > STATE.cw - 20) {
            this.vx *= -1;
            this.x = Math.max(20, Math.min(STATE.cw - 20, this.x));
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = 'rgba(7, 5, 18, 0.24)';
        ctx.beginPath();
        ctx.ellipse(0, 6, this.radius, this.radius * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();

        const coinGrad = ctx.createRadialGradient(-5, -8, 4, 0, 0, this.radius + 4);
        coinGrad.addColorStop(0, '#fff7be');
        coinGrad.addColorStop(0.6, '#ffd76f');
        coinGrad.addColorStop(1, '#ff9f43');
        ctx.fillStyle = coinGrad;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#fff1a8';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#8f4b00';
        ctx.font = `400 24px ${FONT_DISPLAY}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', 0, 3);
        ctx.restore();
    }
}

class Cat {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.targetX = x; this.targetY = y;
        this.stats = { hunger: 80, fun: 80, energy: 80, happiness: 100 };
        this.breath = Math.random() * 10;
        this.scaleY = 1; this.scaleX = 1;
        this.blinkTimer = Math.random() * 3;
        this.isBlinking = false;
        this.state = 'IDLE';
        this.stateTimer = 0;
        this.faceMood = 0;
    }
    update(dt) {
        this.breath += dt * 3;
        const idleSquash = 1 + Math.sin(this.breath) * 0.02;
        this.faceMood = (this.stats.happiness + this.stats.fun) / 200;

        if (this.state !== 'SLEEPING' && this.stateTimer > 0) {
            this.stateTimer -= dt;
            if (this.stateTimer <= 0) this.state = 'IDLE';
        }

        if (this.state === 'IDLE' && Math.random() < 0.01) {
            this.targetX = Math.max(50, Math.min(STATE.cw - 50, STATE.cw / 2 + (Math.random() - 0.5) * 200));
        }

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 2) {
            const speed = (this.state === 'SLEEPING' ? 0 : 80) * (this.stats.energy < 20 ? 0.5 : 1.0);
            this.x += (dx / dist) * speed * dt;
            this.y += (dy / dist) * speed * dt;
            this.scaleY = idleSquash + Math.sin(this.breath * 10) * 0.05;
        } else {
            this.scaleY = idleSquash;
        }

        this.scaleX += (1 - this.scaleX) * 10 * dt;
        this.scaleY += (idleSquash - this.scaleY) * 10 * dt;

        this.blinkTimer -= dt;
        if (this.blinkTimer <= 0) {
            this.isBlinking = true;
            if (this.blinkTimer <= -0.15) {
                this.isBlinking = false;
                this.blinkTimer = 2 + Math.random() * 4;
            }
        }

        if (STATE.phase === 'PLAYING') {
            const mod = gameConfig.decayRate;
            if (this.state === 'SLEEPING') {
                this.stats.energy += dt * 15 * mod;
                this.stats.hunger -= dt * CONFIG.baseDecay.hunger * 0.2 * mod;
                this.stats.fun -= dt * CONFIG.baseDecay.fun * 0.1 * mod;
                if (this.stats.hunger > 20) this.stats.happiness += dt * 2;
            } else {
                this.stats.energy -= dt * CONFIG.baseDecay.energy * mod;
                this.stats.hunger -= dt * CONFIG.baseDecay.hunger * mod;
                this.stats.fun -= dt * CONFIG.baseDecay.fun * mod;

                let drop = CONFIG.baseDecay.happiness * mod;
                if (this.stats.hunger < 30) drop *= 2;
                if (this.stats.fun < 30) drop *= 1.5;
                if (this.stats.energy < 20) drop *= 1.5;
                this.stats.happiness -= dt * drop;
            }

            ['hunger', 'fun', 'energy', 'happiness'].forEach(k =>
                this.stats[k] = Math.max(0, Math.min(100, this.stats[k]))
            );

            if (this.stats.happiness <= 0) setState('GAMEOVER');
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        const sX = this.state === 'SLEEPING' ? 1.2 : this.scaleX;
        const sY = this.state === 'SLEEPING' ? 0.7 : this.scaleY;
        ctx.scale(sX, sY);

        ctx.fillStyle = 'rgba(7, 5, 18, 0.16)';
        ctx.beginPath();
        ctx.ellipse(0, 42, 56, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        const bodyGrad = ctx.createLinearGradient(0, -42, 0, 56);
        bodyGrad.addColorStop(0, this.color.fur);
        bodyGrad.addColorStop(1, this.color.stripe);
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(0, 15, 54, 42, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.color.ear;
        ctx.beginPath();
        ctx.moveTo(-34, -18); ctx.lineTo(-46, -60); ctx.lineTo(-15, -25);
        ctx.moveTo(34, -18); ctx.lineTo(46, -60); ctx.lineTo(15, -25);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.32)';
        ctx.beginPath();
        ctx.ellipse(-15, -8, 14, 7, -0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.color.blush;
        ctx.beginPath();
        ctx.ellipse(-25, 8, 8, 5, 0, 0, Math.PI * 2);
        ctx.ellipse(25, 8, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 18, 26, 0.2, Math.PI - 0.2, false);
        ctx.stroke();

        ctx.fillStyle = '#2c213f';
        if (this.isBlinking || this.state === 'SLEEPING') {
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-20, -5); ctx.lineTo(-8, -5);
            ctx.moveTo(20, -5); ctx.lineTo(8, -5);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(-15, -5, 6, 0, Math.PI * 2);
            ctx.arc(15, -5, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-13, -7, 2.2, 0, Math.PI * 2);
            ctx.arc(17, -7, 2.2, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = '#ff8fac';
        ctx.beginPath(); ctx.ellipse(0, 5, 5, 4, 0, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#5a4f73';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(25, 5); ctx.lineTo(47, 1); ctx.moveTo(25, 9); ctx.lineTo(48, 12);
        ctx.moveTo(-25, 5); ctx.lineTo(-47, 1); ctx.moveTo(-25, 9); ctx.lineTo(-48, 12);
        ctx.stroke();

        ctx.strokeStyle = '#2c213f';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        if (this.state === 'SLEEPING') {
            ctx.arc(0, 13, 8, 0.15, Math.PI - 0.15, false);
        } else if (this.faceMood > 0.45) {
            ctx.arc(0, 13, 8, 0.2, Math.PI - 0.2, false);
        } else {
            ctx.arc(0, 18, 8, Math.PI + 0.2, (Math.PI * 2) - 0.2, false);
        }
        ctx.stroke();

        ctx.strokeStyle = this.color.stripe;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-18, -28); ctx.lineTo(-10, -12);
        ctx.moveTo(0, -31); ctx.lineTo(0, -13);
        ctx.moveTo(18, -28); ctx.lineTo(10, -12);
        ctx.stroke();

        if (this.state === 'PLAYING') {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -10, 52, Math.sin(Date.now() / 140) * 0.6, Math.sin(Date.now() / 140) * 0.6 + 1.3);
            ctx.stroke();
        }

        if (this.state === 'SLEEPING') {
            ctx.fillStyle = '#f3eeff';
            ctx.font = `400 24px ${FONT_DISPLAY}`;
            ctx.fillText('Zzz', 46, -44 + Math.sin(Date.now() / 400) * 10);
        }

        if (this.stats.hunger < 30) {
            ctx.font = `400 24px ${FONT_BODY}`;
            ctx.fillText('🍖', 44, -22);
        }
        if (this.stats.fun < 30) {
            ctx.font = `400 24px ${FONT_BODY}`;
            ctx.fillText('🥱', -62, -20);
        }

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, char) {
        this.x = x; this.y = y; this.char = char;
        this.life = 1.0;
        this.vy = -100 - Math.random() * 100;
        this.vx = (Math.random() - 0.5) * 60;
        this.size = 20 + Math.random() * 10;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 1.5;
        this.size *= 0.98;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = `${this.size}px ${FONT_BODY}`;
        ctx.fillStyle = '#fff7fb';
        ctx.textAlign = 'center';
        ctx.fillText(this.char, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

function initGame() {
    STATE.moneyDrops = [];
    STATE.particles = [];
    STATE.money = 50;
    STATE.food = 3;
    STATE.lastWorkTime = 0;

    const color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
    STATE.cat = new Cat(STATE.cw / 2, STATE.ch / 2 + 50, color);
    STATE.lastTime = performance.now();
}

function resize() {
    STATE.cw = window.innerWidth;
    STATE.ch = window.innerHeight;
    STATE.dpr = window.devicePixelRatio || 1;
    const cvs = document.getElementById('gameCanvas');
    cvs.width = STATE.cw * STATE.dpr;
    cvs.height = STATE.ch * STATE.dpr;
    cvs.style.width = STATE.cw + 'px';
    cvs.style.height = STATE.ch + 'px';
    const ctx = cvs.getContext('2d');
    ctx.setTransform(STATE.dpr, 0, 0, STATE.dpr, 0, 0);
}

function setState(next) {
    STATE.phase = next;
    const uiOver = document.getElementById('game-over-screen');
    const uiHudTop = document.getElementById('hud-top');
    const uiHudBot = document.getElementById('hud-bottom');

    if (next === 'PLAYING') {
        uiOver.classList.add('hidden');
        uiHudTop.classList.remove('hidden');
        uiHudBot.classList.remove('hidden');
        updateHUD();
    } else if (next === 'GAMEOVER') {
        uiOver.classList.remove('hidden');
        uiHudTop.classList.add('hidden');
        uiHudBot.classList.add('hidden');
        AudioSys.playSfx('gameover', 400);
        showGifFeedback('fail');
        vibrate('heavy');
    }
    AudioSys.syncLoop();
}

function showMessage(text) {
    const el = document.querySelector('#message-area span');
    el.innerText = text;
    el.classList.remove('opacity-0');
    clearTimeout(STATE.messageTimer);
    STATE.messageTimer = setTimeout(() => el.classList.add('opacity-0'), 2000);
}

function spawnParticles(x, y, char, count) {
    for (let i = 0; i < count; i++) STATE.particles.push(new Particle(x, y, char));
}

function spawnTextAnim(x, y, text, color = '#ffd76f') {
    const el = document.createElement('div');
    el.className = 'coin-anim';
    el.innerText = text;
    el.style.color = color;
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    document.getElementById('game-container').appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function spawnMoney() {
    const now = performance.now();
    if (now - STATE.lastWorkTime < gameConfig.workCooldown * 1000) {
        AudioSys.playSfx('blocked', 120);
        showMessage('Shift is still cooling down.');
        return;
    }

    STATE.lastWorkTime = now;
    AudioSys.playSfx('ui', 120);
    vibrate('medium');

    const count = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
        STATE.moneyDrops.push(new MoneyDrop(STATE.cw / 2, STATE.ch / 2, 5));
    }

    updateHUD();
}

function collectMoney(drop, idx) {
    STATE.moneyDrops.splice(idx, 1);
    STATE.money += drop.val;
    AudioSys.playSfx('collect', 70);
    vibrate('light');
    spawnTextAnim(drop.x, drop.y, `+$${drop.val}`);
    spawnParticles(drop.x, drop.y, '✨', 3);
    updateHUD();
}

function showGifFeedback(type) {
    const love = document.getElementById('gif-love');
    const fail = document.getElementById('gif-fail');
    love.classList.remove('active');
    fail.classList.remove('active');
    clearTimeout(STATE.feedbackTimer);

    const target = type === 'love' ? love : fail;
    target.classList.add('active');
    STATE.feedbackTimer = setTimeout(() => target.classList.remove('active'), 1800);
}

function toggleShop() {
    const modal = document.getElementById('shop-modal');
    const opening = modal.classList.contains('hidden');
    modal.classList.toggle('hidden');
    AudioSys.playSfx('ui', 80);
    if (!opening) {
        document.getElementById('gif-fail').classList.remove('active');
    }
    updateShopUI();
}

function updateShopUI() {
    document.getElementById('shop-food-count').innerText = STATE.food;
    document.getElementById('shop-money-count').innerText = STATE.money;
}

function handleAction(type) {
    if (STATE.phase !== 'PLAYING') return;
    const cat = STATE.cat;

        if (type === 'feed') {
            AudioSys.playSfx('ui', 80);
            toggleShop();
            return;
        }

    if (type === 'work') {
        spawnMoney();
        return;
    }

        if (type === 'sleep') {
            if (cat.state === 'SLEEPING') {
                cat.state = 'IDLE';
                spawnParticles(cat.x, cat.y, '☀️', 5);
                AudioSys.playSfx('reward', 120);
            } else {
                cat.state = 'SLEEPING';
                spawnParticles(cat.x, cat.y, '💤', 5);
                AudioSys.playSfx('ui', 120);
            }
            updateHUD();
            return;
        }

    if (cat.state === 'SLEEPING') {
        AudioSys.playSfx('blocked', 120);
        showMessage('Quiet... on nap duty.');
        showGifFeedback('fail');
        return;
    }

        if (type === 'play') {
            if (cat.stats.energy < 20) {
                AudioSys.playSfx('blocked', 120);
                showMessage('Too tired for play.');
                showGifFeedback('fail');
                return;
            }
            cat.stats.fun = Math.min(100, cat.stats.fun + 30);
            cat.stats.energy -= 15;
            cat.state = 'PLAYING';
            cat.stateTimer = 1.0;
            spawnParticles(cat.x, cat.y, '🧶', 8);
            AudioSys.playSfx('reward', 120);
            showGifFeedback('love');
            vibrate('medium');
        }
    updateHUD();
}

function handleShopAction(action) {
    if (action === 'buy') {
        if (STATE.money >= CONFIG.prices.food) {
            STATE.money -= CONFIG.prices.food;
            STATE.food++;
            AudioSys.playSfx('collect', 80);
            updateShopUI();
            updateHUD();
        } else {
            AudioSys.playSfx('blocked', 120);
            showMessage('Need more tips for snacks.');
            showGifFeedback('fail');
            vibrate('heavy');
        }
    } else if (action === 'feed') {
        if (STATE.food > 0) {
            if (STATE.cat.stats.hunger >= 100) {
                AudioSys.playSfx('blocked', 120);
                showMessage('Already full of snacks.');
                return;
            }
            STATE.food--;
            STATE.cat.stats.hunger = Math.min(100, STATE.cat.stats.hunger + 30);
            STATE.cat.state = 'EATING';
            STATE.cat.stateTimer = 1.0;
            spawnParticles(STATE.cat.x, STATE.cat.y, '🐟', 8);
            AudioSys.playSfx('reward', 120);
            showGifFeedback('love');
            updateShopUI();
            updateHUD();
        } else {
            AudioSys.playSfx('blocked', 120);
            showMessage('No food left in stock.');
            showGifFeedback('fail');
            vibrate('heavy');
        }
    }
}

function handleGlobalInput(e) {
    AudioSys.unlock();
    if (STATE.phase === 'GAMEOVER') return;

    const rect = document.getElementById('gameCanvas').getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (!document.getElementById('shop-modal').classList.contains('hidden')) return;

    for (let i = STATE.moneyDrops.length - 1; i >= 0; i--) {
        const drop = STATE.moneyDrops[i];
        const dist = Math.hypot(x - drop.x, y - drop.y);
        if (dist < drop.radius * 2) {
            collectMoney(drop, i);
            return;
        }
    }

    if (STATE.phase === 'PLAYING' && STATE.cat) {
        const dist = Math.hypot(x - STATE.cat.x, y - STATE.cat.y);
        if (dist < 70 && STATE.cat.state !== 'SLEEPING') {
            STATE.cat.stats.happiness = Math.min(100, STATE.cat.stats.happiness + 5);
            STATE.cat.scaleY = 0.8;
            STATE.cat.scaleX = 1.2;
            spawnParticles(x, y, '❤️', 2);
            AudioSys.playSfx('reward', 180);
            showGifFeedback('love');
            vibrate('light');
        }
    }
}

function updateHUD() {
    if (!STATE.cat) return;
    const s = STATE.cat.stats;
    document.getElementById('val-money').innerText = `$${STATE.money}`;

    const sleepBtn = document.getElementById('btn-sleep');
    const sleepInd = document.getElementById('sleep-indicator');
    if (STATE.cat.state === 'SLEEPING') {
        sleepBtn.style.background = 'linear-gradient(180deg, rgba(126, 110, 219, 0.92), rgba(61, 46, 104, 0.92))';
        document.getElementById('text-sleep').innerText = 'Wake';
        sleepInd.classList.remove('hidden');
    } else {
        sleepBtn.style.background = '';
        document.getElementById('text-sleep').innerText = 'Sleep';
        sleepInd.classList.add('hidden');
    }

    const setBar = (id, val, okGradient) => {
        const el = document.getElementById(id);
        el.style.width = `${Math.max(0, val)}%`;
        el.style.background = val < 30
            ? 'linear-gradient(90deg, #ff668d, #ff9b8d)'
            : okGradient;
    };
    setBar('bar-hunger', s.hunger, 'linear-gradient(90deg, #ffaf62, #ffd36f)');
    setBar('bar-fun', s.fun, 'linear-gradient(90deg, #66d6ff, #9cebff)');
    setBar('bar-energy', s.energy, 'linear-gradient(90deg, #b78cff, #dcc2ff)');
    setBar('bar-happiness', s.happiness, 'linear-gradient(90deg, #ff72bb, #ffb3d6)');
}

function loop(now) {
    const dt = Math.min((now - STATE.lastTime) / 1000, 0.1);
    STATE.lastTime = now;
    const ctx = document.getElementById('gameCanvas').getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, STATE.ch);
    if (STATE.cat?.state === 'SLEEPING') {
        grad.addColorStop(0, '#1d1734');
        grad.addColorStop(0.55, '#221b44');
        grad.addColorStop(1, '#0f1b3a');
    } else {
        grad.addColorStop(0, '#20173b');
        grad.addColorStop(0.55, '#493275');
        grad.addColorStop(1, '#6f4a8f');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, STATE.cw, STATE.ch);

    for (let i = 0; i < 16; i++) {
        const x = ((i * 137) + (now * 0.012)) % (STATE.cw + 80) - 40;
        const y = 60 + (i % 4) * 48 + Math.sin(now / 800 + i) * 8;
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.beginPath();
        ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
    }

    const floorGrad = ctx.createRadialGradient(STATE.cw / 2, STATE.ch / 2 + 92, 10, STATE.cw / 2, STATE.ch / 2 + 102, 220);
    if (STATE.cat?.state === 'SLEEPING') {
        floorGrad.addColorStop(0, 'rgba(190, 210, 255, 0.22)');
        floorGrad.addColorStop(1, 'rgba(255,255,255,0.02)');
    } else {
        floorGrad.addColorStop(0, 'rgba(255, 227, 162, 0.3)');
        floorGrad.addColorStop(1, 'rgba(255,255,255,0.02)');
    }
    ctx.fillStyle = floorGrad;
    ctx.beginPath();
    ctx.ellipse(STATE.cw / 2, STATE.ch / 2 + 100, 190, 66, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(STATE.cw / 2, STATE.ch / 2 + 100, 205, 76, 0, 0, Math.PI * 2);
    ctx.stroke();

    for (let i = STATE.moneyDrops.length - 1; i >= 0; i--) {
        const d = STATE.moneyDrops[i];
        d.update(dt);
        d.draw(ctx);
        if (d.life <= 0) STATE.moneyDrops.splice(i, 1);
    }

    if (STATE.cat) {
        STATE.cat.update(dt);
        STATE.cat.draw(ctx);
    }

    for (let i = STATE.particles.length - 1; i >= 0; i--) {
        const p = STATE.particles[i];
        p.update(dt);
        p.draw(ctx);
        if (p.life <= 0) STATE.particles.splice(i, 1);
    }

    if (STATE.phase === 'PLAYING') {
        const elapsed = now - STATE.lastWorkTime;
        const cooldownMs = gameConfig.workCooldown * 1000;
        const btnWork = document.getElementById('btn-work');
        const overlay = document.getElementById('cooldown-work');

        if (elapsed < cooldownMs) {
            const pct = 100 - (elapsed / cooldownMs * 100);
            overlay.style.height = `${pct}%`;
            btnWork.classList.add('btn-disabled');
        } else {
            overlay.style.height = '0%';
            btnWork.classList.remove('btn-disabled');
        }

        updateHUD();
    }

    requestAnimationFrame(loop);
}

document.addEventListener('DOMContentLoaded', () => {
    try {
        const cfg = JSON.parse(document.getElementById('game-config').textContent);
        if (cfg.workCooldown) gameConfig.workCooldown = cfg.workCooldown.value;
    } catch(e) {}

    AudioSys.init();
    resize();
    initGame();
    setState('PLAYING');

    window.addEventListener('resize', resize);
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });

    document.getElementById('btn-work').addEventListener('click', (e) => { e.stopPropagation(); handleAction('work'); });
    document.getElementById('btn-feed').addEventListener('click', (e) => { e.stopPropagation(); handleAction('feed'); });
    document.getElementById('btn-play').addEventListener('click', (e) => { e.stopPropagation(); handleAction('play'); });
    document.getElementById('btn-sleep').addEventListener('click', (e) => { e.stopPropagation(); handleAction('sleep'); });

    document.getElementById('shop-close').addEventListener('click', (e) => { e.stopPropagation(); toggleShop(); });
    document.getElementById('btn-shop-buy').addEventListener('click', (e) => { e.stopPropagation(); AudioSys.playSfx('ui', 70); handleShopAction('buy'); });
    document.getElementById('btn-shop-feed').addEventListener('click', (e) => { e.stopPropagation(); AudioSys.playSfx('ui', 70); handleShopAction('feed'); });

    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        initGame();
        setState('PLAYING');
    });

    requestAnimationFrame(loop);
});
</script>
</body>
