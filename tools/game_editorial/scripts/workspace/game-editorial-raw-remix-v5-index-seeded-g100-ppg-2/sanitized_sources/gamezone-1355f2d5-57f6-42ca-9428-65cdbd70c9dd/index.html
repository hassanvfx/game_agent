<!DOCTYPE html>
<html lang="en">
<head>

<title>DM Rush: Influencer Edition</title>
<!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | choice: Audiowide display + Rajdhani UI -->

<style>
    :root {
        --bg-top: #110a24;
        --bg-bottom: #25104c;
        --hud-panel: rgba(16, 11, 35, 0.72);
        --hud-border: rgba(122, 226, 255, 0.34);
        --text-main: #f4f7ff;
        --text-soft: #cdd5ff;
        --fan-main: #ff4f95;
        --fan-dark: #cf2b70;
        --fan-glow: rgba(255, 79, 149, 0.35);
        --hater-main: #34d399;
        --hater-dark: #0d9f6e;
        --hater-glow: rgba(52, 211, 153, 0.32);
        --accent: #7ae2ff;
        --accent-strong: #36c4ff;
        --danger: #ff7b6b;
        --shadow-strong: rgba(5, 8, 20, 0.34);
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); font-family: 'Rajdhani', system-ui, sans-serif; }
    body { color: var(--text-main); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass { background: var(--hud-panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--hud-border); box-shadow: 0 12px 28px var(--shadow-strong), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
    .hidden { display: none !important; }
    #ui-layer { pointer-events: none; }
    #game-over-panel { pointer-events: auto; }
    .btn-push { transition: transform 0.1s; }
    .btn-push:active { transform: scale(0.95); }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .z-50 { z-index: 50; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-start { align-items: flex-start; }
    .items-center { align-items: center; }
    .w-full { width: 100%; }
    .w-1\/2 { width: 50%; }
    .w-6 { width: 1.5rem; }
    .w-80 { width: 20rem; max-width: calc(100vw - 2rem); }
    .h-full { height: 100%; }
    .h-6 { height: 1.5rem; }
    .h-32 { height: 8rem; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .bg-gray-100 { background: rgba(15, 17, 44, 0.72); }
    .bg-green-500 { background: linear-gradient(180deg, #53f7bf, #1fb984); }
    .bg-blue-600 { background: linear-gradient(180deg, #55dfff, #1c8fff); }
    .bg-blue-700 { background: linear-gradient(180deg, #42c8ff, #1879da); }
    .bg-black\/40 { background: rgba(4, 6, 18, 0.58); }
    .text-white { color: #fff; }
    .text-gray-500 { color: var(--text-soft); }
    .text-gray-600 { color: #b4c4ff; }
    .text-gray-800 { color: var(--text-main); }
    .text-blue-600 { color: var(--accent); }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }

    .rounded-2xl { border-radius: 1rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .shadow-sm { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
    .shadow-lg { box-shadow: 0 10px 15px rgba(0, 0, 0, 0.15); }
    .shadow-2xl { box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25); }
    .p-4 { padding: 1rem; }
    .p-8 { padding: 2rem; }

    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .pt-8 { padding-top: 2rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .gap-2 { gap: 0.5rem; }
    .border-r { border-right: 1px solid #d1d5db; }
    .border-gray-300 { border-color: #d1d5db; }
    .opacity-50 { opacity: 0.5; }
    .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .transform { transform: translateZ(0); }
    .transition-all { transition: all 0.2s ease; }
    .scale-100 { transform: scale(1); }
    .animate-bounce { animation: bounce 1s infinite; }
    button { border: 0; cursor: pointer; font-family: 'Rajdhani', system-ui, sans-serif; font-size: inherit; font-weight: inherit; line-height: inherit; }
    button:hover { filter: brightness(1.04); }
    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    #game-container::before {
        background:

            radial-gradient(circle at 78% 14%, rgba(255, 79, 149, 0.14), transparent 28%),
            radial-gradient(circle at 50% 84%, rgba(52, 211, 153, 0.14), transparent 24%);
    }
    #game-container::after {
        opacity: 0.18;
        background-image:
            linear-gradient(rgba(122, 226, 255, 0.16) 1px, transparent 1px),
            linear-gradient(90deg, rgba(122, 226, 255, 0.12) 1px, transparent 1px);
        background-size: 42px 42px;
        mix-blend-mode: screen;
    }
    #hud .glass {
        min-width: 112px;

    #controls-hint .text-4xl,
    #restart-btn,
    #game-over-panel h2,
    .brand-font {
        font-family: 'Audiowide', system-ui, sans-serif;
    }
    #score-display,
    #life-display,
    #final-score,
    .ui-font {
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    #reaction-layer {
        position: absolute;
        right: 0.75rem;
        bottom: 5.5rem;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5rem;

        z-index: 45;
    }
    .reaction-card {
        width: min(34vw, 108px);
        min-width: 82px;
        padding: 0.35rem;
        border-radius: 0.9rem;
        background: rgba(7, 10, 24, 0.56);
        border: 1px solid rgba(122, 226, 255, 0.24);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        transition: opacity 160ms ease, transform 160ms ease;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }
    .reaction-card.active {
        opacity: 0.96;
        transform: translateY(0) scale(1);
    }
    .reaction-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 0.7rem;

        margin-top: 0.25rem;

        text-transform: uppercase;

        text-align: center;
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-weight: 700;
    }
    @media (max-width: 640px) {
        #reaction-layer {
            right: 0.5rem;
            bottom: 4.75rem;
        }
        .reaction-card {
            width: min(28vw, 92px);
            min-width: 72px;
            padding: 0.28rem;
        }
        .reaction-label {
            font-size: 0.6rem;
        }
    }
    #restart-btn {
        letter-spacing: 0.04em;
        box-shadow: 0 12px 26px rgba(28, 143, 255, 0.35);
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
</style>

<body>

{

}
</script>

<!-- Assets -->

<audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_score" data-editable="audio" data-label="Score SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Fail SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
<audio id="sfx_block" data-editable="audio" data-label="Block SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none bg-gray-100">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->

        <!-- HUD -->

            </div>
            <div class="glass px-4 py-2 rounded-2xl shadow-sm flex items-center gap-2">

        <!-- Controls Hint (Visible only in PLAYING) -->

        <div id="reaction-layer" aria-hidden="true">
            <div id="reaction-love" class="reaction-card">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Love reaction">
                <div class="reaction-label">fan boost</div>
            </div>
            <div id="reaction-fail" class="reaction-card">
                <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction">
                <div class="reaction-label">chat crash</div>

        </div>

        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm z-50">
            <div id="game-over-panel" class="glass p-8 rounded-3xl shadow-2xl text-center w-80 transform transition-all scale-100">
                <h2 class="text-4xl font-bold text-gray-800 mb-2 brand-font">Feed Shut Down</h2>
                <p class="text-gray-600 mb-6">Too many bad messages slipped through.</p>
                <div class="bg-gray-100 rounded-xl p-4 mb-6">
                    <div class="text-sm text-gray-500">Final Fan Count</div>
                    <div id="final-score" class="text-3xl font-bold text-blue-600 ui-font">0</div>
                </div>
                <button id="restart-btn" class="btn-push w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg">

<script>
// §2 System Invariants
const CONFIG = {
    heroSpeed: 5,
    themeColor: '#007AFF',
    gravity: 0.2,
    bubbleSpawnRate: 1200
};

let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let score = 0;
let life = 100;
let lastTime = 0;
let spawnTimer = 0;
let difficultyMultiplier = 1;

// Canvas & Context
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;

// Entities
let bubbles = [];
let particles = [];
let shake = 0;

// Config Proxy
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').text);
window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k,v]) => [k, v.value]));

// Audio System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    score: document.getElementById('sfx_score'),
    fail: document.getElementById('sfx_fail'),
    block: document.getElementById('sfx_block'),
    restart: document.getElementById('sfx_restart'),
    warning: document.getElementById('sfx_warning')
};
const reactionEls = {
    love: document.getElementById('reaction-love'),
    fail: document.getElementById('reaction-fail')
};
let audioUnlocked = false;
let lastSfxAt = {};
let reactionTimer = null;
let lowLifeWarningPlayed = false;

// §3 Implementation

// 3.1 Initialization
function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // Normalize to CSS pixels
}

function initGame() {
    score = 0;
    life = 100;
    difficultyMultiplier = 1;
    spawnTimer = 0;
    bubbles = [];
    particles = [];
    shake = 0;
    lowLifeWarningPlayed = false;
    
    // Initial spawn
    spawnBubble(ch * 0.2);
    
    updateUI();
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const controls = document.getElementById('controls-hint');
    const gameOver = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        controls.classList.remove('hidden');
        gameOver.classList.add('hidden');
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        controls.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = score.toLocaleString();
        showReaction('fail', 1400);
    }
    syncBgm();
}

// 3.2 Input Handling
function unlockAudio() {
    if (!audioUnlocked) {
        audioUnlocked = true;
        audioCtx.resume();
        sounds.bgm.volume = 0.2;
        sounds.bgm.play().catch(() => {});
    }
}

function syncBgm() {
    if (!audioUnlocked) return;
    if (gameState === 'PLAYING') {
        sounds.bgm.volume = 0.2;
        sounds.bgm.play().catch(() => {});
    } else {
        sounds.bgm.pause();
    }
}

function playMediaSound(name, volume = 0.5, debounceMs = 90) {
    const now = performance.now();
    if (lastSfxAt[name] && now - lastSfxAt[name] < debounceMs) return;
    lastSfxAt[name] = now;

    const media = sounds[name];
    if (!media || media.readyState < 2) return;
    media.volume = volume;
    media.currentTime = 0;
    media.play().catch(() => {});
}

function showReaction(type, duration = 950) {
    clearTimeout(reactionTimer);
    Object.values(reactionEls).forEach((el) => el.classList.remove('active'));
    const el = reactionEls[type];
    if (!el) return;
    el.classList.add('active');
    reactionTimer = setTimeout(() => {
        el.classList.remove('active');
    }, duration);
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

function playSound(type) {
    if (type === 'score') {
        playMediaSound('score', 0.45, 70);
        playMediaSound('block', 0.34, 70);
        showReaction('love', 820);
        if (sounds.score.readyState < 2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    } else if (type === 'fail') {
        playMediaSound('fail', 0.5, 100);
        showReaction('fail', 1000);
        if (sounds.fail.readyState < 2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    } else if (type === 'restart') {
        playMediaSound('restart', 0.42, 140);
    } else if (type === 'warning') {
        playMediaSound('warning', 0.4, 600);
        showReaction('fail', 780);
    }
}

function handleGlobalInput(e) {
    unlockAudio();
    
    if (gameState === 'GAMEOVER') {
        // Only restart if clicking the button, handled by restart-btn listener
        return;
    }
    
    if (gameState === 'PLAYING') {
        const x = e.clientX - canvas.getBoundingClientRect().left;
        const action = x < cw / 2 ? 'LOVE' : 'BLOCK';
        processAction(action);
    }
}

function processAction(action) {
    // Find lowest active bubble
    // Sort by Y descending (lowest first)
    const target = bubbles.sort((a,b) => b.y - a.y)[0];
    
    if (!target) return;

    // Check if correct
    // Type 0 = Fan (needs LOVE), Type 1 = Hater (needs BLOCK)
    const isCorrect = (target.type === 0 && action === 'LOVE') || (target.type === 1 && action === 'BLOCK');
    
    // Create particles at target position
    createExplosion(target.x, target.y, isCorrect ? (target.type === 0 ? '❤️' : '🚫') : '💢');

    if (isCorrect) {
        score += 100 * Math.floor(difficultyMultiplier);
        playSound('score');
        vibrate('light');
        // Remove bubble
        bubbles = bubbles.filter(b => b !== target);
        difficultyMultiplier += 0.05;
    } else {
        life -= 15;
        shake = 10;
        playSound('fail');
        vibrate('heavy');
        // Penalty: bubble stays but gets pushed up slightly? Or just remove it to keep flow?
        // Let's remove it to prevent frustration lock
        bubbles = bubbles.filter(b => b !== target);
    }

    if (life <= 35 && !lowLifeWarningPlayed && gameState === 'PLAYING') {
        lowLifeWarningPlayed = true;
        playSound('warning');
    }
    
    updateUI();
    checkGameOver();
}

function restartGame() {
    playSound('restart');
    initGame();
    setState('PLAYING');
}

// 3.3 Game Logic
class Bubble {
    constructor(yStart) {
        this.type = Math.random() > 0.4 ? 0 : 1; // 60% fans, 40% haters
        this.w = Math.min(cw * 0.7, 300);
        this.h = 70;
        this.x = (cw - this.w) / 2;
        this.y = yStart || -this.h;
        this.text = this.type === 0 
            ? ["First like!", "Big fan here!", "Heart this!", "You're trending!", "Keep posting!"][Math.floor(Math.random()*5)]
            : ["Muted.", "Spam alert", "Bad take", "Hard pass", "Fake vibe"][Math.floor(Math.random()*5)];
        this.color = this.type === 0 ? "#FF2D55" : "#34C759"; // Pink vs Green
        this.speed = (window.gameConfig.heroSpeed || 3) * (1 + Math.random() * 0.2);
    }

    update(dt) {
        this.y += this.speed * difficultyMultiplier * (dt * 60);
    }

    draw(ctx) {
        // Draw bubble
        ctx.fillStyle = this.color;
        ctx.shadowColor = "rgba(0,0,0,0.1)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 4;
        
        // Rounded rect
        const r = 20;
        ctx.beginPath();
        ctx.moveTo(this.x + r, this.y);
        ctx.lineTo(this.x + this.w - r, this.y);
        ctx.quadraticCurveTo(this.x + this.w, this.y, this.x + this.w, this.y + r);
        ctx.lineTo(this.x + this.w, this.y + this.h - r);
        ctx.quadraticCurveTo(this.x + this.w, this.y + this.h, this.x + this.w - r, this.y + this.h);
        
        // Tail
        if (this.type === 0) { // Left tail for fan? No, keep it centered or standard
            // Standard messenger tail right bottom
            ctx.lineTo(this.x + this.w + 10, this.y + this.h); 
            ctx.lineTo(this.x + this.w - 10, this.y + this.h - 10);
        } else {
            // Left bottom
            ctx.lineTo(this.x - 10, this.y + this.h);
            ctx.lineTo(this.x + 10, this.y + this.h - 10);
        }

        ctx.lineTo(this.x + r, this.y + this.h);
        ctx.quadraticCurveTo(this.x, this.y + this.h, this.x, this.y + this.h - r);
        ctx.lineTo(this.x, this.y + r);
        ctx.quadraticCurveTo(this.x, this.y, this.x + r, this.y);
        ctx.fill();
        
        ctx.shadowColor = "transparent";

        // Draw Icon
        ctx.fillStyle = "#fff";
        ctx.font = "700 20px Audiowide, system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        const icon = this.type === 0 ? "💖" : "☣️";
        ctx.fillText(icon, this.x + 15, this.y + this.h/2);

        // Draw Text
        ctx.fillStyle = "#fff";
        ctx.font = "700 18px Rajdhani, system-ui, sans-serif";
        ctx.fillText(this.text, this.x + 50, this.y + this.h/2);
    }
}

class Particle {
    constructor(x, y, char) {
        this.x = x;
        this.y = y;
        this.char = char;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 1) * 10 - 5;
        this.life = 1.0;
        this.size = 20 + Math.random() * 20;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.5; // Gravity
        this.life -= 2 * dt;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = `${this.size}px Arial`;
        ctx.fillText(this.char, this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

function spawnBubble(y) {
    bubbles.push(new Bubble(y));
}

function createExplosion(x, y, char) {
    for (let i = 0; i < 8; i++) {
        particles.push(new Particle(x + Math.random()*100, y + Math.random()*50, char));
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = score.toLocaleString();
    document.getElementById('life-display').innerText = Math.max(0, Math.floor(life)) + '%';
    document.getElementById('life-display').style.color = life < 30 ? '#ef4444' : '#1f2937';
}

function checkGameOver() {
    if (life <= 0) {
        life = 0;
        setState('GAMEOVER');
        vibrate('heavy');
    }
}

function update(dt) {
    // Spawner
    spawnTimer += dt * 1000;
    const rate = Math.max(400, CONFIG.bubbleSpawnRate / difficultyMultiplier);
    if (spawnTimer > rate) {
        spawnBubble();
        spawnTimer = 0;
    }

    // Update Bubbles
    for (let i = bubbles.length - 1; i >= 0; i--) {
        let b = bubbles[i];
        b.update(dt);
        
        // Check bounds (bottom of screen)
        // HUD height is roughly 80px at top, but input is at bottom.
        // Let's say bottom limit is ch - 100
        if (b.y > ch + 50) {
            // Missed bubble
            life -= 10;
            shake = 5;
            playSound('fail');
            vibrate('medium');
            bubbles.splice(i, 1);
            checkGameOver();
        }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // Shake decay
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;
}

function draw() {
    // Clear
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#110a24');
    bgGradient.addColorStop(0.58, '#1a0f39');
    bgGradient.addColorStop(1, '#25104c');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    // Apply Shake
    ctx.save();
    if (shake > 0) {
        const dx = (Math.random() - 0.5) * shake * 2;
        const dy = (Math.random() - 0.5) * shake * 2;
        ctx.translate(dx, dy);
    }

    // Background Pattern
    for (let x = 0; x < cw; x += 38) {
        for (let y = 0; y < ch; y += 38) {
            ctx.fillStyle = 'rgba(122, 226, 255, 0.08)';
            ctx.fillRect(x, y, 2, 2);
        }
    }

    const fanZone = ctx.createLinearGradient(0, 0, cw / 2, 0);
    fanZone.addColorStop(0, 'rgba(255, 79, 149, 0.18)');
    fanZone.addColorStop(1, 'rgba(255, 79, 149, 0.03)');
    ctx.fillStyle = fanZone;
    ctx.fillRect(0, 0, cw/2, ch);

    const haterZone = ctx.createLinearGradient(cw / 2, 0, cw, 0);
    haterZone.addColorStop(0, 'rgba(52, 211, 153, 0.03)');
    haterZone.addColorStop(1, 'rgba(52, 211, 153, 0.18)');
    ctx.fillStyle = haterZone;
    ctx.fillRect(cw/2, 0, cw/2, ch);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
    for (let y = 16; y < ch; y += 22) {
        ctx.fillRect(0, y, cw, 1);
    }

    // Draw Divider
    ctx.strokeStyle = 'rgba(122, 226, 255, 0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cw/2, 0);
    ctx.lineTo(cw/2, ch);
    ctx.stroke();

    // Draw Bubbles
    bubbles.forEach(b => b.draw(ctx));

    // Draw Particles
    particles.forEach(p => p.draw(ctx));

    ctx.restore();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
    lastTime = timestamp;

    if (gameState === 'PLAYING') {
        try {
            update(dt);
        } catch (e) {
            console.error(e);
            // Reset safe state if error
            bubbles = [];
        }
    }
    
    draw();
    requestAnimationFrame(loop);
}

// Lifecycle Hooks
window.addEventListener('DOMContentLoaded', () => {
    // Parse config
    try {
        const cfg = JSON.parse(document.getElementById('game-config').text);
        if (cfg.heroSpeed) CONFIG.heroSpeed = cfg.heroSpeed.value;
    } catch(e) {}

    resize();
    window.addEventListener('resize', resize);
    
    // Input Routing
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', () => {
        unlockAudio();
        restartGame();
    });

    // Start
    initGame();
    setState('PLAYING');
    
    // L1 Audio Unlock attempt kept gesture-safe through muted failure handling.
    syncBgm();

    requestAnimationFrame(loop);
});

// Hot Reload Support
window.updateGameConfig = (key, val) => {
    if (key === 'heroSpeed') CONFIG.heroSpeed = val;
    if (key === 'themeColor') CONFIG.themeColor = val;
};

</script>
