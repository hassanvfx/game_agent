<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Courier: Storm Run</title>
<!-- [agent-note][stage4] repaired-font-remap: replaced non-candidate body/display stack with catalog fonts Rajdhani + Audiowide -->

<style>
    :root {
        --bg-deep: #071225;
        --bg-mid: #10284d;
        --bg-bright: #45c2ff;
        --panel-bg: rgba(8, 19, 42, 0.78);
        --panel-border: rgba(139, 241, 255, 0.4);
        --panel-shadow: 0 16px 36px rgba(0, 10, 30, 0.48);
        --panel-highlight: rgba(255, 255, 255, 0.08);
        --text-white: #f4fbff;
        --text-soft: #d4efff;
        --text-accent: #ffe27a;
        --danger-red: #ff5d73;
        --danger-blue: #66c7ff;
        --button-start: #ff9f43;
        --button-end: #ff5d73;
        --button-border: #7a2f55;
        --hero-glow: rgba(125, 241, 255, 0.55);
        --hud-edge: rgba(255, 255, 255, 0.16);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at top, #12305e 0%, #050b18 70%);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    body {
        color: var(--text-white);
        letter-spacing: 0.02em;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        background:
            radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.34), transparent 28%),
            linear-gradient(180deg, #68d8ff 0%, #1e5b9a 52%, #06101f 100%);
        overflow: hidden;
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    #game-container::before {
        background:
            radial-gradient(circle at 20% 22%, rgba(255, 255, 255, 0.2), transparent 18%),
            radial-gradient(circle at 80% 14%, rgba(255, 214, 115, 0.16), transparent 20%),
            linear-gradient(180deg, transparent 60%, rgba(3, 9, 20, 0.45) 100%);
        opacity: 0.9;
    }

    #game-container::after {
        background:
            repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 14px);
        mix-blend-mode: soft-light;
        opacity: 0.35;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        pointer-events: none;
        box-sizing: border-box;
    }

    #hud {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        gap: 12px;
    }

    .hud-stack {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 14px 12px;
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background:
            linear-gradient(180deg, var(--panel-highlight), transparent 48%),
            var(--panel-bg);
        box-shadow: var(--panel-shadow);
    }

    .score-value {
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-weight: 400;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 0 14px rgba(109, 224, 255, 0.55), 0 3px 0 rgba(0, 0, 0, 0.3);
    }

    .score-label {
        color: var(--text-accent);
        font-weight: 600;
        font-size: clamp(0.85rem, 2vw, 1.1rem);
        letter-spacing: 0.12em;
    }

    .meter-shell {
        width: min(34vw, 320px);
        height: 16px;
        margin-top: 8px;
        padding: 4px;
        background:
            linear-gradient(180deg, rgba(8, 18, 40, 0.88), rgba(2, 8, 20, 0.92));
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        overflow: hidden;
        box-sizing: border-box;
        box-shadow: var(--panel-shadow);
        backdrop-filter: blur(8px);
    }

    #health-bar {
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--danger-red), #ffb24d 45%, var(--danger-blue));
        box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.22), 0 0 12px rgba(102, 199, 255, 0.35);
        transition: width 0.2s ease;
    }

    .text-shadow {
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
    }

    .hidden {
        display: none !important;
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 55%),
            var(--panel-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        box-shadow: var(--panel-shadow);
    }

    .overlay {
        position: absolute;
        inset: 0;
    }

    #danger-overlay {
        z-index: 10;
        pointer-events: none;
    }

    .feedback-gif {
        position: absolute;
        right: 14px;
        width: clamp(80px, 18vw, 124px);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid var(--panel-border);
        background: rgba(6, 14, 28, 0.72);
        box-shadow: var(--panel-shadow);
        opacity: 0;
        transform: translateY(8px) scale(0.92);
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        z-index: 55;
    }

    .feedback-gif.active {
        opacity: 0.96;
        transform: translateY(0) scale(1);
    }

    #collect-gif {
        top: 92px;
    }

    #crash-gif {
        top: 228px;
    }

    #game-over-screen {
        position: absolute;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        pointer-events: auto;
    }

    .game-over-card {
        width: min(100%, 320px);
        padding: 32px 24px;
        border-radius: 24px;
        text-align: center;
        box-sizing: border-box;
    }

    .game-over-title {
        margin: 0 0 8px;
        color: #ffd7a6;
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: clamp(2.2rem, 7vw, 3rem);
        font-weight: 400;
        text-shadow: 0 0 16px rgba(255, 123, 93, 0.45);
    }

    .game-over-copy {
        margin: 0 0 24px;
        color: var(--text-soft);
        font-size: clamp(1rem, 3vw, 1.25rem);
    }

    #restart-btn {
        width: 100%;
        border: 0;
        border-bottom: 4px solid var(--button-border);
        border-radius: 16px;
        padding: 16px;
        color: var(--text-white);
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: clamp(1rem, 3vw, 1.1rem);
        letter-spacing: 0.08em;
        cursor: pointer;
        background: linear-gradient(to right, var(--button-start), var(--button-end));
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        transition: transform 0.12s ease, filter 0.12s ease;
    }

    #restart-btn:hover,
    #restart-btn:focus-visible {
        filter: brightness(1.08);
        outline: none;
    }

    #restart-btn:active {
        transform: scale(0.95);
    }

    @keyframes police-flash {
        0% { opacity: 0; }
        50% { opacity: 0.3; }
        100% { opacity: 0; }
    }

    .strobe-overlay {
        animation: police-flash 0.5s infinite;
        background: linear-gradient(to top, rgba(255, 70, 92, 0.38), rgba(82, 199, 255, 0.34));
        pointer-events: none;
    }

    @media (max-width: 640px) {
        #ui-layer {
            padding: 16px;
        }

        .hud-stack {
            padding: 8px 10px 10px;
        }

        .meter-shell {
            width: min(38vw, 220px);
        }

        .game-over-card {
            width: min(100%, 300px);
            padding: 28px 20px;
        }

        .feedback-gif {
            right: 10px;
            width: 82px;
        }

        #collect-gif {
            top: 84px;
        }

        #crash-gif {
            top: 188px;
        }
    }
</style>

<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="danger-overlay" class="overlay hidden"></div>
    <!-- [agent-note][stage3] resolved-gif: collect/crash feedback -> catalogs/gifs.json -->
    <img id="collect-gif" class="feedback-gif" src="https://i.giphy.com/xT0GqdW51m20b2RBm0.webp" alt="Energy ring boost reaction" hidden>
    <img id="crash-gif" class="feedback-gif" src="https://i.giphy.com/wY1So1mO4gaNbntT0r.webp" alt="Storm crash reaction" hidden>
    <div id="ui-layer">
        <div id="hud">
            <div class="hud-stack">
                <span class="score-value text-shadow" id="score-display">0m</span>

            </div>
            <div class="meter-shell">
                <div id="health-bar"></div>
            </div>
        </div>

        <div id="game-over-screen" class="hidden">
            <div class="glass game-over-card">
                <h1 class="game-over-title text-shadow">DELIVERY LOST</h1>
                <p class="game-over-copy">You carried the route for <span id="final-score">0</span>m</p>
                <button id="restart-btn">FLY AGAIN</button>

<script>
/**
 * Stage 01 narrative remap:
 * - hero = sky courier
 * - donuts = energy rings
 * - barriers = cargo hazards
 * - lightning = storm strikes
 * - health = storm buffer before the route collapses
 */
const CONFIG = {
    dpr: window.devicePixelRatio || 1,
    laneWidth: 0,
    gravity: 2000,
    colors: {
        sky: '#4facfe',
        skyBottom: '#00f260',
        grass: '#00f260',
        road: '#808080',
        hero: '#ffffff',
        lightning: '#fddb92',
        heroBody: '#75e4ff',
        heroTrim: '#ffb347',
        heroAccent: '#ffffff',
        heroShadow: 'rgba(0, 0, 0, 0.35)',
        heroGlow: 'rgba(117, 228, 255, 0.55)',
        ringOuter: '#ffcf5c',
        ringInner: '#fff5cd',
        barrierMain: '#273750',
        barrierGlow: '#ff8459',
        cloudGlow: 'rgba(255,255,255,0.92)'
    }
};

let canvas, ctx, cw, ch;
let lastTime = 0;
let gameState = 'BOOT';
let gameData = {
    score: 0,
    distance: 0,
    health: 100,
    speedMultiplier: 1
};
let input = { x: 0.5, active: false };

let hero = { x: 0.5, y: 0.8, width: 40, height: 40, vx: 0, vy: 0, grounded: true };
let obstacles = [];
let particles = [];
let clouds = [];
let cameraY = 0;

window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    collect: document.getElementById('sfx_collect'),
    crash: document.getElementById('sfx_crash'),
    warning: document.getElementById('sfx_warning'),
    ui: document.getElementById('sfx_ui')
};

const feedbackEls = {
    collect: document.getElementById('collect-gif'),
    crash: document.getElementById('crash-gif')
};

let audioArmed = false;
let dangerAudioLatched = false;
let feedbackTimers = new Map();

document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });

    const handleInput = (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        armAudio();

        if (gameState === 'GAMEOVER') {
            if (e.target.id === 'restart-btn') {
                playSound('ui');
                restartGame();
            }
            return;
        }

        if (gameState === 'PLAYING') {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            input.x = Math.max(0, Math.min(1, (clientX - rect.left) / cw));
            input.active = true;
        }
    };

    window.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('pointermove', (e) => {
        if (!input.active) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        input.x = Math.max(0, Math.min(1, (e.clientX - rect.left) / cw));
    }, { passive: false });
    window.addEventListener('pointerup', () => input.active = false);
    window.addEventListener('pointercancel', () => input.active = false);

    document.getElementById('restart-btn').addEventListener('click', handleInput);

    resize();
    window.addEventListener('resize', resize);
    initGame();
    setState('PLAYING');
    requestAnimationFrame(loop);
});

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * CONFIG.dpr;
    canvas.height = ch * CONFIG.dpr;
    ctx.setTransform(CONFIG.dpr, 0, 0, CONFIG.dpr, 0, 0);
    CONFIG.laneWidth = cw / 3;
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    const danger = document.getElementById('danger-overlay');

    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
        danger.classList.remove('strobe-overlay');
        danger.classList.add('hidden');
        syncLoopAudio();
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = Math.floor(gameData.distance);
        danger.classList.remove('strobe-overlay');
        danger.classList.add('hidden');
        showFeedback('crash');
        playSound('ui');
        syncLoopAudio();
    }
}

function initGame() {
    gameData.score = 0;
    gameData.distance = 0;
    gameData.health = 100;
    gameData.speedMultiplier = 1;
    cameraY = 0;

    hero.x = cw / 2;
    hero.y = ch * 0.75;
    hero.vx = 0;

    obstacles = [];
    particles = [];
    clouds = [];

    for (let i = 0; i < 5; i++) {
        spawnCloud(Math.random() * ch);
    }
}

function restartGame() {
    initGame();
    setState('PLAYING');
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') update(dt);
        draw();
    } catch (e) {
        console.error('Loop Error:', e);
        hero.x = cw / 2;
    }

    requestAnimationFrame(loop);
}

function update(dt) {
    gameData.speedMultiplier += dt * 0.02;
    const currentSpeed = window.gameConfig.baseSpeed * gameData.speedMultiplier;

    const padding = 30;
    const targetX = padding + input.x * (cw - padding * 2);
    const lerpSpeed = window.gameConfig.heroSpeed;

    hero.x += (targetX - hero.x) * lerpSpeed * dt;
    if (!isFinite(hero.x)) hero.x = cw / 2;

    hero.y = ch * 0.75 + Math.sin(Date.now() / 100) * 5;

    gameData.distance += currentSpeed * dt / 100;
    cameraY += currentSpeed * dt;

    spawnManager(currentSpeed);
    updateEntities(dt, currentSpeed);

    gameData.health = Math.min(100, gameData.health + dt * 2);

    document.getElementById('score-display').innerText = Math.floor(gameData.distance) + 'm';
    document.getElementById('health-bar').style.width = gameData.health + '%';

    const danger = document.getElementById('danger-overlay');
    if (gameData.health < 30) {
        danger.classList.remove('hidden');
        danger.classList.add('strobe-overlay');
        if (!dangerAudioLatched) {
            dangerAudioLatched = true;
            playSound('warning');
        }
    } else {
        danger.classList.add('hidden');
        danger.classList.remove('strobe-overlay');
        dangerAudioLatched = false;
    }

    if (gameData.health <= 0) {
        vibrate('heavy');
        playSound('crash');
        createExplosion(hero.x, hero.y, '#ff0055', 50);
        setState('GAMEOVER');
    }
}

function spawnManager(speed) {
    if (Math.random() < 0.01) spawnCloud(-100);

    const spawnRate = 0.02 * gameData.speedMultiplier;
    if (Math.random() < spawnRate) {
        const type = Math.random();
        if (type < 0.2) spawnLightning();
        else if (type < 0.5) spawnDonut();
        else spawnBarrier();
    }
}

function spawnCloud(y) {
    clouds.push({
        x: Math.random() * cw,
        y: y,
        size: 40 + Math.random() * 60,
        speed: 20 + Math.random() * 30
    });
}

function spawnLightning() {
    obstacles.push({
        type: 'lightning',
        x: Math.random() * (cw - 60) + 30,
        y: -50,
        width: 40,
        height: 40,
        timer: 1.5,
        active: false,
        color: CONFIG.colors.lightning
    });
}

function spawnDonut() {
    obstacles.push({
        type: 'donut',
        x: Math.random() * (cw - 40) + 20,
        y: -50,
        width: 30,
        height: 30,
        color: CONFIG.colors.ringOuter
    });
}

function spawnBarrier() {
    obstacles.push({
        type: 'barrier',
        x: Math.random() * (cw - 60) + 30,
        y: -50,
        width: 50,
        height: 50,
        color: CONFIG.colors.barrierMain
    });
}

function updateEntities(dt, speed) {
    clouds.forEach(c => {
        c.y += (speed * 0.5 + c.speed) * dt;
    });
    clouds = clouds.filter(c => c.y < ch + 100);

    particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.size *= 0.95;
    });
    particles = particles.filter(p => p.life > 0);

    if (Math.random() < 0.3) {
        particles.push({
            x: hero.x + (Math.random() - 0.5) * 20,
            y: hero.y + 20,
            vx: (Math.random() - 0.5) * 20,
            vy: speed * 0.8,
            size: Math.random() * 5 + 2,
            color: 'rgba(255,255,255,0.5)',
            life: 0.5
        });
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];

        if (o.type === 'lightning') {
            o.y += speed * dt;
            o.timer -= dt;
            if (o.timer <= 0 && !o.active) {
                o.active = true;
                o.timer = 0.2;
                vibrate('medium');
                createExplosion(o.x, o.y + 100, '#fff', 10);
            } else if (o.active && o.timer <= 0) {
                obstacles.splice(i, 1);
                continue;
            }
        } else {
            o.y += speed * dt;
        }

        if (checkCollision(hero, o)) {
            if (o.type === 'donut') {
                gameData.health = Math.min(100, gameData.health + 15);
                gameData.score += 50;
                playSound('collect');
                showFeedback('collect');
                vibrate('light');
                createExplosion(o.x, o.y, '#ffff00', 20);
                obstacles.splice(i, 1);
            } else if (o.type === 'barrier' || (o.type === 'lightning' && o.active)) {
                gameData.health -= 35;
                vibrate('heavy');
                playSound('crash');
                showFeedback('crash');
                createExplosion(hero.x, hero.y, '#ff0000', 30);
                obstacles.splice(i, 1);
            }
        }

        if (o.y > ch + 100) obstacles.splice(i, 1);
    }
}

function checkCollision(a, b) {
    if (b.type === 'lightning' && !b.active) return false;

    const aW = a.width * 0.6;
    const aH = a.height * 0.6;
    const bW = b.width * 0.8;
    const bH = b.height * 0.8;

    if (b.type === 'lightning' && b.active) {
        return Math.abs(a.x - b.x) < (aW + bW / 2) && a.y > b.y;
    }

    return Math.abs(a.x - b.x) < (aW + bW) / 2 &&
           Math.abs(a.y - b.y) < (aH + bH) / 2;
}

function draw() {
    const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
    skyGradient.addColorStop(0, window.gameConfig.themeColor);
    skyGradient.addColorStop(0.48, '#3276b6');
    skyGradient.addColorStop(1, '#06101f');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, cw, ch);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let i = 0; i < 6; i++) {
        const y = (i * ch) / 6;
        ctx.fillRect(0, y, cw, 2);
    }

    const grassWidth = cw * 0.15;
    const sideGradient = ctx.createLinearGradient(0, 0, grassWidth, 0);
    sideGradient.addColorStop(0, '#0a1732');
    sideGradient.addColorStop(1, '#13457d');
    ctx.fillStyle = sideGradient;
    ctx.fillRect(0, 0, grassWidth, ch);
    ctx.fillRect(cw - grassWidth, 0, grassWidth, ch);

    const roadGradient = ctx.createLinearGradient(0, 0, 0, ch);
    roadGradient.addColorStop(0, '#1d2842');
    roadGradient.addColorStop(1, '#090e18');
    ctx.fillStyle = roadGradient;
    ctx.fillRect(grassWidth, 0, cw - grassWidth * 2, ch);

    ctx.strokeStyle = 'rgba(112, 228, 255, 0.22)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(grassWidth, 0);
    ctx.lineTo(grassWidth, ch);
    ctx.moveTo(cw - grassWidth, 0);
    ctx.lineTo(cw - grassWidth, ch);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.24)';
    const stripeH = 100;
    const offset = cameraY % (stripeH * 2);
    for (let y = -stripeH; y < ch + stripeH; y += stripeH * 2) {
        ctx.fillRect(cw / 2 - 5, y + offset, 10, stripeH);
    }

    clouds.forEach(c => {
        ctx.fillStyle = CONFIG.colors.cloudGlow;
        ctx.shadowBlur = 16;
        ctx.shadowColor = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 0.5, c.y + c.size * 0.2, c.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    obstacles.forEach(o => {
        if (o.type === 'donut') {
            ctx.fillStyle = o.color;
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(255, 214, 92, 0.6)';
            ctx.beginPath();
            ctx.arc(o.x, o.y, o.width / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = CONFIG.colors.ringInner;
            ctx.beginPath();
            ctx.arc(o.x, o.y, o.width / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else if (o.type === 'barrier') {
            ctx.fillStyle = o.color;
            ctx.beginPath();
            ctx.roundRect(o.x - o.width / 2, o.y - o.height / 2, o.width, o.height, 10);
            ctx.fill();
            ctx.fillStyle = CONFIG.colors.barrierGlow;
            ctx.beginPath();
            ctx.roundRect(o.x - o.width / 2 + 6, o.y - o.height / 2 + 6, o.width - 12, o.height - 12, 8);
            ctx.fill();
        } else if (o.type === 'lightning') {
            if (o.active) {
                ctx.strokeStyle = '#fff8d2';
                ctx.lineWidth = 5;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffff00';
                ctx.beginPath();
                ctx.moveTo(o.x, -50);
                ctx.lineTo(o.x + (Math.random() - 0.5) * 20, ch / 2);
                ctx.lineTo(o.x + (Math.random() - 0.5) * 20, ch);
                ctx.stroke();
                ctx.shadowBlur = 0;
            } else {
                ctx.strokeStyle = `rgba(255,120,90,${Math.sin(Date.now() / 50) * 0.5 + 0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(o.x, hero.y, 20, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    });

    ctx.save();
    ctx.translate(hero.x, hero.y);
    ctx.fillStyle = CONFIG.colors.heroShadow;
    ctx.beginPath();
    ctx.ellipse(0, 22, 18, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 18;
    ctx.shadowColor = CONFIG.colors.heroGlow;
    ctx.fillStyle = CONFIG.colors.heroBody;
    ctx.beginPath();
    ctx.ellipse(0, 4, 19, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = CONFIG.colors.heroTrim;
    ctx.beginPath();
    ctx.moveTo(-9, 4);
    ctx.lineTo(0, -20);
    ctx.lineTo(9, 4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0f2e5b';
    ctx.beginPath();
    ctx.arc(0, -2, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = CONFIG.colors.heroAccent;
    ctx.beginPath();
    ctx.arc(-3, -4, 2.1, 0, Math.PI * 2);
    ctx.arc(3, -4, 2.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-5, 8);
    ctx.lineTo(-14, 16);
    ctx.moveTo(5, 8);
    ctx.lineTo(14, 16);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

function armAudio() {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }

    if (!audioArmed) {
        audioArmed = true;
        syncLoopAudio();
    }
}

function syncLoopAudio() {
    const bgm = sounds.bgm;
    if (!bgm) return;

    bgm.volume = 0.2;

    if (audioArmed && gameState === 'PLAYING') {
        bgm.play().catch(() => {});
    } else {
        bgm.pause();
    }
}

function showFeedback(type) {
    const el = feedbackEls[type];
    if (!el) return;

    el.hidden = false;
    el.classList.add('active');

    if (feedbackTimers.has(type)) {
        clearTimeout(feedbackTimers.get(type));
    }

    feedbackTimers.set(type, setTimeout(() => {
        el.classList.remove('active');
        setTimeout(() => {
            if (!el.classList.contains('active')) el.hidden = true;
        }, 220);
    }, 900));
}

function playSound(id) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const el = sounds[id];
    if (el) {
        el.volume = id === 'warning' ? 0.45 : id === 'ui' ? 0.4 : 0.55;
        el.currentTime = 0;
        el.play().catch(() => playSynth(id));
    } else {
        playSynth(id);
    }
}

function playSynth(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'collect') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'warning') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
    } else if (type === 'ui') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(640, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }
}

function vibrate(style) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.5) * 300,
            size: Math.random() * 5 + 2,
            color: color,
            life: 0.5 + Math.random() * 0.5
        });
    }
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        const def = window.gameConfigDefs[key];
        if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, Number(val)));
        if (def.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
        window.gameConfig[key] = val;
    }
};
