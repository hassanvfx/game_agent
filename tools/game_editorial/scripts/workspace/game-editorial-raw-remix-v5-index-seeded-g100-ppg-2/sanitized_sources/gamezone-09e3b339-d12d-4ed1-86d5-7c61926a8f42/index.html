<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Midnight Street Chef</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-night: #11081d;
            --bg-dusk: #2a1240;
            --panel: rgba(35, 16, 44, 0.72);
            --panel-strong: rgba(54, 21, 50, 0.9);

<script>
// §3.2 Configuration Interface
window.gameConfigDefs = {
    "cookSpeed": { "type": "number", "label": "Cooking Speed", "value": 20, "min": 5, "max": 50 },
    "dayDuration": { "type": "number", "label": "Day Duration (sec)", "value": 30, "min": 10, "max": 120 },
    "foodPrice": { "type": "number", "label": "Food Price ($)", "value": 15, "min": 5, "max": 100 }
};
window.gameConfig = {
    cookSpeed: 20,
    dayDuration: 30,
    foodPrice: 15
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
};

// §A.2 AudioManager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.sfxNodes = {};
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        
        // Unlock events
        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
            });
            ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock, { once: true }));
    }

    async loadSound(id, src) {
        try {
            const soundUrl = new URL(src, window.location.href);
            if (soundUrl.origin !== window.location.origin) {
                return;
            }
            const res = await fetch(soundUrl.href);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const arrayBuffer = await res.arrayBuffer();
            const buf = await this.ctx.decodeAudioData(arrayBuffer.slice(0));
            this.buffers[id] = buf;
        } catch (e) {
            console.warn('Audio load failed, fallback enabled', id);
        }
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (el && this.unlocked) {
            el.volume = 0.22;
            el.play().catch(() => {});
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id, options = {}) {
        if (!this.ctx || !this.unlocked) return;
        const { volume = 0.18, cooldown = 0 } = options;
        const now = performance.now();
        if (cooldown > 0 && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;
        
        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = this.buffers[id];
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            if (id === 'sfx_sell' || id === 'sfx_start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(760, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1180, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            } else if (id === 'sfx_fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.16);
                gain.gain.setValueAtTime(volume * 0.85, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.16);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(130, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }
        }
    }
}

const audioManager = new AudioManager();

// Game State
let canvas, ctx;
let lastTime = 0;
let gameState = 'START'; // START, PLAY
let money = 0;
let foodStock = 0;
let cookingProgress = 0;
let gameTime = 0; // Total seconds elapsed
let dayCycle = 0; // 0 to 1
let isNight = false;

// Entities
let customers = [];
let particles = [];
 let floatTexts = [];
 let stars = [];
 let activeGifTimer = null;

// Constants
const COOK_MAX = 100;

document.addEventListener('DOMContentLoaded', () => {
    // Config Parse
    try {
        const cfg = JSON.parse(document.getElementById('game-config').textContent);
        for(let k in cfg) window.gameConfig[k] = cfg[k].value;
    } catch(e) {}

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });

    // Audio Preload
    audioManager.init();
     const sfxList = [
         {id: 'sfx_sell', src: document.getElementById('sfx_sell').src},
         {id: 'sfx_cook', src: document.getElementById('sfx_cook').src},
         {id: 'sfx_start', src: document.getElementById('sfx_start').src},
         {id: 'sfx_fail', src: document.getElementById('sfx_fail').src}
     ];
    sfxList.forEach(s => audioManager.loadSound(s.id, s.src));

    // UI Bindings
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const cookBtn = document.getElementById('cookBtn');

     startBtn.addEventListener('click', () => {
         startScreen.classList.add('hidden');
         gameState = 'PLAY';
         audioManager.init(); // Ensure context created
         audioManager.playSfx('sfx_start', { volume: 0.22, cooldown: 150 });
         audioManager.playBgm();
         showFeedbackGif('sell');
         initGame();
     });

    // Tap to Cook Logic
    const handleCook = (e) => {
        if (gameState !== 'PLAY') return;
        e.preventDefault();
        
         cookingProgress += window.gameConfig.cookSpeed;
         audioManager.playSfx('sfx_cook', { volume: 0.14, cooldown: 70 });
        
        // Spawn chop particles
        const rect = cookBtn.getBoundingClientRect();
        const centerX = rect.left + rect.width/2;
        const centerY = rect.top;
        
        // Visual feedback
        cookBtn.style.transform = 'scale(0.95)';
        setTimeout(() => cookBtn.style.transform = 'scale(1)', 50);

        if (cookingProgress >= COOK_MAX) {
             cookingProgress = 0;
             foodStock++;
             spawnParticle(centerX, centerY, 'steam');
             showFeedbackGif('cook');
             updateHUD();
        }
    };

    cookBtn.addEventListener('pointerdown', handleCook);

    // Resize Handler
    const resize = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Re-init stars on resize
        initStars(w, h);
    };
    window.addEventListener('resize', resize);
    resize();

    // Loop
    requestAnimationFrame(loop);
});

function initGame() {
    customers = [];
    particles = [];
    floatTexts = [];
    money = 0;
    foodStock = 0;
    cookingProgress = 0;
    gameTime = 0;
    updateHUD();
    initStars(window.innerWidth, window.innerHeight);
}

function initStars(w, h) {
    stars = [];
    for(let i=0; i<50; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * (h * 0.6),
            size: Math.random() * 2 + 1,
            alpha: Math.random()
        });
    }
}

function spawnParticle(x, y, type) {
    if (type === 'steam') {
        for(let i=0; i<5; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * 20,
                y: y,
                vx: (Math.random() - 0.5) * 1,
                vy: -Math.random() * 2 - 1,
                life: 1.0,
                type: 'steam'
            });
        }
    } else if (type === 'coin') {
        for(let i=0; i<8; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 1.0,
                type: 'sparkle',
                color: '#FFD700'
            });
        }
    }
}

 function spawnFloatText(x, y, text, color) {
     floatTexts.push({
         x: x,
         y: y,
         text: text,
         life: 1.0,
         color: color
     });
 }
 
 function showFeedbackGif(type) {
     const id = type === 'cook' ? 'cook-reaction' : 'sell-reaction';
     const el = document.getElementById(id);
     if (!el) return;
     el.classList.add('active');
     if (activeGifTimer) clearTimeout(activeGifTimer);
     activeGifTimer = setTimeout(() => {
         el.classList.remove('active');
     }, 900);
 }
 
 function updateHUD() {
    document.getElementById('scoreVal').innerText = money;
    document.getElementById('stockVal').innerText = foodStock;
    
    // Time Format
    const totalMinutes = Math.floor(dayCycle * 24 * 60);
    const hrs = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;
    const ampm = hrs >= 12 ? 'PM' : 'AM';
    const hrs12 = hrs % 12 || 12;
    const timeStr = `${hrs12}:${mins.toString().padStart(2, '0')} ${ampm}`;
    document.getElementById('timeDisplay').innerText = timeStr;

    // Night Bonus UI
    const bonusEl = document.getElementById('nightBonus');
    if (isNight) bonusEl.classList.remove('hidden');
    else bonusEl.classList.add('hidden');
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (gameState === 'PLAY') {
        update(dt);
        draw();
    }
    
    requestAnimationFrame(loop);
}

function update(dt) {
    // Time Logic
    gameTime += dt;
    const cycleDuration = window.gameConfig.dayDuration;
    dayCycle = (gameTime % cycleDuration) / cycleDuration;
    
    // Night is roughly 6PM to 6AM (0.75 to 0.25 in cycle? Let's say 0.5 to 1.0 is night)
    // Let's map 0.0 -> 6AM, 0.5 -> 6PM. So Night is > 0.5
    isNight = dayCycle > 0.5 || dayCycle < 0.0; // Simple 0-1 cycle where 0 is morning, 0.5 is evening
    
    // Customer Spawning
    // Spawn faster during day, slower at night? Or opposite?
    // Let's make it consistent but maybe bursty
    if (Math.random() < 0.02) {
        if (customers.length < 5) {
            spawnCustomer();
        }
    }

    // Customer Logic
    for (let i = customers.length - 1; i >= 0; i--) {
        let c = customers[i];
        
        // Move to counter
        if (c.state === 'WALKING_IN') {
            const targetX = window.innerWidth / 2 + (i - 2) * 60; // Line up
            const dx = targetX - c.x;
            c.x += dx * 2 * dt;
            
            if (Math.abs(dx) < 5) {
                c.state = 'WAITING';
                c.waitTime = 0;
            }
        } else if (c.state === 'WAITING') {
            c.waitTime += dt;
            // Buy if food available
            if (foodStock > 0 && c.waitTime > 0.5) {
                foodStock--;
                
                // Calculate Price
                let price = window.gameConfig.foodPrice;
                if (isNight) price *= 2; // Night Bonus
                
                 money += price;
                 spawnFloatText(c.x, c.y - 50, `+$${price}`, '#4ADE80');
                 spawnParticle(c.x, c.y - 50, 'coin');
                 audioManager.playSfx('sfx_sell', { volume: 0.2, cooldown: 120 });
                 showFeedbackGif('sell');
                 
                 c.state = 'LEAVING';
                 updateHUD();
            }
            
            // Leave if waiting too long (patience)
             if (c.waitTime > 8) {
                 spawnFloatText(c.x, c.y - 50, '😡', '#EF4444');
                 audioManager.playSfx('sfx_fail', { volume: 0.16, cooldown: 220 });
                 c.state = 'LEAVING';
             }
        } else if (c.state === 'LEAVING') {
            c.x += 200 * dt; // Walk right
            if (c.x > window.innerWidth + 50) {
                customers.splice(i, 1);
            }
        }
        
        // Bobbing animation
        c.yOffset = Math.sin(gameTime * 10 + i) * 5;
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Float Texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        let t = floatTexts[i];
        t.y -= 30 * dt;
        t.life -= dt;
        if (t.life <= 0) floatTexts.splice(i, 1);
    }
    
    // HUD Update (Periodic)
    if (Math.floor(gameTime * 10) % 5 === 0) updateHUD();
}

function spawnCustomer() {
    customers.push({
        x: -50,
        y: window.innerHeight * 0.65,
        color: `hsl(${Math.random() * 360}, 70%, 60%)`,
        state: 'WALKING_IN',
        yOffset: 0
    });
}

function draw() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);

    // Sky Gradient
    let skyColorTop, skyColorBot;
    
    if (isNight) {
        skyColorTop = '#140820';
        skyColorBot = '#49225f';
    } else {
        skyColorTop = '#ff9456';
        skyColorBot = '#5e2b88';
    }
    
    const grd = ctx.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, skyColorTop);
    grd.addColorStop(0.58, isNight ? '#28113d' : '#ff5f6d');
    grd.addColorStop(1, skyColorBot);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, w, h);

    const haze = ctx.createRadialGradient(w * 0.5, h * 0.18, 10, w * 0.5, h * 0.18, w * 0.65);
    haze.addColorStop(0, isNight ? 'rgba(255, 138, 92, 0.08)' : 'rgba(255, 210, 112, 0.22)');
    haze.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, w, h);

    // Stars (Night only)
    if (isNight) {
        ctx.fillStyle = '#FFF';
        stars.forEach(s => {
            ctx.globalAlpha = s.alpha * (Math.sin(gameTime * 2 + s.x) * 0.5 + 0.5);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        
        // Moon
        ctx.fillStyle = '#fff1cf';
        ctx.shadowBlur = 24;
        ctx.shadowColor = '#ffd68d';
        ctx.beginPath();
        ctx.arc(w - 54, 84, 28, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    } else {
        // Neon sunset sun
        ctx.fillStyle = '#ffd166';
        ctx.shadowBlur = 42;
        ctx.shadowColor = '#ff8a4f';
        ctx.beginPath();
        ctx.arc(w - 52, 84, 38, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Skyline
    const skylineY = h * 0.52;
    ctx.fillStyle = isNight ? 'rgba(17, 10, 32, 0.72)' : 'rgba(72, 22, 58, 0.46)';
    for (let i = 0; i < 7; i++) {
        const bw = 42 + (i % 3) * 18;
        const bh = 60 + (i % 4) * 26;
        const bx = i * (w / 6.3) - 10;
        ctx.fillRect(bx, skylineY - bh, bw, bh);
        ctx.fillStyle = isNight ? 'rgba(255, 211, 115, 0.24)' : 'rgba(255, 233, 173, 0.2)';
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 2; col++) {
                ctx.fillRect(bx + 8 + col * 14, skylineY - bh + 10 + row * 16, 6, 8);
            }
        }
        ctx.fillStyle = isNight ? 'rgba(17, 10, 32, 0.72)' : 'rgba(72, 22, 58, 0.46)';
    }

    // Ground/Street
    const streetGrad = ctx.createLinearGradient(0, h * 0.7, 0, h);
    streetGrad.addColorStop(0, isNight ? '#3c3147' : '#70415d');
    streetGrad.addColorStop(1, isNight ? '#18131d' : '#2e1727');
    ctx.fillStyle = streetGrad;
    ctx.fillRect(0, h * 0.7, w, h * 0.3);

    // Neon road streaks
    ctx.strokeStyle = 'rgba(255, 210, 112, 0.16)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
        const y = h * 0.75 + i * 24;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y + 8);
        ctx.stroke();
    }

    // Stall (Back)
    const stallX = w/2 - 100;
    const stallY = h * 0.6;
    const stallGrad = ctx.createLinearGradient(stallX, stallY, stallX, stallY + 150);
    stallGrad.addColorStop(0, isNight ? '#4f2140' : '#8c3b45');
    stallGrad.addColorStop(1, isNight ? '#2f1328' : '#5d2434');
    ctx.fillStyle = stallGrad;
    ctx.fillRect(stallX, stallY, 200, 150);

    ctx.strokeStyle = 'rgba(255, 225, 164, 0.28)';
    ctx.lineWidth = 3;
    ctx.strokeRect(stallX + 6, stallY + 8, 188, 136);
    
    // Stall Roof (Striped)
    ctx.beginPath();
    ctx.moveTo(stallX - 20, stallY);
    ctx.lineTo(stallX + 220, stallY);
    ctx.lineTo(stallX + 200, stallY - 40);
    ctx.lineTo(stallX, stallY - 40);
    ctx.fillStyle = '#ff7043';
    ctx.fill();
    ctx.fillStyle = '#ffe7b0';
    for(let i=0; i<5; i++) {
        ctx.beginPath();
        ctx.moveTo(stallX + i*40, stallY - 40);
        ctx.lineTo(stallX + i*40 + 20, stallY - 40);
        ctx.lineTo(stallX + i*40 + 30, stallY);
        ctx.lineTo(stallX + i*40 + 10, stallY);
        ctx.fill();
    }

    // Lanterns
    const lanterns = [stallX + 18, stallX + 100, stallX + 182];
    lanterns.forEach((lx, idx) => {
        ctx.fillStyle = idx === 1 ? '#ffd166' : '#ff8a4f';
        ctx.shadowBlur = 16;
        ctx.shadowColor = idx === 1 ? '#ffd166' : '#ff8a4f';
        ctx.beginPath();
        ctx.roundRect(lx - 10, stallY - 28, 20, 26, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(88, 31, 16, 0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(lx, stallY - 40);
        ctx.lineTo(lx, stallY - 28);
        ctx.stroke();
    });

    // Chef silhouette / character
    const chefX = w / 2;
    const chefY = stallY + 38;
    ctx.fillStyle = '#ffe0c9';
    ctx.beginPath();
    ctx.arc(chefX, chefY - 24, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff6de';
    ctx.beginPath();
    ctx.moveTo(chefX - 18, chefY - 32);
    ctx.quadraticCurveTo(chefX - 10, chefY - 58, chefX, chefY - 50);
    ctx.quadraticCurveTo(chefX + 10, chefY - 58, chefX + 18, chefY - 32);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2f1837';
    ctx.beginPath();
    ctx.roundRect(chefX - 20, chefY - 8, 40, 48, 12);
    ctx.fill();
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(chefX - 18, chefY + 8, 36, 6);
    ctx.strokeStyle = '#41202c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(chefX - 6, chefY - 26, 2, 0, Math.PI * 2);
    ctx.arc(chefX + 6, chefY - 26, 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(chefX, chefY - 19, 6, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();

    // Skewer flame accent
    ctx.fillStyle = '#ffb347';
    ctx.beginPath();
    ctx.arc(chefX + 34, chefY + 4 + Math.sin(gameTime * 7) * 2, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff5a36';
    ctx.beginPath();
    ctx.arc(chefX + 35, chefY + 5 + Math.sin(gameTime * 7) * 2, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d8b784';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(chefX + 8, chefY + 6);
    ctx.lineTo(chefX + 44, chefY + 6);
    ctx.stroke();

    // Customers
    customers.forEach(c => {
        // Body
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.roundRect(c.x - 18, c.y - 4 + c.yOffset, 36, 42, 15);
        ctx.fill();
        // Head
        ctx.fillStyle = '#ffd9c7';
        ctx.beginPath();
        ctx.arc(c.x, c.y - 25 + c.yOffset, 15, 0, Math.PI*2);
        ctx.fill();
        // Hair cap
        ctx.fillStyle = 'rgba(57, 27, 43, 0.85)';
        ctx.beginPath();
        ctx.arc(c.x, c.y - 29 + c.yOffset, 15, Math.PI, 2 * Math.PI);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#1d1323';
        ctx.beginPath();
        ctx.arc(c.x - 5, c.y - 28 + c.yOffset, 2, 0, Math.PI*2);
        ctx.arc(c.x + 5, c.y - 28 + c.yOffset, 2, 0, Math.PI*2);
        ctx.fill();
    });

    // Stall Counter (Front)
    const counterGrad = ctx.createLinearGradient(stallX, stallY + 80, stallX, stallY + 100);
    counterGrad.addColorStop(0, isNight ? '#7b4051' : '#b65548');
    counterGrad.addColorStop(1, isNight ? '#452334' : '#6d2b32');
    ctx.fillStyle = counterGrad;
    ctx.fillRect(stallX - 10, stallY + 80, 220, 20);

    // Food on Counter
    const foodSize = 15;
    const maxShow = 5;
    for (let i = 0; i < Math.min(foodStock, maxShow); i++) {
        const foodX = stallX + 20 + i * 25;
        ctx.fillStyle = '#ffbf69';
        ctx.beginPath();
        ctx.ellipse(foodX, stallY + 75, foodSize/2, foodSize/3, 0, Math.PI, 0, true);
        ctx.fill();
        ctx.fillStyle = '#7d3c25';
        ctx.fillRect(foodX - 5, stallY + 75, 10, 4);
        ctx.fillStyle = '#8cffb6';
        ctx.fillRect(foodX - 4, stallY + 73, 8, 2);
        
        if (i === maxShow - 1 && foodStock > maxShow) {
            ctx.fillStyle = '#FFF';
            ctx.font = '600 12px Rajdhani';
            ctx.fillText(`+${foodStock-maxShow}`, foodX, stallY + 60);
        }
    }

    // Cooking Progress Bar
    if (cookingProgress > 0) {
        const barW = 118;
        const barH = 12;
        const bx = w/2 - barW/2;
        const by = h * 0.85;
        ctx.fillStyle = 'rgba(18, 10, 24, 0.85)';
        ctx.beginPath();
        ctx.roundRect(bx, by, barW, barH, 999);
        ctx.fill();
        const progressGrad = ctx.createLinearGradient(bx, by, bx + barW, by);
        progressGrad.addColorStop(0, '#ff8a4f');
        progressGrad.addColorStop(1, '#ffd166');
        ctx.fillStyle = progressGrad;
        ctx.beginPath();
        ctx.roundRect(bx, by, barW * (cookingProgress / COOK_MAX), barH, 999);
        ctx.fill();
    }
    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type === 'steam') {
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5 * p.life, 0, Math.PI*2);
            ctx.fill();
        } else if (p.type === 'sparkle') {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 4, 4);
        }
    });
    ctx.globalAlpha = 1;

    // Float Texts
    floatTexts.forEach(t => {
        ctx.globalAlpha = t.life;
        ctx.fillStyle = t.color;
        ctx.font = 'bold 24px Bangers';
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 3;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
    });
    ctx.globalAlpha = 1;

    // Night Overlay (Vignette)
    if (isNight) {
        const grad = ctx.createRadialGradient(w/2, h/2, h*0.4, w/2, h/2, h);
        grad.addColorStop(0, 'rgba(0,0,20,0)');
        grad.addColorStop(1, 'rgba(0,0,40,0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
    }
}
