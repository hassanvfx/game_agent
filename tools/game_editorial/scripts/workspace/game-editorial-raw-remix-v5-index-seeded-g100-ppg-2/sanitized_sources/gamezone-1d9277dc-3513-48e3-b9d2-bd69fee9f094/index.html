<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chef's Rush: Prep Line</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #1f122a;
            --bg-mid: #5d2b56;
            --bg-bottom: #ffb15e;
            --panel: rgba(61, 24, 43, 0.78);
            --panel-border: rgba(255, 234, 187, 0.82);
            --cream: #fff4d8;
            --ink: #30111d;
            --tomato: #ff6b6b;
            --mint: #67e8b5;
            --cheese: #ffd76a;
            --hazard: #5a2534;
            --glow: rgba(255, 234, 187, 0.38);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 238, 176, 0.16), transparent 35%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 42%, var(--bg-bottom) 100%);
            color: var(--cream);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255,255,255,0.14) 0, transparent 16%),
                radial-gradient(circle at 82% 12%, rgba(255,214,122,0.24) 0, transparent 18%),
                radial-gradient(circle at 50% 100%, rgba(63,22,40,0.34) 0, transparent 36%);
            opacity: 0.9;
        }

        body::after {
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 56px),
                linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.08));
            mix-blend-mode: soft-light;
            opacity: 0.65;
        }

        body {
            position: fixed;
            inset: 0;
        }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            pointer-events: none;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 0.75rem;
            transition: opacity 300ms;
        }

        .glass {
            background: linear-gradient(180deg, rgba(92, 39, 63, 0.94), rgba(51, 18, 35, 0.9));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 10px 30px rgba(35, 10, 24, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                0 0 18px rgba(255, 211, 122, 0.15);
        }

        .hidden { display: none !important; }
        .interactive { pointer-events: auto; }

        .hud-chip {
            min-width: 8.8rem;
            color: var(--cream);
            text-shadow: 0 2px 0 rgba(0,0,0,0.18);
        }

        .hud-label {
            display: block;
            margin-bottom: 0.18rem;
            font-family: 'Bangers', Impact, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffe6a7;
        }

        .hud-value {
            font-size: 1.8rem;
            line-height: 1;
            font-weight: 600;
        }

        .hud-chip--danger .hud-value { color: #ff9d9d; }

        .chef-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 1rem;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(255, 242, 206, 0.12);
            border: 1px solid rgba(255, 237, 191, 0.28);
            color: #ffe5a0;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
        }

        .chef-emoji {
            font-size: 1.25rem;
            filter: drop-shadow(0 0 8px rgba(255, 224, 145, 0.4));
        }

        .arcade-title {
            font-family: 'Bangers', Impact, sans-serif;
            letter-spacing: 0.06em;
            line-height: 0.95;
            color: #fff5cf;
            text-transform: uppercase;
            text-shadow:
                0 3px 0 rgba(66, 20, 34, 0.7),
                0 0 18px rgba(255, 208, 124, 0.4);
        }

        .arcade-copy {
            color: rgba(255, 241, 220, 0.88);
            font-size: 1.05rem;
        }

        .restart-btn {
            background: linear-gradient(180deg, #ff9f5a, #ff6b6b);
            color: #fff8ef;
            box-shadow: 0 14px 24px rgba(123, 33, 44, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
        }

        .feedback-banner {
            position: absolute;
            left: 50%;
            bottom: 5.75rem;
            transform: translateX(-50%) translateY(1rem);
            width: min(72vw, 18rem);
            padding: 0.6rem 0.9rem;
            border-radius: 999px;
            text-align: center;
            font-family: 'Bangers', Impact, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff9ef;
            background: rgba(61, 24, 43, 0.82);
            border: 2px solid rgba(255, 234, 187, 0.55);
            box-shadow: 0 12px 28px rgba(35, 10, 24, 0.28);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .reaction-gif {
            position: absolute;
            z-index: 45;
            width: clamp(88px, 22vw, 152px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1.25rem;
            border: 2px solid rgba(255, 245, 216, 0.72);
            box-shadow: 0 16px 30px rgba(28, 7, 18, 0.4);
            background: rgba(45, 10, 25, 0.38);
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .reaction-gif.show {
            opacity: 0.95;
            transform: scale(1);
        }

        #combo-gif {
            right: 1rem;
            bottom: 6rem;
        }

        #danger-gif {
            left: 1rem;
            top: 5.8rem;
        }

        /* Shake Animation */
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        .shake-screen { animation: shake 0.5s; }

        @media (max-width: 640px) {
            #ui-layer { padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
            .hud-chip {
                min-width: 7rem;
                padding: 0.65rem 0.9rem;
            }
            .hud-label { font-size: 0.75rem; }
            .hud-value { font-size: 1.35rem; }
            #game-over-screen .glass {
                padding: 1.35rem;
                border-radius: 1.5rem;
            }
            .arcade-copy { font-size: 0.95rem; }
            .feedback-banner {
                bottom: 5rem;
                width: min(78vw, 16rem);
                font-size: 0.72rem;
            }
            .reaction-gif {
                width: clamp(74px, 24vw, 110px);
                border-radius: 1rem;
            }
            #combo-gif {
                right: 0.75rem;
                bottom: 7rem;
            }
            #danger-gif {
                left: 0.75rem;
                top: 5rem;
            }
        }
    </style>
</head>
<body>

<!-- Asset Declaration -->
<div id="assets" style="display: none;">
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_chop" data-editable="audio" data-label="Chop SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto" crossorigin="anonymous"></audio>
    <audio id="sfx_score" data-editable="audio" data-label="Score SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto" crossorigin="anonymous"></audio>
    <audio id="sfx_warning" data-editable="audio" data-label="Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto" crossorigin="anonymous"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Fail SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto" crossorigin="anonymous"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto" crossorigin="anonymous"></audio>
</div>

{
    "baseSpeed": { "type": "number", "label": "Fall Speed", "value": 4, "min": 2, "max": 10 },
    "spawnRate": { "type": "number", "label": "Spawn Rate (ms)", "value": 800, "min": 300, "max": 1500 },

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-6">
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full transition-opacity duration-300 gap-3">

            <div class="glass p-8 rounded-3xl text-center max-w-sm w-full transform scale-100 transition-transform" style="padding:2rem; border-radius:1.5rem; text-align:center; max-width:24rem; width:100%;">
                <div class="chef-badge mx-auto w-max">

<script>
/**
 * §0 System Invariants & Globals
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const dpr = window.devicePixelRatio || 1;

// Logical Dimensions (CSS Pixels)
let cw = 0, ch = 0;

// Game State
let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
let lastTime = 0;
let initialized = false;
let score = 0;
let lives = 3;
let entities = [];
let particles = [];
let spawnTimer = 0;
let difficultyMultiplier = 1;
let comboStreak = 0;
let feedbackTimer = null;
let reactionTimers = {};
const kitchenPalette = {
    food: [
        { shell: '#ff6b6b', fill: '#ffd2bd', accent: '#7f1f2d', garnish: '#fff3ca' },
        { shell: '#67e8b5', fill: '#dafbea', accent: '#165b44', garnish: '#fff7d6' },
        { shell: '#ffd76a', fill: '#fff1ae', accent: '#8a4a05', garnish: '#fff9df' }
    ],
    rotten: { shell: '#5a2534', fill: '#8b4e60', accent: '#220912', garnish: '#c1f76d' }
};

// Configuration
let gameConfig = {};
const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;

/**
 * §1 Audio System (Web Audio API - Zero DOM Overhead)
 */
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const audioBuffers = {};
const bgmEl = document.getElementById('bgm_main');
const sfxGainMap = {
    sfx_chop: 0.26,
    sfx_score: 0.22,
    sfx_warning: 0.18,
    sfx_fail: 0.22,
    sfx_ui: 0.2
};
const sfxCooldowns = {
    sfx_warning: 0,
    sfx_fail: 0,
    sfx_ui: 0
};
bgmEl.volume = 0.2;

// [agent-note][stage3] resolved-audio: action loop + chop/pickup/warning/fail/ui mapped from catalogs/audios.json with gesture-safe playback

async function initAudio() {
    if (!audioCtx) return;
    const sfxList = ['sfx_chop', 'sfx_score', 'sfx_warning', 'sfx_fail', 'sfx_ui'];
    await Promise.all(sfxList.map(async (id) => {
        const el = document.getElementById(id);
        if (el && el.src) {
            try {
                const response = await fetch(el.src);
                const arrayBuffer = await response.arrayBuffer();
                audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.warn(`Failed to load SFX ${id}, fallback enabled.`);
            }
        }
    }));
}

function unlockAudio() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (bgmEl.paused && (gameState === 'PLAYING' || gameState === 'INIT')) {
        bgmEl.play().catch(() => {});
    }
}

function setBgmForState(state) {
    if (state === 'PLAYING') {
        if (bgmEl.paused) {
            bgmEl.currentTime = 0;
            bgmEl.play().catch(() => {});
        }
    } else {
        bgmEl.pause();
        if (state === 'GAMEOVER') bgmEl.currentTime = 0;
    }
}

function playSfx(id) {
    if (!audioCtx || audioCtx.state === 'suspended') return;

    const now = performance.now();
    const cooldown = sfxCooldowns[id] || 0;
    if (cooldown && now - cooldown < 140) return;
    sfxCooldowns[id] = now;

    if (audioBuffers[id]) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = audioBuffers[id];
        gain.gain.value = sfxGainMap[id] ?? 0.22;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } else {
        synthesizeSfx(id);
    }
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'sfx_chop') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'sfx_warning' || type === 'sfx_fail') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(95, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

function showFeedback(message, tone = 'neutral') {
    const banner = document.getElementById('feedback-banner');
    banner.textContent = message;
    banner.style.borderColor = tone === 'danger'
        ? 'rgba(255, 157, 157, 0.72)'
        : tone === 'success'
            ? 'rgba(103, 232, 181, 0.72)'
            : 'rgba(255, 234, 187, 0.55)';
    banner.style.background = tone === 'danger'
        ? 'rgba(90, 37, 52, 0.9)'
        : tone === 'success'
            ? 'rgba(26, 73, 56, 0.88)'
            : 'rgba(61, 24, 43, 0.82)';
    banner.classList.add('show');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => banner.classList.remove('show'), 900);
}

function pulseReaction(id, duration = 1100) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    clearTimeout(reactionTimers[id]);
    reactionTimers[id] = setTimeout(() => el.classList.remove('show'), duration);
}

/**
 * §2 Entity System
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
        this.size = Math.random() * 6 + 3;
    }

    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // Gravity
        this.life -= this.decay;
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class Ingredient {
    constructor() {
        this.r = 35;
        this.x = Math.random() * (cw - this.r * 2) + this.r;
        this.y = -this.r * 2;
        this.type = Math.random() > 0.15 ? 'food' : 'rotten';
        
        // Visuals
        if (this.type === 'food') {
            this.style = kitchenPalette.food[Math.floor(Math.random() * kitchenPalette.food.length)];
        } else {
            this.style = kitchenPalette.rotten;
        }
        
        this.vy = gameConfig.baseSpeed * (1 + Math.random() * 0.5) * difficultyMultiplier;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.1;
        this.markedForDeletion = false;
        this.chopped = false;
    }

    update(dt) {
        this.y += this.vy * (dt * 60); // Normalize to 60fps
        this.rotation += this.rotSpeed;

        if (this.y > ch + this.r) {
            this.markedForDeletion = true;
            if (this.type === 'food' && !this.chopped) {
                loseLife();
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        // Shadow
        ctx.fillStyle = 'rgba(37, 9, 20, 0.22)';
        ctx.beginPath();
        ctx.ellipse(7, 8, this.r * 0.95, this.r * 0.78, 0, 0, Math.PI * 2);
        ctx.fill();

        // Outer character body
        ctx.fillStyle = this.style.shell;
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fill();

        // Inner body
        ctx.fillStyle = this.style.fill;
        ctx.beginPath();
        ctx.arc(0, 0, this.r * 0.72, 0, Math.PI * 2);
        ctx.fill();

        // Gloss
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.ellipse(-10, -12, this.r * 0.3, this.r * 0.18, -0.6, 0, Math.PI * 2);
        ctx.fill();

        // Face / cut marker
        ctx.strokeStyle = this.style.accent;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';

        if (this.type === 'food') {
            ctx.beginPath();
            ctx.arc(-10, -5, 3, 0, Math.PI * 2);
            ctx.arc(10, -5, 3, 0, Math.PI * 2);
            ctx.fillStyle = this.style.accent;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 7, 10, 0.15, Math.PI - 0.15);
            ctx.stroke();

            ctx.fillStyle = this.style.garnish;
            ctx.beginPath();
            ctx.moveTo(0, -this.r + 5);
            ctx.quadraticCurveTo(8, -this.r - 6, 14, -this.r + 2);
            ctx.quadraticCurveTo(4, -this.r + 1, 0, -this.r + 9);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.moveTo(-11, -10);
            ctx.lineTo(-3, -2);
            ctx.moveTo(-3, -10);
            ctx.lineTo(-11, -2);
            ctx.moveTo(3, -10);
            ctx.lineTo(11, -2);
            ctx.moveTo(11, -10);
            ctx.lineTo(3, -2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 10, 11, Math.PI + 0.2, -0.2);
            ctx.stroke();

            ctx.fillStyle = this.style.garnish;
            ctx.beginPath();
            ctx.arc(0, -this.r + 10, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    checkTap(tx, ty) {
        const dx = tx - this.x;
        const dy = ty - this.y;
        return (dx * dx + dy * dy) < (this.r * 1.5) ** 2; // Generous hit box
    }
}

/**
 * §3 Core Logic
 */
function initGame() {
    score = 0;
    lives = 3;
    comboStreak = 0;
    entities = [];
    particles = [];
    spawnTimer = 0;
    difficultyMultiplier = 1;
    updateHUD();
    showFeedback('Tap the fresh ingredients!', 'neutral');
    setState('PLAYING');
    initAudio(); // Preload SFX
}

function loseLife() {
    lives--;
    comboStreak = 0;
    updateHUD();
    playSfx(lives <= 1 ? 'sfx_warning' : 'sfx_fail');
    showFeedback(lives <= 1 ? 'Last chance on the line!' : 'Kitchen slip-up!', 'danger');
    pulseReaction('danger-gif', 1250);
    vibrate('heavy');
    document.body.classList.add('shake-screen');
    setTimeout(() => document.body.classList.remove('shake-screen'), 500);
    
    if (lives <= 0) {
        setState('GAMEOVER');
    }
}

function addScore(val) {
    score += val;
    comboStreak++;
    difficultyMultiplier = 1 + (score / 500); // Ramps up
    if (comboStreak >= 3) {
        showFeedback(`Hot streak x${comboStreak}!`, 'success');
        pulseReaction('combo-gif', 1100);
    } else {
        showFeedback('Order chopped clean!', 'success');
    }
    updateHUD();
}

function updateHUD() {
    document.getElementById('score-val').textContent = score;
    document.getElementById('lives-val').textContent = lives;
    document.getElementById('final-score').textContent = score;
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOverScreen = document.getElementById('game-over-screen');

    if (newState === 'PLAYING') {
        hud.classList.remove('opacity-0');
        gameOverScreen.classList.add('hidden');
        setBgmForState('PLAYING');
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('opacity-0');
        gameOverScreen.classList.remove('hidden');
        showFeedback('Rush ended — reset and cook again.', 'danger');
        pulseReaction('danger-gif', 1600);
        playSfx('sfx_fail');
        setBgmForState('GAMEOVER');
    }
}

function spawnParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

/**
 * §4 Game Loop
 */
function resize() {
    const rect = canvas.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
        initialized = true;
        initGame();
        requestAnimationFrame(loop);
    }
}

function update(dt) {
    // Spawning
    spawnTimer += dt * 1000;
    const currentSpawnRate = Math.max(300, gameConfig.spawnRate / difficultyMultiplier);
    if (spawnTimer > currentSpawnRate) {
        entities.push(new Ingredient());
        spawnTimer = 0;
    }

    // Update Entities
    entities.forEach(e => e.update(dt));
    entities = entities.filter(e => !e.markedForDeletion);

    // Update Particles
    particles.forEach(p => p.update(dt));
    particles = particles.filter(p => p.life > 0);
}

function draw() {
    // Clear & Background
    const grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, '#1f122a');
    grad.addColorStop(0.48, '#5d2b56');
    grad.addColorStop(1, '#ffb15e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    // Warm kitchen glow
    ctx.save();
    const marqueeGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.15, 20, cw * 0.5, ch * 0.15, cw * 0.45);
    marqueeGlow.addColorStop(0, 'rgba(255, 240, 184, 0.24)');
    marqueeGlow.addColorStop(1, 'rgba(255, 240, 184, 0)');
    ctx.fillStyle = marqueeGlow;
    ctx.fillRect(0, 0, cw, ch);

    // Prep line tiles
    ctx.strokeStyle = 'rgba(255, 245, 222, 0.08)';
    ctx.lineWidth = 2;
    const tileSize = 62;
    const offset = (Date.now() / 65) % tileSize;
    for (let x = 0; x < cw; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
        ctx.stroke();
    }
    for (let y = offset - tileSize; y < ch; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }

    // Hanging menu lights
    for (let i = 0; i < 5; i++) {
        const lx = ((i + 1) / 6) * cw;
        ctx.strokeStyle = 'rgba(87, 29, 46, 0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, 34);
        ctx.stroke();

        const bulbGlow = ctx.createRadialGradient(lx, 40, 1, lx, 40, 18);
        bulbGlow.addColorStop(0, 'rgba(255, 229, 148, 0.75)');
        bulbGlow.addColorStop(1, 'rgba(255, 229, 148, 0)');
        ctx.fillStyle = bulbGlow;
        ctx.beginPath();
        ctx.arc(lx, 40, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffe39a';
        ctx.beginPath();
        ctx.arc(lx, 40, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    // Service counter
    const counterY = ch - 70;
    const counterGrad = ctx.createLinearGradient(0, counterY, 0, ch);
    counterGrad.addColorStop(0, '#5c233f');
    counterGrad.addColorStop(1, '#2d0f20');
    ctx.fillStyle = counterGrad;
    ctx.fillRect(0, counterY, cw, ch - counterY);

    ctx.fillStyle = '#ffe0a4';
    ctx.fillRect(0, counterY, cw, 8);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let x = 30; x < cw; x += 90) {
        ctx.fillRect(x, counterY + 18, 42, 8);
    }
    ctx.restore();

    // Draw Game Objects
    entities.forEach(e => e.draw(ctx));
    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    try {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
        lastTime = timestamp;

        if (gameState === 'PLAYING') {
            update(dt);
        }
        draw();
        
        requestAnimationFrame(loop);
    } catch (e) {
        console.error("Loop Error:", e);
        // Recover
        lastTime = timestamp;
        requestAnimationFrame(loop);
    }
}

/**
 * §5 Input System
 */
function handleGlobalInput(e) {
    // L2 Audio Unlock
    unlockAudio();

    if (gameState === 'GAMEOVER') {
        return; 
    }

    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left;
        const ty = e.clientY - rect.top;
        
        // Check hits
        let hit = false;
        // Iterate backwards to hit top-most first
        for (let i = entities.length - 1; i >= 0; i--) {
            const ent = entities[i];
            if (ent.checkTap(tx, ty)) {
                hit = true;
                if (ent.type === 'food') {
                    // Success
                    ent.chopped = true;
                    playSfx('sfx_chop');
                    playSfx('sfx_score');
                    vibrate('light');
                    spawnParticles(ent.x, ent.y, ent.style.shell);
                    addScore(10);
                    ent.markedForDeletion = true;
                } else {
                    // Bad tap
                    playSfx('sfx_fail');
                    loseLife();
                    spawnParticles(ent.x, ent.y, '#2D3436', 20);
                    ent.markedForDeletion = true;
                }
                break; // One tap, one chop
            }
        }
        
        if (!hit) {
            // Miss feedback (small dust)
            playSfx('sfx_warning');
            comboStreak = 0;
            showFeedback('Missed the prep!', 'danger');
            pulseReaction('danger-gif', 900);
            spawnParticles(tx, ty, 'rgba(0,0,0,0.1)', 3);
        }
    }
}

// Lifecycle Init
window.addEventListener('DOMContentLoaded', () => {
    const ro = new ResizeObserver(() => {
        // Browser guarantees dimensions are valid here
        resize();
    });
    ro.observe(canvas);

    // Input Binding
    window.addEventListener('pointerdown', (e) => {
        if (e.target === canvas) e.preventDefault();
        handleGlobalInput(e);
    }, { passive: false });

    // Restart Button
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('sfx_ui');
        initGame();
    });
});

</script>
