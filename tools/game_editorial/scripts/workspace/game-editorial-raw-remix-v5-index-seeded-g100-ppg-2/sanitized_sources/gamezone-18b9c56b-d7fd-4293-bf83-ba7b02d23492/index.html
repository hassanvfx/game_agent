<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>SCRAP YARD '95</title>
    <link rel="stylesheet" href="assets/fonts.googleapis.com/css2-family_VT323_display_swap.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | title/buttons->Russo One, ui/body->VT323 to remove required non-catalog stack refs -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1620;
            --bg-glow: #122c3b;
            --grid-color: rgba(111, 214, 255, 0.14);
            --grid-color-strong: rgba(111, 214, 255, 0.22);
            --ui-bg: rgba(10, 20, 28, 0.88);
            --ui-bg-strong: rgba(17, 33, 44, 0.94);
            --ui-text: #f3fbff;
            --ui-subtle: #a6c5cf;
            --accent: #ff7a3d;
            --accent-2: #67e0ff;
            --accent-3: #ffe16b;
            --danger: #ff5566;
            --success: #5bdf8d;
            --btn-shadow: rgba(0, 0, 0, 0.4);
            --panel-border: rgba(103, 224, 255, 0.58);
            --steel-dark: #223944;
            --steel-mid: #466471;
            --steel-light: #89a9b6;
            --scrap-rust: #a1582f;
            --scrap-gold: #f3c93a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(103, 224, 255, 0.08), transparent 38%),
                linear-gradient(180deg, #10222e 0%, #091118 100%);
            font-family: 'VT323', monospace;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            color: var(--ui-text);
        }

        #game-stage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 122, 61, 0.14), transparent 28%),
                radial-gradient(circle at 50% 100%, rgba(103, 224, 255, 0.1), transparent 32%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(24, 43, 56, 0.98), rgba(10, 19, 27, 0.96));
            border: 2px solid var(--panel-border);
            padding: 18px 18px 16px;
            text-align: center;
            pointer-events: auto;
            width: min(88vw, 480px);
            max-width: 88vw;
            margin: auto;
            box-shadow:
                0 18px 36px rgba(0,0,0,0.42),
                inset 0 0 0 1px rgba(255,255,255,0.06),
                0 0 24px rgba(103, 224, 255, 0.12);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
        }

        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            inset: auto;
            pointer-events: none;
        }

        .panel::before {
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
        }

        .panel::after {
            width: 140px;
            height: 140px;
            right: -40px;
            top: -48px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 225, 107, 0.28), transparent 70%);
        }

        .title-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            margin-bottom: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--accent-3);
            font-family: 'Russo One', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(1.7rem, 6vw, 3rem);
            margin: 0 0 8px 0;
            color: var(--ui-text);
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 12px rgba(103, 224, 255, 0.18),
                0 3px 0 rgba(0, 0, 0, 0.35);
        }

        .headline-accent {
            color: var(--accent);
            display: block;
        }

        p {
            font-size: clamp(1rem, 3.8vw, 1.35rem);
            color: var(--ui-subtle);
            margin: 0 0 16px;
            line-height: 1.1;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .intro-copy {
            text-align: left;
            display: inline-block;
            max-width: 100%;
        }

        .intro-copy strong {
            color: var(--ui-text);
            font-weight: 700;
        }

        .btn {
            background: linear-gradient(180deg, #3fa8df, #2677a8);
            border: 1px solid rgba(255,255,255,0.16);
            color: white;
            font-family: 'Russo One', sans-serif;
            font-size: clamp(0.95rem, 3.6vw, 1.15rem);
            font-weight: 700;
            padding: 12px 18px;
            cursor: pointer;
            box-shadow:
                0 7px 0 rgba(8, 18, 28, 0.95),
                0 12px 20px rgba(0,0,0,0.24);
            border-radius: 14px;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.18s ease;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 5px;
            min-height: 48px;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        .btn:hover,
        .btn:focus-visible {
            filter: brightness(1.08);
            outline: none;
        }

        .btn:active {
            transform: translateY(7px);
            box-shadow: 0 0 0 rgba(8, 18, 28, 0.95);
        }

        .btn .btn-emoji {
            font-size: 1.1em;
            filter: saturate(1.1);
        }

        .btn.red {
            background: linear-gradient(180deg, #ff6f68, #d93d4f);
        }

        .btn.green {
            background: linear-gradient(180deg, #6ce58f, #22a85a);
        }

        #hud {
            /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            gap: 12px;
        }

        #hud button {
            pointer-events: auto;
            min-width: min(42vw, 140px);
            margin: 0;
        }

        .counter {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: 14px;
            font-family: 'VT323', monospace;
            font-size: clamp(0.9rem, 3.6vw, 1.1rem);
            color: var(--ui-text);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
            pointer-events: none;
            padding: 8px 12px;
            background: rgba(7, 14, 20, 0.72);
            border: 1px solid rgba(103, 224, 255, 0.35);
            border-radius: 999px;
            box-shadow:
                0 6px 16px rgba(0,0,0,0.24),
                inset 0 0 0 1px rgba(255,255,255,0.04);
            letter-spacing: 0.08em;
        }

        .counter::before {
            content: "⚙";
            margin-right: 8px;
            color: var(--accent-3);
        }

        .hidden { display: none !important; }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 12;
            overflow: hidden;
        }

        .gif-badge {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: min(42vw, 160px);
            max-width: min(56vw, 220px);
            padding: 8px 10px;
            border-radius: 14px;
            background: rgba(8, 16, 22, 0.82);
            border: 1px solid rgba(103, 224, 255, 0.34);
            box-shadow: 0 10px 18px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(14px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .gif-badge.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .gif-badge img {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 10px;
            flex: 0 0 auto;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.06);
        }

        .gif-badge span {
            font-size: clamp(0.45rem, 1.9vw, 0.65rem);
            line-height: 1.45;
            color: var(--ui-text);
            text-transform: uppercase;
        }

        #combo-badge {
            top: max(64px, calc(env(safe-area-inset-top) + 56px));
            right: 14px;
        }

        #chaos-badge {
            bottom: max(86px, calc(env(safe-area-inset-bottom) + 74px));
            right: 14px;
        }

        .panel-sparks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .panel-sparks span {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 10px rgba(103, 224, 255, 0.6);
            opacity: 0.3;
            animation: sparkFloat 2.2s ease-in-out infinite;
        }

        .panel-sparks span:nth-child(1) { left: 14%; top: 78%; animation-delay: 0s; }
        .panel-sparks span:nth-child(2) { left: 74%; top: 24%; animation-delay: 0.5s; }
        .panel-sparks span:nth-child(3) { left: 82%; top: 72%; animation-delay: 1s; }

        /* CRT Scanline overlay */
        .crt {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                linear-gradient(90deg, rgba(103, 224, 255, 0.03), rgba(255,255,255,0.01), rgba(255, 122, 61, 0.03));
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
            opacity: 0.7;
        }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; }
            50% { transform: translateY(-8px) scale(1.25); opacity: 0.7; }
        }

        @media (max-width: 600px) {
            .panel {
                padding: 16px 14px 14px;
                border-radius: 16px;
            }

            #hud {
                padding-inline: 12px;
            }

            .btn {
                padding: 11px 14px;
                min-height: 46px;
            }
        }
    </style>
</head>
<body>

<div id="game-stage">
    <canvas id="canvas"></canvas>
    <div class="crt"></div>

    <div id="ui-layer">
        <div id="feedback-layer" aria-live="polite">
            <!-- [agent-note][stage3] resolved-gif: combo/hit + reset/chaos overlays via catalogs/gifs.json -->
            <div id="combo-badge" class="gif-badge hidden" role="status">
                <img src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp" alt="Impact reaction" loading="lazy" decoding="async">
                <span>METAL CRUNCH!</span>
            </div>
            <div id="chaos-badge" class="gif-badge hidden" role="status">
                <img src="https://i.giphy.com/1iDaOCAjNLUjyUz9C3.webp" alt="Chaos reaction" loading="lazy" decoding="async">
                <span>LOT RESET RUMBLE</span>
            </div>
        </div>
        <div class="counter hidden" id="score-display">WRECKS: 0</div>

        <!-- Start Screen -->
        <div id="start-screen" class="panel">
            <div class="title-kicker">⚡ Scrap Storm Broadcast</div>
            <div class="panel-sparks" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <h1>SCRAP <span class="headline-accent">YARD '95</span></h1>
            <p class="intro-copy">
                <strong>WRECK LOT SIM v1.0</strong><br>
                Tune the magnet chaos.<br>
                <span style="color: var(--accent-2);">→</span> Spawn odd scrap<br>
                <span style="color: var(--accent-2);">→</span> Drag to crash<br>
                <span style="color: var(--accent-2);">→</span> Keep the lot loud
            </p>
            <button id="start-btn" class="btn green"><span class="btn-emoji">🔧</span> OPEN LOT</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <button id="reset-btn" class="btn red"><span class="btn-emoji">💥</span> CLEAR LOT</button>
            <button id="spawn-btn" class="btn"><span class="btn-emoji">📦</span> DROP SCRAP</button>
        </div>
    </div>
</div>

<script>
/**
 * JUNK CRASH '95
 * A physics playground with specific object interactions.
 */

// --- CONFIG & ASSETS ---
const CONFIG = {
    gravity: 0, // Top down view
    friction: 0.92,
    bounce: 0.6,
    spawnPadding: 50
};

const THEME = {
    bg: '#0b1620',
    bgGlow: '#173a4d',
    grid: 'rgba(111, 214, 255, 0.14)',
    gridStrong: 'rgba(111, 214, 255, 0.22)',
    lane: 'rgba(255, 255, 255, 0.025)',
    hazard: 'rgba(255, 122, 61, 0.11)',
    spark: '#67e0ff',
    warning: '#ff7a3d',
    steelDark: '#253d48',
    steelMid: '#5f7b88',
    steelLight: '#a3bec8',
    gold: '#f3c93a',
    rust: '#99532b',
    ink: '#071017'
};

// Item Definitions
const ITEMS = {
    DOOR: { w: 40, h: 70, color: '#7b5137', label: 'DOOR' },
    BUS: { w: 50, h: 90, color: '#f3c93a', label: 'BUS' },
    WOOD: { w: 20, h: 60, color: '#6e4127', label: 'LOG' },
    BALL: { w: 36, h: 36, color: '#da6e2e', label: 'BALL', shape: 'circle' },
    MILK: { w: 30, h: 40, color: '#f1f8ff', label: 'MILK' },
    PENCIL: { w: 10, h: 60, color: '#f1c93a', label: 'PEN' }
};

const ITEM_KEYS = Object.keys(ITEMS);

// --- AUDIO SYSTEM ---
const AUDIO_MAP = {
    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3',
    spawn: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_02.mp3',
    drag: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
    collision: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3',
    milkCollision: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',
    reset: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3',
    bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
};

const Sfx = {
    ctx: null,
    unlocked: false,
    sounds: {},
    bgm: null,
    bgmFailed: false,
    useSynthOnly: ['127.0.0.1', 'localhost'].includes(window.location.hostname),
    lastPlayed: {},
    init: function() {
        if (this.unlocked) {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.startLoop();
            return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            try {
                this.ctx = new AudioContext();
            } catch (err) {
                this.ctx = null;
            }
        }

        if (!this.useSynthOnly) {
            Object.entries(AUDIO_MAP).forEach(([key, url]) => {
                const audio = new Audio(url);
                audio.preload = key === 'bgm' ? 'auto' : 'none';
                audio.crossOrigin = 'anonymous';
                audio.addEventListener('error', () => {
                    if (key === 'bgm') {
                        this.bgmFailed = true;
                        this.bgm = null;
                    } else if (this.sounds[key] === audio) {
                        delete this.sounds[key];
                    }
                });
                if (key === 'bgm') {
                    audio.loop = true;
                    audio.volume = 0.2;
                    this.bgm = audio;
                } else {
                    audio.volume = key === 'drag' ? 0.18 : 0.36;
                    this.sounds[key] = audio;
                }
            });
        }

        this.unlocked = true;
        this.startLoop();
    },
    ensureReady: function() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    },
    play: function(name, cooldown = 0) {
        if (!this.unlocked) return;
        const now = performance.now();
        if (cooldown && this.lastPlayed[name] && now - this.lastPlayed[name] < cooldown) return;
        this.lastPlayed[name] = now;
        const base = this.sounds[name];
        if (!base) {
            this.playSynth(name);
            return;
        }
        try {
            const clip = base.cloneNode();
            clip.volume = base.volume;
            clip.play().catch(() => this.playSynth(name));
        } catch (err) {
            this.playSynth(name);
        }
    },
    playSynth: function(name) {
        if (!this.ctx) return;
        this.ensureReady();
        const presets = {
            start: { type: 'triangle', freq: 440, endFreq: 660, gain: 0.06, duration: 0.18 },
            spawn: { type: 'square', freq: 310, endFreq: 420, gain: 0.045, duration: 0.08 },
            drag: { type: 'square', freq: 220, endFreq: 180, gain: 0.03, duration: 0.05 },
            collision: { type: 'sawtooth', freq: 160, endFreq: 70, gain: 0.05, duration: 0.12 },
            milkCollision: { type: 'triangle', freq: 520, endFreq: 260, gain: 0.04, duration: 0.1 },
            reset: { type: 'sine', freq: 200, endFreq: 110, gain: 0.05, duration: 0.16 }
        };
        const preset = presets[name];
        if (!preset) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = preset.type;
        osc.frequency.setValueAtTime(preset.freq, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, preset.endFreq), t + preset.duration);
        gain.gain.setValueAtTime(preset.gain, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + preset.duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + preset.duration);
    },
    startLoop: function() {
        if (!this.bgm || this.bgmFailed) return;
        this.ensureReady();
        this.bgm.currentTime = 0;
        this.bgm.play().catch(() => {
            this.bgmFailed = true;
            this.bgm = null;
        });
    },
    stopLoop: function() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    },
    playCrash: function(isMilk) {
        this.play(isMilk ? 'milkCollision' : 'collision', 140);
        if (!this.ctx) return;
        this.ensureReady();
        const t = this.ctx.currentTime;
        const gain = this.ctx.createGain();
        const bufferSize = this.ctx.sampleRate * (isMilk ? 0.22 : 0.18);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = isMilk ? 'lowpass' : 'bandpass';
        filter.frequency.value = isMilk ? 520 : 980;
        gain.gain.setValueAtTime(isMilk ? 0.09 : 0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + (isMilk ? 0.22 : 0.18));
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
        noise.stop(t + (isMilk ? 0.22 : 0.18));
    },
    playSpawn: function() {
        this.play('spawn', 90);
    },
    playDrag: function() {
        this.play('drag', 70);
    },
    playStart: function() {
        this.play('start', 0);
    },
    playReset: function() {
        this.play('reset', 0);
    }
};

const Feedback = {
    comboEl: null,
    chaosEl: null,
    timers: {},
    init() {
        this.comboEl = document.getElementById('combo-badge');
        this.chaosEl = document.getElementById('chaos-badge');
    },
    flash(type, label) {
        const el = type === 'chaos' ? this.chaosEl : this.comboEl;
        if (!el) return;
        const text = el.querySelector('span');
        if (text && label) text.textContent = label;
        el.classList.remove('hidden');
        requestAnimationFrame(() => el.classList.add('visible'));
        clearTimeout(this.timers[type]);
        this.timers[type] = setTimeout(() => {
            el.classList.remove('visible');
            setTimeout(() => el.classList.add('hidden'), 220);
        }, type === 'chaos' ? 1400 : 950);
    }
};

// --- ENGINE ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

let entities = [];
let particles = [];
let running = false;
let activeDrag = null;
let dragOffset = {x:0, y:0};
let collisionBurstCount = 0;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    ctx.imageRendering = 'pixelated';
}
window.addEventListener('resize', resize);
resize();

// --- DRAW HELPERS ---
function roundRectPath(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
}

function fillRoundRect(x, y, w, h, r, color) {
    roundRectPath(x, y, w, h, r);
    ctx.fillStyle = color;
    ctx.fill();
}

function strokeRoundRect(x, y, w, h, r, color, lineWidth = 2) {
    roundRectPath(x, y, w, h, r);
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = color;
    ctx.stroke();
}

function drawBolt(x, y, scale, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.moveTo(-4, -12);
    ctx.lineTo(3, -12);
    ctx.lineTo(-1, -1);
    ctx.lineTo(6, -1);
    ctx.lineTo(-6, 12);
    ctx.lineTo(-2, 2);
    ctx.lineTo(-8, 2);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
}

function drawScrapFace(widthUnit, yOffset = 0) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(7, 16, 23, 0.7)';
    ctx.fillRect(-widthUnit / 4 - 5, -5 + yOffset, 4, 4);
    ctx.fillRect(widthUnit / 4 + 1, -5 + yOffset, 4, 4);
    ctx.fillRect(-4, 3 + yOffset, 8, 2);
    ctx.restore();
}

// --- CLASSES ---
class Entity {
    constructor(x, y, typeKey) {
        this.x = x;
        this.y = y;
        this.type = typeKey;
        this.def = ITEMS[typeKey];
        this.w = this.def.w;
        this.h = this.def.h;
        this.angle = (Math.random() * 0.5 - 0.25); // slight random rotation
        this.vx = 0;
        this.vy = 0;
        this.isDragging = false;
    }

    update() {
        if (this.isDragging) return;

        this.x += this.vx;
        this.y += this.vy;
        this.vx *= CONFIG.friction;
        this.vy *= CONFIG.friction;

        // Bounds
        if (this.x < 0) { this.x = 0; this.vx *= -CONFIG.bounce; }
        if (this.x > width) { this.x = width; this.vx *= -CONFIG.bounce; }
        if (this.y < 0) { this.y = 0; this.vy *= -CONFIG.bounce; }
        if (this.y > height) { this.y = height; this.vy *= -CONFIG.bounce; }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        const isDragging = this.isDragging;
        const bodyGlow = isDragging ? 18 : 10;
        const accentGlow = isDragging ? 'rgba(255, 225, 107, 0.42)' : 'rgba(103, 224, 255, 0.14)';

        ctx.shadowColor = accentGlow;
        ctx.shadowBlur = bodyGlow;

        // Shadow
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0,0,0,0.34)';
        if (this.def.shape === 'circle') {
            ctx.beginPath();
            ctx.ellipse(5, 6, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            fillRoundRect(-this.w / 2 + 4, -this.h / 2 + 5, this.w, this.h, 7, 'rgba(0,0,0,0.3)');
        }

        ctx.shadowColor = accentGlow;
        ctx.shadowBlur = bodyGlow;

        // Body
        if (this.def.shape === 'circle') {
            const ballGradient = ctx.createRadialGradient(-6, -8, 2, 0, 0, this.w / 2);
            ballGradient.addColorStop(0, '#ffb06a');
            ballGradient.addColorStop(0.55, this.def.color);
            ballGradient.addColorStop(1, '#7e3110');
            ctx.fillStyle = ballGradient;
            ctx.beginPath();
            ctx.arc(0, 0, this.w / 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(38, 15, 6, 0.78)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-this.w/2 + 2, 0); ctx.lineTo(this.w/2 - 2, 0);
            ctx.moveTo(0, -this.w/2 + 2); ctx.lineTo(0, this.w/2 - 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, this.w / 2 - 6, -0.9, 0.9);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, this.w / 2 - 6, Math.PI - 0.9, Math.PI + 0.9);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.arc(-6, -7, 6, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.type === 'BUS') {
            const busGradient = ctx.createLinearGradient(0, -this.h / 2, 0, this.h / 2);
            busGradient.addColorStop(0, '#ffe27a');
            busGradient.addColorStop(0.7, this.def.color);
            busGradient.addColorStop(1, '#b77f16');
            fillRoundRect(-this.w / 2, -this.h / 2, this.w, this.h, 9, busGradient);
            strokeRoundRect(-this.w / 2, -this.h / 2, this.w, this.h, 9, 'rgba(40, 25, 8, 0.58)', 2);

            fillRoundRect(-this.w / 2 + 5, -this.h / 2 + 10, this.w - 10, 18, 4, '#95ecff');
            fillRoundRect(-this.w / 2 + 5, -this.h / 2 + 35, this.w - 10, 18, 4, '#78c4e0');
            fillRoundRect(-this.w / 2 + 6, this.h / 2 - 17, this.w - 12, 8, 4, '#243640');

            ctx.fillStyle = '#ff6d5d';
            fillRoundRect(-this.w / 2 + 5, this.h / 2 - 8, 10, 4, 2, '#ff6d5d');
            fillRoundRect(this.w / 2 - 15, this.h / 2 - 8, 10, 4, 2, '#ff6d5d');
            drawScrapFace(this.w, -8);
        } else if (this.type === 'DOOR') {
            const doorGradient = ctx.createLinearGradient(-this.w / 2, 0, this.w / 2, 0);
            doorGradient.addColorStop(0, '#8b5a3d');
            doorGradient.addColorStop(0.5, this.def.color);
            doorGradient.addColorStop(1, '#5d3524');
            fillRoundRect(-this.w / 2, -this.h / 2, this.w, this.h, 7, doorGradient);
            strokeRoundRect(-this.w / 2, -this.h / 2, this.w, this.h, 7, 'rgba(38, 18, 10, 0.6)', 2);
            fillRoundRect(-this.w / 2 + 6, -this.h / 2 + 7, this.w - 12, this.h - 14, 5, 'rgba(61, 28, 18, 0.42)');
            fillRoundRect(-this.w / 2 + 10, -this.h / 2 + 12, this.w - 20, this.h - 24, 4, 'rgba(153, 99, 72, 0.25)');
            ctx.fillStyle = THEME.gold;
            ctx.beginPath();
            ctx.arc(this.w / 4, 2, 4, 0, Math.PI * 2);
            ctx.fill();
            drawScrapFace(this.w - 6, -14);
        } else if (this.type === 'MILK') {
            const cartonGradient = ctx.createLinearGradient(0, -this.h / 2, 0, this.h / 2);
            cartonGradient.addColorStop(0, '#ffffff');
            cartonGradient.addColorStop(0.65, '#e7f3ff');
            cartonGradient.addColorStop(1, '#b4cee1');
            fillRoundRect(-this.w / 2, -this.h / 2 + 2, this.w, this.h - 2, 6, cartonGradient);
            strokeRoundRect(-this.w / 2, -this.h / 2 + 2, this.w, this.h - 2, 6, 'rgba(54, 95, 121, 0.35)', 2);

            ctx.fillStyle = '#4ca7d8';
            fillRoundRect(-this.w / 2 + 2, -4, this.w - 4, 12, 4, '#4ca7d8');

            ctx.fillStyle = '#cfdee7';
            ctx.beginPath();
            ctx.moveTo(-this.w/2 + 1, -this.h/2 + 2);
            ctx.lineTo(0, -this.h/2 - 5);
            ctx.lineTo(this.w/2 - 1, -this.h/2 + 2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = '400 16px "VT323"';
            ctx.textAlign = 'center';
            ctx.fillText('MOO', 0, 4);
        } else if (this.type === 'PENCIL') {
            const pencilGradient = ctx.createLinearGradient(0, -this.h / 2, 0, this.h / 2);
            pencilGradient.addColorStop(0, '#ffe16b');
            pencilGradient.addColorStop(0.7, this.def.color);
            pencilGradient.addColorStop(1, '#b59524');
            fillRoundRect(-this.w / 2, -this.h / 2, this.w, this.h - 10, 4, pencilGradient);
            fillRoundRect(-this.w / 2, -this.h / 2, this.w, 10, 3, '#f36aa0');

            ctx.fillStyle = '#d5b191';
            ctx.beginPath();
            ctx.moveTo(-this.w/2, this.h/2 - 10);
            ctx.lineTo(this.w/2, this.h/2 - 10);
            ctx.lineTo(0, this.h/2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#14222e';
            ctx.beginPath();
            ctx.moveTo(-2, this.h/2 - 5);
            ctx.lineTo(2, this.h/2 - 5);
            ctx.lineTo(0, this.h/2);
            ctx.closePath();
            ctx.fill();
        } else if (this.type === 'WOOD') {
            const woodGradient = ctx.createLinearGradient(-this.w / 2, 0, this.w / 2, 0);
            woodGradient.addColorStop(0, '#8a5937');
            woodGradient.addColorStop(0.5, this.def.color);
            woodGradient.addColorStop(1, '#5b311f');
            fillRoundRect(-this.w / 2, -this.h / 2, this.w, this.h, 6, woodGradient);
            strokeRoundRect(-this.w / 2, -this.h / 2, this.w, this.h, 6, 'rgba(50, 24, 15, 0.5)', 2);
            fillRoundRect(-2, -this.h / 2 + 5, 4, this.h - 10, 2, 'rgba(48, 20, 11, 0.45)');
            fillRoundRect(-this.w / 2 + 4, -this.h / 2 + 8, this.w - 8, 3, 2, 'rgba(235, 185, 132, 0.14)');
        }

        // Highlight / trim
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        if (this.def.shape !== 'circle') {
            fillRoundRect(-this.w/2 + 2, -this.h/2 + 2, this.w - 4, 4, 2, 'rgba(255,255,255,0.14)');
        }

        if (this.isDragging) {
            ctx.strokeStyle = 'rgba(255, 225, 107, 0.7)';
            ctx.lineWidth = 2;
            if (this.def.shape === 'circle') {
                ctx.beginPath();
                ctx.arc(0, 0, this.w / 2 + 4, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                strokeRoundRect(-this.w / 2 - 3, -this.h / 2 - 3, this.w + 6, this.h + 6, 10, 'rgba(255, 225, 107, 0.7)', 2);
            }
        }

        ctx.restore();
    }

    getBounds() {
        return {
            x: this.x,
            y: this.y,
            r: Math.max(this.w, this.h) / 2 // Rough circle for collision
        };
    }
}

class Particle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.life = 1.0;
        this.type = type; // 'fire' or 'milk'

        const speed = Math.random() * 5 + 2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        if (type === 'MILK') {
            this.size = Math.random() * 6 + 2;
            this.color = '#ffffff';
            this.drag = 0.96; // Liquid moves differently
        } else {
            this.size = Math.random() * 8 + 4;
            this.color = `hsl(${Math.random()*35 + 20}, 100%, 58%)`; // Fire colors
            this.drag = 0.9;
        }
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= this.drag;
        this.vy *= this.drag;
        this.life -= 0.02;
        this.size *= 0.95;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.shadowColor = this.type === 'MILK' ? 'rgba(255,255,255,0.55)' : 'rgba(255,122,61,0.48)';
        ctx.shadowBlur = 10;
        fillRoundRect(this.x, this.y, this.size, this.size, 2, this.color);
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
    }
}

// --- GAME LOGIC ---

function spawnItem() {
    const key = ITEM_KEYS[Math.floor(Math.random() * ITEM_KEYS.length)];
    const pad = CONFIG.spawnPadding;
    const x = pad + Math.random() * (width - pad*2);
    const y = pad + Math.random() * (height - pad*2);
    entities.push(new Entity(x, y, key));
    Sfx.playSpawn();
    updateUI();
}

function explode(entity) {
    const count = entity.type === 'MILK' ? 40 : 15;
    const pType = entity.type === 'MILK' ? 'MILK' : 'FIRE';

    for(let i=0; i<count; i++) {
        particles.push(new Particle(entity.x, entity.y, pType));
    }

    Sfx.playCrash(entity.type === 'MILK');
    collisionBurstCount += 1;
}

function checkCollisions() {
    const toRemove = new Set();

    for (let i = 0; i < entities.length; i++) {
        for (let j = i + 1; j < entities.length; j++) {
            const a = entities[i];
            const b = entities[j];

            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            // Simple radius check
            const minDist = (Math.min(a.w, a.h) + Math.min(b.w, b.h)) / 1.5;

            if (dist < minDist) {
                toRemove.add(i);
                toRemove.add(j);
            }
        }
    }

    if (toRemove.size > 0) {
        collisionBurstCount = 0;
        // Convert to array and sort desc to splice correctly
        const sorted = Array.from(toRemove).sort((a,b) => b-a);
        sorted.forEach(idx => {
            const ent = entities[idx];
            explode(ent);
            if (ent === activeDrag) activeDrag = null;
            entities.splice(idx, 1);
        });
        if (collisionBurstCount >= 2) {
            Feedback.flash('combo', collisionBurstCount >= 4 ? 'SCRAP STORM x' + collisionBurstCount : 'METAL CRUNCH x' + collisionBurstCount);
        }
        updateUI();
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = `WRECKS: ${entities.length}`;
}

function drawBackground() {
    const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
    bgGradient.addColorStop(0, '#112737');
    bgGradient.addColorStop(1, THEME.bg);
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, width, height);

    const glowGradient = ctx.createRadialGradient(width * 0.5, height * 0.15, 20, width * 0.5, height * 0.15, width * 0.7);
    glowGradient.addColorStop(0, 'rgba(103,224,255,0.12)');
    glowGradient.addColorStop(0.3, 'rgba(103,224,255,0.05)');
    glowGradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGradient;
    ctx.fillRect(0, 0, width, height);

    const hazardGradient = ctx.createRadialGradient(width * 0.75, height * 0.8, 20, width * 0.75, height * 0.8, width * 0.45);
    hazardGradient.addColorStop(0, 'rgba(255,122,61,0.08)');
    hazardGradient.addColorStop(1, 'rgba(255,122,61,0)');
    ctx.fillStyle = hazardGradient;
    ctx.fillRect(0, 0, width, height);

    // Bay stripes
    ctx.fillStyle = THEME.lane;
    for (let x = -40; x < width + height; x += 140) {
        ctx.save();
        ctx.translate(x, 0);
        ctx.rotate(-0.42);
        ctx.fillRect(0, 0, 18, height * 1.6);
        ctx.restore();
    }

    // Grid
    ctx.strokeStyle = THEME.grid;
    ctx.lineWidth = 1;
    const step = Math.max(54, Math.min(76, width / 8));
    ctx.beginPath();
    for(let x = 0; x < width; x += step) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
    for(let y = 0; y < height; y += step) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
    ctx.stroke();

    ctx.strokeStyle = THEME.gridStrong;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x = 0; x < width; x += step * 3) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
    for(let y = 0; y < height; y += step * 3) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
    ctx.stroke();

    // Neon rails
    ctx.fillStyle = 'rgba(103,224,255,0.12)';
    ctx.fillRect(0, 0, width, 6);
    ctx.fillRect(0, height - 6, width, 6);

    // Decorative hazard bolts
    for (let i = 0; i < 3; i++) {
        drawBolt(36 + i * 26, 34, 0.5, 'rgba(255, 225, 107, 0.6)');
        drawBolt(width - 36 - i * 26, height - 34, 0.5, 'rgba(255, 122, 61, 0.5)');
    }
}

function loop() {
    if (!running) return;

    drawBackground();

    // Update Entities
    entities.forEach(e => e.update());
    checkCollisions();

    // Draw Entities (sorted by Y for pseudo-depth)
    entities.sort((a,b) => a.y - b.y);
    entities.forEach(e => e.draw());

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    requestAnimationFrame(loop);
}

// --- INPUT ---
function getPos(e) {
    return e.touches ?
        { x: e.touches[0].clientX, y: e.touches[0].clientY } :
        { x: e.clientX, y: e.clientY };
}

function onStart(e) {
    if (!running) return;
    const p = getPos(e);

    // Check hit (reverse order for top-most)
    for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        const dx = p.x - ent.x;
        const dy = p.y - ent.y;
        if (Math.abs(dx) < ent.w && Math.abs(dy) < ent.h) {
            activeDrag = ent;
            ent.isDragging = true;
            dragOffset.x = dx;
            dragOffset.y = dy;
            // Bring to front
            entities.splice(i, 1);
            entities.push(ent);
            Sfx.playDrag();
            break;
        }
    }
}

function onMove(e) {
    if (!activeDrag) return;
    const p = getPos(e);
    activeDrag.x = p.x - dragOffset.x;
    activeDrag.y = p.y - dragOffset.y;

    // Add velocity based on drag for "throwing" effect
    activeDrag.vx = (p.x - dragOffset.x - activeDrag.x) * 0.2;
    activeDrag.vy = (p.y - dragOffset.y - activeDrag.y) * 0.2;
}

function onEnd() {
    if (activeDrag) {
        activeDrag.isDragging = false;
        activeDrag = null;
    }
}

// Event Listeners
canvas.addEventListener('mousedown', onStart);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);

canvas.style.touchAction = 'none';
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(e); }, {passive:false});
window.addEventListener('touchmove', (e) => {
    if (!activeDrag) return;
    e.preventDefault();
    onMove(e);
}, {passive:false});
window.addEventListener('touchend', onEnd);
window.addEventListener('touchcancel', onEnd);

// UI Buttons
Feedback.init();

function bootGame() {
    Sfx.init();
    Sfx.playStart();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('score-display').classList.remove('hidden');
    running = true;

    // Initial Spawn
    for(let i=0; i<3; i++) spawnItem();
    loop();
}

document.getElementById('start-btn').addEventListener('click', bootGame);

document.getElementById('spawn-btn').addEventListener('click', () => {
    spawnItem();
    if (entities.length >= 8) {
        Feedback.flash('combo', 'YARD JAMMED');
    }
});

document.getElementById('reset-btn').addEventListener('click', () => {
    if (!entities.length) {
        Feedback.flash('chaos', 'LOT ALREADY CLEAR');
        Sfx.playReset();
        return;
    }
    Feedback.flash('chaos', 'LOT RESET RUMBLE');
    Sfx.playReset();
    entities.forEach(e => explode(e));
    entities = [];
    updateUI();
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        Sfx.stopLoop();
    } else if (running) {
        Sfx.startLoop();
    }
});

</script>
