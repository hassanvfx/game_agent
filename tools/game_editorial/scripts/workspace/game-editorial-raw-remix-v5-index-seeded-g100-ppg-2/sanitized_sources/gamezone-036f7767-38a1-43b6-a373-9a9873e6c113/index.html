<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Narrow Hallway</title>
    <!-- [agent-note][stage4] preserved-font-map: title=Creepster ui=Orbitron from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06070d;
            --bg-deep: #03040a;
            --panel: rgba(12, 18, 26, 0.82);
            --panel-border: rgba(90, 240, 255, 0.28);
            --panel-shadow: rgba(0, 0, 0, 0.48);
            --text: #eef7ff;
            --text-soft: #8ca8b6;
            --cyan: #7ff6ff;
            --cyan-strong: #37dcff;
            --amber: #ffcd6b;
            --danger: #ff4d6d;
            --danger-deep: #7c1025;
            --success: #7dff9c;
            --hall-line: #1e3546;
            --hall-glow: rgba(76, 220, 255, 0.3);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(32, 73, 102, 0.24), transparent 32%),
                linear-gradient(180deg, #071018 0%, #04060c 48%, #010204 100%);
            color: var(--text);
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.03em;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 50%, rgba(127, 246, 255, 0.08), transparent 34%),
                linear-gradient(90deg, transparent 0%, rgba(127, 246, 255, 0.03) 50%, transparent 100%);
            z-index: 0;
        }

        canvas { display: block; touch-action: none; }

        .hidden { display: none !important; }

        .glass {
            background:
                linear-gradient(180deg, rgba(11, 19, 30, 0.94), rgba(6, 11, 18, 0.9)),
                rgba(12, 18, 26, 0.82);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            color: var(--text);
            box-shadow:
                0 18px 40px var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 24px rgba(55, 220, 255, 0.08);
        }

        .scanline {
            width: 100%;
            height: 120px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(127, 246, 255, 0.06) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.16;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -120px; } }

        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='assets/www.w3.org/2000/svg.html'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .animate-pulse-fast { animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .34; } }

        #vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            background: radial-gradient(circle, transparent 50%, #000 150%);
            transition: background 0.3s ease;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            background:
                radial-gradient(circle at center, rgba(14, 24, 38, 0.78), rgba(3, 5, 10, 0.98) 66%),
                linear-gradient(180deg, #09101a, #020307);
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(127, 246, 255, 0.05), transparent 22%, transparent 78%, rgba(255, 77, 109, 0.07)),
                repeating-linear-gradient(
                    90deg,
                    rgba(127, 246, 255, 0.05) 0,
                    rgba(127, 246, 255, 0.05) 1px,
                    transparent 1px,
                    transparent 64px
                );
            opacity: 0.35;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        #start-screen,
        #game-over-screen,
        #victory-screen {
            width: min(100%, 25rem);
            pointer-events: auto;
            border-radius: 18px;
            padding: 24px 20px;
            text-align: center;
        }

        #start-screen {
            box-shadow:
                0 18px 42px rgba(0, 0, 0, 0.52),
                0 0 0 1px rgba(127, 246, 255, 0.08),
                0 0 32px rgba(55, 220, 255, 0.12);
        }

        .screen-title {
            margin: 0 0 8px;
            font-family: 'Creepster', fantasy;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            line-height: 1.05;
            text-shadow: 0 0 18px rgba(127, 246, 255, 0.28);
        }

        #ui-title {
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            color: var(--cyan);
        }

        .subtitle {
            margin: 0 0 20px;
            color: var(--text-soft);
            font-size: 0.85rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
        }

        .briefing {
            margin: 0 0 20px;
            padding: 12px 0 12px 14px;
            border-left: 2px solid rgba(255, 205, 107, 0.55);
            text-align: left;
            display: grid;
            gap: 8px;
            color: #dce8f0;
            font-size: 1rem;
            background: linear-gradient(90deg, rgba(255, 205, 107, 0.06), transparent);
        }

        .briefing p {
            margin: 0;
            line-height: 1.15;
        }

        .warning {
            color: #ff6f87;
        }

        .arcade-btn {
            width: 100%;
            border: 1px solid rgba(127, 246, 255, 0.35);
            border-radius: 14px;
            padding: 14px 16px;
            background: linear-gradient(180deg, rgba(19, 55, 78, 0.95), rgba(9, 25, 38, 0.95));
            color: var(--text);
            font: 700 0.96rem/1 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, border-color 160ms ease;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            transform: translateY(-1px);
            background: linear-gradient(180deg, rgba(26, 72, 101, 0.98), rgba(11, 34, 50, 0.98));
            border-color: rgba(127, 246, 255, 0.58);
            box-shadow: 0 0 20px rgba(55, 220, 255, 0.14), 0 10px 24px rgba(0, 0, 0, 0.34);
            outline: none;
        }

        .arcade-btn:active {
            transform: scale(0.98);
        }

        .result-title {
            margin: 0 0 8px;
            font-family: 'Creepster', fantasy;
            font-size: clamp(2rem, 8vw, 2.8rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .result-title.danger {
            color: #ff6f87;
            text-shadow: 0 0 22px rgba(255, 77, 109, 0.22);
        }

        .result-title.success {
            color: var(--success);
            text-shadow: 0 0 22px rgba(125, 255, 156, 0.22);
        }

        .result-copy {
            margin: 0 0 20px;
            color: var(--text-soft);
            font-size: 0.98rem;
            letter-spacing: 0.06em;
        }

        .result-score {
            margin: 0 0 20px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 1.2rem;
            color: #fff6d6;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
        }

        .hud-card {
            display: inline-block;
            min-width: 132px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(127, 246, 255, 0.26);
            background: linear-gradient(180deg, rgba(7, 14, 24, 0.84), rgba(3, 6, 12, 0.84));
            color: var(--text-soft);
            font: 700 0.76rem/1 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
        }

        #score {
            color: var(--amber);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        #feedback-overlay {
            position: absolute;
            right: 16px;
            bottom: 16px;
            z-index: 55;
            width: min(34vw, 140px);
            pointer-events: none;
            display: grid;
            place-items: end;
        }

        .feedback-gif {
            width: 100%;
            border-radius: 14px;
            border: 1px solid rgba(127, 246, 255, 0.35);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
            opacity: 0.92;
            background: rgba(4, 8, 14, 0.8);
        }

        .feedback-gif.success {
            border-color: rgba(125, 255, 156, 0.4);
        }

        #status-indicator {
            margin-top: 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.76rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #ff6f87;
            text-shadow: 0 0 12px rgba(255, 77, 109, 0.34);
        }

        @media (max-width: 640px) {
            #ui-layer { padding: 12px; }
            #start-screen,
            #game-over-screen,
            #victory-screen {
                width: min(100%, 22rem);
                padding: 20px 16px;
            }
            .subtitle {
                margin-bottom: 16px;
                font-size: 0.75rem;
                letter-spacing: 0.26em;
            }
            .briefing {
                margin-bottom: 16px;
                padding-left: 12px;
                font-size: 0.94rem;
            }
            .arcade-btn {
                padding: 13px 14px;
                font-size: 0.96rem;
            }
            #hud { top: 14px; }
            .hud-card {
                padding: 8px 12px;
                font-size: 0.76rem;
            }
            #status-indicator {
                font-size: 0.68rem;
                padding: 0 12px;
            }
            #feedback-overlay {
                right: 10px;
                bottom: 10px;
                width: min(36vw, 112px);
            }
        }
    </style>
</head>
<body>

    </script>

    <!-- Assets -->
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/warning/win/fail/progress -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Ambience" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_02.mp3" preload="auto" loop></audio>

    <audio id="sfx_progress" data-editable="audio" data-label="Progress SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>

    <audio id="sfx_die" data-editable="audio" data-label="Death SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>

    <!-- UI Structure -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="vignette"></div>
        <div class="scanline"></div>
        <div class="grain"></div>

        <div id="ui-layer">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass">

    <script>
        // --- §3 Configuration & State ---
        window.gameConfigDefs = {
            difficulty: { type: "number", label: "Entity Aggression", value: 5, min: 1, max: 10 },
            playerSpeed: { type: "number", label: "Run Speed", value: 15, min: 5, "max": 30 },
            gameTitle: { type: "text", label: "Game Title", value: "The Narrow Hallway" }
        };
        window.gameConfig = {
            difficulty: 5,
            playerSpeed: 15,
            gameTitle: "The Narrow Hallway"
        };

        window.updateGameConfig = (key, val) => {
            if (window.gameConfigDefs[key]) {
                window.gameConfig[key] = val;
                if (key === 'gameTitle') {
                    document.getElementById('ui-title').innerText = val.toUpperCase();
                    document.title = val;
                }
            }
        };

        // --- §2 Audio System ---
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.buffers = {};
                this.unlocked = false;
                this.lastPlayed = {};
                this.masterGain = null;
                this.bgmEl = document.getElementById('bgm_main');
                this.soundElements = {};
            }

            ensureContext() {
                if (this.ctx) return this.ctx;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                this.ctx = new AudioCtx();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.6;
                this.masterGain.connect(this.ctx.destination);
                return this.ctx;
            }

            unlock() {
                const ctx = this.ensureContext();
                if (!ctx) {
                    this.unlocked = true;
                    this.playBgm();
                    return;
                }
                if (this.unlocked) return;
                ctx.resume().then(() => {
                    this.unlocked = true;
                    this.playBgm();
                }).catch(() => {
                    this.unlocked = true;
                    this.playBgm();
                });
            }

            async loadSound(id, src) {
                const ctx = this.ensureContext();
                if (!ctx || this.buffers[id]) return;
                try {
                    const soundUrl = new URL(src, window.location.href);
                    if (soundUrl.origin !== window.location.origin) {
                        this.buffers[id] = 'media-element';
                        return;
                    }
                    const res = await fetch(src);
                    const arrayBuffer = await res.arrayBuffer();
                    this.buffers[id] = await ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn('Audio load failed, fallback enabled', id);
                    this.buffers[id] = 'fallback';
                }
            }

            preload(ids) {
                ids.forEach((id) => {
                    const el = document.getElementById(id);
                    if (el?.src) this.loadSound(id, el.src);
                });
            }

            playBgm() {
                if (!this.bgmEl) return;
                this.bgmEl.volume = 0.2;
                this.bgmEl.play().catch(() => {});
            }

            stopBgm() {
                if (!this.bgmEl) return;
                this.bgmEl.pause();
                this.bgmEl.currentTime = 0;
            }

            pauseBgm() {
                if (!this.bgmEl) return;
                this.bgmEl.pause();
            }

            playSfx(id, options = {}) {
                if (!this.unlocked) return;
                const now = performance.now();
                const cooldown = options.cooldown ?? 0;
                if (cooldown && this.lastPlayed[id] && now - this.lastPlayed[id] < cooldown) return;
                this.lastPlayed[id] = now;

                const buffer = this.buffers[id];
                if (buffer === 'media-element') {
                    const el = this.soundElements[id] || document.getElementById(id);
                    if (el) {
                        this.soundElements[id] = el;
                        const clone = el.cloneNode();
                        clone.volume = Math.min(options.volume ?? 0.55, 1);
                        clone.loop = false;
                        clone.play().catch(() => {
                            this.synthesize(options.fallback ?? (id === 'sfx_win' ? 'win' : id === 'sfx_die' ? 'fail' : 'noise'));
                        });
                        return;
                    }
                }
                if (this.ctx && buffer && buffer !== 'fallback') {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = buffer;
                    gain.gain.value = options.volume ?? 0.55;
                    source.connect(gain);
                    gain.connect(this.masterGain || this.ctx.destination);
                    source.start(0);
                } else {
                    this.synthesize(options.fallback ?? (id === 'sfx_win' ? 'win' : id === 'sfx_die' ? 'fail' : 'noise'));
                }
            }

            synthesize(type) {
                const ctx = this.ensureContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(this.masterGain || ctx.destination);

                if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(920, ctx.currentTime + 0.32);
                    gain.gain.setValueAtTime(0.001, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.1, ctx.currentTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.36);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.36);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(52, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.001, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.42);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.42);
                } else if (type === 'ui') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(640, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(820, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.001, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(130, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.001, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            }
        }

        // --- Core Game Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const audio = new AudioManager();

            // UI Elements
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const victoryScreen = document.getElementById('victory-screen');
            const hud = document.getElementById('hud');
            const scoreEl = document.getElementById('score');
            const finalScoreEl = document.getElementById('finalScore');
            const vignette = document.getElementById('vignette');
            const statusInd = document.getElementById('status-indicator');
            const feedbackOverlay = document.getElementById('feedback-overlay');
            const warningGif = document.getElementById('warning-gif');
            const victoryGif = document.getElementById('victory-gif');

            // Game State
            let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, VICTORY
            let lastTime = 0;
            let progress = 0; // 0 to 1000
            let isMoving = false;
            
            // Entity Logic
            let entityState = 'IDLE'; // IDLE, WARNING, ATTACK
            let stateTimer = 0;
            let nextStateChange = 2000;
            let flickerIntensity = 0;
            let shake = 0;
            
            // Visuals
            let particles = [];
            let textFloats = [];
            let lastProgressPing = 0;
            let previousEntityState = entityState;
            let feedbackTimer = 0;

            // Resize Handler
            function resize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize);
            resize();

            // Input Handling
            const isUiInteractiveTarget = (target) => target instanceof Element && !!target.closest('.arcade-btn');
            const handleStart = (e) => {
                if (isUiInteractiveTarget(e.target)) return;
                if (gameState === 'PLAYING') {
                    if (e.cancelable) e.preventDefault();
                    isMoving = true;
                }
                audio.unlock();
            };
            const handleEnd = (e) => {
                if (gameState === 'PLAYING' && e.cancelable) e.preventDefault();
                isMoving = false;
            };

            // [agent-note][stage4] repaired: mobile-tap-action | element: #gameCanvas | action: scoped pointer suppression away from menu buttons
            canvas.addEventListener('pointerdown', handleStart, { passive: false });
            window.addEventListener('pointerup', handleEnd);
            window.addEventListener('pointercancel', handleEnd);
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') handleStart(e);
            });
            document.addEventListener('keyup', (e) => {
                if (e.code === 'Space') handleEnd(e);
            });

            function hideFeedback() {
                feedbackOverlay.classList.add('hidden');
                warningGif.classList.add('hidden');
                victoryGif.classList.add('hidden');
                feedbackOverlay.setAttribute('aria-hidden', 'true');
            }

            function showFeedback(type, duration = 1800) {
                hideFeedback();
                feedbackOverlay.classList.remove('hidden');
                feedbackOverlay.setAttribute('aria-hidden', 'false');
                if (type === 'warning') {
                    warningGif.classList.remove('hidden');
                } else if (type === 'victory') {
                    victoryGif.classList.remove('hidden');
                } else {
                    return;
                }
                feedbackTimer = duration;
            }

            // Button Listeners
            [
                document.getElementById('start-btn'),
                document.getElementById('restart-btn'),
                document.getElementById('victory-btn')
            ].forEach((button) => {
                button.addEventListener('click', () => {
                    audio.unlock();
                    audio.playSfx('sfx_start', { cooldown: 120, volume: 0.45, fallback: 'ui' });
                    startGame();
                });
            });

            document.querySelectorAll('.arcade-btn').forEach((button) => {
                button.addEventListener('pointerenter', () => {
                    audio.playSfx('sfx_start', { cooldown: 150, volume: 0.2, fallback: 'ui' });
                });
            });

            audio.preload(['sfx_start', 'sfx_progress', 'sfx_warning', 'sfx_win', 'sfx_die']);

            function startGame() {
                gameState = 'PLAYING';
                progress = 0;
                isMoving = false;
                entityState = 'IDLE';
                stateTimer = 0;
                nextStateChange = 2000;
                particles = [];
                textFloats = [];
                lastProgressPing = 0;
                previousEntityState = 'IDLE';
                hideFeedback();
                
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                victoryScreen.classList.add('hidden');
                hud.classList.remove('hidden');
                vignette.style.background = 'radial-gradient(circle, transparent 50%, #000 150%)';
                
                audio.playBgm();
                audio.preload(['sfx_start', 'sfx_progress', 'sfx_warning', 'sfx_win', 'sfx_die']);
            }

            function gameOver() {
                gameState = 'GAMEOVER';
                audio.pauseBgm();
                audio.playSfx('sfx_die', { cooldown: 300, volume: 0.6, fallback: 'fail' });
                finalScoreEl.innerText = Math.floor(progress / 10);
                hud.classList.add('hidden');
                gameOverScreen.classList.remove('hidden');
                statusInd.classList.add('hidden');
                shake = 20;
            }

            function victory() {
                gameState = 'VICTORY';
                audio.pauseBgm();
                audio.playSfx('sfx_win', { cooldown: 300, volume: 0.6, fallback: 'win' });
                hud.classList.add('hidden');
                victoryScreen.classList.remove('hidden');
                statusInd.classList.add('hidden');
                showFeedback('victory', 2400);
            }

            function spawnParticle(x, y, color) {
                particles.push({
                    x, y, color,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1.0
                });
            }

            function spawnText(text) {
                textFloats.push({
                    text,
                    x: window.innerWidth,
                    y: window.innerHeight / 2 + (Math.random() - 0.5) * 100,
                    life: 1.0
                });
            }

            // --- Game Loop ---
            function loop(timestamp) {
                const dt = Math.min(timestamp - lastTime, 50); // Cap dt
                lastTime = timestamp;

                const W = window.innerWidth;
                const H = window.innerHeight;
                const CY = H / 2;

                // Clear
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, W, H);

                // Shake
                let sx = 0, sy = 0;
                if (shake > 0) {
                    sx = (Math.random() - 0.5) * shake;
                    sy = (Math.random() - 0.5) * shake;
                    shake *= 0.9;
                    if (shake < 0.5) shake = 0;
                }
                ctx.save();
                ctx.translate(sx, sy);

                if (gameState === 'PLAYING') {
                    // Logic
                    stateTimer += dt;

                    // Entity AI
                    if (stateTimer > nextStateChange) {
                        stateTimer = 0;
                        if (entityState === 'IDLE') {
                            // Chance to warn
                            entityState = 'WARNING';
                            nextStateChange = 500 + Math.random() * 1000; // Short warning
                        } else if (entityState === 'WARNING') {
                            // Attack
                            entityState = 'ATTACK';
                            nextStateChange = 1000 + Math.random() * 2000 * (11 - gameConfig.difficulty); // Attack duration based on config
                        } else if (entityState === 'ATTACK') {
                            // Back to idle
                            entityState = 'IDLE';
                            nextStateChange = 2000 + Math.random() * 3000;
                        }
                    }

                    if (entityState !== previousEntityState) {
                        if (entityState === 'WARNING') {
                            audio.playSfx('sfx_warning', { cooldown: 700, volume: 0.45, fallback: 'noise' });
                            showFeedback('warning', 1400);
                        }
                        previousEntityState = entityState;
                    }

                    // Movement & Death
                    if (isMoving) {
                        if (entityState === 'ATTACK') {
                            gameOver();
                        } else {
                            progress += (gameConfig.playerSpeed * dt) / 100;
                            if (Math.random() < 0.1) spawnParticle(W/2, CY, '#7FF6FF');
                            
                            // Random environment text
                            if (Math.random() < 0.005) {
                                const texts = ["LOCKER", "STAIRS", "NO EXIT", "HUSH", "DON'T LOOK"];
                                spawnText(texts[Math.floor(Math.random() * texts.length)]);
                            }
                        }
                    }

                    if (progress - lastProgressPing >= 200 && progress < 1000) {
                        lastProgressPing = progress;
                        audio.playSfx('sfx_progress', { cooldown: 180, volume: 0.28, fallback: 'ui' });
                    }

                    if (progress >= 1000) victory();
                    scoreEl.innerText = Math.floor(progress / 10);

                    // Visual Feedback for State
                    if (entityState === 'IDLE') {
                        vignette.style.background = 'radial-gradient(circle, transparent 50%, #000 150%)';
                        flickerIntensity = 0;
                        statusInd.classList.add('hidden');
                    } else if (entityState === 'WARNING') {
                        vignette.style.background = 'radial-gradient(circle, transparent 40%, #401019 120%)';
                        flickerIntensity = 0.2;
                        statusInd.innerText = "STATIC RISING";
                        statusInd.classList.remove('hidden');
                    } else if (entityState === 'ATTACK') {
                        vignette.style.background = 'radial-gradient(circle, transparent 20%, #7d0f23 100%)';
                        flickerIntensity = 0.8;
                        statusInd.innerText = "WATCHER LOCKED ON - DO NOT MOVE";
                        statusInd.classList.remove('hidden');
                        if (Math.random() < 0.3) shake = 5;
                    }
                }

                if (feedbackTimer > 0) {
                    feedbackTimer -= dt;
                    if (feedbackTimer <= 0) hideFeedback();
                }

                // --- Rendering ---

                // 1. The Corridor (1D Line)
                const lineWidth = W * 0.8;
                const lineStart = W * 0.1;
                const lineY = CY;

                // Ambient corridor haze
                const bgGrad = ctx.createLinearGradient(0, CY - 220, 0, CY + 220);
                bgGrad.addColorStop(0, 'rgba(4, 9, 18, 0)');
                bgGrad.addColorStop(0.5, 'rgba(18, 40, 58, 0.32)');
                bgGrad.addColorStop(1, 'rgba(4, 9, 18, 0)');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, CY - 220, W, 440);

                // Corridor guides
                ctx.strokeStyle = 'rgba(60, 116, 156, 0.18)';
                ctx.lineWidth = 1;
                for (let i = -3; i <= 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, lineY + i * 34);
                    ctx.lineTo(W, lineY + i * 34);
                    ctx.stroke();
                }

                // Draw Base Line
                ctx.beginPath();
                ctx.moveTo(0, lineY);
                ctx.lineTo(W, lineY);
                ctx.strokeStyle = '#142433';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Progress Line (Corridor Floor)
                ctx.beginPath();
                ctx.moveTo(lineStart, lineY);
                ctx.lineTo(lineStart + lineWidth, lineY);
                ctx.strokeStyle = '#2d5672';
                ctx.lineWidth = 6;
                ctx.shadowBlur = 14;
                ctx.shadowColor = 'rgba(55, 220, 255, 0.22)';
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw Player (Courier Spark)
                const playerX = lineStart + (progress / 1000) * lineWidth;

                // Player wake trail
                for (let i = 0; i < 5; i++) {
                    const trailAlpha = 0.12 - i * 0.018;
                    ctx.fillStyle = `rgba(127, 246, 255, ${Math.max(trailAlpha, 0)})`;
                    ctx.beginPath();
                    ctx.arc(playerX - i * 10, lineY, 12 - i * 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Flashlight Beam
                const grad = ctx.createRadialGradient(playerX, lineY, 0, playerX, lineY, 110);
                grad.addColorStop(0, 'rgba(255, 244, 196, 0.95)');
                grad.addColorStop(0.4, 'rgba(127, 246, 255, 0.42)');
                grad.addColorStop(1, 'rgba(127, 246, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(playerX, lineY, 110, 0, Math.PI * 2);
                ctx.fill();

                // Player Core
                ctx.fillStyle = '#f9fffc';
                ctx.beginPath();
                ctx.arc(playerX, lineY, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 205, 107, 0.92)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(playerX, lineY, 14, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(127, 246, 255, 0.45)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(playerX, lineY, 20 + Math.sin(timestamp / 120) * 2, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Goal
                const goalX = lineStart + lineWidth;
                const goalGlow = ctx.createLinearGradient(goalX - 10, lineY, goalX + 10, lineY);
                goalGlow.addColorStop(0, 'rgba(125, 255, 156, 0)');
                goalGlow.addColorStop(0.5, 'rgba(125, 255, 156, 1)');
                goalGlow.addColorStop(1, 'rgba(125, 255, 156, 0)');
                ctx.strokeStyle = goalGlow;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(goalX, lineY - 22);
                ctx.lineTo(goalX, lineY + 22);
                ctx.stroke();

                ctx.fillStyle = 'rgba(125, 255, 156, 0.22)';
                ctx.fillRect(goalX - 10, lineY - 28, 20, 56);

                // Draw Entity (Watcher shards)
                if (entityState === 'ATTACK' || entityState === 'WARNING') {
                    const glitchCount = entityState === 'ATTACK' ? 10 : 3;
                    ctx.fillStyle = `rgba(255, 77, 109, ${Math.random() * 0.45})`;
                    for(let i = 0; i < glitchCount; i++) {
                        const gx = Math.random() * W;
                        const gw = 12 + Math.random() * 42;
                        ctx.fillRect(gx, 0, gw, H);
                    }

                    const eyeX = Math.max(playerX + 88, W * 0.68);
                    const eyePulse = Math.sin(timestamp / 90) * 4;

                    if (entityState === 'WARNING') {
                        ctx.strokeStyle = 'rgba(255, 205, 107, 0.78)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(eyeX, lineY, 26 + eyePulse * 0.3, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    if (entityState === 'ATTACK') {
                        ctx.fillStyle = 'rgba(255, 35, 77, 0.16)';
                        ctx.fillRect(0, 0, W, H);

                        const eyeGrad = ctx.createRadialGradient(eyeX, lineY, 8, eyeX, lineY, 60);
                        eyeGrad.addColorStop(0, 'rgba(255, 235, 240, 1)');
                        eyeGrad.addColorStop(0.2, 'rgba(255, 77, 109, 0.95)');
                        eyeGrad.addColorStop(1, 'rgba(255, 77, 109, 0)');
                        ctx.fillStyle = eyeGrad;
                        ctx.beginPath();
                        ctx.arc(eyeX, lineY, 60 + eyePulse, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = '#ff4d6d';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.moveTo(eyeX - 28, lineY - 28);
                        ctx.lineTo(eyeX + 28, lineY + 28);
                        ctx.moveTo(eyeX + 28, lineY - 28);
                        ctx.lineTo(eyeX - 28, lineY + 28);
                        ctx.stroke();
                    }
                }

                // Particles
                particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.05;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                    if (p.life <= 0) particles.splice(i, 1);
                });
                ctx.globalAlpha = 1;

                // Text Floats
                ctx.font = '18px "Creepster"';
                ctx.fillStyle = '#4b7089';
                textFloats.forEach((t, i) => {
                    t.x -= (gameConfig.playerSpeed * dt) / 50;
                    t.life -= 0.005;
                    ctx.globalAlpha = Math.max(0, t.life);
                    ctx.fillText(t.text, t.x, t.y);
                    if (t.life <= 0 || t.x < -140) textFloats.splice(i, 1);
                });
                ctx.globalAlpha = 1;

                // CRT Flicker Overlay
                if (Math.random() < flickerIntensity) {
                    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.5})`;
                    ctx.fillRect(0, 0, W, H);
                }

                ctx.restore();
                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
