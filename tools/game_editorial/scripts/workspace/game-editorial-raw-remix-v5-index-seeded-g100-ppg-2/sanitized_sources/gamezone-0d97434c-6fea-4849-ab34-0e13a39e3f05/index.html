<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cash Flow Rush</title>
<!-- [agent-note][stage3] resolved-font: primary=Orbitron secondary=Exo 2 via catalogs/fonts.json -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #0b1124;
        --bg-bottom: #170f35;
        --panel: rgba(16, 24, 52, 0.82);
        --panel-edge: rgba(113, 239, 255, 0.42);
        --panel-shadow: rgba(7, 11, 26, 0.45);
        --cyan: #71efff;
        --cyan-strong: #41d7ff;
        --mint: #6cffb8;
        --gold: #ffd76d;
        --gold-strong: #ffb847;
        --danger: #ff6d8c;
        --danger-dark: #ca325d;
        --ink: #f5f8ff;
        --muted: #bfd0ff;
        --hero: #8d6e63;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 18%, rgba(65, 215, 255, 0.18), transparent 30%),
            radial-gradient(circle at 50% 85%, rgba(108, 255, 184, 0.12), transparent 28%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--ink);
        font-family: 'Exo 2', system-ui, sans-serif;
        touch-action: manipulation;
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    body::before {
        background:
            linear-gradient(180deg, rgba(255,255,255,0.02) 0, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 18px);
        opacity: 0.18;
        mix-blend-mode: screen;
    }

    body::after {
        background:
            radial-gradient(circle at 15% 20%, rgba(255,255,255,0.22) 0 1px, transparent 1px),
            radial-gradient(circle at 80% 16%, rgba(113, 239, 255, 0.16) 0 1.5px, transparent 1.5px),
            radial-gradient(circle at 32% 70%, rgba(255, 215, 109, 0.14) 0 1px, transparent 1px),
            radial-gradient(circle at 72% 82%, rgba(108, 255, 184, 0.14) 0 1px, transparent 1px);
        background-size: 180px 180px, 240px 240px, 210px 210px, 260px 260px;
        opacity: 0.45;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(19, 27, 58, 0.92), rgba(10, 16, 37, 0.9));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-edge);
        box-shadow:
            0 18px 40px var(--panel-shadow),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .text-shadow {
        text-shadow:
            0 2px 0 rgba(2, 8, 20, 0.85),
            0 0 18px rgba(65, 215, 255, 0.22);
    }

    .hidden { display: none !important; }
    .screen-fill { position: relative; width: 100%; height: 100%; user-select: none; }
    .absolute-fill { position: absolute; inset: 0; }

    .ui-layer {
        pointer-events: none;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 0.9rem;
        box-sizing: border-box;
    }

    .hud {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        gap: 0.45rem;
        padding-top: env(safe-area-inset-top, 0);
    }

    .score-display {
        min-width: min(86vw, 18rem);
        padding: 0.45rem 0.95rem 0.55rem;
        border-radius: 999px;
        border: 1px solid rgba(113, 239, 255, 0.32);
        background:
            linear-gradient(180deg, rgba(9, 18, 39, 0.92), rgba(14, 29, 61, 0.78));
        box-shadow:
            0 10px 24px rgba(0, 0, 0, 0.26),
            inset 0 0 0 1px rgba(255,255,255,0.04),
            0 0 18px rgba(65, 215, 255, 0.14);
        color: var(--mint);
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(1.55rem, 6vw, 2.55rem);
        letter-spacing: 0.06em;
        line-height: 1;
        text-align: center;
    }

    .lives-display {
        display: flex;
        gap: 0.45rem;
        margin-top: 0.15rem;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: rgba(8, 14, 33, 0.55);
        border: 1px solid rgba(255,255,255,0.06);
    }

    .game-over-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at center, rgba(11, 16, 31, 0.3), rgba(1, 3, 10, 0.76));
    }

    .game-over-panel {
        pointer-events: auto;
        border-top: 4px solid var(--danger);
        border-radius: 1rem;
        padding: 1.35rem 1.2rem 1.15rem;
        text-align: center;
        width: min(100%, 21rem);
        margin: 1rem;
        box-sizing: border-box;
    }

    .panel-title {
        margin: 0 0 0.45rem;
        color: var(--ink);
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(1.8rem, 6.4vw, 2.55rem);
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: 0.04em;
    }

    .panel-subtitle {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .final-score {
        color: var(--gold);
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(1.9rem, 7vw, 2.7rem);
        font-weight: 400;
        margin-bottom: 1.15rem;
        line-height: 1;
        text-shadow:
            0 2px 0 rgba(47, 24, 0, 0.85),
            0 0 18px rgba(255, 183, 71, 0.24);
    }

    .restart-btn {
        width: 100%;
        border: 0;
        border-radius: 0.8rem;
        background:
            linear-gradient(180deg, #2fe0ff, #139eff);
        color: #041120;
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(0.95rem, 4vw, 1.15rem);
        font-weight: 400;
        letter-spacing: 0.05em;
        padding: 0.85rem 0.95rem;
        box-shadow:
            0 6px 0 #0a5da0,
            0 12px 22px rgba(6, 16, 41, 0.3);
        text-transform: uppercase;
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    .restart-btn:hover { filter: brightness(1.08); }

    .restart-btn:active {
        transform: translateY(4px);
        box-shadow:
            0 2px 0 #0a5da0,
            0 8px 12px rgba(6, 16, 41, 0.25);
    }

    .currency { font-variant-numeric: tabular-nums; }

    .feedback-stack {
        position: absolute;
        right: 0.9rem;
        bottom: 1rem;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.55rem;
        padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .feedback-card {
        width: min(34vw, 7rem);
        min-width: 4.8rem;
        padding: 0.28rem;
        border-radius: 0.9rem;
        opacity: 0;
        transform: translateY(0.6rem) scale(0.96);
        transition: opacity 180ms ease, transform 180ms ease;
        overflow: hidden;
    }

    .feedback-card.active {
        opacity: 0.96;
        transform: translateY(0) scale(1);
    }

    .feedback-card img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 0.7rem;
        background: rgba(255,255,255,0.04);
    }

    .feedback-label {
        margin-top: 0.3rem;
        text-align: center;
        color: var(--ink);
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: 0.58rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    @media (max-width: 480px) {
        .ui-layer { padding: 0.75rem; }
        .score-display { min-width: min(88vw, 16rem); }
        .game-over-panel { padding: 1.15rem 1rem 1rem; }
        .panel-subtitle { font-size: 0.88rem; }
    }
</style>

<body>

<div id="game-container" class="screen-fill">
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <!-- [agent-note][stage3] resolved-gif: reward/fail overlays -> catalogs/gifs.json -->
    <div id="ui-layer" class="absolute-fill ui-layer">
        <div id="hud" class="hud">
            <div class="score-display text-shadow currency" id="score-display">$0</div>
            <div class="lives-display" id="lives-display">
                <!-- Lives injected by JS -->
            </div>
        </div>

        <div class="feedback-stack">
            <div id="reward-gif-card" class="glass feedback-card" aria-hidden="true">
                <img id="reward-gif" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Reward celebration animation">
                <div class="feedback-label">Cash Boost</div>
            </div>
            <div id="fail-gif-card" class="glass feedback-card" aria-hidden="true">
                <img id="fail-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Danger reaction animation">
                <div class="feedback-label">Market Shock</div>
            </div>
        </div>

        <div id="game-over-screen" class="absolute-fill game-over-screen hidden">
            <div id="game-over-panel" class="glass game-over-panel">
                <h2 class="panel-title text-shadow">SESSION CLOSED</h2>
                <div class="panel-subtitle">Final Total Saved</div>
                <div id="final-score" class="final-score currency">$0</div>
                <button id="restart-btn" class="restart-btn">
                    Reopen Run
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * §2 System Invariants & Architecture
 */
const CONFIG = {
    dpr: window.devicePixelRatio || 1,
    width: 0,
    height: 0,
    cx: 0,
    cy: 0
};

const ENABLE_ANIMATIONS = true;

const VISUALS = {
    bgTop: '#0b1124',
    bgBottom: '#170f35',
    gridLine: 'rgba(113, 239, 255, 0.08)',
    star: 'rgba(255,255,255,0.75)',
    skyline: '#111a36',
    skylineGlow: '#1d3264',
    walletDark: '#5f4b44',
    walletEdge: '#f3c77d',
    walletAccent: '#7af7ff',
    mint: '#6cffb8',
    mintDark: '#16b979',
    gold: '#ffd76d',
    goldDark: '#ffb847',
    danger: '#ff6d8c',
    dangerDark: '#ca325d',
    ink: '#f5f8ff',
    panel: '#0f1938'
};

// State
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let lastTime = 0;
let score = 0;
let lives = 3;
let gameSpeed = 1;
let spawnTimer = 0;

// Entities
let hero = { x: 0, y: 0, r: 35, vx: 0, vy: 0, targetX: 0, targetY: 0, blink: 0 };
const entities = {
    items: [],
    particles: [],
    floaters: []
};

// Config Proxy
window.gameConfig = {};

// DOM Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = {
    score: document.getElementById('score-display'),
    lives: document.getElementById('lives-display'),
    gameOver: document.getElementById('game-over-screen'),
    finalScore: document.getElementById('final-score'),
    restartBtn: document.getElementById('restart-btn'),
    rewardGifCard: document.getElementById('reward-gif-card'),
    failGifCard: document.getElementById('fail-gif-card')
};

// Audio Context
let audioCtx;
const sounds = {};
const gifTimers = {};
let audioUnlocked = false;
let lastUiSfxAt = 0;

/**
 * §3 Implementation
 */

function pulseValue(speed = 1, offset = 0) {
    return Math.sin(Date.now() * 0.0016 * speed + offset);
}

// 3.7 Config System
function parseConfig() {
    const el = document.getElementById('game-config');
    if (!el) return;
    try {
        const defs = JSON.parse(el.textContent);
        window.gameConfigDefs = defs;
        for (const k in defs) {
            window.gameConfig[k] = defs[k].value;
        }
    } catch (e) { console.error('Config parse error', e); }
}

// 3.1 Viewport
function resize() {
    const rect = canvas.getBoundingClientRect();
    CONFIG.width = rect.width;
    CONFIG.height = rect.height;
    CONFIG.cx = rect.width / 2;
    CONFIG.cy = rect.height / 2;

    canvas.width = rect.width * CONFIG.dpr;
    canvas.height = rect.height * CONFIG.dpr;

    ctx.setTransform(CONFIG.dpr, 0, 0, CONFIG.dpr, 0, 0);
}

// 3.5 Audio System
function initAudio() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = new AudioContext();

    ['bgm_main', 'sfx_coin', 'sfx_bonus', 'sfx_hit', 'sfx_ui', 'sfx_gameover'].forEach(id => {
        const el = document.getElementById(id);
        if (el) sounds[id] = el;
    });
}

function unlockAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    audioUnlocked = true;
    syncBgm();
}

function safePlaySound(sound, volume = 1, restart = true) {
    if (!sound) return;
    sound.volume = volume;
    if (restart) sound.currentTime = 0;
    sound.play().catch(() => {});
}

function syncBgm() {
    if (!sounds.bgm_main) return;
    sounds.bgm_main.volume = gameState === 'GAMEOVER' ? 0.18 : 0.2;

    if (!audioUnlocked) {
        sounds.bgm_main.pause();
        return;
    }

    if (gameState === 'PLAYING') {
        if (sounds.bgm_main.paused) {
            sounds.bgm_main.play().catch(() => {});
        }
    } else {
        sounds.bgm_main.pause();
    }
}

function triggerGif(card, duration = 950) {
    if (!card) return;
    card.classList.add('active');
    clearTimeout(gifTimers[card.id]);
    gifTimers[card.id] = setTimeout(() => {
        card.classList.remove('active');
    }, duration);
}

function playSfx(type) {
    if (type === 'coin') {
        if (sounds.sfx_coin) {
            safePlaySound(sounds.sfx_coin, 0.42);
        } else synthCoin();
    } else if (type === 'bonus') {
        if (sounds.sfx_bonus) {
            safePlaySound(sounds.sfx_bonus, 0.46);
        } else synthCoin();
    } else if (type === 'hit') {
        if (sounds.sfx_hit) {
            safePlaySound(sounds.sfx_hit, 0.48);
        } else synthExplosion();
    } else if (type === 'ui') {
        const now = performance.now();
        if (now - lastUiSfxAt < 120) return;
        lastUiSfxAt = now;
        safePlaySound(sounds.sfx_ui, 0.34);
    } else if (type === 'gameover') {
        safePlaySound(sounds.sfx_gameover, 0.45);
    }
}

function synthCoin() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function synthExplosion() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

// 3.3 Hero & Game Logic
function initGame() {
    score = 0;
    lives = 3;
    gameSpeed = 1;
    spawnTimer = 0;

    entities.items = [];
    entities.particles = [];
    entities.floaters = [];

    hero.x = CONFIG.cx;
    hero.y = CONFIG.height - 100;
    hero.targetX = CONFIG.cx;
    hero.targetY = CONFIG.height - 100;
    hero.blink = 0;

    updateHUD();
}

function setState(newState) {
    gameState = newState;
    syncBgm();

    if (newState === 'PLAYING') {
        ui.gameOver.classList.add('hidden');
    } else if (newState === 'GAMEOVER') {
        ui.finalScore.textContent = formatMoney(score);
        ui.gameOver.classList.remove('hidden');
        playSfx('gameover');
        triggerGif(ui.failGifCard, 1600);
    }
}

function formatMoney(amount) {
    return '$' + amount.toLocaleString();
}

function updateHUD() {
    ui.score.textContent = formatMoney(score);
    let html = '';
    for (let i = 0; i < 3; i++) {
        const active = i < lives;
        html += `<div style="
            position: relative;
            width: 2.05rem;
            height: 1.15rem;
            border-radius: 0.42rem;
            border: 1px solid ${active ? 'rgba(255, 215, 109, 0.95)' : 'rgba(95, 111, 142, 0.7)'};
            background: ${active
                ? 'linear-gradient(135deg, #fff4a8 0%, #ffd76d 45%, #ffb847 100%)'
                : 'linear-gradient(135deg, #34405d, #1b243d)'};
            box-shadow: ${active
                ? '0 0 12px rgba(255, 183, 71, 0.35), inset 0 1px 0 rgba(255,255,255,0.45)'
                : 'inset 0 1px 0 rgba(255,255,255,0.08)'};
        "></div>`;
    }
    ui.lives.innerHTML = html;
}

function spawnItem() {
    const r = Math.random();
    let type = 'money';
    if (r > 0.95) type = 'gold';
    else if (r > 0.70) type = 'tax';

    const size = type === 'gold' ? 25 : (type === 'money' ? 35 : 40);
    const x = Math.random() * (CONFIG.width - size * 2) + size;

    entities.items.push({
        x, y: -50,
        type,
        w: type === 'money' || type === 'tax' ? 50 : 30,
        h: type === 'money' || type === 'tax' ? 30 : 30,
        vx: (Math.random() - 0.5) * 20,
        vy: (100 + Math.random() * 100) * (1 + (gameSpeed - 1) * 0.5),
        rot: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 2
    });
}

function createParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        entities.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.5) * 300,
            life: 1.0,
            color,
            size: Math.random() * 5 + 2
        });
    }
}

function createFloater(x, y, text, color) {
    entities.floaters.push({
        x, y, text, color,
        life: 1.0,
        vy: -100
    });
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    gameSpeed += dt * 0.02;
    hero.blink = Math.max(0, hero.blink - dt * 2.8);

    const lerpFactor = 1 - Math.pow(0.05, dt * window.gameConfig.heroSpeed);
    hero.x += (hero.targetX - hero.x) * lerpFactor;
    hero.y += (hero.targetY - hero.y) * lerpFactor;

    hero.x = Math.max(hero.r, Math.min(CONFIG.width - hero.r, hero.x));
    hero.y = Math.max(hero.r, Math.min(CONFIG.height - hero.r, hero.y));

    spawnTimer -= dt * gameSpeed;
    if (spawnTimer <= 0) {
        spawnItem();
        spawnTimer = window.gameConfig.spawnRate / Math.sqrt(gameSpeed);
    }

    for (let i = entities.items.length - 1; i >= 0; i--) {
        const item = entities.items[i];
        item.y += item.vy * dt;
        item.x += item.vx * dt;
        item.rot += item.vRot * dt;

        const dx = item.x - hero.x;
        const dy = item.y - hero.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < hero.r + item.w / 2) {
            if (item.type === 'tax') {
                lives--;
                hero.blink = 1;
                updateHUD();
                playSfx('hit');
                triggerGif(ui.failGifCard, 900);
                vibrate('heavy');
                createParticles(item.x, item.y, VISUALS.danger, 20);
                createFloater(item.x, item.y, 'FEE!', VISUALS.danger);

                if (lives <= 0) setState('GAMEOVER');
            } else {
                const val = item.type === 'gold' ? 5000 : 1000;
                score += val;
                updateHUD();
                playSfx(item.type === 'gold' ? 'bonus' : 'coin');
                triggerGif(ui.rewardGifCard, item.type === 'gold' ? 1300 : 850);
                vibrate('light');
                createParticles(item.x, item.y, item.type === 'gold' ? VISUALS.gold : VISUALS.mint);
                createFloater(item.x, item.y, `+$${val}`, '#ffffff');
            }
            entities.items.splice(i, 1);
            continue;
        }

        if (item.y > CONFIG.height + 50) {
            entities.items.splice(i, 1);
        }
    }

    for (let i = entities.particles.length - 1; i >= 0; i--) {
        const p = entities.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) entities.particles.splice(i, 1);
    }

    for (let i = entities.floaters.length - 1; i >= 0; i--) {
        const f = entities.floaters[i];
        f.y += f.vy * dt;
        f.life -= dt;
        if (f.life <= 0) entities.floaters.splice(i, 1);
    }
}

function drawBackground() {
    const bgGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.height);
    bgGrad.addColorStop(0, VISUALS.bgTop);
    bgGrad.addColorStop(0.58, '#13204a');
    bgGrad.addColorStop(1, VISUALS.bgBottom);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.strokeStyle = VISUALS.gridLine;
    ctx.lineWidth = 1;
    const step = 34;
    const offset = (Date.now() * 0.02) % step;
    for (let x = -step; x < CONFIG.width + step; x += step) {
        ctx.beginPath();
        ctx.moveTo(x + offset, 0);
        ctx.lineTo(x + offset, CONFIG.height);
        ctx.stroke();
    }
    for (let y = -step; y < CONFIG.height + step; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y + offset * 0.35);
        ctx.lineTo(CONFIG.width, y + offset * 0.35);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.fillStyle = VISUALS.skyline;
    ctx.globalAlpha = 0.9;
    const baseY = CONFIG.height - 22;
    for (let i = 0; i < 8; i++) {
        const width = CONFIG.width / 7 + (i % 2) * 18;
        const x = i * (CONFIG.width / 8) - 8;
        const h = 38 + (i % 4) * 16;
        ctx.fillRect(x, baseY - h, width, h);
    }
    ctx.restore();

    ctx.save();
    const pulse = ENABLE_ANIMATIONS ? pulseValue(0.7) : 0;
    ctx.globalAlpha = 0.2 + (pulse + 1) * 0.04;
    ctx.fillStyle = VISUALS.skylineGlow;
    for (let i = 0; i < 14; i++) {
        const x = (i * 77 + Date.now() * 0.01) % (CONFIG.width + 40) - 20;
        const y = 40 + (i % 5) * 55;
        ctx.beginPath();
        ctx.arc(x, y, 1.8 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = VISUALS.mint;
    const time = Date.now() * 0.001;
    for (let i = 0; i < 11; i++) {
        const x = (i * 92 + time * 22) % (CONFIG.width + 120) - 60;
        const y = (i * 128 + time * 48) % (CONFIG.height + 120) - 60;
        ctx.font = '400 24px Orbitron';
        ctx.fillText('$', x, y);
    }
    ctx.restore();
}

function drawHero() {
    ctx.save();
    ctx.translate(hero.x, hero.y);

    const bob = ENABLE_ANIMATIONS ? Math.sin(Date.now() * 0.0045) * 2.2 : 0;
    ctx.translate(0, bob);

    const heroColor = window.gameConfig.themeColor || VISUALS.walletDark;
    ctx.shadowBlur = 24;
    ctx.shadowColor = hero.blink > 0 ? 'rgba(255, 109, 140, 0.9)' : 'rgba(113, 239, 255, 0.55)';

    const bodyGrad = ctx.createLinearGradient(0, -26, 0, 38);
    bodyGrad.addColorStop(0, heroColor);
    bodyGrad.addColorStop(1, VISUALS.walletDark);

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-26, 2);
    ctx.quadraticCurveTo(-30, 36, 0, 38);
    ctx.quadraticCurveTo(30, 36, 26, 2);
    ctx.quadraticCurveTo(24, -17, 0, -19);
    ctx.quadraticCurveTo(-24, -17, -26, 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = VISUALS.walletEdge;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#f6deb4';
    ctx.beginPath();
    ctx.moveTo(-17, -16);
    ctx.lineTo(17, -16);
    ctx.lineTo(13, -31);
    ctx.lineTo(-13, -31);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(-11, -12, 22, 4);

    ctx.fillStyle = VISUALS.walletAccent;
    ctx.beginPath();
    ctx.arc(0, 4, 11, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#072031';
    ctx.font = '700 15px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 5);

    ctx.fillStyle = '#0c1830';
    ctx.beginPath();
    ctx.arc(-9, -2, 3.3, 0, Math.PI * 2);
    ctx.arc(9, -2, 3.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-8, -3, 1, 0, Math.PI * 2);
    ctx.arc(10, -3, 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = hero.blink > 0 ? VISUALS.danger : VISUALS.walletEdge;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 13, 7, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.stroke();

    ctx.restore();
}

function drawMoneyBill(item) {
    const billGrad = ctx.createLinearGradient(-25, -15, 25, 15);
    billGrad.addColorStop(0, '#a0ffd6');
    billGrad.addColorStop(1, VISUALS.mintDark);
    ctx.fillStyle = billGrad;
    ctx.fillRect(-25, -15, 50, 30);

    ctx.strokeStyle = '#0e7f5a';
    ctx.lineWidth = 2;
    ctx.strokeRect(-25, -15, 50, 30);

    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 1;
    ctx.strokeRect(-19, -10, 38, 20);

    ctx.fillStyle = '#0d6649';
    ctx.beginPath();
    ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#d7fff0';
    ctx.font = '600 12px Exo 2';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 0.5);
}

function drawGoldCoin(item) {
    const pulse = ENABLE_ANIMATIONS ? (Math.sin(Date.now() * 0.006 + item.x) + 1) * 0.5 : 0.5;
    ctx.shadowBlur = 16 + pulse * 8;
    ctx.shadowColor = 'rgba(255, 215, 109, 0.55)';

    const coinGrad = ctx.createRadialGradient(-4, -6, 3, 0, 0, 15);
    coinGrad.addColorStop(0, '#fff2a4');
    coinGrad.addColorStop(0.55, VISUALS.gold);
    coinGrad.addColorStop(1, VISUALS.goldDark);
    ctx.fillStyle = coinGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#a56a00';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.beginPath();
    ctx.arc(-4, -5, 4.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawTaxBadge(item) {
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(255, 109, 140, 0.35)';
    const taxGrad = ctx.createLinearGradient(-25, -15, 25, 15);
    taxGrad.addColorStop(0, '#ff9bb0');
    taxGrad.addColorStop(1, VISUALS.dangerDark);
    ctx.fillStyle = taxGrad;
    ctx.fillRect(-25, -15, 50, 30);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#74122f';
    ctx.lineWidth = 2;
    ctx.strokeRect(-25, -15, 50, 30);

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(-25, -15, 50, 8);

    ctx.fillStyle = '#fff8fb';
    ctx.font = '700 12px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TAX', 0, 0);
}

function draw() {
    drawBackground();
    drawHero();

    entities.items.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot);

        if (item.type === 'money') {
            drawMoneyBill(item);
        } else if (item.type === 'gold') {
            drawGoldCoin(item);
        } else if (item.type === 'tax') {
            drawTaxBadge(item);
        }
        ctx.restore();
    });

    entities.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    ctx.font = '400 26px Orbitron';
    ctx.textAlign = 'center';
    entities.floaters.forEach(f => {
        ctx.globalAlpha = f.life;
        ctx.fillStyle = f.color;
        ctx.strokeStyle = 'rgba(4, 10, 24, 0.85)';
        ctx.lineWidth = 3;
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1.0;
    });
}

// 3.2 Input System
function handleInput(e) {
    unlockAudio();
    if (gameState === 'GAMEOVER') {
        return;
    }

    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        hero.targetX = x;
        hero.targetY = y;
    }
}

const isCanvasPointerEvent = (e) => e.target === canvas;

canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleInput(e);
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
    e.preventDefault();
    if (gameState === 'PLAYING') handleInput(e);
}, { passive: false });

ui.restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    unlockAudio();
    playSfx('ui');
    initGame();
    setState('PLAYING');
});

// 3.4 Lifecycle
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);

document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    initAudio();
    resize();
    initGame();
    setState('PLAYING');

    requestAnimationFrame(loop);
});
</script>
