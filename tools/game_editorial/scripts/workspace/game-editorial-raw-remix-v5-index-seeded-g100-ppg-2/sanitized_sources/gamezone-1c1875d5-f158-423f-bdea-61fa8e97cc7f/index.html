<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Clean Sweep Bot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');
        :root {
            --bg-top: #08131f;
            --bg-bottom: #0f2e3f;
            --panel: rgba(8, 19, 31, 0.72);
            --panel-strong: rgba(9, 24, 38, 0.88);
            --panel-soft: rgba(255, 255, 255, 0.08);
            --line: rgba(118, 246, 255, 0.35);
            --line-strong: rgba(140, 248, 255, 0.85);
            --text: #ebfdff;
            --muted: #a7d9df;
            --accent: #76f6ff;
            --accent-2: #67ffa8;
            --danger: #ff547d;
            --danger-deep: #6c0f2f;
            --warning: #ffd96a;
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(118, 246, 255, 0.18), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text);
        }

        button {
            font: inherit;
            border: 0;
            outline: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(103, 255, 168, 0.12), transparent 20%),
                radial-gradient(circle at 85% 15%, rgba(118, 246, 255, 0.14), transparent 24%),
                radial-gradient(circle at 50% 85%, rgba(255, 84, 125, 0.10), transparent 22%);
            opacity: 0.9;
        }

        #game-container::after {
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: screen;
            opacity: 0.25;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 16px;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(7, 20, 33, 0.90), rgba(11, 33, 48, 0.82));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            color: var(--text);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(118,246,255,0.08), rgba(103,255,168,0.12));
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .screen-card {
            width: min(100%, 440px);
            border-radius: 28px;
            padding: 28px 24px;
            text-align: center;
            pointer-events: auto;
        }

        .hero-bot {
            width: 112px;
            height: 112px;
            margin: 0 auto 12px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            position: relative;
            background:
                radial-gradient(circle at 35% 30%, #c3ffff 0%, #8df4ff 30%, #245e80 66%, #112739 100%);
            box-shadow:
                0 0 0 5px rgba(118, 246, 255, 0.18),
                0 0 30px rgba(118, 246, 255, 0.38),
                inset 0 -10px 18px rgba(0, 0, 0, 0.35);
            animation: hoverBot 2.6s ease-in-out infinite;
        }

        .hero-bot::before,
        .hero-bot::after {
            content: "";
            position: absolute;
            border-radius: 999px;
        }

        .hero-bot::before {
            width: 78px;
            height: 18px;
            bottom: 18px;
            background: rgba(8, 19, 31, 0.55);
            filter: blur(8px);
        }

        .hero-bot::after {
            width: 34px;
            height: 34px;
            right: 12px;
            top: 40px;
            background: radial-gradient(circle at 35% 35%, #0b1721 0%, #08131f 45%, #76f6ff 46%, #0d2c3d 100%);
            box-shadow: 0 0 18px rgba(118, 246, 255, 0.42);
        }

        .hero-face {
            font-size: 2.7rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
        }

        .eyebrow {
            position: absolute;
            top: 26px;
            width: 18px;
            height: 5px;
            border-radius: 999px;
            background: rgba(9, 24, 38, 0.9);
        }

        .eyebrow.left {
            left: 28px;
            transform: rotate(-12deg);
        }

        .eyebrow.right {
            right: 28px;
            transform: rotate(12deg);
        }

        .screen-title,
        .result-title,
        .score-value,
        .section-heading,
        .cost-pill,
        .hud-value,
        .feedback-label {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .screen-title {
            margin: 0 0 8px;
            font-size: clamp(1.85rem, 6vw, 2.4rem);
            line-height: 1.05;
            letter-spacing: 0.04em;
            color: var(--text);
            text-shadow: 0 0 18px rgba(118, 246, 255, 0.28);
        }

        .screen-subtitle {
            margin: 0 0 22px;
            font-size: 1.08rem;
            line-height: 1.3;
            color: var(--muted);
        }

        .accent-copy {
            color: var(--accent-2);
            font-weight: 700;
        }

        .primary-btn {
            width: 100%;
            min-height: 52px;
            border-radius: 999px;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--accent), #4ec9ff 55%, #58ffc6);
            color: #062032;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: 0 14px 26px rgba(61, 223, 255, 0.28);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            pointer-events: auto;
        }

        .primary-btn:active {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .primary-btn:hover {
            box-shadow: 0 16px 30px rgba(61, 223, 255, 0.36);
        }

        .result-title {
            margin: 0 0 8px;
            font-size: clamp(1.5rem, 5vw, 2rem);
            color: #ffd5df;
            letter-spacing: 0.06em;
        }

        .result-copy {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 1rem;
        }

        .score-card {
            width: 100%;
            margin: 0 0 18px;
            padding: 14px 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
            border: 1px solid rgba(118, 246, 255, 0.18);
        }

        .score-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--muted);
        }

        .score-value {
            margin-top: 6px;
            font-size: clamp(2rem, 8vw, 2.8rem);
            color: var(--accent-2);
            text-shadow: 0 0 16px rgba(103, 255, 168, 0.22);
        }

        .shop-section {
            width: 100%;
            margin: 0 0 18px;
        }

        .section-heading {
            margin: 0 0 12px;
            font-size: 1rem;
            letter-spacing: 0.12em;
            color: var(--warning);
        }

        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shop-btn {
            width: 100%;
            padding: 12px 14px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            text-align: left;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
            color: var(--text);
            border: 1px solid rgba(118, 246, 255, 0.12);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            pointer-events: auto;
        }

        .shop-btn:active {
            transform: scale(0.98);
        }

        .shop-btn:hover {
            border-color: rgba(118, 246, 255, 0.36);
            background: linear-gradient(180deg, rgba(118,246,255,0.14), rgba(255,255,255,0.06));
        }

        .shop-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.3);
        }

        .shop-btn-main {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .upgrade-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.35rem;
            flex: 0 0 auto;
            box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.18);
        }

        .upgrade-icon.range {
            background: linear-gradient(135deg, rgba(118,246,255,0.30), rgba(70,138,255,0.24));
        }

        .upgrade-icon.speed {
            background: linear-gradient(135deg, rgba(255,217,106,0.36), rgba(255,84,125,0.24));
        }

        .upgrade-copy {
            min-width: 0;
        }

        .upgrade-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }

        .upgrade-level {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .cost-pill {
            flex: 0 0 auto;
            padding: 6px 12px;
            font-size: 0.9rem;
            color: #03261e;
            background: linear-gradient(135deg, #8fffcb, #67ffa8);
            box-shadow: 0 0 16px rgba(103, 255, 168, 0.2);
            border-radius: 999px;
        }

        #hud {
            position: absolute;
            top: calc(12px + env(safe-area-inset-top));
            left: calc(12px + env(safe-area-inset-left));
            pointer-events: none;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(8, 19, 31, 0.88), rgba(11, 33, 48, 0.78));
            border: 1px solid rgba(118, 246, 255, 0.28);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
        }

        .hud-icon {
            font-size: 1.3rem;
        }

        .hud-value {
            font-size: 1.25rem;
            color: var(--text);
        }

        .scanline {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, transparent 0%, rgba(118,246,255,0.08) 45%, transparent 100%);
            opacity: 0.6;
            mix-blend-mode: screen;
            animation: scan 5.5s linear infinite;
        }

        .feedback-overlay {
            position: absolute;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom));
            width: min(30vw, 128px);
            min-width: 92px;
            padding: 8px;
            border-radius: 18px;
            background: rgba(8, 19, 31, 0.58);
            border: 1px solid rgba(118, 246, 255, 0.18);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-overlay.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-gif {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
        }

        .feedback-label {
            margin-top: 6px;
            text-align: center;
            font-size: 0.66rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
        }

        @keyframes hoverBot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes scan {
            0% { transform: translateY(-110%); }
            100% { transform: translateY(110%); }
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 14px;
            }

            .screen-card {
                padding: 22px 18px;
                border-radius: 24px;
            }

            .hero-bot {
                width: 96px;
                height: 96px;
            }

            .hero-face {
                font-size: 2.2rem;
            }

            .screen-subtitle,
            .result-copy {
                font-size: 0.98rem;
            }

            .primary-btn {
                font-size: 1rem;
                min-height: 50px;
            }

            .upgrade-name {
                font-size: 0.96rem;
            }

            .cost-pill {
                font-size: 0.8rem;
                padding: 6px 10px;
            }

            .hud-pill {
                padding: 8px 12px;
            }

            .hud-value {
                font-size: 1.05rem;
            }

            .feedback-overlay {
                width: min(34vw, 108px);
                right: 10px;
                bottom: calc(10px + env(safe-area-inset-bottom));
            }

            .feedback-label {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="start-screen" class="glass-panel screen-card">
                <div class="hero-bot" aria-hidden="true">
                    <span class="eyebrow left"></span>
                    <span class="eyebrow right"></span>
                    <span class="hero-face">🤖</span>
                </div>
                <h1 class="screen-title">Clean Sweep Bot</h1>
                <p class="screen-subtitle">Guide the <span class="accent-copy">neon janitor unit</span> to vacuum dust credits and dodge the mud traps.</p>
                <button id="start-btn" class="primary-btn">Start Run</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel screen-card">
                <h2 class="result-title">Run Ended</h2>
                <p class="result-copy">The sweep bot clipped a sludge patch. Spend your dust credits, tune the unit, and redeploy.</p>

                <div class="score-card">
                    <div class="score-label">Dust Credits</div>
                    <div class="score-value">$<span id="finalScore">0</span></div>
                </div>

                <div class="shop-section">
                    <h3 class="section-heading">Bot Upgrades</h3>
                    <div class="shop-list">
                        <button id="buy-radius" class="shop-btn">
                            <div class="shop-btn-main">
                                <div class="upgrade-icon range">🌀</div>
                                <div class="upgrade-copy">
                                    <div class="upgrade-name">Suction Range</div>
                                    <div class="upgrade-level">Level <span id="lvl-radius">1</span></div>
                                </div>
                            </div>
                            <div class="cost-pill" id="cost-radius">$50</div>
                        </button>

                        <button id="buy-speed" class="shop-btn">
                            <div class="shop-btn-main">
                                <div class="upgrade-icon speed">⚡</div>
                                <div class="upgrade-copy">
                                    <div class="upgrade-name">Motor Speed</div>
                                    <div class="upgrade-level">Level <span id="lvl-speed">1</span></div>
                                </div>
                            </div>
                            <div class="cost-pill" id="cost-speed">$50</div>
                        </button>
                    </div>
                </div>

                <button id="restart-btn" class="primary-btn">Run Again</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hidden">
                <div class="hud-pill glass-panel">
                    <span class="hud-icon">💠</span>
                    <span class="hud-value" id="score">0</span>
                </div>
            </div>
        </div>

        <div id="reaction-clean" class="feedback-overlay" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: collect-feedback -> catalogs/gifs.json -->
            <img class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="" loading="lazy">
            <div class="feedback-label">Dust Credit</div>
        </div>

        <div id="reaction-fail" class="feedback-overlay" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: fail-feedback -> catalogs/gifs.json -->
            <img class="feedback-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="" loading="lazy">
            <div class="feedback-label">Sludge Hit</div>
        </div>

        <div class="scanline" aria-hidden="true"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                clean: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                buy: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.preload = 'auto';
                this.bgm.volume = 0.2;
                this.sfx = {};
                this.cooldowns = new Map();
                this.pools = {};
                this.now = () => performance.now();

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                    this.pools[key] = [audio];
                }
            }

            unlock() {
                this.enabled = true;
            }

            getPooledAudio(key) {
                const pool = this.pools[key];
                if (!pool) return null;

                const reusable = pool.find(audio => audio.paused || audio.ended);
                if (reusable) return reusable;

                if (pool.length >= 3) {
                    const recycled = pool[0];
                    recycled.pause();
                    recycled.currentTime = 0;
                    pool.push(pool.shift());
                    return recycled;
                }

                const clone = this.sfx[key].cloneNode();
                clone.preload = 'auto';
                pool.push(clone);
                return clone;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.enabled || !this.sfx[key]) return;

                const cooldown = key === 'clean' ? 90 : 0;
                const time = this.now();
                if (cooldown > 0 && (this.cooldowns.get(key) || 0) > time) return;
                if (cooldown > 0) this.cooldowns.set(key, time + cooldown);

                const sound = this.getPooledAudio(key);
                if (!sound) return;

                sound.currentTime = 0;
                sound.volume = {
                    clean: 0.22,
                    fail: 0.65,
                    buy: 0.42,
                    start: 0.45,
                    blocked: 0.4
                }[key] ?? 0.4;

                sound.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreNode = document.getElementById('score');
        const finalScoreNode = document.getElementById('finalScore');
        const radiusLevelNode = document.getElementById('lvl-radius');
        const speedLevelNode = document.getElementById('lvl-speed');
        const radiusCostNode = document.getElementById('cost-radius');
        const speedCostNode = document.getElementById('cost-speed');
        const cleanReaction = document.getElementById('reaction-clean');
        const failReaction = document.getElementById('reaction-fail');

        let width, height;
        let gameActive = false;
        let score = 0;
        let totalCash = 0;
        let feedbackTimer = null;

        let stats = {
            radius: 50,
            radiusLevel: 1,
            radiusCost: 50,
            speed: 0.08,
            speedLevel: 1,
            speedCost: 50
        };

        let player = { x: 0, y: 0, targetX: 0, targetY: 0, angle: 0 };
        let dusts = [];
        let spills = [];
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (!gameActive) {
                player.x = width / 2;
                player.y = height / 2;
                player.targetX = width / 2;
                player.targetY = height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. INPUT HANDLING */
        function handleInput(e) {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            player.targetX = clientX - rect.left;
            player.targetY = clientY - rect.top;
        }

        // [agent-note][stage4] repaired: mobile-input-actionability | action: scoped gameplay touch suppression to canvas so menu buttons keep native tap behavior
        canvas.addEventListener('mousemove', handleInput);
        canvas.addEventListener('touchmove', handleInput, { passive: false });
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        function showReaction(element, duration = 700) {
            clearTimeout(feedbackTimer);
            cleanReaction.classList.remove('visible');
            failReaction.classList.remove('visible');
            element.classList.add('visible');
            feedbackTimer = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        /** 5. GAME LOGIC */
        function spawnDust() {
            const margin = 50;
            dusts.push({
                x: margin + Math.random() * (width - margin * 2),
                y: margin + Math.random() * (height - margin * 2),
                size: 5 + Math.random() * 5,
                color: Math.random() > 0.5 ? '#8ef8ff' : '#67ffa8',
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        function spawnSpill() {
            const margin = 80;
            let x, y, dist;
            let attempts = 0;
            do {
                x = margin + Math.random() * (width - margin * 2);
                y = margin + Math.random() * (height - margin * 2);
                const dx = x - player.x;
                const dy = y - player.y;
                dist = Math.sqrt(dx * dx + dy * dy);
                attempts++;
            } while (dist < 200 && attempts < 10);

            spills.push({
                x,
                y,
                radius: 30 + Math.random() * 20,
                pulse: Math.random() * Math.PI * 2
            });
        }

        function initGame() {
            score = 0;
            scoreNode.innerText = totalCash;

            dusts = [];
            spills = [];
            particles = [];
            cleanReaction.classList.remove('visible');
            failReaction.classList.remove('visible');

            for (let i = 0; i < 20; i++) spawnDust();
            for (let i = 0; i < 3; i++) spawnSpill();

            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: 1 + Math.random() * 2,
                    speed: 0.2 + Math.random() * 0.5
                });
            }
        }

        function drawFloor() {
            const tileSize = 96;
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, "#08131f");
            gradient.addColorStop(1, "#0f2e3f");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = "rgba(118, 246, 255, 0.10)";
            ctx.lineWidth = 1;

            for (let x = 0; x < width; x += tileSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += tileSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const glow = ctx.createRadialGradient(width * 0.5, height * 0.4, 20, width * 0.5, height * 0.4, Math.max(width, height) * 0.55);
            glow.addColorStop(0, "rgba(118, 246, 255, 0.18)");
            glow.addColorStop(1, "rgba(118, 246, 255, 0)");
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);
        }

        function drawSpill(spill, currentRadius) {
            ctx.save();
            ctx.translate(spill.x, spill.y);

            ctx.beginPath();
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 * i) / 12;
                const wobble = currentRadius + Math.sin(spill.pulse * 1.6 + i) * 4 + (i % 2 === 0 ? 6 : -4);
                const px = Math.cos(angle) * wobble;
                const py = Math.sin(angle) * wobble;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();

            const spillGradient = ctx.createRadialGradient(-8, -10, 6, 0, 0, currentRadius + 18);
            spillGradient.addColorStop(0, "rgba(255, 132, 163, 0.55)");
            spillGradient.addColorStop(0.35, "rgba(194, 28, 84, 0.92)");
            spillGradient.addColorStop(1, "rgba(63, 7, 24, 1)");

            ctx.fillStyle = spillGradient;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(255, 132, 163, 0.72)";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-8, -6, currentRadius * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 220, 230, 0.18)";
            ctx.fill();
            ctx.restore();
        }

        function drawDust(dust) {
            dust.twinkle += 0.08;
            const pulse = 0.75 + Math.sin(dust.twinkle) * 0.18;

            ctx.save();
            ctx.translate(dust.x, dust.y);

            ctx.beginPath();
            ctx.arc(0, 0, dust.size * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(118, 246, 255, 0.10)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, dust.size * pulse, 0, Math.PI * 2);
            ctx.fillStyle = dust.color;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-dust.size * 1.4, 0);
            ctx.lineTo(dust.size * 1.4, 0);
            ctx.moveTo(0, -dust.size * 1.4);
            ctx.lineTo(0, dust.size * 1.4);
            ctx.strokeStyle = "rgba(235, 253, 255, 0.85)";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        function drawPlayer() {
            ctx.beginPath();
            ctx.arc(player.x, player.y, stats.radius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(118, 246, 255, 0.08)";
            ctx.fill();
            ctx.strokeStyle = "rgba(118, 246, 255, 0.30)";
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.save();
            ctx.translate(player.x, player.y);
            player.angle += 0.05;
            ctx.rotate(player.angle);

            const coreGradient = ctx.createRadialGradient(-7, -9, 3, 0, 0, 28);
            coreGradient.addColorStop(0, "#d8ffff");
            coreGradient.addColorStop(0.4, "#7cf5ff");
            coreGradient.addColorStop(0.75, "#1d6f95");
            coreGradient.addColorStop(1, "#0d2434");

            ctx.shadowColor = "rgba(118, 246, 255, 0.48)";
            ctx.shadowBlur = 18;

            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.fillStyle = coreGradient;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(235, 253, 255, 0.96)";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(14, 0, 9, 0, Math.PI * 2);
            ctx.fillStyle = "#071520";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(118, 246, 255, 0.75)";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-7, -6, 4.4, 0, Math.PI * 2);
            ctx.arc(-7, 6, 4.4, 0, Math.PI * 2);
            ctx.fillStyle = "#0b1721";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(-7, -6, 2.1, 0, Math.PI * 2);
            ctx.arc(-7, 6, 2.1, 0, Math.PI * 2);
            ctx.fillStyle = "#67ffa8";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, 31, 0.55, 1.15);
            ctx.strokeStyle = "rgba(103, 255, 168, 0.55)";
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawFloor();

            ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
            particles.forEach(p => {
                p.y -= p.speed;
                if (p.y < 0) p.y = height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            player.x += (player.targetX - player.x) * stats.speed;
            player.y += (player.targetY - player.y) * stats.speed;

            spills.forEach(s => {
                s.pulse += 0.05;
                const r = s.radius + Math.sin(s.pulse) * 2;
                drawSpill(s, r);

                const dx = player.x - s.x;
                const dy = player.y - s.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < (r + 15)) {
                    gameOver();
                }
            });

            if (Math.random() < 0.05) spawnDust();
            if (Math.random() < 0.002) spawnSpill();

            for (let i = dusts.length - 1; i >= 0; i--) {
                const d = dusts[i];
                d.x += d.vx;
                d.y += d.vy;

                const dx = player.x - d.x;
                const dy = player.y - d.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < stats.radius) {
                    d.x += dx * 0.2;
                    d.y += dy * 0.2;

                    if (dist < 10) {
                        dusts.splice(i, 1);
                        totalCash += 10;
                        score += 10;
                        scoreNode.innerText = totalCash;
                        audio.playSFX('clean');
                        showReaction(cleanReaction, 520);
                        continue;
                    }
                }

                drawDust(d);
            }

            drawPlayer();
            requestAnimationFrame(gameLoop);
        }

        function updateShopUI() {
            radiusLevelNode.innerText = stats.radiusLevel;
            radiusCostNode.innerText = "$" + stats.radiusCost;
            const btnRadius = document.getElementById('buy-radius');
            btnRadius.disabled = totalCash < stats.radiusCost;

            speedLevelNode.innerText = stats.speedLevel;
            speedCostNode.innerText = "$" + stats.speedCost;
            const btnSpeed = document.getElementById('buy-speed');
            btnSpeed.disabled = totalCash < stats.speedCost;

            finalScoreNode.innerText = totalCash;
            scoreNode.innerText = totalCash;
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showReaction(failReaction, 1400);

            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');

            updateShopUI();
        }

        function startRun() {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');

            player.x = width / 2;
            player.y = height / 2;
            player.targetX = width / 2;
            player.targetY = height / 2;

            gameActive = true;
            initGame();
            updateShopUI();
            gameLoop();
        }

        function restartRun() {
            audio.unlock();
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            audio.playSFX('start');
            audio.playBGM();
            gameActive = true;
            initGame();
            updateShopUI();
            gameLoop();
        }

        /** 6. CONTROLS & SHOP LOGIC */
        document.getElementById('start-btn').addEventListener('click', startRun);
        document.getElementById('restart-btn').addEventListener('click', restartRun);

        document.getElementById('buy-radius').addEventListener('click', () => {
            if (totalCash >= stats.radiusCost) {
                totalCash -= stats.radiusCost;
                stats.radius += 15;
                stats.radiusLevel++;
                stats.radiusCost = Math.floor(stats.radiusCost * 1.5);
                audio.playSFX('buy');
                updateShopUI();
            } else {
                audio.playSFX('blocked');
            }
        });

        document.getElementById('buy-speed').addEventListener('click', () => {
            if (totalCash >= stats.speedCost) {
                totalCash -= stats.speedCost;
                stats.speed = Math.min(stats.speed + 0.02, 0.25);
                stats.speedLevel++;
                stats.speedCost = Math.floor(stats.speedCost * 1.5);
                audio.playSFX('buy');
                updateShopUI();
            } else {
                audio.playSFX('blocked');
            }
        });

        updateShopUI();
    });
    </script>
</body>
</html>
