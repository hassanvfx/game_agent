<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guardian Arena: Trinity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <!-- [agent-note][stage4] repaired: font-remap | title/hud -> Orbitron, ui/body -> Exo 2 from catalogs/fonts.json -->
    <style>
        :root {
            --bg-deep: #04030b;
            --bg-core: #0a0a12;
            --bg-grid: rgba(255, 255, 255, 0.04);
            --panel-bg: rgba(11, 16, 33, 0.72);
            --panel-border: rgba(125, 249, 255, 0.24);
            --panel-shadow: 0 10px 40px rgba(0, 0, 0, 0.48);
            --text-main: #f5f7ff;
            --text-soft: #9fb2d6;
            --accent-cyan: #7df9ff;
            --accent-violet: #8a7dff;
            --accent-gold: #ffd76a;
            --danger: #ff5f7a;
        }

        /* Base Setup */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(125, 249, 255, 0.09), transparent 32%),
                radial-gradient(circle at bottom, rgba(138, 125, 255, 0.14), transparent 38%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-core));
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            position: relative;
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
        }

        /* Layout Helpers */
        .screen {
            position: absolute;
            inset: 0;
        }

        .hidden {
            display: none !important;
        }

        .centered-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(24, 33, 66, 0.78), rgba(8, 13, 27, 0.88)),
                var(--panel-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
        }

        .neon-text {
            text-shadow: 0 0 12px currentColor, 0 0 28px rgba(125, 249, 255, 0.18);
        }

        .hud {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .hud-card {
            min-width: 96px;
            padding: 10px 12px 12px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(24, 38, 74, 0.82), rgba(9, 14, 28, 0.88));
            border: 1px solid rgba(125, 249, 255, 0.22);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 10px 24px rgba(0, 0, 0, 0.28);
        }

        .hud-label {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 11px;
            color: var(--text-soft);
            letter-spacing: 0.28em;
        }

        .score-value {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            margin-top: 8px;
        }

        .wave-value {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            margin-top: 8px;
        }

        .right-align {
            text-align: right;
        }

        .controls-hint {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 22px;
            margin: 0 auto;
            width: min(88vw, 340px);
            text-align: center;
            color: rgba(245, 247, 255, 0.8);
            font-size: 12px;
            letter-spacing: 0.14em;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(9, 14, 28, 0.68);
            border: 1px solid rgba(125, 249, 255, 0.16);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            animation: hintPulse 1.6s ease-in-out infinite;
        }

        .start-screen {
            z-index: 20;
            background:
                radial-gradient(circle at 50% 16%, rgba(125, 249, 255, 0.12), transparent 32%),
                linear-gradient(180deg, rgba(5, 7, 18, 0.96), rgba(4, 6, 14, 0.98));
            padding: 24px;
            text-align: center;
        }

        .game-title {
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(42px, 10vw, 68px);
            font-weight: 700;
            line-height: 0.92;
            letter-spacing: 0.08em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .title-accent {
            color: var(--accent-cyan);
        }

        .subtitle {
            margin: 0 0 18px;
            color: var(--text-soft);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            font-size: 11px;
        }

        .hero-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            color: var(--accent-gold);
            font-size: 14px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .hero-core {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background:
                radial-gradient(circle, #fff8c4 0 28%, #ffd76a 29% 52%, rgba(255, 215, 106, 0.18) 53% 100%);
            box-shadow:
                0 0 18px rgba(255, 215, 106, 0.58),
                0 0 34px rgba(125, 249, 255, 0.22);
            animation: corePulse 1.9s ease-in-out infinite;
        }

        .selection-grid {
            width: 100%;
            max-width: 420px;
            display: grid;
            gap: 14px;
            pointer-events: auto;
        }

        .class-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
            border: 2px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .class-card::after {
            content: '';
            position: absolute;
            inset: auto -10% -40% 35%;
            height: 72px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 65%);
            pointer-events: none;
        }

        .class-card:active {
            transform: scale(0.96);
        }

        .class-card:hover {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 22px rgba(125, 249, 255, 0.12);
        }

        .theme-fury {
            color: #ff2a68;
            border-color: rgba(255, 42, 104, 0.3);
        }

        .theme-winter {
            color: #00f2ff;
            border-color: rgba(0, 242, 255, 0.3);
        }

        .theme-lighting {
            color: #ffcc00;
            border-color: rgba(255, 204, 0, 0.3);
        }

        .class-icon {
            width: 48px;
            height: 48px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .icon-fury {
            background: linear-gradient(135deg, #ef4444, #db2777);
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.35);
        }

        .icon-winter {
            background: linear-gradient(135deg, #22d3ee, #2563eb);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
        }

        .icon-lighting {
            background: linear-gradient(135deg, #fde047, #f97316);
            box-shadow: 0 0 18px rgba(250, 204, 21, 0.35);
        }

        .icon-core {
            width: 24px;
            height: 24px;
            background: #ffffff;
            border-radius: 999px;
        }

        .icon-diamond {
            width: 18px;
            height: 18px;
            border: 4px solid #ffffff;
            transform: rotate(45deg);
            box-sizing: border-box;
        }

        .icon-bolt {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ffffff;
        }

        .class-copy {
            flex: 1;
            min-width: 0;
        }

        .class-name {
            margin: 0 0 4px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
        }

        .class-desc {
            margin: 0;
            font-size: 11px;
            letter-spacing: 0.12em;
            color: var(--text-soft);
        }

        .desc-fury {
            color: #fda4af;
        }

        .desc-winter {
            color: #67e8f9;
        }

        .desc-lighting {
            color: #fde68a;
        }

        .game-over-screen {
            z-index: 30;
            background:
                radial-gradient(circle at center, rgba(255, 95, 122, 0.18), transparent 36%),
                rgba(20, 5, 16, 0.92);
            backdrop-filter: blur(10px);
            text-align: center;
            padding: 24px;
        }

        .game-over-title {
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(40px, 9vw, 58px);
            font-weight: 700;
            color: #fff2f6;
        }

        .game-over-score {
            margin: 0 0 24px;
            font-size: 20px;
            color: #fecaca;
            letter-spacing: 0.12em;
        }

        .retry-button {
            pointer-events: auto;
            padding: 12px 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: linear-gradient(135deg, #fff4c1, #ffd76a);
            color: #24140a;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .retry-button:hover,
        .retry-button:active {
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(255, 215, 106, 0.4);
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.62; }
            50% { opacity: 1; }
        }

        .feedback-layer {
            position: absolute;
            inset: 0;
            z-index: 24;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: min(28vw, 120px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(125, 249, 255, 0.24);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 180ms ease, transform 180ms ease;
            background: rgba(4, 6, 14, 0.55);
        }

        .feedback-gif.active {
            opacity: 0.94;
            transform: scale(1);
        }

        .feedback-gif.hit-gif {
            left: 14px;
            bottom: 96px;
        }

        .feedback-gif.defeat-gif {
            right: 14px;
            top: 112px;
        }

        @keyframes corePulse {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.14); }
        }

        @media (max-width: 640px) {
            .hud {
                padding: 12px;
            }

            .hud-card {
                min-width: 82px;
                padding: 9px 10px 10px;
            }

            .score-value {
                font-size: 26px;
            }

            .wave-value {
                font-size: 20px;
            }

            .controls-hint {
                bottom: 16px;
                font-size: 11px;
                padding: 9px 12px;
                letter-spacing: 0.1em;
            }

            .game-title {
                font-size: clamp(38px, 12vw, 56px);
            }

            .hero-banner {
                font-size: 12px;
            }

            .class-name {
                font-size: 20px;
            }

            .class-desc {
                font-size: 10px;
            }

            .retry-button {
                font-size: 16px;
            }

            .feedback-gif {
                width: min(24vw, 88px);
            }

            .feedback-gif.hit-gif {
                left: 10px;
                bottom: 84px;
            }

            .feedback-gif.defeat-gif {
                right: 10px;
                top: 96px;
            }
        }
    </style>
</head>
<body>

<div id="game-ui" class="ui-layer">
    <div id="hud" class="hud hidden">
        <div class="hud-card">
            <div class="hud-label">SCORE</div>
            <div id="score-display" class="score-value neon-text">0</div>
        </div>
        <div class="hud-card right-align">
            <div class="hud-label">WAVE</div>
            <div id="wave-display" class="wave-value">1</div>
        </div>
    </div>

    <div id="controls-hint" class="controls-hint hidden">
        DRAG TO MOVE • TAP TO SHOOT
    </div>
</div>

<div id="feedback-layer" class="feedback-layer" aria-hidden="true">
    <img id="hit-gif" class="feedback-gif hit-gif" alt="" loading="lazy" decoding="async">
    <img id="defeat-gif" class="feedback-gif defeat-gif" alt="" loading="lazy" decoding="async">
</div>

<div id="start-screen" class="screen start-screen centered-column">
    <div class="hero-banner"><span class="hero-core" aria-hidden="true"></span> Trinity Core Online</div>
    <h1 class="game-title neon-text">GUARDIAN<br><span class="title-accent">ARENA</span></h1>
    <p class="subtitle">Choose Your Guardian Shell</p>

    <div class="selection-grid">
        <div onclick="startGame('fury')" class="class-card panel theme-fury">
            <div class="class-icon icon-fury">
                <div class="icon-core"></div>
            </div>
            <div class="class-copy">
                <div class="class-name">FURY</div>
                <p class="class-desc desc-fury">HIGH DMG • EXPLOSIVE • SLOW CD</p>
            </div>
        </div>

        <div onclick="startGame('winter')" class="class-card panel theme-winter">
            <div class="class-icon icon-winter">
                <div class="icon-diamond"></div>
            </div>
            <div class="class-copy">
                <div class="class-name">WINTER</div>
                <p class="class-desc desc-winter">LOW DMG • SLOWS ENEMIES • FAST</p>
            </div>
        </div>

        <div onclick="startGame('lighting')" class="class-card panel theme-lighting">
            <div class="class-icon icon-lighting">
                <div class="icon-bolt"></div>
            </div>
            <div class="class-copy">
                <div class="class-name">LIGHTING</div>
                <p class="class-desc desc-lighting">CHAIN ATTACK • MULTI-HIT</p>
            </div>
        </div>
    </div>
</div>

<div id="game-over-screen" class="screen game-over-screen centered-column hidden">
    <h2 class="game-over-title">DEFEAT</h2>
    <div class="game-over-score">SCORE: <span id="final-score">0</span></div>
    <button onclick="resetGame()" class="retry-button">TRY AGAIN</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/* --- Configuration & State --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const hitGif = document.getElementById('hit-gif');
const defeatGif = document.getElementById('defeat-gif');

const MEDIA = {
    audio: {
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3',
        enemyHit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3',
        explosion: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3',
        chain: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3',
        defeat: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3',
        loop: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'
    },
    gifs: {
        hit: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp',
        defeat: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
    }
};

const AudioSys = {
    started: false,
    enabled: false,
    sounds: {},
    loop: null,
    init() {
        if (this.started) return;
        this.started = true;
        this.enabled = true;
        try {
            this.sounds.start = this.makeAudio(MEDIA.audio.start, 0.42);
            this.sounds.shoot = this.makeAudio(MEDIA.audio.shoot, 0.24);
            this.sounds.enemyHit = this.makeAudio(MEDIA.audio.enemyHit, 0.22);
            this.sounds.explosion = this.makeAudio(MEDIA.audio.explosion, 0.26);
            this.sounds.chain = this.makeAudio(MEDIA.audio.chain, 0.18);
            this.sounds.defeat = this.makeAudio(MEDIA.audio.defeat, 0.34);
            this.loop = this.makeAudio(MEDIA.audio.loop, 0.18, true);
        } catch (error) {
            this.enabled = false;
        }
    },
    makeAudio(src, volume, loop = false) {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = volume;
        audio.loop = loop;
        return audio;
    },
    prime() {
        this.init();
        if (!this.enabled) return;
        for (const sound of Object.values(this.sounds)) {
            if (!sound) continue;
            const playPromise = sound.play();
            if (playPromise && typeof playPromise.then === 'function') {
                playPromise.then(() => {
                    sound.pause();
                    sound.currentTime = 0;
                }).catch(() => {});
            }
        }
        if (this.loop) {
            const playPromise = this.loop.play();
            if (playPromise && typeof playPromise.then === 'function') {
                playPromise.then(() => {
                    this.loop.pause();
                    this.loop.currentTime = 0;
                }).catch(() => {});
            }
        }
    },
    play(name, reset = true) {
        if (!this.enabled) return;
        const sound = this.sounds[name];
        if (!sound) return;
        try {
            if (reset) sound.currentTime = 0;
            const playPromise = sound.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (error) {}
    },
    startLoop() {
        if (!this.enabled || !this.loop) return;
        try {
            const playPromise = this.loop.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (error) {}
    },
    stopLoop() {
        if (!this.loop) return;
        this.loop.pause();
        this.loop.currentTime = 0;
    }
};

const feedbackTimers = new Map();

function flashGif(element, src, duration = 520) {
    if (!element) return;
    element.src = src;
    element.classList.add('active');
    clearTimeout(feedbackTimers.get(element));
    const timer = setTimeout(() => {
        element.classList.remove('active');
    }, duration);
    feedbackTimers.set(element, timer);
}

let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
let lastTime = 0;
let score = 0;
let wave = 1;

// Inputs
let touchStart = { x: 0, y: 0, time: 0, active: false };
let joystick = { active: false, originX: 0, originY: 0, currentX: 0, currentY: 0, dx: 0, dy: 0 };
let tapThreshold = { time: 200, dist: 15 }; // ms, px

// Game Entities
const player = {
    x: 0, y: 0, radius: 18,
    vx: 0, vy: 0, speed: 4,
    class: 'fury',
    hp: 100,
    cooldown: 0, maxCooldown: 0,
    color: '#fff'
};

const CHARS = {
    fury: { color: '#ff2a68', cd: 1200, speed: 3.5, dmg: 100, radius: 12, type: 'explosive' },
    winter: { color: '#00f2ff', cd: 200, speed: 4.5, dmg: 15, radius: 5, type: 'slow' },
    lighting: { color: '#ffcc00', cd: 600, speed: 4.0, dmg: 35, radius: 8, type: 'chain' }
};

let enemies = [];
let projectiles = [];
let particles = [];
let spawnTimer = 0;
let spawnRate = 1000;

/* --- Core Loop --- */
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (gameState === 'MENU') {
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
    }
}
window.addEventListener('resize', resize);
resize();

function gameLoop(timestamp) {
    const dt = Math.min(timestamp - lastTime, 50);
    lastTime = timestamp;

    if (gameState === 'PLAYING') {
        update(dt);
        draw();
    } else if (gameState === 'MENU') {
        drawMenuBg(timestamp);
    }

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* --- Game Logic --- */
function startGame(cls) {
    AudioSys.prime();
    AudioSys.play('start');
    AudioSys.startLoop();
    player.class = cls;
    player.color = CHARS[cls].color;
    player.maxCooldown = CHARS[cls].cd;
    player.speed = CHARS[cls].speed;

    // Reset State
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.vx = 0; player.vy = 0;
    player.hp = 100;
    player.cooldown = 0;

    enemies = [];
    projectiles = [];
    particles = [];
    score = 0;
    wave = 1;
    spawnRate = 1000;
    spawnTimer = 0;

    // UI
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls-hint').classList.remove('hidden');
    setTimeout(() => document.getElementById('controls-hint').classList.add('hidden'), 4000);

    gameState = 'PLAYING';
}

function resetGame() {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    defeatGif.classList.remove('active');
    AudioSys.stopLoop();
    gameState = 'MENU';
}

function update(dt) {
    // Player Movement (Joystick)
    if (joystick.active) {
        // Normalize vector
        const dist = Math.sqrt(joystick.dx*joystick.dx + joystick.dy*joystick.dy);
        if (dist > 0) {
            const speed = player.speed * (dt / 16);
            player.x += (joystick.dx / dist) * speed;
            player.y += (joystick.dy / dist) * speed;
        }
    }

    // Bounds
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    // Cooldown
    if (player.cooldown > 0) player.cooldown -= dt;

    // Spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(200, spawnRate - (score * 1.5));
    }

    // Entities Update
    updateProjectiles(dt);
    updateEnemies(dt);
    updateParticles(dt);

    // HUD
    document.getElementById('score-display').innerText = score;
    document.getElementById('wave-display').innerText = wave;
}

function spawnEnemy() {
    const edge = Math.floor(Math.random() * 4);
    let ex, ey;
    const pad = 30;
    if (edge === 0) { ex = Math.random() * canvas.width; ey = -pad; }
    else if (edge === 1) { ex = canvas.width + pad; ey = Math.random() * canvas.height; }
    else if (edge === 2) { ex = Math.random() * canvas.width; ey = canvas.height + pad; }
    else { ex = -pad; ey = Math.random() * canvas.height; }

    const baseSpeed = 1.5 + (score / 1000);
    enemies.push({
        x: ex, y: ey,
        hp: 30 + (score * 0.5),
        maxHp: 30 + (score * 0.5),
        speed: Math.min(baseSpeed, 6),
        radius: 14,
        color: '#ff4444',
        slowTimer: 0
    });
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];

        // Chase Player
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // Collision with Player
        if (dist < player.radius + e.radius) {
            gameOver();
            return;
        }

        // Move
        let currentSpeed = e.speed;
        if (e.slowTimer > 0) {
            currentSpeed *= 0.5;
            e.slowTimer -= dt;
        }

        e.x += (dx / dist) * currentSpeed * (dt/16);
        e.y += (dy / dist) * currentSpeed * (dt/16);
    }
}

function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.life -= dt;

        if (p.life <= 0) {
            projectiles.splice(i, 1);
            continue;
        }

        p.x += p.vx * (dt/16);
        p.y += p.vy * (dt/16);

        // Bounds
        if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
            projectiles.splice(i, 1);
            continue;
        }

        // Hit Detection
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            let dx = p.x - e.x;
            let dy = p.y - e.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < e.radius + p.radius) {
                // Hit!
                hitEnemy(e, p, j);
                projectiles.splice(i, 1);
                break;
            }
        }
    }
}

function hitEnemy(e, p, index) {
    e.hp -= p.dmg;
    AudioSys.play('enemyHit');
    flashGif(hitGif, MEDIA.gifs.hit, 420);

    // Effects
    createParticles(e.x, e.y, p.color, 5);

    if (p.type === 'slow') {
        e.slowTimer = 2000; // 2s slow
    } else if (p.type === 'explosive') {
        // AOE
        AudioSys.play('explosion');
        createExplosion(e.x, e.y, 60, p.dmg * 0.5);
    } else if (p.type === 'chain') {
        chainLightning(e, 3, p.dmg);
    }

    if (e.hp <= 0) {
        killEnemy(index);
    }
}

function chainLightning(source, jumps, dmg) {
    if (jumps <= 0) return;

    // Find nearest neighbor
    let nearest = null;
    let minDist = 200; // Chain range

    enemies.forEach(other => {
        if (other === source) return;
        const d = Math.sqrt((source.x - other.x)**2 + (source.y - other.y)**2);
        if (d < minDist) {
            minDist = d;
            nearest = other;
        }
    });

    if (nearest) {
        // Visual Bolt
        particles.push({
            type: 'bolt',
            x1: source.x, y1: source.y,
            x2: nearest.x, y2: nearest.y,
            life: 150, maxLife: 150,
            color: '#ffcc00'
        });
        AudioSys.play('chain');

        nearest.hp -= dmg;
        createParticles(nearest.x, nearest.y, '#ffcc00', 3);

        if (nearest.hp <= 0) {
             const idx = enemies.indexOf(nearest);
             if (idx > -1) killEnemy(idx);
        } else {
            chainLightning(nearest, jumps - 1, dmg);
        }
    }
}

function createExplosion(x, y, radius, dmg) {
    // Visual
    particles.push({
        type: 'ring', x: x, y: y, size: 10, maxSize: radius,
        life: 300, maxLife: 300, color: '#ff2a68'
    });

    // Damage
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let d = Math.sqrt((x-e.x)**2 + (y-e.y)**2);
        if (d < radius) {
            e.hp -= dmg;
            if (e.hp <= 0) killEnemy(i);
        }
    }
}

function killEnemy(index) {
    const e = enemies[index];
    if (!e) return; // Already dead
    createParticles(e.x, e.y, e.color, 10);
    enemies.splice(index, 1);
    score += 10;
    if (score % 200 === 0) wave++;
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        if (p.type === 'bolt') {
            // Static line, no move
        } else if (p.type === 'ring') {
            p.size += (p.maxSize - p.size) * 0.1;
        } else {
            p.x += p.vx * (dt/16);
            p.y += p.vy * (dt/16);
            p.vx *= 0.9;
            p.vy *= 0.9;
        }
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    AudioSys.stopLoop();
    AudioSys.play('defeat');
    flashGif(defeatGif, MEDIA.gifs.defeat, 1600);
    document.getElementById('final-score').innerText = score;
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
}

/* --- Input Handling --- */
canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;

    touchStart.active = true;
    touchStart.x = e.clientX;
    touchStart.y = e.clientY;
    touchStart.time = Date.now();

    joystick.active = true;
    joystick.originX = e.clientX;
    joystick.originY = e.clientY;
    joystick.currentX = e.clientX;
    joystick.currentY = e.clientY;
    joystick.dx = 0;
    joystick.dy = 0;
});

canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!joystick.active) return;

    joystick.currentX = e.clientX;
    joystick.currentY = e.clientY;

    const dx = e.clientX - joystick.originX;
    const dy = e.clientY - joystick.originY;

    // Deadzone check for movement
    if (Math.sqrt(dx*dx + dy*dy) > 10) {
        joystick.dx = dx;
        joystick.dy = dy;
    }
});

canvas.addEventListener('pointerup', e => {
    e.preventDefault();
    if (!touchStart.active) return;

    const duration = Date.now() - touchStart.time;
    const dist = Math.sqrt((e.clientX - touchStart.x)**2 + (e.clientY - touchStart.y)**2);

    if (duration < tapThreshold.time && dist < tapThreshold.dist) {
        // It's a TAP -> Shoot
        shoot(e.clientX, e.clientY);
    }

    resetPointerInput();
});

canvas.addEventListener('pointercancel', resetPointerInput);
canvas.addEventListener('pointerleave', resetPointerInput);

function resetPointerInput() {
    touchStart.active = false;
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
}

function shoot(tx, ty) {
    if (player.cooldown > 0) return;

    const stats = CHARS[player.class];
    player.cooldown = stats.cd;
    AudioSys.play('shoot');

    const angle = Math.atan2(ty - player.y, tx - player.x);

    projectiles.push({
        x: player.x, y: player.y,
        vx: Math.cos(angle) * stats.speed * 4, // Projectile speed multiplier
        vy: Math.sin(angle) * stats.speed * 4,
        radius: stats.radius,
        color: stats.color,
        dmg: stats.dmg,
        type: stats.type,
        life: 2000
    });

    // Recoil
    player.x -= Math.cos(angle) * 5;
    player.y -= Math.sin(angle) * 5;
}

/* --- Drawing --- */
function draw() {
    // Clear
    const arenaGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    arenaGradient.addColorStop(0, '#070814');
    arenaGradient.addColorStop(1, '#020309');
    ctx.fillStyle = arenaGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const halo = ctx.createRadialGradient(player.x, player.y, player.radius * 0.5, player.x, player.y, Math.max(canvas.width, canvas.height) * 0.45);
    halo.addColorStop(0, `${player.color}33`);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = 'rgba(125,249,255,0.06)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Joystick Indicator
    if (joystick.active) {
        ctx.strokeStyle = 'rgba(125,249,255,0.24)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(joystick.originX, joystick.originY, 40, 0, Math.PI*2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(125,249,255,0.38)';
        ctx.beginPath();
        ctx.arc(joystick.currentX, joystick.currentY, 15, 0, Math.PI*2);
        ctx.fill();
    }

    // Player
    ctx.shadowBlur = 24;
    ctx.shadowColor = player.color;
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(player.x - player.radius * 0.28, player.y - player.radius * 0.32, player.radius * 0.34, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Cooldown Ring
    if (player.cooldown > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.72)';
        ctx.lineWidth = 3;
        const ratio = player.cooldown / player.maxCooldown;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 8, -Math.PI/2, -Math.PI/2 + (Math.PI*2 * (1-ratio)));
        ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Enemies
    enemies.forEach(e => {
        ctx.fillStyle = e.slowTimer > 0 ? '#8ef7ff' : '#ff5f7a';
        ctx.shadowBlur = 14;
        ctx.shadowColor = e.slowTimer > 0 ? '#8ef7ff' : '#ff5f7a';
        ctx.beginPath();
        ctx.moveTo(e.x, e.y - e.radius);
        ctx.lineTo(e.x + e.radius, e.y);
        ctx.lineTo(e.x, e.y + e.radius);
        ctx.lineTo(e.x - e.radius, e.y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.24)';
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * 0.32, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // HP Bar
        const hpPct = e.hp / e.maxHp;
        if (hpPct < 1) {
            ctx.fillStyle = 'rgba(12, 16, 28, 0.88)';
            ctx.fillRect(e.x - 12, e.y - 22, 24, 4);
            ctx.fillStyle = e.slowTimer > 0 ? '#8ef7ff' : '#ffd76a';
            ctx.fillRect(e.x - 12, e.y - 22, 24 * hpPct, 4);
        }
    });

    // Projectiles
    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Particles
    particles.forEach(p => {
        if (p.type === 'bolt') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.moveTo(p.x1, p.y1);
            const midX = (p.x1 + p.x2)/2 + (Math.random()-0.5)*20;
            const midY = (p.y1 + p.y2)/2 + (Math.random()-0.5)*20;
            ctx.lineTo(midX, midY);
            ctx.lineTo(p.x2, p.y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        } else if (p.type === 'ring') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 500;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    });
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 400 + Math.random()*200
        });
    }
}

function drawMenuBg(t) {
    const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bg.addColorStop(0, '#060812');
    bg.addColorStop(1, '#020308');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < 20; i++) {
        const x = (Math.sin(i + t * 0.0001) * canvas.width / 2) + canvas.width / 2;
        const y = (Math.cos(i * 1.5 + t * 0.0002) * canvas.height / 2) + canvas.height / 2;
        const pulse = 2 + Math.sin(t * 0.002 + i) * 0.9;

        ctx.fillStyle = i % 3 === 0 ? 'rgba(255, 215, 106, 0.34)' : i % 2 === 0 ? 'rgba(125, 249, 255, 0.28)' : 'rgba(138, 125, 255, 0.24)';
        ctx.beginPath();
        ctx.arc(x, y, pulse, 0, Math.PI * 2);
        ctx.fill();
    }
}
