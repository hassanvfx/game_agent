<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Zero Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: display -> Orbitron, ui -> Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6cf5ff;
            --primary-strong: #9b7cff;
            --primary-soft: rgba(108, 245, 255, 0.18);
            --danger: #ff4f7b;
            --danger-deep: #a50f49;
            --warning: #ffcf70;
            --text: #f5fbff;
            --bg: #080b16;
            --bg-deep: #05070f;
            --panel: rgba(8, 14, 32, 0.82);
            --panel-border: rgba(108, 245, 255, 0.42);
            --ui-font: 'Rajdhani', 'Segoe UI', sans-serif;
            --display-font: 'Orbitron', 'Arial Black', sans-serif;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(155, 124, 255, 0.16), transparent 28%),
                radial-gradient(circle at bottom, rgba(108, 245, 255, 0.10), transparent 35%),
                linear-gradient(180deg, #0a1020 0%, var(--bg) 52%, var(--bg-deep) 100%);
            font-family: var(--ui-font);
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        #game-container::before {
            background:
                radial-gradient(circle at 20% 20%, rgba(108, 245, 255, 0.12), transparent 0 22%),
                radial-gradient(circle at 80% 10%, rgba(155, 124, 255, 0.12), transparent 0 18%),
                radial-gradient(circle at 50% 80%, rgba(255, 79, 123, 0.10), transparent 0 20%);
            opacity: 0.9;
        }
        #game-container::after {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 12%, transparent 88%, rgba(108, 245, 255, 0.08));
            mix-blend-mode: screen;
            opacity: 0.45;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        .screen {
            pointer-events: auto;
            text-align: center;
            background:
                linear-gradient(180deg, rgba(17, 24, 45, 0.94), rgba(8, 14, 32, 0.92)),
                radial-gradient(circle at top, rgba(108, 245, 255, 0.12), transparent 40%);
            padding: clamp(1rem, 4vw, 2rem);
            width: min(92vw, 420px);
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.42), 0 0 24px rgba(108, 245, 255, 0.12), inset 0 0 0 1px rgba(255,255,255,0.04);
            display: none;
            position: relative;
            overflow: hidden;
        }
        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.04) 18%, transparent 40%),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 10px);
            pointer-events: none;
            opacity: 0.7;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            animation: popIn 0.3s ease-out;
        }
        h1 {
            color: var(--primary);
            margin: 0;
            font-family: var(--display-font);
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            text-shadow: 0 0 12px rgba(108, 245, 255, 0.38);
        }
        p {
            color: var(--text);
            margin: 0;
            font-size: clamp(1rem, 3.7vw, 1.08rem);
            line-height: 1.4;
            opacity: 0.88;
        }
        .flavor-line {
            font-size: 0.82rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--warning);
            opacity: 0.95;
        }
        button {
            background: linear-gradient(180deg, var(--primary), #39cfff);
            color: #061019;
            border: none;
            padding: 14px 24px;
            font-size: clamp(1rem, 4vw, 1.1rem);
            font-weight: 600;
            font-family: var(--ui-font);
            cursor: pointer;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            box-shadow: 0 10px 24px rgba(57, 207, 255, 0.28);
            align-self: center;
            min-width: min(100%, 220px);
        }
        button:active {
            transform: scale(0.96);
            filter: brightness(1.06);
        }
        #hud {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            color: var(--text);
            font-size: clamp(0.92rem, 3vw, 1.04rem);
            font-weight: 600;
            pointer-events: none;
            display: none;
            padding: 10px 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(12, 20, 41, 0.88), rgba(8, 13, 28, 0.72));
            border: 1px solid rgba(108, 245, 255, 0.34);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(6px);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: var(--ui-font);
        }
        #score-val {
            color: var(--primary);
            font-family: var(--display-font);
            margin-left: 0.35rem;
        }
        #mute-btn {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            width: 46px;
            height: 46px;
            background: linear-gradient(180deg, rgba(15, 23, 46, 0.94), rgba(8, 14, 32, 0.82));
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text);
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
        }
        #feedback-overlay {
            position: absolute;
            inset: auto max(16px, env(safe-area-inset-right)) max(18px, calc(env(safe-area-inset-bottom) + 18px)) auto;
            width: min(34vw, 132px);
            min-width: 84px;
            aspect-ratio: 1 / 1;
            pointer-events: none;
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 80;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
        }
        #feedback-overlay.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        #feedback-gif {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 18px;
            border: 1px solid rgba(108, 245, 255, 0.28);
            background: rgba(3, 8, 18, 0.28);
        }
        #feedback-caption {
            position: absolute;
            left: 50%;
            bottom: -12px;
            transform: translateX(-50%);
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(6, 11, 24, 0.92);
            border: 1px solid rgba(108, 245, 255, 0.25);
            color: var(--primary);
            font-size: 0.72rem;
            font-family: var(--display-font);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            padding: 0.38rem 0.9rem;
            border-radius: 999px;
            font-family: var(--display-font);
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--primary);
            border: 1px solid rgba(108, 245, 255, 0.3);
            background: rgba(108, 245, 255, 0.08);
        }
        .character-badge {
            width: 92px;
            height: 92px;
            margin: 0 auto 0.35rem;
            border-radius: 50%;
            border: 2px solid rgba(108, 245, 255, 0.5);
            box-shadow: 0 0 30px rgba(108, 245, 255, 0.22), inset 0 0 24px rgba(108, 245, 255, 0.12);
            position: relative;
            background:
                radial-gradient(circle at 50% 50%, rgba(108, 245, 255, 0.16), transparent 54%),
                radial-gradient(circle at 50% 50%, rgba(155, 124, 255, 0.18), transparent 74%);
        }
        .character-badge::before,
        .character-badge::after {
            content: "";
            position: absolute;
            inset: 15px;
            border-radius: 50%;
            border: 3px solid rgba(108, 245, 255, 0.9);
        }
        .character-badge::after {
            inset: 28px;
            border-color: rgba(155, 124, 255, 0.8);
            box-shadow: 0 0 18px rgba(155, 124, 255, 0.35);
        }
        @keyframes popIn {
            from { transform: scale(0.88); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @media (max-width: 480px) {
            .screen {
                gap: 0.8rem;
                border-radius: 18px;
            }
            button {
                width: 100%;
            }
            #feedback-overlay {
                width: min(28vw, 104px);
                right: max(12px, env(safe-area-inset-right));
                bottom: max(12px, calc(env(safe-area-inset-bottom) + 12px));
            }
            #feedback-caption {
                font-size: 0.62rem;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">SURVIVAL: <span id="score-val">0</span></div>
    <div id="mute-btn" aria-label="Toggle audio">🔊</div>

    <!-- [agent-note][stage3] resolved-gif: reaction overlays from catalogs/gifs.json | caution: keep-gif-off-playfield -->
    <div id="feedback-overlay" aria-hidden="true">
        <img
            id="feedback-gif"
            alt=""
            src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
        <div id="feedback-caption">Alert</div>
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen active">
            <div class="character-badge" aria-hidden="true"></div>
            <div class="status-chip">signal core online</div>
            <h1>ZERO CONTACT</h1>
            <p>Drag to drift. Keep the radiant core clear of every red breach.</p>
            <p style="font-size: 0.9rem; margin-top: 2px;">Survive the encroaching swarm as long as you can.</p>
            <button id="start-btn">Begin Run</button>
        </div>

        <div id="game-over-screen" class="screen">
            <div class="character-badge" aria-hidden="true"></div>
            <div class="status-chip" style="color: var(--danger); border-color: rgba(255,79,123,0.34); background: rgba(255,79,123,0.1);">containment broken</div>
            <h1 style="color: var(--danger); text-shadow: 0 0 12px rgba(255, 79, 123, 0.3);">CONTACT MADE</h1>
            <p>Survival: <span id="final-score">0</span></p>
            <button id="restart-btn">Run Again</button>
        </div>
    </div>
</div>

<script>
const MEDIA = {
    audio: {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
        start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
        uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
        warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
        defeat: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
        impact: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3"
    },
    gifs: {
        warning: "https://i.giphy.com/1qXINH0qhhsNDiu0T5.webp",
        defeat: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
    }
};

class AudioManager {
    constructor() {
        this.sounds = {};
        this.muted = false;
        this.bgmEnabled = false;
        this.lastPlayedAt = {};
        this.cooldowns = {
            uiClick: 120,
            warning: 850,
            defeat: 300,
            impact: 250,
            start: 250
        };

        this.createAudio("bgm", MEDIA.audio.bgm, { loop: true, volume: 0.22 });
        this.createAudio("start", MEDIA.audio.start, { volume: 0.45, preload: "auto" });
        this.createAudio("uiClick", MEDIA.audio.uiClick, { volume: 0.36, preload: "auto" });
        this.createAudio("warning", MEDIA.audio.warning, { volume: 0.42, preload: "auto" });
        this.createAudio("defeat", MEDIA.audio.defeat, { volume: 0.55, preload: "auto" });
        this.createAudio("impact", MEDIA.audio.impact, { volume: 0.45, preload: "auto" });
    }

    createAudio(key, src, options = {}) {
        const audio = new Audio(src);
        audio.preload = options.preload || "metadata";
        audio.loop = Boolean(options.loop);
        audio.volume = options.volume ?? 0.4;
        audio.crossOrigin = "anonymous";
        this.sounds[key] = audio;
    }

    primeFromGesture() {
        this.bgmEnabled = true;
        const bgm = this.sounds.bgm;
        if (!bgm) return;
        bgm.load();
    }

    toggleMute() {
        this.muted = !this.muted;
        Object.values(this.sounds).forEach((sound) => {
            sound.muted = this.muted;
        });

        if (this.muted) {
            this.pauseBGM();
        } else if (gameState === "PLAY" && this.bgmEnabled) {
            this.startBGM();
        }

        return this.muted;
    }

    canPlay(key) {
        const now = performance.now();
        const lastTime = this.lastPlayedAt[key] || 0;
        const cooldown = this.cooldowns[key] || 0;
        if (now - lastTime < cooldown) return false;
        this.lastPlayedAt[key] = now;
        return true;
    }

    playSFX(key) {
        if (this.muted || !this.sounds[key] || !this.canPlay(key)) return;
        const source = this.sounds[key];
        const clone = source.cloneNode(true);
        clone.volume = source.volume;
        clone.muted = this.muted;
        clone.crossOrigin = "anonymous";
        clone.play().catch(() => {});
    }

    startBGM() {
        if (this.muted || !this.bgmEnabled || !this.sounds.bgm) return;
        const bgm = this.sounds.bgm;
        bgm.play().catch(() => {});
    }

    pauseBGM() {
        const bgm = this.sounds.bgm;
        if (!bgm) return;
        bgm.pause();
    }

    stopBGM() {
        const bgm = this.sounds.bgm;
        if (!bgm) return;
        bgm.pause();
        bgm.currentTime = 0;
    }
}

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const audioManager = new AudioManager();

let gameState = "MENU";
let score = 0;
let lastTime = 0;
let spawnTimer = 0;
let difficultyMultiplier = 1;
let warningTriggered = false;
let feedbackTimer = 0;

const input = { x: 0, y: 0, active: false };

const player = {
    x: 0,
    y: 0,
    radius: 20,
    color: "#00f3ff",
    trail: []
};

let enemies = [];
let particles = [];

const startScreen = document.getElementById("start-screen");
const gameOverScreen = document.getElementById("game-over-screen");
const hud = document.getElementById("hud");
const scoreVal = document.getElementById("score-val");
const finalScore = document.getElementById("final-score");
const muteBtn = document.getElementById("mute-btn");
const feedbackOverlay = document.getElementById("feedback-overlay");
const feedbackGif = document.getElementById("feedback-gif");
const feedbackCaption = document.getElementById("feedback-caption");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (gameState === "MENU") {
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        input.x = player.x;
        input.y = player.y;
    }
}
window.addEventListener("resize", resize);
resize();

function handleInput(x, y) {
    input.x = x;
    input.y = y;
    input.active = true;
}

window.addEventListener("mousemove", (e) => handleInput(e.clientX, e.clientY));

// [agent-note][stage4] repaired: mobile-action-path | scope: gameplay-touch-input | reason: avoid global tap suppression so menu/buttons still receive native mobile activation
canvas.addEventListener("touchmove", (e) => {
    if (gameState !== "PLAY" || !e.touches.length) return;
    e.preventDefault();
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener("touchstart", (e) => {
    if (!e.touches.length) return;
    if (gameState === "PLAY") {
        e.preventDefault();
    }
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("restart-btn").addEventListener("click", startGame);

muteBtn.addEventListener("click", () => {
    audioManager.playSFX("uiClick");
    const isMuted = audioManager.toggleMute();
    muteBtn.textContent = isMuted ? "🔇" : "🔊";
});

function showFeedback(type, label, duration = 1100) {
    feedbackGif.src = MEDIA.gifs[type];
    feedbackCaption.textContent = label;
    feedbackOverlay.classList.add("show");
    feedbackTimer = duration;
}

function hideFeedback() {
    feedbackOverlay.classList.remove("show");
}

function startGame() {
    audioManager.primeFromGesture();
    audioManager.playSFX("start");
    audioManager.startBGM();

    gameState = "PLAY";
    score = 0;
    difficultyMultiplier = 1;
    spawnTimer = 0;
    warningTriggered = false;
    enemies = [];
    particles = [];
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    input.x = player.x;
    input.y = player.y;
    player.trail = [];

    startScreen.classList.remove("active");
    gameOverScreen.classList.remove("active");
    hud.style.display = "block";
    scoreVal.textContent = "0";
    hideFeedback();
}

function gameOver() {
    gameState = "GAMEOVER";
    audioManager.stopBGM();
    audioManager.playSFX("impact");
    audioManager.playSFX("defeat");
    showFeedback("defeat", "Breach", 1800);

    hud.style.display = "none";
    gameOverScreen.classList.add("active");
    finalScore.textContent = Math.floor(score);
}

function nearestEnemyDistance() {
    if (!enemies.length) return Infinity;
    let minDistance = Infinity;
    for (const enemy of enemies) {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy) - enemy.radius - player.radius;
        if (dist < minDistance) minDistance = dist;
    }
    return minDistance;
}

function update(dt) {
    if (feedbackTimer > 0) {
        feedbackTimer -= dt * 1000;
        if (feedbackTimer <= 0) hideFeedback();
    }

    if (gameState !== "PLAY") return;

    score += dt * 10;
    scoreVal.textContent = Math.floor(score);
    difficultyMultiplier = 1 + (score / 1000);

    const speed = 0.15;
    player.x += (input.x - player.x) * speed;
    player.y += (input.y - player.y) * speed;

    player.trail.push({ x: player.x, y: player.y, age: 1 });
    player.trail.forEach((t) => t.age -= dt * 5);
    player.trail = player.trail.filter((t) => t.age > 0);

    spawnTimer += dt;
    const spawnRate = 1.0 / difficultyMultiplier;
    if (spawnTimer > spawnRate) {
        spawnEnemy();
        spawnTimer = 0;
    }

    enemies.forEach((e) => {
        e.x += e.vx * dt * 60;
        e.y += e.vy * dt * 60;
        e.pulse += dt * 5;
    });

    enemies = enemies.filter((e) =>
        e.x > -50 && e.x < canvas.width + 50 &&
        e.y > -50 && e.y < canvas.height + 50
    );

    const dangerDistance = nearestEnemyDistance();
    if (dangerDistance < 90 && !warningTriggered) {
        warningTriggered = true;
        audioManager.playSFX("warning");
        showFeedback("warning", "Close", 900);
    } else if (dangerDistance > 135) {
        warningTriggered = false;
    }

    for (const e of enemies) {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const currentRadius = e.radius + Math.sin(e.pulse) * 3;

        if (dist < player.radius + currentRadius - 5) {
            createExplosion(player.x, player.y, "#00f3ff");
            gameOver();
            break;
        }
    }

    particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
    });
    particles = particles.filter((p) => p.life > 0);
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y, vx, vy;
    const speed = (2 + Math.random() * 3) * difficultyMultiplier;

    if (side === 0) {
        x = Math.random() * canvas.width;
        y = -30;
        vx = (Math.random() - 0.5) * 2;
        vy = speed;
    } else if (side === 1) {
        x = canvas.width + 30;
        y = Math.random() * canvas.height;
        vx = -speed;
        vy = (Math.random() - 0.5) * 2;
    } else if (side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height + 30;
        vx = (Math.random() - 0.5) * 2;
        vy = -speed;
    } else {
        x = -30;
        y = Math.random() * canvas.height;
        vx = speed;
        vy = (Math.random() - 0.5) * 2;
    }

    enemies.push({
        x, y, vx, vy,
        radius: 15 + Math.random() * 15,
        pulse: Math.random() * Math.PI,
        color: "#ff0055"
    });
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5,
            color
        });
    }
}

function draw() {
    const bgGradient = ctx.createRadialGradient(
        canvas.width * 0.5,
        canvas.height * 0.45,
        40,
        canvas.width * 0.5,
        canvas.height * 0.45,
        Math.max(canvas.width, canvas.height) * 0.72
    );
    bgGradient.addColorStop(0, "#111b34");
    bgGradient.addColorStop(0.55, "#0a1020");
    bgGradient.addColorStop(1, "#05070f");
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.strokeStyle = "rgba(108, 245, 255, 0.08)";
    ctx.lineWidth = 1;
    const gridSize = Math.max(36, Math.floor(Math.min(canvas.width, canvas.height) / 10));
    for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
    for (let y = 0; y < canvas.height; y += 6) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    const starCount = 18;
    for (let i = 0; i < starCount; i++) {
        const sx = (i * 97) % canvas.width;
        const sy = (i * 151) % canvas.height;
        ctx.fillStyle = i % 3 === 0 ? "rgba(155, 124, 255, 0.28)" : "rgba(108, 245, 255, 0.2)";
        ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.restore();

    player.trail.forEach((t) => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, player.radius * (0.55 + t.age * 0.75), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(108, 245, 255, ${t.age * 0.18})`;
        ctx.fill();
    });

    ctx.save();
    const coreGradient = ctx.createRadialGradient(player.x - 6, player.y - 6, 3, player.x, player.y, player.radius + 14);
    coreGradient.addColorStop(0, "rgba(255,255,255,0.92)");
    coreGradient.addColorStop(0.28, "rgba(108,245,255,0.95)");
    coreGradient.addColorStop(0.72, "rgba(155,124,255,0.42)");
    coreGradient.addColorStop(1, "rgba(108,245,255,0)");
    ctx.fillStyle = coreGradient;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius + 14, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(108, 245, 255, 0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.strokeStyle = player.color;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 18;
    ctx.shadowColor = player.color;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = "#effdff";
    ctx.shadowBlur = 24;
    ctx.shadowColor = "rgba(108, 245, 255, 0.9)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = "#9b7cff";
    ctx.fill();
    ctx.restore();

    enemies.forEach((e) => {
        const r = e.radius + Math.sin(e.pulse) * 3;

        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.pulse * 0.3);

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI * 2 * i) / 6;
            const radius = i % 2 === 0 ? r + 4 : r * 0.52;
            const px = Math.cos(angle) * radius;
            const py = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = "rgba(255, 79, 123, 0.88)";
        ctx.shadowBlur = 16;
        ctx.shadowColor = "rgba(255, 79, 123, 0.85)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, r * 0.56, 0, Math.PI * 2);
        ctx.fillStyle = "#a50f49";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd4df";
        ctx.fill();
        ctx.restore();
    });

    particles.forEach((p) => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function loop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
