<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Sweep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- [agent-note][stage3] resolved-font: display/ui -> catalogs/fonts.json (Orbitron + Exo 2) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-50: #F8FAFC;
            --slate-100: #F1F5F9;
            --slate-200: #E2E8F0;
            --slate-300: #CBD5E1;
            --slate-400: #94A3B8;
            --slate-500: #64748B;
            --slate-600: #475569;
            --slate-800: #1E293B;
            --slate-900: #0F172A;
            --red-500: #EF4444;
            --white: #FFFFFF;
            --ink-950: #07111F;
            --ink-900: #0E1C30;
            --ink-800: #152946;
            --cyan-300: #82F4FF;
            --cyan-400: #4DDAFF;
            --cyan-500: #1CA8FF;
            --violet-400: #9B8CFF;
            --violet-500: #7164FF;
            --amber-300: #FFD76A;
            --danger-400: #FF5E78;
            --panel-bg: rgba(8, 18, 34, 0.72);
            --panel-border: rgba(130, 244, 255, 0.28);
            --panel-shadow: 0 10px 30px rgba(2, 8, 22, 0.35);
            --font-ui: 'Exo 2', 'Segoe UI', sans-serif;
            --font-display: 'Orbitron', 'Trebuchet MS', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            overflow: hidden; background-color: var(--ink-950); 
            font-family: var(--font-ui); 
            touch-action: manipulation; 
            -webkit-user-select: none; user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 20%, rgba(130, 244, 255, 0.18), transparent 28%),
                radial-gradient(circle at 20% 80%, rgba(113, 100, 255, 0.16), transparent 24%),
                linear-gradient(180deg, rgba(7, 17, 31, 0.28), rgba(7, 17, 31, 0.05) 30%, rgba(7, 17, 31, 0.42));
            z-index: 0;
        }

        
        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .pulse-text { animation: pulseText 2s infinite ease-in-out; }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* UI Glass Effect */
        .glass {
            background:
                linear-gradient(180deg, rgba(18, 41, 70, 0.92), rgba(8, 18, 34, 0.8)),
                rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
        }

        .hud-card {
            position: relative;
            overflow: hidden;
        }

        .hud-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(130, 244, 255, 0.18), transparent 45%, rgba(113, 100, 255, 0.12));
            pointer-events: none;
        }

        .display-font { font-family: var(--font-display); }
        .ui-font { font-family: var(--font-ui); }
        .signal-title {
            text-shadow: 0 0 20px rgba(130, 244, 255, 0.18);
            letter-spacing: 0.18em;
        }

        .signal-frame {
            position: relative;
            padding: 1.4rem 1.1rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(130, 244, 255, 0.2);
            background:
                radial-gradient(circle at top, rgba(130, 244, 255, 0.12), transparent 45%),
                linear-gradient(180deg, rgba(13, 29, 49, 0.82), rgba(7, 17, 31, 0.76));
            box-shadow: 0 20px 50px rgba(2, 8, 22, 0.34);
        }

        .signal-frame::before,
        .signal-frame::after {
            content: "";
            position: absolute;
            width: 68px;
            height: 68px;
            border: 1px solid rgba(130, 244, 255, 0.2);
            border-radius: 18px;
            opacity: 0.75;
        }

        .signal-frame::before {
            top: -10px;
            left: -10px;
            border-right: 0;
            border-bottom: 0;
        }

        .signal-frame::after {
            right: -10px;
            bottom: -10px;
            border-left: 0;
            border-top: 0;
        }

        .scanner-orb {
            width: 108px;
            height: 108px;
            margin: 0 auto 1rem;
            border-radius: 999px;
            position: relative;
            background:
                radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(130, 244, 255, 0.95) 20%, rgba(28, 168, 255, 0.58) 45%, rgba(7, 17, 31, 0.12) 70%, transparent 72%),
                radial-gradient(circle at 50% 50%, rgba(113, 100, 255, 0.35), transparent 60%);
            box-shadow:
                0 0 0 8px rgba(130, 244, 255, 0.08),
                0 0 28px rgba(77, 218, 255, 0.34),
                inset 0 0 24px rgba(255,255,255,0.3);
            animation: orbPulse 2.8s ease-in-out infinite;
        }

        .scanner-orb::before,
        .scanner-orb::after {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 999px;
            border: 1px solid rgba(130, 244, 255, 0.4);
        }

        .scanner-orb::after {
            inset: -10px;
            border-color: rgba(113, 100, 255, 0.24);
            animation: spinSweep 10s linear infinite;
        }

        .scanner-core {
            position: absolute;
            inset: 28px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255,255,255,0.98), rgba(255,255,255,0.2) 35%, rgba(7, 17, 31, 0.1) 72%, transparent 76%);
        }

        .signal-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.32rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(130, 244, 255, 0.2);
            background: rgba(130, 244, 255, 0.08);
            color: var(--cyan-300);
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .arcade-button {
            background: linear-gradient(180deg, #173359, #0d1e33);
            border: 1px solid rgba(130, 244, 255, 0.28);
            box-shadow: 0 10px 24px rgba(2, 8, 22, 0.34), inset 0 1px 0 rgba(255,255,255,0.16);
        }

        .arcade-button:hover { background: linear-gradient(180deg, #1d416e, #102743); }

        .arcade-button:active { transform: scale(0.95); }

        .muted-icon { color: var(--cyan-300); }

        .feedback-overlay {
            position: fixed;
            right: max(14px, env(safe-area-inset-right));
            bottom: max(14px, calc(env(safe-area-inset-bottom) + 92px));
            width: min(28vw, 118px);
            min-width: 76px;
            padding: 0.35rem;
            border-radius: 1rem;
            border: 1px solid rgba(130, 244, 255, 0.24);
            background: rgba(7, 17, 31, 0.76);
            box-shadow: 0 12px 26px rgba(2, 8, 22, 0.38);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-overlay.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 0.75rem;
            object-fit: cover;
        }

        .feedback-label {
            position: absolute;
            left: 0.5rem;
            bottom: 0.45rem;
            padding: 0.18rem 0.42rem;
            border-radius: 999px;
            background: rgba(7, 17, 31, 0.74);
            color: var(--cyan-300);
            font-family: var(--font-display);
            font-size: 0.52rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 8px rgba(130, 244, 255, 0.08), 0 0 28px rgba(77, 218, 255, 0.34), inset 0 0 24px rgba(255,255,255,0.3); }
            50% { transform: scale(1.04); box-shadow: 0 0 0 12px rgba(130, 244, 255, 0.08), 0 0 36px rgba(77, 218, 255, 0.42), inset 0 0 28px rgba(255,255,255,0.35); }
        }

        @keyframes spinSweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

<script>
/**
             * SIGNAL SWEEP
             * Engine: Pseudo-3D with Tile Floor Rendering
 */

// --- Configuration ---
const CONFIG = {
    fov: 80,
    cameraHeight: 180,
    walkSpeed: 600,
    turnSpeed: 3.5,
    tileSize: 300,      // Size of floor tiles
    renderDist: 12,     // Tiles drawing distance (radius)
    fogDistance: 3500,
    bobFrequency: 10,
    bobAmplitude: 5,
    spawnDistance: 2000,
    collectDistance: 150,
    startTime: 30,      // Seconds
    timeBonus: 4        // Seconds per collect
};

// --- Audio System ---
const AudioSys = {
    ctx: null,
    bgm: document.getElementById('bgm_main'),
    muted: false,
    nextStepTime: 0,
    lowTimePulseAt: 0,
    els: {
        collect: document.getElementById('sfx_collect'),
        warning: document.getElementById('sfx_warning'),
        gameOver: document.getElementById('sfx_game_over'),
        uiClick: document.getElementById('sfx_ui_click')
    },

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        Object.values(this.els).forEach((audio) => {
            if (audio) {
                audio.volume = audio === this.els.warning ? 0.35 : 0.45;
                audio.load();
            }
        });
    },

    playElement(audio, reset = true) {
        if (this.muted || !audio) return;
        try {
            if (reset) audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (_) {}
    },

    playBgm() {
        if (this.bgm && !this.muted) {
            this.bgm.volume = 0.2;
            this.bgm.play().catch(() => {});
        }
    },

    stopBgm() {
        if (this.bgm) this.bgm.pause();
    },

    toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
            this.stopBgm();
        } else {
            this.playBgm();
        }
        return this.muted;
    },

    uiClick() {
        this.playElement(this.els.uiClick);
    },

    step(time) {
        if (this.muted || !this.ctx) return;
        if (time > this.nextStepTime) {
            this.playTone(140, 0.018, 0.06, 'square');
            this.nextStepTime = time + 400;
        }
    },

    collect() {
        this.playElement(this.els.collect);
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(960, t);
        osc.frequency.exponentialRampToValueAtTime(1820, t + 0.08);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.22);
    },

    lowTimeAlert(timeLeft) {
        if (this.muted || !this.ctx || timeLeft > 5) return;
        const now = performance.now();
        if (now - this.lowTimePulseAt < 1200) return;
        this.lowTimePulseAt = now;
        this.playElement(this.els.warning);
        this.playTone(420, 0.03, 0.14, 'triangle');
    },

    gameOver() {
        this.stopBgm();
        this.playElement(this.els.gameOver);
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(170, t);
        osc.frequency.linearRampToValueAtTime(60, t + 0.8);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.8);
    },

    playTone(freq, vol, dur, type = 'sine') {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
    }
};

// --- Game Classes ---
class Camera {
    constructor() {
        this.x = 0;
        this.y = CONFIG.cameraHeight;
        this.z = 0;
        this.yaw = 0;
    }
}

class Entity {
    constructor(x, z) {
        this.x = x;
        this.y = 120;
        this.z = z;
        this.collected = false;
        this.phase = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 2;
    }
}

// --- Input Handling ---
const Input = {
    active: false,
    originX: 0,
    originY: 0,
    currentX: 0,
    currentY: 0,
    moveFactor: 0,
    turnFactor: 0
};

// --- State ---
let canvas, ctx;
let width, height;
let camera = new Camera();
let entities = [];
let lastTime = 0;
let isPlaying = false;
let bobPhase = 0;
let score = 0;
let timeLeft = CONFIG.startTime;
let scoreEl, timerEl, collectGifEl, failGifEl;
let feedbackTimer = 0;

// --- Init ---
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    scoreEl = document.getElementById('score-display');
    timerEl = document.getElementById('timer-display');
    collectGifEl = document.getElementById('collect-gif');
    failGifEl = document.getElementById('fail-gif');
    
    resize();
    window.addEventListener('resize', resize);
    
    // UI Events
    document.getElementById('start-btn').addEventListener('click', () => {
        AudioSys.uiClick();
        startGame();
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
        AudioSys.uiClick();
        resetGame();
    });
    document.getElementById('mute-btn').addEventListener('click', () => {
        const isMuted = AudioSys.toggleMute();
        document.getElementById('mute-btn').style.opacity = isMuted ? '0.5' : '1';
    });

    // Touch Events
    // [agent-note][stage4] repaired: mobile-action-risk | element: body/canvas input | action: native taps preserved for UI, drag suppression scoped to canvas
    canvas.addEventListener('pointerdown', onTouchStart, { passive: false });
    canvas.addEventListener('pointermove', onTouchMove, { passive: false });
    canvas.addEventListener('pointerup', onTouchEnd);
    canvas.addEventListener('pointercancel', onTouchEnd);
    canvas.addEventListener('pointerleave', onTouchEnd);
    
    // Initial Render
    resetState();
    draw();
    
    requestAnimationFrame(loop);
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}

function showFeedback(target, duration = 1200) {
    if (!target) return;
    target.classList.add('show');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
        target.classList.remove('show');
    }, duration);
}

function hideFeedback() {
    if (collectGifEl) collectGifEl.classList.remove('show');
    if (failGifEl) failGifEl.classList.remove('show');
    clearTimeout(feedbackTimer);
}

function startGame() {
    AudioSys.init();
    AudioSys.playBgm();
    hideFeedback();
    
    document.getElementById('start-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').classList.remove('hidden');
    }, 500);
    
    resetState();
    isPlaying = true;
    lastTime = performance.now();
}

function resetGame() {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    hideFeedback();
    resetState();
    isPlaying = true;
    lastTime = performance.now();
    AudioSys.playBgm();
}

function resetState() {
    camera = new Camera();
    entities = [];
    spawnEntities(8);
    score = 0;
    timeLeft = CONFIG.startTime;
    Input.moveFactor = 0;
    Input.turnFactor = 0;
    Input.active = false;
    updateUI();
    hideFeedback();
}

function spawnEntities(count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 800 + Math.random() * 1500;
        const ex = camera.x + Math.sin(angle) * dist;
        const ez = camera.z + Math.cos(angle) * dist;
        entities.push(new Entity(ex, ez));
    }
}

// --- Input Logic ---
function onTouchStart(e) {
    if (!isPlaying) return;
    e.preventDefault();
    Input.active = true;
    Input.originX = e.clientX;
    Input.originY = e.clientY;
    Input.currentX = e.clientX;
    Input.currentY = e.clientY;
    
    const hint = document.getElementById('joystick-hint');
    hint.style.left = e.clientX + 'px';
    hint.style.top = e.clientY + 'px';
    hint.style.opacity = '1';
}

function onTouchMove(e) {
    if (!Input.active) return;
    e.preventDefault();
    Input.currentX = e.clientX;
    Input.currentY = e.clientY;
    
    const dx = Input.currentX - Input.originX;
    const dy = Input.currentY - Input.originY;
    
    const maxDrag = 80;
    Input.turnFactor = Math.max(-1, Math.min(1, dx / maxDrag));
    Input.moveFactor = Math.max(-1, Math.min(1, -dy / maxDrag));
}

function onTouchEnd() {
    Input.active = false;
    Input.moveFactor = 0;
    Input.turnFactor = 0;
    document.getElementById('joystick-hint').style.opacity = '0';
}

// --- 3D Engine ---
function project(p, cam, w, h) {
    let x = p.x - cam.x;
    let y = p.y - cam.y;
    let z = p.z - cam.z;
    
    const cos = Math.cos(cam.yaw);
    const sin = Math.sin(cam.yaw);
    const rx = x * cos - z * sin;
    const rz = z * cos + x * sin;
    
    if (rz <= 20) return null;
    
    const fovScale = Math.min(w, h); // Keep FOV consistent
    const scale = fovScale / rz; 
    
    const sx = (rx * scale) + (w / 2);
    const sy = (y * scale) + (h / 2);
    
    return { x: sx, y: sy, scale: scale, dist: rz };
}

// --- Main Loop ---
function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    
    if (isPlaying) {
        update(dt, time);
        draw();
    }
    
    requestAnimationFrame(loop);
}

function update(dt, time) {
    // 1. Movement
    if (Math.abs(Input.moveFactor) > 0.05 || Math.abs(Input.turnFactor) > 0.05) {
        camera.yaw += Input.turnFactor * CONFIG.turnSpeed * dt;
        
        const speed = Input.moveFactor * CONFIG.walkSpeed;
        if (Math.abs(speed) > 10) {
            camera.x += Math.sin(camera.yaw) * speed * dt;
            camera.z += Math.cos(camera.yaw) * speed * dt;
            
            // Bob
            bobPhase += dt * CONFIG.bobFrequency * Math.abs(Input.moveFactor);
            camera.y = CONFIG.cameraHeight + Math.sin(bobPhase) * CONFIG.bobAmplitude;
            
            if (Math.sin(bobPhase) < -0.9) AudioSys.step(time);
        }
    } else {
        camera.y += (CONFIG.cameraHeight - camera.y) * 5 * dt;
    }

    // 2. Timer Logic
    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        gameOver();
    }
    AudioSys.lowTimeAlert(timeLeft);
    updateUI();

    // 3. Entity Management
    entities.forEach(ent => {
        if (ent.collected) return;
        
        ent.y = 120 + Math.sin(time/500 + ent.phase) * 20;
        
        const dx = camera.x - ent.x;
        const dz = camera.z - ent.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        
        if (dist < CONFIG.collectDistance) {
            collectEntity(ent);
        }
    });

    entities = entities.filter(e => !e.collected);
    
    if (entities.length < 5) {
        spawnEntities(3);
    }
}

function collectEntity(ent) {
    ent.collected = true;
    score++;
    timeLeft += CONFIG.timeBonus;
    AudioSys.collect();
    showFeedback(collectGifEl, 950);

    scoreEl.style.transform = "scale(1.5)";
    setTimeout(() => scoreEl.style.transform = "scale(1)", 150);
}

function gameOver() {
    isPlaying = false;
    AudioSys.gameOver();
    showFeedback(failGifEl, 2200);
    document.getElementById('final-score').innerText = score;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function updateUI() {
    scoreEl.innerText = score;
    timerEl.innerText = timeLeft.toFixed(1);
    
    if (timeLeft < 5) {
        timerEl.classList.add('text-red-500');
        timerEl.classList.remove('text-slate-800');
    } else {
        timerEl.classList.remove('text-red-500');
        timerEl.classList.add('text-slate-800');
    }
}

function draw() {
    // Clear & Sky
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#050C18');
    gradient.addColorStop(0.45, '#0D1D33');
    gradient.addColorStop(1, '#132947');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    const haze = ctx.createRadialGradient(width * 0.5, height * 0.18, 20, width * 0.5, height * 0.18, width * 0.7);
    haze.addColorStop(0, 'rgba(130, 244, 255, 0.12)');
    haze.addColorStop(1, 'rgba(130, 244, 255, 0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, width, height);
    
    // Draw Floor Tiles
    drawFloor();
    
    // Draw Entities
    const renderList = [];
    entities.forEach(ent => {
        const p = project(ent, camera, width, height);
        if (p) {
            renderList.push({ type: 'entity', ...p, obj: ent });
        }
    });
    
    // Sort back-to-front
    renderList.sort((a, b) => b.dist - a.dist);
    
    renderList.forEach(item => {
        drawEntity(item);
    });
}

function drawFloor() {
    const size = CONFIG.tileSize;
    const range = CONFIG.renderDist; // tiles radius
    
    // Snap camera to grid
    const cx = Math.floor(camera.x / size);
    const cz = Math.floor(camera.z / size);
    
    // Iterate visible grid
    // Draw from far Z to near Z to handle painter's algo if needed (though flat floor doesn't strictly need it if no overlap)
    for (let z = cz + range; z >= cz - range; z--) {
        for (let x = cx - range; x <= cx + range; x++) {
            
            // Checkerboard pattern
            const isWhite = (Math.abs(x) + Math.abs(z)) % 2 === 0;
            const color = isWhite ? '#11243E' : '#09172A';
            
            // World coords of corners
            const x1 = x * size;
            const z1 = z * size;
            const x2 = x1 + size;
            const z2 = z1 + size;
            
            // Project corners
            // 0: x1,z1 (Top Left)
            // 1: x2,z1 (Top Right)
            // 2: x2,z2 (Bottom Right)
            // 3: x1,z2 (Bottom Left)
            
            const p0 = project({x: x1, y: 0, z: z1}, camera, width, height);
            const p1 = project({x: x2, y: 0, z: z1}, camera, width, height);
            const p2 = project({x: x2, y: 0, z: z2}, camera, width, height);
            const p3 = project({x: x1, y: 0, z: z2}, camera, width, height);
            
            // Simple clipping: if any point is null (behind cam), skip tile
            // A more robust engine would clip polygon to near plane, but for this casual game, skipping is fine
            if (!p0 || !p1 || !p2 || !p3) continue;
            
            // Fog Calculation based on center distance
            const dist = (p0.dist + p2.dist) / 2;
            if (dist > CONFIG.fogDistance) continue;
            
            // Draw Quad
            ctx.fillStyle = color;
            ctx.strokeStyle = 'rgba(130, 244, 255, 0.08)';
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Fog Overlay (simple white fade)
            const alpha = Math.max(0, (dist - 1000) / (CONFIG.fogDistance - 1000));
            if (alpha > 0) {
                ctx.fillStyle = `rgba(5, 12, 24, ${alpha * 0.92})`;
                ctx.fill();
            }
        }
    }
}

function drawEntity(p) {
    const alpha = Math.max(0, 1 - (p.dist / CONFIG.fogDistance));
    const size = 30 * p.scale;
    
    // Shadow
    ctx.fillStyle = `rgba(0,0,0,${alpha * 0.15})`;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + (size * 2), size, size/3, 0, 0, Math.PI*2);
    ctx.fill();
    
    // Echo drone diamond body
    const wing = size * 0.85;
    ctx.fillStyle = `rgba(28, 168, 255, ${alpha * 0.95})`;
    ctx.strokeStyle = `rgba(130, 244, 255, ${alpha})`;
    ctx.lineWidth = Math.max(2, p.scale * 1.2);

    ctx.beginPath();
    ctx.moveTo(p.x, p.y - size * 1.1);
    ctx.lineTo(p.x + wing, p.y - size * 0.05);
    ctx.lineTo(p.x, p.y + size * 0.95);
    ctx.lineTo(p.x - wing, p.y - size * 0.05);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner core
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y - size * 0.08, size * 0.22, 0, Math.PI * 2);
    ctx.fill();

    // Lower fin
    ctx.fillStyle = `rgba(113, 100, 255, ${alpha * 0.8})`;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + size * 0.2);
    ctx.lineTo(p.x + size * 0.28, p.y + size * 0.95);
    ctx.lineTo(p.x - size * 0.28, p.y + size * 0.95);
    ctx.closePath();
    ctx.fill();

    // Highlight sweep
    ctx.strokeStyle = `rgba(255,255,255, ${alpha * 0.45})`;
    ctx.lineWidth = Math.max(1, p.scale * 0.8);
    ctx.beginPath();
    ctx.moveTo(p.x - size * 0.26, p.y - size * 0.42);
    ctx.lineTo(p.x + size * 0.35, p.y - size * 0.05);
    ctx.stroke();

    // Orbiting ping
    const pingY = p.y - size * 1.28 + Math.sin(performance.now() / 200 + p.obj.phase) * size * 0.12;
    ctx.fillStyle = `rgba(255, 215, 106, ${alpha * 0.9})`;
    ctx.beginPath();
    ctx.arc(p.x, pingY, size * 0.12, 0, Math.PI * 2);
    ctx.fill();
}

window.onload = init;

</script>
