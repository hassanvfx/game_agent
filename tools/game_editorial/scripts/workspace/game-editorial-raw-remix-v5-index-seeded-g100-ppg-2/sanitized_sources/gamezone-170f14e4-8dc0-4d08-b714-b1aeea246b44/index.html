<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snack Stack Arcade</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> Press Start 2P + Orbitron from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --amber-500: #f59e0b;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --green-500: #10b981;
            --white: #ffffff;
            --bg-deep: #130f2b;
            --bg-mid: #24165a;
            --panel-bg: rgba(30, 18, 69, 0.78);
            --panel-border: rgba(149, 231, 255, 0.62);
            --panel-shadow: rgba(20, 10, 48, 0.45);
            --accent-cyan: #7bf6ff;
            --accent-pink: #ff72c9;
            --accent-gold: #ffd84d;
            --accent-lime: #a8ff7a;
            --text-main: #f9f8ff;
            --text-soft: #c5c1ef;
            --grid-glow: rgba(123, 246, 255, 0.16);
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(93, 66, 185, 0.44), transparent 38%),
                linear-gradient(180deg, #22124d 0%, #120a2b 52%, #090513 100%);
            font-family: 'Orbitron', system-ui, sans-serif;
            touch-action: manipulation;
        }
        body {
            color: var(--text-main);
            user-select: none;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;

        canvas { display: block; touch-action: none; width: 100%; height: 100%; }

        .relative { position: relative; }
        .absolute { position: absolute; }

        .left-0 { left: 0; }
        .right-0 { right: 0; }

        .h-full { height: 100%; }

        .z-10 { z-index: 10; }

        }

                top: max(7.3rem, calc(env(safe-area-inset-top) + 5.8rem));
            }
        }
    </style>

<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.bgmBuffer = null;
        this.bgmSource = null;
        this.bgmElement = document.getElementById('bgm');
        this.sfxPlayers = {};
        this.sfxBuffers = {
            prep: null,
            cook: null,
            serve: null,
            error: null,
            done: null,
            ui: null
        };
        this.sfxUrls = {
            prep: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
            cook: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
            serve: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3',
            error: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3',
            done: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
            ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3'
        };
        this.cooldowns = {
            prep: 0,
            cook: 0,
            serve: 0,
            error: 0,
            done: 0,
            ui: 0
        };
        this.cooldownDuration = {
            prep: 0.08,
            cook: 0.08,
            serve: 0.12,
            error: 0.12,
            done: 0.2,
            ui: 0.1
        };
        this.loadAudioAssets();
    }

    getContext() {
        if (this.ctx) return this.ctx;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.sfxGain = this.ctx.createGain();
        this.bgmGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.9;
        this.sfxGain.gain.value = 0.72;
        this.bgmGain.gain.value = 0.2;
        this.sfxGain.connect(this.masterGain);
        this.bgmGain.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);
        return this.ctx;
    }

    async decodeUrl(url) {
        const ctx = this.getContext();
        if (!ctx || !url) return null;
        try {
            const response = await fetch(url, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            return await ctx.decodeAudioData(arrayBuffer.slice(0));
        } catch (e) {
            return null;
        }
    }

    buildSfxPlayer(url, volume = 1) {
        if (!url) return null;
        const audio = new Audio(url);
        audio.preload = 'auto';
        audio.volume = Math.min(1, Math.max(0, volume));
        return audio;
    }

    async loadAudioAssets() {
        const bgmEl = this.bgmElement;
        if (bgmEl) {
            bgmEl.volume = 0.2;
            bgmEl.crossOrigin = 'anonymous';
        }
        this.bgmBuffer = await this.decodeUrl(bgmEl?.src);

        const entries = Object.entries(this.sfxUrls);
        await Promise.all(entries.map(async ([key, url]) => {
            this.sfxBuffers[key] = await this.decodeUrl(url);
            this.sfxPlayers[key] = this.buildSfxPlayer(url);
        }));
    }

    async unlock() {
        if (this.unlocked) return;
        const ctx = this.getContext();
        if (!ctx) return;
        try {
            await ctx.resume();
            this.unlocked = true;
            this.playBGM();
        } catch (e) {
            console.log('Audio unlock failed', e);
        }
    }

    playBGM() {
        const ctx = this.getContext();
        if (!this.unlocked) return;

        if (ctx && this.bgmBuffer && !this.bgmSource) {
            const source = ctx.createBufferSource();
            source.buffer = this.bgmBuffer;
            source.loop = true;
            source.connect(this.bgmGain);
            source.onended = () => {
                if (this.bgmSource === source) this.bgmSource = null;
            };
            source.start(0);
            this.bgmSource = source;
            return;
        }

        if (this.bgmElement && this.bgmElement.paused) {
            this.bgmElement.volume = 0.2;
            this.bgmElement.play().catch(() => {});
        }
    }

    stopBGM() {
        if (this.bgmSource) {
            try {
                this.bgmSource.stop(0);
            } catch (e) {}
            this.bgmSource = null;
        }
        if (this.bgmElement) {
            this.bgmElement.pause();
            this.bgmElement.currentTime = 0;
        }
    }

    update(dt) {
        Object.keys(this.cooldowns).forEach(key => {
            this.cooldowns[key] = Math.max(0, this.cooldowns[key] - dt);
        });
    }

    playSFX(type, volume = 1) {
        const ctx = this.getContext();
        if (!this.unlocked) return;
        if ((this.cooldowns[type] || 0) > 0) return;
        this.cooldowns[type] = this.cooldownDuration[type] || 0.1;

        const buffer = this.sfxBuffers[type];
        if (ctx && buffer) {
            try {
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                const gainNode = ctx.createGain();
                gainNode.gain.value = volume;
                source.connect(gainNode);
                gainNode.connect(this.sfxGain);
                source.start(0);
                return;
            } catch (e) {}
        }

        const player = this.sfxPlayers[type];
        if (player) {
            try {
                player.pause();
                player.currentTime = 0;
                player.volume = Math.min(1, Math.max(0, volume));
                player.play().catch(() => {});
            } catch (e) {}
        }
    }
}

/**
 * GAME ENGINE
 */
const audioManager = new AudioManager();

// Config
let gameConfig = {
    cookTime: 4,
    dishPrice: 25,
    gridSize: 4
};

// State
let money = 0;
let grid = [];
let particles = [];
let floatingTexts = [];
let currentTool = 'prep'; // prep, cook, serve
let lastTime = 0;
let cw = 0, ch = 0, dpr = 1;
let camera = { x: 0, y: 0 };
let initialized = false;
let overlayTimers = {
    celebrate: 0,
    fail: 0
};

// Constants
const TILE_SIZE = 70; 
const BLOCK_HEIGHT = 30;
const COLORS = {
    floor1: '#35206f',
    floor2: '#24134f',
    floorGlow: '#6cf3ff',
    counterTop: '#7bf6ff',
    counterSide: '#5130a6',
    counterDark: '#2a1761',
    trim: '#ff72c9',
    trimDark: '#b7308f',
    grill: '#25153f',
    grillGlow: '#ff934f',
    rawMeat: '#ff7a7a',
    rawVeg: '#9cf86e',
    cookedFood: '#ff9f2e',
    cookedDark: '#db5f26',
    sauce: '#ffe272',
    garnish: '#71ffcf',
    plate: '#f7f0ff',
    plateShadow: '#c7b6ee',
    smoke: 'rgba(255, 255, 255, 0.9)'
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const tutorialText = document.getElementById('tutorial-text');
const statusText = document.getElementById('status-text');
const celebrateGif = document.getElementById('celebrate-gif');
const failGif = document.getElementById('fail-gif');

// Initialization via ResizeObserver
const resizeObserver = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    cw = rect.width;
    ch = rect.height;
    dpr = window.devicePixelRatio || 1;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    camera.x = cw / 2;
    camera.y = ch / 2 - (gameConfig.gridSize * TILE_SIZE / 4) + 50;

    if (!initialized) {
        initGame();
        initialized = true;
    }
});
resizeObserver.observe(document.body);

function initGame() {
    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;
    } catch(e) {}

    initGrid();
    
    // Input binding
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    
    // Start loop
    requestAnimationFrame(gameLoop);
}

function initGrid() {
    grid = [];
    const size = gameConfig.gridSize;
    for (let x = 0; x < size; x++) {
        grid[x] = [];
        for (let y = 0; y < size; y++) {
            grid[x][y] = {
                state: 'empty', // empty, prepped, cooking, done
                timer: 0,
                maxTime: gameConfig.cookTime,
                bounce: 0,
                dishId: Math.random() // For visual variety
            };
        }
    }
}

function vibrate(style) {
    try {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style: style }
        });
    } catch(e) {}
}

function flashOverlay(kind, seconds = 1.2) {
    overlayTimers[kind] = seconds;
    const el = kind === 'celebrate' ? celebrateGif : failGif;
    if (el) el.classList.add('visible');
}

function setStatus(message) {
    statusText.textContent = message;
}

// Isometric Maths
function isoToScreen(gx, gy) {
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    return {
        x: (gx - gy) * tileW + camera.x,
        y: (gx + gy) * tileH + camera.y
    };
}

function screenToIso(sx, sy) {
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    const gy = ((adjY / tileH) - (adjX / tileW)) / 2;
    const gx = ((adjY / tileH) + (adjX / tileW)) / 2;
    return { x: Math.floor(gx), y: Math.floor(gy) };
}

// Game Loop
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    dt = Math.min(dt, 0.05); // Clamp dt
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Loop error", e);
    }
    
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    audioManager.update(dt);

    // Update Grid
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            const cell = grid[x][y];
            
            if (cell.bounce > 0) {
                cell.bounce = Math.max(0, cell.bounce - dt * 80);
            }

            if (cell.state === 'cooking') {
                cell.timer += dt;
                
                // Steam particles
                if (Math.random() < 0.1) {
                    const pos = isoToScreen(x, y);
                    spawnParticles(pos.x, pos.y - BLOCK_HEIGHT - 10, '#ffffff', 1, 'steam');
                }

                if (cell.timer >= cell.maxTime) {
                    cell.state = 'done';
                    cell.bounce = 15;
                    audioManager.playSFX('done', 0.95);
                    setStatus('Cabinet charged! Cash out the glowing ticket tray.');
                    flashOverlay('celebrate', 1.1);
                    const pos = isoToScreen(x, y);
                    spawnParticles(pos.x, pos.y - BLOCK_HEIGHT, '#fbbf24', 5, 'star');
                }
            }
        }
    }

    // Update overlays
    Object.keys(overlayTimers).forEach(key => {
        overlayTimers[key] = Math.max(0, overlayTimers[key] - dt);
        if (overlayTimers[key] === 0) {
            const el = key === 'celebrate' ? celebrateGif : failGif;
            if (el) el.classList.remove('visible');
        }
    });

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        
        if (p.type === 'steam') {
            p.size += dt * 10;
        } else {
            p.z += p.vz * dt * 60;
            p.vz -= dt * 2; // Gravity
            if (p.z < 0) { p.z = 0; p.vz *= -0.5; }
        }
        
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update Floating Text
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        t.y -= dt * 50;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, cw, ch);

    // Draw Grid
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            drawCell(x, y, grid[x][y]);
        }
    }

    // Draw Particles
    particles.forEach(p => {
        if (!isFinite(p.x) || !isFinite(p.y)) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        
        if (p.type === 'star') {
            drawStar(p.x, p.y - (p.z || 0), p.size, 5, p.size/2);
        } else if (p.type === 'steam') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillRect(p.x - p.size/2, p.y - (p.z || 0) - p.size/2, p.size, p.size);
        }
        ctx.restore();
    });

    // Draw Floating Text
    ctx.textAlign = 'center';
    ctx.font = '400 24px "Press Start 2P"';
    floatingTexts.forEach(t => {
        if (!isFinite(t.x) || !isFinite(t.y)) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, t.life);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
    });
}

function drawPrism(x, y, w, h, z, colorTop, colorSide, colorDark) {
    // Top
    ctx.fillStyle = colorTop;
    ctx.beginPath();
    ctx.moveTo(x, y - z);
    ctx.lineTo(x + w, y + h/2 - z);
    ctx.lineTo(x, y + h - z);
    ctx.lineTo(x - w, y + h/2 - z);
    ctx.fill();

    // Right Side
    ctx.fillStyle = colorSide;
    ctx.beginPath();
    ctx.moveTo(x + w, y + h/2 - z);
    ctx.lineTo(x, y + h - z);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x + w, y + h/2);
    ctx.fill();

    // Left Side
    ctx.fillStyle = colorDark;
    ctx.beginPath();
    ctx.moveTo(x - w, y + h/2 - z);
    ctx.lineTo(x, y + h - z);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w, y + h/2);
    ctx.fill();
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
}

function drawCell(gx, gy, cell) {
    const pos = isoToScreen(gx, gy);
    let x = pos.x;
    let y = pos.y + cell.bounce; 
    
    // Floor Tile
    const isLight = (gx + gy) % 2 === 0;
    const floorColor = isLight ? COLORS.floor1 : '#2f1b65';
    const floorDark = isLight ? COLORS.floor2 : '#1b0f41';
    drawPrism(x, y + BLOCK_HEIGHT, TILE_SIZE, TILE_SIZE/2, 4, floorColor, floorDark, floorDark);

    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = COLORS.floorGlow;
    ctx.beginPath();
    ctx.ellipse(x, y + BLOCK_HEIGHT + 4, 24, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Counter Base
    drawPrism(x, y, TILE_SIZE * 0.8, TILE_SIZE * 0.4, BLOCK_HEIGHT, COLORS.counterTop, COLORS.counterSide, COLORS.counterDark);
    
    // Counter Trim
    drawPrism(x, y, TILE_SIZE * 0.82, TILE_SIZE * 0.41, 4, COLORS.trim, COLORS.trimDark, '#6e1d63');

    const topY = y - BLOCK_HEIGHT - 4;

    // Draw State Content
    if (cell.state === 'prepped' || cell.state === 'cooking') {
        // Arcade charging slab
        drawPrism(x, topY, 20, 10, 2, COLORS.grill, '#1c1035', '#0f0821');
        
        if (cell.state === 'cooking') {
            ctx.fillStyle = 'rgba(255, 147, 79, 0.55)';
            ctx.beginPath();
            ctx.ellipse(x, topY, 18, 9, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Snack bot payload pieces
        const fY = topY - 2;
        if (cell.dishId > 0.5) {
            drawPrism(x - 5, fY, 6, 3, 6, COLORS.rawMeat, '#ff5b8f', '#c92f67');
            drawPrism(x + 5, fY, 5, 2.5, 4, COLORS.rawVeg, '#53d769', '#2da94a');
        } else {
            drawPrism(x, fY, 8, 4, 5, '#8cf8ff', '#32d9f3', '#198db8');
            drawPrism(x - 4, fY - 2, 4, 2, 3, COLORS.rawVeg, '#53d769', '#2da94a');
        }

        if (cell.state === 'cooking') {
            const pct = cell.timer / cell.maxTime;
            const barY = topY - 30;
            ctx.fillStyle = 'rgba(17, 24, 39, 0.55)';
            ctx.fillRect(x - 20, barY, 40, 6);
            ctx.fillStyle = COLORS.grillGlow;
            ctx.fillRect(x - 19, barY + 1, 38 * pct, 4);
        }

    } else if (cell.state === 'done') {
        // Prize tray
        drawPrism(x, topY, 22, 11, 3, COLORS.plate, COLORS.plateShadow, '#ab97d9');
        const fY = topY - 3;
        drawPrism(x, fY, 12, 6, 8, COLORS.cookedFood, COLORS.cookedDark, '#8f2d19');
        drawPrism(x, fY - 8, 10, 5, 2, COLORS.sauce, '#ffba31', '#d68a1d');
        drawPrism(x, fY - 10, 8, 4, 4, COLORS.garnish, '#37d6a9', '#169b82');
    }

    // State Icons (floating above)
    const iconY = topY - 40 - cell.bounce;
    if (cell.state === 'empty') {
        if (currentTool === 'prep') drawBubble(x, iconY, '🛸');
    } else if (cell.state === 'prepped') {
        if (currentTool === 'cook') drawBubble(x, iconY, '⚡');
    } else if (cell.state === 'done') {
        drawBubble(x, iconY, '🎟️');
    }
}

function drawBubble(x, y, char) {
    ctx.fillStyle = 'rgba(8, 5, 28, 0.28)';
    ctx.beginPath();
    ctx.ellipse(x, y + 15, 14, 7, 0, 0, Math.PI*2);
    ctx.fill();
    
    const bubbleGradient = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, 20);
    bubbleGradient.addColorStop(0, '#fff9ff');
    bubbleGradient.addColorStop(1, '#d8d2ff');
    ctx.fillStyle = bubbleGradient;
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(123, 246, 255, 0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '19px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.fillText(char, x, y + 2);
}

// Input Handling
function handleInput(e) {
    e.preventDefault();
    audioManager.unlock();
    setStatus('Arcade soundtrack online. Chain prep, charge, and jackpot actions for clean combos.');
    
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    
    const iso = screenToIso(sx, sy);
    
    if (iso.x >= 0 && iso.x < gameConfig.gridSize && iso.y >= 0 && iso.y < gameConfig.gridSize) {
        interact(iso.x, iso.y);
    }
}

function interact(x, y) {
    const cell = grid[x][y];
    const pos = isoToScreen(x, y);
    let success = false;

    if (currentTool === 'prep') {
        if (cell.state === 'empty') {
            cell.state = 'prepped';
            cell.dishId = Math.random();
            cell.bounce = 12;
            audioManager.playSFX('prep', 0.8);
            spawnParticles(pos.x, pos.y - BLOCK_HEIGHT, '#94a3b8', 4, 'normal');
            setStatus('Order beamed in. Switch to Charge and light up that cabinet.');
            vibrate('light');
            success = true;
        }
    } else if (currentTool === 'cook') {
        if (cell.state === 'prepped') {
            cell.state = 'cooking';
            cell.timer = 0;
            cell.bounce = 8;
            audioManager.playSFX('cook', 0.85);
            spawnParticles(pos.x, pos.y - BLOCK_HEIGHT, '#ef4444', 6, 'normal');
            setStatus('Charge sequence started. Wait for the tray to glow before cashing out.');
            vibrate('light');
            success = true;
        }
    } else if (currentTool === 'serve') {
        if (cell.state === 'done') {
            cell.state = 'empty';
            
            money += gameConfig.dishPrice;
            scoreEl.textContent = money;
            scoreEl.parentElement.classList.add('scale-110');
            setTimeout(() => scoreEl.parentElement.classList.remove('scale-110'), 150);

            addFloatingText(pos.x, pos.y - 80, `+$${gameConfig.dishPrice}`, '#10b981');
            spawnParticles(pos.x, pos.y - BLOCK_HEIGHT, '#10b981', 8, 'normal');
            audioManager.playSFX('serve', 0.95);
            setStatus('Jackpot collected! The crowd is loving this snack stack combo.');
            flashOverlay('celebrate', 1.4);
            vibrate('medium');
            success = true;
        }
    }

    if (!success) {
        audioManager.playSFX('error', 0.75);
        cell.bounce = 5;
        setStatus('Wrong station for that tool. Follow the beam → charge → jackpot flow.');
        flashOverlay('fail', 1.1);
    }
}

function spawnParticles(x, y, color, count, type) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            z: type === 'steam' ? 0 : 20,
            vx: (Math.random() - 0.5) * (type === 'steam' ? 1 : 3),
            vy: (Math.random() - 0.5) * (type === 'steam' ? 1 : 3) - (type === 'steam' ? 2 : 0),
            vz: type === 'steam' ? 0 : Math.random() * 4 + 3,
            life: 1.0,
            color: color,
            size: type === 'steam' ? Math.random() * 10 + 5 : Math.random() * 6 + 4,
            type: type
        });
    }
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({
        x: x,
        y: y,
        text: text,
        color: color,
        life: 1.2
    });
}

// UI Logic
window.selectTool = (tool) => {
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.id === `tool-${tool}`) {
            btn.classList.add('active');
        }
    });

    let txt = "";
    if (tool === 'prep') txt = "Tap empty stations to beam in a snack bot order! 🛸";
    if (tool === 'cook') txt = "Tap loaded stations to supercharge the cabinet! ⚡";
    if (tool === 'serve') txt = "Tap ready cabinets to cash out glowing prize tickets! 🎟️";
    tutorialText.textContent = txt;
    
    const statusByTool = {
        prep: 'Prep mode armed. Drop fresh orders onto empty arcade stations.',
        cook: 'Charge mode ready. Power up any station already holding an order.',
        serve: 'Jackpot mode hot. Cash out only the stations with glowing trays.'
    };
    setStatus(statusByTool[tool] || 'Arcade controls updated.');
    audioManager.unlock();
    audioManager.playSFX('ui', 0.65);
};

// Global config updater
window.updateGameConfig = (key, val) => {
    if (key in gameConfig) {
        gameConfig[key] = val;
        if (key === 'gridSize') initGrid();
    }
};
