<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Brainrot Fusion</title>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | title -> Bangers | hud/ui -> Press Start 2P -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg-deep: #090914;
            --bg-mid: #150f2f;
            --panel: rgba(22, 19, 47, 0.78);
            --panel-strong: rgba(34, 28, 70, 0.88);
            --line: rgba(158, 122, 255, 0.5);
            --cyan: #7ff6ff;
            --cyan-strong: #33d6ff;
            --pink: #ff4fd8;
            --gold: #ffd447;
            --danger: #ff5b7e;
            --text: #f5f3ff;
            --text-muted: #bcb8d8;
            --shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(95, 58, 255, 0.22), transparent 36%),
                radial-gradient(circle at bottom, rgba(0, 224, 255, 0.16), transparent 34%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            border: 0;
            cursor: pointer;
            touch-action: manipulation;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 400;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-0 { left: 0; }
        .w-full { width: 100%; }
        .h-full { width: 100vw; height: 100vh; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-10 { padding: 2.5rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 999px; }
        .max-w-md { max-width: 28rem; }
        .gap-4 { gap: 1rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: clamp(2.2rem, 6vw, 3.2rem); }
        .text-6xl { font-size: clamp(2.8rem, 10vw, 4.9rem); }
        .font-bold { font-weight: 700; }
        .font-extrabold { font-weight: 800; }
        .font-semibold { font-weight: 600; }
        .text-white { color: #fff; }
        .text-gray-300 { color: var(--text-muted); }
        .text-gray-400 { color: #9a96b8; }
        .text-gray-900 { color: #111827; }
        .text-yellow-400 { color: var(--gold); }
        .text-red-500 { color: var(--danger); }
        .drop-shadow-lg { text-shadow: 0 10px 20px rgba(0, 0, 0, 0.45); }
        .drop-shadow-md { text-shadow: 0 6px 12px rgba(0, 0, 0, 0.4); }
        .bg-white { background: #fff; }
        .bg-gradient-to-r {
            background: linear-gradient(90deg, var(--pink), var(--cyan-strong));
        }
        .shadow-lg { box-shadow: var(--shadow); }
        .transition { transition: transform 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease, filter 0.22s ease; }
        .transform { transform: translateZ(0); }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .hover\:bg-gray-200:hover { background: #eef2ff; }
        .hover\:shadow-purple-500\/50:hover { box-shadow: 0 12px 36px rgba(122, 77, 255, 0.42); }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(37, 31, 75, 0.9), rgba(16, 13, 33, 0.94)),
                rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(142, 232, 255, 0.18);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(125deg, rgba(255, 255, 255, 0.14), transparent 30%),
                linear-gradient(180deg, rgba(127, 246, 255, 0.08), transparent 50%);
            pointer-events: none;
        }

        .gradient-text {
            background: linear-gradient(180deg, #fff3b0 0%, #ff81e7 38%, #7ff6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-font {
            font-family: 'Bangers', system-ui, sans-serif;
            letter-spacing: 0.08em;
            line-height: 1.08;
        }

        .pulse { animation: pulse 1.8s ease-in-out infinite; }

        .start-card::after,
        .gameover-card::after {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .hero-strip {
            display: flex;
            justify-content: center;
            gap: 0.65rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .hero-chip {
            min-width: 3.1rem;
            height: 3.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(126, 96, 255, 0.48), rgba(22, 19, 47, 0.9));
            border: 1px solid rgba(127, 246, 255, 0.22);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            font-size: 1.45rem;
        }

        .cta-button,
        .secondary-button {
            position: relative;
            z-index: 1;
        }

        .cta-button {
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .secondary-button {
            background: linear-gradient(180deg, #f8f7ff, #dce4ff);
            color: #1b2142;
        }

        .hud-shell {
            align-items: flex-start;
            gap: 0.75rem;
            padding-top: max(1rem, env(safe-area-inset-top));
        }

        .hud-card {
            min-width: 0;
            padding: 0.65rem 0.95rem;
            background: linear-gradient(180deg, rgba(32, 26, 67, 0.92), rgba(13, 11, 30, 0.92));
            border: 1px solid rgba(127, 246, 255, 0.18);
            border-radius: 1rem;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            text-transform: uppercase;
        }

        .hud-label {
            display: block;
            margin-bottom: 0.25rem;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #a7f8ff;
        }

        .hud-value {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: clamp(0.9rem, 3.4vw, 1.4rem);
            line-height: 1.1;
            color: var(--text);
            text-shadow: 0 0 10px rgba(51, 214, 255, 0.16);
        }

        .hud-value span:last-child {
            white-space: nowrap;
        }

        .next-orb {
            width: 2rem;
            height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85), rgba(127, 246, 255, 0.22) 28%, rgba(255, 79, 216, 0.4) 75%, rgba(17, 15, 37, 0.95));
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 0 18px rgba(127, 246, 255, 0.2);
            font-size: 1rem;
        }

        .corner-badge {
            position: absolute;
            right: 0.95rem;
            top: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.65rem;
            border-radius: 999px;
            background: rgba(11, 13, 28, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffe99a;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-copy {
            position: relative;
            z-index: 1;
            max-width: 22rem;
            margin-left: auto;
            margin-right: auto;
        }

        .feedback-stack {
            position: absolute;
            right: max(0.75rem, env(safe-area-inset-right));
            bottom: max(0.75rem, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.55rem;
            z-index: 4;
        }

        .feedback-gif {
            width: min(30vw, 118px);
            border-radius: 1rem;
            border: 1px solid rgba(127, 246, 255, 0.22);
            background: rgba(8, 10, 18, 0.72);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }

        .feedback-gif.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            min-width: 7rem;
            max-width: 12rem;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            background: rgba(11, 13, 28, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff5c4;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }

        .feedback-caption.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        @media (max-width: 640px) {
            .p-10 { padding: 1.35rem; }
            .text-4xl { font-size: 1.75rem; }
            .text-3xl { font-size: 1.35rem; }
            .text-xl { font-size: 1rem; }
            .px-6 {
                padding-left: max(0.8rem, env(safe-area-inset-left));
                padding-right: max(0.8rem, env(safe-area-inset-right));
            }
            .hero-strip {
                gap: 0.5rem;
                margin-bottom: 1.35rem;
            }
            .hero-chip {
                min-width: 2.7rem;
                height: 2.7rem;
                font-size: 1.15rem;
            }
            .hud-shell {
                gap: 0.5rem;
            }
            .hud-card {
                padding: 0.55rem 0.7rem;
                border-radius: 0.85rem;
            }
            .hud-label {
                font-size: 0.48rem;
            }
            .hud-value {
                font-size: 0.88rem;
                gap: 0.32rem;
            }
            .next-orb {
                width: 1.75rem;
                height: 1.75rem;
                font-size: 0.9rem;
            }
            .corner-badge {
                right: 0.75rem;
                top: 0.75rem;
                font-size: 0.62rem;
            }
            .feedback-stack {
                right: max(0.5rem, env(safe-area-inset-right));
                bottom: max(0.5rem, env(safe-area-inset-bottom));
                gap: 0.4rem;
            }
            .feedback-gif {
                width: min(24vw, 80px);
            }
            .feedback-caption {
                min-width: 5.5rem;
                max-width: 9rem;
                font-size: 0.58rem;
                padding: 0.35rem 0.55rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel start-card p-10 rounded-3xl text-center pointer-events-auto hover:scale-105 transition max-w-md w-full mx-4">
                <div class="corner-badge">⚡ fusion pit</div>
                <h1 class="text-6xl font-extrabold mb-2 gradient-text drop-shadow-lg title-font">BRAINROT<br>FUSION</h1>
                <p class="text-gray-300 text-xl mb-8 font-semibold pulse status-copy">Pilot the meme core cannon and stack matching weirdos into bigger, louder chaos.</p>
                <div class="hero-strip" aria-hidden="true">
                    <span class="hero-chip">💀</span><span class="hero-chip">🤡</span><span class="hero-chip">🪙</span><span class="hero-chip">🗿</span><span class="hero-chip">🧠</span>
                </div>
                <button id="start-btn" class="cta-button bg-gradient-to-r text-white font-bold py-4 px-10 rounded-full shadow-lg hover:shadow-purple-500/50 hover:scale-105 transition transform">START DROP</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel gameover-card p-10 rounded-3xl text-center pointer-events-auto max-w-md w-full mx-4">
                <div class="corner-badge">☠ overload</div>
                <h2 class="text-5xl font-bold text-red-500 mb-4 drop-shadow-md title-font">STACK OVERLOAD</h2>
                <div class="text-3xl text-white mb-2">Chaos Score: <span id="finalScore" class="text-yellow-400">0</span></div>
                <p class="text-gray-400 mb-8 text-sm status-copy">The warning beam got buried. Reboot the pit and try a cleaner combo chain.</p>
                <button id="restart-btn" class="secondary-button bg-white text-gray-900 font-bold py-3 px-8 rounded-full shadow-lg hover:bg-gray-200 transition">Drop Again</button>
            </div>
            
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <!-- [agent-note][stage3] resolved-gif: merge-reaction + fail-reaction -> catalogs/gifs.json -->
            <!-- HUD -->
            <div id="hud" class="hud-shell absolute top-4 left-0 w-full flex justify-between px-6 pointer-events-none hidden">
                 <div class="hud-card">
                     <span class="hud-label">Chaos Score</span>
                     <div class="hud-value"><span>🏆</span><span id="score">0</span></div>
                 </div>
                 <div class="hud-card text-center">
                     <span class="hud-label">Next Core</span>
                     <div class="hud-value"><span class="next-orb" id="next-item">💀</span></div>
                 </div>
             </div>
            <div id="feedback-stack" class="feedback-stack" aria-live="polite">
                <div id="feedback-caption" class="feedback-caption">combo ready</div>
                <img id="merge-gif" class="feedback-gif" alt="Merge reaction" src="https://i.giphy.com/3uHqVTVsvzuZia7z39.webp">
                <img id="fail-gif" class="feedback-gif" alt="Fail reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3",
            sfx: {
                drop: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                bump: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                merge: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                next: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                uiStart: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            images: {
                shopping: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png"
            },
            gifs: {
                merge: "https://i.giphy.com/3uHqVTVsvzuZia7z39.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const VISUAL_THEME = {
            bgTop: '#181137',
            bgBottom: '#090914',
            grid: 'rgba(127, 246, 255, 0.08)',
            laneGlow: 'rgba(127, 246, 255, 0.16)',
            laneBeam: 'rgba(255,255,255,0.08)',
            danger: 'rgba(255, 91, 126, 0.7)',
            warningFill: 'rgba(255, 91, 126, 0.12)',
            sparkle: '#7ff6ff'
        };

        // Preload Images
        const imgCache = {};
        const loadImages = () => {
            for (const [key, url] of Object.entries(ASSETS.images)) {
                const img = new Image();
                img.src = url;
                imgCache[key] = img;
            }
        };
        loadImages();

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayedAt = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.sfxVolumes = {
                    drop: 0.4,
                    bump: 0.24,
                    merge: 0.72,
                    next: 0.45,
                    uiStart: 0.55,
                    fail: 0.68
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = this.bgm.currentTime || 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, minGap = 90) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
                this.lastPlayedAt[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolumes[key] ?? 0.6;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();
        const mergeGifEl = document.getElementById('merge-gif');
        const failGifEl = document.getElementById('fail-gif');
        const feedbackCaptionEl = document.getElementById('feedback-caption');
        let feedbackTimer = 0;
        let failFeedbackTimer = 0;

        function showFeedback(type, label, duration = 1100) {
            if (feedbackTimer) clearTimeout(feedbackTimer);
            if (failFeedbackTimer) clearTimeout(failFeedbackTimer);

            feedbackCaptionEl.textContent = label;
            feedbackCaptionEl.classList.add('show');

            const activeGif = type === 'fail' ? failGifEl : mergeGifEl;
            const idleGif = type === 'fail' ? mergeGifEl : failGifEl;
            idleGif.classList.remove('show');
            activeGif.classList.add('show');

            const timerRef = setTimeout(() => {
                activeGif.classList.remove('show');
                feedbackCaptionEl.classList.remove('show');
            }, duration);

            if (type === 'fail') {
                failFeedbackTimer = timerRef;
            } else {
                feedbackTimer = timerRef;
            }
        }

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let gameActive = false;
        let score = 0;
        let balls = [];
        let particles = [];
        let nextBallType = 0;
        let currentDropperX = 0;
        let isDropping = false;
        let gameOverTimer = 0;

        // Physics Constants
        const GRAVITY = 0.5;
        const FRICTION = 0.98;
        const BOUNCE = 0.4;
        const WALL_FRICTION = 0.7;
        
        // Game Design: Tiers
        // Type: 0..6
        const TIERS = [
            { radius: 25, color: '#cfd7ff', rim: '#f6fbff', glow: 'rgba(127, 246, 255, 0.4)', face: '💀', accent: 'bone', type: 'emoji' },
            { radius: 35, color: '#ff81e7', rim: '#fff2ff', glow: 'rgba(255, 79, 216, 0.35)', face: '🤡', accent: 'jester', type: 'emoji' },
            { radius: 50, color: '#ffd447', rim: '#fff2b0', glow: 'rgba(255, 212, 71, 0.35)', imgKey: 'shopping', accent: 'coin', type: 'image' },
            { radius: 65, color: '#8d82ff', rim: '#f3f2ff', glow: 'rgba(141, 130, 255, 0.34)', face: '🗿', accent: 'stone', type: 'emoji' },
            { radius: 85, color: '#53e0ff', rim: '#ecffff', glow: 'rgba(83, 224, 255, 0.32)', face: '👽', accent: 'alien', type: 'emoji' },
            { radius: 105, color: '#b06bff', rim: '#f8ecff', glow: 'rgba(176, 107, 255, 0.34)', face: '🧠', accent: 'brain', type: 'emoji' },
            { radius: 130, color: '#ffffff', rim: '#ffffff', glow: 'rgba(255, 255, 255, 0.34)', face: '🌌', accent: 'cosmos', type: 'emoji' }
        ];

        /** 4. RESIZE & INIT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            currentDropperX = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        const BRAINROT_WORDS = ["CHAOS", "COMBO", "MERGE", "RIZZ", "SIGMA", "STACK", "GLOW", "FUSE"];
        
        function initBackground() {
            particles = [];
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    text: BRAINROT_WORDS[Math.floor(Math.random() * BRAINROT_WORDS.length)],
                    speed: 0.4 + Math.random() * 1.25,
                    opacity: 0.08 + Math.random() * 0.15,
                    size: 20 + Math.random() * 30
                });
            }
        }

        function initGame() {
            score = 0;
            balls = [];
            gameOverTimer = 0;
            isDropping = false;
            nextBallType = 0;
            currentDropperX = width / 2;
            mergeGifEl.classList.remove('show');
            failGifEl.classList.remove('show');
            feedbackCaptionEl.classList.remove('show');
            document.getElementById('score').innerText = score;
            document.getElementById('finalScore').innerText = score;
            updateNextItemDisplay();
            initBackground();
        }

        function getTierGlyph(tier) {
            if (tier.type === 'emoji') return tier.face;
            if (tier.imgKey === 'shopping') return '🪙';
            return '✨';
        }

        function updateNextItemDisplay() {
            const tier = TIERS[nextBallType];
            const hudEl = document.getElementById('next-item');
            hudEl.innerText = getTierGlyph(tier);
        }

        function drawOrbShell(radius, tier, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;

            const gradient = ctx.createRadialGradient(-radius * 0.35, -radius * 0.45, radius * 0.18, 0, 0, radius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.14, tier.rim);
            gradient.addColorStop(0.34, tier.color);
            gradient.addColorStop(1, '#110f25');

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.shadowColor = tier.glow;
            ctx.shadowBlur = radius * 0.42;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.lineWidth = Math.max(2, radius * 0.08);
            ctx.strokeStyle = 'rgba(255,255,255,0.32)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-radius * 0.25, -radius * 0.3, radius * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(radius * 0.12, radius * 0.18, radius * 0.72, Math.PI * 0.15, Math.PI * 0.85);
            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.lineWidth = Math.max(2, radius * 0.06);
            ctx.stroke();

            ctx.restore();
        }

        function drawFaceDetails(tier, radius) {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (tier.type === 'image' && imgCache[tier.imgKey] && imgCache[tier.imgKey].complete) {
                const s = radius * 1.36;
                try {
                    ctx.drawImage(imgCache[tier.imgKey], -s / 2, -s / 2, s, s);
                } catch (e) {
                    ctx.font = `${radius * 0.85}px serif`;
                    ctx.fillText('🪙', 0, radius * 0.06);
                }
            } else {
                ctx.font = `${radius * 0.86}px serif`;
                ctx.fillText(tier.face, 0, radius * 0.08);
            }

            if (tier.accent !== 'coin') {
                ctx.fillStyle = 'rgba(10, 8, 25, 0.62)';
                ctx.beginPath();
                ctx.arc(-radius * 0.26, -radius * 0.08, radius * 0.08, 0, Math.PI * 2);
                ctx.arc(radius * 0.26, -radius * 0.08, radius * 0.08, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, radius * 0.12, radius * 0.24, 0.1, Math.PI - 0.1);
                ctx.strokeStyle = 'rgba(10, 8, 25, 0.45)';
                ctx.lineWidth = Math.max(2, radius * 0.06);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawBackground() {
            const bg = ctx.createLinearGradient(0, 0, 0, height);
            bg.addColorStop(0, VISUAL_THEME.bgTop);
            bg.addColorStop(1, VISUAL_THEME.bgBottom);
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.strokeStyle = VISUAL_THEME.grid;
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 32) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += 32) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = 'rgba(127, 246, 255, 0.04)';
            ctx.fillRect(width * 0.2, 0, width * 0.6, height);
            ctx.restore();
        }

        /** 5. PHYSICS ENGINE */
        class Ball {
            constructor(x, y, tierIdx) {
                this.x = x;
                this.y = y;
                this.tierIdx = tierIdx;
                this.radius = TIERS[tierIdx].radius;
                this.vx = 0;
                this.vy = 0;
                this.mass = this.radius;
                this.markedForDeletion = false;
                this.isStatic = false;
            }

            update() {
                if (this.isStatic) return;

                this.vy += GRAVITY;
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = -this.vx * WALL_FRICTION;
                } else if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx = -this.vx * WALL_FRICTION;
                }

                if (this.y + this.radius > height) {
                    this.y = height - this.radius;
                    this.vy = -this.vy * BOUNCE;
                    if (Math.abs(this.vy) < GRAVITY * 2) this.vy = 0;
                }
            }

            draw() {
                const tier = TIERS[this.tierIdx];
                ctx.save();
                ctx.translate(this.x, this.y);

                drawOrbShell(this.radius, tier);
                drawFaceDetails(tier, this.radius);

                ctx.restore();
            }
        }

        function resolveCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDist = b1.radius + b2.radius;

                    if (distance < minDist) {
                        if (b1.tierIdx === b2.tierIdx && b1.tierIdx < TIERS.length - 1) {
                            const newX = (b1.x + b2.x) / 2;
                            const newY = (b1.y + b2.y) / 2;
                            b1.markedForDeletion = true;
                            b2.markedForDeletion = true;
                            
                            const newBall = new Ball(newX, newY, b1.tierIdx + 1);
                            newBall.vy = -2; 
                            balls.push(newBall);
                            
                            score += (b1.tierIdx + 1) * 10;
                            document.getElementById('score').innerText = score;
                            audio.playSFX('merge', 180);
                            showFeedback('merge', `combo x${b1.tierIdx + 2}`, 950);
                            continue;
                        }

                        const angle = Math.atan2(dy, dx);
                        const overlap = minDist - distance;
                        const moveX = Math.cos(angle) * overlap * 0.5;
                        const moveY = Math.sin(angle) * overlap * 0.5;

                        b1.x -= moveX;
                        b1.y -= moveY;
                        b2.x += moveX;
                        b2.y += moveY;

                        const nx = dx / distance;
                        const ny = dy / distance;
                        const dvx = b1.vx - b2.vx;
                        const dvy = b1.vy - b2.vy;
                        const velAlongNormal = dvx * nx + dvy * ny;

                        if (velAlongNormal > 0) continue;

                        const jVal = -(1 + 0.2) * velAlongNormal;
                        const invMass1 = 1 / b1.radius;
                        const invMass2 = 1 / b2.radius;
                        const impulse = jVal / (invMass1 + invMass2);
                        if (Math.abs(velAlongNormal) > 2.8) {
                            audio.playSFX('bump', 120);
                        }

                        const impulseX = impulse * nx;
                        const impulseY = impulse * ny;

                        b1.vx += impulseX * invMass1;
                        b1.vy += impulseY * invMass1;
                        b2.vx -= impulseX * invMass2;
                        b2.vy -= impulseY * invMass2;
                    }
                }
            }
            
            balls = balls.filter(b => !b.markedForDeletion);
        }

        /** 6. GAME LOOP */
        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawBackground();
            
            ctx.save();
            particles.forEach(p => {
                p.y += p.speed;
                if (p.y > height + 50) {
                    p.y = -50;
                    p.x = Math.random() * width;
                }
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = VISUAL_THEME.sparkle;
                ctx.font = `${p.size}px "Bangers", system-ui, sans-serif`;
                ctx.fillText(p.text, p.x, p.y);
            });
            ctx.restore();

            const dangerY = 150;
            ctx.save();
            ctx.fillStyle = VISUAL_THEME.warningFill;
            ctx.fillRect(0, 0, width, dangerY);
            ctx.restore();

            ctx.beginPath();
            ctx.moveTo(0, dangerY);
            ctx.lineTo(width, dangerY);
            ctx.strokeStyle = VISUAL_THEME.danger;
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(255, 91, 126, 0.35)';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;

            if (!isDropping) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(currentDropperX, 50);
                ctx.lineTo(currentDropperX, height);
                ctx.strokeStyle = VISUAL_THEME.laneBeam;
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(currentDropperX, 70, TIERS[nextBallType].radius + 10, 0, Math.PI * 2);
                ctx.fillStyle = VISUAL_THEME.laneGlow;
                ctx.fill();

                ctx.translate(currentDropperX, 70);
                drawOrbShell(TIERS[nextBallType].radius, TIERS[nextBallType], 0.65);
                drawFaceDetails(TIERS[nextBallType], TIERS[nextBallType].radius);
                ctx.restore();
            }

            const steps = 4;
            for (let s = 0; s < steps; s++) {
                balls.forEach(b => b.update());
                resolveCollisions();
            }

            balls.forEach(b => b.draw());

            let danger = false;
            balls.forEach(b => {
                if (b.y - b.radius < dangerY && Math.abs(b.vy) < 0.1 && Math.abs(b.vx) < 0.1) {
                    danger = true;
                }
            });

            if (danger) {
                gameOverTimer++;
                if (gameOverTimer > 120) {
                    gameOver();
                }
            } else {
                gameOverTimer = 0;
            }

            requestAnimationFrame(gameLoop);
        }

        function spawnBall() {
            if (isDropping) return;
            isDropping = true;

            const ball = new Ball(currentDropperX, 70, nextBallType);
            balls.push(ball);
            audio.playSFX('drop', 120);

            setTimeout(() => {
                isDropping = false;
                nextBallType = Math.floor(Math.random() * 3);
                updateNextItemDisplay();
                audio.playSFX('next', 140);
            }, 500);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 250);
            showFeedback('fail', 'pit jammed', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        /** 7. INPUT HANDLING */
        const gameContainer = document.getElementById('game-container');

        const handleMove = (x) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            let pos = x - rect.left;
            const r = TIERS[nextBallType].radius;
            if (pos < r) pos = r;
            if (pos > width - r) pos = width - r;
            currentDropperX = pos;
        };

        gameContainer.addEventListener('mousemove', (e) => handleMove(e.clientX));
        gameContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleMove(e.touches[0].clientX);
        }, { passive: false });

        const handleClick = () => {
            if (!gameActive) return;
            spawnBall();
        };

        gameContainer.addEventListener('click', handleClick);

        /** 8. UI CONTROLS */
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        const startGame = (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('uiStart', 150);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        };

        const restartGame = (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('uiStart', 150);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        };

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);
        // [agent-note][stage4] mobile-actionability: ensure CTA tap works even when browsers suppress synthetic click timing.
        startBtn.addEventListener('touchend', startGame, { passive: true });
        restartBtn.addEventListener('touchend', restartGame, { passive: true });
        
    });
    </script>
</body>
</html>
