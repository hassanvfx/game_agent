<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Impostor Run: Swarm</title>
    <!-- [agent-note][stage4] resolved-font: title->Russo One, ui->Exo 2 via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Russo+One&display=swap">
    <style>
        :root {
            --bg-deep: #060812;
            --bg-mid: #10172b;
            --panel: rgba(13, 19, 37, 0.88);
            --panel-border: rgba(111, 231, 255, 0.28);
            --text-main: #e7f5ff;
            --text-soft: rgba(215, 234, 255, 0.8);
            --accent: #8af5ff;
            --accent-strong: #46d7ff;
            --danger: #ff5a7d;
            --danger-deep: #7f1d3c;
            --warning: #ffd166;
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(70, 215, 255, 0.08), transparent 35%),
                radial-gradient(circle at bottom, rgba(255, 90, 125, 0.08), transparent 30%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(70, 215, 255, 0.08), transparent 28%),
                linear-gradient(180deg, #12182b 0%, #070b14 100%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, transparent 0 48%, rgba(138, 245, 255, 0.06) 50%, transparent 52%),
                linear-gradient(0deg, transparent 0 48%, rgba(255, 90, 125, 0.05) 50%, transparent 52%);
            background-size: 160px 160px;
            opacity: 0.35;
            mix-blend-mode: screen;
        }

        #game-container::after {
            background:
                radial-gradient(circle at 15% 18%, rgba(138, 245, 255, 0.14), transparent 12%),
                radial-gradient(circle at 82% 24%, rgba(255, 90, 125, 0.12), transparent 14%),
                radial-gradient(circle at 50% 85%, rgba(255, 209, 102, 0.08), transparent 18%);
            opacity: 0.9;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(18, 25, 45, 0.96), rgba(7, 12, 24, 0.94));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 14px 34px rgba(0, 0, 0, 0.42),
                0 0 26px rgba(70, 215, 255, 0.14);
            border-radius: 28px;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(138, 245, 255, 0.14), transparent 32%),
                linear-gradient(315deg, rgba(255, 90, 125, 0.1), transparent 28%);
            pointer-events: none;
        }

        .screen-card {
            width: min(90vw, 380px);
            padding: 28px 24px;
            text-align: center;
            pointer-events: auto;
        }

        .screen-title {
            margin: 0 0 8px;
            font-family: 'Russo One', 'Exo 2', sans-serif;
            font-size: clamp(2rem, 7vw, 3.2rem);
            line-height: 0.96;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
            text-shadow:
                0 0 10px rgba(138, 245, 255, 0.45),
                0 0 24px rgba(255, 90, 125, 0.22);
        }

        .screen-title .danger {
            color: var(--danger);
        }

        .screen-subtitle {
            margin: 0 0 20px;
            font-size: clamp(1rem, 3.8vw, 1.15rem);
            line-height: 1.4;
            color: var(--text-soft);
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .screen-subtitle .accent {
            color: var(--accent);
        }

        .btn-impostor {
            width: 100%;
            min-height: 56px;
            padding: 16px 20px;
            border: 1px solid rgba(138, 245, 255, 0.28);
            border-radius: 999px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-family: 'Russo One', 'Exo 2', sans-serif;
            font-size: clamp(1rem, 4vw, 1.15rem);
            background:
                linear-gradient(135deg, #ff5a7d 0%, #b8336a 48%, #4b2746 100%);
            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.28),
                0 0 24px rgba(255, 90, 125, 0.32);
            position: relative;
            overflow: hidden;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .btn-impostor::after {
            content: '';
            position: absolute;
            top: -55%;
            left: -35%;
            width: 60%;
            height: 210%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
            transform: rotate(18deg);
            opacity: 0;
            transition: transform 260ms ease, opacity 260ms ease;
        }

        .btn-impostor:active {
            transform: scale(0.96);
            filter: brightness(1.06);
        }

        .btn-impostor:active::after {
            opacity: 1;
            transform: translateX(180%) rotate(18deg);
        }

        .score-shell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 72px;
            margin-top: 4px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(138, 245, 255, 0.18);
            color: white;
            font-family: 'Russo One', 'Exo 2', sans-serif;
            font-size: clamp(1.25rem, 4.8vw, 1.7rem);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: calc(var(--sat) + 14px);
            left: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            pointer-events: none;
            color: white;
            font-size: 14px;
            line-height: 1;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: 'Russo One', 'Exo 2', sans-serif;
            background: rgba(8, 15, 28, 0.74);
            border: 1px solid rgba(138, 245, 255, 0.22);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 10px 24px rgba(0,0,0,0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #hud:not(.hidden) {
            display: inline-flex;
        }

        .hud-pulse {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: radial-gradient(circle, #ff9db0 0%, var(--danger) 55%, #86254f 100%);
            box-shadow: 0 0 14px rgba(255, 90, 125, 0.8);
            animation: signalPulse 1.1s ease-in-out infinite;
            flex: 0 0 auto;
        }

        .hud-copy {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        #score {
            color: var(--accent);
        }

        #tutorial-hint {
            position: absolute;
            bottom: calc(18px + var(--sab));
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(8, 15, 28, 0.58);
            border: 1px solid rgba(138, 245, 255, 0.16);
            color: rgba(231, 245, 255, 0.74);
            font-family: 'Russo One', 'Exo 2', sans-serif;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            white-space: nowrap;
            animation: signalPulse 1.4s ease-in-out infinite;
        }

        .mission-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(138, 245, 255, 0.08);
            border: 1px solid rgba(138, 245, 255, 0.18);
            color: var(--accent);
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: 'Russo One', 'Exo 2', sans-serif;
        }

        .mission-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            box-shadow: 0 0 10px rgba(255, 209, 102, 0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-9px); }
        }

        @keyframes signalPulse {
            0%, 100% { opacity: 0.68; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .animate-float {
            animation: float 3.1s ease-in-out infinite;
        }

        @media (min-width: 640px) {
            .screen-card {
                padding: 34px 30px;
            }

            #hud {
                left: 18px;
                top: calc(var(--sat) + 18px);
                font-size: 15px;
            }

            #tutorial-hint {
                font-size: 12px;
            }
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 6;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(84px, 24vw, 148px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(138, 245, 255, 0.28);
            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.28),
                0 0 24px rgba(138, 245, 255, 0.24);
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 180ms ease, transform 180ms ease;
            background: rgba(4, 8, 18, 0.7);
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: scale(1);
        }

        #pickup-gif {
            right: 14px;
            bottom: calc(74px + var(--sab));
        }

        #fail-gif {
            top: calc(var(--sat) + 74px);
            right: 14px;
        }

        @media (max-width: 420px) {
            .screen-card {
                padding: 24px 18px;
                border-radius: 24px;
            }

            .screen-subtitle {
                margin-bottom: 18px;
            }

            .btn-impostor {
                min-height: 52px;
                padding: 14px 16px;
                letter-spacing: 0.12em;
            }

            #hud {
                left: 10px;
                top: calc(var(--sat) + 10px);
                padding: 9px 12px;
                max-width: calc(100vw - 20px);
            }

            #tutorial-hint {
                max-width: calc(100vw - 28px);
                text-align: center;
                white-space: normal;
            }

            #pickup-gif {
                right: 10px;
                bottom: calc(88px + var(--sab));
                width: clamp(76px, 22vw, 104px);
            }

            #fail-gif {
                top: calc(var(--sat) + 84px);
                right: 10px;
                width: clamp(76px, 22vw, 104px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: vent-pickup + lockdown-fail overlays from catalogs/gifs.json -->
        <div id="feedback-layer" aria-hidden="true">
            <img id="pickup-gif" class="feedback-gif hidden" alt="" loading="lazy">
            <img id="fail-gif" class="feedback-gif hidden" alt="" loading="lazy">
        </div>

        <div id="ui-layer">
            <div id="start-screen" class="glass-panel screen-card animate-float">
                <div class="mission-badge"><span class="dot"></span> Vent Sweep Protocol</div>
                <h1 class="screen-title">VENT <span class="danger">RAID</span></h1>
                <p class="screen-subtitle">
                    <span class="accent">Ghost-run the shafts.</span><br>
                    Sweep every vent and slip past the patrol swarm.
                </p>
                <button id="start-btn" class="btn-impostor">Begin Raid</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel screen-card">
                <div class="mission-badge"><span class="dot"></span> Patrol Lockdown</div>
                <h2 class="screen-title"><span class="danger">Raid</span> Ended</h2>
                <div class="screen-subtitle">
                    Vents Swept
                    <div class="score-shell"><span id="finalScore">0</span></div>
                </div>
                <button id="restart-btn" class="btn-impostor">Run It Back</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-pulse"></div>
                <span class="hud-copy">Sweeps: <span id="score">0</span></span>
            </div>

            <div id="tutorial-hint" class="hidden">Drag to Drift</div>
        </div>
    </div>

    <script>
    const root = document.documentElement;
    root.style.setProperty('--sat', 'env(safe-area-inset-top)');
    root.style.setProperty('--sab', 'env(safe-area-inset-bottom)');

    document.addEventListener('DOMContentLoaded', () => {

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                pickup: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const CONFIG = {
            initialEnemies: 8,
            spawnRate: 1,
            playerSpeed: 0.12,
            baseEnemySpeed: 2,
            colors: ['#2aa7ff', '#18b77f', '#9d63ff', '#ffca54', '#ff8b5f', '#ff5fa2', '#40d7ff', '#5e6bff']
        };

        class AudioController {
            constructor() {
                this.enabled = true;
                this.started = false;
                this.lastPlayAt = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};

                const sfxVolumes = {
                    start: 0.45,
                    uiClick: 0.35,
                    score: 0.5,
                    streak: 0.46,
                    fail: 0.55
                };

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = {
                        audio: new Audio(src),
                        volume: sfxVolumes[key] ?? 0.5
                    };
                    this.sfx[key].audio.preload = 'auto';
                }
            }

            unlock() {
                if (this.started) return;
                this.started = true;
                this.bgm.load();
                for (const { audio } of Object.values(this.sfx)) {
                    audio.load();
                }
            }

            playBGM() {
                if (!this.enabled || !this.started) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, debounceMs = 0) {
                if (!this.enabled || !this.started || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayAt.get(key) ?? 0;
                if (debounceMs && now - last < debounceMs) return;
                this.lastPlayAt.set(key, now);

                const { audio, volume } = this.sfx[key];
                const clone = audio.cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        class FeedbackController {
            constructor() {
                this.pickupGif = document.getElementById('pickup-gif');
                this.failGif = document.getElementById('fail-gif');
                this.pickupTimeout = null;
                this.failTimeout = null;
                this.pickupGif.src = ASSETS.gifs.pickup;
                this.failGif.src = ASSETS.gifs.fail;
            }

            showPickup() {
                this.pickupGif.classList.remove('hidden');
                this.pickupGif.classList.add('show');
                clearTimeout(this.pickupTimeout);
                this.pickupTimeout = setTimeout(() => {
                    this.pickupGif.classList.remove('show');
                    this.pickupGif.classList.add('hidden');
                }, 900);
            }

            showFail() {
                this.failGif.classList.remove('hidden');
                this.failGif.classList.add('show');
                clearTimeout(this.failTimeout);
                this.failTimeout = setTimeout(() => {
                    this.failGif.classList.remove('show');
                    this.failGif.classList.add('hidden');
                }, 1500);
            }

            reset() {
                this.pickupGif.classList.add('hidden');
                this.pickupGif.classList.remove('show');
                this.failGif.classList.add('hidden');
                this.failGif.classList.remove('show');
            }
        }

        const audio = new AudioController();
        const feedback = new FeedbackController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;
        let gameActive = false;
        let score = 0;
        let frames = 0;
        let animationId;

        let player = { x: 0, y: 0, radius: 22, color: '#ff5a7d' };
        let enemies = [];
        let vents = [];
        let stars = [];

        let input = { x: 0, y: 0, active: false };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (!gameActive && stars.length === 0) initStars();
        }
        window.addEventListener('resize', resize);
        resize();

        function updateInput(x, y) {
            input.x = x;
            input.y = y;
            input.active = true;
        }

        const gameContainer = document.getElementById('game-container');

        window.addEventListener('mousemove', e => updateInput(e.clientX, e.clientY));
        /* [agent-note][stage4] repaired: mobile-tap-risk | action: scoped touch suppression to gameplay surface */
        gameContainer.addEventListener('touchmove', e => {
            if (!gameActive || e.touches.length === 0) return;
            e.preventDefault();
            updateInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        gameContainer.addEventListener('touchstart', e => {
            if (e.touches.length === 0) return;
            if (gameActive) {
                e.preventDefault();
            }
            updateInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        function initStars() {
            stars = [];
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.8 + 0.2
                });
            }
        }

        function drawBackground() {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#12192d');
            bgGradient.addColorStop(0.45, '#0b1020');
            bgGradient.addColorStop(1, '#050811');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.2;
            const glowGradient = ctx.createRadialGradient(width * 0.5, height * 0.15, 0, width * 0.5, height * 0.15, width * 0.6);
            glowGradient.addColorStop(0, 'rgba(70, 215, 255, 0.45)');
            glowGradient.addColorStop(1, 'rgba(70, 215, 255, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();

            ctx.strokeStyle = 'rgba(78, 101, 145, 0.24)';
            ctx.lineWidth = 1.5;
            const gridSize = 80;
            const offsetX = (frames * 0.5) % gridSize;
            const offsetY = (frames * 0.5) % gridSize;

            ctx.beginPath();
            for (let x = -offsetX; x < width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = -offsetY; y < height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(138, 245, 255, 0.07)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let x = -offsetX * 0.5; x < width; x += gridSize * 2) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            ctx.stroke();

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) star.y = 0;

                ctx.save();
                ctx.globalAlpha = Math.random() * 0.45 + 0.2;
                ctx.fillStyle = '#dff8ff';
                ctx.shadowColor = 'rgba(138, 245, 255, 0.7)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawCharacter(char, isImpostor) {
            const { x, y, radius, color } = char;
            const bob = isImpostor ? Math.sin(frames * 0.14) * 1.4 : Math.sin((frames + x) * 0.08) * 0.8;
            const bodyX = x;
            const bodyY = y + bob;

            ctx.save();

            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(bodyX, bodyY + radius * 0.9, radius * 1.02, radius * 0.32, 0, 0, Math.PI * 2);
            ctx.fill();

            if (isImpostor) {
                ctx.shadowColor = 'rgba(255, 90, 125, 0.62)';
                ctx.shadowBlur = 18;
            }

            const suitGradient = ctx.createLinearGradient(bodyX - radius, bodyY - radius, bodyX + radius, bodyY + radius * 1.4);
            suitGradient.addColorStop(0, '#ffffff');
            suitGradient.addColorStop(0.08, color);
            suitGradient.addColorStop(0.7, color);
            suitGradient.addColorStop(1, '#2a1a34');

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(bodyX - radius * 1.35, bodyY - radius * 0.48, radius * 0.6, radius * 1.32, 8);
            ctx.fill();

            ctx.fillStyle = suitGradient;
            ctx.beginPath();
            ctx.roundRect(bodyX - radius, bodyY - radius, radius * 2, radius * 2.1, radius * 0.95);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.13)';
            ctx.beginPath();
            ctx.roundRect(bodyX - radius * 0.72, bodyY - radius * 0.78, radius * 0.52, radius * 1.1, radius * 0.4);
            ctx.fill();

            const visorGradient = ctx.createLinearGradient(bodyX - radius * 0.2, bodyY - radius * 0.7, bodyX + radius * 1.2, bodyY + radius * 0.2);
            visorGradient.addColorStop(0, '#f5ffff');
            visorGradient.addColorStop(0.35, '#9fe7ff');
            visorGradient.addColorStop(1, '#3777b4');
            ctx.fillStyle = visorGradient;
            ctx.beginPath();
            ctx.ellipse(bodyX + radius * 0.38, bodyY - radius * 0.2, radius * 0.72, radius * 0.46, -0.08, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.72)';
            ctx.beginPath();
            ctx.ellipse(bodyX + radius * 0.55, bodyY - radius * 0.38, radius * 0.22, radius * 0.11, -0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = isImpostor ? 'rgba(255,255,255,0.35)' : 'rgba(231,245,255,0.14)';
            ctx.lineWidth = isImpostor ? 2.5 : 1.5;
            ctx.stroke();

            if (isImpostor) {
                ctx.strokeStyle = 'rgba(138, 245, 255, 0.55)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(bodyX, bodyY, radius * 1.38 + Math.sin(frames * 0.2) * 1.8, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawVent(v) {
            const size = 44;
            const pulse = (Math.sin(frames * 0.1) + 1) * 0.5;

            ctx.save();

            const frameGradient = ctx.createLinearGradient(v.x - size / 2, v.y - size / 2, v.x + size / 2, v.y + size / 2);
            frameGradient.addColorStop(0, '#2f4668');
            frameGradient.addColorStop(1, '#192133');
            ctx.fillStyle = frameGradient;
            ctx.strokeStyle = '#89dff9';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(v.x - size / 2, v.y - size / 2, size, size, 10);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#0f1727';
            for (let i = -12; i <= 12; i += 12) {
                ctx.fillRect(v.x - size / 2 + 6, v.y + i, size - 12, 5);
            }

            ctx.strokeStyle = `rgba(255, 90, 125, ${0.4 + pulse * 0.4})`;
            ctx.shadowColor = 'rgba(255, 90, 125, 0.8)';
            ctx.shadowBlur = 10 + pulse * 10;
            ctx.strokeRect(v.x - size / 2 - 5, v.y - size / 2 - 5, size + 10, size + 10);

            ctx.fillStyle = `rgba(138, 245, 255, ${0.2 + pulse * 0.18})`;
            ctx.beginPath();
            ctx.arc(v.x, v.y, size * 0.74 + pulse * 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            const r = 24 + Math.random() * 8;
            let x, y;

            switch (side) {
                case 0: x = Math.random() * width; y = -r - 20; break;
                case 1: x = width + r + 20; y = Math.random() * height; break;
                case 2: x = Math.random() * width; y = height + r + 20; break;
                case 3: x = -r - 20; y = Math.random() * height; break;
            }

            const targetX = width / 2 + (Math.random() - 0.5) * width * 0.5;
            const targetY = height / 2 + (Math.random() - 0.5) * height * 0.5;
            const angle = Math.atan2(targetY - y, targetX - x);

            const speedVar = Math.random() * 2 + (score * 0.05);
            const speed = CONFIG.baseEnemySpeed + speedVar;

            enemies.push({
                x: x, y: y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                radius: r,
                color: CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)]
            });
        }

        function spawnVent() {
            const padding = 60;
            vents.push({
                x: padding + Math.random() * (width - padding * 2),
                y: padding + Math.random() * (height - padding * 2),
                radius: 25
            });
        }

        function initGame() {
            score = 0;
            frames = 0;
            enemies = [];
            vents = [];

            player.x = width / 2;
            player.y = height / 2;
            input.x = width / 2;
            input.y = height / 2;

            spawnVent();
            for (let i = 0; i < CONFIG.initialEnemies; i++) {
                spawnEnemy();
            }

            document.getElementById('score').innerText = score;
            document.getElementById('tutorial-hint').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('tutorial-hint').classList.add('hidden');
            }, 3000);
        }

        function gameLoop() {
            if (!gameActive) return;

            frames++;
            ctx.clearRect(0, 0, width, height);
            drawBackground();

            const dx = input.x - player.x;
            const dy = input.y - player.y;
            player.x += dx * CONFIG.playerSpeed;
            player.y += dy * CONFIG.playerSpeed;

            player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

            for (let i = vents.length - 1; i >= 0; i--) {
                let v = vents[i];
                drawVent(v);
                const dist = Math.hypot(player.x - v.x, player.y - v.y);
                if (dist < player.radius + v.radius) {
                    vents.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', 80);
                    if (score > 0 && score % 5 === 0) {
                        audio.playSFX('streak', 200);
                    }
                    feedback.showPickup();
                    spawnVent();

                    spawnEnemy();
                    if (Math.random() > 0.7) spawnEnemy();
                }
            }

            for (let e of enemies) {
                e.x += e.dx;
                e.y += e.dy;

                if (e.x < e.radius || e.x > width - e.radius) e.dx *= -1;
                if (e.y < e.radius || e.y > height - e.radius) e.dy *= -1;

                drawCharacter(e, false);

                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                const collisionThreshold = (player.radius + e.radius) * 0.85;

                if (dist < collisionThreshold) {
                    gameOver();
                    return;
                }
            }

            drawCharacter(player, true);

            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            audio.stopBGM();
            audio.playSFX('fail', 120);
            feedback.showFail();

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');

        function startGame() {
            audio.unlock();
            feedback.reset();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');

            audio.playSFX('start', 120);
            audio.playBGM();

            input.x = width / 2;
            input.y = height / 2;

            gameActive = true;
            initGame();
            gameLoop();
        }

        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('uiClick', 90);
            startGame();
        });
        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('uiClick', 90);
            startGame();
        });

        resize();
        drawBackground();
    });
    </script>
</body>
