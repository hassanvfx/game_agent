    .text-amber-300 { color: #fcd34d; }
    .text-amber-400 { color: #fbbf24; }
    .text-amber-500\/60 { color: rgba(245, 158, 11, 0.6); }
    .text-amber-500 { color: #f59e0b; }
    .text-yellow-400 { color: #facc15; }
    .text-blue-300\/50 { color: rgba(147, 197, 253, 0.5); }
    .text-blue-400 { color: #60a5fa; }
    .text-orange-400 { color: #fb923c; }
    .text-orange-500\/70 { color: rgba(249, 115, 22, 0.7); }
    .text-red-400 { color: #f87171; }
    .text-red-500 { color: #ef4444; }
    .text-purple-500 { color: #a855f7; }
    .text-purple-500\/70 { color: rgba(168, 85, 247, 0.7); }
    .text-rose-600 { color: #e11d48; }
    .text-rose-500\/70 { color: rgba(244, 63, 94, 0.7); }
    .text-green-500 { color: #22c55e; }
    .text-green-500\/70 { color: rgba(34, 197, 94, 0.7); }
    .bg-black\/90 { background-color: rgba(0, 0, 0, 0.9); }
    .bg-cyan-900\/20 { background-color: rgba(22, 78, 99, 0.2); }
    .bg-cyan-800\/40 { background-color: rgba(21, 94, 117, 0.4); }
    .bg-gray-900\/80 { background-color: rgba(17, 24, 39, 0.8); }
    .bg-amber-400 { background-color: #fbbf24; }
    .bg-red-500 { background-color: #ef4444; }
    .from-black\/60 { --grad-from: rgba(0, 0, 0, 0.6); }
    .via-transparent { --grad-via: transparent; }
    .to-black\/60 { --grad-to: rgba(0, 0, 0, 0.6); }
    .bg-gradient-to-b { background-image: linear-gradient(to bottom, var(--grad-from), var(--grad-via), var(--grad-to)); }
    .bg-gradient-to-r { background-image: linear-gradient(to right, transparent, rgba(6, 182, 212, 0.5), transparent); }
    .opacity-10 { opacity: 0.1; }
    .opacity-30 { opacity: 0.3; }
    .opacity-50 { opacity: 0.5; }
    .drop-shadow-\[0_0_8px_rgba\(34\,211\,238\,0\.4\)\] { text-shadow: 0 0 8px rgba(34, 211, 238, 0.4); }
    .drop-shadow-\[0_0_10px_rgba\(34\,211\,238\,0\.3\)\] { text-shadow: 0 0 10px rgba(34, 211, 238, 0.3); }
    .shadow-\[0_0_8px_\#fbbf24\] { box-shadow: 0 0 8px #fbbf24; }
    .shadow-\[0_0_8px_\#ef4444\] { box-shadow: 0 0 8px #ef4444; }
    .transition-all { transition: all 0.2s ease; }
    .transition-opacity { transition: opacity 0.5s ease; }
    .duration-100 { transition-duration: 0.1s; }
    .duration-300 { transition-duration: 0.3s; }
    .duration-500 { transition-duration: 0.5s; }
    .duration-1000 { transition-duration: 1s; }
    .backdrop-blur-sm { backdrop-filter: blur(4px); }
    .active\:scale-95:active { transform: scale(0.95); }
    .active\:bg-cyan-500\/20:active { background-color: rgba(6, 182, 212, 0.2); }
    .hover\:bg-cyan-800\/40:hover { background-color: rgba(21, 94, 117, 0.4); }
    .mix-blend-overlay { mix-blend-mode: overlay; }
    .hidden { display: none !important; }
    .glass {
        background:
            linear-gradient(180deg, rgba(10, 20, 38, 0.94), rgba(4, 10, 20, 0.9)),
            radial-gradient(circle at top, rgba(121, 236, 255, 0.16), transparent 60%);
        backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
            0 0 0 1px rgba(4, 170, 255, 0.08),
            0 10px 24px rgba(0, 0, 0, 0.32),
            0 0 18px var(--panel-glow);
    }
    .glass-day {
        background: rgba(236, 246, 255, 0.86);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(41, 84, 123, 0.18);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 10px 22px rgba(37, 70, 109, 0.12);
        color: #10243a;
    }
    .scanline {
        background:
            linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.22)),
            linear-gradient(90deg, transparent, rgba(92,224,255,0.05), transparent);
        background-size: 100% 2px, 100% 100%;
        pointer-events: none;
    }
    #game-container::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(90deg, transparent 0, transparent 24px, var(--bg-grid) 25px, transparent 26px),
            linear-gradient(0deg, transparent 0, transparent 24px, var(--bg-grid) 25px, transparent 26px);
        background-size: 26px 26px;
        opacity: 0.18;
        z-index: 1;
    }
    #game-container::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 0%, rgba(121,236,255,0.16), transparent 40%);
        z-index: 2;
    }
    #ui-layer { pointer-events: none; }
    #ui-layer > * { pointer-events: auto; }
    #ui-main { pointer-events: none; }
    #hud-score,
    #weapon-bar,
    #game-over-screen .glass {
        position: relative;
    }
    #hud-score::before,
    #weapon-bar::before,
    #game-over-screen .glass::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background: linear-gradient(135deg, rgba(121,236,255,0.08), transparent 42%, rgba(255,211,106,0.08));
        opacity: 0.75;
    }
    #score-val,
    .weapon-btn span:first-child,
    #final-score,
    #game-over-screen h1 {
        font-family: 'Orbitron', 'Exo 2', sans-serif;
    }
    #district-name,
    #weather-name,
    #combo-text,
    #energy-val,
    #time-label,
    .text-\[10px\],
    .text-\[9px\] {
        text-shadow: 0 0 10px rgba(121, 236, 255, 0.14);
    }
    .weapon-btn {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(120, 214, 255, 0.14);
    }
    .weapon-btn::after {
        content: '';
        position: absolute;
        inset: auto -20% 0;
        height: 40%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
        transform: translateY(55%);
        transition: transform 180ms ease;
    }
    .weapon-btn:active::after,
    .weapon-btn.active::after {
        transform: translateY(0);
    }
    .weapon-btn.active {
        border-color: var(--hero-cyan);
        background: linear-gradient(180deg, rgba(32, 92, 126, 0.45), rgba(16, 32, 56, 0.92));
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.3), inset 0 0 12px rgba(121, 236, 255, 0.12);
    }
    .weapon-btn:disabled { opacity: 0.3; filter: grayscale(1); }
    .status-chip,
    .feedback-label {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        letter-spacing: 0.12em;
    }
    .media-gif {
        width: clamp(72px, 18vw, 128px);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 16px;
        border: 1px solid rgba(121, 236, 255, 0.24);
        background: rgba(3, 10, 20, 0.72);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28), 0 0 20px rgba(121, 236, 255, 0.12);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
    }
    .media-gif.visible {
        opacity: 0.88;
        transform: translateY(0) scale(1);
    }
    #reaction-stack {
        position: absolute;
        left: 1rem;
        bottom: 1rem;
        z-index: 45;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
        pointer-events: none;
    }
    #impact-gif.visible { opacity: 0.78; }
    #result-gif.visible { opacity: 0.92; }
    #feedback-banner {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        z-index: 45;
        min-width: min(52vw, 180px);
        max-width: min(58vw, 220px);
        padding: 0.65rem 0.8rem;
        border-radius: 14px;
        border: 1px solid rgba(121, 236, 255, 0.18);
        background: linear-gradient(180deg, rgba(10, 22, 40, 0.92), rgba(4, 10, 20, 0.88));
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        color: var(--text-main);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
    }
    #feedback-banner.visible {
        opacity: 1;
        transform: translateY(0);
    }
    #feedback-banner strong {
        display: block;
        font-family: 'Orbitron', 'Exo 2', sans-serif;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
    }
    #feedback-banner span {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.78rem;
        color: var(--text-dim);
    }
    
    /* Day Mode Overrides */
    body.day-mode { background-color: #cbd5e1; }
    body.day-mode .glass { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    body.day-mode #game-container::before { opacity: 0.1; }
    body.day-mode .text-cyan-100 { color: #1e293b; }
    body.day-mode .text-cyan-400 { color: #0ea5e9; }
    body.day-mode .text-cyan-500\/60 { color: rgba(15, 23, 42, 0.6); }
    body.day-mode .weapon-btn.active { border-color: #0284c7; background: rgba(2, 132, 199, 0.1); box-shadow: 0 0 10px rgba(2, 132, 199, 0.2); }
    
    .ui-fader { transition: opacity 0.3s ease-in-out; }
    .ui-hidden { opacity: 0; pointer-events: none; }

    @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
    }
    .glitching { animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite; }
</style>

        <!-- Persistent Controls (Always Visible) -->

                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
        </div>

            <!-- Top Row -->
            <div class="flex justify-between items-start w-full pointer-events-none">

<script>
/**
 * §0 System Invariants & Config
 */
// [agent-note][stage4] resolved-font: primary=Orbitron, secondary=Exo 2, accent=Press Start 2P via catalogs/fonts.json
const CONFIG_DEF = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(CONFIG_DEF).map(([k, v]) => [k, v.value]));
window.gameConfigDefs = CONFIG_DEF;

// Global State
let canvas, ctx;
let cw = 0, ch = 0;
let dpr = 1;
let gameState = 'PLAYING';
let initialized = false;
let lastTime = 0;
let score = 0;
let energy = 100;
let infiniteEnergy = false;
let gameTime = 0;
let currentWeapon = 'KINETIC';
let isNight = true;
let timeScale = 1.0;
let uiVisible = true;

// Weather & Layout State
const WEATHER_TYPES = ['CLEAR', 'RAIN', 'ACID_RAIN', 'SNOW', 'STORM'];
let currentWeather = 'CLEAR';
let lightningTimer = 0;
let lightningIntensity = 0;
let weatherParticles = [];

const LAYOUT_TYPES = ['GRID', 'RIVER', 'SECTOR', 'PARK', 'SPRAWL'];
let currentLayout = 'GRID';

// Grid State
const GRID_SIZE = 22;
let roadCols = [];
let roadRows = [];
let riverCells = []; 

// Visual Effects State
let shakeTime = 0;
let shakeIntensity = 0;

// Entities
const buildings = [];
const activeEffects = []; 
const particles = [];
const texts = [];
const traffic = [];
const smoke = [];
const lightnings = [];

// Audio Context
let audioCtx;
const audioBuffers = {};
let activeLoop = null;
let impactGifTimer = null;
let resultGifTimer = null;
let feedbackBannerTimer = null;
let lastUiClickAt = 0;
let lastActionAt = 0;
let lastBlockedAt = 0;

/**
 * §1 Audio System
 */
async function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    
    const loadBuffer = async (id, url) => {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed: ${id}`, e);
        }
    };

    await Promise.all([
        loadBuffer('explode', document.getElementById('sfx_explode').src),
        loadBuffer('void', document.getElementById('sfx_void').src),
        loadBuffer('laser', document.getElementById('sfx_laser').src),
        loadBuffer('ui', document.getElementById('sfx_ui').src),
        loadBuffer('charge', document.getElementById('sfx_charge').src),
        loadBuffer('reset', document.getElementById('sfx_reset').src),
        loadBuffer('battery', document.getElementById('sfx_battery').src),
        loadBuffer('switch', document.getElementById('sfx_switch').src),
        loadBuffer('calamity', document.getElementById('sfx_calamity').src),
        loadBuffer('summon', document.getElementById('sfx_summon').src),
        loadBuffer('time_fast', document.getElementById('sfx_time_fast').src),
        loadBuffer('time_slow', document.getElementById('sfx_time_slow').src),
        loadBuffer('thunder', document.getElementById('sfx_thunder').src),
        loadBuffer('fire', document.getElementById('sfx_fire').src)
    ]);
}

function playSfx(id, pitch = 1.0, vol = 1.0, loop = false) {
    if (!audioCtx) return null;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const buffer = audioBuffers[id];
    if (buffer) {
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = pitch + (Math.random() * 0.1 - 0.05);
        source.loop = loop;
        
        const gain = audioCtx.createGain();
        gain.gain.value = vol;
        
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
        return { source, gain };
    } else {
        // Synthesis Fallback
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(200 * pitch, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
        return null;
    }
}

function stopBgm() {
    const bgmNight = document.getElementById('bgm_night');
    const bgmCalamity = document.getElementById('bgm_calamity');
    [bgmNight, bgmCalamity].forEach(track => {
        track.pause();
        track.currentTime = 0;
    });
    activeLoop = null;
}

function playBgm() {
    const bgmNight = document.getElementById('bgm_night');
    const bgmCalamity = document.getElementById('bgm_calamity');
    
    bgmNight.pause();
    bgmCalamity.pause();
    
    const target = isNight ? bgmNight : bgmCalamity;
    target.volume = 0.2;
    if (activeLoop !== target.id) {
        target.currentTime = 0;
    }
    activeLoop = target.id;
    target.play().catch(() => {});
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? [50, 20, 50] : style === 'medium' ? 30 : 10);
    }
}

function flashImpactGif() {
    const el = document.getElementById('impact-gif');
    if (!el) return;
    el.classList.add('visible');
    clearTimeout(impactGifTimer);
    impactGifTimer = setTimeout(() => el.classList.remove('visible'), 1100);
}

function showResultGif(mode = 'success') {
    const el = document.getElementById('result-gif');
    if (!el) return;
    el.src = mode === 'fail'
        ? 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
        : 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp';
    el.classList.add('visible');
    clearTimeout(resultGifTimer);
    resultGifTimer = setTimeout(() => el.classList.remove('visible'), 2200);
}

function showFeedbackBanner(title, copy, tone = 'info') {
    const banner = document.getElementById('feedback-banner');
    if (!banner) return;
    document.getElementById('feedback-title').textContent = title;
    document.getElementById('feedback-copy').textContent = copy;
    banner.style.borderColor = tone === 'alert' ? 'rgba(248, 113, 113, 0.28)' : tone === 'success' ? 'rgba(250, 204, 21, 0.28)' : 'rgba(121, 236, 255, 0.18)';
    banner.classList.add('visible');
    clearTimeout(feedbackBannerTimer);
    feedbackBannerTimer = setTimeout(() => banner.classList.remove('visible'), 1800);
}

function showComboText(text) {
    const el = document.getElementById('combo-text');
    el.textContent = text;
    el.style.opacity = 1;
    flashImpactGif();
    showFeedbackBanner('SYSTEM FEEDBACK', text, 'success');
    setTimeout(() => el.style.opacity = 0, 2000);
}

/**
 * §2 Game Logic & Entities
 */
const WEAPONS = {
    'KINETIC': { cost: 15, color: '#22d3ee' },
    'CLUSTER': { cost: 35, color: '#fb923c' },
    'LASER':   { cost: 50, color: '#ef4444' },
    'VOID':    { cost: 80, color: '#a855f7' },
    'METEOR':  { cost: 90, color: '#e11d48' },
    'MONSTER': { cost: 100, color: '#22c55e' }
};

class WeatherParticle {
    constructor(type) {
        this.reset(type);
    }
    reset(type) {
        this.type = type;
        this.active = true;
        this.x = Math.random() * cw;
        this.y = Math.random() * -ch; 
        
        if (type === 'SNOW') {
            this.vx = (Math.random() - 0.5) * 20;
            this.vy = 30 + Math.random() * 30;
            this.size = Math.random() * 2 + 1;
            this.life = 5.0;
        } else { 
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = 600 + Math.random() * 200;
            this.size = Math.random() * 15 + 10; 
            this.life = 2.0;
        }
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        
        if (this.y > ch) {
            if (Math.random() < 0.2) {
                const color = this.type === 'ACID_RAIN' ? '#4ade80' : '#a5f3fc';
                particles.push(new Particle(this.x, ch, color, 0.2, 1.5));
            }
            this.reset(this.type);
        }
    }
    draw(ctx) {
        if (this.type === 'SNOW') {
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        } else {
            ctx.strokeStyle = this.type === 'ACID_RAIN' ? 'rgba(74, 222, 128, 0.5)' : 'rgba(165, 243, 252, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.vx * 0.05, this.y + this.size);
            ctx.stroke();
        }
    }
}

class Car {
    constructor(axis, index, dir) {
        this.axis = axis; 
        this.dir = dir; 
        this.active = true;
        this.width = 1.5; 
        this.length = Math.random() * 2 + 3; 
        this.color = (axis === 'v' && dir === 1) ? '#ff2222' : '#eeeeee'; 
        this.dayColor = `hsl(${Math.random() * 360}, 60%, 50%)`;
        this.speed = (Math.random() * 30 + 40) * dir; 
        this.vx = 0;
        this.vy = 0;
        this.pulled = false;

        if (axis === 'v') {
            this.x = index * GRID_SIZE + GRID_SIZE/2 + (Math.random() * 4 - 2);
            this.y = dir === 1 ? -20 : ch + 20;
            this.vy = this.speed;
        } else {
            this.y = index * GRID_SIZE + GRID_SIZE/2 + (Math.random() * 4 - 2);
            this.x = dir === 1 ? -20 : cw + 20;
            this.vx = this.speed;
            this.color = '#ffaa00'; 
        }
    }

    update(dt) {
        if (!this.active) return;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        if (this.x > cw + 50 || this.x < -50 || this.y > ch + 50 || this.y < -50) this.active = false;
    }

    draw(ctx) {
        if (!this.active) return;
        if (isNight) {
            ctx.fillStyle = this.color;
            if (this.axis === 'v' && !this.pulled) {
                ctx.fillRect(this.x - this.width/2, this.y - this.length/2, this.width, this.length);
            } else if (this.axis === 'h' && !this.pulled) {
                ctx.fillRect(this.x - this.length/2, this.y - this.width/2, this.length, this.width);
            } else {
                ctx.fillRect(this.x - 1, this.y - 1, 2, 2);
            }
        } else {
            ctx.fillStyle = this.dayColor;
            const w = this.axis === 'v' ? 3 : this.length;
            const h = this.axis === 'v' ? this.length : 3;
            ctx.fillRect(this.x - w/2, this.y - h/2, w, h);
            ctx.fillStyle = '#111';
            ctx.fillRect(this.x - 0.5, this.y - 0.5, 1, 1);
        }
    }
}

class Building {
    constructor(x, y) {
        this.w = GRID_SIZE * 0.7 + Math.random() * (GRID_SIZE * 0.2); 
        this.d = GRID_SIZE * 0.7 + Math.random() * (GRID_SIZE * 0.2);
        this.h = 10 + Math.random() * 60; 
        this.x = x + (GRID_SIZE - this.w)/2;
        this.y = y + (GRID_SIZE - this.d)/2;
        this.greyVal = Math.floor(Math.random() * 30 + 15);
        this.dayGreyVal = Math.floor(Math.random() * 40 + 200); 
        this.health = 100;
        this.destroyed = false;
        this.hasLight = Math.random() > 0.8;
        this.fireIntensity = 0;
    }

    update(dt) {
        if (this.destroyed) return;

        // Fire Logic
        if (this.fireIntensity > 0) {
            this.health -= this.fireIntensity * 5 * dt;
            
            // Spread fire
            if (this.fireIntensity > 0.5 && Math.random() < 0.05 * dt) {
                buildings.forEach(b => {
                    if (b !== this && !b.destroyed && Math.abs(b.x - this.x) < GRID_SIZE * 1.5 && Math.abs(b.y - this.y) < GRID_SIZE * 1.5) {
                        b.fireIntensity = Math.min(1, b.fireIntensity + 0.2);
                    }
                });
            }

            // Weather suppression
            if (currentWeather === 'RAIN' || currentWeather === 'STORM' || currentWeather === 'SNOW') {
                this.fireIntensity = Math.max(0, this.fireIntensity - 0.3 * dt);
            } else {
                this.fireIntensity = Math.min(1, this.fireIntensity + 0.05 * dt);
            }

            // Smoke
            if (Math.random() < this.fireIntensity * 0.2) {
                smoke.push(new Smoke(this.x + this.w/2, this.y + this.d/2));
            }

            if (this.health <= 0) {
                this.destroyed = true;
                createExplosion(this.x + this.w/2, this.y + this.d/2, 0.5);
                score += 50;
            }
        }

        if (this.hasLight && Math.random() < 0.02) {
            smoke.push(new Smoke(this.x + this.w/2, this.y + this.d/2));
        }
    }

    draw(ctx) {
        if (this.destroyed) {
            ctx.fillStyle = isNight ? '#050505' : '#334155';
            ctx.fillRect(this.x, this.y, this.w, this.d);
            return;
        }
        
        const cx = cw / 2;
        const cy = ch / 2;
        const leanFactor = 0.6; 
        const dx = (this.x + this.w/2) - cx;
        const dy = (this.y + this.d/2) - cy;
        const roofOffX = dx * (this.h / 1000) * leanFactor;
        const roofOffY = dy * (this.h / 1000) * leanFactor;
        
        const bx = this.x;
        const by = this.y;
        const rx = this.x + roofOffX;
        const ry = this.y + roofOffY;
        
        let sideColor, darkSideColor, roofColor;
        
        if (isNight) {
            sideColor = `rgb(${this.greyVal}, ${this.greyVal}, ${this.greyVal})`;
            darkSideColor = `rgb(${this.greyVal-8}, ${this.greyVal-8}, ${this.greyVal-8})`;
            roofColor = `rgb(${this.greyVal+5}, ${this.greyVal+5}, ${this.greyVal+10})`;
        } else {
            sideColor = `rgb(${this.dayGreyVal-30}, ${this.dayGreyVal-30}, ${this.dayGreyVal-20})`;
            darkSideColor = `rgb(${this.dayGreyVal-60}, ${this.dayGreyVal-60}, ${this.dayGreyVal-50})`;
            roofColor = `rgb(${this.dayGreyVal}, ${this.dayGreyVal}, ${this.dayGreyVal})`;
        }
        
        // Draw 3D shape
        ctx.beginPath();
        if (roofOffX < 0) {
            ctx.fillStyle = sideColor;
            ctx.moveTo(bx, by); ctx.lineTo(bx, by+this.d); ctx.lineTo(rx, ry+this.d); ctx.lineTo(rx, ry); ctx.fill();
        } else {
            ctx.fillStyle = sideColor;
            ctx.moveTo(bx+this.w, by); ctx.lineTo(bx+this.w, by+this.d); ctx.lineTo(rx+this.w, ry+this.d); ctx.lineTo(rx+this.w, ry); ctx.fill();
        }
        
        ctx.beginPath();
        if (roofOffY < 0) {
            ctx.fillStyle = darkSideColor;
            ctx.moveTo(bx, by); ctx.lineTo(bx+this.w, by); ctx.lineTo(rx+this.w, ry); ctx.lineTo(rx, ry); ctx.fill();
        } else {
            ctx.fillStyle = darkSideColor;
            ctx.moveTo(bx, by+this.d); ctx.lineTo(bx+this.w, by+this.d); ctx.lineTo(rx+this.w, ry+this.d); ctx.lineTo(rx, ry+this.d); ctx.fill();
        }

        ctx.fillStyle = roofColor;
        ctx.fillRect(rx, ry, this.w, this.d);
        
        // Windows
        if (this.hasLight && isNight) {
            ctx.fillStyle = '#0ff';
            ctx.fillRect(rx + this.w/2 - 0.5, ry + this.d/2 - 0.5, 1, 1);
        } else if (this.hasLight && !isNight) {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(rx + this.w/2 - 0.5, ry + this.d/2 - 0.5, 1, 1);
        }

        // Fire Overlay
        if (this.fireIntensity > 0) {
            ctx.fillStyle = `rgba(255, ${Math.floor(Math.random()*100)}, 0, ${this.fireIntensity * 0.7})`;
            ctx.fillRect(rx, ry, this.w, this.d);
        }
    }
}

class KineticRod {
    constructor(tx, ty) {
        this.type = 'ROD';
        this.x = tx;
        this.y = -200;
        this.tx = tx;
        this.ty = ty;
        this.vy = 3000; 
        this.active = true;
    }
    update(dt) {
        this.y += this.vy * dt;
        if (this.y >= this.ty) {
            this.explode();
        }
    }
    explode() {
        this.active = false;
        createExplosion(this.x, this.y);
        playSfx('explode', 1.0, 0.5);
        vibrate('heavy');
        shakeScreen(0.3, 8);
        dealDamage(this.x, this.y, 35, 100);
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = isNight ? '#fff' : '#000';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffff';
        ctx.fillRect(-1, -60, 2, 120);
        ctx.restore();
    }
}

class ClusterBomb {
    constructor(tx, ty) {
        this.type = 'CLUSTER';
        this.x = tx;
        this.y = -200;
        this.tx = tx;
        this.ty = ty;
        this.vy = 1500;
        this.vx = 0;
        this.active = true;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        
        // Void Interaction
        if (this.y >= this.ty) {
            this.active = false;
            playSfx('explode', 1.2, 0.4);
            shakeScreen(0.2, 5);
            for(let i=0; i<6; i++) {
                const angle = (Math.PI * 2 / 6) * i;
                const dist = 30 + Math.random() * 20;
                const ex = this.x + Math.cos(angle) * dist;
                const ey = this.y + Math.sin(angle) * dist;
                setTimeout(() => {
                    createExplosion(ex, ey, 0.5);
                    dealDamage(ex, ey, 20, 50);
                    // Fire Chance
                    if (currentWeather !== 'RAIN' && currentWeather !== 'STORM') {
                        buildings.forEach(b => {
                            if (!b.destroyed && Math.hypot(b.x+b.w/2 - ex, b.y+b.d/2 - ey) < 30) {
                                b.fireIntensity = 0.8;
                            }
                        });
                    }
                    vibrate('light');
                }, i * 50);
            }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#fb923c';
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#fb923c';
        ctx.fillRect(-3, -20, 6, 40);
        ctx.restore();
    }
}

class LaserBeam {
    constructor(tx, ty) {
        this.type = 'LASER';
        this.x = tx;
        this.y = ty;
        this.life = 1.5;
        this.maxLife = 1.5;
        this.active = true;
        this.width = 0;
        
        const sfx = playSfx('laser', 1.0, 0.3);
        if (sfx) {
            this.gainNode = sfx.gain;
            this.sourceNode = sfx.source;
        }
    }
    update(dt) {
        this.life -= dt;
        if (this.life < 0) {
            this.active = false;
            if (this.sourceNode) {
                try { this.sourceNode.stop(); } catch(e){}
            }
            return;
        }
        
        this.width = Math.sin(this.life * 10) * 10 + 20;
        
        // Standard Damage
        if (Math.random() < 0.3) {
            createDebris(this.x + (Math.random()-0.5)*20, this.y + (Math.random()-0.5)*20, '#f87171', 2);
            dealDamage(this.x, this.y, 15, 10);
        }

        // Interaction: Water -> Steam
        if (currentLayout === 'RIVER') {
            const gy = Math.floor(this.y / GRID_SIZE);
            const gx = Math.floor(this.x / GRID_SIZE);
            if (riverCells.some(c => c.r === gy && Math.abs(c.c - gx) < 2)) {
                if (Math.random() < 0.5) {
                    smoke.push(new Smoke(this.x + (Math.random()-0.5)*40, this.y + (Math.random()-0.5)*40));
                    if (Math.random() < 0.1) showComboText("STEAM COVER");
                }
            }
        }

        // Interaction: Storm/Rain -> Chain Lightning
        if ((currentWeather === 'STORM' || currentWeather === 'RAIN') && Math.random() < 0.1) {
            buildings.forEach(b => {
                const dist = Math.hypot(b.x+b.w/2 - this.x, b.y+b.d/2 - this.y);
                if (!b.destroyed && dist < 120 && dist > 20) {
                    lightnings.push({x1: this.x, y1: this.y, x2: b.x+b.w/2, y2: b.y+b.d/2, life: 0.1});
                    b.health -= 50;
                    createDebris(b.x+b.w/2, b.y+b.d/2, '#0ff', 3);
                }
            });
            showComboText("GRID SURGE");
            playSfx('thunder', 2.0, 0.3);
        }
        
        if (this.gainNode) {
            this.gainNode.gain.value = Math.max(0, (this.life / this.maxLife) * 0.3);
        }
        shakeScreen(0.1, 1);
    }
    draw(ctx) {
        const alpha = Math.min(1, this.life * 2);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.x - 2, 0, 4, this.y);
        ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
        ctx.fillRect(this.x - this.width/2, 0, this.width, this.y);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.width, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255, 200, 200, 0.8)';
        ctx.fill();
        ctx.restore();
    }
}

class VoidHole {
    constructor(tx, ty) {
        this.type = 'VOID';
        this.x = tx;
        this.y = ty;
        this.life = 3.0;
        this.active = true;
        this.radius = 0;
        this.fed = 0;
        playSfx('void', 0.8, 0.6);
        vibrate('medium');
    }
    update(dt) {
        this.life -= dt;
        if (this.life <= 0) {
            this.active = false;
            const boomScale = 2.0 + (this.fed * 0.5);
            createExplosion(this.x, this.y, boomScale);
            dealDamage(this.x, this.y, 80 + this.fed*20, 200 + this.fed*100);
            shakeScreen(0.5, 15);
            vibrate('heavy');
            return;
        }
        
        if (this.life > 0.5) {
            this.radius = Math.min(60 + this.fed*10, this.radius + 100 * dt);
        } else {
            this.radius = Math.max(0, this.radius - 200 * dt);
        }

        const pullRadius = 150 + this.fed * 20;
        
        // Pull Traffic
        traffic.forEach(t => {
            if (!t.active) return;
            const dx = this.x - t.x;
            const dy = this.y - t.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist < pullRadius) {
                t.pulled = true;
                const force = (pullRadius - dist) * 10 * dt;
                t.vx += (dx / dist) * force;
                t.vy += (dy / dist) * force;
                t.vx *= 0.9;
                t.vy *= 0.9;
                
                if (dist < 10) {
                    t.active = false;
                    score += 50;
                }
            }
        });

        // Pull Projectiles (Interaction)
        activeEffects.forEach(e => {
            if (e === this) return;
            if (e.type === 'CLUSTER' || e.type === 'METEOR') {
                const dx = this.x - e.x;
                const dy = this.y - e.y;
                const dist = Math.hypot(dx, dy);
                if (dist < pullRadius * 2) {
                    e.x += (dx / dist) * 300 * dt;
                    e.y += (dy / dist) * 300 * dt;
                    if (dist < 20) {
                        e.active = false; // Consumed
                        this.fed++;
                        this.life += 0.5; // Extend life
                        showComboText("VACUUM BOOST");
                        playSfx('charge', 2.0, 0.5);
                    }
                }
            }
        });
        
        if (Math.random() < 0.5) {
            const angle = Math.random() * Math.PI * 2;
            const r = 80;
            particles.push(new Particle(
                this.x + Math.cos(angle)*r, 
                this.y + Math.sin(angle)*r, 
                '#a855f7', 0.5, 2
            ));
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI*2);
        ctx.fillStyle = '#000';
        ctx.fill();
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.rotate(gameTime * (5 + this.fed));
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 1.2, 0, Math.PI*1.5);
        ctx.strokeStyle = `rgba(168, 85, 247, 0.5)`;
        ctx.lineWidth = 4 + this.fed;
        ctx.stroke();
        ctx.restore();
    }
}

class Kaiju {
    constructor(tx, ty) {
        this.type = 'MONSTER';
        this.x = tx;
        this.y = ty;
        this.life = 12.0;
        this.active = true;
        this.size = 0;
        this.targetSize = 40;
        this.angle = Math.random() * Math.PI * 2;
        this.stepTimer = 0;
        this.vx = (Math.random() - 0.5) * 40;
        this.vy = (Math.random() - 0.5) * 40;
        this.enraged = false;
        playSfx('summon', 0.8, 0.7);
        shakeScreen(0.5, 10);
    }
    update(dt) {
        this.life -= dt;
        if (this.life <= 0) {
            this.active = false;
            createExplosion(this.x, this.y, 3.0);
            return;
        }

        if (this.size < this.targetSize) this.size += 20 * dt;

        // Move
        const speedMult = this.enraged ? 3.0 : 1.0;
        this.x += this.vx * dt * speedMult;
        this.y += this.vy * dt * speedMult;

        if (this.x < 0 || this.x > cw) this.vx *= -1;
        if (this.y < 0 || this.y > ch) this.vy *= -1;

        // Interaction: Laser enrages
        activeEffects.forEach(e => {
            if (e.type === 'LASER' && Math.hypot(e.x - this.x, e.y - this.y) < 50) {
                if (!this.enraged) {
                    this.enraged = true;
                    showComboText("BOT OVERDRIVE");
                    playSfx('summon', 1.5, 0.8);
                }
            }
        });

        // Stomp logic
        this.stepTimer += dt * speedMult;
        if (this.stepTimer > 0.8) {
            this.stepTimer = 0;
            shakeScreen(0.2, 5);
            vibrate('heavy');
            dealDamage(this.x, this.y, 60, 500); 
            createDebris(this.x, this.y, '#22c55e', 5);
            playSfx('explode', 0.5, 0.4);
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.enraged ? '#b91c1c' : '#14532d';
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
        for(let i=0; i<8; i++) {
            const a = (gameTime * 2) + (i * Math.PI / 4);
            const r = this.size + Math.sin(gameTime * 10 + i) * 5;
            ctx.fillStyle = this.enraged ? '#f87171' : '#22c55e';
            ctx.fillRect(Math.cos(a)*r - 2, Math.sin(a)*r - 2, 4, 4);
        }
        ctx.fillStyle = '#4ade80';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#4ade80';
        const eyeOff = Math.sin(gameTime * 5) * 5;
        ctx.fillRect(-10, -5 + eyeOff, 6, 6);
        ctx.fillRect(4, -5 - eyeOff, 6, 6);
        ctx.restore();
    }
}

class Meteor {
    constructor(tx, ty, delay) {
        this.type = 'METEOR';
        this.tx = tx + (Math.random() - 0.5) * 100;
        this.ty = ty + (Math.random() - 0.5) * 100;
        this.x = this.tx - 200;
        this.y = this.ty - 400;
        this.delay = delay;
        this.speed = 800;
        this.active = true;
        this.arrived = false;
    }
    update(dt) {
        if (this.delay > 0) {
            this.delay -= dt;
            return;
        }
        if (this.arrived) return;

        const dx = this.tx - this.x;
        const dy = this.ty - this.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist < 20) {
            this.explode();
            this.arrived = true;
            this.active = false;
        } else {
            const move = this.speed * dt;
            this.x += (dx / dist) * move;
            this.y += (dy / dist) * move;
            
            if (Math.random() < 0.5) {
                particles.push(new Particle(this.x, this.y, '#fb7185', 0.5, 4));
            }
        }
    }
    explode() {
        createExplosion(this.x, this.y, 2.5);
        playSfx('calamity', 1.0, 0.6);
        vibrate('heavy');
        shakeScreen(0.4, 12);
        dealDamage(this.x, this.y, 80, 400);
    }
    draw(ctx) {
        if (this.delay > 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.atan2(this.ty - this.y, this.tx - this.x));
        ctx.fillStyle = '#e11d48';
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(225, 29, 72, 0.5)';
        ctx.fillRect(-40, -4, 40, 8);
        ctx.restore();
    }
}

class MeteorShower {
    constructor(tx, ty) {
        this.active = true;
        this.life = 3.0; 
        const count = 6 + Math.floor(Math.random() * 3);
        for(let i=0; i<count; i++) {
            activeEffects.push(new Meteor(tx, ty, i * 0.2));
        }
    }
    update(dt) {
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }
    draw(ctx) {}
}

class Smoke {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = -Math.random() * 10 - 2;
        this.life = 1.5 + Math.random();
        this.maxLife = this.life;
        this.size = Math.random() * 2 + 0.5;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        this.size += 1 * dt;
    }
    draw(ctx) {
        ctx.fillStyle = isNight ? '#555' : '#333';
        ctx.globalAlpha = (this.life / this.maxLife) * 0.2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class Particle {
    constructor(x, y, color, life, size=1) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 150;
        this.vy = (Math.random() - 0.5) * 150;
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.size = size;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1.0;
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 0.8;
        this.vy = -30;
    }
    update(dt) {
        this.y += this.vy * dt;
        this.life -= dt;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = "700 16px Orbitron";
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

function dealDamage(x, y, radius, damageVal) {
    let hitCount = 0;
    buildings.forEach(b => {
        if (b.destroyed) return;
        const cx = b.x + b.w/2;
        const cy = b.y + b.d/2;
        const dist = Math.hypot(cx - x, cy - y);
        
        if (dist < radius) {
            b.health -= damageVal;
            if (b.health <= 0) {
                b.destroyed = true;
                createDebris(b.x + b.w/2, b.y + b.d/2, '#444', 8);
                hitCount++;
                score += 100 + (hitCount * 10);
            }
        }
    });

    traffic.forEach(t => {
        if (!t.active) return;
        const dist = Math.hypot(t.x - x, t.y - y);
        if (dist < radius) {
            t.active = false;
            createDebris(t.x, t.y, t.color, 4);
            score += 50;
        }
    });

    if (hitCount > 0) {
        texts.push(new FloatingText(x, y - 20, `+${hitCount}`, isNight ? '#fff' : '#000'));
    }
}

function createExplosion(x, y, scale=1.0) {
    particles.push(new Particle(x, y, '#ffffff', 0.1, 20 * scale));
    for(let i=0; i<15; i++) {
        particles.push(new Particle(x, y, i%2==0? '#fb923c' : '#ffffff', 0.3 + Math.random()*0.2, 1.5 * scale));
    }
}

function createDebris(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const p = new Particle(x, y, color, 0.8, 1.5);
        particles.push(p);
    }
}

function shakeScreen(duration, intensity) {
    shakeTime = duration;
    shakeIntensity = intensity;
}

function spawnCar() {
    if (traffic.length >= window.gameConfig.trafficDensity) return;
    const isVertical = Math.random() > 0.5;
    let pool = isVertical ? roadCols : roadRows;
    if (pool.length === 0) return;

    const index = pool[Math.floor(Math.random() * pool.length)];
    const dir = Math.random() > 0.5 ? 1 : -1;
    const axis = isVertical ? 'v' : 'h';
    
    let clear = true;
    for(let t of traffic) {
        if (t.axis !== axis) continue;
        const tCoord = axis === 'v' ? t.y : t.x;
        const spawnCoord = dir === 1 ? -20 : (axis === 'v' ? ch+20 : cw+20);
        if (Math.abs(tCoord - spawnCoord) < 20 && 
            Math.abs((axis==='v'?t.x:t.y) - (index * GRID_SIZE + GRID_SIZE/2)) < 5) {
            clear = false;
            break;
        }
    }

    if (clear) {
        traffic.push(new Car(axis, index, dir));
    }
}

/**
 * §3 Lifecycle & Loop
 */
function initGame() {
    if (initialized) return;
    score = 0;
    energy = 100;
    gameState = 'PLAYING';
    regenerateCity(false); 
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
    initialized = true;
    playBgm();
    showFeedbackBanner('ORBITAL LINKED', 'Tap the city to deploy cleanup tools.', 'info');
}

function regenerateCity(sfx = true) {
    if (sfx) {
        playSfx('reset', 1.0, 0.8);
        vibrate('heavy');
        document.body.classList.add('glitching');
        setTimeout(() => document.body.classList.remove('glitching'), 300);
        score = 0; 
    }

    buildings.length = 0;
    activeEffects.length = 0;
    particles.length = 0;
    traffic.length = 0;
    texts.length = 0;
    smoke.length = 0;
    weatherParticles.length = 0;
    lightnings.length = 0;
    roadCols = [];
    roadRows = [];
    riverCells = [];
    
    currentLayout = LAYOUT_TYPES[Math.floor(Math.random() * LAYOUT_TYPES.length)];
    currentWeather = WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)];
    
    document.getElementById('district-name').textContent = `ZONE: ${currentLayout}`;
    document.getElementById('weather-name').textContent = `SKY: ${currentWeather.replace('_', ' ')}`;
    
    const cols = Math.ceil(cw / GRID_SIZE);
    const rows = Math.ceil(ch / GRID_SIZE);
    
    if (currentLayout === 'GRID') {
        const offC = Math.floor(Math.random() * 4);
        const offR = Math.floor(Math.random() * 4);
        for(let c=0; c<cols; c++) if ((c + offC) % 5 === 2) roadCols.push(c);
        for(let r=0; r<rows; r++) if ((r + offR) % 6 === 3) roadRows.push(r);
    } 
    else if (currentLayout === 'SPRAWL') {
        for(let c=0; c<cols; c++) if (Math.random() > 0.7) roadCols.push(c);
        for(let r=0; r<rows; r++) if (Math.random() > 0.7) roadRows.push(r);
    }
    else if (currentLayout === 'SECTOR') {
        for(let c=0; c<cols; c+=8) roadCols.push(c);
        for(let r=0; r<rows; r+=8) roadRows.push(r);
    }
    else if (currentLayout === 'PARK') {
        for(let c=0; c<cols; c++) if (c % 4 === 0) roadCols.push(c);
        for(let r=0; r<rows; r++) if (r % 4 === 0) roadRows.push(r);
    }
    else if (currentLayout === 'RIVER') {
        for(let c=0; c<cols; c++) if (c % 5 === 2) roadCols.push(c);
        for(let r=0; r<rows; r++) if (r % 5 === 2) roadRows.push(r);
        let rx = Math.floor(Math.random() * cols);
        for(let r=0; r<rows; r++) {
            riverCells.push({c: rx, r: r});
            riverCells.push({c: rx+1, r: r}); 
            rx += Math.floor(Math.random() * 3) - 1; 
            if (rx < 0) rx = 0;
            if (rx >= cols-1) rx = cols-2;
        }
    }

    if (roadCols.length === 0) roadCols.push(Math.floor(cols/2));
    if (roadRows.length === 0) roadRows.push(Math.floor(rows/2));

    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            const isRoadCol = roadCols.includes(c);
            const isRoadRow = roadRows.includes(r);
            let isRiver = false;
            if (currentLayout === 'RIVER') {
                if (riverCells.some(cell => cell.c === c && cell.r === r)) isRiver = true;
            }
            let isPark = false;
            if (currentLayout === 'PARK') {
                const cx = cols/2, cy = rows/2;
                if (Math.abs(c - cx) < 6 && Math.abs(r - cy) < 6) isPark = true;
            }

            if (!isRoadCol && !isRoadRow && !isRiver && !isPark) {
                if (Math.random() > 0.05) { 
                    buildings.push(new Building(c * GRID_SIZE, r * GRID_SIZE));
                }
            }
        }
    }

    if (currentWeather !== 'CLEAR') {
        for(let i=0; i<100; i++) {
            const p = new WeatherParticle(currentWeather === 'STORM' ? 'RAIN' : currentWeather);
            p.y = Math.random() * ch; 
            weatherParticles.push(p);
        }
    }

    for(let i=0; i<80; i++) {
        spawnCar();
        if (traffic.length > 0) {
            const t = traffic[traffic.length-1];
            if (t.axis === 'v') t.y = Math.random() * ch;
            else t.x = Math.random() * cw;
        }
    }
}

function restartGame() {
    regenerateCity(false);
    score = 0;
    energy = 100;
    setState('PLAYING');
}

function setState(newState) {
    gameState = newState;
    const uiMain = document.getElementById('ui-main');
    const gameOver = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        uiMain.classList.remove('opacity-0');
        gameOver.classList.add('hidden');
        playBgm();
        showFeedbackBanner('CITY ONLINE', 'Cleanup grid restored. Re-engage command.', 'info');
    } else {
        uiMain.classList.add('opacity-0');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').textContent = score;
        stopBgm();
        playSfx('reset', 0.75, 0.32);
        showResultGif(score >= 1500 ? 'success' : 'fail');
        showFeedbackBanner(score >= 1500 ? 'CLEANUP LOCKED' : 'GRID COLLAPSED', score >= 1500 ? 'High-value sweep complete.' : 'Rebuild and try a tighter strike pattern.', score >= 1500 ? 'success' : 'alert');
    }
}

window.selectWeapon = function(type) {
    currentWeapon = type;
    const now = performance.now();
    if (now - lastUiClickAt > 70) {
        playSfx('ui', 1.0, 0.42);
        lastUiClickAt = now;
    }
    showFeedbackBanner('WEAPON SET', `${type} primed for the next strike.`, 'info');
    document.querySelectorAll('.weapon-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.weapon === type);
    });
};

window.toggleBattery = function() {
    infiniteEnergy = !infiniteEnergy;
    playSfx('battery', 1.0, 0.5);
    vibrate('light');
    
    const btn = document.getElementById('btn-battery');
    const bar = document.getElementById('energy-bar');
    
    if (infiniteEnergy) {
        btn.textContent = "LIMITS: OFF";
        btn.classList.add('text-red-400', 'border-red-500/30');
        btn.classList.remove('text-amber-400', 'border-amber-500/30');
        bar.classList.add('bg-red-500', 'shadow-[0_0_8px_#ef4444]');
        bar.classList.remove('bg-amber-400', 'shadow-[0_0_8px_#fbbf24]');
        showFeedbackBanner('LIMITERS DISABLED', 'Sandbox energy mode enabled.', 'alert');
    } else {
        btn.textContent = "LIMITS: ON";
        btn.classList.remove('text-red-400', 'border-red-500/30');
        btn.classList.add('text-amber-400', 'border-amber-500/30');
        bar.classList.remove('bg-red-500', 'shadow-[0_0_8px_#ef4444]');
        bar.classList.add('bg-amber-400', 'shadow-[0_0_8px_#fbbf24]');
        showFeedbackBanner('LIMITERS RESTORED', 'Standard energy rules back online.', 'info');
    }
};

window.triggerCityReset = function() {
    regenerateCity(true);
    showFeedbackBanner('CITY REBUILT', 'District topology rotated for a fresh sweep.', 'info');
};

window.toggleDayNight = function() {
    isNight = !isNight;
    playSfx('switch', 1.0, 0.45);
    playBgm(); 
    
    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    const btnMode = document.getElementById('btn-mode');
    const vignette = document.getElementById('vignette');
    
    document.body.classList.add('glitching');
    setTimeout(() => document.body.classList.remove('glitching'), 200);

    if (isNight) {
        document.body.classList.remove('day-mode');
        iconMoon.classList.remove('hidden');
        iconSun.classList.add('hidden');
        btnMode.classList.remove('text-amber-500', 'border-amber-500/30');
        btnMode.classList.add('text-cyan-400', 'border-cyan-500/30');
        vignette.classList.remove('opacity-30');
        showFeedbackBanner('NIGHT OPS', 'Ambient patrol loop restored.', 'info');
    } else {
        document.body.classList.add('day-mode');
        iconMoon.classList.add('hidden');
        iconSun.classList.remove('hidden');
        btnMode.classList.add('text-amber-500', 'border-amber-500/30');
        btnMode.classList.remove('text-cyan-400', 'border-cyan-500/30');
        vignette.classList.add('opacity-30');
        showFeedbackBanner('DAY SWEEP', 'Action loop switched for brighter recon.', 'success');
    }
};

window.cycleTime = function() {
    const label = document.getElementById('time-label');
    const btn = document.getElementById('btn-time');
    
    if (timeScale === 1.0) {
        timeScale = 2.0;
        label.textContent = "2x";
        label.classList.add('text-yellow-400');
        playSfx('time_fast');
    } else if (timeScale === 2.0) {
        timeScale = 0.5;
        label.textContent = "0.5x";
        label.classList.remove('text-yellow-400');
        label.classList.add('text-blue-400');
        playSfx('time_slow');
    } else {
        timeScale = 1.0;
        label.textContent = "1x";
        label.classList.remove('text-yellow-400', 'text-blue-400');
        playSfx('ui');
    }
     vibrate('light');
     showFeedbackBanner('TIME DILATION', `Simulation speed set to ${label.textContent}.`, 'info');
};

window.toggleUI = function() {
    uiVisible = !uiVisible;
    const uiMain = document.getElementById('ui-main');
    const btn = document.getElementById('btn-visibility');
    
    playSfx('ui');
    
    if (uiVisible) {
        uiMain.classList.remove('ui-hidden');
        btn.classList.remove('opacity-50');
        showFeedbackBanner('HUD ONLINE', 'Command overlays visible again.', 'info');
    } else {
        uiMain.classList.add('ui-hidden');
        btn.classList.add('opacity-50');
    }
};

function gameLoop(now) {
    try {
        const rawDt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        
        let scaledDt = rawDt * timeScale;
        const MAX_STEP = 0.05;
        
        if (gameState === 'PLAYING') {
            while (scaledDt > 0) {
                const step = Math.min(scaledDt, MAX_STEP);
                updateGame(step);
                scaledDt -= step;
            }
            drawGame();
        }
    } catch (e) {
        console.error(e);
    }
    requestAnimationFrame(gameLoop);
}

function updateGame(dt) {
    gameTime += dt;
    
    if (infiniteEnergy) {
        energy = 100;
        document.getElementById('energy-val').textContent = "INF";
    } else {
        energy = Math.min(100, energy + window.gameConfig.regenSpeed * dt);
        document.getElementById('energy-val').textContent = `${Math.floor(energy)}%`;
    }
    document.getElementById('energy-bar').style.width = `${energy}%`;
    document.getElementById('score-val').textContent = score;

    document.querySelectorAll('.weapon-btn').forEach(btn => {
        const type = btn.dataset.weapon;
        const cost = WEAPONS[type]?.cost || 0;
        btn.disabled = !infiniteEnergy && energy < cost;
    });

    if (Math.random() < 0.4) spawnCar();

    for(let i=traffic.length-1; i>=0; i--) {
        traffic[i].update(dt);
        if (!traffic[i].active) traffic.splice(i, 1);
    }

    smoke.forEach(s => s.update(dt));
    buildings.forEach(b => b.update(dt));
    
    for(let i=smoke.length-1; i>=0; i--) {
        if (smoke[i].life <= 0) smoke.splice(i, 1);
    }

    activeEffects.forEach(e => e.update(dt));
    for(let i=activeEffects.length-1; i>=0; i--) {
        if (!activeEffects[i].active) activeEffects.splice(i, 1);
    }

    particles.forEach(p => p.update(dt));
    for(let i=particles.length-1; i>=0; i--) {
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    
    texts.forEach(t => t.update(dt));
    for(let i=texts.length-1; i>=0; i--) {
        if (texts[i].life <= 0) texts.splice(i, 1);
    }

    // Lightning
    for(let i=lightnings.length-1; i>=0; i--) {
        lightnings[i].life -= dt;
        if (lightnings[i].life <= 0) lightnings.splice(i, 1);
    }

    weatherParticles.forEach(p => p.update(dt));
    
    if (currentWeather === 'STORM' || currentWeather === 'RAIN') {
        if (lightningIntensity > 0) lightningIntensity -= dt * 3;
        if (currentWeather === 'STORM') {
            lightningTimer -= dt;
            if (lightningTimer <= 0) {
                lightningTimer = Math.random() * 5 + 2;
                lightningIntensity = 1.0;
                playSfx('thunder', 0.8 + Math.random()*0.4, 0.7);
                shakeScreen(0.2, 5);
            }
        }
    } else {
        lightningIntensity = 0;
    }

    if (shakeTime > 0) {
        shakeTime -= dt;
        if (shakeTime <= 0) shakeIntensity = 0;
    }
}

function drawGame() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
        sx = (Math.random() - 0.5) * shakeIntensity;
        sy = (Math.random() - 0.5) * shakeIntensity;
    }
    
    ctx.fillStyle = isNight ? '#020202' : '#cbd5e1';
    ctx.fillRect(0, 0, cw, ch);
    ctx.translate(sx, sy);

    if (currentLayout === 'RIVER') {
        ctx.fillStyle = isNight ? '#082f49' : '#bae6fd';
        riverCells.forEach(cell => {
            ctx.fillRect(cell.c * GRID_SIZE, cell.r * GRID_SIZE, GRID_SIZE, GRID_SIZE);
        });
    }

    ctx.fillStyle = isNight ? '#080808' : '#94a3b8';
    roadCols.forEach(c => ctx.fillRect(c * GRID_SIZE, 0, GRID_SIZE, ch));
    roadRows.forEach(r => ctx.fillRect(0, r * GRID_SIZE, cw, GRID_SIZE));

    ctx.strokeStyle = isNight ? '#222' : '#64748b';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    roadCols.forEach(c => {
        const x = c * GRID_SIZE + GRID_SIZE/2;
        ctx.moveTo(x, 0); ctx.lineTo(x, ch);
    });
    roadRows.forEach(r => {
        const y = r * GRID_SIZE + GRID_SIZE/2;
        ctx.moveTo(0, y); ctx.lineTo(cw, y);
    });
    ctx.stroke();

    traffic.forEach(t => t.draw(ctx));
    buildings.forEach(b => b.draw(ctx));
    smoke.forEach(s => s.draw(ctx));
    
    activeEffects.forEach(e => e.draw(ctx));
    
    // Draw Chain Lightning
    if (lightnings.length > 0) {
        ctx.save();
        ctx.strokeStyle = '#0ff';
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 10;
        ctx.lineWidth = 2;
        ctx.beginPath();
        lightnings.forEach(l => {
            ctx.moveTo(l.x1, l.y1);
            ctx.lineTo(l.x2, l.y2);
        });
        ctx.stroke();
        ctx.restore();
    }
    
    if (isNight) {
        ctx.globalCompositeOperation = 'lighter';
    }
    particles.forEach(p => p.draw(ctx));
    texts.forEach(t => t.draw(ctx));
    ctx.globalCompositeOperation = 'source-over';

    weatherParticles.forEach(p => p.draw(ctx));

    if (lightningIntensity > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${lightningIntensity * 0.3})`;
        ctx.fillRect(-sx, -sy, cw, ch); 
    }
}

/**
 * §4 Input System
 */
function handleGlobalInput(e) {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
        playBgm();
    }
    
    if (gameState === 'GAMEOVER') {
        if (e.target.id === 'restart-btn') {
            playSfx('ui');
            restartGame();
        }
        return;
    }
    
    if (e.target.closest('button')) return;

    if (gameState === 'PLAYING' && (e.type === 'pointerdown' || e.type === 'click')) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const weapon = WEAPONS[currentWeapon];
        
        if (infiniteEnergy || energy >= weapon.cost) { 
            if (!infiniteEnergy) energy -= weapon.cost;
            
            const now = performance.now();
            if (currentWeapon === 'KINETIC') {
                activeEffects.push(new KineticRod(x, y));
                if (now - lastActionAt > 90) {
                    playSfx('charge', 1.0, 0.3);
                }
            } else if (currentWeapon === 'CLUSTER') {
                activeEffects.push(new ClusterBomb(x, y));
                if (now - lastActionAt > 90) {
                    playSfx('charge', 1.5, 0.3);
                }
            } else if (currentWeapon === 'LASER') {
                activeEffects.push(new LaserBeam(x, y));
            } else if (currentWeapon === 'VOID') {
                activeEffects.push(new VoidHole(x, y));
            } else if (currentWeapon === 'METEOR') {
                activeEffects.push(new MeteorShower(x, y));
            } else if (currentWeapon === 'MONSTER') {
                activeEffects.push(new Kaiju(x, y));
            }
            lastActionAt = now;
            flashImpactGif();

            const bar = document.getElementById('energy-bar');
            if (!infiniteEnergy) {
                bar.style.backgroundColor = '#fff';
                setTimeout(() => bar.style.backgroundColor = '#fbbf24', 50);
            }
        } else {
            const now = performance.now();
            if (now - lastBlockedAt > 180) {
                playSfx('thunder', 0.65, 0.2);
                lastBlockedAt = now;
            }
            showFeedbackBanner('CHARGE LOW', 'Need more energy before the next strike.', 'alert');
            texts.push(new FloatingText(x, y, "CHARGE LOW", "#ff3333"));
        }
    }
}

window.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        cw = entry.contentRect.width;
        ch = entry.contentRect.height;
        dpr = window.devicePixelRatio || 1;
        
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        canvas.style.width = `${cw}px`;
        canvas.style.height = `${ch}px`;
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initAudio();
            initGame();
        }
    });
    ro.observe(canvas);

    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);
    
    document.getElementById('btn-reset').addEventListener('click', window.triggerCityReset);
    document.getElementById('btn-battery').addEventListener('click', window.toggleBattery);
    document.getElementById('btn-mode').addEventListener('click', window.toggleDayNight);
});

window.updateGameConfig = (key, val) => {
    if (window.gameConfig[key] !== undefined) {
        window.gameConfig[key] = val;
    }
};
</script>
