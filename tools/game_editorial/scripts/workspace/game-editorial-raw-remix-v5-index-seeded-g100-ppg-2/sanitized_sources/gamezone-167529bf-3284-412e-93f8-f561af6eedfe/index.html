<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Frontier Dispatch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --font-ui: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            --font-title: 'Audiowide', 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            --font-accent: 'Orbitron', ui-monospace, monospace;
            --c-bg: #07111b;
            --c-ui: #14283a;
            --c-accent: #61e8ff;
            --c-accent-2: #ffbf47;
            --c-danger: #ff5c8a;
            --c-panel: rgba(8, 18, 31, 0.82);
            --c-panel-strong: rgba(17, 33, 51, 0.95);
            --c-grid: rgba(122, 220, 255, 0.08);
            --c-glow: rgba(97, 232, 255, 0.28);
            --c-text: #eff8ff;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            overflow: hidden; 
            background:
                radial-gradient(circle at top, rgba(97, 232, 255, 0.12), transparent 28%),
                radial-gradient(circle at bottom, rgba(255, 191, 71, 0.12), transparent 30%),
                linear-gradient(180deg, #08111b 0%, #04090f 100%);
            background-color: var(--c-bg); 
            color: var(--c-text);
            font-family: var(--font-ui);
            touch-action: manipulation; /* Keep native tap/click behavior for menu CTA on mobile */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent 0 7%, rgba(97, 232, 255, 0.04) 7% 8%, transparent 8% 100%),
                linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
            background-size: 96px 96px, 100% 100%;
            opacity: 0.45;
            mix-blend-mode: screen;
        }
        
        canvas { 
            display: block; 
            image-rendering: pixelated;
            touch-action: none;
        }

        .pixel-text { 
            font-family: var(--font-accent);
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .pixel-border {
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.08),
                inset 2px 2px 0px rgba(255,255,255,0.08),
                inset -2px -2px 0px rgba(0,0,0,0.45),
                0 0 0 1px rgba(0,0,0,0.65),
                0 0 18px rgba(0,0,0,0.18);
            border: 2px solid rgba(186, 233, 255, 0.75);
        }

        .title-font { font-family: var(--font-title); }

        /* Minimal utility layer replacing removed Tailwind CDN */
        .absolute { position: absolute; }
        .relative { position: relative; }
        .hidden { display: none !important; }
        .block { display: block; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .w-32 { width: 8rem; }
        .w-40 { width: 10rem; }
        .w-48 { width: 12rem; }
        .max-w-xs { max-width: 20rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-4 { padding: 1rem; }
        .px-1 { padding-left: 0.25rem; padding-right: 0.25rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-8 { padding-bottom: 2rem; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .bottom-0 { bottom: 0; }
        .bottom-4 { bottom: 1rem; }
        .bottom-6 { bottom: 1.5rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .right-6 { right: 1.5rem; }
        .inset-0 { inset: 0; }
        .rounded { border-radius: 0.25rem; }
        .rounded-none { border-radius: 0; }
        .pointer-events-auto { pointer-events: auto; }
        .bg-black { background: #000; }
        .bg-black-50 { background: rgba(0,0,0,0.5); }
        .bg-gray-800 { background: #1f2937; }
        .bg-gray-900 { background: #111827; }
        .bg-gray-900-95 { background: rgba(17,24,39,0.95); }
        .bg-red-600 { background: #dc2626; }
        .bg-blue-500 { background: #3b82f6; }
        .border { border: 1px solid currentColor; }
        .border-2 { border: 2px solid currentColor; }
        .border-white { border-color: #fff; }
        .border-gray-500 { border-color: #6b7280; }
        .border-gray-600 { border-color: #4b5563; }
        .text-white { color: #fff; }
        .text-yellow-400 { color: #facc15; }
        .text-yellow-500 { color: #eab308; }
        .text-red-500 { color: #ef4444; }
        .text-red-600 { color: #dc2626; }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .text-gray-500 { color: #6b7280; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .text-8px { font-size: 8px; }
        .text-10px { font-size: 10px; }
        .leading-relaxed { line-height: 1.625; }
        .transition-all { transition: all 0.2s; }
        .transition-opacity { transition: opacity 0.5s; }
        .duration-100 { transition-duration: 0.1s; }
        .duration-200 { transition-duration: 0.2s; }
        .duration-500 { transition-duration: 0.5s; }
        .animate-pulse { animation: pulse 1.5s infinite; }
        .tracking-widest { letter-spacing: 0.3em; }

        @media (min-width: 768px) {
            .md-text-5xl { font-size: 3rem; line-height: 1; }
        }

        /* UI Layering */
        #game-layer { z-index: 1; position: absolute; inset: 0; }
        #ui-layer { z-index: 10; position: absolute; inset: 0; pointer-events: none; }
        #input-layer { z-index: 20; position: absolute; inset: 0; pointer-events: none; }
        #modal-layer { z-index: 30; position: absolute; inset: 0; pointer-events: auto; }

        /* Input Zones */
        .touch-zone {
            position: absolute;
            bottom: 0;
            top: 0;
            pointer-events: auto;
        }
        #zone-move { left: 0; width: 50%; }
        #zone-action { right: 0; width: 50%; pointer-events: none; }

        /* Buttons */
        .btn-game {
            pointer-events: auto;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.28), transparent 40%), linear-gradient(180deg, #18344d 0%, #0c1725 100%);
            border: 2px solid rgba(221, 248, 255, 0.95);
            box-shadow: 0 5px 0 rgba(0,0,0,0.72), 0 0 16px rgba(97, 232, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-family: var(--font-accent);
            font-weight: 400;
            text-shadow: 1px 1px 0 #000;
            transition: transform 0.05s, box-shadow 0.18s ease, filter 0.18s ease;
            touch-action: none;
        }
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.72), 0 0 12px rgba(97, 232, 255, 0.15);
            filter: brightness(1.12);
        }
        .btn-game:hover { transform: scale(1.05); }
        
        .btn-skill { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 42%), linear-gradient(180deg, #32b6ff 0%, #0d5ca8 100%); width: 64px; height: 64px; }
        .btn-atk { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 42%), linear-gradient(180deg, #ff6c9a 0%, #9e174a 100%); width: 84px; height: 84px; }
        .btn-swap { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 42%), linear-gradient(180deg, #ffbf47 0%, #a86e14 100%); width: 44px; height: 44px; border-radius: 8px; font-size: 8px; }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
        @keyframes signalSweep {
            0% { transform: translateX(-120%); opacity: 0; }
            25% { opacity: 0.45; }
            100% { transform: translateX(120%); opacity: 0; }
        }
        .animate-float { animation: float 2s infinite ease-in-out; }

        #dialogue-box, #start-screen, #game-over-screen, #hud, #input-layer {
            font-family: var(--font-ui);
        }

        #ui-layer {
            position: relative;
        }

        #hud > div:first-child,
        #dialogue-box,
        #start-screen .bg-gray-800,
        #game-over-screen,
        #start-screen {
            position: relative;
        }

        #hud > div:first-child::before,
        #dialogue-box::before,
        #start-screen .bg-gray-800::before,
        #game-over-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(100deg, transparent 0%, rgba(97, 232, 255, 0.08) 45%, rgba(255, 191, 71, 0.18) 50%, transparent 56%);
            transform: translateX(-120%);
            animation: signalSweep 6s linear infinite;
        }

        #hud > div:first-child,
        #dialogue-box,
        #start-screen .bg-gray-800,
        #game-over-screen {
            overflow: hidden;
            background: linear-gradient(180deg, rgba(15, 30, 46, 0.92), rgba(6, 14, 24, 0.96));
            border-color: rgba(186, 233, 255, 0.8);
            box-shadow: 0 0 24px rgba(97, 232, 255, 0.12), inset 0 0 16px rgba(255,255,255,0.04);
        }

        #zone-action .absolute {
            padding: 0.25rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(9, 19, 34, 0.12), rgba(9, 19, 34, 0));
        }

        #skill-label,
        #gold-display,
        #quest-display,
        #lvl-display,
        #dialogue-name {
            color: #eff8ff;
        }

        #gold-display { color: #ffdd7d; }
        #lvl-display { color: #98bad1; }
        #dialogue-name { color: #7df3ff; }

        #modal-layer {
            backdrop-filter: blur(2px);
            background:
                radial-gradient(circle at top, rgba(97, 232, 255, 0.16), transparent 30%),
                rgba(6, 11, 20, 0.94);
        }

        #start-screen h1 {
            color: #ffe39a;
            text-shadow: 0 0 16px rgba(255, 191, 71, 0.35), 2px 2px 0 #000;
        }

        #start-screen p {
            color: #d6f8ff;
        }

        #gameCanvas {
            filter: saturate(1.08) contrast(1.05);
        }

        .feedback-gif {
            position: absolute;
            z-index: 12;
            pointer-events: none;
            border: 2px solid rgba(186, 233, 255, 0.7);
            border-radius: 10px;
            background: rgba(6, 11, 20, 0.72);
            box-shadow: 0 0 22px rgba(97, 232, 255, 0.2);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.28s ease, transform 0.28s ease;
        }

        .feedback-gif.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        #impact-gif {
            width: 92px;
            height: 92px;
            right: 0.75rem;
            top: 5.25rem;
        }

        #status-gif {
            width: 110px;
            height: 72px;
            left: 0.75rem;
            bottom: 6.25rem;
        }

        @media (max-width: 767px) {
            #impact-gif {
                width: 74px;
                height: 74px;
                top: 4.75rem;
                right: 0.5rem;
            }

            #status-gif {
                width: 92px;
                height: 62px;
                left: 0.5rem;
                bottom: 5.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full bg-black"></canvas>
    <!-- [agent-note][stage3] resolved-gif: impact + outcome overlays -> catalogs/gifs.json -->
    <img id="impact-gif" class="feedback-gif" alt="Combat impact feedback" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" />
    <img id="status-gif" class="feedback-gif" alt="Dispatch status feedback" src="https://i.giphy.com/zPmxkHMk2Zseda3FIv.webp" />

    <!-- INPUT LAYER (Invisible Touch Zones) -->
    <div id="input-layer">
        <div id="zone-move" class="touch-zone"></div>
        <div id="zone-action" class="touch-zone">
            <!-- Controls Container -->
            <div class="absolute bottom-6 right-6 flex flex-col items-end gap-4">
                <div class="flex items-end gap-4">
                    <div class="flex flex-col items-center gap-1">
                        <button id="btn-swap" class="btn-game btn-swap">SWAP</button>
                        <span id="skill-label" class="text-8px text-white pixel-text bg-black-50 px-1 rounded">SCAN</span>
                    </div>
                    <button id="btn-skill" class="btn-game btn-skill">TOOL</button>
                </div>
                <button id="btn-atk" class="btn-game btn-atk">TAG</button>
            </div>
        </div>
    </div>

    <!-- UI LAYER (HUD) -->
    <div id="ui-layer" class="flex flex-col justify-between p-4 pb-8">
        <!-- Top HUD -->
        <div id="hud" class="flex justify-between items-start hidden">
            <!-- Bars -->
            <div class="flex flex-col gap-2 w-32">
                <div class="relative h-4 bg-gray-900 border border-white pixel-border">
                    <div id="hp-bar" class="h-full bg-red-600 transition-all duration-200" style="width: 100%;"></div>
                </div>
                <div class="relative h-2 bg-gray-900 border border-gray-500 pixel-border">
                    <div id="cd-bar" class="h-full bg-blue-500 transition-all duration-100" style="width: 100%;"></div>
                </div>
                <div class="text-10px text-yellow-400 pixel-text mt-1" id="gold-display">0 CR</div>
            </div>
            
            <!-- Quest Info -->
            <div class="flex flex-col items-end text-right">
                <div class="text-10px text-white pixel-text mb-1" id="quest-display">Find Dispatcher</div>
                <div class="text-8px text-gray-400 pixel-text" id="lvl-display">RANK 1</div>
            </div>
        </div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" class="absolute bottom-4 left-4 right-4 bg-gray-900 border-2 border-white p-4 hidden pointer-events-auto pixel-border" onclick="advanceDialogue()">
            <div id="dialogue-name" class="text-yellow-400 text-xs mb-2 pixel-text">NAME</div>
            <div id="dialogue-text" class="text-white text-10px leading-relaxed pixel-text">...</div>
            <div class="text-right text-8px text-gray-500 mt-2 animate-pulse">TAP TO CONTINUE</div>
        </div>
    </div>

    <!-- MODAL LAYER (Start/End Screens) -->
    <div id="modal-layer" class="flex items-center justify-center bg-gray-900-95 transition-opacity duration-500">
        <!-- Start Screen -->
        <div id="start-screen" class="text-center">
            <h1 class="text-3xl md-text-5xl text-yellow-500 mb-2 pixel-text animate-float title-font">FRONTIER<br>DISPATCH</h1>
            <p class="text-white text-10px mb-8 pixel-text tracking-widest">STARLINE RANGER SHIFT</p>
            
            <div class="bg-gray-800 p-4 border-2 border-gray-600 mb-8 max-w-xs mx-auto">
                <p class="text-10px text-gray-300 mb-2 pixel-text">FIELD ORDERS</p>
                <div class="flex justify-center gap-4 text-8px text-gray-400 pixel-text">
                    <div>LEFT HALF<br>Move</div>
                    <div>RIGHT SIDE<br>Tag / Tool</div>
                </div>
            </div>

            <button class="btn-game px-8 py-4 rounded-none w-48 mx-auto text-xs pixel-text" style="border-radius: 4px;" onclick="startGame()">
                START SHIFT
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden text-center">
            <h2 id="go-title" class="text-4xl text-red-600 mb-4 pixel-text title-font">OVERRUN</h2>
            <p id="go-msg" class="text-white text-xs mb-8 pixel-text">The supply lane was lost.</p>
            <button class="btn-game px-6 py-3 rounded-none w-40 mx-auto text-xs pixel-text" style="border-radius: 4px; background: #0984e3;" onclick="resetGame()">
                RUN AGAIN
            </button>
        </div>
    </div>

    <script type="module">
        /* 
         * CORE ENGINE & UTILS 
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // State
        let lastTime = 0;
        let isRunning = false;
        let width, height;
        
        // Input State
        const input = {
            x: 0, y: 0, // Movement Vector
            attack: false,
            skill: false,
            joyActive: false,
            joyOrigin: {x:0, y:0},
            joyCurrent: {x:0, y:0}
        };

        // Audio + feedback media
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx_atk: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3",
            sfx_skill: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
            sfx_hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3",
            sfx_defeat: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_01.mp3",
            sfx_damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
            sfx_swap: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
            sfx_dialogue: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
            sfx_start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            sfx_fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
            sfx_win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
            sfx_lvl: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3"
        };
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const sounds = {};
        let bgmNode = null;
        let bgmGain = null;
        const lastSoundTime = {};
        const impactGif = document.getElementById('impact-gif');
        const statusGif = document.getElementById('status-gif');
        const FEEDBACK_GIFS = {
            impact: {
                src: 'https://i.giphy.com/1AjEBGWggGXh9onllB.webp',
                duration: 520
            },
            victory: {
                src: 'https://i.giphy.com/zPmxkHMk2Zseda3FIv.webp',
                duration: 2200
            },
            fail: {
                src: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp',
                duration: 1800
            }
        };
        
        /* 
         * INPUT SYSTEM (Robust Touch)
         */
        function setupInputs() {
            // Joystick (Left Half)
            const zoneMove = document.getElementById('zone-move');
            let moveTouchId = null;

            zoneMove.addEventListener('touchstart', e => {
                e.preventDefault();
                if (moveTouchId !== null) return; // Already moving
                const t = e.changedTouches[0];
                moveTouchId = t.identifier;
                
                input.joyActive = true;
                input.joyOrigin = { x: t.clientX, y: t.clientY };
                input.joyCurrent = { x: t.clientX, y: t.clientY };
                input.x = 0; input.y = 0;
            }, { passive: false });

            // Global Touch Move/End to prevent "stuck" inputs
            window.addEventListener('touchmove', e => {
                if (!input.joyActive) return;
                for (let i=0; i<e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === moveTouchId) {
                        input.joyCurrent = { x: t.clientX, y: t.clientY };
                        
                        const dx = t.clientX - input.joyOrigin.x;
                        const dy = t.clientY - input.joyOrigin.y;
                        const dist = Math.hypot(dx, dy);
                        const maxDist = 60;
                        
                        // Normalized vector
                        if (dist > 5) {
                            const angle = Math.atan2(dy, dx);
                            const force = Math.min(dist, maxDist) / maxDist;
                            input.x = Math.cos(angle) * force;
                            input.y = Math.sin(angle) * force;
                        } else {
                            input.x = 0; input.y = 0;
                        }
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i=0; i<e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === moveTouchId) {
                        moveTouchId = null;
                        input.joyActive = false;
                        input.x = 0; input.y = 0;
                    }
                }
            };
            window.addEventListener('touchend', endTouch);
            window.addEventListener('touchcancel', endTouch);

            // Safety: If no fingers on screen, clear all
            window.addEventListener('touchend', e => {
                if (e.touches.length === 0) {
                    moveTouchId = null;
                    input.joyActive = false;
                    input.x = 0; input.y = 0;
                    input.attack = false;
                    input.skill = false;
                }
            });

            // Buttons
            const bindBtn = (id, key) => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', e => { e.preventDefault(); input[key] = true; });
                btn.addEventListener('touchend', e => { e.preventDefault(); input[key] = false; });
                // Also handle mouse for testing
                btn.addEventListener('mousedown', e => { input[key] = true; });
                btn.addEventListener('mouseup', e => { input[key] = false; });
            };

            bindBtn('btn-atk', 'attack');
            bindBtn('btn-skill', 'skill');
            
            document.getElementById('btn-swap').addEventListener('click', () => {
                player.activeSkillIdx = (player.activeSkillIdx + 1) % player.skills.length;
                playSound('sfx_swap', 0.35, 1.05, 90);
                updateHUD();
            });
        }

        /* 
         * GAME LOGIC 
         */
        const TILE_SIZE = 32;
        const MAP_SIZE = 64;
        
        const world = { tiles: [], w: MAP_SIZE, h: MAP_SIZE };
        const camera = { x: 0, y: 0 };
        
        let entities = [];
        let particles = [];
        let floaters = [];
        let npcs = [];
        
        const QUEST = { START: 0, HUNT: 1, BOSS: 2, WIN: 3 };
        let questState = QUEST.START;
        let questProgress = 0;

        const player = {
            x: 0, y: 0, w: 20, h: 20,
            speed: 160,
            hp: 100, maxHp: 100,
            xp: 0, nextXp: 100, level: 1,
            gold: 0,
            facing: 1,
            skills: [
                { id: 'fire', name: 'SCAN', cd: 1.2, timer: 0, color: '#e17055' },
                { id: 'dash', name: 'BURST', cd: 2.5, timer: 0, color: '#74b9ff' },
                { id: 'heal', name: 'PATCH', cd: 8.0, timer: 0, color: '#00b894' }
            ],
            activeSkillIdx: 0,
            atkTimer: 0
        };

        function initWorld() {
            world.tiles = [];
            entities = [];
            npcs = [];
            
            for(let y=0; y<MAP_SIZE; y++) {
                const row = [];
                for(let x=0; x<MAP_SIZE; x++) {
                    const dx = x - MAP_SIZE/2;
                    const dy = y - MAP_SIZE/2;
                    const d = Math.hypot(dx, dy);
                    
                    let type = 'grass';
                    if (x===0 || x===MAP_SIZE-1 || y===0 || y===MAP_SIZE-1) type = 'water';
                    else if (d < 6) type = 'stone';
                    else if (d > 20 && Math.random() < 0.15) type = 'tree';
                    else if (Math.random() < 0.05) type = 'flower';
                    
                    row.push({ type, x, y, var: Math.random() });
                }
                world.tiles.push(row);
            }

            player.x = (MAP_SIZE/2) * TILE_SIZE;
            player.y = (MAP_SIZE/2) * TILE_SIZE;
            
            npcs.push({
                name: "Dispatcher",
                x: player.x,
                y: player.y - 80,
                dialogue: [
                    "Courier, we need the route cleared.",
                    "Wild globs are clogging the supply lane.",
                    "Tag 5 globs, then I can mark the raider chief.",
                    "Use the LEFT side to move and the RIGHT controls to tag."
                ],
                questId: QUEST.START
            });
        }

        function update(dt) {
            if (!isRunning) return;

            // Cooldowns
            player.atkTimer -= dt;
            player.skills.forEach(s => s.timer -= dt);

            // Movement (with Wall Slide)
            const speed = player.speed * (player.skills[player.activeSkillIdx].id === 'dash' && player.skills[1].timer > 2.3 ? 2.5 : 1);
            const vx = input.x * speed * dt;
            const vy = input.y * speed * dt;

            if (Math.abs(input.x) > 0.1) player.facing = Math.sign(input.x);

            // Try X move
            if (!checkCollision(player.x + vx, player.y)) player.x += vx;
            // Try Y move
            if (!checkCollision(player.x, player.y + vy)) player.y += vy;

            // Camera Follow
            camera.x += (player.x - width/2 - camera.x) * 0.1;
            camera.y += (player.y - height/2 - camera.y) * 0.1;
            
            // Clamp Camera
            camera.x = Math.max(0, Math.min(camera.x, MAP_SIZE*TILE_SIZE - width));
            camera.y = Math.max(0, Math.min(camera.y, MAP_SIZE*TILE_SIZE - height));

            // Actions
            if (input.attack && player.atkTimer <= 0) {
                performAttack();
                player.atkTimer = 0.4;
                input.attack = false; // consume input
            }
            if (input.skill) {
                useSkill();
                input.skill = false;
            }

            // Entities
            updateEntities(dt);
            
            // Spawning
            if (entities.filter(e => e.type === 'enemy').length < 8 && questState !== QUEST.WIN) {
                spawnEnemyRandom();
            }

            // Check Interactions
            checkInteractions();
            updateHUD();
        }

        function checkCollision(x, y) {
            if (x < 0 || x >= MAP_SIZE*TILE_SIZE || y < 0 || y >= MAP_SIZE*TILE_SIZE) return true;
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            const t = world.tiles[ty][tx];
            return t.type === 'water' || t.type === 'tree';
        }

        function updateEntities(dt) {
            // Update Enemies & Projectiles
            entities.forEach((e, i) => {
                if (e.type === 'enemy') {
                    const dx = player.x - e.x;
                    const dy = player.y - e.y;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist < 300) {
                        const angle = Math.atan2(dy, dx);
                        const ex = Math.cos(angle) * e.speed * dt;
                        const ey = Math.sin(angle) * e.speed * dt;
                        
                        // Soft collision between enemies
                        let pushX = 0, pushY = 0;
                        entities.forEach(o => {
                            if (o !== e && o.type === 'enemy' && Math.hypot(e.x-o.x, e.y-o.y) < 20) {
                                pushX += (e.x - o.x);
                                pushY += (e.y - o.y);
                            }
                        });

                        if (!checkCollision(e.x + ex + pushX*dt, e.y)) e.x += ex + pushX*dt;
                        if (!checkCollision(e.x, e.y + ey + pushY*dt)) e.y += ey + pushY*dt;

                        if (dist < 25) takeDamage(e.dmg * dt);
                    }
                    if (e.flash > 0) e.flash -= dt;
                }
                else if (e.type === 'proj') {
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                    e.life -= dt;
                    
                    // Hit Enemy
                    let hit = false;
                    entities.forEach(target => {
                        if (target.type === 'enemy' && Math.hypot(e.x - target.x, e.y - target.y) < target.size) {
                            damageEnemy(target, e.dmg);
                            hit = true;
                            spawnParticles(e.x, e.y, e.color, 5);
                            showGif('impact');
                        }
                    });
                    if (hit || e.life <= 0 || checkCollision(e.x, e.y)) e.dead = true;
                }
            });

            // Particles
            particles.forEach(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
            });

            // Floaters
            floaters.forEach(f => {
                f.y -= 30 * dt;
                f.life -= dt;
            });

            // Cleanup
            entities = entities.filter(e => !e.dead);
            particles = particles.filter(p => p.life > 0);
            floaters = floaters.filter(f => f.life > 0);
        }

        function performAttack() {
            playSound('sfx_atk', 0.42, 1.05, 90);
            // Melee Arc
            const angle = player.facing > 0 ? 0 : Math.PI;
            const hitX = player.x + Math.cos(angle) * 30;
            const hitY = player.y;
            
            spawnParticles(hitX, hitY, '#fff', 3);
            
            entities.forEach(e => {
                if (e.type === 'enemy' && Math.hypot(e.x - hitX, e.y - hitY) < 40) {
                    damageEnemy(e, 20 + player.level * 3);
                }
            });
        }

        function useSkill() {
            const skill = player.skills[player.activeSkillIdx];
            if (skill.timer > 0) return;
            
            skill.timer = skill.cd;
            playSound('sfx_skill', 0.4, skill.id === 'dash' ? 0.92 : 1.08, 120);

            if (skill.id === 'fire') {
                const angle = player.facing > 0 ? 0 : Math.PI;
                entities.push({
                    type: 'proj', x: player.x, y: player.y,
                    vx: Math.cos(angle)*400, vy: Math.sin(angle)*400,
                    dmg: 40 + player.level*5, life: 1, color: '#e17055'
                });
            } else if (skill.id === 'dash') {
                spawnParticles(player.x, player.y, '#74b9ff', 10);
            } else if (skill.id === 'heal') {
                player.hp = Math.min(player.maxHp, player.hp + 40);
                spawnFloater(player.x, player.y-30, "+40 HP", "#00b894");
            }
            updateHUD();
        }

        function damageEnemy(e, amt) {
            e.hp -= amt;
            e.flash = 0.1;
            spawnFloater(e.x, e.y-20, Math.floor(amt), "#fff");
            
            // Knockback
            const angle = Math.atan2(e.y - player.y, e.x - player.x);
            e.x += Math.cos(angle) * 15;
            e.y += Math.sin(angle) * 15;

            if (e.hp <= 0) {
                e.dead = true;
                player.xp += e.xp;
                player.gold += Math.floor(Math.random()*5)+5;
                checkLevelUp();
                playSound('sfx_defeat', 0.34, e.subType === 'boss' ? 0.9 : 1.05, 120);
                showGif('impact');
                
                if (questState === QUEST.HUNT && e.subType === 'slime') {
                    questProgress++;
                    if (questProgress >= 5) {
                        questState = QUEST.BOSS;
                        spawnBoss();
                        document.getElementById('quest-display').innerText = "TAG CHIEF!";
                        document.getElementById('quest-display').classList.add('text-red-500');
                    } else {
                        document.getElementById('quest-display').innerText = `Globs: ${questProgress}/5`;
                    }
                } else if (e.subType === 'boss') {
                    victory();
                }
            }
        }

        function takeDamage(amt) {
            const prevHp = player.hp;
            player.hp -= amt;
            if (prevHp - player.hp > 2) {
                playSound('sfx_damage', player.hp / player.maxHp < 0.35 ? 0.42 : 0.26, player.hp / player.maxHp < 0.35 ? 0.92 : 1, 180);
            }
            if (player.hp <= 0) gameOver();
        }

        function checkLevelUp() {
            if (player.xp >= player.nextXp) {
                player.level++;
                player.xp -= player.nextXp;
                player.nextXp *= 1.5;
                player.maxHp += 20;
                player.hp = player.maxHp;
                spawnFloater(player.x, player.y-40, "RANK UP!", "#fdcb6e");
                playSound('sfx_lvl');
            }
        }

        function spawnEnemyRandom() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 300 + Math.random() * 200;
            const x = player.x + Math.cos(angle) * dist;
            const y = player.y + Math.sin(angle) * dist;
            if (!checkCollision(x, y)) {
                entities.push({
                    type: 'enemy', subType: 'slime',
                    x, y, size: 15,
                    hp: 30 + player.level*5, dmg: 10, speed: 40,
                    color: '#badc58', xp: 20, flash: 0
                });
            }
        }

        function spawnBoss() {
            entities.push({
                type: 'enemy', subType: 'boss',
                x: player.x, y: player.y - 300, size: 40,
                hp: 500, dmg: 25, speed: 60,
                color: '#2d3436', xp: 1000, flash: 0
            });
            spawnFloater(player.x, player.y-100, "CHIEF MARKED", "#d63031");
        }

        // --- RENDER ---
        function draw() {
            // Bg
            ctx.fillStyle = '#07111b';
            ctx.fillRect(0, 0, width, height);

            const starSeed = ((Math.floor(player.x / 64) + Math.floor(player.y / 64)) % 7 + 7) % 7;
            for (let i = 0; i < 12; i++) {
                const sx = (i * 97 + starSeed * 31) % width;
                const sy = (i * 71 + starSeed * 53) % height;
                ctx.fillStyle = i % 3 === 0 ? 'rgba(255,191,71,0.22)' : 'rgba(97,232,255,0.18)';
                ctx.fillRect(sx, sy, 2, 2);
            }
            
            if (!world.tiles.length) return;

            ctx.save();
            ctx.translate(Math.round(width/2 - player.x), Math.round(height/2 - player.y));

            // Map
            const startX = Math.floor((player.x - width/2)/TILE_SIZE) - 1;
            const startY = Math.floor((player.y - height/2)/TILE_SIZE) - 1;
            const endX = startX + (width/TILE_SIZE) + 3;
            const endY = startY + (height/TILE_SIZE) + 3;

            for(let y=startY; y<endY; y++) {
                for(let x=startX; x<endX; x++) {
                    if(y>=0 && y<MAP_SIZE && x>=0 && x<MAP_SIZE) {
                        const t = world.tiles[y][x];
                        const px = x*TILE_SIZE;
                        const py = y*TILE_SIZE;
                        if (t.type === 'grass') {
                            ctx.fillStyle = (x+y)%2 ? '#173c48' : '#1f5160';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = 'rgba(151, 246, 255, 0.05)';
                            ctx.fillRect(px + 2, py + 2, 8, 8);
                        } else if (t.type === 'stone') {
                            ctx.fillStyle = '#5d7388';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#8ba3ba';
                            ctx.fillRect(px+4, py+4, 24, 24);
                            ctx.fillStyle = '#22384c';
                            ctx.fillRect(px+8, py+8, 8, 8);
                            ctx.fillRect(px+18, py+14, 6, 6);
                        } else if (t.type === 'water') {
                            ctx.fillStyle = '#0f3d6b';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = 'rgba(151, 227, 255, 0.18)';
                            ctx.fillRect(px + ((x + y) % 2 ? 4 : 14), py + 6, 10, 4);
                            ctx.fillRect(px + ((x + y) % 2 ? 12 : 5), py + 18, 8, 3);
                        } else if (t.type === 'tree') {
                            ctx.fillStyle = '#10283d';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#35d2c3';
                            ctx.fillRect(px+8, py+6, 16, 18);
                        } else if (t.type === 'flower') {
                            ctx.fillStyle = '#173c48';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#ffbf47';
                            ctx.fillRect(px+10, py+10, 4, 4);
                            ctx.fillStyle = '#ff78a0';
                            ctx.fillRect(px+16, py+12, 6, 6);
                        }
                    }
                }
            }

            // Entities Sort
            const renderList = [...entities, ...npcs, player];
            // Add trees
            for(let y=startY; y<endY; y++) {
                for(let x=startX; x<endX; x++) {
                    if(y>=0 && y<MAP_SIZE && x>=0 && x<MAP_SIZE && world.tiles[y][x].type === 'tree') {
                        renderList.push({type:'tree', x:x*TILE_SIZE+16, y:y*TILE_SIZE+16});
                    }
                }
            }
            renderList.sort((a,b) => a.y - b.y);

            renderList.forEach(e => {
                if (e.type === 'tree') {
                    ctx.fillStyle = '#4ff3df';
                    ctx.fillRect(e.x-12, e.y-30, 24, 30);
                    ctx.fillStyle = '#10253a';
                    ctx.fillRect(e.x-8, e.y-20, 16, 10);
                    ctx.fillStyle = '#6b5437';
                    ctx.fillRect(e.x-4, e.y, 8, 4);
                } else if (e === player) {
                    ctx.fillStyle = '#7df3ff';
                    ctx.fillRect(e.x-11, e.y-31, 22, 6); // visor glow
                    ctx.fillStyle = '#132a44';
                    ctx.fillRect(e.x-10, e.y-20, 20, 20); // coat
                    ctx.fillStyle = '#33c7ff';
                    ctx.fillRect(e.x-7, e.y-16, 14, 12); // chest
                    ctx.fillStyle = '#ffe39a';
                    ctx.fillRect(e.x-8, e.y-28, 16, 8); // head
                    ctx.fillStyle = '#0a1520';
                    ctx.fillRect(e.x-4, e.y-26, 8, 2); // eyes
                    ctx.fillStyle = '#ffbf47';
                    ctx.fillRect(e.x-12, e.y-18, 3, 10);
                    ctx.fillRect(e.x+9, e.y-18, 3, 10);
                    // Weapon
                    ctx.fillStyle = '#f5f7fa';
                    if (player.atkTimer > 0) {
                        ctx.fillRect(e.x + (player.facing*10), e.y-15, 20, 4);
                        ctx.fillStyle = 'rgba(125,243,255,0.75)';
                        ctx.fillRect(e.x + (player.facing*12), e.y-17, 16, 2);
                    } else {
                        ctx.fillRect(e.x + (player.facing*6), e.y-10, 4, 12);
                    }
                } else if (e.type === 'enemy') {
                    if (e.flash > 0) ctx.fillStyle = '#fff';
                    else ctx.fillStyle = e.subType === 'boss' ? '#5f1437' : '#1a7f7b';
                    
                    const s = e.size;
                    ctx.fillRect(e.x - s, e.y - s, s*2, s*2);
                    ctx.fillStyle = e.subType === 'boss' ? '#ff7aa5' : '#86fff3';
                    ctx.fillRect(e.x - s + 4, e.y - s + 4, s*2 - 8, s - 2);
                    // Eyes
                    ctx.fillStyle = '#09131d';
                    ctx.fillRect(e.x - 5, e.y - 4, 3, 3);
                    ctx.fillRect(e.x + 2, e.y - 4, 3, 3);
                    ctx.fillStyle = '#ffbf47';
                    ctx.fillRect(e.x - 2, e.y + 2, 4, 2);
                    
                    // Health bar
                    ctx.fillStyle = '#000';
                    ctx.fillRect(e.x - 10, e.y - s - 8, 20, 4);
                    ctx.fillStyle = e.subType === 'boss' ? '#ff5c8a' : '#61e8ff';
                    ctx.fillRect(e.x - 9, e.y - s - 7, 18 * (e.hp/ (e.subType==='boss'?500:30)), 2);
                } else if (e.type === 'proj') {
                    ctx.fillStyle = '#ffbf47';
                    ctx.beginPath(); ctx.arc(e.x, e.y, 6, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(e.x, e.y, 3, 0, Math.PI*2); ctx.fill();
                } else if (e.name) { // NPC
                    ctx.fillStyle = '#ffbf47';
                    ctx.fillRect(e.x-8, e.y-20, 16, 20);
                    ctx.fillStyle = '#ffeec5';
                    ctx.fillRect(e.x-6, e.y-28, 12, 8);
                    ctx.fillStyle = '#132a44';
                    ctx.fillRect(e.x-4, e.y-24, 8, 2);
                    if (e.questId === questState) {
                        ctx.fillStyle = '#7df3ff';
                        ctx.font = '20px sans-serif';
                        ctx.fillText('!', e.x-2, e.y-25);
                    }
                }
            });

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1;
            });

            // Floaters
            ctx.font = '700 15px Rajdhani';
            ctx.textAlign = 'center';
            floaters.forEach(f => {
                ctx.fillStyle = f.color;
                ctx.fillText(f.text, f.x, f.y);
            });

            ctx.restore();

            // JOYSTICK VISUALIZATION (Overlay)
            if (input.joyActive) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(input.joyOrigin.x, input.joyOrigin.y, 40, 0, Math.PI*2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(input.joyCurrent.x, input.joyCurrent.y, 15, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- UTILS ---
        function spawnParticles(x, y, color, n) {
            for(let i=0; i<n; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random()-0.5)*100, vy: (Math.random()-0.5)*100,
                    life: 0.5
                });
            }
        }
        function spawnFloater(x, y, text, color) {
            floaters.push({x,y,text,color,life:1});
        }
        function updateHUD() {
            document.getElementById('hp-bar').style.width = (player.hp/player.maxHp)*100 + '%';
            const s = player.skills[player.activeSkillIdx];
            const cdPct = Math.max(0, s.timer/s.cd);
            document.getElementById('cd-bar').style.width = (100 - cdPct*100) + '%';
            document.getElementById('cd-bar').style.backgroundColor = s.timer>0 ? '#555' : s.color;
            document.getElementById('gold-display').innerText = player.gold + " CR";
            document.getElementById('lvl-display').innerText = "RANK " + player.level;
            document.getElementById('skill-label').innerText = s.name;
        }

        // --- DIALOGUE ---
        let currentNpc = null;
        let diaIdx = 0;
        
        function checkInteractions() {
            const npc = npcs.find(n => Math.hypot(n.x - player.x, n.y - player.y) < 50);
            if (npc && !currentNpc && input.x === 0 && input.y === 0) {
                startDialogue(npc);
            }
        }
        function startDialogue(npc) {
            currentNpc = npc;
            diaIdx = 0;
            playSound('sfx_dialogue', 0.28, 1, 120);
            document.getElementById('dialogue-box').classList.remove('hidden');
            document.getElementById('dialogue-name').innerText = npc.name;
            document.getElementById('dialogue-text').innerText = npc.dialogue[0];
            
            // Quest Trigger
            if (npc.questId === QUEST.START && questState === QUEST.START) {
                questState = QUEST.HUNT;
                document.getElementById('quest-display').innerText = "Globs: 0/5";
            }
        }
        window.advanceDialogue = () => {
            if (!currentNpc) return;
            diaIdx++;
            if (diaIdx < currentNpc.dialogue.length) {
                document.getElementById('dialogue-text').innerText = currentNpc.dialogue[diaIdx];
            } else {
                document.getElementById('dialogue-box').classList.add('hidden');
                setTimeout(() => currentNpc = null, 1000);
            }
        };

        // --- AUDIO ---
        function showGif(type) {
            const target = type === 'impact' ? impactGif : statusGif;
            const config = FEEDBACK_GIFS[type];
            if (!target || !config) return;
            target.src = config.src;
            target.classList.add('show');
            clearTimeout(target._hideTimer);
            target._hideTimer = setTimeout(() => target.classList.remove('show'), config.duration);
        }

        async function ensureAudioReady() {
            if (audioCtx.state === 'suspended') {
                try { await audioCtx.resume(); } catch (e) {}
            }
        }

        async function loadSound(key) {
            if (sounds[key] || !ASSETS[key]) return sounds[key];
            try {
                const res = await fetch(ASSETS[key]);
                const buf = await res.arrayBuffer();
                sounds[key] = await audioCtx.decodeAudioData(buf);
            } catch (e) {
                sounds[key] = null;
            }
            return sounds[key];
        }

        async function playSound(key, vol=0.5, pitch=1, debounceMs=0) {
            const now = performance.now();
            if (debounceMs && lastSoundTime[key] && now - lastSoundTime[key] < debounceMs) return;
            lastSoundTime[key] = now;
            await ensureAudioReady();
            const buffer = await loadSound(key);
            if (!buffer) return;
            try {
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.value = vol;
                src.playbackRate.value = pitch;
                src.connect(gain);
                gain.connect(audioCtx.destination);
                src.start(0);
            } catch (e) {}
        }

        async function startBgm() {
            await ensureAudioReady();
            const buffer = await loadSound('bgm');
            if (!buffer || bgmNode) return;
            try {
                bgmNode = audioCtx.createBufferSource();
                bgmNode.buffer = buffer;
                bgmNode.loop = true;
                bgmGain = audioCtx.createGain();
                bgmGain.gain.value = 0.18;
                bgmNode.connect(bgmGain);
                bgmGain.connect(audioCtx.destination);
                bgmNode.start(0);
                bgmNode.onended = () => {
                    bgmNode = null;
                    bgmGain = null;
                };
            } catch (e) {
                bgmNode = null;
                bgmGain = null;
            }
        }

        function stopBgm() {
            if (!bgmNode) return;
            try { bgmNode.stop(0); } catch (e) {}
            bgmNode = null;
            bgmGain = null;
        }

        // --- SYSTEM ---
        window.startGame = async () => {
            await ensureAudioReady();
            document.getElementById('modal-layer').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            playSound('sfx_start', 0.42, 1, 120);
            
            initWorld();
            isRunning = true;
            resize();
            startBgm();
        };
        
        window.resetGame = () => {
            stopBgm();
            statusGif.classList.remove('show');
            impactGif.classList.remove('show');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('modal-layer').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
            isRunning = false;
        };

        function gameOver() {
            isRunning = false;
            stopBgm();
            showGif('fail');
            playSound('sfx_fail', 0.45, 1, 120);
            document.getElementById('modal-layer').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('go-title').innerText = "OVERRUN";
            document.getElementById('go-title').className = "text-4xl text-red-600 mb-4 pixel-text title-font";
            document.getElementById('go-msg').innerText = "The supply lane was lost.";
        }

        function victory() {
            isRunning = false;
            stopBgm();
            showGif('victory');
            playSound('sfx_win', 0.5, 1, 120);
            document.getElementById('modal-layer').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('go-title').innerText = "ROUTE SECURED";
            document.getElementById('go-title').className = "text-4xl text-yellow-400 mb-4 pixel-text title-font";
            document.getElementById('go-msg').innerText = "The convoy can roll again.";
            playSound('sfx_lvl', 0.35, 1.08, 120);
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);

        function loop(ts) {
            const dt = Math.min((ts - lastTime) / 1000, 0.1);
            lastTime = ts;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        setupInputs();
        resize();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
