<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Street Hoops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: required-font-remap | title -> Audiowide, ui/hud -> Exo 2, icons -> Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        :root {
            --sky-top: #08111f;
            --sky-mid: #14284f;
            --sky-bottom: #30124e;
            --court-glow: #67e8f9;
            --court-glow-soft: rgba(103, 232, 249, 0.25);
            --neon-orange: #ff8c42;
            --neon-gold: #ffd166;
            --neon-pink: #ff4da6;
            --panel-bg: rgba(8, 15, 30, 0.72);
            --panel-border: rgba(103, 232, 249, 0.45);
            --panel-shadow: rgba(0, 0, 0, 0.45);
            --white: #ffffff;
            --white-85: rgba(255, 255, 255, 0.85);
            --white-70: rgba(255, 255, 255, 0.7);
            --white-45: rgba(255, 255, 255, 0.45);
            --gray-900: #111827;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            background:
                radial-gradient(circle at top, rgba(103, 232, 249, 0.08), transparent 35%),
                linear-gradient(180deg, #04070d 0%, #110f27 100%);
            color: var(--white);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .screen-root::before,
        .screen-root::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .screen-root::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 209, 102, 0.2), transparent 18%),
                radial-gradient(circle at 80% 22%, rgba(103, 232, 249, 0.18), transparent 20%),
                radial-gradient(circle at 50% 100%, rgba(255, 77, 166, 0.18), transparent 30%);
            mix-blend-mode: screen;
        }

        .screen-root::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 12%, transparent 88%, rgba(255, 255, 255, 0.03)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.025) 0 2px,
                    transparent 2px 4px
                );
            opacity: 0.4;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .overlay-panel {
            width: min(90vw, 420px);
            padding: 1.7rem 1.4rem;
            border-radius: 1.6rem;
            text-align: center;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .overlay-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 34%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 45%);
            pointer-events: none;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 40px var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06),
                0 0 24px rgba(103, 232, 249, 0.1);
        }

        .panel-pop {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .panel-pop:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow:
                0 20px 48px rgba(0, 0, 0, 0.52),
                0 0 26px rgba(103, 232, 249, 0.14);
        }

        .title {
            margin: 0 0 0.65rem;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.3rem);
            line-height: 0.9;
            color: var(--neon-orange);
            text-shadow:
                0 2px 0 rgba(0, 0, 0, 0.35),
                0 0 14px rgba(255, 140, 66, 0.35),
                0 0 28px rgba(255, 77, 166, 0.2);
            letter-spacing: 0.08em;
        }

        .subtitle {
            margin: 0 0 1.4rem;
            font-size: clamp(1rem, 3.4vw, 1.25rem);
            line-height: 1.3;
            color: var(--white-85);
            animation: pulse 1.6s infinite;
        }

        .result-title {
            margin: 0 0 0.5rem;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2rem, 7vw, 3rem);
            color: var(--neon-pink);
            letter-spacing: 0.05em;
            text-shadow: 0 0 18px rgba(255, 77, 166, 0.35);
        }

        .result-score {
            margin: 0 0 1.25rem;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            color: var(--white);
            font-weight: 600;
        }

        .button-row {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .ui-button {
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            min-height: 48px;
            padding: 0.85rem 1.5rem;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 1.15rem;
            line-height: 1;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease, background-color 0.18s ease;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
        }

        .ui-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .ui-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .ui-button.primary {
            background: linear-gradient(180deg, #ffb36b 0%, var(--neon-orange) 100%);
            color: #1c1024;
            box-shadow:
                0 14px 32px rgba(255, 140, 66, 0.28),
                inset 0 -2px 0 rgba(0, 0, 0, 0.15);
        }

        .ui-button.primary:hover {
            background: linear-gradient(180deg, #ffc47b 0%, #ff954f 100%);
        }

        .ui-button.secondary {
            background: rgba(255, 255, 255, 0.92);
            color: var(--gray-900);
            border-color: transparent;
        }

        .ui-button.secondary:hover {
            background: #ffffff;
        }

        .button-icon,
        .hud-icon {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 1.2em;
            line-height: 1;
            display: inline-block;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(0.9rem, 2.8vw, 1.05rem);
            font-weight: 600;
            color: var(--white);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: rgba(6, 10, 18, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.32),
                inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-icon {
            color: var(--neon-gold);
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.45);
        }

        .hud .value {
            color: var(--neon-orange);
            text-shadow: 0 0 10px rgba(255, 140, 66, 0.35);
        }

        .feedback-gif {
            position: absolute;
            right: clamp(0.75rem, 2vw, 1rem);
            bottom: clamp(0.75rem, 2vw, 1rem);
            width: clamp(88px, 22vw, 132px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(8, 15, 30, 0.45);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.is-visible {
            opacity: 0.88;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.score {
            border-color: rgba(255, 209, 102, 0.55);
            box-shadow: 0 12px 30px rgba(255, 209, 102, 0.18);
        }

        .feedback-gif.fail {
            border-color: rgba(255, 77, 166, 0.45);
            box-shadow: 0 12px 30px rgba(255, 77, 166, 0.16);
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.58; transform: translateY(-1px); }
        }

        @media (max-width: 480px) {
            .overlay-panel {
                width: min(92vw, 380px);
                padding: 1.45rem 1.1rem;
                border-radius: 1.35rem;
            }

            .ui-button {
                width: 100%;
                max-width: 220px;
            }

            .hud {
                top: 0.75rem;
                left: 0.75rem;
                padding: 0.45rem 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-root">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="overlay-panel glass-panel panel-pop">
                <h1 class="title">STREET HOOPS</h1>
                <p class="subtitle">Drag back, launch high, and light up the late-night blacktop.</p>
                <div class="button-row">
                    <button id="start-btn" class="ui-button primary"><span class="button-icon" aria-hidden="true">play_arrow</span>PLAY BALL</button>
                </div>
            </div>

            <div id="game-over-screen" class="overlay-panel glass-panel hidden">
                <h2 class="result-title">AIRBALL!</h2>
                <div class="result-score">Baskets: <span id="finalScore">0</span></div>
                <div class="button-row">
                    <button id="restart-btn" class="ui-button secondary"><span class="button-icon" aria-hidden="true">refresh</span>Replay</button>
                </div>
            </div>

            <div id="hud" class="hud hidden">
                <span class="hud-icon" aria-hidden="true">star</span>
                SCORE: <span id="score" class="value">0</span>
            </div>
            <!-- [agent-note][stage3] resolved-gif: score/fail overlays -> catalogs/gifs.json -->
            <img id="score-gif" class="feedback-gif hidden" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction overlay">
            <img id="fail-gif" class="feedback-gif hidden" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Miss reaction overlay">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                launch: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                rim: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = this.createAudio(ASSETS.bgm, { loop: true, volume: 0.2 });
                this.sfx = {};
                this.lastPlayed = {};
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = this.createAudio(url, { volume: key === 'fail' ? 0.5 : 0.7 });
                }
            }

            createAudio(src, options = {}) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = Boolean(options.loop);
                audio.volume = options.volume ?? 0.6;
                return audio;
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 90) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
                this.lastPlayed[key] = now;

                const clip = this.sfx[key].cloneNode();
                clip.volume = this.sfx[key].volume;
                clip.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const feedbackEls = {
            score: document.getElementById('score-gif'),
            fail: document.getElementById('fail-gif')
        };
        let feedbackTimer = null;

        function showFeedbackGif(type) {
            const activeEl = feedbackEls[type];
            if (!activeEl) return;

            Object.values(feedbackEls).forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('is-visible', 'score', 'fail');
            });

            activeEl.classList.remove('hidden');
            activeEl.classList.add('is-visible', type);

            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                activeEl.classList.remove('is-visible', 'score', 'fail');
                activeEl.classList.add('hidden');
            }, 1400);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let hasScoredThisShot = false;
        let landedThisShot = false;

        // Physics Constants
        const GRAVITY = 0.6;
        const DRAG_POWER = 0.18;
        const MAX_POWER = 25;

        // Game Objects
        let ball = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            radius: 20,
            state: 'idle', // idle, aiming, flying
            startX: 0, startY: 0
        };

        let hoop = {
            x: 0, y: 0,
            width: 100,
            rimY: 0
        };

        let input = {
            active: false,
            startX: 0, startY: 0,
            currX: 0, currY: 0
        };

        // Parallax Data
        let skyline1 = [];
        let skyline2 = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateSkyline();
            if (!gameActive) {
                resetBall();
                randomizeHoop();
            }
        }
        window.addEventListener('resize', resize);

        /** 4. PARALLAX GENERATION */
        function generateSkyline() {
            skyline1 = [];
            skyline2 = [];
            let x = 0;
            // Far layer
            while (x < width + 200) {
                let w = 50 + Math.random() * 80;
                let h = 100 + Math.random() * 150;
                skyline1.push({x, w, h});
                x += w;
            }
            // Near layer
            x = 0;
            while (x < width + 200) {
                let w = 30 + Math.random() * 60;
                let h = 50 + Math.random() * 80;
                skyline2.push({x, w, h});
                x += w;
            }
        }

        function drawParallax() {
            // Gradient Sky
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#0f172a'); // Dark slate
            grad.addColorStop(1, '#312e81'); // Indigo
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Draw Moon
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(width * 0.8, height * 0.2, 40, 0, Math.PI * 2);
            ctx.fill();

            // Layer 1 (Far - Slow)
            ctx.fillStyle = '#1e1b4b';
            skyline1.forEach(b => {
                // Parallax shift based on mouse slightly or just time
                let shift = (frameCount * 0.2) % (width + 200);
                let drawX = b.x - shift;
                if (drawX + b.w < 0) drawX += (width + 200); // wrap logic simplified
                else if (drawX > width) drawX -= (width + 200);

                // Simple wrapping visual hack: just draw static for MVP stability
                ctx.fillRect(b.x - (frameCount * 0.2 % 200), height - b.h, b.w + 2, b.h);
            });

            // Layer 2 (Near - Faster)
            ctx.fillStyle = '#312e81';
            skyline2.forEach(b => {
                ctx.fillRect(b.x - (frameCount * 0.5 % 200), height - b.h * 0.6, b.w + 2, b.h * 0.6);
            });
        }

        /** 5. GAME LOGIC */
        function resetBall() {
            ball.radius = Math.min(width, height) * 0.04;
            ball.x = width * 0.2;
            ball.y = height - ball.radius - 50;
            ball.vx = 0;
            ball.vy = 0;
            ball.state = 'idle';
            ball.startX = ball.x;
            ball.startY = ball.y;
        }

        function randomizeHoop() {
            // Hoop on the right side
            hoop.x = width * 0.6 + Math.random() * (width * 0.3);
            hoop.y = height * 0.3 + Math.random() * (height * 0.3);
            hoop.width = ball.radius * 3.5;
            hoop.rimY = hoop.y + 50;
        }

        function initGame() {
            score = 0;
            hasScoredThisShot = false;
            landedThisShot = false;
            document.getElementById('score').innerText = score;
            resetBall();
            randomizeHoop();
        }

        function update() {
            if (ball.state === 'flying') {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += GRAVITY;

                // Bounce off walls
                if (ball.x < ball.radius || ball.x > width - ball.radius) {
                    ball.vx *= -0.6;
                    ball.x = ball.x < ball.radius ? ball.radius : width - ball.radius;
                }

                // Floor collision (Fail)
                if (ball.y > height - ball.radius) {
                    ball.y = height - ball.radius;
                    ball.vy *= -0.5;
                    ball.vx *= 0.8; // Friction

                    if (!landedThisShot) {
                        landedThisShot = true;
                        audio.playSFX('land', 160);
                    }

                    if (Math.abs(ball.vy) < 2 && Math.abs(ball.vx) < 1) {
                        // Stopped
                        gameOver();
                    }
                }

                // Hoop Collision
                // Check if ball is within the rim horizontally
                // Hoop is drawn centered at hoop.x
                let rimLeft = hoop.x - hoop.width / 2;
                let rimRight = hoop.x + hoop.width / 2;

                // Simple AABB-ish check for passing through rim
                if (ball.vy > 0) { // Must be falling
                    // Check if we crossed the rim line this frame
                    let prevY = ball.y - ball.vy;
                    if (prevY < hoop.rimY && ball.y >= hoop.rimY) {
                        // Crossed the line. Check X bounds.
                        if (ball.x > rimLeft && ball.x < rimRight) {
                            // SCORE!
                            score++;
                            hasScoredThisShot = true;
                            document.getElementById('score').innerText = score;
                            audio.playSFX('score', 220);
                            showFeedbackGif('score');

                            // Visual pop
                            createParticles(ball.x, ball.y, '#fb923c');

                            // Reset logic
                            setTimeout(() => {
                                resetBall();
                                randomizeHoop();
                                hasScoredThisShot = false;
                                landedThisShot = false;
                            }, 500);
                        }
                    }
                }

                // Backboard collision (Simple)
                // Backboard is at hoop.x + hoop.width/2 approx (visuals)
                // Let's assume backboard is a vertical line at rimRight
                if (ball.x + ball.radius > rimRight && ball.x - ball.radius < rimRight + 10) {
                    if (ball.y > hoop.rimY - 80 && ball.y < hoop.rimY) {
                        ball.vx *= -0.7;
                        ball.x = rimRight - ball.radius;
                        audio.playSFX('rim', 120);
                    }
                }
            }
        }

        // Particle System for Score
        let particles = [];
        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawCourtGlow() {
            const courtY = height - Math.max(70, height * 0.11);
            const floorGradient = ctx.createLinearGradient(0, courtY - 30, 0, height);
            floorGradient.addColorStop(0, 'rgba(255, 90, 95, 0)');
            floorGradient.addColorStop(1, 'rgba(255, 90, 95, 0.18)');
            ctx.fillStyle = floorGradient;
            ctx.fillRect(0, courtY - 30, width, height - courtY + 30);

            ctx.strokeStyle = 'rgba(103, 232, 249, 0.22)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, courtY);
            ctx.lineTo(width, courtY);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(width * 0.23, courtY + 8, Math.min(width, height) * 0.11, Math.PI, Math.PI * 2);
            ctx.stroke();
        }

        function drawHoop() {
            const boardX = hoop.x + hoop.width / 2;
            const boardY = hoop.rimY - 86;

            ctx.save();
            ctx.shadowColor = 'rgba(103, 232, 249, 0.4)';
            ctx.shadowBlur = 18;
            ctx.fillStyle = 'rgba(236, 254, 255, 0.82)';
            ctx.fillRect(boardX, boardY, 12, 96);
            ctx.restore();

            ctx.strokeStyle = 'rgba(103, 232, 249, 0.45)';
            ctx.lineWidth = 3;
            ctx.strokeRect(boardX - 22, boardY + 16, 34, 26);

            ctx.save();
            ctx.strokeStyle = '#ff5a5f';
            ctx.lineWidth = 5;
            ctx.shadowColor = 'rgba(255, 90, 95, 0.45)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.width / 2, hoop.rimY);
            ctx.lineTo(hoop.x + hoop.width / 2, hoop.rimY);
            ctx.stroke();
            ctx.restore();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = 1.2;
            for (let i = 0; i <= 4; i++) {
                const netX = hoop.x - hoop.width / 2 + (hoop.width / 4) * i;
                ctx.beginPath();
                ctx.moveTo(netX, hoop.rimY);
                ctx.lineTo(hoop.x - hoop.width / 3 + (hoop.width / 6) * i, hoop.rimY + 40);
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.width / 3, hoop.rimY + 40);
            ctx.lineTo(hoop.x + hoop.width / 3, hoop.rimY + 40);
            ctx.stroke();
        }

        function drawBall() {
            const glow = ctx.createRadialGradient(
                ball.x - ball.radius * 0.35,
                ball.y - ball.radius * 0.45,
                ball.radius * 0.15,
                ball.x,
                ball.y,
                ball.radius * 1.2
            );
            glow.addColorStop(0, '#ffd166');
            glow.addColorStop(0.45, '#ff9f43');
            glow.addColorStop(1, '#d85a10');

            ctx.save();
            ctx.shadowColor = 'rgba(255, 140, 66, 0.38)';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();
            ctx.restore();

            ctx.strokeStyle = 'rgba(58, 22, 7, 0.95)';
            ctx.lineWidth = 2.2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 0.98, -0.8, 0.8);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 0.98, Math.PI - 0.8, Math.PI + 0.8);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ball.x - ball.radius, ball.y);
            ctx.quadraticCurveTo(ball.x, ball.y + ball.radius, ball.x + ball.radius, ball.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ball.x - ball.radius * 0.15, ball.y - ball.radius);
            ctx.quadraticCurveTo(ball.x - ball.radius * 0.65, ball.y, ball.x - ball.radius * 0.15, ball.y + ball.radius);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.radius * 0.32, ball.y - ball.radius * 0.4, ball.radius * 0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCharacterAura() {
            if (ball.state !== 'idle') return;
            ctx.save();
            const pulse = 0.5 + Math.sin(frameCount * 0.08) * 0.12;
            ctx.strokeStyle = `rgba(255, 209, 102, ${pulse})`;
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 10]);
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            ctx.setLineDash([]);
        }

        function draw() {
            drawCourtGlow();
            drawHoop();
            drawBall();
            drawCharacterAura();

            // Aiming Line
            if (input.active && ball.state === 'idle') {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(ball.x + (ball.x - input.currX), ball.y + (ball.y - input.currY));
                ctx.strokeStyle = 'rgba(103, 232, 249, 0.72)';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 8]);
                ctx.shadowColor = 'rgba(103, 232, 249, 0.38)';
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.restore();
                ctx.setLineDash([]);

                // Trajectory Prediction
                ctx.fillStyle = 'rgba(255, 255, 255, 0.34)';
                let simX = ball.x;
                let simY = ball.y;
                let simVx = (ball.x - input.currX) * DRAG_POWER;
                let simVy = (ball.y - input.currY) * DRAG_POWER;

                // Clamp power
                let mag = Math.sqrt(simVx * simVx + simVy * simVy);
                if (mag > MAX_POWER) {
                    simVx = (simVx / mag) * MAX_POWER;
                    simVy = (simVy / mag) * MAX_POWER;
                }

                for (let i = 0; i < 15; i++) {
                    simX += simVx;
                    simY += simVy;
                    simVy += GRAVITY;
                    ctx.beginPath();
                    ctx.arc(simX, simY, Math.max(2.5, 4 - i * 0.12), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, width, height);

            drawParallax();
            update();
            drawParticles();
            draw();

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedbackGif('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        function handleStart(x, y) {
            if (!gameActive || ball.state !== 'idle') return;
            input.active = true;
            input.startX = x;
            input.startY = y;
            input.currX = x;
            input.currY = y;
        }

        function handleMove(x, y) {
            if (input.active) {
                input.currX = x;
                input.currY = y;
            }
        }

        function handleEnd() {
            if (input.active) {
                input.active = false;
                ball.state = 'flying';

                // Calculate velocity based on drag
                let vx = (ball.x - input.currX) * DRAG_POWER;
                let vy = (ball.y - input.currY) * DRAG_POWER;

                // Cap velocity
                let mag = Math.sqrt(vx * vx + vy * vy);
                if (mag > MAX_POWER) {
                    vx = (vx / mag) * MAX_POWER;
                    vy = (vy / mag) * MAX_POWER;
                }

                ball.vx = vx;
                ball.vy = vy;
                hasScoredThisShot = false;
                landedThisShot = false;
                audio.playSFX('launch', 120);
            }
        }

        // Mouse
        canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', handleEnd);

        // Touch
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleStart(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            handleEnd();
        });

        // UI Buttons
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('ui', 60);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            resize(); // Ensure correct sizing
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('ui', 60);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        // Initial setup
        resize();
    });
    </script>
</body>
</html>
