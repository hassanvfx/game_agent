            width: 100%;
            min-height: 100%;
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(120, 62, 255, 0.28), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));

<script>
/** 
 * §2 Technical Contract Implementation 
 */

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.bgmNode = null;
        this.isMuted = false;
        this.initialized = false;
        this.lastPlayedAt = {};
        this.sfxElements = {};
    }

    init() {
        if (this.initialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.initialized = true;
        
        // Resume context on interaction
        const unlock = () => {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };
        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock);
    }

    async loadSound(id, elementId, fallbackType) {
        const el = document.getElementById(elementId);
        if (!el) return;
        this.sfxElements[id] = el;

        try {
            const soundUrl = new URL(el.src, window.location.href);
            if (soundUrl.origin !== window.location.origin) {
                this.buffers[id] = { type: 'element', elementId };
                return;
            }

            const response = await fetch(soundUrl.href);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
            this.buffers[id] = { buffer: audioBuffer, type: 'buffer' };
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using fallback`, e);
            this.buffers[id] = { type: 'fallback', fallbackType };
        }
    }

    playBgm() {
        if (!this.initialized) this.init();
        const el = document.getElementById('bgm_main');
        if (el) {
            el.volume = 0.2;
            el.play().catch(e => console.log("Autoplay prevented"));
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id, cooldown = 70) {
        if (!this.initialized || !this.ctx) return;
        const nowMs = performance.now();
        if (this.lastPlayedAt[id] && nowMs - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = nowMs;
        
        const sound = this.buffers[id];
        if (!sound) return;

        if (sound.type === 'buffer') {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            const volumes = {
                sfx_catch: 0.28,
                sfx_wall: 0.18,
                sfx_fail: 0.34,
                sfx_ui: 0.22
            };
            gain.gain.value = volumes[id] || 0.22;
            source.buffer = sound.buffer;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else if (sound.type === 'element') {
            const sourceEl = this.sfxElements[id];
            if (!sourceEl) return;
            const clone = sourceEl.cloneNode();
            clone.volume = {
                sfx_catch: 0.28,
                sfx_wall: 0.18,
                sfx_fail: 0.2,
                sfx_ui: 0.22
            }[id] || 0.22;
            clone.currentTime = 0;
            clone.play().catch(() => {});
        } else {
            this.synthesize(sound.fallbackType);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'ui') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(820, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        }
    }
}

// --- Game Logic ---

document.addEventListener('DOMContentLoaded', () => {
    // Config Init
    window.gameConfig = {};
    window.gameConfigDefs = {};
    
    try {
        const configEl = document.getElementById('game-config');
        if (configEl) {
            const defs = JSON.parse(configEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                window.gameConfig[key] = defs[key].value;
            }
        }
    } catch (e) {
        console.error("Config parse error", e);
    }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfigDefs[key]) {
            const def = window.gameConfigDefs[key];
            if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, Number(val)));
            if (def.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
            window.gameConfig[key] = val;
        }
    };

    // Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const statusBanner = document.getElementById('status-banner');
    const rescueGif = document.getElementById('rescue-gif');
    const dangerGif = document.getElementById('danger-gif');

    // State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let lastTime = 0;
    let shake = 0;
    
    // Physics & Entities
    const alien = {
        x: 0, 
        y: 0, 
        width: 100, 
        height: 20, 
        targetX: 0,
        color: '#39ff14'
    };
    
    const head = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        radius: 25,
        rotation: 0,
        rotSpeed: 0,
        active: false
    };

    let particles = [];
    let popups = [];
    let feedbackTimers = { banner: null, rescue: null, danger: null };

    function showBanner(message, tone = 'neutral', duration = 1200) {
        if (!statusBanner) return;
        statusBanner.textContent = message;
        statusBanner.style.borderColor = tone === 'danger'
            ? 'rgba(255, 77, 141, 0.55)'
            : 'rgba(138, 247, 255, 0.4)';
        statusBanner.style.color = tone === 'danger' ? '#ffd8e6' : '#f7fbff';
        statusBanner.classList.add('visible');
        clearTimeout(feedbackTimers.banner);
        feedbackTimers.banner = setTimeout(() => statusBanner.classList.remove('visible'), duration);
    }

    function pulseGif(element, key, duration = 1100) {
        if (!element) return;
        element.classList.add('visible');
        clearTimeout(feedbackTimers[key]);
        feedbackTimers[key] = setTimeout(() => element.classList.remove('visible'), duration);
    }

    // Resize Handling
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Reset positions on resize
        alien.y = window.innerHeight - 100;
        if (gameState === 'START') {
            alien.x = window.innerWidth / 2;
            alien.targetX = window.innerWidth / 2;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    function handleInput(e) {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        alien.targetX = clientX - rect.left;
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (gameState === 'PLAYING') handleInput(e);
    }, { passive: false });
    
    canvas.addEventListener('pointermove', (e) => {
        if (gameState === 'PLAYING') handleInput(e);
    }, { passive: false });

    // Game Functions
    function initGame() {
        score = 0;
        scoreEl.innerText = '0';
        shake = 0;
        particles = [];
        popups = [];
        rescueGif.classList.remove('visible');
        dangerGif.classList.remove('visible');
        showBanner('Crew beacon reacquired', 'neutral', 1200);
        
        alien.x = window.innerWidth / 2;
        alien.targetX = window.innerWidth / 2;
        alien.y = window.innerHeight - 100;
        
        resetHead();
    }

    function resetHead() {
        head.x = window.innerWidth / 2;
        head.y = window.innerHeight / 3;
        head.vx = (Math.random() - 0.5) * 8;
        head.vy = -5;
        head.rotation = 0;
        head.rotSpeed = 0.1;
        head.active = true;
    }

    function spawnParticles(x, y, color, count, speed) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const v = Math.random() * speed;
            particles.push({
                x, y,
                vx: Math.cos(angle) * v,
                vy: Math.sin(angle) * v,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function spawnPopup(x, y, text) {
        popups.push({ x, y, text, life: 1.0, vy: -2 });
    }

    function update(dt) {
        // Alien Movement
        const speed = window.gameConfig.alienSpeed || 15;
        const diff = alien.targetX - alien.x;
        if (Math.abs(diff) > 1) {
            alien.x += diff * (dt * 0.01 * speed); // Smooth follow
        }
        // Clamp Alien
        alien.x = Math.max(alien.width/2, Math.min(window.innerWidth - alien.width/2, alien.x));

        // Head Physics
        if (head.active) {
            head.vy += (window.gameConfig.gravity || 0.5);
            head.x += head.vx;
            head.y += head.vy;
            head.rotation += head.rotSpeed;

            // Wall Collisions
            if (head.x - head.radius < 0) {
                head.x = head.radius;
                head.vx *= -0.8;
                head.rotSpeed = -head.rotSpeed;
                audio.playSfx('sfx_wall');
                shake = 5;
            } else if (head.x + head.radius > window.innerWidth) {
                head.x = window.innerWidth - head.radius;
                head.vx *= -0.8;
                head.rotSpeed = -head.rotSpeed;
                audio.playSfx('sfx_wall');
                shake = 5;
            }

            if (head.y - head.radius < 0) {
                head.y = head.radius;
                head.vy *= -0.8;
                audio.playSfx('sfx_wall');
                shake = 5;
            }

            // Floor Collision (Game Over)
            if (head.y - head.radius > window.innerHeight) {
                gameOver();
            }

            // Alien Collision
            // Simple AABB/Circle check approximation
            if (head.vy > 0 && 
                head.y + head.radius >= alien.y - alien.height/2 && 
                head.y - head.radius <= alien.y + alien.height/2 &&
                head.x >= alien.x - alien.width/2 - head.radius && 
                head.x <= alien.x + alien.width/2 + head.radius) {
                
                // Hit!
                head.y = alien.y - alien.height/2 - head.radius;
                const bounceForce = window.gameConfig.bounceForce || 18;
                head.vy = -bounceForce;
                
                // Add horizontal spin/velocity based on hit position
                const hitOffset = (head.x - alien.x) / (alien.width / 2);
                head.vx += hitOffset * 5;
                head.rotSpeed = hitOffset * 0.5;

                // Juice
                score += 10;
                scoreEl.innerText = score;
                spawnParticles(head.x, head.y, '#39ff14', 15, 8); // Green slime
                spawnPopup(head.x, head.y - 50, "+10");
                audio.playSfx('sfx_catch', 90);
                pulseGif(rescueGif, 'rescue', 950);
                showBanner('Pod secured', 'neutral', 900);
                shake = 10;
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // gravity
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Popups
        for (let i = popups.length - 1; i >= 0; i--) {
            const p = popups[i];
            p.y += p.vy;
            p.life -= 0.02;
            if (p.life <= 0) popups.splice(i, 1);
        }

        // Screen Shake decay
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    function draw() {
        // Clear
        ctx.fillStyle = '#1a0b2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Shake transform
        ctx.save();
        if (shake > 0) {
            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;
            ctx.translate(dx, dy);
        }

        // Background Stars (Parallax simplified)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        for(let i=0; i<50; i++) {
            const sx = (i * 137.5) % window.innerWidth;
            const sy = (i * 293.3 + Date.now() * 0.05) % window.innerHeight;
            ctx.beginPath();
            ctx.arc(sx, sy, Math.random() * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw Catcher Skiff
        const hullGradient = ctx.createLinearGradient(alien.x, alien.y - 20, alien.x, alien.y + 20);
        hullGradient.addColorStop(0, '#c5fbff');
        hullGradient.addColorStop(0.55, alien.color);
        hullGradient.addColorStop(1, '#2b7d98');
        ctx.fillStyle = hullGradient;
        ctx.shadowColor = 'rgba(79, 224, 255, 0.85)';
        ctx.shadowBlur = 22;

        ctx.beginPath();
        ctx.moveTo(alien.x - alien.width / 2 + 8, alien.y + 5);
        ctx.quadraticCurveTo(alien.x, alien.y - 28, alien.x + alien.width / 2 - 8, alien.y + 5);
        ctx.lineTo(alien.x + alien.width / 2 - 18, alien.y + 14);
        ctx.quadraticCurveTo(alien.x, alien.y + 26, alien.x - alien.width / 2 + 18, alien.y + 14);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.beginPath();
        ctx.ellipse(alien.x, alien.y - 2, alien.width * 0.22, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#0c1630';
        ctx.beginPath();
        ctx.roundRect(alien.x - 22, alien.y - 16, 44, 18, 8);
        ctx.fill();

        ctx.fillStyle = '#ecfeff';
        const eyeOffset = (head.x - alien.x) * 0.1;
        ctx.beginPath();
        ctx.arc(alien.x - 12 + Math.max(-4, Math.min(4, eyeOffset)), alien.y - 8, 5.5, 0, Math.PI * 2);
        ctx.arc(alien.x + 12 + Math.max(-4, Math.min(4, eyeOffset)), alien.y - 8, 5.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#10264b';
        ctx.beginPath();
        ctx.arc(alien.x - 12 + Math.max(-4, Math.min(4, eyeOffset)), alien.y - 8, 2.4, 0, Math.PI * 2);
        ctx.arc(alien.x + 12 + Math.max(-4, Math.min(4, eyeOffset)), alien.y - 8, 2.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(138, 247, 255, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(alien.x - alien.width / 2 + 16, alien.y + 10);
        ctx.lineTo(alien.x - alien.width / 2 + 6, alien.y + 18);
        ctx.moveTo(alien.x + alien.width / 2 - 16, alien.y + 10);
        ctx.lineTo(alien.x + alien.width / 2 - 6, alien.y + 18);
        ctx.stroke();

        // Draw Rescue Pod Character
        if (head.active) {
            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(head.rotation);

            const headColor = window.gameConfig.headColor || '#ffccaa';
            const podGradient = ctx.createRadialGradient(-8, -10, 4, 0, 0, head.radius + 6);
            podGradient.addColorStop(0, '#fff5e8');
            podGradient.addColorStop(0.45, headColor);
            podGradient.addColorStop(1, '#a85f7e');
            ctx.fillStyle = podGradient;
            ctx.shadowColor = 'rgba(255, 124, 163, 0.35)';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(0, 0, head.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
            ctx.beginPath();
            ctx.ellipse(-8, -10, 8, 5, -0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#261130';
            ctx.beginPath();
            ctx.arc(-8, -6, 4.5, 0, Math.PI * 2);
            ctx.arc(8, -6, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6.5, -7.5, 1.4, 0, Math.PI * 2);
            ctx.arc(9.5, -7.5, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#7a2147';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-12, 8);
            ctx.quadraticCurveTo(0, 18, 12, 8);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, head.radius - 3, Math.PI * 0.18, Math.PI * 0.82);
            ctx.stroke();

            ctx.restore();
        }

        // Particles
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Popups
        ctx.font = '700 30px Orbitron';
        ctx.fillStyle = '#8af7ff';
        ctx.textAlign = 'center';
        for (const p of popups) {
            ctx.globalAlpha = p.life;
            ctx.fillText(p.text, p.x, p.y);
        }
        ctx.globalAlpha = 1;

        ctx.restore(); // End shake
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min(timestamp - lastTime, 50); // Cap dt
        lastTime = timestamp;

        if (gameState === 'PLAYING') {
            update(dt);
            draw();
        } else if (gameState === 'START' || gameState === 'GAMEOVER') {
            draw(); // Keep drawing for background
        }
        
        requestAnimationFrame(loop);
    }

    function startGame() {
        audio.init();
        audio.playSfx('sfx_ui', 0);
        audio.playBgm();
        
        // Load SFX
        audio.loadSound('sfx_catch', 'sfx_catch', 'coin');
        audio.loadSound('sfx_wall', 'sfx_wall', 'hit');
        audio.loadSound('sfx_fail', 'sfx_fail', 'hit');
        audio.loadSound('sfx_ui', 'sfx_ui', 'ui');

        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        showBanner('Rescue vector locked', 'neutral', 1200);
        initGame();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        audio.playSfx('sfx_fail', 0);
        audio.stopBgm();
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalScoreEl.innerText = score;
        pulseGif(dangerGif, 'danger', 1600);
        showBanner('Pod lost', 'danger', 1600);
        
        // Blood particles at bottom
        spawnParticles(head.x, window.innerHeight - 10, '#ff0055', 30, 10);
    }

    // Event Listeners
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Initial Start
    requestAnimationFrame(loop);
});
</script>
