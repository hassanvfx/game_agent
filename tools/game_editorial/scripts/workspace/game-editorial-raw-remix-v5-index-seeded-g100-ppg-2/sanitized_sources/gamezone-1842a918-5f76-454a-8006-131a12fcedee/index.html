<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Trial Sprint</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #050816;
            --bg-mid: #0b1738;
            --bg-bottom: #1d2f69;
            --panel: rgba(10, 18, 42, 0.76);
            --panel-strong: rgba(9, 15, 34, 0.92);
            --panel-border: rgba(134, 230, 255, 0.32);
            --text-main: #f4fbff;
            --text-dim: #9ec8e8;
            --accent-cyan: #7be7ff;
            --accent-gold: #ffd36a;
            --accent-pink: #ff6fae;
            --shadow-deep: rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(123, 231, 255, 0.2), transparent 28%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .font-display {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .font-ui {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .neon-text {
            text-shadow:
                0 0 10px currentColor,
                0 0 22px rgba(255, 255, 255, 0.2);
        }

        .sr-overlay {
            position: absolute;
            inset: 0;
        }

        .hidden {
            display: none !important;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 15%, rgba(255, 255, 255, 0.08), transparent 26%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 40%);
        }

        .game-shell::before,
        .game-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-shell::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(123, 231, 255, 0.18) 0, transparent 8%),
                radial-gradient(circle at 80% 26%, rgba(255, 211, 106, 0.16) 0, transparent 7%),
                radial-gradient(circle at 68% 72%, rgba(255, 111, 174, 0.14) 0, transparent 6%);
            opacity: 0.95;
        }

        .game-shell::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 14%, transparent 86%, rgba(255, 255, 255, 0.04)),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 120px);
            mix-blend-mode: screen;
            opacity: 0.55;
        }

        .zone-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 40;
            padding: 24px;
        }

        .zone-title {
            margin: 0;
            font-size: clamp(2.2rem, 9vw, 5rem);
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            transform: skew(-8deg);
            line-height: 0.96;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled without changing grouping */
        .hud-card {
            min-width: 0;
            padding: 10px 12px 11px;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(14, 24, 56, 0.96), rgba(7, 14, 31, 0.86));
            box-shadow:
                0 10px 24px var(--shadow-deep),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 18px rgba(123, 231, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        .hud-card.right {
            text-align: right;
        }

        .hud-label {
            margin: 0 0 6px;
            font-size: 0.66rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .hud-value {
            margin: 0;
            font-size: clamp(1rem, 4.8vw, 1.8rem);
            line-height: 1;
            color: var(--text-main);
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            pointer-events: auto;
            background:
                radial-gradient(circle at 50% 24%, rgba(123, 231, 255, 0.2), transparent 22%),
                linear-gradient(180deg, rgba(4, 9, 24, 0.76), rgba(4, 10, 24, 0.88));
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(123, 231, 255, 0.16);
            border-radius: 24px;
            pointer-events: none;
            box-shadow: inset 0 0 24px rgba(123, 231, 255, 0.06);
        }

        .screen-content {
            position: relative;
            width: min(100%, 420px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            padding: 22px 18px 18px;
            border-radius: 22px;
            background:
                linear-gradient(180deg, rgba(13, 22, 51, 0.9), rgba(8, 14, 31, 0.9));
            border: 1px solid rgba(134, 230, 255, 0.28);
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.38),
                0 0 28px rgba(123, 231, 255, 0.12);
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: clamp(84px, 20vw, 118px);
            aspect-ratio: 1;
            border-radius: 18px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.34),
                0 0 20px rgba(123, 231, 255, 0.16);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 55;
        }

        .feedback-gif.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 12px;
            right: auto;
            border-color: rgba(255, 111, 174, 0.42);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.34),
                0 0 20px rgba(255, 111, 174, 0.22);
        }

        .mascot-badge {
            width: 82px;
            height: 82px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(180deg, rgba(123, 231, 255, 0.26), rgba(255, 111, 174, 0.18)),
                rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                inset 0 0 18px rgba(255, 255, 255, 0.08),
                0 0 26px rgba(123, 231, 255, 0.16);
            font-size: 2.6rem;
            animation: mascot-float 2.2s ease-in-out infinite;
        }

        .title {
            margin: 0;
            font-size: clamp(1.8rem, 9vw, 4rem);
            line-height: 0.95;
            color: var(--text-main);
        }

        .subtitle {
            margin: 0;
            font-size: clamp(0.72rem, 3.2vw, 1rem);
            color: var(--text-dim);
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .status-line {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: #d9f6ff;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(123, 231, 255, 0.18);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .action-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(123, 231, 255, 0.95), rgba(76, 181, 255, 0.88));
            color: #05101c;
            padding: 14px 22px;
            width: min(100%, 300px);
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            line-height: 1.1;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: auto;
            box-shadow:
                0 12px 20px rgba(0, 0, 0, 0.28),
                0 0 18px rgba(123, 231, 255, 0.25);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-1px) scale(1.015);
            filter: brightness(1.04);
            box-shadow:
                0 16px 26px rgba(0, 0, 0, 0.34),
                0 0 24px rgba(123, 231, 255, 0.34);
            outline: none;
        }

        .action-btn:active,
        .action-btn.is-pressed {
            transform: scale(0.98);
        }

        .action-btn.danger {
            background:
                linear-gradient(180deg, rgba(255, 111, 174, 0.95), rgba(255, 88, 121, 0.9));
            color: #fff6fb;
            box-shadow:
                0 12px 20px rgba(0, 0, 0, 0.28),
                0 0 18px rgba(255, 111, 174, 0.28);
        }

        .final-score-line,
        .final-zone-line {
            margin: 0;
            line-height: 1.35;
            text-transform: uppercase;
        }

        .final-score-line {
            font-size: clamp(0.86rem, 4vw, 1.08rem);
            color: var(--text-main);
        }

        .final-zone-line {
            font-size: clamp(0.72rem, 3.6vw, 0.96rem);
            color: var(--text-dim);
        }

        @keyframes zone-enter {
            0% { transform: scale(3) skew(-8deg); opacity: 0; }
            50% { transform: scale(1) skew(-8deg); opacity: 1; }
            80% { transform: scale(1) skew(-8deg); opacity: 1; }
            100% { transform: scale(1.45) skew(-8deg); opacity: 0; }
        }

        .zone-anim {
            animation: zone-enter 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes mascot-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @media (max-width: 640px) {
            .ui-layer {
                padding: 12px;
            }

            .hud {
                gap: 8px;
            }

            .hud-card {
                padding: 8px 10px 9px;
                border-radius: 14px;
            }

            .hud-label {
                font-size: 0.58rem;
                margin-bottom: 5px;
            }

            .screen {
                padding: 14px;
            }

            .screen-content {
                width: min(100%, 360px);
                padding: 18px 14px 16px;
                gap: 10px;
            }

            .mascot-badge {
                width: 70px;
                height: 70px;
                font-size: 2.2rem;
                border-radius: 20px;
            }

            .action-btn {
                width: 100%;
                padding: 13px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Config -->
    <script id="game-config" type="application/x-game-config">
    {
        "heroSpeed": { "type": "number", "label": "Hero Move Speed", "value": 300, "min": 100, "max": 600 },
        "jumpForce": { "type": "number", "label": "Jump Force", "value": 650, "min": 400, "max": 1000 },
        "gravity": { "type": "number", "label": "Gravity", "value": 1800, "min": 500, "max": 3000 },
        "themeColor": { "type": "color", "label": "Hero Color", "value": "#7be7ff" }
    }
    </script>

    <!-- Assets -->
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/jump/land/zone/fail -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM High Energy" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_zone" data-editable="audio" data-label="Zone Clear SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
    <audio id="sfx_die" data-editable="audio" data-label="Death SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
    <audio id="sfx_jump" data-editable="audio" data-label="Jump SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
    <audio id="sfx_land" data-editable="audio" data-label="Landing SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI Start SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

    <!-- Game Container -->
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: jump/fail feedback -> catalogs/gifs.json -->
        <img id="jump-gif" class="feedback-gif" src="https://i.giphy.com/dVthC95ZSGB1OUzUFH.webp" alt="Jump feedback animation">
        <img id="fail-gif" class="feedback-gif fail" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail feedback animation">

        <!-- Zone Indicator Overlay -->
        <div id="zone-overlay" class="zone-overlay hidden">
            <h1 id="zone-text" class="zone-title font-display neon-text">LOW SKY</h1>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="ui-layer">
            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <div class="hud-card">
                    <p class="hud-label font-display">Altitude</p>
                    <p id="score-display" class="hud-value font-display">0m</p>
                </div>
                <div class="hud-card right">
                    <p class="hud-label font-display">Airspace</p>
                    <p id="current-zone-display" class="hud-value font-display">LOW SKY</p>
                </div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="screen">
                <div class="screen-content">
                    <div class="mascot-badge" aria-hidden="true">🛩️</div>
                    <h1 class="title font-display neon-text">Sky<br>Trial</h1>
                    <p class="subtitle font-ui">Pilot the neon runner through rising air lanes. Tap or press space to leap.</p>
                    <div class="status-line font-ui"><span class="status-dot"></span> Thrusters primed for ascent</div>
                    <!-- [agent-note][stage1] role: future-audio | trigger: zone-clear | intent: emphasize each airspace promotion -->
                    <button id="start-btn" class="action-btn font-display">Start Run</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="screen hidden">
                <div class="screen-content">
                    <div class="mascot-badge" aria-hidden="true">💥</div>
                    <h2 class="title font-display" style="color: var(--accent-pink);">Missed</h2>
                    <p class="final-score-line font-ui">Best Altitude: <span id="final-score" style="color: var(--accent-gold);">0m</span></p>
                    <p class="final-zone-line font-ui">Last Airspace: <span id="final-zone">LOW SKY</span></p>
                    <button id="restart-btn" class="action-btn danger font-display">Run Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 0. Config & Init ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let gameConfig = {
            heroSpeed: 300,
            jumpForce: 650,
            gravity: 1800,
            themeColor: "#7be7ff"
        };

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        [startBtn, restartBtn].forEach((button) => {
            if (!button) return;
            button.addEventListener('pointerdown', () => {
                button.classList.add('is-pressed');
                if (button.id === 'start-btn' || button.id === 'restart-btn') {
                    unlockAudio();
                    playSfx('ui');
                }
            });
            button.addEventListener('pointerup', () => button.classList.remove('is-pressed'));
            button.addEventListener('pointerleave', () => button.classList.remove('is-pressed'));
        });

        // Parse Config
        try {
            const configEl = document.getElementById('game-config');
            if (configEl) {
                const parsed = JSON.parse(configEl.textContent);
                window.gameConfigDefs = parsed;
                for (const key in parsed) {
                    gameConfig[key] = parsed[key].value;
                }
            }
        } catch(e) { console.error("Config parse error", e); }

        window.updateGameConfig = (key, val) => {
            if (gameConfig.hasOwnProperty(key)) {
                gameConfig[key] = val;
                if (key === 'themeColor') hero.color = val;
            }
        };

        // --- 1. Audio + Feedback System ---
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
        const sounds = {
            bgm: document.getElementById('bgm_main'),
            zone: document.getElementById('sfx_zone'),
            die: document.getElementById('sfx_die'),
            jump: document.getElementById('sfx_jump'),
            land: document.getElementById('sfx_land'),
            ui: document.getElementById('sfx_ui')
        };
        const jumpGif = document.getElementById('jump-gif');
        const failGif = document.getElementById('fail-gif');

        let isMuted = false;
        let audioUnlocked = false;
        let lastLandAt = 0;
        let landWasGrounded = false;
        let feedbackTimers = [];

        Object.entries(sounds).forEach(([id, el]) => {
            if (!el) return;
            if (id === 'bgm') {
                el.volume = 0.2;
            } else if (id === 'ui') {
                el.volume = 0.42;
            } else if (id === 'die') {
                el.volume = 0.5;
            } else {
                el.volume = 0.38;
            }
        });

        const clearFeedbackTimers = () => {
            feedbackTimers.forEach((timer) => clearTimeout(timer));
            feedbackTimers = [];
        };

        const showFeedbackGif = (el, duration = 900) => {
            if (!el) return;
            clearFeedbackTimers();
            el.classList.add('visible');
            feedbackTimers.push(setTimeout(() => {
                el.classList.remove('visible');
            }, duration));
        };

        const syncLoopState = () => {
            if (!sounds.bgm) return;
            if (!audioUnlocked || isMuted || gameState !== 'PLAYING') {
                sounds.bgm.pause();
                sounds.bgm.currentTime = sounds.bgm.currentTime || 0;
                return;
            }
            sounds.bgm.play().catch(() => {});
        };

        const unlockAudio = () => {
            if (audioUnlocked) {
                syncLoopState();
                return;
            }
            if (!audioCtx) {
                audioUnlocked = true;
                syncLoopState();
                return;
            }
            audioCtx.resume().then(() => {
                audioUnlocked = true;
                syncLoopState();
            }).catch(() => {
                audioUnlocked = true;
            });
        };

        const playSfx = (id) => {
            if (!audioUnlocked || isMuted) return;
            const el = sounds[id];
            if (el) {
                el.pause();
                el.currentTime = 0;
                el.play().catch(() => playSynthFallback(id));
            } else {
                playSynthFallback(id);
            }
        };

        const playSynthFallback = (type) => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'die' || type === 'zone') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(type === 'zone' ? 320 : 150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(type === 'zone' ? 520 : 50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'land' || type === 'ui') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(type === 'ui' ? 460 : 220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(type === 'ui' ? 560 : 120, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            }
        };

        // --- 2. Game State & Logic ---
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let lastTime = 0;
        let score = 0;
        let cameraY = 0;
        let particles = [];
        let platforms = [];
        let shake = 0;
        let skyStreaks = [];
        let starDrift = [];
        let zonePulse = 0;

        // Difficulty Zones
        const ZONES = [
            { name: "LOW SKY", h: 0, color: "#64f1a7", platW: 100, gap: 140, move: false, accent: "#99fff1" },
            { name: "JET STREAM", h: 500, color: "#ffd85a", platW: 80, gap: 160, move: false, accent: "#fff7bf" },
            { name: "STORM EDGE", h: 1500, color: "#ff9b4f", platW: 70, gap: 180, move: true, moveSpeed: 50, accent: "#ffd0a7" },
            { name: "NIGHT VOID", h: 3000, color: "#ff5b8e", platW: 60, gap: 200, move: true, moveSpeed: 100, accent: "#ffb5d1" },
            { name: "STAR FIELD", h: 5000, color: "#bc7eff", platW: 50, gap: 220, move: true, moveSpeed: 180, accent: "#ead5ff" },
            { name: "SOLAR GATE", h: 8000, color: "#f7fbff", platW: 40, gap: 250, move: true, moveSpeed: 300, accent: "#fff5aa" }
        ];
        let currentZoneIdx = 0;

        const hero = {
            x: 0, y: 0, w: 24, h: 24,
            vx: 0, vy: 0,
            color: gameConfig.themeColor,
            grounded: false
        };

        function createSkyDecor() {
            skyStreaks = Array.from({ length: 9 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                len: 50 + Math.random() * 90,
                speed: 18 + Math.random() * 28,
                alpha: 0.06 + Math.random() * 0.08
            }));

            starDrift = Array.from({ length: 18 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: 1 + Math.random() * 2.2,
                speed: 10 + Math.random() * 18,
                alpha: 0.2 + Math.random() * 0.35
            }));
        }

        // Input
        const handleInput = (e) => {
            if (e.type !== 'keydown') e.preventDefault();
            unlockAudio();

            if (gameState === 'PLAYING' && hero.grounded) {
                hero.vy = -gameConfig.jumpForce;
                hero.grounded = false;
                spawnParticles(hero.x + hero.w / 2, hero.y + hero.h, 10, '#ffffff');
                playSfx('jump');
                showFeedbackGif(jumpGif, 720);
            }
        };

        // [agent-note][stage4] repaired: mobile-action-path | element: start/restart + canvas | action: keep UI taps native and scope gameplay input to canvas
        startBtn?.addEventListener('click', () => {
            unlockAudio();
            startGame();
        });

        restartBtn?.addEventListener('click', () => {
            unlockAudio();
            resetGame();
            startGame();
        });

        canvas.addEventListener('pointerdown', handleInput, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameState === 'START') {
                    unlockAudio();
                    startGame();
                    return;
                }
                if (gameState === 'GAMEOVER') {
                    unlockAudio();
                    resetGame();
                    startGame();
                    return;
                }
                handleInput(e);
            }
        });

        // --- 3. Core Mechanics ---
        function startGame() {
            gameState = 'PLAYING';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            resetGame();
            syncLoopState();
        }

        function resetGame() {
            hero.x = canvas.width / 2;
            hero.y = canvas.height - 100;
            hero.vx = gameConfig.heroSpeed;
            hero.vy = 0;
            cameraY = 0;
            score = 0;
            currentZoneIdx = 0;
            platforms = [];
            particles = [];
            zonePulse = 0;

            // Initial Platform
            platforms.push({ x: 0, y: canvas.height - 20, w: canvas.width, h: 40, type: 'static' });
            generatePlatforms(-100);

            updateZoneDisplay();
            landWasGrounded = false;
            clearFeedbackTimers();
            [jumpGif, failGif].forEach((img) => img && img.classList.remove('visible'));
        }

        function getZone() {
            const height = -y + canvas.height; // Approximate height
            for (let i = ZONES.length - 1; i >= 0; i--) {
                if (score >= ZONES[i].h) return i;
            }
            return 0;
        }

        function updateZoneDisplay() {
            const zone = ZONES[currentZoneIdx];
            const display = document.getElementById('current-zone-display');
            display.innerText = zone.name;
            display.style.color = zone.color;
        }

        function showZonePopup(name, color) {
            const overlay = document.getElementById('zone-overlay');
            const text = document.getElementById('zone-text');
            text.innerText = name;
            text.style.color = color;
            overlay.classList.remove('hidden');
            text.classList.remove('zone-anim');
            void text.offsetWidth;
            text.classList.add('zone-anim');
            zonePulse = 1;
            playSfx('zone');
        }

        function generatePlatforms(startY) {
            const zone = ZONES[currentZoneIdx];
            let y = startY;
            while (y > cameraY - canvas.height) {
                y -= zone.gap;

                const w = zone.platW;
                const x = Math.random() * (canvas.width - w);

                platforms.push({
                    x: x,
                    y: y,
                    w: w,
                    h: 15,
                    vx: zone.move ? (Math.random() > 0.5 ? zone.moveSpeed : -zone.moveSpeed) : 0,
                    type: 'normal',
                    passed: false
                });
            }
        }

        function spawnParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 300,
                    vy: (Math.random() - 0.5) * 300,
                    life: 1.0,
                    color: color
                });
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            shake = 20;
            playSfx('die');
            spawnParticles(hero.x, hero.y, 50, gameConfig.themeColor);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = Math.floor(score) + "m";
            document.getElementById('final-zone').innerText = ZONES[currentZoneIdx].name;
            document.getElementById('final-zone').style.color = ZONES[currentZoneIdx].color;
            syncLoopState();
            showFeedbackGif(failGif, 1500);
        }

        // --- 4. Game Loop ---
        function update(dt) {
            if (gameState !== 'PLAYING') return;

            hero.vy += gameConfig.gravity * dt;
            hero.x += hero.vx * dt;
            hero.y += hero.vy * dt;

            if (hero.x <= 0) {
                hero.x = 0;
                hero.vx = Math.abs(gameConfig.heroSpeed);
            } else if (hero.x + hero.w >= canvas.width) {
                hero.x = canvas.width - hero.w;
                hero.vx = -Math.abs(gameConfig.heroSpeed);
            }

            const wasGrounded = hero.grounded;
            hero.grounded = false;
            let highestPlatY = Infinity;

            platforms = platforms.filter(p => p.y < cameraY + canvas.height + 100);

            platforms.forEach(p => {
                if (p.vx !== 0) {
                    p.x += p.vx * dt;
                    if (p.x <= 0 || p.x + p.w >= canvas.width) p.vx *= -1;
                }

                if (hero.vy > 0 &&
                    hero.y + hero.h >= p.y &&
                    hero.y + hero.h <= p.y + p.h + 20 &&
                    hero.y + hero.h - hero.vy * dt <= p.y + 10 &&
                    hero.x + hero.w > p.x &&
                    hero.x < p.x + p.w) {
                        hero.y = p.y - hero.h;
                        hero.vy = 0;
                        hero.grounded = true;
                }

                if (p.y < highestPlatY) highestPlatY = p.y;
            });

            const targetCamY = hero.y - canvas.height * 0.6;
            if (targetCamY < cameraY) {
                cameraY = targetCamY;
                score = Math.max(score, Math.floor((canvas.height - 100 - hero.y) / 10));

                const newZoneIdx = getZone();
                if (newZoneIdx > currentZoneIdx) {
                    currentZoneIdx = newZoneIdx;
                    updateZoneDisplay();
                    showZonePopup(ZONES[currentZoneIdx].name, ZONES[currentZoneIdx].color);
                    const dir = Math.sign(hero.vx);
                    gameConfig.heroSpeed += 20;
                    hero.vx = dir * gameConfig.heroSpeed;
                }

                if (platforms.length < 20) {
                    generatePlatforms(highestPlatY);
                }
            }

            if (hero.y > cameraY + canvas.height) {
                gameOver();
            }

            if (!wasGrounded && hero.grounded) {
                const now = performance.now();
                if (now - lastLandAt > 140) {
                    lastLandAt = now;
                    playSfx('land');
                }
            }
            landWasGrounded = hero.grounded;

            particles.forEach(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2;
            });
            particles = particles.filter(p => p.life > 0);

            skyStreaks.forEach((s) => {
                s.y += s.speed * dt;
                if (s.y > canvas.height + 40) {
                    s.y = -40;
                    s.x = Math.random() * canvas.width;
                }
            });

            starDrift.forEach((s) => {
                s.y += s.speed * dt;
                if (s.y > canvas.height + 20) {
                    s.y = -20;
                    s.x = Math.random() * canvas.width;
                }
            });

            zonePulse = Math.max(0, zonePulse - dt * 1.5);

            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;

            document.getElementById('score-display').innerText = Math.floor(score) + "m";
        }

        function drawSkyBackdrop() {
            const zone = ZONES[currentZoneIdx];
            const verticalGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            verticalGrad.addColorStop(0, '#040816');
            verticalGrad.addColorStop(0.5, '#0b1738');
            verticalGrad.addColorStop(1, '#152a55');
            ctx.fillStyle = verticalGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const glow = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.1, 0, canvas.width * 0.5, canvas.height * 0.1, canvas.width * 0.55);
            glow.addColorStop(0, `${zone.color}22`);
            glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            skyStreaks.forEach((streak, idx) => {
                ctx.strokeStyle = `rgba(255,255,255,${streak.alpha})`;
                ctx.lineWidth = idx % 3 === 0 ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(streak.x, streak.y);
                ctx.lineTo(streak.x + streak.len * 0.2, streak.y + streak.len);
                ctx.stroke();
            });

            starDrift.forEach((star) => {
                ctx.globalAlpha = star.alpha + zonePulse * 0.15;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawCloudBands() {
            const zone = ZONES[currentZoneIdx];
            for (let i = 0; i < 5; i++) {
                const y = (cameraY * 0.12 + i * 120) % (canvas.height + 120) - 60;
                const band = ctx.createLinearGradient(0, y, canvas.width, y + 60);
                band.addColorStop(0, 'rgba(255,255,255,0)');
                band.addColorStop(0.45, `${zone.accent}1a`);
                band.addColorStop(0.55, `${zone.color}12`);
                band.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = band;
                ctx.fillRect(0, y, canvas.width, 54);
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(154, 199, 255, 0.11)';
            ctx.lineWidth = 1;
            const gridSize = 100;
            const startGridY = Math.floor(cameraY / gridSize) * gridSize;
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, startGridY);
                ctx.lineTo(x, startGridY + canvas.height + gridSize);
            }
            for (let y = startGridY; y < startGridY + canvas.height + gridSize; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawPlatforms() {
            const zone = ZONES[currentZoneIdx];
            platforms.forEach(p => {
                const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                grad.addColorStop(0, zone.accent);
                grad.addColorStop(1, zone.color);
                ctx.shadowBlur = 14;
                ctx.shadowColor = zone.color;
                ctx.fillStyle = grad;
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.82)';
                ctx.fillRect(p.x + 3, p.y + 3, p.w - 6, Math.max(3, p.h - 7));

                ctx.fillStyle = 'rgba(6,12,26,0.55)';
                ctx.fillRect(p.x + 8, p.y + p.h - 4, Math.max(8, p.w - 16), 2);
            });
        }

        function drawHero() {
            if (gameState !== 'PLAYING' && gameState !== 'START') return;

            const zone = ZONES[currentZoneIdx];
            const bob = Math.sin(performance.now() / 140) * 1.2;
            const x = hero.x;
            const y = hero.y + bob;

            ctx.save();
            ctx.shadowBlur = 24;
            ctx.shadowColor = hero.color;
            ctx.fillStyle = hero.color;
            ctx.beginPath();
            ctx.roundRect(x, y, hero.w, hero.h, 8);
            ctx.fill();

            ctx.fillStyle = zone.accent;
            ctx.beginPath();
            ctx.roundRect(x + 4, y + 4, hero.w - 8, hero.h - 8, 6);
            ctx.fill();

            ctx.fillStyle = '#0a1530';
            const eyeY = y + 7;
            const eyeOffset = hero.vx > 0 ? 13 : 5;
            ctx.fillRect(x + eyeOffset, eyeY, 3, 4);
            ctx.fillRect(x + eyeOffset + 5, eyeY, 3, 4);

            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.75;
            ctx.fillRect(x + 6, y + 5, hero.w - 12, 2);
            ctx.globalAlpha = 1;

            ctx.strokeStyle = zone.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + hero.w * 0.5, y + hero.h + 1);
            ctx.lineTo(x + hero.w * 0.5, y + hero.h + 7 + Math.max(0, hero.vy * 0.008));
            ctx.stroke();
            ctx.restore();
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function draw() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            drawSkyBackdrop();

            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;
            ctx.translate(dx, dy);

            drawCloudBands();

            ctx.translate(0, -cameraY);
            drawGrid();
            drawPlatforms();
            drawHero();
            drawParticles();
        }

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(loop);
        }

        // --- 5. Resize & Start ---
        function resize() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            createSkyDecor();
            if (gameState === 'START') {
                hero.x = canvas.width / 2;
                hero.y = canvas.height - 100;
            }
        }

        window.addEventListener('resize', resize);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                sounds.bgm?.pause();
            } else {
                syncLoopState();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            resize();
            resetGame();
            gameState = 'START';
            syncLoopState();
            requestAnimationFrame(loop);
        });
    </script>
</body>
