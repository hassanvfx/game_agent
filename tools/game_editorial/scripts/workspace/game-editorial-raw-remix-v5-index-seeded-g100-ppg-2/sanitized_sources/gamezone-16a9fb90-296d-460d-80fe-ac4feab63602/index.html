<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Sweep</title>
    <!-- [agent-note][stage4] remapped-fonts: Audiowide for sci-fi display, Rajdhani for HUD/UI readability via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07121f;
            --bg-deep: #030912;
            --grid: rgba(92, 242, 255, 0.14);
            --panel: rgba(7, 19, 34, 0.78);
            --panel-border: rgba(114, 248, 255, 0.72);
            --text: #e8fbff;
            --text-dim: #9fd4df;
            --accent: #59f1ff;
            --accent-strong: #8dff8c;
            --warning: #ff765f;
            --danger: #ff355e;
            --hero-core: #68f6ff;
            --hero-shell: #163550;
            --signal-glow: rgba(141, 255, 140, 0.85);
            --jammer-glow: rgba(255, 53, 94, 0.85);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(82, 221, 255, 0.1), transparent 40%),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            font-family: 'Rajdhani', Arial, sans-serif;
        }

        body {
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(14, 32, 54, 0.95), rgba(4, 13, 24, 0.95));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 0 24px rgba(89, 241, 255, 0.18),
                0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .hidden { display: none !important; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 20%, rgba(89, 241, 255, 0.14), transparent 34%),
                radial-gradient(circle at 50% 80%, rgba(141, 255, 140, 0.08), transparent 30%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, transparent 0 8%, rgba(89, 241, 255, 0.06) 10%, transparent 12% 88%, rgba(89, 241, 255, 0.06) 90%, transparent 92%),
                linear-gradient(180deg, rgba(255,255,255,0.05), transparent 18%, transparent 82%, rgba(89, 241, 255, 0.05));
            opacity: 0.55;
        }

        #game-container::after {
            background:
                radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.4) 100%);
        }

        #gameCanvas { width: 100%; height: 100%; }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.9rem;
            pointer-events: none;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .hud-stack {
            display: flex;
            flex-direction: column;
            gap: 0.28rem;
            max-width: min(24rem, 82vw);
            padding: 0.7rem 0.9rem;
            border-radius: 1rem;
            background: var(--panel);
            border: 1px solid rgba(114, 248, 255, 0.42);
            box-shadow:
                0 0 18px rgba(89, 241, 255, 0.12),
                inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        .hud-primary,
        .panel-title,
        #restart-btn {
            font-family: 'Audiowide', 'Rajdhani', Arial, sans-serif;
        }

        .hud-primary {
            font-size: clamp(1.45rem, 4vw, 2rem);
            font-weight: 400;
            color: var(--text);
        }

        .hud-secondary {
            font-size: clamp(0.92rem, 2.3vw, 1.15rem);
            font-weight: 600;
            color: var(--accent-strong);
            letter-spacing: 0.08em;
        }

        .hud-instructions {
            font-size: clamp(0.78rem, 1.9vw, 0.92rem);
            line-height: 1.28;
            color: var(--text-dim);
            max-width: 30ch;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(1, 8, 16, 0.72);
            z-index: 50;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 45;
        }

        .feedback-gif {
            position: absolute;
            right: 0.85rem;
            width: min(28vw, 130px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(114, 248, 255, 0.45);
            box-shadow: 0 0 22px rgba(89, 241, 255, 0.18);
            opacity: 0;
            transform: scale(0.9) translateY(10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            background: rgba(4, 13, 24, 0.72);
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        #collect-gif {
            top: 5.9rem;
        }

        #danger-gif {
            bottom: 1rem;
        }

        #game-over-panel {
            pointer-events: auto;
            padding: 1.5rem;
            text-align: center;
            max-width: 22rem;
            width: calc(100% - 2rem);
            margin: 0 1rem;
            border-radius: 1.2rem;
        }

        .panel-title {
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 400;
            margin: 0 0 0.55rem;
            color: var(--warning);
            text-shadow: 0 0 16px rgba(255, 118, 95, 0.35);
        }

        .panel-subtitle {
            font-size: clamp(0.98rem, 3vw, 1.35rem);
            color: var(--text-dim);
            margin: 0 0 1.2rem;
        }

        .panel-score {
            font-size: clamp(1.45rem, 4.5vw, 2.15rem);
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 1.4rem;
            letter-spacing: 0.06em;
        }

        #restart-btn {
            width: 100%;
            background: linear-gradient(180deg, #173c5c, #0d2437);
            color: var(--text);
            font-size: clamp(1.05rem, 3.5vw, 1.45rem);
            padding: 0.85rem 1rem;
            border: 1px solid rgba(114, 248, 255, 0.72);
            border-radius: 0.95rem;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            letter-spacing: 0.08em;
            box-shadow: 0 0 18px rgba(89, 241, 255, 0.18);
        }

        #restart-btn:hover { filter: brightness(1.08); }
        #restart-btn:active {
            transform: scale(0.97);
            box-shadow: 0 0 10px rgba(89, 241, 255, 0.22);
        }

        .hud-text {
            text-shadow:
                0 0 8px rgba(89, 241, 255, 0.22),
                0 1px 1px rgba(0, 0, 0, 0.55);
            letter-spacing: 0.05em;
        }

        @media (max-width: 520px) {
            #ui-layer { padding: 0.75rem; }
            .hud-stack {
                padding: 0.62rem 0.75rem;
                max-width: min(21rem, 86vw);
            }
            .hud-instructions { max-width: 28ch; }
            #game-over-panel { padding: 1.25rem; }
            .feedback-gif {
                width: min(25vw, 92px);
                right: 0.65rem;
            }
            #collect-gif {
                top: 6.4rem;
            }
            #danger-gif {
                bottom: 0.8rem;
            }
        }
    </style>
</head>
<body>

<!-- Asset Declaration -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: gameplay loop + collect/damage/warning/ui from catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_damage" data-editable="audio" data-label="Damage SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto"></audio>
    <audio id="sfx_warning" data-editable="audio" data-label="Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
    <audio id="sfx_restart" data-editable="audio" data-label="UI Restart SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Sweep Speed", "value": 8, "min": 5, "max": 15 },
    "spawnRate": { "type": "number", "label": "Signal Drift", "value": 1.5, "min": 0.5, "max": 3.0 },
    "themeColor": { "type": "color", "label": "Beacon Color", "value": "#59F1FF" }
}
</script>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="feedback-layer" aria-hidden="true">
        <!-- [agent-note][stage3] resolved-gif: collect/damage feedback overlays from catalogs/gifs.json; keep compact off-playfield -->
        <img id="collect-gif" class="feedback-gif" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="">
        <img id="danger-gif" class="feedback-gif" src="https://i.giphy.com/EfyAtT6OjDO4iUr8KU.webp" alt="">
    </div>

    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud">
            <div class="hud-stack">
                <span class="hud-primary hud-text">SIGNALS: <span id="score-display">0</span></span>
                <span class="hud-secondary hud-text">SHIELD: <span id="hp-display">100%</span></span>
                <span class="hud-instructions hud-text">Guide the pulse drone through the scan grid. Gather bright signal wisps and dodge crimson jammers.</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden">
            <div id="game-over-panel" class="glass">
                <h1 class="panel-title">LINK LOST</h1>
                <p class="panel-subtitle">The jammer swarm overwhelmed your relay field.</p>
                <div class="panel-score">TOTAL SIGNALS: <span id="final-score">0</span></div>
                <button id="restart-btn">
                    RESTART SWEEP
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * Preserve gameplay logic; stage 2 applies visual identity only.
 */

// --- Global State & Config ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let ro;
let initialized = false;
let rafId = null;
let lastTime = 0;

// Logical Dimensions (CSS Pixels)
let cw = 0;
let ch = 0;
let dpr = 1;

// Game State
const STATE = { PLAYING: 'PLAYING', GAMEOVER: 'GAMEOVER' };
let gameState = STATE.PLAYING;
let score = 0;
let hp = 100;
let gameTime = 0;

// Input State
const input = { x: 0, y: 0, active: false };

// Configuration
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
};

// --- Audio System (Web Audio API) ---
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const audioBuffers = {};
const audioCooldowns = { collect: 0, damage: 0, warning: 0, restart: 0, gameover: 0 };
const bgmEl = document.getElementById('bgm_main');
const gifTimers = {};
let audioReady = false;
let warningArmed = true;

async function initAudio() {
    if (!audioCtx || audioReady) return;
    audioReady = true;

    const loadBuffer = async (id, elId) => {
        const el = document.getElementById(elId);
        if (!el || !el.src) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed:', id);
        }
    };

    await Promise.all([
        loadBuffer('collect', 'sfx_collect'),
        loadBuffer('damage', 'sfx_damage'),
        loadBuffer('warning', 'sfx_warning'),
        loadBuffer('restart', 'sfx_restart')
    ]);

    if (bgmEl) {
        bgmEl.volume = 0.2;
    }
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    if (bgmEl && bgmEl.paused) {
        bgmEl.play().catch(() => {});
    }
}

function syncAudioState() {
    if (!bgmEl) return;
    if (gameState === STATE.PLAYING) {
        if (!bgmEl.paused) return;
        bgmEl.play().catch(() => {});
    } else if (!bgmEl.paused) {
        bgmEl.pause();
    }
}

function playFallbackTone(id) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (id === 'collect' || id === 'restart') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(id === 'restart' ? 580 : 800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(id === 'restart' ? 840 : 1260, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } else if (id === 'warning') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(460, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(310, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function playSfx(id, cooldown = 0) {
    const now = performance.now();
    if (cooldown && now - (audioCooldowns[id] || 0) < cooldown) return;
    audioCooldowns[id] = now;

    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }

    if (audioBuffers[id] && audioCtx) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = audioBuffers[id];
        gain.gain.value = id === 'warning' ? 0.45 : id === 'restart' ? 0.4 : 0.55;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } else {
        playFallbackTone(id);
    }
}

function showGif(id, duration = 900) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('is-visible');
    if (gifTimers[id]) clearTimeout(gifTimers[id]);
    gifTimers[id] = setTimeout(() => {
        el.classList.remove('is-visible');
    }, duration);
}

function vibrate(type) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

function mixColor(hex, mixHex, ratio) {
    const clampRatio = Math.max(0, Math.min(1, ratio));
    const parse = (value) => {
        const normalized = value.replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        return [
            parseInt(full.slice(0, 2), 16),
            parseInt(full.slice(2, 4), 16),
            parseInt(full.slice(4, 6), 16)
        ];
    };
    const [r1, g1, b1] = parse(hex);
    const [r2, g2, b2] = parse(mixHex);
    const toHex = (v) => Math.round(v).toString(16).padStart(2, '0');
    return `#${toHex(r1 + (r2 - r1) * clampRatio)}${toHex(g1 + (g2 - g1) * clampRatio)}${toHex(b1 + (b2 - b1) * clampRatio)}`;
}

function drawGlow(ctx, x, y, radius, color, alpha = 0.5) {
    const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
    grad.addColorStop(0, color.replace('0.85', String(alpha)));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
}

// --- Entities ---
class Hero {
    constructor() {
        this.r = 25;
        this.reset();
        this.angle = 0;
        this.wobble = 0;
    }

    reset() {
        this.x = cw / 2;
        this.y = ch / 2;
        if (!isFinite(this.x)) this.x = 100;
        if (!isFinite(this.y)) this.y = 100;
    }

    update(dt) {
        if (input.active) {
            const dx = input.x - this.x;
            const dy = input.y - this.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 5) {
                const speed = window.gameConfig.heroSpeed * 60 * dt;
                const moveDist = Math.min(dist, speed);
                const angle = Math.atan2(dy, dx);
                this.x += Math.cos(angle) * moveDist;
                this.y += Math.sin(angle) * moveDist;
                this.angle = angle;
            }
        }

        this.x = Math.max(this.r, Math.min(cw - this.r, this.x));
        this.y = Math.max(this.r, Math.min(ch - this.r, this.y));
        this.wobble += dt * 10;
    }

    draw(ctx) {
        const pulse = Math.sin(this.wobble) * 1.4;
        const shellColor = mixColor(window.gameConfig.themeColor, '#ffffff', 0.18);

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        drawGlow(ctx, 0, 0, this.r + 18 + pulse, 'rgba(89, 241, 255, 0.85)', 0.42);

        ctx.fillStyle = '#0f2238';
        ctx.beginPath();
        ctx.arc(0, 0, this.r + 3, 0, Math.PI * 2);
        ctx.fill();

        const shellGrad = ctx.createRadialGradient(-8, -10, 2, 0, 0, this.r + 4);
        shellGrad.addColorStop(0, mixColor(shellColor, '#ffffff', 0.35));
        shellGrad.addColorStop(0.55, window.gameConfig.themeColor);
        shellGrad.addColorStop(1, '#0f2e46');
        ctx.fillStyle = shellGrad;
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(232, 251, 255, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, this.r - 4, Math.PI * 0.18, Math.PI * 1.82);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(89, 241, 255, 0.75)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-10, -11);
        ctx.lineTo(7, -3);
        ctx.moveTo(-10, 11);
        ctx.lineTo(7, 3);
        ctx.stroke();

        ctx.fillStyle = '#09131f';
        ctx.beginPath();
        ctx.ellipse(-3, 0, 8, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#8dff8c';
        ctx.beginPath();
        ctx.arc(16, 0, 6 + Math.max(0, pulse * 0.15), 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(-8, -9, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.life = 1.0;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 100 + 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 4 + 2;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2;
        this.vx *= 0.95;
        this.vy *= 0.95;
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.type === 'sparkle') {
            ctx.fillStyle = '#8dff8c';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.type === 'debris') {
            ctx.fillStyle = '#ff6a7f';
            ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
        }
        ctx.globalAlpha = 1.0;
    }
}

class Dust {
    constructor() {
        this.active = false;
        this.r = 0;
    }

    spawn() {
        this.r = Math.random() * 8 + 5;
        do {
            this.x = Math.random() * (cw - 40) + 20;
            this.y = Math.random() * (ch - 40) + 20;
        } while (Math.hypot(this.x - hero.x, this.y - hero.y) < 150);

        this.active = true;
        this.vx = (Math.random() - 0.5) * 20;
        this.vy = (Math.random() - 0.5) * 20;
        this.color = Math.random() > 0.75 ? '#c9ffd2' : '#76f7db';
    }

    update(dt) {
        if (!this.active) return;
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        if (this.x < this.r || this.x > cw - this.r) this.vx *= -1;
        if (this.y < this.r || this.y > ch - this.r) this.vy *= -1;
    }

    draw(ctx) {
        if (!this.active) return;

        drawGlow(ctx, this.x, this.y, this.r * 3.2, 'rgba(141, 255, 140, 0.85)', 0.26);

        const grad = ctx.createRadialGradient(this.x - this.r * 0.3, this.y - this.r * 0.4, 1, this.x, this.y, this.r * 1.6);
        grad.addColorStop(0, '#e7fff0');
        grad.addColorStop(0.55, this.color);
        grad.addColorStop(1, '#139faa');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.r);
        ctx.lineTo(this.x + this.r * 0.95, this.y);
        ctx.lineTo(this.x, this.y + this.r);
        ctx.lineTo(this.x - this.r * 0.95, this.y);
        ctx.closePath();
        ctx.fill();
    }
}

class Hazard {
    constructor() {
        this.active = false;
        this.r = 15;
    }

    spawn() {
        this.r = 15 + Math.random() * 10;
        if (Math.random() > 0.5) {
            this.x = Math.random() > 0.5 ? -50 : cw + 50;
            this.y = Math.random() * ch;
        } else {
            this.x = Math.random() * cw;
            this.y = Math.random() > 0.5 ? -50 : ch + 50;
        }

        const angle = Math.atan2(hero.y - this.y, hero.x - this.x);
        const speed = 80 + Math.random() * 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.active = true;
        this.rot = 0;
    }

    update(dt) {
        if (!this.active) return;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rot += dt * 5;

        if (this.x < -100 || this.x > cw + 100 || this.y < -100 || this.y > ch + 100) {
            this.active = false;
        }
    }

    draw(ctx) {
        if (!this.active) return;

        drawGlow(ctx, this.x, this.y, this.r * 2.8, 'rgba(255, 53, 94, 0.85)', 0.22);

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        ctx.fillStyle = '#2d0816';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const outer = this.r + (i % 2 === 0 ? 5 : 0);
            const angle = (Math.PI * 2 * i) / 6;
            ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
            const innerAngle = angle + Math.PI / 6;
            ctx.lineTo(Math.cos(innerAngle) * (this.r * 0.45), Math.sin(innerAngle) * (this.r * 0.45));
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#ff8597';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ff355e';
        ctx.beginPath();
        ctx.arc(0, 0, this.r * 0.32, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// --- Global Variables ---
const hero = new Hero();
const particles = [];
const dusts = Array(50).fill(null).map(() => new Dust());
const hazards = Array(10).fill(null).map(() => new Hazard());
let shake = 0;
let spawnTimer = 0;
let hazardTimer = 0;

// --- Core Logic ---
function initGame() {
    if (initialized) return;

    score = 0;
    hp = 100;
    gameTime = 0;
    shake = 0;
    warningArmed = true;
    hero.reset();
    particles.length = 0;
    dusts.forEach(d => { d.active = false; });
    hazards.forEach(h => { h.active = false; });

    for (let i = 0; i < 10; i++) {
        const d = dusts.find(item => !item.active);
        if (d) d.spawn();
    }

    updateHUD();
    setState(STATE.PLAYING);
    initAudio();

    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
    initialized = true;
}

function restartGame() {
    initGame();
    score = 0;
    hp = 100;
    gameTime = 0;
    shake = 0;
    warningArmed = true;
    hero.reset();
    particles.length = 0;
    dusts.forEach(d => d.active = false);
    hazards.forEach(h => h.active = false);
    for (let i = 0; i < 10; i++) {
        const d = dusts.find(item => !item.active);
        if (d) d.spawn();
    }
    playSfx('restart', 120);
    setState(STATE.PLAYING);
    updateHUD();
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOverScreen = document.getElementById('game-over-screen');

    if (newState === STATE.PLAYING) {
        hud.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
    } else if (newState === STATE.GAMEOVER) {
        document.getElementById('final-score').innerText = score;
        gameOverScreen.classList.remove('hidden');
        playSfx('damage', 300);
        showGif('danger-gif', 1800);
    }

    syncAudioState();
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('hp-display').innerText = Math.ceil(hp) + '%';
}

function spawnLogic(dt) {
    spawnTimer += dt;
    if (spawnTimer > (1.0 / window.gameConfig.spawnRate)) {
        spawnTimer = 0;
        const d = dusts.find(item => !item.active);
        if (d) d.spawn();
    }

    hazardTimer += dt;
    const hazardRate = Math.max(0.5, 3.0 - (score / 500));
    if (hazardTimer > hazardRate) {
        hazardTimer = 0;
        const h = hazards.find(item => !item.active);
        if (h) h.spawn();
    }
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (gameState === STATE.PLAYING) {
            updateGame(dt);
        }
        drawGame();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }

    rafId = requestAnimationFrame(loop);
}

function updateGame(dt) {
    hero.update(dt);
    spawnLogic(dt);

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    dusts.forEach(d => {
        d.update(dt);
        if (d.active) {
            const dx = hero.x - d.x;
            const dy = hero.y - d.y;
            const dist = Math.hypot(dx, dy);

            if (dist < hero.r + 50) {
                d.x += dx * 5 * dt;
                d.y += dy * 5 * dt;
            }

            if (dist < hero.r + d.r) {
                d.active = false;
                score += 10;
                playSfx('collect', 70);
                if (score % 50 === 0) {
                    playSfx('restart', 140);
                }
                showGif('collect-gif', 820);
                vibrate('light');
                updateHUD();
                for (let k = 0; k < 5; k++) particles.push(new Particle(d.x, d.y, 'sparkle'));
            }
        }
    });

    hazards.forEach(h => {
        h.update(dt);
        if (h.active) {
            const dist = Math.hypot(hero.x - h.x, hero.y - h.y);
            if (dist < hero.r + h.r) {
                h.active = false;
                hp -= 20;
                shake = 20;
                playSfx('damage', 180);
                if (hp <= 40 && warningArmed) {
                    playSfx('warning', 800);
                    warningArmed = false;
                }
                showGif('danger-gif', hp <= 0 ? 1800 : 1100);
                vibrate('heavy');
                updateHUD();
                for (let k = 0; k < 10; k++) particles.push(new Particle(h.x, h.y, 'debris'));

                if (hp > 40) {
                    warningArmed = true;
                }

                if (hp <= 0) {
                    setState(STATE.GAMEOVER);
                }
            }
        }
    });

    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;
}

function drawGame() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#06111d';
    ctx.fillRect(0, 0, cw, ch);

    const bgGrad = ctx.createRadialGradient(cw * 0.5, ch * 0.35, 20, cw * 0.5, ch * 0.5, Math.max(cw, ch) * 0.8);
    bgGrad.addColorStop(0, 'rgba(20, 62, 96, 0.9)');
    bgGrad.addColorStop(0.6, 'rgba(7, 18, 31, 0.9)');
    bgGrad.addColorStop(1, 'rgba(2, 7, 15, 1)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = 'rgba(92, 242, 255, 0.12)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const gridSize = 44;
    for (let x = 0; x <= cw; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
    }
    for (let y = 0; y <= ch; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(141, 255, 140, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = gridSize / 2; x <= cw; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
    }
    for (let y = gridSize / 2; y <= ch; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
    }
    ctx.stroke();

    drawGlow(ctx, cw * 0.5, ch * 0.52, Math.max(cw, ch) * 0.35, 'rgba(89, 241, 255, 0.85)', 0.12);

    if (shake > 0) {
        const sx = (Math.random() - 0.5) * shake;
        const sy = (Math.random() - 0.5) * shake;
        ctx.translate(sx, sy);
    }

    dusts.forEach(d => d.draw(ctx));
    hazards.forEach(h => h.draw(ctx));
    hero.draw(ctx);
    particles.forEach(p => p.draw(ctx));

    const scanY = (gameTime * 70) % (ch + 140) - 70;
    const scanGrad = ctx.createLinearGradient(0, scanY - 40, 0, scanY + 40);
    scanGrad.addColorStop(0, 'rgba(0,0,0,0)');
    scanGrad.addColorStop(0.5, 'rgba(89, 241, 255, 0.08)');
    scanGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = scanGrad;
    ctx.fillRect(0, scanY - 40, cw, 80);

    const grad = ctx.createRadialGradient(cw / 2, ch / 2, Math.max(cw, ch) / 3.1, cw / 2, ch / 2, Math.max(cw, ch));
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    gameTime += 1 / 60;
}

// --- Input Handling ---
function handleGlobalInput(e) {
    unlockAudio();
    if (gameState === STATE.GAMEOVER) {
        return;
    }

    if (e.type === 'pointerdown' || e.type === 'pointermove') {
        const rect = canvas.getBoundingClientRect();
        input.x = e.clientX - rect.left;
        input.y = e.clientY - rect.top;
        input.active = true;
    }

    if (e.type === 'pointerup' || e.type === 'pointercancel') {
        input.active = false;
    }
}

// --- Initialization & Lifecycle ---
document.addEventListener('DOMContentLoaded', () => {
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', handleGlobalInput, { passive: false });
    window.addEventListener('pointerup', handleGlobalInput, { passive: false });
    window.addEventListener('pointercancel', handleGlobalInput, { passive: false });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (bgmEl && !bgmEl.paused) bgmEl.pause();
        } else {
            syncAudioState();
        }
    });

    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        restartGame();
    });

    ro = new ResizeObserver(entries => {
        for (const entry of entries) {
            const { width, height } = entry.contentRect;
            dpr = window.devicePixelRatio || 1;

            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);

            cw = width;
            ch = height;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (!initialized) {
                initGame();
            } else {
                hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
                hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));
            }
        }
    });

    ro.observe(canvas);
});
</script>
