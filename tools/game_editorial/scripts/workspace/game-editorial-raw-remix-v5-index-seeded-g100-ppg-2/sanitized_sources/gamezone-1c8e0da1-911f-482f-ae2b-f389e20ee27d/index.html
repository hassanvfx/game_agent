<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Descent</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #040816;
  --bg-mid: #0a1433;
  --hud-cyan: #7ef9ff;
  --hud-pink: #ff72d2;
  --hud-gold: #ffe27a;
  --panel-edge: rgba(126, 249, 255, 0.85);
  --panel-fill: rgba(8, 14, 33, 0.8);
  --panel-glow: rgba(0, 194, 255, 0.34);
  --body-font: 'Exo 2', system-ui, sans-serif;
  --display-font: 'Audiowide', system-ui, sans-serif;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at top, rgba(33, 78, 174, 0.38), transparent 34%),
    linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 62%, #02040a 100%);
}
body {
  font-family: var(--body-font);
  color: #effdff;
}
#game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
#game-container::before,
#game-container::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#game-container::before {
  background:
    radial-gradient(circle at 20% 14%, rgba(126, 249, 255, 0.22), transparent 18%),
    radial-gradient(circle at 80% 18%, rgba(255, 114, 210, 0.18), transparent 22%),
    linear-gradient(180deg, rgba(126, 249, 255, 0.05), transparent 20%, transparent 80%, rgba(255, 114, 210, 0.08));
  opacity: 0.95;
}
#game-container::after {
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 6px);
  mix-blend-mode: soft-light;
  opacity: 0.25;
}
canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 0; }
.neon-text {
  font-family: var(--display-font);
  text-shadow: 0 0 12px currentColor;
}
.ui-layer {
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0.85rem;
  box-sizing: border-box;
}
.hud {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.85rem;
}
.hud-primary,
.hud-secondary,
.status-chip {
  position: relative;
  padding: 0.45rem 0.7rem;
  border: 1px solid rgba(126, 249, 255, 0.3);
  border-radius: 0.9rem;
  background: linear-gradient(180deg, rgba(7, 15, 34, 0.92), rgba(8, 13, 27, 0.58));
  backdrop-filter: blur(6px);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.05),
    0 0 20px rgba(0, 194, 255, 0.16);
}
.hud-primary {
  color: var(--hud-cyan);
  font-size: clamp(0.92rem, 3vw, 1.35rem);
  font-weight: 700;
  letter-spacing: 0.13em;
}
.hud-secondary {
  color: var(--hud-pink);
  font-size: clamp(0.72rem, 2vw, 0.92rem);
  letter-spacing: 0.1em;
  text-align: right;
}
.status-row {
  display: flex;
  justify-content: center;
  margin-top: auto;
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: #9afcff;
  font-family: var(--body-font);
  font-size: clamp(0.72rem, 2.2vw, 0.88rem);
  letter-spacing: 0.1em;
  max-width: min(80vw, 18rem);
}
.status-chip.hidden { display: none; }
.status-chip img {
  width: 2.4rem;
  height: 2.4rem;
  object-fit: cover;
  border-radius: 0.65rem;
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow: 0 0 14px rgba(126, 249, 255, 0.18);
}
.status-copy {
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
}
.status-label {
  color: var(--hud-gold);
  font-size: 0.68rem;
}
.overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(14, 33, 76, 0.35), rgba(0, 0, 0, 0.94) 62%);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  padding: 1rem;
  box-sizing: border-box;
}
.overlay.hidden { display: none; }
.panel {
  position: relative;
  text-align: center;
  border: 1px solid var(--panel-edge);
  border-radius: 1.25rem;
  padding: 1.45rem 1.15rem 1.2rem;
  background: linear-gradient(180deg, rgba(11, 18, 41, 0.92), var(--panel-fill));
  box-shadow:
    0 0 36px var(--panel-glow),
    inset 0 0 0 1px rgba(255,255,255,0.07);
  max-width: min(90vw, 28rem);
}
.panel::before {
  content: "🛸";
  display: block;
  font-size: clamp(2rem, 8vw, 3rem);
  margin-bottom: 0.35rem;
  filter: drop-shadow(0 0 14px rgba(126, 249, 255, 0.55));
}
.panel-title {
  color: var(--hud-pink);
  font-size: clamp(1.8rem, 6.6vw, 2.75rem);
  font-weight: 400;
  margin: 0 0 0.45rem;
  letter-spacing: 0.16em;
}
.panel-copy {
  font-family: var(--body-font);
  color: #b8f6ff;
  font-size: clamp(0.92rem, 2.7vw, 1.05rem);
  margin: 0 0 1rem;
  line-height: 1.45;
}
.panel-score {
  color: var(--hud-gold);
  font-size: clamp(0.95rem, 3vw, 1.15rem);
  margin: 0 0 1.25rem;
}
.panel-button {
  font: inherit;
  font-family: var(--display-font);
  background: linear-gradient(180deg, rgba(24, 115, 189, 0.68), rgba(12, 61, 116, 0.86));
  color: #ecfdff;
  border: 1px solid rgba(126, 249, 255, 0.7);
  border-radius: 999px;
  padding: 0.85rem 1.35rem;
  font-size: clamp(0.95rem, 3vw, 1rem);
  font-weight: 400;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 0 18px rgba(0, 194, 255, 0.22);
}
.panel-button:hover { background: linear-gradient(180deg, rgba(32, 144, 227, 0.8), rgba(15, 86, 164, 0.92)); }
.panel-button:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(0, 194, 255, 0.2); }
.panel-tip {
  font-family: var(--body-font);
  color: #ffd2f1;
  font-size: clamp(0.72rem, 2.2vw, 0.92rem);
  margin: 0 0 0.9rem;
  letter-spacing: 0.14em;
  font-weight: 700;
}
.result-gif {
  width: min(72vw, 12rem);
  margin: 0 auto 0.95rem;
  border-radius: 1rem;
  border: 1px solid rgba(126, 249, 255, 0.36);
  box-shadow: 0 0 24px rgba(0, 194, 255, 0.2);
}
.result-gif.hidden { display: none; }
@media (max-width: 480px) {
  .ui-layer { padding: 0.7rem; }
  .hud { gap: 0.5rem; }
  .hud-primary, .hud-secondary, .status-chip { padding: 0.38rem 0.58rem; }
  .panel { padding: 1.2rem 0.95rem 1rem; }
  .status-chip img {
    width: 2rem;
    height: 2rem;
  }
}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui-layer" class="ui-layer">
    <div id="hud" class="hud">
      <div class="neon-text hud-primary" id="score-display">DISTANCE: 0</div>
      <div class="neon-text hud-secondary" id="difficulty-display">ZONE: 1</div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: danger+gameover feedback -> catalogs/gifs.json -->
    <div class="status-row">
      <div id="status-chip" class="status-chip hidden" aria-live="polite">
        <img id="status-gif" alt="Game status reaction">
        <div class="status-copy">
          <span class="status-label neon-text" id="status-title">DANGER</span>
          <span id="status-text">Signal spike detected</span>
        </div>
      </div>
    </div>
    
    <div id="game-over-screen" class="overlay hidden">
      <div class="panel">
        <img id="game-over-gif" class="result-gif hidden" alt="Game over reaction">
        <h1 class="neon-text panel-title">COURIER DOWN</h1>
        <p class="neon-text panel-copy">Guide the courier left and right to dodge falling jammers for as long as you can.</p>
        <p class="neon-text panel-tip">DRAG OR TAP TO REPOSITION</p>
        <p class="neon-text panel-score" id="final-score">DISTANCE: 0</p>
        <button id="restart-btn" class="neon-text panel-button">REENTER GRID</button>
      </div>
    </div>
  </div>
  
  <!-- [agent-note][stage4] repaired: catalog-audio-remap | element: #bgm_main | action: replaced required local bgm with approved gameplay loop -->
  <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
  <audio id="sfx_spawn" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
  <audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
  <audio id="sfx_zone" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
  <audio id="sfx_death" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
</div>

<script id="game-config" type="application/x-game-config">
{
  "heroSpeed": { "type": "number", "label": "Player Speed", "value": 8, "min": 4, "max": 15 },
  "enemyBaseSpeed": { "type": "number", "label": "Enemy Speed", "value": 3, "min": 1, "max": 10 }
}
</script>

<script>
(function() {
  'use strict';
  
  const configScript = document.getElementById('game-config');
  const configDefs = JSON.parse(configScript.textContent);
  window.gameConfigDefs = configDefs;
  window.gameConfig = {};
  Object.keys(configDefs).forEach(k => window.gameConfig[k] = configDefs[k].value);

  const GIFS = {
    danger: 'https://i.giphy.com/1AjEBGWggGXh9onllB.webp',
    gameOver: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
  };
  
  window.updateGameConfig = (key, val) => {
    if (configDefs[key]?.type === 'number') val = parseFloat(val);
    window.gameConfig[key] = val;
  };

  const statusChip = document.getElementById('status-chip');
  const statusGif = document.getElementById('status-gif');
  const statusTitle = document.getElementById('status-title');
  const statusText = document.getElementById('status-text');
  const gameOverGif = document.getElementById('game-over-gif');
  
  const AudioSys = {
    bgm: document.getElementById('bgm_main'),
    sfxMap: {
      spawn: document.getElementById('sfx_spawn'),
      restart: document.getElementById('sfx_restart'),
      zone: document.getElementById('sfx_zone'),
      death: document.getElementById('sfx_death')
    },
    unlocked: false,

    init() {
      this.bgm.volume = 0.2;
      Object.values(this.sfxMap).forEach(audio => {
        audio.volume = 0.42;
        audio.preload = 'auto';
      });
    },
    
    unlock() {
      if (this.unlocked) return;
      this.unlocked = true;
      this.startLoop();
    },

    startLoop() {
      this.bgm.play().catch(() => {});
    },

    stopLoop() {
      this.bgm.pause();
    },
    
    playSfx(type) {
      const audio = this.sfxMap[type];
      if (!audio || !this.unlocked) return;
      try {
        audio.pause();
        audio.currentTime = 0;
      } catch (e) {}
      audio.play().catch(() => {});
    }
  };
  
  let gameState = 'PLAYING';
  let canvas = document.getElementById('gameCanvas');
  let ctx = canvas.getContext('2d');
  let dpr = window.devicePixelRatio || 1;
  let cw = 0, ch = 0;
  let initialized = false;
  let animationId;
  let lastTime = 0;
  let score = 0;
  let difficulty = 1;
  let spawnTimer = 0;
  let shake = 0;
  let lastDangerAt = -1000;
  let lastSpawnSfxAt = -1000;
  let lastZoneSfx = 1;
  
  let player = null;
  let enemies = [];
  let particles = [];
  let gridOffset = 0;
  let inputX = null;
  
  function resize(width, height) {
    cw = width;
    ch = height;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (initialized && player) {
      player.x = Math.max(player.size, Math.min(cw - player.size, player.x));
      player.y = ch - 80;
      enemies = enemies.filter(e => e.y < ch + 50);
    }
  }
  
  function initGame() {
    score = 0;
    difficulty = 1;
    spawnTimer = 0;
    enemies = [];
    particles = [];
    shake = 0;
    lastDangerAt = -1000;
    lastSpawnSfxAt = -1000;
    lastZoneSfx = 1;
    
    const size = 30;
    player = {
      x: cw / 2,
      y: ch - 80,
      size: size,
      color: '#06b6d4',
      glow: 20
    };
    
    hideStatus();
    updateHUD();
    setState('PLAYING');
    AudioSys.playSfx('restart');
    AudioSys.bgm.currentTime = 0;
    AudioSys.startLoop();
  }
  
  function setState(state) {
    gameState = state;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    
    if (state === 'PLAYING') {
      hud.classList.remove('hidden');
      gameOver.classList.add('hidden');
      gameOverGif.classList.add('hidden');
    } else if (state === 'GAMEOVER') {
      hud.classList.add('hidden');
      gameOver.classList.remove('hidden');
      document.getElementById('final-score').textContent = 'DISTANCE: ' + Math.floor(score);
      gameOverGif.src = GIFS.gameOver;
      gameOverGif.classList.remove('hidden');
    }
  }
  
  function spawnEnemy() {
    const size = 25 + Math.random() * 20;
    const x = Math.random() * (cw - size * 2) + size;
    enemies.push({
      x: x,
      y: -size - 10,
      size: size,
      speed: (window.gameConfig.enemyBaseSpeed || 3) + difficulty * 0.5 + Math.random() * 2,
      color: Math.random() > 0.5 ? '#ec4899' : '#ef4444',
      rotation: 0,
      rotSpeed: (Math.random() - 0.5) * 0.2
    });
    if (score - lastSpawnSfxAt > 45) {
      AudioSys.playSfx('spawn');
      lastSpawnSfxAt = score;
    }
  }
  
  function createExplosion(x, y, color) {
    for (let i = 0; i < 20; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 15,
        vy: (Math.random() - 0.5) * 15,
        life: 1.0,
        color: color
      });
    }
  }

  function showStatus(kind, title, message) {
    statusGif.src = GIFS[kind];
    statusTitle.textContent = title;
    statusText.textContent = message;
    statusChip.classList.remove('hidden');
  }

  function hideStatus() {
    statusChip.classList.add('hidden');
  }
  
  function update(dt) {
    if (gameState !== 'PLAYING' && particles.length === 0) return;
    
    if (gameState === 'PLAYING') {
      score += dt * 10;
      difficulty = 1 + Math.floor(score / 500);
      
      spawnTimer += dt;
      const spawnRate = Math.max(0.2, 1.2 - difficulty * 0.08);
      if (spawnTimer > spawnRate) {
        spawnEnemy();
        spawnTimer = 0;
      }
      
      if (inputX !== null && isFinite(inputX)) {
        const targetX = inputX;
        const dx = targetX - player.x;
        const speed = (window.gameConfig.heroSpeed || 8) * 60 * dt;
        if (Math.abs(dx) > 1) {
          player.x += Math.sign(dx) * Math.min(Math.abs(dx), speed);
        }
      }
      
      player.x = Math.max(player.size/2, Math.min(cw - player.size/2, player.x));
      if (!isFinite(player.x)) player.x = cw / 2;
      
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed * 60 * dt;
        e.rotation += e.rotSpeed;

        const nearBottom = e.y > ch * 0.72;
        if (nearBottom && score - lastDangerAt > 30) {
          showStatus('danger', 'JAMMER LOCK', 'Drop lane is hot — slide now.');
          AudioSys.playSfx('spawn');
          lastDangerAt = score;
        }
        
        if (
          player.x - player.size/2 < e.x + e.size/2 &&
          player.x + player.size/2 > e.x - e.size/2 &&
          player.y - player.size/2 < e.y + e.size/2 &&
          player.y + player.size/2 > e.y - e.size/2
        ) {
          shake = 20;
          AudioSys.playSfx('death');
          AudioSys.stopLoop();
          createExplosion(player.x, player.y, player.color);
          createExplosion(e.x, e.y, e.color);
          hideStatus();
          setState('GAMEOVER');
          enemies.splice(i, 1);
          continue;
        }
        
        if (e.y > ch + 50) enemies.splice(i, 1);
      }

      if (score - lastDangerAt > 45) {
        hideStatus();
      }

      const zoneBeat = Math.floor(score / 250) + 1;
      if (zoneBeat > lastZoneSfx) {
        AudioSys.playSfx('zone');
        lastZoneSfx = zoneBeat;
      }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= dt * 2;
      if (p.life <= 0) particles.splice(i, 1);
    }
    
    gridOffset = (gridOffset + 40 * dt) % 40;
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;
    
    if (Math.floor(score) % 10 === 0) updateHUD();
  }
  
  function draw() {
    ctx.fillStyle = 'rgba(5, 5, 5, 0.25)';
    ctx.fillRect(0, 0, cw, ch);
    
    ctx.save();
    if (shake > 0) {
      const sx = (Math.random() - 0.5) * shake;
      const sy = (Math.random() - 0.5) * shake;
      ctx.translate(sx, sy);
    }
    
    ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < cw; x += 40) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, ch);
    }
    for (let y = gridOffset; y < ch; y += 40) {
      ctx.moveTo(0, y);
      ctx.lineTo(cw, y);
    }
    ctx.stroke();
    
    if (gameState === 'PLAYING') {
      ctx.save();
      ctx.shadowBlur = player.glow;
      ctx.shadowColor = player.color;
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x - player.size/4, player.y - player.size/4, player.size/2, player.size/2);
      ctx.restore();
    }
    
    enemies.forEach(e => {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.rotation);
      ctx.shadowBlur = 15;
      ctx.shadowColor = e.color;
      ctx.fillStyle = e.color;
      ctx.fillRect(-e.size/2, -e.size/2, e.size, e.size);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.moveTo(-e.size/2, -e.size/2);
      ctx.lineTo(e.size/2, e.size/2);
      ctx.lineTo(e.size/2, e.size/2 - 6);
      ctx.lineTo(-e.size/2 + 6, -e.size/2);
      ctx.fill();
      ctx.restore();
    });
    
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 6;
      ctx.shadowColor = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      ctx.restore();
    });
    
    ctx.restore();
  }
  
  function updateHUD() {
    document.getElementById('score-display').textContent = 'DISTANCE: ' + Math.floor(score);
    document.getElementById('difficulty-display').textContent = 'ZONE: ' + difficulty;
  }
  
  function loop(timestamp) {
    try {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      
      update(dt);
      draw();
      
      animationId = requestAnimationFrame(loop);
    } catch(e) {
      console.error(e);
    }
  }
  
  function handleInput(e) {
    AudioSys.unlock();
    e.preventDefault();
    
    if (gameState === 'GAMEOVER') {
      if (e.target.id === 'restart-btn' || e.type === 'pointerdown') {
        initGame();
      }
      return;
    }
    
    if (e.type === 'pointerdown' || e.type === 'pointermove') {
      const rect = canvas.getBoundingClientRect();
      inputX = e.clientX - rect.left;
    }
  }
  
  function handleInputEnd() {
    inputX = null;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      AudioSys.stopLoop();
    } else if (AudioSys.unlocked && gameState === 'PLAYING') {
      AudioSys.startLoop();
    }
  });
  
  document.addEventListener('DOMContentLoaded', () => {
    AudioSys.init();
    
    const ro = new ResizeObserver(entries => {
      const cr = entries[0].contentRect;
      resize(cr.width, cr.height);
      
      if (!initialized) {
        initialized = true;
        initGame();
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }
    });
    
    ro.observe(canvas);
    
    window.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('pointermove', handleInput, { passive: false });
    window.addEventListener('pointerup', handleInputEnd, { passive: false });
    window.addEventListener('pointercancel', handleInputEnd, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      handleInput(e);
    });
  });
})();
</script>
</body>
</html>
