<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meme Maze Panic 3D</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');
        :root {
            --bg-deep: #050816;
            --bg-mid: #101b3d;
            --panel-bg: rgba(10, 16, 36, 0.82);
            --panel-border: rgba(111, 243, 255, 0.34);
            --text-main: #f3fbff;
            --text-soft: rgba(214, 243, 255, 0.72);
            --health: #ff668a;
            --gem: #6ff3ff;
            --warn: #ff8d66;
            --glow-cyan: rgba(111, 243, 255, 0.34);
            --glow-pink: rgba(255, 102, 138, 0.28);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(64, 120, 255, 0.18), transparent 34%),
                linear-gradient(180deg, #081120 0%, #04060e 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 20%, rgba(111, 243, 255, 0.08), transparent 22%),
                radial-gradient(circle at 80% 18%, rgba(255, 102, 138, 0.08), transparent 20%),
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 20%, transparent 80%, rgba(111,243,255,0.05));
            z-index: 0;
        }
        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            filter: saturate(1.15) contrast(1.08);
        }
        .glass {
            background:
                linear-gradient(180deg, rgba(16, 27, 61, 0.92), rgba(6, 10, 24, 0.92)),
                rgba(10, 16, 36, 0.82);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 18px rgba(0,0,0,0.46),
                0 0 24px var(--glow-cyan);
        }
        .hidden { display: none !important; }
        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-width: 88px;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(18, 29, 66, 0.92), rgba(8, 11, 24, 0.95));
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 12px rgba(0,0,0,0.25), 0 0 16px var(--glow-cyan);
        }
        .hud-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.64rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-soft);
        }
        .hud-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.08em;
        }
        .panel-title,
        #controls-hint,
        #restart-btn,
        #crosshair,
        #hud {
            font-family: 'Orbitron', sans-serif;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            border: 1px solid rgba(111, 243, 255, 0.2);
            box-shadow: 0 0 18px rgba(111, 243, 255, 0.2);
            mix-blend-mode: screen;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: linear-gradient(90deg, rgba(111,243,255,0.5), rgba(255,255,255,0.95), rgba(111,243,255,0.5));
        }
        #crosshair::before { top: 9px; left: 2px; width: 16px; height: 2px; }
        #crosshair::after { top: 2px; left: 9px; width: 2px; height: 16px; }

        #game-container {
            background:
                radial-gradient(circle at center, rgba(24, 46, 100, 0.18), transparent 36%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            isolation: isolate;
        }
        #game-container::before,
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        #game-container::before {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.25) 100%),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 4px);
            opacity: 0.35;
        }
        #game-container::after {
            background: radial-gradient(circle at center, transparent 45%, rgba(2, 4, 12, 0.75) 100%);
        }

        /* Damage Vignette */
        #damage-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle, transparent 42%, rgba(255, 53, 97, 0.24) 65%, rgba(180, 0, 51, 0.78) 100%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 4;
        }

        /* Virtual Stick UI */
        #stick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px solid rgba(111,243,255,0.22);
            background:
                radial-gradient(circle at center, rgba(111,243,255,0.1), rgba(7, 10, 22, 0.18) 62%, rgba(7, 10, 22, 0.45) 100%);
            box-shadow: inset 0 0 24px rgba(111,243,255,0.1), 0 0 24px rgba(0,0,0,0.28);
            pointer-events: none; /* Logic handles input globally, this is visual */
            z-index: 5;
        }
        #stick-zone::before {
            content: '';
            position: absolute;
            inset: 15px;
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 50%;
        }
        #stick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.8), rgba(111,243,255,0.38) 45%, rgba(42,84,174,0.95) 100%);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(111,243,255,0.35);
            transform: translate(-50%, -50%);
        }

        #hud {
            z-index: 6;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
        }
        #controls-hint {
            z-index: 6;
            bottom: 8.9rem;
            max-width: min(92vw, 30rem);
            margin: 0 auto;
            padding: 0.55rem 0.8rem;
            border-radius: 999px;
            background: rgba(5, 8, 20, 0.42);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(223, 245, 255, 0.72);
            text-shadow: 0 0 10px rgba(111,243,255,0.2);
            font-size: 0.68rem;
            letter-spacing: 0.14em;
        }
        #reaction-overlay {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            z-index: 7;
            width: min(28vw, 128px);
            min-width: 84px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.35rem;
            pointer-events: none;
        }
        .reaction-card {
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(2, 6, 20, 0.72);
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.35), 0 0 20px rgba(111,243,255,0.16);
            backdrop-filter: blur(6px);
            opacity: 0;
            transform: translateY(8px) scale(0.95);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .reaction-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .reaction-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: rgba(9, 15, 30, 0.95);
        }
        .reaction-label {
            padding: 0.35rem 0.5rem 0.45rem;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(243, 251, 255, 0.76);
            text-align: center;
        }
        #game-over-screen {
            z-index: 10;
            padding: 1rem;
            background:
                radial-gradient(circle at top, rgba(255, 102, 138, 0.14), transparent 32%),
                rgba(1, 2, 8, 0.9);
        }
        #game-over-panel {
            width: min(100%, 22rem);
            padding: 1.6rem 1.2rem;
            border-radius: 1.2rem;
        }
        #restart-btn {
            min-width: 11rem;
            border-radius: 999px;
            background: linear-gradient(180deg, #ff668a, #a21c46);
            box-shadow: 0 0 18px rgba(255, 102, 138, 0.28);
        }
        #restart-btn:hover {
            filter: brightness(1.08);
        }

        /* [agent-note][stage4] repaired: safe-area-spacing | elements: hud + controls-hint + stick-zone | action: preserve tap reachability on mobile cutouts */
        @media (max-width: 640px) {
            #hud {
                top: max(0.75rem, env(safe-area-inset-top));
                left: max(0.75rem, env(safe-area-inset-left));
                right: max(0.75rem, env(safe-area-inset-right));
                font-size: 0.82rem;
            }
            .hud-chip {
                min-width: 78px;
                padding: 0.35rem 0.65rem;
            }
            .hud-label {
                font-size: 0.56rem;
            }
            .hud-value {
                font-size: 0.88rem;
            }
            #controls-hint {
                bottom: calc(8rem + env(safe-area-inset-bottom));
                padding: 0.45rem 0.65rem;
                font-size: 0.6rem;
            }
            #reaction-overlay {
                right: max(0.75rem, env(safe-area-inset-right));
                bottom: max(0.75rem, env(safe-area-inset-bottom));
                width: min(27vw, 104px);
                min-width: 78px;
            }
            .reaction-label {
                font-size: 0.54rem;
                padding: 0.3rem 0.35rem 0.4rem;
            }
            #game-over-panel {
                padding: 1.35rem 1rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<audio id="bgm_main" data-editable="audio" data-label="Gameplay Music Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
<audio id="bgm_gameover" data-editable="audio" data-label="Defeat Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_damage" data-editable="audio" data-label="Damage Pulse" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto"></audio>
<audio id="sfx_enemy_hit" data-editable="audio" data-label="Glitch Purge" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3" preload="auto"></audio>
<audio id="sfx_pickup" data-editable="audio" data-label="Reaction Gem" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>

<img id="tex_wall" hidden>

<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Move Speed", "value": 4, "min": 1, "max": 8 },

<div id="game-container" class="relative w-full h-full select-none bg-black">
    <canvas id="gameCanvas"></canvas>
    
    <div id="damage-overlay"></div>
    <div id="crosshair"></div>

    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
        <!-- HUD -->
        <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-center text-white drop-shadow-md">
            <div class="hud-chip">
                <span class="text-xl leading-none" style="color: var(--health);">♥</span>

                    <span class="hud-label">Signal</span>
                    <span id="score-display" class="hud-value">100</span>

                <span class="text-xl leading-none" style="color: var(--gem);">♦</span>

        </div>

        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->

        <div id="controls-hint" class="absolute bottom-40 w-full px-4 text-center text-sm leading-relaxed">

        <!-- Virtual Stick Visual -->

        <!-- [agent-note][stage3] resolved-gif: purge-hit + game-over reaction -> catalogs/gifs.json -->
        <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
        <div id="reaction-overlay" aria-hidden="true">
            <div id="reaction-hit" class="reaction-card">
                <img src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="impact reaction gif" loading="lazy" decoding="async">

            </div>
            <div id="reaction-fail" class="reaction-card">
                <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="game over reaction gif" loading="lazy" decoding="async">

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/90 pointer-events-auto">

                <div class="mb-3 text-xs uppercase tracking-[0.45em]" style="color: var(--warn); font-family: 'Orbitron', sans-serif;">Signal Lost</div>
                <h1 class="panel-title text-4xl mb-2 tracking-[0.35em]" style="color: var(--health);">STREAM DOWN</h1>
                <p class="mb-6 text-sm uppercase tracking-[0.18em]" style="color: var(--text-soft);">THE GLITCH SWARM CRASHED YOUR RUN</p>
                <div class="text-2xl mb-8" style="font-family: 'Orbitron', sans-serif;">REACTIONS: <span id="final-score" class="text-cyan-400">0</span></div>
                <button id="restart-btn" class="px-8 py-3 text-white border font-bold uppercase tracking-[0.25em] transition-all active:scale-95">
                    REQUEUE
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * §0 System Constants & Invariants
 */
const CONFIG = {
    fov: 0.66,
    resDiv: 2, // Resolution divisor (higher = more pixelated/faster)
    texSize: 64,
    mapWidth: 24,
    mapHeight: 24
};

// Runtime State
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let lastTime = 0;
let ctx, canvas;
let cw, ch;
let keys = {};
let touchState = { active: false, x: 0, y: 0, originX: 0, originY: 0 };
let worldMap = [];
let textures = {};

// Entities
let player = { x: 0, y: 0, dirX: 0, dirY: 0, planeX: 0, planeY: 0, hp: 100, diamonds: 0 };
let enemies = [];
let zBuffer = []; // 1D Z-buffer for sprite occlusion

// Audio Context
let audioCtx;
let isAudioUnlocked = false;
let lastSfxAt = {};
let lowHealthWarned = false;
let reactionTimers = {};
let activeLoopId = null;

/**
 * §1 Initialization & Lifecycle
 */
window.gameConfigDefs = {};
window.gameConfig = {};

document.addEventListener('DOMContentLoaded', () => {
    // 1. Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        const rawCfg = JSON.parse(cfgEl.textContent);
        window.gameConfigDefs = rawCfg;
        for (let k in rawCfg) window.gameConfig[k] = rawCfg[k].value;
    } catch(e) { console.error("Config parse error", e); }

    // 2. Setup Canvas
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // 3. Asset Generation
    generateTextures();

    // 4. Initial Resize
    resize();
    window.addEventListener('resize', resize);

    // 5. Input Binding
    setupInput();

    // 6. Start Game
    initGame();
    setState('PLAYING');

    // 7. Loop
    requestAnimationFrame(loop);
});

function resize() {
    const dpr = window.devicePixelRatio || 1;
    // Logical size matches CSS pixels
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    
    // Internal resolution can be lower for retro feel & performance
    canvas.width = Math.ceil(cw / CONFIG.resDiv);
    canvas.height = Math.ceil(ch / CONFIG.resDiv);
    
    // No setTransform here because we render to the scaled buffer directly
}

function initGame() {
    // Generate Map (Cellular Automata-ish or just random maze)
    worldMap = generateMap(CONFIG.mapWidth, CONFIG.mapHeight);
    
    // Spawn Player (Find empty spot)
    let spawnFound = false;
    for(let x=1; x<CONFIG.mapWidth-1; x++) {
        for(let y=1; y<CONFIG.mapHeight-1; y++) {
            if(worldMap[x][y] === 0) {
                player.x = x + 0.5;
                player.y = y + 0.5;
                player.dirX = -1; player.dirY = 0;
                player.planeX = 0; player.planeY = 0.66;
                player.hp = 100;
                player.diamonds = 0;
                spawnFound = true;
                break;
            }
        }
        if(spawnFound) break;
    }
    
     // Spawn Enemies & Diamonds
     enemies = [];
     for(let i=0; i<5; i++) spawnEntity(2); // 2 = Glitch
     for(let i=0; i<5; i++) spawnEntity(3); // 3 = Reaction gem

    lowHealthWarned = false;
    hideReaction('reaction-hit');
    hideReaction('reaction-fail');
    updateHUD();
}

function spawnEntity(type) {
    let x, y;
    do {
        x = Math.floor(Math.random() * CONFIG.mapWidth);
        y = Math.floor(Math.random() * CONFIG.mapHeight);
    } while(worldMap[x][y] !== 0);
    enemies.push({ x: x + 0.5, y: y + 0.5, type: type, active: true });
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    const stick = document.getElementById('stick-zone');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        stick.classList.remove('hidden');
        gameOver.classList.add('hidden');
        document.getElementById('damage-overlay').style.opacity = 0;
        hideReaction('reaction-fail');
        stopLoop('bgm_gameover');
        if (isAudioUnlocked) startLoop('bgm_main');
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        stick.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').textContent = player.diamonds;
        showReaction('reaction-fail', 2200);
        stopLoop('bgm_main');
        if (isAudioUnlocked) startLoop('bgm_gameover');
    }
}

function restartGame() {
    playSfx('sfx_restart', 180);
    initGame();
    setState('PLAYING');
}

/**
 * §2 Input System
 */
function setupInput() {
    const handleGlobal = (e) => {
        // L2 Audio Unlock
        if (!isAudioUnlocked) {
            unlockAudio();
        }

        if (gameState === 'GAMEOVER') {
            // Restart handled by button, but screen tap can also work if desired
            return;
        }
        
        // In-game input routing
        if (gameState === 'PLAYING') {
            if (e.type === 'pointerdown') {
                touchState.active = true;
                touchState.originX = e.clientX;
                touchState.originY = e.clientY;
                touchState.x = e.clientX;
                touchState.y = e.clientY;
                
                // Update Virtual Stick UI
                updateStickUI(0, 0);
            }
            else if (e.type === 'pointermove' && touchState.active) {
                touchState.x = e.clientX;
                touchState.y = e.clientY;
                const dx = touchState.x - touchState.originX;
                const dy = touchState.y - touchState.originY;
                updateStickUI(dx, dy);
            }
            else if (e.type === 'pointerup' || e.type === 'pointercancel') {
                // Check for tap (interaction)
                const dist = Math.hypot(touchState.x - touchState.originX, touchState.y - touchState.originY);
                if (dist < 10) interact();
                
                touchState.active = false;
                updateStickUI(0, 0);
            }
        }
    };

    window.addEventListener('pointerdown', handleGlobal, { passive: false });
    window.addEventListener('pointermove', handleGlobal, { passive: false });
    window.addEventListener('pointerup', handleGlobal, { passive: false });
    window.addEventListener('pointercancel', handleGlobal, { passive: false });

    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        restartGame();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopLoop(activeLoopId);
        } else if (isAudioUnlocked && gameState === 'PLAYING') {
            startLoop('bgm_main');
        } else if (isAudioUnlocked && gameState === 'GAMEOVER') {
            startLoop('bgm_gameover');
        }
    });
}

function updateStickUI(dx, dy) {
    const stick = document.getElementById('stick-knob');
    const maxDist = 35;
    const dist = Math.hypot(dx, dy);
    const scale = dist > maxDist ? maxDist / dist : 1;
    stick.style.transform = `translate(calc(-50% + ${dx * scale}px), calc(-50% + ${dy * scale}px))`;
}

function unlockAudio() {
    isAudioUnlocked = true;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    document.querySelectorAll('audio').forEach((audio) => {
        if (audio.id.startsWith('bgm_')) {
            audio.volume = 0.2;
        } else {
            audio.volume = 0.58;
        }
    });
    if (gameState === 'PLAYING') {
        startLoop('bgm_main');
    }
}

function startLoop(id) {
    const next = document.getElementById(id);
    if (!next) return;
    if (activeLoopId && activeLoopId !== id) stopLoop(activeLoopId);
    activeLoopId = id;
    next.currentTime = next.currentTime || 0;
    next.play().catch(() => {});
}

function stopLoop(id) {
    if (!id) return;
    const loop = document.getElementById(id);
    if (loop) {
        loop.pause();
    }
    if (activeLoopId === id) {
        activeLoopId = null;
    }
}

function showReaction(id, duration = 900) {
    const card = document.getElementById(id);
    if (!card) return;
    clearTimeout(reactionTimers[id]);
    card.classList.add('active');
    reactionTimers[id] = setTimeout(() => hideReaction(id), duration);
}

function hideReaction(id) {
    const card = document.getElementById(id);
    if (!card) return;
    card.classList.remove('active');
}

/**
 * §3 Game Logic & Raycasting Engine
 */
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            update(Math.min(dt, 0.1)); // Cap dt
            render();
        }
    } catch (e) {
        console.error("Game Loop Error", e);
    }
    
    requestAnimationFrame(loop);
}

function update(dt) {
    // 1. Player Movement (Tank Controls / FPS Hybrid)
    // Y-axis drag = Move Forward/Back
    // X-axis drag = Rotate Left/Right
    if (touchState.active) {
        const dx = touchState.x - touchState.originX;
        const dy = touchState.y - touchState.originY;
        
        const moveSpeed = window.gameConfig.heroSpeed * dt;
        const rotSpeed = window.gameConfig.sensitivity * dt * 1.5;

        // Thresholds
        if (Math.abs(dy) > 10) {
            const moveDir = dy < 0 ? 1 : -1; // Drag up to move forward
            const nextX = player.x + player.dirX * moveSpeed * moveDir;
            const nextY = player.y + player.dirY * moveSpeed * moveDir;
            
            // Wall Collision
            if (worldMap[Math.floor(nextX)][Math.floor(player.y)] === 0) player.x = nextX;
            if (worldMap[Math.floor(player.x)][Math.floor(nextY)] === 0) player.y = nextY;
        }

        if (Math.abs(dx) > 10) {
            const rotDir = dx > 0 ? -1 : 1; // Drag right to turn right
            const oldDirX = player.dirX;
            player.dirX = player.dirX * Math.cos(rotSpeed * rotDir) - player.dirY * Math.sin(rotSpeed * rotDir);
            player.dirY = oldDirX * Math.sin(rotSpeed * rotDir) + player.dirY * Math.cos(rotSpeed * rotDir);
            const oldPlaneX = player.planeX;
            player.planeX = player.planeX * Math.cos(rotSpeed * rotDir) - player.planeY * Math.sin(rotSpeed * rotDir);
            player.planeY = oldPlaneX * Math.sin(rotSpeed * rotDir) + player.planeY * Math.cos(rotSpeed * rotDir);
        }
    }

    // 2. Entity Logic (Simple Chase)
    enemies.forEach(e => {
        if (!e.active) return;
        if (e.type === 2) { // Enemy
            const dist = Math.hypot(player.x - e.x, player.y - e.y);
            if (dist < 8) { // Aggro range
                const dx = (player.x - e.x) / dist;
                const dy = (player.y - e.y) / dist;
                const speed = 1.5 * dt;
                
                // Simple collision check for enemies
                if (worldMap[Math.floor(e.x + dx * speed)][Math.floor(e.y)] === 0) e.x += dx * speed;
                if (worldMap[Math.floor(e.x)][Math.floor(e.y + dy * speed)] === 0) e.y += dy * speed;

                if (dist < 0.5) takeDamage(10);
            }
        }
    });
}

function takeDamage(amount) {
    player.hp -= amount;
    updateHUD();
    playSfx('sfx_damage', 180);
    vibrate('heavy');
    
    // Visual Feedback
    const overlay = document.getElementById('damage-overlay');
    overlay.style.opacity = 0.8;
    setTimeout(() => overlay.style.opacity = 0, 200);
    
    // Screen Shake (CSS)
    canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
    setTimeout(() => canvas.style.transform = 'none', 100);

    if (player.hp > 0 && player.hp <= 30 && !lowHealthWarned) {
        lowHealthWarned = true;
        playSfx('sfx_miss', 600);
    } else if (player.hp > 30) {
        lowHealthWarned = false;
    }

    if (player.hp <= 0) {
        playSfx('sfx_die', 800);
        setState('GAMEOVER');
    }
}

function interact() {
    // Raycast for interaction (attack/collect)
    // Simplified: Check distance to entities
    let hit = false;
    enemies.forEach(e => {
        if (!e.active) return;
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < 2.0) {
            // Check if facing
            const dx = e.x - player.x;
            const dy = e.y - player.y;
            const dot = dx * player.dirX + dy * player.dirY;
            if (dot > 0.5) { // Roughly in front
                if (e.type === 2) { // Clear glitch
                    e.active = false; // One hit clear
                    playSfx('sfx_enemy_hit', 120);
                    showReaction('reaction-hit', 850);
                    spawnParticles(e.x, e.y, '#55aa55');
                    hit = true;
                } else if (e.type === 3) { // Collect reaction gem
                    e.active = false;
                    player.diamonds++;
                    playSfx('sfx_pickup', 120);
                    vibrate('light');
                    showReaction('reaction-hit', 950);
                    updateHUD();
                    hit = true;
                    // Respawn reaction gem elsewhere
                    setTimeout(() => spawnEntity(3), 5000);
                }
            }
        }
    });

    if (!hit) {
        playSfx('sfx_miss', 180);
        // Swing effect
        canvas.style.transform = `scale(1.02)`;
        setTimeout(() => canvas.style.transform = 'none', 50);
    }
}

function render() {
    const w = canvas.width;
    const h = canvas.height;
    
    // Clear & Ceiling/Floor
    const ceilingGrad = ctx.createLinearGradient(0, 0, 0, h / 2);
    ceilingGrad.addColorStop(0, '#09193c');
    ceilingGrad.addColorStop(0.6, '#08101f');
    ceilingGrad.addColorStop(1, '#05070d');
    ctx.fillStyle = ceilingGrad;
    ctx.fillRect(0, 0, w, h / 2);

    // Floor Gradient
    const grad = ctx.createLinearGradient(0, h/2, 0, h);
    grad.addColorStop(0, '#12061d');
    grad.addColorStop(0.55, '#090912');
    grad.addColorStop(1, '#020306');
    ctx.fillStyle = grad;
    ctx.fillRect(0, h/2, w, h/2);

    const floorGlow = ctx.createLinearGradient(0, h * 0.52, 0, h);
    floorGlow.addColorStop(0, 'rgba(111,243,255,0.03)');
    floorGlow.addColorStop(1, 'rgba(255,102,138,0.08)');
    ctx.fillStyle = floorGlow;
    ctx.fillRect(0, h/2, w, h/2);

    // Raycasting Walls
    zBuffer = new Array(w).fill(0);
    
    for (let x = 0; x < w; x++) {
        const cameraX = 2 * x / w - 1;
        const rayDirX = player.dirX + player.planeX * cameraX;
        const rayDirY = player.dirY + player.planeY * cameraX;

        let mapX = Math.floor(player.x);
        let mapY = Math.floor(player.y);

        let sideDistX, sideDistY;
        const deltaDistX = Math.abs(1 / rayDirX);
        const deltaDistY = Math.abs(1 / rayDirY);
        let perpWallDist;
        let stepX, stepY;
        let hit = 0;
        let side;

        if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
        else { stepX = 1; sideDistX = (mapX + 1.0 - player.x) * deltaDistX; }
        if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
        else { stepY = 1; sideDistY = (mapY + 1.0 - player.y) * deltaDistY; }

        while (hit === 0) {
            if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
            else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
            if (worldMap[mapX][mapY] > 0) hit = 1;
        }

        if (side === 0) perpWallDist = (mapX - player.x + (1 - stepX) / 2) / rayDirX;
        else perpWallDist = (mapY - player.y + (1 - stepY) / 2) / rayDirY;

        zBuffer[x] = perpWallDist;

        const lineHeight = Math.floor(h / perpWallDist);
        let drawStart = -lineHeight / 2 + h / 2;
        if (drawStart < 0) drawStart = 0;
        let drawEnd = lineHeight / 2 + h / 2;
        if (drawEnd >= h) drawEnd = h - 1;

        // Texture Mapping
        let wallX;
        if (side == 0) wallX = player.y + perpWallDist * rayDirY;
        else wallX = player.x + perpWallDist * rayDirX;
        wallX -= Math.floor(wallX);
        let texX = Math.floor(wallX * CONFIG.texSize);
        if ((side == 0 && rayDirX > 0) || (side == 1 && rayDirY < 0)) texX = CONFIG.texSize - texX - 1;

        // Draw Wall Strip
        // Optimization: Draw full strip from pattern or color
        const shade = 1 / (1 + perpWallDist * 0.5); // Distance fog
        const blockType = worldMap[mapX][mapY];

        // Stage 02 visual identity: stream-core arena palette, mechanics preserved.
        const colorBase = blockType === 1 ? [68, 116, 255] : [255, 96, 140];
        const r = Math.min(255, colorBase[0] * shade * (side === 1 ? 0.72 : 1));
        const g = Math.min(255, colorBase[1] * shade * (side === 1 ? 0.72 : 1));
        const b = Math.min(255, colorBase[2] * shade * (side === 1 ? 0.72 : 1));

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, drawStart, 1, drawEnd - drawStart);

        if (drawEnd > drawStart) {
            ctx.fillStyle = `rgba(255,255,255,${0.03 + shade * 0.08})`;
            ctx.fillRect(x, drawStart, 1, Math.max(1, (drawEnd - drawStart) * 0.08));
        }
    }

    // Sprite Casting (Enemies & Items)
    // Sort sprites by distance
    const spriteOrder = enemies.map((e, i) => {
        return { id: i, dist: ((player.x - e.x) ** 2 + (player.y - e.y) ** 2) };
    }).sort((a, b) => b.dist - a.dist);

    for (let i = 0; i < spriteOrder.length; i++) {
        const sprite = enemies[spriteOrder[i].id];
        if (!sprite.active) continue;

        const spriteX = sprite.x - player.x;
        const spriteY = sprite.y - player.y;

        const invDet = 1.0 / (player.planeX * player.dirY - player.dirX * player.planeY);
        const transformX = invDet * (player.dirY * spriteX - player.dirX * spriteY);
        const transformY = invDet * (-player.planeY * spriteX + player.planeX * spriteY);

        const spriteScreenX = Math.floor((w / 2) * (1 + transformX / transformY));
        const spriteHeight = Math.abs(Math.floor(h / transformY));
        const spriteWidth = Math.abs(Math.floor(h / transformY)); // Square sprites
        
        let drawStartY = -spriteHeight / 2 + h / 2;
        if (drawStartY < 0) drawStartY = 0;
        let drawEndY = spriteHeight / 2 + h / 2;
        if (drawEndY >= h) drawEndY = h - 1;

        let drawStartX = -spriteWidth / 2 + spriteScreenX;
        let drawEndX = spriteWidth / 2 + spriteScreenX;
        if (drawStartX < 0) drawStartX = 0;
        if (drawEndX >= w) drawEndX = w - 1;

        // Draw Sprite
        for (let stripe = Math.floor(drawStartX); stripe < drawEndX; stripe++) {
            if (transformY > 0 && stripe > 0 && stripe < w && transformY < zBuffer[stripe]) {
                // Simple pixel art drawing
                const texX = Math.floor((stripe - (-spriteWidth / 2 + spriteScreenX)) * CONFIG.texSize / spriteWidth);
                
                // Draw color based on type
                if (sprite.type === 2) { // Glitch hunter silhouette
                    const alpha = Math.max(0.16, 1 - transformY / 10);
                    const isEdge = stripe <= drawStartX + spriteWidth * 0.18 || stripe >= drawEndX - spriteWidth * 0.18;
                    ctx.fillStyle = isEdge
                        ? `rgba(255, 104, 146, ${alpha * 0.92})`
                        : `rgba(106, 46, 192, ${alpha})`;
                    ctx.fillRect(stripe, drawStartY, 1, drawEndY - drawStartY);

                    const stripeRatio = (stripe - drawStartX) / Math.max(1, spriteWidth);
                    if (stripeRatio > 0.28 && stripeRatio < 0.42) {
                        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                        ctx.fillRect(stripe, drawStartY + spriteHeight * 0.22, 1, spriteHeight * 0.1);
                    }
                    if (stripeRatio > 0.58 && stripeRatio < 0.72) {
                        ctx.fillStyle = `rgba(111,243,255,${alpha})`;
                        ctx.fillRect(stripe, drawStartY + spriteHeight * 0.22, 1, spriteHeight * 0.1);
                    }
                } else { // Reaction gem / mascot shard
                    const alpha = Math.max(0.18, 1 - transformY / 10);
                    const center = (drawStartX + drawEndX) / 2;
                    const distanceFromCenter = Math.abs(stripe - center) / Math.max(1, spriteWidth / 2);
                    const topOffset = spriteHeight * (0.16 + distanceFromCenter * 0.16);
                    const height = spriteHeight * (0.68 - distanceFromCenter * 0.22);
                    ctx.fillStyle = distanceFromCenter < 0.32
                        ? `rgba(255,255,255,${alpha})`
                        : `rgba(111,243,255,${alpha})`;
                    ctx.fillRect(stripe, drawStartY + topOffset, 1, height);
                }
            }
        }
    }
}

/**
 * §4 Helpers & Generators
 */
function generateMap(w, h) {
    let map = [];
    for(let x=0; x<w; x++) {
        map[x] = [];
        for(let y=0; y<h; y++) {
            // Borders are walls
            if(x===0 || x===w-1 || y===0 || y===h-1) map[x][y] = 1;
            // Random walls inside
            else map[x][y] = Math.random() < 0.15 ? 1 : 0;
        }
    }
    return map;
}

function generateTextures() {
    // We are using procedural colors in render loop for performance/simplicity in single file
    // But we could generate a canvas pattern here if needed.
    // For "Minecraft" style, solid colors with noise are fine.
}

function spawnParticles(x, y, color) {
    // Visual only, 2D overlay effect?
    // In raycaster, particles are hard without sprite system.
    // We'll skip 3D particles and do a screen flash instead.
    const flash = document.createElement('div');
    flash.className = 'absolute inset-0 z-40 pointer-events-none mix-blend-add';
    flash.style.backgroundColor = color;
    flash.style.opacity = 0.3;
    flash.style.transition = 'opacity 0.2s';
    document.getElementById('game-container').appendChild(flash);
    requestAnimationFrame(() => flash.style.opacity = 0);
    setTimeout(() => flash.remove(), 200);
}

 function updateHUD() {
     document.getElementById('score-display').textContent = Math.ceil(player.hp);
     document.getElementById('gem-display').textContent = player.diamonds;
 }

function vibrate(type) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

 function playSfx(id, cooldown = 90) {
    const now = performance.now();
    if (lastSfxAt[id] && now - lastSfxAt[id] < cooldown) return;
    lastSfxAt[id] = now;

    const el = document.getElementById(id);
    if (el) {
        el.currentTime = 0;
        el.play().catch(() => {
            // Fallback Synth
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (id === 'sfx_damage') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.12);
                } else if (id === 'sfx_pickup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(720, audioCtx.currentTime + 0.16);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.18);
                }
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        });
    }
}
