<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zen Sudoku Flow</title>
    <!-- [agent-note][stage4] font-remap: approved catalog fonts only | title->Audiowide ui->Rajdhani -->

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08111f;
            --bg-top: #132846;
            --panel: rgba(12, 24, 43, 0.78);
            --panel-border: rgba(106, 222, 255, 0.32);
            --text: #edf8ff;
            --muted: #8eb2cc;
            --grid-line: rgba(183, 234, 255, 0.18);
            --grid-strong: rgba(111, 221, 255, 0.9);
            --select: rgba(102, 223, 255, 0.28);
            --match: rgba(122, 255, 209, 0.18);
            --cross: rgba(255, 255, 255, 0.06);
            --danger: #ff6d8e;
            --warning: #ffd36a;
            --glow: rgba(102, 223, 255, 0.35);
            --digit-fixed: #f7fbff;
            --digit-player: #74f6da;
            --digit-error: #ff8ca7;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(112, 222, 255, 0.14), transparent 38%),
                linear-gradient(180deg, var(--bg-top), var(--bg));
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body {
            color: var(--text);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(122, 255, 209, 0.1), transparent 18%),
                radial-gradient(circle at 85% 15%, rgba(122, 160, 255, 0.12), transparent 20%),
                radial-gradient(circle at 50% 100%, rgba(102, 223, 255, 0.08), transparent 30%);
            opacity: 0.9;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        .glass {
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        /* Prevent text selection everywhere */
        .select-none { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .overflow-hidden { overflow: hidden; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .z-50 { z-index: 50; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .w-80 { width: min(20rem, calc(100vw - 2rem)); }
        .min-w-\[80px\] { min-width: 80px; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .shadow-2xl { box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16); }
        .shadow-lg { box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18); }
        .bg-black\/10 { background: rgba(0, 0, 0, 0.1); }
        .bg-\[\#2D3436\] { background-color: #2D3436; }
        .text-white { color: #fff; }
        .text-gray-400 { color: var(--muted); }

        .text-xl { font-size: 1.25rem; line-height: 1.4; }

        .active\:scale-95:active { transform: scale(0.95); }

        button { border: 0; font-family: 'Rajdhani', system-ui, sans-serif; font-size: inherit; font-weight: inherit; line-height: inherit; }

            white-space: nowrap;
        }
        .result-card {
            position: relative;
            overflow: hidden;
        }
        .result-card::before {
            content: "";

            inset: 0;
            background:
                radial-gradient(circle at top, rgba(116, 246, 218, 0.22), transparent 38%),

        }
        .arcade-btn {
            background: linear-gradient(180deg, #73ffe4, #3ed7ff);
            color: #06111e;
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.08em;

        }
        .result-gif {
            width: min(148px, 38vw);
            height: min(112px, 28vw);

            border-radius: 1rem;

            margin: 0 auto 1rem;

        .result-gif.is-visible {

        .feedback-burst {
            position: absolute;
            right: 1rem;
            bottom: calc(1rem + env(safe-area-inset-bottom));
            width: min(96px, 24vw);
            height: min(96px, 24vw);
            object-fit: cover;
            border-radius: 1rem;

        .feedback-burst.show {

<script>
/**
 * §0 System Core & Invariants
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let gameConfig = {};
let lastTime = 0;
let dt = 0;

// State
let board = [];
let selectedIndex = -1;
let mistakes = 0;
let timer = 0;
let particles = [];
let shake = 0;
let uiZones = null; // Single source of truth for layout

const VISUAL_THEME = {
    bg: ['#08111f', '#132846'],
    gridFill: '#0d1a2c',
    gridLine: 'rgba(183, 234, 255, 0.18)',
    gridStrong: 'rgba(111, 221, 255, 0.92)',
    crosshair: 'rgba(255, 255, 255, 0.06)',
    matchGlow: 'rgba(122, 255, 209, 0.18)',
    selection: 'rgba(102, 223, 255, 0.28)',
    fixed: '#f7fbff',
    player: '#74f6da',
    error: '#ff8ca7',
    danger: '#ff6d8e',
    warning: '#ffd36a'
};

const GIFS = {
    success: 'https://i.giphy.com/ye080RbECtcCnkrSyD.webp',
    fail: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp',
    burst: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp'
};

const resultGif = document.getElementById('result-gif');
const feedbackBurst = document.getElementById('feedback-burst');

// Audio Context
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const sounds = {
    bgm: document.getElementById('bgm_main'),
    select: document.getElementById('sfx_select'),
    correct: document.getElementById('sfx_correct'),
    error: document.getElementById('sfx_error'),
    clear: document.getElementById('sfx_clear'),
    win: document.getElementById('sfx_win'),
    gameover: document.getElementById('sfx_gameover')
};
let audioUnlocked = false;
let feedbackBurstTimer = null;
let lastSoundAt = {};

/**
 * §1 Lifecycle
 */
document.addEventListener('DOMContentLoaded', () => {
    // 1. Config
    try {
        const raw = JSON.parse(document.getElementById('game-config').textContent);
        for (let k in raw) gameConfig[k] = raw[k].value;
        window.gameConfigDefs = raw;
    } catch (e) {
        gameConfig = { difficulty: 35, themeColor: '#6C5CE7', mistakeLimit: 3 };
    }

    // 2. Setup
    resize();
    window.addEventListener('resize', resize);
    
    // 3. Input Routing
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    // [agent-note][stage4] repaired: mobile-action-path | scope pointer suppression to gameplay surface
    canvas.addEventListener('pointermove', handleGamePointerMove, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        restartGame();
    });

    // 4. Start
    initGame();
    setState('PLAYING');
    
    // L1 Audio Setup
    sounds.bgm.volume = 0.18;
    sounds.bgm.loop = true;

    requestAnimationFrame(loop);
});

function resize() {
    cw = document.documentElement.clientWidth;
    ch = document.documentElement.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    // Recalculate layout zones immediately
    uiZones = getLayoutZones();
}

function initGame() {
    board = generateSudoku(gameConfig.difficulty);
    selectedIndex = -1;
    mistakes = 0;
    timer = 0;
    particles = [];
    shake = 0;
    updateHUD();
}

function restartGame() {
    unlockAudio();
    initGame();
    setState('PLAYING');
}

function setState(s) {
    gameState = s;
    const ui = document.getElementById('ui-layer');
    const gameOver = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');

    if (s === 'PLAYING') {
        gameOver.classList.add('hidden');
        hud.classList.remove('opacity-0');
        hideResultGif();
        ensureBgmPlayback();
    } else if (s === 'GAMEOVER') {
        gameOver.classList.remove('hidden');
        hud.classList.add('opacity-0'); // Fade out HUD
        stopBgm();
    }
}

/**
 * §2 Layout System (The Fix)
 * Single source of truth for rendering and hit testing.
 */
function getLayoutZones() {
    const zones = {
        grid: {},
        numpad: []
    };

    // 1. Grid Layout
    // Max width is screen width minus padding
    // Max height is ~60% of screen height to leave room for numpad
    const padding = 24;
    const maxGridW = cw - (padding * 2);
    const maxGridH = ch * 0.55;
    const gridSize = Math.min(maxGridW, maxGridH);
    
    const gridX = (cw - gridSize) / 2;
    const gridY = 100; // Top margin below HUD
    
    zones.grid = {
        x: gridX,
        y: gridY,
        size: gridSize,
        cellSize: gridSize / 9
    };

    // 2. Numpad Layout
    // Positioned below grid
    const padY = gridY + gridSize + 40;
    
    // We want 2 rows of buttons
    // Row 1: 1-5
    // Row 2: 6-9, Delete
    // Button size calculation
    const cols = 5;
    const btnGap = 12;
    const availableWidth = cw - (padding * 2);
    const btnSize = (availableWidth - (btnGap * (cols - 1))) / cols;
    
    // Constrain button size if too huge on tablets
    const finalBtnSize = Math.min(btnSize, 64);
    
    // Recalculate start X to center the block
    const totalRowWidth = (finalBtnSize * cols) + (btnGap * (cols - 1));
    const startX = (cw - totalRowWidth) / 2;

    // Generate hit zones
    // Row 1
    for (let i = 0; i < 5; i++) {
        zones.numpad.push({
            val: i + 1,
            x: startX + i * (finalBtnSize + btnGap),
            y: padY,
            w: finalBtnSize,
            h: finalBtnSize
        });
    }
    // Row 2
    for (let i = 0; i < 5; i++) {
        const val = (i < 4) ? (i + 6) : 'X'; // 6,7,8,9,X
        zones.numpad.push({
            val: val,
            x: startX + i * (finalBtnSize + btnGap),
            y: padY + finalBtnSize + btnGap,
            w: finalBtnSize,
            h: finalBtnSize
        });
    }

    return zones;
}

/**
 * §3 Input Handling
 */
function handleGlobalInput(e) {
    if (e.target && e.target.closest && e.target.closest('#restart-btn')) {
        unlockAudio();
        return;
    }

    e.preventDefault();
    unlockAudio(); // L2 Unlock

    if (gameState === 'GAMEOVER') return;
    if (gameState === 'PLAYING') handleGameInput(e);
}

function handleGamePointerMove(e) {
    if (gameState !== 'PLAYING') return;
    if (e.pointerType === 'touch' || e.pointerType === 'pen') {
        e.preventDefault();
    }
}

function handleGameInput(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (!uiZones) uiZones = getLayoutZones();

    // 1. Check Grid Click
    const g = uiZones.grid;
    if (x >= g.x && x <= g.x + g.size && y >= g.y && y <= g.y + g.size) {
        const c = Math.floor((x - g.x) / g.cellSize);
        const r = Math.floor((y - g.y) / g.cellSize);
        const idx = r * 9 + c;
        if (idx >= 0 && idx < 81) {
            selectedIndex = idx;
            playSound('select', 0.45, 60);
        }
        return;
    }

    // 2. Check Numpad Click
    // Only if a cell is selected and not fixed
    if (selectedIndex !== -1 && !board[selectedIndex].isFixed) {
        for (let btn of uiZones.numpad) {
            if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                handleNumpadAction(btn.val);
                return;
            }
        }
    }
}

function handleNumpadAction(val) {
    if (val === 'X') {
        // Erase
        if (board[selectedIndex].val !== 0) {
            board[selectedIndex].val = 0;
            board[selectedIndex].isError = false;
            playSound('clear', 0.6, 80);
            vibrate('light');
        }
    } else {
        // Number
        attemptMove(val);
    }
}

function attemptMove(num) {
    const cell = board[selectedIndex];
    if (cell.val === num) return;

    if (num === cell.solution) {
        // Correct
        cell.val = num;
        cell.isError = false;
        cell.animScale = 1.4;
        playSound('correct', 0.55, 80);
        vibrate('light');
        spawnParticles(selectedIndex, gameConfig.themeColor);
        showFeedbackBurst();
        
        // Check if number is complete (visual feedback could be added here)
        checkWin();
    } else {
        // Wrong
        cell.val = num;
        cell.isError = true;
        mistakes++;
        shake = 15;
        playSound('error', 0.6, 90);
        vibrate('heavy');
        updateHUD();
        if (mistakes >= gameConfig.mistakeLimit) {
            endGame(false);
        }
    }
}

/**
 * §4 Logic & Sudoku
 */
function generateSudoku(difficulty) {
    const grid = Array(81).fill(0);
    // Fill diagonal boxes
    for (let i = 0; i < 9; i += 3) fillBox(grid, i, i);
    // Solve
    solveSudoku(grid);
    const solution = [...grid];
    // Remove
    let attempts = difficulty;
    while (attempts > 0) {
        let idx = Math.floor(Math.random() * 81);
        if (grid[idx] !== 0) {
            grid[idx] = 0;
            attempts--;
        }
    }
    return grid.map((val, i) => ({
        val: val,
        solution: solution[i],
        isFixed: val !== 0,
        isError: false,
        animScale: 1
    }));
}

function fillBox(grid, row, col) {
    let num;
    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            do { num = Math.floor(Math.random() * 9) + 1; }
            while (!isSafeBox(grid, row, col, num));
            grid[(row + i) * 9 + (col + j)] = num;
        }
    }
}

function isSafeBox(grid, rowStart, colStart, num) {
    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            if (grid[(rowStart + i) * 9 + (colStart + j)] === num) return false;
        }
    }
    return true;
}

function solveSudoku(grid) {
    for (let i = 0; i < 81; i++) {
        if (grid[i] === 0) {
            for (let num = 1; num <= 9; num++) {
                if (isSafe(grid, i, num)) {
                    grid[i] = num;
                    if (solveSudoku(grid)) return true;
                    grid[i] = 0;
                }
            }
            return false;
        }
    }
    return true;
}

function isSafe(grid, idx, num) {
    const row = Math.floor(idx / 9);
    const col = idx % 9;
    for (let x = 0; x < 9; x++) {
        if (grid[row * 9 + x] === num) return false;
        if (grid[x * 9 + col] === num) return false;
    }
    const startRow = row - row % 3;
    const startCol = col - col % 3;
    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            if (grid[(startRow + i) * 9 + (startCol + j)] === num) return false;
        }
    }
    return true;
}

function checkWin() {
    const isWin = board.every(c => c.val === c.solution);
    if (isWin) endGame(true);
}

function endGame(win) {
    setState('GAMEOVER');
    const title = document.getElementById('result-title');
    const desc = document.getElementById('result-desc');
    const icon = document.getElementById('result-icon');
    
    if (win) {
        playSound('win', 0.7, 120);
        showResultGif(true);
        icon.innerText = "🧘";
        title.innerText = "Grid Cleared";
        desc.innerText = `Pulse stabilized in ${document.getElementById('timer-display').innerText}`;
    } else {
        playSound('gameover', 0.68, 120);
        showResultGif(false);
        icon.innerText = "⚠️";
        title.innerText = "Flow Broken";
        desc.innerText = "Too many glitches. Reset and realign the grid.";
    }
}

function updateHUD() {
    document.getElementById('mistakes-display').innerText = `${mistakes}/${gameConfig.mistakeLimit}`;
    document.getElementById('mistakes-display').style.color = mistakes > 0 ? VISUAL_THEME.danger : VISUAL_THEME.player;
}

/**
 * §5 Rendering
 */
function loop(now) {
    dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;

    if (gameState === 'PLAYING') {
        timer += dt;
        const m = Math.floor(timer / 60).toString().padStart(2, '0');
        const s = Math.floor(timer % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
    }

    if (shake > 0) {
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    drawBackdrop();

    // Shake Camera
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    if (!uiZones) uiZones = getLayoutZones();

    drawGrid();
    drawNumpad();
    drawParticles();

    ctx.restore();
    requestAnimationFrame(loop);
}

function drawBackdrop() {
    const gradient = ctx.createLinearGradient(0, 0, 0, ch);
    gradient.addColorStop(0, VISUAL_THEME.bg[1]);
    gradient.addColorStop(1, VISUAL_THEME.bg[0]);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cw, ch);

    const orbitGradient = ctx.createRadialGradient(cw * 0.5, ch * 0.18, 0, cw * 0.5, ch * 0.18, Math.max(cw, ch) * 0.65);
    orbitGradient.addColorStop(0, 'rgba(102, 223, 255, 0.18)');
    orbitGradient.addColorStop(0.45, 'rgba(122, 255, 209, 0.08)');
    orbitGradient.addColorStop(1, 'rgba(8, 17, 31, 0)');
    ctx.fillStyle = orbitGradient;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.globalAlpha = 0.16;
    for (let i = 0; i < 5; i++) {
        const radius = Math.min(cw, ch) * (0.18 + i * 0.055);
        ctx.beginPath();
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(102, 223, 255, 0.18)' : 'rgba(122, 255, 209, 0.12)';
        ctx.lineWidth = 1;
        ctx.arc(cw / 2, ch * 0.22, radius, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();
}

function drawGridFrame(g) {
    ctx.save();
    roundRect(g.x - 10, g.y - 10, g.size + 20, g.size + 20, 24);
    const panelGradient = ctx.createLinearGradient(g.x, g.y, g.x, g.y + g.size);
    panelGradient.addColorStop(0, 'rgba(14, 30, 52, 0.96)');
    panelGradient.addColorStop(1, 'rgba(8, 19, 34, 0.96)');
    ctx.fillStyle = panelGradient;
    ctx.fill();
    ctx.strokeStyle = 'rgba(111, 221, 255, 0.36)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(122, 255, 209, 0.18)';
    ctx.lineWidth = 1;
    roundRect(g.x - 4, g.y - 4, g.size + 8, g.size + 8, 18);
    ctx.stroke();
    ctx.restore();
}

function drawGrid() {
    const g = uiZones.grid;
    const cellSize = g.cellSize;

    drawGridFrame(g);

    ctx.save();
    roundRect(g.x, g.y, g.size, g.size, 18);
    ctx.clip();
    ctx.fillStyle = VISUAL_THEME.gridFill;
    ctx.fillRect(g.x, g.y, g.size, g.size);

    // 1. Highlights
    if (selectedIndex !== -1) {
        const r = Math.floor(selectedIndex / 9);
        const c = selectedIndex % 9;
        const val = board[selectedIndex].val;

        ctx.fillStyle = VISUAL_THEME.crosshair;
        ctx.fillRect(g.x, g.y + r * cellSize, g.size, cellSize);
        ctx.fillRect(g.x + c * cellSize, g.y, cellSize, g.size);

        const br = Math.floor(r/3)*3;
        const bc = Math.floor(c/3)*3;
        ctx.fillRect(g.x + bc * cellSize, g.y + br * cellSize, cellSize*3, cellSize*3); // Box highlight

        // Same number highlight
        if (val !== 0) {
            ctx.fillStyle = VISUAL_THEME.matchGlow;
            for(let i=0; i<81; i++) {
                if(board[i].val === val) {
                    const ir = Math.floor(i/9);
                    const ic = i%9;
                    ctx.fillRect(g.x + ic*cellSize, g.y + ir*cellSize, cellSize, cellSize);
                }
            }
        }

        // Selection
        ctx.fillStyle = VISUAL_THEME.selection;
        ctx.fillRect(g.x + c * cellSize, g.y + r * cellSize, cellSize, cellSize);
    }

    // 2. Grid Lines
    ctx.beginPath();
    for (let i = 0; i <= 9; i++) {
        const pos = i * cellSize;
        ctx.lineWidth = (i % 3 === 0) ? 2.6 : 1;
        ctx.strokeStyle = (i % 3 === 0) ? VISUAL_THEME.gridStrong : VISUAL_THEME.gridLine;
        
        ctx.moveTo(g.x + pos, g.y);
        ctx.lineTo(g.x + pos, g.y + g.size);
        ctx.moveTo(g.x, g.y + pos);
        ctx.lineTo(g.x + g.size, g.y + pos);
    }
    ctx.stroke();

    // 3. Numbers
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${cellSize * 0.54}px 'Audiowide'`;

    for (let i = 0; i < 81; i++) {
        const cell = board[i];
        if (cell.val === 0) continue;

        const r = Math.floor(i / 9);
        const c = i % 9;
        const cx = g.x + c * cellSize + cellSize / 2;
        const cy = g.y + r * cellSize + cellSize / 2 + 2;

        let scale = 1;
        if (cell.animScale > 1) {
            cell.animScale -= dt * 3;
            if (cell.animScale < 1) cell.animScale = 1;
            scale = cell.animScale;
        }

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        if (cell.isError) ctx.fillStyle = VISUAL_THEME.error;
        else if (cell.isFixed) ctx.fillStyle = VISUAL_THEME.fixed;
        else ctx.fillStyle = VISUAL_THEME.player;

        if (cell.isFixed) {
            ctx.shadowColor = 'rgba(255, 255, 255, 0.22)';
            ctx.shadowBlur = 8;
        } else if (cell.isError) {
            ctx.shadowColor = 'rgba(255, 109, 142, 0.45)';
            ctx.shadowBlur = 10;
        } else {
            ctx.shadowColor = 'rgba(116, 246, 218, 0.55)';
            ctx.shadowBlur = 12;
        }

        ctx.fillText(cell.val, 0, 0);
        ctx.restore();
    }

    ctx.restore();
}

function drawNumpad() {
    // Only show if selection is valid for input
    if (selectedIndex === -1 || board[selectedIndex].isFixed) return;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    for (let btn of uiZones.numpad) {
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.24)';
        roundRect(btn.x, btn.y + 5, btn.w, btn.h, 16);
        ctx.fill();

        // Button Body
        const isDelete = btn.val === 'X';
        const buttonGradient = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
        buttonGradient.addColorStop(0, isDelete ? 'rgba(255, 224, 126, 0.98)' : 'rgba(24, 44, 75, 0.98)');
        buttonGradient.addColorStop(1, isDelete ? 'rgba(255, 186, 92, 0.98)' : 'rgba(10, 22, 42, 0.98)');
        ctx.fillStyle = buttonGradient;
        roundRect(btn.x, btn.y, btn.w, btn.h, 16);
        ctx.fill();

        // Border
        ctx.strokeStyle = isDelete ? 'rgba(255, 226, 142, 0.75)' : 'rgba(102, 223, 255, 0.38)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Text
        ctx.shadowColor = isDelete ? 'rgba(255, 109, 142, 0.16)' : 'rgba(102, 223, 255, 0.34)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = isDelete ? VISUAL_THEME.danger : VISUAL_THEME.fixed;
        ctx.font = `700 ${btn.w * 0.48}px 'Audiowide'`;
        ctx.fillText(btn.val, btn.x + btn.w/2, btn.y + btn.h/2 + 2);
    }
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

/**
 * §6 Particles & Audio
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 150 + 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 6 + 3;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2;
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function spawnParticles(idx, color) {
    const g = uiZones.grid;
    const r = Math.floor(idx / 9);
    const c = idx % 9;
    const cx = g.x + c * g.cellSize + g.cellSize / 2;
    const cy = g.y + r * g.cellSize + g.cellSize / 2;

    for (let i = 0; i < 12; i++) {
        particles.push(new Particle(cx, cy, color));
    }
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(dt);
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    audioUnlocked = true;
    ensureBgmPlayback();
}

function ensureBgmPlayback() {
    const bgm = sounds.bgm;
    if (!audioUnlocked || !bgm || gameState !== 'PLAYING') return;
    bgm.volume = 0.18;
    if (bgm.paused) bgm.play().catch(() => {});
}

function stopBgm() {
    const bgm = sounds.bgm;
    if (!bgm) return;
    bgm.pause();
    bgm.currentTime = 0;
}

function playSound(id, vol = 1, cooldownMs = 0) {
    const now = performance.now();
    if (cooldownMs && lastSoundAt[id] && now - lastSoundAt[id] < cooldownMs) return;
    lastSoundAt[id] = now;

    const el = sounds[id];
    if (el) {
        el.pause();
        el.currentTime = 0;
        el.volume = vol;
        el.play().catch(() => playSynth(id, vol));
    } else {
        playSynth(id, vol);
    }
}

function playSynth(type, vol = 1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if (type === 'correct' || type === 'select') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(type === 'select' ? 380 : 500, now);
        osc.frequency.exponentialRampToValueAtTime(type === 'select' ? 620 : 1000, now + 0.1);
        gain.gain.setValueAtTime(0.18 * vol, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    } else if (type === 'error' || type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(type === 'gameover' ? 130 : 150, now);
        osc.frequency.linearRampToValueAtTime(95, now + 0.22);
        gain.gain.setValueAtTime(0.18 * vol, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
    } else if (type === 'clear') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(180, now + 0.14);
        gain.gain.setValueAtTime(0.12 * vol, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
    } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.linearRampToValueAtTime(920, now + 0.24);
        gain.gain.setValueAtTime(0.2 * vol, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.24);
        osc.start(now);
        osc.stop(now + 0.24);
    }
}

function showFeedbackBurst() {
    if (!feedbackBurst) return;
    feedbackBurst.src = GIFS.burst;
    feedbackBurst.classList.add('show');
    clearTimeout(feedbackBurstTimer);
    feedbackBurstTimer = setTimeout(() => {
        feedbackBurst.classList.remove('show');
    }, 850);
}

function showResultGif(win) {
    if (!resultGif) return;
    resultGif.src = win ? GIFS.success : GIFS.fail;
    resultGif.classList.add('is-visible');
}

function hideResultGif() {
    if (!resultGif) return;
    resultGif.classList.remove('is-visible');
    resultGif.removeAttribute('src');
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}
