<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sizzle Chef Rush</title>
    <!-- [agent-note][stage3] resolved-font: title/body -> Bangers + Press Start 2P from catalogs/fonts.json -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <!-- [agent-note][stage4] repaired: approved-font-remap | body-ui: Rajdhani | retro-hud: Press Start 2P | display: Bangers -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #170f13;
            --panel: rgba(44, 22, 18, 0.84);
            --panel-border: rgba(255, 208, 168, 0.42);
            --shadow: 0 16px 30px rgba(0, 0, 0, 0.28);
            --orange-50: rgba(39, 21, 20, 0.94);
            --orange-500: #FF7A2F;
            --orange-600: #FF9A3C;
            --orange-700: #D94A1E;
            --orange-800: #FFE1B3;
            --red-500: #FF5A5F;
            --red-600: #FF4040;
            --green-500: #4EEA8A;
            --green-600: #2FD370;
            --green-700: #1FA95A;
            --text-gray: #FFF1D6;
            --text-light: #FFD29C;
            --ember: #FFBE55;
            --charcoal: #241318;
            --counter-top: #5A2B1D;
            --counter-front: #341817;
            --chef-cream: #FFF6E5;
            --chef-accent: #29D3C2;
            --customer-1: #FF7A59;
            --customer-2: #8D63FF;
            --customer-3: #29C7B8;
            --customer-4: #FFD166;
            --hud-glow: 0 0 18px rgba(255, 122, 47, 0.32);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 154, 60, 0.18), transparent 34%),
                linear-gradient(180deg, #25131a 0%, #12090d 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-gray);
        }

        body {
            user-select: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 190, 85, 0.18), transparent 18%),
                radial-gradient(circle at 78% 10%, rgba(41, 211, 194, 0.14), transparent 20%),
                radial-gradient(circle at 50% 100%, rgba(255, 90, 95, 0.14), transparent 24%);
        }

        body::after {
            opacity: 0.18;
            background-image:
                linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: soft-light;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .screen-reader-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(71, 33, 26, 0.92), rgba(30, 13, 14, 0.92));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .btn-push {
            transition: transform 0.1s, background-color 0.1s;
            cursor: pointer;
            border: none;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            letter-spacing: 0.06em;
        }

        .btn-push:active {
            transform: scale(0.95);
        }

        #game-container,
        #gameCanvas {
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            box-sizing: border-box;
        }

        #hud {
            display: none;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 12px;
        }

        #hud.flex {
            display: flex;
        }

        .hud-pill {
            border-radius: 999px;
            font-weight: 700;
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow: var(--hud-glow);
        }

        .hud-score {
            padding: 10px 24px;
            font-size: clamp(1.2rem, 2.8vw, 2rem);
            color: var(--orange-800);
            border-bottom: 4px solid rgba(255, 190, 85, 0.45);
        }

        .hud-missed {
            padding: 10px 18px;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            color: var(--red-600);
        }


        #feedback-gif-layer {
            position: absolute;
            right: 14px;
            bottom: 120px;
            z-index: 45;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .feedback-gif {
            width: min(32vw, 112px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255, 209, 155, 0.5);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.32);
            background: rgba(22, 11, 15, 0.72);
            opacity: 0.92;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 50;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        #start-screen {
            background:
                radial-gradient(circle at top, rgba(255, 154, 60, 0.16), transparent 30%),
                linear-gradient(180deg, rgba(20, 10, 12, 0.86), rgba(15, 8, 11, 0.96));
        }

        #game-over-screen {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        .hidden {
            display: none !important;
        }

        .title {
            margin: 0 0 8px;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            line-height: 0.95;
            color: var(--orange-600);
            letter-spacing: 0.08em;
            text-shadow: 0 3px 0 rgba(73, 22, 16, 0.8), 0 0 24px rgba(255, 154, 60, 0.36);
        }

        .subtitle {
            margin: 0 0 28px;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: var(--text-light);
            font-weight: 700;
            letter-spacing: 0.16em;
            text-shadow: 0 0 14px rgba(255, 190, 85, 0.18);
            animation: pulse 1.8s ease-in-out infinite;
        }

        .card {
            background:
                linear-gradient(180deg, rgba(63, 29, 24, 0.94), rgba(24, 10, 12, 0.96));
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.22);
            max-width: 320px;
            width: min(100%, 320px);
            margin-bottom: 28px;
            border: 2px solid rgba(255, 190, 85, 0.26);
            box-sizing: border-box;
        }

        .card-label {
            margin: 0 0 10px;
            color: var(--text-gray);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .instruction-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            color: rgba(255, 241, 214, 0.88);
            font-size: 0.98rem;
            display: grid;
            gap: 10px;
        }

        .instruction-list b {
            color: #FFFFFF;
        }

        .primary-btn,
        .secondary-btn {
            color: #FFF;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            padding: 16px 40px;
            border-radius: 999px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.14);
        }

        .primary-btn {
            background: linear-gradient(180deg, var(--orange-600), var(--orange-500));
            border-bottom: 4px solid var(--orange-700);
        }

        .primary-btn:hover {
            background: var(--orange-600);
        }

        .secondary-btn {
            background: linear-gradient(180deg, var(--green-500), #2ABF86);
            border-bottom: 4px solid var(--green-700);
        }

        .secondary-btn:hover {
            background: var(--green-600);
        }

        .game-over-card {
            padding: 32px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.2);
        }

        .game-over-title {
            margin: 0 0 8px;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: clamp(2.8rem, 8vw, 4.5rem);
            color: var(--red-500);
            letter-spacing: 0.06em;
            text-shadow: 0 0 22px rgba(255, 90, 95, 0.24);
        }

        .final-score {
            margin: 0 0 24px;
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--ember);
            font-weight: 600;
        }

        .final-score span {
            color: var(--orange-600);
            font-weight: 700;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 12px;
            }

            #hud {
                gap: 8px;
            }

            .hud-score,
            .hud-missed {
                padding: 10px 14px;
            }

            #feedback-gif-layer {
                right: 10px;
                bottom: 108px;
            }

            .feedback-gif {
                width: min(28vw, 84px);
            }

            .card,
            .game-over-card {
                width: min(100%, 300px);
                padding: 20px;
            }

            .primary-btn,
            .secondary-btn {
                width: min(100%, 300px);
            }
        }
    </style>
    
    <!-- Game Configuration -->
    <script id="game-config" type="application/x-game-config">
    {
        "cookSpeed": { "type": "number", "label": "Cooking Speed", "value": 1.5, "min": 0.5, "max": 5 },
        "burnSpeed": { "type": "number", "label": "Burn Speed", "value": 1.0, "min": 0.5, "max": 5 },
        "spawnRate": { "type": "number", "label": "Customer Spawn Rate", "value": 2000, "min": 500, "max": 5000 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#FF6F00" }
    }
    </script>

<body>

    <!-- Audio Assets -->
    <!-- [agent-note][stage3] resolved-audio: start/serve/burn/game-over -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Kitchen Rush" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Start Game" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
    <audio id="sfx_click" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_ready" data-editable="audio" data-label="SFX Ready" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3" preload="auto"></audio>
    <audio id="sfx_serve" data-editable="audio" data-label="SFX Serve" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="SFX Burn Fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>

    <!-- Game Container -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer">
            
            <!-- HUD -->
            <div id="hud">
                <div class="glass hud-pill hud-score">
                    SCORE: <span id="score">0</span>
                </div>
                <div class="glass hud-pill hud-missed">
                    MISSED: <span id="missed">0</span>/3
                </div>
            </div>

            <!-- Feedback GIF overlays -->
            <!-- [agent-note][stage3] resolved-gif: serve/fail reaction overlays -> catalogs/gifs.json -->
            <div id="feedback-gif-layer" aria-hidden="true">
                <img id="serve-gif" class="feedback-gif hidden" alt="" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp">
                <img id="fail-gif" class="feedback-gif hidden" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="overlay">
                <h1 class="title">SIZZLE CHEF</h1>
                <p class="subtitle">GRILL • SERVE • SURVIVE</p>
                <div class="card">
                    <p class="card-label">Instructions:</p>
                    <ul class="instruction-list">
                        <li>👆 <b>Tap a pan</b> to start cooking</li>
                        <li>🟢 Wait for the <b>green READY cue</b></li>

                    </ul>

                </button>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="overlay hidden">
                <div class="glass game-over-card">
                    <h2 class="game-over-title">KITCHEN CLOSED</h2>
                    <div class="final-score">Final Score: <span id="finalScore">0</span></div>
                    <button id="restart-btn" class="btn-push secondary-btn">
                        COOK AGAIN
                    </button>
                </div>

        </div>

    <script>
        // --- §3 Configuration & State ---
        window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = {};
        
        // Initialize Config
        for (let key in window.gameConfigDefs) {
            window.gameConfig[key] = window.gameConfigDefs[key].value;
        }

        window.updateGameConfig = (key, val) => {
            if (window.gameConfigDefs[key]) {
                window.gameConfig[key] = val;
                // Hot reload logic
                if (key === 'themeColor') {
                    // Handled in draw loop
                }
            }
        };

        // --- Core State ---
        let canvas, ctx;
        let lastTime = 0;
        let isPlaying = false;
        let score = 0;
        let missed = 0;
        let gameOver = false;
        let particles = [];
        let customers = [];
        let pans = [];
        let customerTimer = 0;
        let shake = 0;

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const sounds = {
            bgm: document.getElementById('bgm_main'),
            start: document.getElementById('sfx_start'),
            click: document.getElementById('sfx_click'),
            ready: document.getElementById('sfx_ready'),
            serve: document.getElementById('sfx_serve'),
            fail: document.getElementById('sfx_fail'),
            blocked: document.getElementById('sfx_blocked'),
            gameover: document.getElementById('sfx_gameover')
        };
        const feedbackGifs = {
            serve: document.getElementById('serve-gif'),
            fail: document.getElementById('fail-gif')
        };
        let audioUnlocked = false;
        let lastSizzleAt = 0;
        let lastPlayTimes = {};
        let gifTimer = null;

        function unlockAudio() {
            if (audioUnlocked) return;
            audioCtx.resume().then(() => {
                audioUnlocked = true;
                sounds.bgm.volume = 0.2;
                sounds.bgm.play().catch(() => {});
            }).catch(() => {});
        }

        function showFeedbackGif(type) {
            Object.values(feedbackGifs).forEach(el => el.classList.add('hidden'));
            const gif = feedbackGifs[type];
            if (!gif) return;
            clearTimeout(gifTimer);
            gif.classList.remove('hidden');
            gifTimer = setTimeout(() => gif.classList.add('hidden'), 1400);
        }

        function playSound(id) {
            if (!audioUnlocked) return;
            if (id === 'sizzle') {
                const now = performance.now();
                if (now - lastSizzleAt < 180) return;
                lastSizzleAt = now;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(50, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.1);
                filter.type = 'highpass';
                filter.frequency.value = 800;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                return;
            }

            const sound = sounds[id];
            if (!sound) return;
            const now = performance.now();
            if (lastPlayTimes[id] && now - lastPlayTimes[id] < 120) return;
            lastPlayTimes[id] = now;
            sound.pause();
            sound.currentTime = 0;
            if (id === 'bgm') sound.volume = 0.2;
            if (id === 'ready') sound.volume = 0.4;
            if (id === 'click') sound.volume = 0.38;
            if (id === 'serve') sound.volume = 0.5;
            if (id === 'fail' || id === 'gameover') sound.volume = 0.46;
            if (id === 'blocked') sound.volume = 0.34;
            sound.play().catch(() => {});
        }

        // --- Game Entities ---
        class Particle {
            constructor(x, y, color, type) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type; // 'smoke', 'coin', 'star'
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 100 + 50;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                if (type === 'smoke') this.vy = -Math.abs(this.vy) - 50; // Smoke goes up
                this.life = 1.0;
                this.decay = Math.random() * 1.5 + 0.5;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= this.decay * dt;
                if (this.type === 'coin') this.vy += 500 * dt; // Gravity
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'smoke') {
                    ctx.arc(this.x, this.y, 10 * (2 - this.life), 0, Math.PI * 2);
                } else {
                    ctx.fillRect(this.x, this.y, 8, 8);
                }
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Pan {
            constructor(index, x, y, size) {
                this.index = index;
                this.x = x;
                this.y = y;
                this.size = size;
                this.state = 'empty'; // empty, cooking, cooked, burned
                this.progress = 0;
                this.scale = 1;
            }

            interact() {
                this.scale = 0.8; // Click feedback
                if (this.state === 'empty') {
                    this.state = 'cooking';
                    this.progress = 0;
                    playSound('sizzle');
                } else if (this.state === 'cooked') {
                    // Serve
                    if (customers.length > 0) {
                        // Serve first customer
                        customers.shift();
                        spawnParticles(this.x, this.y, '#FFD700', 'coin');
                        score += 10;
                        document.getElementById('score').innerText = score;
                        playSound('serve');
                        this.reset();
                    } else {
                        // No customers, wasted food
                        spawnParticles(this.x, this.y, '#555', 'smoke');
                        playSound('blocked');
                        this.reset();
                    }
                } else if (this.state === 'burned') {
                    // Clean pan
                    spawnParticles(this.x, this.y, '#000', 'smoke');
                    this.reset();
                }
            }

            reset() {
                this.state = 'empty';
                this.progress = 0;
            }

            update(dt) {
                // Spring animation
                this.scale += (1 - this.scale) * 10 * dt;

                if (this.state === 'cooking' || this.state === 'cooked') {
                    // Progress logic
                    let rate = window.gameConfig.cookSpeed;
                    if (this.state === 'cooked') rate = window.gameConfig.burnSpeed; // Burn rate
                    
                    this.progress += rate * dt;

                    // Emit smoke occasionally
                    if (Math.random() < 0.1) {
                        spawnParticles(this.x + (Math.random()-0.5)*20, this.y, 'rgba(255,255,255,0.3)', 'smoke');
                    }

                    if (this.state === 'cooking' && this.progress >= 1.0) {
                        this.state = 'cooked';
                        this.progress = 0; // Start burn timer
                        playSound('ready');
                    } else if (this.state === 'cooked' && this.progress >= 1.0) {
                        this.state = 'burned';
                        shake = 10;
                        playSound('fail');
                        showFeedbackGif('fail');
                        missed++;
                        document.getElementById('missed').innerText = missed;
                        checkGameOver();
                    }
                }
            }

            draw(ctx) {
                // Pan Body
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                
                // Handle
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(-10, this.size, 20, 60);

                // Pan Circle
                ctx.fillStyle = '#37474F';
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#263238';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Food
                if (this.state !== 'empty') {
                    let foodColor = '#F48FB1'; // Raw Pink
                    if (this.state === 'cooking') {
                        // Interpolate Pink to Brown
                        foodColor = lerpColor('#F48FB1', '#795548', Math.min(1, this.progress));
                    } else if (this.state === 'cooked') {
                        // Interpolate Brown to Black (Burn phase)
                        foodColor = lerpColor('#795548', '#212121', Math.min(1, this.progress));
                    } else if (this.state === 'burned') {
                        foodColor = '#000000';
                    }

                    ctx.fillStyle = foodColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    // Progress Ring
                    if (this.state !== 'burned') {
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size + 10, -Math.PI/2, -Math.PI/2 + (Math.PI*2 * Math.min(1, this.progress)));
                        ctx.strokeStyle = this.state === 'cooking' ? '#FFF' : '#D32F2F';
                        ctx.lineWidth = 6;
                        ctx.stroke();
                        
                        // Ready Indicator
                        if (this.state === 'cooked') {
                            ctx.fillStyle = '#4CAF50';
                            ctx.font = '600 18px "Press Start 2P"';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('READY', 0, 0);
                        }
                    } else {
                        // Burned Icon
                        ctx.fillStyle = '#F44336';
                        ctx.font = '600 30px "Rajdhani"';
                        ctx.fillText('☠️', -15, 10);
                    }
                }

                ctx.restore();
            }
        }

        class Customer {
            constructor() {
                this.x = canvas.width + 50;
                this.targetX = canvas.width/2; // Will be arranged in line
                this.y = 150;
                this.state = 'waiting';
            }
            update(dt, index) {
                // Move into line
                let spacing = 100;
                let destX = (canvas.width/2) - (customers.length * spacing / 2) + (index * spacing);
                this.x += (destX - this.x) * 5 * dt;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.fillStyle = window.gameConfig.themeColor;
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(-10, -5, 8, 0, Math.PI*2);
                ctx.arc(10, -5, 8, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(-10, -5, 3, 0, Math.PI*2);
                ctx.arc(10, -5, 3, 0, Math.PI*2);
                ctx.fill();

                // Order Bubble
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.roundRect(20, -60, 60, 50, 10);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Burger Icon
                ctx.fillStyle = '#795548';
                ctx.beginPath();
                ctx.roundRect(35, -45, 30, 10, 5); // Patty
                ctx.fill();
                ctx.fillStyle = '#FFB74D';
                ctx.beginPath();
                ctx.arc(50, -50, 15, Math.PI, 0); // Top bun
                ctx.fill();
                ctx.fillRect(35, -35, 30, 5); // Bottom bun

                ctx.restore();
            }
        }

        // --- Helper Functions ---
        function lerpColor(a, b, amount) { 
            const ah = parseInt(a.replace(/#/g, ''), 16),
                  ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
                  bh = parseInt(b.replace(/#/g, ''), 16),
                  br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
                  rr = ar + amount * (br - ar),
                  rg = ag + amount * (bg - ag),
                  rb = ab + amount * (bb - ab);
            return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + (rb | 0)).toString(16).slice(1);
        }

        function spawnParticles(x, y, color, type) {
            for(let i=0; i<8; i++) {
                particles.push(new Particle(x, y, color, type));
            }
        }

        function checkGameOver() {
            if (missed >= 3) {
                gameOver = true;
                isPlaying = false;
                sounds.bgm.pause();
                playSound('gameover');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = score;
            }
        }

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d', { alpha: false }); // Optimize
            
            // Resize handler
            const resize = () => {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                // Re-position pans
                const panY = window.innerHeight - 150;
                const panSpacing = window.innerWidth / 4;
                pans = [
                    new Pan(0, panSpacing * 1, panY, 50),
                    new Pan(1, panSpacing * 2, panY, 50),
                    new Pan(2, panSpacing * 3, panY, 50)
                ];
            };
            window.addEventListener('resize', resize);
            resize();

            // Input handling
            const handleInput = (e) => {
                if (!isPlaying || gameOver) return;
                e.preventDefault();
                unlockAudio();
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check Pan clicks
                playSound('click');
                pans.forEach(pan => {
                    const dx = x - pan.x;
                    const dy = y - pan.y;
                    if (Math.sqrt(dx*dx + dy*dy) < pan.size + 20) {
                        pan.interact();
                    }
                });
            };
            
            canvas.addEventListener('pointerdown', handleInput, { passive: false });
            
            // UI Buttons
            document.getElementById('start-btn').addEventListener('click', () => {
                playSound('start');
                startGame();
            });
            document.getElementById('restart-btn').addEventListener('click', () => {
                playSound('click');
                startGame();
            });
        }

        function startGame() {
            unlockAudio();
            score = 0;
            missed = 0;
            gameOver = false;
            isPlaying = true;
            customers = [];
            particles = [];
            customerTimer = 0;
            shake = 0;
            playSound('start');
            sounds.bgm.currentTime = 0;
            playSound('bgm');
            showFeedbackGif('serve');
            
            // Reset Pans
            pans.forEach(p => p.reset());
            
            document.getElementById('score').innerText = '0';
            document.getElementById('missed').innerText = '0';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud').classList.add('flex');
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!isPlaying && !gameOver) return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            // Logic
            if (!gameOver) {
                // Spawn Customers
                customerTimer += dt * 1000;
                if (customerTimer > window.gameConfig.spawnRate && customers.length < 5) {
                    customers.push(new Customer());
                    customerTimer = 0;
                }

                // Update Entities
                customers.forEach((c, i) => c.update(dt, i));
                pans.forEach(p => p.update(dt));
                particles.forEach((p, i) => {
                    p.update(dt);
                    if (p.life <= 0) particles.splice(i, 1);
                });

                // Screen Shake Decay
                if (shake > 0) shake *= 0.9;
                if (shake < 0.5) shake = 0;
            }

            // Draw
            ctx.save();
            
            // Clear Background
            ctx.fillStyle = '#FFF3E0';
            ctx.fillRect(0, 0, canvas.width/window.devicePixelRatio, canvas.height/window.devicePixelRatio);
            
            // Apply Shake
            if (shake > 0) {
                ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            }

            // Draw Background Elements (Counter)
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(0, window.innerHeight - 220, window.innerWidth, 220);
            ctx.fillStyle = '#BDBDBD';
            ctx.fillRect(0, window.innerHeight - 220, window.innerWidth, 10);

            // Draw Entities
            customers.forEach(c => c.draw(ctx));
            pans.forEach(p => p.draw(ctx));
            particles.forEach(p => p.draw(ctx));

            ctx.restore();

            if (isPlaying) requestAnimationFrame(gameLoop);
        }

        // Boot
        document.addEventListener('DOMContentLoaded', initGame);

    </script>
</body>
