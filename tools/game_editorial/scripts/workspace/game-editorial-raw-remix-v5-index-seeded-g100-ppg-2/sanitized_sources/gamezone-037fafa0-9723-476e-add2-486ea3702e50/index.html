<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Night Line Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-night: #030612;
            --bg-midnight: #081425;
            --rail-glow: #4dd8ff;
            --rail-glow-soft: rgba(77, 216, 255, 0.16);
            --lane-core: #09101d;
            --lane-edge: #1f2d4f;
            --hero-primary: #ffe45c;
            --hero-secondary: #ff8a3d;
            --enemy-primary: #ff4d6d;
            --enemy-secondary: #7b1033;
            --hud-bg: rgba(6, 12, 26, 0.72);
            --hud-border: rgba(124, 226, 255, 0.4);
            --text-main: #f5fbff;
            --text-muted: #c8d5e7;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(77, 216, 255, 0.18), transparent 32%),
                linear-gradient(180deg, var(--bg-midnight), var(--bg-night));
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body { color: var(--text-main); }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        button { font: inherit; }
        .glass {
            background: linear-gradient(180deg, rgba(8, 17, 34, 0.82), rgba(2, 7, 18, 0.88));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(105, 224, 255, 0.18);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .z-10 { z-index: 10; }
        .z-50 { z-index: 50; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .bg-black\/80 { background: rgba(0, 0, 0, 0.8); }
        .text-center { text-align: center; }
        .uppercase { text-transform: uppercase; }
        .font-bold { font-weight: 700; }
        .font-light { font-weight: 400; }
        .leading-none { line-height: 1; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-wider { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.2em; }
        .drop-shadow-md { filter: drop-shadow(0 4px 4px rgba(0,0,0,0.6)); }
        .drop-shadow-lg { filter: drop-shadow(0 8px 8px rgba(0,0,0,0.65)); }
        .rotate-\[-5deg\] { transform: rotate(-5deg); }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-red-500 { color: #ef4444; }
        .text-red-600 { color: #dc2626; }
        .text-yellow-400 { color: #facc15; }
        .text-gray-300 { color: #d1d5db; }
        .text-sm { font-size: 0.875rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-7xl { font-size: clamp(3.75rem, 10vw, 5rem); }
        .text-8xl { font-size: clamp(4rem, 12vw, 6rem); }
        .text-9xl { font-size: clamp(5rem, 15vw, 8rem); }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }

        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }

        .hud-score {
            padding: 0.55rem 0.9rem;
            border-radius: 1rem;
            border: 1px solid var(--hud-border);
            background: var(--hud-bg);

            color: #8ae8ff;

        .overlay-panel {
            position: relative;
            width: min(90vw, 28rem);
            max-height: min(82vh, 40rem);
            padding: calc(1.1rem + env(safe-area-inset-top, 0px)) 1.1rem calc(1.1rem + env(safe-area-inset-bottom, 0px));
            border-radius: 1.5rem;
            background:
                linear-gradient(180deg, rgba(8, 18, 39, 0.84), rgba(2, 8, 19, 0.9)),

                0 18px 40px rgba(0, 0, 0, 0.45),

        .overlay-panel::before,
        .overlay-panel::after {
            content: "";
            position: absolute;
            inset: auto;
            width: 6.5rem;
            height: 6.5rem;
            border-radius: 999px;
            pointer-events: none;
            filter: blur(6px);
            opacity: 0.55;
        }

        .overlay-panel::before {
            top: -1.5rem;
            left: -1.4rem;

        .overlay-panel::after {
            right: -1.8rem;
            bottom: -1.8rem;
            background: radial-gradient(circle, rgba(255, 138, 61, 0.26), transparent 70%);

            border: 1px solid rgba(138, 232, 255, 0.22);
            background: rgba(4, 11, 22, 0.7);
            color: var(--text-muted);

            letter-spacing: 0.1em;
            text-transform: uppercase;

            border: 0;
            border-radius: 999px;
            padding: 1rem 1.5rem;
            background: linear-gradient(180deg, #ffe76c, #ffb347);

            font-family: 'Orbitron', system-ui, sans-serif;

        }

        .restart-btn:hover { filter: brightness(1.05); }
        .restart-btn:active { transform: scale(0.97); }

        .feedback-gif {
            position: absolute;
            right: 0.8rem;
            bottom: 0.8rem;
            width: clamp(4.5rem, 19vw, 6.75rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            border: 1px solid rgba(138, 232, 255, 0.28);
            background: rgba(4, 10, 22, 0.62);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            object-fit: cover;
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }

        .feedback-gif.show {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .feedback-badge {
            position: absolute;
            right: 0.9rem;
            top: 0.9rem;
            min-width: 5.5rem;
            padding: 0.4rem 0.65rem;
            border-radius: 999px;
            border: 1px solid rgba(138, 232, 255, 0.22);
            background: rgba(4, 11, 22, 0.8);
            color: #dff9ff;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }

        .feedback-badge.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Pulse animation for start text */
        @keyframes pulse-text { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.58; transform: scale(0.96); } }
        .animate-pulse-fast { animation: pulse-text 1.4s infinite ease-in-out; }

        @keyframes hover-float {
            0%, 100% { transform: rotate(-10deg) translateY(0); }

        @media (min-width: 768px) {
            .md\:text-9xl { font-size: clamp(6rem, 12vw, 8rem); }
            .overlay-panel { padding: 1.7rem 1.5rem; }
            .feedback-gif { right: 1rem; bottom: 1rem; }
        }
    </style>
</head>

<script>
/**
 * §4 Iron Laws & Architecture
 */

// --- Global State ---
let canvas, ctx;
let lastTime = 0;
let animationId;
let gameState = 'START'; // START, PLAYING, GAMEOVER
let score = 0;
let gameSpeed = 0;
let laneWidth = 0;
const ENABLE_ANIMATIONS = true;

// Config Proxy
window.gameConfig = {
    baseSpeed: 10,
    spawnRate: 60,
    playerColor: "#FFEA00"
};

// --- Entities ---
let player = { lane: 1, y: 0, targetX: 0, x: 0, width: 0, height: 0, tilt: 0 };
let trains = [];
let particles = [];
let trackOffset = 0;
let shake = 0;
let scoreAudioCooldown = 0;
let laneAudioCooldown = 0;
let feedbackTimers = { dodge: null, crash: null, badge: null };

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.buffers = {};
        this.unlocked = false;
        this.mediaElements = {};
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.loadAssets();
    }

    loadAssets() {
        // Map IDs to reusable media element keys
        const sounds = [
            { id: 'sfx_crash', key: 'crash' },
            { id: 'sfx_score', key: 'score' },
            { id: 'sfx_lane', key: 'lane' },
            { id: 'sfx_start', key: 'start' }
        ];

        sounds.forEach(s => {
            const el = document.getElementById(s.id);
            if (el && el.src) {
                this.mediaElements[s.key] = el;
            }
        });
    }

    unlock() {
        if (this.unlocked || !this.ctx) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        });
    }

    playBgm() {
        const el = document.getElementById('bgm_race');
        if (el) {
            el.volume = 0.2;
            el.play().catch(() => console.log("BGM autoplay prevented"));
        }
    }

    playSfx(key) {
        if (!this.ctx || this.ctx.state !== 'running') return;

        const el = this.mediaElements[key];
        if (el) {
            const instance = el.cloneNode();
            instance.volume = Math.min(el.volume || 1, 0.9);
            instance.play().catch(() => this.synthesize(key));
            return;
        }

        // Fallback Synthesis
        this.synthesize(key);
    }

    synthesize(key) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (key === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.5);
        } else if (key === 'score') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (key === 'lane') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(740, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } else if (key === 'start') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(360, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(720, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
    }
}

const audio = new AudioManager();

// --- Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    // 1. Config Parse
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const defs = JSON.parse(configEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                window.gameConfig[key] = defs[key].value;
            }
        } catch(e) { console.error("Config parse error", e); }
    }

    // 2. Setup Canvas
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false }); // Optimize
    
    resize();
    window.addEventListener('resize', resize);

    // 3. Input
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    const startScreen = document.getElementById('start-screen');
    const restartBtn = document.getElementById('restart-btn');
    startScreen.addEventListener('pointerdown', startGame, { passive: false });
    startScreen.addEventListener('click', startGame);
    restartBtn.addEventListener('pointerdown', resetGame, { passive: false });
    restartBtn.addEventListener('click', resetGame);

    // 4. Loop
    requestAnimationFrame(loop);
});

// --- Core Systems ---

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Recalculate dimensions
    laneWidth = window.innerWidth / 3;
    player.width = laneWidth * 0.5;
    player.height = player.width * 1.8;
    player.y = window.innerHeight - player.height - 50;
    
    // Update player X immediately if resize happens
    player.targetX = (player.lane * laneWidth) + (laneWidth/2);
    if (gameState === 'START') player.x = player.targetX;
}

function startGame(e) {
    if (gameState !== 'START') return;
    if (e) {
        e.preventDefault();
        e.stopPropagation(); // Prevent passing to canvas immediately
    }
    audio.init();
    audio.unlock();
    audio.playSfx('start');
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    resetGameLogic();
    gameState = 'PLAYING';
}

function resetGame(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    audio.playSfx('start');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    resetGameLogic();
    gameState = 'PLAYING';
    audio.playBgm(); // Restart BGM if stopped
}

function resetGameLogic() {
    score = 0;
    gameSpeed = window.gameConfig.baseSpeed * 100; // Pixels per sec approx
    player.lane = 1;
    player.targetX = (1 * laneWidth) + (laneWidth/2);
    player.x = player.targetX;
    player.tilt = 0;
    trains = [];
    particles = [];
    shake = 0;
    scoreAudioCooldown = 0;
    laneAudioCooldown = 0;
    setFeedbackState('dodge', false);
    setFeedbackState('crash', false);
    setFeedbackBadge('Ready');
    document.getElementById('scoreVal').innerText = '0';
}

function handleInput(e) {
    if (gameState !== 'PLAYING') return;
    e.preventDefault();
    
    const x = e.clientX - canvas.getBoundingClientRect().left;
    const center = window.innerWidth / 2;
    
    if (x < center) {
        // Left
        if (player.lane > 0) {
            player.lane--;
            createTireSmoke(1);
            triggerLaneFeedback();
        }
    } else {
        // Right
        if (player.lane < 2) {
            player.lane++;
            createTireSmoke(-1);
            triggerLaneFeedback();
        }
    }
    
    player.targetX = (player.lane * laneWidth) + (laneWidth/2);
}

// --- Logic Update ---

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Difficulty scaling
    scoreAudioCooldown = Math.max(0, scoreAudioCooldown - dt);
    laneAudioCooldown = Math.max(0, laneAudioCooldown - dt);
    gameSpeed += dt * 20; // Slowly accelerate
    const speedPx = gameSpeed * dt;

    // Track Scroll
    trackOffset = (trackOffset + speedPx) % 100;

    // Player Movement (Lerp)
    const diff = player.targetX - player.x;
    player.x += diff * 10 * dt;
    player.tilt = -diff * 0.1; // Tilt car based on movement

    // Train Spawning
    if (Math.random() < (window.gameConfig.spawnRate / 10000) + (score * 0.0001)) {
        spawnTrain();
    }

    // Train Logic
    for (let i = trains.length - 1; i >= 0; i--) {
        let t = trains[i];
        t.y += (speedPx + (t.speed * dt));

        // Collision
        if (
            player.x - player.width/2 < t.x + t.width/2 &&
            player.x + player.width/2 > t.x - t.width/2 &&
            player.y < t.y + t.height &&
            player.y + player.height > t.y
        ) {
            gameOver();
        }

        // Score & Removal
        if (t.y > window.innerHeight + 100) {
            trains.splice(i, 1);
            score++;
            document.getElementById('scoreVal').innerText = score;
            if (scoreAudioCooldown <= 0) {
                audio.playSfx('score');
                scoreAudioCooldown = 0.08;
            }
            setFeedbackBadge('Clean dodge');
            flashFeedback('dodge', 450);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Screen Shake Decay
    if (shake > 0) shake = Math.max(0, shake - dt * 20);
}

function spawnTrain() {
    // Don't spawn if too crowded
    const lane = Math.floor(Math.random() * 3);
    // Check overlap
    const safe = trains.every(t => t.lane !== lane || t.y > 200);
    
    if (safe) {
        const dangerPalette = [
            { body: '#ff4d6d', stripe: '#ffd166', roof: '#7b1033', glow: '#ffb3c1' },
            { body: '#ff6b57', stripe: '#8ae8ff', roof: '#641220', glow: '#ffd3c4' },
            { body: '#d7265b', stripe: '#ffe45c', roof: '#4f1024', glow: '#ffc2d1' }
        ];
        const style = dangerPalette[Math.floor(Math.random() * dangerPalette.length)];
        trains.push({
            lane: lane,
            x: (lane * laneWidth) + (laneWidth/2),
            y: -400, // Start well above screen
            width: laneWidth * 0.6,
            height: laneWidth * 2.5,
            speed: 200 + Math.random() * 300, // Extra speed relative to track
            color: style.body,
            stripeColor: style.stripe,
            roofColor: style.roof,
            glowColor: style.glow
        });
    }
}

function createTireSmoke(dir) {
    for(let i=0; i<5; i++) {
        particles.push({
            x: player.x,
            y: player.y + player.height,
            vx: (Math.random() - 0.5) * 100 + (dir * 50),
            vy: 100 + Math.random() * 100,
            life: 0.5,
            color: 'rgba(120, 224, 255, 0.38)',
            size: Math.random() * 10 + 5
        });
    }
}

function triggerLaneFeedback() {
    if (laneAudioCooldown <= 0) {
        audio.playSfx('lane');
        laneAudioCooldown = 0.12;
    }
    setFeedbackBadge('Lane shift');
}

function setFeedbackState(kind, show) {
    const el = document.getElementById(kind === 'crash' ? 'gif-crash' : 'gif-dodge');
    if (!el) return;
    el.classList.toggle('show', show);
}

function flashFeedback(kind, duration = 500) {
    setFeedbackState(kind, true);
    clearTimeout(feedbackTimers[kind]);
    feedbackTimers[kind] = setTimeout(() => setFeedbackState(kind, false), duration);
}

function setFeedbackBadge(text) {
    const badge = document.getElementById('feedback-badge');
    if (!badge) return;
    badge.textContent = text;
    badge.classList.add('show');
    clearTimeout(feedbackTimers.badge);
    feedbackTimers.badge = setTimeout(() => badge.classList.remove('show'), 900);
}

function gameOver() {
    gameState = 'GAMEOVER';
    shake = 20;
    setFeedbackBadge('Track locked');
    flashFeedback('crash', 1200);
    audio.playSfx('crash');
    
    // Death particles
    for(let i=0; i<30; i++) {
        particles.push({
            x: player.x,
            y: player.y + player.height/2,
            vx: (Math.random() - 0.5) * 500,
            vy: (Math.random() - 0.5) * 500,
            life: 1.0,
            color: i % 2 === 0 ? '#ff4d6d' : '#ffe45c',
            size: Math.random() * 15 + 5
        });
    }

    document.getElementById('finalScore').innerText = score;
    setTimeout(() => {
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
    }, 1000);
}

// --- Rendering ---

function draw() {
    // Shake effect
    let sx = 0, sy = 0;
    if (shake > 0) {
        sx = (Math.random() - 0.5) * shake * 10;
        sy = (Math.random() - 0.5) * shake * 10;
    }
    
    ctx.save();
    ctx.translate(sx, sy);

    // 1. Background (Night Sky + Track)
    const skyGrad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    skyGrad.addColorStop(0, '#0d1833');
    skyGrad.addColorStop(0.45, '#091426');
    skyGrad.addColorStop(1, '#020711');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    drawCityBackdrop();
    
    // Track Bed
    const trackX = 0;
    const trackW = window.innerWidth;
    const trackGrad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    trackGrad.addColorStop(0, '#16223d');
    trackGrad.addColorStop(1, '#060b14');
    ctx.fillStyle = trackGrad;
    ctx.fillRect(trackX, 0, trackW, window.innerHeight);

    // Sleepers (Moving)
    ctx.fillStyle = '#1f2942';
    const sleeperSpace = 100;
    for (let y = trackOffset - 100; y < window.innerHeight; y += sleeperSpace) {
        ctx.fillRect(trackX, y, trackW, 20);
    }

    // Rails
    const railWidth = 10;
    for (let i = 0; i <= 3; i++) {
        let rx = i * laneWidth;
        if (i===0) rx += 10;
        if (i===3) rx -= 10;
        const railGlow = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        railGlow.addColorStop(0, '#8ae8ff');
        railGlow.addColorStop(1, '#2d9cc7');
        ctx.fillStyle = railGlow;
        ctx.fillRect(rx - railWidth/2, 0, railWidth, window.innerHeight);
        ctx.fillStyle = 'rgba(138, 232, 255, 0.18)';
        ctx.fillRect(rx - railWidth, 0, railWidth * 2, window.innerHeight);
    }

    // Lane pulse markers
    ctx.fillStyle = 'rgba(77, 216, 255, 0.09)';
    for (let lane = 0; lane < 3; lane++) {
        const laneX = lane * laneWidth;
        for (let y = (trackOffset * 0.65) - 80; y < window.innerHeight; y += 160) {
            ctx.fillRect(laneX + laneWidth * 0.18, y, laneWidth * 0.64, 8);
        }
    }
    
    // Shadows/Vignette for depth
    const grad = ctx.createLinearGradient(0, 0, window.innerWidth, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0.52)');
    grad.addColorStop(0.2, 'rgba(0,0,0,0.05)');
    grad.addColorStop(0.8, 'rgba(0,0,0,0.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0.52)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // 2. Start Screen Background Override
    if (gameState === 'START') {
        const bgImg = document.getElementById('asset_bg_scene');
        if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
            const scale = Math.max(window.innerWidth / bgImg.naturalWidth, window.innerHeight / bgImg.naturalHeight);
            const w = bgImg.naturalWidth * scale;
            const h = bgImg.naturalHeight * scale;
            ctx.save();
            ctx.globalAlpha = 0.34;
            ctx.drawImage(bgImg, (window.innerWidth - w)/2, (window.innerHeight - h)/2, w, h);
            ctx.restore();
        }
    } else {
        // 3. Game Objects
        
        // Particles (Smoke/Explosion)
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Trains
        trains.forEach(t => {
            drawTrain(t);
        });

        // Player
        if (gameState !== 'GAMEOVER' || Math.random() > 0.5) { // Flicker on death
            drawPlayer();
        }
    }

    ctx.restore();
}

function drawCityBackdrop() {
    const skylineBase = window.innerHeight * 0.28;
    ctx.save();

    for (let i = 0; i < 10; i++) {
        const width = window.innerWidth * (0.06 + (i % 3) * 0.018);
        const height = skylineBase + ((i * 37) % 140);
        const x = (i * window.innerWidth) / 9 - width * 0.4;
        const y = window.innerHeight * 0.2 - height * 0.55;

        const buildingGrad = ctx.createLinearGradient(0, y, 0, y + height);
        buildingGrad.addColorStop(0, 'rgba(19, 34, 66, 0.72)');
        buildingGrad.addColorStop(1, 'rgba(4, 10, 24, 0.94)');
        ctx.fillStyle = buildingGrad;
        ctx.fillRect(x, y, width, height);

        ctx.fillStyle = 'rgba(122, 232, 255, 0.14)';
        for (let wy = y + 12; wy < y + height - 8; wy += 20) {
            for (let wx = x + 8; wx < x + width - 8; wx += 14) {
                if ((wx + wy + i) % 3 === 0) ctx.fillRect(wx, wy, 5, 7);
            }
        }
    }

    ctx.restore();
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y + player.height/2);
    ctx.rotate(player.tilt * 0.05); // Subtle tilt
    
    // Aura shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
    ctx.fillRect(-player.width/2 + 5, -player.height/2 + 7, player.width, player.height);

    // Thruster aura
    const bodyGrad = ctx.createLinearGradient(0, -player.height/2, 0, player.height/2);
    bodyGrad.addColorStop(0, '#fff29f');
    bodyGrad.addColorStop(0.38, window.gameConfig.playerColor);
    bodyGrad.addColorStop(1, '#ff8a3d');
    ctx.fillStyle = bodyGrad;
    roundRect(ctx, -player.width/2, -player.height/2, player.width, player.height, 14);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Canopy
    const canopyGrad = ctx.createLinearGradient(0, -player.height/3, 0, player.height/3);
    canopyGrad.addColorStop(0, '#9fe8ff');
    canopyGrad.addColorStop(1, '#1f2d4f');
    ctx.fillStyle = canopyGrad;
    roundRect(ctx, -player.width/2 + 8, -player.height/4, player.width - 16, player.height/2.25, 10);
    ctx.fill();
    
    // Wing accents
    ctx.fillStyle = '#0f182e';
    ctx.fillRect(-player.width/2 - 2, -player.height/8, 8, player.height * 0.38);
    ctx.fillRect(player.width/2 - 6, -player.height/8, 8, player.height * 0.38);

    // Headlights
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-player.width/3, -player.height/2 + 8, 6, 0, Math.PI*2);
    ctx.arc(player.width/3, -player.height/2 + 8, 6, 0, Math.PI*2);
    ctx.fill();

    // Headlight glow
    ctx.fillStyle = 'rgba(138, 232, 255, 0.32)';
    ctx.beginPath();
    ctx.moveTo(-player.width/3, -player.height/2 + 4);
    ctx.lineTo(-player.width * 0.95, -player.height * 2.1);
    ctx.lineTo(-2, -player.height * 1.8);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(player.width/3, -player.height/2 + 4);
    ctx.lineTo(player.width * 0.95, -player.height * 2.1);
    ctx.lineTo(2, -player.height * 1.8);
    ctx.fill();

    // Engine glow
    if (ENABLE_ANIMATIONS) {
        const pulse = 0.8 + Math.sin(performance.now() * 0.012) * 0.2;
        ctx.fillStyle = `rgba(255, 138, 61, ${0.38 * pulse})`;
        ctx.fillRect(-player.width/4, player.height/2 - 8, player.width/2, 16);
    }

    ctx.restore();
}

function drawTrain(t) {
    ctx.save();
    ctx.translate(t.x, t.y + t.height/2);

    // Danger glow
    ctx.fillStyle = 'rgba(255, 77, 109, 0.18)';
    ctx.fillRect(-t.width/2 - 8, -t.height/2, t.width + 16, t.height);

    // Train body
    const trainGrad = ctx.createLinearGradient(0, -t.height/2, 0, t.height/2);
    trainGrad.addColorStop(0, t.glowColor || '#ffc2d1');
    trainGrad.addColorStop(0.18, t.color);
    trainGrad.addColorStop(1, t.roofColor || '#7b1033');
    ctx.fillStyle = trainGrad;
    roundRect(ctx, -t.width/2, -t.height/2, t.width, t.height, 12);
    ctx.fill();

    // Stripes
    ctx.fillStyle = t.stripeColor || '#ffe45c';
    ctx.fillRect(-t.width/2 + 6, -t.height/2 + 24, t.width - 12, 10);
    ctx.fillRect(-t.width/2 + 6, t.height/2 - 34, t.width - 12, 10);

    // Windshield
    const windGrad = ctx.createLinearGradient(0, t.height/2 - 70, 0, t.height/2 - 18);
    windGrad.addColorStop(0, '#9fe8ff');
    windGrad.addColorStop(1, '#101828');
    ctx.fillStyle = windGrad;
    roundRect(ctx, -t.width/2 + 8, t.height/2 - 68, t.width - 16, 44, 8);
    ctx.fill();

    // Roof channel
    ctx.fillStyle = t.roofColor || '#7b1033';
    ctx.fillRect(-t.width/4, -t.height/2 + 14, t.width/2, t.height - 92);

    // Lights
    ctx.fillStyle = '#fff6c4';
    ctx.beginPath();
    ctx.arc(-t.width/3, t.height/2 - 12, 8, 0, Math.PI*2);
    ctx.arc(t.width/3, t.height/2 - 12, 8, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }

    animationId = requestAnimationFrame(loop);
}

// Editor Hot Reload Support
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
}
</script>
