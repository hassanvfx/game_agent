<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Space Blaster</title>
    <!-- [agent-note][stage4] repaired: approved-font-source | action: use workspace-local mirrored catalog font stylesheet -->
    <link href="assets/fonts.googleapis.com/css2-family_Fredoka_wght_400_600_display_swap.css" rel="stylesheet">
    <style>
        :root {
            --bg-top: #040816;
            --bg-bottom: #180b2f;
            --panel-bg: rgba(8, 14, 35, 0.78);
            --panel-border: rgba(84, 231, 255, 0.35);
            --panel-shadow: rgba(0, 0, 0, 0.55);
            --text-main: #eaf7ff;
            --text-soft: rgba(188, 226, 255, 0.78);
            --cyan: #5df6ff;
            --cyan-strong: #17dfff;
            --pink: #ff58c8;
            --gold: #ffd86b;
            --danger: #ff6b7d;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(0, 244, 255, 0.08), transparent 28%),
                radial-gradient(circle at bottom, rgba(255, 88, 200, 0.08), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Fredoka', system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%);
            background-size: 100% 6px;
            opacity: 0.3;
            mix-blend-mode: screen;
        }

        body::after {
            background:
                radial-gradient(circle at 20% 15%, rgba(93, 246, 255, 0.12), transparent 18%),
                radial-gradient(circle at 85% 20%, rgba(255, 88, 200, 0.08), transparent 16%),
                radial-gradient(circle at 50% 90%, rgba(255, 216, 107, 0.08), transparent 18%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 16px;
            z-index: 2;
        }

        .hidden {
            display: none !important;
        }

        .panel {
            width: min(100%, 360px);
            border-radius: 24px;
            border: 1px solid var(--panel-border);
            background:
                linear-gradient(180deg, rgba(20, 28, 60, 0.95), rgba(7, 12, 28, 0.9));
            box-shadow:
                0 20px 40px var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 20px rgba(23, 223, 255, 0.14);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            pointer-events: auto;
            text-align: center;
            padding: 24px 20px;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(93, 246, 255, 0.15), transparent 35%),
                linear-gradient(315deg, rgba(255, 88, 200, 0.12), transparent 30%);
            pointer-events: none;
        }

        .panel > * {
            position: relative;
            z-index: 1;
        }

        .start-screen {
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .start-screen:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                0 24px 44px rgba(0, 0, 0, 0.58),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 28px rgba(23, 223, 255, 0.2);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid rgba(93, 246, 255, 0.28);
            background: rgba(93, 246, 255, 0.08);
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "✦";
            color: var(--cyan);
            font-size: 11px;
        }

        .title {
            margin: 0 0 8px;
            font-family: 'Fredoka', system-ui, sans-serif;
            font-weight: 700;
            font-size: clamp(28px, 7vw, 42px);
            line-height: 0.98;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #effdff;
            text-shadow:
                0 0 12px rgba(93, 246, 255, 0.85),
                0 0 24px rgba(93, 246, 255, 0.4),
                0 0 36px rgba(255, 88, 200, 0.24);
        }

        .subtitle {
            margin: 0 0 18px;
            color: var(--text-soft);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.03em;
            animation: pulseText 1.8s ease-in-out infinite;
        }

        .hero-ship {
            position: relative;
            width: 96px;
            height: 112px;
            margin: 0 auto 16px;
            filter: drop-shadow(0 0 14px rgba(23, 223, 255, 0.45));
        }

        .hero-ship::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 14px;
            width: 54px;
            height: 68px;
            transform: translateX(-50%);
            clip-path: polygon(50% 0%, 100% 75%, 66% 64%, 50% 100%, 34% 64%, 0% 75%);
            background:
                linear-gradient(180deg, #f7ffff 0%, #78efff 28%, #1ac8ff 62%, #1945a3 100%);
            border: 1px solid rgba(255, 255, 255, 0.24);
            box-shadow:
                inset 0 0 10px rgba(255,255,255,0.3),
                0 0 20px rgba(23, 223, 255, 0.35);
        }

        .hero-ship::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 28px;
            height: 34px;
            transform: translateX(-50%);
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            background: linear-gradient(180deg, rgba(255, 239, 160, 0.98), rgba(255, 109, 30, 0.2));
            filter: blur(0.2px);
            animation: engineFlame 0.18s ease-in-out infinite alternate;
        }

        .cockpit {
            position: absolute;
            left: 50%;
            top: 34px;
            width: 18px;
            height: 24px;
            transform: translateX(-50%);
            border-radius: 999px 999px 10px 10px;
            background: linear-gradient(180deg, #f7fbff, #7ce9ff 55%, #1f6ce8 100%);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
        }

        .wing {
            position: absolute;
            top: 44px;
            width: 18px;
            height: 28px;
            background: linear-gradient(180deg, #50dfff, #2042a2);
            box-shadow: 0 0 12px rgba(93, 246, 255, 0.25);
        }

        .wing.left {
            left: 16px;
            clip-path: polygon(100% 0%, 100% 100%, 0% 72%);
        }

        .wing.right {
            right: 16px;
            clip-path: polygon(0% 0%, 100% 72%, 0% 100%);
        }

        .cta-btn {
            appearance: none;
            border: 0;
            width: 100%;
            min-height: 52px;
            border-radius: 999px;
            padding: 14px 18px;
            font-family: 'Fredoka', system-ui, sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #03101e;
            background: linear-gradient(90deg, var(--gold), var(--cyan));
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(93, 246, 255, 0.28);
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .cta-btn:hover,
        .cta-btn:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.38),
                0 0 26px rgba(93, 246, 255, 0.34);
            outline: none;
        }

        .cta-btn:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            color: #f7fbff;
            background: linear-gradient(90deg, #ff4e7b, #ff8b5f);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.35),
                0 0 18px rgba(255, 107, 125, 0.28);
        }

        .score-line {
            margin: 8px 0 18px;
            font-family: 'Fredoka', system-ui, sans-serif;
            font-size: clamp(20px, 5vw, 28px);
            letter-spacing: 0.06em;
            color: #ffffff;
        }

        .score-value {
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(93, 246, 255, 0.45);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: none;
            z-index: 3;
        }

        .hud-block {
            min-width: 0;
            border-radius: 18px;
            padding: 10px 12px;
            border: 1px solid rgba(93, 246, 255, 0.24);
            background: rgba(6, 13, 33, 0.62);
            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255,255,255,0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hud-score {
            font-family: 'Fredoka', system-ui, sans-serif;
            font-size: clamp(12px, 3.4vw, 16px);
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .hud-score span {
            color: var(--cyan);
            text-shadow: 0 0 8px rgba(93, 246, 255, 0.42);
        }

        .hud-status {
            align-self: center;
            font-size: clamp(11px, 3vw, 13px);
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(154, 255, 207, 0.82);
            white-space: nowrap;
        }

        .hud-status::before {
            content: "●";
            margin-right: 6px;
            color: #7cffb5;
            text-shadow: 0 0 10px rgba(124, 255, 181, 0.5);
        }

        .status-title {
            margin: 0 0 6px;
            font-family: 'Fredoka', system-ui, sans-serif;
            font-size: clamp(24px, 7vw, 34px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffd2d7;
            text-shadow:
                0 0 10px rgba(255, 107, 125, 0.75),
                0 0 22px rgba(255, 107, 125, 0.3);
        }

        .status-copy {
            margin: 0;
            color: var(--text-soft);
            font-size: 15px;
            font-weight: 600;
        }

        @keyframes engineFlame {
            from {
                transform: translateX(-50%) scaleY(0.82);
                opacity: 0.82;
            }
            to {
                transform: translateX(-50%) scaleY(1.12);
                opacity: 1;
            }
        }

        .feedback-stack {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 2;
            pointer-events: none;
        }

        .feedback-gif {
            width: min(30vw, 120px);
            border-radius: 18px;
            border: 1px solid rgba(93, 246, 255, 0.28);
            background: rgba(8, 14, 35, 0.48);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            will-change: opacity, transform;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.82; }
            50% { opacity: 1; }
        }

        @media (max-width: 480px) {
            #ui-layer {
                padding: 12px;
            }

            .panel {
                padding: 20px 16px;
                border-radius: 20px;
            }

            .subtitle {
                font-size: 16px;
            }

            .hero-ship {
                margin-bottom: 14px;
                transform: scale(0.92);
            }

            .cta-btn {
                min-height: 50px;
                font-size: 15px;
            }

            #hud {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .hud-block {
                padding: 9px 10px;
            }

            .feedback-stack {
                right: 10px;
                bottom: 86px;
                gap: 8px;
            }

            .feedback-gif {
                width: min(27vw, 92px);
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: combat-hit + defeat-reaction -> catalogs/gifs.json -->
            <div class="feedback-stack" aria-hidden="true">
                <img id="hit-gif" class="feedback-gif" alt="" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
                <img id="fail-gif" class="feedback-gif" alt="" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
            </div>
            <div id="start-screen" class="panel start-screen">
                <div class="eyebrow">Star Ace Online</div>
                <div class="hero-ship" aria-hidden="true">
                    <div class="wing left"></div>
                    <div class="wing right"></div>
                    <div class="cockpit"></div>
                </div>
                <h1 class="title">Neon Blast</h1>
                <p class="subtitle">Glide the ace fighter and vaporize the meteor swarm.</p>
                <button id="start-btn" class="cta-btn">Launch Ship</button>
            </div>

            <div id="game-over-screen" class="hidden panel">
                <div class="eyebrow">Mission Debrief</div>
                <h2 class="status-title">System Failure</h2>
                <p class="score-line">Score: <span id="finalScore" class="score-value">0</span></p>
                <p class="status-copy">Reset the cockpit and dive back into the neon corridor.</p>
                <button id="restart-btn" class="cta-btn secondary-btn">Reboot System</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-block hud-score">
                    Score: <span id="score">0</span>
                </div>
                <div class="hud-block hud-status">HP System Active</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "assets/audio/0000/acf5eda3-e330-44d0-aba7-b5c70daab45f.mp3",
            sfx: {
                start: "assets/audio/0000/f9606ac0-d839-497c-a121-facdf011a5bd.mp3",
                shoot: "assets/audio/0000/d70feecf-daf5-4f87-a7e1-a47cc63d25f9.mp3",
                explode: "assets/audio/0000/d70feecf-daf5-4f87-a7e1-a47cc63d25f9.mp3",
                score: "assets/audio/0000/f9606ac0-d839-497c-a121-facdf011a5bd.mp3",
                fail: "assets/audio/0000/acf5eda3-e330-44d0-aba7-b5c70daab45f.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.28;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.sfxVolume = {
                    start: 0.55,
                    shoot: 0.18,
                    explode: 0.45,
                    score: 0.32,
                    fail: 0.5
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.unlocked = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((sound) => sound.load());
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, throttleMs = 0) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const lastTime = this.lastPlayed.get(key) || 0;
                if (throttleMs && now - lastTime < throttleMs) return;
                this.lastPlayed.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolume[key] ?? 0.4;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const hitGif = document.getElementById('hit-gif');
        const failGif = document.getElementById('fail-gif');
        let feedbackTimers = [];

        function flashGif(element, duration = 700) {
            if (!element) return;
            element.classList.add('visible');
            const timer = window.setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
            feedbackTimers.push(timer);
        }

        function clearFeedback() {
            feedbackTimers.forEach((timer) => clearTimeout(timer));
            feedbackTimers = [];
            [hitGif, failGif].forEach((element) => element && element.classList.remove('visible'));
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;

        // Entities
        let player = { x: 0, y: 0, width: 40, height: 40, color: '#00ffff' };
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // Config
        let spawnRate = 60; // Frames between spawns

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!gameActive) {
                player.x = width / 2;
                player.y = height - 100;
            } else {
                player.y = height - 100;
            }
            initStars();
        }
        window.addEventListener('resize', resize);

        /** 4. PARALLAX SYSTEM */
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 3 + 0.5,
                    alpha: Math.random()
                });
            }
        }

        function updateStars() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#040816');
            grad.addColorStop(0.55, '#0a1030');
            grad.addColorStop(1, '#180b2f');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const nebulaGlow = ctx.createRadialGradient(width * 0.5, height * 0.18, 10, width * 0.5, height * 0.18, Math.max(width, height) * 0.7);
            nebulaGlow.addColorStop(0, 'rgba(93, 246, 255, 0.16)');
            nebulaGlow.addColorStop(0.45, 'rgba(120, 74, 255, 0.08)');
            nebulaGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebulaGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'white';
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            for (let i = 0; i < 3; i++) {
                const streakX = ((frameCount * (0.7 + i * 0.15)) + i * width * 0.33) % (width + 180) - 90;
                const streakY = height * (0.15 + i * 0.22);
                const streak = ctx.createLinearGradient(streakX, streakY, streakX + 80, streakY + 120);
                streak.addColorStop(0, 'rgba(255,255,255,0)');
                streak.addColorStop(0.5, 'rgba(93,246,255,0.18)');
                streak.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = streak;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(streakX, streakY);
                ctx.lineTo(streakX + 70, streakY + 110);
                ctx.stroke();
            }
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            spawnRate = 60;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = width / 2;
            player.y = height - 100;
            document.getElementById('score').innerText = score;
            frameCount = 0;
            clearFeedback();
        }

        function spawnEnemy() {
            const size = 30 + Math.random() * 20;
            enemies.push({
                x: Math.random() * (width - size),
                y: -size,
                width: size,
                height: size,
                speed: 2 + Math.random() * 2 + (score / 500),
                color: `hsl(${Math.random() * 60 + 300}, 100%, 50%)`
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;

                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life > 0.5) {
                    ctx.globalAlpha = Math.max(0, p.life * 0.35);
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            ctx.shadowBlur = 24;
            ctx.shadowColor = '#35f3ff';

            const bodyGradient = ctx.createLinearGradient(0, -20, 0, 20);
            bodyGradient.addColorStop(0, '#f6ffff');
            bodyGradient.addColorStop(0.3, '#76efff');
            bodyGradient.addColorStop(0.68, '#18c8ff');
            bodyGradient.addColorStop(1, '#1949a9');

            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.moveTo(0, -23);
            ctx.lineTo(17, 14);
            ctx.lineTo(6, 8);
            ctx.lineTo(0, 16);
            ctx.lineTo(-6, 8);
            ctx.lineTo(-17, 14);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#7fdaff';
            ctx.beginPath();
            ctx.moveTo(-18, 7);
            ctx.lineTo(-5, 10);
            ctx.lineTo(-15, 18);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(18, 7);
            ctx.lineTo(5, 10);
            ctx.lineTo(15, 18);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#f5fbff';
            ctx.beginPath();
            ctx.ellipse(0, -3, 5.5, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ffb43d';
            ctx.fillStyle = `rgba(255, 214, 88, ${0.6 + Math.random() * 0.35})`;
            ctx.beginPath();
            ctx.moveTo(-5, 10);
            ctx.lineTo(5, 10);
            ctx.lineTo(0, 28 + Math.random() * 9);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = `rgba(255, 93, 31, ${0.45 + Math.random() * 0.3})`;
            ctx.beginPath();
            ctx.moveTo(-3, 11);
            ctx.lineTo(3, 11);
            ctx.lineTo(0, 20 + Math.random() * 7);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            updateStars();

            frameCount++;
            if (frameCount % Math.max(20, (60 - Math.floor(score / 100))) === 0) {
                spawnEnemy();
            }

            if (frameCount % 10 === 0) {
                bullets.push({
                    x: player.x,
                    y: player.y - 20,
                    width: 4,
                    height: 15,
                    speed: 10,
                    color: '#ffe55c'
                });
                audio.playSFX('shoot', 90);
            }

            ctx.shadowBlur = 10;
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;

                const beamGradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.height);
                beamGradient.addColorStop(0, '#fffad1');
                beamGradient.addColorStop(1, b.color);
                ctx.shadowColor = b.color;
                ctx.fillStyle = beamGradient;
                ctx.fillRect(b.x - b.width / 2, b.y, b.width, b.height);

                if (b.y < -50) bullets.splice(i, 1);
            }
            ctx.shadowBlur = 0;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                ctx.save();
                ctx.translate(e.x + e.width / 2, e.y + e.height / 2);
                ctx.rotate(frameCount * 0.05);
                ctx.shadowBlur = 18;
                ctx.shadowColor = e.color;

                const enemyGradient = ctx.createLinearGradient(-e.width / 2, -e.height / 2, e.width / 2, e.height / 2);
                enemyGradient.addColorStop(0, '#ffffff');
                enemyGradient.addColorStop(0.18, e.color);
                enemyGradient.addColorStop(1, 'rgba(20, 0, 38, 0.95)');
                ctx.fillStyle = enemyGradient;
                ctx.beginPath();
                ctx.moveTo(0, -e.height / 2);
                ctx.lineTo(e.width / 2, 0);
                ctx.lineTo(0, e.height / 2);
                ctx.lineTo(-e.width / 2, 0);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, Math.max(4, e.width * 0.14), 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();

                let hit = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (
                        b.x > e.x && b.x < e.x + e.width &&
                        b.y > e.y && b.y < e.y + e.height
                    ) {
                        bullets.splice(j, 1);
                        hit = true;
                        break;
                    }
                }

                if (hit) {
                    createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.color);
                    audio.playSFX('explode', 70);
                    audio.playSFX('score', 110);
                    flashGif(hitGif, 520);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    enemies.splice(i, 1);
                    continue;
                }

                let dx = player.x - (e.x + e.width / 2);
                let dy = player.y - (e.y + e.height / 2);
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < (20 + e.width / 2)) {
                    gameOver();
                    return;
                }

                if (e.y > height) enemies.splice(i, 1);
            }

            updateParticles();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 250);
            flashGif(failGif, 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        function handleInput(clientX) {
            if (!gameActive) return;
            player.x = clientX;
            if (player.x < 20) player.x = 20;
            if (player.x > width - 20) player.x = width - 20;
        }

        canvas.addEventListener('mousemove', (e) => handleInput(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 150);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            resize();
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playSFX('start', 150);
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        resize();
        initStars();
        updateStars();
    });
    </script>
</body>
</html>
