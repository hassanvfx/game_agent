<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Stadium Juggle Challenge</title>
    <!-- [agent-note][stage3] resolved-font: title -> Russo One, ui -> Exo 2 from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --font-display: 'Russo One', sans-serif;
            --font-ui: 'Exo 2', sans-serif;
            --color-white: #ffffff;
            --color-green: #4ade80;
            --color-blue: #3b82f6;
            --color-red: #ef4444;
            --color-yellow: #facc15;
            --color-panel-bg: rgba(8, 15, 35, 0.58);
            --color-panel-border: rgba(255, 255, 255, 0.22);
            --color-panel-highlight: rgba(125, 211, 252, 0.34);
            --color-glow: rgba(56, 189, 248, 0.3);
            --color-turf-dark: #0b5a37;
            --color-turf-light: #12945c;
            --color-night: #07111f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(59, 130, 246, 0.16), transparent 36%),
                linear-gradient(180deg, #06111f 0%, #10213c 44%, #0b5a37 72%, #06321e 100%);
            font-family: var(--font-ui);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.12), transparent 18%),
                radial-gradient(circle at 85% 18%, rgba(255, 255, 255, 0.1), transparent 16%),
                linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.03) 38%, transparent 70%);
            mix-blend-mode: screen;
            opacity: 0.7;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            pointer-events: auto;
            position: relative;
            text-align: center;
            background:
                linear-gradient(180deg, rgba(10, 25, 55, 0.92), rgba(7, 15, 35, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--color-panel-border);
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.38),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: min(92vw, 28rem);
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(74, 222, 128, 0.1), transparent 40%),
                radial-gradient(circle at top, rgba(255, 255, 255, 0.12), transparent 38%);
            pointer-events: none;
        }

        .panel > * {
            position: relative;
            z-index: 1;
        }

        .panel.start-panel {
            transition: transform 0.3s ease;
        }

        .game-container:hover .panel.start-panel {
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        .title {
            margin: 0 0 0.5rem;
            color: var(--color-white);
            font-family: var(--font-display);
            font-size: clamp(2.8rem, 8vw, 4.25rem);
            line-height: 0.95;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.04em;
        }

        .title-accent {
            color: var(--color-green);
        }

        .title-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 1rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.88);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .title-kicker::before {
            content: '⚽';
            font-size: 0.95rem;
        }

        .subtitle,
        .results-copy {
            margin: 0 0 2rem;
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(1rem, 3vw, 1.35rem);
            font-weight: 600;
        }

        .results-title {
            margin: 0 0 0.5rem;
            color: var(--color-red);
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .results-score {
            color: var(--color-white);
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .score-value {
            color: var(--color-yellow);
            font-family: var(--font-display);
        }

        .button {
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            color: var(--color-white);
            font-family: var(--font-display);
            font-size: clamp(1rem, 3vw, 1.15rem);
            letter-spacing: 0.04em;
            padding: 0.95rem 2.2rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, filter 0.2s ease;
        }

        .button:active {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .button:hover {
            transform: scale(1.05);
        }

        .button-start {
            background: linear-gradient(90deg, var(--color-green), var(--color-blue));
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
        }

        .button-start:hover {
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.55);
        }

        .button-restart {
            background: var(--color-white);
            color: #111827;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.18);
        }

        .hud {
            position: absolute;
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            align-items: flex-start;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.75rem 1.25rem;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(8, 15, 35, 0.88), rgba(12, 28, 55, 0.82));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--color-panel-border);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.24),
                0 0 18px var(--color-glow);
        }

        .hud-pill::before {
            content: '🔥';
            font-size: 1.15rem;
        }

        .hud-label {
            color: #e5e7eb;
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .hud-score {
            color: var(--color-yellow);
            font-family: var(--font-display);
            font-size: clamp(1.75rem, 5vw, 2.2rem);
            line-height: 1;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .combo-pill {
            min-width: 9rem;
            padding: 0.55rem 0.9rem;
            border-radius: 1rem;
            background: rgba(7, 15, 35, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transform: translateY(-0.35rem);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .combo-pill.active {
            opacity: 1;
            transform: translateY(0);
        }

        .combo-label {
            display: block;
            font-family: var(--font-display);
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #93c5fd;
        }

        .combo-value {
            display: block;
            margin-top: 0.2rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .feedback-gif {
            position: absolute;
            right: max(1rem, env(safe-area-inset-right));
            width: min(28vw, 7rem);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.32);
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: translateY(0.5rem) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            background: rgba(7, 15, 35, 0.82);
        }

        .feedback-gif.active {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.combo-gif {
            top: max(1rem, env(safe-area-inset-top));
        }

        .feedback-gif.fail-gif {
            bottom: max(1rem, env(safe-area-inset-bottom) + 0.5rem);
        }

        @media (max-width: 600px) {
            .panel {
                padding: 1.5rem;
            }

            .subtitle,
            .results-copy {
                margin-bottom: 1.5rem;
            }

            .hud-pill {
                padding: 0.65rem 1rem;
            }

            .title-kicker {
                font-size: 0.72rem;
                letter-spacing: 0.14em;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel start-panel">
                <div class="title-kicker">Neon derby mode</div>
                <h1 class="title">Stadium<br><span class="title-accent">Juggle</span></h1>
                <p class="subtitle">Tap the ball to keep your juggling streak alive under the floodlights.</p>
                <button id="start-btn" class="button button-start">START RUN</button>
            </div>

            <div id="game-over-screen" class="hidden panel">
                <h2 class="results-title">Streak Over</h2>
                <div class="results-score">Best juggle count: <span id="finalScore" class="score-value">0</span></div>
                <button id="restart-btn" class="button button-restart">Try Again</button>
            </div>

            <div id="hud" class="hidden hud">
                <div class="hud-pill">
                    <span class="hud-label">Juggles</span>
                    <span id="score" class="hud-score">0</span>
                </div>
                <div id="combo-pill" class="combo-pill" aria-live="polite">
                    <span class="combo-label">Hot streak</span>
                    <span id="combo-text" class="combo-value">Tap to start the run</span>
                </div>
            </div>
            <!-- [agent-note][stage3] resolved-gif: combo and miss reactions sourced from catalogs/gifs.json -->
            <img id="combo-gif" class="feedback-gif combo-gif" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction" />
            <img id="fail-gif" class="feedback-gif fail-gif" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Miss reaction" />
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                kick: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                combo: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                uiStart: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                uiRestart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            gifs: {
                combo: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.26;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.sfxCooldowns = new Map();
                this.sfxVolumes = {
                    kick: 0.72,
                    combo: 0.6,
                    uiStart: 0.55,
                    uiRestart: 0.5,
                    fail: 0.7
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            prime() {
                this.bgm.load();
                Object.values(this.sfx).forEach(sound => sound.load());
            }

            playBGM() {
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldownMs = 0) {
                const sound = this.sfx[key];
                if (!sound) return;
                const now = performance.now();
                const lastPlayed = this.sfxCooldowns.get(key) || 0;
                if (cooldownMs && now - lastPlayed < cooldownMs) return;
                this.sfxCooldowns.set(key, now);

                const clone = sound.cloneNode();
                clone.volume = this.sfxVolumes[key] ?? 0.7;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const gameContainer = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const comboPill = document.getElementById('combo-pill');
        const comboText = document.getElementById('combo-text');
        const comboGif = document.getElementById('combo-gif');
        const failGif = document.getElementById('fail-gif');
        let width, height;
        let gameActive = false;
        let score = 0;
        let animationFrameId;
        let streakLevel = 0;
        let comboTimeoutId;
        let comboGifTimeoutId;
        let failGifTimeoutId;

        // Physics Constants
        const GRAVITY = 0.5;
        const FRICTION = 0.99;
        const BOUNCE_DAMPING = 0.7;
        const KICK_FORCE = -15;

        // Game Objects
        let ball = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            radius: 40,
            angle: 0,
            angularVelocity: 0
        };

        let particles = [];
        let clouds = [];

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Reposition ball if out of bounds on resize
            if (ball.x > width) ball.x = width - ball.radius;
            if (ball.y > height) ball.y = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. PARALLAX & VISUALS */
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.4),
                    speed: 0.2 + Math.random() * 0.5,
                    size: 30 + Math.random() * 50
                });
            }
        }

        function drawBackground() {
            const horizonY = height * 0.58;

            // Night sky
            const gradientSky = ctx.createLinearGradient(0, 0, 0, height);
            gradientSky.addColorStop(0, '#07111f');
            gradientSky.addColorStop(0.42, '#12305c');
            gradientSky.addColorStop(0.58, '#1f7a52');
            gradientSky.addColorStop(1, '#0a4f30');
            ctx.fillStyle = gradientSky;
            ctx.fillRect(0, 0, width, height);

            // Stadium floodlights
            const lightSpill = ctx.createRadialGradient(width * 0.5, height * 0.12, 0, width * 0.5, height * 0.12, width * 0.45);
            lightSpill.addColorStop(0, 'rgba(255,255,255,0.24)');
            lightSpill.addColorStop(0.45, 'rgba(125,211,252,0.12)');
            lightSpill.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = lightSpill;
            ctx.fillRect(0, 0, width, height * 0.8);

            // Crowd band
            ctx.fillStyle = 'rgba(7, 15, 35, 0.88)';
            ctx.fillRect(0, horizonY - 36, width, 42);

            for (let i = 0; i < width; i += 18) {
                ctx.fillStyle = i % 36 === 0 ? 'rgba(250, 204, 21, 0.18)' : 'rgba(255,255,255,0.08)';
                ctx.fillRect(i, horizonY - 30, 10, 12);
            }

            // Clouds / mist
            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > width + 100) cloud.x = -100;

                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.8, cloud.y - cloud.size * 0.2, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.arc(cloud.x - cloud.size * 0.8, cloud.y - cloud.size * 0.2, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });

            // Turf
            const turfGradient = ctx.createLinearGradient(0, horizonY, 0, height);
            turfGradient.addColorStop(0, '#159a61');
            turfGradient.addColorStop(1, '#0a4a2d');
            ctx.fillStyle = turfGradient;
            ctx.fillRect(0, horizonY, width, height - horizonY);

            for (let y = horizonY; y < height; y += 22) {
                ctx.fillStyle = y % 44 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
                ctx.fillRect(0, y, width, 11);
            }

            // Field lines
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            ctx.lineTo(width, horizonY);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(width / 2, height + 40, Math.min(width * 0.22, 150), Math.PI, Math.PI * 2);
            ctx.stroke();

            // Spotlight lane behind character
            const spotlight = ctx.createLinearGradient(ball.x, horizonY - 20, ball.x, height);
            spotlight.addColorStop(0, 'rgba(255,255,255,0.09)');
            spotlight.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = spotlight;
            ctx.fillRect(ball.x - 55, horizonY - 20, 110, height - horizonY + 20);
        }

        function createParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#ffffff' : '#4ade80'
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        function drawBall() {
            ctx.save();

            // Shadow
            const distToGround = height - (ball.y + ball.radius);
            const shadowAlpha = Math.max(0, 0.42 - (distToGround / 500));
            const shadowScale = Math.max(0.5, 1 - (distToGround / 500));

            if (shadowAlpha > 0) {
                ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
                ctx.beginPath();
                ctx.ellipse(ball.x, height - 10, ball.radius * shadowScale * 1.4, ball.radius * shadowScale * 0.44, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            const aura = ctx.createRadialGradient(ball.x, ball.y, ball.radius * 0.5, ball.x, ball.y, ball.radius * 2.2);
            aura.addColorStop(0, 'rgba(250,204,21,0.2)');
            aura.addColorStop(0.55, 'rgba(255,255,255,0.08)');
            aura.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 2.1, 0, Math.PI * 2);
            ctx.fill();

            // Ball Body
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.angle);

            const baseGradient = ctx.createRadialGradient(-ball.radius * 0.35, -ball.radius * 0.35, ball.radius * 0.25, 0, 0, ball.radius * 1.15);
            baseGradient.addColorStop(0, '#ffffff');
            baseGradient.addColorStop(0.72, '#f5f7fb');
            baseGradient.addColorStop(1, '#cfd8e3');

            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = baseGradient;
            ctx.fill();

            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.save();
            ctx.clip();

            // Center stripe to reinforce character identity
            const stripeGradient = ctx.createLinearGradient(-ball.radius, 0, ball.radius, 0);
            stripeGradient.addColorStop(0, '#0f172a');
            stripeGradient.addColorStop(0.5, '#22c55e');
            stripeGradient.addColorStop(1, '#0f172a');
            ctx.fillStyle = stripeGradient;
            ctx.fillRect(-ball.radius, -ball.radius * 0.18, ball.radius * 2, ball.radius * 0.36);

            // Soccer panels
            ctx.fillStyle = '#111827';
            drawPolygon(ctx, 0, 0, ball.radius * 0.38, 5);

            for (let i = 0; i < 5; i++) {
                const rot = (Math.PI * 2 / 5) * i + 0.22;
                const dist = ball.radius * 0.78;
                const px = Math.cos(rot) * dist;
                const py = Math.sin(rot) * dist;
                drawPolygon(ctx, px, py, ball.radius * 0.26, 6);
            }

            ctx.restore();

            // Shine
            ctx.beginPath();
            ctx.arc(-ball.radius * 0.28, -ball.radius * 0.3, ball.radius * 0.24, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.42)';
            ctx.fill();

            ctx.restore();
        }

        function drawPolygon(ctx, x, y, radius, sides) {
            if (sides < 3) return;
            ctx.beginPath();
            const a = (Math.PI * 2) / sides;
            for (let i = 0; i < sides; i++) {
                ctx.lineTo(x + radius * Math.cos(a * i), y + radius * Math.sin(a * i));
            }
            ctx.closePath();
            ctx.fill();
        }

        /** 5. GAME LOGIC */
        function setComboMessage(message, active = false) {
            comboText.textContent = message;
            comboPill.classList.toggle('active', active);
        }

        function flashGif(element, timeoutRefName, duration = 1200) {
            if (window[timeoutRefName]) {
                clearTimeout(window[timeoutRefName]);
            }
            element.classList.add('active');
            window[timeoutRefName] = setTimeout(() => {
                element.classList.remove('active');
            }, duration);
        }

        function registerComboMilestone() {
            const nextStreak = Math.floor(score / 5);
            if (nextStreak <= streakLevel) return;
            streakLevel = nextStreak;
            setComboMessage(`Streak x${streakLevel} — crowd is loving it`, true);
            audio.playSFX('combo', 500);
            flashGif(comboGif, 'comboGifTimeoutId', 1350);
        }

        function initGame() {
            score = 0;
            streakLevel = 0;
            document.getElementById('score').innerText = score;
            setComboMessage('Keep the ball airborne', false);
            comboGif.classList.remove('active');
            failGif.classList.remove('active');
            ball = {
                x: width / 2,
                y: height * 0.3,
                vx: 0,
                vy: 0,
                radius: width < 600 ? 30 : 45,
                angle: 0,
                angularVelocity: 0.05
            };
            particles = [];
            initClouds();
        }

        function updatePhysics() {
            // Gravity
            ball.vy += GRAVITY;
            ball.vx *= FRICTION;
            ball.angularVelocity *= FRICTION;

            // Movement
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.angle += ball.angularVelocity;

            // Wall Collisions
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -BOUNCE_DAMPING;
                ball.angularVelocity = -ball.vx * 0.1;
            } else if (ball.x + ball.radius > width) {
                ball.x = width - ball.radius;
                ball.vx *= -BOUNCE_DAMPING;
                ball.angularVelocity = -ball.vx * 0.1;
            }

            // Ground Collision (Game Over)
            if (ball.y + ball.radius > height) {
                gameOver();
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            drawBackground();
            updatePhysics();
            drawBall();
            drawParticles();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function kickBall(clientX, clientY) {
            if (!gameActive) return;

            const dx = clientX - ball.x;
            const dy = clientY - ball.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // Hitbox slightly larger than visual ball for better feel
            if (dist < ball.radius * 1.5) {
                // If clicked below center, it goes up more.
                // If clicked on the side, it spins and moves sideways.
                ball.vy = KICK_FORCE;
                ball.vx = -(dx / ball.radius) * 10;
                ball.angularVelocity = -(dx / ball.radius) * 0.3;

                // Score
                score++;
                document.getElementById('score').innerText = score;

                // Effects
                createParticles(clientX, clientY);
                audio.playSFX('kick', 70);
                if (score > 0) {
                    setComboMessage(`Hot streak: ${score} juggles`, true);
                    if (comboTimeoutId) {
                        clearTimeout(comboTimeoutId);
                    }
                    comboTimeoutId = setTimeout(() => {
                        comboPill.classList.remove('active');
                    }, 1100);
                }
                registerComboMilestone();
            }
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(animationFrameId);
            audio.stopBGM();
            audio.playSFX('fail', 300);
            setComboMessage(`Final rally: ${score} juggles`, true);
            flashGif(failGif, 'failGifTimeoutId', 1800);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        function handleInput(e) {
            if (!gameActive) return;

            let clientX, clientY;
            if (e.type.includes('touch')) {
                if (!e.touches.length) return;
                e.preventDefault();
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            kickBall(clientX, clientY);
        }

        // [agent-note][stage4] repaired: mobile-cta-risk | action: limited touch suppression to gameplay surface so menu buttons keep native tap behavior
        gameContainer.addEventListener('mousedown', handleInput);
        gameContainer.addEventListener('touchstart', handleInput, { passive: false });

        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.prime();
            audio.playSFX('uiStart', 150);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.playSFX('uiRestart', 150);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
