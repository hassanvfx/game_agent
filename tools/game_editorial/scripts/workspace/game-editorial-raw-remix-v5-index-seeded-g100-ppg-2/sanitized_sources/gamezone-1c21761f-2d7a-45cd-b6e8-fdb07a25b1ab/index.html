<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cosmic Foundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- [agent-note][stage4] resolved-font: title=Audiowide, ui=Exo 2, accent=Press Start 2P via catalogs/fonts.json -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-void: #050510;
        --bg-deep: #0b1026;
        --panel: rgba(12, 18, 38, 0.78);
        --panel-strong: rgba(19, 28, 59, 0.92);
        --line: rgba(132, 224, 255, 0.22);
        --line-strong: rgba(132, 224, 255, 0.5);
        --text-main: #f7fbff;
        --text-soft: rgba(215, 234, 255, 0.7);
        --accent-cyan: #72f2ff;
        --accent-blue: #5b8dff;
        --accent-violet: #b46eff;
        --accent-gold: #ffd36e;
        --success: #9cffb3;
        --danger: #ff7f95;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(85, 137, 255, 0.14), transparent 35%),
            radial-gradient(circle at bottom, rgba(180, 110, 255, 0.14), transparent 42%),
            linear-gradient(180deg, var(--bg-deep), var(--bg-void) 70%);
        color: var(--text-main);
        font-family: 'Exo 2', system-ui, sans-serif;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.045), transparent 18%, transparent 82%, rgba(255,255,255,0.03)),
            repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px);
        opacity: 0.25;
        mix-blend-mode: screen;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    button {
        border: 0;
        font-family: 'Exo 2', system-ui, sans-serif;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-main);
        background: none;
        padding: 0;
    }

    .hidden { display: none !important; }

    .game-shell {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
    }

    .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(24, 34, 70, 0.88), rgba(8, 12, 29, 0.78));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .panel-rim {
        position: relative;
        overflow: hidden;
    }

    .panel-rim::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(114, 242, 255, 0.12), transparent 36%, rgba(180, 110, 255, 0.14));
        pointer-events: none;
    }

    .neon-text {
        text-shadow: 0 0 12px rgba(114, 242, 255, 0.32);
    }

    .hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 14px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        pointer-events: none;
    }

    .hud-card {
        min-width: 124px;
        padding: 10px 14px 11px;
        display: flex;
        flex-direction: column;
        gap: 3px;
    }

    .hud-label,
    .section-label,
    .title-kicker {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-soft);
    }

    .hud-value {
        font-size: 1.4rem;
        line-height: 1;
        font-weight: 700;
        color: var(--text-main);
    }

    .hud-income {
        font-size: 1.1rem;
        color: var(--success);
    }

    .start-screen {
        position: absolute;
        inset: 0;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top, 0px) + 16px) 24px max(24px, env(safe-area-inset-bottom, 0px) + 16px);
        text-align: center;
    }

    .hero-frame {
        position: relative;
        width: min(86vw, 360px);
        padding: 22px 20px 18px;
        margin-bottom: 18px;
    }

    .hero-emblem {
        width: 120px;
        height: 120px;
        margin: 0 auto 16px;
        position: relative;
        border-radius: 999px;
        background:
            radial-gradient(circle at 32% 30%, #fff6c2 0 10%, #ffe27a 14%, #ffa44e 38%, #7633ff 68%, #160823 100%);
        box-shadow:
            0 0 0 6px rgba(114, 242, 255, 0.08),
            0 0 32px rgba(114, 242, 255, 0.26),
            0 0 80px rgba(180, 110, 255, 0.22);
        animation: starPulse 2.8s ease-in-out infinite;
    }

    .hero-emblem::before,
    .hero-emblem::after {
        content: "";
        position: absolute;
        inset: 50%;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        pointer-events: none;
    }

    .hero-emblem::before {
        width: 146px;
        height: 146px;
        border: 1px solid rgba(114, 242, 255, 0.24);
        box-shadow: 0 0 18px rgba(114, 242, 255, 0.15);
    }

    .hero-emblem::after {
        width: 24px;
        height: 24px;
        background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0));
        filter: blur(2px);
        top: 34%;
        left: 36%;
    }

    .hero-orbit,
    .hero-orbit--alt {
        position: absolute;
        inset: 50%;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        transform: translate(-50%, -50%) rotate(18deg);
        pointer-events: none;
    }

    .hero-orbit {
        width: 168px;
        height: 74px;
    }

    .hero-orbit--alt {
        width: 178px;
        height: 96px;
        transform: translate(-50%, -50%) rotate(-22deg);
        border-color: rgba(180, 110, 255, 0.2);
    }

    .hero-satellite,
    .hero-satellite::before {
        position: absolute;
        border-radius: 999px;
    }

    .hero-satellite {
        width: 14px;
        height: 14px;
        top: 18px;
        right: 28px;
        background: radial-gradient(circle at 30% 30%, #ffffff, #72f2ff 45%, #3170ff);
        box-shadow: 0 0 12px rgba(114, 242, 255, 0.38);
        animation: orbitFloat 4.2s linear infinite;
        transform-origin: -42px 42px;
    }

    .hero-satellite::before {
        content: "";
        width: 9px;
        height: 9px;
        left: -86px;
        top: 58px;
        background: radial-gradient(circle at 35% 35%, #fff, #ffd36e 45%, #ff8d4d);
        box-shadow: 0 0 10px rgba(255, 211, 110, 0.36);
    }

    .title {
        margin: 0;
        font-family: 'Audiowide', 'Orbitron', system-ui, sans-serif;
        font-size: clamp(2.1rem, 10vw, 4.4rem);
        line-height: 0.95;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 20px rgba(114, 242, 255, 0.28), 0 0 50px rgba(180, 110, 255, 0.16);
    }

    .title span {
        display: block;
        color: var(--accent-cyan);
    }

    .cta {
        margin-top: 10px;
        font-size: clamp(1rem, 4vw, 1.2rem);
        line-height: 1.35;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.84);
        animation: promptPulse 1.5s ease-in-out infinite;
    }

    .hero-copy {
        margin: 0 auto;
        max-width: 260px;
        font-size: 0.98rem;
        line-height: 1.25;
        color: var(--text-soft);
    }

    .shop-toggle {
        pointer-events: auto;
        position: absolute;
        right: 16px;
        bottom: max(16px, env(safe-area-inset-bottom, 0px) + 10px);
        width: 62px;
        height: 62px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-main);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28), 0 0 20px rgba(114, 242, 255, 0.18);
        transition: transform 0.16s ease, filter 0.16s ease;
        z-index: 50;
    }

    .shop-toggle:active {
        transform: scale(0.95);
        filter: brightness(1.08);
    }

    .shop-toggle-icon {
        font-size: 1.55rem;
        filter: drop-shadow(0 0 10px rgba(114, 242, 255, 0.36));
    }

    .shop-panel {
        pointer-events: auto;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: min(60vh, 520px);
        border-radius: 28px 28px 0 0;
        display: flex;
        flex-direction: column;
        z-index: 40;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .shop-hidden { transform: translateY(110%); }
    .shop-visible { transform: translateY(0); }

    .shop-grab {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 10px 0 4px;
    }

    .shop-grab-bar {
        width: 52px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.28);
    }

    .shop-header {
        padding: 10px 18px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    .shop-heading-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .shop-title {
        margin: 0;
        font-family: 'Audiowide', 'Orbitron', system-ui, sans-serif;
        font-size: 1.2rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .close-shop {
        min-width: 38px;
        min-height: 38px;
        border-radius: 10px;
        color: var(--text-soft);
        background: rgba(255,255,255,0.05);
        transition: background 0.16s ease, color 0.16s ease;
    }

    .close-shop:active {
        background: rgba(255,255,255,0.12);
        color: var(--text-main);
    }

    .shop-list {
        flex: 1;
        overflow-y: auto;
        padding: 14px 14px calc(22px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .shop-item {
        position: relative;
        transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .shop-item:active {
        transform: scale(0.985);
    }

    .shop-item-inner {
        position: relative;
        z-index: 1;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }

    .shop-item-main {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .item-badge {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 1.25rem;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 0 20px rgba(0,0,0,0.2);
    }

    .item-copy {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .item-name {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .item-income {
        font-size: 0.82rem;
        color: var(--text-soft);
    }

    .shop-btn {
        flex: 0 0 auto;
        min-width: 92px;
        padding: 11px 12px;
        border-radius: 14px;
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        color: #06111e;
        background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
        box-shadow: 0 8px 18px rgba(91, 141, 255, 0.3);
        transition: transform 0.16s ease, filter 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
    }

    .shop-btn:active:not(:disabled) {
        transform: scale(0.97);
        filter: brightness(1.08);
    }

    .shop-btn:disabled {
        background: linear-gradient(135deg, rgba(89, 104, 128, 0.5), rgba(62, 73, 94, 0.65));
        color: rgba(229, 240, 255, 0.45);
        box-shadow: none;
        opacity: 0.72;
        cursor: not-allowed;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.18); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 999px; }

    @keyframes starPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 6px rgba(114, 242, 255, 0.08), 0 0 32px rgba(114, 242, 255, 0.26), 0 0 80px rgba(180, 110, 255, 0.22); }
        50% { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(114, 242, 255, 0.1), 0 0 44px rgba(114, 242, 255, 0.3), 0 0 94px rgba(180, 110, 255, 0.28); }
    }

    @keyframes orbitFloat {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes promptPulse {
        0%, 100% { opacity: 0.68; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-2px); }
    }

    @media (min-width: 768px) {
        .hero-frame { width: min(70vw, 430px); }
        .shop-panel {
            left: auto;
            width: min(420px, 100vw);
            right: 18px;
            bottom: 18px;
            height: min(68vh, 560px);
            border-radius: 28px;
        }
    }

    .feedback-stack {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: max(88px, env(safe-area-inset-bottom, 0px) + 82px);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px;
        pointer-events: none;
        z-index: 35;
    }

    .feedback-gif {
        width: min(28vw, 112px);
        max-height: 112px;
        object-fit: contain;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(8, 14, 30, 0.48);
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(10px) scale(0.94);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .feedback-gif.active {
        opacity: 0.95;
        transform: translateY(0) scale(1);
    }

    .feedback-gif--celebrate {
        align-self: flex-end;
    }

    .feedback-gif--fail {
        align-self: center;
    }

    @media (max-width: 480px) {
        .hud { padding: 10px; }
        .hud-card { min-width: 108px; padding: 9px 11px 10px; border-radius: 16px; }
        .hud-value { font-size: 1.15rem; }
        .hud-income { font-size: 0.98rem; }
        .hero-frame { padding: 18px 16px 16px; }
        .hero-emblem { width: 104px; height: 104px; margin-bottom: 14px; }
        .hero-orbit { width: 144px; height: 64px; }
        .hero-orbit--alt { width: 156px; height: 86px; }
        .shop-toggle { width: 58px; height: 58px; }
        .shop-panel { height: min(58vh, 500px); }
        .shop-item-inner { padding: 11px; }
        .shop-btn { min-width: 82px; padding: 10px 10px; font-size: 0.56rem; }
        .item-badge { width: 38px; height: 38px; flex-basis: 38px; font-size: 1.1rem; }
        .feedback-stack {
            left: 10px;
            right: 10px;
            bottom: max(82px, env(safe-area-inset-bottom, 0px) + 74px);
        }
        .feedback-gif {
            width: min(30vw, 88px);
            max-height: 88px;
        }
    }
</style>
</head>

<!-- Assets -->

<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.buffers = {};
        this.isUnlocked = false;
        this.lastPlayedAt = {};
        this.sounds = {
            bgm: document.getElementById('bgm_main'),
            buy: document.getElementById('sfx_buy'),
            start: document.getElementById('sfx_unlock'),
            blocked: document.getElementById('sfx_blocked'),
            menuOpen: document.getElementById('sfx_menu_open'),
            menuClose: document.getElementById('sfx_menu_close')
        };
    }

    init() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.5;
        this.masterGain.connect(this.ctx.destination);

        Object.entries(this.sounds).forEach(([key, el]) => {
            if (key !== 'bgm' && el?.src) this.loadBuffer(key, el.src);
        });

        if (this.sounds.bgm) {
            this.sounds.bgm.volume = 0.2;
        }

        const unlockHandler = () => {
            if (!this.ctx || this.isUnlocked) return;
            this.isUnlocked = true;
            this.ctx.resume()
                .then(() => {
                    this.playBgm();
                    window.removeEventListener('pointerdown', unlockHandler);
                    window.removeEventListener('keydown', unlockHandler);
                })
                .catch(() => {});
        };

        window.addEventListener('pointerdown', unlockHandler, { passive: true });
        window.addEventListener('keydown', unlockHandler);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) this.pauseBgm();
            else if (this.isUnlocked) this.playBgm();
        });
    }

    async loadBuffer(key, src) {
        if (!this.ctx || !src) return;
        try {
            const audioUrl = new URL(src, window.location.href);
            if (audioUrl.origin !== window.location.origin) {
                return;
            }

            const response = await fetch(audioUrl.href);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[key] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, will use element or synth fallback', e);
        }
    }

    playBgm() {
        if (!this.isUnlocked || !this.sounds.bgm) return;
        this.sounds.bgm.play().catch(() => {});
    }

    pauseBgm() {
        if (this.sounds.bgm && !this.sounds.bgm.paused) {
            this.sounds.bgm.pause();
        }
    }

    playSfx(key, { minGap = 90 } = {}) {
        if (!this.ctx || !this.isUnlocked) return;
        const now = performance.now();
        if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
        this.lastPlayedAt[key] = now;

        if (this.buffers[key]) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = this.buffers[key];
            gain.gain.value = key === 'blocked' ? 0.45 : 0.6;
            source.connect(gain);
            gain.connect(this.masterGain || this.ctx.destination);
            source.start(0);
            return;
        }

        const mediaEl = this.sounds[key];
        if (mediaEl?.src) {
            try {
                const clone = mediaEl.cloneNode(true);
                clone.volume = key === 'blocked' ? 0.45 : 0.6;
                clone.play().catch(() => this.synthFallback(key));
                return;
            } catch (e) {
                console.warn('Audio element playback failed, using synth fallback', e);
            }
        }

        this.synthFallback(key);
    }

    synthFallback(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain || this.ctx.destination);

        const settings = {
            buy: { start: 680, end: 1120, duration: 0.12, shape: 'triangle', volume: 0.14 },
            start: { start: 420, end: 920, duration: 0.22, shape: 'sine', volume: 0.12 },
            blocked: { start: 240, end: 180, duration: 0.16, shape: 'square', volume: 0.12 },
            menuOpen: { start: 520, end: 720, duration: 0.1, shape: 'triangle', volume: 0.08 },
            menuClose: { start: 700, end: 420, duration: 0.1, shape: 'triangle', volume: 0.08 }
        }[type] || { start: 440, end: 660, duration: 0.12, shape: 'sine', volume: 0.1 };

        osc.type = settings.shape;
        osc.frequency.setValueAtTime(settings.start, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(settings.end, this.ctx.currentTime + settings.duration);
        gain.gain.setValueAtTime(settings.volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + settings.duration);
        osc.start();
        osc.stop(this.ctx.currentTime + settings.duration);
    }
}

window.gameConfigDefs = {

};
window.gameConfig = {

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.01;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        return this.life > 0;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Entity {
    constructor(def, w, h) {
        this.def = def;
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 0.5 + 0.1) * (50 / (def.size + 10));
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.angle = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
    }

    update(w, h) {
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.rotSpeed;

        if (this.x < -100) this.x = w + 100;
        if (this.x > w + 100) this.x = -100;
        if (this.y < -100) this.y = h + 100;
        if (this.y > h + 100) this.y = -100;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.def.glow > 0) {
            ctx.shadowBlur = this.def.glow;
            ctx.shadowColor = this.def.color;
        }

        if (this.def.type === 'spiral') {
            ctx.strokeStyle = this.def.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                ctx.rotate(Math.PI * 2 / 3);
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(this.def.size, this.def.size, -this.def.size, this.def.size * 2, 0, this.def.size * 3);
            }
            ctx.stroke();
        } else if (this.def.id.includes('black_hole')) {
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, 0, this.def.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = this.def.stroke || '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            const grad = ctx.createRadialGradient(-this.def.size * 0.3, -this.def.size * 0.3, 0, 0, 0, this.def.size);
            grad.addColorStop(0, '#fff');
            grad.addColorStop(0.5, this.def.color);
            grad.addColorStop(1, '#000');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, this.def.size, 0, Math.PI * 2);
            ctx.fill();

            if (this.def.size >= 8) {
                ctx.strokeStyle = 'rgba(255,255,255,0.18)';
                ctx.lineWidth = Math.max(1, this.def.size * 0.08);
                ctx.beginPath();
                ctx.arc(this.def.size * 0.1, this.def.size * 0.05, this.def.size * 0.6, -1.1, 0.6);
                ctx.stroke();
            }
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }
}

const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    lastTime: 0,
    audio: new AudioManager(),
    
    money: 20,
    incomePerSec: 0,
    entities: [],
    particles: [],
    stars: [],
    isRunning: false,
    shopOpen: false,
    gifTimers: {},

    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        
        const configEl = document.getElementById('game-config');
        if (configEl) {
            try {
                const parsed = JSON.parse(configEl.textContent);
                Object.keys(parsed).forEach(k => {
                    if (window.gameConfigDefs[k]) window.gameConfigDefs[k] = parsed[k];
                    window.gameConfig[k] = parsed[k].value;
                });
            } catch (e) {
                console.error("Config parse error", e);
            }
        }
        this.money = window.gameConfig.startingMoney;

        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.setupInput();
        this.setupShop();
        
        for (let i = 0; i < 100; i++) {
            this.stars.push({
                x: Math.random() * this.width,
                y: Math.random() * this.height,
                size: Math.random() * 2,
                alpha: Math.random(),
                speed: Math.random() * 0.2
            });
        }

        this.audio.init();
        requestAnimationFrame(t => this.loop(t));
        
        setInterval(() => {
            if (this.isRunning) {
                this.money += this.incomePerSec * window.gameConfig.incomeMultiplier;
                this.updateHUD();
                this.updateShopButtons();
            }
        }, 1000);
    },

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * window.devicePixelRatio;
        this.canvas.height = this.height * window.devicePixelRatio;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    },

    setupInput() {
        const startHandler = (e) => {
            if (this.isRunning) return;
            if (e.target.closest('#shop-toggle')) return;
            this.startGame();
        };
        
        document.addEventListener('pointerdown', startHandler);
        document.addEventListener('keydown', startHandler);

        this.canvas.addEventListener('pointerdown', (e) => {
            if (!this.isRunning) return;
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            this.spawnParticles(x, y, '#ffffff', 5);
        });

        document.getElementById('shop-toggle').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            this.toggleShop();
        });
        document.getElementById('close-shop').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            this.toggleShop(false);
        });
    },

    startGame() {
        this.isRunning = true;
        window.gameStarted = true;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('shop-toggle').classList.remove('hidden');
        this.audio.playSfx('start', { minGap: 250 });
        this.showFeedbackGif('celebrate', 1800);
        this.updateHUD();
        this.updateShopButtons();
    },

    setupShop() {
        const list = document.getElementById('shop-list');
        GAME_DATA.forEach(item => {
            const theme = ENTITY_THEMES[item.id] || { icon: '✨', badge: 'linear-gradient(135deg, #72f2ff, #5b8dff)' };
            const div = document.createElement('div');
            div.className = 'shop-item glass panel-rim';
            div.innerHTML = `
                <div class="shop-item-inner">
                    <div class="shop-item-main">
                        <div class="item-badge" style="background:${theme.badge};">${theme.icon}</div>
                        <div class="item-copy">
                            <span class="item-name">${item.name}</span>
                            <span class="item-income">Drift: $${this.formatMoney(item.income)}/s</span>
                        </div>
                    </div>
                    <button class="shop-btn" id="btn-${item.id}">
                        $${this.formatMoney(item.cost)}
                    </button>
                </div>
            `;
            
            const btn = div.querySelector('button');
            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                this.buyItem(item);
            });
            
            list.appendChild(div);
        });
    },

    toggleShop(forceState) {
        const panel = document.getElementById('shop-panel');
        const wasOpen = this.shopOpen;
        if (forceState !== undefined) this.shopOpen = forceState;
        else this.shopOpen = !this.shopOpen;
        
        if (this.shopOpen) {
            panel.classList.remove('shop-hidden');
            panel.classList.add('shop-visible');
            if (!wasOpen) this.audio.playSfx('menuOpen', { minGap: 120 });
        } else {
            panel.classList.remove('shop-visible');
            panel.classList.add('shop-hidden');
            if (wasOpen) this.audio.playSfx('menuClose', { minGap: 120 });
        }
    },

    buyItem(item) {
        if (this.money >= item.cost) {
            this.money -= item.cost;
            this.incomePerSec += item.income;
            this.entities.push(new Entity(item, this.width, this.height));
            this.spawnParticles(this.width / 2, this.height / 2, item.color, 20);
            this.audio.playSfx('buy', { minGap: 70 });
            this.showFeedbackGif('celebrate', 1400);
            this.updateHUD();
            this.updateShopButtons();
        } else {
            this.audio.playSfx('blocked', { minGap: 180 });
            this.showFeedbackGif('fail', 1200);
        }
    },

    updateHUD() {
        document.getElementById('money-display').textContent = '$' + this.formatMoney(this.money);
        document.getElementById('income-display').textContent = '+$' + this.formatMoney(this.incomePerSec * window.gameConfig.incomeMultiplier) + '/s';
    },

    updateShopButtons() {
        GAME_DATA.forEach(item => {
            const btn = document.getElementById(`btn-${item.id}`);
            if (btn) {
                btn.disabled = this.money < item.cost;
            }
        });
    },

    showFeedbackGif(kind, duration = 1200) {
        const el = document.getElementById(kind === 'fail' ? 'gif-fail' : 'gif-celebrate');
        if (!el) return;
        clearTimeout(this.gifTimers[kind]);
        el.classList.add('active');
        this.gifTimers[kind] = setTimeout(() => {
            el.classList.remove('active');
        }, duration);
    },

    formatMoney(n) {
        if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
        if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(2) + 'k';
        return n.toLocaleString(undefined, { maximumFractionDigits: 1 });
    },

    spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            this.particles.push(new Particle(x, y, color));
        }
    },

    loop(t) {
        const dt = Math.min((t - this.lastTime) / 1000, 0.1);
        this.lastTime = t;

        try {
            const beaconX = this.width * 0.5 + Math.sin(t * 0.00025) * 24;
            const beaconY = this.height * 0.42 + Math.cos(t * 0.00018) * 16;

            this.ctx.fillStyle = '#050510';
            this.ctx.fillRect(0, 0, this.width, this.height);

            const bgGrad = this.ctx.createRadialGradient(beaconX, beaconY, 40, this.width * 0.5, this.height * 0.55, Math.max(this.width, this.height) * 0.78);
            bgGrad.addColorStop(0, 'rgba(83, 128, 255, 0.12)');
            bgGrad.addColorStop(0.35, 'rgba(74, 35, 120, 0.12)');
            bgGrad.addColorStop(1, 'rgba(3, 4, 12, 0)');
            this.ctx.fillStyle = bgGrad;
            this.ctx.fillRect(0, 0, this.width, this.height);

            this.ctx.fillStyle = '#ffffff';
            this.stars.forEach(star => {
                star.x -= star.speed;
                if (star.x < 0) star.x = this.width;
                this.ctx.globalAlpha = star.alpha * 0.5;
                this.ctx.beginPath();
                this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                this.ctx.fill();
            });
            this.ctx.globalAlpha = 1;

            this.entities.forEach(e => {
                e.update(this.width, this.height);
                e.draw(this.ctx);
            });

            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                if (!p.update()) {
                    this.particles.splice(i, 1);
                } else {
                    p.draw(this.ctx);
                }
            }

            if (!this.isRunning) {
                if (this.entities.length === 0) {
                    const demoTime = t * 0.001;
                    this.ctx.save();
                    this.ctx.translate(this.width / 2 + Math.sin(demoTime) * 50, this.height / 2 + Math.cos(demoTime) * 30);
                    this.ctx.shadowBlur = 30;
                    this.ctx.shadowColor = window.gameConfig.themeColor;
                    const pulse = 12 + Math.sin(demoTime * 1.4) * 2;
                    const demoGrad = this.ctx.createRadialGradient(-pulse * 0.25, -pulse * 0.25, 0, 0, 0, pulse * 1.2);
                    demoGrad.addColorStop(0, '#fff3b8');
                    demoGrad.addColorStop(0.35, window.gameConfig.themeColor);
                    demoGrad.addColorStop(1, 'rgba(6, 7, 16, 0)');
                    this.ctx.fillStyle = demoGrad;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, pulse, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.strokeStyle = 'rgba(114, 242, 255, 0.32)';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.beginPath();
                    this.ctx.ellipse(0, 0, pulse * 2.3, pulse * 0.9, demoTime, 0, Math.PI * 2);
                    this.ctx.stroke();
                    this.ctx.restore();
                }
            }

            void dt;
        } catch (e) {
            console.error("Game Loop Error", e);
        }

        requestAnimationFrame(nextTime => this.loop(nextTime));
    }
};
