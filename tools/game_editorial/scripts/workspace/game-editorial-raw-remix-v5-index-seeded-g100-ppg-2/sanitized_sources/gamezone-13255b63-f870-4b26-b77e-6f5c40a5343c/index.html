<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Paper Courier</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #7bc8ff;
    --sky-bottom: #dff4ff;
    --road-base: #62748a;
    --road-edge: #e9c46a;
    --road-dash: rgba(255, 252, 245, 0.9);
    --panel-bg: rgba(255, 253, 247, 0.95);
    --panel-border: #213047;
    --panel-shadow: rgba(19, 32, 50, 0.34);
    --hero-accent: #ff5d73;
    --hero-glow: rgba(255, 93, 115, 0.32);
    --ui-blue: #2d8cff;
    --ui-gold: #ffb347;
    --danger: #ff6b57;
    --text-main: #122033;
    --text-invert: #ffffff;
    --cloud: rgba(255, 255, 255, 0.52);
  }

  /* L0: Strict Height Chain */
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background:
      linear-gradient(180deg, var(--sky-top) 0%, #8fd3ff 34%, #bfe8ff 58%, var(--sky-bottom) 100%);
  }

  body {
    font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    color: var(--text-main);
    position: relative;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    inset: auto;
    pointer-events: none;
    z-index: 0;
    border-radius: 999px;
    background: var(--cloud);
    filter: blur(1px);
  }

  body::before {
    width: 150px;
    height: 42px;
    top: 9%;
    left: 8%;
    box-shadow:
      38px -12px 0 8px var(--cloud),
      86px 4px 0 2px var(--cloud),
      12px 12px 0 6px rgba(255, 255, 255, 0.32);
    animation: driftCloud 18s linear infinite;
  }

  body::after {
    width: 120px;
    height: 34px;
    top: 18%;
    right: 10%;
    box-shadow:
      28px -8px 0 6px var(--cloud),
      62px 2px 0 1px var(--cloud);
    animation: driftCloud 22s linear infinite reverse;
  }

  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #game-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(circle at 20% 12%, rgba(255,255,255,0.24), transparent 18%),
      radial-gradient(circle at 82% 16%, rgba(255,255,255,0.18), transparent 16%),
      linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
    mix-blend-mode: screen;
  }

  canvas {
    display: block;
    touch-action: none;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 2;
  }

  .paper-text {
    color: var(--text-invert);
    text-shadow:
      0 2px 0 rgba(18, 32, 51, 0.85),
      0 0 12px rgba(16, 28, 44, 0.22);
  }

  .paper-panel {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245, 248, 255, 0.95));
    border: 4px solid var(--panel-border);
    box-shadow:
      0 12px 0 rgba(33, 48, 71, 0.9),
      0 24px 28px rgba(17, 29, 44, 0.28);
    border-radius: 18px;
    color: var(--text-main);
    overflow: hidden;
  }

  .paper-panel::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 18px;
    background: repeating-linear-gradient(
      90deg,
      #ffd166 0 18px,
      #ff8fab 18px 36px,
      #7bdff2 36px 54px,
      #b8f2e6 54px 72px
    );
    border-bottom: 4px solid var(--panel-border);
  }

  .paper-btn {
    background: linear-gradient(180deg, #ff6f83, #ff546c);
    border: 4px solid var(--panel-border);
    color: var(--text-invert);
    box-shadow: 0 6px 0 #213047;
    border-radius: 14px;
    transition: transform 0.1s, box-shadow 0.1s, filter 0.18s ease;
    text-shadow: 0 2px 0 rgba(18, 32, 51, 0.75);
    font-family: 'Bangers', 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.06em;
    cursor: pointer;
    min-height: 56px;
  }

  .paper-btn:hover,
  .paper-btn:focus-visible {
    filter: brightness(1.06);
    outline: none;
  }

  .paper-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #213047;
  }

  .absolute { position: absolute; }
  .hidden { display: none; }
  .inset-0 { inset: 0; }
  .z-50 { z-index: 50; }
  .pointer-events-none { pointer-events: none; }
  .pointer-events-auto { pointer-events: auto; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-start { align-items: flex-start; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .w-full { width: 100%; }
  .text-center { text-align: center; }
  .p-4 { padding: 1rem; }
  .p-8 { padding: 2rem; }
  .mb-2 { margin-bottom: 0.5rem; }
  .mb-6 { margin-bottom: 1.5rem; }
  .max-w-sm { max-width: 24rem; }
  .uppercase { text-transform: uppercase; }
  .tracking-wide { letter-spacing: 0.05em; }
  .transition-opacity { transition-property: opacity; }
  .duration-300 { transition-duration: 300ms; }
  .font-bold { font-weight: 700; }
  .font-black { font-weight: 900; }
  .drop-shadow-md { filter: drop-shadow(0 4px 3px rgba(0,0,0,0.25)); }
  .text-3xl { font-size: 1.9rem; line-height: 1; }
  .text-2xl { font-size: 1.5rem; line-height: 1.2; }
  .text-xl { font-size: 1.25rem; line-height: 1.2; }
  .text-5xl { font-size: 3rem; line-height: 1; }
  .text-\[\#FFA502\] { color: #FFA502; }
  .text-\[\#FF4757\] { color: #FF4757; }
  .text-\[\#1E90FF\] { color: #1E90FF; }
  .bg-black\/40 { background: rgba(12, 20, 31, 0.42); }
  .backdrop-blur-sm { backdrop-filter: blur(4px); }
  .px-8 { padding-left: 2rem; padding-right: 2rem; }
  .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
  .w-\[85\%\] { width: 85%; }

  /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
  #ui-layer {
    position: relative;
    z-index: 3;
  }

  #hud {
    gap: 0.75rem;
  }

  .hud-card {
    display: inline-flex;
    flex-direction: column;
    gap: 0.2rem;
    min-width: 0;
    padding: 0.6rem 0.85rem 0.5rem;
    border-radius: 16px;
    border: 3px solid rgba(24, 36, 55, 0.92);
    background:
      linear-gradient(180deg, rgba(20, 33, 52, 0.84), rgba(35, 50, 72, 0.86));
    box-shadow:
      0 8px 18px rgba(15, 24, 38, 0.22),
      inset 0 1px 0 rgba(255,255,255,0.18);
    backdrop-filter: blur(6px);
  }

  .hud-label {
    font-family: 'Bangers', 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.9;
  }

  .hud-value {
    font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
  }

  #hud .deliveries-card .hud-label,
  #hud .deliveries-card .hud-value {
    color: #fff7d6;
  }

  #hud .rush-card .hud-label,
  #hud .rush-card .hud-value {
    color: #ffe5bd;
  }

  #hud, .paper-panel p, #restart-btn {
    font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
  }

  #game-over-screen h1 {
    font-family: 'Bangers', 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.04em;
    margin-top: 0.6rem;
  }

  .feedback-strip {
    position: absolute;
    right: 0.85rem;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 0.85rem);
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.55rem;
    pointer-events: none;
  }

  .feedback-gif {
    width: min(30vw, 132px);
    max-width: 132px;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 18px;
    border: 3px solid rgba(33, 48, 71, 0.92);
    box-shadow: 0 8px 20px rgba(17, 29, 44, 0.26);
    background: rgba(255,255,255,0.55);
    opacity: 0;
    transform: translateY(12px) scale(0.94);
    transition: opacity 180ms ease, transform 180ms ease;
  }

  .feedback-gif.is-visible {
    opacity: 0.92;
    transform: translateY(0) scale(1);
  }

  .feedback-caption {
    font-family: 'Bangers', 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    color: #ffffff;
    background: rgba(18, 32, 51, 0.72);
    border: 2px solid rgba(255,255,255,0.32);
    border-radius: 999px;
    padding: 0.35rem 0.75rem;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(17, 29, 44, 0.18);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 180ms ease, transform 180ms ease;
  }

  .feedback-caption.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .game-over-subtitle {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #4f5f75;
    margin-top: 1.1rem;
    margin-bottom: 0.4rem;
  }

  .panel-scroll-safe {
    max-height: 90vh;
  }

  @media (max-width: 560px) {
    .p-4 { padding: 0.85rem; }
    .p-8 { padding: 1.15rem; }
    .text-5xl { font-size: 2.2rem; }
    .text-3xl { font-size: 1.3rem; }
    .text-2xl { font-size: 1.25rem; }
    .text-xl { font-size: 1rem; }
    .w-\[85\%\] { width: min(88%, 24rem); }

    #hud {
      gap: 0.5rem;
    }

    .hud-card {
      padding: 0.45rem 0.65rem;
      border-radius: 14px;
    }

    .hud-label {
      font-size: 0.55rem;
    }

    .hud-value {
      font-size: 0.95rem;
    }

    .paper-btn {
      min-height: 52px;
      font-size: 1rem;
    }

    .feedback-strip {
      right: 0.65rem;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 0.65rem);
    }

    .feedback-gif {
      width: min(26vw, 96px);
      border-radius: 14px;
    }

    .feedback-caption {
      font-size: 0.74rem;
      padding: 0.28rem 0.62rem;
    }
  }

  @keyframes driftCloud {
    0% { transform: translateX(0); }
    50% { transform: translateX(16px); }
    100% { transform: translateX(0); }
  }
</style>

<script id="game-config" type="application/x-game-config">
{
  "heroSpeed": { "type": "number", "label": "Courier Handling", "value": 8, "min": 1, "max": 12 },
  "themeColor": { "type": "color", "label": "Courier Color", "value": "#FF4757" },
  "enemyColor": { "type": "color", "label": "Barrier Color", "value": "#FFA502" }
}
</script>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <!-- [agent-note][stage3] resolved-gif: courier-feedback overlays -> catalogs/gifs.json | keep off playfield for mobile safety -->
  <div class="feedback-strip" aria-hidden="true">
    <img
      id="feedback-win-gif"
      class="feedback-gif"
      alt="Courier success reaction"
      src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
      decoding="async"
      loading="lazy"
    >
    <img
      id="feedback-crash-gif"
      class="feedback-gif"
      alt="Courier crash reaction"
      src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
      decoding="async"
      loading="lazy"
    >
    <div id="feedback-caption" class="feedback-caption">Delivery Rush</div>
  </div>
  
  <!-- UI Layer -->
  <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between p-4">
    <!-- HUD -->
    <div id="hud" class="flex justify-between items-start w-full transition-opacity duration-300">
      <div class="hud-card deliveries-card paper-text">
        <span class="hud-label">Deliveries</span>
        <span class="hud-value"><span id="score-display">0</span></span>
      </div>
      <div class="hud-card rush-card paper-text">
        <span class="hud-label">Rush</span>
        <span class="hud-value"><span id="speed-display">1.0</span>x</span>
      </div>
    </div>
    
    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center pointer-events-auto bg-black/40 backdrop-blur-sm">
      <div class="paper-panel panel-scroll-safe p-8 text-center flex flex-col items-center w-[85%] max-w-sm">
        <h1 class="text-[#FF4757] text-5xl font-black mb-2 drop-shadow-md">ROUTE BLOCKED!</h1>
        <p class="game-over-subtitle">Courier Jam</p>
        <p class="text-2xl mb-6 font-bold">PACKAGES: <span id="final-score" class="text-[#1E90FF]">0</span></p>
        <button id="restart-btn" class="paper-btn px-8 py-4 text-2xl font-bold uppercase tracking-wide pointer-events-auto w-full">
          Dispatch Again
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Media Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/crash -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_rush" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
<audio id="sfx_crash" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>

<script>
/** 
 * L0: System Invariants & Core Engine
 */
let canvas, ctx, ro;
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
let lastTime = 0;
let animationFrameId;

// Config
let gameConfig = {};
let gameConfigDefs = {};

// Audio
let audioCtx = null;
let bgmEl = null;
let audioUnlocked = false;
let sfxEls = {};
let sfxLastPlay = {
  collect: 0,
  rush: 0,
  crash: 0,
  restart: 0
};

// Game State
let score = 0;
let baseSpeed = 1;
let speedMultiplier = 1;
let timeAlive = 0;
let shakeTime = 0;

// Entities
let player = null;
let enemies = [];
let particles = [];
let roadMarks = [];

// Input
let pointerActive = false;
let targetX = 0;
const ENABLE_ANIMATIONS = true;

function parseConfig() {
  try {
    const script = document.getElementById('game-config');
    if (script) {
      gameConfigDefs = JSON.parse(script.textContent);
      for (const key in gameConfigDefs) {
        gameConfig[key] = gameConfigDefs[key].value;
      }
    }
  } catch (e) {
    console.error("Config parse error", e);
    gameConfig = { heroSpeed: 8, themeColor: "#FF4757", enemyColor: "#FFA502" };
  }
}

window.updateGameConfig = (key, val) => {
  if (gameConfig[key] !== undefined) {
    gameConfig[key] = val;
    if (player && key === 'themeColor') player.color = val;
  }
};

/**
 * Audio System (O(1) SFX, Synthesis Fallback)
 */
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  bgmEl = document.getElementById('bgm_main');
  sfxEls = {
    collect: document.getElementById('sfx_collect'),
    rush: document.getElementById('sfx_rush'),
    crash: document.getElementById('sfx_crash'),
    restart: document.getElementById('sfx_restart')
  };

  if (bgmEl) {
    bgmEl.volume = 0.24;
    bgmEl.muted = true;
  }

  Object.values(sfxEls).forEach((el) => {
    if (!el) return;
    el.volume = 0.5;
  });

  if (sfxEls.collect) sfxEls.collect.volume = 0.42;
  if (sfxEls.rush) sfxEls.rush.volume = 0.36;
  if (sfxEls.crash) sfxEls.crash.volume = 0.48;
  if (sfxEls.restart) sfxEls.restart.volume = 0.32;
}

function setBgmPlayback(active) {
  if (!bgmEl || !audioUnlocked) return;
  if (active) {
    bgmEl.muted = false;
    bgmEl.play().catch(() => {});
  } else {
    bgmEl.pause();
    bgmEl.currentTime = 0;
  }
}

function unlockAudio() {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  audioUnlocked = true;
  if (gameState === 'PLAYING') {
    setBgmPlayback(true);
  }
}

function playSfx(type) {
  const el = sfxEls[type];
  const now = performance.now();
  const minGap = {
    collect: 110,
    rush: 420,
    crash: 700,
    restart: 250
  }[type] ?? 120;

  if (now - (sfxLastPlay[type] || 0) < minGap) return;
  sfxLastPlay[type] = now;

  if (el && audioUnlocked) {
    try {
      el.currentTime = 0;
      el.play().catch(() => {});
      return;
    } catch (e) {}
  }

  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'collect') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(620, t);
    osc.frequency.exponentialRampToValueAtTime(980, t + 0.08);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
    osc.start(t);
    osc.stop(t + 0.12);
  } else if (type === 'rush' || type === 'restart') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(680, t + 0.16);
    gain.gain.setValueAtTime(0.11, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
    osc.start(t);
    osc.stop(t + 0.18);
  } else if (type === 'crash') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(55, t + 0.22);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.24);
    osc.start(t);
    osc.stop(t + 0.24);
  }
}

function vibrate(style = 'light') {
  try {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
      action: 'vibrate',
      requestId: 'h5-' + Date.now(),
      version: '1.0',
      params: { style }
    });
  } catch (e) {}
}

/**
 * UI & State Management
 */
let feedbackTimer = 0;

function showFeedback(kind, label) {
  const winGif = document.getElementById('feedback-win-gif');
  const crashGif = document.getElementById('feedback-crash-gif');
  const caption = document.getElementById('feedback-caption');

  if (!winGif || !crashGif || !caption) return;

  winGif.classList.toggle('is-visible', kind === 'win');
  crashGif.classList.toggle('is-visible', kind === 'crash');
  caption.textContent = label;
  caption.classList.add('is-visible');

  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => {
    winGif.classList.remove('is-visible');
    crashGif.classList.remove('is-visible');
    caption.classList.remove('is-visible');
  }, kind === 'crash' ? 1600 : 900);
}

function setState(newState) {
  gameState = newState;
  const hud = document.getElementById('hud');
  const goScreen = document.getElementById('game-over-screen');
  
  if (gameState === 'PLAYING') {
    hud.style.opacity = '1';
    goScreen.classList.add('hidden');
    showFeedback('win', 'Route Live');
    setBgmPlayback(true);
  } else if (gameState === 'GAMEOVER') {
    hud.style.opacity = '0';
    goScreen.classList.remove('hidden');
    document.getElementById('final-score').innerText = Math.floor(score);
    showFeedback('crash', 'Route Blocked');
    setBgmPlayback(false);
  }
}

/**
 * Input Routing
 */
function handleGlobalInput(e) {
  unlockAudio();
  if (gameState === 'GAMEOVER') return;
  if (!canvas || e.target !== canvas) return;
  
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  
  if (e.type === 'pointerdown' || e.type === 'pointermove') {
    pointerActive = true;
    targetX = x;
  } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
    pointerActive = false;
  }
}

/**
 * Game Entities
 */
class Player {
  constructor() {
    this.w = 40;
    this.h = 60;
    this.x = cw / 2;
    this.y = ch - this.h - 60;
    this.color = gameConfig.themeColor;
    this.tilt = 0;
    this.bob = 0;
  }
  update(dt) {
    if (!isFinite(this.x) || !isFinite(this.y)) {
      this.x = cw / 2;
      this.y = ch - this.h - 60;
    }
    
    const speedFactor = Math.min(gameConfig.heroSpeed * dt, 1);
    const oldX = this.x;
    
    if (pointerActive) {
      const margin = this.w / 2 + 10;
      const clampedTarget = Math.max(margin, Math.min(cw - margin, targetX));
      this.x += (clampedTarget - this.x) * speedFactor * 1.5;
    }
    
    const dx = this.x - oldX;
    this.tilt = dx * 0.05;
    this.bob += dt * 8;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + (ENABLE_ANIMATIONS ? Math.sin(this.bob) * 1.8 : 0));
    ctx.rotate(this.tilt);
    
    // Courier glow
    ctx.fillStyle = 'rgba(255, 93, 115, 0.16)';
    ctx.beginPath();
    ctx.ellipse(0, 6, this.w * 0.82, this.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Paper shadow
    ctx.fillStyle = 'rgba(16, 27, 44, 0.22)';
    ctx.fillRect(-this.w / 2 + 6, -this.h / 2 + 7, this.w, this.h);

    // Wheels shadow
    ctx.fillRect(-this.w / 2 - 2, -this.h / 2 + 10, 4, 12);
    ctx.fillRect(this.w / 2 + 2, -this.h / 2 + 10, 4, 12);
    ctx.fillRect(-this.w / 2 - 2, this.h / 2 - 10, 4, 12);
    ctx.fillRect(this.w / 2 + 2, this.h / 2 - 10, 4, 12);

    // Wheels
    ctx.fillStyle = '#213047';
    ctx.fillRect(-this.w / 2 - 4, -this.h / 2 + 4, 8, 14);
    ctx.fillRect(this.w / 2 - 4, -this.h / 2 + 4, 8, 14);
    ctx.fillRect(-this.w / 2 - 4, this.h / 2 - 18, 8, 14);
    ctx.fillRect(this.w / 2 - 4, this.h / 2 - 18, 8, 14);

    // Car Body
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#213047';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(255, 93, 115, 0.2)';
    ctx.shadowBlur = 10;

    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    ctx.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);

    // Header stripe
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffe08a';
    ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 6, this.w - 6, 7);

    // Windshield
    ctx.fillStyle = '#b9ecff';
    ctx.fillRect(-this.w / 2 + 4, -this.h / 4 - 4, this.w - 8, this.h / 4);
    ctx.strokeRect(-this.w / 2 + 4, -this.h / 4 - 4, this.w - 8, this.h / 4);

    // Rear window
    ctx.fillRect(-this.w / 2 + 6, this.h / 2 - 12, this.w - 12, 8);
    ctx.strokeRect(-this.w / 2 + 6, this.h / 2 - 12, this.w - 12, 8);

    // Envelope sign
    ctx.fillStyle = '#fff8ef';
    ctx.beginPath();
    ctx.roundRect(-10, -1, 20, 14, 3);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-10, -1);
    ctx.lineTo(0, 7);
    ctx.lineTo(10, -1);
    ctx.stroke();

    // Courier light
    ctx.fillStyle = '#fff2a1';
    ctx.beginPath();
    ctx.arc(0, -this.h / 2 + 5, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Enemy {
  constructor() {
    this.w = 32;
    this.h = 40;
    const margin = this.w / 2 + 20;
    this.x = margin + Math.random() * (cw - margin * 2);
    this.y = -this.h - 20;
    this.baseSpeed = (150 + Math.random() * 100);
    this.color = gameConfig.enemyColor;
    this.passed = false;
    this.wobble = Math.random() * Math.PI * 2;
  }
  update(dt) {
    this.y += this.baseSpeed * speedMultiplier * dt;
    this.wobble += dt * 6;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + (ENABLE_ANIMATIONS ? Math.sin(this.wobble) * 1.2 : 0));
    
    // Shadow
    ctx.fillStyle = 'rgba(13, 24, 40, 0.18)';
    ctx.beginPath();
    ctx.ellipse(0, this.h / 2 + 5, this.w * 0.48, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cone Base
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#213047';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    
    ctx.beginPath();
    ctx.moveTo(0, -this.h / 2);
    ctx.lineTo(this.w / 2, this.h / 2);
    ctx.lineTo(-this.w / 2, this.h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // White stripe
    ctx.fillStyle = '#fff9ef';
    ctx.beginPath();
    ctx.moveTo(-this.w / 4, 0);
    ctx.lineTo(this.w / 4, 0);
    ctx.lineTo(this.w / 3, this.h / 4);
    ctx.lineTo(-this.w / 3, this.h / 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Hazard cap
    ctx.fillStyle = '#213047';
    ctx.beginPath();
    ctx.arc(0, -this.h / 2 + 5, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 200;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - 100; // slight upward bias
    this.life = 1.0;
    this.color = Math.random() > 0.5 ? color : '#fff';
    this.size = 6 + Math.random() * 8;
    this.rot = Math.random() * Math.PI;
    this.rotSpeed = (Math.random() - 0.5) * 10;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += 400 * dt; // gravity
    this.rot += this.rotSpeed * dt;
    this.life -= dt * 1.5;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = Math.max(0, this.life);
    
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#213047';
    ctx.lineWidth = 2;
    
    // Draw torn paper scrap
    ctx.beginPath();
    ctx.moveTo(-this.size / 2, -this.size / 2);
    ctx.lineTo(this.size / 2, -this.size / 2 + Math.random() * 2);
    ctx.lineTo(this.size / 2 - Math.random() * 2, this.size / 2);
    ctx.lineTo(-this.size / 2, this.size / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    ctx.restore();
  }
}

class RoadMark {
  constructor(y) {
    this.y = y !== undefined ? y : -100;
    this.speed = 200;
  }
  update(dt) {
    this.y += this.speed * speedMultiplier * dt;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(0, this.y);
    
    // Center line
    ctx.fillStyle = 'rgba(255, 252, 245, 0.9)';
    ctx.fillRect(cw / 2 - 5, 0, 10, 60);
    
    // Side borders
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = '#213047';
    ctx.lineWidth = 2;
    
    ctx.fillRect(10, 0, 10, 60);
    ctx.strokeRect(10, 0, 10, 60);
    
    ctx.fillRect(cw - 20, 0, 10, 60);
    ctx.strokeRect(cw - 20, 0, 10, 60);
    
    ctx.restore();
  }
}

let enemySpawnTimer = 0;
let markSpawnTimer = 0;

function drawBackdrop() {
  // Sky
  const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
  skyGradient.addColorStop(0, '#7bc8ff');
  skyGradient.addColorStop(0.35, '#8fd3ff');
  skyGradient.addColorStop(0.65, '#c8ecff');
  skyGradient.addColorStop(1, '#eaf7ff');
  ctx.fillStyle = skyGradient;
  ctx.fillRect(0, 0, cw, ch);

  // Distant skyline
  const blockColors = ['#89a0b8', '#7d92a8', '#96abc0'];
  for (let i = 0; i < 6; i++) {
    const width = cw * (0.12 + i * 0.015);
    const x = i * (cw / 5.5) - 18;
    const height = ch * (0.08 + (i % 3) * 0.03);
    const y = ch * 0.22 - height;
    ctx.fillStyle = blockColors[i % blockColors.length];
    ctx.fillRect(x, y, width, height);
  }

  // Road
  const roadTop = ch * 0.12;
  const roadGradient = ctx.createLinearGradient(0, roadTop, 0, ch);
  roadGradient.addColorStop(0, '#6e8094');
  roadGradient.addColorStop(1, '#4b5c70');
  ctx.fillStyle = roadGradient;
  ctx.beginPath();
  ctx.moveTo(cw * 0.34, roadTop);
  ctx.lineTo(cw * 0.66, roadTop);
  ctx.lineTo(cw * 0.92, ch);
  ctx.lineTo(cw * 0.08, ch);
  ctx.closePath();
  ctx.fill();

  // Verge
  ctx.fillStyle = '#8dcf78';
  ctx.beginPath();
  ctx.moveTo(0, ch);
  ctx.lineTo(0, ch * 0.32);
  ctx.lineTo(cw * 0.34, roadTop);
  ctx.lineTo(cw * 0.08, ch);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cw, ch);
  ctx.lineTo(cw, ch * 0.32);
  ctx.lineTo(cw * 0.66, roadTop);
  ctx.lineTo(cw * 0.92, ch);
  ctx.closePath();
  ctx.fill();

  // Postage-stamp edge trim
  ctx.strokeStyle = 'rgba(255,255,255,0.42)';
  ctx.lineWidth = 3;
  ctx.setLineDash([3, 8]);
  ctx.strokeRect(8, 8, cw - 16, ch - 16);
  ctx.setLineDash([]);
}

/**
 * Core Lifecycle
 */
function initGame() {
  score = 0;
  speedMultiplier = 1;
  timeAlive = 0;
  shakeTime = 0;
  enemies = [];
  particles = [];
  roadMarks = [];
  pointerActive = false;
  enemySpawnTimer = 0;
  markSpawnTimer = 0;
  
  player = new Player();
  targetX = player.x;
  
  // Initial road marks
  for (let i = 0; i < 6; i++) {
    roadMarks.push(new RoadMark(i * 120));
  }
  
  document.getElementById('score-display').innerText = '0';
  document.getElementById('speed-display').innerText = '1.0';
  
  setState('PLAYING');
  
  if (audioUnlocked) {
    setBgmPlayback(true);
  }
}

function restartGame() {
  playSfx('restart');
  initGame();
}

function spawnEnemy() {
  enemies.push(new Enemy());
}

function explode(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function checkCollisions() {
  if (!player) return;
  const pw = player.w * 0.7; 
  const ph = player.h * 0.7;
  
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    
    if (Math.abs(player.x - e.x) < (pw + e.w * 0.7) / 2 &&
        Math.abs(player.y - e.y) < (ph + e.h * 0.7) / 2) {
      // CRASH
      explode(player.x, player.y, player.color);
      playSfx('crash');
      vibrate('heavy');
      shakeTime = 0.4;
      player = null; // Hide player
      setState('GAMEOVER');
      return;
    }
    
    if (!e.passed && e.y > player.y + player.h / 2) {
      e.passed = true;
      score += 10 * speedMultiplier;
      document.getElementById('score-display').innerText = Math.floor(score);
      playSfx('collect');
      if (Math.floor(score / 100) !== Math.floor((score - 10 * speedMultiplier) / 100)) {
        playSfx('rush');
        showFeedback('win', 'Combo Delivery');
      }
      vibrate('light');
    }
  }
}

/**
 * Main Loop
 */
function update(dt) {
  // Update road marks always
  for (let i = roadMarks.length - 1; i >= 0; i--) {
    roadMarks[i].update(dt);
    if (roadMarks[i].y > ch + 100) roadMarks.splice(i, 1);
  }
  markSpawnTimer -= dt;
  if (markSpawnTimer <= 0) {
    roadMarks.push(new RoadMark(-100));
    markSpawnTimer = 0.6 / speedMultiplier;
  }

  // Update particles always
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  if (shakeTime > 0) shakeTime -= dt;

  if (gameState !== 'PLAYING') return;

  timeAlive += dt;
  speedMultiplier = 1 + Math.min(timeAlive / 40, 2); 
  document.getElementById('speed-display').innerText = speedMultiplier.toFixed(1);
  
  score += 5 * speedMultiplier * dt;
  document.getElementById('score-display').innerText = Math.floor(score);

  if (player) player.update(dt);
  
  enemySpawnTimer -= dt;
  const spawnRate = Math.max(0.3, 1.2 - (speedMultiplier - 1) * 0.4);
  if (enemySpawnTimer <= 0) {
    spawnEnemy();
    enemySpawnTimer = spawnRate;
  }
  
  for (let i = enemies.length - 1; i >= 0; i--) {
    enemies[i].update(dt);
    if (enemies[i].y > ch + 100) {
      enemies.splice(i, 1);
    }
  }
  
  checkCollisions();
}

function draw() {
  // Clear background
  drawBackdrop();
  
  ctx.save();
  
  if (shakeTime > 0) {
    const mag = shakeTime * 25;
    const sx = (Math.random() - 0.5) * mag;
    const sy = (Math.random() - 0.5) * mag;
    ctx.translate(sx, sy);
  }
  
  for (const m of roadMarks) m.draw(ctx);
  for (const e of enemies) e.draw(ctx);
  if (player) player.draw(ctx);
  for (const p of particles) p.draw(ctx);
  
  ctx.restore();
}

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  
  dt = Math.min(dt, 0.05);
  
  try {
    if (initialized) {
      update(dt);
      draw();
    }
  } catch (e) {
    console.error("Loop error:", e);
  }
  
  animationFrameId = requestAnimationFrame(gameLoop);
}

function resize(entries) {
  for (let entry of entries) {
    const { width, height } = entry.contentRect;
    if (width === 0 || height === 0) continue;
    
    cw = width;
    ch = height;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
      initGame();
      initialized = true;
    } else {
      if (player) {
        player.y = ch - player.h - 60;
        player.x = Math.max(player.w, Math.min(cw - player.w, player.x));
      }
    }
  }
}

/**
 * Boot Sequence
 */
document.addEventListener('DOMContentLoaded', () => {
  parseConfig();
  initAudio();
  
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d', { alpha: false });
  
  /* [agent-note][stage4] repaired: mobile-actionability | element: canvas input routing | action: pointer suppression scoped off UI controls */
  canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointermove', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointercancel', handleGlobalInput, { passive: false });
  
  document.getElementById('restart-btn').addEventListener('click', () => {
    unlockAudio();
    restartGame();
  });
  
  ro = new ResizeObserver(resize);
  ro.observe(canvas);
  
  requestAnimationFrame(gameLoop);
});
</script>
</body>
